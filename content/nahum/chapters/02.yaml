chapter: 2
title: Where Is the Dwelling of the Lions?
tagline: Nahum watches Nineveh fall, from the attacker at the gates to the plunder carried off, and the Lord of hosts asks where the lions' den has gone.
when: 'After Assyria sacked Egyptian Thebes (about 660 B.C.) and before Nineveh fell (612 B.C.), probably near the end of that time.'

setting: |
  Chapter 2 is a poem of its own, a “taunt-song about Nineveh” and, in the Bible Dictionary's phrase, “a picture of the city’s fall.” Chapter 1 announced the judgment and turned back and forth between Nineveh and Judah ([[Nahum 1:11–14]]); here the prophet watches it happen. Who Nineveh was, and what Assyria had done to its neighbors, is told at [[Jonah 1:2]]; the empire's story is in [Two Kingdoms and Assyria](/old-testament/guides/two-kingdoms-and-assyria/#nations).

  The poem never names the attacker. History does. In 626 B.C. the Babylonians under Nabopolassar defeated an Assyrian army and declared their independence. The Medes (see [[Isa. 13:17]]) joined them, destroyed Asshur, Assyria's old capital, in 614, and two years later besieged Nineveh for three months, then “entered the city and razed it to the ground.” By 610 Assyria was gone. Nahum most likely spoke shortly before 612, so for Judah, still under Assyria's yoke ([[Nahum 1:13]]), the chapter was promise, not news.

  The Church's chapter heading calls the fall “a symbol of what will be in the latter days”; the `christ` section below takes that up.

thread: |
  **The city that filled its dens with the nations' prey is emptied, and the Lord asks where the lions have gone.**

  The poem moves like the siege it describes: the attacker comes and the assault begins (verses 1–4), the siege is laid and the defense fails (5–7), the people run (8), the plunder is carried off (9–10), and three closing verses turn Nineveh's rulers into a den of lions with no lions left in it (11–13).

  Verse 2 steps outside the battle, an aside in the middle of it: the Lord is restoring the majesty of Jacob, whom plunderers had “emptied out.” From there the chapter runs on reversal. The proud city is herself “empty, and void, and waste” (verse 10), the fate of the Israelites who were emptied out. The call to “take the spoil” (verse 9) is not a general's order but the Lord's, spoken through His prophet. And the lion that “filled his holes with prey” finally hears the Lord of hosts speak in His own voice, for the only time in the chapter: “Behold, I am against thee … I will cut off thy prey from the earth.”

sections:
  - range: 1-4
    heading: The attacker at the gates
    plain: |
      The one who shatters has come up against you, Nineveh. Guard the walls, watch the road, brace yourself, gather all your strength. (For the LORD is restoring the majesty of Jacob, the majesty of Israel, though plunderers have emptied them out and ruined their vine branches.) The shields of his warriors are red, his soldiers are dressed in scarlet; the chariots flash like fire on the day he musters them, and the cypress-wood spears are brandished. The chariots race madly through the streets and crowd one another in the squares; they look like torches and dart like lightning.
  - range: 5-7
    heading: The defense fails
    plain: |
      Nineveh's king calls up his nobles; they stumble as they go; they hurry to the wall, and the defense is set up. The gates on the rivers are opened, and the palace melts away. And Huzzab (a name, or perhaps the queen; the Hebrew may mean “it is decreed”) is carried off into exile, and her maids moan like doves and beat their breasts.
  - range: '8'
    heading: The people run
    plain: |
      Nineveh has been like a pool of water as long as she has stood, but now her people pour away. “Stop! Stop!” comes the cry, but no one turns back.
  - range: 9-10
    heading: The plunder
    plain: |
      Take the silver! Take the gold! There is no end to the treasure, the wealth of every precious thing. She is emptied, desolate, laid waste. Hearts melt, knees knock, every body is in anguish, and every face darkens with dread.
  - range: 11-13
    heading: The empty lions' den
    plain: |
      Where now is the lions' den, the feeding place of the young lions, where the lion and the old lion walked with the cub and nothing frightened them? The lion tore enough for his cubs and strangled prey for his lionesses, and filled his caves with prey and his dens with torn flesh. I am against you, says the LORD of hosts. I will burn your chariots to smoke, and the sword will devour your young lions; I will cut off your prey from the earth, and the voice of your messengers will be heard no more.

notes:
  - ref: 1
    phrase: He that dasheth in pieces is come up before thy face
    kind: history
    title: The attacker no one names
    body: |
      The chapter opens with an enemy at Nineveh's face and never says who he is. The Hebrew word, *mēphîṣ*, is a participle, and one modern translation reads “A scatterer has come up against you.” History supplies the name (Babylon and the Medes, as the setting says); the poem leaves him unnamed.

      Who is being spoken to has changed. Chapter 1 ended with a word to Judah ([[Nahum 1:15]]); verse 1 turns without warning to Nineveh, “a sudden change in the person addressed,” as chapter 1 turns between the two in [[Nahum 1:11–14]]. The four orders that follow (guard the walls, watch the road, brace yourself, gather your strength) are not mockery but “a poetical turn” on a single thought: Nineveh will do all of it and still “will not be able to repulse this enemy.”
    sources: [oshb-wlc, nrsvue, keil-nahum, rasmussen-nahum-1962]

  - ref: 2
    phrase: the LORD hath turned away the excellency of Jacob
    kind: words
    title: Turned away, or restored?
    body: |
      The King James sounds as if the Lord were taking Jacob's glory away; modern translations read the opposite. The verb is *šûb*, “turn back, return,” and the line becomes “the Lord is restoring the majesty of Jacob.” “Most scholars,” too, read it as “the Lord hath restored the excellency [or glory] of Jacob.” The plain-words section above follows that reading.

      Read that way, the verse is a word about Jacob set in the middle of the battle (one translation puts it in parentheses): the Lord is turning to restore the people whom “the emptiers have emptied” and whose vine branches they ruined.
    sources: [oshb-wlc, nrsvue, esv, breitenstein-nahum]

  - ref: 3
    phrase: the fir trees shall be terribly shaken
    kind: words
    title: Red shields and cypress spears
    body: |
      Verse 3 is the attacking army seen from the wall: red shields, soldiers in scarlet, chariots flashing like fire. One Latter-day Saint reading takes these as the Babylonian invaders, who “would wear red shields and scarlet attire”; the text itself does not say.

      The “fir trees” puzzle readers of the King James. The Hebrew is *habbᵉrōšîm*, the cypresses, and one modern translation takes them as spears of cypress wood: “the cypress spears are brandished.” Another follows the ancient Greek and Syriac translations instead and has “the chargers prance,” noting that the Hebrew has cypresses. Both make the line part of the picture of the army.
    sources: [breitenstein-nahum, oshb-wlc, esv, nrsvue]

  - ref: 6
    phrase: The gates of the rivers shall be opened
    kind: history
    title: The river gates
    body: |
      Nineveh was a city built with water. It stood where the Khosr River meets the Tigris, and its builders dammed the Khosr and cut a canal to fill the moats around the walls. What the “gates of the rivers” were is debated. One reading takes them as sluice gates, opened “to flood the palace grounds as a part of the siege.” Another rejects sluices and takes them as the gates in the wall that the rivers protected, “gates most strongly fortified, both by nature and art,” now standing open.

      The second line, “the palace shall be dissolved,” uses a verb that means to melt (*nāmôg*); a modern translation says the palace “melts away.” It may be figurative: the palace stands for those who live in it, dissolving “through anxiety and alarm.”
    sources: [breitenstein-nahum, keil-nahum, oshb-wlc, esv]

  - ref: 7
    phrase: Huzzab
    kind: words
    title: 'Huzzab: a name, a queen, or a decree?'
    body: |
      Huzzab may not be a name at all. The Hebrew *huṣṣab* is a verb form from *nāṣab*, “to stand, set, establish,” and could mean “it is fixed, determined,” though that sense is “very dubious; perhaps proper name, or epithet, of queen.” The translations divide accordingly: the King James makes it a name; the Church's footnote offers “the queen”; one modern translation has “It is decreed that the city be exiled”; another reads “its mistress” and notes that the meaning “is uncertain.” Some also take the figure as Nineveh herself, personified.

      The word decides who goes into exile. Read as a name or as the queen, a woman of rank is carried away and her maids follow, moaning like doves and beating their breasts; read as “it is decreed,” the city itself is exiled, “its slave women led away.”
    sources: [oshb-wlc, bdb, lds-scriptures, nrsvue, esv, breitenstein-nahum]

  - ref: 8
    phrase: Nineveh is of old like a pool of water
    kind: symbol
    title: A pool running dry
    body: |
      Nineveh had been a full pool for as long as she had stood, and now the water is running out. The Hebrew of the line is difficult; it reads literally something like “a pool, from the days that she has become.” Modern translations, following the ancient Greek, make the picture complete: “Nineveh is like a pool whose waters run away.” The meaning of the Hebrew “is uncertain,” but the King James's next words say what the water is: “yet they shall flee away.” The people are the water, and they are draining out of the city.

      The cry “Stand, stand” is a doubled command in the Hebrew (*ʿimdû ʿămōdû*), a call to halt the flight, and no one heeds it: “none shall look back.”
    sources: [nrsvue, esv, oshb-wlc]

  - ref: 10
    phrase: She is empty, and void, and waste
    kind: words
    title: Emptied, as she emptied others
    body: |
      Verse 10 opens with three Hebrew words that sound almost alike: *bûqāh ûmᵉbûqāh ûmᵉbullāqāh*, “emptiness and void and waste.” The King James keeps the meaning; a modern translation tries to keep the sound as well: “Devastation, desolation, and destruction!”

      The emptiness recalls verse 2, where “the emptiers have emptied” Jacob “out”: Nineveh receives “the same fate as the ancient Israelites who were ‘emptied . . . out, and marred.’” The verse then turns from the city to its people: melting hearts, knocking knees, anguish in every body.
    sources: [oshb-wlc, bdb, nrsvue, breitenstein-nahum]

  - ref: 10
    phrase: the faces of them all gather blackness
    kind: words
    title: Faces gathering blackness
    body: |
      “Gather blackness” is an idiom for dread. The Church's footnote calls it a “Hebrew idiom meaning ‘gloom,’” and a modern translation renders it with the opposite color, “all faces grow pale.” The sense is the same either way: faces drained by terror.

      A Latter-day Saint reading sees Assyria's own words turned back on it. The Succession Treaty of Esarhaddon, sent to Assyria's vassals, “including Judah, in around 672 BC,” cursed whoever broke it: “May they [the gods] make your skin and the skin of your women, your sons and your daughters—dark.” Nahum, on this reading, “appears to have alluded to this very curse in a ‘subversive reversal’ of the imagery, applying it to the fall of the Assyrian Empire itself.” The empire that threatened its vassals with darkened skin ends with darkened faces of its own. That reading is possible, not certain; the footnote's sense is the plain one.
    sources: [lds-scriptures, nrsvue, sc-knowhy-718]

  - ref: 11
    phrase: Where is the dwelling of the lions
    kind: symbol
    title: The lions’ den
    body: |
      The lions are Nineveh's kings and warriors, and the question is a taunt over their empty den. The poem ends “about the royalty of Nineveh, who are as a den of lions that are vanquished and destroyed.” “Where is the dwelling of the lions?” is like saying, “Where are those ferocious ones who once discomfited and attacked my people?”

      The lion, “as king of the beasts, is a very fitting emblem” of Assyria's rulers; the lionesses and young lions, on this reading, are the city's people. The lions walked “and none made them afraid”: “perfect rest and security, and undisturbed might.” The lion tore prey for his whelps and lionesses and “filled his holes with prey”: the rulers who “crushed the nations like lions, plundering their treasures, and bringing them together in Nineveh.” Verse 13 ends the hunt: “I will cut off thy prey from the earth.”
    sources: [rasmussen-nahum-1962, ot-manual-20, keil-nahum]

christ: |
  The voice that speaks at the end of the chapter, “Behold, I am against thee, saith the LORD of hosts” ([[Nahum 2:13]]), is Jehovah's, and Jehovah “is the premortal Jesus Christ.” Nahum shows Him doing two things at once: bringing down the city whose lions filled their dens with prey, and, as modern translations read verse 2, restoring the majesty of Jacob.

  Nineveh in this chapter stands for every “sinful, oppressive, worldly” power that the Lord “will ultimately bring down,” and the poem is told “in terms that typify the destruction of all evil.” What Nahum promised Judah under Assyria holds for a disciple now: no power that holds the Lord's people in fear is permanent, and the Lord who ends it is the Lord who restores His people.

explore: |
  - **The same city spared.** [[Jonah 3:5–10]] tells how Nineveh repented and was spared a century earlier; [[Jonah 4:11]] ends that book with the Lord's question about the city.
  - **The woe that follows.** [[Nahum 3:1–7]] turns from the siege to the reasons for it, “the bloody city.”
  - **Another prophet on Nineveh's ruin.** [[Zeph. 2:13–15]] foresees the same city as “a desolation, and dry like a wilderness.”

