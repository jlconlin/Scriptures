chapter: 1
title: 'The LORD Is Good, a Strong Hold'
tagline: A hymn to the Lord who is slow to anger and great in power, then an oracle that turns between Nineveh and Judah. The oppressor will be cut off, Judah's yoke broken, and a messenger comes over the mountains with news of peace.
when: 'After Assyria sacked Egyptian Thebes (about 660 B.C.) and before Nineveh fell (612 B.C.), probably near the end of that time.'

setting: |
  Nahum prophesied against Nineveh, the capital of the Assyrian Empire, which had conquered the northern kingdom of Israel in 722 B.C. and carried many of its people into exile. It speaks of the fall of Egyptian Thebes, taken by the Assyrians about 660 B.C., as already past ([[Nahum 3:8–10]]), and of Nineveh's fall as still to come, and the prophecies most likely come from the years just before Nineveh fell in 612 B.C. By then the empire was coming apart. Babylon declared its independence in 626 B.C.; the Medes and the Babylonians destroyed the old capital, Asshur, in 614; and two years later they besieged Nineveh “for three months, after which they entered the city and razed it to the ground.”

  This is the city that had repented at Jonah's preaching more than a century earlier and been spared ([[Jonah 3:10]]). The people of Nahum's day were not the people who had repented, and they had returned to their wickedness. What Nineveh was, and how Assyria treated those it conquered, is told at [[Jonah 1:2]].

  The Church reads the book beyond its own day. The prophet “used Nineveh as a symbol of sinful, oppressive, worldly powers that the Lord will ultimately bring down,” and the chapter heading reads chapter 1 of the burning of the earth at the Second Coming (see the note on verse 5).

thread: |
  **The Lord who is slow to anger will not acquit the oppressor, and His people will keep their feasts again.**

  The chapter is a hymn, an oracle and a herald. Verses 2–10 have been described as an acrostic, “one strophe (stanza) for each of the first fifteen letters of the Hebrew alphabet, with two alterations of the sequence” (Psalm 9 uses the same device; see the note on [[Ps. 9:1]]). The hymn sings the Lord's power over nature and over His enemies, and twice the song of power breaks off to speak of His goodness: at verse 3, where the LORD is “slow to anger,” and at verse 7, where He is “a strong hold in the day of trouble.” Verse 10 sums up the hymn and turns toward Nineveh.

  Verses 11–14 speak by turns to Assyria and to Judah, “the one is to be punished and the other to be redeemed.” Assyria's counsellor will be cut off, its name will not be carried on, and its grave is made ready; Judah's affliction will not come again, and its yoke will be broken. Then verse 15 brings the news over the mountains. In the Hebrew Bible that verse is the first verse of chapter 2, so it also opens the next poem, the fall of the city itself.

  That is the comfort Nahum's name promises. A people under the yoke of the empire that had destroyed their northern kin “would have indeed found some hope and comfort in the prophet's assurance that their oppressors would eventually be destroyed.”

sections:
  - range: 1-1
    heading: The heading
    plain: |
      An oracle about Nineveh: the book of the vision of Nahum, from Elkosh.
  - range: 2-10
    heading: The jealous and patient Lord
    plain: |
      The LORD is a jealous God, and He avenges; the LORD avenges and is full of wrath. He takes vengeance on His adversaries and keeps His anger for His enemies. The LORD is slow to anger and great in power, and He will by no means let the guilty go unpunished. His way is in the whirlwind and the storm, and the clouds are the dust under His feet. He rebukes the sea and dries it up, and makes every river run dry; Bashan and Carmel wither, and the blossom of Lebanon fades. The mountains quake before Him and the hills melt; the earth is burned at His presence, the world and everyone who lives in it. Who can stand before His indignation? Who can endure the heat of His anger? His fury pours out like fire, and the rocks are shattered before Him. The LORD is good, a fortress in the day of trouble, and He knows those who take refuge in Him. But with an overwhelming flood He will put an end to her place, and darkness will pursue His enemies. What are you plotting against the LORD? He will make a full end; trouble will not rise a second time. Though they are tangled like thorns and drunk like drunkards, they will be burned up like dry stubble.
  - range: 11-14
    heading: Nineveh and Judah by turns
    plain: |
      Out of you, Nineveh, has come one who plots evil against the LORD, a counsellor of worthlessness. This is what the LORD says: Though they are at full strength and many, they will be cut down and pass away. And to you, Judah: though I have afflicted you, I will not afflict you again. Now I will break his yoke off you and snap your chains. And to you, Assyria, the LORD has given His command: your name will not be carried on. I will cut off the carved idols and the cast images from the house of your gods. I will make your grave, for you are worthless.
  - range: 15-15
    heading: The messenger on the mountains
    plain: |
      Look: on the mountains are the feet of a messenger who brings good news and announces peace. Judah, keep your festivals and fulfill your vows, for the wicked one will never again invade you; he is completely cut off.

notes:
  - ref: 1
    phrase: Nahum the Elkoshite
    kind: history
    title: The comforter from Elkosh
    body: |
      Nahum's name is part of his message. It is “derived from the Hebrew root nâcham, which means to pity, to be sorry, to comfort, or to be comforted,” and it means “Consoler.” The comfort was Judah's: the assurance that the empire which had oppressed it would fall (see the notes on verses 13 and 15).

      “The Elkoshite” names his town. He was a “native of Elkosh in Galilee,” and so a prophet “of Galilee.”

      The rest of the heading is explained elsewhere on the site: a “burden” is a prophet's oracle (see “What is a ‘burden’?” at [[Isa. 13:1]]), and “vision” is the word that also heads Obadiah ([[Obad. 1:1]]).
    sources: [ball-prophets-names, bd-nahum, gs-nahum]

  - ref: 2
    phrase: God is jealous, and the LORD revengeth
    kind: words
    title: A jealous God who avenges
    body: |
      The hymn opens with the Lord's own words from the Ten Commandments, “a jealous God” ([[Ex. 20:5]]); the note on the word there explains that the word means the fervor of a covenant, not envy. The Hebrew word “identifies the strong feelings aroused when a cherished object or relationship is threatened,” and it cuts two ways. It moves God “to cherish and protect,” and it “forms the basis of his demand for repentance or retribution when he is offended.” In Nahum both edges show at once: the jealousy that protects Judah is the jealousy that condemns its oppressor. So “the jealousy of God is the guarantee of justice.”

      The verse says three ways that the LORD avenges, and it names whom: “his adversaries” and “his enemies.” Chapter 1 shows “the avenging God, executing judgment on the oppressors of His people.” The vengeance is His alone, as He claimed it in the song of Moses (see “Vengeance belongs to the LORD” at [[Deut. 32:35]]), and Paul drew from that claim the command not to take it: “avenge not yourselves” ([[Rom. 12:19]]). What the verse gave a small, subject people was a testimony that though their nation “was militarily feeble and unthreatening, the God of Israel was still God of all the earth.”
    sources: [draper-sexual-purity, bd-nahum, vandyke-ogden-twelve, lds-scriptures]

  - ref: 3
    phrase: The LORD is slow to anger, and great in power, and will not at all acquit the wicked
    kind: scripture
    title: Slow to anger, and not acquitting
    body: |
      Verse 3 takes up the name the LORD proclaimed to Moses after the golden calf, “merciful and gracious, longsuffering” ([[Ex. 34:6]]), and the end of that sentence, “that will by no means clear the guilty” ([[Ex. 34:7]]); the Church's footnote on “wicked” points there. When Jonah complained that the Lord had spared Nineveh, he quoted only the first half: “for I knew that thou art a gracious God, and merciful, slow to anger, and of great kindness, and repentest thee of the evil” ([[Jonah 4:2]]; see the note there on why Jonah fled). Nahum, speaking of the same city, keeps “slow to anger” and adds the clause Jonah left out.

      The two books belong together. The Lord spared Nineveh when it repented; by Nahum's time its people “had returned to their wickedness.” God “either restrains his wrath in patience and grace or destroys his enemies with an overrunning flood of judgment,” and the same city met both: “the mercy of God to Assyria” in Jonah and “the judgment of God upon Assyria” in Nahum. In the hymn's alphabet this half-verse is where the account of His power breaks off “to tell of His goodness and justice,” both together. Mercy does not cancel justice in this book, and justice does not “rob His mercy.”
    sources: [lds-scriptures, scripture-helps-micah, draper-sexual-purity, rasmussen-nahum-1962]

  - ref: 5
    phrase: the earth is burned at his presence
    kind: symbol
    title: The earth burned at His presence
    body: |
      Verses 3–6 describe the Lord's coming as storm and earthquake: whirlwind and cloud, the sea dried up, Bashan, Carmel and Lebanon withering, mountains quaking and hills melting. The Church's footnote on “melt” points to a psalm of the Lord's reign: “The hills melted like wax at the presence of the LORD” ([[Ps. 97:5]]). These verses set out “God's power over nature and over His enemies.” Where the King James has the earth “burned,” modern translations read “the earth heaves before him”; the fire comes in verse 6, where “his fury is poured out like fire.”

      The Church's chapter heading reads the chapter also of “the burning of the earth at the Second Coming.” Nahum “employed imagery usually associated with the Savior's Second Coming to depict Assyria's future devastation,” an example of “the prophetic dualism so common in the Old Testament.” On that reading Nineveh's fall “stands as a symbol of the hopeless condition of the wicked at the time of the Second Coming.”
    sources: [lds-scriptures, rasmussen-nahum-1962, ot-manual-20, vandyke-ogden-twelve]

  - ref: 7
    phrase: a strong hold in the day of trouble; and he knoweth them that trust in him
    kind: words
    title: A refuge for those who take refuge
    body: |
      Verse 7 answers the question of verse 6, “Who can stand before his indignation?” The message of the whole book has been said to turn on that question, “Who can stand in the presence of the Lord?” and the answer comes in the middle of the storm: the LORD is good to those who shelter in Him. In the hymn's alphabet this is the second place where the song of power stops to tell of “His goodness and His mercy to those who take refuge in Him.”

      The “strong hold” is *māʿôz*, “a fortified place,” and in this verse it is used “of God … as refuge.” “Them that trust in him” belongs to the same picture: the verb is *ḥāsâ*, to “seek refuge,” and a modern translation reads “he protects those who take refuge in him.” The LORD is the fortress, and those who trust Him are the people who have fled inside its walls.
    sources: [vandyke-ogden-twelve, rasmussen-nahum-1962, bdb, oshb-wlc, nrsvue]

  - ref: 8
    phrase: with an overrunning flood he will make an utter end of the place thereof
    kind: symbol
    title: The flood turned on Assyria
    body: |
      Assyria pictured its own conquests as a flood. In Assyrian texts the king advancing into battle is likened to raging water, the *abubu*, a “‘flood,’ recalling the primeval Flood,” and Isaiah used the same picture for the king of Assyria overflowing Judah ([[Isa. 8:7–8]]). Nahum “subverts the ‘flood’ trope”: now the flood comes on Assyria. The overflowing flood is a figure for “the judgment sweeping over a land or kingdom, through the invasion of hostile armies.”

      “The place thereof” is in Hebrew “her place,” and “her” is Nineveh, named in the heading and not again until the next chapter. The end will be so complete that “the place where it stood would cease to be the site of a city.”
    sources: [uriona-assyria, keil-nahum, oshb-wlc]

  - ref: 11
    phrase: that imagineth evil against the LORD, a wicked counsellor
    kind: history
    title: The counsellor of worthlessness
    body: |
      The verse names no one. “Out of thee” is said to Nineveh, and the one who came out of it plots evil against the LORD Himself. That plotting has been read as the Assyrian design “to destroy the kingdom of God in Israel,” the boast Isaiah records from the Assyrian officer at Jerusalem's walls: “Neither let Hezekiah make you trust in the LORD” ([[Isa. 36:15]]). Whether Nahum meant one king or the empire as a whole, the text does not say. From here to verse 14 the oracle speaks to “Assyria and Judah … alternately,” so each “thee” has to be read by who is meant.

      “Wicked counsellor” is literally “one who counsels *bĕliyyaʿal*,” the word behind the name Belial (see “The children of Belial” at [[Deut. 13:13]]). It means “worthlessness,” a compound of “not” and “worth, use, profit.” The same word returns in verse 15 as “the wicked” who “shall no more pass through thee,” rendered there “the worthless one”: the one who counselled worthlessness is the one “utterly cut off.”
    sources: [oshb-wlc, keil-nahum, bdb, rasmussen-nahum-1962, lds-scriptures]

  - ref: 12
    phrase: Though they be quiet, and likewise many
    kind: words
    title: At full strength, and still cut down
    body: |
      “Quiet” is the King James's rendering of a hard word. The Hebrew *shĕlēmîm* means “complete, safe, at peace,” and this verse is listed under “full,” used “of army,” with the warning “text corrupt”: the Hebrew here may have been miscopied. Modern translations read “Though they are at full strength and many”: Assyria's army is whole and numerous, and it will be cut down anyway. The verb is one “taken from the mowing of the meadows.”

      In the same verse the Lord turns to Judah: “Though I have afflicted thee, I will afflict thee no more.” The affliction is “the oppression which Judah had suffered from the Assyrians,” and the promise repeats verse 9, “affliction shall not rise up the second time.”
    sources: [bdb, nrsvue, keil-nahum]

  - ref: 13
    phrase: For now will I break his yoke from off thee
    kind: symbol
    title: Assyria's yoke
    body: |
      The yoke was Assyria's own word for its rule. It was “one of the most common Assyrian metaphors,” a “symbol to depict Assyrian suzerainty,” and it “is distinctly Assyrian; it occurs rarely in the literature of other ancient Near Eastern nations.” Assyrian records speak of the king laying “the yoke of his overlordship” on the peoples he conquered. The metaphor “most typically appears in the Bible when referring to Assyria or warning that another nation would conquer Judah,” and these verses are one of the examples. The Lord promises to break the yoke the empire boasted of laying on, and to “burst thy bonds in sunder.”
    sources: [uriona-assyria, sc-knowhy-711]

  - ref: 14
    phrase: I will make thy grave; for thou art vile
    kind: words
    title: A grave for the worthless
    body: |
      Verse 14 turns back to Assyria (the Hebrew “thee” is now masculine), and its sentence has three parts: no one to carry on its name (a modern translation reads “Your name shall be perpetuated no longer”), no idols left in the house of its gods, and a grave the Lord Himself makes ready. “Vile” translates *qallôtā*, from a verb that means “be slight, swift, trifling (probably originally be light)”; modern translations read “for you are worthless.” The root probably first meant “be light,” and the sentence on the empire, for all its armies, is that it counts for nothing.
    sources: [oshb-wlc, bdb, nrsvue, rasmussen-nahum-1962]

  - ref: 15
    phrase: Behold upon the mountains the feet of him that bringeth good tidings, that publisheth peace!
    kind: christ
    title: The feet upon the mountains
    body: |
      The picture is a messenger coming over the hills to Judah with good news. His news is “peace,” and the verse says what it means for Judah: its festivals and vows can be kept again, “for the wicked shall no more pass through thee.” Nahum “invites Judah to rejoice in the destruction of Assyria and claim the opportunity to cleanse the temple and worship God freely through prescribed feasts and vows.” The verse has also been read as “speaking of a peaceful age in terms that seem to herald the Messianic age when all oppressors shall have ceased.”

      Isaiah opens a verse with nearly the same words, for the herald who tells Zion “Thy God reigneth” ([[Isa. 52:7]]). The note there, “Abinadi and the beautiful feet,” shows how Paul applied the words to those who preach ([[Rom. 10:15]]) and how Abinadi read them at last of “the founder of peace, yea, even the Lord, who has redeemed his people” ([[Mosiah 15:18]]; see the note there). The Church's footnote on “feet” sends the reader to the same passages. In Nahum the good news is a fallen oppressor and a people free to worship; in Abinadi's reading the one who brings peace is the Redeemer.
    sources: [vandyke-ogden-twelve, rasmussen-nahum-1962, lds-scriptures]

christ: |
  The hymn's Lord is the one whose patience and justice stand together, and the feet upon the mountains are, in Abinadi's reading, finally His (see the note on verse 15). Alma taught that “God himself atoneth for the sins of the world … that God might be a perfect, just God, and a merciful God also” ([[Alma 42:15]]). The oppressor who refuses that patience meets that justice, and whoever takes refuge in Him finds the stronghold of verse 7.

  For a disciple the stronghold is Christ. Those who build “upon the rock of our Redeemer, who is Christ, the Son of God,” stand when the storm comes, for “it shall have no power over you” ([[Hel. 5:12]]).

