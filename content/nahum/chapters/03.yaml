chapter: 3
title: Woe to the Bloody City
tagline: Nahum’s last poem names Nineveh’s crimes, sentences the city to public shame, holds up Egyptian Thebes as proof that no stronghold is safe, mocks its defenses, and ends with an epitaph and a question.
when: 'After Assyria sacked Egyptian Thebes (about 660 B.C.) and before Nineveh fell (612 B.C.), probably near the end of that time'

setting: |
  After the siege and plunder of chapter 2, Nahum’s last poem opens with a woe on “the bloody city” and says why it falls and why nothing will save it. Nineveh was the capital of Assyria, whose city and cruelty are described at [[Jonah 1:2]]. Its kings boasted in their own records “of the captives they have maimed, the realms they have subjected and the treasures they have confiscated.”

  The poem speaks of Thebes’ fall as past (verses 8–10) and of Nineveh’s as still to come. Nineveh did fall. The Medes and the Babylonians took Asshur, Assyria’s old capital, in 614 B.C.; two years later they besieged Nineveh, and by 610 B.C. “Assyria had vanished.” Zephaniah also foretold that the Lord would “make Nineveh a desolation” ([[Zeph. 2:13]]).

thread: |
  The poem is a judgment delivered in five movements. It opens on the crimes, blood, lies, plunder and the harlot’s trade in nations (verses 1–4); then the city is made loathsome (verses 5–7); it will fall like every other city that was strong and wicked (verses 8–11); its defenses will fail when its leaders flee like locusts (verses 12–17); and the epitaph closes it (verses 18–19).

  The hinge is the question of verse 8: *Art thou better than populous No?* Thebes had water for walls and Egypt and Cush for allies, and it fell. Everything after it applies that one example to Nineveh. The commands of verse 14 (draw water, fortify, tread the clay) are answered at once by verse 15: “There shall the fire devour thee.” The poem never turns to hope: “For Nineveh, there was no hope.”

  Jonah ends with the Lord asking, “should not I spare Nineveh, that great city” ([[Jonah 4:11]]); Nahum ends on a question too, asking the king of Assyria whom his wickedness has not touched.

sections:
  - range: 1-4
    heading: The charge
    plain: |
      Woe to the city of bloodshed! It is full of deceit and plunder, and there is no end to the prey it takes. Listen: the crack of the whip, the rumble of wheels, galloping horses and bounding chariots! Horsemen charge with flashing sword and glittering spear; the slain lie in heaps, corpses without end, and men stumble over the bodies. All this because of the countless harlotries of the alluring harlot, the mistress of sorcery, who sells nations into slavery by her harlotries and whole peoples by her sorceries.
  - range: 5-7
    heading: The city put to shame
    plain: |
      “I am against you,” says the LORD of hosts. “I will lift your skirts over your face and show the nations your nakedness and the kingdoms your shame. I will throw filth on you, treat you with contempt, and make you a spectacle.” Everyone who sees you will shrink back and say, “Nineveh is laid waste; who will mourn for her?” Where could I find anyone to comfort you?
  - range: 8-11
    heading: No better than Thebes
    plain: |
      Are you better than Thebes, which sat among the rivers with water all around her, the river her rampart and the water her wall? Cush and Egypt were her strength, without limit; Put and the Libyans were her allies. Yet she went into exile and captivity. Her infants were dashed to pieces at the head of every street, lots were cast for her nobles, and all her great men were bound in chains. You too will be made drunk and will vanish; you too will look for a refuge from the enemy.
  - range: 12-17
    heading: Defenses that will not hold
    plain: |
      All your fortresses are like fig trees with first-ripe figs: shake them and the figs fall into the mouth of whoever eats. Look, your troops are like women within you; the gates of your land stand wide open to your enemies, and fire has eaten the bars of your gates. Draw water for the siege, strengthen your forts, trample the clay, tread the mortar, repair the brick kiln! There the fire will devour you and the sword will cut you down; it will eat you up as locusts eat. Multiply like the locust, multiply like the grasshopper! You made your merchants more numerous than the stars of heaven, but the locust strips the land and flies away. Your officials are like locusts and your captains like swarms of grasshoppers that settle on the walls on a cold day; when the sun rises they fly off, and no one knows where they have gone.
  - range: 18-19
    heading: The epitaph
    plain: |
      Your shepherds sleep, O king of Assyria; your nobles lie down in the dust. Your people are scattered on the mountains, and no one gathers them. There is no remedy for your break; your wound is mortal. All who hear the news of you clap their hands over you, for who has not felt your endless cruelty?

notes:
  - ref: 1
    phrase: Woe to the bloody city!
    kind: symbol
    title: City of blood, lies and plunder
    body: |
      The opening line is the charge: “It is all full of lies and robbery.” The name “bloody city” is the name Ezekiel gives Jerusalem when he catalogs its sins, and the note at [[Ezek. 22:2]] explains it and quotes this verse. A modern translation brings out the rest of the line: “utterly deceitful, full of plunder—no end to the prey!”

      Verses 2–3 then show what the charge brings on the city: “Nineveh’s attackers would be fierce,” with whip, chariot, sword and spear, and the slain without number in its own streets.
    sources: [breitenstein-nahum, nrsvue, lds-scriptures]

  - ref: 4
    phrase: the mistress of witchcrafts, that selleth nations through her whoredoms
    kind: symbol
    title: The harlot who sells nations
    body: |
      The harlot is Nineveh as an empire, and her trade is in peoples: a modern translation renders the line “who enslaves nations through her debaucheries and peoples through her sorcery.”

      The charge goes beyond Nineveh’s own sins: “she not only turned to wickedness herself but exported that wickedness to many others through her power and influence.” Her whoredoms and witchcrafts stand beside the merchants of verse 16 as marks of a city “immersed in worldly power, witchcraft, whoredoms, and the supposed merits of materialism.”
    sources: [ot-manual-20, nrsvue, vandyke-ogden-twelve]

  - ref: 5
    phrase: I will discover thy skirts upon thy face
    kind: symbol
    title: Shame for shame
    body: |
      The sentence answers the charge in kind. Nineveh acted the harlot before the nations, so “the punishment of Nineveh will correspond to her conduct”: she is exposed before those same nations. The Lord says the same words to Jerusalem, “discover thy skirts upon thy face” ([[Jer. 13:26]]; the note “Skirts discovered” at [[Jer. 13:22]] explains the image), and uses the uncovering of shame of Babylon in [[Isa. 47:3]]. It is a picture of disgrace and is not described further here.

      Verse 6 carries it on. Throwing filth on someone is “a figurative expression for the most ignominious treatment or greatest contempt,” and “gazingstock” means a spectacle. Verse 7 ends the sentence with no mourner: no one will pity the city, “because its fate is so well deserved.” The same words are used of Jerusalem in her ruin: “who shall be sorry for thee? … by whom shall I comfort thee?” ([[Isa. 51:19]]).
    sources: [keil-nahum, nrsvue, lds-scriptures]

  - ref: 8
    phrase: Art thou better than populous No
    kind: history
    title: Thebes, the precedent
    body: |
      Nahum’s question sets Nineveh beside a city that Assyria itself had destroyed. No is Thebes, the “capital of Upper Egypt, taken by Assurbanipal about 660 B.C.,” and Assurbanipal was “king of Assyria.” The name and its god are explained at [[Jer. 46:25]].

      The argument runs on Thebes’ defenses. The city sat by the Nile “with water around her, her rampart a sea, water her wall,” and Cush, Egypt, Put and the Libyans stood behind it. “Neither of the allies of Thebes, Ethiopia or Libya, had been able to protect her. Nineveh, too, would ‘seek strength’ in allies and find none” (verse 11). Verse 10 lists what was done to Thebes; the notes at [[Isa. 20:4]] and [[Joel 3:3]] explain how captives were led away and shared out by lot.

      The verse also helps date the book. Nahum looks “both backward and forward in time,” back to Thebes’ fall and forward to Nineveh’s, so his ministry was “probably sometime between those two dates.”
    sources: [bd-no, ot-manual-20, nrsvue, breitenstein-nahum]

  - ref: 11
    phrase: 'Thou also shalt be drunken: thou shalt be hid'
    kind: symbol
    title: Drunk and hidden
    body: |
      Nineveh’s drunkenness comes from the cup of the Lord’s wrath. It is “from the goblet of divine wrath, as at Obadiah 1:16,” where the nations “shall drink … and they shall be as though they had not been” ([[Obad. 1:16]]). The note on that verse and the theme page [The Cup of the Lord’s Fury](/jeremiah/themes/cup-of-fury/) follow the image.

      “Thou shalt be hid” may mean that the city goes into hiding, as a modern translation reads it. An older reading takes it as vanishing, since in Hebrew idiom being hidden can mean being gone: “Thou wilt vanish away as if thou hadst never been; the Hebrews frequently using the expression being hidden for being reduced to nothing.” Nineveh will seek refuge from the enemy “in vain, or without finding it.”
    sources: [keil-nahum, nrsvue, lds-scriptures]

  - ref: 12
    phrase: like fig trees with the firstripe figs
    kind: symbol
    title: Ripe figs and troops like women
    body: |
      The figs and the troops of verses 12–13 show how easily the city will be taken. The forts are fig trees with the first ripe fruit: shake them and the figs drop into the mouth of whoever is waiting, so the strongholds “would easily fall into the grasp of the enemy.”

      The troops are “women in your midst,” as a modern translation puts it. Jeremiah’s oracle on Babylon spells out the same image: “their might hath failed; they became as women” ([[Jer. 51:30]]). Then the gates stand open and fire eats the bars.
    sources: [breitenstein-nahum, nrsvue, lds-scriptures]

  - ref: 17
    phrase: Thy crowned are as the locusts
    kind: words
    title: Who are the crowned?
    body: |
      No one knows exactly who “thy crowned” are. The Hebrew word occurs only here, and its form is “dubious”: it may mean “consecrated (i.e. anointed) ones, princes,” and one proposal reads “thy crowned ones,” the King James sense; it has also been left untranslated. Other renderings are “your guards” and, for the captains, “your scribes.”

      The image is plainer than the word. The swarm settles in the hedges on a cold day, and when the sun rises it is gone, and “no one knows where they have gone.”
    sources: [bdb, nrsvue]

  - ref: 18
    phrase: Thy shepherds slumber, O king of Assyria
    kind: words
    title: Shepherds asleep
    body: |
      The shepherds’ sleep is read either as negligence or as death. The verb, *nûm*, means “be drowsy, slumber,” and this verse is counted among its figurative uses, “of inactivity, indolence.” Another reading takes it as the sleep of death: the word here “is not a figurative expression for carelessness and inactivity,” but the sleep of death, and the verb of the next line, “thy nobles shall dwell in the dust,” is likewise “used here of the rest of death.”

      On either reading the outcome is the same, and it is the end of a kingdom. The king of Assyria here is “a rhetorical personification of the holder of the imperial power,” not one named ruler. Its princes are the shepherds, and with them gone “the flock (i.e., the Assyrian people) is scattered upon the mountains and perishes, because no one gathers it together.”
    sources: [bdb, oshb-wlc, keil-nahum, nrsvue]

  - ref: 19
    phrase: for upon whom hath not thy wickedness passed continually?
    kind: symbol
    title: No healing, and the clapping
    body: |
      The last verse is the epitaph. “No healing” means no recovery: “unlike Israel, Nineveh would never enjoy a restoration.” Those who hear the news clap their hands, and the verse’s own last line gives the reason, which a modern translation renders, “For who has ever escaped your endless cruelty?” The book ends on the question of verse 19 (see the thread for Jonah’s last question beside it).
    sources: [nrsvue, vandyke-ogden-twelve]

christ: |
  “The LORD of hosts” who says to Nineveh, “Behold, I am against thee” (verse 5), is in Hebrew *YHWH ṣᵉbāʾôt*, Jehovah of hosts, and Jesus Christ “was the Great Jehovah of the Old Testament, the Messiah of the New.” Nineveh stands in the book for the sinful, oppressive, worldly powers the Lord will bring down.

  The cruelty no one escaped in verse 19 does not outlast the Lord’s judgment. A disciple who lives under such a power, or is wronged by one, is not forgotten: every power that sells nations and lives on plunder answers to Christ, and He is to His people now what He was to Judah: “The LORD is good, a strong hold in the day of trouble; and he knoweth them that trust in him” ([[Nahum 1:7]]).

explore: |
  - **Nineveh’s fall foretold by another prophet.** [[Zeph. 2:13–15]], where every passer-by of the ruined city “shall hiss, and wag his hand.”
  - **Babylon shamed in the same terms.** [[Isa. 47:1–5]].
  - **Nineveh becomes Babylon.** [[Rev. 18:1–3]]. Some of Nahum’s language for Nineveh returns in John’s fallen Babylon, which one reading takes as a sign “that the fate of Nineveh is being transferred to another nation that threatens Israel.”
  - **Nineveh and Nephi’s vision.** Nephi’s vision of the great and abominable church ([[1 Ne. 13:5–9]]) has been read against the Assyrian Empire, with “surprising parallels” between the two.
  - **The other ending.** [[Jonah 4:10–11]].

