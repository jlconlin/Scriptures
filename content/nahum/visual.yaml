alt: A pale stone fortress with square towers and an open arched gate stands on a rocky hilltop in golden sunrise light. A pale road comes over a ridge on the left, where the sun is rising, and winds down to the gate above a hazy valley of fields. In the foreground a wooden beam lies broken in two on the rock, with ropes knotted around the pieces.
