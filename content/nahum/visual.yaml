summary: >-
  Nahum is the burden of Nineveh, but its comfort is for Judah: the Lord is slow to anger
  and will not acquit the oppressor, and He is good, a strong hold in the day of trouble to
  those who trust Him. The image keeps to that comfort and leaves the fall of the city out
  of sight. A stone refuge stands in the light on a height, a broken yoke lies in the
  foreground, and a road comes over the mountains with the news that peace is published.
motifs:
  - "A stone stronghold on a height (Nahum 1:7): the largest form in the picture, a fortress of pale limestone with square towers and thick walls on a rocky hilltop right of center. Its arched gate stands open, one wooden door swung back, and the morning light rests gold on its walls."
  - "A broken yoke (Nahum 1:13): in the near foreground at the lower left, on bare rock, a wooden beam broken in two, the pieces lying end to end with ropes still knotted around them."
  - "A road over the mountains (Nahum 1:15): a pale track that comes over the crest of a ridge on the left, where the sun is rising, and winds down and across to the fortress gate, with no one on it."
composition: >-
  A wide landscape at sunrise, seen from a rocky outcrop. The fortress stands right of
  center on its height, above slopes of pale rock, scrub and cypresses. The sun rises
  over the ridge at the upper left, where the road crests, and the road runs down in a
  long curve to the gate, so the eye is led from the brightest part of the sky to the
  refuge. A broad valley of fields lies in haze far below at the left. The broken beam
  and its ropes lie on the rock in the lower left foreground. No city, no ruins, no fire,
  no weapons, no figures, and no animals.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The fortress with its gate open** is the Lord Himself as a refuge for those who take refuge in Him: “The LORD is good, a strong hold in the day of trouble; and he knoweth them that trust in him” ([[Nahum 1:7]]).'
  - '**The road coming over the ridge** is the way of the messenger who brings the news of peace: “Behold upon the mountains the feet of him that bringeth good tidings, that publisheth peace!” ([[Nahum 1:15]]).'
  - '**The broken timber and loose ropes** in the foreground are Assyria’s yoke on Judah, broken: “For now will I break his yoke from off thee, and will burst thy bonds in sunder” ([[Nahum 1:13]]).'
