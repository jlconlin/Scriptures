chapter: 1
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Thebes was taken by Assurbanipal about 660 B.C.; the prophecy was written after that'
    key: bd-nahum
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nahum?lang=eng'
    quote: 'The prophecy was probably written between the fall of Nineveh, 606 B.C., and that of No-amon (Nahum 3:8) or Thebes, in Upper Egypt, taken by Assurbanipal about 660 B.C.'
  - where: 'when'
    claim: 'The prophecies likely date just before Nineveh fell in 612 BC'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Nahum’s prophecies likely date to the period just before Nineveh’s fall in 612 BC.'

  # ---- setting ----
  - where: 'setting'
    claim: 'Nineveh was the capital of the Assyrian Empire, which conquered the northern kingdom in 722 BC and exiled many; the prophecies likely date just before 612'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Nahum was a prophet who prophesied against Nineveh, the capital of the Assyrian Empire. In 722 BC, the Assyrians had conquered the Northern Kingdom of Israel and eventually exiled many of its inhabitants. Nahum’s prophecies likely date to the period just before Nineveh’s fall in 612 BC.'
  - where: 'setting'
    claim: 'Nahum’s Nineveh was not the people who repented under Jonah; they had returned to wickedness; Nineveh a symbol of worldly powers'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'The people of Nineveh in Nahum’s day were not the same people who had repented of their sins after Jonah preached in Nineveh more than a century earlier. By Nahum’s time, the people of Nineveh had returned to their wickedness. The prophet used Nineveh as a symbol of sinful, oppressive, worldly powers that the Lord will ultimately bring down.'
  - where: 'setting'
    claim: 'Thebes taken about 660 B.C.'
    key: bd-nahum
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nahum?lang=eng'
    quote: 'that of No-amon (Nahum 3:8) or Thebes, in Upper Egypt, taken by Assurbanipal about 660 B.C.'
  - where: 'setting'
    claim: 'Babylon’s revolt in 626 BC'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Then, in 626 BC, the Babylonians, under the command of Nabopolassar (lived 626–605 BC and was the father of Nebuchadnezzar), defeated Assyrian forces outside Babylon and declared their independence.'
  - where: 'setting'
    claim: 'Medes and Babylonians destroyed Asshur in 614 and two years later besieged and razed Nineveh'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Ultimately, the Medes joined the Babylonians and destroyed Asshur (Assyria’s ancient capital) in 614 BC. Two years later they laid siege to Nineveh (the then-current capital) for three months, after which they entered the city and razed it to the ground.'
  - where: 'setting'
    claim: 'The chapter heading reads chapter 1 of the burning of the earth at the Second Coming'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/nahum/1?lang=eng'
    quote: 'Nahum speaks of the burning of the earth at the Second Coming and of the mercy and power of the Lord.'
  - where: 'setting'
    claim: 'The Guide reads chapter 2 as a foreshadowing of the latter days'
    key: gs-nahum
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/nahum?lang=eng'
    quote: 'Chapter 2 tells of Nineveh’s destruction, which is a foreshadowing of what will come in the latter days.'

  # ---- thread ----
  - where: 'thread'
    claim: 'Verses 2–10 are an acrostic on the first fifteen letters, altered twice; the first half on God’s power, interrupted at 3a and 7 by His goodness; verse 10 the transition'
    key: rasmussen-nahum-1962
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/nahum-poet-prophet'
    quote: 'His book begins with an acrostic, with one strophe (stanza) for each of the first fifteen letters of the Hebrew alphabet, with two alterations of the sequence. The first seven strophes (verses 2-5 in English) emphasize God''s power over nature and over His enemies; but the third (verse 3a) interrupts to tell of His goodness and justice.'
  - where: 'thread'
    claim: 'Verse 7 tells of His goodness and mercy to those who take refuge in Him; verse 10 is the transition'
    key: rasmussen-nahum-1962
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/nahum-poet-prophet'
    quote: 'but again tells by contrast in the third of the series (verse 7) of His goodness and His mercy to those who take refuge in Him. The fifteenth and final strophe (verse 10) provides a summary and a transition'
  - where: 'thread'
    claim: 'Verses 11–14 address Assyria and Judah in turn; verse 15 is a hopeful conclusion'
    key: rasmussen-nahum-1962
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/nahum-poet-prophet'
    quote: 'Assyria and Judah are alternately addressed in the next poem (verses 11-14); the one is to be punished and the other to be redeemed. It concludes with a hopeful verse'
  - where: 'thread'
    claim: 'King James 1:15 is Hebrew 2:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Nah.xml'
    quote: 'הִנֵּ֨ה עַל הֶ/הָרִ֜ים רַגְלֵ֤י מְבַשֵּׂר֙'
  - where: 'thread'
    claim: 'Judah would have found comfort in the assurance that its oppressors would be destroyed'
    key: ball-prophets-names
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/what-name-lessons-names-old-testament-prophets'
    quote: 'Nahum’s contemporaries would have indeed found some hope and comfort in the prophet’s assurance that their oppressors would eventually be destroyed.'
  - where: 'thread'
    claim: 'The comfort of the prophecy is what the name Nahum, comforter, answers'
    key: ball-prophets-names
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/what-name-lessons-names-old-testament-prophets'
    quote: 'What comfort and perspective Nahum’s prophecy must have given the faithful of his people during their struggles with Assyria to know that ultimately, God would deliver them.'
  - where: 'thread'
    claim: 'The name Nahum means comforter and consoler, the answer the book gives'
    key: ball-prophets-names
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/what-name-lessons-names-old-testament-prophets'
    quote: 'An answer we find is “Nahum,” or a comforter and consoler.'

  # ---- section plain ----
  - where: 'section 2 plain'
    claim: 'Those who trust in Him are those who take refuge in Him'
    key: bdb
    url: 'https://biblehub.com/hebrew/2620.htm'
    quote: 'seek refuge'
  - where: 'section 3 plain'
    claim: 'Verse 12: at full strength and many'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum%201&version=NRSVUE'
    quote: 'Though they are at full strength and many,'
  - where: 'section 3 plain'
    claim: 'Verse 14: for you are worthless'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum%201&version=NRSVUE'
    quote: 'I will prepare your grave, for you are worthless.'

  # ---- note 1:1 ----
  - where: 'note 1:1 “The comforter from Elkosh”'
    claim: 'The name means Consoler; native of Elkosh in Galilee'
    key: bd-nahum
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nahum?lang=eng'
    quote: 'Consoler. (1) The prophet; native of Elkosh in Galilee.'
  - where: 'note 1:1 “The comforter from Elkosh”'
    claim: 'The name derives from nāḥam, to pity, be sorry, comfort, be comforted'
    key: ball-prophets-names
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/what-name-lessons-names-old-testament-prophets'
    quote: 'The name Nahum is derived from the Hebrew root nâcham, which means to pity, to be sorry, to comfort, or to be comforted. Nahum is typically understood to mean a comforter or consoler.'
  - where: 'note 1:1 “The comforter from Elkosh”'
    claim: 'Judah’s comfort was the assurance that its oppressors would be destroyed'
    key: ball-prophets-names
    url: 'https://rsc.byu.edu/vol-15-no-2-2014/what-name-lessons-names-old-testament-prophets'
    quote: 'Nahum’s contemporaries would have indeed found some hope and comfort in the prophet’s assurance that their oppressors would eventually be destroyed.'
  - where: 'note 1:1 “The comforter from Elkosh”'
    claim: 'The Guide calls Nahum a prophet of Galilee'
    key: gs-nahum
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/nahum?lang=eng'
    quote: 'An Old Testament prophet of Galilee who recorded his prophecies sometime between 642 and 606 B.C.'

  # ---- note 1:2 ----
  - where: 'note 1:2 “A jealous God who avenges”'
    claim: 'The Hebrew word for jealous names strong feelings when a cherished relationship is threatened; two-edged'
    key: draper-sexual-purity
    url: 'https://rsc.byu.edu/eye-faith/scriptural-basis-doctrine-sexual-purity'
    quote: 'It identifies the strong feelings aroused when a cherished object or relationship is threatened. … On the one hand, jealousy causes God to cherish and protect even to bloodshed. On the other, it forms the basis of his demand for repentance or retribution when he is offended.'
  - where: 'note 1:2 “A jealous God who avenges”'
    claim: 'The jealousy of God is the guarantee of justice'
    key: draper-sexual-purity
    url: 'https://rsc.byu.edu/eye-faith/scriptural-basis-doctrine-sexual-purity'
    quote: 'To make the point, the jealousy of God is the guarantee of justice.'
  - where: 'note 1:2 “A jealous God who avenges”'
    claim: 'Chapter 1 shows the avenging God executing judgment on the oppressors of His people'
    key: bd-nahum
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nahum?lang=eng'
    quote: 'Nahum 1, the manifestation of the avenging God, executing judgment on the oppressors of His people'
  - where: 'note 1:2 “A jealous God who avenges”'
    claim: 'Though Israel was feeble, the God of Israel was still God of all the earth'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Nahum testified that though the Israelite nation was militarily feeble and unthreatening, the God of Israel was still God of all the earth, and He was about to unleash His fury and vengeance on His adversaries.'
  - where: 'note 1:2 “A jealous God who avenges”'
    claim: 'Paul quotes the Lord’s claim to vengeance to forbid revenge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/12?lang=eng'
    quote: 'Dearly beloved, avenge not yourselves, but rather give place unto wrath: for it is written, Vengeance is mine; I will repay, saith the Lord.'

  # ---- note 1:3 ----
  - where: 'note 1:3 “Slow to anger, and not acquitting”'
    claim: 'The Church’s footnote on “wicked” in 1:3 points to Exodus 34:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/nahum/1?lang=eng'
    quote: 'Ex. 34:7; Morm. 4:5; D&C 1:9.'
  - where: 'note 1:3 “Slow to anger, and not acquitting”'
    claim: 'Exodus 34:7 has the clause on not clearing the guilty'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'Keeping mercy for thousands, forgiving iniquity and transgression and sin, and that will by no means clear the guilty'
  - where: 'note 1:3 “Slow to anger, and not acquitting”'
    claim: 'Jonah’s quotation of the formula ends with mercy and has no clause on the guilty'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/4?lang=eng'
    quote: 'for I knew that thou art a gracious God, and merciful, slow to anger, and of great kindness, and repentest thee of the evil.'
  - where: 'note 1:3 “Slow to anger, and not acquitting”'
    claim: 'Nahum’s Nineveh had returned to wickedness after Jonah’s day'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'By Nahum’s time, the people of Nineveh had returned to their wickedness.'
  - where: 'note 1:3 “Slow to anger, and not acquitting”'
    claim: 'Verse 3a interrupts the account of power to tell of His goodness and justice'
    key: rasmussen-nahum-1962
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/nahum-poet-prophet'
    quote: 'but the third (verse 3a) interrupts to tell of His goodness and justice.'
  - where: 'note 1:3 “Slow to anger, and not acquitting”'
    claim: 'Justice will not rob His mercy'
    key: rasmussen-nahum-1962
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/nahum-poet-prophet'
    quote: 'His mercy shall not rob justice, but neither will justice rob His mercy.'
  - where: 'note 1:3 “Slow to anger, and not acquitting”'
    claim: 'Assyria met both the mercy of God (Jonah) and His judgment (Nahum)'
    key: draper-sexual-purity
    url: 'https://rsc.byu.edu/eye-faith/scriptural-basis-doctrine-sexual-purity'
    quote: 'both the mercy of God to Assyria (see Jonah 3:1–4:3) and the judgment of God upon Assyria (see Nahum 1:1–3:19)'

  # ---- note 1:5 ----
  - where: 'note 1:5 “The earth burned at His presence”'
    claim: 'The footnote on “melt” points to Psalm 97:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/nahum/1?lang=eng'
    quote: 'Ps. 97:5.'
  - where: 'note 1:5 “The earth burned at His presence”'
    claim: 'A modern translation reads “the earth heaves before him” where the King James has “burned”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum%201&version=NRSVUE'
    quote: 'the earth heaves before him,'
  - where: 'note 1:5 “The earth burned at His presence”'
    claim: 'Fire comes in verse 6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/nahum/1?lang=eng'
    quote: 'his fury is poured out like fire'
  - where: 'note 1:5 “The earth burned at His presence”'
    claim: 'The first part of the hymn emphasizes God’s power over nature and His enemies'
    key: rasmussen-nahum-1962
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/nahum-poet-prophet'
    quote: 'The first seven strophes (verses 2-5 in English) emphasize God''s power over nature and over His enemies'
  - where: 'note 1:5 “The earth burned at His presence”'
    claim: 'The chapter heading: the burning of the earth at the Second Coming'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/nahum/1?lang=eng'
    quote: 'Nahum speaks of the burning of the earth at the Second Coming and of the mercy and power of the Lord.'
  - where: 'note 1:5 “The earth burned at His presence”'
    claim: 'Nahum used Second Coming imagery for Assyria’s devastation, an example of prophetic dualism'
    key: ot-manual-20
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-20?lang=eng'
    quote: 'Nahum employed imagery usually associated with the Savior’s Second Coming to depict Assyria’s future devastation. Assyria would be as easily burned as dry stubble in a field. Here is yet another example of the prophetic dualism so common in the Old Testament'
  - where: 'note 1:5 “The earth burned at His presence”'
    claim: 'Nineveh stands as a symbol of the wicked at the Second Coming'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'And in her destruction Nineveh stands as a symbol of the hopeless condition of the wicked at the time of the Second Coming (see Nahum chapter 1 heading).'

  # ---- note 1:7 ----
  - where: 'note 1:7 “A refuge for those who take refuge”'
    claim: 'The book’s message revolves around the question who can stand in the Lord’s presence'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'In this light, the message of Nahum revolves around the question “Who can stand in the presence of the Lord?”'
  - where: 'note 1:7 “A refuge for those who take refuge”'
    claim: 'Verse 7 tells of His goodness and mercy to those who take refuge in Him'
    key: rasmussen-nahum-1962
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/nahum-poet-prophet'
    quote: 'but again tells by contrast in the third of the series (verse 7) of His goodness and His mercy to those who take refuge in Him.'
  - where: 'note 1:7 “A refuge for those who take refuge”'
    claim: 'māʿôz is a fortified place; used of God as refuge in Nahum 1:7'
    key: bdb
    url: 'https://biblehub.com/hebrew/4581.htm'
    quote: '1. a fortified place'
  - where: 'note 1:7 “A refuge for those who take refuge”'
    claim: 'BDB lists Nahum 1:7 among uses of the word of God as refuge'
    key: bdb
    url: 'https://biblehub.com/hebrew/4581.htm'
    quote: 'figurative, of God (׳י) as refuge Nahum 1:7'
  - where: 'note 1:7 “A refuge for those who take refuge”'
    claim: 'The verb of “them that trust” is ḥāsâ, seek refuge; BDB lists Nahum 1:7'
    key: bdb
    url: 'https://biblehub.com/hebrew/2620.htm'
    quote: 'elsewhere in God 2 Samuel 22:3 = Psalm 18:3; Nahum 1:7'
  - where: 'note 1:7 “A refuge for those who take refuge”'
    claim: 'The Hebrew of 1:7 has māʿôz and the participle of ḥāsâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Nah.xml'
    quote: 'לְ/מָע֖וֹז … חֹ֥סֵי'
  - where: 'note 1:7 “A refuge for those who take refuge”'
    claim: 'A modern translation reads “he protects those who take refuge in him”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum%201&version=NRSVUE'
    quote: 'he protects those who take refuge in him,'

  # ---- note 1:8 ----
  - where: 'note 1:8 “The flood turned on Assyria”'
    claim: 'In Assyrian texts the king advancing into battle is likened to raging water, the abubu flood; Isaiah 8:7–8 borrows it'
    key: uriona-assyria
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/uriona/2023-02-24/i_55_todd_uriona_assyria_and_the_great_church_of_nephis_vision_2023_1-30.pdf'
    quote: 'In Isaiah 8:7–8, we see two parallels that appear to be borrowed from the Assyrian records of their campaigns. According to Peter Machinist, “The first is the image of the king advancing into battle like raging water. In Assyrian texts, the waters are called abubu , i.e.,‘flood,’ recalling the primeval Flood;'
  - where: 'note 1:8 “The flood turned on Assyria”'
    claim: 'Nahum subverts the flood trope in 1:8'
    key: uriona-assyria
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/uriona/2023-02-24/i_55_todd_uriona_assyria_and_the_great_church_of_nephis_vision_2023_1-30.pdf'
    quote: 'Nahum also subverts the “flood” trope in Nahum 1:8.'
  - where: 'note 1:8 “The flood turned on Assyria”'
    claim: 'The overwhelming flood is a figure of judgment through invading armies; “her place” is Nineveh, whose site would cease to be a city'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/1.htm'
    quote: 'Sheteph, overwhelming, is a figure denoting the judgment sweeping over a land or kingdom, through the invasion of hostile armies (cf. Isaiah 8:7; Daniel 11:26, Daniel 11:40).'
  - where: 'note 1:8 “The flood turned on Assyria”'
    claim: '“Her place” refers to Nineveh; its site would cease to be a city'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/1.htm'
    quote: 'The suffix in מקומהּ refers to Nineveh in the heading (Nahum 1:1): … with the destruction of the city even the place where it stood would cease to be the site of a city'
  - where: 'note 1:8 “The flood turned on Assyria”'
    claim: 'The Hebrew is “her place” (feminine suffix)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Nah.xml'
    quote: 'מְקוֹמָ֑/הּ'
  - where: 'note 1:3 “Slow to anger, and not acquitting”'
    claim: 'God restrains wrath in patience or destroys with an overrunning flood of judgment'
    key: draper-sexual-purity
    url: 'https://rsc.byu.edu/eye-faith/scriptural-basis-doctrine-sexual-purity'
    quote: 'God either restrains his wrath in patience and grace or destroys his enemies with an overrunning flood of judgment (see Nahum 1:8).'

  # ---- note 1:11 ----
  - where: 'note 1:11 “The counsellor of worthlessness”'
    claim: '“Out of thee” has a feminine suffix; the counsellor is “counselling beliyyaʿal”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Nah.xml'
    quote: 'מִמֵּ֣/ךְ יָצָ֔א חֹשֵׁ֥ב עַל יְהוָ֖ה רָעָ֑ה יֹעֵ֖ץ בְּלִיָּֽעַל'
  - where: 'note 1:11 “The counsellor of worthlessness”'
    claim: 'In “out of thee” Nineveh is addressed; the plotting refers to the Assyrian design to destroy God’s kingdom, as in Rabshakeh’s words'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/1.htm'
    quote: 'In ממּך Nineveh is addressed, the representative of the imperial power of Assyria, which set itself to destroy the Israelitish kingdom of God.'
  - where: 'note 1:11 “The counsellor of worthlessness”'
    claim: 'Rabshakeh’s blasphemous words show the design'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/1.htm'
    quote: 'The meditation of evil against Jehovah refers to the design of the Assyrian conquerors to destroy the kingdom of God in Israel, as the Assyrian himself declares in the blasphemous words which Isaiah puts into the mouth of Rabshakeh (Isaiah 36:14-20)'
  - where: 'note 1:11 “The counsellor of worthlessness”'
    claim: 'Keil renders 1:15 “the worthless one”'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/1.htm'
    quote: 'for the worthless one will no more go through thee; he is utterly cut off.'
  - where: 'note 1:11 “The counsellor of worthlessness”'
    claim: 'beliyyaʿal means worthlessness, compounded of not and worth, use, profit'
    key: bdb
    url: 'https://biblehub.com/hebrew/1100.htm'
    quote: 'worthlessness (compound בְּלִי not, without and יַעַל worth, use, profit)'
  - where: 'note 1:11 “The counsellor of worthlessness”'
    claim: 'The same word stands in 1:15 (Hebrew 2:1)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Nah.xml'
    quote: 'בְּלִיַּ֖עַל כֻּלֹּ֥/ה נִכְרָֽת'
  - where: 'note 1:11 “The counsellor of worthlessness”'
    claim: 'Verses 11–14 alternately address Assyria and Judah'
    key: rasmussen-nahum-1962
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/nahum-poet-prophet'
    quote: 'Assyria and Judah are alternately addressed in the next poem (verses 11-14); the one is to be punished and the other to be redeemed.'
  - where: 'note 1:11 “The counsellor of worthlessness”'
    claim: 'Rabshakeh: Neither let Hezekiah make you trust in the LORD'
