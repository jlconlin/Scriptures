  # ---- note 1:13 ----
  - where: 'note 1:13 “Assyria’s yoke”'
    claim: 'The yoke is one of the most common Assyrian metaphors for its suzerainty, distinctly Assyrian'
    key: uriona-assyria
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/uriona/2023-02-24/i_55_todd_uriona_assyria_and_the_great_church_of_nephis_vision_2023_1-30.pdf'
    quote: '“one of the most common Assyrian metaphors is the ‘yoke’ as a symbol to depict Assyrian suzerainty. … This metaphor is distinctly Assyrian; it occurs rarely in the literature of other ancient Near Eastern nations.”'
  - where: 'note 1:13 “Assyria’s yoke”'
    claim: 'In the Bible the yoke metaphor typically appears when referring to Assyria'
    key: sc-knowhy-711
    url: 'https://scripturecentral.org/knowhy/why-is-the-great-and-abominable-church-described-like-the-assyrian-empire'
    quote: 'In fact, this metaphor most typically appears in the Bible when referring to Assyria or warning that another nation would conquer Judah, just as Assyria had done to the Northern Kingdom.'
  - where: 'note 1:13 “Assyria’s yoke”'
    claim: 'Nahum 1:12–13 is an example'
    key: sc-knowhy-711
    url: 'https://scripturecentral.org/knowhy/why-is-the-great-and-abominable-church-described-like-the-assyrian-empire'
    quote: 'Examples of this can be found in Nahum 1:12–13 and Jeremiah 28:13–14.'
  - where: 'note 1:13 “Assyria’s yoke”'
    claim: 'Assyrian reliefs speak of the king laying the yoke of his overlordship upon peoples'
    key: sc-knowhy-711
    url: 'https://scripturecentral.org/knowhy/why-is-the-great-and-abominable-church-described-like-the-assyrian-empire'
    quote: 'All of these elements are found in Assyrian conquest reliefs, discussing the king laying “the yoke of his overlordship upon them.”'

