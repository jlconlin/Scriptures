chapter: 3
claims:
  # ---- when / setting / thread ----
  - where: 'when'
    claim: 'Thebes (No) was taken by Assurbanipal about 660 B.C.'
    key: bd-no
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/no?lang=eng'
    quote: 'Thebes. Capital of Upper Egypt, taken by Assurbanipal about 660 B.C. (Nahum 3:8).'
  - where: 'when'
    claim: 'Nahum’s prophecies likely date just before Nineveh’s fall in 612 BC'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Nahum’s prophecies likely date to the period just before Nineveh’s fall in 612 BC.'
  - where: 'setting'
    claim: 'Chapter 3 is the final poem: a prelude on the city’s evils, its fall like others, useless defenses, and an epitaph'
    key: rasmussen-nahum-1962
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/nahum-poet-prophet'
    quote: 'The final poem (chapter 3) opens with a prelude on the evils of the oppressive city, Nineveh.'
  - where: 'setting'
    claim: 'Assyria’s kings boasted in their own records of the captives they maimed'
    key: rasmussen-nahum-1962
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/nahum-poet-prophet'
    quote: 'whose kings in their own records boast of the captives they have maimed, the realms they have subjected and the treasures they have confiscated'
  - where: 'setting'
    claim: 'The Medes and Babylonians destroyed Asshur in 614, besieged Nineveh two years later for three months and razed it; by 610 Assyria had vanished'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'the Medes joined the Babylonians and destroyed Asshur (Assyria’s ancient capital) in 614 BC. Two years later they laid siege to Nineveh (the then-current capital) for three months, after which they entered the city and razed it to the ground. By 610 BC Assyria had vanished'
  - where: 'setting'
    claim: 'The book looks back to Thebes’ fall and forward to Nineveh’s'
    key: breitenstein-nahum
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-nahum'
    quote: 'In this book we see Nahum looking both backward and forward in time.'
  - where: 'setting'
    claim: 'Zephaniah also foretold that Nineveh would be made a desolation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/2?lang=eng'
    quote: 'and will make Nineveh a desolation, and dry like a wilderness.'
  - where: 'thread'
    claim: 'The poem’s movement: evils; detestable (5–7); falls like others (8–11); defenses useless as leaders flee like locusts (12–17); epitaph (18–19)'
    key: rasmussen-nahum-1962
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/nahum-poet-prophet'
    quote: 'Because of all this, the prophet says she shall become detestable (verses 5-7). Like all others strong but wicked, Nineveh shall fall (verses 8-11); all her defenses shall be useless when her leaders flee like locusts (verses 12-17).'
  - where: 'thread'
    claim: 'For Nineveh there was no hope; it would never enjoy a restoration'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Nahum proceeds to break the usual pattern of doom followed by hope. For Nineveh, there was no hope.'
  - where: 'thread'
    claim: 'Jonah ends on the Lord’s question about sparing Nineveh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/4?lang=eng'
    quote: 'And should not I spare Nineveh, that great city'

  # ---- note 3:1 ----
  - where: 'note 3:1 “City of blood, lies and plunder”'
    claim: 'A modern translation: “city of bloodshed, utterly deceitful, full of plunder—no end to the prey!”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum+3&version=NRSVUE'
    quote: 'Woe, city of bloodshed, utterly deceitful, full of plunder— no end to the prey!'
  - where: 'note 3:1 “City of blood, lies and plunder”'
    claim: 'Verse 1 states why Nineveh deserved to be destroyed'
    key: breitenstein-nahum
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-nahum'
    quote: 'In Nahum 3:1 the prophet Nahum essentially stated why Nineveh (“the bloody city”) deserved to be destroyed: “It is all full of lies and robbery.”'
  - where: 'note 3:1 “City of blood, lies and plunder”'
    claim: 'The “bloody city” of Ezekiel 22:2 is Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/22?lang=eng'
    quote: 'Ezekiel catalogs the sins of the people of Judah in Jerusalem'
  - where: 'note 3:1 “City of blood, lies and plunder”'
    claim: 'Verses 2–3 describe Nineveh’s fierce attackers and the many slain'
    key: breitenstein-nahum
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-nahum'
    quote: 'Nineveh’s attackers would be fierce, as described in verses 2 and 3. They would use swords and spears, and many would be slain.'

  # ---- note 3:4 ----
  - where: 'note 3:4 “The harlot who sells nations”'
    claim: 'Nineveh not only turned to wickedness but exported it to others through her power and influence'
    key: ot-manual-20
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-20?lang=eng'
    quote: 'In other words, she not only turned to wickedness herself but exported that wickedness to many others through her power and influence.'
  - where: 'note 3:4 “The harlot who sells nations”'
    claim: 'A modern translation renders it “enslaves nations,” noting the Hebrew “sells”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum+3&version=NRSVUE'
    quote: 'who enslaves nations through her debaucheries and peoples through her sorcery'
  - where: 'note 3:4 “The harlot who sells nations”'
    claim: 'Nineveh was immersed in worldly power, witchcraft, whoredoms and materialism (3:4, 16–17)'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Nineveh was terminally pompous, immersed in worldly power, witchcraft, whoredoms, and the supposed merits of materialism (see Nahum 3:4, 16–17).'

  # ---- note 3:5 ----
  - where: 'note 3:5 “Shame for shame”'
    claim: 'The punishment corresponds to her conduct; her coquetry is repaid by uncovering before the nations (cf. Jer. 13:26; Isa. 47:3)'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/3.htm'
    quote: 'The punishment of Nineveh will correspond to her conduct. Her coquetry shall be repaid to her by the uncovering of her nakedness before the nations (cf. Jeremiah 13:26; Isaiah 47:3; Hosea 2:5).'
  - where: 'note 3:5 “Shame for shame”'
    claim: 'Throwing dirt on someone is a figure for the greatest contempt'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/3.htm'
    quote: 'Throwing dirt upon any one is a figurative expression for the most ignominious treatment or greatest contempt.'
  - where: 'note 3:5 “Shame for shame”'
    claim: 'No one pities the city because its fate is deserved; Isaiah 51:19 uses the same words of Jerusalem'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/3.htm'
    quote: 'The last two clauses express the thought that no one will take pity upon the devastated city, because its fate is so well deserved; compare Isaiah 51:19, where the same words are used of Jerusalem.'
  - where: 'note 3:5 “Shame for shame”'
    claim: '“Gazingstock” is rendered “spectacle” in a modern translation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum+3&version=NRSVUE'
    quote: 'I will throw filth at you and treat you with contempt and make you a spectacle.'
  - where: 'note 3:5 “Shame for shame”'
    claim: 'Isaiah 51:19 asks of Jerusalem who shall be sorry for her and by whom she shall be comforted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/51?lang=eng'
    quote: 'who shall be sorry for thee? desolation, and destruction, and the famine, and the sword: by whom shall I comfort thee?'

  # ---- note 3:8 ----
  - where: 'note 3:8 “Thebes, the precedent”'
    claim: 'No is Thebes, capital of Upper Egypt, taken by Assurbanipal about 660 B.C.'
    key: bd-no
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/no?lang=eng'
    quote: 'Thebes. Capital of Upper Egypt, taken by Assurbanipal about 660 B.C. (Nahum 3:8).'
  - where: 'note 3:8 “Thebes, the precedent”'
    claim: 'Nineveh was no better than Thebes; Thebes’ allies could not protect her; Nineveh would seek strength in allies and find none'
    key: ot-manual-20
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-20?lang=eng'
    quote: 'Neither of the allies of Thebes, Ethiopia or Libya, had been able to protect her. Nineveh, too, would “seek strength” in allies and find none.'
  - where: 'note 3:8 “Thebes, the precedent”'
    claim: 'Thebes was destroyed by Assurbanipal, king of Assyria'
    key: ot-manual-20
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-20?lang=eng'
    quote: 'She was no better than the Egyptian city, No-Amon (Thebes), which was earlier destroyed by Assurbanipal, king of Assyria.'
  - where: 'note 3:8 “Thebes, the precedent”'
    claim: 'The book looks back to Thebes’ fall and forward to Nineveh’s, so Nahum’s ministry falls between the two'
    key: breitenstein-nahum
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-nahum'
    quote: 'In this book we see Nahum looking both backward and forward in time. Therefore, we know that Nahum’s ministry was probably sometime between those two dates.'
  - where: 'note 3:8 “Thebes, the precedent”'
    claim: 'A modern translation: Thebes “that sat by the Nile”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum+3&version=NRSVUE'
    quote: 'Are you better than Thebes that sat by the Nile, with water around her, her rampart a sea, water her wall?'

  # ---- note 3:11 ----
  - where: 'note 3:11 “Drunk and hidden”'
    claim: 'Drunken from the goblet of divine wrath, as at Obadiah 16; “hidden” means vanished as if never been'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/3.htm'
    quote: 'תּשׁכּרי, thou wilt be drunken, viz., from the goblet of divine wrath, as at Obadiah 1:16.'
  - where: 'note 3:11 “Drunk and hidden”'
    claim: '“Hid” means vanish, reduced to nothing'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/3.htm'
    quote: '"Thou wilt vanish away as if thou hadst never been; the Hebrews frequently using the expression being hidden for being reduced to nothing."'
  - where: 'note 3:11 “Drunk and hidden”'
    claim: 'The refuge from the enemy is sought in vain'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/3.htm'
    quote: '"Thou wilt seek refuge from the enemy," i.e., in this connection, seek it in vain, or without finding it'
  - where: 'note 3:11 “Drunk and hidden”'
    claim: 'A modern translation: “seek a refuge from the enemy”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum+3&version=NRSVUE'
    quote: 'You also will be drunken; you will go into hiding; you will seek a refuge from the enemy.'
  - where: 'note 3:11 “Drunk and hidden”'
    claim: 'Obadiah 16: the nations shall drink and be as though they had not been'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/obad/1?lang=eng'
    quote: 'yea, they shall drink, and they shall swallow down, and they shall be as though they had not been.'

  # ---- note 3:12 ----
  - where: 'note 3:12 “Ripe figs and troops like women”'
    claim: 'The strongholds would fall as easily as ripe figs into the enemy’s grasp; the gates open'
    key: breitenstein-nahum
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-nahum'
    quote: 'The people of Nineveh would seek strength, but their strongholds would falter, like figs falling from a fig tree (they would easily fall into the grasp of the enemy).'
  - where: 'note 3:12 “Ripe figs and troops like women”'
    claim: 'A modern translation: “Look at your troops: they are women in your midst”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum+3&version=NRSVUE'
    quote: 'Look at your troops: they are women in your midst.'
  - where: 'note 3:12 “Ripe figs and troops like women”'
    claim: 'The Church’s footnote on “women” points to Jeremiah 51:30'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/nahum/3?lang=eng'
    quote: '13a “women”: Jer. 51:30.'
  - where: 'note 3:12 “Ripe figs and troops like women”'
    claim: 'Jeremiah 51:30: Babylon’s mighty men forbore to fight, their might failed, they became as women'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/51?lang=eng'
    quote: 'The mighty men of Babylon have forborn to fight, they have remained in their holds: their might hath failed; they became as women'

  # ---- note 3:17 ----
  - where: 'note 3:17 “Who are the crowned?”'
    claim: 'The Hebrew noun is uncertain: perhaps consecrated or anointed ones, princes; the form is dubious; one proposal is “thy crowned ones”; some leave it untranslated; it occurs only here'
    key: bdb
    url: 'https://biblehub.com/hebrew/4502.htm'
    quote: 'noun [masculine] plural perhaps consecrated (i.e. anointed) ones, princes; — only suffix מִנְּזָרַ֫יִךְ Nahum 3:17 … — form dubious; Köii. 1, 90 proposes מְנֻזָּרַיַךְ = thy crowned ones; Gr רוֺזְנַיִךְ; Now GASm leave untranslated.'
  - where: 'note 3:17 “Who are the crowned?”'
    claim: 'A modern translation: “Your guards are like grasshoppers, your scribes like swarms of locusts”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum+3&version=NRSVUE'
    quote: 'Your guards are like grasshoppers, your scribes like swarms of locusts settling on the fences on a cold day— when the sun rises, they fly away; no one knows where they have gone.'
  # ---- note 3:18 ----
  - where: 'note 3:18 “Shepherds asleep”'
    claim: 'The verb nûm is “be drowsy, slumber,” figurative of inactivity, with Nahum 3:18 listed there; with a cognate noun it is used of death'
    key: bdb
    url: 'https://biblehub.com/hebrew/5123.htm'
    quote: 'be drowsy, slumber, literal … figurative of inactivity, indolence, Isaiah 5:27 ("" ישׁן), Psalm 121:3; Psalm 121:4 (of ׳י; "" id.); Nahum 3:18 ("" שָׁכֵן)'
  - where: 'note 3:18 “Shepherds asleep”'
    claim: 'The verb in 3:18 is nāmû'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Nah.xml'
    quote: 'נָמ֤וּ'
  - where: 'note 3:18 “Shepherds asleep”'
    claim: 'Here the verb denotes the sleep of death, not carelessness'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/3.htm'
    quote: 'Mâmū, from nūm, to slumber, to sleep, is not a figurative expression for carelessness and inactivity here'
  - where: 'note 3:18 “Shepherds asleep”'
    claim: 'Nūm here denotes the sleep of death'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/3.htm'
    quote: 'Nūm denotes here, as in Psalm 76:6, the sleep of death'
  - where: 'note 3:18 “Shepherds asleep”'
    claim: 'The verb of “dwell in the dust” is used of the rest of death'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/3.htm'
    quote: 'Shâkhan, a synonym of shâkhabh, to have lain down, to lie quietly (Judges 5:17), used here of the rest of death.'
  - where: 'note 3:18 “Shepherds asleep”'
    claim: 'The king is a personification of the imperial power; the shepherds are its princes and great men'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/3.htm'
    quote: 'The king of Asshur addressed in Nahum 3:18 is not the last historical king of that kingdom, but a rhetorical personification of the holder of the imperial power of Assyria. His shepherds and glorious ones'
  - where: 'note 3:18 “Shepherds asleep”'
    claim: 'With the shepherds asleep, the flock is scattered and perishes'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/3.htm'
    quote: 'As the shepherds have fallen asleep, the flock (i.e., the Assyrian people) is scattered upon the mountains and perishes, because no one gathers it together.'
  - where: 'note 3:18 “Shepherds asleep”'
    claim: 'A modern translation: “Your shepherds are asleep … your nobles slumber”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum+3&version=NRSVUE'
    quote: 'Your shepherds are asleep, O king of Assyria; your nobles slumber.'

  # ---- note 3:19 ----
  - where: 'note 3:19 “No healing, and the clapping”'
    claim: 'A modern translation of the last line: “For who has ever escaped your endless cruelty?”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum+3&version=NRSVUE'
    quote: 'All who hear the news about you clap their hands over you. For who has ever escaped your endless cruelty?'
  - where: 'note 3:19 “No healing, and the clapping”'
    claim: 'Unlike Israel, Nineveh would never enjoy a restoration'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Unlike Israel, Nineveh would never enjoy a restoration.'
  - where: 'christ'
    claim: 'Jesus Christ was the Great Jehovah of the Old Testament'
    key: living-christ
    url: 'https://www.churchofjesuschrist.org/study/scriptures/the-living-christ-the-testimony-of-the-apostles/the-living-christ-the-testimony-of-the-apostles?lang=eng'
    quote: 'He was the Great Jehovah of the Old Testament, the Messiah of the New.'
  - where: 'christ'
    claim: '“The LORD of hosts” in 3:5 is the divine name YHWH ṣᵉbāʾôt'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Nah.xml'
    quote: 'יְהוָ֣ה צְבָא֔וֹת'
  - where: 'christ'
    claim: 'Nineveh is a symbol of sinful, oppressive, worldly powers the Lord will bring down'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'The prophet used Nineveh as a symbol of sinful, oppressive, worldly powers that the Lord will ultimately bring down.'
  - where: 'explore'
    claim: 'Some of Nahum’s language for Nineveh is used by John of Babylon; the fate of Nineveh is transferred to another nation that threatens Israel'
    key: uriona-assyria
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/uriona/2023-02-24/i_55_todd_uriona_assyria_and_the_great_church_of_nephis_vision_2023_1-30.pdf'
    quote: 'Some of the language found in Nahum that describes Nineveh is also used by John in Revelation. However, in the book Revelation, it is Babylon that is used as an image of divine disfavor indicating that the fate of Nineveh is being transferred to another nation that threatens Israel'
  - where: 'explore'
    claim: 'Parallels between the great church of Nephi’s vision and the Assyrian Empire'
    key: uriona-assyria
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/uriona/2023-02-24/i_55_todd_uriona_assyria_and_the_great_church_of_nephis_vision_2023_1-30.pdf'
    quote: 'surprising parallels can be found between the “great church” of his vision and the Assyrian Empire.'
  - where: 'explore'
    claim: 'Isaiah 47:3 uses the uncovering of shame of Babylon, as Nahum does of Nineveh'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/3.htm'
    quote: 'Her coquetry shall be repaid to her by the uncovering of her nakedness before the nations (cf. Jeremiah 13:26; Isaiah 47:3; Hosea 2:5).'
  - where: 'explore'
    claim: 'Zephaniah 2:15: everyone passing Nineveh’s ruin shall hiss and wag his hand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zeph/2?lang=eng'
    quote: 'every one that passeth by her shall hiss, and wag his hand.'
