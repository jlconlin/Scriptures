chapter: 2
claims:
  # ---- when ----
  - where: when
    claim: 'Thebes was taken by Assurbanipal about 660 B.C.; the book was written after that'
    key: bd-nahum
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nahum?lang=eng'
    quote: 'that of No-amon (Nahum 3:8) or Thebes, in Upper Egypt, taken by Assurbanipal about 660 B.C.'
  - where: when
    claim: 'Nahum''s prophecies likely date to just before Nineveh fell in 612 B.C.'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Nahum’s prophecies likely date to the period just before Nineveh’s fall in 612 BC.'

  # ---- setting ----
  - where: setting
    claim: 'Chapter 2 is a taunt-song about Nineveh'
    key: rasmussen-nahum-1962
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/nahum-poet-prophet'
    quote: 'Chapter 2 of Nahum''s book is a taunt-song about Nineveh, but told in terms that typify the destruction of all evil.'
  - where: setting
    claim: 'The poem of chapter 1''s second half addresses Assyria and Judah alternately'
    key: rasmussen-nahum-1962
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/nahum-poet-prophet'
    quote: 'Assyria and Judah are alternately addressed in the next poem (verses 11-14); the one is to be punished and the other to be redeemed.'
  - where: setting
    claim: 'The Bible Dictionary calls chapter 2 a picture of the city''s fall'
    key: bd-nahum
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nahum?lang=eng'
    quote: 'Nahum 2, a picture of the city’s fall'
  - where: setting
    claim: 'The Medes and Babylonians besieged Nineveh for three months and razed it'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'the Medes joined the Babylonians and destroyed Asshur (Assyria’s ancient capital) in 614 BC. Two years later they laid siege to Nineveh (the then-current capital) for three months, after which they entered the city and razed it to the ground. By 610 BC Assyria had vanished'
  - where: setting
    claim: 'Nahum prophesied just before Nineveh''s fall in 612'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Nahum’s prophecies likely date to the period just before Nineveh’s fall in 612 BC.'
  - where: setting
    claim: 'The chapter heading reads the fall as a symbol of the latter days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/nahum/2?lang=eng'
    quote: 'Nineveh will be destroyed, which is a symbol of what will be in the latter days.'

  # ---- thread ----
  - where: thread
    claim: 'The poem''s movement: preparation and beginning of the siege (1–4), siege laid (5–7), defenders flee (8), spoils taken (9–10), the royalty as a den of lions destroyed (11–13)'
    key: rasmussen-nahum-1962
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/nahum-poet-prophet'
    quote: 'The first few lines (verses 1-4) depict the preparation and beginning of the siege; in the next (5-7), siege is laid; the defenders flee (verse 8); and the spoils are taken (verses 9, 10). The poem ends with three verses (11-13) about the royalty of Nineveh'
  - where: thread
    claim: 'Verse 2 is set apart as an aside, the Lord restoring Jacob''s majesty'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum%202&version=NRSVUE'
    quote: '(For the Lord is restoring the majesty of Jacob, as well as the majesty of Israel, though ravagers have ravaged them and ruined their branches.)'
  - where: thread
    claim: 'Nineveh receives the same fate as the Israelites who were emptied out (verse 2)'
    key: breitenstein-nahum
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-nahum'
    quote: 'Nineveh would receive the same fate as the ancient Israelites who were “emptied . . . out, and marred” (plundered and destroyed) because of their own evil doings (verse 2).'
  - where: thread
    claim: 'In verse 9 the conquerors are summoned to plunder by God, speaking through the prophet'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/2.htm'
    quote: 'In Nahum 2:9 the conquerors are summoned to plunder, not by their generals, but by God, who speaks through the prophet.'

  # ---- sections ----
  - where: section 2 plain
    claim: 'The subject of “He shall recount his worthies” is the Assyrian king, calling up his soldiers to defend the city'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/2.htm'
    quote: 'The subject to yizkōr is the Assyrian (בּליּעל, Nahum 2:1), or the king of Asshur (Nahum 3:18). He remembers his glorious ones'
  - where: section 2 plain
    claim: 'The palace melts away'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Nahum%202&version=ESV'
    quote: 'The river gates are opened; the palace (J)melts away;'

  # ---- note 2:1 ----
  - where: 'note 2:1 “The attacker no one names”'
    claim: 'Modern translation: a scatterer has come up against you'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum%202&version=NRSVUE'
    quote: 'A scatterer has come up against you. Guard the ramparts; watch the road; gird your loins; collect all your strength.'
  - where: 'note 2:1 “The attacker no one names”'
    claim: 'Verse 1 turns suddenly from Judah to Nineveh; the orders are a poetic way of saying Nineveh cannot repulse the enemy'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/2.htm'
    quote: 'We must therefore assume that we have here a sudden change in the person addressed'
  - where: 'note 2:1 “The attacker no one names”'
    claim: 'The orders are not irony but a poetic way of saying Nineveh will not be able to repulse the enemy'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/2.htm'
    quote: 'This is not irony, but simply a poetical turn given to the thought, that Nineveh will not be able to repulse this enemy any more.'
  - where: 'note 2:1 “The attacker no one names”'
    claim: 'The chapter is a taunt-song'
    key: rasmussen-nahum-1962
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/nahum-poet-prophet'
    quote: 'Chapter 2 of Nahum''s book is a taunt-song about Nineveh'

  # ---- note 2:2 ----
  - where: 'note 2:2 “Turned away, or restored?”'
    claim: 'The verb is shuv (H7725)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Nah.xml'
    quote: 'שָׁ֤ב'
  - where: 'note 2:2 “Turned away, or restored?”'
    claim: 'BDB: shuv means turn back, return'
    key: bdb
    url: 'https://biblehub.com/hebrew/7725.htm'
    quote: 'שׁוּב1056 verb turn back, return'
  - where: 'note 2:2 “Turned away, or restored?”'
    claim: 'NRSVue: the Lord is restoring the majesty of Jacob'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum%202&version=NRSVUE'
    quote: '(For the Lord is restoring the majesty of Jacob, as well as the majesty of Israel, though ravagers have ravaged them and ruined their branches.)'
  - where: 'note 2:2 “Turned away, or restored?”'
    claim: 'ESV: the Lord is restoring the majesty of Jacob'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Nahum%202&version=ESV'
    quote: 'For (C)the Lord is restoring the majesty of Jacob as the majesty of Israel, for plunderers have plundered them and (D)ruined their branches.'

  # ---- note 2:3 ----
  - where: 'note 2:3 “Red shields and cypress spears”'
    claim: 'One reading takes the red shields and scarlet as the Babylonian invaders'
    key: breitenstein-nahum
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-nahum'
    quote: 'The Babylonian invaders were described here. They would wear red shields and scarlet attire.'
  - where: 'note 2:3 “Red shields and cypress spears”'
    claim: 'The Hebrew word is “the cypresses”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Nah.xml'
    quote: 'וְ/הַ/בְּרֹשִׁ֖ים'
  - where: 'note 2:3 “Red shields and cypress spears”'
    claim: 'ESV reads cypress spears brandished'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Nahum%202&version=ESV'
    quote: 'the cypress spears are brandished.'
  - where: 'note 2:3 “Red shields and cypress spears”'
    claim: 'NRSVue follows the Greek and Syriac, “the chargers prance”; the Hebrew has cypresses'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum%202&version=NRSVUE'
    quote: '2.3 Cn Compare Gk Syr: Heb cypresses'
  - where: 'note 2:3 “Red shields and cypress spears”'
    claim: 'NRSVue reads “the chargers prance”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum%202&version=NRSVUE'
    quote: 'on the day when he musters them; the chargers prance.'

  # ---- note 2:6 ----
  - where: 'note 2:6 “The river gates”'
    claim: 'One reading: sluice gates opened to flood the palace grounds'
    key: breitenstein-nahum
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-nahum'
    quote: 'Gates (probably sluice gates, which control water flow) would be opened to flood the palace grounds as a part of the siege of Nineveh.'
  - where: 'note 2:6 “The river gates”'
    claim: 'Nineveh stood at the junction of the Khosr with the Tigris; the Khosr was dammed and canals filled the moats'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/2.htm'
    quote: 'the city, which stood at the junction of the Khosr with the Tigris ... the natural course of the Khosr had to be dammed off from the plain chosen for the city by three stone dams'
  - where: 'note 2:6 “The river gates”'
    claim: 'Another reading, rejecting sluices: the gates in the wall protected by the rivers, most strongly fortified'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/2.htm'
    quote: 'nor even gates through which rivers flow, i.e., sluices, namely those of the concentric canals issuing from the Tigris, with which the palace could be laid under water'
  - where: 'note 2:6 “The river gates”'
    claim: 'The gates in the wall protected by the rivers, most strongly fortified'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/2.htm'
    quote: '"gates on the waters," i.e., situated on the rivers, or gates in the city wall, which were protected by the rivers; "gates most strongly fortified, both by nature and art"'
  - where: 'note 2:6 “The river gates”'
    claim: 'The palace melting is figurative: the ruling city vanishes in terror'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/2.htm'
    quote: 'The words are figurative. mūg, to melt, dissolve, i.e., to vanish through anxiety and alarm; and היכל, the palace, for the inhabitants of the palace.'
  - where: 'note 2:6 “The river gates”'
    claim: 'The verb behind “dissolved” is a form of mug, to melt'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Nah.xml'
    quote: 'נָמֽוֹג'
  - where: 'note 2:6 “The river gates”'
    claim: 'ESV: the palace melts away'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Nahum%202&version=ESV'
    quote: 'The river gates are opened; the palace (J)melts away;'

  # ---- note 2:7 ----
  - where: 'note 2:7 “Huzzab: a name, a queen, or a decree?”'
    claim: 'The word is a hophal perfect of natsab'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Nah.xml'
    quote: 'וְ/הֻצַּ֖ב'
  - where: 'note 2:7 “Huzzab: a name, a queen, or a decree?”'
    claim: 'BDB: it is fixed, determined, but very dubious; perhaps a proper name or epithet of the queen'
    key: bdb
    url: 'https://biblehub.com/hebrew/5324.htm'
    quote: 'הֻצַּב Nahum 2:8 it is fixed, determined (Kl Or), but very dubious; perhaps proper name, or epithet, of queen'
  - where: 'note 2:7 “Huzzab: a name, a queen, or a decree?”'
    claim: 'natsab means to stand, set, establish'
    key: bdb
    url: 'https://biblehub.com/hebrew/5324.htm'
    quote: 'To stand, set, establish, station'
  - where: 'note 2:7 “Huzzab: a name, a queen, or a decree?”'
    claim: 'The Church''s footnote: or the queen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/nahum/2?lang=eng'
    quote: 'OR the queen.'
  - where: 'note 2:7 “Huzzab: a name, a queen, or a decree?”'
    claim: 'NRSVue: it is decreed that the city be exiled, its slave women led away'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum%202&version=NRSVUE'
    quote: 'It is decreed that the city be exiled, its slave women led away, moaning like doves and beating their breasts.'
  - where: 'note 2:7 “Huzzab: a name, a queen, or a decree?”'
    claim: 'ESV: its mistress is stripped; meaning uncertain'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Nahum%202&version=ESV'
    quote: 'Nahum 2:7 The meaning of the Hebrew word rendered its mistress is uncertain'
  - where: 'note 2:7 “Huzzab: a name, a queen, or a decree?”'
    claim: 'Some take Huzzab as the queen, some as Nineveh personified, others as “it is decreed”'
    key: breitenstein-nahum
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-nahum'
    quote: 'Some scholars assume Huzzab was the queen of Assyria. However, the noun can also be treated as a personification of Ninevah. ... Other translations render the original Hebrew word as “it is decreed.”'

  # ---- note 2:8 ----
  - where: 'note 2:8 “A pool running dry”'
    claim: 'NRSVue: Nineveh is like a pool whose waters run away'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum%202&version=NRSVUE'
    quote: 'Nineveh is like a pool whose waters run away. “Halt! Halt!”— but no one turns back.'
  - where: 'note 2:8 “A pool running dry”'
    claim: 'NRSVue follows the Greek; the Hebrew reads “a pool, from the days that she has become”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum%202&version=NRSVUE'
    quote: '2.8 Cn Compare Gk: Heb a pool, from the days that she has become, and they'
  - where: 'note 2:8 “A pool running dry”'
    claim: 'ESV: like a pool whose waters run away; the Hebrew uncertain'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Nahum%202&version=ESV'
    quote: 'Nahum 2:8 Compare Septuagint; the meaning of the Hebrew is uncertain'

  # ---- note 2:10 empty ----
  - where: 'note 2:10 “Emptied, as she emptied others”'
    claim: 'The three words buqah, mebuqah, mebullaqah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Nah.xml'
    quote: 'בּוּקָ֥ה וּ/מְבוּקָ֖ה וּ/מְבֻלָּקָ֑ה'
  - where: 'note 2:10 “Emptied, as she emptied others”'
    claim: 'BDB gives the three words: emptiness and void and waste'
    key: bdb
    url: 'https://biblehub.com/hebrew/950.htm'
    quote: 'בּוּקָה noun feminine emptiness, Nahum 2:11 בּוּקה וּמְבוּקָה וּמְבֻלָּקֱה emptiness and void and waste.'
  - where: 'note 2:10 “Emptied, as she emptied others”'
    claim: 'NRSVue renders the triple with alliteration'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum%202&version=NRSVUE'
    quote: 'Devastation, desolation, and destruction!'
  - where: 'note 2:10 “Emptied, as she emptied others”'
    claim: 'Nineveh receives the same fate as the Israelites who were emptied out in verse 2'
    key: breitenstein-nahum
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-nahum'
    quote: 'Nineveh would receive the same fate as the ancient Israelites who were “emptied . . . out, and marred” (plundered and destroyed) because of their own evil doings (verse 2).'
  - where: 'note 2:10 “Emptied, as she emptied others”'
    claim: 'ESV: anguish is in all loins'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Nahum%202&version=ESV'
    quote: 'anguish is in all loins'

  # ---- note 2:10 blackness ----
  - where: 'note 2:10 “Faces gathering blackness”'
    claim: 'The Church''s footnote: a Hebrew idiom meaning gloom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/nahum/2?lang=eng'
    quote: 'Hebrew idiom meaning “gloom.”'
  - where: 'note 2:10 “Faces gathering blackness”'
    claim: 'NRSVue: all faces grow pale'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum%202&version=NRSVUE'
    quote: 'Hearts faint and knees tremble; all loins quake; all faces grow pale!'
  - where: 'note 2:10 “Faces gathering blackness”'
    claim: 'A KnoWhy reads the line as a subversive reversal of a curse of blackness, applied to Assyria''s fall'
    key: sc-knowhy-718
    url: 'https://scripturecentral.org/knowhy/what-is-the-skin-of-blackness-in-the-book-of-mormon'
    quote: 'The biblical prophet Nahum, one of Lehi’s contemporaries, appears to have alluded to this very curse in a “subversive reversal” of the imagery, applying it to the fall of the Assyrian Empire itself around 612 BC'
  - where: 'note 2:10 “Faces gathering blackness”'
    claim: 'Esarhaddon''s Succession Treaty, sent to Assyrian vassals including Judah about 672 B.C., cursed violators with dark skin'
    key: sc-knowhy-718
    url: 'https://scripturecentral.org/knowhy/what-is-the-skin-of-blackness-in-the-book-of-mormon'
    quote: 'This treaty was sent out to Assyrian vassals, including Judah, in around 672 BC ... “May they [the gods] make your skin and the skin of your women, your sons and your daughters—dark. May they be as black as pitch and crude oil.”'

  # ---- note 2:11 ----
  - where: 'note 2:11 “The lions’ den”'
    claim: 'The last three verses are about Nineveh''s royalty as a den of lions vanquished'
    key: rasmussen-nahum-1962
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/nahum-poet-prophet'
    quote: 'The poem ends with three verses (11-13) about the royalty of Nineveh, who are as a den of lions that are vanquished and destroyed.'
  - where: 'note 2:11 “The lions’ den”'
    claim: 'The question means: where are the ferocious ones who attacked my people?'
    key: ot-manual-20
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-20?lang=eng'
    quote: 'This is like saying, Where are those ferocious ones who once discomfited and attacked my people?'
  - where: 'note 2:11 “The lions’ den”'
    claim: 'The lion is a fitting emblem of the kings of Assyria'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/2.htm'
    quote: 'The lion, as king of the beasts, is a very fitting emblem of the kings or rulers of Assyria.'
  - where: 'note 2:11 “The lions’ den”'
    claim: 'The lionesses and young lions are the citizens of Nineveh'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/2.htm'
    quote: 'The lionesses and young lions are the citizens of Nineveh and of the province of Assyria'
  - where: 'note 2:11 “The lions’ den”'
    claim: 'The point of comparison is the predatory lust of the rulers and warriors who plundered nations and brought the treasure to Nineveh'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/2.htm'
    quote: 'The point of comparison is the predatory lust of its rulers and their warriors, who crushed the nations like lions, plundering their treasures, and bringing them together in Nineveh.'
  - where: 'note 2:11 “The lions’ den”'
    claim: '“None made them afraid”: perfect rest and security'
    key: keil-nahum
    url: 'https://biblehub.com/commentaries/kad/nahum/2.htm'
    quote: 'without any one terrifying, hence in perfect rest and security, and undisturbed might'

  # ---- christ ----
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'As modern translations read verse 2, the Lord is restoring Jacob''s majesty'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Nahum%202&version=NRSVUE'
    quote: '(For the Lord is restoring the majesty of Jacob, as well as the majesty of Israel'
  - where: christ
    claim: 'Rasmussen: the chapter typifies the destruction of all evil'
    key: rasmussen-nahum-1962
    url: 'https://scripturecentral.org/archive/periodicals/magazine-article/nahum-poet-prophet'
    quote: 'told in terms that typify the destruction of all evil'
