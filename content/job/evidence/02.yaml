chapter: 2
claims:
  - where: 'setting'
    claim: 'With chapter 3 the book moves from prose narrative to poetic dialogue'
    key: ot-minute-job-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-1-3'
    quote: 'At this point, the book of Job transitions from a prose narrative to a poetic dialogue between Job and his friends.'
  - where: 'thread'
    claim: 'Satan does not appear again in the book after chapter 2'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/2.htm'
    quote: 'Satan does not appear again throughout the whole book.'
  - where: 'thread'
    claim: 'Satan’s contention about Job was shown wrong in 2:10'
    key: ot-manual-job
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-3?lang=eng'
    quote: 'Our author succinctly concluded, ‘In all this did not Job sin with his lips’ (2:10). Thus, Satan’s contention was demonstrably wrong, Job’s faith had not and did not fail'
  - where: 'section 1 plain'
    claim: '“Perfect” is “blameless” in the Hebrew (the Church’s footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/2?lang=eng'
    quote: '“perfect”: HEB blameless.'
  - where: 'section 2 plain'
    claim: 'The “foolish” of 2:10 is senseless in religion and morals, impious'
    key: bdb
    url: 'https://biblehub.com/hebrew/5036.htm'
    quote: 'foolish, senseless, especially of the man who has no perception of ethical and religious claims'

  - where: 'note 2:3 “Without cause”'
    claim: 'ḥinnām in Job 2:3 means without cause, undeservedly, of groundless attack'
    key: bdb
    url: 'https://biblehub.com/hebrew/2600.htm'
    quote: 'c. gratuitously, without cause, undeservedly, especially of groundless hostility or attack, … Job 2:3'
  - where: 'note 2:3 “Without cause”'
    claim: 'The Hebrew word in 2:3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'חִנָּֽם'
  - where: 'note 2:3 “Without cause”'
    claim: 'Job never learns in the narrative why this happened to him; readers wrestle with the uncertainty'
    key: ot-minute-job-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-1-3'
    quote: 'Job never finds out in the narrative why this has happened to him, and that is an important part of the story.'
  - where: 'note 2:3 “Without cause”'
    claim: 'The reader knows from the prologue that the friends’ assumption of sin does not apply to Job'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'However, the reader knows from the Prologue that it does not apply to Job'
  - where: 'note 2:3 “Without cause”'
    claim: 'The Lord does not really bargain with Satan; the conversations are poetic and emphasize Satan’s role as adversary'
    key: seminary-ot-teacher-107
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-107-job-1-16?lang=eng'
    quote: 'The conversations between the Lord and Satan in the book of Job are presented in a poetic narrative that emphasizes Satan’s role as our adversary. In reality, the Lord has power over Satan and has no need to bargain with him.'

  - where: 'note 2:4 “Skin for skin”'
    claim: '“Skin for skin” is apparently a proverbial phrase of barter, meaning everything has its price; interpretations vary'
    key: bdb
    url: 'https://biblehub.com/hebrew/5785.htm'
    quote: 'Job 2:4 skin in behalf of, for, skin, apparently proverb. phrase of barter, = everything has its price (on varieties of interpretation see Commentaries).'
  - where: 'note 2:4 “Skin for skin”'
    claim: 'The Greek translation: a man will give all he has as a ransom for his life'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/job/2.htm'
    quote: '4And the devil answered and said to the Lord, Skin for skin, all that a man has will he give as a ransom for his life.'
  - where: 'note 2:4 “Skin for skin”'
    claim: 'Satan claimed that if Job were afflicted physically he would curse the Lord'
    key: seminary-ot-teacher-107
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-107-job-1-16?lang=eng'
    quote: '(Satan claimed that if Job were afflicted physically, then Job would curse the Lord.)'

  - where: 'note 2:6 “Satan’s reach has a limit”'
    claim: 'In 1:12 Satan could afflict what Job had but not Job; in 2:6 he could afflict Job physically but not kill him'
    key: seminary-ot-teacher-107
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-107-job-1-16?lang=eng'
    quote: '(Satan was allowed to afflict all that Job had, but he was not allowed to harm Job.)'
  - where: 'note 2:6 “Satan’s reach has a limit”'
    claim: 'In 2:6 the Lord allowed Satan to afflict Job physically but not kill him'
    key: seminary-ot-teacher-107
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-107-job-1-16?lang=eng'
    quote: 'What did the Lord allow Satan to do? (Afflict Job physically but not kill him.)'
  - where: 'note 2:6 “Satan’s reach has a limit”'
    claim: 'The manual’s lesson from 2:6: as long as we are faithful, the Lord will not let Satan try us beyond what we can overcome (1 Cor. 10:13)'
    key: seminary-ot-teacher-107
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-107-job-1-16?lang=eng'
    quote: 'As long as we are faithful to the Lord, He will never allow Satan to tempt or try us more than we are able to overcome (see 1 Corinthians 10:13).'
  - where: 'note 2:6 “Satan’s reach has a limit”'
    claim: 'Faust quotes Joseph Smith: the devil has no power over us only as we permit him'
    key: faust-forces-save
    url: 'https://www.churchofjesuschrist.org/study/ensign/2007/01/the-forces-that-will-save-us?lang=eng'
    quote: 'The power to resist Satan may be stronger than we realize. The Prophet Joseph Smith taught: “All beings who have bodies have power over those who have not. The devil has no power over us only as we permit him.'
  - where: 'note 2:6 “Satan’s reach has a limit”'
    claim: 'Faust quotes Joseph Smith on the bounds of wicked spirits; Satan is not all-powerful'
    key: faust-forces-save
    url: 'https://www.churchofjesuschrist.org/study/ensign/2007/01/the-forces-that-will-save-us?lang=eng'
    quote: 'He also stated, “Wicked spirits have their bounds, limits, and laws by which they are governed.” So Satan and his angels are not all-powerful.'

  - where: 'note 2:8 “Among the ashes”'
    claim: 'Boils are a very painful skin condition; a potsherd is a piece of broken pottery used to scrape the skin'
    key: seminary-ot-teacher-107
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-107-job-1-16?lang=eng'
    quote: 'You may want to explain that a potsherd is a piece of broken pottery. Job was using the potsherd to try to scrape off his diseased skin.'
  - where: 'note 2:8 “Among the ashes”'
    claim: 'One older reading: sitting among ashes is for deep sorrow at his losses, above all his children (compare Jonah 3:6)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/2.htm'
    quote: 'Sitting among ashes is on account of the deep sorrow (comp. Jonah 3:6) into which Job is brought by his heavy losses, especially the loss of his children.'
  - where: 'note 2:8 “Among the ashes”'
    claim: 'The Greek translation: he sat on a dung-heap outside the city'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/job/2.htm'
    quote: '8And he took a potsherd to scrape away the discharge, and sat upon a dung-heap outside the city.'
  - where: 'note 2:8 “Among the ashes”'
    claim: 'The Church’s footnote links the ashes of 2:8 to Job 42:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/2?lang=eng'
    quote: '“ashes”: Job 42:6; Matt. 11:21; Mosiah 11:25.'

  - where: 'note 2:9 “Job’s wife”'
    claim: 'The Hebrew of 2:3 and 2:9 uses the same participle “holding fast” with “integrity”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'מַחֲזִ֣יק'
  - where: 'note 2:9 “Job’s wife”'
    claim: 'tummāh means integrity; in Job it stands at 2:3, 2:9, 27:5 and 31:6'
    key: bdb
    url: 'https://biblehub.com/hebrew/8538.htm'
    quote: '[תֻּמָּה] noun feminine integrity (late); — construct תֻּמַּת Proverbs 11:3; suffix תֻּמָּתִי Job 27:5; Job 31:6; תֻּמָּתֶ֑ךָ Job 2:9; תֻּמְּתוֺ Job 2:3.'
  - where: 'note 2:9 “Job’s wife”'
    claim: 'Job’s wife mediates Satan’s desire that Job curse God (one Latter-day Saint reading)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'After Job is afflicted with the sores, his wife invites him to “curse God and die,” thus mediating the desire of Satan (Job 1:11, 2:5).'
  - where: 'note 2:9 “Job’s wife”'
    claim: 'To be fair to her: she sees the misfortune as Job’s failure, as Job had hoped his integrity would prevent calamity; like the friends'
    key: ot-minute-job-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-1-3'
    quote: 'She sees this misfortune as the result of a failure on Job’s part. To be fair to Job’s wife, this has really been Job’s perspective as well; Job hoped that his integrity and his righteousness would stave off just such a calamity. His wife, like his friends, assumes'
  - where: 'note 2:9 “Job’s wife”'
    claim: 'The Greek gives her a long speech: the children she bore in vain, and her wandering as a servant'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/job/2.htm'
    quote: 'for, behold, thy memorial is abolished from the earth, even thy sons and daughters, the pangs and pains of my womb which I bore in vain with sorrows; … and I am a wanderer and a servant from place to place and house to house'

  - where: 'note 2:10 “Good and evil from God’s hand”'
    claim: 'The same Hebrew word stands in 2:10 (“evil”) and 2:11 (“all this evil”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'הָ/רָעָ֣ה'
  - where: 'note 2:10 “Good and evil from God’s hand”'
    claim: 'The 2026 seminary manual: in 2:10 Job understood that trials are part of God’s plan'
    key: ot-seminary-2026-job-1-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-manual-2026/32-job/321-job-1-13?lang=eng'
    quote: 'Students might point out that Job acknowledged his blessings had come from God (see Job 1:21), understood that trials are a part of God’s plan (see Job 2:10)'
  - where: 'note 2:10 “Good and evil from God’s hand”'
    claim: 'The Church’s footnote sets 2:10 beside 2 Ne. 2:11 and D&C 122:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/2?lang=eng'
    quote: '“good”: Matt. 5:45; 2 Ne. 2:11; D&C 29:39; 122:7 (5–9).'
  - where: 'note 2:10 “Good and evil from God’s hand”'
    claim: 'nābāl: senseless in religion and morals; the fool who denies God in Ps. 14:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/5036.htm'
    quote: 'foolish, senseless, especially of the man who has no perception of ethical and religious claims, and with collateral idea of ignoble, disgraceful; … feminine plural נְבָלוֺת Job 2:10'
  - where: 'note 2:10 “Good and evil from God’s hand”'
    claim: 'BDB: the nābāl as the fool denying God, Ps. 14:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/5036.htm'
    quote: 'characterized as at once irreligious and churlish, Isaiah 32:6; denying God Psalm 14:1 = Psalm 53:2'
  - where: 'note 2:10 “Good and evil from God’s hand”'
    claim: 'Stirling reads Job’s answer as ambiguous, unlike his blessing in chapter 1, suggesting his wife voiced a question raging in Job'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'This response is ambiguous — much different from Job’s blessing of God after the first series of calamities. Job’s irritation at his wife, combined with his hiding behind a seemingly rhetorical question, suggest that his wife has actually expressed an existential question now raging inside Job.'

  - where: 'note 2:11 “The three friends and their homes”'
    claim: 'The friends come from outside Israel: Teman in Edom; Bildad from Shuah, likely Arabia (Gen. 25:1–2); Zophar’s Naamah unknown, like Uz; so the book could apply to everyone'
    key: sc-knowhy-864
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-job-apply-to-everyone'
    quote: 'Job’s friends, Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite (Job 2:11), are also all from outside the land of Israel. Teman, where Eliphaz is from, is in Edom. Bildad, as a descendant of Shuah, is likely from Arabia'
  - where: 'note 2:11 “The three friends and their homes”'
    claim: 'Zophar’s home is unknown, like Uz; the message could apply to everyone'
    key: sc-knowhy-864
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-job-apply-to-everyone'
    quote: 'Zophar’s place of origin, Naaman, is so obscure that nobody is sure where it is, similar to Uz.'
  - where: 'note 2:11 “The three friends and their homes”'
    claim: 'Uz outside Israel means the message could apply to everyone'
    key: sc-knowhy-864
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-job-apply-to-everyone'
    quote: 'meaning that the message of the book need not apply only to people who were in or from Judah, but could apply to everyone.'
  - where: 'note 2:11 “The three friends and their homes”'
    claim: 'In Genesis 36, in the list of Esau’s (Edom’s) descendants, Eliphaz is the father of Teman'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/36?lang=eng'
    quote: 'And the sons of Eliphaz were Teman, Omar, Zepho, and Gatam, and Kenaz.'
  - where: 'note 2:11 “The three friends and their homes”'
    claim: 'Jeremiah’s oracle on Edom asks whether wisdom is gone from Teman'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/49?lang=eng'
    quote: 'Concerning Edom, thus saith the Lord of hosts; Is wisdom no more in Teman? is counsel perished from the prudent? is their wisdom vanished?'

  - where: 'note 2:13 “Seven days of silence”'
    claim: 'The 2026 seminary manual: before accusing, the friends first came to mourn and comfort; it sets 2:11–13 beside Mosiah 18:8–10'
    key: ot-seminary-2026-job-1-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-manual-2026/32-job/321-job-1-13?lang=eng'
    quote: 'Though they eventually accused Job of sinning, his friends first came to mourn with Job and comfort him. Students could read Job 2:11–13, looking for what impresses them about Job’s friends. Students could cross-reference these verses with Mosiah 18:8–10'
  - where: 'note 2:13 “Seven days of silence”'
    claim: 'One older reading: dust thrown toward heaven is the outward sign of intense suffering, a cry to heaven'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/2.htm'
    quote: 'The casting up of dust on high is the outwards sign of intense suffering, and, as von Gerlach rightly remarks, of that which causes him to cry to heaven.'
  - where: 'note 2:13 “Seven days of silence”'
    claim: 'One older reading: the silence was not prescribed custom but the force of the impression and fear of annoying the sufferer'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/2.htm'
    quote: 'Ewald erroneously thinks that custom and propriety prescribed this seven days’ silence; it was (as Ezekiel 3:15) the force of the impression produced on them, and the fear of annoying the sufferer.'
  - where: 'note 2:13 “Seven days of silence”'
    claim: 'The friends came with good intentions but became more intent on correcting Job than on comforting him'
    key: ot-minute-job-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-1-3'
    quote: 'Job’s three friends, Eliphaz, Bildad, and Zophar, come with good intentions. … However, they forget their initial purpose and become more intent on correcting what they see as incorrect or even blasphemous thinking than on comforting and mourning with Job.'

  - where: 'christ'
    claim: 'A Latter-day Saint author parallels 2:6 with the Father allowing Christ to be tried (Heb. 2:18; 4:15)'
    key: farley-job-parallels
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/10/job-parallels-with-the-savior?lang=eng'
    quote: 'The early chapters of Job record that Satan was allowed to tempt him: “And the Lord said unto Satan, Behold, he is in thine hand; but save his life” (Job 2:6). The Father also allowed Christ to be tried'
  - where: 'christ'
    claim: 'The Savior, good and sinless, was allowed to be tried and afflicted'
    key: farley-job-parallels
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/10/job-parallels-with-the-savior?lang=eng'
    quote: 'perhaps there are answers in his parallel with the Savior, who was so good and sinless, yet who was also allowed to be tried and afflicted.'
  - where: 'christ'
    claim: 'Satan and his angels are not all-powerful; wicked spirits have bounds'
    key: faust-forces-save
    url: 'https://www.churchofjesuschrist.org/study/ensign/2007/01/the-forces-that-will-save-us?lang=eng'
    quote: 'So Satan and his angels are not all-powerful.'
  - where: 'christ'
    claim: 'The baptismal covenant includes willingness to mourn with those that mourn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/18?lang=eng'
    quote: 'Yea, and are willing to mourn with those that mourn; yea, and comfort those that stand in need of comfort'
