chapter: 1
claims:
  # setting
  - where: setting
    claim: 'The author of Job is unknown'
    key: seminary-intro-job
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job?lang=eng'
    quote: 'We do not know who wrote the book of Job.'
  - where: setting
    claim: 'When and where the book was written is unknown'
    key: seminary-intro-job
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job?lang=eng'
    quote: 'We do not know when or where the book of Job was written.'
  - where: setting
    claim: 'Poetry with a prose prologue and epilogue; wisdom literature; asks why the righteous choose righteousness and why they suffer'
    key: seminary-intro-job
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job?lang=eng'
    quote: 'The book of Job is written almost entirely in poetic language, with a prologue and an epilogue in prose, and is often classified as wisdom literature. One of the book’s most unique qualities is that it asks two difficult questions—“Why do righteous people choose righteousness?” and “Why do the righteous suffer?”'
  - where: setting
    claim: 'Elihu speaks in chapters 32–37'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'Job 32–37 contains the speeches of Elihu'
  - where: setting
    claim: 'Job was a real person, but his life is told with poetic elements, among them the two conversations of the Lord and Satan'
    key: ot-seminary-2026-job-1-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-manual-2026/32-job/321-job-1-13?lang=eng'
    quote: 'It is important to understand that Job was a real person (see Doctrine and Covenants 121:10), but Job’s life is told using some poetic elements. For example, as Job’s story begins, the Lord and Satan are described as having two conversations.'
  - where: setting
    claim: 'Scripture and modern revelation show Job was a real person (Ezekiel, James, D&C 121)'
    key: seminary-ot-teacher-107
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-107-job-1-16?lang=eng'
    quote: 'both ancient scripture and modern revelation clarify that Job was a real person who went through very real suffering (see Ezekiel 14:14, 20; James 5:11; D&C 121:10).'
  - where: setting
    claim: 'Job never learns in the story why he suffered'
    key: ot-minute-job-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-1-3'
    quote: 'Job never finds out in the narrative why this has happened to him, and that is an important part of the story.'
  - where: setting
    claim: 'The prologue shows the reader that Job’s suffering is innocent, not the result of his sin'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'We know from the Prologue that Job’s suffering is innocent, not the result of personal sin, although this will subsequently be disputed ever more vociferously by the “friends.”'

  # thread
  - where: thread
    claim: 'The question between the Lord and Satan: is Job pious because he is prosperous?'
    key: frederick-old-wine
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/old-wine-new-bottles'
    quote: 'In other words, is Job prosperous because he is pious, or is he pious because he is prosperous? If he loses his prosperity, will his piety fall away as well?'

  # note 1:1
  - where: 'note 1:1 “A man in Uz, perfect and upright”'
    claim: 'Uz: probably east of Palestine and north of Edom'
    key: bd-uz
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/uz?lang=eng'
    quote: 'Land of Job, probably east of Palestine and north of Edom (Job 1:1; Jer. 25:20; Lam. 4:21).'
  - where: 'note 1:1 “A man in Uz, perfect and upright”'
    claim: 'No one is sure where Uz is; it lay outside Israel, so the book can apply to everyone; the friends also come from outside Israel'
    key: sc-knowhy-864
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-job-apply-to-everyone'
    quote: 'Nobody is sure where Uz is, and that appears to be part of the point. Uz was some obscure place which was apparently not in Israel proper, meaning that the message of the book need not apply only to people who were in or from Judah, but could apply to everyone.'
  - where: 'note 1:1 “A man in Uz, perfect and upright”'
    claim: 'Job’s three friends are also from outside the land of Israel'
    key: sc-knowhy-864
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-job-apply-to-everyone'
    quote: 'Job’s friends, Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite (Job 2:11), are also all from outside the land of Israel.'
  - where: 'note 1:1 “A man in Uz, perfect and upright”'
    claim: 'The Hebrew word for “perfect” is tām'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'תָּ֧ם'
  - where: 'note 1:1 “A man in Uz, perfect and upright”'
    claim: 'tām means complete'
    key: bdb
    url: 'https://biblehub.com/bdb/8535.htm'
    quote: 'תָּם adjective complete'
  - where: 'note 1:1 “A man in Uz, perfect and upright”'
    claim: '“Perfect” does not mean sinless; it implies Job faithfully kept the commandments of God'
    key: seminary-ot-teacher-107
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-107-job-1-16?lang=eng'
    quote: 'the word perfect in verse 1 does not mean Job was without sin. Rather it implies that Job faithfully kept the commandments of God. Those who keep the commandments and endure to the end will eventually be made perfect through the Atonement of Jesus Christ.'
  - where: 'note 1:1 “A man in Uz, perfect and upright”'
    claim: 'The phrases describe integrity, a relationship with God, avoiding harm to others'
    key: ot-minute-job-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-1-3'
    quote: 'The scriptures describe Job as a man who has integrity (“perfect”), has a relationship with God (“fears God”), and avoids doing harm to others (“eschewed evil”).'
  - where: 'note 1:1 “A man in Uz, perfect and upright”'
    claim: 'Because of the prologue the reader knows Job’s suffering is innocent, which the friends will dispute'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'We know from the Prologue that Job’s suffering is innocent, not the result of personal sin, although this will subsequently be disputed ever more vociferously by the “friends.”'

  # note 1:5 offerings
  - where: 'note 1:5 “Priest of his own house”'
    claim: 'Job as father is the priest of his house, a mark of the age before the law; the burnt offering here, as at 42:8, is an offering for sin'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/1.htm'
    quote: 'The fact that Job, as father of the family, is the Cohen of his house, … is also characteristic of the age prior to the law. … עולה here, as also Job 42:8, appears distinctly as an expiatory offering'
  - where: 'note 1:5 “Priest of his own house”'
    claim: 'Job’s concern reached his children’s hearts, not only their outward conduct'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/1.htm'
    quote: 'In Job''s family, therefore, there was an earnest desire for sanctification, which was far from being satisfied with mere outward propriety of conduct.'
  - where: 'note 1:5 “Priest of his own house”'
    claim: 'Job’s sacrifices show care for his children, and also the assumption that righteousness will shield his family, which the book will test'
    key: ot-minute-job-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-1-3'
    quote: 'We can find this commendable since Job cares deeply about his children’s welfare and knows that God is the only one who can ensure their safety. However, … Job assumes that his relationship with God will shield him and his family from misfortune as long as he is righteous.'

  - where: 'note 1:5 “Priest of his own house”'
    claim: 'The events of the day shatter Job’s assumption'
    key: ot-minute-job-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-1-3'
    quote: 'Remember, Job has built his life around the fact that God will bless him and prevent misfortune from happening. The events of this day shatter this illusion.'

  # note 1:5 bless
  - where: 'note 1:5 “Cursed, or blessed?”'
    claim: 'The Hebrew verb in 1:5 is bērēk, “bless”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'וּ/בֵרֲכ֥וּ'
  - where: 'note 1:5 “Cursed, or blessed?”'
    claim: 'BDB: “bless” with the opposite meaning “curse,” from the parting greeting or rather a blessing overdone; at Job 1:5, 11; 2:5, 9; 1 Kgs 21:10, 13; Ps 10:3'
    key: bdb
    url: 'https://biblehub.com/bdb/1288.htm'
    quote: 'bless, with the antithetical meaning curse (Thes) from the greeting in departing, saying adieu to, taking leave of; but rather a blessing overdone and so really a curse as in vulgar English as well as in the Shemitic cognates: 1 Kings 21:10,13; Job 1:5,11; Job 2:5,9; Psalm 10:3.'

  # note 1:6
  - where: 'note 1:6 “The council and the adversary”'
    claim: 'The conversations likely do not describe an actual interaction; a poetic way of conveying Satan’s role as adversary; God has power over Satan'
    key: scripture-helps-job
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/31-job-1-3-12-14-19-21-24-38-40-42?lang=eng'
    quote: 'The conversations between the Lord and Satan in the book of Job likely do not describe an actual interaction between them. These conversations are best understood as a poetic way of conveying Satan’s role as our adversary. … it is important to remember that God has power over Satan.'
  - where: 'note 1:6 “The council and the adversary”'
    claim: 'The Lord does not really make agreements with Satan and has no need to bargain with him'
    key: seminary-ot-teacher-107
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-107-job-1-16?lang=eng'
    quote: 'the Lord does not really make agreements with Satan. The conversations between the Lord and Satan in the book of Job are presented in a poetic narrative that emphasizes Satan’s role as our adversary. In reality, the Lord has power over Satan and has no need to bargain with him.'
  - where: 'note 1:6 “The council and the adversary”'
    claim: 'The conversations may be a poetic way of preparing the reader for what follows'
    key: ot-seminary-2026-job-1-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-manual-2026/32-job/321-job-1-13?lang=eng'
    quote: 'These are not actual interactions between the Lord and Satan but illustrate Satan’s role as our adversary or enemy. They could be a poetic way of preparing the reader for what follows in Job’s life'
  - where: 'note 1:6 “The council and the adversary”'
    claim: 'The heavenly court is often called the divine council by scholars; it is composed of the sons of God'
    key: ot-minute-job-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-1-3'
    quote: 'After having introduced us to Job, the text shifts focus to God in His heavenly court. This heavenly court is often referred to by scholars as the divine council. This council is composed of the “sons of God,” who help God govern the earth.'
  - where: 'note 1:6 “The council and the adversary”'
    claim: 'JST reads “children of God” at 1:6; the Hebrew says “the Satan,” which may indicate an adversarial member of the council rather than Satan himself'
    key: scripture-helps-job
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/31-job-1-3-12-14-19-21-24-38-40-42?lang=eng'
    quote: 'In the Hebrew and some other translations, Satan is called “the Satan.” This may indicate that the adversary in this account was an adversarial member of the divine council rather than Satan himself'
  - where: 'note 1:6 “The council and the adversary”'
    claim: 'The Joseph Smith Translation of 1:6 reads “children”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/1?lang=eng'
    quote: 'JST Job 1:6'
  - where: 'note 1:6 “The council and the adversary”'
    claim: 'The Hebrew is haśśāṭān, with the article'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'הַ/שָּׂטָ֖ן'
  - where: 'note 1:6 “The council and the adversary”'
    claim: 'hassatan means “the adversary,” describing the devil’s role; Satan became the adversary after rebelling in the Council in Heaven'
    key: seminary-ot-teacher-107
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-107-job-1-16?lang=eng'
    quote: 'Satan, who became the adversary of mankind following his rebellion during the Council in Heaven … these verses in Job 1 use the form hassatan, meaning “the adversary,” which describes the devil’s role here.'
  - where: 'note 1:6 “The council and the adversary”'
    claim: 'Satan could afflict all Job had but not Job himself'
    key: seminary-ot-teacher-107
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-107-job-1-16?lang=eng'
    quote: 'Satan was allowed to afflict all that Job had, but he was not allowed to harm Job.'

  # note 1:7
  - where: 'note 1:7 “To and fro in the earth”'
    claim: 'D&C 10:27 alludes to Job 1:7; the Satan of D&C 10 is the enemy who seeks to destroy souls; the allusion is to Satan in general, not a test arranged over the 116 pages'
    key: frederick-old-wine
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/old-wine-new-bottles'
    quote: 'The Satan described in D&C 10 is closer to the Satan familiar from the New Testament, the enemy of humanity who seeks to “lead their souls to destruction” … the likely placement of the allusion to Job 1:7 in D&C 10:27 is to allude to Satan in general'
  - where: 'note 1:7 “To and fro in the earth”'
    claim: 'In Job, Satan has a defined role, though not perhaps the one he has in later Christian texts'
    key: frederick-old-wine
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/old-wine-new-bottles'
    quote: 'represents one of the few passages in the Old Testament where Satan appears to have a defined role, although not perhaps the one he assumes in later Christian texts.'

  - where: 'note 1:7 “To and fro in the earth”'
    claim: 'D&C 10 was given after the loss of the 116 pages, and alludes to Job 1:7 at 10:27'
    key: frederick-old-wine
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/old-wine-new-bottles'
    quote: 'The loss of the 116 pages by Martin Harris and the instruction received by Joseph to not retranslate the lost portion provide the immediate context for the allusion to Job 1:7 in D&C 10:27.'
  - where: 'note 1:7 “To and fro in the earth”'
    claim: 'The allusion does not mean the loss of the pages was a test conceived by God and Satan'
    key: frederick-old-wine
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/old-wine-new-bottles'
    quote: 'does this intertextual connection open the door to the possibility of understanding Joseph’s loss of the 116 pages as the result of a “test” conceived by God and Satan? Probably not'

  # note 1:9
  - where: 'note 1:9 “Serving God for nothing”'
    claim: 'The Hebrew word in 1:9 is ḥinnām'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'הַֽ/חִנָּ֔ם'
  - where: 'note 1:9 “Serving God for nothing”'
    claim: 'ḥinnām: gratis, for nothing, “serve for nought” (Gen 29:15; Job 1:9)'
    key: bdb
    url: 'https://biblehub.com/bdb/2600.htm'
    quote: 'a. gratis, gratuitously, for nothing, עָבַד חִנָּם to serve for nought Genesis 29:15; Job 1:9'
  - where: 'note 1:9 “Serving God for nothing”'
    claim: 'At Job 2:3 the same word means “without cause, undeservedly”'
    key: bdb
    url: 'https://biblehub.com/bdb/2600.htm'
    quote: 'c. gratuitously, without cause, undeservedly, especially of groundless hostility or attack, … Job 2:3'
  - where: 'note 1:9 “Serving God for nothing”'
    claim: 'Satan’s claim: Job worshipped only because the Lord protected and blessed him'
    key: seminary-ot-teacher-107
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-107-job-1-16?lang=eng'
    quote: 'Satan claimed that Job feared or worshipped the Lord only because the Lord had protected and blessed Job.'
  - where: 'note 1:9 “Serving God for nothing”'
    claim: 'The book asks why the righteous choose righteousness'
    key: seminary-intro-job
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job?lang=eng'
    quote: 'it asks two difficult questions—“Why do righteous people choose righteousness?” and “Why do the righteous suffer?”—but offers no simple answers.'
  - where: 'note 1:9 “Serving God for nothing”'
    claim: 'Job’s suffering is innocent'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'We know from the Prologue that Job’s suffering is innocent, not the result of personal sin'

  - where: 'note 1:9 “Serving God for nothing”'
    claim: 'Satan thinks Job’s relationship with God is a transaction'
    key: ot-minute-job-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-1-3'
    quote: 'Satan thinks that Job’s relationship with God is just a transaction.'

  # note 1:16
  - where: 'note 1:16 “Raiders, fire and wind”'
    claim: 'Two bands of human raiders, fire from heaven and a great wind; in Stirling’s reading the book is ambiguous about God’s or Satan’s relation to these disasters'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Two different bands of marauding humans destroy some flocks and servants. “Fire from heaven” completes their destruction, while a great wind destroys Job’s children. The book of Job is ambiguous about the precise relationship of either God or Satan to these natural and human-initiated disasters.'
  - where: 'note 1:16 “Raiders, fire and wind”'
    claim: 'Job’s suffering is caused by others’ sins or natural disasters'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'when we look directly at Job’s suffering, it is caused either by the sins of other humans or natural disasters'
  - where: 'note 1:16 “Raiders, fire and wind”'
    claim: 'Job, like others in the Old Testament, sees everything as God’s doing'
    key: ot-minute-job-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-1-3'
    quote: 'Job, like others in the Old Testament, sees everything as God’s doing. So when he is told of all the terrible things that have happened, he knows without being told so that God has done it.'
  - where: 'note 1:16 “Raiders, fire and wind”'
    claim: 'Satan was allowed to afflict all Job had'
    key: seminary-ot-teacher-107
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-107-job-1-16?lang=eng'
    quote: 'Satan was allowed to afflict all that Job had, but he was not allowed to harm Job.'

  - where: 'note 1:16 “Raiders, fire and wind”'
    claim: 'Such suffering belongs to life in a risky world'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Such suffering, which Job experiences to an extreme degree, is part and parcel of life in this created, risky world, which is filled with people who voluntarily abuse others and which is subject to unpredictable natural events.'

  # note 1:21
  - where: 'note 1:21 “Blessed be the name of the LORD”'
    claim: 'Rising, rending the mantle, cutting the hair mark grief; falling with face to the earth is worship, not despair'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/1.htm'
    quote: 'The intensity of his feeling is indicated by rising up (cf. Jonah 3:6); his torn heart, by the rending of his mantle; the conscious loss of his dearest ones, by cutting off the hair of his head. He does not, however, act like one in despair, but, humbling himself under the mighty hand of God, falls to the ground'
  - where: 'note 1:21 “Blessed be the name of the LORD”'
    claim: 'At the fourth message, of his children, Job can no longer overcome his grief'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/1.htm'
    quote: 'The first three messengers Job has heard, sitting, and in silence; but at the news of the death of his children, brought by the fourth, he can no longer overcome his grief.'
  - where: 'note 1:21 “Blessed be the name of the LORD”'
    claim: '“Return thither” looks forward to the grave, the bosom of the earth'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/1.htm'
    quote: 'return to the bosom of mother earth … so that שׁמה is not so much retrospective as rather prospective with reference to the grave'
  - where: 'note 1:21 “Blessed be the name of the LORD”'
    claim: 'Job acknowledged that his blessings had come from God'
    key: ot-seminary-2026-job-1-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-manual-2026/32-job/321-job-1-13?lang=eng'
    quote: 'Students might point out that Job acknowledged his blessings had come from God (see Job 1:21)'
  - where: 'note 1:21 “Blessed be the name of the LORD”'
    claim: '“Charged God foolishly”: tiflah, unseemliness; did not ascribe unseemliness to God'
    key: bdb
    url: 'https://biblehub.com/bdb/8604.htm'
    quote: 'תִּפְלָה noun feminine (moral) unsavouriness, unseemliness; … ׳לֵא ׳לאֹ נָתַן ת Job 1:21 did not ascribe unseemliness to God'
  - where: 'note 1:21 “Blessed be the name of the LORD”'
    claim: 'The Hebrew word in 1:22 is tiflah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'תִּפְלָ֖ה'
  - where: 'note 1:21 “Blessed be the name of the LORD”'
    claim: 'Job initially takes it well, but by chapter 3 his pain is too great and such words ring hollow for him'
    key: ot-minute-job-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-1-3'
    quote: 'Job initially takes things well. He states that “the Lord gave, and the Lord hath taken away” (Job 1:21), and the narrative tells us that Job had not sinned. However, by the time that chapter 3 rolls around, Job’s pain and loss has become so unbearable'

  # christ
  - where: christ
    claim: 'Job’s sacrifices and sanctifying of his children anticipate Christ’s sacrifice; Job as mediator, Christ the one mediator (Parry’s reading)'
    key: parry-job-type
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-suffering-servant-type-jesus-christ'
    quote: 'Job offered sacrifices and sanctified his children (Job 1:1, 5), anticipating Jesus’s infinite sacrifice and the sanctification of those who will become his sons and daughters. Job served as a mediator between God and his children and friends (Job 1:5; 42:8)'
  - where: christ
    claim: 'A true relationship with God is a bond of trust in uncertainty, not a transaction'
    key: ot-minute-job-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-1-3'
    quote: 'One of the central messages of Job is that a true relationship with God is not a transaction based on certainty but a bond based on trust in the face of uncertainty.'
  - where: christ
    claim: 'Job acknowledged his blessings came from God'
    key: ot-seminary-2026-job-1-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-manual-2026/32-job/321-job-1-13?lang=eng'
    quote: 'Students might point out that Job acknowledged his blessings had come from God (see Job 1:21)'

  # explore
  - where: explore
    claim: 'Tanner’s essay on the book: accepts Job’s existence and reads the book’s literary shape'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'In the absence of clear pronouncements by scripture or Church leaders to the contrary, I accept the fact of Job’s existence. At the same time, I recognize that the text bears the marks of evident literary fashioning.'
