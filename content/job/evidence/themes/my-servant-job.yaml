  - where: 'section “A man of sorrows”'
    claim: 'Connection made by this page: Job 19:21 (“the hand of God hath touched me”) and Isa. 53:4 (“stricken, smitten of God”) share the verb nāgaʿ; the “we” of Isa. 53:4, who took the Servant for one struck by God, stand where Job’s friends stand (4:7; 22:5), so that the book of Job shows at length the misjudgment Isaiah states in a line; the chief priests’ taunt at the cross (Matt. 27:43) is the same reasoning; in both books the onlookers learn they were wrong (Job 42:7; Isa. 53:5) and are spared through the one they misjudged. Delitzsch draws 16:17 with Isa. 53:9 and 16:10 with Isa. 50:6; the rest is the page’s.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/53?lang=eng'
    quote: 'yet we did esteem him stricken, smitten of God, and afflicted.'
  - where: 'section “Job opened his mouth”'
    claim: 'Job 3:1 has the verb pātaḥ (H6605) with “his mouth”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'פָּתַ֤ח'
  - where: 'section “Job opened his mouth”'
    claim: 'Isa. 53:7 has the same verb, negated, with “his mouth,” twice'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'יִפְתַּח'
