    claim: 'Connection made by this page: the LORD’s acceptance of His servant (“my servant” before and after; “for him will I accept,” 42:8) is the one part of the type that does not fall short, and it is the LORD’s act and not Job’s. The restoration is a gift (42:10), not a wage. How 42:8 is a likeness of Christ’s advocacy is argued on the page “A Daysman Betwixt Us,” not here.'
