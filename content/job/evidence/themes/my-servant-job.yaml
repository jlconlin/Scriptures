    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/10/job-parallels-with-the-savior?lang=eng'
    quote: 'brought to a fullness the limited suffering of mind and body of which Job, in his misery, had but a foretaste.'
  - where: 'section “Without cause”'
    claim: 'Connection made by this page: Job’s wounds were “without cause” (2:3; 9:17) and the Servant’s were “for our transgressions” (Isa. 53:5), so the friends’ particular claim, that this man’s wounds were for transgression, is false of Job and true of the Servant, with the transgression ours; Job’s suffering did nothing for his children or the friends; Ezek. 14:14, 20 (where to deliver one’s soul is to survive the judgment on a land, and nothing is said of Job’s children) shows Job’s righteousness reaching no one but himself, and Isa. 53:11 says the righteous Servant justifies many; Alma 34:10–14 gives the doctrine, that no man’s blood atones for another and the sacrifice is the Son of God, infinite and eternal, and the page reads Job as the case that shows it. The page does not say Job’s suffering atoned for or accomplished anything for others.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/34?lang=eng'
    quote: 'there is not any man that can sacrifice his own blood which will atone for the sins of another'
