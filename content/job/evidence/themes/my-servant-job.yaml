page: my-servant-job
claims:
  - where: 'opening'
    claim: 'The Topical Guide entry “Servant,” a general list of servants of every kind, includes Job 1:8'
    key: tg-servant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/servant?lang=eng'
    quote: 'Hast thou considered my servant Job, Job 1:8.'
  - where: 'opening'
    claim: 'The same entry lists Isa. 52:13'
    key: tg-servant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/servant?lang=eng'
    quote: 'my servant shall deal prudently, Isa. 52:13.'
  - where: 'opening'
    claim: 'The same entry lists Isa. 53:11'
    key: tg-servant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/servant?lang=eng'
    quote: 'shall my righteous servant justify many, Isa. 53:11'
  - where: 'opening'
    claim: 'The Church’s footnote at “servant” in Job 1:8 sends the reader to the Topical Guide’s “Servant”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/1?lang=eng'
    quote: 'TG Servant.'
  - where: 'opening'
    claim: 'The Church’s footnote at “servant” in Isa. 53:11 sends the reader to the same entry'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/53?lang=eng'
    quote: 'TG Servant.'
  - where: 'opening'
    claim: 'Farley: in Job’s life we find a type of the Savior’s traits'
    key: farley-job-parallels
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/10/job-parallels-with-the-savior?lang=eng'
    quote: 'in his life we find a type of some of the most distinctive and divine traits of the Savior.'
  - where: 'opening'
    claim: 'Parry: Job was a type of the suffering servant'
    key: parry-job-type
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-suffering-servant-type-jesus-christ'
    quote: 'Job was a type of the suffering servant, the man of grief.'
  - where: 'opening'
    claim: 'Stirling: many have rightly considered Job a type of Christ'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'many have rightly considered Job to be a type of Christ.'
  - where: 'opening'
    claim: 'Connection made by this page: Job, whom the LORD calls “my servant” before and after his suffering (1:8; 2:3; 42:7–8), is read against the Servant of Isaiah 50 and 53. Where he is like the Servant, his book shows at length what Isa. 53:4 says in a line (onlookers taking a blameless sufferer for one struck by God for his sin). Where he is unlike Him there are three differences, each marking something only Jesus Christ did: Job opened his mouth (3:1) and the Servant did not (Isa. 53:7); Job was blameless and not sinless (13:26); Job’s wounds were “without cause” (2:3; 9:17) and healed no one, where the Servant was wounded for our transgressions (Isa. 53:5). That Job is a type is Farley’s, Parry’s and Stirling’s reading; the argument from where the likeness breaks is the page’s.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/53?lang=eng'
    quote: 'yet he opened not his mouth'
  - where: 'section “A servant and a type”'
    claim: 'Farley: to call Job’s life a type is not to say he was manipulated to make an example'
    key: farley-job-parallels
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/10/job-parallels-with-the-savior?lang=eng'
    quote: 'To say that Job’s life is a type, then, is not to say he was manipulated to make an example'
  - where: 'section “A servant and a type”'
    claim: 'Farley: Job’s endurance and faith prefigure the Savior’s'
    key: farley-job-parallels
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/10/job-parallels-with-the-savior?lang=eng'
    quote: 'his endurance and faith were so significant that they prefigure the endurance and faith of the Savior.'
  - where: 'section “A servant and a type”'
    claim: 'Connection made by this page: a type is always less than what it figures, and Hebrews argues from the shortfalls of the sacrifices and the high priest (Heb. 7:27; 10:4) to Christ; the page reads Job the same way. Hebrews does not name Job.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/7?lang=eng'
    quote: 'first for his own sins, and then for the people’s'
  - where: 'section “A man of sorrows”'
    claim: 'Farley sets “none like him in the earth, a perfect and an upright man” (1:8) beside the Savior'
    key: farley-job-parallels
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/10/job-parallels-with-the-savior?lang=eng'
    quote: 'This is also an excellent description of the Savior. He was perfect, and his life and mission made him unlike any other man.'
  - where: 'section “A man of sorrows”'
    claim: 'Parry: Job’s blamelessness foreshadows Jesus’s sinlessness'
    key: parry-job-type
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-suffering-servant-type-jesus-christ'
    quote: 'Job’s uprightness emulates Jesus Christ’s excellence, and Job’s blamelessness foreshadows Jesus’s sinlessness.'
  - where: 'section “A man of sorrows”'
    claim: 'Farley sets Job 2:6 (Satan allowed to try Job) beside Heb. 2:18 and 4:15'
    key: farley-job-parallels
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/10/job-parallels-with-the-savior?lang=eng'
    quote: 'The Father also allowed Christ to be tried'
  - where: 'section “A man of sorrows”'
