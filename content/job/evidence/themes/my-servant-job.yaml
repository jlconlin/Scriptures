  - where: 'section “The iniquities of my youth”'
    claim: 'Farley: no mortal has lived the perfect life of the Savior'
    key: farley-job-parallels
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/10/job-parallels-with-the-savior?lang=eng'
    quote: 'No mortal has lived the kind of perfect life lived by the Savior, the only perfect being to walk the earth.'
  - where: 'section “The iniquities of my youth”'
    claim: 'Connection made by this page: Job can say the first half of Isa. 53:9 (“no violence,” Job 16:17) and not the second (“neither was any deceit in his mouth”; 1 Pet. 2:22), since he withdraws words of his own (42:3) and, on every reading of 42:6 given, has something to take back; the type himself looks for a redeemer (19:25); so the man of whom the LORD says there is “none like him in the earth” shows the distance between a very good man and One who “did no sin.” That Job was not without sin is Scripture Helps’ and Stirling’s statement.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/42?lang=eng'
    quote: 'therefore have I uttered that I understood not'
