  - where: 'section “Thou art not yet as Job”'
    claim: 'Connection made by this page: 1 Pet. 2:18–24, written to servants who suffer wrongfully, sets the example (no sin, no guile, no reviling) in the places where Job stopped short of the Servant, so that a disciple is asked to follow Christ further than Job went, and not at all in bearing sins; what Job and the disciple share with Christ is wrongful suffering, which is not a verdict and is not asked to atone (D&C 19:16); Job, who cried out and took back what he said amiss, was still called “my servant.” D&C 121:10 and 122:8, two revelations from Liberty Jail, measure Joseph Smith against Job and then against Christ, who descended below all. Peter does not name Job.'
