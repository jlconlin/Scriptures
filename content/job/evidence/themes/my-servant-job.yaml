    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'לְ/מַכִּ֔ים'
  - where: 'section “Job opened his mouth”'
    claim: 'President Uchtdorf: the Savior willingly took upon Himself the suffering of us all'
    key: uchtdorf-you-are-my-hands
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2010/04/you-are-my-hands?lang=eng'
    quote: 'our Savior willingly took upon Himself the pain and sickness and suffering of us all'
  - where: 'section “Job opened his mouth”'
    claim: 'Connection made by this page: Job 3:1 (“opened Job his mouth”) and Isa. 53:7 (“he opened not his mouth”) say opposite things with the same verb and noun; since the LORD never calls Job guilty and rebukes the friends who did (42:7), though Job retracted his charge against God’s justice (42:3; Eyring), a plea of innocence is no sin, and the Servant’s silence before His accusers (Matt. 27:12–14) was more than the absence of a sin: Job spoke in order to go free (13:18; 23:7); Jesus, who could have gone free (Matt. 26:53; John 10:18), did not plead, and the page reads “numbered with the transgressors” (Isa. 53:12) beside that silence as its own reading. In Job 16:10 others smite and Job suffers it, and in Isa. 50:6 the Servant gives His own back and cheeks: Job’s suffering came on him unchosen (1:13–19; 2:7) and Christ’s was chosen (John 10:18). The page builds nothing on the phrase being rare.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/3?lang=eng'
    quote: 'After this opened Job his mouth, and cursed his day.'
  - where: 'section “The iniquities of my youth”'
