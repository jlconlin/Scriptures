    key: ot-manual-job
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-3?lang=eng'
    quote: 'placed Job in the hands of this same Adversary with the words, ‘All that he hath is in thy power; only upon himself put not forth thine hand’ (Job 1:12).'
  - where: 'section “A man of sorrows”'
    claim: 'Farley: the Savior was king, lost prior status in His condescension, and was held “in derision”'
