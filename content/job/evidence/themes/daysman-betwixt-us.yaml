page: daysman-betwixt-us
claims:
  - where: 'opening'
    claim: 'A daysman is an umpire, arbiter or mediator'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/daysman'
    quote: 'DA''YSMAN, noun An umpire or arbiter; a mediator.'
  - where: 'opening'
    claim: 'Connection made by this page: Job’s four pleas (9:33; 16:19–21; 17:3; 19:25), read in order, work out from his need what a mediator between God and man would have to be; the book answers not by naming that person but by the LORD coming Himself and then making Job the intercessor for the three friends (42:7–10); the New Testament and the Doctrine and Covenants name the One the pleas describe. Job names no one.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/42?lang=eng'
    quote: 'and my servant Job shall pray for you: for him will I accept'
  - where: 'section “The man who stood between”'
    claim: 'The Church’s footnote at 5:1: the “saints” are “holy ones” in Hebrew'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/5?lang=eng'
    quote: 'HEB holy ones.'
  - where: 'section “The man who stood between”'
    claim: 'The “holy ones” of Job 5:1 are angels'
    key: bdb
    url: 'https://biblehub.com/hebrew/6918.htm'
    quote: 'c. angels, Psalm 89:6; Psalm 89:8; Job 5:1; Job 15:15; Zechariah 14:5; Daniel 8:13 (twice in verse).'
  - where: 'section “The man who stood between”'
    claim: 'Delitzsch on 9:32–33: God is accuser and judge in one person, with no arbitrator between'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/9.htm'
    quote: 'He, the Absolute Being, is accuser and judge in one person; there is between them no arbitrator'
  - where: 'section “What he asks for”'
    claim: '“Daysman” (9:33) is the Hiphil participle of yākaḥ (H3198)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'מוֹכִ֑יחַ'
  - where: 'section “What he asks for”'
    claim: '“Plead” (16:21) is the same verb, third person masculine singular (“and may he plead”), with no word for “one”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'וְ/יוֹכַ֣ח'
  - where: 'section “What he asks for”'
    claim: 'The lexicon lists 9:33 and 16:21 together under “decide, judge”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3198.htm'
    quote: 'with בּין, Genesis 31:37 (E), Job 9:33; לְגֶבֶר עִם אֱלוֺהַּ Job 16:21.'
  - where: 'section “What he asks for”'
    claim: 'Delitzsch reads God as the one who is to decide in 16:21, for a man against God: Job appeals from God to God'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/16.htm'
    quote: 'Job appeals from God to God; he hopes that truth and love will finally decide against wrath.'
  - where: 'section “What he asks for”'
    claim: 'Delitzsch: the verse asks for two decisions, one for Job against God and one for Job in relation to his human opponent'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/16.htm'
    quote: 'Job longs and hopes for two things from God: (1) that He would finally decide in favour of'
  - where: 'section “What he asks for”'
    claim: 'The second half of 16:21 begins with “and” in the Hebrew (“and a son of man”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'וּֽ/בֶן'
  - where: 'section “What he asks for”'
    claim: 'A modern translation that prints “as” notes that the Hebrew has “and”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2016&version=NRSVUE'
    quote: '16.21 Syr Vg Tg: Heb and'
  - where: 'section “What he asks for”'
    claim: '“Neighbour” (16:21) is rēaʿ (H7453)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'לְ/רֵעֵֽ/הוּ'
  - where: 'section “What he asks for”'
    claim: '“My friends” (16:20) is the same noun'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'רֵעָ֑/י'
  - where: 'section “What he asks for”'
    claim: 'The Church’s footnote at 17:3 glosses “Lay down now” as laying down a pledge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/17?lang=eng'
    quote: 'IE Lay down a pledge.'
  - where: 'section “What he asks for”'
    claim: 'A redeemer in Old Testament times was usually a relative who restored possessions, status or freedom'
    key: scripture-helps-job
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/31-job-1-3-12-14-19-21-24-38-40-42?lang=eng'
    quote: 'In Old Testament times, a redeemer was someone—usually a relative—who was responsible for restoring a person’s possessions, status in society, or personal freedom.'
  - where: 'section “What he asks for”'
    claim: 'Davis: Job does not say who the redeemer of 19:25 is'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Now, Job does not say who this redeemer is; only he knows and hopes that he will come to make things right.'
  - where: 'section “What he asks for”'
    claim: 'Connection made by this page: set side by side, the four pleas describe one who can lay a hand on God and man (9:33), is in heaven pleading for a man with God (16:19–21), is God Himself pledged to God (17:3), and is a living kinsman who will stand on the earth (19:25); Job never assembles them and names no one'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/19?lang=eng'
    quote: 'For I know that my redeemer liveth, and that he shall stand at the latter day upon the earth:'
  - where: 'section “The other thing Job wanted”'
    claim: '“Reason” (13:3) is yākaḥ (H3198)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'וְ/הוֹכֵ֖חַ'
  - where: 'section “The other thing Job wanted”'
    claim: '“Maintain” (13:15) is the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'אוֹכִֽיחַ'
  - where: 'section “The other thing Job wanted”'
    claim: '“Dispute” (23:7) is the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'נוֹכָ֣ח'
  - where: 'section “The other thing Job wanted”'
    claim: 'Stirling: the book presents Job as standing alone before God, emphasizing the direct, unmediated relationship'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'The book of Job presents Job as standing alone before God, thus placing more emphasis on the direct, unmediated relationship between an individual and God.'
  - where: 'section “The other thing Job wanted”'
    claim: 'Stirling: Elihu’s angel mediator is presumably Elihu himself'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'He mentions to Job the possibility of an angel mediator (presumably Elihu himself!) who will intercede for him if only Job will admit guilt'
  - where: 'section “The other thing Job wanted”'
    claim: '“Ransom” (33:24) is kōper, the price of a life'
    key: bdb
    url: 'https://biblehub.com/hebrew/3724.htm'
    quote: 'the price of a life, ransom'
  - where: 'section “The other thing Job wanted”'
    claim: '“Ransom” at 33:24 is kōper (H3724)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'כֹֽפֶר'
  - where: 'section “He that reproveth God”'
    claim: '“He that reproveth” (40:2) is the participle môkîaḥ, the form translated “daysman” at 9:33; the form is in three verses of Job (9:33; 32:12; 40:2: מוֹכִיחַ each time)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'מוֹכִ֖יחַ אֱל֣וֹהַּ'
  - where: 'section “He that reproveth God”'
    claim: 'The lexicon puts 9:33 under “decide, judge”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3198.htm'
    quote: '1 decide, judge, absolute Genesis 31:42 (E)'
  - where: 'section “He that reproveth God”'
    claim: 'The lexicon puts 40:2 under “reprove,” of man'
    key: bdb
    url: 'https://biblehub.com/hebrew/3198.htm'
    quote: 'מוֺכִיחַ אֱלוהַּ Job 40:2'
  - where: 'section “He that reproveth God”'
    claim: 'Connection made by this page: the LORD addresses Job by the word Job had used for the arbiter he lacked and for arguing his own case, and Job’s silence (40:4) and the LORD’s irony (40:14) show that he cannot be his own advocate; the lexicon gives the word different senses at 9:33 and 40:2, and no pun is claimed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/40?lang=eng'
    quote: 'Shall he that contendeth with the Almighty instruct him? he that reproveth God, let him answer it.'
  - where: 'section “My servant Job shall pray for you”'
    claim: 'Delitzsch: at 42:7 God decides between Job and the friends according to the wish of 16:21, and the heavenly Witness is heard on earth'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/42.htm'
    quote: 'God decides between him and the friends according to his previous supplicatory wish, Job 16:21. The heavenly Witness makes Himself heard on earth'
  - where: 'section “My servant Job shall pray for you”'
    claim: '“Burnt offerings” (1:5) is ʿôlâ (H5930), found in Job only here and at 42:8'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'עֹלוֹת֮'
  - where: 'section “My servant Job shall pray for you”'
    claim: '“Burnt offering” (42:8) is the same noun'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'עוֹלָה֙'
  - where: 'section “My servant Job shall pray for you”'
    claim: 'The Church’s footnote at 42:8 “offering” points to Job 1:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/42?lang=eng'
    quote: '“offering”: Job 1:5.'
  - where: 'section “My servant Job shall pray for you”'
    claim: 'The Church’s footnote at 1:5 “offerings” points to Job 42:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/1?lang=eng'
    quote: '“offerings”: Job 42:8'
  - where: 'section “My servant Job shall pray for you”'
    claim: '“Pray” (42:8) is hitpallēl, the word used specifically for interceding'
    key: bdb
    url: 'https://biblehub.com/hebrew/6419.htm'
    quote: '1 specifically intercede'
  - where: 'section “My servant Job shall pray for you”'
    claim: 'The lexicon lists Job 42:8 under that sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/6419.htm'
    quote: 'with על for2Chronicles 30:18; Job 42:8 (late).'
  - where: 'section “My servant Job shall pray for you”'
    claim: '“Pray” at 42:8 is hitpallēl (H6419), found in Job only at 42:8 and 42:10'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'יִתְפַּלֵּ֖ל'
  - where: 'section “My servant Job shall pray for you”'
    claim: '“Prayed” at 42:10 is the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'בְּ/הִֽתְפַּֽלְל֖/וֹ'
  - where: 'section “My servant Job shall pray for you”'
    claim: 'Parry sets 1:5 and 42:8 together: Job a mediator between God and his children and friends'
    key: parry-job-type
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-suffering-servant-type-jesus-christ'
    quote: 'Job served as a mediator between God and his children and friends (Job 1:5; 42:8)'
  - where: 'section “My servant Job shall pray for you”'
    claim: 'Stirling: Job acts in a priestly intercessory role for the friends'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job functions in a priestly intercessory role'
  - where: 'section “My servant Job shall pray for you”'
    claim: '“His friends” (42:10) is rēʿēhû, the word of 16:21'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'בְּעַ֣ד רֵעֵ֑/הוּ'
  - where: 'section “My servant Job shall pray for you”'
    claim: 'Connection made by this page: the LORD answers “neither is there any daysman” (9:33) by making Job the intercessor (42:8), a likeness of the daysman Job asked for and not the thing itself; Job, a man like the friends and the LORD’s accepted servant, can in their case lay a hand on both, the friends are spared on his acceptance, and he prays for the men who wronged him; he brings no ransom, and no man did this for him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/9?lang=eng'
    quote: 'Neither is there any daysman betwixt us, that might lay his hand upon us both.'
  - where: 'section “The man Christ Jesus”'
    claim: 'The Church’s footnote at “ransom” (33:24) points to 1 Tim. 2:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/33?lang=eng'
    quote: '1 Tim. 2:6.'
  - where: 'section “The man Christ Jesus”'
    claim: '“Surety” in Heb. 7:22 is one who guarantees another’s debt'
    key: nt-student-manual-49
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/hebrews/chapter-49-hebrews-7-13?lang=eng'
    quote: 'The word “surety” in Hebrews 7:22 refers to one who guarantees another person’s financial debt.'
  - where: 'section “The man Christ Jesus”'
    claim: 'Christ paid our spiritual debt'
    key: nt-student-manual-49
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/hebrews/chapter-49-hebrews-7-13?lang=eng'
    quote: 'Christ paid our spiritual debt'
  - where: 'section “The man Christ Jesus”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'section “The man Christ Jesus”'
    claim: 'Farley sets Job’s prayer for friends who had symbolically crucified him with words beside Luke 23:34'
    key: farley-job-parallels
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/10/job-parallels-with-the-savior?lang=eng'
    quote: 'friends who had symbolically crucified him with words'
  - where: 'section “The man Christ Jesus”'
    claim: 'Connection made by this page: the scriptures that name Christ mediator, advocate, surety, ever-living intercessor and brother (1 Tim. 2:5–6; 1 Jn. 2:1; Heb. 7:22, 25; Heb. 2:17) name one Person for all that Job’s pleas describe; Heb. 2:17 gives the necessity of His being made like His brethren and Mosiah 15:1–2 that God Himself comes down in flesh, and the page reads Job 9:32 as the reason the two belong together'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-tim/2?lang=eng'
    quote: 'For there is one God, and one mediator between God and men, the man Christ Jesus;'
  - where: 'section “The man Christ Jesus”'
    claim: 'Connection made by this page: since Jehovah is the premortal Christ, the LORD who came to Job with no one between (38:1) was the One who would become the Mediator'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/38?lang=eng'
    quote: 'Then the Lord answered Job out of the whirlwind, and said,'
  - where: 'section “The man Christ Jesus”'
    claim: 'Connection made by this page: D&C 45:3–5 is the pleading Job asked for at 16:21; the Advocate pleads as kin, names the blood of Him whom the Father gave, and pleads His own acceptance, as the friends were spared on Job’s (“him will I accept,” 42:8); the disciple’s place in Job 42 is Eliphaz’s'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'Wherefore, Father, spare these my brethren that believe on my name'
  - where: 'section “Then would I speak”'
    claim: 'Connection made by this page: Heb. 4:15–16 (“come boldly unto the throne of grace”) describes what Job said he could do only if he had a daysman (9:34–35)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/4?lang=eng'
    quote: 'Let us therefore come boldly unto the throne of grace, that we may obtain mercy, and find grace to help in time of need.'
  - where: 'section “Then would I speak”'
    claim: 'The Church’s footnote at “prayed” (42:10) points to Matt. 5:44'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/42?lang=eng'
    quote: '“prayed”: Matt. 5:44.'
  - where: 'section “Then would I speak”'
    claim: 'The 2014 seminary manual’s principle from Job 42:8'
    key: seminary-ot-teacher-109
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-109-job-38-42?lang=eng'
    quote: 'The Lord wants us to pray for those who misjudge us.'
  - where: 'section “The other thing Job wanted”'
    claim: 'Stirling: Job receives no messengers from God'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Furthermore, Job receives no messengers from God; instead,'
  - where: 'section “The other thing Job wanted”'
    claim: 'Delitzsch: the speaker of 33:24 is God, who speaks to His angel'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/33.htm'
    quote: 'then God pardons, and says to His angel: Deliver him from the descent to the pit, I have found a ransom.'
  - where: 'section “The man Christ Jesus”'
    claim: 'Stirling: Job’s role as mediator for the friends parallels Christ’s as mediator for mankind'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Finally, Job’s role as mediator for the friends parallels Christ’s as mediator for mankind.'
  - where: 'section “The man Christ Jesus”'
    claim: 'Parry sets Job’s mediation (1:5; 42:8) beside the one mediator of 1 Tim. 2:5'
    key: parry-job-type
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-suffering-servant-type-jesus-christ'
    quote: 'Job served as a mediator between God and his children and friends (Job 1:5; 42:8), and Jesus was the “one mediator between God and men” (1 Tim. 2:5).'
  - where: 'section “The man Christ Jesus”'
    claim: 'Stirling: Job’s intercession inverts Eliphaz’s expectation of serving as Job’s intercessor (22:27–30)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'ironically inverting Eliphaz’s probable previous expectation of serving as Job’s intercessor (see Job 22:27–30)'
