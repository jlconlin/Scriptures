page: he-that-liveth
claims:
  - where: 'opening'
    claim: 'Elder Nelson quotes Job 14:14 and says Job answered his own question, then quotes 19:25–26'
    key: nelson-life-after-life
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1987/04/life-after-life?lang=eng'
    quote: '“If a man die, shall he live again?” asked Job (Job 14:14). In faith, he answered his own question:'
  - where: 'opening'
    claim: 'The 2026 seminary lesson has students mark Job’s questions in 14:7–14'
    key: ot-seminary-2026-job-14-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-manual-2026/32-job/322-job-14-19?lang=eng'
    quote: 'Read Job 14:7–14, marking the two questions Job had as he searched for hope in his afflictions.'
  - where: 'opening'
    claim: 'The lesson then has them read 19:23–27 for Job’s answer'
    key: ot-seminary-2026-job-14-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-manual-2026/32-job/322-job-14-19?lang=eng'
    quote: 'Read Job 19:23–27, looking for the answer Job gives to his questions.'
  - where: 'opening'
    claim: 'Connection made by this page: Job’s question about a man (14:14, with 14:12) is answered in 19:25 by a sentence about someone else: in chapter 14 he said that man “riseth not” (14:12) and asked whether a dead man “shall live” (14:14), and to live and to rise are what he says of his Redeemer. From chapter 3 to 19 he looks for a ground of hope in himself and in nature and finds none, then looks to God’s desire for His creature (14:13–15, which the Church’s heading reads as his answer, the Lord’s call), and what he comes to know is a living Person; the gospel teaches that the dead live because Christ lives, and adds that the One who lives was dead (Rev. 1:18). Job does not say this of his Redeemer, and the page does not claim he understood the Resurrection as later revelation gives it.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/19?lang=eng'
    quote: 'For I know that my redeemer liveth, and that he shall stand at the latter day upon the earth:'
