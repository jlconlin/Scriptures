  - where: 'section “My redeemer liveth”'
    claim: 'Connection made by this page: “liveth” and “shall stand” in 19:25 are the words of 14:14 (“shall he live”) and 14:12 (“riseth not”) with the Redeemer as subject in place of the dead man; the lexicon gives “stand” a different sense from “riseth,” and the page does not say Job describes the Redeemer rising from the dead. Job’s expectation of death is unchanged (19:26; 30:23, with the same “I know” and the same word for “living”), and what he expects beyond death (19:26–27) rests on the Redeemer and not on anything in man; the verb form is common in Job, and the weight is on the pairing; the page reads Stirling’s “new kind of hope” as new in where it rests.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/30?lang=eng'
    quote: 'For I know that thou wilt bring me to death, and to the house appointed for all living.'
