    quote: 'At some time every one of us must face the question which Job faced, and because of the Atonement wrought by Jesus Christ we may answer it as Job answered it.'
  - where: 'section “Them which are asleep”'
    claim: 'Connection made by this page: Job’s restoration in chapter 42 is not the answer to 14:14, since he still dies (42:17); the answer is the testimony of 19:25, given with nothing restored. Paul’s comfort at a grave (1 Thes. 4:13–14) and Mormon’s account of hope (Moro. 7:41) rest, as Job’s sentence does, on a fact about Christ and not about the dead; such hope is neither Eliphaz’s (4:6) nor the tree’s (14:7), and it can be held beside the knowledge of death (30:23).'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-thes/4?lang=eng'
    quote: 'For if we believe that Jesus died and rose again, even so them also which sleep in Jesus will God bring with him.'
