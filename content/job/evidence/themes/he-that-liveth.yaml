  - where: 'section “The work of thine hands”'
    claim: 'Connection made by this page: the wish of 14:13–15 takes its call from 13:22 and its hands from 10:8, and it rests hope on what God desires rather than on what man is; nothing in it changes what 14:12 says of man, the chapter’s closing verses return to loss (14:19), and on any reading the wish has a ground outside man, the Lord’s call. The thought that God will seek him is already in 7:21.'
