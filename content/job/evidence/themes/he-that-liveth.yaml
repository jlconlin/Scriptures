  - where: 'section “And was dead”'
    claim: 'Connection made by this page: in Rev. 1:17–18 the risen Christ takes Isaiah’s title “the first and the last” (Isa. 44:6, of the LORD, Israel’s Redeemer; the link from Job’s “last” to Isaiah depends on Delitzsch’s reading of ʾaḥărôn as “the last One,” where the KJV and NRSVue read it of time), and the page sets Job’s “liveth” (19:25) beside “he that liveth,” noting that “living” is common of God (27:2); Christ adds “and was dead,” which Job’s sentence does not say; so the first answer to “If a man die, shall he live again?” is the Redeemer Himself, who died and lives.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/1?lang=eng'
    quote: 'I am he that liveth, and was dead; and, behold, I am alive for evermore, Amen; and have the keys of hell and of death.'
  - where: 'section “And was dead”'
    claim: 'Connection made by this page: the LORD’s question at 38:17 shows that Job spoke of death (7; 10:21–22; 14) from this side of its gates, while the One John saw holds “the keys of hell and of death” (Rev. 1:18).'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/38?lang=eng'
    quote: 'Have the gates of death been opened unto thee? or hast thou seen the doors of the shadow of death?'
  - where: 'section “And was dead”'
    claim: 'Connection made by this page: the change of subject from 14:14 to 19:25 is how the doctrine runs: the dead live because Christ lives (1 Cor. 15:20–22; John 14:19), and John 11:25 (“though he were dead, yet shall he live”) gives Job’s question back as a promise whose reason is “I am.”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/11?lang=eng'
    quote: 'I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live:'
  - where: 'section “And was dead”'
    claim: 'Connection made by this page: 2 Ne. 9:7 (“to rise no more”), three verses after the verse the Bible Dictionary pairs with Job 19:26, says of man without an infinite atonement what Job 14:12 says (“riseth not”); so Job 14:12 is an accurate account of man as he would be without an infinite atonement.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/9?lang=eng'
    quote: 'this flesh must have laid down to rot and to crumble to its mother earth, to rise no more.'
  - where: 'section “And was dead”'
    claim: 'Connection made by this page: Job’s “Thou shalt call, and I will answer thee” (14:15) is kept in the Son’s voice calling the dead from their graves (John 5:28–29; 11:43–44), and “thou wilt have a desire to the work of thine hands” in the restoration of the whole body (Alma 40:23; D&C 138:17), which answers 10:9.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/5?lang=eng'
    quote: 'the hour is coming, in the which all that are in the graves shall hear his voice,'
