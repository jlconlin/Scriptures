chapter: 14
claims:
  # setting
  - where: setting
    claim: 'Chapters 12–14 close the first cycle of the dialogue and are a turning point for the book'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Chapters 12–14 conclude the first cycle of the Dialogues. In my view, these critically important chapters constitute a turning point for the entire book. Here, Job reaches the greatest depths but then turns and begins his ascent'
  - where: thread
    claim: 'Job argues that since man cannot be pure and his days are fixed, God should rather show forbearance and look away from him'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/14.htm'
    quote: 'It appears to him that man must the rather be an object of divine forbearance and compassion, since absolute purity is impossible to him.'
  - where: thread
    claim: 'Tree and man contrasted; Job wishes to be hidden in the grave; in 18–22 he has little hope of outlasting God'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job wishes that God would “hide [Job] in the grave” and then when God’s anger has passed that he could then come out and face God (verses 13–15). In Job 14:18–22, Job expressed little hope that he could outlast God'
  - where: thread
    claim: 'Job oscillates between hope and despair; the vision of 13–17 is not immediately sustained'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Although this vision is not immediately sustained, it represents a dramatic shift in Job’s understanding.'
  - where: thread
    claim: 'Job oscillates between hope and despair in chapter 14'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'We now find Job oscillating between hope and despair.'
  - where: thread
    claim: 'The figures of 18–19 are of slow but inevitable destruction even of the most durable things'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/14.htm'
    quote: 'The point of the four illustrations is not that not one of them is restored to its former condition (Oetinger, Hirz.), but that in spite of their stability they are overwhelmed by destruction, and that irrecoverably.'

  # notes
  - where: 'note 14:7 “A tree has more hope than a man”'
    claim: 'Job contrasts the tree that sprouts again with man who lies down and does not rise'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'In Job 14:7, Job says, “For there is hope of a tree, if it be cut down, that it will sprout again, and that the tender branch thereof will not cease.” Job contrasts that with humankind'
  - where: 'note 14:7 “A tree has more hope than a man”'
    claim: 'Job''s pessimism may reflect his state; such words are not out of keeping with Psalms and Ecclesiastes'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'at this point in the book, because of Job’s mental and physical state, many things that he says are not entirely accurate. … However, Job’s words are not entirely out of character with discussions about death in both Psalms and Ecclesiastes.'
  - where: 'note 14:7 “A tree has more hope than a man”'
    claim: 'After the tree and the lament that man rises not, Job turns to a sudden insight (verses 13–17)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'After noting that a tree, though cut down, may bud and put forth branches at the scent of water, Job laments that a man dies and rises not again (see Job 14:7-12). But then Job, in a flash of inspiration'
  - where: 'note 14:13 “A hiding place in Sheol”'
    claim: 'The Hebrew of verse 13 names Sheol, as a modern translation shows'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+14&version=NRSVUE'
    quote: 'O that you would hide me in Sheol, that you would conceal me until your wrath is past, that you would appoint me a set time and remember me!'
  - where: 'note 14:13 “A hiding place in Sheol”'
    claim: 'Modern translation of verse 15: “you would long for the work of your hands”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+14&version=NRSVUE'
    quote: 'You would call, and I would answer you; you would long for the work of your hands.'
  - where: 'note 14:13 “A hiding place in Sheol”'
    claim: 'Job wishes God would hide him in the grave and, once God''s anger had passed, he could come out and face God'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job wishes that God would “hide [Job] in the grave” and then when God’s anger has passed that he could then come out and face God (verses 13–15).'
  - where: 'note 14:14 “If a man die, shall he live again?”'
    claim: 'The chapter heading reads verses 14–15 as Job''s answer: he will await the Lord''s call to come forth from the grave'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/14?lang=eng'
    quote: 'Job answers that he will await the Lord’s call to come forth from the grave.'
  - where: 'note 14:14 “If a man die, shall he live again?”'
    claim: 'Scholars usually read such passages as showing no belief in resurrection; for Latter-day Saints the evidence is limited, not absent; Job appears to hope for something like resurrection'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Even though our evidence for a belief in resurrection is limited in the Old Testament, that does not mean that they did not believe in it; it just means that evidence is limited. … Job appears to be hoping for something like resurrection to happen.'
  - where: 'note 14:14 “If a man die, shall he live again?”'
    claim: 'Scholars usually read such passages as evidence of no belief in resurrection in most of the Old Testament'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Scholars usually read passages like this as evidence that there was no belief in a resurrection for most of the Old Testament (except Daniel 12:1–2).'
  - where: 'note 14:14 “If a man die, shall he live again?”'
    claim: 'Verses 13–17 are Job''s first revelatory insight: a loving God calling him back, and the possibility of resurrection'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job thus conceives of a loving God calling him back to a meaningful relationship, with redemption from sin as necessary, and of the possibility of renewal of life in a resurrection.'
  - where: 'note 14:14 “If a man die, shall he live again?”'
    claim: 'The insight comes in a flash after Job laments that man rises not again'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job laments that a man dies and rises not again (see Job 14:7-12). But then Job, in a flash of inspiration, suddenly receives his first great revelatory insight'
  - where: 'note 14:14 “If a man die, shall he live again?”'
    claim: 'President Monson called Job''s question timeless and said the empty tomb was its answer'
    key: monson-he-is-risen
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2010/04/he-is-risen?lang=eng'
    quote: 'sat with his companions and uttered the timeless, ageless question, “If a man die, shall he live again?” Job spoke what every other living man or woman has pondered.'
  - where: 'note 14:14 “If a man die, shall he live again?”'
    claim: 'Monson: the empty tomb was the answer to Job''s question'
    key: monson-he-is-risen
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2010/04/he-is-risen?lang=eng'
    quote: 'The empty tomb that first Easter morning was the answer to Job’s question, “If a man die, shall he live again?”'
  - where: 'note 14:14 “Till my change come”'
    claim: 'BDB: ḥălîpāh in Job 14:14 is revival after death, under the figure of relief from military service; the word otherwise is a change of clothes'
    key: bdb
    url: 'https://biblehub.com/hebrew/2487.htm'
    quote: '3 revival after death, under figure of relief from military service Job 14:14.'
  - where: 'note 14:14 “Till my change come”'
    claim: 'BDB: the word''s first sense is a change of raiment'
    key: bdb
    url: 'https://biblehub.com/hebrew/2487.htm'
    quote: '1 change of raiment שׂמלת ׳ח Genesis 45:22 (twice in verse)'
  - where: 'note 14:14 “Till my change come”'
    claim: 'A modern translation renders “my service … my release”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+14&version=NRSVUE'
    quote: 'All the days of my service I would wait until my release should come.'
  - where: 'note 14:17 “Sealed up in a bag”'
    claim: 'One older reading: God has gathered Job''s sins as in a sealed money bag to bring them home to him, and added more (Hosea 13:12)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/14.htm'
    quote: 'The evil Job had formerly (Job 13:26) committed according to the sentence of God, God has gathered together as in a money bag, and carefully preserved, in order now to bring them home to him.'
  - where: 'note 14:17 “Sealed up in a bag”'
    claim: 'The same reading takes the image from storing valuables in a sealed bag and explains it by Hosea 13:12'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/14.htm'
    quote: 'the figure is, however, taken not from the mode of preserving important documents, but from the mode of preserving collected articles of value in a sealed bag. The passage must be explained according to Hosea 13:12'
  - where: 'note 14:17 “Sealed up in a bag”'
    claim: 'Translators divide over verse 16: many render it “Thou observest not my sins”'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/14.htm'
    quote: 'Most modern expositors (Ew., Hlgst, Hahn, Schlottm.) translate: Thou observest not my sins'
  - where: 'note 14:17 “Sealed up in a bag”'
    claim: 'A modern translation reads verses 16–17 as part of the hoped-for future: God would not watch Job''s sin, would seal it up and cover it'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+14&version=NRSVUE'
    quote: 'For then you would not number my steps; you would not keep watch over my sin; my transgression would be sealed up in a bag, and you would cover over my iniquity.'
  - where: 'note 14:17 “Sealed up in a bag”'
    claim: 'A Latter-day Saint reading takes 14:13–17 (in the NIV) with sin sealed and covered over, redemption from sin being necessary'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job thus conceives of a loving God calling him back to a meaningful relationship, with redemption from sin as necessary'

  # christ
  - where: christ
    claim: 'Monson: If a man die, he shall live again; known by revealed truth'
    key: monson-he-is-risen
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2010/04/he-is-risen?lang=eng'
    quote: 'To all within the sound of my voice, I declare, If a man die, he shall live again. We know, for we have the light of revealed truth.'
  - where: christ
    claim: 'Come, Follow Me answers Job 14:14 with Alma 11:42–44: because of Jesus Christ, I will live again'
    key: cfm-ot-2026-33
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/33?lang=eng'
    quote: 'Job 14:14: Because of Jesus Christ, I will live again after I die.'
  - where: christ
    claim: 'Because of Christ''s Resurrection we can have hope, including in the death of loved ones'
    key: ot-seminary-2026-job-14-19
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-manual-2026/32-job/322-job-14-19?lang=eng'
    quote: 'It can be difficult to find hope during challenges, including the death of loved ones. Heavenly Father sent His Son to perform the Atonement, which finished with the Savior’s Resurrection from the tomb. Because of Jesus Christ’s Resurrection, we can have hope.'
