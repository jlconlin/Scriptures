chapter: 33
claims:
  - where: setting
    claim: 'Elihu addresses Job by name, as no earlier speaker had'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/33.htm'
    quote: 'Elihu addresses Job, as none of the previous speakers have done, by name.'
  - where: setting
    claim: 'The friends read the suffering as punishment; Elihu is shocked at Job''s impiety; his thesis is that God will not pervert judgment; Job makes no reply'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'Job 32–37 contains the speeches of Elihu, who is shocked at what he regards as impiety on the part of Job, and condemns him, though on different grounds from the “three friends.” His main thesis is that God will “not pervert judgment.” Job makes no reply to him'
  - where: setting
    claim: 'Elihu''s charge concerns Job''s words, his maintaining his own righteousness against God''s justice'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/33.htm'
    quote: 'It is a principal trait of Job''s speeches which Elihu here makes prominent: his maintenance of his own righteousness at the expense of the divine justice.'

  - where: thread
    claim: 'Elihu''s aim is to have Job see his affliction as chastisement from a God who seeks his good, not punishment from an angry God'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/33.htm'
    quote: 'he wishes to dispute Job''s notion that his affliction proceeds from a hostile purpose on the part of God, and sets himself here, as there, a perfectly correct task, which he seeks to accomplish by directing Job to regard his affliction, not indeed as a punishment from the angry God, but as a chastisement'
  - where: thread
    claim: 'Verse 32: Elihu would gladly be able to acknowledge Job to be in the right'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/33.htm'
    quote: 'for he (Elihu) would willingly justify him, i.e., he would gladly be in the position to be able to acknowledge Job to be right, and to have the accusation dispensed with.'

  - where: section 1 plain
    claim: 'Verse 6 rendered “before God I am just as you are”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+33&version=NRSVUE'
    quote: 'See, before God I am as you are; I, too, was formed from a piece of clay.'
  - where: section 6 plain
    claim: 'Verse 32: “I want to find you in the right”'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/33.htm'
    quote: 'he would gladly be in the position to be able to acknowledge Job to be right'

  - where: 'note 33:6 “Not in God’s place, but clay like Job”'
    claim: 'The Hebrew of verse 6 reads “as your mouth, to God”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'כְ/פִ֣י/ךָ לָ/אֵ֑ל'
  - where: 'note 33:6 “Not in God’s place, but clay like Job”'
    claim: 'A modern translation renders verse 6 “before God I am as you are”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+33&version=NRSVUE'
    quote: 'See, before God I am as you are; I, too, was formed from a piece of clay.'
  - where: 'note 33:6 “Not in God’s place, but clay like Job”'
    claim: 'kĕpî, literally “according to the mouth of,” means “in proportion to”; BDB reads Job 33:6 “I stand towards God even as thou dost”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6310.htm'
    quote: '(b) according to the mouth of, i.e. in proportion to … Job 33:6 הֵןאֲֿנִי כְפִיךָ לָאֵל I am in the proportion of thee as regards God, i.e. I stand towards God even as thou dost.'
  - where: 'note 33:6 “Not in God’s place, but clay like Job”'
    claim: 'Verses 4 and 6 give man''s twofold origin as in Genesis 2:7; Elihu shares both with Job; Job need not fear an unequal contest, as he stipulated before God in 9:34 and 13:21'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/33.htm'
    quote: 'He has both in common with Job: the spirituality as well as the earthliness of man''s nature; … Job need not fear any unequal contest, nor as before God, Job 9:34; Job 13:21, … make it a stipulation that His majesty may not terrify him. It is man''s twofold origin which Elihu, Job 33:4, Job 33:6, gives utterance to in harmony with Genesis 2:7'

  - where: 'note 33:11 “Job’s own words, quoted back”'
    claim: 'Verse 11 repeats the Hebrew of 13:27, with “he” for “thou”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'וְ/תָ֘שֵׂ֤ם בַּ/סַּ֨ד רַגְלַ֗/י וְ/תִשְׁמ֥וֹר כָּל אָרְחוֹתָ֑/י'
  - where: 'note 33:11 “Job’s own words, quoted back”'
    claim: 'Verse 11 in Hebrew: nearly the same words as 13:27, with “he” for “thou”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'יָשֵׂ֣ם בַּ/סַּ֣ד רַגְלָ֑/י יִ֝שְׁמֹ֗ר כָּל אָרְחֹתָֽ/י'
  - where: 'note 33:11 “Job’s own words, quoted back”'
    claim: 'Verse 10 uses the words of 13:24 for being counted God''s enemy'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'Job 13:24 … וְ/תַחְשְׁבֵ֖/נִי לְ/אוֹיֵ֣ב לָֽ/ךְ … Job 33:10 … יַחְשְׁבֵ֖/נִי לְ/אוֹיֵ֣ב לֽ/וֹ'
  - where: 'note 33:11 “Job’s own words, quoted back”'
    claim: 'The friends saw suffering as punishment for sin; Elihu condemns Job on different grounds, for what he regards as impiety'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'they give their interpretation, that they are a sign of God’s anger and a punishment for sin … Elihu, who is shocked at what he regards as impiety on the part of Job, and condemns him, though on different grounds from the “three friends.”'

  - where: 'note 33:14 “Two ways God speaks”'
    claim: '“Once, twice” is a number-proverb form like 5:19, naming two modes: dreams and sicknesses'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/33.htm'
    quote: 'it is not twice, but two different modes or means of divine attestation, viz., dreams and sicknesses, that are spoken of … The form of the declaration: by one - by two, is that of the so-called number-proverbs, like Job 5:19.'
  - where: 'note 33:14 “Two ways God speaks”'
    claim: 'Affliction as chastisement from a God who desires Job''s good, a discipline against sin, especially pride'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/33.htm'
    quote: 'not indeed as a punishment from the angry God, but as a chastisement of the God who desires his highest good, as disciplinary affliction which is intended to secure him against hurtful temptation to sin, especially to pride'
  - where: 'note 33:14 “Two ways God speaks”'
    claim: 'The difference from Eliphaz is hard to hear: Eliphaz demands humiliation, Elihu presents affliction as God''s speech to educate Job'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/33.htm'
    quote: 'one must listen very closely to discover the difference between the tone which Elihu takes and the tone in which Eliphaz began his first speech. … but Eliphaz at once demands of him humiliation … Elihu … by setting over against his longing for God to answer him, the pleasing teaching that his affliction in itself is already the speech of God to him'
  - where: 'note 33:14 “Two ways God speaks”'
    claim: 'The prologue shows Job''s affliction as a trial of his piety'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/33.htm'
    quote: 'From the prologue we know that Job''s affliction is designed to show that there is a piety which also retains its hold on God amid the loss of all earthly goods'
  - where: 'note 33:14 “Two ways God speaks”'
    claim: 'In Elihu''s view chastisement swallows up the aspect of trial'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/33.htm'
    quote: 'The aspect of the affliction as a chastisement so greatly preponderates, that the other, viz., as a trial or proving, is as it were swallowed up by it.'
  - where: 'note 33:14 “Two ways God speaks”'
    claim: 'Affliction does not necessarily mean sin; the Lord may use it for experience, discipline and instruction'
    key: gs-job
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/job?lang=eng'
    quote: 'The book clarifies that having afflictions does not necessarily mean that a person has sinned. The Lord may use affliction for experience, discipline, and instruction as well as for punishment (D&C 122).'

  - where: 'note 33:23 “A messenger and an interpreter”'
    claim: 'malʾāk is the ordinary word for one sent with a message, and also for a prophet'
    key: bdb
    url: 'https://biblehub.com/hebrew/4397.htm'
    quote: 'noun masculine messenger; … 1 messenger, … a. one sent with a message … b. a prophet'
  - where: 'note 33:23 “A messenger and an interpreter”'
    claim: 'The words in verse 23 are malʾāk and mēlîṣ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'מַלְאָ֗ךְ מֵלִ֗יץ אֶחָ֥ד מִנִּי אָ֑לֶף'
  - where: 'note 33:23 “A messenger and an interpreter”'
    claim: 'A modern translation: “an angel, a mediator, one of a thousand”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+33&version=NRSVUE'
    quote: 'Then, if there should be for one of them an angel, a mediator, one of a thousand, one who declares a person upright,'
  - where: 'note 33:23 “A messenger and an interpreter”'
    claim: 'mēlîṣ is the interpreter of Gen 42:23, figuratively intermediaries between God and man'
    key: bdb
    url: 'https://biblehub.com/hebrew/3887.htm'
    quote: '2 Participle interpreter Genesis 42:23 (E); figurative of intermediaries between God and man, Job 33:28; Isaiah 43:27; ambassador2Chronicles 32:31.'
  - where: 'note 33:23 “A messenger and an interpreter”'
    claim: 'The Targum renders it paraklētos, opposite an accuser; “one of a thousand” is one above the thousands of angels'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/33.htm'
    quote: 'The Targ. translates by פרקליטא, παράκλητος (opp. קטיגור, κατήγορος, κατήγωρ). … not any one whatever of the thousands of the angels … but one who soars above the thousands, and has not his equal among them'
  - where: 'note 33:23 “A messenger and an interpreter”'
    claim: 'Some older interpreters took the messenger as a human prophet like Elihu; the older reading rejects it'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/33.htm'
    quote: 'This course of thought does not admit of our understanding the מלאך of a human messenger of God, such as Job has before him in Elihu'
  - where: 'note 33:23 “A messenger and an interpreter”'
    claim: 'The angel is the mediator of the deliverance itself, not only one who declares its terms'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/33.htm'
    quote: 'The מלך appears not merely as a declarer of the conditions of the deliverance, but as a mediator of this deliverance itself.'
  - where: 'note 33:23 “A messenger and an interpreter”'
    claim: 'The older reading sets the mediator beside what Job longed for at 17:3, 16:21 and 9:33'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/33.htm'
    quote: 'A presage of this mystery, flashing through the darkness, we have already read in Job 17:3 (comp. Job 16:21; and, on the other hand, in order to see how this anticipation is kindled by the thought of the opposite, Job 9:33).'

  - where: 'note 33:24 ““I have found a ransom””'
    claim: 'kōper: the price of a life, ransom, with Job 33:24 listed'
    key: bdb
    url: 'https://biblehub.com/hebrew/3724.htm'
    quote: 'I. כֹּפֶר noun masculine the price of a life, ransom (ποινή, wergild); … 1 a price for ransom of a life Job 33:24'
  - where: 'note 33:24 ““I have found a ransom””'
    claim: 'It is God who pardons and says, “I have found a ransom”; in the older reading He says it to His angel'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/33.htm'
    quote: 'Therefore: then God pardons, and says to His angel: Deliver him from the descent to the pit, I have found a ransom.'
  - where: 'note 33:24 ““I have found a ransom””'
    claim: 'The ransom may be understood as repentance or the affliction that brought it, but the angel''s mediation is meant; a presage of “God was in Christ”'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/33.htm'
    quote: 'The connection is satisfied if the repentance of the chastened one … is understood by this ransom, or better, his affliction, inasmuch as it has brought him to repentance. But wherefore should the mediatorship of the angel be excluded from the notion of the כּפר.'
  - where: 'note 33:24 ““I have found a ransom””'
    claim: 'Delitzsch''s “presage of the mystery” in the light of the New Testament'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/33.htm'
    quote: 'we shall here readily recognise a presage of the mystery which is unveiled in the New Testament: "God was in Christ, and reconciled the world unto Himself."'
  - where: 'note 33:24 ““I have found a ransom””'
    claim: 'The Church''s footnote at “ransom” points to 1 Tim. 2:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/33?lang=eng'
    quote: '1 Tim. 2:6.'

  - where: 'note 33:26 “Enos and the face of God”'
    claim: 'Enos applied Job 33:26 to himself, copying “see his face with joy” almost verbatim in Enos 1:27'
    key: sc-knowhy-265
    url: 'https://scripturecentral.org/knowhy/how-did-enos-liken-the-scriptures-to-his-own-life'
    quote: 'Job 33:26, begins: “he shall pray unto God, and he will be favourable unto him.” This is a fitting summary of the book of Enos. It is followed by a phrase that Enos seems to have copied almost verbatim'
  - where: 'note 33:26 “Enos and the face of God”'
    claim: 'The word for “man” is enosh, likely the source of the name; Enos may have read the line of himself, and names his reward'
    key: sc-knowhy-265
    url: 'https://scripturecentral.org/knowhy/how-did-enos-liken-the-scriptures-to-his-own-life'
    quote: 'The Hebrew word for “man” used in Job 33:26 is enosh, likely the same Hebrew word from which Enos derives. Thus, Enos may have read this verse as “and he shall see his face with joy, for he will render unto Enos his righteousness.”'
  - where: 'note 33:26 “Enos and the face of God”'
    claim: 'The Hebrew of verse 26 has ʾĕnôš for “man”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'לֶ֝/אֱנ֗וֹשׁ צִדְקָתֽ/וֹ'
  - where: 'note 33:26 “Enos and the face of God”'
    claim: 'A text quoted in Job 33:26 is alluded to in Enos 1:27'
    key: sc-knowhy-410
    url: 'https://scripturecentral.org/knowhy/what-parts-of-the-old-testament-were-on-the-plates-of-brass'
    quote: 'a text quoted in Job 33:26 is alluded to in Enos 1:27'
  - where: 'note 33:26 “Enos and the face of God”'
    claim: 'The Book of Mormon''s Old Testament references were presumably quoted from the plates of brass'
    key: sc-knowhy-410
    url: 'https://scripturecentral.org/knowhy/what-parts-of-the-old-testament-were-on-the-plates-of-brass'
    quote: 'Yet it also frequently quotes Isaiah and the Psalms, and even includes a bit of Job. All of these were presumably quoted from the plates of brass.'

  - where: christ
    claim: 'The Church’s footnote at “ransom” (33:24) points to 1 Tim. 2:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/33?lang=eng'
    quote: '1 Tim. 2:6.'

  - where: parallels
    claim: 'Enos 1:27 may take up Job 33:26'
    key: sc-knowhy-265
    url: 'https://scripturecentral.org/knowhy/how-did-enos-liken-the-scriptures-to-his-own-life'
    quote: 'Enos also applied Job 33:26 directly to himself, likely because the Hebrew word “enos” was included in the verse.'
  - where: parallels
    claim: 'The footnote at verse 24 points to 1 Tim. 2:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/33?lang=eng'
    quote: '1 Tim. 2:6.'
