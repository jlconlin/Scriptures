chapter: 39
claims:
  - where: setting
    claim: 'In chapters 38–41 the LORD shows His knowledge and power by questions about how He made and still directs the earth, stressing how little man knows and can do'
    key: seminary-ot-teacher-109
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-109-job-38-42?lang=eng'
    quote: 'the Lord illustrated His knowledge and power by asking Job many questions about how He created and still directs the earth, emphasizing the limited knowledge and power of humans.'
  - where: setting
    claim: 'The LORD does not answer why Job suffered; He answers with more questions'
    key: seminary-ot-teacher-109
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-109-job-38-42?lang=eng'
    quote: 'He did not seem, however, to answer the questions Job and his friends raised about why Job was suffering. Instead, the Lord gave answers in the form of more questions.'
  - where: setting
    claim: 'Chapters 38–39 are God''s first speech; the wild animals run from 38:39 to 39:30'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'God’s First Speech (Job 38–39). … Two chapters of uninterrupted questions related to the created order then follow.'
  - where: setting
    claim: 'The speech closes at 40:1–2 with God asking whether Job still wishes to correct Him; Job answers in 40:3–5'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job’s First (Non) Response (Job 40:1–5). Characterizing Job as one who contends with deity, God asks him if he still wishes to correct His justice (see Job 40:1–2).'
  - where: thread
    claim: 'One older reading: the series of animals begins with the lion and ends with the eagle'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/39.htm'
    quote: 'In Job 39:27 the circle of the native figures taken from animal life, which began with the lion, the king of quadrupeds, is now closed with the eagle, the king of birds.'
  - where: thread
    claim: 'The point of the hawk question is the bird''s migration south, an instinct God gave'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/39.htm'
    quote: 'the point of the question will lie in לתימן: the hawk is a bird of passage, God has endowed it with instinct to migrate to the south as the winter season is approaching.'
  - where: section 1 plain
    claim: 'The young grow strong and grow up in the open (KJV "with corn")'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2039&version=NRSVUE'
    quote: 'Their young ones become strong; they grow up in the open; they go forth and do not return to them.'
  - where: section 3 plain
    claim: 'Verse 9''s animal is the wild ox'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2039&version=NRSVUE'
    quote: 'Is the wild ox willing to serve you? Will it spend the night at your crib?'
  - where: section 4 plain
    claim: 'Verse 13 speaks of the ostrich''s wings'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2039&version=NRSVUE'
    quote: 'The ostrich’s wings flap wildly, though its pinions lack plumage.'
  - where: section 5 plain
    claim: 'The horse''s neck is clothed with a mane; its snorting is terrible'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2039&version=NRSVUE'
    quote: 'Do you clothe its neck with mane? Do you make it leap like the locust? Its majestic snorting is terrible.'
  - where: 'note 39:1 “Births no one watches”'
    claim: 'God is mindful of pregnant deer (39:1–2) as He sends rain where no one lives (38:26–27)'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'God cares for mythical beasts … and takes care to send rain to uninhabited areas (Job 38:26–27) but is also mindful of pregnant deer (Job 39:1–2) and the abandoned eggs of the ostrich (Job 39:13–15).'
  - where: 'note 39:5 “The wild ass set free”'
    claim: 'Stirling: the wild ass and wild ox roam the wasteland like Job, set free like Job without the hedge; the question is whether Job will freely worship God'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'These animals roam the wasteland (like Job), having been set free (like Job without the hedge). The question is whether they will willingly return to a human master or, in Job’s case, whether Job will freely worship God without the benefit of the hedge.'
  - where: 'note 39:9 “The unicorn is a wild ox”'
    claim: 'The Church''s footnote gives the Hebrew as buffalo or bison'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/39?lang=eng'
    quote: '9a “unicorn”: HEB buffalo, bison.'
  - where: 'note 39:9 “The unicorn is a wild ox”'
    claim: 're''em is the wild ox; the Septuagint''s monokerōs is erroneous; the Vulgate has unicornis'
    key: bdb
    url: 'https://biblehub.com/hebrew/7214.htm'
    quote: 'רְאֵם noun masculineJob 39:10 wild ox … on strength and ferocity … ᵐ5 (erroneous) μονοκέρως (Isaiah 34:7 ἅδροι, ᵑ9 unicornis'
  - where: 'note 39:9 “The unicorn is a wild ox”'
    claim: 'A modern translation has "wild ox"'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2039&version=NRSVUE'
    quote: 'Is the wild ox willing to serve you? Will it spend the night at your crib?'
  - where: 'note 39:13 “The ostrich God made without wisdom”'
    claim: 'The word the KJV renders "peacocks" names the ostrich, the bird of piercing cries'
    key: bdb
    url: 'https://biblehub.com/hebrew/7443.htm'
    quote: 'רְנָנִים noun [masculine] plural bird of piercing cries, i.e. ostrich, according to ᵑ9 Bo Di and most, ׳כְּנַף ר Job 39:13'
  - where: 'note 39:13 “The ostrich God made without wisdom”'
    claim: 'A modern translation reads the line of the ostrich''s wings'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2039&version=NRSVUE'
    quote: 'The ostrich’s wings flap wildly, though its pinions lack plumage.'
  - where: 'note 39:13 “The ostrich God made without wisdom”'
    claim: 'The word in "wings and feathers" is a play on the name of the stork; the ostrich resembles the stork but behaves otherwise'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/39.htm'
    quote: 'the ostrich, although resembling the stork in its stilt-like structure, the colour of its feathers, and its gregarious life, still has characteristics totally different … חסידה, pia, is a play upon the name of the stork'
  - where: 'note 39:13 “The ostrich God made without wisdom”'
    claim: 'The stork''s name means the kind, motherly bird'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/2624.htm'
    quote: 'the kind (maternal) bird, i.e. a stork'
  - where: 'note 39:13 “The ostrich God made without wisdom”'
    claim: 'One older reading: God withheld the ostrich''s share of wisdom; it was proverbially foolish'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/39.htm'
    quote: 'God has caused it to forget wisdom, i.e., as Job 39:17 explains, has extinguished in it, deprived it of, the share thereof … the proverbial ahmaq min en-na‛âme, "more foolish than the ostrich,"'
  - where: 'note 39:13 “The ostrich God made without wisdom”'
    claim: 'God is mindful of the ostrich''s abandoned eggs'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'but is also mindful of pregnant deer (Job 39:1–2) and the abandoned eggs of the ostrich (Job 39:13–15).'
  - where: 'note 39:13 “The ostrich God made without wisdom”'
    claim: 'Stirling: as the ostrich lets her eggs be trampled, so innocent suffering occurs in the world'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Just as the ostrich stupidly permits her own eggs to be trampled, so does innocent suffering occur in the world (see Job 39:13–18).'
  - where: 'note 39:13 “The ostrich God made without wisdom”'
    claim: 'The Church''s footnote at 39:16 points to Lam. 4:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/39?lang=eng'
    quote: '16a “hardened”: Lam. 4:3.'
  - where: 'note 39:19 “The war horse”'
    claim: 'A modern translation has "mane" and "snorting"'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2039&version=NRSVUE'
    quote: 'Do you clothe its neck with mane? Do you make it leap like the locust? Its majestic snorting is terrible.'
  - where: christ
    claim: 'God''s care for the wild creatures is like Jesus'' saying about the sparrows (Matt. 10:29)'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'We can see this as being similar to Jesus’s reminder that “are not two sparrows sold for a farthing? And one of them shall not fall on the ground without your Father?” (Matthew 10:29).'
  - where: christ
    claim: 'Job 38–39 shows how Job could have more confidence in the Lord and trust that his trials would be for his benefit'
    key: seminary-ot-teacher-109
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-109-job-38-42?lang=eng'
    quote: 'Job 38–39 explains how Job could have more confidence in the Lord so that he could more fully trust that his trials would be for his benefit.'
