chapter: 9
claims:
  # setting
  - where: setting
    claim: 'Chapter 9 is Job''s answer to Bildad, about his own standing before God'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'In answering Bildad, Job continues to concentrate on his own standing before God.'
  - where: setting
    claim: 'Bildad''s chief thought was that God does not pervert what is right'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/9.htm'
    quote: 'The chief thought of Bildad''s speech was, that God does not pervert what is right.'
  - where: setting
    claim: 'Chapters 9 and 10 belong together and set out Job''s dilemma'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Chapters 9 and 10 put Job’s dilemma in sharp perspective.'

  # thread
  - where: thread
    claim: 'Job outlines God''s power in verses 3–13 and asks how he could answer Him; God''s violent acts show how He would respond'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job outlines God’s power and might in verses 3–13 and wonders, “How much less shall I answer him, and choose out my words to reason with him?” (verse 14). Job feels God’s violent actions against him have shown how God will respond if they meet (verses 16–18).'
  - where: thread
    claim: 'Job feels all order is lost, his days pass swiftly and futilely, and he ends wishing for a fair trial'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job feels that all order in the world has been lost (verse 23) and that his days are passing swiftly and futilely (verses 25–31). He ends the chapter wishing he could face God in a courtroom and that it could be a fair trial'

  # note 9:2
  - where: 'note 9:2 “In the right before God”'
    claim: 'The verb in 9:2 means to be justified in one''s plea, of man with God'
    key: bdb
    url: 'https://biblehub.com/hebrew/6663.htm'
    quote: '2 be justified, in one''s plea Job 11:2; with עִם (man with God) Job 9:2; Job 25:4'
  - where: 'note 9:2 “In the right before God”'
    claim: 'In verses 15 and 20 the same verb means to have a just cause, be in the right'
    key: bdb
    url: 'https://biblehub.com/hebrew/6663.htm'
    quote: '1 have a just cause, be in the right, Job 9:15,20; Job 13:18; Job 34:5'
  - where: 'note 9:2 “In the right before God”'
    claim: 'The verb of 9:2 in the Hebrew text'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'וּ/מַה ־ יִּצְדַּ֖ק אֱנ֣וֹשׁ עִם ־ אֵֽל'
  - where: 'note 9:2 “In the right before God”'
    claim: 'Job feels righteous but does not think he could win a court case against God'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job feels that he is righteous but does not believe that he could win a court case against God.'

  # note 9:8
  - where: 'note 9:8 “He walks on the sea”'
    claim: 'The Greek translation of verse 8: God walks on the sea as on firm ground'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/job/9.htm'
    quote: '8Who alone has stretched out the heavens, and walks on the sea as on firm ground.'
  - where: 'note 9:8 “He walks on the sea”'
    claim: 'Jesus walking on the sea showed He had power the Old Testament attributes to Jehovah'
    key: sc-knowhy-664
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-use-passover-imagery-in-his-bread-of-life-sermon'
    quote: 'Jesus miraculously crossed the Sea of Galilee by literally walking upon it (John 6:19) … Jesus’s direct control over the elements showed that He possessed power typically attributed to Jehovah in the Old Testament.'
  - where: 'note 9:8 “He walks on the sea”'
    claim: 'The KnoWhy cites Job 9:8 as one of the places that power is attributed, and identifies Jesus with Jehovah'
    key: sc-knowhy-664
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-use-passover-imagery-in-his-bread-of-life-sermon'
    quote: 'See Job 9:8; 38:16; Habakkuk 3:15; Huntsman, “Bread of Life Sermon,” 90–91: “This miracle makes an important Christological statement, identifying Jesus directly with Jehovah.'

  # note 9:10
  - where: 'note 9:10 “Eliphaz''s hymn, turned”'
    claim: 'Job repeats Eliphaz almost verbatim; he agrees on God''s power, but where the friends draw from it humility for the sufferer, Job draws that human right can never be maintained against God; he chooses its terrible side'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/9.htm'
    quote: 'Job says, almost verbatim, what Eliphaz had said … Job agrees with the friends in the recognition of the power of God, and intentionally describes those phases of it which display its terrible majesty. But while the friends deduce from this doctrine the duty of a humble deportment on the part of the sufferer, Job uses it to support the cheerless truth that human right can never be maintained in opposition to the absolute God.'
  - where: 'note 9:10 “Eliphaz''s hymn, turned”'
    claim: 'Irony in 9:12: Job seems to say no one would question God, and questioning God is what he does'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Here Job seems to say that no man would venture to question God’s actions. Yet, questioning God is precisely what Job does.'

  # note 9:13
  - where: 'note 9:13 “The helpers of Rahab”'
    claim: 'The Hebrew of 9:13 ends with the name Rahab'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'שָׁ֝חֲח֗וּ עֹ֣זְרֵי רָֽהַב'
  - where: 'note 9:13 “The helpers of Rahab”'
    claim: 'A modern translation: the helpers of Rahab bowed beneath him'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%209&version=NRSVUE'
    quote: '13 “God will not turn back his anger; the helpers of Rahab bowed beneath him.'
  - where: 'note 9:13 “The helpers of Rahab”'
    claim: 'A modern translation''s margin at verse 8: trampled the back of the sea dragon'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%209&version=NRSVUE'
    quote: '9.8 Or trampled the back of the sea dragon'
  - where: 'note 9:13 “The helpers of Rahab”'
    claim: 'Rahab means storm, arrogance, and in Job 9:13 is a mythical sea monster'
    key: bdb
    url: 'https://biblehub.com/hebrew/7293.htm'
    quote: 'רַ֫הַב noun [masculine] literally storm, arrogance, but only as names … 1 mythical sea monster … ׳עֹזְרֵי ר Job 9:13; "" יָם Job 26:12; Psalm 89:11; "" תַּנִּין Isaiah 51:9.'
  - where: section 3 plain
    claim: 'The footnote at 9:21: Hebrew "I regard not myself", behind the plain rendering of verse 21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/9?lang=eng'
    quote: 'HEB I regard not myself.'
  - where: 'note 9:22 “Job''s charge, and God''s answer”'
    claim: 'Job had believed in an orderly world where a just God rewards and punishes; holding to his innocence, he now considers that God does as He pleases and calls it right'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Like the friends, Job had always believed that the world was an orderly place, created and controlled by a perfectly just God who rewarded the righteous with good and the wicked with calamity. … Job considers the possibility that God is simply an all-powerful bully who capriciously does whatever He pleases and calls it “right.”'
  - where: 'note 9:22 “Job''s charge, and God''s answer”'
    claim: 'By that theology either God or Job was unjust; 40:8 answers 9:15–33, and Job comes to understand he need not condemn God to justify himself'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job, initially locked into the same theology but knowing he was innocent, was forced to question God’s justice (see Job 9:15–33, 12:13–25). By the standards of this theology, either God or Job was unjust/unrighteous. … including the understanding that he does not have to condemn God to justify himself.'
  - where: 'note 9:22 “Job''s charge, and God''s answer”'
    claim: 'Job''s own experience leads him to say God destroys the perfect and the wicked'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job’s own experience leads him to declare that God “destroyeth the perfect and the wicked” and that God “will laugh at the trial of the innocent” (verses 22–23).'

  # note 9:33
  - where: 'note 9:33 “No daysman between us”'
    claim: 'Daysman: an umpire, arbiter, mediator'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/daysman'
    quote: 'DA''YSMAN, noun An umpire or arbiter; a mediator.'
  - where: 'note 9:33 “No daysman between us”'
    claim: 'The Hebrew word behind "daysman"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'מוֹכִ֑יחַ'
  - where: 'note 9:33 “No daysman between us”'
    claim: 'The verb means decide, judge; with "between" at Job 9:33, and at 16:21 of a man with God'
    key: bdb
    url: 'https://biblehub.com/hebrew/3198.htm'
    quote: '1 decide, judge, absolute Genesis 31:42 (E), 1 Chronicles 12:17; Isaiah 11:3; Psalm 94:10; with לְ decide for Isaiah 2:4 = Micah 4:3; Isaiah 11:4; with בּין, Genesis 31:37 (E), Job 9:33; לְגֶבֶר עִם אֱלוֺהַּ Job 16:21.'
  - where: 'note 9:33 “No daysman between us”'
    claim: 'God is not Job''s equal and is accuser and judge in one; laying on a hand is a sign of power'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/9.htm'
    quote: 'For God is not his equal, standing on the same level with him: He, the Absolute Being, is accuser and judge in one person; there is between them no arbitrator … impositio manus est potestatis signum'
  - where: 'note 9:33 “No daysman between us”'
    claim: 'The Greek translation makes verse 33 a wish for a mediator'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/job/9.htm'
    quote: '33Would that he our mediator were present, and a reprover, and one who should hear the cause between both.'
  - where: 'note 9:33 “No daysman between us”'
    claim: 'A modern translation: there is no mediator; another reading is a wish'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%209&version=NRSVUE'
    quote: '9.33 Another reading is Would that there were a mediator'
  - where: 'note 9:33 “No daysman between us”'
    claim: 'God''s challenge to answer "like a man" (38:3) fulfills Job''s hope against his despair at 9:32'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'God challenges Job to respond to His questions “like a man,” making God to know (see Job 38:3), thus fulfilling Job’s hope (see Job 23:7) against his earlier despair (see Job 9:32).'

  # christ
  - where: christ
    claim: 'Jesus Christ is the mediator between God and man; His Atonement made reconciliation possible'
    key: gs-mediator
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/mediator?lang=eng'
    quote: 'An intercessor or intermediary. Jesus Christ is the mediator between God and man. His Atonement made possible a way for people to repent of their sins and become reconciled to God.'
