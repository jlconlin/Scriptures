chapter: 40
claims:
  # setting
  - where: setting
    claim: 'The LORD gives two speeches, 38:1–40:2 and from 40:6, and Job replies after each'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'God gives two speeches to Job, and Job has a chance to reply at the end of each of them. God’s first speech is Job 38:1–40:2, and His second is Job 40:6–34.'
  - where: setting
    claim: 'Each speech opens with a challenge to Job; the first (38:2) concerns darkening God’s counsel or plan'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'At the beginning of each speech, God challenges a certain aspect of Job’s complaints. First, in Job 38:2 the Lord asks, “Who is this that darkeneth counsel by words without knowledge?” (Job 38:2). The word translated as “counsel” also means “plan.”'

  # thread
  - where: thread
    claim: 'Job is not yet ready to answer and retreats into silence (40:3–5); his real reply comes in 42:1–6'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job’s Second Speech (Job 42:1–6) — Job Penetrates the Veil. Initially not prepared to speak to the Lord (see Job 40:3–5), Job now responds, bringing the book to its climax.'
  - where: thread
    claim: 'The second speech opens by asking whether Job would condemn God to justify himself'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'God’s Second Speech (Job 40:6–41:34). God again challenges Job to answer Him (see Job 40:), asking if Job would condemn God in order to justify himself (see Job 40:8).'
  - where: thread
    claim: 'God does not condemn Job, and suggests both parties can be righteous'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'God does not condemn Job nor tell him that he is wicked, and He becomes the first one in the dialogue to suggest that both parties can both be righteous.'
  - where: thread
    claim: 'God invites Job to use raw power to punish the proud (40:9–14), then gives behemoth and leviathan as untamable creatures'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'God ironically invites Job to use raw power and coercively solve all of the inequities in the world, punishing the proud and wicked while clothing himself in glory (see Job 40:9–14)! … As a final tutorial, God gives Job the examples of Behemoth'

  # section plains (departures from the King James wording)
  - where: section 1 plain
    claim: 'Verse 2 read as a question to the faultfinder who contends with the Almighty'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2040&version=NRSVUE'
    quote: '“Shall a faultfinder contend with the Almighty? Anyone who argues with God must respond.”'
  - where: section 1 plain
    claim: 'Verse 2 asks whether Job will persist in contending with God; he who sets God right must answer'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/40.htm'
    quote: 'The question means, will Job persist in this contending with God? He who sets God right, as though he knew everything better than He, shall answer the questions put before him.'
  - where: section 2 plain
    claim: 'Verse 4 read as “I am of small account”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2040&version=NRSVUE'
    quote: '4 “See, I am of small account; what shall I answer you? I lay my hand on my mouth.'
  - where: section 3 plain
    claim: 'Verse 8 read as putting God in the wrong; verse 13 as binding faces in the world below (Hebrew “the hidden place”); verse 14 as the right hand giving victory'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2040&version=NRSVUE'
    quote: '8 Will you even put me in the wrong? … bind their faces in the world below. 14 Then I will also acknowledge to you that your own right hand can give you victory. … 40.13 Heb the hidden place'
  - where: section 4 plain
    claim: 'Verses 15–24 read with “just as I made you,” “first of the great acts of God,” “only its Maker can approach it with the sword,” lotus plants, reeds and marsh, and verse 24 as a question (the plain keeps the Hebrew “in his eyes” where the modern translation conjectures “hooks”)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2040&version=NRSVUE'
    quote: '19 “It is the first of the great acts of God; only its Maker can approach it with the sword. … 21 Under the lotus plants it lies, in the covert of the reeds and in the marsh. … 24 Can one take it with hooks or pierce its nose with a snare?'
  - where: section 4 plain
    claim: 'Verse 15 read as “which I made just as I made you”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2040&version=NRSVUE'
    quote: '15 “Look at Behemoth, which I made just as I made you; it eats grass like an ox.'

  # note 40:4
  - where: 'note 40:4 “Small, not vile”'
    claim: 'The verb behind “vile” means to be slight or light (root sense)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7043.htm'
    quote: '[קָלַל]82 verb be slight, swift, trifling (probably originally be light'
  - where: 'note 40:4 “Small, not vile”'
    claim: 'BDB: sense of a person being of little account'
    key: bdb
    url: 'https://biblehub.com/hebrew/7043.htm'
    quote: '3 trifling, i.e. of little account., of person, Genesis 16:4,5'
  - where: 'note 40:4 “Small, not vile”'
    claim: 'The word in Job 40:4 is the Qal perfect first singular of qalal'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'הֵ֣ן קַ֭לֹּתִי מָ֣ה אֲשִׁיבֶ֑/ךָּ'
  - where: 'note 40:4 “Small, not vile”'
    claim: 'A modern translation renders verse 4 “I am of small account”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2040&version=NRSVUE'
    quote: '4 “See, I am of small account; what shall I answer you?'
  - where: 'note 40:4 “Small, not vile”'
    claim: 'Job mentions unworthiness or insignificance, is not yet ready to respond, and retreats into silence'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job, however, is not yet ready to respond to the Lord (see Job 40:3–5). He mentions a sense of unworthiness (niv) or insignificance (rsv) as justification for his reticence and retreats into silence. Job’s feelings of inadequacy before the Lord correspond to those of the brother of Jared'
  - where: 'note 40:4 “Small, not vile”'
    claim: 'Job’s real reply comes in 42:1–6, after the second speech'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Initially not prepared to speak to the Lord (see Job 40:3–5), Job now responds, bringing the book to its climax.'

  # note 40:8
  - where: 'note 40:8 “Condemning God to be righteous”'
    claim: 'God reprimands Job for trying to frustrate His justice; Job set up a zero-sum game; God does not call Job wicked and suggests both can be righteous'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'Here God reprimands Job for attempting to “disannul my judgment” or “frustrate my justice.” Job has set up a zero-sum game where God must be wicked for Job to be righteous. God does not condemn Job nor tell him that he is wicked'
  - where: 'note 40:8 “Condemning God to be righteous”'
    claim: 'Elder Christofferson’s paraphrase of 40:8 and his statement that Job admits he cannot stand in judgment of the Almighty'
    key: christofferson-relationship-god
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/04/41christofferson?lang=eng'
    quote: 'Or in other words, “Will you even put me in the wrong? Will you condemn me that you may be justified?” … Job in deepest humility admits he possesses nothing even close to the knowledge, power, and righteousness of God and cannot stand in judgment of the Almighty'
  - where: 'note 40:8 “Condemning God to be righteous”'
    claim: 'Within the theology of retribution, either God or Job was unjust; Job will come to understand he does not have to condemn God to justify himself'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job, initially locked into the same theology but knowing he was innocent, was forced to question God’s justice (see Job 9:15–33, 12:13–25). By the standards of this theology, either God or Job was unjust/unrighteous. … the understanding that he does not have to condemn God to justify himself.'
  - where: 'note 40:8 “Condemning God to be righteous”'
    claim: 'God does not demand that Job give up his claim of innocence'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'God does not demand that Job give up his claim of innocence nor explain the reason for Job’s suffering but gently defends Himself against Job’s accusations of malign intent (see Job 38:2, 40:8, see also Job 12:22).'
  - where: 'note 40:10 “Clothed in God’s majesty”'
    claim: 'One older reading: try for once to act like God in executing justice; verse 11 recalls the judgment on the proud in Isaiah 2, and verse 14 recalls Isaiah 59:16 and 63:5'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/40.htm'
    quote: 'In connection with Job 40:11, one is directly reminded of the judgment on everything that is high and exalted in Isaiah 2 … Not less, however, does Job 40:14 recall Isaiah 59:16; Isaiah 63:5 (comp. Psalm 98:1)'
  - where: 'note 40:10 “Clothed in God’s majesty”'
    claim: 'Delitzsch’s summary of verses 10–14'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/40.htm'
    quote: 'Try it only for once - this is the collective thought - to act like Me in the execution of penal justice, I would praise thee.'
  - where: 'note 40:10 “Clothed in God’s majesty”'
    claim: 'Stirling: God ironically invites Job to use raw power, to elicit an understanding of true justice ruling in love without compulsion (D&C 121:34–45); Job demurs'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'In order to elicit or amplify a transformed understanding of true justice (ruling in love without compulsion — see D&C 121:34–45), God ironically invites Job to use raw power and coercively solve all of the inequities in the world'
  - where: 'note 40:10 “Clothed in God’s majesty”'
    claim: 'Job demurs, probably realizing compulsive force cannot bring good out of evil'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job apparently demurs, probably realizing that compulsive force cannot bring good out of evil and that use of such power is corrupting.'
  - where: 'note 40:10 “Clothed in God’s majesty”'
    claim: 'Verse 14 in a modern translation: the right hand can give victory'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2040&version=NRSVUE'
    quote: '14 Then I will also acknowledge to you that your own right hand can give you victory.'
  - where: 'note 40:15 “Behemoth, made with thee”'
    claim: 'Behemoth is apparently the intensive plural of the word for beast, a large river animal, possibly the hippopotamus'
    key: bd-behemoth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/behemoth?lang=eng'
    quote: 'Apparently the intensive plural of behemah, meaning “beast.” A large river animal (possibly the hippopotamus), described in Job 40:15–24.'
  - where: 'note 40:15 “Behemoth, made with thee”'
    claim: 'Behemoth and leviathan are wild and untamable, and typify the proud and hard-hearted who cannot be led or made party to a covenant; creation implies providing for redemption without compulsion'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Though part of God’s creation, these beasts are wild, ferocious, and unable to be tamed. As such, they typify the proud (see Job 41:34) [Page 166]and hard-hearted (see Job 41:24) who are unable to be led or made party to a covenant with God'
  - where: 'note 40:15 “Behemoth, made with thee”'
    claim: 'Stirling: taking responsibility for creation means providing for redemption without compulsory means'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Assuming responsibility for creation implies, in some sense, taking responsibility for such, yet creatively providing for redemption without using compulsory means.'
  - where: 'note 40:15 “Behemoth, made with thee”'
    claim: 'God cares for behemoth and leviathan as for the sparrow (Matt. 10:29)'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'God cares for mythical beasts like the Leviathan (Job 41:1–34) and the Behemoth (Job 40:15–24) … We can see this as being similar to Jesus’s reminder that “are not two sparrows sold for a farthing? And one of them shall not fall on the ground without your Father?”'
  - where: 'note 40:15 “Behemoth, made with thee”'
    claim: 'A modern translation: “which I made just as I made you”; “first of the great acts of God; only its Maker can approach it with the sword”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2040&version=NRSVUE'
    quote: '15 “Look at Behemoth, which I made just as I made you; it eats grass like an ox. … 19 “It is the first of the great acts of God; only its Maker can approach it with the sword.'
  - where: 'note 40:15 “Behemoth, made with thee”'
    claim: 'The word behind “chief” in 40:19 is reshith, which BDB lists under the sense “beginning”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7225.htm'
    quote: 'beginning (first product) of my manly vigour … compare דֵּרְכֵי אֵל ׳ר Job 40:19 (of hippopotamus), דַּרְכּוֺ ׳ר Proverbs 8:22 (of wisdom)'
  - where: 'note 40:15 “Behemoth, made with thee”'
    claim: 'The word in 40:19 is reshith (H7225)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'רֵאשִׁ֣ית'

  # christ
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'The voice answering Job is Jehovah’s; it is folly for mortals to presume to judge God'
    key: christofferson-relationship-god
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/04/41christofferson?lang=eng'
    quote: 'Jehovah forcefully reminds Job of His omnipotence and omniscience … It truly is folly for us with our mortal myopia to presume to judge God, to think, for example, “I’m not happy, so God must be doing something wrong.”'
  - where: christ
    claim: 'One older reading hears Isaiah 59:16 and 63:5 in verse 14'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/40.htm'
    quote: 'Not less, however, does Job 40:14 recall Isaiah 59:16; Isaiah 63:5 (comp. Psalm 98:1)'
  - where: christ
    claim: 'Job need not condemn God to justify himself'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'the understanding that he does not have to condemn God to justify himself.'

  # explore
  - where: explore
    claim: 'Isaiah 40:12–31 and Psalm 104 as passages that help read the LORD’s speeches'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'Isaiah 40:12–31 and Psalm 104 help us better understand God’s speeches to Job.'
