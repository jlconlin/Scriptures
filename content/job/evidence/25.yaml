chapter: 25
claims:
  - where: setting
    claim: 'Bildad’s third reply is short; Zophar has no third speech; some scholars think the book was corrupted in copying; the responsibility is to read the text as it stands'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Not only is Bildad’s reply uncharacteristically short, Zophar is not given a third speech, and some of Job’s final responses sound like they should come from his friends instead. These are certainly possibilities, but our responsibility is to read the text as it stands'
  - where: setting
    claim: 'Some scholars argue that earlier versions were corrupted in copying'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'This has prompted some scholars to argue that earlier versions of the book may have been corrupted during copying and transmission.'
  - where: setting
    claim: 'One older reading: Zophar’s silence and Bildad’s brevity are designed, showing the friends have nothing new and are beaten'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/25.htm'
    quote: 'Bildad alone speaks in the above speech, Zophar is silent. But Bildad does not utter a word that affects the question. This designed omission shows the inability of the friends to solve it'
  - where: setting
    claim: 'The same reading: the friends know nothing new to bring against Job; Bildad does not repeat Eliphaz’s incriminations of 22:5–11'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/25.htm'
    quote: 'they know nothing new to bring forward against Job, and nothing just to Job''s advantage … he does not make Bildad at last repeat those unjust incriminations which were put prominently forward in the speech of Eliphaz, Job 22:5-11.'
  - where: setting
    claim: 'One Latter-day Saint reading: Job finishes Bildad’s speech for him in 26:5–14 and the dialogue has broken down'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job then seems to “finish” Bildad’s speech for him by creating a parody of his position on the greatness of God (see Job 26:5–14).25 Meaningful dialogue has aborted.'
  - where: thread
    claim: 'Bildad says nothing that touches Job’s question'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/25.htm'
    quote: 'But Bildad does not utter a word that affects the question.'
  - where: thread
    claim: 'Bildad praises God’s greatness and man’s inability to be just before God, agreeing with Eliphaz (4:17–19; 15:14–16)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Bildad interjects with praise of God’s greatness and man’s inability to be just or righteous before God, agreeing with Eliphaz (see Job 25:1–3; see also Job 4:17–19, 15:14–16).'
  - where: section 2 plain
    claim: 'Verses 5–6 rendered “If even the moon is not bright … a mortal, who is a maggot … a worm”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+25&version=NRSVUE'
    quote: 'If even the moon is not bright and the stars are not pure in his sight, how much less a mortal, who is a maggot, and a human being, who is a worm!'
  - where: 'note 25:2 “Peace in the heights”'
    claim: 'Most expositors take the line as God establishing peace among the heavenly beings around Him'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/25.htm'
    quote: 'most expositors rightly take it as descriptive of the place and object of the action expressed: He establishes peace in His heights, i.e., among the celestial beings immediately surrounding Him.'
  - where: 'note 25:2 “Peace in the heights”'
    claim: 'One older reading: the poet knows of possibly recurring rebellion among the heavenly powers (9:13; 26:12), so the peace is a restoration of order by God'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/25.htm'
    quote: 'from Job 3:8; Job 9:13 (comp. Job 26:12.), it is clear that the poet … knows of actual, and not merely past, but possibly recurring, instances of hostile dissension and titanic rebellion among the celestial powers'
  - where: 'note 25:2 “Peace in the heights”'
    claim: 'The armies of verse 3 are the stars, pictured as an army under the one God'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/25.htm'
    quote: 'The stars, according to biblical representation, are like an army arrayed for battle … a standing army of the children of light, clad in the armour of light, under the guidance of the one God the Creator'
  - where: 'note 25:2 “Peace in the heights”'
    claim: '“He makes peace in his high heaven” in a modern translation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+25&version=NRSVUE'
    quote: 'he makes peace in his high heaven.'
  - where: 'note 25:2 “Peace in the heights”'
    claim: 'The line may concede that all is not as it should be on earth, though heaven is at peace; the Lord’s Prayer shows the truth in it'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'This may be a concession that all might not be how it should be on earth, but at least things are peaceful in heaven. There is truth to this statement since Jesus’s own model prayer says, “Thy will be done on earth, as it is in heaven”'
  - where: 'note 25:2 “Peace in the heights”'
    claim: 'If God’s will were always done on earth there would be no reason to pray for it'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'If God’s will were always done on earth, there would be no reason to pray for it to be done.'
  - where: 'note 25:4 “Justified with God”'
    claim: 'Bildad agrees with Eliphaz (4:17–19; 15:14–16) that man cannot be just or righteous before God'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Bildad interjects with praise of God’s greatness and man’s inability to be just or righteous before God, agreeing with Eliphaz (see Job 25:1–3; see also Job 4:17–19, 15:14–16).'
  - where: 'note 25:4 “Justified with God”'
    claim: 'The Church’s footnote to “clean” points to Ether 12:37 and D&C 88:74–75 and 135:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/25?lang=eng'
    quote: '4b “clean”: Ether 12:37; D&C 88:74 (74–75); 135:5 (4–5).'
  - where: 'note 25:4 “Justified with God”'
    claim: 'In D&C 88:74 the Lord commands the first laborers to sanctify themselves and purify their hearts so that He may make them clean'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'you, who are the first laborers in this last kingdom, a commandment that you assemble yourselves together, and organize yourselves, and prepare yourselves, and sanctify yourselves; yea, purify your hearts'
  - where: 'note 25:4 “Justified with God”'
    claim: 'Ether 12:37: the Lord tells Moroni his garments shall be made clean'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/ether/12?lang=eng'
    quote: 'thou hast been faithful; wherefore, thy garments shall be made clean. And because thou hast seen thy weakness thou shalt be made strong'
  - where: 'note 25:6 “Maggot and worm”'
    claim: 'rimmâ is the worm as cause and sign of decay; in Job 7:5; 17:14; 21:26; 24:20 it feeds on the dead; at 25:6 a hyperbole for insignificant man'
    key: bdb
    url: 'https://biblehub.com/hebrew/7415.htm'
    quote: 'worm (cause and sign of decay); … Job 7:5; Job 17:14; Job 21:26; Job 24:20 all indicate corruption, feeding on dead, etc.; hyperb. of insignificant man Job 25:6'
  - where: 'note 25:6 “Maggot and worm”'
    claim: 'tôlēʿâ is the worm as a symbol of insignificance in Isa. 41:14, Job 25:6 and Ps. 22'
    key: bdb
    url: 'https://biblehub.com/hebrew/8438.htm'
    quote: 'symbol of insignificance Isaiah 41:14; Job 25:6 ("" רִמָּה), Psalm 22:7.'
  - where: 'note 25:6 “Maggot and worm”'
    claim: 'The two Hebrew words in verse 6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'רִמָּ֑ה … תּוֹלֵעָֽה'
  - where: 'note 25:6 “Maggot and worm”'
    claim: 'A modern translation renders the two words “maggot” and “worm”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+25&version=NRSVUE'
    quote: 'how much less a mortal, who is a maggot, and a human being, who is a worm!'
  - where: 'note 25:6 “Maggot and worm”'
    claim: 'One Latter-day Saint reading: Bildad answers Psalm 8’s “What is man?” with “a worm,” stripping man of royal potential'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Bildad answers the question of Psalm 8 (What is man?) by saying that man is a maggot or worm (see Job 25:6)! Thus, Bildad distorts Psalm 8 to strip humans of any royal potential before God.'
  - where: christ
    claim: 'Psalm 22:6 calls the sufferer a worm; Christ descended below all things and was treated as a worm; Bildad uses the word to suggest Job’s suffering is due to sin, and Christ is mocked on the same reasoning'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'Just as Bildad accuses Job of being a sinful worm, providing Job’s suffering as evidence, so Christ—“a worm”—is mocked because his suffering on the cross demonstrates to them his cursed, sinful status.'
  - where: christ
    claim: 'Christ, who descended below all things, was treated as the lowest of creatures, a worm'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'Christ, who “descended below all things” (D&C 88:6; see also Eph. 4:9–10), was considered as less than any other human being … He was treated as the lowest of creatures, as a “worm,”'
  - where: christ
    claim: 'One Latter-day Saint reading: Bildad uses “worm” to suggest Job’s suffering is due to sin, an uncleanness common to all'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'Job’s friend Bildad uses the word “worm” to suggest that Job’s suffering is due to his sins, a state of uncleanness that is common to all of humankind'
  - where: christ
    claim: 'Christ quoted Psalm 22:1 as He hung on the cross'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'one quoted from the Psalms by Christ as he hung upon the cross'
