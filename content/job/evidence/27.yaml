chapter: 27
claims:
  # setting / thread
  - where: setting
    claim: 'Job takes an oath in 27:1–6 to hold fast his integrity; 27:13 quotes Zophar''s 20:29'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job takes an oath in the name of God that he will not lie and that he will continue to hold fast to his integrity and righteousness … even quoting Zophar (Job speaking in Job 27:13, Zophar speaking in Job 20:29).'
  - where: setting
    claim: '"Integrity" in 27:5 is the same Hebrew noun as in 2:3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'תֻּמָּתִ֣/י'
  - where: thread
    claim: 'Job begins with an asseveration of truthfulness by the life of God'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/27.htm'
    quote: 'Job begins with an asseveration of his truthfulness (i.e., the agreement of his confession with his consciousness) by the life of God.'
  - where: thread
    claim: 'In 27:12 Job grants the friends the rule about the wicked man''s lot; their application to him is false'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/27.htm'
    quote: 'he grants to them what he appeared hitherto to deny, that the lot of the evil-doer, certainly in the rule, although not without exceptions, is such as they have said. The application, however, which they have made of this abiding fact of experience, as and remains all the more false'
  # section plains
  - where: section 1 plain
    claim: 'Verse 2 "taken away my right," "made my soul bitter"; verse 5 "Far be it from me to say that you are right"'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2027&version=NRSVUE'
    quote: '2 “As God lives, who has taken away my right, and the Almighty, who has made my soul bitter,(B) … 5 Far be it from me to say that you are right;'
  - where: section 1 plain
    claim: 'Verse 1: Job continued to take up his solemn discourse'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/27.htm'
    quote: '1 Then Job continued to take up his proverb, and said:'
  - where: section 2 plain
    claim: 'Verses 7–12 rendered'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2027&version=NRSVUE'
    quote: '7 “May my enemy be like the wicked, and may my opponent be like the unrighteous. … 12 All of you have seen it yourselves; why then have you become altogether vain?'
  - where: section 3 plain
    claim: 'Verses 21–22: the east wind sweeps him out of his place and hurls at him without pity'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2027&version=NRSVUE'
    quote: '21 The east wind lifts them up, and they are gone; it sweeps them out of their place. 22 It hurls at them without pity; they flee from its power in headlong flight.'
  - where: section 3 plain
    claim: 'Verse 18: moth''s house; watchman''s hut in a vineyard'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/27.htm'
    quote: 'it is like a light hut, perhaps for the watchman of a vineyard (Isaiah 1:8), which is put together only for the season during which the grapes are ripening.'
  - where: section 3 plain
    claim: 'Verse 19: he lies down rich but will do so no more; verse 20 terrors like a flood'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2027&version=NRSVUE'
    quote: '19 They go to bed with wealth but will do so no more; they open their eyes, and it is gone. 20 Terrors overtake them like a flood;'
  # note 27:1
  - where: 'note 27:1 “Job''s parable”'
    claim: 'The word is mashal'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'מְשָׁל֗/וֹ'
  - where: 'note 27:1 “Job''s parable”'
    claim: '"Lift up a mashal" is used of Balaam''s oracles; Job 27:1 and 29:1 are compared'
    key: bdb
    url: 'https://biblehub.com/hebrew/4912.htm'
    quote: 'prophetic figurative discourse: נָשָׂא מָשָׁל lift up, utter a ׳מ Numbers 23:7,18; Numbers 24:3,15,20,21,23 (all of Balaam); Isaiah 14:4; Micah 2:4 ("" נהי) Habakkuk 2:6 ("" חידה), (compare Job 27:1; Job 29:1 for same phrase under 6).'
  - where: 'note 27:2 “An oath by the God who wronged him”'
    claim: '"Taken away my judgment" means taken away my right'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2027&version=NRSVUE'
    quote: '2 “As God lives, who has taken away my right,'
  - where: 'note 27:2 “An oath by the God who wronged him”'
    claim: 'The oath binds Job to God in covenant fidelity; he will not falsely admit sin nor answer suffering with evil'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'in effect binding himself to God in covenant fidelity. He will not falsely admit (major) sin in order to avail himself of grace, as the friends have proposed, nor will he respond with evil despite his unjust suffering. Although nothing seems to justify it, Job remains loyal to God'
  - where: 'note 27:2 “An oath by the God who wronged him”'
    claim: 'Job takes an oath in God''s name that he will not lie'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job takes an oath in the name of God that he will not lie and that he will continue to hold fast to his integrity and righteousness'
  # note 27:5
  - where: 'note 27:5 “The LORD''s word in Job''s mouth”'
    claim: 'Integrity in 27:5 is tummah, the noun of 2:3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'בְּ/תֻמָּת֔/וֹ'
  - where: 'note 27:5 “The LORD''s word in Job''s mouth”'
    claim: '"Hold fast" in 27:6 is the verb of 2:3 and 2:9 (hzq)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'הֶ֭חֱזַקְתִּי'
  - where: 'note 27:5 “The LORD''s word in Job''s mouth”'
    claim: 'That Job has kept his integrity is made clear in 27:1–6'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'That Job has maintained his integrity is made clear in his next response (see Job 27:1–6).'
  - where: 'note 27:5 “The LORD''s word in Job''s mouth”'
    claim: 'Integrity is remaining absolutely honest while seeking God; admitting sins to justify suffering would be holding to a lie'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'which, in my view, consists of remaining absolutely honest but continuing to seek a relationship with God despite the loss of the hedge. Failure of integrity would result from yielding to the pressure of the crowd and admitting that his sins justify his suffering, effectively holding on to a lie in hopes of appeasing “God.”'
  - where: 'note 27:5 “The LORD''s word in Job''s mouth”'
    claim: 'The friends proposed that Job falsely admit sin to obtain grace'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'He will not falsely admit (major) sin in order to avail himself of grace, as the friends have proposed'
  # note 27:7
  - where: 'note 27:7 “Who is the wicked man?”'
    claim: 'Job may have invoked God''s justice on his enemies the friends in 27:7–10; later he intercedes for them'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Whereas Job may have once invoked God’s justice on his enemies — the friends, see Job 27:7–10) — Job now desires that the friends partake of the new life inside the new hedge.'
  # note 27:13
  - where: 'note 27:13 “Zophar''s words handed back”'
    claim: 'Job begins as Zophar (20:29) concluded and holds the mirror back to the friends'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/27.htm'
    quote: 'In the following strophe (Job 27:13) Job now begins as Zophar (Job 20:29) concluded. He gives back to the friends the doctrine they have fully imparted to him. They have held the lot of the evil-doer before him as a mirror'
  - where: 'note 27:13 “Zophar''s words handed back”'
    claim: 'In 27:12 Job grants the rule about the wicked; their application to him is false'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/27.htm'
    quote: 'he holds it before them, that they may perceive how not only his bearing under suffering, but also the form of his affliction, is of a totally different kind.'
  - where: 'note 27:13 “Zophar''s words handed back”'
    claim: '27:13–23 is an apparent caricature of the friends'' description, quoting Zophar, as Job composes a speech for him'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job closes chapter 27 (see Job 27:13-23) with an apparent caricature of the friends’ (especially Zophar’s) description of the fate of the wicked, even quoting Zophar'
  - where: 'note 27:13 “Zophar''s words handed back”'
    claim: 'Job apparently composes a speech for Zophar'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'will later be quoted by Job as he apparently composes a speech for Zophar (see Job 27:13).'
  # note 27:18
  - where: 'note 27:18 “A moth''s house and a watchman''s hut”'
    claim: 'The Hebrew of 27:18: moth (ash), booth (sukkah), watchman (noser)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'כָ/עָ֣שׁ'
  - where: 'note 27:18 “A moth''s house and a watchman''s hut”'
    claim: 'The house, though a palace, is as brittle as a moth''s spinning or case; the hut is for a vineyard watchman for the season (Isa. 1:8)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/27.htm'
    quote: 'The house of the ungodly man, though a palace, is, as the fate of the fabric shows, as brittle and perishable a thing, and can be as easily destroyed, as the fine spinning of a moth … or even the small case which it makes from remnants of gnawed articles, and drags about with it'
  - where: 'note 27:18 “A moth''s house and a watchman''s hut”'
    claim: 'Watchman''s hut put up for the ripening season'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/27.htm'
    quote: 'it is like a light hut, perhaps for the watchman of a vineyard (Isaiah 1:8), which is put together only for the season during which the grapes are ripening.'
  - where: 'note 27:18 “A moth''s house and a watchman''s hut”'
    claim: 'Clapping of hands is malicious joy, hissing scorn (Lam. 2:15)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/27.htm'
    quote: 'The clapping of hands (שׂפק כּפּים equals ספק, Lamentations 2:15, comp. תּקע, Nahum 3:19) is a token of malignant joy, and hissing (שׁרק, Zephaniah 2:15; Jeremiah 49:17) a token of scorn.'
  # christ
  - where: christ
    claim: 'The Church''s footnote to "integrity" in 27:5 points to D&C 54:10 and Mosiah 24:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/27?lang=eng'
    quote: '“integrity”: Mosiah 24:15 (15–16); D&C 54:10.'
  - where: christ
    claim: 'Job provides a roadmap for mortal trials: hold to righteousness (27:6)'
    key: sc-knowhy-640
    url: 'https://scripturecentral.org/knowhy/how-can-the-book-of-job-teach-us-about-the-temple'
    quote: 'In this sense, Job provides a roadmap for navigating the trials of mortality: “hold to righteousness (see Job 27:6), stay in God’s paths (see Job 23:11), be receptive to revelation, and continually seek God’s face (see Job 13:3–22).”'
  - where: christ
    claim: 'Failure of integrity would be yielding to the pressure of the crowd and holding to a lie'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Failure of integrity would result from yielding to the pressure of the crowd and admitting that his sins justify his suffering, effectively holding on to a lie in hopes of appeasing “God.”'
  # explore
  - where: explore
    claim: 'The Church''s footnote at verse 5 sets Mosiah 24:15–16 beside it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/27?lang=eng'
    quote: '“integrity”: Mosiah 24:15 (15–16); D&C 54:10.'
