chapter: 12
claims:
  - where: setting
    claim: 'Zophar''s “vain man” (11:12) is an empty, hollow man; Job answers that he is not empty'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/12.htm'
    quote: 'he also has a heart like them, he is therefore not empty, נבוב, Job 11:12.'
  - where: setting
    claim: 'Job sets out to show the friends that the majesty of God before which they tell him to humble himself is known to him as to them; this is his third answer'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/12.htm'
    quote: 'he will show the friends that the majesty of God, before which he ought, according to their demands, to humble himself in penitence, is not less known to him than to them; and with ואולם, verum enim vero, he passes over to this subject when he begins his third answer'
  - where: setting
    claim: 'In chapter 13 Job challenges the friends and repeats his challenge to God'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'In this chapter, Job directly challenges his friends and repeats his challenge to God.'
  - where: setting
    claim: 'In chapter 14 Job turns to the grave and a hope like resurrection'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'It is clear in Job 14 that Job wishes that he could go to the grave and come out when all the trouble has blown over.'
  - where: setting
    claim: 'Come, Follow Me lists 12:10, 13, 16 among what Job knew about the Lord'
    key: cfm-ot-2026-33
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/33?lang=eng'
    quote: 'Job was faithful in his challenges because of what he knew about the Lord. … Here are some verses that show what Job knew about the Lord: Job 12:10, 13, 16; 19:25–27.'
  - where: setting
    claim: 'The seminary manual sets 12:9–13, 16 beside 13:15–16 as what Job came to feel and learn about God'
    key: ot-seminary-2026-job-1-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-manual-2026/32-job/321-job-1-13?lang=eng'
    quote: 'Read Job 12:9–13, 16; 13:15–16 and mark what Job came to feel and learn about God.'
  - where: setting
    claim: 'Job holds God responsible because God is in control of the world'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'He does not see how anyone could argue that God is not responsible since He is the one in control of the world.'
  - where: thread
    claim: 'The movement of the speech: sarcasm and the laughingstock (1–4), the robbers (6), God''s power (10–13) over nature (15) and history (17–25), blame placed on God'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job first sarcastically dismisses the friends’ wisdom, insisting that he also has understanding while ever mindful that, though innocent, he has become a laughingstock (see Job 12:1–4). … Job notes that God has all power (see Job 12:10, 12, 13), manifested both by control over nature (see Job 12:15) and human history (see Job 12:17–25).'
  - where: thread
    claim: 'Verse 13 is the antithesis to verse 12; the following strophe describes God''s working among men and in nature'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/12.htm'
    quote: 'But - such is the antithesis in Job 12:13 which belongs to this strophe - the highest possessor of wisdom, as of might, is God. … Job describes the working of God, as the unsearchably wise and the irresistibly mighty One, both among men and in nature.'
  - where: thread
    claim: 'In 12:13–25 Job, knowing he was innocent, questions God''s justice'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job, initially locked into the same theology but knowing he was innocent, was forced to question God’s justice (see Job 9:15–33, 12:13–25).'
  - where: section 1 plain
    claim: 'Verse 5 rendered as contempt for misfortune'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2012&version=NRSVUE'
    quote: 'Those at ease have contempt for misfortune, but it is ready for those whose feet are unstable.'
  - where: section 4 plain
    claim: 'Verse 19 rendered “priests”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2012&version=NRSVUE'
    quote: 'He leads priests away stripped and overthrows the mighty.'
  - where: 'note 12:2 “Wisdom shall die with you”'
    claim: 'The Greek translation renders verse 2 as a question'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/job/12.htm'
    quote: 'So then ye alone are men, and wisdom shall die with you?'
  - where: 'note 12:2 “Wisdom shall die with you”'
    claim: 'Nābab, the root of the “vain” man of 11:12, means hollow'
    key: bdb
    url: 'https://biblehub.com/hebrew/5014.htm'
    quote: 'nabab: To pierce, to hollow, to perforate'
  - where: 'note 12:2 “Wisdom shall die with you”'
    claim: 'Job sarcastically dismisses the friends'' wisdom'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job first sarcastically dismisses the friends’ wisdom, insisting that he also has understanding'
  - where: 'note 12:4 “A righteous man, a laughingstock”'
    claim: 'Verse 4 calls Job ṣaddîq tāmîm'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'צַדִּ֥יק … תָּמִֽים'
  - where: 'note 12:4 “A righteous man, a laughingstock”'
    claim: 'Job 1:1 has tām'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'תָּ֧ם'
  - where: 'note 12:4 “A righteous man, a laughingstock”'
    claim: 'Tāmîm is from the root tāmam'
    key: bdb
    url: 'https://biblehub.com/hebrew/8549.htm'
    quote: 'Word Origin: [from H8552 (תָּמַם - finished)]'
  - where: 'note 12:4 “A righteous man, a laughingstock”'
    claim: 'Tām, “perfect,” is from the same root tāmam'
    key: bdb
    url: 'https://biblehub.com/hebrew/8535.htm'
    quote: 'KJV: coupled together, perfect, plain, undefiled, upright … Word Origin: [from H8552 (תָּמַם - finished)]'
  - where: 'note 12:4 “A righteous man, a laughingstock”'
    claim: 'Though innocent, Job has become a laughingstock'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'ever mindful that, though innocent, he has become a laughingstock (see Job 12:1–4).'
  - where: 'note 12:5 “A lamp despised, or contempt for misfortune”'
    claim: 'The old translations read lappîd as “torch”; the figure of the cast-away torch'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/12.htm'
    quote: 'Most old translators (Targ., Vulg., Luther) give לפּיד the signification, a torch. … Job might not inappropriately say, that in the eyes of the prosperous he is like a despised, cast-away torch'
  - where: 'note 12:5 “A lamp despised, or contempt for misfortune”'
    claim: 'Later interpreters divide the word as l- and pîd, misfortune, found also at Job 30:24 and 31:29'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/12.htm'
    quote: 'like Abenezra and modern expositors, who are here happily agreed, take לפיד as composed of ל and פּיד, a word common to the books of Job (Job 30:24; Job 31:29) and Proverbs'
  - where: 'note 12:5 “A lamp despised, or contempt for misfortune”'
    claim: 'The older rendering of verse 5'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/12.htm'
    quote: 'Contempt belongs to misfortune, according to the ideas of the prosperous; … It awaits those who are ready to slip.'
  - where: 'note 12:5 “A lamp despised, or contempt for misfortune”'
    claim: 'Job is an object of contempt to the friends'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/12.htm'
    quote: 'true, I am an object of scornful contempt to you, who are as little able to understand the suffering of the godly as the prosperity of the godless'
  - where: 'note 12:5 “A lamp despised, or contempt for misfortune”'
    claim: 'A modern translation of verse 5'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2012&version=NRSVUE'
    quote: 'Those at ease have contempt for misfortune, but it is ready for those whose feet are unstable.'
  - where: 'note 12:9 “The LORD''s hand, and what it has done”'
    claim: 'YHWH (lemma 3068) occurs in Job only in 1:6–2:7, at 12:9, and from 38:1 on (hebrew.mjs --word H3068 lists Job 1:6 … 2:7, 12:9, 38:1, 40:1, 3, 6, 42:1, 7, 9–12); the 12:9 occurrence'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'יְ֝הוָה'
  - where: 'note 12:9 “The LORD''s hand, and what it has done”'
    claim: 'Verse 4 has Eloah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'לֶ֭/אֱלוֹהַּ'
  - where: 'note 12:9 “The LORD''s hand, and what it has done”'
    claim: 'Job says all creation knows God is behind this and puts the responsibility on God'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'He claims that everyone, even the animals and all of Creation, know that God is behind this, asking, “Who knoweth not in all these that the hand of the Lord hath wrought this?” (verse 9).'
  - where: 'note 12:9 “The LORD''s hand, and what it has done”'
    claim: 'The chapter does not account for human agency, part of the plan since the premortal realm'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'However, one thing that the book of Job does not properly account for in this chapter is human agency. God has created a world that allows His creations to make choices, both good and bad, and this was part of the plan since the premortal realm'
  - where: 'note 12:9 “The LORD''s hand, and what it has done”'
    claim: 'Job places the blame for injustice squarely on God'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Accordingly, he places the blame for the injustice squarely on God, asking rhetorically: “Who … does not know that the hand of the Lord has done this?” (Job 12:9, rsv).'
  - where: 'note 12:9 “The LORD''s hand, and what it has done”'
    claim: 'Come, Follow Me counts 12:10 among what Job knew about the Lord'
    key: cfm-ot-2026-33
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/33?lang=eng'
    quote: 'Here are some verses that show what Job knew about the Lord: Job 12:10, 13, 16; 19:25–27.'
  - where: 'note 12:12 “Wisdom with the old, and with God”'
    claim: 'Job takes up the sayings of the fathers that Bildad appealed to'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/12.htm'
    quote: 'Job now refers to the sayings of the fathers, the authority of which, as being handed down from past generations, Bildad had maintained in his opposition to Job.'
  - where: 'note 12:12 “Wisdom with the old, and with God”'
    claim: 'Sayings are to be tested as the palate tests food; long life is a school of understanding; above it God is the highest possessor of wisdom'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/12.htm'
    quote: 'The meaning of Job 12:11 is, that the sayings … of the ancients are not to be accepted without being proved … We prefer, as the most natural: long life is a school of understanding. But - such is the antithesis in Job 12:13 … the highest possessor of wisdom, as of might, is God.'
  - where: 'note 12:12 “Wisdom with the old, and with God”'
    claim: 'A modern translation reads verse 12 as a question'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2012&version=NRSVUE'
    quote: 'Is wisdom with the aged and understanding in length of days?'
  - where: 'note 12:17 “God undoes the great”'
    claim: 'The word in verse 19 is kōhănîm'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'כֹּהֲנִ֣ים'
  - where: 'note 12:17 “God undoes the great”'
    claim: 'Kōhēn means priest; the KJV elsewhere renders it “chief ruler” and “prince”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3548.htm'
    quote: 'kohen: priest, priests, priest''s … KJV: chief ruler, X own, priest, prince, principal officer'
  - where: 'note 12:17 “God undoes the great”'
    claim: 'A modern translation has “priests” in verse 19'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2012&version=NRSVUE'
    quote: 'He leads priests away stripped and overthrows the mighty.'
  - where: 'note 12:17 “God undoes the great”'
    claim: 'Job shared the theology of retribution, knew he was innocent, and so questioned God''s justice in 12:13–25'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'In the rigid theology of retribution that Job once shared with the friends, they concluded he was sinful because he suffered. Job, initially locked into the same theology but knowing he was innocent, was forced to question God’s justice (see Job 9:15–33, 12:13–25).'
  - where: 'note 12:17 “God undoes the great”'
    claim: 'The rebuke of 38:2 answers 12:13–22 on this reading'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'God chides Job for darkening His “counsel by words without knowledge” (Job 38:2; see also Job 12:13–22).'
  - where: 'note 12:17 “God undoes the great”'
    claim: 'Psalm 107:40 joins 12:21a and 12:24b'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/107?lang=eng'
    quote: 'He poureth contempt upon princes, and causeth them to wander in the wilderness, where there is no way.'
  - where: christ
    claim: 'The footnote to “wisdom” in 12:13 points to 2 Ne. 9:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/12?lang=eng'
    quote: '13a “wisdom”: 2 Ne. 9:8; Abr. 3:21.'
  - where: christ
    claim: 'In 2 Nephi 9:10 God prepares a way of escape from death and hell'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/9?lang=eng'
    quote: 'O how great the goodness of our God, who prepareth a way for our escape from the grasp of this awful monster; yea, that monster, death and hell'
  - where: christ
    claim: 'The book of Job never answers why; trusting God and not one''s own understanding is the way to meet difficulty'
    key: renlund-trust-god
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/08/03_trust-god-and-let-him-prevail?lang=eng'
    quote: 'The book of Job addresses the question but never answers the why. Job learns that trusting God and not relying on his own understanding is the way to approach difficulties in life.'
  - where: explore
    claim: 'Chapters 38–39 are God''s questions about the created order'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Two chapters of uninterrupted questions related to the created order then follow.'
