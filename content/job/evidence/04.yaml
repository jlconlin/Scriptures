chapter: 4
claims:
  - where: setting
    claim: 'Eliphaz breaks the silence in chapter 4'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Eliphaz breaks his silence and “tries a word” (Job 4:2) with Job.'
  - where: setting
    claim: 'Chapter 15 opens the second round with Eliphaz'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job 15–21 represents the second round of speeches between Job and his three friends. Eliphaz continues much of the same arguments that he began in Job 4–5'
  - where: setting
    claim: 'Chapter 22 is Eliphaz''s third and last speech'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Eliphaz responds to Job for the third and final time.'
  - where: setting
    claim: 'Eliphaz''s words can be heard as encouragement or accusation'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'We can read Eliphaz’s words as accusatory, or we can read them as encouraging.'

  - where: thread
    claim: 'From the vision Eliphaz implies Job has done something wrong'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'If God charges even his angels with folly (see verse 18), Eliphaz seems to imply, Job has surely done something wrong to warrant the current situation.'
  - where: thread
    claim: 'In chapter 5 Eliphaz draws the conclusion: Job has done wrong and God is correcting him'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Eliphaz implies that Job has done something wrong and that God is teaching him through suffering.'

  - where: 'note 4:6 “Comfort that cuts both ways”'
    claim: 'The words can be heard as the mockers'' taunt or as encouragement; verse 6 rendered as two questions about fear of God and integrity'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'We can read Eliphaz’s words in the same tone as that of those who taunted the Savior, saying, “He saved others; himself he cannot save,” but we could also read them as being more charitable and encouraging for Job.'
  - where: 'note 4:6 “Comfort that cuts both ways”'
    claim: 'The two attributes are those of Job 1:1, confirmed by God'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'These two attributes—his relationship with God and his integrity—are what the narrator tells us about in Job 1:1 and what God confirms in His conversations with Satan (1:8; 2:3).'
  - where: 'note 4:6 “Comfort that cuts both ways”'
    claim: 'A modern translation of verse 6'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+4&version=NRSVUE'
    quote: 'Is not your fear of God your confidence and the integrity of your ways your hope?'
  - where: 'note 4:7 “Do the innocent perish?”'
    claim: 'Job and his friends thought all suffering was caused by sin; that is false'
    key: renlund-trust-god
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/08/03_trust-god-and-let-him-prevail?lang=eng'
    quote: 'Job and his friends thought that all suffering was caused by sin. That, too, is fundamentally false.'
  - where: 'note 4:7 “Do the innocent perish?”'
    claim: 'The couplet on sin and suffering'
    key: renlund-trust-god
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/08/03_trust-god-and-let-him-prevail?lang=eng'
    quote: 'Understanding the book of Job is facilitated when we consider this couplet: “All sin causes suffering, but not all suffering is caused by sin.”'
  - where: 'note 4:7 “Do the innocent perish?”'
    claim: 'Meant as comfort, but for Job, whose children had died, it implies they got what they deserved'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'From one perspective, this might seem comforting: Job just needs to stay the course and everything will turn out fine. However, for Job, whose children just perished, it could imply that they got what they deserved.'
  - where: 'note 4:7 “Do the innocent perish?”'
    claim: 'The reader knows neither Job nor his children suffer for wrongdoing'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'the narrative itself makes Eliphaz’s position untenable since we as readers know that neither Job nor his children are suffering for anything they have done wrong.'
  - where: 'note 4:7 “Do the innocent perish?”'
    claim: 'The Church''s footnote at “innocent” points to Alma 14:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/4?lang=eng'
    quote: '“innocent”: 1 Cor. 10:13; 1 Ne. 22:19; Alma 14:11.'
  - where: 'note 4:7 “Do the innocent perish?”'
    claim: 'The Papers'' annotation of D&C 121:10 lists the speeches that charged Job'
    key: jsp-letter-1839-03-20
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-and-edward-partridge-20-march-1839/8'
    quote: 'thou art not yet as Job thy friends do not contend against thee neither charge thee with transgretion as they did Job39 … 39: See Job chaps. 4–5, 8, 11, 15, 18, 20, 22, 25, 32–37.'
  - where: 'note 4:7 “Do the innocent perish?”'
    claim: 'A clerk''s report: reading Job 38 at a Sunday meeting in 1841, Joseph Smith called the book a display of human nature, the natural conclusion that the afflicted suffer God''s wrath'
    key: jsp-discourse-1841-03-28
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-circa-28march-1841/1'
    quote: 'Joseph Reads the 38th. Ch— of Job. in the book he says is a great Display of human Nature— it is very Natureal for a man when he sees his fellow man afflicted his Natureal conclusion is that he is suffering the Rath of an angry God & turn from him in haste not knowing the purposes of God'

  - where: 'note 4:10 “The broken lions”'
    claim: 'One older reading: the lion simile shows that the ungodly, and they alone, perish'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/4.htm'
    quote: 'That the ungodly, and they alone, perish, is shown in Job 4:10. under the simile of the lions.'
  - where: 'note 4:10 “The broken lions”'
    claim: 'One older reading: the verb is a form of the one in Psalm 58 (KJV 58:6, “break out”); “perisheth” means wandering about helpless'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/4.htm'
    quote: 'נתע equals נתץ, Psalm 58:7, evellere, elidere … The participle אבד is a stereotype expression for wandering about viewless and helpless'

  - where: 'note 4:12 “What Eliphaz saw in the night”'
    claim: 'The friends'' counsel rests on human reason, not revelation, as Eliphaz''s “we have searched it” shows'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'they are counsels based on human reason about suffering in general—upon hearsay, as it were—not upon revelation about Job’s particular predicament. This is clear when Eliphaz proudly discloses the source of his knowledge'
  - where: 'note 4:12 “What Eliphaz saw in the night”'
    claim: 'Stirling: the vision''s message is Satan''s position in the prologue'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'that man cannot be righteous or pure before God and that man dies without wisdom (Job 4:17–21). This is precisely Satan’s position in the Prologue regarding Job — that Job would be unable to remain blameless and upright without the hedge.'
  - where: 'note 4:12 “What Eliphaz saw in the night”'
    claim: 'Stirling calls it a spurious revelation'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'By absorbing and expounding this spurious revelation, Eliphaz and the other friends unwittingly become representatives of Satan.'
  - where: 'note 4:12 “What Eliphaz saw in the night”'
    claim: 'Eliphaz returns to the message at 15:15'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'He again emphasizes that God doesn’t even trust His angels: “He putteth no trust in saints; yea, the heavens are not clean in his sight” (verse 15).'

  - where: 'note 4:17 “Righteous before God”'
    claim: 'The preposition may be comparative or causal; one older reading takes it as causal (justified by God)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/4.htm'
    quote: 'The question arises whether מן is comparative: prae Deo … or causal: a Deo, h.e., ita ut a Deo justificetur. All modern expositors rightly decide on the latter.'
  - where: 'note 4:17 “Righteous before God”'
    claim: 'A modern translation of verses 17–18'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+4&version=NRSVUE'
    quote: '‘Can mortals be righteous before God? Can humans be pure before their Maker? Even in his servants he puts no trust, and his angels he charges with error;'
  - where: 'note 4:17 “Righteous before God”'
    claim: 'One older reading: not that angels sin, but their holiness never equals God''s'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/4.htm'
    quote: 'it is not meant that the good spirits positively sin … but that even the holiness of the good spirits is never equal to the absolute holiness of God'
  - where: 'note 4:17 “Righteous before God”'
    claim: 'Eliphaz implies Job has done wrong'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'If God charges even his angels with folly (see verse 18), Eliphaz seems to imply, Job has surely done something wrong to warrant the current situation.'

  - where: 'note 4:19 “A tabernacle of clay”'
    claim: 'A modern translation of verses 19–21: crushed like a moth; the tent cord plucked up'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+4&version=NRSVUE'
    quote: 'who are crushed like a moth. … they perish forever without any regarding it. Their tent cord is plucked up within them'
  - where: 'note 4:19 “A tabernacle of clay”'
    claim: 'One Latter-day Saint reading: Mosiah 3:5 quotes the Hebrew of Job 4:19'
    key: sc-knowhy-314
    url: 'https://scripturecentral.org/knowhy/how-did-king-benjamin-teach-his-people-to-trust-god-more'
    quote: 'The phrase “dwell in a tabernacle of clay” is a direct quotation from the Hebrew of Job 4:19.'
  - where: 'note 4:19 “A tabernacle of clay”'
    claim: 'Mosiah 3:5 is the Lord Omnipotent, with power, dwelling in a tabernacle of clay'
    key: sc-knowhy-314
    url: 'https://scripturecentral.org/knowhy/how-did-king-benjamin-teach-his-people-to-trust-god-more'
    quote: 'Benjamin also stated that God had all power, in heaven and in earth. This alludes back to when he said that “with power, the Lord Omnipotent ... shall come down from heaven among the children of men, and shall dwell in a tabernacle of clay”'
  - where: 'note 4:19 “A tabernacle of clay”'
    claim: 'The quotation is apparent only in Hebrew'
    key: sc-knowhy-410
    url: 'https://scripturecentral.org/knowhy/what-parts-of-the-old-testament-were-on-the-plates-of-brass'
    quote: 'Mosiah 3:5, for example, quotes Job 4:19, but this is really only apparent in Hebrew.'

  - where: christ
    claim: 'Jesus was sinless yet suffered; His righteousness did not shield Him, and His suffering often came because He was righteous'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Jesus’s righteousness did not shield him from suffering. In fact, his suffering often came because he was righteous'
  - where: christ
    claim: 'Joseph Smith: the natural conclusion is to see the afflicted as under God''s wrath and turn away'
    key: jsp-discourse-1841-03-28
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-circa-28march-1841/1'
    quote: 'his Natureal conclusion is that he is suffering the Rath of an angry God & turn from him in haste not knowing the purposes of God'

  - where: parallels
    claim: 'One Latter-day Saint reading: Mosiah 3:5 quotes the Hebrew of Job 4:19'
    key: sc-knowhy-314
    url: 'https://scripturecentral.org/knowhy/how-did-king-benjamin-teach-his-people-to-trust-god-more'
    quote: 'The phrase “dwell in a tabernacle of clay” is a direct quotation from the Hebrew of Job 4:19.'
  - where: parallels
    claim: 'D&C 121:10 recalls the friends who charged Job'
    key: jsp-letter-1839-03-20
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-and-edward-partridge-20-march-1839/8'
    quote: 'thou art not yet as Job thy friends do not contend against thee neither charge thee with transgretion as they did Job'
