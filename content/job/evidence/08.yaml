chapter: 8
claims:
  - where: setting
    claim: 'Bildad is less encouraging than Eliphaz and more frustrated with Job'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Bildad seems less encouraging than Eliphaz and is more frustrated with Job’s stubbornness.'
  - where: setting
    claim: 'Bildad speaks again in chapters 18 and 25'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job 18 is Bildad’s second response to Job. … Bildad’s third and final reply to Job is quite short.'
  - where: setting
    claim: 'The 2014 seminary manual''s summary of Bildad''s claim'
    key: seminary-ot-teacher-107
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-107-job-1-16?lang=eng'
    quote: 'Job 8:6, 20; 18:1–5. Bildad claims that God, who is just, does not punish the innocent; Job should admit he sinned.'
  - where: setting
    claim: 'The Papers'' editors list chapter 8 among the speeches that charged Job'
    key: jsp-letter-1839-03-20
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-and-edward-partridge-20-march-1839/8'
    quote: 'thou art not yet as Job thy friends do not contend against thee neither charge thee with transgretion as they did Job39 … 39: See Job chaps. 4–5, 8, 11, 15, 18, 20, 22, 25, 32–37.'

  - where: thread
    claim: 'Bildad means Job''s words are like the wind, empty and blustering'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/8.htm'
    quote: 'He means that Job''s speeches are like the wind in their nothingness, and like a boisterous wind in their vehemence.'
  - where: thread
    claim: 'Verses 11–19 hold two plant figures and the spider''s web; verses 20–22 drop the figures'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/8.htm'
    quote: 'In the first, Job 8:11-15, the godless are likened to the reed; and his house in prosperity to a spider''s web … In the second, Job 8:16-19, follows the figure of the climbing plant … In the third, Job 8:20-22, the figure is given up'
  - where: thread
    claim: 'The close sounds like the Psalms; “they that hate thee” shows Bildad tries to think the best of Job'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/8.htm'
    quote: 'This close of Bildad''s speech sounds quite like the Psalms (comp. Psalm 126:2 with Job 8:21 … He calls the ungodly שׂנאיך, to show that he tries to think and expect the best of Job.'

  - where: section 1 plain
    claim: 'Verse 4 rendered “he delivered them into the power of their transgression”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%208&version=NRSVUE'
    quote: 'If your children sinned against him, he delivered them into the power of their transgression.'
  - where: section 2 plain
    claim: '“The former age” is “generations” in Hebrew'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/8?lang=eng'
    quote: '8a “age”: HEB generations.'
  - where: section 3 plain
    claim: 'Papyrus and marsh in verse 11; the godless in verse 13'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%208&version=NRSVUE'
    quote: 'Can papyrus grow where there is no marsh? Can reeds flourish where there is no water? … the hope of the godless shall perish.'

  - where: 'note 8:3 “The right premise, the wrong conclusion”'
    claim: 'Bildad will not accept that God would do to Job what he did not deserve'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'He balks at the idea that God would do something that Job didn’t deserve and asks, “Doth God pervert judgment? Or doth the Almighty pervert justice?” (Job 8:3).'
  - where: 'note 8:3 “The right premise, the wrong conclusion”'
    claim: 'The Church''s footnote at “judgment” points to Alma 12:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/8?lang=eng'
    quote: '3a “judgment”: Alma 12:15.'
  - where: 'note 8:3 “The right premise, the wrong conclusion”'
    claim: 'Elihu''s main thesis is that God will not pervert judgment'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'Job 32–37 contains the speeches of Elihu … His main thesis is that God will “not pervert judgment.”'
  - where: 'note 8:3 “The right premise, the wrong conclusion”'
    claim: 'Not everything God sends comes from His justice'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/8.htm'
    quote: 'It is true that nothing that God sends to man proceeds from injustice, but it is not true that everything that He sends to him comes from His justice.'

  - where: 'note 8:4 “Given over to their transgression”'
    claim: 'The Hebrew says God sent them into the hand of their transgression'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'וַֽ֝/יְשַׁלְּחֵ֗/ם … בְּ/יַד פִּשְׁעָֽ/ם'
  - where: 'note 8:4 “Given over to their transgression”'
    claim: 'A modern translation: “he delivered them into the power of their transgression”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%208&version=NRSVUE'
    quote: 'he delivered them into the power of their transgression.'
  - where: 'note 8:4 “Given over to their transgression”'
    claim: 'The reader knows Bildad''s claim about the children is false'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'even stating that Job’s children were killed because they sinned (see Job 8:4, niv), which the reader knows to be false.'
  - where: 'note 8:4 “Given over to their transgression”'
    claim: 'Bildad assumes the children were punished for their sins'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Bildad assumes that Job’s children have been punished for their sins but believes that there is still time for Job to pray and be restored to favor (verses 4–7).'

  - where: 'note 8:8 “Ask the former age”'
    claim: '“The former age” is “generations” in Hebrew'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/8?lang=eng'
    quote: '8a “age”: HEB generations.'
  - where: 'note 8:8 “Ask the former age”'
    claim: 'A short life cannot judge God''s dealings, so tradition must be called on; the challenge recalls Deut. 32:7; sayings of the ancients follow'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/8.htm'
    quote: 'This challenge calls Deuteronomy 32:7 to mind. … Our ephemeral and shadowy life is not sufficient for passing judgment on the dealings of God; we must call history and tradition to our aid. … Now follow familiar sayings of the ancients'
  - where: 'note 8:8 “Ask the former age”'
    claim: 'Bildad bases his assumption on the traditions of men'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Bildad bases his assumption on the traditions of men handed down over generations (see Job 8:8–10).'

  - where: 'note 8:11 “Papyrus without a marsh”'
    claim: 'The Church''s footnote gives “reeds” for “flag”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/8?lang=eng'
    quote: '11a “flag”: OR reeds.'
  - where: 'note 8:11 “Papyrus without a marsh”'
    claim: 'A modern translation gives papyrus for the rush, and papyrus and marsh for the verse'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%208&version=NRSVUE'
    quote: 'Can papyrus grow where there is no marsh? Can reeds flourish where there is no water?'
  - where: 'note 8:11 “Papyrus without a marsh”'
    claim: '“Green” in verse 16 is “moist” in Hebrew'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/8?lang=eng'
    quote: '16a “green”: HEB moist; i.e., thrives.'
  - where: 'note 8:11 “Papyrus without a marsh”'
    claim: 'The Hebrew of verses 17 and 19 is uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%208&version=NRSVUE'
    quote: '8.17 Gk Vg: Meaning of Heb uncertain … 8.19 Meaning of Heb uncertain'

  - where: 'note 8:14 “A spider’s web”'
    claim: 'Bildad uses both meanings of tiqwah and turns Job''s weaver''s shuttle into a spider'
    key: lindsay-janus
    url: 'https://interpreterfoundation.org/journal/janus-parallelism-in-the-book-of-job-a-review-of-scott-b-noegels-work'
    quote: 'Here Bildad has used both meanings of תִּקְוָה, and has turned the “weaver’s shuttle” of 7:6 into a spider.'
  - where: 'note 8:14 “A spider’s web”'
    claim: 'Noegel''s rendering of 8:13–14: hope, gossamer thread, spider''s web'
    key: lindsay-janus
    url: 'https://interpreterfoundation.org/journal/janus-parallelism-in-the-book-of-job-a-review-of-scott-b-noegels-work'
    quote: 'The hope of the godless will perish; his confidence is a mere gossamer thread; his trust, but a spider’s web.'
  - where: 'note 8:14 “A spider’s web”'
    claim: 'The word in verse 13 is tiqwah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'וְ/תִקְוַ֖ת'
  - where: 'note 8:14 “A spider’s web”'
    claim: 'The “hypocrite” is the godless; the web is “a spider’s house”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%208&version=NRSVUE'
    quote: 'the hope of the godless shall perish. 14 Their confidence is gossamer, a spider’s house their trust. 15 If one leans against its house, it will not stand'
  - where: 'note 8:14 “A spider’s web”'
    claim: 'In the 1839 letter the hopes of those who corrupt and love to have others suffer are to be cut off; the editors point to Job 8:14'
    key: jsp-letter-1839-03-20
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-and-edward-partridge-20-march-1839/8'
    quote: 'also because their harts are corrupt and the thing which they are willing to bring upon others and love to have others suffer may come upon themselvs … that they may be disappointed also and their hopes may be cut off44 … 44: See Job 8:14.'
  - where: 'note 8:14 “A spider’s web”'
    claim: 'The same letter says “thou art not yet as Job”'
    key: jsp-letter-1839-03-20
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-and-edward-partridge-20-march-1839/8'
    quote: 'thou art not yet as Job thy friends do not contend against thee neither charge thee with transgretion as they did Job'
  - where: 'note 8:14 “A spider’s web”'
    claim: 'The line stands in D&C 121:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/121?lang=eng'
    quote: 'That they may be disappointed also, and their hopes may be cut off;'

  - where: 'note 8:20 “God will not cast away a perfect man”'
    claim: '“Perfect” in 8:20 is tam, the same word as in 1:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'תָּ֑ם … תָּ֧ם'
  - where: 'note 8:20 “God will not cast away a perfect man”'
    claim: 'Bildad''s prediction comes true, but not for his reasons'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'What is interesting is that Bildad’s prediction comes true, but not for the reasons that Bildad thinks. … Job’s trials are not the result of his sins, iniquities, or even inadvertent mistakes, so Bildad’s encouragement is misguided.'
  - where: 'note 8:20 “God will not cast away a perfect man”'
    claim: 'The restoration happens, ironically, not by Bildad''s prescription'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: '“If you are pure and upright, surely [God] will rouse himself for you” (Job 8:6). Ironically, this does eventually happen, but not by Bildad’s prescription (see Job 42:7).'

  - where: christ
    claim: 'The Savior took on Himself the suffering of all, even of those who seem to deserve it'
    key: uchtdorf-you-are-my-hands
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2010/04/you-are-my-hands?lang=eng'
    quote: 'our Savior willingly took upon Himself the pain and sickness and suffering of us all—even those of us who appear to deserve our suffering.'
  - where: 'note 8:14 “A spider’s web”'
    claim: 'Tiqwah means both thread and hope'
    key: lindsay-janus
    url: 'https://interpreterfoundation.org/journal/janus-parallelism-in-the-book-of-job-a-review-of-scott-b-noegels-work'
    quote: 'Noegel explains that the word תִּקְוָה (tiqvah, Strong’s 861528) means both “thread” and “hope.”'
  - where: christ
    claim: 'It is unworthy of Christians to think that those who suffer deserve their suffering'
    key: uchtdorf-you-are-my-hands
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2010/04/you-are-my-hands?lang=eng'
    quote: 'It is unworthy of us as Christians to think that those who suffer deserve their suffering.'
  - where: christ
    claim: 'Disciples are called to support and heal rather than condemn'
    key: uchtdorf-you-are-my-hands
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2010/04/you-are-my-hands?lang=eng'
    quote: 'As disciples of Jesus Christ, our Master, we are called to support and heal rather than condemn.'
