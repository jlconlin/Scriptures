chapter: 26
claims:
  # setting
  - where: setting
    claim: 'Bildad''s short speech praised God''s greatness and man''s inability to be just before Him, agreeing with Eliphaz'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Bildad interjects with praise of God’s greatness and man’s inability to be just or righteous before God, agreeing with Eliphaz (see Job 25:1–3; see also Job 4:17–19, 15:14–16).'
  - where: setting
    claim: 'Job''s closing speech has three parts, beginning at 26:1, 27:1 and 29:1'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/26.htm'
    quote: 'so in Job''s closing speech, which consists of three parts, Job 26:1, Job 27:1, Job 29:1, he shows how Job in every respect, as victor, maintains the field against the friends.'
  - where: setting
    claim: 'In one Latter-day Saint reading, meaningful dialogue between Job and the friends has broken down here'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Meaningful dialogue has aborted.'
  # thread
  - where: thread
    claim: 'Job can praise God''s majesty as well as Bildad; he has done it twice before (9:4–10; 12:13–25)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/26.htm'
    quote: 'For he also is conscious of and can praise God''s exalted and awe-inspiring majesty. He has already shown this twice, Job 9:4-10; Job 12:13-25, and shows here for the third time'
  - where: thread
    claim: 'Job''s description falls infinitely short of the reality'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/26.htm'
    quote: 'In the closing words which now follow, Job concludes his illustrative description: it must indeed, notwithstanding, come infinitely short of the reality.'
  # note 26:4
  - where: 'note 26:4 “Whose words are these?”'
    claim: 'Job sarcastically criticizes Bildad''s ability to counsel and the source of his inspiration'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Having none of this, Job sarcastically criticizes … both Bildad’s ability to counsel and the source of his inspiration (see Job 26:1–4).'
  - where: 'note 26:4 “Whose words are these?”'
    claim: 'Bildad''s praise of God''s greatness and man''s unrighteousness agrees with Eliphaz (4:17–19; 15:14–16)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Bildad interjects with praise of God’s greatness and man’s inability to be just or righteous before God, agreeing with Eliphaz (see Job 25:1–3; see also Job 4:17–19, 15:14–16).'
  - where: 'note 26:4 “Whose words are these?”'
    claim: 'One older reading: Bildad''s reply is useless to Job, does not touch him, and is a borrowed weapon'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/26.htm'
    quote: 'He characterizes his poor reply as what it is: as useless, and not pertinent in regard to the questions before them: it is of no service to him, it does not affect him, and is, moreover, a borrowed weapon.'
  - where: 'note 26:4 “Whose words are these?”'
    claim: 'In one Latter-day Saint reading, Job finishes Bildad''s speech for him in 5–14, as a parody of his position'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job then seems to “finish” Bildad’s speech for him by creating a parody of his position on the greatness of God (see Job 26:5–14).'
  - where: 'note 26:4 “Whose words are these?”'
    claim: 'One older reading: Job too can praise God''s majesty, as the hymn shows'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/26.htm'
    quote: 'For he also is conscious of and can praise God''s exalted and awe-inspiring majesty'
  # note 26:5
  - where: 'note 26:5 “The dead tremble”'
    claim: 'Rephaim are the shades of the dead in Sheol; Job 26:5 is one occurrence'
    key: bdb
    url: 'https://biblehub.com/hebrew/7496.htm'
    quote: 'plural shades, ghosts (by most connected with above √, as sunken, powerless, ones, StaG. i.420; Phoenician רפאם); — Wisdom Literature and late, name of dead in She''ôl, with article ׳הָר Job 26:5'
  - where: 'note 26:5 “The dead tremble”'
    claim: 'A modern translation: the shades below tremble; Sheol is naked and Abaddon has no covering'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2026&version=NRSVUE'
    quote: '5 The shades below tremble, the waters and their inhabitants. 6 Sheol is naked before God, and Abaddon has no covering.'
  - where: 'note 26:5 “The dead tremble”'
    claim: 'The verb means to writhe in travail'
    key: bdb
    url: 'https://biblehub.com/hebrew/2342.htm'
    quote: '2 writhe in travail with, bear, bring forth (poetry)'
  - where: 'note 26:5 “The dead tremble”'
    claim: 'Abaddon is the place of destruction or ruin in Sheol, a rare word, paired with Sheol at Job 26:6 and Prov. 15:11'
    key: bdb
    url: 'https://biblehub.com/hebrew/11.htm'
    quote: 'proper name (place of) Destruction, Ruin, ''Abaddon … Place of ruin in Sh®°ôl for lost or ruined dead … Only in Wisdom Literature; Job 31:12; "" שׁאול Job 26:6; Proverbs 15:11'
  - where: explore
    claim: 'The Church''s footnote at "Hell" (verse 6) points to Psalm 139'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/26?lang=eng'
    quote: '“Hell”: Ps. 139:8 (1–16).'
  # note 26:7
  - where: 'note 26:7 “The earth hung upon nothing”'
    claim: 'A modern translation: He stretches out Zaphon over the void and hangs the earth upon nothing; a circle on the waters at the boundary of light and darkness; the full moon'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2026&version=NRSVUE'
    quote: '7 He stretches out Zaphon over the void and hangs the earth upon nothing. … 9 He covers the face of the full moon and spreads over it his cloud. 10 He has described a circle on the face of the waters, at the boundary between light and darkness.'
  - where: 'note 26:7 “The earth hung upon nothing”'
    claim: 'One older reading: "the north" is the northern sky, where the pole of heaven is'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/26.htm'
    quote: 'to be understood of the northern sky, which is prominently mentioned, because there is the pole of the vault of heaven, which is marked by the Pole-star'
  - where: 'note 26:7 “The earth hung upon nothing”'
    claim: 'Sky and earth hang free without support in space; the verse does not teach gravitation, but its knowledge of nature deserves respect'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/26.htm'
    quote: 'The sky which vaults the earth from the arctic pole, and the earth itself, hang free without support in space. … we are also not justified in inferring from Job''s expression the laws of the mechanism of the heavens, which were unknown to the ancients, especially the law of attraction or gravitation.'
  - where: 'note 26:7 “The earth hung upon nothing”'
    claim: 'That knowledge of nature remains worthy of respect'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/26.htm'
    quote: 'The knowledge of nature on the part of the Israelitish Chokma, expressed in Job 26:7, however, remains still worthy of respect.'
  - where: 'note 26:7 “The earth hung upon nothing”'
    claim: 'Verse 9: God shuts off the front of His throne with storm clouds'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/26.htm'
    quote: 'the front of God''s throne, which is turned towards the earth, so that it is hidden by storm-clouds'
  - where: 'note 26:7 “The earth hung upon nothing”'
    claim: 'Verse 10: a circle drawn over the waters to the point where light meets darkness'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/26.htm'
    quote: '(i.e., describing a circle over them which defines their circuit) unto the extreme point of light by darkness, i.e., where the light is touched by the darkness.'
  # note 26:12
  - where: 'note 26:12 “Rahab and the fleeing serpent”'
    claim: 'Rahab is a mythical sea monster, parallel to the sea at Job 26:12'
    key: bdb
    url: 'https://biblehub.com/hebrew/7293.htm'
    quote: '1 mythical sea monster (compare BartonJAOS xiv.1 (1891), 22 f.): ׳עֹזְרֵי ר Job 9:13; "" יָם Job 26:12; Psalm 89:11; "" תַּנִּין Isaiah 51:9.'
  - where: 'note 26:12 “Rahab and the fleeing serpent”'
    claim: 'A modern translation: struck down Rahab; his hand pierced the fleeing serpent'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2026&version=NRSVUE'
    quote: '12 By his power he stilled the Sea; by his understanding he struck down Rahab. 13 By his wind the heavens were made fair; his hand pierced the fleeing serpent.'
  - where: 'note 26:12 “Rahab and the fleeing serpent”'
    claim: 'Israelites understood God as combatting sea monsters and waters that personified chaos (Job 26:12–13 among the passages)'
    key: sc-knowhy-43
    url: 'https://scripturecentral.org/knowhy/why-did-lehi-suppose-the-existence-of-satan'
    quote: 'They likewise understood God as combatting sea monsters and waters that personified chaos and destruction (NRSV Psalm 74:12-17; 89:9-12; 93:3-4; Job 26:12-13; Isaiah 27:1; 51:9-10).'
  - where: 'note 26:12 “Rahab and the fleeing serpent”'
    claim: 'In later biblical writings the chaos monster, the dragon or old serpent, is identified as Satan'
    key: sc-knowhy-43
    url: 'https://scripturecentral.org/knowhy/why-did-lehi-suppose-the-existence-of-satan'
    quote: 'In later biblical writings the chaos monster, “the great dragon” or “old serpent,” would come to be explicitly identified as Satan (Revelation 12:1-11).'
  - where: 'note 26:12 “Rahab and the fleeing serpent”'
    claim: 'The Church''s footnote at "serpent" points to Isaiah 27:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/26?lang=eng'
    quote: '“serpent”: Isa. 27:1.'
  # note 26:13
  - where: 'note 26:13 “His breath, His Spirit”'
    claim: 'BDB lists Job 26:13 under ruach as wind of heaven'
    key: bdb
    url: 'https://biblehub.com/hebrew/7307.htm'
    quote: 'a. wind of heaven: Genesis 8:1 (P) Exodus 15:10 (E) … compare Job 26:13 (Di Bu)'
  - where: 'note 26:13 “His breath, His Spirit”'
    claim: '"Garnished" is fairness, clearness of the sky: by his breath the sky becomes fair'
    key: bdb
    url: 'https://biblehub.com/hebrew/8235.htm'
    quote: 'fairness, clearness, of sky; — absolute ׳שׁ Job 26:13 by his breath the sky becomes fair(ness)'
  - where: 'note 26:13 “His breath, His Spirit”'
    claim: 'A modern translation: By his wind the heavens were made fair'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2026&version=NRSVUE'
    quote: '13 By his wind the heavens were made fair; his hand pierced the fleeing serpent.'
  # note 26:14
  - where: 'note 26:14 “Only a whisper”'
    claim: 'The word means a mere whisper of a word, something wholly inadequate'
    key: bdb
    url: 'https://biblehub.com/hebrew/8102.htm'
    quote: 'construct דָּבָד ׳שׁ Job 26:14 a (mere) whisper of a word, something wholly inadequate.'
  - where: 'note 26:14 “Only a whisper”'
    claim: 'A modern translation: the outskirts of his ways, how small a whisper'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2026&version=NRSVUE'
    quote: '14 These are indeed but the outskirts of his ways, and how small a whisper do we hear of him! But the thunder of his power who can understand?'
  # christ
  - where: christ
    claim: 'The Church''s footnote links "garnished" to Jesus Christ, Creator'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/26?lang=eng'
    quote: '“garnished”: TG Jesus Christ, Creator.'
