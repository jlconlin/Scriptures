chapter: 16
claims:
  # setting
  - where: setting
    claim: 'Chapters 15–21 are the second round; Eliphaz repeats his first arguments, less kindly'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job 15–21 represents the second round of speeches between Job and his three friends. Eliphaz continues much of the same arguments that he began in Job 4–5 but is perhaps less kind now.'
  - where: setting
    claim: 'Eliphaz called Job''s speech vain knowledge, said his own mouth condemned him, and held that no one can be clean'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Eliphaz considers Job’s speech to be “vain knowledge” and “unprofitable talk” (Job 15:2, 3). Eliphaz feels that Job has lost his relationship with God (“castest off fear” [verse 4]) and that Job’s own “mouth condemnenth [him]” (verse 6).'
  - where: setting
    claim: 'By chapter 15 Eliphaz counts Job among the wicked'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Eliphaz then launches into a prolonged (windy) affirmation of certain retribution against the wicked (see Job 15:17–35), stating: “The wicked man writhes in pain all his days” (Job 15:20). Eliphaz now clearly sees Job as one of the wicked.'
  - where: setting
    claim: 'Job''s answer runs through chapters 16–17 and begins by dismissing the friends as miserable comforters'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job responds (see Job 16–17) by dismissing his accusing friends as miserable comforters (see Job 16:1–5), realizing that the breach between them is irrevocable'
  - where: setting
    claim: 'The chapter heading singles out Job''s testimony of a witness in heaven'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/16?lang=eng'
    quote: 'Though even his friends scorn him, he testifies that his witness is in heaven and his record is on high.'
  - where: setting
    claim: 'By chapter 19 Job expects a redeemer to set things right'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'By the time we get to Job 19, Job believes that there will be someone, a redeemer, who will set right his relationship with God (19:25).'

  # thread
  - where: thread
    claim: 'In 16:7–17 Job describes God attacking him and handing him to the wicked, not for anything he has done'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'In Job 16:7–17, Job describes how God has attacked him and delivered him to the wicked—and not for anything Job has done.'
  - where: thread
    claim: 'Finding no advocate on earth, Job appeals to the earth not to cover his blood, then to a witness in heaven'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'he appeals to the earth itself to serve as a witness by not covering his blood nor blotting out his cry (see Job 16:18).'
  - where: thread
    claim: 'The insight changes Job: he no longer longs for death but holds on to hope'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Whereas he had previously yearned for death (see Job 3:1, 11; 6:8–9; 7:16), Job now refuses to yield to the grave or worm by letting go of his hope (see Job 17:11–16).'

  # sections
  - where: section 2 plain
    claim: 'Verse 8 as “shriveled me up” and verse 14 as “like a warrior” (a modern translation)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2016&version=NRSVUE'
    quote: '8 And he has shriveled me up, which is a witness against me; … 14 He bursts upon me again and again; he rushes at me like a warrior.'
  - where: section 3 plain
    claim: 'Verse 15 as laying one''s strength in the dust (a modern translation)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2016&version=NRSVUE'
    quote: '15 I have sewed sackcloth upon my skin and have laid my strength in the dust.'
  - where: section 3 plain
    claim: 'Verse 16 as “red with weeping” (a modern translation)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2016&version=NRSVUE'
    quote: 'My face is red with weeping'
  - where: section 4 plain
    claim: 'Verse 21 as a plea that someone maintain a mortal''s right with God, as one does for a neighbor'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2016&version=NRSVUE'
    quote: '21 that he would maintain the right of a mortal with God, as one does for a neighbor.'

  # note 16:2
  - where: 'note 16:2 “Comforters who add to the trouble”'
    claim: 'The friends meant to comfort, but their hasty judgments added to Job''s misery'
    key: seminary-ot-teacher-107
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-107-job-1-16?lang=eng'
    quote: 'While Job’s friends intended to comfort him, their hasty judgments regarding the reasons for his suffering actually added to his misery.'
  - where: 'note 16:2 “Comforters who add to the trouble”'
    claim: 'The friends came to comfort (2:11) and failed; Job says he would strengthen them with his mouth'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job’s friends came comfort him (2:11), but they have done a poor job. … Job tells them that if he were in their place, “I would strengthen you with my mouth and the moving of my lips should assuage your grief” (16:5).'
  - where: 'note 16:2 “Comforters who add to the trouble”'
    claim: 'Eliphaz''s speech was meant to comfort but was an accusation that wounded; “troublesome comforters” cause trouble instead of relief'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/16.htm'
    quote: 'The speech of Eliphaz, as of the other two, is meant to be comforting. It is, however, primarily an accusation; it wounds instead of soothing. … such as, instead of alleviating, only cause עמל, molestiam'
  - where: 'note 16:2 “Comforters who add to the trouble”'
    claim: 'Rendering of verse 2 as “troublesome comforters”'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/16.htm'
    quote: 'Troublesome comforters are ye all!'
  - where: 'note 16:2 “Comforters who add to the trouble”'
    claim: 'Verse 3 throws back Eliphaz''s charge of windiness (15:2)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/16.htm'
    quote: 'In Job 16:3 Job returns their reproach of being windy, i.e., one without any purpose and substance, which they brought against him, Job 15:2.'
  - where: 'note 16:2 “Comforters who add to the trouble”'
    claim: 'Shaking the head is a gesture of mockery at another''s fall, not of compassion (Ps. 22; Matt. 27:39)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/16.htm'
    quote: 'the shaking of the head, which is never a gesture of pure compassion, but always of malignant joy, Sir. 12:18; or of mockery at another''s fall, Isaiah 37:22; and misfortune, Psalm 22:8; Jeremiah 18:16; Matthew 27:39.'

  # note 16:9
  - where: 'note 16:9 “God pictured as an enemy”'
    claim: 'In 16:7–17 Job says God has attacked him, not for anything he has done'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'In Job 16:7–17, Job describes how God has attacked him and delivered him to the wicked—and not for anything Job has done.'
  - where: 'note 16:9 “God pictured as an enemy”'
    claim: 'The reader knows Job is not being punished, since God confirmed his righteousness (1:8)'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'we know Job is not being punished for iniquity since God Himself has confirmed that he is a righteous person (1:8).'
  - where: 'note 16:9 “God pictured as an enemy”'
    claim: 'Job shares Eliphaz''s worldview and so blames God for afflicting him for no reason'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'The irony of the book of Job is that Job believes the same thing and wants to hold God accountable for violating this worldview. Job assumes that God is to blame for afflicting him for no reason, and Eliphaz assumes that Job is to blame for unrighteousness.'

  # note 16:10
  - where: 'note 16:10 “Words that fit the Savior”'
    claim: 'A Latter-day Saint author finds 16:10–11 applicable to the Savior and a summary of the Crucifixion'
    key: farley-job-parallels
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/10/job-parallels-with-the-savior?lang=eng'
    quote: '“God hath delivered me to the ungodly, and turned me over into the hands of the wicked”—this would be a fitting summary of what happened when the Savior was crucified, yet it was spoken by Job (Job 16:11). “They have gaped upon me with their mouth; they have smitten me upon the cheek” (Job 16:10) is another statement by Job that is very applicable to the Savior.'

  # note 16:15
  - where: 'note 16:15 “The horn in the dust”'
    claim: 'A horn lifted up denotes might and dignity (1 Sam. 2:1); hewing off horns is humiliation, and Job 16:15 belongs with it'
    key: bdb
    url: 'https://biblehub.com/hebrew/7161.htm'
    quote: 'especially as lifted up (רום, as of a lordly animal, compare Dr1Samuel 2. 1), denoting increase of might, dignity 1 Samuel 2:1,10 … opposed to ׳גָּדַע ק hew off horns, i.e. reduce, humiliate, Lamentations 2:3; Psalm 75:11, passive Jeremiah 48:25, so וְעֹלַלְתִּי בֶעָפָר קַרְנִי Job 16:15'
  - where: 'note 16:15 “The horn in the dust”'
    claim: 'The Church''s footnote gives “cast my strength” as an alternative'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/16?lang=eng'
    quote: 'OR cast my strength.'
  - where: 'note 16:15 “The horn in the dust”'
    claim: 'A modern translation renders the line “laid my strength in the dust”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2016&version=NRSVUE'
    quote: '15 I have sewed sackcloth upon my skin and have laid my strength in the dust.'

  # note 16:18
  - where: 'note 16:18 “Blood the earth must not cover”'
    claim: 'Uncovered blood cries for vengeance (Ezek. 24:7; Isa. 26:21); Job asks the earth to leave his blood bare'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/16.htm'
    quote: 'Blood that is not covered up cries for vengeance, Ezekiel 24:7.; so also blood still unavenged is laid bare that it may find vengeance, Isaiah 26:21. According to this idea, in the lofty consciousness of his innocence, Job calls upon the earth not to suck in his blood as of one innocently slain'
  - where: 'note 16:18 “Blood the earth must not cover”'
    claim: 'The cry is to be read by Gen. 4:10; Job hopes God will own his blood, like Abel''s, as innocent'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/16.htm'
    quote: 'Therefore, in the very God who appears to him to be a blood-thirsty enemy in pursuit of him, Job nevertheless hopes to find a witness of his innocence: He will acknowledge his blood, like that of Abel, to be the blood of an innocent man.'
  - where: 'note 16:18 “Blood the earth must not cover”'
    claim: 'Job wants his cry to rise toward heaven without finding a place of rest'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/16.htm'
    quote: 'he desires that it may urge its way unhindered and unstilled towards heaven without finding a place of rest'
  - where: 'note 16:18 “Blood the earth must not cover”'
    claim: 'With no advocate on earth, Job calls the earth itself as a witness'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'he appeals to the earth itself to serve as a witness by not covering his blood nor blotting out his cry (see Job 16:18).'

  # note 16:19
  - where: 'note 16:19 “A witness in heaven”'
    claim: '“Record” translates a word meaning witness, parallel to the Hebrew word in the first line'
    key: bdb
    url: 'https://biblehub.com/hebrew/7717.htm'
    quote: '[שָׂהֵד] noun [masculine] witness (Aramaic loan-word = Hebrew עֵד; √ סְהַד ); — suffix שָֽׂהֲדִי Job 16:19 ("" עֵדִי).'
  - where: 'note 16:19 “A witness in heaven”'
    claim: 'A modern translation renders the second line “my advocate is on high”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2016&version=NRSVUE'
    quote: '19 Even now my witness is in heaven, and my advocate is on high.'
  - where: 'note 16:19 “A witness in heaven”'
    claim: 'It is not clear whom Job means: perhaps God Himself, perhaps a member of the divine council'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'It is not entirely clear whom Job is referring to in this passage. Perhaps he remains confident that despite God’s actions against him, God knows what is really going on. Some have wondered if he believes that a member of the divine council (for example, one of the sons of God from Job 1–2) will take note.'
  - where: 'note 16:19 “A witness in heaven”'
    claim: 'Job believes someone in heaven, a council member (Jesus Christ) or the Father, will notice him; by chapter 19 he expects a redeemer'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Either way, Job believes or hopes that there is someone in heaven, whether a member of the divine council (namely, Jesus Christ) or Heavenly Father, who will take notice of him. By the time we get to Job 19, Job believes that there will be someone, a redeemer, who will set right his relationship with God (19:25).'
  - where: 'note 16:19 “A witness in heaven”'
    claim: 'Stirling calls verses 19–21 Job''s second great revelatory insight'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'In this awful state, Job receives his second great revelatory insight:'
  - where: 'note 16:19 “A witness in heaven”'
    claim: 'In a moment of inspiration Job reaches to an advocate in heaven, and the insight turns him from longing for death to hope'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job, in a moment of inspiration, reaches out to a perceived advocate in heaven and prays that God Himself will provide the necessary pledge or witness on his behalf (see Job 17:2–3). This second revealed insight has a powerful effect on Job.'
  - where: 'note 16:19 “A witness in heaven”'
    claim: 'Where Job had longed for death, in chapter 17 he holds on to his hope'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Whereas he had previously yearned for death (see Job 3:1, 11; 6:8–9; 7:16), Job now refuses to yield to the grave or worm by letting go of his hope (see Job 17:11–16).'

  # note 16:20
  - where: 'note 16:20 “Scorners, or an intercessor?”'
    claim: 'The word in 16:20 is the Hiphil participle mělîṣay'
    key: bdb
    url: 'https://biblehub.com/hebrew/3887.htm'
    quote: 'Hiph`il Perfect3masculine plural suffix הֱלִיצֻנִי Psalm 119:51; Participle מֵלִיץ Genesis 42:23; Job 33:23; plural construct מְלִיצֵי2Chronicles 32:31; suffix מְלִיצַי Job 16:20'
  - where: 'note 16:20 “Scorners, or an intercessor?”'
    claim: 'BDB lists Job 16:20 under “deride,” and the participle elsewhere as interpreter and intermediary between God and man'
    key: bdb
    url: 'https://biblehub.com/hebrew/3887.htm'
    quote: '1 deride Job 16:20; Psalm 119:51. … 2 Participle interpreter Genesis 42:23 (E); figurative of intermediaries between God and man, Job 33:28; Isaiah 43:27; ambassador2Chronicles 32:31.'
  - where: 'note 16:20 “Scorners, or an intercessor?”'
    claim: 'A modern translation keeps “My friends scorn me”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2016&version=NRSVUE'
    quote: '20 My friends scorn me; my eye pours out tears to God,'
  - where: 'note 16:20 “Scorners, or an intercessor?”'
    claim: 'Another modern translation reads “My intercessor is my friend,” with verse 21 as his pleading'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Job%2016&version=NIV'
    quote: '20 My intercessor(AN) is my friend(AO) as my eyes pour out(AP) tears(AQ) to God; 21 on behalf of a man he pleads(AR) with God as one pleads for a friend.'
  - where: 'note 16:20 “Scorners, or an intercessor?”'
    claim: 'Stirling reads verses 19–21 with the intercessor rendering'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Even now my witness is in heaven; my advocate is on high. My intercessor is my friend as my eyes pour out tears to God; on behalf of a man he pleads with God as a man pleads for his friend. (Job 16:19–21, niv)'

  # christ
  - where: christ
    claim: 'A Latter-day Saint reading suggests that the one in heaven is Jesus Christ or Heavenly Father'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'whether a member of the divine council (namely, Jesus Christ) or Heavenly Father, who will take notice of him.'
  - where: christ
    claim: 'Jesus Christ is the advocate with the Father'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-jn/2?lang=eng'
    quote: 'And if any man sin, we have an advocate with the Father, Jesus Christ the righteous:'
  - where: christ
    claim: 'The Lord calls Himself an advocate who knows man''s weakness and how to succor the tempted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/62?lang=eng'
    quote: 'even Jesus Christ, your advocate, who knoweth the weakness of man and how to succor them who are tempted. … the testimony which ye have borne is recorded in heaven for the angels to look upon'
