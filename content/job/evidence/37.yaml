chapter: 37
claims:
  - where: when
    claim: 'Job 36–37 is Elihu’s fourth speech'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Elihu begins his fourth speech (see Job 36–37) with an astounding claim'
  - where: setting
    claim: 'Job 36–37 is Elihu’s final speech'
    key: ot-minute-job-36
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-36'
    quote: 'Job 36–37 represents Elihu’s final speech.'
  - where: setting
    claim: 'The chapter heading: Elihu concludes; the Lord controls the laws of nature; God reigns in terrible majesty'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/37?lang=eng'
    quote: 'Elihu concludes, saying, The Lord controls the laws of nature—God reigns in terrible majesty.'
  - where: setting
    claim: 'Elihu’s thesis is that God will not pervert judgment; Job makes no reply to him'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'His main thesis is that God will “not pervert judgment.” Job makes no reply to him.'
  - where: setting
    claim: 'The speech closes on God’s voice and power in nature'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'God’s inscrutable and indisputable ways, and the presence of God’s voice and power in nature.'
  - where: setting
    claim: 'One older reading: the storm out of which the LORD answers is the storm that rose during Elihu’s speech'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/38.htm'
    quote: 'The art. is to be understood generically, but, with respect to Elihu''s speeches, refers to the storm which has risen up in the meanwhile.'
  - where: thread
    claim: 'Verses 6–10 describe the rainy season and winter, when the work of farmers and herdsmen stops'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/37.htm'
    quote: 'when the business of the husbandmen as of the nomads is brought to a stand-still, and every one retreats to his house or seeks a sheltering corner.'
  - where: thread
    claim: 'Job is to stand still instead of dictating to God, and learn from God’s works in nature'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/37.htm'
    quote: 'Job is to stand still, instead of dictating to God, in order to draw from His wondrous acts in nature a conclusion with reference to his mystery of suffering.'
  - where: thread
    claim: 'The sun behind the clouds has lost none of its light; so man waits for God’s solution of the mystery'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/37.htm'
    quote: 'The beclouded sun, Job 37:21 said, has lost none of the intensity of its light, although man has to wait for the removing of the clouds to behold it again. So, when God''s doings are mysterious to us, we have to wait'
  - where: section 2 plain
    claim: 'Verse 11: the clouds are loaded with abundant water'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/37.htm'
    quote: 'abundant irrigation'
  - where: section 2 plain
    claim: 'A modern translation of verses 7, 9 and 13'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2037&version=NRSVUE'
    quote: '7 serves as a sign on everyone’s hand, so that all whom he has made may know it. … 13 Whether for correction or for his land or for love, he causes it to happen.'
  - where: section 4 plain
    claim: 'A modern translation of verses 22–24'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2037&version=NRSVUE'
    quote: '22 Out of the north comes golden splendor; around God is awesome majesty. 23 The Almighty—we cannot find him; he is great in power and justice, and abundant righteousness he will not violate.'
  - where: 'note 37:2 “Thunder, the voice of God”'
    claim: 'One older reading: “At this” refers to a storm now perceived by the senses, not one imagined'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/37.htm'
    quote: 'לזאת does not refer to the phenomenon of the storm which is represented in the mind, but to that which is now to be perceived by the senses.'
  - where: 'note 37:2 “Thunder, the voice of God”'
    claim: '“Voice” five times recalls the seven voices of Psalm 29; God’s acts transcend our comprehension'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/37.htm'
    quote: 'The repetition of קול fo noititeper eh five times calls to mind the seven קולות (ἑπτὰ βρονταί) in Psalm 29:1-11. … God''s mighty acts, with respect to the connection between cause and effect and the employment of means, transcend our comprehension.'
  - where: 'note 37:2 “Thunder, the voice of God”'
    claim: 'Elihu’s description of a storm is accompanied by a storm coming over the sky'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/37.htm'
    quote: 'If we have drawn the correct conclusion from Job 37:1, that Elihu''s description of a storm is accompanied by a storm which was coming over the sky'
  - where: 'note 37:2 “Thunder, the voice of God”'
    claim: 'The LORD answers Job out of the storm, which with respect to Elihu’s speeches is the storm risen in the meanwhile; Job had asked the Almighty to answer him'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/38.htm'
    quote: '"May the Almighty answer me!" Job has said, Job 31:35; He now really answers, and indeed out of the storm … with respect to Elihu''s speeches, refers to the storm which has risen up in the meanwhile.'
  - where: 'note 37:7 “Winter seals the hand”'
    claim: 'A modern translation: the meaning of the Hebrew of 37:7 is uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2037&version=NRSVUE'
    quote: '7 serves as a sign on everyone’s hand, so that all whom he has made may know it. … 37.7 Meaning of Heb of 37.7 uncertain'
  - where: 'note 37:7 “Winter seals the hand”'
    claim: 'One older reading: God seals the hand so it cannot be opened for work because of the cold, that all may come to perceive Him'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/37.htm'
    quote: 'He sealeth up (חתם בּ as Job 33:16) the hand of all men that they cannot, viz., on account of the cold out of doors, be opened for work, that all people of His work (i.e., thanking Him for their origin as His handiwork, Job 34:19) may come to the perception'
  - where: 'note 37:7 “Winter seals the hand”'
    claim: 'The rainy season brings work to a standstill; verse 8 recalls Psalm 104:22'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/37.htm'
    quote: 'when the business of the husbandmen as of the nomads is brought to a stand-still, and every one retreats to his house or seeks a sheltering corner.'
  - where: 'note 37:7 “Winter seals the hand”'
    claim: 'Verse 8 recalls Psalm 104:22'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/37.htm'
    quote: 'The fut. consec. in Job 37:8 continues the description of what happens in consequence of the cold rainy season; the expression calls to mind Psalm 104:22'
  - where: 'note 37:13 “A rod, the land, or mercy”'
    claim: 'The Hebrew of 37:13 has lĕšēbeṭ (H7626) and lĕḥesed (H2617)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: '<w lemma="l/7626" morph="HR/Ncmsa" id="18Psb">לְ/שֵׁ֥בֶט</w> … <w lemma="l/2617 a" n="0.0" morph="HR/Ncmsa" id="18Y2L">לְ֝/חֶ֗סֶד</w>'
  - where: 'note 37:13 “A rod, the land, or mercy”'
    claim: 'BDB: šēbeṭ is a rod for smiting, figuratively of God’s chastisement, of an individual at Job 37:13'
    key: bdb
    url: 'https://biblehub.com/hebrew/7626.htm'
    quote: 'rod, staff (evidently common article), for smiting … figurative of ׳יs chastisement: national Isaiah 10:24 … individual Job 9:34; Job 21:9 (אֱלוֺהַּ ׳שׁ), Job 37:13'
  - where: 'note 37:13 “A rod, the land, or mercy”'
    claim: 'A modern translation renders the third purpose “for love”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2037&version=NRSVUE'
    quote: '13 Whether for correction or for his land or for love, he causes it to happen.'
  - where: 'note 37:14 “Elihu’s questions”'
    claim: 'Elihu calls Job by name (37:14) and tries to draw him into conversation, as God will (38:3; 40:7); Job resists'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Unlike the friends, Elihu frequently calls Job by name, both to Job himself (see Job 33:1, 31; 37:14) … and repeatedly tries to draw Job into conversation (see Job 33:5, 32; 34:33; 35:2), as God will subsequently do (see Job 38:3, 40:7). Job continually resists interchange with Elihu.'
  - where: 'note 37:14 “Elihu’s questions”'
    claim: 'Elihu’s speeches echo the speeches from the whirlwind but had no impact on Job; his answer is argument, the Lord’s is revelation'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'Even Elihu, the fourth and final comforter, whose speeches echo those issuing from the whirlwind, had no impact on Job … For reason alone cannot solve Job’s crisis, which is a crisis in his relationship with God.'
  - where: 'note 37:14 “Elihu’s questions”'
    claim: 'Elihu’s answer remains mere argument; the Lord’s is a revelation'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'The point is that Elihu’s answer remains “mere argument;” the Lord’s is a revelation.'
  - where: 'note 37:18 “A sky like a cast mirror”'
    claim: 'One older reading: the sky, firm as a molten (cast) metal mirror; elsewhere likened to sapphire, a covering, a gauze'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/37.htm'
    quote: 'dost thou now and then with Him keep the sky spread out, which for firmness is like a molten mirror? Elsewhere the hemispheric firmament … is likened to a clear sapphire Exodus 24:10, a covering Psalm 104:2, a gauze Isaiah 40:22; the comparison with a metallic mirror (מוּצק here not from צוּק'
  - where: 'note 37:18 “A sky like a cast mirror”'
    claim: 'A modern translation: hard as a molten mirror'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2037&version=NRSVUE'
    quote: '18 Can you, like him, spread out the skies, hard as a molten mirror?'
  - where: 'note 37:22 “Gold out of the north”'
    claim: 'The Hebrew of 37:22 has zāhāb, gold (H2091)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: '<w lemma="2091" morph="HNcmsa" id="18jJP">זָהָ֣ב</w>'
  - where: 'note 37:22 “Gold out of the north”'
    claim: 'BDB: the line is dubious; emendations proposed; out of the north comes gold, or golden light of the sun after clouds, or the golden splendour of God'
    key: bdb
    url: 'https://biblehub.com/hebrew/2091.htm'
    quote: 'מִצָּפוֺן זָהָב Job 37:22 is dubious read perhaps זֹהַר Du and Dr; Ew De and others out of the North comes gold; others, however, golden light, brightness, of sun after clouds dispersed by north wind … or golden splendour of God coming from north'
  - where: 'note 37:22 “Gold out of the north”'
    claim: 'A modern translation: golden splendor; awesome majesty'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2037&version=NRSVUE'
    quote: '22 Out of the north comes golden splendor; around God is awesome majesty.'
  - where: 'note 37:22 “Gold out of the north”'
    claim: 'One older reading: the verse restates Job 28 compactly: man wrests gold from the dark north, but God is beyond him'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/37.htm'
    quote: 'What Job describes so grandly and minutely in Job 28:1, viz., that man lays bare the hidden treasures of the earth''s interior, but that the wisdom of God still transcends him, is here expressed no less grandly and compendiously: From the north cometh gold'
  - where: 'note 37:22 “Gold out of the north”'
    claim: 'God is surrounded by inaccessible terrible glory, covering Him like a garment'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/37.htm'
    quote: 'God, on the other hand, is surrounded by inaccessibly terrible glory'
  - where: 'note 37:22 “Gold out of the north”'
    claim: 'Terrible majesty covers Him like a garment, making Him inaccessible'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/37.htm'
    quote: 'it covers Him like a garment (Psalm 104:1), making Him inaccessible'
  - where: 'note 37:23 “Elihu’s last word”'
    claim: 'The verb of 37:23 is ʿānāh in the Piel (H6031)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: '<w lemma="6031 b" n="0" morph="HVpi3ms" id="18BfY">יְעַנֶּֽה</w>'
  - where: 'note 37:23 “Elihu’s last word”'
    claim: 'BDB: the Piel of ʿānāh means to humble or weaken, with justice as its object at Job 37:23'
    key: bdb
    url: 'https://biblehub.com/hebrew/6031.htm'
    quote: '4 humble, weaken, object כֹּחַ Psalm 102:24; משׁפט Job 37:23'
  - where: 'note 37:23 “Elihu’s last word”'
    claim: 'A modern translation: abundant righteousness he will not violate; he does not regard the wise in their own conceit'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2037&version=NRSVUE'
    quote: 'and abundant righteousness he will not violate. 24 Therefore mortals fear him; he does not regard any who are wise in their own conceit.”'
  - where: 'note 37:23 “Elihu’s last word”'
    claim: 'Elihu’s main thesis is that God will not pervert judgment'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'His main thesis is that God will “not pervert judgment.” Job makes no reply to him.'
  - where: 'note 37:23 “Elihu’s last word”'
    claim: 'Job’s craving is satisfied by the vision of God, granted in answer to his appeals'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'His own craving for light is satisfied by the vision of God, at length vouchsafed in answer to his appeals.'
  - where: setting
    claim: 'No one responds to Elihu'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'The young man Elihu is not mentioned until late in the drama (chapter 32), and no one responds to him.'
  - where: 'note 37:7 “Winter seals the hand”'
    claim: 'The rainy season: early rains, late rains, snow between'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/37.htm'
    quote: 'the rains after the autumnal equinox (the early rain), which begin the season, and the rains before the vernal equinox (the late rain, Zechariah 10:1), which close it, with the falls of snow between'
  - where: 'note 37:13 “A rod, the land, or mercy”'
    claim: 'For Elihu, suffering is a kindness that instructs'
    key: ot-minute-job-36
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-36'
    quote: 'For Elihu, the suffering of the wicked was kindness since “then he sheweth them their work, and their transgressions that they have exceeded.'
  - where: christ
    claim: 'The scriptures quoted (John 14:9; D&C 88:63) read in the Church’s edition'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'Draw near unto me and I will draw near unto you; seek me diligently and ye shall find me'
  - where: christ
    claim: 'Job’s answer came by revelation, not by argument'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'The point is that Elihu’s answer remains “mere argument;” the Lord’s is a revelation.'
