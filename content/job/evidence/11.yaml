chapter: 11
claims:
  - where: setting
    claim: 'Zophar is the last of the three friends to speak; like the others he assumes Job suffers for something he has done; he seems to answer Job’s prayer'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Zophar, the last of Job’s three friends, now takes his turn to address Job. Zophar, like his friends, assumes that Job is suffering as a result of something he has done and sees his position bolstered by what Job has been saying.'
  - where: setting
    claim: 'The seminary manual lists Job 11:1–6 among the passages where the friends say Job’s afflictions came for some wrong he had done'
    key: seminary-ot-teacher-107
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-107-job-1-16?lang=eng'
    quote: 'each of Job’s friends expressed his belief that Job’s afflictions had come upon him because of something wrong he had done. … Zophar: Job 11:1–6'
  - where: setting
    claim: 'The Papers’ editors list chapter 11 among the speeches that charged Job with transgression (the source of D&C 121:10)'
    key: jsp-letter-1839-03-20
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-and-edward-partridge-20-march-1839/8'
    quote: 'thou art not yet as Job thy friends do not contend against thee neither charge thee with transgretion as they did Job39 … 39: See Job chaps. 4–5, 8, 11, 15, 18, 20, 22, 25, 32–37.'
  - where: thread
    claim: 'Zophar accuses Job of babbling and mocking, wishes God would rebuke him, says he suffers less than he deserves, taunts him with God’s unsearchable depths, then recommends repentance with promises of security (11:13–19)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Zophar now interjects to accuse Job of babbling untruth and mocking God, desiring that God would speak and properly rebuke Job … Assuming that Job’s problem is sin, Zophar recommends repentance, promising restoration and temporal security'
  - where: thread
    claim: 'Zophar argues Job cannot know what God knows (7–13) and closes with an appeal to repent and live in safety (14–20)'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Zophar argues that Job knows nothing of what God knows and couldn’t ever hope to (verses 7–13). Zophar closes with an appeal to Job to repent of what he has done so that he can live in safety without fear (verses 14–20).'
  - where: section 1 plain
    claim: 'Verse 6: God lets part of Job’s guilt be forgotten; wisdom double beyond what Job imagines'
    key: bdb
    url: 'https://biblehub.com/hebrew/5382.htm'
    quote: 'יַשֶּׁה לְךָ מִןֿ Job 11:6 Eloah allows a part of thy guilt to be forgotten thee, i.e. does not reckon it to thee in full'
  - where: section 1 plain
    claim: 'Verse 6: wisdom double, beyond what Job imagines'
    key: bdb
    url: 'https://biblehub.com/hebrew/3718.htm'
    quote: 'לְתוּשִׁיָּה Job 11:6 double in sound wisdom (beyond what Job imagines)'
  - where: section 2 plain
    claim: 'Verse 8 “hell” is Sheol; verse 12 as a proverb of the impossible'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+11&version=NRSVUE'
    quote: 'Deeper than Sheol—what can you know? … But the stupid will get understanding when a wild ass is born human.'
  - where: section 3 plain
    claim: 'Verse 20: every hope of the wicked comes to nothing, ending in the breathing out of life'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/11.htm'
    quote: 'The meaning is not that death is their only hope, but that every expectation remains unfulfilled; giving up the ghost is that whither all their disappointed hopes tend.'
  - where: 'note 11:4 “Words Job did not say”'
    claim: 'Zophar seems to respond to Job’s prayer, paraphrasing it as “my doctrine is pure”'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Zophar seems to be responding specifically to Job’s prayer and paraphrases it as “my doctrine is pure, and I am clean in thine eyes” (Job 11:4). Zophar finds this ridiculous'
  - where: 'note 11:4 “Words Job did not say”'
    claim: 'Leqaḥ, “doctrine,” is teaching, the thing taught (Deut. 32:2; Job 11:4; Prov. 4:2)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3948.htm'
    quote: 'teaching, object, as thing taught'
  - where: 'note 11:6 “Less than his guilt deserves”'
    claim: 'Zophar states that Job’s suffering is less than he deserves'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'He even states that Job’s suffering is less than he deserves (see Job 11:6)!'
  - where: 'note 11:6 “Less than his guilt deserves”'
    claim: 'The verb of 11:6 is “forget”: God lets part of Job’s guilt be forgotten, not reckoning it in full'
    key: bdb
    url: 'https://biblehub.com/hebrew/5382.htm'
    quote: 'II. [נָשָׁה] verb forget … Imperfect יַשֶּׁה לְךָ מִןֿ Job 11:6 Eloah allows a part of thy guilt to be forgotten thee, i.e. does not reckon it to thee in full'
  - where: 'note 11:7 “Past finding out”'
    claim: 'Kiplayim, “double,” in 11:6: wisdom double, beyond what Job imagines'
    key: bdb
    url: 'https://biblehub.com/hebrew/3718.htm'
    quote: 'dual כִּפְלַיִם (compare Arabic ), לְתוּשִׁיָּה Job 11:6 double in sound wisdom (beyond what Job imagines)'
  - where: 'note 11:7 “Past finding out”'
    claim: 'A modern translation: “wisdom is many-sided”; “Deeper than Sheol”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+11&version=NRSVUE'
    quote: 'and that he would tell you the secrets of wisdom! For wisdom is many-sided. … Deeper than Sheol—what can you know?'
  - where: 'note 11:7 “Past finding out”'
    claim: 'Zophar’s argument is ironic: God is unsearchable, yet he claims to know what is between Job and God; if he took the proverb to heart he would be slower to judge'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Zophar’s argument is ironic since he claims that God is unsearchable. … yet he claims to know exactly what is going on between Job and God. Perhaps if Zophar took this proverb to heart, he might be less likely to pass judgment on Job.'
  - where: 'note 11:7 “Past finding out”'
    claim: 'Stirling: Zophar taunts Job with being unable to find out the deep things of God; Job is already on that journey; Zophar’s rigid paradigm keeps him from joining it'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Zophar taunts Job with being unable to find out the deep things of God (see Job 11:7); Job is ironically already on a journey to do just that. Because he holds rigidly to a false paradigm of God, Zophar will be unable to join Job on the journey.'
  - where: 'note 11:12 “A wild ass born a man”'
    claim: 'A modern translation reads verse 12 as a proverb of the impossible'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+11&version=NRSVUE'
    quote: '12 But the stupid will get understanding when a wild ass is born human.'
  - where: 'note 11:12 “A wild ass born a man”'
    claim: 'One older reading: the empty head will gain understanding no sooner than a wild ass becomes a man; the Hebrew “vain” means hollowed out, empty'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/11.htm'
    quote: '12 But before an empty head gaineth understanding, … A wild ass would become a man. … the antithesis ילּבב is more favourable the Hebrew meaning, "hollowed out, empty."'
  - where: 'note 11:12 “A wild ass born a man”'
    claim: 'The one will happen no sooner than the other; a wild ass becoming human would need an inconceivable new birth; the proverb is a jab at Job'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/11.htm'
    quote: 'the one will happen not earlier than, and as little as, the other. … a regeneration would be necessary if the wild ass should become human, - a regeneration which is inconceivable. … a side hit at Job, which rebounds on Zophar himself; for the dogma of the friends'
  - where: 'note 11:12 “A wild ass born a man”'
    claim: 'The wild ass is refractory by nature, especially when young'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/11.htm'
    quote: 'It is by nature refractory, and especially when young'
  - where: 'note 11:13 “Zophar’s way back”'
    claim: 'Zophar closes with an appeal to Job to repent of what he has done so he can live in safety without fear'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Zophar closes with an appeal to Job to repent of what he has done so that he can live in safety without fear (verses 14–20).'
  - where: 'note 11:13 “Zophar’s way back”'
    claim: 'Stirling: assuming sin, Zophar recommends repentance with promises of security, urging Job to admit guilt and so breach his integrity'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Assuming that Job’s problem is sin, Zophar recommends repentance, promising restoration and temporal security … Zophar thus persists in doing the work of Satan by urging Job to admit guilt (breach his integrity by holding to a lie) in exchange for a (false?) promise of security.'
  - where: 'note 11:13 “Zophar’s way back”'
    claim: 'Job will not falsely admit sin to avail himself of grace, as the friends proposed (27:1–6)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'He will not falsely admit (major) sin in order to avail himself of grace, as the friends have proposed, nor will he respond with evil despite his unjust suffering.'
  - where: 'note 11:20 “Hope that ends in a last breath”'
    claim: 'The phrase means breathing out the soul; every expectation of the wicked goes unfulfilled; the eyes that fail are eyes languishing with unsatisfied longing'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/11.htm'
    quote: 'כּלה, otherwise frequently used of those who pine away with longing, here and Job 17:5 of eyes that languish with unsatisfied longing; … he breathes forth his soul … The meaning is not that death is their only hope, but that every expectation remains unfulfilled'
  - where: christ
    claim: 'The book of Job is at bottom about the need for personal revelation, the key to crises of faith brought on by suffering'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'The book of Job, then, is at bottom about the need for personal revelation. Revelation is the key to human crises of faith brought on by suffering.'
  - where: christ
    claim: 'The friends’ counsels rest on human reason about suffering in general, not on revelation about Job’s case'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'they are counsels based on human reason about suffering in general—upon hearsay, as it were—not upon revelation about Job’s particular predicament.'
