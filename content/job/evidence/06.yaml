chapter: 6
claims:
  - where: setting
    claim: 'Each friend believed Job''s afflictions came because of something wrong he had done'
    key: seminary-ot-teacher-107
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-107-job-1-16?lang=eng'
    quote: 'Summarize Job 4–16 by explaining that each of Job’s friends expressed his belief that Job’s afflictions had come upon him because of something wrong he had done.'
  - where: setting
    claim: 'In chapter 7 Job turns from the friends to address God'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'In Job 7, Job shifts from addressing his friends to addressing God.'
  - where: setting
    claim: 'Job is in pain of body, mind and feeling and unsure he can endure; Eliphaz had urged him to rely on God'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job is physically, mentally, and emotionally in rough shape. … Eliphaz, to his credit, encourages Job to continue to rely on God (4:6; 5:8), but Job is not sure he can endure his pain any longer.'
  - where: thread
    claim: 'The movement of the speech: the request of verses 8–9, the rebuke of the friends in 14–30, the seasonal streams of 15–21, the challenge of 28–30'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'In verses 8–9, his sole request is that God finish him off. … In verses 14–30, Job rebukes Eliphaz and his companions. … He compares his friends to seasonal streams who disappear when they are needed (verses 15–21).'
  - where: thread
    claim: 'Job feels forsaken by God and now by his friends'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job feels forsaken by God, and now he feels forsaken by his friends.'
  - where: 'note 6:3 “Rash words and a heavy grief”'
    claim: 'The verb in 6:3 means talk wildly'
    key: bdb
    url: 'https://biblehub.com/hebrew/3886.htm'
    quote: 'II. [לוּע, or לָעַע] verb talk wildly'
  - where: 'note 6:3 “Rash words and a heavy grief”'
    claim: 'The verb''s first sense is to swallow, to gulp down'
    key: bdb
    url: 'https://biblehub.com/hebrew/3886.htm'
    quote: 'To swallow, to gulp down, to devour'
  - where: 'note 6:3 “Rash words and a heavy grief”'
    claim: 'A modern translation reads “my words have been rash”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%206&version=NRSVUE'
    quote: 'therefore my words have been rash.'
  - where: 'note 6:3 “Rash words and a heavy grief”'
    claim: 'Job''s “grief” (vexation) is the word Eliphaz used at 5:2; he wants vexation and calamity weighed together; the suffering would outweigh the sand'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/6.htm'
    quote: 'Vexation (כּעשׂ) is what Eliphaz has reproached him with (Job 5:2). Job wishes that his vexation were placed in one scale and his היּה (Keri הוּה) in the other, and weighed together'
  - where: 'note 6:3 “Rash words and a heavy grief”'
    claim: 'The same noun stands in 5:2 (“wrath”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'כָּ֑עַשׂ'
  - where: 'note 6:3 “Rash words and a heavy grief”'
    claim: 'Weighed by ordinary justice, Job''s suffering is out of proportion to any sin charged to him'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'even weighed in the balance scales of ordinary justice (see Job 6:2; 31:6), his suffering is disproportionate to any sin that could be laid to his charge.'
  - where: 'note 6:6 “Braying animals and tasteless food”'
    claim: 'The meaning of the figures: he would not complain without cause; he cannot be expected to enjoy his suffering; the Targum''s “white of an egg”'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/6.htm'
    quote: 'The meaning of the first two figures is: He would not complain, if there were really no cause for it; of the two others: It is not to be expected that he should smile at his suffering, and enjoy it as delicate food. … the white of an egg (Targ.),'
  - where: 'note 6:6 “Braying animals and tasteless food”'
    claim: 'The Syriac reads purslane; the loathsome food is his suffering and the friends'' counsel Eliphaz wanted him to take as agreeable'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/6.htm'
    quote: 'or in the slime of purslain (according to Chalmetho in the Peschito … Thus is it with his sufferings. … Such disagreeable counsel is now like his unclean, disgusting diet. Eliphaz desires him to take them as agreeable.'
  - where: 'note 6:6 “Braying animals and tasteless food”'
    claim: 'The older reading thinks purslane less probable because the word beside it means slime, not broth'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/6.htm'
    quote: 'which is less probable on account of ריר (slime, not: broth)'
  - where: 'note 6:6 “Braying animals and tasteless food”'
    claim: 'The lexicon gives the word as a plant, probably purslane'
    key: bdb
    url: 'https://biblehub.com/hebrew/2495.htm'
    quote: '(a plant), probably a purslane'
  - where: 'note 6:6 “Braying animals and tasteless food”'
    claim: 'A modern translation reads “the juice of mallows” and marks the Hebrew uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%206&version=NRSVUE'
    quote: 'or is there any flavor in the juice of mallows? … 6.6 Meaning of Heb uncertain'
  - where: 'note 6:10 “Asking God to end it”'
    claim: 'Job actually prays that God will kill him'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'and actually prays that God will kill him (see Job 6:8–9).'
  - where: 'note 6:10 “Asking God to end it”'
    claim: 'Eliphaz urged reliance on God; Job is not sure he can endure; the questions of 11–12'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Eliphaz, to his credit, encourages Job to continue to rely on God (4:6; 5:8), but Job is not sure he can endure his pain any longer. He asks, “What is my strength, that I should hope?'
  - where: 'note 6:10 “Asking God to end it”'
    claim: 'A modern translation reads “I have not denied the words of the Holy One” and marks the verse uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%206&version=NRSVUE'
    quote: 'for I have not denied the words of the Holy One. … 6.10 Meaning of Heb uncertain'
  - where: 'note 6:10 “Asking God to end it”'
    claim: 'The two readings of the comfort: speedy death, with the clause giving the ground of his plea, or not having disowned the words'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/6.htm'
    quote: 'it is to be asked whether by consolation speedy death is to be understood, and the clause with כּי gives the ground of his claim for the granting of the wish'
  - where: 'note 6:10 “Asking God to end it”'
    claim: 'One older reading: not having disowned the words of the Holy One would be his consolation in death; his consciousness of innocence is his shield in the whole book'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/6.htm'
    quote: 'or whether he means that just this: not having disowned the words of the Holy One … would be his consolation in the midst of death. With Hupfeld we decide in favour of the latter … this consciousness of innocence is indeed throughout the whole book Job''s shield and defence.'
  - where: 'note 6:14 “The kindness a friend owes”'
    claim: 'The word in 6:14 is ḥesed, kindness especially toward the lowly and miserable'
    key: bdb
    url: 'https://biblehub.com/hebrew/2617.htm'
    quote: '2 kindness (especially as extended to the lowly, needy and miserable), mercy Proverbs 20:28; Job 6:14'
  - where: 'note 6:14 “The kindness a friend owes”'
    claim: 'The word is glossed lovingkindness and mercy'
    key: bdb
    url: 'https://biblehub.com/hebrew/2617.htm'
    quote: 'Lovingkindness, mercy, steadfast love, loyalty, faithfulness, goodness'
  - where: 'note 6:14 “The kindness a friend owes”'
    claim: 'One older reading: without kindness the sufferer might forsake the fear of God; harshness could push him into the abyss'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/6.htm'
    quote: 'מס (from מסס, liquefieri) is one who is inwardly melted, the disheartened. Such an one should receive חסד from his friend … Harshness might precipitate him into the abyss from which love will keep him back.'
  - where: 'note 6:14 “The kindness a friend owes”'
    claim: 'A modern translation makes the one who withholds kindness forsake the fear of the Almighty, following the Syriac and Latin, Hebrew uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%206&version=NRSVUE'
    quote: '14 “Those who withhold kindness from a friend forsake the fear of the Almighty. … 6.14 Syr Vg Compare Tg: Meaning of Heb uncertain'
  - where: 'note 6:14 “The kindness a friend owes”'
    claim: 'The friends'' counsel was uttered without compassion, was glib, and rested on reasoning about suffering in general rather than revelation'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'All these points may have elements of truth, but they are also untrue. Why? First, they were uttered without compassion. “To him that is afflicted pity should be shewed from his friend,” Job protests (Job 6:14; compare 19:21). Next, they were glib.'
  - where: 'note 6:14 “The kindness a friend owes”'
    claim: 'Counsel based on human reason about suffering in general, not on revelation about Job'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'they are counsels based on human reason about suffering in general—upon hearsay, as it were—not upon revelation about Job’s particular predicament.'
  - where: 'note 6:15 “A stream that fails in summer”'
    claim: 'The friends are seasonal streams that disappear when needed'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'He compares his friends to seasonal streams who disappear when they are needed (verses 15–21).'
  - where: 'note 6:24 “Show me my sin”'
    claim: 'Eliphaz politely accused Job of sin; Job challenges the friends to show his iniquity, believing he has not sinned'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Eliphaz has politely accused Job of sin, and Job challenges his friends to show him his iniquity because he does not believe that he has sinned (verses 28–30).'
  - where: 'note 6:24 “Show me my sin”'
    claim: 'A modern translation: “How forceful are honest words!”; “Turn now; my vindication is at stake”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%206&version=NRSVUE'
    quote: 'How forceful are honest words! … Turn, I pray; let no wrong be done. Turn now; my vindication is at stake.'
  - where: christ
    claim: 'The Savior took on Himself the suffering of all, even those who appear to deserve it; it is unworthy of Christians to think sufferers deserve their suffering'
    key: uchtdorf-you-are-my-hands
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2010/04/you-are-my-hands?lang=eng'
    quote: 'It is unworthy of us as Christians to think that those who suffer deserve their suffering. Easter Sunday is a good day to remember that our Savior willingly took upon Himself the pain and sickness and suffering of us all—even those of us who appear to deserve our suffering.'
