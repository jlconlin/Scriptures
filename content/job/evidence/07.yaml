chapter: 7
claims:
  - where: setting
    claim: 'In chapter 7 Job turns from the friends to address God'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'In Job 7, Job shifts from addressing his friends to addressing God.'
  - where: setting
    claim: 'Job''s “What is man?” reworks Psalm 8 bitterly'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job 7:17–21 can be read as a cynical reinterpretation of Psalm 8.'
  - where: thread
    claim: 'Verses 1–10 argue that life is brutal and short; verse 11 follows from it'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'In verses 1–10, Job makes the argument that life is brutal and short. … Before we know it, we are gone and forgotten (verses 6–10). For this reason, Job says, “I will not refrain my mouth;'
  - where: thread
    claim: 'Job describes life as slavery and loathes his life (7:1–6, 13–16)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Indeed, Job loathes his life (see Job 7:13–16), which he describes as slavery imposed by God (see Job 7:1–6)'
  - where: thread
    claim: 'Verses 17–21 rework Psalm 8; Job wants God to look away'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job 7:17–21 can be read as a cynical reinterpretation of Psalm 8.'
  - where: 'note 7:1 “Hard service on earth”'
    claim: 'The word behind “appointed time” is ṣābāʾ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'צָבָ֣א'
  - where: 'note 7:1 “Hard service on earth”'
    claim: 'BDB: the word here means hard service of a troubled life, also at 14:14'
    key: bdb
    url: 'https://biblehub.com/hebrew/6635.htm'
    quote: 'b. of hard service of troubled life Job 7:1; Job 14:14; Isaiah 40:2; Daniel 10:1.'
  - where: 'note 7:1 “Hard service on earth”'
    claim: 'A modern translation reads “hard service”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%207&version=NRSVUE'
    quote: 'Do not human beings have a hard service on earth, and are not their days like the days of a laborer?'
  - where: 'note 7:1 “Hard service on earth”'
    claim: 'Humankind has a hard task like a servant or hireling, with no rest'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'For Job, humankind has been given a difficult task, like a servant or hireling, but there just doesn’t seem to be rest (verses 1–4).'
  - where: 'note 7:6 “A thread that runs out”'
    claim: 'The word for “hope” in 7:6 is tiqvah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'תִּקְוָֽה'
  - where: 'note 7:6 “A thread that runs out”'
    claim: 'tiqvah means cord, as in Rahab''s scarlet line (Josh. 2:18, 21)'
    key: bdb
    url: 'https://biblehub.com/hebrew/8615.htm'
    quote: 'I. [תִּקְוָה] noun feminine cord (compare √ at the beginning); — construct תִּקְוַת חוּט) הַשָּׁנִי Joshua 2:18,21.'
  - where: 'note 7:6 “A thread that runs out”'
    claim: 'tiqvah means hope, at 7:6'
    key: bdb
    url: 'https://biblehub.com/hebrew/8615.htm'
    quote: '1 hope, Jeremiah 31:17; Lamentations 3:29; Job 5:16; Job 7:6'
  - where: 'note 7:6 “A thread that runs out”'
    claim: 'Janus parallelism defined: one word with two meanings facing the lines before and after'
    key: lindsay-janus
    url: 'https://interpreterfoundation.org/journal/janus-parallelism-in-the-book-of-job-a-review-of-scott-b-noegels-work'
    quote: 'Janus parallelism employs a Hebrew word with two meanings that faces two ways. One meaning of the word relates to the preceding text while the other meaning of the word relates to the following text.'
  - where: 'note 7:6 “A thread that runs out”'
    claim: '“Thread” looks back to the shuttle, “hope” forward to verse 7'
    key: lindsay-janus
    url: 'https://interpreterfoundation.org/journal/janus-parallelism-in-the-book-of-job-a-review-of-scott-b-noegels-work'
    quote: 'Noegel explains that the word תִּקְוָה (tiqvah, Strong’s 861528) means both “thread” and “hope.” “Thread” parallels “a weaver’s shuttle” in line 6, while “hope” parallels Job’s failing hope in line 7.'
  - where: 'note 7:6 “A thread that runs out”'
    claim: 'The Targum tries to keep the pun; nearly all commentators recognize it'
    key: lindsay-janus
    url: 'https://interpreterfoundation.org/journal/janus-parallelism-in-the-book-of-job-a-review-of-scott-b-noegels-work'
    quote: 'The Targum attempts to capture the pun with some extra words: “they wear out and are cut off without hope.” Noegel notes that nearly all commentators recognize the pun'
  - where: 'note 7:9 “No coming up from Sheol”'
    claim: '“The grave” in 7:9 is Sheol'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'שְׁ֝א֗וֹל'
  - where: 'note 7:9 “No coming up from Sheol”'
    claim: 'Sheol is the abode of departed spirits, rendered grave, pit, hell'
    key: bd-sheol
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sheol?lang=eng'
    quote: 'The Hebrew name for the abode of departed spirits (corresponding to the Greek Hades), translated in the KJV “grave,” “pit,” and “hell,” depending on the context'
  - where: 'note 7:9 “No coming up from Sheol”'
    claim: 'At this point Job has no hope of resurrection'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'At this point, Job has no hope of resurrection: “He who goes down to Sheol does not come up” (Job 7:9, rsv).'
  - where: 'note 7:9 “No coming up from Sheol”'
    claim: 'Job''s pessimism about death: his state makes his words inaccurate, and they match Psalms and Ecclesiastes on the one mortal life'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'First, at this point in the book, because of Job’s mental and physical state, many things that he says are not entirely accurate. … However, Job’s words are not entirely out of character with discussions about death in both Psalms and Ecclesiastes.'
  - where: 'note 7:9 “No coming up from Sheol”'
    claim: 'Those passages focus on the one mortal life'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'We can read all these as focusing on humanity’s mortal life, that we only live once as mortals and should enjoy and make the best of it.'
  - where: 'note 7:11 “Speaking in the anguish of his spirit”'
    claim: 'Because life is short and the dead do not return, Job will speak'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Before we know it, we are gone and forgotten (verses 6–10). For this reason, Job says, “I will not refrain my mouth;'
  - where: 'note 7:11 “Speaking in the anguish of his spirit”'
    claim: 'Since there is no return from Sheol, Job will give free course to his thoughts'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/7.htm'
    quote: 'For from Shel there is no return, no resurrection (comp. Psalm 103:16 for the expression); therefore will I at least give free course to my thoughts and feelings'
  - where: 'note 7:11 “Speaking in the anguish of his spirit”'
    claim: 'Describing God''s hostility is not itself sin; the Psalms ask How long and Why; the fault would be dwelling on the questions and charging God with mercilessness'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/7.htm'
    quote: 'His sin does not even consist in the inquiries, How long? and Wherefore? The Psalms in that case would abound in sin. But the sin is that he dwells upon these doubting questions, and thus attributes apparent mercilessness and injustice to God.'
  - where: 'note 7:11 “Speaking in the anguish of his spirit”'
    claim: 'The friends push him further; Lamentations and many psalms move from complaint to trust'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/7.htm'
    quote: 'And the friends constantly urge him on still deeper in this sin, the more persistently they attribute his suffering to his own unrighteousness. … Many of the Psalms that begin sorrowfully, end in the same way'
  - where: 'note 7:11 “Speaking in the anguish of his spirit”'
    claim: 'Jeremiah, after like complaints, takes courage from the LORD''s mercies'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/7.htm'
    quote: 'Jeremiah (in Lamentations 3), after similar complaints, adds: Then I repeated this to my heart, and took courage from it: the mercies of Jehovah, they have no end'
  - where: 'note 7:12 “The sea and the sea monster”'
    claim: 'The word behind “whale” is tannin'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'תַּנִּ֑ין'
  - where: 'note 7:12 “The sea and the sea monster”'
    claim: 'tannin covers serpents, crocodiles, sea serpents; “whale” is conjectural'
    key: sc-knowhy-732
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-mormon-mention-dragons'
    quote: 'The Hebrew word translated as “dragon,” tannin, is a broad term describing reptilian creatures of various sizes: snakes, crocodiles, and even legendary sea serpents. Though tannin is sometimes translated as “whale” in the King James Version, the approximation is somewhat conjectural'
  - where: 'note 7:12 “The sea and the sea monster”'
    claim: 'tannin stands for the watery chaos before Creation'
    key: sc-knowhy-732
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-mormon-mention-dragons'
    quote: 'Similar to other Near Eastern “dragons,” it represents the watery chaos that preceded Creation.'
  - where: 'note 7:12 “The sea and the sea monster”'
    claim: 'BDB: sea monster, figurative at 7:12, with Ps. 74:13, Isa. 27:1; 51:9 and Rahab as a personification of chaos'
    key: bdb
    url: 'https://biblehub.com/hebrew/8577.htm'
    quote: '3 sea- (or river-) monster, Genesis 1:21 (P); figurative Job 7:12; Psalm 74:13 (i.e. Egyptains), Isaiah 27:1; Isaiah 51:9 ("" רַהַב, mythological personification of chaos)'
  - where: 'note 7:12 “The sea and the sea monster”'
    claim: 'Jehovah battles the sea and its monsters; Job asks how he became so dangerous as to need that attention'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'In the Old Testament, Jehovah is said to go to battle against the sea and against the monsters that live within it. … Job is wondering how he became so dangerous that he warrants as much divine attention as God gives to the sea and its monsters.'
  - where: 'note 7:12 “The sea and the sea monster”'
    claim: 'A modern translation reads “the Sea or the Dragon”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%207&version=NRSVUE'
    quote: 'Am I the Sea or the Dragon that you set a guard over me?'
  - where: 'note 7:17 “Psalm 8 turned into a complaint”'
    claim: 'Job 7:17–21 reworks Psalm 8 cynically; Job wants God to look away'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job 7:17–21 can be read as a cynical reinterpretation of Psalm 8. In Psalm 8, David wonders in gratitude and thanksgiving … Whereas Job, who wants more than anything for God to look away, asks'
  - where: 'note 7:20 “If I have sinned”'
    claim: '“I have sinned” is hypothetical; human sin cannot harm God'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/7.htm'
    quote: '"I have sinned" is hypothetical (Ges. 155, 4, a): granted that I have sinned. … The thought that human sin, however, can detract nothing from the blessedness and glory of God, underlies this.'
  - where: 'note 7:20 “If I have sinned”'
    claim: 'A modern translation: “If I sin … you watcher of humanity … a burden to you”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%207&version=NRSVUE'
    quote: 'If I sin, what do I do to you, you watcher of humanity? Why have you made me your target? Why have I become a burden to you?'
  - where: 'note 7:20 “If I have sinned”'
    claim: 'Job wonders what his actions could even do to God'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job wonders why God takes such an active interest in punishing those who sin and wonders what effect his actions even have on God'
  - where: 'note 7:20 “If I have sinned”'
    claim: '“Preserver of men” is “watcher of men,” said ironically'
    key: bdb
    url: 'https://biblehub.com/hebrew/5341.htm'
    quote: '1 Watch, guard, keep, a vineyard Job 27:18 … of God נֹצֵר הָאָדָם Job 7:20 (thou) watcher of men (iron.).'
  - where: 'note 7:20 “If I have sinned”'
    claim: 'Job calls God the strict observer of men; the title is worthy of God (Isa. 27:3) but used unbecomingly'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/7.htm'
    quote: 'Job calls God האדם נצר, the strict and constant observer of men … since the appellation, in itself worthy of God (Isaiah 27:3), is used here only somewhat unbecomingly.'
  - where: 'note 7:20 “If I have sinned”'
    claim: '“Mark” is a thing struck'
    key: bdb
    url: 'https://biblehub.com/hebrew/4645.htm'
    quote: 'מִפְגָּע noun [masculine] thing hit, mark'
  - where: 'note 7:20 “If I have sinned”'
    claim: 'Jewish tradition says “to myself” is a scribes'' correction for “to thee,” removed as near blasphemy'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/7.htm'
    quote: 'according to Jewish tradition, עלי, which we now have, is only a סופרים תקון, correctio scribarum,'
  - where: 'note 7:20 “If I have sinned”'
    claim: 'The removed reading “to thee”; the commentator accepts it because the Septuagint has it'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/7.htm'
    quote: 'for אליך, which was removed as bordering on blasphemy: why am I become a burden to Thee, so that Thou shouldest seek to get rid of me? This reading I should not consider as the original, in spite of the tradition, if it were not confirmed by the lxx'
  - where: 'note 7:20 “If I have sinned”'
    claim: 'The Septuagint reads “a burden to thee”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/job/7.htm'
    quote: 'If I have sinned, what shall I be able to do, O thou that understandest the mind of men? why hast thou made me as thine accuser, and why am I a burden to thee?'
  - where: christ
    claim: 'At this point Job has no hope of resurrection; later he longs for a future life'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/7.htm'
    quote: 'We shall see by and by, how the more his friends torment him, the more he is urged on in his longing for a future life'
  - where: christ
    claim: 'The Church''s footnote at 7:1 “appointed” points to Alma 12:27 (26–28)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/7?lang=eng'
    quote: '1a “appointed”: Alma 12:27 (26–28); D&C 42:48; 121:25.'
  - where: explore
    claim: 'Lehi''s language of the grave of no return has antecedents in Job (7:9–10; 10:20–21)'
    key: sc-knowhy-26
    url: 'https://scripturecentral.org/knowhy/did-lehi-quote-shakespeare'
    quote: 'Latter-day Saint scholars have responded to this criticism by pointing out that the imagery and language found in 2 Nephi 1 appears, for example, in the Bible: … (Job 10:20–21; cf. Job 7:9–10; 16:22, emphasis added).'
