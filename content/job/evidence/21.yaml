chapter: 21
claims:
  # setting
  - where: setting
    claim: 'Chapters 15–21 are the second round of speeches'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job 15–21 represents the second round of speeches between Job and his three friends.'
  - where: setting
    claim: 'Zophar asserts the standard line that the triumphing of the wicked is short'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'as in chapters 20 and 21 where Zophar asserts the standard line that the “triumphing of the wicked is short”'
  - where: setting
    claim: 'Zophar means that the wicked always get their due, implying that Job has got what was coming to him'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Zophar believes that the wicked always end up eventually getting what is coming to them. … he is using this to imply that Job finally has gotten what has been coming to him'
  - where: setting
    claim: 'Bildad described the fate of the wicked as a light put out'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Bildad outlines the eventual fate of the wicked as a light that will be put out and a spark that will not shine (verse 5).'
  - where: setting
    claim: 'Job tells Zophar his complaint is with God, and still argues against Zophar''s claim that the wicked get their due'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job reminds Zophar that his problem is between him and God: “As for me, is my complaint to man?” (Job 21:4). But he still argues against Zophar’s assertion that the wicked get their just rewards.'
  - where: setting
    claim: 'Job concludes the second cycle, arguing that retribution does not hold in this world, and refutes Zophar almost point by point'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job concludes the second cycle by imploring his friends to see, as he has, that retribution does not hold in this world (see Job 21). He refutes Zophar’s last argument almost point by point'
  - where: setting
    claim: 'The chapter heading: Job admits the wicked sometimes prosper and testifies of judgment hereafter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/21?lang=eng'
    quote: 'Job admits that the wicked sometimes prosper in this life—Then he testifies that their judgment will be hereafter in the day of wrath and destruction.'

  # thread
  - where: thread
    claim: 'Verses 7–16 describe the pleasant, unbothered lives of the wicked'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'In Job 21:7–16, Job describes the pleasant and unbothered lives of the wicked. They have many children and their houses are safe, their livestock produces well, and they sing and dance (verses 8–13).'
  - where: thread
    claim: 'The wicked die without a death-struggle, and yet deny God and count prayer useless'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/21.htm'
    quote: 'they sink down after a life that is completely consumed away, without a death-struggle, into Hades, and yet they denied God, would not concern themselves about His sways'
  - where: thread
    claim: 'In verse 16 Job disavows all fellowship with the counsel of the wicked'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/21.htm'
    quote: 'be it far from me that so I should speak according to their way of thinking, with which, on the contrary, I disavow all fellowship'
  - where: thread
    claim: 'Verse 17 asks how seldom the friends'' doctrine comes to pass'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/21.htm'
    quote: 'How seldom does what the friends preach to him come to pass'
  - where: thread
    claim: 'Prosperous and suffering share the lot of death; ask the travellers, who know sinners carried in honour to the grave'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/21.htm'
    quote: 'The godless who have lived prosperously all their days, and the righteous who have experienced only sorrow, share the common lot of death. One has only to ask persons who have had experience of the world'
  - where: thread
    claim: 'Job condemns the friends'' comfort as empty and their answers as falsehood'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job condemns the comfort of the friends as empty and their answers as falsehood (see Job 21:34).'

  # plain
  - where: section 3 plain
    claim: 'Verse 19a is the friends'' claim, introduced by “You say”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+21&version=NRSVUE'
    quote: 'You say, ‘God stores up their iniquity for their children.’'

  # note 21:5
  - where: 'note 21:5 “A hand over the mouth”'
    claim: 'Job''s complaint is with God, yet he still argues against Zophar'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job reminds Zophar that his problem is between him and God: “As for me, is my complaint to man?” (Job 21:4). But he still argues against Zophar’s assertion that the wicked get their just rewards.'
  - where: 'note 21:7 “Why the wicked prosper”'
    claim: 'Chapters 20–21 debate retributive justice: Zophar says the triumph of the wicked is short, Job that they enjoy long life'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'We see this doctrine debated many times between Job and his interlocutors, as in chapters 20 and 21 where Zophar asserts the standard line that the “triumphing of the wicked is short” and Job answers that the wicked often enjoy long life'
  - where: 'note 21:7 “Why the wicked prosper”'
    claim: 'The friends hold the two-dimensional view; the book shows the righteous sometimes suffer and the wicked sometimes prosper for a time'
    key: sc-knowhy-864
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-job-apply-to-everyone'
    quote: 'people who do good things are always rewarded in this life, and people who do evil are always punished in this life. … sometimes the righteous suffer for a time, and sometimes the wicked prosper for a time.'
  - where: 'note 21:7 “Why the wicked prosper”'
    claim: 'The 2014 seminary manual: the friends said the wicked cannot prosper; Job acknowledged they sometimes do, but the Lord will judge'
    key: seminary-ot-teacher-108
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-108-job-17-37?lang=eng'
    quote: 'Summarize Job 20–22 by explaining that Job’s friends insisted that the wicked cannot prosper. Job acknowledged that sometimes the wicked do prosper in terms of their worldly possessions, but ultimately the Lord will administer justice on the Day of Judgment.'

  # note 21:17
  - where: 'note 21:17 “How often is the lamp put out?”'
    claim: '“How often” here means “how seldom?!”; the friends'' preaching seldom comes true'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/21.htm'
    quote: 'but in the sense of "how seldom?!" How seldom does what the friends preach to him come to pass'
  - where: 'note 21:17 “How often is the lamp put out?”'
    claim: 'The images come from Bildad (18:12) and Zophar (20:29)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/21.htm'
    quote: 'thus Bildad, Job 18:12 : misfortune'
  - where: 'note 21:17 “How often is the lamp put out?”'
    claim: 'Zophar''s phrase “the portion of the wicked man” (20:29) is echoed'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/21.htm'
    quote: 'comp. Zophar''s "this is the portion of the wicked man," i.e., what is allotted to him, Job 20:29'
  - where: 'note 21:17 “How often is the lamp put out?”'
    claim: 'Verses 17 and 18 are both governed by the question; the chaff is Psalm 1:4''s; Job questions Zophar''s false and superficial use of Psalm 1'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/21.htm'
    quote: 'The figure of chaff is more frequent, e.g., Psalm 1:4. Job here puts in the form of a question what Psalm 1:1-6 maintains, being urged on by Zophar''s false application and superficial comprehension of the truth expressed in the opening of the Psalter.'
  - where: 'note 21:17 “How often is the lamp put out?”'
    claim: 'A modern translation renders verse 17 as questions'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+21&version=NRSVUE'
    quote: 'How often is the lamp of the wicked put out? How often does calamity come upon them?'
  - where: 'note 21:17 “How often is the lamp put out?”'
    claim: 'Job refutes Zophar almost point by point'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'He refutes Zophar’s last argument almost point by point'

  # note 21:19
  - where: 'note 21:19 “Punished in his children?”'
    claim: 'A modern translation introduces verse 19a with “You say”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+21&version=NRSVUE'
    quote: 'You say, ‘God stores up their iniquity for their children.’'
  - where: 'note 21:19 “Punished in his children?”'
    claim: 'The sense is obscured in the King James; the Common English Bible renders 19–21 clearly; Job wants the wicked themselves punished'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'This sentiment is obscured in the King James Version. Job 21:19–21 in the Common English Bible reads, “God stores up his punishment for his children. Let him destroy them so they know. Let their own eyes witness their doom.'
  - where: 'note 21:19 “Punished in his children?”'
    claim: 'Job objects to the friends'' idea (20:10; 18:15–19) that God stores up iniquity for the sons; it has support in Exod. 20:5, mixed with human tradition'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'the friends’ concept of God punishing the children for the sins of their fathers does find support in scripture (see Exodus 20:5); thus, we have another instance of the friends mixing scripture with accumulated human tradition'
  - where: 'note 21:30 “Kept for the day, or spared in it?”'
    claim: 'The chapter heading reads verse 30 as judgment hereafter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/21?lang=eng'
    quote: 'Then he testifies that their judgment will be hereafter in the day of wrath and destruction.'
  - where: 'note 21:30 “Kept for the day, or spared in it?”'
    claim: 'A modern translation: the wicked are spared in the day of calamity'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+21&version=NRSVUE'
    quote: 'that the wicked are spared in the day of calamity'
  - where: 'note 21:30 “Kept for the day, or spared in it?”'
    claim: 'The travellers testify that the wicked rarely experience calamity'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'appealing to the testimony of travelers, who have observed much of the world, that the wicked rarely experience calamity (see Job 21:29–30)'

  - where: thread
    claim: 'The travellers tell of sinners carried in honour to the grave'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/21.htm'
    quote: 'were carried in honour to the grave'

  # christ
  - where: christ
    claim: 'The chapter heading reads Job as testifying that judgment on the wicked comes hereafter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/21?lang=eng'
    quote: 'Then he testifies that their judgment will be hereafter in the day of wrath and destruction.'
  - where: christ
    claim: 'The wicked sometimes prosper and the righteous sometimes suffer for a time'
    key: sc-knowhy-864
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-job-apply-to-everyone'
    quote: 'sometimes the righteous suffer for a time, and sometimes the wicked prosper for a time.'
  - where: explore
    claim: 'Ezekiel 18 sets aside the transfer of punishment to the children that Job disputes in verses 19–21'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/21.htm'
    quote: 'Job as little as Ezekiel, ch. 18, disputes the doctrine of retribution in itself, but that imperfect apprehension, which … maintains a transfer of the punishment'
