chapter: 17
claims:
  # setting
  - where: setting
    claim: 'Chapters 15–21 are the second round'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job 15–21 represents the second round of speeches between Job and his three friends. Eliphaz continues much of the same arguments that he began in Job 4–5 but is perhaps less kind now. Eliphaz considers Job’s speech to be “vain knowledge” and “unprofitable talk”'
  - where: setting
    claim: 'In chapter 16 Job describes God attacking him, not for anything Job has done'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'In Job 16:7–17, Job describes how God has attacked him and delivered him to the wicked—and not for anything Job has done.'
  - where: setting
    claim: 'Job felt he was near death (17:1)'
    key: seminary-ot-teacher-108
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-108-job-17-37?lang=eng'
    quote: 'What do you think Job meant when he said, “The graves are ready for me”? (Job felt that he was near death.)'
  - where: setting
    claim: 'Job changes his address between God and his friends and assumes the friends'' treatment is God''s doing'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'he changes his address between God and his friends. Job assumes that the way his friends are treating him is God’s doing as well.'

  # thread
  - where: thread
    claim: 'The plea for a pledge follows from 16:19; the friends give no guarantee but want to persuade Job he is unrighteous'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/17.htm'
    quote: 'The friends are far from furnishing a guarantee of this; for they, on the contrary, are desirous of persuading him, that, if he would only let his conscience speak, he must regard himself as an unrighteous one'
  - where: thread
    claim: 'Job''s eye dim, the righteous should stand strong, no wise man among the friends, no hope in the grave'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Because of the reaction of his friends, Job asserts, “I cannot find one wise man among you” (verse 10). Job wonders where he will find hope; if he cannot find hope and solace from his friends, he is certainly not going to find it in the grave (verses 11–16).'

  # sections
  - where: 'section 1 plain'
    claim: '“My breath is corrupt” is “spirit is consumed” in Hebrew (the Church''s footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/17?lang=eng'
    quote: '“breath is corrupt”: HEB spirit is consumed.'
  - where: 'section 2 plain'
    claim: 'A modern translation of 17:3 and 17:5'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2017&version=NRSVUE'
    quote: '3 “Lay down a pledge for me with yourself; who is there who will give surety for me?(C) 4 Since you have closed their minds to understanding, therefore you will not let them triumph.'
  - where: 'section 3 plain'
    claim: 'A modern translation of 17:6–9'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2017&version=NRSVUE'
    quote: '8 The upright are appalled at this, and the innocent stir themselves up against the godless. 9 Yet the righteous hold to their way, and they who have clean hands grow stronger and stronger.'
  - where: 'section 4 plain'
    claim: 'A modern translation names Sheol in 17:13 and 17:16 and the friends'' saying in 17:12'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2017&version=NRSVUE'
    quote: '12 They make night into day; ‘The light,’ they say, ‘is near to the darkness.’ 13 If I look for Sheol as my house, if I spread my couch in darkness,'

  # note 17:3
  - where: 'note 17:3 “Surety with God Himself”'
    claim: 'The verb ʿārab means go surety for; Gen. 43:9; used of God at Isa. 38:14 and Ps. 119:122, so Job 17:3'
    key: bdb
    url: 'https://biblehub.com/hebrew/6148.htm'
    quote: '1 with accusative of person taken on pledge, i.e. go surety for the safety of, Genesis 43:9 (J), Genesis 44:32 (J; + מֵעִם person); for the debts of Proverbs 11:15; Proverbs 20:16; Proverbs 27:13; of God Isaiah 38:14 go surety for me, Psalm 119:122, so Job 17:3'
  - where: 'note 17:3 “Surety with God Himself”'
    claim: 'Striking hands ratified a bargain, pledging oneself as surety; 17:3: who will strike himself into my hand'
    key: bdb
    url: 'https://biblehub.com/hebrew/8628.htm'
    quote: '2 מִיהֿוּא לְיָדִי יִתֵָּקעַ ׃ Job 17:3 who is there that will strike himself (i.e. pledge himself) into my hand ?'

  # note 17:5
  - where: 'note 17:5 “Friends who hand a friend over”'
    claim: 'ḥēleq in 17:5 is dubious: share of feast or booty; AV flattery does not suit context'
    key: bdb
    url: 'https://biblehub.com/hebrew/2506.htm'
    quote: 'לְחֵלָק Job 17:5 is dubious: a share of feast, or of booty, Kmp Hi; a prey, spoil, Ew Di Da; AV flattery does not suit context.'
  - where: 'note 17:5 “Friends who hand a friend over”'
    claim: 'A modern translation of 17:5'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2017&version=NRSVUE'
    quote: '5 Those who denounce friends for reward— the eyes of their children will fail.(E)'
  - where: 'note 17:5 “Friends who hand a friend over”'
    claim: 'The proverb: he who gives his friends up as spoil is punished in his children; one deserts his friends instead of shielding them'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/17.htm'
    quote: 'he who offers his friends as spoil for distribution will be punished most severely for the same upon his children … the general meaning is certainly: one deserts (instead of shielding as an intercessor) his friends and delivers them up'
  - where: 'note 17:5 “Friends who hand a friend over”'
    claim: 'The friends dispose of Job mercilessly, as spoil or property fallen to a creditor'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/17.htm'
    quote: 'The three have no insight into the affliction of the righteous one; they dispose of him mercilessly, as of spoil or property that has fallen into the hands of the creditor'

  # note 17:6
  - where: 'note 17:6 “Not a drum but spitting”'
    claim: 'tōpet is the act of spitting; 17:6: a spitting in the face do I become, men spit in my face; AV tabret'
    key: bdb
    url: 'https://biblehub.com/hebrew/8611.htm'
    quote: 'I. תֹּ֫פֶת noun feminine act of spitting; — absolute ׳לְפָנִים וְת Job 17:6 a spitting in the face do I become, i.e. men spit in my face'
  - where: 'note 17:6 “Not a drum but spitting”'
    claim: 'A modern translation of 17:6'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2017&version=NRSVUE'
    quote: 'and I am one before whom people spit.(F)'

  # note 17:9
  - where: 'note 17:9 “The righteous hold on”'
    claim: 'Davis: Job assumes his state should provoke the righteous to stand strong and help (8–9)'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job assumes that someone being in such a state should provoke the righteous to stand strong and help (verses 8–9).'
  - where: 'note 17:9 “The righteous hold on”'
    claim: 'Davis reads verse 10 as Job''s response to his friends, after verses 8–9'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Because of the reaction of his friends, Job asserts, “I cannot find one wise man among you” (verse 10).'
  - where: 'note 17:9 “The righteous hold on”'
    claim: 'Delitzsch: the righteous holds firm, not disconcerted by the anomaly of innocent suffering beside prosperous godless'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/17.htm'
    quote: 'but the righteous holds firm (without allowing himself to be disconcerted by this anomalous'

  # note 17:12
  - where: 'note 17:12 “Friends who call night day”'
    claim: 'The Hebrew of 17:12 is uncertain; a modern translation gives the friends'' saying'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2017&version=NRSVUE'
    quote: '12 They make night into day; ‘The light,’ they say, ‘is near to the darkness.’ … 17.12 Meaning of Heb uncertain'
  - where: 'note 17:12 “Friends who call night day”'
    claim: 'The friends turn night into day; light, in their opinion, is nearer than the darkness facing Job; no wise man among them (17:10–11)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/17.htm'
    quote: 'the friends turn night into day (שׂים, as Isaiah 5:20); light is (i.e., according to their opinion) nearer than the face of darkness, i.e., than the darkness which is in reality turned to him, and which is as though it stared at him from the immediate future.'

  # note 17:15
  - where: 'note 17:15 “A hope that goes down to Sheol”'
    claim: 'A modern translation keeps Sheol in 17:13 and 17:16'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2017&version=NRSVUE'
    quote: '13 If I look for Sheol as my house, … 16 Will it go down to the bars of Sheol? Shall we descend together into the dust?”(M)'
  - where: 'note 17:15 “A hope that goes down to Sheol”'
    claim: 'Stirling: after the second insight Job, who had yearned for death, refuses to yield to the grave or worm by letting go of hope; a new hope born of travail'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Whereas he had previously yearned for death (see Job 3:1, 11; 6:8–9; 7:16), Job now refuses to yield to the grave or worm by letting go of his hope (see Job 17:11–16). Job has a new kind of hope, born of travail'
  - where: 'note 17:15 “A hope that goes down to Sheol”'
    claim: 'Davis: no hope or solace from his friends, and certainly not in the grave'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job wonders where he will find hope; if he cannot find hope and solace from his friends, he is certainly not going to find it in the grave (verses 11–16).'
  - where: 'note 17:3 “Surety with God Himself”'
    claim: 'A modern translation renders 17:3 “Lay down a pledge for me with yourself”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2017&version=NRSVUE'
    quote: '3 “Lay down a pledge for me with yourself; who is there who will give surety for me?(C)'
  - where: 'note 17:9 “The righteous hold on”'
    claim: 'A modern translation of 17:8–9'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2017&version=NRSVUE'
    quote: '8 The upright are appalled at this, and the innocent stir themselves up against the godless. 9 Yet the righteous hold to their way, and they who have clean hands grow stronger and stronger.'
