chapter: 24
claims:
  # setting
  - where: setting
    claim: 'In chapter 23 Job wants an audience with God, to argue his case before His seat'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'In this reply, Job seems to tire of addressing his friends directly and reiterates what he really wants: an audience with God.'
  - where: setting
    claim: 'Chapter 23 treats Job''s own suffering, chapter 24 the reverse: the evil-doers'' prosperity and freedom from punishment'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/24.htm'
    quote: 'In the first part of the speech (Job 23) he occupies himself with the mystery of his own suffering lot, and in the second part (Job 24) with the reverse of this mystery, the evil-doers'' prosperity and immunity from punishment.'
  - where: setting
    claim: 'Bildad''s third reply is short and Zophar gives no third speech'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Not only is Bildad’s reply uncharacteristically short, Zophar is not given a third speech'
  # thread
  - where: thread
    claim: 'Job lists unpunished wickedness, then in 17–24 seems to argue differently; commentators wrestle with the change'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'In Job 24:17–24, Job seems to make a very different argument. … Commentators still wrestle with explaining the change from the first half of the chapter to the second half.'
  - where: thread
    claim: 'The chapter''s divisions at 13 and 18 (paragraph breaks of a modern translation)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2024&version=NRSVUE'
    quote: '13 “There are those who rebel against the light,'
  # section plains (departures from the KJV)
  - where: section 1 plain
    claim: 'Verse 1 asks why times of judgment are not kept by the Almighty'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2024&version=NRSVUE'
    quote: 'Why are times not kept by the Almighty,'
  - where: section 1 plain
    claim: 'Verse 10: though hungry, they carry the sheaves; verse 11 within their masters'' walls'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/24.htm'
    quote: 'while suffering hunger they carry the sheaves … Between their walls … i.e., the walls of their masters who have made them slaves'
  - where: section 1 plain
    claim: 'Verse 6: they reap in a field not their own'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2024&version=NRSVUE'
    quote: 'They reap in a field not their own,'
  - where: section 2 plain
    claim: 'Verse 17: deep darkness is morning to them; they are friends with its terrors'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2024&version=NRSVUE'
    quote: 'For deep darkness is morning to all of them; for they are friends with the terrors of deep darkness.'
  - where: section 3 plain
    claim: 'Verse 22: God prolongs the life of the mighty; they rise up when they despair of life'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2024&version=NRSVUE'
    quote: 'Yet God prolongs the life of the mighty by his power; they rise up when they despair of life.'
  # note 24:1
  - where: 'note 24:1 “Why does God keep no times?”'
    claim: 'A modern translation of verse 1'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2024&version=NRSVUE'
    quote: 'Why are times not kept by the Almighty, and why do those who know him never see his days?'
  - where: 'note 24:1 “Why does God keep no times?”'
    claim: 'The verb means storing up, used in Job of God storing up punishment (21:19)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/24.htm'
    quote: 'צפן, in the sense of the divine predetermination of what is future, Job 15:20, especially of God''s storing up merited punishment, Job 21:19, is an acknowledged word of our poet.'
  - where: 'note 24:1 “Why does God keep no times?”'
    claim: '“Times” are times of punishment and “his days” God''s days of judgment, when His judgment is revealed'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/24.htm'
    quote: 'with יהוה, the day when God''s judgment is revealed, Joel 1:15, and freq. The boldness of poetic language goes beyond this usage, by using עתּים directly of the period of punishment'
  - where: 'note 24:1 “Why does God keep no times?”'
    claim: '“Those who know him” are those in fellowship with God'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/24.htm'
    quote: 'those who know God, not merely superficially, but from experience of His ways, consequently those who are in fellowship with Him.'
  - where: 'note 24:1 “Why does God keep no times?”'
    claim: 'The friends maintain that divine retribution is everywhere manifest; Job finds no determined times of punishment'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/24.htm'
    quote: 'while the friends (Job 22:19) maintain a divine retribution everywhere manifest, is painfully conscious of the absence of any determination of the periods and days of judicial punishment.'
  - where: 'note 24:1 “Why does God keep no times?”'
    claim: 'Like Habakkuk, Job is impatient for God to bring justice'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Like Habakkuk (see Habakkuk 1:12–13), Job is impatient for God to bring justice to all and put things right.'
  # note 24:3
  - where: 'note 24:3 “The widow''s ox and the orphan''s donkey”'
    claim: 'The law curses removing a neighbor''s landmark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/27?lang=eng'
    quote: 'Cursed be he that removeth his neighbour’s landmark.'
  - where: 'note 24:3 “The widow''s ox and the orphan''s donkey”'
    claim: 'The law forbids taking a millstone in pledge, for it is taking a man''s life'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/24?lang=eng'
    quote: 'No man shall take the nether or the upper millstone to pledge: for he taketh a man’s life to pledge.'
  - where: 'note 24:3 “The widow''s ox and the orphan''s donkey”'
    claim: 'The pledge of verse 3 is set beside the laws of pledges and beside Eliphaz''s charge at 22:6'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2024&version=NRSVUE'
    quote: '24.3 : Ex 22.26; Deut 24.6, 10, 12, 17; Job 22.6'
  - where: 'note 24:3 “The widow''s ox and the orphan''s donkey”'
    claim: 'Job had always cared for the poor; now he feels their suffering in a new way'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'While Job had always cared for the poor and oppressed (see Job 31:13–23), he now feels their suffering in a new and profound way.'
  # note 24:10
  - where: 'note 24:10 “Hungry among the sheaves”'
    claim: 'The Hebrew of verse 10b: hungry, they carried a sheaf'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'נָ֣שְׂאוּ'
  - where: 'note 24:10 “Hungry among the sheaves”'
    claim: 'A modern translation of verses 10–11'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2024&version=NRSVUE'
    quote: 'though hungry, they carry the sheaves; 11 between their terraces they press out oil; they tread the winepresses but suffer thirst.'
  - where: 'note 24:10 “Hungry among the sheaves”'
    claim: 'Serfs pressing oil under oversight, not allowed to drink; withheld wages cry to heaven; masters deny them what Deut 25:4 allows beasts'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/24.htm'
    quote: 'the sin of merces retenta laborum, which cries aloud to heaven … while suffering hunger they carry the sheaves (since their masters deny them what, according to Deuteronomy 25:4, shall not be withheld even from the beasts).'
  - where: 'note 24:10 “Hungry among the sheaves”'
    claim: 'They suffer thirst without being allowed to drink from the presses'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/24.htm'
    quote: 'and suffer thirst withal (fut. consec. according to Ew. 342, a), without being allowed to quench their thirst from the must which runs out of the presses'
  # note 24:12
  - where: 'note 24:12 “God takes no notice”'
    claim: 'The Hebrew word at the end of verse 12'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'תִּפְלָֽה'
  - where: 'note 24:12 “God takes no notice”'
    claim: 'tiplah is insipidity, absurdity; here immorality left unpunished; the Syriac read it as prayer'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/24.htm'
    quote: 'תּפלה is properly insipidity … absurdity, self-contradiction, here the immorality which sets at nought the moral order of the world, and remains nevertheless unpunished. The Syriac version reads תּפלּה'
  - where: 'note 24:12 “God takes no notice”'
    claim: 'The Church''s footnote gives the alternative rendering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/24?lang=eng'
    quote: 'OR does not give heed to their prayer.'
  - where: 'note 24:12 “God takes no notice”'
    claim: 'A modern translation follows the reading "prayer"'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2024&version=NRSVUE'
    quote: 'yet God pays no attention to their prayer.'
  - where: 'note 24:12 “God takes no notice”'
    claim: 'After listing unpunished wickedness, Job concludes with 24:12'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job spends much of this chapter outlining the wickedness in this world that seems to go unpunished. After outlining many examples, Job comments, “Yet God layeth not folly to them” (Job 24:12).'
  # note 24:13
  - where: 'note 24:13 “Enemies of the light”'
    claim: 'A modern translation of verse 17'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2024&version=NRSVUE'
    quote: 'For deep darkness is morning to all of them; for they are friends with the terrors of deep darkness.'
  - where: 'note 24:13 “Enemies of the light”'
    claim: 'The Church''s footnote to "rebel" points to D&C 10:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/24?lang=eng'
    quote: 'D&C 10:21 (20–22).'
  - where: 'note 24:13 “Enemies of the light”'
    claim: 'D&C 10:21 is said of those stirred up against the Lord''s work'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/10?lang=eng'
    quote: 'they love darkness rather than light, because their deeds are evil; therefore they will not ask of me.'
  - where: 'note 24:13 “Enemies of the light”'
    claim: 'In 24:13–25 Job reiterates that the wicked thrive at others'' expense, against the friends'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job reiterates once again the truth that the wicked often thrive at the expense of others, despite the assertions of the friends to the contrary (see Job 24:13–25).'
  # note 24:18
  - where: 'note 24:18 “How the wicked end”'
    claim: 'In 17–24 Job seems to argue differently; perhaps he is upset that judgment comes only after the innocent have long suffered'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'It may be that Job, as before, is upset that judgment does not come sooner but must wait until the wickedness has long since transpired and the innocent have long since suffered.'
  - where: 'note 24:18 “How the wicked end”'
    claim: 'Some scholars think the text was corrupted and some of Job''s lines belong to the friends; the responsibility is to read the text as it stands'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'some of Job’s final responses sound like they should come from his friends instead. These are certainly possibilities, but our responsibility is to read the text as it stands'
  - where: 'note 24:18 “How the wicked end”'
    claim: 'Verses 18ff seem to express the opponents'' view; Delitzsch takes them as Job''s own view'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/24.htm'
    quote: 'But what now follows in Job 24:18 seems to express not Job''s opinion, but that of his opponents. … The right interpretation is that which regards both Job 24:18 and Job 24:22 as Job''s own view'
  - where: 'note 24:18 “How the wicked end”'
    claim: 'God preserves the oppressors long and lets them die naturally, as a ripe ear is cut off'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/24.htm'
    quote: 'even God himself preserves the oppressors long in the midst of extreme danger, and after a long life, free from care and laden with honour, permits them to die a natural death, as a ripe ear of corn is cut off.'
  - where: 'note 24:18 “How the wicked end”'
    claim: 'A modern translation of verse 22'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2024&version=NRSVUE'
    quote: 'Yet God prolongs the life of the mighty by his power;'
  - where: 'note 24:18 “How the wicked end”'
    claim: 'On this reading the death of the wicked differs from others'' only by coming late and painlessly, against the friends'' fearful description'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/24.htm'
    quote: 'he returns to their death, which the friends, contrary to experience, have so fearfully described, whilst it is only now and then distinguished from the death of other men by coming on late and painlessly.'
  - where: setting
    claim: 'Eliphaz accuses Job of specific crimes'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Eliphaz goes on to accuse Job of committing specific crimes for which he is suffering.'
  # christ
  - where: christ
    claim: 'Matthew 25:40 and Mosiah 4:26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/25?lang=eng'
    quote: 'Inasmuch as ye have done it unto one of the least of these my brethren, ye have done it unto me.'
  - where: christ
    claim: 'Our relationship with God rests on feeding, clothing and visiting others (Mosiah 4)'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Our own relationship with God is predicated on our feeding, clothing, and visiting others (Mosiah 4).'
  - where: christ
    claim: 'Job''s suffering deepened his empathy for the poor he had always cared for'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'his suffering having deepened his empathy for others.'
  # explore
  - where: explore
    claim: 'The Church''s footnote sets Psalm 37:10 beside verse 24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/24?lang=eng'
    quote: 'Ps. 37:10 (10–11).'
