chapter: 20
claims:
  - where: when
    claim: 'Job 20 is Zophar''s second speech'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Zophar responds to Job for the second time'

  - where: setting
    claim: 'Zophar answers Job a second time; his answer moves away from Job''s situation to reaffirm his own view of the world, which does not allow Job to be both innocent and suffering'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'his answer moves away from Job’s specific situation or needs and moves to reaffirming Zophar’s way of seeing the world. Zophar’s worldview does not allow Job to be both innocent and suffering, so Zophar describes to Job the fate of the wicked.'
  - where: setting
    claim: 'The Joseph Smith Papers editors list Job 20 among the speeches that charged Job with transgression (note 39 to D&C 121:10 in the letter)'
    key: jsp-letter-1839-03-20
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-and-edward-partridge-20-march-1839/8'
    quote: '39: See Job chaps. 4–5, 8, 11, 15, 18, 20, 22, 25, 32–37.'
  - where: setting
    claim: 'Zophar is not given a third speech'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Not only is Bildad’s reply uncharacteristically short, Zophar is not given a third speech'

  - where: thread
    claim: 'In the second round the friends no longer lure Job with promises but present only terrible images'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/20.htm'
    quote: 'they no longer try to lure Job on to penitence by promises, but endeavour to bring him to a right state of mind … by presenting to him only the most terrible images.'

  - where: section 1 plain
    claim: 'Verse 3 in a modern translation: a censure that insults Zophar'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2020&version=NRSVUE'
    quote: 'I hear censure that insults me'
  - where: section 2 plain
    claim: 'Verses 10–11 in a modern translation: the children seek the favor of the poor; bodies once full of youth lie down in the dust'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2020&version=NRSVUE'
    quote: 'Their children will seek the favor of the poor, and their hands will give back their wealth. Their bodies, once full of youth, will lie down in the dust with them.'
  - where: section 4 plain
    claim: 'Verse 26 in a modern translation: darkness laid up for his treasures; a fire fanned by no one'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2020&version=NRSVUE'
    quote: 'Utter darkness is laid up for their treasures; a fire fanned by no one will devour them'
  - where: section 4 plain
    claim: 'The "steel" of verse 24 is bronze'
    key: sc-knowhy-548
    url: 'https://scripturecentral.org/knowhy/why-did-nephis-fine-steel-bow-break'
    quote: 'The word translated “steel” in these passages is the Hebrew nhwsh which actually means “bronze”'

  - where: 'note 20:3 “Stung into answering”'
    claim: 'Zophar answers because Job''s reproach, especially his threat of judgment, has stirred him'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/20.htm'
    quote: 'in consequence of the reproach which Job casts upon him, especially with his threat of judgment, Zophar''s mind and feelings fall into a state of excitement'
  - where: 'note 20:3 “Stung into answering”'
    claim: 'A man is never more eloquent than when defending his injured honour'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/20.htm'
    quote: 'in him we have an illustration of the fact that a man is never more eloquent than when he has to defend his injured honour'
  - where: 'note 20:3 “Stung into answering”'
    claim: 'Zophar, insulted by Job, makes a long statement on retribution; Job''s words greatly disturb him'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Zophar, like Bildad, insulted by Job’s words and attitude, now makes a lengthy statement about certain retribution against the wicked'
  - where: 'note 20:3 “Stung into answering”'
    claim: 'Job''s words threaten the established order and greatly disturb Zophar'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job’s words, which threaten the established social order, “greatly disturb” and trouble Zophar (see Job 20:2, niv).'
  - where: 'note 20:3 “Stung into answering”'
    claim: 'A modern translation of verse 3'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2020&version=NRSVUE'
    quote: 'I hear censure that insults me, and a spirit beyond my understanding answers me.'

  - where: 'note 20:5 “The short triumph of the wicked”'
    claim: 'That the wicked eventually get what is coming would be hard to argue with; Zophar uses it to imply Job has got what was coming to him'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'If that were all what Zophar is saying, it would be difficult to argue with. However, he is using this to imply that Job finally has gotten what has been coming to him and unless he repents, his future is grim.'
  - where: 'note 20:5 “The short triumph of the wicked”'
    claim: 'Job 21 refutes Zophar almost point by point, appealing to travelers'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'He refutes Zophar’s last argument almost point by point, finally appealing to the testimony of travelers, who have observed much of the world, that the wicked rarely experience calamity (see Job 21:29–30).'

  - where: 'note 20:12 “Sweet in the mouth, venom within”'
    claim: 'Zophar''s words in 20:12–22 have value for understanding sin and its consequences but do not apply to Job'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'While Zophar’s words (see Job 20:12-22) have value in understanding the nature of sin and its consequences, they do not apply to Job.'
  - where: 'note 20:12 “Sweet in the mouth, venom within”'
    claim: 'A modern translation of verses 13–14: loath to let it go; the venom of asps'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2020&version=NRSVUE'
    quote: 'though they are loath to let it go and hold it in their mouths, yet their food is turned in their stomachs; it is the venom of asps within them.'

  - where: 'note 20:19 “A charge with no evidence”'
    claim: 'Zophar portrays the covetous, uncompassionate rich man; in his mind Job is that man; the truth applied to Job becomes a lie'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/20.htm'
    quote: 'applied to him, the fearful truth becomes a fearful lie. For in Zophar''s mind Job is the godless man'
  - where: 'note 20:19 “A charge with no evidence”'
    claim: 'Verse 10 answers verse 19: the oppressor''s children must conciliate the poor he ruined and give back his property'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/20.htm'
    quote: 'Its retributive relation to Job 20:19 is also retained by this rendering. The children of the unfeeling oppressor of the poor will be obliged, when the tyrant is dead, to conciliate the destitute'
  - where: 'note 20:19 “A charge with no evidence”'
    claim: 'Zophar derives hypothetical problems from Job''s circumstances instead of addressing real ones'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'One of the problems for Zophar is that he takes Job’s circumstances and derives hypothetical problems rather than addressing real problems that he has seen.'
  - where: 'note 20:19 “A charge with no evidence”'
    claim: 'Job objects in 21:19 to the friends'' idea that God stores up iniquity for the sons (20:10; 18:15–19)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job takes particular exception to the friends’ idea that “God stores up [the iniquity of the wicked] for their sons” (Job 21:19, rsv; see also Job 20:10, 18:15–19), suggesting, instead, that God should properly recompense each person for his or her own deeds.'
  - where: 'note 20:19 “A charge with no evidence”'
    claim: 'Eliphaz later accuses Job of stripping the naked and withholding bread from the hungry (Job 22:5–9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/22?lang=eng'
    quote: 'For thou hast taken a pledge from thy brother for nought, and stripped the naked of their clothing.'

  - where: 'note 20:24 “A bow of bronze”'
    claim: 'The Hebrew word rendered "steel" is nehushah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'קֶ֣שֶׁת … נְחוּשָֽׁה'
  - where: 'note 20:24 “A bow of bronze”'
    claim: 'The word means bronze; the KJV "steel" reflects an older, broader English meaning that included hardened copper alloys'
    key: sc-knowhy-548
    url: 'https://scripturecentral.org/knowhy/why-did-nephis-fine-steel-bow-break'
    quote: 'The King James translation as steel reflects an older, broader range of meaning which included not only carburized iron (what we would call steel today) but also hardened copper alloys such as bronze.'
  - where: 'note 20:24 “A bow of bronze”'
    claim: 'The "bow of steel" was probably a composite bow bound or inlaid with bronze (said in full at Ps. 18:34)'
    key: sc-knowhy-548
    url: 'https://scripturecentral.org/knowhy/why-did-nephis-fine-steel-bow-break'
    quote: 'the bronze bow in biblical passages does not refer to a bow made entirely of metal, but instead, “probably refers to a composite bow, bound and/or inlaid with bronze.”'
  - where: 'note 20:24 “A bow of bronze”'
    claim: 'A modern translation reads "a bronze arrow"'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2020&version=NRSVUE'
    quote: 'They will flee from an iron weapon; a bronze arrow will strike them through.'

  - where: 'note 20:27 “Heaven and earth against him”'
    claim: 'Zophar attacks Job''s confidence in an advocate in heaven; he assumes the community''s voice on earth corresponds to God''s voice in heaven'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'He also attacks Job’s confidence in an advocate in heaven, saying that “the heavens will reveal [the wicked one’s] iniquity and the earth will rise up against him” (see Job 20:27, rsv). Implicit in this thought is the assumed correspondence between the voice of the crowd or community on earth and God’s voice in heaven.'
  - where: 'note 20:27 “Heaven and earth against him”'
    claim: 'The heavens where Job seeks his defender reveal his guilt; the earth he hoped would witness for him rises as accuser; Zophar seeks to stifle Job''s new trust'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/20.htm'
    quote: 'The heavens, where in his self-delusion he seeks the defender of his innocence, reveal his guilt, and the earth, which he hopes to have as a witness in his favour, rises up as his accuser. Thus mercilessly does Zophar seek to stifle the new trust which Job conceives towards God'
  - where: 'note 20:27 “Heaven and earth against him”'
    claim: 'Zophar''s appeal to heaven and earth answers Job''s calling them as witnesses in 16:18-19'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/20.htm'
    quote: 'It is not without reference to Job 16:18-19, where Job has called upon earth and heaven as witnesses, that in Job 20:27 Zophar continues'
  - where: 'note 20:27 “Heaven and earth against him”'
    claim: 'The fire "not blown" needs no human kindling: the "fire of God" of Job 1:16'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/20.htm'
    quote: 'A fire which needs no human help for its kindling and its maintenance is intended (comp. on לא ביד, Job 34:20); therefore "fire of God," Job 1:16.'

  - where: 'note 20:29 “Zophar’s last word”'
    claim: 'Zophar''s concluding point is later quoted by Job at 27:13, as if composing a speech for Zophar'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Zophar’s concluding point — “This is the wicked man’s portion from God, the heritage decreed for him by God” (Job 20:29 rsv) — will later be quoted by Job as he apparently composes a speech for Zophar (see Job 27:13).'

  - where: christ
    claim: 'Zophar has made himself Job''s judge, which brings to mind Jesus'' "judge not"'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Zophar has taken it upon himself to be Job’s judge, bringing to mind Jesus’s admonition to “judge not, that ye be not judged. For with what judgment ye judge, ye shall be judged” (Matthew 7:1–2).'
  - where: christ
    claim: 'The Lord will administer justice on the Day of Judgment'
    key: seminary-ot-teacher-108
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-108-job-17-37?lang=eng'
    quote: 'ultimately the Lord will administer justice on the Day of Judgment.'
  - where: christ
    claim: 'The Father has committed all judgment to the Son (John 5:22)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/5?lang=eng'
    quote: 'For the Father judgeth no man, but hath committed all judgment unto the Son'
