chapter: 28
claims:
  - where: setting
    claim: 'The headings at 27:1 and 29:1 are the same, “Job continued his parable,” and no other speaker is named between them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/29?lang=eng'
    quote: 'Moreover Job continued his parable, and said,'
  - where: setting
    claim: 'A Latter-day Saint reading takes chapter 28 as Job’s hymn to wisdom, granting the text does not make it explicit'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Although the text does not make it explicit, I consider chapter 28 to be Job’s hymn to wisdom.'
  - where: setting
    claim: 'In one older reading chapter 28 is the clasp uniting the two halves of the book, inscribed with the fear of God as the beginning of wisdom'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/28.htm'
    quote: 'this twenty-eighth chapter is the clasp which unites the half of the δέσις with the half of the λύσις, and that the poet has inscribed upon this clasp that sentence, "The fear of God is the beginning of wisdom."'
  - where: setting
    claim: 'In the same reading Job closes the dialogue with the friends by setting the fear of God before himself and them as man’s true wisdom'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/28.htm'
    quote: 'He humbly submits himself to the divine wisdom, by setting the fear of God, as man''s true wisdom, before himself and the friends as their common aim.'
  - where: setting
    claim: 'A Latter-day Saint reading places 28–31 as Job’s preparation to meet God, ending with his oaths'
    key: sc-knowhy-640
    url: 'https://scripturecentral.org/knowhy/how-can-the-book-of-job-teach-us-about-the-temple'
    quote: 'after which Job is prepared to meet God (Job 28–31). Part of Job’s preparation involved making oaths regarding his innocence'
  - where: setting
    claim: 'Job moves beyond dialogue with the friends and waits on God; in 28 he concludes wisdom must come from God'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job has moved beyond dialogue with the friends and waits, instead, on God. In chapter 28, Job will meditate on the nature of wisdom, concluding that it ultimately must come from God.'
  - where: 'note 28:28 “The fear of the Lord, that is wisdom”'
    claim: 'The fear of God as the beginning of wisdom is the motto of Israel’s wisdom (Prov. 1:7; Ps. 111:10)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/28.htm'
    quote: '"The fear of God is the beginning of wisdom" (Proverbs 1:7; comp. Psalm 111:10) is the symbolum, the motto and uppermost principle, of that Israelitish Chokma'
  - where: thread
    claim: 'The interior of the earth is a place no living creature of the surface reaches except man'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/28.htm'
    quote: 'such a place is the interior of the earth, accessible to no living being of the earth''s surface except to man alone.'
  - where: thread
    claim: 'No living creature can tell where wisdom is; in the realm of Abaddon and death it is known only by hearsay; only God knows it'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/28.htm'
    quote: 'in the realm of Abaddon and of death below … it is known only by an indistinct hearsay, and from confused impressions. Therefore: no creature, whether in the realm of the living or the dead, can help us to get wisdom.'
  - where: thread
    claim: 'Modern rendering of 28:22: “Abaddon and Death say, ‘We have heard a rumor of it’”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+28&version=NRSVUE'
    quote: 'Abaddon and Death say, ‘We have heard a rumor of it with our ears.’'
  - where: thread
    claim: 'When God made the world and set its laws, then He saw wisdom'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/28.htm'
    quote: 'When He thus created the world, and regulated what was created by laws, then He perceived … it, wisdom, viz., as the ideal of all things'
  - where: section 1 plain
    claim: 'Modern rendering of 28:1–11 (mine, copper smelted from ore, miners, shafts, swaying suspended, channels, sources of rivers)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+28&version=NRSVUE'
    quote: 'Miners put an end to darkness and search out to the farthest bound the ore in gloom and deep darkness. They open shafts in a valley away from human habitation; they are forgotten by travelers; they sway suspended, remote from people.'
  - where: section 1 plain
    claim: 'Verses 10–11: channels in the rocks; the sources of the rivers probed; hidden things brought to light'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+28&version=NRSVUE'
    quote: 'They cut out channels in the rocks, and their eyes see every precious thing. The sources of the rivers they probe; hidden things they bring to light.'
  - where: section 2 plain
    claim: 'Modern rendering of 28:13 and 28:18–19 (the way to it; coral and crystal; above pearls; chrysolite of Cush)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+28&version=NRSVUE'
    quote: 'Mortals do not know the way to it, and it is not found in the land of the living.'
  - where: section 3 plain
    claim: 'Modern rendering of 28:25–27: when He gave the wind its weight … then He saw it and declared it; He established it'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+28&version=NRSVUE'
    quote: 'When he gave to the wind its weight and apportioned out the waters by measure, when he made a decree for the rain, and a way for the thunderbolt, then he saw it and declared it; he established it and searched it out.'
  - where: 'note 28:1 “The mine”'
    claim: 'A modern translation renders verse 3 “Miners,” with the footnote that the Hebrew has “He puts”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+28&version=NRSVUE'
    quote: '3 Miners put an end to darkness … 28.3 Heb He puts'
  - where: 'note 28:1 “The mine”'
    claim: 'A modern translation gives verses 9–11 to the miners, “They”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+28&version=NRSVUE'
    quote: 'They put their hand to the flinty rock'
  - where: 'note 28:1 “The mine”'
    claim: 'A Latter-day Saint reading: the mining passage praises human ingenuity'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job praises human ingenuity, demonstrated by mining technology'
  - where: 'note 28:1 “The mine”'
    claim: 'A Latter-day Saint reading: the mining describes Job’s own experience, alone, in darkness, bringing hidden things to light, producing gold transformed by fire'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'human mining is analogous to Job’s recent experience, occurring in loneliness away from people, taking place in darkness on hidden paths, bringing hidden things to light, and producing gold and sapphires that have been transformed by fire.'
  - where: 'note 28:1 “The mine”'
    claim: 'Job’s earlier word about coming forth as gold suggests on that reading that he has gained wisdom'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job’s previous statement about coming forth as gold, after being tried by God (see Job 23:10–11), suggests that he has indeed gained wisdom.'
  - where: 'note 28:4 “Shafts and ropes”'
    claim: 'The word rendered “flood” (naḥal), like the Arabic wadi, means here the excavation in the earth, the perpendicular shaft'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/28.htm'
    quote: 'and the river itself, like the Arab. wâdin … signifies here the excavation made in the earth, and in fact, as what follows shows, in a perpendicular direction, therefore the shaft.'
  - where: 'note 28:4 “Shafts and ropes”'
    claim: 'Older translation of verse 4: the miners hang and swing far from men, forgotten by every foot'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/28.htm'
    quote: '4 He breaketh away a shaft from those who tarry above: … There, forgotten by every foot, … They hang and swing far from men.'
  - where: 'note 28:4 “Shafts and ropes”'
    claim: 'Seeing the shaft and the descent by rope in verse 4 is due to modern exegesis; earlier readers found it dark'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/28.htm'
    quote: 'Moreover, the perception that Job 28:4 speaks of the shaft of the mine, and the descent of the miners by a rope, is due to modern exegesis; even Schultens, who here exclaims: Cimmeriae tenebrae'
  - where: 'note 28:4 “Shafts and ropes”'
    claim: 'Among the interpreters of these verses were two men acquainted with mining'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/28.htm'
    quote: 'Among the expositors of this and the two following strophes, are two acquainted with mining: The director of mines, von Veltheim, … and the inspector of mines, Rudolf Nasse'
  - where: 'note 28:4 “Shafts and ropes”'
    claim: 'A modern translation of verse 4'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+28&version=NRSVUE'
    quote: 'They open shafts in a valley away from human habitation; they are forgotten by travelers; they sway suspended, remote from people.'
  - where: 'note 28:15 “Above rubies”'
    claim: 'A modern translation: “the price of wisdom is above pearls”; “chrysolite of Cush”; “coral or crystal”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+28&version=NRSVUE'
    quote: 'No mention shall be made of coral or of crystal; the price of wisdom is above pearls. 19 The chrysolite of Cush cannot compare with it'
  - where: 'note 28:15 “Above rubies”'
    claim: 'A Latter-day Saint reading: commerce in stones cannot buy wisdom; the dialogues are an analogue of commerce; the question is whether Job’s experiences produced wisdom'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job then moves on to consider human commerce in precious stones and metals, noting that none of these can purchase wisdom … Yet, the Dialogues can be understood as an analogue to human commerce. The question is whether Job’s experiences have produced true wisdom.'
  - where: 'note 28:27 “Wisdom at the creation”'
    claim: 'When God created the world and set its laws, He perceived wisdom as the ideal of all things, declared it by creating, and gave it its place'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/28.htm'
    quote: 'then He perceived … it, wisdom, viz., as the ideal of all things; then He declared it, enarravit, viz., by creating the world, which is the development and realization of its substance'
  - where: 'note 28:27 “Wisdom at the creation”'
    claim: 'The passage is to be compared with Proverbs 8:22–31; wisdom is the divine ideal of all things before creation'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/28.htm'
    quote: 'If we compare Proverbs 8:22-31 with this passage, we may say: the חכמה is the divine ideal-world, the divine imagination of all things before their creation'
  - where: 'note 28:27 “Wisdom at the creation”'
    claim: 'The Latter-day Saint reading is offered as an alternative to the surface reading that man, unable to find wisdom, can only fear God'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'I propose an alternative reading.'
  - where: 'note 28:27 “Wisdom at the creation”'
    claim: 'A Latter-day Saint reading: God alone understands the way to wisdom for man; the way is the creation of the earth, where man answering God’s questions learns wisdom'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'God alone understands the way to wisdom — for man. The way is to create earth for man, whereupon God can then share His existential questions … Man, by responding well to these existential questions participates with God in the creative process and learns wisdom.'
  - where: 'note 28:27 “Wisdom at the creation”'
    claim: 'On that reading Job, seeking God with fidelity, is coming forth as gold'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job has sought God with fidelity, and his response has been creative, departing entirely from the conventional religious thinking of the crowd. Job is coming forth as gold'
  - where: 'note 28:27 “Wisdom at the creation”'
    claim: 'Proverbs 8:22 and the site’s note there on Wisdom and Christ (scripture)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/8?lang=eng'
    quote: 'The Lord possessed me in the beginning of his way, before his works of old.'
  - where: 'note 28:28 “The fear of the Lord, that is wisdom”'
    claim: 'Fearing the Lord and departing from evil is man’s share of wisdom, his relative wisdom, linking him with the absolute'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/28.htm'
    quote: 'and renouncing evil … - this is man''s share of wisdom, this is his relative wisdom, by which he remains in connection with the absolute.'
  - where: 'note 28:28 “The fear of the Lord, that is wisdom”'
    claim: '“The Lord” here is ʾAdonai, written so only here in Job'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/28.htm'
    quote: 'Fearing the supreme Lord (אדני) only here in the book of Job, one of the 134 ודאין, i.e., passages, where אדני is not merely to be read instead of יהוה, but is actually written'
  - where: 'note 28:28 “The fear of the Lord, that is wisdom”'
    claim: 'The Hebrew of 28:28 has ʾAdonai and sûr mērāʿ, “depart from evil”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: '<w lemma="136" n="1.0" morph="HNcmpc/Sp1cs" id="18TnS">אֲ֭דֹנָ/י</w> … <w lemma="c/5493" morph="HC/Vqc" id="18tkF">וְ/ס֖וּר</w> <w lemma="m/7451 b" morph="HR/Aamsa" id="18xeK">מֵ/רָ֣ע</w>'
  - where: 'note 28:28 “The fear of the Lord, that is wisdom”'
    claim: 'Job 1:1’s “eschewed evil” is the same verb (lemma 5493) with mērāʿ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: '<verse osisID="Job.1.1"> … <w lemma="c/5493" morph="HC/Vqrmsa" id="18EVS">וְ/סָ֥ר</w>'
  - where: 'note 28:28 “The fear of the Lord, that is wisdom”'
    claim: 'Job 1:1, 1:8 and 2:3 describe Job as one who feared God and eschewed evil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/1?lang=eng'
    quote: 'that man was perfect and upright, and one that feared God, and eschewed evil.'
  - where: 'note 28:28 “The fear of the Lord, that is wisdom”'
    claim: 'In one older reading Job, unable to see through the mystery of his affliction, must still hold to the fear of God, and teaches the friends to do the same rather than wrong him to solve the mystery'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/28.htm'
    quote: 'though unable to see through the mystery of his affliction, he must still hold on to the fear of God, and teaches the friends that they must do the same, and not lay themselves open to the charge of injustice and uncharitableness towards him, the suffering one, in order to solve the mystery.'
  - where: christ
    claim: 'In one older reading wisdom is the pattern and the Logos the master-builder who made the world after it; the New Testament made this clearer'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/28.htm'
    quote: 'Wisdom is the impersonal model, the Logos the personal master-builder according to that model. Nevertheless the notions … are not as yet so distinct as the New Testament revelation of God has first of all rendered possible.'
  - where: christ
    claim: 'John says of the Word that all things were made by Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/1?lang=eng'
    quote: 'All things were made by him'
  - where: christ
    claim: 'The book of Job never answers why the righteous suffer; Job learns to trust God rather than his own understanding'
    key: renlund-trust-god
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/08/03_trust-god-and-let-him-prevail?lang=eng'
    quote: 'The book of Job addresses the question but never answers the why. Job learns that trusting God and not relying on his own understanding is the way to approach difficulties in life.'
  - where: christ
    claim: 'Holding to the fear of God without seeing through the mystery of affliction'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/28.htm'
    quote: 'he must still hold on to the fear of God'
  - where: section 1 plain
    claim: 'Verse 11: the Hebrew says he restricts the rivers and streams'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/28?lang=eng'
    quote: '11a “He”: HEB He restricts the rivers and streams.'
  - where: section 2 plain
    claim: 'Verse 18: the price of wisdom is above pearls'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+28&version=NRSVUE'
    quote: 'the price of wisdom is above pearls. 19 The chrysolite of Cush cannot compare with it'
  - where: 'note 28:15 “Above rubies”'
    claim: 'A modern translation offers “lapis lazuli” for “sapphire” at 28:16'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+28&version=NRSVUE'
    quote: '28.16 Or lapis lazuli'
