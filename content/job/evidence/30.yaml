chapter: 30
claims:
  - where: setting
    claim: 'Chapter 29: Job recalls his former prosperity, blessed for his righteousness and charity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/29?lang=eng'
    quote: 'Job recalls his former prosperity and greatness—He was blessed because of his righteousness, his charity, and his good deeds.'
  - where: setting
    claim: 'Chapter 30''s heading: derided by base men, cries to the Lord, wept for those in trouble'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/30?lang=eng'
    quote: 'Job is derided by the children of vile and base men—In his afflicted state, he cries to the Lord—Job says that he wept for those in trouble.'
  - where: setting
    claim: 'Chapter 31: Job invites judgment so that God may know his integrity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/31?lang=eng'
    quote: 'Job invites judgment so that God may know his integrity—If he has done ill, Job welcomes the penalties for so doing.'
  - where: setting
    claim: 'Chapter 29 describes Job''s life before his fall; chapter 30 inverts it'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job, now cut off from dialogue with the community, reflects on his life. Chapter 29 gives the fullest description of Job’s life before his “fall.”'
  - where: setting
    claim: 'Job once sat as chief; now the young deride him'
    key: farley-job-parallels
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/10/job-parallels-with-the-savior?lang=eng'
    quote: 'Whereas before he said “I chose out their way, and sat chief, and dwelt as a king in the army, as one that comforteth the mourners” (Job 29:25), now he says, “But now they that are younger than I have me in derision” (Job 30:1).'

  - where: thread
    claim: 'Chapter 30 inverts chapter 29; Job blames God one moment and the crowd the next'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Now, all of this has been inverted (see Job 30). … As before, Job attributes his troubles at one moment to God (see Job 30:11, 19–23) and, at the next, to the crowd (see Job 30:9–10, 12–15).'
  - where: thread
    claim: 'The chapter falls into four stanzas: 1–8, 9–15, 16–23, 24–31'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+30&version=NRSVUE'
    quote: '30 “But now they make sport of me, … 9 “And now they mock me in song; … 16 “And now my soul is poured out within me; … 24 “Surely one does not turn against the needy,'
  - where: thread
    claim: 'Job keeps crying out to God and in the assembly though he expects death'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Although Job assumes an impending death at “God’s hand,” Job continues to cry out to God for help (see Job 30:20), supplementing this by cries for help in the assembly (see Job 30:28).'

  - where: section 1 plain
    claim: 'Verses 1–8 in a modern translation: gnaw the dry ground, mallow, roots of broom, shouted after as a thief, gullies of wadis, driven out of the land'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+30&version=NRSVUE'
    quote: '3 Through want and hard hunger they gnaw the dry and desolate ground; 4 they pick mallow and the leaves of bushes and to warm themselves the roots of broom. 5 They are driven out from society; … 8 A senseless, disreputable brood, they have been whipped out of the land.'
  - where: 'note 30:1 “The men who laugh at him”'
    claim: 'One older reading: the broom root is the outcasts'' bread'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/30.htm'
    quote: 'The poor in search of the purslain surround this Arab. šı̂ḥ (shı̂h), and as Job 30:4 continues: the broom-root is their bread.'
  - where: section 2 plain
    claim: 'Verses 11–14 in a modern translation: God has loosed my bowstring; the rabble; as through a wide breach'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+30&version=NRSVUE'
    quote: '11 Because God has loosed my bowstring and humbled me, they have cast off restraint in my presence.(D) 12 On my right hand the rabble rise up; … 14 As through a wide breach they come; amid the crash they roll on.'
  - where: section 3 plain
    claim: 'Verses 17, 20, 22 in a modern translation: the pain that gnaws me; you merely look at me; the roar of the storm'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+30&version=NRSVUE'
    quote: '17 The night racks my bones, and the pain that gnaws me takes no rest. … 20 I cry to you, and you do not answer me; I stand, and you merely look at me. … and you toss me about in the roar of the storm.'
  - where: section 3 plain
    claim: 'The Hebrew of 30:20 says answer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/30?lang=eng'
    quote: '20a “hear”: HEB answer.'
  - where: section 4 plain
    claim: 'Verses 24–31 in a modern translation: the needy cry for help; come to meet me; sunless gloom; skin falls from me; pipe'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+30&version=NRSVUE'
    quote: '27 My inward parts are in turmoil and are never still; days of affliction come to meet me. 28 I go about in sunless gloom; … 30 My skin turns black and falls from me, and my bones burn with heat. 31 My lyre is turned to mourning and my pipe'
  - where: section 4 plain
    claim: 'Verse 24 in a modern translation, its meaning uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+30&version=NRSVUE'
    quote: '24 “Surely one does not turn against the needy, when in disaster they cry for help.(M) … 30.24 Cn: Meaning of Heb uncertain'

  - where: 'note 30:1 “The men who laugh at him”'
    claim: 'Job scorned the fathers as unfit even for the menial service of the shepherd dogs'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/30.htm'
    quote: 'sons of those fathers who were so useless and abandoned that he scorned … to entrust to them even a service so menial as that of the shepherd dogs'
  - where: 'note 30:1 “The men who laugh at him”'
    claim: 'Verse 4 describes the scanty food of the desert, gathered and eaten by the poor'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/30.htm'
    quote: 'Job 30:4 tells what the scanty nourishment is which the chill, desolate, and gloomy desert, with its steppes and gorges, furnishes them. … the buds and young leaves of which are gathered and eaten by the poor.'
  - where: 'note 30:1 “The men who laugh at him”'
    claim: 'A modern translation: driven out from society, shouted after as after a thief'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+30&version=NRSVUE'
    quote: '5 They are driven out from society; people shout after them as after a thief.'
  - where: 'note 30:1 “The men who laugh at him”'
    claim: 'In ch. 29 Job was a royal model and champion of the poor'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job served as champion for the poor, sick, and powerless, with men waiting for Job’s counsel “as for the rain” (Job 29:23).'
  - where: 'note 30:1 “The men who laugh at him”'
    claim: 'The lowest of society, whom Job admits he disdained, mock him; he is marked as a sinner and made a scapegoat; he may not yet discern favor with God from favor with men'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Even the lowest stratum of society, which Job now admits to having once disdained, mocks and spits at Job (see Job 30:1–10). Having been ostensibly marked as a sinner by his calamitous suffering, Job is now clearly a scapegoat for the crowd.'
  - where: 'note 30:1 “The men who laugh at him”'
    claim: 'Job may not yet distinguish favor with God from favor with men; he takes prosperity as evidence of God''s presence'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'perhaps he does not yet fully discern the difference between favor in the eyes of God and favor in the eyes of men. He still sees his previous material prosperity and high societal rank as evidence of the presence of God in his life'

  - where: 'note 30:10 “Abhorred and spit upon”'
    claim: 'Stirling: Job a type of Christ; his bitter experiences correspond to Christ''s bitter cup; abhorred and spit at, forsaken, brought to death (30:9–23)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job’s bitter experiences correspond significantly to Christ drinking the bitter cup (see Matthew 26:36–39, D&C 19:16–18) after His triumphal entry into Jerusalem. Job speaks of being seized by violence, … being abhorred and spit at by the crowd, being forsaken by God, and being brought to death (see Job 30:9–23).'
  - where: 'note 30:10 “Abhorred and spit upon”'
    claim: 'Stirling: many have rightly considered Job a type of Christ'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'many have rightly considered Job to be a type of Christ.'
  - where: 'note 30:10 “Abhorred and spit upon”'
    claim: 'Farley: the Savior, king in the premortal existence, lost all status and was held in derision by those unworthy of his presence'
    key: farley-job-parallels
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/10/job-parallels-with-the-savior?lang=eng'
    quote: 'Similarly, in the premortal existence the Savior was king, the Creator of the earth, but when he condescended to be born upon the earth, he (in a sense like Job) lost all prior status; the time came that he was held “in derision” by those unworthy of his presence.'

  - where: 'note 30:10 “Abhorred and spit upon”'
    claim: 'Job once dwelt as a king; now held in derision'
    key: farley-job-parallels
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/10/job-parallels-with-the-savior?lang=eng'
    quote: 'Whereas before he said “I chose out their way, and sat chief, and dwelt as a king in the army, as one that comforteth the mourners” (Job 29:25), now he says, “But now they that are younger than I have me in derision” (Job 30:1).'
  - where: 'note 30:10 “Abhorred and spit upon”'
    claim: 'Stirling: Job was not without sin, admitting youthful iniquities'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Although Job was not without sin, admitting to youthful iniquities (see Job 13:26), many have rightly considered Job to be a type of Christ.'

  - where: 'note 30:11 “An unstrung bow”'
    claim: 'The Hebrew of 30:11 has a written (ketiv) and a read (qere) form: his cord / my cord'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'יִתְרִ֣/י'
  - where: 'note 30:11 “An unstrung bow”'
    claim: 'BDB: yeter is a cord, a bowstring; at 30:11 by the qere a bowstring, set against 29:20b; the ketiv his cord, with which he reins in Job''s assailants'
    key: bdb
    url: 'https://biblehub.com/hebrew/3499.htm'
    quote: 'cord, for binding a man Judges 16:7,8,9; bowstring Psalm 11:2; Job 30:11 (according to Qr, opposed to Job 29:20 b; Kt = his cord, with which he reins in my assailants; compare Di Da).'
  - where: 'note 30:11 “An unstrung bow”'
    claim: 'The footnote reads “he” as God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/30?lang=eng'
    quote: '11a “he”: OR God.'
  - where: 'note 30:11 “An unstrung bow”'
    claim: 'A modern translation: God has loosed my bowstring; they have cast off restraint'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+30&version=NRSVUE'
    quote: '11 Because God has loosed my bowstring and humbled me, they have cast off restraint in my presence.'

  - where: 'note 30:19 “Dust and ashes”'
    claim: 'Job sees himself reduced to dust and ashes; the phrase is critical for his answer to God; Abraham used it of mortal man; man arises from dust and in death is reduced to ashes'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job perceives himself as being “reduced to dust and ashes” (see Job 30:19, niv). This highly significant phrase will be critical in understanding Job’s response to God at the veil. … Abraham used “dust and ashes” to refer to mortal man in general (see Genesis 18:25–27). Man arises from dust and, in death, is reduced to ashes.'
  - where: 'note 30:19 “Dust and ashes”'
    claim: 'Job sat among the ashes (2:8); Abraham, “dust and ashes” (Gen. 18:27)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/18?lang=eng'
    quote: 'Behold now, I have taken upon me to speak unto the Lord, which am but dust and ashes'

  - where: 'note 30:20 “No answer”'
    claim: 'The Hebrew of “hear” in 30:20 is answer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/30?lang=eng'
    quote: '20a “hear”: HEB answer.'
  - where: 'note 30:20 “No answer”'
    claim: 'A modern translation: you do not answer me; you merely look at me; you have turned cruel'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+30&version=NRSVUE'
    quote: '20 I cry to you, and you do not answer me; I stand, and you merely look at me.(I) 21 You have turned cruel to me; with the might of your hand you persecute me.'
  - where: 'note 30:20 “No answer”'
    claim: 'Though Job assumes death at God''s hand, he keeps crying to God for help, and in the assembly'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Although Job assumes an impending death at “God’s hand,” Job continues to cry out to God for help (see Job 30:20), supplementing this by cries for help in the assembly (see Job 30:28).'
  - where: 'note 30:20 “No answer”'
    claim: 'The LORD answers Job out of the whirlwind (38:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/38?lang=eng'
    quote: 'Then the Lord answered Job out of the whirlwind, and said,'

  - where: 'note 30:25 “I wept for him that was in trouble”'
    claim: 'Verse 24 is uncertain in the Hebrew; a modern translation and its note'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+30&version=NRSVUE'
    quote: '24 “Surely one does not turn against the needy, when in disaster they cry for help.(M) 25 Did I not weep for those whose day was hard? … 30.24 Cn: Meaning of Heb uncertain'
  - where: 'note 30:25 “I wept for him that was in trouble”'
    claim: 'The ancient versions made strange things of 30:24'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/30.htm'
    quote: 'Most of the ancient versions indulge themselves in strange fancies respecting Job 30:24 to make a translatable text, or find their fancies in the text before them.'
  - where: 'note 30:25 “I wept for him that was in trouble”'
    claim: 'One older reading: the sympathy Job felt for others he may now seek for himself; he who felt for others may cry for help in his own ruin'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/30.htm'
    quote: 'The manifestation of feeling - Job means to say - which he himself felt at the misfortune of others, will be still permitted to him in his own misfortune, the seeking of compassion from the sympathising'
  - where: 'note 30:25 “I wept for him that was in trouble”'
    claim: 'The heading of chapter 29 names Job''s charity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/29?lang=eng'
    quote: 'He was blessed because of his righteousness, his charity, and his good deeds.'

  - where: 'note 30:29 “Jackals and ostriches”'
    claim: 'The Hebrew of “owls” is ostriches'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/30?lang=eng'
    quote: '29a “owls”: HEB ostriches.'
  - where: 'note 30:29 “Jackals and ostriches”'
    claim: 'The words of 30:29: tannim, bĕnôt yaʿănāh'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'לְ/תַנִּ֑ים … לִ/בְנ֥וֹת … יַעֲנָֽה'
  - where: 'note 30:29 “Jackals and ostriches”'
    claim: 'BDB: tan is the jackal, howling mournfully in waste places, Micah 1:8 and Job 30:29, both paired with the ostrich'
    key: bdb
    url: 'https://biblehub.com/hebrew/8565.htm'
    quote: 'jackal, howling mournfully in waste places, Micah 1:8; Job 30:29 (both "" בְּנוֺת יַעֲנָה), Isaiah 13:22'
  - where: 'note 30:29 “Jackals and ostriches”'
    claim: 'BDB: the ostrich, wailing as a simile of mourning (Mic. 1:8), symbolic of loneliness (Job 30:29), dwelling among ruins'
    key: bdb
    url: 'https://biblehub.com/hebrew/3284.htm'
    quote: 'ostrich, (see √ יען above); as wailing (simile of mourning) Micah 1:8 ("" תַּנִּים); symbolic of loneliness Job 30:29'
  - where: 'note 30:29 “Jackals and ostriches”'
    claim: 'Micah 1:8: wailing like the dragons, mourning as the owls'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/1?lang=eng'
    quote: 'I will make a wailing like the dragons, and mourning as the owls.'
  - where: 'note 30:29 “Jackals and ostriches”'
    claim: 'A modern translation: brother of jackals, companion of ostriches; lyre and pipe'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+30&version=NRSVUE'
    quote: '29 I am a brother of jackals and a companion of ostriches.(Q) 30 My skin turns black and falls from me, and my bones burn with heat.(R) 31 My lyre is turned to mourning and my pipe to the voice of those who weep.'

  - where: christ
    claim: 'Stirling: Job abhorred and spit at, forsaken, brought to death, corresponds to Christ''s bitter cup'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job speaks of being seized by violence, suddenly losing his prosperity, having a heart in turmoil, being abhorred and spit at by the crowd, being forsaken by God, and being brought to death (see Job 30:9–23).'
  - where: christ
    claim: 'The Son of Man descended below them all'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/122?lang=eng'
    quote: 'The Son of Man hath descended below them all. Art thou greater than he?'
  - where: christ
    claim: 'Uchtdorf: unworthy of Christians to think sufferers deserve it; the Savior took on the suffering of all, even those who appear to deserve it'
    key: uchtdorf-you-are-my-hands
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2010/04/you-are-my-hands?lang=eng'
    quote: 'It is unworthy of us as Christians to think that those who suffer deserve their suffering. Easter Sunday is a good day to remember that our Savior willingly took upon Himself the pain and sickness and suffering of us all—even those of us who appear to deserve our suffering.'

  - where: explore
    claim: 'Stirling''s parallel names Matt. 26:36–39 and D&C 19:16–18'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job’s bitter experiences correspond significantly to Christ drinking the bitter cup (see Matthew 26:36–39, D&C 19:16–18)'
  - where: explore
    claim: 'Micah 1:8 pairs jackals and ostriches in mourning'
    key: bdb
    url: 'https://biblehub.com/hebrew/3284.htm'
    quote: 'as wailing (simile of mourning) Micah 1:8 ("" תַּנִּים)'
