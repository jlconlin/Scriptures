chapter: 5
claims:
  - where: setting
    claim: 'Eliphaz, first of the friends, speaks in chapters 4–5 and remonstrates gently, reminding Job he had strengthened others'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Eliphaz, the first of the friends to speak (see Job 4–5), remonstrates gently with Job, reminding him that Job himself had previously counseled and strengthened those in similar circumstances (see Job 4:1-6).'
  - where: setting
    claim: 'Much of what Eliphaz says is true in itself (one older reading)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/5.htm'
    quote: 'All that Eliphaz says, considered in itself, is blameless.'
  - where: setting
    claim: 'The reader knows from the prologue that neither Job nor his children suffer for wrongdoing'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'the narrative itself makes Eliphaz’s position untenable since we as readers know that neither Job nor his children are suffering for anything they have done wrong.'
  - where: setting
    claim: 'The Papers’ editors list chapters 4–5 among the speeches that charged Job with transgression (note to D&C 121:10’s source)'
    key: jsp-letter-1839-03-20
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-and-edward-partridge-20-march-1839/8'
    quote: 'thou art not yet as Job thy friends do not contend against thee neither charge thee with transgretion as they did Job39 … 39: See Job chaps. 4–5, 8, 11, 15, 18, 20, 22, 25, 32–37.'
  - where: thread
    claim: 'Chapter 5 contrasts those who do not trust in God (1–7) with those who do (8–27)'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'This is the continuation of Eliphaz’s first reply to Job. He contrasts those who do not trust in God (verses 1–7) with those who do (verses 8–27).'
  - where: thread
    claim: 'The speech turns persuasive at verse 17 and the promises rise; verse 27 concludes it'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/5.htm'
    quote: 'The speech of Eliphaz now becomes persuasive as it turns towards the conclusion. … The promises of Eliphaz now continue to rise higher, and sound more delightful and more glorious.'
  - where: section 1 plain
    claim: 'Verse 4: the gate as the court of justice'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/5.htm'
    quote: 'I had then, since his discontent had brought on his destruction, suddenly to mark and abhor his habitation as one overtaken by a curse … שׁער is the gate of the city as a court of justice'
  - where: section 3 plain
    claim: 'Verse 24: examining his household he lacks nothing; verse 26: ripe old age, sheaves brought in at the last of harvest'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/5.htm'
    quote: 'And when thou examinest thy household, then thou lackest nothing, goest not astray … it signifies the maturity of old age'
  - where: 'note 5:26 “Eliphaz’s promises”'
    claim: 'One older reading of verse 24: examining his household he lacks nothing'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/5.htm'
    quote: 'And when thou examinest thy household, then thou lackest nothing, goest not astray … it signifies the maturity of old age'
  - where: 'note 5:1 “The holy ones”'
    claim: 'The Hebrew “holy ones” of Job 5:1 means angels, as in Job 15:15 and Psalm 89'
    key: bdb
    url: 'https://biblehub.com/hebrew/6918.htm'
    quote: 'c. angels, Psalm 89:6; Psalm 89:8; Job 5:1; Job 15:15; Zechariah 14:5; Daniel 8:13 (twice in verse).'
  - where: 'note 5:1 “The holy ones”'
    claim: 'The saints of 5:1 are probably the members of the divine council (Job 1:6)'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Eliphaz asks Job, “To which of the saints wilt thou turn?” This probably refers to the members of the divine council (Job 1:6). Eliphaz suggests that only the foolish would rely on someone other than God Himself.'
  - where: 'note 5:4 “The fool’s children”'
    claim: 'The gate of the city was its court of justice; God’s curse on the fool falls on his children and property'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/5.htm'
    quote: 'the cursing is a recognition of the divine curse, as the echo of which it is intended. This curse of God manifests itself also on his children and his property (Job 5:4.). שׁער is the gate of the city as a court of justice'
  - where: 'note 5:4 “The fool’s children”'
    claim: 'Eliphaz either implies Job’s children suffered for Job’s sins or is speaking in general'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Eliphaz either is implying Job’s children have suffered because of Job’s sins or isn’t taking Job’s situation into consideration and is instead making general remarks.'
  - where: 'note 5:4 “The fool’s children”'
    claim: 'For Job, whose children had just perished, Eliphaz’s words could imply they got what they deserved'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'However, for Job, whose children just perished, it could imply that they got what they deserved.'
  - where: 'note 5:4 “The fool’s children”'
    claim: 'Bildad assumes Job’s children were punished for their sins (8:4)'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Bildad assumes that Job’s children have been punished for their sins but believes that there is still time for Job to pray and be restored to favor (verses 4–7).'
  - where: 'note 5:7 “Born unto trouble”'
    claim: 'Misfortune does not grow from the ground like weeds but is established in the divine order, as sparks ascend; wisdom is accommodating oneself to one’s lot'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/5.htm'
    quote: 'so that his wisdom consequently consists in accommodating himself to his lot … Misfortune does not grow out of the ground like weeds; it is rather established in the divine order of the world, as it is established in the order of nature that sparks of fire should ascend.'
  - where: 'note 5:7 “Born unto trouble”'
    claim: '“Children of the flame” is a fitting name for sparks; the verse symbolizes a moral truth by an ordinary thing'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/5.htm'
    quote: 'Children of the flame is an appropriate name for sparks … the sententious character of Job 5:7, which symbolizes a moral truth by an ordinary thing.'
  - where: 'note 5:7 “Born unto trouble”'
    claim: 'Rešep means flame; bĕnê rešep in Job 5:7 are sparks'
    key: bdb
    url: 'https://biblehub.com/hebrew/7565.htm'
    quote: 'I. רֶ֫שֶׁף noun masculineHabakkuk 3:5 flame, fire-bolt … ׳בְּנֵי ר Job 5:7 = sparks'
  - where: 'note 5:13 “Taken in their own craftiness”'
    claim: 'Paul quotes the line as scripture'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/3?lang=eng'
    quote: 'For the wisdom of this world is foolishness with God. For it is written, He taketh the wise in their own craftiness.'
  - where: 'note 5:13 “Taken in their own craftiness”'
    claim: 'Joseph Smith’s Liberty Jail letter applies the phrase to those who charge him with transgression; the editors point it to Job 5:13'
    key: jsp-letter-1839-03-20
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-and-edward-partridge-20-march-1839/8'
    quote: 'they who do charge thee with transgretion40 there hope shall be blasted … that he may prove them also and take them in there own craftiness43 … 43: See Job 5:13.'
  - where: 'note 5:17 “The chastening of God”'
    claim: 'Job 5:17–18 is a partial quote or paraphrase of Proverbs 3:11–12; the friends mix human wisdom with scripture'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'This text is a partial quote/partial paraphrase of Proverbs 3:11–12. Thus the friends — ministers of conventional religion — use the wisdom and understanding of men mixed with scripture'
  - where: 'note 5:17 “The chastening of God”'
    claim: 'Eliphaz’s counsel is sage advice for a sinner, but does not apply to Job; following it would breach his integrity'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'This is sage advice for any sinner. However, the reader knows from the Prologue that it does not apply to Job, and that for Job to follow Eliphaz’s advice would breach his integrity.'
  - where: 'note 5:17 “The chastening of God”'
    claim: 'What has happened to Job is not God’s correction or chastening'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'In this sense, what has happened to Job is not God’s correction or chastening.'
  - where: 'note 5:17 “The chastening of God”'
    claim: 'Hebrews 12:5 quotes the exhortation to the Saints as to children'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/12?lang=eng'
    quote: 'And ye have forgotten the exhortation which speaketh unto you as unto children, My son, despise not thou the chastening of the Lord, nor faint when thou art rebuked of him:'
  - where: 'note 5:17 “Shaddai, the Almighty”'
    claim: 'Shaddai: etymology dubious (self-sufficient, almighty, other proposals); Greek παντοκράτωρ; the patriarchs’ name El Shaddai; used as an archaism in poetry, and especially in Job from 5:17'
    key: bdb
    url: 'https://biblehub.com/hebrew/7706.htm'
    quote: 'שַׁדַּי48 noun masculine, of deity (etymology dubious … compare ᵐ5 παντοκράτωρ14(15) t. … and so as archaism Ruth 1:20,21; Psalm 68:15; Psalm 91:1 … especially Job 5:17 + 30:t. Job … divine name of patriarchs in P, Genesis 17:1'
  - where: 'note 5:26 “Eliphaz’s promises”'
    claim: 'The number-proverb form of 5:19 (Prov. 6:16): in six troubles, yea in more than six'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/5.htm'
    quote: 'Job 5:19 is formed after the manner of the so-called number-proverbs (Proverbs 6:16; Proverbs 30:15, Proverbs 30:18) … in six troubles, yea in still more than six.'
  - where: 'note 5:26 “Eliphaz’s promises”'
    claim: 'In 5:23 the stones do not injure the fields nor the beasts the herds; Hosea’s last-days promise used individually'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/5.htm'
    quote: 'The whole of nature will be at peace with thee: the stones of the field, that they do not injure the fertility of thy fields; the wild beasts of the field, that they do not hurt thee and thy herds. The same promise that Hosea (Hosea 2:20) utters in reference to the last days is here used individually.'
  - where: 'note 5:26 “Eliphaz’s promises”'
    claim: 'The full age is the maturity of old age; the shock is a heap of sheaves raised to the threshing floor at the latest period of harvest'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/5.htm'
    quote: 'In the parallel there is the time of the sheaves, when they are brought up to the high threshing-floor, the latest period of harvest. … גּדישׁ is here a heap of sheaves'
  - where: 'note 5:26 “Eliphaz’s promises”'
    claim: 'Eliphaz is certain the righteous will be delivered from famine, war and destruction and die peaceably in old age'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'in general Eliphaz remains certain that if you live righteously, the Lord will deliver you from famine, war, and destruction, and you will die peaceably of old age'
  - where: 'note 5:27 “We have searched it”'
    claim: 'The friends represent conventional religion and tradition, relying on their own experience (5:27)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'The friends will continue to represent conventional religion and the wisdom of tradition, relying on their own experience (see Job 5:27) and the words of the elders (see Job 15:9–12), as Job once had.'
  - where: 'note 5:27 “We have searched it”'
    claim: 'The counsels rest on human reason, hearsay, not revelation, as 5:27 shows'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'they are counsels based on human reason about suffering in general—upon hearsay, as it were—not upon revelation about Job’s particular predicament. This is clear when Eliphaz proudly discloses the source of his knowledge as he concludes his counsel'
  - where: 'note 5:27 “We have searched it”'
    claim: 'Eliphaz momentarily grants that God’s judgment is unsearchable (5:9), yet remains certain'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'Although the Temanite momentarily entertains the possibility that the Lord’s judgment may not be so easy to read, for the Lord “doeth great things and unsearchable” (Job 5:9), in general Eliphaz remains certain'
  - where: christ
    claim: 'Christ was sinless yet suffered; His righteousness did not shield Him; the Father teaches us in all afflictions whatever their cause'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Jesus’s righteousness did not shield him from suffering. In fact, his suffering often came because he was righteous … Our Heavenly Father is willing to teach us during all our afflictions, regardless of the reason they happen.'
  - where: 'note 5:27 “We have searched it”'
    claim: 'Eliphaz seems to speak for all the comforters at 5:27'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'This is clear when Eliphaz proudly discloses the source of his knowledge as he concludes his counsel, seeming to speak for all the comforters: “Lo this, we have searched it, so it is; hear it, and know thou it for thy good” (Job 5:27).'
