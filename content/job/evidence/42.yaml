chapter: 42
claims:
  - where: setting
    claim: 'In 38:1–42:6 the Lord questions Job, and Job humbly submits to the Lord and His judgments'
    key: seminary-intro-job
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job?lang=eng'
    quote: 'Job 38:1–42:6 The Lord appears and asks Job many questions, leading Job to consider the ultimate power and superiority of God. … Job humbly submits to the Lord and His judgments.'
  - where: setting
    claim: 'Chapter 42 is a brief epilogue: the Lord blesses Job with double possessions, the same number of children, and a long and full life'
    key: scripture-helps-job
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/31-job-1-3-12-14-19-21-24-38-40-42?lang=eng'
    quote: 'Job 42: In a brief epilogue, the Lord blesses Job for his faithfulness. He grants Job double the possessions he lost, allows him to have the same number of children as before, and restores him to his former status. Job lives a long and full life.'
  - where: setting
    claim: 'The prologue and 42:7–17 are prose, the rest of the book poetry'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'I find it significant that the Prologue is composed in prose and will later make the case that the other two prose sections of Job (32:1–5 and 42:7-17) are also this-worldly analogues'

  - where: thread
    claim: 'The brothers and sisters of 42:11 are those of 19:13 who had kept their distance (the cross-reference)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+42&version=NRSVUE'
    quote: '42.11 : Job 19.13'

  - where: section 1 plain
    claim: 'Verses 3a and 4 are the LORD''s words repeated, set in quotation marks'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+42&version=NRSVUE'
    quote: '3 ‘Who is this that hides counsel without knowledge?’ … 4 ‘Hear, and I will speak; I will question you, and you declare to me.’'

  - where: 'note 42:3 “Job answers in the LORD''s own words”'
    claim: 'A modern translation sets 42:3a and 42:4 in quotation marks, and cross-refers them to 38:2, 38:3 and 40:7'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+42&version=NRSVUE'
    quote: '42.3 : Job 38.2; Ps 40.5; 131.1; 139.6 … 42.4 : Job 38.3; 40.7'
  - where: 'note 42:3 “Job answers in the LORD''s own words”'
    claim: 'The friends'' arguments wrung “words without knowledge” from Job, which he retracts at 42:3'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'Their suggestions wring from him “words without knowledge” (38:2), which he afterwards retracts (42:3)'
  - where: 'note 42:3 “Job answers in the LORD''s own words”'
    claim: 'Job quotes the LORD (42:3a = 38:2; 42:4b = 38:3b, 40:7b), making God''s words his own after forty-one chapters of disagreement'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job is quoting or closely paraphrasing actual words of God from God’s first and second speeches (42:3a = 38:2; 42:4b = 38:3b & 40:7b). Job thus repeats or takes up words of the Lord, making them his own and coming to confessional unity with the Lord.'
  - where: 'note 42:3 “Job answers in the LORD''s own words”'
    claim: 'The text of 38:2, 38:3 and 40:7 read beside 42:3–4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/42?lang=eng'
    quote: 'Who is he that hideth counsel without knowledge? therefore have I uttered that I understood not; things too wonderful for me, which I knew not.'

  - where: 'note 42:5 “Heard of, and now seen”'
    claim: 'Job''s craving for light is satisfied by the vision of God (42:5)'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'His own craving for light is satisfied by the vision of God, at length vouchsafed in answer to his appeals. “I have heard of thee by the hearing of the ear: but now mine eye seeth thee” (42:5).'
  - where: 'note 42:5 “Heard of, and now seen”'
    claim: 'The Student Manual (quoting Meservy): in some way inexplicable to us Job understood more through a “seeing” experience, and afterward accepted what had happened without questioning'
    key: ot-manual-job
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-3?lang=eng'
    quote: 'now in some way inexplicable to us he had come to understand something more about the Lord through a ‘seeing’ experience than he had then understood when he had only ‘heard’ of him.'
  - where: 'note 42:5 “Heard of, and now seen”'
    claim: 'Afterward Job accepted all that had happened to him without further questioning'
    key: ot-manual-job
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-3?lang=eng'
    quote: 'The implication is that Job now accepted all that had happened to him without further questioning of the divine providence.'
  - where: 'note 42:5 “Heard of, and now seen”'
    claim: 'Job acknowledges he has come into God''s presence, completing the quest for God''s face begun after his calamities; the friends never seek His presence'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job now acknowledges that he has come into God’s presence (see Job 42:5), bringing to fruition the quest for God’s face initiated soon after his calamities began (see Job 3:3, 13–22). … They never cry out to God nor seek His presence'

  - where: 'note 42:6 “What Job repented of”'
    claim: 'Job did not hate himself but humbly acknowledged his weaknesses, sins and limitations'
    key: seminary-ot-teacher-109
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-109-job-38-42?lang=eng'
    quote: 'Help students understand that Job did not hate himself. Rather, he humbly acknowledged his weaknesses, sins, and limitations before the Lord.'
  - where: 'note 42:6 “What Job repented of”'
    claim: 'The two verbs of 42:6: ʾemʾas (3988) and wĕniḥamtî (5162)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'אֶמְאַ֣ס … וְ/נִחַ֑מְתִּי'
  - where: 'note 42:6 “What Job repented of”'
    claim: '“Myself” is not in the Hebrew; the verb can mean renounce or reject'
    key: scripture-helps-job
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/31-job-1-3-12-14-19-21-24-38-40-42?lang=eng'
    quote: 'In the King James Version of the Bible, the word “myself” is italicized, which means it does not appear in the original Hebrew text.'
  - where: 'note 42:6 “What Job repented of”'
    claim: 'BDB: māʾas “despise” with the object omitted at Job 42:6, as at 7:16; 34:33; 36:5'
    key: bdb
    url: 'https://biblehub.com/hebrew/3988.htm'
    quote: '2 despise, … object omitted Job 7:16 … Job 34:33; Job 36:5; Job 42:6'
  - where: 'note 42:6 “What Job repented of”'
    claim: 'BDB: nāḥam Niphal “be sorry, rue, suffer grief, repent, of one''s own doings,” listing Job 42:6 with māʾas'
    key: bdb
    url: 'https://biblehub.com/hebrew/5162.htm'
    quote: '2 be sorry, rue, suffer grief, repent, of one''s own doings, … מאס Job 42:6'
  - where: 'note 42:6 “What Job repented of”'
    claim: 'BDB: the Niphal also means “comfort oneself, be comforted”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5162.htm'
    quote: '3 comfort oneself, be comforted: absolute Genesis 38:12 (J) Psalm 77:3'
  - where: 'note 42:6 “What Job repented of”'
    claim: 'Renlund: Job also believed that only sin caused suffering'
    key: renlund-trust-god
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/08/03_trust-god-and-let-him-prevail?lang=eng'
    quote: 'Job also believed that only sin caused suffering and wanted to prove to his friends and to God that his “punishment” was out of proportion to sins he had committed.'
  - where: 'note 42:6 “What Job repented of”'
    claim: 'Renlund: Job repented of attributing his suffering to sin, recognizing that not all suffering is divine punishment'
    key: renlund-trust-god
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/08/03_trust-god-and-let-him-prevail?lang=eng'
    quote: 'He humbly acknowledged that he had not understood, and he repented of attributing his suffering to sin (see Job 42:3, 6). Job recognized that all suffering is not divine punishment.'
  - where: 'note 42:6 “What Job repented of”'
    claim: 'Eyring: after Job repented of calling God unfair, he saw his trials in a higher and holier way'
    key: eyring-holiness-plan
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2019/10/51eyring?lang=eng'
    quote: 'Then, after Job repented of calling God unfair, Job was permitted to see his trials in a higher and holier way. He had repented.'
  - where: 'note 42:6 “What Job repented of”'
    claim: 'Stirling (after Janzen), against most translations: Job changes his mind concerning dust and ashes, that is, mankind'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Most translations of verse 6 have Job repenting, self-abasingly, in dust and ashes … Far preferable is Janzen’s translation, which has Job changing his mind concerning dust and ashes (concerning mankind).'
  - where: 'note 42:6 “What Job repented of”'
    claim: 'Stirling''s translation and God''s love for “dust and ashes” (man)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Therefore, I recant and change my mind … second, God’s infinite concern and love for “dust and ashes” (man)'

  - where: 'note 42:7 “The thing that is right”'
    claim: 'The Bible Dictionary: Job spoke the thing that is right concerning the divine government, that there is a mystery in suffering only fresh revelation can solve; the friends took suffering as punishment for sin'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'they give their interpretation, that they are a sign of God’s anger and a punishment for sin; … Job is declared by God to have spoken the thing that is right concerning the divine government (42:7) in saying that there is a mystery in the incidence of suffering that only a fresh revelation can solve.'
  - where: 'note 42:7 “The thing that is right”'
    claim: 'The Lord called the friends to repentance for their false ideas about His justice'
    key: scripture-helps-job
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/31-job-1-3-12-14-19-21-24-38-40-42?lang=eng'
    quote: 'Eventually, the Lord called these three friends to repentance for their false ideas about His justice.'
  - where: 'note 42:7 “The thing that is right”'
    claim: 'Tanner: Job both condemned and approved; formally wrong but personally right; the relationship of the speaker matters'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'Thus, the text reminds us that one can say something that is formally wrong but personally right (as did Job), and something formally correct but personally wrong (as did the comforters). The relationship of the speaker to the speech matters utterly.'
  - where: 'note 42:7 “The thing that is right”'
    claim: 'Stirling: the verdict is determinative; God rejects strict retribution; the approval applies to Job''s revelatory insights, not his early charges'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'With words that are determinative for interpreting the book, God condemns the friends … God thus rejects the friends’ interpretations of events … in terms of strict retribution. God’s approval of Job’s words cannot be applied to Job’s initial dispersions of God’s justice; the approval seems to apply most specifically to Job’s four great revelatory insights'

  - where: 'note 42:8 “Job prays for his accusers”'
    claim: 'The Church''s footnote to “offering” in 42:8 points to Job 1:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/42?lang=eng'
    quote: '“offering”: Job 1:5.'
  - where: 'note 42:8 “Job prays for his accusers”'
    claim: 'The Church''s footnote to “pray” in 42:8 points to Gen. 20:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/42?lang=eng'
    quote: '“pray”: Gen. 20:7.'
  - where: 'note 42:8 “Job prays for his accusers”'
    claim: 'The Greek: the Lord pardoned their sin for the sake of Job'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/job/42.htm'
    quote: 'So Eliphaz the Thaemanite, and Baldad the Sauchite, and Sophar the Minaean, went and did as the Lord commanded them: and he pardoned their sin for the sake of Job.'
  - where: 'note 42:8 “Job prays for his accusers”'
    claim: 'Stirling: God speaks in the language of retribution to lead the friends to grace; Job in a priestly intercessory role, inverting Eliphaz''s expectation (22:27–30)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'God’s effort is best understood as an attempt to lead the friends from retribution to grace. Job functions in a priestly intercessory role to help rectify the friends’ relationship with God, ironically inverting Eliphaz’s probable previous expectation of serving as Job’s intercessor (see Job 22:27–30).'
  - where: 'note 42:8 “Job prays for his accusers”'
    claim: 'Stirling: God warns them in the language of retribution that folly will be done to them'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'God speaks to the friends in the language they understand — that of retribution — warning them that because of their folly, folly will be done to them'

  - where: 'note 42:10 “Restored when he prayed for his friends”'
    claim: 'BDB: šĕbût with šûb at Job 42:10 means restore the fortunes of an individual'
    key: bdb
    url: 'https://biblehub.com/hebrew/7622.htm'
    quote: 'd. restore fortunes of individuals, Job 42:10.'
  - where: 'note 42:10 “Restored when he prayed for his friends”'
    claim: 'The Greek of 42:10: when he prayed for his friends he forgave them their sin'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/job/42.htm'
    quote: 'And the Lord prospered Job: and when he prayed also for his friends, he forgave them their sin: and the Lord gave Job twice as much, even the double of what he had before.'
  - where: 'note 42:10 “Restored when he prayed for his friends”'
    claim: 'Davis: Job chooses again to trust God without answers and to forgive his friends before they apologize'
    key: ot-minute-job-overview
    url: 'https://scripturecentral.org/archive/books/book-chapter/book-job-overview'
    quote: 'When Job chooses again to trust God even though he has no answers and to forgive his friends even before they apologize, Job chooses a life that chooses meaningful relationships'

  - where: 'note 42:13 “The same number of children”'
    claim: 'The Student Manual on the undoubled children, quoting Keil and Delitzsch, as meaningful to Latter-day Saints'
    key: ot-manual-job
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-3?lang=eng'
    quote: 'C. F. Keil and F. Delitzsch gave an answer that should have more meaning to Latter-day Saints than to anyone in the gentile world'
  - where: 'note 42:13 “The same number of children”'
    claim: 'Delitzsch: the same children again is also a doubling, as deceased children are not absolutely lost (2 Sam. 12:23)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/42.htm'
    quote: 'he receives just the same again, which is also so far a doubling, as deceased children also, according to the Old Testament view, are not absolutely lost, 2 Samuel 12:23.'
  - where: 'note 42:13 “The same number of children”'
    claim: 'Stirling: the double follows the law on a thief (Exod. 22:4), God apparently accepting responsibility'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'God doubly restores all of Job’s material losses, following the demands on a thief in the law (see Exodus 22:4) and apparently accepting overall responsibility for Job’s suffering (see Job 42:10–12).'
  - where: 'note 42:13 “The same number of children”'
    claim: 'Parry: the double portion recalls the firstborn''s (Deut. 21:15–17) and points to Christ the Firstborn'
    key: parry-job-type
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-suffering-servant-type-jesus-christ'
    quote: 'During certain eras of the Old Testament, the firstborn son often received a double portion (Deut. 21:15–17) of his father’s inheritance. Therefore, Job’s double portion points to Christ, who is the Firstborn (Rom. 8:29; Heb. 1:6).'

  - where: 'note 42:15 “Daughters named, and given an inheritance”'
    claim: 'BDB: Jemimah, compare perhaps Arabic “dove”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3224.htm'
    quote: 'יְמִימָה proper name, feminine (compare perhaps Arabic dove, noun of individual meaning of Frey) — daughter of Job Job 42:14.'
  - where: 'note 42:15 “Daughters named, and given an inheritance”'
    claim: 'BDB: Keziah, cassia, from fragrance'
    key: bdb
    url: 'https://biblehub.com/hebrew/7103.htm'
    quote: 'II. קָצִיעָה proper name, feminine (cassia, from fragrance); — Job''s second daughter Job 42:14'
  - where: 'note 42:15 “Daughters named, and given an inheritance”'
    claim: 'BDB: Keren-happuch, horn of antimony, i.e. beautifier'
    key: bdb
    url: 'https://biblehub.com/hebrew/7163.htm'
    quote: 'קֶרֶן הַמּוּךְ proper name, feminine (horn of antimony, i.e. beautifier, see מּוּח); — Job''s third daughter Job 42:14.'
  - where: 'note 42:15 “Daughters named, and given an inheritance”'
    claim: 'Under the law a daughter inherits when a man has no son (Num. 27:8)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/27?lang=eng'
    quote: 'If a man die, and have no son, then ye shall cause his inheritance to pass unto his daughter.'
  - where: 'note 42:15 “Daughters named, and given an inheritance”'
    claim: 'Stirling: the daughters inherit alongside the sons, a gentle subversion of the law (Num. 27:8)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'surprisingly, only the daughters are named and inherit alongside the sons in a gentle subversion of the law (see Numbers 27:8).'

  - where: 'note 42:17 “The Greek ending”'
    claim: 'The Greek ending: 170 years after, 240 in all; will rise again; Syriac book, Ausis, Jobab, fifth from Abraam, king in Edom'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/job/42.htm'
    quote: 'And Job lived after his affliction a hundred and seventy years: and all the years he lived were two hundred and forty … and it is written that he will rise again with those whom the Lord raises up.'
  - where: 'note 42:17 “The Greek ending”'
    claim: 'The Greek: the Syriac book, Ausis on the borders of Idumea and Arabia, Jobab, son of Zare of the sons of Esau, fifth from Abraam, king in Edom'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/job/42.htm'
    quote: 'This man is described in the Syriac book as living in the land of Ausis, on the borders of Idumea and Arabia: and his name before was Jobab; … one of the sons of Esau … so that he was the fifth from Abraam.'
  - where: 'note 42:17 “The Greek ending”'
    claim: 'The Hebrew of 42:17 ends with “old and full of days”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'וַ/יָּ֣מָת אִיּ֔וֹב זָקֵ֖ן וּ/שְׂבַ֥ע יָמִֽים'

  - where: christ
    claim: 'Farley: Job prayed for friends who had symbolically crucified him with words, as Jesus prayed for those who crucified Him'
    key: farley-job-parallels
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/10/job-parallels-with-the-savior?lang=eng'
    quote: '“the Lord turned the captivity of Job, when he prayed for his friends” (Job 42:10), friends who had symbolically crucified him with words. Jesus prayed for the soldiers who, by military order, had literally crucified him'
  - where: christ
    claim: 'Tanner: the supreme proof that righteousness does not insulate from suffering is Christ, with D&C 122:8'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'Righteousness does not insulate us from suffering or assure us of material rewards. … The supreme proof of this is Christ, who suffered more than has any man. … As the Lord reminded the Prophet Joseph, “The Son of Man hath descended below them all.'
  - where: christ
    claim: 'D&C 122 is the word of the Lord to Joseph Smith in Liberty Jail'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/122?lang=eng'
    quote: 'The word of the Lord to Joseph Smith the Prophet, while a prisoner in the jail at Liberty, Missouri.'
  - where: christ
    claim: 'The Lord wants us to pray for those who misjudge us (42:8)'
    key: seminary-ot-teacher-109
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-109-job-38-42?lang=eng'
    quote: 'The Lord wants us to pray for those who misjudge us.'
  - where: christ
    claim: 'Eyring: Job increased in holiness through adversity and repentance and was qualified for greater happiness'
    key: eyring-holiness-plan
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2019/10/51eyring?lang=eng'
    quote: 'But perhaps the greatest blessing for Job was to have increased in holiness through adversity and repentance. He was qualified to have greater happiness in the days he had yet to live.'

  - where: explore
    claim: 'Come, Follow Me sets Moses 1:8–10 beside Job 42:1–6'
    key: cfm-ot-2026-33
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/33?lang=eng'
    quote: 'How did they change Job’s perspective? (see Job 42:1–6; see also Moses 1:8–10).'
  - where: explore
    claim: 'KnoWhy #640 summarizes Stirling''s reading of Job as a temple ascent ending in the Lord''s presence'
    key: sc-knowhy-640
    url: 'https://scripturecentral.org/knowhy/how-can-the-book-of-job-teach-us-about-the-temple'
    quote: 'Mack C. Stirling argues that Job’s experiences are presented in the form of an ancient temple ascent text, which culminates with the hero (in this case, Job) being admitted into the presence of the Lord.'
  - where: explore
    claim: 'Stirling''s essay, Interpreter 45 (2021)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job: An LDS Reading'
