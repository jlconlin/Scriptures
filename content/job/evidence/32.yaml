chapter: 32
claims:
  - where: setting
    claim: 'Job''s last defense ends with “The words of Job are ended”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/31?lang=eng'
    quote: 'Let thistles grow instead of wheat, and cockle instead of barley. The words of Job are ended.'
  - where: setting
    claim: 'A short prose introduction presents Elihu and justifies his appearing'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/32.htm'
    quote: 'A short introduction in historical prose, which introduces the speaker and justifies his appearance, opens the section.'
  - where: setting
    claim: 'Chapters 32–37 are Elihu''s speeches'
    key: gs-job
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/job?lang=eng'
    quote: 'Chapters 32–37 contain the speeches of Elihu, a fourth friend, who condemns Job for reasons other than the reasons of the first three friends.'
  - where: setting
    claim: 'Job makes no reply to Elihu'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'Job 32–37 contains the speeches of Elihu … His main thesis is that God will “not pervert judgment.” Job makes no reply to him.'
  - where: setting
    claim: 'Elihu is a younger man not mentioned in the prologue or epilogue, who had listened to the debate'
    key: cornwall-old-dead-book
    url: 'https://www.churchofjesuschrist.org/study/ensign/1974/07/the-old-dead-book-of-job?lang=eng'
    quote: 'Elihu, a younger man not mentioned in the prologue or epilogue who had listened intently but indignantly, could hold his tongue no longer:'
  - where: setting
    claim: 'In the ending the LORD rebukes Eliphaz and his two friends'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/42?lang=eng'
    quote: 'the LORD said to Eliphaz the Temanite, My wrath is kindled against thee, and against thy two friends'

  - where: thread
    claim: 'The chapter''s paragraphs: 1–5, 6–10, 11–14, 15–22'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2032&version=NRSVUE'
    quote: '“I am young in years, and you are aged; … 11 “See, I waited for your words; … 15 “They are dismayed; they answer no more;'
  - where: thread
    claim: 'Elihu will take a different course from the friends'' in answering Job'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/32.htm'
    quote: 'He will not then also answer him with such opinions as those so frequently repeated by them, i.e., he will take a totally different course from theirs in order to refute him.'
  - where: thread
    claim: 'The chapter is Elihu''s declaration, promising much'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/32.htm'
    quote: 'The young speaker continues still further his declaration, promising so much.'

  - where: section 1 plain
    claim: 'Verse 3: they found no answer, though they declared Job in the wrong'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2032&version=NRSVUE'
    quote: 'he was angry also at Job’s three friends because they had found no answer, though they had declared Job to be in the wrong.'
  - where: section 2 plain
    claim: 'Verses 8–9: the breath of the Almighty gives understanding; it is not the old who are wise'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2032&version=NRSVUE'
    quote: 'But truly it is the spirit in a mortal, the breath of the Almighty that makes for understanding. 9 It is not the old who are wise nor the aged who understand what is right.'
  - where: section 3 plain
    claim: 'Verse 13: God (and not man) can vanquish him'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2032&version=NRSVUE'
    quote: 'Yet do not say, ‘We have found wisdom; God may vanquish him, not a human.’'
  - where: section 3 plain
    claim: 'Verse 13: the friends shall not say that only God can drive Job from the field'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/32.htm'
    quote: 'a false wisdom, indeed - which only God and not any man can drive out of the field'
  - where: section 4 plain
    claim: 'Verses 18–22: full of words; like new wineskins; I must speak to find relief; no partiality or flattery'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2032&version=NRSVUE'
    quote: 'For I am full of words; the spirit within me constrains me. 19 My belly is indeed like wine that has no vent; like new wineskins, it is ready to burst. 20 I must speak, so that I may find relief;'

  - where: 'note 32:2 “Elihu, son of Barachel”'
    claim: 'Elihu''s name means “God is He”; he reproves the friends and reasons with Job'
    key: bd-elihu
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/elihu?lang=eng'
    quote: 'God (is) He. (1) Reproves Job’s three friends and reasons with Job (Job 32–37).'
  - where: 'note 32:2 “Elihu, son of Barachel”'
    claim: 'Elihu condemns Job on different grounds from the friends; his thesis is that God will not pervert judgment; Job makes no reply'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'Job 32–37 contains the speeches of Elihu, who is shocked at what he regards as impiety on the part of Job, and condemns him, though on different grounds from the “three friends.” His main thesis is that God will “not pervert judgment.” Job makes no reply to him.'
  - where: 'note 32:2 “Elihu, son of Barachel”'
    claim: 'Elihu condemns Job for reasons other than the friends'''
    key: gs-job
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/job?lang=eng'
    quote: 'the speeches of Elihu, a fourth friend, who condemns Job for reasons other than the reasons of the first three friends.'
  - where: 'note 32:2 “Elihu, son of Barachel”'
    claim: 'The LORD''s rebuke in 42:7 names Eliphaz and his two friends, not Elihu'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/42?lang=eng'
    quote: 'the LORD said to Eliphaz the Temanite, My wrath is kindled against thee, and against thy two friends'
  - where: 'note 32:2 “Elihu, son of Barachel”'
    claim: 'Most commentators see Elihu''s discourse as a later interpolation, because he enters late and no one responds'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'The young man Elihu is not mentioned until late in the drama (chapter 32), and no one responds to him. … most commentators see his discourse as a later interpolation in the text, a later scribe’s effort to give Job a proper answer from a human companion.'
  - where: 'note 32:2 “Elihu, son of Barachel”'
    claim: 'Tanner''s own view: Elihu stands under the same divine disapproval as the other comforters'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'Even Elihu, the fourth and final comforter, whose speeches echo those issuing from the whirlwind, had no impact on Job and, in my opinion, stands under the same divine disapproval as the other comforters.'
  - where: 'note 32:2 “Elihu, son of Barachel”'
    claim: 'The Papers'' editors list chapters 32–37 among the speeches that charged Job with transgression'
    key: jsp-letter-1839-03-20
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-and-edward-partridge-20-march-1839/8'
    quote: '39: See Job chaps. 4–5, 8, 11, 15, 18, 20, 22, 25, 32–37.'
  - where: 'note 32:2 “Elihu, son of Barachel”'
    claim: 'Elihu''s teachings hold wisdom applied generally, but he assumed, as the friends did, that the suffering are the wicked'
    key: ot-minute-job-36
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-36'
    quote: 'If we take Elihu’s teachings and apply them generally, not to Job’s specific situation, there is a lot of wisdom in them. … The problem that Elihu and Job’s friends shared is that they assumed that the wicked and the suffering are the same people.'

  - where: 'note 32:2 “Why Elihu is angry”'
    claim: 'Elihu''s fault with Job: declaring himself righteous, he brings on God the appearance of injustice, as the LORD says at 40:8'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/32.htm'
    quote: 'but that, declaring himself to be righteous, he brings upon God the appearance of injustice, or, as Jehovah also says further on, Job 40:8, that he condemns God in order that he may be able to maintain his own righteousness.'
  - where: 'note 32:2 “Why Elihu is angry”'
    claim: 'Condemning Job was the friends'' expedient for want of an answer'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/32.htm'
    quote: 'The fut. consec. describes the condemnation as the result of their inability to hit upon the right answer; it was a miserable expedient to which they had recourse.'
  - where: 'note 32:2 “Why Elihu is angry”'
    claim: 'Jewish tradition counts “and they condemned Job” among the eighteen corrections of the scribes, as if it had read “condemned God”; the older reading rejects it'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/32.htm'
    quote: 'According to the Jewish view, ויּרשׁיעוּ את־איּוב is one of the eighteen תקוני סופרים (correctiones scribarum), since it should be וירשׁיעו את־האלהים. But it is not the friends who have been guilty of this sin of הרשׁיע against God, but Job'
  - where: 'note 32:2 “Why Elihu is angry”'
    claim: 'A modern translation''s margin at 32:3: “had put God in the wrong”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2032&version=NRSVUE'
    quote: '32.3 Or answer, and had put God in the wrong'
  - where: 'note 32:2 “Why Elihu is angry”'
    claim: 'The seminary manual: Elihu believed the friends had not been firm enough and had failed to answer Job''s questions'
    key: seminary-ot-teacher-108
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-108-job-17-37?lang=eng'
    quote: 'Elihu, another of Job’s friends, spoke out against Job and his other friends because he believed they had not been firm enough with Job and had failed to answer Job’s questions.'

  - where: 'note 32:8 “Not age but the breath of the Almighty”'
    claim: '“Inspiration” is nišmat, breath'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'נִשְׁמַ֖ת'
  - where: 'note 32:8 “Not age but the breath of the Almighty”'
    claim: 'A modern translation: “the breath of the Almighty that makes for understanding”; “It is not the old who are wise”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2032&version=NRSVUE'
    quote: 'But truly it is the spirit in a mortal, the breath of the Almighty that makes for understanding. 9 It is not the old who are wise nor the aged who understand what is right.'
  - where: 'note 32:8 “Not age but the breath of the Almighty”'
    claim: 'The counsels of the comforters rest on human reason, not revelation'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'they are counsels based on human reason about suffering in general—upon hearsay, as it were—not upon revelation about Job’s particular predicament.'
  - where: 'note 32:8 “Not age but the breath of the Almighty”'
    claim: 'Elihu''s answer remains mere argument; the Lord''s is a revelation'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'For reason alone cannot solve Job’s crisis, which is a crisis in his relationship with God. … The point is that Elihu’s answer remains “mere argument;” the Lord’s is a revelation.'

  - where: 'note 32:19 “Wine with no vent”'
    claim: '“The spirit within me” is rûaḥ, the same word as “spirit” in verse 8'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'ר֣וּחַ'
  - where: 'note 32:19 “Wine with no vent”'
    claim: 'A modern translation: “full of words”; “like new wineskins, it is ready to burst”; “that I may find relief”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2032&version=NRSVUE'
    quote: 'For I am full of words; the spirit within me constrains me. 19 My belly is indeed like wine that has no vent; like new wineskins, it is ready to burst. 20 I must speak, so that I may find relief;'
  - where: 'note 32:19 “Wine with no vent”'
    claim: 'Elihu was not lacking in confidence; he claims “perfect knowledge” at 36:4'
    key: ot-minute-job-36
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-36'
    quote: 'Elihu was certainly not lacking in his confidence to answer Job, stating, “He that is perfect knowledge is with thee” (Job 36:4).'
  - where: 'note 32:19 “Wine with no vent”'
    claim: 'Some of Elihu''s arguments were good: God speaks to man through suffering'
    key: cornwall-old-dead-book
    url: 'https://www.churchofjesuschrist.org/study/ensign/1974/07/the-old-dead-book-of-job?lang=eng'
    quote: 'some of Elihu’s arguments were good. He said that God spoke to man through suffering.'
  - where: 'note 32:19 “Wine with no vent”'
    claim: 'Elihu claimed inspiration but was not inspired by charity'
    key: cornwall-old-dead-book
    url: 'https://www.churchofjesuschrist.org/study/ensign/1974/07/the-old-dead-book-of-job?lang=eng'
    quote: 'But Elihu had missed the point, too. Though he claimed to be inspired, he was not inspired by charity, nor could he perceive that suffering had refined Job’s spirit.'

  - where: christ
    claim: 'Job makes no reply to Elihu; his craving for light is satisfied by the vision of God'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'Job makes no reply to him. His own craving for light is satisfied by the vision of God, at length vouchsafed in answer to his appeals.'
  - where: christ
    claim: 'The book is about the need for personal revelation, the key to crises of faith brought on by suffering'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'The book of Job, then, is at bottom about the need for personal revelation. Revelation is the key to human crises of faith brought on by suffering.'
  - where: christ
    claim: 'The LORD in the King James is Jehovah, the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
