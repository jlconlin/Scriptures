chapter: 22
claims:
  - where: setting
    claim: 'Chapter 22 is Eliphaz''s third and last speech'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Eliphaz responds to Job for the third and final time.'
  - where: setting
    claim: 'Here for the first time Eliphaz charges Job with great wickedness and specific crimes against the poor'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Now, for the first time, he accuses Job of great wickedness and endless iniquity (see Job 22:5). He specifically charges Job with oppressing the poor and powerless, even stripping their limited possessions for gain.'
  - where: setting
    claim: 'The friends moved from comfort to accusation; the Lord later called them to repentance for their false ideas about His justice'
    key: scripture-helps-job
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/31-job-1-3-12-14-19-21-24-38-40-42?lang=eng'
    quote: 'Although Job’s friends initially showed compassion, they eventually shifted their approach from comfort to accusation. Job’s friends believed the common misconception that suffering must be God’s punishment for disobedience.'
  - where: setting
    claim: 'Job 21 gives the friends'' doctrine a death-blow, and Eliphaz cannot stay silent over it'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/22.htm'
    quote: 'he certainly in that speech gives the death-blow to the dogma of the friends. The poet cannot possibly allow them to be silent over it. Eliphaz, the most discreet and intelligent, speaks.'

  - where: thread
    claim: 'Eliphaz argues that man and his knowledge are nothing before God, so man may not question God'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Eliphaz makes a last valiant effort to make Job see things his way (see Job 22). He argues that man and his knowledge are nothing before God; therefore, man has no right to question or judge God (see Job 22:2, 11–14).'
  - where: thread
    claim: 'The friends'' speeches are true in their general substance and false in their application to Job'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/22.htm'
    quote: 'According to their general substance, these speeches are genuine diamonds; according to their special application, they are false ones.'
  - where: thread
    claim: 'Job denied that retribution is universal, not that God governs; Eliphaz treats the one as the other'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/22.htm'
    quote: 'This is true, but it does not apply to Job, for whom it is intended. Job has denied the universality of a just divine retribution, but not the special providence of God.'

  - where: thread
    claim: 'In one older reading Job used the language of the doubter'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/22.htm'
    quote: 'Job uses the language of the doubter not without sinning against God'
  - where: section 1 plain
    claim: 'A modern translation reads verse 4 as God rebuking Job for his piety'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+22&version=NRSVUE'
    quote: '4 Is it for your piety that he reproves you and enters into judgment with you?'

  - where: 'note 22:2 “Profitable unto God”'
    claim: 'King Benjamin asks the same question and answers no; his point is that God serves His creatures out of love, not for profit'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'It is the same one pondered by King Benjamin in Mosiah 2. … The purpose of King Benjamin’s words is not to declare God’s aloofness from us nor His unaffected nature but rather to point out the fact that the King of the world spends His life in service of His own creations—not because we are “profitable” but because He loves us.'
  - where: 'note 22:2 “Profitable unto God”'
    claim: 'Eliphaz asks the question to disconnect God from humanity'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Eliphaz, however, does not ask this question to move us to consider God’s love for us and our duty to love others; Eliphaz asks this question to disconnect God from humanity.'
  - where: 'note 22:2 “Profitable unto God”'
    claim: 'God does not need a return on His investment, but to say He is unaffected by our righteousness goes too far'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'But to say that God is unaffected by our righteousness or our wickedness is to go too far. … God does not need a return on His investment, but He does need our care for each other if He is to make this world a better place.'
  - where: 'note 22:2 “Profitable unto God”'
    claim: 'Eliphaz speaks falsely in verse 3; the prologue shows God prizes Job''s uprightness'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Here, Eliphaz speaks falsely, saying God is indifferent to (without passion for) human virtue. In fact, the entire drama of Job was precipitated precisely because God does prize human uprightness and blamelessness (see Job 1:8).'
  - where: 'note 22:2 “Profitable unto God”'
    claim: 'Elihu takes up the same point at 35:6–7'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Elihu, amplifying a previous point of Eliphaz (see Job 22:2–3), now confronts Job with God’s supposed indifference to human wickedness or righteousness'
  - where: 'note 22:2 “Profitable unto God”'
    claim: 'Mosiah 2:21, the footnote at verse 3, and Job 1:8 read'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/22?lang=eng'
    quote: '3a “righteous”: Mosiah 2:21 (20–22).'

  - where: 'note 22:5 “Crimes Job did not commit”'
    claim: 'Eliphaz now accuses Job of specific crimes for which he is suffering'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Eliphaz goes on to accuse Job of committing specific crimes for which he is suffering.'
  - where: 'note 22:5 “Crimes Job did not commit”'
    claim: 'A modern translation of verse 8'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+22&version=NRSVUE'
    quote: '8 The powerful possess the land, and the favored live in it.'
  - where: 'note 22:5 “Crimes Job did not commit”'
    claim: 'In one older reading the man of the arm in verse 8 is Job himself, in Eliphaz''s mind'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/22.htm'
    quote: 'The man of the arm, זרוע, is in Eliphaz'' mind Job himself. He has by degrees acquired the territory far and wide for himself, by having brought down the rightful possessors by open violence'
  - where: 'note 22:5 “Crimes Job did not commit”'
    claim: 'The dogma demands sins to match suffering, so Job''s former wealth becomes the ground of the charges'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/22.htm'
    quote: 'For the dogma demands wickedness in an equal degree to correspond to a great evil, unlimited sins to unlimited sufferings. Therefore the former wealth of Job must furnish him with the ground of heavy accusations … Thus is the dogma of the justice of God rescued by the unjust abandonment of Job.'
  - where: 'note 22:5 “Crimes Job did not commit”'
    claim: 'Job denies the charges under oath in chapter 31'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job will vigorously deny these charges under oath in chapter 31.'
  - where: 'note 22:5 “Crimes Job did not commit”'
    claim: 'The Papers'' editors point Joseph Smith''s 1841 remark about the natural conclusion to Job 22:1–10'
    key: jsp-discourse-1841-03-28
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-circa-28march-1841/1'
    quote: 'it is very Natureal for a man when he sees his fellow man afflicted his Natureal conclusion is that he is suffering the Rath of an angry God & turn from him in haste not knowing the purposes of God1 … 1: See Job 22:1–10'
  - where: 'note 22:5 “Crimes Job did not commit”'
    claim: 'Job 29:12–16 and 31:16–21 read'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/31?lang=eng'
    quote: 'If I have withheld the poor from their desire, or have caused the eyes of the widow to fail;'

  - where: 'note 22:18 “Job’s own words turned back”'
    claim: 'Eliphaz claims Job''s disclaimer for himself, in rivalry with Job'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Clearly in rivalry with Job, Eliphaz also claims that “the counsel of the wicked is far from [him]” (Job 22:18, rsv; see also Job 21:16).'
  - where: 'note 22:18 “Job’s own words turned back”'
    claim: 'Eliphaz sees Job as keeping to the old way of the wicked'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Because of Job’s suffering, Eliphaz can see Job only as guilty, as keeping to the “old way which wicked men have trod” (Job 22:15, rsv)'
  - where: 'note 22:18 “Job’s own words turned back”'
    claim: 'Job 21:14–16 read'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/21?lang=eng'
    quote: 'Lo, their good is not in their hand: the counsel of the wicked is far from me.'

  - where: 'note 22:21 “Good counsel at the wrong time”'
    claim: '“Acquaint” (hiphil of sākan) means to show harmony with someone'
    key: bdb
    url: 'https://biblehub.com/hebrew/5532.htm'
    quote: 'Imperative הַסְכֶּןנָֿא Job 22:21 … hence shew harmony with (עִם) one Job 22:21, be familiar with, know intimately'
  - where: 'note 22:21 “Good counsel at the wrong time”'
    claim: 'A modern translation of verses 21 and 24–25'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+22&version=NRSVUE'
    quote: '21 “Agree with God, and be at peace; … 24 if you treat gold like dust and gold of Ophir like the stones of the torrent bed, 25 and if the Almighty is your gold and your precious silver,'
  - where: 'note 22:21 “Good counsel at the wrong time”'
    claim: 'For Eliphaz, agreeing with God means agreeing with him; Job seeks God himself, not a contrived repentance'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Eliphaz admonishes Job to “agree with God and be at peace” (Job 22:21). However, for Eliphaz this means to agree with him and the community he represents.'
  - where: 'note 22:21 “Good counsel at the wrong time”'
    claim: 'Job wants a face-to-face meeting with God, not the contrived repentance Eliphaz recommends'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job’s overwhelming desire is a face-to-face meeting with God, not by contrived repentance as recommended by Eliphaz (see Job 22:21–30), but in honesty and fairness.'
  - where: 'note 22:21 “Good counsel at the wrong time”'
    claim: 'In one Latter-day Saint reading Eliphaz asks Job to lay his own gold (his insistence on his own righteousness) in the dust and make God his gold'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Eliphaz asks Job to return to God, laying his own gold (insistence on his own righteousness and understanding — his integrity) in the dust in order to make God his “gold”'

  - where: 'note 22:30 “The island that is not an island”'
    claim: 'The Hebrew ʾî in verse 30 is the negative “not”: the non-innocent'
    key: bdb
    url: 'https://biblehub.com/hebrew/336.htm'
    quote: 'IV. אִי adverb not … Job 22:30 אִינָֿקִי the non-innocent.'
  - where: 'note 22:30 “The island that is not an island”'
    claim: 'The same letters also spell the word for island or coast'
    key: bdb
    url: 'https://biblehub.com/hebrew/336.htm'
    quote: 'i: Island, coast, region'
  - where: 'note 22:30 “The island that is not an island”'
    claim: 'A modern translation of verse 30'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+22&version=NRSVUE'
    quote: '30 He will deliver even those who are guilty; they will escape because of the cleanness of your hands.”'
  - where: 'note 22:30 “The island that is not an island”'
    claim: 'Eliphaz promises Job an intercessor''s role but sees himself in that role toward Job; ironically Job intercedes for the friends (42:7–9)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Eliphaz promises Job restoration, even to the point (in niv and Pope translations22) of his making intercession for the guilty and facilitating their deliverance (see Job 22:27–30). Eliphaz now, however, clearly sees himself in this role with respect to Job. Ironically, it will be Job in the Epilogue … who will make intercession for the friends (see Job 42:7–9).'
  - where: 'note 22:30 “The island that is not an island”'
    claim: 'Job''s intercession inverts Eliphaz''s expectation of serving as Job''s intercessor'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job functions in a priestly intercessory role50 to help rectify the friends’ relationship with God, ironically inverting Eliphaz’s probable previous expectation of serving as Job’s intercessor (see Job 22:27–30).'
  - where: 'note 22:30 “The island that is not an island”'
    claim: 'Job 42:7–8 read'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/42?lang=eng'
    quote: 'and my servant Job shall pray for you: for him will I accept: lest I deal with you after your folly'

  - where: christ
    claim: 'In one Latter-day Saint reading Job''s mediation for the friends parallels Christ''s as mediator for mankind'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Finally, Job’s role as mediator for the friends parallels Christ’s as mediator for mankind.'
  - where: christ
    claim: 'D&C 45:3–4: the Advocate who did no sin pleads for those who have sinned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'Listen to him who is the advocate with the Father, who is pleading your cause before him'
  - where: christ
    claim: 'D&C 45:5: the Advocate asks the Father to spare those who believe on His name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'Wherefore, Father, spare these my brethren that believe on my name'
  - where: 'note 22:30 “The island that is not an island”'
    claim: 'The lexicon also records proposals to read a different word in Job 22:30'
    key: bdb
    url: 'https://biblehub.com/hebrew/336.htm'
    quote: 'Job 22:30: read perhaps'
