chapter: 38
claims:
  - where: setting
    claim: 'The LORD’s first speech runs from 38:1 to 40:2, and the second begins in chapter 40; Job replies at the end of each'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'God gives two speeches to Job, and Job has a chance to reply at the end of each of them. God’s first speech is Job 38:1–40:2, and His second is Job 40:6–34.'
  - where: setting
    claim: 'The chapter heading: God asks where Job was at the creation; nature shows God’s greatness and man’s weakness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/38?lang=eng'
    quote: 'God asks Job where he was when the foundations of the earth were laid…'
  - where: setting
    claim: 'One older reading takes the whirlwind generically, but in sequence as the storm that rose during Elihu’s speeches'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/38.htm'
    quote: 'The art. is to be understood generically, but, with respect to Elihu''s speeches, refers to the storm which has risen up in the meanwhile.'
  - where: setting
    claim: 'Job has demanded a chance to face God and argue his case; the whirlwind gives it'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'Job has spent the book wrestling with his predicament and demanding that he have a chance to face God so he can argue his case. With the Lord’s arrival in a whirlwind, Job is given his chance.'
  - where: thread
    claim: 'The Lord did not answer why Job suffered; He answered with more questions'
    key: seminary-ot-teacher-109
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-109-job-38-42?lang=eng'
    quote: 'He did not seem, however, to answer the questions Job and his friends raised about why Job was suffering. Instead, the Lord gave answers in the form of more questions.'
  - where: thread
    claim: 'The questions can be read as a comforting confirmation of God’s power to care for His creations, Job included'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'when we put God’s answer in context, it can be read as a comforting confirmation of God’s power to care for His creations, Job included.'
  - where: 'note 38:1 “The LORD answers out of the whirlwind”'
    claim: 'The Lord did not answer why Job suffered but answered in more questions'
    key: seminary-ot-teacher-109
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-109-job-38-42?lang=eng'
    quote: 'The Lord finally answered Job’s prayers. He did not seem, however, to answer the questions Job and his friends raised about why Job was suffering. Instead, the Lord gave answers in the form of more questions.'
  - where: 'note 38:1 “The LORD answers out of the whirlwind”'
    claim: 'That the Lord spoke at all, and directly to Job, met Job’s deepest need, reassurance he was not forsaken'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'Apart from what the Lord said, simply the fact that he spoke at all, and spoke directly to Job, relieved the man of Uz’s deepest need—his hunger for reassurance that God has not forsaken him. Intellectual answers can never provide this knowledge.'
  - where: 'note 38:1 “The LORD answers out of the whirlwind”'
    claim: 'The book is at bottom about the need for personal revelation'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'The book of Job, then, is at bottom about the need for personal revelation. Revelation is the key to human crises of faith brought on by suffering.'
  - where: 'note 38:1 “The LORD answers out of the whirlwind”'
    claim: 'A Latter-day Saint reading: no hint that man may not question God; God’s counter-questions invite deeper understanding'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'There is no hint given that it is not for man to question God. Indeed, God answers Job’s questions with counter-questions, inviting him to deeper understanding.'
  - where: 'note 38:2 “Darkening God’s plan”'
    claim: 'The Hebrew ʿēṣāh means advice, counsel, and by implication a plan'
    key: bdb
    url: 'https://biblehub.com/hebrew/6098.htm'
    quote: 'From ya''ats; advice; by implication, plan; also prudence -- advice, advisement, counsel(l-(or)), purpose.'
  - where: 'note 38:2 “Darkening God’s plan”'
    claim: '“Counsel” also means “plan”: God has a plan for the world that Job is obscuring'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'The word translated as “counsel” also means “plan.” God is making it clear that He has a plan for the world, a plan that Job is obscuring through his speech.'
  - where: 'note 38:2 “Darkening God’s plan”'
    claim: 'At 42:3 Job repeats the LORD’s words of 38:2 and makes them his own'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'they indicate where Job is quoting or closely paraphrasing actual words of God from God’s first and second speeches (42:3a = 38:2; 42:4b = 38:3b & 40:7b). Job thus repeats or takes up words of the Lord, making them his own'
  - where: 'note 38:3 “The hearing turned around”'
    claim: 'In one older reading the LORD does not do what Job asked at 13:22 but surprises him with questions meant to show him the wrong of his challenge'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/38.htm'
    quote: 'He surprises him with questions which are intended to bring him indirectly to the consciousness of the wrong and absurdity of his challenge'
  - where: 'note 38:3 “The hearing turned around”'
    claim: 'A Latter-day Saint reading: the Lord confers dignity on Job and challenges him to stand up and answer'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'The Lord speaks with Job, conferring dignity on him, and challenges him to stand up and answer.'
  - where: 'note 38:3 “The hearing turned around”'
    claim: 'The same reading: “like a man” fulfils Job’s hope of 23:7 against his despair of 9:32'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'God challenges Job to respond to His questions “like a man,” making God to know (see Job 38:3), thus fulfilling Job’s hope (see Job 23:7) against his earlier despair (see Job 9:32).'
  - where: 'note 38:4 “Job was somewhere”'
    claim: 'Joseph Smith read Job 38 in a meeting, about 28 March 1841'
    key: jsp-discourse-1841-03-28
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-circa-28march-1841/1'
    quote: 'Next Meeting Meeting on sunday Joseph Reads the 38th. Ch— of Job.'
  - where: 'note 38:4 “Job was somewhere”'
    claim: 'He taught that the spirits or intelligences of men existed before the earth’s foundation, and quoted the Lord’s question to Job'
    key: jsp-discourse-1841-03-28
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-circa-28march-1841/1'
    quote: 'he says the spirit or the inteligence of men are self Existant principles before the foundation this Earth— & quotes the Lords question to Job “where wast thou when I'
  - where: 'note 38:4 “Job was somewhere”'
    claim: 'He took the question as evidence that Job existed somewhere at that time'
    key: jsp-discourse-1841-03-28
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-circa-28march-1841/2'
    quote: 'Laid the foundation of the Earth”2 Evedencing that Job was in Existing somewhere at that time'
  - where: 'note 38:4 “Job was somewhere”'
    claim: 'A Latter-day Saint reading: the question seems to say Job could not have been there, but ironically he may well have been (Abraham 3:22–25), and God may be inviting him to understand creation'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Ironically, however, God may actually be inviting Job to a deeper understanding of and participation in creation. Superficially, this text seems to suggest that Job could not have been present at creation, whereas ironically he may well have been (Abraham 3:22–25).'
  - where: 'note 38:7 “The morning stars and the sons of God”'
    claim: 'The Church’s seminary manual calls the verse a passage confirming the premortal life'
    key: seminary-intro-job
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job?lang=eng'
    quote: 'The book of Job is also distinctive for a passage confirming the reality of the premortal life, in which “the morning stars sang together, and all the sons of God shouted for joy” at the Creation of the earth (Job 38:7).'
  - where: 'note 38:7 “The morning stars and the sons of God”'
    claim: 'Scripture Helps places the shouts of joy at the Council in Heaven, when the Father presented His plan'
    key: scripture-helps-job
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/31-job-1-3-12-14-19-21-24-38-40-42?lang=eng'
    quote: 'These shouts of joy occurred during the Council in Heaven when Heavenly Father presented His plan for our progression.'
  - where: 'note 38:7 “The morning stars and the sons of God”'
    claim: 'The sons of God of the divine council were thought to be represented by the stars (Job 38:7)'
    key: ot-minute-job-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-1-3'
    quote: 'The sons of God who compose the divine council were thought to be represented by the stars (see Job 38:7; 1 Kings 22:19).'
  - where: 'note 38:7 “The morning stars and the sons of God”'
    claim: 'In the premortal council of Abraham 3, plans for the creation of the earth were made, led by the premortal Jesus Christ'
    key: sc-knowhy-810
    url: 'https://scripturecentral.org/knowhy/why-did-the-lord-call-himself-the-creator-of-the-first-day'
    quote: 'It was in this council that plans for the creation of the earth were made, led by a premortal Jesus Christ (see Abraham 3:24).'
  - where: 'note 38:7 “The morning stars and the sons of God”'
    claim: 'In D&C 128:23 Joseph Smith adds sun and moon and turns the rhetorical question into a declaration celebrating the Restoration'
    key: frederick-old-wine
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/old-wine-new-bottles'
    quote: 'First, he adds “sun” and “moon” to the “morning stars.” Second, he has taken what was originally a rhetorical question highlighting the beauty and wonder of the natural world and turned it into a declarative statement celebrating the beauty and wonder of the Restoration.'
  - where: 'note 38:8 “The sea in swaddling bands”'
    claim: 'A Latter-day Saint reading: the sea stands for primal chaos or evil, which like Satan in the prologue is permitted but bounded'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: '“Sea” functions as a metaphor for primal chaos or evil — which, like Satan in the Prologue, are permitted in creation but are bounded in some way.'
  - where: 'note 38:14 “The dawn shakes out the wicked”'
    claim: 'A modern translation: the dawn takes hold of the skirts of the earth; the earth is changed like clay under the seal'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+38&version=NRSVUE'
    quote: 'so that it might take hold of the skirts of the earth, and the wicked be shaken out of it? It is changed like clay under the seal, and it is dyed like a garment.'
  - where: 'note 38:14 “The dawn shakes out the wicked”'
    claim: 'In one older reading the dawn is like a signet ring stamping the earth; things hidden in the night become visible, and the light gives each its garb'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/38.htm'
    quote: 'the dawn is like the signet-ring, which stamps a definite impress on the earth as the clay, the forms which floated in the darkness of the night become visible and distinguishable.'
  - where: 'note 38:14 “The dawn shakes out the wicked”'
    claim: 'A Latter-day Saint reading: a coming day when the wicked are shaken out, cut off from light and made powerless; evil men too are permitted but bounded'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'God then alludes to a coming day when the wicked will [Page 164]be shaken out of the earth, cut off from light, and rendered powerless (see Job 38:12–15; see also Heb. 12:26). Like the sea and Satan, evil men are also permitted in the created world but are ultimately bounded'
  - where: 'note 38:26 “Rain where no one lives”'
    claim: 'God sends rain to uninhabited areas, cares for deer and ostrich eggs, as Jesus said of the sparrows'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'takes care to send rain to uninhabited areas (Job 38:26–27) but is also mindful of pregnant deer (Job 39:1–2) and the abandoned eggs of the ostrich (Job 39:13–15). We can see this as being similar to Jesus’s reminder'
  - where: 'note 38:26 “Rain where no one lives”'
    claim: 'God gives no answer beyond assuring Job there is a plan and that He cares for the world'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'God does not provide answers for Job or the reader in His response other than to assure Job that there is a plan and that God does care for the world.'
  - where: 'note 38:31 “Binding the Pleiades”'
    claim: 'The word rendered “sweet influences” means bindings or twistings, as the Septuagint and Targum translate'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/38.htm'
    quote: 'That מעדגּות here signifies bindings or twistings (from עדן equals ענד, Job 31:36) is placed beyond question by the unanimous translations of the lxx (δεσμόν) and the Targ.'
  - where: 'note 38:31 “Binding the Pleiades”'
    claim: 'In the same reading kîmāh is the clustered group (the Pleiades) and kĕsîl is Orion'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/38.htm'
    quote: 'As to כּסיל, we firmly hold that it denotes Orion (according to which the Greek versions translate Ὠρίων'
  - where: 'note 38:31 “Binding the Pleiades”'
    claim: 'A modern translation: the chains of the Pleiades, the cords of Orion, the Mazzaroth, the Bear with its children'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+38&version=NRSVUE'
    quote: 'Can you bind the chains of the Pleiades or loose the cords of Orion? Can you lead forth the Mazzaroth in their season, or can you guide the Bear with its children?'
  - where: 'note 38:31 “Binding the Pleiades”'
    claim: 'Mazzaroth occurs only here and is perhaps some particular star or constellation'
    key: bdb
    url: 'https://biblehub.com/hebrew/4216.htm'
    quote: 'only בְּעִתּוֺ ׳הֲתֹצִיא מ Job 38:32, where treated as masculine singular, and perhaps understood of some particular star or constellation.'
  - where: section 1 plain
    claim: '“Counsel” rendered as God’s plan'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'The word translated as “counsel” also means “plan.”'
  - where: section 4 plain
    claim: 'Verses 13–14 rendered with the edges of the earth and clay under a seal'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+38&version=NRSVUE'
    quote: 'It is changed like clay under the seal'
  - where: section 7 plain
    claim: 'Verse 31 rendered as binding the Pleiades and loosing Orion’s cords; verse 37 as tilting the waterskins'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+38&version=NRSVUE'
    quote: 'Or who can tilt the waterskins of the heavens when the dust runs into a mass and the clods cling together?'
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'The premortal council where the creation was planned was led by the premortal Christ'
    key: sc-knowhy-810
    url: 'https://scripturecentral.org/knowhy/why-did-the-lord-call-himself-the-creator-of-the-first-day'
    quote: 'It was in this council that plans for the creation of the earth were made, led by a premortal Jesus Christ (see Abraham 3:24).'
  - where: christ
    claim: 'God’s care for creatures in Job 38–41 is set beside Jesus’ words on the sparrows'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'We can see this as being similar to Jesus’s reminder that “are not two sparrows sold for a farthing? And one of them shall not fall on the ground without your Father?” (Matthew 10:29).'
  - where: christ
    claim: 'Only the Lord can confirm His love through the Comforter; revealed reassurance is the comfort every Job requires'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'But only the Lord can confirm His continuing love through the voice of the only unfailing comforter, His Comforter. This revelation is, ultimately, the sine qua non for resolving a Joban crisis.'
  - where: explore
    claim: 'Isaiah 40:12–31 and Psalm 104 help in reading God’s speeches to Job'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'Isaiah 40:12–31 and Psalm 104 help us better understand God’s speeches to Job.'
  - where: 'note 38:1 “The LORD answers out of the whirlwind”'
    claim: 'Readers might expect the Lord to explain the prologue and why we suffer; the encounter does little to clear that up'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'As readers, we might expect the Lord to explain Satan’s accusations and His giving permission for Job to be tested and tried (Job 1–2).'
  - where: 'note 38:2 “Darkening God’s plan”'
    claim: 'God does not condemn Job or call him wicked, but makes clear that Job’s speech has darkened the plan'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'God does not condemn Job nor tell him that he is wicked, and He becomes the first one in the dialogue to suggest that both parties can both be righteous. God does not condemn Job, but He does make it clear that Job’s speech has darkened the “plan”'
  - where: thread
    claim: 'God assures Job there is a plan and that He cares for the world, even uninhabited land'
    key: ot-minute-job-38
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-38-40'
    quote: 'God does not provide answers for Job or the reader in His response other than to assure Job that there is a plan and that God does care for the world.'
  - where: 'note 38:31 “Binding the Pleiades”'
    claim: 'Kîmāh is the clustered group'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/38.htm'
    quote: 'But כּימה signifies without doubt the clustered group,'
  - where: 'note 38:7 “The morning stars and the sons of God”'
    claim: 'President Monson: in our premortal state we were among the sons and daughters of God who shouted for joy at the chance to come to mortality'
    key: monson-he-is-risen
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2010/04/he-is-risen?lang=eng'
    quote: 'In our premortal state, we were doubtless among the sons and daughters of God who shouted for joy because of the opportunity to come to this challenging yet necessary mortal existence.'
  - where: 'note 38:14 “The dawn shakes out the wicked”'
    claim: 'In one older reading the dawn takes hold of the earth like a carpet by its edges and shakes off the evildoers who lay on it in the night'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/38.htm'
    quote: 'takes hold of the carpet of the earth as it were by the edges, and shakes off from it the evil-doers, who had laid themselves to rest upon it the night before.'
  - where: 'note 38:14 “The dawn shakes out the wicked”'
    claim: 'In the same reading the light of the wicked is the darkness of night (Job 24:17), which the sunrise takes from them'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/38.htm'
    quote: 'The light of the evil-doers is, according to Job 24:17, the darkness of the night, which is for them in connection with their works what the light of day is for other men.'
  - where: christ
    claim: 'The footnote to “raven” in Job 38:41 points to Luke 12:24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/38?lang=eng'
    quote: 'Luke 12:24'
