chapter: 29
claims:
  - where: setting
    claim: 'In one Latter-day Saint reading Job has moved beyond dialogue with the friends and waits on God; he reviews his past in 29, his present in 30, and affirms his innocence by oath in 31'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job has moved beyond dialogue with the friends and waits, instead, on God. … Job will review his past and present life in chapters 29 and 30. In chapter 31, Job will [Page 156]affirm his innocence and recommit himself in covenant fidelity, using self-imprecatory oaths'
  - where: setting
    claim: 'Job 29:1 repeats the heading of 27:1, with no new speaker named between them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/29?lang=eng'
    quote: 'Moreover Job continued his parable, and said,'
  - where: setting
    claim: 'In one Latter-day Saint reading Job denies the charges of chapter 22 under oath in chapter 31'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job will vigorously deny these charges under oath in chapter 31.'
  - where: setting
    claim: 'The chapter heading: Job was blessed because of his righteousness, charity and good deeds'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/29?lang=eng'
    quote: 'Job recalls his former prosperity and greatness—He was blessed because of his righteousness, his charity, and his good deeds.'
  - where: setting
    claim: 'In one older reading the deeds Job recalls refute everywhere the uncharitable accusations of Eliphaz in chapter 22'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/29.htm'
    quote: 'the more forcible is the refutation which the accusations of the most hard-hearted uncharitableness raised against him by them, especially by Eliphaz, Job 22, find everywhere here.'
  - where: setting
    claim: 'Chapter 29 is the fullest description of Job''s life before his trial'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Chapter 29 gives the fullest description of Job’s life before his “fall.”'

  - where: thread
    claim: 'All of chapter 29 is inverted in chapter 30; Job saw his prosperity as evidence of God''s presence'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Now, all of this has been inverted (see Job 30). Even the lowest stratum of society, which Job now admits to having once disdained, mocks and spits at Job'

  - where: section 1 plain
    claim: 'A modern translation: "when the friendship of God was upon my tent"; "my steps were washed with milk"'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+29&version=NRSVUE'
    quote: 'when I was in my prime, when the friendship of God was upon my tent, … when my steps were washed with milk'
  - where: section 3 plain
    claim: 'A modern translation: justice as robe and turban; championed the cause of the stranger'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+29&version=NRSVUE'
    quote: 'my justice was like a robe and a turban. … I was a father to the needy, and I championed the cause of the stranger.'
  - where: section 5 plain
    claim: 'A modern translation: spring rain; smiled on them when they had no confidence'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+29&version=NRSVUE'
    quote: 'they opened their mouths as for the spring rain. I smiled on them when they had no confidence, and the light of my countenance they did not extinguish.'

  - where: 'note 29:4 “The friendship of God over my tent”'
    claim: 'The Hebrew of 29:4 has sôd, "counsel, intimacy," and ʾōhel, "tent"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'בְּ/ס֥וֹד'
  - where: 'note 29:4 “The friendship of God over my tent”'
    claim: 'BDB: sôd as familiar converse with God, intimacy, with Ps. 25:14 and Job 29:4 if the text is sound, and an emendation, "when Eloah sheltered my tent"'
    key: bdb
    url: 'https://biblehub.com/hebrew/5475.htm'
    quote: 'c. familiar converse with God, intimacy, ׳י ׳ליראיו ס Psalm 25:14 intimacy with ׳י have those who fear him … here also Job 29:4 (si vera lectio) … when Eloah sheltered my tent.'
  - where: 'note 29:4 “The friendship of God over my tent”'
    claim: 'The Church''s footnote on "secret": friendship, confidence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/29?lang=eng'
    quote: '4a “secret”: OR friendship, confidence.'
  - where: 'note 29:4 “The friendship of God over my tent”'
    claim: 'A modern translation: "when the friendship of God was upon my tent"'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+29&version=NRSVUE'
    quote: 'when the friendship of God was upon my tent,'
  - where: 'note 29:4 “The friendship of God over my tent”'
    claim: 'One Latter-day Saint reading: chapter 29 is the fullest description of Job''s life before his fall, when he perceived God''s companionship and friendship'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Chapter 29 gives the fullest description of Job’s life before his “fall.” He then perceived God’s companionship and friendship (see Job 29:2–5)'

  - where: 'note 29:6 “Butter and oil from the rock”'
    claim: 'BDB: the word is curd, curdled milk; compared with the streams of honey and curd of Job 20:17, figurative of abundance'
    key: bdb
    url: 'https://biblehub.com/hebrew/2529.htm'
    quote: 'curd, curdled milk … compare ׳נַחֲלֵי דבשׁ וח figurative of abundance Job 20:17; בִּרְחֹץ חֲלִיכַי בְּחֵמָ֑ה Job 29:6'
  - where: 'note 29:6 “Butter and oil from the rock”'
    claim: 'A modern translation: "when my steps were washed with milk"'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+29&version=NRSVUE'
    quote: 'when my steps were washed with milk and the rock poured out for me streams of oil!'
  - where: 'note 29:6 “Butter and oil from the rock”'
    claim: 'Stirling: the rock pouring oil is reminiscent of Adam''s easy access to food in Eden'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: '“the rock poured out for me streams of oil” (see Job 29:6, rsv), reminiscent of Adam’s easy access to food in the Garden of Eden.'
  - where: 'note 29:6 “Butter and oil from the rock”'
    claim: 'Stirling: Job lived in an unnaturally idyllic world, lacking in self-knowledge and knowledge of God'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'is a non-Israelite living in an unnaturally idyllic world. … Nonetheless, as subsequent events will demonstrate, Job is, as yet, lacking both in self-knowledge and knowledge of God.'
  - where: 'note 29:6 “Butter and oil from the rock”'
    claim: 'Stirling: Job''s loss is a kind of fall, like Adam''s, tasting the bitter to comprehend the sweet'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job has thus gone through a kind of fall … Just like Adam and Eve, Job has partaken of the bitter tree, which will make it possible for him to comprehend the sweet tree'

  - where: 'note 29:7 “A seat at the gate”'
    claim: 'The Bible Dictionary: the city gate was often a place for public business, listing Deut. 21:19, Ruth 4:1–11 and Job 31:21'
    key: bd-gate
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gate?lang=eng'
    quote: 'The gate of a city was often a place for public business (Deut. 21:19; Ruth 4:1–11; 2 Sam. 3:27; 15:2; Job 31:21;'
  - where: 'note 29:7 “A seat at the gate”'
    claim: 'Ruth 4: Boaz settles the redemption of Elimelech''s land at the gate before ten elders'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'Then went Boaz up to the gate, and sat him down there … And he took ten men of the elders of the city … selleth a parcel of land, which was our brother Elimelech’s'
  - where: 'note 29:7 “A seat at the gate”'
    claim: 'One older reading: Job came to the tribunal, the council of elders, where he had a seat and a voice; the young retired, the old stood'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/29.htm'
    quote: 'When Job came hither to the meeting of the tribunal, or the council of the elders of the city, within which he had a seat and a voice, the young men hid themselves'
  - where: 'note 29:7 “A seat at the gate”'
    claim: 'A modern translation: "my seat in the square"; Job 31:21 "because I saw I had supporters at the gate"'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+31&version=NRSVUE'
    quote: 'if I have raised my hand against the orphan because I saw I had supporters at the gate;'
  - where: 'note 29:7 “A seat at the gate”'
    claim: 'A modern translation of 29:7 has "the square"'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+29&version=NRSVUE'
    quote: 'When I went out to the gate of the city, when I took my seat in the square,'

  - where: 'note 29:14 “Clothed with righteousness”'
    claim: 'The Hebrew uses lābaš twice in 29:14'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'וַ/יִּלְבָּשֵׁ֑/נִי'
  - where: 'note 29:14 “Clothed with righteousness”'
    claim: 'BDB: in Job 29:14 righteousness "clothed itself in me … became incarnate in me," as the Spirit clothed itself with Gideon (Judg. 6:34)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3847.htm'
    quote: 'Judges 6:34 and the spirit of ׳י clothed itself with Gideon, i.e. (GFM) took possession of him … Job 29:14 and it clothed itself in me, as it were, became incarnate in me.'
  - where: 'note 29:14 “Clothed with righteousness”'
    claim: 'BDB gathers the figurative use of righteousness worn: Isa. 59:17 (of the LORD), Ps. 132:9, Job 29:14'
    key: bdb
    url: 'https://biblehub.com/hebrew/3847.htm'
    quote: 'Isaiah 59:17 he (׳י) hath put on righteousness as a breastplate … said of men, 2Chronicles 6:41 (salvation), Psalm 132:9 (righteousness), Job 29:14 (id.)'
  - where: 'note 29:14 “Clothed with righteousness”'
    claim: 'BDB: ṣānîp is a turban, of the high priest (Zech. 3:5), figurative of righteousness at Job 29:14, a royal turban at Isa. 62:3'
    key: bdb
    url: 'https://biblehub.com/hebrew/6797.htm'
    quote: 'Zechariah 3:5 turban; — absolute ׳צ Zechariah 3:5 (twice in verse) (for high priest) and (figurative of righteousness) Job 29:14; construct צְנִיף מְלוּכָה Isaiah 62:3 Qr royal turban'

  - where: 'note 29:16 “He sought out the stranger''s cause”'
    claim: 'A modern translation: "I championed the cause of the stranger"'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+29&version=NRSVUE'
    quote: 'I was a father to the needy, and I championed the cause of the stranger.'
  - where: 'note 29:16 “He sought out the stranger''s cause”'
    claim: 'One older reading: the line means the cause of those Job did not know; "the cause I knew not" gives a tame, almost meaningless thought'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/29.htm'
    quote: 'The unknown he did not regard as those who were nothing to him, but went unselfishly and impartially into the ground of their cause. … for the translation causam quam nesciebam (Jer.) gives a tame, almost meaningless, thought.'
  - where: 'note 29:16 “He sought out the stranger''s cause”'
    claim: 'The Student Manual: Job sought out people to help; as a king he was obligated to defend those who relied on him and recovered stolen goods'
    key: ot-manual-job
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-3?lang=eng'
    quote: 'Perhaps this is the secret of Job’s perfection: he did not help only those who asked for his help; he sought out people to give help to.'
  - where: 'note 29:16 “He sought out the stranger''s cause”'
    claim: 'The Student Manual on verse 17: Job hunted down thieves and restored stolen goods'
    key: ot-manual-job
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-3?lang=eng'
    quote: 'As a king Job was obligated to defend those who relied on him for defense. For example, when Job found someone who had been plundered by robbers, he hunted down the thieves and used force, if necessary, to recover the stolen goods'

  - where: 'note 29:18 “Dying in his nest”'
    claim: 'The Hebrew of 29:18 has ḥôl'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'וְ֝/כַ/ח֗וֹל'
  - where: 'note 29:18 “Dying in his nest”'
    claim: 'BDB: ḥôl is sand, a simile of numberlessness, listing the days of Job, with the phoenix interpretation noted'
    key: bdb
    url: 'https://biblehub.com/hebrew/2344.htm'
    quote: 'usually sand of seashore, simile of numberlessness, vastness … of days of Job Job 29:18 (on interpretation = phoenix, see Di)'
  - where: 'note 29:18 “Dying in his nest”'
    claim: 'A modern translation: "like the phoenix," with the note "Or like sand"'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+29&version=NRSVUE'
    quote: 'and I shall multiply my days like the phoenix;(M) … 29.18 Or like sand'
  - where: 'note 29:18 “Dying in his nest”'
    claim: 'Stirling: Job still sees his prosperity and rank as evidence of God''s presence; all of it is inverted in chapter 30'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'He still sees his previous material prosperity and high societal rank as evidence of the presence of God in his life (see Job 29:1–6).'

  - where: 'note 29:23 “As for the latter rain”'
    claim: 'The Bible Dictionary on the early rain, winter rain and the latter rain in March and April, then little rain until September'
    key: bd-rain
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rain?lang=eng'
    quote: 'In Palestine rain begins to fall in October and continues in November and early December (the “early rain”). During January and February the vital “winter rain” soaks the soil and fills the cisterns. The biblical “latter rain” comes in March and April. Showers may occur in May, but after this, rain hardly ever falls, until the end of September.'
  - where: 'note 29:23 “As for the latter rain”'
    claim: 'A modern translation supplies "like dew" in v. 22, noting the Hebrew lacks it'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+29&version=NRSVUE'
    quote: 'and my word dropped upon them like dew. … 29.22 Heb lacks like dew'

  - where: 'note 29:24 “A smile for the hopeless”'
    claim: 'A modern translation of v. 24, with the note that the meaning of the Hebrew is uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+29&version=NRSVUE'
    quote: 'I smiled on them when they had no confidence, and the light of my countenance they did not extinguish. … 29.24 Meaning of Heb uncertain'

  - where: christ
    claim: 'Stirling: Job''s description of his former life is reminiscent of Christ in the premortal life (John 17:5; Abr. 3:22–28)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job’s description of his life before the calamities is reminiscent of Christ in the premortal life. Job was clothed with righteousness, gave light and counsel to others, dwelt among his fellows as a king'
  - where: christ
    claim: 'D&C 42:31: imparting to the poor is doing it unto the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/42?lang=eng'
    quote: 'And inasmuch as ye impart of your substance unto the poor, ye will do it unto me'
