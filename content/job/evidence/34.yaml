chapter: 34
claims:
  - where: setting
    claim: 'Chapter 34 is Elihu’s second speech, directed to the crowd, denouncing Job at its beginning and end'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Elihu directs his second speech (see Job 34) to the crowd, publicly denouncing Job for sin at both the beginning and end of his speech (see Job 34:1–9, 31–37).'
  - where: setting
    claim: 'Elihu calls Job by name to the crowd'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Elihu frequently calls Job by name, both to Job himself (see Job 33:1, 31; 37:14) and to the crowd (see Job 34:5–7, 35, 36; 35:16)'
  - where: setting
    claim: 'Elihu is shocked at what he regards as Job’s impiety and condemns him on different grounds from the friends; his main thesis is that God will not pervert judgment; Job makes no reply'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'Job 32–37 contains the speeches of Elihu, who is shocked at what he regards as impiety on the part of Job, and condemns him, though on different grounds from the “three friends.” His main thesis is that God will “not pervert judgment.” Job makes no reply to him.'
  - where: setting
    claim: 'The Joseph Smith Papers’ note to D&C 121:10’s source letter lists chapters 32–37 among the speeches that charged Job with transgression'
    key: jsp-letter-1839-03-20
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-and-edward-partridge-20-march-1839/8'
    quote: 'See Job chaps. 4–5, 8, 11, 15, 18, 20, 22, 25, 32–37.'
  - where: thread
    claim: 'The speech denounces Job at beginning and end (1–9, 31–37) with a portrait of God in the center (10–30)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'In the center of this speech, Elihu portrays his vision of God (see Job 34:10–30).'
  - where: section 2 plain
    claim: 'Modern rendering of 34:23–24 and 34:29: no time appointed to go before God in judgment; the mighty shattered without investigation; when he is quiet, who can condemn'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2034&version=NRSVUE'
    quote: 'For he has not appointed a time for anyone'
  - where: section 2 plain
    claim: 'Modern rendering of 34:24 and 34:29'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2034&version=NRSVUE'
    quote: 'He shatters the mighty without investigation … When he is quiet, who can condemn?'
  - where: section 3 plain
    claim: 'Modern rendering of 34:33 and 34:36'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2034&version=NRSVUE'
    quote: 'Will he then pay back to suit you … For you must choose and not I; … Would that Job were tried to the limit,'
  - where: 'note 34:5 “Job’s words quoted back”'
    claim: 'Elihu’s “I am righteous” repeats Job 13:18 verbatim and 23:10 and 27 in meaning; “God hath taken away my judgment” is 27:2'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/34.htm'
    quote: 'Job has said verbatim in Job 13:18, and according to meaning, Job 23:10; Job 27:7, and throughout; that He puts aside his right (the right of the guiltless, and therefore not of one coming under punishment): Job 27:2.'
  - where: 'note 34:5 “Job’s words quoted back”'
    claim: 'Verse 6: although right is on his side, Job must be accounted a liar because his affliction belies his testimony'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/34.htm'
    quote: 'although right is on his side, yet he must be accounted a liar, since his own testimony is belied by the wrathful form of his affliction'
  - where: 'note 34:5 “Job’s words quoted back”'
    claim: 'The idea of verse 6 is Job’s own at 9:20'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/34.htm'
    quote: 'we find in idea in Job 9:20'
  - where: 'note 34:5 “Job’s words quoted back”'
    claim: 'Elihu names Job before the crowd'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Elihu frequently calls Job by name, both to Job himself (see Job 33:1, 31; 37:14) and to the crowd (see Job 34:5–7, 35, 36; 35:16)'
  - where: 'note 34:9 “What profit in delighting in God?”'
    claim: 'Job never said verse 9 expressly; 9:22 and his complaints about the uneven lot of men (21:7; 24:1) are the premises'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/34.htm'
    quote: 'Job has nowhere expressly said this, but certainly the declaration in Job 9:22, in connection with the repeated complaints concerning the anomalous distribution of human destinies (vid., especially Job 21:7, Job 24:1), are the premises for such a conclusion.'
  - where: 'note 34:9 “What profit in delighting in God?”'
    claim: 'In verse 7 Elihu is harsher than the friends and puts words in Job’s mouth found nowhere verbatim'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/34.htm'
    quote: 'That Elihu, in Job 34:7, is more harsh against Job than the friends ever were (comp. e.g., the well-measured reproach of Eliphaz, Job 15:4), and that he puts words into Job''s moth which occur nowhere verbatim in his speeches'
  - where: 'note 34:9 “What profit in delighting in God?”'
    claim: 'To drink scorn like water is to give oneself to mockery with delight'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/34.htm'
    quote: '"to drink scorn (here: blasphemy) like water," is, according to Job 15:16, equivalent to to give one''s self up to mockery with delight, and to find satisfaction in it.'
  - where: 'note 34:9 “What profit in delighting in God?”'
    claim: 'Elihu’s quarrel with Job’s talk of profit goes to the heart of the book and back to Satan’s charge of a transactional relationship (1:9)'
    key: ot-minute-job-35
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-35'
    quote: 'This is an important issue in the book, and it takes us back to the conversation between Satan and God in Job 2, in which Satan accused Job of having a transactional relationship with God.'
  - where: 'note 34:9 “What profit in delighting in God?”'
    claim: 'Elihu’s objection to Job’s talk of profit cuts to the heart of an important theme'
    key: ot-minute-job-35
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-35'
    quote: 'Elihu took issue with Job’s talk of profit, and this insightfully cuts to the heart of an important theme in Job.'
  - where: 'note 34:12 “God will not pervert judgment”'
    claim: 'Elihu’s main thesis is that God will not pervert judgment; he condemns Job on different grounds from the friends'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'who is shocked at what he regards as impiety on the part of Job, and condemns him, though on different grounds from the “three friends.” His main thesis is that God will “not pervert judgment.”'
  - where: 'note 34:12 “God will not pervert judgment”'
    claim: 'No one gave God His charge, so He is the Creator, and all life has its life from His spirit and breath (32:8; 33:4; Ps. 104:29; Eccl. 12:7)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/34.htm'
    quote: 'the one giving the charge ought to be the lord of him who receives the commission, and therefore the Creator of the world. This is just God alone, by whose'
  - where: 'note 34:12 “God will not pervert judgment”'
    claim: 'Verse 12 puts the claim of verse 11 in the negative, and Bildad’s question at 8:3 is compared'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/34.htm'
    quote: 'the counter-assertion of Job 34:11 is repeated, but negatively expressed (comp. Job 8:3).'
  - where: 'note 34:12 “God will not pervert judgment”'
    claim: 'Ps. 19:9 (the footnote at 34:12): the judgments of the LORD are true and righteous'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/19?lang=eng'
    quote: 'true and righteous altogether'
  - where: 'note 34:12 “God will not pervert judgment”'
    claim: 'Ps. 104:29 and Eccl. 12:7 for the withdrawing of the breath; spirit and breath give life to men and animals (32:8; 33:4)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/34.htm'
    quote: 'the animal world as well as the world of men (vid., Job 32:8; Job 33:4) has its life, Job 34:14 : if He should direct His heart … draw in (אסף as Psalm 104:29; comp. for the matter Ecclesiastes 12:7'
  - where: 'note 34:12 “God will not pervert judgment”'
    claim: 'One older reading: Elihu argues from creation to justice; the world is God''s by free creative appointment, and His sustaining breath shows a love that pledges the righteousness of His rule'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/34.htm'
    quote: 'God does not act wrongly, for the government of the world is not a duty imposed upon Him from without, but a relation entered into freely by Him … this love, as the perfect opposite of sovereign caprice, is a pledge for the absolute righteousness of the divine rule.'
  - where: 'note 34:23 “No day in court”'
    claim: 'A modern translation reads verse 23 as God appointing no time for anyone to go before Him in judgment, and verse 24 “without investigation”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2034&version=NRSVUE'
    quote: 'For he has not appointed a time for anyone'
  - where: 'note 34:23 “No day in court”'
    claim: 'Verse 24 in the modern translation: “without investigation”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2034&version=NRSVUE'
    quote: 'He shatters the mighty without investigation'
  - where: 'note 34:23 “No day in court”'
    claim: 'The verb does not mean “lay upon” here but to direct attention; God need not observe a man long before judgment, knowing him before any investigation, an allusion to Job’s longing to appear before God’s tribunal'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/34.htm'
    quote: 'He, the all-seeing One, needs not to observe him long that he should enter into judgment with God - He knows him thoroughly before any investigation takes place, which is not said without allusion to Job''s vehement longing to be able to appear before God''s tribunal.'
  - where: 'note 34:23 “No day in court”'
    claim: 'The verb with ʿal does not here mean to lay upon'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/34.htm'
    quote: 'does not here signify: to lay upon (Saad., Gecat.), but as Job 37:15, and as with אל (Job 34:14) or בּ (Job 23:6); to direct one''s attention'
  - where: 'note 34:31 “The confession Elihu wants”'
    claim: 'A modern translation renders verse 31 as a question'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2034&version=NRSVUE'
    quote: 'For has anyone said to God,'
  - where: 'note 34:31 “The confession Elihu wants”'
    claim: 'Verses 31–37 are where Elihu returns to denouncing Job'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'publicly denouncing Job for sin at both the beginning and end of his speech (see Job 34:1–9, 31–37).'
  - where: 'note 34:35 “Without knowledge”'
    claim: 'Elihu called Job’s words rebellion and without knowledge; there was some truth in it, since God said the same at 38:2, but God also said Job spoke the thing that is right'
    key: ot-minute-job-36
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-36'
    quote: 'There was some truth to this accusation since God Himself said that Job had spoken “words without knowledge” (38:2).'
  - where: 'note 34:35 “Without knowledge”'
    claim: 'God was compassionate and said Job had spoken the thing that is right more than his friends'
    key: ot-minute-job-36
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-36'
    quote: 'God was understanding and compassionate and even said that Job had “spoken of me the thing that is right” more so than his friends (42:7).'
  - where: 'note 34:35 “Without knowledge”'
    claim: 'Job retracted his words without knowledge (42:3)'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'Their suggestions wring from him “words without knowledge” (38:2), which he afterwards retracts (42:3)'
  - where: 'note 34:35 “Without knowledge”'
    claim: 'A modern translation: “Would that Job were tried to the limit, because his answers are those of the wicked”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2034&version=NRSVUE'
    quote: 'Would that Job were tried to the limit, … because his answers are those of the wicked.'
  - where: 'note 34:35 “Without knowledge”'
    claim: 'Elihu, whose speeches echo the whirlwind, stands in Tanner’s view under the same divine disapproval as the other comforters'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'Even Elihu, the fourth and final comforter, whose speeches echo those issuing from the whirlwind, had no impact on Job and, in my opinion, stands under the same divine disapproval as the other comforters.'
  - where: christ
    claim: 'Elihu’s God judges without bringing anyone before Him, unlike the God who sent Christ to be lifted up that men might be judged (3 Ne. 27:14–15)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'This “God” seems far removed from the One who sent Jesus Christ to be lifted up on the cross that men might be lifted up to God to be judged for their works (see 3 Nephi 27:14–15).'
  - where: christ
    claim: '3 Ne. 27:14: men stand before Christ to be judged of their works'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/27?lang=eng'
    quote: 'that as I have been lifted up by men even so should men be lifted up by the Father, to stand before me, to be judged of their works, whether they be good or whether they be evil—'
  - where: christ
    claim: 'Affliction does not necessarily mean a person has sinned'
    key: gs-job
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/job?lang=eng'
    quote: 'The book clarifies that having afflictions does not necessarily mean that a person has sinned.'
