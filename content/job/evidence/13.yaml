chapter: 13
claims:
  - where: setting
    claim: 'In chapter 13 Job challenges his friends directly and repeats his challenge to God'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'In this chapter, Job directly challenges his friends and repeats his challenge to God.'
  - where: setting
    claim: 'Job sees the conflict between him and God as a court case'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job sees the conflict between him and God like a court case, and he accuses his friends of being respecters of persons'
  - where: setting
    claim: 'Come, Follow Me takes “Yet will I trust in him” as the title of the week on Job'
    key: cfm-ot-2026-33
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/33?lang=eng'
    quote: '“August 10–16. ‘Yet Will I Trust in Him’: Job 1–3; 12–14; 19; 21–24; 38–40; 42,”'
  - where: thread
    claim: 'Job asks the friends to leave him alone so he can make his case to God, and then turns from Zophar to address God directly'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job then turns from Zophar and addresses God directly. He demands that God “withdraw thine hand far from me: and let not thy dread make me afraid” (verse 21).'
  - where: thread
    claim: 'At the end of the chapter Job’s bold tone passes into the elegiac tone continued in chapter 14'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/13.htm'
    quote: 'Since God whom he calls upon does not appear, Job''s defiance is changed to timidity. The elegiac tone, into which his bold tone has passed, is continued in Job 14.'
  - where: section 1 plain
    claim: 'Modern rendering of 13:4 and 13:12: “whitewash with lies,” “maxims are proverbs of ashes; defenses of clay”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+13&version=NRSVUE'
    quote: 'As for you, you whitewash with lies; all of you are worthless physicians. … Your maxims are proverbs of ashes; your defenses are defenses of clay.'
  - where: section 2 plain
    claim: 'Modern rendering of 13:19: “Who is there who will contend with me?”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+13&version=NRSVUE'
    quote: 'Who is there who will contend with me? For then I would be silent and die.'
  - where: section 2 plain
    claim: 'Verse 14 as “why should I cling to my life? I will put my life in my hands”; verse 15 as “I will wait for Him”'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/13.htm'
    quote: 'I will not eagerly make my flesh safe, and will take my soul in my hand … behold, He will slay me, I wait for Him'
  - where: section 3 plain
    claim: 'Modern rendering of 13:25–28: windblown leaf, reap the iniquities of my youth, set a bound to the soles of my feet'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+13&version=NRSVUE'
    quote: 'Will you frighten a windblown leaf and pursue dry chaff? For you write bitter things against me and make me reap the iniquities of my youth. You put my feet in the stocks and watch all my paths; you set a bound to the soles of my feet.'
  - where: 'note 13:4 “Plasterers of lies, worthless physicians”'
    claim: 'Hebrew “forgers of lies” is ṭōpĕlê šeqer, falsehood-plasterers'
    key: bdb
    url: 'https://biblehub.com/hebrew/2950.htm'
    quote: 'טִפְלֵי שֶׁקֶר Job 13:4 ye are falsehood-plasterers ("" רֹפְאֵי אֱלִל)'
  - where: 'note 13:4 “Plasterers of lies, worthless physicians”'
    claim: 'A modern translation renders “you whitewash with lies; all of you are worthless physicians”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+13&version=NRSVUE'
    quote: 'As for you, you whitewash with lies; all of you are worthless physicians.'
  - where: 'note 13:4 “Plasterers of lies, worthless physicians”'
    claim: 'The friends came to mourn but gave a diagnosis and a cure instead of trying to understand; their diagnoses and cures were wrong, and love would have healed better than doctrine'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Rather than attempt to understand what Job has experienced (a prerequisite to mourning with him), they have provided their diagnosis and cure. Aside from the fact that their diagnoses and cures were wrong, it was also not what Job needed.'
  - where: 'note 13:4 “Plasterers of lies, worthless physicians”'
    claim: 'The Church’s footnote at “physicians” points to Job 16:2 and D&C 121:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/13?lang=eng'
    quote: 'Job 16:2; D&C 121:10 (7–11).'
  - where: 'note 13:8 “Partial for God”'
    claim: 'Job accuses the friends of being respecters of persons, siding with God before hearing the case, and saying untrue things to defend God’s honor'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'In other words, he accuses them of siding with God before they hear the arguments or the case. He accuses them of saying things that are untrue in order to defend God’s honor.'
  - where: 'note 13:8 “Partial for God”'
    claim: 'Yākaḥ means to argue before (13:3) and to prove one’s ways unto (13:15)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3198.htm'
    quote: 'with אל person unto Job 13:15; so argue before Job 13:3'
  - where: 'note 13:8 “Partial for God”'
    claim: 'Yākaḥ at 13:10 (twice) is God’s correcting or rebuking'
    key: bdb
    url: 'https://biblehub.com/hebrew/3198.htm'
    quote: '6 correct, rebuke, of God, absolute Habakkuk 1:12; with accusative of person Psalm 141:5; Job 13:10 (twice in verse)'
  - where: 'note 13:8 “Partial for God”'
    claim: 'The same verb (H3198) stands in 13:3, 13:10 and 13:15'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: '<w lemma="3198" n="0" morph="HVhi1cs" id="18vkx">אוֹכִֽיחַ</w>'
  - where: 'note 13:8 “Partial for God”'
    claim: 'Job returns to some confidence in God’s justice when he says God will surely rebuke the friends'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'He returns to some confidence in God’s justice, stating that God “will surely rebuke” the friends for their lies (Job 13:10)'
  - where: 'note 13:14 “My flesh in my teeth”'
    claim: 'To carry one’s flesh in one’s teeth is a proverbial phrase for clinging to one’s life as a beast holds its prey; found nowhere else'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/13.htm'
    quote: 'be intent upon the maintenance of his life, as a wild beast upon the preservation of its prey, by holding it between its teeth (mordicus tenet) and carrying it away? This is a proverbial phrase which does not occur elsewhere'
  - where: 'note 13:14 “My flesh in my teeth”'
    claim: 'To put one’s life in one’s hand means elsewhere to risk one’s life without fear of death (Judg. 12:3; 1 Sam. 19:5; 28:21); Job will not cling to his life but expose himself to death'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/13.htm'
    quote: 'signifies everywhere else (Judges 12:3; 1 Samuel 19:5; 1 Samuel 28:21) as much as to risk one''s life without fear of death … I will not eagerly make my flesh safe, and will take my soul in my hand, i.e., calmly and bravely expose myself to the danger of death.'
  - where: 'note 13:14 “My flesh in my teeth”'
    claim: 'A modern translation follows the Greek and makes 13:14 a statement; its note gives the Hebrew as a question'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+13&version=NRSVUE'
    quote: '13.14 Gk: Heb Why should I take . . . in my hand?'
  - where: 'note 13:14 “My flesh in my teeth”'
    claim: 'Job vows to entrust his life to God though heaven might kill him for it'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'Though heaven might kill him for so doing, Job vows to entrust his life in the hands of a God whom he believes prefers honesty to hypocrisy'
  - where: 'note 13:15 “Though he slay me”'
    claim: 'The Guide to the Scriptures gives the line as characteristic of Job’s unfailing faith'
    key: gs-job
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/job?lang=eng'
    quote: 'Job’s unfailing faith is characterized by such exclamations as “Though he slay me, yet will I trust in him” (Job 13:15).'
  - where: 'note 13:15 “Though he slay me”'
    claim: 'The Student Manual quotes a reading that makes the line a refutation of the adversary’s argument and this chapter the high point of the book'
    key: ot-manual-job
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-3?lang=eng'
    quote: 'Job’s simple but profound, ‘though he slay me, yet will I trust in him’ becomes then an absolute refutation of every argument of the adversary about why men serve the Lord … it is in this, the thirteenth chapter … that for me the high point of the book of Job is reached.'
  - where: 'note 13:15 “Though he slay me”'
    claim: 'The written text (ketiv) of 13:15 has לא “not”; the reading (qere) is לוֹ “to him”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: '<w type="x-ketiv" lemma="3808" morph="HTn" id="184U9">לא</w><note type="variant"><catchWord>לא</catchWord><rdg type="x-qere"><w lemma="l" morph="HR/Sp3ms" id="18Vvg">ל֣/וֹ</w>'
  - where: 'note 13:15 “Though he slay me”'
    claim: 'This is one of eighteen passages where the written text has lōʾ and the reading lô'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/13.htm'
    quote: 'This is one of eighteen passages in which the Chethib is לא and the Keri לו; Job 6:21 is another.'
  - where: 'note 13:15 “Though he slay me”'
    claim: 'The Mishnah (Sotah) already says the passage may be explained “I hope in Him” or “I hope not”'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/13.htm'
    quote: 'The Mishna b. Sota, 27, b, refers to the passage with reference to the question whether Job had served God from love or fear … as the present passage may be explained, "I hope in Him," or "I hope not."'
  - where: 'note 13:15 “Though he slay me”'
    claim: 'The Targum, Syriac and Jerome’s Vulgate favor lô, and the English and other versions follow the Vulgate'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/13.htm'
    quote: 'Among the ancient versions, the Targ., Syr., and Jerome (etiamsi occiderit me, in ipso sperabo) are in favour of לו. This translation of the Vulgate is followed by the French, English, Italian, and other versions.'
  - where: 'note 13:15 “Though he slay me”'
    claim: 'A modern translation follows the written text and keeps the traditional rendering in its margin'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+13&version=NRSVUE'
    quote: '15 See, he will kill me; I have no hope; but I will defend my ways to his face. … 13.15 Or Though he kill me, yet I will trust in him'
  - where: 'note 13:15 “Though he slay me”'
    claim: 'The verb behind “trust” is yāḥal, wait for, hope for; absolute at 13:15'
    key: bdb
    url: 'https://biblehub.com/hebrew/3176.htm'
    quote: '2 wait for = hope for, followed by לְ … absolute hope, Job 6:11; Job 13:15; Psalm 71:14.'
  - where: 'note 13:15 “Though he slay me”'
    claim: 'One older reading weighs both, keeps lô, and renders “He will slay me, I wait for Him,” resigning himself to the worst while still proving his ways before God'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/13.htm'
    quote: 'The meaning, then, which agrees both with the context and with the reality, is: behold, He will slay me, I wait for Him, i.e., I wait what He may do, even to smite with death, only I will … prove my ways to Him, even before His face.'
  - where: 'note 13:15 “Though he slay me”'
    claim: '“Maintain mine own ways” means to argue his case before God'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job intends to “maintain my own ways before him” (verse 15), or rather, to argue his case before God.'
  - where: 'note 13:15 “Though he slay me”'
    claim: 'Yākaḥ at 13:15 means to prove one’s ways unto God'
    key: bdb
    url: 'https://biblehub.com/hebrew/3198.htm'
    quote: '3 shew to be right, prove, with accusative of thing and על person against Job 19:5; with אל person unto Job 13:15'
  - where: 'note 13:15 “Though he slay me”'
    claim: 'Job’s shocking boldness and stunning trust together in 13:14–16'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'Such is the shocking boldness of Job before his friends and his Lord, and such is his stunning trust in a God who, Job knows, does not want man to come before Him as a hypocrite'
  - where: 'note 13:16 “No hypocrite comes before Him”'
    claim: 'The King James “hypocrite” is ḥānēp, godless man'
    key: bdb
    url: 'https://biblehub.com/hebrew/2611.htm'
    quote: 'profane, godless: of persons … as substantive godless man Isaiah 9:16 ("" מרע) Job 8:13; Job 13:16'
  - where: 'note 13:16 “No hypocrite comes before Him”'
    claim: 'A modern translation renders “the godless shall not come before him”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+13&version=NRSVUE'
    quote: '16 This will be my salvation, that the godless shall not come before him.'
  - where: 'note 13:16 “No hypocrite comes before Him”'
    claim: 'One older reading: a godless man would not come forward to answer before God; “salvation” here is victory in a contest for the right, and Job has as good as won by desiring to defend himself'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/13.htm'
    quote: 'It means here salvation, as victory in a contest for the right. Job means that he has already as good as won the contest, by so urgently desiring to defend himself before God.'
  - where: 'note 13:16 “No hypocrite comes before Him”'
    claim: 'God does not want man to come before Him as a hypocrite, feigning to comprehend suffering he cannot fathom'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'his stunning trust in a God who, Job knows, does not want man to come before Him as a hypocrite, feigning to comprehend suffering that he cannot fathom.'
  - where: 'note 13:16 “No hypocrite comes before Him”'
    claim: 'The friends’ advice would have forced Job to live a lie by confessing he deserved his affliction'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'To follow their counsel would have forced Job to live a lie by confessing to the Lord that he felt he deserved his affliction—which he did not, and should not feel.'
  - where: 'note 13:16 “No hypocrite comes before Him”'
    claim: 'The chapter heading reads “He also will be my salvation” as testimony'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/13?lang=eng'
    quote: 'Job testifies of his confidence in the Lord and says, Though He slay me, yet will I trust in Him, and He also will be my salvation'
  - where: 'note 13:26 “The iniquities of my youth”'
    claim: 'The Church’s footnote at “iniquities” points to 1 Kgs. 17:18, Ps. 25:7 and D&C 58:42'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/13?lang=eng'
    quote: '1 Kgs. 17:18; Ps. 25:7; D&C 58:42.'
  - where: 'note 13:26 “The iniquities of my youth”'
    claim: 'One older reading: Job, having prayed as in Ps. 25:7, can only see his affliction as punishment for youthful sins already forgiven; forgiven sins are no more the object of divine judgment, and his trial has obscured God’s loving-kindness to him'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/13.htm'
    quote: 'So long as a man remains an object of the divine mercy, his sins that have been once forgiven are no more the object of divine judgment. But Job can understand his affliction only as an additional punishment. The conflict of temptation through which he is passing has made God''s loving-kindness obscure to him.'
  - where: 'note 13:26 “The iniquities of my youth”'
    claim: 'Job, who has prayed Ps. 25:7, regards his affliction as the inheritance of the sins of his youth, whose forgiveness he implored'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/13.htm'
    quote: 'he can only regard his affliction as the inheritance (i.e., entailed upon him by sins not repented of) of the sins of his youth … He does not know how to reconcile with the justice of God the fact that He again records against him sins, the forgiveness of which he implores soon after their commission'
  - where: 'note 13:26 “The iniquities of my youth”'
    claim: 'Job invites God to show him his current sins, if any, while admitting iniquities in his youth'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'inviting God to make him understand his current sins, if any, while admitting to iniquities in his youth (see Job 13:23-26).'
  - where: 'note 13:27 “Feet in the stocks”'
    claim: 'The stocks are the block of wood in which a criminal’s feet were fastened (the instrument of Acts 16:24); Job feels watched like a criminal reserved for execution'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/13.htm'
    quote: 'He appears to himself to be like a prisoner whose feet are forced into the holes of a סד, i.e., the block or log of wood in which the feet of a criminal are fastened … by which Acts 16:24, ξύλον equals ποδοκάκη, is rendered'
  - where: 'note 13:27 “Feet in the stocks”'
    claim: 'Job seems to himself a criminal closely watched so he cannot escape the execution reserved for him'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/13.htm'
    quote: 'He seems to himself like a criminal whose steps are closely watched … and may not avoid the execution for which he is reserved by effecting an escape by flight.'
  - where: 'note 13:27 “Feet in the stocks”'
    claim: '“Settest a print upon the heels” is God marking lines around the soles of Job’s feet so they cannot move beyond them'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/13.htm'
    quote: 'Thou makest to thyself furrows (or also: lines) round the soles of my feet, so that they cannot move beyond the narrow boundaries marked out by thee.'
  - where: 'note 13:27 “Feet in the stocks”'
    claim: 'A modern translation renders “you set a bound to the soles of my feet”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+13&version=NRSVUE'
    quote: 'You put my feet in the stocks and watch all my paths; you set a bound to the soles of my feet.'
  - where: 'note 13:27 “Feet in the stocks”'
    claim: 'Verse 28 begins a circumstantial clause about the one God fastens in as a criminal, i.e. Job'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/13.htm'
    quote: 'With והוּא, Job 13:28, a circumstantial clause begins: While he whom Thou thus fastenest in as a criminal, etc.'
  - where: christ
    claim: 'One Latter-day Saint reading sets 13:15 beside the Savior in Gethsemane'
    key: farley-job-parallels
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/10/job-parallels-with-the-savior?lang=eng'
    quote: 'this great prophet (like the Savior he served) had an incredible trust in God: “Though he slay me, yet will I trust in him” (Job 13:15). Well might this thought have passed through the mind of the Savior as he sensed the withdrawing of the Father’s spirit in Gethsemane.'
  - where: christ
    claim: 'Questions can coexist with faith until they are answered; regardless of what happens we can say “Yet will I trust in him”'
    key: cfm-ot-2026-33
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/33?lang=eng'
    quote: 'But the book of Job teaches that until they are answered, questions can coexist with faith. And regardless of what happens in the meantime, we can say of our Lord, “Yet will I trust in him” (Job 13:15).'
  - where: christ
    claim: 'Job trusts a God who prefers honesty to hypocrisy'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'Job vows to entrust his life in the hands of a God whom he believes prefers honesty to hypocrisy'
