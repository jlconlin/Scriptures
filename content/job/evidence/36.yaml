chapter: 36
claims:
  - where: when
    claim: 'Job 36–37 is Elihu’s fourth speech'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Elihu begins his fourth speech (see Job 36–37) with an astounding claim'
  - where: setting
    claim: 'Job 36–37 is Elihu’s final speech'
    key: ot-minute-job-36
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-36'
    quote: 'Job 36–37 represents Elihu’s final speech.'
  - where: setting
    claim: 'Elihu condemns Job on different grounds from the friends; his thesis is that God will not pervert judgment; Job makes no reply; the friends read the sufferings as a sign of God’s anger and punishment for sin'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'they give their interpretation, that they are a sign of God’s anger and a punishment for sin … and condemns him, though on different grounds from the “three friends.” His main thesis is that God will “not pervert judgment.” Job makes no reply to him.'
  - where: setting
    claim: 'For Elihu, suffering shows people their transgressions and opens their ears; Job could learn from his suffering as God intended'
    key: ot-minute-job-36
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-36'
    quote: 'For Elihu, if Job would just accept his suffering, then he could learn from it as God intended.'
  - where: setting
    claim: 'The speech emphasizes suffering as divine discipline and God’s power in nature'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'the use of suffering as temporary divine discipline, God’s inscrutable and indisputable ways, and the presence of God’s voice and power in nature.'
  - where: setting
    claim: 'Elihu then proclaims God’s power over creation'
    key: ot-minute-job-36
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-36'
    quote: 'Elihu began to proclaim God’s power and knowledge, particularly by emphasizing God’s power over creation.'
  - where: thread
    claim: 'Elihu’s argument: God shows the afflicted their transgressions, the obedient prosper, the disobedient perish; through suffering He delivers the poor; Elihu warns Job he has chosen iniquity; then God is not to be taught and His works cannot be understood'
    key: ot-minute-job-36
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-36'
    quote: 'Elihu warned Job about the folly of choosing to remain stubborn about his own standing before God … Elihu emphasized that God is not to be taught (36:22–23) and that humanity cannot attempt to understand God or His creative works (36:24–33).'
  - where: thread
    claim: 'A modern translation: Job is taken up with the case of the wicked (v. 17); God governs peoples by the storm (v. 31)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2036&version=NRSVUE'
    quote: '17 “But you are obsessed with the case of the wicked; … 31 For by these he governs peoples; he gives food in abundance.'
  - where: section 2 plain
    claim: 'Renderings that depart from the KJV: transgressions behaving arrogantly, instruction, the godless cherish anger, life ends in shame, delivered by affliction'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2036&version=NRSVUE'
    quote: 'their transgressions, that they are behaving arrogantly. … 13 “The godless in heart cherish anger; … and their life ends in shame. 15 He delivers the afflicted by their affliction and opens their ear by adversity.'
  - where: section 2 plain
    claim: 'The Hebrew of v. 11 “pleasures” is pleasantness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/36?lang=eng'
    quote: '11b “pleasures”: HEB pleasantness.'
  - where: section 3 plain
    claim: 'Verse 16: out of the jaws of distress'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/36.htm'
    quote: '16 And He even bringeth thee out of the jaws of distress'
  - where: section 3 plain
    claim: 'Verse 17 in a modern translation: Job is taken up with the case of the wicked'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2036&version=NRSVUE'
    quote: '17 “But you are obsessed with the case of the wicked;'
  - where: section 4 plain
    claim: 'Verses 22–31 in a modern translation: teacher, prescribed his way, draws up the drops, pavilion, governs peoples'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2036&version=NRSVUE'
    quote: '22 See, God is exalted in his power; who is a teacher like him? 23 Who has prescribed for him his way, … 27 For he draws up the drops of water; he distills his mist in rain,'
  - where: section 4 plain
    claim: 'Verse 33: the thunder announces God, and the cattle sense the approaching storm'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/36.htm'
    quote: 'His thunder-clap announces Him (who is about to reveal Himself as a merciful judge), the cattle even (announce) Him at His first rising up, since at the approach of a storm they herd together affrighted and seek shelter.'
  - where: section 4 plain
    claim: 'A modern translation renders the second line of v. 33 very differently from the KJV'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2036&version=NRSVUE'
    quote: '33 Its crashing tells about him; he is jealous with anger against iniquity.'
  - where: 'note 36:4 “Perfect in knowledge”'
    claim: 'Job 36:4 has tĕmîm dēʿôt (H8549, H1844)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: '<w lemma="8549" morph="HAamsc" id="18rpM">תְּמִ֖ים</w> <w lemma="1844" morph="HNcfpa" id="18GYX">דֵּע֣וֹת</w>'
  - where: 'note 36:4 “Perfect in knowledge”'
    claim: 'Job 37:16 has tĕmîm dēʿîm (H8549, H1843)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: '<w lemma="8549" morph="HAamsc" id="18fix">תְּמִ֣ים</w> <w lemma="1843" n="0" morph="HNcmpa" id="18zu5">דֵּעִֽים</w>'
  - where: 'note 36:4 “Perfect in knowledge”'
    claim: 'Job makes no reply to Elihu'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'His main thesis is that God will “not pervert judgment.” Job makes no reply to him.'
  - where: 'note 36:4 “Perfect in knowledge”'
    claim: 'A Latter-day Saint reading: Elihu puts himself alongside God, so his words are God’s; Job must decide whether to accept him as a true prophet or wait on the Lord'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Thus, he puts himself alongside and equal to God in a sense. The implication is that since Elihu shares common knowledge with God, his words are the words of God. Job must therefore decide whether to [Page 161]accept Elihu as a true prophet or continue to wait on the Lord.'
  - where: 'note 36:4 “Perfect in knowledge”'
    claim: 'Elihu was not lacking in confidence'
    key: ot-minute-job-36
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-36'
    quote: 'Elihu was certainly not lacking in his confidence to answer Job, stating, “He that is perfect knowledge is with thee” (Job 36:4).'
  - where: 'note 36:15 “Delivered by affliction”'
    claim: 'A modern translation reads “by their affliction … by adversity”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2036&version=NRSVUE'
    quote: '15 He delivers the afflicted by their affliction and opens their ear by adversity.'
  - where: 'note 36:15 “Delivered by affliction”'
    claim: 'It is through suffering that God delivers the poor and opens their ears'
    key: ot-minute-job-36
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-36'
    quote: 'It is through suffering that “he delivereth the poor” and “openeth their ears” (36:15).'
  - where: 'note 36:15 “Delivered by affliction”'
    claim: 'The friends took the sufferings as a sign of God’s anger and punishment for sin'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'they give their interpretation, that they are a sign of God’s anger and a punishment for sin'
  - where: 'note 36:15 “Delivered by affliction”'
    claim: 'For Elihu suffering was kindness, since God then shows people their transgressions (36:9)'
    key: ot-minute-job-36
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-36'
    quote: 'For Elihu, the suffering of the wicked was kindness since “then he sheweth them their work, and their transgressions that they have exceeded.'
  - where: 'note 36:15 “Delivered by affliction”'
    claim: 'Elihu’s teachings applied generally have wisdom; his error, shared with the friends, is assuming the wicked and the suffering are the same people'
    key: ot-minute-job-36
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-36'
    quote: 'If we take Elihu’s teachings and apply them generally, not to Job’s specific situation, there is a lot of wisdom in them. … The problem that Elihu and Job’s friends shared is that they assumed that the wicked and the suffering are the same people.'
  - where: 'note 36:15 “Delivered by affliction”'
    claim: 'The Church draws from the book that the Lord may use affliction for experience, discipline, instruction and punishment'
    key: gs-job
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/job?lang=eng'
    quote: 'The book clarifies that having afflictions does not necessarily mean that a person has sinned. The Lord may use affliction for experience, discipline, and instruction as well as for punishment (D&C 122).'
  - where: 'note 36:15 “Delivered by affliction”'
    claim: 'The book says at the start that Job did not sin in all this'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/1?lang=eng'
    quote: 'In all this Job sinned not, nor charged God foolishly.'
  - where: 'note 36:21 “Iniquity chosen over affliction”'
    claim: 'Elihu warns Job against choosing to remain stubborn about his standing before God'
    key: ot-minute-job-36
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-36'
    quote: 'Elihu warned Job about the folly of choosing to remain stubborn about his own standing before God'
  - where: 'note 36:21 “Iniquity chosen over affliction”'
    claim: 'A modern translation of v. 21: “because of that you have been tried by affliction”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2036&version=NRSVUE'
    quote: 'because of that you have been tried by affliction.'
  - where: 'note 36:21 “Iniquity chosen over affliction”'
    claim: 'A modern translation of vv. 17–18'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2036&version=NRSVUE'
    quote: '17 “But you are obsessed with the case of the wicked; judgment and justice seize you. 18 Beware that wrath does not entice you into scoffing, and do not let the greatness of the ransom turn you aside.'
  - where: 'note 36:21 “Iniquity chosen over affliction”'
    claim: 'One older reading: the ransom (as in 33:24) is humble submission, the price of restoration; Elihu warns Job not to be turned aside'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/36.htm'
    quote: 'כּפר signifies reconciliation or expiation, as Job 33:24. Elihu admonishes Job … nor to be allured from the right way by the ransom which is required of him as the price of restoration to happiness, viz., humble submission to the divine chastisement'
  - where: 'note 36:21 “Iniquity chosen over affliction”'
    claim: 'One older reading of v. 21: Job presses toward the Judge’s tribunal instead of humbling himself, and has preferred iniquity to resigned endurance'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/36.htm'
    quote: 'And yet Job presses forward on to the tribunal of the terrible Judge, instead of humbling himself under His mighty hand. Oh that in time he would shrink back from this absolute wickedness (און), for he has given it the preference before עני, quiet, resigned endurance.'
  - where: 'note 36:21 “Iniquity chosen over affliction”'
    claim: 'Elihu wanted Job to accept his suffering and learn from it'
    key: ot-minute-job-36
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-36'
    quote: 'telling him to “take heed, regard not iniquity: for this hast thou chosen rather than affliction” (36:21). For Elihu, if Job would just accept his suffering, then he could learn from it as God intended.'
  - where: 'note 36:21 “Iniquity chosen over affliction”'
    claim: 'Job was responsible for his response; some truth in the charge (38:2); yet God said Job spoke what is right; Job spoke from experience, desiring to restore his relationship with God, and came face to face with God'
    key: ot-minute-job-36
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-36'
    quote: 'he was still responsible for how he responded to his afflictions. … Job spoke from his experience, and he spoke with a desire to mend and restore his relationship with God. Even though that journey had had missteps and dead ends, Job eventually found himself face to face to with God.'
  - where: 'note 36:29 “Thunder from His pavilion”'
    claim: 'The word behind “tabernacle” in 36:29 is sukkāh (H5521)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: '<w lemma="5521" n="0" morph="HNcfsc/Sp3ms" id="185Zv">סֻכָּתֽ/וֹ</w>'
  - where: 'note 36:29 “Thunder from His pavilion”'
    claim: 'BDB: sukkāh is properly a booth of interwoven boughs'
    key: bdb
    url: 'https://biblehub.com/hebrew/5521.htm'
    quote: 'סֻכָּה noun feminine thicket, booth (properly of inter-woven boughs compare Nehemiah 8:15)'
  - where: 'note 36:29 “Thunder from His pavilion”'
    claim: 'BDB: sukkāh is a booth of interwoven boughs, a rough shelter for watchers or warriors; of clouds as the LORD’s enclosure in storm (AV pavilion) in Ps 18:12 (Hebrew numbering; KJV 18:11) and Job 36:29'
    key: bdb
    url: 'https://biblehub.com/hebrew/5521.htm'
    quote: 'booth, rude or temporary shelter, for cattle … but also for warriors in the field … for watchers in vineyards … of clouds as (temporary) enclosure (AV ''pavilion'') of ׳י in storm Psalm 18:12 = 2 Samuel 22:12; Job 36:29.'
  - where: 'note 36:29 “Thunder from His pavilion”'
    claim: 'A modern translation reads “the thunderings of his pavilion”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2036&version=NRSVUE'
    quote: '29 Can anyone understand the spreading of the clouds, the thunderings of his pavilion?'
  - where: 'note 36:29 “Thunder from His pavilion”'
    claim: 'Elihu’s speeches about God’s works and ways in some respects anticipated the theophany'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'His speeches about God’s wonderful works and unfathomable ways in some respects anticipated the theophany.'
  - where: 'note 36:29 “Thunder from His pavilion”'
    claim: 'Elihu proclaims God’s power over creation, which humanity cannot understand'
    key: ot-minute-job-36
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-36'
    quote: 'Elihu emphasized that God is not to be taught (36:22–23) and that humanity cannot attempt to understand God or His creative works (36:24–33).'
  - where: christ
    claim: 'Hebrews: the Son learned obedience by what He suffered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/5?lang=eng'
    quote: 'Though he were a Son, yet learned he obedience by the things which he suffered;'
  - where: christ
    claim: 'D&C 122:7: all these things shall give thee experience'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/122?lang=eng'
    quote: 'know thou, my son, that all these things shall give thee experience, and shall be for thy good.'
  - where: christ
    claim: 'Affliction does not necessarily mean a person has sinned'
    key: gs-job
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/job?lang=eng'
    quote: 'The book clarifies that having afflictions does not necessarily mean that a person has sinned.'
  - where: explore
    claim: 'Elihu pictures God as a teacher in 33:14, 34:32, 35:11'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/36.htm'
    quote: 'peculiar to Elihu to represent God as a teacher both by dreams and dispensations of affliction, Job 33:14, Job 34:32, and by His creatures, Job 35:11'
