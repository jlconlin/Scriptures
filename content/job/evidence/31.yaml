chapter: 31
claims:
  - where: setting
    claim: 'The chapter heading: Job invites judgment so that God may know his integrity, and welcomes the penalties if he has done ill'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/31?lang=eng'
    quote: 'Job invites judgment so that God may know his integrity—If he has done ill, Job welcomes the penalties for so doing.'
  - where: setting
    claim: 'In one Latter-day Saint reading, an oath of innocence denying fourteen sins in seven categories, seven signifying completeness, binding Job to God and man'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job next takes an oath of innocence (see Job 31) before God (see Job 31:2, 6, 14, 23), affirming that he has not been guilty of fourteen sins27 or seven categories of sin,28 with the number seven signifying completeness.'
  - where: setting
    claim: 'Job denies under oath in chapter 31 the charges Eliphaz made in chapter 22'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'He specifically charges Job with oppressing the poor and powerless, even stripping their limited possessions for gain. Job will vigorously deny these charges under oath in chapter 31.'
  - where: thread
    claim: 'The oath ends with the land, against the covetousness Eliphaz laid to Job''s charge'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/31.htm'
    quote: 'the curse shall and must come upon it, if its present possessor has been guilty of the sin of unmerciful covetousness, which Eliphaz lays to his charge in Job 22:6-9.'
  - where: section 2 plain
    claim: 'Plain rendering of verse 10: his wife to grind for another and other men to have her'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2031&version=NRSVUE'
    quote: 'then let my wife grind for another, and let other men kneel over her.'
  - where: section 3 plain
    claim: 'Verse 21, “when I saw my help in the gate”: because he had supporters at the gate'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2031&version=NRSVUE'
    quote: 'if I have raised my hand against the orphan because I saw I had supporters at the gate;'
  - where: section 4 plain
    claim: 'The kiss of the hand as a gesture of adoration toward the heavenly body'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/31.htm'
    quote: 'Thus to kiss the hand in the direction of the object of veneration'
  - where: section 6 plain
    claim: 'Verse 35: “Here is my signature”; the indictment written by his adversary'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2031&version=NRSVUE'
    quote: '(Here is my signature! Let the Almighty answer me!) O that I had the indictment written by my adversary!'
  - where: section 7 plain
    claim: 'Footnote to “cockle”: noxious weeds'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/31?lang=eng'
    quote: 'OR noxious weeds.'
  - where: 'note 31:1 “A covenant with his eyes”'
    claim: 'The Church''s footnote to “covenant” points to D&C 43:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/31?lang=eng'
    quote: 'D&C 43:9.'
  - where: 'note 31:1 “A covenant with his eyes”'
    claim: 'One Latter-day Saint reading: in chapter 31 Job recommits himself in covenant fidelity'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job will [Page 156]affirm his innocence and recommit himself in covenant fidelity, using self-imprecatory oaths and crying out that God will hear his words.'
  - where: 'note 31:5 “Swearing by his own ruin”'
    claim: 'After an oath with the imprecation omitted, ʾim becomes an emphatic negative'
    key: bdb
    url: 'https://biblehub.com/hebrew/518.htm'
    quote: 'After an oath (expressed, or merely implied) אִם (the formula of imprecation being omitted) becomes an emphatic negative'
  - where: 'note 31:5 “Swearing by his own ruin”'
    claim: 'Five self-imprecations, expressing Job''s self-consecration to God and his fellow man'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'On five occasions, Job invokes self-imprecations — curses against himself — if he has not been or will not be true to his oath of innocence.30'
  - where: 'note 31:5 “Swearing by his own ruin”'
    claim: 'Self-imprecations as self-consecration in fidelity to God and man'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'These self-maledictions are a further expression of Job’s self-sacrifice or self-consecration in absolute fidelity to God and his fellow man.'
  - where: 'note 31:5 “Swearing by his own ruin”'
    claim: 'Self-imprecatory oaths common, often joined to sacrifice; Jeremiah 34 and Genesis 15'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'They were often connected to animal sacrifice with the person saying in effect, “May it be done to me as to these animals if I do not keep my covenant.” Accordingly, Jeremiah tells the leaders of Judea'
  - where: 'note 31:5 “Swearing by his own ruin”'
    claim: 'The Lord passed between the pieces as a token of faithfulness to the covenant with Abraham'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'the Lord Himself passed between the pieces of cut, sacrificed animals as a token of His faithfulness in keeping the covenant made with Abraham (Genesis 15:8-18).'
  - where: 'note 31:5 “Swearing by his own ruin”'
    claim: 'Weighed by ordinary justice, Job''s suffering is disproportionate to any sin'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'even weighed in the balance scales of ordinary justice (see Job 6:2; 31:6), his suffering is disproportionate to any sin that could be laid to his charge.'
  - where: 'note 31:13 “The servant''s case”'
    claim: 'A modern translation: “when they brought a complaint against me”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2031&version=NRSVUE'
    quote: 'If I have rejected the cause of my male or female slaves, when they brought a complaint against me,'
  - where: 'note 31:13 “The servant''s case”'
    claim: 'One older reading: the servants began the dispute; Job treated them as persons, not property, and let them maintain their right'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/31.htm'
    quote: 'they on their part began the dispute … but he did not then treat them as a despot; they were not accounted as res but personae by him, he allowed them to maintain their personal right in opposition to him.'
  - where: 'note 31:13 “The servant''s case”'
    claim: 'The Church''s footnote at verse 15 points to Malachi 2:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/31?lang=eng'
    quote: 'Mal. 2:10; Acts 17:26; Ether 3:15.'
  - where: 'note 31:13 “The servant''s case”'
    claim: 'One Latter-day Saint reading: solidarity at its fullest in 13–15; Job treats his neighbor as himself before God'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'This solidarity is perhaps brought to fullest expression in the following statement'
  - where: 'note 31:13 “The servant''s case”'
    claim: 'Job committed to treating his neighbor as himself before God'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job is thus committed to treating his neighbor as himself before God.'
  - where: 'note 31:26 “A kiss thrown to the moon”'
    claim: 'One older reading: kissing the hand toward the object of veneration is the gesture of adoration; kisses to idols in 1 Kings 19:18 and Hosea 13:2'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/31.htm'
    quote: 'Thus to kiss the hand in the direction of the object of veneration, or also to turn to it the kissed hand and at the same time the kiss which fastens on it (as compensation for the direct kiss, 1 Kings 19:18; Hosea 13:2), is the proper gesture'
  - where: 'note 31:26 “A kiss thrown to the moon”'
    claim: 'The same reading links trust in gold and star worship through Colossians 3:5'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/31.htm'
    quote: 'He indeed avoided πλεονεξία as εἰλωλολατρεία (Colossians 3:5), how much more the heathenish deification of the stars!'
  - where: 'note 31:26 “A kiss thrown to the moon”'
    claim: 'The same reading: worship would have been hypocrisy, disowning in secret the God acknowledged openly'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/31.htm'
    quote: 'His worship of God would have been hypocrisy, if he had disowned in secret the God whom he acknowledged openly and outwardly.'
  - where: 'note 31:26 “A kiss thrown to the moon”'
    claim: 'A modern translation of verse 26: the moon moving in splendor'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2031&version=NRSVUE'
    quote: 'if I have looked at the sun when it shone or the moon moving in splendor,'
  - where: 'note 31:33 “As Adam, or as men do?”'
    claim: 'The Hebrew of verse 33 has kĕʾādām'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'כְ/אָדָ֣ם'
  - where: 'note 31:33 “As Adam, or as men do?”'
    claim: 'The Church''s footnote gives “as some men do”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/31?lang=eng'
    quote: 'OR as some men do.'
  - where: 'note 31:33 “As Adam, or as men do?”'
    claim: 'A modern translation: “as others do”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2031&version=NRSVUE'
    quote: 'if I have concealed my transgressions as others do, by hiding my iniquity in my bosom,'
  - where: 'note 31:33 “As Adam, or as men do?”'
    claim: 'One older reading: “after the manner of men” would be tame here; translates “like Adam,” the point being the sinner''s dread of the light seen in Adam''s hiding'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/31.htm'
    quote: 'if I have hidden (disowned) like Adam my transgression. The point of comparison is only the sinner''s dread of the light, which became prominent as the prototype for every succeeding age in Adam''s hiding himself.'
  - where: 'note 31:33 “As Adam, or as men do?”'
    claim: 'The same reading contrasts Adam drawn from hiding with Job approaching as a prince'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/31.htm'
    quote: 'How totally different from Adam, who was obliged to be drawn out of his hiding-place, and tremblingly, because conscious of guilt, underwent the examination of the omniscient God!'
  - where: 'note 31:33 “As Adam, or as men do?”'
    claim: 'A Latter-day Saint study reports Job 31:33 among four Old Testament passages read as references to the Fall; kĕʾādām could be read “like Adam”'
    key: sc-knowhy-28
    url: 'https://scripturecentral.org/knowhy/what-are-the-origins-of-lehis-understanding-of-the-fall'
    quote: 'Pritchett specifically examined Psalms 82:7, Hosea 6:7, Job 31:33, and Ezekiel 28:11–19 as references to the Fall, noting that the Hebrew ke-ʾādām, translated as “like man” in the KJV, could just as easily be read as “like Adam.”'
  - where: 'note 31:35 “Here is my signature”'
    claim: 'The Hebrew has tāw, “my mark,” where the KJV says “my desire”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'תָּ֭וִ/י'
  - where: 'note 31:35 “Here is my signature”'
    claim: 'BDB: Job 31:35, my written mark in attestation'
    key: bdb
    url: 'https://biblehub.com/hebrew/8420.htm'
    quote: 'suffix תָּוֺוי Job 31:35 = my (written) mark (in attestation).'
  - where: 'note 31:35 “Here is my signature”'
    claim: 'A modern translation: “Here is my signature!” and “the indictment written by my adversary”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2031&version=NRSVUE'
    quote: '(Here is my signature! Let the Almighty answer me!) O that I had the indictment written by my adversary!'
  - where: 'note 31:35 “Here is my signature”'
    claim: 'One older reading: he would wear the indictment on his shoulder as a mark of dignity and as a crown, give an account of his steps, approach as a prince'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/31.htm'
    quote: 'He will wear it upon his shoulder as a mark of his dignity (comp. Isaiah 22:22; Isaiah 9:5), and wind it about him as a magnificent crown'
  - where: 'note 31:35 “Here is my signature”'
    claim: 'The same reading calls verse 37 a rash utterance and holds that 38:2 would fit best directly after it'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/31.htm'
    quote: 'Also the first word of Jehovah, "Who is this that darkeneth counsel with words without knowledge?" Job 38:2, is much more appropriate to follow directly on Job 31:37 … and the rash utterance, Job 31:37, is really a "darkening of the divine decree."'
  - where: 'note 31:35 “Here is my signature”'
    claim: 'A Latter-day Saint reading groups 31:35 with Job''s cries for an encounter with God to prove his innocence (16:21; 23:3–4)'
    key: tanner-considered-job
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/hast-thou-considered-my-servant-job'
    quote: 'Repeatedly, Job cries out for an encounter with the Lord in order to bring God into the docks and prove his own innocence'
  - where: 'note 31:35 “Here is my signature”'
    claim: 'A Latter-day Saint reading: God''s ratification of Job''s words may extend to his binding oaths'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'God’s [Page 169]ratification of Job’s words may also extend to Job’s determination to seek God’s face at all costs and to Job’s binding oaths in covenant fidelity to God and man.'
  - where: 'note 31:40 “The words of Job are ended”'
    claim: 'A narrative voice informs the reader that Job''s words are ended'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'A narrative voice now informs the reader: “The words of Job are ended” (Job 31:40, rsv).'
  - where: 'note 31:40 “The words of Job are ended”'
    claim: 'The last self-imprecation invokes the curse of the Fall; Job invokes it confident he will not suffer it; ready to have the Fall reversed like the brother of Jared'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'In the last self-imprecation, Job invokes a curse of the Fall that “thorns grow instead of wheat” (Job 31:40, rsv; see also Genesis 3:17–18). Job only invokes these curses because he is confident he will not have to suffer them.'
  - where: 'note 31:40 “The words of Job are ended”'
    claim: 'Ready to have the Fall reversed, like the brother of Jared (Ether 3:13)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'This suggests that Job is ready to have the Fall reversed, much like the brother of Jared'
  - where: christ
    claim: 'One Latter-day Saint reading sets Job''s confidence to approach God beside Hebrews 10:19–23 and D&C 121:45–46'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job’s self-consciousness of his innocence and commitment to righteousness give him confidence to approach God (see Job 31:23; see also Hebrews 10:19–23; 1 John 3:16–20, 4:16–19, 5:14; D&C 121:45–46).'
  - where: christ
    claim: 'D&C 121:45 ties confidence in the presence of God to charity toward all men and virtuous thoughts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/121?lang=eng'
    quote: 'Let thy bowels also be full of charity towards all men, and to the household of faith, and let virtue garnish thy thoughts unceasingly; then shall thy confidence wax strong in the presence of God'
