chapter: 3
claims:
  - where: setting
    claim: 'With chapter 3 the book turns from prose narrative to poetic dialogue, with no narrator to tell the reader what to think'
    key: ot-minute-job-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-1-3'
    quote: 'At this point, the book of Job transitions from a prose narrative to a poetic dialogue between Job and his friends. … it lacks a narrator to tell us what to think about the different characters’ arguments and behaviors.'
  - where: setting
    claim: 'After seven days of silence Job speaks; chapter 3 opens the first cycle of the dialogue, 3–14'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'First Cycle (Job 3–14). After seven days of silence on the ash heap with the three friends, Job’s anguish boils over.'
  - where: setting
    claim: 'The Church’s footnotes link verse 3 to Jeremiah 20:14–18 and verse 11 to Job 10:18–19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/3?lang=eng'
    quote: '“born”: Jer. 20:14 (14–18). … “died”: Job 10:18 (18–19).'
  - where: thread
    claim: 'The speech falls into three parts, 3–10, 11–19, 20–26: cursing of life, longing for death, inquiry after such a life'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/3.htm'
    quote: 'Job 3:3-10, Job 3:11-19, Job 3:20-26. … in the first of which delirious cursing of life is expressed; in the second, eager longing for death; in the third, reproachful inquiry after the end of such a life of suffering.'
  - where: thread
    claim: 'Job curses his day and does not curse God'
    key: scripture-helps-job
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/31-job-1-3-12-14-19-21-24-38-40-42?lang=eng'
    quote: 'Despite his deep sorrow, Job did not fulfill the adversary’s prediction that he would curse God.'
  - where: section 2 plain
    claim: 'Verse 8 rendered “those who are skilled to rouse up Leviathan”; “shadow of death” in verse 5 as deep darkness'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+3&version=NRSVUE'
    quote: '5 Let gloom and deep darkness claim it. … 8 Let those curse it who curse the Sea, those who are skilled to rouse up Leviathan.'
  - where: section 3 plain
    claim: 'The footnotes give “receive” for “prevent” (v. 12) and “who rebuilt ruins” for “which built desolate places” (v. 14)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/3?lang=eng'
    quote: '“prevent”: HEB receive. … “which built desolate places”: HEB who rebuilt ruins.'
  - where: 'note 3:3 “Cursing his day, not his God”'
    claim: 'Job’s curse reflects his suffering, resembles the cries of other prophets, and does not fulfill the adversary’s prediction'
    key: scripture-helps-job
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/31-job-1-3-12-14-19-21-24-38-40-42?lang=eng'
    quote: 'Job’s lament of cursing the day of his birth reflects his suffering and his struggle to understand his trials. It is similar to the cries of other biblical prophets … Despite his deep sorrow, Job did not fulfill the adversary’s prediction that he would curse God.'
  - where: 'note 3:3 “Cursing his day, not his God”'
    claim: 'Verse 1’s verb is qillel (Piel of qalal), with “his day” as object'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'וַ/יְקַלֵּ֖ל'
  - where: 'note 3:3 “Cursing his day, not his God”'
    claim: 'The adversary’s prediction (1:11) uses barak, “bless”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'יְבָרֲכֶֽ/ךָּ'
  - where: 'note 3:3 “Cursing his day, not his God”'
    claim: 'Job’s wife’s words (2:9) also use barak'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'בָּרֵ֥ךְ'
  - where: 'note 3:3 “Cursing his day, not his God”'
    claim: 'Qalal in the Piel means curse; Job 3:1 is listed with a thing (not a person or God) as object'
    key: bdb
    url: 'https://biblehub.com/hebrew/7043.htm'
    quote: 'Pi`el … — curse (properly make contemptible): … 3 with accusative of thing Genesis 8:21(׳י subject), Job 3:1.'
  - where: 'note 3:3 “Cursing his day, not his God”'
    claim: 'The book offers no narrator’s verdict; God later calls Job’s words “without knowledge” and yet says he spoke right, so the reader must weigh them'
    key: ot-minute-job-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-1-3'
    quote: 'By the end of the book, God provides some commentary on Job’s words and describes them as “words without knowledge” (Job 38:2) while at the same time saying that Job has “spoken of me the thing that is right” (42:7). This forces the reader to carefully listen and weigh'
  - where: 'note 3:3 “Cursing his day, not his God”'
    claim: 'Job wishes he had never been born, from a place of intense pain'
    key: ot-minute-job-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-1-3'
    quote: 'In his pain, he wishes that he had never been born. … we can understand Job’s feelings as coming from a place of intense pain and suffering'
  - where: 'note 3:8 “Rousing Leviathan”'
    claim: 'The last word of verse 8 in Hebrew is Leviathan'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/job/3-8.htm'
    quote: '3882 [e] liw·yā·ṯān. לִוְיָתָֽן׃ Leviathan'
  - where: 'note 3:8 “Rousing Leviathan”'
    claim: 'A modern translation: those skilled to rouse up Leviathan'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+3&version=NRSVUE'
    quote: 'those who are skilled to rouse up Leviathan.'
  - where: 'note 3:8 “Rousing Leviathan”'
    claim: 'BDB lists Job 3:8 under a mythological dragon that produces eclipses'
    key: bdb
    url: 'https://biblehub.com/hebrew/3882.htm'
    quote: 'serpent, dragon, leviathan, in poetry and rare … dragon producing eclipses (mythological) Job 3:8'
  - where: 'note 3:17 “Rest in the grave”'
    claim: 'Job looks to Sheol, the realm of the dead, as a place where he would rest from suffering'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job refers longingly to Sheol (the realm of the dead) as a place where he would rest from suffering. It is uncertain at this point whether Job will search for death or for meaning'
  - where: 'note 3:17 “Rest in the grave”'
    claim: 'The Church’s footnote to “rest” points to the Topical Guide’s “Paradise”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/3?lang=eng'
    quote: '“rest”: TG Paradise.'
  - where: 'note 3:23 “Hedged in”'
    claim: 'The hedge of 1:10 was for protection; here it means to straiten by force; compare 19:8'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/3.htm'
    quote: 'he is the man whose way of suffering is mysterious and prospectless, and whom God has penned in on all sides (a fig. like Job 19:8; comp. Lamentations 3:5). סכך, sepire, above, Job 1:10, to hedge round for protection, here: forcibly straiten.'
  - where: 'note 3:17 “Rest in the grave”'
    claim: 'The Topical Guide’s entry Paradise cites Alma 40:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/paradise?lang=eng'
    quote: 'state of happiness, which is called paradise, Alma 40:12.'
  - where: 'note 3:23 “Hedged in”'
    claim: 'God seems to have become Job’s enemy and surrounded him with affliction'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/3.htm'
    quote: 'who, as though He were become his enemy, has surrounded him with this affliction as with a rampart.'
  - where: 'note 3:23 “Hedged in”'
    claim: 'Job despairs when he looks at God through his affliction; compare Isaiah 40:27 and Lamentations 3'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/3.htm'
    quote: 'He does not despair when he contemplates his affliction, but when he looks at God through it … He calls himself a man whose way is hidden, as Zion laments, Isaiah 40:27 … as Jeremiah laments over the ruins of Jerusalem, Lamentations 3:1-13'
  - where: 'note 3:25 “What Job feared”'
    claim: 'A modern translation renders verse 25 in the present'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+3&version=NRSVUE'
    quote: '25 Truly the thing that I fear comes upon me, and what I dread befalls me. 26 I am not at ease, nor am I quiet; I have no rest, but trouble comes.'
  - where: 'note 3:25 “What Job feared”'
    claim: 'A Latter-day Saint reading: Job had lived in anxiety about suffering, sacrificing for his children, and now must face what he feared; by the end he chooses to love again'
    key: ot-minute-job-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-1-3'
    quote: 'Job finds himself experiencing the suffering he had feared and had spent his whole life attempting to avoid—he had spent so much of his time sacrificing animals on the off chance that his children might have done something wrong.'
  - where: 'note 3:25 “What Job feared”'
    claim: 'By the end Job chooses to love again, knowing the risk'
    key: ot-minute-job-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-1-3'
    quote: 'Knowing full well that his relationship with God will not prevent misfortune in his life, he chooses to make himself vulnerable and to love again'
  - where: christ
    claim: 'The footnote to “misery” in verse 20 points to D&C 122:1–7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/3?lang=eng'
    quote: '“misery”: D&C 122:7 (1–7). TG Suffering.'
  - where: christ
    claim: 'Jesus Christ restores what we cannot and consecrates suffering for our gain'
    key: renlund-trust-god
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/08/03_trust-god-and-let-him-prevail?lang=eng'
    quote: 'Jesus Christ loves to restore what we cannot restore, heal wounds we cannot heal, fix what is irreparably broken, and compensate for any unfairness we have endured. In fact, if we let Him, He will consecrate our suffering for our gain'
  - where: christ
    claim: 'Job’s lament did not curse God'
    key: scripture-helps-job
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/31-job-1-3-12-14-19-21-24-38-40-42?lang=eng'
    quote: 'Despite his deep sorrow, Job did not fulfill the adversary’s prediction that he would curse God.'
  - where: christ
    claim: 'The book never answers why Job suffers'
    key: renlund-trust-god
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/08/03_trust-god-and-let-him-prevail?lang=eng'
    quote: 'The book of Job addresses the question but never answers the why.'
  - where: setting
    claim: 'Job speaks out of intense pain, wishing he had never been born'
    key: ot-minute-job-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-1-3'
    quote: 'In his pain, he wishes that he had never been born.'
