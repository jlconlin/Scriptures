chapter: 15
claims:
  - where: setting
    claim: 'Chapters 15–21 are the second round, and Eliphaz is perhaps less kind now'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job 15–21 represents the second round of speeches between Job and his three friends. Eliphaz continues much of the same arguments that he began in Job 4–5 but is perhaps less kind now.'
  - where: setting
    claim: 'Eliphaz answers Job''s speeches, in which Job claimed to be wise (12:3; 13:2)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/15.htm'
    quote: 'Job''s detailed and bitter answers seem to him as empty words and impassioned tirades, which ill become a wise man, such as he claims to be in assertions like Job 12:3; Job 13:2.'
  - where: setting
    claim: 'The friends now think Job has given them the proof that he is a sinner: his words make him his own accuser and judge'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/15.htm'
    quote: 'now, as they think, Job has himself furnished them with proof that he is a sinner who has merited such severe suffering. For whoever can speak so thoughtlessly and passionately, so vexatiously and irreverently, as Job has done, is, in their opinion, his own accuser and judge.'
  - where: setting
    claim: 'The second round has a harsher tone; since Job spurned the consolations, they bring only the gloomy side of their doctrine'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/15.htm'
    quote: 'the only new thing is the harsher and more decided tone of their maintenance of the doctrine of punishment … since Job contemns the consolations of God with which they have hitherto closed their speeches, they now exclusively bring forward the terrible and gloomy phase of their dogma'
  - where: setting
    claim: 'The second cycle joins the fate of the wicked with direct assertions of sin against Job for the first time'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'This cycle features prolonged pronouncements of the fate of the wicked, combined for the first time with direct assertions of sin against Job.'

  - where: thread
    claim: 'The portrait of the wicked is drawn for Job to see himself in'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/15.htm'
    quote: 'The picture is so drawn, that in it, as in a mirror, Job shall behold himself and his fate'

  - where: section 1 plain
    claim: 'Verse 4: hindering meditation (devotion) before God'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2015&version=NRSVUE'
    quote: 'But you are doing away with the fear of God and hindering meditation before God. For your iniquity teaches your mouth'
  - where: section 2 plain
    claim: 'Verse 8: listened in the council of God; verse 11: the word that deals gently'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2015&version=NRSVUE'
    quote: 'Have you listened in the council of God? And do you limit wisdom to yourself? … Are the consolations of God too small for you or the word that deals gently with you?'
  - where: section 4 plain
    claim: 'Verse 20: the years laid up for the ruthless; verse 22: despair of returning from darkness'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2015&version=NRSVUE'
    quote: 'The wicked writhe in pain all their days, through all the years that are laid up for the ruthless. … They despair of returning from darkness, and they are destined for the sword.'
  - where: section 5 plain
    claim: 'Verse 25: the wicked man plays the hero against God'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/15.htm'
    quote: 'The Hithpa. התגּבּר signifies here to maintain a heroic bearing, to play the hero'
  - where: section 5 plain
    claim: 'Verse 34: the company of the godless is barren'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2015&version=NRSVUE'
    quote: 'For the company of the godless is barren, and fire consumes the tents of bribery.'

  - where: 'note 15:2 “A belly full of east wind”'
    claim: 'Modern translation of verse 2, rendering “belly” as the self'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2015&version=NRSVUE'
    quote: 'Should the wise answer with windy knowledge and fill themselves with the east wind?'
  - where: 'note 15:2 “A belly full of east wind”'
    claim: 'The east wind is a figure of destruction in the prophets (Hosea 12:1)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Eliphaz charges Job with being filled with the east wind (a figure of destruction in the prophets — see Hosea 12:1, 13–15)'
  - where: 'note 15:2 “A belly full of east wind”'
    claim: 'The Hebrew of 15:2 has the east wind (qādîm) filling the belly'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'וִֽ/ימַלֵּ֖א קָדִ֣ים בִּטְנֽ/וֹ'
  - where: 'note 15:2 “A belly full of east wind”'
    claim: 'Job''s “vain words” at 16:3 are in Hebrew words of wind'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'לְ/דִבְרֵי ר֑וּחַ'

  - where: 'note 15:4 “Undermining devotion”'
    claim: 'The word translated “prayer” means meditation; it is used in Ps. 119:97, 99'
    key: bdb
    url: 'https://biblehub.com/hebrew/7881.htm'
    quote: 'KJV: meditation, prayer … שִׂיחָה noun feminine id.; — absolute ׳שִׂ Psalm 119:99; Job 15:4; suffix שִׂיחָתִי Psalm 119:97'
  - where: 'note 15:4 “Undermining devotion”'
    claim: 'Modern translation of verses 4–5'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2015&version=NRSVUE'
    quote: 'But you are doing away with the fear of God and hindering meditation before God. For your iniquity teaches your mouth'
  - where: 'note 15:4 “Undermining devotion”'
    claim: 'By doubting God''s justice Job''s speeches take away religion''s foundation; śîḥâ is devotional meditation'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/15.htm'
    quote: 'they are moreover irreligious, since by doubting the justice of God they deprive religion of its fundamental assumption, and diminish the reverence due to God. … customary devotional meditation, here of the disposition of mind indispensable to prayer, viz., devotion'
  - where: 'note 15:4 “Undermining devotion”'
    claim: '“Restrainest” (gāraʿ) means to diminish or take away'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/15.htm'
    quote: 'especially reverential awe, which Job depreciates (גּרע, detrahere)'
  - where: 'note 15:4 “Undermining devotion”'
    claim: 'Eliphaz thinks Job has lost his relationship with God and is condemned by his own mouth'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Eliphaz feels that Job has lost his relationship with God (“castest off fear” [verse 4]) and that Job’s own “mouth condemnenth [him]” (verse 6).'
  - where: 'note 15:4 “Undermining devotion”'
    claim: 'Of the reproaches in 15:1–13, one older reading judges the charge of impious words well grounded and the charge of craftiness unjust'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/15.htm'
    quote: 'Of these reproaches the first and last are well-grounded; Job does really sin in his language and attitude towards God.'
  - where: 'note 15:4 “Undermining devotion”'
    claim: 'The charge of craftiness is most unjust'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/15.htm'
    quote: 'If, however, Eliphaz reproaches Job with calculating craftiness, and thus regards his affirmation of his innocence as a mere artifice, the charge cannot be more unjust'

  - where: 'note 15:8 “Did you sit in God’s council?”'
    claim: '“Secret” is sôd, the intimate circle or council; BDB lists Jer. 23:18, 22 and Job 15:8 together'
    key: bdb
    url: 'https://biblehub.com/hebrew/5475.htm'
    quote: 'divan or circle of familiar friends … ׅ׳עמד בסוד (י Jeremiah 23:18,22 in the intimate circle of ׳י; בסוד אלוה Job 15:8'
  - where: 'note 15:8 “Did you sit in God’s council?”'
    claim: 'Modern translation of verses 7–8'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2015&version=NRSVUE'
    quote: 'Are you the firstborn of the human race? Were you brought forth before the hills? Have you listened in the council of God?'
  - where: 'note 15:8 “Did you sit in God’s council?”'
    claim: 'In one older reading the first man, coming direct from God, was thought to have the deepest insight into the world created with him'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/15.htm'
    quote: 'The question in Job 15:7 assumes that the first created man, because coming direct from the hand of God, had the most direct and profoundest insight into the mysteries of the world which came into existence at the same time as himself.'
  - where: 'note 15:8 “Did you sit in God’s council?”'
    claim: 'Before the hills: in the same reading, the angels were created before man and the visible universe (Job 38:4)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/15.htm'
    quote: 'for the angels, according to Scripture, were created before man, and even before the visible universe (vid., Job 38:4.).'
  - where: 'note 15:8 “Did you sit in God’s council?”'
    claim: 'The reader knows Job is not punished for iniquity, since God Himself confirmed his righteousness (1:8)'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'we know Job is not being punished for iniquity since God Himself has confirmed that he is a righteous person (1:8)'
  - where: 'note 15:8 “Did you sit in God’s council?”'
    claim: 'Job describes God''s sôd in 1:6 and 2:1; in 15:8 Eliphaz insists Job has not sat in it'
    key: hamblin-sod
    url: 'https://interpreterfoundation.org/journal/the-sod-of-yhwh-and-the-endowment'
    quote: 'Finally, Job provides a description of God’s sôd, composed of the “sons of God,” meeting in council (Job 1:6, Job 2:1). In Job 15:8, Eliphaz insists that Job has not sat in the sôd and therefore cannot understand God’s will regarding Job.'
  - where: 'note 15:8 “Did you sit in God’s council?”'
    claim: 'Eliphaz taunts Job that he has not been in the divine councils and rebukes him for rejecting the wisdom of the aged'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'He tauntingly reminds Job that he has not participated in divine councils and reprimands him for rejecting the wisdom of the aged in favor of his own prideful assertions (see Job 15:7–10).'

  - where: 'note 15:11 “The consolations of God”'
    claim: 'By the consolations of God Eliphaz means the friends'' promises; the gentle word is their gentle tone'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/15.htm'
    quote: 'By the consolations of God, Eliphaz means the promises in accordance with the majesty and will of God, by which he and the other friends have sought to cheer him … By "a word (spoken) in gentleness to him," he means the gentle tone which they have maintained'
  - where: 'note 15:11 “The consolations of God”'
    claim: 'The friends'' intention is good'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/15.htm'
    quote: 'when he reproaches Job with despising the divine consolations and gentle admonitions they have addressed to him, we must not blame the friends, since their intention is good.'
  - where: 'note 15:11 “The consolations of God”'
    claim: 'Modern translation of verse 11'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2015&version=NRSVUE'
    quote: 'Are the consolations of God too small for you or the word that deals gently with you?'
  - where: 'note 15:11 “The consolations of God”'
    claim: '“Consolations” (tanḥûm) comes from nāḥam, comfort; BDB lists Job 15:11 and 21:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/8575.htm'
    quote: 'Word Origin: [from H5162 (נָחַם - comfort)] … תַּנְחוּמוֺת Job 15:11; תַּנְחוּמֹתֵיכֶם Job 21:2.'
  - where: 'note 15:11 “The consolations of God”'
    claim: 'The Hebrew of 15:11: consolations of God'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'תַּנְחֻמ֣וֹת אֵ֑ל'
  - where: 'note 15:11 “The consolations of God”'
    claim: 'The friends came “to comfort him” (2:11) with the verb nāḥam (H5162)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'וּֽ/לְ/נַחֲמֽ/וֹ'
  - where: 'note 15:11 “The consolations of God”'
    claim: 'Job''s “miserable comforters” (16:2) uses the participle of nāḥam (H5162)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'מְנַחֲמֵ֖י עָמָ֣ל'
  - where: 'note 15:11 “The consolations of God”'
    claim: 'Job answers by dismissing his friends as miserable comforters; the breach is irrevocable'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job responds (see Job 16–17) by dismissing his accusing friends as miserable comforters (see Job 16:1–5), realizing that the breach between them is irrevocable'

  - where: 'note 15:14 “Can man be clean?”'
    claim: 'Eliphaz returns to his earlier argument; since humanity is weak, no one can claim innocence; God does not trust even His angels'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Eliphaz turns to the arguments he brought up earlier, asking, “What is man, that he should be clean? … Eliphaz assumes that since humanity is so weak and so prone to error, no one can claim to be innocent.'
  - where: 'note 15:14 “Can man be clean?”'
    claim: 'Eliphaz returns to his “revelation” of 4:12–21'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Eliphaz returns to his supposed “revelation” of Job 4:12–21, reminding Job that man cannot be clean before God (see Job 15:11–16)'
  - where: 'note 15:14 “Can man be clean?”'
    claim: 'Modern translation of verse 16'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2015&version=NRSVUE'
    quote: 'how much less one who is abominable and corrupt, one who drinks iniquity like water!'
  - where: 'note 15:14 “Can man be clean?”'
    claim: 'God does not trust even His angels'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'He again emphasizes that God doesn’t even trust His angels'
  - where: 'note 15:14 “Can man be clean?”'
    claim: 'How could God trust humanity, who drinks iniquity like water (verse 16)'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'How could He trust humanity, who “drinketh iniquity like water?” (verse 16).'

  - where: 'note 15:18 “The wisdom of the fathers”'
    claim: 'The fathers lived in their own land unmixed with strangers, so their teaching counted as pure'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/15.htm'
    quote: 'These fathers to whom this doctrine respecting the fate of evil-doers is referred, lived, as Eliphaz says in Job 15:19, in the land of their birth, and did not mingle themselves with strangers … and their teaching may be accounted pure and unalloyed.'
  - where: 'note 15:18 “The wisdom of the fathers”'
    claim: 'The friends represent conventional religion and the wisdom of tradition, relying on experience and the words of the elders, as Job once had'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'The friends will continue to represent conventional religion and the wisdom of tradition, relying on their own experience (see Job 5:27) and the words of the elders (see Job 15:9–12), as Job once had.'
  - where: 'note 15:18 “The wisdom of the fathers”'
    claim: 'Modern translation of verses 18–19'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2015&version=NRSVUE'
    quote: 'what sages have told and their ancestors have not hidden, to whom alone the land was given, and no stranger passed among them.'

  - where: 'note 15:25 “Charging at God”'
    claim: 'Two sins cause the evildoer''s destiny: arrogant opposition to God and contentment on the ruins of another''s prosperity'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/15.htm'
    quote: 'Two chief sins are mentioned as the cause of the final destiny that comes upon the evil-doer: (1) his arrogant opposition to God, and (2) his contentment on the ruins of another''s prosperity.'
  - where: 'note 15:25 “Charging at God”'
    claim: 'He plays the hero; the neck is thrust out as he assails God'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/15.htm'
    quote: 'The Hithpa. התגּבּר signifies here to maintain a heroic bearing, to play the hero … בּצוּאר expresses the special prominence of the neck in his assailing God'
  - where: 'note 15:25 “Charging at God”'
    claim: 'The fat of verse 27 pictures carnal security, like Psalm 73:4–7'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/15.htm'
    quote: 'Job 15:27, similarly to Psalm 73:4-7, pictures this impregnable carnal security against all unrest and pain'
  - where: 'note 15:25 “Charging at God”'
    claim: 'Modern translation of verses 25–27'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2015&version=NRSVUE'
    quote: 'Because they stretched out their hands against God and bid defiance to the Almighty, running stubbornly against him with a thickly bossed shield; because they have covered their faces with their fat'
  - where: 'note 15:25 “Charging at God”'
    claim: 'The portrait is a mirror in which Job is to see what he has endured and what awaits him; possessions, children and household are involved in the ruin'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/15.htm'
    quote: 'and his possessions, children, and whole household are involved in his ruin. The picture is so drawn, that in it, as in a mirror, Job shall behold himself and his fate, both what he has already endured and what yet awaits him.'
  - where: 'note 15:25 “Charging at God”'
    claim: 'Eliphaz now sees Job as one of the wicked'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Eliphaz now clearly sees Job as one of the wicked.'

  - where: christ
    claim: 'The Church''s footnote to “clean” in 15:14 points to Ether 12:37 and D&C 38:42'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/15?lang=eng'
    quote: '14a “clean”: Ether 12:37; D&C 38:42.'
  - where: christ
    claim: 'Ether 12:37: the Lord tells Moroni his garments shall be made clean'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/ether/12?lang=eng'
    quote: 'If they have not charity it mattereth not unto thee, thou hast been faithful; wherefore, thy garments shall be made clean.'
  - where: christ
    claim: 'Alma 5:21: garments cleansed through the blood of the Redeemer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/5?lang=eng'
    quote: 'yea, his garments must be purified until they are cleansed from all stain, through the blood of him of whom it has been spoken by our fathers, who should come to redeem his people from their sins.'
