chapter: 19
claims:
  - where: when
    claim: 'Chapter 18 was Bildad''s second speech, which chapter 19 answers'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job 18 is Bildad’s second response to Job.'

  - where: setting
    claim: 'Bildad''s speech described the end of the wicked so that the reader takes it to be about Job'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Bildad’s speech is about “the wicked,” but since Bildad refers so often to “him” and “he,” the reader easily assumes that he is just talking about Job.'
  - where: setting
    claim: '“Ten times” is a round number, not to be taken strictly'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/19.htm'
    quote: 'Ten times is not to be taken strictly (Saad.), but it is a round number'
  - where: setting
    claim: 'The chapter heading: Job tells of his ills, then testifies of the Redeemer and the resurrection'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/19?lang=eng'
    quote: 'Job tells of the ills that have befallen him and then testifies, I know that my Redeemer lives—Job prophesies that he will be resurrected and that in his flesh he will see God.'
  - where: setting
    claim: 'The Bible Dictionary counts 19:25–27 among the high points of the book, equaled only by the revelation of 38–41'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'Job’s assurance of the bodily resurrection and his testimony of the Redeemer (19:25–27; see also 2 Ne. 9:4) are one of the high points of the book, equaled only by the revelation of the Lord to him in Job 38–41.'

  - where: thread
    claim: 'Job reminds the friends the matter is between him and God; God has estranged him from family, household, community and friends; he pleads with them not to persecute him as God does'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'He feels that God has estranged him from his family, household, community, and friends (verses 13–20). Job pleads with his friends not to turn on him as God has turned on him'
  - where: thread
    claim: 'Verse 12 pictures Job as a besieged city'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/19.htm'
    quote: 'In Job 19:12 he compares himself to a besieged (perhaps on account of revolt) city.'
  - where: thread
    claim: 'Job cries “Violence!”; God has walled up his way and counts him an adversary'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+19&version=NRSVUE'
    quote: '7 Even when I cry out, ‘Violence!’ I am not answered; I call aloud, but there is no justice.(D) 8 He has walled up my way so that I cannot pass'
  - where: thread
    claim: 'The stone inscription is a dead witness, so Job''s longing moves from a lifeless thing to a living person'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/19.htm'
    quote: 'the memorial in words of stone is but a dead witness … This impels his longing after vindication forward from a lifeless thing to a living person, and turns his longing from man below to God above.'

  - where: section 1 plain
    claim: '“My error remains with me”; “make my humiliation an argument against me”; “God has put me in the wrong”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+19&version=NRSVUE'
    quote: '4 And even if it is true that I have erred, my error remains with me.(A) 5 If indeed you magnify yourselves against me and make my humiliation an argument against me,(B) 6 know then that God has put me in the wrong'
  - where: section 2 plain
    claim: 'The footnotes give “justice” for “judgment” (v. 7) and “tent” for “tabernacle” (v. 12)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/19?lang=eng'
    quote: '7a “judgment”: HEB justice. … 12a “tabernacle”: HEB tent.'
  - where: section 2 plain
    claim: 'Verse 12: siegeworks against Job''s tent'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+19&version=NRSVUE'
    quote: '12 His troops come on together; they have thrown up siegeworks against me and encamp around my tent.'
  - where: section 3 plain
    claim: 'Verses 15 and 17 rendered: guests in my house; loathsome to my own family'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+19&version=NRSVUE'
    quote: '15 the guests in my house have forgotten me; my female servants count me as a stranger; I have become an alien in their eyes.(J) … 17 My breath is repulsive to my wife; I am loathsome to my own family.'
  - where: section 3 plain
    claim: 'The footnotes give “intimate” for “inward” (v. 19) and gloss “my flesh” in v. 22 as the state of his body, or suffering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/19?lang=eng'
    quote: '19a “inward”: OR intimate. … 22a “my flesh”: IE the state of my body, or suffering.'
  - where: section 4 plain
    claim: 'Verses 25–27: in the end he will stand upon the earth; after my skin has been destroyed; my heart faints within me'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+19&version=NRSVUE'
    quote: '25 For I know that my vindicator lives and that in the end he will stand upon the earth;(R) 26 and after my skin has been destroyed, then in my flesh I shall see God,(S) 27 whom I shall see on my side, and my eyes shall behold, and not another. My heart faints within me!'
  - where: section 4 plain
    claim: 'Job''s reins pine with longing after the vision of God'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/19.htm'
    quote: 'His reins within him pine after this vision of God.'
  - where: section 5 plain
    claim: 'Verse 28 as the friends'' words: “How we will persecute him!”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+19&version=NRSVUE'
    quote: '28 If you say, ‘How we will persecute him!’ and, ‘The root of the matter is found in him,’(U) 29 be afraid of the sword'

  - where: 'note 19:6 “God has put me in the wrong”'
    claim: 'The verb of 19:6 is ʿiwwēt, the verb of Bildad''s question in 8:3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'עִוְּתָ֑/נִי'
  - where: 'note 19:6 “God has put me in the wrong”'
    claim: 'BDB: make crooked, falsify scales (Amos 8:5); pervert justice (Job 8:3 twice); with a person, deprive of justice, so Job 19:6'
    key: bdb
    url: 'https://biblehub.com/hebrew/5791.htm'
    quote: '1. a. make crooked = falsify, scales Amos 8:5; pervert justice (מִשְׁמָּט, צֶדֶק) Job 8:3 (twice in verse); Job 34:12 (all God subject); with accusative of person subvert (i.e. deprive of justice), … so עִוְּתָ֑נִי Job 19:6'
  - where: 'note 19:6 “God has put me in the wrong”'
    claim: 'A modern translation: “God has put me in the wrong”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+19&version=NRSVUE'
    quote: '6 know then that God has put me in the wrong and closed his net around me.(C) 7 Even when I cry out, ‘Violence!’ I am not answered'
  - where: 'note 19:6 “God has put me in the wrong”'
    claim: 'The footnote gives “justice” for “judgment” in v. 7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/19?lang=eng'
    quote: '7a “judgment”: HEB justice.'

  - where: 'note 19:13 “A stranger in his own house”'
    claim: 'God has estranged Job from family, household, community and friends'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'He feels that God has estranged him from his family, household, community, and friends (verses 13–20).'
  - where: 'note 19:13 “A stranger in his own house”'
    claim: 'The household dependents regard him as a foreigner, an intruder from another country'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/19.htm'
    quote: 'These people, who ought to thank him for taking them into his house, regard him as one who does not belong to it (זר); he is looked upon by them as a perfect stranger (נכרי), as an intruder from another country.'
  - where: 'note 19:13 “A stranger in his own house”'
    claim: 'The sons of my body are the sons of his mother''s womb, his brothers and sisters; the boys of v. 18 are neighbors'' children who mock him when he tries to rise'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/19.htm'
    quote: 'it is natural … to understand בטני בני of the sons of his mother''s womb, i.e., of her who bare him; consequently … of natural brethren (brothers and sisters, sorores uterinae)'
  - where: 'note 19:13 “A stranger in his own house”'
    claim: 'His children perished in the prologue, which is why the phrase is a puzzle'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/19.htm'
    quote: 'The further question now arises, who are meant by בטני לבני. Perhaps his children? But in the prologue these have utterly perished.'
  - where: 'note 19:13 “A stranger in his own house”'
    claim: 'A modern translation of v. 17'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+19&version=NRSVUE'
    quote: '17 My breath is repulsive to my wife; I am loathsome to my own family.'
  - where: 'note 19:13 “A stranger in his own house”'
    claim: 'Job sees the friends and the whole community, wife and family included, as God''s troops; he becomes a scapegoat in a war of all against one'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job now sees the friends and the entire community, including his own wife and family, as “God’s troops” persecuting him on every side (see Job 19:5–22). Job is fast becoming a scapegoat for the crowd in a war of all against one.'
  - where: 'note 19:13 “A stranger in his own house”'
    claim: 'Farley sets 19:14–15 beside Jesus, a stranger in his own house, rejected at Nazareth'
    key: farley-job-parallels
    url: 'https://www.churchofjesuschrist.org/study/ensign/1980/10/job-parallels-with-the-savior?lang=eng'
    quote: 'Jesus too became a stranger in his own house, for the children of Israel knew him not. Though he walked among them, they would not claim kinship. Those of his home community of Nazareth rejected him.'

  - where: 'note 19:23 “Printed in a book, graven in the rock”'
    claim: 'Job wishes his plight written on a scroll (KJV “printed in a book”) or in rock like a monumental inscription, to preserve his story until someone takes up his case'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job wishes that his plight were written down on scroll (verse 23 of the King James Version translates this as “printed in a book”) or that his story were written into rock like a monumental inscription. Both a scroll and inscription would preserve Job’s story until one day someone would take up Job’s case on his behalf.'
  - where: 'note 19:23 “Printed in a book, graven in the rock”'
    claim: 'Graven in rock with an iron stylus, lead filling the letters to make them more imperishable; a book may perish'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/19.htm'
    quote: 'or because a book may easily perish, graven in a rock (therefore not on leaden plates) with an iron style, and the addition of lead, with which to fill up the engraved letters, and render them still more imperishable.'
  - where: 'note 19:23 “Printed in a book, graven in the rock”'
    claim: 'The inscription is a dead witness; Job''s longing moves to a living person; verse 25 is the higher hope to which the wish is the stepping-stone'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/19.htm'
    quote: 'Job 19:25 is, however, certainly a higher hope, to which the wish in Job 19:23. forms the stepping-stone.'
  - where: 'note 19:23 “Printed in a book, graven in the rock”'
    claim: 'The inscription is a dead witness; Job cannot rely on men even for the future'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/19.htm'
    quote: 'the memorial in words of stone is but a dead witness; and he cannot even for the future rely on men, since he is so contemptuously misunderstood and deceived by them in the present.'

  - where: 'note 19:25 “My Redeemer liveth”'
    claim: 'The footnote to “redeemer” points to the Topical Guide''s “Jesus Christ, Redeemer”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/19?lang=eng'
    quote: '25b “redeemer”: TG Jesus Christ, Foreordained; Jesus Christ, Redeemer.'
  - where: 'note 19:25 “My Redeemer liveth”'
    claim: 'A redeemer was a close kinsman who freed a relative from slavery or bought back ancestral property; Jehovah is Israel''s redeemer, rescuing them with a strong hand, not money (Exod. 6:6)'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'A redeemer in the Old Testament usually referred to a family member or close kin who would free another family member from slavery or purchase ancestral property in order to keep it in the family. For this reason, Jehovah is considered the redeemer of Israel'
  - where: 'note 19:25 “My Redeemer liveth”'
    claim: 'Job does not say who the redeemer is'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Now, Job does not say who this redeemer is; only he knows and hopes that he will come to make things right. Job’s hope beautifully foreshadows the role and mission of Jesus Christ, one of our close kinsmen in the family God who will come to earth in order to reconcile the irreconcilable problems of our times'
  - where: 'note 19:25 “My Redeemer liveth”'
    claim: 'From the witness of chapter 16, by chapter 19 Job believes a redeemer will set right his relationship with God'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'By the time we get to Job 19, Job believes that there will be someone, a redeemer, who will set right his relationship with God (19:25).'
  - where: 'note 19:25 “My Redeemer liveth”'
    claim: 'gōʾēl is the word, BDB lists Job 19:25 under redeeming individuals'
    key: bdb
    url: 'https://biblehub.com/hebrew/1350.htm'
    quote: 'a. individuals, from death Psalm 103:4; Lamentations 3:58; Hosea 13:14, … גֹּאֲלִי Job 19:25'
  - where: 'note 19:25 “My Redeemer liveth”'
    claim: 'Stirling: the third insight, more emphatic than the first two; less clear, also in the Hebrew, that the Redeemer will be God Himself'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'This third insight is more emphatic than the first two, consistent with Job’s ever firmer grip on an understanding of God. … Less clear is the idea, also contained in the Hebrew, that the Redeemer/Advocate will be God Himself.'
  - where: 'note 19:25 “At the last, upon the dust”'
    claim: 'The words of 19:25b: ʾaḥărôn (314), ʿal, ʿāpār (6083), yāqûm (6965)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'עָפָ֥ר'
  - where: 'note 19:25 “At the last, upon the dust”'
    claim: 'BDB: aḥărôn latter or last; of God in Isa. 44:6; at Job 19:25, as one coming after Job, able to establish his innocence when he is dead'
    key: bdb
    url: 'https://biblehub.com/hebrew/314.htm'
    quote: 'b. of time, latter or last (according to context) … of God Isaiah 44:6 … Job 19:25 וְאַחֲרוֺן עַלעָֿפָר יָקוּם and as one coming after (me) (and so able to establish my innocence when I am dead) will he (גָֹּֽאֲלִי my Vindicator) arise upon the dust.'
  - where: 'note 19:25 “At the last, upon the dust”'
    claim: 'A modern translation: “in the end he will stand upon the earth”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+19&version=NRSVUE'
    quote: '25 For I know that my vindicator lives and that in the end he will stand upon the earth;(R)'
  - where: 'note 19:25 “At the last, upon the dust”'
    claim: 'BDB: ʿāpār at Job 19:25 is the surface of the ground'
    key: bdb
    url: 'https://biblehub.com/hebrew/6083.htm'
    quote: 'c. = surface of ground Exodus 8:12; … Job 19:25; … f. earth of the grave: אֶשְׁכַּב ׳לֶע Job 7:21, so (with עַל) Job 20:11; Job 21:26, compare Job 17:16'
  - where: 'note 19:25 “At the last, upon the dust”'
    claim: 'The footnotes link “he” to the Second Coming and “stand” to the Resurrection of Jesus Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/19?lang=eng'
    quote: '25c “he”: TG Jesus Christ, Second Coming. … 25d “stand”: TG Jesus Christ, Resurrection.'

  - where: 'note 19:26 “In my flesh, or from my flesh?”'
    claim: 'The chapter heading reads 19:26 as resurrection: in his flesh he will see God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/19?lang=eng'
    quote: 'Job prophesies that he will be resurrected and that in his flesh he will see God.'
  - where: 'note 19:26 “In my flesh, or from my flesh?”'
    claim: 'The Hebrew is mibbĕśārî, “from my flesh”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'וּ֝/מִ/בְּשָׂרִ֗/י'
  - where: 'note 19:26 “In my flesh, or from my flesh?”'
    claim: 'Meservy: two renderings; the Hebrew says “from my flesh,” either sense; the house illustration; theology determines translation'
    key: ot-manual-job
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-3?lang=eng'
    quote: 'The Hebrew text says, ‘from my flesh,’ and this can be interpreted in either sense. The same ambiguity applies to English usage. If I say, ‘from the house I saw him coming,’ I could have been inside the house or just outside the house when I saw him coming. Thus, one’s theology determines how one translates this passage.'
  - where: 'note 19:26 “In my flesh, or from my flesh?”'
    claim: 'Meservy: “without my flesh” in the 1917 Jewish translation'
    key: ot-manual-job
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-3?lang=eng'
    quote: '‘Yet in my flesh shall I see God’ (King James Version) and ‘Then without my flesh shall I see God.’ (Jewish Publication Society Version, 1917). The first of these implies the literal resurrection, the other does not.'
  - where: 'note 19:26 “In my flesh, or from my flesh?”'
    claim: 'Meservy: Latter-day Saints do not depend on this passage but point to it as an affirmation'
    key: ot-manual-job
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-3?lang=eng'
    quote: 'Latter-day Saints do not depend upon this passage to establish their belief in a literal resurrection, but point to it as one more glorious affirmation of it.'
  - where: 'note 19:26 “In my flesh, or from my flesh?”'
    claim: 'A modern translation keeps “in my flesh”; v. 27 “on my side”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+19&version=NRSVUE'
    quote: '26 and after my skin has been destroyed, then in my flesh I shall see God,(S) 27 whom I shall see on my side, and my eyes shall behold, and not another.'
  - where: 'note 19:26 “In my flesh, or from my flesh?”'
    claim: 'Stirling: physical resurrection and seeing God are clear in the RSV'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'The idea of physical resurrection and seeing God are clear in the rsv translation above.'
  - where: 'note 19:26 “In my flesh, or from my flesh?”'
    claim: 'The seminary lesson: “after my skin worms destroy this body” is death and decay; doctrine of resurrection drawn'
    key: seminary-ot-teacher-108
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-108-job-17-37?lang=eng'
    quote: 'Explain that the phrase “after my skin worms destroy this body” in verse 26 refers to the death and decay of Job’s physical body.'
  - where: 'note 19:26 “In my flesh, or from my flesh?”'
    claim: 'The seminary lesson draws the doctrine that because of Christ''s Resurrection we too will be resurrected'
    key: seminary-ot-teacher-108
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-108-job-17-37?lang=eng'
    quote: 'Because of the Resurrection of Jesus Christ, we too will be resurrected.'
  - where: 'note 19:26 “In my flesh, or from my flesh?”'
    claim: 'The Bible Dictionary pairs 19:25–27 with 2 Ne. 9:4 as Job''s assurance of the bodily resurrection'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'Job’s assurance of the bodily resurrection and his testimony of the Redeemer (19:25–27; see also 2 Ne. 9:4)'
  - where: 'note 19:26 “In my flesh, or from my flesh?”'
    claim: '2 Ne. 9:4 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/9?lang=eng'
    quote: 'our flesh must waste away and die; nevertheless, in our bodies we shall see God.'

  - where: 'note 19:28 “There is a judgment”'
    claim: 'A modern translation reads v. 28 as the friends'' words'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+19&version=NRSVUE'
    quote: '28 If you say, ‘How we will persecute him!’ and, ‘The root of the matter is found in him,’(U) 29 be afraid of the sword, for wrath brings the punishment of the sword, so that you may know there is a judgment.”'
  - where: christ
    claim: 'The Guide: Jesus Christ the great Redeemer, through His Atonement, made possible the resurrection'
    key: gs-redeemer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/redeemer?lang=eng'
    quote: 'Jesus Christ is the great Redeemer of mankind because He, through His Atonement, paid the price for the sins of mankind and made possible the resurrection of all people.'
  - where: christ
    claim: 'Renlund calls 19:25–26 Job''s testimony of the Savior'
    key: renlund-trust-god
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/08/03_trust-god-and-let-him-prevail?lang=eng'
    quote: 'Job’s testimony of the Savior is inspiring thousands of years after he uttered it.'
  - where: christ
    claim: 'Job does not say who the redeemer is'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Now, Job does not say who this redeemer is; only he knows and hopes that he will come to make things right.'
  - where: christ
    claim: 'Davis: Job''s hope foreshadows Christ, a close kinsman in the family of God who reconciles the irreconcilable'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Now, Job does not say who this redeemer is; only he knows and hopes that he will come to make things right. Job’s hope beautifully foreshadows the role and mission of Jesus Christ, one of our close kinsmen in the family God who will come to earth in order to reconcile the irreconcilable problems of our times'
