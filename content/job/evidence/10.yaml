chapter: 10
claims:
  - where: setting
    claim: 'In chapter 10 Job moves from his reply to Bildad to a prayer to God; he wants above all to talk to God and demands answers'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job moves from his reply to Bildad to a prayer to God. In arguing with his friends, Job realizes that above all else, he wants a chance to talk to God.'
  - where: setting
    claim: 'Like the friends, Job had believed in an orderly world where a just God rewards the righteous and punishes the wicked; now he knows it is flawed, but holds to his innocence'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Chapters 9 and 10 put Job’s dilemma in sharp perspective. Like the friends, Job had always believed that the world was an orderly place, created and controlled by a perfectly just God who rewarded the righteous with good and the wicked with calamity.'
  - where: setting
    claim: 'Job holds firmly to his innocence (9:15, 20, 21; 10:1)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Now, as a result of his own experience, Job knows that this assumption is flawed. Disoriented, but firmly holding to the truth of his own innocence (see Job 9:15, 20, 21; 10:1)'
  - where: setting
    claim: 'In chapter 9 Job laments the impossibility of contending against God, who cannot be answered like a man'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job laments the utter impossibility of contending against or even communicating meaningfully with such a being, who cannot be answered like a man (see Job 9:3, 11–12, 32–33).'
  - where: thread
    claim: 'The movement of the chapter: the request for the charge, “Thou knowest that I am not wicked,” the questions of 3–6 and 8–13, the plea of 15, the wish not to have been born and for God to let up (18–22)'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job asserts that “Thou knowest that I am not wicked” (verse 7) and questions what God is trying to discover by bringing these afflictions upon him (verses 3–6, 8–13). … Job expresses to God that he wishes that he had not been born (verses 18–19; see chapter 3)'
  - where: thread
    claim: 'Verse 13 states a hidden purpose that rules the strophe that follows'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/10.htm'
    quote: 'All that follows receives a future colouring from this principal clause, "This is what Thou hadst designed to do," which rules the strophe.'
  - where: 'note 10:2 “Job asks God to name the charge”'
    claim: 'The verb “condemn” in 10:2 means to condemn as guilty'
    key: bdb
    url: 'https://biblehub.com/hebrew/7561.htm'
    quote: '2 condemn as guilty, in ethical and religious relations, with accusative 1 Kings 8:32; Job 9:20; Job 10:2'
  - where: 'note 10:2 “Job asks God to name the charge”'
    claim: 'The verb “contendest” (rîb) in 10:2 means to conduct a legal case against someone'
    key: bdb
    url: 'https://biblehub.com/hebrew/7378.htm'
    quote: '3 conduct a (legal) case, suit, usually figurative, ׳י subject; … with accusative of person with whom (unfriendly sense), Job 10:2'
  - where: 'note 10:2 “Job asks God to name the charge”'
    claim: '“Do not condemn me” is the hiphil of rāšaʿ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'תַּרְשִׁיעֵ֑/נִי'
  - where: 'note 10:2 “Job asks God to name the charge”'
    claim: '“contendest” is rîb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'תְּרִיבֵֽ/נִי'
  - where: 'note 10:2 “Job asks God to name the charge”'
    claim: 'Job says no one can ask God what He is doing, and then does just that, driven by the need to know why God contends against him'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Ironically protesting that no one can ask God what He is doing, Job does precisely this, propelled forward by the need to understand why God is contending against him (see Job 9:12, 10; 2).'
  - where: 'note 10:2 “Job asks God to name the charge”'
    claim: 'A modern translation of 10:1–2: “I will give free utterance to my complaint … let me know why you contend against me”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2010&version=NRSVUE'
    quote: 'I loathe my life; I will give free utterance to my complaint; I will speak in the bitterness of my soul. 2 I will say to God, ‘Do not condemn me; let me know why you contend against me.'
  - where: 'note 10:2 “Job asks God to name the charge”'
    claim: 'Job wants above all a chance to talk to God, and demands answers so he can understand'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job demands answers so he can understand what has been happening to him.'
  - where: 'note 10:2 “Job asks God to name the charge”'
    claim: 'In 10:2 and 15 Job says he does not know why his afflictions came'
    key: seminary-ot-teacher-107
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-107-job-1-16?lang=eng'
    quote: 'Invite a student to read Job 10:2, 15 aloud. Explain that these verses record that Job said he did not know why his afflictions had come upon him.'
  - where: 'note 10:4 “God does not see as a man sees”'
    claim: 'The questions of 10:4–6 supply their own negative; “eyes of flesh” judge by outward appearance; the question rests on 1 Sam. 16:7; suffering appears as a means of inquisition, as with a mortal ruler'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/10.htm'
    quote: 'Whether God has eyes of flesh, i.e., of sense, which regard only the outward appearance … This question also supplies its own negative; it is based upon the thought that God lookest on the heart (1 Samuel 16:7).'
  - where: 'note 10:4 “God does not see as a man sees”'
    claim: 'The third question: is God''s life short like man''s, so that He must extort a confession quickly; suffering as inquisition followed by judgment; such proceeding fits a mortal ruler'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/10.htm'
    quote: 'must institute such a painful course of investigation with him, in order to extort from him as quickly as possible a confession of it? Suffering appears here to be a means of inquisition, which is followed by the final judgment when the guilt is proved.'
  - where: 'note 10:8 “Formed by God''s own hands”'
    claim: 'This strophe and Ps. 139:13–16 are the two poetic passages on the formation of the embryo; Scripture traces it to God as cause, not to instruct in biology; the creation of Adam is repeated in each individual'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/10.htm'
    quote: 'There are two poetical passages which treat explicitly of this mysterious existence: this strophe of the book of Job, and the Psalm by David, Psalm 139:13-16 … Scripture nowhere attempts an analysis of the workings of nature, but only traces them back to their final cause.'
  - where: 'note 10:8 “Formed by God''s own hands”'
    claim: 'The primal origin of man from the earth is repeated in the womb; milk and curdled cheese picture the embryo taking shape'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/10.htm'
    quote: 'The primal origin of man, de limo terrae (Job 33:6; Psalm 139:15), is repeated in the womb. … The embryo forming itself from the sperma is like milk which is curdled and beaten into shape.'
  - where: 'note 10:8 “Formed by God''s own hands”'
    claim: '“The work of Thy hands” implies a negative answer to verse 3: such disdain is contrary to the love to which man owes his existence'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/10.htm'
    quote: 'Moreover, "the work of Thy hands" involves a negative reply to the question. Such an unloving mood of self-satisfaction is contrary to the bounty and beneficence of that love to which man owes his existence.'
  - where: 'note 10:8 “Formed by God''s own hands”'
    claim: 'Job was graciously brought into being and sustained, only to come, as he sees it, to a terrible end'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/10.htm'
    quote: 'Thus graciously has he been brought into being, and his life sustained, in order that he may come to such a terrible end.'
  - where: 'note 10:12 “The care that kept him now watches him”'
    claim: '“Favour” in 10:12 is ḥesed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'וָ֭/חֶסֶד'
  - where: 'note 10:12 “The care that kept him now watches him”'
    claim: '“Preserved” in 10:12 is šāmar'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'שָֽׁמְרָ֥ה'
  - where: 'note 10:12 “The care that kept him now watches him”'
    claim: '“Markest” in 10:14 is šāmar again'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'וּ/שְׁמַרְתָּ֑/נִי'
  - where: 'note 10:12 “The care that kept him now watches him”'
    claim: 'pĕquddāh means oversight, charge, visitation'
    key: bdb
    url: 'https://biblehub.com/hebrew/6486.htm'
    quote: 'מְּקֻדָּה32 noun feminine oversight, mustering, visitation, store'
  - where: 'note 10:12 “The care that kept him now watches him”'
    claim: 'šāmar means keep, watch, preserve; at Job 10:14 it means watch suspiciously'
    key: bdb
    url: 'https://biblehub.com/hebrew/8104.htm'
    quote: 'I. שָׁמַר465 verb keep, watch, preserve … = watch (suspiciously) Job 10:14; Job 13:27; Job 33:11'
  - where: 'note 10:12 “The care that kept him now watches him”'
    claim: 'A modern translation of 10:12–13: steadfast love, “your care has preserved my spirit,” “this was your purpose”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2010&version=NRSVUE'
    quote: 'You have granted me life and steadfast love, and your care has preserved my spirit. 13 Yet these things you hid in your heart; I know that this was your purpose.'
  - where: 'note 10:12 “The care that kept him now watches him”'
    claim: 'A modern translation of 10:15: “filled with disgrace”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2010&version=NRSVUE'
    quote: 'If I am righteous, I cannot lift up my head, for I am filled with disgrace and look upon my affliction.'
  - where: 'note 10:17 “Witnesses and fresh troops”'
    claim: 'A modern translation of 10:16–17: “Bold as a lion you hunt me; you repeat your exploits … you bring fresh troops against me”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2010&version=NRSVUE'
    quote: 'Bold as a lion you hunt me; you repeat your exploits against me. 17 You renew your witnesses against me and increase your vexation toward me; you bring fresh troops against me.'
  - where: 'note 10:17 “Witnesses and fresh troops”'
    claim: 'One Latter-day Saint reading: the friends are witnesses against Job, part of a larger crowd Job sees as coming from God; Job still holds the understanding of God he shares with the community'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Thus, the friends — witnesses against Job — seem to be exponents of a larger crowd phenomenon, which Job sees as coming from God. Job is still holding to his initial, untransformed understanding of God, which is shared with the community.'
  - where: 'note 10:21 “A land without order”'
    claim: 'A modern translation of 10:20–22: “Let me alone … the land of gloom and deep darkness, the land of gloom and chaos, where light is like darkness”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2010&version=NRSVUE'
    quote: 'Let me alone, that I may find a little comfort before I go, never to return, to the land of gloom and deep darkness, 22 the land of gloom and chaos, where light is like darkness.'
  - where: 'note 10:21 “A land without order”'
    claim: 'Job wishes he had not been born (10:18–19; see chapter 3) and feels life is short and hard enough that God should let up (20–22)'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job expresses to God that he wishes that he had not been born (verses 18–19; see chapter 3) and feels that life is short and hard enough that God should let up on him (verses 20–22).'
  - where: 'note 10:21 “A land without order”'
    claim: '“Without any order” in 10:22 is lōʾ sĕdārîm, “no” with the plural of seder; the noun occurs only here in Job (hebrew.mjs --word 5468: 1 occurrence)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'סְדָרִ֗ים'
  - where: 'note 10:21 “A land without order”'
    claim: 'Seder means arrangement, order; it occurs only in Job 10:22, where “not orders” means disorder, confusion, of the dark underworld'
    key: bdb
    url: 'https://biblehub.com/hebrew/5468.htm'
    quote: '[סֵ֫דֶר] noun [masculine] arrangement, order … - only plural לֹא סְדָרִים Job 10:22 = disorder, confusion, of the dark underworld.'
  - where: christ
    claim: 'The Church''s footnote to “made” in 10:8 points to the Topical Guide, “Jesus Christ, Creator”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/10?lang=eng'
    quote: '“made”: TG Jesus Christ, Creator.'
  - where: christ
    claim: 'The Church''s footnote to “bitterness” in 10:1 points to Moses 7:44'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/10?lang=eng'
    quote: '“bitterness”: Isa. 38:15; Moses 7:44 (42–44).'
  - where: christ
    claim: 'The principle drawn from 10:2, 15 and 13:15: though we may not know the reasons for our trials, we must continue to trust in the Lord'
    key: seminary-ot-teacher-107
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-107-job-1-16?lang=eng'
    quote: 'Although we may not know the reasons for our trials, we must continue to trust in the Lord.'
  - where: christ
    claim: 'Above all, Job wants a chance to talk to God'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'In arguing with his friends, Job realizes that above all else, he wants a chance to talk to God.'
  - where: explore
    claim: 'Psalm 139:13–16 is the other poem on the formation of a child in the womb'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/10.htm'
    quote: 'There are two poetical passages which treat explicitly of this mysterious existence: this strophe of the book of Job, and the Psalm by David, Psalm 139:13-16'
