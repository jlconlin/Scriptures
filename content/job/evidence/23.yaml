chapter: 23
claims:
  # setting
  - where: setting
    claim: 'Eliphaz falsely accused Job of mistreating others (22:5–10)'
    key: ot-seminary-2026-job-21-42
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-manual-2026/32-job/323-job-21-42?lang=eng'
    quote: 'Eliphaz falsely accused Job of mistreating others. He believed Job’s suffering was the result of wickedness.'
  - where: setting
    claim: 'Job seems to tire of addressing his friends and says again that he wants an audience with God'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'In this reply, Job seems to tire of addressing his friends directly and reiterates what he really wants: an audience with God.'
  - where: setting
    claim: 'Job ignores Eliphaz and wants a face-to-face meeting with God, not the contrived repentance Eliphaz recommended (22:21–30)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Ignoring Eliphaz, Job expresses a fervent wish to find God and present his case in person … Job’s overwhelming desire is a face-to-face meeting with God, not by contrived repentance as recommended by Eliphaz (see Job 22:21–30), but in honesty and fairness.'

  # thread
  - where: thread
    claim: 'In 23:6–10 Job now sees he can speak to God with reason, that God will not overwhelm him, and that acquittal can be expected, in contrast with chapter 9'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'He now realizes that he can speak to God with reason and honesty (contrast with Job 9:32). He understands that God will not simply overwhelm him with His greater power and that acquittal can be expected (contrast with Job 9:20, 30–31).'
  - where: thread
    claim: 'Despite confidence in God’s purposes, Job is afraid of further suffering (23:13–16)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Nonetheless, despite confidence in God’s purposes, Job is afraid of the prospect of further suffering (see Job 23:13–16).'
  - where: thread
    claim: 'Despite his confidence and his demand for a trial, Job is troubled at God’s presence and afraid'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Despite Job’s confidence and his demand for a trial, he still feels “troubled at this presence” and is afraid of God (verse 15).'

  # section 1 plain (verse 6, a rendering that departs from the KJV's supplied word)
  - where: section 1 plain
    claim: 'Verse 6 read as God giving heed to Job; verse 7 as acquittal by the judge'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+23&version=NRSVUE'
    quote: 'Would he contend with me in the greatness of his power? No, but he would give heed to me. There the upright could reason with him, and I should be acquitted forever by my judge.'

  # section 3 plain (verse 16, faint)
  - where: section 3 plain
    claim: 'Verse 16: God has made Job’s heart faint'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+23&version=NRSVUE'
    quote: 'God has made my heart faint; the Almighty has terrified me.'

  # note 23:3
  - where: 'note 23:3 “The hearing Job wants”'
    claim: 'Job wishes to face God and argue his case; the desire gives him hope'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'This desire to face God and argue his case gives Job hope, for “there the righteous might dispute with him; so should I be delivered for ever from my judge” (verse 7).'
  - where: 'note 23:3 “The hearing Job wants”'
    claim: 'The Hebrew of verse 6 has no word for strength: “only he would set on me”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'לֹ֥א אַךְ ה֝֗וּא יָשִׂ֥ם בִּֽ/י'
  - where: 'note 23:3 “The hearing Job wants”'
    claim: 'The verb of verse 6 means to put or set'
    key: bdb
    url: 'https://biblehub.com/hebrew/7760.htm'
    quote: 'שׂוּם (sum or sim) -- To put, place, set, appoint, make … יָשִׂם Job 23:6'
  - where: 'note 23:3 “The hearing Job wants”'
    claim: 'A modern translation reads verse 6 “he would give heed to me” and verse 7 “acquitted forever by my judge”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+23&version=NRSVUE'
    quote: 'No, but he would give heed to me. There the upright could reason with him, and I should be acquitted forever by my judge.'
  - where: 'note 23:3 “The hearing Job wants”'
    claim: 'Stirling: Job now realizes he can speak with God with reason, God will not overwhelm him, acquittal can be expected'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'He now realizes that he can speak to God with reason and honesty (contrast with Job 9:32). He understands that God will not simply overwhelm him with His greater power and that acquittal can be expected'
  - where: 'note 23:3 “The hearing Job wants”'
    claim: 'Stirling: when God challenges Job to answer “like a man” (38:3), it fulfills Job’s hope of 23:7 against his despair of 9:32'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'God challenges Job to respond to His questions “like a man,” making God to know (see Job 38:3), thus fulfilling Job’s hope (see Job 23:7) against his earlier despair (see Job 9:32).'

  # note 23:10 gold
  - where: 'note 23:10 “Tried as gold”'
    claim: 'Job seeks God in honesty, not by the contrived repentance Eliphaz recommended (22:21–30)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Job’s overwhelming desire is a face-to-face meeting with God, not by contrived repentance as recommended by Eliphaz (see Job 22:21–30), but in honesty and fairness.'
  - where: 'note 23:10 “Tried as gold”'
    claim: 'The verb “try” is used here with the metaphor of gold, as in Zechariah 13:9'
    key: bdb
    url: 'https://biblehub.com/hebrew/974.htm'
    quote: 'a. with the metaphor of gold Job 23:10; וּבְחַנְתִּים כִּבְחֹן אֶתהַֿזָּהָב and I will try them as one tries gold Zechariah 13:9.'
  - where: 'note 23:10 “Tried as gold”'
    claim: 'Job is confident he will come forth as gold because he has kept God’s way (23:9–11)'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Although Job as yet “cannot behold him,” Job is confident that he will “come forth as gold,” because “my foot hath held his steps, his way have I kept” (verses 9–11).'
  - where: 'note 23:10 “Tried as gold”'
    claim: 'The verb of 23:12 means treasure up, in the heart, compare Psalm 119:11'
    key: bdb
    url: 'https://biblehub.com/hebrew/6845.htm'
    quote: '= treasure up a thing, Proverbs 10:14, + אִתְּךָ with thyself, in thine own keeping Proverbs 2:1 = Proverbs 7:1, in (ב) the heart Job 10:13 (subject ׳י; of secret purposes), Psalm 119:11, compare Job 23:12'
  - where: 'note 23:10 “Tried as gold”'
    claim: '“Necessary food” is a word for a prescribed portion or allowance of food; the Greek and others read “in my bosom”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2706.htm'
    quote: '2 prescribed portion, or allowance of food Genesis 47:22 (twice in verse) (J); Proverbs 30:8; Proverbs 31:15; Ezekiel 16:27; מחקי Job 23:12 (RV; < ᵐ5 ᵑ9 Ol Me Di SS בְּחֵקִי in my bosom).'
  - where: 'note 23:10 “Tried as gold”'
    claim: 'The Greek reads “I have hid his words in my bosom”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/job/23.htm'
    quote: '10For he knows already my way; and he has tried me as gold. … 12neither shall I transgress; but I have hid his words in my bosom.'
  - where: 'note 23:10 “Tried as gold”'
    claim: 'A modern translation follows the Greek in verse 12; the Hebrew reads “more than my daily bread”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+23&version=NRSVUE'
    quote: 'I have treasured his words in my bosom. … 23.12 Gk: Heb words more than my daily bread'
  - where: 'note 23:10 “Tried as gold”'
    claim: 'Renlund: Job would be refined by his experiences'
    key: renlund-trust-god
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/08/03_trust-god-and-let-him-prevail?lang=eng'
    quote: 'Because of his trust in God, Job learned that “when [God] hath tried me, I shall come forth as gold” (Job 23:10). Job would be refined by the experiences he had.'
  - where: 'note 23:10 “Tried as gold”'
    claim: 'The 2026 seminary manual: Job knew God was aware of him and that his trials would refine him (23:10)'
    key: ot-seminary-2026-job-1-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-manual-2026/32-job/321-job-1-13?lang=eng'
    quote: 'knew God was aware of him and that his trials would refine him (see Job 23:10).'
  - where: 'note 23:10 “Tried as gold”'
    claim: 'Stirling: Job comprehends that his trials have a transforming purpose that will bring him forth as gold, of great value to God'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Finally, Job comprehends that his trials have a transforming purpose, which will bring him forth as “gold,” as something of great value to God.'

  # note 23:10 Liberty Jail
  - where: 'note 23:10 “The same lesson in Liberty Jail”'
    claim: 'The Guide: the book shows affliction does not necessarily mean sin; the Lord may use affliction for experience and instruction as well as punishment (D&C 122)'
    key: gs-job
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/job?lang=eng'
    quote: 'The book clarifies that having afflictions does not necessarily mean that a person has sinned. The Lord may use affliction for experience, discipline, and instruction as well as for punishment (D&C 122).'
  - where: 'note 23:10 “The same lesson in Liberty Jail”'
    claim: 'Eyring: the Lord gave Job the same lesson, letting him see his situation with spiritual eyes (then quotes Job 38:3–7)'
    key: eyring-holiness-plan
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2019/10/51eyring?lang=eng'
    quote: 'Yet the Lord gave Job the same correcting lesson He gave Joseph Smith. He let Job see his heartbreaking situation with spiritual eyes.'
  - where: 'note 23:10 “The same lesson in Liberty Jail”'
    claim: 'D&C 122 is the word of the Lord to Joseph Smith in the jail at Liberty, from an epistle written around 22 March 1839'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/122?lang=eng'
    quote: 'The word of the Lord to Joseph Smith the Prophet, while a prisoner in the jail at Liberty, Missouri. This section is an excerpt from an epistle to the Church written around March 22, 1839.'
  - where: 'note 23:10 “The same lesson in Liberty Jail”'
    claim: 'Joseph Smith inserted “and shall be for thy good” in the rough draft'
    key: jsp-letter-1839-03-22
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-edward-partridge-and-the-church-circa-22-march-1839/4'
    quote: 'know thou my son that all these things shall give thee experiance and shall be for thy good.42 … 42: JS inserted “and shall be for thy good” in the rough draft.'
  - where: 'note 23:10 “The same lesson in Liberty Jail”'
    claim: 'Eyring: the Lord taught His faithful and suffering prophet in Liberty Jail; it was the same lesson the Lord gave Job'
    key: eyring-holiness-plan
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2019/10/51eyring?lang=eng'
    quote: 'Here is the Lord’s message to His faithful and suffering prophet: … That was the same instructive lesson the Lord gave Job, who paid a heavy price to allow the Atonement to make him more holy.'
  - where: 'note 23:10 “The same lesson in Liberty Jail”'
    claim: 'Eyring: Joseph had been faithful and prayed for relief in Liberty Jail; he felt happiness had been denied'
    key: eyring-holiness-plan
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2019/10/51eyring?lang=eng'
    quote: 'He prayed for relief when he was confined in a jail in Liberty, Missouri. He had been faithful to the Lord. He had grown in holiness. Yet he felt happiness had been denied.'

  # note 23:15
  - where: 'note 23:15 “Why Job is afraid”'
    claim: 'One older reading: “he is in one” means the unchangeable uniformity of God’s purpose concerning Job'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/23.htm'
    quote: 'if הוא באחד is intended to be understood of the unchangeable uniformity of His purpose concerning Job, the explanation: versatur (perstat) in uno … is not only equally, but more natural, and we therefore prefer it.'
  - where: 'note 23:15 “Why Job is afraid”'
    claim: 'The Hebrew of 23:13 reads “and he in one”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: 'וְ/ה֣וּא בְ֭/אֶחָד'
  - where: 'note 23:15 “Why Job is afraid”'
    claim: 'A modern translation: “he stands alone”; “I am terrified at his presence”; “God has made my heart faint”; verse 17 as a wish, with the margin’s alternative'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job+23&version=NRSVUE'
    quote: 'But he stands alone, and who can dissuade him? … Therefore I am terrified at his presence … God has made my heart faint … If only I could vanish in darkness … 23.17 Or But I am not destroyed by the darkness; he has concealed the thick darkness from me'
  - where: 'note 23:15 “Why Job is afraid”'
    claim: 'The word for what is “appointed” in 23:14 is used of the destiny of man'
    key: bdb
    url: 'https://biblehub.com/hebrew/2706.htm'
    quote: 'covenant with Jacob Psalm 105:10 = 1 Chronicles 16:17; destiny of man Job 23:14.'
  - where: 'note 23:15 “Why Job is afraid”'
    claim: 'The verb of 23:16 is the causative of “be tender, weak, of heart; be timid, fearful”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7401.htm'
    quote: '1 be tender, weak, of heart : a. be timid, fearful … Hiph`il Perfect3masculine singular וְאֵל הֵרַךְ לִבִּי Job 23:16 (Ges§ 67v), causative of Qal 1 a.'
  - where: 'note 23:15 “Why Job is afraid”'
    claim: 'Stirling: despite confidence in God’s purposes, Job is afraid of further suffering'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Nonetheless, despite confidence in God’s purposes, Job is afraid of the prospect of further suffering (see Job 23:13–16).'
  - where: 'note 23:15 “Why Job is afraid”'
    claim: 'One older reading: what disconcerts Job is not the darkness of affliction but God’s hostile conduct and angry countenance'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/23.htm'
    quote: 'it is not the encircling darkness of affliction, not the mysterious form of his suffering which disconcerts him, but God''s hostile conduct towards him, His angry countenance as he seems to see it, and which he is nevertheless unable to explain.'

  # christ
  - where: christ
    claim: 'Renlund sets Lehi’s promise that God will consecrate afflictions for gain beside Job’s “I shall come forth as gold”'
    key: renlund-trust-god
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/08/03_trust-god-and-let-him-prevail?lang=eng'
    quote: '“Nevertheless, … thou knowest the greatness of God; and he shall consecrate thine afflictions for thy gain” (2 Nephi 2:1–2). “When [God] hath tried me,” Job learned, “I shall come forth as gold.”'
  - where: christ
    claim: 'D&C 122:8, the Son of Man descended below them all, spoken to Joseph Smith in Liberty Jail'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/122?lang=eng'
    quote: 'The Son of Man hath descended below them all. Art thou greater than he?'
