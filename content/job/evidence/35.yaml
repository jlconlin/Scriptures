chapter: 35
claims:
  - where: setting
    claim: 'Chapter 35 is Elihu''s third speech, and Job is silent after it as after the others'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/35.htm'
    quote: 'Thus, even at the close of this third speech of Elihu, … Job is silent also after this speech.'
  - where: setting
    claim: 'Elihu condemns Job on grounds different from the three friends; Job makes no reply to him'
    key: bd-job-book
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/job-book-of?lang=eng'
    quote: 'Job 32–37 contains the speeches of Elihu, who is shocked at what he regards as impiety on the part of Job, and condemns him, though on different grounds from the “three friends.” … Job makes no reply to him.'
  - where: setting
    claim: 'Elihu''s teaching has wisdom in general; its fault is assuming the suffering are the wicked'
    key: ot-minute-job-36
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-36'
    quote: 'If we take Elihu’s teachings and apply them generally, not to Job’s specific situation, there is a lot of wisdom in them. … The problem that Elihu and Job’s friends shared is that they assumed that the wicked and the suffering are the same people.'
  - where: setting
    claim: 'Elihu''s main point here is already Eliphaz''s (22:2–3)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/35.htm'
    quote: 'That the piety of the pious profits himself without involving God in any obligation to him, Eliphaz has already said, Job 22:2.'
  - where: setting
    claim: 'Elihu''s earlier speech had quoted Job as saying it profits nothing to delight in God (34:9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/34?lang=eng'
    quote: 'For he hath said, It profiteth a man nothing that he should delight himself with God.'

  - where: thread
    claim: 'A modern translation sets the speech in two stanzas, verses 1–8 and 9–16'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2035&version=NRSVUE'
    quote: '8 Your wickedness affects others like you, and your righteousness, other human beings. … 9 “Because of the multitude of oppressions people cry out;'
  - where: thread
    claim: 'From the height of heaven Elihu infers the exaltation of God, whom human conduct cannot affect'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/35.htm'
    quote: 'Towards heaven he is to direct his gaze, to obtain from the height of heaven a notion of the exaltation of God who dwells above the heavens. … Human wrong or right doing neither diminishes nor increases His blessedness'
  - where: thread
    claim: 'The second stanza answers Job''s complaint that God does not hear the oppressed (24:12)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/35.htm'
    quote: 'Elihu weakens the doubt expressed by Job in Job 24:12, that God allows injustice to prevail, and oppressed innocence remains without vindication.'

  - where: section 4 plain
    claim: 'Verses 14–15 in a modern translation: the case is before him; his anger does not punish; meaning uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2035&version=NRSVUE'
    quote: 'that the case is before him and you are waiting for him! 15 And now, because his anger does not punish and he does not greatly heed transgression,'

  - where: 'note 35:2 “Did Job say he was more righteous than God?”'
    claim: 'Elihu''s question puts Job''s righteousness above God''s; the Hebrew is comparative, as at 32:2'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/35.htm'
    quote: 'Considerest thou this to be right, and thinkest thou on this account to be able to put thy righteousness above the divine, … מן comparative as Job 32:2'
  - where: 'note 35:2 “Did Job say he was more righteous than God?”'
    claim: 'Job never said verse 3 directly; he cites it as the saying of the ungodly (21:15), but it is implied in 9:22'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/35.htm'
    quote: 'Job has not directly said (he cites it, Job 21:15, as the saying of the ungodly) what Elihu in Job 35:3 puts into his mouth, but as an inference it certainly is implied in such utterances as Job 9:22.'
  - where: 'note 35:2 “Did Job say he was more righteous than God?”'
    claim: 'The companions are not the three friends, as the Greek and Jerome translate, but the wicked to whom Elihu likened Job (34:8, 36)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/35.htm'
    quote: 'Elihu''s polemic against Job and his companions (רעיך are not the three, as lxx and Jer. translate, but the אנשׁי און, to whom Job is likened by such words as Job 34:8, Job 34:36) is therefore not unauthorized'
  - where: 'note 35:2 “Did Job say he was more righteous than God?”'
    claim: 'A modern translation: "I am in the right before God"; "your friends with you"'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2035&version=NRSVUE'
    quote: 'You say, ‘I am in the right before God.’(A) 3 If you ask, ‘What advantage have I? How am I better off than if I had sinned?’(B) 4 I will answer you and your friends with you.'
  - where: 'note 35:2 “Did Job say he was more righteous than God?”'
    claim: 'Job felt his righteousness had not saved him from suffering; God destroys the perfect and the wicked (9:22)'
    key: ot-minute-job-35
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-35'
    quote: 'Job felt that his righteousness had not saved him from pain and suffering and that his experience had told him that God “destroyeth the perfect and the wicked” (9:22).'

  - where: 'note 35:2 “Did Job say he was more righteous than God?”'
    claim: 'Elihu''s anger began because Job justified himself rather than God (32:2)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/32?lang=eng'
    quote: 'against Job was his wrath kindled, because he justified himself rather than God.'
  - where: 'note 35:7 “Does our righteousness reach God?”'
    claim: 'The question of profit goes back to the satan''s accusation that Job''s relationship with God was a transaction (1:9); Elihu''s point is insightful'
    key: ot-minute-job-35
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-35'
    quote: 'This is an important issue in the book, and it takes us back to the conversation between Satan and God in Job 2, in which Satan accused Job of having a transactional relationship with God.'
  - where: 'note 35:7 “Does our righteousness reach God?”'
    claim: 'Elihu''s point on profit cuts to the heart of the book; Job''s behavior affects only other humans'
    key: ot-minute-job-35
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-35'
    quote: 'Elihu took issue with Job’s talk of profit, and this insightfully cuts to the heart of an important theme in Job. … Elihu made the case that Job did not affect God by his behavior; Job’s behavior could only affect other humans'
  - where: 'note 35:7 “Does our righteousness reach God?”'
    claim: 'Elihu''s argument can be read like King Benjamin''s: we are unprofitable servants; God serves us because He loves us'
    key: ot-minute-job-35
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-35'
    quote: 'In some ways, we can read Elihu’s argument like King Benjamin’s in Mosiah 2. … He serves us and helps us not because we provide Him benefits but because He loves us.'
  - where: 'note 35:7 “Does our righteousness reach God?”'
    claim: 'Our righteousness and wickedness do affect God, bringing joy or breaking His heart; God weeps (Moses 7); joy in heaven (Luke 15)'
    key: ot-minute-job-35
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-35'
    quote: 'In this sense, our righteousness and wickedness really do affect God, not because they add or take away from some cosmic bank account but because they bring joy to God—or they break His heart.'
  - where: 'note 35:7 “Does our righteousness reach God?”'
    claim: 'God does not watch wickedness unaffected; He weeps (Moses 7); repentance brings joy in heaven (Luke 15)'
    key: ot-minute-job-35
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-35'
    quote: 'As Enoch learned, God does not watch the wickedness of the world in an unaffected way; He weeps because of it (Moses 7). As Jesus taught us in Luke 15, righteousness demonstrated through repentance brings joy and rejoicing in heaven.'
  - where: 'note 35:7 “Does our righteousness reach God?”'
    claim: 'A modern translation''s cross-references set verse 7 beside Eliphaz''s 22:2–3'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2035&version=NRSVUE'
    quote: '35.7 : Job 22.2, 3; Prov 9.12; Lk 17.10'

  - where: 'note 35:10 “Songs in the night”'
    claim: 'Elihu answers Job''s doubt (24:12); the sufferers complain but do not seek God their maker, who puts songs of praise into their mouths in the night of sorrow'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/35.htm'
    quote: 'The failure of the latter arises from the fact of the sufferers complaining, but not seeking earnestly the only true helper, God their maker … who in the night of sorrow puts songs of praise concerning the dawning light of help into the mouth of the sufferers. The singing of the glory of the nightly heavens (Stick., Hahn) is to be as little thought of as the music of the spheres'
  - where: 'note 35:10 “Songs in the night”'
    claim: 'Verse 11 read as God teaching us from the beasts, which cry to God (lions, Ps. 104:21; ravens, Ps. 147:9)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/35.htm'
    quote: 'who teaches … us from the beasts of the earth … of the many things that may be learned from the animal creation, prayer here comes under consideration, - the lions roar, Psalm 104:21; the thirsty cattle cry to God, Joel 1:20; the ravens call upon God, Psalm 147:9.'
  - where: 'note 35:10 “Songs in the night”'
    claim: 'The thought of verse 10: affliction does not drive most men to God, who will be humbly entreated'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/35.htm'
    quote: 'the collective thought of Job 35:10, that affliction does not drive most men to God the almighty Helper, who will be humbly entreated for help'
  - where: 'note 35:10 “Songs in the night”'
    claim: 'A modern translation renders verse 13 "an empty cry"'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2035&version=NRSVUE'
    quote: '13 Surely God does not hear an empty cry, nor does the Almighty regard it.(J)'

  - where: 'note 35:14 “The case is before him”'
    claim: 'A modern translation: the case is before him and you are waiting for him'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2035&version=NRSVUE'
    quote: '14 How much less when you say that you do not see him, that the case is before him and you are waiting for him!(K)'
  - where: 'note 35:14 “The case is before him”'
    claim: 'Job had said he cannot see God (23:8–9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/23?lang=eng'
    quote: 'On the left hand, where he doth work, but I cannot behold him: he hideth himself on the right hand, that I cannot see him:'

  - where: 'note 35:14 “The case is before him”'
    claim: 'Job had longed to set his cause before God (23:3–4)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/23?lang=eng'
    quote: 'I would order my cause before him, and fill my mouth with arguments.'
  - where: 'note 35:14 “The case is before him”'
    claim: 'The Church''s chapter heading reads verse 14 as a call to trust in the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/35?lang=eng'
    quote: 'Man should trust in the Lord.'
  - where: 'note 35:14 “The case is before him”'
    claim: 'A modern translation reads verse 14 as a further reason God does not hear'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2035&version=NRSVUE'
    quote: 'How much less when you say that you do not see him'
  - where: 'note 35:16 “Words without knowledge”'
    claim: 'The Hebrew of verse 15 is uncertain; a modern translation reads it as God''s anger not punishing'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2035&version=NRSVUE'
    quote: '35.15 Meaning of Heb uncertain'
  - where: 'note 35:16 “Words without knowledge”'
    claim: 'A modern translation of verse 15: his anger does not punish and he does not greatly heed transgression'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2035&version=NRSVUE'
    quote: 'because his anger does not punish and he does not greatly heed transgression'
  - where: 'note 35:16 “Words without knowledge”'
    claim: 'Elihu had already charged Job with speaking without knowledge (34:35, 37); there was truth in it, since God said it (38:2), yet God said Job spoke what is right (42:7)'
    key: ot-minute-job-36
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-36'
    quote: 'Elihu had already pointed out that Job’s words in the face of his suffering were “rebellion” (34:37) and that Job had “spoken without knowledge” (34:35). There was some truth to this accusation since God Himself said that Job had spoken “words without knowledge” (38:2).'
  - where: christ
    claim: 'Our righteousness and wickedness bring joy to God or break His heart; our efforts cannot buy exemption from suffering'
    key: ot-minute-job-35
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-35'
    quote: 'We cannot use our unprofitable efforts to extort assurances that we will be spared struggles and suffering in life.'
  - where: christ
    claim: 'D&C 18:10–13: the worth of souls; the Redeemer suffered the pain of all men; His joy in the soul that repenteth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/18?lang=eng'
    quote: 'For, behold, the Lord your Redeemer suffered death in the flesh; wherefore he suffered the pain of all men, that all men might repent and come unto him.'
