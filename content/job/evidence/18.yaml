chapter: 18
claims:
  - where: when
    claim: 'Job 18 is Bildad''s second speech'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Job 18 is Bildad’s second response to Job.'

  - where: setting
    claim: 'Bildad speaks after Job mentioned he might soon die; he speaks of the wicked who do not know God, implying Job was wicked'
    key: seminary-ot-teacher-108
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-108-job-17-37?lang=eng'
    quote: 'Summarize Job 18 by explaining that after Job mentioned that he might soon die, one of his friends, Bildad, spoke about the state of the wicked who do not know God, implying that Job was also wicked.'
  - where: setting
    claim: 'Scripture Helps groups 18:1–5 with the friends'' accusations; they shifted from comfort to accusation'
    key: scripture-helps-job
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/31-job-1-3-12-14-19-21-24-38-40-42?lang=eng'
    quote: 'Compare Job 4:1–9; 8:1–6; 11:1–6; 15:1–6; 18:1–5 … Although Job’s friends initially showed compassion, they eventually shifted their approach from comfort to accusation.'
  - where: setting
    claim: 'Unlike the first speech, the second takes up no tone of promise'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/18.htm'
    quote: 'This second speech of Bildad begins, like the first (Job 8:2), with the reproach of endless babbling; but it does not end like the first (Job 8:22). … without taking up again anywhere the tone of promise'
  - where: setting
    claim: 'The Papers'' editors list chapter 18 among the speeches that charged Job with transgression'
    key: jsp-letter-1839-03-20
    url: 'https://www.josephsmithpapers.org/paper-summary/letter-to-the-church-and-edward-partridge-20-march-1839/8'
    quote: '39: See Job chaps. 4–5, 8, 11, 15, 18, 20, 22, 25, 32–37.'

  - where: thread
    claim: 'Bildad addresses Job in the plural; one older reading takes it as a reply to Job''s sarcasm; Job had called the friends unwise (17:4, 10)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/18.htm'
    quote: 'this address in the plur. is a reply to Job''s sarcasm by a similar one. … he addresses him in the plural, because he, the unit, has puffed himself up as such a collective whole.'
  - where: thread
    claim: 'Verse 4 turns Job''s words of 16:9 back on him'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/18.htm'
    quote: 'Bildad here lays to Job''s charge what Job, in Job 16:9, has said of God''s anger, that it tears him: he himself tears himself in his rage'
  - where: thread
    claim: 'The wicked man runs into the net with his own feet'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/18.htm'
    quote: 'by his own feet he is hurried into the net, i.e., against his will, and yet with his own feet he runs into destruction. The same thing is said in Job 18:8'
  - where: thread
    claim: 'The speech is about "the wicked," but the reader takes it to be about Job'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Bildad’s speech is about “the wicked,” but since Bildad refers so often to “him” and “he,” the reader easily assumes that he is just talking about Job.'
  - where: thread
    claim: 'Bildad speaks of the wicked in order to imply that Job is wicked'
    key: seminary-ot-teacher-108
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-108-job-17-37?lang=eng'
    quote: 'Bildad, spoke about the state of the wicked who do not know God, implying that Job was also wicked.'

  - where: section 1 plain
    claim: 'Verse 3: "counted as cattle," "stupid in your sight"; verse 2 "consider"'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2018&version=NRSVUE'
    quote: 'Consider, and then we shall speak. 3 Why are we counted as cattle? Why are we stupid in your sight?'
  - where: section 3 plain
    claim: 'Verse 13: the firstborn of death consumes the limbs'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2018&version=NRSVUE'
    quote: 'By disease their skin is consumed; the firstborn of Death consumes their limbs.'
  - where: section 4 plain
    claim: 'Verse 19: no offspring or descendant'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2018&version=NRSVUE'
    quote: 'They have no offspring or descendant among their people and no survivor where they used to live.'

  - where: 'note 18:4 “The earth will not move for one man”'
    claim: 'Rather than understand Job''s pain, Bildad takes offense at being counted as beasts'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Rather than understand the pain and confusion that Job is experiencing, Bildad finds offense because he feels that “we are counted as beasts, and reputed vile in [Job’s] sight” (Job 18:3).'
  - where: 'note 18:4 “The earth will not move for one man”'
    claim: 'Bildad, resentful at being thought stupid cattle, says Job''s demand is like moving the earth for one man; the fixed moral order expels the wicked'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Bildad (see Job 18), resentfully perceiving that Job considers the friends as stupid cattle,19 insists that what Job is suggesting is tantamount to moving the entire earth for one man (see Job 18:1–4). Instead, the fixed moral order in the universe expels the wicked and remains stable'

  - where: 'note 18:21 “Him that knoweth not God”'
    claim: 'Bildad describes the wicked who do not know God to imply that Job was wicked'
    key: seminary-ot-teacher-108
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-108-job-17-37?lang=eng'
    quote: 'Bildad, spoke about the state of the wicked who do not know God, implying that Job was also wicked.'

  - where: 'note 18:13 “The firstborn of death”'
    claim: 'Diseases pictured as children of death; the firstborn holds the whole destroying power of death, as a firstborn holds his father''s strength; the "strength" is the limbs'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/18.htm'
    quote: 'So here diseases are conceived of as children of death … he calls the "first-born of death," as that in which the whole destroying power of death is contained, as in the first-born the whole strength of his parent.'
  - where: 'note 18:13 “The firstborn of death”'
    claim: 'Death itself is "the king of terrors," distinct from the disease that is its firstborn'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/18.htm'
    quote: 'Death itself is called "the king of terrors," in distinction from the terrible disease which is called its first-born.'
  - where: 'note 18:13 “The firstborn of death”'
    claim: 'One older reading takes the firstborn of death to be a leprosy that consumes the limbs and slowly destroys the body'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/18.htm'
    quote: 'The first-born of death, that hands the ungodly over to death itself, the king of terrors, by consuming the limbs of the ungodly, is the Arabian leprosy, which slowly destroys the body.'
  - where: 'note 18:13 “The firstborn of death”'
    claim: 'A modern translation: the firstborn of Death consumes their limbs'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2018&version=NRSVUE'
    quote: 'By disease their skin is consumed; the firstborn of Death consumes their limbs.'
  - where: 'note 18:13 “The firstborn of death”'
    claim: 'The wicked of Bildad''s speech are afflicted with consumption of the skin, as Job is'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'The wicked are caught in traps, are afflicted with consumption of the skin (Job!), are brought to the king of terrors, and leave no memory or descendants behind.'

  - where: 'note 18:17 “No remembrance, no witness”'
    claim: 'Bildad''s claim that the wicked leave no trace rebuts Job''s hope in 16:18 that the earth would not cover his blood; the same reading holds that in Bildad''s view Job has no witness in heaven or on earth (quoted as that reading''s)'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Bildad’s contention that the wicked leave no trace in the world rebuts Job’s hope that the earth will not cover his blood (see Job 18:17, cf. 16:18). In Bildad’s view, Job will have no witness in heaven nor on earth.'

  - where: 'note 18:19 “A portrait with Job’s face”'
    claim: 'The speech seems to be about Job; Bildad says Job''s posterity will cease; perhaps he hopes Job will repent'
    key: ot-minute-job-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/job-4-25'
    quote: 'Bildad argues that the wicked’s “remembrance shall perish” and that all Job’s posterity will cease and be left desolate (verses 17, 19–21). … Perhaps Bildad feels that if he reminds Job of his eventual end, Job might repent.'
  - where: 'note 18:19 “A portrait with Job’s face”'
    claim: 'Bildad weaves references to Job into the description: the brimstone is the fire of God of 1:16, the withered branch is Job''s children'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/18.htm'
    quote: 'with a view of terrifying Job, Bildad interweaves distinct references to Job in his description; he knows, however, also how to conceal them under the rich drapery of diversified figures. … The brimstone indicates the fire of God … the withering of the branch, the death of Job''s children'
  - where: 'note 18:19 “A portrait with Job’s face”'
    claim: 'Brimstone from heaven, as on Sodom, marks a dwelling under a curse that will not be rebuilt'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/18.htm'
    quote: 'brimstone (from heaven, Genesis 19:24; Psalm 11:6) is strewn over the evil-doer''s habitation, i.e., in order to mark it as a place that, having been visited with the fulfilment of the curse, shall not henceforth be rebuilt and inhabited'

  - where: 'note 18:21 “Him that knoweth not God”'
    claim: 'The Lord called the three friends to repentance for their false ideas about His justice'
    key: scripture-helps-job
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/31-job-1-3-12-14-19-21-24-38-40-42?lang=eng'
    quote: 'Eventually, the Lord called these three friends to repentance for their false ideas about His justice.'
  - where: 'note 18:21 “Him that knoweth not God”'
    claim: 'The calamities of Bildad''s speech are similar to the fate decreed for Joseph Smith''s enemies in D&C 121:10–21'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: '20. Andersen, Job, 205. These calamities are curiously similar to the fate decreed for the enemies of Joseph Smith (D&C 121:10-21).'
  - where: 'note 18:21 “Him that knoweth not God”'
    claim: 'D&C 121:15–21: the fate of those who charge the Lord''s servants with transgression'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/121?lang=eng'
    quote: 'And not many years hence, that they and their posterity shall be swept from under heaven, saith God, that not one of them is left to stand by the wall.'

  - where: christ
    claim: 'From the depth of losing children, health and riches, Job declared his testimony that Jesus Christ lives'
    key: seminary-ot-teacher-108
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-job/lesson-108-job-17-37?lang=eng'
    quote: 'Even from the depth of the misfortune of losing children, health, and riches, Job declared his testimony that Jesus Christ lives and overcame the effects of the Fall of Adam.'
