chapter: 41
claims:
  - where: setting
    claim: 'Job had said he would lay his hand on his mouth and answer no more (40:3–5); the LORD challenged him to deck himself with majesty and abase the proud (40:8–14); behemoth (40:15); chapter 41 is about leviathan; Job answers in 42:1–6 (scripture)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/41?lang=eng'
    quote: 'The Lord points to His power in the leviathan—All things under the whole heaven are the Lord’s.'
  - where: setting
    claim: 'The Lord named behemoth and leviathan to help Job understand God’s power over all creation'
    key: scripture-helps-job
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/31-job-1-3-12-14-19-21-24-38-40-42?lang=eng'
    quote: 'The Lord referred to these creatures to help Job understand the great power God has over all of creation.'
  - where: setting
    claim: 'In the Hebrew numbering, 41:1 is 40:25'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2041&version=NRSVUE'
    quote: '41.1 40.25 in Heb'
  - where: setting
    claim: 'In the Hebrew numbering, 41:1 is 40:25 (and 41:11 is 41:3)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: '<note>KJV:Job.41.34</note>'
  - where: thread
    claim: 'Verse 22 in a modern translation: terror dances before it; verse 25: at the crashing they are beside themselves'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2041&version=NRSVUE'
    quote: 'In its neck abides strength, and terror dances before it. … When it raises itself up the gods are afraid; at the crashing they are beside themselves.'
  - where: 'note 41:1 “Leviathan: the crocodile and the dragon”'
    claim: 'Leviathan is a great sea creature, possibly a crocodile or a mythological creature of Canaanite texts'
    key: scripture-helps-job
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/31-job-1-3-12-14-19-21-24-38-40-42?lang=eng'
    quote: 'A leviathan is a large sea creature. The word is possibly used as a poetic depiction of a crocodile or a mythological creature described in ancient Canaanite texts.'
  - where: 'note 41:1 “Leviathan: the crocodile and the dragon”'
    claim: 'The Bible Dictionary names the crocodile as an example and Job 41:1 as an actual creature'
    key: bd-leviathan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leviathan?lang=eng'
    quote: 'Any great sea or land monster, such as the crocodile, either as an actual creature (Job 41:1) or as symbolic of a nation (Ps. 74:14); a large serpent (Isa. 27:1).'
  - where: 'note 41:1 “Leviathan: the crocodile and the dragon”'
    claim: 'Leviathan, the seven-headed sea dragon of Canaanite myth, is here likely a poetic description of a crocodile'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'Leviathan, the seven-headed sea dragon of Canaanite myth, is here likely a poetic description of a crocodile.'
  - where: 'note 41:1 “Leviathan: the crocodile and the dragon”'
    claim: 'Elsewhere God breaks the heads of leviathan and punishes leviathan with His sword (scripture)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/27?lang=eng'
    quote: 'In that day the Lord with his sore and great and strong sword shall punish leviathan the piercing serpent'
  - where: 'note 41:10 “Before me”'
    claim: 'The Hebrew of verses 10 and 11 has “me”; a modern translation reads “it”, noting that the Hebrew reads “me”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Job%2041&version=NRSVUE'
    quote: 'Who can stand before it?(C) 11 Who can confront it and be safe? —under the whole heaven, who?(D) … 41.10 Heb me … 41.11 Heb me … 41.11 Gk: Heb that I shall repay'
  - where: 'note 41:10 “Before me”'
    claim: '“Prevent” in older English meant to go before'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/prevent'
    quote: '1. To go before; to precede.'
  - where: 'note 41:18 “Fire from his mouth”'
    claim: 'The crocodile suns itself with open jaws turned to the sun'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/41.htm'
    quote: 'That the crocodile delights to sun itself on the land, and then turns its open jaws to the sunny side, most Nile travellers since Herodotus have had an opportunity of observing'
  - where: 'note 41:18 “Fire from his mouth”'
    claim: 'Sneezing in the sun throws up spray that catches the light; the observation is compressed into three words'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/41.htm'
    quote: 'since the sun shines upon the fine particles of watery slime cast forth in the act of sneezing, a meteoric appearance may be produced. This delicate observation of nature is here compressed into three words'
  - where: 'note 41:18 “Fire from his mouth”'
    claim: 'The crocodile’s eyes glimmer red through the water; two crocodile’s eyes were the hieroglyph for dawn'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/41.htm'
    quote: 'The eyes of the crocodile, which are near together, and slanting, glimmer through the water, when it is only a few feet under water, with a red glow.'
  - where: 'note 41:18 “Fire from his mouth”'
    claim: 'According to an ancient account, two crocodile’s eyes were the hieroglyph for dawn'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/41.htm'
    quote: 'according to Horus, i. 68, two crocodile''s eyes are the hieroglyph … for dawn'
  - where: 'note 41:18 “Fire from his mouth”'
    claim: 'The steam from the nostrils gives the impression of fire, which the poet reproduces poetically'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/41.htm'
    quote: 'This thick, hot steam, according to the credible description which is presented here, produces the impression of a fire existing beneath, and bursting forth. The subjective truth of this impression is faithfully but poetically reproduced by the poet.'
  - where: 'note 41:34 “King over the children of pride”'
    claim: '“Children of pride” (41:34) and “lion’s whelps” (28:8) are the same Hebrew words, bĕnê šāḥaṣ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Job.xml'
    quote: '<w lemma="1121 a" morph="HNcmpc" id="184ir">בְנֵי</w><seg type="x-maqqef">־</seg><w lemma="7830" n="1" morph="HNcmsa" id="186mr">שָׁ֑חַץ</w> … <w lemma="1121 a" morph="HNcmpc" id="18gKu">בְּנֵי</w><seg type="x-maqqef">־</seg><w lemma="7830" n="0" morph="HNcmsa" id="18TzQ">שָֽׁחַץ</w>'
  - where: 'note 41:34 “King over the children of pride”'
    claim: 'Leviathan is king over every beast of prey that proudly roams (compare 28:8)'
    key: delitzsch-job
    url: 'https://biblehub.com/commentaries/kad/job/41.htm'
    quote: 'it (the leviathan) is king over all the sons of pride, i.e., every beast of prey that proudly roams about (vid., on Job 28:8).'
  - where: 'note 41:34 “King over the children of pride”'
    claim: 'The two beasts typify the proud and hard-hearted who cannot be led or made party to a covenant with God'
    key: stirling-job
    url: 'https://interpreterfoundation.org/journal/job-an-lds-reading-2'
    quote: 'As such, they typify the proud (see Job 41:34) [Page 166]and hard-hearted (see Job 41:24) who are unable to be led or made party to a covenant with God (see Job 40:24–41:4).'
  - where: christ
    claim: 'The LORD punishes leviathan with His sword (Isa. 27:1); whatever is under the whole heaven is the LORD’s (41:11) (scripture)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/27?lang=eng'
    quote: 'In that day the Lord with his sore and great and strong sword shall punish leviathan the piercing serpent'
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
