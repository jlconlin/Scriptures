summary: >-
  Job loses everything, tears his mantle and worships: “the LORD gave, and the LORD hath
  taken away; blessed be the name of the LORD” (1:20–21); later he sits among the ashes
  (2:8). He stays true through the long trial, and at the end the friends who accused him
  bring their burnt offering to him and he prays for them, and the LORD turns his captivity “when he prayed for his friends” and
  blesses “the latter end of Job more than his beginning” (42:8–12): twice the flocks, and
  seven sons and three daughters again. The image is that turn, from the ashes into the
  latter end: a small grey corner of ash with the torn mantle, and beyond it, filling the
  picture, the restored household at sunrise, flocks coming home to tents glowing with
  lamplight, the lamp Job remembered shining “when my children were about me” (29:3–5),
  and his altar, where the friends' offering rises with his prayer for them.
motifs:
  - "Most important: the restored household, filling most of the picture: four or five dark goat-hair tents with warm lamplight glowing softly from their open doorways, and large flocks of sheep, with a few oxen and camels, coming home to them across green hills in the early sunlight (Job 42:10–12; 29:3–5)."
  - "Supporting: in the lower left corner, in cool shadow, a small low heap of grey ash with a plain undyed wool mantle lying on it, torn down the middle, and a broken piece of clay pot, a potsherd, beside it. It takes up no more than a fifth of the picture (Job 1:20–21; 2:8)."
  - "Supporting: a little apart from the tents, a low, plain altar of a few rough unhewn field stones, waist high and roughly square, with one thin line of pale smoke rising straight up from it into the still air (Job 1:5; 42:8–10)."
composition: >-
  A wide landscape in the first light of morning, seen from a slight rise. The lower left
  corner is the ash heap in cool grey shadow, with the torn mantle and potsherd on it, small
  and quiet. From there the eye moves right and back into the light: the ground falls to a
  green slope where the flocks stream toward the tents, which stand in the middle ground
  centre-right, their doorways glowing. The low stone altar stands on open ground between
  the flocks and the tents, its thin smoke rising and catching the light. Behind,
  soft rolling hills under a clear morning sky, warm gold low on the horizon fading to pale
  blue above. The sun is just below or at the horizon, with no visible rays, flares or
  sparkles; there are no stars. Painted in a quiet, restrained style with soft edges and a
  limited, natural palette, not a bright storybook illustration. No people or figures, no
  faces, no fire other than the altar's thin smoke, no storm, whirlwind, gold, building,
  well or fence.
