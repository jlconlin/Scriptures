alt: In a shadowed corner a torn wool mantle and a broken piece of pottery lie on a small heap of ashes. Beyond it, in the morning light, flocks come home to tents glowing with lamplight, beside a low stone altar with a thin line of smoke.
key:
  - '**The torn mantle on the ashes** is Job''s answer to losing everything in one day. He “rent his mantle, and shaved his head, and fell down upon the ground, and worshipped,” and said, “the LORD gave, and the LORD hath taken away; blessed be the name of the LORD” ([[Job 1:20–21]]).'
  - '**The broken piece of pottery** is the potsherd Job took “to scrape himself withal; and he sat down among the ashes” ([[Job 2:8]]).'
  - '**The flocks coming home** are the restoration: “the LORD blessed the latter end of Job more than his beginning: for he had fourteen thousand sheep, and six thousand camels, and a thousand yoke of oxen” ([[Job 42:12]]), twice the flocks and herds he had lost ([[Job 42:10]]).'
  - '**The lamplit tents** are his household restored, with “seven sons and three daughters” ([[Job 42:13]]). In his grief Job had looked back, saying, “when his candle shined upon my head” and “when my children were about me” ([[Job 29:3]], [[Job 29:5]]).'
  - '**The altar with its rising smoke** is Job''s faithfulness from first to last. When he had everything he “offered burnt offerings” for his children: “Thus did Job continually” ([[Job 1:5]]). At the end the LORD sent the friends who had accused him to Job with their burnt offering, “and my servant Job shall pray for you” ([[Job 42:8]]); “the LORD turned the captivity of Job, when he prayed for his friends” ([[Job 42:10]]).'
status: approved
