chapter: 16
title: My Witness Is in Heaven
tagline: Job answers Eliphaz's second speech. He sends back the friends' comfort, describes God as an enemy who has torn him for no fault, and then, with no defender left on earth, declares that his witness is in heaven.
when: 'The second round: Job answers Eliphaz'

setting: |
  Chapter 16 begins Job's answer to Eliphaz in the second round of the dialogue, which runs from chapter 15 to chapter 21. Eliphaz had repeated the arguments of his first speech ([[Job 4]]–[[Job 5]]), and less kindly. He called Job's words “vain knowledge” ([[Job 15:2]]), said that Job's own mouth condemned him ([[Job 15:6]]), asked again how anyone born of a woman could be clean ([[Job 15:14]]), and ended with a long portrait of the wicked man who “travaileth with pain all his days” ([[Job 15:20]]). By now Eliphaz counts Job among the wicked. Why the friends' reasoning fails Job is set out once, at [[Job 4:7]].

  Job's reply fills chapters 16 and 17. He begins by dismissing the friends as miserable comforters, and the break with them is now complete. The chapter ends on one of the passages the Church's chapter heading singles out: Job's testimony that “my witness is in heaven, and my record is on high” (verse 19). It is a hope that looks ahead to the Redeemer of [[Job 19:25]].

thread: |
  Job's claim is that he has no defender left on earth, and so he appeals to heaven. He begins by sending the friends' comfort back to them: their words are wind, and if their places were exchanged he could mock as they do, but he would strengthen them instead (verses 1–5). Speaking does not ease him, and silence does not either (verse 6).

  Then he says what God has done to him. God has worn him out and made his whole company desolate; He has torn him like a beast, handed him over to the wicked, seized him by the neck, set him up as a target and run at him like a warrior (verses 7–14). Job sits in sackcloth with his strength in the dust, and none of it is for any wrong in his hands (verses 15–17).

  The speech turns at verse 18. Finding no advocate anywhere on earth, Job calls on the earth itself not to cover his blood, and then on heaven: his witness is there, and to God his eyes pour out tears, longing for someone to plead his case (verses 18–21). He expects to die soon (verse 22; what Job thinks of death is taken up at [[Job 7:9]]), but in chapter 17 he will no longer let go of his hope.

sections:
  - range: 1-5
    heading: Miserable comforters
    plain: |
      Then Job answered: I have heard plenty of this. You are comforters who only add to my trouble, all of you. Will your windy words ever end? What drives you to keep answering? I could talk the way you do, if you were in my place. I could pile up words against you and shake my head at you. But I would strengthen you with what I said, and the comfort of my lips would ease your pain.
  - range: 6-14
    heading: God has made me His target
    plain: |
      If I speak, my pain is not eased; and if I keep quiet, how much of it goes away? But now He has worn me out. You have made all my company desolate. You have shriveled me up, and that is a witness against me; my thinness rises up and testifies against me to my face. He tears me in His anger and hates me; He grinds His teeth at me; my enemy looks daggers at me. Men gape at me with open mouths; they strike me on the cheek in contempt; they gang up together against me. God has handed me over to the ungodly and thrown me into the hands of the wicked. I was at peace, and He broke me in two. He took me by the neck and shook me to pieces; He set me up as His target. His archers surround me; He splits my kidneys open and does not spare me; He pours my gall out on the ground. He breaks through me again and again; He runs at me like a warrior.
  - range: 15-17
    heading: Sackcloth and dust
    plain: |
      I have sewn sackcloth onto my skin and laid my strength in the dust. My face is red with weeping, and the shadow of death is on my eyelids. Yet there is no injustice in my hands, and my prayer is pure.
  - range: 18-22
    heading: My witness is in heaven
    plain: |
      O earth, do not cover my blood, and let my cry find no place to rest. Even now, look: my witness is in heaven, and the one who testifies for me is on high. My friends scorn me, but my eyes pour out tears to God, longing that someone would plead for a man with God, as a man pleads for his neighbor. For in a few years I will go the way from which I will not come back.

notes:
  - ref: 2
    phrase: miserable comforters are ye all
    kind: scripture
    title: Comforters who add to the trouble
    body: |
      Job's charge is that the friends' comfort has become one more affliction. They came to comfort him ([[Job 2:11]]), and their hasty judgments about why he was suffering only added to his misery. Their speeches were meant as comfort, but they were accusations, and they wounded instead of soothing; one older reading renders the line “Troublesome comforters are ye all!”, comforters who bring trouble rather than relief.

      Verse 3 throws Eliphaz's own charge back at him. Eliphaz had asked whether a wise man should “fill his belly with the east wind” and answer with “vain knowledge” ([[Job 15:2]]); now Job asks whether the friends' “vain words,” their windy words, will ever end.

      Verse 4 has a gesture a modern reader can misread. Shaking the head was not sympathy but mockery at another's fall: it is what the enemies of the psalmist do ([[Ps. 22:7]]), and what the passers-by did at the cross, “wagging their heads” ([[Matt. 27:39]]). Job says that if their places were exchanged he could heap up words and mock as they do. He would rather strengthen them with his mouth and ease their grief (verse 5), which is what a comforter is for.
    sources: [seminary-ot-teacher-107, ot-minute-job-4, delitzsch-job]
  - ref: 9
    phrase: He teareth me in his wrath, who hateth me
    kind: symbol
    title: God pictured as an enemy
    body: |
      In verses 7–14 Job says that God has become his enemy, and he heaps picture on picture to show it. God tears him in His wrath and gnashes His teeth at him (verse 9); men gape at him and strike him (verse 10); God hands him over to the wicked (verse 11), seizes him by the neck, shakes him to pieces and sets him up as a target (verse 12); archers surround him and wound him to the vitals (verse 13); a warrior runs at him, breaking him breach upon breach (verse 14). The one who does all this is God, whom Job names in verse 11. And Job insists that none of it is for any wrong of his own (verse 17).

      This is Job's account of his suffering, not the book's. The reader knows from the prologue what Job does not: he is not being punished, for God Himself has called him righteous ([[Job 1:8]]). Job's picture comes from the same belief the friends hold, that suffering must be deserved. Eliphaz concludes from it that Job is to blame; Job, knowing he is innocent, concludes that God is attacking him for no reason.
    sources: [ot-minute-job-4]
  - ref: 10
    phrase: they have smitten me upon the cheek reproachfully
    kind: christ
    title: Words that fit the Savior
    body: |
      A blow on the cheek is an insult, meant to shame (the note on [[Ps. 3:7]] explains it), and in verses 10–11 Job's attackers are men: they gape at him, strike him, gather against him, and God has “turned me over into the hands of the wicked” (verse 11). Job is speaking of himself. One Latter-day Saint author hears in these lines words “very applicable to the Savior,” and in verse 11 “a fitting summary of what happened when the Savior was crucified.” That is a devotional reading, a likeness the reader of the Gospels can see, not a prophecy Job makes.
    sources: [farley-job-parallels]
  - ref: 15
    phrase: defiled my horn in the dust
    kind: symbol
    title: The horn in the dust
    body: |
      The horn is Job's strength and dignity, and he has laid it in the dust. In the Hebrew Bible a horn lifted up, like a proud animal's, means might and honor: Hannah sings “mine horn is exalted in the LORD” ([[1 Sam. 2:1]]). To cut off someone's horn is to humble him, and Job's line belongs with those images of humiliation. The footnote's alternative, “cast my strength,” gives the sense, and a modern translation reads “have laid my strength in the dust.”

      Verse 17 then says why the picture is so bitter: Job has been brought this low, and there is no injustice in his hands.
    sources: [bdb, nrsvue, lds-scriptures]
  - ref: 18
    phrase: O earth, cover not thou my blood
    kind: scripture
    title: Blood the earth must not cover
    body: |
      Job speaks as an innocent man about to be killed, and he asks the earth to leave his blood uncovered so that it keeps crying out for justice. In the Hebrew Bible blood that lies uncovered cries for vengeance. The first murdered man's blood cried to God from the ground: “the voice of thy brother's blood crieth unto me from the ground” ([[Gen. 4:10]]). The day of the Lord's judgment is a day when “the earth also shall disclose her blood, and shall no more cover her slain” ([[Isa. 26:21]]; compare [[Ezek. 24:7]]). So “let my cry have no place” means: let it find no resting place until it is heard.

      Job has no advocate left on earth, and so he calls the earth itself as a witness. One older reading sees a bold hope here: in the very God who seems to be hunting him down, Job still hopes to find the one who will acknowledge his blood, like Abel's, as innocent.
    sources: [delitzsch-job, stirling-job]
  - ref: 19
    phrase: my witness is in heaven, and my record is on high
    kind: christ
    title: A witness in heaven
    body: |
      Verse 19 is Job's testimony that someone in heaven knows the truth of his case and will speak for him; the Church's chapter heading reads it so: “he testifies that his witness is in heaven and his record is on high.” The two lines say the same thing twice. “Record” here means a witness, one who bears record: the Hebrew word is an Aramaic loanword meaning “witness,” set beside the ordinary Hebrew word for witness in the first line. A modern translation renders the second line “my advocate is on high.”

      Who the witness is, Job does not say. One Latter-day Saint reading allows that Job may simply trust that God knows what is really going on, or that a member of the divine council will take note; either way, Job believes or hopes that someone in heaven will notice him. Verse 21 says what he longs for: that one might plead for a man with God as a man pleads for his neighbor, the kind of go-between he had said he lacked when he complained that there was no daysman between him and God ([[Job 9:33]]).

      Another Latter-day Saint reading calls this Job's “second great revelatory insight.” With no defender on earth, Job in a moment of inspiration reaches out to an advocate in heaven, and the insight changes him: where he had longed to die, in the next chapter he holds on to his hope ([[Job 17:11–16]]). In the next chapter he asks God Himself to provide the pledge on his behalf ([[Job 17:3]]), and by [[Job 19:25]] he will say that his Redeemer lives.
    sources: [lds-scriptures, bdb, nrsvue, ot-minute-job-4, stirling-job]
  - ref: 20
    phrase: My friends scorn me
    kind: words
    title: Scorners, or an intercessor?
    body: |
      Translations differ on this line because the Hebrew word (*mĕlîṣay*) can be read two ways. It comes from a verb that means to scorn or deride, and the standard lexicon puts this verse under that sense, as the King James does and as a modern translation does: “My friends scorn me.” But the same verb's participle elsewhere means an interpreter: Joseph spoke to his brothers “by an interpreter” ([[Gen. 42:23]]), and Elihu speaks of “a messenger with him, an interpreter” who stands between God and man ([[Job 33:23]]).

      Read the second way, the verse continues the witness of verse 19. Another modern translation has “My intercessor is my friend as my eyes pour out tears to God,” and makes verse 21 the intercessor's work: “on behalf of a man he pleads with God.” A Latter-day Saint reading of the book quotes verses 19–21 in that translation. On either reading the contrast stands: those who should have spoken for Job on earth have failed him, and his tears go to God.
    sources: [bdb, nrsvue, niv, stirling-job]

christ: |
  Job, scorned by his friends, declared that his witness was in heaven and longed for someone to plead for a man with God. He did not know the witness's name; one Latter-day Saint reading suggests that the one in heaven who takes notice of him is Jesus Christ or Heavenly Father. Scripture gives the name: “we have an advocate with the Father, Jesus Christ the righteous” ([[1 John 2:1]]), who calls Himself “your advocate, who knoweth the weakness of man and how to succor them who are tempted” ([[D&C 62:1]]). A disciple's case does not rest with those who misjudge him on earth: he has an advocate with the Father who knows the weakness of man and how to succor him.

explore: |
  - **Someone to stand between Job and God.** Follow the hope from the daysman Job lacked ([[Job 9:33]]) through the witness of [[Job 16:19–21]] and the surety of [[Job 17:3]] to the Redeemer of [[Job 19:25–27]].
  - **Christ the advocate.** [[1 John 2:1]]; [[D&C 45:3–5]]; [[D&C 62:1–3]].

sources: [seminary-ot-teacher-107, ot-minute-job-4, delitzsch-job, farley-job-parallels, bdb, nrsvue, niv, stirling-job, lds-scriptures]
