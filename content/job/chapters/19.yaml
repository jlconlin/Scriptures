  - **Job's hope through the dialogue.** From the daysman he lacked ([[Job 9:33]]) through the question of [[Job 14:14]], the witness of [[Job 16:19–21]] and the surety of [[Job 17:3]], to this chapter.
  - **Seeing God in the flesh.** [[2 Ne. 9:4]]; [[Alma 11:42–45]]; [[1 Jn. 3:2]].
  - **Zophar's answer.** [[Job 20]].

