chapter: 19
title: I Know That My Redeemer Liveth
tagline: Job answers Bildad. Cut off from family, household and friends, and sure that God has put him in the wrong, he wishes his words were cut into rock, and then testifies of a Redeemer who lives and whom he will see.
when: 'The second round: Job answers Bildad'

setting: |
  Chapter 19 is Job's answer to Bildad's second speech ([[Job 18]]), a portrait of the wicked man's end drawn so that a reader easily takes it to be about Job. Job does not argue with the portrait. He complains of the friends themselves, whose words break him in pieces and whose reproaches have come “ten times,” a round number for again and again, in one older reading, not a count. What the friends assume about suffering, and the LORD's verdict on it, are set out at [[Job 4:7]].

  Most of the chapter is lament: what God has done to Job (verses 6–12), and how everyone around him has turned away since (verses 13–22). Then, in verses 23–27, comes the testimony the Church's chapter heading puts first: a Redeemer who lives, and a resurrection in which Job will see God in his flesh. The Bible Dictionary counts these verses among the high points of the book, equaled only by the LORD's own speeches in chapters 38–41. Job ends with a warning to the friends, and Zophar answers in [[Job 20]].

thread: |
  Job's claim is that he has been wronged, by God first and by the friends after Him. If they insist on using his disgrace as proof against him, then let them know that it is God who has put him in the wrong and thrown His net around him (verses 2–6). He cries “Violence!” and no court hears him. God has walled up his road, stripped off his crown, pulled up his hope like a tree, and laid siege to his tent as an army besieges a city (verses 7–12).

  The siege has emptied Job's life of people. Brothers, acquaintances, guests, maids, his own servant, his wife, even the boys of the neighborhood turn from him, and the friends he loved have turned against him (verses 13–19). Wasted to the bone, he begs the three for pity, since God's hand has struck him: why must they hound him as God does (verses 20–22)?

  The speech turns at verse 23. No one living will take his part, so Job wishes his words could be written in a book, or cut into rock to outlast him. Then the wish rises past any inscription to a person: “I know that my redeemer liveth.” An inscription would be a dead witness; Job's witness will be someone alive, who will stand at the last, and whom Job, after his body is destroyed, will see with his own eyes (verses 23–27). He ends by turning the friends' charge around: if they keep looking for the root of his trouble in him, they should fear the sword themselves, “that ye may know there is a judgment” (verses 28–29).

sections:
  - range: 1-6
    heading: Ten times you have reproached me
    plain: |
      Then Job answered: How long will you torment me and break me in pieces with words? Ten times now you have reproached me, and you are not ashamed to treat me as a stranger. Even if it is true that I have gone wrong, my error remains with me. If you really mean to set yourselves above me and use my disgrace as an argument against me, then know this: it is God who has put me in the wrong and thrown His net around me.
  - range: 7-12
    heading: He has walled up my way
    plain: |
      I cry out, “Violence!” but I am not answered; I call for help, but there is no justice. He has walled up my road so that I cannot pass, and set darkness on my paths. He has stripped my honor from me and taken the crown from my head. He tears me down on every side, and I am gone; He has pulled up my hope like a tree. He has kindled His anger against me and counts me as one of His enemies. His troops advance together, throw up siegeworks against me, and camp around my tent.
  - range: 13-22
    heading: A stranger in my own house
    plain: |
      He has put my brothers far from me, and those who knew me have become strangers to me. My relatives have failed me, and my close friends have forgotten me. The guests in my house and my maids count me a stranger; I am a foreigner in their eyes. I call my servant, and he does not answer, though I plead with him with my own mouth. My breath is repulsive to my wife; I am loathsome to my own family. Even young boys despise me; when I get up, they talk against me. All my intimate friends abhor me, and those I loved have turned against me. My bones cling to my skin and my flesh, and I have escaped with only the skin of my teeth. Have pity on me, have pity on me, my friends, for the hand of God has struck me! Why do you hound me as God does, and never have enough of my suffering?
  - range: 23-27
    heading: I know that my Redeemer lives
    plain: |
      Oh, that my words were written down! Oh, that they were inscribed in a book, cut into the rock forever with an iron pen and lead! For I know that my Redeemer lives, and that at the last He will stand upon the earth. And after my skin has been destroyed, yet in my flesh I shall see God. I shall see Him for myself; my own eyes will behold Him, and not another's. My heart faints with longing within me.
  - range: 28-29
    heading: There is a judgment
    plain: |
      If you say, “How we will hound him!” and “The root of the trouble is found in him,” then be afraid of the sword yourselves, for wrath brings the punishments of the sword, so that you may know there is a judgment.

notes:
  - ref: 6
    phrase: God hath overthrown me
    kind: scripture
    title: God has put me in the wrong
    body: |
      Job answers Bildad with Bildad's own word. The King James “overthrown” translates the Hebrew verb *ʿiwwēt*, to make crooked, and so to falsify or pervert, as a cheat makes his scales crooked ([[Amos 8:5]]). In his first speech Bildad had asked, using this verb twice, “Doth God pervert judgment? or doth the Almighty pervert justice?” ([[Job 8:3]]), as though the question answered itself. Job now says that God has done exactly that to him. A modern translation reads “know then that God has put me in the wrong,” and the standard lexicon puts the verse among those where the verb means to deprive a person of justice.

      Verse 7 says what being in the wrong feels like: Job cries out “Violence!” and is not answered, and there is no justice (the footnote gives “justice” for the King James “judgment”). It is Job's charge, made from inside his suffering, not the book's teaching; how the LORD answers charges of this kind is taken up at [[Job 9:22]].
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]
  - ref: 13
    phrase: He hath put my brethren far from me
    kind: history
    title: A stranger in his own house
    body: |
      Verses 13–19 count what God's siege has cost Job among people, and Job lays this loss, too, at God's door: “He hath put my brethren far from me.” The list runs from his brothers, kin and acquaintances, through the people who live under his roof as dependents and his maids, who look on him as a foreigner from another country, to his own servant, who will not answer even when Job begs. The neighborhood boys jeer when he struggles to his feet, and his intimate friends abhor him.

      Verse 17 puzzles readers, because Job's children are dead ([[Job 1:19]]). The same older reading takes “the children's sake of mine own body” to mean the children of the womb that bore him, his brothers and sisters; a modern translation reads, “My breath is repulsive to my wife; I am loathsome to my own family.” Either way, even those nearest him recoil.

      One Latter-day Saint reading sees Job now counting the friends and his whole community, wife and family included, among God's troops besieging him (verse 12), so that he becomes a scapegoat in a war of all against one. A Latter-day Saint writer comparing Job with the Savior sets verses 14–15 beside Jesus, who also “became a stranger in his own house,” not claimed as kin by His people and rejected at Nazareth.
    sources: [ot-minute-job-4, delitzsch-job, nrsvue, stirling-job, farley-job-parallels]
  - ref: 23
    phrase: oh that they were printed in a book!
    kind: history
    title: Printed in a book, graven in the rock
    body: |
      Job wants a record of his case that will outlast him, because no one living believes him. Where the King James says “printed in a book,” the wish is for his words to be written on a scroll, or better, carved into rock like a monumental inscription. In one older reading the iron pen is an engraver's stylus, and lead was poured into the cut letters to make them more lasting still, since a book can easily perish. A scroll or an inscription would keep Job's story until, one day, someone took up his case for him.

      The same older reading makes the wish the step from which verse 25 rises. An inscription, however lasting, is only a dead witness, and Job cannot count on men to read it rightly even in the future. So his longing moves from a lifeless thing to a living person, from men below to God above, and that is the force of the next words: “For I know that my redeemer liveth.”
    sources: [ot-minute-job-4, delitzsch-job]
  - ref: 25
    phrase: I know that my redeemer liveth
    kind: christ
    title: My Redeemer liveth
    body: |
      Verse 25 is Job's testimony that he has a Redeemer who lives, and the Church reads it as a testimony of Jesus Christ: the footnote to “redeemer” points to the Topical Guide's “Jesus Christ, Redeemer.” A redeemer (*gōʾēl*) was the near kinsman who freed a relative from slavery or bought back family land (the role is explained at [[Lev. 25:25]] and [[Ruth 2:20]]), and the LORD took the same title as Israel's kinsman ([[Exod. 6:6]]).

      Job does not say who his redeemer is. He knows only that someone will come and set right what has gone wrong between him and God. The hope has been growing: in chapter 16 it was a witness in heaven ([[Job 16:19]], where it is explained), and by now it is a kinsman who will act. One Latter-day Saint reading counts this among Job's revelatory insights, more emphatic than the two before it ([[Job 14:13–17]]; [[Job 16:19–21]]), and finds in it, less clearly, the further idea that the Redeemer Job will see is God Himself.
    sources: [lds-scriptures, bdb, ot-minute-job-4, stirling-job]
  - ref: 25
    phrase: he shall stand at the latter day upon the earth
    kind: words
    title: At the last, upon the dust
    body: |
      The King James “at the latter day” translates one Hebrew word, *ʾaḥărôn*, “last,” and the line is less specific than the English; a modern translation has “in the end he will stand upon the earth.” The Church's footnotes read the line of Jesus Christ, tying “he” to His Second Coming and “stand” to His Resurrection.

      The Hebrew word can also mean one who comes after, and the standard lexicon reads Job's line that way: coming after Job, and so able to establish his innocence when Job is dead, his Redeemer will rise. Where the King James says “upon the earth,” the Hebrew says “upon the dust” (*ʿal-ʿāpār*), which the lexicon takes here as the surface of the ground. Either way the line looks past Job's death to someone who will still stand there to take his part.
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]
  - ref: 26
    phrase: yet in my flesh shall I see God
    kind: words
    title: In my flesh, or from my flesh?
    body: |
      The King James reads verse 26 as Job's faith in a bodily resurrection, and so does the Church's chapter heading: “in his flesh he will see God.” The Hebrew is harder than the English. It says *mibbĕśārî*, “from my flesh,” which is why translations come out opposite, some “in my flesh” and some “without my flesh shall I see God.” An English sentence has the same ambiguity: “from the house I saw him coming” leaves open whether the speaker was inside the house or just outside it. “Thus, one's theology determines how one translates this passage.” A modern translation keeps “in my flesh,” and one Latter-day Saint reading finds physical resurrection and seeing God plain in these lines.

      The Church's seminary lesson reads the first half, “after my skin worms destroy this body,” as the death and decay of Job's body, and draws from the verse that because of the Resurrection of Jesus Christ, we too will be resurrected. Latter-day Saints “do not depend upon this passage to establish their belief in a literal resurrection, but point to it as one more glorious affirmation of it.” The doctrine stands on scripture that says it without ambiguity, beginning with the verse the Bible Dictionary sets beside this one, where Jacob writes that “our flesh must waste away and die; nevertheless, in our bodies we shall see God” ([[2 Ne. 9:4]]; see also [[Alma 11:42–44]]).

      Verse 27 presses home that it will be Job himself who sees: “whom I shall see for myself, and mine eyes shall behold, and not another.” A modern translation renders “for myself” as “on my side”: the God Job will see is not against him but for him.
    sources: [lds-scriptures, oshb-wlc, ot-manual-job, nrsvue, stirling-job, seminary-ot-teacher-108, bd-job-book]
  - ref: 28
    phrase: the root of the matter is found in me
    kind: history
    title: There is a judgment
    body: |
      Job ends by turning the friends' charge back on them. Verse 28 gives what they are saying, and a modern translation sets the words out as theirs: “If you say, ‘How we will persecute him!’ and, ‘The root of the matter is found in him.’” Where the King James has “in me,” that rendering has “in him”: the friends keep looking for the root of Job's trouble in Job. If they go on, verse 29 warns, they should fear the sword themselves, for wrath brings its punishments, “that ye may know there is a judgment.”
    sources: [nrsvue]

christ: |
  Job wished his words cut into rock to keep his case until someone would take it up, and then testified of a Redeemer who lives and who would stand at the last. He did not say who that Redeemer was. The Church reads the verse as Job's testimony of the Savior, the great Redeemer who “through His Atonement, paid the price for the sins of mankind and made possible the resurrection of all people,” and one Latter-day Saint reading sees in Job's hope the mission of Jesus Christ, a close kinsman in the family of God who came to earth to reconcile what could not otherwise be reconciled.

  The same testimony holds where Job held it, when family and friends have fallen away and the body is failing. The Redeemer lives, He is kin to the one who has lost every other kinsman, and He will set right what no record and no friend could.

