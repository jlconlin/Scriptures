chapter: 23
title: Oh That I Knew Where I Might Find Him!
tagline: Job answers Eliphaz by turning away from him. He longs to stand before God's own seat and argue his case, cannot find God anywhere, and is sure all the same that God knows his way and that the test will prove him gold.
when: 'The third round: Job answers Eliphaz'

setting: |
  Chapter 23 begins Job's reply to Eliphaz's third and last speech ([[Job 22]]), early in the third round of the dialogue. Eliphaz had gone further than ever: he falsely charged Job with wrongs against others, sending widows away empty and taking pledges from his brother ([[Job 22:6–9]]), and he urged him, “Acquaint now thyself with him, and be at peace” ([[Job 22:21]]). Why the friends' reasoning fails Job is taken up once, at [[Job 4:7]].

  Job does not answer the charges. He seems tired of speaking to his friends at all, and says again what he really wants: an audience with God. Eliphaz had offered him a way back through repentance for sins he had not committed; Job wants to meet God face to face and be heard honestly. His speech runs on through chapter 24, and Bildad answers only in [[Job 25]].

  The courtroom Job first imagined in [[Job 9:32–35]] and [[Job 13:3]] returns here with more hope than before.

thread: |
  Job's claim is that a fair hearing would clear him, and the chapter moves from that hope to the fear that undercuts it. His complaint is still bitter (verse 2). If only he knew where to find God, he would come to His seat, set out his case, and hear what God would answer (verses 3–5). For once he is sure the meeting would go well: God would not crush him with His power but would listen, and an upright man could reason with Him and be acquitted for good (verses 6–7). In chapter 9 he had thought he could never answer God at all.

  But God is nowhere to be found, ahead or behind, on the left or on the right (verses 8–9). The speech turns on the “But” of verse 10: Job cannot see God, yet God sees him and knows the way he takes, and when He has tested him, Job will come out gold. His record is his evidence: he has kept God's way and treasured His words (verses 11–12). Then the confidence gives way. God is of one purpose, no one can turn Him, and He will carry out what He has appointed for Job; the thought of standing in His presence leaves Job faint with fear, and the chapter ends in darkness (verses 13–17).

sections:
  - range: 1-7
    heading: If only I could reach His seat
    plain: |
      Then Job answered: Even today my complaint is bitter; the blow I bear is heavier than my groaning. If only I knew where to find Him, so that I could come to His very seat! I would lay out my case before Him and fill my mouth with arguments. I would learn what He would answer me and understand what He would say. Would He fight me with all His great power? No; He would pay attention to me. There an upright man could reason with Him, and I would be cleared for good by my judge.
  - range: 8-12
    heading: He knows the way that I take
    plain: |
      But I go forward, and He is not there; I go back, and I cannot find Him. When He is at work on the left, I cannot see Him; He hides on the right, and I cannot catch sight of Him. Yet He knows the way I take. When He has tested me, I will come out like gold. My feet have kept to His steps; I have kept His way and not turned aside. I have not turned back from the commandment of His lips; I have treasured the words of His mouth more than my daily bread.
  - range: 13-17
    heading: Afraid of His presence
    plain: |
      But He is of one purpose, and who can turn Him back? Whatever He desires, He does. He will carry out what He has appointed for me, and He has many such plans. That is why I am terrified in His presence; when I think about it, I am afraid of Him. God has made my heart faint; the Almighty has filled me with dread, because I was not cut off before the darkness came, and He has not hidden the thick darkness from my face.

notes:
  - ref: 3
    phrase: that I might come even to his seat
    kind: history
    title: The hearing Job wants
    body: |
      Job's wish is a courtroom wish: to come before God's seat, set out his case, fill his mouth with arguments, and hear what God would say back (verses 3–5). What has changed since he last imagined such a hearing is his expectation of how it would go. In chapter 9 he despaired of it: God “is not a man, as I am, that I should answer him” ([[Job 9:32]]), and if he tried to justify himself his own mouth would condemn him ([[Job 9:20]]). Here he asks whether God would contend with him in the greatness of His power, and answers himself, No.

      In verse 6 the King James finishes Job's answer “but he would put strength in me,” though the Hebrew has no word for strength. It says only that God “would set” on him, a verb that means to put or place; a modern translation renders the line “he would give heed to me,” and the next, “There the upright could reason with him, and I should be acquitted forever by my judge.” Job is not asking to be made strong enough to survive God; he is sure that God, once found, would listen. In one Latter-day Saint reading this marks a real change in Job: he now sees that he can speak to God with reason and honesty, that God will not simply overpower him, and that he can expect to be acquitted.

      The hope is answered in the end, though not as Job pictures it here. When the LORD speaks out of the whirlwind, He tells Job to answer Him “like a man” ([[Job 38:3]]), which the same reading takes as the fulfillment of Job's hope in verse 7 against his despair in [[Job 9:32]].
    sources: [ot-minute-job-4, oshb-wlc, bdb, nrsvue, stirling-job]
  - ref: 10
    phrase: when he hath tried me
    kind: scripture
    title: The same lesson in Liberty Jail
    body: |
      The book of Job and the Lord's word to Joseph Smith in Liberty Jail teach the same thing about affliction: it does not necessarily mean a person has sinned, and the Lord may use it for experience and instruction as well as for punishment. In a letter to the Church written around 22 March 1839, the imprisoned Prophet recorded the revelation now in section 122: if he were cast into the pit or the deep, if the heavens gathered blackness and the jaws of hell gaped after him, “all these things shall give thee experience, and shall be for thy good” ([[D&C 122:7]]). The Joseph Smith Papers show that the last clause, “and shall be for thy good,” was Joseph Smith's own insertion in the rough draft.

      Joseph had been faithful and had grown in holiness, yet in the jail he prayed for relief and felt that happiness had been denied him; the Lord's answer to “His faithful and suffering prophet” was “the same instructive lesson the Lord gave Job,” a lesson Job received when the LORD let him see his situation with spiritual eyes and spoke to him out of the whirlwind ([[Job 38:3–7]]). In verse 10, long before that answer, Job already trusts that God knows his way and that the test will show him gold. (The Lord's other comparison of Joseph with Job, “Thou art not yet as Job,” at [[D&C 121:10]], is taken up at [[Job 4:7]].)
    sources: [gs-job, lds-scriptures, jsp-letter-1839-03-22, eyring-holiness-plan]
  - ref: 10
    phrase: I shall come forth as gold
    kind: symbol
    title: Tried as gold
    body: |
      Job's gold is an assayer's gold. The verb “tried” is the word for testing metal, used here “with the metaphor of gold,” as in the Lord's promise in Zechariah that He “will try them as gold is tried” ([[Zech. 13:9]]).

      Job expects the test to show what is already there. He looks for no contrived repentance of the kind Eliphaz urged on him ([[Job 22:21–30]]); he is sure that when God tests him the test will show pure metal, and verses 11–12 are his evidence. His foot has held to God's steps, he has kept His way and not turned aside, and he has “esteemed the words of his mouth more than my necessary food.” “Esteemed” is the verb for treasuring something up, used of the heart in “Thy word have I hid in mine heart” ([[Ps. 119:11]]). “Necessary food” is a word for a person's allotted portion of food: Job has valued God's words above his daily bread. The Greek reads “I have hid his words in my bosom,” and a modern translation follows it.

      The same line also speaks of what trials make of a person: because he trusted God, “Job would be refined by the experiences he had,” and the verse is taught as showing that Job knew God was aware of him and that his trials would refine him. A Latter-day Saint reading of the whole book takes verse 10 as Job's insight that his trials have a transforming purpose, one that will bring him forth as something of great value to God.
    sources: [bdb, lxx-rahlfs, ot-minute-job-4, nrsvue, renlund-trust-god, ot-seminary-2026-job-1-13, stirling-job]
  - ref: 15
    phrase: Therefore am I troubled at his presence
    kind: words
    title: Why Job is afraid
    body: |
      Job's fear in verses 13–17 grows from the same conviction that gave him hope: God's purpose does not change. The King James' “he is in one mind” renders a Hebrew phrase that reads literally “he is in one”; a modern translation has “he stands alone,” and one older reading takes it of the unchanging sameness of God's purpose concerning Job. The word translated “appointed” in verse 14 is used here of a man's destiny. So Job, who has just said that God would listen to him, is “terrified at his presence.” In one Latter-day Saint reading, he trusts God's purposes and still dreads the further suffering they may hold.

      In “God maketh my heart soft” (verse 16), the verb in this form means to make the heart weak or faint, as with fear, and it runs parallel to “the Almighty troubleth me”; a modern translation has “God has made my heart faint.”

      Verse 17 is the hardest line in the chapter, and translations part ways. The King James has Job say he was not cut off before the darkness came; a modern translation makes it a wish, “If only I could vanish in darkness,” and offers in its margin a reading close to the King James: “But I am not destroyed by the darkness; he has concealed the thick darkness from me.” One older reading takes the line to mean that what undoes Job is not the darkness of his affliction but God's face as Job seems to see it, turned against him. Either way, the speech that began by longing to reach God's seat ends in darkness and dread.
    sources: [delitzsch-job, oshb-wlc, nrsvue, bdb, stirling-job]

christ: |
  Job does not name Christ here; he longs for a judge who would hear him and trusts that God's test will show him gold. In the same Liberty Jail revelation that promised Joseph Smith his trials would be for his good, the Lord pointed him to Himself: “The Son of Man hath descended below them all. Art thou greater than he?” ([[D&C 122:8]]). Lehi's promise that God “shall consecrate thine afflictions for thy gain” ([[2 Ne. 2:2]]) has been set beside Job's gold. A disciple who cannot find God ahead or behind is still known on the way he takes, by a Savior who descended below all things and who makes affliction into experience for the disciple's good.

