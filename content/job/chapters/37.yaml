chapter: 37
title: With God Is Terrible Majesty
tagline: Elihu's speech ends in a storm. Thunder, snow, rain, ice and cloud all move at God's command; Elihu turns to Job with questions he cannot answer, and closes by saying that the Almighty cannot be found out.
when: "Elihu's fourth speech"

setting: |
  Chapter 37 is the end of Elihu's fourth and last speech, begun in chapter 36 (who Elihu is, and why he is angry, is explained at [[Job 32:2]]). The Church's chapter heading sums it up: the Lord controls the laws of nature, and God reigns in terrible majesty. Elihu's argument has been made already. His main thesis, that God will not pervert judgment, is said once more in the closing lines of his last speech (verse 23). What fills the rest is the praise of God in the storm, which began at [[Job 36:26]] and runs here through thunder, lightning, snow, rain, wind, ice and cloud.

  Job makes no reply to Elihu, and no one else responds to him. The next voice in the book is the LORD's, who answers Job “out of the whirlwind” ([[Job 38:1]]) with questions about the same snow, rain, cloud and lightning. In one older reading the two storms are the same storm: Elihu describes one that is rising as he speaks, and the LORD's whirlwind is that storm, come up in the meanwhile. How Elihu's praise of the storm anticipates the LORD's speech, and why it still falls short of it, is taken up in the notes at verses 2 and 14.

thread: |
  Elihu's claim is that God's works in the sky are beyond human understanding, and that a man who cannot explain the weather should not argue with the One who sends it. He begins with the thunder: his heart pounds at it, and he bids his hearers listen to God's voice rolling under the whole heaven, with the lightning running to the ends of the earth (verses 1–5).

  Then the season of winter. God commands the snow and the heavy rains; work stops, the beasts go into their dens, the storm wind and the cold arrive, and the waters freeze at the breath of God. The clouds, loaded with water, turn wherever His counsel directs them, to chasten, to water His land, or to show mercy (verses 6–13).

  At verse 14 Elihu turns to Job by name: stand still and consider. He asks whether Job knows how God orders the clouds and makes their lightning shine, how they hang balanced, or whether Job helped spread out the sky (verses 15–18). And if Job cannot answer, neither can anyone: the darkness keeps a man from drawing up his case before God, and to speak against Him would be to be swallowed up (verses 19–20).

  The close turns from storm to brightness. People do not see the bright light in the clouds, but the wind passes and clears them; out of the north comes gold, or golden splendor (the line is doubtful; see the note on verse 22), and God is clothed in terrible majesty. One older reading draws the lesson: the sun behind the cloud has lost none of its light, and so a man waits for God to clear what is dark to him. The Almighty cannot be found out, Elihu concludes; He is great in power and justice and will not bend His justice, so men fear Him, and He takes no account of those who think themselves wise (verses 21–24).

sections:
  - range: 1-5
    heading: The noise of his voice
    plain: |
      At this my heart trembles and leaps out of its place. Listen, listen to the thunder of His voice and the rumbling that comes from His mouth. He lets it loose under the whole heaven and sends His lightning to the ends of the earth. After it His voice roars; He thunders with His majestic voice, and He does not hold the lightnings back when His voice is heard. God thunders wonderfully with His voice; He does great things that we cannot comprehend.
  - range: 6-13
    heading: By the breath of God
    plain: |
      For He says to the snow, “Fall on the earth,” and likewise to the rain showers, His heavy rains. He seals up every man's hand, so that all the people He has made may know His work. Then the animals go into their lairs and stay in their dens. Out of the south comes the storm wind, and cold out of the north. By the breath of God ice is given, and the broad waters are frozen fast. He loads the thick cloud with water and scatters His cloud of lightning. The clouds turn round and round at His direction, to do whatever He commands them over the face of the inhabited earth. Whether for a rod of correction, or for His land, or for mercy, He makes it come.
  - range: 14-20
    heading: Stand still, and consider
    plain: |
      Listen to this, Job: stand still and consider the wondrous works of God. Do you know how God lays His command on them and makes the light of His cloud shine? Do you know how the clouds hang balanced, the wonders of Him who is perfect in knowledge? You, whose garments grow hot when He stills the earth with the south wind, can you spread out the sky with Him, strong as a mirror of cast metal? Teach us what we should say to Him, for we cannot set our case in order because of the darkness. Should He be told that I want to speak? If a man speaks, surely he will be swallowed up.
  - range: 21-24
    heading: With God is terrible majesty
    plain: |
      And now people do not see the bright light that is in the clouds; but the wind passes and clears them. Golden splendor comes out of the north; around God is terrible majesty. The Almighty, we cannot find Him out: He is great in power and in justice, and abundant in righteousness, which He will never violate. Therefore people fear Him; He takes no account of any who are wise in their own eyes.

notes:
  - ref: 2
    phrase: Hear attentively the noise of his voice
    kind: symbol
    title: Thunder, the voice of God
    body: |
      The “voice” Elihu bids his hearers listen to is the thunder, and in one older reading they could hear it as he spoke. That reading takes the “this” of verse 1, “At this also my heart trembleth,” as something present to the senses, not a storm imagined, and so finds a real storm coming over the sky while Elihu describes one. It is the same storm, on that reading, out of which the LORD answers Job in the next chapter: Job had asked that the Almighty answer him ([[Job 31:35]]), and now He does, “out of the whirlwind” ([[Job 38:1]]).

      Verses 2–5 name God's “voice” five times: the thunder rolling under the whole heaven, following the lightning (verse 4). The repetition recalls the psalm in which “the voice of the LORD” sounds seven times and “the God of glory thundereth” ([[Ps. 29:3]], where the site explains the image). For Elihu, as for the psalmist, the thunder is a sign of God's power, and its point is in verse 5: God does “great things... which we cannot comprehend,” acts whose causes and means are past human understanding. That is the claim the whole chapter makes.
    sources: [delitzsch-job]
  - ref: 7
    phrase: He sealeth up the hand of every man
    kind: symbol
    title: Winter seals the hand
    body: |
      The sealed hand is the hand that winter keeps from work. The Hebrew of the line is uncertain, and a modern translation, noting so, reads it differently (“serves as a sign on everyone’s hand”). In one older reading the verse belongs to the rainy season of verses 6–10, the months of early and late rains with snow between, when the cold keeps farmer and herdsman indoors and a man cannot open his hand to his work. God “seals” it shut, and the purpose follows in the same line: “that all men may know his work.” When their own work stops, people see His.

      The beasts do the same (verse 8): they go into their dens and stay there, as the beasts of [[Ps. 104:22]] lie down in their dens when the sun rises, in the same reading. Man and animal alike are brought to a standstill by the snow and rain.
    sources: [delitzsch-job, nrsvue]
  - ref: 13
    phrase: whether for correction, or for his land, or for mercy
    kind: words
    title: A rod, the land, or mercy
    body: |
      Elihu gives the storm three possible purposes, and only one of them is punishment. The word the King James renders “correction” is *šēbeṭ*, a rod for striking, used figuratively of God's chastisement of a nation or of a single man, as here. The second purpose is the good of His land, which the rain waters. The third, “mercy,” is *ḥesed*, which a modern translation gives as “for love.” The same clouds that can chasten a man can water a field or come as a kindness.

      That fits Elihu's own teaching, that God may use suffering as a kindness, to instruct and not only to punish (see the note at [[Job 36:15]]). The weather does not announce which purpose it serves, and Elihu goes straight on, in verses 14–20, to ask Job whether he understands the clouds at all.
    sources: [oshb-wlc, bdb, nrsvue, ot-minute-job-36]
  - ref: 14
    phrase: stand still, and consider the wondrous works of God
    kind: history
    title: Elihu's questions
    body: |
      Verse 14 is where Elihu turns from the storm to Job, with questions of the kind the LORD will ask from the whirlwind. He calls Job by name, as he has done before, and tries to draw him into answering, as God will do (“answer thou me,” [[Job 38:3]]; [[Job 40:7]]). Then come his questions. Does Job know how God orders the clouds and makes their light shine (verse 15)? Does he know how they hang balanced (verse 16)? Did he help spread out the sky (verse 18)? These are the kind of questions the LORD will ask ([[Job 38:34–37]]).

      Job does not answer, and one Latter-day Saint reading says plainly why the likeness matters so little. Elihu's speeches as a whole echo the speeches from the whirlwind, yet they “had no impact on Job,” because Job's crisis was in his relationship with God and reason alone could not solve it: “Elihu's answer remains ‘mere argument;’ the Lord's is a revelation.” The same questions asked about God by a man and asked of Job by God are not the same thing.
    sources: [stirling-job, tanner-considered-job]
  - ref: 18
    phrase: as a molten looking glass
    kind: symbol
    title: A sky like a cast mirror
    body: |
      Elihu's “looking glass” is a mirror of molten metal, and his sky is as strong as one. A modern translation has “hard as a molten mirror.” In one older reading the comparison is to a metallic mirror and turns on firmness: the sky stretched over the earth holds as fast as cast metal. Scripture has other pictures of the same sky, a sapphire pavement under God's feet ([[Exod. 24:10]]) or a curtain stretched out ([[Ps. 104:2]]; [[Isa. 40:22]]); Elihu's dwells on its strength, because his question is about strength. Could Job, who feels the heat through his clothes when the south wind stills the land (verse 17), have helped God spread out and fix something like that?
    sources: [delitzsch-job, nrsvue]
  - ref: 22
    phrase: Fair weather cometh out of the north
    kind: words
    title: Gold out of the north
    body: |
      Where the King James has “fair weather,” the Hebrew says *zāhāb*, “gold”: out of the north comes gold. The line is doubtful: some would correct the word, and those who keep it read it three ways: gold itself; the golden light of the sun when the north wind has scattered the clouds; or the golden splendor of God Himself coming from the north. A modern translation takes the last two together: “Out of the north comes golden splendor; around God is awesome majesty.”

      One older reading keeps the gold as metal and hears in the verse the poem of [[Job 28]] in brief. There men dig out the hidden treasures of the earth, yet God's wisdom is beyond them; here gold is wrested from the dark north, but God is clothed in “terrible majesty” that covers Him like a garment and keeps Him out of reach. On that reading, whatever treasure a man may bring out of the dark, God's glory stays beyond his reach, and the line's second half leads into Elihu's last two verses.
    sources: [oshb-wlc, bdb, nrsvue, delitzsch-job]
  - ref: 23
    phrase: he will not afflict
    kind: history
    title: Elihu's last word
    body: |
      Elihu ends with his main thesis, God's justice. The King James “he will not afflict” renders a verb whose sense here is to humble or weaken, with the justice named earlier in the verse as its object: God, great in power and justice, will not weaken His justice. A modern translation reads, “abundant righteousness he will not violate.” That is Elihu's main thesis, that God will not pervert judgment ([[Job 34:12]]), said for the last time. His closing line (verse 24) then turns the lesson outward: men fear such a God, and He takes no account of those who are, in a modern translation's words, “wise in their own conceit.”

      The verse begins on a different note: “Touching the Almighty, we cannot find him out.” Elihu's speeches end there, but the book does not: it answers him in the next chapter. Job makes no reply to Elihu, and his craving for light is satisfied by the vision of God, granted in answer to his own appeals: the LORD Himself speaks ([[Job 38:1]]), and Job will say, “now mine eye seeth thee” ([[Job 42:5]]).
    sources: [oshb-wlc, bdb, nrsvue, bd-job-book]

christ: |
  Elihu's last word about God is that “we cannot find him out” (verse 23), and the book's next word is God's own, as He answers Job out of the whirlwind. Job's answer came, not by a better argument, but by revelation. The Savior told His disciples where God is seen: “he that hath seen me hath seen the Father” ([[John 14:9]]). For a disciple the great things God does stay past comprehending, as Elihu says (verse 5), but God Himself is not out of reach: the Lord's promise is “seek me diligently and ye shall find me” ([[D&C 88:63]]).

explore: |
  - **The voice of the LORD in the storm.** [[Ps. 29]], and the rain and the beasts' dens in [[Ps. 104:10–22]].
  - **The LORD asks the same questions.** The snow, rain, cloud and lightning of [[Job 38:22–38]], set beside Elihu's in verses 6–18.
  - **Elihu's storm from its beginning.** [[Job 36:26–33]].

sources: [stirling-job, ot-minute-job-36, bd-job-book, delitzsch-job, nrsvue, oshb-wlc, bdb, tanner-considered-job, lds-scriptures]
