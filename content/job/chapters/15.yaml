chapter: 15
title: What Is Man, That He Should Be Clean?
tagline: Eliphaz opens the second round. He calls Job's words wind, says his own mouth condemns him, asks whether he sat in God's council, and paints the end of the wicked man in colors Job is meant to recognize.
when: 'The second round: Eliphaz'

setting: |
  Chapter 15 opens the second round of the dialogue (chapters 15–21), and Eliphaz the Temanite speaks first again, as he did in the first round ([[Job 4]]) and will in the third ([[Job 22]]). He is answering Job's long speech of chapters 12–14, in which Job told the friends, “I have understanding as well as you” ([[Job 12:3]]), called them “forgers of lies” and “physicians of no value” ([[Job 13:4]]), and turned from them to plead his case with God.

  The friends' doctrine has not changed; why it fails Job is set out once, at [[Job 4:7]]. What changes is the tone. In chapter 4 Eliphaz began by asking leave to speak ([[Job 4:2]]); here he begins by calling Job's words wind. In one older reading, the friends now think Job has handed them the proof they lacked: a man who speaks to God as Job has spoken is, in their eyes, “his own accuser and judge.” And since Job has refused the comfort they offered, they offer only the dark side of their teaching, the end of the wicked. In one Latter-day Saint reading, this second round joins those portraits of the wicked “for the first time with direct assertions of sin against Job.”

  The speech has two halves: a charge against Job (verses 1–16) and a portrait of the wicked man (verses 17–35), drawn from what Eliphaz has seen and what the wise received from their fathers.

thread: |
  Eliphaz's claim is that Job's own words have convicted him. He moves from Job's mouth, to Job's pretensions, to the doctrine Job is resisting, and ends with a picture of the wicked in which Job is meant to find himself.

  He opens with the charge: Job's talk is wind, and worse than useless, for it wears away the fear of God and devotion itself; Job's guilt is teaching his mouth what to say, and his own lips testify against him (verses 1–6). Then the taunt: was Job born first, before the hills? Did he sit in God's council? The friends have the gray-headed on their side, men older than Job's father. Why does he spurn the consolations of God and turn his spirit against Him (verses 7–13)?

  At verse 14 Eliphaz brings back the doctrine of his night vision: no man can be clean before a God who does not trust even His holy ones, much less a man who drinks iniquity like water (verses 14–16).

  The rest is a lesson from tradition (verses 17–19) and what it teaches. The wicked man lives in dread; in his prosperity the destroyer comes (verses 20–24), because he charged at God behind the bosses of his shields (verses 25–27). So his houses fall to ruin, his wealth does not last, he withers like a vine that drops its grapes, and fire consumes the tents of bribery (verses 28–35). Eliphaz never names Job in this half, but the portrait is drawn for him to see himself in (see the note at verse 25).

sections:
  - range: 1-6
    heading: Your own mouth condemns you
    plain: |
      Then Eliphaz the Temanite answered: “Should a wise man answer with knowledge that is nothing but wind, and fill himself with the east wind? Should he argue with useless talk, with speeches that do no good? Worse, you are doing away with the fear of God and holding back devotion before Him. Your guilt is teaching your mouth, and you have chosen the tongue of the crafty. Your own mouth condemns you, not I; your own lips testify against you.
  - range: 7-13
    heading: Are you wiser than we?
    plain: |
      “Were you the first man ever born? Were you brought forth before the hills? Have you listened in God's council, and kept wisdom to yourself? What do you know that we don't know? What do you understand that we don't? The gray-haired and the very old are on our side, men older than your father. Are the consolations of God too small for you, and the word spoken gently to you? Why does your heart carry you away, and what are your eyes flashing at, that you turn your spirit against God and let such words out of your mouth?
  - range: 14-16
    heading: Can man be clean?
    plain: |
      “What is a mortal, that he could be clean? What is one born of a woman, that he could be righteous? God puts no trust even in His holy ones; even the heavens are not clean in His sight. How much less a man who is loathsome and corrupt, who drinks wickedness like water!
  - range: 17-24
    heading: What the wise have told
    plain: |
      “Listen, and I will show you; I will tell you what I have seen, what wise men have passed on from their fathers and not hidden, the fathers to whom alone the land was given, when no stranger passed among them. The wicked man writhes in pain all his days, and the number of the oppressor's years is hidden. Sounds of terror fill his ears; in the middle of his prosperity the destroyer comes on him. He has no hope of coming back out of the darkness; the sword is waiting for him. He wanders about for bread, asking, ‘Where is it?’ He knows the day of darkness is close at hand. Distress and anguish terrify him; they overpower him like a king ready for battle.
  - range: 25-35
    heading: He charged against God
    plain: |
      “For he stretched out his hand against God and played the hero against the Almighty. He ran at Him with his neck thrust out, behind the thick bosses of his shields, his face covered with fat and his waist thick with it. So he will live in ruined cities, in houses no one should live in, ready to become heaps. He will not stay rich; his wealth will not last, nor will what he has endure on the earth. He will not escape the darkness; flame will dry up his shoots, and a breath will carry him off. Let him not trust in emptiness and deceive himself, for emptiness will be his reward. It will be paid in full before his time, and his branch will not be green. He will be like a vine that drops its unripe grapes, like an olive tree that sheds its blossoms. For the company of the godless is barren, and fire consumes the tents of those who take bribes. They conceive trouble and give birth to emptiness; their inmost heart prepares deceit.”

notes:
  - ref: 2
    phrase: fill his belly with the east wind
    kind: symbol
    title: A belly full of east wind
    body: |
      Eliphaz's opening insult calls Job's speeches wind, and a destructive wind at that. The “belly” is not the stomach but the inner self: a modern translation renders the line “Should the wise answer with windy knowledge and fill themselves with the east wind?”

      The east wind was more than hot air. In one Latter-day Saint reading it is “a figure of destruction in the prophets,” as when Hosea says that Ephraim “followeth after the east wind” ([[Hos. 12:1]]). Job gives the insult back in his first line of reply: “Shall vain words have an end?” ([[Job 16:3]]), where the Hebrew has *dibrê rûaḥ*, words of wind.
    sources: [nrsvue, stirling-job, oshb-wlc]
  - ref: 4
    phrase: restrainest prayer before God
    kind: words
    title: Undermining devotion
    body: |
      Eliphaz's charge is that Job's talk does more than hurt his friends: it wears away religion itself. “Prayer” translates *śîḥâ*, meditation, the word in “O how love I thy law! it is my meditation all the day” ([[Ps. 119:97]]), and “restrainest” is a verb for diminishing or holding back. A modern translation gives the verse as “you are doing away with the fear of God and hindering meditation before God.” In one older reading the logic runs this way: by doubting God's justice, Job's speeches take away religion's “fundamental assumption, and diminish the reverence due to God.” If a righteous man may say that God treats him unjustly, why should anyone fear God or pray?

      From there Eliphaz takes Job's words as their own evidence. Job's guilt is teaching his mouth (verse 5, in the same translation), and “thine own mouth condemneth thee, and not I” (verse 6). Eliphaz thinks Job has lost his relationship with God. The same older reading weighs the charges: that Job's words toward God were rash is fair; but to call his protest of innocence the “tongue of the crafty,” a trick to escape blame, is as unjust a charge as could be made.
    sources: [bdb, nrsvue, delitzsch-job, ot-minute-job-4]
  - ref: 8
    phrase: Hast thou heard the secret of God?
    kind: history
    title: Did you sit in God's council?
    body: |
      “The secret of God” is God's council: *sôd* means the intimate circle of those who sit together and the counsel taken there (the word is explained at [[Amos 3:7]]). The same word stands where Jeremiah's prophet has “stood in the counsel of the LORD” ([[Jer. 23:18]]); in a modern translation the line reads, “Have you listened in the council of God?”

      Eliphaz is taunting Job with what he cannot claim. Was Job the first man ever born? In one older reading the first man, made straight from God's hand, was thought to have had the deepest insight into the world created with him. Was Job brought forth before the hills, like the angels made, in the same reading, before the visible world? And had he sat in God's council? Then he might know what the friends and their gray-haired elders do not (verses 9–10). One Latter-day Saint reading sums it up: Eliphaz “tauntingly reminds Job that he has not participated in divine councils.”

      The book has already shown that council. In one Latter-day Saint study, the sons of God meeting in council in the prologue ([[Job 1:6]]; [[Job 2:1]]) are God's *sôd*, and here Eliphaz “insists that Job has not sat in the *sôd* and therefore cannot understand God's will regarding Job.” The reader knows what Eliphaz does not: in that council the LORD Himself had called Job “perfect and upright” ([[Job 1:8]]), so Job is not suffering for iniquity. The question of where Job was when the earth was made comes back in the LORD's own mouth ([[Job 38:4]]), and the Church's reading of it is given at [[Job 38:7]].
    sources: [bdb, nrsvue, delitzsch-job, stirling-job, hamblin-sod, ot-minute-job-4]
  - ref: 11
    phrase: Are the consolations of God small with thee?
    kind: scripture
    title: The consolations of God
    body: |
      By “the consolations of God” Eliphaz means the friends' own speeches. In one older reading he has in mind the promises they made in God's name to cheer Job, and by the “word that deals gently with you” (as a modern translation renders the second line) he means the gentle tone they have kept. The same reading grants that their intention was good.

      The word for “consolations” comes from *nāḥam*, “comfort,” the verb of the friends' errand: they came “to mourn with him and to comfort him” ([[Job 2:11]]). Job answers this speech with the same verb: “miserable comforters are ye all” ([[Job 16:2]]). In one Latter-day Saint reading that answer marks a breach between Job and his friends that is now “irrevocable.” Later Job tells them what real consolation from them would be: “Hear diligently my speech, and let this be your consolations” ([[Job 21:2]]), the same noun again.
    sources: [delitzsch-job, nrsvue, bdb, oshb-wlc, stirling-job]
  - ref: 14
    phrase: What is man, that he should be clean?
    kind: scripture
    title: Can man be clean?
    body: |
      Eliphaz brings back the message of the voice he heard in the night ([[Job 4:17–19]]; the vision is discussed at [[Job 4:12]]): God puts no trust in His “saints,” the heavenly beings of [[Job 5:1]], and the heavens themselves are not clean in His sight, so no one born of a woman can claim to be righteous. Human weakness, for Eliphaz, rules out any claim of innocence.

      Job had himself asked, “Who can bring a clean thing out of an unclean? not one” ([[Job 14:4]]). Verse 16 goes further than the night vision. In chapter 4 the voice spoke of mortals as frail, dwellers in houses of clay “crushed before the moth” ([[Job 4:19]]); now Eliphaz calls man “abominable and filthy,” one “which drinketh iniquity like water.” If God cannot trust His angels, how could He trust such a humanity?
    sources: [ot-minute-job-4, stirling-job, nrsvue]
  - ref: 18
    phrase: Which wise men have told from their fathers
    kind: history
    title: The wisdom of the fathers
    body: |
      Eliphaz's authority for what follows is tradition: what he has seen himself, and what wise men received from their fathers and did not hide (verses 17–18), as earlier he had the gray-headed on his side (verse 10). Verse 19 says why that tradition should be trusted: those fathers were the ones “unto whom alone the earth was given,” the land in a modern translation, “and no stranger passed among them.” In one older reading, they lived in the land of their birth and did not mingle with strangers, so their teaching could be counted “pure and unalloyed.”

      In one Latter-day Saint reading, this is what the friends stand for throughout: “conventional religion and the wisdom of tradition, relying on their own experience… and the words of the elders,” as Job himself once had. What their counsel lacks, revelation about Job's own case, is taken up at [[Job 4:12]]. The tradition's content is the portrait of the wicked man that fills the rest of the chapter.
    sources: [delitzsch-job, stirling-job, nrsvue]
  - ref: 25
    phrase: For he stretcheth out his hand against God, and strengtheneth himself against the Almighty.
    kind: symbol
    title: Charging at God
    body: |
      At the center of Eliphaz's portrait is the reason the wicked man is ruined: he took up arms against God. In one older reading, two sins bring on his end, his arrogant opposition to God (verses 25–27) and his contentment on the ruins of others' prosperity (verse 28). The picture is of a warrior. He “strengtheneth himself,” or plays the hero, against the Almighty, and runs at God with his neck thrust out, behind the thick bosses of his shields (verse 26; “with a thickly bossed shield,” in a modern translation). The fat that covers his face and loins (verse 27) is, in the same reading, his complacent security, like the proud of [[Ps. 73:4–7]].

      The same reading calls the whole portrait a mirror in which Job is to see “what he has already endured and what yet awaits him.” The destroyer comes on the wicked man in his prosperity (verse 21), and his possessions, children and household go down with him (verses 28–34). A Latter-day Saint reading draws the same conclusion: Eliphaz “now clearly sees Job as one of the wicked.”
    sources: [delitzsch-job, nrsvue, stirling-job]

christ: |
  Eliphaz asked, “What is man, that he should be clean?” (verse 14), and meant that no one born of a woman can be. The Church's footnote to the word “clean” points to the answer scripture gives: the Lord's promise to Moroni, “thou hast been faithful; wherefore, thy garments shall be made clean” ([[Ether 12:37]]). Alma names how: a man's garments “must be purified until they are cleansed from all stain, through the blood of him of whom it has been spoken by our fathers, who should come to redeem his people from their sins” ([[Alma 5:21]]). Eliphaz used man's uncleanness as a charge against a suffering friend; scripture uses it to point to the Redeemer who makes the unclean clean. No disciple is clean by his own record, and the faithful are promised cleansing through Christ, as Moroni was, whatever they suffer meanwhile.

explore: |
  - **Eliphaz's last speech.** [[Job 22]], where he lists the sins he believes Job committed ([[Job 22:5–9]]).
  - **Garments made clean.** [[Alma 5:21–27]]; [[Rev. 7:14]].

sources: [ot-minute-job-4, delitzsch-job, stirling-job, nrsvue, oshb-wlc, bdb, hamblin-sod, lds-scriptures]
