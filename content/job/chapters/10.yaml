chapter: 10
title: Shew Me Wherefore Thou Contendest with Me
tagline: Job stops arguing with Bildad and speaks to God. You made me with your own hands, he says, and kept me alive with care; why now hunt me down, and why will you not tell me the charge?
when: 'The first round: Job answers Bildad'

setting: |
  Chapter 10 is the second half of Job's answer to Bildad, the second friend to speak. Bildad had insisted that God does not pervert judgment and had suggested that Job's children died for their own sin ([[Job 8:3–4]]), the friends' reasoning that is weighed once for the whole book at [[Job 4:7]]. Job's reply fills chapters 9 and 10. In chapter 9 he speaks about God: no one can win a case against a being so strong, and there is no daysman to stand between them ([[Job 9:33]]). In chapter 10 he stops talking about God and talks to Him. The answer to Bildad becomes a prayer.

  Job is still sure of his innocence. What has given way, as [[Job 9:22]] shows, is the belief he had shared with his friends that a just God rewards the righteous with good and the wicked with calamity. So he puts to God the questions a defendant puts to a judge who will not name the charge. Zophar answers him in chapter 11.

thread: |
  Job's claim is that God made him with care and is now destroying him, and he wants to know why. He begins by saying he will speak freely, since he has nothing left to lose, and he asks God not to condemn him without telling him the charge (verses 1–2). Then come three questions that answer themselves: does God despise what His own hands made, does He see with a man's eyes, are His days as short as a man's, that He must search for sin in a man He knows is not wicked (verses 3–7)?

  From there Job turns to his own making. God's hands shaped him in the womb like clay, knit him together, gave him life and steadfast love, and guarded his spirit (verses 8–12). The speech turns at verse 13: Job concludes that all that care hid a purpose of the opposite kind. Sinful or righteous, he cannot lift his head; God hunts him like a lion and sends fresh witnesses and fresh troops against him (verses 14–17). He ends where chapter 3 began, wishing he had never been born, and asks only to be left alone for the few days before he goes to the land of darkness (verses 18–22).

sections:
  - range: 1-7
    heading: Tell me the charge
    plain: |
      I am weary of my life. I will let my complaint run its course; I will speak out of the bitterness of my soul. I will say to God: Do not condemn me; show me why you are bringing a case against me. Does it seem good to you to oppress me, to despise the work of your own hands, and to smile on the plans of the wicked? Do you have eyes of flesh? Do you see the way a man sees? Are your days like a mortal's days, your years like a man's years, that you go looking for my iniquity and searching for my sin, when you know that I am not wicked, and no one can rescue me from your hand?
  - range: 8-13
    heading: Your hands made me
    plain: |
      Your hands shaped me and made me, every part of me, and now you would destroy me. Remember, I beg you, that you formed me like clay; will you turn me back into dust? Did you not pour me out like milk and curdle me like cheese? You clothed me with skin and flesh and protected me with bones and sinews. You gave me life and steadfast love, and your care kept my spirit safe. Yet you hid these things in your heart; I know that this was your purpose.
  - range: 14-17
    heading: Hunted, whatever I do
    plain: |
      If I sin, you watch me and will not acquit me of my iniquity. If I am wicked, woe to me; and if I am righteous, I still cannot lift up my head, full of shame as I am. Look at my affliction, for it keeps growing. You hunt me like a fierce lion, and you show your wondrous power against me again and again. You keep bringing new witnesses against me and increasing your anger toward me; you bring fresh troops against me.
  - range: 18-22
    heading: Leave me alone a little
    plain: |
      Why then did you bring me out of the womb? I wish I had died before any eye saw me. I would have been as though I had never been, carried from the womb to the grave. Are not my days few? Stop, and let me alone, so that I may have a little comfort before I go where I will not come back from, to the land of darkness and the shadow of death: a land as dark as darkness itself, the shadow of death, without any order, where even the light is like darkness.

notes:
  - ref: 2
    phrase: shew me wherefore thou contendest with me
    kind: history
    title: Job asks God to name the charge
    body: |
      Job asks God to tell him the charge. His two requests are a defendant's. “Condemn” translates the verb for declaring someone guilty, and “contendest” the verb for conducting a legal case against someone, so Job pictures himself as the defendant in a suit God has brought and will not explain. In chapter 9 he had protested that no one can say to God, “What doest thou?” ([[Job 9:12]]); now he asks exactly that, driven by the need to understand why God is contending with him.

      Verse 1 says how he will speak. “I will leave my complaint upon myself” is obscure in English; a modern translation renders it “I will give free utterance to my complaint.” Weary of his life, Job will at least let his complaint run its course. What he wants above all is not more argument with his friends but a hearing with God Himself, and answers that would let him understand. He does not know why his afflictions have come (verses 2 and 15). That longing for a hearing is the one behind the daysman of [[Job 9:33]].
    sources: [bdb, oshb-wlc, stirling-job, nrsvue, ot-minute-job-4, seminary-ot-teacher-107]
  - ref: 4
    phrase: Hast thou eyes of flesh?
    kind: scripture
    title: God does not see as a man sees
    body: |
      Job's questions in verses 4–6 expect the answer no: God does not see as a man sees, and His years are not a man's, so He has no need to search Job as a man would. On one older reading, “eyes of flesh” are eyes that judge by the outward appearance, and the question recalls what the Lord told Samuel: “man looketh on the outward appearance, but the Lord looketh on the heart” ([[1 Sam. 16:7]]). The question about God's days, on the same reading, pictures Job's suffering as an interrogation of the kind a mortal ruler short of time might use: pain applied to wring out a confession quickly, so that judgment can follow.

      That is why verse 7 follows: “Thou knowest that I am not wicked.” A God who sees the heart already knows what a search would find, and that makes the searching, as Job feels it, all the harder to understand.
    sources: [delitzsch-job]
  - ref: 8
    phrase: Thine hands have made me and fashioned me together round about
    kind: symbol
    title: Formed by God's own hands
    body: |
      Job's strongest plea is that he is God's handiwork. Verses 8–12 describe, as [[Ps. 139:13–16]] does, how God forms a child in the womb: His hands shape Job like clay, pour him out like milk and curdle him like cheese (verse 10), then clothe him with skin and flesh and protect him with bones and sinews (verse 11). On one older reading, the making of man from the dust of the ground ([[Gen. 2:7]]) is repeated in each birth, and the milk curdling into cheese pictures the embryo taking shape. On that reading the poem is not teaching biology; it traces the forming of a child back to God as its cause.

      Why Job dwells on it is in verse 3: would God “despise the work of thine hands”? The question expects a no, since the love to which a man owes his existence does not hold its own work in contempt. That is why Job's present lot makes no sense to him: brought into being with such care and kept alive with such kindness, he seems to himself to have been made only to come to this terrible end (verses 8–9).

      The theme page [He That Liveth, and Was Dead](/job/themes/he-that-liveth/) follows these hands to 14:15, where the complaint becomes the ground of Job's wish that God will call him from the grave.
    sources: [delitzsch-job]
  - ref: 12
    phrase: thy visitation hath preserved my spirit
    kind: words
    title: The care that kept him now watches him
    body: |
      The God who watched over Job's life now seems to Job to be watching him only to catch him. In verse 12 Job remembers that God gave him “life and favour”; “favour” is *ḥesed*, the word explained at [[Job 6:14]], which a modern translation renders here “steadfast love.” “Visitation” here is not a visit in judgment but oversight or charge: “your care has preserved my spirit.” The verb “preserved” is *šāmar*, to keep, guard or watch. Two verses later the same verb returns with the opposite sense: “If I sin, then thou markest me” (verse 14), where the verb means to “watch (suspiciously).” The eye that guarded Job's life has become, as he sees it, an eye looking for faults.

      Verse 13 draws the conclusion. For “These things hast thou hid in thine heart: I know that this is with thee,” a modern translation reads “I know that this was your purpose.” Job decides that behind all that kindness God had another purpose, kept hidden until now, and verses 14–15 say what it looks like to him. If he sins, he will be marked; if he is wicked, woe to him; and if he is righteous, he still cannot lift up his head, “full of confusion,” or in the modern translation, “filled with disgrace.” This is what Job concludes in his pain, not something the text affirms of God.
    sources: [oshb-wlc, bdb, nrsvue]
  - ref: 17
    phrase: Thou renewest thy witnesses against me
    kind: symbol
    title: Witnesses and fresh troops
    body: |
      Job describes God's case against him in the language of the courtroom and the battlefield at once. God hunts him like a lion (verse 16), and in verse 17 keeps bringing new witnesses against him and new forces: for “changes and war” a modern translation reads “you bring fresh troops against me.”

      Job does not say who the witnesses are. One Latter-day Saint reading sees the friends among them: witnesses against Job, the voices of a larger crowd that Job believes God has raised against him. On that reading Job has given up the friends' account of reward and punishment, but he has not yet outgrown the understanding he began with, which he shares with them and the people around him: what comes upon him comes from God. So their accusations sound to him like God's own.
    sources: [nrsvue, stirling-job]
  - ref: 21
    phrase: the land of darkness and the shadow of death
    kind: symbol
    title: A land without order
    body: |
      Job ends by picturing death as a land so dark that even its light is darkness. He has come back to the wish of chapter 3, that he had never been born (verses 18–19; [[Job 3:11]], with the curse on his birth explained at [[Job 3:3]]). Then he asks God to let up on him for the few days he has left, so that he may have a little comfort before he goes where he “shall not return.” What Job believes about the grave is set out at [[Job 7:9]].

      He heaps up words for the dark. “The shadow of death” is the word explained at [[Ps. 23:4]], and a modern translation renders the line “the land of gloom and deep darkness.” The last of his words takes the picture past darkness. “Without any order” is in Hebrew *lōʾ sĕdārîm*, “no” with the plural of a noun for arrangement or order that occurs nowhere else in the Old Testament, and the phrase names the “disorder, confusion” of the dark underworld; the same modern translation calls it “the land of gloom and chaos.” The land Job expects has neither light nor any arrangement, so that even what passes for light there is dark.
    sources: [nrsvue, ot-minute-job-4, oshb-wlc, bdb]

christ: |
  Job pleads with the hands that made him, and the Church's footnote to “Thine hands have made me” (verse 8) points to the Topical Guide's “Jesus Christ, Creator.” The footnote to “bitterness” in verse 1 sends the reader to Enoch, who in “bitterness of soul” refused to be comforted until the Lord told him to look, and he saw “the day of the coming of the Son of Man, even in the flesh,” whose blood would be shed “that all they that mourn may be sanctified and have eternal life” ([[Moses 7:44–47]]). Not knowing the reason for a trial does not close the way to God: like Job, a disciple can take the complaint to Him directly, and keep trusting Him while the answer is still unknown.

explore: |
  - **Formed in the womb.** [[Ps. 139:13–16]], David's poem on how God forms a child in the womb, read beside [[Job 10:8–12]].
  - **Job's demand for a hearing.** [[Job 9:32–35]]; [[Job 13:3]], [[Job 13:18–24]]; [[Job 23:3–7]]; and the LORD's answer out of the whirlwind, [[Job 38:1–3]].

