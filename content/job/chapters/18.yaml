chapter: 18
title: The King of Terrors
tagline: Bildad, stung that Job thinks the friends stupid, answers with a long portrait of the wicked man’s end, and fills it with Job’s own losses.
when: 'The second round: Bildad'

setting: |
  Bildad the Shuhite (on the three friends and their homes, see [[Job 2:11]]) speaks for the second time, answering Job’s speech in chapters 16–17. Job had ended that speech expecting to die soon: “the grave is mine house: I have made my bed in the darkness” ([[Job 17:13]]). Bildad answers by speaking of the state of the wicked who do not know God, and the implication is that Job is one of them.

  This speech is harder than his first ([[Job 8]]). There he still promised that God would restore Job if he were pure; here he begins, as before, by complaining of Job’s endless words, but he never returns to a promise. His opening belongs with the other speeches in which the friends, who had first come with compassion, “shifted their approach from comfort to accusation.” What the friends assume about suffering, and the LORD’s verdict on it, are set out at [[Job 4:7]].

  When the Lord told Joseph Smith in Liberty Jail that his friends did not “charge thee with transgression, as they did Job” ([[D&C 121:10]]), Bildad’s speech here is one of those that charged Job. Bildad will speak once more, briefly, in [[Job 25]].

thread: |
  Bildad’s speech has two unequal parts: a short rebuke of Job (verses 2–4) and a long portrait of the wicked man’s end (verses 5–21).

  The rebuke is personal. Bildad is tired of Job’s words and offended that Job counts the friends as stupid as cattle; Job had said he could not find one wise man among them ([[Job 17:10]]). He even speaks to Job in the plural, which one older reading takes as sarcasm answering sarcasm: Job has ranged himself with all the upright, so Bildad addresses him as a crowd. Then he turns Job’s own words back on him. Job had said of God, “He teareth me in his wrath” ([[Job 16:9]]); Bildad answers that it is Job who “teareth himself in his anger” (verse 4), and that the order of the world will not be moved for his sake.

  From verse 5 Bildad never says “you” again. The wicked man’s lamp goes out in his tent (verses 5–6). His strides shorten, and his own feet carry him into net, snare and trap (verses 7–10): he walks into destruction himself. Terrors chase him, hunger and disease eat him away, and he is torn from his tent and marched to “the king of terrors,” death (verses 11–14). Then everything he leaves goes too: his tent is strewn with brimstone, root and branch dry up, his name is forgotten, no child survives him, and all who hear of his end are appalled (verses 15–20). Verse 21 sums it up: this is the place of the man “that knoweth not God.”

  The turn is that the portrait, though it names no one, carries Job’s own losses. The reader easily takes the speech to be about Job, and Bildad means it to imply that he is the wicked man.

sections:
  - range: 1-4
    heading: Will the earth be forsaken for you?
    plain: |
      Then Bildad the Shuhite answered: “How long before you put an end to words? Consider, and then we will speak. Why are we counted as cattle, and stupid in your sight? You who tear yourself in your anger, is the earth to be abandoned for your sake, or a rock moved from its place?
  - range: 5-10
    heading: The lamp of the wicked goes out
    plain: |
      “Yes, the light of the wicked is put out, and the flame of his fire does not shine. The light grows dark in his tent, and his lamp goes out with him. His strong strides are cut short, and his own schemes throw him down. His own feet carry him into a net, and he walks onto a snare. A trap catches him by the heel, and the robber overpowers him. A noose is hidden for him in the ground, and a trap lies in his path.
  - range: 11-14
    heading: The king of terrors
    plain: |
      “Terrors frighten him on every side and dog his steps. His strength is starved, and disaster stands ready at his side. His skin is devoured; the firstborn of death devours his limbs. He is torn from the tent he trusted in and marched to the king of terrors.
  - range: 15-21
    heading: No name in the street
    plain: |
      “What is none of his dwells in his tent; brimstone is scattered over his home. His roots dry up below, and his branches are cut off above. His memory perishes from the earth, and no one speaks his name in the street. He is driven from light into darkness and chased out of the world. He has no offspring or descendant among his people, no survivor where he lived. Those who come after him are appalled at his fate, as those who went before were seized with horror. Surely such are the dwellings of the wicked, and such is the place of the one who does not know God.”

notes:
  - ref: 4
    phrase: shall the earth be forsaken for thee? and shall the rock be removed out of his place?
    kind: history
    title: The earth will not move for one man
    body: |
      Bildad’s question means that the order of the world will not be rearranged to suit Job: what Job wants is like moving the whole earth for one man. He asks it because Job has stung him. Instead of entering into Job’s pain and confusion, he takes offense that the friends are “counted as beasts” (verse 3), that is, that Job thinks them stupid cattle.

      In Bildad’s world the moral order is fixed, and it does one thing with the wicked: it expels them. The rest of his speech shows that order at work.
    sources: [ot-minute-job-4, stirling-job]
  - ref: 13
    phrase: the firstborn of death
    kind: words
    title: The firstborn of death
    body: |
      “The firstborn of death” is a deadly disease, pictured as death’s eldest child, and what it devours is the body: where the King James has “strength,” a modern translation has the limbs, “the firstborn of Death consumes their limbs.” One older reading explains the figure: diseases are pictured as the children of death, and the worst of them is called its firstborn because, as a firstborn carries the whole strength of his father, this disease carries the whole destroying power of death. The same reading takes it to be a disease like leprosy, which consumes the limbs and slowly destroys the body. In that reading the father himself appears in verse 14: death is “the king of terrors,” to whom his firstborn delivers the wicked man.

      The wicked man of Bildad’s speech is eaten by a disease of the skin, and so is Job, struck with “sore boils from the sole of his foot unto his crown” ([[Job 2:7]]).
    sources: [nrsvue, delitzsch-job, stirling-job]
  - ref: 17
    phrase: His remembrance shall perish from the earth
    kind: scripture
    title: No remembrance, no witness
    body: |
      Bildad’s claim that the wicked man leaves no memory can be read, in one Latter-day Saint reading, as his reply to Job’s last appeal. In his previous speech Job had cried, “O earth, cover not thou my blood, and let my cry have no place,” and then, “my witness is in heaven, and my record is on high” ([[Job 16:18–19]]; the witness is explained at [[Job 16:19]]). Job wanted the wrong done to him to stay uncovered until it was heard. Bildad replies that the wicked leave no trace in the world: no remembrance on the earth, “no name in the street.” That answers the hope Job placed in the earth, that it would not cover his cry. The same reading carries Bildad’s answer further, to Job’s witness on high as well: it holds that, in Bildad’s view, Job will have “no witness in heaven nor on earth.”
    sources: [stirling-job]
  - ref: 19
    phrase: He shall neither have son nor nephew among his people
    kind: history
    title: A portrait with Job’s face
    body: |
      Bildad never names Job, but the wicked man he describes has lost what Job lost, and he says, in effect, that Job’s posterity will cease. The man has no offspring or descendant, and no one left “in his dwellings”; Job’s sons and daughters died when a wind struck the house where they were feasting ([[Job 1:19]]).

      Other details point the same way, and one older reading finds Bildad weaving them in deliberately, hidden under a rich drapery of figures, to frighten Job. In that reading, the brimstone scattered on the man’s home (verse 15) recalls “the fire of God” that, in the messenger’s words, had “fallen from heaven” on Job’s sheep and servants ([[Job 1:16]]); brimstone is fire from heaven like the fire that fell on Sodom ([[Gen. 19:24]]), and the mark of a place under a curse. The root drying below while the branch is cut off above (verse 16) is, in the same reading, Job outliving his children. Bildad may have hoped that if Job saw his own end painted plainly enough, he would repent.
    sources: [ot-minute-job-4, delitzsch-job]
  - ref: 21
    phrase: this is the place of him that knoweth not God
    kind: scripture
    title: Him that knoweth not God
    body: |
      Bildad’s last line is his verdict: the man whose end he has drawn is one who does not know God, and the man he is implying is Job. The LORD later called the three friends to repentance for their false ideas about His justice ([[Job 42:7]]).

      A portrait much like Bildad’s returns in Liberty Jail, aimed the other way. After telling Joseph Smith “thou art not yet as Job” ([[D&C 121:10]]), the Lord pronounced on “they who do charge thee with transgression” ([[D&C 121:11]]) a fate strikingly like the one Bildad laid on the wicked man: “they and their posterity shall be swept from under heaven” ([[D&C 121:15]]); “their houses and their barns shall perish” ([[D&C 121:20]]); they shall have no right to the priesthood, “nor their posterity after them from generation to generation” ([[D&C 121:21]]). In the revelation the curse falls on those who “cry they have sinned when they have not sinned before me” ([[D&C 121:16]]): on the accuser, not on the man he accuses. The same passage does this with a line of Bildad’s first speech, turning it on Joseph Smith’s accusers ([[Job 8:14]]).
    sources: [lds-scriptures, seminary-ot-teacher-108, scripture-helps-job, stirling-job]

christ: |
  Bildad’s last word on Job was that he “knoweth not God.” Job’s next speech holds his testimony, “I know that my redeemer liveth” ([[Job 19:25]]), which the Church reads as a testimony that Jesus Christ lives, declared from the depth of losing children, health and riches.
  The state of a disciple’s home, health or family is not the measure of whether he knows God. Bildad measured Job by his losses and was wrong, and the knowledge that the Redeemer lives can be held in the deepest of them.

