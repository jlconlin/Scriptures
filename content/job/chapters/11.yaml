chapter: 11
title: Canst Thou by Searching Find Out God?
tagline: Zophar, the third friend, answers Job for the first time. Job talks too much and calls himself clean; God has punished him less than he deserves; no one can search out God; let Job put away his sin, and his trouble will pass like water.
when: "The first round: Zophar"

setting: |
  Chapter 11 is Zophar's first speech, and it closes the first round of the dialogue. Zophar the Naamathite (on the three friends, see [[Job 2:11]]) has listened to Eliphaz (chapters 4–5) and Bildad (chapter 8) and to two long answers from Job, the last of which (chapters 9–10) ended in a prayer protesting his innocence to God. He is the last of the three to speak.

  Like the others, Zophar assumes that Job is suffering for something he has done, and he hears Job's own words as proof of it. His opening (verses 1–6) is his share in the belief all three friends hold, that Job's afflictions came for some wrong he had done, and chapter 11 is one of the speeches that charged Job with transgression, the charge the Lord told Joseph Smith his own friends did not bring against him ([[D&C 121:10]]). Zophar goes further than the others: God, he says, has punished Job less than his guilt deserves (verse 6). Why the friends' assumption fails is taken up at [[Job 4:7]].

thread: |
  Zophar's speech moves in three steps, and turns twice.

  First a **rebuke** (verses 1–6). Job's flood of words cannot go unanswered. Zophar sums up Job's case as a claim to pure doctrine and a clean life, and wishes God would speak against him: then Job would see how far God's wisdom surpasses his own, and learn that God has let part of his guilt go unpunished.

  At verse 7 he turns to **God past finding out** (verses 7–12). God's wisdom is higher than heaven and deeper than Sheol; He sees through worthless men; and an empty-headed man will grow wise when a wild ass is born a man.

  At verse 13 he turns to **the way back** (verses 13–20). If Job will set his heart right, reach out his hands to God and put away the wrong in his hand, his misery will pass like water, his life will shine brighter than noon, and he will lie down with no one to make him afraid. The last verse names the other ending, the wicked whose every hope runs out with their last breath.

sections:
  - range: 1-6
    heading: Should not the multitude of words be answered?
    plain: |
      Then Zophar the Naamathite answered: Is all this talk to go unanswered? Is a man proved right because he says so much? Should your empty talk silence everyone, and when you mock, should no one put you to shame? For you say, “My teaching is pure, and I am clean in God's sight.” But oh, if only God would speak and open His lips against you, and show you the secrets of wisdom, how far they surpass what you can see! Know, then, that God is letting part of your guilt go unreckoned.
  - range: 7-12
    heading: Canst thou by searching find out God?
    plain: |
      Can you search out the depths of God? Can you reach the limit of the Almighty? It is higher than heaven: what can you do? It is deeper than Sheol, the world of the dead: what can you know? Its measure is longer than the earth and broader than the sea. If He cuts a man off and shuts him up, or gathers men together, who can hold Him back? He knows worthless men; when He sees wickedness, will He not take note of it? An empty-headed man will gain understanding when a wild ass's colt is born a man.
  - range: 13-20
    heading: If thou prepare thine heart
    plain: |
      But if you will set your heart right and stretch out your hands to Him; if there is wrong in your hand, put it far away, and let no wickedness live in your tents. Then you will lift up your face without shame; you will stand firm and not be afraid. You will forget your misery, or remember it only as water that has flowed past. Your life will be brighter than noonday; you will shine, you will be like the morning. You will be secure, because there is hope; you will dig around you and rest in safety. You will lie down with no one to make you afraid, and many will seek your favor. But the eyes of the wicked will fail; they will find no escape, and all their hope will come to nothing but a last breath.

notes:
  - ref: 4
    phrase: My doctrine is pure, and I am clean in thine eyes
    kind: history
    title: Words Job did not say
    body: |
      Zophar puts these words in Job's mouth, but they are his paraphrase of Job, not anything Job said. Job had told God, “Thou knowest that I am not wicked” ([[Job 10:7]]), and Zophar seems to be answering that prayer, boiling it down to a claim of pure doctrine and a clean life and finding the claim ridiculous.

      The word “doctrine” is a teacher's word. The Hebrew *leqaḥ* is teaching, the thing taught: the word of Moses' song, “My doctrine shall drop as the rain” ([[Deut. 32:2]]), and of the father in Proverbs, “I give you good doctrine” ([[Prov. 4:2]]). So Zophar hears in Job's long protest a man who counts what he has been teaching, and not only his life, beyond reproach.
    sources: [ot-minute-job-4, bdb]

  - ref: 6
    phrase: God exacteth of thee less than thine iniquity deserveth
    kind: history
    title: Less than his guilt deserves
    body: |
      Zophar tells Job that his suffering is not too much but too little. Eliphaz had argued that the innocent do not perish ([[Job 4:7]]), and Bildad that if Job's children sinned, God cast them away for their transgression ([[Job 8:4]]); Zophar goes a step further and says Job is getting off lightly.

      The Hebrew verb is not “exact” but “forget”: God “allows a part of thy guilt to be forgotten thee, i.e. does not reckon it to thee in full.” Zophar offers it as a sign of God's leniency, and it makes his charge heavier: whatever Job has suffered, the guilt behind it must be greater still.
    sources: [stirling-job, bdb]

  - ref: 7
    phrase: Canst thou by searching find out God?
    kind: history
    title: Past finding out
    body: |
      Zophar's question is true, and the trouble is that he does not live by it. He has just said (verse 6) that the secrets of God's wisdom are “double”: the Hebrew *kiplayim* means here “double in sound wisdom (beyond what Job imagines),” and a modern translation gives “wisdom is many-sided.” Now he measures that wisdom against the whole world: higher than heaven, deeper than “hell,” which is Sheol, the world of the dead (“Deeper than Sheol,” in the same translation; on Sheol in Job, see [[Job 7:9]]), longer than the earth and broader than the sea.

      Yet the man who says God cannot be searched out claims to know exactly what is going on between Job and God. Had Zophar taken his own proverb to heart, he might have been slower to judge Job. One Latter-day Saint reading sharpens the irony: Zophar taunts Job with being unable to find out the deep things of God when Job “is ironically already on a journey to do just that,” and Zophar's rigid picture of God leaves him unable to go with him.
    sources: [bdb, nrsvue, ot-minute-job-4, stirling-job]

  - ref: 12
    phrase: though man be born like a wild ass’s colt
    kind: words
    title: A wild ass born a man
    body: |
      Verse 12 is a proverb of the impossible, and the King James blurs it. A modern translation gives the sense: “But the stupid will get understanding when a wild ass is born human.” The “vain man” is literally a hollow one, an empty head; and the young wild ass, restless and untamable, is the last creature anyone expects to see become human. One older reading spells out the logic: the one will happen “not earlier than, and as little as, the other.” A wild ass would need a new birth to become a man, and so would the empty-headed man to become wise. Zophar means the insult for Job.
    sources: [nrsvue, delitzsch-job]

  - ref: 13
    phrase: If thou prepare thine heart, and stretch out thine hands toward him
    kind: history
    title: Zophar’s way back
    body: |
      Zophar ends, as Eliphaz did ([[Job 5:8]]), by offering Job a way back: set the heart right, reach out to God, put away the wrong in his hand and the wickedness in his tents, and he will live in safety without fear. The promises are generous (misery forgotten like water that has flowed past, a life brighter than noon, rest that no one disturbs, and many seeking his favor), and they all rest on one assumption, that Job's trouble is sin.

      That assumption is what makes the offer dangerous. In one Latter-day Saint reading, Zophar is urging Job “to admit guilt (breach his integrity by holding to a lie) in exchange for a (false?) promise of security.” The LORD had said of Job that “still he holdeth fast his integrity” ([[Job 2:3]]), and Job refuses the bargain. Later he swears, “till I die I will not remove mine integrity from me” ([[Job 27:5]]), and on the same reading he will not falsely confess sin to gain the restoration the friends hold out.
    sources: [ot-minute-job-4, stirling-job]

  - ref: 20
    phrase: their hope shall be as the giving up of the ghost
    kind: symbol
    title: Hope that ends in a last breath
    body: |
      Zophar's last line sets the wicked beside the penitent man of verse 18, who “shalt be secure, because there is hope.” The wicked also hope, but their hope is “as the giving up of the ghost,” the breathing out of life. In one older reading the point “is not that death is their only hope, but that every expectation remains unfulfilled”: all their disappointed hopes run out with their last breath. Their eyes “fail” in the same way, as eyes that languish with unsatisfied longing.
    sources: [delitzsch-job]

christ: |
  Zophar is right that no one finds out God by searching (verse 7); his mistake is to think he has found out God's dealings with Job by reasoning from suffering in general rather than by revelation. God is known as He makes Himself known, and He has made Himself known in His Son: “No man hath seen God at any time; the only begotten Son, which is in the bosom of the Father, he hath declared him” ([[John 1:18]]), and “this is life eternal, that they might know thee the only true God, and Jesus Christ, whom thou hast sent” ([[John 17:3]]).

  The meaning of a trial, a disciple's own or another's, is not read off its surface. The book of Job is “at bottom about the need for personal revelation,” and revelation, not a rule about who deserves to suffer, is what answers a crisis of faith.

explore: |
  - **Job's answer.** [[Job 12:1–4]] and [[Job 13:1–5]], where Job answers Zophar and all three friends together.
  - **Zophar's second speech.** [[Job 20]], his account of the short triumph of the wicked, and Job's reply in [[Job 21]].
  - **Liberty Jail.** [[D&C 121:7–10]], where the Lord tells Joseph Smith that his friends do not charge him with transgression as Job's friends charged Job.

