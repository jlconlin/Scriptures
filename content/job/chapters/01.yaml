chapter: 1
title: Doth Job Fear God for Nought?
tagline: A blameless man in the land of Uz offers sacrifices for his children. In the council of heaven the adversary asks whether Job serves God only for what he receives, and in one day Job loses his wealth and his children. He mourns, worships, and blesses the name of the LORD.
when: 'The prologue: Job in the land of Uz'

setting: |
  Job 1 opens a book unlike any other in the Old Testament. Most of it is poetry: a long argument between Job and three friends, then the speeches of a younger man, Elihu (chapters 32–37), and at last the LORD's own. A prose story frames the poetry, beginning in chapters 1–2 and ending in chapter 42. The book does not name its author, and no one knows when or where it was written. It is often classified as wisdom literature, and it asks two hard questions: why the righteous choose righteousness, and why the righteous suffer.

  Job himself was a real man. Ezekiel names him beside Noah and Daniel ([[Ezek. 14:14]]), James speaks of “the patience of Job” ([[James 5:11]]), and in Liberty Jail the Lord told Joseph Smith, “Thou art not yet as Job” ([[D&C 121:10]]). His life is told using some poetic elements, and the first of them is here: the LORD and the adversary are described in conversation in heaven.

  Chapter 1 is the first half of the prologue; chapter 2 repeats its pattern with Job's own body. Job never learns in the story why he suffers, but the prologue tells the reader from the start that his suffering is innocent, not a punishment for sin. Every speech that follows is heard in that light.

thread: |
  The chapter turns on one question, asked in heaven: **does Job fear God for nothing?** Put another way, is he pious because he is prosperous?

  The first five verses build the case for the question. The narrator calls Job perfect and upright, gives him ten children and great wealth, and shows him rising early to offer a sacrifice for each child, in case one of them had turned from God in his heart. Then the scene moves to heaven (verses 6–12). The LORD holds up Job as the man without equal, and the adversary answers that Job's devotion is bought: God has fenced him in with blessings, and if they are taken away Job will curse Him to His face. The LORD puts all that Job has in the adversary's power, but not Job himself.

  Back on earth (verses 13–19), the losses come in a single day, each messenger still speaking when the next arrives: raiders take the oxen and asses, fire falls on the sheep, raiders take the camels, and a wind from the wilderness brings down the house where all ten children are feasting.

  The last three verses are the answer to the question of verse 9. Job tears his robe, shaves his head, falls to the ground, and worships. The LORD gave, the LORD has taken, and Job blesses His name. The adversary had said that Job would “curse” God to His face, and the chapter ends with the narrator's verdict: in all this Job did not sin.

sections:
  - range: 1-5
    heading: A perfect man in Uz
    plain: |
      In the land of Uz there was a man named Job. He was blameless and upright; he feared God and turned away from evil. He had seven sons and three daughters. He owned seven thousand sheep, three thousand camels, five hundred yoke of oxen and five hundred female donkeys, and a great many servants, so that he was the greatest man of all the people of the East. His sons took turns holding feasts, each in his own house on his day, and they invited their three sisters to eat and drink with them. When a round of feasting was over, Job would send for his children and purify them. He rose early in the morning and offered a burnt offering for each one of them, for he thought, “Perhaps my children have sinned and cursed God in their hearts.” Job did this every time.
  - range: 6-12
    heading: The adversary before the LORD
    plain: |
      One day the sons of God came to present themselves before the LORD, and the adversary came with them. The LORD asked him, “Where have you come from?” He answered, “From roaming the earth and walking back and forth in it.” The LORD said, “Have you noticed My servant Job? There is no one on earth like him: blameless and upright, a man who fears God and turns away from evil.” The adversary answered, “Does Job fear God for nothing? Haven't You put a fence around him and his household and everything he owns? You have blessed his work, and his herds fill the land. But reach out Your hand and strike everything he has, and he will curse You to Your face.” The LORD said, “Very well, everything he has is in your power, but do not lay a hand on the man himself.” Then the adversary went out from the LORD's presence.
  - range: 13-19
    heading: Four messengers
    plain: |
      One day, while Job's sons and daughters were eating and drinking wine in their oldest brother's house, a messenger came to Job. “The oxen were plowing and the donkeys grazing beside them, and the Sabeans attacked and carried them off. They killed the servants with the sword, and I am the only one who escaped to tell you.” While he was still speaking another came: “The fire of God fell from the sky and burned up the sheep and the servants. I am the only one who escaped to tell you.” While he was still speaking another came: “The Chaldeans formed three raiding parties, swept down on the camels and carried them off, and killed the servants with the sword. I am the only one who escaped to tell you.” While he was still speaking another came: “Your sons and daughters were eating and drinking wine in their oldest brother's house, and suddenly a great wind swept in from the desert and struck the four corners of the house. It fell on the young people, and they are dead. I am the only one who escaped to tell you.”
  - range: 20-22
    heading: Blessed be the name of the LORD
    plain: |
      Then Job got up, tore his robe, and shaved his head. He fell to the ground and worshipped, and said: “Naked I came from my mother's womb, and naked I will return there. The LORD gave, and the LORD has taken away. Blessed be the name of the LORD.” In all this Job did not sin, and he did not accuse God of wrongdoing.

notes:
  - ref: 1
    phrase: There was a man in the land of Uz, whose name was Job; and that man was perfect and upright
    kind: history
    title: A man in Uz, perfect and upright
    body: |
      The book sets Job in a land no reader can place on a map with confidence. Uz was “probably east of Palestine and north of Edom,” and Lamentations links it with Edom: “O daughter of Edom, that dwellest in the land of Uz” ([[Lam. 4:21]]). Nobody is sure where it lay, but it was apparently outside Israel proper, and Job's three friends also come from outside its borders ([[Job 2:11]]). The setting makes the book's question one that belongs to everyone, not only to the covenant people.

      “Perfect” is *tām*, “complete,” the same word the LORD repeats of Job in verse 8 and again in 2:3; the site's notes on Noah and Jacob explain it ([[Gen. 6:9]]; [[Gen. 25:27]]). It does not mean Job was without sin; it implies that he faithfully kept the commandments of God. Together the phrases describe a man who has integrity and a relationship with God, and who avoids doing harm to others. The fear of God that marks him here is what chapter 28 will call wisdom ([[Job 28:28]]).

      The narrator's verdict matters for everything after it. Because the reader is told at the start that Job is blameless, the reader knows his suffering is innocent, whatever his friends will argue (see [[Job 4:7]]).
    sources: [bd-uz, sc-knowhy-864, oshb-wlc, bdb, seminary-ot-teacher-107, ot-minute-job-1, stirling-job]

  - ref: 5
    phrase: offered burnt offerings according to the number of them all
    kind: history
    title: Priest of his own house
    body: |
      Job offers the sacrifices himself. One older reading takes this, a father acting as the priest of his house, as a mark of the age before the law of Moses, and notes that the burnt offering here, as again when Job offers for his friends ([[Job 42:8]]), is an offering to atone for sin.

      What he guards against is not his children's conduct but their hearts: “It may be that my sons have sinned, and cursed God in their hearts.” He “sanctified” them first, rose early, and offered one sacrifice for each child, “continually.” The same older reading sees a father who was not content with outward propriety in his house.

      A Latter-day Saint reading finds two sides to the scene. Job's care for his children is commendable, and he knows that only God can keep them safe. But the anxious, repeated offering also shows a man who assumes that his righteousness will shield his family from harm, and the events of a single day, in the next fourteen verses, shatter that assumption.
    sources: [delitzsch-job, ot-minute-job-1]

  - ref: 5
    phrase: cursed God in their hearts
    kind: words
    title: Cursed, or blessed?
    body: |
      The Hebrew verb here is *bērēk*, “bless,” and the King James gives the sense the context requires, “cursed.” In a few passages the verb stands for its opposite: Job 1:5 and 11, 2:5 and 9, and the false charge against Naboth, “Thou didst blaspheme God and the king” ([[1 Kgs. 21:10]]). One explanation derives the use from the parting greeting, “saying adieu to, taking leave of”; the likelier is “a blessing overdone and so really a curse.” The same verb returns in the adversary's prediction (verse 11), in the second test, and in the counsel of Job's wife ([[Job 2:5]]; [[Job 2:9]]).
    sources: [oshb-wlc, bdb]

  - ref: 6
    phrase: the sons of God came to present themselves before the LORD, and Satan came also among them
    kind: history
    title: The council and the adversary
    body: |
      The Church reads the scenes in heaven as poetry, not as a record of a meeting. The conversations between the Lord and Satan likely do not describe an actual interaction; they are “best understood as a poetic way of conveying Satan's role as our adversary,” and perhaps a way of preparing the reader for what Job will suffer. The Lord does not make agreements with Satan and “has no need to bargain with him.” So the scene tells the reader what is at stake in Job's trial.

      The setting is the heavenly court that scholars often call the divine council, with “the sons of God” gathered before the LORD, as in the council the site describes at [[Ps. 82:1]]. The Joseph Smith Translation reads “children of God.”

      “Satan” in the Hebrew is *haśśāṭān*, with the article: “the adversary,” a title that describes his role here (the site explains it at [[Zech. 3:1]] and [[Num. 22:22]]). He is Satan, who became the adversary of mankind after his rebellion in the Council in Heaven; the Church's study aid also reports another possibility, that the article “may indicate that the adversary in this account was an adversarial member of the divine council rather than Satan himself.” On either reading the limit in verse 12 holds: the adversary may afflict everything Job has, but not Job, and God has power over him throughout.
    sources: [scripture-helps-job, seminary-ot-teacher-107, ot-seminary-2026-job-1-13, ot-minute-job-1, lds-scriptures, oshb-wlc]

  - ref: 7
    phrase: From going to and fro in the earth, and from walking up and down in it
    kind: scripture
    title: To and fro in the earth
    body: |
      The adversary's answer is taken up in a revelation to Joseph Smith after the loss of the 116 pages: “And thus he goeth up and down, to and fro in the earth, seeking to destroy the souls of men” ([[D&C 10:27]]). The revelation supplies what Job 1:7 leaves unsaid, the purpose of his roaming. In Job the adversary has a defined role in the heavenly court, though perhaps not the one he takes in later Christian writing; in Doctrine and Covenants 10 he is closer to the enemy of mankind familiar from the New Testament. The allusion points to Satan in general and does not suggest that the loss of the manuscript was a test arranged between the Lord and the adversary, as Job's was in the story.
    sources: [frederick-old-wine]

  - ref: 9
    phrase: Doth Job fear God for nought?
    kind: words
    title: Serving God for nothing
    body: |
      “For nought” is *ḥinnām*, “gratis, for nothing,” the word Laban uses when he asks Jacob, “shouldest thou therefore serve me for nought?” ([[Gen. 29:15]]). The adversary claims that Job fears God only because God has protected and blessed him, putting “an hedge” around him and all he owns (verse 10): to the adversary, Job's relationship with God is a transaction. It is the first of the two hard questions the book asks: “Why do righteous people choose righteousness?”

      Job's worship in verses 20–21 is the chapter's first answer to it.

      The word comes back at [[Job 2:3]], where the King James renders it “without cause.” The prologue lets the reader see both sides: the adversary doubts that Job's faith is free, and Job's suffering turns out to be undeserved.
    sources: [oshb-wlc, bdb, seminary-ot-teacher-107, ot-minute-job-1, seminary-intro-job, stirling-job]

  - ref: 16
    phrase: The fire of God is fallen from heaven
    kind: history
    title: Raiders, fire and wind
    body: |
      The four blows alternate: two bands of raiders, the Sabeans and the Chaldeans, take the herds and kill the servants; fire from heaven and a great wind destroy the rest and the children. The adversary was allowed to afflict all that Job had (verse 12), and the blows come through other men's violence and through nature. One Latter-day Saint reading sees in them the kind of suffering that belongs to life in a created, risky world, and finds the book ambiguous about how God or the adversary stands behind each disaster.

      “The fire of God” is the messenger's phrase. Job, like others in the Old Testament, takes everything as God's doing; when the news comes, he knows without being told that God has done it, and so he says “the LORD hath taken away.” The reader, who has seen the scene in heaven, knows more than Job does.
    sources: [stirling-job, seminary-ot-teacher-107, ot-minute-job-1]

  - ref: 21
    phrase: the LORD gave, and the LORD hath taken away; blessed be the name of the LORD
    kind: history
    title: Blessed be the name of the LORD
    body: |
      At the news of his children Job rises, tears his robe, and shaves his head, the signs of grief, and then falls to the ground, the posture of worship, not of despair. One older reading hears in “naked shall I return thither” a return to the bosom of mother earth, the grave. What he had came from the LORD, he acknowledges, and so it was the LORD's to take.

      The narrator's verdict follows: “In all this Job sinned not, nor charged God foolishly” (verse 22). “Foolishly” is *tiflāh*, “unseemliness”: Job “did not ascribe unseemliness to God,” did not accuse Him of doing wrong.

      The calm does not last. Job takes his first losses well, but by chapter 3 his pain is so great that words like these no longer hold him, and he curses his day ([[Job 3:1]]).
    sources: [delitzsch-job, ot-seminary-2026-job-1-13, bdb, oshb-wlc, ot-minute-job-1]

christ: |
  Job rising early to offer a sacrifice for each of his children is, in one Latter-day Saint reading, a type of Christ: his offerings and his sanctifying of his children anticipate the Savior's “infinite sacrifice,” and Job standing between God and his family (and later his friends, [[Job 42:8]]) foreshadows the “one mediator between God and men, the man Christ Jesus” ([[1 Tim. 2:5]]). The adversary's question, whether anyone serves God for nothing, is answered in this chapter by a man who blesses the name of the LORD after the LORD has taken away.

  The same question is put to every disciple's faith. Job knew that what he had came from God, and one Latter-day Saint reading of the book finds in his answer that a true relationship with God “is not a transaction based on certainty but a bond based on trust in the face of uncertainty.”

explore: |
  - **The second test.** [[Job 2:1–10]]: the council meets again, and the adversary is given Job's body.
  - **Joseph Smith in Liberty Jail.** [[D&C 121:1–10]], where the Lord measures the Prophet's trial against Job's.
  - **The accuser elsewhere.** [[Zech. 3:1–5]], where the Lord rebukes the satan in His court.
  - **The book as a whole.** “Hast Thou Considered My Servant Job?” (Religious Studies Center, 2005), a Latter-day Saint essay on Job's history and the shape of the book.

