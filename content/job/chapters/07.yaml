chapter: 7
title: My Life Is Wind
tagline: Job finishes his answer to Eliphaz by turning to God. Life is hard service and short, the dead do not come back, and so he will speak; why does God watch him so closely, and why not simply pardon him before he is gone?
when: 'The first round: Job answers Eliphaz'

setting: |
  Chapter 7 is the second half of Job's first answer to Eliphaz, which began in [[Job 6]]. Eliphaz had spoken in chapters 4 and 5, telling Job that the innocent do not perish ([[Job 4:7]], where the friends' reasoning is weighed once for the whole book) and that he should welcome the chastening of the Almighty. In chapter 6 Job answered the friends: his words were rash because his grief was heavy, and their comfort had failed him like a stream that runs dry in summer.

  In chapter 7 he stops talking to them. From verse 7 (“O remember that my life is wind”) to the end he speaks to God, and the friends are not mentioned again. The prayer sets out what he believes about life and death before the long argument begins: that human life is a laborer's hard service, that it is short, and that whoever goes down to the grave does not come back. Bildad answers in [[Job 8]].

  The chapter has a line that a reader may know from elsewhere. Job's “What is man?” (verse 17) is the question of Psalm 8, asked in bitterness instead of wonder ([[Ps. 8:4]]).

thread: |
  Job's claim is that a man's life is too short and too hard for God to spend it watching him. He begins with the human lot: life on earth is conscripted service, a slave's long day and a hired man's wait for his pay, and for Job it is months of nothing and nights that will not end (verses 1–4). His body is breaking down, and his days run out like thread on a loom (verses 5–6).

  At verse 7 he turns to God: remember that my life is a breath. Once he goes down to the grave he will not come back, and God's eyes will be on him and he will be gone (verses 7–10). So he will not keep quiet (verse 11). The second half is the complaint itself. Why does God set a guard on him as if he were the sea or its monster, and frighten him even in his sleep, until he would rather die (verses 12–16)? He takes up the psalm's “What is man?” and turns it around: why does God make so much of a man, inspecting him every morning and not looking away long enough to let him swallow (verses 17–19)? Even if he has sinned, what harm has he done to God, and why not pardon him, since soon he will be dust (verses 20–21)?

sections:
  - range: 1-6
    heading: Hard service and short days
    plain: |
      Is not human life on earth hard service? Are not a man's days like the days of a hired laborer? Like a slave who longs for the evening shade, and like a laborer waiting for his wages, I have been given months of emptiness, and nights of misery have been assigned to me. When I lie down I say, “When shall I get up?” But the night drags on, and I toss and turn until dawn. My body is covered with worms and crusted dirt; my skin cracks and breaks open. My days go by faster than a weaver's shuttle, and they come to an end without hope.
  - range: 7-10
    heading: Remember that my life is a breath
    plain: |
      Remember that my life is only a breath; my eyes will never again see good. Whoever sees me now will not see me again; Your eyes will be on me, and I will be gone. As a cloud thins and vanishes, so whoever goes down to the grave does not come up. He never comes home again, and his place does not know him any more.
  - range: 11-16
    heading: Why do You guard me?
    plain: |
      So I will not hold my tongue. I will speak out of the anguish of my spirit and complain out of the bitterness of my soul. Am I the sea, or the sea monster, that You must set a guard over me? When I think, “My bed will comfort me, my couch will ease my complaint,” then You frighten me with dreams and terrify me with visions, so that I would choose to be choked, choose death rather than this life. I loathe it; I do not want to live forever. Leave me alone, for my days are empty.
  - range: 17-21
    heading: What is man?
    plain: |
      What is a man, that You make so much of him and fix Your attention on him, that You inspect him every morning and test him every moment? How long before You look away from me, and leave me alone long enough to swallow my spit? If I have sinned, what have I done to You, You watcher of mankind? Why have You made me Your target, so that I am a burden to myself? Why do You not pardon my wrongdoing and take away my guilt? For soon I will lie down in the dust; You will search for me, and I will not be there.

notes:
  - ref: 1
    phrase: Is there not an appointed time to man upon earth
    kind: symbol
    title: Hard service on earth
    body: |
      Job opens his prayer by calling human life a term of forced service. The King James “appointed time” is *ṣābāʾ*, the ordinary word for an army and for war, used here of “hard service of troubled life,” and a modern translation reads, “Do not human beings have a hard service on earth?”

      The three figures of verses 1–2 (the conscript, the slave, the hired man) have one thing in common: none of them owns his day, and each waits for it to end. The slave longs for the shade of evening and the laborer for his wages. Job's point is that he has the labor without the evening. What he is given is “months of vanity” and nights that are “appointed” too, but bring no rest (verses 3–4).

      The word returns in the same sense later, where Job says he will wait out “all the days of my appointed time … till my change come” ([[Job 14:14]]). There he waits out the same service in expectation of a change.
    sources: [oshb-wlc, bdb, nrsvue, ot-minute-job-4]
  - ref: 6
    phrase: are spent without hope
    kind: words
    title: A thread that runs out
    body: |
      “Hope” at the end of verse 6 is *tiqvah*, a word that also means a cord or thread, so the line can be heard two ways at once. Both senses are well attested: the cord is Rahab's “line of scarlet thread” ([[Josh. 2:18]]), and hope is the ordinary meaning, the one usually given for this verse.

      The picture is of weaving. Job's days run faster than the shuttle that carries the thread back and forth across the loom, and they come to an end without *tiqvah*: when the thread runs out, the weaving stops. A study of the wordplay in Job reads this as a Janus parallel, a word with two meanings that faces both ways, one meaning toward the line before it and the other toward the line after. “Thread” answers the shuttle in verse 6; “hope” answers verse 7, where Job's eye “shall no more see good.” The pun is widely recognized.

      The English can give only one of the two. Read with both, the line says that Job's life is ending the way a length of cloth ends, and that his hope is running out with it.
    sources: [oshb-wlc, bdb, lindsay-janus]
  - ref: 9
    phrase: so he that goeth down to the grave shall come up no more
    kind: history
    title: No coming up from Sheol
    body: |
      Job believes that whoever goes down to the grave does not come back, and at this point in the book he has no hope of a resurrection. “The grave” is *Sheol*, the Hebrew name for “the abode of departed spirits,” which the King James renders “grave,” “pit” or “hell” as the context seems to need (explained at [[Gen. 37:35]]). This is the first time the book names it.

      What Job says of it here is all loss. A cloud thins and is gone (verse 9); the dead man does not come home, and “neither shall his place know him any more” (verse 10). God's eyes will be on Job, and he will be gone (verse 8; compare verse 21). These words may say as much about Job's state as about his belief: in his suffering, many things he says are not entirely accurate. Yet they are not out of keeping with what some psalms and Ecclesiastes say of death, which speak of the one mortal life and its end ([[Ps. 6:5]]; [[Eccl. 9:10]]).

      This is not Job's last word on death. He will ask, “If a man die, shall he live again?” ([[Job 14:14]]), and testify of a Redeemer whom he will see ([[Job 19:25–26]]).

      The theme page [He That Liveth, and Was Dead](/job/themes/he-that-liveth/) follows Job from this view of death to 19:25, where what he comes to know is not a fact about the dead but a Redeemer who lives.
    sources: [oshb-wlc, bd-sheol, stirling-job, ot-minute-job-4]
  - ref: 11
    phrase: I will complain in the bitterness of my soul
    kind: history
    title: Speaking in the anguish of his spirit
    body: |
      Job decides to speak because his time is short. Verse 11 begins with “therefore”: since life is a breath and the dead do not return (verses 7–10), he will at least say what he thinks and feels while he can.

      Whether that is sin is a fair question. To describe God as an enemy, as Job does in verses 12–21, is not in itself sin: the laments of scripture say the same ([[Lam. 3:9–10]]), and if asking God “How long?” and “Why?” were sinful, the Psalms would be full of sin. The danger is in dwelling on those questions until one charges God with having no mercy and no justice, and the friends, by insisting that Job's suffering is his own fault, push him further that way. Jeremiah's lament, after complaints like these, takes courage from the LORD's mercies that do not fail ([[Lam. 3:21–23]]), and many psalms that begin in sorrow end the same way.

      The book itself holds both sides. The LORD will later say that Job darkened counsel “by words without knowledge” ([[Job 38:2]]) and also that he had spoken “the thing that is right” ([[Job 42:7]]), where the verdict is weighed.
    sources: [ot-minute-job-4, delitzsch-job]
  - ref: 12
    phrase: Am I a sea, or a whale, that thou settest a watch over me
    kind: symbol
    title: The sea and the sea monster
    body: |
      Job asks whether he is as dangerous as the sea itself, that God has to post a guard over him. The King James “whale” is *tannin*, a broad word for reptilian creatures from snakes and crocodiles to legendary sea serpents; “whale” is a guess, and a modern translation reads, “Am I the Sea or the Dragon?”

      The sea monster stood for the watery chaos that preceded the Creation, and in the Old Testament the LORD is pictured as going to battle against the sea and the creatures in it ([[Ps. 74:13]]). This verse uses the monster figuratively, as do [[Isa. 27:1]] and [[Isa. 51:9]]; in the second it stands beside Rahab, a personification of chaos. Job is asking how he has become so dangerous that he needs as much of God's attention as the sea and its monsters. Even his bed gives him no escape, since God frightens him there with dreams (verses 13–14).

      Leviathan, the great sea creature of the LORD's second speech, is explained at [[Job 41:1]].
    sources: [oshb-wlc, sc-knowhy-732, nrsvue, bdb, ot-minute-job-4]
  - ref: 17
    phrase: What is man, that thou shouldest magnify him
    kind: scripture
    title: Psalm 8 turned into a complaint
    body: |
      Job takes the psalmist's question, “What is man, that thou art mindful of him?” ([[Ps. 8:4]]), and turns its wonder into a complaint. In the psalm, God's attention to frail man is the marvel, asked in gratitude: He has crowned him with glory and set him over the works of His hands. In Job the attention is the problem: God visits him every morning and tries him every moment (verse 18), and what Job wants more than anything is for God to look away. What the psalmist thanks God for, Job wants God to stop doing.

      Verse 19 says how little he asks: only that God would leave him alone long enough to swallow his spit.

      Psalm 8's question and where scripture takes it are followed in [Dust and Glory](/psalms/themes/what-is-man/).
    sources: [ot-minute-job-4]
  - ref: 20
    phrase: I have sinned; what shall I do unto thee, O thou preserver of men
    kind: words
    title: If I have sinned
    body: |
      “I have sinned” reads as a supposition, not a confession: granted that I have sinned, what harm have I done to You? A modern translation makes it plain: “If I sin, what do I do to you?” Job wonders what effect his actions can even have on God, and why God takes such an interest in punishing him. Beneath the question may lie the thought that a man's sin can take nothing from God's glory.

      The titles Job gives God sharpen the protest. “Preserver of men” is a participle of the verb to watch or guard, and here “watcher of men” is said ironically. The title is in itself worthy of God, who keeps what is His ([[Isa. 27:3]]), and that Job, with some bitterness, turns it to mean the strict observer who never stops looking. The “mark” is a thing hit, a target.

      The last words, “so that I am a burden to myself,” have a history. According to an old Jewish tradition, the text once read “a burden to thee,” and scribes changed it because it came too close to blasphemy. The ancient Greek translation has “why am I a burden to thee?”, and the older reading accepts the tradition for that reason; a modern translation follows it with “a burden to you.” The King James translates the Hebrew as it now stands. Either way, verse 21 follows from it: if Job has sinned, why does God not simply pardon him, since soon God will look for him and he will be gone?
    sources: [delitzsch-job, nrsvue, ot-minute-job-4, bdb, lxx-rahlfs]

christ: |
  Job prays as a man who believes that “he that goeth down to the grave shall come up no more” (verse 9), and at this point he has no hope of a resurrection. Jesus Christ is the answer to that verse: “in Christ shall all be made alive” ([[1 Cor. 15:22]]), and in the Resurrection “the spirit and the body shall be reunited again in its perfect form” ([[Alma 11:43]]). Job himself will reach toward that hope as his trial goes on ([[Job 14:14]]; [[Job 19:25–26]]).

  The Church's footnote to the “appointed time” of verse 1 points to Alma's teaching that “it was appointed unto men that they must die” ([[Alma 12:27]]); earlier in the same sermon Alma calls the life before that appointment “a probationary state; a time to prepare to meet God” ([[Alma 12:24]]). A disciple's days are as short as Job's, and they are given for that preparation, with the grave no longer their end.

explore: |
  - **What is man?** [[Ps. 8:3–6]] and [[Heb. 2:6–9]], beside Job's question here and Eliphaz's in [[Job 15:14]].
  - **Hope after death.** [[Job 14:7–15]], where Job asks again whether a man shall live again; [[Job 19:25–27]].
  - **The grave of no return.** [[Job 10:20–22]], and Lehi's “cold and silent grave, from whence no traveler can return” ([[2 Ne. 1:14]]), language that has antecedents in Job.

