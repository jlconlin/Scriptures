chapter: 33
title: I Have Found a Ransom
tagline: Elihu turns to Job by name, quotes his complaints back to him, and answers that God does speak to man, in dreams and in pain, and that a messenger may plead for him until God says, “I have found a ransom.”
when: 'Elihu’s first speech'

setting: |
  Chapter 33 is the second half of Elihu’s first speech, which began at [[Job 32:6]]. Who this young man is, and why he is angry with Job and with the three friends, is set out at [[Job 32:2]]. Having spent chapter 32 explaining why he must speak, he now turns to Job himself and calls him by name, as none of the three friends had done.

  Elihu reproves the friends and reasons with Job, and he condemns Job “for reasons other than the reasons of the first three friends.” This chapter shows what those reasons are. The friends read Job’s suffering as punishment for sin (see [[Job 4:7]]). Elihu’s charge is against what Job has said in his suffering, that God treats him as an enemy and will not answer; and his reply is that God does answer, in a warning by night, in pain on the sickbed, and through a messenger who pleads for a man until God finds a ransom. His speeches run to the end of chapter 37, and his main thesis, that God will “not pervert judgment,” comes in [[Job 34:12]]. Job makes no reply to him.

thread: |
  Elihu’s argument moves in four steps, from an invitation, to Job’s own words, to God’s answer, and back to an invitation.

  He begins by setting himself on Job’s level (verses 1–7). He will speak honestly; he too was made by the Spirit of God and formed from clay; Job need not fear him as he feared God. Then he quotes Job (verses 8–11): “I am clean,” and God “counteth me for his enemy” and “putteth my feet in the stocks.” His answer is short: in this Job is not right, for God is greater than man, and it is no use to strive with Him because He gives no account of His doings (verses 12–13).

  Verse 14 is the turn. God does speak, Elihu says, once and twice, though man does not perceive it: first in dreams that warn a man away from his purpose and his pride (verses 15–18), then in pain that wastes his body and brings him to the edge of the pit (verses 19–22). If then a messenger speaks for him, God is gracious and says, “I have found a ransom,” and the man is made young again, prays, sees God’s face with joy, confesses his sin, and comes back to the light (verses 23–30). The aim of the whole is that Job see his affliction not as a hostile act of an angry God but as the chastening of a God who means his good.

  Elihu ends as he began (verses 31–33): let Job answer if he can, for Elihu would gladly find him in the right; if not, let him be silent and learn.

sections:
  - range: 1-7
    heading: I too am clay
    plain: |
      “Now, Job, please hear what I have to say, and listen to all my words. I have opened my mouth; my tongue is ready to speak. My words come from an honest heart, and my lips will say plainly what they know. The Spirit of God made me, and the breath of the Almighty gives me life. Answer me if you can; set your case out in order and take your stand. Look, before God I am just as you are; I too was shaped from clay. So you have no reason to be terrified of me, and my hand will not weigh heavily on you.
  - range: 8-13
    heading: What you have said
    plain: |
      “You have said it in my hearing; I heard the sound of your words: ‘I am clean, without transgression; I am innocent, with no iniquity in me. Yet God finds pretexts against me and counts me as His enemy. He puts my feet in the stocks and watches every path I take.’ In this you are not right, and I will answer you: God is greater than any man. Why do you contend with Him? He does not have to give an account of anything He does.
  - range: 14-18
    heading: God speaks in the night
    plain: |
      “God does speak, once and then a second time, though people do not notice it. In a dream, in a vision of the night, when deep sleep falls on people as they slumber on their beds, He opens their ears and seals His warning in them, to turn a person aside from what he means to do and to keep him from pride. So He holds back his soul from the pit and his life from perishing by the sword.
  - range: 19-22
    heading: God speaks in pain
    plain: |
      “A person is also corrected by pain on his bed, with constant aching in his bones, until he cannot stand the sight of bread or the finest food. His flesh wastes away until it can hardly be seen, and bones that were hidden stick out. His soul comes near to the pit, and his life to those who bring death.
  - range: 23-30
    heading: A messenger and a ransom
    plain: |
      “But if there is a messenger beside him, a go-between, one in a thousand, to show him what is right for him, then God is gracious to him and says, ‘Spare him from going down to the pit; I have found a ransom.’ His flesh becomes fresher than a child’s, and he returns to the days of his youth. He prays to God, and God receives him favorably; he sees God’s face with joy, for God restores to him his righteousness. God looks on people, and if anyone says, ‘I sinned and twisted what was right, and it did me no good,’ He will deliver his soul from going down to the pit, and his life shall see the light. All this God does with a person again and again, to bring his soul back from the pit, so that the light of life shines on him.
  - range: 31-33
    heading: Answer, or listen
    plain: |
      “Pay attention, Job, and listen to me; be quiet, and I will speak. If you have anything to say, answer me; speak, for I want to find you in the right. If not, listen to me; be quiet, and I will teach you wisdom.”

notes:
  - ref: 6
    phrase: I am according to thy wish in God’s stead
    kind: words
    title: Not in God’s place, but clay like Job
    body: |
      The King James can sound as though Elihu claims to stand in God’s place; the Hebrew says he stands before God exactly where Job stands. The words behind “according to thy wish” are literally “according to the mouth of” Job, an idiom for “in proportion to” or “like,” and the standard lexicon reads the line “I stand towards God even as thou dost.” A modern translation gives it as “See, before God I am as you are; I, too, was formed from a piece of clay.”

      Verse 4 is the other half of the same thought. The Spirit of God made Elihu and the breath of the Almighty gave him life; the clay of verse 6 is the body, and the two together are the twofold origin of man in [[Gen. 2:7]], where the LORD formed man of the dust and breathed into him the breath of life. Elihu has both in common with Job, and so he offers Job a contest between equals.

      That is why verse 7 says, “my terror shall not make thee afraid.” Twice Job had made it a condition of pleading his case with God that God’s dread not overwhelm him: “let not his fear terrify me” ([[Job 9:34]]); “let not thy dread make me afraid” ([[Job 13:21]]). Elihu answers that condition: from this man, Job need fear no unequal contest.
    sources: [oshb-wlc, bdb, nrsvue, delitzsch-job]
  - ref: 11
    phrase: He putteth my feet in the stocks, he marketh all my paths.
    kind: scripture
    title: Job’s own words, quoted back
    body: |
      Verse 11 is Job’s own line, quoted back to him. In Hebrew it repeats the first two clauses of Job’s earlier complaint almost exactly, with “he” for “thou”; the King James hides the repetition by translating the same verb differently there: “Thou puttest my feet also in the stocks, and lookest narrowly unto all my paths” ([[Job 13:27]]). Verse 10 takes up, in nearly the same Hebrew words, Job’s complaint that God “holdest me for thine enemy” ([[Job 13:24]]).

      The quotation shows where Elihu’s charge lies. The friends read Job’s sufferings as a sign of God’s anger and a punishment for sin. Elihu condemns him on different grounds, for what he regards as impiety: the words Elihu sets in Job’s mouth in verses 9–11, that he is clean and that God treats him as an enemy. His answer to them is the first sentence of verse 12: “in this thou art not just.”
    sources: [oshb-wlc, bd-job-book]
  - ref: 14
    phrase: For God speaketh once, yea twice, yet man perceiveth it not.
    kind: history
    title: Two ways God speaks
    body: |
      Elihu answers Job’s complaint that God gives no account of Himself (verse 13) by saying that God does speak, in two ways, and that people do not perceive it. “Once, yea twice” is a counting saying, like Eliphaz’s “six troubles: yea, in seven” ([[Job 5:19]]): it introduces two things, and Elihu names them. The first is the dream in the night, when God opens a man’s ears and seals a warning in them, to turn him from his purpose and keep him from pride (verses 15–18). The second is pain: the sickbed, the aching bones, food turned loathsome, the body wasted until the bones stand out and the man comes near the pit (verses 19–22).

      What sets Elihu apart is how he reads that pain. In one older reading, he means Job to see his affliction “not indeed as a punishment from the angry God, but as a chastisement of the God who desires his highest good,” a discipline to guard him from sin, “especially to pride.” The same reading grants that “one must listen very closely” to hear the difference from Eliphaz, who also called Job’s trouble chastening ([[Job 5:17]]); the difference is that Eliphaz demanded that Job humble himself, while Elihu presents the affliction itself as God’s speech to him, meant for his good. The Church’s Guide to the Scriptures finds something like this in the book as a whole: affliction “does not necessarily mean that a person has sinned,” and the Lord may use it “for experience, discipline, and instruction as well as for punishment.”

      The reader knows from the prologue what Elihu does not: Job’s affliction was a trial of a righteous man’s faith ([[Job 1:8–12]]). On the older reading quoted above, Elihu’s idea of chastening so fills his view that the trial is “swallowed up by it.”
    sources: [delitzsch-job, gs-job]
  - ref: 23
    phrase: a messenger with him, an interpreter, one among a thousand
    kind: words
    title: A messenger and an interpreter
    body: |
      The figure Elihu brings in at verse 23 is a go-between who speaks for the sufferer before God; a modern translation calls him “an angel, a mediator, one of a thousand.” “Messenger” (*malʾāk*) is the ordinary word for one sent with a message, and also for a prophet. “Interpreter” (*mēlîṣ*) is the word for the interpreter who stood between Joseph and his brothers ([[Gen. 42:23]]), and the standard lexicon gives it a figurative sense too, of “intermediaries between God and man.” The Aramaic Targum renders the word with the Greek loanword *paraklētos*, an advocate who speaks for a man, the opposite of an accuser.

      Some older interpreters took the messenger to be a human one, a prophet who declares God’s will, such as Elihu himself. One older reading answers that Elihu’s figure does more than declare the terms of deliverance: he is the mediator of the deliverance itself, and so an angel, and not just any one of the thousands of angels but one “who soars above the thousands, and has not his equal among them.” The same reading sets him beside what Job had asked for in his own trouble: a daysman to lay his hand on both parties ([[Job 9:33]]), a witness in heaven who would plead for a man with God ([[Job 16:19–21]]), and a pledge for him with God ([[Job 17:3]]).
    sources: [nrsvue, bdb, delitzsch-job]
  - ref: 24
    phrase: 'Deliver him from going down to the pit: I have found a ransom.'
    kind: christ
    title: “I have found a ransom”
    body: |
      When the messenger speaks for the man, God is gracious and gives the word of release (in one older reading, to the angel himself): “Deliver him from going down to the pit: I have found a ransom.” The noun is *kōper*, “the price of a life, ransom,” the payment that redeems a life otherwise forfeit (the word is explained at [[Exod. 30:12]]). The pit is the grave the sick man of verse 22 has already drawn near to.

      Elihu does not say what the ransom is. One older reading weighs the answer that it is the man’s repentance, or his affliction because it has brought him to repentance, and prefers another: the ransom is the angel’s mediation itself. The same reading, seeing the mediator in the light of the New Testament, calls the passage “a presage of the mystery which is unveiled in the New Testament: ‘God was in Christ, and reconciled the world unto Himself.’” The Church’s footnote at “ransom” points to Paul’s words of Jesus Christ in [[1 Tim. 2:6]].

      What the ransom buys is told in verses 25–30: flesh “fresher than a child’s,” prayer that God receives, His face seen with joy, a confession that sin “profited me not,” and a soul brought back from the pit “to be enlightened with the light of the living.”
    sources: [bdb, delitzsch-job, lds-scriptures]
  - ref: 26
    phrase: he shall see his face with joy
    kind: scripture
    title: Enos and the face of God
    body: |
      The prophet Enos closes his record with words very close to this verse: “Then shall I see his face with pleasure, and he will say unto me: Come unto me, ye blessed, there is a place prepared for you in the mansions of my Father” ([[Enos 1:27]]). One Latter-day Saint study proposes that Enos was applying this line of Job directly to himself. The first half of verse 26, “he shall pray unto God, and he will be favourable unto him,” is a fair summary of Enos’s own record, and the second half is what Enos seems to have copied almost word for word.

      The reason he chose it may be in the Hebrew. The word for “man” at the end of the verse, “he will render unto man his righteousness,” is *ʾĕnôš*, likely the same word from which the name Enos comes, so that Enos could read the line as “he will render unto Enos his righteousness”; his own book then says what that reward is, a place in the mansions of the Father. Another study lists the verse among the bits of Job the Book of Mormon alludes to, which, like its quotations of Isaiah and the Psalms, were presumably taken from the plates of brass. The connection is a proposal, not a certainty; if it holds, a Book of Mormon prophet applied Elihu’s promise directly to himself.
    sources: [sc-knowhy-265, oshb-wlc, sc-knowhy-410]

christ: |
  Elihu imagines a messenger, one among a thousand, who speaks for a man near the pit, and God answers, “I have found a ransom.” Elihu does not say who the messenger is or what the ransom is. The Church’s footnote at “ransom” sets beside the verse Paul’s words of the One who is both: “there is one God, and one mediator between God and men, the man Christ Jesus; Who gave himself a ransom for all” ([[1 Tim. 2:5–6]]); the Savior used the same word of Himself: “the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many” ([[Matt. 20:28]]). In the latter days He calls Himself “the advocate with the Father” and gives His own pleading: “Father, behold the sufferings and death of him who did no sin… Wherefore, Father, spare these my brethren that believe on my name” ([[D&C 45:3–5]]).

  A disciple does not have to find his own ransom. It has been found and paid, and the Advocate who paid it pleads with the Father for those who believe on His name.

explore: |
  - **Elihu goes on.** His other speeches: [[Job 34]], [[Job 35]], [[Job 36]] and [[Job 37]].
  - **Someone to stand between.** Job’s hope runs from the daysman of [[Job 9:33]] through [[Job 16:19–21]] and [[Job 17:3]] to the Redeemer of [[Job 19:25–27]].
  - **The ransom.** [[Exod. 30:12]]; [[Ps. 49:7–8]]; and [Between the Dead and the Living](/numbers/themes/between-the-dead-and-the-living/), on atonement in Numbers.
  - **The light of the living.** [[Ps. 56:13]] and [[John 8:12]].

