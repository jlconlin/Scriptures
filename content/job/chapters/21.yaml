chapter: 21
title: Wherefore Do the Wicked Live?
tagline: Job answers Zophar and closes the second round. The friends say the wicked are always cut down; Job points to what anyone can see, the wicked growing old in wealth and going quietly to the grave.
when: 'The second round: Job answers Zophar'

setting: |
  Chapter 21 is Job’s answer to Zophar’s second speech ([[Job 20]]), and it ends the second round of the dialogue, which runs from chapter 15. Zophar had stated the friends’ position in its plainest form: “the triumphing of the wicked is short” ([[Job 20:5]]). He meant it about Job. The wicked always get what is coming to them, and so Job, by implication, has finally got what was coming to him. Bildad had said the same about the lamp of the wicked that goes out ([[Job 18:5]]). Why that reasoning fails Job is taken up once, at [[Job 4:7]].

  Job tells the friends that his complaint is with God, not with them, and then takes on their doctrine on its own ground: is it true that the wicked are punished in this life? He answers by describing what experience shows, and he refutes Zophar’s speech almost point by point.

  The Church’s chapter heading reads the chapter as an admission and a testimony: Job admits that the wicked sometimes prosper in this life, and testifies that their judgment will come hereafter.

thread: |
  Job’s claim is that experience refutes the friends. He begins by asking only to be heard: let their listening be all the comfort they offer, and then they may mock (verses 1–3). His complaint is not to any man, and what he is about to say should leave them speechless (verses 4–6).

  Then comes the picture. The wicked live long and grow strong; their children are around them, their herds multiply, their little ones dance, and they die quickly, without a long struggle (verses 7–13). They even tell God to leave them alone and ask what profit there is in praying to Him (verses 14–15). Job wants no part of their counsel (verse 16).

  The speech turns at verse 17 with a question: how often does what the friends preach actually happen? He rejects their fallback, that God punishes the wicked man’s children (verses 19–21), and asks who presumes to teach God. Death treats the prosperous and the bitter alike (verses 22–26). He ends with the friends’ own question, “Where is the house of the prince?”, and sends them to the travellers, who know that the wicked man is carried to his grave with honor (verses 27–33). Their comfort is empty and their answers are falsehood (verse 34).

sections:
  - range: 1-6
    heading: Listen, then mock
    plain: |
      Job answered: Listen carefully to what I say, and let that be the comfort you give me. Bear with me while I speak, and when I have finished you may go on mocking. Is my complaint against a man? If it were, why should I not be impatient? Look at me and be appalled, and put your hand over your mouth. When I think about it I am terrified, and my body shudders.
  - range: 7-16
    heading: The wicked grow old in wealth
    plain: |
      Why do the wicked go on living, reach old age, and grow powerful? Their children are settled around them, and their offspring are before their eyes. Their houses are safe and free from fear; God’s rod does not touch them. Their bull breeds without fail; their cow calves and does not miscarry. They send out their little ones like a flock, and their children dance. They sing to the tambourine and the harp, and enjoy the sound of the flute. They spend their days in prosperity and go down to the grave in a moment, without a long death. Yet they say to God, “Leave us alone! We do not want to know Your ways. Who is the Almighty, that we should serve Him? What would we gain by praying to Him?” Yet their good fortune is not in their own hands. I want nothing to do with the counsel of the wicked.
  - range: 17-21
    heading: How often is the lamp put out?
    plain: |
      How often is the lamp of the wicked really put out? How often does disaster come on them, or God hand out sorrows to them in His anger? How often are they like straw before the wind, like chaff the storm carries off? You say, “God stores up a man’s iniquity for his children.” Let Him repay the man himself, so that he knows it. Let him see his own ruin with his own eyes, and drink the wrath of the Almighty himself. What does he care about his household after him, once the number of his months is cut off?
  - range: 22-26
    heading: Alike in the dust
    plain: |
      Can anyone teach God knowledge, when He judges even those on high? One man dies in his full strength, completely at ease and secure, his body well fed and vigorous. Another dies in bitterness of soul and has never eaten with pleasure. They lie down alike in the dust, and the worms cover them both.
  - range: 27-34
    heading: Ask the travellers
    plain: |
      I know what you are thinking, and the schemes you have wrongly devised against me. You say, “Where is the great man’s house now? Where are the tents where the wicked lived?” Have you not asked people who travel the roads? Do you not recognize what they tell you, that the wicked man is kept for the day of destruction, and brought out to the day of wrath? Who confronts him with his conduct to his face? Who repays him for what he has done? He is carried to the grave, and he rests in his tomb. The clods of the valley lie sweet on him; everyone follows after him, as countless people went before him. How then can you comfort me with empty words? Nothing is left of your answers but falsehood.

notes:
  - ref: 5
    phrase: lay your hand upon your mouth
    kind: symbol
    title: A hand over the mouth
    body: |
      A hand laid over the mouth is the gesture of someone who stops talking, as the book itself shows twice more. When Job sat in honor, “The princes refrained talking, and laid their hand on their mouth” ([[Job 29:9]]). And when the LORD has spoken out of the whirlwind, Job answers, “Behold, I am vile; what shall I answer thee? I will lay mine hand upon my mouth” ([[Job 40:4]]).

      Here Job asks that silence of the friends before he says a word about the wicked. He has just told them that his complaint is not to man (verse 4): his quarrel is with God. Yet he will still answer Zophar’s claim that the wicked always get their due.
    sources: [ot-minute-job-4, lds-scriptures]
  - ref: 7
    phrase: Wherefore do the wicked live, become old, yea, are mighty in power?
    kind: scripture
    title: Why the wicked prosper
    body: |
      Job’s answer to the friends is an appeal to what anyone can see: the wicked often live long, keep their families, prosper, and die quickly. Zophar had stated the standard teaching that “the triumphing of the wicked is short” ([[Job 20:5]]); Job replies that they “spend their days in wealth, and in a moment go down to the grave” (verse 13). Here, as in many places in the book, the speakers debate the doctrine of retributive justice, the belief that God always repays righteousness and wickedness in this life.

      The friends hold to a picture of the world in which those who do good are always rewarded in this life and those who do evil always punished; the book of Job reminds readers that life is more complicated, and that “sometimes the righteous suffer for a time, and sometimes the wicked prosper for a time.” The Church’s reading of chapters 20–22 keeps both halves of Job’s answer: the friends insisted that the wicked cannot prosper; Job acknowledged that they sometimes do, but held that the Lord will administer justice on the Day of Judgment. Where the chapter heading finds that judgment is taken up at verse 30.
    sources: [tanner-considered-job, sc-knowhy-864, seminary-ot-teacher-108]
  - ref: 17
    phrase: How oft is the candle of the wicked put out!
    kind: scripture
    title: How often is the lamp put out?
    body: |
      Verse 17 can be read as a question rather than an exclamation: Job asks how often the friends’ doctrine actually comes true, and the answer he expects is “seldom.” The King James prints an exclamation mark, but in one older reading the Hebrew “how often” carries the sense of “how seldom?!” here, and the question governs verses 17 and 18 together. A modern translation prints all four lines as questions: “How often is the lamp of the wicked put out? How often does calamity come upon them?”

      Each image was one the friends had already used. Bildad had said that “the light of the wicked shall be put out” ([[Job 18:5]]) and that destruction would be “ready at his side” ([[Job 18:12]]); Zophar had called calamity “the portion of a wicked man from God” ([[Job 20:29]]). Job throws their lines back at them, refuting Zophar almost point by point.

      Verse 18’s chaff is the image of the first psalm: the ungodly “are like the chaff which the wind driveth away” ([[Ps. 1:4]]). In the same older reading, Job does not deny what the psalm teaches. He turns its statement into a question because Zophar had applied it falsely and superficially.
    sources: [delitzsch-job, nrsvue, stirling-job]
  - ref: 19
    phrase: God layeth up his iniquity for his children
    kind: scripture
    title: Punished in his children?
    body: |
      Verse 19 is best read as opening with words Job puts in the friends’ mouths: God stores up a man’s punishment for his children. The King James obscures this, since it gives the words as a plain statement; a modern translation adds “You say,” and another renders verses 19–21 so that Job’s reply is clear: “God stores up his punishment for his children. Let him destroy them so they know. Let their own eyes witness their doom.” The friends had said as much, of the wicked man’s offspring ([[Job 18:19]]) and his children ([[Job 20:10]]). Job’s objection is that the man himself should be repaid, see his ruin with his own eyes, and drink the wrath of the Almighty (verse 20), since once he is dead, what does he care what happens to his house (verse 21)?

      The friends’ idea had scripture behind it: the Lord visits “the iniquity of the fathers upon the children” ([[Exod. 20:5]]). What the friends built on it came, in one Latter-day Saint reading, from the wisdom of the elders they kept appealing to ([[Job 8:8–10]]; [[Job 15:9–10]]): a strict rule of retribution, held so firmly that Bildad could tell Job his children had died for their own sins ([[Job 8:4]]), which the reader of the prologue knows to be false. Job’s reply is that God should repay each man for his own deeds; the reading calls the friends’ position another case of mixing scripture with accumulated human tradition.
    sources: [nrsvue, ot-minute-job-4, stirling-job]
  - ref: 30
    phrase: the wicked is reserved to the day of destruction
    kind: words
    title: Kept for the day, or spared in it?
    body: |
      Verse 30 is where the Church’s chapter heading finds Job’s testimony that the judgment of the wicked “will be hereafter in the day of wrath and destruction,” and the King James reads it that way: the wicked man is held back for a day of destruction still to come. A modern translation reads the line instead as part of the travellers’ report about this life, that the wicked “are spared in the day of calamity,” and one Latter-day Saint reading takes it the same way, as the travellers’ testimony that the wicked rarely experience calamity.

      On this life the verses around it say the same either way: no one declares the wicked man’s way to his face or repays him (verse 31), and he is brought to the grave and rests in his tomb, with the crowds following him (verses 32–33). The heading reads Job as looking past that grave to the day of wrath.
    sources: [lds-scriptures, nrsvue, stirling-job]

christ: |
  Job asks of the prosperous wicked man, “Who shall declare his way to his face? and who shall repay him what he hath done?” (verse 31). The judgment hereafter that the chapter heading finds in his answer has a judge in scripture: “the Father judgeth no man, but hath committed all judgment unto the Son” ([[John 5:22]]), and the Son of man “shall reward every man according to his works” ([[Matt. 16:27]]).

  The wicked sometimes prosper for a time, and the righteous sometimes suffer for a time, so this life’s balance sheet is not the measure of God’s justice. The reckoning that does not come here belongs to Jesus Christ, who will judge every person.

explore: |
  - **The same question in other voices.** [[Ps. 73]], where the psalmist nearly slips over the ease of the wicked until he goes into the sanctuary ([[Ps. 73:17]]); [[Jer. 12:1–4]].
  - **Job comes back to it.** [[Job 24:1–12]], where Job asks the question again.
  - **Each for his own sin.** [[Ezek. 18:1–20]], where the son does not bear the father’s iniquity: the question of verses 19–21.

