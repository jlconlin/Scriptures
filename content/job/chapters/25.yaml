chapter: 25
title: How Then Can Man Be Justified with God?
tagline: Bildad’s last speech, and the friends’ last word, is six verses long. He praises the God who rules the heavens and asks how a man, a worm before Him, could ever be clean.
when: 'The third round: Bildad'

setting: |
  Chapter 25 is Bildad the Shuhite’s third and last speech (his first two are [[Job 8]] and [[Job 18]]; on the friends and their homes, see [[Job 2:11]]). Job has just finished his answer to Eliphaz, wishing he could find God’s seat and plead his case there ([[Job 23:3–7]]) and asking why the wicked go unpunished ([[Job 24:1]]). Why the friends’ doctrine fails Job is set out once, at [[Job 4:7]].

  The third round is unusual. Bildad speaks only six verses, Zophar never speaks a third time, and some of Job’s last words sound more like the friends than like Job. Some scholars have argued that earlier versions of the book may have been damaged in copying. That is possible, but the chapters here read the text as it stands and try to make sense of it.

  Read that way, the shortness says something. In one older reading, the friends’ silence is by design: they have nothing new to bring against Job, and Bildad does not even repeat the crimes Eliphaz had charged him with ([[Job 22:5–9]]). In one Latter-day Saint reading, Job then seems to “finish” Bildad’s speech for him with a parody of it ([[Job 26:5–14]]), and real dialogue has stopped. Job answers in chapters 26 and 27, and the friends do not speak again.

thread: |
  Bildad says nothing to Job’s question about the wicked. He makes one argument, the “how much less” of verse 6, and it is Eliphaz’s argument over again ([[Job 4:17–19]]; [[Job 15:14–16]]).

  He begins with God’s greatness: dominion and awe belong to Him, He keeps peace in the heights, His armies cannot be counted, and His light rises over everything (verses 2–3). Then he turns it on man. If that is God, how can a mortal be in the right before Him, or anyone born of a woman be clean (verse 4)? Even the moon and stars are not bright or pure in His sight (verse 5), and man is a maggot and a worm (verse 6). The speech stops there, on the lowest word it can find for a human being.

sections:
  - range: 1-3
    heading: Dominion and fear are with Him
    plain: |
      Then Bildad the Shuhite answered: “Rule and awe belong to God; He makes peace in His heights above. Can anyone count His armies? And on whom does His light not rise?
  - range: 4-6
    heading: How much less man
    plain: |
      “How then can a mortal be in the right before God? How can anyone born of a woman be clean? Even the moon is not bright, and the stars are not pure in His sight; how much less a mortal, who is a maggot, and a human being, who is a worm!”

notes:
  - ref: 2
    phrase: he maketh peace in his high places
    kind: symbol
    title: Peace in the heights
    body: |
      The “high places” here are heaven (a modern translation has God “makes peace in his high heaven”), and the peace is among the heavenly beings around Him, as the older commentators mostly took it. The armies of verse 3 belong to the same picture, the stars drawn up like a host under the one God. One older reading goes further: because the poem elsewhere speaks of powers that rise against God ([[Job 9:13]]; [[Job 26:12]]), the peace Bildad praises would be order that God restores, perhaps again and again, not a peace that was never broken.

      Bildad means it as praise of God’s power. One Latter-day Saint reading hears in it a possible concession as well, that things may not be as they should be on earth, though heaven is at peace, and finds truth there: Jesus taught His disciples to pray, “Thy will be done in earth, as it is in heaven” ([[Matt. 6:10]]), a prayer that would be needless if God’s will were always done on earth.
    sources: [nrsvue, delitzsch-job, ot-minute-job-4]
  - ref: 4
    phrase: How then can man be justified with God?
    kind: christ
    title: Justified with God
    body: |
      Bildad’s question is Eliphaz’s question, asked twice before ([[Job 4:17]]; [[Job 15:14]]), and it is close to Job’s own: “how should man be just with God?” ([[Job 9:2]]; the note there explains it as a courtroom question). To Job’s longing to plead his case at God’s seat ([[Job 23:3–7]]), Bildad has only this to add, agreeing with Eliphaz that no mortal can be righteous before God, since no one born of a woman is clean.

      The Church’s footnote to “clean” sets beside Bildad’s question verses in which the Lord Himself speaks of making people clean. To Moroni, who had seen his weakness, He said, “thou hast been faithful; wherefore, thy garments shall be made clean” ([[Ether 12:37]]). To the first elders of the restored Church He gave a commandment: “sanctify yourselves; yea, purify your hearts, and cleanse your hands and your feet before me, that I may make you clean” ([[D&C 88:74]]). Bildad sees only the distance between God and a mortal; in these verses the people do their part and the Lord makes them clean.
    sources: [stirling-job, lds-scriptures]
  - ref: 6
    phrase: man, that is a worm
    kind: symbol
    title: Maggot and worm
    body: |
      Bildad uses two different words for “worm,” set in parallel. *Rimmâ* is the worm of decay, the kind that feeds on the dead; it is the word Job used of his own flesh, “clothed with worms” ([[Job 7:5]]), and of the dead who lie in the dust ([[Job 21:26]]). *Tôlēʿâ* is the worm that stands elsewhere for insignificance ([[Isa. 41:14]]). A modern translation marks the two: “how much less a mortal, who is a maggot, and a human being, who is a worm!”

      In one Latter-day Saint reading, Bildad is answering the psalm’s question, “What is man, that thou art mindful of him?” ([[Ps. 8:4]]), with “a worm,” and so strips mortals of the royal place the psalm gives them, crowned with glory and set over the works of God’s hands. Job had already turned the same psalm into a complaint (see [[Job 7:17]]).
    sources: [bdb, oshb-wlc, nrsvue, stirling-job]

christ: |
  The psalm that Jesus prayed on the cross uses Bildad’s word: “But I am a worm, and no man; a reproach of men, and despised of the people” ([[Ps. 22:6]]). In one Latter-day Saint reading, Bildad used “worm” to suggest that Job’s suffering came from the uncleanness all mortals share, and the Savior, who “descended below all things” ([[D&C 88:6]]), was treated in the same way as the lowest of creatures, mocked by men who took His suffering on the cross for proof that He was cursed.

  No one’s lowliness is beneath the reach of the One who descended below all things, and a disciple’s suffering is not proof that He has turned away. The Lord promises to make those who come to Him clean (see verse 4), with the very cleanness Bildad thought no mortal could have.

explore: |
  - **Job’s answer.** [[Job 26]], where Job asks Bildad how he has helped the powerless and then praises God’s power in his own words.
  - **The same argument from Eliphaz.** [[Job 4:17–21]] and [[Job 15:14–16]].
  - **What is man?** [[Ps. 8:3–6]], and the Psalms page [Dust and Glory](/psalms/themes/what-is-man/).
  - **A worm, and no man.** [[Ps. 22:1–8]] beside [[Matt. 27:39–46]].

sources: [ot-minute-job-4, delitzsch-job, stirling-job, nrsvue, lds-scriptures, bdb, oshb-wlc, hopkin-psalm-22]
