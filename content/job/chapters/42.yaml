chapter: 42
title: Now Mine Eye Seeth Thee
tagline: Job answers the LORD a last time, takes back the words he spoke without knowledge, and says that now he has seen Him. Then the LORD rebukes the three friends, Job prays for them, and the LORD gives him twice what he had lost.
when: "Job's answer and the ending"

setting: |
  Chapter 42 closes the book in two parts. In verses 1–6 Job answers the LORD for the second and last time. The LORD's first speech out of the whirlwind ([[Job 38:1]]) had brought from Job only a hand laid over his mouth ([[Job 40:3–5]]); the second, with behemoth and leviathan ([[Job 40:6]] to [[Job 41:34]]), brings this fuller answer, in which Job humbly submits to the Lord and His judgments. Why the LORD answers with questions and gives no reason for Job's suffering is taken up at [[Job 38:1]].

  Verses 7–17 return to prose, like the prologue of chapters 1–2. In this brief epilogue the LORD rebukes the three friends and sends them to Job with an offering, Job prays for them, and the LORD gives him double the possessions he lost, the same number of children as before, and a long and full life. Elihu, who spoke last before the LORD ([[Job 32:2]]), is not mentioned. What the friends assumed about suffering, and why the reader knows it was false, is set out once at [[Job 4:7]]; here the LORD gives His own verdict on it.

thread: |
  Job's answer is a confession that the LORD's questions have done their work. He grants that God can do everything and that no purpose of His can be stopped (verse 2). Then twice he takes up the LORD's own words and answers them: he is the one who hid counsel without knowledge and spoke of things too wonderful for him (verses 3–4). What has changed him is what he has seen: he had heard of God, and now he sees Him (verse 5). So he repents in dust and ashes (verse 6).

  The prose turns at verse 7, and the verdict is not the one the friends expected. The LORD's wrath is against the three of them, for they have not spoken of Him what is right, as His servant Job has. The man they accused becomes their intercessor: they bring an offering, Job prays, and the LORD accepts him (verses 7–9). The restoration follows the prayer. The LORD turns Job's captivity and gives him double; the brothers and sisters who had kept their distance ([[Job 19:13]]) come to eat with him and comfort him; his flocks and herds are twice what they were, and he has seven sons and three daughters again, the daughters named and given an inheritance. He lives to see four generations and dies “old and full of days” (verses 10–17).

sections:
  - range: 1-6
    heading: Now mine eye seeth thee
    plain: |
      Then Job answered the LORD: I know that You can do everything, and that no purpose of Yours can be stopped. You asked, “Who is this that hides counsel without knowledge?” I am the one. I spoke of what I did not understand, things too wonderful for me, which I did not know. You said, “Hear, and I will speak; I will question you, and you will answer Me.” I had heard of You with my ears, but now my eye sees You. Therefore I abhor myself, and I repent in dust and ashes.
  - range: 7-9
    heading: My servant Job shall pray for you
    plain: |
      After the LORD had spoken these words to Job, He said to Eliphaz the Temanite: My anger burns against you and against your two friends, because you have not spoken of Me what is right, as My servant Job has. So now take seven bulls and seven rams, go to My servant Job, and offer a burnt offering for yourselves. My servant Job will pray for you, and I will accept his prayer, so that I do not deal with you as your folly deserves, because you have not spoken of Me what is right, as My servant Job has. So Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite went and did as the LORD had told them, and the LORD accepted Job.
  - range: 10-17
    heading: The latter end of Job
    plain: |
      The LORD restored Job's fortunes when he prayed for his friends, and the LORD gave Job twice as much as he had before. Then all his brothers and sisters and everyone who had known him before came and ate bread with him in his house. They grieved with him and comforted him over all the trouble the LORD had brought on him, and each of them gave him a piece of money and a gold earring. The LORD blessed the last part of Job's life more than the first: he had fourteen thousand sheep, six thousand camels, a thousand yoke of oxen, and a thousand donkeys. He also had seven sons and three daughters. He named the first Jemima, the second Kezia, and the third Keren-happuch. In all the land there were no women as beautiful as Job's daughters, and their father gave them an inheritance along with their brothers. After this Job lived a hundred and forty years and saw his children and his children's children, four generations. So Job died, old and full of days.

notes:
  - ref: 3
    phrase: Who is he that hideth counsel without knowledge?
    kind: scripture
    title: Job answers in the LORD's own words
    body: |
      Job's question in verse 3 is the LORD's question, and Job answers it against himself. The LORD had opened His first speech, “Who is this that darkeneth counsel by words without knowledge?” ([[Job 38:2]]). Job repeats it nearly word for word and gives the answer: he is the one, for he has spoken of what he did not understand, things too wonderful for him. Verse 4 does the same with the LORD's challenge, “I will demand of thee, and answer thou me” ([[Job 38:3]]; [[Job 40:7]]). A modern translation sets both lines in quotation marks as the LORD's words repeated. In this way Job retracts the “words without knowledge” that his friends' arguments had wrung from him.

      One Latter-day Saint reading finds more in the repetition. After forty-one chapters in which Job and his friends never came to agreement, Job takes up the words of the Lord and makes them his own, “coming to confessional unity with the Lord.”
    sources: [lds-scriptures, nrsvue, bd-job-book, stirling-job]
  - ref: 5
    phrase: but now mine eye seeth thee
    kind: history
    title: Heard of, and now seen
    body: |
      Verse 5 is where Job's long appeal is answered: his craving for light “is satisfied by the vision of God, at length vouchsafed in answer to his appeals.” Through the dialogue he had asked to come before God and hear what He would say ([[Job 23:3–5]]; [[Job 31:35]]). Now he sets what he knew of God by report, “by the hearing of the ear,” beside what he has seen.

      The text does not say what the seeing was. In one Latter-day Saint reading, “in some way inexplicable to us” Job had come to understand more about the Lord through a “seeing” experience than when he had only heard of Him; afterward he accepted all that had happened to him without further questioning. Another Latter-day Saint reading takes the verse as Job's acknowledgment that he has come into God's presence, the end of a search for God's face that began soon after his calamities, a search his friends never made.
    sources: [bd-job-book, ot-manual-job, stirling-job]
  - ref: 6
    phrase: I abhor myself, and repent in dust and ashes
    kind: words
    title: What Job repented of
    body: |
      Both verbs in Job's last sentence are open, and neither says that Job hated himself; rather, he “humbly acknowledged his weaknesses, sins, and limitations before the Lord.” The first verb, *ʾemʾas*, “I reject” or “I despise,” has no object in the Hebrew: the King James supplies “myself,” and this is one of several places in Job where the verb stands without one. The second, *wĕniḥamtî*, means “be sorry, rue, suffer grief, repent, of one's own doings,” its sense in this verse; in another sense the same verb means “comfort oneself, be comforted.” “Dust and ashes” takes up Job's complaint that God had made him like dust and ashes ([[Job 30:19]]), where the phrase is discussed.

      Two apostles name what Job repented of, each in his own terms. Elder Dale G. Renlund, who taught that Job “also believed that only sin caused suffering,” says that he “repented of attributing his suffering to sin” and recognized that not all suffering is divine punishment. President Henry B. Eyring: “after Job repented of calling God unfair, Job was permitted to see his trials in a higher and holier way.” One Latter-day Saint reading departs from most translations and has Job “changing his mind concerning dust and ashes,” that is, concerning mankind, for whom he has learned God's “infinite concern and love.”
    sources: [seminary-ot-teacher-109, oshb-wlc, scripture-helps-job, bdb, stirling-job, renlund-trust-god, eyring-holiness-plan]
  - ref: 7
    phrase: ye have not spoken of me the thing that is right, as my servant Job hath
    kind: history
    title: The thing that is right
    body: |
      The LORD's verdict falls on the friends, not on Job: His wrath is against the three friends, and Job, whom they accused, is “my servant” who has spoken of Him rightly. What Job got right was this: he spoke “the thing that is right concerning the divine government… in saying that there is a mystery in the incidence of suffering that only a fresh revelation can solve.” The friends had explained his suffering as a sign of God's anger and a punishment for sin, and the Lord called them to repentance “for their false ideas about His justice” (see [[Job 4:7]]).

      The verdict does not approve every word Job said. The LORD had asked who darkened counsel “by words without knowledge” ([[Job 38:2]]), and Job has just taken those words back (verse 3). One Latter-day Saint reading holds the two together: “one can say something that is formally wrong but personally right (as did Job), and something formally correct but personally wrong (as did the comforters).” For that reading, the speaker's relationship to his words matters as much as the words. Another calls the LORD's words “determinative for interpreting the book”: God rejects the friends' strict retribution, and His approval applies most to Job's great revelatory insights, not to his early charges against God's justice.
    sources: [bd-job-book, scripture-helps-job, tanner-considered-job, stirling-job]
  - ref: 8
    phrase: my servant Job shall pray for you
    kind: history
    title: Job prays for his accusers
    body: |
      The LORD sends the friends to the man they accused. They are to bring seven bullocks and seven rams as a burnt offering for themselves, as Job had once offered for his children ([[Job 1:5]]); then Job is to pray for them, “for him will I accept,” as Abimelech was sent to Abraham because “he is a prophet, and he shall pray for thee” ([[Gen. 20:7]]). The Greek translation says outright what the acceptance meant for the friends: the Lord “pardoned their sin for the sake of Job.”

      In one Latter-day Saint reading Job here acts in “a priestly intercessory role,” setting right the friends' standing with God, and the LORD warns them in the language of retribution they understood, that folly would be done to them for their folly, in order “to lead the friends from retribution to grace.” The same reading sees an irony here: Eliphaz had probably expected to be the one interceding for Job ([[Job 22:27–30]]).

      The theme page [A Daysman Betwixt Us](/job/themes/daysman-betwixt-us/) reads this verse as the book's answer to “neither is there any daysman” (9:33): Job, accepted by the LORD, becomes a likeness of the mediator he asked for.
    sources: [lds-scriptures, lxx-rahlfs, stirling-job]
  - ref: 10
    phrase: when he prayed for his friends
    kind: scripture
    title: Restored when he prayed for his friends
    body: |
      The restoration is tied to the prayer: the LORD turned Job's captivity “when he prayed for his friends.” The phrase is an idiom for restoring an individual's fortunes, as the same words restore Israel's at [[Deut. 30:3]]; it does not mean Job had been a prisoner. The Greek translation makes the forgiveness plain: “when he prayed also for his friends, he forgave them their sin.” In one Latter-day Saint reading, Job chooses at the end to trust God again though he has no answers, and “to forgive his friends even before they apologize.”

      The theme page [A Daysman Betwixt Us](/job/themes/daysman-betwixt-us/) argues that the one who was pleaded for is sent to plead, and that the book dates Job's restoration to that prayer.
    sources: [bdb, lxx-rahlfs, ot-minute-job-overview]
  - ref: 13
    phrase: He had also seven sons and three daughters.
    kind: history
    title: The same number of children
    body: |
      Everything Job owned is doubled except his children. He had seven thousand sheep, three thousand camels, five hundred yoke of oxen and five hundred she asses ([[Job 1:3]]); now he has fourteen thousand, six thousand, a thousand and a thousand. He had seven sons and three daughters ([[Job 1:2]]), and he has seven sons and three daughters again. In one older reading the same number of children is also a doubling, “as deceased children also, according to the Old Testament view, are not absolutely lost,” as David said of his dead son, “I shall go to him” ([[2 Sam. 12:23]]). On that reading the first children are not replaced but still counted as his.

      Two Latter-day Saint readings see more in the double. One sets it beside the law's demand that a thief repay double ([[Ex. 22:4]]), as if God were “accepting overall responsibility for Job's suffering.” The other recalls that the firstborn son received a double portion of his father's inheritance ([[Deut. 21:15–17]]), so that Job's double portion points to Christ, the Firstborn.
    sources: [ot-manual-job, delitzsch-job, stirling-job, parry-job-type]
  - ref: 15
    phrase: their father gave them inheritance among their brethren
    kind: history
    title: Daughters named, and given an inheritance
    body: |
      The sons go unnamed; the daughters are named, and given a share with their brothers. Their names are names of beauty. Jemima may mean “dove”; Kezia is cassia, named “from fragrance”; Keren-happuch is “horn of antimony, i.e. beautifier.” And no women in all the land were as fair.

      Their inheritance is the more striking. Under the law of Moses a daughter inherited when a man had no son ([[Num. 27:8]]); Job's daughters inherit alongside seven brothers. One Latter-day Saint reading calls it “a gentle subversion of the law.”
    sources: [bdb, lds-scriptures, stirling-job]
  - ref: 17
    phrase: So Job died, being old and full of days.
    kind: history
    title: The Greek ending
    body: |
      The Hebrew book ends with Job's death, “old and full of days.” The Greek translation goes on. It says that “it is written that he will rise again with those whom the Lord raises up,” and it adds, from what it calls “the Syriac book,” that Job lived in the land of Ausis on the borders of Idumea and Arabia, that “his name before was Jobab,” and that, descended from Esau, he was “the fifth from Abraam” and a king in Edom. It also gives him a hundred and seventy years after his affliction and two hundred and forty in all, where the Hebrew has a hundred and forty after it ([[Job 42:16]]). None of these additions is in the Hebrew text the King James translates. What the Church's sources say of who Job was is at [[Job 1:1]].
    sources: [lxx-rahlfs, oshb-wlc]

christ: |
  The book ends with a man who has seen the LORD praying for the friends who had accused him, and the LORD accepting them for his sake. One Latter-day Saint reading sees the Savior in that prayer: Job prayed for friends who had “symbolically crucified him with words,” and Jesus prayed for those who crucified Him, “Father, forgive them; for they know not what they do” ([[Luke 23:34]]). Righteousness does not shield anyone from suffering, and the supreme proof of it is Christ, who suffered more than any man, as the Lord reminded Joseph Smith in Liberty Jail: “The Son of Man hath descended below them all. Art thou greater than he?” ([[D&C 122:8]]).

  The Lord wants His disciples to pray for those who misjudge them, as He sent Job's accusers to Job's prayers. Adversity met with repentance can increase a disciple in holiness, as it did Job, whom it qualified, President Eyring taught, “to have greater happiness in the days he had yet to live.”

explore: |
  - **Seeing God.** [[Moses 1:8–10]], which *Come, Follow Me* sets beside Job's answer; and Job's earlier hope, [[Job 19:26–27]].
  - **The friends' charge and the verdict.** [[Job 4:7]] and [[D&C 121:10]].
  - **Praying for one's accusers.** [[Gen. 20:7]]; [[Matt. 5:44]]; [[Luke 23:34]].
  - **A temple reading of the book.** “Job: An LDS Reading” (*Interpreter* 45, 2021), summarized in Scripture Central's KnoWhy #640, is one author's reading of Job's journey as a temple ascent that ends in the presence of the Lord (verse 5).

