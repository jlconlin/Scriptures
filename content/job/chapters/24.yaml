chapter: 24
title: Why Do They That Know Him Not See His Days?
tagline: Job finishes his answer to Eliphaz by looking away from his own trouble to the poor of the earth, stripped, hungry and crying out, while those who wrong them go on unpunished.
when: 'The third round: Job answers Eliphaz'

setting: |
  Chapter 24 is the second half of Job's answer to Eliphaz's third speech ([[Job 22]]). Eliphaz had charged Job with specific crimes against the poor: taking pledges from his brother for nothing, stripping the naked, sending widows away empty, breaking the arms of the fatherless ([[Job 22:5–9]]). Why the friends' reasoning fails Job is taken up once, at [[Job 4:7]].

  Job does not answer him point by point. In chapter 23 he turns from the friends to God, wishing he knew where to find Him so that he could plead his case before His seat ([[Job 23:3–7]]). In chapter 24 he turns to the other side of the same mystery: not his own undeserved suffering but the wrongdoers who prosper and go unpunished.

  This is the last full speech of the third round. Bildad's reply in chapter 25 is only six verses, and Zophar does not speak again; why the round seems to break off is taken up in the setting of [[Job 25]]. That Job has already said the wicked prosper is at [[Job 21:7]], where the question is treated.

thread: |
  Job's claim is that God keeps no visible times of judgment. He opens with the question that governs the chapter: if nothing is hidden from the Almighty, why do those who know Him never see Him set a day of reckoning (verse 1)?

  His evidence is a picture of the poor of the earth, and it fills the first half. Some men move boundary stones and drive off the orphan's donkey and the widow's ox; the needy are pushed off the road and hide in the wilderness, scavenging like wild asses, sleeping naked in the mountain rain, harvesting and pressing oil for others while they go hungry and thirsty. From the city the dying groan, and God takes no notice (verses 2–12).

  Then he names a second kind of wrongdoer: the murderer, the adulterer and the burglar, who hate the light and work in the dark (verses 13–17). The last verses describe the end of such men, and they have puzzled commentators, because they sound like the friends' doctrine that the wicked are swept away (verses 18–24). The chapter ends on a challenge: if it is not so, who will prove me a liar (verse 25)?

sections:
  - range: 1-12
    heading: The cry of the poor
    plain: |
      Since nothing is hidden from the Almighty, why does He not set times for judgment? Why do those who know Him never see His days of reckoning? Some men move the boundary stones; they seize flocks and pasture them as their own. They drive off the orphan's donkey and take the widow's ox as a pledge. They push the needy off the road, and the poor of the land all hide together. Like wild donkeys in the desert, the poor go out to their work, searching early for food; the wilderness is all that feeds them and their children. They gather fodder in fields not their own and glean the vineyard of the wicked. They spend the night naked, with no covering in the cold. They are soaked by the mountain rains and cling to the rock for want of shelter. Others snatch the orphan from the breast and take a pledge from the poor. The poor go about naked, without clothing; though hungry, they carry the sheaves. They press out oil within their masters' walls and tread the winepresses, yet they are thirsty. From the city the dying groan, and the wounded cry out for help, yet God takes no notice of the wrong.
  - range: 13-17
    heading: Enemies of the light
    plain: |
      There are others who rebel against the light; they do not know its ways or stay in its paths. The murderer gets up at first light to kill the poor and needy, and at night he acts like a thief. The adulterer waits for the dusk, thinking, “No one will see me,” and he covers his face. In the dark they break into houses that they marked out by day; they have nothing to do with the light. For all of them, deep darkness is their morning; they are at home with the terrors of the night.
  - range: 18-25
    heading: Who will make me a liar?
    plain: |
      Such a man is carried off quickly, like something on the face of the waters; his share of the land is cursed, and no one goes out to work his vineyards. As drought and heat swallow up the melted snow, so the grave swallows those who have sinned. His mother forgets him; the worm feeds sweetly on him; he is remembered no more, and wickedness is broken like a tree. He wronged the childless woman and did no good to the widow. Yet God by His power keeps the mighty alive; they rise up again when they had despaired of life. He lets them rest in safety, and His eyes are on their ways. They are lifted up for a little while, and then they are gone; they are brought low and gathered in like everyone else, cut off like the heads of grain. If it is not so, who can prove me a liar and show that my words are worth nothing?

notes:
  - ref: 1
    phrase: seeing times are not hidden from the Almighty
    kind: words
    title: Why does God keep no times?
    body: |
      Job's opening question asks why God sets no times for judgment that people can see. The King James wording is hard to follow; a modern translation gives the sense: “Why are times not kept by the Almighty, and why do those who know him never see his days?” The verb is the one for storing something up, and elsewhere in Job it is used of God storing up punishment for the wicked ([[Job 21:19]]). In one older reading, “times” here are the appointed times of retribution and “his days” are God's days of judgment, the days when His judgment is revealed; “those who know him” are not acquaintances but those who have lived in fellowship with Him.

      So the question is not whether God sees, but why the faithful never see Him act. The friends had said that God's punishment of the wicked is plain for all to see; Job looks at the world and cannot find it. In one Latter-day Saint reading, Job here stands with Habakkuk, impatient for God to bring justice and put things right: “wherefore lookest thou upon them that deal treacherously, and holdest thy tongue when the wicked devoureth the man that is more righteous than he?” ([[Hab. 1:13]]).
    sources: [nrsvue, delitzsch-job, stirling-job]
  - ref: 3
    phrase: they take the widow’s ox for a pledge
    kind: history
    title: The widow's ox and the orphan's donkey
    body: |
      The first wrongs Job lists are wrongs the law of Moses guarded against, done to people who had no one to defend them. Moving a boundary stone was stealing a family's land, and the law forbade and cursed it ([[Deut. 19:14]]; [[Deut. 27:17]]). Taking a pledge was lawful, but the law limited it to protect the poor: no one was to take a millstone in pledge, “for he taketh a man's life to pledge” ([[Deut. 24:6]]), nor “take a widow's raiment to pledge” ([[Deut. 24:17]]). The law's reason is the one Job's list turns on: to take what a poor household works with is to take its living.

      The list has a sharp edge. Eliphaz had accused Job of exactly this: “thou hast taken a pledge from thy brother for nought, and stripped the naked of their clothing” ([[Job 22:6]]). Job answers by describing men who really do it, and asking why God lets them be. In one Latter-day Saint reading, Job had always cared for the poor and the oppressed (his own account is at [[Job 31:13–23]]), but his suffering has deepened his empathy, so that he now feels their suffering in a new way.
    sources: [lds-scriptures, nrsvue, stirling-job]
  - ref: 10
    phrase: they take away the sheaf from the hungry
    kind: history
    title: Hungry among the sheaves
    body: |
      Verses 10–11 describe laborers who harvest food and drink they are not allowed to eat. The King James reads verse 10 as the oppressors taking the sheaf away from the hungry, but the Hebrew says, more simply, that the hungry carry the sheaf; a modern translation has “though hungry, they carry the sheaves,” and the next verse goes on in the same vein: they “tread the winepresses but suffer thirst.”

      One older reading takes these as poor men reduced to serfdom on someone else's estate, pressing out oil within their masters' walls under close watch and not permitted to quench their thirst from the juice running from the press. It calls this the sin of withheld wages, “which cries aloud to heaven,” and notes that their masters deny them what the law would not withhold even from an ox: “Thou shalt not muzzle the ox when he treadeth out the corn” ([[Deut. 25:4]]). That cry is what verse 12 hears rising from the city.
    sources: [oshb-wlc, nrsvue, delitzsch-job]
  - ref: 12
    phrase: yet God layeth not folly to them
    kind: words
    title: God takes no notice
    body: |
      Verse 12 is the sharpest line in Job's case: the dying groan and the wounded cry out, “yet God layeth not folly to them,” that is, He does not treat what is done to them as wrong. The word rendered “folly” (*tiplāh*) means something insipid or absurd; in one older reading it is here the immorality that sets the moral order of the world at nought, and Job's complaint is that God does not punish it.

      The Church's footnote gives another rendering, “does not give heed to their prayer.” The Syriac translation already read the same consonants as *tĕpillāh*, “prayer,” and a modern translation follows it: “yet God pays no attention to their prayer.” Either way the line says the same hard thing from two sides: God does not count the wrong, and He does not answer the cry. It is Job's charge, not the book's verdict: the conclusion he draws after listing many wrongs that seem to go unpunished.
    sources: [oshb-wlc, delitzsch-job, lds-scriptures, nrsvue, ot-minute-job-4]
  - ref: 13
    phrase: They are of those that rebel against the light
    kind: symbol
    title: Enemies of the light
    body: |
      The murderer, the adulterer and the burglar of verses 14–16 are grouped by one trait: they hate the light because it would expose them. The adulterer says, “No eye shall see me,” and covers his face (verse 15); thieves break into houses in the dark and keep away from the day (verse 16). Verse 17 turns the ordinary day upside down; a modern translation has it, “For deep darkness is morning to all of them; for they are friends with the terrors of deep darkness.” Morning is what they fear, and night is where they are at home.

      The Church's footnote to “rebel” sends the reader to latter-day revelation, which gives the reason such men shun the light: those who fight the Lord's work “love darkness rather than light, because their deeds are evil; therefore they will not ask of me” ([[D&C 10:21]]). Their hatred of the light is a hatred of being seen. In Job's argument they belong to the same evidence as the oppressors of verses 2–12: the wicked thrive at others' expense, whatever the friends say.
    sources: [nrsvue, lds-scriptures, stirling-job]
  - ref: 18
    phrase: He is swift as the waters
    kind: history
    title: How the wicked end
    body: |
      Verses 18–24 describe the death of the wicked, and they have long puzzled readers because at first they sound like the friends' doctrine in Job's mouth: the grave takes sinners as “drought and heat consume the snow waters” (verse 19), and they “are exalted for a little while” and then cut off (verse 24). Some scholars think the third round was damaged in copying and that some of Job's last lines belong to a friend; this site reads the text as it stands, and why the round looks broken is taken up at [[Job 25]].

      Read as it stands, the passage can be taken in two ways that keep Job consistent. In one Latter-day Saint reading, Job's complaint is that judgment comes so late: the wicked do meet their end, but only after the wrong is long done and the innocent have long suffered. In one older reading, the verses are Job's own view throughout and describe not a fearful punishment but an easy death: God preserves the oppressors long, and at the end of a full life they die as a ripe ear of corn is cut off (verse 24). A modern translation reads verse 22 the same way: “Yet God prolongs the life of the mighty by his power.” On that reading the wicked die like everyone else (verse 24), late and without pain, which proves nothing for the friends' doctrine. Either way, Job ends by daring anyone to prove him a liar (verse 25).
    sources: [ot-minute-job-4, delitzsch-job, nrsvue]

christ: |
  Job asks why the Almighty keeps no days of judgment that the righteous can see, and why the cry of the hungry and the naked seems to go unheard. In the Savior's account of the Judgment that day comes, and the King counts what was done to the hungry, the naked and the stranger as done to Himself: “Inasmuch as ye have done it unto one of the least of these my brethren, ye have done it unto me” ([[Matt. 25:40]]). King Benjamin makes the same care the condition of “retaining a remission of your sins from day to day”: “feeding the hungry, clothing the naked, visiting the sick and administering to their relief” ([[Mosiah 4:26]]). A disciple's own relationship with God rests on that care for others, and suffering, as it did for Job, can open the eyes to the poor who were there all along.

