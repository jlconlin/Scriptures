chapter: 32
title: There Is a Spirit in Man
tagline: The three friends fall silent, and a younger man, Elihu, angry with Job and with them, explains why he will speak at last.
when: 'Elihu''s first speech'

setting: |
  Chapter 32 brings a new speaker into the book. Job's last defense closed with “The words of Job are ended” ([[Job 31:40]]), and the three friends, who had answered him through three rounds of debate, fall silent. A short prose introduction (verses 1–5) presents Elihu, a younger man who has listened to the whole exchange, and says why he is angry; then he begins the first of his speeches. They run through chapter 37, a section of the book given to him alone, and Job makes no reply to any of them.

  Elihu appears nowhere else in Job. He is not in the opening story among the friends who came to mourn ([[Job 2:11]]), and he is not in the ending, where the LORD rebukes Eliphaz “and against thy two friends” ([[Job 42:7]]). Who he is, and how to weigh what he says, is taken up once for all six chapters in the note at verse 2.

  This chapter is his preface. Before he says a word about Job's case, he explains why a young man may speak after his elders have failed, and he rests it on one claim, that “the inspiration of the Almighty giveth them understanding” (verse 8). His argument against Job begins in chapter 33.

thread: |
  Elihu's claim is that he may speak, young as he is, because understanding comes from the spirit God gives and not from length of years, and because the friends, for all their years, have failed. The prose introduction (verses 1–5) gives the occasion: the three have stopped, and Elihu is angry with Job for justifying himself rather than God, and with the friends for condemning Job without answering him.

  His speech opens with an apology for speaking at all (verses 6–10). He had deferred to age, but it is the breath of the Almighty, not the number of a man's years, that makes him understand. He then turns the apology into a charge (verses 11–14): he listened closely, and none of them answered Job; they may not excuse themselves by saying that only God can put down such a man. He will take a different course from theirs. From verse 15 he speaks of the friends rather than to them, and the chapter ends with his picture of himself, full of words and ready to burst, promising to answer without partiality or flattery (verses 15–22). He has promised much and not yet begun; his case comes in chapter 33.

sections:
  - range: 1-5
    heading: Then was kindled the wrath of Elihu
    plain: |
      So these three men stopped answering Job, because he was righteous in his own eyes. Then Elihu son of Barachel the Buzite, of the family of Ram, became angry. He was angry with Job because Job justified himself rather than God. He was angry with Job's three friends too, because they had found no answer, and yet had declared Job in the wrong. Elihu had waited to speak to Job because the others were older than he. When he saw that the three men had no answer left, his anger burned.
  - range: 6-10
    heading: I am young, and ye are very old
    plain: |
      Elihu son of Barachel the Buzite spoke: I am young and you are old, so I held back and was afraid to tell you what I think. I said, Let age speak, and let many years teach wisdom. But it is the spirit in a person, the breath of the Almighty, that gives understanding. It is not the old who are always wise, nor the aged who understand what is right. So I say, Listen to me; I too will tell you what I think.
  - range: 11-14
    heading: None of you that convinced Job
    plain: |
      I waited for your words and listened to your reasoning while you searched for what to say. I paid close attention, and not one of you refuted Job or answered what he said. So do not say, “We have found wisdom: God can put him down, not man.” Job has not aimed his arguments at me, and I will not answer him with your speeches.
  - range: 15-22
    heading: I am full of matter
    plain: |
      They are dismayed and answer no more; they have nothing left to say. I waited, but they did not speak; they stand there and answer no more. So I will give my answer too and tell what I think. For I am full of words, and the spirit within me presses me. Inside I am like wine sealed up with no vent, like new wineskins ready to burst. I must speak to find relief; I will open my lips and answer. I will not take any man's side or flatter anyone. I do not know how to flatter; if I did, my Maker would soon take me away.

notes:
  - ref: 2
    phrase: Elihu the son of Barachel the Buzite, of the kindred of Ram
    kind: history
    title: Elihu, son of Barachel
    body: |
      Elihu is the one speaker in the debate whom the book introduces with a full pedigree, and the Church's sources call him a fourth friend who condemns Job on grounds of his own. The three friends are named by their homes alone ([[Job 2:11]]); Elihu is given a father, Barachel, a people, the Buzites, and a family, Ram. His own name means “God is He.”

      What Elihu does, the Church's reference works say plainly. He “reproves Job's three friends and reasons with Job”; he condemns Job, “though on different grounds from the ‘three friends’”; and his main thesis is that God will “not pervert judgment” (as he says at [[Job 34:12]]). Job makes no reply to him. Neither does the LORD: when He speaks His verdict in [[Job 42:7]], He rebukes Eliphaz “and against thy two friends,” and Elihu is not mentioned. Because he enters late and no one answers him, most commentators, as one Latter-day Saint scholar reports, see his speeches as a later addition, a scribe's attempt to give Job a proper answer from a human companion; the same scholar's own judgment is that Elihu stands under the same divine disapproval as the other comforters. The editors of the Joseph Smith Papers, explaining the Lord's words in Liberty Jail, “thy friends do not contend against thee, neither charge thee with transgression, as they did Job” ([[D&C 121:10]]), point the reader to the friends' speeches and list Elihu's chapters, 32–37, among them.

      In one Latter-day Saint reading, Elihu's teachings hold real wisdom when they are applied generally rather than to Job's case, and his error is the one he shared with the friends: assuming that those who suffer are the wicked. So in these chapters what he gets right is given as his, and where he repeats the friends' charge, the answer to it is at [[Job 4:7]].
    sources: [bd-elihu, bd-job-book, gs-job, lds-scriptures, tanner-considered-job, jsp-letter-1839-03-20, ot-minute-job-36]
  - ref: 2
    phrase: because he justified himself rather than God
    kind: history
    title: Why Elihu is angry
    body: |
      Elihu is angry with both sides of the debate, and the narrator gives a different reason for each. With Job, it is that he “justified himself rather than God.” In one older reading the fault Elihu finds is not that Job thinks himself free of sin, which the friends had insinuated, but that in declaring himself righteous he makes God look unjust. The LORD will put the same question to Job: “wilt thou condemn me, that thou mayest be righteous?” ([[Job 40:8]]). With the friends, it is that “they had found no answer, and yet had condemned Job”: unable to refute him, they fell back on condemning him. The Church's seminary manual sums up Elihu's view: the friends had not been firm enough with Job and had failed to answer his questions.

      Verse 3 carries an old scribal tradition that a reader of a modern Bible will meet in its margin, “had put God in the wrong.” Jewish tradition counts the clause in which the friends condemned Job among eighteen scribal corrections (*tiqqûnê sôpĕrîm*), places where the scribes are said to have changed the wording, and holds that the line once said the friends condemned God. The same older reading sets the tradition aside: in this chapter the one Elihu accuses of putting God in the wrong is Job, not the friends.
    sources: [delitzsch-job, nrsvue, seminary-ot-teacher-108]
  - ref: 8
    phrase: 'there is a spirit in man: and the inspiration of the Almighty giveth them understanding'
    kind: words
    title: Not age but the breath of the Almighty
    body: |
      Elihu's warrant for speaking is that understanding is a gift of God, not a product of years. He had told himself that “days should speak” (verse 7), but what gives understanding is the “inspiration” of the Almighty, in Hebrew *nišmat šadday*, the breath of the Almighty, as a modern translation renders it. The same translation renders his next line, “Great men are not always wise,” as “It is not the old who are wise.”

      The question the chapter leaves is whether Elihu has what he claims. A Latter-day Saint scholar faults the friends' counsel because it rested on human reason about suffering, not on revelation about Job's case, and judges that Elihu, for all his claim, does no better: his answer “remains ‘mere argument;’ the Lord's is a revelation.”
    sources: [oshb-wlc, nrsvue, tanner-considered-job]
  - ref: 19
    phrase: my belly is as wine which hath no vent
    kind: symbol
    title: Wine with no vent
    body: |
      Elihu pictures his unspoken words as wine sealed in a skin with no vent, ready to burst. He is “full of matter,” as a modern translation has it “full of words,” and he must speak to find relief (verse 20). What presses him, he says, is “the spirit within me” (verse 18), the same Hebrew word, *rûaḥ*, as the “spirit in man” he appealed to in verse 8.

      The confidence does not fade. By his last speech he will tell Job that “he that is perfect in knowledge is with thee” ([[Job 36:4]]). One Latter-day Saint essay grants that some of Elihu's arguments are good, above all that God speaks to people through suffering, and still judges that he missed the point: “Though he claimed to be inspired, he was not inspired by charity.”
    sources: [nrsvue, oshb-wlc, ot-minute-job-36, cornwall-old-dead-book]

christ: |
  Elihu claims the inspiration of the Almighty, yet Job makes no reply to him; Job's longing for light is satisfied by the vision of God, granted at last in answer to his appeals. The One who answers Job out of the whirlwind is the LORD, Jehovah, who is the premortal Jesus Christ.

  The book is, in one Latter-day Saint reading, about the need for personal revelation, the key to the crises of faith that suffering brings. A disciple's understanding of a trial comes as Elihu said it does, from the Almighty: from Him, and not from the confidence of a counselor.

