chapter: 8
title: Doth God Pervert Judgment?
tagline: Bildad, the second friend, asks whether God perverts justice, says Job’s children died for their own sins, sends Job to the wisdom of the fathers, and promises that God will not cast away a perfect man.
when: 'The first round: Bildad'

setting: |
  Job has answered Eliphaz (chapters 6–7), and now the second friend speaks. Bildad the Shuhite (on the three friends and their homes, see [[Job 2:11]]) is less encouraging than Eliphaz and more frustrated with Job’s stubbornness. He will speak twice more, in chapters 18 and 25.

  Bildad adds one thing Eliphaz did not say. Eliphaz argued in general that the innocent do not perish ([[Job 4:7]], where the friends’ reasoning and the LORD’s verdict on it are set out); Bildad applies the rule to Job’s dead children (verse 4). His speech comes down to two claims: God, who is just, does not punish the innocent, and Job should admit that he has sinned.

  Chapter 8 is one of the speeches that charged Job with transgression, the charge the Lord recalled to Joseph Smith in Liberty Jail ([[D&C 121:10]]; see the note on [[Job 4:7]]). The same letter takes up a line of this speech (see the note at verse 14).

thread: |
  Bildad’s speech runs from a principle to a promise, and its center is the wisdom of the past.

  He opens with impatience: Job’s words are “a strong wind” (verse 2), empty and blustering at once. Then he states the premise on which everything rests: God does not pervert judgment (verse 3). Three conditions follow from it. If Job’s children sinned, God gave them over to their sin (verse 4); if Job will seek God (verse 5); if he is pure and upright (verse 6), God will restore him, and his small beginning will grow into a great end (verse 7).

  At verse 8 Bildad gives his authority. He appeals to the generations before him, since men who are “but of yesterday” cannot judge the ways of God (verses 8–10). The sayings of the ancients follow in three pictures of the man who forgets God: a papyrus that withers when the marsh dries (verses 11–13), a spider’s web that gives way when he leans on it (verses 14–15), and a spreading plant torn up so completely that its place denies it ever grew there (verses 16–19).

  In verses 20–22 the pictures stop, and Bildad returns to Job with a promise that sounds like the Psalms: God will not cast away a perfect man, and He will fill Job’s mouth with laughing. Bildad calls the wicked “they that hate thee,” hoping for the best of Job even while his “if” leaves the question open.

sections:
  - range: 1-7
    heading: Does God pervert justice?
    plain: |
      Then Bildad the Shuhite answered: “How long will you go on talking like this? How long will your words be a blustering wind? Does God twist judgment? Does the Almighty bend what is right? If your children sinned against Him, He handed them over to the power of their own transgression. If you would seek God early and plead with the Almighty, if you were pure and upright, surely He would rouse Himself for you now and make your righteous home prosper. Though your beginning was small, your end would grow very great.
  - range: 8-10
    heading: Ask the generations before us
    plain: |
      “Ask the generations that came before, and set yourself to learn what their fathers searched out. We were born only yesterday and know nothing; our days on earth are a shadow. Won’t they teach you and tell you, and speak words from their hearts?
  - range: 11-19
    heading: The papyrus and the spider’s web
    plain: |
      “Can papyrus grow tall where there is no marsh? Can reeds thrive without water? While it is still green and uncut, it withers before any other plant. So go the paths of all who forget God; the hope of the godless will perish. His hope is cut off, and his trust is a spider’s web. He leans on his house, and it will not stand; he holds it fast, and it will not last. He is green in the sun, and his shoots spread through his garden. His roots wrap around the heap of stones and reach in among them. But if he is torn from his place, the place disowns him: ‘I never saw you.’ That is all the joy his way comes to, and others will spring up out of the ground.
  - range: 20-22
    heading: God will not cast away a perfect man
    plain: |
      “See, God will not reject a blameless man, and He will not help evildoers. He will yet fill your mouth with laughter and your lips with shouts of joy. Those who hate you will be clothed with shame, and the home of the wicked will come to nothing.”

notes:
  - ref: 3
    phrase: Doth God pervert judgment?
    kind: scripture
    title: The right premise, the wrong conclusion
    body: |
      Bildad’s question expects the answer no, and as a statement about God the answer is right. The Church’s footnote sends the reader to Alma, who says that at the judgment the wicked will acknowledge “that all his judgments are just; that he is just in all his works” ([[Alma 12:15]]). Elihu, the last of Job’s human counselors, will make the same words, that God will “not pervert judgment,” his main thesis.

      The fault is in what Bildad does with the truth. He reasons backward from it: since God is just, what Job has suffered must be just, and so must have been earned. He will not allow that God would bring on Job anything Job did not deserve. He has turned “nothing God sends is unjust” into “everything God sends is deserved,” and the two are not the same: “It is true that nothing that God sends to man proceeds from injustice, but it is not true that everything that He sends to him comes from His justice.” Bildad’s premise is the one the friends share (see [[Job 4:7]]); what he builds on it comes in the next verse.
    sources: [lds-scriptures, bd-job-book, ot-minute-job-4, delitzsch-job]
  - ref: 4
    phrase: he have cast them away for their transgression
    kind: words
    title: Given over to their transgression
    body: |
      Bildad tells Job that his children died for their own sins. He puts it as a condition, “If thy children have sinned,” but the condition carries the verdict. In the Hebrew God *sent them into the hand of* their transgression, which a modern translation gives as “he delivered them into the power of their transgression”: the sin is pictured as a power, and God handed the children over to it. Bildad takes for granted that the children were punished, drawing the conclusion from his premise in verse 3, and holds out hope only for Job, who may still pray and be restored (verses 5–7).

      The reader knows the charge is false. Job himself had guarded against it: the book opened with him rising early to offer burnt offerings for each of his children in case they had sinned ([[Job 1:5]]; on the sacrifices see that verse).
    sources: [oshb-wlc, nrsvue, stirling-job, ot-minute-job-4]
  - ref: 8
    phrase: inquire, I pray thee, of the former age
    kind: history
    title: Ask the former age
    body: |
      Bildad rests his case on the wisdom of the past. “The former age” is “generations” in the Hebrew, and he tells Job to search out what the fathers of those generations learned, because “we are but of yesterday, and know nothing” (verse 9). The logic is that “our ephemeral and shadowy life is not sufficient for passing judgment on the dealings of God; we must call history and tradition to our aid.” The challenge recalls the counsel of Moses’ song, “ask thy father, and he will shew thee” ([[Deut. 32:7]]), and verses 11–19 are the sayings of the ancients that Bildad then recites.

      That is both the strength and the limit of his speech. The proverbs he passes on are true of the man who forgets God. But Bildad grounds his judgment of Job “on the traditions of men handed down over generations,” and applies to one man what the generations said of the godless in general.
    sources: [lds-scriptures, delitzsch-job, stirling-job]
  - ref: 11
    phrase: Can the rush grow up without mire?
    kind: symbol
    title: Papyrus without a marsh
    body: |
      Bildad’s first proverb is about the papyrus. The “rush” is papyrus and the “flag” is reeds: “Can papyrus grow where there is no marsh? Can reeds flourish where there is no water?” The plant shoots up green as long as the marsh holds water; when the water fails, it withers “before any other herb,” while still in its prime. “So are the paths of all that forget God” (verse 13): the godless thrive only while what feeds them lasts.

      The second plant, in verses 16–19, makes the same point another way. It is “green” (Hebrew “moist,” thriving) in the sun and wraps its roots around the stones, yet once it is torn out, the very place where it grew denies having seen it, and other plants spring up where it was. The Hebrew of verses 17 and 19 is uncertain, but the figure is clear: a thriving that looks rooted and vanishes without a trace.
    sources: [lds-scriptures, nrsvue]
  - ref: 14
    phrase: whose trust shall be a spider’s web
    kind: symbol
    title: A spider’s web
    body: |
      Bildad’s web, in one reading of the Hebrew wordplay, answers Job in Job’s own words. In the speech just ended, Job had said his days were “spent without hope” ([[Job 7:6]]), using *tiqwāh*, a word that means both “thread” and “hope” (the wordplay is explained at [[Job 7:6]]). Bildad uses the same word in verse 13, “the hypocrite’s hope shall perish” (the King James “hypocrite” is the godless man), and goes on: that man’s confidence is cut off, and his trust is a spider’s web, literally “a spider’s house.” The house of verse 15, which will not stand when he leans on it, is the web again. On this reading Bildad “has used both meanings of תִּקְוָה, and has turned the ‘weaver’s shuttle’ of 7:6 into a spider”: Job’s thread of hope becomes the flimsy thread of the godless.

      The line returns in Joseph Smith’s letter from Liberty Jail of March 1839. In the passage where the Lord tells him “thou art not yet as Job,” the words turn on “they who do charge thee with transgression” ([[D&C 121:11]]), whose hearts were “corrupt” and who “love to have others suffer”: “that they may be disappointed also and their hopes may be cut off.” Those words, now [[D&C 121:14]], echo this verse. Bildad aimed the proverb at a righteous sufferer; in the letter it is spoken of his accusers.
    sources: [lindsay-janus, oshb-wlc, nrsvue, jsp-letter-1839-03-20, lds-scriptures]
  - ref: 20
    phrase: God will not cast away a perfect man
    kind: scripture
    title: God will not cast away a perfect man
    body: |
      Bildad’s closing promise uses the word with which the book introduced Job. “Perfect” is *tām*, the word of [[Job 1:1]] (where it is explained) and of the LORD’s own description of Job ([[Job 1:8]]). The promise carries the condition of verse 6, “If thou wert pure and upright”: God will restore a perfect man, if Job is one.

      The irony is that his promise comes true, by a road he did not foresee. Bildad told Job, “thy latter end should greatly increase” (verse 7); at the end of the book “the LORD blessed the latter end of Job more than his beginning” ([[Job 42:12]]). The prediction came true, but not for the reasons Bildad thought: Job’s trials were not the result of his sins, and his restoration came after the LORD had said that the friends had not spoken of Him “the thing that is right” ([[Job 42:7]]). Job was the perfect man of Bildad’s proverb all along; Bildad’s mistake was to read his suffering as a sign that he was not.
    sources: [oshb-wlc, ot-minute-job-4, stirling-job]

christ: |
  Bildad reasoned from suffering back to sin: God does not cast away a perfect man, so a man in Job’s state cannot be one. The Savior “willingly took upon Himself the pain and sickness and suffering of us all—even those of us who appear to deserve our suffering.” For a disciple, then, it is unworthy to think that those who suffer deserve their suffering. Another person’s trouble, or a grieving parent’s loss, is not God’s verdict on them, and a disciple is called to comfort the sufferer rather than condemn.

explore: |
  - **Job’s answer to Bildad.** [[Job 9:1–2]] and [[Job 10:1–7]], where Job turns from Bildad to plead with God.
  - **Bildad again.** [[Job 18]] and [[Job 25]].
  - **Where Bildad’s promise is kept.** [[Job 42:7–12]].

parallels:
