chapter: 30
title: But Now They Have Me in Derision
tagline: Job sets his present beside the past he has just recalled. Outcasts he once would not have hired now mock and spit at him, God seems to have turned cruel and will not answer, and his harp plays only mourning.
when: 'Job''s last defense: “But now”'

setting: |
  Chapters 29–31 are Job's last speech, made after the friends have fallen silent (Bildad's short speech in [[Job 25]] was the last of theirs). In chapter 29 Job recalled his former prosperity and greatness, the years when he sat as chief, dwelt as a king among his people, and was blessed, as the Church's heading puts it, for his righteousness, his charity and his good deeds. Chapter 30 answers that portrait line for line. It opens “But now,” and what follows is the same life turned upside down: the honor of chapter 29 replaced by mockery, its strength by sickness, its music by weeping.

  The chapter heading gives the three movements: Job is derided by the sons of vile and base men; in his affliction he cries to the Lord; and he says that he wept for those in trouble. In chapter 31 he will take an oath, inviting judgment so that God may know his integrity ([[Job 31:5–6]]), and then “the words of Job are ended” ([[Job 31:40]]).

  Job's body is part of the lament (verses 17–18, 27, 30), as in [[Job 7:5]] and [[Job 19:20]]. Those lines are given here in plain words rather than dwelt on.

thread: |
  Job's claim is that everything chapter 29 described has been reversed, and the chapter marks its stages with “now”: “But now” (verse 1), “And now” (verse 9), “And now” (verse 16). A modern translation sets its stanzas at those words, with a last stanza from verse 24.

  First, the men who laugh at him. They are the sons of outcasts, men driven from society into the gullies and the scrub, whom Job would once not have ranked with his sheepdogs (verses 1–8). Now they make songs about him, keep their distance, and spit in his face; and Job says why they dare: God has unstrung his bow, so they have thrown off all restraint and come at him as through a wide breach (verses 9–15). As before in the book, Job lays his trouble at one moment on the crowd and at the next on God.

  Then he turns to God. His life is poured out, pain gnaws him by night, and God has thrown him into the mud. He cries, and God does not answer; he stands, and God only looks at him. God has become cruel, tosses him in the storm, and will bring him to death, the house appointed for all living (verses 16–23).

  The last stanza asks for a little of what he once gave. He wept for others whose days were hard; surely a man in ruin may cry for help. He looked for good and got evil, waited for light and got darkness, and now he cries in the assembly, with no company but the jackals and ostriches of the waste. His harp and pipe play only mourning (verses 24–31). Yet he still cries to God, and in chapter 31 he will make his last appeal.

sections:
  - range: 1-8
    heading: Men I would not have set with my dogs
    plain: |
      But now they laugh at me, men younger than I, whose fathers I would have refused to put with the dogs that guard my flock. What good could the strength of their hands do me? Their vigor is gone. Gaunt with want and hunger, they gnaw at the dry ground of a desolate waste. They pick mallow among the bushes, and the roots of the broom are their food. They are driven out from among people, who shout after them as after a thief. They have to live in the gullies of the valleys, in holes in the ground and among the rocks. They bray among the bushes and huddle together under the nettles, a senseless and nameless brood, driven out of the land.
  - range: 9-15
    heading: Now I am their song
    plain: |
      And now I have become their song, the butt of their talk. They loathe me and keep their distance, and they do not hold back from spitting in my face. Because God has unstrung my bowstring and humbled me, they have thrown off all restraint in front of me. On my right hand the young rabble rise up; they push my feet out from under me and build their roads to my ruin. They break up my path and push my disaster on, though no one helps them. They come at me as through a wide breach, rolling in amid the crash. Terrors are turned upon me; they chase my soul like the wind, and my well-being has passed away like a cloud.
  - range: 16-23
    heading: You do not answer me
    plain: |
      And now my soul is poured out within me; days of affliction have taken hold of me. At night my bones are pierced, and the pain that gnaws me never rests. The great force of my disease has disfigured my clothing; it binds me tight like the collar of my coat. He has thrown me into the mud, and I have become like dust and ashes. I cry to you, and you do not answer me; I stand up, and you only look at me. You have turned cruel to me; with the strength of your hand you oppose me. You lift me up on the wind and make me ride it, and you toss me about in the roar of the storm. I know that you will bring me to death, to the house appointed for all the living.
  - range: 24-31
    heading: My harp is turned to mourning
    plain: |
      Surely no one turns against a man in ruin when he cries out for help. Did I not weep for anyone whose day was hard? Was not my soul grieved for the poor? Yet when I looked for good, evil came; when I waited for light, darkness came. My insides churn and are never still; days of affliction have come to meet me. I go about in gloom, without the sun; I stand up in the assembly and cry for help. I have become a brother to jackals and a companion of ostriches. My skin has turned black and falls from me, and my bones burn with heat. My harp is turned to mourning, and my pipe to the sound of those who weep.

notes:
  - ref: 1
    phrase: whose fathers I would have disdained to have set with the dogs of my flock
    kind: history
    title: The men who laugh at him
    body: |
      The mockers of verse 1 are the lowest people Job knew: young men whose fathers he once would not have set even with the dogs of his flock (in one older reading, would not have trusted with so menial a service as the dogs'). Verses 2–8 say who they are. They live in the desert's gullies and caves because they have been driven out of society and are shouted after like thieves; they live on the scanty food the waste land gives, mallow and the root of the broom, in one older reading their very bread. The point of the portrait is the distance between these men and the Job of chapter 29, when men waited for his counsel “as for the rain” ([[Job 29:23]]).

      The words are harsh, and a reader may wince at them from the man who in chapter 29 was the champion of the poor. One Latter-day Saint reading takes the harshness seriously: Job here admits that he once disdained the lowest stratum of society, and now they mock and spit at him, because his calamity has marked him as a sinner and made him the crowd's scapegoat. In that reading Job still takes his former wealth and rank as evidence of God's presence in his life, and perhaps does not yet fully discern the difference between favor in the eyes of God and favor in the eyes of men.
    sources: [delitzsch-job, nrsvue, stirling-job]
  - ref: 10
    phrase: spare not to spit in my face
    kind: christ
    title: Abhorred and spit upon
    body: |
      Two Latter-day Saint writers see in this chapter a likeness to the suffering of Jesus Christ, each as his own reading; Job himself names no one. One sets Job's fall beside the Savior's condescension. As Job, who once “dwelt as a king,” is now held “in derision” by men younger than he, so the Savior, who in the premortal existence was king and the Creator of the earth, lost all prior status when He was born on earth, and the time came when He was held in derision by those unworthy of His presence.

      The other, who counts Job among the types of Christ, reads verses 9–23 as a whole: Job is seized by violence, loses his prosperity at a stroke, has a heart in turmoil, is abhorred and spit at by the crowd, is forsaken by God, and is brought to death. Setting them beside Gethsemane ([[Matt. 26:36–39]]; [[D&C 19:16–18]]), he writes that they “correspond significantly to Christ drinking the bitter cup.” What spitting in the face meant as public disgrace is explained at [[Job 17:6]]. The same writer, who counts Job a type of Christ, notes that Job was not without sin, admitting to youthful iniquities ([[Job 13:26]]).
    sources: [farley-job-parallels, stirling-job]
  - ref: 11
    phrase: he hath loosed my cord
    kind: words
    title: An unstrung bow
    body: |
      The cord God has loosed is best taken as Job's bowstring. The Hebrew word (*yeter*) is a cord, and in [[Ps. 11:2]] the string of a bow. Here the Hebrew is one of the places where the written consonants (the *ketiv*) and the reading the scribes supplied in the margin (the *qere*) differ, as at [[Job 13:15]], where the terms are explained: the written text says “his cord,” the read text “my cord.” The standard lexicon gives both. By the read text the cord is a bowstring, set against Job's memory in the previous chapter: “my bow was renewed in my hand” ([[Job 29:20]]); the bow once renewed in his hand is now unstrung. By the written text it is “his cord, with which he reins in my assailants”: God has loosed the rein that held Job's attackers back.

      The footnote gives the subject as God (“he”: OR God), and either way the effect is the same. A modern translation renders the verse, “Because God has loosed my bowstring and humbled me, they have cast off restraint in my presence.” With Job disarmed, the rabble drop the bridle that respect once put on them, and the next verses describe their assault.
    sources: [oshb-wlc, bdb, lds-scriptures, nrsvue]
  - ref: 19
    phrase: I am become like dust and ashes
    kind: scripture
    title: Dust and ashes
    body: |
      Job says God has cast him into the mire and made him like dust and ashes, the words Abraham used of himself. Abraham called himself “but dust and ashes” when he dared to plead with the Lord for Sodom ([[Gen. 18:27]]), and in one Latter-day Saint reading the phrase there means mortal man in general, who rises from dust and in death is reduced to ashes. Job has been sitting among the ashes since his sickness began ([[Job 2:8]]); now he says he has become them.

      The same reading calls the phrase “highly significant,” because Job will use it again in his last words to God, when he repents “in dust and ashes” ([[Job 42:6]]). What he means by it there is taken up at that verse.
    sources: [stirling-job, lds-scriptures]
  - ref: 20
    phrase: I cry unto thee, and thou dost not hear me
    kind: history
    title: No answer
    body: |
      Job's complaint in verse 20 is not that God is deaf but that He is silent: the footnote gives the Hebrew as “answer,” and a modern translation reads, “I cry to you, and you do not answer me; I stand, and you merely look at me.” Verse 21 goes further: “Thou art become cruel to me.” That is Job's charge, made from inside his suffering.

      What stands out in the stanza is that Job keeps crying. He expects nothing but death at God's hand, the “house appointed for all living” of verse 23 (what Job thinks of death and the grave is taken up at [[Job 7:9]]), and still he cries to God, and in verse 28 stands in the assembly and cries for help. One Latter-day Saint reading marks exactly this: though Job assumes an impending death at God's hand, he continues to cry out to God. The cry is finally answered: “Then the LORD answered Job out of the whirlwind” ([[Job 38:1]]).
    sources: [lds-scriptures, nrsvue, stirling-job]
  - ref: 25
    phrase: Did not I weep for him that was in trouble?
    kind: history
    title: I wept for him that was in trouble
    body: |
      Verses 24–25 ask for the pity Job once gave: he wept for others whose days were hard, so surely he may cry for help in his own ruin. Verse 24 is hard to read. The King James, “he will not stretch out his hand to the grave,” is hard to follow, a modern translation marks the meaning of the Hebrew as uncertain, and the ancient translations, in one older reading, made strange things of it to get any sense at all. The modern translation renders it, “Surely one does not turn against the needy, when in disaster they cry for help.”

      Verse 25 gives the ground of the appeal. In one older reading Job means that the feeling he showed at the misfortune of others may still be allowed to him in his own: he may seek compassion as he once gave it. Chapter 29 has just described that compassion, and the Church's heading there counts his charity among the things for which he was blessed. Verse 26 is what came of it: “When I looked for good, then evil came unto me.” In chapter 31 he will swear that he never turned away the poor ([[Job 31:16–20]]).
    sources: [nrsvue, delitzsch-job, lds-scriptures]
  - ref: 29
    phrase: I am a brother to dragons, and a companion to owls
    kind: symbol
    title: Jackals and ostriches
    body: |
      Job's “dragons” and “owls” are jackals and ostriches, two creatures of the waste. The footnote gives the Hebrew of “owls” as “ostriches,” and the word behind “dragons” (*tannîm*) is, in the standard lexicon, the jackal, “howling mournfully in waste places”; a modern translation reads, “I am a brother of jackals and a companion of ostriches.” The lexicon takes the ostrich here as a picture of loneliness.

      The same two animals stand together in [[Micah 1:8]], where the prophet's mourning is “a wailing like the dragons, and mourning as the owls,” and the lexicon reads the ostrich there as a simile of mourning. Driven out like the outcasts of verses 5–6, Job has become kin to the animals of the places where no one lives, and the chapter's last verse ends in the same key: his harp and his pipe now sound only like those who weep.
    sources: [lds-scriptures, oshb-wlc, bdb, nrsvue]

christ: |
  Job was mocked by the lowest of his people, abhorred and spit upon, and felt himself forsaken by God, and one Latter-day Saint writer has set this beside the cup the Savior drank. The Lord Himself set that measure for a later sufferer: “The Son of Man hath descended below them all. Art thou greater than he?” ([[D&C 122:8]]).

  The crowd took Job's ruin for proof that he deserved it. The Savior took upon Himself the suffering “of us all—even those of us who appear to deserve our suffering,” and so a disciple who sees another fallen and despised does not read that suffering as a verdict.

