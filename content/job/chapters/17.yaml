chapter: 17
title: Where Is Now My Hope?
tagline: Job, near death and misjudged by everyone, asks God Himself to stand surety for him, holds that the righteous will keep to their way, and looks into the grave for a hope he cannot find.
when: 'The second round: Job answers Eliphaz'

setting: |
  Chapter 17 finishes Job's answer to Eliphaz's second speech, an answer that began in chapter 16. Chapters 15–21 are the second round of the dialogue, and Eliphaz opened it perhaps less kindly than he had opened the first: he called Job's words “vain knowledge” and unprofitable talk ([[Job 15:2–3]]), said that Job's own mouth condemned him ([[Job 15:6]]), and described at length what the wicked receive ([[Job 15:20–35]]). Why the friends' reasoning fails Job is taken up once, at [[Job 4:7]].

  Job answered by calling his friends “miserable comforters” ([[Job 16:2]]), described how God had attacked him for nothing he had done, and declared, “my witness is in heaven, and my record is on high” ([[Job 16:19]]). Chapter 17 picks up from that cry. Job believes he is close to death (verse 1). He moves back and forth between God and his friends, speaking to God in verses 3–4 and to the friends in verse 10, and he takes the way they treat him to be God's doing as well.

thread: |
  Job's claim is that only God can vouch for him now. He begins near death and surrounded by mockers (verses 1–2), and turns at once to God with the chapter's central plea: lay down a pledge for me, be surety for me with Yourself, since no one else will strike hands with me (verse 3). The friends will not, for God has closed their minds (verses 4–5); they would rather persuade him that he is guilty.

  Job then describes what his suffering has made of him, a byword and a man people spit on, his eye dim and his body a shadow (verses 6–7). Yet in the middle of it he affirms that the righteous will hold to their way and grow stronger (verses 8–9). He turns back to the friends, finds no wise man among them, and rejects their promise of light in his darkness (verses 10–12). The speech ends looking into the grave, where his only home and kin seem to be, and with a question it leaves open: “where is now my hope?” (verses 13–16).

sections:
  - range: 1-2
    heading: The grave is ready for me
    plain: |
      My spirit is spent, my days are snuffed out, and the grave is ready for me. Surely there are mockers all around me, and my eye has to dwell on their provocations.
  - range: 3-5
    heading: Be surety for me
    plain: |
      Lay down a pledge for me, I pray; be surety for me with Yourself. Who else will strike hands with me? For You have closed their minds to understanding; therefore You will not let them triumph. Whoever hands his friends over for a share of the spoil, the eyes of his children will fail.
  - range: 6-9
    heading: The righteous hold on
    plain: |
      He has made me a byword among the peoples; I have become a man people spit on. My eye has grown dim with grief, and my whole body is like a shadow. Upright people are appalled at this, and the innocent are stirred up against the godless. Yet the righteous holds to his way, and whoever has clean hands grows stronger and stronger.
  - range: 10-16
    heading: Where is my hope?
    plain: |
      But all of you, come back and try again: I will not find one wise man among you. My days are past; my plans are broken off, the desires of my heart. They turn night into day; they say the light is near, when darkness is upon me. If I wait for anything, it is for Sheol as my house; I have spread my bed in the darkness. I have said to the pit, “You are my father,” and to the worm, “My mother and my sister.” Where then is my hope? Who will ever see it? It will go down to the bars of Sheol, when we rest together in the dust.

notes:
  - ref: 3
    phrase: put me in a surety with thee; who is he that will strike hands with me?
    kind: history
    title: Surety with God Himself
    body: |
      Job asks God to be his guarantor before God: to lay down a pledge for him and stand surety for him “with thee,” because no one else will. To go surety was to pledge yourself for another's debt, and striking hands was the gesture that sealed the pledge (explained at [[Prov. 6:1]]); the last line asks who will strike himself into Job's hand, that is, pledge himself for him. The verb behind “put me in a surety” (*ʿārab*) is the one Hezekiah prays with, “undertake for me” ([[Isa. 38:14]], where the verb is explained), and the psalmist, “Be surety for thy servant for good” ([[Ps. 119:122]]). Job's prayer adds “with thee”: a modern translation has “Lay down a pledge for me with yourself.” He asks God to stand surety for him with God Himself.

      The prayer follows Job's cry in the previous chapter, “my witness is in heaven” ([[Job 16:19]], where the witness is explained). One Latter-day Saint reading takes the two together: in the middle of his friends' persecution, Job reaches out in a moment of inspiration to an advocate in heaven and prays that God Himself will provide the pledge or witness on his behalf.
    sources: [bdb, nrsvue, stirling-job]
  - ref: 5
    phrase: He that speaketh flattery to his friends
    kind: words
    title: Friends who hand a friend over
    body: |
      Verse 5 is a proverb Job turns against his friends, and the King James's “flattery” hides it. The Hebrew word (*ḥēleq*) means a portion or share; its sense in this line is uncertain, but “flattery” does not suit the context, and a share of a feast or of booty fits it. A modern translation reads, “Those who denounce friends for reward— the eyes of their children will fail.” In one older reading, the proverb describes a man who, instead of standing up for his friends, gives them up like spoil to be divided, and so brings punishment on his own children; the three friends, in that reading, have treated Job just so, disposing of him as mercilessly as a creditor disposes of seized property.
    sources: [bdb, nrsvue, delitzsch-job]
  - ref: 6
    phrase: aforetime I was as a tabret
    kind: symbol
    title: Not a drum but spitting
    body: |
      Job says he has become a man people spit on, not, as the King James has it, that he was once a tabret, a small drum. The Hebrew noun (*tōpet*) means an act of spitting: word for word, “a spitting in the face do I become,” that is, men spit in his face. A modern translation has, “I am one before whom people spit.”

      Spitting in someone's face was public disgrace in Israel. When Miriam was shut out of the camp, the LORD said, “If her father had but spit in her face, should she not be ashamed seven days?” ([[Num. 12:14]]), and the widow whose brother-in-law refused his duty to his dead brother's house was to spit in his face before the elders ([[Deut. 25:9]]). The two halves of the verse say the same thing: Job has become a proverb for ruin among the peoples, and a man whom others shame to his face. “He hath made me” lays it at God's door.
    sources: [bdb, nrsvue]
  - ref: 9
    phrase: The righteous also shall hold on his way
    kind: history
    title: The righteous hold on
    body: |
      In the middle of his lament Job states a conviction: the righteous man keeps to his way, and whoever has clean hands grows stronger and stronger. Verse 8 says that upright people are appalled at a sufferer like Job and that the innocent are stirred up against the godless; verse 9 says that even so, the righteous do not turn aside. In one Latter-day Saint reading, Job assumes that seeing a man in his state should move the righteous to stand strong and help.
    sources: [ot-minute-job-4, nrsvue]
  - ref: 12
    phrase: They change the night into day
    kind: history
    title: Friends who call night day
    body: |
      “They” are Job's friends, who tell a dying man that night is day. Having called them back to try again and found no wise man among them (verse 10), Job sets their promises beside his state: his days are past and his plans broken off (verse 11), yet they say light is near when darkness is upon him. The Hebrew of verse 12 is uncertain, and a modern translation puts the second line in the friends' mouths: “‘The light,’ they say, ‘is near to the darkness.’” In one older reading, the friends hold that light is nearer than the darkness that in reality stares Job in the face from the immediate future.
    sources: [nrsvue, delitzsch-job]
  - ref: 15
    phrase: where is now my hope?
    kind: history
    title: A hope that goes down to Sheol
    body: |
      Job's question has no answer yet: if his only home is the grave, his hope goes down there with him. Verses 13–16 return to Sheol, the Hebrew name for the world of the dead, which the King James renders “the grave” and “the pit” (explained at [[Job 7:9]]); a modern translation keeps the name in verses 13 and 16. Job speaks of it as a household: he has made his bed in its darkness and called the pit his father and the worm his mother and sister (verse 14), and his hope, he says, will go down with him to the bars of Sheol when he rests in the dust (verse 16).

      Latter-day Saint readers have heard the question in two ways. In one reading, these verses come after Job's cry of a witness in heaven and his prayer for a pledge (verse 3), and they show what those did to him: where Job had longed for death ([[Job 3:11]]; [[Job 6:8–9]]; [[Job 7:16]]), he now refuses to let go of his hope and yield to the grave and the worm, a new kind of hope born of travail. Another reads the question plainly: Job finds no hope or solace in his friends, and he will certainly not find it in the grave. The chapter leaves it a question. Job's next speech goes further: “I know that my redeemer liveth” ([[Job 19:25]], where that testimony is explained).
    sources: [nrsvue, stirling-job, ot-minute-job-4]

christ: |
  Job asks God to stand surety for him with God, because no one on earth will strike hands with him (verse 3). He does not name Christ, and the verse is a plea, not a prophecy. Scripture gives the role he asked for to Jesus: “By so much was Jesus made a surety of a better testament” ([[Heb. 7:22]]), and He “ever liveth to make intercession for them” that come unto God by Him ([[Heb. 7:25]]). A disciple whom others misjudge, as Job's friends misjudged him, does not stand or fall by their verdict, because the One who stands surety for him before the Father is the Son of God.

explore: |
  - **The surety.** Follow the pledge from Judah ([[Gen. 43:9]]) through the prayers of [[Ps. 119:122]] and [[Isa. 38:14]] to [[Heb. 7:22–25]].
  - **Job's hope through the second round.** [[Job 16:19–21]]; [[Job 17:15]]; [[Job 19:25–27]].

