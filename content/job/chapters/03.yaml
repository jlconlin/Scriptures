chapter: 3
title: Let the Day Perish
tagline: After seven days of silence Job speaks at last, cursing the day he was born and asking why light is given to the one in misery.
when: Job’s lament

setting: |
  Job has lost his flocks, his servants and his ten children, and his body is covered with sores. Three friends have come to mourn with him, and for seven days and nights no one has said a word ([[Job 2:13]]). Chapter 3 is what breaks the silence.

  It is also where the book changes form. The prose story of chapters 1–2 gives way to poetry, a dialogue with no narrator to tell the reader what to make of the speeches. Job speaks first; his lament opens the first round of the dialogue (chapters 3–14), and his friends answer him one by one, beginning with Eliphaz in chapter 4.

  The speech is a lament: a man in intense pain wishing he had never been born. Jeremiah cursed his own birthday in almost the same words ([[Jer. 20:14–18]]), and Job comes back to the wish at [[Job 10:18–19]], asking again why he came out of the womb.

thread: |
  Job’s first speech asks one question three ways: **why was I born, if this is what life holds?** It moves from a curse, to a longing, to a question, and he never curses God.

  He begins with his birthday (verses 3–10). He wants that day struck from the calendar and the night of his conception swallowed in darkness, its stars unlit and its dawn never coming, cursed by anyone who knows how to curse a day. The reason comes at the end of the stanza: that night did not shut the womb and hide sorrow from his eyes (verse 10).

  Then the curse turns into longing (verses 11–19). Why did he not die at birth? If he had, he would be at rest now, lying with kings and princes, with the stillborn, with prisoners and slaves, all equal in the grave.

  In the last part (verses 20–26) the question widens beyond himself: why is light given to anyone in misery, to people who long for death and would dig for it like treasure? Then it narrows again to Job, a man whose way is hidden and whom God has hedged in, whose dread comes upon him. The speech ends with no rest: “yet trouble came.”

sections:
  - range: 1-2
    heading: Job breaks his silence
    plain: |
      After this Job opened his mouth and cursed the day he was born. He said:
  - range: 3-10
    heading: Let the day perish
    plain: |
      Let the day I was born be wiped out, and the night that announced, “A boy has been conceived.” Let that day turn to darkness. Let God above take no notice of it, and let no light shine on it. Let darkness and deep gloom claim it, let a cloud settle over it, and let everything that blackens a day terrify it. As for that night, let thick darkness seize it; let it not be counted among the days of the year or enter the number of the months. Let that night be solitary, with no joyful cry in it. Let those who curse days curse it, those who are skilled at rousing Leviathan. Let the stars of its twilight stay dark; let it wait for light that never comes and never see the first gleam of dawn, because it did not shut the doors of my mother’s womb and hide trouble from my eyes.
  - range: 11-19
    heading: Why did I not die at birth?
    plain: |
      Why didn’t I die at birth, or breathe my last as I came from the womb? Why were there knees to receive me, and breasts for me to nurse? For then I would be lying in quiet; I would be asleep and at rest, with kings and counselors of the earth who rebuilt ruins for themselves, or with princes who had gold and filled their houses with silver. Or I would never have existed at all, like a stillborn child hidden away, like infants who never saw the light. There the wicked stop causing trouble, and there the weary rest. There prisoners rest together and no longer hear the slave driver’s voice. Small and great are there, and the slave is free from his master.
  - range: 20-26
    heading: Why is light given?
    plain: |
      Why is light given to someone in misery, and life to the bitter in soul, to those who long for death that never comes, who search for it more than for buried treasure, who are overjoyed when they reach the grave? Why is light given to a man whose way is hidden, whom God has hedged in? My sighing comes before my food, and my groans pour out like water. The thing I greatly feared has come upon me; what I dreaded has happened to me. I had no safety, no rest, no quiet; yet trouble came.

notes:
  - ref: 3
    phrase: Let the day perish wherein I was born
    kind: scripture
    title: Cursing his day, not his God
    body: |
      Job curses the day of his birth, and only that; he does not do what the adversary said he would do. The adversary had predicted that Job would “curse thee to thy face” ([[Job 1:11]]), and Job’s wife had told him to “curse God, and die” ([[Job 2:9]]). In both places the Hebrew verb is *bārak*, “bless,” used for its opposite (the reason is explained at [[Job 1:5]]). Verse 1 uses a different verb, *qillēl*, the plain word for “curse,” and gives it a thing for its object: “his day.” So the adversary’s prediction fails: Job’s grief is bitter, but its curse lands on a day, not on God. Jeremiah’s curse on his own birthday, nearly Job’s in wording, falls the same way ([[Jer. 20:14]], where the site’s note treats it).

      Whether the lament is right the book does not say here. No narrator steps in to judge any of the speeches. Only at the end does the Lord call Job’s words “words without knowledge” ([[Job 38:2]]) and yet say that Job has spoken of Him “the thing that is right” ([[Job 42:7]]), so the reader has to listen to Job as a man speaking out of intense pain, and weigh what he says.

      The theme page [My Servant Job](/job/themes/my-servant-job/) sets “opened Job his mouth” (3:1) beside the Servant who “opened not his mouth” (Isa. 53:7) and argues that Christ, who could have gone free, chose not to plead His innocence.
    sources: [scripture-helps-job, oshb-wlc, bdb, ot-minute-job-1]
  - ref: 8
    phrase: who are ready to raise up their mourning
    kind: symbol
    title: Rousing Leviathan
    body: |
      Where the King James reads “raise up their mourning,” the Hebrew has a name: *liwyātān*, Leviathan, and a modern translation gives the line as “those who are skilled to rouse up Leviathan.” Leviathan in this verse is the mythological “dragon producing eclipses.” In a stanza that asks for darkness over the day of Job’s birth, with no stars and no dawn (verses 4–9), the image is of the power that, in the old stories, could darken the sky itself.

      Leviathan returns near the end of the book, where the LORD describes it to Job ([[Job 41:1]]); the note there explains the creature.
    sources: [biblehub-interlinear, nrsvue, bdb]
  - ref: 17
    phrase: there the weary be at rest
    kind: scripture
    title: Rest in the grave
    body: |
      Job longs for death as the one place where trouble stops. In the grave as he pictures it, kings who rebuilt ruins for themselves (verse 14), prisoners, slaves and their masters (verses 18–19) all lie together, and no one troubles anyone. He is looking to Sheol, the realm of the dead, as a place where he would rest from his suffering. What Job thinks happens at death is taken up at [[Job 7:9]] and [[Job 14:14]].

      The Church’s footnote to “rest” sends the reader to “Paradise” in the Topical Guide, and the entry there cites Alma’s teaching on the rest that follows death. Alma teaches that the spirits of the righteous are received “into a state of happiness, which is called paradise, a state of rest, a state of peace, where they shall rest from all their troubles” ([[Alma 40:12]]). Job looks for rest in the grave; the footnote points to the rest the Book of Mormon promises the faithful after death.
    sources: [stirling-job, lds-scriptures]
  - ref: 23
    phrase: whom God hath hedged in
    kind: symbol
    title: Hedged in
    body: |
      Job describes what has happened to him with the same image the adversary used. In the prologue the adversary complained that God had “made an hedge about him” ([[Job 1:10]]), a hedge that protected Job and everything he had. Now Job says that God has hedged him in, and the two hedges differ: in chapter 1 the hedge was “for protection,” and here it means to “forcibly straiten,” to pen a man in on every side, as Job will say again: “He hath fenced up my way that I cannot pass” ([[Job 19:8]]).

      “Whose way is hid” belongs to the same complaint, one heard in Israel’s other laments: Zion’s “My way is hid from the LORD” ([[Isa. 40:27]]), and Jeremiah’s “He hath hedged me about, that I cannot get out” ([[Lam. 3:7]]). What Job cannot bear is not only the loss: he “does not despair when he contemplates his affliction, but when he looks at God through it,” who, “as though He were become his enemy, has surrounded him with this affliction as with a rampart.”
    sources: [delitzsch-job]
  - ref: 25
    phrase: For the thing which I greatly feared is come upon me
    kind: words
    title: What Job feared
    body: |
      In the King James, verse 25 says that the thing Job greatly feared has come upon him, and one Latter-day Saint reading finds in it a man whose life had been ruled by anxiety about suffering. Job had offered sacrifices for his children in case they had sinned ([[Job 1:5]]); now he faces the very suffering he had spent his life trying to avoid. On this reading the book’s ending answers that fear: by the end Job knows that his relationship with God will not prevent misfortune, and he chooses to love again all the same.

      A modern translation puts the lines in the present: “Truly the thing that I fear comes upon me, and what I dread befalls me,” and “I have no rest, but trouble comes.” Read that way, the verses describe what Job is living through now rather than a fear he had carried for years.
    sources: [nrsvue, ot-minute-job-1]

christ: |
  The Church’s footnote to “misery” in verse 20 links Job’s question to the Lord’s words to Joseph Smith in Liberty Jail ([[D&C 122:1–7]]), and the Lord ends that answer by pointing to His Son: “The Son of Man hath descended below them all. Art thou greater than he?” ([[D&C 122:8]]). No one who cries out as Job did has gone lower than the Savior went.

  Grief that cries out as Job’s did is not the same as cursing God. The book of Job “addresses the question but never answers the why,” and a disciple in Job’s darkness is given, in place of the reason, the Savior, who “loves to restore what we cannot restore” and, if we let Him, “will consecrate our suffering for our gain.”

explore: |
  - **Servants of God who wished to die.** Moses ([[Num. 11:10–15]]), Jeremiah ([[Jer. 20:14–18]]) and Jonah ([[Jonah 4:1–11]]), and how the Lord answered Moses and Jonah.
  - **Liberty Jail.** [[D&C 121:1–10]] and [[D&C 122:5–9]], where the Lord speaks to a prophet in his own misery and names Job.

parallels:
  - ref: Jer. 20:14–18
    note: Jeremiah curses the day of his birth in nearly the same words.
  - ref: Job 10:18–19
    note: Job asks again why he came out of the womb.

