chapter: 12
title: With Him Is Wisdom and Strength
tagline: Job answers Zophar. He knows as much of God as his friends do, and what he knows is a God whose wisdom and strength tear down as readily as they build.
when: 'The first round: Job answers Zophar'

setting: |
  Chapter 12 begins Job's answer to Zophar, the third friend to speak, and so the last speech of the first round of the dialogue. The answer runs through chapters 12 to 14. Zophar told Job that God “exacteth of thee less than thine iniquity deserveth” ([[Job 11:6]]), and he ended with a jab at the “vain man,” a hollow, empty man, who would be wise ([[Job 11:12]]). Like the others, he took Job's suffering as proof of sin, the reasoning weighed once for the whole book at [[Job 4:7]].

  Job begins where Zophar left off, with wisdom. He mocks the friends' claim to it and insists that he knows God's majesty as well as they do: the God before whom they tell him to humble himself is no stranger to him. In chapter 13 he turns from the friends to the hearing he wants with God, and in chapter 14 to death and whether a man shall live again.

  The Church's manuals read this chapter for what Job knew about God. *Come, Follow Me* counts verses 10, 13 and 16 among the things Job knew about the Lord, and the seminary manual sets verses 9–13 and 16 beside [[Job 13:15–16]] as what Job had come to feel and learn. The same knowledge is also the ground of Job's complaint: he is sure God's hand is behind everything, and so behind what has happened to him.

thread: |
  Job's claim is that he knows God's wisdom and power at least as well as his friends do, and that what it shows is not the tidy justice they preach. He begins with sarcasm: the friends talk as though wisdom would die with them, but he has understanding too, and they have told him nothing everyone does not already know (verses 1–3). Yet he, a just man whose prayers God once answered, has become a laughingstock, while robbers live at peace (verses 4–6).

  So he sends the friends to the creatures. Beasts, birds, earth and fish all know that the LORD's hand has done this, the hand that holds every life (verses 7–10). Sayings handed down must be tested as the mouth tests food, and long life does teach understanding (verses 11–12). Then the speech turns: wisdom and strength belong to God (verse 13). The rest of the chapter is a hymn to that wisdom, and nearly every line of it tears something down. God breaks what cannot be rebuilt and holds back or lets loose the waters (verses 14–16); He strips counsellors, judges, kings, priests and elders of their standing (verses 17–21); He makes nations great and destroys them, and sends their leaders wandering in a wilderness with no road (verses 22–25). In praising God's power, Job is also questioning His justice.

sections:
  - range: 1-6
    heading: Wisdom shall die with you
    plain: |
      Job answered: No doubt you are the whole human race, and wisdom will die when you do! But I have a mind as well as you; I am not beneath you. Who does not know the things you have been saying? I have become a joke to my own friends: I, who called on God and He answered me, a righteous and blameless man, am laughed at. Those who are comfortable have contempt for misfortune; it is waiting for anyone whose foot is already slipping. Meanwhile the tents of robbers are at peace, those who provoke God live securely, and God puts plenty into their hands.
  - range: 7-12
    heading: Ask the beasts
    plain: |
      But ask the animals, and they will teach you; ask the birds of the air, and they will tell you. Speak to the earth, and it will teach you, and the fish of the sea will tell you. Which of all these does not know that the hand of the LORD has done this? In His hand is the life of every living thing and the breath of every human being. Does not the ear test words as the mouth tastes food? Wisdom is found with the old, and long life brings understanding.
  - range: 13-16
    heading: With Him is wisdom and strength
    plain: |
      But wisdom and strength are God's; counsel and understanding are His. What He tears down cannot be rebuilt; when He shuts a man in, no one can let him out. If He holds back the waters, they dry up; if He sends them out, they flood the land. Strength and wisdom are His; both the one who is led astray and the one who leads him astray belong to Him.
  - range: 17-25
    heading: He undoes the great
    plain: |
      He leads counsellors away stripped and makes fools of judges. He loosens the belt that kings wear and ties a captive's cloth around their waist. He leads priests away stripped and overthrows those who seemed secure. He silences men whose word was trusted and takes away the judgment of the elders. He pours contempt on princes and weakens the strong. He uncovers deep things out of darkness and brings the shadow of death into the light. He makes nations great and destroys them; He spreads nations out and then hems them in. He takes the understanding from the leaders of the earth and sends them wandering in a trackless wilderness. They grope in the dark without light, and He makes them stagger like drunken men.

notes:
  - ref: 2
    phrase: wisdom shall die with you
    kind: history
    title: Wisdom shall die with you
    body: |
      Job opens with sarcasm: the friends speak as if they were the whole human race, so that wisdom would die out when they did. The admission “no doubt” is meant as irony, and the Greek translation makes it a question: “So then ye alone are men, and wisdom shall die with you?” The barb answers Zophar, who had closed his speech with a jab at the “vain man” ([[Job 11:12]]), using a word that means hollow. Job's reply in verse 3 is that he has a heart, understanding, as well as they; he is not empty, and he is not beneath them.

      His last line turns the friends' doctrine into commonplace: “who knoweth not such things as these?” What they had set forth so solemnly, he says, everyone already knows.
    sources: [lxx-rahlfs, bdb, stirling-job]
  - ref: 4
    phrase: the just upright man is laughed to scorn
    kind: history
    title: A righteous man, a laughingstock
    body: |
      Job's grievance in verse 4 is that the man the reader knows to be righteous has become a joke. He describes himself first as one who “calleth upon God, and he answereth him,” a man of prayer whose prayers were heard. Then he calls himself *ṣaddîq tāmîm*, “the just upright man,” righteous and blameless. *Tāmîm* comes from the same root as *tām*, the “perfect” of [[Job 1:1]] (where the word is explained), so Job claims for himself what the narrator and the LORD have already said of him ([[Job 1:8]]; [[Job 2:3]]).

      Though innocent, Job has become a laughingstock, and verse 5 gives the reason: those who are at ease despise the man who is already slipping. Verse 6 sets beside him the robbers living securely, the prosperity of the wicked that Job takes up in full at [[Job 21:7]].
    sources: [oshb-wlc, bdb, stirling-job]
  - ref: 5
    phrase: as a lamp despised in the thought of him that is at ease
    kind: words
    title: A lamp despised, or contempt for misfortune
    body: |
      The King James “lamp despised” is one of two ways of reading a single Hebrew word, and most later interpreters prefer the other. Most of the old translations (the Aramaic Targum, the Latin Vulgate, Luther) read *lappîd* as “torch.” On that reading the man about to fall is like a spent torch thrown aside, an object of contempt to the comfortable. Many later interpreters instead divide the word into *l-*, “for,” and *pîd*, “misfortune,” a word found elsewhere in Job (30:24; 31:29), and read “contempt for misfortune.” One older reading renders the verse, “Contempt belongs to misfortune, according to the ideas of the prosperous; it awaits those who are ready to slip,” and a modern translation, “Those at ease have contempt for misfortune, but it is ready for those whose feet are unstable.”

      On either reading the point is the same: people who are safe find it easy to despise someone who is falling. In the older reading the line is aimed at the friends, Job saying that he has become an object of their contempt because they understand the suffering of the godly no better than the prosperity of the godless.
    sources: [delitzsch-job, nrsvue]
  - ref: 9
    phrase: the hand of the LORD hath wrought this
    kind: words
    title: The LORD's hand, and what it has done
    body: |
      Verse 9 is the only verse in the dialogue, from chapter 3 to the end of chapter 37, where the name YHWH, “the LORD,” appears. In verse 4 Job “calleth upon God” by another name, *ʾĔlôah*, and the name YHWH does not return until the LORD Himself answers out of the whirlwind ([[Job 38:1]]).

      What “this” is matters more. Job says that all creation, beasts, birds, earth and fish, knows that God is behind what happens, and so behind the robbers' peace and the righteous man's ruin (verses 4–6). Latter-day Saint readers take the verse as Job laying the responsibility for his troubles, and the blame for the injustice he sees, on God. Verse 10, that the life of every living thing is in God's hand, is one of the verses *Come, Follow Me* counts among what Job knew about the Lord. One of those readings names what Job's argument leaves out: human agency, which God built into the plan from the premortal world, so that God does not bear the whole responsibility for what His creatures choose.
    sources: [oshb-wlc, ot-minute-job-4, stirling-job, cfm-ot-2026-33]
  - ref: 12
    phrase: With the ancient is wisdom
    kind: structure
    title: Wisdom with the old, and with God
    body: |
      Verses 12 and 13 set two claims side by side: wisdom is with the old; wisdom and strength are with God. The friends had leaned on the old. Bildad told Job to “enquire… of the former age” and learn from the fathers ([[Job 8:8]]), and Job now takes up the authority of those inherited sayings. In one older reading he grants it something: the ear must test what it hears, as the mouth tastes food (verse 11), and long life is “a school of understanding.” A modern translation instead reads verse 12 as a question, “Is wisdom with the aged…?”

      Either way, verse 13 puts a greater wisdom above it, and the same older reading takes it as the turn of the speech: the highest possessor of wisdom, as of might, is God. What follows shows how little the wisdom of the old counts before Him. He makes fools of judges (verse 17) and takes away “the understanding of the aged” (verse 20).
    sources: [delitzsch-job, nrsvue]
  - ref: 17
    phrase: He leadeth counsellors away spoiled
    kind: scripture
    title: God undoes the great
    body: |
      The second half of the hymn names the people who run the world and shows God undoing each of them: counsellors and judges (verse 17), kings (verse 18), priests and the mighty (verse 19), trusted speakers and elders (verse 20), princes (verse 21), the heads of nations (verse 24). The “princes” of verse 19 are *kōhănîm*, the ordinary Hebrew word for priests, which the King James elsewhere also renders “chief ruler” or “prince”; a modern translation has “priests” here.

      Job dwells on God's power to bring the great low because of where his argument has taken him. One Latter-day Saint reading puts it this way: Job shared the friends' rigid theology of retribution, but knew he was innocent, and so was forced to question God's justice, here in verses 13–25. The same reading hears the LORD's first words from the whirlwind, about one who darkens counsel “by words without knowledge” ([[Job 38:2]]), as an answer to these verses.

      The same words stand in [[Ps. 107:40]], which joins the first half of verse 21 to the end of verse 24: “He poureth contempt upon princes, and causeth them to wander in the wilderness, where there is no way.”
    sources: [oshb-wlc, bdb, nrsvue, stirling-job, lds-scriptures]

christ: |
  Job's confession that “with him is wisdom and strength” (verse 13) is true even while he speaks it as a complaint. The Church's footnote to that verse points to Jacob's “O the wisdom of God, his mercy and grace!” ([[2 Ne. 9:8]]), praise that leads him to the God who “prepareth a way for our escape” from death and hell ([[2 Ne. 9:10]]). The God whose hand Job sees tearing down is the God in whose hand is “the soul of every living thing” (verse 10). The book of Job never answers why the righteous suffer; what Job learns is to trust God rather than his own understanding. That is how a disciple meets trouble that has no explanation yet: by holding to what Job knew, that wisdom and strength are God's and every life is in His hand.

explore: |
  - **Creation as a witness.** Alma tells Korihor that “all things denote there is a God” ([[Alma 30:44]]); set it beside Job's “ask now the beasts” in verses 7–9.
  - **The LORD asks about the creatures.** In [[Job 38–39]] God Himself questions Job about the creation, beasts and birds included.

