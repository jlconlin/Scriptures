chapter: 6
title: Oh That My Grief Were Throughly Weighed
tagline: Job answers Eliphaz. His words were wild because his grief is heavy, he would welcome death if God would send it, and his friends have failed him like a stream that runs dry in summer.
when: 'The first round: Job answers Eliphaz'

setting: |
  Chapter 6 begins Job's first reply to Eliphaz, the first of the three friends to speak ([[Job 4–5]]), in the first round of the dialogue. Eliphaz had begun gently, reminding Job that he had strengthened the weak and was now fainting himself ([[Job 4:3–5]]). But he had also told Job that the innocent do not perish ([[Job 4:7]], where the friends' reasoning is weighed once for the whole book) and that he should not despise the chastening of the Almighty ([[Job 5:17]]). Each of the friends, in his turn, believed that Job's afflictions had come because of something he had done wrong.

  Job's answer fills chapters 6 and 7. In chapter 6 he speaks mostly to the friends; in chapter 7 he turns from them and speaks to God. He is still the man who cursed his birthday in chapter 3: worn down in body, mind and feeling, and not sure he can bear his pain much longer. What is new is that Job now has someone to answer. He takes up one of Eliphaz's own words, defends the rashness of his lament, asks God to end his life, and then turns on the friends, who have failed him.

thread: |
  Job's claim is that his grief has not been fairly weighed. He begins with his words: set beside his calamity, which would outweigh the sand of the sea, they were rash because the load is heavy (verses 1–7). Then he says what he wants: that God would crush him and be done, and he says he has not denied the words of the Holy One (verses 8–13).

  The speech turns at verse 14, from his grief to the men sitting with him. A friend owes the afflicted kindness, and these friends have been like seasonal streams that vanish just when the travelers need them (verses 14–21). He had asked them for nothing costly (verses 22–23). He ends with a challenge: teach me, show me where I have gone wrong, look me in the face, and turn back, because my integrity is at stake (verses 24–30). By the end he feels forsaken by God and now by his friends too, which is where chapter 7 begins, speaking to God directly.

sections:
  - range: 1-7
    heading: Weigh my grief
    plain: |
      Job answered: If only my anguish could be weighed, with all my calamity set on the scales beside it! It would be heavier than the sand of the sea; that is why my words have been rash. The arrows of the Almighty are in me, and their poison drinks up my spirit; God's terrors are lined up against me. Does a wild donkey bray when it has grass, or an ox bellow over its fodder? Can anyone eat tasteless food without salt? Is there any flavor in the white of an egg? The things I would not touch before are now my sickening food.
  - range: 8-13
    heading: Let God cut me off
    plain: |
      If only I could have what I ask, and God would give me what I long for: that He would be willing to crush me, to let His hand loose and cut me off! Then I would still have comfort; I would brace myself in my sorrow; let Him not spare me, for I have not denied the words of the Holy One. What strength do I have left, that I should keep hoping? What end do I have to look forward to, that I should be patient? Is my strength the strength of stones? Is my body made of bronze? Have I no help in myself? Has sound wisdom been driven quite away from me?
  - range: 14-23
    heading: Friends like a dry streambed
    plain: |
      A man in despair should receive kindness from his friend, but the fear of the Almighty is forsaken. My brothers have been as unreliable as a stream, like brooks that run off and are gone. They are dark with ice, with snow hidden in them, but when the warm season comes they vanish, and in the heat they disappear from their place. Their courses wind away into nothing and are lost. The caravans of Tema look for them; the travelers of Sheba hope for them. They are put to shame for having counted on them; they arrive and are bitterly disappointed. Now you have come to nothing for me: you see my ruin and you are afraid. Did I ever ask you to give me something, or to pay a bribe for me out of your wealth? Did I ask you to rescue me from an enemy, or to ransom me from tyrants?
  - range: 24-30
    heading: Teach me, and look at me
    plain: |
      Teach me, and I will be quiet; show me where I have gone wrong. How forceful honest words are! But what does your arguing prove? Do you mean to correct mere words, and treat the speech of a desperate man as wind? You overwhelm the orphan and dig a pit for your own friend. Now please look at me: you can see whether I am lying to your face. Turn back, I beg you, and let no wrong be done; turn back again, because my righteousness is at stake. Is there anything wrong on my tongue? Can't my own taste tell when something is bad?

notes:
  - ref: 3
    phrase: therefore my words are swallowed up
    kind: words
    title: Rash words and a heavy grief
    body: |
      Job concedes that his words have been wild, and says the weight of his grief explains them. The King James “swallowed up” takes the verb in its sense “to swallow, to gulp down”; here it is understood as a different verb spelled with the same letters, meaning “talk wildly,” and a modern translation reads, “therefore my words have been rash.”

      The “grief” he wants weighed in verse 2 is *kaʿas*, “vexation,” the same Hebrew word as the “wrath” that Eliphaz said “killeth the foolish man” ([[Job 5:2]]), and one older reading takes Job to be answering that reproach. He asks for his vexation in one pan of the scale and his calamity in the other, and the calamity would outweigh the sand of the sea. Weighed even by ordinary justice, his suffering is out of all proportion to any sin anyone could charge him with. The “therefore” of verse 3 makes the load the reason for the rash words.
    sources: [bdb, nrsvue, delitzsch-job, oshb-wlc, tanner-considered-job]
  - ref: 6
    phrase: is there any taste in the white of an egg
    kind: symbol
    title: Braying animals and tasteless food
    body: |
      The four questions of verses 5–6 defend Job's complaint with pictures from the field and the table. One older reading takes them in two pairs. A wild donkey does not bray, nor an ox bellow, when it has its fodder: Job would not be complaining if he had no cause. And no one relishes food without salt: he cannot be expected to smile at his suffering and savor it as a delicacy. Verse 7 finishes the picture: what he once refused to touch is now his food, and the same reading takes that food to be both his suffering and the counsel Eliphaz has served him and expects him to find agreeable.

      The “white of an egg” is a guess at a rare word, *ḥallāmût*, and the guesses are old. The Aramaic Targum understood the white of an egg, and the King James follows it; the Syriac translation understood the slime of a plant, purslane. The same older reading thinks the plant less likely, because the word beside it in the line means “slime,” not broth; the plant still has its defenders (“probably a purslane”), and a modern translation reads “the juice of mallows,” marking the Hebrew as uncertain. Egg or plant, the image is the same: something slimy with no flavor at all.
    sources: [delitzsch-job, bdb, nrsvue]
  - ref: 10
    phrase: for I have not concealed the words of the Holy One
    kind: history
    title: Asking God to end it
    body: |
      Job's one request is that God would take his life, and in verse 10 he names the comfort he would still have. The prayer is meant: he asks that God would “let loose his hand, and cut me off” (verse 9). He asks it of God; he says nothing of ending his life himself. Eliphaz had urged him to keep trusting in God ([[Job 4:6]]; [[Job 5:8]]), and Job answers that he has no strength left to wait with: he is not made of stone or bronze (verses 11–12).

      “Concealed” here means denied or disowned. A modern translation reads, “for I have not denied the words of the Holy One,” though it marks the verse as uncertain. What the comfort is can be read two ways: a speedy death itself, with the last line giving the ground of his plea, or the knowledge, in the midst of death, that he had never disowned what God had spoken. One older reading weighs both and chooses the second, and adds that this consciousness of innocence is Job's shield and defense through the whole book.
    sources: [stirling-job, ot-minute-job-4, nrsvue, delitzsch-job]
  - ref: 14
    phrase: To him that is afflicted pity should be shewed from his friend
    kind: words
    title: The kindness a friend owes
    body: |
      Job's charge against his friends is that they have withheld the kindness a friend owes. The King James “pity” is *ḥesed*, the word elsewhere rendered “mercy” and “lovingkindness,” and in this verse kindness “especially as extended to the lowly, needy and miserable.” Job asked for kindness and was given argument (verse 25).

      The second line is obscure, and the readings differ over who forsakes the fear of God. On one older reading it is the sufferer: without kindness, a man melted by grief may give up the fear of the Almighty, and harshness can push him into the very abyss that love would keep him from. A modern translation, following the Syriac and the Latin, makes it the friend: “Those who withhold kindness from a friend forsake the fear of the Almighty.” On either reading, the fear of God and kindness to the sufferer are bound together.

      The friends' speeches contain much that is true in general. What made their counsel false for Job was that it was given without compassion, glibly, and from reasoning about suffering in general rather than from revelation about this man's trouble. Why their central assumption was wrong is taken up at [[Job 4:7]].
    sources: [bdb, delitzsch-job, nrsvue, tanner-considered-job]
  - ref: 15
    phrase: My brethren have dealt deceitfully as a brook
    kind: symbol
    title: A stream that fails in summer
    body: |
      Job compares his friends to seasonal streams that disappear just when they are needed. The verses draw the picture: the streams are dark with ice and hidden snow (verse 16), then, when it grows warm, they vanish, and their paths turn aside and come to nothing (verses 17–18). The travelers of Tema and Sheba look for them and wait, and “they were confounded because they had hoped” (verse 20).

      The friends are the stream, and Job is left like the travelers: “for now ye are nothing; ye see my casting down, and are afraid” (verse 21). And he had asked them for nothing costly, no gift, no payment, no rescue or ransom from an enemy (verses 22–23). He wanted only the kindness of verse 14.
    sources: [ot-minute-job-4]
  - ref: 24
    phrase: Teach me, and I will hold my tongue
    kind: history
    title: Show me my sin
    body: |
      Job ends by challenging his friends to name his sin. Eliphaz has accused him of sin, politely, and Job, who does not believe he has committed the sin they imply, challenges them to show him where (verses 24, 28–30). If they can, he will be silent.

      For “How forcible are right words!” (verse 25) a modern translation has “How forceful are honest words!” Honest words would have force, Job says, but what does their arguing prove? They set out to correct words, the speeches of a desperate man, which are only wind (verse 26). So Job asks them to look at him, since they can see he is not lying (verse 28), and to turn back and think again, “my righteousness is in it” (verse 29), or as a modern translation has it, “my vindication is at stake.”
    sources: [ot-minute-job-4, nrsvue]

christ: |
  Job asked his friends for kindness and was given argument. It is unworthy of Christians to think that those who suffer deserve their suffering, and the Savior willingly took on Himself the pain and suffering of all, even of those who seem to deserve theirs. The covenant of baptism promises to “mourn with those that mourn” and to “comfort those that stand in need of comfort” ([[Mosiah 18:9]]): the kindness Job says a friend owes the afflicted, given without first deciding whether the sufferer earned his trouble.

explore: |
  - **Comforters who came to mourn.** Read [[Job 2:11–13]], where the friends sit silent with Job for seven days, beside [[Job 16:2]] and the LORD's verdict on them in [[Job 42:7–10]].
  - **Job as a comforter of others.** Eliphaz's reminder in [[Job 4:3–4]] and Job's own account in [[Job 29:12–16]].
  - **Mourning with those that mourn.** [[Mosiah 18:8–10]]; [[Rom. 12:15]].

