chapter: 2
title: Still He Holdeth Fast His Integrity
tagline: Satan is allowed to strike Job’s body but not his life; Job refuses his wife’s counsel to curse God, and three friends come to mourn with him in silence.
when: 'The prologue: Job in the land of Uz'

setting: |
  Job 2 finishes the prose prologue that chapter 1 began; who Job was, and where Uz lay, are told at [[Job 1:1]]. The chapter repeats the pattern of chapter 1, a scene in the heavenly council and then a scene on earth. A second day of the council opens in nearly the words of [[Job 1:6–8]], and the LORD’s praise of Job gains one line: “still he holdeth fast his integrity.” The council, “the sons of God,” and the figure the Hebrew calls “the satan” are explained at [[Job 1:6]]. “Perfect and upright” is explained at [[Job 1:1]], and the “curse” that is “bless” in the Hebrew at [[Job 1:5]].

  In the first test Job lost his goods and his children. In this one Satan is allowed to strike his body. Job’s wife speaks, and Job answers her. Then three friends arrive from distant places to mourn with him, and they sit with him a week without speaking. With chapter 3 the book turns from prose narrative to poetic dialogue, and Job is the first to speak.

thread: |
  Job 2 carries the test of chapter 1 one step deeper, and the word that holds the chapter together is “integrity.” The LORD says that Job “still… holdeth fast his integrity” (verse 3). Satan answers that a man will give anything to keep his own life (verses 4–5). So the test moves from what Job has to Job himself, his “bone and his flesh,” with only his life held back (verse 6).

  The blow falls (verses 7–8), and the challenge comes back from an unexpected mouth. Job’s wife asks, in the very words the LORD had used, whether he still holds fast his integrity, and tells him to curse God and die (verse 9). Job refuses. He has received good from God, and he will not refuse trouble from the same hand; in all this he does not sin with his lips (verse 10). Satan’s claim about Job has been proved wrong a second time. Satan does not appear in the book again.

  The last scene turns to three friends who come to mourn and to comfort (verses 11–13). They weep, tear their robes, throw dust, and sit silent with him for seven days. That silence ends the prologue. When it breaks in chapter 3, the long argument begins.

sections:
  - range: 1-6
    heading: The second council
    plain: |
      On another day the sons of God came to present themselves before the LORD, and Satan came among them to present himself before the LORD too. The LORD asked Satan, “Where have you come from?” Satan answered, “From roaming the earth and walking back and forth in it.” The LORD said, “Have you considered my servant Job? There is no one like him on the earth, a blameless and upright man who fears God and turns away from evil. He still holds fast to his integrity, though you stirred me against him to destroy him for no reason.” Satan answered the LORD, “Skin for skin! A man will give everything he has for his life. But reach out your hand now and strike his bone and his flesh, and he will curse you to your face.” The LORD said to Satan, “He is in your hand; only spare his life.”
  - range: 7-10
    heading: Job’s body is struck
    plain: |
      So Satan went out from the LORD’s presence and struck Job with painful sores from the soles of his feet to the top of his head. Job took a piece of broken pottery to scrape himself with, and he sat down among the ashes. Then his wife said to him, “Are you still holding fast to your integrity? Curse God, and die.” He answered her, “You are talking the way a senseless woman talks. Shall we accept good from God, and not accept trouble?” In all this Job did not sin with his lips.
  - range: 11-13
    heading: The friends come to mourn
    plain: |
      When Job’s three friends heard of all the trouble that had come on him, each came from his own home: Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite. They had agreed together to come and mourn with him and comfort him. When they looked up from a distance, they did not recognize him. They wept aloud, each tore his robe, and they threw dust into the air over their heads. Then they sat on the ground with him seven days and seven nights, and no one said a word to him, for they saw that his suffering was very great.

notes:
  - ref: 3
    phrase: to destroy him without cause
    kind: words
    title: Without cause
    body: |
      “Without cause” is the LORD’s own verdict on what has happened to Job: it was undeserved. The Hebrew word, *ḥinnām*, means “gratuitously, without cause, undeservedly,” and is used here, as elsewhere, “especially of groundless hostility or attack.” Nothing Job had done brought on the losses of chapter 1, and nothing he has done brings on the sores of verse 7.

      The verdict is spoken in the council, which Job never sees. He never learns in the story why this has happened to him, and he has to wrestle with it without knowing. The reader does know. So when the friends later argue that a man suffers because he has sinned, the reader knows from the prologue that their argument does not fit Job. That argument is answered in full at [[Job 4:7]].

      That the LORD was “moved” against Job does not mean He was talked into anything: these conversations are best understood as a poetic way of showing Satan’s role as the adversary, and the Lord “has power over Satan and has no need to bargain with him.” The full note is at [[Job 1:6]].

      The theme page [My Servant Job](/job/themes/my-servant-job/) sets Job's wounds “without cause” beside the Servant who was wounded “for our transgressions” ([[Isa. 53:5]]).
    sources: [bdb, oshb-wlc, ot-minute-job-1, stirling-job, seminary-ot-teacher-107]

  - ref: 4
    phrase: Skin for skin
    kind: words
    title: Skin for skin
    body: |
      “Skin for skin” sounds like a saying of the marketplace, and Satan uses it to say that Job’s loyalty has a price he has not yet been made to pay. It is apparently a proverbial phrase of barter meaning that everything has its price, though its exact sense is disputed. The second half of the verse says what Satan means: “all that a man hath will he give for his life.” The Greek translation makes the bargain plainer, saying a man will give all he has “as a ransom for his life.”

      So far, Satan argues, the losses have stopped short of Job himself. Strike his own “bone and his flesh” (verse 5), and Job will curse God to His face. Satan’s claim was “that if Job were afflicted physically, then Job would curse the Lord.” The test now moves to Job’s body, and verse 6 marks where it must stop.
    sources: [bdb, lxx-rahlfs, seminary-ot-teacher-107]

  - ref: 6
    phrase: Behold, he is in thine hand; but save his life
    kind: prophets
    title: Satan’s reach has a limit
    body: |
      However the council scene is read, verse 6 makes clear that Satan’s reach has a limit and that the LORD sets it. In chapter 1 Satan could take what Job had but could not touch Job ([[Job 1:12]]). Now he may afflict Job’s body but may not kill him. Because the LORD sets the limit, the verse carries an assurance for the faithful: as long as they are faithful to the Lord, He will not allow Satan to try them beyond what they can overcome, as Paul promises in [[1 Cor. 10:13]].

      President James E. Faust taught the same truth with Joseph Smith’s words: “The devil has no power over us only as we permit him,” and “Wicked spirits have their bounds, limits, and laws by which they are governed.” So, he concluded, “Satan and his angels are not all-powerful.” In Job’s case the adversary goes as far as he is allowed, and the man he strikes still does not curse God (verse 10).
    sources: [seminary-ot-teacher-107, faust-forces-save]

  - ref: 8
    phrase: he sat down among the ashes
    kind: history
    title: Among the ashes
    body: |
      The text does not say why Job sits among the ashes. It names his disease only as “sore boils” from head to foot (verse 7), a very painful skin condition; the potsherd is a piece of broken pottery that he uses to scrape his diseased skin. On one older reading, which compares the king of Nineveh sitting in ashes in [[Jonah 3:6]], the ashes are a sign of mourning: he sits there because of “the deep sorrow… into which Job is brought by his heavy losses, especially the loss of his children.” The Greek translation puts him on “a dung-heap outside the city.”

      The ashes come back at the end of the book, where Job, after the LORD has spoken to him, repents “in dust and ashes” ([[Job 42:6]]); the note on that verse takes them up.
    sources: [seminary-ot-teacher-107, delitzsch-job, lxx-rahlfs, lds-scriptures]

  - ref: 9
    phrase: Dost thou still retain thine integrity? curse God, and die
    kind: history
    title: Job’s wife
    body: |
      Job’s wife puts to her husband the question the LORD has just answered in the council. Her “Dost thou still retain thine integrity?” is, in the Hebrew, the LORD’s own phrase from verse 3 (“still he holdeth fast his integrity”), with the same verb and the same noun, now turned from praise into a challenge.

      Her counsel is the very thing Satan predicted Job would do (verse 5; on “curse” for the Hebrew “bless,” see [[Job 1:5]]). One Latter-day Saint reading sees her as passing on Satan’s desire. Another, to be fair to her, says that she reads the disaster as a failure on Job’s part. That had been Job’s own view as well: he had hoped his righteousness would keep such calamity away. It is also how his friends will soon read it.

      The Hebrew gives her a single sentence. The Greek translation gives her a long speech, and in it she speaks as a grieving mother: her children, “the pangs and pains of my womb which I bore in vain with sorrows,” are gone, and she has become “a wanderer and a servant from place to place and house to house.”
    sources: [oshb-wlc, bdb, stirling-job, ot-minute-job-1, lxx-rahlfs]

  - ref: 10
    phrase: shall we receive good at the hand of God, and shall we not receive evil?
    kind: scripture
    title: Good and evil from God’s hand
    body: |
      Job’s answer puts his faith as a question: the God from whom he has received good is the God from whom he will accept trouble. The “evil” here is calamity, not wickedness. Verse 11 uses the same Hebrew word for what had happened to Job, “all this evil that was come upon him.” In answering so, Job “understood that trials are a part of God’s plan,” the truth Lehi teaches when he says “it must needs be, that there is an opposition in all things” ([[2 Ne. 2:11]]), and the Lord to Joseph Smith in Liberty Jail ([[D&C 122:7]], taken up at [[Job 23:10]]).

      Job’s rebuke of his wife is sharper than the English “foolish” suggests, though aimed at her words, not her mind. He says she speaks “as one of the foolish women speaketh,” and the Hebrew word, *nābāl*, means senseless “especially of the man who has no perception of ethical and religious claims.” It is the word for the fool who denies God in [[Ps. 14:1]]. To renounce God is the counsel of such a fool.

      The narrator’s verdict differs a little from chapter 1. There “Job sinned not, nor charged God foolishly” ([[Job 1:22]]); here he “did not… sin with his lips.” One Latter-day Saint reading takes Job’s answer as more uncertain than his blessing of God in chapter 1. On that reading, his wife has put into words a question already “raging inside Job,” and it bursts out in chapter 3.
    sources: [oshb-wlc, ot-seminary-2026-job-1-13, lds-scriptures, bdb, stirling-job]

  - ref: 11
    phrase: Eliphaz the Temanite, and Bildad the Shuhite, and Zophar the Naamathite
    kind: history
    title: The three friends and their homes
    body: |
      Job’s three friends all come from outside Israel, and each is named by his home. Eliphaz is “the Temanite,” and Teman was in Edom. In Genesis both names belong to Esau’s family, for Eliphaz is the father of Teman in the list of Edom’s descendants ([[Gen. 36:10–11]]). Jeremiah, speaking against Edom, asks, “Is wisdom no more in Teman?” ([[Jer. 49:7]]), and the question assumes the place was known for it. Bildad “the Shuhite” descends from Shuah, a son of Abraham and Keturah ([[Gen. 25:1–2]]), and is likely from Arabia. No one knows where Zophar’s home lay, any more than Uz. These foreign homes, like Job’s own land, suggest that the book’s message “could apply to everyone.”

      The friends are introduced first by their purpose. They “made an appointment together” to come “to mourn with him and to comfort him.” What became of that purpose is taken up at verse 13.
    sources: [sc-knowhy-864, lds-scriptures]

  - ref: 13
    phrase: none spake a word unto him
    kind: scripture
    title: Seven days of silence
    body: |
      The friends begin well: whatever they say later, they “first came to mourn with Job and comfort him.” They see him from far off and do not recognize him. They weep aloud, tear their robes, and throw dust toward heaven so that it falls on their heads. On one older reading this is the outward sign of intense suffering, a cry to heaven. Then they sit on the ground with him seven days and seven nights without a word, “for they saw that his grief was very great.” The same older reading takes the silence as no prescribed custom but the force of what they saw, and a fear of adding to his pain.

      These verses stand beside the covenant of [[Mosiah 18:8–10]], where those who come into the fold of God are “willing to mourn with those that mourn; yea, and comfort those that stand in need of comfort” ([[Mosiah 18:9]]). That is what the friends came to do. Once they begin to speak, they forget that purpose and grow more intent on correcting Job than on mourning with him; that turn begins at [[Job 4:1]].
    sources: [ot-seminary-2026-job-1-13, delitzsch-job, ot-minute-job-1]

christ: |
  Job is tried because the LORD allows it, and only within the bound He sets: “Behold, he is in thine hand; but save his life” (verse 6). One Latter-day Saint author sees in Job’s being allowed to be tried a likeness to the Savior, whom the Father also allowed to be tried and afflicted, though He was good and sinless. He “was in all points tempted like as we are, yet without sin” ([[Heb. 4:15]]), and “in that he himself hath suffered being tempted, he is able to succour them that are tempted” ([[Heb. 2:18]]).

  The adversary’s power over a disciple has bounds, and the Savior, who was tried Himself, is able to help those who are tried. Those who covenant with Him take on the work Job’s friends came to do before they began to argue: to sit with the afflicted and comfort them ([[Mosiah 18:9]]).

explore: |
  - **Integrity kept.** Follow Job’s integrity from verses 3 and 9 to his vow in [[Job 27:5–6]] and his plea to be weighed in [[Job 31:6]].
  - **Comfort that failed.** Read Job’s complaint to his friends in [[Job 6:14]] beside verses 11–13.

