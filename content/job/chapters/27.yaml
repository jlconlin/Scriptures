chapter: 27
title: Till I Die I Will Not Remove Mine Integrity
tagline: With no friend left to answer him, Job swears by the God he says has wronged him that he will never confess to sins he did not commit, then hands the friends' own picture of the wicked man's end back to them.
when: 'The third round: Job''s last answer to the friends'

setting: |
  Chapter 27 finishes Job's reply to Bildad, which began in chapter 26 (“But Job answered and said,” [[Job 26:1]]). It is the last thing Job says to the three friends. Zophar never takes his turn in this round, and why the third round seems to break off is taken up in the setting of [[Job 25]].

  So the chapter opens with a new heading, “Moreover Job continued his parable” (verse 1). The same words open chapter 29, so the poem on wisdom between them stands inside Job's speech (see the setting of [[Job 28]]). After chapter 31 Job is silent until the LORD speaks.

  The chapter has two halves that sound like two different men. In verses 1–6 Job swears an oath that he will hold fast his integrity until he dies, the word the LORD had used of him in the prologue ([[Job 2:3]]). In verses 13–23 he describes the end of the wicked man in terms the friends themselves had used, beginning with nearly the very words of Zophar's last speech ([[Job 20:29]]). How those verses fit in Job's mouth is the question of the note at verse 13. The oath formula itself is taken up where Job's great oath of innocence begins, at [[Job 31:5]].

thread: |
  Job's claim is that he will not lie to get relief, and that the friends have been reading the wrong man. He swears by the life of God, the same God he says has taken away his right, that as long as he breathes he will not speak falsely, will not grant that the friends are right, and will not let go of his integrity (verses 1–6).

  Then he turns the charge around. Let his enemy be counted the wicked one; it is the godless man who has no hope when God takes his life, no God who hears his cry, no delight in the Almighty (verses 7–10).

  The chapter turns at verses 11–12. Job offers to teach the friends about the hand of God, and grants that they have all seen what happens to the wicked; why then, he asks, have they become so vain? The rest takes up the friends' own picture: the wicked man's children fall to the sword, his silver passes to the innocent, his house is as flimsy as a moth's, and an east wind carries him off while men clap and hiss (verses 13–23). However Job means those words, he has just sworn that they do not describe him.

sections:
  - range: 1-6
    heading: As God lives
    plain: |
      Job went on with his solemn discourse and said: “As God lives, who has taken away my right, and the Almighty, who has made my soul bitter: as long as I have breath in me and the breath of God is in my nostrils, my lips will not speak falsehood and my tongue will not utter deceit. Far be it from me to say that you are right! Until I die I will not give up my integrity. I hold fast to my righteousness and will not let it go; my heart will not reproach me as long as I live.
  - range: 7-12
    heading: The hope of the godless
    plain: |
      “Let my enemy be counted as the wicked, and the one who rises against me as the unrighteous. For what hope has the godless man, whatever he has gained, when God takes away his life? Will God hear his cry when trouble comes on him? Will he delight himself in the Almighty? Will he call on God at all times? I will teach you about the hand of God; I will not hide what the Almighty does. Look, all of you have seen it for yourselves. Why then have you become so utterly vain?
  - range: 13-23
    heading: The portion of a wicked man
    plain: |
      “This is the portion God gives the wicked man, the inheritance oppressors receive from the Almighty. If his children are many, they are for the sword, and his offspring will not have enough bread. Those who survive him are buried by death, and his widows do not mourn him. Though he heaps up silver like dust and piles up clothing like clay, he may pile it up, but the righteous will wear it and the innocent will divide the silver. The house he builds is as frail as a moth's, like a hut a watchman puts up. The rich man lies down, but he will not be gathered; he opens his eyes, and he is gone. Terrors overtake him like a flood; a storm steals him away in the night. The east wind lifts him up and he is gone; it sweeps him out of his place. God hurls at him without pity, while he tries desperately to flee from his hand. Men clap their hands at him and hiss him out of his place.”

notes:
  - ref: 1
    phrase: Moreover Job continued his parable
    kind: words
    title: Job's parable
    body: |
      The heading marks what follows as Job's formal, solemn discourse. “Parable” is *māšāl*, a word whose range runs from a short wise saying to a long figurative speech. The phrase “lift up a *māšāl*” is used of Balaam's oracles (“And he took up his parable, and said,” [[Num. 23:7]]). Here, then, “parable” is not a story with a moral, the sense a reader of the New Testament brings to the word, but elevated speech.
    sources: [oshb-wlc, bdb]
  - ref: 2
    phrase: As God liveth, who hath taken away my judgment
    kind: history
    title: An oath by the God who wronged him
    body: |
      Job swears by the life of the very God he says has denied him justice. “As God liveth” opens an oath in God's name (the oath formula is taken up at [[Job 31:5]]), and in the same breath Job says that this God “hath taken away my judgment,” that is, deprived him of his right, and made his soul bitter.

      What he swears is that he will not lie: as long as the breath God gave is in his nostrils, his lips will not speak falsehood or deceit (verses 3–4). One Latter-day Saint reading sees in the oath Job “in effect binding himself to God in covenant fidelity”: he will not falsely admit sin to win God's favor, as the friends proposed, and he will not answer his unjust suffering with evil. Nothing in his circumstances seems to justify that loyalty, and Job keeps it anyway.
    sources: [nrsvue, stirling-job]
  - ref: 5
    phrase: till I die I will not remove mine integrity from me
    kind: scripture
    title: The LORD's word in Job's mouth
    body: |
      Job's vow answers the question the prologue asked, in the prologue's own words. “Integrity” is *tummāh*, the noun the LORD used of Job in the council (“still he holdeth fast his integrity,” [[Job 2:3]]) and Job's wife threw back at him (“Dost thou still retain thine integrity?” [[Job 2:9]]); “hold fast” in verse 6 is the same verb as in both of those verses. He now says of himself what the LORD said of him there. One Latter-day Saint reading makes the link explicit: that Job has kept his integrity “is made clear” in these verses.

      What integrity means here is made concrete by the line before it: “God forbid that I should justify you,” that is, far be it from Job to grant that the friends are right. The friends have urged him to confess and be restored ([[Job 22:21–23]] is the latest). In that same Latter-day Saint reading, the integrity at stake from the prologue on consists of “remaining absolutely honest” while still seeking God, and yielding to the friends by admitting that his sins justify his suffering would be holding on to a lie in hope of appeasing God. So integrity, for Job, includes refusing a false repentance.
    sources: [oshb-wlc, stirling-job]
  - ref: 7
    phrase: Let mine enemy be as the wicked
    kind: history
    title: Who is the wicked man?
    body: |
      The verse does not name Job's “enemy,” and one Latter-day Saint reading takes it to be the friends: here Job “may have once invoked God's justice on his enemies — the friends.” Verses 8–10 describe the fate he calls down: the godless man's lack of hope when God takes away his life, a cry God does not hear, no delight in the Almighty and no calling on Him.

      The wish is sharp, and the book does not leave it there. The same reading sets it beside the end of the book, where the LORD rebukes the friends and Job, far from calling down judgment on them, prays for them, and the LORD accepts him ([[Job 42:8]]); by then Job wants the friends to share the new life he has been given.
    sources: [stirling-job]
  - ref: 13
    phrase: This is the portion of a wicked man with God
    kind: scripture
    title: Zophar's words handed back
    body: |
      Verses 13–23 sound like the friends' doctrine because they are: Job begins with nearly the very words that ended Zophar's last speech (“This is the portion of a wicked man from God, and the heritage appointed unto him by God,” [[Job 20:29]]). Zophar does not speak in this round; why the round seems broken is taken up at [[Job 25]], and the site reads these verses, as the text gives them, as Job's.

      Read as Job's, the key is verses 11–12. In one older reading, when Job says “all ye yourselves have seen it,” he grants what he seemed until now to deny, that the wicked man's end is, as a rule, what the friends have said. What remains false is the use they made of it against him. They held up the wicked man's fate as a mirror for Job to see himself in; he now holds it up to them, so that they will see how unlike that fate his own suffering is. One Latter-day Saint reading hears the passage as “an apparent caricature” of the friends' description of the wicked, Job quoting Zophar as he “apparently composes a speech for Zophar.”

      Either way, the description is not Job's new verdict on himself. He has just sworn that he is not the wicked man (verses 2–6).
    sources: [delitzsch-job, stirling-job]
  - ref: 18
    phrase: He buildeth his house as a moth
    kind: symbol
    title: A moth's house and a watchman's hut
    body: |
      Both images in verse 18 say that the wicked man's house, however grand, will not last. In one older reading, the moth's house is either its fine spinning or the small case some moths make from bits of what they have eaten and drag about with them: a house that is easily destroyed, as “brittle and perishable” as the rich man's palace will prove to be. The “booth that the keeper maketh” is a light hut, perhaps for the watchman of a vineyard, put together only for the season while the grapes ripen; Isaiah uses such a hut for desolate Jerusalem, left “as a cottage in a vineyard” ([[Isa. 1:8]]).

      The rest of the passage follows from it. The man lies down rich and wakes with nothing (verse 19), and the east wind carries him off (verses 20–22). The last verse is the crowd's verdict: clapping the hands was a sign of malicious joy and hissing a sign of scorn, the gestures of passers-by at the ruin of Jerusalem in [[Lam. 2:15]].
    sources: [oshb-wlc, delitzsch-job]

christ: |
  Job keeps his integrity before anything has vindicated him, and the Church's footnote to “integrity” in verse 5 sets beside it the Savior's own promise to the faithful: “be patient in tribulation until I come; and, behold, I come quickly, and my reward is with me” ([[D&C 54:10]]). A Latter-day Saint reading draws from the book of Job a roadmap for the trials of mortality, beginning with “hold to righteousness (see Job 27:6).” A disciple who is misjudged keeps faith with Christ by staying honest, not by yielding to the pressure of the crowd and saying whatever would make it stop.

