chapter: 39
title: Doth the Hawk Fly by Thy Wisdom?
tagline: The LORD's first speech goes on among the wild animals. Job does not know when the wild goats give birth, cannot harness the wild ass or the wild ox, did not make the foolish ostrich or give the war horse its courage, and does not send the hawk south or the eagle to its crag.
when: 'The LORD out of the whirlwind'

setting: |
  Chapter 39 is the second half of the LORD's first speech, which began when He answered Job “out of the whirlwind” ([[Job 38:1]], where who speaks and why He answers with questions is explained). Chapter 38 asked about the earth, the sea, the light, the snow and the stars, and at 38:39 it came down to the animals: the lion's prey and the raven's young. Chapter 39 keeps to them, and the two chapters together are one unbroken run of questions about the created order. The questions show the LORD's knowledge and power over the earth He made and still directs, and how little a man knows or can do beside Him.

  None of the questions answers the one Job had asked. The LORD does not say why Job suffered; He answers with more questions. Those of this chapter are about creatures that live where no man rules: the wild goats of the high rocks, the wild ass and the wild ox, the ostrich, the war horse, the hawk and the eagle. When they end, the LORD asks Job whether he still means to contend with the Almighty (40:1–2), and Job's first answer follows ([[Job 40:3–5]]).

thread: |
  The chapter's claim is that the wild world runs on a knowledge and a power that are not Job's, and that God's care reaches into it. Every stanza asks about a knowledge or a power that Job does not have.

  First, births no one watches (verses 1–4): Job does not know when the wild goats bear, nor count their months; the young grow strong out in the open and leave. Then two animals that refuse man's yoke (verses 5–12). The wild ass, set free by God, laughs at the city and its drivers; the wild ox, strong as any ox, will not sleep at Job's crib or pull his harrow or bring in his grain.

  The ostrich turns the questions round (verses 13–18). Job did not give her wings, and God did not give her wisdom: she leaves her eggs in the dust and forgets they can be crushed, yet when she runs she laughs at the horse and his rider. So the horse comes next (verses 19–25), the one animal here that carries a rider, and even it Job did not make: its strength, its mane, its scorn of fear, the way it smells battle from far off and cries “Ha, ha” at the trumpets ([[Job 39:25]]).

  The last stanza looks up (verses 26–30). In one older reading the hawk's flight “toward the south” is its migration, an instinct God gave it and Job did not, and the eagle closes the circle of animals that began with the lion at 38:39: the king of beasts at one end, the king of birds at the other. The eagle nests on the crag, sees its prey from far away, and is found where the slain are.

sections:
  - range: 1-4
    heading: The Wild Goats of the Rock
    plain: |
      Do you know when the wild goats of the high rocks give birth? Can you tell when the deer give birth? Can you count the months they carry their young, or do you know the time when they give birth? They crouch down, they bring forth their young, they are delivered of their pains. Their young grow strong and grow up out in the open; they go away and do not come back to them.
  - range: 5-8
    heading: The Wild Ass Free
    plain: |
      Who let the wild ass go free? Who loosed the ropes of the wild donkey? I gave it the wilderness for its home and the salt land for its dwelling. It laughs at the noise of the city and does not hear the shouts of the driver. It ranges the mountains for pasture and searches out every green thing.
  - range: 9-12
    heading: The Wild Ox
    plain: |
      Will the wild ox be willing to serve you, or stay the night at your manger? Can you tie it with a rope in the furrow? Will it harrow the valleys behind you? Will you rely on it because its strength is great, and leave your work to it? Will you trust it to bring your harvest home and gather it to your threshing floor?
  - range: 13-18
    heading: The Ostrich
    plain: |
      The ostrich's wings flap wildly; did you give them to her? She leaves her eggs on the ground and lets them warm in the dust, and forgets that a foot may crush them or a wild animal trample them. She is hard on her young, as if they were not hers; she does not care that her labor may be for nothing, because God has withheld wisdom from her and given her no share of understanding. Yet when she rises to run, she laughs at the horse and its rider.
  - range: 19-25
    heading: The War Horse
    plain: |
      Did you give the horse its strength? Did you clothe its neck with a flowing mane? Can you make it leap like a grasshopper? Its proud snorting is terrifying. It paws the ground in the valley and delights in its strength; it charges out to meet the weapons. It laughs at fear and is not dismayed; it does not turn back from the sword. The quiver rattles against it, with the flashing spear and the shield. In fierce excitement it swallows up the ground and can hardly believe the trumpet has sounded. At each blast of the trumpet it says, “Aha!” It smells the battle from far away, the thunder of the captains and the shouting.
  - range: 26-30
    heading: The Hawk and the Eagle
    plain: |
      Is it by your wisdom that the hawk soars and spreads its wings toward the south? Is it at your command that the eagle mounts up and makes its nest on high? It lives on the cliff and stays the night there, on the crag of the rock, its stronghold. From there it looks for prey; its eyes see it from far away. Its young ones drink blood, and where the slain are, there it is.

notes:
  - ref: 1
    phrase: Knowest thou the time when the wild goats of the rock bring forth?
    kind: symbol
    title: Births no one watches
    body: |
      The chapter opens with a life lived out of man's sight, and God knows every stage of it. The wild goats of the rock bear their young on the high crags, and no herdsman keeps their calendar. The questions follow the whole cycle: the months of carrying, the crouching and the labor, the young growing strong in the open and leaving, never to come back ([[Job 39:1–4]]). Job can number none of it.

      The point is not only that Job is ignorant. In a Latter-day Saint reading, the speech that sends rain on land where no one lives is mindful of these births too (see the note on [[Job 38:26]]).
    sources: [ot-minute-job-38]
  - ref: 5
    phrase: Who hath sent out the wild ass free?
    kind: symbol
    title: The wild ass set free
    body: |
      The wild ass is the creature man cannot keep. God says He set it loose and gave it the wilderness and the salt land for a home; it laughs at the crowds of the city and does not hear the driver shouting, and it finds its own pasture on the mountains ([[Job 39:6–8]]). The wild ox of verses 9–12 is its pair: two animals that will not come back to a master.

      One Latter-day Saint reading finds Job himself in the pair. Like the wild ass, Job now lives in the waste places, and like it he has been let go, without the hedge that God had set about him ([[Job 1:10]]). The question the animals put, on that reading, is whether a creature set free will willingly come back, and in Job's case whether he will worship God freely without the hedge.
    sources: [stirling-job]
  - ref: 9
    phrase: Will the unicorn be willing to serve thee
    kind: words
    title: The unicorn is a wild ox
    body: |
      The King James “unicorn” is the *reʾem*, the wild ox, an animal known for strength and ferocity. The Hebrew is also given as “buffalo, bison,” and a modern translation has “Is the wild ox willing to serve you?” The Greek translation called the animal *monokerōs*, “one-horned” (the Latin has *unicornis*), an erroneous rendering. The same beast stands in Moses' blessing of Joseph (see the note at [[Deut. 33:17]]).

      What the verses ask turns on that: the wild ox is as strong as any ox, “his strength is great” ([[Job 39:11]]), but it will not be put to man's service. Will it spend the night at Job's manger, walk the furrow on his rope, harrow his valleys, haul his harvest to the threshing floor ([[Job 39:10–12]])? Its strength is real, but it is not Job's to command.
    sources: [lds-scriptures, bdb, nrsvue]
  - ref: 13
    phrase: Gavest thou the goodly wings unto the peacocks?
    kind: symbol
    title: The ostrich God made without wisdom
    body: |
      The ostrich is the one creature in the speech that God says He made foolish, and yet He made her. The King James “peacocks” renders a Hebrew word meaning birds of piercing cries, which most translators take for the ostrich, as a modern translation does: “The ostrich's wings flap wildly, though its pinions lack plumage.” In one older reading the words the King James renders “wings and feathers” play on the stork, whose Hebrew name means the kind, motherly bird; the ostrich looks like the stork, but she is anything but kind to her young.

      Verses 14–17 say so. She lays her eggs in the dust and forgets that a foot may crush them; she is hard toward her young “as though they were not hers” ([[Job 39:16]]). The Church's footnote at “hardened” points to Lamentations, where “the daughter of my people is become cruel, like the ostriches in the wilderness” (see the note at [[Lam. 4:3]]). The reason given is God's: He “hath deprived her of wisdom” ([[Job 39:17]]), withholding, in one older reading, the share of it she might have had; an Arabic proverb says “more foolish than the ostrich.” Yet she has her own gift: when she runs, she “scorneth the horse and his rider” ([[Job 39:18]]).

      Latter-day Saint readers take the bird two ways. In one reading God is mindful even of her abandoned eggs (see the note on [[Job 38:26]]). In another, the trampled eggs are a picture of the innocent suffering that occurs in the world.
    sources: [bdb, nrsvue, delitzsch-job, strongs-concordance, lds-scriptures, ot-minute-job-38, stirling-job]
  - ref: 19
    phrase: hast thou clothed his neck with thunder?
    kind: symbol
    title: The war horse
    body: |
      The war horse is the one animal in the chapter that carries a rider, and even its courage is God's gift, not man's. Where the King James has “thunder,” a modern translation has the horse's mane, and for “the glory of his nostrils” (verse 20) its snorting: “Do you clothe its neck with mane? Do you make it leap like the locust? Its majestic snorting is terrible.”

      The rest of the stanza is the horse at war. It paws the valley floor and runs out to meet the weapons; it laughs at fear and does not turn from the sword, though the quiver rattles and the spear flashes against it; it can hardly believe it hears the trumpet, cries “Ha, ha” among the trumpets, and smells the battle from far off ([[Job 39:21–25]]). Man rides it into battle, but man did not give it the strength or the fearlessness he rides on.
    sources: [nrsvue]

christ: |
  The God who numbers the months of the wild goats and minds the ostrich's eggs in the dust is the God Jesus taught His disciples to trust: “Are not two sparrows sold for a farthing? and one of them shall not fall on the ground without your Father” ([[Matt. 10:29]]), and “Fear ye not therefore, ye are of more value than many sparrows” ([[Matt. 10:31]]). The LORD's questions gave Job no reason for his trial, but they showed him a Maker whose knowledge and care reach where no man sees, the ground on which Job could trust the Lord with what he did not understand. A disciple who cannot see the purpose of a trial can still know that the One who watches over the wild creatures watches over him, and that his trial is not hidden from God.

explore: |
  - **Job's answer.** [[Job 40:3–5]], and his last answer in [[Job 42:1–6]].
  - **The sparrows.** [[Matt. 10:29–31]] and [[Luke 12:6–7]].

