chapter: 22
title: Acquaint Now Thyself with Him
tagline: In his last speech Eliphaz tells Job that his righteousness is no gain to God, charges him with crimes against the poor that Job never committed, and closes with a call to return to God whose last promise turns back on Eliphaz himself.
when: 'The third round: Eliphaz'

setting: |
  Eliphaz the Temanite opens the third round of the dialogue as he opened the first two ([[Job 4]]; [[Job 15]]), and this is his third and last speech. He is answering Job’s chapter 21, where Job described the wicked who prosper, live long and die in peace ([[Job 21:7]]). In one older reading that speech deals the friends’ doctrine a death-blow, and they cannot let it pass; Eliphaz, the most discreet of the three, takes it up.

  He answers by hardening the charge. The friends had moved from comfort to accusation before, but here, for the first time, Eliphaz tells Job that his wickedness is great and names the crimes: harshness to his kin, the naked, the hungry, widows and orphans. Why the friends were wrong to read Job’s suffering as punishment is set out once, at [[Job 4:7]].

  The speech has three movements: God gains nothing from Job, so his trouble must be for his sins (verses 1–11); God sees from on high, whatever Job says, and the wicked of old were swept away (verses 12–20); and a call to return to the Almighty, with the blessings that will follow (verses 21–30).

thread: |
  Eliphaz’s claim is that Job’s suffering has one explanation, and he follows it to the end. If man is nothing to God and his righteousness no gain to Him, God cannot be afflicting Job for His own sake, or for Job’s piety (verses 2–4). So it must be for his sins, and Eliphaz supplies them, though the reader knows from the prologue that Job is upright ([[Job 1:8]]) (verses 5–9). The snares and darkness around Job are their wages (verses 10–11).

  At verse 12 he turns to what he thinks Job has said. Job has argued that the wicked go unpunished; Eliphaz hears in that a God shut up behind the clouds who cannot see what is done below (verses 12–14). In one older reading, Job had used the doubter’s language, but what he denied was that a just retribution always comes, not that God sees and rules. Eliphaz answers the larger doubt with the old way of the wicked who were swept away (verses 15–20).

  Then, at verse 21, the tone changes, and the speech ends in counsel to be reconciled to God, receive His law, return, and He will hear you. In one older reading the friends’ speeches are “genuine diamonds” in their general substance and false ones in their application to Job, and nowhere is that truer than here. Every promise rests on the charge of verses 5–9, and the last one comes true against Eliphaz himself (see the note at verse 30).

sections:
  - range: 1-4
    heading: What does God gain?
    plain: |
      Then Eliphaz the Temanite answered: “Can a man be of use to God, as a wise man is of use to himself? Does it give the Almighty any pleasure that you are righteous, or does He gain anything if you make your ways blameless? Is it for your piety that He rebukes you and brings you to judgment?
  - range: 5-11
    heading: Is not thy wickedness great?
    plain: |
      “Isn’t your wickedness great, and your sins without end? You took pledges from your own kin for no reason and stripped the poor of their clothing. You gave no water to the weary and held back bread from the hungry, while the powerful man held the land and the favored lived in it. You sent widows away empty-handed and crushed the arms of the fatherless. That is why snares surround you and sudden terror shakes you, why darkness keeps you from seeing and a flood of water covers you.
  - range: 12-20
    heading: The old way of the wicked
    plain: |
      “Isn’t God high in the heavens? Look at the highest stars, how high they are! And you say, ‘What does God know? Can He judge through the dark cloud? Thick clouds hide Him so He cannot see as He walks the vault of heaven.’ Will you keep to the old path that wicked men walked? They were snatched away before their time, their foundations washed away by a flood. They said to God, ‘Leave us alone,’ and asked what the Almighty could do for them. Yet it was He who filled their houses with good things. Far be the counsel of the wicked from me! The righteous see their end and rejoice, and the innocent laugh at them: ‘Our goods are not cut off, but fire has consumed what they left.’
  - range: 21-30
    heading: Return to the Almighty
    plain: |
      “Come to terms with Him, and be at peace; that is how good will come to you. Receive instruction from His mouth, and keep His words in your heart. If you return to the Almighty, you will be built up again; put wickedness far from your tents. Then you will lay up gold like dust, the gold of Ophir like the stones of the streams. The Almighty will be your defense, and you will have plenty of silver. Then you will delight in the Almighty and lift up your face to God. You will pray to Him, and He will hear you, and you will pay what you vowed. What you decide will be done for you, and light will shine on your path. When men are brought low, you will say, ‘There is lifting up,’ and He will save the humble. He will deliver even the one who is not innocent, and he will be delivered by the cleanness of your hands.”

notes:
  - ref: 2
    phrase: Can a man be profitable unto God
    kind: scripture
    title: Profitable unto God
    body: |
      Eliphaz asks a question King Benjamin also asked, and both answer no, but they draw opposite lessons from it. Benjamin told his people that if they served God with all their souls “yet ye would be unprofitable servants” ([[Mosiah 2:21]]), the verse the Church’s footnote sets beside verse 3. His point, in one Latter-day Saint reading, is not that God is aloof but that the King of the world serves His creatures because He loves them, not because they repay Him. Eliphaz asks the same question to put God out of reach: if Job’s righteousness is no gain to God, God has no reason to take notice of it (verse 3), and, as verses 4–5 go on, Job’s trouble must then be for his sins.

      The same reading grants that we cannot put profit in God’s pocket, and holds that to call Him unaffected by our righteousness or our wickedness goes too far. Another Latter-day Saint reading says simply that here Eliphaz “speaks falsely,” and the book has already shown it. The whole drama began because God took notice of a righteous man: “Hast thou considered my servant Job, that there is none like him in the earth?” ([[Job 1:8]]). Elihu will press Eliphaz’s point again ([[Job 35:6–7]]).
    sources: [lds-scriptures, ot-minute-job-4, stirling-job]
  - ref: 5
    phrase: Is not thy wickedness great? and thine iniquities infinite?
    kind: history
    title: Crimes Job did not commit
    body: |
      Eliphaz now accuses Job of particular crimes, and they are the crimes of a powerful rich man against those who cannot resist him: taking a pledge from his own brother for nothing, stripping the poor of their clothes, refusing water to the weary and bread to the hungry, sending widows away empty and crushing the fatherless (verses 6–9). Verse 8 breaks the list of charges; a modern translation reads it, “The powerful possess the land, and the favored live in it,” and one older reading takes the “mighty man” as Job himself in Eliphaz’s eyes, a man who took the land for his own.

      Nothing in the book bears any of this out: the LORD Himself has called Job “perfect and upright” ([[Job 1:8]]). In the same older reading, the charges come from the friends’ doctrine, not from Job’s life: if great suffering must answer to great sin, and Job was once great and rich, then his wealth must have been gotten by cruelty. “Thus is the dogma of the justice of God rescued by the unjust abandonment of Job.” Job’s own account of those years says the opposite: he “delivered the poor that cried, and the fatherless,” and caused “the widow’s heart to sing for joy” ([[Job 29:12–13]]). In chapter 31 he denies these very charges under oath, one by one ([[Job 31:16–21]]).

      When Joseph Smith read Job in 1841, he called it “very Natureal” to conclude that an afflicted man “is suffering the Rath of an angry God” and to turn from him “not knowing the purposes of God,” a remark his papers link to these verses (on his words, see [[Job 4:7]]).
    sources: [ot-minute-job-4, nrsvue, delitzsch-job, stirling-job, jsp-discourse-1841-03-28, lds-scriptures]
  - ref: 18
    phrase: the counsel of the wicked is far from me
    kind: history
    title: Job’s own words turned back
    body: |
      Eliphaz answers Job’s speech in chapter 21 by quoting it. In chapter 21 Job described the prosperous wicked, who “say unto God, Depart from us,” and he disowned them: “the counsel of the wicked is far from me” ([[Job 21:14–16]]). Eliphaz takes both lines and sets them in his own story. The wicked who said to God, “Depart from us” (verse 17), walked “the old way” and were cut down before their time, their foundations washed away by a flood (verses 15–16). And the disclaimer Job made, Eliphaz now makes for himself.

      The effect is to move Job from the speaker’s side to the wicked’s. In one Latter-day Saint reading, Job’s suffering lets Eliphaz see him only as guilty, one keeping to that old way, and Eliphaz takes up Job’s disclaimer for himself “clearly in rivalry with Job.” What Job had set out as a puzzle (the wicked prosper, though they reject God), Eliphaz answers with their destruction.
    sources: [lds-scriptures, stirling-job]
  - ref: 21
    phrase: Acquaint now thyself with him, and be at peace
    kind: words
    title: Good counsel at the wrong time
    body: |
      “Acquaint” here means to come to terms with God: the Hebrew verb, in this form, means to “shew harmony with” someone, and a modern translation reads, “Agree with God, and be at peace.” The verses that follow carry the call on: receive the law from His mouth, lay up His words in your heart, return, and you will be built up; you will pray and He will hear; light will shine on your ways (verses 22–28).

      As counsel to Job they miss, because every promise assumes the charges of verses 5–9: the call to “return” is a call to repent of sins he did not commit. Verse 24 shows the strain. The King James has Eliphaz promise gold as plentiful as dust, while a modern translation makes the line a condition, “if you treat gold like dust… and if the Almighty is your gold.” One Latter-day Saint reading takes it that way: Eliphaz asks Job to lay his own gold, his insistence on his own righteousness, in the dust and make God his gold, and agreeing with God means, for Eliphaz, agreeing with Eliphaz. Job wants something else: not a repentance offered for sins he did not commit but a hearing face to face with God, as he says in his answer ([[Job 23:3–5]]).
    sources: [bdb, nrsvue, stirling-job]
  - ref: 30
    phrase: He shall deliver the island of the innocent
    kind: scripture
    title: The island that is not an island
    body: |
      “Island” most likely mistranslates the Hebrew *ʾî* here: the word usually means an island or coast, but the standard lexicon takes it in this verse as a different, rare word meaning “not,” so that the line speaks of “the non-innocent.” The line is hard, and the lexicon also records proposals to read a different word. A modern translation reads, “He will deliver even those who are guilty; they will escape because of the cleanness of your hands.” Eliphaz ends by promising Job that, once he has repented, he will pray and be heard (verse 27), and even the guilty will be delivered through the cleanness of his hands.

      In one Latter-day Saint reading, Eliphaz in fact sees himself as the one who will intercede for Job, the guilty one, and the book ironically reverses the roles. When the LORD has spoken, His wrath is against Eliphaz, and He sends him to Job with an offering: “my servant Job shall pray for you: for him will I accept: lest I deal with you after your folly” ([[Job 42:8]]). The man Eliphaz called wicked is the one whose prayer delivers the man who is not innocent, and that man is Eliphaz.
    sources: [bdb, nrsvue, stirling-job, lds-scriptures]

christ: |
  Eliphaz’s last promise, that the one who is not innocent would be delivered through another, came true against him when the LORD accepted Job’s prayer for the friends who had accused him ([[Job 42:8–9]]). In one Latter-day Saint reading, Job’s role as mediator for the friends “parallels Christ’s as mediator for mankind.” Christ is the “advocate with the Father, who is pleading your cause before him,” and He pleads for those who believe on Him by pointing to “the sufferings and death of him who did no sin” ([[D&C 45:3–5]]).

  A disciple’s deliverance rests on the Advocate’s innocence, not on the disciple’s own. The friend who judged wrongly was delivered through the prayer of the man he had accused, and one who has misjudged another is still within reach of the same pleading.

explore: |
