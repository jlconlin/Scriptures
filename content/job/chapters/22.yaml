  - **The charges denied.** [[Job 29:11–17]] and [[Job 31:16–23]].
  - **Unprofitable servants.** [[Mosiah 2:17–24]].
  - **The intercession.** [[Job 42:7–10]].

parallels:
  - ref: Mosiah 2:21
    note: King Benjamin asks whether man can profit God and answers no, to teach God’s love and man’s debt, where Eliphaz uses the question to put God at a distance.
  - ref: Job 42:8
    note: Eliphaz is delivered by Job’s prayer, the role verse 30 had promised Job once Job repented.

