chapter: 13
title: Though He Slay Me
tagline: Job answers Zophar. He dismisses his friends as physicians of no value who lie on God's behalf, resolves to take his case to God at the risk of his life, and turns to demand a hearing.
when: 'The first round: Job answers Zophar'

setting: |
  Chapter 13 is the middle of Job's answer to Zophar, the speech that runs from chapter 12 to chapter 14 and closes the first round of the dialogue (the setting of [[Job 12]] says where it begins). Like the other friends, Zophar took Job's suffering as proof of sin, the reasoning weighed once for the whole book at [[Job 4:7]]. In chapter 12 Job claimed to know God's wisdom and power as well as his friends do. Here he challenges the friends directly and then repeats his challenge to God.

  The chapter falls into three movements. Verses 1–12 are spoken to the friends. In verses 13–19 Job resolves to speak whatever it costs him, and here stands the line by which the chapter is known. From verse 20 he speaks to God Himself. The language throughout is the lawcourt's, as it was in [[Job 9]]: Job has “ordered my cause” and knows he “shall be justified” (verse 18), and he treats his quarrel with God as a case to be heard.

  *Come, Follow Me* takes the chapter's “Yet will I trust in him” as the title of its week on Job.

thread: |
  Job's claim is that he will argue his case with God himself, at the risk of his life, because the friends' defense of God is false and God has no use for falsehood. He knows what they know (verses 1–2), but he wants to reason with the Almighty, not with them (verse 3). Their comfort is a coat of plaster over lies, their medicine worthless; their best wisdom would be silence (verses 4–5). Worse, they are lying for God, taking His side before the case is heard, and God will rebuke them for it (verses 6–12).

  So he asks them to be quiet and let come what may (verse 13). He will risk his life; though God slay him, he will wait on Him and still argue his ways to His face, sure that no godless man would dare to come before God as he means to (verses 14–16). His case is ready, and he is sure of the verdict (verses 17–19).

  The speech turns at verse 20, where Job stops addressing the friends and addresses God. He asks two things, that God take His hand away and not overwhelm him with dread, and then a hearing on any terms (verses 20–22). He demands to be told his sins and asks why God treats him as an enemy, hunts a blown leaf, writes bitter charges, and fastens his feet in the stocks (verses 23–27). The bold tone gives way at the end to the image of a man wasting like a moth-eaten garment (verse 28), the lament that chapter 14 continues.

sections:
  - range: 1-12
    heading: Physicians of no value
    plain: |
      Look, I have seen all this with my own eyes and heard and understood it with my own ears. What you know, I know too; I am not beneath you. But it is the Almighty I want to speak to; I want to argue my case with God. As for you, you smear things over with lies; you are all worthless doctors. If only you would keep completely quiet; that would be your wisdom! Now hear my argument and listen to my plea. Will you speak falsely on God's behalf and lie for Him? Will you take His side and argue His case for Him? Would it go well with you if He examined you? Can you fool Him as one man fools another? He will surely rebuke you if you secretly take sides. Should not His majesty terrify you, and dread of Him fall on you? Your maxims are proverbs of ashes; your defenses are defenses of clay.
  - range: 13-19
    heading: Let come on me what will
    plain: |
      Be quiet and leave me alone so that I can speak, and let whatever happens to me happen. Why should I take my flesh in my teeth and put my life in my hand? Though He kill me, I will still wait for Him; but I will argue my ways to His face. This too will be my salvation: no godless man shall come before Him. Listen closely to what I say; let my words sink into your ears. I have prepared my case, and I know I will be found in the right. Who is there to contend with me? If I kept silent now, I would die.
  - range: 20-28
    heading: Make me to know my transgression
    plain: |
      Only do two things for me, and then I will not hide from You: take Your hand far from me, and do not let dread of You terrify me. Then call, and I will answer; or let me speak, and You answer me. How many are my iniquities and sins? Show me my offense and my sin. Why do You hide Your face and treat me as Your enemy? Will You terrify a leaf blown by the wind, and chase dry chaff? You write bitter charges against me and make me inherit the sins of my youth. You put my feet in the stocks and watch every path I take; You mark a line around the soles of my feet. And all the while a man wastes away like something rotten, like a garment eaten by moths.

notes:
  - ref: 4
    phrase: ye are forgers of lies, ye are all physicians of no value
    kind: symbol
    title: Plasterers of lies, worthless physicians
    body: |
      Job's two images say what the friends' comfort has done: it covers the truth instead of healing the wound. The King James “forgers of lies” is, in Hebrew, *ṭōpĕlê šeqer*, literally “falsehood-plasterers,” men who smear a coat of lies over what is really there: “you whitewash with lies; all of you are worthless physicians.”

      The physicians are the more painful picture. The friends came “to mourn with him and to comfort him” ([[Job 2:11]]), and mourning with him required trying to understand what Job was going through; instead they gave him a diagnosis and a cure. The diagnosis was wrong, and even a right one was not what he needed; their care and friendship would have done more good than doctrine. Job calls them “miserable comforters” in his next speech ([[Job 16:2]]), and the Church's footnote at “physicians” points to that verse and to the Lord's word to Joseph Smith in Liberty Jail ([[D&C 121:10]]), explained at [[Job 4:7]].
    sources: [bdb, nrsvue, ot-minute-job-4, lds-scriptures]
  - ref: 8
    phrase: Will ye accept his person? will ye contend for God?
    kind: history
    title: Partial for God
    body: |
      Job's charge in verses 7–10 is that the friends are lying for God. To “accept his person” is to show partiality, to favor one side, and Job accuses them of taking God's side before the case has been heard and of saying untrue things to defend God's honor. That is why Job warns them that the God they are defending will search them out (verse 9): partiality that would bring dire consequences in any other court will not escape this Judge (verses 10–11).

      One Hebrew verb, *yākaḥ*, to argue a case or to rebuke, ties the friends' case to Job's and to God's, and it runs through the chapter: Job wants to “reason” with God (verse 3), God “will surely reprove” the friends (verse 10, where the verb stands twice), and Job will “maintain” his ways before Him (verse 15). The friends argue for God; Job wants to argue with God; and Job says God will argue against the friends. A Latter-day Saint reading takes verse 10 as Job returning to some confidence in God's justice: whatever God is doing to him, Job still expects God to rebuke liars, even those who lie in His defense.
    sources: [ot-minute-job-4, bdb, oshb-wlc, stirling-job]
  - ref: 14
    phrase: Wherefore do I take my flesh in my teeth, and put my life in mine hand?
    kind: symbol
    title: My flesh in my teeth
    body: |
      Verse 14 says that Job will not cling to his life but risk it. The two images pull against each other. To carry one's flesh in one's teeth is, in one older reading, a proverbial picture found nowhere else in scripture: an animal gripping its prey in its jaws so that nothing can take it, that is, holding on to life at any cost. To put one's life in one's hand means elsewhere to risk it without fear of death, as Jephthah did in battle ([[Judg. 12:3]]) and David when he faced Goliath ([[1 Sam. 19:5]]). The Hebrew begins with “wherefore,” so on that reading Job asks why he should guard his life so jealously, and answers that he will stake it instead. A modern translation follows the Greek and makes both lines a statement, that Job will take his flesh in his teeth and put his life in his hand, noting that the Hebrew asks “Why should I take…?”

      Either way, the risk is the one Job names in the next line: to go before God and argue his innocence might cost him his life, and he will do it anyway, though it kill him.
    sources: [delitzsch-job, nrsvue, tanner-considered-job]
  - ref: 15
    phrase: Though he slay me, yet will I trust in him
    kind: words
    title: Though he slay me
    body: |
      Job's best-known line is, as the Church reads it, a testimony: a trust in God that would hold even if God took his life. It is the kind of exclamation that shows Job's “unfailing faith,” and one Latter-day Saint reading places the high point of the whole book here, in the thirteenth chapter and not the nineteenth or the forty-second, because Job's trust is “an absolute refutation of every argument of the adversary about why men serve the Lord.”

      A reader of a modern Bible will find something else: “See, he will kill me; I have no hope.” The difference lies in one small word. The Masoretic text, the traditional Hebrew text of the Old Testament, sometimes keeps a word as it is written (the *ketiv*) and gives beside it the word to be read aloud (the *qere*). Here the written word is *lōʾ*, “not,” and the word read is *lô*, “for him.” The question is old: the Mishnah, as one older commentary reports it, already found the verse open to both senses, “I hope in Him” or “I hope not,” while discussing whether Job served God from love or from fear. The King James follows the word read aloud, as the Aramaic Targum, the Syriac and Jerome's Latin did before it, and the older European versions after the Latin. The modern translation that prints “I have no hope” keeps “Though he kill me, yet I will trust in him” in its margin.

      The verb behind “trust” is *yāḥal*, to wait for or hope for. One older reading, after weighing both texts, keeps the reading the Hebrew tradition supplies and hears in it a man resigned to the worst: “behold, He will slay me, I wait for Him,” whatever He may do.

      On either reading, the second half of the verse keeps the line from being only resignation: “but I will maintain mine own ways before him.” The verb is *yākaḥ* again (see the note at verse 8): Job means to argue his case to God's face. Read as trust, the line is not the silence of a man who has stopped asking. It is the trust of a man who will not stop pleading, and its boldness is as striking as its faith.
    sources: [gs-job, ot-manual-job, oshb-wlc, delitzsch-job, nrsvue, bdb, ot-minute-job-4, tanner-considered-job]
  - ref: 16
    phrase: for an hypocrite shall not come before him
    kind: words
    title: No hypocrite comes before Him
    body: |
      Job reasons in verse 16 that his very willingness to face God counts in his favor: a godless man would never dare to come before God, so Job's coming is itself a sign of his innocence. The King James “hypocrite” is *ḥānēp*, the godless or profane man, and a modern translation reads, “This will be my salvation, that the godless shall not come before him.” In one older reading “salvation” here means victory in a contest for the right, and Job feels he has as good as won his case by wanting so urgently to defend it before God.

      A Latter-day Saint reading draws out what the line says about the God Job trusts: one who does not want anyone to come before Him as a hypocrite, “feigning to comprehend suffering that he cannot fathom.” The friends' counsel would have made Job such a hypocrite, and that is why he refuses it: to follow it would have forced him to live a lie, confessing to the Lord that he deserved his affliction when he did not. Honesty before God is, for Job, part of his faith, not a breach of it. In the Church's reading “He also shall be my salvation” belongs with verse 15 as Job's testimony; the chapter heading quotes the two lines together.
    sources: [bdb, nrsvue, delitzsch-job, tanner-considered-job, lds-scriptures]
  - ref: 26
    phrase: makest me to possess the iniquities of my youth
    kind: scripture
    title: The iniquities of my youth
    body: |
      Job is not claiming that he has never sinned: he admits to the sins of his youth while asking God to show him any sin now that could explain his suffering (verse 23). What he cannot understand is why God would make him “possess,” inherit as a bitter portion, sins long past. The Church's footnote sets the line beside the psalmist's prayer, “Remember not the sins of my youth, nor my transgressions” ([[Ps. 25:7]]), and beside the Lord's promise, “he who has repented of his sins, the same is forgiven, and I, the Lord, remember them no more” ([[D&C 58:42]]).

      One older reading explains the tension that comparison shows. Job had prayed as the psalmist did, and sins once forgiven are no longer the object of God's judgment. Yet Job can only read his affliction as punishment for them, because his trial has hidden God's loving-kindness from him.

      The theme page [My Servant Job](/job/themes/my-servant-job/) argues that Job was blameless but not sinless, and that this is one of the places where the type shows Christ by falling short of Him.
    sources: [stirling-job, lds-scriptures, delitzsch-job]
  - ref: 27
    phrase: Thou puttest my feet also in the stocks
    kind: symbol
    title: Feet in the stocks
    body: |
      Job pictures himself, in one older reading, as a prisoner held for execution. The stocks were a block of wood in which a criminal's feet were fastened, the instrument in which Paul and Silas were later held at Philippi ([[Acts 16:24]]). God, Job says, watches every path he takes, as a guard watches a prisoner so that he cannot escape, and “settest a print upon the heels of my feet.” In the same reading, God cuts lines around the soles of Job's feet so that they cannot move beyond the narrow bounds God has marked. A modern translation puts it, “you set a bound to the soles of my feet.”

      In the same reading, the “he” of verse 28 is the prisoner himself, the man God has fastened in this way, wasting like something rotten and moth-eaten. With it the challenge of verses 20–22 gives way to lament, and chapter 14 continues it.
    sources: [delitzsch-job, nrsvue]

christ: |
  Job's “Though he slay me, yet will I trust in him” is, in one Latter-day Saint reading, the kind of trust the Savior showed, a thought that might well have passed through the Savior's mind as He felt the Father's Spirit withdraw in Gethsemane. Job's trust is not a quiet acceptance; he still pleads his case to God's face, trusting a God who prefers honesty to hypocrisy. The book teaches that questions can live alongside faith until they are answered, and that whatever comes in the meantime, a disciple can still say of the Lord, “Yet will I trust in him.”

explore: |
  - **Job's case against God.** From [[Job 9:32–35]] through this chapter's verses 3 and 18–22 to [[Job 23:3–7]], [[Job 31:35]], and the LORD's answer in [[Job 38:1–3]].
  - **The friends' error.** [[Job 4:7]] and the LORD's verdict in [[Job 42:7–8]].

