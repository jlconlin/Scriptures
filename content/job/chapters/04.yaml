chapter: 4
title: Who Ever Perished, Being Innocent?
tagline: Eliphaz, the first of Job’s friends to speak, reminds Job of the comfort he once gave others, insists that the innocent never perish, and tells of a voice in the night that asked whether any mortal can be righteous before God.
when: 'The first round: Eliphaz'

setting: |
  Job has cursed the day he was born ([[Job 3:3]]), and now, after seven days of silence ([[Job 2:13]]), the first of his friends answers him. Eliphaz the Temanite (on the three friends and their homes, see [[Job 2:11]]) breaks the silence here and opens each of the three rounds of the dialogue (chapters 4, 15 and 22). His first speech runs through chapter 5 and ends on the ground of everything he has said: “Lo this, we have searched it, so it is” ([[Job 5:27]]).

  The speech begins the long argument that fills the middle of the book. When the Lord comforted Joseph Smith in Liberty Jail, He set the Prophet’s trial beside Job’s: “thy friends do not contend against thee, neither charge thee with transgression, as they did Job” ([[D&C 121:10]]). What the friends assume, and why it is false, is set out once, in the note at verse 7; the later speeches point back to it.

  Eliphaz is no villain. His words can be heard as encouragement as well as accusation, and some of what he says is true in general. The reader, though, knows what he does not: God Himself has called Job “perfect and upright” ([[Job 1:8]]).

thread: |
  Eliphaz’s speech moves from Job’s past to a principle and then to a revelation, and each step draws the circle tighter around Job.

  He begins gently, almost apologetically: he must speak, though he fears it will grieve Job (verse 2). Job has spent his life strengthening the weak hands and feeble knees of others; now trouble has touched him, and he faints (verses 3–5). Surely his fear of God and his upright ways are his ground for hope (verse 6).

  Then comes the principle, put as something Job ought to remember: the innocent do not perish, and those who plow iniquity reap it (verses 7–9). Eliphaz rests it first on what he has seen (“Even as I have seen,” verse 8), with lions whose teeth are broken as his picture of the wicked brought down (verses 10–11).

  At verse 12 he turns from experience to revelation. In the night a spirit passed before him, and a voice asked whether a mortal can be righteous before God, when God charges even His angels with error and men live in houses of clay that are crushed like a moth (verses 12–21). The vision gives Eliphaz his premise: if no one is pure before God, Job, he seems to imply, must have done something to bring on what has happened. In chapter 5 he draws the conclusion and urges Job not to despise “the chastening of the Almighty” ([[Job 5:17]]).

sections:
  - range: 1-6
    heading: You have strengthened others
    plain: |
      Then Eliphaz the Temanite answered: “If someone tries to say a word to you, will it upset you? But who can keep from speaking? You have taught many, and you have strengthened weak hands. Your words have held up those who were stumbling, and you have steadied knees that gave way. But now trouble has come to you, and you lose heart; it touches you, and you are dismayed. Isn’t your fear of God your confidence, and the integrity of your ways your hope?
  - range: 7-11
    heading: The innocent do not perish
    plain: |
      “Think back: what innocent person ever perished? Where were the upright ever cut off? As I have seen it, those who plow wickedness and sow trouble reap the same. At the blast of God they perish; the breath of His nostrils consumes them. The lion may roar and the fierce lion growl, but the young lions’ teeth are broken. The old lion perishes for lack of prey, and the cubs of the strong lion are scattered.
  - range: 12-16
    heading: A voice in the night
    plain: |
      “A word came to me in secret, and my ear caught a whisper of it. Amid troubled thoughts from visions of the night, when deep sleep falls on people, fear and trembling seized me and shook all my bones. A spirit passed before my face, and the hair on my body stood up. It stood still, but I could not make out its shape. A form was before my eyes; there was silence, and then I heard a voice:
  - range: 17-21
    heading: Houses of clay
    plain: |
      “‘Can a mortal be righteous before God? Can a man be pure before his Maker? Even His servants He does not trust, and His angels He charges with error. How much less those who live in houses of clay, whose foundation is in the dust, who are crushed like a moth! Between morning and evening they are broken to pieces; they perish forever, and no one takes notice. Is not the cord of their tent pulled up within them? They die, and without wisdom.’”

notes:
  - ref: 6
    phrase: Is not this thy fear, thy confidence, thy hope, and the uprightness of thy ways?
    kind: history
    title: Comfort that cuts both ways
    body: |
      Eliphaz’s opening can be heard as encouragement or as a taunt, and the hearing decides how the whole speech sounds. He reminds Job that he has “strengthened the weak hands” and “the feeble knees” ([[Job 4:3–4]]). Then he turns: “But now it is come upon thee, and thou faintest” ([[Job 4:5]]). Heard one way, that is the tone of the mockers at the cross: “He saved others; himself he cannot save” ([[Matt. 27:42]]). Heard another, it reassures a man who has spent his life lifting others.

      Verse 6 leans toward the kinder hearing. Its four packed nouns are two questions, as a modern translation renders them: “Is not your fear of God your confidence and the integrity of your ways your hope?” Those are the two things the narrator says of Job at the start, that he “feared God” and was “upright” ([[Job 1:1]]), and that God repeats ([[Job 1:8]]). Eliphaz tells Job to rest on them. The comfort carries a condition, and verse 7 states it.
    sources: [ot-minute-job-4, nrsvue]
  - ref: 7
    phrase: who ever perished, being innocent? or where were the righteous cut off?
    kind: prophets
    title: Do the innocent perish?
    body: |
      Eliphaz puts the friends’ whole theology into one question: if the innocent never perish, whoever perishes was not innocent. Verse 8 adds the other half from his own observation: those who plow iniquity and sow wickedness reap the same. He may mean it as comfort (stay upright and all will be well), but Job’s children had just died, and to Job the question implies that they got what they deserved. Job and his friends “thought that all suffering was caused by sin. That, too, is fundamentally false.”

      The reader knows it is false because the book has said so before the friends arrive: God has called Job “perfect and upright” ([[Job 1:8]]), and neither Job nor his children are suffering for anything they have done. The harvest Eliphaz describes is real; the rule does not run in reverse: “All sin causes suffering, but not all suffering is caused by sin.” The Book of Mormon, to which the Church’s footnote at “innocent” points, shows the innocent perishing. When believers were cast into the fire before Alma and Amulek, Alma said that “the Lord receiveth them up unto himself, in glory,” and that “the blood of the innocent shall stand as a witness against them” ([[Alma 14:11]]).

      In Liberty Jail the Lord told Joseph Smith, “Thou art not yet as Job; thy friends do not contend against thee, neither charge thee with transgression, as they did Job” ([[D&C 121:10]]), and the speeches that charged Job are chapters 4–5, 8, 11, 15, 18, 20, 22, 25 and 32–37. Two years later, as a clerk reported a Sunday meeting at which he read Job 38, Joseph Smith said the book was “a great Display of human Nature”: “it is very Natureal for a man when he sees his fellow man afflicted his Natureal conclusion is that he is suffering the Rath of an angry God & turn from him in haste not knowing the purposes of God.” The LORD gives His own verdict on the friends at the end of the book ([[Job 42:7]]).
    sources: [renlund-trust-god, ot-minute-job-4, lds-scriptures, jsp-letter-1839-03-20, jsp-discourse-1841-03-28]
  - ref: 10
    phrase: the teeth of the young lions, are broken
    kind: symbol
    title: The broken lions
    body: |
      Eliphaz’s lions are his picture of the wicked: the strongest of predators, and still the roar is silenced, the teeth broken, the old lion without prey and the cubs scattered. In one older reading the simile is there to show that “the ungodly, and they alone, perish,” and it takes the verb for the broken teeth as a form of the one in the psalmist’s prayer to “break out the great teeth of the young lions” ([[Ps. 58:6]]). The same reading takes “perisheth” in verse 11 as the old lion wandering about helpless for want of prey. However fierce the wicked are, Eliphaz says, their strength ends in ruin; the lions carry his rule of verse 7 from the innocent to the guilty.
    sources: [delitzsch-job]
  - ref: 12
    phrase: Now a thing was secretly brought to me, and mine ear received a little thereof.
    kind: history
    title: What Eliphaz saw in the night
    body: |
      Eliphaz rests his case on a revelation, and he describes it with care: a word that came to him by stealth, deep sleep, dread that shook his bones, a spirit passing over his face, a form he could not make out, then silence and a voice (verses 12–16). The manner is that of revelation; what decides the matter is the message (verses 17–21) and what Eliphaz does with it.

      Two Latter-day Saint readings weigh it. In one, the friends’ counsel rests not on revelation but on “human reason about suffering in general—upon hearsay, as it were—not upon revelation about Job’s particular predicament,” and Eliphaz discloses his real source when he closes, “we have searched it, so it is” ([[Job 5:27]]). The other reads the vision itself more severely, as a “spurious revelation” whose message, that no one can be righteous or pure before God, “is precisely Satan’s position in the Prologue”: that Job could not stay blameless without God’s hedge around him. The LORD’s verdict that the friends did not speak rightly of Him ([[Job 42:7]]) stands over both readings. Eliphaz cites the voice’s message again in his second speech ([[Job 15:15]]).
    sources: [tanner-considered-job, stirling-job, ot-minute-job-4]
  - ref: 17
    phrase: Shall mortal man be more just than God? shall a man be more pure than his maker?
    kind: words
    title: Righteous before God
    body: |
      The King James has the voice ask an easy question, whether a man can be more just than God; the Hebrew can be read as asking a harder one. The small prefix translated “than” can compare (more just than God) or can mean “from,” and one older reading says that all modern interpreters rightly take it the second way: can a man be justified by God? Modern translations make it a question of a man’s standing with God: “Can mortals be righteous before God? Can humans be pure before their Maker?” The voice then argues from the greater to the lesser: if God puts no trust in His servants and charges His angels with error (verse 18), how much less can He trust those who live in houses of clay (verse 19). The same older reading takes verse 18 to mean not that the angels sin, but that “even the holiness of the good spirits is never equal to the absolute holiness of God.”

      That is the premise Eliphaz needs. If God charges even His angels with folly, he seems to imply, Job has surely done something to deserve his trouble. But in Job’s case the book has already answered it: God called him “perfect and upright” ([[Job 1:8]]).
    sources: [delitzsch-job, nrsvue, ot-minute-job-4]
  - ref: 19
    phrase: them that dwell in houses of clay, whose foundation is in the dust
    kind: christ
    title: A tabernacle of clay
    body: |
      The voice describes mortals as those that dwell in houses of clay, founded in the dust, “crushed like a moth,” as a modern translation puts the end of verse 19, and gone between morning and evening with no one regarding it. The picture of the body as a dwelling runs on to verse 21, where the King James “excellency” is, in the same translation, “Their tent cord is plucked up within them.” For Eliphaz the clay is the measure of how far mortals stand from a God who charges even His angels with error.

      The angel who spoke to King Benjamin used the same words of the Lord Himself: “with power, the Lord Omnipotent who reigneth… shall come down from heaven among the children of men, and shall dwell in a tabernacle of clay” ([[Mosiah 3:5]]). In one Latter-day Saint reading the phrase quotes the Hebrew of Job 4:19 directly, a borrowing that shows only in Hebrew, since the King James renders Job’s line “houses of clay.” If so, the words Eliphaz’s voice used for mortal frailty become, in the angel’s mouth, the dwelling of the Lord Omnipotent.
    sources: [nrsvue, sc-knowhy-314, sc-knowhy-410]

christ: |
  Eliphaz asked, “who ever perished, being innocent?” The gospel answers with Jesus Christ. He lived without sin and was still “a man of sorrows, and acquainted with grief” ([[Isa. 53:3]]); “though he were a Son, yet learned he obedience by the things which he suffered” ([[Heb. 5:8]]). His righteousness did not shield Him from suffering, and much of His suffering came because He was righteous.

  Because the sinless Son suffered, affliction in a disciple’s life or a neighbor’s is not a verdict on that person. The conclusion Joseph Smith called natural, to take another’s suffering for God’s anger and turn from him in haste, is the friends’ mistake, made by those who do not know the purposes of God.

explore: |
