  - **Job’s answer.** [[Job 6:14–30]], where Job tells his friends that pity is owed to the afflicted.
  - **Liberty Jail.** [[D&C 121:7–10]] and [[D&C 122:7–8]].
  - **The Lord in a tabernacle of clay.** [[Mosiah 3:5–8]].

