chapter: 26
title: These Are Parts of His Ways
tagline: Job brushes aside Bildad's borrowed counsel and answers with his own hymn to God's power, from the trembling dead to the clouded throne, and ends by saying that all of it is only a whisper of Him.
when: 'The third round: Job answers Bildad'

setting: |
  Chapter 26 is Job's answer to Bildad's third speech ([[Job 25]]). That speech was only six verses: a hymn to God's greatness and a reminder that no man can be just before Him, which says again what Eliphaz had already said ([[Job 4:17–19]]; [[Job 15:14–16]]). Zophar never speaks again; why the third round seems to break off is taken up in the setting of [[Job 25]], and why the friends' reasoning fails Job is taken up once, at [[Job 4:7]].

  This is the first part of Job's closing speech, which runs on through chapter 27 and, after the poem on wisdom, chapters 29–31; the later parts begin “Job continued his parable” ([[Job 27:1]]; [[Job 29:1]]). In one Latter-day Saint reading, meaningful dialogue between Job and his friends has by now broken down.

thread: |
  Job's claim is that Bildad has told him nothing he did not know. He opens with three verses of irony: what help has Bildad been to a man without strength, and whose words has he been repeating (verses 2–4)?

  Then he shows it. Bildad had praised God's rule in the heavens; Job praises it from the bottom of the world to the top, as he has already done twice ([[Job 9:4–10]]; [[Job 12:13–25]]). The dead tremble beneath the waters, and the grave lies open before God (verses 5–6). He hangs the earth on nothing, holds the rain in the clouds, veils His throne, sets a boundary on the sea, shakes the pillars of heaven, and subdues the sea and its monster (verses 7–13).

  The turn comes in the last verse. Everything Job has just described is only the edge of God's ways, a whisper; the full thunder of His power no one can grasp (verse 14). Job has shown that he can praise God as well as Bildad can, and he ends by admitting that any such praise falls far short.

sections:
  - range: 1-4
    heading: Whose words are these?
    plain: |
      Then Job answered: What a help you have been to the powerless! How you have saved the arm that has no strength! What counsel you have given to one who has no wisdom, and how much sound advice you have offered! To whom have you been speaking, and whose spirit spoke through you?
  - range: 5-6
    heading: The dead lie open before Him
    plain: |
      The shades of the dead tremble down below, beneath the waters and the creatures that live in them. Sheol, the realm of the dead, lies naked before God, and the place of destruction has no covering.
  - range: 7-13
    heading: From the earth to the heavens
    plain: |
      He stretches out the northern sky over empty space and hangs the earth upon nothing. He binds up the waters in His thick clouds, and the clouds do not burst under their weight. He veils the face of His throne and spreads His cloud over it. He has drawn a circle on the face of the waters, out to the boundary where light meets darkness. The pillars of heaven tremble and are astounded at His rebuke. By His power He divides the sea, and by His understanding He strikes down Rahab, the proud monster of the deep. By His breath the heavens are made fair; His hand has pierced the fleeing serpent.
  - range: 14
    heading: Only a whisper
    plain: |
      These are only the outer edges of His ways; how faint a whisper is all we hear of Him! But the thunder of His power, who can understand?

notes:
  - ref: 4
    phrase: whose spirit came from thee?
    kind: history
    title: Whose words are these?
    body: |
      Job's opening questions are sarcasm: he implies that Bildad has helped no one and has repeated words that were not his own. “Him that is without power” and “him that hath no wisdom” are Job himself; one older reading hears Job calling Bildad's reply useless, beside the point, and “a borrowed weapon.” Bildad's praise of God's greatness and of man's inability to be just before Him (25:2–6) agrees with what Eliphaz had said twice before ([[Job 4:17–19]]; [[Job 15:14–16]]).

      One Latter-day Saint reading takes “whose spirit came from thee?” as Job questioning both Bildad's ability to counsel and the source of his inspiration. The same reading takes verses 5–14 as Job “finishing” Bildad's speech for him, a parody of his position on God's greatness. Whether parody or not, the hymn that follows shows that Job, too, can praise God's majesty.
    sources: [stirling-job, delitzsch-job]
  - ref: 5
    phrase: Dead things are formed from under the waters
    kind: words
    title: The dead tremble
    body: |
      Job's hymn begins at the bottom of the world: the dead themselves shudder before God. The King James's “dead things are formed” is obscure. The Hebrew word is *rĕpāʾîm*, the “shades” or ghosts of the dead in Sheol (the same word is explained at [[Isa. 26:14]]), and the verb is the one used of writhing in labor; a modern translation reads, “The shades below tremble, the waters and their inhabitants.” The shades tremble “from under the waters,” beneath the sea itself, and even there they feel His power.

      Verse 6 says why: “Hell is naked before him, and destruction hath no covering.” Hell is Sheol, the realm of the dead (what Job thinks of it is taken up at [[Job 7:9]]). “Destruction” is *ʾăbaddôn*, Abaddon, the place of ruin in Sheol; Proverbs pairs the two in the same way: “Hell and destruction are before the LORD: how much more then the hearts of the children of men?” ([[Prov. 15:11]]). Nothing, not even the grave, is hidden from Him.
    sources: [bdb, nrsvue]
  - ref: 7
    phrase: hangeth the earth upon nothing
    kind: symbol
    title: The earth hung upon nothing
    body: |
      Verse 7 pictures the sky and the earth held up by nothing but God's power. “The north” is stretched out like a tent over “the empty place”; a modern translation keeps the Hebrew name, “He stretches out Zaphon over the void,” and one older reading takes it as the northern sky, where the pole of the heavens stands. Over that void the earth itself hangs, with nothing under it.

      It is a picture, not a statement of the laws of gravitation, “which were unknown to the ancients,” though its knowledge of nature is still “worthy of respect.”

      The next verses go on in the same way. God holds the rain in the clouds so that they do not tear (verse 8), and hides the face of His throne behind them (verse 9). He draws a circle on the face of the waters (verse 10). The King James's “until the day and night come to an end” sounds like a span of time, but a modern translation and one older reading take it as a place: the circle runs out to the horizon, “at the boundary between light and darkness.”
    sources: [nrsvue, delitzsch-job]
  - ref: 12
    phrase: by his understanding he smiteth through the proud
    kind: symbol
    title: Rahab and the fleeing serpent
    body: |
      “The proud” whom God smites is Rahab, the mythical sea monster whose name the King James translates (explained at [[Job 9:13]] and [[Isa. 51:9]]); here she stands beside “the sea,” as a modern translation shows: “by his understanding he struck down Rahab.” The next verse names a serpent, and there the King James says God's hand “formed the crooked serpent” where a modern translation reads “his hand pierced the fleeing serpent.” The difference is in two Hebrew words. The verb can be taken from a root meaning to bring forth, the root of “or ever thou hadst formed the earth” ([[Ps. 90:2]]), and one older reading grants that “formed” is a possible translation. But it more probably belongs with the verb to pierce or wound, the verb of the arm that “wounded the dragon” in [[Isa. 51:9]], and the same older reading decides for that verb because the two lines of the verse belong together and the passage is not describing the creation. The adjective, in the language as far as it survives, always means “fleeing”; at [[Isa. 27:1]] the King James renders the same word “the piercing serpent.” This note follows “pierced the fleeing serpent” as the more probable sense, without making the King James reading impossible. The Church's footnote sends the reader to that verse of Isaiah, where leviathan is also “that crooked serpent” (the site's note there explains the monster, and agrees with what follows here); leviathan is taken up where the LORD Himself describes him, at [[Job 41:1]].

      Ancient Israel pictured God as combatting sea monsters and waters that personified chaos and destruction, and these two verses are among the passages that use the image. In later scripture the chaos monster, the dragon or “old serpent,” comes to be identified as Satan: in John's vision he is “that old serpent, called the Devil, and Satan” ([[Rev. 12:9]]), cast out of heaven. Job's verses do not name him.
    sources: [bdb, nrsvue, delitzsch-job, lds-scriptures, sc-knowhy-43]
  - ref: 13
    phrase: By his spirit he hath garnished the heavens
    kind: words
    title: His breath, His Spirit
    body: |
      The Hebrew *rûaḥ* can be wind, breath or spirit, and here it can be read as God's breath, the wind, making the sky fair. The word behind “garnished” means fairness or clearness of the sky: “by his breath the sky becomes fair”; a modern translation has “By his wind the heavens were made fair.” The King James's “By his spirit” is not wrong, since the one Hebrew word carries both senses.
    sources: [bdb, nrsvue]
  - ref: 14
    phrase: how little a portion is heard of him
    kind: words
    title: Only a whisper
    body: |
      Job ends his hymn by saying it has hardly begun: all he has described is the fringe of God's ways, what we hear of Him is a whisper, and the full thunder of His power lies beyond what any man can grasp. “Parts of his ways” are their edges or outskirts, as a modern translation has it, and “how little a portion” is in Hebrew “a (mere) whisper of a word, something wholly inadequate.”
    sources: [bdb, nrsvue]

christ: |
  Job praises the God who hangs the earth on nothing and makes the heavens fair, and the Church's footnote to “garnished” sends the reader to the Topical Guide's “Jesus Christ, Creator.” John testifies that “All things were made by him; and without him was not any thing made that was made” ([[John 1:3]]), and King Benjamin's angel calls Him “the Creator of all things from the beginning” ([[Mosiah 3:8]]). A disciple, like Job, hears only a whisper of His ways in this life and knows Him in part, seeing “through a glass, darkly”; the same verse says the partial view will end: “then shall I know even as also I am known” ([[1 Cor. 13:12]]).

explore: |
  - **Job's earlier hymns to God's power.** [[Job 9:4–10]]; [[Job 12:13–25]].
  - **The LORD's own account of creation.** [[Job 38:4–11]], where the questions Job could not answer are asked of him.
  - **Nothing hidden from God.** [[Ps. 139:7–12]], which the Church's footnote sets beside verse 6.
  - **The serpent overcome.** [[Isa. 27:1]]; [[Rev. 12:7–11]].

