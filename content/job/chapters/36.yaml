chapter: 36
title: Who Teacheth Like Him?
tagline: Elihu's last speech begins. He claims to speak for God with sound knowledge, teaches that God opens the ears of the afflicted through their affliction, warns Job that he has chosen iniquity over patient suffering, and turns to praise God in the gathering storm.
when: "Elihu's fourth speech"

setting: |
  Chapter 36 opens the fourth and last of Elihu's speeches, which runs on through chapter 37 (who Elihu is, and why he is angry, is explained at [[Job 32:2]]). He has spoken three times already, and Job makes no reply to this speech either.

  What stands out in this speech is the weight Elihu puts on suffering as discipline. The friends read Job's affliction as a sign of God's anger and a punishment for sin; Elihu reads affliction as God's instruction. God binds people in “cords of affliction” to show them their transgressions and open their ears (verses 8–10, 15), and those who listen are restored. For Elihu, if Job would only accept his suffering, he could learn from it as God intended.

  The second half of the chapter leaves the argument and praises God's power over creation: rain, cloud, thunder and lightning. The hymn runs on through chapter 37.

thread: |
  Elihu's claim is that God is both just and a teacher, and that Job's suffering is God's instruction, which Job is refusing. He asks Job to bear with him and claims that his knowledge is sound (verses 2–4). God is mighty yet despises no one; He does not keep the wicked alive, gives the poor their right, and seats the righteous with kings (verses 5–7). When the righteous are bound in affliction, God shows them their sins and calls them back; those who listen live out their days in prosperity, those who refuse die “without knowledge,” and the godless who will not cry to Him die young (verses 8–14). So God delivers the afflicted through their affliction (verse 15).

  At verse 16 Elihu turns the lesson on Job. God would have led him out of distress into a broad place, but Job has taken up the case of the wicked. Elihu warns him that wrath is near, that neither ransom nor riches will deliver him, and that he has chosen iniquity rather than affliction (verses 16–21).

  The speech turns again at verse 22, from Job to God. No one teaches as God does or can charge Him with wrong, and Job should praise His work (verses 22–25). God is greater than we can know, and Elihu shows Him in the rain drawn up and poured down, the spreading clouds, the thunder from His pavilion and the lightning, by which He both governs the peoples and feeds them (verses 26–33).

sections:
  - range: 1-4
    heading: On God's behalf
    plain: |
      Elihu went on and said: Bear with me a little longer, and I will show you that I still have something to say for God. I will bring my knowledge from far away and declare that my Maker is righteous. Truly, my words are not false; one whose knowledge is sound is here with you.
  - range: 5-15
    heading: He openeth also their ear
    plain: |
      God is mighty, and yet He despises no one; He is mighty in strength and understanding. He does not keep the wicked alive, but He gives the poor their right. He does not take His eyes off the righteous; He seats them with kings on the throne and lifts them up forever. And if they are bound in chains and caught in the cords of affliction, then He shows them what they have done, and how their transgressions have grown arrogant. He opens their ears to correction and commands them to turn back from iniquity. If they listen and serve Him, they live out their days in prosperity and their years in pleasantness. If they will not listen, they perish by the sword and die without understanding. But the godless in heart nurse their anger; they do not cry out to Him when He binds them. They die young, and their life ends in shame. He delivers the afflicted by their affliction and opens their ears by their distress.
  - range: 16-21
    heading: Rather than affliction
    plain: |
      He would have brought you, too, out of the jaws of distress into a broad place with no constraint, and your table would have been laden with rich food. But you are taken up with the case of the wicked, and judgment and justice have hold of you. Because there is wrath, beware lest He take you away with a stroke; then even a great ransom cannot deliver you. Will He value your riches? No, not gold, nor all your strength. Do not long for the night, when peoples are cut off where they stand. Take care, do not turn to iniquity; for you have chosen it rather than affliction.
  - range: 22-33
    heading: God is great, and we know him not
    plain: |
      See, God is exalted in His power; who is a teacher like Him? Who has prescribed His way for Him, or who can say to Him, “You have done wrong”? Remember to praise His work, which people have seen; everyone looks on it, even from far away. God is great, beyond our knowing; the number of His years cannot be searched out. He draws up the drops of water, and they fall as rain from His mist, which the clouds pour down on mankind in abundance. Can anyone understand how the clouds spread out, or the thunder from His pavilion? See, He spreads His light around Him and covers the depths of the sea. By these He governs the peoples and gives food in abundance. He covers the light with clouds and commands it not to shine through the cloud that comes between. Its thunder announces Him, and even the cattle sense the storm rising (one older reading of a line that translations render in very different ways).

notes:
  - ref: 4
    phrase: he that is perfect in knowledge is with thee
    kind: history
    title: Perfect in knowledge
    body: |
      The one “perfect in knowledge” who is with Job is Elihu himself, and he describes himself in nearly the words he will use of God. Here he calls himself *tĕmîm dēʿôt*, “perfect in knowledge”; in the next chapter he asks Job whether he knows the wonders “of him which is perfect in knowledge” ([[Job 37:16]]), where the Hebrew is *tĕmîm dēʿîm*, the same adjective with a near twin of the noun.

      Elihu was certainly not lacking in confidence: he has offered to speak “on God's behalf” (verse 2). One Latter-day Saint reading hears in the pairing of 36:4 and 37:16 a man who puts himself alongside God in a sense, implying that since he shares God's knowledge, his words are God's words, so that Job must decide whether to accept Elihu as a true prophet or go on waiting for the Lord. Job does neither in words: he makes no reply.
    sources: [oshb-wlc, stirling-job, ot-minute-job-36, bd-job-book]
  - ref: 15
    phrase: He delivereth the poor in his affliction, and openeth their ears in oppression
    kind: words
    title: Delivered by affliction
    body: |
      Verse 15 gathers Elihu's central teaching into one line: God rescues the afflicted not only out of their affliction but by means of it. Where the King James has “in his affliction” and “in oppression,” a modern translation reads, “He delivers the afflicted by their affliction and opens their ear by adversity.” The affliction is the instrument, and the opened ear is the purpose: the same God who “openeth also their ear to discipline” (verse 10) is the One of whom Elihu asks in verse 22, “who teacheth like him?” The godless who will not cry to Him when He binds them (verse 13) refuse the lesson.

      That is where Elihu differs from the three friends, who took Job's sufferings as a sign of God's anger and a punishment for sin (Eliphaz too spoke of chastening, and how near he came to Elihu is taken up at [[Job 33:14]]). For Elihu, suffering is a kindness: when people are bound “in cords of affliction,” God shows them their transgressions and commands them to turn back (verses 8–10).

      Taken in general, there is a good deal of truth in this: the Lord may use affliction “for experience, discipline, and instruction as well as for punishment.” Elihu's mistake is in applying it. Like the friends, he assumes that the people who suffer and the people who need correcting are the same people, and the book says of Job at the start that “in all this Job sinned not” ([[Job 1:22]]; the friends' error is taken up at [[Job 4:7]]).
    sources: [nrsvue, bd-job-book, ot-minute-job-36, gs-job]
  - ref: 21
    phrase: for this hast thou chosen rather than affliction
    kind: history
    title: Iniquity chosen over affliction
    body: |
      Elihu warns Job against choosing to remain stubborn about his own standing before God rather than accept his suffering. Translations of verses 17–21 part ways. Where the King James says Job has “fulfilled the judgment of the wicked,” a modern translation has him “obsessed with the case of the wicked”; where the King James warns that “a great ransom cannot deliver thee,” the same translation reads, “do not let the greatness of the ransom turn you aside”; and for “this hast thou chosen rather than affliction” it has “because of that you have been tried by affliction.”

      One older reading follows the second sense of verse 18. The ransom (the word of [[Job 33:24]]) is the price of Job's restoration, which is humble submission to God's discipline, and Elihu warns him not to be turned from the right way as though that price were too great. In the same reading, verse 21 keeps the King James sense and is the heart of the warning: Job presses on toward the judgment seat of a terrible Judge instead of humbling himself under His hand, and so has given iniquity the preference over quiet, resigned endurance.

      Part of the charge holds: although Job did not bring his suffering on himself, he was still responsible for how he answered it, and the LORD Himself will say that Job darkened counsel “by words without knowledge” ([[Job 38:2]]). Yet the same LORD will say that Job, more than his friends, had spoken of Him “the thing that is right” ([[Job 42:7]]). Job spoke from his experience and with a desire to restore his relationship with God, and the road he took, missteps and all, brought him face to face with God.
    sources: [nrsvue, delitzsch-job, ot-minute-job-36]
  - ref: 29
    phrase: the noise of his tabernacle
    kind: symbol
    title: Thunder from His pavilion
    body: |
      The “tabernacle” is the storm cloud pictured as God's booth, and its “noise” is the thunder. The King James “tabernacle” is *sukkāh*, a booth of interwoven boughs, the rough shelter of a watchman or a soldier in the field; used of God, it is the clouds as His temporary enclosure in the storm. The same word stands in the psalm where the King James calls it a “pavilion”: “his pavilion round about him were dark waters and thick clouds of the skies” ([[Ps. 18:11]]). A modern translation of Elihu's line reads, “the thunderings of his pavilion.”

      The image fits Elihu's line three verses earlier, “God is great, and we know him not” (verse 26): no one can understand God or His works. His praise of God's works and unsearchable ways, which runs on through chapter 37, is the part of his speech that comes nearest to what follows; in one Latter-day Saint reading it in some respects anticipated the theophany, God's own appearance. When the LORD answers Job, it is “out of the whirlwind” ([[Job 38:1]]), and with questions about the same rain, cloud and lightning ([[Job 38:25–28]]; [[Job 38:34–35]]).
    sources: [bdb, oshb-wlc, nrsvue, tanner-considered-job, ot-minute-job-36]

christ: |
  Scripture says that the Son Himself learned through suffering: “Though he were a Son, yet learned he obedience by the things which he suffered” ([[Heb. 5:8]]), and He suffered “yet without sin” ([[Heb. 4:15]]). The book of Job makes the same distinction for a disciple, since affliction does not necessarily mean that a person has sinned. The Lord's word to Joseph Smith in Liberty Jail, “all these things shall give thee experience, and shall be for thy good” ([[D&C 122:7]]), comes from the One who “hath descended below them all” ([[D&C 122:8]]), so a disciple's affliction can teach without being a sentence.

