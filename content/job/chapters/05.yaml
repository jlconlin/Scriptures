chapter: 5
title: Happy Is the Man Whom God Correcteth
tagline: Eliphaz finishes his first speech. No holy one will answer a man who rages against God, man is born to trouble, and the wise man seeks God, accepts His chastening, and is restored.
when: "The first round: Eliphaz"

setting: |
  Chapter 5 is the second half of the first speech in the dialogue. Eliphaz the Temanite (on the three friends, see [[Job 2:11]]) is the first to answer Job's lament, and in chapter 4 he began gently, reminding Job that he had once strengthened others who were in trouble, and telling of a voice in the night that asked whether mortal man could be more just than God (see [[Job 4:12]]). His premise, that the innocent do not perish, is weighed at [[Job 4:7]]. Here he draws out what follows from it: the fool who resents his lot is ruined, and the wise man brings his case to God and accepts His correction.

  Much of what Eliphaz says is true in itself. Paul quotes his line about God taking the wise in their craftiness (verse 13), and Joseph Smith echoed it from Liberty Jail. But the reader knows from the prologue what Eliphaz does not: God Himself has called Job “perfect and upright” ([[Job 1:8]]), and neither Job nor his children are suffering for anything they have done. The editors of Joseph Smith's papers list chapters 4–5 among the speeches in which the friends charged Job with transgression, the charge the Lord told Joseph his own friends did not bring against him ([[D&C 121:10]]).

thread: |
  Eliphaz sets two men side by side: the man who does not trust God (verses 1–7) and the man who does (verses 8–27).

  He begins with the **fool**. Job may cry out, but none of the holy ones will answer him, and resentment kills the fool (verses 1–2). Eliphaz has seen such a man take root and has watched his home fall under a curse, his children crushed in the gate and his harvest eaten by strangers (verses 3–5). Trouble does not sprout from the ground like a weed; man is born to it (verses 6–7).

  Then he says what he would do in Job's place: **seek unto God** (verse 8). A short hymn follows to the God who does unsearchable things, sends the rain, lifts the lowly, and catches the crafty in their own schemes, so that the poor have hope (verses 9–16).

  At verse 17 the speech turns persuasive. **Happy is the man God corrects**: He wounds and He heals, and the man who accepts His chastening will be kept through famine, war, slander and wild beasts, will live at peace with his fields, will see his children multiply, and will come to his grave full of years (verses 17–26). The promises climb as they go. Eliphaz ends by vouching for all of it from experience: “we have searched it, so it is” (verse 27).

sections:
  - range: 1-7
    heading: The fool and his trouble
    plain: |
      Call out, then: is there anyone who will answer you? To which of the holy ones will you turn? Anger kills the fool, and envy slays the simple. I have seen a fool putting down roots, and at once I cursed his home. His children are far from safety; they are crushed at the gate, where justice is done, and no one rescues them. The hungry eat up his harvest, taking it even from among the thorns, and robbers swallow his wealth. Misery does not come up out of the dust, and trouble does not sprout from the ground; yet man is born to trouble, as surely as sparks fly upward.
  - range: 8-16
    heading: Seek unto God
    plain: |
      As for me, I would seek God and lay my case before Him. He does great things past searching out, wonders without number. He gives rain to the earth and sends water on the fields. He sets the lowly on high and lifts those who mourn to safety. He frustrates the plans of the crafty so that their hands accomplish nothing. He catches the wise in their own cunning, and the schemes of the crooked are swept away. They meet darkness in daylight and grope at noon as though it were night. But He saves the poor from the sword, from their mouth, and from the hand of the mighty. So the poor have hope, and injustice shuts its mouth.
  - range: 17-27
    heading: Happy is the man whom God correcteth
    plain: |
      How happy is the man whom God corrects! So do not despise the discipline of the Almighty. He wounds, and He binds up; He strikes, and His hands heal. He will rescue you from six troubles, and in seven no harm will touch you. In famine He will redeem you from death, and in war from the power of the sword. You will be hidden from the lash of the tongue and will not be afraid when destruction comes. You will laugh at destruction and famine and will not fear the wild beasts, for you will be in league with the stones of the field, and the wild animals will be at peace with you. You will know that your tent is safe; you will look over your home and find nothing lacking. You will know that your descendants will be many, your offspring like the grass of the earth. You will come to your grave in ripe old age, like sheaves brought in at the end of harvest. See: we have searched this out, and it is so. Hear it, and know it for your own good.

notes:
  - ref: 1
    phrase: to which of the saints wilt thou turn?
    kind: history
    title: The holy ones
    body: |
      The “saints” here are heavenly beings, not holy people on earth. The Hebrew word, “holy ones” in the footnote, is used of angels in Job and the Psalms, and Eliphaz uses it again of the beings in whom God “putteth no trust” ([[Job 15:15]]). Here they are probably the members of the divine council of the prologue (see [[Job 1:6]]), and Eliphaz's point is that only a fool would rely on anyone but God Himself.
    sources: [bdb, ot-minute-job-4]

  - ref: 4
    phrase: His children are far from safety
    kind: history
    title: The fool’s children
    body: |
      Eliphaz's story of the fool whose home he cursed (verse 3) ends with the fool's children ruined, and Job's children have just died ([[Job 1:19]]). Whether Eliphaz means them is not certain. He may be implying that Job's children suffered for their father's sins, or he may be speaking in general without thinking of Job's loss. Either way, said to a man whose children had just perished, the words could imply that they got what they deserved.

      The children are crushed “in the gate,” the city's court of justice, “neither is there any to deliver them.” In one older reading Eliphaz's curse was not a prophecy of his own but his recognition of a curse God had already laid on the fool's home, a curse that falls on his children and, in the next verse, on his harvest.

      Eliphaz leaves the matter open; Bildad will not. He assumes that Job's children were cast away for their own transgression ([[Job 8:4]]).
    sources: [ot-minute-job-4, delitzsch-job]

  - ref: 7
    phrase: as the sparks fly upward
    kind: words
    title: Born unto trouble
    body: |
      Verses 6 and 7 make one claim: trouble belongs to the order of things. It does not spring up out of the ground like weeds; in one older reading it is “established in the divine order of the world, as it is established in the order of nature that sparks of fire should ascend.” The line is a proverb that teaches a moral truth by an ordinary sight. The Hebrew for “sparks” is *bĕnê rešep*, “children of the flame,” since *rešep* is a flame or fire-bolt: as surely as a fire throws off sparks, man is born to trouble.

      For Eliphaz the proverb sets up his counsel. If trouble is every man's lot, the fool rages against it and is destroyed (verse 2), and the wise man takes it to God (verse 8). On that reading, a man's wisdom “consists in accommodating himself to his lot.”
    sources: [delitzsch-job, bdb]

  - ref: 13
    phrase: He taketh the wise in their own craftiness
    kind: scripture
    title: Taken in their own craftiness
    body: |
      Eliphaz's line about the crafty is one that Paul quotes as scripture: “For the wisdom of this world is foolishness with God. For it is written, He taketh the wise in their own craftiness” ([[1 Cor. 3:19]]). Paul uses it to warn the Saints at Corinth against glorying in men's wisdom ([[1 Cor. 3:18–21]]). In its own place it belongs to Eliphaz's short hymn (verses 9–16) to the God who overturns fortunes, frustrating schemers and lifting the lowly to safety, so that “the poor hath hope.”

      Joseph Smith took up the line from Liberty Jail. In his letter of 20 March 1839, the letter in which the Lord tells him “thou art not yet as Job” because his friends do not “charge thee with transgression, as they did Job” ([[D&C 121:10]]), he goes on to say of those who did charge him that God would “prove them also and take them in there own craftiness.” The editors of his papers point that phrase to this verse. The same editors count Eliphaz's speech in chapters 4–5 among those that charged Job with transgression, so in the letter his saying falls on accusers of the kind he was.
    sources: [lds-scriptures, jsp-letter-1839-03-20]

  - ref: 17
    phrase: 'happy is the man whom God correcteth: therefore despise not thou the chastening'
    kind: scripture
    title: The chastening of God
    body: |
      Eliphaz's counsel at verse 17 is scripture's own teaching; the trouble lies in where he aims it. The verse and the next are close to [[Prov. 3:11–12]], whose exhortation Hebrews repeats to the Saints: “My son, despise not thou the chastening of the Lord, nor faint when thou art rebuked of him” ([[Heb. 12:5]]). In one reading Eliphaz is partly quoting and partly paraphrasing Proverbs, mixing scripture with the wisdom of men.

      As counsel to a sinner it is sound. But Job is not suffering for sin, so what has happened to him is not God's correction at all, and for Job to follow Eliphaz's advice and admit to sin would have breached his integrity. (The friends' assumption that suffering means sin is taken up at [[Job 4:7]].)
    sources: [stirling-job, ot-minute-job-4, lds-scriptures]

  - ref: 17
    phrase: the Almighty
    kind: words
    title: Shaddai, the Almighty
    body: |
      “The Almighty” is *Shaddai*, and this is the first of its 31 appearances in Job, more than in all the rest of the Bible together. It is an old name: God made Himself known to the patriarchs as *El Shaddai*, “God Almighty” ([[Gen. 17:1]]; [[Exod. 6:3]]), and later writers used *Shaddai* as an archaism (as Naomi does, [[Ruth 1:20]]). Its original meaning is uncertain, its etymology “dubious”; the proposals, among them the rabbis' “the (self-)sufficient one,” are set out at [[Gen. 17:1]]. The Greek translators often rendered it *pantokratōr*.
    sources: [bdb]

  - ref: 26
    phrase: like as a shock of corn cometh in in his season
    kind: symbol
    title: Eliphaz’s promises
    body: |
      Eliphaz's promises (verses 19–26) end with a picture of a good death: a man brought to his grave in ripe old age, as grain is brought in when it is ready. In one older reading the “shock” is a heap of sheaves carried up to the high threshing floor at “the latest period of harvest,” and the “full age” is the maturity of old age.

      The promises climb toward that picture. “In six troubles: yea, in seven” is the pattern of the number proverbs (as in [[Prov. 6:16]]), where the second number outdoes the first: “in six troubles, yea in still more than six.” Famine, war, the lash of the tongue and wild beasts will not touch the man God corrects, and even the land will be his ally. To be “in league with the stones of the field” is, on that reading, for the stones to stop spoiling his fields and the wild beasts to stop harming his herds, the peace with creation that Hosea promises Israel in the last days ([[Hosea 2:18]]), given here to one man. On the same reading, “shalt not sin” at verse 24 means that when he looks over his household he will lack nothing and go not astray.

      Eliphaz is sure of all of it: if a man lives righteously, the Lord will deliver him from famine, war and destruction, and he will die peaceably of old age.
    sources: [delitzsch-job, tanner-considered-job]

  - ref: 27
    phrase: we have searched it, so it is
    kind: history
    title: We have searched it
    body: |
      Eliphaz closes by naming his authority, and it is experience, not revelation. He seems to speak for all three friends, and he offers what they have observed as settled: “so it is.” The friends stand for conventional religion and the wisdom of tradition, relying on their own experience, and here Eliphaz shows where his counsel comes from. Theirs are “counsels based on human reason about suffering in general—upon hearsay, as it were—not upon revelation about Job's particular predicament.”

      Verse 9 had allowed for something else: the God who “doeth great things and unsearchable.” For a moment Eliphaz entertained the possibility that the Lord's judgment may not be easy to read; on the whole he remains certain of his own.
    sources: [stirling-job, tanner-considered-job]

christ: |
  Eliphaz's account of suffering has no room for a righteous man who suffers, and the Savior's life does not fit it. Jesus Christ was without sin, and yet He was “a man of sorrows, and acquainted with grief” ([[Isa. 53:3]]); “though he were a Son, yet learned he obedience by the things which he suffered” ([[Heb. 5:8]]). His righteousness did not shield Him from suffering, and much of His suffering came because He was righteous.

  Righteous living does not spare a disciple from all suffering. Heavenly Father teaches His children in all their afflictions, whatever the reason they come.

explore: |
  - **Chastening as a father's love.** [[Heb. 12:5–11]] gives the reason for the chastening Eliphaz commends: “for our profit, that we might be partakers of his holiness” (verse 10).
  - **Liberty Jail.** [[D&C 121:7–10]], where the Lord sets Joseph Smith's trial beside Job's.

sources: [bdb, delitzsch-job, ot-minute-job-4, stirling-job, tanner-considered-job, jsp-letter-1839-03-20, lds-scriptures]
