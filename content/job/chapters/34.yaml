chapter: 34
title: Far Be It from God
tagline: Elihu turns from Job to the listeners. He quotes Job's complaints against God, defends God as a Judge who cannot do wrong and needs no hearing, and asks that Job's trial go on to the end.
when: "Elihu's second speech"

setting: |
  Chapter 34 is Elihu's second speech. The young man who broke into the debate in chapter 32 (who he is, and why he is angry, is explained at [[Job 32:2]]) spoke to Job in chapter 33. Now he turns to the bystanders, the “wise men” and “men of understanding” of verses 2, 10 and 34, and speaks about Job before them, calling him by name. He denounces Job at the beginning and the end of the speech and sets a portrait of God between.

  What shocks Elihu is what he takes for Job's impiety, his words about God (verses 5–9, 35–37): grounds other than the friends'. Yet at the words that became [[D&C 121:10]], “charge thee with transgression, as they did Job” (explained at [[Job 4:7]]), the editors of Joseph Smith's letter list his chapters with the friends' speeches. Job makes no reply to him, here or later.

thread: |
  Elihu's claim is that God cannot do wrong, so a man who says God has denied him justice has spoken like the wicked. He opens by asking the listeners to test words as the palate tests food (verses 2–4), quotes Job's protest of innocence (verses 5–6), and draws a harsh conclusion from it: Job drinks scorn like water, keeps company with evildoers, and says that serving God does a man no good (verses 7–9).

  The center of the speech (verses 10–30) is Elihu's portrait of God. God will not act wickedly; He repays every man by his ways (verses 10–12). No one handed Him the earth to govern, and if He drew back His spirit and breath all flesh would die (verses 13–15). He shows no favor to princes over the poor (verses 16–20). He sees every step, so that no darkness hides the wicked, and He needs no hearing before He overthrows them in a night and answers the cry of the afflicted (verses 21–30).

  At verse 31 Elihu turns to what a man ought to say to God, and asks whether God should repay on Job's terms (verses 31–33). He closes with a verdict he expects the wise to share: Job has spoken without knowledge, and his trial should go on to the end, for he adds rebellion to his sin (verses 34–37).

sections:
  - range: 1-9
    heading: What man is like Job
    plain: |
      Elihu went on: Listen to my words, you wise men; hear me, you who know. The ear tests words as the mouth tastes food. Let us choose for ourselves what is right and decide among us what is good. For Job has said, “I am in the right, and God has taken away my justice. Should I lie about my own case? My wound is incurable, though I have not sinned.” What man is like Job, who drinks up mockery like water, who goes along with evildoers and walks with wicked men? For he has said, “It does a man no good to take delight in God.”
  - range: 10-30
    heading: Far be it from God
    plain: |
      So listen to me, you men of understanding. Far be it from God to do evil, and from the Almighty to do wrong. He repays a man for what he does and brings on each what his ways deserve. Surely God will not act wickedly; the Almighty will not twist justice. Who put the earth in His charge, or who appointed Him over the whole world? If He set His mind on it and gathered back to Himself His spirit and breath, all flesh would perish together and man would return to dust. If you understand, hear this. Can one who hates justice govern? Will you condemn Him who is perfectly just? Who says to a king, “You are worthless,” or to nobles, “You are wicked”? How much less to Him who shows no favor to princes and does not prefer the rich to the poor, since all of them are His handiwork? In a moment they die; at midnight the people are shaken and pass away, and the mighty are taken without a human hand. His eyes are on a man's ways; He sees every step. There is no darkness, no deep shadow, where evildoers can hide. He has no need to set a man a time to come before God in judgment. He shatters the mighty without inquiry and puts others in their place. He knows their deeds, overturns them in the night, and they are crushed. He strikes them for their wickedness where others can see, because they turned from following Him and paid no heed to His ways, and so brought the cry of the poor before Him, and He heard the cry of the afflicted. When He gives quiet, who can make trouble? When He hides His face, who can see Him? He rules a nation and a single man alike, so that the godless will not reign and ensnare the people.
  - range: 31-37
    heading: Job hath spoken without knowledge
    plain: |
      It is fitting to say to God, “I have borne my punishment; I will not offend again. Teach me what I cannot see; if I have done wrong, I will do it no more.” Should God repay on your terms? He will repay, whether you refuse or choose. You must choose, not I; so say what you know. Men of understanding will tell me, and the wise who hear me will say, “Job speaks without knowledge; his words lack insight.” I wish Job were tried to the limit for answering like wicked men. For he adds rebellion to his sin; he claps his hands in scorn among us and multiplies his words against God.

notes:
  - ref: 5
    phrase: For Job hath said, I am righteous
    kind: scripture
    title: Job’s words quoted back
    body: |
      Elihu builds his case by quoting Job, and the quotations are close to what Job said. “I know that I shall be justified,” Job had said ([[Job 13:18]]), and in one older reading that is the very claim of verse 5, with the protest that God “hath taken away my judgment” taken from [[Job 27:2]]. In the same reading, verse 6 gives the bind Job had described: though right is on his side, the wound God has given him makes him out to be a liar. Job had put it this way: “If I justify myself, mine own mouth shall condemn me” ([[Job 9:20]]).

      What is new is the audience. Elihu names Job before the listeners and asks them to judge what he said (verses 2–4).
    sources: [delitzsch-job, stirling-job]
  - ref: 9
    phrase: It profiteth a man nothing that he should delight himself with God
    kind: history
    title: What profit in delighting in God?
    body: |
      Elihu here puts in Job's mouth a sentence found nowhere in Job's speeches: that it does a man no good to take delight in God. In one older reading, Job never said it in so many words, though his claim that God “destroyeth the perfect and the wicked” ([[Job 9:22]]) and his complaints that the wicked prosper ([[Job 21:7]]; [[Job 24:1]]) lead toward it. The same reading finds Elihu harsher here than the friends ever were: a man who “drinketh up scorning like water” (verse 7) is one who gives himself to mockery with delight, and Elihu sets Job among “the workers of iniquity” (verse 8).

      The question beneath the charge is the book's own. Whether goodness pays was Satan's question at the start, “Doth Job fear God for nought?” ([[Job 1:9]]), and one Latter-day Saint reading sees in Elihu's objection to Job's talk of profit an insight into an important theme of the book, the charge that Job's relationship with God was a transaction. Elihu presses the question again at [[Job 35:3]], where that reading is taken further.
    sources: [delitzsch-job, ot-minute-job-35]
  - ref: 12
    phrase: neither will the Almighty pervert judgment
    kind: scripture
    title: God will not pervert judgment
    body: |
      Verse 12 is the main thesis of all Elihu's speeches. It is true (“the judgments of the LORD are true and righteous altogether,” [[Ps. 19:9]]), and it is not new: Bildad had asked, “Doth God pervert judgment?” ([[Job 8:3]]), and one older reading sets Bildad's question beside verse 12, which puts the claim of verse 11 in the negative. What Elihu adds is the ground for it in verses 13–15. No one gave God the earth to govern, so He is no deputy who answers to a higher lord: He is the Creator. And every living thing has its life from His spirit and breath, which Elihu had confessed of himself (“the breath of the Almighty hath given me life,” [[Job 33:4]], a verse that older reading cites here); if God drew them back, “all flesh shall perish together,” as the psalm says of the creatures ([[Ps. 104:29]]) and the Preacher of the spirit returning to God ([[Eccl. 12:7]]). In that older reading the creation is itself the proof: the world is God's own by His free creative appointment, not a duty laid on Him from without, and He keeps every creature alive by His breath when He might let it fall into nothingness, a love that is “the perfect opposite of sovereign caprice” and so “a pledge for the absolute righteousness of the divine rule.”
    sources: [bd-job-book, delitzsch-job, lds-scriptures]
  - ref: 23
    phrase: that he should enter into judgment with God
    kind: words
    title: No day in court
    body: |
      Verse 23 answers Job's demand for a hearing: God, says Elihu, needs none. The King James “he will not lay upon man more than right” is hard to follow, and a modern translation reads the line differently: God “has not appointed a time for anyone” to go before Him in judgment, and in the next verse God shatters the mighty “without investigation.” In one older reading the verb does not mean “lay upon” but to fix one's attention on a man: the all-seeing God does not need to watch anyone long before bringing him to judgment, because He knows him through and through before any inquiry. The same reading hears in the line an allusion to Job's longing to stand before God's tribunal, the hearing Job has asked for ([[Job 13:3]]; [[Job 23:3–4]]).
    sources: [nrsvue, delitzsch-job]
  - ref: 31
    phrase: I have borne chastisement, I will not offend any more
    kind: scripture
    title: The confession Elihu wants
    body: |
      Verses 31–32 hold the confession Elihu thinks a man under God's hand should make: “That which I see not teach thou me: if I have done iniquity, I will do no more.” The King James reads the lines as counsel; a modern translation reads them as a question, “For has anyone said to God…?” Either way, they stand where Elihu turns back to denouncing Job for sin (verses 31–37).

      Suffering can teach as well as punish (see the note on [[Job 33:14]]). But Elihu holds the confession up to Job, whom the LORD had called “a perfect and an upright man” ([[Job 1:8]]; why the friends' charge fails is at [[Job 4:7]]).
    sources: [nrsvue, stirling-job]
  - ref: 35
    phrase: Job hath spoken without knowledge
    kind: scripture
    title: Without knowledge
    body: |
      Elihu's verdict on Job has some truth in it, as one Latter-day Saint reading allows, because the LORD says much the same. When the LORD speaks from the whirlwind, His first question is, “Who is this that darkeneth counsel by words without knowledge?” ([[Job 38:2]]), and Job takes back what he said ([[Job 42:3]]). But the LORD also says that Job, more than his friends, had “spoken of me the thing that is right” ([[Job 42:7]]).

      In verses 36–37 Elihu presses the charge further. He wishes Job “tried to the limit,” as a modern translation renders it, because Job answers as the wicked do; and he says Job adds rebellion to his sin and claps his hands among them. One Latter-day Saint reading holds that Elihu, whose speeches echo the whirlwind's, stands under the same divine disapproval as the other comforters (see the note on [[Job 32:8]]).
    sources: [ot-minute-job-36, bd-job-book, nrsvue, tanner-considered-job]

christ: |
  Elihu's thesis is true: God will not pervert judgment. But Elihu pictured a God who overthrows the wicked without bringing anyone before Him in judgment, and one Latter-day Saint reading finds that God far from the One who sent His Son to be lifted up on the cross, so that all men would be lifted up “to stand before me, to be judged of their works” ([[3 Ne. 27:14]]). Every person will have that hearing, before the Savior who was lifted up for them. Until then, a disciple's afflictions are not that verdict: having afflictions “does not necessarily mean that a person has sinned.”

explore: |
  - **Job's demand for a hearing.** [[Job 13:18–22]], [[Job 23:3–7]] and [[Job 31:35]], and the LORD's answer from the whirlwind, [[Job 38:1–3]].
  - **Whether goodness pays.** Satan's question at [[Job 1:9]], Elihu's at [[Job 35:3]], and King Benjamin on unprofitable servants, [[Mosiah 2:21]].

sources: [bd-job-book, gs-job, jsp-letter-1839-03-20, stirling-job, delitzsch-job, ot-minute-job-35, ot-minute-job-36, nrsvue, tanner-considered-job, lds-scriptures]
