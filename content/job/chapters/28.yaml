chapter: 28
title: The Fear of the Lord, That Is Wisdom
tagline: Job's poem on wisdom. Men dig silver and gold out of the dark and trade in precious stones, but wisdom can be neither dug up nor bought; God alone knows its place, and He has told man that the fear of the Lord is wisdom.
when: 'The end of the third round: Job''s poem on wisdom'

setting: |
  Chapter 28 stands inside Job's last speech to his friends. The heading at 27:1, “Moreover Job continued his parable,” opens that speech; the same words open chapter 29, and no other speaker is named between them. The text, then, gives the poem to Job, and one Latter-day Saint reading calls it his “hymn to wisdom,” while granting that the text does not make this explicit. The third round of the dialogue has run down by now: Bildad's last speech was brief, and Zophar does not speak again (see the setting of [[Job 25]]).

  The tone changes. After chapters of argument, the poem steps back from the quarrel and asks one question twice: where can wisdom be found (verses 12, 20)? In one older reading the chapter is the clasp that joins the two halves of the book, and Job closes the dialogue with it by setting the fear of God before himself and his friends as man's true wisdom. A Latter-day Saint reading puts it at the start of Job's preparation to meet God: he has moved beyond arguing with the friends and now waits on God, and the preparation runs through his oaths of innocence in chapter 31.

thread: |
  The poem's claim is that human skill can reach every hidden treasure but not wisdom, which only God knows, and He has told man what his share of it is. It opens in a mine (verses 1–11). Men dig silver, gold, iron and copper out of the earth, light up its darkness, hang on ropes in shafts far from other people, and walk paths that no hawk has seen and no lion has trodden, since no creature of the surface reaches the earth's interior but man. They split the rock, cut channels, and bring what was hidden to light.

  Verse 12 turns the poem: but where shall wisdom be found? No one knows its price; the deep and the sea say it is not in them (verses 13–14). Nor can it be bought: gold, the gold of Ophir, onyx, sapphire, crystal, coral and pearls are named one after another, and none of them comes near its price (verses 15–19). The question comes again (verse 20). Wisdom is hidden from every living eye, even the birds', and Destruction and Death, Abaddon and the realm of the dead (see [[Job 26:6]]), have only heard a rumor of it (verses 21–22). No creature, living or dead, can lead a man to it.

  Then the answer. God understands the way to it and knows its place, for He sees the ends of the earth (verses 23–24). When He made the world, weighing the wind, measuring the waters, setting a decree for the rain and a path for the thunderbolt, He saw wisdom, declared it and established it (verses 25–27). And to man He said what man's wisdom is: to fear the Lord and depart from evil (verse 28).

sections:
  - range: 1-11
    heading: A Vein for the Silver
    plain: |
      There is a mine for silver and a place where gold is refined. Iron is taken out of the earth, and copper is smelted from ore. Miners put an end to darkness; they search out to the farthest limits the ore that lies in gloom and deep darkness. They open shafts far from where people live; forgotten by anyone walking above, they hang and sway, far from other men. Out of the earth's surface comes bread, but underneath it is turned up as if by fire. Its stones hold sapphires, and its dust holds gold. No bird of prey knows that path; the falcon's eye has never seen it. Proud wild beasts have not trodden it; the lion has not passed over it. The miner puts his hand to the flint and overturns mountains by their roots. He cuts channels through the rock, and his eye sees every precious thing. He holds back the rivers and streams and brings hidden things to light.
  - range: 12-22
    heading: Where Shall Wisdom Be Found?
    plain: |
      But where can wisdom be found? Where is the place of understanding? No mortal knows its price, and it is not found in the land of the living. The deep says, “It is not in me,” and the sea says, “It is not with me.” It cannot be bought with gold, and silver cannot be weighed out as its price. It cannot be valued against the gold of Ophir, precious onyx or sapphire. Gold and crystal cannot equal it, nor can it be traded for jewels of fine gold. Coral and pearls are not worth mentioning; the price of wisdom is above them all. The topaz of Ethiopia cannot compare with it; it cannot be valued in pure gold. Where then does wisdom come from? Where is the place of understanding? It is hidden from the eyes of every living thing, concealed even from the birds of the air. Destruction and Death say, “We have heard only a rumor of it.”
  - range: 23-28
    heading: God Understandeth the Way Thereof
    plain: |
      God understands the way to it, and He knows its place. For He looks to the ends of the earth and sees everything under the heavens. When He gave the wind its weight and measured out the waters, when He made a decree for the rain and a path for the thunderbolt, then He saw wisdom and declared it; He established it and searched it out. And He said to man: “Behold, the fear of the Lord, that is wisdom; and to turn away from evil is understanding.”

notes:
  - ref: 1
    phrase: Surely there is a vein for the silver
    kind: symbol
    title: The mine
    body: |
      The poem opens in a mine to praise human ingenuity at its height. Silver, gold, iron and copper are dug out of the earth (verses 1–2), and the miner walks a path that no hawk's eye has seen and no lion has trodden (verses 7–8). The “he” of verses 3 and 9–11 is the miner: a modern translation says “Miners” in verse 3, noting that the Hebrew has “He,” and “They” in verses 9–11. His eye, verse 10 says, “seeth every precious thing.” That is what makes verse 12 land: there is one thing he cannot dig up.

      One Latter-day Saint reading sees Job himself in the mine. Mining happens alone and far from people, in darkness, on hidden paths; it brings hidden things to light and yields gold that fire has transformed. On that reading the picture fits Job's own trial, and his earlier words, “when he hath tried me, I shall come forth as gold” ([[Job 23:10]], where the image is explained), suggest that the fire has given him wisdom.
    sources: [nrsvue, stirling-job]
  - ref: 4
    phrase: The flood breaketh out from the inhabitant
    kind: words
    title: Shafts and ropes
    body: |
      Verse 4 describes a mine shaft and the men who go down it on ropes, though the King James is hard to recognize as that. Its “flood” translates a Hebrew word for a stream bed, like the Arabic *wadi*, which in one older reading means here the hollow cut down into the earth: the shaft. A modern translation gives the verse as “They open shafts in a valley away from human habitation; they are forgotten by travelers; they sway suspended, remote from people.” The miners, forgotten by every foot that passes over the ground above, hang and swing far from other men.

      The verse is among the hardest in the chapter. The same older reading notes that seeing the shaft and the rope in it is the work of later interpreters, two of whom knew mining at first hand, and that earlier readers found the line simply dark.
    sources: [delitzsch-job, nrsvue]
  - ref: 15
    phrase: It cannot be gotten for gold
    kind: symbol
    title: Above rubies
    body: |
      Verses 15–19 make the mine's point again from the side of trade: wisdom is not for sale at any price. The poem lists what wealth is made of: refined gold and weighed silver, the gold of Ophir ([[1 Kgs. 9:28]]), onyx and sapphire, crystal, coral and pearls, the topaz of Ethiopia. The stones are not all certain: a modern translation calls the King James “rubies” (verse 18) “pearls,” offers “lapis lazuli” for “sapphire” (verse 16), and has “the chrysolite of Cush” for “the topaz of Ethiopia” (verse 19). Whatever the stones were, wisdom is worth more than all of them.
    sources: [nrsvue]
  - ref: 27
    phrase: Then did he see it, and declare it
    kind: scripture
    title: Wisdom at the creation
    body: |
      God knows the way to wisdom because He saw it when He made the world. Verses 25–27 date the moment: when He gave the wind its weight, measured the waters, made a decree for the rain and a path for the thunderbolt, then He saw wisdom, declared it, established it and searched it out. In one older reading wisdom here is the pattern of all things that God had in view as He created, and He declared it by creating a world that realizes it. The same reading sets the passage beside Proverbs 8:22–31, where Wisdom says that the LORD possessed her “in the beginning of his way, before his works of old” ([[Prov. 8:22]]; the site's note there says how the New Testament speaks of Christ in the same terms). On that reading man cannot find wisdom by digging because it is not in the ground: it is God's design of all things before He made them, and only its Maker knows its place.

      A Latter-day Saint reading, offered in place of the older one above, turns the verse toward man. God alone knows the way to wisdom *for man*, and that way is the creation itself: an earth where God can put His questions to man, and where man, answering them well, takes part in God's work and learns wisdom. On that reading Job, holding to God through his trial instead of to the friends' conventional answers, is learning it, and coming forth as gold.
    sources: [delitzsch-job, stirling-job, lds-scriptures]
  - ref: 28
    phrase: the fear of the Lord, that is wisdom
    kind: scripture
    title: The fear of the Lord, that is wisdom
    body: |
      The poem ends with God's own word to man: man cannot know wisdom as God knows it, but he can live by it, by revering the Lord and turning away from evil. In one older reading this is “man's share of wisdom, this is his relative wisdom, by which he remains in connection with the absolute.” It is the motto of Israel's wisdom, the saying Proverbs sets at the head of its teaching ([[Prov. 1:7]]); what godly fear means is explained with [[Ps. 111:10]].

      “The Lord” here is *ʾAdonai*, “my Lord,” not the divine name the King James prints as “LORD.” And in the Hebrew, “depart from evil” is the same Hebrew verb with the same object, in another form, that the King James renders “eschewed evil” in the book's first verse, where Job is “one that feared God, and eschewed evil” ([[Job 1:1]]; the LORD says it of him again in [[Job 1:8]] and [[Job 2:3]]). The wisdom God names for man is what the book said of Job in its first verse.

      That is why it matters where the poem stands. In one older reading Job closes his dialogue with the friends here: though he cannot see through the mystery of his affliction, he must still hold to the fear of God, and the friends must do the same instead of wronging him “in order to solve the mystery.”
    sources: [delitzsch-job, oshb-wlc, lds-scriptures]

christ: |
  In one older reading the wisdom God saw at the creation is the pattern after which the Logos, the Word of whom John says “All things were made by him” ([[John 1:3]]), made the world, though the poem does not yet see so far and only the New Testament made it plain. The wisdom Job could not dig up comes to man from God, and its human form is the one verse 28 names. The book of Job “never answers the why” of suffering, and Job learns to trust God rather than his own understanding; a disciple who cannot see the reason for a trial can still revere the Lord and depart from evil, and that is wisdom whether or not the reason is ever given.

