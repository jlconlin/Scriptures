chapter: 20
title: The Triumphing of the Wicked Is Short
tagline: Zophar, insulted by Job's warning, answers with a portrait of the wicked rich man whose sweet sin turns to poison and whom heaven and earth rise up to accuse, and he means the portrait for Job.
when: 'The second round: Zophar'

setting: |
  Chapter 20 is Zophar the Naamathite's second speech (on the three friends and their homes, see [[Job 2:11]]), and it closes his part in the dialogue: in the third round he is not given a speech at all (see [[Job 25]]). He is answering chapter 19, where Job had begged his friends for pity, declared “I know that my redeemer liveth” ([[Job 19:25]]), and ended by warning them that their persecution of him would bring the sword of judgment on themselves ([[Job 19:28–29]]).

  Zophar takes up neither the plea nor the testimony. Like the other friends in this round, he turns from Job's situation to restate the way he sees the world, and that view leaves no room for a man who is both innocent and suffering; so he describes the fate of the wicked. Like Bildad's in chapter 18, this is one of the speeches that charged Job “with transgression” ([[D&C 121:10]]; see [[Job 18]]). Why the friends' reasoning fails is taken up once, at [[Job 4:7]].

thread: |
  Zophar's claim is in verse 5: the triumph of the wicked is short. Everything else illustrates it, and the illustration is aimed at Job.

  He begins stung (verses 2–3): Job's words have insulted him, and he cannot keep quiet. Then he states his thesis as something known since man was put on the earth, and shows the wicked man rising to the clouds only to vanish like a dream, his children left to repay the poor he robbed (verses 4–11). At verse 12 the picture turns to eating. The wicked man savors his wickedness like a sweet, and it turns to venom in his stomach; the riches he gulped down he must vomit up, because he crushed the poor and seized houses he did not build (verses 12–22). At verse 23 God Himself acts: He rains His wrath on the man as he eats, an arrow runs him through, an unkindled fire eats his tent, and heaven and earth testify against him (verses 23–28). Verse 29 is the verdict: this is the wicked man's portion from God.

  What is new in this round is what is missing. In his first speech Zophar ended with a way back ([[Job 11:13–19]]); here the friends no longer hold out promises to draw Job to repentance but set before him only the most terrible pictures.

sections:
  - range: 1-3
    heading: My thoughts make me answer
    plain: |
      Then Zophar the Naamathite answered: This is why my thoughts drive me to reply, and why I am in such a hurry: I hear a rebuke that insults me, and my understanding gives me the answer.
  - range: 4-11
    heading: The joy of the wicked lasts a moment
    plain: |
      Don't you know this from of old, ever since man was placed on the earth: that the triumph of the wicked is short, and the joy of the godless lasts only a moment? Though his pride rises to the heavens and his head reaches the clouds, he will perish forever like his own refuse, and those who saw him will ask, “Where is he?” He will fly away like a dream and not be found, chased off like a vision in the night. The eye that saw him will not see him again; his place will not look on him any more. His children will have to seek the favor of the poor, and his own hands will give back his wealth. His bones, full of the sin of his youth, will lie down with him in the dust.
  - range: 12-22
    heading: Sweet in his mouth
    plain: |
      Though wickedness tastes sweet in his mouth, and he hides it under his tongue, and is loath to let it go but keeps it in his mouth, yet his food turns sour in his stomach; it becomes the venom of snakes inside him. He swallowed riches, and he will vomit them up; God will drive them out of his belly. He will suck the poison of snakes; the viper's tongue will kill him. He will never enjoy the streams, the rivers flowing with honey and curds. He will give back what he toiled for and not swallow it down; he will get no joy from the profits of his trade. For he crushed the poor and abandoned them; he seized a house he did not build. His belly will know no ease; he will not save anything he craved. Nothing was left after he had eaten, so his prosperity will not last. In the midst of plenty he will be in distress; every hand of the wicked will come against him.
  - range: 23-29
    heading: The portion of a wicked man
    plain: |
      Just as he is about to fill his belly, God will send His burning anger on him and rain it down on him as he eats. He will flee from an iron weapon, and a bow of bronze will pierce him. The arrow is drawn out of his body, the glittering point out of his gall; terrors come over him. Total darkness waits for his treasures; a fire no one has kindled will consume him and devour what is left in his tent. The heavens will expose his guilt, and the earth will rise up against him. The wealth of his house will be carried away, swept off on the day of God's wrath. This is the wicked man's portion from God, the inheritance God has decreed for him.

notes:
  - ref: 3
    phrase: I have heard the check of my reproach
    kind: history
    title: Stung into answering
    body: |
      Zophar answers because he feels insulted. “The check of my reproach” is the rebuke that shames him, which a modern translation renders “I hear censure that insults me.” Like Bildad before him, Zophar is offended by Job's words and attitude, and those words, which threaten the settled order, deeply disturb him.

      In one older reading, what stings most is Job's threat of judgment at the close of chapter 19, where he warned the friends who persecuted him, “Be ye afraid of the sword: for wrath bringeth the punishments of the sword, that ye may know there is a judgment” ([[Job 19:29]]). That threat sets Zophar's mind in a ferment and makes him “make haste” (verse 2) to reply. The same reading observes that a man is never more eloquent than when he is defending his wounded honor: Zophar's long and vivid portrait of the wicked is, in part, a return blow.
    sources: [nrsvue, delitzsch-job, stirling-job]

  - ref: 5
    phrase: the triumphing of the wicked is short
    kind: scripture
    title: The short triumph of the wicked
    body: |
      Zophar's thesis is that the wicked always get what is coming to them, and soon. That they finally do is hard to argue with as a general truth; it is the *soon* that Job will dispute. The trouble is the use Zophar makes of it: he offers it so that Job will conclude that he too has finally received what was coming to him, and that his future is grim. Zophar's view of the world has no room for a man who is innocent and suffers, so he answers Job's protest of innocence with a description of the wicked.

      Job answers the thesis directly in the next chapter. Far from being short, he says, the prosperity of the wicked often lasts their whole lives: “Wherefore do the wicked live, become old, yea, are mighty in power?” ([[Job 21:7]]; the question is taken up there). One Latter-day Saint reading finds Job refuting Zophar's argument almost point by point, down to an appeal to travelers who have seen how rarely calamity strikes the wicked. Put side by side, the friends insisted that the wicked cannot prosper, and Job acknowledged that the wicked sometimes do prosper in worldly things, “but ultimately the Lord will administer justice on the Day of Judgment.”
    sources: [ot-minute-job-4, stirling-job, seminary-ot-teacher-108]

  - ref: 12
    phrase: Though wickedness be sweet in his mouth
    kind: symbol
    title: Sweet in the mouth, venom within
    body: |
      Zophar pictures sin as food that tastes sweet and turns to poison. The wicked man does not merely sin; he savors it, hides it under his tongue to make it last, and is “loath to let it go,” as a modern translation puts verse 13. Then the same morsel turns in his stomach into “the venom of asps” (verse 14). The riches he has gulped down come back up, and it is God who empties his belly (verse 15). The pleasure and the punishment are one thing: the poison is the very sweetness he would not let go of. The image runs on through the speech: he never tastes the streams of honey and curds (verse 17), cannot swallow what he toiled for (verse 18), and is struck by God's wrath just as he sits down to fill his belly (verse 23).

      As a picture of sin, verses 12–22 are true and well observed, and they help in understanding the nature of sin and its consequences; they do not apply to Job. The picture is not false; the person it is aimed at is wrong.
    sources: [nrsvue, stirling-job]

  - ref: 19
    phrase: he hath oppressed and hath forsaken the poor
    kind: history
    title: A charge with no evidence
    body: |
      Verse 19 gives the reason for the wicked man's fall, and it is a specific crime: he grew rich by crushing the poor and seizing houses he did not build. The punishment matches it. His children will have to seek the favor of the very poor their father ruined, and his hands, through them, will give back what he took (verse 10). The description itself may be true (the covetous, unfeeling rich man is torn from his prosperity), but applied to Job “the fearful truth becomes a fearful lie,” because in Zophar's mind Job is that man.

      Zophar has no evidence for the charge: he takes Job's circumstances and invents hypothetical problems instead of addressing real ones he has seen. In the third round Eliphaz will say it outright, charging Job with taking pledges from his brother for nothing and stripping the naked of their clothing ([[Job 22:5–9]]). Job takes particular exception to the idea in verse 10 that God lays up a man's punishment for his children ([[Job 21:19]]): he argues instead that God should repay each person for his own deeds.
    sources: [delitzsch-job, ot-minute-job-4, lds-scriptures, stirling-job]

  - ref: 24
    phrase: the bow of steel
    kind: words
    title: A bow of bronze
    body: |
      The “steel” of this verse is bronze. The Hebrew word is *nĕḥûšâ*, bronze, and a modern translation has “a bronze arrow”; the King James's “steel” had an older, broader range that took in hardened copper alloys such as bronze. The same “bow of steel” in [[Ps. 18:34]] is explained there, with the bronze-bound bow it probably was. Here the line says only that the man who flees one weapon is struck down by another.
    sources: [oshb-wlc, nrsvue, sc-knowhy-548]

  - ref: 27
    phrase: The heaven shall reveal his iniquity; and the earth shall rise up against him
    kind: scripture
    title: Heaven and earth against him
    body: |
      Zophar's line can be read as turning Job's own appeals to heaven and earth into witnesses for the prosecution. In chapter 16 Job had cried, “O earth, cover not thou my blood,” and then, “my witness is in heaven, and my record is on high” ([[Job 16:18–19]]; the witness is explained there), and in chapter 19 he had declared that his Redeemer lives and will stand upon the earth ([[Job 19:25]]). Zophar answers that heaven will reveal the wicked man's guilt and the earth will rise against him. One Latter-day Saint reading sees in the line a direct attack on Job's confidence in an advocate in heaven, resting on an assumption that the verdict of the community on earth is the same as God's verdict in heaven. In one older reading, Zophar is mercilessly trying to stifle the new trust in God that Job has just found.

      The verse before it does the same with Job's losses. The “fire not blown” (verse 26) is a fire no human hand kindles or tends, and the same older reading identifies it with the “fire of God” of [[Job 1:16]] (as with Bildad's brimstone; see the note on [[Job 18:19]]).
    sources: [stirling-job, delitzsch-job]

  - ref: 29
    phrase: This is the portion of a wicked man from God
    kind: scripture
    title: Zophar’s last word
    body: |
      Zophar's last word to Job in the book is that what has befallen him is the wicked man's “portion” and “heritage,” assigned by God. The third round of speeches gives him no turn ([[Job 25]] says what is missing there).

      The line comes back, nearly word for word, in Job's own mouth: “This is the portion of a wicked man with God, and the heritage of oppressors” ([[Job 27:13]]). One Latter-day Saint reading takes Job there to be quoting Zophar, as if composing for him the speech he no longer makes; that passage is taken up at [[Job 27:13]].
    sources: [ot-minute-job-4, stirling-job]

christ: |
  Zophar made himself Job's judge, and the verdict was false. The Savior's warning bears on that verdict: “Judge not, that ye be not judged. For with what judgment ye judge, ye shall be judged” ([[Matt. 7:1–2]]). Judgment belongs to Christ: “the Father judgeth no man, but hath committed all judgment unto the Son” ([[John 5:22]]), and justice is His to administer at the Day of Judgment, not ours to read off a neighbor's losses.

  Another person's suffering is not evidence against him. A disciple can grant that sin brings sorrow, as Zophar rightly says, and still leave the judgment of a sufferer to the Son, to whom all judgment is committed.

explore: |
  - **Job's answer.** [[Job 21]], where Job takes up Zophar's claim and asks why the wicked live, grow old and prosper.
  - **Zophar's first speech.** [[Job 11]], which still ended in a promise.
  - **Job's side of the question in the Psalms.** [[Ps. 73]], where the psalmist is troubled by the prosperity of the wicked until he goes into the sanctuary of God.

