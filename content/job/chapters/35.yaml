chapter: 35
title: What Givest Thou Him?
tagline: Elihu takes up two things he says Job has claimed, that righteousness does not pay and that God does not hear, and answers that God is beyond the reach of human gain or loss, that cries go unanswered when they do not seek their Maker, and that Job's case already lies before God.
when: 'Elihu''s third speech'

setting: |
  Elihu (on who he is and why he is angry, see [[Job 32:2]]) here makes the third of his speeches. Job has not answered the first two, and he will not answer this one either: Elihu condemns him “on different grounds from the ‘three friends,’” yet “Job makes no reply to him.” The chapter opens “Elihu spake moreover,” and it continues the case of chapter 34, where Elihu quoted Job as saying, “It profiteth a man nothing that he should delight himself with God” ([[Job 34:9]]).

  Elihu's main point here is not new. Eliphaz had already asked whether a man can be “profitable unto God” ([[Job 22:2–3]]); Elihu builds on it, and adds an answer to Job's complaint that God ignores the cry of the oppressed. Much of what he says is wise taken by itself. His trouble is the one the friends shared, that he assumes the suffering and the wicked are the same people (the friends' theology is answered once, at [[Job 4:7]]).

thread: |
  Elihu sets out two sayings he attributes to Job and answers each in turn; a modern translation lays the speech out in two stanzas, verses 1–8 and 9–16.

  The first saying is that Job's righteousness is greater than God's, and that it profits nothing to be cleansed from sin (verses 2–3). Elihu's answer is to look up: the heavens and the clouds are higher than Job, and God is higher still. Sin does nothing against Him and righteousness gives Him nothing; only other men are hurt or helped by what a man does (verses 5–8).

  The second is Job's complaint that God does not hear the oppressed ([[Job 24:12]]). Elihu answers that the oppressed cry out under the arm of the mighty, but none of them asks, “Where is God my maker?” God does not hear an empty cry (verses 9–13). Even Job's protest that he cannot see God is no reason to give up: the case is before Him, and Job should trust in Him (verse 14). Elihu ends with his verdict: Job opens his mouth in vain and multiplies words without knowledge (verses 15–16).

sections:
  - range: 1-4
    heading: Job's two claims
    plain: |
      Elihu went on and said: “Do you think it is right to say, ‘My righteousness is more than God's’? For you ask, ‘What good does it do you? What do I gain if I am cleansed from my sin?’ I will answer you, and your companions with you.
  - range: 5-8
    heading: Higher than thou
    plain: |
      “Look up at the heavens and see; look at the clouds, high above you. If you sin, what do you do to Him? If your transgressions are many, what harm is that to Him? If you are righteous, what do you give Him, or what does He receive from your hand? Your wickedness can hurt a man like yourself, and your righteousness can benefit a son of man.
  - range: 9-13
    heading: Songs in the night
    plain: |
      “People cry out because of the many oppressions; they call for help because of the arm of the mighty. But no one says, ‘Where is God my Maker, who gives songs in the night, who teaches us more than the beasts of the earth and makes us wiser than the birds of the air?’ So they cry out, but no answer comes, because of the pride of evil men. Surely God does not listen to an empty cry; the Almighty pays it no attention.
  - range: 14-16
    heading: Words without knowledge
    plain: |
      “Even though you say you cannot see Him, your case is before Him; so trust in Him. But now (the meaning of verse 15 is uncertain), because His anger has not punished, and He has paid little heed to transgression, Job opens his mouth in vain and piles up words without knowledge.”

notes:
  - ref: 2
    phrase: My righteousness is more than God’s?
    kind: history
    title: Did Job say he was more righteous than God?
    body: |
      Elihu puts Job's case as a claim to righteousness above God's; the words are Elihu's, not Job's. Job had insisted on his innocence, felt that his righteousness had not spared him pain, and said that God “destroyeth the perfect and the wicked” alike ([[Job 9:22]]); to Elihu that set Job's righteousness above God's. In one older reading the Hebrew is a comparison, as in Elihu's first complaint that Job “justified himself rather than God” ([[Job 32:2]]), and the King James keeps that sense. A modern translation hears a more modest claim: “I am in the right before God.”

      Verse 3 is an inference of the same kind. “What profit should we have?” is a line Job put in the mouths of the wicked ([[Job 21:15]]), not one he spoke for himself, though in the same older reading it follows from his complaint that God destroys the perfect with the wicked. That reading also takes the “companions” of verse 4 to be not the three friends, as the Greek translation has it, but the evildoers with whom Elihu had already grouped Job ([[Job 34:8]], [[Job 34:36]]).
    sources: [delitzsch-job, nrsvue, ot-minute-job-35, lds-scriptures]
  - ref: 7
    phrase: If thou be righteous, what givest thou him?
    kind: scripture
    title: Does our righteousness reach God?
    body: |
      Elihu's answer to the question of profit is that God gains nothing from a man's goodness and loses nothing by his sin; what a man does reaches only other men (verse 8). Eliphaz had asked the same question ([[Job 22:2–3]]), and one Latter-day Saint reading finds Elihu's point insightful all the same, since it goes to the satan's charge that Job's relationship with God was a transaction (see [[Job 34:9]]). Read like King Benjamin's “unprofitable servants” ([[Mosiah 2:21]]; see [[Job 22:2]]), it says that God helps His children because He loves them, not because they profit Him.

      The same reading grants the truth in Elihu's words and pushes back on them: righteousness and wickedness add nothing to God's store and take nothing from it, but they bring Him joy or break His heart. Enoch saw “the God of heaven” look upon the wicked, “and he wept” ([[Moses 7:28]]), and Jesus taught that “joy shall be in heaven over one sinner that repenteth” ([[Luke 15:7]]).
    sources: [ot-minute-job-35, nrsvue]
  - ref: 10
    phrase: who giveth songs in the night
    kind: symbol
    title: Songs in the night
    body: |
      The songs in the night belong to Elihu's answer to why the cries of the oppressed go unheard: the oppressed do not seek the Maker who gives them. Job had complained that the wounded cry out of the city and God takes no notice ([[Job 24:12]]). Elihu replies that the oppressed cry from their pain, but none of them says, “Where is God my maker?” In one older reading the songs are what God gives in the night of sorrow, songs of praise for the help that is coming, put into the mouths of those who turn to Him.

      Verse 11 extends the thought. The same older reading takes it as God teaching us from the beasts and birds, which cry to Him in their need, as the lions seek their meat from God and the young ravens cry ([[Ps. 104:21]]; [[Ps. 147:9]]). In that reading the stanza's thought is that affliction does not drive most people to God, who is to be humbly sought. A cry that does not seek Him is what verse 13 calls “vanity,” in a modern translation “an empty cry,” and the Almighty does not regard it.
    sources: [delitzsch-job, nrsvue]
  - ref: 14
    phrase: judgment is before him; therefore trust thou in him
    kind: words
    title: The case is before him
    body: |
      Elihu tells Job that his case is already before God, and that he should therefore trust in Him. “Judgment” here is a case at law, as a modern translation renders it: “the case is before him.” Job had said that he looks forward and backward, left and right, and “cannot see him” ([[Job 23:8–9]]), and had longed to “order my cause before him” ([[Job 23:3–4]]). Elihu's answer is that not seeing God does not keep the case from being before Him.

      The same modern translation reads the verse another way, taking Job's own complaint that he cannot see God as one more reason God does not answer: “How much less when you say that you do not see him, that the case is before him and you are waiting for him!”
    sources: [nrsvue, lds-scriptures]
  - ref: 16
    phrase: he multiplieth words without knowledge
    kind: scripture
    title: Words without knowledge
    body: |
      Elihu's closing verdict repeats his charge that Job “hath spoken without knowledge” ([[Job 34:35]]), and the LORD will open His own answer with the same words ([[Job 38:2]]). Where the charge holds and where it falls short is set out at [[Job 34:35]].

      Verse 15, which leads into the verdict, is obscure. The King James “he knoweth it not in great extremity” is hard to follow, and a modern translation, noting that the meaning of the Hebrew is uncertain, reads the verse as Elihu's complaint that God's anger “does not punish and he does not greatly heed transgression.” However verse 15 is read, Elihu's verdict in verse 16 is plain: Job opens his mouth in vain.
    sources: [nrsvue, ot-minute-job-36]

christ: |
  Elihu asked what a righteous man gives God. The revelation to Joseph Smith answers that “the worth of souls is great in the sight of God,” that “the Lord your Redeemer suffered death in the flesh; wherefore he suffered the pain of all men, that all men might repent and come unto him,” and “how great is his joy in the soul that repenteth!” ([[D&C 18:10–13]]). A soul adds nothing to God's store, and yet the Redeemer suffered the pain of all men to bring it to Him.

  A disciple's obedience is therefore not a payment that buys exemption from suffering, and it is not nothing to God. It is part of a relationship with a Redeemer whose joy is in the one who comes to Him.

