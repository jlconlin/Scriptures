chapter: 38
title: Where Wast Thou?
tagline: The LORD answers Job at last, out of the whirlwind, and gives him not reasons but questions. Where was Job when the earth was founded and the sons of God shouted for joy? Can he shut in the sea, command the morning, bind the stars, or feed the lion and the raven?
when: 'The LORD out of the whirlwind'

setting: |
  Chapter 38 is the hearing Job has asked for all through the book. He ended his last defense with “my desire is, that the Almighty would answer me” ([[Job 31:35]]); Elihu then spoke for six chapters ([[Job 32]]–[[Job 37]]). Now the LORD Himself speaks, out of the whirlwind, and Job is given the chance to face God that he had demanded. One older reading takes “the whirlwind” as a storm of any kind; in the book's sequence it is the storm that had risen while Elihu was speaking (see the note on [[Job 37:2]]).

  This chapter is the first part of the LORD's first speech, which runs from 38:1 to 40:2. Job answers it briefly in [[Job 40:3–5]]; the second speech begins at [[Job 40:6]], and Job's last answer is [[Job 42:1–6]]. The Church's chapter heading names the chapter's two subjects: the creation, when the morning stars sang, and the works of nature that show the greatness of God and the weakness of man.

thread: |
  The LORD's answer is a cross-examination, and the questions themselves are the argument. He does not tell Job why he has suffered; He answers in more questions. After a challenge to Job (verses 2–3) He leads him through the world from its foundations outward: the founding of the earth while the sons of God shouted for joy (4–7), the sea born and fenced in (8–11), the dawn that shakes the wicked out of the earth (12–15), the depths, the gates of death and the home of light and darkness (16–21), the storehouses of snow and hail and the rain that falls where no one lives (22–30), the stars, the clouds and the lightning (31–38). At verse 39 the questions turn from the elements to living creatures, the lion and the raven, and chapter 39 carries them on.

  Each question asks Job whether he was there, whether he knows, whether he can, and on its surface each answer is no. Read within the book, the speech is not only a rebuke. It assures Job that there is a plan and that God cares for the world, even land where no one lives; read that way, it is a comforting confirmation of God's power to care for His creations, Job included.

sections:
  - range: 1-3
    heading: The LORD answers
    plain: |
      Then the LORD answered Job out of the storm: Who is this who darkens My plan with words that have no knowledge behind them? Brace yourself like a man; I will question you, and you will answer Me.
  - range: 4-7
    heading: When I founded the earth
    plain: |
      Where were you when I laid the foundations of the earth? Tell Me, if you understand. Who determined its measurements, if you know, or stretched the measuring line over it? On what were its foundations set, or who laid its cornerstone, when the morning stars sang together and all the sons of God shouted for joy?
  - range: 8-11
    heading: The sea held back
    plain: |
      Who shut the sea in behind doors when it burst out as if from the womb, when I made the cloud its garment and thick darkness its swaddling band, when I marked out My boundary for it, set bars and doors, and said, This far you may come, and no farther; here your proud waves will stop?
  - range: 12-15
    heading: The morning
    plain: |
      Have you ever in your life commanded the morning, or shown the dawn its place, so that it could take hold of the edges of the earth and shake the wicked out of it? The earth is changed like clay under a seal, and everything stands out as if clothed. The wicked are kept from their light, and the arm raised high is broken.
  - range: 16-21
    heading: The depths, death, and the home of light
    plain: |
      Have you gone down to the springs of the sea, or walked in the recesses of the deep? Have the gates of death been opened to you, or have you seen the doors of the shadow of death? Have you taken in the breadth of the earth? Tell Me, if you know all this. Where is the way to the place where light lives, and where is darkness at home, that you could lead each to its border and know the paths to its house? Do you know it because you were born then, because your days are so many?
  - range: 22-30
    heading: Snow, rain, and ice
    plain: |
      Have you gone into the storehouses of the snow, or seen the storehouses of the hail, which I keep for the time of trouble, for the day of battle and war? By what way is the light divided, which scatters the east wind over the earth? Who cut a channel for the downpour, or a path for the thunderbolt, to bring rain on land where no one lives, on a wilderness with no one in it, to satisfy the desolate waste and make the tender grass spring up? Does the rain have a father? Who fathered the drops of dew? From whose womb did the ice come, and who gave birth to the frost of heaven, when the waters harden like stone and the face of the deep is frozen?
  - range: 31-38
    heading: The stars and the clouds
    plain: |
      Can you tie the Pleiades together, or loosen Orion's cords? Can you lead out the Mazzaroth in its season, or guide Arcturus with its children? Do you know the laws of the heavens? Can you set up their rule on the earth? Can you call to the clouds so that a flood of water covers you? Can you send out the lightning, so that it goes and says to you, Here we are? Who put wisdom in the inward parts, or gave understanding to the heart? Who can number the clouds by wisdom, or tilt the waterskins of heaven, when the dust runs into a hard mass and the clods stick together?
  - range: 39-41
    heading: Food for the lion and the raven
    plain: |
      Will you hunt prey for the lion, or satisfy the hunger of the young lions, when they crouch in their dens and lie in wait in the thicket? Who provides the raven its food, when its young cry to God and wander about with nothing to eat?

notes:
  - ref: 1
    phrase: Then the LORD answered Job out of the whirlwind
    kind: history
    title: The LORD answers out of the whirlwind
    body: |
      The LORD's answer gives Job no reason for his suffering; what it gives him is the LORD Himself, speaking to him. Job and his friends had argued over why Job was suffering, and the LORD answers only with more questions. A reader who knows the prologue might expect it to be explained at last, but it is never mentioned. A Latter-day Saint reading of the book puts the weight on the meeting itself: “simply the fact that he spoke at all, and spoke directly to Job, relieved the man of Uz's deepest need—his hunger for reassurance that God has not forsaken him,” and so the book is “at bottom about the need for personal revelation.”

      Nor do the questions forbid Job's own. Another Latter-day Saint reading finds no hint that man may not question God; the LORD answers Job's questions with counter-questions that invite him to deeper understanding. Job's answers come in [[Job 40:3–5]] and [[Job 42:1–6]].
    sources: [seminary-ot-teacher-109, ot-minute-job-38, tanner-considered-job, stirling-job]
  - ref: 2
    phrase: darkeneth counsel by words without knowledge
    kind: words
    title: Darkening God's plan
    body: |
      The “counsel” Job has darkened is God's plan. The Hebrew *ʿēṣāh* means advice or counsel and, by implication, a plan or purpose. Read that way, the line makes clear that God has a plan for the world, and Job's speeches have obscured it.

      So the LORD's first words do not accuse Job of sin, the charge the friends pressed; they say Job has spoken of what he did not know. Job takes the words as meant for him. When he answers at the end, he repeats the LORD's question as his own, “Who is he that hideth counsel without knowledge?” and answers it, “therefore have I uttered that I understood not” ([[Job 42:3]]). Elihu had brought the same charge just before, and where it holds is taken up at [[Job 34:35]].
    sources: [bdb, ot-minute-job-38, stirling-job]
  - ref: 3
    phrase: for I will demand of thee, and answer thou me
    kind: history
    title: The hearing turned around
    body: |
      The LORD grants Job his hearing, but He asks the questions. Job had offered God either order: “Then call thou, and I will answer: or let me speak, and answer thou me” ([[Job 13:22]]). In one older reading the LORD does not do exactly what Job wished but surprises him with questions meant to bring him, indirectly, to see what was wrong in his challenge.

      A Latter-day Saint reading hears dignity in the same words. The LORD speaks with Job, honors him by doing so, and challenges him to stand up and answer “like a man.” In that reading the words fulfil Job's hope that the upright might reason with God ([[Job 23:7]]), against his earlier despair that God “is not a man, as I am, that I should answer him” ([[Job 9:32]]; the reading is given at [[Job 9:33]]). When Job does answer, it is with a hand laid on his mouth ([[Job 40:4]]).
    sources: [delitzsch-job, stirling-job]
  - ref: 4
    phrase: Where wast thou when I laid the foundations of the earth?
    kind: prophets
    title: Job was somewhere
    body: |
      Joseph Smith took the LORD's question as one that has an answer: Job was somewhere. At a Sunday meeting about 28 March 1841 he read this chapter aloud and, as his words were reported, taught that “the spirit or the inteligence of men are self Existant principles before the foundation this Earth,” quoting the Lord's question to Job as “Evedencing that Job was in Existing somewhere at that time.”

      A Latter-day Saint reading of Job calls this one of the book's ironies. On its surface the question says Job could not have been present at the creation, “whereas ironically he may well have been,” as Abraham's vision of “the intelligences that were organized before the world was” allows ([[Abr. 3:22]]); and God may be inviting Job to a deeper understanding of creation and a part in it. Who stood there with God is the subject of verse 7.
    sources: [jsp-discourse-1841-03-28, stirling-job]
  - ref: 7
    phrase: When the morning stars sang together, and all the sons of God shouted for joy
    kind: scripture
    title: The morning stars and the sons of God
    body: |
      The Church reads this verse as a witness of the premortal life, a passage “confirming the reality of the premortal life,” and places the shout of joy at the Council in Heaven, when the Father presented His plan. President Thomas S. Monson taught who was there: we ourselves, among the sons and daughters of God, shouting for joy at the chance to come to a challenging but necessary mortal life. Abraham's account of that council fills in the scene. Among the noble and great ones the creation of the earth was planned, led by the premortal Jesus Christ: “We will go down, for there is space there, and we will take of these materials, and we will make an earth whereon these may dwell” ([[Abr. 3:24]]).

      The poetry sets stars and sons of God side by side because of an ancient picture of heaven, in which the sons of God who made up God's council ([[Job 1:6]], where the council is explained) were thought to be represented by the stars.

      Joseph Smith took up the verse in a letter to the Saints: “let the sun, moon, and the morning stars sing together, and let all the sons of God shout for joy!” ([[D&C 128:23]]). He added the sun and moon and turned God's question into a declaration, now celebrating the Restoration.
    sources: [seminary-intro-job, scripture-helps-job, monson-he-is-risen, sc-knowhy-810, ot-minute-job-1, frederick-old-wine]
  - ref: 8
    phrase: who shut up the sea with doors
    kind: symbol
    title: The sea in swaddling bands
    body: |
      The LORD pictures the sea as His newborn: it bursts out as from the womb, He wraps it in cloud and thick darkness as a baby in swaddling bands, and then He fences it in with bars and doors and a word, “Hitherto shalt thou come, but no further” (verses 8–11).

      The image matters because of what the sea stood for. In a Latter-day Saint reading of the book, the sea is a metaphor for primal chaos or evil, which, like the adversary in the prologue, is permitted in creation but bounded. The adversary there was given leave and a limit in the same way: “only upon himself put not forth thine hand” ([[Job 1:12]]).
    sources: [stirling-job]
  - ref: 14
    phrase: It is turned as clay to the seal
    kind: symbol
    title: The dawn shakes out the wicked
    body: |
      Verses 12–15 picture every sunrise as a small judgment. The dawn takes hold of “the skirts of the earth,” as a modern translation renders it, and in one older reading it shakes the earth like a carpet held by its edges, so that the evildoers who lay down on it in the night fall off. Then the earth “is changed like clay under the seal”: in the same reading the dawn is like a signet ring pressed into soft clay, and shapes that drifted in the dark take a definite form and become visible, each clothed as in a garment. That reading also explains why the wicked lose their “light” (verse 15): their light is the darkness of night, in which they do their work ([[Job 24:17]]), and the sunrise takes it from them. Their raised arm is broken.

      A Latter-day Saint reading sees in the passage a coming day when the wicked will be shaken out of the earth, cut off from light and made powerless: like the sea of verse 8, evil men are permitted in the world God made, but bounded.
    sources: [nrsvue, delitzsch-job, stirling-job]
  - ref: 26
    phrase: To cause it to rain on the earth, where no man is
    kind: symbol
    title: Rain where no one lives
    body: |
      God sends rain on land where no one lives. He cuts a channel for the downpour and a path for the thunderbolt to water “the wilderness, wherein there is no man,” and makes the grass spring on waste ground (verses 25–27).

      Read within the speeches, the detail is part of what they do say: there is a plan, and God cares for the world. He sends rain to land no one inhabits, as in the next chapter He is mindful of the deer giving birth and the ostrich's abandoned eggs, and as the Savior taught: “are not two sparrows sold for a farthing? and one of them shall not fall on the ground without your Father” ([[Matt. 10:29]]).
    sources: [ot-minute-job-38]
  - ref: 31
    phrase: sweet influences of Pleiades
    kind: words
    title: Binding the Pleiades
    body: |
      The King James' “sweet influences” is a word for bindings or cords. One older reading holds its meaning beyond question, since the Greek translation and the Aramaic Targum both render it so, and a modern translation reads, “Can you bind the chains of the Pleiades or loose the cords of Orion?” The question is whether Job can tie the cluster of the Pleiades together or loosen the bonds that hold Orion in the sky.

      The other names are less certain. The King James' Pleiades (*kîmāh*, in the same older reading “the clustered group”) and Orion (*kĕsîl*) are the identifications that reading holds, and the Greek versions already read Orion. The Mazzaroth of verse 32 occurs nowhere else in the Bible and is perhaps some particular star or constellation; the King James' “Arcturus with his sons” is “the Bear with its children” in a modern translation. Whatever the stars, the point of verses 31–33 is the same: they keep “the ordinances of heaven” in their seasons, and Job can neither set those laws nor change them.
    sources: [delitzsch-job, nrsvue, bdb]

christ: |
  The LORD who answers Job out of the whirlwind is Jehovah, the premortal Jesus Christ, who led the council where the creation Job is asked about was planned (see the note on verse 7). The footnote beside the raven of verse 41 points to the lesson the same Lord taught in mortality: “Consider the ravens: for they neither sow nor reap; which neither have storehouse nor barn; and God feedeth them: how much more are ye better than the fowls?” ([[Luke 12:24]]). Job was given no reason for his suffering; he was given the Lord's own voice. A disciple's trials may stay unexplained as Job's did, and the comfort the Lord offers them is the same: the Lord's assurance, given by His Spirit, that He has not forsaken the one who suffers.

