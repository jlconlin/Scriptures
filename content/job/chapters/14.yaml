chapter: 14
title: If a Man Die, Shall He Live Again?
tagline: Job ends his answer to Zophar by turning to death. A felled tree may sprout again, but a man lies down and does not rise; and then, for a moment, Job imagines God calling him back from the grave.
when: 'The first round: Job answers Zophar'

setting: |
  Chapter 14 ends Job's answer to Zophar, which began at [[Job 12:1]], and with it the first round of the dialogue; Eliphaz opens the second round in chapter 15. In chapter 13 Job turned from the friends to God and asked for a hearing ([[Job 13:3]]). He goes on speaking to God here, but the courtroom gives way to a meditation on what a human life is: short, troubled, and closed by a death from which, as far as Job can see, no one comes back. What he thinks of Sheol, the world of the dead, is set out at [[Job 7:9]].

  In the middle of that meditation Job asks the question the chapter is known for. A Latter-day Saint reading of the book calls chapters 12–14 a turning point, where Job reaches his lowest point and then begins to climb. Job's fuller testimony comes in chapter 19 ([[Job 19:25–27]]).

thread: |
  Job's claim is that a human life is too short and too frail to deserve God's hostile watch, and the chapter is his attempt to see past its end. He begins with how brief life is: born of woman, few of days, a flower cut down, a passing shadow (verses 1–2). Why should God fix His eyes on such a creature and bring him to judgment, when no one can bring a clean thing out of an unclean? Since God has set the limits of a man's days, let Him look away and leave him to finish his day like a hired laborer (verses 3–6). In one older reading, Job's point is that man's impurity should make him an object of God's forbearance, not of strict punishment.

  Then he sets a man beside a tree. A felled tree can sprout again at the scent of water; a man dies and, like a lake that dries up, does not rise (verses 7–12). At verse 13 the speech turns. Job wishes God would hide him in the grave until His anger passed, then set a time and remember him; in that wish he asks whether a man may live again, and pictures God calling and himself answering (verses 13–17).

  The hope does not hold. The chapter ends with mountains crumbling, stones worn by water and soil washed away: so God destroys the hope of man, who is sent away and does not know what becomes of his sons (verses 18–22). A Latter-day Saint reading sees Job here swinging between hope and despair, and the vision of verses 13–17 as not yet sustained, but as a real change in how Job understands God.

sections:
  - range: 1-6
    heading: Few days, and full of trouble
    plain: |
      A human being, born of a woman, lives only a few days, and they are full of trouble. He springs up like a flower and is cut down; he slips away like a shadow and does not last. Do You really fix Your eyes on such a one, and bring me into judgment with You? Who can bring something clean out of something unclean? No one. Since his days are fixed, and You know the number of his months, and You have set limits he cannot pass, look away from him and let him rest, until he finishes his day like a hired worker.
  - range: 7-12
    heading: Hope for a tree
    plain: |
      There is hope for a tree: if it is cut down, it will sprout again, and its new shoots will not fail. Though its root grows old in the ground and its stump dies in the soil, at the mere scent of water it will bud and put out branches like a young plant. But a man dies and wastes away; he breathes his last, and where is he? As water vanishes from a lake and a river shrinks and dries up, so a man lies down and does not rise. Until the heavens are gone, the dead will not wake or be roused from their sleep.
  - range: 13-17
    heading: Shall he live again?
    plain: |
      If only You would hide me in the grave and keep me out of sight until Your anger is past; if only You would set me a time, and then remember me! If a man dies, will he live again? All the days of my service I would wait, until my relief came. You would call, and I would answer You; You would long for the creature Your hands have made. For now You count my every step; do You not keep watch over my sin? My wrongdoing is sealed up in a bag, and You sew up my guilt.
  - range: 18-22
    heading: You destroy the hope of man
    plain: |
      But a mountain falls and crumbles away, and a rock is moved from its place; water wears away stones, and floods wash away the soil: so You destroy a man's hope. You overpower him for good, and he passes on; You change his face and send him away. His sons are honored, and he does not know it; they are brought low, and he never sees it. His body upon him feels its pain, and his soul within him mourns.

notes:
  - ref: 7
    phrase: there is hope of a tree
    kind: symbol
    title: A tree has more hope than a man
    body: |
      Job's comparison makes the tree the more fortunate of the two: a stump can come back to life, and a man cannot. The picture is drawn with care. The root grows old, the stump seems dead in the ground, and yet at the mere “scent of water” it buds again like a young plant (verses 8–9). Against it Job sets a man who dies and “wasteth away” (verse 10), like a lake or river that dries up (verse 11).

      Verse 12 closes the door: a man “lieth down, and riseth not: till the heavens be no more.” This is the view of death Job has held since [[Job 7:9]], where it is explained. It is spoken from the depth of his suffering, and at this point in the book many things Job says are not entirely accurate, though such words about death are not out of keeping with some psalms and with Ecclesiastes. Within two verses he turns from this lament to a sudden hope (verses 13–15).

      The theme page [He That Liveth, and Was Dead](/job/themes/he-that-liveth/) reads 19:10, where Job's hope is “removed like a tree,” as his reply to this comparison.
    sources: [ot-minute-job-4, stirling-job]
  - ref: 13
    phrase: O that thou wouldest hide me in the grave
    kind: history
    title: A hiding place in Sheol
    body: |
      Job wishes the grave could be a hiding place rather than an end. “The grave” is Sheol, the world of the dead (a modern translation keeps the name; it is explained at [[Job 7:9]]), and Job asks God to hide him there only “until thy wrath be past,” then to set him a term and remember him. Sheol would be a shelter for a while, not a prison for good: once God's anger had passed, Job could come out and face Him.

      The wish runs on into verse 15. When the set time came, God would call and Job would answer, and God “wilt have a desire to the work of thine hands”: He would long, as a modern translation has it, for the creature He made. Beneath the anger Job feels now, he pictures a God who would want back what His hands had made.
    sources: [nrsvue, ot-minute-job-4]
  - ref: 14
    phrase: If a man die, shall he live again?
    kind: christ
    title: If a man die, shall he live again?
    body: |
      Job's question is the center of the chapter, and the Church reads what follows it as his answer: he will wait out his days until the Lord calls him from the grave (the chapter heading's reading of verses 14–15). The question grows out of the wish of verse 13. Having just said that a man “lieth down, and riseth not” (verse 12), Job imagines God calling him back, and asks whether it could be so.

      How much Job knew when he asked is read in more than one way. Scholars usually take passages like this as evidence that most of the Old Testament had no belief in a resurrection; one Latter-day Saint reading answers that the evidence for such belief is limited, not absent, and that Job here “appears to be hoping for something like resurrection.” Another reads verses 13–17 as the first of Job's revelatory insights, a flash in which he glimpses a loving God calling him back and the renewal of life in a resurrection; the vision does not hold at once, but it changes how Job understands God.

      The question has not grown old: it is “the timeless, ageless question,” the one every living person has pondered, and its answer comes in a line: “The empty tomb that first Easter morning was the answer to Job’s question.”

      The theme page [He That Liveth, and Was Dead](/job/themes/he-that-liveth/) argues that Job's answer, here and in 19:25, rests on the Lord and not on man: he asked whether a dead man shall live, and he testifies that his Redeemer lives.
    sources: [lds-scriptures, ot-minute-job-4, stirling-job, monson-he-is-risen]
  - ref: 14
    phrase: till my change come
    kind: words
    title: Till my change come
    body: |
      The “change” Job would wait for is his relief, the word for being released from a term of duty, and Job uses it of coming back from death. The King James “appointed time” in the same verse is the hard service, a soldier's or a hired man's, that Job complained of at [[Job 7:1]], where the word is explained. A modern translation reads, “All the days of my service I would wait until my release should come.”

      The word for “change” (*ḥălîpāh*) elsewhere names a change of clothes ([[Gen. 45:22]]); here it has a sense of its own: “revival after death, under figure of relief from military service.” Job pictures even the time in the grave as one more stretch of the duty he already finds so heavy, and its end not as nothing but as the moment his relief arrives.
    sources: [bdb, nrsvue]
  - ref: 17
    phrase: My transgression is sealed up in a bag
    kind: symbol
    title: Sealed up in a bag
    body: |
      Verses 16–17 can be read as accusation or as hope, and translators divide over them. The King James takes them as the present, set against the future Job has just imagined: “For now thou numberest my steps.” Read that way, the bag is God's evidence. In one older reading the image is of valuables gathered into a sealed bag and kept, and so of Job's past sins collected and stored up to be brought home to him, as Hosea says of Israel, “The iniquity of Ephraim is bound up; his sin is hid” ([[Hosea 13:12]]).

      A modern translation reads both verses as still part of the hoped-for future: “then you would not number my steps; you would not keep watch over my sin; my transgression would be sealed up in a bag, and you would cover over my iniquity.” Then the sealed bag is sin put away out of sight, and the hope of verses 13–15 includes forgiveness. A Latter-day Saint reading follows this second sense and finds in the passage, beside the hope of a resurrection, Job's awareness that he would need redemption from sin.
    sources: [delitzsch-job, nrsvue, stirling-job]

christ: |
  Job asked whether a man who dies shall live again, and answered that he would wait out his days until God called him from the grave. Alma teaches that “the death of Christ shall loose the bands of this temporal death, that all shall be raised from this temporal death” ([[Alma 11:42]]), and Job's question has its answer: “If a man die, he shall live again. We know, for we have the light of revealed truth.” For a disciple standing at the grave of someone loved, that answer is a promise: because the Savior rose, the dead will rise, and death does not have the last word.

