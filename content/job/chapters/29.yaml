chapter: 29
title: Oh That I Were as in Months Past
tagline: Job, the friends now silent, remembers the days when God's friendship rested over his tent, the city rose when he came to the gate, and he was eyes to the blind and a father to the poor.
when: "Job's last defense: the days that were"

setting: |
  Chapter 29 opens Job's last defense, which runs through chapter 31. Its first line, “Moreover Job continued his parable,” repeats the words that began chapter 27 ([[Job 27:1]]): no friend has spoken in between and no new speaker is named, so by its headings the poem on wisdom in chapter 28 stands inside Job's own speech. In one Latter-day Saint reading Job has by now moved beyond dialogue with the friends and waits on God instead: he reviews his past life in chapter 29 and his present in chapter 30, and in chapter 31 affirms his innocence under oath.

  This chapter is the past, the fullest picture the book gives of Job before his trial. The Church's chapter heading puts it in one line: Job was blessed because of his righteousness, his charity and his good deeds. He no longer addresses the friends, yet in one older reading the deeds he recalls refute, everywhere, the uncharitable crimes Eliphaz laid to his charge in [[Job 22:5–9]], which the note there sets side by side; in chapter 31 Job denies the same crimes under oath ([[Job 31:16–21]]). Why the friends were wrong to read his suffering as punishment is set out at [[Job 4:7]].

thread: |
  Job's claim is that he once had God's friendship and the city's honor, and had the honor because he used his place for those who had no one. He begins with a wish: oh that he were as in the months when God watched over him, His lamp shining over Job's head, His friendship resting over Job's tent, the Almighty still with him and his children around him (verses 2–6).

  From God he moves to the city. When he took his seat at the gate, the young men stepped aside, the old men stood, and princes and nobles fell silent (verses 7–11). Verse 12 gives the reason, with the word “because”: he delivered the poor who cried and the fatherless, made the widow sing, was eyes to the blind and feet to the lame, searched out the cause of the stranger, and tore the prey out of the oppressor's teeth (verses 12–17). So he expected to die old in his own nest, fresh as a tree whose roots reach the water (verses 18–20). The last stanza returns to the council, where men waited for his word as for rain and he sat among them like a king who comforts mourners (verses 21–25).

  The whole chapter is memory, and every line of it is about to be inverted. Chapter 30 begins “But now” ([[Job 30:1]]): the honored man is mocked by the lowest, and what Job had taken for the plain sign of God's presence is gone.

sections:
  - range: 1-6
    heading: When the friendship of God was upon my tent
    plain: |
      Job went on with his discourse and said: Oh, that I were as I was in months gone by, in the days when God watched over me; when His lamp shone over my head, and by His light I walked through the dark; as I was in the prime of my life, when God's friendship rested over my tent; when the Almighty was still with me and my children were all around me; when my steps were bathed in milk and the rock poured out streams of oil for me!
  - range: 7-11
    heading: My seat at the gate
    plain: |
      When I went out to the gate of the city and took my seat in the square, the young men saw me and stepped aside, and the old men rose and stood. Princes stopped speaking and put their hands over their mouths; the voices of the nobles were hushed, and their tongues stuck to the roofs of their mouths. Whoever heard of me called me blessed, and whoever saw me spoke well of me,
  - range: 12-17
    heading: Eyes to the blind
    plain: |
      because I rescued the poor who cried for help, and the fatherless, and anyone who had no one to help him. The blessing of the man about to perish came upon me, and I made the widow's heart sing for joy. I put on righteousness, and it clothed me; my justice was my robe and my turban. I was eyes to the blind and feet to the lame. I was a father to the needy, and I looked into the case of the stranger I did not know. I broke the jaws of the wrongdoer and made him drop his prey from his teeth.
  - range: 18-20
    heading: I shall die in my nest
    plain: |
      Then I thought, I will die in my own nest, and my days will be as many as the grains of sand. My roots reach out to the water, and the dew lies all night on my branches. My honor stays fresh in me, and my bow is always new in my hand.
  - range: 21-25
    heading: They waited for me as for the rain
    plain: |
      People listened to me and waited, and kept silent for my counsel. When I had spoken they said nothing more, and my words fell on them in drops. They waited for me as for the rain, and opened their mouths wide as for the spring rain. When they had lost hope I smiled on them, and they could not dim the light of my face. I chose their way for them and sat at their head; I lived like a king among his troops, like one who comforts mourners.

notes:
  - ref: 4
    phrase: the secret of God was upon my tabernacle
    kind: words
    title: The friendship of God over my tent
    body: |
      What Job misses first is not his wealth but God's closeness: “the secret of God” is God's intimate friendship, which once rested over Job's home. The Hebrew *sôd* is the word Eliphaz used when he asked, “Hast thou heard the secret of God?” ([[Job 15:8]]), where the note explains it. The standard lexicon reads it here, if the text is sound, as familiar converse with God, intimacy, and sets the verse beside the psalm's “The secret of the LORD is with them that fear him” ([[Ps. 25:14]]); it also records a proposed correction of the Hebrew that would read “when Eloah sheltered my tent.” The Church's footnote gives “friendship, confidence,” and a modern translation reads, “when the friendship of God was upon my tent”: the King James “tabernacle” is Job's tent.

      In one Latter-day Saint reading, these verses show what Job had before his “fall”: he “perceived God's companionship and friendship.”
    sources: [oshb-wlc, bdb, lds-scriptures, nrsvue, stirling-job]
  - ref: 6
    phrase: When I washed my steps with butter, and the rock poured me out rivers of oil
    kind: symbol
    title: Butter and oil from the rock
    body: |
      Verse 6 pictures plenty so great it ran underfoot. The King James “butter” is curd, curdled milk (a modern translation renders the line “when my steps were washed with milk”), and the lexicon sets it beside Zophar's “brooks of honey and butter” ([[Job 20:17]]), a figure of abundance. Job's very path was bathed in it, and even the rock poured out oil for him.

      One Latter-day Saint reading hears in the line something “reminiscent of Adam's easy access to food in the Garden of Eden.” In that reading Job before his trial lived “in an unnaturally idyllic world,” good and generous but “as yet, lacking both in self-knowledge and knowledge of God,” and the loss of that world is his fall, as Adam's was, the bitter that lets him come to know the sweet.
    sources: [bdb, nrsvue, stirling-job]
  - ref: 7
    phrase: When I went out to the gate through the city
    kind: history
    title: A seat at the gate
    body: |
      Job's seat at the city gate was a seat of authority. The gate of a city “was often a place for public business,” and the passages cited for it show what business: the law sends a rebellious son to “the elders of his city, and unto the gate of his place” ([[Deut. 21:19]]), and Boaz settles the redemption of Elimelech's land at the gate before ten of the elders ([[Ruth 4:1–11]]). “The street” where Job prepared his seat is the open square by the gate, as a modern translation renders it.

      One older reading pictures Job coming to the meeting of the city's tribunal, its council of elders, where he had a seat and a voice; the respect of verses 8–10 is the respect that council paid him: the young step out of his way, the old rise and remain standing, princes and nobles stop speaking. Job's oath in chapter 31 comes back to the gate. He swears he never raised his hand against the fatherless “when I saw my help in the gate” ([[Job 31:21]]), that is, “because I saw I had supporters at the gate,” as a modern translation renders it.
    sources: [bd-gate, lds-scriptures, delitzsch-job, nrsvue]
  - ref: 14
    phrase: I put on righteousness, and it clothed me
    kind: symbol
    title: Clothed with righteousness
    body: |
      In Job's words righteousness was not a garment he wore now and then; it wore him. The Hebrew uses one verb twice, *lābaš*, “put on, be clothed”: “I put on righteousness, and it clothed me.” The standard lexicon reads the second verb as “it clothed itself in me, as it were, became incarnate in me,” and sets it beside the same verb where “the Spirit of the LORD came upon Gideon” ([[Judg. 6:34]]): the Spirit clothed itself with Gideon and took possession of him.

      The second half of the verse dresses Job's “judgment,” the justice he gave at the gate, as a robe and a “diadem,” a turban; the same Hebrew word names the high priest's turban ([[Zech. 3:5]]) and a “royal diadem” ([[Isa. 62:3]]). The lexicon gathers this verse with the other places where scripture makes righteousness something worn: the LORD Himself “put on righteousness as a breastplate” ([[Isa. 59:17]]), and the psalmist prays, “Let thy priests be clothed with righteousness” ([[Ps. 132:9]]).
    sources: [oshb-wlc, bdb]
  - ref: 16
    phrase: the cause which I knew not I searched out
    kind: history
    title: He sought out the stranger's cause
    body: |
      Job did not wait for the needy to find him; he went looking for them. The King James “the cause which I knew not” can sound like a case Job did not understand. One older reading calls that sense “a tame, almost meaningless, thought” and takes the line as the cause of people Job did not know, as a modern translation does: “I championed the cause of the stranger.” Job did not treat strangers as nothing to him, but “went unselfishly and impartially into the ground of their cause.”

      That may be “the secret of Job's perfection: he did not help only those who asked for his help; he sought out people to give help to.” Verse 17 carries the same duty further. As one who “dwelt as a king” (verse 25), Job was obligated to defend those who relied on him; breaking the jaws of the wicked and plucking the spoil out of his teeth could mean, for example, hunting down robbers and recovering, by force if need be, what they had taken.
    sources: [nrsvue, delitzsch-job, ot-manual-job]
  - ref: 18
    phrase: I shall die in my nest, and I shall multiply my days as the sand
    kind: symbol
    title: Dying in his nest
    body: |
      In his prosperity Job took a long life and a peaceful death at home for granted. He would die in his own nest, his days as many as the sand, his roots reaching the water and the dew lying all night on his branches, his bow always new in his hand (verses 18–20). The Hebrew *ḥôl* is “sand,” the usual figure for what cannot be counted, and the standard lexicon lists Job's days among its uses while noting another interpretation; a modern translation follows that other reading, “I shall multiply my days like the phoenix,” with the note “Or like sand.” Either way the line pictures a life that goes on and on.

      Looking back, Job “still sees his previous material prosperity and high societal rank as evidence of the presence of God in his life,” in one Latter-day Saint reading. In chapter 30 all of it is inverted.
    sources: [oshb-wlc, bdb, nrsvue, stirling-job]
  - ref: 23
    phrase: they opened their mouth wide as for the latter rain
    kind: symbol
    title: As for the latter rain
    body: |
      Men waited for Job's word as a dry land waits for rain. In the land of the Bible the rainy season begins in October with the “early rain,” the winter rain soaks the soil and fills the cisterns in January and February, and “the biblical ‘latter rain’ comes in March and April”; showers may follow in May, but then rain hardly ever falls until the end of September. The council “opened their mouth wide” for Job's counsel as the land does for that rain before the dry summer.

      Verse 22 has begun the picture: “my speech dropped upon them,” fell on them in drops (a modern translation supplies “like dew,” noting that the Hebrew lacks the words). When Job had spoken, no one spoke after him.
    sources: [bd-rain, nrsvue]
  - ref: 24
    phrase: If I laughed on them, they believed it not
    kind: words
    title: A smile for the hopeless
    body: |
      The King James line is obscure because the Hebrew is uncertain; a modern translation renders it, “I smiled on them when they had no confidence, and the light of my countenance they did not extinguish,” with a note that the meaning of the Hebrew is uncertain. Read that way, those who came to Job without hope found him cheerful, and their gloom could not put out the light of his face.

      Verse 25 completes the picture of his authority: he chose their way and sat as chief, like a king among his troops, yet a king “as one that comforteth the mourners.”
    sources: [nrsvue]

christ: |
  In one Latter-day Saint reading, Job's description of his life before his trial “is reminiscent of Christ in the premortal life”: clothed with righteousness, giving light and counsel to others, dwelling among them as a king (compare [[John 17:5]]; [[Abr. 3:22–28]]).

  Mercy to the poor, the fatherless, the widow and the stranger is mercy done to Christ Himself: “inasmuch as ye impart of your substance unto the poor, ye will do it unto me” ([[D&C 42:31]]). King Benjamin makes it part of how a disciple retains a remission of sins from day to day: imparting of one's substance, “administering to their relief, both spiritually and temporally, according to their wants” ([[Mosiah 4:26]]).

explore: |
  - **The same deeds, charged and denied.** Eliphaz's charges, [[Job 22:5–9]]; Job's oath, [[Job 31:16–23]]; and what Eliphaz himself had remembered of Job, [[Job 4:3–4]].
  - **The reversal.** [[Job 30:1–10]], then the end of the book, [[Job 42:10–12]].
  - **Clothed with righteousness.** [[Ps. 132:9]]; [[Isa. 59:17]]; [[Isa. 61:10]]; [[Eph. 6:14]].
  - **The secret of the LORD.** [[Ps. 25:14]]; [[Prov. 3:32]]; [[Amos 3:7]].

