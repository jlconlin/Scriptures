chapter: 40
title: Wilt Thou Condemn Me, That Thou Mayest Be Righteous?
tagline: The LORD's first speech ends with a challenge, and Job, who demanded an answer, puts his hand over his mouth. The second speech names the fault in his complaint, invites him to rule the world as God does if he can, and sets before him behemoth, a creature only its Maker can master.
when: "The LORD out of the whirlwind: the end of the first speech, Job's reply, and the second speech"

setting: |
  Chapter 40 stands in the middle of the LORD's answer to Job. Job had closed his last defense by demanding that the Almighty answer him ([[Job 31:35]]); Elihu then spoke for six chapters. When the LORD finally spoke out of the whirlwind ([[Job 38:1]], where the whirlwind and why He answers with questions are taken up), He gave two speeches, the first from 38:1 to 40:2 and the second from 40:6 to the end of chapter 41. Job is given room to reply after each, and each speech opens with a challenge to him. The first asked who darkens God's counsel, a word that also means His plan, by words without knowledge ([[Job 38:2]]).

  This chapter holds the end of the first speech (verses 1–2), Job's short first reply (verses 3–5), and the opening of the second speech (verses 6–24), which runs on into leviathan in [[Job 41]]. Job's fuller answer comes only in [[Job 42:1–6]].

thread: |
  The chapter moves from silence to the real question. The first speech ends by turning Job's courtroom around: the one who has been finding fault with the Almighty is now the one who must answer (verse 2). Job has nothing to say. He feels small, puts his hand over his mouth, and says he will not go on (verses 3–5); but this is a retreat into silence, not yet the answer he will give in chapter 42.

  So the LORD speaks again, and this time names the fault directly: “wilt thou condemn me, that thou mayest be righteous?” (verse 8). Job had argued as though only one of them could be in the right. God does not call Job wicked; He asks whether Job must put God in the wrong to clear himself. Then He invites Job, with some irony, to take God's place for a moment: to put on majesty and humble every proud man in the world, and if he can, God will grant that his own right hand can save him (verses 9–14). Last, He points to behemoth, a creature made as Job was made, at ease in its river and beyond any man's hook (verses 15–24). The speech does not explain Job's suffering. It shows him a world whose power and whose wild things belong to God alone.

sections:
  - range: 1-2
    heading: Let him answer it
    plain: |
      The LORD went on and said to Job: Will the one who finds fault with the Almighty keep arguing with Him? Whoever sets God right must answer.
  - range: 3-5
    heading: I will lay mine hand upon my mouth
    plain: |
      Then Job answered the LORD: I am of small account; what could I answer You? I put my hand over my mouth. I have spoken once, and I will not answer again; twice, and I will say no more.
  - range: 6-14
    heading: Hast thou an arm like God?
    plain: |
      Then the LORD answered Job out of the whirlwind: Brace yourself like a man; I will question you, and you will tell Me. Will you even overturn My justice? Will you put Me in the wrong so that you can be in the right? Do you have an arm like God's? Can you thunder with a voice like His? Then dress yourself in majesty and splendor; put on glory and beauty. Pour out your overflowing anger; look at everyone who is proud and bring him down. Look at every proud man and humble him; crush the wicked where they stand. Bury them all together in the dust; bind their faces in the hidden place below. Then I too will acknowledge that your own right hand can save you.
  - range: 15-24
    heading: Behold now behemoth
    plain: |
      Look at behemoth, which I made just as I made you; it eats grass like an ox. Its strength is in its loins, its power in the muscles of its belly. It stiffens its tail like a cedar; the sinews of its thighs are knit together. Its bones are tubes of bronze, its limbs like bars of iron. It is the first of God's great works; only its Maker can come at it with a sword. The mountains bring it food, where all the wild animals play. It lies under the lotus plants, hidden among the reeds and in the marsh. The lotus trees shade it; the willows of the brook surround it. If the river rages, it is not alarmed; it stays calm though the Jordan surges against its mouth. Can anyone take it while it watches, or pierce its nose with a snare?

notes:
  - ref: 4
    phrase: Behold, I am vile
    kind: words
    title: Small, not vile
    body: |
      Job's first words to the LORD confess smallness, not wickedness. The King James “vile” renders a Hebrew verb whose root sense is to be slight or light; said of a person, the verb can mean to be of little account, and a modern translation renders Job's words “See, I am of small account.” Job has just been told that whoever finds fault with the Almighty must answer Him (verse 2), and he finds he has nothing to say.

      His gesture says the same thing. A hand over the mouth is how the book shows someone falling silent (see the note at [[Job 21:5]]); Job once asked his friends for that silence, and now he keeps it himself. “Once have I spoken… yea, twice” ([[Job 40:5]]) is his way of saying that he has said all he is going to say.

      This is not yet his answer. In one Latter-day Saint reading, Job names his unworthiness or insignificance as the reason he holds back, retreats into silence, and is not yet ready to respond; his real reply comes after the second speech ([[Job 42:1–6]]). The same reading finds that Job's sense of inadequacy corresponds to that of the brother of Jared, who stood before the Lord and confessed that “our natures have become evil continually” ([[Ether 3:2]]) before he was brought into His presence.
    sources: [bdb, oshb-wlc, nrsvue, stirling-job]
  - ref: 8
    phrase: wilt thou condemn me, that thou mayest be righteous?
    kind: prophets
    title: Condemning God to be righteous
    body: |
      The second speech names the fault in Job's complaint: he has been willing to put God in the wrong so that he could be in the right. Elder D. Todd Christofferson gives the line in plain words: “Will you even put me in the wrong? Will you condemn me that you may be justified?” In one Latter-day Saint reading, to “disannul” God's judgment is to try to “frustrate my justice.”

      Job came to that position honestly. He had shared his friends' belief that suffering is punishment for sin, and since he knew he was innocent, that belief left only one place for the fault to fall: on God. In one Latter-day Saint reading, by the rules of that theology either God or Job had to be unjust. Job's own speeches show the trap. He said that if he justified himself his own mouth would condemn him ([[Job 9:20]]), and that God “destroyeth the perfect and the wicked” ([[Job 9:22]]); Elihu was angry with him because “he justified himself rather than God” ([[Job 32:2]]).

      What the LORD does not say matters as much. He does not call Job wicked, and He does not ask Job to give up his claim of innocence. In the reading that glosses “disannul,” Job had made it a contest in which God had to be wicked for Job to be righteous, and God is the first in the dialogue to suggest that both can be righteous. The lesson Job will learn is that he does not have to condemn God to be justified himself. In Elder Christofferson's words, Job “in deepest humility admits he possesses nothing even close to the knowledge, power, and righteousness of God and cannot stand in judgment of the Almighty.”
    sources: [christofferson-relationship-god, ot-minute-job-38, stirling-job]
  - ref: 10
    phrase: Deck thyself now with majesty and excellency
    kind: symbol
    title: Clothed in God's majesty
    body: |
      Verses 9–14 invite Job, with deliberate irony, to do God's work for a day. If Job has an arm like God's, let him put on God's robes of majesty, pour out his anger, look on every proud man and bring him low, and bury the wicked in the dust; then God will grant that Job's own right hand can save him. One older reading sums it up: “Try it only for once… to act like Me in the execution of penal justice, I would praise thee.”

      The images belong to scripture's language for what only God does. The same older reading says that verse 11 recalls Isaiah's day of judgment on everything lofty, when “the LORD alone shall be exalted in that day” ([[Isa. 2:11]]), and that verse 14 recalls Isaiah's word that when there was no one to intercede, the LORD's “arm brought salvation unto him” ([[Isa. 59:16]]; see also [[Isa. 63:5]]).

      A Latter-day Saint reading takes the irony further. God invites Job to use raw power and force all the world's wrongs right, so that Job will come to see what true justice is: ruling in love, without compulsion, as the Lord describes righteous dominion in [[D&C 121:34–45]]. On that reading Job apparently declines, probably because he realizes that force cannot bring good out of evil and that such power corrupts the one who uses it.
    sources: [delitzsch-job, nrsvue, stirling-job]
  - ref: 15
    phrase: Behold now behemoth, which I made with thee
    kind: symbol
    title: Behemoth, made with thee
    body: |
      The LORD ends the chapter by pointing Job to a creature he can look at but can never master. *Behemoth* is a plural of the Hebrew word for “beast,” and which animal it describes is not certain (possibly the hippopotamus). (Leviathan, its partner in the speech, is taken up at [[Job 41:1]].)

      “Which I made with thee” ([[Job 40:15]]) means, as a modern translation has it, “which I made just as I made you”: Job and behemoth come from the same Maker's hand. In verse 19 the beast is “the chief of the ways of God” ([[Job 40:19]]), where “chief” renders a Hebrew word whose sense is “beginning” or “first”; the modern translation reads “the first of the great acts of God; only its Maker can approach it with the sword.” Its strength is in its loins and its bones are like bars of iron (verses 16–18), yet it eats grass, lies quietly in the reeds, stays calm when the river floods, and no one can take it with a hook (verses 20–24).

      Two Latter-day Saint readings say why the LORD shows it to Job. One finds God's care in it: the God who looks after behemoth and leviathan is the God of whom Jesus said that not one sparrow falls without the Father ([[Matt. 10:29]]). The other sees in behemoth and in leviathan after it wild, untamable beasts that typify the proud and hard-hearted ([[Job 41:34]]), who cannot be led or brought into covenant with God (verse 24 runs straight into [[Job 41:1–4]]). Job has just been asked whether he could humble the proud (verses 11–12); in that reading, the Maker who made such creatures takes, in some sense, responsibility for them, and provides for their redemption without using force.
    sources: [bd-behemoth, oshb-wlc, nrsvue, bdb, ot-minute-job-38, stirling-job]

christ: |
  The voice that asks Job “Hast thou an arm like God?” is Jehovah's, and Jehovah is the premortal Jesus Christ. In the irony of verse 14, Job's own right hand cannot save him; one older reading says that line recalls Isaiah's word that when there was no intercessor, the LORD's own “arm brought salvation” ([[Isa. 59:16]]). The LORD whose arm saves there is Jehovah, the One who speaks to Job here. Job learns that he does not have to condemn God to be justified, and a disciple who suffers without explanation does not have to find God at fault either: it is folly for mortals, who see so little, to sit in judgment on Him, and the hand that saves is His, not their own.

