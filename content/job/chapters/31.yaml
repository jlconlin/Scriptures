chapter: 31
title: Let Me Be Weighed in an Even Balance
tagline: Job ends his defense under oath. Sin by sin, from a lingering look to a field taken from its owners, he calls down a curse on himself if he is guilty, signs his name to the whole, and asks the Almighty to answer.
when: "Job's last defense: the oath of innocence"

setting: |
  Chapter 31 closes Job's last defense, which began in chapter 29: there he remembered the days when God's friendship rested on his tent ([[Job 29:4]]), and in chapter 30 he described what he has become, mocked by the lowest and unanswered by God ([[Job 30:1]]; [[Job 30:20]]). Here he rests his case. The Church's chapter heading gives it in one line: Job invites judgment so that God may know his integrity, and if he has done ill he welcomes the penalties for it.

  The form is an oath of innocence. In one Latter-day Saint reading, Job denies fourteen sins in seven groups, the seven a sign that his faithfulness is complete, and binds himself under self-curses to God and to his fellow man. Some of the denials answer, under oath, the charges Eliphaz invented against him in [[Job 22:5–9]], which the note there sets side by side with Job's own account of his life. In chapter 27 he had already sworn by God's life that he would hold fast his integrity ([[Job 27:2–6]]); the oath formula itself is explained here, at verse 5.

  The chapter ends with a line no speaker says: “The words of Job are ended.” Elihu speaks next ([[Job 32]]), and Job does not speak again until the LORD has answered him out of the whirlwind ([[Job 40:3–5]]).

thread: |
  Job's claim is that his life will bear any examination, and he asks for one. He begins inside, with his eyes: he made a covenant with them and does not let them linger on a young woman, because God sees his ways and counts his steps (verses 1–4). Then the oath begins in earnest, and its form is the argument. “If I have…,” Job says again and again, and then names what should fall on him if it is true: let another eat what he sows, let his wife be taken by another, let his arm fall from its socket (verses 5–23).

  The sins he denies move outward. They run from deceit and adultery to his servants, the poor, the widow and the fatherless, and then turn back to the heart: trust in gold, a secret kiss thrown to the sun and moon, gladness at an enemy's ruin, a stranger left in the street, guilt hidden in his bosom as Adam hid (verses 24–34). Verse 15 gives the reason underneath much of it: the God who made Job in the womb made his servant there too.

  At verse 35 the oath breaks off into the plea it was leading to. Job signs his name to his defense, asks for the indictment his adversary has written, and says he would wear it as a crown and walk up to God like a prince (verses 35–37). A last stanza, on land that might cry out against him, finishes the oath, and the narrator closes Job's words (verses 38–40).

sections:
  - range: 1-4
    heading: A covenant with my eyes
    plain: |
      I made a covenant with my eyes; how then could I gaze at a young woman? For what share would I have from God above, what inheritance from the Almighty on high? Is not calamity for the wicked, and disaster for those who do evil? Does He not see my ways and count all my steps?
  - range: 5-12
    heading: Weighed in an even balance
    plain: |
      If I have walked with falsehood, or my foot has hurried to deceit, let God weigh me in honest scales, and He will know my integrity. If my step has turned from the way, or my heart has followed my eyes, or any stain has stuck to my hands, then let me sow and another eat, and let my crops be rooted out. If my heart has been enticed by a woman, or I have lain in wait at my neighbor's door, then let my wife grind grain for another man, and let other men have her. For that would be a heinous crime, an offense for the judges; it would be a fire that burns to destruction and roots out all my harvest.
  - range: 13-23
    heading: Did not He who made me make him?
    plain: |
      If I brushed aside the case of my manservant or my maidservant when they brought a complaint against me, what would I do when God rises up? When He examines me, what would I answer Him? Did not He who made me in the womb make him? Did not the same One form us both in the womb? If I have kept from the poor what they needed, or let the widow's eyes fail with waiting, or eaten my bread alone and not shared it with the fatherless (for from my youth I raised the orphan as a father would, and guided the widow from my birth); if I have seen anyone dying for lack of clothing, or a poor man with no covering, whose body did not bless me for the warmth of my sheep's wool; if I have raised my hand against the fatherless because I knew the court at the gate would back me: then let my shoulder fall from its blade and my arm be broken at the bone. For I dreaded destruction from God, and before His majesty I could not stand.
  - range: 24-28
    heading: Gold, and the sun and moon
    plain: |
      If I have made gold my hope, or said to fine gold, “You are my security”; if I rejoiced because my wealth was great and my hand had gained much; if I looked at the sun shining, or the moon moving in splendor, and my heart was secretly enticed, and my hand threw them a kiss from my mouth: that too would be a crime for the judges, for I would have been false to God above.
  - range: 29-34
    heading: Nothing hidden
    plain: |
      If I rejoiced at the ruin of a man who hated me, or exulted when trouble found him (no, I have not let my mouth sin by calling down a curse on his life); if the men of my household never said, “Oh, that we had some of his meat! We cannot get enough” (no stranger spent the night in the street; I opened my doors to the traveler); if I hid my transgressions as Adam did, burying my guilt in my bosom, because I was afraid of the crowd and the contempt of the clans terrified me, so that I kept quiet and did not go out of my door—
  - range: 35-37
    heading: Here is my signature
    plain: |
      Oh, that someone would hear me! Here is my signature: let the Almighty answer me! Oh, that I had the indictment my adversary has written! I would carry it on my shoulder and bind it on me like a crown. I would give Him an account of every step I have taken; like a prince I would approach Him.
  - range: 38-40
    heading: If my land cry against me
    plain: |
      If my land has cried out against me, and its furrows have wept together; if I have eaten its produce without paying for it, or caused its owners to lose their lives: then let thistles grow instead of wheat, and noxious weeds instead of barley. The words of Job are ended.

notes:
  - ref: 1
    phrase: I made a covenant with mine eyes
    kind: scripture
    title: A covenant with his eyes
    body: |
      Job begins his oath not with a deed but with a look. Before he swears that he never took his neighbor's wife (verses 9–12), he says he never let himself so much as gaze at a young woman, because he had bound his own eyes by covenant. The Church's footnote to “covenant” points to the revelation that tells the Saints they “shall bind yourselves to act in all holiness before me” ([[D&C 43:9]]): a covenant there, too, is something a person makes by binding himself, down to what he lets himself do.

      One Latter-day Saint reading takes the whole chapter in that light, as Job recommitting himself “in covenant fidelity” to God and his fellow man. Verses 2–4 give the reason he would bind even his eyes: God sees his ways and counts his steps.
    sources: [lds-scriptures, stirling-job]
  - ref: 5
    phrase: If I have walked with vanity
    kind: history
    title: Swearing by his own ruin
    body: |
      Verse 5 begins the oath formula that runs through the rest of the chapter: if I have done this, then let that befall me. It is a self-curse. A man swearing in Hebrew names the crime and calls down a penalty on himself if he committed it, and the penalty was often left unsaid, so that a bare *if I have done this* came to mean *I certainly have not*. The standard lexicon describes the particle *ʾim*, “if,” becoming an emphatic negative in just this way, with the formula of imprecation omitted. In chapter 31 Job sometimes leaves the curse unspoken and sometimes says it aloud: let another eat what he sows (verse 8), let his wife be taken (verse 10), let his arm fall from its socket (verse 22), let thistles grow in place of wheat (verse 40).

      One Latter-day Saint reading counts five such self-curses and sees in them Job consecrating himself to God and his neighbor. The same reading notes that self-cursing oaths were common in the ancient world and were often joined to a sacrifice, as if to say, “May it be done to me as to these animals if I do not keep my covenant.” So Jeremiah warns the leaders of Judah that the Lord will treat them like the calf they cut in two when they covenanted to help the poor ([[Jer. 34:18–20]]), and the Lord Himself passed between the pieces of the sacrifice as the token of His covenant with Abraham ([[Gen. 15:8–18]]).

      Verse 6 says what Job wants from all this: “Let me be weighed in an even balance, that God may know mine integrity.” He is not asking for mercy but for honest scales. A Latter-day Saint reading of the book puts it this way: even weighed by ordinary justice, Job maintains, his suffering is out of proportion to any sin that could be laid to his charge.
    sources: [bdb, stirling-job, tanner-considered-job]
  - ref: 13
    phrase: If I did despise the cause of my manservant or of my maidservant
    kind: history
    title: The servant's case
    body: |
      Job swears that when his own servants had a grievance against him, he heard it. A modern translation renders “when they contended with me” as “when they brought a complaint against me”: the servant began the dispute with his master, and Job let it be heard rather than brushing it aside. In one older reading Job treated his servants as persons, not property, and allowed them to maintain their right against him.

      Verses 14–15 give his reason, and it is about God, not about servants. If Job despised his servant's case, what would he answer when God rose up to examine his own? “Did not he that made me in the womb make him? and did not one fashion us in the womb?” The same Creator made master and servant alike. The Church's footnote sets beside it Malachi's “Have we not all one father? hath not one God created us?” ([[Mal. 2:10]]), where the same truth forbids a man to deal treacherously with his brother. One Latter-day Saint reading finds the oath's solidarity with God and man at its fullest in these verses: Job is committed to treating his neighbor as himself before God.
    sources: [delitzsch-job, nrsvue, lds-scriptures, stirling-job]
  - ref: 26
    phrase: If I beheld the sun when it shined
    kind: symbol
    title: A kiss thrown to the moon
    body: |
      Verses 26–27 deny a secret act of worship. To look at the sun shining or the moon “walking in brightness,” let the heart be enticed, and have the mouth kiss the hand, is to throw a kiss toward a heavenly body as one would toward an idol. In one older reading, kissing the hand in the direction of the object of veneration was the gesture of adoration itself, and scripture knows the kiss as an act of worship of a false god ([[1 Kgs. 19:18]]; [[Hosea 13:2]]).

      The denial stands next to the one before it, on making gold one's hope (verses 24–25). The same older reading joins the two through Paul's “covetousness, which is idolatry” ([[Col. 3:5]]): Job avoided the one, and so all the more the worship of the stars. Verse 28 names why either would be a crime: “I should have denied the God that is above.” It would have been hypocrisy, in that reading, to own God openly while disowning Him in secret.
    sources: [delitzsch-job, nrsvue]
  - ref: 33
    phrase: If I covered my transgressions as Adam
    kind: words
    title: As Adam, or as men do?
    body: |
      The Hebrew *kĕʾādām* can mean either “as Adam” or “as men do,” and the King James chose Adam. The Church's footnote gives the other rendering, “as some men do,” and a modern translation has “as others do.” Either way, Job swears he did not hide his sin in his bosom for fear of what the crowd and the clans would say.

      One older reading prefers “as Adam,” because a mere “as men do” would be tame here, and takes the point of comparison to be the sinner's dread of the light, first seen when Adam hid himself among the trees ([[Gen. 3:8–10]]). The same reading draws the contrast with verse 37: Adam had to be drawn out of his hiding place and examined in fear, while Job asks to come before God like a prince. A Latter-day Saint study of where Lehi learned of the Fall reports that Job 31:33 is one of four Old Testament passages that may refer to Adam's transgression, since *kĕʾādām* “could just as easily be read as ‘like Adam.’”
    sources: [oshb-wlc, lds-scriptures, nrsvue, delitzsch-job, sc-knowhy-28]
  - ref: 35
    phrase: Oh that one would hear me!
    kind: history
    title: Here is my signature
    body: |
      Verse 35 is Job's last plea, and it is the language of a lawsuit. Where the King James says “behold, my desire is,” the Hebrew says *hen tāwî*, behold, my mark. The standard lexicon reads it as Job's written mark in attestation, and a modern translation renders it “Here is my signature!” Job has made his sworn statement; now he signs it and asks the Almighty to answer.

      What he wants in return is “the indictment written by my adversary,” the charge against him in writing. In one older reading, he is so sure of his innocence that he would carry the indictment on his shoulder as a mark of honor and wind it about himself like a crown, give God an account of every step, and come before Him as a prince (verses 36–37). A Latter-day Saint reading of the book counts this cry with Job's repeated demands for a hearing ([[Job 16:21]]; [[Job 23:3–4]]): he wants to bring God into court and prove his innocence there.

      Readers judge the plea differently. The same Latter-day Saint reading suggests that the LORD's approval of Job at the end of the book ([[Job 42:7]]) may extend to Job's binding oaths in covenant fidelity to God and man. The older reading calls verse 37 a rash utterance, and holds that the LORD's first words, “Who is this that darkeneth counsel by words without knowledge?” ([[Job 38:2]]), would fit best directly after it, since that boast is itself a darkening of counsel.
    sources: [oshb-wlc, bdb, nrsvue, delitzsch-job, tanner-considered-job, stirling-job]
  - ref: 40
    phrase: The words of Job are ended.
    kind: history
    title: The words of Job are ended
    body: |
      The chapter's last line is not Job's: a narrator's voice tells the reader that Job has said all he will say. The dialogue with the friends is over, and Job's next words come only after the LORD has spoken, and they are few ([[Job 40:3–5]]; [[Job 42:1–6]]). Elihu's speeches come first ([[Job 32–37]]).

      The oath ends with a curse on Job's land: if he has taken its produce without paying, or caused the death of its owners, let “thistles grow instead of wheat, and cockle instead of barley.” One Latter-day Saint reading hears in it the curse on the ground after the Fall, “Thorns also and thistles shall it bring forth to thee” ([[Gen. 3:18]]), and notes that Job invokes the curse only because he is confident he will not suffer it. In that reading he stands ready to have the Fall reversed and to come into God's presence, as the brother of Jared did ([[Ether 3:13]]).
    sources: [stirling-job]

christ: |
  Job came to the end of his speeches asking to approach God “as a prince,” on the strength of a life he could swear to clause by clause. One Latter-day Saint reading sets his confidence to approach God beside the confidence the New Testament and modern revelation give the disciple ([[Heb. 10:19–23]]; [[D&C 121:45–46]]). Hebrews names what opens that way: the disciple has “boldness to enter into the holiest by the blood of Jesus” ([[Heb. 10:19]]).

  The Lord's word from Liberty Jail ties that confidence to the two things Job swore to, charity toward others and clean thoughts: “Let thy bowels also be full of charity towards all men, and to the household of faith, and let virtue garnish thy thoughts unceasingly; then shall thy confidence wax strong in the presence of God” ([[D&C 121:45]]). A disciple who comes to God by the way Christ opened finds that confidence grow as the thoughts are kept clean and the servant, the poor and the stranger are cared for.

