chapter: 9
title: How Should Man Be Just with God?
tagline: Job answers Bildad. He grants that God is just and mighty, and finds in that very might the reason he can never win his case, for there is no daysman to stand between them.
when: 'The first round: Job answers Bildad'

setting: |
  Chapter 9 begins Job's answer to Bildad, the second friend to speak in the first round of the dialogue ([[Job 8]]). Bildad had asked, “Doth God pervert judgment?” ([[Job 8:3]]), had said that Job's children died for their own transgression ([[Job 8:4]]), and had promised that if Job were pure and upright God would restore him ([[Job 8:5–6]]). Why the friends' reasoning fails Job is taken up once, at [[Job 4:7]].

  Job's reply fills chapters 9 and 10, which belong together. In chapter 9 he speaks mostly about God rather than to Him, though in verses 28–31 he turns to address Him as “thou”; in chapter 10 he speaks to God directly. He does not dispute Bildad's main point, that God does not pervert what is right. He grants it, and then asks what it means for a man who knows he is innocent and cannot get a hearing. The speech is cast in the language of the lawcourt: contending, answering, pleading, justifying, a judge, and at the end the wish for an arbiter.

thread: |
  Job's claim is that God's might makes a fair trial impossible. He grants the friends' doctrine and turns it: yes, God is just, so how could a man ever be in the right against Him? If it came to a lawsuit, a man could not answer one charge in a thousand (verses 1–4). His proof is a hymn to God's power, chosen from its terrible side: mountains overturned, the earth shaken, the sun told not to rise, a God who passes by unseen and whom no one can ask, “What doest thou?” (verses 5–13).

  So, he goes on, even if he were righteous he could not answer; God's blows already show how a meeting would go (verses 14–21). The speech turns at verse 22, Job's “one thing”: God destroys the perfect and the wicked alike, and the world seems to have lost its order (verses 22–24). His days flee; he cannot comfort himself, and however he washes he will be plunged back into the ditch (verses 25–31). He ends with what he lacks: God is not a man he could face in court, and there is no daysman between them. If only the rod were taken away, he would speak without fear (verses 32–35).

sections:
  - range: 1-4
    heading: Who can be in the right with God?
    plain: |
      Job answered: Yes, I know it is so. But how can a mortal be in the right before God? If someone wanted to argue his case with Him, he could not answer Him once in a thousand times. God is wise in heart and mighty in strength. Who has ever defied Him and come out unharmed?
  - range: 5-13
    heading: The power no one can question
    plain: |
      He moves mountains before they know it and overturns them in His anger. He shakes the earth out of its place, and its pillars tremble. He commands the sun, and it does not rise; He seals up the stars. He alone stretches out the heavens and walks on the waves of the sea. He made Arcturus, Orion and the Pleiades, and the chambers of the southern sky. He does great things beyond searching out, wonders without number. He passes right by me, and I do not see Him; He moves on, and I do not perceive Him. He takes away, and who can stop Him? Who will say to Him, “What are You doing?” God does not hold back His anger; even the proud helpers of Rahab bowed beneath Him.
  - range: 14-21
    heading: I could not answer Him
    plain: |
      How then could I answer Him, or choose my words to argue with Him? Even if I were in the right, I could not answer; I could only plead for mercy with my judge. If I called and He answered, I still would not believe He was listening to me. For He crushes me with a storm and multiplies my wounds for no reason. He will not let me catch my breath; He fills me with bitterness. If it is a matter of strength, He is the strong one; if it is a matter of justice, who will summon Him to court for me? If I claimed to be in the right, my own mouth would condemn me; if I said I was blameless, it would prove me crooked. Even if I were blameless, I would not regard myself; I would loathe my life.
  - range: 22-24
    heading: The perfect and the wicked alike
    plain: |
      It is all one, and so I say it: He destroys the blameless and the wicked together. When disaster brings sudden death, He mocks the trials of the innocent. The earth is handed over to the wicked; He covers the faces of its judges. If it is not He, then who is it?
  - range: 25-31
    heading: I cannot make myself clean
    plain: |
      My days run faster than a courier; they flee away without seeing any good. They glide past like swift boats, like an eagle swooping on its prey. If I say, “I will forget my complaint, put away my sad face and cheer up,” I dread all my sufferings, because I know You will not hold me innocent. If I am to be counted guilty anyway, why should I struggle for nothing? If I washed myself with snow water and scrubbed my hands clean, You would still plunge me into the ditch, until my own clothes would loathe me.
  - range: 32-35
    heading: No daysman between us
    plain: |
      For He is not a man like me, that I could answer Him and we could go to court together. There is no arbiter between us, who could lay his hand on us both. If He would take His rod away from me and not let the dread of Him terrify me, then I would speak and not be afraid of Him; but as things stand with me, I cannot.

notes:
  - ref: 2
    phrase: how should man be just with God?
    kind: words
    title: In the right before God
    body: |
      Job's question is a courtroom question: how can a mortal win his case against God? The verb here (*ṣādaq*) means to be justified in one's plea, and in the same chapter it is the claim of a man with a just cause: “though I were righteous” (verse 15), “if I justify myself” (verse 20). So Job is not asking how a sinner can become righteous. He is asking how a man who *is* in the right could ever get God to acknowledge it. Verse 3 gives his answer: if a man took God to law (“contend”), he could not answer one time in a thousand. He believes he is righteous, and he does not believe he could win a court case against God; the rest of the chapter works out why.
    sources: [bdb, oshb-wlc, ot-minute-job-4]
  - ref: 8
    phrase: treadeth upon the waves of the sea
    kind: christ
    title: He walks on the sea
    body: |
      Walking on the sea is, in Job's hymn, a work of God: He “alone spreadeth out the heavens, and treadeth upon the waves of the sea.” The Greek translation puts the picture plainly, “walks on the sea as on firm ground”: the heaving waves are a floor under His feet.

      When Jesus walked across the Sea of Galilee to His disciples ([[John 6:19]]; [[Matt. 14:25]]), He did what this verse attributes to God. That control over the elements showed that He “possessed power typically attributed to Jehovah in the Old Testament,” and this verse is one of the places where that power is attributed (the note on [[Amos 4:13]] says who Jehovah is).
    sources: [lxx-rahlfs, sc-knowhy-664]
  - ref: 10
    phrase: Which doeth great things past finding out
    kind: scripture
    title: Eliphaz's hymn, turned
    body: |
      Job's hymn to God's power (verses 5–10) ends in Eliphaz's own words. Eliphaz had said that God “doeth great things and unsearchable; marvellous things without number” ([[Job 5:9]]), and Job repeats it almost word for word. He agrees with the friends about God's power; what he disagrees with is what follows from it. In one older reading, the friends drew from God's greatness the duty of the sufferer to humble himself (Eliphaz's counsel was “I would seek unto God,” [[Job 5:8]]), while Job draws the bleaker conclusion that no man's right can be maintained against such a God. In the same reading, that is why Job's version dwells on the terrible side of creation: mountains overturned in anger, the earth shaken on its pillars, the sun commanded not to rise, the stars sealed up (verses 5–7). The Maker can also unmake.

      Then Job adds what Eliphaz had not said. This God goes by, and Job cannot see Him (verse 11); He takes away, and no one can say to Him, “What doest thou?” (verse 12). One Latter-day Saint reading points out the irony: Job seems to say that no one may question God's actions, and questioning God is exactly what he goes on to do.
    sources: [delitzsch-job, stirling-job]
  - ref: 13
    phrase: the proud helpers do stoop under him
    kind: symbol
    title: The helpers of Rahab
    body: |
      The King James's “proud helpers” are, in Hebrew, “the helpers of Rahab,” as a modern translation renders them. This Rahab is not the woman of Jericho but a mythical sea monster whose name means storm or arrogance (hence the King James's “proud”): the image of chaos that the Lord subdues, explained at [[Isa. 51:9]], and named again at [[Job 26:12]]. The same picture may stand behind verse 8, which a modern translation's margin reads as God having “trampled the back of the sea dragon.”

      What Job does with the image is in the next verse: “How much less shall I answer him” (verse 14). If the monster and all its helpers bowed beneath God's anger, what chance has one man in court?
    sources: [oshb-wlc, nrsvue, bdb]
  - ref: 22
    phrase: He destroyeth the perfect and the wicked
    kind: scripture
    title: Job's charge, and God's answer
    body: |
      Job's “one thing” is the most daring claim in the chapter: God destroys the blameless and the wicked alike, mocks the trial of the innocent (verses 22–23), and hands the earth to the wicked with its judges blindfolded (verse 24). It is Job's claim, made from his own experience, and not the book's teaching. The reader knows from the prologue that Job is “perfect” ([[Job 1:1]], where the word is explained), and Job insists on it here (verses 20–21).

      Job's dilemma grows out of the theology he had shared with the friends. In one Latter-day Saint reading, Job had always believed that a just God rewards the righteous and sends calamity on the wicked. Knowing he is innocent, he is left with only two possibilities, that he is unjust or that God is, and in this chapter he considers the possibility that God simply does whatever He pleases and calls it right. The book does not leave the charge standing. When the LORD speaks, He asks, “Wilt thou condemn me, that thou mayest be righteous?” ([[Job 40:8]]), and the same reading sees Job coming to understand that he does not have to condemn God in order to justify himself.
    sources: [stirling-job, ot-minute-job-4]
  - ref: 33
    phrase: Neither is there any daysman betwixt us
    kind: words
    title: No daysman between us
    body: |
      A daysman is “an umpire or arbiter; a mediator,” and Job's complaint is that he has none. The Hebrew word (*môkîaḥ*) comes from a verb meaning to decide or judge, and with “between” it names the one who decides between two parties. In one older reading, laying a hand on both is a sign of authority, the arbiter holding each party to his decision, and Job's trouble is that God is not his equal (verse 32) but accuser and judge in one person, so there is no one above them both to do it.

      The Greek translation turns the complaint into a wish: “Would that he our mediator were present, and a reprover, and one who should hear the cause between both,” and a modern translation notes that the Hebrew can also be read “Would that there were a mediator.” Either way, verses 34–35 say what Job wants: the rod taken away and the dread of God lifted, so that he could speak and not be afraid.

      Job despairs in verse 32 because God “is not a man, as I am, that I should answer him.” When the LORD at last speaks, He calls on Job to answer His questions “like a man” ([[Job 38:3]]); one Latter-day Saint reading sees in that challenge the hearing Job had despaired of.

      The theme page [A Daysman Betwixt Us](/job/themes/daysman-betwixt-us/) reads this complaint as the start of a line of pleas that the book answers at 42:8, where the man who had no daysman is made the intercessor for his friends.
    sources: [webster-1828, oshb-wlc, bdb, delitzsch-job, lxx-rahlfs, nrsvue, stirling-job]

christ: |
  Job wanted a daysman who could stand between him and God and lay a hand on both, and he found none, because God “is not a man, as I am” (verse 32). Job does not name Christ, and the verse is a lament, not a prophecy; but the New Testament names the mediator Job lacked: “there is one God, and one mediator between God and men, the man Christ Jesus” ([[1 Tim. 2:5]]), whose Atonement made it possible for people to repent and be reconciled to God. In latter-day revelation He is the advocate who pleads before the Father, “Father, behold the sufferings and death of him who did no sin” ([[D&C 45:3–5]]). A disciple who feels, as Job did, that heaven is out of reach and that his own words would only condemn him has that advocate, who is both God and man, and who pleads His own sufferings rather than the disciple's innocence.

explore: |
  - **Job's case against God.** Follow the courtroom from here through [[Job 13:3]], [[Job 13:18–22]], [[Job 23:3–7]] and [[Job 31:35]] to the LORD's answer in [[Job 38:1–3]] and [[Job 40:8]].
  - **The mediator Job longed for.** [[Job 16:19–21]]; [[Job 19:25–27]]; [[Heb. 7:25]].

