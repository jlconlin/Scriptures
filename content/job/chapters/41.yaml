chapter: 41
title: Who Then Is Able to Stand before Me?
tagline: The LORD ends His second speech with leviathan, a creature no man can hook, tame or wound. If no one dares rouse him, no one can stand before his Maker, to whom everything under heaven belongs.
when: 'The LORD out of the whirlwind: the second speech'

setting: |
  Chapter 41 is the last part of the LORD's second speech out of the whirlwind, which began at [[Job 40:6]]. After the first speech (chapters 38–39), Job had said he would lay his hand on his mouth and answer no more ([[Job 40:4–5]]). The LORD spoke again. Would Job condemn God so that he himself might be righteous? Then let him deck himself with majesty, look on every one that is proud and bring him low ([[Job 40:8–14]]). Then the LORD set two creatures before Job: behemoth ([[Job 40:15]], where the note introduces the pair) and, through the whole of this chapter, leviathan. The LORD named them to help Job understand His great power over all creation. Why the LORD answers Job with questions and not with reasons is taken up at [[Job 38:1]].

  Hebrew Bibles divide the speech at a different place: the King James 41:1–8 are the last verses of chapter 40 there (41:1 is Hebrew 40:25), so the verse numbers of this chapter differ in Hebrew editions and in some translations. When the LORD stops speaking, Job answers Him for the last time ([[Job 42:1–6]]).

thread: |
  The chapter's claim is that the creature no man can master belongs to a God no man can challenge. It opens with questions that all expect the answer no (verses 1–9): can Job land leviathan with a hook, lead him by a cord, hear him beg, make a covenant with him, keep him as a pet, sell him in the market, or pierce him with harpoons? One touch, and he would remember the fight and never try again.

  Verses 10–11 turn from the creature to its Maker. No one is fierce enough to rouse leviathan; who then can stand before the LORD? No one has given God anything first that He must repay, and everything under heaven is His.

  Verses 12–34 are the portrait. His hide is a coat no one can strip and his scales are sealed so close that no air comes between them (verses 13–17). Light flashes from him, fire and smoke seem to pour from his mouth and nostrils (verses 18–21; the note on verse 18 explains the images). Strength lives in his neck, and the King James “sorrow is turned into joy before him” reads in a modern translation “terror dances before it” (verse 22). When he rears up, the mighty are afraid; the King James “by reason of breakings they purify themselves” is, in the same translation, “at the crashing they are beside themselves” (verse 25). Sword, spear and arrow are straw and rotten wood to him (verses 26–29); he churns the deep and leaves a shining wake (verses 30–32). The speech ends on his rank: there is nothing like him on earth, a creature made without fear, king over all the children of pride (verses 33–34).

sections:
  - range: 1-9
    heading: Canst Thou Draw Out Leviathan?
    plain: |
      Can you pull out leviathan with a fishhook, or tie down his tongue with a line? Can you put a cord through his nose, or pierce his jaw with a hook? Will he plead with you at length, or speak to you gently? Will he make a covenant with you, so that you can take him as your servant for life? Will you play with him as with a bird, or put him on a leash for your young girls? Will traders bargain over him, and divide him up among the merchants? Can you fill his hide with harpoons, or his head with fishing spears? Lay a hand on him once: you will remember the fight, and you will not do it again. Any hope of taking him comes to nothing; the very sight of him lays a man low.
  - range: 10-11
    heading: Who Then Is Able to Stand before Me?
    plain: |
      No one is fierce enough to dare rouse him. Who, then, can stand before Me? Who has given Me anything first, that I should have to repay him? Everything under the whole heaven is Mine.
  - range: 12-24
    heading: His Comely Proportion
    plain: |
      I will not keep silent about his limbs, his strength and his fine frame. Who can strip off his outer coat? Who can come at him with a double bridle? Who can pry open the doors of his face? Terror circles his teeth. His scales are his pride, shut up tight as with a seal. Each is so close to the next that no air can come between them; they are joined to one another and cling together, and they cannot be pulled apart. When he sneezes, light flashes out, and his eyes are like the eyelids of the dawn. Burning torches go out of his mouth, and sparks of fire leap out. Smoke pours from his nostrils as from a boiling pot over a fire. His breath kindles coals, and a flame goes out of his mouth. Strength lives in his neck, and terror leaps before him. The folds of his flesh are joined fast, firm on him and immovable. His heart is as hard as stone, as hard as the lower millstone.
  - range: 25-34
    heading: King over All the Children of Pride
    plain: |
      When he rears up, the mighty are afraid; they are beside themselves at the crashing. The sword that reaches him does not hold, nor spear, dart or coat of mail. He counts iron as straw and bronze as rotten wood. The arrow cannot make him run; sling stones turn to chaff against him. Darts are counted as chaff; he laughs at the rattle of the javelin. His underside is like sharp stones; he leaves sharp marks on the mud. He makes the deep boil like a pot and stirs the sea like a pot of ointment. Behind him he leaves a shining path; one would think the deep had gray hair. There is nothing on earth like him, a creature made without fear. He looks down on everything lofty; he is king over all the proud.

notes:
  - ref: 1
    phrase: Canst thou draw out leviathan with an hook?
    kind: history
    title: 'Leviathan: the crocodile and the dragon'
    body: |
      Leviathan bears the name of the sea monster of the old stories, and the verses that follow describe a creature no hunter can take. Whether a real animal or the monster of the stories is meant is left open: the word can mean “any great sea or land monster, such as the crocodile,” and here is possibly “a poetic depiction of a crocodile or a mythological creature described in ancient Canaanite texts.” One Latter-day Saint reading holds the two together: leviathan, “the seven-headed sea dragon of Canaanite myth, is here likely a poetic description of a crocodile.”

      The name brings its history with it. Elsewhere leviathan is the monster the LORD breaks and punishes ([[Ps. 74:14]]; [[Isa. 27:1]]; the notes there explain the old picture of God subduing the powers of chaos). In this chapter he is set before Job as a creature beyond any man's reach: verses 1–9 ask whether Job could do with leviathan what men do with fish, servants, pets and goods.
    sources: [scripture-helps-job, bd-leviathan, stirling-job, lds-scriptures]
  - ref: 10
    phrase: who then is able to stand before me?
    kind: words
    title: Before me
    body: |
      Verses 10–11 turn the speech from the creature to its Maker: if no one dares rouse leviathan, no one can stand before the God who made him. The Hebrew has “me” in both verses, and the King James keeps it. A modern translation keeps the eye on the beast instead, “Who can stand before it?” in verse 10 and “Who can confront it and be safe?” in verse 11, with a note that the Hebrew reads “me.” Read with the Hebrew, the LORD draws from leviathan the conclusion of all His questions.

      Verse 11 gives the ground. In older English “prevent” meant “to go before; to precede”: who has given God anything first, so that God now owes him? Everything under heaven is His already.
    sources: [nrsvue, webster-1828]
  - ref: 18
    phrase: By his neesings a light doth shine
    kind: symbol
    title: Fire from his mouth
    body: |
      In one older reading, the light and fire of verses 18–21 are poetry built on what an observer of the crocodile could see, not a claim that the animal breathes flame, and each line has its observation behind it. The crocodile lies on the bank with its open jaws turned to the sun; when it sneezes, the spray catches the light, an observation “compressed into three words.” Its eyes, set close together and slanting, “glimmer through the water… with a red glow,” so they can be likened to the eyelids of the dawn (one of several explanations that reading offers for that line), and an ancient account of Egyptian writing says that a crocodile's two eyes were the sign for dawn. The hot breath from its nostrils “produces the impression of a fire existing beneath, and bursting forth,” and the poet gives that impression “faithfully but poetically.”
    sources: [delitzsch-job]
  - ref: 34
    phrase: he is a king over all the children of pride
    kind: symbol
    title: King over the children of pride
    body: |
      The speech ends on leviathan's pride, and the Hebrew ties it to the proud beasts of the wild. “Children of pride” is *bĕnê šāḥaṣ*, the same two words the King James renders “the lion's whelps” in [[Job 28:8]], where they are the beasts that have never trodden the miner's hidden path. In one older reading that is the sense here too: leviathan looks on everything lofty without flinching and is king over “every beast of prey that proudly roams about.”

      Why the speech ends on pride is taken up at [[Job 40:15]]: in one Latter-day Saint reading the two creatures typify the proud and hard-hearted who cannot be brought into covenant with God, the covenant leviathan will not make in verse 4.
    sources: [oshb-wlc, delitzsch-job, stirling-job]

christ: |
  The voice that asks “who then is able to stand before me?” is Jehovah's, and Jehovah is the premortal Jesus Christ. Leviathan, whom no man can draw out with a hook, is His creature, and whatever is under the whole heaven is His (verse 11); Isaiah sees the same LORD punish leviathan with His great sword ([[Isa. 27:1]]). No one stands before Christ as His creditor: whatever a disciple brings Him was His first, and what no human strength can master is still in His hand.

