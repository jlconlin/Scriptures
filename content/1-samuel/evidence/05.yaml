chapter: 5
claims:
  - where: setting
    claim: 'The Philistines held the coastal lowland as a confederation of five cities, Ashdod, Gaza, Ashkelon, Gath and Ekron, each with its lord'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'occupied before the days of Abraham (Gen. 21:32) the rich lowland on the Mediterranean coast from Joppa to the Egyptian desert. They formed a confederation of five chief cities, namely, Ashdod, Gaza, Ashkelon, Gath, and Ekron, each governed by its “lord.”'
  - where: setting
    claim: 'Ashdod stood on a rise near the sea about 35 miles west of Jerusalem, on the high road between Syria and Egypt'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/5.htm'
    quote: 'Ashdod (in Greek Azotus, Acts 8:40), one of the five cities of the Philistine league, was situated on an eminence near the sea, about 35 miles W. of Jerusalem. It was a place of great strength, and special importance, from its position on the high road between Syria and Egypt.'
  - where: thread
    claim: 'The Philistines believed Dagon had given them victory over Jehovah and set the ark at the feet of his statue as a war trophy; the events showed Jehovah’s superiority'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'The Philistines believed that Dagon had given them victory over Jehovah and the Israelites. They brought the ark of the covenant into Dagon’s temple and placed it at the feet of Dagon’s statue as a war trophy.'
  - where: thread
    claim: 'The episode was a contest between the two images and dramatized the danger of treating as an outward trophy what was meant to be a token of inward covenants; reliance on an object, not reverence for God'
    key: halverson-swine
    url: 'https://rsc.byu.edu/ascending-mountain-lord/swines-blood-broken-serpents-rejection-rehabilitation-worship-old-testament'
    quote: 'having dramatized the danger of treating as an outward trophy what was meant to be a token of inward covenants. From start to finish, this was not a story of reverence for Israel’s God, but reliance on an object meant to symbolize him.'
  - where: thread
    claim: 'Each city was visited with a heavier judgment than the one before'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/5.htm'
    quote: 'Each city was visited with a heavier judgment than the preceding one.'
  - where: note 6 “The hand of the LORD”
    claim: 'At Ekron the hand of God was very heavy, and the city cried out'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/5?lang=eng'
    quote: 'the hand of God was very heavy there.'
  - where: section 2 plain
    claim: '“Emerods” means tumors or boils'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/5?lang=eng'
    quote: 'OR tumors, boils (also vv. 9, 12).'
  - where: section 2 plain
    claim: '“Coasts” means borders, the territory around the city'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/5.htm'
    quote: 'the coasts thereof] = the borders thereof. Coast is derived from costa, a rib, or side, and originally meant any border or frontier-line, not the sea-line only'
  - where: section 1 plain
    claim: 'Literally “only Dagon was left upon him”: either a word for trunk or body was lost, or “Dagon” denotes the body; on either reading the trunk remained'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/5.htm'
    quote: 'only the stump of Dagon was left to him] Lit., only Dagon was left upon him. Either some word for ‘trunk’ or ‘body’ has been lost in the original, or ‘Dagon’ is used to denote the fish-shaped body of the idol'
  - where: 'note 5:2 “Dagon and the trophy”'
    claim: 'Dagon was the god of the Philistines, with temples at Gaza and Ashdod; pictured part man part fish, or connected with dagan, grain'
    key: bd-dagon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dagon?lang=eng'
    quote: 'The god of the Philistines (Judg. 16:23; 1 Sam. 5:2). There were temples of Dagon at Gaza and Ashdod … His image was in the form partly of a man and partly of a fish. Some writers, however, question whether Dagon was really a fish-god and connect the name with dagan, “grain.”'
  - where: 'note 5:2 “Dagon and the trophy”'
    claim: 'The name means fish'
    key: bd-dagon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dagon?lang=eng'
    quote: 'Fish. The god of the Philistines'
  - where: 'note 5:2 “Dagon and the trophy”'
    claim: 'Three Old Testament incidents concern Dagon’s worship: Samson at Gaza, the ark at Ashdod, Saul’s head placed in the temple of Dagon after Gilboa'
    key: bd-dagon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dagon?lang=eng'
    quote: 'Three Old Testament incidents have somewhat to do with the worship of Dagon. … at Beth-shan, after a battle between the Philistines and Israel at Mount Gilboa, the head of King Saul was placed in the temple of Dagon (1 Chr. 10:10).'
  - where: 'note 5:2 “Dagon and the trophy”'
    claim: 'The Philistines believed Dagon had given them the victory and placed the ark at the statue’s feet as a war trophy'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'They brought the ark of the covenant into Dagon’s temple and placed it at the feet of Dagon’s statue as a war trophy.'
  - where: 'note 5:3 “Fallen on his face”'
    claim: 'Fallen on his face is the attitude of homage; the Lord shows He is the living God; Isa. 19:1'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/5.htm'
    quote: 'Dagon was fallen upon his face to the earth] In the attitude of homage to the ark. Jehovah does not leave the Philistines to fancy that their god has conquered Him. He will shew that He is “the living God.” “The idols shall be moved at his presence” (Isaiah 19:1).'
  - where: 'note 5:3 “Fallen on his face”'
    claim: 'The Ashdodites supposed the first fall an accident; Dagon lay prostrate as though worshipping'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/5.htm'
    quote: 'restored him to his place again, evidently supposing that the idol had fallen or been thrown down by some accident.'
  - where: 'note 5:3 “Fallen on his face”'
    claim: 'One older reading: Dagon lay prostrate as though worshipping; the second fall, with head and hands cut off, showed the annihilation of the idol and precluded every thought of accident'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/5.htm'
    quote: 'כּרוּת means cut off, and not broken off … lay prostrate upon the earth, as though worshipping before the God of Israel … the second miracle was to show them the annihilation of their idol through the God of Israel, in such a way as to preclude every thought of accident.'
  - where: 'note 5:3 “Fallen on his face”'
    claim: 'The priests did not step on the threshold, as a mark of reverence for the place; “unto this day”: the custom still kept when the historian wrote'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/5.htm'
    quote: 'Therefore neither the priests, &c.] As a mark of reverence for the spot where their idol had lain. … unto this day] The practice was still observed when the historian wrote.'
  - where: 'note 5:3 “Fallen on his face”'
    claim: 'Worshippers stepped over the threshold so as not to defile the place where the pieces of their god had lain'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/5.htm'
    quote: 'but stepped over the threshold … that they might not touch with their feet, and so defile, the place where the pieces of their god had lain.'
  - where: 'note 5:3 “Fallen on his face”'
    claim: 'Literally “only Dagon was left upon him”: either a word for trunk or body has been lost, or “Dagon” denotes the body of the idol'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/5.htm'
    quote: 'Lit., only Dagon was left upon him. Either some word for ‘trunk’ or ‘body’ has been lost in the original, or ‘Dagon’ is used to denote the fish-shaped body of the idol'
  - where: 'note 5:3 “Fallen on his face”'
    claim: 'A contest between the two images'
    key: halverson-swine
    url: 'https://rsc.byu.edu/ascending-mountain-lord/swines-blood-broken-serpents-rejection-rehabilitation-worship-old-testament'
    quote: 'when the Philistines installed the ark in the temple of their own god, Dagon, a contest between the two images ensued'
  - where: thread
    claim: 'Israel assumed the ark, “it,” would save them, mistaking the symbol for the source'
    key: halverson-swine
    url: 'https://rsc.byu.edu/ascending-mountain-lord/swines-blood-broken-serpents-rejection-rehabilitation-worship-old-testament'
    quote: 'Notice their assumption that “it,” the ark, would save them, as opposed to faith that he, God, would deliver them. In other words, they mistook the symbol for the source and the object for the agent.'
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'The ark was lost to illustrate a prior loss, the interior attitudes that herald the presence of God'
    key: halverson-swine
    url: 'https://rsc.byu.edu/ascending-mountain-lord/swines-blood-broken-serpents-rejection-rehabilitation-worship-old-testament'
    quote: 'one that was literally lost in battle in order to illustrate a more significant loss that had already occurred—the loss of the interior attitudes that truly herald the presence of God.'
  - where: christ
    claim: 'Dagon fell in the attitude of homage to the ark'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/5.htm'
    quote: 'In the attitude of homage to the ark.'
