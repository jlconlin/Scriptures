chapter: 23
claims:
  - where: setting
    claim: 'Keilah is listed among the cities of Judah “in the valley” (the lowland)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/15?lang=eng'
    quote: 'And in the valley, Eshtaol, and Zoreah, and Ashnah, … And Keilah, and Achzib, and Mareshah; nine cities with their villages:'
  - where: setting
    claim: 'Keilah was a fortified city of the Shephelah, the low limestone hills bordering the Philistine plain'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/23.htm'
    quote: 'A fortified city (v, 7), named in Joshua 15:44 as one of a group of cities in the Shephêlah or “Lowland,” which included the low limestone hills bordering on the Philistine plain.'
  - where: setting
    claim: 'The raid on the threshing floors came just after harvest'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/23.htm'
    quote: 'This indicates that the raid took place immediately after harvest, when the corn was stacked by the floors ready for threshing.'
  - where: setting
    claim: 'Ziph and Maon are towns of Judah''s hill country'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/15?lang=eng'
    quote: 'And in the mountains, Shamir, and Jattir, and Socoh, … Maon, Carmel, and Ziph, and Juttah,'
  - where: setting
    claim: 'The title of Psalm 54 sets it when the Ziphites told Saul, in the words of 1 Sam. 23:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/54?lang=eng'
    quote: 'To the chief Musician on Neginoth, Maschil, A Psalm of David, when the Ziphims came and said to Saul, Doth not David hide himself with us?'
  - where: setting
    claim: 'The desert of Ziph was part of the desert of Judah, between the mountains of Judah and the Dead Sea'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/23.htm'
    quote: 'The "desert of Judah" is the desert tract between the mountains of Judah and the Dead Sea, in its whole extent … The desert of Ziph was that portion of the desert of Judah which was near to and surrounded the town of Ziph'
  - where: setting
    claim: 'En-gedi lies about halfway along the western shore of the Dead Sea, in country full of caves'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/23.htm'
    quote: 'is situated about half way along the western shore of the Dead Sea. … On all sides the country is full of caverns which might serve as lurking places for David and his men'

  - where: thread
    claim: 'One older reading: the Lord gave David pledges of kingship yet plunged him into trouble to train him; the chapter ends in a marvellous interposition of God'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/23.htm'
    quote: 'the Lord gave pledges to His servant David that he would eventually become king, but yet on the other hand plunged him into deeper and deeper trouble, that He might refine him and train him to be a king after His own heart.'
  - where: thread
    claim: 'The chapter closes with a marvellous interposition of the covenant God'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/23.htm'
    quote: 'but a marvellous interposition on the part of the faithful covenant God.'

  - where: section 1 plain
    claim: 'The threshing floors held the reaped grain ready for threshing'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/23.htm'
    quote: 'plundering the threshing-floors, upon which the corn that had been reaped was lying ready for threshing.'
  - where: section 2 plain
    claim: '“Secretly practised mischief” is literally “was forging” (plotting)'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/23.htm'
    quote: 'secretly practised] Lit. was forging. Omit “secretly.”'
  - where: section 3 plain
    claim: 'The footnote gives “forest” for “wood”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/23?lang=eng'
    quote: '“wood”: OR forest (also vv. 16, 18–19).'
  - where: section 3 plain
    claim: '“next unto thee” means second to thee'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/23.htm'
    quote: 'and thou wilt become king over Israel, and I will be the second to thee'
  - where: section 4 plain
    claim: '“His haunt” is Hebrew “his foot,” his customary walk'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/23?lang=eng'
    quote: '“his haunt”: HEB his foot; i.e., his customary walk.'
  - where: section 4 plain
    claim: '“Thousands” of Judah are its families or clans; Jeshimon is the waste west of the Dead Sea'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/23.htm'
    quote: 'I will search him out among all the thousands (i.e., families) of Judah.'
  - where: section 4 plain
    claim: 'Jeshimon here is the desert on the western side of the Dead Sea'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/23.htm'
    quote: 'Jeshimon does not refer here to the waste land on the north-eastern coast of the Dead Sea, as in Numbers 21:20; Numbers 23:28, but to the western side of that sea, which is also desert.'
  - where: section 5 plain
    claim: 'Sela-hammahlekoth means “the rock of divisions”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/23?lang=eng'
    quote: '“Sela-hammahlekoth”: IE The rock of divisions.'

  - where: 'note 23:9 “How David inquired of the LORD”'
    claim: 'Abiathar escaped Saul and abode with David (23:6, 9; 30:7)'
    key: bd-abiathar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abiathar?lang=eng'
    quote: 'A son of the high priest Ahijah or Ahimelech, he escapes Saul (1 Sam. 22:20); abides with David (23:6, 9; 30:7)'
  - where: 'note 23:9 “How David inquired of the LORD”'
    claim: 'Verse 6 is inserted to explain how David could inquire; Abiathar joined David before Keilah; the Septuagint reads that he went down with David to Keilah'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/23.htm'
    quote: 'or to follow the Sept. in reading, “And it came to pass when Abiathar the son of Ahimelech fled to David, that he went down with David to Keilah with the Ephod in his hand.” This note is inserted here to explain how David could inquire of God both in Judah and at Keilah.'
  - where: 'note 23:9 “How David inquired of the LORD”'
    claim: 'The Septuagint reads that Abiathar went down with David to Keilah'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/23.htm'
    quote: 'that he went down with David to Keila, having and ephod in his hand.'
  - where: 'note 23:9 “How David inquired of the LORD”'
    claim: 'The inquiry in 23:2, 4 implies the high priest with the ephod was already present'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/23.htm'
    quote: 'the inquiry in 1 Samuel 23:2; 1 Samuel 23:4 implies the presence of the high-priest with the Ephod'
  - where: 'note 23:9 “How David inquired of the LORD”'
    claim: 'One older reading: “to David to Keilah” is brief; Abiathar met David as he prepared to march and went with him'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/23.htm'
    quote: 'when he fled after David (1 Samuel 22:20), he met with him as he was already preparing for the march of Keilah, and immediately proceeded with him thither.'
  - where: 'note 23:9 “How David inquired of the LORD”'
    claim: 'The ephod had two shoulder pieces, was richly worked, and the breastplate was fastened to it'
    key: bd-ephod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephod?lang=eng'
    quote: 'Part of the dress of the high priest (Ex. 28:6, etc.), shaped like a waistcoat with two shoulder pieces and a girdle. It was of richly variegated material, blue, purple, and scarlet. … To the ephod was fastened the Breastplate of Judgment.'
  - where: 'note 23:9 “How David inquired of the LORD”'
    claim: 'The Urim and Thummim is an instrument prepared of God to help men obtain revelation'
    key: bd-urim-and-thummim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/urim-and-thummim?lang=eng'
    quote: 'An instrument prepared of God to assist man in obtaining revelation from the Lord and in translating languages.'
  - where: 'note 23:9 “How David inquired of the LORD”'
    claim: 'David''s use of the ephod at 30:7–8 almost certainly involved the Urim and Thummim, because the breastplate was attached to the ephod; he got an immediate answer'
    key: ot-manual-1-samuel-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-16-31-king-davids-call-to-lead-israel?lang=eng'
    quote: 'David’s use of the ephod here almost certainly involved the use of the Urim and Thummim. The breastplate of the high priest, which held the Urim and Thummim, was attached to the ephod … he got an immediate answer'
  - where: 'note 23:9 “How David inquired of the LORD”'
    claim: 'One older reading: the inquirer placed the matter before God in prayer and was answered one question at a time; the second question of v. 11 was answered and the first asked again'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/23.htm'
    quote: 'the person making the inquiry placed the matter before God in prayer, and received an answer; but always to one particular question. For when David had asked the two questions given in 1 Samuel 23:11, he received the answer to the second question only, and had to ask the first again'
  - where: 'note 23:9 “How David inquired of the LORD”'
    claim: 'David left with his six hundred men before Saul carried out his plan'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/23.htm'
    quote: 'as both questions were answered in the affirmative, he departed from the city with his six hundred men, before Saul carried out his plan.'
  - where: 'note 23:9 “How David inquired of the LORD”'
    claim: 'Abiathar fled to David after the slaughter at Nob (the text of 22:20)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/22?lang=eng'
    quote: 'And one of the sons of Ahimelech the son of Ahitub, named Abiathar, escaped, and fled after David.'

  - where: 'note 23:16 “Strengthened his hand in God”'
    claim: 'To strengthen the hands of someone means to sustain, encourage; 1 Sam 23:16 is listed'
    key: bdb
    url: 'https://biblehub.com/hebrew/2388.htm'
    quote: '2 strengthen the hands (accusative) of any one, i.e. sustain, encourage (opposed to רִמָּה) Judges 9:24; Jeremiah 23:14; Ezekiel 13:22; Isaiah 35:3; Job 4:3; Ezra 6:22; Nehemiah 2:18; Nehemiah 6:9; 2Chronicles 29:34; ידו בֵּאלהים ׳וַיְח 1 Samuel 23:16'

  - where: 'note 23:17 “The heir who would stand second”'
    claim: 'David shows ḥesed to Jonathan, who asserts “Fear not … thou shalt be king over Israel”; Saul later says he knows David will be king'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'He shows ḥesed to Jonathan, who asserts, “Fear not: . . . thou shalt be king over Israel” (23:17; see 20:8, 14–15; 23:17–18).'
  - where: 'note 23:17 “The heir who would stand second”'
    claim: 'Saul confesses that David will surely be king (24:20), in the same passage'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'leading Saul to exclaim, “Thou art more righteous than I: . . . wherefore the Lord reward thee good. . . . I know well that thou shalt surely be king” (24:17, 19–20; see chap. 26).'
  - where: 'note 23:17 “The heir who would stand second”'
    claim: 'The footnote at “knoweth” points to 1 Sam. 20:31 (30–31)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/23?lang=eng'
    quote: '“knoweth”: 1 Sam. 20:31 (30–31).'

  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'The footnote at “inquired” (v. 2) points to 2 Ne. 32:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/23?lang=eng'
    quote: '“inquired”: 2 Ne. 32:9.'
