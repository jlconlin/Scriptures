chapter: 20
claims:
  - where: setting
    claim: 'Chapter 19: David fled to Samuel at Ramah and dwelt in Naioth; Saul followed and prophesied'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/19?lang=eng'
    quote: 'So David fled, and escaped, and came to Samuel to Ramah, and told him all that Saul had done to him. And he and Samuel went and dwelt in Naioth.'
  - where: setting
    claim: 'David needed to know Saul''s disposition before he could safely remain at court; the new moon feast gave Jonathan the opportunity'
    key: ot-manual-1-samuel-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-16-31-king-davids-call-to-lead-israel?lang=eng'
    quote: 'David needed to know Saul’s disposition toward him before he could safely remain at court as Saul had ordered (see 1 Samuel 16:22; 18:2). A sacrifice and a feast at every new moon (see v. 5; Numbers 10:10; 28:11) afforded Jonathan a perfect opportunity to inquire into the matter.'
  - where: setting
    claim: 'Jonathan had already warned David and persuaded Saul to swear not to kill him (19:1–7); Saul again tried to kill David'
    key: holland-real-friendship
    url: 'https://www.churchofjesuschrist.org/study/new-era/1998/06/real-friendship?lang=eng'
    quote: 'But the ever-faithful Jonathan warned his friend, helped him hide out of Saul’s view, and continually spoke to his father of David’s virtues. He was so successful in praising David that Saul repented and made a vow that David’s life would be preserved.'

  - where: thread
    claim: 'The chapter''s covenant: Jonathan to warn David, David to watch over Jonathan''s family; Saul told Jonathan he would never be king while David lived'
    key: ot-seminary-lesson-88
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-88-1-samuel-18-24?lang=eng'
    quote: 'Jonathan covenanted to warn David of danger from his father and David covenanted to watch over Jonathan’s family, including his posterity. … he became angry and told Jonathan that if David was allowed to live then Jonathan would never be king.'
  - where: thread
    claim: 'Jonathan already foresees David''s destiny in verse 13'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/20.htm'
    quote: 'the Lord be with thee, &c.] Cp. 1 Samuel 18:12. Jonathan already foresees David’s destiny, as is clear from the following verses. See also 1 Samuel 23:17.'

  - where: 'note 20:5 “The feast of the new moon”'
    claim: 'The law appointed special sacrifices at the new moon; 1 Sam 20:5–6, 29 cited'
    key: bd-new-moon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/new-moon?lang=eng'
    quote: 'The law appointed that at the new moon special sacrifices should be offered (Num. 10:10; see also 1 Sam. 20:5–6, 29; 2 Kgs. 4:23; Amos 8:5). The prophets often speak of “new moons” along with “Sabbaths.”'
  - where: 'note 20:5 “The feast of the new moon”'
    claim: 'To sit at meat = to join as a member of the royal household in the sacrificial feast, which lasted at least two days; the plan tested whether Naioth had changed Saul'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/20.htm'
    quote: 'To join as a member of the royal household in the sacrificial feast (1 Samuel 20:24) which lasted for two days at least (1 Samuel 20:27). … the plan was well devised for ascertaining whether the lesson of Naioth had wrought any change in Saul'
  - where: 'note 20:5 “The feast of the new moon”'
    claim: 'Not clear whether David meant to go to Bethlehem or regarded the story as a justifiable deception'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/20.htm'
    quote: 'It is not clear whether David really wanted to go to Bethlehem, and meant to hide “in the field” afterwards, or whether he regarded the story as a justifiable deception to avoid exciting Saul’s anger.'
  - where: 'note 20:5 “The feast of the new moon”'
    claim: 'The ceremonially unclean were excluded from a religious festival (Lev 7:20–21)'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/20.htm'
    quote: '26. he is not clean] Persons who were ceremonially unclean were peremptorily excluded from participating in a religious festival. See Leviticus 7:20-21; 1 Samuel 16:5.'
  - where: 'note 20:5 “The feast of the new moon”'
    claim: 'Lev 7:20: the unclean who eats of the peace offering is cut off'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'But the soul that eateth of the flesh of the sacrifice of peace offerings, that pertain unto the Lord, having his uncleanness upon him, even that soul shall be cut off from his people.'

  - where: 'note 20:8 “A covenant of the LORD”'
    claim: '“Deal kindly” in 20:8 is to do ḥesed (with ʿal)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2617.htm'
    quote: 'עָשָׂה חֶסֶד עִמָּדִי do or shew kindness (in dealing) with me Genesis 20:13; Genesis 40:14 (E), 1 Samuel 20:14; … with עַל 1 Samuel 20:8'
  - where: 'note 20:8 “A covenant of the LORD”'
    claim: 'The terms of the covenant in chapter 20: Jonathan to warn David; David to watch over Jonathan''s family and posterity'
    key: ot-seminary-lesson-88
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-88-1-samuel-18-24?lang=eng'
    quote: 'they made a covenant of friendship. Jonathan covenanted to warn David of danger from his father and David covenanted to watch over Jonathan’s family, including his posterity.'

  - where: 'note 20:13 “The LORD do so to Jonathan”'
    claim: 'The self-curse formula “God so do to me, and more also”: the swearer expects to be cursed if he breaks the oath; attested of Jonathan and others; tied to covenant oaths'
    key: parker-cutting
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/cutting-covenants'
    quote: 'the individual probably repeated a phrase similar to self-curses in which a person said, “God so do to me, and more also,” signifying that the individual expected to be cursed if they did not live up to their oath. This self-curse formula is attested … (Eli, Saul, Jonathan, Abner, David, Solomon)'
  - where: 'note 20:13 “The LORD do so to Jonathan”'
    claim: 'Oaths sworn in God''s name were matters of life and death, accompanied by threats of curses; 1 Sam 20:13 cited'
    key: sc-knowhy-98
    url: 'https://scripturecentral.org/knowhy/why-did-the-lamanites-break-their-treaty-with-king-limhi'
    quote: 'oaths and treaty-covenants were of such importance that breaking one’s oath could literally become a matter of life and death. Since breaking a treaty sworn in God’s name was seen as nothing less than blasphemy, such oaths … were often accompanied with threats of divine and temporal curses (including death) for breaking such (cf. … 1 Samuel 20:13'

  - where: 'note 20:14 “The kindness of the LORD”'
    claim: 'BDB: “kindness of the LORD” at 20:14 understood variously: such as He shows, sworn by oath to Him, shown out of reverence to Him'
    key: bdb
    url: 'https://biblehub.com/hebrew/2617.htm'
    quote: 'יהוה ׳ח 1 Samuel 20:14 the kindness of ׳י (such as he shews, Thes MV; that sworn to by oath to Yahweh Mich Dathe; shewn out of reverence to Yahweh Th Ke); compare אלהים ׳ח 2 Samuel 9:3'
  - where: 'note 20:14 “The kindness of the LORD”'
    claim: 'Jonathan, convinced David will succeed, fears the custom by which a new dynasty murdered the predecessor''s family; David fulfilled the promise; exact rendering doubtful'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/20.htm'
    quote: 'Convinced that David will succeed to the kingdom, Jonathan exacts from him a promise to shew kindness to his posterity … prompted by a fear lest even David should conform to the barbarous Oriental custom by which the first king of a new dynasty often tried to secure himself on the throne by murdering his predecessor’s family.'
  - where: 'note 20:14 “The kindness of the LORD”'
    claim: 'The general sense is clear though the exact rendering is doubtful'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/20.htm'
    quote: 'David fulfilled his promise by shewing kindness to Mephibosheth (2 Samuel 9:1 ff; 2 Samuel 21:7). This is clearly the general sense of the passage, though the exact rendering is doubtful.'
  - where: 'note 20:14 “The kindness of the LORD”'
    claim: 'The footnote at “kindness” points to 2 Sam 9:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/20?lang=eng'
    quote: '14a “kindness”: 2 Sam. 9:1.'

  - where: 'note 20:30 “Son of the perverse rebellious woman”'
    claim: 'mardut, rebelliousness, occurs only here; probably to be read (with the Greek) “son of a girl of rebelliousness,” a rebellious girl'
    key: bdb
    url: 'https://biblehub.com/hebrew/4780.htm'
    quote: 'מַרְדּוּת noun feminine rebellion, rebelliousness, only in ׳בֶּןנַֿעֲוַת המ 1 Samuel 20:30, where read probably בֶּןנַֿעֲרַת הַמַרְדוּת son of a girl of rebelliousness = rebellious girl, compare ᵐ5'
  - where: 'note 20:30 “Son of the perverse rebellious woman”'
    claim: 'The Hebrew participle behind “perverse” means bent, twisted, perverted'
    key: bdb
    url: 'https://biblehub.com/hebrew/5753.htm'
    quote: 'feminine construct נַעֲוַת 1 Samuel 20:30 (but read נַעֲרַת ᵐ5 We Dr SS Bu HPS); — be bent, bowed down, twisted, … נַעֲוֵה לֵב Proverbs 12:8 one perverted of mind.'
  - where: 'note 20:30 “Son of the perverse rebellious woman”'
    claim: 'Saul cursed his wife as responsible for Jonathan''s disloyalty; his children supported David because they knew his hatred was unjustified'
    key: ot-manual-1-samuel-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-16-31-king-davids-call-to-lead-israel?lang=eng'
    quote: 'In his anger Saul cursed his wife as being responsible for Jonathan’s rebellious disloyalty in being faithful to David rather than being faithful to his own father. … Even his own children, first Michal and then Jonathan, supported David because they knew their father’s hatred was unjustified.'
  - where: 'note 20:30 “Son of the perverse rebellious woman”'
    claim: 'The footnote at “established” (20:31) points to 23:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/20?lang=eng'
    quote: '31a “established”: 1 Sam. 23:17.'

  - where: 'note 20:40 “His artillery”'
    claim: 'In 1828 artillery meant offensive weapons of war, formerly bows and arrows, citing 1 Sam 20:40'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/artillery'
    quote: '1. In a general sense, offensive weapons of war. Hence it was formerly used for bows and arrows. And Jonathan gave his artillery to his lad. 1 Samuel 20:40.'
  - where: 'note 20:40 “His artillery”'
    claim: 'The Hebrew keli at 20:40 is a weapon'
    key: bdb
    url: 'https://biblehub.com/hebrew/3627.htm'
    quote: 'a. implement of hunting and (especially) war, = weapon Genesis 27:3 (J), 1 Samuel 20:40; 1 Samuel 21:9'

  - where: 'note 20:41 “The parting”'
    claim: '“Exceeded” is the Hebrew gadal, here “wept greatly”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1431.htm'
    quote: 'c. also, with Infinitive implied, wept greatly 1 Samuel 20:41.'
  - where: 'note 20:41 “The parting”'
    claim: 'David''s distress exceeded Jonathan''s: he lost wife, relatives, country, access to the tabernacle and sacrifice'
    key: ot-manual-1-samuel-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-16-31-king-davids-call-to-lead-israel?lang=eng'
    quote: 'Both men were tearful at their parting, but David’s distress exceeded that of Jonathan. Saul had taken David’s wife Michal and given her to another (see 1 Samuel 25:44), and David was now banished from access to the tabernacle and the rituals of sacrifice because he was forced to hide from Saul.'

  - where: 'note 20:42 “Between my seed and thy seed for ever”'
    claim: '2 Sam 21:7: Mephibosheth spared because of the LORD''s oath between David and Jonathan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'But the king spared Mephibosheth, the son of Jonathan the son of Saul, because of the Lord’s oath that was between them, between David and Jonathan the son of Saul.'
  - where: 'note 20:42 “Between my seed and thy seed for ever”'
    claim: 'Jonathan kept assisting David; they renewed their covenant (23:17–18); David never forgot him and lamented him (2 Sam 1:26–27)'
    key: holland-real-friendship
    url: 'https://www.churchofjesuschrist.org/study/new-era/1998/06/real-friendship?lang=eng'
    quote: 'And always they renewed their covenant of friendship and loyalty (see 1 Sam. 23:18). … David, who was now king, never forgot the friendship and protection of his beloved friend Jonathan. His lamentation over Jonathan’s death is one of the loveliest psalms in the Old Testament'

  - where: christ
    claim: 'The prophets looked to a messianic son of David to manifest the fullness of the Lord''s ḥesed; Jesus is both promisor and fulfillment'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'Christ is the one who covenanted to establish David’s seed and the one whose grace makes that establishment possible. Jesus is simultaneously the promisor and the fulfillment of the promise.'
  - where: christ
    claim: 'The prophets looked forward to a messianic son of David to manifest the fullness of the Lord''s ḥesed; Christians see its fulfillment in Jesus Christ'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'The prophets looked forward to a future messianic son of David to restore Israel and manifest the fullness of the Lord’s ḥesed.Christians perceive the ultimate fulfillment of the Davidic covenant’s promises in the life and ministry of Jesus Christ.'
  - where: christ
    claim: 'David continued to show ḥesed to the house of Saul and Jonathan, seeking out Mephibosheth'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'However, David also continues to show ḥesed to the house of Saul and Jonathan, seeking out Jonathan’s surviving son, Mephibosheth, to restore ancestral lands to him and welcome him into the royal household (chap. 9).'
  - where: christ
    claim: 'Israel can claim the Lord''s loving-kindness by returning to communion with Him (Isa 55:3, the sure mercies of David)'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'God has not abandoned ḥesed, and Israel can claim this loving-kindness, mercy, and healing by returning to authentic communion with the Lord, who promised to establish David’s seed.'

  - where: explore
    claim: 'The LORD as witness of the covenant (20:23), compare Gen 31:49'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/20.htm'
    quote: 'the Lord, &c.] As the witness of our covenant, and the avenger of any breach of it. Cp. Genesis 31:49; Genesis 31:53.'
