chapter: 15
claims:
  - where: setting
    claim: 'The Amalekites were a desert tribe at war with Israel from Moses until Saul and David broke their power'
    key: bd-amalek
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amalek?lang=eng'
    quote: 'An Arab tribe that lived in the desert of Paran between the Arabah and the Mediterranean … The Amalekites were at constant war with the Hebrews from the time of Moses (Ex. 17:8, etc.) till their power was broken by Saul and David'
  - where: setting
    claim: 'Samuel and Saul set the pattern of prophet and king: the prophet announces the will of the Lord and calls the king to account, as Nathan did with David'
    key: ot-minute-1-samuel-15
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-15'
    quote: 'Samuel’s actions in this narrative form a motif for future prophets to follow: announcing the will of the Lord and also calling the king to repentance, or as in Saul’s case, informing the king that he had failed in his duty. The prophet Nathan would take a similar role'
  - where: setting
    claim: 'The footnote to the Amalek decree points to Exodus 17; the text of 13:13–14, 14:47–48 and 16:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: '2a “Amalek”: Ex. 17:8 (8–16).'

  - where: thread
    claim: 'Saul obeyed selectively and feared the judgments of men; the question is whether one hearkens with exactness to the voice of the Lord'
    key: hales-agency-2010
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2010/10/agency-essential-to-the-plan-of-life?lang=eng'
    quote: 'My brothers and sisters, are we hearkening with exactness to the voice of the Lord and His prophets? Or, like Saul, are we practicing selective obedience and fearing the judgments of men?'
  - where: thread
    claim: 'Seeking to please others rather than the Lord led Saul to disobey'
    key: ot-seminary-lesson-85
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-85-1-samuel-12-15?lang=eng'
    quote: 'One principle students may identify is seeking to please others rather than the Lord can lead us to disobey His commandments.'
  - where: thread
    claim: 'The JST changes both statements of the Lord repenting (vv. 11, 35)'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'There are two changes in this chapter, but both concern the Lord repenting'

  - where: section 3 plain
    claim: 'Plain rendering of v. 11 as sorrow or regret, per the footnote'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: '11b “repenteth”: The Hebrew root means “to sigh,” therefore “to feel sorrow.” Gen. 6:6; 2 Sam. 24:16; Joel 2:13.'
  - where: section 3 plain
    claim: 'Plain rendering of “a place” in v. 12 as a monument'
    key: bdb
    url: 'https://biblehub.com/hebrew/3027.htm'
    quote: 'a. sign, monument 1 Samuel 15:12; 2 Samuel 18:18.'
  - where: section 4 plain
    claim: 'Plain rendering of v. 23 “witchcraft” as divination'
    key: bdb
    url: 'https://biblehub.com/hebrew/7081.htm'
    quote: 'prohibited Deuteronomy 18:10; 2 Kings 17:17; reprobated 1 Samuel 15:23 (poem; "" תרפים).'
  - where: section 6 plain
    claim: 'Plain rendering of v. 32 “delicately” as cheerfully, thinking he would be spared'
    key: ot-minute-1-samuel-15
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-15'
    quote: 'The Hebrew word here translated as “delicately” is better translated as “cheerfully.” Agag had reason to believe that his life would be spared'

  - where: 'note 15:3 “Why Amalek, and why everything”'
    claim: 'The Amalekites did not fear the Lord and ambushed and killed the most vulnerable; we do not know all the reasons; God takes no pleasure in the death of the wicked'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'They also ambushed the children of Israel, who were camping in the wilderness during the Exodus, and killed many of the most vulnerable Israelites. … We do not know all the reasons why God commanded Saul and his army to destroy all the Amalekites and their animals.'
  - where: 'note 15:3 “Why Amalek, and why everything”'
    claim: 'God takes no pleasure in the death of the wicked (endnote: Ezek. 33:11)'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'However, we do know that God cares deeply for all of His children and that He takes “no pleasure in the death of the wicked.”'
  - where: 'note 15:3 “Why Amalek, and why everything”'
    claim: 'The Amalekites were a murderous people and enemies of the Lord'
    key: ot-seminary-lesson-85
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-85-1-samuel-12-15?lang=eng'
    quote: 'He commanded Saul to destroy all the Amalekites and their livestock. The Amalekites were a murderous people and were enemies of the Lord (see Deuteronomy 25:17–19).'
  - where: 'note 15:3 “Why Amalek, and why everything”'
    claim: 'Much in such accounts is not fully understood; they must never justify violence now'
    key: topics-religion-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/religion-vs-violence?lang=eng'
    quote: 'Ancient scripture contains many accounts of violence, including instances that appear to be divinely sanctioned. There is much in these scriptural accounts that we do not fully understand today. They should never be used to justify violence in the present.'
  - where: 'note 15:3 “Why Amalek, and why everything”'
    claim: 'The verb heḥĕrīm is used throughout the chapter; the oracle explicitly orders destruction of humans and livestock'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'In 1 Samuel 15, the prophet Samuel delivers a divine oracle to Saul, commanding him to “utterly destroy” the Amalekites (the verb heḥĕrīm is used in verses 3, 8–9, 15, 18, 20–21). The oracle is explicit in ordering the destruction of both humans and livestock'
  - where: 'note 15:3 “Why Amalek, and why everything”'
    claim: 'Ḥērem texts use absolute, hyperbolic war language; Amalekites had to be fought again under Saul and David'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'divinely mandated war was typically spoken of in absolute terms regardless of the reality of what played out on the ground … Some passages describe people consigned to ḥērem later needing to be reconquered—for example, … the Amalekites in the time of Saul and David'
  - where: 'note 15:3 “Why Amalek, and why everything”'
    claim: 'The footnote to “destroy” points to Deut. 2:34; the text of v. 2 and of 1 Sam. 27:8–9; 30:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: '3a “destroy”: Deut. 2:34.'

  - where: 'note 15:6 “The Kenites”'
    claim: 'The Kenites were probably Midianite; Moses’ marriage into Jethro’s family made a long friendship with Israel'
    key: bd-kenites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kenites?lang=eng'
    quote: 'Probably a Midianite tribe, descended from Abraham by his wife Keturah. Moses’ marriage with the daughter of Jethro, a prince and priest of Midian, was also a cause of the long-standing friendship between the Kenites and Israelites'
  - where: 'note 15:6 “The Kenites”'
    claim: 'The footnote at “Kenites” points to Judg. 1:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: '6a “Kenites”: Judg. 1:16.'

  - where: 'note 15:9 “What Saul kept”'
    claim: 'There were not supposed to be captives; keeping the enemy king alive was tantamount to keeping captives'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'However, there were not supposed to be captives in the first place. … to keep the king alive afterward, as Saul did with the Amalekite king Agag (1 Samuel 15:8–9, 20, 32–33), was tantamount to keeping captives.'
  - where: 'note 15:9 “What Saul kept”'
    claim: 'Saul’s crucial error was retaining the king and livestock, making his refusal blatant'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Given that the text does not make a point of the fact that many of the Amalekites survived, it seems that Saul’s crucial error was not that he failed to kill the king and the livestock, but that he retained them, thus making his refusal to kill them blatant.'
  - where: 'note 15:9 “What Saul kept”'
    claim: 'Saul wanted to display his captive and the most valuable animals'
    key: ot-minute-1-samuel-15
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-15'
    quote: 'Saul disobeyed the Lord by keeping Agag, the king of the Amalekites, and the best livestock alive. Saul, in his hubris, wanted to display his distinguished captive and, similarly, the most valuable animals and other booty.'
  - where: 'note 15:9 “What Saul kept”'
    claim: 'Saul proudly brought Agag back alive'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'Saul himself captured the Amalekite king, Agag, and proudly brought him back alive.'

  - where: 'note 15:11 “Does the LORD repent?”'
    claim: 'The footnote: the Hebrew root means to sigh, to feel sorrow'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: '11b “repenteth”: The Hebrew root means “to sigh,” therefore “to feel sorrow.” Gen. 6:6; 2 Sam. 24:16; Joel 2:13.'
  - where: 'note 15:11 “Does the LORD repent?”'
    claim: 'JST 1 Sam. 15:11 and 15:35 readings (footnotes)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: 'JST 1 Sam. 15:11 I have set up Saul to be a king, and he repenteth not that he hath sinned, for he is … JST 1 Sam. 15:35 … the Lord rent the kingdom from Saul whom he had made king over Israel.'
  - where: 'note 15:11 “Does the LORD repent?”'
    claim: 'BDB: niphal be sorry, rue, suffer grief, repent; lists 1 Sam. 15:11, 35, and 15:29 parallel with “lie”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5162.htm'
    quote: '2 be sorry, rue, suffer grief, repent, of one''s own doings … "" שׁקּר 1 Samuel 15:29 (twice in verse) … כְּי Genesis 6:6,7 (J), 1 Samuel 15:11,35.'
  - where: 'note 15:11 “Does the LORD repent?”'
    claim: 'Scripture Helps on 15:11, 35 points to its Genesis 6:6 entry'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'See “Genesis 6:6. What are we to understand from the phrase ‘it repented the Lord’?”'
  - where: 'note 15:11 “Does the LORD repent?”'
    claim: 'The word can indicate regret, sorrow, compassion, or a decision to change course; a different word is used for remorse for sin'
    key: scripture-helps-gen-6-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/06-moses-6-11-moses-8?lang=eng'
    quote: 'The Hebrew word translated as “repent” in Genesis 6:6 can indicate regret, sorrow, compassion, or “a decision to change a course of action.” A different Hebrew word is used when indicating remorse for sin'
  - where: 'note 15:11 “Does the LORD repent?”'
    claim: 'The Lord changed his pattern but his previous course was not erroneous'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'To repent is to change one’s pattern, but repentance also denotes a previous erroneous action. The Lord had indeed changed his pattern, but his previous course had not been erroneous'
  - where: 'note 15:11 “Does the LORD repent?”'
    claim: 'The JST makes Saul the one who did not repent, and makes v. 35 historically correct'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'The first change (v. 11) is that Saul did not repent after the Lord had made him king, instead of the Lord repenting because he had made Saul king. … This makes the account historically correct in addition to correcting the false concept of the Lord repenting.'

  - where: 'note 15:12 “A monument at Carmel”'
    claim: 'BDB: yad, “hand,” means sign, monument at 1 Sam. 15:12 and 2 Sam. 18:18'
    key: bdb
    url: 'https://biblehub.com/hebrew/3027.htm'
    quote: 'a. sign, monument 1 Samuel 15:12; 2 Samuel 18:18.'
  - where: 'note 15:12 “A monument at Carmel”'
    claim: 'A modern translation: set up a monument in his own honor'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+15%3A12&version=NIV'
    quote: 'There he has set up a monument(B) in his own honor and has turned and gone on down to Gilgal.'
  - where: 'note 15:12 “A monument at Carmel”'
    claim: 'Saul built monuments to himself instead of giving glory to God'
    key: ot-minute-1-samuel-15
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-15'
    quote: 'God renounced Saul as leader because he abused and corrupted the office of king and used his role as leader to aggrandize himself instead of glorifying the Lord. Instead of giving the glory to God, Saul built monuments to himself'

  - where: 'note 15:17 “Little in his own sight”'
    claim: 'The root of Saul’s problem: called because of humility, he now trusted in his own wisdom'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'The root of Saul’s problem is here revealed (see v. 17). Saul had been called because of his humility (“thou wast little in thine own sight”; v. 17); now he trusted in his own wisdom and did not look to God.'
  - where: 'note 15:17 “Little in his own sight”'
    claim: 'One older reading: Saul turned from following God to be absolute ruler, led by pride in his own strength'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/15.htm'
    quote: 'He would no longer be the follower and servant of the Lord, but would be absolute ruler in Israel. Pride arising from the consciousness of his own strength, led him astray to break the command of God.'

  - where: 'note 15:22 “To obey is better than sacrifice”'
    claim: 'Hales: Saul practiced “selective obedience,” relying on his own wisdom'
    key: hales-agency-2010
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2010/10/agency-essential-to-the-plan-of-life?lang=eng'
    quote: 'But Saul did not follow the Lord’s commandment. He practiced what I call “selective obedience.” Relying on his own wisdom, he spared the life of King Agag and brought back the best of the sheep, oxen, and other animals.'
  - where: 'note 15:22 “To obey is better than sacrifice”'
    claim: 'Hales: because Saul did not hearken with exactness he lost the opportunity to be king'
    key: hales-agency-2010
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2010/10/agency-essential-to-the-plan-of-life?lang=eng'
    quote: 'Because Saul did not hearken with exactness—because he chose to be selectively obedient—he lost the opportunity and the agency to be king.'
  - where: 'note 15:22 “To obey is better than sacrifice”'
    claim: 'Samuel was not condemning sacrifice; offerings were to be made with an obedient heart; Saul’s animals were obtained by disobedience and the Lord had not required that sacrifice'
    key: ot-seminary-lesson-85
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-85-1-samuel-12-15?lang=eng'
    quote: 'Samuel was not saying that offering sacrifices was not a correct practice. … The animals Saul had obtained for the claimed intentions of sacrificing were obtained by his disobedience to the Lord. … the Lord had not required that such a sacrifice be made in this situation.'
  - where: 'note 15:22 “To obey is better than sacrifice”'
    claim: 'It is easier to bring a sacrifice than to make our will subject to God’s'
    key: ot-minute-1-samuel-15
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-15'
    quote: 'It is much easier to bring a sacrifice to be burned on the altar as part of the repentance process than to turn our thoughts and desires to obeying God and to make our will subject to His will.'
  - where: 'note 15:22 “To obey is better than sacrifice”'
    claim: 'The footnotes at “delight” and “sacrifice” point to Ps. 40:6, Ps. 51:16, Isa. 1:11 and Heb. 10:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: '22a “delight”: Ps. 40:6 (6–8); 69:31 (30–31); Isa. 1:11. … 22d “sacrifice”: Ps. 51:16; Prov. 21:3; Heb. 10:6 (4–6).'

  - where: 'note 15:23 “As the sin of witchcraft”'
    claim: 'qesem is divination, prohibited in Deut. 18:10, condemned at 1 Sam. 15:23 in parallel with teraphim'
    key: bdb
    url: 'https://biblehub.com/hebrew/7081.htm'
    quote: 'קֶ֫סֶם noun [masculine] divination … prohibited Deuteronomy 18:10; 2 Kings 17:17; reprobated 1 Samuel 15:23 (poem; "" תרפים).'
  - where: 'note 15:23 “As the sin of witchcraft”'
    claim: 'Teraphim: a kind of idol, object of reverence and means of divination; man-sized at 1 Sam. 19:13; condemned at 15:23'
    key: bdb
    url: 'https://biblehub.com/hebrew/8655.htm'
    quote: 'a kind of idol, object of reverence, and means of divination … in size and shape like a man 1 Samuel 19:13,16; … condemned 1 Samuel 15:23'
  - where: 'note 15:23 “As the sin of witchcraft”'
    claim: 'One older reading: disobedience is idolatry because it makes self-will a god'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/15.htm'
    quote: 'Opposition to God is compared by Samuel to soothsaying and oracles, because idolatry was manifested in both of them. All conscious disobedience is actually idolatry, because it makes self-will, the human I, into a god.'

  - where: 'note 15:24 “I feared the people”'
    claim: 'Seeking to please others rather than the Lord can lead to disobedience; Saul gave in to the temptation to be popular'
    key: ot-seminary-lesson-85
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-85-1-samuel-12-15?lang=eng'
    quote: 'Saul’s decision to disobey was influenced by his desire to please others rather than the Lord because he feared the judgments of men … Saul gave in to the temptation to be popular rather than obeying the word of God.'
  - where: 'note 15:24 “I feared the people”'
    claim: 'The principle drawn from v. 24'
    key: ot-seminary-lesson-85
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-85-1-samuel-12-15?lang=eng'
    quote: 'One principle students may identify is seeking to please others rather than the Lord can lead us to disobey His commandments.'
  - where: 'note 15:24 “I feared the people”'
    claim: 'Saul’s repentance was too late and short-lived; the same sin as in chapter 13'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'Saul’s repentance (see vv. 24–25) was too late and very short-lived. This second violation was essentially the same sin of disobedience he had been guilty of before (see 1 Samuel 13:8–14).'
  - where: 'note 15:24 “I feared the people”'
    claim: 'Under pressure Saul chose what would win popular approval, as at Gilgal in chapter 13'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'Too often, under pressure, he chose to do what he thought would give him popular approval, regardless of an opposing commandment of God.'
  - where: 'note 15:24 “I feared the people”'
    claim: 'The footnotes at “transgressed” and “feared” point to 2 Sam. 12:13 and Peer Influence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: '24b “transgressed”: 2 Sam. 12:13 (9–14). … 24c “feared”: TG Peer Influence.'
  - where: 'note 15:24 “I feared the people”'
    claim: 'Saul’s repentance was not sincere'
    key: ot-minute-1-samuel-15
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-15'
    quote: 'Saul’s repentance was not sincere.'

  - where: 'note 15:27 “The torn mantle”'
    claim: 'The footnote gives “was torn” for “rent”; it points v. 28 to 28:17 and 13:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: '27a “rent”: OR was torn.'
  - where: 'note 15:27 “The torn mantle”'
    claim: 'The footnote at “kingdom” (v. 28) points to 28:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: '28a “kingdom”: 1 Sam. 28:17 (17–18).'
  - where: 'note 15:27 “The torn mantle”'
    claim: 'Saul grabbed and tore Samuel’s robe; Samuel used the torn robe as a symbol affirming the rejection'
    key: ot-minute-1-samuel-15
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-15'
    quote: 'When Saul grabbed the bottom of Samuel’s robe and tore it, Samuel took the opportunity to use the symbol to further affirm that the Lord had rejected Saul as king.'

  - where: 'note 15:29 “The Strength of Israel”'
    claim: 'The footnote: the Strength of Israel is the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: '29a “the Strength of Israel”: IE the Lord.'
  - where: 'note 15:29 “The Strength of Israel”'
    claim: 'BDB: netsach is eminence, enduring; here the Eminence of Israel'
    key: bdb
    url: 'https://biblehub.com/hebrew/5331.htm'
    quote: 'eminence, enduring, everlastingness, perpetuity … 1 eminence: נצח ישׂראל the Eminence of Israel (׳י) 1 Samuel 15:29 (DrSam. 98 glory of Israel)'
  - where: 'note 15:29 “The Strength of Israel”'
    claim: 'BDB sets “repent” in 15:29 in parallel with “lie”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5162.htm'
    quote: '"" שׁקּר 1 Samuel 15:29 (twice in verse)'
  - where: 'note 15:29 “The Strength of Israel”'
    claim: 'One older reading: netsach is constancy, the unchangeable One in whom Israel can trust; v. 11 is spoken anthropomorphically; compare Num. 23:19'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/15.htm'
    quote: 'He is ישׂראל נצח, the unchangeable One, in whom Israel can trust, since He does not lie or deceive, or repent of His purposes. … in 1 Samuel 15:11 and other passages, which speak of God as repenting, the words are to be understood ἀνθρωποπαθῶς (anthropomorphically; cf. Numbers 23:19).'

  - where: 'note 15:33 “Why Samuel put Agag to death”'
    claim: 'Enemy kings were captured and brought to the commander for ritual execution immediately after the battle; Samuel performs the ritual execution of Agag'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The one exception to this was the enemy king; some passages mention kings being captured and brought to the commander for ritual execution (Joshua 8:23, 29; 10:22–27). This would apparently happen immediately following the fighting'
  - where: 'note 15:33 “Why Samuel put Agag to death”'
    claim: 'Calabro: Samuel performs the ritual execution of Agag'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Note that Samuel performs the ritual execution of Agag in 1 Samuel 15:32–33.'
