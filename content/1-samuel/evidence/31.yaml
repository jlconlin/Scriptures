chapter: 31
claims:
  - where: setting
    claim: 'Gilboa is the mountain ridge forming the southeastern boundary of the plain of Esdraelon, named for its springs; Saul and his sons were slain there'
    key: bd-gilboa
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gilboa?lang=eng'
    quote: 'Bubbling fountain. The mountain ridge that forms the southeastern boundary of the plain of Esdraelon, in southern Galilee. It gets its name from the large number of perennial springs found there. Here Saul and his sons were slain'
  - where: setting
    claim: 'Endor was where Saul consulted the woman the night before the battle at Gilboa'
    key: bd-endor
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/endor?lang=eng'
    quote: 'the home of the witch consulted by Saul the night before his fatal battle at Gilboa'
  - where: setting
    claim: 'While David recovered his people from the Amalekites, the Philistines fought Israel; the two stories run in the same days'
    key: ot-seminary-lesson-89
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-89-1-samuel-25-31?lang=eng'
    quote: 'David and his army conquered the Amalekites and rescued their families. David then shared the enemy’s supplies with his people. In the meantime, the Philistines went to battle against the Israelites.'
  - where: setting
    claim: 'The Church’s footnote at verse 1 points to 1 Chronicles 10:1–12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/31?lang=eng'
    quote: '“Philistines”: 1 Chr. 10:1 (1–12).'
  - where: setting
    claim: 'Chronicles tells the same battle in nearly the same words and adds a closing verdict'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/31.htm'
    quote: 'There is a parallel to this chapter in 1 Chronicles 10:1-14, which agrees exactly with the account before us, with very few deviations indeed, and those mostly verbal, and merely introduces a hortatory clause at the end'
  - where: when
    claim: 'The battle came the day after the night at Endor'
    key: bd-endor
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/endor?lang=eng'
    quote: 'the home of the witch consulted by Saul the night before his fatal battle at Gilboa'
  - where: thread
    claim: 'Saul’s life is a series of decisions that, because of his character, cause his own death, the deaths of his loved ones, and the end of his hopes'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'Saul’s life consists of a series of situations and decisions that, because of his character, cause his own death, the deaths of his loved ones, and the destruction of all his hopes.'
  - where: thread
    claim: 'The men of Jabesh-gilead never lost their gratitude to Saul for rescuing them, and risked their lives to bring back his body years later'
    key: sc-knowhy-855
    url: 'https://scripturecentral.org/knowhy/why-did-the-ammonite-king-require-the-right-eyes-of-the-people-of-jabesh-gilead-be-gouged-out-1'
    quote: 'Likely because of this, these people never lost their gratitude towards Saul for what he had done for them.'

  - where: 'note 31:4 “Lest these uncircumcised … abuse me”'
    claim: 'The verb rendered “abuse” (ʿālal, Hithpael) means to make a toy of, to deal wantonly or ruthlessly with; BDB lists 1 Sam. 31:4 under it'
    key: bdb
    url: 'https://biblehub.com/hebrew/5953.htm'
    quote: 'how I [׳י] have made a toy of Egypt; especially deal wantonly, ruthlessly with (ב person): … 3 plural וְהִתְעַלְּלוּ consecutive 1 Samuel 31:4 = 1 Chronicles 10:4'
  - where: 'note 31:4 “Lest these uncircumcised … abuse me”'
    claim: '“Abuse me” is the Hithpael of ʿālal, Strong’s 5953, in the Hebrew of verse 4'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'וְ/הִתְעַלְּלוּ'
  - where: 'note 31:4 “Lest these uncircumcised … abuse me”'
    claim: 'One older reading: to be the sport of the uncircumcised, outside the covenant, was the worst indignity for the LORD’s anointed; “abuse me” = maltreat for amusement'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/31.htm'
    quote: 'No indignity could be more intolerable than for the sacred person of Jehovah’s Anointed to be the butt of the heathen who had no part in His covenant. … abuse me] Maltreat me for their own amusement.'

  - where: 'note 31:4 “Saul took a sword, and fell upon it”'
    claim: 'Saul, badly wounded and fearing to be killed by the Philistines, took his own life'
    key: ot-seminary-lesson-89
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-89-1-samuel-25-31?lang=eng'
    quote: 'Saul was badly wounded, and when he feared he would be killed in battle by the Philistines, he took his own life.'
  - where: 'note 31:4 “Saul took a sword, and fell upon it”'
    claim: 'The Church’s footnote at “fell” points to 2 Samuel 1:10 (1–16)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/31?lang=eng'
    quote: '“fell”: 2 Sam. 1:10 (1–16).'
  - where: 'note 31:4 “Saul took a sword, and fell upon it”'
    claim: 'The Bible Dictionary sums up Saul’s downfall as the consequence of uncontrolled self-will and disobedience to counsel'
    key: bd-saul
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/saul?lang=eng'
    quote: 'his death (1 Sam. 28–31; 2 Sam. 1); his burial (2 Sam. 21:12–14). Saul’s downfall shows the consequences of uncontrolled self-will and disobedience to counsel.'

  - where: 'note 31:6 “So Saul died”'
    claim: 'The Church’s footnote at “Saul” in verse 5 points back to 1 Samuel 26:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/31?lang=eng'
    quote: '“Saul”: 1 Sam. 26:10.'
  - where: 'note 31:6 “So Saul died”'
    claim: 'Chronicles: Saul and his three sons “and all his house died together”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/10?lang=eng'
    quote: 'So Saul died, and his three sons, and all his house died together.'
  - where: 'note 31:6 “So Saul died”'
    claim: 'Chronicles’ verdict: Saul died for his transgression against the word of the Lord and for asking counsel of a familiar spirit; the Lord turned the kingdom to David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/10?lang=eng'
    quote: 'So Saul died for his transgression which he committed against the Lord, even against the word of the Lord, which he kept not, and also for asking counsel of one that had a familiar spirit, to inquire of it; And inquired not of the Lord: therefore he slew him, and turned the kingdom unto David the son of Jesse.'
  - where: 'note 31:6 “So Saul died”'
    claim: 'Chronicles’ chapter heading: Saul dies for his transgressions'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/10?lang=eng'
    quote: 'The Philistines defeat Israel—Saul dies for his transgressions.'

  - where: 'note 31:10 “The wall of Beth-shan”'
    claim: 'Beth-shan lay three miles from the Jordan on the edge of the plain of Jezreel, on the road from Damascus to Egypt; the bodies of Saul and three sons were fastened to its wall; later Scythopolis, one of the cities of Decapolis'
    key: bd-beth-shan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beth-shan?lang=eng'
    quote: 'Three miles from the Jordan River on the edge of the plain of Jezreel, on the road from Damascus to Egypt … It was at Beth-shan that the dead bodies of Saul and three of his sons were fastened to the city wall (1 Sam. 31:10–13). It was afterwards known as Scythopolis'
  - where: 'note 31:10 “The wall of Beth-shan”'
    claim: 'Ashtaroth is the plural of Ashtoreth, idols worshipped with Baal; the entry cites 1 Sam. 31:10'
    key: bd-ashtaroth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ashtaroth?lang=eng'
    quote: 'Plural of Ashtoreth. Idols worshipped with Baal by the Israelites (Judg. 2:13; 10:6; 1 Sam. 7:3–4; 12:10; 31:10).'
  - where: 'note 31:10 “The wall of Beth-shan”'
    claim: 'Chronicles has the armour in the house of their gods and the head fastened in the temple of Dagon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/10?lang=eng'
    quote: 'And they put his armour in the house of their gods, and fastened his head in the temple of Dagon.'
  - where: 'note 31:10 “The wall of Beth-shan”'
    claim: 'Chronicles: sent “to carry tidings unto their idols”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/10?lang=eng'
    quote: 'to carry tidings unto their idols, and to the people.'

  - where: 'note 31:11 “The men of Jabesh-gilead”'
    claim: 'Jabesh-gilead was a chief city of Gilead, east of the Jordan, connected with Judg. 21, 1 Sam. 11 and 31, 2 Sam. 2 and 21'
    key: bd-jabesh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jabesh?lang=eng'
    quote: 'A chief city of Gilead, east of the Jordan, connected with several important events of Israelite history (Judg. 21:8–14; 1 Sam. 11; 31:11–13; 2 Sam. 2:4–5; 21:12; 15:10–14).'
  - where: 'note 31:11 “The men of Jabesh-gilead”'
    claim: 'Saul had saved Jabesh, apparently on the very day it was to be mutilated; at the peril of their lives its men went into Philistine territory to bring back the body of the man who saved them, years later'
    key: sc-knowhy-855
    url: 'https://scripturecentral.org/knowhy/why-did-the-ammonite-king-require-the-right-eyes-of-the-people-of-jabesh-gilead-be-gouged-out-1'
    quote: 'At the peril of their lives, the men of Jabesh-Gilead went into Philistine-controlled territory to bring back the body of the man who saved them, years after he had done so.'
  - where: 'note 31:11 “The men of Jabesh-gilead”'
    claim: 'The Church’s footnote at “Jabesh-gilead” points to 2 Samuel 2:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/31?lang=eng'
    quote: '“Jabesh-gilead”: 2 Sam. 2:4.'

  - where: 'note 31:12 “Burnt them there”'
    claim: 'One older reading: Israel buried rather than burned its dead, burning being for the worst criminals; here the bodies were mutilated and the Philistines might follow, so they burned the flesh and buried the bones'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/31.htm'
    quote: 'It was not the custom in Israel to burn the corpse, but to bury it in the ground. The former was restricted to the worst criminals … partly in the fact that the bodies were mutilated by the removal of the heads … and partly in their anxiety lest, if the Philistines followed up their victory and came to Jabesh, they should desecrate the bodies still further.'
  - where: 'note 31:12 “Burnt them there”'
    claim: 'Keil: not a complete burning to ashes; the bones remained and were buried'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/31.htm'
    quote: 'But even this was not a complete burning to ashes, but merely a burning of the skin and flesh; so that the bones still remained, and they were buried in the ground under a shady tree.'
  - where: 'note 31:12 “Burnt them there”'
    claim: 'Chronicles omits the burning; it says they buried the bones under the oak'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/10?lang=eng'
    quote: 'took away the body of Saul, and the bodies of his sons, and brought them to Jabesh, and buried their bones under the oak in Jabesh, and fasted seven days.'

  - where: 'note 31:13 “Fasted seven days”'
    claim: 'Fasting was an Israelite response to sorrow and burial; after recovering Saul’s body the Israelites, David among them, fasted and mourned'
    key: sc-knowhy-135
    url: 'https://scripturecentral.org/knowhy/why-did-fasting-and-prayer-accompany-nephite-mourning'
    quote: 'fasting was an Israelite religious and cultural response to incidents of sorrow, humiliation, solemnity, and burial. After recovering the body of King Saul from the Philistines, for example, the Israelites, including David, fasted and mourned over his death'

  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'Jesus saves all people; gratitude toward Him can be like Jabesh’s toward Saul, long-lasting and strong'
    key: sc-knowhy-855
    url: 'https://scripturecentral.org/knowhy/why-did-the-ammonite-king-require-the-right-eyes-of-the-people-of-jabesh-gilead-be-gouged-out-1'
    quote: 'The feelings of gratitude all people could have towards Jesus for saving them could be the same as the feelings of gratitude of the people of Jabesh-Gilead towards Saul for saving them: long-lasting and strong.'
