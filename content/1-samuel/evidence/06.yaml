chapter: 6
claims:
  - where: setting
    claim: 'The plague on the Philistines ceased only when the ark was returned; the events showed Jehovah greater than Dagon'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'The Lord then sent a plague of emerods (possibly tumors or boils) and mice upon the Philistines, which ceased only when the ark was returned to the Israelites. These events demonstrated Jehovah’s superiority over Dagon.'
  - where: setting
    claim: 'Beth-shemesh was a priestly city on the border of Judah, about twelve miles southeast of Ekron'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/6.htm'
    quote: 'It was a priestly city (Joshua 21:16) on the border of the tribe of Judah (Joshua 15:10), about 12 miles S.E. of Ekron.'
  - where: setting
    claim: 'Kirjath-jearim lay in the hills, higher than Beth-shemesh; why the ark was not returned to Shiloh is not said'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/6.htm'
    quote: 'The Ark was probably taken to Kirjath-jearim, which was neither a priestly nor Levitical city, as being the nearest place of importance on the road to Shiloh, but why it was not restored to its old resting-place does not appear.'
  - where: setting
    claim: 'Beth-shemesh was given to the children of Aaron the priest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/21?lang=eng'
    quote: 'Thus they gave to the children of Aaron the priest Hebron with her suburbs … and Beth-shemesh with her suburbs; nine cities out of those two tribes.'
  - where: thread
    claim: 'The ark was a physical symbol of the living presence of Jehovah; no unholiness, Philistine or Israelite, was tolerated'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'The ark of the covenant was a physical symbol of the living presence of Jehovah. Any unholiness, whether Philistine or Israelite, was not to be tolerated.'
  - where: 'section 1 plain'
    claim: 'The emerods were tumors (the plain words follow the lexicon and the footnote)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2914.htm'
    quote: '[טְחוֺר] noun masculine1Samuel 6:4 only plural tumours, result of dysentery'
  - where: 'note 6:3 “A payment for a wrong done to God”'
    claim: 'The Philistine asham is not the trespass offering of the law'
    key: bdb
    url: 'https://biblehub.com/hebrew/817.htm'
    quote: 'the Philistines send an אשׁם of golden mice and tumours 1 Samuel 6:3,4,8,17, and an אשׁם of money was given to the priests 2 Kings 12:17, but these are entirely different from the trespass-offering of P.'
  - where: 'note 6:3 “A payment for a wrong done to God”'
    claim: 'The trespass offering of the law was for a trespass in the holy things, with amends and a fifth added'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/5?lang=eng'
    quote: 'If a soul commit a trespass, and sin through ignorance, in the holy things of the Lord … And he shall make amends for the harm that he hath done in the holy thing, and shall add the fifth part thereto'
  - where: 'note 6:4 “Golden tumors and golden mice”'
    claim: 'Scripture Helps: emerods possibly tumors or boils'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'The Lord then sent a plague of emerods (possibly tumors or boils) and mice upon the Philistines'
  - where: 'note 6:4 “Golden tumors and golden mice”'
    claim: 'The written text has ophalim, tumours; the reading tradition substitutes tehorim in every place'
    key: bdb
    url: 'https://biblehub.com/hebrew/6076.htm'
    quote: 'II. [עֹ֫פֶל] noun masculine1Samuel 6:4 tumour; — only plural Kt (בָּ)עֳפָלִים Deuteronomy 28:27; 1 Samuel 5:6,9,12; construct עָפְלֵי 1 Samuel 6:4; suffix עָפְלֵיכֶם 1 Samuel 6:5; Qr in all (ב)טְחֹרִים'
  - where: 'note 6:4 “Golden tumors and golden mice”'
    claim: 'tehorim: tumours, result of dysentery; the substitute word got into the written text at 6:11 and 6:17'
    key: bdb
    url: 'https://biblehub.com/hebrew/2914.htm'
    quote: 'tumours, result of dysentery … — chiefly Qr for Kt עפלים, עפלֵי hemorrhoids … twice it has found its way into the Kt טְחֹרֵי הַזָּהָב 1 Samuel 6:17, צַלְמֵי טְחֹרֵיהֶם 1 Samuel 6:11'
  - where: 'note 6:4 “Golden tumors and golden mice”'
    claim: 'The disease was more serious than hemorrhoids: many died'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'The description of the effects of the emerods on the Philistines suggests something far more serious than hemorrhoids, however, although that ailment can be very painful. Many died'
  - where: 'note 6:4 “Golden tumors and golden mice”'
    claim: 'Many scholars conclude it was bubonic plague, carried by fleas on rodents, with swellings in the groin'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'The severity of the disease and the fact that rodents were involved lead many scholars to conclude that what smote the Philistines was bubonic plague. Bubonic plague gets its name from the buboes, or tumorous swellings, in the lymph glands.'
  - where: 'note 6:4 “Golden tumors and golden mice”'
    claim: 'Josephus: dysentery bringing sudden death, and mice that destroyed the crops'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-6.html'
    quote: 'a sore distemper, that brought death upon them very suddenly … And as to the fruits of their countrey, a great multitude of mice arose out of the earth and hurt them; and spared neither the plants, nor the fruits.'
  - where: 'note 6:6 “The Philistines remember Egypt”'
    claim: 'At the battle the Philistines had named the gods who smote the Egyptians'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/4?lang=eng'
    quote: 'Woe unto us! who shall deliver us out of the hand of these mighty Gods? these are the Gods that smote the Egyptians with all the plagues in the wilderness.'
  - where: 'note 6:7 “A test the cows should have failed”'
    claim: 'The test was complete: untrained cows, leaving their calves, without guidance, straight to Israel'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/6.htm'
    quote: 'If cows unaccustomed to the yoke drew the cart quietly; if in spite of their natural instincts they deserted their calves; if without human guidance they went straight to the nearest Israelite town; the obvious conclusion must be that they were controlled by a supernatural power'
  - where: 'note 6:7 “A test the cows should have failed”'
    claim: 'The cows lowed for their calves'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/6.htm'
    quote: 'lowing as they went] For their lost calves.'
  - where: 'note 6:18 “The great stone”'
    claim: 'Abel (lamentation) as a name of the stone is unattested and the sentence ungrammatical; the Targum and Septuagint read "stone"'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/6.htm'
    quote: 'If the present Heb. text is correct, Abel (= “lamentation”) must be regarded as a proper name … But there is no mention of such a name having been given to it … It seems best to follow the Targum and Sept. in reading “stone” instead of Abel'
  - where: 'note 6:18 “The great stone”'
    claim: 'The Septuagint has "the great stone" at 6:18'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/6.htm'
    quote: 'from the fenced city to the village of the Pherezite, and to the great stone, on which they placed the ark of the covenant of the Lord, that was in the field of Osee the Baethsamysite.'
  - where: 'note 6:19 “What the men of Beth-shemesh did”'
    claim: 'The manual: what they did is not clear; Keil''s sense of the verb; perhaps they looked with covetous eyes on the gold'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'Exactly what they did to bring the curse upon them is not clear. If it was merely looking upon the ark, then one wonders why all were not smitten. Bible scholars have indicated that the Hebrew word translated looked actually means “to look upon or at a thing with lust or malicious pleasure”'
  - where: 'note 6:19 “What the men of Beth-shemesh did”'
    claim: 'The manual suggests they may have looked with covetous eyes on the gold of the ark or the offerings'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'it is possible that these residents of Beth-shemesh looked upon the ark with covetous eyes, or at least upon the golden emerods and mice that were sent with it.'
  - where: 'note 6:19 “What the men of Beth-shemesh did”'
    claim: 'Better "gazed upon" with profane curiosity; they left the ark exposed instead of covering it; not punished for the unavoidable sight'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/6.htm'
    quote: 'instead of hastening to cover it with befitting reverence, they left it exposed to the public gaze, and brought down a judgment which was intended to vindicate the holiness of Jehovah. Certainly they were not punished for the unavoidable sight of the Ark'
  - where: 'note 6:19 “What the men of Beth-shemesh did”'
    claim: 'Josephus: those struck were not priests and so not worthy to touch the ark'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-6.html'
    quote: 'struck seventy persons dead of the village of Bethshemesh: (4) who not being Priests, and so not worthy to touch the ark, had approached to it.'
  - where: 'note 6:19 “What the men of Beth-shemesh did”'
    claim: 'The Kohathites were not to look on the holy things, lest they die'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/4?lang=eng'
    quote: 'But they shall not go in to see when the holy things are covered, lest they die.'
  - where: 'note 6:19 “What the men of Beth-shemesh did”'
    claim: 'At Sinai the people were warned not to break through to gaze'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng'
    quote: 'Go down, charge the people, lest they break through unto the Lord to gaze, and many of them perish.'
  - where: 'note 6:19 “How many died?”'
    claim: 'The manual (Rasmussen): the Hebrew reads seventy men, fifty thousand men; not a proper expression for 50,070; the fifty thousand seems a gloss'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'the Hebrew account says, ‘And he smote among the people seventy men, fifty thousand men. …’ It is not a proper Hebrew expression for 50,070. The ‘fifty thousand men’ appears to be an added phrase, or gloss.'
  - where: 'note 6:19 “How many died?”'
    claim: 'Josephus gives seventy dead'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-6.html'
    quote: 'But now it was that the wrath of God overtook them, and struck seventy persons dead of the village of Bethshemesh'
  - where: 'note 6:4 “Golden tumors and golden mice”'
    claim: 'The word translated emerod means an inflamed tumor, so many assumed hemorrhoids'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'Because the word translated emerod means “an inflamed tumor,” many have assumed that the Philistines were smitten with hemorrhoids and thus were motivated to send the ark back to Israel.'
  - where: 'section 1 plain'
    claim: 'asham rendered guilt offering'
    key: bdb
    url: 'https://biblehub.com/hebrew/817.htm'
    quote: '817. אָשָׁם (asham) -- Guilt, guilt offering, trespass, offense'
  - where: 'section 2 plain'
    claim: 'asham rendered guilt offering'
    key: bdb
    url: 'https://biblehub.com/hebrew/817.htm'
    quote: '817. אָשָׁם (asham) -- Guilt, guilt offering, trespass, offense'
  - where: 'section 2 plain'
    claim: 'The emerods were tumors'
    key: bdb
    url: 'https://biblehub.com/hebrew/2914.htm'
    quote: '[טְחוֺר] noun masculine1Samuel 6:4 only plural tumours, result of dysentery'
  - where: 'section 3 plain'
    claim: 'The gold objects were tumors'
    key: bdb
    url: 'https://biblehub.com/hebrew/2914.htm'
    quote: '[טְחוֺר] noun masculine1Samuel 6:4 only plural tumours, result of dysentery'
  - where: 'section 3 plain'
    claim: 'The stone of 6:18 is read as the great stone, following the Septuagint'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/6.htm'
    quote: 'It seems best to follow the Targum and Sept. in reading “stone” instead of Abel'
  - where: christ
    claim: 'BDB: the Messianic servant offers himself as an asham, as their substitute (Isa. 53:10), the same word as the Philistines'' gift'
    key: bdb
    url: 'https://biblehub.com/hebrew/817.htm'
    quote: 'The Messianic servant offers himself as an אשׁם in compensation for the sins of the people, interposing for them as their substitute Isaiah 53:10'
  - where: christ
    claim: 'Hebrews: boldness to enter the holiest by the blood of Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/10?lang=eng'
    quote: 'Having therefore, brethren, boldness to enter into the holiest by the blood of Jesus,'
  - where: 'note 6:3 “A payment for a wrong done to God”'
    claim: 'asham means guilt, and the guilt or trespass offering'
    key: bdb
    url: 'https://biblehub.com/hebrew/817.htm'
    quote: '817. אָשָׁם (asham) -- Guilt, guilt offering, trespass, offense'
  - where: 'note 6:4 “Golden tumors and golden mice”'
    claim: 'Giving glory to the God of Israel goes with confession (Josh. 7:19, the footnote at 6:5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/7?lang=eng'
    quote: 'My son, give, I pray thee, glory to the Lord God of Israel, and make confession unto him'
