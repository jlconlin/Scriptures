chapter: 9
claims:
  - where: setting
    claim: 'Benjamin was a warlike tribe that resisted the Philistines and gave Israel its first king'
    key: bd-benjamin
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/benjamin?lang=eng'
    quote: 'The Benjamites were a warlike race and did great service in resisting the Philistine oppression. The tribe provided the first king in the person of Saul (1 Sam. 9:1–2).'
  - where: setting
    claim: 'Israel then worshipped at high places like the one in 9:12–14'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: '“High places” were mountains, hilltops, or elevated platforms where the Israelites built altars to Jehovah.'
  - where: thread
    claim: 'The Lord used the search for the donkeys to bring Saul to the prophet'
    key: ot-minute-1-samuel-9-10
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-9-10'
    quote: 'The Lord used this journey to guide Saul to the prophet in order to give His people the king they wanted.'
  - where: 'note 9:2 “A choice young man, and a goodly”'
    claim: '“Goodly” points to the qualities that made Saul a logical first king; he was honest, reliable, considerate of his parents'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'The word goodly seems to indicate many of the qualities that made Saul a logical candidate to be Israel’s first king. All that the Bible reveals indicates that Saul was honest, reliable, considerate of his parents'
  - where: 'note 9:2 “A choice young man, and a goodly”'
    claim: 'The Lord chose a man who could lead the people in righteousness'
    key: ot-minute-1-samuel-9-10
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-9-10'
    quote: 'It is clear from this context that in preparing and calling Saul to be king, the Lord chose someone who could lead the people in righteousness.'
  - where: 'note 9:2 “A choice young man, and a goodly”'
    claim: 'Taller than everyone from the shoulders up makes Saul about six and a half feet, Goliath''s height in the Septuagint and the scrolls; KnoWhy #856 reads this as a rebuke of Saul in chapter 17'
    key: sc-knowhy-856
    url: 'https://scripturecentral.org/knowhy/why-does-goliath-s-height-matter'
    quote: 'a man who was taller than everyone else “from his shoulders and upwards” would have been about six and half feet, or the same height as Goliath in the sources noted above.'
  - where: 'note 9:2 “A choice young man, and a goodly”'
    claim: 'The Israelite giant, Saul, would have been the obvious choice to fight Goliath'
    key: sc-knowhy-856
    url: 'https://scripturecentral.org/knowhy/why-does-goliath-s-height-matter'
    quote: 'The Israelite giant, Saul, would have been the obvious choice to fight the Philistine giant, Goliath.'
  - where: 'note 9:2 “A choice young man, and a goodly”'
    claim: 'Saul was about a foot taller than the men of his generation'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'was about a foot taller than those of his generation'
  - where: 'note 9:3 “Sent to find the asses”'
    claim: 'The Lord used this journey to guide Saul to the prophet'
    key: ot-minute-1-samuel-9-10
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-9-10'
    quote: 'The Lord used this journey to guide Saul to the prophet in order to give His people the king they wanted.'
  - where: 'note 9:3 “Sent to find the asses”'
    claim: 'Saul showed simple faith: searching for the asses he was willing to ask the seer for revelation'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'At the beginning of this real-life drama, he showed a simple faith. Searching for his father’s lost asses, he was willing to ask Samuel, the seer, for revelation to find them.'
  - where: 'note 9:9 “Seer and prophet”'
    claim: 'The biblical word “seer” comes from rāʾāh, “to see,” while ḥāzāh underlies most instances of “vision”'
    key: sc-knowhy-457
    url: 'https://scripturecentral.org/knowhy/what-did-it-mean-for-lehi-to-be-a-visionary-man'
    quote: 'The biblical term “seer” is commonly derived from rāʾāh (cf. 1 Samuel 9:9, 11), while ḥāzāh underlies most biblical instances of the word “vision” (cf. Isaiah 1:1).'
  - where: 'note 9:9 “Seer and prophet”'
    claim: 'In Mosiah 8 a seer is one commanded to look in the interpreters; a seer is greater than a prophet because he unlocks past and hidden things'
    key: sc-knowhy-86
    url: 'https://scripturecentral.org/knowhy/why-is-a-seer-greater-than-a-prophet'
    quote: 'seership is greater than prophethood because a seer unlocks what happened in the past, including mysteries, secrets, obscured teachings, lost scripture, and hidden knowledge.'
  - where: 'note 9:9 “Seer and prophet”'
    claim: 'KnoWhy #86 lists 1 Sam. 9:9 among the Bible''s seers and finds the Book of Mormon consistent with biblical tradition'
    key: sc-knowhy-86
    url: 'https://scripturecentral.org/knowhy/why-is-a-seer-greater-than-a-prophet'
    quote: 'Indeed, seers are mentioned in the biblical record as having had a presence in Israel’s society (1 Samuel 9:9, 11, 19; … The Book of Mormon in this instance is thus consistent with the biblical tradition.'
  - where: 'note 9:9 “Seer and prophet”'
    claim: 'The means by which Samuel identified Saul is evidence of his seership'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'The means by which Samuel identified Saul is evidence of Samuel’s gift of seership.'
  - where: 'note 9:9 “Seer and prophet”'
    claim: 'No evidence that Samuel had the Urim and Thummim, but it is possible'
    key: ot-minute-1-samuel-9-10
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-9-10'
    quote: 'While there is no evidence that Samuel had the Urim and Thummim, it is a possibility.'
  - where: 'note 9:11 “Maidens at the well”'
    claim: 'The audience would expect a well type-scene, but nothing happens; KnoWhy #854 reads this as foreshadowing Saul''s cut-short reign'
    key: sc-knowhy-854
    url: 'https://scripturecentral.org/knowhy/why-does-boaz-allude-to-a-well-in-connection-with-his-meeting-ruth'
    quote: 'The audience likely would have expected a well type-scene to ensue. However, nothing happens. Saul asks the women for information and continues on his way (v. 11-14). This foreshadows what will eventually happen to Saul, whose reign will be cut short'
  - where: 'note 9:15 “Uncovered Samuel''s ear”'
    claim: 'The Hebrew is gālâ ʾōzen, uncover the ear, i.e. reveal to someone; used at 9:15, 20:2, 12–13, 2 Sam. 7:27 and Ruth 4:4'
    key: bdb
    url: 'https://biblehub.com/hebrew/1540.htm'
    quote: 'גָּלָה אֹזֶן uncover the ear of one, i.e. reveal to him 1 Samuel 9:15; 1 Samuel 20:2,12,13; 1 Samuel 22:8 (twice in verse); 1 Samuel 22:17; 2 Samuel 7:27; 1 Chronicles 17:25; Ruth 4:4'
  - where: 'note 9:16 “Their cry is come unto me”'
    claim: '“Captain” is nagid, “prince” or “ruler”'
    key: ot-minute-1-samuel-9-10
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-9-10'
    quote: 'The Hebrew word translated as “captain” (nagid) in verse 16 means “prince” or “ruler.”'
  - where: 'note 9:20 “The desire of Israel”'
    claim: 'The phrase may mean Saul embodied what Israel desired, a king, or that his name was already being talked about'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'This verse may be taken to mean that Saul, as the king-to-be, was the embodiment of what Israel desired even though as yet they did not know he would be their king. It also could mean, however, that his size, comeliness, and other qualities were well known'
  - where: 'note 9:21 “The smallest of the tribes”'
    claim: 'Saul protested that he had no family or political connections that would warrant his being king'
    key: ot-minute-1-samuel-9-10
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-9-10'
    quote: 'Saul protested the calling because, as he pointed out, he had no family or political connections that would warrant his becoming king.'
  - where: 'note 9:24 “The portion kept for Saul”'
    claim: 'Samuel placed the lowly Benjamite in a place of honour, showing he was to be honoured as king'
    key: ot-minute-1-samuel-9-10
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-9-10'
    quote: 'By placing the lowly Benjaminite in a place of honor, Samuel was showing that Saul was to be shown the honor and respect of a king.'
  - where: 'note 9:25 “Talking on the roof, or sleeping there?”'
    claim: 'The Septuagint reads that a lodging was prepared for Saul on the roof and he lay down'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/9.htm'
    quote: '25And he went down from Bama into the city; and they prepared a lodging for Saul on the roof, and he lay down.'
  - where: 'note 9:25 “Talking on the roof, or sleeping there?”'
    claim: 'A modern translation follows the Greek: a bed was spread for Saul on the roof'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+9&version=NRSVUE'
    quote: '25 When they came down from the shrine into the town, a bed was spread for Saul on the roof, and he lay down to sleep.'
  - where: christ
    claim: 'The Lord used the journey to guide Saul to the prophet'
    key: ot-minute-1-samuel-9-10
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-9-10'
    quote: 'The Lord used this journey to guide Saul to the prophet in order to give His people the king they wanted.'
  - where: christ
    claim: 'The LORD (I Am) of Exodus 3 is Jehovah, Jesus Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: 'TG Jesus Christ, Jehovah.'
  - where: 'note 9:11 “Maidens at the well”'
    claim: 'Abraham''s servant meets Rebekah coming out with her pitcher; she becomes Isaac''s wife'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/24?lang=eng'
    quote: 'behold, Rebekah came out, who was born to Bethuel'
  - where: 'setting'
    claim: 'Chapter 9 turns at once to Saul after the LORD tells Samuel to appoint a king'
    key: ot-minute-1-samuel-9-10
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-9-10'
    quote: 'After the Lord told Samuel that he should listen to the people and appoint a king, the narrative immediately describes the genealogy of Saul'
  - where: 'setting'
    claim: 'Saul''s home was Gibeah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/10?lang=eng'
    quote: 'And Saul also went home to Gibeah'
  - where: 'note 9:9 “Seer and prophet”'
    claim: 'Rōʾeh, “seer,” is the old name for nābîʾ, “prophet”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7203.htm'
    quote: 'old name for נָבִיא 1 Samuel 9:9b'
  - where: 'note 9:16 “Their cry is come unto me”'
    claim: '“I have looked upon my people” recalls Ex. 2:25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/2?lang=eng'
    quote: 'And God looked upon the children of Israel'
  - where: 'note 9:16 “Their cry is come unto me”'
    claim: 'At the bush the LORD''s seeing led to a sending: “I will send thee unto Pharaoh”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: 'Come now therefore, and I will send thee unto Pharaoh'
  - where: 'note 9:20 “The desire of Israel”'
    claim: 'The lexicon renders “for whom is all that is desirable in Israel?”, with the Greek and Latin versions'
    key: bdb
    url: 'https://biblehub.com/hebrew/2532.htm'
    quote: 'and for whom is all that is desirable in Israel? so ᵐ5 ᵑ9 RV Dr'
  - where: 'note 9:21 “The smallest of the tribes”'
    claim: 'Saul''s “smallest” (9:21) is qāṭān, with “the tribes of Israel”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'מִ/קַּטַנֵּי֙'
  - where: 'note 9:21 “The smallest of the tribes”'
    claim: 'Samuel''s “little” (15:17) is the same word, qāṭōn'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'קָטֹ֤ן'
  - where: 'note 9:24 “The portion kept for Saul”'
    claim: 'The “shoulder” is šôq, the upper hind leg of a sacrificial animal; the Greek and Latin, and the AV after them, say shoulder'
    key: bdb
    url: 'https://biblehub.com/hebrew/7785.htm'
    quote: 'specifically upper leg, thigh, hind leg, portion eaten 1 Samuel 9:24'
  - where: 'note 9:24 “The portion kept for Saul”'
    claim: 'In Ex. 29:27 the shoulder of the ram of consecration is heaved up and is for Aaron and his sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'the shoulder of the heave offering, which is waved, and which is heaved up, of the ram of the consecration, even of that which is for Aaron, and of that which is for his sons'
  - where: 'christ'
    claim: 'At the bush the LORD''s seeing led to a sending'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: 'Come now therefore, and I will send thee unto Pharaoh'
  - where: 'explore'
    claim: 'Samuel''s words at 15:17 use the same word as Saul''s at 9:21'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'קָטֹ֤ן'
