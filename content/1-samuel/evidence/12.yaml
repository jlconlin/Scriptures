chapter: 12
claims:
  - where: when
    claim: 'At Gilgal the people made Saul king before the LORD (11:14–15)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/11?lang=eng'
    quote: 'And all the people went to Gilgal; and there they made Saul king before the LORD in Gilgal'
  - where: setting
    claim: 'Gilgal was the first camp after the Jordan crossing, where the twelve stones were set up, and a sacred city in Saul''s time'
    key: bd-gilgal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gilgal?lang=eng'
    quote: 'The place near Jericho at which the Israelite camp was made on the first night after crossing the Jordan … Here the 12 stones from the Jordan were set up … It was a sacred city in the time of Saul (1 Sam. 10:8; 11:14–15'
  - where: setting
    claim: 'After Saul was appointed, Samuel seems to have ceased acting as judge but remained prophet; in chapter 12 he calls the people to witness his integrity; he dies at 25:1'
    key: bd-samuel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel?lang=eng'
    quote: 'Samuel seems to have ceased to act as judge, but he continued to be the prophet and representative of Jehovah. The following are the chief events … he calls the people to witness to his own integrity (1 Sam. 12)'
  - where: setting
    claim: 'The Church''s seminary manual: the people were gathered to confirm Saul as king, and Samuel spoke of his ministry and testified that the Lord was Israel''s true leader'
    key: ot-seminary-lesson-85
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-85-1-samuel-12-15?lang=eng'
    quote: 'while the Israelites were gathered to confirm Saul as their king, the prophet Samuel spoke of his ministry among them and testified that the Lord was the true leader of Israel.'
  - where: thread
    claim: 'In verse 3 Samuel puts himself on trial: the people are accusers, the LORD and Saul judges'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/12.htm'
    quote: 'Samuel puts himself on his trial. The people are to be the accusers: Jehovah, and His representative Saul are the judges.'
  - where: thread
    claim: 'In clearing Samuel the people condemned themselves: they had no well-founded reason for the request'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/12.htm'
    quote: 'with the declaration which the people had made concerning Samuel''s judicial labours they had condemned themselves, inasmuch as they had thereby acknowledged on oath that there was no ground for their dissatisfaction with Samuel''s administration'
  - where: thread
    claim: '"Reason with you" means plead with you; the trial figure continues with Samuel now accuser and Israel defendant; the righteous acts prove the LORD''s covenant righteousness'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/12.htm'
    quote: 'Present yourselves that I may plead with you. The figure of a trial (1 Samuel 12:3 note) is still kept up; but the relation of the parties is changed. Samuel is now the accuser, Israel the defendant.'
  - where: thread
    claim: 'The seminary manual: the importance of the warning of 12:14–15, 25 is seen in Saul''s choices in the following chapters'
    key: ot-seminary-lesson-85
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-85-1-samuel-12-15?lang=eng'
    quote: 'Explain that students will see the importance of this warning as they read about Saul’s choices in the chapters that follow.'
  - where: 'note 12:2 “A farewell address”'
    claim: 'Samuel''s speech (12:1–25) is one of four Old Testament farewell speeches, with Moses'', Joshua''s and David''s; such speeches were given by aging prophet-leaders to teach, exhort and hand on leadership'
    key: hague-welch-farewell
    url: 'https://scripturecentral.org/archive/books/book-chapter/benjamins-sermon-traditional-ancient-farewell-address-0'
    quote: 'Four of these accounts, which vary considerably in length, preserve what is known of the farewell speeches of Moses (Deuteronomy 31–34), Joshua (Joshua 23–24), David (1 Kings 2:1–10; compare 1 Chronicles 28–29), and Samuel (1 Samuel 12:1–25).'
  - where: 'note 12:2 “A farewell address”'
    claim: 'The elements most characteristic of Israelite farewell speeches: assertion of innocence, tasks for successors, theological review of history, future events'
    key: hague-welch-farewell
    url: 'https://scripturecentral.org/archive/books/book-chapter/benjamins-sermon-traditional-ancient-farewell-address-0'
    quote: '(1) the speaker’s assertion of innocence and fulfillment of his mission, (2) the designation of tasks for successors, (3) a theological review of history, and (4) the revelation of future events.'
  - where: 'note 12:2 “A farewell address”'
    claim: 'Benjamin pointed to his own service (Mosiah 2:12–14) and declared his innocence (Mosiah 2:15)'
    key: hague-welch-farewell
    url: 'https://scripturecentral.org/archive/books/book-chapter/benjamins-sermon-traditional-ancient-farewell-address-0'
    quote: 'After Benjamin reported his activities as king, he openly declared his innocence before God: “Yet my brethren, I have not done these things that I might boast'
  - where: 'note 12:2 “A farewell address”'
    claim: 'Samuel''s speech is old enough to have been on the plates of brass, and Benjamin''s tradition very likely drew on biblical sources'
    key: hague-welch-farewell
    url: 'https://scripturecentral.org/archive/books/book-chapter/benjamins-sermon-traditional-ancient-farewell-address-0'
    quote: 'which very likely drew much of its strength from biblical sources. … Four Old Testament accounts are old enough to have been on the plates of brass: Moses … Joshua … David … and Samuel (1 Samuel 12:1–25).'
  - where: 'note 12:2 “A farewell address”'
    claim: 'The Church''s footnote at "walked" points to Mosiah 2:12 (9–41)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/12?lang=eng'
    quote: '“walked”: Mosiah 2:12 (9–41).'
  - where: 'note 12:11 “Who was Bedan?”'
    claim: 'Bedan is not found in Judges; possibly an unrecorded judge, but more probably a copyist''s error for Barak, the reading of the Septuagint and Syriac; others explained it as Samson'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/12.htm'
    quote: 'This name is not found in the book of Judges, but as that book is not a complete history, Bedan may possibly have been the name of a judge not mentioned there. But more probably Bedan is a copyist’s error for Barak, which is the reading of the Sept. and Syriac.'
  - where: 'note 12:11 “Who was Bedan?”'
    claim: 'Bedan has also been explained as a name of Samson (Ben-Dan, the Danite)'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/12.htm'
    quote: 'Bedan has also been explained as a name of Samson, either = Ben-Dan, i.e. the son of Dan or Danite (Jdg 13:2): or as a bye-name = corpulent.'
  - where: 'note 12:11 “Who was Bedan?”'
    claim: 'No judge Bedan is named anywhere; the name occurs only in 1 Chr. 7:17; Keil regards it as a copyist''s error for Barak, one of the most celebrated judges'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/12.htm'
    quote: 'There is no judge named Bedan mentioned either in the book of Judges or anywhere else. The name Bedan only occurs again in 1 Chronicles 7:17'
  - where: 'note 12:11 “Who was Bedan?”'
    claim: 'Keil: no other course than to regard Bedan as an old copyist''s error for Barak, as the Septuagint, Syriac and Arabic do'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/12.htm'
    quote: 'There is no other course left, therefore, than to regard Bedan as an old copyist''s error for Barak (Judges 4), as the lxx, Syriac, and Arabic have done'
  - where: 'note 12:11 “Who was Bedan?”'
    claim: 'The Septuagint reads Barac'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/12.htm'
    quote: 'And he sent Jerobaal, and Barac, and Jephthae, and Samuel'
  - where: 'note 12:11 “Who was Bedan?”'
    claim: 'Samuel names himself because he has resigned and reviews the era of the judges as a whole, proving the LORD had kept delivering them to the present'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/12.htm'
    quote: 'he has resigned his office, and standing as it were outside the era of the Judges, he reviews it as a whole: (c) that in order to point his rebuke … it was necessary to prove that He had not forsaken them, but had continued His deliverances down to the present.'
  - where: 'note 12:11 “Who was Bedan?”'
    claim: 'The oppressions of verse 9 are Sisera''s (Jabin of Hazor), the Philistines'' forty years, and Eglon of Moab'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/12.htm'
    quote: '(1) that by Sisera, the commander-in-chief of Hazor, i.e., that of the Canaanitish king Jabin of Hazor (Judges 4:2.); (2) that of the Philistines … the forty years'' oppression … and (3) the Moabitish oppression under Eglon (Judges 3:12.).'
  - where: 'note 12:12 “Nahash and the request”'
    claim: 'The demand for a king came before Nahash''s invasion in chapter 11, so the reference is to earlier inroads or a threatened attack; 8:20 hints at this reason; "Nay" is their refusal of Samuel''s expostulations'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/12.htm'
    quote: 'As the demand for a king preceded the invasion of Nahash recorded in ch. 11, the reference must be to earlier inroads, or to a threatened attack. This reason for desiring a king is hinted at in 1 Samuel 8:20.'
  - where: 'note 12:12 “Nahash and the request”'
    claim: '"When the LORD your God was your king" is compared with Judg. 8:23'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/12.htm'
    quote: 'when the Lord your God was your king] Cp. Jdg 8:23.'
  - where: 'note 12:23 “Praying and teaching”'
    claim: 'Samuel continued to be the prophet and representative of Jehovah after ceasing to judge'
    key: bd-samuel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel?lang=eng'
    quote: 'he continued to be the prophet and representative of Jehovah.'
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: explore
    claim: 'The other Old Testament farewell speeches are Moses'' (Deut. 31–34) and Joshua''s (Josh. 23–24)'
    key: hague-welch-farewell
    url: 'https://scripturecentral.org/archive/books/book-chapter/benjamins-sermon-traditional-ancient-farewell-address-0'
    quote: 'the farewell speeches of Moses (Deuteronomy 31–34), Joshua (Joshua 23–24), David (1 Kings 2:1–10; compare 1 Chronicles 28–29), and Samuel (1 Samuel 12:1–25).'
  - where: 'note 12:11 “Who was Bedan?”'
    claim: 'The letters of Bedan and Barak are much alike; Barak''s deliverance is from the Canaanites (Judg. 4:6); Jerubbaal ended the Midianite oppression; Jephthah routed the Ammonites'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/12.htm'
    quote: 'The letters of the two words are much alike. In this case the reference will be to the deliverance from the Canaanite oppression already mentioned (Jdg 4:6 ff.).'
  - where: 'note 12:11 “Who was Bedan?”'
    claim: 'Jerubbaal ended the Midianite oppression; Jephthah routed the Ammonites'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/12.htm'
    quote: '(1) Jerubbaal, who brought the Midianite oppression to an end (Judges 6-8). … (3) Jephthah the Gileadite, who routed the Ammonites (Judges 11).'
  - where: 'note 12:3 “Whose ox have I taken?”'
    claim: 'BDB: kōpher is the price for ransom of a life (Ex. 21:30; Num. 35:31), and lists 1 Sam. 12:3 under that sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/3724.htm'
    quote: 'a price for ransom of a life … Numbers 35:31,32 (P) … 1 Samuel 12:3; Amos 5:12.'
  - where: 'note 12:17 “Thunder in the wheat harvest”'
    claim: 'The wheat harvest was gathered in the fifty days between Passover and Pentecost'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'Fifty days (Lev. 23:16) after the Feast of the Passover, the Feast of Pentecost was kept. During those 50 days the harvest of wheat was being gathered in.'
  - where: 'note 12:17 “Thunder in the wheat harvest”'
    claim: 'After the May showers rain hardly ever falls in the land until the end of September'
    key: bd-rain
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rain?lang=eng'
    quote: 'Showers may occur in May, but after this, rain hardly ever falls until the end of September'
  - where: 'note 12:21 “Vain things”'
    claim: 'BDB: tōhû in 1 Sam. 12:21 is figurative of what is empty and unreal, as idols, as in Isa. 41:29 and of idol-makers in Isa. 44:9'
    key: bdb
    url: 'https://biblehub.com/hebrew/8414.htm'
    quote: 'figurative of what is empty, unreal, as idols 1 Samuel 12:21'
  - where: 'note 12:21 “Vain things”'
    claim: 'BDB lists Isa. 41:29 and Isa. 44:9 (of idol-makers) with 1 Sam. 12:21'
    key: bdb
    url: 'https://biblehub.com/hebrew/8414.htm'
    quote: 'Isaiah 44:9 (of idol-makers)'
  - where: christ
    claim: 'The LORD will not forsake His people, because it pleased Him to make them His people; they had done wickedness (1 Sam. 12:20, 22)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/12?lang=eng'
    quote: 'For the LORD will not forsake his people for his great name’s sake: because it hath pleased the LORD to make you his people.'
