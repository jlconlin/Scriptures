chapter: 24
claims:
  - where: setting
    claim: 'En-gedi means “fountain of the kid,” on the western shore of the Dead Sea; David dwelt in its strongholds'
    key: bd-en-gedi
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/en-gedi?lang=eng'
    quote: 'Fountain of the kid. A place on the western shore of the Dead Sea (Josh. 15:62; 2 Chr. 20:2; Song 1:14; Ezek. 47:10). David dwelt in the “strong holds at En-gedi” (1 Sam. 23:29; 24:1).'
  - where: setting
    claim: 'Chapters 24–26 are read as a unit; chapter 25 talks about Saul through Nabal; the theme is avoiding blood-guilt'
    key: heal-abigail
    url: 'https://mi.byu.edu/old-testament-reflections/abigail-in-between'
    quote: 'scholars now consider 1 Samuel 24–26 to be a coherent unit. These three chapters wrestle with the relationship between Saul and David, with the middle chapter using narrative analogy to talk about Saul through the figure of Nabal.'
  - where: setting
    claim: 'David spared Saul twice, at En-gedi and in the wilderness of Ziph'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'Twice he spared Saul’s life—first in the dark cave at En-Gedi, and second in Saul’s camp in the wilderness of Ziff.'
  - where: thread
    claim: 'The theme of 24–26 is avoiding blood-guilt from slaying the LORD''s anointed or shedding innocent blood'
    key: heal-abigail
    url: 'https://mi.byu.edu/old-testament-reflections/abigail-in-between'
    quote: 'The overarching theme is avoiding blood-guilt from either slaying the Lord’s anointed (1 Samuel 24:11; 26:9) or shedding innocent blood (1 Samuel 25:30–31).'
  - where: 'note 24:3 “To cover his feet”'
    claim: 'A modern translation renders the phrase “to relieve himself”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+24&version=NIV'
    quote: '3 He came to the sheep pens along the way; a cave(C) was there, and Saul went in to relieve(D) himself.'
  - where: 'note 24:3 “To cover his feet”'
    claim: 'The Hebrew of 24:3 has the verb “to cover” (lehasek) with “his feet”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'לְ/הָסֵ֣ךְ'

  - where: 'note 24:3 “To cover his feet”'
    claim: 'Saul unknowingly entered the cave where David hid; David could have killed him'
    key: scripture-helps-1-samuel-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/23-1-samuel-17-18-24-26-2-samuel-5-7?lang=eng'
    quote: 'As Saul pursued David, he unknowingly entered a cave where David was hiding. David could have killed Saul'

  - where: 'note 24:4 “The day the LORD spoke of”'
    claim: 'One older reading: David may have had assurances from Samuel and Gad, which his men interpreted their own way'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/24.htm'
    quote: '4. of which the Lord said] David may have received from Samuel and Gad assurances of his ultimate deliverance from Saul’s persecutions, which his followers interpret in their own way. Cp. 1 Samuel 23:17, 1 Samuel 25:28-30.'
  - where: 'note 24:4 “The day the LORD spoke of”'
    claim: 'Another older reading: no such oracle; the men took the providence that brought Saul into David''s power as a word of the LORD'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/24.htm'
    quote: 'the speakers regarded the leadings of providence by which Saul had been brought into David''s power as a divine intimation to David himself to take this opportunity of slaying his deadly enemy, and called this intimation a word of Jehovah.'

  - where: 'note 24:6 “The LORD''s anointed”'
    claim: 'The word “anointed” in 24:6 is mashiach (H4899), the same word as in 2:10'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'לִ/מְשִׁ֣יחַ'
  - where: 'note 24:6 “The LORD''s anointed”'
    claim: 'Chapters 24–26 turn on avoiding blood-guilt from slaying the Lord''s anointed'
    key: heal-abigail
    url: 'https://mi.byu.edu/old-testament-reflections/abigail-in-between'
    quote: 'The overarching theme is avoiding blood-guilt from either slaying the Lord’s anointed (1 Samuel 24:11; 26:9) or shedding innocent blood (1 Samuel 25:30–31).'
  - where: 'note 24:6 “The LORD''s anointed”'
    claim: 'President J. Reuben Clark Jr. used David''s words to teach Church educators not to thrust aside their leader''s counsel'
    key: clark-charted-course
    url: 'https://rsc.byu.edu/teaching-word/appendix-excerpts-foundational-documents'
    quote: 'And I entreat you not to make the mistake of thrusting aside your leader’s counsel, or of failing to carry out his wish, or of refusing to follow his direction. David of old, privily cutting off only the skirt of Saul’s robe, uttered the cry of a smitten heart:'
  - where: 'note 24:6 “The LORD''s anointed”'
    claim: 'The address is President J. Reuben Clark Jr.''s, August 8, 1938'
    key: clark-charted-course
    url: 'https://rsc.byu.edu/teaching-word/appendix-excerpts-foundational-documents'
    quote: 'The Charted Course of the Church in Education … President J. Reuben Clark Jr., August 8, 1938'

  - where: 'note 24:6 “The LORD''s anointed”'
    claim: 'Clark praised the teachers'' desire to do what “our ordained leader and prophet” would have them do'
    key: clark-charted-course
    url: 'https://rsc.byu.edu/teaching-word/appendix-excerpts-foundational-documents'
    quote: 'your earnest desire to do the things that our ordained leader and prophet would have you do.'

  - where: 'note 24:13 “The proverb of the ancients”'
    claim: 'One older reading: a man''s character is known by his actions; if David were wicked he would have killed Saul'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/24.htm'
    quote: '13. Wickedness, &c.] A man’s character is known by his actions. If I were wicked at heart, I should have shewn it by killing you. Cp. Matthew 7:16-20.'
  - where: 'note 24:13 “The proverb of the ancients”'
    claim: 'It is unclear whether “but mine hand shall not be upon thee” is part of the proverb'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/24.htm'
    quote: 'It is not clear whether this is part of the proverb or David’s own utterance.'
  - where: 'note 24:13 “The proverb of the ancients”'
    claim: 'Another older reading: only a wicked man could wish to avenge himself'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/24.htm'
    quote: 'The meaning is this: Only a wicked man could wish to avenge himself; I do not.'
  - where: 'note 24:13 “The proverb of the ancients”'
    claim: 'A dead dog and a flea describe a harmless, insignificant man whom a king should not trouble to pursue; compare 2 Sam. 9:8; 16:9; 1 Sam. 26:20'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/24.htm'
    quote: 'By these similes David meant to describe himself as a perfectly harmless and insignificant man, of whom Saul had no occasion to be afraid, and whom the king of Israel ought to think it beneath his dignity to pursue. A dead dog cannot bite or hurt'

  - where: 'note 24:13 “The proverb of the ancients”'
    claim: 'A dead dog and a flea are contemptible and insignificant; a worthy object for the king with his picked troops'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/24.htm'
    quote: '14. after a dead dog, &c.] “A dead dog, a single flea,” express what is absolutely contemptible, harmless, and insignificant. A worthy object truly for an expedition of the King of Israel with his picked troops!'

  - where: 'note 24:17 “Thou art more righteous than I”'
    claim: 'Saul wept and admitted his evil, and said he knew David would be king'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'Realizing this, Saul wept and cried aloud, admitting his evil to David and calling out plaintively to him that he, too, knew that David would surely be king over Israel.'
  - where: 'note 24:17 “Thou art more righteous than I”'
    claim: 'Saul struggled against the decision of God personified in David; his recognition was at war with his will'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'As he struggled against the decision of God, personified in David, he became more and more aware that his efforts were futile. But this dawning recognition was at war with his stubborn will. There was no fault in David'
  - where: 'note 24:17 “Thou art more righteous than I”'
    claim: 'David repeatedly spares Saul, leading Saul to say he is more righteous and will be king'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'He leads a band of outcasts and repeatedly spares Saul’s life, leading Saul to exclaim, “Thou art more righteous than I: . . . wherefore the Lord reward thee good. . . . I know well that thou shalt surely be king” (24:17, 19–20; see chap. 26).'

  - where: 'note 24:21 “Thou wilt not cut off my seed”'
    claim: 'David showed hesed to the house of Saul and Jonathan, seeking out Mephibosheth and restoring his lands'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'David also continues to show ḥesed to the house of Saul and Jonathan, seeking out Jonathan’s surviving son, Mephibosheth, to restore ancestral lands to him and welcome him into the royal household (chap. 9).'

  - where: christ
    claim: 'Messiah means “the anointed”; in the New Testament the Messiah is called the Christ'
    key: bd-messiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/messiah?lang=eng'
    quote: 'An Aramaic word meaning “the anointed.” … In the New Testament the deliverer is called the Christ, which is the Greek equivalent of Messiah'
  - where: christ
    claim: 'At 2:10 the Septuagint has christos for “anointed”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/2?lang=eng'
    quote: '10b “anointed”: In the Septuagint Greek version, the noun is christos.'
  - where: christ
    claim: 'The footnote to 24:12 “judge” points to D&C 64:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/24?lang=eng'
    quote: '“judge”: D&C 64:11.'
  - where: explore
    claim: 'Heal''s essay reads 24–26 as a unit'
    key: heal-abigail
    url: 'https://mi.byu.edu/old-testament-reflections/abigail-in-between'
    quote: 'scholars now consider 1 Samuel 24–26 to be a coherent unit.'
