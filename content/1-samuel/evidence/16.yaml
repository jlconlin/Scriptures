chapter: 16
claims:
  - where: setting
    claim: 'The LORD’s question in verse 1 shows Samuel had not reconciled himself to Saul’s rejection, and perhaps mourned for Israel'
    key: ot-minute-1-samuel-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-16'
    quote: 'The words the Lord used in verse 1 to call Samuel to go and anoint another king—“How long wilt thou mourn for Saul”—show that the prophet had not reconciled himself to Saul’s rejection, that he continued to mourn for him, and perhaps that he mourned for the children of Israel'
  - where: setting
    claim: 'Chapters 16–31 of 1 Samuel describe the rise of David'
    key: ot-seminary-1-samuel-intro
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel?lang=eng'
    quote: 'Chapters 1–7 recount the actions of Samuel … Chapters 8–15 focus on Saul, the first king of Israel. Chapters 16–31 describe the rise of David.'
  - where: setting
    claim: 'The Church’s footnote to “Beth-lehemite” points to Micah 5:2, Luke 2:4 and John 7:42'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/16?lang=eng'
    quote: '“Beth-lehemite”: Micah 5:2; Luke 2:4; John 7:42 (41–44).'
  - where: setting
    claim: 'David was born into a line of hesed, a descendant of Ruth and Boaz'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'He is born into a context of ḥesed as a descendant of Ruth and Boaz, two models of loving-kindness.'
  - where: thread
    claim: 'Verses 13–14 set the Spirit that blessed David against Saul’s evil spirit'
    key: ot-minute-1-samuel-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-16'
    quote: 'Note the contrast between Saul’s evil spirit with the Spirit of the Lord that blessed David. Saul had rejected the Lord and, because of it, was cut off from God’s inspiration and wisdom.'
  - where: thread
    claim: 'As armourbearer David was brought into the palace and the seat of power he had been anointed to inherit; God’s design was unfolding'
    key: ot-seminary-lesson-86
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-86-1-samuel-16?lang=eng'
    quote: 'Hence David was introduced into the palace and the future seat of power he had been ordained to succeed (see 1 Samuel 16:13). David was following God’s plan, and thereby God’s design for him was unfolding according to the divine timetable.'

  - where: 'note 16:2 “A sacrifice, and a secret errand”'
    claim: 'Samuel’s fear had ground; the Lord did not blame it but showed him how to anoint David without attracting attention; one older reading: no untruth, the sacrifice was real and only the chief object concealed'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/16.htm'
    quote: 'the Lord did not blame him for his fear, but pointed out the way by which he might anoint David without attracting attention … There was no untruth in this, for Samuel was really about to conduct a sacrificial festival'
  - where: 'note 16:2 “A sacrifice, and a secret errand”'
    claim: 'For David’s safety as much as Samuel’s the purpose had to stay hidden; concealing the primary intention was legitimate'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/16.htm'
    quote: 'For David’s safety no less than his own it was necessary that the purpose of Samuel’s errand should not be known. … It was perfectly legitimate for Samuel to conceal the primary intention and mention only the secondary object of his visit.'
  - where: 'note 16:2 “A sacrifice, and a secret errand”'
    claim: 'The elders feared Samuel had come to condemn them; the heifer gave Samuel and Jesse’s household reason to sit down together'
    key: ot-minute-1-samuel-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-16'
    quote: 'Samuel’s reputation preceded him, and the town elders were afraid that he had come to condemn them. Preparing for this, the Lord had told Samuel to take a heifer with him to offer as a sacrifice, giving the prophet and Jesse’s household an excuse to sit down together'
  - where: 'note 16:2 “A sacrifice, and a secret errand”'
    claim: 'To sanctify oneself was by washings and purifications before a sacrificial feast (Ex. 19:10)'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/16.htm'
    quote: 'to sanctify one''s self by washings and legal purifications, which probably preceded every sacrificial festival (vid., Exodus 19:10, Exodus 19:22).'

  - where: 'note 16:7 “The eyes and the heart”'
    claim: 'The Hebrew of “outward appearance” in 16:7 is “to the eyes” (la‘enayim, Strong’s 5869)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'לַ/עֵינַ֔יִם'
  - where: 'note 16:7 “The eyes and the heart”'
    claim: 'BDB: lebab is the inner man, mind, will, heart; the inner man in contrast with the outer, set against the eyes in 1 Sam. 16:7; it comprehends mind, affections and will'
    key: bdb
    url: 'https://biblehub.com/hebrew/3824.htm'
    quote: 'inner man, mind, will, heart … 1 the inner man in contrast with the outer … eyes Numbers 15:39 (H) 1 Samuel 16:7 … 2 the inner man, indefinite the soul, comprehending mind, affections and will'
  - where: 'note 16:7 “The eyes and the heart”'
    claim: 'Saul’s height was made clear when he was chosen; now the Lord tells Samuel to ignore outward signs; the new king is not the tallest or the firstborn'
    key: ot-minute-1-samuel-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-16'
    quote: 'When Saul had been chosen as the first king of Israel, the text made it clear that he was taller than all the other Israelites. In direct contrast, the Lord now instructed Samuel to ignore the outward signs.'
  - where: 'note 16:7 “The eyes and the heart”'
    claim: 'Mortals see the outward appearance; the Lord looks to the very depths'
    key: ot-manual-1-samuel-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-16-31-king-davids-call-to-lead-israel?lang=eng'
    quote: 'Mortals tend to see the outward appearance, but the Lord has the power to look to the very depths of men and things.'

  - where: 'note 16:11 “The youngest, with the sheep”'
    claim: 'David was left out of the gathering because he was tending the sheep'
    key: ot-minute-1-samuel-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-16'
    quote: 'David, the youngest son, was left out of the initial gathering and sacrifice since he had responsibilities tending the sheep.'
  - where: 'note 16:11 “The youngest, with the sheep”'
    claim: 'The raising of a younger brother over elder ones defied cultural expectation and recurs in Israel’s sacred writings'
    key: sc-knowhy-462
    url: 'https://scripturecentral.org/knowhy/why-was-it-significant-that-nephi-was-made-a-ruler-and-a-teacher-over-his-brethren'
    quote: 'Although it defied cultural expectations, the elevation of a younger brother over his elder siblings is a recurring theme in the sacred writings of ancient Israel. Some of the great patriarchs and kings of Israel—including Jacob, Joseph, Judah, Ephraim, David, and Solomon—were given similar promises'
  - where: 'note 16:11 “The youngest, with the sheep”'
    claim: 'The reason seems generally to have been that the younger son was more righteous'
    key: sc-knowhy-462
    url: 'https://scripturecentral.org/knowhy/why-was-it-significant-that-nephi-was-made-a-ruler-and-a-teacher-over-his-brethren'
    quote: 'In general, the reason for this seems to have been that the younger son was simply more righteous.'
  - where: 'note 16:11 “The youngest, with the sheep”'
    claim: 'Each of the three stories that introduce David emphasizes his shepherding; 2 Sam. 7:8 and 5:2 tie shepherd and king'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'Each of the three stories that introduce David emphasize his role as a shepherd (1 Samuel 16:11, 19; 17:15). … showing the connection between a shepherd and a king in Israel’s imagination.'
  - where: 'note 16:11 “The youngest, with the sheep”'
    claim: 'The shepherd was one of the most common metaphors for kings in the ancient Near East; kings were to care for their people'
    key: seely-messiah
    url: 'https://rsc.byu.edu/approaching-holiness/jesus-messiah-prophet-priest-king'
    quote: 'One of the most common metaphors for kings in the ancient Near East was the shepherd. … Kings were called to shepherd their people, to care for them, to reach out to the poor and oppressed'

  - where: 'note 16:12 “Ruddy and handsome”'
    claim: 'The words of David’s looks are rhetorical devices to highlight the hero; ruddy could refer to his hair'
    key: ot-minute-1-samuel-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-16'
    quote: 'These words are used as rhetorical devices to highlight the hero of the story. The word “countenance” is a euphemism for the face. The term “ruddy” could refer to David’s hair.'
  - where: 'note 16:12 “Ruddy and handsome”'
    claim: 'Ruddy refers to a red complexion or red hair'
    key: ot-seminary-lesson-86
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-86-1-samuel-16?lang=eng'
    quote: 'You may need to explain that the word ruddy in verse 12 refers to having a red complexion or red hair.'
  - where: 'note 16:12 “Ruddy and handsome”'
    claim: 'David appears as a handsome, ruddy shepherd boy on whose heart the Lord has looked'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'This youngest son of Jesse first appears as a handsome, ruddy shepherd boy on whose heart the Lord has looked and found an instrument worthy of honor (1 Samuel 13:14; 16:7–13).'

  - where: 'note 16:13 “Anointed in the midst of his brethren”'
    claim: 'Olive oil, associated with prosperity, cleansing, healing and purity, symbolized the Spirit'
    key: seely-messiah
    url: 'https://rsc.byu.edu/approaching-holiness/jesus-messiah-prophet-priest-king'
    quote: 'Olive oil, associated with prosperity, wealth, cleansing, healing, and purity, symbolized the Spirit.'
  - where: 'note 16:13 “Anointed in the midst of his brethren”'
    claim: 'After the anointings of Saul and David the Spirit fell on them; anointing symbolized the Lord’s help and support and promised strength, wisdom and justice'
    key: seely-messiah
    url: 'https://rsc.byu.edu/approaching-holiness/jesus-messiah-prophet-priest-king'
    quote: 'The accounts of the anointing of Saul and David record that after the anointing the Spirit of the Lord fell upon them. … The anointing with oil also symbolized the giving of help and support from the Lord (see 1 Samuel 16:13–14).'
  - where: 'note 16:13 “Anointed in the midst of his brethren”'
    claim: 'Scripture Helps: anointing symbolized a change in status; David’s anointing, like Saul’s, was followed by the Spirit; David foreshadowed Christ, the Messiah'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'Like Saul’s anointing previously, David’s anointing was followed by the reception of the Spirit of the Lord.'
  - where: 'note 16:13 “Anointed in the midst of his brethren”'
    claim: 'An anointed one was chosen and commissioned by God to do his work'
    key: wilson-holy-spirit
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/holy-spirit'
    quote: 'An “anointed one” or “messiah/mashiach” meant chosen and commissioned by God to do his work.'
  - where: 'note 16:13 “Anointed in the midst of his brethren”'
    claim: 'The Spirit coming on David may mean he prophesied, but more likely that the Lord gave him the wisdom to lead'
    key: ot-minute-1-samuel-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-16'
    quote: 'may indicate that David began to prophesy as Saul had before him. More likely, it indicates that the Lord had qualified David as the king by giving him the wisdom he would need to become the leader of the Israelites.'
  - where: 'note 16:13 “Anointed in the midst of his brethren”'
    claim: 'One older reading: “in the midst” means in their presence; the brothers seem not to know his destiny afterward, so its meaning was probably concealed, perhaps even from Jesse and David'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/16.htm'
    quote: 'This can only mean “in the presence of his brethren.” As in the subsequent history they do not seem to have any idea of their brother’s high destiny, the true significance of the act appears to have been concealed from them. Whether it was made clear even to Jesse and David himself may be doubted.'

  - where: 'note 16:13 “Anointed in the midst of his brethren”'
    claim: '“Came upon” is the verb explained at 11:6; the Spirit came on David as on Saul at first'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/16.htm'
    quote: 'the spirit of the Lord came upon David] As upon Saul at the first (1 Samuel 10:6). For “came upon” see note on 1 Samuel 11:6.'
  - where: 'note 16:13 “Anointed in the midst of his brethren”'
    claim: 'The verb of 16:13 is the same as at 11:6 (Strong’s 6743)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'וַ/תִּצְלַ֤ח'
  - where: 'section 3 plain'
    claim: 'The “harp” is the lyre'
    key: bdb
    url: 'https://biblehub.com/hebrew/3658.htm'
    quote: 'lyre, stringed instrument used for popular as well as sacred music'
  - where: 'note 16:21 “Saul’s armourbearer”'
    claim: 'David was introduced into the palace and the seat of power he was to succeed to'
    key: ot-seminary-lesson-86
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-86-1-samuel-16?lang=eng'
    quote: 'Hence David was introduced into the palace and the future seat of power he had been ordained to succeed (see 1 Samuel 16:13).'
  - where: 'note 16:14 “An evil spirit, not of the Lord”'
    claim: 'The JST reads “which was not of the Lord” at 16:14 and “not of God” at 16:15, 16, 23; the spirit is not from the Lord'
    key: jst-1-sam-16
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-1-sam/16?lang=eng'
    quote: 'The evil spirit that comes upon Saul is not from the Lord. … But the Spirit of the Lord departed from Saul, and an evil spirit which was not of the Lord troubled him.'
  - where: 'note 16:14 “An evil spirit, not of the Lord”'
    claim: 'Nyman: four verses changed the same way; God does not send evil spirits (Moroni 7:12); 18:10 and 19:9 have the same correction'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'The JST corrects the text to read “an evil spirit which was not of the Lord” or “not of God” (vv. 14, 15–16, 23). God does not send evil spirits. … Chapter 18 (v. 10) and chapter 19 (v. 9) each have the same correction.'
  - where: 'note 16:14 “An evil spirit, not of the Lord”'
    claim: 'Scripture Helps: the JST clarifies the spirit was not from the Lord; Saul may have been influenced by an evil spirit, or experiencing discontent because of his sins'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'The Joseph Smith Translation clarifies the evil spirit that came upon Saul was not from the Lord. While Saul may have been directly influenced by an evil spirit, it is also possible that he was experiencing a spirit of discontent because of his sins.'
  - where: 'note 16:14 “An evil spirit, not of the Lord”'
    claim: 'Student Manual: these are the first effects of Saul’s rejection of the Lord'
    key: ot-manual-1-samuel-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-16-31-king-davids-call-to-lead-israel?lang=eng'
    quote: 'Evil spirits are not sent by God, nor does God give revelations through the evil spirits which sometimes trouble men. … Recorded here are the first effects of Saul’s rejection of the Lord.'
  - where: 'note 16:21 “Saul’s armourbearer”'
    claim: 'An armourbearer was chosen by the king to carry his armor and stand by him in danger'
    key: ot-seminary-lesson-86
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-86-1-samuel-16?lang=eng'
    quote: 'David became Saul’s armor-bearer, which was a person selected by the king to carry his armor and to stand by the king in times of danger.'
  - where: 'note 16:21 “Saul’s armourbearer”'
    claim: 'David’s reputation as musician and “mighty valiant man” would lead to his meeting Goliath'
    key: ot-minute-1-samuel-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-16'
    quote: 'David had gained a reputation as a musician but also as a “mighty valiant man” (verse 18). … David’s reputation would eventually lead to his confrontation with the Philistine champion Goliath.'
  - where: 'note 16:21 “Saul’s armourbearer”'
    claim: 'The Bible Dictionary: the writer combined two accounts and did not always reconcile them, comparing 16:14–23 and 17:1–18:5'
    key: bd-samuel-books
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel-books-of?lang=eng'
    quote: 'In some cases he has combined together two different accounts of the same event and has not always been careful to reconcile the two'

  - where: 'note 16:23 “David’s lyre”'
    claim: 'The “harp” (kinnor) is the lyre, a stringed instrument for popular and sacred music'
    key: bdb
    url: 'https://biblehub.com/hebrew/3658.htm'
    quote: 'lyre, stringed instrument used for popular as well as sacred music'
  - where: 'note 16:23 “David’s lyre”'
    claim: 'David’s skill is implied by the many psalms attributed to him; some may already have been composed'
    key: ot-minute-1-samuel-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-16'
    quote: 'David’s skill with music is implied with the many psalms that are attributed to him. We may infer that some of his psalms, such as Psalm 23 (alluding to David’s understanding of shepherding), were already composed by this time.'
  - where: 'note 16:23 “David’s lyre”'
    claim: 'The music may have eased Saul for a time; lasting peace only by repenting'
    key: ot-seminary-lesson-86
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-86-1-samuel-16?lang=eng'
    quote: 'Point out that although Saul may have temporarily felt better by listening to spiritually uplifting music, the only way Saul could have found lasting peace was by repenting.'

  - where: christ
    claim: 'David, an anointed one, foreshadowed Jesus Christ, whose title Messiah means “anointed one”'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'In this way, David foreshadowed his future descendant, Jesus Christ, whose title of Messiah means “anointed one.”'
  - where: christ
    claim: 'Like David, Jesus Christ was born in Bethlehem'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'Like David, Jesus Christ was born in Bethlehem (see 1 Samuel 16:1; Luke 2:4–7).'
  - where: christ
    claim: 'Jesus as the Good Shepherd fulfills the expectation of a shepherd king'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'When Jesus comes as the Good Shepherd, he fulfills this messianic expectation of a king who feeds and cares for his people (see John 10).'
  - where: christ
    claim: 'President Uchtdorf: Heavenly Father’s interest does not depend on looks; He looks on your heart and loves you as His child'
    key: uchtdorf-wonderful-journey-2013
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2013/04/your-wonderful-journey-home?lang=eng'
    quote: 'Heavenly Father’s interest in you does not depend on how rich or beautiful or healthy or smart you are. He sees you not as the world sees you; He sees who you really are. He looks on your heart. And He loves you because you are His child.'
