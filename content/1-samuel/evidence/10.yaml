chapter: 10
claims:
  - where: setting
    claim: 'Saul was anointed privately, received the Spirit, and was later proclaimed king publicly'
    key: ot-seminary-lesson-84
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-84-1-samuel-9-11?lang=eng'
    quote: 'Samuel anointed Saul as the earthly leader of Israel, the Spirit of the Lord came upon Saul, and he was later publicly proclaimed as the king of Israel.'
  - where: setting
    claim: 'Gibeah was Saul''s home; the garrison was a Philistine military post holding Israel down'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/10.htm'
    quote: 'the garrison of the Philistines] A military post established by the Philistines to maintain their hold upon the Israelites.'
  - where: setting
    claim: 'Gibeah was Saul''s home'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/10.htm'
    quote: '11. all that knew him beforetime] An indication that Gibeah was Saul’s home.'
  - where: setting
    claim: 'Mizpeh chosen because there Samuel had won a victory over the Philistines by prayer'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/10.htm'
    quote: 'Samuel selected Mizpeh for this purpose, because it was there that he had once before obtained for the people, by prayer, a great victory over the Philistines (1 Samuel 7:5.).'
  - where: thread
    claim: 'The signs confirmed the consecration made by the anointing and pledged God''s help'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/10.htm'
    quote: 'To confirm the consecration of Saul as king over Israel, which had been effected through the anointing, Samuel gave him three more signs which would occur on his journey home, and would be a pledge to him that Jehovah would accompany his undertakings with His divine help'
  - where: thread
    claim: 'Before the lot Samuel again charged the people with rejecting the God who brought them out of Egypt'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/10.htm'
    quote: 'But before proceeding to the election itself, Samuel once more charged the people with their sin in rejecting God, who had brought them out of Egypt'
  - where: 'section 1 plain'
    claim: '"Is it not because the LORD" means "Surely the LORD"'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/10.htm'
    quote: 'Is it not because the Lord] Lit., “Is it not the case that Jehovah” = Surely Jehovah, &c.'
  - where: 'section 1 plain'
    claim: '"As occasion serve thee" means whatever the occasion demands'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/10?lang=eng'
    quote: '“as occasion serve thee”: IE whatever occasion demands.'
  - where: 'section 3 plain'
    claim: 'Taken = chosen by lot'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/10.htm'
    quote: '"and there was taken (by lot) the tribe of Benjamin."'
  - where: 'section 3 plain'
    claim: 'The question to the LORD was whether anyone else had come'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/10.htm'
    quote: 'Then they inquired of Jehovah, "Is any one else come hither?" and Jehovah replied, "Behold, he (whom ye are seeking) is hidden among the things."'
  - where: 'section 3 plain'
    claim: 'The stuff = baggage; "God save the king" = "Let the king live"; manner of the kingdom = charter; valiant men; worthless fellows'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/10.htm'
    quote: 'the stuff] The baggage of the people who had come to Mizpah from a distance.'
  - where: 'section 3 plain'
    claim: '"Held his peace" means ignored them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/10?lang=eng'
    quote: '“held his peace”: IE ignored them.'
  - where: 'note 10:1 “Oil and a kiss”'
    claim: 'Before Saul only priests and the sanctuary were anointed; anointing the king made the monarchy a divine institution through which the Lord gave the gifts of His Spirit; oil symbolized the Spirit'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'Hitherto there had been no other anointing among the people of God than that of the priests and sanctuary … When Saul, therefore, was consecrated as king by anointing, the monarchy was inaugurated as a divine institution, … through which henceforth the Lord would also bestow upon His people the gifts of His Spirit'
  - where: 'note 10:1 “Oil and a kiss”'
    claim: 'With Saul the anointing became the sign that the call was divine'
    key: wilson-holy-spirit
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/holy-spirit'
    quote: 'Beginning with King Saul, the anointing became the sign that the call was divine'
  - where: 'note 10:1 “Oil and a kiss”'
    claim: 'One older reading: the kiss was homage (cp. Ps. 2:12); anointing made the king sacred'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/10.htm'
    quote: 'and kissed him] In token of reverence and homage to his royal dignity. Cp. Psalm 2:12. … (b) was the outward sign of the gift of the Spirit to qualify him for his office … (c) marked his person as sacred and inviolable (ch. 1 Samuel 26:9; 2 Samuel 1:14).'
  - where: 'note 10:1 “Captain over the LORD’s inheritance”'
    claim: 'nagid means leader, literally probably one in front, ruler, prince; used of Saul at 9:16'
    key: bdb
    url: 'https://biblehub.com/hebrew/5057.htm'
    quote: 'נָגִיד noun masculine leader (literally probably one in front), ruler, prince … 1 of king of Israel: of Saul עַל ׳מָשַׁח לְנ (+ accusative of person), 1 Samuel 9:16 (subject prophet)'
  - where: 'note 10:1 “Captain over the LORD’s inheritance”'
    claim: 'The title captain should have reminded that the Lord was still king'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'But Samuel anointed Saul to be “captain” even though he was later called king (see 1 Samuel 10:1). This title should have served as a reminder that the Lord was still king.'
  - where: 'note 10:1 “Captain over the LORD’s inheritance”'
    claim: 'The Septuagint reads a longer verse 1'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/10.htm'
    quote: 'Has not the Lord anointed thee for a ruler over his people, over Israel? and thou shalt rule among the people of the Lord, and thou shalt save them out of the hand of their enemies; and this shall be the sign to thee that the Lord has anointed thee for a ruler over his inheritance.'
  - where: 'note 10:5 “A company of prophets”'
    claim: 'Companies of prophets may have been righteous people joining to strengthen each other in times of apostasy'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'These groups may have consisted of righteous individuals who joined together during times of Israelite apostasy to strengthen and uplift each other.'
  - where: 'note 10:5 “A company of prophets”'
    claim: 'Such groups were sometimes called the sons of the prophets'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'See 1 Samuel 10:5; 19:20. Sometimes such groups were called “the sons of the prophets” (see 2 Kings 2:3–7, 15; 4:38'
  - where: 'note 10:5 “A company of prophets”'
    claim: 'First time a company of prophets is mentioned; seventy elders had prophesied, but no community of prophets until Samuel; Samuel their leader (19:19-20)'
    key: ot-minute-1-samuel-9-10
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-9-10'
    quote: 'This is the first time that a company (“band” or “cord”) of prophets (Hebrew nevi‘im) is mentioned in the Bible. … But until the time of Samuel, there was no community of prophets.'
  - where: 'note 10:5 “A company of prophets”'
    claim: 'Samuel was their leader'
    key: ot-minute-1-samuel-9-10
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-9-10'
    quote: 'Samuel was associated with this group, and a later chapter indicates that he was their leader (see 1 Samuel 19:19–20).'
  - where: 'note 10:5 “A company of prophets”'
    claim: 'Prophesying here is not prediction but inspired religious expression in hymns; 1 Chr 25:1-3; instruments; 2 Kgs 3:15'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/10.htm'
    quote: 'The word has nothing to do with prediction here, but denotes the expression of religious feeling under the influence of inspiration in hymns and otherwise. … In 1 Chronicles 25:1-3 the word is used of chanting psalms and set services. Such a procession of prophets was naturally accompanied by musical instruments. Cp. Exodus 15:20; 1 Chronicles 13:8; 2 Kings 3:15.'
  - where: 'note 10:5 “A company of prophets”'
    claim: 'The instruments: psaltery and harp stringed, tabret a tambourine, pipe a flute'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/10.htm'
    quote: 'The psaltery (Heb. nebel) and harp (Heb. kinnôr) were stringed instruments, the exact form of which is unknown: the tabret or timbrel (Heb. tôph) was a tambourine or hand drum: the pipe (Heb. châlîl) a kind of flute.'
  - where: 'note 10:9 “Another heart”'
    claim: 'President Kimball on the change in Saul at his setting apart'
    key: ot-seminary-lesson-84
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-84-1-samuel-9-11?lang=eng'
    quote: '“A positive change came over Saul. The setting apart turned him into another man and gave him another heart. New powers came to him at once. Those who knew him were astounded at his increased spirituality, his newly acquired wisdom and judgment and his newly attained maturity and powers'
  - where: 'note 10:9 “Another heart”'
    claim: 'Kimball asks who has not watched the transformation of a newly set apart person'
    key: ot-seminary-lesson-84
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-84-1-samuel-9-11?lang=eng'
    quote: '“Who has not watched the transformation of a newly set apart person to high responsibility? Who has not seen men already great rise to new plateaus of superior attainment braced with the authority, the keys, the mantle?” (in Conference Report, Oct. 1958, 55).'
  - where: 'note 10:9 “Another heart”'
    claim: 'In his early years Saul was humble; the Lord gave him the spirit of prophecy and a new heart'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'In these early years, he was humble and exemplary, leading the people to know God’s superior will and power, willing to ask the prophet Samuel for counsel. And the Lord approved of Saul and gave him the spirit of prophecy and a new heart.'
  - where: 'note 10:9 “Another heart”'
    claim: 'Scripture Helps sets 10:9 beside 13:14: by Gilgal Saul''s heart was not in line with the Lord''s will as it had once been'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'This act demonstrated that Saul’s heart was not in line with the Lord’s will as it had once been.'
  - where: 'note 10:9 “Another heart”'
    claim: 'Endnote: compare 10:9 with 13:14'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'Compare 1 Samuel 10:9 with 13:14.'
  - where: 'note 10:12 “Who is their father?”'
    claim: 'The people''s surprise assumed Saul''s former life was unlike the prophets'' disciples'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/10.htm'
    quote: 'This expression presupposes that Saul''s previous life was altogether different from that of the disciples of the prophets.'
  - where: 'note 10:12 “Who is their father?”'
    claim: '"Who is their father?" asks whether the prophets had the gift by birth; since it was a free gift of the Lord, he could give it to Saul; the proverb expressed astonishment at a man in a sphere strange to him'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/10.htm'
    quote: 'not "who is their president?" which would be a very gratuitous question; but, "is their father a prophet then?" … If those prophets had not obtained the gift of prophecy by inheritance, but as a free gift of the Lord, it was equally possible for the Lord to communicate the same gift to Saul.'
  - where: 'note 10:12 “Who is their father?”'
    claim: 'The proverb''s sense'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/10.htm'
    quote: 'a proverb which was used to express astonishment at the appearance of any man in a sphere of life which had hitherto been altogether strange to him.'
  - where: 'note 10:12 “Who is their father?”'
    claim: 'Prophetic inspiration comes from God and may be given the son of Kish; see Amos 7:14-15'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/10.htm'
    quote: 'Was the parentage of these prophets such as to lead us to expect them to be thus specially gifted? The prophetic inspiration comes from God, and may therefore be bestowed even upon the son of Kish. See Amos 7:14-15.'
  - where: 'note 10:20 “Chosen by lot”'
    claim: '"Taken" means taken by lot, snatched out by Jehovah; see Josh 7:14, 16; the procedure by tribes, families, households'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/10.htm'
    quote: 'הלּכד, lit. to be snatched out by Jehovah, namely, through the lot (see Joshua 7:14, Joshua 7:16).'
  - where: 'note 10:20 “Chosen by lot”'
    claim: 'The lot was a divine decision: accrediting Saul before the nation and assuring him'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/10.htm'
    quote: 'After Samuel had secretly anointed Saul king by the command of God, it was his duty to make provision for a recognition of the man whom God had chosen on the part of the people also.'
  - where: 'note 10:20 “Chosen by lot”'
    claim: 'Josh 7: the tribe the LORD takes comes by families, households, men'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/7?lang=eng'
    quote: 'the tribe which the LORD taketh shall come according to the families thereof; and the family which the LORD shall take shall come by households; and the household which the LORD shall take shall come man by man.'
  - where: 'note 10:22 “Hidden among the baggage”'
    claim: 'The stuff is travelling baggage; Saul could not have hoped to avoid the lot; he hid from humility and modesty'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/10.htm'
    quote: 'Saul could neither have wished to avoid accepting the monarchy, nor have imagined that the lot would not fall upon him if he hid himself. For he knew that God had chosen him; and Samuel had anointed him already. He did it therefore simply from humility and modesty.'
  - where: 'note 10:22 “Hidden among the baggage”'
    claim: 'Inquiry was made through the high priest by Urim and Thummim'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/10.htm'
    quote: 'The inquiry was made through the high priest, by means of the Urim and Thummim, for which בּיהוה שׁאל was the technical expression, according to Numbers 27:21'
  - where: 'note 10:22 “Hidden among the baggage”'
    claim: 'Inquired of the LORD = the technical phrase for the Urim and Thummim; the stuff = baggage'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/10.htm'
    quote: '22. they inquired of the Lord further] The technical phrase for ascertaining God’s will by means of the Urim and Thummim in the breastplate upon the High-priest’s Ephod'
  - where: 'note 10:25 “A charter laid up before the LORD”'
    claim: 'The right of the monarchy is not the right of the king of 8:11; it set the duties and rights of the king toward Jehovah and the nation; only a prophet could lay it down; placed in the tabernacle'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/10.htm'
    quote: '"The right of the monarchy" (meluchah) is not to be identified with the right of the king (melech), which is described in 1 Samuel 8:11 … but it is the right which regulated the attitude of the earthly monarchy in the theocracy, and determined the duties and rights of the human king in relation to Jehovah the divine King on the one hand, and to the nation on the other.'
  - where: 'note 10:25 “A charter laid up before the LORD”'
    claim: 'Only a prophet could lay it down; it was placed in the tabernacle'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/10.htm'
    quote: 'This right could only be laid down by a prophet like Samuel, to raise a wholesome barrier at the very outset against all excesses on the part of the king. … It was no doubt placed in the tabernacle, where the law of Moses was also deposited'
  - where: 'note 10:25 “A charter laid up before the LORD”'
    claim: 'A charter; probably resembled the law of the king in Deut 17:14-20; possibly added to the book of the law by the ark'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/10.htm'
    quote: 'A charter establishing and defining the position of the king in relation to Jehovah, and to the people. … In substance at any rate, it probably resembled the law of the king in Deuteronomy 17:14-20. … Possibly this important charter was added to “the book of the law” kept by the side of the ark “before the Lord” (Deuteronomy 31:26).'
  - where: 'note 10:25 “A charter laid up before the LORD”'
    claim: 'Elder McConkie lists a Book of Statutes (1 Sam. 10:25) among books not now available'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: '“Reference is made in both the Old and New Testaments to books and epistles which are not now available. These include: … A Book of Statutes (1 Sam. 10:25)'
  - where: 'note 10:25 “A charter laid up before the LORD”'
    claim: 'The Bible Dictionary counts writings by Samuel (1 Sam 10:25) among the sources of the books'
    key: bd-samuel-books
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel-books-of?lang=eng'
    quote: 'In order to compile his narrative he no doubt used various writings that he found already in existence, including the state chronicles (among which were writings by Samuel, Nathan, and Gad, 1 Sam. 10:25; 1 Chr. 29:29).'
  - where: 'note 10:27 “No presents”'
    claim: 'Children of Belial = worthless people; a present was expected on entering the king''s presence; refusing it was almost rebellion; Saul acted as if deaf'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/10.htm'
    quote: 'Minchah: the present which from time immemorial every one has been expected to bring when entering the presence of the king; so that the refusal to bring a present was almost equivalent to rebellion. But Saul was "as being deaf," i.e., he acted as if he had not heard.'
  - where: 'note 10:27 “No presents”'
    claim: 'Refusal of the customary homage was a contemptuous rejection of his authority'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/10.htm'
    quote: 'The refusal of the customary offerings of homage was tantamount to a deliberate and contemptuous rejection of his authority.'
  - where: 'note 10:27 “No presents”'
    claim: 'The footnote at "save" points to 11:12; "held his peace" means ignored them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/10?lang=eng'
    quote: '“save”: 1 Sam. 11:12 (8–15).'
  - where: 'note 10:27 “No presents”'
    claim: 'A Dead Sea Scrolls version of 1 Samuel has an extra verse at the end of chapter 10'
    key: sc-knowhy-855
    url: 'https://scripturecentral.org/knowhy/why-did-the-ammonite-king-require-the-right-eyes-of-the-people-of-jabesh-gilead-be-gouged-out-1'
    quote: 'A version of 1 Samuel found in the Dead Sea Scrolls contains an extra verse at the end of 1 Samuel 10:'
  - where: christ
    claim: 'Anointing pointed to the Savior; prophets, priests, kings anointed in symbolic reference to Christ, the Anointed One'
    key: ot-seminary-lesson-84
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-84-1-samuel-9-11?lang=eng'
    quote: 'As the Messiah or Christ, Jesus, the premortal Jehovah, is the Anointed One. Three groups of people were anointed in Old Testament times to fulfill their roles in society—prophets, priests, and kings—all in symbolic reference to the Great Prophet, Priest, and King, Jesus Christ.'
  - where: christ
    claim: 'Samuel anointed Saul as the first ruler of Israel; messiah means anointed one'
    key: sc-knowhy-576
    url: 'https://scripturecentral.org/knowhy/how-are-samuel-the-lamanite-and-the-biblical-prophet-samuel-similar'
    quote: 'Through revelation from the Lord, Samuel anointed Saul as the first ruler of Israel (1 Samuel 10:1). … In that fateful act, Samuel established a future messiah, since “messiah” means “anointed one” in Hebrew.'
  - where: christ
    claim: 'Anointing as the outward sign of the gift of the Spirit, cp. Acts 10:38'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/10.htm'
    quote: '(b) was the outward sign of the gift of the Spirit to qualify him for his office (1 Samuel 10:9-10, 1 Samuel 16:13, cp. Acts 10:38)'
  - where: christ
    claim: 'Kimball: a setting apart brings new powers'
    key: ot-seminary-lesson-84
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-84-1-samuel-9-11?lang=eng'
    quote: 'The setting apart turned him into another man and gave him another heart. New powers came to him at once.'
  - where: christ
    claim: 'Saul''s heart later not in line with the Lord''s will as it had once been'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'This act demonstrated that Saul’s heart was not in line with the Lord’s will as it had once been.'
  - where: 'note 10:1 “Oil and a kiss”'
    claim: 'Another older reading: the kiss was one of affection rather than homage'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/10.htm'
    quote: 'Kissing was probably not a sign of homage or reverence towards the anointed of the Lord, so much as "a kiss of affection, with which the grace of God itself was sealed" (Seb. Schmidt).'
