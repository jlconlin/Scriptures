chapter: 18
claims:
  - where: setting
    claim: 'The Bible Dictionary says the writer combined two accounts of David''s introduction to Saul, 16:14–23 and 17:1–18:5'
    key: bd-samuel-books
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel-books-of?lang=eng'
    quote: 'In some cases he has combined together two different accounts of the same event and has not always been careful to reconcile the two together (compare the two accounts of David’s introduction to Saul, 1 Sam. 16:14–23 and 17:1–18:5).'
  - where: setting
    claim: 'The Church footnotes to 18:6 point to Judg. 11:34 and Ex. 15:20–21; to 18:7, to 1 Sam. 29:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/18?lang=eng'
    quote: '“instruments”: Ex. 15:20 (20–21).'
  - where: setting
    claim: 'The Church footnote to “women” in 18:6 points to Judg. 11:34'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/18?lang=eng'
    quote: '“women”: Judg. 11:34.'

  - where: thread
    claim: 'Saul, seeking to destroy David, only heightened his popularity; pride, fear, jealousy and anger'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'It is ironic that Saul, seeking to destroy David, only heightened David’s popularity and strengthened David’s position. … allowed himself through pride and fear, jealousy and anger, to lose control and compel his own destruction'
  - where: thread
    claim: 'All seem to love David, including the king''s children Michal and Jonathan'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'All seem to love and praise him, including the king’s children: Michal, who will become the bride of David’s youth, and Jonathan, whose friendship is characterized by exquisite loyalty and self-sacrifice (chap. 18).'

  - where: 'section 3 plain'
    claim: 'The Joseph Smith Translation of 18:10 reads that the evil spirit was not of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/18?lang=eng'
    quote: '10a “from God”: JST 1 Sam. 18:10 … which was not of God …'
  - where: 'section 3 plain'
    claim: 'The verb of 18:5, 14, 15 means to prosper or have success as well as to act wisely'
    key: bdb
    url: 'https://biblehub.com/hebrew/7919.htm'
    quote: '6 prosper, have success (compare Dr 1 Samuel 18:5): absolute 1 Samuel 18:15; … with ב, Joshua 1:7 (D) 1 Samuel 18:5,14'
  - where: 'section 5 plain'
    claim: 'The footnotes gloss “in the one of the twain” as by one of my two daughters, and “light thing” as insignificant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/18?lang=eng'
    quote: '21a “in”: IE by one of my two daughters. … 23a “light thing”: IE insignificant.'
  - where: 'section 6 plain'
    claim: 'The footnotes gloss “full tale” as full number and “set by” as adored'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/18?lang=eng'
    quote: '27a “full tale”: IE full number. … 30a “set by”: OR adored.'

  - where: 'note 18:1 “Knit with the soul of David”'
    claim: '“Knit” is qashar in the Niphal: the life of Jonathan was bound up with the life of David'
    key: bdb
    url: 'https://biblehub.com/hebrew/7194.htm'
    quote: 'Niph`al Perfect3feminine singular נִקְשְׁרָה 1 Samuel 18:1 the life of Jonathan was bound up with the life of David'
  - where: 'note 18:1 “Knit with the soul of David”'
    claim: 'The footnote to “knit” points to Gen. 44:30'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/18?lang=eng'
    quote: '1a “knit”: Gen. 44:30; 1 Sam. 20:4 (4, 41); Mosiah 4:15; 18:21; D&C 88:123. TG Friendship.'
  - where: 'note 18:1 “Knit with the soul of David”'
    claim: 'Jonathan, but for David, could have assumed he would be the next king'
    key: cfm-ot-2026-25
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/25?lang=eng'
    quote: 'consider contrasting Saul and his son Jonathan (who, if not for David, could have assumed he would be the next king). How did Saul and Jonathan react to David’s success?'
  - where: 'note 18:1 “Knit with the soul of David”'
    claim: 'Jonathan a valiant soldier and worthy prince; David, not he, would succeed Saul'
    key: holland-real-friendship
    url: 'https://www.churchofjesuschrist.org/study/new-era/1998/06/real-friendship?lang=eng'
    quote: 'Jonathan, the son of King Saul, was a valiant soldier in his own right and a worthy young prince in Israel. … it was he, not Jonathan, who would be successor to the increasingly disobedient Saul.'
  - where: 'note 18:1 “Knit with the soul of David”'
    claim: 'Elder Holland: to a lesser man David would have been a rival'
    key: holland-real-friendship
    url: 'https://www.churchofjesuschrist.org/study/new-era/1998/06/real-friendship?lang=eng'
    quote: 'To a lesser man—or a lesser friend—than Jonathan, David would have been a terrible threat, a natural rival. But he wasn’t.'

  - where: 'note 18:3 “What the covenant was”'
    claim: '“Knit” indicated a lasting friendship cemented by a covenant'
    key: ot-minute-1-samuel-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-18'
    quote: 'The phrase “knit with the soul of David” (verse 1) indicated a lasting friendship cemented by a covenant.'
  - where: 'note 18:3 “What the covenant was”'
    claim: 'David shows hesed to Jonathan, who says David will be king (23:17; 20:8, 14–15)'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'He shows ḥesed to Jonathan, who asserts, “Fear not: . . . thou shalt be king over Israel” (23:17; see 20:8, 14–15; 23:17–18).'
  - where: 'note 18:3 “What the covenant was”'
    claim: 'In 2 Samuel 9 David shows hesed to Mephibosheth for Jonathan''s sake'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'The word ḥesed appears three times in this chapter as David assures Mephibosheth, “Fear not: for I will surely shew thee kindness [ḥesed] for Jonathan thy father’s sake” (2 Samuel 9:7; see vv. 1, 3).'
  - where: 'note 18:3 “What the covenant was”'
    claim: 'The David–Jonathan covenant of 18:1–3 is a covenant of kinship whose benefits reach descendants'
    key: matson-amos-kinship
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/covenants-kinship-caring-destitute-book-amos'
    quote: 'It should be noted that the posterity of Jacob and Esau are not the only descendants in the Old Testament who receive the benefits of a covenant of kinship; see the covenant made between David and Jonathan in 1 Samuel 18:1–3'
  - where: 'note 18:3 “What the covenant was”'
    claim: 'The footnote to “covenant” points to 2 Sam. 9:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/18?lang=eng'
    quote: '3a “covenant”: 2 Sam. 9:1.'

  - where: 'note 18:4 “The prince''s robe and sword”'
    claim: 'The gifts showed Jonathan''s friendship and support of David becoming the next king'
    key: scripture-helps-1-samuel-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/23-1-samuel-17-18-24-26-2-samuel-5-7?lang=eng'
    quote: 'By giving his clothing and weapons to David, Jonathan showed his friendship and his support of David becoming the next king.'
  - where: 'note 18:4 “The prince''s robe and sword”'
    claim: 'Elder Holland: a symbolic token of devotion to the newly anointed king; the princely robe'
    key: holland-real-friendship
    url: 'https://www.churchofjesuschrist.org/study/new-era/1998/06/real-friendship?lang=eng'
    quote: 'As a symbolic token of his devotion to the newly anointed king, Jonathan stripped himself of the princely robe he wore'
  - where: 'note 18:4 “The prince''s robe and sword”'
    claim: 'The gifts were a pledge that cemented the covenant, a ritual ratification'
    key: hopkin-covenant
    url: 'https://rsc.byu.edu/creation-sinai/covenant-among-covenants'
    quote: 'one or both parties often made pledges or oaths that served as a physical confirmation or ratification of the covenant. Jonathan gave David his armor, weaponry, and pieces of clothing to cement their covenant relationship (1 Samuel 18:4).'

  - where: 'note 18:7 “Thousands and ten thousands”'
    claim: 'President Benson: Saul became an enemy to David through pride, jealous of the song'
    key: benson-pride
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1989/04/beware-of-pride?lang=eng'
    quote: 'Saul became an enemy to David through pride. He was jealous because the crowds of Israelite women were singing that “Saul hath slain his thousands, and David his ten thousands.” (1 Sam. 18:7; see also 18:6, 8.)'
  - where: 'note 18:7 “Thousands and ten thousands”'
    claim: 'Pride is essentially competitive; enmity toward fellowmen elevates self and diminishes others'
    key: benson-pride
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1989/04/beware-of-pride?lang=eng'
    quote: 'Pride is essentially competitive in nature. We pit our will against God’s. … We are tempted daily to elevate ourselves above others and diminish them.'
  - where: 'note 18:7 “Thousands and ten thousands”'
    claim: 'Though Samuel had told Saul he would lose the kingdom, his pride remained and he blamed David instead of praising the Lord'
    key: ot-minute-1-samuel-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-18'
    quote: 'Even though the prophet Samuel had told Saul that the Lord had rejected him and that he would lose his kingdom, his pride remained, and he blamed David. Instead of praising the Lord for the victory, as David had done'

  - where: 'note 18:10 “He prophesied in the house”'
    claim: 'BDB lists 18:10 under prophesying in the ecstatic state, excited to violence, equal to “mad”; 10:5–13 is the same state with music'
    key: bdb
    url: 'https://biblehub.com/hebrew/5012.htm'
    quote: 'a. in the ecstatic state Numbers 11:25,26,27 (J), with music 1 Samuel 10:5,6,10,13, in frenzy 1 Samuel 19:20,21 (twice in verse); 1 Samuel 19:23,24; excited to violence 1 Samuel 18:10 (= מְשֻׁגָּע mad 2 Kings 9:11)'
  - where: 'note 18:10 “He prophesied in the house”'
    claim: 'The JST footnote at 18:10: the spirit was not of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/18?lang=eng'
    quote: '10a “from God”: JST 1 Sam. 18:10 … which was not of God …'

  - where: 'note 18:14 “Behaved himself wisely”'
    claim: 'sakal at 18:5, 14, 15 means prosper, have success; at 18:30, be prudent'
    key: bdb
    url: 'https://biblehub.com/hebrew/7919.htm'
    quote: '6 prosper, have success (compare Dr 1 Samuel 18:5): absolute 1 Samuel 18:15; … with ב, Joshua 1:7 (D) 1 Samuel 18:5,14'
  - where: 'note 18:14 “Behaved himself wisely”'
    claim: 'At 18:30 BDB gives be prudent, circumspect'
    key: bdb
    url: 'https://biblehub.com/hebrew/7919.htm'
    quote: 'Qal Perfect3masculine singular ׳שׂ 1 Samuel 18:30 be prudent, circumspect'
  - where: 'note 18:14 “Behaved himself wisely”'
    claim: 'Verse 14 is the crux of the narrative; wisdom and the Spirit the goal of covenant people'
    key: ot-minute-1-samuel-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-18'
    quote: 'This description of David is the crux of the narrative. To behave wisely and to have the Spirit of the Lord should be the goal of all the Lord’s covenant people.'

  - where: 'note 18:14 “Behaved himself wisely”'
    claim: 'At 18:30 BDB notes that others read prosper'
    key: bdb
    url: 'https://biblehub.com/hebrew/7919.htm'
    quote: 'Kit Buhl Gerber and others prosper'
  - where: 'note 18:17 “Saul''s offer of Merab”'
    claim: 'Saul had promised a daughter to Goliath''s conqueror (17:25); he called the wars the LORD''s to conceal his design; one older reading'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/18.htm'
    quote: 'As Saul had promised to give his daughter for a wife to the conqueror of Goliath (1 Samuel 17:25), he felt obliged, by the growing love and attachment of the people to David, to fulfil this promise … to conceal his own cunning design'
  - where: 'note 18:17 “Saul''s offer of Merab”'
    claim: 'The pretext for giving Merab to Adriel is not given'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/18.htm'
    quote: 'The pretext under which Saul broke his promise is not given'

  - where: 'note 18:20 “Michal loved David”'
    claim: 'Michal loved David, so the marriage was not merely political; as son-in-law David had a legitimate claim to the throne'
    key: ot-minute-1-samuel-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-18'
    quote: 'The text notes that Michal loved David, so David’s marriage was not a mere political marriage. David became Saul’s son-in-law and so had a legitimate claim to the throne'
  - where: 'note 18:20 “Michal loved David”'
    claim: 'Michal was Saul''s second daughter; her story runs from 18:20 through 2 Sam. 6'
    key: bd-michal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/michal?lang=eng'
    quote: 'Saul’s second daughter, wife of David (1 Sam. 14:49; 18:20, 27; 19:11–13, 17; 25:44; 2 Sam. 3:13–16; 6:16, 23).'

  - where: 'note 18:25 “A hundred foreskins”'
    claim: 'The word “dowry” is mohar, used also in Gen. 34:12 and Ex. 22:16'
    key: bdb
    url: 'https://biblehub.com/hebrew/4119.htm'
    quote: 'absolute ׳מ Genesis 34:12 (J; "" מַתָּן) 1 Samuel 18:25; construct מֹהַר הַבְּתוּלֹת Exodus 22:16 (E).'
  - where: 'note 18:25 “A hundred foreskins”'
    claim: 'A poor man could not pay the price usually paid by the suitor to the bride''s father in money or service; one older reading'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/18.htm'
    quote: 'a poor man] And therefore unable to offer the “dowry,” or price such as it was usual for the suitor to pay to the father of the bride, either in money (Genesis 34:12) or in service (Genesis 29:20).'
  - where: 'note 18:25 “A hundred foreskins”'
    claim: 'The foreskins proved the number slain and that they were uncircumcised; Saul meant the Philistines to kill David and to appear blameless'
    key: ot-minute-1-samuel-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-18'
    quote: 'This would prove the numbers of slain enemies as well as determine that they were uncircumcised.'
  - where: 'note 18:25 “A hundred foreskins”'
    claim: 'Saul meant the Philistines to kill David, which would let him appear blameless'
    key: ot-minute-1-samuel-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-18'
    quote: 'Saul meant for the Philistines to kill David, which would allow Saul to appear blameless to the people of Israel.'
  - where: 'note 18:25 “A hundred foreskins”'
    claim: 'David slew double the number; the Septuagint reads one hundred; compare 2 Sam. 3:14'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/18.htm'
    quote: '27. two hundred men] He slew double the stipulated number of Philistines. The Sept. however reads “one hundred.” Cp. 2 Samuel 3:14.'

  - where: 'note 18:25 “A hundred foreskins”'
    claim: 'In the Septuagint David kills a hundred men (verse 27)'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/18.htm'
    quote: 'smote among the Philistines a hundred men'
  - where: christ
    claim: 'The study guide contrasts how Saul and Jonathan, who but for David could have expected to be king, reacted to David''s success'
    key: cfm-ot-2026-25
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/25?lang=eng'
    quote: 'consider contrasting Saul and his son Jonathan (who, if not for David, could have assumed he would be the next king). How did Saul and Jonathan react to David’s success?'
  - where: christ
    claim: 'Elder Holland: weak bonds do not hold against a wicked person such as David and Jonathan faced; gospel principles and covenants led to strong ties'
    key: holland-real-friendship
    url: 'https://www.churchofjesuschrist.org/study/new-era/1998/06/real-friendship?lang=eng'
    quote: 'Weak bonds and less spiritual relationships will not hold up when confronted by a wicked person such as David and Jonathan faced … In each case it was gospel principles, commitments, associations, and covenants that led to the strong ties and triumphant friendship'
  - where: christ
    claim: 'President Benson: the antidote for pride is humility'
    key: benson-pride
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1989/04/beware-of-pride?lang=eng'
    quote: 'The antidote for pride is humility—meekness, submissiveness. (See Alma 7:23.) It is the broken heart and contrite spirit.'

  - where: explore
    claim: 'Elder Holland''s article follows the friendship through chapters 19, 20, 23 and 2 Samuel 1'
    key: holland-real-friendship
    url: 'https://www.churchofjesuschrist.org/study/new-era/1998/06/real-friendship?lang=eng'
    quote: 'And always they renewed their covenant of friendship and loyalty (see 1 Sam. 23:18).'
