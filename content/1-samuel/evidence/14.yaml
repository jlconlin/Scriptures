chapter: 14
claims:
  - where: when
    claim: 'The war at Michmash is set when Saul had reigned two years (13:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/13?lang=eng'
    quote: 'when he had reigned two years over Israel'
  - where: setting
    claim: 'Jonathan struck the garrison at Geba; Israel hid; Saul left with about six hundred; no sword but with Saul and Jonathan; the garrison went out to the passage of Michmash (13:3–23)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/13?lang=eng'
    quote: 'And Saul numbered the people that were present with him, about six hundred men. … And the garrison of the Philistines went out to the passage of Michmash.'
  - where: setting
    claim: 'Jonathan and Saul led Israel to victory against the Philistines'
    key: ot-seminary-lesson-85
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-85-1-samuel-12-15?lang=eng'
    quote: 'Jonathan and Saul led the Israelites to victory in battle against the Philistines.'
  - where: setting
    claim: 'Saul''s oath (14:24–45) is listed among the main events of his reign'
    key: bd-saul
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/saul?lang=eng'
    quote: 'offers sacrifice (13:9); his oath (14:24–45); war against Amalekites (15:1–9)'
  - where: thread
    claim: 'Jonathan was a young man of great faith; his venture was based on faith and courage'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'These verses give insights into the character of Jonathan, son of Saul, a young man of great faith in God (see vv. 6, 10). The venture into the Philistine camp was not foolhardy but was based on faith and courage.'
  - where: thread
    claim: 'Saul''s fast was a misguided effort to get help from the Lord'
    key: ot-seminary-lesson-85
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-85-1-samuel-12-15?lang=eng'
    quote: 'Saul demanded a fast and forbade his soldiers from eating in a misguided effort to get help from the Lord and prevail over his enemies.'
  - where: section 2 plain
    claim: 'The trembling of verse 15 is a trembling of terror ascribed to God (rendered “a trembling from God”)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2731.htm'
    quote: '1 trembling, quaking (of terror ascribed to supernatural cause) 1 Samuel 14:15 (twice in verse) (hence אלהים ׳ח see Dr'
  - where: section 4 plain
    claim: '“His eyes were enlightened” means he was refreshed (footnote 27a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/14?lang=eng'
    quote: '“enlightened”: IE refreshed from being tired.'
  - where: section 6 plain
    claim: '“Give a perfect lot” means “Bring forth right” (footnote 41a), rendered “Give the right answer”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/14?lang=eng'
    quote: 'IE Bring forth right.'
  - where: 'note 14:6 “By many or by few”'
    claim: 'Jonathan and his servant attacked trusting in the Lord'
    key: ot-seminary-lesson-85
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-85-1-samuel-12-15?lang=eng'
    quote: 'Trusting in the Lord, Jonathan and his servant courageously attacked a group of Philistine soldiers.'
  - where: 'note 14:6 “By many or by few”'
    claim: 'The footnote to “few” points to Gideon''s three hundred, Judg. 7:4–7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/14?lang=eng'
    quote: '“few”: Judg. 7:4 (4–7).'
  - where: 'note 14:6 “By many or by few”'
    claim: 'The footnote to “fellow” in verse 20 points to Judg. 7:22'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/14?lang=eng'
    quote: '“fellow”: Judg. 7:22; 2 Chr. 20:23.'
  - where: 'note 14:6 “By many or by few”'
    claim: 'The LORD reduced Gideon''s army lest Israel claim the victory'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/7?lang=eng'
    quote: 'The people that are with thee are too many for me to give the Midianites into their hands, lest Israel vaunt themselves against me, saying, Mine own hand hath saved me.'
  - where: 'note 14:15 “A trembling from God”'
    claim: 'The Hebrew ends the verse with “a trembling of God” (lǝḥerdat ʾĕlōhîm)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'לְ/חֶרְדַּ֥ת'
  - where: 'note 14:15 “A trembling from God”'
    claim: 'BDB: the noun is trembling of terror ascribed to a supernatural cause, citing this verse and the quaking of the earth beside it'
    key: bdb
    url: 'https://biblehub.com/hebrew/2731.htm'
    quote: '1 trembling, quaking (of terror ascribed to supernatural cause) 1 Samuel 14:15 (twice in verse) (hence אלהים ׳ח see Dr; "" וַתִּרְגַּזהֿארץ)'
  - where: 'note 14:15 “A trembling from God”'
    claim: 'Jonathan''s attack, with an earthquake, caused confusion and panic in the Philistine army'
    key: ot-seminary-lesson-85
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-85-1-samuel-12-15?lang=eng'
    quote: 'This act, combined with an earthquake that followed, caused confusion and panic in the Philistine army.'
  - where: 'note 14:18 “The ark or the ephod?”'
    claim: 'The Septuagint has Saul call for the ephod'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/14.htm'
    quote: '18And Saul said to Achia, Bring the ephod; for he wore the ephod in that day before Israel.'
  - where: 'note 14:18 “The ark or the ephod?”'
    claim: 'The other ancient versions support the Hebrew; Keil prefers the Septuagint: the ark was at Kirjath-jearim, inquiry was by the ephod with Urim and Thummim, and “bring hither” is used of the ephod'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/14.htm'
    quote: 'All these circumstances render the correctness of the Masoretic text extremely doubtful, notwithstanding the fact that the Chaldee, the Syriac, and Arabic, and the Vulgate support it, and recommend rather the reading adopted by the lxx'
  - where: 'note 14:18 “The ark or the ephod?”'
    claim: 'Keil: inquiry was made through the ephod with the Urim and Thummim; the verb is the one used for fetching the ephod'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/14.htm'
    quote: 'there is no mention made of the ark, but only of the ephod, the high priest''s shoulder-dress, upon which there were fastened the Urim and Thummim, through which inquiry was made of God. … this verb is the current expression used to signify the fetching of the ephod'
  - where: 'note 14:18 “The ark or the ephod?”'
    claim: 'Cambridge prefers the Septuagint, for the same reasons'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/14.htm'
    quote: 'it was not the Ark, but the Ephod with Urim and Thummim which was the proper instrument for ascertaining the will of God. Moreover “bring hither” is a term applied to the Ephod (1 Samuel 23:9, 1 Samuel 30:7) but not to the Ark. It seems best therefore to follow the reading of the Sept.'
  - where: 'note 14:18 “The ark or the ephod?”'
    claim: 'Ahiah''s wearing the ephod (verse 3) prepares for verse 18'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/14.htm'
    quote: 'His presence with the army is noticed to prepare the way for the fact mentioned in 1 Samuel 14:18.'
  - where: 'note 14:18 “The ark or the ephod?”'
    claim: '“Withdraw thine hand”: desist from the inquiry'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/14.htm'
    quote: '19. Withdraw thine hand] Desist from the inquiry.'
  - where: 'note 14:18 “The ark or the ephod?”'
    claim: 'The ark abode at Kirjath-jearim twenty years (7:2)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/7?lang=eng'
    quote: 'while the ark abode in Kirjath-jearim, that the time was long; for it was twenty years'
  - where: 'note 14:24 “Saul''s oath”'
    claim: 'The fast was a misguided effort to get help from the Lord and prevail over his enemies'
    key: ot-seminary-lesson-85
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-85-1-samuel-12-15?lang=eng'
    quote: 'Saul demanded a fast and forbade his soldiers from eating in a misguided effort to get help from the Lord and prevail over his enemies.'
  - where: 'note 14:24 “Saul''s oath”'
    claim: 'Saul meant to secure the Lord''s help, but ruled that anyone who broke the fast should die'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'Saul’s motive was good. He meant to secure the help of the Lord in winning a victory. But impetuously, he ruled that anyone who broke the fast should die.'
  - where: 'note 14:32 “Eating with the blood”'
    claim: 'Blood was regarded as the seat of life; forbidden as food from Gen. 9:4 to the New Testament Church'
    key: bd-blood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/blood?lang=eng'
    quote: 'Regarded by the Israelites as the seat of the life or vital energy of all flesh (Lev. 17:10–14). In Old Testament times blood was forbidden as food (Gen. 9:4; … 1 Sam. 14:32–34), which restriction was continued in the Church in New Testament times'
  - where: 'note 14:32 “Eating with the blood”'
    claim: 'Saul at once had the meat rightly slaughtered at a central place'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'When King Saul heard this, he quickly called for all to come to a central place so the meat could be rightly slaughtered and cooked, and the proper offerings made.'
  - where: 'note 14:32 “Eating with the blood”'
    claim: 'The life of the flesh is in the blood, given upon the altar to make an atonement (Lev. 17:11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/17?lang=eng'
    quote: 'For the life of the flesh is in the blood: and I have given it to you upon the altar to make an atonement for your souls'
  - where: 'note 14:37 “God gives no answer”'
    claim: 'The Israelites consulted the Lord on matters of war (citing this verse), and the Lord aided them when His commands were followed'
    key: sc-knowhy-572
    url: 'https://scripturecentral.org/knowhy/why-did-god-support-the-nephites-in-battle'
    quote: 'The Israelites consulted the Lord on matters of war (see Judges 20:23, 28; 1 Samuel 14:37), and when His commands were followed, the Lord aided the Israelites in battle'
  - where: 'note 14:37 “God gives no answer”'
    claim: 'Saul concluded that someone in the army had sinned and swore death, even for Jonathan'
    key: ot-seminary-lesson-85
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-85-1-samuel-12-15?lang=eng'
    quote: 'Saul concluded that the Lord did not answer because someone in the army had sinned. He gathered the people together and swore an oath that whoever had eaten earlier in the day would be put to death, even if it had been his own son Jonathan.'
  - where: 'note 14:37 “God gives no answer”'
    claim: 'Saul blamed the broken fast instead of his own disobedience'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'Saul blamed his separation from the Lord on the broken fast instead of on his own disobedience.'
  - where: 'note 14:41 “A perfect lot”'
    claim: 'The Hebrew is hābâ tāmîm'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'תָמִ֑ים'
  - where: 'note 14:41 “A perfect lot”'
    claim: 'BDB lists 1 Sam. 14:41 under Thummim, read for tāmîm, after several scholars'
    key: bdb
    url: 'https://biblehub.com/hebrew/8537.htm'
    quote: '4 תֻּמִּים in אוּרִים וְתֻמִּים (meaning dubious, see, אורים) Deuteronomy 33:8; Exodus 28:30 (P) Leviticus 8:8 (P), Ezra 2:63 = Nehemiah 7:65; + 1 Samuel 14:41 (for תָּמִים) We Dr Bu HPS'
  - where: 'note 14:41 “A perfect lot”'
    claim: 'Cambridge: “a perfect lot” is the best explanation of an obscure phrase found nowhere else'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/14.htm'
    quote: 'Give a perfect lot] This and not the marginal rendering “Shew the innocent” is the best explanation of an obscure phrase which occurs nowhere else.'
  - where: 'note 14:41 “A perfect lot”'
    claim: 'Footnote 41a: “Bring forth right”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/14?lang=eng'
    quote: 'IE Bring forth right.'
  - where: 'note 14:41 “A perfect lot”'
    claim: 'The Septuagint has a longer prayer'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/14.htm'
    quote: '41And Saul said, O Lord God of Israel, why hast thou not answered thy servant this day? is the iniquity in me, or in Jonathan my son? Lord God of Israel, give clear manifestations'
  - where: 'note 14:41 “A perfect lot”'
    claim: 'Cambridge: the Greek with emendation reads “give Urim … give Thummim”; if correct, the Urim and Thummim worked by a kind of lot; the Hebrew implies the ordinary lot'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/14.htm'
    quote: 'O Lord God of Israel, give Urim: and if it be in thy people Israel, give Thummim.” If this reading is correct, it points to the conclusion that the “judgment of Urim and Thummim” was obtained by a special method of casting lots … The Heb. text implies that the ordinary lot only was used.'
  - where: 'note 14:41 “A perfect lot”'
    claim: 'Keil reports scholars who take the Greek additions as original and read Thummim for tāmîm'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/14.htm'
    quote: 'are regarded by Ewald (Gesch. iii. p. 48) and Thenius as an original portion of the text which has dropped out from the Masoretic text. They therefore infer, that instead of תמים we ought to read תּמּים (Thummim)'
  - where: 'note 14:41 “A perfect lot”'
    claim: 'The Urim and Thummim: an instrument prepared of God to obtain revelation, used by Aaron and the priests of Israel'
    key: bd-urim-and-thummim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/urim-and-thummim?lang=eng'
    quote: 'An instrument prepared of God to assist man in obtaining revelation from the Lord and in translating languages. … Abraham used a Urim and Thummim (Abr. 3:1–4), as did Aaron and the priests of Israel'
  - where: 'note 14:45 “Was Jonathan guilty?”'
    claim: '“God so do to me, and more also” was a self-curse formula used by Israelites, Saul among them, when taking an oath'
    key: parker-cutting
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/cutting-covenants'
    quote: 'the individual probably repeated a phrase similar to self-curses in which a person said, “God so do to me, and more also,” signifying that the individual expected to be cursed if they did not live up to their oath. This self-curse formula is attested … among Israelites (Eli, Saul, Jonathan'
  - where: 'note 14:45 “Was Jonathan guilty?”'
    claim: 'Keil, quoted in the manual: Jonathan''s act not wrong in itself; not consciously transgressed; the prohibition without divine authority; the victory a divine verdict; Saul himself had sinned'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: '“What Jonathan had done was not wrong in itself, but became so simply on account of the oath with which Saul had forbidden it. But Jonathan did not hear the oath, and therefore had not even consciously transgressed.'
  - where: 'note 14:45 “Was Jonathan guilty?”'
    claim: 'Keil, quoted in the manual: Saul issued the prohibition without divine authority; it was Saul who had sinned'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'Saul had issued the prohibition without divine authority … In this fact (Jonathan’s victory) there was a divine verdict. And Saul could not fail to recognise now, that it was not Jonathan, but he himself, who had sinned'
  - where: 'note 14:24 “Saul''s oath”'
    claim: 'Saul''s threat was excessive and undeserved, meant to prove his devotion'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'the threat of death to the violator of his edict was excessive and totally undeserved; it was meant to prove Saul’s devotion'
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'The sacrifice was a type of Jesus Christ (Lev. 17:11)'
    key: bd-blood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/blood?lang=eng'
    quote: 'the sacrifice was a type of the great sacrifice who is Jesus Christ'
  - where: christ
    claim: 'Saul''s fast was a misguided effort to get the Lord''s help; Jonathan attacked trusting in the Lord'
    key: ot-seminary-lesson-85
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-85-1-samuel-12-15?lang=eng'
    quote: 'Trusting in the Lord, Jonathan and his servant courageously attacked a group of Philistine soldiers.'
