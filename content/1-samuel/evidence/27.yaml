chapter: 27
claims:
  - where: setting
    claim: 'After Saul promised no more harm, David did not believe him and took his men and their families to live among the Philistines'
    key: ot-seminary-student-2018-1-sam-91
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-material-2018/1-samuel/lesson-91?lang=eng'
    quote: 'David did not believe Saul, however, so he took his family and his men and their families to live among the Philistines.'
  - where: setting
    claim: 'One excavator places the palace of Achish, where he hosted David, on the summit of Gath'
    key: chadwick-gath
    url: 'https://rsc.byu.edu/winter-2013/gath-philistines'
    quote: 'This hilltop was the elite zone of Gath, the place where the Philistine king Achish maintained his palace three thousand years ago when he hosted the young warrior David, who was on the run from King Saul.'
  - where: setting
    claim: 'Ziklag is later raided by the Amalekites (chapter 30)'
    key: bd-ziklag
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ziklag?lang=eng'
    quote: 'The Amalekites made a raid upon it (1 Sam. 30:1–26'
  - where: setting
    claim: 'The chapter as read: 26:21, 26:19, 28:1, 29:3, 30:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/27?lang=eng'
    quote: 'David flees to Achish at Gath—He dwells among the Philistines for sixteen months.'
  - where: thread
    claim: 'David led Achish to believe he was raiding Judah while he was raiding non-Israelite cities'
    key: ot-seminary-student-2018-1-sam-91
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-material-2018/1-samuel/lesson-91?lang=eng'
    quote: 'David gained the trust of a Philistine leader named Achish by leading Achish to believe that he and his men were conducting raids on cities of Judah while they were in fact raiding non-Israelite cities (see 1 Samuel 27:6–12).'
  - where: 'section 3 plain'
    claim: '“Made a road” means made a raid'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/27?lang=eng'
    quote: '10a “road”: HEB raid.'
  - where: 'note 27:1 “Why David went over to the Philistines”'
    claim: 'Saul had promised no more harm, and David did not believe him'
    key: ot-seminary-student-2018-1-sam-91
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-material-2018/1-samuel/lesson-91?lang=eng'
    quote: 'he said he would “no more do [David] harm” (1 Samuel 26:21). David did not believe Saul, however'
  - where: 'note 27:1 “Why David went over to the Philistines”'
    claim: 'One older reading: the result David foresaw in 26:19 has come; unlike 21:10, he now comes as an outlaw leader welcomed as an ally, an independent chieftain'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/27.htm'
    quote: 'The result anticipated in 1 Samuel 26:19 has come to pass. David is forced to seek refuge in a heathen land. … Then the solitary fugitive … narrowly escaped losing his life; now the outlaw leader of a band of stalwart warriors is welcomed as an ally.'
  - where: 'note 27:1 “Why David went over to the Philistines”'
    claim: 'The Bible Dictionary lists 21:10 and chapter 27 under one entry for Achish, king of Gath'
    key: bd-achish
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/achish?lang=eng'
    quote: 'King of Gath, receives David kindly, 1 Sam. 21:10; 27; 28:1; 29:3–10; 1 Kgs. 2:40; called Abimelech, Ps. 34 heading.'
  - where: 'note 27:1 “Why David went over to the Philistines”'
    claim: 'The text of 26:19, 26:21 and 27:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/26?lang=eng'
    quote: 'for they have driven me out this day from abiding in the inheritance of the LORD, saying, Go, serve other gods.'
  - where: 'note 27:6 “Ziklag, the town that stayed with Judah’s kings”'
    claim: 'Ziklag was a Negev town assigned to Judah, transferred to Simeon, Philistine in Saul''s day, given by Achish to David'
    key: bd-ziklag
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ziklag?lang=eng'
    quote: 'A city in the Negev, originally assigned to Judah (Josh. 15:31) but transferred to Simeon (Josh. 19:5). It was a Philistine city in the days of Saul and was given by Achish to David (1 Sam. 27:6).'
  - where: 'note 27:6 “Ziklag, the town that stayed with Judah’s kings”'
    claim: 'The writer of Samuel and his date are not known'
    key: bd-samuel-books
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel-books-of?lang=eng'
    quote: 'It is uncertain who the author was or when he wrote'
  - where: 'note 27:6 “Ziklag, the town that stayed with Judah’s kings”'
    claim: '1 Chr. 12:1–2: men came to David at Ziklag while he hid from Saul, Benjamites among them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/12?lang=eng'
    quote: 'Now these are they that came to David to Ziklag, while he yet kept himself close because of Saul the son of Kish'
  - where: 'note 27:6 “Ziklag, the town that stayed with Judah’s kings”'
    claim: '1 Chr. 12:2: among them Benjamites, Saul''s kin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/12?lang=eng'
    quote: 'even of Saul’s brethren of Benjamin'
  - where: 'note 27:8 “Amalekites again”'
    claim: 'The Amalekites warred with Israel from Moses'' time until their power was broken by Saul and David'
    key: bd-amalek
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amalek?lang=eng'
    quote: 'The Amalekites were at constant war with the Hebrews from the time of Moses (Ex. 17:8, etc.) till their power was broken by Saul and David (1 Sam. 15; 27:8; 30; 2 Sam. 8:12)'
  - where: 'note 27:8 “Amalekites again”'
    claim: 'Ḥērem texts use the absolute language of ancient war writing; people put under the ban, including the Amalekites of Saul and David, had to be fought again'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'divinely mandated war was typically spoken of in absolute terms regardless of the reality of what played out on the ground … the Amalekites in the time of Saul and David (Joshua 10:20, 39; 11:21; 15:13–14; 1 Samuel 15; 27:8–9; 30:11–20).'
  - where: 'note 27:8 “Amalekites again”'
    claim: 'Saul utterly destroyed all the people (15:8)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: 'utterly destroyed all the people with the edge of the sword'
  - where: 'note 27:10 “What David told Achish”'
    claim: 'The Kenites were long friends of Israel'
    key: bd-kenites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kenites?lang=eng'
    quote: 'Moses’ marriage with the daughter of Jethro, a prince and priest of Midian, was also a cause of the long-standing friendship between the Kenites and Israelites (Num. 24:21–22; Judg. 1:16; 4:11, 17; 5:24; 1 Sam. 15:6; 27:10; 30:29).'
  - where: 'note 27:10 “What David told Achish”'
    claim: 'Jerahmeel was the firstborn of Hezron, of Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/2?lang=eng'
    quote: 'And the sons of Jerahmeel the firstborn of Hezron were'
  - where: 'note 27:10 “What David told Achish”'
    claim: 'David led Achish to believe he raided Judah while he raided non-Israelite cities'
    key: ot-seminary-student-2018-1-sam-91
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-material-2018/1-samuel/lesson-91?lang=eng'
    quote: 'leading Achish to believe that he and his men were conducting raids on cities of Judah while they were in fact raiding non-Israelite cities'
  - where: 'note 27:10 “What David told Achish”'
    claim: 'The 2002 study guide reads the raids as David trying to fulfill the Lord''s original commands to eliminate the idolatrous and wicked from the land'
    key: ot-seminary-guide-1-sam-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-first-book-of-samuel/1-samuel-27-david-among-the-philistines?lang=eng'
    quote: 'Chapter 27 also tells how during that time he tried to fulfill the Lord’s original commands to the Israelites to eliminate all the idolatrous and wicked people from the land.'
  - where: 'note 27:10 “What David told Achish”'
    claim: 'Achish later says he has found no fault in David (29:3, 6)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/29?lang=eng'
    quote: 'I have found no fault in him since he fell unto me unto this day'
  - where: christ
    claim: 'Peter on Christ: when he suffered he committed himself to him that judgeth righteously, an example to follow'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/2?lang=eng'
    quote: 'when he suffered, he threatened not; but committed himself to him that judgeth righteously'
