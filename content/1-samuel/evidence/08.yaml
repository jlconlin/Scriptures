chapter: 8
claims:
  - where: setting
    claim: 'The rising Philistine threat likely intensified the desire for a king'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'This desire for a king was likely intensified by the rising threat of the Philistines, who were gaining power and influence in the region.'
  - where: setting
    claim: 'The uneven leadership and disunity of the judges may have contributed to the desire for a king'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'Before Samuel, Israel had experienced uneven leadership and disunity through the system of judges, which may have also contributed to their desire for a king (see Judges 17:6; 18:1; 19:1; 21:25).'
  - where: setting
    claim: 'The Church footnotes to the request for a king point to Hosea 13:10–11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/8?lang=eng'
    quote: '5b “king”: Hosea 13:10 (9–14); Mosiah 23:6 (6–13); 29:16 (10–39); 3 Ne. 6:30; D&C 38:21. … 7b “rejected”: Ex. 16:8; Hosea 13:11; D&C 38:21.'
  - where: setting
    claim: 'Nephi, like Samuel, did not want his people to have a king'
    key: sc-knowhy-717
    url: 'https://scripturecentral.org/knowhy/why-did-nephis-people-want-him-to-be-a-king'
    quote: 'Much like the prophet Samuel was “displeased” that the people of Israel asked for a king, Nephi “was desirous that [his people] should have no king” (1 Samuel 8:6; 2 Nephi 5:18).'
  - where: thread
    claim: 'Samuel was troubled not because kingship was wrong but because of the reason; the request showed lack of trust'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'Samuel was troubled by their request, not necessarily because having a king was wrong, but more likely because of their reason for wanting one. … The request for a king demonstrated their lack of trust in Jehovah’s promises and their covenant relationship with Jehovah.'

  - where: 'note 8:3 “What Samuel''s sons did”'
    claim: 'mishpat in 1 Sam 8:3 is a legal right; “wrest right” is the expression of Deut 16:19'
    key: bdb
    url: 'https://biblehub.com/hebrew/4941.htm'
    quote: '5 one''s (legal) right, privilege, due: … ׳הִטָּה מ Exodus 23:6 (E) wrest right, so Deuteronomy 16:19; Deuteronomy 23:6; Deuteronomy 24:17; Deuteronomy 27:19; 1 Samuel 8:3'
  - where: 'note 8:3 “What Samuel''s sons did”'
    claim: 'Samuel actually judged; the elders wanted better justice from a king'
    key: dundas-kingship
    url: 'https://byustudies.byu.edu/article/kingship-democracy-and-the-message-of-the-book-of-mormon'
    quote: 'That he actually engaged in the act of judging is confirmed in the following chapter, when Samuel makes his sons Joel and Abiah judges over Israel. … the elders’ primary concern at that point was that they expected better quality justice from their king acting as judge.'
  - where: 'note 8:3 “What Samuel''s sons did”'
    claim: 'Deut 16:19 forbids wresting judgment and taking a gift; 1 Sam 7:15–17 Samuel judges on circuit'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/16?lang=eng'
    quote: 'Thou shalt not wrest judgment; thou shalt not respect persons, neither take a gift'

  - where: 'note 8:5 “Was asking for a king wrong?”'
    claim: 'Samuel troubled because of their reason; the Lord had promised to fight their battles; the request showed lack of trust'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'Samuel was troubled by their request, not necessarily because having a king was wrong, but more likely because of their reason for wanting one. The Lord Himself had promised to fight the Israelites’ battles when they remained faithful to Him.'
  - where: 'note 8:5 “Was asking for a king wrong?”'
    claim: 'The moral was not that kingship is inherently evil, but that refusing the Lord''s counsel led to sorrow'
    key: sc-knowhy-153
    url: 'https://scripturecentral.org/knowhy/how-did-seeking-a-king-get-in-the-way-of-sustaining-a-prophet'
    quote: 'In the cases of Samuel and King Mosiah, the moral was not necessarily that kingship was or is inherently evil. Rather those histories show that when the people would not take counsel from the Lord, their desire for worldly monarchs readily led to sorrow and destruction.'
  - where: 'note 8:5 “Was asking for a king wrong?”'
    claim: 'Samuel''s displeasure was not because monarchy is inherently evil, as Mosiah 29:13 shows'
    key: lee-king-for-israel
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/06/a-king-for-israel?lang=eng'
    quote: 'Samuel was “displeased” by their petition, but not because monarchy is an inherently evil form of government. We know from King Mosiah that “if it were possible that [we] could have just men to be [our] kings'
  - where: 'note 8:5 “Was asking for a king wrong?”'
    claim: 'Israel was envious of surrounding kingdoms and used Samuel''s sons as an excuse'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'the Israelites as a people had become weak and sinful and were envious of surrounding kingdoms, even though their governments were wicked and oppressive. So they used Samuel’s sons as an excuse to justify their desire to be governed by the same system as the gentile nations.'
  - where: 'note 8:5 “Was asking for a king wrong?”'
    claim: 'Deut 17:14 allows a king; Mosiah 29:13, 16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/8?lang=eng'
    quote: 'now make us a king to judge us like all the nations.'

  - where: 'note 8:7 “The King they already had”'
    claim: 'The Israelites asked Samuel to choose a king, and so were rejecting the Lord''s leadership through his prophet'
    key: sc-knowhy-717
    url: 'https://scripturecentral.org/knowhy/why-did-nephis-people-want-him-to-be-a-king'
    quote: 'when the Israelites approached Samuel, they asked him to choose a king; when the Nephites approached Nephi, they asked him to be a king. Thus, the Israelites, to some extent at least, were rejecting the Lord’s leadership through his prophet'
  - where: 'note 8:7 “The King they already had”'
    claim: 'Israel had been free from an earthly king since Egypt; their sovereign was Jehovah, who is Jesus Christ'
    key: lee-king-for-israel
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/06/a-king-for-israel?lang=eng'
    quote: 'The Israelites had been free from the rule of an earthly king since their bondage in Egypt. … Their sovereign was a heavenly king—Jehovah, who is Jesus Christ—who had brought them through the Red Sea on dry ground, enabled them to conquer the land of Canaan'
  - where: 'note 8:7 “The King they already had”'
    claim: 'Samuel''s words at 12:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/12?lang=eng'
    quote: 'Nay; but a king shall reign over us: when the LORD your God was your king.'

  - where: 'note 8:11 “The manner of the king”'
    claim: 'At 8:3 mishpat is a legal right (BDB sense 5), a different sense from 8:11'
    key: bdb
    url: 'https://biblehub.com/hebrew/4941.htm'
    quote: '5 one''s (legal) right, privilege, due: … ׳הִטָּה מ Exodus 23:6 (E) wrest right, so Deuteronomy 16:19; Deuteronomy 23:6; Deuteronomy 24:17; Deuteronomy 27:19; 1 Samuel 8:3'
  - where: 'note 8:11 “The manner of the king”'
    claim: 'BDB lists 1 Sam 8:9, 11 and 10:25 under ordinance promulgated by a ruler'
    key: bdb
    url: 'https://biblehub.com/hebrew/4941.htm'
    quote: '3 ordinance promulgated by שֹׁפֵט: 1 Samuel 8:9,11; 1 Samuel 10:25 (law of king)'
  - where: 'note 8:11 “The manner of the king”'
    claim: 'The manner of the king is the right the king would claim; “protest solemnly” = bear witness against them'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/8.htm'
    quote: 'בּ העיד means to bear witness, or give testimony against a person, i.e., to point out to him his wrong. … “The manner (mishpat) of the king” is the right or prerogative which the king would claim … a king who would rule over his people with arbitrary and absolute power.'
  - where: 'note 8:11 “The manner of the king”'
    claim: 'Or “the right of the king”; such prerogatives as an absolute monarch claims'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/8.htm'
    quote: '11. This will be the manner of the king] Or, “the right of the king;” such prerogatives as an absolute monarch claims.'

  - where: 'note 8:17 “Did the warning come true?”'
    claim: 'Ye will be slaves; subjects at the king''s disposal; Solomon''s reign tended in this direction'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/8.htm'
    quote: 'We have here a vivid picture of the tyranny of an Oriental despot whose subjects are at his disposal for (1) court retainers … Prosperous as was Solomon’s reign, it tended in this direction. See 1 Kings 5:13-18; 1 Kings 12:4.'
  - where: 'note 8:17 “Did the warning come true?”'
    claim: 'Cambridge: ye will be slaves to the king ye have chosen'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/8.htm'
    quote: '17. and ye shall be his servants] To sum up all briefly, ye will be slaves to the king ye have chosen.'
  - where: 'note 8:17 “Did the warning come true?”'
    claim: 'Three principal evils: taxation, conscription of labor, seizure of lands'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'Samuel warned the Israelites of three principal evils of a kingly form of government: excessive taxation (see vv. 15, 17), conscription of the labor force (see vv. 11–13, 16), and seizure of private lands (see vv. 14–15).'
  - where: 'note 8:17 “Did the warning come true?”'
    claim: 'McConkie (quoted in the manual): the kingly system itself, however noble the occupant, is not the best government'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: '“The system of kingly government itself, no matter how talented or noble an individual occupant of the throne may be, does not make the best form of government'
  - where: 'note 8:17 “Did the warning come true?”'
    claim: 'More than forty kings; their legacies mostly fulfill the warning; Saul, David, Solomon fell'
    key: lee-king-for-israel
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/06/a-king-for-israel?lang=eng'
    quote: 'More than 40 kings ruled over the Israelites, some over a united kingdom, but most over a divided people living in two different kingdoms. The legacies of their kings are for the most part a fulfillment of the Lord’s warning words to Samuel. Even those kings whose hearts were pure'
  - where: 'note 8:17 “Did the warning come true?”'
    claim: 'The footnote at 8:15 points to 1 Kgs 4:22, Solomon''s provision for one day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/4?lang=eng'
    quote: 'And Solomon’s provision for one day was thirty measures of fine flour, and threescore measures of meal,'

  - where: 'note 8:20 “A king to fight their battles”'
    claim: 'Ancient kings held the roles of ruler, commander and supreme judge'
    key: dundas-kingship
    url: 'https://byustudies.byu.edu/article/kingship-democracy-and-the-message-of-the-book-of-mormon'
    quote: 'In our analysis so far, we have noted that ancient kings often held multiple roles, of ruler, commander, and supreme judge.'
  - where: 'note 8:20 “A king to fight their battles”'
    claim: 'The Lord had promised to fight their battles (endnote: Ex 14:13–14; Deut 1:30)'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'The Lord Himself had promised to fight the Israelites’ battles when they remained faithful to Him.'
  - where: 'note 8:20 “A king to fight their battles”'
    claim: 'Holland: they already had a king who fought their battles, Jehovah'
    key: holland-choose-lord-2022
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/06/04-choose-the-lord-and-his-prophet?lang=eng'
    quote: 'The painful irony here is that they already had a king who went before them and fought their battles. He was Jehovah.'
  - where: 'note 8:20 “A king to fight their battles”'
    claim: 'Saul, who was to fight their battles, left Goliath to David, the smallest of his family'
    key: sc-knowhy-856
    url: 'https://scripturecentral.org/knowhy/why-does-goliath-s-height-matter'
    quote: 'the Israelites had previously declared that they wanted a king to “go out before us, and fight our battles” (1 Samuel 8:20), which would have been Saul’s responsibility once he assumed the role. However, he refused to fulfill this responsibility, and left it to David, the smallest person in his family'
  - where: 'note 8:20 “A king to fight their battles”'
    claim: 'Ex 14:14; Deut 1:30'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'The LORD your God which goeth before you, he shall fight for you'

  - where: 'note 8:20 “A king to fight their battles”'
    claim: 'The KnoWhy''s reading rests on the shorter height: Saul about Goliath''s size and the obvious choice'
    key: sc-knowhy-856
    url: 'https://scripturecentral.org/knowhy/why-does-goliath-s-height-matter'
    quote: 'would have been about six and half feet, or the same height as Goliath in the sources noted above. … The Israelite giant, Saul, would have been the obvious choice to fight the Philistine giant, Goliath.'
  - where: section 3 plain
    claim: '“Confectionaries” may be rendered perfumers (footnote 13a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/8?lang=eng'
    quote: '13a “confectionaries”: OR perfumers, ointment makers.'

  - where: 'note 8:22 “The Samuel principle”'
    claim: 'Benson: the Samuel principle'
    key: benson-gifts-expectations
    url: 'https://www.churchofjesuschrist.org/study/new-era/1975/05/jesus-christ-gifts-and-expectations?lang=eng'
    quote: 'Sometimes he temporarily grants to men their unwise requests in order that they might learn from their own sad experiences. Some refer to this as the “Samuel principle.” … They learned the hard way. God wanted it to be otherwise, but within certain bounds he grants unto men according to their desires.'
  - where: 'note 8:22 “The Samuel principle”'
    claim: 'The Lord revealed Saul, gave him a new heart; the Lord wanted righteous, inspired kings'
    key: lee-king-for-israel
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/06/a-king-for-israel?lang=eng'
    quote: 'The Lord revealed to Samuel that Saul was to be their first king (see 1 Sam. 9). Samuel anointed Saul and the Lord gave him a new heart (see 1 Sam. 10), for clearly the Lord wanted His people to have righteous, inspired kings.'
  - where: 'note 8:22 “The Samuel principle”'
    claim: '1 Sam 9:15–17; 10:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/8?lang=eng'
    quote: 'Hearken unto their voice, and make them a king.'

  - where: christ
    claim: 'Jehovah, who is Jesus Christ, was Israel''s king'
    key: lee-king-for-israel
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/06/a-king-for-israel?lang=eng'
    quote: 'Their sovereign was a heavenly king—Jehovah, who is Jesus Christ'
  - where: christ
    claim: 'When Christ reigns personally a perfect theocratic government will prevail (D&C 38:20–22)'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'When Christ comes to reign personally on earth during the millennial era, a perfect theocratic government will prevail. (D. & C. 38:20–22.)'
  - where: christ
    claim: 'D&C 38:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/38?lang=eng'
    quote: 'But, verily I say unto you that in time ye shall have no king nor ruler, for I will be your king and watch over you.'
  - where: christ
    claim: 'Latter-day Israel faces the same pull to be like the world'
    key: holland-choose-lord-2022
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/06/04-choose-the-lord-and-his-prophet?lang=eng'
    quote: 'But like God’s people in the days of Samuel, we face the strong pull to be like those of lesser ways, those overcome by worldly fad in behavior or belief.'
  - where: christ
    claim: 'A worldly king brings bondage; coming to Christ as king, He fights our battles and gives rest'
    key: lee-king-for-israel
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/06/a-king-for-israel?lang=eng'
    quote: 'we will lose our sons and daughters, lose the possessions we covet, and become slaves to our new “king.” … If we will but come to Christ that He may be our king, casting our burdens upon Him, He will fight our battles and give us rest (see Matt. 11:28–30'

  - where: christ
    claim: 'The footnote at 8:7 points to D&C 38:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/8?lang=eng'
    quote: '7b “rejected”: Ex. 16:8; Hosea 13:11; D&C 38:21.'
  - where: christ
    claim: 'Coming to Christ does not mean sitting back and letting Him do everything'
    key: lee-king-for-israel
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/06/a-king-for-israel?lang=eng'
    quote: 'This does not mean that we should just sit back and let Him do everything.'

  - where: explore
    claim: 'Mosiah 2:12–14 alludes to 1 Sam 8:11–18'
    key: sc-knowhy-410
    url: 'https://scripturecentral.org/knowhy/what-parts-of-the-old-testament-were-on-the-plates-of-brass'
    quote: '1 Samuel 8:11–18 is alluded to in Mosiah 2:12–14'
  - where: explore
    claim: 'The footnote at 8:9 points to Mosiah 29:21–23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/8?lang=eng'
    quote: '9b “king”: Mosiah 29:21 (21–23).'
