chapter: 17
claims:
  - where: setting
    claim: 'The Philistines had been an ongoing threat; the elders demanded a king to fight their battles; Saul was greatly afraid and a shepherd boy saved Israel'
    key: cfm-ot-2026-25
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/25?lang=eng'
    quote: 'the Philistines had been an ongoing threat to their safety. … And yet when the menacing giant Goliath hurled his challenge to the armies of Israel, Saul—like the rest of his army—was “greatly afraid” (1 Samuel 17:11). On that day, it wasn’t King Saul who saved Israel'
  - where: setting
    claim: 'The valley of Elah lies west of Jerusalem between the hill country and the coastal plain, the Shephelah'
    key: ot-minute-1-samuel-17
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-17'
    quote: 'The valley of Elah is located to the west of Jerusalem between the hill country of Israel and the flat, fertile plains that meet the Mediterranean Sea. The area is broadly known as the Shephelah.'
  - where: setting
    claim: 'David''s rise from obscurity came from his defeat of Goliath'
    key: eom-david-king
    url: 'https://eom.byu.edu/index.php/David,_King'
    quote: 'David''s vault from obscurity to national awareness seems to have come as a result of his courageous defeat of the giant Goliath (1 Sam. 17:49).'
  - where: setting
    claim: 'Nephi''s slaying of Laban recalls David''s slaying of Goliath'
    key: sc-knowhy-411
    url: 'https://scripturecentral.org/knowhy/why-was-the-sword-of-laban-so-important-to-nephite-leaders'
    quote: 'Several studies have shown that Nephi intentionally connected his slaying of Laban with David’s slaying of Goliath, and that in both cases, the event signified the young hero’s foreordained kingship.'

  - where: thread
    claim: 'The battle proved that the Lord saveth not with sword and spear'
    key: cfm-ot-2026-25
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/25?lang=eng'
    quote: 'This battle proved to Israel, and to anyone who has spiritual battles to fight, that “the Lord saveth not with sword and spear” and that “the battle is the Lord’s” (1 Samuel 17:47).'

  - where: section 1 plain
    claim: 'Greaves are shin armor (footnote 6a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/17?lang=eng'
    quote: '6a “greaves”: IE shin armor.'
  - where: section 2 plain
    claim: '“Take their pledge”: Jesse wanted word of his brothers brought back'
    key: ot-minute-1-samuel-17
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-17'
    quote: 'He sent David, his youngest son, on the errand with instructions to bring back news about his brothers.'
  - where: section 2 plain
    claim: '“Carriage” means baggage (footnote 22a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/17?lang=eng'
    quote: '22a “carriage”: OR baggage.'
  - where: section 2 plain
    claim: '“Naughtiness” means wickedness'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/naughtiness'
    quote: '1. Badness; wickedness; evil principle or purpose. I know thy pride and the naughtiness of thy heart. 1 Samuel 17:28.'
  - where: section 3 plain
    claim: '“He had not proved it” means David was not used to wearing armor'
    key: ot-seminary-lesson-87
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-87-1-samuel-17?lang=eng'
    quote: 'Explain that the phrase “he had not proved it” in verse 39 means that David was not used to wearing armor.'
  - where: section 5 plain
    claim: '“Stripling” is Hebrew “young man” (footnote 56a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/17?lang=eng'
    quote: '56a “stripling”: HEB young man. 1 Sam. 16:22.'

  - where: 'note 17:4 “How tall was Goliath?”'
    claim: 'The Septuagint gives Goliath''s height as four cubits and a span'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/17.htm'
    quote: '4And there went forth a mighty man out of the army of the Philistines, Goliath, by name, out of Geth, his height was four cubits and a span.'
  - where: 'note 17:4 “How tall was Goliath?”'
    claim: 'The Hebrew figure is over nine feet; the Septuagint and Dead Sea Scrolls give six and a half feet'
    key: sc-knowhy-856
    url: 'https://scripturecentral.org/knowhy/why-does-goliath-s-height-matter'
    quote: 'described as over nine feet tall (see 1 Samuel 17:4 where a “cubit” was understood as the tip of the middle finger to the elbow, or about 18 inches … about 9 inches). This is about a foot more than the tallest recorded human'
  - where: 'note 17:4 “How tall was Goliath?”'
    claim: 'The shorter height in the Septuagint and Dead Sea Scrolls may provide an implicit condemnation of Saul'
    key: sc-knowhy-856
    url: 'https://scripturecentral.org/knowhy/why-does-goliath-s-height-matter'
    quote: 'However, in both the Greek (Septuagint) and Dead Sea Scrolls versions of 1 Samuel 17:4, Goliath is described as only six and a half feet tall. … the shorter height may provide an implicit condemnation of Saul.'
  - where: 'note 17:4 “How tall was Goliath?”'
    claim: 'Saul would have been about Goliath''s height, the obvious choice; he let fear, not faith, prevail'
    key: sc-knowhy-856
    url: 'https://scripturecentral.org/knowhy/why-does-goliath-s-height-matter'
    quote: 'The Israelite giant, Saul, would have been the obvious choice to fight the Philistine giant, Goliath. … Saul let fear, not faith, prevail and did not fulfill his responsibility (1 Samuel 17:11).'
  - where: 'note 17:4 “How tall was Goliath?”'
    claim: 'The footnote to “Gath” points to Josh. 11:22, where the Anakims remained in Gath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/17?lang=eng'
    quote: '4a “Gath”: Josh. 11:22; 1 Sam. 5:8; 2 Sam. 21:20; 1 Chr. 18:1; Micah 1:10.'
  - where: 'note 17:4 “How tall was Goliath?”'
    claim: 'The Goliath of 2 Sam. 21:19 is probably another man of the same name, or an error crept into the text'
    key: bd-goliath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/goliath?lang=eng'
    quote: 'The Philistine giant killed by David (1 Sam. 17). In 2 Sam. 21:19 the reference is probably to a different man of the same name, or some error may have crept into the text.'

  - where: 'note 17:6 “The target between his shoulders”'
    claim: 'In 1611 English a target was a small shield'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/target'
    quote: '1. A shield or buckler of a small kind, used as a defensive weapon in war.'
  - where: 'note 17:6 “The target between his shoulders”'
    claim: 'The Church''s footnote gives the Targum''s reading: armor protecting the neck'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/17?lang=eng'
    quote: '6b “a”: IE armor protecting the neck (Targum).'
  - where: 'note 17:6 “The target between his shoulders”'
    claim: 'The Hebrew word is kidon, in 17:6 and 17:45 (where the KJV has “shield”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'וְ/כִיד֥וֹן'
  - where: 'note 17:6 “The target between his shoulders”'
    claim: 'BDB defines kidon as dart, javelin, distinct from the spear, and lists sword, spear and kidon at 17:45 as the weapons of Goliath'
    key: bdb
    url: 'https://biblehub.com/hebrew/3591.htm'
    quote: 'I. כִּידוֺן noun [masculine] dart, javelin … — dart, javelin (distinct from חֲנִית spear, lance, q. v.) … 1 Samuel 17:45 (weapons of Goliath)'
  - where: 'note 17:6 “The target between his shoulders”'
    claim: 'From the Dead Sea Scrolls kidon is now taken as a scimitar; Zerahemnah carrying sword and cimeter matches Goliath'
    key: sc-knowhy-472
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-mormon-mention-cimeters'
    quote: 'Thanks to the Dead Sea Scrolls, scholars now know that the Hebrew term kidon refers to a scimitar. … Some writers have thought it strange that the Lamanite chieftain Zerahemnah would carry both a sword and a cimeter, but … the biblical text says the same about Goliath.'

  - where: 'note 17:25 “A house made free”'
    claim: 'BDB: ḥopšî is free from slavery (Ex. 21:2), and at 1 Sam. 17:25 free from taxes and obligations'
    key: bdb
    url: 'https://biblehub.com/hebrew/2670.htm'
    quote: '1 free from slavery: of Hebrew bondslave (male or female) set free in 7th year Exodus 21:2 … 2 free from taxes, obligations, etc. … 1 Samuel 17:25 his father''s house will he make free in Israel.'
  - where: 'note 17:25 “A house made free”'
    claim: 'Saul later offers Merab, then Michal for a hundred foreskins (1 Sam. 18:17, 25)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/18?lang=eng'
    quote: 'Behold my elder daughter Merab, her will I give thee to wife: only be thou valiant for me, and fight the LORD’s battles.'

  - where: 'note 17:26 “The armies of the living God”'
    claim: '“Uncircumcised” shows the Philistines did not follow Jehovah; “the living God” sets the Lord apart from false gods'
    key: ot-minute-1-samuel-17
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-17'
    quote: 'David’s reference to the “uncircumcised Philistine” (verse 26) makes it clear that Goliath and the Philistines did not follow Jehovah nor His commandments. David’s reference to “the living God” (verse 26) demonstrated his understanding of the Lord, apart from all the false gods.'
  - where: 'note 17:26 “The armies of the living God”'
    claim: 'Circumcision as the token of the covenant (Gen. 17:11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/17?lang=eng'
    quote: 'And ye shall circumcise the flesh of your foreskin; and it shall be a token of the covenant betwixt me and you.'

  - where: 'note 17:28 “Eliab''s charge”'
    claim: '“Naughtiness” in the KJV meant wickedness, evil purpose'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/naughtiness'
    quote: '1. Badness; wickedness; evil principle or purpose. I know thy pride and the naughtiness of thy heart. 1 Samuel 17:28.'
  - where: 'note 17:28 “Eliab''s charge”'
    claim: 'Eliab accused David of pride and a wicked heart; the elder-against-younger-brother motif recurs (Joseph, Nephi)'
    key: ot-minute-1-samuel-17
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-17'
    quote: 'David’s older brother Eliab got angry with his younger brother and accused him of being proud and of having a wicked heart. This exchange … reflects a motif found in other narratives … Joseph and all his older brothers (Genesis 37); … Laman and Lemuel versus Nephi (1 Nephi 3).'
  - where: 'note 17:28 “Eliab''s charge”'
    claim: '“Is there not a cause?” probably means “Is it not a mere word?”, a harmless question'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/17.htm'
    quote: '29. Is there not a cause] A sufficient cause for his coming, namely, his father’s command. But probably the words mean, “Is it not a [mere] word?” i.e. “May I not ask a harmless question?”'

  - where: 'note 17:34 “The shepherd''s proof”'
    claim: 'David''s purpose was to acknowledge that the Lord had delivered him and would again'
    key: ot-minute-1-samuel-17
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-17'
    quote: 'David’s purpose, however, was not to compare himself to the judges but to acknowledge that the Lord had delivered him and would do so again.'
  - where: 'note 17:34 “The shepherd''s proof”'
    claim: 'Each of the three stories introducing David emphasizes his role as shepherd; 2 Sam. 5:2 joins shepherd and king; Ezekiel 34 builds on it'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'Each of the three stories that introduce David emphasize his role as a shepherd (1 Samuel 16:11, 19; 17:15). … showing the connection between a shepherd and a king in Israel’s imagination. This imagery forms the basis of hope in Ezekiel’s prophecy'
  - where: 'note 17:34 “The shepherd''s proof”'
    claim: 'Jesus as the Good Shepherd fulfills the expectation of a king who feeds and cares for his people'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'When Jesus comes as the Good Shepherd, he fulfills this messianic expectation of a king who feeds and cares for his people (see John 10).'

  - where: 'note 17:45 “Not with sword and spear”'
    claim: '“He had not proved it” means David was not used to wearing armor'
    key: ot-seminary-lesson-87
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-87-1-samuel-17?lang=eng'
    quote: 'Why did David decide not to use King Saul’s armor? (Explain that the phrase “he had not proved it” in verse 39 means that David was not used to wearing armor.)'
  - where: 'note 17:45 “Not with sword and spear”'
    claim: 'Goliath boasted of his own strength, David of the Lord'
    key: ot-minute-1-samuel-17
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-17'
    quote: 'In this narrative, however, Goliath boasted of his own strength, but David boasted of the Lord. The two pre-battle speeches couldn’t have been more different.'
  - where: 'note 17:45 “Not with sword and spear”'
    claim: '“Saveth” connotes spiritual saving; David''s message like Samuel''s: trust the Lord, not kings or weapons'
    key: ot-minute-1-samuel-17
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-17'
    quote: 'The Hebrew yehoshia‘ not only connotes saving from physical harm such as during a battle but also connotes that God would redeem and save His people spiritually. David’s message, like that of Samuel the prophet, was that the people needed to trust in the Lord and not in kings or the weapons of war.'

  - where: 'note 17:51 “Goliath''s sword and Laban''s”'
    claim: 'Nephi intentionally connected Laban''s slaying with Goliath''s; both signified foreordained kingship; the sword became an heirloom and symbol of deliverance and legitimacy'
    key: sc-knowhy-411
    url: 'https://scripturecentral.org/knowhy/why-was-the-sword-of-laban-so-important-to-nephite-leaders'
    quote: 'Nephi intentionally connected his slaying of Laban with David’s slaying of Goliath, and that in both cases, the event signified the young hero’s foreordained kingship … the sword itself became a national heirloom, as well as an enduring symbol of divine deliverance and royal legitimacy.'
  - where: 'note 17:51 “Goliath''s sword and Laban''s”'
    claim: 'Each sword''s owner had his head cut off with his own sword by a faithful youth'
    key: sc-knowhy-411
    url: 'https://scripturecentral.org/knowhy/why-was-the-sword-of-laban-so-important-to-nephite-leaders'
    quote: 'Each sword’s owner had his head cut off with his own sword by a faithful youth.'
  - where: 'note 17:51 “Goliath''s sword and Laban''s”'
    claim: 'Goliath''s sword was kept with the ephod; Laban''s with the plates of brass and the interpreters'
    key: sc-knowhy-411
    url: 'https://scripturecentral.org/knowhy/why-was-the-sword-of-laban-so-important-to-nephite-leaders'
    quote: 'The sword of Goliath was kept with the high priestly ephod which was associated with the Urim and Thummim (1 Samuel 21:9). Among the Nephites, the sword of Laban was preserved with the plates of brass, the interpreters'
  - where: 'note 17:51 “Goliath''s sword and Laban''s”'
    claim: 'Goliath''s sword was later kept at Nob behind the ephod (1 Sam. 21:9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/21?lang=eng'
    quote: 'The sword of Goliath the Philistine, whom thou slewest in the valley of Elah, behold, it is here wrapped in a cloth behind the ephod'

  - where: 'note 17:55 “Why Saul asks whose son David is”'
    claim: 'The writer combined two accounts of David''s introduction to Saul and did not always reconcile them'
    key: bd-samuel-books
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel-books-of?lang=eng'
    quote: 'In some cases he has combined together two different accounts of the same event and has not always been careful to reconcile the two together (compare the two accounts of David’s introduction to Saul, 1 Sam. 16:14–23 and 17:1–18:5).'
  - where: 'note 17:55 “Why Saul asks whose son David is”'
    claim: 'The scriptures relate different stories of David''s introduction at Saul''s court'
    key: eom-david-king
    url: 'https://eom.byu.edu/index.php/David,_King'
    quote: 'While the scriptures relate different stories of his introduction at Saul''s court (1 Sam. 16:14-23; 17:55-58)'
  - where: 'note 17:55 “Why Saul asks whose son David is”'
    claim: 'The Septuagint (Codex Vaticanus) omits 17:12–31 and 17:55–18:5'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/17.htm'
    quote: 'the lxx (Cod. Vat.) have omitted the section from 1 Samuel 17:12 to 1 Samuel 17:31, and also that from 1 Samuel 17:55 to 1 Samuel 18:5'
  - where: 'note 17:55 “Why Saul asks whose son David is”'
    claim: 'Brenton''s Septuagint shows verses 12–31 and 55–58 as omitted'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/17.htm'
    quote: '12(OMITTED TEXT) … 31(OMITTED TEXT) … 55(OMITTED TEXT) … 56(OMITTED TEXT) … 57(OMITTED TEXT) 58(OMITTED TEXT)'
  - where: 'note 17:55 “Why Saul asks whose son David is”'
    claim: 'Several years may have passed and David grown from child to young man'
    key: ot-minute-1-samuel-17
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-17'
    quote: 'This narrative seems awkward since in a previous chapter, Saul and David had already met. It may be that several years had passed between meetings and that David had grown from a child into a young man.'
  - where: 'note 17:55 “Why Saul asks whose son David is”'
    claim: 'Keil: Saul asked what kind of man the father was, to grant the exemption of v. 25 and attach him to court; armour-bearer was a title'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/17.htm'
    quote: 'what kind of man the father of a youth who possessed the courage to accomplish so marvellous a heroic deed really was; and the question was put not merely in order that he might grant him an exemption of his house from taxes'
  - where: 'note 17:55 “Why Saul asks whose son David is”'
    claim: 'Keil: the armour-bearer appointment was a title like aide-de-camp'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/17.htm'
    quote: 'The appointment of armour-bearer was nothing more than conferring upon him the title of aide-de-camp'

  - where: 'note 17:55 “Why Saul asks whose son David is”'
    claim: 'Keil: 18:1 implies a longer conversation between Saul and David'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/17.htm'
    quote: 'it is very evident from the expression in 1 Samuel 18:1, "when he had made an end of speaking unto Saul," that Saul conversed with him still further about his family affairs'

  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'The Lord tells the latter-day Saints He will fight their battles (D&C 105:14, the footnote at 17:47)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/105?lang=eng'
    quote: 'For behold, I do not require at their hands to fight the battles of Zion; for, as I said in a former commandment, even so will I fulfil—I will fight your battles.'
  - where: christ
    claim: 'Kimball: every Goliath can be slain; the victor follows David''s path of faith in the Lord'
    key: kimball-davids-goliaths
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1974/10/the-davids-and-the-goliaths?lang=eng'
    quote: 'whatever is your Goliath, he can be slain. But remember, to be the victor, one must follow the path that David followed:'
  - where: christ
    claim: 'Kimball: David had faith and feared no man while he had the confidence of his Lord'
    key: kimball-davids-goliaths
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1974/10/the-davids-and-the-goliaths?lang=eng'
    quote: 'David was honorable and had faith in his Heavenly Father, and he feared no man so long as he had the confidence of his Lord.'
