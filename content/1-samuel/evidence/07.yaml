chapter: 7
claims:
  - where: setting
    claim: 'Kirjath-jearim was on the boundary of Judah and Benjamin, about 7½ miles northwest of Jerusalem, and the ark was there for years'
    key: bd-kirjath-jearim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kirjath-jearim?lang=eng'
    quote: 'A town on the boundary between Judah and Benjamin, 7½ miles northwest of Jerusalem (Josh. 9:17; 18:14–15); the Ark was here for 20 years'
  - where: setting
    claim: 'After Eli''s death Samuel became the great prophet and judge of Israel and restored law, order and regular worship (7:2–17)'
    key: bd-samuel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel?lang=eng'
    quote: 'After Eli’s death he became the great prophet and judge of Israel, and restored law and order and regular religious worship in the land (7:2–17).'
  - where: setting
    claim: 'The forty years of Philistine oppression of Judg. 13:1 ended with this victory'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'The word signifies “were brought low,” but does not imply complete subjugation. The forty years oppression (Jdg 13:1) now came to an end.'
  - where: setting
    claim: 'The chapter ends the first division of the book, Samuel as the last of the judges'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'Here ends the first division of the book, which records Samuel’s life and work as the last of the Judges, in connexion with the old order of things.'
  - where: setting
    claim: 'Samuel is quoted as the type of the successful intercessor in Ps. 99:6 and Jer. 15:1'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'He is quoted as the type of successful intercessors in Psalm 99:6; Jeremiah 15:1.'
  - where: thread
    claim: 'From verse 6 the seminary manual draws the principle that sincere repentance forsakes sins and confesses them, and asks how this battle differed from the earlier ones'
    key: ot-seminary-lesson-83
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-83-1-samuel-4-8?lang=eng'
    quote: 'To sincerely repent, we must forsake our sins and confess them to the Lord.'
  - where: thread
    claim: 'The gathering at Mizpeh was meant to put the people into right relation with God and so prepare their deliverance'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/7.htm'
    quote: 'His intention could not possibly have been any other than to put the people into the right relation to their God, and thus to prepare the way for their deliverance out of the bondage of the Philistines.'
  - where: thread
    claim: 'The thunder was God''s answer to Samuel''s crying to the Lord'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/7.htm'
    quote: 'The thunder, which alarmed the Philistines and threw them into confusion (יהמּם, as in Joshua 10:10), was the answer of God to Samuel''s crying to the Lord.'
  - where: 'note 7:1 “A keeper for the ark, in a private house”'
    claim: 'Kirjath-jearim was neither priestly nor Levitical; chosen as the nearest large town on the road from Beth-shemesh to Shiloh'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/7.htm'
    quote: 'was neither a priestly nor a Levitical city. The reason why the ark was taken there, is to be sought for, therefore, in the situation of the town, i.e., in the fact that Kirjath-jearim was the nearest large town on the road from Bethshemesh to Shiloh.'
  - where: 'note 7:1 “A keeper for the ark, in a private house”'
    claim: 'No definite information why the ark was not taken to Shiloh; only conjectures'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/7.htm'
    quote: 'We have no definite information, however, as to the reason why it was not taken on to Shiloh, to be placed in the tabernacle … so that we can only confine ourselves to conjectures.'
  - where: 'note 7:1 “A keeper for the ark, in a private house”'
    claim: 'No definite information why the ark was not taken to Shiloh; the conjecture that the capture was taken as a judgment on the sanctuary defiled by Eli''s sons, so it stayed until God declared otherwise'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/7.htm'
    quote: 'the carrying away of the ark by the Philistines was regarded as a judgment upon the sanctuary, which had been desecrated by the reckless conduct of the sons of Eli, and consequently, that even when the ark itself was recovered, they would not take it back without an express declaration of the will of God'
  - where: 'note 7:1 “A keeper for the ark, in a private house”'
    claim: 'Josephus says Abinadab was a Levite by birth, a righteous man, and his sons ministered at the ark'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-6.html'
    quote: 'In this city lived one Abinadab, by birth a Levite, and who was greatly commended for his righteous and religious course of life'
  - where: 'note 7:1 “A keeper for the ark, in a private house”'
    claim: 'Abinadab was probably a Levite; Eleazar was consecrated as keeper, not as priest'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'Abinadab was probably (as Josephus says) a Levite: for the Israelites would scarcely have ventured to violate the law by entrusting the Ark to a layman after the late judgment. sanctified Eleazar] Consecrated him and set him apart for the special duty.'
  - where: 'note 7:1 “A keeper for the ark, in a private house”'
    claim: 'The ark stayed in Abinadab''s house until David brought it up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/6?lang=eng'
    quote: 'And they set the ark of God upon a new cart, and brought it out of the house of Abinadab that was in Gibeah'
  - where: 'note 7:2 “Twenty years of lamenting after the LORD”'
    claim: 'The verb is nāhâ, to lament or complain; to lament after God is to follow with earnest pleading until He assents'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/7.htm'
    quote: 'from נהה, to lament or complain (Micah 2:4; Ezekiel 32:18). "The phrase, to lament after God, is taken from human affairs, when one person follows another with earnest solicitations and complaints, until he at length assents.'
  - where: 'note 7:2 “Twenty years of lamenting after the LORD”'
    claim: 'The clauses of verses 2 and 3 are joined and not to be separated'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/7.htm'
    quote: 'The single clauses of 1 Samuel 7:2 and 1 Samuel 7:3 are connected together by vav consec., and are not to be separated from one another.'
  - where: 'note 7:2 “Twenty years of lamenting after the LORD”'
    claim: 'Twenty years is the time before the reformation, not the whole stay of the ark; a dark time of vassalage and idolatry; the lament as a child entreating a father'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'Twenty years was not, as the E. V. seems to imply, the whole duration of the Ark’s sojourn at Kirjath-jearim, but the time that elapsed before the reformation now to be recorded.'
  - where: 'note 7:2 “Twenty years of lamenting after the LORD”'
    claim: 'The lament is like a child following a father who turned away in anger, entreating for reconciliation; the years were of vassalage and idolatry'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'They were vassals of the Philistines, reduced apparently to abject submission. … The people sank into gross idolatry. … As a child follows the father who has been forced to turn a way in anger, and with sighs and tears entreats for reconciliation.'
  - where: 'note 7:3 “Baalim and Ashtaroth”'
    claim: 'Baal means possessor, lord; worshiped with different rites in different places, hence the plural; Ashtoreth the goddess worshiped with him'
    key: bd-baal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/baal?lang=eng'
    quote: 'Possessor, lord. … He was worshipped with different ideas and rites (compare the plural Baalim) in different places … The word Baal expresses the relation between lord and slave. … Ashtoreth was the goddess generally worshipped along with Baal.'
  - where: 'note 7:3 “Baalim and Ashtaroth”'
    claim: 'The plurals denote images or local forms; Ashtoreth was also a goddess of battles, worshiped by the Philistines (31:10); Baal worship never eradicated in the period of the Judges'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'worshipped in Babylonia under the name Ishtar as the goddess of battles and victories, in which character she also appears among the Philistines, war-spoils being dedicated to her (ch. 1 Samuel 31:10).'
  - where: 'note 7:3 “Baalim and Ashtaroth”'
    claim: 'Baal worship was never thoroughly eradicated during the Judges; "serve him only" because He is a jealous God'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'seems never to have been thoroughly eradicated during the period of the Judges. See Joshua 24:23; Jdg 2:11-13; Jdg 3:7; Jdg 8:33; Jdg 10:6.'
  - where: 'note 7:3 “Baalim and Ashtaroth”'
    claim: 'Judges 10:16: Israel put away the strange gods; footnote 3b points there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/7?lang=eng'
    quote: '3b “put away”: Judg. 10:16.'
  - where: 'note 7:6 “Water poured out before the LORD”'
    claim: 'The pouring of water was a symbolic act, explained by the Targum as pouring out the heart in penitence; a confession of distress and humiliation'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/7.htm'
    quote: 'Drawing water and pouring it out before Jehovah was a symbolical act, which has been thus correctly explained by the Chaldee, on the whole: "They poured out their heart like water in penitence before the Lord."'
  - where: 'note 7:6 “Water poured out before the LORD”'
    claim: 'A practical confession: we are before Thee like water poured out; the oral confession explains and confirms the symbolic acts'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/7.htm'
    quote: 'a practical confession before God, "Behold, we are before Thee like water that has been poured out;" … What they did symbolically by the pouring out of water and fasting, they explained and confirmed by their verbal confession.'
  - where: 'note 7:6 “Water poured out before the LORD”'
    claim: 'The act has no exact parallel in the Old Testament; probably the outpouring of hearts; compare 1:15, Ps. 62:8, Lam. 2:19'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'A symbolical act which has no exact parallel in the O.T., but was probably significant of the outpouring of their hearts before Jehovah in penitence and supplication. Cp. ch. 1 Samuel 1:15; Psalm 62:8; Lamentations 2:19.'
  - where: 'note 7:8 “A people who ask the prophet to pray”'
    claim: 'Prophets offset the impending doom of their people by intercessory prayer, 1 Sam. 7:5–9 among the examples'
    key: sc-knowhy-17
    url: 'https://scripturecentral.org/knowhy/how-did-god-call-his-prophets-in-ancient-times'
    quote: 'prophets of God tried to offset, by intercessory prayers, the impending doom of their people (Genesis 14:11; 1 Samuel 7:5-9; Jeremiah 14:11).'
  - where: 'note 7:9 “Samuel''s sacrifice and his priesthood”'
    claim: 'Scripture Helps: the Melchizedek Priesthood was not entirely removed; all the prophets had it; Samuel was therefore authorized to offer sacrifice'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'Because Samuel held the Melchizedek Priesthood, he was authorized to offer sacrifices and perform other duties that were typically reserved for Levite priests.'
  - where: 'note 7:9 “Samuel''s sacrifice and his priesthood”'
    claim: 'Joseph Smith: all priesthood is Melchizedek in different degrees; all the prophets had the Melchizedek Priesthood'
    key: ttp-joseph-smith-8
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-8?lang=eng'
    quote: '“All priesthood is Melchizedek; but there are different portions or degrees of it. … All the prophets had the Melchizedek Priesthood.”'
  - where: 'note 7:9 “Samuel''s sacrifice and his priesthood”'
    claim: 'The fuller statement: the prophets were ordained by God himself, meaning God ordained them or sent a messenger'
    key: millet-prophets-priesthood
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-priesthood-old-testament'
    quote: '“All the prophets had the Melchizedek Priesthood and were ordained by God himself,” [30] meaning that God Himself performed the ordination or sent a divine messenger to do so.'
  - where: 'note 7:9 “Samuel''s sacrifice and his priesthood”'
    claim: 'Joseph Fielding Smith: the higher priesthood was withdrawn from the people as a body, but men holding it were left, Samuel among them'
    key: millet-prophets-priesthood
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-priesthood-old-testament'
    quote: 'The withdrawal of the higher priesthood was from the people as a body, but the Lord still left among them men holding the Melchizedek Priesthood, with power to officiate in all its ordinances, so far as he determined … Therefore Samuel, Isaiah, Jeremiah'
  - where: 'note 7:9 “Samuel''s sacrifice and his priesthood”'
    claim: 'Though not a priest, Samuel performed priestly functions and offered sacrifice at various places'
    key: bd-samuel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel?lang=eng'
    quote: 'Though not a priest, he performed priestly functions and constantly offered sacrifice at various places.'
  - where: 'note 7:9 “A young lamb, offered whole”'
    claim: 'The word means the lamb was offered whole, not cut up; the young lamb represents a nation new-born by conversion; the sacrifice was the basis for prayer, and the Lord answered'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/7.htm'
    quote: 'simply affirms that the lamb was offered upon the altar without being cut up or divided. Samuel selected a young lamb … as being the most suitable to represent the nation that had wakened up to new life through its conversion to the Lord, and was, as it were, new-born.'
  - where: 'note 7:9 “A young lamb, offered whole”'
    claim: 'The sacrifice was the basis for prayer'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/7.htm'
    quote: 'The sacrifice was the substratum for prayer. When Samuel offered it, he cried to the Lord for the children of Israel; and the Lord "answered," i.e., granted, his prayer.'
  - where: 'note 7:9 “A young lamb, offered whole”'
    claim: 'The whole animal burnt denotes the entire consecration of those pleading for deliverance'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'The whole animal was burnt upon the altar to denote the entire consecration to Jehovah of those who were pleading for deliverance.'
  - where: 'note 7:9 “A young lamb, offered whole”'
    claim: 'The law accepted a young animal from the eighth day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/22?lang=eng'
    quote: 'it shall be seven days under the dam; and from the eighth day and thenceforth it shall be accepted for an offering made by fire unto the Lord.'
  - where: 'note 7:10 “The LORD’s answer in thunder”'
    claim: 'The thunder was the answer of God to Samuel''s crying'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/7.htm'
    quote: 'The thunder, which alarmed the Philistines and threw them into confusion (יהמּם, as in Joshua 10:10), was the answer of God to Samuel''s crying to the Lord.'
  - where: 'note 7:10 “The LORD’s answer in thunder”'
    claim: 'Literally "with a great voice"; thunder the voice of God; compare 2:10; "discomfited" is the panic of supernatural defeats (Ex. 14:24; Josh. 10:10; Judg. 4:15)'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'Lit., with a great voice. Thunder is the “voice of God” (Psalm 29:3-4). Cp. ch. 1 Samuel 2:10; 2 Samuel 22:14-15. discomfited them] The Heb. word expresses the confusion of a sudden panic, and is especially used of supernatural defeats. Cp. Exodus 14:24'
  - where: section 3 plain
    claim: 'Eben-ezer means "the stone of help"; Samuel set it up as a monument to remember the Lord'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'Samuel set up a stone he called “Eben-ezer” as a monument to remember the Lord. The Hebrew meaning of ebenezer is “the stone of help.”'
  - where: 'note 7:12 “Hitherto: the help so far”'
    claim: 'Hitherto means up to this time; past deliverances are a pledge of help to come'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'Hitherto, &c.] i.e. Up to this time. The deliverances of the past are a pledge of continued help for the future.'
  - where: 'note 7:12 “Hitherto: the help so far”'
    claim: 'The stone was a standing memorial that the Lord had thus far helped His people'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/7.htm'
    quote: 'to which he gave the name of Eben-ha-ezer, i.e., stone of help, as a standing memorial that the Lord had thus far helped His people.'
  - where: 'note 7:13 “No more, for a time”'
    claim: 'The phrase is used relatively, as in 2 Kgs. 6:23 followed by a new invasion; the Philistines oppress Israel again during Samuel''s lifetime (9:16; 10:5; 13:3, 5, 19; 14:21; 17:1; 23:27)'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'The same phrase is used in 2 Kings 6:23, where the very next verse speaks of a fresh invasion. It is obvious therefore that the Hebrew historian could use the expression relatively and not absolutely'
  - where: 'note 7:13 “No more, for a time”'
    claim: 'Cambridge lists later Philistine oppression and invasions during Samuel''s lifetime'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'Yet we find the people groaning under the Philistine oppression (1 Samuel 9:16): a garrison or a tribute-collector stationed at Gibeah (1 Samuel 10:5, 1 Samuel 13:3): a general disarmament of the nation by the Philistines (1 Samuel 13:19)'
  - where: 'note 7:13 “No more, for a time”'
    claim: 'They came no more with lasting success; the hand of the Lord kept them from effecting anything while Samuel lived'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/7.htm'
    quote: 'the Philistines were so humbled, that they no more invaded the territory of Israel, i.e., with lasting success, as they had done before.'
  - where: 'note 7:13 “No more, for a time”'
    claim: 'The forty years of oppression ended here'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'The forty years oppression (Jdg 13:1) now came to an end.'
  - where: 'note 7:13 “No more, for a time”'
    claim: 'The Student Manual contrasts Samson and Samuel: Samuel freed Israel because of spiritual strength'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'Both were born of barren women through miraculous intervention; both were to be Nazarites for life. Samson, despite tremendous physical strength, did not throw off the power of the Philistines because he did not dedicate himself to the Lord. Samuel, on the other hand, did free Israel from the oppression of the Philistines because he had great spiritual strength and power.'
  - where: 'note 7:14 “Cities restored, and peace with the Amorites”'
    claim: '"From Ekron even unto Gath" means the towns up to the Philistine border, not Ekron and Gath themselves'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/7.htm'
    quote: 'signifying that the Israelites received back their cities up to the very borders of the Philistines, measuring these borders from Ekron to Gath, and not that the Israelites received Ekron and Gath also.'
  - where: 'note 7:14 “Cities restored, and peace with the Amorites”'
    claim: 'The Canaanite tribes kept peace after the victory; the Amorites the most powerful of them'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/7.htm'
    quote: 'the Canaanitish tribes also kept peace with Israel after this victory of the Israelites over the Philistines, and during the time of Samuel. The Amorites are mentioned, as in Joshua 10:6, as being the most powerful of the Canaanitish tribes'
  - where: 'note 7:14 “Cities restored, and peace with the Amorites”'
    claim: '"Amorite" probably means highlander, and is sometimes used loosely of the original inhabitants in general, possibly here'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: '“Amorite” is probably a local not a tribal name, meaning “highlander,” … in several passages of the O.T. the name appears to be used loosely of the original inhabitants in general. Possibly this is the case here.'
  - where: 'note 7:16 “A judge on circuit”'
    claim: 'Samuel assumed the government of the nation at Mizpeh; his office as judge dates from Mizpeh and Ebenezer'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/7.htm'
    quote: 'With the calling of the people to Mizpeh, and the victory at Ebenezer that had been obtained through his prayer, Samuel had assumed the government of the whole nation; so that his office as judge dates from his period'
  - where: 'note 7:16 “A judge on circuit”'
    claim: 'As prophet he led the religious reform, then as chief magistrate the civil reorganization'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'As prophet he effected the religions reformation, and then taking his place as the chief magistrate of the state, he provided for the civil and political reorganization of the people.'
  - where: 'note 7:16 “A judge on circuit”'
    claim: 'Bethel and Gilgal were old sacred places; the Septuagint reads "in all these sanctuaries"; with ark and tabernacle out of view there was no single religious center'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'The Sept. has “in all these sanctuaries.” This reading whether original or not expresses the fact that all these places were, like Ramah, places for sacrifice and worship.'
  - where: 'note 7:16 “A judge on circuit”'
    claim: 'Gilgal was the first camp after the Jordan; Bethel where Jacob saw the ladder'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'Gilgal (= “the Rolling,” Joshua 5:9) was the first station of the Israelites after the passage of the Jordan'
  - where: 'note 7:16 “A judge on circuit”'
    claim: 'After Saul was made king Samuel seems to have ceased to act as judge but remained the prophet'
    key: bd-samuel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel?lang=eng'
    quote: 'After Saul had been appointed king (see 8; 9:14–10:25), Samuel seems to have ceased to act as judge, but he continued to be the prophet and representative of Jehovah.'
  - where: 'note 7:16 “A judge on circuit”'
    claim: 'Bethel was where Jacob saw the ladder'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'There Jacob saw the Vision of the Ladder set up to heaven (Genesis 28:11 ff.)'
  - where: 'note 7:16 “A judge on circuit”'
    claim: 'Mizpeh was the meeting place of the national assembly, as when war was declared on Benjamin (Judg. 20)'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'was the meeting-place of the national assembly on two other important occasions in this period: (a) when war was declared against Benjamin (Judges 20)'
  - where: 'note 7:16 “A judge on circuit”'
    claim: 'Samuel made his sons judges, and Saul was king a considerable time before Samuel died'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'for (a) Samuel in his old age made his sons judges (1 Samuel 8:1): (b) Saul was made king a considerable time before Samuel’s death.'
  - where: 'note 7:16 “A judge on circuit”'
    claim: 'With the ark and tabernacle out of view, no single religious center was kept'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'now that the Ark and Tabernacle had disappeared from view, no effort seems to have been made to preserve the religious unity of the nation.'
  - where: thread
