chapter: 7
claims:
  - where: setting
    claim: 'Kirjath-jearim was on the boundary of Judah and Benjamin, about 7½ miles northwest of Jerusalem, and the ark was there for years'
    key: bd-kirjath-jearim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kirjath-jearim?lang=eng'
    quote: 'A town on the boundary between Judah and Benjamin, 7½ miles northwest of Jerusalem (Josh. 9:17; 18:14–15); the Ark was here for 20 years'
  - where: setting
    claim: 'After Eli''s death Samuel became the great prophet and judge of Israel and restored law, order and regular worship (7:2–17)'
    key: bd-samuel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel?lang=eng'
    quote: 'After Eli’s death he became the great prophet and judge of Israel, and restored law and order and regular religious worship in the land (7:2–17).'
  - where: thread
    claim: 'From verse 6 the seminary manual draws the principle that sincere repentance forsakes sins and confesses them, and asks how this battle differed from the earlier ones'
    key: ot-seminary-lesson-83
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-83-1-samuel-4-8?lang=eng'
    quote: 'To sincerely repent, we must forsake our sins and confess them to the Lord.'
  - where: 'note 7:1 “A keeper for the ark, in a private house”'
    claim: 'Josephus says Abinadab was a Levite by birth, a righteous man, and his sons ministered at the ark'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-6.html'
    quote: 'In this city lived one Abinadab, by birth a Levite, and who was greatly commended for his righteous and religious course of life'
  - where: 'note 7:1 “A keeper for the ark, in a private house”'
    claim: 'The ark stayed in Abinadab''s house until David brought it up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/6?lang=eng'
    quote: 'And they set the ark of God upon a new cart, and brought it out of the house of Abinadab that was in Gibeah'
  - where: 'note 7:3 “Baalim and Ashtaroth”'
    claim: 'Baal means possessor, lord; worshiped with different rites in different places, hence the plural; Ashtoreth the goddess worshiped with him'
    key: bd-baal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/baal?lang=eng'
    quote: 'Possessor, lord. … He was worshipped with different ideas and rites (compare the plural Baalim) in different places … The word Baal expresses the relation between lord and slave. … Ashtoreth was the goddess generally worshipped along with Baal.'
  - where: 'note 7:3 “Baalim and Ashtaroth”'
    claim: 'Judges 10:16: Israel put away the strange gods; footnote 3b points there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/7?lang=eng'
    quote: '3b “put away”: Judg. 10:16.'
  - where: 'note 7:6 “Water poured out before the LORD”'
    claim: 'The pouring of water was a symbolic act, explained by the Targum as pouring out the heart in penitence; a confession of distress and humiliation'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/7.htm'
    quote: 'Drawing water and pouring it out before Jehovah was a symbolical act, which has been thus correctly explained by the Chaldee, on the whole: "They poured out their heart like water in penitence before the Lord."'
  - where: 'note 7:6 “Water poured out before the LORD”'
    claim: 'A practical confession: we are before Thee like water poured out; the oral confession explains and confirms the symbolic acts'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/7.htm'
    quote: 'a practical confession before God, "Behold, we are before Thee like water that has been poured out;" … What they did symbolically by the pouring out of water and fasting, they explained and confirmed by their verbal confession.'
  - where: 'note 7:6 “Water poured out before the LORD”'
    claim: 'The act has no exact parallel in the Old Testament; probably the outpouring of hearts; compare 1:15, Ps. 62:8, Lam. 2:19'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/7.htm'
    quote: 'A symbolical act which has no exact parallel in the O.T., but was probably significant of the outpouring of their hearts before Jehovah in penitence and supplication. Cp. ch. 1 Samuel 1:15; Psalm 62:8; Lamentations 2:19.'
  - where: 'note 7:8 “A people who ask the prophet to pray”'
    claim: 'Prophets offset the impending doom of their people by intercessory prayer, 1 Sam. 7:5–9 among the examples'
    key: sc-knowhy-17
    url: 'https://scripturecentral.org/knowhy/how-did-god-call-his-prophets-in-ancient-times'
    quote: 'prophets of God tried to offset, by intercessory prayers, the impending doom of their people (Genesis 14:11; 1 Samuel 7:5-9; Jeremiah 14:11).'
  - where: 'note 7:9 “Samuel''s sacrifice and his priesthood”'
    claim: 'Scripture Helps: the Melchizedek Priesthood was not entirely removed; all the prophets had it; Samuel was therefore authorized to offer sacrifice'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'Because Samuel held the Melchizedek Priesthood, he was authorized to offer sacrifices and perform other duties that were typically reserved for Levite priests.'
  - where: 'note 7:9 “Samuel''s sacrifice and his priesthood”'
    claim: 'Joseph Smith: all priesthood is Melchizedek in different degrees; all the prophets had the Melchizedek Priesthood'
    key: ttp-joseph-smith-8
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-8?lang=eng'
    quote: '“All priesthood is Melchizedek; but there are different portions or degrees of it. … All the prophets had the Melchizedek Priesthood.”'
  - where: 'note 7:9 “Samuel''s sacrifice and his priesthood”'
    claim: 'The fuller statement: the prophets were ordained by God himself, meaning God ordained them or sent a messenger'
    key: millet-prophets-priesthood
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-priesthood-old-testament'
    quote: '“All the prophets had the Melchizedek Priesthood and were ordained by God himself,” [30] meaning that God Himself performed the ordination or sent a divine messenger to do so.'
  - where: 'note 7:9 “Samuel''s sacrifice and his priesthood”'
    claim: 'Joseph Fielding Smith: the higher priesthood was withdrawn from the people as a body, but men holding it were left, Samuel among them'
    key: millet-prophets-priesthood
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/prophets-priesthood-old-testament'
    quote: 'The withdrawal of the higher priesthood was from the people as a body, but the Lord still left among them men holding the Melchizedek Priesthood, with power to officiate in all its ordinances, so far as he determined … Therefore Samuel, Isaiah, Jeremiah'
  - where: 'note 7:9 “Samuel''s sacrifice and his priesthood”'
    claim: 'Though not a priest, Samuel performed priestly functions and offered sacrifice at various places'
    key: bd-samuel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel?lang=eng'
    quote: 'Though not a priest, he performed priestly functions and constantly offered sacrifice at various places.'
  - where: 'note 7:9 “A young lamb, offered whole”'
    claim: 'The law accepted a young animal from the eighth day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/22?lang=eng'
    quote: 'it shall be seven days under the dam; and from the eighth day and thenceforth it shall be accepted for an offering made by fire unto the Lord.'
  - where: section 3 plain
    claim: 'Eben-ezer means "the stone of help"; Samuel set it up as a monument to remember the Lord'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'Samuel set up a stone he called “Eben-ezer” as a monument to remember the Lord. The Hebrew meaning of ebenezer is “the stone of help.”'
  - where: 'note 7:16 “A judge on circuit”'
    claim: 'After Saul was made king Samuel seems to have ceased to act as judge but remained the prophet'
    key: bd-samuel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel?lang=eng'
    quote: 'After Saul had been appointed king (see 8; 9:14–10:25), Samuel seems to have ceased to act as judge, but he continued to be the prophet and representative of Jehovah.'
  - where: thread
    claim: 'The seminary manual asks how this battle differed from the earlier battles and how repentance affected the outcome'
    key: ot-seminary-lesson-83
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-83-1-samuel-4-8?lang=eng'
    quote: 'How was this battle different from the previous battles the Israelites fought against the Philistines?'
  - where: christ
    claim: 'The footnote at 7:3 "return" points to 3 Ne. 10:6, where the voice of Christ calls Israel to return'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/7?lang=eng'
    quote: '3a “return”: Deut. 30:2 (2–10); Hel. 13:11; 3 Ne. 10:6 (5–7); 24:7; Moro. 9:22.'
  - where: christ
    claim: 'In 3 Ne. 10:6 the voice of Christ calls Israel to repent and return'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/10?lang=eng'
    quote: 'O ye house of Israel whom I have spared, how oft will I gather you as a hen gathereth her chickens under her wings, if ye will repent and return unto me with full purpose of heart.'
  - where: christ
    claim: 'D&C 58:43: the one who repents confesses and forsakes his sins'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/58?lang=eng'
    quote: 'By this ye may know if a man repenteth of his sins—behold, he will confess them and forsake them.'
  - where: 'setting'
    claim: 'Samuel was the last of the judges; 1 Samuel tells the transition from judges to kings'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'The book of 1 Samuel recounts the ministry of the prophet Samuel, the last of the Israelite judges. … It also describes Israel’s difficult transition from judges to kings.'
  - where: 'setting'
    claim: 'Samuel ended the Philistine oppression that Samson had not thrown off'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'Samuel, on the other hand, did free Israel from the oppression of the Philistines because he had great spiritual strength and power.'
  - where: 'setting'
    claim: 'Ps. 99:6 sets Samuel among those who called on the LORD and were answered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/99?lang=eng'
    quote: 'Moses and Aaron among his priests, and Samuel among them that call upon his name; they called upon the LORD, and he answered them.'
  - where: 'setting'
    claim: 'Jer. 15:1 names Samuel beside Moses as standing before the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/15?lang=eng'
    quote: 'Though Moses and Samuel stood before me, yet my mind could not be toward this people'
  - where: 'thread'
    claim: 'The Hebrew of "heard" in verse 9 is "answered"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/7?lang=eng'
    quote: '9b “heard”: HEB answered.'
  - where: 'note 7:1 “A keeper for the ark, in a private house”'
    claim: 'Josephus: Abinadabs sons ministered at the ark'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-6.html'
    quote: 'His sons also ministred to the divine service at the ark; and were the principal curators of it for twenty years'
  - where: 'note 7:1 “A keeper for the ark, in a private house”'
    claim: 'The Piel of qadash (sanctify) is used of consecrating priests, the firstborn, and the keepers of the ark at 1 Sam. 7:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/6942.htm'
    quote: 'c. persons: priests Exodus 28:3,41; Exodus 29:1,33,44; … firstborn Exodus 13:2 (P); keepers of ark 1 Samuel 7:1.'
  - where: 'note 7:1 “A keeper for the ark, in a private house”'
    claim: 'Ps. 78:60–61: the LORD forsook the tabernacle of Shiloh and delivered his strength into captivity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/78?lang=eng'
    quote: 'So that he forsook the tabernacle of Shiloh, the tent which he placed among men; And delivered his strength into captivity, and his glory into the enemy’s hand.'
  - where: 'note 7:2 “Twenty years of lamenting after the LORD”'
    claim: 'nāhâ means wail, lament; in 1 Sam. 7:2 with "after," most read "went mourning after"'
    key: bdb
    url: 'https://biblehub.com/hebrew/5091.htm'
    quote: 'נָהָה verb wail, lament … Niph`al Imperfect וַיִּנָּהוּ 1 Samuel 7:2 followed byאַהֲרִי went mourning after (so most'
  - where: 'note 7:3 “Baalim and Ashtaroth”'
    claim: 'Ashtaroth is the plural of Ashtoreth, idols worshipped with Baal by Israel, including at 1 Sam. 7:3–4 and 31:10'
    key: bd-ashtaroth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ashtaroth?lang=eng'
    quote: 'Plural of Ashtoreth. Idols worshipped with Baal by the Israelites (Judg. 2:13; 10:6; 1 Sam. 7:3–4; 12:10; 31:10).'
  - where: 'note 7:3 “Baalim and Ashtaroth”'
    claim: 'The Churchs footnote takes the Ashtaroth of verse 3 as images of the goddess'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/7?lang=eng'
    quote: '3d “Ashtaroth”: IE the images of the fertility goddess.'
  - where: 'note 7:9 “A young lamb, offered whole”'
    claim: 'kālîl is a sacrificial term for an offering consumed wholly on the altar, in apposition to the burnt offering at 1 Sam. 7:9'
    key: bdb
    url: 'https://biblehub.com/hebrew/3632.htm'
    quote: 'b. as a sacrificial term, entire- or whole-offering, holocaust, of a sacrifice consumed wholly on the altar … usually a descriptive synonym of עוֺלָה … in app. 1 Samuel 7:9'
  - where: 'note 7:9 “A young lamb, offered whole”'
    claim: 'The characteristic rite of the burnt offering was burning the whole animal'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The characteristic rite was the burning of the whole animal on the altar (Lev. 1:9; Deut. 33:10).'
  - where: 'note 7:9 “A young lamb, offered whole”'
    claim: 'Burning the sacrifice on the altar symbolized the worshippers consecration'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: '(5) Burning the sacrifice on the altar. After the priest had properly prepared the sacrificial victim he offered it (the whole or the fat only) upon the altar of burnt offering. This act symbolized the consecration of the worshipper to Jehovah.'
  - where: 'note 7:9 “A young lamb, offered whole”'
    claim: 'The Hebrew of "heard" in verse 9 is "answered"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/7?lang=eng'
    quote: '9b “heard”: HEB answered.'
  - where: 'note 7:10 “The LORD’s answer in thunder”'
    claim: 'The Hebrew of "heard" in verse 9 is "answered"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/7?lang=eng'
    quote: '9b “heard”: HEB answered.'
  - where: 'note 7:10 “The LORD’s answer in thunder”'
    claim: 'qôl is used of thunder as the voice of the LORD (Ps. 29:3), compare 1 Sam. 7:10'
    key: bdb
    url: 'https://biblehub.com/hebrew/6963.htm'
    quote: 'b. thunder-clap or peal … ׳קוֺל י (or קוֺלוֺ) Amos 1:2; … Psalm 29:3; Psalm 29:7; Psalm 46:7; Job 37:4 (compare 1 Samuel 7:10'
  - where: 'note 7:10 “The LORD’s answer in thunder”'
    claim: 'hāmam means confuse, discomfit, at Ex. 14:24, Josh. 10:10, Judg. 4:15 and 1 Sam. 7:10'
    key: bdb
    url: 'https://biblehub.com/hebrew/2000.htm'
    quote: '2 confuse, discomfit, with accusative Exodus 14:24; Exodus 23:27; Joshua 10:10; Judges 4:15; 1 Samuel 7:10'
  - where: 'note 7:10 “The LORD’s answer in thunder”'
    claim: 'The Churchs footnote: "discomfited them" is in Hebrew "caused them confusion"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/7?lang=eng'
    quote: '10a “discomfited them”: HEB caused them confusion.'
  - where: 'note 7:12 “Hitherto: the help so far”'
    claim: 'Eben-ezer means "the stone of help"; Samuel set it up as a monument to remember the Lord'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'Samuel set up a stone he called “Eben-ezer” as a monument to remember the Lord. The Hebrew meaning of ebenezer is “the stone of help.”'
  - where: 'note 7:12 “Hitherto: the help so far”'
    claim: 'ʿad hēnnâ means hitherto, until now'
    key: bdb
    url: 'https://biblehub.com/hebrew/2008.htm'
    quote: 'b. of time, in עַד הֵנָּה hitherto Genesis 15:16 … Psalm 71:17 & until now do I keep declaring thy wonders'
  - where: 'note 7:12 “Hitherto: the help so far”'
    claim: 'ʿezer is help out of a difficult or desperate situation, often divine help'
    key: sc-knowhy-833
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-that-eve-is-a-help-meet-for-adam'
    quote: 'It is never used to refer to someone who helps with menial tasks, as important as such work is. Rather, it is used to refer to someone who helps another person out of a difficult or desperate situation. … Often, ezer even refers to divine or extraordinary help'
  - where: 'note 7:12 “Hitherto: the help so far”'
    claim: 'The place of the stone had been the scene of two defeats and is called by its later name in that account'
    key: bd-ebenezer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ebenezer?lang=eng'
    quote: 'A stone set up by Samuel as a token of gratitude for deliverance from the Philistines (1 Sam. 7:10–12). The place had previously been the scene of two defeats (1 Sam. 4:1; 5:1); and in the account of these defeats it is called by the name it received later on.'
  - where: 'note 7:13 “No more, for a time”'
    claim: '2 Kgs. 6:23: the Syrian bands came no more into Israel; 6:24 a new invasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/6?lang=eng'
    quote: 'So the bands of Syria came no more into the land of Israel. … And it came to pass after this, that Ben-hadad king of Syria gathered all his host, and went up, and besieged Samaria.'
  - where: 'note 7:14 “Cities restored, and peace with the Amorites”'
    claim: 'Ekron and Gath were two of the five chief Philistine cities'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'They formed a confederation of five chief cities, namely, Ashdod, Gaza, Ashkelon, Gath, and Ekron, each governed by its “lord.”'
  - where: 'note 7:14 “Cities restored, and peace with the Amorites”'
    claim: 'The Amorites were northwest Semitic-speaking peoples of Palestine and Syria from about Abrahams time'
    key: bd-amorites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amorites?lang=eng'
    quote: 'The Amorites were northwest Semitic-speaking peoples who lived about the time of Abraham in the areas that encompass Palestine and Syria.'
  - where: 'note 7:14 “Cities restored, and peace with the Amorites”'
    claim: 'Gath and Ekron are still Philistine in 1 Sam. 17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/17?lang=eng'
    quote: 'And the wounded of the Philistines fell down by the way to Shaaraim, even unto Gath, and unto Ekron.'
  - where: 'note 7:16 “A judge on circuit”'
    claim: 'Bethel was one of the most sacred spots in Israel, where Jacob had his dream and named the place, and a sanctuary in Samuels day'
    key: bd-bethel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethel?lang=eng'
    quote: 'one of the most sacred spots in Israel. … here Jacob had his dream, set up a pillar, and gave the place its name (28:19). It was a sanctuary in the days of Samuel (1 Sam. 7:16; 10:3).'
  - where: 'note 7:16 “A judge on circuit”'
    claim: 'Gilgal was the first camp after crossing the Jordan, where the twelve stones were set up'
    key: bd-gilgal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gilgal?lang=eng'
    quote: 'The place near Jericho at which the Israelite camp was made on the first night after crossing the Jordan (Josh. 4:19; 5:10; 10). Here the 12 stones from the Jordan were set up'
  - where: 'note 7:16 “A judge on circuit”'
    claim: 'The Septuagint has "in all these consecrated places" at 7:16'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/7.htm'
    quote: '16And he went year by year, and went round Baethel, and Galgala, and Massephath; and he judged Israel in all these consecrated places.'
  - where: 'note 7:16 “A judge on circuit”'
    claim: 'The Churchs footnote at "Mizpeh" points to Judg. 20:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/7?lang=eng'
    quote: '5a “Mizpeh”: Judg. 20:1.'
