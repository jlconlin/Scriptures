chapter: 3
claims:
  - where: setting
    claim: 'Chapter 3 continues the narrator''s alternation between Eli''s story and Samuel''s, the fall of Eli''s family mirrored by the rise of Hannah''s'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'the author continues to switch between Eli’s story and Samuel’s story in order to emphasize the contrast. As soon as the Lord’s messenger departs, we return to Samuel’s story and find that the fall of Eli’s family is mirrored by the rise of Hannah’s family.'
  - where: setting
    claim: 'The episode concerns the transition from priestly to prophetic authority (Alter, as quoted by Olsen)'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'But the same phrase also is used to announce prophecy, and ‘vision’ is a prophetic term: the whole episode concerns the transition from priestly to prophetic authority.'
  - where: setting
    claim: 'The man of God delivered the word to Eli; Samuel receives it directly from God, which qualifies him as a prophet to all Israel'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'the narrative features the delivery of the word of God by the “man of God” to Eli but the reception by Samuel of the divine message directly from God.'
  - where: setting
    claim: 'The closing report of chapter 3 continues into the first clause of 4:1'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'The end of the chapter (and the beginning of chapter 4, where the thought is continued) reflects a complete change'
  - where: setting
    claim: 'Peter''s speech (Acts 3:24) counts the prophets from Samuel; the biblical prophetic tradition is said to start with him'
    key: ot-minute-1-samuel-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-3'
    quote: 'it was with Samuel that the biblical prophetic tradition started. Jewish tradition also considers Samuel to be the first prophet. See, for example, Peter’s speech in Acts 3:24'
  - where: thread
    claim: 'The chapter opens with little revelation and ends with a complete change'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'Chapter 3 begins with the idea that there was very little revelation at this time … The end of the chapter (and the beginning of chapter 4, where the thought is continued) reflects a complete change'
  - where: thread
    claim: 'Hearing and seeing run through the account: Eli''s dim eyes, the rare word, ears that will tingle'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'In response to this array of sensory deficiencies, the Lord launches his first instruction to Samuel with the declaration, “Behold, I will do a thing in Israel, at which both the ears of every one that heareth it shall tingle”'
  - where: thread
    claim: 'Samuel learns to discern the Lord''s voice while serving in the sanctuary'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'Chapter 3 tells the story of Samuel learning to discern the voice of the Lord as he serves and lives in the holy sanctuary.'
  - where: thread
    claim: 'Samuel''s first prophecy, the fall of Eli''s house, is the reversal his mother sang of'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'So when Samuel takes up the prophetic mantle and shares this word with all of Israel, he is preaching about the same kind of reversals that his mother sang about in the temple.'
  - where: thread
    claim: 'By the end the word is no longer rare; the state of 3:1 is reversed'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/3.htm'
    quote: 'The state of things described in 1 Samuel 3:1 was now reversed. The “word of Jehovah” was no longer “rare,” there were visions “published abroad.”'
  - where: 'note 3:1 “How old was Samuel?”'
    claim: 'Josephus says Samuel was twelve when he began to prophesy'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-5.html'
    quote: 'Now when Samuel was twelve years old, he began to prophecy: and when he was once asleep, God called to him by his name'
  - where: 'note 3:1 “A rare word, and no vision spread abroad”'
    claim: 'yāqār here means rare'
    key: bdb
    url: 'https://biblehub.com/hebrew/3368.htm'
    quote: '2 rare, 1 Samuel 3:1 (compare √ Hiph`il Isaiah 13:12).'
  - where: 'note 3:1 “A rare word, and no vision spread abroad”'
    claim: '“Open” is niphrāṣ, a vision spread abroad, general or frequent'
    key: bdb
    url: 'https://biblehub.com/hebrew/6555.htm'
    quote: 'Niph`al Participle אֵין חָזוֺן נִפְרָ֑ץ 1 Samuel 3:1 no vision spread abroad (i.e. General, or frequent'
  - where: 'note 3:1 “A rare word, and no vision spread abroad”'
    claim: 'The narrator sets Eli''s dim eyes right after the indictment of the rare word'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'The narrator’s specific comment that the priest’s “eyes began to wax dim, that he could not see” follows immediately the narrator’s general spiritual indictment of Israel'
  - where: 'note 3:1 “A rare word, and no vision spread abroad”'
    claim: '“Precious” means rare (Scripture Helps, beside the verse)'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'The word precious as used in the King James Version of the Old Testament means “rare.”'
  - where: 'note 3:1 “A rare word, and no vision spread abroad”'
    claim: 'yāqār also means precious, costly, prized'
    key: bdb
    url: 'https://biblehub.com/hebrew/3368.htm'
    quote: 'יָקָר adjective precious, rare, splendid, weighty'
  - where: 'note 3:3 “Before the lamp of God went out”'
    claim: 'The lamp of God is the tabernacle candlestick, lit each evening and burning through the night; that it was not yet out means before dawn'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/3.htm'
    quote: 'The "lamp of God" is the light of the candlestick in the tabernacle, the seven lamps of which were put up and lighted every evening, and burned through the night till all the oil was consumed … The statement that this light was not yet extinguished, is equivalent to "before the morning dawn."'
  - where: 'note 3:3 “Before the lamp of God went out”'
    claim: 'Samuel slept not in the holy place or before the ark but in the court, where there were cells for priests and Levites; the ark is named as the throne from which the call came'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/3.htm'
    quote: 'Samuel neither slept in the holy place by the side of the candlestick and table of shew-bread, nor in the most holy place in front of the ark of the covenant, but in the court, where cells were built for the priests and Levites'
  - where: 'note 3:3 “Before the lamp of God went out”'
    claim: 'The Masoretes punctuated the verse to guard against reading that Samuel slept in the holy place'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/3.htm'
    quote: 'to guard against the conclusion, which might be drawn from this view of היכל that Samuel slept in the holy place.'
  - where: 'note 3:3 “Before the lamp of God went out”'
    claim: '“Temple” here is the whole tabernacle with its court, as in 1:9; the ark is named as the throne from which the call came'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/3.htm'
    quote: 'but the whole tabernacle, the tent with its court, as the palace of the God-king, as in 1 Samuel 1:9 … "The ark of God, i.e., the ark of the covenant, is mentioned as the throne of the divine presence, from which the call to Samuel proceeded.'
  - where: 'note 3:3 “Before the lamp of God went out”'
    claim: 'The law had the lamp tended from evening to morning'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/27?lang=eng'
    quote: 'Aaron and his sons shall order it from evening to morning before the Lord'
  - where: 'note 3:7 “Learning a voice”'
    claim: 'The Lord was patient as Samuel learned to recognize His voice; Eli guided him while his own sight failed'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'Samuel is not at first able to recognize the voice of the Lord, but the Lord is patient with him and Samuel is eventually able to respond and learn. While Eli gives him a little bit of guidance through this process'
  - where: 'note 3:7 “Learning a voice”'
    claim: 'To know the LORD here is personal, covenant knowledge, given for the first time on this occasion'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'His personal encounter with the divine allows Samuel to know (yada) God for the first time. … The knowledge of God bestowed on this occasion is personal, powerful, and covenant-based'
  - where: 'note 3:7 “Learning a voice”'
    claim: 'Eli, though condemned, still held the high priest''s authority and was the one who understood and instructed Samuel'
    key: ot-minute-1-samuel-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-3'
    quote: 'Eli, who had been condemned for disobedience, still held the authority of the high priest, so he was the one who came to understand that the Lord was speaking to Samuel and who instructed the youth to respond to the Lord.'
  - where: 'note 3:7 “Learning a voice”'
    claim: 'The threefold speaking recurs when the Lord opens communication: 3 Nephi 11, and Moroni''s three visits to Joseph Smith'
    key: ot-minute-1-samuel-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-3'
    quote: 'This motif of speaking three times was repeated on other occasions when the Lord wanted to open communication with His people. … Moroni appeared to Joseph Smith three times in one night to repeat the message the Lord had for him.'
  - where: 'note 3:7 “Learning a voice”'
    claim: 'At Bountiful the voice was understood only the third time'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/11?lang=eng'
    quote: 'And behold, the third time they did understand the voice which they heard'
  - where: 'note 3:10 “Speak; for thy servant heareth”'
    claim: 'The call narrative ties Samuel''s name to šāmaʿ, “hear”: “God is heard,” “hearer of God”; the likelier etymology is “his name is El”'
    key: bowen-name-samuel
    url: 'https://interpreterfoundation.org/journal/if-ye-believe-on-his-name-wordplay-on-the-name-samuel-in-helaman-142-12-13-and-3-nephi-239-and-the-doctrine-of-christ-in-samuels-speech'
    quote: 'the call narrative of the biblical prophet Samuel … thoroughly ties the name Samuel to the verb šāmaʿ … creates another midrashic or interpretative meaning for the name Samuel, suggesting the idea “God is heard,” “hearer of God,”'
  - where: 'note 3:10 “Speak; for thy servant heareth”'
    claim: 'Hannah''s explanation of the name with “asked” fits Saul''s name rather than Samuel''s'
    key: bowen-name-samuel
    url: 'https://interpreterfoundation.org/journal/if-ye-believe-on-his-name-wordplay-on-the-name-samuel-in-helaman-142-12-13-and-3-nephi-239-and-the-doctrine-of-christ-in-samuels-speech'
    quote: 'this paronomastic explanation of the name Samuel in terms of the verb šāʾal (“ask”) clearly fits the name of “Saul” (šāʾûl, “asked”) rather than “Samuel” in etymological terms.'
  - where: 'note 3:10 “Speak; for thy servant heareth”'
    claim: '“Here am I” alone is not enough; Samuel''s second answer offers to hear'
    key: gonzalez-listening-samuel
    url: 'https://www.churchofjesuschrist.org/study/ensign/2010/08/listening-as-samuel-listened?lang=eng'
    quote: 'Let us not be content with simply saying, “Here am I.” Let us obediently say, “Speak; for thy servant heareth.”'
  - where: 'note 3:10 “Speak; for thy servant heareth”'
    claim: 'The more likely etymology of Samuel is “his name is El”'
    key: bowen-name-samuel
    url: 'https://interpreterfoundation.org/journal/if-ye-believe-on-his-name-wordplay-on-the-name-samuel-in-helaman-142-12-13-and-3-nephi-239-and-the-doctrine-of-christ-in-samuels-speech'
    quote: 'the more likely etymology for the name Samuel (šĕmûʾēl), at least in terms of its Hebrew spelling, appears to be “his name is El”'
  - where: 'note 3:10 “Speak; for thy servant heareth”'
    claim: 'Hannah asked and the Lord heard; in chapter 3 the son recognizes God''s voice and declares that he hears'
    key: sc-knowhy-576
    url: 'https://scripturecentral.org/knowhy/how-are-samuel-the-lamanite-and-the-biblical-prophet-samuel-similar'
    quote: 'the Lord heard her cries. A similar theme is picked up again in chapter 3, when Samuel begins his training with Eli the priest. Upon mistaking the voice of the lord three times in succession, Samuel finally recognized God’s voice'
  - where: 'note 3:10 “Speak; for thy servant heareth”'
    claim: '“Here am I” is Samuel''s only speech before his call, identical to Abraham''s answer'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'Samuel repeatedly responds to God’s initial calling with “Here am I,” which are the first and only words, with slight variation, spoken directly by Samuel in the biblical account before his calling as a prophet (3:4–16). This response is identical to Abraham’s'
  - where: 'note 3:10 “Speak; for thy servant heareth”'
    claim: '“Stood” is yatsab: the Lord appears standing while Samuel lies, the receptive position'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'the text uses the contrasting verb yatsab, translated stood, meaning that the Lord appears to Samuel in the dominant, authoritative position while Samuel takes the subordinate, receptive one.'
  - where: 'note 3:10 “Speak; for thy servant heareth”'
    claim: 'Only after Samuel showed willingness to listen did the Lord reveal His will'
    key: gonzalez-listening-samuel
    url: 'https://www.churchofjesuschrist.org/study/ensign/2010/08/listening-as-samuel-listened?lang=eng'
    quote: 'Note that the Lord called three times, and all three times Samuel replied simply, “Here am I.” Only after he showed his willingness to listen—“Speak; for thy servant heareth”—did the Lord reveal His will.'
  - where: 'note 3:13 “Made themselves vile, or cursed God?”'
    claim: 'Elsewhere the word means curse or blaspheme; best rendered “made themselves accursed”; a Jewish tradition holds the scribes altered an original “cursed me” out of reverence; the Septuagint gives the same sense'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/3.htm'
    quote: 'Elsewhere the Heb. word always means to curse, or to blaspheme, and is here best rendered made themselves accursed. There is a Jewish tradition that the original reading was ‘cursed me,’ which was altered by the scribes from motives of reverence.'
  - where: 'note 3:13 “Made themselves vile, or cursed God?”'
    claim: 'The Septuagint reads that his sons spoke evil against God'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/3.htm'
    quote: 'because his sons spoke evil against God, and he did not admonish them.'
  - where: 'note 3:13 “Made themselves vile, or cursed God?”'
    claim: 'BDB lists 1 Sam. 3:13 under cursing God, reading ʾĕlōhîm for lāhem with the Greek'
    key: bdb
    url: 'https://biblehub.com/hebrew/7043.htm'
    quote: '2 with accusative dei Exodus 22:27 (E), Leviticus 24:15 (H), 1 Samuel 3:13 (reading אֱלֹהִים for להֶם ᵐ5 Comm.)'
  - where: 'note 3:13 “Made themselves vile, or cursed God?”'
    claim: 'A modern translation reads “his sons were blaspheming God”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+3&version=NRSVUE'
    quote: 'because his sons were blaspheming God, and he did not restrain them.'
  - where: 'note 3:13 “Made themselves vile, or cursed God?”'
    claim: 'Harold B. Lee read the phrase as Eli allowing his sons to curse God, leading Israel astray (quoted in the Student Manual)'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: '‘His sons make themselves vile, and he restrained them not,’ or in other words he allowed his sons to curse God and therefore were leading the people of Israel astray.'
  - where: 'note 3:13 “Made themselves vile, or cursed God?”'
    claim: 'The sons sinned against the Lord, not merely against others'
    key: judd-eli-sons
    url: 'https://rsc.byu.edu/vol-2-no-2-2001/eli-his-sons-some-lessons-parents'
    quote: 'Eli instructed his sons that they did not merely “sin against another” person but rather they did “sin against the Lord” (1 Samuel 2:25).'
  - where: 'note 3:13 “Made themselves vile, or cursed God?”'
    claim: 'Eli was guilty of neglecting his parental duty because he restrained them not'
    key: judd-eli-sons
    url: 'https://rsc.byu.edu/vol-2-no-2-2001/eli-his-sons-some-lessons-parents'
    quote: 'Although Eli chastised Hophni and Phinehas, he apparently had not done everything he could to correct their bad behavior. Eli was guilty of neglecting his parental duties toward his sons because “he restrained them not” (1 Samuel 3:13).'
  - where: 'note 3:14 “Not purged with sacrifice”'
    claim: 'The oath makes the sentence irrevocable; it will not be expiated by any kind of sacrifice'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/3.htm'
    quote: 'shall not (אם, a particle used in an oath, equivalent to assuredly not) be expiated by slain-offerings and meat-offerings (through any kind of sacrifice) for ever." The oath makes the sentence irrevocable.'
  - where: 'note 3:14 “Not purged with sacrifice”'
    claim: 'Samuel''s message confirmed what God had already told Eli through a prophet'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/3.htm'
    quote: 'Samuel''s communication, however, simply confirmed to the aged Eli what God had already made known to him through a prophet'
  - where: 'note 3:14 “Not purged with sacrifice”'
    claim: 'Eli''s house would be cut off from the Lord''s favor; both sons dying on one day the sign'
    key: judd-eli-sons
    url: 'https://rsc.byu.edu/vol-2-no-2-2001/eli-his-sons-some-lessons-parents'
    quote: 'the Lord said that Eli and his house would be cut off from His favor and that, as a sign of the truth of the Lord’s words, both sons would die on the same day (1 Samuel 2:30–34).'
  - where: 'note 3:13 “Made themselves vile, or cursed God?”'
    claim: 'Parents are not to be assumed culpable for all their children''s conduct'
    key: judd-eli-sons
    url: 'https://rsc.byu.edu/vol-2-no-2-2001/eli-his-sons-some-lessons-parents'
    quote: 'Further, we should not assume that parents are culpable for the poor conduct of their children.'
  - where: 'note 3:17 “Eli puts Samuel under oath”'
    claim: '“God do so to me, and more also” is a self-curse formula, attested of Eli among others'
    key: parker-cutting
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/cutting-covenants'
    quote: 'the individual probably repeated a phrase similar to self-curses in which a person said, “God so do to me, and more also,” signifying that the individual expected to be cursed if they did not live up to their oath. This self-curse formula is attested from the eleventh to the eighth centuries BC among Israelites (Eli, Saul, Jonathan, Abner, David, Solomon) and non-Israelites (Ruth, Jezebel, Ben-hadad)'
  - where: 'note 3:17 “Eli puts Samuel under oath”'
    claim: 'Josephus too says Eli bound Samuel by oath, since otherwise he had no wish to grieve him'
    key: josephus-antiquities
    url: 'https://penelope.uchicago.edu/josephus/ant-5.html'
    quote: 'Which message Eli obliged the Prophet by oath to tell him. For otherwise he had no inclination to afflict him by telling it.'
  - where: 'note 3:18 “It is the LORD”'
    claim: 'Eli''s reply shows acceptance of his fate'
    key: ot-minute-1-samuel-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-3'
    quote: 'After Samuel told Eli what the Lord had said, Eli’s simple response demonstrated his acceptance of his fate.'
  - where: 'note 3:20 “Established to be a prophet”'
    claim: '“Established” is ʾāman, the same verb as Elkanah''s “establish his word” (1:23), with covenant connotations: Samuel''s rise guided by the Lord, who would sustain him'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'the narrator uses the verb ʿamen, translated establish, in order to prefigure Samuel’s auspicious priestly career in the voice of his faithful father—“only the Lord establish his word” (1:23)—and to launch Samuel’s public ministry at the story’s climax'
  - where: 'note 3:20 “Established to be a prophet”'
    claim: 'The verb suggests Samuel''s rise was guided by the Lord and that God would sustain him'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'Samuel would be sustained by God in his challenging but crucial ministry, and'
  - where: 'note 3:20 “Established to be a prophet”'
    claim: 'The verb contrasts with “cut off” in the man of God''s curse on Eli''s line'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'Establish in these contexts provides a categorical contrast with verbs repeated by the “man of God” in his condemnation of the house of Eli.'
  - where: 'note 3:20 “Established to be a prophet”'
    claim: 'Dan was the northern limit of the land, “from Dan even to Beer-sheba”'
    key: bd-dan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dan?lang=eng'
    quote: 'This town is well known as the northern limit of Palestine, which extended “from Dan even to Beer-sheba.”'
  - where: 'note 3:20 “Established to be a prophet”'
    claim: 'Beersheba was the southern limit of Israel'
    key: bd-beersheba
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/beersheba?lang=eng'
    quote: 'was regarded as the southern limit of Israel (Judg. 20:1; 1 Sam. 3:20).'
  - where: 'note 3:20 “Established to be a prophet”'
    claim: 'The Septuagint reads “faithful as a prophet”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/3.htm'
    quote: '20And all Israel knew from Dan even to Bersabee, that Samuel was faithful as a prophet to the Lord.'
  - where: christ
    claim: 'The voice that called Samuel was Jehovah''s'
    key: gonzalez-listening-samuel
    url: 'https://www.churchofjesuschrist.org/study/ensign/2010/08/listening-as-samuel-listened?lang=eng'
    quote: 'Mighty Jehovah then revealed His will to young Samuel (see 1 Samuel 3:11–14).'
  - where: christ
    claim: 'The Lord speaks now through prophets and through the Spirit; hearing means acting'
    key: gonzalez-listening-samuel
    url: 'https://www.churchofjesuschrist.org/study/ensign/2010/08/listening-as-samuel-listened?lang=eng'
    quote: 'Of course, hearing the words of the Lord through His prophets is much more than merely listening to a talk. … Similarly, hearing the words of the Lord through the Spirit is more than feeling His promptings. It is acting according to those promptings.'
  - where: christ
    claim: 'The Spirit, like the prophets, testifies of Christ'
    key: gonzalez-listening-samuel
    url: 'https://www.churchofjesuschrist.org/study/ensign/2010/08/listening-as-samuel-listened?lang=eng'
    quote: 'Like the prophets, the Spirit testifies of Christ.'
  - where: christ
