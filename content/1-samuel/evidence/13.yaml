chapter: 13
claims:
  - where: when
    claim: 'The offering came not long into Saul''s reign'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'However, not long into his reign, Saul disobeyed the Lord by performing a burnt offering instead of waiting for Samuel to do so.'

  - where: setting
    claim: 'Jonathan''s men attacked Philistine soldiers stationed in Israelite territory; knowing it meant war, Saul gathered more soldiers'
    key: ot-seminary-lesson-85
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-85-1-samuel-12-15?lang=eng'
    quote: 'a group of Israelite soldiers under the command of Saul’s son Jonathan attacked a group of Philistine soldiers stationed in Israelite territory. Knowing this attack would lead to war with the Philistines, Saul gathered additional soldiers.'
  - where: setting
    claim: 'Saul was made king at Gilgal and condemned at Gilgal'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'It was at Gilgal that young Saul was ordained king; it was also at Gilgal that he was condemned by the Lord.'
  - where: setting
    claim: 'A deep ravine with precipitous sides runs between Geba and Michmash; the scene of Jonathan''s adventure'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/13.htm'
    quote: 'Between Geba and Michmash there runs the great deep Wady es Suweinit, which goes down from Beitin and Bireh (Bethel and Beeroth) to the valley of the Jordan, and intersects the ridge upon which the two places are situated, so that the sides of the wady form very precipitous walls.'
  - where: setting
    claim: 'Saul''s rejection as king followed the Amalek disobedience'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'Later Saul disobeyed the Lord’s command to completely destroy the Amalekites. The Lord rejected Saul as king and declared that He would seek a man after His own heart to take Saul’s place.'
  - where: thread
    claim: 'Samuel had told Saul to wait seven days till he came (10:8); the people asked for a king to fight their battles (8:20)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/10?lang=eng'
    quote: 'seven days shalt thou tarry, till I come to thee, and shew thee what thou shalt do.'

  - where: section 1 plain
    claim: 'The numbers of 13:1 are missing from the Hebrew'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+13%3A1%2C21&version=NIV'
    quote: '1 Samuel 13:1 A few late manuscripts of the Septuagint; Hebrew does not have thirty.'
  - where: section 4 plain
    claim: 'pim in 13:21 is the smiths'' charge, not a file'
    key: strathearn-modern-translations
    url: 'https://rsc.byu.edu/king-james-bible-restoration/modern-english-bible-translations'
    quote: 'so translators now know this was the amount that the blacksmiths charged for sharpening various tools.'

  - where: 'note 13:1 “How old was Saul?”'
    claim: 'The Hebrew reads ben shanah, "son of a year," Saul in his reigning'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'בְּ/מָלְכ֑/וֹ'
  - where: 'note 13:1 “How old was Saul?”'
    claim: 'Taken literally the Hebrew says Saul was one year old when he became king and reigned two years'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+13%3A1%2C21&version=ESV'
    quote: '1 Samuel 13:1 Hebrew Saul was one year old when he became king, and he reigned two years over Israel'
  - where: 'note 13:1 “How old was Saul?”'
    claim: 'One modern translation prints the gaps'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+13%3A1%2C21&version=NRSVUE'
    quote: '13 Saul was . . . years old when he began to reign, and he reigned . . . and two years over Israel.'
  - where: 'note 13:1 “How old was Saul?”'
    claim: 'Another fills them: forty- added to the Hebrew two, from Acts 13:21'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+13%3A1%2C21&version=NIV'
    quote: '1 Samuel 13:1 Probable reading of the original Hebrew text (see Acts 13:21); Masoretic Text does not have forty-.'
  - where: 'note 13:1 “How old was Saul?”'
    claim: 'Paul gives Saul forty years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/13?lang=eng'
    quote: 'God gave unto them Saul the son of Cis, a man of the tribe of Benjamin, by the space of forty years.'

  - where: 'note 13:3 “Why “Hebrews”?”'
    claim: 'Hebrews is used by foreigners; here it contrasts Israel with the Philistines or views them as a subject race; LXX "The slaves have revolted"; the consonants are nearly identical'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/13.htm'
    quote: 'The name “Hebrews” is generally employed only by foreigners, or in speaking to foreigners. See note on 1 Samuel 4:6. If the text is correct, it is here used (cp. 1 Samuel 13:7) to place the nationality of Israel in contrast with the Philistines'
  - where: 'note 13:3 “Why “Hebrews”?”'
    claim: 'Cambridge: subject race; the slaves have revolted; consonants nearly identical'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/13.htm'
    quote: 'or to describe them from the Philistine point of view as the subject race. But the Sept. reads “The slaves have revolted,”'
  - where: 'note 13:3 “Why “Hebrews”?”'
    claim: 'The trumpet prepared the people to fight for their liberty'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/13.htm'
    quote: 'carried the news of Jonathan’s daring exploit throughout the country to prepare the people for a speedy summons to fight for their liberty.'
  - where: 'note 13:3 “Why “Hebrews”?”'
    claim: 'The Septuagint of 13:3 reads "The servants have despised us"'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/13.htm'
    quote: 'and Saul sounds the trumpet through all the land, saying, The servants have despised us.'
  - where: 'note 13:3 “Why “Hebrews”?”'
    claim: 'The Philistines call Israel Hebrews (4:6; 14:11, to which the footnote at 13:6 points)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/13?lang=eng'
    quote: '6a “hide”: 1 Sam. 14:11.'

  - where: 'note 13:8 “Seven days at Gilgal”'
    claim: 'The sacrifice sought the Lord''s blessings before battle, dedicated and strengthened the soldiers; Saul was not authorized to perform it'
    key: ot-seminary-lesson-85
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-85-1-samuel-12-15?lang=eng'
    quote: 'This sacrifice would be a way to seek the Lord’s blessings before the Israelite army went into battle. It would also help the soldiers dedicate themselves to the Lord and strengthen their faith. It was important for Saul to wait for Samuel because Saul was not authorized to perform the sacrifice.'
  - where: 'note 13:8 “Seven days at Gilgal”'
    claim: 'The appointment of 10:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/10?lang=eng'
    quote: 'seven days shalt thou tarry, till I come to thee, and shew thee what thou shalt do.'

  - where: 'note 13:12 “Forcing himself to seek the LORD''s favor”'
    claim: 'chalah Piel: entreat the favour of the LORD, 1 Sam 13:12 in anticipation of war'
    key: bdb
    url: 'https://biblehub.com/hebrew/2470.htm'
    quote: 'b. entreat the favour of ׳י, i.e. aim at success, prosperity, etc., through his favour, 1 Samuel 13:12 (in anticipation of war)'
  - where: 'note 13:12 “Forcing himself to seek the LORD''s favor”'
    claim: 'The Hebrew object is the face of the LORD'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'וּ/פְנֵ֥י'
  - where: 'note 13:12 “Forcing himself to seek the LORD''s favor”'
    claim: 'The Septuagint reads "I have not sought the face of the Lord"'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/13.htm'
    quote: 'and I have not sought the face of the Lord: so I forced myself and offered the whole-burnt-offering.'
  - where: 'note 13:12 “Forcing himself to seek the LORD''s favor”'
    claim: 'Saul offered as a means to hold the people; he answered defensively that he forced himself'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'He took it upon himself to offer the required sacrifices as a means to hold people to him. When Samuel arrived, he condemned Saul. Saul said defensively that the people were scattering from him and that he “forced” himself to make the offerings'

  - where: 'note 13:13 “Why the offering was wrong”'
    claim: 'Saul lacked priesthood authority; became impatient; his heart was not in line with the Lord''s will'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'Saul did not have the priesthood authority required to perform burnt offerings. However, when the appointed day came and Samuel had not yet arrived, Saul became impatient and made the offering himself. This act demonstrated that Saul’s heart was not in line with the Lord’s will as it had once been.'
  - where: 'note 13:13 “Why the offering was wrong”'
    claim: 'Talmage (quoted in the Student Manual): no right to officiate even as a deacon'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'these insignia of kingly power gave him no right to officiate even as a deacon in the Priesthood of God'
  - where: 'note 13:13 “Why the offering was wrong”'
    claim: 'The circumstances were critical; mortality tests faithfulness under all circumstances; Saul failed'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'The circumstances were critical, but one of the purposes of mortality is to demonstrate that one will remain faithful and obedient under all circumstances (see D&C 98:14–15). Saul failed that test'
  - where: 'note 13:13 “Why the offering was wrong”'
    claim: 'Instead of waiting to hear the Lord through Samuel, Saul tried to influence Him by offering a sacrifice'
    key: ot-minute-1-samuel-13
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-13'
    quote: 'Instead of waiting to hear what the Lord wanted him to do through the prophet Samuel, Saul disobeyed the Lord and tried to influence Him by offering a sacrifice.'
  - where: 'note 13:13 “Why the offering was wrong”'
    claim: 'The Amalek violation was essentially the same sin'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'This second violation was essentially the same sin of disobedience he had been guilty of before (see 1 Samuel 13:8–14).'
  - where: 'note 13:13 “What Saul lost at Gilgal”'
    claim: 'The consequence: he would lose the honor of the kingship continuing through his posterity'
    key: ot-seminary-lesson-85
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-85-1-samuel-12-15?lang=eng'
    quote: 'He would lose the honor of having the kingship continue through his posterity.'
  - where: 'note 13:13 “What Saul lost at Gilgal”'
    claim: 'The clauses are conditional; "shall not continue" means not transmitted to descendants, not rejection, which came in ch. 15; the announcement does not define the time'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/13.htm'
    quote: 'The antithesis of הכין עתּה and תקוּם לא ועתּה requires that we should understand these two clauses conditionally.'
  - where: 'note 13:13 “What Saul lost at Gilgal”'
    claim: 'Not a rejection; refers to the kingdom not being transmitted to descendants; rejection after the second transgression'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/13.htm'
    quote: 'refers to the fact that it was not established in perpetuity by being transmitted to his descendants. It was not till his second transgression that Saul was rejected, or declared unworthy of being king over the people of God (1 Samuel 15).'
  - where: 'note 13:13 “What Saul lost at Gilgal”'
    claim: 'The announcement gives God''s purpose without the time'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/13.htm'
    quote: 'for these words merely announce the purpose of God, without defining the time of its actual realization.'
  - where: 'note 13:14 “A man after his own heart”'
    claim: 'Paul quotes the verse at Antioch (Acts 13:22)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/13?lang=eng'
    quote: 'he raised up unto them David to be their king; to whom also he gave testimony, and said, I have found David the son of Jesse, a man after mine own heart, which shall fulfil all my will.'
  - where: 'note 13:14 “A man after his own heart”'
    claim: 'The verse sets the man after God''s heart against Saul, who had not kept the commandment'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/13?lang=eng'
    quote: 'the Lord hath sought him a man after his own heart, and the Lord hath commanded him to be captain over his people, because thou hast not kept that which the Lord commanded thee.'
  - where: 'note 13:19 “No smith in Israel”'
    claim: 'Israelites did not know iron working; Philistines guarded the secret; tools taken for sharpening'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'Scholars believe that at this time the Israelites did not know how to work with iron. The Philistines guarded the secret carefully to maintain superiority in weapons'
  - where: 'note 13:19 “No smith in Israel”'
    claim: 'Without weapons Israel was at a military and technological disadvantage; God asked them to trust in Him as Divine Warrior'
    key: ot-minute-1-samuel-13
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-13'
    quote: 'Not having the ability to produce or maintain weapons put the Israelites at a military and technological disadvantage. However, God did ask the people to trust in Him as the Divine Warrior.'
  - where: 'note 13:19 “No smith in Israel”'
    claim: 'The footnote at "passage" (13:23) points to 14:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/13?lang=eng'
    quote: '23a “passage”: 1 Sam. 14:4.'

  - where: 'note 13:21 “Not a file but a price”'
    claim: 'pym was unattested; translators worked from context; Geneva and KJV made it a file'
    key: strathearn-modern-translations
    url: 'https://rsc.byu.edu/king-james-bible-restoration/modern-english-bible-translations'
    quote: 'This word was unattested in other Semitic literature. Therefore their only recourse was to determine a translation through the context. The Geneva Bible, followed by the KJV, translated it as “‘a file,’ used by blacksmiths to sharpen hoes and other agricultural tools.”'
  - where: 'note 13:21 “Not a file but a price”'
    claim: 'Archaeologists found weights bearing Hebrew words, one marked pym: the smiths'' charge'
    key: strathearn-modern-translations
    url: 'https://rsc.byu.edu/king-james-bible-restoration/modern-english-bible-translations'
    quote: 'Archaeologists discovered at various places in Palestine ancient sets of weights used for business transactions, each bearing a Hebrew word.'
  - where: 'note 13:21 “Not a file but a price”'
    claim: 'A modern translation of 13:21'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+13%3A1%2C21&version=NRSVUE'
    quote: '21 The charge was two-thirds of a shekel for the plowshares and for the mattocks and one-third of a shekel for sharpening the axes and for setting the goads.'
  - where: 'note 13:21 “Not a file but a price”'
    claim: 'The word before pim is dubious, probably corrupt'
    key: bdb
    url: 'https://biblehub.com/hebrew/6477.htm'
    quote: 'dubious; probably incurably corrupt'

  - where: christ
    claim: 'Paul moves from the man after God''s heart to Jesus, of David''s seed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/13?lang=eng'
    quote: 'Of this man’s seed hath God according to his promise raised unto Israel a Saviour, Jesus'
  - where: christ
    claim: 'Under pressure Saul lacked self-discipline to stay on course and trust the Lord and His prophet'
    key: uchtdorf-few-degrees
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2008/04/a-matter-of-a-few-degrees?lang=eng'
    quote: 'When pressured by outside influences, Saul did not have the self-discipline to stay on course, trust the Lord and His prophet, and follow the pattern God had established.'
  - where: christ
    claim: 'Small errors over time make a dramatic difference'
    key: uchtdorf-few-degrees
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2008/04/a-matter-of-a-few-degrees?lang=eng'
    quote: 'But even small errors over time can make a dramatic difference in our lives.'
  - where: christ
    claim: 'The Lord will do what He promised Saul: a new heart, a new man, always with you'
    key: uchtdorf-few-degrees
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2008/04/a-matter-of-a-few-degrees?lang=eng'
    quote: 'Hearken unto the Lord your God, and He will do for you what He promised to do for Saul: He will give you a new heart, make of you a new man, and always be with you.'
  - where: christ
    claim: 'For those far off course the way back is certain: a broken heart and contrite spirit, faith in the cleansing power of the Atonement of Jesus Christ'
    key: uchtdorf-few-degrees
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2008/04/a-matter-of-a-few-degrees?lang=eng'
    quote: 'No matter how terribly off course you are, no matter how far you have strayed, the way back is certain and clear. Come, learn of the Father; offer up a sacrifice of a broken heart and a contrite spirit. Have faith, and believe in the cleansing power of the infinite Atonement of Jesus the Christ.'

  - where: setting
    claim: 'Not long into his reign Saul offered instead of waiting for Samuel'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'However, not long into his reign, Saul disobeyed the Lord by performing a burnt offering instead of waiting for Samuel to do so.'
  - where: 'note 13:1 “How old was Saul?”'
    claim: 'Thirty, Saul''s age, from a few late LXX manuscripts'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+13%3A1%2C21&version=NIV'
    quote: '1 Samuel 13:1 A few late manuscripts of the Septuagint; Hebrew does not have thirty.'
  - where: 'note 13:3 “Why “Hebrews”?”'
    claim: 'The consonants of slaves and Hebrews are almost identical and easily confused'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/13.htm'
    quote: 'The consonants of the Hebrew words for “slaves” and “Hebrews” are almost identical, and are constantly liable to be confused.'
  - where: 'note 13:3 “Why “Hebrews”?”'
    claim: 'Cambridge conjectures the words are displaced and the verse read "The Philistines heard saying, The slaves (or, the Hebrews) have revolted"'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/13.htm'
    quote: 'it may be conjectured that we should transpose the words, and read “The Philistines heard saying, The slaves (or, the Hebrews) have revolted.”'

  - where: 'note 13:5 “Thirty thousand chariots?”'
    claim: 'Scripture Helps: most scholars agree 30,000 chariots is inaccurate; some translations give 3,000; such errors come from translation mistakes and possibly scribal exaggeration'
    key: scripture-helps-1-samuel-8
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/22-1-samuel-8-10-13-15-16?lang=eng'
    quote: 'Most scholars agree that the figure of 30,000 Philistine chariots is inaccurate. Some Bible translations change the number to 3,000. Errors of this sort appear in the Bible for a variety of reasons, including mistakes in translation and possibly exaggerations from later scribes.'
  - where: 'note 13:5 “Thirty thousand chariots?”'
    claim: 'Brenton''s English Septuagint reads thirty thousand chariots'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/13.htm'
    quote: 'then come up against Israel thirty thousand chariots, and six thousand horsemen'
  - where: 'note 13:5 “Thirty thousand chariots?”'
    claim: 'The NIV prints three thousand, following some Septuagint manuscripts and the Syriac; the Hebrew has thirty thousand'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+13%3A5&version=NIV'
    quote: '1 Samuel 13:5 Some Septuagint manuscripts and Syriac; Hebrew thirty thousand'
  - where: 'note 13:5 “Thirty thousand chariots?”'
    claim: 'The ESV reads thirty thousand chariots'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+13%3A5&version=ESV'
    quote: 'the Philistines mustered to fight with Israel, thirty thousand chariots and six thousand horsemen'
  - where: 'note 13:5 “Thirty thousand chariots?”'
    claim: 'The NRSVue reads thirty thousand chariots'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+13%3A5&version=NRSVUE'
    quote: 'The Philistines mustered to fight with Israel: thirty thousand chariots, and six thousand horsemen'
  - where: 'note 13:5 “Thirty thousand chariots?”'
    claim: 'The NIV text reads three thousand chariots'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+13%3A5&version=NIV'
    quote: 'The Philistines assembled(A) to fight Israel, with three thousand chariots, six thousand charioteers'
