chapter: 28
claims:
  - where: when
    claim: 'Endor was where Saul consulted the woman the night before the battle at Gilboa'
    key: bd-endor
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/endor?lang=eng'
    quote: 'the home of the witch consulted by Saul the night before his fatal battle at Gilboa (1 Sam. 28:7).'
  - where: setting
    claim: '“Keeper of mine head” means captain of the bodyguard'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/28?lang=eng'
    quote: '“keeper of mine head”: IE captain of the bodyguard.'
  - where: setting
    claim: 'Verse 3 gives by way of introduction the facts the story needs: Samuel’s death and Saul’s expulsion of the soothsayers'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/28.htm'
    quote: '1 Samuel 28:3 states by way of introduction certain facts as the key to the incidents about to be related: (1) the death and burial of Samuel (1 Samuel 25:1); (2) Saul’s expulsion of the soothsayers.'
  - where: setting
    claim: 'The whole Philistine force marched north to the plain of Esdraelon, where chariots could move; Shunem faced Gilboa across the valley of Jezreel'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/28.htm'
    quote: 'This was no border foray, but a gathering of the whole force of the confederacy … They marched northwards along the coast to the plain of Esdraelon, the great battle-field of Palestine, where their chariots and horsemen could move freely.'
  - where: setting
    claim: 'Shunem lay opposite Jezreel and Mount Gilboa, with the valley of Jezreel between'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/28.htm'
    quote: 'on the S.W. slope of the range called Little Hermon (Neby Dûhy), opposite Jezreel and Mount Gilboa, having the deep broad valley of Jezreel between'
  - where: setting
    claim: 'Endor was in Issachar’s territory, held by Manasseh, the scene of the victory over Sisera'
    key: bd-endor
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/endor?lang=eng'
    quote: 'A place in the territory of Issachar but possessed by Manasseh (Josh. 17:11); the scene of the victory over Sisera (Ps. 83:10)'
  - where: thread
    claim: 'Endor is the culminating event of Saul’s descent: he now sought revelation through a witch'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'This is the great culminating event in Saul’s descent to evil. … Originally clean and pure, chosen by the Lord himself and given a new heart … But now he sought revelation through a witch.'
  - where: thread
    claim: 'The sentence at Endor repeats the one of 15:28 (the footnote’s cross-reference)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/28?lang=eng'
    quote: '“kingdom”: 1 Sam. 15:28.'
  - where: 'note 28:3 “Familiar spirits and wizards”'
    claim: 'A familiar spirit refers to a person who claimed to be able to speak with the dead'
    key: ot-seminary-lesson-89
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-89-1-samuel-25-31?lang=eng'
    quote: 'Explain that the phrase “hath got a familiar spirit” in verse 7 refers to a person who claimed to be able to speak with the dead.'
  - where: 'note 28:3 “Familiar spirits and wizards”'
    claim: 'The “wizard” (yiddeʿoni) is properly a knowing one, acquainted with secrets of the unseen world, and is always paired with ʾob'
    key: bdb
    url: 'https://biblehub.com/hebrew/3049.htm'
    quote: 'familiar spirit (properly either as knowing, wise (acquainted with secrets of unseen world) … familiar spirit, always "" אוֺב, אֹבוֺת 1 Samuel 28:3,9'
  - where: 'note 28:3 “Familiar spirits and wizards”'
    claim: 'Saul banished the spiritualists as the law required (Lev. 20:27; Deut. 18:9–11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/28?lang=eng'
    quote: '“put away”: IE he had banished spiritualists as required by Lev. 20:27; Deut. 18:9–11.'
  - where: 'note 28:3 “Familiar spirits and wizards”'
    claim: 'Serving God, Saul put away the mediums; fallen into darkness, he sought them and sealed his own doom'
    key: jfsmith-endor-1962
    url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02.pdf'
    quote: 'when he fell into darkness he sought the ways of darkness and sealed his own doom.'
  - where: 'note 28:6 “No answer by dreams, Urim, or prophets”'
    claim: 'Saul tried every legitimate means; as he had departed from the Lord, the Lord had departed from him'
    key: jfsmith-endor-1962
    url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02.pdf'
    quote: 'Saul had tried every legitimate means to obtain supernatural guidance, but, as he had departed from the Lord, the Lord had departed from him. There was no answer from heaven to his inquiries'
  - where: 'note 28:6 “No answer by dreams, Urim, or prophets”'
    claim: 'Instead of continuing to seek and strive to be worthy of revelation, Saul turned to wicked sources and broke the command of Lev. 19:31'
    key: ot-seminary-lesson-89
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-89-1-samuel-25-31?lang=eng'
    quote: 'Instead of being obedient to the Lord and continuing to seek and strive to be worthy of revelation, Saul chose to turn to wicked sources. By seeking out the woman from Endor, Saul broke God’s command not to turn to those with familiar spirits'
  - where: 'note 28:6 “No answer by dreams, Urim, or prophets”'
    claim: 'Chronicles gives asking counsel of a familiar spirit among the reasons Saul died'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/10?lang=eng'
    quote: 'So Saul died for his transgression which he committed against the Lord, even against the word of the Lord, which he kept not, and also for asking counsel of one that had a familiar spirit, to inquire of it;'
  - where: 'note 28:8 “In disguise, by night”'
    claim: 'KnoWhy #310 lists Saul disguising himself to get guidance from the witch of Endor among the biblical disguise stories'
    key: sc-knowhy-310
    url: 'https://scripturecentral.org/knowhy/why-did-abinadi-use-a-disguise'
    quote: 'These stories include the following narratives: (1) King Saul disguising himself in order to receive guidance from the witch of Endor (1 Samuel 28)'
  - where: 'note 28:8 “In disguise, by night”'
    claim: 'In such stories the disguise is penetrated and God’s will comes in a form unacceptable to the one seeking it'
    key: sc-knowhy-310
    url: 'https://scripturecentral.org/knowhy/why-did-abinadi-use-a-disguise'
    quote: '“one of the parties disguises himself (or in one case herself), but the disguise is penetrated, and God’s will is conveyed in a form which is liable to be quite unacceptable to the one seeking it.”'
  - where: 'note 28:8 “In disguise, by night”'
    claim: 'The stories set God against an earthly king; the kings or their heirs die and the dynasty fails'
    key: sc-knowhy-310
    url: 'https://scripturecentral.org/knowhy/why-did-abinadi-use-a-disguise'
    quote: 'These stories typically depict a contest or conflict between God and an earthly king. As Alan Goff has noted, “All of the kings or their heirs in the biblical disguise stories meet with brutal deaths, and in each case the dynasty fails.”'
  - where: 'note 28:12 “Did Samuel come?”'
    claim: 'A medium cannot bring up a prophet; either Samuel came in spite of the witch or another spirit impersonated him'
    key: bd-samuel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel?lang=eng'
    quote: 'It is certain that a witch or other medium cannot by any means available to her bring up a prophet from the world of spirits. … Either Samuel came in spite of and not because of the witch, or some other spirit came impersonating him.'
  - where: 'note 28:12 “Did Samuel come?”'
    claim: 'The scene could not have been a vision from God, since a medium cannot make a prophet appear at her request'
    key: gs-samuel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/samuel-old-testament-prophet?lang=eng'
    quote: 'This could not have been a vision from God, because a witch or other spiritual medium cannot influence a prophet to appear at his or her request.'
  - where: 'note 28:12 “Did Samuel come?”'
    claim: 'The footnote at verse 14 says this cannot be a bona fide vision from God brought about by a medium'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/28?lang=eng'
    quote: '“An old man”: This cannot be a bona fide vision from God, brought about by a spiritualist medium.'
  - where: 'note 28:12 “Did Samuel come?”'
    claim: 'Six of the fourteen JST changes in 1 Samuel are in chapter 28'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'Of the fourteen verses changed in 1 Samuel, eight are in chapters 15, 16, 18, and 19, and are concerned with only two subjects. The other six changes, all in chapter 28, relate to a single incident.'
  - where: 'note 28:12 “Did Samuel come?”'
    claim: 'JST v. 9 adds the woman’s denial; vv. 11–12 have “the words of” Samuel called up'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'The words “also, who hath not a familiar spirit” are added, which are her denial of being such a practitioner. … The JST text indicates that “the words of” Samuel were called up rather than Samuel himself (vv. 11, 12).'
  - where: 'note 28:12 “Did Samuel come?”'
    claim: 'JST v. 13 reads “the words of Samuel ascending” and adds “I saw Samuel also”; v. 15 “These are the words of Samuel”'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'The JST replaces these words with, “I saw the words of Samuel ascending out of the earth” but also adds, “And she said, I saw Samuel also.” … “These are the words of Samuel” replaces the designation of Samuel speaking to Saul.'
  - where: 'note 28:12 “Did Samuel come?”'
    claim: 'God does not operate through false mediums; the devil deceives by means close to the true'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'A further significance of these changes is that God does not operate through false mediums, but the devil will attempt to deceive through a means as close to the true principle as possible.'
  - where: 'note 28:12 “Did Samuel come?”'
    claim: 'The JST keeps the essentials of the story but has the medium bring up Samuel’s words rather than Samuel'
    key: jackson-restoring-doctrine
    url: 'https://rsc.byu.edu/understanding-joseph-smiths-translation-bible/restoring-doctrine'
    quote: 'The Joseph Smith Translation retains the essentials of the story but revises the wording by having the medium bring up Samuel’s words rather than Samuel himself.'
  - where: 'note 28:12 “Did Samuel come?”'
    claim: 'Joseph Fielding Smith, President of the Council of the Twelve, answered by repeating Charles W. Penrose’s article of May 1898'
    key: jfsmith-endor-1962
    url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02.pdf'
    quote: 'President Charles W. Penrose in May 1898, 1 wrote an excellent article on this question, and I can not do better than to repeat it … ANSWERED BY JOSEPH FIELDING SMITH PRESIDENT OF THE COUNCIL OF THE TWELVE'
  - where: 'note 28:12 “Did Samuel come?”'
    claim: 'Saul did not see the spirit; all he learned came from the woman'
    key: jfsmith-endor-1962
    url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02.pdf'
    quote: 'In the first place Saul did not see the spirit that was called up. All the information that he re- ceived was from the statement of the woman herself.'
  - where: 'note 28:12 “Did Samuel come?”'
    claim: 'Saul perceived it was Samuel through what she said; all of it could have happened without Samuel present'
    key: jfsmith-endor-1962
    url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02.pdf'
    quote: 'Saul "perceived that it was Samuel" through what the witch stated to him. The conversation that ensued between Samuel and Saul was conducted through the medium. All of this could have taken place entirely without the presence of the prophet Samuel.'
  - where: 'note 28:12 “Did Samuel come?”'
    claim: 'The Lord, who would not answer through His own channels, would not send Samuel through a source His law condemned'
    key: jfsmith-endor-1962
    url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02.pdf'
    quote: 'Why should the Lord ignore the means he himself established, and send Sam- uel, a prophet, to reveal himself to Saul through a forbidden source?'
  - where: 'note 28:12 “Did Samuel come?”'
    claim: 'Nothing in the story establishes that Samuel actually appeared'
    key: jfsmith-endor-1962
    url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02.pdf'
    quote: 'There is nothing, then, in the history of the interview between Saul and the woman of Endor which, rationally or doc- trinally, establishes the opinion that she was a prophetess of the Lord or that Samuel actually appeared on that occasion.'
  - where: 'note 28:13 “Gods ascending”'
    claim: 'The word in verse 13 is ʾelohim (H430)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'אֱלֹהִ֥ים'
  - where: 'note 28:13 “Gods ascending”'
    claim: 'ʾelohim is a plural noun'
    key: bdb
    url: 'https://biblehub.com/hebrew/430.htm'
    quote: 'אֱלֹהִים2570 noun masculine plural'
  - where: 'note 28:13 “Gods ascending”'
    claim: 'The lexicon lists 1 Sam. 28:13 under “godlike one,” the shade of Samuel, with Moses toward Aaron and Pharaoh'
    key: bdb
    url: 'https://biblehub.com/hebrew/430.htm'
    quote: 'b. godlike one Exodus 4:16 (J; Moses in relation to Aaron), Exodus 7:1 (P; in relation to Pharaoh), 1 Samuel 28:13 (the shade of Samuel)'
  - where: 'note 28:16 “Become thine enemy”'
    claim: 'The Hebrew word rendered “thine enemy” is ʿār (H6145) with the suffix'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'עָרֶֽ/ךָ'
  - where: 'note 28:16 “Become thine enemy”'
    claim: 'The noun occurs only twice; one reading emends it to “thine adversary”; the Greek and other versions read “with thy neighbour”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6145.htm'
    quote: 'II. עָר noun masculine only 2 t.: עָרֶ֑ךָ 1 Samuel 28:16 (see Dr.); read צָרֶ֑ךָ thine adversary'
  - where: 'note 28:16 “Become thine enemy”'
    claim: 'The Septuagint reads “taken part with thy neighbour,” and in v. 17 names the neighbour David'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/28.htm'
    quote: '16And Samuel said, Why askest thou me, whereas the Lord has departed from thee, and taken part with thy neighbour? 17… and will give it to thy neighbour David.'
  - where: 'note 28:19 “Thou and thy sons be with me”'
    claim: 'One older reading: “with me” is Sheol, the abode of departed spirits, righteous and wicked alike'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/28.htm'
    quote: 'with me] In Sheôl or Hades, the abode of departed spirits of righteous and wicked alike. Cp. Job 3:17; 2 Samuel 12:23.'
  - where: 'note 28:19 “Thou and thy sons be with me”'
    claim: 'A fulfilled prediction proves nothing: a little truth mixed with plausible error is how the powers of darkness deceive'
    key: jfsmith-endor-1962
    url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02.pdf'
    quote: 'If the witches, wizards, necro- mancers and familiar spirits, placed under the ban of the law, did not sometimes foretell the truth there would have been no need to warn the people against consulting them. … A little truth mixed with plausible error is one of the means by which they lead mankind astray.'
  - where: 'note 28:19 “Thou and thy sons be with me”'
    claim: 'The footnote: the effect of the message was to destroy all hope (v. 20; 31:1–4)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/28?lang=eng'
    quote: 'Its effect was to destroy all hope. See v. 20; 31:1–4.'
  - where: 'note 28:19 “Thou and thy sons be with me”'
    claim: 'The battle at Gilboa followed the night at Endor'
    key: bd-endor
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/endor?lang=eng'
    quote: 'the home of the witch consulted by Saul the night before his fatal battle at Gilboa'
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'As Saul departed from the Lord, the Lord departed from him'
    key: jfsmith-endor-1962
    url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02.pdf'
    quote: 'as he had departed from the Lord, the Lord had departed from him.'
  - where: christ
    claim: 'When God has anything to reveal, it comes by the means and persons He has appointed'
    key: jfsmith-endor-1962
    url: 'https://storage.googleapis.com/scripturecentral-prod-strapi-uploads/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02/f_endor_and_samuel_august_1962_566_567_600_601_e4adc4ea02.pdf'
    quote: 'When God has anything to reveal, it will come in the way, by the means and through the persons whom he has appointed. If the living desire to hear from the dead they should seek to the Lord'
  - where: christ
    claim: 'D&C 101:7–8: the Lord slow to hearken to those slow to hearken; in trouble of necessity they feel after Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'They were slow to hearken unto the voice of the Lord their God; therefore, the Lord their God is slow to hearken unto their prayers, to answer them in the day of their trouble.'
