chapter: 11
claims:
  - where: setting
    claim: 'Jabesh had suffered vengeance for not joining the war on Benjamin (Judg. 21:8), had recovered, and Nahash attacked it as the capital of Gilead'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/11.htm'
    quote: 'A terrible vengeance had been executed on Jabesh for its neglect to join the levy of Israel in the war against Benjamin (Jdg 21:8 ff.), but from this blow it had recovered, and Nahash now attacked it as the capital of Gilead'
  - where: setting
    claim: 'Nahash meant to enforce the Ammonite claim to part of Gilead made in Jephthah''s time'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'No doubt he intended to enforce the claim to a part of Gilead asserted by his ancestor in the time of Jephthah (see Judges 11:13).'
  - where: setting
    claim: 'The siege began shortly after Saul was chosen at Mizpeh; 12:12 implies the war had begun before'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/11.htm'
    quote: 'it is perfectly evident that Nahash commenced the siege of Jabesh shortly after the election of Saul at Mizpeh, as we may infer from the verb ויּעל, when taken in connection with the fact implied in 1 Samuel 12:12, that he had commenced the war with the Israelites before this.'
  - where: 'note 11:2 “Why the right eyes?”'
    claim: 'Texts such as the Dead Sea Scrolls predate those the King James translators used by up to a thousand years'
    key: strathearn-modern-translations
    url: 'https://rsc.byu.edu/king-james-bible-restoration/modern-english-bible-translations'
    quote: 'In some cases these texts, such as the Dead Sea Scrolls, predate those used by the King James scholars by up to a thousand years.'
  - where: 'note 11:8 “Israel and Judah counted apart”'
    claim: 'The numbers are not too large for a general levy'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/11.htm'
    quote: 'The numbers seem large, but not too large for a general levy of the nation.'
  - where: 'note 11:8 “Israel and Judah counted apart”'
    claim: 'In places a word for professional soldier has been misread as thousand'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: 'It seems clear that in a number of places the word for professional soldier has been misunderstood as meaning ‘thousand’.'
  - where: christ
    claim: 'Saul came apparently on the very day they were to be mutilated'
    key: sc-knowhy-855
    url: 'https://scripturecentral.org/knowhy/why-did-the-ammonite-king-require-the-right-eyes-of-the-people-of-jabesh-gilead-be-gouged-out-1'
    quote: 'It is similarly difficult to imagine their joy when Saul finally came to save them, apparently on the very day they were going to be mutilated (1 Samuel 11:10-11).'
  - where: when
    claim: 'The siege came soon after Saul''s appointment as king'
    key: ot-seminary-lesson-84
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-84-1-samuel-9-11?lang=eng'
    quote: 'sometime after Saul’s appointment as king of Israel, the Ammonites threatened to attack some Israelites living east of the Jordan River.'
  - where: thread
    claim: 'The new king could not expect general recognition until he had proved himself a deliverer'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/11.htm'
    quote: 'the king could not expect a general and voluntary recognition of his regal dignity and authority, especially after the conduct of the worthless people mentioned in 1 Samuel 10:27, until he had answered their expectations from a king (1 Samuel 8:6, 1 Samuel 8:20), and proved himself a deliverer'
  - where: thread
    claim: 'The victory united the tribes into one nation for the first time'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'The victory provided the catalyst for uniting the tribes into one nation for the first time.'
  - where: 'section 1 plain'
    claim: '"Come out to thee" means surrender'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/11.htm'
    quote: 'and if there is no one who saves us, we will come out to thee," i.e., will surrender to thee.'
  - where: 'section 3 plain'
    claim: 'The morning watch was the last watch of the night, before sunrise'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/11.htm'
    quote: 'the “morning watch” from 2 a.m. till sunrise.'
  - where: 'note 11:2 “Why the right eyes?”'
    claim: 'A Dead Sea Scroll of Samuel has an extra verse at the end of chapter 10'
    key: sc-knowhy-855
    url: 'https://scripturecentral.org/knowhy/why-did-the-ammonite-king-require-the-right-eyes-of-the-people-of-jabesh-gilead-be-gouged-out-1'
    quote: 'A version of 1 Samuel found in the Dead Sea Scrolls contains an extra verse at the end of 1 Samuel 10'
  - where: 'note 11:2 “Why the right eyes?”'
    claim: 'The extra verse explains the condition: Nahash had already blinded the Israelites east of the Jordan, and some had escaped to Jabesh'
    key: sc-knowhy-855
    url: 'https://scripturecentral.org/knowhy/why-did-the-ammonite-king-require-the-right-eyes-of-the-people-of-jabesh-gilead-be-gouged-out-1'
    quote: 'This extra verse helps make more sense of the condition Nahash required. Nahash had already fought with, defeated, and gouged out the eyes of the people in the other Israelite cities east of the Jordan, but some people had escaped this punishment and taken shelter in Jabesh-Gilead.'
  - where: 'note 11:2 “Why the right eyes?”'
    claim: 'The purpose: no one escapes him, and the Israelites there are handicapped against future uprisings'
    key: sc-knowhy-855
    url: 'https://scripturecentral.org/knowhy/why-did-the-ammonite-king-require-the-right-eyes-of-the-people-of-jabesh-gilead-be-gouged-out-1'
    quote: 'Presumably, this would drive home the point that nobody escapes his justice, and it would ensure the Israelites in that area would be handicapped, discouraging any future uprisings.'
  - where: 'note 11:2 “Why the right eyes?”'
    claim: 'The passage is difficult as it stands; 4QSam-a has an answer, which the NRSV prints as the last verse of chapter 10 (text of the verse)'
    key: strathearn-modern-translations
    url: 'https://rsc.byu.edu/king-james-bible-restoration/modern-english-bible-translations'
    quote: 'As it stands, there seems to be no reason why Nahash the Ammonite would only make a treaty with men of Jabesh if he “thrust out” everyone’s right eye. The Dead Sea Scrolls account in the document 4QSama seems to have an answer, [50] which the NRSV includes as the last verse of chapter 10'
  - where: 'note 11:2 “Why the right eyes?”'
    claim: 'The scroll''s verse: Nahash had been gouging out the right eye of the Gadites and Reubenites; seven thousand escaped to Jabesh'
    key: strathearn-modern-translations
    url: 'https://rsc.byu.edu/king-james-bible-restoration/modern-english-bible-translations'
    quote: 'He would gouge out the right eye of each of them and would not grant Israel a deliverer. No one was left of the Israelites across the Jordan whose right eye Nahash, king of the Ammonites, had not gouged out. But there were seven thousand men who had escaped'
  - where: 'note 11:2 “Why the right eyes?”'
    claim: 'Translations differ: NIV and CEV footnote it, ESV and NJB omit it'
    key: strathearn-modern-translations
    url: 'https://rsc.byu.edu/king-james-bible-restoration/modern-english-bible-translations'
    quote: 'The passage in the NIV and CEV is relegated to a footnote, but it is omitted altogether in the ESV and NJB.'
  - where: 'note 11:5 “A king behind the plough”'
    claim: 'After Mizpeh Saul went home to his farming, not only from humility but from a right reading of the situation'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/11.htm'
    quote: 'Saul did not seize upon the reins of government at once, but returned to his father''s house in Gibeah, and to his former agricultural occupation; not, however, merely from personal humility and want of ambition, but rather from a correct estimate of the circumstances.'
  - where: 'note 11:5 “A king behind the plough”'
    claim: 'Saul waited for God to give the occasion, since God had chosen him without his seeking'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/11.htm'
    quote: 'But as Jehovah had chosen him ruler over his people without any seeking on his part, he would wait for higher instructions to act, before he entered upon the government.'
  - where: 'note 11:5 “A king behind the plough”'
    claim: '"The herd" is the pair of oxen he had been ploughing with'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/11.htm'
    quote: '"Behind the oxen," i.e., judging from the expression "yoke of oxen" in 1 Samuel 11:7, the pair of oxen with which he had been ploughing.'
  - where: 'note 11:5 “A king behind the plough”'
    claim: 'The messengers told the people generally, not Saul; no central government'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/11.htm'
    quote: 'their messengers came to Gibeah of Saul, and laid their business before the people generally, without applying at once to Saul.'
  - where: 'note 11:5 “A king behind the plough”'
    claim: 'The king elect had gone back to farm work until he was called'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/11.htm'
    quote: 'The king elect had returned to his farm work till occasion should call him to higher duties.'
  - where: 'note 11:6 “The Spirit rushed upon Saul”'
    claim: 'tsalach means "rush," used of sudden possession by the Spirit, of Samson, Saul (10:6, 10; 11:6) and David (16:13)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6743.htm'
    quote: 'especially of sudden possession by (אֱהִֹים) ׳רוּחַ י, with עַל, with person Judges 14:6 the Spirit . . . rushed upon him, so Judges 14:19; Judges 15:14; 1 Samuel 10:6,10; 1 Samuel 11:6; with אֶל person 1 Samuel 16:13'
  - where: 'note 11:6 “The Spirit rushed upon Saul”'
    claim: 'The Old Testament ascribes power in battle to the Spirit; the Spirit came "mightily" on Samson'
    key: wilson-holy-spirit
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/holy-spirit'
    quote: 'Different books of the Old Testament attribute the work of the Spirit to the power of protection, power in battles, power in judgment, and power over generations (see Judges 3:10; Isaiah 59:19; Zechariah 4:6). Sometimes the power of the Spirit is demonstrated “mightily” as with Samson (Judges 14:6)'
  - where: 'note 11:7 “After Saul and after Samuel”'
    claim: 'Putting Samuel''s name after his own shows Saul recognized Samuel''s authority as prophet'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/11.htm'
    quote: 'The introduction of Samuel''s name after that of Saul, is a proof that Saul even as king still recognised the authority which Samuel possessed in Israel as the prophet of Jehovah.'
  - where: 'note 11:7 “After Saul and after Samuel”'
    claim: '"The fear of the LORD" is a fear inspired by Jehovah, who was seen in Saul''s appeal'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/11.htm'
    quote: 'nor the fear of Jehovah in the sense of fear of His punishment, but a fear inspired by Jehovah. In Saul''s energetic appeal the people discerned the power of Jehovah, which inspired them with fear, and impelled them to immediate obedience.'
  - where: 'note 11:7 “After Saul and after Samuel”'
    claim: 'The pieces dramatized that the crisis called for a united Israel; Saul joined his authority with Samuel''s'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'He slew his oxen and sent the pieces thereof to every tribe to dramatize that this crisis called for a united Israel (see v. 7). He joined his authority with that of Samuel in the message.'
  - where: 'note 11:8 “Israel and Judah counted apart”'
    claim: 'Not too large for a general levy of all the people'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/11.htm'
    quote: 'These numbers will not appear too large, if we bear in mind that the allusion is not to a regular army, but that Saul had summoned all the people to a general levy.'
  - where: 'note 11:8 “Israel and Judah counted apart”'
    claim: 'The separate count of Judah is a trace of the separation that later led to the division'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/11.htm'
    quote: 'In the distinction drawn between the children of Judah and the children of Israel we may already discern a trace of that separation of Judah from the rest of the tribes, which eventually led to a formal secession on the part of the latter.'
  - where: 'note 11:8 “Israel and Judah counted apart”'
    claim: 'Some date the book after the division from it; it may only show Judah''s tendency to isolation; Bezek within a day''s march of Jabesh'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/11.htm'
    quote: 'The separate numbering of Israel and Judah has been taken to mark the date of the book as posterior to the Division of the Kingdom. It may however be only an indication of a tendency on the part of Judah to isolation'
  - where: 'note 11:8 “Israel and Judah counted apart”'
    claim: 'Bezek was within a day''s march of Jabesh'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/11.htm'
    quote: 'Probably to be identified with Ibzîk, about half way between Shechem and Beth-shan, and 7 miles W. of the Jordan. It was within a day’s march of Jabesh.'
  - where: 'note 11:8 “Israel and Judah counted apart”'
    claim: 'The word for thousand, eleph, can also mean a clan or a military unit'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: '’eleph is the ordinary word for ‘thousand’, but it can also be used in a variety of other senses: e.g. ‘family’ (Judges 6:15, Revised Version) or ‘clan’ (Zechariah 9:7; 12:5, 6, Revised Standard Version) or perhaps a military unit.'
  - where: 'note 11:13 “No one dies today”'
    claim: 'Saul was wise with his opponents, quick to give God the honor, humble in these early years'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'Later, after accepting his kingship, he proved wise in managing the people who opposed him. He was a strong leader and a courageous warrior. Victorious in battle at Jabesh-gilead, he was quick to give God the honor. In these early years, he was humble and exemplary'
  - where: 'note 11:13 “No one dies today”'
    claim: 'Saul''s pride later appeared as fear of criticism and love of approval'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'Saul’s tragic flaw was pride, often manifested as a fear of criticism and a love of popular approval.'
  - where: 'note 11:14 “Renewing the kingdom”'
    claim: 'The kingdom renewed was the one founded at Mizpah'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/11.htm'
    quote: 'renew the kingdom] Which had been founded in the national assembly at Mizpah (1 Samuel 10:25).'
  - where: 'note 11:14 “Renewing the kingdom”'
    claim: 'What the renewal was is not stated; an anointing would have been mentioned; the Greek has Samuel anoint him, its own interpretation'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/11.htm'
    quote: 'In what the renewal consisted is not clearly stated … If the ceremony of anointing had been performed, it would no doubt have been mentioned, just as it is in 2 Samuel 2:4 and 2 Samuel 5:3. But ימלכוּ does not mean "they anointed," although the lxx have rendered it ἔχρισε Σαμουήλ'
  - where: 'note 11:14 “Renewing the kingdom”'
    claim: 'The renewal was probably a solemn confirmation of the Mizpeh election, with the right of the kingdom laid before king and people, sealed by sacrifice'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/11.htm'
    quote: 'The renewal of the monarchy may very well have consisted in nothing more than a solemn confirmation of the election that had taken place at Mizpeh, in which Samuel once more laid before both king and people the right of the monarchy'
  - where: 'note 11:14 “Renewing the kingdom”'
    claim: 'Peace offerings were thank offerings with a sacrificial meal, signifying fellowship with the Lord'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/11.htm'
    quote: 'These were thank-offerings, which were always connected with a sacrificial meal, and when presented on joyous occasions, formed a feast of rejoicing for those who took part, since the sacrificial meal shadowed forth a living and peaceful fellowship with the Lord.'
  - where: 'note 11:14 “Renewing the kingdom”'
    claim: 'The Greek reads that Samuel anointed Saul king, and that Samuel and all Israel rejoiced'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/11.htm'
    quote: 'And all the people went to Galgala, and Samuel anointed Saul there to be king before the Lord in Galgala, and there he offered meat-offerings and peace-offerings before the Lord: and Samuel and all Israel rejoiced exceedingly.'
  - where: 'note 11:14 “Renewing the kingdom”'
    claim: 'The Israelites confirmed Saul as king'
    key: ot-seminary-lesson-84
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-84-1-samuel-9-11?lang=eng'
    quote: 'After Saul led Israel to victory in battle against the Ammonites, the Israelites gathered together and confirmed him as king.'
  - where: 'note 11:14 “Renewing the kingdom”'
    claim: 'Gilgal, where Saul was made king, is where he was later condemned'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'It was at Gilgal that young Saul was ordained king; it was also at Gilgal that he was condemned by the Lord.'
  - where: christ
    claim: 'Jabesh-gilead''s lifelong gratitude to Saul, who rescued them'
    key: sc-knowhy-855
    url: 'https://scripturecentral.org/knowhy/why-did-the-ammonite-king-require-the-right-eyes-of-the-people-of-jabesh-gilead-be-gouged-out-1'
    quote: 'Likely because of this, these people never lost their gratitude towards Saul for what he had done for them.'
  - where: christ
    claim: 'Christ has saved all from sin and death; gratitude to Him can be like Jabesh''s toward Saul'
    key: sc-knowhy-855
    url: 'https://scripturecentral.org/knowhy/why-did-the-ammonite-king-require-the-right-eyes-of-the-people-of-jabesh-gilead-be-gouged-out-1'
    quote: 'All people have experienced God’s deliverance, as Christ has saved all people from sin and death through the power of His Atonement.'
  - where: christ
    claim: 'In success, acknowledge the hand of the Lord'
    key: ot-seminary-lesson-84
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-84-1-samuel-9-11?lang=eng'
    quote: 'make sure it is clear that when we experience success, we should acknowledge the hand of the Lord.'
  - where: explore
    claim: 'KnoWhy #855 on the right eyes and the scroll'
    key: sc-knowhy-855
    url: 'https://scripturecentral.org/knowhy/why-did-the-ammonite-king-require-the-right-eyes-of-the-people-of-jabesh-gilead-be-gouged-out-1'
    quote: 'the Dead Sea Scrolls help to explain this otherwise inexplicable treaty condition.'
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
