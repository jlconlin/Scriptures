chapter: 25
claims:
  - where: setting
    claim: 'All Israel held a public mourning for Samuel as after the death of Moses; he had served as prophet, judge and counsellor of the king'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/25.htm'
    quote: 'A public mourning was held as after the death of Moses (Deuteronomy 34:8), and the whole nation met to do honour to him, who for well nigh eighty years had gone in and out amongst them as Prophet, Judge, and Counsellor of the King.'
  - where: setting
    claim: '“In his house” means a court or garden attached to the house'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/25.htm'
    quote: 'in his house] Not actually in the house, which would have been inconsistent with the laws of ceremonial purity (Numbers 19:16), but in some court or garden attached to the house.'
  - where: setting
    claim: 'The wilderness of Paran is a general name for the desert south of the land'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/25.htm'
    quote: 'the wilderness of Paran] A general name for the great tract of desert south of Palestine, between the wilderness of Shur on the west, Edom on the east, and the wilderness of Sinai on the south.'
  - where: setting
    claim: 'The author of Samuel is uncertain; he used records including writings by Samuel'
    key: bd-samuel-books
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel-books-of?lang=eng'
    quote: 'It is uncertain who the author was or when he wrote. In order to compile his narrative he no doubt used various writings that he found already in existence, including the state chronicles (among which were writings by Samuel, Nathan, and Gad, 1 Sam. 10:25; 1 Chr. 29:29).'
  - where: setting
    claim: 'This Carmel is a town in the hill country of Judah, not the coastal headland of Elijah'
    key: bd-carmel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/carmel?lang=eng'
    quote: '(1) A hill, 1742 feet high, forming the one headland of the coast of Palestine. It is chiefly known in connection with the history of Elijah and Elisha … (2) A town in the hill country of Judah (Josh. 15:55; 1 Sam. 15:12); residence of Nabal (1 Sam. 25)'
  - where: 'note 25:3 “Abigail and Nabal”'
    claim: 'A modern Jewish translation renders “intelligent and beautiful”; Nabal married up; Abigail knew what David could do and placed herself between him and her household'
    key: heal-abigail
    url: 'https://mi.byu.edu/old-testament-reflections/abigail-in-between'
    quote: 'To say that Nabal married up would be an understatement. This “woman was intelligent and beautiful,” while Nabal, “a Calebite, was a hard man and an evildoer” (1 Samuel 25:3, JPS). … She knows who David is and what he is capable of.'
  - where: 'note 25:7 “Protection, or a protection racket?”'
    claim: 'David''s men lived among Nabal''s flocks, protecting sheep and shepherds; at shearing, a festive season, David sought a gift'
    key: heal-abigail
    url: 'https://mi.byu.edu/old-testament-reflections/abigail-in-between'
    quote: 'David has been living among the flocks and shepherds of a very wealthy man called Nabal during the winter, offering protection to both sheep and shepherds. When David hears that Nabal has started shearing the sheep, he sends some of his men to receive a gift from Nabal during this festive season'
  - where: 'note 25:7 “Protection, or a protection racket?”'
    claim: 'Scholars ask whether David was protecting the flocks or running a protection racket'
    key: heal-abigail
    url: 'https://mi.byu.edu/old-testament-reflections/abigail-in-between'
    quote: 'Was David innocently protecting Nabal’s flocks and shepherd, or was this some kind of protection racket?'
  - where: 'note 25:7 “Protection, or a protection racket?”'
    claim: 'Nabal''s servant told Abigail that David''s men protected the servants and never took the animals'
    key: ot-seminary-lesson-89
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-89-1-samuel-25-31?lang=eng'
    quote: 'The servant also told Abigail how David and his men had provided protection to Nabal’s servants and had never tried to take any of Nabal’s animals.'
  - where: 'note 25:7 “Protection, or a protection racket?”'
    claim: 'The footnote explains the idiom of verse 22 as “any male”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/25?lang=eng'
    quote: '22a “any”: What follows is a derisive term for “any male” (also v. 34).'
  - where: 'note 25:10 “Who is David?”'
    claim: 'Nabal calls David a runaway slave, failing to recognize him as the anointed future king, and dismisses his men as unknown beggars'
    key: heal-abigail
    url: 'https://mi.byu.edu/old-testament-reflections/abigail-in-between'
    quote: 'Nabal calls David a runaway slave, failing to recognize him as the anointed future king. He dismisses the young men whom David sent as unknown and undeserving beggars.'
  - where: 'note 25:10 “Who is David?”'
    claim: 'A pastoral reading: Nabal''s chief fault is failing to recognize David, who stands for the Son of David; the fool''s greatest tragedy is failing to recognize Jesus (Matt. 25:31–40)'
    key: heal-abigail
    url: 'https://mi.byu.edu/old-testament-reflections/abigail-in-between'
    quote: 'Nabal’s chief fault in this story is failing to recognize David. Now, it is difficult not to think that from a pastoral perspective, David stands in this story for the Son of David, Jesus. And the greatest tragedy of the fool is failing to recognize Jesus.'
  - where: 'note 25:24 “Upon me let this iniquity be”'
    claim: 'Abigail did not deflect or offer empty promises; she made things right and provided the demands of justice'
    key: heal-abigail
    url: 'https://mi.byu.edu/old-testament-reflections/abigail-in-between'
    quote: 'She does not seek to deflect or gaslight. She does not offer empty promises. … Instead, Abigail makes things right. She provides the demands of justice.'
  - where: 'note 25:24 “Upon me let this iniquity be”'
    claim: 'Sister Yee: as Abigail was willing to take Nabal''s sin upon herself, so the Savior took our sins and the sins of those who hurt us'
    key: yee-beauty-ashes
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/10/23yee?lang=eng'
    quote: 'Just as Abigail was willing to take Nabal’s sin upon herself, so did the Savior—in an incomprehensible way—take upon Him our sins and the sins of those who have hurt or offended us.'
  - where: 'note 25:25 “As his name is, so is he”'
    claim: 'BDB defines nabal as senseless, especially of moral and religious insensibility'
    key: bdb
    url: 'https://biblehub.com/hebrew/5036.htm'
    quote: 'I. נָבָל adjective foolish, senseless, especially of the man who has no perception of ethical and religious claims, and with collateral idea of ignoble, disgraceful'
  - where: 'note 25:25 “As his name is, so is he”'
    claim: 'The nabal is not a harmless simpleton but a vicious, materialistic, egocentric misfit (Levenson, as quoted)'
    key: heal-abigail
    url: 'https://mi.byu.edu/old-testament-reflections/abigail-in-between'
    quote: '“The Hebrew word nābāl, often translated as ‘fool,’ designates not a harmless simpleton, but rather a vicious, materialistic, and egocentric misfit.”'
  - where: 'note 25:25 “As his name is, so is he”'
    claim: 'Isaiah 32:6 lists refusal to feed the hungry and give drink to the thirsty, Nabal''s sin, among the marks of the nabal'
    key: heal-abigail
    url: 'https://mi.byu.edu/old-testament-reflections/abigail-in-between'
    quote: 'Most significant for our purposes is Isa 32:6, in which the refusal to feed the hungry and give drink to the thirsty, precisely the sin of Nabal in 1 Samuel 25, is listed among the characteristics of the nābāl.'
  - where: 'note 25:28 “A sure house”'
    claim: 'The footnote glosses “sure” as firm house, an assurance of descendants, and points to 1 Sam. 2:35'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/25?lang=eng'
    quote: '28a “sure”: OR firm house; an assurance of descendants.'
  - where: 'note 25:28 “A sure house”'
    claim: 'Abigail''s conviction that David will reign rests on his being champion of the LORD''s people (cf. 18:17) and his blameless life; compare 2 Sam. 7:16; violence would burden his conscience (30–31)'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/25.htm'
    quote: 'Abigail grounds her request on the conviction that David will succeed to the kingdom, when, as she points out in 1 Samuel 25:30-31, such an act of violence … would be a burden on his conscience. Her conviction rests (1) on … the champion of Jehovah’s people (see on 1 Samuel 18:17); (2) on his blameless life.'
  - where: 'note 25:28 “A sure house”'
    claim: 'A sure house means establishing him and his posterity on the throne; compare 2 Sam. 7:16'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/25.htm'
    quote: 'will certainly make my lord a sure house] Will establish him and his posterity on the throne. For the phrase see 1 Samuel 2:35; and compare the promise in 2 Samuel 7:16.'
  - where: 'note 25:29 “The bundle of life and the sling”'
    claim: 'The Hebrew of 25:29 has tsror, “bundle”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'בִּ/צְר֣וֹר'
  - where: 'note 25:29 “The bundle of life and the sling”'
    claim: 'BDB: tsror is bundle, parcel, pouch, properly something bound up; of money in Gen. 42:35; figurative at 1 Sam. 25:29'
    key: bdb
    url: 'https://biblehub.com/hebrew/6872.htm'
    quote: 'bundle, parcel, pouch, bag (properly a binding, i.e. something bound up); … bundle or pouch (purse) of money Genesis 42:35 (twice in verse) (E) … 1 Samuel 25:29 (figurative'
  - where: 'note 25:29 “The bundle of life and the sling”'
    claim: 'The metaphor is from binding up valuables; it refers first to safe preservation on earth, not primarily eternal life; the Lord will not let such a one perish even in death; the cup of the sling'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/25.htm'
    quote: 'The metaphor is taken from the custom of binding up valuable things in a bundle, to prevent their being injured. The words do not refer primarily to eternal life with God in heaven, but only to the safe preservation of the righteous on this earth'
  - where: 'note 25:29 “The bundle of life and the sling”'
    claim: 'The Lord will not let one hidden in his fellowship perish, even when death comes'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/25.htm'
    quote: 'But whoever is so hidden in the gracious fellowship of the Lord in this life, that no enemy can harm him or injure his life, the Lord will not allow to perish, even though temporal death should come'
  - where: 'note 25:29 “The bundle of life and the sling”'
    claim: 'The figure is from binding up valuables; it refers to David''s temporal life; “sling out” is a metaphor of total rejection (Jer. 10:18); the middle is the hollow where the stone sat'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/25.htm'
    quote: 'The figure is taken from the practice of binding up valuables in a bag or bundle. … the immediate reference is only to the safe preservation of David’s temporal life. shall he sling out, &c.] A vigorous metaphor to express total rejection. Cp. Jeremiah 10:18. the middle of a sling] Lit. the pan or hollow in which the stone was placed.'
  - where: 'note 25:39 “The LORD pleaded the cause”'
    claim: 'Nabal was terrified at what he had narrowly escaped and may have suffered a stroke or heart attack'
    key: ot-manual-1-samuel-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-16-31-king-davids-call-to-lead-israel?lang=eng'
    quote: 'This statement was a way of saying that Nabal was terrified to think of what he had narrowly escaped only because David heeded his wife’s plea. He may have suffered a stroke or heart attack because of the shock.'
  - where: christ
    claim: 'Abigail took responsibility and sought forgiveness; Christ pleads as Advocate'
    key: scripture-helps-1-samuel-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/23-1-samuel-17-18-24-26-2-samuel-5-7?lang=eng'
    quote: 'Abigail not only took full responsibility for Nabal’s actions, but she also humbly sought David’s forgiveness for her husband’s mistakes. Similarly, Jesus Christ pleads on our behalf before the Father as our Advocate and Mediator.'
  - where: christ
    claim: 'The Savior took our sins and those of people who hurt us, and made a way to let go of a vengeful heart through forgiving'
    key: yee-beauty-ashes
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/10/23yee?lang=eng'
    quote: 'He made a way for us to let go of a vengeful heart. That “way” is through forgiving—which can be one of the most difficult things we ever do and one of the most divine things we ever experience.'
  - where: christ
    claim: 'The Savior offers those who have been hurt the help needed to be healed; they are not left to deal with others'' actions alone'
    key: yee-beauty-ashes
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/10/23yee?lang=eng'
    quote: 'the Savior offers to those who have been hurt and injured the sustenance and help we need to be healed and made whole. We are not left to deal with the consequences of others’ actions on our own'
  - where: explore
    claim: 'Heal''s reflection on 1 Samuel 25'
    key: heal-abigail
    url: 'https://mi.byu.edu/old-testament-reflections/abigail-in-between'
    quote: 'Abigail made peace. When justice was due, Abigail made peace.'
