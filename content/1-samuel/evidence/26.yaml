chapter: 26
claims:
  - where: setting
    claim: 'David spared Saul twice, at En-gedi and in the wilderness of Ziph'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'Twice he spared Saul’s life—first in the dark cave at En-Gedi, and second in Saul’s camp in the wilderness of Ziff.'
  - where: setting
    claim: 'After this, David did not believe Saul and moved his family among the Philistines'
    key: ot-seminary-lesson-89
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-89-1-samuel-25-31?lang=eng'
    quote: 'Later, when King Saul discovered that David had spared his life again, he said he would no longer seek David’s life. David did not believe Saul, so he moved his family to live among the Philistines.'

  - where: setting
    claim: 'Chapter 26 is the last confrontation of David and Saul'
    key: gordon-narrative-analogy
    url: 'https://www.tyndalebulletin.org/article/30594-david-s-rise-and-saul-s-demise-narrative-analogy-in-1-samuel-24-26.pdf'
    quote: 'Chapter 26 recounts the last confrontation between the two, and the narrator makes the most of the'
  - where: thread
    claim: 'Chapter 26 is the last confrontation of David and Saul; the distance between them is more than physical'
    key: gordon-narrative-analogy
    url: 'https://www.tyndalebulletin.org/article/30594-david-s-rise-and-saul-s-demise-narrative-analogy-in-1-samuel-24-26.pdf'
    quote: 'Chapter 26 recounts the last confrontation between the two, and the narrator makes the most of the'
  - where: thread
    claim: 'The distance and space of verse 13 are not just physical; the two are poles apart'
    key: gordon-narrative-analogy
    url: 'https://www.tyndalebulletin.org/article/30594-david-s-rise-and-saul-s-demise-narrative-analogy-in-1-samuel-24-26.pdf'
    quote: 'The ''distance'' and ''space'' are surely not just physical here; in outlook and destiny the two are poles apart and already, even before the speeches, the gulf is fixed. Nothing that Saul can say will change the situation.'

  - where: section 2 plain
    claim: 'The “trench” is a barricade (Church footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/26?lang=eng'
    quote: '“trench”: IE barricade.'
  - where: section 2 plain
    claim: '“At once” means “with one stroke”'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/26.htm'
    quote: 'at once] Not “immediately,” but “with one stroke.”'

  - where: 'note 26:1 “The same story, a second time”'
    claim: 'Scholars once took the chapters around 25 as from different sources; they are now read as one unit about Saul and David, Nabal standing for Saul'
    key: heal-abigail
    url: 'https://mi.byu.edu/old-testament-reflections/abigail-in-between'
    quote: 'rather than seeing 1 Samuel 25 as an awkward interlude between two chapters dealing with David and Saul, chapters that Henry Smith thought were from different sources, scholars now consider 1 Samuel 24–26 to be a coherent unit.'
  - where: 'note 26:1 “The same story, a second time”'
    claim: 'Saul''s words in chapter 26 are weaker than his affirmation at En-gedi (24:20)'
    key: gordon-narrative-analogy
    url: 'https://www.tyndalebulletin.org/article/30594-david-s-rise-and-saul-s-demise-narrative-analogy-in-1-samuel-24-26.pdf'
    quote: 'Saul''s speeches in chapter 26 are anti-climactic when set alongside his affirmations at En-gedi. The most that he can manage is, ''Blessed be you, my son David! You will do many things and will have success'' (26:25).'
  - where: 'note 26:1 “The same story, a second time”'
    claim: 'The speeches of chapter 26 are shaped by the irreconcilability of David and Saul and by David''s coming withdrawal to Philistia'
    key: gordon-narrative-analogy
    url: 'https://www.tyndalebulletin.org/article/30594-david-s-rise-and-saul-s-demise-narrative-analogy-in-1-samuel-24-26.pdf'
    quote: 'to judge the speeches of chapter 26 by the canons of chapter 24 is to fail to recognize that they are animated by other considerations, namely, the irreconcilability of David and Saul, and David 1 s imminent withdrawal to Philistia.'
  - where: 'note 26:1 “The same story, a second time”'
    claim: 'David spared Saul twice, in the cave at En-gedi and in Saul''s camp in Ziph'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'Twice he spared Saul’s life—first in the dark cave at En-Gedi, and second in Saul’s camp in the wilderness of Ziff.'

  - where: 'note 26:6 “David''s two companions”'
    claim: 'Zeruiah was a sister of Jesse''s sons, and Abishai, Joab and Asahel were her sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/2?lang=eng'
    quote: 'Whose sisters were Zeruiah, and Abigail. And the sons of Zeruiah; Abishai, and Joab, and Asahel, three.'
  - where: 'note 26:6 “David''s two companions”'
    claim: 'The Hittites descended from Heth and were a branch of the Canaanites'
    key: bd-hittites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hittites?lang=eng'
    quote: 'The ancient people descended from Heth (Gen. 10:15). They were a branch of the Canaanites'

  - where: 'note 26:11 “The king''s spear”'
    claim: 'The same Hebrew word for Saul''s spear stands in 18:10–11, 19:9–10, 20:33, 22:6 and through chapter 26 (KJV “javelin” in some)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'וַ/חֲנִית֥/וֹ'
  - where: 'note 26:11 “The king''s spear”'
    claim: 'David and Saul both knew the significance of the spear in their relationship (18:10–11; 19:9–10)'
    key: gordon-narrative-analogy
    url: 'https://www.tyndalebulletin.org/article/30594-david-s-rise-and-saul-s-demise-narrative-analogy-in-1-samuel-24-26.pdf'
    quote: 'To his invitation - or is it a plea? - to come -back David merely replies, ''Here is· the spear, 0 king!'' (v. 22) ./67/ David knew, and Saul knew, the significance of the spear in their relationship'
  - where: 'note 26:11 “The king''s spear”'
    claim: 'David took the spear and water as proof and chided Abner'
    key: ot-manual-1-samuel-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-16-31-king-davids-call-to-lead-israel?lang=eng'
    quote: 'As proof, David took the king’s spear and bottle of water, carried them to the other side of the ravine, and then chided Abner, the king’s captain, for his failure to protect the king.'

  - where: 'note 26:12 “A deep sleep from the LORD”'
    claim: 'Tardemah is a deep sleep, usually falling on a person by supernatural agency; Gen. 2:21; 15:12'
    key: bdb
    url: 'https://biblehub.com/hebrew/8639.htm'
    quote: 'deep sleep, usually with … person, and usually by supernatural agency'
  - where: 'note 26:12 “A deep sleep from the LORD”'
    claim: 'The Hebrew of 26:12 reads tardemat YHWH, a deep sleep of the LORD'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'תַּרְדֵּמַ֣ת'

  - where: 'note 26:15 “David''s taunt of Abner”'
    claim: 'Abner was captain of Saul''s army'
    key: bd-abner
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abner?lang=eng'
    quote: 'Captain of Saul’s army (1 Sam. 14:50; 17:55; 20:25; 26:5–15); makes Ishbosheth king (2 Sam. 2:8–9); defeated by Joab, slays Asahel (2:12–32); revolts to David (3:6–21); killed by Joab (3:27)'
  - where: 'note 26:15 “David''s taunt of Abner”'
    claim: 'The reproaches were meant for Saul''s hearing, to show David the most faithful defender of his life'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/26.htm'
    quote: 'These reproaches that were cast at Abner were intended to show to Saul, who might at any rate possibly hear, and in fact did hear, that David was the most faithful defender of his life, more faithful than his closest and most zealous servants.'
  - where: 'note 26:15 “David''s taunt of Abner”'
    claim: '“Worthy to die” is literally “sons of death”'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/26.htm'
    quote: '16. worthy to die] Lit. sons of death. Cp. 1 Samuel 20:31.'
  - where: 'note 26:19 “Driven from the LORD''s inheritance”'
    claim: 'If the LORD stirred Saul up, David would seek pardon by an offering; many older commentators connect the words with the evil spirit'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/26.htm'
    quote: 'Saul may be acting as the executioner of a divine punishment. In that case David desires to obtain pardon by a propitiatory offering. This seems the obvious explanation. But according to the view of many commentators, David suggests that this perverse persecution is the consequence of the evil spirit continuing to vex Saul'
  - where: 'note 26:19 “Driven from the LORD''s inheritance”'
    claim: '“Accept an offering” is literally “smell”; compare Gen. 8:21'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/26.htm'
    quote: 'let him accept an offering] Lit. smell. Cp. Genesis 8:21.'
  - where: 'note 26:19 “Driven from the LORD''s inheritance”'
    claim: 'Being driven from the land meant separation from the people and sanctuary of the LORD, as good as serving other gods'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/26.htm'
    quote: 'The meaning is this: They have carried it so far now, that I am obliged to separate from the people of God, to fly from the land of the Lord, and, because far away from His sanctuary, to serve other gods.'
  - where: 'note 26:19 “Driven from the LORD''s inheritance”'
    claim: 'Banishment was tantamount to serving false gods, since the LORD was worshipped in the land of promise'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/26.htm'
    quote: 'such a banishment is tantamount to bidding me go serve false gods, for it is only in the land of promise and at the place which He has chosen that Jehovah manifests Himself and can be worshipped.'
  - where: 'note 26:19 “Driven from the LORD''s inheritance”'
    claim: 'Verse 20 may be rendered “far from the presence of the LORD”: let me not die in a heathen land'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/26.htm'
    quote: 'But it is possible to render “far from the presence of Jehovah:” i.e. let me not die a violent death in a heathen land: and this suits the context better.'
  - where: 'note 26:19 “Driven from the LORD''s inheritance”'
    claim: 'Verse 20 may mean: do not kill me, lest the LORD avenge my blood'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/26.htm'
    quote: 'Slay me not, lest Jehovah avenge my blood upon thee.'
  - where: 'note 26:19 “Driven from the LORD''s inheritance”'
    claim: 'Verses 19–20 introduce David''s flight to Philistia announced in 27:1'
    key: gordon-narrative-analogy
    url: 'https://www.tyndalebulletin.org/article/30594-david-s-rise-and-saul-s-demise-narrative-analogy-in-1-samuel-24-26.pdf'
    quote: 'In 26:13-25, then, the way is being paved for David''s initiative announced in 27:1'

  - where: 'note 26:19 “Driven from the LORD''s inheritance”'
    claim: 'Smelling a sacrifice denotes the divine satisfaction (Gen. 8:21)'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/26.htm'
    quote: 'Smelling a sacrifice is an anthropomorphic term, used to denote the divine satisfaction (cf. Genesis 8:21).'
  - where: 'note 26:19 “Driven from the LORD''s inheritance”'
    claim: 'David''s enemies did not literally say “Go, serve other gods”; David was thinking of deeds'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/26.htm'
    quote: '"We are not to understand that the enemies of David were actually accustomed to use these very words, but David was thinking of deeds rather than words" (Calvin).'
  - where: 'note 26:21 “I have played the fool”'
    claim: 'Nabal''s death is the key to David''s confidence in 26:10'
    key: gordon-narrative-analogy
    url: 'https://www.tyndalebulletin.org/article/30594-david-s-rise-and-saul-s-demise-narrative-analogy-in-1-samuel-24-26.pdf'
    quote: 'The manner of Nabal''s death provides the key to David''s confident assertion in 26:10'
  - where: 'note 26:21 “I have played the fool”'
    claim: 'Saul said he would no longer seek David''s life; David did not believe him'
    key: ot-seminary-lesson-89
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-89-1-samuel-25-31?lang=eng'
    quote: 'he said he would no longer seek David’s life. David did not believe Saul, so he moved his family to live among the Philistines.'
  - where: 'note 26:21 “I have played the fool”'
    claim: 'The verb of 26:21 is the one Samuel used at Gilgal, 13:13'
    key: gordon-narrative-analogy
    url: 'https://www.tyndalebulletin.org/article/30594-david-s-rise-and-saul-s-demise-narrative-analogy-in-1-samuel-24-26.pdf'
    quote: 'This is the verb with which Samuel launches into his denunciation of Saul at Gilgal'
  - where: 'note 26:21 “I have played the fool”'
    claim: 'The Hebrew verb in 26:21 is hiskalti (H5528)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'הִסְכַּ֛לְתִּי'
  - where: 'note 26:21 “I have played the fool”'
    claim: 'The Hebrew verb in 13:13 is niskalta (H5528)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'נִסְכָּ֑לְתָּ'
  - where: 'note 26:21 “I have played the fool”'
    claim: 'Gordon asks whether “I have played the fool” points back to Nabal'
    key: gordon-narrative-analogy
    url: 'https://www.tyndalebulletin.org/article/30594-david-s-rise-and-saul-s-demise-narrative-analogy-in-1-samuel-24-26.pdf'
    quote: 'does the admission ''I have played the fool'' point back to chapter 25 and the figure of Nabal?'
  - where: 'note 26:21 “I have played the fool”'
    claim: '“Smite” in 26:10 and 25:38 is the same verb, which sets Saul beside Nabal; Saul did die in battle (31:6)'
    key: gordon-narrative-analogy
    url: 'https://www.tyndalebulletin.org/article/30594-david-s-rise-and-saul-s-demise-narrative-analogy-in-1-samuel-24-26.pdf'
    quote: 'the mere repetition of which is sufficient to point up the comparison between Saul and Nabal.'
  - where: 'note 26:21 “I have played the fool”'
    claim: 'Saul died in battle on Gilboa, but the first clause, “the LORD shall smite him,” carries the accent'
    key: gordon-narrative-analogy
    url: 'https://www.tyndalebulletin.org/article/30594-david-s-rise-and-saul-s-demise-narrative-analogy-in-1-samuel-24-26.pdf'
    quote: 'At the purely historical level it is a fact that Saul went into battle against the Philistines and perished on Gilboa (1 Sam. 31:6). But, seen from the perspective of the wider narrative context, it is the first clause which carries the accent'
  - where: 'note 26:21 “I have played the fool”'
    claim: 'The verb “smite” in 26:10 and 25:38 is the same (H5062)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'וַ/יִּגֹּ֧ף'

  - where: christ
    claim: 'In verse 23 David asks the Lord to judge his works as compared to Saul''s'
    key: ot-manual-1-samuel-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-16-31-king-davids-call-to-lead-israel?lang=eng'
    quote: 'When David said, “The Lord render to every man his righteousness and his faithfulness” (v. 23), he was asking the Lord to judge his works as compared to Saul’s works.'
