chapter: 19
claims:
  - where: setting
    claim: 'Saul commanded Jonathan and his servants to kill David; Jonathan persuaded Saul to promise not to; after another victory Saul''s jealousy returned and he tried repeatedly to kill David'
    key: ot-seminary-lesson-88
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-88-1-samuel-18-24?lang=eng'
    quote: 'Jonathan informed David of his father’s plans and persuaded Saul to promise not to kill David. However, after David returned victorious from another battle with the Philistines, Saul’s jealousy returned and he tried repeatedly to kill David.'
  - where: setting
    claim: 'In chapter 20, after leaving Samuel, David meets Jonathan and they make a covenant of friendship'
    key: ot-seminary-lesson-88
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-88-1-samuel-18-24?lang=eng'
    quote: 'Explain that in 1 Samuel 20 we learn that after David left the prophet Samuel, David met with Jonathan and they made a covenant of friendship.'

  - where: thread
    claim: 'Saul struggled against the decision of God, personified in David; there was no fault in David'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'As he struggled against the decision of God, personified in David, he became more and more aware that his efforts were futile. But this dawning recognition was at war with his stubborn will. There was no fault in David'
  - where: thread
    claim: 'Saul''s own children, first Michal and then Jonathan, supported David because they knew his hatred was unjustified'
    key: ot-manual-1-samuel-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-16-31-king-davids-call-to-lead-israel?lang=eng'
    quote: 'Even his own children, first Michal and then Jonathan, supported David because they knew their father’s hatred was unjustified.'
  - where: thread
    claim: 'On the older reading, the Spirit at Naioth was to teach Saul that in fighting David he was fighting against God'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/19.htm'
    quote: 'He was to be taught, if his heart was not already too utterly hardened to learn, that in fighting against David he was fighting against God, and engaging in a futile struggle.'

  - where: 'section 2 plain'
    claim: 'The Joseph Smith Translation of 19:9 reads that the evil spirit was not of the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/19?lang=eng'
    quote: 'JST 1 Sam. 19:9 … which was not of the Lord …'

  - where: 'note 19:4 “Jonathan speaks good of David”'
    claim: 'Jonathan warned David, helped him hide, and spoke to his father of David''s virtues so successfully that Saul vowed David''s life would be preserved'
    key: holland-real-friendship
    url: 'https://www.churchofjesuschrist.org/study/new-era/1998/06/real-friendship?lang=eng'
    quote: 'But the ever-faithful Jonathan warned his friend, helped him hide out of Saul’s view, and continually spoke to his father of David’s virtues. He was so successful in praising David that Saul repented and made a vow that David’s life would be preserved.'
  - where: 'note 19:4 “Jonathan speaks good of David”'
    claim: 'After David returned victorious from another battle, Saul''s jealousy returned and he tried repeatedly to kill David'
    key: ot-seminary-lesson-88
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-88-1-samuel-18-24?lang=eng'
    quote: 'However, after David returned victorious from another battle with the Philistines, Saul’s jealousy returned and he tried repeatedly to kill David.'

  - where: 'note 19:11 “Michal saves her husband”'
    claim: 'Saul had hoped to use Michal to get David killed; later she lied to her father and helped David escape'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'Saul had hoped to use his daughter Michal as a temptation to get David killed by the Philistines. But David survived and married Michal. Later, she lied to her father and helped David escape when Saul commanded his soldiers to kill David while he slept.'
  - where: 'note 19:11 “Michal saves her husband”'
    claim: 'Michal was Saul''s second daughter and David''s wife; the Bible Dictionary lists her story'
    key: bd-michal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/michal?lang=eng'
    quote: 'Saul’s second daughter, wife of David (1 Sam. 14:49; 18:20, 27; 19:11–13, 17; 25:44; 2 Sam. 3:13–16; 6:16, 23).'
  - where: 'note 19:11 “Michal saves her husband”'
    claim: 'The title of Psalm 59 sets it on the night Saul sent men to watch the house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/59?lang=eng'
    quote: 'when Saul sent, and they watched the house to kill him.'

  - where: 'note 19:13 “The image in the bed”'
    claim: 'The image is the teraphim; teraphim were a kind of idol, object of reverence and means of divination; here man-sized; in a household shrine (Judg. 17:5); condemned (1 Sam. 15:23; 2 Kgs. 23:24)'
    key: bdb
    url: 'https://biblehub.com/hebrew/8655.htm'
    quote: 'a kind of idol, object of reverence, and means of divination … portable and sometimes small Genesis 31:19,34 … but in size and shape like a man 1 Samuel 19:13,16; in household shrine … Judges 17:5 … condemned 1 Samuel 15:23; 2 Kings 23:24'
  - where: 'note 19:13 “The image in the bed”'
    claim: 'The Bible Dictionary: teraphim of the size and form of a man; using them was probably worshiping the true God in a corrupt manner'
    key: bd-teraphim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/teraphim?lang=eng'
    quote: 'Images of the size and form of a man (1 Sam. 19:13, 16) … To use teraphim was probably not to worship strange gods but to worship the true God in a corrupt manner.'
  - where: 'note 19:13 “The image in the bed”'
    claim: 'The “pillow” is probably a netted quilt or fly-net spread over the face of a sleeper'
    key: bdb
    url: 'https://biblehub.com/hebrew/3523.htm'
    quote: 'probably something netted, i.e. either a quilt or … a fly-net (κωνωπεῖον) spread over the face while a person was asleep; 1 Samuel 19:13,16 כְּבִיר הָעִזִּים a quilt (or fly-net) of goats (’ hair).'
  - where: 'note 19:13 “The image in the bed”'
    claim: 'The Church footnote to “image” points to Judg. 17:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/19?lang=eng'
    quote: '“image”: Judg. 17:5.'

  - where: 'note 19:18 “David goes to the prophet”'
    claim: 'David sought out Samuel the prophet for counsel and advice'
    key: ellsworth-tragic-saul
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/06/the-tragic-dimensions-of-saul?lang=eng'
    quote: 'David had already sought out Samuel the prophet for counsel and advice.'
  - where: 'note 19:18 “David goes to the prophet”'
    claim: 'Naioth is probably a proper name of a place in Ramah, possibly “habitations” but doubtful; the abode of prophets'
    key: bdb
    url: 'https://biblehub.com/hebrew/5121.htm'
    quote: 'proper name, of a location in Ramah (possibly = habitations, but dubious, see Dr1Samuel 19:18 HPS); — adode of prophets 1 Samuel 19:18,19,22,23'
  - where: 'note 19:18 “David goes to the prophet”'
    claim: 'On the older reading, Naioth was the common dwelling of the company of prophets at Ramah under Samuel, who also had his own house there'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/19.htm'
    quote: 'there was a company of prophets at Ramah, under the superintendence of Samuel, whose members lived in a common building (נוית), and that Samuel had his own house at Ramah (1 Samuel 7:17), though he sometimes lived in the Naioth'
  - where: 'note 19:18 “David goes to the prophet”'
    claim: 'The Student Manual: Samuel conducted a school of the prophets; Joseph Smith set up a similar school in Kirtland'
    key: ot-manual-1-samuel-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-16-31-king-davids-call-to-lead-israel?lang=eng'
    quote: 'This fact is of interest to Latter-day Saints because Joseph Smith set up a similar school in Kirtland, Ohio, to help teach priesthood holders their special duties.'
  - where: 'note 19:18 “David goes to the prophet”'
    claim: 'D&C 88 names the school of the prophets, for the instruction of those called to the ministry'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'the order of the house prepared for the presidency of the school of the prophets, established for their instruction in all things that are expedient for them, even for all the officers of the church'

  - where: 'note 19:20 “The Spirit on Saul’s messengers”'
    claim: 'A spiritual phenomenon saved David; “they also prophesied” refers to singing or chanting praises to God (Rasmussen, quoted in the seminary manual)'
    key: ot-seminary-lesson-88
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-88-1-samuel-18-24?lang=eng'
    quote: '“A spiritual phenomenon” saved David from Saul and his messengers … The phrase “they also prophesied” (1 Samuel 19:20) refers to “a religious exercise of singing or chanting praises to God”'
  - where: 'note 19:20 “The Spirit on Saul’s messengers”'
    claim: 'Because of the Lord''s influence, Saul was unable to take David'
    key: ot-seminary-lesson-88
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-88-1-samuel-18-24?lang=eng'
    quote: 'However, because of the Lord’s influence, Saul was unable to take him.'
  - where: 'note 19:20 “The Spirit on Saul’s messengers”'
    claim: 'Whoever the Spirit endows is empowered to work for God, as with the seventy elders; a similar experience in 1 Sam. 19:20'
    key: wilson-holy-spirit
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/holy-spirit'
    quote: 'The story of Moses’s lesson in delegation teaches that whoever the Spirit endows is empowered to work for God … (Numbers 11:17, 25; a similar experience happened in 1 Samuel 19:20 when Saul’s servants prophesied).'
  - where: 'note 19:20 “The Spirit on Saul’s messengers”'
    claim: 'The footnote to “prophets” in 19:20 points to 1 Sam. 10:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/19?lang=eng'
    quote: '“prophets”: 1 Sam. 10:10.'

  - where: 'note 19:24 “Stripped before Samuel”'
    claim: 'The Hebrew word for naked does not always mean complete nudity but a person with his upper garment off'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/19.htm'
    quote: 'ערום, γυμνός, does not always signify complete nudity, but is also applied to a person with his upper garment off (cf. Isaiah 20:2; Micah 1:8; John 21:7).'
  - where: 'note 19:24 “Stripped before Samuel”'
    claim: 'Not literally naked, but stripped of his outer garment'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/19.htm'
    quote: '24. naked] Not literally naked, but stripped of his outer garment.'
  - where: 'note 19:24 “Stripped before Samuel”'
    claim: 'The inspiration seized Saul before he reached the prophets; he was struck down more completely than his servants, to teach him he was fighting against God'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/19.htm'
    quote: 'The inspiration seized Saul even before he reached the company of prophets. He was to be convinced of the irresistible might of the Divine Spirit against whose influence he had striven.'
  - where: 'note 19:24 “Stripped before Samuel”'
    claim: 'Saul alone lay there all day and night; seized more powerfully because he had most obstinately resisted grace, that his hard heart might be broken'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/19.htm'
    quote: 'Saul was seized by this mighty influence of the Spirit of God in a more powerful manner than his servants were, both because he had most obstinately resisted the leadings of divine grace, and also in order that, if it were possible, his hard heart might be broken'
  - where: 'note 19:24 “Stripped before Samuel”'
    claim: '“Wherefore they say” does not mean the proverb began here; it received a new occasion'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/19.htm'
    quote: 'The words "wherefore they say" do not imply that the proverb was first used at this time, but only that it received a new exemplification and basis in the new event in Saul''s experience.'
  - where: 'note 19:24 “Stripped before Samuel”'
    claim: 'The second outburst was a reminder to Saul of the first, when the Spirit came to fit him for the office in which he had failed'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/19.htm'
    quote: 'This burst of prophetic inspiration was a startling reminder to Saul of that former occasion when the Spirit of God came upon him to fit him for that office in which he had failed so sadly.'
  - where: 'note 19:24 “Stripped before Samuel”'
    claim: 'The footnote to “prophets” in 19:24 points to 1 Sam. 10:12 (11–13)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/19?lang=eng'
    quote: '“prophets”: 1 Sam. 10:12 (11–13).'

  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ; LORD in the Old Testament usually means Jehovah'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary (Mosiah 3:8; 15:1; 3 Ne. 15:1–5). Usually, when the word Lord appears in the Old Testament, it means “Jehovah.”'
  - where: christ
    claim: 'Wilford Woodruff in Great Britain was delivered from government authorities through the influence of the Spirit: the constable sent to arrest him asked to be baptized'
    key: ot-manual-1-samuel-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-16-31-king-davids-call-to-lead-israel?lang=eng'
    quote: 'This remarkable event has a parallel in latter-day Church history. During his mission to Great Britain, Elder Wilford Woodruff was delivered from the hands of government authorities through the influence of the Spirit.'
  - where: christ
    claim: 'The constable, sent for preaching, sat through the sermon and asked to be baptized'
    key: ot-manual-1-samuel-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-16-31-king-davids-call-to-lead-israel?lang=eng'
    quote: 'He said, ‘For preaching to the people.’ … He took my chair and sat beside me. … Among the number were four preachers and the constable. The latter arose and said, ‘Mr. Woodruff, I would like to be baptized.’'
