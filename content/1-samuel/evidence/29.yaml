chapter: 29
claims:
  - where: setting
    claim: 'Chapter 29 resumes the narrative of 28:1–2 and gives the positions of the armies'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/29.htm'
    quote: 'The narrative of 1 Samuel 28:1-2 is resumed, with a further description of the positions of the armies before the battle.'
  - where: setting
    claim: 'Verse 2 goes back to a point on the march, after the forces joined and after they passed the Philistine frontier'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/29.htm'
    quote: 'The narrative now goes back to a point of time during the march of the Philistine army northwards, probably soon after the junction of the confederate forces from the different cities of the league. It must have been after they had passed the Philistine frontier'
  - where: setting
    claim: 'Jezreel is the plain of Esdraelon and a city on a hill rising out of it'
    key: bd-jezreel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jezreel?lang=eng'
    quote: '(1) Plain of Esdraelon … (2) A city on a hill rising out of the plain, belonging to the tribe of Issachar'
  - where: setting
    claim: 'Gilboa is the ridge on the edge of the plain where Saul and his sons were slain'
    key: bd-gilboa
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gilboa?lang=eng'
    quote: 'The mountain ridge that forms the southeastern boundary of the plain of Esdraelon, in southern Galilee. … Here Saul and his sons were slain (1 Sam. 28:4; 31:1, 8; 2 Sam. 1:6, 21).'
  - where: setting
    claim: 'The Philistines were a confederation of five cities, each with its lord; their power was at its height at Saul’s death'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'They formed a confederation of five chief cities, namely, Ashdod, Gaza, Ashkelon, Gath, and Ekron, each governed by its “lord.” … Philistine power being at its height at the time of Saul’s death'
  - where: setting
    claim: 'Ziklag was given by Achish to David'
    key: bd-ziklag
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ziklag?lang=eng'
    quote: 'It was a Philistine city in the days of Saul and was given by Achish to David (1 Sam. 27:6).'
  - where: thread
    claim: 'Sent home, David had neither turned on Achish nor fought Israel'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/29.htm'
    quote: 'praising God for having so graciously rescued him out of the disastrous situation into which he had been brought and not altogether without some fault of his own, rejoicing that "he had not committed either sin, i.e., had neither violated the fidelity which he owed to Achish, nor had to fight against the Israelites"'
  - where: thread
    claim: 'David’s words “my lord the king” can mean either Achish or Saul'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/29.htm'
    quote: 'These last words are also ambiguous, since the king whom David calls his lord might be understood as meaning either Achish or Saul.'
  - where: 'note 29:2 “The lords of the Philistines”'
    claim: 'The Philistines were five cities, each governed by its lord'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'They formed a confederation of five chief cities, namely, Ashdod, Gaza, Ashkelon, Gath, and Ekron, each governed by its “lord.”'
  - where: 'note 29:2 “The lords of the Philistines”'
    claim: 'Seren is a Philistine loanword used only of the five lords, apparently one for each city'
    key: bdb
    url: 'https://biblehub.com/hebrew/5633.htm'
    quote: 'noun masculine tyrant, lord (Philistine loan-word); … only of tyrants, lords of the Philistines, five in number Judges 3:3; Joshua 13:3 (D), 1 Samuel 6:16,18 compare 1 Samuel 6:4, i.e. apparently, one ruling each of the five cities'
  - where: 'note 29:2 “The lords of the Philistines”'
    claim: 'The lords march on while David marches at the rear with Achish; the text calls the objectors lords and princes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/29?lang=eng'
    quote: 'And the lords of the Philistines passed on by hundreds, and by thousands: but David and his men passed on in the rearward with Achish.'
  - where: 'note 29:4 “An adversary in the battle”'
    claim: 'The Hebrew word rendered adversary is śāṭān'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/7854.htm'
    quote: 'שָׂטָן (satan) -- Satan, adversary, accuser'
  - where: 'note 29:4 “An adversary in the battle”'
    claim: 'At 29:4 śāṭān means an ordinary human adversary; elsewhere the name of the superhuman adversary'
    key: bdb
    url: 'https://biblehub.com/hebrew/7854.htm'
    quote: '1 adversary, in General, personal or national; (ל) ׳הָיָה לְשׂ Numbers 22:22 (JE), 1 Samuel 29:4'
  - where: 'note 29:4 “An adversary in the battle”'
    claim: '“Reconcile himself” is the hithpael of rāṣāh: make himself acceptable to his lord'
    key: bdb
    url: 'https://biblehub.com/hebrew/7521.htm'
    quote: 'Hithpa`el Imperfect3masculine singular יִתְרַצֵּה 1 Samuel 29:4 with what shall he make himself acceptable unto (אֶל) his lord?'
  - where: 'note 29:4 “An adversary in the battle”'
    claim: 'The Chronicler gives the lords’ reason for sending David away'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/12?lang=eng'
    quote: 'for the lords of the Philistines upon advisement sent him away, saying, He will fall to his master Saul to the jeopardy of our heads.'
  - where: 'note 29:8 “Which king?”'
    claim: 'On one older reading Achish swore by Jehovah to convince David of his sincerity'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/29.htm'
    quote: 'With a solemn assertion, - swearing by Jehovah to convince David all the more thoroughly of the sincerity of his declaration'
  - where: 'note 29:8 “Which king?”'
    claim: 'Another older reading allows that the wording of the oath may be the historian’s'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/29.htm'
    quote: 'Either the exact wording of the speech is due to the historian, or Achish, to convince David of his sincerity, swears by the God of Israel.'
  - where: 'note 29:8 “Which king?”'
    claim: '“As an angel of God” is compared with 2 Sam. 14:17, 20; 19:27'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/29.htm'
    quote: 'as an angel of God] Cp. 2 Samuel 14:17; 2 Samuel 14:20; 2 Samuel 19:27.'
  - where: 'note 29:8 “Which king?”'
    claim: 'Achish means David behaved as well as an angel could; “my lord the king” is ambiguous and Achish takes it of himself'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/29.htm'
    quote: 'Achish, in his goodness of heart, applies them without suspicion to himself … I have the strongest conviction that thou hast behaved as well towards me as an angel could'
  - where: 'note 29:8 “Which king?”'
    claim: 'Another older reading calls the answer hypocritical, compares 27:10–12, and doubts David intended to fight his countrymen'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/29.htm'
    quote: 'A hypocritical answer, designed to confirm Achish in the belief of his fidelity. Compare David’s previous conduct (ch. 1 Samuel 27:10-12). But David can scarcely have intended to fight against his countrymen'
  - where: 'note 29:8 “Which king?”'
    claim: 'The Chronicler says David’s men did not help the Philistines'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/12?lang=eng'
    quote: 'And there fell some of Manasseh to David, when he came with the Philistines against Saul to battle: but they helped them not'
  - where: 'note 29:11 “Sent home to Ziklag”'
    claim: 'On the third day David reached Ziklag, burned by the Amalekites, the women and children captive'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/30?lang=eng'
    quote: 'when David and his men were come to Ziklag on the third day, that the Amalekites had invaded the south, and Ziklag, and smitten Ziklag, and burned it with fire'
  - where: 'note 29:11 “Sent home to Ziklag”'
    claim: 'Captains of Manasseh joined David as he went to Ziklag'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/12?lang=eng'
    quote: 'As he went to Ziklag, there fell to him of Manasseh, Adnah, and Jozabad, and Jediael, and Michael, and Jozabad, and Elihu, and Zilthai, captains of the thousands that were of Manasseh.'
  - where: christ
    claim: 'On one older reading David went home praising God for the rescue, not altogether without fault of his own'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/29.htm'
    quote: 'praising God for having so graciously rescued him out of the disastrous situation into which he had been brought and not altogether without some fault of his own'
  - where: christ
    claim: 'God makes a way to escape'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/10?lang=eng'
    quote: 'God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape'
  - where: christ
    claim: 'On another older reading God delivered David out of a perplexing dilemma'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/29.htm'
    quote: 'must have inwardly rejoiced that God had delivered him out of so perplexing a dilemma'
