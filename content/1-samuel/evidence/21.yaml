chapter: 21
claims:
  - where: setting
    claim: 'Nob was a priestly city where the tabernacle stood before the temple'
    key: bd-nob
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nob?lang=eng'
    quote: 'Priestly city in Benjamin, north of Jerusalem, one of the places where the tabernacle stood before the building of the temple'
  - where: setting
    claim: 'Gath was the city Goliath came from'
    key: chadwick-gath
    url: 'https://rsc.byu.edu/winter-2013/gath-philistines'
    quote: 'Goliath came from this city (see 1 Samuel 17:4), and David stayed at Gath with King Achish (see 1 Samuel 27).'
  - where: setting
    claim: 'The titles of Psalms 52, 56 and 34 set them in these days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/52?lang=eng'
    quote: 'A Psalm of David, when Doeg the Edomite came and told Saul, and said unto him, David is come to the house of Ahimelech.'
  - where: setting
    claim: 'The title of Psalm 56 sets it in Gath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/56?lang=eng'
    quote: 'Michtam of David, when the Philistines took him in Gath.'
  - where: setting
    claim: 'The Abimelech of the title of Psalm 34 is Achish king of Gath'
    key: bd-achish
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/achish?lang=eng'
    quote: 'King of Gath, receives David kindly, 1 Sam. 21:10; 27; 28:1; 29:3–10; 1 Kgs. 2:40; called Abimelech, Ps. 34 heading.'
  - where: setting
    claim: 'Jesus cited David eating the shewbread when the disciples were accused of Sabbath-breaking'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'Have ye not read what David did, when he was an hungred, and they that were with him; How he entered into the house of God, and did eat the shewbread'
  - where: thread
    claim: 'One older reading: the sword, a monument of past deliverance, was a pledge of help to come'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/21.htm'
    quote: 'There is none like that] The monument of God’s deliverance in the past was a pledge of His help for the future.'
  - where: section 1 plain
    claim: 'Verse 5 rendered as an argument from the lesser to the greater (a modern translation)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+21&version=NRSVUE'
    quote: 'the vessels of the young men are holy even when it is a common journey; how much more today will their vessels be holy?'
  - where: section 1 plain
    claim: '“Common” bread is ordinary bread'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+21&version=NRSVUE'
    quote: 'I have no ordinary bread at hand, only holy bread—provided that the young men have kept themselves from women.'
  - where: section 3 plain
    claim: '“Scrabbled” means scratched or made marks'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/21.htm'
    quote: 'scrabled on the doors of the gate] i.e. scratched, or made marks.'
  - where: 'note 21:1 “The priests of Nob”'
    claim: 'Nob was a priestly city of Benjamin where the tabernacle stood'
    key: bd-nob
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nob?lang=eng'
    quote: 'Priestly city in Benjamin, north of Jerusalem, one of the places where the tabernacle stood before the building of the temple'
  - where: 'note 21:1 “The priests of Nob”'
    claim: 'Ahimelech gave David the hallowed bread and was slain by Saul'
    key: bd-ahimelech
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahimelech?lang=eng'
    quote: 'Brother-king. (1) Gives David hallowed bread (1 Sam. 21:1–9); slain by Saul (22:9–20; 23:6; 30:7; Ps. 52 heading).'
  - where: 'note 21:1 “The priests of Nob”'
    claim: 'Abiathar is the son of the high priest Ahijah or Ahimelech, and was thrust out of the priesthood'
    key: bd-abiathar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abiathar?lang=eng'
    quote: 'A son of the high priest Ahijah or Ahimelech, he escapes Saul (1 Sam. 22:20); abides with David (23:6, 9; 30:7); brings the ark back to Jerusalem'
  - where: 'note 21:1 “The priests of Nob”'
    claim: 'Ahiah son of Ahitub was of Eli’s line (14:3); Ahimelech is son of Ahitub (22:9); he inquired of the LORD for David (22:10); Abiathar’s removal fulfilled the word on Eli’s house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'So Solomon thrust out Abiathar from being priest unto the Lord; that he might fulfil the word of the Lord, which he spake concerning the house of Eli in Shiloh.'
  - where: 'note 21:2 “What David’s story cost”'
    claim: 'Doeg reported to Saul; Ahimelech pleaded ignorance; Doeg killed the priests; David took the blame'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/22?lang=eng'
    quote: 'I knew it that day, when Doeg the Edomite was there, that he would surely tell Saul: I have occasioned the death of all the persons of thy father’s house.'
  - where: 'note 21:6 “Was it lawful to eat the holy bread?”'
    claim: 'The law gave the shewbread to Aaron and his sons, to be eaten in the holy place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/24?lang=eng'
    quote: 'And it shall be Aaron’s and his sons’; and they shall eat it in the holy place: for it is most holy unto him'
  - where: 'note 21:6 “Was it lawful to eat the holy bread?”'
    claim: 'The shewbread was changed every Sabbath and eaten by the priests; the Lord drew from David’s eating it the lesson that charity overrides ritual law'
    key: bd-shewbread
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shewbread?lang=eng'
    quote: 'On one occasion the shewbread was given to David to eat (1 Sam. 21:6); the Lord drew from this incident the lesson that the law of charity overrides every ritual law (Matt. 12:4; Mark 2:26; Luke 6:4).'
  - where: 'note 21:6 “Was it lawful to eat the holy bread?”'
    claim: 'Eating the shewbread was technically a violation; in dire necessity a breach of ritual law was not a sin'
    key: ot-manual-1-samuel-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-16-31-king-davids-call-to-lead-israel?lang=eng'
    quote: 'David’s partaking of the shewbread, which was reserved only for the priests (see Reading 13-7), was technically a violation of the Mosaic law. Jesus, however, used this incident to show that in times of dire necessity a breach of the ritual law was not a sin'
  - where: 'note 21:6 “Was it lawful to eat the holy bread?”'
    claim: 'The priest gave the shewbread to hungry men because of urgent need'
    key: talmage-jesus-christ-15
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-15?lang=eng'
    quote: 'The priest had none but consecrated bread, the loaves of shewbread which were placed in the sanctuary at intervals, and which none but the priests were allowed to eat. In view of the condition of urgent need the priest had given the shewbread to the hungry men.'
  - where: 'note 21:6 “Was it lawful to eat the holy bread?”'
    claim: 'A modern translation renders verse 5 as an argument from lesser to greater'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+21&version=NRSVUE'
    quote: 'the vessels of the young men are holy even when it is a common journey; how much more today will their vessels be holy?'
  - where: 'note 21:6 “Was it lawful to eat the holy bread?”'
    claim: 'Jesus cited the shewbread as not lawful for David to eat'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'How he entered into the house of God, and did eat the shewbread, which was not lawful for him to eat, neither for them which were with him, but only for the priests?'
  - where: 'note 21:9 “Goliath’s sword behind the ephod”'
    claim: 'Goliath’s sword had apparently been sent to the tabernacle at Nob as a sacred trophy'
    key: bassett-king-david
    url: 'https://www.churchofjesuschrist.org/study/ensign/1973/10/the-king-called-david?lang=eng'
    quote: 'fed him with consecrated bread from the tabernacle of the Lord and armed him with Goliath’s sword (which apparently had been sent to the tabernacle at Nob as a type of sacred trophy)'
  - where: 'note 21:9 “Goliath’s sword behind the ephod”'
    claim: 'The sword was kept with the high priestly ephod associated with the Urim and Thummim; the Nephites kept Laban’s with the plates and interpreters'
    key: sc-knowhy-411
    url: 'https://scripturecentral.org/knowhy/why-was-the-sword-of-laban-so-important-to-nephite-leaders'
    quote: 'The sword of Goliath was kept with the high priestly ephod which was associated with the Urim and Thummim (1 Samuel 21:9). Among the Nephites, the sword of Laban was preserved with the plates of brass, the interpreters'
  - where: 'note 21:9 “Goliath’s sword behind the ephod”'
    claim: 'Each sword became a national heirloom and symbol of deliverance and legitimacy'
    key: sc-knowhy-411
    url: 'https://scripturecentral.org/knowhy/why-was-the-sword-of-laban-so-important-to-nephite-leaders'
    quote: 'in each story, the sword itself became a national heirloom, as well as an enduring symbol of divine deliverance and royal legitimacy.'
  - where: 'note 21:9 “Goliath’s sword behind the ephod”'
    claim: 'Each sword’s owner was beheaded with his own sword by a faithful youth'
    key: sc-knowhy-411
    url: 'https://scripturecentral.org/knowhy/why-was-the-sword-of-laban-so-important-to-nephite-leaders'
    quote: 'Each sword’s owner had his head cut off with his own sword by a faithful youth.'
  - where: 'note 21:9 “Goliath’s sword behind the ephod”'
    claim: 'David kept the sword as a token of royal legitimacy, after which Abiathar brought the ephod'
    key: hudson-irregular-kings
    url: 'https://interpreterfoundation.org/journal/irregular-kings-and-precious-things-viewing-nephi-and-joseph-smith-through-the-lens-of-ancient-near-eastern-kingship'
    quote: 'David kept the sword of Goliath as a token of his royal legitimacy, and that it was after David retained the sword that the priest Abiathar brought the holy ephod and joined David'
  - where: 'note 21:9 “Goliath’s sword behind the ephod”'
    claim: 'David killed Goliath with his own sword; he put the armour in his tent; Abiathar came with an ephod'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/17?lang=eng'
    quote: 'took his sword, and drew it out of the sheath thereof, and slew him, and cut off his head therewith.'
  - where: 'note 21:11 “Into Goliath’s city”'
    claim: 'The excavators place Gath at the west end of the valley of Elah'
    key: chadwick-gath
    url: 'https://rsc.byu.edu/winter-2013/gath-philistines'
    quote: 'a 300-foot-high mound at the west end of Israel’s famous Valley of Elah. This hilltop was the elite zone of Gath, the place where the Philistine king Achish maintained his palace three thousand years ago when he hosted the young warrior David'
  - where: 'note 21:11 “Into Goliath’s city”'
    claim: 'One older reading: David hoped not to be recognised years after Goliath and to be welcomed as Saul’s fugitive'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/21.htm'
    quote: 'As some years had passed since the defeat of Goliath, and the conqueror of Goliath was probably not personally known to many of the Philistines, he might hope that he should not be recognised in Gath'
  - where: 'note 21:11 “Into Goliath’s city”'
    claim: '“King of the land” because of his victories, not his anointing'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/21.htm'
    quote: '"King of the land" they call David, not because his anointing and divine election were known to them, but on account of his victorious deeds, which had thrown Saul entirely into the shade.'
  - where: 'note 21:11 “Into Goliath’s city”'
    claim: '“King of the land” is the exaggeration of rumor about the leader in the Philistine wars'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/21.htm'
    quote: 'the king of the land] The natural exaggeration of popular rumour. David had appeared as chief leader in the Philistine wars.'
  - where: 'note 21:11 “Into Goliath’s city”'
    claim: 'He feigned madness so they would think him harmless'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/21.htm'
    quote: 'feigned himself mad] So that they might suppose him harmless.'
  - where: 'note 21:11 “Into Goliath’s city”'
    claim: 'This visit is unlike the later sojourn of chapter 27'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/21.htm'
    quote: 'In the present case David went alone, was ill received, and was compelled to feign madness for safety and escape as soon as possible: later on when his breach with Saul was notorious, he went with a numerous following'
  - where: 'note 21:11 “Into Goliath’s city”'
    claim: 'Later David came to Achish with six hundred men, received Ziklag, and stayed a year and four months'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/27?lang=eng'
    quote: 'And the time that David dwelt in the country of the Philistines was a full year and four months.'
  - where: christ
    claim: 'Jesus said one greater than the temple was there and cited Hosea'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'But I say unto you, That in this place is one greater than the temple.'
  - where: christ
    claim: 'On one reading (Edersheim, quoted by Talmage), David was allowed the bread not solely for hunger but because he was on the Lord’s service; ministering to Christ is more than ministering in the temple'
    key: talmage-jesus-christ-15
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-15?lang=eng'
    quote: 'David was allowed to eat of the shewbread, not [solely] because there was danger to life from starvation, but because he pleaded that he was on the service of the Lord … ministering to Him was more than ministering in the temple, for He was greater than the temple.'
  - where: christ
    claim: 'The Joseph Smith Translation: the Son of Man made the Sabbath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-mark/2?lang=eng'
    quote: 'For the Son of man made the Sabbath day, therefore the Son of man is Lord also of the Sabbath.'
