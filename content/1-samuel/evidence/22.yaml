chapter: 22
claims:
  - where: setting
    claim: 'Nob was a priestly city in Benjamin where the tabernacle stood for a time'
    key: bd-nob
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nob?lang=eng'
    quote: 'Priestly city in Benjamin, north of Jerusalem, one of the places where the tabernacle stood before the building of the temple (1 Sam. 21:1; 22:9, 11, 19; Neh. 11:32; Isa. 10:32).'
  - where: setting
    claim: 'Psalm 52''s title sets it when Doeg told Saul'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/52?lang=eng'
    quote: 'A Psalm of David, when Doeg the Edomite came and told Saul, and said unto him, David is come to the house of Ahimelech.'
  - where: setting
    claim: 'Psalms 57 and 142 are set in the cave'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/142?lang=eng'
    quote: 'Maschil of David; A Prayer when he was in the cave.'
  - where: setting
    claim: 'The chapter heading: David gains followers and flees; Saul slays the priests'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/22?lang=eng'
    quote: 'David gains followers—He goes from one place to another, fleeing from Saul—Saul slays the priests who showed kindness to David.'
  - where: thread
    claim: 'Gad is a prophet and adviser of David, first at 22:5'
    key: bd-gad
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gad?lang=eng'
    quote: '(2) The seer. A prophet and faithful friend and adviser of David (1 Sam. 22:5; 2 Sam. 24:11–19; 1 Chr. 21:9–19).'
  - where: thread
    claim: 'Abiathar escapes Saul and abides with David, who enquires through him'
    key: bd-abiathar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abiathar?lang=eng'
    quote: 'A son of the high priest Ahijah or Ahimelech, he escapes Saul (1 Sam. 22:20); abides with David (23:6, 9; 30:7)'

  - where: 'note 22:1 “Adullam, a place of refuge”'
    claim: 'Micah evokes the Davidic past at Adullam; in both stories Adullam has a sense of refuge; Judah will become refugees like David'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'Micah again evokes the Davidic past. A cave at the site afforded David protection in his flight from Saul (1 Samuel 22:1) and featured in the narrative about David’s mighty men (2 Samuel 23:13). In both cases, Adullam has a sense of refuge in the face of trouble.'
  - where: 'note 22:1 “Adullam, a place of refuge”'
    claim: 'The Judahites will become refugees like David'
    key: pierce-micah
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'places of refuge like Adullam are reminiscent of David’s life on the run from an aggressor, and the Judahites will become refugees like David in the face of their Assyrian invaders.'
  - where: 'note 22:1 “Adullam, a place of refuge”'
    claim: 'Adullam is a town of Judah; 2 Samuel 23 sets the mighty men at the cave of Adullam; Micah 1:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/15?lang=eng'
    quote: '35 Jarmuth, and Adullam, Socoh, and Azekah,'

  - where: 'note 22:2 “Bitter of soul”'
    claim: '“Discontented” renders mar nepesh, bitter of soul, a phrase of feeling or temper; BDB gives “discontented” for this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/4751.htm'
    quote: 'b. of feeling, temper, especially with נֶפֶשׁ: … מַרנֶֿפֶשׁ = discontented 1 Samuel 22:2'
  - where: 'note 22:2 “Bitter of soul”'
    claim: 'The Hebrew of 22:2 has mar nephesh'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'נֶ֔פֶשׁ'
  - where: 'note 22:2 “Bitter of soul”'
    claim: 'The four hundred become about six hundred'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/23?lang=eng'
    quote: '13 Then David and his men, which were about six hundred, arose and departed out of Keilah'

  - where: 'note 22:3 “Why Moab”'
    claim: 'Moab akin to Israel but constantly at war with it'
    key: bd-moab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moab?lang=eng'
    quote: 'The Moabites were akin to the Israelites and spoke a language that closely resembled Hebrew, but there was constant warfare between the two nations'
  - where: 'note 22:3 “Why Moab”'
    claim: 'The king of Moab hated Saul; sending the parents was a precaution against Saul punishing them'
    key: ot-manual-1-samuel-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-16-31-king-davids-call-to-lead-israel?lang=eng'
    quote: 'Although the king of Moab was no particular friend to Israel, his primary hatred was of Saul. … David’s arrangement for the safety of his parents was simply a precautionary step in case Saul decided to punish them or torture them into revealing their son’s whereabouts.'
  - where: 'note 22:3 “Why Moab”'
    claim: 'Mizpeh of Moab mentioned only here; the connection with Ruth chiefly led David to choose Moab'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/22.htm'
    quote: 'Mizpeh of Moab] Mentioned here only. … but no doubt it was his connexion with Moab through his great-grandmother Ruth, which chiefly induced David to choose that country as a refuge for his parents.'
  - where: 'note 22:3 “Why Moab”'
    claim: '“The hold” is a stronghold, apparently the Mizpeh of v. 3'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/22.htm'
    quote: '“Hold” = stronghold or fortress: here apparently the Mizpeh of 1 Samuel 22:3.'
  - where: 'note 22:3 “Why Moab”'
    claim: 'Saul fought Moab; Ruth was the great-grandmother of David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/14?lang=eng'
    quote: '47 So Saul took the kingdom over Israel, and fought against all his enemies on every side, against Moab'

  - where: 'note 22:5 “Gad the seer”'
    claim: 'Gad: prophet, friend and adviser of David; wrote a book of the acts of David; helped arrange the music of the house of God'
    key: bd-gad
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gad?lang=eng'
    quote: 'A prophet and faithful friend and adviser of David (1 Sam. 22:5; 2 Sam. 24:11–19; 1 Chr. 21:9–19). He wrote a book of the acts of David (1 Chr. 29:29) and assisted in the arrangement of the music of the house of God (2 Chr. 29:25).'
  - where: 'note 22:5 “Gad the seer”'
    claim: 'The writer of Samuel used writings by Samuel, Nathan and Gad'
    key: bd-samuel-books
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel-books-of?lang=eng'
    quote: 'he no doubt used various writings that he found already in existence, including the state chronicles (among which were writings by Samuel, Nathan, and Gad, 1 Sam. 10:25; 1 Chr. 29:29).'
  - where: 'note 22:5 “Gad the seer”'
    claim: 'Gad is called David''s seer in 2 Samuel 24:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/24?lang=eng'
    quote: '11 For when David was up in the morning, the word of the LORD came unto the prophet Gad, David’s seer, saying,'

  - where: 'note 22:7 “Saul''s court under the tamarisk”'
    claim: 'The tree is a tamarisk; BDB sets 22:6 beside 31:13, where Saul is buried under the tamarisk; perhaps a sacred tree'
    key: bdb
    url: 'https://biblehub.com/hebrew/815.htm'
    quote: 'אֵ֫שֶׁל noun masculine tamarisk-tree … in 1 Samuel 22:6 Saul is dwelling בַּגִּבְעָה תַּחַתהָֿאֵשֶׁל בָּרָמָה; 1 Samuel 31:13 Saul and his sons are buried ׳תַּחַתהָֿא; it was perhaps a sacred tree, marking shrine.'
  - where: 'note 22:7 “Saul''s court under the tamarisk”'
    claim: 'BDB lists “Ramah” in 22:6, perhaps, under the noun “height, high-place,” and says the text should probably read bamah'
    key: bdb
    url: 'https://biblehub.com/hebrew/7413.htm'
    quote: 'I. רָמָה noun feminine height, high-place; … so perhaps 1 Samuel 22:6, but read probably בָּמָה'
  - where: 'note 22:7 “Saul''s court under the tamarisk”'
    claim: 'The same word ḥănît is the spear of 22:6 and the javelin of 18:10–11 and 19:9–10'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'וַ/חֲנִית֣/וֹ'
  - where: 'note 22:7 “Saul''s court under the tamarisk”'
    claim: 'The javelin of 18:11 is ḥănît'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'הַ/חֲנִ֔ית'
  - where: 'note 22:7 “Saul''s court under the tamarisk”'
    claim: 'Footnotes: “abode” or was sitting; “league” or covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/22?lang=eng'
    quote: '6a “abode”: OR was sitting. … 8b “league”: OR covenant, agreement.'

  - where: 'note 22:15 “Ahimelech''s answer”'
    claim: 'Ahimelech pleads that inquiring for David was nothing new; the stress is on “that day did I begin”'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/22.htm'
    quote: 'Did I then begin] That day did I begin, &c.? The stress is upon these words. Ahimelech pleads that there was no harm in doing as he had often done before.'
  - where: 'note 22:15 “Ahimelech''s answer”'
    claim: '“Goeth at thy bidding” probably means has access to the king''s audience'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/22.htm'
    quote: 'goeth at thy bidding] Probably, “has access to thy audience,” i.e. is a trusted privy-councillor.'
  - where: 'note 22:15 “Ahimelech''s answer”'
    claim: 'Chapter 21 does not mention the inquiry, but it took place, since Ahimelech does not deny it; he was unaware of any crime because David came with a false pretext'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/22.htm'
    quote: 'see 1 Samuel 21:1-10, where there is no reference indeed to his inquiring of God; though it certainly took place, as Ahimelech (1 Samuel 22:15) does not disclaim it.'
  - where: 'note 22:15 “Ahimelech''s answer”'
    claim: 'Ahimelech was not conscious of any crime, since David came with a false pretext'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/22.htm'
    quote: 'Ahimelech, who was not conscious of any such crime, since David had come to him with a false pretext, and the priest had probably but very little knowledge of what took place at court, replied both calmly and worthily'
  - where: 'note 22:15 “Ahimelech''s answer”'
    claim: 'David told Ahimelech he was on the king''s business'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/21?lang=eng'
    quote: '2 And David said unto Ahimelech the priest, The king hath commanded me a business'

  - where: 'note 22:18 “Doeg and the priests of Nob”'
    claim: 'Doeg was at Nob, chief of Saul''s herdmen; the footnote to the ephod points to Ex. 28:4 and 1 Sam. 2:28 and 14:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/22?lang=eng'
    quote: '9a “Doeg”: 1 Sam. 21:7. … 18a “ephod”: Ex. 28:4 (2–4); 1 Sam. 2:28; 14:3.'
  - where: 'note 22:18 “Doeg and the priests of Nob”'
    claim: 'Psalm 52''s title on the site: what Doeg told cost eighty-five priests their lives'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/52?lang=eng'
    quote: 'To the chief Musician, Maschil, A Psalm of David, when Doeg the Edomite came and told Saul, and said unto him, David is come to the house of Ahimelech.'

  - where: 'note 22:19 “What Saul would not do to Amalek”'
    claim: 'Saul wreaked on an innocent city the vengeance he failed to execute on Amalek; the doom on Eli''s house received a fresh fulfilment'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/22.htm'
    quote: 'In the madness of his self-willed fury Saul wreaked upon an innocent city in his own kingdom the vengeance he had failed to execute upon a guilty heathen nation at God’s command (1 Samuel 15:3). Thus the doom upon the house of Eli (1 Samuel 2:31) received a fresh fulfilment.'
  - where: 'note 22:19 “What Saul would not do to Amalek”'
    claim: 'Nob was destroyed like a city under the ban; Saul identified his private revenge with the cause of Jehovah'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/22.htm'
    quote: 'Saul had the whole city of Nob destroyed, like a city that was laid under the ban (vid., Deuteronomy 13:13.). So completely did Saul identify his private revenge with the cause of Jehovah, that he avenged a supposed conspiracy against his own person as treason against Jehovah the God-king.'
  - where: 'note 22:19 “What Saul would not do to Amalek”'
    claim: 'Ahitub was Eli''s grandson (14:3); the command of 15:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/14?lang=eng'
    quote: '3 And Ahiah, the son of Ahitub, I-chabod’s brother, the son of Phinehas, the son of Eli, the LORD’s priest in Shiloh, wearing an ephod.'
  - where: 'note 22:19 “What Saul would not do to Amalek”'
    claim: 'Those Saul killed at Nob were innocent and knew nothing of his quarrel with David'
    key: ot-manual-1-samuel-16
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-16-31-king-davids-call-to-lead-israel?lang=eng'
    quote: 'He murdered innocent persons who knew nothing of his problems with David.'
  - where: 'note 22:19 “What Saul would not do to Amalek”'
    claim: 'The footnote at the ephod of 22:18 points to 1 Sam. 14:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/22?lang=eng'
    quote: '18a “ephod”: Ex. 28:4 (2–4); 1 Sam. 2:28; 14:3.'

  - where: 'note 22:20 “Abiathar, the one who escaped”'
    claim: 'Abiathar: son of Ahimelech; abides with David; brings the ark back; joins Adonijah; thrust out from the priesthood'
    key: bd-abiathar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abiathar?lang=eng'
    quote: 'abides with David (23:6, 9; 30:7); brings the ark back to Jerusalem (2 Sam. 15:24–36; 17:15; 19:11); takes part in Adonijah’s rebellion (1 Kgs. 1:7); is thrust out from the priesthood (2:27, 35; Mark 2:26).'
  - where: 'note 22:20 “Abiathar, the one who escaped”'
    claim: 'Abiathar came to David with an ephod'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/23?lang=eng'
    quote: '6 And it came to pass, when Abiathar the son of Ahimelech fled to David to Keilah, that he came down with an ephod in his hand.'

  - where: 'note 22:22 “I have occasioned the death”'
    claim: 'Doeg was at Nob that day; David had told the priest he was on the king''s business'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/21?lang=eng'
    quote: '7 Now a certain man of the servants of Saul was there that day, detained before the LORD; and his name was Doeg, an Edomite, the chiefest of the herdmen that belonged to Saul.'

  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'Psalm 142, a prayer in the cave, calls the LORD refuge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/142?lang=eng'
    quote: '5 I cried unto thee, O LORD: I said, Thou art my refuge and my portion in the land of the living.'
