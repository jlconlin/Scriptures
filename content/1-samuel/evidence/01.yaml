    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'The lexical shift from give to lend does not indicate a change of heart on Hannah’s part. She neither retreats from nor attempts to renegotiate the terms of her sacred vow. … following his birth she cannot not be his mother'
