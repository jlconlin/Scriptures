chapter: 1
claims:
  - where: 'setting'
    claim: 'In Hebrew 1 and 2 Samuel are one book; the division follows the Greek Bible'
    key: bd-samuel-books
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel-books-of?lang=eng'
    quote: 'In the Hebrew Bible these books form one. Our division into two books follows the Greek Bible.'
  - where: 'setting'
    claim: 'The books run from Samuel’s birth nearly to David’s death, about 130 years; author and date uncertain'
    key: bd-samuel-books
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel-books-of?lang=eng'
    quote: 'The books begin with the birth of Samuel (hence the title) and carry us down nearly to the death of David, a period of about 130 years. It is uncertain who the author was or when he wrote.'
  - where: 'setting'
    claim: 'The writer used existing records, among them writings by Samuel, Nathan and Gad'
    key: bd-samuel-books
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel-books-of?lang=eng'
    quote: 'including the state chronicles (among which were writings by Samuel, Nathan, and Gad, 1 Sam. 10:25; 1 Chr. 29:29)'
  - where: 'setting'
    claim: 'Samuel was the last of the judges; the book tells the move from judges to kings'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'The book of 1 Samuel recounts the ministry of the prophet Samuel, the last of the Israelite judges. … It also describes Israel’s difficult transition from judges to kings.'
  - where: 'setting'
    claim: 'Hannah lived in the lawless days of Judges 21:25'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'She lived in a chaotic time of moral relativism: in Hannah’s day, “there was no king in Israel: every man did that which was right in his own eyes” (Judges 21:25).'
  - where: 'setting'
    claim: 'The tabernacle stood at Shiloh, the religious center, until the ark was lost'
    key: bd-shiloh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shiloh?lang=eng'
    quote: 'The tabernacle was here during the greater part of the period of the Judges, and the place continued to be the religious center of the nation (1 Sam. 1:3) until after the loss of the Ark'
  - where: 'setting'
    claim: 'The “house” and “temple” at Shiloh was a tent-shrine, a precursor of the Jerusalem temple'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'It is a tabernacle, or “tent-shrine,” and a precursor to the temple that will later be built in Jerusalem.'
  - where: 'setting'
    claim: 'LORD of hosts: leader of Israel’s armies and of heaven’s'
    key: scripture-helps-1-samuel-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/23-1-samuel-17-18-24-26-2-samuel-5-7?lang=eng'
    quote: 'This title refers to His role as the leader of both the armies of Israel and the angelic hosts of heaven.'
  - where: 'thread'
    claim: 'The story reverses the expectations set by Hannah and Eli'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'for Hannah, on the other hand, it seems that the temple will be peripheral at best, and she appears unlikely to leave any mark at all … However, it will not take long for the story to completely reverse those expectations'
  - where: 'thread'
    claim: 'Eli has status at the sanctuary yet misjudges Hannah'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'Eli possesses great spiritual status, being the ritual official of the temple at Shiloh … Adding to his position of spiritual ambivalence is Eli’s first specific action—a gross miscalculation of Hannah’s spiritual motivations'
  - where: 'thread'
    claim: 'Hannah has no formal status in Israel’s worship'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'By stark contrast, Hannah has neither formal status nor ritual position in the worship of JHWH. She is merely the barren co-wife of an obscure Ephraimite.'
  - where: 'thread'
    claim: 'The naming ties Samuel and Saul together'
    key: bowen-name-samuel
    url: 'https://interpreterfoundation.org/journal/if-ye-believe-on-his-name-wordplay-on-the-name-samuel-in-helaman-142-12-13-and-3-nephi-239-and-the-doctrine-of-christ-in-samuels-speech'
    quote: 'the narrator’s primary concern in including this etiology is not to offer a precise etymology for šĕmûʾēl but to establish an inextricable onomastic link between the names and persons Samuel and Saul, whose destinies are intertwined.'
  - where: 'thread'
    claim: 'Hannah’s song and David’s psalm frame the story of Samuel, Saul and David'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'Alter, Ancient Israel, 247 n. 0 suggests that Hannah’s song and David’s victory psalm “echo each other and act as formal ‘bookends’ to the extended narrative sequence that includes the stories of Samuel, Saul, and David.”'
  - where: 'note 1:1 “An Ephraimite in Samuel, a Levite in Chronicles”'
    claim: 'A modern translation renders Ephrathite here as Ephraimite'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+1&version=NRSVUE'
    quote: 'whose name was Elkanah son of Jeroham son of Elihu son of Tohu son of Zuph, an Ephraimite.'
  - where: 'note 1:1 “An Ephraimite in Samuel, a Levite in Chronicles”'
    claim: 'The genealogy of 1:1 makes Samuel’s ancestors Ephraimites'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'the brief genealogy that launches the story of Samuel’s birth identifies Samuel’s ancestors as Ephraimites'
  - where: 'note 1:1 “An Ephraimite in Samuel, a Levite in Chronicles”'
    claim: '1 Chronicles 6 lists Elkanah, Jeroham and Samuel among the Kohathite Levites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/6?lang=eng'
    quote: 'Of the sons of the Kohathites: Heman a singer, the son of Joel, the son of Shemuel, … The son of Elkanah, the son of Jeroham, the son of Eliel, the son of Toah, … The son of Zuph'
  - where: 'note 1:1 “An Ephraimite in Samuel, a Levite in Chronicles”'
    claim: 'Scripture Helps: Samuel’s lineage is unclear; he and Elkanah are in the Levite genealogy'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'Samuel’s lineage is unclear; he and his father, Elkanah, are listed in the Levite genealogy recorded in 1 Chronicles 6:27–28.'
  - where: 'note 1:1 “An Ephraimite in Samuel, a Levite in Chronicles”'
    claim: 'Olsen: dual descent may have qualified Samuel as priest, prophet and judge'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: '1 Chronicles 6:27 identifies Jeroham, Samuel’s paternal grandfather, as a Levite. Thus, Samuel’s dual descent may have qualified him, in terms of his lineage, to serve as priest as well as prophet and judge during his ministry.'
  - where: 'note 1:5 “A worthy portion, and better than ten sons”'
    claim: 'A modern translation gives “a double portion” and notes the Hebrew is uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+1&version=NRSVUE'
    quote: 'but to Hannah he gave a double portion because he loved her, though the Lord had closed her womb.'
  - where: 'note 1:5 “A worthy portion, and better than ten sons”'
    claim: 'The NRSVue footnote: meaning of the Hebrew uncertain, Syriac followed'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+1&version=NRSVUE'
    quote: '1.5 Syr: Meaning of Heb uncertain'
  - where: 'note 1:5 “A worthy portion, and better than ten sons”'
    claim: 'The Septuagint: a prime portion'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/1.htm'
    quote: 'And to Anna he gave a prime portion, because she had no child, only Helkana loved Anna more than the other'
  - where: 'note 1:5 “A worthy portion, and better than ten sons”'
    claim: 'Hannah could neither eat the portion (fasting) nor share it with children'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'Hannah can neither eat the “worthy portion” herself (because she is fasting “in bitterness of soul,” see 1:10) nor share it with her children (of which she has none, which is precisely the cause of her grief'
  - where: 'note 1:5 “A worthy portion, and better than ten sons”'
    claim: 'Elkanah’s question read as kindness or as dismissal; either way he urges contentment'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'Scholars have understood that question in different ways: it is perhaps a kindhearted effort to soothe Hannah’s mind, but it may also be interpreted as a self-centered dismissal of her concerns. [2] Either way, he is trying to encourage Hannah to become content with her situation.'
  - where: 'note 1:5 “A worthy portion, and better than ten sons”'
    claim: 'Hannah takes her sorrow to the sanctuary to change her circumstances'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'Hannah, however, has something else in mind: she takes her sorrow to the temple in an effort to change her circumstances.'
  - where: 'note 1:6 “Peninnah, the rival wife”'
    claim: 'BDB lists a noun “rival-wife” and gives 1 Sam. 1:6 for it'
    key: bdb
    url: 'https://biblehub.com/hebrew/6869.htm'
    quote: 'II. [צָרָה] noun feminine vexer, rival-wife (see references below √; also Ecclus 37:11); — suffix צָרָתָהּ 1 Samuel 1:6.'
  - where: 'note 1:6 “Peninnah, the rival wife”'
    claim: 'The common noun ṣārâ means distress, trouble'
    key: bdb
    url: 'https://biblehub.com/hebrew/6869.htm'
    quote: 'I. צָרָה72 noun feminine id.; … — straits, distress'
  - where: 'note 1:6 “Peninnah, the rival wife”'
    claim: 'A modern translation reads “her rival”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+1&version=NRSVUE'
    quote: 'Her rival used to provoke her severely, to irritate her, because the Lord had closed her womb.'
  - where: 'note 1:6 “Peninnah, the rival wife”'
    claim: 'Spendlove: the adversity was Hannah’s barrenness, not Peninnah'
    key: spendlove-hannah-peninnah
    url: 'https://interpreterfoundation.org/journal/hannahs-adversity-and-peninnahs-redemption'
    quote: 'I believe that a better understanding of the Hebrew text of 1 Samuel 1:6 is that Hannah’s adversity (or trouble, distress, affliction, etc.) — her inability to bear children — caused her grief and depression.'
  - where: 'note 1:6 “Peninnah, the rival wife”'
    claim: 'Spendlove: the Septuagint and Josephus give Peninnah a passive role; later rabbinic reading made her a tormentor'
    key: spendlove-hannah-peninnah
    url: 'https://interpreterfoundation.org/journal/hannahs-adversity-and-peninnahs-redemption'
    quote: 'While the earliest Jewish writings on 1 Samuel 1:6 — LXX and Josephus — cast Peninnah in a passive familial role, later rabbinic interpretation seems to throw her under a bus, or under a chariot, by changing her into a spiteful and mean-spirited tormentor of Hannah.'
  - where: 'note 1:6 “Peninnah, the rival wife”'
    claim: 'The Septuagint verse 6 has no rival'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/1.htm'
    quote: 'For the Lord gave her no child in her affliction, and according to the despondency of her affliction; and she was dispirited on this account'
  - where: 'note 1:6 “Peninnah, the rival wife”'
    claim: 'The preferred barren wife and her co-wife recall Sarah, Rebekah and Rachel and lead readers to expect a remarkable child'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'evoke positive comparisons between Hannah and Israel’s grand matriarchs Sarah, Rebekah, and Rachel. This type scene also encourages attentive readers to anticipate that Hannah, like her matriarchal models, will also eventually conceive and bear a remarkable child.'
  - where: 'note 1:11 “A Nazarite for life”'
    claim: 'Scripture Helps: the vow and the razor show Samuel was raised a Nazarite'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'This vow, along with her promise that no razor would touch her son’s head, indicates that Samuel was raised as a Nazarite and set apart for service to God.'
  - where: 'note 1:11 “A Nazarite for life”'
    claim: 'The Nazarite abstained from wine, haircutting and the dead; the vow might be lifelong or for a set period'
    key: bd-nazarite
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nazarite?lang=eng'
    quote: 'A man under a vow to abstain from wine, from any cutting of the hair, and any contact with the dead (Judg. 13:5; 16:17; 1 Sam. 1:11; Amos 2:11–12; for full regulations see Num. 6). The vow might be lifelong, or for a short, definite period.'
  - where: 'note 1:11 “A Nazarite for life”'
    claim: 'The Septuagint adds that he will drink no wine or strong drink'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/1.htm'
    quote: 'then will I indeed dedicate him to thee till the day of his death; and he shall drink no wine nor strong drink, and no razor shall come upon his head.'
  - where: 'note 1:11 “A Nazarite for life”'
    claim: 'A modern translation, with the Greek and a Qumran manuscript, has “as a nazirite” in 1:11'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+1&version=NRSVUE'
    quote: 'then I will set him before you as a nazirite until the day of his death. He shall drink neither wine nor intoxicants, and no razor shall touch his head.'
  - where: 'note 1:11 “A Nazarite for life”'
    claim: 'The NRSVue footnote at 1:11: compare Greek and Q ms; the traditional Hebrew reads as the KJV'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+1&version=NRSVUE'
    quote: '1.11 Cn Compare Gk Q ms: MT child, then I will give him to the Lord all the days of his life'
  - where: 'note 1:11 “A Nazarite for life”'
    claim: 'At 1:22 the NRSVue adds, from a Qumran manuscript, “I will offer him as a nazirite for all time”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+1&version=NRSVUE'
    quote: '1.22 Cn Compare Q ms: MT lacks I will offer him as a nazirite for all time'
  - where: 'note 1:11 “A Nazarite for life”'
    claim: 'Hannah’s “give” is unequivocal and permanent'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'In both instances, the verb give is translated from the Hebrew nathan. … In short, the text projects that her vow to the Lord will be unequivocal and permanent.'
  - where: 'note 1:11 “A Nazarite for life”'
    claim: 'The razor sets Samuel beside Samson; Samson turned from his vow, Samuel unified Israel'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'Samson turns from his sacred vow, resulting in much destruction among the covenant people; however, through his own faithful ministry, Samuel strengthens and unifies “all Israel.”'
  - where: 'note 1:13 “A prayer Eli could not hear”'
    claim: 'Prayers were normally aloud; Eli did not know silent prayer and so thought her drunk'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'Prayers were normally offered out loud. The story itself implies that Hannah’s prayer was regarded as unusual … and Eli is so unfamiliar with the idea of silent prayer that he assumes that Hannah is drunk (1 Samuel 1:12–13).'
  - where: 'note 1:13 “A prayer Eli could not hear”'
    claim: 'Her silent prayer shows the matter was between her and the Lord'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'her silent prayer also reminds the reader that Hannah sees this issue as being solely between her and the Lord.'
  - where: 'note 1:13 “A prayer Eli could not hear”'
    claim: '“Not heard” (lōʾ yiššāmēaʿ) plays on Samuel’s name: God heard what Eli could not'
    key: bowen-name-samuel
    url: 'https://interpreterfoundation.org/journal/if-ye-believe-on-his-name-wordplay-on-the-name-samuel-in-helaman-142-12-13-and-3-nephi-239-and-the-doctrine-of-christ-in-samuels-speech'
    quote: 'only her lips moved, but her voice was not heard [lōʾ yiššāmēaʿ]”: therefore Eli thought she had been drunken” (1 Samuel 1:13). The point here, of course, is that God did hear Hannah’s prayer, though Eli could not.'
  - where: 'note 1:13 “A prayer Eli could not hear”'
    claim: 'In the name Samuel the audience could hear “heard of God”'
    key: bowen-name-samuel
    url: 'https://interpreterfoundation.org/journal/if-ye-believe-on-his-name-wordplay-on-the-name-samuel-in-helaman-142-12-13-and-3-nephi-239-and-the-doctrine-of-christ-in-samuels-speech'
    quote: 'In the subsequent birth of a son named Samuel (šĕmûʾēl), the ancient Israelite audience can hear the aural echo of *šāmûaʿ + ʾēl, “heard of God.”'
  - where: 'note 1:13 “A prayer Eli could not hear”'
    claim: 'Eli misjudges her, she corrects him respectfully, he blesses her'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'He accuses her of wanton drunkenness, a false assertion that she directly but respectfully corrects. Attempting to cover his error of judgment, Eli offers a hastily constructed blessing'
  - where: 'note 1:13 “A prayer Eli could not hear”'
    claim: 'Hannah denies being a daughter of Belial; the narrator next calls Eli’s sons sons of Belial'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'Eli accuses Hannah of wanton drunkenness, which she respectfully denies with the plea, “Count not thine handmaid for a daughter of Belial” (1:16). Following Hannah’s song, the narrator begins his detailed condemnation of Eli’s sons with the epithet: “Now the sons of Eli were sons of Belial,”'
  - where: 'note 1:20 “Samuel, and the boy who was asked”'
    claim: 'Hannah’s explanation is not the etymology of Samuel; šāʾal fits Saul’s name'
    key: bowen-name-samuel
    url: 'https://interpreterfoundation.org/journal/if-ye-believe-on-his-name-wordplay-on-the-name-samuel-in-helaman-142-12-13-and-3-nephi-239-and-the-doctrine-of-christ-in-samuels-speech'
    quote: 'A point on which virtually every modern exegete agrees is that Hannah’s explanation for naming her son Samuel in 1 Samuel 1:20 is not etymological … this paronomastic explanation of the name Samuel in terms of the verb šāʾal (“ask”) clearly fits the name of “Saul” (šāʾûl, “asked”)'
  - where: 'note 1:20 “Samuel, and the boy who was asked”'
    claim: 'The likelier etymology: “his name is El”'
    key: bowen-name-samuel
    url: 'https://interpreterfoundation.org/journal/if-ye-believe-on-his-name-wordplay-on-the-name-samuel-in-helaman-142-12-13-and-3-nephi-239-and-the-doctrine-of-christ-in-samuels-speech'
    quote: 'the more likely etymology for the name Samuel (šĕmûʾēl), at least in terms of its Hebrew spelling, appears to be “his name is El”'
  - where: 'note 1:20 “Samuel, and the boy who was asked”'
    claim: 'The Bible Dictionary gives the meaning of Samuel as “Name of God”'
    key: bd-samuel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel?lang=eng'
    quote: 'Name of God. Son of Elkanah and Hannah, born in answer to his mother’s prayers (1 Sam. 1)'
  - where: 'note 1:20 “Samuel, and the boy who was asked”'
    claim: 'The narrative has Saul’s coming in chapters 8–12 in view'
    key: bowen-name-samuel
    url: 'https://interpreterfoundation.org/journal/if-ye-believe-on-his-name-wordplay-on-the-name-samuel-in-helaman-142-12-13-and-3-nephi-239-and-the-doctrine-of-christ-in-samuels-speech'
    quote: 'Since the biblical narrative already has the imminent advent of Saul in 1 Samuel 8–12 in view'
  - where: 'note 1:20 “Samuel, and the boy who was asked”'
    claim: 'The verb of 1:20 is šāʾal (Strong’s 7592)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'שְׁאִלְתִּֽי/ו'
  - where: 'note 1:23 “Whose word?”'
    claim: 'It is unclear what word of the Lord is meant; the Dead Sea Scrolls read “what your mouth has uttered,” which makes more sense'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'This sentence has puzzled interpreters because it is unclear what word of the Lord would be referenced here. [7] The Dead Sea Scrolls’ version of that phrase concerns not the word of the Lord but rather the words of Hannah'
  - where: 'note 1:23 “Whose word?”'
    claim: 'Smith: that reading makes more sense, and strengthens the picture of Hannah’s prophetic gift'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'That reading makes more sense in context, since there is no specific word of the Lord in this story to which this phrase could refer. … strengthens our picture of Hannah as a woman possessed of a prophetic gift'
  - where: 'note 1:23 “Whose word?”'
    claim: 'The Septuagint: “that which comes out of thy mouth”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/1.htm'
    quote: 'but may the Lord establish that which comes out of thy mouth'
  - where: 'note 1:23 “Whose word?”'
    claim: 'The NRSVue reads “your word,” with a Qumran manuscript, Greek and Syriac'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+1&version=NRSVUE'
    quote: '1.23 Q ms Gk Syr: MT his'
  - where: 'note 1:23 “Whose word?”'
    claim: 'At 1:24 the same witnesses read a three-year-old bull for three bullocks'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=1+Samuel+1&version=NRSVUE'
    quote: '1.24 Q ms Gk Syr: MT three bulls'
  - where: 'note 1:23 “Whose word?”'
    claim: 'The Septuagint at 1:24: a calf of three years old'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/1.htm'
    quote: 'And she went up with him to Selom with a calf of three years old, and loaves, and an ephah of fine flour, and a bottle of wine'
  - where: 'note 1:28 “Lent to the LORD”'
    claim: 'BDB: the passive participle šāʾûl at 1:28 means lent, granted, made over to the LORD'
    key: bdb
    url: 'https://biblehub.com/hebrew/7592.htm'
