  - where: 'note 1:28 “Lent to the LORD”'
    claim: 'The verb shifts from give to lend; sha’el means both request and lend'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'Following his birth, when time comes to make good on her vow, the account consistently shifts the verb from nathan (give) to sha’el, translated lend (1:20, 27–28; 2:20). In biblical Hebrew, sha’el has a double meaning: to request and to lend.'
  - where: 'note 1:28 “Lent to the LORD”'
    claim: 'The shift is no change of heart; she cannot cease to be his mother'
