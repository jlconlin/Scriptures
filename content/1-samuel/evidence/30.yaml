chapter: 30
claims:
  - where: setting
    claim: 'Ziklag was a city of the Negev, assigned to Judah, then Simeon, a Philistine city in Saul’s day, given by Achish to David'
    key: bd-ziklag
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ziklag?lang=eng'
    quote: 'A city in the Negev, originally assigned to Judah (Josh. 15:31) but transferred to Simeon (Josh. 19:5). It was a Philistine city in the days of Saul and was given by Achish to David (1 Sam. 27:6).'
  - where: setting
    claim: 'The Negeb is the south country, the district between the hills of Judah and the desert'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/30.htm'
    quote: 'The Negeb or “south country” is the technical name for the district between the hills of Judah and the actual desert.'
  - where: setting
    claim: '“On the third day” is counted from David’s leaving the Philistine army'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/30.htm'
    quote: 'on the third day] After leaving the Philistine army. Evidently he had not accompanied them far beyond the frontier.'
  - where: setting
    claim: 'Meanwhile the Philistines fought Israel, and Saul and three of his sons died'
    key: ot-seminary-lesson-89
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-89-1-samuel-25-31?lang=eng'
    quote: 'In the meantime, the Philistines went to battle against the Israelites. Three of Saul’s sons were killed.'
  - where: when
    claim: 'The chapter happens while the Philistines fought Saul'
    key: ot-seminary-lesson-89
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-89-1-samuel-25-31?lang=eng'
    quote: 'David and his army conquered the Amalekites and rescued their families. David then shared the enemy’s supplies with his people. In the meantime, the Philistines went to battle against the Israelites.'
  - where: thread
    claim: 'The seminary manual contrasts David’s receiving the Lord’s direction with Saul’s not, and draws the principle that the faithful invite the Lord to direct them'
    key: ot-seminary-lesson-89
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-89-1-samuel-25-31?lang=eng'
    quote: 'Why do you think David was blessed with the Lord’s direction but King Saul was not?'
  - where: thread
    claim: 'The men of Judah made David king'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/2?lang=eng'
    quote: 'And the men of Judah came, and there they anointed David king over the house of Judah.'

  - where: 'note 30:1 “Amalek at Ziklag”'
    claim: 'The Amalekites were at war with the Hebrews from Moses’ time until Saul and David broke their power; the Bible Dictionary cites 1 Sam. 30'
    key: bd-amalek
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amalek?lang=eng'
    quote: 'An Arab tribe that lived in the desert of Paran … The Amalekites were at constant war with the Hebrews from the time of Moses (Ex. 17:8, etc.) till their power was broken by Saul and David (1 Sam. 15; 27:8; 30; 2 Sam. 8:12)'
  - where: 'note 30:1 “Amalek at Ziklag”'
    claim: 'Ziklag was David’s town, given him by Achish'
    key: bd-ziklag
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ziklag?lang=eng'
    quote: 'It was a Philistine city in the days of Saul and was given by Achish to David (1 Sam. 27:6). The Amalekites made a raid upon it (1 Sam. 30:1–26'
  - where: 'note 30:1 “Amalek at Ziklag”'
    claim: 'From Ziklag David had raided the Amalekites among others'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/27?lang=eng'
    quote: 'And David and his men went up, and invaded the Geshurites, and the Gezrites, and the Amalekites'

  - where: 'note 30:6 “Strengthened himself in the LORD”'
    claim: '“Encouraged himself” renders a Hithpael (reflexive) form of ḥāzaq, Strong’s 2388'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'וַ/יִּתְחַזֵּ֣ק'
  - where: 'note 30:6 “Strengthened himself in the LORD”'
    claim: 'BDB: the Hithpael means strengthen oneself, gain strength, and cites 1 Sam. 30:6 with “in the LORD”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2388.htm'
    quote: '1 strengthen oneself 2 Samuel 3:6; 1 Kings 20:22; … gain strength Ezra 7:28; Daniel 10:19, compare ביהוה ׳הִתְח 1 Samuel 30:6'
  - where: 'note 30:6 “Strengthened himself in the LORD”'
    claim: 'The basic sense of ḥāzaq is to be strong'
    key: bdb
    url: 'https://biblehub.com/hebrew/2388.htm'
    quote: '2388. חָזַק (chazaq) -- To be strong, to strengthen, to harden, to prevail, to take hold of'
  - where: 'note 30:6 “Strengthened himself in the LORD”'
    claim: 'The seminary manual: the phrase meant that David trusted in the Lord'
    key: ot-seminary-lesson-89
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-89-1-samuel-25-31?lang=eng'
    quote: 'Explain that the phrase “encouraged himself in the Lord his God” meant that he trusted in the Lord (see verse 6, footnote a).'

  - where: 'note 30:8 “An answer, and more than was asked”'
    claim: 'The seminary manual asks why David was given the Lord’s direction and Saul was not'
    key: ot-seminary-lesson-89
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-89-1-samuel-25-31?lang=eng'
    quote: 'Why do you think David was blessed with the Lord’s direction but King Saul was not?'
  - where: 'note 30:8 “An answer, and more than was asked”'
    claim: 'Its principle: when we are faithful, we invite the Lord to direct our lives'
    key: ot-seminary-lesson-89
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-89-1-samuel-25-31?lang=eng'
    quote: 'make sure they identify the following principle: When we are faithful, we invite the Lord to direct our lives.'
  - where: 'note 30:8 “An answer, and more than was asked”'
    claim: 'Saul inquired of the LORD and was not answered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/28?lang=eng'
    quote: 'And when Saul inquired of the LORD, the LORD answered him not, neither by dreams, nor by Urim, nor by prophets.'

  - where: 'note 30:14 “The Cherethites”'
    claim: 'BDB: Kerethites, a name for the Philistines or part of them, perhaps Cretans (Crete as their original home); also soldiers of David’s guard, 2 Sam. 8:18'
    key: bdb
    url: 'https://biblehub.com/hebrew/3774.htm'
    quote: 'Kerethites, a name for Philistines or a part of them (perhaps = Cretans, compare ᵐ5 Zephaniah 2:5; Ezekiel 25:15; on Crete as original home of Philistines, see … of soldiers of David''s guard, וְהַמְּלֵתִי ׳הַכּ 2 Samuel 8:18'

  - where: 'note 30:24 “They shall part alike”'
    claim: 'The verb “faint” is connected with a noun meaning a corpse: they were dead-beat'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/30.htm'
    quote: 'were so faint] A verb found only here and in 1 Samuel 30:21, connected with a substantive meaning a corpse; as we should say, they were dead-beat.'
  - where: 'note 30:24 “They shall part alike”'
    claim: 'The rule of dividing spoil between combatants and non-combatants was old (Num. 31:27; Josh. 22:8); David applied it within his army; “the stuff” is the baggage'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/30.htm'
    quote: 'The rule for the division of the spoil between combatants and non-combatants was an ancient one. See Numbers 31:27; and cp. Joshua 22:8. David now enforced a special application of it with reference to the divisions of the army. … the stuff] The baggage. … “Part” = share.'
  - where: 'note 30:24 “They shall part alike”'
    claim: 'At Midian the prey was divided between those who went to battle and the congregation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/31?lang=eng'
    quote: 'And divide the prey into two parts; between them that took the war upon them, who went out to battle, and between all the congregation:'

  - where: 'note 30:26 “Gifts to the elders of Judah”'
    claim: 'Verse 20 is obscure in Hebrew; the sheep and oxen are best understood as taken from the Amalekites as booty, as 30:26–31 shows'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/30.htm'
    quote: '1 Samuel 30:20 is obscure … we must understand by the sheep and oxen those which belonged to the Amalekites, and the flocks taken from them as booty'
  - where: 'note 30:26 “Gifts to the elders of Judah”'
    claim: 'David took a rich booty besides his own property; the number of places he sent presents to shows how large it was'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/30.htm'
    quote: 'he not only recovered his own property, but took a rich booty besides, which his men drove off with shouts of triumph. The number of places to which he sent presents (1 Samuel 30:26-31) shews how large it must have been.'
  - where: 'note 30:26 “Gifts to the elders of Judah”'
    claim: 'The towns were where David wandered during his flight from Saul and had no doubt been helped; the gifts made the elders well disposed and eased his recognition as king after Saul’s death'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/30.htm'
    quote: 'where he had wandered about during his flight from Saul, and in which he had no doubt received assistance. Sending these gifts could not fail to make the elders of these cities well disposed towards him, and so to facilitate his recognition as king'
  - where: 'note 30:26 “Gifts to the elders of Judah”'
    claim: '“A present” is literally “a blessing,” as in 25:27; the enemies of Israel were the enemies of the LORD’s kingdom and cause'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/30.htm'
    quote: 'a present] Lit. a blessing, as in 1 Samuel 25:27. the spoil of the enemies of the Lord] Since Israel was Jehovah’s people, the enemies of Israel were the enemies of His kingdom and His cause'
  - where: 'note 30:26 “Gifts to the elders of Judah”'
    claim: 'One older reading resolves verse 20 by following the Vulgate and Septuagint rather than the Hebrew, with the same sense of booty besides David’s own'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/30.htm'
    quote: 'This verse as it stands admits of no satisfactory explanation. It is best to follow the Vulgate, with which the Sept. in the main agrees'
  - where: 'note 30:26 “Gifts to the elders of Judah”'
    claim: 'The Hebrew for “present” is bǝrākâ, Strong’s 1293, “blessing”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'בְּרָכָ֔ה'
  - where: 'note 30:26 “Gifts to the elders of Judah”'
    claim: 'The men of Judah anointed David king at Hebron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/2?lang=eng'
    quote: 'And the men of Judah came, and there they anointed David king over the house of Judah.'

  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'The faithful invite the Lord to direct their lives'
    key: ot-seminary-lesson-89
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-89-1-samuel-25-31?lang=eng'
    quote: 'When we are faithful, we invite the Lord to direct our lives.'
