chapter: 4
claims:
  - where: when
    claim: 'The chapter is set in Eli’s last days, with the ark at Shiloh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/4?lang=eng'
    quote: 'Let us fetch the ark of the covenant of the Lord out of Shiloh unto us'
  - where: setting
    claim: 'Chapter 3 ends with Samuel established as a prophet and the LORD revealing himself at Shiloh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/3?lang=eng'
    quote: 'And all Israel from Dan even to Beer-sheba knew that Samuel was established to be a prophet of the Lord.'
  - where: setting
    claim: 'The footnote to verse 9 points to Judg. 13:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/4?lang=eng'
    quote: '9c “servants”: Judg. 13:1.'
  - where: setting
    claim: 'The LORD delivered Israel into the hand of the Philistines forty years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/13?lang=eng'
    quote: 'the Lord delivered them into the hand of the Philistines forty years'
  - where: setting
    claim: 'Shiloh held the tabernacle through most of the judges and stayed the religious center until the ark was lost at Ebenezer'
    key: bd-shiloh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shiloh?lang=eng'
    quote: 'in the tribe of Ephraim (Josh. 18:1; Judg. 18:31). The tabernacle was here during the greater part of the period of the Judges, and the place continued to be the religious center of the nation (1 Sam. 1:3) until after the loss of the Ark in the disastrous battle of Ebenezer.'
  - where: setting
    claim: 'The Philistines held the Mediterranean coastal lowland and long struggled with Israel'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'occupied before the days of Abraham (Gen. 21:32) the rich lowland on the Mediterranean coast from Joppa to the Egyptian desert. … For many years there was a struggle for supremacy between them and the Israelites'
  - where: thread
    claim: 'The later victory was won at the place the chapter already calls Eben-ezer'
    key: bd-ebenezer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ebenezer?lang=eng'
    quote: 'The place had previously been the scene of two defeats (1 Sam. 4:1; 5:1); and in the account of these defeats it is called by the name it received later on.'
  - where: setting
    claim: 'The ark stayed twenty years at Kirjath-jearim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/7?lang=eng'
    quote: 'while the ark abode in Kirjath-jearim, that the time was long; for it was twenty years'
  - where: thread
    claim: 'The elders were right that the LORD was not with them; they sent for the ark to save them'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'Because the Lord was not with them, the Israelites were defeated'
  - where: thread
    claim: 'Scripture Helps points from chapter 4 to 7:2–3'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'See 1 Samuel 7:2–3.'
  - where: section 2 plain
    claim: 'The elders were the leaders of the people, not necessarily the priesthood office'
    key: ot-seminary-lesson-83
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-83-1-samuel-4-8?lang=eng'
    quote: 'in this case, the term elders refers to the leaders of the people, not necessarily the priesthood office.'
  - where: section 2 plain
    claim: '“Quit yourselves like men” means “be men”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/4?lang=eng'
    quote: '9a “quit”: OR be men.'
  - where: section 4 plain
    claim: 'Torn clothes and earth on the head were signs of the deepest mourning'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/4.htm'
    quote: 'with his clothes rent and with earth upon his head] Signs of the deepest mourning. Cp. Joshua 7:6; 2 Samuel 1:2'
  - where: 'note 4:1 “Eben-ezer, named after the fact”'
    claim: 'Ebenezer is the stone Samuel set up later; the place was the scene of two defeats and is called in their account by its later name'
    key: bd-ebenezer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ebenezer?lang=eng'
    quote: 'Stone of help. A stone set up by Samuel as a token of gratitude for deliverance from the Philistines (1 Sam. 7:10–12). The place had previously been the scene of two defeats (1 Sam. 4:1; 5:1); and in the account of these defeats it is called by the name it received later on.'
  - where: 'note 4:1 “Eben-ezer, named after the fact”'
    claim: 'The Septuagint opens with the Philistines gathering against Israel'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/1_samuel/4.htm'
    quote: '1And it came to pass in those days that the Philistines gathered themselves together against Israel to war; and Israel went out to meet them and encamped at Abenezer'
  - where: 'note 4:1 “Eben-ezer, named after the fact”'
    claim: 'Samuel names the stone at 7:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/7?lang=eng'
    quote: 'Then Samuel took a stone, and set it between Mizpeh and Shen, and called the name of it Eben-ezer'
  - where: 'note 4:3 “Why the ark went into battle”'
    claim: '“It may save us” suggests Israel might have placed their faith in the ark rather than in the Lord'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'The phrase “it may save us” in verse 3 suggests that the Israelites might have placed their faith in the ark rather than in the Lord. Their wickedness prevented them from receiving the Lord’s strength and protection. Because the Lord was not with them, the Israelites were defeated'
  - where: 'note 4:3 “Why the ark went into battle”'
    claim: 'The ark represented the Lord’s presence; in the conquest Israel carried it as a sign that God was with them'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'The ark of the covenant represented the presence of the Lord. … During their conquest of the promised land, the Israelites carried the ark with them as a symbol and reminder that God was with them.'
  - where: 'note 4:3 “Why the ark went into battle”'
    claim: 'The ark was the most sacred symbol; the Mercy Seat was regarded as the earthly dwelling place of Jehovah'
    key: bd-ark-of-the-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ark-of-the-covenant?lang=eng'
    quote: 'It was the oldest and most sacred of the religious symbols of the Israelites, and the Mercy Seat which formed its covering was regarded as the earthly dwelling place of Jehovah (Ex. 25:22).'
  - where: 'note 4:3 “Why the ark went into battle”'
    claim: 'Their wickedness prevented them from receiving the Lord’s strength and protection'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'Their wickedness prevented them from receiving the Lord’s strength and protection.'
  - where: 'note 4:3 “Why the ark went into battle”'
    claim: 'The elders’ question is followed at once by “Let us fetch the ark”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/4?lang=eng'
    quote: 'Wherefore hath the Lord smitten us to day before the Philistines? Let us fetch the ark of the covenant of the Lord out of Shiloh unto us'
  - where: 'note 4:3 “Why the ark went into battle”'
    claim: 'The Jericho march was by the LORD’s command'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/6?lang=eng'
    quote: 'And the Lord said unto Joshua, See, I have given into thine hand Jericho'
  - where: 'note 4:8 “The Philistines’ many gods”'
    claim: 'BDB lists 1 Sam. 4:8 under ʾĕlōhîm in the sense “gods”'
    key: bdb
    url: 'https://biblehub.com/hebrew/430.htm'
    quote: 'd. gods האלהים Exodus 18:11; Exodus 22:19 (E) 1 Samuel 4:8'
  - where: 'note 4:8 “The Philistines’ many gods”'
    claim: 'BDB: the adjective “mighty” used of gods at 1 Sam. 4:8'
    key: bdb
    url: 'https://biblehub.com/hebrew/117.htm'
    quote: 'nations Ezekiel 32:18; gods 1 Samuel 4:8'
  - where: 'note 4:8 “The Philistines’ many gods”'
    claim: 'BDB: makkāh is “slaughter” at 4:10 and a plague as punishment at 4:8'
    key: bdb
    url: 'https://biblehub.com/hebrew/4347.htm'
    quote: '4 plague, especially disease, as punishment (of ׳י), 1 Samuel 4:8'
  - where: 'note 4:8 “The Philistines’ many gods”'
    claim: 'BDB: makkāh as slaughter at 1 Sam. 4:10'
    key: bdb
    url: 'https://biblehub.com/hebrew/4347.htm'
    quote: '2 = slaughter 1 Samuel 4:10'
  - where: 'note 4:8 “The Philistines’ many gods”'
    claim: 'One older reading: “in the wilderness” alludes to the Red Sea, not the ten plagues'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/1_samuel/4.htm'
    quote: 'with all the plagues] Better, with an utter overthrow, lit. ‘with every kind of smiting.’ The word used is the same as that rendered slaughter in 1 Samuel 4:10, and the allusion is to the overthrow of Pharaoh in the Red Sea, the shores of which are called wilderness in Exodus 13:20, not to the ten plagues'
  - where: 'note 4:11 “The sign given to Eli”'
    claim: 'The man of God foretold that both sons would die in one day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/2?lang=eng'
    quote: 'And this shall be a sign unto thee, that shall come upon thy two sons, on Hophni and Phinehas; in one day they shall die both of them.'
  - where: 'note 4:11 “The sign given to Eli”'
    claim: 'These events fulfilled Samuel’s prophecy about Eli’s family'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'These events fulfilled Samuel’s prophecy that Eli’s family would meet a tragic end.'
  - where: 'note 4:11 “The sign given to Eli”'
    claim: 'The high priesthood stayed in Eli’s family until Abiathar was deprived'
    key: bd-eli
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/eli?lang=eng'
    quote: 'the office remained in his family till the deprivation of Abiathar (1 Kgs. 2:26–27), when it passed back to the family of Eleazar, Aaron’s eldest son.'
  - where: 'note 4:18 “What broke Eli”'
    claim: 'Eli was high priest and judge; his toleration of his sons was the blot on his character'
    key: bd-eli
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/eli?lang=eng'
    quote: 'High priest and judge, a descendant of Aaron through Ithamar, his younger son. … The blot on his character was his toleration of the wickedness of his own sons.'
  - where: 'note 4:18 “What broke Eli”'
    claim: 'The LORD had said Eli restrained not his sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/3?lang=eng'
    quote: 'because his sons made themselves vile, and he restrained them not.'
  - where: 'note 4:21 “I-chabod: the glory gone into exile”'
    claim: 'The footnote renders I-chabod “Where is the glory?”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/4?lang=eng'
    quote: '21a “I-chabod”: IE Where is the glory?'
  - where: 'note 4:21 “I-chabod: the glory gone into exile”'
    claim: 'BDB: I-chabod, “inglorious,” explained in 4:21 by “glory is gone into exile from Israel” (gālâ)'
    key: bdb
    url: 'https://biblehub.com/hebrew/350.htm'
    quote: 'proper name, masculine (inglorious), son of Phinehas (explained 1 Samuel 4:21 by גָּלָה כָבוֺד מִיִּשְׂרָאֵל glory is gone into exile from Israel.'
  - where: 'note 4:21 “I-chabod: the glory gone into exile”'
    claim: 'The verb of “departed” in 4:21–22 is the verb of “the captivity” in Judg. 18:30, gālâ, go into exile'
    key: bdb
    url: 'https://biblehub.com/hebrew/1540.htm'
    quote: '3 go into exile Judges 18:30; 2 Kings 17:23; … גלה כבוד 1 Samuel 4:21,22'
  - where: 'note 4:21 “I-chabod: the glory gone into exile”'
    claim: 'The mercy seat was the covering of the ark'
    key: bd-ark-of-the-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ark-of-the-covenant?lang=eng'
    quote: 'the Mercy Seat which formed its covering was regarded as the earthly dwelling place of Jehovah'
  - where: christ
    claim: 'The ark represented the presence of the Lord'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'The ark of the covenant represented the presence of the Lord.'
  - where: christ
    claim: 'Because the Lord was not with them, Israel was defeated'
    key: scripture-helps-ruth-samuel
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/21-ruth-1-samuel-1-7?lang=eng'
    quote: 'Because the Lord was not with them, the Israelites were defeated by the Philistines'
  - where: christ
    claim: 'To receive the Lord’s help we must place our faith in Him and obey His commandments'
    key: ot-seminary-lesson-83
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel/lesson-83-1-samuel-4-8?lang=eng'
    quote: 'In order to receive the Lord’s help, we must place our faith in Him and obey His commandments.'
  - where: christ
    claim: 'Simply possessing the ark did not protect Israel'
    key: cfm-ot-2026-23
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/23?lang=eng'
    quote: 'When their enemies attacked, the Israelites apparently thought that simply possessing the ark of the covenant would protect them. As you read 1 Samuel 4–6, think about why that didn’t work.'
