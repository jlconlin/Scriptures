    quote: 'Eleazar begat Phinehas, Phinehas begat Abishua, … And Ahitub begat Zadok, and Zadok begat Ahimaaz,'
  - where: 'note 2:35 “Who is the faithful priest?”'
    claim: 'Solomon removed Abiathar to fulfil the word on Eli''s house, and put Zadok in his room'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'So Solomon thrust out Abiathar from being priest unto the Lord; that he might fulfil the word of the Lord, which he spake concerning the house of Eli in Shiloh. … Zadok the priest did the king put in the room of Abiathar.'

