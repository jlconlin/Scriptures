chapter: 2
claims:
  - where: setting
    claim: 'Hannah sings the song not at the birth but years later at the dedication, at the sanctuary itself'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'Note first the timing of this song: it is not at Samuel’s birth but rather several years later at his dedication to the temple. … Also note the setting: she sings this song at the sanctuary itself'
  - where: setting
    claim: 'Eli was high priest and judge, a descendant of Aaron through Ithamar'
    key: bd-eli
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/eli?lang=eng'
    quote: 'High priest and judge, a descendant of Aaron through Ithamar, his younger son.'
  - where: setting
    claim: 'Verses 11–26 give three vignettes (gluttony, Hannah''s devotion, promiscuity) with comments on Samuel between them'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'the text presents three vignettes that condemn the gluttony of Eli’s sons (2:12–17), illustrate Hannah’s continued devotion to her firstborn and Eli’s blessing to Samuel’s parents (2:19–21a), and condemn the promiscuity of Eli’s sons (2:22–25).'
  - where: setting
    claim: '2:11–36 is a transition between Hannah and Samuel''s call, with five references to Samuel''s service'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'Between these two vignettes a narrative transition (2:11–36) details the divine curse which comes upon Eli’s house … five separate references to Samuel’s progressively faithful service to the Lord … (2:11, 18, 21, 26; 3:1a).'
  - where: setting
    claim: 'The man of God is anonymous'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'the “man of God” accomplishes his mission in total anonymity. The account gives no hint as to his identity and background'
  - where: setting
    claim: 'Verse 8 is repeated almost verbatim in Ps. 113:7–8'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/2.htm'
    quote: 'The first three clauses of 1 Samuel 2:8 are repeated verbatim in Psalm 113:7-8.'
  - where: setting
    claim: 'Hannah''s song may be compared with Mary''s'
    key: bd-hannah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hannah?lang=eng'
    quote: 'Her song of thanksgiving may be compared with that of Mary (Luke 1:46–55).'

  - where: thread
    claim: 'The song begins with Hannah''s own change and reaches to the whole world'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'Hannah shares her testimony that though the Lord’s changes might begin with the small and simple matter of a woman having a baby, they can affect the entire world.'
  - where: thread
    claim: 'The house of Eli is brought low, the obscure house of Elkanah lifted up'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'reinforces the contrast between the house of Eli, which is rejected by the Lord despite its long-standing and prominent ritual status in Israel, and the previously obscure house of Elkanah'
  - where: thread
    claim: 'Hannah honoured the Lord above her son; Eli honoured his sons above the Lord; the song''s reversals appear in her life'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'Note the contrast with Hannah, who honored the Lord above her son … The very themes of reversal found in Hannah’s song of praise are evident in her own life'
  - where: thread
    claim: 'Honouring the Lord (2:30) is a major theme of 1 Samuel'
    key: ot-seminary-1-samuel-intro
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel?lang=eng'
    quote: 'One of the major themes of 1 Samuel is the importance of honoring the Lord. In 1 Samuel 2:30 we read, “Them that honour me I will honour, and they that despise me shall be lightly esteemed”'

  - where: section 1 plain
    claim: '“Horn” means power, strength'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/2?lang=eng'
    quote: 'HEB horn; used figuratively, means “power,” “capacity.”'
  - where: section 1 plain
    claim: 'The hungry “cease” to be what they were (hungry)'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/2.htm'
    quote: 'חדל, to cease to be what they were before.'
  - where: section 2 plain
    claim: '“Belial” means worthless'
    key: bd-belial
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/belial?lang=eng'
    quote: 'Worthless. Sometimes translated “wicked” (2 Sam. 23:6); sons of Belial, or wicked men'
  - where: section 2 plain
    claim: 'The priests'' example caused others to despise the offering'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'The poor example of the priests caused others in Israel to abhor “the offering of the Lord” (v. 17).'
  - where: section 4 plain
    claim: '“Would” = was pleased to do, willed'
    key: bdb
    url: 'https://biblehub.com/hebrew/2654.htm'
    quote: 'b. pleased to do a thing with infinitive Judges 13:23; 1 Samuel 2:25; Isaiah 53:10.'
  - where: section 5 plain
    claim: '“Walk before me” refers to priestly service at the sanctuary'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/2.htm'
    quote: 'refers to the service of the priests at the sanctuary as walking before the face of God'
  - where: section 5 plain
    claim: '“Kick ye at” = treat with scorn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/2?lang=eng'
    quote: 'IE treat with scorn.'

  - where: 'note 2:1 “A song at each end of the books of Samuel”'
    claim: 'The prayer is not called a song but is Hebrew poetry, related to the songs of Miriam, Deborah and Mary'
    key: ot-minute-1-samuel-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-2'
    quote: 'Hannah’s prayer is related to the biblical songs of other women, including Miriam and Deborah … In Hannah’s case, the prayer is not specifically called a song but does follow Hebrew poetic tropes, including parallel structures, contrasting points'
  - where: 'note 2:1 “A song at each end of the books of Samuel”'
    claim: 'The song comes at the dedication, not the birth: the time of keeping covenants is the time for praise'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'Once again, Hannah has focused her attention on the keeping of covenants: this is the time for praising the Lord … Just as Hannah brought her sorrows to the temple in chapter 1, she now brings her joy to the temple.'
  - where: 'note 2:1 “A song at each end of the books of Samuel”'
    claim: 'David''s song (2 Sam. 22) echoes Hannah''s (the rock, exalting and debasing); the two bookend Samuel; her hopes fulfilled in his words; the frame makes it sacred history'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'David’s song also has reference to a rock … and to the ideas of exalting and debasing and killing and making alive. … Hannah’s hopes are fulfilled in David’s words. … framing a history book with hymns makes clear that this is not a random chronicle'
  - where: 'note 2:6 “Down to Sheol, and up again”'
    claim: 'Sheol is the underworld, whither men descend at death; 1 Sam. 2:6 cited'
    key: bdb
    url: 'https://biblehub.com/hebrew/7585.htm'
    quote: '1 the underworld … whither men descend at death, Genesis 37:35 (E), Genesis 42:38; Genesis 44:29,31 (J), 1 Samuel 2:6'
  - where: 'note 2:6 “Down to Sheol, and up again”'
    claim: 'The word for “grave” is sheol'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'שְׁא֖וֹל'
  - where: 'note 2:6 “Down to Sheol, and up again”'
    claim: 'One older reading: the words are figurative, of death and the danger of death and rescue; cf. Deut. 32:39'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/2.htm'
    quote: 'This comes from the Lord, who kills, etc. (cf. Deuteronomy 32:39). The words of 1 Samuel 2:6 are figurative. God hurls down into death and the danger of death, and also rescues therefrom (see Psalm 30:3-4).'
  - where: 'note 2:6 “Down to Sheol, and up again”'
    claim: 'A Latter-day Saint reading: one of the rare Old Testament mentions of resurrection; sheol the land of the dead, not a place of punishment'
    key: ot-minute-1-samuel-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-2'
    quote: 'In one of its rare mentions in the Old Testament, Hannah expressed the concept of a resurrection, saying that Yahweh could bring the dead back from the grave. … she‘ol is more a land of the dead than a place of punishment.'

  - where: 'note 2:6 “Down to Sheol, and up again”'
    claim: 'The Church''s footnote at “bringeth” points to the Topical Guide on the Resurrection'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/2?lang=eng'
    quote: 'TG Jesus Christ, Resurrection; Resurrection.'

  - where: 'note 2:7 “The reversals the chapter acts out”'
    claim: 'The song''s main theme is reversals, which the Lord can cause'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'Throughout her song of praise, Hannah mentions multiple examples of reversals in order to develop the theme that the Lord is capable of causing these stunning changes to happen.'
  - where: 'note 2:7 “The reversals the chapter acts out”'
    claim: '“They that were full have hired out themselves for bread” anticipates Eli''s house begging (2:36)'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'anticipates God’s curse of Eli’s house … because Eli’s sons and perhaps Eli himself had abused the sacrificial offering to satisfy their gluttony. As a result, Eli’s extended family are cursed to beg for their sustenance in the future (2:12–17, 36).'
  - where: 'note 2:7 “The reversals the chapter acts out”'
    claim: '“The barren hath born seven” contrasts Hannah and Peninnah, whose lineage is not mentioned again'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'alludes to the contrast between Hannah, who miraculously bore Samuel and several other children, and her perpetual provocateur Peninnah, who “had children” but whose lineage is worthy of no further mention in the Hebrew Bible.'
  - where: 'note 2:7 “The reversals the chapter acts out”'
    claim: '“He bringeth low, and lifteth up”: Eli''s house rejected, Elkanah''s obscure house blessed'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'reinforces the contrast between the house of Eli, which is rejected by the Lord despite its long-standing and prominent ritual status in Israel, and the previously obscure house of Elkanah, which is blessed by God'

  - where: 'note 2:10 ““His anointed”: the first Messiah”'
    claim: 'The Hebrew word is māšîaḥ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'מְשִׁיחֽ/וֹ'
  - where: 'note 2:10 ““His anointed”: the first Messiah”'
    claim: 'In the Septuagint the noun is christos'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/2?lang=eng'
    quote: 'In the Septuagint Greek version, the noun is christos.'
  - where: 'note 2:10 ““His anointed”: the first Messiah”'
    claim: 'The song contains the first reference to the title Messiah'
    key: bd-hannah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hannah?lang=eng'
    quote: 'It contains the first reference to the title Messiah (“his Anointed”) (1 Sam. 2:10).'
  - where: 'note 2:10 ““His anointed”: the first Messiah”'
    claim: 'First use of “anointed” for one sent to save; earlier uses only of the anointed priest in Leviticus; only prophecy of the Anointed One by an ordinary Israelite, a woman; horn of v. 1 and of the Anointed'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'it is the first time in the Old Testament that the word is used to refer to someone that will be sent by the Lord in a saving capacity (as opposed to previous uses of the word, limited to the book of Leviticus, where it refers to the anointed priest'
  - where: 'note 2:10 ““His anointed”: the first Messiah”'
    claim: 'Only prophecy of the Anointed by a regular Israelite, let alone a woman, so it is possible to read it as Hannah''s prophetic gift; she links her horn to the Anointed''s'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'It is also the only time that a prophecy of the coming Anointed One is spoken of by a regular Israelite, let alone a woman. It is therefore possible to read this part of the praise song as the exercise of a prophetic gift on Hannah’s part … Hannah has linked her strength to the strength of the Lord’s Anointed.'
  - where: 'note 2:10 ““His anointed”: the first Messiah”'
    claim: 'Read as prophecy: a choice reference to the future Messiah; the passage shows Hannah had the gift of prophecy'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'the Messiah is “the anointed one” who will break all adversaries of the Lord in pieces … This passage is a choice Old Testament reference to the future Messiah and shows that Hannah was blessed with the gift of prophecy.'

  - where: 'note 2:12 “Priests who did not know the LORD”'
    claim: 'Yada connotes a covenant relationship, especially of knowing God'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'In the Hebrew Bible, yada frequently connotes a special kind of covenant relationship, not just a familiar one, especially where the knowledge of God is concerned.'
  - where: 'note 2:12 “Priests who did not know the LORD”'
    claim: 'Irony: the sons are priests of the LORD yet knew not the LORD; Samuel comes to know Him'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'the narrator observes with biting irony that Eli’s sons “knew not the Lord,” even though they are introduced as “priests of the Lord” (1:3). By contrast, Hannah’s firstborn achieves the rare and noble quality of knowing the Lord'
  - where: 'note 2:12 “Priests who did not know the LORD”'
    claim: '“Knew not” is permanent for the sons; “did not yet know” transitional for Samuel'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: '“Knew not” implies a defining and permanent condition for the sons of Eli; for Samuel, however, “did not yet know” implies a temporary and transitional condition that would soon be remedied.'
  - where: 'note 2:12 “Priests who did not know the LORD”'
    claim: 'Hannah''s “daughter of Belial” (1:16) invites the comparison with Eli''s sons'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'Hannah, when falsely accused by Eli, said that she should not be counted as a “daughter of Belial” (1 Samuel 1:16). The two references to Belial encourage the comparison'

  - where: 'note 2:13 “What the priests took, and when”'
    claim: 'The fat was not to be eaten but burned as the Lord''s portion'
    key: judd-eli-sons
    url: 'https://rsc.byu.edu/vol-2-no-2-2001/eli-his-sons-some-lessons-parents'
    quote: 'According to the law of Moses, the fat was not to be eaten but was to be burned as the Lord’s portion of the sacrifice.'
  - where: 'note 2:13 “What the priests took, and when”'
    claim: 'Forcing worshippers to give up meat before the fat was burned made them break the law'
    key: judd-eli-sons
    url: 'https://rsc.byu.edu/vol-2-no-2-2001/eli-his-sons-some-lessons-parents'
    quote: 'By forcing those who presented sacrifices to relinquish the meat before burning the fat, the sons of Eli were causing them to break the law of Moses.'
  - where: 'note 2:13 “What the priests took, and when”'
    claim: 'They made a mockery of rituals meant to prepare Israel to understand the Atonement'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'Not only are their actions prohibited and a form of theft, but they also make a mockery of the sacred rituals that were instituted in order to prepare the Israelites to understand the Atonement of Jesus Christ.'

  - where: 'note 2:13 “What the priests took, and when”'
    claim: 'The law gave the priests the breast and right thigh of the peace offering; the fat was burned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'And the priest shall burn the fat upon the altar: but the breast shall be Aaron’s and his sons’.'
  - where: 'note 2:13 “What the priests took, and when”'
    claim: 'The fork was the custom; the sons extorted meat before the fat was burned, by force'
    key: judd-eli-sons
    url: 'https://rsc.byu.edu/vol-2-no-2-2001/eli-his-sons-some-lessons-parents'
    quote: 'Hophni and Phinehas compelled the priest’s servant to extort the best portions of meat from the person presenting the sacrifice before the fat was burned and before the meat was boiled'
  - where: 'note 2:19 “A little coat, brought every year”'
    claim: 'The narrator breaks into the account of the sons'' sins to show Samuel serving'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'The writer of this chapter heightens the contrast between Eli’s sons and Samuel by breaking into the middle of the account of Eli’s sons’ wickedness to tell us that Samuel served the Lord faithfully (1 Samuel 2:18).'
  - where: 'note 2:19 “A little coat, brought every year”'
    claim: 'The coat was probably ritual clothing; Hannah gave beyond what was required, as with the offerings of 1:24, against the sons'' taking'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'This is probably ritual clothing that he would have worn as he served in the temple. … Hannah, who has no formal role, chooses instead to give more to the temple each year than was required of her'
  - where: 'note 2:19 “A little coat, brought every year”'
    claim: 'Samuel wore the clothes of a priest; his mother provided priestly robes'
    key: ot-minute-1-samuel-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-2'
    quote: 'Samuel served in the tabernacle while wearing the clothes of a priest. Note that Samuel’s mother still played an important role in his life, affirming his dedication to the Lord by providing priestly robes for him.'
  - where: 'note 2:19 “A little coat, brought every year”'
    claim: 'Eli neglected his sons close by; Hannah watched over hers from a distance'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'In stark contrast with Eli’s general neglect of his sons, in spite of their physical and functional proximity, the narrator specifically mentions Hannah’s continued watch care over her first born, in spite of their physical and functional distance.'
  - where: 'note 2:19 “A little coat, brought every year”'
    claim: 'Because Hannah fulfilled her oath, the Lord blessed her with other children'
    key: ot-minute-1-samuel-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-2'
    quote: 'Because Hannah was a righteous woman and had fulfilled her oath to the Lord to fully dedicate her son to His service, the Lord blessed Hannah with other children'

  - where: 'note 2:22 “The women at the door of the tabernacle”'
    claim: 'One sense of the verb is to serve at the sacred tent, of Levites and, of women, only in Ex. 38:8 and 1 Sam. 2:22; so the women may have served there'
    key: bdb
    url: 'https://biblehub.com/hebrew/6633.htm'
    quote: '2 serve at sacred tent, Levites, with accusative צָבָא Numbers 4:23; Numbers 8:24 (P); women Exodus 38:8 (twice in verse) (P) 1 Samuel 2:22.'
  - where: 'note 2:22 “The women at the door of the tabernacle”'
    claim: 'Shakab (lie with) against yada (knew): a liaison without covenant bond'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'is not yada (knew), as in the virtuous union that produced Samuel, but shakab, translated lie with. Shakab contrasts dramatically with yada and connotes physical, temporary, and profane sexual liaisons, undertaken without spiritual purpose, covenant bond, or sacred devotion.'
  - where: 'note 2:22 “The women at the door of the tabernacle”'
    claim: 'The sons evidently misused their office to entice the women'
    key: ot-manual-1-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-1-15-the-prophet-samuel-and-saul-king-of-israel?lang=eng'
    quote: 'the sons of Eli seduced women and engaged in adulterous acts at the very door of the tabernacle, evidently by misusing their office of priest to entice the women (see v. 22).'
  - where: 'note 2:22 “The women at the door of the tabernacle”'
    claim: 'The repeated “hear” shows Eli learned of it secondhand, disconnected from his sons'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'the narrator reinforces Eli’s neglect of his parental responsibilities with the repeated use of the verb hear(d). This pattern indicates that Eli had become so disconnected from his sons’ lives that he learns about their promiscuity only secondhand'

  - where: 'note 2:25 “Because the LORD would slay them”'
    claim: 'The verb means to be pleased to do a thing, as in Judg. 13:23'
    key: bdb
    url: 'https://biblehub.com/hebrew/2654.htm'
    quote: 'b. pleased to do a thing with infinitive Judges 13:23; 1 Samuel 2:25; Isaiah 53:10.'
  - where: 'note 2:25 “Because the LORD would slay them”'
    claim: 'One older reading: the rebuke made no impression because they were already given up to the judgment of hardening (cf. Ex. 4:21)'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/2.htm'
    quote: '"for," adds the historian, "Jehovah was resolved to slay them." The father''s reproof made no impression upon them, because they were already given up to the judgment of hardening. (On hardening as a divine sentence, see the discussions at Exodus 4:21.)'

  - where: 'note 2:30 “Honouring sons above the LORD”'
    claim: 'Eli chastised his sons but had not done all he could; he restrained them not'
    key: judd-eli-sons
    url: 'https://rsc.byu.edu/vol-2-no-2-2001/eli-his-sons-some-lessons-parents'
    quote: 'Although Eli chastised Hophni and Phinehas, he apparently had not done everything he could to correct their bad behavior. Eli was guilty of neglecting his parental duties toward his sons because “he restrained them not” (1 Samuel 3:13).'
  - where: 'note 2:30 “Honouring sons above the LORD”'
    claim: 'Eli failed to remove them as priests'
    key: ot-minute-1-samuel-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-2'
    quote: 'Because Eli could not help his sons change and, more importantly, because he failed to remove them as priests in the house of God, Eli and his sons would be cut off from God’s covenant.'
  - where: 'note 2:30 “Honouring sons above the LORD”'
    claim: 'The blot on Eli''s character was his toleration of his sons'' wickedness'
    key: bd-eli
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/eli?lang=eng'
    quote: 'The blot on his character was his toleration of the wickedness of his own sons.'
  - where: thread
    claim: 'Hannah honoured the Lord above her son, keeping her covenant at the cost of his presence'
    key: smith-hannah-temple
    url: 'https://rsc.byu.edu/ascending-mountain-lord/lord-bringeth-low-lifteth-hannah-eli-temple'
    quote: 'Note the contrast with Hannah, who honored the Lord above her son by choosing to remain true to the covenant that she had made, even when it meant not enjoying her son’s presence.'
  - where: 'note 2:30 “Honouring sons above the LORD”'
    claim: 'Honouring the Lord is a major theme of 1 Samuel, stated in 2:30'
    key: ot-seminary-1-samuel-intro
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-1-samuel?lang=eng'
    quote: 'One of the major themes of 1 Samuel is the importance of honoring the Lord. In 1 Samuel 2:30 we read, “Them that honour me I will honour, and they that despise me shall be lightly esteemed”'

  - where: 'note 2:35 “Who is the faithful priest?”'
    claim: 'The same word נאמן is “faithful” and “sure” in 2:35'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'נֶאֱמָ֔ן'
  - where: 'note 2:35 “Who is the faithful priest?”'
    claim: 'Ne''eman: sure (house, 1 Sam. 2:35; prophet Samuel, 3:20) and faithful (persons, 1 Sam. 2:35)'
    key: bdb
    url: 'https://biblehub.com/hebrew/539.htm'
    quote: '3 confirmed, established, sure: kingdom 2 Samuel 7:16; house, dynasty 1 Samuel 2:35; … prophet Samuel 1 Samuel 3:20 … 5. reliable, faithful, trusty: persons 1 Samuel 2:35'
  - where: 'note 2:35 “Who is the faithful priest?”'
    claim: 'The shared root suggests the author considers Samuel the promised priest'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'The same Hebrew root is translated “faithful” in the prophecy associated with God’s curse upon Eli’s house … suggesting that the author considers Samuel to be the promised priest, who “shall walk before mine anointed forever.”'
  - where: 'note 2:35 “Who is the faithful priest?”'
    claim: 'The footnote at “priest” points to 1 Kgs. 2:35 and 1 Chr. 29:22'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/2?lang=eng'
    quote: '35b “priest”: 1 Kgs. 2:35; 1 Chr. 29:22.'
  - where: 'note 2:35 “Who is the faithful priest?”'
    claim: 'Eli probably the first high priest of Ithamar''s line; the office stayed until Abiathar''s deprivation, then passed back to Eleazar''s family'
    key: bd-eli
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/eli?lang=eng'
    quote: 'He was probably the first high priest of this line, and the office remained in his family till the deprivation of Abiathar (1 Kgs. 2:26–27), when it passed back to the family of Eleazar, Aaron’s eldest son.'
  - where: 'note 2:35 “Who is the faithful priest?”'
    claim: 'Zadok, of the family of Eleazar, was put in the room of Abiathar'
    key: bd-zadok
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zadok?lang=eng'
    quote: 'He belonged to the family of Eleazar (1 Chr. 6:4–8). … He anointed Solomon (1:32–45); and was finally put in the room of Abiathar. See 1 Kgs. 2:35'
  - where: 'note 2:35 “Who is the faithful priest?”'
    claim: 'Older commentators named Samuel and Zadok, and saw both as types of Christ'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/2.htm'
    quote: 'By the "tried priest," Ephraem Syrus understood both the prophet Samuel and the priest Zadok. … The fathers and earlier theologians also regarded Samuel and Zadok as the type of Christ'
  - where: 'note 2:35 “Who is the faithful priest?”'
    claim: 'One older reading: partially fulfilled in Samuel and Zadok, completely in Christ; the anointed is David and the Son of David'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/2.htm'
    quote: 'only receives its complete and final fulfilment in Christ, the true and eternal High Priest. … we must not exclude either Samuel or Zadok, but must certainly affirm that the prophecy was partially fulfilled in both.'
  - where: 'note 2:35 “Who is the faithful priest?”'
    claim: 'The anointed before whom the priest walks is David and the Son of David'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/1_samuel/2.htm'
    quote: 'Consequently, the anointed of the Lord, before whom the tried priest would walk for ever, is not Solomon, but rather David, and the Son of David, whose kingdom is an everlasting kingdom.'

