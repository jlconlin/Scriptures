chapter: 7
title: Hitherto Hath the LORD Helped Us
tagline: After twenty years Samuel calls Israel back to the LORD; at Mizpeh the people put away their idols, pour out water and confess, and while Samuel offers a lamb and prays, the LORD thunders on the Philistines.
when: 'After the ark had been twenty years at Kirjath-jearim'

setting: |
  Chapter 6 ended with the ark sent up from Beth-shemesh to Kirjath-jearim, a town on the border between Judah and Benjamin about seven and a half miles northwest of Jerusalem. This chapter opens with it settled there and then leaps twenty years. Samuel, who has not been seen since the word of the LORD came to all Israel ([[1 Sam. 4:1]]), steps forward as the leader of the nation. The Israelites are still under the Philistines; the forty years of Philistine rule into which Samson was born ([[Judg. 13:1]]) are about to end.

  After Eli's death Samuel became “the great prophet and judge of Israel, and restored law and order and regular religious worship in the land”; these verses are the account of how he did it. The chapter closes the first part of the book, Samuel's life as the last of the judges; chapter 8 opens the story of the kings. Later scripture remembers this chapter for Samuel's prayers: a psalm sets him “among them that call upon his name” ([[Ps. 99:6]]), and Jeremiah names him beside Moses as an intercessor ([[Jer. 15:1]]).

thread: |
  In chapter 4 Israel fought the Philistines near Eben-ezer, sent for the ark, and was beaten twice. Here the same enemy comes up against the same people, and this time what decides the battle is Israel's repentance. Samuel's terms are simple: return “with all your hearts,” put away the other gods, serve the LORD only, and He will deliver you (verse 3). The people do it. At Mizpeh they pour out water, fast and say, “We have sinned against the LORD” (verse 6). Those are the two parts of sincere repentance the verses show: Israel forsakes its sins in verse 4 and confesses them to the Lord in verse 6.

  Samuel's part was to pray. The gathering at Mizpeh was a day of penitence that set the people right with their God before any fighting, and when the Philistines march on it, Israel asks only that Samuel keep crying to the LORD. He offers a lamb and cries, and the thunder that routs the Philistines is the LORD's answer. Samuel then sets up a stone and names it for the help: “Hitherto hath the LORD helped us” (verse 12). The last verses show what the turning bought: the lost cities back, peace in the land, and a prophet who goes round the country judging Israel all his life.

sections:
  - range: 1-2
    heading: The ark at Kirjath-jearim
    plain: |
      The men of Kirjath-jearim came and took the ark of the Lord up to their town. They brought it into the house of Abinadab on the hill and consecrated his son Eleazar to guard it. The ark stayed at Kirjath-jearim a long time; twenty years went by, and all Israel mourned and longed after the Lord.
  - range: 3-6
    heading: Return to the LORD with all your hearts
    plain: |
      Samuel said to all Israel, “If you are coming back to the Lord with your whole heart, then get rid of the foreign gods and the images of Ashtoreth among you. Set your hearts on the Lord and serve Him alone, and He will rescue you from the Philistines.” So the Israelites got rid of their Baals and their Ashtoreths and served the Lord alone. Then Samuel said, “Gather all Israel at Mizpeh, and I will pray to the Lord for you.” They gathered at Mizpeh. They drew water and poured it out before the Lord, fasted that day, and confessed, “We have sinned against the Lord.” And Samuel judged the Israelites at Mizpeh.
  - range: 7-12
    heading: The LORD thunders on the Philistines
    plain: |
      When the Philistines heard that Israel had gathered at Mizpeh, their lords marched up against them, and the Israelites were afraid when they heard it. They said to Samuel, “Don't stop crying out to the Lord our God for us, so that He will save us from the Philistines.” Samuel took a young lamb still nursing and offered it whole as a burnt offering to the Lord. He cried out to the Lord for Israel, and the Lord answered him. While Samuel was offering the sacrifice, the Philistines came near to attack, but that day the Lord thundered loudly against them and threw them into a panic, and they were beaten before Israel. The men of Israel went out from Mizpeh and chased the Philistines, striking them down all the way to below Beth-car. Then Samuel took a stone and set it up between Mizpeh and Shen. He named it Eben-ezer, “stone of help,” saying, “Up to now the Lord has helped us.”
  - range: 13-17
    heading: Samuel judges Israel
    plain: |
      So the Philistines were humbled and did not come again into Israel's territory, and the Lord's hand was against them as long as Samuel lived. The towns the Philistines had taken from Israel, from Ekron to Gath, were given back, and Israel freed their surrounding lands from Philistine control. There was also peace between Israel and the Amorites. Samuel judged Israel all his life. Every year he went around to Bethel, Gilgal and Mizpeh and judged Israel in all those places. Then he would go back to Ramah, where his home was, and judge Israel there too. He built an altar to the Lord there.

notes:
  - ref: 1
    phrase: sanctified Eleazar his son to keep the ark of the LORD
    kind: history
    title: A keeper for the ark, in a private house
    body: |
      The ark did not go back to a sanctuary; it went into a private house, and one man was set apart to guard it. Kirjath-jearim was neither a priestly nor a Levitical town; on one older reading it was chosen because it was the nearest large town on the road from Beth-shemesh toward Shiloh. Josephus, the first-century Jewish historian, says Abinadab was “by birth a Levite,” a righteous man whose sons served at the ark. One older reading thinks that likely, since after the deaths at Beth-shemesh no one would have dared to leave the ark with a layman. To “sanctify” Eleazar was to consecrate him for this one duty. He was made its keeper; nothing is said of making him a priest.

      Why the ark was not taken on to Shiloh the text does not say. One older reading suggests that its capture was taken as a judgment on the sanctuary that Eli's sons had defiled, so no one would move it again without a word from God, and no such word came. It stayed in Abinadab's house until David came for it ([[2 Sam. 6:2–3]]). The site's note at [[Ps. 132:6]] tells how the psalm remembers that finding.
    sources: [keil-1-samuel, josephus-antiquities, cambridge-1-samuel, lds-scriptures]

  - ref: 2
    phrase: all the house of Israel lamented after the LORD
    kind: words
    title: Twenty years of lamenting after the LORD
    body: |
      The twenty years are not the ark's whole stay at Kirjath-jearim, which lasted until David's day. Two older commentaries read them as the time until Samuel's call in verse 3, the time it took for Israel's grief to become a return to the LORD: in the Hebrew the clauses of verses 2 and 3 are joined and not to be separated, so the sense is that when twenty years had passed and all Israel lamented after the LORD, Samuel spoke. On one of those readings they were dark years, with Israel in subjection to the Philistines and sinking into idolatry, and verse 3 shows the idols were there.

      The verb, *nāhâ*, means to lament or to complain. To lament “after” someone is a picture from ordinary life: one person follows another, pleading and complaining, “until he at length assents.” Another older reading pictures a child following a father who has turned away in anger, begging through tears to be reconciled. Either way, Israel's mourning was a beginning, not yet a return. Samuel's first words tell them what returning will take.
    sources: [keil-1-samuel, cambridge-1-samuel]

  - ref: 3
    phrase: put away the strange gods and Ashtaroth from among you
    kind: history
    title: Baalim and Ashtaroth
    body: |
      The “strange gods” of verse 3 are named in verse 4: Baalim and Ashtaroth, the plurals of Baal and Ashtoreth, the god and goddess of the peoples of Canaan. *Baal* means “possessor, lord,” a word that expressed “the relation between lord and slave.” He was worshipped with different rites in different places, which is why the text speaks of Baals in the plural. Ashtoreth was the goddess worshipped beside him. She was also a goddess of war, and the Philistines honored her as one: they will hang Saul's armor in her temple ([[1 Sam. 31:10]]). Their worship had never been fully rooted out of Israel in the days of the judges ([[Judg. 2:11–13]]; [[Judg. 10:6]]).

      Samuel puts the idols first and the Philistines second. Turning to the LORD “with all your hearts” has to show in something the people can do, and putting away the other gods is that thing; only then comes “he will deliver you.” Israel had made the same turn once before, when it “put away the strange gods from among them, and served the LORD” ([[Judg. 10:16]]); the site's note on Judges 10 tells that story.
    sources: [bd-baal, cambridge-1-samuel, lds-scriptures]

  - ref: 6
    phrase: drew water, and poured it out before the LORD
    kind: symbol
    title: Water poured out before the LORD
    body: |
      The water poured on the ground was, on the older commentaries' reading, a sign of hearts poured out in repentance. The rite has no exact parallel elsewhere in the Old Testament, but the image does. Hannah told Eli she had “poured out my soul before the LORD” ([[1 Sam. 1:15]]), a psalm says “pour out your heart before him” ([[Ps. 62:8]]), and Lamentations says “pour out thine heart like water before the face of the Lord” ([[Lam. 2:19]]). The ancient Aramaic paraphrase of the verse, the Targum, says so outright, as one older reading reports it: “They poured out their heart like water in penitence before the Lord.”

      Spilled water cannot be gathered up again, and on that reading the act was a confession without words: *we are before You like water poured out*, emptied by distress that their own sin had brought on them. The fast said the same thing. Then the people said it aloud: “We have sinned against the LORD.” The words explained and confirmed what the water and the fasting had already shown.
    sources: [keil-1-samuel, cambridge-1-samuel]

  - ref: 8
    phrase: Cease not to cry unto the LORD our God for us
    kind: scripture
    title: A people who ask the prophet to pray
    body: |
      When the Philistines march on Mizpeh, Israel turns to the one thing Samuel had offered: “I will pray for you unto the LORD” (verse 5). The people's fear turns into a single request: that Samuel keep crying out.

      Prophets interceding for a people in danger is a pattern in scripture: they tried “by intercessory prayers” to turn aside the doom hanging over their people, and Samuel's prayer at Mizpeh (verses 5–9) is one of the examples given. Samuel prays for Israel again when they ask for a king ([[1 Sam. 8:6]]), at the end of his judgeship, where he calls it a sin to stop ([[1 Sam. 12:23]]), and over Saul ([[1 Sam. 15:11]]).
    sources: [sc-knowhy-17]

  - ref: 9
    phrase: Samuel took a sucking lamb
    kind: prophets
    title: Samuel's sacrifice and his priesthood
    body: |
      Samuel could offer a burnt offering, a duty “typically reserved for Levite priests,” because he held the Melchizedek Priesthood, the higher priesthood the prophets held.

      That answer rests on Joseph Smith's teaching: “All priesthood is Melchizedek; but there are different portions or degrees of it. … All the prophets had the Melchizedek Priesthood.” In another report of the same teaching he adds that they “were ordained by God himself,” which means that God either ordained them Himself or sent a messenger to do it. President Joseph Fielding Smith explained how that fits a nation that lived under the Aaronic Priesthood. The higher priesthood was withdrawn “from the people as a body, but the Lord still left among them men holding the Melchizedek Priesthood, with power to officiate in all its ordinances, so far as he determined,” and he names Samuel among them.

      This was not a single exception. Samuel will sacrifice again ([[1 Sam. 9:13]]; [[1 Sam. 16:2–5]]) and even builds his own altar at Ramah (verse 17); though not a priest, he “constantly offered sacrifice at various places.” Whether he was also a Levite by descent is a separate question, taken up at [[1 Sam. 1:1]]. The Church's answer does not depend on it.
    sources: [scripture-helps-ruth-samuel, ttp-joseph-smith-8, millet-prophets-priesthood, bd-samuel]

  - ref: 9
    phrase: offered it for a burnt offering wholly unto the LORD
    kind: words
    title: A young lamb, offered whole
    body: |
      “Wholly” means that the lamb went onto the altar whole, without being cut up or divided. It was a “sucking lamb,” still nursing; the law accepted a young animal for sacrifice from its eighth day ([[Lev. 22:27]]). Two older readings say what the details meant. In one, burning the whole animal showed the entire consecration to the LORD of the people who were pleading for deliverance. In the other, a newborn lamb fitted a nation that had just been “new-born” by its turning back to the LORD.

      The offering and the prayer go together in the verse: Samuel offers, Samuel cries, and the LORD hears. As one older reading puts it, “The sacrifice was the substratum for prayer.” The Philistines attack while the lamb is still on the altar (verse 10).
    sources: [keil-1-samuel, cambridge-1-samuel, lds-scriptures]

  - ref: 10
    phrase: the LORD thundered with a great thunder on that day upon the Philistines
    kind: scripture
    title: The LORD’s answer in thunder
    body: |
      The thunder was the LORD's answer to Samuel's cry. The Hebrew says He thundered “with a great voice,” and in the psalms thunder is His voice: “The voice of the LORD is upon the waters: the God of glory thundereth” ([[Ps. 29:3]]). Hannah had sung at the start of the book that “out of heaven shall he thunder upon them” ([[1 Sam. 2:10]]), and one older reading sets her line beside this verse.

      “Discomfited” renders a Hebrew word for the confusion of a sudden panic, used above all of defeats that come from God. It describes the LORD troubling the Egyptians at the sea ([[Ex. 14:24]]), routing the kings before Joshua at Gibeon ([[Josh. 10:10]]), and routing Sisera's army before Barak ([[Judg. 4:15]]). Israel's part comes afterward. The battle is won before they leave Mizpeh, and they go out to pursue an army that is already running (verse 11).
    sources: [keil-1-samuel, cambridge-1-samuel]

  - ref: 12
    phrase: Hitherto hath the LORD helped us
    kind: history
    title: 'Hitherto: the help so far'
    body: |
      The stone is named for help already given: “hitherto” means *up to this time*, and the stone stood as a lasting memorial that the LORD had helped His people this far. Samuel's words look back, but on one older reading they also look ahead: “The deliverances of the past are a pledge of continued help for the future.”
    sources: [keil-1-samuel, cambridge-1-samuel]

  - ref: 13
    phrase: they came no more into the coast of Israel
    kind: history
    title: No more, for a time
    body: |
      The Philistines did come back, and the verse does not contradict that. Within Samuel's lifetime they hold a garrison at Gibeah ([[1 Sam. 10:5]]), take away every smith in Israel ([[1 Sam. 13:19]]) and invade more than once ([[1 Sam. 13:5]]; [[1 Sam. 17:1]]). The same words are used of Syrian raiders in [[2 Kgs. 6:23]], and the very next verse there tells of a fresh invasion, so a Hebrew writer could use the phrase relatively. Older commentaries read it here either as a general statement in a brief summary, or as limited to the years Samuel was active as judge, or as meaning that the Philistines never again came in with lasting success. The second half of the verse says why: “the hand of the LORD was against the Philistines all the days of Samuel.”

      What did end here was the oppression of [[Judg. 13:1]], the forty years in which Samson had only begun to deliver Israel (see [[Judg. 13:5]]). The Student Manual sets the two men side by side. Both were born to barren women through the Lord's intervention, and both were to be Nazarites for life. Samson had great strength but did not dedicate himself to the Lord, while Samuel freed Israel “because he had great spiritual strength and power.”
    sources: [cambridge-1-samuel, keil-1-samuel, ot-manual-1-samuel-1]

  - ref: 14
    phrase: there was peace between Israel and the Amorites
    kind: history
    title: Cities restored, and peace with the Amorites
    body: |
      The victory changed things on both sides of Israel's land. To the west, the towns the Philistines had taken were given back. “From Ekron even unto Gath” marks the line they ran along, up to the Philistine border; it does not mean Israel took those two cities. Within the land, the Amorites kept the peace. On one older reading the name probably meant “highlander” and is sometimes used loosely of all the peoples who were in the land before Israel, perhaps here too; on another, the Canaanite peoples, the Amorites the strongest of them, stayed at peace after seeing the Philistines beaten.
    sources: [keil-1-samuel, cambridge-1-samuel]

  - ref: 16
    phrase: in circuit to Beth-el, and Gilgal, and Mizpeh
    kind: history
    title: A judge on circuit
    body: |
      Samuel judged Israel by governing it, and he did it by traveling. On the older commentaries' reading his office as judge dates from Mizpeh, where as prophet he led the people's repentance and then, as their chief magistrate, set the nation's affairs in order (verse 6). Every year he made a round of three old holy places. Bethel was where Jacob saw the ladder; Gilgal was Israel's first camp after crossing the Jordan; Mizpeh was where the tribes had assembled before ([[Judg. 20:1]]). Then he came home to Ramah. The Septuagint, the ancient Greek translation, reads “in all these sanctuaries,” and whether or not that was the original wording, all these towns, like Ramah with its altar, were places of sacrifice. With the ark in a private house there was no single center of worship, and the prophet went to the people.

      “All the days of his life” (verse 15) still allows for change. In his old age Samuel made his sons judges ([[1 Sam. 8:1]]), and Saul became king long before Samuel died. After Saul was appointed, Samuel “seems to have ceased to act as judge, but he continued to be the prophet and representative of Jehovah.” How the man who offered the lamb at Mizpeh could sacrifice at these places is the subject of the note on verse 9.
    sources: [keil-1-samuel, cambridge-1-samuel, bd-samuel]

christ: |
  The LORD to whom Samuel called Israel back is Jehovah, the premortal Christ (see [[Ex. 3:14]]). The Church's footnote at verse 3 sends the reader to the risen Lord's own call in the Book of Mormon: “how oft will I gather you as a hen gathereth her chickens under her wings, if ye will repent and return unto me with full purpose of heart” ([[3 Ne. 10:6]]). At Mizpeh Israel did what that return takes. They put away what had taken His place, poured out their hearts, and said “We have sinned,” and the LORD heard Samuel's cry and delivered them, as verse 3 had promised.

  The same two marks of repentance hold for a disciple now: “behold, he will confess them and forsake them” ([[D&C 58:43]]).

explore: |
  - **Samuel the intercessor.** [[1 Sam. 12:19–23]], his promise not to stop praying; [[Ps. 99:6]] and [[Jer. 15:1]], where later scripture remembers it.
  - **Returning with all the heart.** [[Deut. 30:2–10]], the promise behind verse 3; [[Judg. 10:10–16]], an earlier putting away of strange gods; [[3 Ne. 10:4–7]].
  - **The ark's road on.** [[2 Sam. 6:2–3]] and [[Ps. 132:6]].

