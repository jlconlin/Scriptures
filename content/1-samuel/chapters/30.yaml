chapter: 30
title: David Encouraged Himself in the LORD
tagline: David comes home from the Philistine army to find Ziklag burned and every family carried off by the Amalekites; with his own men talking of stoning him, he strengthens himself in the LORD, asks, is told to pursue, recovers everything, and makes the spoil a gift shared alike and sent to the towns of Judah.
when: 'While the Philistines fought Saul, at Ziklag and in the south country'

setting: |
  David had been living at Ziklag, the town Achish king of Gath had given him, for a year and four months ([[1 Sam. 27:6]]–7). It lay in the Negev, the dry south country; its earlier history is in the note at [[1 Sam. 27:6]]. In chapter 29 the Philistine lords refused to take David into battle against Israel, and Achish sent him home. He reached Ziklag on the third day after leaving the Philistine army.

  While David was pursuing the Amalekites, the Philistines went to battle against Israel on Gilboa, and chapter 31 tells how Saul and three of his sons died there. The two chapters run side by side. When the news of Saul's death reached David, he had been back at Ziklag two days “from the slaughter of the Amalekites” ([[2 Sam. 1:1]]). Abiathar the priest, the one survivor of Nob ([[1 Sam. 22:20]]), is still with him with the ephod, and the towns he sends gifts to in verses 26–31 include Hebron, where Judah would soon anoint him ([[2 Sam. 2:1–4]]).

thread: |
  The chapter goes from the bottom to the top in a few verses. David and his men weep until they cannot weep any more; his own wives are gone; the men who followed him into exile talk of stoning him. The turn is one clause: “but David encouraged himself in the LORD his God” (verse 6). Everything after it follows from that. He asks the LORD, and is answered, as Saul in his last days was not ([[1 Sam. 28:6]]). He pursues, and he recovers everything.

  The second half is about what David does with what he recovered. To him it is “that which the LORD hath given us” (verse 23), so the men too exhausted to go on share it equally with those who fought, and part of the spoil goes as a gift to the elders of Judah, the men who would soon make him their king ([[2 Sam. 2:4]]).

sections:
  - range: 1-6
    heading: Ziklag burned
    plain: |
      On the third day David and his men came back to Ziklag. The Amalekites had raided the Negev and Ziklag; they had attacked Ziklag and burned it, and had taken captive the women who were there. They killed no one, young or old, but carried them off and went on their way. When David and his men reached the town, they found it burned, and their wives, sons and daughters taken captive. David and the people with him wept aloud until they had no strength left to weep. David's two wives had been taken too, Ahinoam of Jezreel and Abigail, the widow of Nabal of Carmel. David was in great distress, because the men were talking of stoning him; every one of them was bitter over his sons and daughters. But David found strength in the Lord his God.
  - range: 7-15
    heading: David asks, and pursues
    plain: |
      David said to the priest Abiathar, son of Ahimelech, “Bring me the ephod,” and Abiathar brought it. David asked the Lord, “Shall I pursue this raiding party? Will I overtake them?” The Lord answered, “Pursue them, for you will certainly overtake them and recover everything.” So David set out with his six hundred men and came to the Besor ravine, where some stayed behind: two hundred of them were too exhausted to cross it, and David went on with four hundred. In the open country they found an Egyptian and brought him to David. They gave him food and water, a piece of fig cake and two clusters of raisins, and when he had eaten he revived, for he had had nothing to eat or drink for three days and nights. David asked him, “Whose man are you, and where are you from?” He said, “I am an Egyptian, the slave of an Amalekite. My master left me behind because I fell sick three days ago. We raided the Negev of the Cherethites, the territory of Judah and the Negev of Caleb, and we burned Ziklag.” David asked, “Will you take me down to this raiding party?” He answered, “Swear to me by God that you will not kill me or hand me over to my master, and I will take you down to them.”
  - range: 16-20
    heading: Everything recovered
    plain: |
      He led David down, and there they were, spread out over the whole countryside, eating, drinking and celebrating because of the great plunder they had taken from the land of the Philistines and from the land of Judah. David struck them from twilight until the evening of the next day, and not one of them escaped except four hundred young men who rode off on camels and fled. David recovered everything the Amalekites had taken, and he rescued his two wives. Nothing was missing, young or old, son or daughter, plunder or anything else they had taken; David brought it all back. David also took all the flocks and herds, which were driven ahead of the other livestock, and it was said, “This is David's plunder.”
  - range: 21-25
    heading: They shall share alike
    plain: |
      Then David came to the two hundred men who had been too exhausted to follow him and had been left at the Besor ravine. They came out to meet David and the men with him, and David greeted them. But all the wicked and worthless men among those who had gone with David said, “Because they did not go with us, we will not give them any of the plunder we recovered. Each man may take his wife and children and go.” David said, “You must not do that, my brothers, with what the Lord has given us. He has protected us and handed over to us the raiders who came against us. Who would listen to you in this? The share of the man who stayed with the baggage is to be the same as the share of the man who went into battle. They will all share alike.” From that day on David made it a statute and an ordinance for Israel, as it is to this day.
  - range: 26-31
    heading: Gifts to the towns of Judah
    plain: |
      When David came to Ziklag, he sent some of the plunder to the elders of Judah, his friends, with the message, “Here is a gift for you from the plunder of the Lord's enemies.” He sent it to those in Bethel, Ramoth of the Negev and Jattir; in Aroer, Siphmoth and Eshtemoa; in Rachal, the towns of the Jerahmeelites and the towns of the Kenites; in Hormah, Chor-ashan and Athach; and in Hebron, and to all the places where David and his men had moved about.

notes:
  - ref: 1
    phrase: the Amalekites had invaded the south, and Ziklag
    kind: history
    title: Amalek at Ziklag
    body: |
      The raiders were Amalekites, the desert people David had been raiding from Ziklag among others ([[1 Sam. 27:8–9]]), and with him and his men away with the Philistine army they struck the town he had made his base. Their long war with Israel is told in the note at [[1 Sam. 27:8]]; this raid and David's answer to it are part of the breaking of their power. Why there are still Amalekites to fight after Saul was sent to destroy them is taken up at [[1 Sam. 15:3]].

      The text gives no reason for the raid; it says what the raiders did and did not do. They burned the town but killed no one, “either great or small” ([[1 Sam. 30:2]]); they carried off the women and children and went their way. That is why the chapter can end with every one of them brought home: “there was nothing lacking to them, neither small nor great” ([[1 Sam. 30:19]]).
    sources: [bd-amalek, bd-ziklag, lds-scriptures]

  - ref: 6
    phrase: David encouraged himself in the LORD his God
    kind: words
    title: Strengthened himself in the LORD
    body: |
      “Encouraged himself” is, in the Hebrew, a reflexive form of *ḥāzaq*, “to be strong”: David strengthened himself, or in this verse's sense gained strength, and he found it “in the LORD.” David had every reason to have none. His own two wives were among the captives (verse 5), and the men who had shared his years of flight, bitter over their sons and daughters, were talking of stoning him. The clause says where he turned when no one around him could hold him up: it is a phrase of trust, and it “meant that he trusted in the Lord.”
    sources: [oshb-wlc, bdb, ot-seminary-lesson-89]

  - ref: 8
    phrase: 'Pursue: for thou shalt surely overtake them, and without fail recover all'
    kind: history
    title: An answer, and more than was asked
    body: |
      David asked the LORD and was answered, and the answer promised more than he had asked. He asked through Abiathar and the ephod, as he had at Keilah; how that worked is explained at [[1 Sam. 23:9]]. He asked two things, whether to pursue and whether he would overtake them. The LORD said yes to both and added a third: he would recover everything. Verses 18–19 report it kept to the last son and daughter.

      Saul had asked the LORD and got no answer, “neither by dreams, nor by Urim, nor by prophets” ([[1 Sam. 28:6]]). The difference between the two kings is put as a principle: “When we are faithful, we invite the Lord to direct our lives.”
    sources: [ot-seminary-lesson-89, lds-scriptures]

  - ref: 14
    phrase: the south of the Cherethites
    kind: history
    title: The Cherethites
    body: |
      The Cherethites were a Philistine people, or a part of them, living in the south. The name may mean Cretans, on the view that Crete was the Philistines' original home. The Egyptian names three districts of the Negev that the raiders struck: the Philistines' part, Judah's part, and the part called Caleb's. So the Amalekites had plundered Philistine territory as well as Judah's, as verse 16 says. The name comes back in David's own story: the soldiers of his guard are called “the Cherethites and the Pelethites” ([[2 Sam. 8:18]]).
    sources: [bdb]

  - ref: 24
    phrase: so shall his part be that tarrieth by the stuff
    kind: history
    title: They shall part alike
    body: |
      David's ruling made the men who stayed with the baggage full partners with the men who fought, and he grounded it in whose the spoil was. Two hundred of the six hundred had been too spent to cross the brook Besor (verse 10). The Hebrew word for “faint” there and in verse 21 is connected with a noun meaning a corpse: they were dead-beat. The “wicked men and men of Belial” ([[1 Sam. 30:22]]; the phrase is explained at [[Judg. 19:22]]) would give them back their wives and children and nothing more. David's answer was that the plunder was not the fighters' to hold back. It was “that which the LORD hath given us, who hath preserved us” ([[1 Sam. 30:23]]). “The stuff” is the baggage.

      In one older reading the principle was not new. When Israel took spoil from Midian, the LORD had the prey divided between the men who went to battle and the whole congregation ([[Num. 31:27]]), and Joshua sent the eastern tribes home to “divide the spoil of your enemies with your brethren” ([[Josh. 22:8]]). David applied the old rule within his own army, and verse 25 says it stood as a statute and an ordinance for Israel from that day on.
    sources: [cambridge-1-samuel, lds-scriptures]

  - ref: 26
    phrase: Behold a present for you of the spoil of the enemies of the LORD
    kind: history
    title: Gifts to the elders of Judah
    body: |
      David sent some of the spoil to the towns of Judah, the places where he and his men had moved about while he fled from Saul. The spoil he could spare is accounted for in verse 20, which is obscure in Hebrew. One older reading keeps the Hebrew and takes the flocks and herds there to be the Amalekites' own, taken as booty besides what David recovered; another reaches the same sense by following the Latin Vulgate and the Septuagint instead. On either reading the long list of towns (verses 27–31) shows how large the spoil was, and the first of those readings adds that in these towns David had “no doubt received assistance.”

      The word for “present” is literally “a blessing” (*bǝrākâ*), the word Abigail had used of her own gift to David ([[1 Sam. 25:27]]). “The spoil of the enemies of the LORD” rests, in one older reading, on Israel's being the LORD's people, so that its enemies were the enemies of His cause. The same older readings see a purpose in the gifts: they “could not fail to make the elders of these cities well disposed” toward David as king after Saul's death, which came at once (chapter 31). Hebron, the last town named, is where the LORD would send him and where the men of Judah anointed him king ([[2 Sam. 2:1–4]]).
    sources: [keil-1-samuel, cambridge-1-samuel, oshb-wlc, lds-scriptures]

christ: |
  The LORD in whom David strengthened himself is Jehovah, the premortal Jesus Christ ([[Ex. 3:14]]), and in this chapter He does what David could not: He answers, He preserves, and He restores all that was lost, so that David can only call what he brought home “that which the LORD hath given us” ([[1 Sam. 30:23]]).

  When home and family seem gone and even companions turn, strength is still to be found in the Lord, and those who are faithful invite Him to direct what they do next. What He restores comes as a gift, and a gift is shared with those who were too worn to go further.

explore: |
  - **Sharing the spoil.** [[Num. 31:25–27]]; [[Josh. 22:8]].
  - **Two kings asking the LORD.** [[1 Sam. 28:6]], Saul unanswered; [[1 Sam. 30:8]], David answered; [[2 Sam. 2:1]], David asking again before he goes up to Hebron.
  - **Amalek's end.** [[1 Sam. 15:2–3]]; [[2 Sam. 1:1–13]], where an Amalekite brings David the news of Saul's death; [[2 Sam. 8:12]].

