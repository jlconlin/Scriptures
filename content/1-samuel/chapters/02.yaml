chapter: 2
title: He Bringeth Low, and Lifteth Up
tagline: Hannah sings of the LORD who overturns the proud and lifts the lowly, and the chapter shows Him doing it at Shiloh, where Eli's sons rob the offerings while the boy Samuel grows before the LORD.
when: 'In the days of Eli, at Shiloh, after Samuel was weaned'

setting: |
  Hannah sings this song at Shiloh, not when Samuel is born but years later, when she brings the weaned boy to the sanctuary and leaves him there ([[1 Sam. 1:24–28]]). Her praise comes with the keeping of her vow, in the place where she had wept and prayed. The sanctuary is in the charge of Eli, high priest and judge, a descendant of Aaron through Aaron's younger son Ithamar; his sons Hophni and Phinehas serve with him as priests ([[1 Sam. 1:3]]).

  After the song the chapter is a bridge between Hannah's story and Samuel's call in chapter 3. It tells of Eli's household in three scenes (the sons' greed with the offerings, Hannah's yearly visit and Eli's blessing, the sons' immorality), and between the scenes it returns to the boy Samuel serving the LORD (verses 11, 18, 21 and 26, and once more at [[1 Sam. 3:1]]). It ends with a man of God, never named, who announces the fall of Eli's house; Samuel will hear the same judgment from the LORD himself ([[1 Sam. 3:11–14]]).

  The song was not forgotten. Verse 8 returns almost word for word in [[Ps. 113:7–8]], and Mary's song in Luke can be set beside it ([[Luke 1:46–55]]).

thread: |
  Hannah's song says what the LORD does: “he bringeth low, and lifteth up” (verse 7). The rest of the chapter shows Him doing it. Her song begins with her own change, the barren woman who has borne a son and can now answer those who mocked her, but it reaches to the ends of the earth and closes with the LORD's king and anointed (verse 10). The changes the LORD makes may begin with one woman's child, but they reach the whole world.

  Then the story turns to Shiloh and lets the reversal happen there. The priests' sons, at the center of Israel's worship, “knew not the LORD” and take for themselves what belonged to Him. The child of an obscure family ministers before the LORD, and his mother keeps giving. The narrator sets the two side by side, scene against scene, so that the house long prominent in the priesthood and the house no one had heard of trade places.

  The man of God names the principle: “them that honour me I will honour, and they that despise me shall be lightly esteemed” (verse 30). Eli honored his sons above the LORD; Hannah honored the LORD above her son, keeping her vow even though it cost her his daily company.

sections:
  - range: 1-10
    heading: Hannah's song
    plain: |
      Hannah prayed: “My heart rejoices in the LORD; my strength is raised high by the LORD. I can answer my enemies boldly, because I rejoice in Your salvation. No one is holy like the LORD; there is no one besides You, and there is no rock like our God. Stop your proud talk; let no arrogance come from your mouth, for the LORD is a God who knows, and He weighs what people do. The bows of the mighty are broken, and those who stumbled are clothed with strength. Those who had plenty hire themselves out for bread, and those who were hungry are hungry no more. The barren woman has borne seven, and the mother of many children pines away. The LORD puts to death and gives life; He brings down to the grave and brings up. The LORD makes poor and makes rich; He brings low and lifts up. He raises the poor from the dust and the beggar from the dunghill, to seat them among princes and give them a throne of honor. The pillars of the earth are the LORD's, and He has set the world on them. He will guard the steps of His faithful ones, but the wicked will be silenced in darkness, for no one wins by strength. Those who oppose the LORD will be shattered; He will thunder against them from heaven. The LORD will judge the ends of the earth. He will give strength to His king and raise high the strength of His anointed.”
  - range: 11-17
    heading: Eli's sons and the offerings
    plain: |
      Elkanah went home to Ramah, and the boy served the LORD under Eli the priest. Eli's sons were worthless men; they did not know the LORD. This is how the priests dealt with the people. Whenever a man offered a sacrifice, the priest's servant came while the meat was boiling, with a three-pronged fork in his hand, and thrust it into the pan or kettle or cauldron or pot, and whatever the fork brought up the priest took for himself. They did this to every Israelite who came to Shiloh. Worse, even before the fat was burned, the priest's servant would come and say to the man sacrificing, “Give the priest meat to roast; he won't take boiled meat from you, only raw.” If the man answered, “Let them burn the fat first, and then take as much as you want,” the servant would say, “No, give it to me now, or I'll take it by force.” So the young men's sin was very great before the LORD, for people came to despise the LORD's offering.
  - range: 18-21
    heading: Samuel and his mother's gift
    plain: |
      But Samuel served before the LORD, a boy wearing a linen ephod. Every year his mother made him a little robe and brought it to him when she came up with her husband to offer the yearly sacrifice. Eli would bless Elkanah and his wife: “May the LORD give you children by this woman in place of the child she lent to the LORD.” Then they went home. The LORD blessed Hannah; she conceived and bore three sons and two daughters. And the boy Samuel grew up in the presence of the LORD.
  - range: 22-26
    heading: Eli rebukes his sons
    plain: |
      Eli was very old. He heard about everything his sons were doing to all Israel, and that they slept with the women who gathered at the entrance of the tabernacle. He said to them, “Why do you do such things? I hear from all the people about your wicked deeds. No, my sons; it is not a good report that I hear. You are making the LORD's people sin. If one man sins against another, a judge will decide his case; but if a man sins against the LORD, who will plead for him?” But they would not listen to their father, for the LORD willed to put them to death. And the boy Samuel kept growing, in favor with the LORD and with people.
  - range: 27-36
    heading: The man of God's message to Eli
    plain: |
      A man of God came to Eli and said, “This is what the LORD says: I plainly revealed Myself to your father's house when they were in Egypt under Pharaoh, did I not? I chose him out of all the tribes of Israel to be My priest, to offer on My altar, to burn incense, and to wear an ephod before Me, and I gave your father's house all the offerings Israel makes by fire. Why then do you treat with scorn My sacrifice and My offering, which I commanded in My dwelling? Why do you honor your sons above Me, fattening yourselves on the best of every offering of My people Israel? So the LORD, the God of Israel, says: I did say that your house and your father's house would serve before Me for ever. But now the LORD says: Far be it from Me! Those who honor Me I will honor, and those who despise Me will be held of little worth. The days are coming when I will cut off your arm and the arm of your father's house, so that no one in your house will live to be old. You will see an enemy in My dwelling, in all the good God gives Israel, and there will never be an old man in your house. The one of yours whom I do not cut off from My altar will be left to wear out your eyes and grieve your heart, and all your descendants will die in the prime of life. This will be the sign to you, what happens to your two sons, Hophni and Phinehas: they will both die on the same day. I will raise up for Myself a faithful priest, who will do what is in My heart and in My mind. I will build him a sure house, and he will serve before My anointed for ever. And everyone left in your house will come and bow down to him for a piece of silver and a morsel of bread, and say, ‘Please put me in one of the priests' offices, so that I may have a piece of bread to eat.’”

notes:
  - ref: 1
    phrase: And Hannah prayed, and said
    kind: scripture
    title: A song at each end of the books of Samuel
    body: |
      Hannah's prayer is a song of praise, and it opens a history that David's song will close. The text calls it a prayer, but it is poetry, built of parallel lines and contrasts, like the songs of Miriam and Deborah ([[Ex. 15:20–21]]; [[Judg. 5:1–31]]). Its timing is part of its meaning. Hannah sings when she keeps her vow, not when her son is born: the day she gives him up is the day for praise, and she brings her joy to the same sanctuary where she had brought her sorrow.

      Near the end of 2 Samuel, David sings a psalm of his own ([[2 Sam. 22]]), with the same rock (“who is a rock, save our God?” [[2 Sam. 22:32]]) and the same LORD who brings down the haughty and lifts up His servant ([[2 Sam. 22:28]], [[2 Sam. 22:49]]). Where Hannah sings of reversals still to come, David praises victories already won, so that her hope is answered in his words. Framing the history of Samuel, Saul and David with two hymns marks it as sacred history, not a chronicle of events: the LORD's hand is the subject.
    sources: [ot-minute-1-samuel-2, smith-hannah-temple]

  - ref: 6
    phrase: he bringeth down to the grave, and bringeth up
    kind: words
    title: Down to Sheol, and up again
    body: |
      The line claims for the LORD power over death itself. “The grave” here is *šǝʾôl* (Sheol), the underworld to which people were thought to go down at death, more a land of the dead than a place of punishment. The parallel lines make one statement in two ways: the LORD kills and makes alive; He brings down to Sheol and brings up. The Song of Moses has the same claim, “I kill, and I make alive” ([[Deut. 32:39]]).

      How far Hannah meant it is read in two ways. One Latter-day Saint reading takes the verse as one of the Old Testament's rare statements of resurrection, a God who can bring the dead back from Sheol, and the Church's footnote at “bringeth” points to the Topical Guide's entries on the Resurrection. One older reading takes the words as figurative: God brings people into death or the danger of death and rescues them from it.
    sources: [bdb, oshb-wlc, keil-1-samuel, ot-minute-1-samuel-2, lds-scriptures]

  - ref: 7
    phrase: he bringeth low, and lifteth up
    kind: structure
    title: The reversals the chapter acts out
    body: |
      The song's reversals are not only general truths; the chapter around them acts them out. Its main theme is that the LORD overturns positions: the mighty are broken and the stumbling are given strength, the full hire themselves out for bread and the hungry hunger no more, the barren bears and the mother of many pines away (verses 4–5). Hannah's own life is the first example.

      Several lines also look ahead in the story. “They that were full have hired out themselves for bread” anticipates verse 36: what is left of Eli's house, whose sons fattened themselves on the offerings, will beg the new priest “for a piece of silver and a morsel of bread.” “The barren hath born seven” points to the contrast between Hannah, who bore Samuel and then five more children (verse 21), and Peninnah, who “had children” ([[1 Sam. 1:2]]) but whose line the Hebrew Bible does not mention again. And “he bringeth low, and lifteth up” is the chapter's whole movement: the house of Eli, rejected despite its long standing in the priesthood, and the obscure house of Elkanah, which gives Israel its prophet. A psalm takes up this line; see the note at [[Ps. 75:7]].
    sources: [smith-hannah-temple, olsen-birth-samuel]

  - ref: 10
    phrase: exalt the horn of his anointed
    kind: christ
    title: '“His anointed”: the first Messiah'
    body: |
      Hannah's song holds the first reference in scripture to the title Messiah, “his Anointed.” The Hebrew *māšîaḥ*, “anointed one,” is the word behind Messiah; the Septuagint, the ancient Greek translation, renders it *christos*, the word behind Christ. Before this verse the word had been used only in Leviticus, of the anointed priest ([[Lev. 4:3]]), so this is also, on one reading, the first time the Old Testament uses it of someone the LORD will send to save.

      Israel had no king when Hannah sang. Judges had just closed with “In those days there was no king in Israel” ([[Judg. 21:25]]), and the son she had just given to the LORD would anoint the first two kings ([[1 Sam. 10:1]]; [[1 Sam. 16:13]]). The song's last line looks past its moment. It has long been read as prophecy: “a choice Old Testament reference to the future Messiah” that shows “Hannah was blessed with the gift of prophecy.” Read so, it is the only prophecy of the coming Anointed One spoken by an ordinary Israelite, “let alone a woman.” Her song begins with her own horn, her strength, raised by the LORD (verse 1), and ends with the horn of His anointed: she ties her strength to his.

      The word returns at verse 35 and runs through the book. Why David will not touch “the LORD's anointed” is at [[1 Sam. 24:6]].
    sources: [oshb-wlc, lds-scriptures, bd-hannah, smith-hannah-temple, ot-manual-1-samuel-1]

  - ref: 12
    phrase: they knew not the LORD
    kind: words
    title: Priests who did not know the LORD
    body: |
      The charge is ironic: these are the “priests of the LORD” ([[1 Sam. 1:3]]), and they do not know Him. “Know” (Hebrew *yādaʿ*) often carries the sense of a covenant relationship, especially where knowing God is concerned. The narrator uses the verb again of Samuel at his call: “Samuel did not yet know the LORD” ([[1 Sam. 3:7]]). The difference is in the tenses. For Eli's sons, “knew not” is a settled condition, and the story bears it out: they abuse the offerings and are rejected. For Samuel, “not yet” is a stage, and his first revelation ends it.

      “Sons of Belial,” worthless men (the phrase is explained at [[Deut. 13:13]]), makes a second contrast. When Eli took Hannah for drunk, she begged him not to count her “a daughter of Belial” ([[1 Sam. 1:16]]). The woman the high priest misjudged was nothing of the kind; his own sons were.
    sources: [olsen-birth-samuel, smith-hannah-temple]

  - ref: 13
    phrase: the priests’ custom with the people was
    kind: history
    title: What the priests took, and when
    body: |
      The law gave the priests a fixed share of the peace offering, the breast and the right thigh, while the fat was burned on the altar for the LORD ([[Lev. 7:30–34]]; the three shares are explained at [[Lev. 3:16]]). The fat was never to be eaten; it was the LORD's portion. Eli's sons would not wait for it.

      The chapter first describes a custom at Shiloh: the priest's servant stabbed a three-pronged fork into the worshipper's boiling pot, and the priest kept whatever it brought up. Then came something worse. The servant arrived before the fat was burned and demanded raw meat to roast, and if the worshipper asked him to wait until the LORD's portion had been offered, he threatened to take it by force (verses 15–16).

      The harm went past theft. By forcing worshippers to hand over meat before the fat was burned, the priests made them break the law as well, which is Eli's own complaint: “ye make the LORD’s people to transgress” (verse 24). Rites given to prepare Israel to understand the Atonement of Jesus Christ became a mockery, and people came to despise the offering itself (verse 17).
    sources: [judd-eli-sons, smith-hannah-temple, lds-scriptures]

  - ref: 19
    phrase: his mother made him a little coat
    kind: symbol
    title: A little coat, brought every year
    body: |
      The little coat is Hannah giving more than her vow required, set down in the middle of the account of the sons' taking. The narrator breaks into that account to show Samuel serving in a linen ephod, the garment the priests wore (the priests of Nob are men “that did wear a linen ephod,” [[1 Sam. 22:18]]), and his mother bringing him a new robe each year, probably clothing for his service at the sanctuary. The contrast is pointed. Eli's sons used their place in the sanctuary to take what was not theirs. Hannah, who held no office there, gave beyond what was asked, as she had brought three bullocks, flour and wine along with the boy himself ([[1 Sam. 1:24]]). And while Eli lived beside his sons and let them go on, Hannah lived at a distance and kept watch over hers.

      The LORD answers her faithfulness. Eli blesses the parents “for the loan which is lent to the LORD,” and Hannah, who had kept her vow, bears three sons and two daughters (verses 20–21).
    sources: [smith-hannah-temple, ot-minute-1-samuel-2, olsen-birth-samuel]

  - ref: 22
    phrase: the women that assembled at the door of the tabernacle of the congregation
    kind: history
    title: The women at the door of the tabernacle
    body: |
      The sons' sin was committed at the sanctuary itself, against women who came to its door, and through their office: they were “evidently … misusing their office of priest to entice the women.” The Hebrew verb behind “assembled” is used, in one of its senses, for service at the sacred tent: of the Levites ([[Num. 4:23]]), and of women only here and at [[Ex. 38:8]], whose note explains it. So the women may have served at the sanctuary in some way, though the text does not say what they did there.

      The narrator chooses a blunt verb. Hannah's union with Elkanah is told with *yādaʿ*, “knew” ([[1 Sam. 1:19]]); here it is *šākab*, “lay with,” which set against “knew” suggests a liaison with no covenant bond and no sacred purpose. Eli hears of it secondhand, from “all this people” (verse 23). The narrator repeats “hear” three times in verses 22–24, and the repetition shows how far the old priest had drifted from his own sons' lives.
    sources: [bdb, olsen-birth-samuel, ot-manual-1-samuel-1]

  - ref: 25
    phrase: because the LORD would slay them
    kind: words
    title: '“Because the LORD would slay them”'
    body: |
      The narrator gives the LORD's will to put Eli's sons to death as the reason they did not listen to their father. “Would” translates a Hebrew verb meaning to be pleased to do something, to will it; the same construction comes in the words of Manoah's wife, “If the LORD were pleased to kill us” ([[Judg. 13:23]]).

      The order of the chapter explains the comment. Before Eli says a word, his sons have been called worthless men who “knew not the LORD” (verse 12), have robbed the offerings by force (verses 13–17), and have lain with the women who assembled at the door of the tabernacle (verse 22). Eli's own words name what they have come to: when a man sins against the LORD, “who shall entreat for him?” One older reading explains their deafness the same way: the father's rebuke made no impression because they were already given up to the judgment of hardening, and it compares the hardening of Pharaoh ([[Ex. 4:21]]). The verse still lays the refusal at their door: “they hearkened not unto the voice of their father.”
    sources: [bdb, keil-1-samuel]

  - ref: 30
    phrase: them that honour me I will honour
    kind: history
    title: Honouring sons above the LORD
    body: |
      The man of God names Eli's fault in one phrase: he honored his sons above the LORD (verse 29). Eli did rebuke them (verses 23–25), but he apparently did not do all he could to stop them. The LORD later tells Samuel that “he restrained them not” ([[1 Sam. 3:13]]), and Eli left them serving as priests in the house of God. The blot on his character was “his toleration of the wickedness of his own sons.”

      The “for ever” Eli's house loses was the LORD's own word to the house He chose in Egypt to be His priests (verses 27–28). “But now” He sets it aside: “Be it far from me; for them that honour me I will honour, and they that despise me shall be lightly esteemed.” Honoring the LORD is one of the major themes of 1 Samuel, and this verse states it.
    sources: [judd-eli-sons, ot-minute-1-samuel-2, bd-eli, ot-seminary-1-samuel-intro]

  - ref: 35
    phrase: I will raise me up a faithful priest
    kind: history
    title: Who is the faithful priest?
    body: |
      The faithful priest who takes the place of Eli's house has been identified as Zadok, whose line replaced Eli's in Solomon's day; Samuel has also been named, and one older reading adds Christ. The Hebrew word for “faithful,” *neʾĕmān*, is also the word for “sure” in “a sure house,” and it returns at the end of the next chapter, when all Israel knows that Samuel “was established to be a prophet of the LORD” ([[1 Sam. 3:20]]). The echo has been read as the narrator's signal that Samuel is the promised priest: the boy raised at Eli's side is the one the LORD raises up in Eli's place.

      The case for Zadok follows the history of the office. Eli was probably the first high priest from the line of Aaron's younger son Ithamar, and the office stayed in his family until Solomon removed Abiathar, of Eli's line, “that he might fulfil the word of the LORD, which he spake concerning the house of Eli in Shiloh” ([[1 Kgs. 2:27]]). Solomon put Zadok, of the family of Aaron's elder son Eleazar, in Abiathar's place ([[1 Kgs. 2:35]]), and the high priesthood passed back to Eleazar's family, the line of Phinehas ([[1 Chr. 6:4–8]]); the promise to Phinehas is at [[Num. 25:13]].

      One older reading refuses to choose. The prophecy was partly fulfilled in Samuel and partly in Zadok, but it receives its complete fulfilment only in Christ, “the true and eternal High Priest,” and the anointed before whom the faithful priest walks is finally David and the Son of David. The first sign comes much sooner: Hophni and Phinehas die on one day at [[1 Sam. 4:11]].
    sources: [oshb-wlc, bdb, olsen-birth-samuel, lds-scriptures, bd-eli, bd-zadok, keil-1-samuel]

christ: |
  Hannah's song is the first place scripture gives the title Messiah, “his anointed,” *māšîaḥ*, which in Greek is *christos*, Christ: before Israel had any king she sang of the King the LORD would strengthen (verse 10). Samuel's growing “in favour both with the LORD, and also with men” (verse 26) is the language Luke uses of Jesus as a boy ([[Luke 2:52]]).

  The principle the man of God states still holds for a disciple: “them that honour me I will honour” (verse 30). The Lord blesses those who honor Him and keep His commandments above every other loyalty, even to their own children, and the God who lifted a barren woman out of her grief still “bringeth low, and lifteth up” (verse 7).

explore: |
  - **David's song.** [[2 Sam. 22]], the psalm that answers Hannah's at the other end of the books of Samuel.
  - **The judgment repeated and fulfilled.** [[1 Sam. 3:11–14]], [[1 Sam. 4:11–18]], and [[1 Kgs. 2:26–27]].
  - **A study.** “‘The Lord . . . Bringeth Low, and Lifteth Up’: Hannah, Eli, and the Temple” (*Ascending the Mountain of the Lord*, Religious Studies Center, 2013) reads chapters 1–3 as a story that overturns the reader's expectations of Hannah and of Eli.

