chapter: 21
title: Hallowed Bread and the Sword of Goliath
tagline: David, fleeing Saul, comes alone to the priest Ahimelech at Nob and leaves with the holy bread and Goliath's sword; then he goes to Gath, is recognized, and escapes by feigning madness.
when: 'While David fled from Saul'

setting: |
  Chapter 20 ended with David and Jonathan parting in the field, sworn to each other in the name of the LORD ([[1 Sam. 20:42]]). Chapter 21 begins David's flight, and it takes him to two places: Nob, the town of the priests, and Gath, the Philistine city Goliath came from. From here to the end of 1 Samuel he is a fugitive, and within a chapter the distressed, the indebted and the discontented are gathering to him ([[1 Sam. 22:2]]).

  What happens at Nob does not end there. One of Saul's servants sees it, and chapter 22 tells what his report cost the priests. Three psalms have titles set in these days: Psalm 52, “when Doeg the Edomite came and told Saul”; Psalm 56, “when the Philistines took him in Gath”; and Psalm 34, “when he changed his behaviour before Abimelech,” the king this chapter calls Achish. Centuries later Jesus cited the bread David ate at Nob when the Pharisees accused His disciples of breaking the Sabbath ([[Matt. 12:3–4]]).

thread: |
  The chapter is told through what David lacks. He comes to Nob alone, with no bread and no sword, and he leaves with both: the holy bread taken from before the LORD, and the sword of the giant he had killed. He gets them with a story, that the king has sent him on a secret and urgent errand (verses 2 and 8). The narrator passes no judgment on the story. He sets beside it, in verse 7, one of Saul's servants who was there that day, and leaves the cost for chapter 22.

  Fear runs through every scene. Ahimelech “was afraid at the meeting of David” (verse 1); David flees “for fear of Saul” (verse 10) and at Gath is “sore afraid of Achish” (verse 12). The man the LORD had already chosen and anointed ([[1 Sam. 16:13]]), whom even the Philistine courtiers call “the king of the land” (verse 11), ends the chapter scratching at a gate with spittle in his beard. Yet he carries with him the sword of the day the LORD gave him Goliath, and on one older reading that is the point of his “There is none like that”: the monument of God's deliverance in the past was a pledge of His help in the future.

sections:
  - range: 1-6
    heading: Holy bread at Nob
    plain: |
      David came to Nob, to Ahimelech the priest. Ahimelech was afraid when he met him and said, “Why are you alone, with no one with you?” David answered, “The king has given me a task and told me, ‘Let no one know anything about the errand I am sending you on or what I have commanded you.’ I have told my young men to meet me at a certain place. Now, what do you have on hand? Give me five loaves of bread, or whatever there is.” The priest answered, “I have no ordinary bread on hand, only holy bread, if the young men have at least kept themselves from women.” David answered, “Truly, women have been kept from us these three days, since I set out, and the young men's things are holy. They are holy even on an ordinary errand; how much more today.” So the priest gave him the holy bread, because there was no bread there except the shewbread, which had been taken from before the LORD to be replaced with hot bread on the day it was removed.
  - range: 7-9
    heading: Doeg, and the sword of Goliath
    plain: |
      One of Saul's servants was there that day, detained before the LORD. His name was Doeg, an Edomite, the chief of Saul's herdsmen. David asked Ahimelech, “Isn't there a spear or a sword here on hand? I didn't bring my sword or any of my weapons, because the king's business was urgent.” The priest said, “The sword of Goliath the Philistine, whom you killed in the valley of Elah, is here, wrapped in a cloth behind the ephod. If you want it, take it; there is no other here.” David said, “There is none like it. Give it to me.”
  - range: 10-15
    heading: Madness at Gath
    plain: |
      That same day David fled from Saul and went to Achish, king of Gath. Achish's servants said to him, “Isn't this David, the king of the land? Isn't this the one they sang about to each other in their dances: ‘Saul has killed his thousands, and David his ten thousands’?” David took these words to heart and was very afraid of Achish king of Gath. So he changed his behavior in front of them and acted like a madman in their hands. He scratched marks on the doors of the gate and let his saliva run down his beard. Achish said to his servants, “Look, you can see the man is mad. Why have you brought him to me? Am I short of madmen, that you have brought this fellow to rave in front of me? Is this man to come into my house?”

notes:
  - ref: 1
    phrase: Then came David to Nob to Ahimelech the priest
    kind: history
    title: The priests of Nob
    body: |
      Nob, the first place David went, was a priestly city in Benjamin, north of Jerusalem, one of the places where the tabernacle stood before Solomon built the temple; chapter 22 calls it “Nob, the city of the priests” ([[1 Sam. 22:19]]). The text does not say why David went there, but he left with more than bread: chapter 22 adds what this chapter leaves out, that Ahimelech “inquired of the LORD for him” ([[1 Sam. 22:10]]).

      Ahimelech belonged to Eli's family. He is “the son of Ahitub” ([[1 Sam. 22:9]]), and the priest who wore the ephod in Saul's camp earlier in his reign was “Ahiah, the son of Ahitub, I-chabod's brother, the son of Phinehas, the son of Eli” ([[1 Sam. 14:3]]). Abiathar is called the son “of the high priest Ahijah or Ahimelech,” so the two names probably belong to one man. The priests of Nob were then Eli's house, of which the LORD had spoken at Shiloh ([[1 Sam. 2:31–35]]; the promise of a faithful priest is explained at [[1 Sam. 2:35]]). Abiathar, the one son who escapes in chapter 22 ([[1 Sam. 22:20]]), is the priest Solomon would later thrust out “that he might fulfil the word of the LORD, which he spake concerning the house of Eli in Shiloh” ([[1 Kgs. 2:27]]).
    sources: [bd-nob, bd-ahimelech, bd-abiathar, lds-scriptures]

  - ref: 2
    phrase: The king hath commanded me a business
    kind: history
    title: What David's story cost
    body: |
      David's story to the priest was not what was happening, and the next chapter counts its cost. He was not on the king's business; he was running from the king (verse 10). The text gives no reason for the story and passes no judgment on it. What it does is set a witness in the middle of the scene: Doeg the Edomite, Saul's chief herdsman, “was there that day” (verse 7).

      In chapter 22 Doeg tells Saul that Ahimelech fed David, armed him and inquired of the LORD for him ([[1 Sam. 22:9–10]]). Ahimelech's defense is that he had helped the king's own son-in-law and “knew nothing of all this, less or more” ([[1 Sam. 22:15]]). Saul has the priests killed, and Doeg is the one who does it ([[1 Sam. 22:17–18]]; told at [[1 Sam. 22:18]]). When the one survivor reaches him, David says it himself: “I knew it that day, when Doeg the Edomite was there, that he would surely tell Saul: I have occasioned the death of all the persons of thy father's house” ([[1 Sam. 22:22]]).
    sources: [lds-scriptures]

  - ref: 6
    phrase: there was no bread there but the shewbread
    kind: scripture
    title: Was it lawful to eat the holy bread?
    body: |
      By the letter of the law it was not, and Jesus said so; He cited this verse to show what the law was for. The shewbread, explained at [[Ex. 25:30]], was twelve loaves set before the LORD and changed every Sabbath, and the old loaves belonged to the priests alone: “it shall be Aaron's and his sons'; and they shall eat it in the holy place: for it is most holy” ([[Lev. 24:9]]). Ahimelech had nothing else to give, “no common bread” (verse 4), that is, no ordinary bread. He asked only whether the men had “kept themselves at least from women.” David's answer in verse 5 reads awkwardly in the King James. One reading takes it as an argument from the lesser to the greater: “the vessels of the young men are holy even when it is a common journey; how much more today will their vessels be holy?” The plain-words rendering above follows that.

      Eating the bread was “technically a violation of the Mosaic law.” When the Pharisees accused His disciples of breaking the Sabbath by plucking grain, Jesus answered with this story: “Have ye not read what David did, when he was an hungred, and they that were with him; How he entered into the house of God, and did eat the shewbread, which was not lawful for him to eat” ([[Matt. 12:3–4]]; see [[Mark 2:25–26]]; [[Luke 6:3–4]]). The priest had given the loaves to hungry men “in view of the condition of urgent need,” and the lesson the Lord drew is that “the law of charity overrides every ritual law”: in dire necessity, a breach of the ritual law was not a sin.
    sources: [lds-scriptures, nrsvue, ot-manual-1-samuel-16, talmage-jesus-christ-15, bd-shewbread]

  - ref: 9
    phrase: wrapped in a cloth behind the ephod
    kind: history
    title: Goliath's sword behind the ephod
    body: |
      The sword David took at Nob was the one he had used to cut off Goliath's head, kept, it seems, at the sanctuary. When Goliath fell, David “took his sword, and drew it out of the sheath thereof, and slew him, and cut off his head therewith” ([[1 Sam. 17:51]]), and he put the giant's armor in his tent ([[1 Sam. 17:54]]). How the sword came to Nob the text does not say; it had apparently been sent to the tabernacle as a kind of sacred trophy. It was kept “behind the ephod,” with the high priest's vestment, which was associated with the Urim and Thummim. What the ephod was, and how David would use it to inquire of the LORD, is explained at [[1 Sam. 23:9]].

      Goliath's sword has a counterpart in the Book of Mormon, the sword of Laban. In each story a faithful youth cut off the owner's head with his own sword ([[1 Ne. 4:18]]), and each sword “became a national heirloom, as well as an enduring symbol of divine deliverance and royal legitimacy.” Each was kept with a nation's sacred things: Goliath's with the ephod, Laban's with the plates of brass and the interpreters ([[Mosiah 1:16]]; [[D&C 17:1]]). On one reading the sword was a token of David's legitimacy as the coming king, and after he had it Abiathar the priest joined him, bringing the ephod itself ([[1 Sam. 23:6]]).
    sources: [bassett-king-david, sc-knowhy-411, hudson-irregular-kings, lds-scriptures]

  - ref: 11
    phrase: Is not this David the king of the land?
    kind: history
    title: Into Goliath's city
    body: |
      David fled straight to the Philistines, and to the very city Goliath came from ([[1 Sam. 17:4]]). Gath is identified with a mound at the west end of the valley of Elah, where David had killed its champion. On one older reading David hoped that, some years after Goliath's fall, few in Gath would know him by sight, and that he might be taken in as a fugitive from Saul, the Philistines' chief enemy. He was recognized at once. On the same older reading, the courtiers' “king of the land” does not mean they knew of his anointing; it was the exaggeration of rumor about the leader of the Philistine wars, the man of the women's song ([[1 Sam. 18:7]]), which the Philistine lords will quote again ([[1 Sam. 29:5]]).

      The words frightened David (verse 12), and he got away by acting the madman, so that, on the same older reading, they would take him for harmless. The title of [[Ps. 34]] sets that psalm in this scene, and the title of [[Ps. 56]] sets that one in the same days; the notes on those titles tell the story and explain why the king is called Abimelech there. This short, frightened stay is not the same as David's later sojourn with Achish, when he came with six hundred men, was given Ziklag, and stayed “a full year and four months” ([[1 Sam. 27:2–7]]).
    sources: [chadwick-gath, keil-1-samuel, cambridge-1-samuel, lds-scriptures]

christ: |
  Jesus drew from this chapter's story a claim about Himself. After reminding the Pharisees that David ate the holy bread, He went on: “in this place is one greater than the temple,” and “if ye had known what this meaneth, I will have mercy, and not sacrifice, ye would not have condemned the guiltless” ([[Matt. 12:6–7]]). In one reading of His argument, the priest gave the bread “in view of the condition of urgent need,” and what made David blameless was the same principle that made the priests' Sabbath labor lawful: the Sabbath law “was not one merely of rest, but of rest for worship.” The disciples following Jesus were on the Lord's service, and “ministering to Him was more than ministering in the temple, for He was greater than the temple.” The Joseph Smith Translation gives the reason He is Lord of the Sabbath: “the Son of man made the Sabbath day.”

  The Sabbath was made “for man” ([[Mark 2:27]]) by the Lord who is Lord of it. A disciple in His service keeps it as He taught, with mercy ahead of sacrifice ([[Matt. 12:7]]).

explore: |
  - **The rest of the flight.** [[1 Sam. 22:1–23]], the cave of Adullam and the priests of Nob; [[1 Sam. 23:6–12]], Abiathar and the ephod at Keilah.
  - **The psalms of these days.** [[Ps. 34]], [[Ps. 52]] and [[Ps. 56]], each set by its title in this chapter or the next.
  - **The holy bread and the Sabbath.** [[Lev. 24:5–9]]; [[Matt. 12:1–8]]; [[Mark 2:23–28]], with the Joseph Smith Translation of Mark 2:26–27.
  - **Two swords.** [[1 Ne. 4:18]] and [[Mosiah 1:16]], the sword of Laban beside Goliath's.

