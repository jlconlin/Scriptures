chapter: 24
title: Mine Hand Shall Not Be upon Thee
tagline: Saul hunts David at En-gedi and walks alone into the cave where David is hiding; David cuts off the corner of his robe, will not lift his hand against the LORD's anointed, and pleads with him outside; Saul weeps, owns that David will be king, and asks him to spare his descendants.
when: 'While David fled from Saul, in the wilderness of En-gedi'

setting: |
  Chapter 23 ended with Saul closing in on David in the wilderness of Maon, until word of a Philistine raid called him away and David went up to the strongholds of En-gedi ([[1 Sam. 23:26–29]]). En-gedi, “fountain of the kid,” lies on the western shore of the Dead Sea among “the rocks of the wild goats” (verse 2), and chapter 24 opens there with Saul back from the Philistines and on David's trail again, now with three thousand chosen men.

  The chapter is the first of two times David has Saul at his mercy and lets him go. The second, in Saul's camp in the wilderness of Ziph, is told in chapter 26, and between them stands the story of Nabal and Abigail. Recent scholarship reads chapters 24–26 as one unit about David and Saul, in which the middle chapter speaks of Saul through the figure of Nabal ([[1 Sam. 25:1]] also reports Samuel's death). Two psalm titles set David's prayers “in the cave”; the notes at [[Ps. 57:0]] and [[Ps. 142:0]] say which caves the story offers. Why David would not touch “the LORD's anointed” is explained in full here, at verse 6, and chapter 26 points back to it.

thread: |
  The chapter turns on whose hand will settle the quarrel between Saul and David. David's men read the moment in the cave as the LORD's own gift: “Behold the day of which the LORD said unto thee” (verse 4). David takes only a corner of the king's robe, and even that troubles him, because Saul is “the LORD's anointed” (verse 6). Outside the cave he says the same thing three ways: “mine hand shall not be upon thee” (verses 12 and 13), and “The LORD therefore be judge” (verse 15). The concern that runs through chapters 24–26 is that David not bring blood-guilt on himself, whether by slaying the LORD's anointed or, as Abigail warns him in chapter 25, by shedding innocent blood ([[1 Sam. 25:30–31]]).

  Saul hears him, weeps, and says what the reader already knows: David is the more righteous man, and the kingdom will be his. The scene ends quietly and without a reconciliation. Saul goes home, and David goes back up to the stronghold; by chapter 26 Saul is hunting him again.

sections:
  - range: 1-7
    heading: In the cave
    plain: |
      When Saul came back from chasing the Philistines, he was told, “David is in the wilderness of En-gedi.” So Saul took three thousand picked men from all Israel and went looking for David and his men on the crags of the wild goats. He came to the sheepfolds by the road, where there was a cave, and went in to relieve himself, while David and his men were sitting far back in the cave. David's men said to him, “This is the day the LORD told you about: ‘I will give your enemy into your hand, and you may do to him whatever you think best.’” David got up and quietly cut off the corner of Saul's robe. Afterward his conscience struck him for having cut off Saul's robe. He said to his men, “The LORD forbid that I should do such a thing to my master, the LORD's anointed, and lift my hand against him, for he is the LORD's anointed.” With these words David held his men back and would not let them attack Saul. Saul got up, left the cave, and went on his way.
  - range: 8-15
    heading: David pleads with Saul
    plain: |
      Then David went out of the cave too, and called after Saul, “My lord the king!” When Saul looked back, David bowed low with his face to the ground. “Why do you listen to people who say, ‘David means you harm’?” he asked. “Today you have seen with your own eyes that the LORD put you in my hands in the cave. Some told me to kill you, but I spared you. I said, ‘I will not lift my hand against my lord, for he is the LORD's anointed.’ Look, my father, look at the corner of your robe in my hand! I cut off the corner of your robe and did not kill you. You can see that I am guilty of no wrong or rebellion. I have not sinned against you, yet you are hunting me down to take my life. May the LORD judge between you and me, and may the LORD avenge me on you; but my hand will not be against you. As the old proverb says, ‘From the wicked comes wickedness’; but my hand will not be against you. Whom has the king of Israel come out after? Whom are you chasing? A dead dog? A single flea? May the LORD be the judge and decide between us. May He see, take up my cause, and rescue me from your hand.”
  - range: 16-22
    heading: Saul's answer
    plain: |
      When David had finished, Saul said, “Is that your voice, my son David?” And Saul wept aloud. “You are more righteous than I,” he said to David. “You have repaid me with good, and I have repaid you with evil. Today you have shown how well you have treated me: the LORD put me in your hands, and you did not kill me. When a man finds his enemy, does he send him safely on his way? May the LORD reward you with good for what you have done for me today. Now I know for certain that you will be king, and that the kingdom of Israel will be established in your hand. So swear to me by the LORD that you will not cut off my descendants after me or wipe out my name from my father's family.” David swore it to Saul. Then Saul went home, and David and his men went up to the stronghold.

notes:
  - ref: 3
    phrase: Saul went in to cover his feet
    kind: words
    title: To cover his feet
    body: |
      “To cover his feet” is a polite expression for relieving oneself, and a modern translation says so outright: Saul “went in to relieve himself.” The King James follows the Hebrew word for word, a verb meaning “to cover” with “his feet.” The same expression explains the delay of Eglon's servants at [[Judg. 3:24]], where the note gives the idiom.

      The detail is there because the story turns on it. Without knowing it, Saul had walked into the cave where David was hiding, and the king who had brought three thousand men to find David was, for those minutes, at the mercy of the man he was hunting.
    sources: [niv, oshb-wlc, scripture-helps-1-samuel-17]

  - ref: 4
    phrase: Behold the day of which the LORD said unto thee
    kind: history
    title: The day the LORD spoke of
    body: |
      The men quote a promise of the LORD that the text never records, and the older commentaries divide over whether there was one. One older reading supposes David may have received assurances of deliverance from Samuel and the prophet Gad, which his followers now interpreted in their own way; it points to Jonathan's “thou shalt be king over Israel” ([[1 Sam. 23:17]]) and Abigail's later words ([[1 Sam. 25:28–30]]). Another holds that there was no such oracle: the men took the turn of events that had brought Saul into the cave as the LORD's signal to kill him, and called it a word of the LORD.

      Either way, the men read the opportunity as permission, and David does not. He grants that the LORD delivered Saul into his hand that day (verse 10), and he still refuses to strike.
    sources: [cambridge-1-samuel, keil-1-samuel]

  - ref: 6
    phrase: my master, the LORD’s anointed
    kind: history
    title: The LORD's anointed
    body: |
      Even cutting off the corner of Saul's robe smote David's heart (verse 5), and verse 6 gives the reason: he would not lift his hand against Saul because the LORD had made Saul king, and the anointing still stood. Samuel had poured the oil on Saul at the LORD's command ([[1 Sam. 10:1]]), and the word David uses, *māšîaḥ*, “anointed,” is the one Hannah first sang of ([[1 Sam. 2:10]], where the word is explained). Saul had been rejected ([[1 Sam. 15:26]]) and David anointed in his place ([[1 Sam. 16:13]]), but David left it to the LORD to end Saul's reign: “the LORD shall smite him; or his day shall come to die” ([[1 Sam. 26:10]]).

      The refusal is also about guilt. Read as one unit, chapters 24–26 turn on avoiding blood-guilt, from slaying the LORD's anointed (verse 11; [[1 Sam. 26:9]]) or from shedding innocent blood ([[1 Sam. 25:30–31]]). David says it plainly the second time he spares Saul: “who can stretch forth his hand against the LORD's anointed, and be guiltless?” ([[1 Sam. 26:9]]). He holds to it after Saul is dead, when he has the Amalekite who claimed to have killed Saul put to death for it ([[2 Sam. 1:14–16]]).

      President J. Reuben Clark Jr. set this verse before the Church's teachers as a pattern for following “our ordained leader and prophet.” He warned them against “thrusting aside your leader's counsel” and pointed to “David of old, privily cutting off only the skirt of Saul's robe,” whose words here are “the cry of a smitten heart.”
    sources: [oshb-wlc, heal-abigail, clark-charted-course]

  - ref: 13
    phrase: Wickedness proceedeth from the wicked
    kind: words
    title: The proverb of the ancients
    body: |
      The older commentaries read the proverb two ways, both turned by David on himself. On one older reading the sense is that a man's character is known by his actions: if David were the wicked man Saul's informers described (verse 9), he would have shown it by killing Saul in the cave. Another puts it more sharply: only a wicked man could wish to avenge himself, and David does not. Whether the words after the proverb, “but mine hand shall not be upon thee,” belong to the saying or are David's own answer to it is not clear.

      The next verse drives the point home with self-abasement. The same commentaries take “a dead dog” and “a flea” as images of something harmless and insignificant, beneath a king's notice: a dead dog cannot bite, and a flea is hardly worth an expedition of the king of Israel with his picked troops. Mephibosheth calls himself “such a dead dog as I am” before David ([[2 Sam. 9:8]]), and David uses the flea again when he spares Saul the second time ([[1 Sam. 26:20]]).
    sources: [cambridge-1-samuel, keil-1-samuel]

  - ref: 17
    phrase: Thou art more righteous than I
    kind: history
    title: Thou art more righteous than I
    body: |
      Saul weeps, admits that he has rewarded David evil for good, and says aloud that David will be king (verse 20), yet he does not change his course. One Latter-day Saint reading of Saul describes him as struggling against the decision of God “personified in David,” aware that his efforts were futile, while “this dawning recognition was at war with his stubborn will.”

      The text leaves the confession where Saul left it. Saul goes home and David goes back to the stronghold (verse 22), and in chapter 26 Saul is out hunting him again with the same three thousand men ([[1 Sam. 26:2]]). David's restraint brought the words out of Saul twice, here and again at [[1 Sam. 26:21]], but the words did not hold.
    sources: [ellsworth-tragic-saul, taggart-sworn-david]

  - ref: 21
    phrase: thou wilt not cut off my seed after me
    kind: history
    title: Thou wilt not cut off my seed
    body: |
      Saul asks for the oath because he now expects David to be king: “And now, behold, I know well that thou shalt surely be king … Swear now therefore unto me” (verses 20–21). He asks David to swear by the LORD not to cut off his descendants or blot out his name from his father's house.

      David swore (verse 22). How he went on showing kindness to the house of Saul and Jonathan belongs to 2 Samuel, where he seeks out Jonathan's surviving son Mephibosheth, restores his lands and brings him to the royal table ([[2 Sam. 9:1–7]]).
    sources: [taggart-sworn-david]

christ: |
  The title David would not violate, “the LORD's anointed,” is *māšîaḥ* in Hebrew. Messiah means “the anointed,” and its Greek equivalent is Christ; at Hannah's “his anointed” the Septuagint has *christos* ([[1 Sam. 2:10]]). David honored the LORD's anointing even in a rejected king and left the outcome to the LORD: “The LORD judge between me and thee … but mine hand shall not be upon thee” (verse 12). The Church's footnote to that verse points to the Lord's word to the latter-day Saints, “let God judge between me and thee, and reward thee according to thy deeds” ([[D&C 64:11]]).

  A disciple who has been wronged is not appointed to settle the account. The Lord requires His people to forgive all men and to leave the judgment to Him ([[D&C 64:10–11]]), as David left Saul to the LORD in the cave.

explore: |
  - **The second sparing.** [[1 Sam. 26:1–25]], David and Abishai in Saul's camp, and the same words, “the LORD's anointed.”
  - **David's restraint afterward.** [[2 Sam. 1:14–16]], the Amalekite; [[2 Sam. 9:1–13]], Mephibosheth.
  - **The prayers of the cave.** On the site, [[Ps. 57:0]] and [[Ps. 142:0]].
  - **Chapters 24–26 as one story.** “Abigail in Between: Reflections on 1 Samuel 25” (Maxwell Institute, 2026) reads Nabal's chapter between the two sparings of Saul.

