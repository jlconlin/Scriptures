chapter: 29
title: The Lords Favour Thee Not
tagline: David and his men march with Achish toward the last battle against Saul, until the other Philistine lords refuse to fight beside a Hebrew and Achish, protesting David's loyalty, sends him home to Ziklag.
when: 'While David lived among the Philistines, as their armies marched against Saul'

setting: |
  David had gone over to the Philistines with six hundred men to escape Saul, and Achish, king of Gath, had given him the town of Ziklag ([[1 Sam. 27:2–6]]). There David raided the peoples of the south while telling Achish he had raided Judah; that deception and what it meant are taken up at [[1 Sam. 27:10]]. When the Philistines gathered for war against Israel, Achish told David that he and his men would march with him, and made him his bodyguard ([[1 Sam. 28:1–2]]).

  Chapter 29 resumes the story of [[1 Sam. 28:1–2]], after the account of Saul at Endor. It gives the positions of the two armies before the battle, then goes back to a point on the Philistines' march north, probably soon after the forces of their cities had joined, and after they had crossed their own frontier. Israel was camped by the spring in Jezreel, the plain and town beneath Mount Gilboa, the ridge where Saul and his sons would die ([[1 Sam. 31:1]]). The Philistines were five cities, each governed by its own “lord,” and their power was at its height when Saul died. Achish was king of Gath ([[1 Sam. 27:2]]), but the decision about David was not his alone.

thread: |
  The chapter is about a man trusted by one of his enemies, distrusted by the rest, and kept by their distrust from a battle against his own people. Achish trusts David: he has “found no fault in him” (verse 3), swears by the LORD that David is upright (verse 6), and calls him good “as an angel of God” (verse 9). The other lords do not trust him, and Achish gives way to them. David protests that he wants to fight “the enemies of my lord the king” (verse 8), and the words can point to either king.

  The lords' refusal settles what David's words leave open. He goes home without having fought against Israel or turned on Achish in the battle, and on the third day he reaches Ziklag to find what has happened there ([[1 Sam. 30:1]]).

sections:
  - range: 1-5
    heading: The lords will not have David
    plain: |
      The Philistines gathered all their forces at Aphek, and Israel camped by the spring in Jezreel. The lords of the Philistines were marching on with their companies of hundreds and thousands, and David and his men were marching at the rear with Achish. The Philistine commanders asked, “What are these Hebrews doing here?” Achish answered them, “This is David, the servant of Saul king of Israel. He has been with me a long while now, and since the day he came over to me I have found nothing wrong with him.” But the Philistine commanders were angry with Achish and said, “Send the man back to the place you assigned him. He must not go down with us into battle, or he will turn on us in the fighting. How better could he win back his master's favor than with the heads of our men? Isn't this the David they sing about in their dances: ‘Saul has killed his thousands, and David his tens of thousands’?”
  - range: 6-11
    heading: Achish sends David home
    plain: |
      So Achish called David and said to him, “As surely as the LORD lives, you have been honest, and I would gladly have you march out and come back with me in the army. I have found nothing wrong in you from the day you came to me until now. But the lords do not approve of you. So go back now, and go in peace, so that you do nothing to displease the lords of the Philistines.” David said to Achish, “But what have I done? What have you found against your servant from the day I came to you until now, that I may not go and fight against the enemies of my lord the king?” Achish answered, “I know you are as good in my eyes as an angel of God. But the Philistine commanders have said, ‘He must not go up with us into battle.’ So get up early in the morning, you and your master's servants who came with you. Get up early, and leave as soon as it is light.” So David and his men got up early in the morning to go back to the land of the Philistines, and the Philistines went up to Jezreel.

notes:
  - ref: 2
    phrase: David and his men passed on in the rearward with Achish
    kind: history
    title: The lords of the Philistines
    body: |
      Achish could not keep David with the army because the decision was not his alone. The Philistines were a league of five cities, Ashdod, Gaza, Ashkelon, Gath and Ekron, each governed by its own “lord.” The word, *seren* (plural *sǝrānîm*), is a Philistine loanword used in the Bible only of these rulers, apparently one for each city. Achish is called king of Gath ([[1 Sam. 27:2]]), but on this march the lords, called “princes” or commanders in verses 3, 4 and 9, overrule him, and he can only report it: “the lords favour thee not” (verse 6).

      The commanders' question, “What do these Hebrews here?”, uses the name foreigners used for Israel (the note at [[1 Sam. 13:3]] explains it).
    sources: [bd-philistines, bdb, lds-scriptures]

  - ref: 4
    phrase: lest in the battle he be an adversary to us
    kind: words
    title: An adversary in the battle
    body: |
      The lords feared that David would change sides in the middle of the fighting, and they say exactly how. “Adversary” is the Hebrew *śāṭān*, the word that elsewhere in the Old Testament names the superhuman adversary, Satan, but here it has its ordinary sense: an opponent, a man who turns against you. “Wherewith should he reconcile himself unto his master?” asks how he could make himself acceptable to his lord, that is, to Saul; and the answer is “the heads of these men,” the Philistine soldiers marching past.

      The Chronicler gives the same reason in his own words: “the lords of the Philistines upon advisement sent him away, saying, He will fall to his master Saul to the jeopardy of our heads” ([[1 Chr. 12:19]]). The lords end their protest with the song the women of Israel sang when David came back from killing the Philistine ([[1 Sam. 18:6–7]]): “Saul slew his thousands, and David his ten thousands” (verse 5). Achish's servants had quoted the same song when David first came to Gath ([[1 Sam. 21:11]]).
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 8
    phrase: that I may not go fight against the enemies of my lord the king
    kind: history
    title: Which king?
    body: |
      David's protest can be read two ways, and the text does not say which he meant. Achish has just sworn “as the LORD liveth,” by the God of Israel, which on one older reading he did to convince David that he meant what he said (on another, the wording may be the historian's). He has found David upright, and he will add that David is as good in his sight “as an angel of God” (verse 9). The same words are said to David as king in 2 Samuel, by the woman of Tekoa and by Mephibosheth ([[2 Sam. 14:17]]; [[2 Sam. 19:27]]), and on the older reading Achish means that David has behaved toward him “as well … as an angel could.”

      Against that trust stand David's words. “My lord the king” could mean Achish or Saul, and on one older reading Achish, in his goodness of heart, takes them without suspicion to mean himself. Another older reading calls it “a hypocritical answer,” meant to keep Achish believing in his loyalty, as David had kept him believing it with the report of his raids ([[1 Sam. 27:10–12]]), and doubts that David ever meant to fight his own people. The Chronicler says only that David and his men “helped them not” ([[1 Chr. 12:19]]). Whatever David would have done, he was never put to the test.
    sources: [keil-1-samuel, cambridge-1-samuel, lds-scriptures]

  - ref: 11
    phrase: So David and his men rose up early to depart in the morning
    kind: history
    title: Sent home to Ziklag
    body: |
      Being sent away took David back to Ziklag, and the Chronicler records who joined him on the road. The Philistines marched north to Jezreel; David went south, and on the third day reached Ziklag to find it burned by the Amalekites and the wives and children taken captive ([[1 Sam. 30:1–3]]); chapter 30 tells how he pursued the raiders.

      “As he went to Ziklag,” the Chronicler says, captains of thousands from Manasseh came over to him: “And they helped David against the band of the rovers: for they were all mighty men of valour, and were captains in the host. For at that time day by day there came to David to help him, until it was a great host, like the host of God” ([[1 Chr. 12:20–22]]).
    sources: [lds-scriptures]

christ: |
  Chapter 29 never names the LORD's hand, but both older commentaries see it in the lords' refusal. On one reading David “must have inwardly rejoiced that God had delivered him out of so perplexing a dilemma”; on the other he went home praising God for rescuing him from a situation he had come into “not altogether without some fault of his own.” The rescue came by means David did not arrange, the distrust of the Philistine lords. Paul states the same faithfulness of God toward disciples now: He “will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape” ([[1 Cor. 10:13]]).

explore: |
  - **The Chronicler's account.** [[1 Chr. 12:1–7]], those who came over to David at Ziklag.
  - **David with Achish.** [[1 Sam. 21:10–15]], his first flight to Gath; [[1 Sam. 27]], the year at Ziklag; [[1 Sam. 30]], what he found when he returned.
  - **The battle David missed.** [[1 Sam. 28:4]] and [[1 Sam. 31:1–6]], Gilboa.

sources: [lds-scriptures, oshb-wlc, bdb, bd-philistines, bd-jezreel, bd-gilboa, bd-ziklag, keil-1-samuel, cambridge-1-samuel]
