chapter: 12
title: Whose Ox Have I Taken?
tagline: At Gilgal Samuel asks the people to name any wrong he has done them, sets the LORD's long record of deliverance against their demand for a king, calls down thunder in the wheat harvest, and promises not to stop praying for them.
when: 'At Gilgal, when the people had made Saul king'

setting: |
  Chapter 11 ended at Gilgal. After Saul's victory over Nahash at Jabesh-gilead, Samuel took the people there to “renew the kingdom,” and “they made Saul king before the LORD in Gilgal” ([[1 Sam. 11:14–15]]; the note there tells what the renewal was). Gilgal was a fitting place. It was Israel's first camp after crossing the Jordan, where the twelve stones from the river were set up, and it was still a sacred city in Saul's day.

  Chapter 12 is Samuel's address to that assembly. While the people were gathered to confirm Saul as their king, Samuel spoke of his ministry among them and testified that the LORD was Israel's true leader. After Saul was appointed, Samuel “seems to have ceased to act as judge,” and the first event of the years that followed is this chapter, where he calls the people to witness his integrity. He lives on until [[1 Sam. 25:1]], and verse 23 names the work he kept.

  The chapter closes the story of the request that began in chapter 8 ([[1 Sam. 8:5]]; the notes there take up whether asking for a king was wrong). In verse 19 the people themselves call the request “this evil.”

thread: |
  One older reading follows the chapter as a trial in which the parties change places. Samuel opens by putting himself in the dock: “witness against me before the LORD, and before his anointed” (verse 3). The people are the accusers, the LORD and His king the judges. The people acquit him in full, and on the same reading they convict themselves in doing so: if Samuel had wronged no one, they had no good reason to set him aside.

  Then the roles turn. “Stand still, that I may reason with you” (verse 7) is, on that reading, the language of a lawsuit, “that I may plead with you”: Samuel is now the accuser and Israel the defendant. His evidence is “the righteous acts of the LORD” from Egypt through the judges (verses 6–11), and his charge is that when a threat came they asked for a king “when the LORD your God was your king” (verse 12). The LORD has granted the request (verse 13), and now everything depends on whether people and king alike will obey His voice (verses 14–15, 25). Saul's choices in the chapters that follow show why that warning matters.

  A sign seals the verdict: thunder and rain in the dry wheat harvest, “that ye may perceive and see that your wickedness is great” (verse 17). The people beg Samuel to pray for them and confess “this evil, to ask us a king” (verse 19). Samuel answers “Fear not,” says in the same breath that they have done wrong, and gives them the way forward: turn not aside, and serve the LORD with all their heart (verses 20–21). The LORD will not forsake His people, and Samuel will not stop praying for them (verses 22–23).

sections:
  - range: 1-5
    heading: Samuel's record
    plain: |
      Samuel said to all Israel, “I have listened to you in everything you asked of me, and I have set a king over you. Now the king leads you. As for me, I am old and gray, and my sons are here among you. I have led you from my youth until today. Here I am. Testify against me before the Lord and before His anointed king. Whose ox have I taken? Whose donkey? Whom have I cheated or oppressed? From whom have I taken a bribe to look the other way? Tell me, and I will pay it back.” They answered, “You have not cheated us or oppressed us, and you have taken nothing from anyone.” Samuel said, “Then the Lord is witness against you, and His anointed is witness today, that you have found nothing in my hand.” “He is witness,” they said.
  - range: 6-12
    heading: What the LORD had done
    plain: |
      Samuel said to the people, “It was the Lord who appointed Moses and Aaron and brought your fathers up out of Egypt. Now stand here, so that I may plead with you before the Lord about all the righteous acts He has done for you and your fathers. When Jacob went down into Egypt and your fathers cried to the Lord, He sent Moses and Aaron, who brought them out and settled them in this land. But they forgot the Lord their God, so He sold them into the power of Sisera, the commander of Hazor's army, and of the Philistines, and of the king of Moab, and these fought against them. Then they cried to the Lord: ‘We have sinned. We have forsaken the Lord and served the Baals and the Ashtaroth. Now deliver us from our enemies, and we will serve You.’ So the Lord sent Jerubbaal, Bedan, Jephthah and Samuel, and delivered you from your enemies on every side, and you lived in safety. But when you saw Nahash king of the Ammonites coming against you, you told me, ‘No, a king must reign over us,’ though the Lord your God was your King.”
  - range: 13-18
    heading: The king, and a sign
    plain: |
      “Now here is the king you have chosen, the one you asked for. See, the Lord has set a king over you. If you will fear the Lord, serve Him and obey His voice, and not rebel against His commandment, then both you and the king who reigns over you will follow the Lord your God. But if you will not obey the Lord's voice, and rebel against His commandment, the Lord's hand will be against you as it was against your fathers. Now stand and see this great thing the Lord will do before your eyes. Isn't it wheat harvest today? I will call on the Lord, and He will send thunder and rain, so that you may see how great a wrong you did in the Lord's sight when you asked for a king.” So Samuel called on the Lord, and the Lord sent thunder and rain that day, and all the people stood in great fear of the Lord and of Samuel.
  - range: 19-25
    heading: Fear not, and turn not aside
    plain: |
      All the people said to Samuel, “Pray to the Lord your God for your servants, so that we do not die, for we have added to all our sins this evil of asking for a king.” Samuel told them, “Do not be afraid. You have done all this wrong, yet do not turn aside from following the Lord; serve Him with all your heart. Do not turn aside after empty things that cannot help or save you, because they are nothing. For the Lord will not forsake His people, for the sake of His great name, because it pleased the Lord to make you His own people. As for me, far be it from me to sin against the Lord by ceasing to pray for you. I will teach you the good and right way. Only fear the Lord and serve Him faithfully with all your heart, for think what great things He has done for you. But if you keep doing evil, you will be swept away, both you and your king.”

notes:
  - ref: 2
    phrase: I have walked before you from my childhood unto this day
    kind: scripture
    title: A farewell address
    body: |
      Samuel's speech belongs to a recognized kind, the farewell address of an aging prophet-leader, and the Church's footnote at this verse points to King Benjamin's ([[Mosiah 2:12]], with verses 9–41). Four Old Testament farewells survive, those of Moses, Joshua, David and Samuel (1 Samuel 12:1–25), in which a leader gathers his people one last time to teach them, exhort them, and hand on the leadership. The marks most typical of the Israelite form are the speaker's claim of innocence and of a mission fulfilled, charges to those who come after, a review of history that shows God's hand, and a word about the future.

      The comparison matters for the Book of Mormon. All four of these speeches are old enough to have been on the plates of brass, and the Nephite farewell tradition very likely drew on such biblical models. Benjamin, like Samuel, points to his own years of service ([[Mosiah 2:12–14]]) and then declares that he can answer “a clear conscience before God this day” ([[Mosiah 2:15]]).

      Samuel opens with the two reasons the elders had given for a king, his age and his sons ([[1 Sam. 8:5]]). His farewell is not to life: he lives on until [[1 Sam. 25:1]].
    sources: [hague-welch-farewell, lds-scriptures]

  - ref: 3
    phrase: whose ox have I taken? or whose ass have I taken?
    kind: history
    title: Whose ox have I taken?
    body: |
      Samuel's questions list the ways a man in power could enrich himself at his people's expense, and the last of them, the bribe, is the one his sons had taken ([[1 Sam. 8:3]], where the note explains what they did). The ox and the ass are named in the Tenth Commandment among a neighbour's goods ([[Ex. 20:17]]), and Moses had made the same protest when his authority was challenged: “I have not taken one ass from them” ([[Num. 16:15]]). The bribe “to blind mine eyes” recalls the law's warning that “the gift blindeth the wise” ([[Ex. 23:8]]).

      The word for “bribe” is *kōpher*, elsewhere the price paid to ransom a life ([[Ex. 21:30]]; [[Num. 35:31]]). Here it is money put into a judge's hand so that he will not see.

      “His anointed” in verse 3 is Saul, the newly made king; the word is explained at [[1 Sam. 2:10]].
    sources: [bdb, lds-scriptures]

  - ref: 11
    phrase: Bedan
    kind: history
    title: Who was Bedan?
    body: |
      No judge named Bedan appears in the book of Judges, and the older commentaries take the name as most likely a copyist's error for Barak, Deborah's general ([[Judg. 4:6]]); one sees “no other course.” The Septuagint, the ancient Greek translation, reads “Barac” here, as do the Syriac and Arabic versions, and the two names look much alike in Hebrew letters. That would make Samuel's list run through the great deliverances of the judges: Barak against Sisera, Gideon (Jerubbaal) against Midian, Jephthah against Ammon. One older reading allows that Bedan could be a judge Judges does not record, or a byname for Samson, “son of Dan”; the other finds “just as little ground” for the Samson reading. The King James keeps the Hebrew as it stands.

      Samuel also names himself, which can seem odd in a list of deliverers. On one older reading he does so because he is reviewing the age of the judges as a whole at its close, and his point needs the last deliverance too: the LORD had not forsaken Israel, but had kept delivering them down to that day ([[1 Sam. 7:10–13]]). Verse 9's three oppressors, Sisera, the Philistines and the king of Moab, are those of Judges 4, Judges 13 and Judges 3.
    sources: [cambridge-1-samuel, keil-1-samuel, lxx-rahlfs]

  - ref: 12
    phrase: when ye saw that Nahash the king of the children of Ammon came against you
    kind: history
    title: Nahash and the request
    body: |
      Samuel says the request for a king came when the people saw Nahash coming, though chapter 8 tells the request before chapter 11 tells his attack. On one older reading, since the demand came first, Samuel must mean earlier Ammonite raids or a threatened attack, and the elders' wish for a king to “fight our battles” ([[1 Sam. 8:20]]) hints at that fear.

      Samuel's charge is the last clause: they asked for a king “when the LORD your God was your king.” This is the point of [[1 Sam. 8:7]], where the note explains it, and it echoes Gideon's refusal of the crown, “the LORD shall rule over you” ([[Judg. 8:23]]).
    sources: [cambridge-1-samuel]

  - ref: 17
    phrase: Is it not wheat harvest to day?
    kind: history
    title: Thunder in the wheat harvest
    body: |
      Thunder and rain in the wheat harvest were a sign because rain did not fall then. The wheat was gathered in during the fifty days between the Passover and Pentecost, and after the showers of May, rain “hardly ever falls until the end of September.” “As rain in harvest” was a proverb for something out of place ([[Prov. 26:1]]). A storm on a clear harvest day, called down at Samuel's word, could only be the LORD's, and verse 17 gives its purpose: “that ye may perceive and see that your wickedness is great.”

      The people had seen the LORD answer Samuel with thunder before, against the Philistines at Mizpeh ([[1 Sam. 7:10]], where the note takes up thunder as the LORD's voice). This time it came on them, and they were afraid.
    sources: [bd-feasts, bd-rain, lds-scriptures]

  - ref: 21
    phrase: vain things, which cannot profit nor deliver; for they are vain
    kind: words
    title: Vain things
    body: |
      The “vain things” are idols. The Hebrew is *tōhû*, “emptiness,” used here, as in Isaiah, of what is empty and unreal: of idols ([[Isa. 41:29]], “confusion”) and of their makers ([[Isa. 44:9]]). Samuel's sentence turns on what they are not: they “cannot profit nor deliver,” and so to turn from the LORD is to turn to nothing that can help or save.
    sources: [bdb, lds-scriptures]

  - ref: 23
    phrase: God forbid that I should sin against the LORD in ceasing to pray for you
    kind: history
    title: Praying and teaching
    body: |
      Samuel stops judging but not his work as prophet, and here he names that work: praying for the people and teaching them “the good and the right way.” He has prayed for Israel before ([[1 Sam. 7:8]], where the note follows Samuel the intercessor through scripture), and now he counts it a sin against the LORD to stop. The rest of his life fits the promise: after Saul's appointment he “continued to be the prophet and representative of Jehovah.”

      The promise is made to people who had just set him aside for a king, though the LORD had told him that it was not him they had rejected ([[1 Sam. 8:7]]).
    sources: [bd-samuel, lds-scriptures]

christ: |
  The King Israel set aside was “the LORD your God” ([[1 Sam. 12:12]]), Jehovah, the premortal Jesus Christ. Even after granting the request the people would call “this evil,” He did not cast them off: “The LORD will not forsake his people for his great name's sake: because it hath pleased the LORD to make you his people” ([[1 Sam. 12:22]]).

  For a disciple who has done wrong, Samuel's answer keeps the same order. “Fear not” comes first; the wrong is named as real, “ye have done all this wickedness”; and the way forward is Israel's: “turn not aside from following the LORD, but serve the LORD with all your heart” ([[1 Sam. 12:20]]). The Lord's faithfulness rests on His own choice of His people, not on their record.

explore: |
  - **Other farewells.** [[Deut. 31:1–8]], Moses; [[Josh. 24:1–15]], Joshua; [[Mosiah 2:9–41]], King Benjamin's, to which the footnote at verse 2 points.
  - **What the warning meant for Saul.** [[1 Sam. 13:8–14]] and [[1 Sam. 15:22–23]], where the king does not obey the voice of the LORD.
  - **The request from its beginning.** [[1 Sam. 8:4–22]]; [[1 Sam. 10:17–19]].

