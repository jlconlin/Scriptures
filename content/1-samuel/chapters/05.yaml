chapter: 5
title: Dagon Was Fallen upon His Face
tagline: The captured ark is set beside Dagon at Ashdod; twice the idol falls before it, and the hand of the LORD drives it from Ashdod to Gath to Ekron until the Philistines beg to send it home.
when: 'In the days of Eli, after the ark was taken at Eben-ezer (4:1, 11)'

setting: |
  Chapter 5 follows directly on the disaster of chapter 4. Israel had carried the ark of the covenant from Shiloh into battle, saying of it, “it may save us out of the hand of our enemies” ([[1 Sam. 4:3]], where the ark is explained). The army was beaten, Eli's sons were killed, the ark was taken, and Eli died at the news ([[1 Sam. 4:10–18]]). Now the story follows the ark into enemy country.

  The Philistines held the rich lowland along the Mediterranean coast as a confederation of five cities, Ashdod, Gaza, Ashkelon, Gath and Ekron, each governed by its own “lord.” Those lords meet twice in this chapter (verses 8 and 11), and three of their cities take the ark in turn. Ashdod, where it goes first, stood on a rise near the sea about 35 miles west of Jerusalem, on the high road between Syria and Egypt. From there it is sent to Gath, and from Gath to Ekron. Chapter 6 tells how, after seven months, the Philistines sent it back to Israel ([[1 Sam. 6:1]]).

thread: |
  The Philistines read the battle of chapter 4 as their god's victory over Israel's, and they set the ark in Dagon's temple as its trophy. The chapter answers them, and no Israelite takes part in the answer. No priest carries the ark and no army fights; the God whose ark Israel had trusted to “save us” acts alone. First His rival falls before Him, twice, the second time broken beyond any accident (verses 3–4). Then “the hand of the LORD” falls on the people (verse 6). The phrase becomes the chapter's refrain, heavy, sore, against the city, very heavy (verses 6, 7, 9, 11), as the ark moves from city to city and each is struck harder than the one before. The Philistines who seized it as a prize end by pleading, “let it go again to his own place” (verse 11).

  The elders who sent for the ark had said “it may save us” ([[1 Sam. 4:3]]), trusting the object rather than God to deliver them: they mistook the symbol for the source. The ark's tour of Philistia in chapters 5 and 6, passed from city to city until it is sent home, carries the same lesson to its end, showing the danger of treating as an outward trophy what was meant to be a token of inward covenants. From start to finish, the story “was not a story of reverence for Israel's God, but reliance on an object meant to symbolize him.”

sections:
  - range: 1-5
    heading: Dagon falls before the ark
    plain: |
      The Philistines took the ark of God and brought it from Eben-ezer to Ashdod. They carried it into the temple of Dagon and set it up beside Dagon. When the people of Ashdod got up early the next morning, there was Dagon, fallen on his face to the ground before the ark of the LORD. So they lifted Dagon up and put him back in his place. But when they got up early the following morning, Dagon had fallen on his face to the ground before the ark of the LORD again, and this time his head and both his hands had been cut off and were lying on the threshold. Only the body of Dagon was left. That is why, to this day, neither the priests of Dagon nor anyone who enters Dagon's temple in Ashdod steps on the threshold of Dagon.
  - range: 6-12
    heading: The hand of the LORD on three cities
    plain: |
      Then the hand of the LORD was heavy on the people of Ashdod. He brought destruction on them and struck them with tumors, both Ashdod and the territory around it. When the men of Ashdod saw what was happening, they said, “The ark of the God of Israel must not stay with us, for his hand is hard on us and on Dagon our god.” So they sent for all the lords of the Philistines and asked them, “What shall we do with the ark of the God of Israel?” The lords answered, “Let the ark of the God of Israel be moved to Gath.” So they moved it there. But after they had moved it, the hand of the LORD was against that city too, with very great destruction: he struck the men of the city, young and old, and tumors broke out on them. So they sent the ark of God on to Ekron. As soon as the ark of God came to Ekron, the people of Ekron cried out, “They have brought the ark of the God of Israel to us, to kill us and our people!” They called all the lords of the Philistines together and said, “Send the ark of the God of Israel away. Let it go back to its own place, so that it does not kill us and our people.” For a deadly destruction had spread through the whole city; the hand of God was very heavy there. The men who did not die were struck with tumors, and the cry of the city went up to heaven.

notes:
  - ref: 2
    phrase: they brought it into the house of Dagon, and set it by Dagon
    kind: history
    title: Dagon and the trophy
    body: |
      Dagon was the chief god of the Philistines, and the ark was set by his image as a trophy of the victory they believed he had won over Israel's God. He had temples at Gaza, where Samson died ([[Judg. 16:23]]), and at Ashdod. His image is described as partly a man and partly a fish, and the name taken to mean “fish,” though some writers connect it instead with *dagan*, “grain.” How he was pictured matters less here than what the placing claimed: in his house, the captured ark stood as the proof that he was the stronger god.

      Dagon's worship touches the Old Testament story three times: Samson's death in his temple at Gaza ([[Judg. 16:23–30]]), the ark here at Ashdod, and the head of King Saul, placed in a temple of Dagon after the battle at Mount Gilboa ([[1 Chr. 10:10]]). Here the trophy does not stay put.
    sources: [scripture-helps-ruth-samuel, bd-dagon]

  - ref: 3
    phrase: Dagon was fallen upon his face to the earth before the ark of the LORD
    kind: symbol
    title: Fallen on his face
    body: |
      Dagon is found in the posture of homage: the god who was supposed to have conquered Jehovah lies prostrate before His ark, “as though worshipping before the God of Israel.” The contest between the two images is settled in two mornings. The men of Ashdod set the idol back up, evidently taking the first fall for an accident. One older reading sees the second fall as given to rule that out: Dagon is on his face again, and this time his head and the palms of his hands lie cut off on the threshold, the annihilation of the idol by the God of Israel. Where the King James has “only the stump of Dagon was left,” the Hebrew says literally “only Dagon was left upon him”: either a word for the trunk or body has dropped out of the text, or “Dagon” here names the body of the idol itself. Either way, what remained was the trunk without head or hands. The same commentary hears in the scene what Isaiah would say of Egypt's idols, that they “shall be moved at his presence” ([[Isa. 19:1]]): Jehovah does not leave the Philistines to suppose their god has conquered Him.

      Verse 5 shows that the Philistines kept the memory in their own way. The threshold was where the pieces had lain, and Dagon's priests and worshippers stepped over it rather than tread on it, out of reverence for the spot. “Unto this day” tells the reader that the custom was still kept when the historian wrote.
    sources: [cambridge-1-samuel, keil-1-samuel, halverson-swine]

  - ref: 6
    phrase: the hand of the LORD was heavy upon them of Ashdod
    kind: symbol
    title: The hand of the LORD
    body: |
      “The hand of the LORD” is the chapter's refrain, and it names who is acting: after the idol, the LORD's hand falls on the idol's people. It grows heavier as the ark moves. Ashdod is struck, Gath with “a very great destruction” (verse 9), and Ekron worst of all, where “the hand of God was very heavy” and the city cries out before the ark is fairly inside its gates (verses 10–12). (The disease, the “emerods” of verses 6, 9 and 12, is taken up at [[1 Sam. 6:4]], with the golden images the Philistines sent back with the ark.)

      The Philistines knew whose hand this was. When the ark came into Israel's camp they had cried, “who shall deliver us out of the hand of these mighty Gods? these are the Gods that smote the Egyptians with all the plagues in the wilderness” ([[1 Sam. 4:8]]). When their priests advise sending it home, they warn against hardening their hearts “as the Egyptians and Pharaoh hardened their hearts” ([[1 Sam. 6:6]]). In the Philistines' own words, the hand heavy on Ashdod, Gath and Ekron is the hand that struck Egypt until Pharaoh let Israel go.
    sources: [lds-scriptures]

christ: |
  The God who brings Dagon down without an army or a priest is Jehovah, the premortal Jesus Christ (see the note at [[Ex. 3:14]]). The idol that was supposed to have beaten Him fell on its face before His ark, in the attitude of homage, in its own temple.

  The ark could be carried off because Israel had already suffered a more significant loss, “the loss of the interior attitudes that truly herald the presence of God.” The same holds for a disciple's sacred things. They are tokens of covenants made within, and the Lord's presence comes with those inward covenants kept, not with the possession of the outward sign.

explore: |
  - [[1 Sam. 4:3–11]]: why Israel took the ark into battle, and how it was lost.
  - [[1 Sam. 6:1–12]]: the Philistines' golden offerings and the ark's return.
  - [[Judg. 16:23–30]]: the feast in Dagon's house at Gaza, and its fall.

