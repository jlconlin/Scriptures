chapter: 25
title: Blessed Be Thy Advice
tagline: Samuel dies and all Israel mourns him; the rich Nabal of Carmel insults David's messengers, and David sets out to destroy his house; Nabal's wife Abigail meets him on the way with food and a plea, and David turns back; the LORD smites Nabal, and David marries Abigail.
when: 'While David fled from Saul, after the death of Samuel, at Carmel in Judah'

setting: |
  The chapter opens with a death the book has been moving toward since its first page. “Samuel died,” and “all the Israelites were gathered together, and lamented him” (verse 1): a public mourning like the one held for Moses ([[Deut. 34:8]]), for the man who had served the nation for many years as prophet, judge and counsellor of the king. He was buried in his own house at Ramah, that is, in a court or garden belonging to it. The books of Samuel go on for many chapters after him; who wrote them, and when, is uncertain, though the writer drew on records that included writings by Samuel ([[1 Sam. 10:25]]).

  David then goes down to the wilderness of Paran, a general name for the desert south of the land. The story itself is set at Carmel, not the mountain of Elijah on the coast but a town in the hill country of Judah. Nabal lived at Maon (verse 2), in the wilderness where Saul had all but caught David a little earlier ([[1 Sam. 23:24–26]]).

  The chapter stands between the two times David spares Saul (chapters 24 and 26), and the setting of [[1 Sam. 24:1]] says how the three chapters are read together. Abigail has a place in [the guide to women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/).

thread: |
  The chapter turns on whose hand will repay Nabal. Nabal returns David “evil for good” (verse 21), and David's answer is his sword: four hundred men gird theirs on (verse 13), and David swears to leave no male of Nabal's house alive by morning (verse 22). In the cave a chapter earlier he had left Saul to the LORD ([[1 Sam. 24:12]]); against a churlish sheep owner he nearly takes vengeance into his own hands.

  Abigail stands in the way, and her speech is the center of the chapter. She takes the blame, gives what her husband refused, and reminds David of who he is: the LORD's anointed, who fights the LORD's battles, whose house the LORD will make sure, and who must not come to the throne with innocent blood on his hands (verses 28–31). David hears her and blesses the LORD for sending her (verses 32–33). Then the LORD does what David had meant to do: “the LORD smote Nabal, that he died” (verse 38), and David blesses Him again, for pleading his cause and keeping his servant from evil (verse 39). The woman who kept David from sin becomes his wife.

sections:
  - range: 1-13
    heading: Nabal refuses David
    plain: |
      Samuel died, and all Israel gathered to mourn him, and they buried him at his home in Ramah. Then David went down to the wilderness of Paran. There was a man in Maon whose property was at Carmel. He was very rich: he had three thousand sheep and a thousand goats, and he was shearing his sheep at Carmel. His name was Nabal, and his wife's name was Abigail. She was an intelligent and beautiful woman, but the man was harsh and wicked in his dealings; he was a descendant of Caleb. In the wilderness David heard that Nabal was shearing his sheep. So he sent ten young men and told them, “Go up to Carmel, go to Nabal, and greet him in my name. Say this to the man who lives in prosperity: ‘Peace to you, peace to your household, and peace to all that you have! I hear that you have shearers. When your shepherds were with us, we did them no harm, and nothing of theirs went missing all the time they were at Carmel. Ask your young men, and they will tell you. So let my young men find favor with you, for we have come on a feast day. Please give whatever you can spare to your servants and to your son David.’” David's young men went and said all this to Nabal in David's name, and waited. Nabal answered David's servants, “Who is David? Who is this son of Jesse? There are many servants these days who are breaking away from their masters. Should I take my bread and my water and the meat I have slaughtered for my shearers and give it to men from who knows where?” David's young men turned around, went back, and told him everything. David said to his men, “Every man strap on his sword!” They did, and David strapped on his own. About four hundred men went up with David, and two hundred stayed with the supplies.
  - range: 14-35
    heading: Abigail meets David
    plain: |
      One of the young men told Abigail, Nabal's wife, “David sent messengers from the wilderness to greet our master, and he flew at them with insults. Yet the men were very good to us. They did us no harm, and nothing of ours went missing the whole time we were out in the fields with them. Night and day they were a wall around us while we were keeping the sheep. Now think it over and decide what to do, for disaster is hanging over our master and his whole household. He is such a worthless man that no one can speak to him.” Abigail lost no time. She took two hundred loaves, two skins of wine, five sheep ready to cook, five measures of roasted grain, a hundred clusters of raisins and two hundred cakes of figs, and loaded them on donkeys. She told her servants, “Go on ahead; I will follow you.” But she said nothing to her husband Nabal. As she rode her donkey down under cover of the hill, there were David and his men coming down toward her, and she met them. David had just been saying, “It was for nothing that I guarded everything this fellow had in the wilderness, so that nothing of his went missing. He has paid me back evil for good. May God do so to David's enemies and more, if by morning I leave a single male of all who belong to him.” When Abigail saw David, she quickly got off her donkey and bowed down before him with her face to the ground. She fell at his feet and said, “Let the blame be on me, my lord, on me alone. Please let your servant speak to you, and hear what your servant has to say. Let my lord pay no attention to this worthless man Nabal. He is just what his name says: his name means fool, and folly goes with him. I, your servant, did not see the young men my lord sent. Now, my lord, as surely as the LORD lives and as you live, since the LORD has kept you from coming to shed blood and from avenging yourself with your own hand, let your enemies and all who seek to harm my lord be like Nabal. Let this gift your servant has brought be given to the young men who follow my lord. Please forgive your servant's offense. The LORD will surely give my lord a lasting house, because my lord fights the LORD's battles, and no evil has been found in you all your life. Even if someone rises up to pursue you and take your life, my lord's life will be bound securely in the bundle of life in the care of the LORD your God, and the lives of your enemies He will hurl away as from the pocket of a sling. When the LORD has done for my lord all the good He has promised you and has made you ruler over Israel, my lord will not have this on his conscience, the grief of having shed blood without cause or of having taken vengeance for himself. And when the LORD has dealt well with my lord, remember your servant.” David said to Abigail, “Blessed be the LORD, the God of Israel, who sent you to meet me today! Blessed be your good sense, and blessed be you, for keeping me today from coming to shed blood and from avenging myself with my own hand. For as surely as the LORD, the God of Israel, lives, who has kept me from harming you, if you had not come quickly to meet me, not one male belonging to Nabal would have been left alive by morning.” Then David accepted from her what she had brought him and said, “Go home in peace. I have heard what you said and granted your request.”
  - range: 36-44
    heading: Nabal's death and David's wives
    plain: |
      When Abigail came home to Nabal, he was holding a feast in his house like a king's feast. He was in high spirits and very drunk, so she told him nothing at all until morning. In the morning, when Nabal was sober, his wife told him all this, and his heart failed him and he became like a stone. About ten days later the LORD struck Nabal, and he died. When David heard that Nabal was dead, he said, “Blessed be the LORD, who has upheld my cause against Nabal for the insult he gave me and has kept His servant from doing wrong; the LORD has brought Nabal's wickedness back on his own head.” Then David sent word to Abigail, asking her to become his wife. David's servants came to Abigail at Carmel and said, “David has sent us to you to take you to be his wife.” She rose and bowed with her face to the ground and said, “Your servant is ready to serve, to wash the feet of my lord's servants.” Abigail quickly got up and rode off on a donkey, attended by her five maids; she followed David's messengers and became his wife. David had also married Ahinoam of Jezreel, and both of them became his wives. But Saul had given his daughter Michal, David's wife, to Phalti son of Laish, who was from Gallim.

notes:
  - ref: 3
    phrase: she was a woman of good understanding
    kind: history
    title: Abigail and Nabal
    body: |
      Before anything happens, the narrator sets husband and wife side by side. Abigail is “of good understanding, and of a beautiful countenance”; a modern Jewish translation makes it “intelligent and beautiful.” Nabal is rich (three thousand sheep and a thousand goats, verse 2), but “churlish and evil in his doings.”

      Her understanding is the point. The servant who brings her the news goes to her, not to his master, “for he is such a son of Belial, that a man cannot speak to him” (verse 17; “Belial” is explained at [[Deut. 13:13]]). She sees at once what David can do, gathers a gift, and rides out to stand between him and her household.
    sources: [heal-abigail]

  - ref: 7
    phrase: we hurt them not
    kind: history
    title: Protection, or a protection racket?
    body: |
      David asks Nabal for a gift in return for a service, and the chapter lets Nabal's own shepherds say whether the service was real. David's men had been living among Nabal's flocks and shepherds, guarding both, and shearing was a festive season, the time for a generous owner to reward such help (verses 7–8). Scholars have asked whether this was honest protection or a protection racket, an armed band asking to be paid.

      The text answers through a witness with no reason to flatter David. One of Nabal's own young men tells Abigail that David's men “were very good unto us, and we were not hurt, neither missed we any thing … They were a wall unto us both by night and day” (verses 15–16): they had protected the shepherds and never taken any of the animals. Nabal's fault, in David's own words, is that “he hath requited me evil for good” (verse 21).

      David's answer is another matter, and the chapter names it in its own words. He swears to leave no male of Nabal's house alive by morning (verse 22; the footnote explains the King James idiom), and Abigail, and then David himself, call it coming “to shed blood” and to avenge himself “with mine own hand” (verses 26, 31, 33).
    sources: [heal-abigail, ot-seminary-lesson-89, lds-scriptures]

  - ref: 10
    phrase: Who is David? and who is the son of Jesse?
    kind: history
    title: Who is David?
    body: |
      Nabal's insult is to treat the LORD's anointed as a nobody. He pretends not to know who David is and calls him one of the servants who “break away every man from his master”: in effect, a runaway slave. His messengers become beggars from nowhere, “men, whom I know not whence they be” (verse 11). The reader knows better. David has been anointed ([[1 Sam. 16:13]]), and Jonathan and even Saul have said he will be king ([[1 Sam. 23:17]]; [[1 Sam. 24:20]]).

      A pastoral Latter-day Saint reading carries the question further. It takes Nabal's chief fault to be his failure to recognize David, and, with David standing for the Son of David, finds the greatest tragedy of the fool in failing to recognize Jesus, as in the parable of the sheep and the goats ([[Matt. 25:31–40]]).
    sources: [heal-abigail]

  - ref: 24
    phrase: Upon me, my lord, upon me let this iniquity be
    kind: christ
    title: Upon me let this iniquity be
    body: |
      Abigail turns David back by taking on herself a guilt that was not hers. She asks for the blame at once, “upon me let this iniquity be,” and later asks David to “forgive the trespass of thine handmaid” (verse 28), as though the trespass were hers, though she never saw the young men he sent (verse 25). She makes no excuses and offers no empty promises: she brings what Nabal had refused, and more (verse 18), and gives what justice demanded. She even calls the food “this blessing which thine handmaid hath brought” (verse 27), the word Jacob used for his gift to Esau (the note at [[Gen. 33:11]] explains it).

      Sister Kristin M. Yee sees Christ here: “Just as Abigail was willing to take Nabal's sin upon herself, so did the Savior—in an incomprehensible way—take upon Him our sins and the sins of those who have hurt or offended us.”
    sources: [heal-abigail, yee-beauty-ashes]

  - ref: 25
    phrase: as his name is, so is he
    kind: words
    title: As his name is, so is he
    body: |
      Abigail tells David that the insult came from what Nabal is, and the Hebrew word in his name is harsher than the English “fool.” *Nābāl* is the senseless man, “especially of the man who has no perception of ethical and religious claims” (the note at [[Ezek. 13:3]] gives the definition in full). A scholar quoted in a Latter-day Saint reflection on the chapter puts it more sharply: the word designates “not a harmless simpleton, but rather a vicious, materialistic, and egocentric misfit.”

      Isaiah lists among the marks of the *nābāl* that he will “make empty the soul of the hungry” and “cause the drink of the thirsty to fail” ([[Isa. 32:6]]; the note at [[Isa. 32:5]] makes the link to Nabal). That is exactly what Nabal did: “Shall I then take my bread, and my water, and my flesh … and give it unto men, whom I know not” (verse 11). His name described his conduct.
    sources: [bdb, heal-abigail]

  - ref: 28
    phrase: the LORD will certainly make my lord a sure house
    kind: scripture
    title: A sure house
    body: |
      Abigail grounds her plea in the LORD's purpose for David: he will reign, and his line will last. A “sure house” is David and his descendants established on the throne, the promise the LORD will make through Nathan: “thine house and thy kingdom shall be established for ever” ([[2 Sam. 7:16]]); the same words were promised to the faithful priest ([[1 Sam. 2:35]]). One older reading takes her conviction to rest on two things she names: that David “fighteth the battles of the LORD,” as Saul had once charged him to do ([[1 Sam. 18:17]]), and that no evil had been found in him.

      The promise is why the bloodshed matters. When the LORD has made David “ruler over Israel,” she says, he must not carry the grief of having “shed blood causeless” (verses 30–31); the same older reading calls it a burden on his conscience. Chapters 24–26 turn on David's keeping clear of blood-guilt, and the note at [[1 Sam. 24:6]] explains it.
    sources: [lds-scriptures, cambridge-1-samuel]

  - ref: 29
    phrase: bound in the bundle of life with the LORD thy God
    kind: symbol
    title: The bundle of life and the sling
    body: |
      Abigail sets two images side by side: the LORD will keep David's life wrapped up safe, and throw his enemies away like stones. The Hebrew *ṣǝrôr* is a bundle, parcel or pouch, properly “something bound up,” the word used of the bundles of money in the sacks of Joseph's brothers ([[Gen. 42:35]]). The older commentaries take the figure from the custom of binding up valuables to keep them from harm. They agree that the words refer first to the safekeeping of David's life on earth, in the LORD's care, rather than to eternal life; one adds that the Lord will not let perish one so hidden in His fellowship, even when death comes.

      The enemies get the opposite image. To “sling out” is a vigorous figure for total rejection (compare [[Jer. 10:18]]), and “the middle of a sling” is the hollow where the stone was placed. The LORD holds one life close and casts the others away.
    sources: [oshb-wlc, bdb, keil-1-samuel, cambridge-1-samuel]

  - ref: 39
    phrase: that hath pleaded the cause of my reproach from the hand of Nabal
    kind: history
    title: The LORD pleaded the cause
    body: |
      David's blessing says that the LORD, not David, repaid Nabal, and that David's hands stayed clean. When Nabal sobered and heard what had happened, “his heart died within him, and he became as a stone” (verse 37): he was terrified to learn what he had narrowly escaped, and he may have suffered a stroke or heart attack from the shock. The text gives his death to the LORD: “about ten days after … the LORD smote Nabal, that he died” (verse 38).

      David's blessing names both halves of what happened: the LORD “hath kept his servant from evil,” and “hath returned the wickedness of Nabal upon his own head” (verse 39). He uses the words he had spoken to Saul in the cave, “The LORD therefore be judge … and plead my cause” ([[1 Sam. 24:15]]).
    sources: [ot-manual-1-samuel-16]

christ: |
  Abigail came between an offended man and a guilty one, took the blame on herself, and humbly asked David's pardon for her husband's wrong; in that she is a likeness of the Savior, who pleads our cause before the Father as “the advocate with the Father” ([[D&C 45:3]]). David was kept from vengeance by her intercession, and then saw the LORD Himself plead his cause (verse 39).

  A disciple who has been hurt by another is not left to deal with the consequences alone: the Savior offers the help needed to be healed and made whole. His Atonement makes a way to let go of a vengeful heart, and that way is forgiving.

