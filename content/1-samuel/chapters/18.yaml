chapter: 18
title: Jonathan Loved Him as His Own Soul
tagline: Jonathan makes a covenant with David and gives him his robe and sword; the women's song turns Saul against him, and Saul's schemes, two daughters and a deadly bride-price, only raise David higher.
when: 'After David killed Goliath, at Saul''s court'

setting: |
  Chapter 18 begins where chapter 17 ends. David has killed Goliath and stands before Saul with the Philistine's head, answering the king's question, “Whose son art thou?” ([[1 Sam. 17:58]]). Verse 1 picks up “when he had made an end of speaking unto Saul.” Verse 2 says Saul kept him at court, though chapter 16 already had David there as Saul's harpist and armourbearer ([[1 Sam. 16:21]]). Chapters 16:14–23 and 17:1–18:5 both tell how David came to Saul; how the two accounts fit together is taken up at [[1 Sam. 17:55]].

  Behind the whole chapter stands a change the reader already knows and Saul does not. Samuel has anointed David, “and the Spirit of the LORD came upon David from that day forward,” while it departed from Saul ([[1 Sam. 16:13–14]]); Samuel had told Saul that the kingdom was given “to a neighbour of thine, that is better than thou” ([[1 Sam. 15:28]]). The women who come out singing in verse 6 keep an old custom, the one by which Miriam and Jephthah's daughter met a victory with timbrels and dancing ([[Ex. 15:20]]; [[Judg. 11:34]]; the note at Exodus 15:20 describes it). By chapter 19 Saul will try openly to kill David, and by chapter 21 David will have fled.

thread: |
  The chapter is built on two refrains that run against each other. Three times the narrator says the LORD was with David (verses 12, 14, 28), and three times that Saul was afraid of him (12, 15, 29). Between them, everyone around Saul comes to love David: Jonathan first (1, 3), then all Israel and Judah (16), Saul's servants (5, 22), and Michal (20, 28). Even the king's own children give him their hearts.

  Saul answers each step of David's rise with a move meant to stop it: a javelin (11), a command far from court (13), a daughter offered as bait (17, 21), and a bride-price to be paid in Philistine lives (25). None of them stops him, and the last three lift him higher. The irony of Saul's whole story is that “seeking to destroy David,” he “only heightened David’s popularity and strengthened David’s position,” and the chapter shows it happening in four turns. Jonathan, who stood to lose the most, gives David his robe; Saul, who had already lost the kingdom, cannot stop measuring himself against the song.

sections:
  - range: 1-5
    heading: Jonathan's covenant
    plain: |
      When David had finished speaking with Saul, Jonathan's soul was bound to David's, and Jonathan loved him as he loved his own life. From that day Saul kept David with him and would not let him go home to his father's house. Jonathan made a covenant with David, because he loved him as himself. He took off the robe he was wearing and gave it to David, along with his military clothing, his sword, his bow and his belt. David went out wherever Saul sent him and acted wisely, so Saul put him in command of the fighting men. All the people approved, and so did Saul's officials.
  - range: 6-9
    heading: The women's song
    plain: |
      As the army came home after David had killed the Philistine, women came out from all the towns of Israel to meet King Saul, singing and dancing with joy, with hand drums and other instruments. As they danced they sang to one another, “Saul has killed his thousands, and David his tens of thousands.” Saul was furious; the words stung him. “They credit David with tens of thousands,” he said, “and me with only thousands. What is left for him but the kingdom?” From that day on Saul kept a suspicious eye on David.
  - range: 10-16
    heading: The javelin and the captaincy
    plain: |
      The next day an evil spirit from God (in the Joseph Smith Translation, one “not of God”) came on Saul, and he raved in his house while David played the harp as he had done before. Saul had his spear in his hand, and he hurled it, thinking, “I will pin David to the wall.” Twice David got out of his way. Saul was afraid of David, because the Lord was with David and had left Saul. So Saul sent him away from his presence and made him commander of a thousand, and David led the troops out and back. David succeeded in everything he did, for the Lord was with him. When Saul saw how well he was doing, he was all the more afraid of him. But all Israel and Judah loved David, because he led them out and brought them back.
  - range: 17-19
    heading: Merab
    plain: |
      Saul said to David, “Here is my older daughter Merab. I will give her to you as your wife; only be brave for me and fight the Lord's battles.” For Saul thought, “I won't lay a hand on him; let the Philistines do it.” David answered, “Who am I, and what is my family or my father's clan in Israel, that I should become the king's son-in-law?” But when the time came for Merab to be given to David, she was given instead to Adriel of Meholah.
  - range: 20-27
    heading: Michal and the bride-price
    plain: |
      Now Saul's daughter Michal loved David, and when Saul was told, he was pleased. “I will give her to him,” he thought, “so that she may be a trap for him and the Philistines may get him.” So he told David, “Through one of my two daughters you will become my son-in-law today.” Saul ordered his servants to speak to David privately: “The king is pleased with you, and all his servants love you. Now become the king's son-in-law.” They said this to David, and he answered, “Do you think it is a small thing to become the king's son-in-law? I am a poor man and of no account.” When the servants told Saul what David had said, Saul replied, “Tell David the king wants no other bride-price than a hundred Philistine foreskins, to take vengeance on the king's enemies.” Saul was planning to have David fall at the hands of the Philistines. When the servants told David, he was glad to become the king's son-in-law. Before the time had run out, David and his men went and killed two hundred Philistines, and he brought their foreskins and counted them out in full to the king, so that he might become his son-in-law. Then Saul gave him his daughter Michal as his wife.
  - range: 28-30
    heading: Saul's enemy
    plain: |
      When Saul saw and understood that the Lord was with David, and that his daughter Michal loved him, he became still more afraid of David, and he remained David's enemy from then on. The Philistine commanders kept coming out to battle, and every time they did, David had more success than all of Saul's officers, and his name became highly esteemed.

notes:
  - ref: 1
    phrase: the soul of Jonathan was knit with the soul of David
    kind: prophets
    title: Knit with the soul of David
    body: |
      Jonathan's love for David is the love of the man who had the most to lose by it. “Knit” renders a Hebrew verb meaning to bind: the life of Jonathan “was bound up with the life of David,” the figure used of Jacob's love for Benjamin ([[Gen. 44:30]]; the note there explains it).

      The verse dates the bond exactly: it began when David had finished speaking to Saul, as the shepherd from Bethlehem stood before the court with Goliath's head. Jonathan was no bystander. He was “a valiant soldier in his own right and a worthy young prince in Israel,” and but for David he could have assumed he would be the next king. To a lesser friend, David would have been “a natural rival”; to Jonathan he was not. His father, in the same chapter, takes the other road.
    sources: [bdb, holland-real-friendship, cfm-ot-2026-25, lds-scriptures]

  - ref: 3
    phrase: Then Jonathan and David made a covenant
    kind: history
    title: What the covenant was
    body: |
      What bound Jonathan and David was a formal covenant, not only a feeling. The souls “knit” in verse 1 describe a lasting friendship, and the covenant of verse 3 sealed it as an obligation the two men later say they have “sworn both of us in the name of the LORD” ([[1 Sam. 20:42]]).

      Chapter 18 does not state the terms; they are spelled out when the covenant is renewed in chapter 20. Jonathan asks David to show him “the kindness of the LORD” while he lives, and not to “cut off thy kindness from my house for ever” ([[1 Sam. 20:14–15]]). “Kindness” there is *ḥesed*, and David's *ḥesed* to Jonathan runs through the rest of their story; Jonathan in turn tells David, “thou shalt be king over Israel” ([[1 Sam. 23:17]]). The covenant reached past the two men to their children: it is one of the Old Testament's covenants of kinship, whose benefits passed to the descendants. David kept it after Jonathan's death, asking whether any of Saul's house was left, “that I may shew him kindness for Jonathan's sake” ([[2 Sam. 9:1]]), and telling Jonathan's son Mephibosheth, “I will surely shew thee kindness for Jonathan thy father's sake” ([[2 Sam. 9:7]]). The covenant's renewal in chapter 20 is taken up at [[1 Sam. 20:8]] and [[1 Sam. 20:42]].
    sources: [ot-minute-1-samuel-18, taggart-sworn-david, matson-amos-kinship, lds-scriptures]

  - ref: 4
    phrase: Jonathan stripped himself of the robe that was upon him
    kind: symbol
    title: The prince's robe and sword
    body: |
      Jonathan's gift said two things at once: that the covenant was sealed, and that he accepted David as the next king. Covenants in the Bible were often confirmed by a pledge, and the robe, the garments and the weapons were that pledge here, given “to cement their covenant relationship.” The robe was also a prince's. By giving these things Jonathan showed his friendship “and his support of David becoming the next king”; stripping off “the princely robe he wore” was “a symbolic token of his devotion to the newly anointed king.”
    sources: [hopkin-covenant, scripture-helps-1-samuel-17, holland-real-friendship]

  - ref: 7
    phrase: Saul hath slain his thousands, and David his ten thousands
    kind: prophets
    title: Thousands and ten thousands
    body: |
      Saul heard the women's song as a ranking, and the ranking made him David's enemy. Saul's enmity toward David is an example of pride, and pride “is essentially competitive in nature”; turned toward other people, it is the temptation “to elevate ourselves above others and diminish them.” Saul's own words in verse 8 do the arithmetic: ten thousands to David, “but thousands” to himself.

      Saul's question, “what can he have more but the kingdom?”, shows what he feared. Samuel had already told him that the LORD had rent the kingdom from him and given it “to a neighbour of thine, that is better than thou” ([[1 Sam. 15:28]]). His pride outlasted that word: he blamed David rather than praising the LORD for the victory, as David himself had done (“the battle is the LORD's,” [[1 Sam. 17:47]]). The song went on being sung; even the Philistines knew it ([[1 Sam. 21:11]]; [[1 Sam. 29:5]]).
    sources: [benson-pride, ot-minute-1-samuel-18]

  - ref: 10
    phrase: he prophesied in the midst of the house
    kind: words
    title: He prophesied in the house
    body: |
      “Prophesied” here describes a frenzy, not inspired speech. The Hebrew verb is the one used of prophets, and here it has its sense “in the ecstatic state,” in this verse “excited to violence,” the state elsewhere called being “mad” ([[2 Kgs. 9:11]]). The same verb described Saul among the prophets with music at Gibeah, in a very different spirit ([[1 Sam. 10:10]]; the note there explains it). Here it is the prelude to a thrown spear.

      What came upon him is the “evil spirit” of chapter 16. The Joseph Smith Translation reads here that it was one “which was not of God”; the note at [[1 Sam. 16:14]] explains the spirit and the correction.
    sources: [bdb, lds-scriptures]

  - ref: 14
    phrase: David behaved himself wisely in all his ways; and the LORD was with him
    kind: words
    title: Behaved himself wisely
    body: |
      “Behaved himself wisely” means both that David acted wisely and that he succeeded. The Hebrew verb, *sākal*, carries both senses: “prosper, have success” in verses 5, 14 and 15, and “be prudent, circumspect” in verse 30, though others read “prosper” there as well. The narrator uses it four times in this chapter, and beside it each time stands what David gained: command of the fighting men (verse 5), the love of the people (14–16), and a name “much set by” (30).

      Verse 14 puts the reason beside the success: “and the LORD was with him.” One Latter-day Saint reading calls this description of David “the crux of the narrative.” It is also what Saul cannot bear: when he sees it, he is “afraid of him” (verse 15).
    sources: [bdb, ot-minute-1-samuel-18]

  - ref: 17
    phrase: be thou valiant for me, and fight the LORD’s battles
    kind: history
    title: Saul's offer of Merab
    body: |
      Saul's offer of Merab answered a promise made before the battle: the men of Israel had said the king would give his daughter to the man who killed Goliath ([[1 Sam. 17:25]]). On one older reading, the people's growing love for David left Saul obliged to keep the promise, and he called the Philistine wars “the LORD's battles” to hide his real design. The narrator gives that design in the same verse: let the hand of the Philistines be upon him.

      David answers, “Who am I?”, and then, at the appointed time, Merab is given to another man. The text gives no reason. Saul's offer of a second daughter follows in verse 21.
    sources: [keil-1-samuel]

  - ref: 20
    phrase: Michal Saul’s daughter loved David
    kind: history
    title: Michal loved David
    body: |
      The narrator says twice that Michal loved David (verses 20 and 28); Saul was pleased for his own reason, that she would be “a snare to him” (verse 21). Her love sets the match apart from a merely political marriage, though Saul meant it as one, and on one Latter-day Saint reading the marriage did more for David than Saul intended: as the king's son-in-law he gained a legitimate claim to the throne.

      Michal was Saul's second daughter ([[1 Sam. 14:49]]), and her story runs well beyond this chapter: she saves David's life in the next ([[1 Sam. 19:11–17]]), is given by Saul to another man ([[1 Sam. 25:44]]), is taken back by David ([[2 Sam. 3:13–16]]), and in the end despises him when he dances before the ark ([[2 Sam. 6:16]]).
    sources: [ot-minute-1-samuel-18, bd-michal, lds-scriptures]

  - ref: 25
    phrase: The king desireth not any dowry, but an hundred foreskins of the Philistines
    kind: history
    title: A hundred foreskins
    body: |
      Saul set a bride-price he expected David to die paying. The “dowry” is the *mōhar*, the price a man paid to his bride's father, the word Shechem uses when he offers any price for Dinah ([[Gen. 34:12]]). It could be paid in money or in service, as Jacob served for Rachel ([[Gen. 29:20]]), and David had just said that he was “a poor man” (verse 23); on one older reading, that is why he could not pay it.

      Saul asked no money; the price he named was a task: a hundred dead Philistines. The foreskins were to prove the count and to show that the dead were uncircumcised. The narrator says plainly what Saul intended, to make David fall by the hand of the Philistines; had it worked, Saul would have appeared blameless. David brought back twice the number. The Septuagint gives a hundred instead (he kills “a hundred men,” verse 27), the figure David himself uses later when he speaks of the bride he “espoused to me for an hundred foreskins of the Philistines” ([[2 Sam. 3:14]]).
    sources: [bdb, cambridge-1-samuel, ot-minute-1-samuel-18, lxx-rahlfs]

christ: |
  The chapter's answer to another man's rise is Jonathan's. The prince who, but for David, could have expected to be king loved him “as his own soul” and gave him the robe he wore.

  Saul and Jonathan face the same rising man and answer his success in opposite ways, and the difference between them is pride and its antidote, humility, “the broken heart and contrite spirit.” Another person's calling or success is where a disciple meets the same choice now. Friendships built on gospel principles and covenants, like David and Jonathan's, are the ones that hold when a hostile person tests them.

explore: |
  - **The covenant kept.** [[1 Sam. 19:1–7]]; [[1 Sam. 20:12–17]], [[1 Sam. 20:41–42]]; [[1 Sam. 23:16–18]]; David's lament, [[2 Sam. 1:25–26]]; and the kindness shown to Jonathan's son, [[2 Sam. 9:1–7]]. Elder Holland's “Real Friendship” (*New Era*, June 1998) follows the friendship through these chapters.
  - **Michal.** [[1 Sam. 19:11–17]]; [[2 Sam. 3:13–16]]; [[2 Sam. 6:16–23]].
  - **The song remembered.** [[1 Sam. 21:11]], at Gath; [[1 Sam. 29:5]], among the Philistine lords.

