chapter: 9
title: Go Seek the Asses
tagline: A young Benjamite goes looking for his father's lost donkeys and is led to the seer, who has been told a day ahead that the LORD's chosen king is coming, and who seats him in the place of honor.
when: 'After Israel asked for a king (8:5)'

setting: |
  Chapter 8 ended with the LORD telling Samuel to give the people the king they asked for ([[1 Sam. 8:22]]; why the asking was a fault is at [[1 Sam. 8:5]] and [[1 Sam. 8:7]]). Chapter 9 turns at once to the man. It is the first half of one story that runs to [[1 Sam. 10:16]]: Saul's search, his meeting with Samuel, the meal, then the anointing and the three signs that confirm it, which come in the next chapter.

  Saul is from Benjamin, a warlike tribe that did good service against the Philistines and now gives Israel its first king. Verse 16 names the danger the king is to meet: the Philistines. Saul set out from his home at Gibeah, and the search took him through the hill country of Ephraim and beyond. The town where he finally finds Samuel, in “the land of Zuph,” is never named. Samuel had come there for a sacrifice, and the town cannot be identified with certainty.

  *Scripture Helps* comments beside verse 9 (the seer) and verses 12–14 (the high places, where Israel then worshipped). What the anointing and the title “captain” mean is explained at [[1 Sam. 10:1]]; how Samuel could preside at a sacrifice, at [[1 Sam. 7:9]].
thread: |
  Saul goes looking for donkeys and comes home with a kingdom. He only wants to find his father's animals, and is ready to give up and go home when his servant thinks of the man of God. The LORD told Samuel a day ahead that He would send a man from Benjamin, and He used Saul's search to bring him to the prophet (verse 3).

  The reader knows more than Saul does: verses 15–17 tell what the LORD had already told Samuel before Saul reaches him. Samuel says he is the seer, tells Saul the donkeys are found before Saul can ask, hints at “all the desire of Israel,” and seats him at the head of the table before a portion set aside for him the day before. Saul answers only with surprise (verse 21). Samuel's words seem meant to stir in him the expectation of things he had never imagined. The night passes on the roof (verse 25), and the chapter stops at the edge of the town, with the servant sent ahead and Saul told to stand still and hear “the word of God” (verse 27), and the anointing follows in the next verse ([[1 Sam. 10:1]]).

sections:
  - range: 1-2
    heading: Kish and his son
    plain: |
      There was a man from the tribe of Benjamin named Kish, a man of wealth and standing. He was the son of Abiel, son of Zeror, son of Bechorath, son of Aphiah, a Benjamite. He had a son named Saul, a fine young man in his prime; there was no one in Israel more impressive than he. He stood head and shoulders above everyone else.
  - range: 3-5
    heading: The search
    plain: |
      Some donkeys belonging to Saul's father Kish strayed off, and Kish told Saul, “Take one of the servants with you and go look for the donkeys.” So Saul went through the hill country of Ephraim and through the region of Shalisha, but they did not find them. They went through the region of Shalim, and they were not there; he went through the territory of Benjamin, but they did not find them. When they reached the region of Zuph, Saul said to the servant with him, “Come, let's go back, or my father will stop worrying about the donkeys and start worrying about us.”
  - range: 6-10
    heading: The servant's counsel
    plain: |
      But the servant said, “Look, there is a man of God in this town, a highly respected man, and everything he says comes true. Let's go there now; perhaps he can tell us which way to go.” Saul said to his servant, “If we go, what can we bring the man? The bread in our bags is gone, and we have no gift to bring the man of God. What do we have?” The servant answered again, “Here, I have a quarter of a shekel of silver. I will give it to the man of God, and he will tell us our way.” (In earlier times in Israel, when someone went to ask God for guidance, he would say, “Come, let us go to the seer,” because the one now called a prophet used to be called a seer.) “Good,” Saul said to his servant. “Come, let's go.” So they set out for the town where the man of God was.
  - range: 11-14
    heading: At the well below the town
    plain: |
      As they were climbing the hill to the town, they met some young women coming out to draw water and asked them, “Is the seer here?” “He is,” they answered. “He is just ahead of you. Hurry; he has just come to town today, because the people have a sacrifice at the high place. As soon as you enter the town you will find him, before he goes up to the high place to eat. The people will not eat until he comes, because he blesses the sacrifice; after that the invited guests eat. Go up now; you should find him about now.” So they went up to the town, and as they were entering it, there was Samuel coming out toward them on his way up to the high place.
  - range: 15-17
    heading: What the LORD had told Samuel
    plain: |
      Now the day before Saul came, the LORD had revealed this to Samuel: “About this time tomorrow I will send you a man from the land of Benjamin. Anoint him to be leader over my people Israel, and he will save my people from the power of the Philistines. I have looked upon my people, for their cry has reached me.” When Samuel caught sight of Saul, the LORD said to him, “This is the man I told you about. He will rule over my people.”
  - range: 18-21
    heading: The seer at the gate
    plain: |
      Saul came up to Samuel in the gateway and asked, “Please tell me where the seer's house is.” “I am the seer,” Samuel answered. “Go up ahead of me to the high place, for today you are eating with me. In the morning I will send you on your way and tell you everything that is on your mind. As for the donkeys you lost three days ago, don't worry about them; they have been found. And on whom is all Israel's desire fixed? Is it not on you and on all your father's family?” Saul answered, “But I am a Benjamite, from the smallest tribe of Israel, and my family is the least of all the families of Benjamin. Why do you say such a thing to me?”
  - range: 22-24
    heading: The place of honor
    plain: |
      Then Samuel brought Saul and his servant into the hall and gave them the place at the head of the guests, about thirty people. Samuel said to the cook, “Bring the portion I gave you, the one I told you to set aside.” The cook took up the shoulder with what was on it and set it before Saul. Samuel said, “Here is what was kept back. Set it before you and eat, for it was kept for you for this occasion, from the time I said, ‘I have invited the people.’” So Saul ate with Samuel that day.
  - range: 25-27
    heading: On the roof, and at the edge of town
    plain: |
      When they came down from the high place into the town, Samuel talked with Saul on the roof of the house. They got up early: at dawn Samuel called to Saul on the roof, “Get up, and I will send you on your way.” Saul got up, and he and Samuel went outside together. As they were going down to the edge of the town, Samuel said to Saul, “Tell the servant to go on ahead of us” (and he did), “but you stay here a while, so that I may give you the word of God.”

notes:
  - ref: 2
    phrase: a choice young man, and a goodly
    kind: history
    title: A choice young man, and a goodly
    body: |
      The narrator's praise of Saul is real: the man the LORD chose was a promising one. (The play on his name, Saul, with Hannah's “asked” is at [[1 Sam. 1:20]].) “Goodly” sums up what made him a logical first king. All the Bible shows of him is that he was honest, reliable and considerate of his parents (he worries in verse 5 that his father will be anxious), and the context suggests the Lord chose someone who could lead the people in righteousness. The events that follow show that in choosing Saul the Lord was also teaching Israel a lesson about people and about kings.

      The height matters later. Saul was about a foot taller than the men of his generation; if most men in ancient Israel stood about five and a half feet, that makes him about six and a half feet tall, which is Goliath's height in the Septuagint and the Dead Sea Scrolls. One reading builds on that: Israel's own giant was the obvious man to answer the Philistine's challenge in chapter 17, and he did not (that reading is taken up at [[1 Sam. 17:4]]).
    sources: [ot-manual-1-samuel-1, ot-minute-1-samuel-9-10, sc-knowhy-856]
  - ref: 3
    phrase: go seek the asses
    kind: history
    title: Sent to find the asses
    body: |
      The strayed donkeys are how the LORD brings Saul to Samuel. Saul does not go looking for a crown; he goes looking for donkeys, and is about to give up (verse 5). Samuel does not pick him either: the LORD tells Samuel that He will “send” a man (verse 16).

      The Lord used the journey to guide Saul to the prophet, and Saul's part in it was a simple faith. When his servant suggests the man of God, Saul does not dismiss the idea; he only worries that they have nothing to bring (verse 7). He was willing to ask the seer for revelation about lost animals. When Samuel tells him the donkeys are found (verse 20), he turns at once to “all the desire of Israel.”
    sources: [ot-minute-1-samuel-9-10, ellsworth-tragic-saul]
  - ref: 9
    phrase: he that is now called a Prophet was beforetime called a Seer
    kind: words
    title: Seer and prophet
    body: |
      The verse is an aside to the reader, explaining an old word: “seer” (*rōʾeh*, from *rāʾâ*, “to see”) had gone out of everyday use, and “prophet” (*nābîʾ*) was the usual term. In one older reading the aside was added to the story and placed here, before the word is used (verse 11), so as not to interrupt it later. A second Hebrew word, *ḥōzeh*, “gazer,” is also translated “seer,” first of Gad ([[2 Sam. 24:11]]). How the terms differ is debated; the same older reading thinks *nābîʾ* probably names the prophet as the inspired interpreter of God's will, and the two words for seer the way revelation came, by dream and vision.

      The Book of Mormon gives “seer” a fuller sense than the Bible's word. In [[Mosiah 8:13–17]] a seer is one commanded to look in the interpreters, and seership is greater than prophethood because a seer brings to light what is past and hidden: mysteries, lost scripture, hidden knowledge. That account is consistent with the seers the Bible shows at work, Samuel among them. The way Samuel recognizes Saul is the evidence of his seership in this chapter: he knows the donkeys are found and what is in Saul's heart (verses 19–20). There is no evidence that Samuel had a Urim and Thummim, though it is possible.
    sources: [cambridge-1-samuel, sc-knowhy-457, sc-knowhy-86, ot-manual-1-samuel-1, ot-minute-1-samuel-9-10]
  - ref: 11
    phrase: they found young maidens going out to draw water
    kind: scripture
    title: Maidens at the well
    body: |
      A young man far from home meeting young women at the water is a scene the Bible's first readers knew. It is how Abraham's servant found Rebekah ([[Gen. 24:15]]), how Jacob met Rachel ([[Gen. 29:9]]) and how Moses met Zipporah's family ([[Ex. 2:16]]), and each meeting leads to a marriage. Saul meets the maidens going out to draw water, and the audience likely would have expected the same kind of scene to follow. Nothing happens: Saul asks the way and walks on. One reading takes the unfinished scene as foreshadowing: like the betrothal scene that is never fulfilled, Saul's reign will be cut short.
    sources: [sc-knowhy-854, lds-scriptures]
  - ref: 15
    phrase: the LORD had told Samuel in his ear
    kind: words
    title: Uncovered Samuel's ear
    body: |
      “Told … in his ear” renders a Hebrew idiom, *gālâ ʾōzen*, “uncover the ear”: to reveal something to someone. Boaz uses it when he tells his kinsman what he plans to do ([[Ruth 4:4]], where the King James has “advertise”), and David uses it of the LORD's revealing the covenant for his house: “thou … hast revealed to thy servant” ([[2 Sam. 7:27]]).

      So Samuel alone knew, a day ahead, that the LORD would send him a man from Benjamin (verse 16), and the LORD speaks to him again the moment Saul appears (verse 17).
    sources: [bdb]
  - ref: 16
    phrase: for I have looked upon my people, because their cry is come unto me
    kind: scripture
    title: Their cry is come unto me
    body: |
      The LORD gives His reason for the king in words that recall the Exodus. “I have looked upon my people” recalls [[Ex. 2:25]] and [[Ex. 3:7]], and “their cry is come unto me” echoes what He said to Moses at the bush ([[Ex. 3:9]]). In one older reading the LORD's looking there was no idle watching but the look that sent help, and as the Philistines followed in the Egyptians' footsteps, the LORD sent a deliverer from these new oppressors, a king to “save my people” from them. The word for his office, “captain” (*nāgîd*, a prince or ruler), is taken up at [[1 Sam. 10:1]].

      The same reading finds no contradiction with chapter 8: the LORD's displeasure there ([[1 Sam. 8:7]]) was with the heart the request came from. Here, having granted it, He gives the king a deliverer's work, because He has heard His people's cry.
    sources: [keil-1-samuel, ot-minute-1-samuel-9-10]
  - ref: 20
    phrase: on whom is all the desire of Israel
    kind: history
    title: The desire of Israel
    body: |
      Samuel's question hints at the kingdom without naming it, and it may mean one of two things. Israel wanted a king, and Saul, though no one knew it yet, was what they wanted; or his name may already have been one people talked about. One older reading renders the Hebrew “for whom are all the desirable things of Israel?” Then the contrast is with the donkeys: do not worry about a few lost animals, when the best Israel has to give is yours and your father's house's.

      Samuel says no more for now, and Saul answers with a protest (verse 21).
    sources: [ot-manual-1-samuel-1, cambridge-1-samuel]
  - ref: 21
    phrase: Am not I a Benjamite, of the smallest of the tribes of Israel?
    kind: history
    title: The smallest of the tribes
    body: |
      Saul's protest is true of his tribe. At the census in the wilderness only Manasseh counted fewer men than Benjamin ([[Num. 1:35]], [[Num. 1:37]]), and after the civil war only six hundred of Benjamin's fighting men were left ([[Judg. 20:47]]; the story is at [[Judg. 20]] and [[Judg. 21]]). Saul had no family or political standing that would make him a candidate for king, and he says so.

      Samuel remembers the words. When he rejects Saul after the war with Amalek, he says, “When thou wast little in thine own sight, wast thou not made the head of the tribes of Israel?” ([[1 Sam. 15:17]]), looking back to what Saul said here.
    sources: [ot-minute-1-samuel-9-10, keil-1-samuel]
  - ref: 24
    phrase: the cook took up the shoulder, and that which was upon it
    kind: history
    title: The portion kept for Saul
    body: |
      The meal is a sacrificial feast at the high place, and its details honor Saul. The people would not eat until Samuel had blessed the sacrifice (verse 13), which one older reading takes as the prayer of thanksgiving before the meal. In the older commentaries only the more distinguished guests, about thirty, were invited into the hall, and the rest would feast outside. Samuel seats Saul and even his servant at the head of the table.

      The “shoulder” is the leg, the largest and best portion and a piece of honor. One older reading notes that the right leg was the priest's portion ([[Lev. 7:32]]); since Samuel conducted the sacrifice, it may have fallen to him to reserve for his guest. The older commentaries see no further symbolic meaning in it. What Samuel says over it is the point: it had been kept for Saul since before he arrived, which told him that Samuel had known he was coming. By honoring an unknown young man from the least family of Benjamin in front of the town's leading men, Samuel showed that he was to be honored as king.
    sources: [keil-1-samuel, cambridge-1-samuel, ot-minute-1-samuel-9-10]
  - ref: 25
    phrase: Samuel communed with Saul upon the top of the house
    kind: history
    title: Talking on the roof, or sleeping there?
    body: |
      The Hebrew and the Greek tell this night differently. The Hebrew, which the King James follows, says that Samuel talked with Saul on the roof. The Septuagint says that “they prepared a lodging for Saul on the roof, and he lay down,” and a modern translation follows it: “a bed was spread for Saul on the roof.” Either way Saul spent the night on the roof, since at dawn Samuel calls up to him there (verse 26), and what Samuel had to tell him waited for the morning (verse 27).
    sources: [lxx-rahlfs, nrsvue]

christ: |
  The LORD who says “I have looked upon my people” (verse 16) is Jehovah, the premortal Christ ([[Ex. 3:14]]), speaking as He spoke to Moses at the bush ([[Ex. 3:9]]); His looking is the look that sends help. He arranged both ends of this meeting, telling His seer a day ahead who was coming and turning a young man's search for strayed animals into the road to the seer's door.

  The same Lord still answers those who go to inquire of Him ([[D&C 6:11]]), and in the latter days He called Joseph Smith a seer ([[D&C 21:1]]).

explore: |
  - **Seers in Restoration scripture.** [[Mosiah 8:13–18]] and [[Mosiah 28:13–16]], beside verse 9.
  - **The deliverer's call.** [[Ex. 3:7–10]], the words the LORD repeats in verse 16.
  - **Saul's own words, remembered.** [[1 Sam. 15:17]], where Samuel looks back to verse 21.
  - **Meetings at the well.** [[Gen. 24:15–27]], [[Gen. 29:9–12]], [[Ex. 2:16–21]], beside verse 11.

