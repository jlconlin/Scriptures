chapter: 20
title: The LORD Be between Me and Thee
tagline: David flees to Jonathan, and the two renew their covenant in the field; at the new moon feast Saul turns his javelin on his own son, and Jonathan's arrows tell David he must go.
when: 'While David fled from Saul, at the new moon'

setting: |
  Chapter 19 ended with David a fugitive. Saul had ordered his death, and Jonathan had talked his father out of it and won a vow that David would live ([[1 Sam. 19:1–7]]); then Saul's javelin came again ([[1 Sam. 19:10]]), Michal let David down through a window, and he fled to Samuel at Ramah and stayed with him at Naioth. Saul's messengers, and at last Saul himself, came under the Spirit there and prophesied ([[1 Sam. 19:18–24]]).

  Chapter 20 opens as David leaves Naioth. He goes to Jonathan to learn whether he can come back. Saul had kept David at court ([[1 Sam. 18:2]]), and before David could safely return he needed to know how the king stood toward him; the feast Saul held at the new moon gave Jonathan the chance to find out. The covenant the two men made in chapter 18 ([[1 Sam. 18:3]]; the note there explains it) is renewed here and its terms are spelled out for the first time. After this chapter David does not return to Saul's table: chapter 21 finds him alone at Nob, and Jonathan will find him once more in the wilderness ([[1 Sam. 23:16–18]]).

thread: |
  The chapter is a test with two outcomes. David proposes it: miss the feast, and let Saul's reaction tell the truth (verses 5–7). Jonathan devises the signal, the arrows short of the lad or beyond him (19–22). Between the plan and the signal stands the chapter's center, the covenant in the field (11–17). Jonathan swears to warn David, and David swears to keep faith with Jonathan's family and posterity. Jonathan already sees where David's life is going: “the LORD be with thee, as he hath been with my father” (13).

  At the feast Saul tells Jonathan that as long as the son of Jesse lives, “thou shalt not be established, nor thy kingdom” (31): while David lives, Jonathan will never be king. Jonathan has already bound himself to David by oath, and when he asks what David has done, Saul answers him with a javelin, as he had answered David ([[1 Sam. 18:11]]; [[1 Sam. 19:10]]). The arrows fly beyond the lad, and the friends part with the words that frame the covenant: “The LORD be between me and thee” (23, 42).

sections:
  - range: 1-10
    heading: David comes to Jonathan
    plain: |
      David fled from Naioth in Ramah and came to Jonathan. “What have I done?” he asked. “What is my crime? How have I wronged your father, that he wants to kill me?” “Never!” Jonathan said. “You will not die. My father does nothing, great or small, without telling me. Why would he hide this from me? It isn't so.” But David swore to it: “Your father knows very well that you are my friend, and he has said to himself, ‘Jonathan must not know, or he will be grieved.’ As surely as the Lord lives and as you live, I am only a step from death.” Jonathan said, “Whatever you want, I will do for you.” David said, “Tomorrow is the new moon, and I am expected to dine with the king. Let me go and hide in the field until the evening of the third day. If your father misses me, tell him, ‘David begged me to let him hurry to Bethlehem, his town, because his whole family holds its yearly sacrifice there.’ If he says, ‘Good,’ I am safe. But if he flies into a rage, you can be sure he has made up his mind to harm me. So be loyal to me, for you have brought me into a covenant with you before the Lord. But if I am guilty, kill me yourself. Why hand me over to your father?” “Never!” said Jonathan. “If I knew for certain that my father meant to harm you, wouldn't I tell you?” David asked, “Who will tell me if your father answers you harshly?”
  - range: 11-23
    heading: The covenant in the field
    plain: |
      “Come,” Jonathan said, “let's go out into the field.” So the two of them went out. Jonathan said to David, “By the Lord God of Israel: when I have sounded out my father about this time tomorrow or the day after, if he is well disposed toward you, I will send word and let you know. If I do not, may the Lord punish me, and worse. But if my father means to harm you, I will tell you and send you away safely, and may the Lord be with you as He has been with my father. And while I live, show me the Lord's own faithful kindness, so that I do not die; and never cut off your kindness from my family, not even when the Lord has wiped every one of David's enemies from the face of the earth.” So Jonathan made a covenant with the house of David: “May the Lord call David's enemies to account.” And Jonathan had David swear again, out of his love for him, for he loved him as he loved himself. Then Jonathan told him, “Tomorrow is the new moon, and you will be missed, because your seat will be empty. On the third day go down quickly to the place where you hid before, and wait by the stone Ezel. I will shoot three arrows to the side of it, as though I were shooting at a target. Then I will send a boy and tell him, ‘Go, find the arrows.’ If I tell him, ‘Look, the arrows are on this side of you; bring them,’ then come, for as the Lord lives, you are safe and in no danger. But if I tell the boy, ‘Look, the arrows are beyond you,’ then go, for the Lord has sent you away. And as for what you and I have agreed, the Lord stands between you and me forever.”
  - range: 24-34
    heading: The new moon feast
    plain: |
      So David hid in the field. When the new moon came, the king sat down to eat. He took his usual seat by the wall, Jonathan rose, Abner sat beside Saul, and David's place was empty. Saul said nothing that day, for he thought, “Something has happened to him; he is ceremonially unclean; surely he is unclean.” But the next day, the second of the month, David's place was empty again, and Saul asked Jonathan, “Why hasn't the son of Jesse come to the meal, either yesterday or today?” Jonathan answered, “David begged me to let him go to Bethlehem. He said, ‘Please let me go, because our family has a sacrifice in the town and my brother has ordered me to be there. If you are my friend, let me slip away to see my brothers.’ That is why he has not come to the king's table.” Saul's anger blazed against Jonathan. “You son of a perverse, rebellious woman!” he said. “Don't I know that you have sided with the son of Jesse, to your own shame and the shame of the mother who bore you? As long as the son of Jesse lives on the earth, neither you nor your kingdom will be secure. Now send and bring him to me, for he must die.” “Why should he be put to death?” Jonathan asked his father. “What has he done?” Then Saul hurled his spear at him to strike him, and Jonathan knew that his father was determined to kill David. Jonathan left the table in fierce anger and ate nothing on that second day of the month, grieved for David because his father had disgraced him.
  - range: 35-42
    heading: The arrows and the parting
    plain: |
      In the morning Jonathan went out into the field at the time agreed with David, and a small boy went with him. He told the boy, “Run and find the arrows I shoot.” As the boy ran, he shot an arrow beyond him. When the boy came to where the arrow had fallen, Jonathan called after him, “Isn't the arrow beyond you? Hurry! Be quick! Don't stop!” The boy picked up the arrows and came back to his master. He knew nothing of what it meant; only Jonathan and David knew. Jonathan gave his weapons to the boy and told him, “Go, take them back to town.” As soon as the boy had gone, David came out from his hiding place on the south side, fell on his face to the ground and bowed three times. They kissed each other and wept together, David most of all. Jonathan said to David, “Go in peace, for we have both sworn in the name of the Lord, saying, ‘The Lord stands between you and me, and between your descendants and mine, forever.’” Then David rose and left, and Jonathan went back into the town.

notes:
  - ref: 5
    phrase: to morrow is the new moon
    kind: history
    title: The feast of the new moon
    body: |
      The new moon was a sacred day, and Saul kept it with a feast at which David was expected. The law appointed special sacrifices at the new moon ([[Num. 10:10]]), and this chapter is among the passages that show the day being kept (verses 5–6, 29). To “sit with the king at meat” was to take a place as a member of the royal household at a sacrificial feast, and the feast went on into a second day (verses 27, 34). On one older reading, the plan was a shrewd test of whether what happened at Naioth had changed Saul at all.

      David's excuse in verse 6, a yearly sacrifice for the whole family at Bethlehem, raises the obvious question whether it was true. The text does not say. The same older reading grants that it is not clear whether David really meant to go to Bethlehem or counted the story a justifiable deception to keep from provoking Saul.

      Saul's silence on the first day (verse 26) fits the feast's religious character. A sacrificial meal could not be eaten by someone ceremonially unclean: “the soul that eateth of the flesh of the sacrifice of peace offerings… having his uncleanness upon him, even that soul shall be cut off from his people” ([[Lev. 7:20]]). Saul assumed at first that David had stayed away for that reason (verse 26).
    sources: [bd-new-moon, cambridge-1-samuel, lds-scriptures]

  - ref: 8
    phrase: thou hast brought thy servant into a covenant of the LORD with thee
    kind: history
    title: A covenant of the LORD
    body: |
      David appeals to the covenant Jonathan made with him in chapter 18 ([[1 Sam. 18:3]]; the note there explains the covenant and its word *bǝrît*), and he claims from it the loyalty it promised. It was “a covenant of the LORD”: at the parting the two say they have “sworn both of us in the name of the LORD” (verse 42).

      “Deal kindly” translates the Hebrew *ʿāśâ ḥesed*, to do *ḥesed*, the covenant kindness that comes back in verses 14 and 15. David asks Jonathan for it here; a few verses later Jonathan asks David for it in return. The covenant ran both ways. Jonathan was to warn David of danger from his father, and David was to watch over Jonathan's family, “including his posterity.”

      David's own offer in the same verse shows how seriously he takes it: if he is guilty of anything, let Jonathan kill him rather than hand him to Saul.
    sources: [bdb, ot-seminary-lesson-88]

  - ref: 13
    phrase: The LORD do so and much more to Jonathan
    kind: history
    title: The LORD do so to Jonathan
    body: |
      “The LORD do so and much more to Jonathan” is an oath in which Jonathan calls a curse down on himself if he fails David. The formula, “God so do to me, and more also,” was spoken by a person who expected to be cursed if he did not keep his oath. It is attested in Israel from Eli to Solomon, Jonathan among them, and it seems to belong to the oaths by which covenants were made.

      Such an oath was no figure of speech. In ancient Israel, breaking an oath sworn in God's name was counted blasphemy, and it could become “a matter of life and death.” Jonathan, the king's son, puts himself under that penalty for his father's rival.
    sources: [parker-cutting, sc-knowhy-98]

  - ref: 14
    phrase: shew me the kindness of the LORD, that I die not
    kind: history
    title: The kindness of the LORD
    body: |
      Jonathan asks David to spare his life and his family when David is king, and to do it as the LORD Himself would. “The kindness of the LORD” is *ḥesed YHWH*; the lexicon records three understandings of the phrase: kindness such as the LORD shows, kindness sworn by oath to Him, or kindness shown out of reverence for Him.

      Jonathan's fear was a real one. On one older reading, he was already convinced that David would reign, and he feared that even David might follow the custom by which the founder of a new dynasty often secured his throne by killing his predecessor's family. So he asks for kindness while he lives, “that I die not,” and for his house “for ever” (verse 15). The general sense is clear, that reading adds, though the exact rendering of the Hebrew is uncertain.

      David kept the promise with Jonathan's son ([[2 Sam. 9:1]], the verse the footnote names; the note at [[1 Sam. 18:3]] follows it).
    sources: [bdb, cambridge-1-samuel, lds-scriptures]

  - ref: 30
    phrase: Thou son of the perverse rebellious woman
    kind: words
    title: Son of the perverse rebellious woman
    body: |
      Saul curses Jonathan's mother, blaming her for a son who was loyal to David rather than to his own father; his children, first Michal and then Jonathan, sided with David because they knew their father's hatred was unjustified. The Hebrew behind “perverse” means bent or twisted, and the word for “rebellious,” *mardût*, occurs only here; with the Septuagint the phrase is probably to be read “son of a girl of rebelliousness,” that is, of a rebellious girl.

      Verse 31 says what lay under the insult. Saul tells Jonathan, “thou shalt not be established, nor thy kingdom,” as long as David lives. The footnote at “established” points to the place where Jonathan himself tells David, “thou shalt be king over Israel, and I shall be next unto thee” ([[1 Sam. 23:17]]). Jonathan's question, “what hath he done?” (verse 32), gets no answer but a javelin.
    sources: [bdb, ot-manual-1-samuel-16, lds-scriptures]

  - ref: 40
    phrase: Jonathan gave his artillery unto his lad
    kind: words
    title: His artillery
    body: |
      Jonathan's “artillery” is his bow and arrows. In older English the word meant offensive weapons in general, and so it was used of bows and arrows; by 1828 that use was already old, and a dictionary illustrated it with this very verse. The Hebrew word, *kĕlî*, is the ordinary word for an implement or vessel, and here a weapon. With the boy and the weapons sent back to the city, Jonathan and David are alone.
    sources: [webster-1828, bdb]

  - ref: 41
    phrase: they kissed one another, and wept one with another, until David exceeded
    kind: history
    title: The parting
    body: |
      “Until David exceeded” means that David wept the more, and the Church's reading says why: his loss was the greater. The verb is the Hebrew for growing great, and here it means “wept greatly.” Both men wept at the parting, but David's distress exceeded Jonathan's. Jonathan went back to the city; David went into exile. Saul would give his wife to another man ([[1 Sam. 25:44]]), and David, hiding from the king, was cut off from the tabernacle and its sacrifices.
    sources: [bdb, ot-manual-1-samuel-16]

  - ref: 42
    phrase: between my seed and thy seed for ever
    kind: history
    title: Between my seed and thy seed for ever
    body: |
      Jonathan's last words make the covenant reach past the two men to their children, and the rest of the story shows it kept. He repeats what he said in the field, “the LORD be between thee and me for ever” (verse 23), and widens it to “my seed and thy seed.” The two met once more and renewed the covenant ([[1 Sam. 23:16–18]]), and David mourned him after his death ([[2 Sam. 1:26]]). When the Gibeonites demanded seven of Saul's sons, the king spared Mephibosheth “because of the LORD’s oath that was between them, between David and Jonathan the son of Saul” ([[2 Sam. 21:7]]).
    sources: [holland-real-friendship, lds-scriptures]

christ: |
  Jonathan asked David for “the kindness of the LORD,” and David kept it to Jonathan's house long after Jonathan was dead, seeking out his son to restore his lands and bring him to the king's table ([[2 Sam. 9:7]]). The LORD swore the same *ḥesed* to David's own house, and the prophets looked for a son of David in whom it would be fulfilled; that son is Jesus Christ, “simultaneously the promisor and the fulfillment of the promise.”

  The kindness of the LORD is covenant kindness: it is sworn, it outlasts the moment of the oath, and it reaches the children. God has not withdrawn that *ḥesed*, and a disciple claims it now, as Isaiah's invitation to “the sure mercies of David” promised, by returning to the Lord ([[Isa. 55:3]]).

explore: |
  - **The covenant kept.** [[1 Sam. 23:16–18]], the last meeting; [[2 Sam. 1:25–27]], David's lament; [[2 Sam. 9:1–13]], Mephibosheth at the king's table; [[2 Sam. 21:7]].
  - **The LORD as witness.** [[Gen. 31:49]], where Laban says, “The LORD watch between me and thee,” the parallel an older commentary sets beside verse 23.
  - **Before and after.** [[1 Sam. 19:1–7]], Jonathan's first intercession; [[1 Sam. 21:1–9]], David alone at Nob.

