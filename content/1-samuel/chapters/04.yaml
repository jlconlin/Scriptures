chapter: 4
title: The Glory Is Departed
tagline: Israel carries the ark into battle to save them, and loses the battle, the ark and its priests; Eli dies at the news, and a dying mother names her son I-chabod.
when: 'In the days of Eli, at Shiloh'

setting: |
  Chapter 3 ended with Samuel known “from Dan even to Beer-sheba” as a prophet, and with the LORD revealing Himself again at Shiloh ([[1 Sam. 3:20–21]]). Chapter 4 turns abruptly to war with the Philistines, Israel’s neighbours on the coastal plain (the guide [The Conquest, the Judges, and One Kingdom](/old-testament/guides/the-conquest-judges-and-kingdom/#nations) introduces them). They were last seen in the stories of Samson, when the LORD delivered Israel into their hand forty years ([[Judg. 13:1]]), the verse the footnote to verse 9 points to.

  Shiloh, in Ephraim, had held the tabernacle through most of the period of the judges, and it stayed the nation’s religious center until the ark was lost in this battle (the tabernacle’s coming there is at [[Josh. 18:1]]). Chapters 4–6 follow the ark: it is taken here, it troubles the Philistines in chapters 5 and 6, and it comes back to wait twenty years at Kirjath-jearim ([[1 Sam. 7:2]]). Scripture remembers the day as the LORD’s own act: He “forsook the tabernacle of Shiloh” ([[Ps. 78:60]]), and Jeremiah sent Jerusalem to look at what was left of it ([[Jer. 7:12]]).

thread: |
  The chapter answers the question the elders ask in verse 3: “Wherefore hath the LORD smitten us to day before the Philistines?” They are right about who: the LORD was not with them. What they do with that is the trouble. They do not ask Him why, or repent; they send for the ark, so that “it may save us.”

  Everything after that makes the first defeat worse. The shout in the camp frightens the Philistines into fighting harder (verses 5–9). Thirty thousand fall, the ark is taken, and the two priests who carried it die on one day, as Eli had been told they would (verses 10–11). The news reaches Shiloh, and Eli dies when he hears of the ark (verses 12–18). His son’s widow, dying in childbirth, gives the chapter its last word and its meaning: “The glory is departed from Israel” (verses 19–22).

  The remedy is not in this chapter. It comes twenty years later, when Samuel tells Israel to “return unto the LORD with all your hearts” ([[1 Sam. 7:3]]), and the victory is won at the place this chapter already calls Eben-ezer.

sections:
  - range: 1-2
    heading: The first defeat
    plain: |
      Samuel’s word went out to all Israel. Israel went out to fight the Philistines and camped by Eben-ezer, while the Philistines camped at Aphek. The Philistines drew up their lines against Israel, and when the battle spread, Israel was beaten; about four thousand men of Israel’s army were killed on the field.
  - range: 3-9
    heading: The ark comes to the camp
    plain: |
      When the army came back to camp, the leaders of Israel asked, “Why has the LORD struck us down before the Philistines today? Let’s bring the ark of the LORD’s covenant from Shiloh, so that it can come among us and save us from our enemies.” So the people sent to Shiloh and brought back the ark of the covenant of the LORD of hosts, who is enthroned between the cherubim. Eli’s two sons, Hophni and Phinehas, came with it. When the ark entered the camp, all Israel raised such a shout that the ground shook. The Philistines heard it and asked what the shouting in the Hebrews’ camp meant, and they learned that the ark of the LORD had come. They were afraid. “God has come into the camp,” they said. “We’re in trouble! Nothing like this has happened before. Who can save us from these mighty gods? These are the gods who struck the Egyptians with every kind of blow in the wilderness. Be strong, Philistines, and be men, or you will become slaves to the Hebrews as they have been to you. Be men, and fight!”
  - range: 10-11
    heading: The ark is taken
    plain: |
      The Philistines fought, Israel was beaten, and every man ran for home. The slaughter was very great: thirty thousand foot soldiers of Israel fell. The ark of God was captured, and Eli’s two sons, Hophni and Phinehas, were killed.
  - range: 12-18
    heading: Eli hears the news
    plain: |
      A man of Benjamin ran from the battle and reached Shiloh that same day, with his clothes torn and dirt on his head, the signs of deep mourning. Eli was sitting on his seat by the road, watching, because his heart was anxious for the ark of God. When the man came into the town with the news, the whole town cried out. Eli heard the outcry and asked what the uproar was, and the man hurried over to tell him. Eli was ninety-eight years old, and his eyes had grown so dim that he could not see. The man said, “I’m the one who came from the battle; I fled from it today.” Eli asked, “What happened, my son?” The messenger answered, “Israel has fled from the Philistines, and the people have suffered a great slaughter. Your two sons, Hophni and Phinehas, are dead, and the ark of God has been captured.” When he mentioned the ark of God, Eli fell backward off his seat beside the gate; his neck was broken and he died, for he was old and heavy. He had judged Israel forty years.
  - range: 19-22
    heading: I-chabod
    plain: |
      Eli’s daughter-in-law, the wife of Phinehas, was pregnant and near her time. When she heard that the ark of God had been captured and that her father-in-law and her husband were dead, she crouched down and gave birth, for her labour pains overwhelmed her. As she was dying, the women attending her said, “Don’t be afraid; you have had a son.” But she did not answer or pay any attention. She named the boy I-chabod, saying, “The glory has gone from Israel,” because the ark of God had been captured and because of her father-in-law and her husband. She said, “The glory has gone from Israel, for the ark of God has been captured.”

notes:
  - ref: 1
    phrase: pitched beside Eben-ezer
    kind: history
    title: Eben-ezer, named after the fact
    body: |
      The battlefield carries a name it did not yet have. Eben-ezer means “stone of help,” and Samuel gave it twenty years later, when he set up a stone after a victory over the Philistines and said, “Hitherto hath the LORD helped us” ([[1 Sam. 7:12]]). The place had already been the scene of two defeats (verse 1; [[1 Sam. 5:1]]), and in their account it is called by the name it received later on. The defeat and the deliverance belong to one place, and the name the place bears comes from the deliverance.

      The verse does not say who began the fighting. It sets “the word of Samuel came to all Israel” beside “Israel went out” without joining them. The Septuagint, the ancient Greek translation, opens differently, with the Philistines gathering “against Israel to war” and Israel going out to meet them. Neither text gives Samuel any word about the battle itself, and he does not appear again until chapter 7.
    sources: [bd-ebenezer, lxx-rahlfs, lds-scriptures]

  - ref: 3
    phrase: that, when it cometh among us, it may save us out of the hand of our enemies
    kind: history
    title: Why the ark went into battle
    body: |
      The elders sent for the ark because they expected it to save them, and their own words show where their trust had moved. In their sentence the one who saves is the ark: “when it cometh among us, it may save us.” The phrase suggests that Israel “might have placed their faith in the ark rather than in the Lord.”

      They had reasons to think it would work. The ark was the oldest and most sacred of Israel’s religious symbols, and the mercy seat that covered it “was regarded as the earthly dwelling place of Jehovah.” Verse 4 gives it its full title, “the ark of the covenant of the LORD of hosts, which dwelleth between the cherubims,” the throne explained at [[Ex. 25:18]] and [[Ps. 99:1]]. Israel had carried it into the land as a sign that God was with them; it had gone ahead at the Jordan and around Jericho ([[Josh. 3:14–17]]; [[Josh. 6:12–16]]), and when it set out in the wilderness Moses prayed, “Rise up, LORD, and let thine enemies be scattered” ([[Num. 10:35]]). But at Jericho the LORD had given the command. Here the elders’ question is followed at once by their own answer, “Let us fetch the ark,” and it could not work: “Their wickedness prevented them from receiving the Lord’s strength and protection.”
    sources: [scripture-helps-ruth-samuel, bd-ark-of-the-covenant, lds-scriptures]

  - ref: 8
    phrase: who shall deliver us out of the hand of these mighty Gods?
    kind: history
    title: The Philistines’ many gods
    body: |
      The Philistines speak of Israel’s God in the plural: in the Hebrew both the noun and its adjective are plural, “these mighty gods,” and *ʾĕlōhîm* here has its sense “gods.” What they fear is what those gods had done to Egypt.

      What they remember is the Exodus. The word for “plagues” here means a plague sent as punishment. But the ten plagues fell in Egypt, not “in the wilderness”; one older reading takes the words as the overthrow of Pharaoh at the Red Sea. The Song of Moses had said the news would reach them: “sorrow shall take hold on the inhabitants of Palestina” ([[Ex. 15:14]]).
    sources: [bdb, cambridge-1-samuel, lds-scriptures]

  - ref: 11
    phrase: the two sons of Eli, Hophni and Phinehas, were slain
    kind: history
    title: The sign given to Eli
    body: |
      Hophni and Phinehas die on the same day, as a man of God had told Eli they would: “in one day they shall die both of them” ([[1 Sam. 2:34]]). What they did is told at [[1 Sam. 2:13]] and [[1 Sam. 2:22]], and the judgment on Eli’s house at [[1 Sam. 2:35]] and [[1 Sam. 3:13]]. Verse 4 has already placed them beside the ark, so the priests who came with it to the camp were the men under sentence.

      Their deaths were not the end of the line. The high priesthood stayed in Eli’s family until Abiathar was put out of it ([[1 Kgs. 2:27]]), when it passed back to the line of Aaron’s eldest son; the note at [[1 Sam. 2:35]] explains it.
    sources: [lds-scriptures, bd-eli]

  - ref: 18
    phrase: when he made mention of the ark of God
    kind: history
    title: What broke Eli
    body: |
      Eli falls at the news of the ark, which comes after the news of his sons. The messenger’s report builds to it: Israel has fled, there has been a great slaughter, “thy two sons also, Hophni and Phinehas, are dead,” and last, “the ark of God is taken” (verse 17). It is “when he made mention of the ark of God” that Eli falls. Verse 13 has already said what he was waiting by the road for: “his heart trembled for the ark of God.”

      The verse closes his life with what he had been: an old man, blind (verse 15), who “had judged Israel forty years,” high priest and judge at once. The “blot on his character” was “his toleration of the wickedness of his own sons,” the fault the LORD had named to Samuel: “he restrained them not” ([[1 Sam. 3:13]]). The man who did not restrain his sons seems, at the end, to have cared most for the ark of God.
    sources: [bd-eli, lds-scriptures]

  - ref: 21
    phrase: she named the child I-chabod
    kind: words
    title: 'I-chabod: the glory gone into exile'
    body: |
      The boy’s name is a cry of loss. *ʾî-kābôd* is “Where is the glory?”, as the footnote gives it, or “inglorious,” as the lexicon has it. His mother explains it herself, and her verb says more than the King James “departed”: *gālâ* is the word for going into exile, and the lexicon glosses her words “glory is gone into exile from Israel.” The same verb is “the captivity” of [[Judg. 18:30]], where the note takes up the connection.

      The glory is the LORD’s own. In Exodus “the glory of the LORD filled the tabernacle” ([[Ex. 40:34]]), and the LORD promised, “I will appear in the cloud upon the mercy seat” ([[Lev. 16:2]]), the covering of the ark. Psalm 78 tells the same day with the same word: God “delivered … his glory into the enemy’s hand” ([[Ps. 78:61]]).

      She names two losses in verse 21, the ark and the men of her family, and repeats only one in verse 22: “for the ark of God is taken.” Her last words, like the news that killed Eli, end with the ark.
    sources: [lds-scriptures, bdb, bd-ark-of-the-covenant]

christ: |
  The LORD of hosts “which dwelleth between the cherubims” (verse 4) is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). The ark represented His presence, yet Israel had it in the camp and lost, because the Lord was not with them. Chapter 7 gives the way back, “return unto the LORD with all your hearts,” and the promise that comes with it, “he will deliver you out of the hand of the Philistines” ([[1 Sam. 7:3]]).

  The same holds for a disciple now: to receive the Lord’s help, a person places faith in Him and keeps His commandments. Possessing a sacred thing, as Israel possessed the ark, does not by itself protect anyone.

explore: |
  - [[1 Sam. 5–6]]: the ark among the Philistines, and its return.
  - [[1 Sam. 7:2–12]]: twenty years later Israel returns to the LORD, wins where it lost, and the stone is named Eben-ezer.
  - [[Ps. 78:56–64]]: the day remembered as the LORD forsaking Shiloh.
  - [[Jer. 7:12–14]]: Shiloh held up as a warning to those who trusted the temple.
  - [[Num. 10:35–36]]: the prayers when the ark set out and when it rested.

