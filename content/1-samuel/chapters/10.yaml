chapter: 10
title: Is Saul Also Among the Prophets?
tagline: Samuel anoints Saul in secret, three signs and the Spirit of God confirm the call on his way home, and at Mizpeh the lot finds him hiding among the baggage.
when: 'The morning after Saul came to Samuel, and the assembly at Mizpeh that followed'

setting: |
  Chapter 9 brought Saul, a young man of Benjamin out looking for his father's lost asses, to Samuel, and the LORD had told the seer the day before that this was the man to “anoint him to be captain over my people Israel” ([[1 Sam. 9:16]]). At dawn Samuel sent Saul's servant on ahead so that he could give Saul “the word of God” alone ([[1 Sam. 9:27]]). Chapter 10 begins at that moment.

  It tells how Saul became king in two steps. Samuel anointed him privately, the Spirit of the Lord came upon him, and only later was he proclaimed king before the people. The private part of the story ends at Gibeah, Saul's home town, where the Philistines kept a military post to hold the Israelites down. The public part takes place at Mizpeh, where Samuel had once prayed for Israel and the Philistines had been beaten ([[1 Sam. 7:5]]). Why the people's request for a king was a fault is explained at [[1 Sam. 8:5]] and [[1 Sam. 8:7]]; this chapter carries out the LORD's command to Samuel, “make them a king” ([[1 Sam. 8:22]]). Chapter 11 carries the story on to Saul's first victory, at Jabesh-gilead.

thread: |
  The chapter keeps asking who made Saul king, and from its first verse the answer is the LORD: “the LORD hath anointed thee.” What follows confirms it. Three signs on the road home were to assure Saul that what Samuel had told him would come true and that God would be with him in what he undertook (verses 2–7). The third sign changed him: the Spirit of God came upon him, he prophesied, and God gave him another heart (verses 6, 9–10). Then at Mizpeh the lot picked him out of all the tribes, and Samuel presented him to the nation as “him whom the LORD hath chosen” (verses 20–24).

  The gift comes with a warning. Before the lot is cast, Samuel speaks for the God who brought Israel out of Egypt and tells the people that in asking for a king they have “this day rejected your God” (verse 19). And the chapter ends with the nation already divided over the new king: a band of men “whose hearts God had touched” goes home with Saul, while others ask, “How shall this man save us?” (verses 26–27).

sections:
  - range: 1-8
    heading: Samuel anoints Saul and gives him three signs
    plain: |
      Samuel took a flask of oil, poured it on Saul's head, kissed him, and said, “Surely the Lord has anointed you to be leader over His own people. When you leave me today, you will find two men by Rachel's tomb at Zelzah, on the border of Benjamin. They will tell you, ‘The donkeys you went looking for have been found. Your father has stopped thinking about the donkeys and is worried about you. He keeps saying, “What shall I do about my son?”’ Go on from there to the plain of Tabor. Three men going up to worship God at Bethel will meet you there, one carrying three young goats, one three loaves of bread, and one a bottle of wine. They will greet you and give you two loaves, and you are to accept them. After that you will come to the hill of God, where the Philistines have a garrison. As you come into the town you will meet a band of prophets coming down from the high place, with psaltery, tambourine, flute and harp playing before them, and they will be prophesying. The Spirit of the Lord will come on you, you will prophesy with them, and you will be turned into another man. When these signs have happened, do whatever the occasion calls for, because God is with you. Then go down ahead of me to Gilgal. I will come down to you there to offer burnt offerings and peace offerings. Wait seven days, until I come and show you what to do.”
  - range: 9-16
    heading: The signs come to pass
    plain: |
      As Saul turned to leave Samuel, God changed his heart, and all those signs happened that same day. When Saul and his servant came to the hill, a band of prophets met him; the Spirit of God came on him, and he prophesied among them. Everyone who had known him before saw him prophesying with the prophets and said to each other, “What has happened to the son of Kish? Is Saul one of the prophets too?” A man who lived there answered, “And who is their father?” So it became a saying: “Is Saul also among the prophets?” When he had finished prophesying, he went up to the high place. Saul's uncle asked him and his servant, “Where did you go?” “To look for the donkeys,” Saul said. “When we saw they were nowhere to be found, we went to Samuel.” “Tell me what Samuel said to you,” his uncle said. Saul answered, “He told us plainly that the donkeys had been found.” But he did not tell him what Samuel had said about the kingship.
  - range: 17-27
    heading: Saul chosen by lot at Mizpeh
    plain: |
      Samuel called the people together before the Lord at Mizpeh and said to the Israelites, “This is what the Lord, the God of Israel, says: ‘I brought Israel up out of Egypt, and I rescued you from the Egyptians and from all the kingdoms that oppressed you.’ But today you have rejected your God, who Himself saved you from all your troubles and distresses. You have said to Him, ‘No, set a king over us.’ So now present yourselves before the Lord by your tribes and your clans.” Samuel had all the tribes of Israel come forward, and the lot took the tribe of Benjamin. He had Benjamin come forward by families, and the lot took the family of Matri, and at last Saul son of Kish. But when they looked for him, he could not be found. So they asked the Lord again, “Has anyone else come here?” The Lord answered, “He is hiding among the baggage.” They ran and brought him out, and when he stood among the people he was a head taller than any of them. Samuel said to all the people, “Do you see the man the Lord has chosen? There is no one like him among all the people.” And all the people shouted, “God save the king!” Samuel explained to the people the rights and duties of the kingship, wrote them in a book, and laid it up before the Lord. Then he sent everyone home. Saul also went home to Gibeah, and with him went a band of men whose hearts God had touched. But some worthless men said, “How can this fellow save us?” They despised him and brought him no gifts. But Saul ignored them.

notes:
  - ref: 1
    phrase: poured it upon his head, and kissed him
    kind: history
    title: Oil and a kiss
    body: |
      Samuel's oil made Saul the first king in Israel to be set apart by anointing, and the anointing marked the call as God's. Until then Israel had anointed only its priests and its sanctuary. On the older reading the Student Manual reprints, anointing a king made the monarchy itself a divine institution, a channel through which the Lord would give His people the gifts of His Spirit. From Saul on “the anointing became the sign that the call was divine.” Here what the oil signified followed the same day: the Spirit of God came upon Saul at the hill of God (verses 6, 10). What the oil itself meant is taken up at David's anointing, [[1 Sam. 16:13]]; the anointing also made the king's person sacred, which is why David will not raise his hand against “the LORD’s anointed” ([[1 Sam. 24:6]]).

      The text does not say what the kiss meant, and the older commentaries differ. One reads it as homage to the new king, comparing the psalm of the LORD's anointed, where the rulers of the earth are told to “Kiss the Son” ([[Ps. 2:12]]); another reads it as a kiss of affection, sealing the grace God had shown him.
    sources: [ot-manual-1-samuel-1, wilson-holy-spirit, cambridge-1-samuel, keil-1-samuel]
  - ref: 1
    phrase: to be captain over his inheritance
    kind: words
    title: Captain over the LORD’s inheritance
    body: |
      Samuel does not call Saul king. The word is *nāgîd*, “leader,” literally probably “one in front”: a ruler or prince. It is the word the LORD had used when He told Samuel to anoint this man ([[1 Sam. 9:16]]). The people would soon shout for a king (verse 24), but the title Samuel gave “should have served as a reminder that the Lord was still king.” The people Saul would lead were “his inheritance,” the LORD's own.

      The Septuagint, the ancient Greek translation, has more here: “Has not the Lord anointed thee for a ruler over his people, over Israel? and thou shalt rule among the people of the Lord, and thou shalt save them out of the hand of their enemies; and this shall be the sign to thee that the Lord has anointed thee for a ruler over his inheritance.” In the longer text Samuel announces the sign before he gives it; in the Hebrew, which the King James follows, he goes straight from the anointing to the signs.
    sources: [bdb, ot-manual-1-samuel-1, lxx-rahlfs]
  - ref: 5
    phrase: a company of prophets coming down from the high place
    kind: history
    title: A company of prophets
    body: |
      The band of prophets Saul met is the first such group the Bible mentions, and Samuel led it. Moses had wished “that all the LORD’s people were prophets” ([[Num. 11:29]]), and seventy elders had once prophesied in the wilderness, but until Samuel's day there was no community of prophets. Chapter 19 shows Samuel “standing as appointed over them” ([[1 Sam. 19:20]]).

      On one older reading, their prophesying was not foretelling but inspired praise, the expression of religious feeling under the Spirit's influence in hymns and the like; Chronicles uses the word of the temple musicians who “should prophesy with harps” ([[1 Chr. 25:1]]). That is why the band came down with music: the psaltery and harp were stringed instruments, the tabret a tambourine or hand drum, the pipe a kind of flute. Elisha later asked for a minstrel, and as he played, “the hand of the LORD came upon him” ([[2 Kgs. 3:15]]).
    sources: [ot-minute-1-samuel-9-10, cambridge-1-samuel]
  - ref: 9
    phrase: God gave him another heart
    kind: prophets
    title: Another heart
    body: |
      The “another heart” God gave Saul was a real change, and it came with his calling. Samuel had promised as much: “thou … shalt be turned into another man” ([[1 Sam. 10:6]]). President Spencer W. Kimball saw in it what a setting apart does: “The setting apart turned him into another man and gave him another heart. New powers came to him at once.” Those who knew Saul, he said, were astonished at his new spirituality, wisdom and maturity, and he added that anyone who has watched a person newly set apart to high responsibility has seen the same thing.

      The rest of his story shows that the change was real and also that it did not settle his course. In his early years Saul was humble and exemplary, and the Lord “gave him the spirit of prophecy and a new heart.” By the time of his offering at Gilgal his heart “was not in line with the Lord’s will as it had once been,” and the LORD sought instead “a man after his own heart” ([[1 Sam. 13:14]]).
    sources: [ot-seminary-lesson-84, ellsworth-tragic-saul, scripture-helps-1-samuel-8]
  - ref: 12
    phrase: But who is their father?
    kind: history
    title: Who is their father?
    body: |
      The neighbor's question, on the older reading of it, means that no one is a prophet by birth: the gift comes from God, so God could give it to the son of Kish. The people who knew Saul were surprised (“What is this that is come unto the son of Kish?” verse 11), as if his life until then had been nothing like that of the prophets' disciples. One man answered with a question of his own, read not as asking who led the band but whether the other prophets had prophets for fathers. They had the gift not by inheritance but as the Lord's free gift, so the same Lord could give it to Saul. Amos would say the same of himself: “I was no prophet, neither was I a prophet’s son” ([[Amos 7:14]]).

      The saying stuck. “Is Saul also among the prophets?” became a proverb, on the same reading, for anyone who turns up all at once in a sphere of life that had been altogether strange to him.
    sources: [keil-1-samuel, cambridge-1-samuel]
  - ref: 20
    phrase: the tribe of Benjamin was taken
    kind: history
    title: Chosen by lot
    body: |
      “Taken” is the lot's word: the tribe, the family and at last the man were picked out by the LORD. The procedure is the one in Joshua, where “the tribe which the LORD taketh” came forward by families, then households, then man by man ([[Josh. 7:14]]). Samuel treats the result as the LORD's choice: “See ye him whom the LORD hath chosen” (verse 24).

      Why cast a lot for a man already anointed? On one older reading, Samuel had anointed Saul in secret, by God's command, and now the people also had to recognize the man God had chosen; the lot let the whole nation see that the LORD had appointed Saul, and gave Saul himself fuller assurance of his calling.
    sources: [keil-1-samuel, lds-scriptures]
  - ref: 22
    phrase: he hath hid himself among the stuff
    kind: history
    title: Hidden among the baggage
    body: |
      “The stuff” was the baggage of the crowd that had come to Mizpeh, and the text does not say why Saul hid in it. One older reading holds that he hid out of humility and modesty: he could not have hoped to escape the lot by hiding, or to turn the kingdom down, since Samuel had already anointed him.

      When he could not be found, the people “inquired of the LORD,” the phrase used for asking God's will through the Urim and Thummim of the high priest's ephod (explained at [[1 Sam. 23:9]]); the text does not say who put the question here. The answer found him, and when he stood up he was a head taller than anyone there (verse 23).
    sources: [keil-1-samuel, cambridge-1-samuel]
  - ref: 25
    phrase: the manner of the kingdom, and wrote it in a book
    kind: history
    title: A charter laid up before the LORD
    body: |
      What Samuel wrote was, on the older commentaries' reading, a charter for the kingship, not a list of a king's demands. The phrase sounds like “the manner of the king” in [[1 Sam. 8:11]], but the words differ. That passage described what a despotic king would take from the people; this one, on that reading, set out the duties and rights of the human king toward the LORD, the divine King, on one side, and toward the nation on the other, and in substance probably resembled the law of the king in [[Deut. 17:14–20]]. “Before the LORD” points to the sanctuary, possibly with the book of the law beside the ark ([[Deut. 31:26]]).

      The book itself is lost. It is one of the writings the Bible names but does not contain, which Elder Bruce R. McConkie listed as “A Book of Statutes (1 Sam. 10:25).” The Bible Dictionary counts Samuel's writings among the records the unnamed writer of these books drew on (see [[1 Sam. 1:1]]).
    sources: [keil-1-samuel, cambridge-1-samuel, ot-manual-1-samuel-1, bd-samuel-books]
  - ref: 27
    phrase: brought him no presents. But he held his peace
    kind: history
    title: No presents
    body: |
      The men who brought Saul no gift were refusing him as king, and Saul let it pass. On the older reading, everyone who came before a king was expected to bring a present, so to withhold it was close to rebellion, a deliberate and contemptuous rejection of his authority. “Children of Belial” means worthless men (see [[1 Sam. 2:12]]).

      The men return in the next chapter. After the victory at Jabesh-gilead the people ask, “Who is he that said, Shall Saul reign over us? bring the men, that we may put them to death,” and Saul refuses: “to day the LORD hath wrought salvation in Israel” ([[1 Sam. 11:12–13]]). One of the Dead Sea Scrolls of Samuel has an extra verse at the end of this chapter, about Nahash king of the Ammonites; it is explained at [[1 Sam. 11:2]].
    sources: [keil-1-samuel, cambridge-1-samuel, lds-scriptures, sc-knowhy-855]

christ: |
  Samuel anointed Saul as the first ruler of Israel, and David would call him “the LORD’s anointed” ([[1 Sam. 24:6]]); “messiah” means “anointed one.” Prophets, priests and kings were anointed “in symbolic reference to the Great Prophet, Priest, and King, Jesus Christ,” the Anointed One. Saul's anointing was followed by the Spirit of God coming upon him, and Peter tells “how God anointed Jesus of Nazareth with the Holy Ghost and with power” ([[Acts 10:38]]).

  The Spirit that came on Saul came with a calling, and a calling from the Lord still brings real help with it (verse 9). Saul's later course shows that the one who receives it can still turn from the Lord's will: by Gilgal his heart was no longer in line with it as it had once been.

explore: |
  - **The Spirit on Saul, and its leaving.** [[1 Sam. 11:6]], [[1 Sam. 16:13–14]], [[1 Sam. 19:23–24]].
  - **Seven days at Gilgal.** [[1 Sam. 10:8]] beside [[1 Sam. 13:8–14]].
  - **The law of the king.** [[Deut. 17:14–20]] beside verse 25 here and [[1 Sam. 8:11–18]].
  - **Kings in the Book of Mormon.** [[Mosiah 29:13–18]], on when a king can be a blessing to a people.

