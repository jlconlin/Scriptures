chapter: 19
title: David Fled, and Escaped
tagline: Saul orders David killed; Jonathan pleads for him and wins an oath, but the javelin flies again; Michal lets David down through a window, and at Naioth the Spirit of God stops Saul's messengers and Saul himself.
when: 'While David fled from Saul'

setting: |
  Chapter 18 ended with Saul afraid of David and “David’s enemy continually” ([[1 Sam. 18:29]]). There he had thrown his javelin at David once ([[1 Sam. 18:11]]) and then schemed: a daughter offered as a snare, a bride-price to be paid in Philistine lives. Chapter 19 opens with the order given openly, to Jonathan and to all his servants, that David is to be killed.

  The chapter moves in three steps. Jonathan talks his father round and Saul swears an oath, but after another victory over the Philistines the jealousy returns and Saul tries again, more than once. David leaves the court for good: out of a window of his own house, and then to Samuel at Ramah, the old prophet who had anointed him and who has not appeared in the story since he went home to Ramah ([[1 Sam. 16:13]]).

  Chapter 20 picks up straight from here. David leaves the prophet, finds Jonathan, and asks him, “what is my sin before thy father, that he seeketh my life?” ([[1 Sam. 20:1]]); the two then renew the covenant of friendship, as the next chapter tells.

thread: |
  Saul moves against David again and again in this chapter, and each time something stands between them. First it is Jonathan, the son and heir, who reasons with his father until Saul swears by the LORD that David will not die. Then it is David's own quickness, slipping aside from the javelin. Then it is Michal, the daughter Saul had meant as a snare, who lets her husband down through a window and puts an image in his bed. Last, at Naioth, it is the Spirit of God, which takes hold of three bands of messengers and then of the king himself. Saul's own children side with David, and Jonathan says plainly that their father's hatred has no cause.

  What Saul cannot see, the chapter makes plain. There was no fault in David; Saul was struggling against the decision of God, and David was its face. At Naioth that is shown to him in the most public way possible: on the older reading of the scene, he was to learn that in fighting David he was fighting God. The king who came to arrest the LORD's anointed ends the day stripped and prostrate before the LORD's prophet.

sections:
  - range: 1-7
    heading: Jonathan pleads for David
    plain: |
      Saul told his son Jonathan and all his officials to kill David. But Jonathan, Saul's son, was very fond of David, and he warned him: “My father Saul is trying to kill you. Be on your guard until morning; go into hiding and stay there. I will go out and stand beside my father in the field where you are. I will speak to him about you, and I will tell you whatever I find out.” Jonathan spoke well of David to his father. “The king should not sin against his servant David,” he said. “He has not wronged you, and what he has done has been of great benefit to you. He took his life in his hands when he killed the Philistine, and the Lord won a great victory for all Israel. You saw it and you were glad. Why then would you sin by shedding innocent blood, killing David for no reason?” Saul listened to Jonathan and swore, “As surely as the Lord lives, he shall not be put to death.” So Jonathan called David and told him everything. He brought him to Saul, and David served him as before.
  - range: 8-10
    heading: The javelin again
    plain: |
      War broke out again, and David went out and fought the Philistines. He struck them down in a great defeat, and they fled before him. Then an evil spirit from the Lord (in the Joseph Smith Translation, one “not of the Lord”) came on Saul as he sat in his house with his spear in his hand, while David was playing the harp. Saul tried to pin David to the wall with the spear, but David slipped out of his way, and the spear stuck in the wall. That night David fled and got away.
  - range: 11-17
    heading: Michal and the image
    plain: |
      Saul sent men to David's house to watch it and kill him in the morning. But Michal, David's wife, warned him: “If you don't run for your life tonight, tomorrow you'll be dead.” So Michal let David down through a window, and he ran and escaped. Then she took the household image, laid it in the bed, put a covering of goats' hair at its head, and covered it with a garment. When Saul sent men to seize David, she said, “He is sick.” Saul sent them back to see David for themselves. “Bring him up to me in his bed,” he said, “so that I can kill him.” When the men went in, there was the image in the bed, with the goats' hair at its head. Saul said to Michal, “Why did you deceive me like this and let my enemy go, so that he has escaped?” Michal answered, “He told me, ‘Let me go. Why should I kill you?’”
  - range: 18-24
    heading: Saul among the prophets at Naioth
    plain: |
      So David fled and escaped. He went to Samuel at Ramah and told him all that Saul had done to him, and he and Samuel went and stayed at Naioth. Word came to Saul: “David is at Naioth in Ramah.” Saul sent men to seize him. But when they saw the company of prophets prophesying, with Samuel standing at their head, the Spirit of God came on Saul's men, and they too prophesied. When Saul was told, he sent more men, and they prophesied too. He sent men a third time, and they also prophesied. At last he went to Ramah himself. He came to the great well at Sechu and asked, “Where are Samuel and David?” “At Naioth in Ramah,” someone told him. So he went toward Naioth in Ramah, and the Spirit of God came on him too, and he walked along prophesying until he reached Naioth. He too stripped off his clothes and prophesied before Samuel, and he lay there naked all that day and all that night. That is why people say, “Is Saul also among the prophets?”

notes:
  - ref: 4
    phrase: Let not the king sin against his servant, against David
    kind: history
    title: Jonathan speaks good of David
    body: |
      Jonathan argues for David's life as a question of the king's sin, not only of David's danger. His case has three parts. David has done the king no wrong (“he hath not sinned against thee”). He has done him nothing but good: he risked his life against Goliath, and the victory was the LORD's, “a great salvation for all Israel,” which Saul saw and rejoiced in (verse 5). So to kill him would be to “sin against innocent blood,” to “slay David without a cause.” The sin Jonathan names is his father's, not David's.

      It worked, for a while. Jonathan warned his friend and spoke to his father of David's virtues until Saul relented and swore, “As the LORD liveth, he shall not be slain” (verse 6), and David was back at court “as in times past.” The oath did not survive the next war. When David came home victorious again, the jealousy returned, and the very next scene has Saul's javelin in the wall (verses 8–10).
    sources: [holland-real-friendship, ot-seminary-lesson-88]

  - ref: 11
    phrase: Michal David’s wife told him
    kind: history
    title: Michal saves her husband
    body: |
      The daughter Saul gave David as a snare ([[1 Sam. 18:21]]) is the one who saves him. Saul had hoped to use Michal to get David killed by the Philistines; instead, when his men watched the house to kill David in the morning, she warned her husband, let him down through a window, and bought him time with the image in his bed. When her father confronted her, she told him David had threatened her life (verse 17). Her later story is followed in the note on [[1 Sam. 18:20]].

      The night has its own psalm. The title of Psalm 59 sets that psalm on the night Saul's men watched the house to kill him ([[Ps. 59:0]]), and the psalm opens, “Deliver me from mine enemies, O my God” ([[Ps. 59:1]]); the note on the title there tells the scene.
    sources: [ellsworth-tragic-saul, lds-scriptures]

  - ref: 13
    phrase: Michal took an image, and laid it in the bed
    kind: history
    title: The image in the bed
    body: |
      The “image” is *teraphim*, the household figures explained in the note on [[1 Sam. 15:23]]. Rachel's had been small enough to hide under a camel's saddle ([[Gen. 31:34]]; the note at [[Gen. 31:19]] explains them); this one was the size and shape of a man, which is why it could pass for David under the bedclothes. Teraphim also stood with an ephod in the shrine in Micah's house ([[Judg. 17:5]]). Such figures probably belonged less to the worship of other gods than to a corrupt way of worshiping the true one, and the prophets condemned them: Samuel had set them beside stubbornness ([[1 Sam. 15:23]], where “idolatry” is *teraphim*), and Josiah would put them away ([[2 Kgs. 23:24]]). The text does not say why there was one in David's house, or whose it was.

      The “pillow of goats' hair” was probably a netted quilt or fly-net of goats' hair, of the kind spread over a sleeper's face. Laid at the head of the figure, it would have looked like a sleeper's covered face. The ruse needed only to buy time: Michal's “He is sick” (verse 14) held off the first messengers, and the image was found only when Saul sent them back with orders to bring David bed and all.
    sources: [bdb, bd-teraphim, lds-scriptures]

  - ref: 18
    phrase: came to Samuel to Ramah, and told him all that Saul had done to him
    kind: history
    title: David goes to the prophet
    body: |
      With the court closed to him, David went to Samuel for counsel, the prophet who had anointed him. Then the two went to Naioth. The name is probably that of a place in Ramah, perhaps meaning “dwellings” (the sense is doubtful), and it was where the prophets lived. On one older reading it was the common house of the company of prophets that gathered round Samuel at Ramah, while Samuel kept his own house in the town ([[1 Sam. 7:17]]). The company itself, which Saul had met at Gibeah when he was first anointed, is explained at [[1 Sam. 10:5]]; here verse 20 shows Samuel “standing as appointed over them.”
    sources: [ellsworth-tragic-saul, bdb, keil-1-samuel]

  - ref: 20
    phrase: the Spirit of God was upon the messengers of Saul, and they also prophesied
    kind: history
    title: The Spirit on Saul’s messengers
    body: |
      What saved David at Naioth was not a wall or an army but the Spirit of God. Saul's men came to arrest him and found the prophets prophesying; the Spirit came on them, and instead of seizing David they joined in. It was “a spiritual phenomenon,” and their prophesying, on that reading, was “a religious exercise of singing or chanting praises to God.” It happened three times, to three bands of men, and then to the king who sent them; because of the Lord's influence, Saul could not take David.

      The same Spirit had come on Saul the day he was anointed ([[1 Sam. 10:10]]). The scene has a still older pattern. When the LORD put His spirit on the seventy elders in the wilderness, “when the spirit rested upon them, they prophesied” ([[Num. 11:25]]), and Saul's servants had “a similar experience”: whoever the Spirit endows “is empowered to work for God,” here even men sent to take God's anointed.
    sources: [ot-seminary-lesson-88, wilson-holy-spirit, lds-scriptures]

  - ref: 24
    phrase: lay down naked all that day and all that night
    kind: words
    title: Stripped before Samuel
    body: |
      “Naked” here probably means stripped of the outer garment, not unclothed; the Hebrew word is used that way of Isaiah's sign ([[Isa. 20:2]], where the note explains the custom). What sets Saul apart from his messengers is the degree. The Spirit took hold of him on the road, before he ever reached the prophets (verse 23), and only of him does the text say that he lay before Samuel all that day and all that night. On one older reading, this was the lesson of Naioth: Saul had striven against the Spirit, and he was struck down more completely than the men he sent, so that he might learn the might of what he was fighting, and, if his hard heart could still be broken, turn.

      The proverb at the end is not new. “Is Saul also among the prophets?” began the day Saul first prophesied at Gibeah ([[1 Sam. 10:11–12]], where its meaning is explained). “Wherefore they say” means that the saying found a second occasion here. The second burst of the Spirit was a reminder of the first: then it came to fit Saul for the office, and now it came on the king who had failed in it, while he hunted the man the LORD had chosen.
    sources: [keil-1-samuel, cambridge-1-samuel, lds-scriptures]

christ: |
  Jonathan gives the victory over Goliath its true name: “the LORD wrought a great salvation for all Israel” (verse 5). That LORD is Jehovah, the premortal Jesus Christ ([[Ex. 3:14]]), and at Naioth it is the Spirit of God that keeps Saul's hand off the LORD's anointed. The psalm set on the night at David's house calls Him “my defence and refuge in the day of my trouble” ([[Ps. 59:16]]).

  The same Spirit has turned back men sent against the Lord's servants since: in Great Britain the constable sent to arrest Wilford Woodruff for preaching heard him out and asked to be baptized. The refuge David found is the refuge open to a disciple in danger for the Lord's sake.

explore: |
  - **The Spirit on Saul, then and now.** [[1 Sam. 10:5–13]], the first time Saul prophesied; [[1 Sam. 16:13–14]], the Spirit given to David and gone from Saul.
  - **What happens next.** [[1 Sam. 20:1–42]], David and Jonathan's covenant; [[1 Sam. 21:1–9]], David at Nob.

