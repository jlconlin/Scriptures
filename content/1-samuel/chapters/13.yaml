chapter: 13
title: Thou Hast Done Foolishly
tagline: Jonathan's raid brings the Philistines out in force; Saul's army hides and scatters, he offers the burnt offering himself at the end of the seven days, and Samuel tells him his kingdom will not continue, while Israel has no smith and almost no swords.
when: 'Early in Saul’s reign, “when he had reigned two years,” at Gilgal and Michmash'

setting: |
  Chapter 12 left Saul confirmed as king at Gilgal, with Samuel's warning that the people and their king alike must obey the voice of the LORD ([[1 Sam. 12:14–15]]). Chapter 13 opens the history of his reign with its first great trouble. The Philistines already kept a garrison in the hill country of Benjamin ([[1 Sam. 10:5]]). Jonathan, Saul's son, leads an attack on Philistine soldiers stationed in Israelite territory, and Saul, knowing the attack means war, calls out more men.

  The story moves between two places. Gilgal is where Saul gathers the people and waits; it was where he had been made king ([[1 Sam. 11:15]]), and it is where he is now condemned. Geba and Michmash, where the armies face each other, stand on either side of a deep ravine whose sides are steep walls; the “passage of Michmash” at the end of the chapter (verse 23) is the scene of Jonathan's exploit in chapter 14.

  At the center are verses 8–14. Not long into his reign, Saul offered a burnt offering himself instead of waiting for Samuel to do it, and Samuel told him that his kingdom would not continue and that the LORD had sought a man after His own heart. His rejection as king follows a second disobedience, over Amalek, in chapter 15.

thread: |
  The chapter asks what a king does when the LORD's word means waiting. Everything around Saul pushes him to act. Jonathan's raid has made Israel “had in abomination with the Philistines” (verse 4), a vast army is camped at Michmash, and Saul's own men hide in caves and pits, cross the Jordan, and slip away from him at Gilgal (verses 6–8). Samuel's instruction had been to wait seven days, “till I come to thee, and shew thee what thou shalt do” ([[1 Sam. 10:8]]). Saul waits the seven days and then, with the army melting away, offers the sacrifice himself.

  The people had asked for a king to “fight our battles” ([[1 Sam. 8:20]]); now their king faces the Philistines, and his army is hiding. Samuel's verdict turns on two words he repeats: Saul has not “kept” what the LORD “commanded” (verses 13–14), and so the LORD has “sought him a man after his own heart.” The chapter then shows how little strength Saul had of his own: about six hundred men, raiders loose in the land, no smith anywhere in Israel, and only Saul and Jonathan with a sword or spear.

sections:
  - range: 1-7
    heading: Jonathan strikes, and the Philistines gather
    plain: |
      (On the numbers in verse 1, see the note.) Saul chose three thousand men of Israel. Two thousand were with him at Michmash and in the hill country of Bethel, and a thousand were with Jonathan at Gibeah of Benjamin; the rest of the people he sent home. Jonathan attacked the Philistine garrison at Geba, and the Philistines heard of it. Saul had the trumpet blown throughout the land, saying, “Let the Hebrews hear!” All Israel heard that Saul had struck a Philistine garrison and that Israel had become hateful to the Philistines, and the people were called out to join Saul at Gilgal. The Philistines gathered to fight Israel: thirty thousand chariots, six thousand horsemen, and soldiers as many as the sand on the seashore. They came up and camped at Michmash, east of Beth-aven. When the men of Israel saw they were in trouble, with the army hard pressed, the people hid in caves and thickets, among the rocks, in high places and in pits. Some of the Hebrews even crossed the Jordan into the land of Gad and Gilead. Saul stayed at Gilgal, and all the people with him followed him trembling.
  - range: 8-14
    heading: The offering at Gilgal
    plain: |
      He waited seven days, the time Samuel had set, but Samuel did not come to Gilgal, and the people were slipping away from Saul. So Saul said, “Bring me the burnt offering and the peace offerings,” and he offered the burnt offering. Just as he finished, Samuel arrived, and Saul went out to greet him. “What have you done?” Samuel asked. Saul answered, “I saw that the people were scattering from me, that you had not come within the days you set, and that the Philistines were gathering at Michmash. So I thought, ‘Now the Philistines will come down on me at Gilgal, and I have not sought the Lord's favor.’ So I forced myself, and offered the burnt offering.” “You have acted foolishly,” Samuel said to Saul. “You have not kept the commandment the Lord your God gave you. If you had, the Lord would now have established your kingdom over Israel forever. But now your kingdom will not last. The Lord has sought out a man after His own heart and appointed him leader over His people, because you have not kept what the Lord commanded you.”
  - range: 15-18
    heading: Six hundred men, and the raiders
    plain: |
      Then Samuel left Gilgal and went up to Gibeah of Benjamin. Saul counted the people who were still with him: about six hundred men. Saul, his son Jonathan, and the people with them stayed in Gibeah of Benjamin, while the Philistines camped at Michmash. Raiders came out of the Philistine camp in three companies. One turned toward Ophrah, in the land of Shual; another turned toward Beth-horon; and the third turned toward the border that overlooks the valley of Zeboim, toward the wilderness.
  - range: 19-23
    heading: No smith in Israel
    plain: |
      No blacksmith could be found anywhere in the land of Israel, because the Philistines had said, “Otherwise the Hebrews will make themselves swords or spears.” So all the Israelites had to go down to the Philistines to sharpen their plowshares, coulters, axes and mattocks. They paid a pim (the King James “a file”; see the note) for the mattocks, the coulters, the forks and the axes, and to set the goads. So on the day of battle not one of the people with Saul and Jonathan had a sword or spear in hand; only Saul and his son Jonathan had them. And a Philistine outpost went out to the pass of Michmash.

notes:
  - ref: 1
    phrase: Saul reigned one year
    kind: words
    title: How old was Saul?
    body: |
      The verse is meant to give Saul's age when he became king and the length of his reign, and the Hebrew has lost part of both numbers. Taken word for word, it says Saul “was one year old when he became king, and he reigned two years over Israel.”

      Translations handle the gap in different ways. The King James makes the first number the length of the reign so far. One modern translation prints the gaps as they are: “Saul was . . . years old when he began to reign, and he reigned . . . and two years over Israel.” Another fills them, taking Saul's age, thirty, from a few late manuscripts of the Septuagint, and adding “forty” to the Hebrew's “two years” from Paul's sermon at Antioch, which gives Saul “the space of forty years” ([[Acts 13:21]]). The King James text stands on the page; what the original numbers were is not known.
    sources: [oshb-wlc, esv, nrsvue, niv, lds-scriptures]

  - ref: 3
    phrase: Let the Hebrews hear
    kind: words
    title: Why “Hebrews”?
    body: |
      “Hebrews” was generally the name others used for Israel, which makes it a puzzling word in the mouth of Israel's own king. In one older reading the name “is generally employed only by foreigners, or in speaking to foreigners,” and in this book the Philistines use it that way ([[1 Sam. 4:6]]; [[1 Sam. 14:11]]). If the text is sound, Saul uses it to set his nation over against the Philistines, or the narrator describes Israel from the Philistine point of view, as a subject people. The Philistines use the name again in verse 19: “Lest the Hebrews make them swords or spears.”

      The Septuagint has a different cry. In one English translation of it, Saul sounds the trumpet “saying, The servants have despised us”; the same older reading renders it “The slaves have revolted.” The consonants of the Hebrew words for “slaves” and “Hebrews” are almost the same and easily confused, and on that ground the older reading conjectures that the words were first the Philistines' own report of the revolt. Which reading is original is uncertain.
    sources: [cambridge-1-samuel, lxx-rahlfs, lds-scriptures]

  - ref: 5
    phrase: thirty thousand chariots
    kind: words
    title: Thirty thousand chariots?
    body: |
      The King James gives the Philistines “thirty thousand chariots” beside only six thousand horsemen, and “most scholars agree that the figure of 30,000 Philistine chariots is inaccurate.” Some translations print 3,000 instead, and errors of this kind entered the Bible through mistakes in translation and perhaps through later scribes' exaggeration.

      The witnesses are divided. The Hebrew reads thirty thousand, as do an English translation of the Septuagint and several modern versions. One modern translation prints “three thousand chariots,” following some manuscripts of the Septuagint and the Syriac. The King James text stands on the page; the reading behind it is the one most scholars doubt.
    sources: [scripture-helps-1-samuel-8, lxx-rahlfs, niv, esv, nrsvue]

  - ref: 8
    phrase: according to the set time that Samuel had appointed
    kind: history
    title: Seven days at Gilgal
    body: |
      Saul was keeping an appointment Samuel had made on the day he anointed Saul: “seven days shalt thou tarry, till I come to thee, and shew thee what thou shalt do” ([[1 Sam. 10:8]]). Samuel would offer the sacrifices. A sacrifice before battle was a way to seek the Lord's blessings on the army, and it would help the soldiers dedicate themselves to the Lord and strengthen their faith.

      The narrator is careful with the timing. Saul waited seven days “according to the set time,” and Samuel arrived “as soon as he had made an end of offering the burnt offering” (verse 10). Saul's own account is that Samuel came “not within the days appointed” (verse 11). The pressure on him was real: of the three thousand men he had chosen (verse 2), about six hundred were left when he counted them afterward (verse 15). The instruction of [[1 Sam. 10:8]] had two parts: seven days, and “till I come to thee, and shew thee what thou shalt do.”
    sources: [ot-seminary-lesson-85, lds-scriptures]

  - ref: 12
    phrase: I forced myself therefore
    kind: words
    title: Forcing himself to seek the LORD's favor
    body: |
      Saul's defense is that he made himself act, and for a pious reason. Behind “I have not made supplication unto the LORD” the Hebrew says that he had not entreated the face of the LORD, an expression for seeking His favor, used here of seeking it before a war; the Septuagint renders it “I have not sought the face of the Lord.” Saul's reasoning, then, was that he dared not go into battle without the LORD's favor, and that to gain it he forced himself to do the thing he had been told to wait for.

      One reading takes the motive less kindly: seeing his people leave, Saul “took it upon himself to offer the required sacrifices as a means to hold people to him,” and when Samuel came he answered “defensively” that the people were scattering and that he had “forced” himself.
    sources: [bdb, oshb-wlc, lxx-rahlfs, ellsworth-tragic-saul]

  - ref: 13
    phrase: Thou hast done foolishly
    kind: prophets
    title: Why the offering was wrong
    body: |
      Saul's offering was wrong in two ways: he had no priesthood authority to make it, and making it showed that his heart “was not in line with the Lord's will as it had once been.” Told to wait for Samuel, he grew impatient when the appointed day came without him, and made the offering himself. Saul's throne, crown and scepter “gave him no right to officiate even as a deacon in the Priesthood of God.” How Samuel, who was not a priest of Aaron's line, could offer sacrifice is explained at [[1 Sam. 7:9]].

      The second point goes deeper. The circumstances were critical, but mortality is meant to show whether a person stays faithful and obedient in every circumstance, and Saul failed that test. Samuel's charge names the commandment: “thou hast not kept the commandment of the LORD thy God.” Instead of waiting to hear through His prophet what the LORD wanted him to do, Saul tried to influence Him with a sacrifice. Chapter 15 brings the charge again ([[1 Sam. 15:22–23]]), for what was essentially the same sin of disobedience.
    sources: [scripture-helps-1-samuel-8, ot-manual-1-samuel-1, ot-minute-1-samuel-13]

  - ref: 13
    phrase: for now would the LORD have established thy kingdom upon Israel for ever
    kind: history
    title: What Saul lost at Gilgal
    body: |
      What Saul lost at Gilgal was a dynasty: “the honor of having the kingship continue through his posterity.” Samuel's two sentences are conditional, set against each other: “now” the LORD would have established the kingdom for ever, had Saul obeyed; “but now,” since he had not, it “shall not continue” (verse 14).

      One older reading takes care to say what the sentence did not yet mean. “Shall not continue” is set against the kingdom established “for ever,” so it speaks of the kingdom not passing to Saul's descendants, not of Saul losing the throne that day. His rejection as king comes after the second disobedience, in chapter 15, where Samuel says “he hath also rejected thee from being king” ([[1 Sam. 15:23]]). Even the announcement of the man after the LORD's own heart gives God's purpose without saying when it would be carried out.
    sources: [ot-seminary-lesson-85, keil-1-samuel]

  - ref: 14
    phrase: a man after his own heart
    kind: scripture
    title: A man after his own heart
    body: |
      The man after the LORD's own heart is David, as Paul says when he retells Israel's history at Antioch. Paul takes up this verse's words and names the man: “I have found David the son of Jesse, a man after mine own heart, which shall fulfil all my will” ([[Acts 13:22]]).

      The man is not yet named. He is anointed in chapter 16, where the LORD “looketh on the heart” (the note at [[1 Sam. 16:7]]); “captain,” the title given him here, is explained at [[1 Sam. 10:1]].
    sources: [lds-scriptures]

  - ref: 19
    phrase: there was no smith found throughout all the land of Israel
    kind: history
    title: No smith in Israel
    body: |
      The Philistines kept Israel unarmed by keeping the smiths. The Israelites at this time probably did not know how to work iron, and the Philistines guarded the craft carefully to keep their weapons superior. The verse gives their reason in their own words: “Lest the Hebrews make them swords or spears.” Even farm tools had to be taken down to the Philistines to be sharpened (verse 20), and on the day of battle only Saul and Jonathan had a sword or spear (verse 22).

      Not being able to make or maintain weapons left Israel at a military and technological disadvantage, though the LORD had asked His people to trust Him to fight for them as the Divine Warrior. The next chapter begins at the pass of Michmash (verse 23) with Jonathan, one of the only two men with Saul's army who had a sword or spear.
    sources: [ot-manual-1-samuel-1, ot-minute-1-samuel-13, lds-scriptures]

  - ref: 21
    phrase: a file
    kind: words
    title: Not a file but a price
    body: |
      The King James “a file” was a translator's guess, and the word has turned out to be a price. The Hebrew word, *pîm*, was unknown anywhere else in Semitic writing, so the early translators had to judge its meaning from context; the Geneva Bible, followed by the King James, made it a blacksmith's file for sharpening tools. Then archaeologists found inscribed ancient weights in various places in the land, and one of them bore the word *pîm*. Translators now take it as the amount the Philistine smiths charged for sharpening.

      Modern translations follow the discovery: “The charge was two-thirds of a shekel for the plowshares and for the mattocks and one-third of a shekel for sharpening the axes and for setting the goads.” The verse is not clear everywhere; the word just before *pîm* is called “dubious; probably incurably corrupt” in the standard lexicon. But its point is plain enough. Israel had to pay the Philistines to keep its farm tools sharp.
    sources: [strathearn-modern-translations, nrsvue, bdb]

christ: |
  Paul's sermon at Antioch moves from this chapter's “man after his own heart” straight to Jesus: “Of this man's seed hath God according to his promise raised unto Israel a Saviour, Jesus” ([[Acts 13:22–23]]).

  Under pressure from outside, Saul lacked the self-discipline to stay on course, trust the Lord and His prophet, and follow the pattern God had established. A small departure in such a moment makes a large difference over time. The promise Saul received at his anointing, “another heart” and “God is with thee” ([[1 Sam. 10:7–9]]), is extended to priesthood holders who hearken to the Lord: He will give them a new heart, make of them new men, and always be with them.

explore: |
  - **Saul's second disobedience.** [[1 Sam. 15:10–23]], where “to obey is better than sacrifice.”
  - **What happened at the pass of Michmash.** [[1 Sam. 14:1–15]].

