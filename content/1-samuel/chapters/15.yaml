chapter: 15
title: To Obey Is Better than Sacrifice
tagline: Saul is sent against Amalek, spares King Agag and the best of the flocks, and tells Samuel he has obeyed; Samuel answers that the LORD wants obedience more than offerings, and that the LORD has rejected Saul as king.
when: 'In the reign of Saul, from Telaim to Gilgal'

setting: |
  Saul has been rejected once already. When he offered the burnt offering at Gilgal without waiting for Samuel, Samuel told him, “now thy kingdom shall not continue: the LORD hath sought him a man after his own heart” ([[1 Sam. 13:14]]; [[1 Sam. 13:8–14]] tells of the offering). Chapter 14 closes with a summary of Saul's wars on every side, in which he “smote the Amalekites” ([[1 Sam. 14:48]]). Chapter 15 tells that war in full. After it, Samuel “came no more to see Saul until the day of his death” (verse 35).

  Amalek was a desert tribe that was at war with Israel from the time of Moses until Saul and David broke its power. The attack in the wilderness and the LORD's sentence on Amalek are told at [[Ex. 17:14]], and Moses' charge to remember them at [[Deut. 25:17–19]]; the notes there give the history, and this chapter does not repeat it.

  The scene also sets a pattern for Israel's kings: a prophet who brings the LORD's word to the king and calls him to account when he fails, as Nathan would with David ([[2 Sam. 12:7]]). In the next chapter the LORD sends Samuel to Bethlehem to anoint the king who will replace Saul ([[1 Sam. 16:1]]).

thread: |
  The chapter turns on one word, “voice.” Samuel opens with the charge, “hearken thou unto the voice of the words of the LORD” (verse 1). Saul twice claims he has done it: “I have performed the commandment of the LORD” (verse 13), “Yea, I have obeyed the voice of the LORD” (verse 20). Samuel answers with the sound of sheep and cattle that should not be alive (verse 14), and with the chapter's best-known line: the LORD delights more in “obeying the voice of the LORD” than in offerings (verse 22). Only then does Saul say whose voice he had actually followed: “I feared the people, and obeyed their voice” (verse 24). The Church's teachers read the chapter that way: Saul obeyed in part, chose what would please the people over what would please the Lord, and called it obedience.

  The rest follows from that. The king who rejected the word of the LORD is rejected as king (verses 23, 26); a torn garment becomes the sign that the kingdom is torn from him (verses 27–28); and the chapter ends where it began, in grief: the LORD's sorrow over Saul (verse 11), Samuel crying all night, and Samuel mourning for Saul to the end (verse 35). The Joseph Smith Translation changes both places where the King James has the LORD “repent.”

sections:
  - range: 1-3
    heading: The command against Amalek
    plain: |
      Samuel said to Saul, “The Lord sent me to anoint you king over His people Israel. So now listen to the words of the Lord. This is what the Lord of hosts says: I remember what Amalek did to Israel, how it lay in wait for them on the road when they came up out of Egypt. Now go and strike Amalek. Devote everything they have to destruction, and do not spare them: kill men and women, children and infants, cattle and sheep, camels and donkeys.”
  - range: 4-9
    heading: Saul spares the best
    plain: |
      Saul called up the army and counted them at Telaim: two hundred thousand foot soldiers, and ten thousand men of Judah. He came to a city of Amalek and set an ambush in the valley. He told the Kenites, “Go, leave the Amalekites, so that I do not destroy you with them, for you were kind to all the Israelites when they came up out of Egypt.” So the Kenites left. Saul struck the Amalekites from Havilah all the way to Shur, east of Egypt. He took Agag king of the Amalekites alive, and destroyed all the people with the sword. But Saul and the people spared Agag and the best of the sheep and cattle, the fattened animals and the lambs, everything that was good. They would not destroy it. Whatever was worthless and weak they destroyed.
  - range: 10-16
    heading: The LORD's grief, and Samuel comes to Saul
    plain: |
      Then the word of the Lord came to Samuel: “I am grieved that I made Saul king, for he has turned back from following Me and has not carried out My commands.” Samuel was grieved, and he cried out to the Lord all night. Early in the morning he went to meet Saul, and he was told, “Saul went to Carmel and set up a monument there for himself, and then he went on down to Gilgal.” When Samuel reached him, Saul said, “The Lord bless you! I have done what the Lord commanded.” Samuel said, “Then what is this bleating of sheep in my ears, and the lowing of cattle I hear?” Saul answered, “They brought them from the Amalekites. The people spared the best of the sheep and cattle to sacrifice to the Lord your God, and the rest we destroyed.” Samuel said, “Stop, and I will tell you what the Lord said to me last night.” “Tell me,” he said.
  - range: 17-23
    heading: To obey is better than sacrifice
    plain: |
      Samuel said, “Though you were small in your own eyes, did you not become head of the tribes of Israel? The Lord anointed you king over Israel. And the Lord sent you on a mission and said, Go and destroy those sinners, the Amalekites; fight them until they are wiped out. Why then did you not obey the Lord? Why did you swoop down on the plunder and do evil in the Lord's sight?” Saul said, “But I did obey the Lord. I went on the mission He sent me on. I brought back Agag king of Amalek and destroyed the Amalekites. The people took sheep and cattle from the plunder, the best of what was to be destroyed, to sacrifice to the Lord your God at Gilgal.” Samuel answered: “Does the Lord delight in burnt offerings and sacrifices as much as in obeying His voice? To obey is better than sacrifice, and to listen is better than the fat of rams. Rebellion is like the sin of divination, and stubbornness like wickedness and idolatry. Because you have rejected the word of the Lord, He has rejected you as king.”
  - range: 24-31
    heading: Saul's confession and the torn mantle
    plain: |
      Saul said to Samuel, “I have sinned. I broke the Lord's command and your words, because I was afraid of the people and did what they said. Now please forgive my sin and come back with me, so that I may worship the Lord.” Samuel said, “I will not go back with you. You have rejected the word of the Lord, and the Lord has rejected you as king over Israel.” As Samuel turned to leave, Saul caught hold of the hem of his robe, and it tore. Samuel said, “The Lord has torn the kingdom of Israel from you today and given it to a neighbor of yours who is better than you. And the Strength of Israel, the Lord, does not lie or change His mind, for He is not a man, that He should change His mind.” Saul said again, “I have sinned. But honor me now before the elders of my people and before Israel; come back with me, so that I may worship the Lord your God.” So Samuel went back with Saul, and Saul worshipped the Lord.
  - range: 32-35
    heading: Agag, and the parting
    plain: |
      Then Samuel said, “Bring me Agag king of the Amalekites.” Agag came to him cheerfully, thinking, “Surely the bitterness of death is past.” Samuel said, “As your sword has made women childless, so your mother will be childless among women.” And Samuel put Agag to death before the Lord at Gilgal. Then Samuel went to Ramah, and Saul went up to his house at Gibeah. Samuel did not go to see Saul again until the day he died, but Samuel mourned for Saul. And the Lord was grieved that He had made Saul king over Israel.

notes:
  - ref: 3
    phrase: utterly destroy all that they have
    kind: history
    title: Why Amalek, and why everything
    body: |
      The command is the hardest verse in the book, and the Church's own answer begins with what is not known. The text gives one reason, in verse 2: what Amalek did to Israel on the way from Egypt. That was an ambush on a people in the wilderness that killed many of the most vulnerable Israelites; the Amalekites were, in the seminary manual's words, “a murderous people and … enemies of the Lord.” The sentence on Amalek and the charge to remember it are explained at [[Ex. 17:14]] and [[Deut. 25:17–19]]. Beyond that, *Scripture Helps* says plainly: “We do not know all the reasons why God commanded Saul and his army to destroy all the Amalekites and their animals,” and it sets beside the command the God who takes no pleasure in the death of the wicked ([[Ezek. 33:11]]). The Church's broader teaching on violence in scripture adds two limits: there is much in such accounts “that we do not fully understand today,” and they “should never be used to justify violence in the present.”

      “Utterly destroy” is the Hebrew verb *heḥĕrîm*, whose sense is explained at [[Deut. 7:2]]. It runs through the whole chapter (verses 3, 8–9, 15, 18, 20–21), and the order explicitly takes in both people and livestock. One Latter-day Saint study of the word adds a reading of its own: ancient Near Eastern accounts of divinely commanded war spoke in absolute terms whatever happened on the ground, and the Amalekites themselves are still raiding and being fought in David's day ([[1 Sam. 27:8–9]]; [[1 Sam. 30:1]]). That is the study's reading of the language, not a claim that the command was not given. The chapter's own concern is narrower, and the next notes follow it: what Saul did with the command.
    sources: [lds-scriptures, scripture-helps-1-samuel-8, ot-seminary-lesson-85, topics-religion-violence, calabro-herem]

  - ref: 6
    phrase: for ye shewed kindness to all the children of Israel
    kind: history
    title: The Kenites
    body: |
      The Kenites were living among the Amalekites, and Saul warns them away because of an old friendship. They were probably a Midianite people, and the friendship went back to Moses, who married into the family of Jethro, the priest of Midian. The Church's footnote points to the book of Judges, where they went up with Judah into the land: “the children of the Kenite, Moses' father in law” ([[Judg. 1:16]]). The note on Balaam's oracle at [[Num. 24:21]] tells more of them.
    sources: [bd-kenites, lds-scriptures]

  - ref: 9
    phrase: would not utterly destroy them
    kind: history
    title: What Saul kept
    body: |
      Saul's disobedience lay less in what he failed to destroy than in what he chose to keep. He killed the people (verse 8), and destroyed what was “vile and refuse,” but he spared the king and the best animals. One Latter-day Saint study of the ban points out that there were not supposed to be captives at all: to keep an enemy king alive after the battle was, in effect, to keep a captive. Since the text makes nothing of the Amalekites who escaped, the same study concludes that “Saul's crucial error was not that he failed to kill the king and the livestock, but that he retained them, thus making his refusal to kill them blatant.”

      Why keep them? The text gives Saul's answer later, that the animals were for sacrifice (verses 15, 21), and the notes at verses 22 and 24 weigh it. Latter-day Saint writers see pride in it as well: Saul “proudly brought him back alive,” and wanted to display his royal captive and the best of the spoil.
    sources: [calabro-herem, ellsworth-tragic-saul, ot-minute-1-samuel-15, lds-scriptures]

  - ref: 11
    phrase: It repenteth me that I have set up Saul to be king
    kind: words
    title: Does the LORD repent?
    body: |
      The LORD's “repenting” is sorrow, not an admission that He had erred, and the Joseph Smith Translation removes it from the LORD altogether. The Church's footnote gives the Hebrew root's sense: it means “to sigh,” and so “to feel sorrow.” At verses 11 and 35 the verb has the sense of being sorry, rueing, suffering grief. *Scripture Helps* sends the reader to Genesis 6:6, where the same word “can indicate regret, sorrow, compassion, or ‘a decision to change a course of action,’” and where it notes that a different Hebrew word is used for remorse for sin.

      The Joseph Smith Translation moves the repenting from the LORD to Saul: “I have set up Saul to be a king, and he repenteth not that he hath sinned.” At verse 35 it reads “the Lord rent the kingdom from Saul whom he had made king over Israel.” One Latter-day Saint study of these changes explains why they matter: to repent can mean to change one's course, but it also implies that the earlier course was wrong. “The Lord had indeed changed his pattern, but his previous course had not been erroneous.” The same study adds that the change at verse 35 makes the account “historically correct”: what happened was that the kingdom was taken from Saul.

      The chapter supplies its own answer in verse 29, where the same word is used (see the note there). The grief is real. Samuel shares it, crying to the LORD all night.
    sources: [lds-scriptures, bdb, scripture-helps-1-samuel-8, scripture-helps-gen-6-11, nyman-jst-historical]

  - ref: 12
    phrase: he set him up a place
    kind: history
    title: A monument at Carmel
    body: |
      The “place” Saul set up at Carmel was a monument, and it was to himself. The Hebrew word is *yad*, “hand,” which has the sense “sign, monument” here and at [[2 Sam. 18:18]], where Absalom raises a pillar so that his name will be remembered (the King James calls that one “Absalom's place” too, [[2 Sam. 18:18]]). A modern translation has Saul setting up the monument “in his own honor.”

      The detail is told while Samuel is on his way with the LORD's verdict, and one Latter-day Saint commentary reads it as part of the charge: Saul used his office “to aggrandize himself instead of glorifying the Lord.”
    sources: [bdb, niv, ot-minute-1-samuel-15]

  - ref: 17
    phrase: When thou wast little in thine own sight
    kind: history
    title: Little in his own sight
    body: |
      Samuel reminds Saul of the man he had been, and in the Church's reading this verse names the root of his failure. When Samuel first spoke to him, Saul answered, “Am not I a Benjamite, of the smallest of the tribes of Israel? and my family the least of all the families of the tribe of Benjamin?” ([[1 Sam. 9:21]]); at his choosing he hid among the baggage ([[1 Sam. 10:22]]). Saul “had been called because of his humility”; “now he trusted in his own wisdom and did not look to God.”

      One older reading, on the LORD's words that Saul “is turned back from following me” (verse 11), puts the change more sharply: Saul would no longer be the LORD's servant but “absolute ruler in Israel,” led by pride “arising from the consciousness of his own strength.”
    sources: [ot-manual-1-samuel-1, keil-1-samuel, lds-scriptures]

  - ref: 22
    phrase: to obey is better than sacrifice, and to hearken than the fat of rams
    kind: prophets
    title: To obey is better than sacrifice
    body: |
      Samuel does not condemn sacrifice; he says what makes it acceptable. Offerings were to come from an obedient heart, and Saul's did not. The animals he meant to offer had been gained by disobeying the LORD, and the LORD had not asked for that sacrifice at all. A sacrifice is also the easier thing to give: it is “much easier” to bring an animal to the altar than to make one's own will subject to His.

      Elder Robert D. Hales named what Saul did “selective obedience”: “relying on his own wisdom,” he kept part of the command and set it aside where his judgment differed. Because Saul did not “hearken with exactness,” he lost the kingdom.

      The site's notes on [[Ps. 40:6]], [[Ps. 51:16]], [[Isa. 1:11]] and [[Hosea 6:6]] take the principle up in their own settings.
    sources: [ot-seminary-lesson-85, ot-minute-1-samuel-15, hales-agency-2010, lds-scriptures]

  - ref: 23
    phrase: rebellion is as the sin of witchcraft
    kind: words
    title: As the sin of witchcraft
    body: |
      “Witchcraft” here is divination, and Samuel sets rebellion beside it and stubbornness beside idolatry. The Hebrew word, *qesem*, is the seeking of omens the law forbids ([[Deut. 18:10]]). In the second line, “idolatry” is *teraphim*, the household images used both as objects of reverence and as a means of divination; the image Michal will put in David's bed is one ([[1 Sam. 19:13]]; Rachel's are at [[Gen. 31:19]]).

      Why compare disobedience to those sins? One older reading answers that divination and idols both belong to the worship of other powers, and that conscious disobedience is the same thing in another form: “All conscious disobedience is actually idolatry, because it makes self-will, the human I, into a god.”
    sources: [bdb, keil-1-samuel]

  - ref: 24
    phrase: because I feared the people, and obeyed their voice
    kind: history
    title: I feared the people
    body: |
      Saul's confession names the reason the whole chapter has been circling: he obeyed the people's voice instead of the LORD's. The Church's teachers draw the principle from this verse: “seeking to please others rather than the Lord can lead us to disobey His commandments.” It was a pattern with him. At Gilgal he had offered the sacrifice himself as the people scattered from him ([[1 Sam. 13:11–12]]), and one Latter-day Saint writer observes that “under pressure, he chose to do what he thought would give him popular approval.”

      The confession itself falls short. Saul's repentance “was too late and very short-lived,” the same disobedience as at Gilgal in chapter 13, and a Latter-day Saint commentary on these verses says plainly that it “was not sincere.” The Church's footnote sets David's confession beside this one ([[2 Sam. 12:13]]).
    sources: [ot-seminary-lesson-85, ellsworth-tragic-saul, ot-manual-1-samuel-1, ot-minute-1-samuel-15, lds-scriptures]

  - ref: 27
    phrase: he laid hold upon the skirt of his mantle, and it rent
    kind: symbol
    title: The torn mantle
    body: |
      The torn hem of Samuel's robe becomes the sign of the kingdom torn from Saul. The King James leaves unclear who took hold of whom; a Latter-day Saint commentary reads it as Saul grabbing the bottom of Samuel's robe as he turned to go, and tearing it (the footnote gives “was torn”). Samuel at once makes it a sign: “The LORD hath rent the kingdom of Israel from thee this day” (verse 28), using the torn robe to affirm that the LORD had rejected Saul as king.

      The “neighbour … that is better than thou” is not named here. The Church's footnote points ahead to the night before Saul's death, when the same sentence is spoken again with the name: “the LORD hath rent the kingdom out of thine hand, and given it to thy neighbour, even to David” ([[1 Sam. 28:17]]).
    sources: [lds-scriptures, ot-minute-1-samuel-15]

  - ref: 29
    phrase: the Strength of Israel will not lie nor repent
    kind: words
    title: The Strength of Israel
    body: |
      “The Strength of Israel” is a title of the LORD (the footnote says so), and the verse says His sentence on Saul will stand. The Hebrew word, *nēṣaḥ*, has the senses of eminence and of enduring, and here the title is “the Eminence of Israel”; on one older reading the point is constancy, “the unchangeable One, in whom Israel can trust.”

      The verse pairs “repent” with “lie”: the LORD does not go back on His word as men do. The same older reading sets it beside verse 11: there the LORD's repenting is spoken in human terms, here God is spoken of as He is (it compares [[Num. 23:19]]), so His grief over Saul did not mean He had been mistaken or would change His mind.
    sources: [lds-scriptures, bdb, keil-1-samuel]

  - ref: 33
    phrase: Samuel hewed Agag in pieces before the LORD in Gilgal
    kind: history
    title: Why Samuel put Agag to death
    body: |
      Samuel carries out the part of the command Saul left undone. The ban, as one Latter-day Saint study describes it, was carried out in the battle, with one exception: an enemy king could be captured and brought to the commander for ritual execution, apparently right after the fighting, as Joshua did ([[Josh. 10:22–27]]). Saul kept Agag alive instead. Samuel performs the execution himself, “before the LORD,” and Agag's own deeds are given as the reason: “As thy sword hath made women childless.”

      Agag came “delicately.” The Hebrew word means dainties or delight, and a Latter-day Saint commentary renders it “cheerfully”: Agag had reason to believe he would be spared, perhaps ransomed, and so he said, “Surely the bitterness of death is past.” But the command Saul had neglected still stood, and Samuel carried it out in public.
    sources: [calabro-herem, ot-minute-1-samuel-15, bdb]

christ: |
  The Church's footnotes to verse 22 send the reader to Psalm 40 and Hebrews 10, where Samuel's principle is said of Jesus Christ. The psalm's “Sacrifice and offering thou didst not desire” ([[Ps. 40:6]]) becomes the Son's own words: “Lo, I come to do thy will, O God,” and “by the which will we are sanctified through the offering of the body of Jesus Christ once for all” ([[Heb. 10:9–10]]; see the note at [[Ps. 40:6]]). His sacrifice is the offering that was itself obedience.

  The Lord delights more in the obedience of the one who offers than in the offering, so a disciple's worship and service take their worth from the obedience behind them, and keeping one command does not excuse setting aside another.

explore: |
  - **Amalek before and after.** [[Ex. 17:8–16]] and [[Deut. 25:17–19]]; [[1 Sam. 28:17–18]], where Saul hears the sentence of this chapter again at Endor; [[1 Sam. 30]], David and the Amalekites; [[2 Sam. 1:8–10]], the Amalekite who brings David Saul's crown. The footnote at Agag points to [[Esth. 3:1]], “Haman … the Agagite.”
  - **Obedience and sacrifice.** [[Ps. 40:6–8]] with [[Heb. 10:5–10]]; [[Hosea 6:6]]; [[Micah 6:6–8]].
  - **The ban.** The Latter-day Saint study “Thou Shalt Utterly Destroy” (Religious Studies Center, 2025) treats the command in this chapter at length.

