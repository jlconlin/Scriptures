chapter: 11
title: The LORD Hath Wrought Salvation
tagline: Nahash the Ammonite besieges Jabesh-gilead and demands its people's right eyes; the Spirit of God rushes on Saul, he gathers Israel and rescues the city, and the kingdom is renewed at Gilgal.
when: 'Soon after Saul was chosen king at Mizpeh'

setting: |
  Saul had been anointed in private ([[1 Sam. 10:1]]) and chosen by lot before the tribes at Mizpeh, but not everyone accepted him: “the children of Belial said, How shall this man save us? And they despised him” ([[1 Sam. 10:27]]). He went home to Gibeah. This chapter answers their question.

  The threat came from the east. Jabesh-gilead lay across the Jordan in Gilead, and the Ammonites had claimed part of that land since the days of Jephthah ([[Judg. 11:13]]); Nahash most likely meant to make the claim good. On one older reading the siege began soon after Mizpeh, and Samuel's later words show that the Ammonite threat was already in view when the people asked for a king ([[1 Sam. 12:12]]). Jabesh had a past with Gibeah. When the tribes made war on Benjamin, Jabesh sent no one and was destroyed for it ([[Judg. 21:8]]), yet it had recovered and was now the chief town of Gilead. Gibeah, where the crime that started that war was done ([[Judg. 19:22]]), was now Saul's home.

thread: |
  The chapter is the test of a new king. On one older reading, Saul could not expect the tribes to recognize him freely until he had done what Israel wanted a king for and proved himself a deliverer from its enemies; here he does it. Jabesh asks whether there is “no man to save us” (verse 3); the Spirit of God comes on Saul (verse 6), the tribes come “with one consent” (verse 7), and the victory unites them behind him as one nation.

  The chapter's last scenes show what kind of king Saul was in his early years. The people want to kill the men who despised him; he refuses, and gives the victory to the LORD (verse 13). Samuel then takes the people to Gilgal to renew the kingdom, and the chapter ends in rejoicing.

sections:
  - range: 1-3
    heading: Nahash at Jabesh-gilead
    plain: |
      Then Nahash the Ammonite marched up and besieged Jabesh-gilead. All the men of Jabesh said to him, “Make a treaty with us, and we will serve you.” Nahash answered, “I will make a treaty with you on one condition: that I gouge out the right eye of every one of you, and so bring disgrace on all Israel.” The elders of Jabesh said, “Give us seven days, so that we can send messengers through all the territory of Israel. If no one comes to save us, we will surrender to you.”
  - range: 4-8
    heading: Saul summons Israel
    plain: |
      The messengers came to Gibeah, Saul's town, and told the people the news, and all the people wept aloud. Just then Saul was coming in from the field behind his oxen. “What is wrong with the people? Why are they weeping?” he asked, and they told him what the men of Jabesh had said. When Saul heard it, the Spirit of God rushed upon him, and he burned with anger. He took a pair of oxen, cut them in pieces, and sent the pieces by messengers throughout Israel with this word: “This is what will be done to the oxen of anyone who does not come out after Saul and Samuel.” The fear of the Lord fell on the people, and they came out as one man. When Saul counted them at Bezek, there were three hundred thousand from Israel and thirty thousand from Judah.
  - range: 9-11
    heading: The rescue
    plain: |
      They told the messengers who had come, “Say this to the men of Jabesh-gilead: ‘By the time the sun is hot tomorrow, you will be rescued.’” The messengers went and told the men of Jabesh, and they were overjoyed. The men of Jabesh then told the Ammonites, “Tomorrow we will come out to you, and you can do with us whatever you like.” The next day Saul divided his men into three companies. In the last watch of the night, before sunrise, they broke into the Ammonite camp and struck them down until the heat of the day. Those who survived were so scattered that no two of them were left together.
  - range: 12-15
    heading: The kingdom renewed at Gilgal
    plain: |
      Then the people said to Samuel, “Who was it that said, ‘Shall Saul reign over us?’ Hand those men over, and we will put them to death.” But Saul said, “No one will be put to death today, for today the Lord has rescued Israel.” Then Samuel said to the people, “Come, let us go to Gilgal and renew the kingdom there.” So all the people went to Gilgal, and there, before the Lord, they made Saul king. There they offered peace offerings before the Lord, and Saul and all the men of Israel celebrated with great joy.

notes:
  - ref: 2
    phrase: that I may thrust out all your right eyes
    kind: history
    title: Why the right eyes?
    body: |
      Nahash's condition makes more sense in light of a passage that one of the Dead Sea Scrolls of Samuel, known as 4QSam-a, has just before this chapter. As the King James and the Hebrew text stand, there seems to be no reason why he would accept the town's surrender only if he could put out every man's right eye. The scroll (the scrolls are up to a thousand years older than the manuscripts the King James translators used) seems to have an answer. In a modern translation it says that Nahash had been oppressing the Gadites and the Reubenites: “He would gouge out the right eye of each of them and would not grant Israel a deliverer. No one was left of the Israelites across the Jordan whose right eye Nahash, king of the Ammonites, had not gouged out. But there were seven thousand men who had escaped” from the Ammonites and had taken refuge in Jabesh-gilead.

      Read with that passage, the demand is of a piece with what Nahash had already done to the other Israelite towns east of the Jordan, and the refugees at Jabesh were not to escape the fate of their kin. The mutilation would presumably show that no one got away from him and leave the Israelites of the region unable to rise against him again. He also says what he wants it to mean beyond Jabesh: “lay it for a reproach upon all Israel.”

      Translations do not agree on what to do with the scroll's passage. One modern translation prints it as the last verse of chapter 10; others put it in a footnote; others leave it out. Here the King James text stands, and the scroll's reading is given as the scroll's.
    sources: [sc-knowhy-855, strathearn-modern-translations]

  - ref: 5
    phrase: Saul came after the herd out of the field
    kind: history
    title: A king behind the plough
    body: |
      The man chosen king at Mizpeh comes home from the field behind his oxen. Older commentaries agree that after the lot fell on him Saul had gone back to his farm work in Gibeah, and one of them, judging from the “yoke of oxen” of verse 7, takes “the herd” as the pair he had been ploughing with. That older reading sees in this more than modesty. A king so new to Israel could not command the tribes on the strength of a lot, least of all after some had despised him ([[1 Sam. 10:27]]), and since God had chosen him without his seeking, he waited for God to give him the occasion to act.

      The scene shows how slight the new kingship still was. The messengers from Jabesh did not ask for the king; they told their news to the people of Gibeah, and Saul heard it only because he came in and found them weeping. Their message had gone out to “all the coasts of Israel” (verse 3); on the same older reading, Israel as yet had no central government to send it to.
    sources: [keil-1-samuel, cambridge-1-samuel]

  - ref: 6
    phrase: the Spirit of God came upon Saul
    kind: words
    title: The Spirit rushed upon Saul
    body: |
      What came over Saul here was the Spirit of God, coming suddenly and with power, as it had come on Samson. The Hebrew verb behind “came upon” is *ṣālaḥ*, “rush,” used especially of the Spirit's sudden possession of a man. It is the word behind “came mightily” of Samson ([[Judg. 14:6]], [[Judg. 15:14]]; at [[Judg. 14:19]] the King James has only “came upon”), and it is used of Saul when the Spirit came on him among the prophets ([[1 Sam. 10:6]], [[1 Sam. 10:10]]; the site explains that scene at [[1 Sam. 10:10]]) and of David on the day he was anointed ([[1 Sam. 16:13]]).

      The Old Testament often ties the Spirit to power in battle (as with Othniel, [[Judg. 3:10]]), and that is how it shows itself here. The verse joins the Spirit and Saul's anger in one sentence, and what followed was the summons, the march and the rescue.
    sources: [bdb, wilson-holy-spirit]

  - ref: 7
    phrase: Whosoever cometh not forth after Saul and after Samuel
    kind: history
    title: After Saul and after Samuel
    body: |
      Saul's summons calls the tribes to follow the king and the prophet together. The pieces of the oxen dramatized that the crisis called for a united Israel, and any man who stayed home would lose his own oxen the same way. Scripture tells of one other summons like it, the Levite's from Gibeah; the two are set side by side at [[Judg. 19:29]].

      Saul joined his authority to Samuel's in the message. One older reading takes the order of the names as a sign that even as king he still recognized the authority Samuel held as the prophet of Jehovah. What brought the people out “with one consent” the text calls “the fear of the LORD”: on the same older reading, not dread of punishment, but awe that the LORD Himself inspired, because the people saw His power in Saul's appeal.
    sources: [ot-manual-1-samuel-1, keil-1-samuel]

  - ref: 8
    phrase: the children of Israel were three hundred thousand, and the men of Judah thirty thousand
    kind: history
    title: Israel and Judah counted apart
    body: |
      The muster at Bezek counts Judah separately from the rest of Israel, and older commentators asked whether that was an early sign of the line that would one day split the kingdom. Bezek was probably at a site west of the Jordan, about halfway between Shechem and Beth-shan, within a day's march of Jabesh. One older reading sees in the separate count a trace of the separation of Judah from the other tribes that later led to the division of the kingdom; another notes that some have taken it as a sign the book was written after the division, but thinks it may show no more than Judah's tendency to keep to itself.

      The numbers themselves are large. On the large numbers of the Old Testament in general, the Hebrew word for “thousand,” *ʾeleph*, can also mean a family or clan, or perhaps a military unit, and in a number of places a word for a fighting man seems to have been misread as “thousand.” No source read applies that to this verse, and the figure stands as the text gives it. Older commentators thought it possible for a levy of the whole nation rather than a standing army.
    sources: [keil-1-samuel, cambridge-1-samuel, ot-manual-large-numbers]

  - ref: 13
    phrase: There shall not a man be put to death this day
    kind: history
    title: No one dies today
    body: |
      Saul's first act after the victory is to spare the men who had questioned his kingship and to give the victory to the LORD. The people's question in verse 12 recalls the “children of Belial” who had asked “How shall this man save us?” ([[1 Sam. 10:27]]; on the phrase, see [[Judg. 19:22]]). Now that he has saved them, the crowd wants those who doubted him dead. Saul refuses, and the reason he gives is not his own mercy but the LORD's work: “to day the LORD hath wrought salvation in Israel.”

      After he accepted the kingship, Saul proved wise in managing those who opposed him; victorious at Jabesh-gilead, he was quick to give God the honor, and in these early years he was humble. The same man's flaw would be pride, often shown as a fear of criticism and a love of popular approval.
    sources: [ellsworth-tragic-saul]

  - ref: 14
    phrase: renew the kingdom there
    kind: history
    title: Renewing the kingdom
    body: |
      The kingdom renewed at Gilgal was the one founded at Mizpeh ([[1 Sam. 10:24–25]]), and at Gilgal the people confirmed Saul as king. The text does not say what the ceremony was. It says only that “they made Saul king before the LORD in Gilgal” ([[1 Sam. 11:15]]). The Greek translation, the Septuagint, reads instead that “Samuel anointed Saul there to be king”; one older reading answers that the Hebrew verb does not mean “anointed,” and that an anointing would have been mentioned, as David's later anointings are ([[2 Sam. 2:4]], [[2 Sam. 5:3]]). The same reading suggests that the renewal was a solemn confirmation of the choice made at Mizpeh, with Samuel again setting the rights of the kingdom before king and people, and the promise sealed by sacrifice.

      The sacrifices were peace offerings; on the same older reading, thank offerings eaten in a shared meal, a feast of rejoicing that stood for fellowship with the LORD. The day ends in gladness for “Saul and all the men of Israel” (verse 15). Gilgal will not stay a place of joy for Saul: it was where he was made king, and it is where he will be condemned ([[1 Sam. 13:13–14]]).
    sources: [cambridge-1-samuel, keil-1-samuel, lxx-rahlfs, ot-seminary-lesson-84, ellsworth-tragic-saul]

christ: |
  Saul names the true Deliverer of the day: “the LORD hath wrought salvation in Israel” (verse 13). The LORD of the Old Testament is Jehovah, the premortal Christ (see [[Ex. 3:14]]), and the rescue of Jabesh, saved apparently on the very day it was to be mutilated, can be read beside what He does for all: Christ has saved all people from sin and death through His Atonement. Likely because of that day, the men of Jabesh never lost their gratitude toward the man who saved them, and years later they risked their lives for his body ([[1 Sam. 31:11–13]]).

  Gratitude to Christ can be as lasting and as strong as theirs. A disciple who succeeds acknowledges, as Saul did that day, the hand of the Lord in it.

explore: |
  - **Jabesh-gilead and Saul.** [[Judg. 21:8–14]], the town destroyed for staying home; [[1 Sam. 31:11–13]], its men recover Saul's body; [[2 Sam. 2:4–7]], David blesses them for it.
  - **Why the people asked for a king.** [[1 Sam. 12:12]], where Samuel names Nahash.
  - [“Why Did the Ammonite King Require the Right Eyes of the People of Jabesh-Gilead Be Gouged Out?”](https://scripturecentral.org/knowhy/why-did-the-ammonite-king-require-the-right-eyes-of-the-people-of-jabesh-gilead-be-gouged-out-1) (KnoWhy #855), on the scroll's passage and the rescue.

