chapter: 27
title: Achish Believed David
tagline: Sure that Saul will catch him one day, David takes his six hundred men and their families over to Achish of Gath, is given the town of Ziklag, raids the desert tribes to the south, and tells the Philistine king he has been raiding Judah.
when: 'While David fled from Saul, among the Philistines at Gath and Ziklag'

setting: |
  Chapter 26 ended with Saul's promise, “I will no more do thee harm” ([[1 Sam. 26:21]]), and David did not believe him. So he took his men and their families to live among the Philistines. He had already said what being hunted out of Israel meant to him: men had “driven me out this day from abiding in the inheritance of the LORD, saying, Go, serve other gods” ([[1 Sam. 26:19]]).

  This is David's second stay with Achish, king of Gath. The first was short and frightening; he escaped only by acting the madman ([[1 Sam. 21:10–15]]; the note at [[1 Sam. 21:11]] tells it). Gath was Goliath's city ([[1 Sam. 17:4]]), and one of its excavators places the palace where Achish hosted David on the hilltop that was the city's elite quarter. This time David stays “a full year and four months” (verse 7), the sixteen months of the chapter heading.

  The chapter sets up the four that follow. Achish's trust leads him to take David to war against Israel ([[1 Sam. 28:1]]), the Philistine lords send David home ([[1 Sam. 29:3–6]]), and the Amalekites, the very people he has been raiding, burn Ziklag while he is gone ([[1 Sam. 30:1]]).

thread: |
  The chapter turns on a single verb in its last verse: “Achish believed David.” Everything before it explains how David earned that trust and what it hid. David says in his heart that Saul will kill him one day (verse 1), and he makes the one move that ends the hunt: “he sought no more again for him” (verse 4). He asks for a town of his own away from the royal city and is given Ziklag. From there he raids the old desert peoples to the south, leaves no one alive to report it, and tells Achish he has been raiding Judah and its allies.

  Achish draws the conclusion David wanted: David has made his own people loathe him, so he will be the king's servant forever. The narrator lets the reader see what the king cannot.

sections:
  - range: 1-4
    heading: David goes over to Gath
    plain: |
      David said to himself, “One of these days Saul will kill me. The best thing I can do is to get away quickly to the land of the Philistines. Then Saul will give up looking for me anywhere in Israel, and I will escape him.” So David and the six hundred men with him went over to Achish son of Maoch, king of Gath. David and his men settled at Gath with Achish, each man with his household, and David with his two wives, Ahinoam of Jezreel and Abigail of Carmel, Nabal's widow. When Saul was told that David had fled to Gath, he stopped searching for him.
  - range: 5-7
    heading: Ziklag
    plain: |
      David said to Achish, “If I have found favor with you, let me be given a place in one of the country towns to live in. Why should your servant live in the royal city with you?” That day Achish gave him Ziklag, and so Ziklag has belonged to the kings of Judah ever since. David lived in Philistine country a year and four months.
  - range: 8-12
    heading: The raids and the report
    plain: |
      David and his men went up and raided the Geshurites, the Gezrites and the Amalekites, peoples who had lived of old in the land stretching toward Shur and on to Egypt. Whenever David attacked the land he left no man or woman alive, and he took the sheep, cattle, donkeys, camels and clothing, and came back to Achish. When Achish asked, “Where did you raid today?” David would say, “Against the south of Judah,” or “against the south of the Jerahmeelites,” or “against the south of the Kenites.” He left no man or woman alive to be brought to Gath, for he thought, “They might tell on us and say, ‘This is what David did.’” This was his practice the whole time he lived in Philistine country. And Achish believed David. He thought, “He has made himself so hated by his own people Israel that he will be my servant for life.”

notes:
  - ref: 1
    phrase: And David said in his heart, I shall now perish one day by the hand of Saul
    kind: history
    title: Why David went over to the Philistines
    body: |
      David went to the Philistines because he no longer believed that Saul would stop. Saul had just said, “I will no more do thee harm” ([[1 Sam. 26:21]]), and David did not believe him. The verse is David's own reasoning, spoken “in his heart,” and verse 4 proves the reasoning right: once Saul heard that David was in Gath, “he sought no more again for him.”

      The move cost something, and David had already named the cost. To be driven out of the land was to be driven from “the inheritance of the LORD” and told to “serve other gods” ([[1 Sam. 26:19]]); on one older reading, what David foresaw there has now come to pass. The same reading notes how unlike this is to his first visit to Gath. Then he came alone, was recognized as Goliath's killer, and barely escaped; now he comes as the leader of six hundred warriors and is welcomed as an ally, entering the king's service as an independent chieftain. The king is the same Achish of Gath who received David the first time ([[1 Sam. 21:10]]).
    sources: [ot-seminary-student-2018-1-sam-91, cambridge-1-samuel, bd-achish, lds-scriptures]

  - ref: 6
    phrase: wherefore Ziklag pertaineth unto the kings of Judah unto this day
    kind: history
    title: Ziklag, the town that stayed with Judah’s kings
    body: |
      Ziklag was a town Joshua had given to Israel that the Philistines held in Saul's day, and Achish's gift put it in David's hands. It lay in the Negev; Joshua had assigned it to Judah ([[Josh. 15:31]]) and then to Simeon ([[Josh. 19:5]]), but in Saul's day it was a Philistine city. David asked for a country town so that he would not have to live “in the royal city” under the king's eye (verse 5), and Achish gave him this one. The narrator's “unto this day” speaks from his own time, when the town still belonged to the kings of Judah; when that was is not known, since it is uncertain who wrote Samuel or when.

      Ziklag became David's base. Chronicles lists the men who “came to David to Ziklag, while he yet kept himself close because of Saul,” Benjamites among them, Saul's own kin ([[1 Chr. 12:1–2]]); more joined him as he came back to Ziklag from the Philistine army, as the note at [[1 Sam. 29:11]] tells.
    sources: [bd-ziklag, bd-samuel-books, lds-scriptures]

  - ref: 8
    phrase: and the Amalekites
    kind: history
    title: Amalekites again
    body: |
      The Amalekites David raids are the people Saul was told to destroy in chapter 15; the command and Saul's failure to keep it are explained at [[1 Sam. 15:3]]. Saul “utterly destroyed all the people” ([[1 Sam. 15:8]]), yet here are Amalekites again, and in chapter 30 they will burn Ziklag. They were at war with Israel from Moses' day until Saul and David broke their power.

      One Latter-day Saint study of the ban, given at [[1 Sam. 15:3]], reads that survival as part of how the ban texts are to be read: accounts of divinely commanded war spoke in absolute terms, and some passages show people under the ban having to be fought again, the Amalekites of this verse among them. That is the study's reading of the language, not a claim that the command was not given.
    sources: [bd-amalek, calabro-herem, lds-scriptures]

  - ref: 10
    phrase: Against the south of Judah, and against the south of the Jerahmeelites, and against the south of the Kenites
    kind: history
    title: What David told Achish
    body: |
      David told Achish he was raiding his own people when he was raiding theirs. The three names he gave were all on Israel's side. Judah was his own tribe. The Jerahmeelites were a clan of Judah, from Jerahmeel, “the firstborn of Hezron” ([[1 Chr. 2:25]]). The Kenites, kin of Moses' father-in-law, were Israel's friends of long standing; Saul had warned them away before he struck Amalek, “for ye shewed kindness to all the children of Israel” ([[1 Sam. 15:6]]). So David made Achish think he was striking Judah and its friends, when the towns he struck were not Israelite at all.

      The text gives David's reason for leaving no one alive in its own words: “Lest they should tell on us, saying, So did David” (verse 11). It passes no judgment on the deception or the killing. One Church reading takes the raids themselves as David's attempt to fulfill the Lord's original commands to Israel to rid the land of the idolatrous and wicked; the text does not give that as his reason. The deception worked. Achish decided that David had made Israel loathe him (verse 12), and two chapters later he is still saying “I have found no fault in him since he fell unto me” ([[1 Sam. 29:3]]).
    sources: [bd-kenites, ot-seminary-student-2018-1-sam-91, ot-seminary-guide-1-sam-27, lds-scriptures]

christ: |
  David's safety in this chapter rests on a border and on what a foreign king believes. Peter describes the way Jesus Christ went through danger: “when he suffered, he threatened not; but committed himself to him that judgeth righteously,” and Peter gives that to the Saints as “an example, that ye should follow his steps” ([[1 Pet. 2:21–23]]).

  A disciple in danger finds safety where Christ found His, with the Father who judges righteously.

explore: |
  - **What Achish's trust led to.** [[1 Sam. 28:1–2]], Achish takes David to war; [[1 Sam. 29]], the Philistine lords send him back; [[1 Sam. 30]], Ziklag burned and David “encouraged himself in the LORD his God.”
  - **The first visit to Gath.** [[1 Sam. 21:10–15]], with [[Ps. 34]] and [[Ps. 56]], which their titles set there.
  - **The men who came to Ziklag.** [[1 Chr. 12:1–22]].
  - **Amalek.** [[Ex. 17:8–16]]; [[1 Sam. 15]]; [[1 Sam. 30:1–20]].

