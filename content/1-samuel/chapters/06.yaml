chapter: 6
title: Who Is Able to Stand
tagline: The Philistines send the ark home on a cart drawn by two nursing cows, with golden gifts for the God of Israel; at Beth-shemesh it is welcomed with sacrifice, and then feared.
when: 'Seven months after the ark was taken, at the wheat harvest'

setting: |
  The ark of the covenant had been lost at Ebenezer, where “the ark of God was taken; and the two sons of Eli, Hophni and Phinehas, were slain” ([[1 Sam. 4:11]]); the site's note at [[Ps. 78:60]] tells that day as the psalm remembers it. Chapter 5 followed the ark from city to city in Philistia, and wherever it went the hand of the LORD fell on the people. The plague stopped only when the ark went back to Israel, and the whole episode showed Jehovah greater than Dagon (on Dagon, see [[1 Sam. 5:2]]).

  This chapter is the return. The Philistines ask their own priests how to send the ark home, and the priests answer with a payment and a test (verses 2–9). The cart goes up to Beth-shemesh, a town on the border of Judah about twelve miles southeast of Ekron. It was no ordinary town: Joshua had given it to “the children of Aaron the priest” ([[Josh. 21:13]], [[Josh. 21:16]]), so men of Levi's tribe were at hand to take the ark down (verse 15). The day of rejoicing there ends in death, and the chapter closes with the men of Beth-shemesh sending the ark on to Kirjath-jearim, in the hills above them. There it stayed so long that twenty years went by ([[1 Sam. 7:2]]).
thread: |
  The chapter is about how the holy God may be approached, and it puts two peoples side by side. The Philistines are not sure the LORD struck them at all; their priests think it may have been “a chance” (verse 9). Still, they take no risks. They send a payment for the wrong they have done Him, remind themselves what happened to Pharaoh, and set a test for the cows that only the God of Israel could pass, and the cows pass it.

  Israel's side begins in joy. The reapers of Beth-shemesh look up from the wheat, see the ark coming, and rejoice; the Levites set it on a great stone, and the town offers sacrifice. Then some of them gaze on the ark, and the LORD strikes them. The ark stood for the living presence of Jehovah, and the lesson ran both ways: unholiness was not tolerated, whether Philistine or Israelite. The chapter ends with the question it has been asking all along, put in the mouths of the men of Beth-shemesh: “Who is able to stand before this holy LORD God?” (verse 20).

sections:
  - range: 1-6
    heading: The Philistine priests advise a payment
    plain: |
      The ark of the Lord had been in Philistine territory for seven months. The Philistines called in their priests and diviners and asked, “What should we do with the ark of the Lord? Tell us what to send with it when we send it back to its place.” They answered, “If you send away the ark of the God of Israel, do not send it empty-handed. Be sure to pay Him a guilt offering. Then you will be healed, and you will learn why His hand has not been lifted from you.” “What guilt offering should we send Him?” they asked. The priests said, “Five gold tumors and five gold mice, one for each of the Philistine lords, because the same plague struck all of you and your lords. Make models of your tumors and of the mice that are ruining the land, and give glory to the God of Israel. Perhaps He will lift His hand from you, from your gods, and from your land. Why harden your hearts the way the Egyptians and Pharaoh did? When He had dealt with them so powerfully, didn't they let the people go, and they left?”
  - range: 7-12
    heading: Two cows and a new cart
    plain: |
      “So build a new cart. Take two cows that are nursing calves and have never worn a yoke. Hitch the cows to the cart, but take their calves away from them and shut them up at home. Put the ark of the Lord on the cart, and put the gold objects you are paying Him as a guilt offering in a box beside it. Then send it off and let it go its own way. Watch it. If it goes up the road toward its own territory, to Beth-shemesh, then He is the one who has done us this great harm. If not, we will know that it was not His hand that struck us; it just happened to us by chance.” The men did so. They took two nursing cows, hitched them to the cart, and shut up their calves at home. They put the ark of the Lord on the cart, with the box holding the gold mice and the models of their tumors. The cows went straight up the road to Beth-shemesh, keeping to the highway and lowing as they went, and turned neither right nor left. The Philistine lords followed them as far as the border of Beth-shemesh.
  - range: 13-18
    heading: The ark comes to Beth-shemesh
    plain: |
      The people of Beth-shemesh were harvesting their wheat in the valley. When they looked up and saw the ark, they were overjoyed. The cart came into the field of Joshua of Beth-shemesh and stopped there beside a large stone. The people split up the wood of the cart and offered the cows as a burnt offering to the Lord. The Levites had taken down the ark of the Lord and the box with the gold objects and set them on the large stone, and that same day the men of Beth-shemesh offered burnt offerings and other sacrifices to the Lord. The five Philistine lords watched all this and went back to Ekron the same day. These are the gold tumors the Philistines sent as a guilt offering to the Lord: one each for Ashdod, Gaza, Ashkelon, Gath and Ekron. The gold mice matched the number of all the Philistine towns belonging to the five lords, walled cities and open villages alike. The large stone on which they set the ark of the Lord is still there to this day, in the field of Joshua of Beth-shemesh.
  - range: 19-21
    heading: “Who is able to stand?”
    plain: |
      But the Lord struck down some of the men of Beth-shemesh because they had looked into the ark of the Lord. He struck down fifty thousand and seventy of the people, and the people mourned because the Lord had struck them so heavily. The men of Beth-shemesh said, “Who can stand before the Lord, this holy God? And to whom will He go up from us?” They sent messengers to the people of Kirjath-jearim to say, “The Philistines have brought back the ark of the Lord. Come down and take it up to your town.”

notes:
  - ref: 3
    phrase: return him a trespass offering
    kind: words
    title: A payment for a wrong done to God
    body: |
      The priests tell the Philistines to send the God of Israel a payment for the wrong done Him. “Trespass offering” is *ʾāšām*, a word that means guilt and also the offering that answers for it, and “return” makes the gift a paying back of something owed.

      The word is the law's, but the gift is not the law's offering. In Leviticus the *ʾāšām* was a ram brought by an Israelite who had trespassed “in the holy things of the Lord,” with the harm made good and a fifth added ([[Lev. 5:15–16]]). The Philistines send golden models, and the lexicon counts their *ʾāšām* as “entirely different from the trespass-offering” of the priests' law. What the two share is the idea of a debt owed to God for a wrong.
    sources: [bdb, lds-scriptures]
  - ref: 4
    phrase: Five golden emerods, and five golden mice
    kind: history
    title: Golden tumors and golden mice
    body: |
      The gifts were gold models of the two things that had struck the Philistines: the swellings of the disease and the mice. Because the word translated “emerods” means “an inflamed tumor,” many have taken it for hemorrhoids; it may mean tumors or boils. The Hebrew text has two words for them. The written text has *ʿŏphālîm*, “tumours”; the reading tradition (the *qere*, what is read aloud in place of what is written, the *ketiv*) substitutes *ṭǝḥōrîm* every time, tumours that come with dysentery, and that word has slipped into the written text itself at verses 11 and 17.

      What the disease was is not certain. The description suggests something far more serious than hemorrhoids: many died. Josephus describes a distemper that killed suddenly, and a great multitude of mice that came up out of the earth and spared neither plants nor fruits. Because the disease was severe and rodents were involved, many scholars conclude it was bubonic plague, named for the buboes, the tumorous swellings it raises in the lymph glands. That is a conclusion drawn from the text, not something the text says.

      The images were how the Philistines would “give glory unto the God of Israel” (verse 5), and giving God glory goes with owning a fault: Joshua told Achan, “give, I pray thee, glory to the LORD God of Israel, and make confession unto him” ([[Josh. 7:19]]), the verse the Gospel Library's footnote sets beside this one. The priests proposed five of each, one for each lord (verse 4). The list of what was sent has five tumors, one for each chief city, and golden mice for all the cities of the five lords, walled towns and country villages alike (verses 17–18).
    sources: [scripture-helps-ruth-samuel, bdb, ot-manual-1-samuel-1, josephus-antiquities, lds-scriptures]
  - ref: 6
    phrase: as the Egyptians and Pharaoh hardened their hearts
    kind: scripture
    title: The Philistines remember Egypt
    body: |
      Philistine priests knew the story of the Exodus, and they drew its lesson for their own people: don't do what Pharaoh did. The story was known in Philistia before the ark came there. At the battle where it was taken, the Philistines themselves had cried out, “Woe unto us! who shall deliver us out of the hand of these mighty Gods? these are the Gods that smote the Egyptians with all the plagues in the wilderness” ([[1 Sam. 4:8]]).

      The warning sits beside a doubt. The same priests still think the plague might have been chance (verse 9), yet they will not risk Pharaoh's mistake. The verb behind “wrought wonderfully” is a hard one, and the site explains it at [[Ex. 10:2]].
    sources: [lds-scriptures]
  - ref: 7
    phrase: two milch kine, on which there hath come no yoke
    kind: history
    title: A test the cows should have failed
    body: |
      The priests built the test so that the cows would show who was guiding them. They chose “two milch kine, on which there hath come no yoke,” and took their calves from them: the men “shut up their calves at home” (verse 10). No one was to drive the cart; the instruction was “send it away, that it may go” (verse 8). The priests named the outcome in advance: if the cart went up “by the way of his own coast to Beth-shemesh,” the God of Israel had done it; if not, “it was a chance that happened to us” (verse 9).

      The cows “took the straight way to the way of Beth-shemesh, and went along the highway, lowing as they went, and turned not aside to the right hand or to the left” (verse 12). By the priests' own terms, the plague had been His hand.
    sources: [lds-scriptures]
  - ref: 18
    phrase: the great stone of Abel
    kind: words
    title: The great stone
    body: |
      The verse points to the great stone in Joshua's field where the ark was set down (verses 14–15), still standing when the book was written. The words “stone of” are the King James' own addition: the Hebrew here reads “great” and the word *Abel*. The Greek translation reads “to the great stone, on which they placed the ark,” and the Hebrew lexicon counts this verse with verses 14 and 15 as the “great stone” where the ark rested, noting that the Hebrew text has *Abel* in its place.
    sources: [bdb, lxx-rahlfs]
  - ref: 19
    phrase: because they had looked into the ark of the LORD
    kind: history
    title: What the men of Beth-shemesh did
    body: |
      The men of Beth-shemesh were struck for the way they looked at the ark, and exactly what they did is not clear. If merely seeing it were the offense, all would have been smitten, and they had all “rejoiced to see it” (verse 13). The Hebrew word translated “looked” has been explained as “to look upon or at a thing with lust or malicious pleasure,” and since the ark's lid was solid gold and the ark itself plated with gold, it is possible they looked on it with covetous eyes, or on the golden tumors and mice sent with it.

      The law had drawn a line at gazing. At Sinai the LORD told Moses to keep the people back “lest they break through unto the Lord to gaze, and many of them perish” ([[Ex. 19:21]]), and the Kohathites who carried the holy things “shall not go in to see when the holy things are covered, lest they die” ([[Num. 4:20]]; the site's note there explains the phrase). Josephus tells it as men who were not priests coming close to the ark they were not worthy to touch.
    sources: [ot-manual-1-samuel-1, josephus-antiquities, lds-scriptures]
  - ref: 19
    phrase: fifty thousand and threescore and ten men
    kind: history
    title: How many died?
    body: |
      The number in the King James, 50,070, appears not to be what the writer first put down. The Hebrew reads literally “seventy men, fifty thousand men,” which “is not a proper Hebrew expression for 50,070,” and the “fifty thousand men” “appears to be an added phrase, or gloss.” Josephus says seventy died.

      Whatever the count, verse 19 says plainly what mattered to the people: “the LORD had smitten many of the people with a great slaughter,” and they mourned.
    sources: [ot-manual-1-samuel-1, josephus-antiquities]

christ: |
  The word the Philistine priests use for their golden gift, *ʾāšām*, is the word Isaiah uses of the suffering servant: “thou shalt make his soul an offering for sin” ([[Isa. 53:10]]). There the servant offers himself as the payment for the people's sins, standing in their place (see the note on that verse). The men of Beth-shemesh asked “Who is able to stand before this holy LORD God?” and sent the ark away; Hebrews says disciples have “boldness to enter into the holiest by the blood of Jesus” ([[Heb. 10:19]]), “by a new and living way, which he hath consecrated for us” ([[Heb. 10:20]]).

  God's holiness has not changed since Beth-shemesh. A disciple comes into His presence through the offering Christ made of Himself.

