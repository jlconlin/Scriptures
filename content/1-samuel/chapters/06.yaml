  - **Holiness that must not be looked on or touched.** [[Ex. 19:21]], [[Num. 4:15–20]], then [[2 Sam. 6:6–7]].
  - **The trespass offering.** [[Lev. 5:14–6:7]] beside verses 3–8 here, and [[Isa. 53:10]].

