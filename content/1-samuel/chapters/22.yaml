chapter: 22
title: Every One That Was in Distress
tagline: David gathers his family and four hundred men at the cave Adullam and lodges his parents in Moab; at Gibeah Doeg tells Saul of Nob, and Saul has the priests and their city put to the sword; Abiathar alone escapes to David.
when: 'While David fled from Saul'

setting: |
  Chapter 21 brought David, alone and in flight, to Nob, a priestly city in Benjamin where the tabernacle stood for a time, and then to the Philistine court at Gath, where he escaped Achish by feigning madness ([[1 Sam. 21:10–15]]; the title of [[Ps. 34]] remembers that day). Chapter 22 takes up the two threads left hanging there. One is David himself, who now has nowhere in Saul's kingdom to live: he goes to a cave near Adullam in Judah, then to Moab, then, at a prophet's word, back into Judah. The other is a man who “was there that day” at Nob, “Doeg, an Edomite, the chiefest of the herdmen that belonged to Saul” ([[1 Sam. 21:7]]), who saw the priest feed and arm David.

  Several psalm titles place songs in these weeks: Psalm 52 “when Doeg the Edomite came and told Saul,” and Psalms 57 and 142 in “the cave,” which may be Adullam or the cave of chapter 24 (the site's notes on those titles set the two side by side). Here too David's following begins, the company that will be with him through the rest of the book.

thread: |
  The chapter moves between two companies. At the cave, the men who gather to David are the distressed, the indebted and the bitter of soul, and he becomes their captain. A prophet, Gad, speaks to him and sends him back into Judah. At Gibeah, Saul sits under a tree with his spear in his hand and his own tribesmen standing round him, and accuses them all of conspiring with his son and with Jesse's son.

  Doeg's report turns the suspicion on the priests. Ahimelech's answer is a plain defence of David and of himself, and Saul answers it with a death sentence. His own footmen will not lift a hand against “the priests of the LORD”; the foreigner Doeg will, and Nob is put to the sword. At the end the two companies meet. The one priest who escapes, Abiathar, comes to David, and David owns his part in the slaughter and takes Abiathar under his protection: “with me thou shalt be in safeguard.” From here on David has with him both a prophet who brings him the LORD's word and a priest who can enquire of the LORD for him.

sections:
  - range: 1-5
    heading: The cave and the stronghold
    plain: |
      So David left Gath and escaped to the cave of Adullam. When his brothers and all his father's family heard of it, they went down there to join him. Everyone who was in trouble, everyone who was in debt, and everyone who was bitter about his lot gathered to him, and he became their captain; about four hundred men were with him. From there David went to Mizpeh in Moab and said to the king of Moab, “Please let my father and mother come and stay with you until I know what God will do for me.” He left them with the king of Moab, and they stayed with him the whole time David was in the stronghold. Then the prophet Gad said to David, “Do not stay in the stronghold; leave, and go into the land of Judah.” So David left and went to the forest of Hareth.
  - range: 6-10
    heading: Saul accuses his servants
    plain: |
      Word reached Saul that David and his men had been found. Saul was sitting at Gibeah under the tamarisk tree on the height, spear in hand, with all his servants standing around him. He said to them, “Hear me, Benjamites. Do you think the son of Jesse will hand out fields and vineyards to each of you, and make every one of you an officer over a thousand or a hundred men, that you have all plotted against me? Not one of you told me when my son made a covenant with the son of Jesse. Not one of you feels for me or warns me that my son has set my servant to lie in wait for me, as he does today.” Then Doeg the Edomite, who was in charge of Saul's servants, answered, “I saw the son of Jesse come to Nob, to Ahimelech son of Ahitub. Ahimelech asked the LORD for guidance for him, gave him provisions, and gave him the sword of Goliath the Philistine.”
  - range: 11-19
    heading: The priests of Nob
    plain: |
      The king sent for the priest Ahimelech son of Ahitub and all his family, the priests at Nob, and they all came to the king. Saul said, “Listen, son of Ahitub.” “Here I am, my lord,” he answered. Saul said, “Why have you and the son of Jesse conspired against me? You gave him bread and a sword and asked God for guidance for him, so that he has risen against me to lie in wait, as he does today.” Ahimelech answered the king, “Who among all your servants is as faithful as David, the king's own son-in-law, who goes at your bidding and is honored in your house? Was that day the first time I asked God for guidance for him? Far be it from me! Let the king not accuse your servant or any of my father's family, for your servant knew nothing at all about this.” But the king said, “You will surely die, Ahimelech, you and all your father's family.” Then the king said to the guards standing around him, “Turn and kill the priests of the LORD, because they too sided with David; they knew he was running away and did not tell me.” But the king's servants would not raise a hand against the priests of the LORD. So the king said to Doeg, “You turn and strike down the priests.” Doeg the Edomite turned on the priests and cut them down: eighty-five men who wore the linen ephod died that day. Then he put Nob, the priests' city, to the sword, sparing neither man nor woman, child nor nursing baby, nor the oxen, the asses and the sheep.
  - range: 20-23
    heading: Abiathar escapes to David
    plain: |
      But one son of Ahimelech son of Ahitub, named Abiathar, escaped and fled to join David. He told David that Saul had killed the priests of the LORD. David said to Abiathar, “I knew that day, when Doeg the Edomite was there, that he would be sure to tell Saul. I have brought about the death of everyone in your father's house. Stay with me and don't be afraid. The man who wants my life wants yours too, but you will be safe with me.”

notes:
  - ref: 1
    phrase: escaped to the cave Adullam
    kind: history
    title: Adullam, a place of refuge
    body: |
      David's first refuge after Gath was a cave at Adullam, a town of Judah listed beside Jarmuth, Socoh and Azekah among the cities of Judah's inheritance ([[Josh. 15:35]]). Leaving Gath, he went back into his own tribe's country, and his family came down to him there.

      Scripture remembers the place as a hiding place. In a later story three of David's mighty men “came to David in the harvest time unto the cave of Adullam” while “David was then in an hold” and the Philistines held Beth-lehem ([[2 Sam. 23:13–14]]). Centuries afterward Micah, lamenting the towns of Judah before an invading army, says “he shall come unto Adullam the glory of Israel” ([[Micah 1:15]]). The meaning of the line is unclear, but on one Latter-day Saint reading Micah is evoking David's story: in both narratives “Adullam has a sense of refuge in the face of trouble,” and the people of Judah are about to become refugees as David was.
    sources: [lds-scriptures, pierce-micah]

  - ref: 2
    phrase: every one that was discontented
    kind: words
    title: Bitter of soul
    body: |
      The third group in the verse is in Hebrew *mar nepeš*, literally bitter of soul, a phrase for a person's feeling or temper; at this verse it has the sense the King James gives it, “discontented.” The men who gathered to David were the distressed, the indebted and the embittered.

      Out of them David made a fighting company. The verse says “he became a captain over them,” about four hundred men; by the time he leaves Keilah they are “about six hundred” ([[1 Sam. 23:13]]), and they are with him through the rest of the book.
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 3
    phrase: Mizpeh of Moab
    kind: history
    title: Why Moab
    body: |
      David put his father and mother out of Saul's reach with a neighbour who would shelter them. Moab was akin to Israel, but the two peoples were usually at war, and Saul himself had fought against Moab ([[1 Sam. 14:47]]). That made Saul's enemy a safe host: the king of Moab was “no particular friend to Israel,” but “his primary hatred was of Saul,” and David's arrangement was a precaution in case Saul tried to punish his parents or force them to tell where their son was.

      There was a family tie as well. Ruth the Moabitess was the mother of Obed, “the father of Jesse, the father of David” ([[Ruth 4:17]]), and one older reading takes that kinship as what chiefly led David to choose Moab. Mizpeh of Moab is named nowhere else, and where it stood is uncertain. “The hold” of verses 4 and 5 is a stronghold, apparently this Mizpeh; David's own words for the stay are “till I know what God will do for me.”
    sources: [bd-moab, ot-manual-1-samuel-16, cambridge-1-samuel, lds-scriptures]

  - ref: 5
    phrase: the prophet Gad
    kind: history
    title: Gad the seer
    body: |
      Gad appears here for the first time: “a prophet and faithful friend and adviser of David.” Late in David's reign it is Gad who brings him the word of the LORD after the numbering of the people, where he is called “the prophet Gad, David's seer” ([[2 Sam. 24:11]]). He also wrote a book of the acts of David ([[1 Chr. 29:29]]), and the Bible Dictionary names writings by Gad, with Samuel's and Nathan's, among the records the unknown writer of Samuel drew on (see the setting of [[1 Sam. 1]]).

      His first word to David is a command to leave the safety of the stronghold for the land of Judah, and David obeys it.
    sources: [bd-gad, bd-samuel-books, lds-scriptures]

  - ref: 7
    phrase: Hear now, ye Benjamites
    kind: history
    title: Saul's court under the tamarisk
    body: |
      Saul holds court at Gibeah, his home ([[1 Sam. 10:26]]), among his own tribe, and he accuses his kinsmen of siding with a man of Judah. The Church's footnote gives “was sitting” for “abode,” and “in Ramah” here is perhaps not the town of that name but the noun *rāmâ*, “height, high-place,” and the text should probably read *bāmâ*, “high place.” On either reading Saul sat under the tree on a height at Gibeah, not at Samuel's Ramah. The tree is a tamarisk, possibly a sacred tree marking a shrine, and the lexicon sets beside this verse the other tamarisk in Saul's story, the one under which he and his sons are buried at Jabesh ([[1 Sam. 31:13]], “under a tree”). The spear in his hand is the same Hebrew word the King James renders “javelin” when Saul hurled it at David ([[1 Sam. 18:11]]; [[1 Sam. 19:10]]).

      Saul's appeal is to tribe. He was a Benjamite ([[1 Sam. 9:21]]); David is the son of “that Ephrathite of Beth-lehem-judah” ([[1 Sam. 17:12]]). Will the son of Jesse give Benjamites fields and vineyards and commands? The charge that none of them told him when his son made a “league” (the footnote: “covenant, agreement”) with David points to Jonathan's covenant ([[1 Sam. 18:3]]; [[1 Sam. 20:16]]).
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 15
    phrase: Did I then begin to inquire of God for him?
    kind: history
    title: Ahimelech's answer
    body: |
      Ahimelech's defence is that he did nothing new and knew of no plot. Chapter 21 does not mention his enquiring of the LORD for David, but Doeg reports it (verse 10), Saul repeats it (verse 13), and Ahimelech does not deny it. One older reading puts the stress on his question as “That day did I begin…?”: he pleads that there was no harm in doing for the king's trusted servant what he had often done before.

      His praise of David in verse 14 is the court's own picture of him: faithful, the king's son-in-law, honoured in his house, and one who “goeth at thy bidding,” which the same older reading takes as probably one who has access to the king's audience, a trusted councillor. And Ahimelech “knew nothing of all this, less or more” because David had told him he was on the king's business ([[1 Sam. 21:2]]); another older reading has him answering calmly as one not conscious of any crime, since David had come to him with a false pretext. How a priest enquired of the LORD is taken up at [[1 Sam. 23:9]].
    sources: [cambridge-1-samuel, keil-1-samuel, lds-scriptures]

  - ref: 18
    phrase: fourscore and five persons that did wear a linen ephod
    kind: history
    title: Doeg and the priests of Nob
    body: |
      Saul's own guard refused to kill the priests, and the one man who would was a foreigner. The footmen “would not put forth their hand to fall upon the priests of the LORD” (verse 17). Doeg the Edomite had been at Nob, “detained before the LORD,” the day David came ([[1 Sam. 21:7]]), and now stood among Saul's servants; at Saul's word he killed eighty-five priests.

      The narrator names the dead by what they wore. The linen ephod is the garment of those who served before the LORD: the boy Samuel “ministered before the LORD … girded with a linen ephod” ([[1 Sam. 2:18]]), and the Church's footnote here points to the priestly garments of [[Ex. 28:4]] and to the LORD's words to Eli about the priest He chose “to wear an ephod before me” ([[1 Sam. 2:28]]). Saul's own order calls them “the priests of the LORD,” and the footmen refuse in the same words (verse 17); Abiathar's report to David is that Saul “had slain the LORD's priests” (verse 21).

      The title of [[Ps. 52]] sets that psalm “when Doeg the Edomite came and told Saul,” and the note on that title tells the same story from Doeg's side.
    sources: [lds-scriptures]

  - ref: 19
    phrase: both men and women, children and sucklings
    kind: history
    title: What Saul would not do to Amalek
    body: |
      Saul put Nob to the sword in nearly the words of the command he had been given against Amalek and had not carried out, which named the same people, down to the nursing infants, and the flocks and herds with them ([[1 Sam. 15:3]]; the ban is explained there). The dead were “innocent persons who knew nothing of his problems with David.” One older reading draws the contrast with Amalek plainly: Saul “wreaked upon an innocent city in his own kingdom the vengeance he had failed to execute upon a guilty heathen nation at God's command.” Another reads the destruction as treating Nob like a city under the ban, Saul so identifying “his private revenge with the cause of Jehovah” that a supposed plot against himself was punished as treason against God.

      The dead were also Eli's house. The Church's footnote at verse 18 points to [[1 Sam. 14:3]], where Ahiah “the son of Ahitub, I-chabod's brother, the son of Phinehas, the son of Eli” wears the ephod; that Ahiah and Ahimelech are probably one man is explained at [[1 Sam. 21:1]]. The LORD had told Eli that his house would be cut off ([[1 Sam. 2:31]]), and on the first of these older readings the slaughter at Nob is a further fulfilment of that word.
    sources: [ot-manual-1-samuel-16, cambridge-1-samuel, keil-1-samuel, lds-scriptures]

  - ref: 20
    phrase: named Abiathar, escaped, and fled after David
    kind: history
    title: Abiathar, the one who escaped
    body: |
      One son of Ahimelech survived, and he became David's priest. When Abiathar reached David he “came down with an ephod in his hand” ([[1 Sam. 23:6]]), and through the years of flight David enquired of the LORD by him ([[1 Sam. 23:9]]; [[1 Sam. 30:7]]). He brought the ark back to Jerusalem in the days of Absalom's rebellion ([[2 Sam. 15:24–29]]), and was finally thrust out of the priesthood by Solomon after siding with Adonijah, in fulfilment of the word against Eli's house ([[1 Kgs. 2:27]]; the faithful priest who replaced that line is at [[1 Sam. 2:35]]).
    sources: [bd-abiathar, lds-scriptures]

  - ref: 22
    phrase: I have occasioned the death of all the persons of thy father’s house
    kind: history
    title: I have occasioned the death
    body: |
      David takes the deaths at Nob on himself. He had seen Doeg at Nob that day ([[1 Sam. 21:7]]), and he had told Ahimelech that he came on the king's business ([[1 Sam. 21:2]]), so the priest helped him without knowing he was helping a fugitive. Now David says what he had foreseen: “I knew it that day … that he would surely tell Saul.” The text gives no other comment on the deception; it lets David's own words stand.

      What David can still do, he does. Abiathar's enemy and his are the same man, “he that seeketh my life seeketh thy life,” and the fugitive offers the priest the only safety he has to give: “with me thou shalt be in safeguard.”
    sources: [lds-scriptures]

christ: |
  David in this chapter is a hunted man in a cave who still offers others safety: “with me thou shalt be in safeguard.” A psalm whose title puts him “in the cave” says where his own refuge lay: when “no man cared for my soul,” he cried, “Thou art my refuge and my portion in the land of the living” ([[Ps. 142:4–5]]). The LORD he cried to is Jehovah, the premortal Jesus Christ, who in mortality called the burdened to Himself: “Come unto me, all ye that labour and are heavy laden, and I will give you rest” ([[Matt. 11:28]]).

  A disciple who is in distress, weighed down or bitter of soul, and finds that no one cares, has the refuge David had: the Lord, who receives the heavy laden and gives them rest.

explore: |
  - **The psalms of these days.** [[Ps. 52]] (Doeg), [[Ps. 57]] and [[Ps. 142]] (the cave), and [[Ps. 34]] and [[Ps. 56]] (Gath).
  - **What became of the four hundred.** [[1 Sam. 23:1–13]], the rescue of Keilah; [[2 Sam. 23:13–17]], the water from the well of Beth-lehem.
  - **Abiathar's later story.** [[2 Sam. 15:24–29]]; [[1 Kgs. 1:7]]; [[1 Kgs. 2:26–27]].

