chapter: 14
title: The LORD Saved Israel That Day
tagline: Jonathan and his armourbearer climb to the Philistine garrison and the LORD sends a panic through the camp; Saul binds the army with an oath not to eat, Jonathan unknowingly breaks it, and the people save him from his father's sentence.
when: 'In the Philistine war at Michmash, “when he had reigned two years” (1 Sam. 13:1)'

setting: |
  Chapter 13 left Israel in a strait. Jonathan had struck the Philistine garrison at Geba, and the Philistines answered by gathering at Michmash in great numbers. Many Israelites hid in caves, thickets and pits, and some fled over the Jordan ([[1 Sam. 13:6–7]]). At Gilgal Saul offered the burnt offering himself, and Samuel told him that his kingdom would not continue ([[1 Sam. 13:13–14]]; the offering is explained there). Saul was left at Gibeah with about six hundred men, and only he and Jonathan had sword or spear, because the Philistines had kept smiths out of Israel ([[1 Sam. 13:19–22]]). The chapter ends with the Philistine garrison moving out to “the passage of Michmash” ([[1 Sam. 13:23]]).

  Chapter 14 is the battle that followed, in which Jonathan and Saul led Israel to victory. Its second half is Saul's oath and what came of it (verses 24–45), one of the main events of his reign. It closes with a list of Saul's wars and household (verses 47–52).

thread: |
  The chapter sets two men side by side. Jonathan goes up against a garrison with one companion because “there is no restraint to the LORD to save by many or by few” (verse 6), and he sets a sign so that the LORD can show whether He is with them. The LORD answers with a trembling that runs through the whole Philistine camp, and the narrator gives Him the victory: “So the LORD saved Israel that day” (verse 23). Jonathan is “a young man of great faith in God,” and his venture “was not foolhardy but was based on faith and courage.”

  Saul seeks the LORD's help too, but on his own terms. He begins to inquire through the priest and breaks off when the uproar in the Philistine camp grows: “Withdraw thine hand” (verse 19). Then he binds his army with a curse on anyone who eats before evening, “that I may be avenged on mine enemies” (verse 24), an effort to win the LORD's help that goes wrong. The hungry army faints, then falls on the spoil and eats meat with the blood; God gives no answer; and Saul swears that the guilty man will die, “though it be in Jonathan my son” (verse 39). The people end it. Jonathan, they say, “hath wrought with God this day” (verse 45).

sections:
  - range: 1-5
    heading: Jonathan goes out without telling his father
    plain: |
      One day Jonathan, Saul's son, said to the young man who carried his armour, “Come, let's go over to the Philistine garrison on the other side.” But he did not tell his father. Saul was staying at the edge of Gibeah under a pomegranate tree in Migron, with about six hundred men. With them was Ahiah, son of Ahitub, the brother of Ichabod, son of Phinehas, son of Eli, the LORD's priest at Shiloh; Ahiah was wearing an ephod. No one knew that Jonathan had gone. In the pass that Jonathan meant to cross to reach the garrison there was a sharp crag on each side, one called Bozez and the other Seneh. One rose on the north, facing Michmash, and the other on the south, facing Gibeah.
  - range: 6-15
    heading: Two men climb to the garrison
    plain: |
      Jonathan said to his armourbearer, “Come, let's go over to the garrison of these uncircumcised men. It may be that the LORD will work for us, for nothing keeps the LORD from saving, whether by many or by few.” His armourbearer answered, “Do all that is in your heart. Go ahead; I am with you in whatever you decide.” Jonathan said, “We will cross over to these men and let them see us. If they say, ‘Wait until we come to you,’ we will stay where we are and not go up to them. But if they say, ‘Come up to us,’ we will go up, for the LORD has given them into our hand. That will be our sign.” So the two of them showed themselves to the garrison, and the Philistines said, “Look, the Hebrews are coming out of the holes where they have been hiding.” The men of the garrison called to Jonathan and his armourbearer, “Come up to us, and we'll show you something.” Jonathan said to his armourbearer, “Come up after me, for the LORD has given them into the hand of Israel.” Jonathan climbed up on his hands and feet, with his armourbearer behind him. The Philistines fell before Jonathan, and his armourbearer killed them as he followed. In that first attack the two of them killed about twenty men within about half an acre, the ground a yoke of oxen might plow. Then trembling seized the camp, the field and all the people; the garrison and the raiding parties trembled too, and the earth shook. It was a very great trembling.
  - range: 16-23
    heading: The Philistine camp breaks
    plain: |
      Saul's watchmen at Gibeah of Benjamin looked, and saw the mass of Philistines melting away as they went on striking one another. Saul said to the people with him, “Count, and see who has left us.” When they counted, Jonathan and his armourbearer were missing. Saul said to Ahiah, “Bring the ark of God here,” for the ark of God was with the Israelites at that time. But while Saul was talking to the priest, the uproar in the Philistine camp kept growing, and Saul said to the priest, “Withdraw your hand.” Saul and all his people gathered and went into the battle, and they found the Philistines in great confusion, every man's sword against his fellow. The Hebrews who had been with the Philistines before, who had gone up with them into the camp from the country around, turned to join the Israelites with Saul and Jonathan. And all the Israelites who had hidden in the hill country of Ephraim, hearing that the Philistines were fleeing, joined the pursuit. So the LORD saved Israel that day, and the battle spread past Beth-aven.
  - range: 24-30
    heading: Saul's oath and Jonathan's honey
    plain: |
      The men of Israel were hard pressed that day, because Saul had put the people under an oath: “Cursed be the man who eats any food before evening, until I have been avenged on my enemies.” So none of the people tasted food. The whole army came into a wood where there was honey on the ground. When they came into the wood, the honey was dripping, but no one put his hand to his mouth, for the people feared the oath. Jonathan had not heard his father put the people under the oath. He reached out the end of the staff in his hand, dipped it in a honeycomb, and put his hand to his mouth, and his eyes brightened; he was refreshed. Then one of the men said, “Your father strictly bound the people with an oath: ‘Cursed be the man who eats any food today.’” And the people were faint. Jonathan said, “My father has brought trouble on the land. See how my eyes have brightened because I tasted a little of this honey. How much better if the people had eaten freely today of the spoil they took from their enemies! Wouldn't the slaughter of the Philistines have been much greater?”
  - range: 31-35
    heading: The people eat with the blood
    plain: |
      That day they struck down the Philistines from Michmash to Aijalon, and the people were exhausted. They rushed on the spoil, took sheep, oxen and calves, slaughtered them on the ground, and ate them with the blood. Saul was told, “Look, the people are sinning against the LORD by eating with the blood.” He said, “You have broken faith. Roll a great stone to me here, now.” Then Saul said, “Go out among the people and tell them, ‘Each of you bring me his ox and his sheep, and slaughter them here and eat; do not sin against the LORD by eating with the blood.’” That night every man brought his ox and slaughtered it there. And Saul built an altar to the LORD; it was the first altar he built to the LORD.
  - range: 36-46
    heading: God is silent, and the lot falls on Jonathan
    plain: |
      Saul said, “Let us go down after the Philistines by night and plunder them until morning, and leave not one of them.” The people answered, “Do whatever seems good to you.” But the priest said, “Let us draw near to God here.” So Saul asked God, “Shall I go down after the Philistines? Will You give them into the hand of Israel?” But God did not answer him that day. Saul said, “Come here, all you leaders of the people, and find out what sin has been committed today. As surely as the LORD lives, who saves Israel, even if it is in my son Jonathan, he shall surely die.” Not one of the people answered him. Then he said to all Israel, “You stand on one side, and I and my son Jonathan will stand on the other.” The people said to Saul, “Do what seems good to you.” So Saul said to the LORD God of Israel, “Give the right answer.” The lot took Saul and Jonathan, and the people went free. Saul said, “Cast the lot between me and my son Jonathan,” and Jonathan was taken. Saul said to Jonathan, “Tell me what you have done.” Jonathan told him: “I only tasted a little honey with the end of the staff in my hand. And now I must die.” Saul answered, “God do so to me, and more also: you shall surely die, Jonathan.” But the people said to Saul, “Shall Jonathan die, who has brought about this great deliverance in Israel? Far from it! As surely as the LORD lives, not one hair of his head shall fall to the ground, for he has worked with God today.” So the people rescued Jonathan, and he did not die. Then Saul gave up the pursuit of the Philistines, and the Philistines went back to their own land.
  - range: 47-52
    heading: Saul's wars and household
    plain: |
      So Saul took hold of the kingship over Israel. He fought against all his enemies on every side: against Moab, the Ammonites, Edom, the kings of Zobah and the Philistines, and wherever he turned he troubled them. He gathered an army, struck the Amalekites, and delivered Israel from those who plundered them. Saul's sons were Jonathan, Ishui and Melchi-shua; his two daughters were Merab, the elder, and Michal, the younger. Saul's wife was Ahinoam, daughter of Ahimaaz. The commander of his army was Abner, son of Ner, Saul's uncle. Kish was Saul's father, and Ner, Abner's father, was the son of Abiel. There was hard war against the Philistines all of Saul's days, and whenever Saul saw a strong or valiant man, he took him into his service.

notes:
  - ref: 6
    phrase: there is no restraint to the LORD to save by many or by few
    kind: scripture
    title: By many or by few
    body: |
      Jonathan's reason for going is what the LORD can do, not what two men can do. He does not presume on it (“it may be that the LORD will work for us”), and in verses 8–10 he lets the Philistines' own words show whether the LORD has given them into his hand. He and his servant went up trusting in the LORD, and the narrator gives the LORD the victory: “So the LORD saved Israel that day” (verse 23).

      The Church's footnote to “few” sends the reader to Gideon's three hundred ([[Judg. 7:4–7]]), and the reason given there fits Jonathan's words: the LORD made Gideon's army smaller on purpose, “lest Israel vaunt themselves against me, saying, Mine own hand hath saved me” ([[Judg. 7:2]]). The footnote to verse 20 points to the same battle: in Midian's camp too “the LORD set every man's sword against his fellow” ([[Judg. 7:22]]).
    sources: [ot-seminary-lesson-85, lds-scriptures]

  - ref: 15
    phrase: so it was a very great trembling
    kind: words
    title: A trembling from God
    body: |
      In Hebrew the verse ends with *ḥerdat ʾĕlōhîm*, literally a trembling of God, which the King James renders “a very great trembling.” The noun is the trembling of terror, here terror “ascribed to supernatural cause”; the same verse sets the earth's quaking beside it. Two men had killed about twenty; the verse lays the panic that emptied the camp to God. Jonathan's attack, “combined with an earthquake that followed, caused confusion and panic in the Philistine army.”
    sources: [oshb-wlc, bdb, ot-seminary-lesson-85]

  - ref: 18
    phrase: Bring hither the ark of God
    kind: history
    title: The ark or the ephod?
    body: |
      The Hebrew text, which the Aramaic, Syriac and Latin versions follow, has Saul call for the ark, but the Septuagint, the ancient Greek translation, has him call for the ephod: “Bring the ephod; for he wore the ephod in that day before Israel.” The two readings matter for what Saul was doing. The ark had been left at Kirjath-jearim ([[1 Sam. 7:1–2]]), and the Greek has more in its favour: inquiry of God was made through the ephod with the Urim and Thummim (see the note on verse 41), and “bring hither” is the expression used for fetching the ephod elsewhere ([[1 Sam. 23:9]]; [[1 Sam. 30:7]]). On that reading the notice in verse 3 that the priest Ahiah was “wearing an ephod” prepares for this verse.

      Either way, Saul was seeking an answer from the LORD, and he did not wait for it. When the uproar in the Philistine camp grew, he told the priest, “Withdraw thine hand” (verse 19), which one older reading takes as “Desist from the inquiry.” Later that day he would ask again and get no answer at all (verse 37).
    sources: [lxx-rahlfs, keil-1-samuel, cambridge-1-samuel, lds-scriptures]

  - ref: 24
    phrase: Cursed be the man that eateth any food until evening, that I may be avenged on mine enemies
    kind: history
    title: Saul's oath
    body: |
      Saul put the whole army under a curse: no one was to eat until evening. It was “a misguided effort to get help from the Lord and prevail over his enemies.” Saul meant it as a kind of fast to win the LORD's help, but he backed it with death for anyone who broke it, and he set it in the middle of a pursuit, so that the army fought on empty stomachs. In one Latter-day Saint reading the threat of death was “excessive and totally undeserved” and “meant to prove Saul's devotion,” and Saul's own words point the same way: the fast was “that I may be avenged on mine enemies.”

      The rest of the day shows what it cost. The army fought hungry and was “distressed” (verse 24) and “faint” (verses 28, 31). Jonathan, who had not heard the oath, ate a little honey, was refreshed, and said what it had done: “My father hath troubled the land” (verse 29); the victory, he thought, would have been greater if the people had eaten (verse 30). By evening the hungry army was eating meat with the blood (verse 32).
    sources: [ot-seminary-lesson-85, ellsworth-tragic-saul]

  - ref: 32
    phrase: the people did eat them with the blood
    kind: scripture
    title: Eating with the blood
    body: |
      The law forbade eating blood because Israel regarded the blood as the seat of an animal's life ([[Lev. 17:10–14]]), and the rule runs from Noah ([[Gen. 9:4]]) to the apostles' council at Jerusalem ([[Acts 15:20]]). The law gave the reason: “the life of the flesh is in the blood: and I have given it to you upon the altar to make an atonement for your souls” ([[Lev. 17:11]]). The blood belonged to the altar.

      The starving army killed the animals “on the ground” and ate them without draining the blood. Saul acted at once. He had a great stone rolled to him, had every man bring his animal to be slaughtered there properly, and built an altar to the LORD, “the first altar that he built unto the LORD” (verse 35).
    sources: [bd-blood, ellsworth-tragic-saul, lds-scriptures]

  - ref: 37
    phrase: But he answered him not that day
    kind: history
    title: God gives no answer
    body: |
      When Saul asked the LORD whether to pursue the Philistines, no answer came. Asking was the practice: “The Israelites consulted the Lord on matters of war,” and when His commands were followed He aided them in battle. This time the priest proposed the inquiry (“Let us draw near hither unto God,” verse 36), and Saul asked. Saul took the silence to mean that someone in the army had sinned, and he swore that the guilty man would die, even if it were Jonathan (verse 39). In one Latter-day Saint reading he “blamed his separation from the Lord on the broken fast instead of on his own disobedience.”
    sources: [sc-knowhy-572, ot-seminary-lesson-85, ellsworth-tragic-saul]

  - ref: 41
    phrase: Give a perfect lot
    kind: history
    title: A perfect lot
    body: |
      The Hebrew is two words, *hābâ tāmîm*, literally give *tāmîm*, an obscure phrase found nowhere else; the King James' “a perfect lot” and the footnote's “Bring forth right” both take it as a prayer that the lot show the truth. The Septuagint has a much longer prayer here: “why hast thou not answered thy servant this day? is the iniquity in me, or in Jonathan my son? Lord God of Israel, give clear manifestations.” Several scholars take the Greek as preserving the original, which one older commentary renders, with some emendation, “give Urim … give Thummim,” and they read *tāmîm* as *tummîm*, Thummim; the standard Hebrew lexicon lists the verse under that word. If that is right, Saul was inquiring through the Urim and Thummim, “an instrument prepared of God to assist man in obtaining revelation from the Lord,” used by “Aaron and the priests of Israel.” The Hebrew as it stands implies only the ordinary lot, and the other reading is a proposal, not a certainty.

      Either way, the lot did what Saul asked. It passed over the people, took Saul and Jonathan, and then took Jonathan (verse 42), who told the truth at once: “I did but taste a little honey” (verse 43).
    sources: [oshb-wlc, lxx-rahlfs, cambridge-1-samuel, keil-1-samuel, bdb, bd-urim-and-thummim, lds-scriptures]

  - ref: 45
    phrase: So the people rescued Jonathan, that he died not
    kind: history
    title: Was Jonathan guilty?
    body: |
      The lot had shown that Jonathan broke the oath, and Saul answered with a self-curse: “God do so and more also” (verse 44), a formula Israelites used when taking an oath, signifying that the speaker expected to be cursed if he did not keep it. The people would not let him. They answered with Saul's own words, “as the LORD liveth” (verse 39): Jonathan had “wrought this great salvation in Israel,” and “he hath wrought with God this day.”

      In one older reading, the people judged rightly. “What Jonathan had done was not wrong in itself, but became so simply on account of the oath with which Saul had forbidden it,” and he “had not even consciously transgressed.” Saul had issued the prohibition “without divine authority,” and the victory was a divine verdict: “it was not Jonathan, but he himself, who had sinned.”
    sources: [parker-cutting, ot-manual-1-samuel-1]

christ: |
  Jonathan's confidence was in the LORD, who has no restraint “to save by many or by few” (verse 6), and the chapter gives Him the victory: “So the LORD saved Israel that day” (verse 23). That LORD is Jehovah, the premortal Jesus Christ ([[Ex. 3:14]]). The law Saul enforced at the great stone kept the blood for the altar ([[Lev. 17:11]]), and the sacrifice it served “was a type of the great sacrifice who is Jesus Christ.”

  Deliverance still comes from Him and not from numbers or strength, and a disciple with little in hand can act in faith that He will work for him. His help is not won by vows of a disciple's own devising, which can trouble the very people they were meant to protect; Jonathan looked for it in trust, and the LORD worked for him.

explore: |
  - **Faith against the odds.** [[Judg. 7:2–7]], Gideon's three hundred; [[1 Sam. 17:45–47]], David's “the battle is the LORD's.”
  - **The silence of God.** [[1 Sam. 28:6]], where it returns at the end of Saul's reign.
  - **The blood and the altar.** [[Lev. 17:10–14]]; [[Gen. 9:4]].
  - **Jonathan after this day.** [[1 Sam. 18:1–4]]; [[1 Sam. 20:1–17]]; [[1 Sam. 23:16–18]].

