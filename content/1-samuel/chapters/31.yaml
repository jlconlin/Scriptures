chapter: 31
title: So Saul Died, and His Three Sons
tagline: Israel breaks before the Philistines on mount Gilboa; Jonathan and two of his brothers are killed, and Saul, wounded by the archers, falls on his own sword; the Philistines hang the bodies on the wall of Beth-shan, and the men of Jabesh-gilead march all night to bring them home.
when: 'The day after the night at Endor, on mount Gilboa'

setting: |
  The chapter picks up the war that began in chapter 28, when the Philistines gathered at Shunem and Saul pitched on Gilboa ([[1 Sam. 28:4]]). Gilboa is the mountain ridge on the southeastern edge of the plain of Esdraelon, named for its many springs. The night before the battle Saul went in disguise to the woman at Endor, and there, in the narrative's words, Samuel gave him his sentence: “to morrow shalt thou and thy sons be with me” ([[1 Sam. 28:19]]; what came at Endor is taken up at [[1 Sam. 28:12]]).

  Between that night and this morning the story has followed David: sent home by the Philistine lords (chapter 29), he spent these same days recovering his people from the Amalekites (chapter 30). The two accounts run side by side, and 2 Samuel opens with the news of this battle reaching David at Ziklag ([[2 Sam. 1:1–4]]). The Church's footnote at verse 1 points to 1 Chronicles 10, which tells the battle again in nearly the same words and closes with a verdict of its own on why Saul died (see the note at verse 6).

thread: |
  The book that began with a woman asking for a son ends with a king and his sons dead on one field. Nothing in the chapter is a surprise: the sentence at Endor had said it the night before, and David had said years earlier that the LORD would deal with Saul, “or he shall descend into battle, and perish” ([[1 Sam. 26:10]]). Saul's own choices, made by the man he had become, brought on his death, the deaths of those he loved, and the end of all he had hoped for. The narrator tells it in thirteen verses without a word of comment: Saul's sons fall, the archers find him, and he takes his own life rather than be taken.

  The last word, though, is not the Philistines'. They make a show of the body, but the fighting men of the town Saul had rescued in his first days as king ([[1 Sam. 11:11]]) take the bodies down and bury them with a week of fasting. The king rejected by the LORD is buried with honor by the people he had once saved, most likely out of a gratitude they had never lost.

sections:
  - range: 1-7
    heading: The battle on Gilboa
    plain: |
      The Philistines fought against Israel, and the men of Israel fled before them and fell dead on mount Gilboa. The Philistines pressed hard after Saul and his sons, and they killed Jonathan, Abinadab and Malchi-shua, the sons of Saul. The battle went hard against Saul; the archers found him, and he was badly wounded by them. Saul said to his armourbearer, “Draw your sword and run me through with it, or these uncircumcised men will come and run me through and make sport of me.” But his armourbearer would not, because he was terrified. So Saul took the sword and fell on it. When his armourbearer saw that Saul was dead, he too fell on his sword and died with him. So Saul died that day, together with his three sons, his armourbearer and all his men. When the Israelites on the far side of the valley and those beyond the Jordan saw that the army of Israel had fled and that Saul and his sons were dead, they abandoned their towns and fled, and the Philistines came and lived in them.
  - range: 8-10
    heading: The Philistines and the bodies
    plain: |
      The next day, when the Philistines came to strip the dead, they found Saul and his three sons lying on mount Gilboa. They cut off his head and stripped off his armour, and sent word all through the land of the Philistines to carry the news to the houses of their idols and to the people. They put his armour in the temple of the Ashtaroth and fastened his body to the wall of Beth-shan.
  - range: 11-13
    heading: Jabesh-gilead remembers
    plain: |
      When the people of Jabesh-gilead heard what the Philistines had done to Saul, all their fighting men set out, marched all night, and took the bodies of Saul and his sons down from the wall of Beth-shan. They brought them to Jabesh and burned them there. Then they took their bones and buried them under the tree at Jabesh, and fasted seven days.

notes:
  - ref: 4
    phrase: lest these uncircumcised come and thrust me through, and abuse me
    kind: words
    title: Lest these uncircumcised … abuse me
    body: |
      Saul asked for death because he feared what would come before it: to be taken alive and made sport of. The Hebrew verb behind “abuse” (*ʿālal*) means to make a toy of someone, to deal with a person wantonly and ruthlessly; the same form of the verb is used of the LORD's making a toy of Egypt ([[Ex. 10:2]], “what things I have wrought in Egypt”), and of the men of Gibeah and the Levite's concubine ([[Judg. 19:25]]). A modern reader hears “abuse” as harm in general; Saul means mockery and torment for the enemy's amusement.

      “These uncircumcised” names the Philistines as the people outside Israel's covenant. On one older reading, that was what made the prospect intolerable: no indignity could be worse than for the LORD's anointed to become the butt of men who had no part in His covenant.
    sources: [oshb-wlc, bdb, cambridge-1-samuel]

  - ref: 4
    phrase: Therefore Saul took a sword, and fell upon it
    kind: history
    title: Saul took a sword, and fell upon it
    body: |
      This chapter says plainly that Saul died by his own hand. He was badly wounded by the archers, his sons were dead, and when he feared the Philistines would kill and abuse him, he took his own life. His armourbearer, who had refused to strike him, then fell on his own sword and died with him (verse 5). The narrator gives no judgment on the act itself; what scripture and the Church's sources judge is the life that led to it. Saul's downfall “shows the consequences of uncontrolled self-will and disobedience to counsel.”

      The Church's footnote at “fell” points ahead to [[2 Sam. 1:10]], where a young Amalekite tells David a different story: that he found Saul leaning on his spear and killed him at his request, and brought David the crown and bracelet. How the two accounts fit, and why David answered the man as he did, is taken up there.
    sources: [ot-seminary-lesson-89, bd-saul, lds-scriptures]

  - ref: 6
    phrase: So Saul died, and his three sons
    kind: scripture
    title: So Saul died
    body: |
      Scripture itself gives a reason for Saul's death beyond the events of the battle. Chronicles, telling this battle again, ends with a verdict this chapter leaves out: “So Saul died for his transgression which he committed against the Lord, even against the word of the Lord, which he kept not,” and for seeking a familiar spirit ([[1 Sam. 28:7]] takes that up), “therefore he slew him, and turned the kingdom unto David the son of Jesse” (1 Chr. 10:13–14). Its chapter heading puts it in a line: Saul “dies for his transgressions.”

      The Church's footnote at verse 5 points back to what David said when he stood over the sleeping Saul and would not let Abishai touch him: “the LORD shall smite him; or his day shall come to die; or he shall descend into battle, and perish” ([[1 Sam. 26:10]]). David left the end of the LORD's anointed to the LORD, and here it came in battle, as one of the three ways he had named.
    sources: [lds-scriptures]

  - ref: 10
    phrase: they fastened his body to the wall of Beth-shan
    kind: history
    title: The wall of Beth-shan
    body: |
      The Philistines made Saul's death a public triumph and carried it to their gods. They sent the news to “the house of their idols” (Chronicles: “to carry tidings unto their idols”), put his armour in the house of the Ashtaroth, idols that Israel itself had worshipped beside Baal ([[1 Sam. 7:3–4]]), and hung his body on the wall of Beth-shan. Chronicles adds that they fastened his head in the temple of Dagon (1 Chr. 10:10), the god whose image had fallen before the ark ([[1 Sam. 5:3–4]]; Dagon is taken up at [[1 Sam. 5:2]]).

      Beth-shan stood about three miles from the Jordan, on the edge of the plain of Jezreel and on the road from Damascus to Egypt. Israel had abandoned the towns of the valley and beyond the Jordan (verse 7), and the Philistines came and lived in them. In New Testament times it was Scythopolis, one of the cities of the Decapolis.
    sources: [bd-beth-shan, bd-ashtaroth, lds-scriptures]

  - ref: 11
    phrase: when the inhabitants of Jabesh-gilead heard
    kind: history
    title: The men of Jabesh-gilead
    body: |
      Jabesh-gilead owed Saul its life. It was a chief city of Gilead, east of the Jordan, and in the first days of his reign Saul had gathered Israel and rescued it from Nahash the Ammonite, apparently on the very day its men were to lose their right eyes ([[1 Sam. 11:11]]; the story is at [[1 Sam. 11:2]]). Most likely the town never forgot it. Its fighting men went into country the Philistines now held, marched through the night, and brought back the bodies of the man who had saved them, years after he had done it, at the risk of their own lives.

      The footnote at Jabesh-gilead points to [[2 Sam. 2:4]]. When David was anointed king in Hebron and was told what these men had done, he sent them messengers: “Blessed be ye of the LORD, that ye have shewed this kindness unto your lord, even unto Saul, and have buried him” ([[2 Sam. 2:5]]).
    sources: [bd-jabesh, sc-knowhy-855, lds-scriptures]

  - ref: 12
    phrase: came to Jabesh, and burnt them there
    kind: history
    title: Burnt them there
    body: |
      The text does not say why the men of Jabesh burned the bodies. One older reading starts from Israel's custom: the dead were buried, not burned, and burning was reserved for the worst criminals ([[Lev. 20:14]]). It finds the reason partly in the mutilation, the heads having been taken, and partly in the fear that the Philistines might follow their victory across the Jordan and desecrate the bodies further. On that reading it was not a burning to ashes, only of the flesh: the bones remained, and the men of Jabesh buried them under the tree (verse 13). Chronicles leaves the burning out and says only that they “buried their bones under the oak in Jabesh” (1 Chr. 10:12).

      The bones did not stay there. Years later David took the bones of Saul and Jonathan from the men of Jabesh-gilead and buried them in the tomb of Kish, Saul's father, in Benjamin ([[2 Sam. 21:12–14]]).
    sources: [keil-1-samuel, lds-scriptures]

  - ref: 13
    phrase: fasted seven days
    kind: history
    title: Fasted seven days
    body: |
      The fast was mourning. In Israel fasting was a religious and cultural response to sorrow, humiliation and burial, and Saul's death was mourned that way more than once: here by the men of Jabesh for seven days, and at Ziklag by David and his men, who “mourned, and wept, and fasted until even, for Saul, and for Jonathan his son” ([[2 Sam. 1:12]]).
    sources: [sc-knowhy-135]

christ: |
  The LORD whose word Saul did not keep is Jehovah, the premortal Jesus Christ ([[Ex. 3:14]]), and Chronicles says that in Saul's death He “turned the kingdom unto David” (1 Chr. 10:14).

  The men of Jabesh remembered the one who had saved them, years afterward and at the risk of their lives. Jesus Christ saves all people, and gratitude toward Him can be what Jabesh-gilead's was toward Saul, long-lasting and strong.

explore: |
  - **Saul's death told again.** [[2 Sam. 1:1–16]], the Amalekite's account; [[2 Sam. 1:17–27]], David's lament, “how are the mighty fallen.”
  - **Jabesh-gilead and Saul.** [[Judg. 21:8–14]]; [[1 Sam. 11:1–11]]; [[2 Sam. 2:4–7]]; [[2 Sam. 21:12–14]].

