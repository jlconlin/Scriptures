chapter: 26
title: Who Can Stretch Forth His Hand against the LORD's Anointed?
tagline: The Ziphites betray David a second time; David and Abishai steal into Saul's sleeping camp, and David again refuses to kill the LORD's anointed, taking only the king's spear and water jar; from a far hill he taunts Abner and pleads with Saul, who confesses that he has played the fool, and the two part for the last time.
when: 'While David fled from Saul, in the wilderness of Ziph'

setting: |
  Chapter 25 told of Nabal and Abigail and reported Samuel's death ([[1 Sam. 25:1]]); chapter 26 returns to Saul's pursuit where chapter 24 left it. The Ziphites, who had informed on David once already ([[1 Sam. 23:19]]), come again to Saul at Gibeah, and Saul goes down into the wilderness of Ziph with three thousand chosen men. The title of [[Ps. 54:0]] sets that psalm at the Ziphites' betrayal, and the note there tells the story.

  For the second time David has Saul at his mercy and lets him go: first in the cave at En-gedi, now in Saul's own camp. Why David will not lift his hand against “the LORD's anointed” is explained at [[1 Sam. 24:6]]; this chapter shows what the second sparing adds.

  It is the last confrontation between David and Saul. Saul promises to do him no more harm, but David does not believe him, and the next chapter opens with his decision to take his household into the land of the Philistines ([[1 Sam. 27:1–3]]).

thread: |
  The chapter is about distance. In chapter 24 David followed Saul out of the cave and bowed to him; here, after he has stood over the sleeping king with the spear in reach, he crosses to the top of a far hill, “a great space being between them” (verse 13), and talks across the valley. The gap is more than a matter of yards. In outlook and destiny the two men are now far apart, and nothing Saul can say will close it. Saul confesses, calls David “my son,” and invites him home; David answers by holding up the spear and telling Saul to send a young man across for it.

  David leaves Saul's end to the LORD (verse 10) and twice says he would not stretch forth his hand against the LORD's anointed (verses 11 and 23). The narrator gives the LORD the sleep that let David into the camp: it was “a deep sleep from the LORD” (verse 12). What David asks for himself is the same mercy he has shown: that as Saul's life was precious in his eyes, his own will be precious in the LORD's (verse 24). Then “David went on his way, and Saul returned to his place,” and the two never face each other again.

sections:
  - range: 1-4
    heading: Saul comes out again
    plain: |
      The men of Ziph came to Saul at Gibeah and said, “Isn't David hiding on the hill of Hachilah, facing Jeshimon?” So Saul set out and went down to the wilderness of Ziph with three thousand picked men of Israel to look for David there. Saul camped on the hill of Hachilah beside the road facing Jeshimon. David was staying out in the wilderness, and when he saw that Saul had followed him there, he sent out scouts and learned that Saul had certainly come.
  - range: 5-12
    heading: In Saul's camp by night
    plain: |
      David set out and came to the place where Saul was camped, and he saw where Saul and Abner the son of Ner, the commander of his army, lay. Saul was lying inside the camp's barricade, with the army camped around him. David asked Ahimelech the Hittite and Abishai the son of Zeruiah, Joab's brother, “Who will go down with me into the camp to Saul?” “I will go with you,” said Abishai. So David and Abishai came to the army by night, and there was Saul, asleep inside the barricade, with his spear stuck in the ground by his head, and Abner and the soldiers lying around him. Abishai said to David, “God has delivered your enemy into your hand today. Let me pin him to the ground with the spear in one stroke; I will not need a second.” But David said to Abishai, “Do not destroy him. Who can lift a hand against the LORD's anointed and be guiltless?” And he said, “As the LORD lives, the LORD will strike him, or his day will come and he will die, or he will go down into battle and perish. The LORD forbid that I should lift my hand against the LORD's anointed. Now take the spear by his head and the jar of water, and let us go.” So David took the spear and the jar of water from beside Saul's head, and they left. No one saw it, no one knew, and no one woke; they were all asleep, because a deep sleep from the LORD had fallen on them.
  - range: 13-16
    heading: David calls across to Abner
    plain: |
      David crossed over to the other side and stood on top of a hill some way off, with a wide space between them. He shouted to the army and to Abner son of Ner, “Won't you answer, Abner?” Abner answered, “Who are you, calling to the king?” David said to Abner, “Aren't you a valiant man? Who is your equal in Israel? Then why didn't you guard your lord the king? Someone came in to destroy the king your lord. What you have done is not good. As the LORD lives, you all deserve to die, because you did not guard your master, the LORD's anointed. Now look: where is the king's spear, and the jar of water that was by his head?”
  - range: 17-25
    heading: The last words between David and Saul
    plain: |
      Saul recognized David's voice and said, “Is that your voice, my son David?” David replied, “It is my voice, my lord the king.” And he said, “Why is my lord pursuing his servant? What have I done? What evil am I guilty of? Now let my lord the king listen to his servant. If it is the LORD who has stirred you up against me, may He accept an offering. But if it is men, may they be cursed before the LORD, for they have driven me out today from staying in the LORD's inheritance, as if to say, ‘Go, serve other gods.’ So do not let my blood fall to the ground away from the presence of the LORD. The king of Israel has come out to look for a flea, as one hunts a partridge in the mountains.” Then Saul said, “I have sinned. Come back, my son David. I will not harm you again, because you valued my life today. I have acted like a fool and made a great mistake.” David answered, “Here is the king's spear. Let one of the young men come over and get it. The LORD repays everyone for his righteousness and faithfulness. The LORD delivered you into my hand today, but I would not lift my hand against the LORD's anointed. As your life was precious in my eyes today, so may my life be precious in the eyes of the LORD, and may He deliver me from all trouble.” Saul said to David, “May you be blessed, my son David! You will do great things and you will surely succeed.” So David went on his way, and Saul went back home.

notes:
  - ref: 1
    phrase: Doth not David hide himself in the hill of Hachilah
    kind: history
    title: The same story, a second time
    body: |
      Chapter 26 tells a second sparing of Saul that follows the first closely in outline and differs in what it shows. The Ziphites inform on David in nearly the words of [[1 Sam. 23:19]]; Saul comes out with three thousand chosen men, as he did to En-gedi ([[1 Sam. 24:2]]); David's companion tells him that God has delivered his enemy into his hand; and David refuses, because Saul is the LORD's anointed. An older critical view took the chapters on either side of Nabal's story as coming from different sources. Scholars now read chapters 24–26 as one unit about Saul and David, with Nabal's chapter, between the two sparings, speaking of Saul through the figure of Nabal.

      What changes is the ending. At En-gedi Saul wept and said aloud that David would surely be king ([[1 Sam. 24:16–20]]). Here he says he has sinned and invites David to come back, and the most he can offer at the end is a blessing: “thou shalt both do great things, and also shalt still prevail” (verse 25). Set beside chapter 24, Saul's words are an anticlimax, and one reading takes that as the point: they show that the two men cannot be reconciled, and they prepare for David's withdrawal to Philistia in the next chapter.
    sources: [heal-abigail, gordon-narrative-analogy, ellsworth-tragic-saul]

  - ref: 6
    phrase: Ahimelech the Hittite, and to Abishai the son of Zeruiah
    kind: history
    title: David's two companions
    body: |
      David asks two men to go with him into the camp: a Hittite and his own nephew. Abishai's mother Zeruiah was David's sister; Chronicles lists Jesse's sons, with David the seventh, and then their sisters: “Whose sisters were Zeruiah, and Abigail. And the sons of Zeruiah; Abishai, and Joab, and Asahel, three” ([[1 Chr. 2:16]]). Abishai and his brothers fought for David ([[2 Sam. 2:18]]), and Abishai later led a third of his army ([[2 Sam. 18:2]]). Here he is the one who volunteers, and the one who asks to kill Saul (verse 8).

      Ahimelech belongs to the Hittites, a people descended from Heth and counted a branch of the Canaanites. Another Hittite, Uriah, would later be listed among David's mighty men ([[2 Sam. 23:39]]).
    sources: [lds-scriptures, bd-hittites]

  - ref: 11
    phrase: take thou now the spear that is at his bolster, and the cruse of water
    kind: symbol
    title: The king's spear
    body: |
      The spear David takes is Saul's, and Saul's spear had a history with David: the king had twice had one in his hand and thrown it at him. The Hebrew word, *ḥănît*, is the same in “there was a javelin in Saul's hand” ([[1 Sam. 18:10–11]]; [[1 Sam. 19:9–10]]), in the javelin Saul cast at Jonathan ([[1 Sam. 20:33]]), in “having his spear in his hand” as he sat over his servants at Gibeah ([[1 Sam. 22:6]]), and in the spear stuck in the ground at his head in this chapter. The King James' “javelin” and “spear” hide that the Hebrew word is the same, and both David and Saul knew what Saul's spear had meant between them.

      Taken with the jar of water from beside the king's head, it was proof that David had stood over the sleeping king and let him live, and David holds it up when he chides Abner (verse 16). When Saul asks him to come back, David's whole answer is about the spear (verse 22). The written Hebrew text there reads *Behold, the spear, O king!*; the reading tradition, which the King James follows, gives “Behold the king's spear!” Either way, David does not bring it back himself. He tells Saul to send one of the young men across for it.
    sources: [oshb-wlc, gordon-narrative-analogy, ot-manual-1-samuel-16]

  - ref: 12
    phrase: a deep sleep from the LORD was fallen upon them
    kind: words
    title: A deep sleep from the LORD
    body: |
      The narrator gives the LORD the credit for the raid: no one saw, knew or woke, “because a deep sleep from the LORD was fallen upon them.” The Hebrew noun, *tardēmâ*, is a heavy sleep that usually falls upon a person by supernatural agency. It is the sleep the LORD God caused to fall on Adam ([[Gen. 2:21]]) and the sleep that fell on Abram as the LORD made His covenant with him ([[Gen. 15:12]]). Here the Hebrew is literally *a deep sleep of the LORD*.

      Abishai says that God has delivered Saul into David's hand (verse 8), and David says the same (verse 23); yet David would not stretch forth his hand against the LORD's anointed (verses 9, 11).
    sources: [bdb, oshb-wlc]

  - ref: 15
    phrase: wherefore then hast thou not kept thy lord the king?
    kind: history
    title: David's taunt of Abner
    body: |
      David calls across the valley not to Saul but to Abner, the captain of Saul's army, and blames him for not keeping the king. The man without equal in Israel slept while “one of the people” came in to destroy the king. One older reading holds that the rebuke was meant for Saul's ears, to show him that David guarded his life better than his closest servants did. “Ye are worthy to die” is literally “sons of death.”

      Abner matters later. After Saul's death he made Saul's son Ishbosheth king ([[2 Sam. 2:8–9]]), then went over to David and was killed by Joab ([[2 Sam. 3:27]]).
    sources: [bd-abner, keil-1-samuel, cambridge-1-samuel]

  - ref: 19
    phrase: driven me out this day from abiding in the inheritance of the LORD
    kind: history
    title: Driven from the LORD's inheritance
    body: |
      David names two possible causes of Saul's hostility and what each would require. If the LORD had stirred Saul up, “let him accept an offering,” literally let Him smell one, the image used when the LORD smelled Noah's sacrifice ([[Gen. 8:21]]) for God's being satisfied: an offering would set the matter right. Many older commentators connected the words with the evil spirit that troubled Saul; for that spirit, the Joseph Smith Translation's reading is given at [[1 Sam. 16:14]]. If men had stirred him up, “cursed be they before the LORD.”

      Then David says what their work has done to him. To be driven out of the LORD's inheritance, His land and people, was in effect to be told, “Go, serve other gods.” The older commentaries explain the link: the LORD was worshipped in the land He had given and at His sanctuary, and no one had to say the words for exile to mean them. Verse 20 carries the thought on. “Let not my blood fall to the earth before the face of the LORD” may mean *do not kill me, lest the LORD avenge my blood*, or, as one older reading prefers, *far from the presence of the LORD*, that is, in a foreign land. The plea prepares for the next chapter, where David decides that his one escape is “into the land of the Philistines” ([[1 Sam. 27:1]]).
    sources: [cambridge-1-samuel, keil-1-samuel, gordon-narrative-analogy]

  - ref: 21
    phrase: I have played the fool, and have erred exceedingly
    kind: history
    title: I have played the fool
    body: |
      Saul's confession uses a loaded word. “I have played the fool” (*hiskaltî*) is from the verb Samuel used at Gilgal when he told Saul, “Thou hast done foolishly” ([[1 Sam. 13:13]]; the note there gives the occasion). Now Saul passes the same judgment on himself, in front of the man to whom the kingdom is passing.

      One reading of chapters 24–26 asks whether the word also points back to Nabal, whose name the chapter before ties to folly: “as his name is, so is he; Nabal is his name, and folly is with him” ([[1 Sam. 25:25]]). It finds the comparison already in David's words in verse 10. “The LORD shall smite him” uses the verb of “the LORD smote Nabal, that he died” ([[1 Sam. 25:38]]), and on this reading David's confidence that Saul's end would be the LORD's doing rests on what he had just seen happen to Nabal. Saul did in the end “descend into battle, and perish” ([[1 Sam. 31:6]]).

      The confession changed nothing between them. Saul said he would no longer seek David's life, and David did not believe him; chapter 24's note at [[1 Sam. 24:17]] shows the same pattern the first time.
    sources: [gordon-narrative-analogy, oshb-wlc, ot-seminary-lesson-89]

christ: |
  David spares the LORD's anointed and then puts his own life in the LORD's hands: “as thy life was much set by this day in mine eyes, so let my life be much set by in the eyes of the LORD, and let him deliver me out of all tribulation” (verse 24). With “The LORD render to every man his righteousness and his faithfulness” (verse 23) he asks the Lord to judge his works against Saul's. Jesus Christ promised mercy to the merciful: “Blessed are the merciful: for they shall obtain mercy” ([[Matt. 5:7]]; [[3 Ne. 12:7]]).

  Mercy given to an enemy is not lost. Alma taught that those who are merciful “shall have mercy restored unto you again” ([[Alma 41:14]]).

