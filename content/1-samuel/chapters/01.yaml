chapter: 1
title: For This Child I Prayed
tagline: Hannah, barren and provoked, pours out her soul at Shiloh and vows a son to the LORD; Eli takes her for drunk, then blesses her; Samuel is born, weaned, and lent to the LORD for life.
when: 'In the days of Eli, at Shiloh'

setting: |
  First and Second Samuel are one book in the Hebrew Bible; the division into two follows the Greek Bible. The book runs from Samuel’s birth nearly to David’s death, a span of about 130 years, and tells how Israel passed from judges to kings under Samuel, the last of the judges. Who wrote it, and when, is not known. The writer drew on records already in existence, among them writings of Samuel, Nathan and Gad ([[1 Sam. 10:25]]; [[1 Chr. 29:29]]).

  In Hannah’s day, as at the close of Judges, “there was no king in Israel: every man did that which was right in his own eyes” ([[Judg. 21:25]]). Once a year Elkanah’s household went up to Shiloh, where the tabernacle stood through most of the period of the judges and which stayed the nation’s religious center until the ark was lost in battle (chapter 4). The text calls it “the house of the LORD” and “the temple of the LORD” ([[1 Sam. 1:7]]; [[1 Sam. 1:9]]), though it was a tent-shrine, a forerunner of the temple later built in Jerusalem (the word is explained at [[Ps. 5:7]]). There Elkanah worshipped “the LORD of hosts” ([[1 Sam. 1:3]]), the title of Jehovah as leader of Israel’s armies and of the hosts of heaven (see [[Hag. 1:2]]).

thread: |
  Chapter 1 is a story of asking. Hannah, barren and grieved, asks the LORD for a son; the LORD gives him; and she gives him back.

  The chapter sets two people side by side at the sanctuary. Eli is the priest at Shiloh, with an established place in Israel’s worship, and the first thing he does is misjudge a woman at prayer. Hannah has no office at all; she is the childless second wife of an obscure Ephraimite, and hers is the prayer that is heard. The rest of the story reverses what those positions would lead a reader to expect.

  The word that carries the chapter is the Hebrew *šāʾal*, “ask.” Hannah names her son “Because I have asked him of the LORD” ([[1 Sam. 1:20]]), and when she brings him back she says she has “lent” him, the same verb ([[1 Sam. 1:28]]). It also sounds like Saul’s name, and the narrator appears to use it to link the boy born in answer to prayer with Saul, the king of chapters 8–12, whose life will be intertwined with Samuel’s. Hannah’s song in the next chapter opens a story that David’s psalm at the end of 2 Samuel will close (see the note on [[1 Sam. 2:1]]).

sections:
  - range: 1-8
    heading: Hannah’s grief at Shiloh
    plain: |
      There was a man from Ramathaim-zophim in the hill country of Ephraim named Elkanah, the son of Jeroham, son of Elihu, son of Tohu, son of Zuph, an Ephraimite. He had two wives, Hannah and Peninnah. Peninnah had children; Hannah had none. Every year he went up from his town to worship and to sacrifice to the LORD of hosts at Shiloh, where Eli’s two sons, Hophni and Phinehas, were priests of the LORD. Whenever Elkanah sacrificed, he gave shares of the meat to Peninnah and to all her sons and daughters, but to Hannah he gave a special share, because he loved her, though the LORD had closed her womb. Her rival provoked her bitterly to make her miserable, because the LORD had closed her womb. So it went year after year: whenever Hannah went up to the house of the LORD, Peninnah provoked her, and Hannah wept and would not eat. Her husband Elkanah said to her, “Hannah, why are you crying? Why won’t you eat? Why are you so sad? Am I not worth more to you than ten sons?”
  - range: 9-18
    heading: The vow, and Eli
    plain: |
      After they had eaten and drunk at Shiloh, Hannah got up. Eli the priest was sitting on a seat by the doorpost of the temple of the LORD. In bitter grief she prayed to the LORD, weeping hard, and she made a vow: “LORD of hosts, if You will look on the misery of Your servant and remember me, and not forget Your servant, but give Your servant a son, then I will give him to the LORD for all the days of his life, and no razor shall ever touch his head.” As she kept on praying before the LORD, Eli watched her mouth. Hannah was praying in her heart; her lips moved, but no sound came, so Eli thought she was drunk. “How long will you go on drunk?” he said to her. “Put your wine away.” “No, my lord,” Hannah answered. “I am a deeply troubled woman. I have not drunk wine or strong drink; I have been pouring out my soul before the LORD. Do not take your servant for a worthless woman. I have been speaking all this time out of my great anguish and grief.” Eli answered, “Go in peace, and may the God of Israel grant what you have asked of Him.” She said, “May your servant find favor in your sight.” Then she went her way and ate, and her face was no longer sad.
  - range: 19-28
    heading: Samuel born and lent to the LORD
    plain: |
      Early the next morning they worshipped before the LORD and went home to Ramah. Elkanah lay with his wife Hannah, and the LORD remembered her. In due time Hannah conceived and bore a son, and she named him Samuel, saying, “Because I asked the LORD for him.” When Elkanah and all his household went up again to offer the yearly sacrifice and to pay his vow, Hannah did not go. She told her husband, “Not until the child is weaned. Then I will bring him to appear before the LORD, and he will stay there for good.” Elkanah her husband said, “Do what you think best. Wait until you have weaned him; only may the LORD make His word stand.” So she stayed home and nursed her son until she weaned him. When she had weaned him, she took him up with her, with three bulls, an ephah of flour and a skin of wine, and brought him to the house of the LORD at Shiloh, young as he was. They slaughtered a bull and brought the boy to Eli. She said, “Please, my lord, as surely as you live, my lord, I am the woman who stood here beside you praying to the LORD. I prayed for this child, and the LORD has given me what I asked of Him. So I in turn have lent him to the LORD; for as long as he lives he is lent to the LORD.” And he worshipped the LORD there.

notes:
  - ref: 1
    phrase: an Ephrathite
    kind: history
    title: An Ephraimite in Samuel, a Levite in Chronicles
    body: |
      Samuel’s father is introduced as a man of Ephraim, but Chronicles counts the family among the Levites, so Samuel’s lineage is “unclear.” A modern translation renders “Ephrathite” here as “an Ephraimite”: Elkanah lived at Ramathaim-zophim in the hill country of Ephraim, and the genealogy of this verse presents Samuel’s ancestors as Ephraimites.

      Chronicles gives nearly the same chain of names, Elkanah, Jeroham, Eliel, Toah and Zuph, with Samuel (“Shemuel”) among them, and sets it in the line of Kohath son of Levi ([[1 Chr. 6:33–35]]; compare [[1 Chr. 6:26–28]]). On one Latter-day Saint reading, the two records together give Samuel a “dual descent” that “may have qualified him, in terms of his lineage, to serve as priest as well as prophet and judge.” Whether he could offer sacrifice is taken up at [[1 Sam. 7:9]].
    sources: [nrsvue, olsen-birth-samuel, lds-scriptures, scripture-helps-ruth-samuel]

  - ref: 5
    phrase: But unto Hannah he gave a worthy portion; for he loved Hannah
    kind: history
    title: A worthy portion, and better than ten sons
    body: |
      Elkanah’s special share shows that he loved Hannah, as the verse says, but it could not reach her grief: fasting in her bitterness, she would not eat it ([[1 Sam. 1:7]]), and she had no children to share it with. What a “worthy portion” was exactly is not certain. A modern translation reads “a double portion,” following the Syriac, and notes that the meaning of the Hebrew is uncertain; the Greek translation has “a prime portion.”

      His question, “am not I better to thee than ten sons?” ([[1 Sam. 1:8]]), has been heard as tender and as dismissive. Either way, he is asking her to be content with things as they are. Hannah takes her sorrow to the LORD instead, to change them.
    sources: [nrsvue, lxx-rahlfs, olsen-birth-samuel, smith-hannah-temple]

  - ref: 6
    phrase: And her adversary also provoked her sore, for to make her fret
    kind: history
    title: Peninnah, the rival wife
    body: |
      The lexicon and a modern translation make the “adversary” Peninnah, the wife with children; another Latter-day Saint reading makes the adversary Hannah’s barrenness itself. A Hebrew noun meaning “rival-wife” is listed for this very verse, and a modern translation reads “Her rival used to provoke her severely.”

      The same letters also spell a common noun meaning “distress” or “trouble.” On that ground one study reads the verse as Hannah’s own trouble, “her inability to bear children,” causing her grief. It notes that the Greek translation and Josephus give Peninnah only a passive part, and that the spiteful tormentor came later, in rabbinic retellings. The Greek verse indeed has no rival in it: “the Lord gave her no child in her affliction.”

      Either way, the scene follows a familiar pattern. In one Latter-day Saint literary reading, the loved but barren wife beside a wife with children recalls Sarah, Rebekah and Rachel, and leads an attentive reader to expect that Hannah too will bear a remarkable child (the pattern is explained at [[Judg. 13:3]]).
    sources: [bdb, nrsvue, spendlove-hannah-peninnah, lxx-rahlfs, olsen-birth-samuel]

  - ref: 11
    phrase: there shall no razor come upon his head
    kind: history
    title: A Nazarite for life
    body: |
      Hannah’s promise makes Samuel a Nazarite for life, though the King James never uses the word of him; the razor is what marks the vow. A Nazarite abstained from wine, left his hair uncut and kept away from the dead (the law is explained at [[Num. 6:2]]), and the vow “might be lifelong, or for a short, definite period.” The law itself describes a vow for a set time, “until the days be fulfilled” ([[Num. 6:5]]); Hannah’s was for “all the days of his life” ([[1 Sam. 1:11]]).

      The ancient versions say more than the traditional Hebrew. The Greek adds that the child “shall drink no wine nor strong drink,” a second mark of the vow beside the razor. A modern translation, reconstructing the verse from the Greek and a Hebrew manuscript from Qumran, has Hannah promise to set him before the LORD “as a nazirite until the day of his death,” and in verse 22 it adds, from the Qumran manuscript, a line the traditional Hebrew lacks: “I will offer him as a nazirite for all time.”

      Her verb, *nātan*, “give,” makes the gift “unequivocal and permanent”: the child would belong to the LORD for good, not for a set time. It was a mother’s vow for a son not yet born, a person given to the LORD (see [[Lev. 27:2]]). The razor also sets Samuel beside Samson, whose mother received the same charge ([[Judg. 13:5]]). In one Latter-day Saint reading the two lives answer each other: Samson broke his vow, while Samuel “strengthens and unifies ‘all Israel.’”
    sources: [scripture-helps-ruth-samuel, bd-nazarite, lxx-rahlfs, nrsvue, olsen-birth-samuel]

  - ref: 13
    phrase: only her lips moved, but her voice was not heard
    kind: history
    title: A prayer Eli could not hear
    body: |
      Eli took Hannah for drunk because she prayed without a sound. Prayers were normally offered aloud, and the story implies that Eli was so unused to silent prayer that he mistook her moving lips and silence for drunkenness. Her silence also shows that Hannah saw this as a matter between herself and the LORD alone.

      The words “her voice was not heard” (*lōʾ yiššāmēaʿ*) use *šāmaʿ*, “hear,” and an Israelite listener would hear that verb again in the name Samuel, which sounds like “heard of God.” The play makes the point that God heard the prayer Eli could not.

      Eli’s charge was false, and Hannah corrected it with respect, asking not to be counted “a daughter of Belial” (the footnote gives the word’s sense). The narrator will give the same label to Eli’s own sons ([[1 Sam. 2:12]]). Eli’s “Go in peace” ([[1 Sam. 1:17]]) came quickly after his mistake, a blessing on a petition he had not heard.
    sources: [smith-hannah-temple, bowen-name-samuel, olsen-birth-samuel]

  - ref: 20
    phrase: called his name Samuel, saying, Because I have asked him of the LORD
    kind: words
    title: Samuel, and the boy who was asked
    body: |
      Hannah explains the name by her asking, but the name itself most likely means “his name is El,” or, read by its parts, “Name of God,” and her explanation fits another name better: Saul. “I have asked him” is the verb *šāʾal*, and its passive form *šāʾûl*, “asked,” is the name Saul. Nearly every modern interpreter agrees that Hannah’s words play on the sound of the name and do not give its derivation.

      On this reading the play is deliberate: the narrator already has the king of chapters 8–12 in view and joins the two names, and the two lives, from the day Samuel is named. The other sound in the name, “heard,” is at verse 13.
    sources: [bowen-name-samuel, bd-samuel, oshb-wlc]

  - ref: 23
    phrase: only the LORD establish his word
    kind: words
    title: Whose word?
    body: |
      Elkanah’s “only the LORD establish his word” is puzzling, since the LORD has spoken no word in the story; the Greek and a Dead Sea Scroll make it Hannah’s word. The Greek reads “may the Lord establish that which comes out of thy mouth,” and a modern translation reads “your word,” following a Qumran manuscript, the Greek and the Syriac; the King James keeps the traditional Hebrew. Read that way, Elkanah prays that the LORD will make good what Hannah has vowed. One Latter-day Saint study judges that this “makes more sense in context,” and adds that if it is right, the LORD’s confirming her words strengthens the picture of Hannah as a woman with a prophetic gift.
    sources: [smith-hannah-temple, lxx-rahlfs, nrsvue]

  - ref: 28
    phrase: Therefore also I have lent him to the LORD
    kind: words
    title: Lent to the LORD
    body: |
      “Lent” is the same verb as “asked,” and Hannah’s lending is a gift for life. In verse 28 the boy is *šāʾûl* to the LORD: “lent, granted,” made over to Him. The word is spelled exactly like Saul’s name (see the note on verse 20). A modern translation gives the sense: “as long as he lives, he is given to the Lord.”

      In her vow Hannah said “give” ([[1 Sam. 1:11]]); now she says “lend.” The change is not a change of heart, and she does not bargain with the terms of her vow. *Šāʾal* means both to request and to lend, and “lend” fits what had changed since the vow: once Samuel was born, she could never stop being his mother. Keeping the vow meant leaving a young child in Eli’s care, and she kept it.
    sources: [bdb, oshb-wlc, nrsvue, olsen-birth-samuel, smith-hannah-temple]

christ: |
  Hannah’s prayer is echoed at the opening of Luke. Mary, whose “low estate” as “his handmaiden” the Lord regarded ([[Luke 1:48]]), sings words that echo Hannah’s ([[Luke 1:46–55]]), and Hannah’s own song, in the next chapter, contains the first reference to the title Messiah, the LORD’s “Anointed” ([[1 Sam. 2:10]]).

  The God who heard a prayer that the priest beside her could not hear hears the prayer a disciple offers in secret: “thy Father which seeth in secret shall reward thee openly” ([[Matt. 6:6]]). When and how He fulfills His promises to each person is not fully known, and it differs from one life to another.

