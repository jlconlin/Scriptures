chapter: 16
title: The LORD Looketh on the Heart
tagline: The LORD sends Samuel to Bethlehem to anoint one of Jesse's sons, passes over the tall eldest and every brother after him, and chooses the youngest, who is out with the sheep; the Spirit comes on David and leaves Saul, and David is brought to court to play for the king.
when: 'After the LORD rejected Saul, at Bethlehem and at Saul''s court'

setting: |
  Chapter 15 ended with Samuel's last parting from Saul. “Samuel came no more to see Saul until the day of his death: nevertheless Samuel mourned for Saul: and the LORD repented that he had made Saul king over Israel” ([[1 Sam. 15:35]]; the note at [[1 Sam. 15:11]] takes up what it means that the LORD repented). Chapter 16 opens on that grief. The LORD's question, “How long wilt thou mourn for Saul,” shows that the prophet had not yet made his peace with Saul's rejection, and he may have been grieving for Israel as well.

  The chapter begins the last of the book's three parts: chapters 1–7 are Samuel's, 8–15 Saul's, and 16–31 tell the rise of David. Saul reigns on through all of it, until his death in the book's last chapter ([[1 Sam. 31:6]]). The new king comes from Bethlehem in Judah. Jesse was the son of Obed, the son Ruth bore to Boaz ([[Ruth 4:17]]; the note there tells that story), so David was born into a family remembered for loving-kindness. Bethlehem is also the town of the prophesied ruler ([[Micah 5:2]]) and of the birth of David's greater descendant ([[Luke 2:4]]).

thread: |
  The chapter is about seeing. Samuel looks at Eliab and is sure he sees the LORD's anointed; the LORD tells him that man looks at what the eyes can see and the LORD looks at the heart (verses 6–7). Seven sons pass before the prophet, and the one chosen is the one nobody thought to bring, the youngest, out with the sheep. The people had once been given a king a head taller than everyone else ([[1 Sam. 10:23]]). This time the LORD makes the choice on grounds no one at the feast could see.

  Then the chapter turns on two verses. “The Spirit of the LORD came upon David from that day forward” (verse 13), and “the Spirit of the LORD departed from Saul” (verse 14). Saul had rejected the Lord and was cut off from His inspiration, and the rest of the chapter shows the cost: a king troubled by an evil spirit, whose servants look for a musician to soothe him. The man they find is the one Samuel has just anointed, and the LORD brings David into the palace and to the seat of power he will one day inherit, and Saul loves him.

sections:
  - range: 1-5
    heading: Samuel sent to Bethlehem
    plain: |
      The Lord said to Samuel, “How long will you mourn for Saul, when I have rejected him as king over Israel? Fill your horn with oil and go. I am sending you to Jesse of Bethlehem, for I have chosen a king for Myself among his sons.” Samuel said, “How can I go? If Saul hears of it, he will kill me.” The Lord said, “Take a heifer with you and say, ‘I have come to sacrifice to the Lord.’ Invite Jesse to the sacrifice, and I will show you what to do. You will anoint for Me the one I name to you.” Samuel did what the Lord said and came to Bethlehem. The elders of the town came trembling to meet him and asked, “Do you come in peace?” “In peace,” he said. “I have come to sacrifice to the Lord. Purify yourselves and come with me to the sacrifice.” He purified Jesse and his sons and invited them to the sacrifice.
  - range: 6-13
    heading: The youngest is anointed
    plain: |
      When they came, Samuel saw Eliab and thought, “Surely the Lord's anointed stands here before Him.” But the Lord said to Samuel, “Do not look at his appearance or at how tall he is, for I have rejected him. The Lord does not see as people see. People look at the outward appearance, but the Lord looks at the heart.” Jesse called Abinadab and had him pass before Samuel, but Samuel said, “The Lord has not chosen this one either.” Then Jesse had Shammah pass by, and Samuel said, “Nor has the Lord chosen this one.” Jesse had seven of his sons pass before Samuel, and Samuel told him, “The Lord has not chosen these.” Then Samuel asked Jesse, “Are these all your sons?” “There is still the youngest,” he answered, “but he is tending the sheep.” Samuel said, “Send for him. We will not sit down to eat until he comes.” So Jesse sent for him and brought him in. He was ruddy, with a handsome face and a fine appearance. And the Lord said, “Rise and anoint him; this is the one.” Samuel took the horn of oil and anointed him in the presence of his brothers, and the Spirit of the Lord came upon David from that day on. Then Samuel set out and went to Ramah.
  - range: 14-23
    heading: David comes to Saul's court
    plain: |
      Now the Spirit of the Lord had left Saul, and an evil spirit from the Lord troubled him (the Joseph Smith Translation: a spirit “not of the Lord”). Saul's servants said to him, “An evil spirit from God is troubling you. Let our lord command us, your servants, to look for a man who plays the lyre well. When the evil spirit from God comes on you, he will play, and you will feel better.” Saul told his servants, “Find me a man who plays well and bring him to me.” One of the young men answered, “I have seen a son of Jesse of Bethlehem who knows how to play. He is a brave man and a warrior, prudent, and handsome, and the Lord is with him.” So Saul sent messengers to Jesse and said, “Send me your son David, who is with the sheep.” Jesse loaded a donkey with bread, a skin of wine and a young goat, and sent them to Saul with his son David. David came to Saul and entered his service. Saul loved him greatly, and David became his armor-bearer. Saul sent word to Jesse: “Let David stay in my service, for I am pleased with him.” And whenever the evil spirit from God came on Saul, David took the lyre and played, and Saul was relieved and felt better, and the evil spirit left him.

notes:
  - ref: 2
    phrase: Take an heifer with thee
    kind: history
    title: A sacrifice, and a secret errand
    body: |
      The LORD answered Samuel's fear with a real sacrifice that kept the errand's main purpose hidden. Samuel's fear had ground: anointing a rival king while Saul reigned was dangerous, and the LORD did not rebuke him for it but showed him how to anoint David without attracting attention. Was that a deception? One older reading says it was not. The sacrifice was real, Samuel truly held the feast and invited Jesse's family to it, and only the chief object of the visit went unspoken; on that reading it was legitimate to mention only the secondary purpose, since David's safety depended on secrecy as much as Samuel's did. (How Samuel, who was not a priest, came to offer sacrifice is taken up at [[1 Sam. 7:9]].)

      The sacrifice also explains the scene at the town gate (verses 4–5). Samuel's reputation went before him, and the elders who came out trembling were afraid he had come to condemn them. The heifer gave the prophet and Jesse's household a reason to sit down together until the LORD showed Samuel whom to anoint. “Sanctify yourselves” asked them to prepare with the washings and purifications that, on the older reading, probably went before every sacrificial feast, as Israel had once prepared at Sinai ([[Ex. 19:10]]).
    sources: [keil-1-samuel, cambridge-1-samuel, ot-minute-1-samuel-16]

  - ref: 7
    phrase: the LORD looketh on the heart
    kind: words
    title: The eyes and the heart
    body: |
      The LORD chooses by what no one at the feast can see, and the Hebrew draws the line more sharply than the English. “Outward appearance” is literally “the eyes”: man looks at what meets the eye, the LORD at the heart. And the Hebrew heart is more than feelings. It is the inner person as against the outer, and in this very verse it stands against the eyes; it takes in the mind, the affections and the will. To look on the heart is to see what a person thinks, loves and chooses.

      The lesson was aimed first at the prophet. Samuel looked at Eliab, the eldest ([[1 Sam. 17:13]]), and said, “Surely the LORD's anointed is before him” (verse 6). The LORD's answer names exactly what Samuel had seen: “his countenance” and “the height of his stature.” When Saul was chosen, the text made it clear that he stood taller than everyone in Israel ([[1 Sam. 10:23]]; [[1 Sam. 9:2]] and its note). Now the LORD tells Samuel to disregard the outward signs, and the king He chooses is not the tall firstborn but the youngest (verse 11). People see the surface; the Lord sees to the very depths of a person. The phrase “a man after his own heart,” which Samuel had spoken to Saul at Gilgal, is explained at [[1 Sam. 13:14]].
    sources: [oshb-wlc, bdb, ot-minute-1-samuel-16, ot-manual-1-samuel-16]

  - ref: 11
    phrase: behold, he keepeth the sheep
    kind: symbol
    title: The youngest, with the sheep
    body: |
      David was left out of the gathering because he was tending the sheep, and both his place as the youngest and his flock turn out to matter. Choosing a younger brother over the elder ones defied what people expected, yet it is a pattern that runs through Israel's scriptures: Jacob, Joseph, Judah, Ephraim, David and Solomon were all chosen over older brothers. In general, the reason seems to have been that the younger son was simply the more righteous one.

      The sheep matter too. Each of the three stories that bring David into the narrative mentions his flock (verses 11 and 19; [[1 Sam. 17:15]]), and the LORD later reminds him, “I took thee from the sheepcote, from following the sheep, to be ruler over my people” ([[2 Sam. 7:8]]). The shepherd was one of the most common images for a king in the ancient Near East, and a king's calling was to care for his people as a shepherd cares for a flock, including the poor and the oppressed. A psalm says the same of him: the LORD “chose David also his servant, and took him from the sheepfolds” to feed His people ([[Ps. 78:70–71]]; the note at [[Ps. 78:71]] gives the shepherd's verb).
    sources: [ot-minute-1-samuel-16, sc-knowhy-462, taggart-sworn-david, seely-messiah, lds-scriptures]

  - ref: 12
    phrase: Now he was ruddy
    kind: words
    title: Ruddy and handsome
    body: |
      The description of David's looks marks him as the hero of the story, the person to watch. “Ruddy” means a reddish complexion or red hair, and it may refer to his hair; “countenance” is a word for the face. He first appears as a handsome, ruddy shepherd boy on whose heart the LORD had already looked (verse 7) and found him worthy.
    sources: [ot-minute-1-samuel-16, ot-seminary-lesson-86, taggart-sworn-david]

  - ref: 13
    phrase: anointed him in the midst of his brethren
    kind: symbol
    title: Anointed in the midst of his brethren
    body: |
      The oil marked David as chosen and commissioned by God for His work, which is what it meant to be an “anointed one” (Saul's anointing, the first of a king, is at [[1 Sam. 10:1]]). Olive oil, associated with prosperity, cleansing, healing and purity, stood for the Spirit, and as with Saul, the Spirit of the Lord came on David after the anointing. The oil also signified the help and support the Lord gives the one He anoints.

      The verb for the Spirit's coming is the one used of Saul at [[1 Sam. 11:6]], where its force is explained, and the Spirit now does for David what it had done for Saul. Here it may mean that David prophesied, as Saul had, but more likely that the LORD was qualifying him for kingship by giving him the wisdom to lead.

      The anointing was done before his brothers, but it was not a coronation. On one older reading “in the midst of his brethren” can only mean “in the presence of his brethren”; since the brothers seem afterward to have no idea of what David is to become, the meaning of the act was probably kept from them, and perhaps even from Jesse and David. David will be anointed king again, openly, years later ([[2 Sam. 2:4]]; [[2 Sam. 5:3]]).
    sources: [scripture-helps-1-samuel-8, seely-messiah, wilson-holy-spirit, ot-minute-1-samuel-16, cambridge-1-samuel, oshb-wlc]

  - ref: 14
    phrase: an evil spirit from the LORD troubled him
    kind: scripture
    title: An evil spirit, not of the Lord
    body: |
      The Joseph Smith Translation corrects this verse: the spirit that troubled Saul was “an evil spirit which was not of the Lord.” It makes the same change in each place the chapter names the spirit (“not of God” in verses 15, 16 and 23), and again at [[1 Sam. 18:10]] and [[1 Sam. 19:9]]. The reason is doctrinal. God does not send evil spirits; as Mormon taught, “all things which are good cometh of God; and that which is evil cometh of the devil” ([[Moro. 7:12]]).

      What then was it? Two possibilities stay open, without a choice between them: Saul may have been directly influenced by an evil spirit, or he may have been experiencing a spirit of discontent because of his sins. What the verse records are the first effects of Saul's rejection of the Lord. David's later prayer, “take not thy holy spirit from me” ([[Ps. 51:11]]), is set beside this verse in the note there.
    sources: [jst-1-sam-16, nyman-jst-historical, scripture-helps-1-samuel-8, ot-manual-1-samuel-16]

  - ref: 21
    phrase: he loved him greatly; and he became his armourbearer
    kind: history
    title: Saul’s armourbearer
    body: |
      The anointed successor enters the king's house as his servant, and the king loves him. An armourbearer was chosen by the king to carry his armor and stand beside him in times of danger. The servant who recommended David described more than a musician: “a mighty valiant man, and a man of war, and prudent in matters” (verse 18), a reputation that would in time bring him face to face with the Philistine champion. The LORD was bringing David into the palace and the seat of power he had been anointed to inherit.

      The next chapter tells David's coming to Saul differently, and at its end Saul asks whose son the young man is ([[1 Sam. 17:55]]). How the two accounts fit together is taken up in the note at [[1 Sam. 17:55]].
    sources: [ot-seminary-lesson-86, ot-minute-1-samuel-16]

  - ref: 23
    phrase: so Saul was refreshed, and was well
    kind: history
    title: David’s lyre
    body: |
      David's music gave Saul relief, but only for a time. The “harp” was the lyre, a stringed instrument played for ordinary as well as sacred music. The servants' plan worked as they said it would: when David played, Saul was refreshed and the evil spirit left him. His skill is implied by the many psalms attributed to him, and it is a fair inference, though not a fact the text gives, that some of them, Psalm 23 among them, were already written. The relief did not last: the spirit came on Saul again while David played ([[1 Sam. 18:10]]). The music may have eased Saul for a time, but the only way he could have found lasting peace was by repenting.
    sources: [bdb, ot-minute-1-samuel-16, ot-seminary-lesson-86]

christ: |
  The anointed shepherd of Bethlehem foreshadowed his descendant Jesus Christ, whose title Messiah means “anointed one,” and who, like David, was born in Bethlehem ([[Luke 2:4–7]]). The shepherd taken from the sheepfolds to feed Israel was the pattern of a king Christ fulfills as the Good Shepherd, the King who feeds and cares for His people ([[John 10:11]]).

  God still looks on the heart. Heavenly Father's interest in a disciple “does not depend on how rich or beautiful or healthy or smart” that disciple is; He sees who that person really is, and He loves each one as His child.

explore: |
  - **The shepherd king.** [[Ps. 78:70–72]]; [[2 Sam. 5:2]]; [[Ezek. 34:23–24]], the promise of “one shepherd … even my servant David”; [[John 10:11–16]].
  - **The king who does not judge by sight.** [[Isa. 11:1–4]], the rod out of the stem of Jesse who “shall not judge after the sight of his eyes.”
  - **David anointed three times.** Here; by Judah at Hebron, [[2 Sam. 2:4]]; by all Israel, [[2 Sam. 5:3]].
  - **Paul's sermon at Antioch.** [[Acts 13:21–22]], from Saul to David, “a man after mine own heart.”

