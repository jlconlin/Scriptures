chapter: 3
title: Speak; for Thy Servant Heareth
tagline: In a time when the LORD's word was rare, He calls the boy Samuel by name in the night at Shiloh, gives him a hard first message about Eli's house, and makes him a prophet known to all Israel.
when: 'In the days of Eli, at Shiloh'

setting: |
  Samuel has been at the sanctuary at Shiloh since Hannah brought him there as a small child ([[1 Sam. 1:24]]), serving “before the LORD” while Eli's sons abused the offerings ([[1 Sam. 2:11–17]]). The narrator has been moving back and forth between the two stories, and chapter 3 keeps that pattern: Eli's family falls as Hannah's rises. A “man of God” has already told Eli that his house will be cut off ([[1 Sam. 2:27–36]]; the note at [[1 Sam. 2:35]] takes up the faithful priest he promised). Now the same judgment comes again, but this time it comes to Samuel himself, with no messenger between. The man of God delivered the word to Eli; Samuel receives it straight from the LORD.

  That difference is the turn of the chapter. Israel's guidance passes from the priests of Shiloh to a prophet. Its closing report runs on into the first clause of 4:1, “And the word of Samuel came to all Israel.” Peter later counts the prophets “from Samuel” onward ([[Acts 3:24]]), and the biblical tradition of prophets is said to begin with him. Samuel's ancestry, and how he could later offer sacrifice, are at [[1 Sam. 1:1]] and [[1 Sam. 7:9]].
thread: |
  The chapter runs from silence to speech. It opens with a diagnosis: the LORD's word was rare, there was no vision, and the old priest's eyes were failing (verses 1–2). The night scene shows what that means at close range. The boy who serves in the sanctuary cannot yet tell the LORD's voice from Eli's, and runs to the wrong man three times. Samuel learns to discern the voice while serving in the holy place, and the LORD is patient with him until he can answer. Hearing and seeing run all through it: Eli sees dimly, Samuel does not yet know the voice, and the LORD's first words are about ears that will tingle (verse 11).

  The first thing Samuel hears is hard: the fall of the house of the man who raised him. It is the reversal his mother sang of ([[1 Sam. 2:7–8]]), and Samuel takes up his calling by telling it, every word, to Eli. The close reverses the opening. The LORD lets none of Samuel's words fail, all Israel knows him for a prophet, and the LORD “appeared again in Shiloh” (verse 21). The word that was rare is now heard from Dan to Beer-sheba.

sections:
  - range: 1-3
    heading: The night at Shiloh
    plain: |
      The boy Samuel served the Lord under Eli. In those days a word from the Lord was rare, and visions were not common. One night Eli, whose eyes had grown so weak that he could hardly see, was lying down in his usual place. The lamp of God had not yet gone out, and Samuel was lying down in the Lord's sanctuary, where the ark of God was.
  - range: 4-9
    heading: Three calls
    plain: |
      Then the Lord called Samuel, and he answered, “Here I am.” He ran to Eli and said, “Here I am; you called me.” Eli said, “I didn't call you; go back and lie down.” So he went and lay down. The Lord called again, “Samuel!” Samuel got up, went to Eli, and said, “Here I am; you called me.” “I didn't call you, my son,” Eli answered; “go back and lie down.” Samuel did not yet know the Lord: the Lord's word had not yet been revealed to him. The Lord called Samuel a third time, and he got up, went to Eli, and said, “Here I am; you called me.” Then Eli understood that the Lord was calling the boy. So Eli told Samuel, “Go and lie down, and if He calls you, say, ‘Speak, Lord, for your servant is listening.’” So Samuel went and lay down in his place.
  - range: 10-14
    heading: The LORD speaks
    plain: |
      The Lord came and stood there and called as before, “Samuel, Samuel!” And Samuel said, “Speak, for your servant is listening.” The Lord said to Samuel, “I am about to do something in Israel that will make the ears of everyone who hears of it tingle. On that day I will carry out against Eli everything I have said about his family, from beginning to end. I told him that I would judge his house forever for the sin he knew about: his sons disgraced themselves, and he did not stop them. So I have sworn to the house of Eli that the sin of his house will never be atoned for by sacrifice or offering.”
  - range: 15-18
    heading: Samuel tells Eli
    plain: |
      Samuel lay there until morning, and then opened the doors of the house of the Lord. He was afraid to tell Eli the vision. But Eli called him: “Samuel, my son.” “Here I am,” he answered. Eli asked, “What did He say to you? Don't hide it from me. May God punish you, and more besides, if you hide from me anything of all He said to you.” So Samuel told him everything and held nothing back. Eli said, “He is the Lord; let Him do what seems good to Him.”
  - range: 19-21
    heading: A prophet to all Israel
    plain: |
      Samuel grew up, and the Lord was with him and let none of his words fail. All Israel, from Dan in the north to Beer-sheba in the south, knew that Samuel was confirmed as a prophet of the Lord. The Lord went on appearing at Shiloh, for there He revealed Himself to Samuel through His word.

notes:
  - ref: 1
    phrase: the child Samuel ministered unto the LORD before Eli
    kind: history
    title: How old was Samuel?
    body: |
      The text does not give Samuel's age; the tradition that he was twelve comes from Josephus. The narrator calls him only “the child,” and chapter 2 shows him growing up at the sanctuary ([[1 Sam. 2:21]]; [[1 Sam. 2:26]]). Josephus, retelling the story in the first century, says plainly that “when Samuel was twelve years old, he began to prophecy.” The figure is tradition, not scripture.
    sources: [josephus-antiquities]
  - ref: 1
    phrase: the word of the LORD was precious in those days; there was no open vision
    kind: words
    title: A rare word, and no vision spread abroad
    body: |
      “Precious” here means rare: the Hebrew *yāqār* can mean costly or prized, and here it means scarce. “Open” is the obscure half of the line. The word, *niphrāṣ*, describes something that breaks out or spreads, so “no open vision” means no vision spread abroad: not that the LORD never spoke, but that vision was not general or frequent, as it would be once the word of Samuel came to all Israel ([[1 Sam. 4:1]]). The standard lexicon marks the text of the line as uncertain, so this is the likeliest sense rather than a settled one.

      The narrator gives no reason for the silence. He follows this general indictment of Israel at once with the old priest's failing eyes (verse 2), so that the priest's dim sight stands beside the nation's lack of vision.
    sources: [scripture-helps-ruth-samuel, bdb, olsen-birth-samuel]
  - ref: 3
    phrase: ere the lamp of God went out in the temple of the LORD, where the ark of God was
    kind: history
    title: Before the lamp of God went out
    body: |
      The lamp tells the time: the call came in the last hours of the night, before dawn. The “lamp of God” is the lampstand of the sanctuary, which the law had the priests keep burning “from evening to morning before the LORD” ([[Ex. 27:21]]). Samuel rose at dawn and opened the doors (verse 15).

      Where Samuel slept is less clear than the King James makes it sound. “The temple of the LORD” here is the whole sanctuary at Shiloh, its court included, as at [[1 Sam. 1:9]]. One older reading holds that he slept in the rooms built around the court for those who served there, not in the holy place beside the lamp or before the ark. On that reading, the traditional punctuation of the Hebrew is meant to keep a reader from concluding that he slept in the holy place, and the ark is named not as Samuel's bedside but as the throne of the LORD's presence, from which the call came.
    sources: [keil-1-samuel, lds-scriptures]
  - ref: 7
    phrase: Now Samuel did not yet know the LORD
    kind: scripture
    title: Learning a voice
    body: |
      The narrator explains Samuel's mistake, and it is no fault: he had served the LORD in the sanctuary, but the LORD had never yet spoken to him. To “know the LORD” here is not to know about Him but to meet Him. That personal knowledge is given to Samuel for the first time this night. Until then he takes the voice for Eli's. The LORD is patient: He calls again and again until Samuel can answer. The help comes from an unlikely quarter. Eli, already under judgment and too dim-sighted to see, still held the priest's office, and it is he who recognizes what is happening and tells the boy how to answer (verse 9).

      Speaking three times has been read as a pattern that recurs when the Lord opens communication with His people. At Bountiful the voice from heaven was heard twice without being understood, and “the third time they did understand” ([[3 Ne. 11:6]]). Moroni came to Joseph Smith three times in one night with the same message ([[JS—H 1:30–47]]).
    sources: [olsen-birth-samuel, smith-hannah-temple, ot-minute-1-samuel-3, lds-scriptures]
  - ref: 10
    phrase: Speak; for thy servant heareth
    kind: words
    title: Speak; for thy servant heareth
    body: |
      Samuel's answer plays on his name. Hannah named him with the word “asked” ([[1 Sam. 1:20]]; that wordplay, which fits Saul's name better, is explained there). Now the son she asked for says that he hears. The call narrative ties the name *šĕmûʾēl* to the verb *šāmaʿ*, “hear,” by their similar sound, so that Samuel becomes “God is heard,” “hearer of God.” That is a play on the name, not its derivation; the name itself most likely means “his name is El.”

      Before this answer, Samuel's only words in the story have been “Here am I,” with slight variation (verses 4, 5, 6, 8), the same answer Abraham gave when God called him to his great test ([[Gen. 22:1]]). “Here am I” offers himself; “thy servant heareth” offers to listen. Only after Samuel said he was ready to listen did the LORD tell him His will. The verse also says the LORD “came, and stood” (*yāṣab*) while the boy lay listening: the narrator sets the standing LORD in the place of authority and the lying boy in the place of the one who receives.
    sources: [bowen-name-samuel, sc-knowhy-576, olsen-birth-samuel, gonzalez-listening-samuel]
  - ref: 13
    phrase: his sons made themselves vile, and he restrained them not
    kind: words
    title: Made themselves vile, or cursed God?
    body: |
      The phrase “made themselves vile” is softer than the Hebrew. The verb is a form of *qālal*, which elsewhere always means to curse or blaspheme; one older reading keeps the Hebrew as it stands and renders it “made themselves accursed.” A Jewish tradition holds that the original reading was “cursed me,” that is, cursed God, and that scribes altered it out of reverence. The Septuagint has “his sons spoke evil against God,” the standard Hebrew lexicon lists the verse under cursing God, reading “God” (*ʾĕlōhîm*) for the Hebrew's “themselves” (*lāhem*), and a modern translation follows it: “his sons were blaspheming God.” Read that way, Eli “allowed his sons to curse God and therefore were leading the people of Israel astray.” Either way, the sin was against the LORD, not only against the worshippers they robbed ([[1 Sam. 2:25]]).

      The second half names Eli's own part. He had rebuked his sons ([[1 Sam. 2:23–25]]), but he did not stop them, and he was guilty of neglecting his duty to restrain them. His case is a particular one, not a rule that parents are to be held guilty of their children's conduct. What the sons did is at [[1 Sam. 2:13]] and [[1 Sam. 2:22]].
    sources: [cambridge-1-samuel, lxx-rahlfs, bdb, nrsvue, ot-manual-1-samuel-1, judd-eli-sons]
  - ref: 14
    phrase: shall not be purged with sacrifice nor offering for ever
    kind: history
    title: Not purged with sacrifice
    body: |
      The sentence is final because the LORD swears it. The form of the verse is an oath (“I have sworn”), and one older reading notes that the oath makes the judgment irrevocable: no slain offering or meal offering, no sacrifice of any kind, would atone for it. It is not new to Eli. Samuel's message only confirms what the man of God had already told him: his house would be cut off from the LORD's favor, and as a sign both his sons would die on one day ([[1 Sam. 2:30–34]]), as they do in the next chapter ([[1 Sam. 4:11]]).
    sources: [keil-1-samuel, judd-eli-sons]
  - ref: 17
    phrase: God do so to thee, and more also
    kind: history
    title: Eli puts Samuel under oath
    body: |
      Eli's words are a formal oath, and he lays it on Samuel. Oaths in Israel were probably sworn with a self-curse, “God so do to me, and more also”: the one who swore called down punishment on himself if he failed to keep his word. The formula is attested among Israelites (Eli, Saul, Jonathan, Abner, David, Solomon) and among non-Israelites, Ruth among them ([[Ruth 1:17]]). Eli turns it on Samuel: “God do so to thee,” if he hides anything. Josephus, too, says that Eli “obliged the Prophet by oath to tell him,” since otherwise Samuel would not have wished to grieve him.

      Samuel had reason to hold back. He “feared to shew Eli the vision” (verse 15): the message was the ruin of the man who had raised him. Under the oath he told it “every whit” (verse 18), and his first act as a prophet was to deliver the whole of a hard word.
    sources: [parker-cutting, josephus-antiquities]
  - ref: 18
    phrase: 'It is the LORD: let him do what seemeth him good'
    kind: history
    title: It is the LORD
    body: |
      Eli accepts the sentence without protest. His answer submits to the LORD's will; it neither argues nor asks for mercy.
    sources: [ot-minute-1-samuel-3]
  - ref: 20
    phrase: Samuel was established to be a prophet of the LORD
    kind: history
    title: Established to be a prophet
    body: |
      Israel knew Samuel was a prophet because the LORD stood behind his words: He “did let none of his words fall to the ground” (verse 19), so that none failed.

      “Established” is the Hebrew *ʾāman* (the Septuagint has “faithful as a prophet”). It is the word Elkanah used when he said to Hannah, “only the LORD establish his word” ([[1 Sam. 1:23]]), and here it marks the start of Samuel's public ministry, suggesting that his rise was the LORD's doing and that the LORD would sustain him. It stands against the “cut off” spoken over Eli's house in chapter 2 ([[1 Sam. 2:31]]). “From Dan even to Beer-sheba” is the whole land, Dan at its northern limit and Beer-sheba at its southern.
    sources: [olsen-birth-samuel, lxx-rahlfs, bd-beersheba, bd-dan]

christ: |
  The voice that called Samuel by name in the night was Jehovah's, the premortal Jesus Christ ([[Ex. 3:14]]), and the chapter ends with the same Lord revealing Himself again in Shiloh “by the word of the LORD” (verse 21). He still speaks through prophets and through the Spirit, and the Spirit, like the prophets, testifies of Christ. Humble servants of Christ who answer as Samuel did, “Speak; for thy servant heareth,” receive revelation to lead them.

  Hearing the Lord's voice is more than listening: it is acting on what He says, and learning to recognize His promptings is something a disciple grows into.

explore: |
  - **Other calls by name.** [[Gen. 22:1]] and [[Ex. 3:4]] (“Here am I”), [[1 Ne. 1:8–15]] and [[JS—H 1:17]], beside verses 4–10.
  - **The two Samuels.** [[Hel. 13:3]]: Samuel the Lamanite shares the biblical prophet's name, and both stories begin with the same wordplay on it.
  - **A study.** “Birth and Calling of the Prophet Samuel: A Literary Reading of the Biblical Text” (*BYU Studies*, 2017), reads chapters 1–3 as one story, ending in this call.

