chapter: 17
title: The Battle Is the LORD's
tagline: Goliath of Gath defies the armies of Israel for forty days while Saul and his men are afraid; David, sent to the camp with food for his brothers, goes out against him in the name of the LORD of hosts and kills him with a sling and a stone.
when: 'In the days of Saul, in the valley of Elah'

setting: |
  Chapter 16 ended with David anointed at Bethlehem and brought into Saul's service as his harpist and armourbearer ([[1 Sam. 16:13]]; [[1 Sam. 16:21]]). Chapter 17 opens with the Philistines, a threat to Israel ever since the tribes settled the land, gathered again for war. They camp at Shochoh in Judah, and Saul's army faces them across the valley of Elah, in the low hill country west of Jerusalem, between the mountains and the coastal plain.

  The elders had asked for a king who would “go out before us, and fight our battles” ([[1 Sam. 8:20]]). When the challenge comes, Saul is as afraid as the rest of his army, and the one who goes out is a shepherd boy. The victory is the turning point of David's life: it brought him “from obscurity to national awareness,” with Jonathan's love and Saul's jealousy beginning in the next chapter ([[1 Sam. 18:1–9]]).

  Restoration scripture knows the story. Nephi tells his killing of Laban in words that recall it (the note at verse 51). The chapter's last scene, Saul asking whose son David is, raises a puzzle; the note at verse 55 takes it up.

thread: |
  The chapter is a contest of voices, and each speaker shows what he trusts. Goliath trusts his size and his armor, and he frames the fight as a contest between peoples: the loser's nation will serve the winner's (verse 9). Saul and all Israel hear him and are “dismayed, and greatly afraid” (verse 11), and for forty days no one answers. Eliab hears only his little brother's pride (verse 28). Saul sees “but a youth” (verse 33).

  David hears the same challenge and names it differently. He asks about the reward the men have just described, and in the same breath he calls the giant an “uncircumcised Philistine” who has defied “the armies of the living God” (verse 26), and from then on he speaks of the LORD at every turn: to Saul, the LORD who delivered him from the lion and the bear will deliver him (verse 37); to Goliath, he comes “in the name of the LORD of hosts” (verse 45). His last words before the fight state the point of the chapter, that “the LORD saveth not with sword and spear: for the battle is the LORD's” (verse 47), and the narrator makes the story prove it: David prevailed “with a sling and with a stone,” and “there was no sword in the hand of David” (verse 50). In the Church's reading, the battle proved it to Israel and “to anyone who has spiritual battles to fight.”

sections:
  - range: 1-11
    heading: Goliath's challenge
    plain: |
      The Philistines gathered their armies for war at Shochoh, a town of Judah, and camped between Shochoh and Azekah, at Ephes-dammim. Saul and the men of Israel gathered and camped by the valley of Elah and drew up their battle line against the Philistines. The Philistines stood on a hill on one side and Israel on a hill on the other, with the valley between them. A champion came out of the Philistine camp, Goliath of Gath, six cubits and a span tall. He had a helmet of brass on his head and wore a coat of mail that weighed five thousand shekels of brass. He had brass armor on his shins and a brass *kîdôn* (the King James “target”) between his shoulders. The shaft of his spear was like a weaver's beam, and its iron head weighed six hundred shekels; a shield-bearer walked in front of him. He stood and shouted to the ranks of Israel, “Why have you come out and lined up for battle? Am I not a Philistine, and are you not Saul's servants? Choose a man for yourselves and let him come down to me. If he can fight me and kill me, we will be your servants; but if I beat him and kill him, you will be our servants and serve us.” And the Philistine said, “I defy the armies of Israel this day. Give me a man, and we will fight it out.” When Saul and all Israel heard the Philistine's words, they were dismayed and terrified.
  - range: 12-30
    heading: David comes to the camp
    plain: |
      David was the son of Jesse, the Ephrathite of Bethlehem in Judah. Jesse had eight sons and was an old man by the time of Saul. His three eldest sons had followed Saul to the war: Eliab the firstborn, Abinadab the second, and Shammah the third. David was the youngest, and he went back and forth between Saul and his father's sheep at Bethlehem. For forty days the Philistine came forward morning and evening and took his stand. Jesse said to his son David, “Take your brothers an ephah of this roasted grain and these ten loaves, and hurry to the camp. Take these ten cheeses to the commander of their thousand. See how your brothers are doing, and bring back a pledge from them.” Saul and the brothers and all the men of Israel were in the valley of Elah, fighting the Philistines. David got up early, left the sheep with a keeper, loaded up, and went as Jesse had told him. He reached the camp just as the army was going out to the battle line with the war cry, Israel and the Philistines drawn up army against army. David left his baggage with the keeper of the baggage, ran to the ranks, and greeted his brothers. While he was talking with them, the champion, Goliath the Philistine of Gath, came up out of the Philistine ranks and said the same words again, and David heard him. When the men of Israel saw the man, they all fled from him in great fear. “Have you seen this man who keeps coming up?” they said. “He comes up to defy Israel. The king will make the man who kills him very rich, will give him his daughter, and will make his father's house free in Israel.” David asked the men standing near him, “What will be done for the man who kills this Philistine and takes away this disgrace from Israel? Who is this uncircumcised Philistine, that he should defy the armies of the living God?” The people gave him the same answer: this is what will be done for the man who kills him. His eldest brother Eliab heard him talking with the men, and his anger burned against David. “Why have you come down here?” he said. “And who did you leave those few sheep with in the wilderness? I know your pride and the wickedness of your heart; you came down to watch the battle.” David said, “What have I done now? Is there not a cause?” He turned from him to someone else and asked the same thing, and the people gave him the same answer as before.
  - range: 31-40
    heading: David before Saul
    plain: |
      When David's words were overheard, they were reported to Saul, and he sent for him. David said to Saul, “Let no one lose heart because of him. Your servant will go and fight this Philistine.” Saul said to David, “You cannot go against this Philistine and fight him. You are only a youth, and he has been a warrior since his youth.” David said to Saul, “Your servant has kept his father's sheep. When a lion or a bear came and took a lamb from the flock, I went after it, struck it, and rescued the lamb from its mouth; and when it turned on me, I caught it by the beard, struck it, and killed it. Your servant has killed both the lion and the bear, and this uncircumcised Philistine will be like one of them, since he has defied the armies of the living God.” David went on, “The LORD who rescued me from the paw of the lion and from the paw of the bear will rescue me from the hand of this Philistine.” Saul said to David, “Go, and the LORD be with you.” Saul dressed David in his own armor: he put a helmet of brass on his head and a coat of mail on him. David fastened his sword over the armor and tried to walk, because he was not used to them. “I cannot go in these,” David told Saul, “for I am not used to them.” So David took them off. He took his staff in his hand, chose five smooth stones from the stream, and put them in his shepherd's bag; and with his sling in his hand he went toward the Philistine.
  - range: 41-54
    heading: David and Goliath
    plain: |
      The Philistine came on and drew near to David, with his shield-bearer in front of him. When he looked David over, he despised him, for he was only a youth, ruddy and good-looking. The Philistine said to David, “Am I a dog, that you come at me with sticks?” and he cursed David by his gods. “Come here,” he said to David, “and I will give your flesh to the birds of the air and the wild animals.” David answered the Philistine, “You come to me with a sword, a spear and a shield, but I come to you in the name of the LORD of hosts, the God of the armies of Israel, whom you have defied. This day the LORD will deliver you into my hand. I will strike you down and cut off your head, and this day I will give the bodies of the Philistine army to the birds of the air and the wild animals, so that all the earth may know that there is a God in Israel, and all this assembly may know that the LORD does not save with sword and spear. The battle is the LORD's, and He will give you into our hands.” As the Philistine moved in to meet David, David ran quickly toward the battle line to meet him. He put his hand in his bag, took out a stone, slung it, and struck the Philistine in the forehead. The stone sank into his forehead, and he fell face down on the ground. So David overcame the Philistine with a sling and a stone; he struck the Philistine and killed him, and there was no sword in David's hand. Then David ran and stood over the Philistine, took his sword, drew it from its sheath, killed him, and cut off his head with it. When the Philistines saw that their champion was dead, they fled. The men of Israel and Judah rose with a shout and chased the Philistines as far as the valley and the gates of Ekron, and the Philistine wounded fell along the road to Shaaraim, as far as Gath and Ekron. When the Israelites came back from chasing the Philistines, they plundered their camp. David took the Philistine's head and brought it to Jerusalem, and he put his armor in his own tent.
  - range: 55-58
    heading: Whose son?
    plain: |
      When Saul saw David going out to meet the Philistine, he said to Abner, the commander of the army, “Abner, whose son is this youth?” Abner said, “As surely as you live, O king, I do not know.” The king said, “Find out whose son the young man is.” As David came back from killing the Philistine, Abner took him and brought him before Saul, with the Philistine's head in his hand. Saul said to him, “Whose son are you, young man?” David answered, “I am the son of your servant Jesse of Bethlehem.”

notes:
  - ref: 4
    phrase: whose height was six cubits and a span
    kind: history
    title: How tall was Goliath?
    body: |
      Goliath's height depends on which ancient text is read. The Hebrew text behind the King James gives six cubits and a span, over nine feet. The Septuagint, the ancient Greek translation, reads “four cubits and a span,” and so does the Dead Sea Scrolls' text of the verse: about six and a half feet. Both readings are ancient, and the King James follows the Hebrew.

      On one Latter-day Saint reading, the shorter figure gives the chapter an edge. Saul stood taller than any of the people “from his shoulders and upward” ([[1 Sam. 9:2]]), an Israelite giant himself. Goliath's challenge, “choose you a man for you” (verse 8), then had an obvious answer: the king the people had asked for to fight their battles. Read that way, the shorter height may be “an implicit condemnation of Saul,” who “let fear, not faith, prevail” (verse 11).

      Gath was one of the three towns where, after Joshua's wars, the Anakim, the giants of Canaan, “remained” ([[Josh. 11:22]]); who the Anakim were is taken up at [[Deut. 1:28]]. A later Goliath the Gittite is killed by Elhanan in [[2 Sam. 21:19]]; there “the reference is probably to a different man of the same name, or some error may have crept into the text.”
    sources: [lxx-rahlfs, sc-knowhy-856, bd-goliath, lds-scriptures]

  - ref: 6
    phrase: a target of brass between his shoulders
    kind: words
    title: The target between his shoulders
    body: |
      The “target” is a piece of Goliath's gear that has been read as armor, a javelin and a curved sword, and the same Hebrew word comes back in David's answer to him. In older English a target was “a shield or buckler of a small kind.” The Church's footnote gives the reading of the Targum, the ancient Aramaic translation: “armor protecting the neck.” The Hebrew word is *kîdôn*, and it appears again in verse 45, where the King James renders it “shield”: Goliath comes “with a sword, and with a spear, and with a shield.”

      The Hebrew lexicon reads *kîdôn* as a weapon, a “dart, javelin,” distinct from the spear, and lists sword, spear and *kîdôn* in verse 45 as the “weapons of Goliath.” One Latter-day Saint study goes further: since the Dead Sea Scrolls, it says, scholars take *kîdôn* as a scimitar, a curved sword, so that Goliath carried a sword and a cimeter both, the pairing some readers have found strange when the Book of Mormon gives it to the Lamanite chieftain Zerahemnah. On the lexicon's reading or the study's, the *kîdôn* is a weapon, David's list in verse 45 names Goliath's three weapons, and against all three he sets a name.
    sources: [webster-1828, lds-scriptures, oshb-wlc, bdb, sc-knowhy-472]

  - ref: 25
    phrase: make his father’s house free in Israel
    kind: words
    title: A house made free
    body: |
      The last of the king's three rewards was freedom for the hero's whole family from what it owed the crown. The Hebrew *ḥopšî*, “free,” is the word for a Hebrew slave set free in the seventh year ([[Ex. 21:2]]); here it means “free from taxes, obligations, etc.” Riches, a royal marriage and an exempt house were promised to whoever would answer the challenge.

      The daughter does come up again. After the victory Saul offers David his elder daughter Merab, “only be thou valiant for me, and fight the LORD's battles” ([[1 Sam. 18:17]]), and then Michal, for a bride-price meant to get him killed ([[1 Sam. 18:25]]).
    sources: [bdb, lds-scriptures]

  - ref: 26
    phrase: who is this uncircumcised Philistine, that he should defy the armies of the living God
    kind: history
    title: The armies of the living God
    body: |
      David's first words in the camp turn Goliath's challenge from a contest between two peoples into an insult to Israel's God. Goliath had set Philistines against “servants to Saul” (verse 8). David calls him “uncircumcised,” which marks him as one who did not follow Jehovah or His commandments, outside the covenant whose token was circumcision ([[Gen. 17:11]]). And he calls Israel's ranks the armies “of the living God,” a phrase that sets the LORD apart from all false gods, the gods Goliath will curse by (verse 43).

      The rest of the chapter holds to that frame. David repeats it to Saul (verse 36) and to Goliath himself, “the God of the armies of Israel, whom thou hast defied” (verse 45). Goliath's challenge had been to Israel; in David's telling, the one he had defied was God.
    sources: [ot-minute-1-samuel-17, lds-scriptures]

  - ref: 28
    phrase: I know thy pride, and the naughtiness of thine heart
    kind: history
    title: Eliab's charge
    body: |
      Eliab, the eldest brother, reads David's questions as pride and bad intent. “Naughtiness” had a heavier sense in older English than it has now: “badness; wickedness; evil principle or purpose,” the meaning the 1828 dictionary gives with this very verse as its example. Eliab is accusing his brother of a wicked heart, and of leaving the sheep only to watch a battle. The quarrel of an elder brother with a younger is one scripture tells more than once: Joseph and his brothers ([[Gen. 37:4]]), and in the Book of Mormon Laman and Lemuel against Nephi ([[1 Ne. 3:28]]).

      David's reply, “Is there not a cause?” (verse 29), can be heard as a defense of his errand, his father's command; on one older reading the words more probably mean “Is it not a [mere] word?”, that is, “May I not ask a harmless question?” Either way David does not argue; he turns to another man and asks again (verse 30), and that is how his words reach Saul.
    sources: [webster-1828, ot-minute-1-samuel-17, cambridge-1-samuel]

  - ref: 34
    phrase: there came a lion, and a bear
    kind: christ
    title: The shepherd's proof
    body: |
      David answers Saul's objection, that he is a youth and Goliath a man of war, with what he had done as a shepherd, and he gives the credit to the LORD. His point is not that he is as strong as the judges of old but that the LORD had delivered him and would do it again: “The LORD that delivered me out of the paw of the lion, and out of the paw of the bear, he will deliver me out of the hand of this Philistine” ([[1 Sam. 17:37]]).

      The shepherd is how Samuel's books keep presenting David. Each of the three stories that introduce him makes him a shepherd ([[1 Sam. 16:11]]; [[1 Sam. 16:19]]; [[1 Sam. 17:15]]), and when the tribes make him king they remember the LORD's word to him, “Thou shalt feed my people Israel” ([[2 Sam. 5:2]]), joining shepherd and king. Ezekiel built a promise on the image: “I will set up one shepherd over them, and he shall feed them, even my servant David” ([[Ezek. 34:23]]). When Jesus came as the Good Shepherd ([[John 10:11]]), He fulfilled that hope of a king who feeds and cares for his people.
    sources: [ot-minute-1-samuel-17, taggart-sworn-david, lds-scriptures]

  - ref: 45
    phrase: I come to thee in the name of the LORD of hosts
    kind: history
    title: Not with sword and spear
    body: |
      David goes out to meet the best-armed man in the valley wearing no armor at all. Saul dressed him in his own helmet and coat of mail, and David took them off, because “I have not proved them” (verse 39): he was not used to wearing armor. He went with his staff, his sling and five stones from the brook, and Goliath despised him for it (verses 40–43). To the giant's sword, spear and *kîdôn* (the note at verse 6) David opposes a name: he comes “in the name of the LORD of hosts” (the title is explained at [[Hag. 1:2]]). The two speeches before the fight could hardly differ more. Goliath boasts of his own strength, and David of the LORD.

      David's speech then states the chapter's point twice. The fight will show “all the earth” that “there is a God in Israel” (verse 46), and it will show “all this assembly,” Israel itself, that “the LORD saveth not with sword and spear: for the battle is the LORD's” (verse 47). “Saveth” reaches beyond rescue in battle: on one Latter-day Saint reading the Hebrew verb also carries God's redeeming His people spiritually, and David's message, like Samuel's, was that Israel should trust the LORD and not kings or weapons of war.
    sources: [ot-seminary-lesson-87, ot-minute-1-samuel-17, lds-scriptures]

  - ref: 51
    phrase: took his sword, and drew it out of the sheath thereof
    kind: scripture
    title: Goliath's sword and Laban's
    body: |
      Nephi tells his killing of Laban in terms that recall this verse, and Latter-day Saint studies read the echo as deliberate. Nephi “beheld his sword” and “drew it forth from the sheath,” and he “smote off his head with his own sword” ([[1 Ne. 4:9]]; [[1 Ne. 4:18]]). In both stories the owner of a sword has his head cut off with it by a faithful youth, and in both the sword becomes a national heirloom: Goliath's was later kept at Nob, “wrapped in a cloth behind the ephod” ([[1 Sam. 21:9]]), and Laban's with the plates of brass and the interpreters ([[Mosiah 1:16]]; [[D&C 17:1]]).

      The comparison says something about this verse. On that reading Nephi made the connection deliberately because in both stories the deed signified the young hero's foreordained kingship, and the sword became “an enduring symbol of divine deliverance and royal legitimacy.”
    sources: [sc-knowhy-411, lds-scriptures]

  - ref: 55
    phrase: whose son is this youth?
    kind: history
    title: Why Saul asks whose son David is
    body: |
      Saul's question is puzzling because chapter 16 has already brought David to court, where Saul “loved him greatly” and made him his armourbearer ([[1 Sam. 16:21]]). The answer lies in how the book was put together: its writer, compiling from earlier records, sometimes “combined together two different accounts of the same event and has not always been careful to reconcile the two together,” and David's introduction to Saul (16:14–23 and 17:1–18:5) is the example given. The Septuagint, in its Vatican manuscript, has neither verses 12–31 of this chapter nor verses 55–58 and the first verses of the next.

      Others have read the two accounts as one story. One Latter-day Saint commentary suggests that several years had passed between the meetings and that David had grown from a child into a young man. One older reading holds that the armourbearer's post in chapter 16 was little more than an honorary title, and that Saul was asking not for the name of David's father but what kind of man the father of such a son was, both to grant the exemption he had promised his house (verse 25) and to attach the family to his court. David's answer, “I am the son of thy servant Jesse the Beth-lehemite,” was on that older reading the start of a longer conversation, the one that ends with Jonathan's soul “knit with the soul of David” ([[1 Sam. 18:1]]).
    sources: [bd-samuel-books, eom-david-king, lxx-rahlfs, keil-1-samuel, ot-minute-1-samuel-17, lds-scriptures]

christ: |
  The LORD who fought for Israel in the valley of Elah is Jehovah, the premortal Jesus Christ, and David's confidence rested on Him rather than on armor: “the battle is the LORD's” ([[1 Sam. 17:47]]). The same Lord told the latter-day Saints, “I will fight your battles” ([[D&C 105:14]]). The shepherd who saved a lamb from the lion points to the Good Shepherd (the note at verse 34).

  President Spencer W. Kimball taught that whatever a disciple's Goliath is, “he can be slain,” and that the victor follows the path David followed: he had faith in his Heavenly Father and “feared no man so long as he had the confidence of his Lord.” Since “the LORD saveth not with sword and spear” ([[1 Sam. 17:47]]), a disciple's own strength and armor are not what decide that fight.

explore: |
  - **The king who was afraid.** [[1 Sam. 8:19–20]], the request for a king to fight Israel's battles; [[1 Sam. 9:2]], Saul's height; [[1 Sam. 18:5–9]], what David's victory did to Saul.
  - **Goliath's sword.** [[1 Sam. 21:8–9]], at Nob; [[1 Ne. 4:5–19]], Nephi and Laban's sword.
  - **The battle is the LORD's.** [[2 Chr. 20:15–17]], Jahaziel's word to Jehoshaphat; [[Ps. 20:7]]; [[D&C 105:14]].

