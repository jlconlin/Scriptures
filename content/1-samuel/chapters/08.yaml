chapter: 8
title: Make Us a King
tagline: Samuel's sons take bribes, and the elders ask for a king like all the nations; the LORD tells Samuel they have rejected Him, has him warn them what a king will take, and then lets them have one.
when: 'When Samuel was old, at Ramah'

setting: |
  Chapter 7 left Samuel at the height of his work. The Philistines were subdued at Mizpeh, the cities they had taken were restored, and Samuel judged Israel all his life, going on a yearly circuit to Beth-el, Gilgal and Mizpeh and returning to his house at Ramah ([[1 Sam. 7:13–17]]). Chapter 8 opens years later, “when Samuel was old.” The Philistines were still a rising power in the region, and that threat probably sharpened the wish for a king. The uneven leadership and disunity of the age of the judges, the years when “there was no king in Israel” ([[Judg. 17:6]]), may have added to it; the Judges theme page [Right in His Own Eyes](/judges/themes/right-in-his-own-eyes/) follows that refrain.

  The law had foreseen the day. Moses allowed Israel to say “I will set a king over me, like as all the nations that are about me,” and set limits on the king ([[Deut. 17:14]]; the note there explains them). Gideon had refused a crown with the words “the LORD shall rule over you” ([[Judg. 8:23]]). Chapters 8–12 tell how Israel got its first king: the request (8), Saul chosen and anointed (9–10), his first victory (11), and Samuel's farewell (12). The Church's footnotes to the request point to Hosea's later word on Israel's kings: “I gave thee a king in mine anger” ([[Hosea 13:11]]). The Book of Mormon knew the story too; Nephi, like Samuel, did not want his people to have a king ([[2 Ne. 5:18]]).

thread: |
  The chapter turns on whose voice Israel will hear. The elders come with a reasonable complaint (Samuel is old and his sons are corrupt) and an unreasonable remedy: a king “like all the nations.” Samuel takes it to the LORD, and the answer surprises him twice. First, the request is less about Samuel than about the LORD: “they have rejected me, that I should not reign over them” (verse 7). Second, the LORD tells him to grant it anyway. Three times He says “hearken unto their voice” (verses 7, 9, 22), and when Samuel has warned them, “the people refused to obey the voice of Samuel” (verse 19).

  In the Church's reading, the fault was not kingship, which the law allowed, but the reason the people gave for wanting it, and the distrust of the LORD that it showed. The warning in the middle of the chapter makes the point concrete. The people want a king to judge them; Samuel describes a king who will take: their sons, their daughters, their fields, a tenth of their grain and flocks, and at last themselves, “and ye shall be his servants” (verse 17). They hear it and ask again, in nearly the same words. The LORD gives them what they asked, and the rest of 1 Samuel shows what it cost.

sections:
  - range: 1-5
    heading: The elders ask for a king
    plain: |
      When Samuel grew old, he made his sons judges over Israel. The firstborn was Joel and the second Abiah, and they judged at Beer-sheba. But his sons did not live as he did. They went after money, took bribes, and twisted justice. So all the elders of Israel gathered and came to Samuel at Ramah. “You are old,” they said, “and your sons do not follow your ways. Now appoint a king to judge us, like all the other nations have.”
  - range: 6-9
    heading: The LORD answers Samuel
    plain: |
      Samuel was displeased when they said, “Give us a king to judge us,” and he prayed to the Lord. The Lord told him, “Listen to the people in everything they say to you. It is not you they have rejected; they have rejected Me as their King. They are doing to you what they have done to Me from the day I brought them out of Egypt until now: they have forsaken Me and served other gods. So listen to them. But testify solemnly against them, and tell them what rights the king who reigns over them will claim.”
  - range: 10-18
    heading: What the king will take
    plain: |
      Samuel told the people who were asking him for a king everything the Lord had said. “This is what the king who reigns over you will claim as his right,” he said. “He will take your sons and put them to work for himself, with his chariots and his horsemen, and some will run in front of his chariots. He will appoint some as officers over thousands and over fifties, and others to plow his ground, reap his harvest, and make his weapons and the fittings of his chariots. He will take your daughters to be perfumers (the King James “confectionaries”), cooks and bakers. He will take the best of your fields, vineyards and olive groves and give them to his servants. He will take a tenth of your grain and of your vineyards and give it to his officials and servants. He will take your male and female servants, your finest young men and your donkeys, and put them to his own work. He will take a tenth of your flocks, and you yourselves will become his servants. On that day you will cry out because of the king you have chosen for yourselves, and the Lord will not answer you then.”
  - range: 19-22
    heading: The people insist
    plain: |
      But the people refused to listen to Samuel. “No,” they said, “we want a king over us. Then we will be like all the nations, and our king will judge us, lead us out, and fight our battles.” Samuel heard everything the people said and repeated it to the Lord. The Lord told Samuel, “Listen to them and give them a king.” Then Samuel told the men of Israel, “Go home, every man to his own city.”

notes:
  - ref: 3
    phrase: turned aside after lucre, and took bribes, and perverted judgment
    kind: history
    title: What Samuel's sons did
    body: |
      Samuel's sons sold justice, and that is what set the request for a king in motion. Samuel was a judge in the full sense: he heard cases on his yearly circuit and at Ramah ([[1 Sam. 7:15–17]]), and when he made his sons judges, they too were to decide disputes. Instead they took bribes. “Perverted judgment” is the law's own phrase for a corrupt court: the Hebrew *mishpat*, “judgment,” means here a person's legal right, and to “wrest” it is what the law forbade: “Thou shalt not wrest judgment… neither take a gift” ([[Deut. 16:19]]).

      The elders' complaint in verse 5 begins here. On one Latter-day Saint reading, their first concern was that “they expected better quality justice from their king acting as judge.” Verse 20 will add a second reason, and verse 7 a deeper one.
    sources: [bdb, dundas-kingship, lds-scriptures]

  - ref: 5
    phrase: make us a king to judge us like all the nations
    kind: history
    title: Was asking for a king wrong?
    body: |
      Asking for a king was not wrong in itself; asking for one in order to be like the nations, and in place of the LORD, was. The law of Moses had allowed a king, in almost the words the elders use ([[Deut. 17:14]]; the site's note there explains why the law hedged him about). Samuel was troubled “not necessarily because having a king was wrong, but more likely because of their reason for wanting one”: the LORD had promised to fight Israel's battles while they stayed faithful, and the request showed a lack of trust in His promises and in their covenant with Him.

      The Book of Mormon draws the same distinction, and Samuel's displeasure has been read in its light. Monarchy is not inherently evil: Mosiah grants that if a people “could have just men to be your kings,” then “it would be expedient that ye should always have kings to rule over you” ([[Mosiah 29:13]]), and then gives the reason they cannot: “because all men are not just” ([[Mosiah 29:16]]). Read beside Mosiah's, Samuel's story carries the same lesson: “the moral was not necessarily that kingship was or is inherently evil,” but that a people who would not take counsel from the Lord found that the desire for worldly kings led to sorrow.

      On the surface the elders' request was respectful. They came to Samuel, asked him to appoint the king, and gave as their reasons his age and his sons' conduct. On one Latter-day Saint reading the motive lay deeper: Israel had grown envious of the kingdoms around it, wicked and oppressive as their governments were, “so they used Samuel’s sons as an excuse.” Verse 20 says what they hoped a king would do.
    sources: [scripture-helps-1-samuel-8, sc-knowhy-153, lee-king-for-israel, ot-manual-1-samuel-1, lds-scriptures]

  - ref: 7
    phrase: they have rejected me, that I should not reign over them
    kind: christ
    title: The King they already had
    body: |
      The LORD tells Samuel that Israel already had a King, and that the King was He. Israel had lived without an earthly king since the bondage in Egypt. Its sovereign was “a heavenly king—Jehovah, who is Jesus Christ,” who had brought them through the Red Sea, given them Canaan, and raised up judges to deliver them. The elders did not ask Samuel to step aside; they asked him to choose them a king. Even so, in asking it, “the Israelites, to some extent at least, were rejecting the Lord’s leadership through his prophet.”

      Verse 8 sets the request in a long line: it is what Israel had done “since the day that I brought them up out of Egypt,” forsaking the LORD and serving other gods. Samuel himself will say it to the people at the end: they asked for a king “when the LORD your God was your king” ([[1 Sam. 12:12]]).
    sources: [lee-king-for-israel, sc-knowhy-717, lds-scriptures]

  - ref: 11
    phrase: This will be the manner of the king that shall reign over you
    kind: words
    title: The manner of the king
    body: |
      “The manner of the king” means the rights a king would claim over his subjects, not his habits or his bearing. The Hebrew word is *mishpat*, the ordinary word for “judgment” and “justice.” In verse 3 it was the legal right the sons perverted; here it has the sense of an ordinance laid down by a ruler, the same sense it has when Samuel writes “the manner of the kingdom” in a book ([[1 Sam. 10:25]]). It can also be rendered “the right of the king”: “such prerogatives as an absolute monarch claims,” the rights of “a king who would rule over his people with arbitrary and absolute power.”

      The LORD's charge to Samuel in verse 9 is also stronger than the King James may suggest. “Protest solemnly unto them” is, on one older reading, to bear witness against them and point out their wrong; the list of what such a king “will take” that follows is that witness.
    sources: [bdb, keil-1-samuel, cambridge-1-samuel]

  - ref: 17
    phrase: ye shall be his servants
    kind: history
    title: Did the warning come true?
    body: |
      For the most part it did: Samuel's warning that a people who wanted a king to serve them would become his servants was borne out in Israel's kings. The list ends in that summary: they would be “slaves to the king ye have chosen.” Read as a portrait of an absolute ruler, it shows subjects “at his disposal” for court service, the army, the royal estates and the arsenal, and Solomon's reign, prosperous as it was, tended that way ([[1 Kgs. 5:13–18]]; [[1 Kgs. 12:4]]). The list names three evils of a kingly government: heavy taxation (verses 15, 17), conscription of the people's labor (verses 11–13, 16), and seizure of their land (verses 14–15). The Church's footnote to verse 15 points to the provisions Solomon's household consumed each day ([[1 Kgs. 4:22–23]]).

      Israel had more than forty kings, most of them over a divided people, and their record is “for the most part a fulfillment of the Lord's warning words to Samuel.” Even kings whose hearts were once pure, Saul, David and Solomon among them, fell into sin. The warning was not about one bad king. The kingly system itself, “no matter how talented or noble an individual occupant of the throne may be,” does not make the best form of government.
    sources: [cambridge-1-samuel, ot-manual-1-samuel-1, lee-king-for-israel, lds-scriptures]

  - ref: 20
    phrase: go out before us, and fight our battles
    kind: history
    title: A king to fight their battles
    body: |
      The people's second reason adds what verse 5 left unsaid: they wanted a war leader as well as a judge. Ancient kings often held several roles at once, “of ruler, commander, and supreme judge,” and the elders asked for both judge and commander, a king to “judge us, and go out before us.” But Israel had been promised a warrior already. “The LORD shall fight for you, and ye shall hold your peace,” Moses said at the Red Sea ([[Ex. 14:14]]), and again, “The LORD your God which goeth before you, he shall fight for you” ([[Deut. 1:30]]). The request set those promises aside. “The painful irony here is that they already had a king who went before them and fought their battles. He was Jehovah.”

      One reading sees the request tested in chapter 17. Saul, taller than any of the people, was the obvious man to answer Goliath's challenge (see the note on [[1 Sam. 9:2]]); yet the king the people had asked for to fight their battles left the fight to David, the smallest in his family ([[1 Sam. 17:37]]).
    sources: [dundas-kingship, scripture-helps-1-samuel-8, holland-choose-lord-2022, sc-knowhy-856, lds-scriptures]

  - ref: 22
    phrase: Hearken unto their voice, and make them a king
    kind: prophets
    title: The Samuel principle
    body: |
      The LORD granted a request He would rather Israel had not made, a pattern some call the “Samuel principle”: God sometimes grants unwise requests for a time, so that people may learn from their own sad experience. Israel “learned the hard way. God wanted it to be otherwise, but within certain bounds he grants unto men according to their desires.”

      Granting the request was not the same as abandoning the people. The LORD revealed the king to Samuel ([[1 Sam. 9:15–17]]), Samuel anointed him, and the LORD gave Saul “another heart” ([[1 Sam. 10:9]]), “for clearly the Lord wanted His people to have righteous, inspired kings.”
    sources: [benson-gifts-expectations, lee-king-for-israel, lds-scriptures]

christ: |
  The King Israel rejected was Jehovah, who is Jesus Christ ([[1 Sam. 8:7]]). The Church's footnote to that verse points to the promise He made to the latter-day Saints: “in time ye shall have no king nor ruler, for I will be your king and watch over you” ([[D&C 38:21]]); when Christ comes to reign personally on the earth, a perfect theocratic government will prevail.

  Latter-day Israel feels the same pull to be like the world that ancient Israel felt in Samuel's day. Whatever a disciple sets up as a new “king” in Christ's place takes what Samuel said a king would take, the sons and daughters and possessions, and makes the disciple its servant. Christ, when a disciple comes to Him that He may be king, fights that disciple's battles and gives rest ([[Matt. 11:28]]); that does not mean the disciple sits back and lets Him do everything.

explore: |
  - **The rest of the request.** [[1 Sam. 10:17–19]], Samuel's rebuke at Mizpeh; [[1 Sam. 12:12–25]], his farewell and the people's confession.
  - **Kings in the Book of Mormon.** [[Mosiah 29:13–23]], Mosiah's reasons for ending the monarchy (the footnote to verse 9 points to verses 21–23); [[Mosiah 2:12–14]], King Benjamin's account of his own reign, which one study hears as an allusion to verses 11–18; [[2 Ne. 5:18]], Nephi's reluctance.
  - **The law of the king.** [[Deut. 17:14–20]], and Solomon's reign beside it, [[1 Kgs. 4:22–28]]; [[1 Kgs. 12:4]].

