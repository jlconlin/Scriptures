chapter: 28
title: Bring Me Up Samuel
tagline: With the Philistines camped against him and no answer from the LORD, Saul disguises himself and goes by night to a woman with a familiar spirit at Endor, asks for Samuel, and hears that the kingdom is David's and that he and his sons will be dead tomorrow.
when: 'The night before the battle at Gilboa, while David served Achish'

setting: |
  The chapter opens where [[1 Sam. 27]] left David: living among the Philistines at Ziklag, in the service of Achish of Gath. Now the Philistines gather for war against Israel, and Achish expects David and his men in the battle line and makes David “keeper of mine head,” or captain of his bodyguard. Whether David would really fight his own people is never put to the test: in [[1 Sam. 29]] the Philistine lords send him home; why Achish trusted him is at [[1 Sam. 27:10]].

  Verse 3 then sets down, by way of introduction, the two facts the story turns on: Samuel is dead and buried at Ramah ([[1 Sam. 25:1]]), and Saul had expelled the mediums from the land. This was no border raid. The whole Philistine force marched north to the plain of Esdraelon, the valley of Jezreel, where chariots and horsemen could move freely, and camped at Shunem; Saul's army was on Mount Gilboa across the valley. Endor, where the woman lived, was a town in the territory of Issachar held by Manasseh, the scene of the victory over Sisera ([[Ps. 83:10]]). The night Saul spent there was the night before his last battle, which is told in [[1 Sam. 31]].

thread: |
  The king who had put the mediums out of the land ends by going to one. Afraid of the Philistine host and met by silence from the LORD, Saul looks for a woman who has a familiar spirit, and goes to her in disguise by night. It is the culminating event in his descent: the man once chosen by the LORD and given a new heart now seeks revelation through a medium.

  What he receives is chiefly the old word. The sentence first spoken when Saul tore Samuel's mantle ([[1 Sam. 15:28]]) is spoken again, now with David's name and the reason (Amalek), and with what is new: Israel's defeat and the death of Saul and his sons, tomorrow. It leaves him on the ground with no strength in him. The chapter ends with the woman who feared him setting food before him, and he goes out into the night toward Gilboa.

  The narration says that Samuel spoke. The Church's sources hold that no medium could have brought him, and leave open what Saul did hear; the note at verse 12 sets out what they say.

sections:
  - range: 1-2
    heading: Achish calls David to battle
    plain: |
      In those days the Philistines gathered their forces to make war on Israel, and Achish said to David, “You can be sure that you and your men will go out with me to battle.” David said to Achish, “Then you will see for yourself what your servant can do.” Achish said to David, “Then I will make you my bodyguard for life.”
  - range: 3-7
    heading: Saul without an answer
    plain: |
      Samuel had died, and all Israel had mourned him and buried him in Ramah, his own town. And Saul had driven out of the land those who consulted spirits of the dead and those who claimed secret knowledge. The Philistines assembled and camped at Shunem, and Saul assembled all Israel and camped on Gilboa. When Saul saw the Philistine army, he was afraid, and his heart shook. Saul asked the Lord, but the Lord did not answer him, not by dreams, not by Urim, not by prophets. Then Saul said to his servants, “Find me a woman who consults a spirit of the dead, so that I can go to her and ask through her.” His servants told him, “There is a woman who consults a spirit at Endor.”
  - range: 8-14
    heading: The woman at Endor
    plain: |
      So Saul disguised himself, put on other clothes, and went with two men, and they came to the woman at night. “Consult a spirit for me,” he said, “and bring up for me the one I name to you.” The woman said to him, “You know what Saul has done, how he has cut off the mediums and those with secret knowledge from the land. Why are you setting a trap for my life, to get me killed?” Saul swore to her by the Lord: “As the Lord lives, no punishment will come on you for this.” The woman asked, “Whom shall I bring up for you?” He said, “Bring up Samuel for me.” When the woman saw Samuel, she screamed and said to Saul, “Why have you deceived me? You are Saul!” The king said to her, “Do not be afraid. What do you see?” The woman said to Saul, “I see a godlike being coming up out of the earth.” “What does he look like?” he asked. She said, “An old man is coming up, wrapped in a robe.” Then Saul understood that it was Samuel, and he bowed with his face to the ground.
  - range: 15-19
    heading: The sentence repeated
    plain: |
      Samuel said to Saul, “Why have you disturbed me by bringing me up?” Saul answered, “I am in great distress. The Philistines are making war on me, and God has turned away from me and no longer answers me, either by prophets or by dreams. So I have called you to tell me what to do.” Samuel said, “Why ask me, when the Lord has turned away from you and become your enemy? The Lord has done what He said through me: He has torn the kingdom out of your hand and given it to your neighbor, David. Because you did not obey the Lord's voice and did not carry out His fierce anger against Amalek, the Lord has done this to you today. The Lord will give Israel, along with you, into the hands of the Philistines. Tomorrow you and your sons will be with me. The Lord will give Israel's army into the hands of the Philistines.”
  - range: 20-25
    heading: The last meal
    plain: |
      At once Saul fell full length on the ground, terrified by Samuel's words. There was no strength left in him, for he had eaten nothing all that day and all that night. The woman came to Saul and saw how shaken he was, and she said to him, “Your servant has done what you asked. I took my life in my hands and did what you told me. Now please listen to your servant: let me set a little food before you, and eat, so that you will have strength for your journey.” He refused: “I will not eat.” But his servants joined the woman in urging him, and he listened to them. He got up from the ground and sat on the couch. The woman had a fattened calf in the house; she quickly slaughtered it, took flour, kneaded it, and baked bread without yeast. She set it before Saul and his servants, and they ate. Then they got up and left that same night.

notes:
  - ref: 3
    phrase: Saul had put away those that had familiar spirits, and the wizards, out of the land
    kind: history
    title: Familiar spirits and wizards
    body: |
      The two words name the people the law of Moses forbade Israel to consult. A person with “a familiar spirit” claimed to be able to speak with the dead (the note at [[Lev. 19:31]] explains the term). The “wizard” (*yiddĕʿōnî*) is properly one who knows, someone supposed to be acquainted with the secrets of the unseen world, and the Hebrew always names him together with the familiar spirit, as a pair. In putting them out of the land Saul did what the law required ([[Lev. 20:27]]; [[Deut. 18:9–11]]), and the woman at Endor knows it well enough to fear a trap (verse 9).

      The verse sets the fact at the head of the story because the story turns on it. When Saul was serving God he put the mediums away; when he fell into darkness he went looking for one, and in doing it “sealed his own doom.”
    sources: [ot-seminary-lesson-89, bdb, lds-scriptures, jfsmith-endor-1962]

  - ref: 6
    phrase: the LORD answered him not, neither by dreams, nor by Urim, nor by prophets
    kind: history
    title: No answer by dreams, Urim, or prophets
    body: |
      Saul asked the LORD by dreams, by the Urim (how David enquired with the ephod is at [[1 Sam. 23:9]]) and by prophets, and none answered. The verse gives no reason, but the rest of the book implies one (see the note at verse 12): Saul “had tried every legitimate means to obtain supernatural guidance, but, as he had departed from the Lord, the Lord had departed from him.”

      The question the chapter puts is what Saul did in the silence. Instead of continuing to seek and to strive to be worthy of revelation, he turned to wicked sources and broke the command he had once enforced ([[Lev. 19:31]]). Chronicles, looking back on his death, names this among its causes: he died “for asking counsel of one that had a familiar spirit, to inquire of it” (1 Chr. 10:13).
    sources: [jfsmith-endor-1962, lds-scriptures, ot-seminary-lesson-89]

  - ref: 8
    phrase: Saul disguised himself, and put on other raiment
    kind: symbol
    title: In disguise, by night
    body: |
      Saul had to come disguised because he was asking for what his own decree forbade, and the woman's first words show why: she suspects a snare for her life (verse 9). The disguise also puts the story among the Bible's tales of disguise, the first of them Saul's at Endor; Abinadi's disguise in the Book of Mormon ([[Mosiah 12:1]]) is read with them. In these stories God is set against an earthly king; the disguise is seen through, and God's will reaches the one who sought it in a form he would least want to hear; and the kings, or their heirs, die and the dynasty fails.

      So it goes here. The disguise lasts until the woman cries out, “thou art Saul” (verse 12); the answer is the one he would least want to hear; and the next day he and his sons die on Gilboa ([[1 Sam. 31:6]]).
    sources: [sc-knowhy-310]

  - ref: 12
    phrase: And when the woman saw Samuel, she cried with a loud voice
    kind: history
    title: Did Samuel come?
    body: |
      The narration says Samuel came: the woman saw him, Saul “perceived that it was Samuel,” and “Samuel said to Saul” (verses 14–15). The Church's sources say a medium could not have brought him. It is certain that a witch or other medium “cannot by any means available to her bring up a prophet from the world of spirits,” so that “Either Samuel came in spite of and not because of the witch, or some other spirit came impersonating him.” Nor could the scene have been a vision from God brought about by the medium, since no medium can make a prophet appear at her request; the footnote at verse 14 says the same.

      Joseph Smith's translation of the Bible changed six verses of this chapter, six of the fourteen it changed in 1 Samuel. As the manuscript is reported, the woman first denies having a familiar spirit (verse 9); she brings up “the words of” Samuel rather than Samuel (verses 11–12); she sees “the words of Samuel ascending out of the earth,” yet adds, “I saw Samuel also” (verse 13); and what follows is introduced as “the words of Samuel” (verse 15). The revision keeps the essentials of the story while having the medium bring up Samuel's words rather than Samuel himself. One Latter-day Saint reading draws from these changes the lesson that God does not work through false mediums, while the devil deceives by means as close to the true as he can come.

      The answer that goes furthest holds that Saul saw nothing: all he learned came from the woman's description, he “perceived that it was Samuel” through what she told him, and “All of this could have taken place entirely without the presence of the prophet Samuel.” The Lord who would not answer Saul by the means He had established (verse 6) would not then send His prophet through a means His own law condemned. Nothing in the story, the answer concludes, establishes that Samuel actually appeared. (Joseph Fielding Smith, then President of the Council of the Twelve, gave this answer by reprinting an article President Charles W. Penrose wrote in 1898.)

      The sources agree on what the scene was not: a prophet summoned by a medium, or a vision from God brought about by one. Whether Samuel came in spite of her or another spirit spoke in his name, the Church's sources do not settle, and this note does not either.
    sources: [bd-samuel, gs-samuel, lds-scriptures, nyman-jst-historical, jackson-restoring-doctrine, jfsmith-endor-1962]

  - ref: 13
    phrase: I saw gods ascending out of the earth
    kind: words
    title: Gods ascending
    body: |
      The woman's word is *ʾĕlōhîm*, a plural noun, which the King James renders “gods,” but she describes one figure: asked what he looks like, she answers, “An old man cometh up” (verse 14). Used of one figure, the word means a “godlike one,” as it does where Moses is made as God to Aaron and to Pharaoh ([[Ex. 4:16]]; [[Ex. 7:1]]). The Joseph Smith Translation changes what she saw (the note at verse 12).
    sources: [oshb-wlc, bdb]

  - ref: 16
    phrase: seeing the LORD is departed from thee, and is become thine enemy
    kind: words
    title: Become thine enemy
    body: |
      “Thine enemy” renders a rare Hebrew word, and the ancient Greek reads the line another way. As the Hebrew stands, the LORD has become Saul's *ʿār* (*ʿārekā*, “thine enemy”), a noun found only twice in the Bible. In the Septuagint the Lord has not become Saul's enemy but “has departed from thee, and taken part with thy neighbour,” and in the next verse both texts name the neighbour, David. Either way the verse begins from the departure Saul has just confessed, “God is departed from me” (verse 15).
    sources: [oshb-wlc, bdb, lxx-rahlfs]

  - ref: 19
    phrase: to morrow shalt thou and thy sons be with me
    kind: history
    title: Thou and thy sons be with me
    body: |
      “With me” means among the dead. On one older reading the words speak of Sheol, the abode of the departed spirits of righteous and wicked alike (compare [[2 Sam. 12:23]]). The sentence is short and complete: Israel defeated, Saul and his sons dead, tomorrow. It came true in the battle at Gilboa the next day ([[1 Sam. 31:1–6]]).

      That it came true has been offered as proof that Samuel spoke. But a fulfilled prediction does not by itself prove who spoke (the note at verse 12): if the familiar spirits the law banned never foretold the truth, there would have been no need to warn Israel against them, and “A little truth mixed with plausible error is one of the means by which they lead mankind astray.” Whoever spoke, the words destroyed all hope, and Saul fell full length on the ground (verse 20).
    sources: [cambridge-1-samuel, jfsmith-endor-1962, lds-scriptures, bd-endor]

christ: |
  The LORD who would not answer Saul is Jehovah, the premortal Jesus Christ ([[Ex. 3:14]]), and His silence followed Saul's own departure from Him (the note at verse 6). He has said the same in this dispensation: “They were slow to hearken unto the voice of the Lord their God; therefore, the Lord their God is slow to hearken unto their prayers, to answer them in the day of their trouble” ([[D&C 101:7]]).

  When God has anything to reveal to a disciple, it comes “in the way, by the means and through the persons whom he has appointed,” and a heaven that seems silent does not make another source His voice. Isaiah's question to those who would consult the dead holds for every disciple in trouble: “should not a people seek unto their God?” ([[Isa. 8:19]]).

explore: |
  - **The law Saul once kept.** [[Lev. 19:31]]; [[Lev. 20:6]], [[Lev. 20:27]]; [[Deut. 18:10–12]].
  - **Seek unto their God.** [[Isa. 8:19–20]], with its note.
  - **When the Lord is slow to answer.** [[1 Sam. 14:37]]; [[Mosiah 11:23–24]]; [[D&C 101:7–9]].
  - **The sentence fulfilled.** [[1 Sam. 31:1–6]], the battle on Gilboa; 1 Chr. 10:13–14, Chronicles' verdict on Saul's death.

