chapter: 23
title: Strengthened His Hand in God
tagline: David saves Keilah at the LORD's word and leaves it at the LORD's warning; Jonathan finds him in the wilderness of Ziph and strengthens his hand in God; the Ziphites betray him, and a Philistine raid calls Saul away as he closes in.
when: 'While David fled from Saul, in the wilderness of Judah'

setting: |
  Chapter 22 left David at the head of about four hundred men ([[1 Sam. 22:2]]), sent back into Judah by the prophet Gad ([[1 Sam. 22:5]]), and joined by the one priest who escaped Saul's slaughter at Nob, Abiathar the son of Ahimelech ([[1 Sam. 22:20]]). Chapter 23 follows him through three places in Judah.

  Keilah was a walled town of Judah's lowland, listed among the cities “in the valley” ([[Josh. 15:33]], [[Josh. 15:44]]), the low limestone hills that border the Philistine plain; the raid on its threshing floors came just after harvest, when the grain lay stacked for threshing. Ziph and Maon were towns of Judah's hill country ([[Josh. 15:48]], [[Josh. 15:55]]), and the wildernesses named for them were part of the desert of Judah, the waste that falls from the mountains of Judah to the Dead Sea. En-gedi, where the chapter ends, lies about halfway along the Dead Sea's western shore, in country full of caves, and chapter 24 takes place there.

  The title of Psalm 54 sets that psalm at a moment when the Ziphites betrayed David to Saul, in the words of verse 19; the note on [[Ps. 54:0]] tells the story, and the Ziphites inform on him again in nearly the same words at [[1 Sam. 26:1]].

thread: |
  The chapter turns on how David is guided. Three times he asks the LORD and is answered (verses 2, 4 and 9–12), and each answer moves him: down to Keilah to save it, against the fears of his own men, and then out of Keilah before Saul can shut him in. Saul moves on what he is told. “It was told Saul” that David was in Keilah, and later that he had escaped (verses 7, 13), and the Ziphites come to him with an offer to find David's “lurking places” for him (verses 19–23). Saul reads David's entering a walled town as God's doing, “God hath delivered him into mine hand”; the narrator sums up the whole pursuit the other way: “Saul sought him every day, but God delivered him not into his hand” (verse 14).

  At the center of the chapter, the son of the pursuer comes to the fugitive in the wood and strengthens “his hand in God.” One older reading sees the chapter as the LORD at once giving David pledges that he would be king and leading him into deeper trouble to train him for it, and closing with “a marvellous interposition on the part of the faithful covenant God”: the messenger who calls Saul away just as his men are closing around David on the mountain.

sections:
  - range: 1-5
    heading: David saves Keilah
    plain: |
      Word came to David that the Philistines were attacking Keilah and plundering its threshing floors, where the harvested grain lay. David asked the Lord, “Shall I go and attack these Philistines?” The Lord answered, “Go, attack the Philistines, and save Keilah.” But David's men said to him, “We are afraid even here in Judah. How much more if we go to Keilah against the Philistine ranks!” So David asked the Lord again, and the Lord answered, “Go down to Keilah, for I will give the Philistines into your hand.” David and his men went to Keilah, fought the Philistines, drove off their livestock, and struck them a heavy blow. So David saved the people of Keilah.
  - range: 6-13
    heading: The LORD warns David out of Keilah
    plain: |
      (When Abiathar the son of Ahimelech fled to David, he had brought the ephod down with him to Keilah.) Saul was told that David had come to Keilah, and he said, “God has given him into my hand, for he has shut himself in by entering a town with gates and bars.” Saul called all the people to war, to go down to Keilah and besiege David and his men. When David learned that Saul was plotting harm against him, he said to Abiathar the priest, “Bring the ephod here.” Then David prayed: “O Lord God of Israel, your servant has heard for certain that Saul means to come to Keilah and destroy the city because of me. Will the men of Keilah hand me over to him? Will Saul come down, as your servant has heard? O Lord God of Israel, I beg you, tell your servant.” The Lord said, “He will come down.” David asked, “Will the men of Keilah hand me and my men over to Saul?” The Lord said, “They will hand you over.” So David and his men, now about six hundred, left Keilah and kept moving wherever they could go. When Saul was told that David had escaped from Keilah, he gave up the expedition.
  - range: 14-18
    heading: Jonathan in the wood
    plain: |
      David stayed in strongholds in the wilderness, in the hill country of the wilderness of Ziph. Saul searched for him every day, but God did not give him into his hand. David knew that Saul had come out to take his life. While David was in the wilderness of Ziph, in the woods, Saul's son Jonathan came to him there and strengthened his hand in God. “Do not be afraid,” he said, “for the hand of my father Saul will not find you. You will be king over Israel, and I will be second to you. Even my father Saul knows it.” The two of them made a covenant before the Lord. Then David stayed in the woods, and Jonathan went home.
  - range: 19-23
    heading: The Ziphites offer to hand David over
    plain: |
      The men of Ziph went up to Saul at Gibeah and said, “Isn't David hiding among us, in the strongholds in the woods, on the hill of Hachilah, south of the wasteland? Now, O king, come down whenever your heart desires, and it will be our part to hand him over to you.” Saul said, “The Lord bless you, for you have had pity on me. Go and make still more certain. Find out the place where he goes and who has seen him there, for I am told he is very cunning. Learn all the hiding places where he takes cover, then come back to me with sure word, and I will go with you. If he is in the land, I will search him out among all the clans of Judah.”
  - range: 24-29
    heading: Saul called away at the rock
    plain: |
      So they set out for Ziph ahead of Saul. But David and his men were in the wilderness of Maon, in the plain south of the wasteland. Saul and his men went to look for him, and David was told of it, so he went down to the rock and stayed in the wilderness of Maon. When Saul heard that, he pursued David there. Saul was going along one side of the mountain, and David and his men along the other. David was hurrying to get away from Saul, for Saul and his men were closing in around David and his men to take them. Then a messenger came to Saul: “Hurry, come! The Philistines have raided the land.” So Saul broke off the pursuit of David and went to meet the Philistines. That is why the place was called Sela-hammahlekoth, “the rock of divisions.” David went up from there and lived in the strongholds of En-gedi.

notes:
  - ref: 9
    phrase: Bring hither the ephod
    kind: history
    title: How David inquired of the LORD
    body: |
      David asked the LORD through the priest Abiathar and the ephod he had brought. Abiathar was the one son of Ahimelech to escape the slaughter of the priests at Nob; he fled to David ([[1 Sam. 22:20]]) and was still with him at Ziklag ([[1 Sam. 30:7]]). Verse 6 is a remark the narrator inserts to explain how David could inquire of the LORD at all: the priest had come “with an ephod in his hand.” Since David has already inquired twice by then (verses 2 and 4), the priest had evidently joined him before he went down to Keilah; on one older reading “to Keilah” is a compressed way of saying that Abiathar went down there with David, and the Septuagint reads “he went down with David to Keila.”

      The high priest's ephod was a richly worked garment with two shoulder pieces, and the breastplate was fastened to it. In the breastplate were the Urim and Thummim, an instrument God prepared to help men receive revelation from the Lord; the note on [[Ex. 28:30]] explains it, and leaves open how it worked. When David sent for the ephod again at Ziklag, his use of it “almost certainly involved the use of the Urim and Thummim,” because the breastplate that held them was attached to the ephod: he asked the high priest to inquire, and got an immediate answer ([[1 Sam. 30:7–8]]). At Keilah he asks through the same priest and the same ephod.

      In these verses David lays the matter before the LORD in prayer, as a servant speaking to his master, and asks particular questions. On one older reading the answers came to one question at a time: in verse 11 he asked whether Keilah would hand him over and whether Saul would come, and was answered only the second, so in verse 12 he asked the first again. The answers told him what was coming: Saul would come, and the town he had just saved would give him up. He left with his six hundred men before Saul could act, and Saul “forbare to go forth.”
    sources: [bd-abiathar, cambridge-1-samuel, keil-1-samuel, lxx-rahlfs, bd-ephod, bd-urim-and-thummim, ot-manual-1-samuel-16, lds-scriptures]

  - ref: 16
    phrase: strengthened his hand in God
    kind: words
    title: Strengthened his hand in God
    body: |
      To strengthen someone's hand is a Hebrew way of saying to sustain and encourage him, and the verse adds where Jonathan's encouragement came from: “in God.” What the text says Jonathan brought were words, and verse 17 gives them: do not fear, Saul will not find you, and you will be king over Israel.
    sources: [bdb]

  - ref: 17
    phrase: I shall be next unto thee
    kind: history
    title: The heir who would stand second
    body: |
      Saul expected his son Jonathan to reign after him, but here Jonathan says plainly that the kingdom would go to David and that he himself would stand second to him. His words, “Fear not … thou shalt be king over Israel,” are spoken within the covenant between them, under which David would show Jonathan *ḥesed*, covenant loyalty; what that covenant was is explained at [[1 Sam. 18:3]]. Verse 18 has them make a covenant before the LORD once more, and the last word of the scene is that Jonathan went home and David stayed in the wood.

      “And that also Saul my father knoweth.” The footnote points to the outburst in chapter 20, where Saul told Jonathan, “as long as the son of Jesse liveth upon the ground, thou shalt not be established, nor thy kingdom” ([[1 Sam. 20:31]]). In the next chapter Saul says it himself, to David's face: “I know well that thou shalt surely be king” ([[1 Sam. 24:20]]).
    sources: [taggart-sworn-david, lds-scriptures]

christ: |
  The LORD whom David asked at Keilah was Jehovah, the premortal Jesus Christ ([[Ex. 3:14]]), and He answered a hunted man question by question, sending him to save a town and then warning him out of it. The Church's footnote at “inquired” (verse 2) points to Nephi's counsel that “ye must not perform any thing unto the Lord save in the first place ye shall pray unto the Father in the name of Christ” ([[2 Ne. 32:9]]).

  A disciple who prays to the Father in the name of Christ before performing anything unto the Lord has Nephi's promise that He “will consecrate thy performance unto thee, that thy performance may be for the welfare of thy soul” ([[2 Ne. 32:9]]).

explore: |
  - **The ephod again.** [[1 Sam. 30:7–8]], David inquiring through Abiathar at Ziklag; and [[1 Sam. 28:6]], Saul, to whom the LORD gave no answer “by Urim.”
  - **The Ziphites again.** [[1 Sam. 26:1–25]], where they inform a second time and David spares Saul's life; [[Ps. 54:1–7]], the psalm whose title sets it at the Ziphites' betrayal.
  - **The covenant.** [[1 Sam. 20:12–17]] and [[1 Sam. 20:41–42]], its terms and the parting; [[2 Sam. 9:1–7]], David keeping it with Jonathan's son.

