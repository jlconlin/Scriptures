alt: A shepherd's sling of two cords and a worn leather pouch lies dropped on the pebbly shore of a brook at first light, with five small stones beside it; in the middle distance a bronze scale corselet and a helmet lie cast off in the grass; a rough standing stone rises on a rise at the left, and a scrap of dark cloth lies on a rock by the mouth of a cave at the lower right.
