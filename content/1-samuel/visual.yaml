summary: >-
  First Samuel is the book of the LORD's anointed: a king asked for like the nations, a king
  rejected, and a shepherd chosen because "the LORD looketh on the heart." Its best-known
  scene is the shepherd who went out against the giant with a sling and five smooth stones,
  saying “the battle is the LORD's,” and the same shepherd later
  cut the skirt of Saul's robe in a cave and would not lift his hand against the LORD's anointed. It points to Jesus Christ, the Anointed One, whom Hannah's
  song first calls "his anointed" (2:10), and who is the help that Israel keeps finding when
  it has lost everything else.
motifs:
  - "Primary: on a strip of pebbly shore beside a flowing brook, a shepherd's sling dropped loosely, two thin plaited cords knotted through a limp, flat scrap of worn brown leather, one cord coiled over itself and the other trailing; near it five small, irregular, grey and brown water-worn stones (1 Sam. 17:40)."
  - "Supporting: in the middle distance on the grass, Saul's armor cast off: a stiff bronze scale corselet with buckled leather shoulder straps slumped where it was dropped, and a bronze helmet with cheek guards tipped over beside it (1 Sam. 17:38–39)."
  - "Supporting: one rough, unshaped standing stone set upright on a low rise at the left, with a few smaller stones at its foot (1 Sam. 7:12)."
  - "Supporting: at the lower right, on a flat rock near the dark mouth of a cave in a low cliff, a small scrap of plain dark wool with a stitched hem, the piece cut from a robe (1 Sam. 24:4)."
composition: >-
  A wide, calm landscape at the first warm light of morning: a broad valley between low
  ridges, the sun just above the far ridge at the right and shadows falling to the left. A
  narrow brook flows across the lower right in a shallow channel. On the pebbly shore at the
  lower left lie the dropped sling and its five stones. In the middle distance, apart from
  them on the grass, the armor and helmet lie cast off together. At the left, on a gentle
  rise, the standing stone casts a long shadow; at the lower right, the scrap of cloth lies on
  a flat rock by the cave. No figures or bodies, no swords or spears, no armies, tents,
  crowns or thrones.
# "What's in this picture" under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The sling and the five smooth stones by the brook** are David’s against Goliath: “he took his staff in his hand, and chose him five smooth stones out of the brook, and put them in a shepherd’s bag which he had, even in a scrip; and his sling was in his hand” ([[1 Sam. 17:40]]), for “the battle is the LORD’s” ([[1 Sam. 17:47]]).'
  - '**The armor and helmet cast off in the grass** are Saul’s, which David put off: “Saul armed David with his armour, and he put an helmet of brass upon his head; also he armed him with a coat of mail. … And David said unto Saul, I cannot go with these; for I have not proved them. And David put them off him” ([[1 Sam. 17:38–39]]).'
  - '**The standing stone** is Samuel’s Eben-ezer: “Then Samuel took a stone, and set it between Mizpeh and Shen, and called the name of it Eben-ezer, saying, Hitherto hath the LORD helped us” ([[1 Sam. 7:12]]).'
  - '**The cut corner of cloth beside the cave** is the skirt David cut from Saul’s robe when he could have killed him, and then would not: “The LORD forbid that I should do this thing unto my master, the LORD’s anointed” ([[1 Sam. 24:4]]; [[1 Sam. 24:6]]).'
