summary: >-
  First Samuel is the book of the LORD's anointed: a king asked for like the nations, a king
  rejected, and a shepherd chosen because "the LORD looketh on the heart." Its quiet center is
  a plain horn of oil standing on the ground, poured out for the one the LORD names and not
  the one people would choose. It points to Jesus Christ, the Anointed One, whom Hannah's
  song first calls "his anointed" (2:10), and who is the help that Israel keeps finding when
  it has lost everything else.
motifs:
  - "Primary: a curved ram's horn, stoppered and standing upright on bare ground, its rim wet with a thin line of oil that has run down one side and glints in the low light (1 Sam. 16:13)."
  - "Supporting: one rough, unshaped standing stone set upright on a low rise at the left, alone, with a few smaller stones at its foot (1 Sam. 7:12)."
  - "Supporting: a cut-off corner of dark indigo woolen cloth with a clean straight edge, lying folded on a flat rock at the lower right, near the dark mouth of a cave in a low cliff (1 Sam. 24:4)."
composition: >-
  A wide, calm landscape of the hill country at the first warm light of morning. In the near
  foreground, just right of center, the horn of oil stands upright on bare clay-colored
  ground; it is the clearest, brightest shape in the picture, with a small gleam of oil along
  its side and a soft shadow thrown to the left. At the left, on a gentle rise in the middle
  distance, one unshaped standing stone casts a long shadow across olive-green grass. At the
  lower right, the folded piece of indigo cloth lies on a flat rock beside the dark opening of a
  cave, small and quiet and not the focal point. Behind them the land falls away in soft layers
  of muted olive and indigo shadow toward a distant ridge, and the sky shades from deep indigo
  at the top to restrained gold at the horizon. No figures, crowns, thrones, weapons, armies,
  fire, or storms; no other vessels or objects.
# "What's in this picture" under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The horn of oil** is the one Samuel carried to Bethlehem: “Then Samuel took the horn of oil, and anointed him in the midst of his brethren: and the Spirit of the LORD came upon David from that day forward” ([[1 Sam. 16:13]]).'
  - '**The standing stone** is Samuel’s Eben-ezer: “Then Samuel took a stone, and set it between Mizpeh and Shen, and called the name of it Eben-ezer, saying, Hitherto hath the LORD helped us” ([[1 Sam. 7:12]]).'
  - '**The cut corner of cloth beside the cave** is the skirt David cut from Saul’s robe when he could have killed him, and then would not: “The LORD forbid that I should do this thing unto my master, the LORD’s anointed” ([[1 Sam. 24:4]]; [[1 Sam. 24:6]]).'
alt: A curved ram's horn stands upright on bare ground with a thin line of oil running down its side, in a hilly landscape at first light; a single rough standing stone rises on a low rise at the left, and a folded piece of dark blue cloth lies on a flat rock near the mouth of a cave at the lower right, under an indigo-to-gold sky.
status: proposed
