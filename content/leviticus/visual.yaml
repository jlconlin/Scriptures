summary: >-
  Leviticus is the law given from the finished tabernacle, and its quiet center is how
  a holy God makes a way for an unholy people to live near Him. A fire is kept burning
  on the altar and never allowed to go out; once a year the people's sins are carried
  away into the wilderness; and the same holiness reaches out of the sanctuary into the
  edge of an ordinary field. The offerings and the Day of Atonement point to the
  sacrifice of Jesus Christ, through whom the way to the Lord's presence is opened.
motifs:
  - "Primary: a square altar of wood overlaid with dark bronze, a horn at each of its four corners and a bronze grating around its middle, a steady fire burning on wood laid upon it and a thin, straight thread of smoke going up (Lev. 6:13; Lev. 9:24)."
  - "Supporting: one lone goat walking away from the altar along a faint path toward bare, pale wilderness, alone and unled, with open ground between it and the camp (Lev. 16:22)."
  - "Supporting: the corner of a grain field left standing at its edge, ripe ears of barley not cut, beside a low stone wall (Lev. 19:9–10)."
composition: >-
  A wide landscape at dusk in the open court of the tabernacle on bare, trodden sand, seen from a low, slightly
  raised viewpoint. The altar stands just right of center, a little forward of the middle
  of the picture and clearly the largest form; its fire is the warmest, brightest point
  in the picture and glints on the bronze. No paving and no stone anywhere in the court. At the far left the uncut grain field
  and its low wall catch the last gold light. To the right the faint path runs out past the
  altar's side to the goat, small and distant, walking toward pale, empty hills under a
  wide indigo sky. A long, low dark tent shows small and quiet far behind the altar,
  as a distant setting only. No blood, no sacrificed animal on the altar, no destruction.
  No figures or buildings.
alt: A square bronze altar with horns at its corners holds a steady fire and a thin line of smoke at dusk; to the left the edge of a grain field stands uncut beside a low wall, and to the right a single goat walks along a faint path toward pale, empty hills, with a low dark tent far behind.
status: proposed
