summary: >-
  Leviticus is the law given from the finished tabernacle, and its quiet center is how
  a holy God makes a way for an unholy people to come near Him. The fire on the altar
  of burnt offering is kept burning and never allowed to go out; the altar stands before
  the door of the tent, inside the court; and once a year the people's sins are carried
  away into the wilderness. The offerings and the Day of Atonement point to the sacrifice
  of Jesus Christ, through whom the way to the Lord's presence is opened.
motifs:
  - "Primary: a square altar of wood overlaid with bronze, a horn at each of its four corners and a bronze grating around its middle, a fire burning on wood laid upon it and a thread of smoke going up (Lev. 6:13; Ex. 27:1–4)."
  - "Supporting: the tent of the tabernacle behind the altar, its curtained door facing the altar (Ex. 40:6; Lev. 1:1)."
  - "Supporting: the court around them, a wall of plain white linen hangings on posts, enclosing bare sand, open in a gate at the right (Ex. 27:9–18)."
  - "Supporting: one goat walking away alone through the gate on a path into the darkening wilderness (Lev. 16:21–22)."
composition: >-
  A wide view at dusk from a raised viewpoint inside the court. The bronze altar stands
  left of center in the foreground, its fire the warmest point in the picture. Behind it,
  the dark tent of the tabernacle with its curtained door. The white linen hangings run
  around the court and open in a gate at the right, where a path leads out and one small
  goat walks away alone toward empty hills under a deep indigo sky. The sun has just set
  behind the hills at the far left; the altar and the posts cast long shadows to the
  right. Few, large, simply drawn forms in broad areas of color with little surface
  detail. No blood, no sacrificed animal, no figures.
alt: A square bronze altar with horns at its corners holds a fire at dusk inside the white linen court of the tabernacle, with the dark tent behind it; at the right the court opens in a gate, and a single goat walks out alone toward empty hills.
key:
  - '**The bronze altar** is the altar of burnt offering, of wood overlaid with brass, with “a grate of network of brass” around it ([[Ex. 27:1–4]]). It was set “before the door of the tabernacle of the tent of the congregation” ([[Ex. 40:6]]), and every offering of chapters 1–7 was made on it.'
  - '**The fire on the altar** is the fire the law kept: “The fire shall ever be burning upon the altar; it shall never go out” ([[Lev. 6:13]]).'
  - '**The tent behind it, with its curtained door,** is the tabernacle, from which “the LORD called unto Moses, and spake unto him out of the tabernacle of the congregation” to give the book ([[Lev. 1:1]]).'
  - '**The white hangings** are the court around the tabernacle, of “fine twined linen” ([[Ex. 27:18]]).'
  - '**The goat going out alone through the gate** is the scapegoat of the Day of Atonement, sent “into the wilderness” ([[Lev. 16:10]]): “the goat shall bear upon him all their iniquities unto a land not inhabited” ([[Lev. 16:22]]). Isaiah says the same of the Savior: “he shall bear their iniquities” ([[Isa. 53:11]]; [[Mosiah 14:11]]).'
