summary: >-
  Leviticus is the law given from the finished tabernacle, and its quiet center is how
  a holy God makes a way for an unholy people to come near Him. The altar of burnt
  offering stands before the door of the tent, inside the court, and its fire is never
  allowed to go out. Once a year the goat carries the people's sins away into the
  wilderness. The offerings and the Day of Atonement point to the sacrifice
  of Jesus Christ, through whom the way to the Lord's presence is opened.
motifs:
  - "Primary: a square altar of wood overlaid with bronze, a tall pointed horn at each of its four corners and a bronze grating around its middle, a fire burning on wood laid upon it and a thread of smoke going up (Lev. 6:13; Ex. 27:1–4)."
  - "Supporting: the tent of the tabernacle far back at the end of the long court, its curtained door facing the altar (Ex. 40:6; Lev. 1:1)."
  - "Supporting: the court around them, a wall of plain white linen hangings on posts, enclosing bare sand, open at the right (Ex. 27:9–18)."
  - "Supporting: one goat walking away alone through the opening on a path into the darkening wilderness (Lev. 16:21–22)."
composition: >-
  A wide view at dusk from a raised viewpoint inside the court. The bronze altar stands
  left of center in the foreground, its fire the warmest point in the picture, with a tall
  pointed horn rising from each of its four top corners (Ex. 27:2). A long stretch of open
  sand lies between it and the tent, which stands far back at the end of the court with its
  curtained door facing the altar. The white linen hangings run the length of the court on
  both sides and open at the right, where a path leads out and one small goat walks away
  alone toward empty hills under a deep indigo sky. The sun has just set behind the hills
  at the far left; the altar and the posts cast long shadows to the right. Simply drawn
  forms in broad areas of color with little surface detail. No blood, no sacrificed
  animal, no figures.
