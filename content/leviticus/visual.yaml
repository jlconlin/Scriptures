alt: A square bronze altar with tall horns at its corners holds a fire at dusk inside the long white linen court of the tabernacle, with the tent far back at the court's end; at the right the hangings open and a single goat walks out alone toward empty hills.
key:
  - '**The bronze altar** is the altar of burnt offering, of wood overlaid with brass, with “a grate of network of brass” around it ([[Ex. 27:1–4]]). It was set “before the door of the tabernacle of the tent of the congregation” ([[Ex. 40:6]]), and every offering of chapters 1–7 was made on it.'
  - '**The fire on the altar** is the fire the law kept: “The fire shall ever be burning upon the altar; it shall never go out” ([[Lev. 6:13]]).'
  - '**The tent at the far end of the court, with its curtained door,** is the tabernacle, from which “the LORD called unto Moses, and spake unto him out of the tabernacle of the congregation” to give the book ([[Lev. 1:1]]).'
  - '**The white hangings** are the court around the tabernacle, of “fine twined linen” ([[Ex. 27:18]]).'
  - '**The goat going out alone at the right** is the scapegoat of the Day of Atonement, sent “into the wilderness” ([[Lev. 16:10]]): “the goat shall bear upon him all their iniquities unto a land not inhabited” ([[Lev. 16:22]]). Isaiah says the same of the Savior: “he shall bear their iniquities” ([[Isa. 53:11]]; [[Mosiah 14:11]]).'
