chapter: 25
claims:
  # ---------- when / setting ----------
  - where: 'when'
    claim: 'The chapter is given in mount Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'And the LORD spake unto Moses in mount Sinai, saying'
  - where: 'when'
    claim: 'The tabernacle was raised in the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'in the first month in the second year, on the first day of the month, that the tabernacle was reared up'
  - where: 'setting'
    claim: 'Every seventh year was consecrated to the Lord, as the seventh day and seventh month'
    key: bd-sabbatical-year
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbatical-year?lang=eng'
    quote: 'As was the seventh day in every week and the seventh month in every year, so also was every seventh year consecrated to the Lord.'
  - where: 'setting'
    claim: 'The sabbatical year was habitually broken before the exile'
    key: bd-sabbatical-year
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbatical-year?lang=eng'
    quote: 'The law of the sabbatical year was habitually broken by the Jews for a long period before the Babylonian exile.'

  # ---------- notes ----------
  - where: 'note 25:2 “A sabbath for the land”'
    claim: 'The land, being the Lord’s, kept a sabbath to Him'
    key: bd-sabbatical-year
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbatical-year?lang=eng'
    quote: 'The land, inasmuch as it was the Lord’s, was to keep a Sabbath unto Him (Lev. 25:2–7).'
  - where: 'note 25:2 “A sabbath for the land”'
    claim: 'The year was one of religious instruction; the law was read at Tabernacles at its start'
    key: bd-sabbatical-year
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sabbatical-year?lang=eng'
    quote: 'The year was intended to be not simply a year of leisure but also one of religious instruction and exercises. To mark this, at the Feast of Tabernacles (at the commencement of the sabbatical year, which began with the seventh month) the whole law was read'
  - where: 'note 25:2 “A sabbath for the land”'
    claim: 'Leviticus extends the land sabbath of Exodus to a jubilee every seven sabbath years'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'However, the latter extends the concept to include a jubilee year every seven Sabbath years (after forty-nine years)'
  - where: 'note 25:2 “A sabbath for the land”'
    claim: 'The year’s produce is food for owner, servants, hired servant, stranger, cattle and beasts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'for thee, and for thy servant, and for thy maid, and for thy hired servant, and for thy stranger that sojourneth with thee'

  - where: 'note 25:9 “The trumpet on the Day of Atonement”'
    claim: 'The jubilee was inaugurated on the Day of Atonement of the fiftieth year'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'This Jubilee was to be inaugurated on the Day of Atonement of the fiftieth year'
  - where: 'note 25:9 “The trumpet on the Day of Atonement”'
    claim: 'Bowen: the trumpet image, a variation of which is on many temples, symbolizes the gospel proclaimed on both sides of the veil'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'a variation of which bestrides many of our temples, as a symbol of the proclamation or preaching of the gospel—true liberty—to every human being on both sides of the veil'
  - where: 'note 25:9 “The trumpet on the Day of Atonement”'
    claim: 'One older reading (Ginsburg, printed in the manual): forgiven on that day, each Israelite proclaimed he had freed estates and slaves'
    key: ot-manual-lev-19-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-19-27-a-law-of-performances-and-ordinances-part-3-laws-of-mercy-and-righteousness?lang=eng'
    quote: 'every Israelite was called upon to proclaim throughout the land, by nine blasts of the cornet, that he too had given the soil rest, that he had freed every encumbered family estate, and that he had given liberty to every slave'
  - where: 'note 25:9 “The trumpet on the Day of Atonement”'
    claim: 'As God forgave his debts, he is to forgive his debtors'
    key: ot-manual-lev-19-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-19-27-a-law-of-performances-and-ordinances-part-3-laws-of-mercy-and-righteousness?lang=eng'
    quote: 'Inasmuch as God has forgiven his debts, he also is to forgive his debtors.'
  - where: 'note 25:9 “The trumpet on the Day of Atonement”'
    claim: 'The horn sounds on the tenth day of the seventh month, the day of atonement'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'Then shalt thou cause the trumpet of the jubilee to sound on the tenth day of the seventh month'

  - where: 'note 25:10 “Jubilee: the year of the ram’s horn”'
    claim: 'The Hebrew word in verse 10'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'יוֹבֵ֥ל'
  - where: 'note 25:10 “Jubilee: the year of the ram’s horn”'
    claim: 'The Hebrew of “liberty” in verse 10'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'דְּר֛וֹר'
  - where: 'note 25:10 “Jubilee: the year of the ram’s horn”'
    claim: 'BDB: yobel is ram, ram’s horn'
    key: bdb
    url: 'https://biblehub.com/hebrew/3104.htm'
    quote: 'ram, ram''s horn, cornet'
  - where: 'note 25:10 “Jubilee: the year of the ram’s horn”'
    claim: 'BDB: the designation of the fiftieth year; verse 10 literally a ram’s horn blowing shall it be'
    key: bdb
    url: 'https://biblehub.com/hebrew/3104.htm'
    quote: 'designation of 50th year, marked by blowing of cornets'
  - where: 'note 25:10 “Jubilee: the year of the ram’s horn”'
    claim: 'BDB rendering of Lev. 25:10'
    key: bdb
    url: 'https://biblehub.com/hebrew/3104.htm'
    quote: 'a ram (''s horn blowing) shall it be to you'
  - where: 'note 25:10 “Jubilee: the year of the ram’s horn”'
    claim: 'The year is named for the trumpet that announced it on the Day of Atonement'
    key: bd-jubilee-year-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jubilee-year-of?lang=eng'
    quote: 'It got its name from the fact that the beginning of the year was announced by the blowing of a trumpet on the Day of Atonement.'
  - where: 'note 25:10 “Jubilee: the year of the ram’s horn”'
    claim: 'Land reverted to the original family, except walled cities; Israelite bondmen set free'
    key: bd-jubilee-year-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jubilee-year-of?lang=eng'
    quote: 'land that had changed hands, except in non-Levitical walled cities, reverted to the family to which it had belonged at the original settlement, and all bondmen of Israelite birth were set free'
  - where: 'note 25:10 “Jubilee: the year of the ram’s horn”'
    claim: 'No Old Testament record of a jubilee kept'
    key: bd-jubilee-year-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jubilee-year-of?lang=eng'
    quote: 'We have no record in the Old Testament of the observance of any year of jubilee'
  - where: 'note 25:10 “Jubilee: the year of the ram’s horn”'
    claim: 'Welch: hard to imagine its practice, since the Old Testament never mentions it kept'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Since the Old Testament never explicitly mentions the observance of a Jubilee year, it is difficult to imagine what it would have looked like in practice.'
  - where: 'note 25:10 “Jubilee: the year of the ram’s horn”'
    claim: 'Welch: its ideal, liberation from bondage, mattered to Israelites'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Yet it seems that the central ideal of the Jubilee—liberation from bondage—was very important to ancient Israelites'
  - where: 'note 25:10 “Jubilee: the year of the ram’s horn”'
    claim: 'Welch: the jubilee is the likely source of the Book of Mormon’s liberty language in Mosiah 29:32 and Alma 46:17'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'the Jubilee is the likely source for the Book of Mormon’s liberty language seen in Mosiah 29:32 (“I desire that this land be a land of liberty”) and Alma 46:17'

  - where: 'note 25:21 “Fruit for three years”'
    claim: 'Keil: the years began in autumn at sowing'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/25.htm'
    quote: 'not only the year of jubilee, but the sabbatical year also, commenced in the autumn, when they first began to sow for the coming year'
  - where: 'note 25:21 “Fruit for three years”'
    claim: 'Keil: in a jubilee, sowing and reaping were omitted two years running'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/25.htm'
    quote: 'in which case both sowing and reaping were omitted for two years in succession'
  - where: 'note 25:21 “Fruit for three years”'
    claim: 'Keil: the sixth year’s produce had to last until the harvest of the ninth year'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/25.htm'
    quote: 'till the harvest of the ninth or fifty-first year'
  - where: 'note 25:21 “Fruit for three years”'
    claim: 'The manual: the land had a double rest, the forty-ninth year followed by the jubilee'
    key: ot-manual-lev-19-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-19-27-a-law-of-performances-and-ordinances-part-3-laws-of-mercy-and-righteousness?lang=eng'
    quote: 'Further, once each fifty years the land would have a double rest. The seventh sabbatical year (the forty-ninth year) was to be followed by a jubilee year.'
  - where: 'note 25:21 “Fruit for three years”'
    claim: 'The manual: the chapter shows the faith and trust in God the law required'
    key: ot-manual-lev-19-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-19-27-a-law-of-performances-and-ordinances-part-3-laws-of-mercy-and-righteousness?lang=eng'
    quote: 'This chapter illustrates the commitment of faith and trust in God that was required of one who truly followed the law.'
  - where: 'note 25:21 “Fruit for three years”'
    claim: 'The Israelite was to trust wholly in God once in seven years'
    key: ot-manual-lev-19-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-19-27-a-law-of-performances-and-ordinances-part-3-laws-of-mercy-and-righteousness?lang=eng'
    quote: 'The Israelite was told that once in every seven years he was to trust wholly in God rather than in the fruits of his own labor for sustenance.'
  - where: 'note 25:21 “Fruit for three years”'
    claim: 'Verse 20: the farmer’s question'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'What shall we eat the seventh year?'

  - where: 'note 25:23 “The land belongs to the LORD”'
    claim: 'The Hebrew of “for ever” in 25:23'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'לִ/צְמִתֻ֔ת'
  - where: 'note 25:23 “The land belongs to the LORD”'
    claim: 'BDB: tsemitut, finality, in perpetuity, of the alienation of land'
    key: bdb
    url: 'https://biblehub.com/hebrew/6783.htm'
    quote: 'completion, finality'
  - where: 'note 25:23 “The land belongs to the LORD”'
    claim: 'BDB: used of alienation of land'
    key: bdb
    url: 'https://biblehub.com/hebrew/6783.htm'
    quote: 'of alienation of land'
  - where: 'note 25:23 “The land belongs to the LORD”'
    claim: 'Bowen: the basis of all the legislation is that the land is Yahweh’s; compare Ps. 24:1'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The basis for all of the foregoing legislation is the truth that the land is ultimately Yahweh’s (Leviticus 25:23; compare Psalm 24:1'
  - where: 'note 25:23 “The land belongs to the LORD”'
    claim: 'The sale is priced by the years of fruits'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'for according to the number of the years of the fruits doth he sell unto thee'

  - where: 'note 25:25 “The kinsman who buys it back”'
    claim: 'The Hebrew of the kinsman (redeemer) in 25:25'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'גֹֽאֲל/וֹ֙'
  - where: 'note 25:25 “The kinsman who buys it back”'
    claim: 'The same verb, gaʾal, of the LORD in Ex. 6:6 (“I will redeem you”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וְ/גָאַלְתִּ֤י'
  - where: 'note 25:25 “The kinsman who buys it back”'
    claim: 'BDB: gaal, act as kinsman, do the part of next of kin'
    key: bdb
    url: 'https://biblehub.com/hebrew/1350.htm'
    quote: 'act as kinsman, do the part of next of kin'
  - where: 'note 25:25 “The kinsman who buys it back”'
    claim: 'BDB: the participle goel is the kinsman at Lev. 25:25'
    key: bdb
    url: 'https://biblehub.com/hebrew/1350.htm'
    quote: 'גֹּאֵל kinsman Leviticus 25:25 (H)'
  - where: 'note 25:25 “The kinsman who buys it back”'
    claim: 'BDB: used of redeeming from bondage in 25:48–49 and a field in 25:26, 33 and Ruth 4'
    key: bdb
    url: 'https://biblehub.com/hebrew/1350.htm'
    quote: 'in redeeming a field Leviticus 25:26,33 (H) Ruth 4:4,6'
  - where: 'note 25:25 “The kinsman who buys it back”'
    claim: 'Spackman: buying back land sold in poverty and family members sold into slavery was a kinship duty'
    key: spackman-atonement
    url: 'https://byustudies.byu.edu/article/the-israelite-roots-of-atonement-terminology'
    quote: 'in buying back (that is, redeeming) family land that had been sold due to poverty (Lev. 25:25–34) or family members who had been sold into slavery (Lev. 25:47–50)'
  - where: 'note 25:25 “The kinsman who buys it back”'
    claim: 'Spackman: English lacks a term; some translations coin kinsman-redeemer'
    key: spackman-atonement
    url: 'https://byustudies.byu.edu/article/the-israelite-roots-of-atonement-terminology'
    quote: 'a few translations have opted for the neologism of “kinsman-redeemer” or “redeeming-kinsman.”'
  - where: 'note 25:25 “The kinsman who buys it back”'
    claim: 'Spackman: Boaz stepped in as the goel in Ruth'
    key: spackman-atonement
    url: 'https://byustudies.byu.edu/article/the-israelite-roots-of-atonement-terminology'
    quote: 'Boaz, who may well have tried to influence just this outcome, stepped in as the goʾel or kinsman-redeemer.'
  - where: 'note 25:25 “The kinsman who buys it back”'
    claim: 'Verse 49: the kin who may redeem a man, or he himself'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'Either his uncle, or his uncle’s son, may redeem him'

  - where: 'note 25:29 “Houses in walled cities”'
    claim: 'The Levites’ houses are their possession'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'for the houses of the cities of the Levites are their possession among the children of Israel'

  - where: 'note 25:36 “Usury and increase”'
    claim: 'The Hebrew words of 25:36'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'נֶ֣שֶׁךְ'
  - where: 'note 25:36 “Usury and increase”'
    claim: 'BDB: neshek, interest, literally something bitten off'
    key: bdb
    url: 'https://biblehub.com/hebrew/5392.htm'
    quote: 'interest, usury (literally something bitten off)'
  - where: 'note 25:36 “Usury and increase”'
    claim: 'BDB: tarbit, increment, interest'
    key: bdb
    url: 'https://biblehub.com/hebrew/8636.htm'
    quote: 'increment, interest, usury'
  - where: 'note 25:36 “Usury and increase”'
    claim: 'Usury in biblical English often means simply interest'
    key: bd-usury
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/usury?lang=eng'
    quote: 'In biblical English it often means simply charging interest on a loan.'
  - where: 'note 25:36 “Usury and increase”'
    claim: 'The restriction seems to be for lending to a fellow member'
    key: bd-usury
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/usury?lang=eng'
    quote: 'The restriction, however, seems to be when lending to a fellow church member.'
  - where: 'note 25:36 “Usury and increase”'
    claim: 'Latter-day revelation has no restriction on interest'
    key: bd-usury
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/usury?lang=eng'
    quote: 'Latter-day revelation does not contain restrictions against interest charges.'
  - where: 'note 25:36 “Usury and increase”'
    claim: 'The reason given: that the brother may live'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'but fear thy God; that thy brother may live with thee'

  - where: 'note 25:39 “A brother, not a bondman”'
    claim: 'The word for rigour in 25:43'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'בְּ/פָ֑רֶךְ'
  - where: 'note 25:39 “A brother, not a bondman”'
    claim: 'The same word in Ex. 1:13'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'בְּ/פָֽרֶךְ'
  - where: 'note 25:39 “A brother, not a bondman”'
    claim: 'Keil: as the LORD’s servants, Israelites were not to be sold into actual slavery or ruled with severity'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/25.htm'
    quote: 'i.e., not to be sold into actual slavery, and no one of them was to rule over another with severity (Leviticus 25:43, cf. Exodus 1:13-14)'
  - where: 'note 25:39 “A brother, not a bondman”'
    claim: 'Foreign bondmen held for ever'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'they shall be your bondmen for ever'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'Isaiah 61:1–2 uses jubilee imagery'
    key: sc-knowhy-656
    url: 'https://scripturecentral.org/knowhy/why-does-jesus-announce-that-isaiah-611-2-is-fulfilled'
    quote: 'Isaiah 61:1–2 deals with imagery relating to the Jubilee year'
  - where: 'christ'
    claim: 'Jesus declared the passage fulfilled (Luke 4:21)'
    key: sc-knowhy-656
    url: 'https://scripturecentral.org/knowhy/why-does-jesus-announce-that-isaiah-611-2-is-fulfilled'
    quote: 'declaring, “This day is this scripture fulfilled in your ears” (Luke 4:21)'
  - where: 'christ'
    claim: 'Bowen: Isaiah and Jesus alluded to the jubilee in declaring their missions'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The prophet Isaiah and Jesus himself alluded to the Jubilee year when they declared their missions'
  - where: 'christ'
    claim: 'Bowen: the kinsman-redeemer is a christological type'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'for a kinsman-redeemer (another christological type) to buy back the property'
  - where: 'christ'
    claim: 'Spackman: to call God redeemer was to claim kinship through covenant'
    key: spackman-atonement
    url: 'https://byustudies.byu.edu/article/the-israelite-roots-of-atonement-terminology'
    quote: 'Thus, to claim God as “redeemer,” or to call upon him for redemption, was to claim kinship through a covenant relationship with him.'
  - where: 'christ'
    claim: 'Spackman’s paraphrase of 2 Ne. 2:3'
    key: spackman-atonement
    url: 'https://byustudies.byu.edu/article/the-israelite-roots-of-atonement-terminology'
    quote: 'unlike human kinsman-redeemers who are not always reliable and faithful in carrying out covenantal obligations, God is righteous. Therefore, you, Jacob, are surely redeemed, bought back, repurchased.'
  - where: 'christ'
    claim: 'Spackman reads Lehi’s words in 2 Ne. 2:3 in light of kinship'
    key: spackman-atonement
    url: 'https://byustudies.byu.edu/article/the-israelite-roots-of-atonement-terminology'
    quote: 'Wherefore, I know that thou art redeemed, because of the righteousness of thy Redeemer.'
