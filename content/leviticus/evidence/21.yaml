chapter: 21
claims:
  - where: 'when'
    claim: 'The laws of Leviticus are given at Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/21?lang=eng'
    quote: 'And the LORD said unto Moses, Speak unto the priests the sons of Aaron'

  - where: 'setting'
    claim: 'Chapters 21–22 give rules for the priests serving in the holy place'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'These two chapters deal with rules and regulations regarding the conduct of priestly activities in the Hekal, the Holy Place of Habitation for the Lord.'
  - where: 'setting'
    claim: 'The Book of Mormon quotes and alludes to Leviticus, but none of its uses relate to chapter 21'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'None of these quotes relate to Leviticus 1–4, 9–15, 21 or 24, where more technical provisions tend to be found.'
  - where: 'setting'
    claim: 'In one reading the priests represented the LORD''s holiness, so the Holiness Code has many rules for them'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'As noted, the high priest and the priests were representations of Yahweh and his holiness. Consequently, the Holiness Code contained numerous regulations governing priestly holiness.'
  - where: 'setting'
    claim: 'Ezekiel''s restored temple repeats rules for priests on hair, marriage and the dead'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/21?lang=eng'
    quote: '1a “dead”: Ezek. 44:25. … 5a “baldness”: Lev. 19:27; Ezek. 44:20. … 14a “widow”: Ezek. 44:22.'

  - where: 'thread'
    claim: 'The restrictions on the high priest were tighter than on the other priests'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Priests were not allowed to become “defiled for the dead” … except in the case of close relatives (Leviticus 21:1–4; for the Aaronic high priest the restrictions were even tighter, see 21:11).'

  - where: 'section 1 plain'
    claim: 'Verse 4 is obscure; the plain words give it as husband or head of household, as explained in the note'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/21.htm'
    quote: 'The priest was not to defile himself as a husband and the head of a household'
  - where: 'section 3 plain'
    claim: 'A modern rendering of the list of defects in verses 18–20'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'a man blind, lame, pierced, or deformed; a man having a broken foot or a broken hand; hunchbacked, a dwarf, one having an eye defect, having a rash, having running sores, or having crushed testicles.'

  - where: 'note 21:1 “Defiled for the dead”'
    claim: 'Everyone who entered a tent where a man had died was unclean seven days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/19?lang=eng'
    quote: 'This is the law, when a man dieth in a tent: all that come into the tent, and all that is in the tent, shall be unclean seven days.'
  - where: 'note 21:1 “Defiled for the dead”'
    claim: 'In one scholar''s reading corpse impurity left unpurified contaminated the sanctuary; impurity is the foe of holiness'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'Whoever is contaminated by a corpse and fails to purify himself “has contaminated the Lord’s sanctuary” (Numbers 19:20, 13). … impurity is the implacable foe of holiness wherever it exists; it assaults the sacred realm even from afar.'
  - where: 'note 21:1 “Defiled for the dead”'
    claim: 'The Joseph Smith Translation manuscript reads “with the dead” at 21:1 and “go in to touch” at 21:11'
    key: horton-jst-pentateuch
    url: 'https://rsc.byu.edu/joseph-smith-translation/insights-exodus-leviticus-numbers-deuteronomy'
    quote: 'Leviticus 21:1. “There shall none be defiled for the dead” to “There shall none be defiled with the dead.” … Leviticus 21:11. A clarifying word is added in this verse: “Neither shall he go in to touch any dead body.”'
  - where: 'note 21:1 “Defiled for the dead”'
    claim: 'The change may clarify that “for” is not “on behalf of” as in 1 Cor. 15:29; “with” gives the sense of the Hebrew'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'This change may simply be an attempt at clarification: for could be mistakenly understood as “on behalf of”—the phrase “for the dead” in 1 Corinthians 15:29 had this sense'
  - where: 'note 21:1 “Defiled for the dead”'
    claim: '“With” conveys the instrumental sense of the Hebrew preposition; the 21:11 change stresses physical contact'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'With, on the other hand, more clearly conveys the instrumental idea of “by means of,” which seems to be the sense of the Hebrew preposition in context. … This clarification emphasizes that the priest must avoid physical contact with the corpse, not simply its presence.'

  - where: 'note 21:4 ““A chief man”: a husband?”'
    claim: 'The Hebrew word in verse 4 is ba''al'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'בַּ֣עַל'
  - where: 'note 21:4 ““A chief man”: a husband?”'
    claim: 'Ba''al means master, hence husband'
    key: bdb
    url: 'https://biblehub.com/hebrew/1167.htm'
    quote: 'baal: Lord, master, owner, husband'
  - where: 'note 21:4 ““A chief man”: a husband?”'
    claim: 'The words are obscure and early translators differed'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/21.htm'
    quote: 'The words of Leviticus 21:4 are obscure: "He shall not defile himself בּעמּיו בּעל, i.e., as lord (pater-familias) among his countrymen, to desecrate himself;" and the early translators have wandered in uncertainty among different renderings.'
  - where: 'note 21:4 ““A chief man”: a husband?”'
    claim: '“As a husband” would forbid mourning a wife; the text may be corrupt'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/21.htm'
    quote: 'as a husband (R.V. mg.). This rendering limits the cases in which defilement is permissible to those already mentioned, and forbids mourning for a wife. The A.V. follows the Targum. The wording of the v. suggests a corruption in the text.'
  - where: 'note 21:4 ““A chief man”: a husband?”'
    claim: 'An emendation to “in mourning” has been suggested; the Greek fails to give a clear meaning'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/21.htm'
    quote: 'The Sept. substitute (see R.V. mg.) for ‘a chief man’ is apparently obtained by a transposition in Heb. consonants, but fails to convey any clear meaning. It has been suggested, by a somewhat greater modification in the Heb., to read in mourning.'
  - where: 'note 21:4 ““A chief man”: a husband?”'
    claim: 'It is hard to suppose a priest was forbidden to approach his dead wife, given verse 2'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/21.htm'
    quote: 'It is, however, difficult, as Dillm. says, to suppose, in the face of the opening words of Leviticus 21:2, that a priest whose wife died was forbidden to approach the body.'
  - where: 'note 21:4 ““A chief man”: a husband?”'
    claim: 'One older reading: the wife is included in the near kin of verse 2, and verse 4 heads the marriage rules of verses 7–9'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/21.htm'
    quote: 'the wife is included in the "kin that is near unto him" in Leviticus 21:2 … The priest was not to defile himself as a husband and the head of a household, either by marrying a wife of immoral or ambiguous reputation, or by training his children carelessly'

  - where: 'note 21:6 “Holy because of what they offer”'
    claim: 'Verses 5 and 10 restrict how priests may mourn'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Priests were restricted in the way that they were allowed to mourn (21:5, 10).'
  - where: 'note 21:6 “Holy because of what they offer”'
    claim: 'Lev. 19:28 forbids all Israel cuttings in the flesh for the dead; 21:6 gives the reason for the priests'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/21?lang=eng'
    quote: 'They shall be holy unto their God, and not profane the name of their God: for the offerings of the LORD made by fire, and the bread of their God, they do offer: therefore they shall be holy.'
  - where: 'note 21:6 “Holy because of what they offer”'
    claim: 'In one Latter-day Saint reading the priests'' holiness was a beachhead for the sanctification of the whole community'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'one major reason the Holiness Code lays such stress on the ritual and ethical purity of priests (e.g., Leviticus 21) is that such priestly holiness would necessarily serve as a kind of beachhead for the broader hallowing (or sanctification) of the entire community.'

  - where: 'note 21:7 “The priest''s marriage and household”'
    claim: 'The marriage rules for priest and high priest, and the priest''s daughter, from the text; Judah''s sentence on Tamar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/21?lang=eng'
    quote: '9a “burnt”: Gen. 38:24. … 14a “widow”: Ezek. 44:22.'
  - where: 'note 21:7 “The priest''s marriage and household”'
    claim: 'Ezekiel''s priests may marry a widow of a priest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'Neither shall they take for their wives a widow, nor her that is put away: but they shall take maidens of the seed of the house of Israel, or a widow that had a priest before.'
  - where: 'note 21:7 “The priest''s marriage and household”'
    claim: 'In one Latter-day Saint reading these laws let priest and high priest maintain and partake of the LORD''s holiness'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'all of this to the end that the priest and the high priest might maintain and partake of Yahweh’s holiness (Leviticus 21:4, 6, 15, 22; 22:2).'

  - where: 'note 21:10 “The high priest who could not mourn”'
    claim: 'The high priest may not act like the rest of society in mourning because of the anointing, the same rule as Lev. 10:6–7'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'Leviticus 21:10–12 reveals that the high priest is not allowed to act like the rest of society during the mourning process because “the crown of the anointing oil of his God is upon him.” The same concept can be found earlier in chapter 10'
  - where: 'note 21:10 “The high priest who could not mourn”'
    claim: 'Caiaphas apparently violated Lev. 21:10 when he tore his clothes at Jesus'' trial'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The high priest Caiaphas apparently violated Leviticus 21:10 when he tore his clothes during the illegal proceedings involving Jesus before his crucifixion (Mark 14:63; Matthew 26:65).'
  - where: 'note 21:10 “The high priest who could not mourn”'
    claim: 'The high priest rent his clothes at the trial'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'Then the high priest rent his clothes, saying, He hath spoken blasphemy'

  - where: 'note 21:12 ““The crown of the anointing oil””'
    claim: 'The word rendered crown is nezer'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'נֵ֠זֶר'
  - where: 'note 21:12 ““The crown of the anointing oil””'
    claim: 'At Lev. 21:12 nezer means consecration'
    key: bdb
    url: 'https://biblehub.com/hebrew/5145.htm'
    quote: 'a. of high priest עליו ׳שֶׁמֶן מִשְׁחַת א ׳נ Leviticus 21:12 (P) the consecration of the oil of anointing of his God is upon him.'
  - where: 'note 21:12 ““The crown of the anointing oil””'
    claim: 'Here the word means consecration, not the diadem of Ex. 29:6; compare Num. 6:7'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/21.htm'
    quote: 'נזר does not mean the diadem of the high priest here, as in Exodus 29:6; Exodus 39:30, but consecration (see at Numbers 6:7).'
  - where: 'note 21:12 ““The crown of the anointing oil””'
    claim: 'The Nazarite may not be unclean for father or mother because the consecration of his God is on his head'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/6?lang=eng'
    quote: 'He shall not make himself unclean for his father, or for his mother, for his brother, or for his sister, when they die: because the consecration of his God is upon his head.'
  - where: 'note 21:12 ““The crown of the anointing oil””'
    claim: 'One Latter-day Saint reading: the anointing is a transformation by God'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'This transformation by God is expressed throughout Leviticus.'

  - where: 'note 21:17 “Priests who may not serve at the altar”'
    claim: 'Some interpreters read the passage as stigmatizing people with disabilities'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'Some interpreters understand this passage as a stigmatization of people with disabilities.'
  - where: 'note 21:17 “Priests who may not serve at the altar”'
    claim: 'The terms are rare and translated differently; not all disabilities disqualified (the deaf and mute were not excluded)'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'For instance, while those who are blind are excluded, those who are deaf and mute are not. … A number of these terms are rare and have been subject to different translations.'
  - where: 'note 21:17 “Priests who may not serve at the altar”'
    claim: 'His proposal: the law guaranteed that priests with disabilities were exempt from altar service and still fed'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'The purpose of the commandment in Leviticus 21:17–23 could have been to guarantee that priests with disabilities were exempt from the altar service and were entitled to sustenance from the sacrifices.'
  - where: 'note 21:17 “Priests who may not serve at the altar”'
    claim: 'The altar service was labor-intensive'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'the service at the altar was labor-intensive, involving the slaughtering of animals, cutting and preparing of the parts, executing complicated food preparations, tending the fire of the altar, moving frequently between the altar and the laver'
  - where: 'note 21:17 “Priests who may not serve at the altar”'
    claim: 'Eating the holy food was a high privilege and took place in the same sacred spaces'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'It is doubtful that this service was more highly esteemed than participation in the ritual meal in which the priests would share the Lord’s food, an activity that is explicitly permitted for priests with disabilities in Leviticus 21:22.'
  - where: 'note 21:17 “Priests who may not serve at the altar”'
    claim: 'The issue is not impurity: the priest may eat the holy food, and no penalty is named'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'It is important to note that the issue here is not one of impurity. … such a situation does not seem to be at issue in Leviticus 21:17–23, which permits the consumption of the holy food and mentions no penalty.'
  - where: 'note 21:17 “Priests who may not serve at the altar”'
    claim: 'To profane is to loosen; the comparison with the Sabbath as an exemption from labor'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'The root meaning of the verb ḥillēl, “to profane,” is “to untie, loosen.” To profane something holy is to loosen something that God has bound. … people are mercifully exempted from labor—during sacred time (the Sabbath) in the case of Exodus 31 and on sacred space (the sanctuary) in the case of Leviticus 21.'
  - where: 'note 21:17 “Priests who may not serve at the altar”'
    claim: 'The word for defect is the same in 21:17–23 and in the list of animal defects in 22:18–25'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'The word for defect (mûm) in both texts is the same, and some of the specific “defects” are also the same.'
  - where: 'note 21:17 “Priests who may not serve at the altar”'
    claim: 'Neither reading can be proven'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'Neither of the interpretations of this passage can be proven with certainty.'

  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'In one Latter-day Saint reading the unblemished priest typifies Christ'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Viewing this legislation christologically, the “unblemished” priest, like the “unblemished” sacrifice typifies Christ, who lived free of both physical and moral blemish—highlighting the sacred nature of their priestly service.'
  - where: 'christ'
    claim: 'Welch sees an echo of these priestly functions in the Savior''s instructions on the sacrament at Bountiful'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'For an echo of these priestly functions, see the instructions Jesus gave at the temple in Bountiful regarding the disciples’ roles in bringing the sacramental emblems, passing the sacrament to the people, and ensuring the worthiness of those who partook of it (3 Nephi 18:1, 4, 28).'

  - where: 'section 1 plain'
    claim: 'The “profane” woman of verse 7 is a woman sexually dishonored'
    key: bdb
    url: 'https://biblehub.com/hebrew/2491.htm'
    quote: 'feminine singular חֲלָלָה of woman sexually dishonoured Leviticus 21:7,14'
  - where: 'section 2 plain'
    claim: 'The “profane” woman of verse 14 is a woman sexually dishonored'
    key: bdb
    url: 'https://biblehub.com/hebrew/2491.htm'
    quote: 'feminine singular חֲלָלָה of woman sexually dishonoured Leviticus 21:7,14'
  - where: 'section 2 plain'
    claim: 'Uncovering the head is letting the hair hang loose in mourning; going out of the sanctuary is for a death'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/21.htm'
    quote: 'was not to go with his hair flying loose when a death had taken place, nor to rend his clothes (see Leviticus 10:6)'
  - where: 'thread'
    claim: 'The high priest was not to leave the sanctuary on account of a death'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/21.htm'
    quote: 'nor to go out of the sanctuary funeris nempe causa (Ros.), to give way to his grief or attend the funeral'
  - where: 'note 21:7 “The priest''s marriage and household”'
    claim: 'The Hebrew word rendered “profane” is used of a woman sexually dishonored'
    key: bdb
    url: 'https://biblehub.com/hebrew/2491.htm'
    quote: 'feminine singular חֲלָלָה of woman sexually dishonoured Leviticus 21:7,14'
  - where: 'note 21:12 ““The crown of the anointing oil””'
    claim: 'One older reading: not going out of the sanctuary means not leaving it to grieve or attend a funeral'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/21.htm'
    quote: 'nor to go out of the sanctuary funeris nempe causa (Ros.), to give way to his grief or attend the funeral'
  - where: 'note 21:12 ““The crown of the anointing oil””'
    claim: 'Num. 6:7 has the same Hebrew word nezer'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'נֵ֥זֶר'
