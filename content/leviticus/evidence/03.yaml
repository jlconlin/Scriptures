chapter: 3
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The tabernacle was set up in the first month of the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And it came to pass in the first month in the second year, on the first day of the month, that the tabernacle was reared up.'
  - where: 'when'
    claim: 'The laws of the offerings were given in mount Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'Which the LORD commanded Moses in mount Sinai, in the day that he commanded the children of Israel to offer their oblations unto the LORD, in the wilderness of Sinai.'
  - where: 'setting'
    claim: 'One basic sacrifice is covered in each of the first five chapters of Leviticus; the third is the peace offering'
    key: gee-last-sacrifice
    url: 'https://rsc.byu.edu/behold-lamb-god/great-last-sacrifice'
    quote: 'There are five basic sacrifices in the law, one covered in each of the first five chapters of Leviticus.'
  - where: 'setting'
    claim: 'The peace offering may have been the most common sacrifice; it was a freewill offering for a vow fulfilled or blessings received'
    key: sc-knowhy-545
    url: 'https://scripturecentral.org/knowhy/what-sacrifices-did-lehi-offer-to-god-in-the-wilderness'
    quote: 'In ancient Israel, the peace offering (or well-being offering) may have been the most common form of sacrifice. These were freewill offerings, made after the fulfilment of a vow or to give thanks for other blessings.'
  - where: 'setting'
    claim: 'Lehi''s offering of thanks in 1 Nephi 2:7 was a peace offering serving as thanksgiving for safe travel'
    key: brown-lehi-sacrifices
    url: 'https://rsc.byu.edu/jerusalem-zarahemla/what-were-those-sacrifices-offered-lehi'
    quote: 'When Lehi “made an offering unto the Lord, and gave thanks” (1 Ne. 2:7; also 5:9; 7:22), he was sacrificing a peace offering which served as a thanksgiving for safety in travel'
  - where: 'setting'
    claim: 'Lehi built an altar, made an offering and gave thanks'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/2?lang=eng'
    quote: 'And it came to pass that he built an altar of stones, and made an offering unto the Lord, and gave thanks unto the Lord our God.'
  - where: 'setting'
    claim: 'The rules for eating the peace offering are in Leviticus 7:11–36'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'And this is the law of the sacrifice of peace offerings, which he shall offer unto the LORD.'
  - where: 'setting'
    claim: 'At Aaron''s first service a peace offering was made for the people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/9?lang=eng'
    quote: 'He slew also the bullock and the ram for a sacrifice of peace offerings, which was for the people'
  - where: 'thread'
    claim: 'One older reading: Leviticus 3 says nothing about the use of the flesh, since the meal was already known; the meal is directed in 7:11–36'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/3.htm'
    quote: 'Nothing is determined here with regard to the appropriation of the flesh of the peace-offerings, as their destination for a sacrificial meal was already known from traditional custom. The more minute directions for the meal itself are given in Leviticus 7:11-36'

  - where: 'thread'
    claim: 'The peace offering presupposed that the sacrificer was at peace with God'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'Peace offerings, as the name indicates, presupposed that the sacrificer was at peace with God'
  - where: 'thread'
    claim: 'The burnt offering was burned whole on the altar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/1?lang=eng'
    quote: 'the priest shall burn all on the altar, to be a burnt sacrifice'

  # ---------- notes ----------
  - where: 'note 3:1 “Peace offering: an offering of well-being”'
    claim: 'The Hebrew is zebah shelamim'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'שְׁלָמִ֖ים'
  - where: 'note 3:1 “Peace offering: an offering of well-being”'
    claim: 'BDB: a sacrifice for alliance or friendship; the explanation is disputed (mark of peace with God, fellowship, welfare-offering, thank-offering); the sacred meal is its special feature'
    key: bdb
    url: 'https://biblehub.com/hebrew/8002.htm'
    quote: 'sacrifice for alliance or friendship, ''peace-offering'' (explanation disputed: … peace-offering (mark of peace with God) … (fellowship between God and worshippers); welfare-offering, ᵐ5 elsewhere σωτήριον, Ke; thank-offering … sacred meal its special feature'
  - where: 'note 3:1 “Peace offering: an offering of well-being”'
    claim: 'The word properly means an offering for well-being'
    key: brown-lehi-sacrifices
    url: 'https://rsc.byu.edu/jerusalem-zarahemla/what-were-those-sacrifices-offered-lehi'
    quote: 'the Hebrew term which is translated “peace offering” in the King James translation properly means an offering for well-being'
  - where: 'note 3:1 “Peace offering: an offering of well-being”'
    claim: 'The Greek translation calls it the sacrifice of salvation'
    key: gee-last-sacrifice
    url: 'https://rsc.byu.edu/behold-lamb-god/great-last-sacrifice'
    quote: 'The subject of the third chapter of Leviticus is the zebah šĕlāmîm, or peace offering, called in Greek the θυσία σωτηρίου “sacrifice of salvation,”'
  - where: 'note 3:1 “Peace offering: an offering of well-being”'
    claim: 'Peace offerings presupposed peace with God and were offered for its further enjoyment'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'Peace offerings, as the name indicates, presupposed that the sacrificer was at peace with God; they were offered for the further realization and enjoyment of that peace.'
  - where: 'note 3:1 “Peace offering: an offering of well-being”'
    claim: 'To make atonement is not named as a function of the peace offering, perhaps because reconciliation is already present'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'Interestingly, “to make atonement” is not mentioned as a function of the third form of animal sacrifice, the “peace offering.” … there is no need for atonement to be made because the peace offering recognizes that atonement, or reconciliation, is already present.'
  - where: 'note 3:1 “Peace offering: an offering of well-being”'
    claim: 'The burnt offering is said to be accepted to make atonement (contrast)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/1?lang=eng'
    quote: 'And he shall put his hand upon the head of the burnt offering; and it shall be accepted for him to make atonement for him.'
  - where: 'note 3:1 “Peace offering: an offering of well-being”'
    claim: 'Ezekiel lists peace offerings among the offerings given to make reconciliation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/45?lang=eng'
    quote: 'for a meat offering, and for a burnt offering, and for peace offerings, to make reconciliation for them'

  - where: 'note 3:1 “Male or female, but no birds”'
    claim: 'The peace offering could be male or female'
    key: sc-knowhy-545
    url: 'https://scripturecentral.org/knowhy/what-sacrifices-did-lehi-offer-to-god-in-the-wilderness'
    quote: 'In contrast to the peace offering, which could be either male or female, the burnt offering was always a male animal; it was not eaten, but was entirely burnt upon the altar before God.'
  - where: 'note 3:1 “Male or female, but no birds”'
    claim: 'The peace offering might be oxen, sheep or goats, male or female; birds were allowed for the burnt offering in poverty'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The burnt offering might be made with male bullocks, rams, or he-goats without blemish; turtle-doves or pigeons of either sex in cases of poverty. The peace offering might be made with oxen, sheep, or goats without blemish, whether male or female.'
  - where: 'note 3:1 “Male or female, but no birds”'
    claim: 'Birds were not acceptable because they gave too little meat for the feast'
    key: ot-manual-lev-1-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-1-10-a-law-of-performances-and-ordinances-part-1-sacrifices-and-offerings?lang=eng'
    quote: 'Since the sacrifice served as a major part of this feast, birds were not acceptable because they provided too little meat.'

  - where: 'note 3:5 “Laid on the burnt offering”'
    claim: 'One older reading: the fat was laid on the burnt offering already burning, since the daily burnt offering always preceded'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/3.htm'
    quote: 'the peace-offering was preceded as a rule by the burnt-offering. At any rate it was always preceded by the daily burnt-offering … so that the fat portions of the peace-offerings were to be laid upon the burnt-offering which was burning already.'
  - where: 'note 3:5 “Laid on the burnt offering”'
    claim: 'The law of the altar fire: the burnt offering laid each morning and the fat of the peace offerings burned on it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/6?lang=eng'
    quote: 'the priest shall burn wood on it every morning, and lay the burnt offering in order upon it; and he shall burn thereon the fat of the peace offerings.'
  - where: 'note 3:5 “Laid on the burnt offering”'
    claim: 'When offered together the order was sin, burnt, peace: atonement, sanctification, fellowship'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'Thus the order of the symbolizing sacrifices was the order of atonement, sanctification, and fellowship with the Lord.'

  - where: 'note 3:9 “What went on the altar”'
    claim: 'The “caul” is yothereth, an appendage, a fatty mass at the liver, or the caudate lobe of the liver'
    key: bdb
    url: 'https://biblehub.com/hebrew/3508.htm'
    quote: 'appendage (technical term of P); — most probably (fat) appendage, a (fatty) mass at opening of liver of sacrificial animal, extending to kidneys … where it is shewn to be the caudate lobe of the liver.'
  - where: 'note 3:9 “What went on the altar”'
    claim: 'The “rump” is the fat tail of the sheep, a delicacy'
    key: bdb
    url: 'https://biblehub.com/hebrew/451.htm'
    quote: 'fat tail of sheep, still accounted a delicacy in the East'

  - where: 'note 3:11 “The food of the LORD”'
    claim: 'The Hebrew word is lechem, bread or food'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'לֶ֥חֶם'
  - where: 'note 3:11 “The food of the LORD”'
    claim: 'The Church''s footnote at 3:11 “food” points to Ezekiel 44:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/3?lang=eng'
    quote: '“food”: Ezek. 44:7.'
  - where: 'note 3:11 “The food of the LORD”'
    claim: 'One older reading: the fat is food that reached the LORD by being burned; the sacrifices generally are called the bread of God'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/3.htm'
    quote: 'food which served as a firing for Jehovah, or reached Jehovah by being burned … the sacrifices generally are described as "the food of God" ("the bread of their God," Leviticus 21:6 … as food, that is, which Israel produced and caused to ascend to its God in fire'
  - where: 'note 3:11 “The food of the LORD”'
    claim: 'The priests offer the bread of their God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/21?lang=eng'
    quote: 'for the offerings of the LORD made by fire, and the bread of their God, they do offer: therefore they shall be holy.'
  - where: 'note 3:11 “The food of the LORD”'
    claim: 'Ezekiel calls the fat and the blood “my bread” (the Church''s footnote at 3:11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/44?lang=eng'
    quote: 'when ye offer my bread, the fat and the blood'

  - where: 'note 3:11 “The food of the LORD”'
    claim: 'lechem is bread, food; bread was the ordinary food of early Hebrews'
    key: bdb
    url: 'https://biblehub.com/hebrew/3899.htm'
    quote: 'bread, the ordinary food of early Hebrews'
  - where: 'note 3:11 “The food of the LORD”'
    claim: 'BDB gloss bread, food'
    key: bdb
    url: 'https://biblehub.com/hebrew/3899.htm'
    quote: 'bread, food (Phoenician לחם bread'
  - where: 'note 3:16 “Three shares: the LORD’s, the priests’, and the worshipper’s”'
    claim: 'In 3:16–17 both fat and blood are the Lord''s'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'In Leviticus 3:16–17 we learn that both fat and blood are considered the Lord’s.'
  - where: 'note 3:16 “Three shares: the LORD’s, the priests’, and the worshipper’s”'
    claim: 'The manual: the fat indicated the well-being of the animal and came to represent the consecration of the whole life'
    key: ot-manual-lev-1-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-1-10-a-law-of-performances-and-ordinances-part-1-sacrifices-and-offerings?lang=eng'
    quote: 'the fat (as noted in Reading 14-7) was indicative of the well-being of the whole animal. It came to represent the consecration of the whole life of the individual to God.'
  - where: 'note 3:16 “Three shares: the LORD’s, the priests’, and the worshipper’s”'
    claim: 'The breast and right shoulder go to the priests'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'And the priest shall burn the fat upon the altar: but the breast shall be Aaron’s and his sons’. And the right shoulder shall ye give unto the priest for an heave offering'
  - where: 'note 3:16 “Three shares: the LORD’s, the priests’, and the worshipper’s”'
    claim: 'The thanksgiving offering is eaten the same day; a vow or voluntary offering may be eaten the next day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'for thanksgiving shall be eaten the same day that it is offered … But if the sacrifice of his offering be a vow, or a voluntary offering, it shall be eaten the same day that he offereth his sacrifice: and on the morrow also'
  - where: 'note 3:16 “Three shares: the LORD’s, the priests’, and the worshipper’s”'
    claim: 'The rest of the flesh was eaten by the sacrificer, his household and the poorer Levites at the tabernacle'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The fat having been burnt and the priests’ pieces removed, the rest of the flesh was eaten by the sacrificer, his household, and the poorer Levites at the tabernacle.'
  - where: 'note 3:16 “Three shares: the LORD’s, the priests’, and the worshipper’s”'
    claim: 'The peace offering was a covenantal meal of peace and communion among the offerer, the priests and the Lord'
    key: seely-sacrifice
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/09/united-states-and-canada-section/sacrifice-in-similitude-of-the-savior?lang=eng'
    quote: 'eaten by the offerer, the priests, and the Lord (symbolized by burning part of the animal on the altar and the smoke ascending to heaven), representing a covenantal meal of peace and communion between the three parties (see Leviticus 3).'

  - where: 'note 3:17 “Neither fat nor blood”'
    claim: 'The fat forbidden is that of ox, sheep or goat; fat of a beast that died may be used otherwise'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'Ye shall eat no manner of fat, of ox, or of sheep, or of goat. And the fat of the beast that dieth of itself, and the fat of that which is torn with beasts, may be used in any other use: but ye shall in no wise eat of it.'
  - where: 'note 3:17 “Neither fat nor blood”'
    claim: 'Blood of fowl or beast forbidden in all dwellings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'Moreover ye shall eat no manner of blood, whether it be of fowl or of beast, in any of your dwellings.'
  - where: 'note 3:17 “Neither fat nor blood”'
    claim: 'The penalty for eating fat is to be cut off'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'even the soul that eateth it shall be cut off from his people.'
  - where: 'note 3:17 “Neither fat nor blood”'
    claim: 'The penalty for eating blood is to be cut off'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'Whatsoever soul it be that eateth any manner of blood, even that soul shall be cut off from his people.'

  # ---------- christ / explore ----------
  - where: 'note 3:5 “Laid on the burnt offering”'
    claim: 'When offered together, the sin offering preceded the burnt, and the burnt the peace offering'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'It is noteworthy that when the three offerings were offered together, the sin always preceded the burnt, and the burnt the peace offerings.'
  - where: 'christ'
    claim: 'Sacrifice showed that only through Jesus Christ could lasting peace and reconciliation with God and others come'
    key: sc-knowhy-545
    url: 'https://scripturecentral.org/knowhy/what-sacrifices-did-lehi-offer-to-god-in-the-wilderness'
    quote: 'It showed that it could only be through Jesus Christ that we could attain lasting peace and reconciliation with God and others.'
  - where: 'christ'
    claim: 'The Church''s footnote at 3:6 “blemish” points to Hebrews 7:26 and 1 Peter 1:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/3?lang=eng'
    quote: '“blemish”: Heb. 7:26 (26–27); 1 Pet. 1:19 (18–19).'
  - where: 'christ'
    claim: 'The peace offering recognizes that reconciliation is already present'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'the peace offering recognizes that atonement, or reconciliation, is already present.'
  - where: 'explore'
    claim: 'Brown''s study reads Lehi''s offerings in the light of Leviticus 1 and 3'
    key: brown-lehi-sacrifices
    url: 'https://rsc.byu.edu/jerusalem-zarahemla/what-were-those-sacrifices-offered-lehi'
    quote: 'By examining the sacrifices of ancient Israel noted in the Bible, we come to an understanding of Lehi’s sacrifices'
