chapter: 26
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The laws were given in mount Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'These are the statutes and judgments and laws, which the LORD made between him and the children of Israel in mount Sinai by the hand of Moses.'
  - where: 'setting'
    claim: 'As the book of the covenant ended with promises and threats (Ex. 23:20–33), so the Sinai law closes in this chapter with blessing and curse'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/26.htm'
    quote: 'concluded with promises and threats (Exodus 23:20-33); so the giving of the law at Sinai, as the unfolding of the inner, spiritual side of the whole of the covenant constitution, closes in this chapter with an elaborate unfolding of the blessing'
  - where: 'setting'
    claim: 'The blessings and curse are set out again at the close of the whole law, Deut. 28–30'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/26.htm'
    quote: 'The blessings and curse of the law were impressed upon the hearts of the people in a still more comprehensive manner at the close of the whole law (Deuteronomy 28-30), and on the threshold of the promised land.'
  - where: 'setting'
    claim: 'Ancient Near Eastern treaties set out stipulations followed by blessings and curses'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Treaties and covenants in the ancient Near East almost universally set forth stipulations, laws, and requirements (as found in Leviticus 1–24), followed by blessings and benefactions for compliance on the one hand and curses for violations'
  - where: 'setting'
    claim: 'Leviticus 26 is where the Abrahamic covenant is most fully outlined for Israel'
    key: muhlestein-prospering
    url: 'https://journal.interpreterfoundation.org/prospering-in-the-land-a-comparison-of-covenant-promises-in-leviticus-and-first-nephi-2/'
    quote: 'The Abrahamic Covenant is most fully outlined for Israel when it was reestablished with them during their journey from Egypt. This is presented in Leviticus 26.'
  - where: 'setting'
    claim: 'Leviticus 26 ends the Holiness Code (17–26), and the statutes of the covenant apply most directly to its laws'
    key: muhlestein-prospering
    url: 'https://journal.interpreterfoundation.org/prospering-in-the-land-a-comparison-of-covenant-promises-in-leviticus-and-first-nephi-2/'
    quote: 'Leviticus 26 represents the end of what scholars refer to as the “Holiness Code,” which is comprised of chapters 17–26'
  - where: 'thread'
    claim: 'Verses 1–2 sum up the law in two leading commandments placed at the head of the blessing and curse'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/26.htm'
    quote: 'Leviticus 26:1 and Leviticus 26:2 form the introduction; and the essence of the whole law, the observance of which will bring a rich blessing, and the transgression of it severe judgments, is summed up in two leading commandments'
  - where: 'thread'
    claim: 'The Lord speaks in the first person throughout the chapter, sixty-nine times by one count'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'In Leviticus 26, one hears sixty-nine first-person statements.'
  - where: 'thread'
    claim: 'The blessings are 26:3–12; the curses are described in far greater detail in 26:14–39'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'The blessings are listed from 26:3–12, but the curses are described in far greater detail in 26:14–39.'
  - where: 'thread'
    claim: 'The Hebrew verb behind “abhor” (H1602) occurs five times in Leviticus, all in this chapter: 26:11, 15, 30, 43, 44'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וְ/גָעֲלָ֥ה'

  - where: 'setting'
    claim: 'The statutes Israel is told to keep in the covenant apply most directly to the laws of the Holiness Code'
    key: muhlestein-prospering
    url: 'https://journal.interpreterfoundation.org/prospering-in-the-land-a-comparison-of-covenant-promises-in-leviticus-and-first-nephi-2/'
    quote: 'The statues and commandments that Israel is told to keep as part of the covenant most directly apply to the laws found in this section of scripture.'
  - where: 'note 26:18 “Seven times more”'
    claim: 'The fourth stage is four punishments: idolatrous shrines destroyed, towns and holy places overthrown, the land devastated, the people dispersed (26:27–33)'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/26.htm'
    quote: '(4) the destruction of all idolatrous abominations, the overthrow of their towns and holy places, the devastation of the land, and the dispersion of the people among the heathen-four punishments'

  # ---------- notes ----------
  - where: 'note 26:3 “The covenant Nephi received”'
    claim: 'The promise to Nephi in 1 Nephi 2 is strikingly similar to the covenant in Leviticus 26'
    key: muhlestein-prospering
    url: 'https://journal.interpreterfoundation.org/prospering-in-the-land-a-comparison-of-covenant-promises-in-leviticus-and-first-nephi-2/'
    quote: 'There is a striking similarity between this Leviticus 26 covenant explication and the much more succinct version recorded by Nephi as he and his family left Jerusalem.'
  - where: 'note 26:3 “The covenant Nephi received”'
    claim: 'The study pairs Lev. 26:3 with 1 Ne. 2:20, “inasmuch as ye shall keep my commandments”'
    key: muhlestein-prospering
    url: 'https://journal.interpreterfoundation.org/prospering-in-the-land-a-comparison-of-covenant-promises-in-leviticus-and-first-nephi-2/'
    quote: 'If ye walk in my statutes, and keep my commandments, and do them; (Leviticus 26:3) And inasmuch as ye shall keep my commandments (1 Nephi 2:20)'
  - where: 'note 26:3 “The covenant Nephi received”'
    claim: 'The study pairs Lev. 26:9–10 (with 26:4–5) with “ye shall prosper,” 1 Ne. 2:20'
    key: muhlestein-prospering
    url: 'https://journal.interpreterfoundation.org/prospering-in-the-land-a-comparison-of-covenant-promises-in-leviticus-and-first-nephi-2/'
    quote: 'And ye shall eat old store, and bring forth the old because of the new. (Leviticus 26:9–10)'
  - where: 'note 26:3 “The covenant Nephi received”'
    claim: 'The study pairs Lev. 26:5–6 with the land of promise, 1 Ne. 2:20'
    key: muhlestein-prospering
    url: 'https://journal.interpreterfoundation.org/prospering-in-the-land-a-comparison-of-covenant-promises-in-leviticus-and-first-nephi-2/'
    quote: 'and dwell in your land safely. And I will give peace in the land. (Leviticus 26:5–6) and shall be led to a land of promise'
  - where: 'note 26:3 “The covenant Nephi received”'
    claim: 'The study pairs Lev. 26:11–12 with the rebellious brothers cut off from the presence of the Lord, 1 Ne. 2:21'
    key: muhlestein-prospering
    url: 'https://journal.interpreterfoundation.org/prospering-in-the-land-a-comparison-of-covenant-promises-in-leviticus-and-first-nephi-2/'
    quote: 'And I will set my tabernacle among you: and my soul shall not abhor you. And I will walk among you, and will be your God, and ye shall be my people. (Leviticus 26:11–12) And inasmuch as thy brethren shall rebel against thee, they shall be cut off from the presence of the Lord'
  - where: 'note 26:3 “The covenant Nephi received”'
    claim: 'The study pairs Lev. 26:41–42 with 1 Ne. 2:24, the brothers as a scourge to stir them up in remembrance'
    key: muhlestein-prospering
    url: 'https://journal.interpreterfoundation.org/prospering-in-the-land-a-comparison-of-covenant-promises-in-leviticus-and-first-nephi-2/'
    quote: 'Then will I remember my covenant with Jacob, and also my covenant with Isaac, and also my covenant with Abraham will I remember; and I will remember the land. (Leviticus 26:41–42) They shall be a scourge unto thy seed, to stir them up in the ways of remembrance. (1 Nephi 2:24)'
  - where: 'note 26:3 “The covenant Nephi received”'
    claim: 'The study proposes not that Nephi drew on Leviticus but that Jehovah re-established the same covenant with Lehi and Nephi'
    key: muhlestein-prospering
    url: 'https://journal.interpreterfoundation.org/prospering-in-the-land-a-comparison-of-covenant-promises-in-leviticus-and-first-nephi-2/'
    quote: 'what I am proposing here is that the same being who established the covenant with Israel, namely Jehovah, (re)established that same covenant with Lehi and Nephi.'
  - where: 'note 26:3 “The covenant Nephi received”'
    claim: 'Another reading holds that the Book of Mormon’s commandment-keeping language likely derives from Deuteronomy, while noting the similarity to Lev. 26:3–12'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'While it is likely that the Book of Mormon’s commandment-keeping language derives rather from Deuteronomy, it is nonetheless striking to note the thematic similarities between Leviticus 26:3–12 and the Nephite couplet'

  - where: 'note 26:11 “The LORD’s dwelling among them”'
    claim: 'The Hebrew word behind “tabernacle” in 26:11 is mishkan (H4908)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'מִשְׁכָּנִ֖/י'
  - where: 'note 26:11 “The LORD’s dwelling among them”'
    claim: 'A scholar’s translation of 26:11, as Welch quotes it: “I will establish my presence in your midst”; the chapter is like the mercy seat and ark at the heart of the Holy of Holies'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'It is here (as Jacob Milgrom translated it[23]) that God declared, “I will establish my presence in your midst” (26:11). This masterful climactic chapter, with all its many blessings and promises, is like the mercy seat and the ark of the covenant at the heart of the Holy of Holies.'
  - where: 'note 26:11 “The LORD’s dwelling among them”'
    claim: 'In the Holy of Holies the presence of the Lord was encountered in hearing Him speak'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'It could not be said more clearly: for Leviticus, in the Holy of Holies, the presence of the Lord was encountered in hearing Him speak.'
  - where: 'note 26:11 “The LORD’s dwelling among them”'
    claim: 'The Student Manual: the promises of vv. 11–12 are more important than the others and can be summarized as Zion'
    key: ot-manual-lev-19-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-19-27-a-law-of-performances-and-ordinances-part-3-laws-of-mercy-and-righteousness'
    quote: 'Even more important, the Lord promised: “My soul shall not abhor you. And I will walk among you, and will be your God, and ye shall be my people.” (vv. 11–12) Those promises could be summarized in one word: Zion.'

  - where: 'note 26:13 “Made to walk upright”'
    claim: 'The bands of the yoke are the poles laid on beasts of burden; Egypt pressed Israel down so they could not walk upright; going upright is a figure of emancipation'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/26.htm'
    quote: 'It was with the burden of such a yoke that Egypt had pressed down the Israelites, so that they could no longer walk upright, till God by breaking the yoke helped them to walk upright again. As the yoke is a figurative description of severe oppression, so going upright is a figurative description of emancipation from bondage.'
  - where: 'note 26:13 “Made to walk upright”'
    claim: 'The yoke’s bands are literally the poles of the yoke'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/26.htm'
    quote: 'lit., the poles of the yoke (cf. Ezekiel 34:27), i.e., the poles which are laid upon the necks of beasts of burden (Jeremiah 27:2) as a yoke, to bend their necks and harness them for work.'
  - where: 'note 26:13 “Made to walk upright”'
    claim: 'KnoWhy #422 counts Lev. 26:12–13 among the Old Testament’s powerful statements of God’s love'
    key: sc-knowhy-422
    url: 'https://scripturecentral.org/knowhy/why-the-book-of-mormons-depiction-of-a-loving-god-fits-with-the-old-testament'
    quote: 'The Old Testament contains powerful statements about God’s love for His children. In it, God comforts us by telling us, “I will walk among you, and will be your God, and ye shall be my people. ... I have broken the bands of your yoke, and made you go upright” (Leviticus 26:12–13).'

  - where: 'note 26:18 “Seven times more”'
    claim: 'If punishments did not bring Israel back, the Lord would punish sevenfold, multiplying judgments by degrees: one, two, three, then four punishments'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/26.htm'
    quote: '(1) utter barrenness in their land, - that is to say, one heavier punishment (Leviticus 26:18-20); (2) the extermination of their cattle by beasts of prey, and childlessness, - two punishments (Leviticus 26:21, Leviticus 26:22); (3) war, plague, and famine, - three punishments'
  - where: 'note 26:18 “Seven times more”'
    claim: 'The punishments were meant to bring Israel back to fidelity'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/26.htm'
    quote: 'But if these punishments did not answer their purpose, and bring Israel back to fidelity to its God, the Lord would punish the disobedient nation still more severely'
  - where: 'note 26:18 “Seven times more”'
    claim: 'The series is an ideal account, not a prediction of the order of events'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/26.htm'
    quote: 'But the series of judgments mentioned is not to be understood historically, as a prediction of the temporal succession of the different punishments, but as an ideal account of the judgments of God'
  - where: 'note 26:18 “Seven times more”'
    claim: 'Seven denotes the strengthening of the chastisement to its full measure'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/26.htm'
    quote: 'Seven, as the number of perfection in the works of God, denotes the strengthening of the chastisement, even to the height of its full measure (cf. Proverbs 24:16).'
  - where: 'note 26:18 “Seven times more”'
    claim: 'The covenant vengeance of 26:25 was punishment for breach of covenant, as severe as the blessings forfeited were great'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/26.htm'
    quote: 'The "covenant vengeance" was punishment inflicted for a breach of the covenant, the severity of which corresponded to the greatness of the covenant blessings forfeited by a faithless apostasy.'
  - where: 'note 26:18 “Seven times more”'
    claim: 'The curses repeat, and if the punishments lead Israel to repent the blessings are restored'
    key: muhlestein-prospering
    url: 'https://journal.interpreterfoundation.org/prospering-in-the-land-a-comparison-of-covenant-promises-in-leviticus-and-first-nephi-2/'
    quote: 'As can be seen, aspects of covenantal cursing are repeated in this list, e.g., no crops and no protection. They continue to be repeated through verse 38, after which God tells Israel that if their punishments eventually lead them to repent, they can still be forgiven'

  - where: 'note 26:26 “Bread by weight”'
    claim: 'Ten women baking in one oven means bread so scarce that one oven serves ten women; bread weighed out in rations'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/26.htm'
    quote: 'ten women could bake their bread in a single oven, whereas in ordinary times every woman would require an oven for herself; and they would have to eat the bread which they brought home by weight, i.e., not as much as every one pleased, but in rations weighed out so scantily'
  - where: 'note 26:26 “Bread by weight”'
    claim: 'Such calamities came on Israel and Judah more than once in sieges (2 Kgs. 6:25; the Chaldean invasions)'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/26.htm'
    quote: 'Calamities such as these burst upon Israel and Judah more than once when their fortified towns were besieged, particularly in the later times of the kings, e.g., upon Samaria in the reign of Joram (2 Kings 6:25.), and upon Jerusalem through the invasions of the Chaldeans'

  - where: 'note 26:34 “The land keeps its sabbaths”'
    claim: 'The Chronicler reads the seventy years of exile as the land enjoying its sabbaths'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'To fulfil the word of the Lord by the mouth of Jeremiah, until the land had enjoyed her sabbaths: for as long as she lay desolate she kept sabbath, to fulfil threescore and ten years.'
  - where: 'note 26:41 “Accept of the punishment”'
    claim: 'The verb in 26:41 is ratsah (H7521); the same verb is in 26:34 (enjoy her sabbaths)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'יִרְצ֥וּ'
  - where: 'note 26:41 “Accept of the punishment”'
    claim: 'The lexicon gives the sense “satisfy (by paying off debt)” for the land’s sabbaths (26:34, 43; 2 Chr. 36:21) and for guilt (26:41, 43)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7521.htm'
    quote: '4 make acceptable, satisfy (by paying off debt), subject land, paying off its sabbaths (Di Dr and others accept, be satisfied with [in payment]) Leviticus 26:34,43; 2Chronicles 36:21, with accusative of guilt incurred (עָוֺן) Leviticus 26:41,43'
  - where: 'note 26:41 “Accept of the punishment”'
    claim: 'The lexicon: the land shall pay off her sabbaths (26:34)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7521.htm'
    quote: 'Leviticus 26:34 the land shall pay off her sabbaths (accusative)'
  - where: 'note 26:41 “Accept of the punishment”'
    claim: 'The same verb is used of a sacrifice being accepted (Lev. 1:4), and of Isa. 40:2, her punishment accepted as satisfactory'
    key: bdb
    url: 'https://biblehub.com/hebrew/7521.htm'
    quote: 'be accepted, of sacrifices, with ל person, Leviticus 1:4; … 2 passive of Qal 4: נִרְצָח עֲוֺנָהּ Isaiah 40:2 her punishment is accepted (as satisfactory).'
  - where: 'note 26:41 “Accept of the punishment”'
    claim: 'A modern translation renders “make amends for their iniquity”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+26%3A34-43&version=NRSVUE'
    quote: 'if, then, their uncircumcised heart is humbled and they make amends for their iniquity'
  - where: 'note 26:42 “Jacob, Isaac and Abraham”'
    claim: 'Welch: the reversed order of the patriarchs perhaps emphasizes the book’s progression into God’s presence, back to the source of the covenant'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'the unusual order of the names of the three patriarchs found in Leviticus 26:42—namely Jacob, Isaac, and Abraham—oddly reverses the normal sequence, perhaps to emphasize the overall progression of the text of Leviticus'
  - where: 'note 26:42 “Jacob, Isaac and Abraham”'
    claim: 'Welch: moving back in time and space, into God’s presence, to the source of the covenant'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'moving back in time as well as in space, into the presence of God and unto the source of the oath and covenant made by God to His people.'
  - where: 'note 26:42 “Jacob, Isaac and Abraham”'
    claim: 'Welch quotes Mary Douglas: at the center is God’s justice and fidelity to the covenants with Abraham, Isaac and Jacob'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'what we find is not secret: still, only and always, the justice of God and his fidelity to the covenants he made with Abraham and Isaac and Jacob.'
  - where: 'note 26:42 “Jacob, Isaac and Abraham”'
    claim: 'The chapter reaffirms the blessings and curses that are the essence of the covenant with Abraham'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'This very powerful chapter reaffirms the blessings and curses that are the essence of the covenant between God and Abraham.'

  - where: 'note 26:44 “Not cast away”'
    claim: 'The Book of Mormon cites the promise to remember the covenant often, five times by Mormon and Moroni as the Nephite nation collapsed'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'This promise is cited often toward the end of the Book of Mormon, including five times by Mormon and Moroni as the Nephite nation collapsed.'
  - where: 'note 26:44 “Not cast away”'
    claim: 'The promise must have been poignant to Mormon and Moroni, who saw many of the curses fulfilled'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'the promise that the Lord would remember His covenant and restore Israel must have been especially poignant to Mormon and Moroni, who witnessed firsthand the fulfillment of many of Leviticus’s curses.'

  - where: 'note 26:46 “The close of the Sinai law”'
    claim: 'The closing frame reasserts the origin and authority of the statutes; they prepare Israel to be worthy of the land and partake of Yahweh’s holiness'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'This priestly formulation of “the statutes and judgments and laws” aims to prepare the Israelites to become worthy of the land they will be inheriting—temple worthy, one might say—and to partake of Yahweh’s holiness.'
  - where: 'note 26:46 “The close of the Sinai law”'
    claim: 'The phrase is also used in the Book of Mormon for the law of Moses, though Deuteronomy is a likelier source'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'While Leviticus may be the source for the Book of Mormon’s use of the phrase “statutes and judgments,” Deuteronomy is a far more likely candidate since the phrase is used once in Leviticus and seven times in Deuteronomy.'

  - where: 'note 26:11 “The LORD’s dwelling among them”'
    claim: 'The lexicon: mishkan is dwelling-place, and in the singular elsewhere always of the abode of the LORD'
    key: bdb
    url: 'https://biblehub.com/hebrew/4908.htm'
    quote: '2 elsewhere in singular always of abode of ׳י:'
  - where: 'note 26:11 “The LORD’s dwelling among them”'
    claim: 'The lexicon’s gloss for mishkan: dwelling-place, tabernacle'
    key: bdb
    url: 'https://biblehub.com/hebrew/4908.htm'
    quote: "dwelling-place, 'tabernacle'"
  - where: 'note 26:41 “Accept of the punishment”'
    claim: 'Others read the verb as accept, be satisfied with in payment'
    key: bdb
    url: 'https://biblehub.com/hebrew/7521.htm'
    quote: 'Di Dr and others accept, be satisfied with [in payment]'
  - where: 'note 26:44 “Not cast away”'
    claim: 'Text of 26:44: the LORD will not destroy them utterly or break His covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'I will not cast them away, neither will I abhor them, to destroy them utterly, and to break my covenant with them: for I am the LORD their God.'
  - where: 'note 26:46 “The close of the Sinai law”'
    claim: '26:46 serves as a summary statement for the book as a whole'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'it serves as a summary statement for the book as a whole'
  - where: 'note 26:46 “The close of the Sinai law”'
    claim: 'Lev. 25:1 opens with the LORD speaking in mount Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'And the LORD spake unto Moses in mount Sinai, saying,'
  - where: 'note 26:34 “The land keeps its sabbaths”'
    claim: 'Jeremiah foretold seventy years of exile'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng'
    quote: 'after seventy years be accomplished at Babylon I will visit you'
  - where: 'note 26:3 “The covenant Nephi received”'
    claim: 'Text of 1 Ne. 2:20–24 read for the comparison'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/2?lang=eng'
    quote: 'they shall be cut off from the presence of the Lord'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'The risen Lord says He gave the law and covenanted with Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/15?lang=eng'
    quote: 'Behold, I am he that gave the law, and I am he who covenanted with my people Israel; therefore, the law in me is fulfilled'
  - where: 'christ'
    claim: 'Welch pairs Lev. 26:45 with 3 Ne. 16:12'
