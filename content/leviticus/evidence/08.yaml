chapter: 8
claims:
  - where: 'when'
    claim: 'The tabernacle was set up in the first month of the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And it came to pass in the first month in the second year, on the first day of the month, that the tabernacle was reared up.'
  - where: 'when'
    claim: 'The laws of the offerings were given at Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'Which the LORD commanded Moses in mount Sinai, in the day that he commanded the children of Israel to offer their oblations unto the LORD'

  - where: 'setting'
    claim: 'Moses carries out the instructions of Exodus 29 and 40:12–15, joined with the anointing of the tabernacle and altar commanded in Exodus 30:26–29 and 40:9–11'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/8.htm'
    quote: 'The consecration of Aaron and his sons as priests was carried out by Moses according to the instructions in Exodus 29:1-36; Exodus 40:12-15; and the anointing of the tabernacle, with the altar and its furniture, as prescribed in Exodus 29:37; Exodus 30:26-29, and Exodus 40:9-11, was connected with it'
  - where: 'setting'
    claim: 'One older reading: the command waited until after the laws of sacrifice because most of them bore on this act'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/8.htm'
    quote: 'This command could not properly be carried out till after the appointment and regulation of the institution of sacrifice, because most of the laws of sacrifice had some bearing upon this act.'
  - where: 'setting'
    claim: 'Chapters 8–10 form one division: the consecration of the priests and the deaths of Nadab and Abihu'
    key: bd-leviticus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leviticus?lang=eng'
    quote: '(2) The ritual observed in the consecration of priests, together with an account of the deaths of Nadab and Abihu because they offered strange fire (Lev. 8–10).'
  - where: 'setting'
    claim: 'Chapter 9 opens on the eighth day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/9?lang=eng'
    quote: 'And it came to pass on the eighth day, that Moses called Aaron and his sons, and the elders of Israel;'
  - where: 'setting'
    claim: 'The Bible Dictionary says the consecration of the priesthood taught the need of consecrating the life of every worshipper'
    key: bd-leviticus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leviticus?lang=eng'
    quote: 'the consecration of the priesthood teaching the need of the consecration of the life of every worshipper who would draw nigh to God'

  - where: 'thread'
    claim: 'All of chapter 8 was done strictly as the Lord commanded'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'All of this was done strictly as the Lord had commanded (verses 34–36).'
  - where: 'thread'
    claim: 'Moses performed every part of the sacrifices; the priests only laid their hands on the animals'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/8.htm'
    quote: 'Moses officiated as the mediator of the covenant, through whose service Aaron and his sons were to be consecrated as priests of Jehovah, and performed every part of the sacrificial rite'
  - where: 'thread'
    claim: 'The refrain “as the LORD commanded Moses” stands six times in the chapter (verses 4, 9, 13, 17, 21, 29)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/8?lang=eng'
    quote: 'And Moses took the breast, and waved it for a wave offering before the LORD: for of the ram of consecration it was Moses’ part; as the LORD commanded Moses.'
  - where: 'thread'
    claim: 'On the eighth day Aaron goes to the altar himself'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/9?lang=eng'
    quote: 'Aaron therefore went unto the altar, and slew the calf of the sin offering, which was for himself.'
  - where: 'thread'
    claim: 'In chapter 10 Nadab and Abihu offer fire the LORD commanded them not'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/10?lang=eng'
    quote: 'offered strange fire before the LORD, which he commanded them not.'

  - where: 'note 8:3 “Made priests before all the people”'
    claim: 'One older reading: the congregation was summoned because the priests were consecrated for them, as mediators'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/8.htm'
    quote: 'The congregation had been summoned to perform this act, because Aaron and his sons were to be consecrated as priests for them, as standing mediators between them and the Lord.'
  - where: 'note 8:3 “Made priests before all the people”'
    claim: 'The same reading takes the whole congregation to mean the nation in its elders'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/8.htm'
    quote: 'then gathered "the whole congregation" - that is to say, the nation in the persons of its elders-there also'
  - where: 'note 8:3 “Made priests before all the people”'
    claim: 'The same reading supposes the animals were provided at the congregation’s expense'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/8.htm'
    quote: 'were no doubt provided by Moses at the expense of the congregation, for which the priesthood was instituted'
  - where: 'note 8:3 “Made priests before all the people”'
    claim: 'One study: the essence of the priestly role was access to the Presence'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'The essence of the priestly role, then, was access to the Presence'
  - where: 'note 8:3 “Made priests before all the people”'
    claim: 'Leviticus 8:3 commands the gathering of the congregation at the door'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/8?lang=eng'
    quote: 'And gather thou all the congregation together unto the door of the tabernacle of the congregation.'

  - where: 'note 8:4 “As the LORD commanded Moses”'
    claim: 'Exodus 39 closes the making of the priests’ garments with “as the LORD commanded Moses” (39:1, 5, 7, 21, 26, 29, 31)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/39?lang=eng'
    quote: 'and made the holy garments for Aaron; as the LORD commanded Moses.'
  - where: 'note 8:4 “As the LORD commanded Moses”'
    claim: 'Exodus 40 closes the setting of each furnishing with the same words (40:19, 21, 25, 27, 29, 32)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'and put the covering of the tent above upon it; as the LORD commanded Moses.'
  - where: 'note 8:4 “As the LORD commanded Moses”'
    claim: 'Moses did according to all the LORD commanded him in raising the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'Thus did Moses: according to all that the LORD commanded him, so did he.'
  - where: 'note 8:4 “As the LORD commanded Moses”'
    claim: 'Welch identifies the words of Lev. 8:4 in 1 Nephi 2:3, and hears in 1 Nephi 3:7 the overtones of Moses’s obedience in Leviticus 8'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'It is significant that 1 Nephi 2:3 uses the same words to describe Lehi’s faithful gathering of his family and provisions and tents, being “obedient unto the word of the Lord, wherefore he did as the Lord commanded him.”'
  - where: 'note 8:4 “As the LORD commanded Moses”'
    claim: 'Nephi’s pledge carries the overtones of Moses’s obedience in Leviticus 8'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Nephi’s subsequent pledge of strict obedience in 1 Nephi 3:7 likewise carries the overtones of being obedient to God’s commands as Moses had been in Leviticus 8.'

  - where: 'note 8:6 “Moses, Aaron, and the Aaronic Priesthood”'
    claim: 'Moses administered the gospel law under the authority of the Melchizedek Priesthood'
    key: bd-aaronic-priesthood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aaronic-priesthood?lang=eng'
    quote: 'As a result of the failure of the Israelites to observe the gospel law administered by Moses under the authority of the Melchizedek Priesthood'
  - where: 'note 8:6 “Moses, Aaron, and the Aaronic Priesthood”'
    claim: 'The priesthood given to Aaron was of lesser power and authority than the Melchizedek'
    key: bd-aaronic-priesthood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aaronic-priesthood?lang=eng'
    quote: 'This priesthood was of lesser power and authority than the priesthood of Melchizedek'
  - where: 'note 8:6 “Moses, Aaron, and the Aaronic Priesthood”'
    claim: 'The lineal restrictions on the Aaronic Priesthood were lifted when the law of Moses was fulfilled'
    key: bd-aaronic-priesthood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aaronic-priesthood?lang=eng'
    quote: 'The lineal restrictions of that Aaronic (Levitical) Priesthood were lifted when the law of Moses was fulfilled'
  - where: 'note 8:6 “Moses, Aaron, and the Aaronic Priesthood”'
    claim: 'John the Baptist, a priest of the Aaronic order, conferred it on Joseph Smith and Oliver Cowdery on May 15, 1829'
    key: bd-aaronic-priesthood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aaronic-priesthood?lang=eng'
    quote: 'Nineteen centuries later this same John was sent from heaven as a resurrected being to confer the Aaronic Priesthood upon Joseph Smith and Oliver Cowdery. This was done on May 15, 1829, near Harmony, Pennsylvania.'
  - where: 'note 8:6 “Moses, Aaron, and the Aaronic Priesthood”'
    claim: 'The Aaronic Priesthood functions under the direction of the Melchizedek Priesthood'
    key: bd-aaronic-priesthood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aaronic-priesthood?lang=eng'
    quote: 'The Aaronic Priesthood functions under the direction of the Melchizedek Priesthood (D&C 13; JS—H 1:68–72).'
  - where: 'note 8:6 “Moses, Aaron, and the Aaronic Priesthood”'
    claim: 'Moses received the Holy Priesthood under the hand of Jethro'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'And the sons of Moses, according to the Holy Priesthood which he received under the hand of his father-in-law, Jethro;'
  - where: 'note 8:6 “Moses, Aaron, and the Aaronic Priesthood”'
    claim: 'The second priesthood is named for Aaron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/107?lang=eng'
    quote: 'The second priesthood is called the Priesthood of Aaron, because it was conferred upon Aaron and his seed, throughout all their generations.'

  - where: 'note 8:11 “The tent and the altar anointed first”'
    claim: 'Exodus 40:9 commands the anointing of the tabernacle and all in it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And thou shalt take the anointing oil, and anoint the tabernacle, and all that is therein, and shalt hallow it'
  - where: 'note 8:11 “The tent and the altar anointed first”'
    claim: 'The anointing of the tabernacle was commanded in Exodus 40:9–10, which does not mention seven sprinklings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And thou shalt anoint the altar of the burnt offering, and all his vessels, and sanctify the altar: and it shall be an altar most holy.'
  - where: 'note 8:11 “The tent and the altar anointed first”'
    claim: 'The anointing presumably began in the Holy of Holies and moved outward to the laver'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'presumably following the same pattern as the setting up of the tabernacle: beginning in the Holy of Holies and moving outward until finished at the wash laver.'
  - where: 'note 8:11 “The tent and the altar anointed first”'
    claim: 'The altar was splashed seven times as well as anointed, so the oil reached its sides'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'Leviticus 8 tells us that the altar of burnt offering was splashed seven times as well as anointed, meaning that not only was the oil poured over the top of the altar, but it was also splashed on the sides.'
  - where: 'note 8:11 “The tent and the altar anointed first”'
    claim: 'The anointing sanctified Aaron, making him one who could minister'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'Moses then clothed Aaron and anointed him by pouring the oil over his head, which also sanctified him, meaning he was made into one who could minister.'

  - where: 'note 8:12 “Oil poured on Aaron’s head”'
    claim: 'One study: the anointing of Aaron was a gesture of approach'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'his anointing constituting a “gesture of approach” with particular reference to the gate liturgy'
  - where: 'note 8:12 “Oil poured on Aaron’s head”'
    claim: 'Even for the high priest, entrance to the Holy of Holies was once a year and by measured obedience'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'Even for the high priest, however, this privileged entrance was permissible merely one day a year and by measured obedience alone.'
  - where: 'note 8:12 “Oil poured on Aaron’s head”'
    claim: 'The high priest is the one on whose head the oil was poured'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/21?lang=eng'
    quote: 'And he that is the high priest among his brethren, upon whose head the anointing oil was poured'
  - where: 'note 8:12 “Oil poured on Aaron’s head”'
    claim: 'Exodus 40:15 commands the anointing of the sons as well'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And thou shalt anoint them, as thou didst anoint their father, that they may minister unto me in the priest’s office'

  - where: 'note 8:15 “Purifying a new altar”'
    claim: 'The Hebrew of “purified” in 8:15 is a form of the verb chata’ (H2398)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וַ/יְחַטֵּ֖א'
  - where: 'note 8:15 “Purifying a new altar”'
    claim: 'The lexicon’s basic sense of the verb: miss, go wrong, sin'
    key: bdb
    url: 'https://biblehub.com/hebrew/2398.htm'
    quote: 'verb miss (a goal or way), go wrong, sin'
  - where: 'note 8:15 “Purifying a new altar”'
    claim: 'The lexicon lists Lev. 8:15 under the sense purifying the altar from sin by the blood of the sin offering on its horns'
    key: bdb
    url: 'https://biblehub.com/hebrew/2398.htm'
    quote: 'the altar, by putting the blood of the sin-offering on its horns, Leviticus 8:15 (P)'
  - where: 'note 8:15 “Purifying a new altar”'
    claim: '“To make reconciliation” in 8:15 is the verb kipper'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'לְ/כַפֵּ֥ר'
  - where: 'note 8:15 “Purifying a new altar”'
    claim: 'The lexicon’s sense of kipper: cover over, atone for'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'cover over, atone for sin and persons by legal rites'
  - where: 'note 8:15 “Purifying a new altar”'
    claim: 'The lexicon lists Lev. 8:15 for atonement made for the altar to which the blood of the sin offering was applied'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'of the altar to which the blood of the sin-offering was applied Exodus 29:36,37; Exodus 30:10; Leviticus 8:15'
  - where: 'note 8:15 “Purifying a new altar”'
    claim: 'One older reading: the altar was just anointed, so the blood could not be removing an inherent uncleanness'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/8.htm'
    quote: 'the object of the cleansing or sanctification of it through the blood of the sacrifice cannot have been to purify it a second time from uncleanness, that still adhered to it, or was inherent in it'
  - where: 'note 8:15 “Purifying a new altar”'
    claim: 'The same reading: it referred to pollutions the priests would bring to the altar in their service'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/8.htm'
    quote: 'had reference simply to pollutions, with which the priests defiled the altar when officiating at it, through the uncleanness of their sinful nature'
  - where: 'note 8:15 “Purifying a new altar”'
    claim: 'The same reading: the blood that purified the priests was also to purify the altar'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/8.htm'
    quote: 'to impress upon them the fact, that the blood, by which they were purified, was also to serve as the means of purifying the altar from the sins attaching to their service'

  - where: 'note 8:23 “The same marks on the priest and the cleansed leper”'
    claim: 'The cleansed leper receives the blood of the trespass offering on right ear, thumb and great toe'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/14?lang=eng'
    quote: 'the priest shall put it upon the tip of the right ear of him that is to be cleansed, and upon the thumb of his right hand, and upon the great toe of his right foot'
  - where: 'note 8:23 “The same marks on the priest and the cleansed leper”'
    claim: 'Belnap groups the Sinai covenant, the anointing of the tabernacle and priests, and the leper’s reintroduction as rites that make the relationship'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'those performed when making the relationships in the first place. Such was the purpose of the rite described in Exodus 24, the anointing of the tabernacle and the priests as described in Exodus 40 and Leviticus 8, and the reintroduction of the leper described in Leviticus 14.'
  - where: 'note 8:23 “The same marks on the priest and the cleansed leper”'
    claim: 'What these rites share is blood, water or oil placed on the one introduced or reintroduced'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'that element being the placement of blood, water, or oil on the individual being introduced or reintroduced into the society.'
  - where: 'note 8:23 “The same marks on the priest and the cleansed leper”'
    claim: 'The Seelys read the blood on ear, thumb and toe as probably symbolizing the anointing of the whole body'
    key: seely-messiah
    url: 'https://rsc.byu.edu/approaching-holiness/jesus-messiah-prophet-priest-king'
    quote: 'Moses anointed Aaron with blood upon the tip of his right ear, upon the thumb of his right hand, and upon the great toe of his right foot—probably symbolizing the anointing of the whole body.'
  - where: 'note 8:23 “The same marks on the priest and the cleansed leper”'
    claim: 'The whole process is called consecration and symbolized purification by water and blood and setting apart by oil'
    key: seely-messiah
    url: 'https://rsc.byu.edu/approaching-holiness/jesus-messiah-prophet-priest-king'
    quote: 'In the scriptures, this entire process is called consecration, and it symbolized purification—by water and blood—with a setting apart by oil.'

  - where: 'note 8:35 “Keeping the LORD’s watch”'
    claim: 'The Hebrew of “charge” in 8:35 is mishmereth'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'מִשְׁמֶ֥רֶת'
  - where: 'note 8:35 “Keeping the LORD’s watch”'
    claim: 'The lexicon: guard, watch, charge, function'
    key: bdb
    url: 'https://biblehub.com/hebrew/4931.htm'
    quote: 'a guard, watch, charge, function'
  - where: 'note 8:35 “Keeping the LORD’s watch”'
    claim: 'The lexicon: the ceremonial office or function of priest or Levite; with the LORD’s name, perform the service imposed by Him, Lev. 8:35'
    key: bdb
    url: 'https://biblehub.com/hebrew/4931.htm'
    quote: 'ceremonial office or function (AV RV usually charge) of priest or Levite'
  - where: 'note 8:35 “Keeping the LORD’s watch”'
    claim: 'The lexicon lists Lev. 8:35 under perform the service imposed by'
    key: bdb
    url: 'https://biblehub.com/hebrew/4931.htm'
    quote: 'perform the service imposed by, due to, Leviticus 8:35'
  - where: 'note 8:35 “Keeping the LORD’s watch”'
    claim: 'Nadab and Abihu die before the LORD in chapter 10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/10?lang=eng'
    quote: 'offered strange fire before the LORD, which he commanded them not.'

  - where: 'christ'
    claim: 'Hebrews: the law makes high priests with infirmity; the oath makes the Son, consecrated for evermore'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/7?lang=eng'
    quote: 'For the law maketh men high priests which have infirmity; but the word of the oath, which was since the law, maketh the Son, who is consecrated for evermore.'
  - where: 'christ'
    claim: 'The Seelys: Jesus did not have to make sacrifice for himself because he was pure'
    key: seely-messiah
    url: 'https://rsc.byu.edu/approaching-holiness/jesus-messiah-prophet-priest-king'
    quote: 'He did not have to make sacrifice for himself because he was pure; he brought to God the sacrifice of his own blood'
  - where: 'christ'
    claim: 'The Seelys: the Holy Ghost given to Jesus after his baptism was a mortal anointing of the Messiah'
    key: seely-messiah
    url: 'https://rsc.byu.edu/approaching-holiness/jesus-messiah-prophet-priest-king'
    quote: 'Peter taught that the bestowal of the Holy Ghost to Jesus after his baptism represented a mortal anointing of the Messiah.'
  - where: 'christ'
    claim: 'John the Baptist was a priest of the Aaronic order and by that authority baptized Jesus'
    key: bd-aaronic-priesthood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/aaronic-priesthood?lang=eng'
    quote: 'from Aaron until John the Baptist, who was a priest in the Aaronic order (D&C 84:26–27), and by this authority he prepared the way for and baptized Jesus.'

  - where: 'explore'
    claim: 'The Seelys’ study treats the anointing of prophets, priests and kings and Jesus as the Anointed One in all three'
    key: seely-messiah
    url: 'https://rsc.byu.edu/approaching-holiness/jesus-messiah-prophet-priest-king'
    quote: 'In ancient Israel, those who held any of three religious offices were anointed: prophets, priests, and kings. Jesus Christ fulfilled all three of these offices.'
