chapter: 19
claims:
  # setting
  - where: setting
    claim: 'In one reading of the book''s shape, the way into the holy place runs between chapters 18 and 20 and through chapter 19'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'one’s passage into the Holy Place runs between the twin pillars of the two matched laws of sexual purity in chapters 18 and 20, as well as through chapter 19, the epitome of the Holiness Code.'
  - where: setting
    claim: 'The chapter''s central pinnacle is the love of neighbor (verse 18)'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'the essence of the Holiness Code, found in Leviticus 19, which culminates with its central pinnacle: “thou shalt love thy neighbor as thyself” (verse 18).'
  - where: setting
    claim: 'Read after the tabernacle chapters: holy places alone do not make holy; these laws help Israel increase in holiness'
    key: cfm-ot-2026-18
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/18?lang=eng'
    quote: 'Of course, simply being in holy places doesn’t make us holy. Leviticus 19 describes laws and commandments the Lord gave to help the Israelites increase in holiness.'
  - where: setting
    claim: 'The second great commandment of 19:18 is repeated often in the New Testament'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'The second great commandment, to “love thy neighbor as thyself,” first appears in Leviticus 19:18 and is repeated often throughout the New Testament.'
  - where: setting
    claim: 'One reading calls chapter 19 the heart of Leviticus'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Four come from Leviticus 19, the heart of the book of Leviticus:'
  - where: setting
    claim: 'The chapter is addressed to all the congregation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/19?lang=eng'
    quote: 'Speak unto all the congregation of the children of Israel, and say unto them, Ye shall be holy'

  # thread
  - where: thread
    claim: 'The laws seem unconnected but are unified by the command of verse 2'
    key: ot-manual-lev-19-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-19-27-a-law-of-performances-and-ordinances-part-3-laws-of-mercy-and-righteousness?lang=eng'
    quote: 'The laws that follow this commandment may seem at first to be without logical arrangement or interconnection, but they are unified when one considers them in light of the injunction to be holy given in verse 2.'
  - where: thread
    claim: 'Verses 3–4 and 11–12 echo the Ten Commandments'
    key: ot-manual-lev-19-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-19-27-a-law-of-performances-and-ordinances-part-3-laws-of-mercy-and-righteousness?lang=eng'
    quote: 'The fifth commandment (honoring parents) and the fourth commandment (keeping the Sabbath day holy) are joined in verse 3, followed immediately by the second commandment (no graven images). In verse 11 the eighth commandment (stealing) is joined with the ninth (bearing false witness)'
  - where: thread
    claim: 'The refrain occurs fifteen times as a seal of authority on each statute (footnote 14e)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/19?lang=eng'
    quote: 'Note that this phrase occurs fifteen times like a seal of authority upon each of these statutes.'
  - where: thread
    claim: 'First-person statements: nine times in 18, fifteen in 19, thirteen in 20'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'In heightened density here, first-person statements appear some nine times in chapter 18, fifteen times in chapter 19, and thirteen times in chapter 20.'
  - where: thread
    claim: '“Ye shall keep my statutes” (19:19) opens a second series of commandments'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/19.htm'
    quote: 'open the second series of commandments, which make it a duty on the part of the people of God to keep the physical and moral order of the world sacred.'

  # section plain texts
  - where: section 3 plain
    claim: 'Paraphrase of 19:17 follows the Hebrew “bear sin because of him” (explained in the note on 19:17)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+19&version=NRSVUE'
    quote: 'you shall reprove your neighbor, or you will incur guilt yourself.'
  - where: section 4 plain
    claim: 'Paraphrase of 19:20 “inquiry and punishment” for “scourged” (explained in the note on 19:20)'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/19.htm'
    quote: 'lit., investigation, then punishment, chastisement. This referred to both parties'
  - where: section 4 plain
    claim: 'Paraphrase of 19:23 “unfit” for uncircumcised (explained in the note on 19:23)'
    key: ot-manual-lev-19-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-19-27-a-law-of-performances-and-ordinances-part-3-laws-of-mercy-and-righteousness?lang=eng'
    quote: 'it denotes the fruit as disqualified or unfit.'
  - where: section 5 plain
    claim: 'Paraphrase of 19:26 “divination or sorcery”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/19?lang=eng'
    quote: 'HEB you shall not divine or use sorcery.'
  - where: section 5 plain
    claim: 'Paraphrase of 19:27: cutting the hair round at the sides of the head'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/19.htm'
    quote: 'not cut the hair in a circle from one temple to the other'
  - where: section 5 plain
    claim: 'Paraphrase of 19:28 “tattoo”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7085.htm'
    quote: 'incision, imprintment, tattoo; Leviticus 19:28'
  - where: section 5 plain
    claim: 'Paraphrase of 19:29 “lewdness”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/19?lang=eng'
    quote: 'HEB lewdness.'
  - where: section 5 plain
    claim: 'Paraphrase of 19:31: those who consult the spirits of the dead'
    key: sc-knowhy-491
    url: 'https://scripturecentral.org/knowhy/how-are-the-words-of-the-book-of-mormon-like-one-that-hath-a-familiar-spirit'
    quote: 'A familiar spirit was typically understood as the ghost of someone who had passed away.'
  - where: section 6 plain
    claim: 'Paraphrase of 19:33 “oppress” for vex'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/19?lang=eng'
    quote: 'HEB oppress.'
  - where: section 6 plain
    claim: 'Paraphrase of 19:35 “measures of length” for meteyard'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/meteyard'
    quote: 'A yard, staff or rod, used as a measure.'

  # note 19:2
  - where: 'note 19:2 “What it is to be holy”'
    claim: 'Definition of holy; its opposite is common or profane'
    key: gs-holy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/holy?lang=eng'
    quote: 'Sacred, having a godly character, or spiritually and morally pure. The opposite of holy is common or profane.'
  - where: 'note 19:2 “What it is to be holy”'
    claim: 'Being holy means being set aside for the use of God'
    key: sc-knowhy-335
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-be-perfect'
    quote: 'In the scriptures, being holy means being set aside for the use of God.'
  - where: 'note 19:2 “What it is to be holy”'
    claim: 'Israel''s holiness is extrinsic, from Yahweh'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'For the Israelites, “holiness”—the state of being qdš—is extrinsic rather than intrinsic because it has its ultimate source in Yahweh.'
  - where: 'note 19:2 “What it is to be holy”'
    claim: 'The command presupposes the human potential to become like God in holiness'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'This commandment presupposes the human potential to ultimately become like divinity in the latter’s defining characteristic: holiness (and all that holiness implies).'
  - where: 'note 19:2 “What it is to be holy”'
    claim: 'The command is first given at 11:44 with the animals'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/11?lang=eng'
    quote: 'ye shall therefore sanctify yourselves, and ye shall be holy; for I am holy'

  # note 19:9
  - where: 'note 19:9 “The corners of the field and the gleanings”'
    claim: 'Who the poor were; the law legislates programs for them, including gleaning'
    key: seely-cry-widow
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/cry-widow-fatherless-stranger'
    quote: 'identify people who have little or no money, land, or possessions and thus have little power, influence, or social standing. The law of Moses defines the rights of the poor and legislates programs to help them'
  - where: 'note 19:9 “The corners of the field and the gleanings”'
    claim: 'How much was left depended on the landowner; Ruth shows the process'
    key: seely-cry-widow
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/cry-widow-fatherless-stranger'
    quote: 'The amount of the harvest left in the fields and vineyards depended on the charity and generosity of the landowner.'
  - where: 'note 19:9 “The corners of the field and the gleanings”'
    claim: 'Ruth is a widow from Moab who gleans in Boaz''s field'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/2?lang=eng'
    quote: 'And Ruth the Moabitess said unto Naomi, Let me now go to the field, and glean ears of corn'

  # note 19:14
  - where: 'note 19:14 “The deaf and the blind”'
    claim: 'An implied connection between the Lord''s compassion and that expected of His people, under the command to be holy'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'In these passages, there is an implied connection between the Lord’s compassion and that expected of his people. The laws, including Leviticus 19:14, begin with the injunction, “You shall be holy'
  - where: 'note 19:14 “The deaf and the blind”'
    claim: '19:14 ends with a declaration like that of 21:23'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'the injunction not to revile the deaf or place a stumbling block in front of the blind (Leviticus 19:14) concludes with a declaration similar to that in Leviticus 21:23: “I am the Lord.”'
  - where: 'note 19:14 “The deaf and the blind”'
    claim: 'In the passages the study surveys, the only institutional response is protection from harm'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'the only institutional response to disability evident in the various passages discussed above is to legislate protection of those with disabilities from physical harm or denigration by other people.'
  - where: 'note 19:14 “The deaf and the blind”'
    claim: 'Care is inculcated, not legislated'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'the biblical text promotes the responsibility to care for those with disabilities as a personal religious expectation—not legislated, but inculcated as a cultural value.'

  # note 19:17
  - where: 'note 19:17 “Rebuke rather than hidden hatred”'
    claim: 'Read of the neighbor''s sin: reprove him and do not tolerate his sin, but do not hate him (footnote 17a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/19?lang=eng'
    quote: 'Though you may reprove a neighbor and not tolerate his sin, do not hate him.'
  - where: 'note 19:17 “Rebuke rather than hidden hatred”'
    claim: 'A modern translation: or you will incur guilt yourself'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+19&version=NRSVUE'
    quote: 'you shall reprove your neighbor, or you will incur guilt yourself.'

  # note 19:18
  - where: 'note 19:18 “Love thy neighbour as thyself”'
    claim: 'reaʿ: friend; in a weaker sense fellow, fellow-citizen, another person (Lev. 19:18 listed)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7453.htm'
    quote: '2 in weaker sense, fellow, fellow-citizen, even another person,, with whom one stands in reciprocal relations'
  - where: 'note 19:18 “Love thy neighbour as thyself”'
    claim: 'The commandment moves love from emotion to will; each must desire the good of others'
    key: ot-manual-lev-19-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-19-27-a-law-of-performances-and-ordinances-part-3-laws-of-mercy-and-righteousness?lang=eng'
    quote: 'The statement that one is to love his neighbor as himself moves the idea of love in this case from a state of emotion to one of will.'
  - where: 'note 19:18 “Love thy neighbour as thyself”'
    claim: 'Each must desire the good of others as well as his own'
    key: ot-manual-lev-19-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-19-27-a-law-of-performances-and-ordinances-part-3-laws-of-mercy-and-righteousness?lang=eng'
    quote: 'Each must desire the good of others as well as his own.'
  - where: 'note 19:18 “Love thy neighbour as thyself”'
    claim: 'The verse ends with the added divine imprimatur, “I am the Lord”'
    key: poelman-gospel-church
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1984/10/the-gospel-and-the-church?lang=eng'
    quote: 'concluding with the second great commandment, “Thou shalt love thy neighbour as thyself,” with the added divine imprimatur, “I am the Lord.”'
  - where: 'note 19:18 “Love thy neighbour as thyself”'
    claim: 'Alma the Elder directly quotes Lev. 19:18 in Mosiah 23:15'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'There is little ambiguity here. Alma seems to be directly quoting Leviticus.'
  - where: 'note 19:18 “Love thy neighbour as thyself”'
    claim: 'Paul and James quote the verse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/5?lang=eng'
    quote: 'For all the law is fulfilled in one word, even in this; Thou shalt love thy neighbour as thyself.'

  # note 19:19
  - where: 'note 19:19 “Two kinds together”'
    claim: 'These laws are in harmony with the other admonitions to keep things pure and in proper use (footnote 19a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/19?lang=eng'
    quote: 'Note that these laws are in harmony with the other admonitions to keep things pure and in proper use.'
  - where: 'note 19:19 “Two kinds together”'
    claim: 'One older reading: the laws keep the natural order founded in creation (Gen. 1:11–12)'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/19.htm'
    quote: 'By these laws the observance of the natural order and separation of things is made a duty binding upon the Israelites, the people of Jehovah, as a divine ordinance founded in the creation itself (Genesis 1:11-12'
  - where: 'note 19:19 “Two kinds together”'
    claim: 'The same reading rejects other proposed reasons'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/19.htm'
    quote: 'All the symbolical, mystical, moral, and utilitarian reasons that have been supposed to lie at the foundation of these commands, are foreign to the spirit of the law.'
  - where: 'note 19:19 “Two kinds together”'
    claim: 'Deuteronomy names the cloth and the vineyard'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/22?lang=eng'
    quote: 'Thou shalt not wear a garment of divers sorts, as of woollen and linen together.'

  # note 19:20
  - where: 'note 19:20 “The betrothed slave woman”'
    claim: 'The word is a hapax: investigation, then punishment; it applies to both parties'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/19.htm'
    quote: 'lit., investigation, then punishment, chastisement. This referred to both parties, as is evident from the expression, "they shall not be put to death;"'
  - where: 'note 19:20 “The betrothed slave woman”'
    claim: 'The word occurs only here (ἁπ. λεγ.)'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/19.htm'
    quote: 'בּקּרת, ἁπ. λεγ., from בּקּר to examine'
  - where: 'note 19:20 “The betrothed slave woman”'
    claim: 'Even the personal rights of slaves were upheld; not death as for adultery or a free betrothed virgin'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/19.htm'
    quote: 'Even the personal rights of slaves were to be upheld; and a maid, though a slave, was not to be degraded to the condition of personal property.'
  - where: 'note 19:20 “The betrothed slave woman”'
    claim: 'With a free betrothed woman both die (Deut. 22:23–24)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/22?lang=eng'
    quote: 'If a damsel that is a virgin be betrothed unto an husband, and a man find her in the city, and lie with her;'

  # note 19:23
  - where: 'note 19:23 “Uncircumcised fruit”'
    claim: 'ʿarel: having foreskin, uncircumcised; figurative of fruit trees'
    key: bdb
    url: 'https://biblehub.com/hebrew/6189.htm'
    quote: 'adjective having foreskin, i.e. uncircumcised'
  - where: 'note 19:23 “Uncircumcised fruit”'
    claim: 'Figurative of fruit trees at Lev. 19:23'
    key: bdb
    url: 'https://biblehub.com/hebrew/6189.htm'
    quote: 'figurative of fruit trees Leviticus 19:23'
  - where: 'note 19:23 “Uncircumcised fruit”'
    claim: 'The metaphor denotes the fruit as unfit; used of heart (Lev. 26:41) and lips (Ex. 6:12)'
    key: ot-manual-lev-19-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-19-27-a-law-of-performances-and-ordinances-part-3-laws-of-mercy-and-righteousness?lang=eng'
    quote: 'it denotes the fruit as disqualified or unfit. In [Leviticus 26:41] the same metaphor is used for the heart which is stubborn or not ripe to listen to the Divine admonitions. And in other passages of Scripture it is used with reference to lips [Exodus 6:12, 30]'
  - where: 'note 19:23 “Uncircumcised fruit”'
    claim: 'One suggestion: the tree not sanctified until its firstfruits were dedicated, as the firstborn'
    key: ot-manual-lev-19-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-19-27-a-law-of-performances-and-ordinances-part-3-laws-of-mercy-and-righteousness?lang=eng'
    quote: 'until the first-fruits of the tree were dedicated to God, just as the firstborn of animals and men were (see Exodus 13:1–2), the tree was not viewed as sanctified, or set apart, for use by God’s people.'
  - where: 'note 19:23 “Uncircumcised fruit”'
    claim: 'One older reading rejects horticultural reasons and rests on ethical grounds'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/19.htm'
    quote: 'that in the first three years fruit-trees bear only a little fruit, and that somewhat insipid'
  - where: 'note 19:23 “Uncircumcised fruit”'
    claim: 'The fourth-year fruit an offering of praise and thanksgiving; a kind of firstfruits'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/19.htm'
    quote: 'but it rests rather upon ethical grounds.'
  - where: 'note 19:23 “Uncircumcised fruit”'
    claim: 'Praise and thanksgiving for the blessing on the trees'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/19.htm'
    quote: 'in praise and thanksgiving for the blessing which He had bestowed upon the fruit-trees. This offering falls into the category of first-fruits'

  # note 19:28
  - where: 'note 19:28 “Cuttings for the dead, and marks”'
    claim: 'qaʿaqaʿ: incision, imprintment, tattoo'
    key: bdb
    url: 'https://biblehub.com/hebrew/7085.htm'
    quote: 'incision, imprintment, tattoo; Leviticus 19:28'
  - where: 'note 19:28 “Cuttings for the dead, and marks”'
    claim: 'Wounds self-inflicted in grief and worship; in forbidding cuttings and marks the Lord signaled Israel was to be different'
    key: ot-manual-lev-19-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-19-27-a-law-of-performances-and-ordinances-part-3-laws-of-mercy-and-righteousness?lang=eng'
    quote: 'In forbidding the cutting of the flesh and the tattooing of marks in the flesh, the Lord again clearly signaled that Israel was to be different from their heathen neighbors. Wounds were self-inflicted in times of grief for the dead and during worship'
  - where: 'note 19:28 “Cuttings for the dead, and marks”'
    claim: 'The prophets of Baal cut themselves'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/18?lang=eng'
    quote: 'And they cried aloud, and cut themselves after their manner with knives and lancets, till the blood gushed out upon them.'

  # note 19:31
  - where: 'note 19:31 “Familiar spirits”'
    claim: 'A familiar spirit was the ghost of the dead; those who consulted them to divine the future were necromancers'
    key: sc-knowhy-491
    url: 'https://scripturecentral.org/knowhy/how-are-the-words-of-the-book-of-mormon-like-one-that-hath-a-familiar-spirit'
    quote: 'A familiar spirit was typically understood as the ghost of someone who had passed away. And those who consulted such spirits, usually to divine the future, were called necromancers.'
  - where: 'note 19:31 “Familiar spirits”'
    claim: 'Nephi likens Isaiah''s image to his people; the Book of Mormon turns the image on its head'
    key: sc-knowhy-491
    url: 'https://scripturecentral.org/knowhy/how-are-the-words-of-the-book-of-mormon-like-one-that-hath-a-familiar-spirit'
    quote: 'the Book of Mormon turns it on its head, showing how the God of Israel can allow the dead to speak to the living in a righteous and holy way.'
  - where: 'note 19:31 “Familiar spirits”'
    claim: 'Nephi''s people would speak out of the dust long after they had passed away'
    key: sc-knowhy-491
    url: 'https://scripturecentral.org/knowhy/how-are-the-words-of-the-book-of-mormon-like-one-that-hath-a-familiar-spirit'
    quote: 'Book of Mormon prophets knew that their words would speak to future generations “out of the dust” long after they had passed away (2 Nephi 26:16).'

  # note 19:34
  - where: 'note 19:34 “The stranger”'
    claim: 'gēr left land and kin, were landless and dependent, vulnerable to abuse'
    key: pierce-ger
    url: 'https://rsc.byu.edu/covenant-compassion/ger-pentateuch-book-mormon'
    quote: 'gēr were those who had left their settlement land and kinship ties to live in a new place, which left them landless and dependent.[1] These refugees were no longer protected under personal citizenship or inheritance laws and were therefore vulnerable to exploitation and abuse.'
  - where: 'note 19:34 “The stranger”'
    claim: 'The stranger: non-Israelite resident; the law''s provisions secured justice and fair treatment'
    key: bd-stranger
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/stranger?lang=eng'
    quote: 'The word is frequently used to denote a man of non-Israelite birth, resident in the promised land with the permission of the Israelite authorities. There were various provisions in the law with regard to the treatment of strangers, all of which were intended to secure for them justice and fair treatment'
  - where: 'note 19:34 “The stranger”'
    claim: 'The verse''s own words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/19?lang=eng'
