chapter: 27
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The chapter is given in mount Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/27?lang=eng'
    quote: 'These are the commandments, which the Lord commanded Moses for the children of Israel in mount Sinai.'
  - where: 'setting'
    claim: 'Leviticus 26:46 already closes the laws given at Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'These are the statutes and judgments and laws, which the Lord made between him and the children of Israel in mount Sinai by the hand of Moses.'
  - where: 'setting'
    claim: 'One older reading: vows follow the close of the Sinai law as an appendix because vows were freewill, not commanded, but once made had to be kept'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/27.htm'
    quote: 'The directions concerning vows follow the express termination of the Sinaitic lawgiving (Leviticus 26:46), as an appendix to it, because vows formed no integral part of the covenant laws, but were a freewill expression of piety'
  - where: 'setting'
    claim: 'Keil: a vow was not commanded, but once made was to be kept'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/27.htm'
    quote: 'it was not a sin to refrain from vowing, but that every vow, when once it had been made, was to be conscientiously and inviolably kept'
  - where: 'setting'
    claim: 'The chapter assumes the jubilee law of chapter 25, which may explain its place'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/27.htm'
    quote: 'the law of the Jubile year (Leviticus 27:17 ff.) is assumed to be in force. This fact, and its reference to rights of redemption (ch. 25), may account for the position of the ch. here.'
  - where: 'setting'
    claim: 'One reading: chapters 25 and 27 frame chapter 26, and both show how life and land belong to the Lord or are consecrated to Him by vows'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Chapters 25 and 27 detail ways in which all life and land already belong to the Lord or are further consecrated to Him by sacred vows.'
  - where: 'setting'
    claim: 'Welch: the concluding chapter prepares the reader to fulfil vows'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'A concluding chapter, Leviticus 27, prepares the reader to fulfill their temple vows and commitments.'
  - where: 'thread'
    claim: 'All the chapter''s actions rest on the premise that everyone and everything belongs to the Lord'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'All these ritual or legal actions proceed on the premises that everyone and everything belongs to the Lord and that He and His people are bound together by covenant'
  - where: 'thread'
    claim: 'Persons, cattle, houses and land may be vowed and redeemed; not the firstborn, the devoted, or the tithes, which belong to the Lord by law'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/27.htm'
    quote: 'all of which might be redeemed with the exception of sacrificial animals; but not the first-born (Leviticus 27:26), nor persons and things dedicated to the Lord by the ban (Leviticus 27:28, Leviticus 27:29), nor tithes (Leviticus 27:30-33)'
  - where: 'thread'
    claim: 'Nothing already holy to the Lord could be offered as a vow'
    key: bd-vows
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/vows?lang=eng'
    quote: 'Nothing already holy to the Lord, or intrinsically unholy, or blemished in the slightest degree, could be offered as a vow (Lev. 22:23; 27:26; Deut. 23:18).'
  - where: 'christ'
    claim: 'The male firstborn of animals belonged to God under the law of the firstborn'
    key: bd-firstborn
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstborn?lang=eng'
    quote: 'The male firstborn of animals also belonged to God.'

  # ---------- notes ----------
  - where: 'note 27:2 “A “singular vow”: giving a person to the LORD”'
    claim: 'The verb rendered singular means to make a hard (difficult) vow; same expression in Num. 6:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/6381.htm'
    quote: 'make a hard vow Leviticus 27:2; Numbers 6:2'
  - where: 'note 27:2 “A “singular vow”: giving a person to the LORD”'
    claim: 'The root means to be wonderful, extraordinary, difficult'
    key: bdb
    url: 'https://biblehub.com/hebrew/6381.htm'
    quote: 'To be wonderful, to be extraordinary, to be difficult, to be marvelous'
  - where: 'note 27:2 “A “singular vow”: giving a person to the LORD”'
    claim: 'One kind of vow was dedication, giving a person or thing to the Lord (Lev. 27:1–24); vows were often made to obtain a favor'
    key: bd-vows
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/vows?lang=eng'
    quote: 'These were of two kinds: (a) dedication—some person or thing was given to the Lord (Lev. 27:1–24)'
  - where: 'note 27:2 “A “singular vow”: giving a person to the LORD”'
    claim: 'Vows often had an entreating character'
    key: bd-vows
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/vows?lang=eng'
    quote: 'Vows often had an entreating character; they were offered in order to obtain some favor from Jehovah (Gen. 28:20; 2 Sam. 15:7–8).'
  - where: 'note 27:2 “A “singular vow”: giving a person to the LORD”'
    claim: 'A person could be dedicated to the Lord, e.g. the child Samuel; such persons were reckoned the Lord''s'
    key: ot-manual-lev-19-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-19-27-a-law-of-performances-and-ordinances-part-3-laws-of-mercy-and-righteousness?lang=eng'
    quote: 'it was possible for a man or woman to dedicate a person to the Lord, for example, Jephthah’s daughter or the child Samuel (see Judges 11:30–31; 1 Samuel 1:11). Here the Lord was saying that when a man made such a vow, the persons involved had to be reckoned as the Lord’s'
  - where: 'note 27:2 “A “singular vow”: giving a person to the LORD”'
    claim: 'The chapter redeems people from the obligations of their vows; unredeemed, the persons belong to God'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'redeeming people from obligations created by their personal vows to God (verses 2–8) and of redeeming animals (verses 9–13). Without being redeemed or the obligation being satisfied, these devoted persons or animals otherwise belong to God.'

  - where: 'note 27:3 “What the prices measured”'
    claim: 'A shekel means a shekel of silver; payments were made by weight before coinage'
    key: bd-money
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/money?lang=eng'
    quote: 'Before that time gold and silver were used as a medium of exchange, but payments were made by weight.'
  - where: 'note 27:3 “What the prices measured”'
    claim: 'One older reading: the price was set by capacity and vigour of life'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/27.htm'
    quote: 'The valuation price was regulated, therefore, according to capacity and vigour of life'
  - where: 'note 27:3 “What the prices measured”'
    claim: 'Another older reading: the estimate turned on strength and capability of work by sex and age'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/27.htm'
    quote: 'The estimate evidently turned upon the comparative strength and capability of work to be fairly expected in the two sexes and at various periods of life'
  - where: 'note 27:3 “What the prices measured”'
    claim: 'The poor man was valued by what he could pay; this made it possible for him to vow his own person'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/27.htm'
    quote: 'This regulation, which made it possible for the poor man to vow his own person to the Lord, presupposed that the person vowed would have to be redeemed.'

  - where: 'note 27:16 “A field priced by its seed and by the years to the jubilee”'
    claim: 'Land area was measured by the grain needed to sow it, as in Lev. 27:16'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Land area was also measured by the amount of grain needed to sow it, as in Lev. 27:16.'
  - where: 'note 27:16 “A field priced by its seed and by the years to the jubilee”'
    claim: 'A homer is said to be ten ephahs, about 230 liters'
    key: bd-weights-and-measures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/weights-and-measures?lang=eng'
    quote: 'Homer (dry). Said to be 10 ephahs. A homer is also believed to be 230 liters (or about 6½ U.S. bushels dry measure).'
  - where: 'note 27:16 “A field priced by its seed and by the years to the jubilee”'
    claim: 'One reading of chapters 25–27: Leviticus insists the land belongs to God and the people are His tenants'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Leviticus has to insist that the land belongs to God, he is the owner, and the people are his tenants using it by right of a divine grant or contract.'
  - where: 'note 27:16 “A field priced by its seed and by the years to the jubilee”'
    claim: 'The land is the Lord''s and Israel are sojourners with Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'The land shall not be sold for ever: for the land is mine; for ye are strangers and sojourners with me.'

  - where: 'note 27:29 “What could never be redeemed”'
    claim: 'Devoted renders ḥerem; in 27:28 it is anything devoted to the sanctuary under specially stringent conditions, which went to the priests'
    key: bdb
    url: 'https://biblehub.com/hebrew/2764.htm'
    quote: 'apparently (so Di) anything devoted to sanctuary under specially stringent conditions Leviticus 27:28'
  - where: 'note 27:29 “What could never be redeemed”'
    claim: 'Every human being who became ḥerem was to be killed (27:29)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2764.htm'
    quote: 'every human being who became ׳ח should be killed Leviticus 27:29'
  - where: 'note 27:29 “What could never be redeemed”'
    claim: 'Devoted things went to the priests (Num. 18:14)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2764.htm'
    quote: 'every such ׳ח (as in case of metals and metal objects Joshua 6:17,19) went to Aaron and his sons Numbers 18:14 (P)'
  - where: 'note 27:29 “What could never be redeemed”'
    claim: 'The ban falls on a Canaanite city such as Jericho'
    key: bdb
    url: 'https://biblehub.com/hebrew/2764.htm'
    quote: 'of a Canaan. city, as Jericho, including all inhabitants (except Rahab''s family) and spoil Joshua 6:17,18'
  - where: 'note 27:29 “What could never be redeemed”'
    claim: 'Elsewhere the ban falls on a Canaanite city such as Jericho, and on an idolatrous city in Israel'
    key: bdb
    url: 'https://biblehub.com/hebrew/2764.htm'
    quote: 'so an idolatrous city in Israel should become ׳ח, with all its contents, and be utterly destroyed Deuteronomy 13:17'
  - where: 'note 27:29 “What could never be redeemed”'
    claim: 'One older reading distinguishes the private dedication of v. 28 from the judicial sentence on persons such as the idolater or blasphemer meant in v. 29'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/27.htm'
    quote: 'a distinction is drawn between objects set apart for God by individuals (the ‘private ban’) referred to in this v., and those persons, such as the idolater or blasphemer, who were subjected to a judicial sentence by the authorities. The latter are those meant in Leviticus 27:29'
  - where: 'note 27:29 “What could never be redeemed”'
    claim: 'Another older reading: no individual could devote a human being at will, which would have broken the law against killing even a slave'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/27.htm'
    quote: 'an individual was not at liberty to devote a human being to the ban simply at his own will and pleasure, otherwise the ban might have been abused to purposes of ungodliness, and have amounted to a breach of the law, which prohibited the killing of any man, even though he were a slave'

  - where: 'note 27:30 “The tithe was the LORD’s before it was given”'
    claim: 'The tithe is a tenth part given for the service of God; first recorded with Abraham and Melchizedek'
    key: bd-tithe
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tithe?lang=eng'
    quote: 'The word denotes a tenth part, given for the service of God. The first recorded instance is the payment made by Abraham to Melchizedek (Gen. 14:20; Heb. 7:4–10).'
  - where: 'note 27:30 “The tithe was the LORD’s before it was given”'
    claim: 'The law directs the tithe to the Levites, who give a tenth of it to the priests'
    key: bd-tithe
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tithe?lang=eng'
    quote: 'In Num. 18:21–28 it is directed that tithe be paid to the Levites, who in their turn give one-tenth of what they receive to the priests.'
  - where: 'note 27:30 “The tithe was the LORD’s before it was given”'
    claim: 'Latter-day revelation restates the law of the tithe (D&C 119), with Lev. 27:30–34 among the passages listed'
    key: bd-tithe
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tithe?lang=eng'
    quote: 'Latter-day revelation emphasizes the law of the tithe as a duty and a test of faithfulness (D&C 64:23–25; 85:3; 97:11; 119).'

  - where: 'note 27:32 “Counting the flock under the rod”'
    claim: 'The shepherd''s rod was used in mustering or counting sheep (Lev. 27:32)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7626.htm'
    quote: 'shepherd''s implement, club, Psalm 23:4 ("" מִשְׁעֶנֶת), ׳רְעֵה בְשׁ Micah 7:14 (both figurative of ׳י); used in mustering or counting sheep Ezekiel 20:37 (figurative), Leviticus 27:32'
  - where: 'note 27:32 “Counting the flock under the rod”'
    claim: 'The shepherd''s rod was used to count the sheep at the day''s end'
    key: sc-knowhy-427
    url: 'https://scripturecentral.org/knowhy/how-are-rod-and-sword-connected-to-the-word-of-god'
    quote: 'The shepherd’s rod was a weapon, normally a piece of wood with a knob at one end. With it, he could defend the flock from predators. It was also used to count the sheep at the day’s end (see Leviticus 27:32; Ezekiel 20:37).'

  - where: 'note 27:34 “The book closes as it opened”'
    claim: 'Verse 34 marks the end of the scroll and, with 1:1, forms an inclusio, a double seal of divine approval'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'These two statements form an inclusio, bookending the text with a double seal of divine approval.'
  - where: 'note 27:34 “The book closes as it opened”'
    claim: 'Welch calls verse 34 a declaration of divine authorship that closes the revelation'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'That declaration of divine authorship closes the revelation with a statement similar to the words with which the book began'
  - where: 'note 27:34 “The book closes as it opened”'
    claim: 'Leviticus 1:1: the Lord called to Moses from the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/1?lang=eng'
    quote: 'And the Lord called unto Moses, and spake unto him out of the tabernacle of the congregation, saying,'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'LORD in small capitals in the KJV stands for the name Jehovah'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'In the KJV, the Jewish custom has been followed, and the name is generally denoted by Lord or God, printed in small capitals.'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary (see Mosiah 3:8; 15:1; 3 Ne. 15:1–5; D&C 110:1–10).'
  - where: 'christ'
    claim: 'The chapter''s premise is that everyone and everything belongs to the Lord'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'All these ritual or legal actions proceed on the premises that everyone and everything belongs to the Lord'
  - where: 'christ'
    claim: 'Jesus is the firstborn of the Father''s spirit children'
    key: bd-firstborn
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstborn?lang=eng'
    quote: 'Jesus is the firstborn of the spirit children of our Heavenly Father, the Only Begotten of the Father in the flesh, and the first to rise from the dead in the Resurrection'
