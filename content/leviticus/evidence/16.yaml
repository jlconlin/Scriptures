    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/17-thoughts?lang=eng'
    quote: 'The need for this annual ceremony was expressed in Leviticus 16:30'
  - where: 'note 16:30 “Clean before the LORD”'
    claim: 'Milgrom: when the object of kipper is a person, the prepositions mean “on behalf of”; the rite is not carried out on the offerer'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'However, when the object of kipper is a person, it is never expressed as a direct object but requires the prepositions ‘al or be’ad, both signifying “on behalf of” (e.g., Leviticus 16:6, 24, 30, 33; Numbers 8:12, 21).'
  - where: 'note 16:30 “Clean before the LORD”'
    claim: 'Welch identifies Ether 4:6 as echoing Lev. 16:30'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Leviticus 16:30 = Ether 4:6: being clean “before the Lord”'
  - where: 'note 16:30 “Clean before the LORD”'
    claim: 'Ether 4:6 wording'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/ether/4?lang=eng'
    quote: 'until the day that they shall repent of their iniquity, and become clean before the Lord.'
  - where: 'note 16:30 “Clean before the LORD”'
    claim: 'KnoWhy 479: the Book of Mormon teaches that only Christ bridges the gap between unclean humanity and God'
    key: sc-knowhy-479
    url: 'https://scripturecentral.org/knowhy/how-is-the-day-of-atonement-understood-in-the-book-of-mormon'
    quote: 'The Book of Mormon teaches that, when it comes to spiritual cleanliness, only Christ can bridge that gap between unclean or sinful humanity and an ultimately clean and purely righteous God'
  - where: 'note 16:30 “Clean before the LORD”'
    claim: 'KnoWhy 479 cites 1 Ne. 10:21, linking wickedness and uncleanness'
    key: sc-knowhy-479
    url: 'https://scripturecentral.org/knowhy/how-is-the-day-of-atonement-understood-in-the-book-of-mormon'
    quote: 'This verse suggests that doing “wickedly” is symbolically connected to being unclean.'

