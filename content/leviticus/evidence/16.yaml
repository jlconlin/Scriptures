chapter: 16
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The rite is kept on the tenth day of the seventh month'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'The Day of Atonement was the 10th day of the seventh month.'
  - where: 'setting'
    claim: 'The day is called Yom Kippur in Hebrew'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'The Day of Atonement (Yom Kippur in Hebrew) was the most significant holy day of the year for ancient Israel.'
  - where: 'setting'
    claim: 'The name “a day of atonement” appears in the calendar of feasts, Lev. 23:27–28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/23?lang=eng'
    quote: 'Also on the tenth day of this seventh month there shall be a day of atonement'
  - where: 'setting'
    claim: 'The day’s directions are also at Ex. 30:10; Lev. 23:26–32; Num. 29:7–11'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'The directions for its observance are given in Ex. 30:10; Lev. 16; 23:26–32; Num. 29:7–11.'
  - where: 'setting'
    claim: 'Tyndale coined atonement, scapegoat and mercy seat for this festival; the King James translators kept them'
    key: seely-tyndale
    url: 'https://rsc.byu.edu/king-james-bible-restoration/william-tyndale-language-one-ment'
    quote: 'Tyndale coined three new English words in conjunction with this festival, which he called the Day of Atonement: atonement, scapegoat, and mercy seat.'
  - where: 'setting'
    claim: 'The King James translators used Tyndale’s words'
    key: seely-tyndale
    url: 'https://rsc.byu.edu/king-james-bible-restoration/william-tyndale-language-one-ment'
    quote: 'The King James translators used Tyndale’s words atonement, scapegoat, and mercy seat in their translation of the Old Testament.'
  - where: 'setting'
    claim: 'In Welch’s reading of the book’s structure, chapter 16 gives the prerequisites for access to the Holy of Holies before the Holiness Code'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'in Leviticus 16, the reader finds the prescriptions for the Day of Atonement, prerequisites for reconciliation with God and access to the Holy of Holies. Only after reading through these prescriptions does one find the Holiness Code'
  - where: 'thread'
    claim: 'Atonement is made for himself, his household, and all the congregation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'until he come out, and have made an atonement for himself, and for his household, and for all the congregation of Israel.'
  - where: 'thread'
    claim: 'The closing summary names sanctuary, tabernacle, altar, priests and people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'he shall make an atonement for the priests, and for all the people of the congregation.'

  # ---------- note 16:2 ----------
  - where: 'note 16:2 “Within the veil, once a year”'
    claim: 'The rite is once a year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'to make an atonement for the children of Israel for all their sins once a year.'
  - where: 'note 16:2 “Within the veil, once a year”'
    claim: 'Keil: the chronological link to Nadab and Abihu shows the holiness of entering, and their death was a warning to Aaron'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/16.htm'
    quote: 'but also to show the importance and holiness attached to an entrance into the inmost sanctuary of God. The death of Aaron''s sons, as a punishment for wilfully "drawing near before Jehovah," was to be a solemn warning to Aaron himself'
  - where: 'note 16:2 “Within the veil, once a year”'
    claim: 'Keil: the cloud of v. 2 is the cloud of glory, not the incense; the high priest entering at his own pleasure would die'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/16.htm'
    quote: 'but the cloud of the divine glory, in which Jehovah manifested His essential presence'
  - where: 'note 16:2 “Within the veil, once a year”'
    claim: 'Keil: entering at his own pleasure or without blood would bring death'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/16.htm'
    quote: 'if he went before it at his own pleasure, or without the expiatory blood of sacrifice, would expose himself to certain death.'

  # ---------- note 16:4 ----------
  - where: 'note 16:4 “White linen in place of the garments of gold”'
    claim: 'The high priest on this day was clothed in white linen'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'The high priest, clothed in white linen, took a bullock as a sin offering'
  - where: 'note 16:4 “White linen in place of the garments of gold”'
    claim: 'Keil: he wore not the state costume but white garments, and bathed his whole body, not only hands and feet'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/16.htm'
    quote: 'he was to put on, not the state-costume of the high priest, but a body-coat, drawers, girdle, and head-dress of white cloth (bad: see Exodus 28:42), having first bathed his body, and not merely his hands and feet, as he did for the ordinary service'
  - where: 'note 16:4 “White linen in place of the garments of gold”'
    claim: 'Keil rejects the penitential reading and takes the white as holiness, citing the linen of the angel in Ezekiel and Daniel'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/16.htm'
    quote: 'For where in all the world have clear white clothes been worn either in mourning or as a penitential garment? The emphatic expression, "these are holy garments," is a sufficient proof that the pure white colour of all the clothes, even of the girdle, was intended as a representation of holiness.'
  - where: 'note 16:4 “White linen in place of the garments of gold”'
    claim: 'Keil: the angel of Jehovah was clothed in linen in Ezekiel and Daniel'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/16.htm'
    quote: 'Moreover, it was in baddim ("linen") that the angel of Jehovah was clothed (Ezekiel 9:2-3, Ezekiel 9:11; Ezekiel 10:2, Ezekiel 10:6-7, and Daniel 10:5; Daniel 12:6-7)'
  - where: 'note 16:4 “White linen in place of the garments of gold”'
    claim: 'He leaves the linen garments in the tent after the work inside'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'And Aaron shall come into the tabernacle of the congregation, and shall put off the linen garments, which he put on when he went into the holy place, and shall leave them there:'

  # ---------- note 16:8 ----------
  - where: 'note 16:8 “The scapegoat, or the goat “for Azazel””'
    claim: 'The Hebrew reads la-ʿazazel, “for Azazel”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'לַ/עֲזָאזֵֽל'
  - where: 'note 16:8 “The scapegoat, or the goat “for Azazel””'
    claim: 'Azazel occurs only in this context; the Greek and Latin took it, probably incorrectly, as a goat that goes away; Tyndale coined scapegoat from scape, a variant of escape'
    key: seely-tyndale
    url: 'https://rsc.byu.edu/king-james-bible-restoration/william-tyndale-language-one-ment'
    quote: 'The Hebrew word for this second goat is Azazel, a word that only occurs in this context in the Hebrew Bible. The early Greek and Latin translators presumed, probably incorrectly, that this word was made up of Hebrew ‘ēz ’ōzēl, meaning “a goat that goes away”'
  - where: 'note 16:8 “The scapegoat, or the goat “for Azazel””'
    claim: 'Tyndale made scapegoat from scape, a variant of escape, and goat'
    key: seely-tyndale
    url: 'https://rsc.byu.edu/king-james-bible-restoration/william-tyndale-language-one-ment'
    quote: 'Tyndale followed the Greek and Latin and invented a new English term for this entity. He placed the English word scape, a variant of escape, together with goat to get scapegoat.'
  - where: 'note 16:8 “The scapegoat, or the goat “for Azazel””'
    claim: 'Scholars now read Azazel as a demon’s name, so modern translations print Azazel; Tyndale’s term is still accurate'
    key: seely-tyndale
    url: 'https://rsc.byu.edu/king-james-bible-restoration/william-tyndale-language-one-ment'
    quote: 'Biblical scholars now believe that the term Azazel is most likely a proper name of a demon of some sort, and thus modern English translations usually render the term as Azazel. The term invented by Tyndale, however, is still accurate as a description of this goat'
  - where: 'note 16:8 “The scapegoat, or the goat “for Azazel””'
    claim: 'The Bible Dictionary’s gloss of Azazel'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'The other was for Azazel (the completely separate one, the evil spirit regarded as dwelling in the desert), to be sent away alive into the wilderness.'
  - where: 'note 16:8 “The scapegoat, or the goat “for Azazel””'
    claim: 'BDB: “entire removal”; most take it as the name of a desert spirit; the name is not found elsewhere; the rite is the entire removal of sin, symbol of entire forgiveness'
    key: bdb
    url: 'https://biblehub.com/hebrew/5799.htm'
    quote: 'עֲזָאזֵל noun [masculine] entire removal'
  - where: 'note 16:8 “The scapegoat, or the goat “for Azazel””'
    claim: 'BDB: most take it as the proper name of a spirit haunting the desert'
    key: bdb
    url: 'https://biblehub.com/hebrew/5799.htm'
    quote: 'proper name of spirit haunting desert'
  - where: 'note 16:8 “The scapegoat, or the goat “for Azazel””'
    claim: 'BDB: name not elsewhere; the rite is entire removal of sin, symbol of entire forgiveness'
    key: bdb
    url: 'https://biblehub.com/hebrew/5799.htm'
    quote: 'name not elsewhere); — ׳ע Leviticus 16:8,10 (twice in verse); Leviticus 16:26 in ritual of Day of Atonement, = entire removal of sin and guilt from sacred places into desert on back of goat, symbol of entire forgiveness.'
  - where: 'note 16:8 “The scapegoat, or the goat “for Azazel””'
    claim: 'Milgrom, as Welch quotes him: Azazel most plausibly a demon eviscerated of his powers'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'As Jacob Milgrom observed, “the most plausible explanation is that Azazel is the name of a demon . . . who has been eviscerated of his erstwhile demonic powers by the Priestly legislators.”'
  - where: 'note 16:8 “The scapegoat, or the goat “for Azazel””'
    claim: 'Milgrom: Israel transformed an ancient exorcism; the wilderness was thought uninhabited except by the satyr-demon Azazel'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'Significantly, the requirement of two hatta’t goats on Yom Kippur reveals how Israel transformed an ancient exorcism.'
  - where: 'note 16:8 “The scapegoat, or the goat “for Azazel””'
    claim: 'Milgrom: the scapegoat sent to the wilderness, thought uninhabited except by Azazel'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'Thus the scapegoat was sent to the wilderness, which was considered uninhabited except by the satyr-demon Azazel.'
  - where: 'note 16:8 “The scapegoat, or the goat “for Azazel””'
    claim: 'Only the LORD’s goat is offered as a sin offering; the other is presented alive'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'But the goat, on which the lot fell to be the scapegoat, shall be presented alive before the Lord, to make an atonement with him, and to let him go for a scapegoat into the wilderness.'

  # ---------- note 16:13 ----------
  - where: 'note 16:13 “The cloud of incense over the mercy seat”'
    claim: 'Bible Dictionary: the cloud covered the mercy seat and, as it were, hid him from God'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'cast the incense on the coals there so that the cloud of smoke might cover the mercy seat and, as it were, hide him from God.'
  - where: 'note 16:13 “The cloud of incense over the mercy seat”'
    claim: 'Keil reads the incense cloud as covering the glory with prayer, so that God might not see the sin'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/16.htm'
    quote: 'But as burning incense was a symbol of prayer, this covering of the capporeth with the cloud of incense was a symbolical covering of the glory of the Most Holy One with prayer to God, in order that He might not see the sin'
  - where: 'note 16:13 “The cloud of incense over the mercy seat”'
    claim: 'Coals from the altar and incense beaten small, brought within the veil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'And he shall take a censer full of burning coals of fire from off the altar before the Lord, and his hands full of sweet incense beaten small, and bring it within the veil:'

  # ---------- note 16:16 ----------
  - where: 'note 16:16 “Why a holy place needed atonement”'
    claim: 'The tent remains among them in the midst of their uncleanness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'and so shall he do for the tabernacle of the congregation, that remaineth among them in the midst of their uncleanness.'
  - where: 'note 16:16 “Why a holy place needed atonement”'
    claim: 'KnoWhy 849: most rites of atonement were reactive; sin offerings were made when a sin was realized'
    key: sc-knowhy-849
    url: 'https://scripturecentral.org/knowhy/why-is-yom-kippur-the-day-of-atonement-in-the-fall-at-the-end-of-the-harvest-rather-than-closer-to-the-spring-passover-when-jesus-was-sacrificed'
    quote: 'Most of these rites of atonement were reactive—for example, “sin offerings” were made whenever a person or the community realized they had sinned.'
  - where: 'note 16:16 “Why a holy place needed atonement”'
    claim: 'KnoWhy 849: some sins were forgotten or unknown; the day was a proactive, comprehensive purge'
    key: sc-knowhy-849
    url: 'https://scripturecentral.org/knowhy/why-is-yom-kippur-the-day-of-atonement-in-the-fall-at-the-end-of-the-harvest-rather-than-closer-to-the-spring-passover-when-jesus-was-sacrificed'
    quote: 'Inevitably, some sins were forgotten, hidden, or even committed without one knowing they had done anything wrong.'
  - where: 'note 16:16 “Why a holy place needed atonement”'
    claim: 'KnoWhy 849: a proactive, comprehensive purge'
    key: sc-knowhy-849
    url: 'https://scripturecentral.org/knowhy/why-is-yom-kippur-the-day-of-atonement-in-the-fall-at-the-end-of-the-harvest-rather-than-closer-to-the-spring-passover-when-jesus-was-sacrificed'
    quote: 'was a proactive, comprehensive purge that not only cleared away all remaining defilement but restored all things to their proper order.'
  - where: 'note 16:16 “Why a holy place needed atonement”'
    claim: 'KnoWhy 849: restored the sanctity of priesthood, tabernacle and people'
    key: sc-knowhy-849
    url: 'https://scripturecentral.org/knowhy/why-is-yom-kippur-the-day-of-atonement-in-the-fall-at-the-end-of-the-harvest-rather-than-closer-to-the-spring-passover-when-jesus-was-sacrificed'
    quote: 'they fully restored the sanctity of three main things—the priesthood, the tabernacle, and the people'
  - where: 'note 16:16 “Why a holy place needed atonement”'
    claim: 'Come, Follow Me: the rite allowed God’s presence to remain among the people'
    key: cfm-ot-2026-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/17-thoughts?lang=eng'
    quote: 'This allowed God’s presence to remain among the people.'
  - where: 'note 16:16 “Why a holy place needed atonement”'
    claim: 'Milgrom: impurity as a dynamic force attacking from a distance; the adytum polluted though no one enters'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'the priestly source propounds a notion of impurity as a dynamic force, magnetic and malefic to the sphere of the sacred, attacking it not just by direct contact but from a distance.'
  - where: 'note 16:16 “Why a holy place needed atonement”'
    claim: 'Milgrom: the adytum is polluted though no one may enter'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'the adytum is polluted though no man, not even the priest, may enter'
  - where: 'note 16:16 “Why a holy place needed atonement”'
    claim: 'Milgrom: the sacrificed goat purges impurities, the scapegoat carries off transgressions'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'The sacrificed goat purges the sanctuary (mittume’ot benê yisra’el) “of Israel’s impurities” (Leviticus 16:16), whereas the scapegoat carries off kolcawonot benê yisra’el, “all of Israel’s transgressions” (Leviticus 16:21).'

  # ---------- note 16:21 ----------
  - where: 'note 16:21 “Both hands, and the sins spoken aloud”'
    claim: 'Lane: substitution spelled out explicitly; the animal bears their iniquities'
    key: lane-whole-meaning
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/whole-meaning-law'
    quote: 'Here the idea of substitution and vicarious sacrifice is spelled out explicitly. It is particularly significant that in this ritual on the Day of Atonement, it is directly stated that the animal will “bear on itself” all their iniquities'
  - where: 'note 16:21 “Both hands, and the sins spoken aloud”'
    claim: 'The Hebrew of “a land not inhabited” is ʾereṣ gezerah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'גְּזֵרָ֑ה'
  - where: 'note 16:21 “Both hands, and the sins spoken aloud”'
    claim: 'BDB: a land of separation; cut off, whence it would not find its way back'
    key: bdb
    url: 'https://biblehub.com/hebrew/1509.htm'
    quote: 'unto a land of separation, of the goat for Azazel; solitary land RV; ''cut off,'' i.e. whence it would not readily find its ways back VB.'
  - where: 'note 16:21 “Both hands, and the sins spoken aloud”'
    claim: 'The man who let the goat go washes and bathes before returning'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'And he that let go the goat for the scapegoat shall wash his clothes, and bathe his flesh in water, and afterward come into the camp.'

  # ---------- note 16:22 ----------
  - where: 'note 16:22 “The goat that bore their iniquities”'
    claim: 'Scripture Helps: the scapegoat that bore Israel’s iniquities can symbolize Jesus Christ'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'And the scapegoat that would “bear upon him all [Israel’s] iniquities” can symbolize Jesus Christ'
  - where: 'note 16:22 “The goat that bore their iniquities”'
    claim: 'Come, Follow Me: the goats symbolized Jesus Christ, taking the place of the sinful people'
    key: cfm-ot-2026-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/17-thoughts?lang=eng'
    quote: 'In these rituals, the goats symbolized Jesus Christ, taking the place of the sinful people.'
  - where: 'note 16:22 “The goat that bore their iniquities”'
    claim: 'Come, Follow Me: God provided another way'
    key: cfm-ot-2026-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/17-thoughts?lang=eng'
    quote: 'But rather than destroy or drive out the sinners, God provided another way—a goat would be killed or driven out instead.'
  - where: 'note 16:22 “The goat that bore their iniquities”'
    claim: 'Lane: Isaiah 53:8 evokes the scapegoat; bearing iniquities is unique for sacrificial animals and parallels Isaiah 53:12'
    key: lane-whole-meaning
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/whole-meaning-law'
    quote: 'We read that Christ was “cut off out of the land of the living” (Isaiah 53:8), language that evokes the scapegoat ritual of Leviticus 16.'
  - where: 'note 16:22 “The goat that bore their iniquities”'
    claim: 'Lane: unique among sacrificial animals, parallel in Isaiah 53:12'
    key: lane-whole-meaning
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/whole-meaning-law'
    quote: 'This clear statement is unique in regards to sacrificial animals and finds a parallel in Isaiah 53:12, where the Servant “bare the sin of many,”'
  - where: 'note 16:22 “The goat that bore their iniquities”'
    claim: 'KnoWhy 675: the earliest exegetes saw Jesus as the sacrificed goat, as in Hebrews 9:12'
    key: sc-knowhy-675
    url: 'https://scripturecentral.org/knowhy/how-does-the-gospel-of-john-reflect-the-day-of-atonement'
    quote: 'Abhau notes, “the earliest exegetes saw Jesus not as the fulfillment of the scapegoat, but as the fulfillment of the [sacrificed] goat.” This is especially evident in the Epistle to the Hebrews'
  - where: 'note 16:22 “The goat that bore their iniquities”'
    claim: 'KnoWhy 849: the second goat most likely represents another aspect of what Jesus does'
    key: sc-knowhy-849
    url: 'https://scripturecentral.org/knowhy/why-is-yom-kippur-the-day-of-atonement-in-the-fall-at-the-end-of-the-harvest-rather-than-closer-to-the-spring-passover-when-jesus-was-sacrificed'
    quote: 'The second goat most likely represents another aspect of what Jesus does for humanity'
  - where: 'note 16:22 “The goat that bore their iniquities”'
    claim: 'KnoWhy 849: Christ is both the first and the second goat'
    key: sc-knowhy-849
    url: 'https://scripturecentral.org/knowhy/why-is-yom-kippur-the-day-of-atonement-in-the-fall-at-the-end-of-the-harvest-rather-than-closer-to-the-spring-passover-when-jesus-was-sacrificed'
    quote: 'Not only is Christ the first goat, offering Himself as our substitute, dying in our place and satisfying justice that we may live, He also takes the burden of all humanity upon himself like the second goat.'
  - where: 'note 16:22 “The goat that bore their iniquities”'
    claim: 'Isaiah 53:8 wording'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/53?lang=eng'
    quote: 'for he was cut off out of the land of the living: for the transgression of my people was he stricken.'

  # ---------- note 16:29 ----------
  - where: 'note 16:29 ““Afflict your souls”: the one fast of the law”'
    claim: 'BDB: the verb in Lev. 16:29 means to humble oneself by fasting'
    key: bdb
    url: 'https://biblehub.com/hebrew/6031.htm'
    quote: 'נֶפֶשׁ oneself, by fasting Leviticus 16:29,31'
  - where: 'note 16:29 ““Afflict your souls”: the one fast of the law”'
    claim: 'The only fast ordered by the law'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'The Day of Atonement appears to be the only fast ordered by the law.'
  - where: 'note 16:29 ““Afflict your souls”: the one fast of the law”'
    claim: 'Kept as a national fast'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'The day was kept as a national fast.'
  - where: 'note 16:29 ““Afflict your souls”: the one fast of the law”'
    claim: 'Such observances could become mere formalities, a danger the prophets recognized'
    key: bd-fasts
