chapter: 5
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The tabernacle was set up at Sinai in the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And it came to pass in the first month in the second year, on the first day of the month, that the tabernacle was reared up.'
  - where: 'setting'
    claim: 'Chapter 4’s ordinary person brings a female goat or lamb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/4?lang=eng'
    quote: 'he shall bring his offering, a kid of the goats, a female without blemish, for his sin which he hath sinned.'
  - where: 'setting'
    claim: 'The guilt (trespass) offering runs from 5:14 to 6:7'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/5.htm'
    quote: 'Chs. Leviticus 5:14 to Leviticus 6:7. The Guilt-Offering'
  - where: 'setting'
    claim: 'A modern translation calls it the guilt offering'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+5&version=NRSVUE'
    quote: 'you shall bring, as your guilt offering to the Lord, a ram without blemish from the flock, convertible into silver by the sanctuary shekel; it is a guilt offering.'
  - where: 'setting'
    claim: 'What was kept back from God or taken from man was restored with a fifth added'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The holy thing kept back from God, or the property stolen or withheld from man, was restored, a fifth part of their values being added in each case.'
  - where: 'setting'
    claim: 'Eight Book of Mormon references to the altar rituals come from Leviticus 5–8, including 5:4 and 5:5'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Eight Book of Mormon references, pertaining to the rituals at the altar of sacrifice, come from Leviticus 5–8:'
  - where: 'setting'
    claim: 'Leviticus 5:4 = Alma 12:31'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Leviticus 5:4 = Alma 12:31: “to do evil or to do good”'
  - where: 'thread'
    claim: 'Verses 1–4 can be read as one long condition with verse 5 as its consequence'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/5.htm'
    quote: 'all four verses should be taken as forming one long protasis to which Leviticus 5:5 is the apodosis.'
  - where: 'thread'
    claim: 'A Latter-day Saint study draws from these offerings the process of repentance under the law'
    key: gee-last-sacrifice
    url: 'https://rsc.byu.edu/behold-lamb-god/great-last-sacrifice'
    quote: 'From these sacrifices we can describe the basic process of repentance under the law of Moses:'
  - where: 'thread'
    claim: 'Trespass offerings also covered wrongs against man (6:1–7)'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: '(b) man directly (whether Israelite or foreigner), by depriving him of some just claim and right.'

  # ---------- notes ----------
  - where: 'note 5:1 “A witness who keeps silent”'
    claim: 'A modern translation renders verse 1 as a public adjuration to testify'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+5&version=NRSVUE'
    quote: 'When any of you sin in that you have heard a public adjuration to testify and, although able to testify as one who has seen or learned of the matter, do not speak up, you are subject to punishment.'
  - where: 'note 5:1 “A witness who keeps silent”'
    claim: 'Welch reads the duty to report behind Alma’s preaching in Ammonihah'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'the duty to report and to be involved in the process of obtaining a confession and making atonement for sins mentioned in Leviticus 5 appears to stand behind Alma’s efforts in Ammonihah. He could not simply ignore the well-known apostasy and wickedness in that town.'
  - where: 'note 5:1 “A witness who keeps silent”'
    claim: 'Alma needed to speak out or become guilty himself'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Alma the Younger needed to speak out against the resolutions of the people in Ammonihah or he himself would become guilty of their iniquities.'

  - where: 'note 5:3 “Guilt that begins when a person learns of it”'
    claim: 'Washing was the prescribed remedy for contact with uncleanness; these cases are where the purification was omitted through ignorance'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/5.htm'
    quote: 'For all contact with uncleanness, washing the clothes and bathing the body in water are prescribed'
  - where: 'note 5:3 “Guilt that begins when a person learns of it”'
    claim: 'The cases of 5:2–3 are those where the purification was omitted through ignorance'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/5.htm'
    quote: 'The cases supposed in Leviticus 5:2-3 are those where, through ignorance, the purification has been omitted, and a sacrifice is necessary to avert punishment.'
  - where: 'note 5:3 “Guilt that begins when a person learns of it”'
    claim: '“To do evil, or to do good” means any act whatever'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/5.htm'
    quote: 'to do evil, or to do good] i.e. to perform any act whatever.'
  - where: 'note 5:3 “Guilt that begins when a person learns of it”'
    claim: 'A modern translation renders verse 4 as a rash oath uttered aloud'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+5&version=NRSVUE'
    quote: 'Or when any of you utter aloud a rash oath for a bad or a good purpose, whatever people utter in an oath and are unaware of it, when you come to know it, you shall in any of these be guilty.'
  - where: 'note 5:3 “Guilt that begins when a person learns of it”'
    claim: 'The verse text: guilty when he knows of it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/5?lang=eng'
    quote: 'when he knoweth of it, then he shall be guilty.'

  - where: 'note 5:5 “Confession comes before the offering”'
    claim: 'Atonement could be made for crimes voluntarily confessed and compensated (Lev. 5:5)'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: '(3) crimes that a man voluntarily confessed, and for which he made (if possible) compensation (Lev. 5:5).'
  - where: 'note 5:5 “Confession comes before the offering”'
    claim: 'Gee: Alma 17:4 refers to the law of Moses; being brought before the altar and confessing is part of repentance under the law'
    key: gee-last-sacrifice
    url: 'https://rsc.byu.edu/behold-lamb-god/great-last-sacrifice'
    quote: 'Being brought before the altar of God and confessing their sins are part of the repentance process under the law of Moses.'
  - where: 'note 5:5 “Confession comes before the offering”'
    claim: 'Gee calls Alma 17:4 a hitherto unidentified reference to the law of Moses'
    key: gee-last-sacrifice
    url: 'https://rsc.byu.edu/behold-lamb-god/great-last-sacrifice'
    quote: 'the prophet Alma provides a hithertounidentified reference to the law of Moses'
  - where: 'note 5:5 “Confession comes before the offering”'
    claim: 'Welch reads Mosiah 26:35 as consistent with the priestly duty of Lev. 5:5'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'only if the sinners “repented of their sins and did confess them” could they remain numbered among the people of the church (Mosiah 26:35), consistent with the priestly duty articulated in Leviticus 5:5.'

  - where: 'note 5:6 “A trespass offering that is a sin offering”'
    claim: 'The Hebrew for “his trespass offering” in 5:6 is ʾasham with a suffix'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'אֲשָׁמ֣/וֹ'
  - where: 'note 5:6 “A trespass offering that is a sin offering”'
    claim: 'The same verse names the animal a ḥaṭṭaʾt, “for a sin offering”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'לְ/חַטָּ֑את'
  - where: 'note 5:6 “A trespass offering that is a sin offering”'
    claim: 'A modern translation renders it “as your penalty” and the animal “as a purification offering”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+5&version=NRSVUE'
    quote: 'you shall bring to the Lord, as your penalty for the sin that you have committed, a female from the flock, a sheep or a goat, as a purification offering'
  - where: 'note 5:6 “A trespass offering that is a sin offering”'
    claim: 'The Student Manual: not to be confused with the trespass offering proper of 5:14–19; it atones for what came under the sin offering'
    key: ot-manual-lev-1-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-1-10-a-law-of-performances-and-ordinances-part-1-sacrifices-and-offerings?lang=eng'
    quote: 'Though referred to as trespass offerings (see v. 6), this sacrifice should not be confused with the trespass offering proper discussed in Leviticus 5:14–19.'
  - where: 'note 5:6 “A trespass offering that is a sin offering”'
    claim: 'Chapter 4’s ordinary person brings a female lamb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/4?lang=eng'
    quote: 'And if he bring a lamb for a sin offering, he shall bring it a female without blemish.'

  - where: 'note 5:7 “The poor man’s offering”'
    claim: 'Two birds were the sin offering for the poor instead of a lamb'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'two turtle-doves or two young pigeons for purification from uncleanness, and for the poor instead of a lamb'
  - where: 'note 5:7 “The poor man’s offering”'
    claim: 'Birds for the burnt offering in cases of poverty'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The burnt offering might be made with male bullocks, rams, or he-goats without blemish; turtle-doves or pigeons of either sex in cases of poverty.'
  - where: 'note 5:7 “The poor man’s offering”'
    claim: 'The verse text: forgiven after the birds are offered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/5?lang=eng'
    quote: 'and the priest shall make an atonement for him for his sin which he hath sinned, and it shall be forgiven him.'

  - where: 'note 5:11 “Flour without oil or frankincense”'
    claim: 'The meat offering is ordinarily given with oil and frankincense'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/2?lang=eng'
    quote: 'his offering shall be of fine flour; and he shall pour oil upon it, and put frankincense thereon:'
  - where: 'note 5:11 “Flour without oil or frankincense”'
    claim: 'The flour is treated as a meal offering but described as a sin offering; a concession for extreme poverty'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/5.htm'
    quote: 'A further concession in the case of extreme poverty: 1/10th of an ephah of fine flour is allowed as a substitute for the animal sacrifice. This is treated as a Meal-Offering but described as a Sin-Offering'
  - where: 'note 5:11 “Flour without oil or frankincense”'
    claim: 'Keil: oil and incense as symbols of the Spirit and praise, withheld from one seeking forgiveness'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/5.htm'
    quote: 'he was not allowed to add oil and incense, as symbols of the Spirit and praise of God, to the sacrifice with which he sought the forgiveness of sin.'

  - where: 'note 5:15 “Breaking faith in the holy things”'
    claim: 'The word rendered “trespass” in 5:15 is maʿal'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'מַ֔עַל'
  - where: 'note 5:15 “Breaking faith in the holy things”'
    claim: 'BDB: maʿal is an unfaithful, treacherous act'
    key: bdb
    url: 'https://biblehub.com/hebrew/4604.htm'
    quote: 'unfaithful, treacherous act'
  - where: 'note 5:15 “Breaking faith in the holy things”'
    claim: 'The Bible Dictionary: sins regarded as robbery against God by neglecting rites, payments and offerings'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'certain sins might be regarded as robbery, or a violation of right, or an injury, whether in relation to (a) God directly, regarded as King of Israel, by neglecting some rites and services, payments, and offerings'
  - where: 'note 5:15 “Breaking faith in the holy things”'
    claim: 'The case is the holy thing kept back from God'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The holy thing kept back from God, or the property stolen or withheld from man, was restored'
  - where: 'note 5:15 “Breaking faith in the holy things”'
    claim: 'The Bible Dictionary lists 5:15 and 5:17 among unconscious, unintentional sins for which atonement could be made'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'Atonement could be made for (1) unconscious, unintentional sins (Lev. 4:2, 22, 27; 5:15, 17)'
  - where: 'note 5:15 “Breaking faith in the holy things”'
    claim: 'A modern translation: a ram convertible into silver by the sanctuary shekel'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+5&version=NRSVUE'
    quote: 'a ram without blemish from the flock, convertible into silver by the sanctuary shekel'
  - where: 'note 5:15 “Breaking faith in the holy things”'
    claim: 'The verse text: through ignorance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/5?lang=eng'
    quote: 'If a soul commit a trespass, and sin through ignorance, in the holy things of the Lord'

  - where: 'note 5:16 “Restitution and the added fifth”'
    claim: 'Compensation was made by the trespass offering and by restitution'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'This compensation was made (1) ethically, by the trespass offering (Lev. 5:15); (2) materially, by making restitution.'
  - where: 'note 5:16 “Restitution and the added fifth”'
    claim: 'BDB: the offering confined to offences that could be estimated and covered by compensation; guilt not expiated at the altar but by compensation'
    key: bdb
    url: 'https://biblehub.com/hebrew/817.htm'
    quote: 'This offering seems to have been confined to offences against God or man that could be estimated and so covered by compensation.'
  - where: 'note 5:16 “Restitution and the added fifth”'
    claim: 'BDB: no blood on the horns because the guilt was expiated by compensation'
    key: bdb
    url: 'https://biblehub.com/hebrew/817.htm'
    quote: 'There seems to have been no application of the blood to the horns of the altar (the chief ceremony of the sin-offering) because the guilt was not expiated at the altar but by compensation to the wronged person or his representative.'
  - where: 'note 5:16 “Restitution and the added fifth”'
    claim: 'The Student Manual (quoting Jukes): the trespasser’s death would not repair the trespass'
    key: ot-manual-lev-1-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-1-10-a-law-of-performances-and-ordinances-part-1-sacrifices-and-offerings?lang=eng'
    quote: 'The trespasser’s death would not repair the trespass, nor restore those rights which another had been robbed of.'
  - where: 'note 5:16 “Restitution and the added fifth”'
    claim: 'Lane (drawing on a commentary): the reparation offering pictures sin as a debt paid'
    key: lane-whole-meaning
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/whole-meaning-law'
    quote: 'The reparation offering presents a commercial picture of sin. Sin is a debt which man incurs against God. The debt is paid through the offered animal.'

  - where: 'note 5:17 “Guilty though he knew it not”'
    claim: 'The Bible Dictionary lists 5:17 among unconscious, unintentional sins for which atonement could be made'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'Atonement could be made for (1) unconscious, unintentional sins (Lev. 4:2, 22, 27; 5:15, 17)'
  - where: 'note 5:17 “Guilty though he knew it not”'
    claim: 'Chapter 4’s sins are those a person becomes conscious of; here one fears he has sinned but cannot specify it'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/5.htm'
    quote: 'The sins of ch. 4. are those of which a person becomes conscious (Leviticus 4:14; Leviticus 4:23; Leviticus 4:28). In such case he must offer a Sin-Offering. But the case here supposed is that of one who fears that he has been guilty'
  - where: 'note 5:17 “Guilty though he knew it not”'
    claim: 'No restitution, since the amount cannot be estimated'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/5.htm'
    quote: 'but no restitution is demanded as the amount cannot be estimated, since the offence remains unknown.'
  - where: 'note 5:17 “Guilty though he knew it not”'
    claim: 'One who fears he has been guilty but cannot specify it'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/5.htm'
    quote: 'the case here supposed is that of one who fears that he has been guilty of some infringement of the Divine commands, but cannot specify it.'
  - where: 'note 5:17 “Guilty though he knew it not”'
    claim: 'Jewish name: suspended guilt offering, relieving a troubled conscience'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/5.htm'
    quote: 'This sacrifice was called by the Jews (’âshâm tâluy), lit. a suspended Guilt or Trespass-Offering. It was a voluntary offering, and relieved a troubled conscience.'
  - where: 'note 5:17 “Guilty though he knew it not”'
    claim: '“Wist” is “knew”'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/5.htm'
    quote: 'though he knew (‘wist’ A.V.) it not'

  # ---------- christ / explore ----------
  - where: 'christ'
    claim: 'The word behind “an offering for sin” in Isaiah 53:10 is ʾasham'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'אָשָׁם֙'
  - where: 'christ'
    claim: 'BDB: the Messianic servant offers himself as an ʾasham in compensation, as substitute'
    key: bdb
    url: 'https://biblehub.com/hebrew/817.htm'
    quote: 'The Messianic servant offers himself as an אשׁם in compensation for the sins of the people, interposing for them as their substitute Isaiah 53:10'
  - where: 'christ'
    claim: 'Lane: Isaiah 53:10 is the most explicit connection to the law; asham is the sacrifice of Leviticus 5–7'
    key: lane-whole-meaning
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/whole-meaning-law'
    quote: 'The most explicit connection to the law of Moses is Isaiah 53:10: “Thou shalt make his soul an offering for sin.” The Hebrew text behind the translation “an offering for sin” is asham'
  - where: 'explore'
    claim: 'In Numbers 5 the fifth is given to the person wronged'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/5?lang=eng'
    quote: 'add unto it the fifth part thereof, and give it unto him against whom he hath trespassed.'
