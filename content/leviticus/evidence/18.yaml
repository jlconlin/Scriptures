chapter: 18
claims:
  # ---------- setting / thread ----------
  - where: setting
    claim: 'Welch reads chapters 18 and 20 as the matched pair of pillars at the entrance in the book''s tabernacle-like structure'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'The two pillars are represented structurally in Leviticus by the pair of chapters 18 and 20.'
  - where: setting
    claim: 'Chapter 18 names no punishments; chapter 20 adds them'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Leviticus 20 adds punishments throughout this text. No punishments are mentioned in Leviticus 18, and that omission was probably not an oversight.'
  - where: setting
    claim: 'Chapters 18 and 20 share their theme and many of their cases, presented differently'
    key: burnside-lev-20
    url: 'https://byustudies.byu.edu/article/exegesis-or-eisegesis-does-chiastic-analysis-help-us-to-understand-leviticus-20'
    quote: 'Both chapters have sexual offenses and other customs in neighboring nations as their theme, and many of the paradigm cases are the same'
  - where: setting
    claim: 'The Holiness Code is the scholars'' name for Leviticus 17–26'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'the second large law code in the Pentateuch is the Holiness Code, so called by biblical scholars since 1877'
  - where: 'note 18:18 “Two sisters as wives”'
    claim: 'Chapter 20 has no parallel to 18:18'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/18.htm'
    quote: 'Ch. 20 contains no parallels to Leviticus 18:7; Leviticus 18:10; Leviticus 18:17 b, Leviticus 18:18'
  - where: thread
    claim: '“I am Jehovah your God” stands at the head and the close of the chapter and makes its commands a covenant obligation'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/18.htm'
    quote: 'By the words, "I am Jehovah your God," which are placed at the head and repeated at the close (Leviticus 18:30), the observance of the command is enforced upon the people as a covenant obligation'
  - where: thread
    claim: 'First-person statements by the Lord come some nine times in chapter 18'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'first-person statements appear some nine times in chapter 18, fifteen times in chapter 19, and thirteen times in chapter 20.'
  - where: thread
    claim: 'The forbidden unions would wreck families and the community'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Leviticus 18 contains apodictic injunctions against sexual relationships that would wreak havoc upon the Israelites’ individual families and the community as a whole.'

  # ---------- sections ----------
  - where: section 1 plain
    claim: 'Paraphrase follows the KJV'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng'
    quote: 'Ye shall do my judgments, and keep mine ordinances, to walk therein: I am the LORD your God.'
  - where: section 2 plain
    claim: '“Uncover nakedness” is a euphemism for sexual intercourse, so the paraphrase says so'
    key: ot-manual-lev-11-18
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-11-18-a-law-of-performances-and-ordinances-part-2-the-clean-and-the-unclean'
    quote: 'The phrase “to uncover their nakedness” (v. 6; see also vv. 7–19) was a Hebrew euphemism for sexual intercourse'
  - where: section 2 plain
    claim: 'Verse 18 forbids marrying two sisters at once, while the first lives'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/18.htm'
    quote: 'It is the marriage of two sisters together that is prohibited.'
  - where: section 3 plain
    claim: 'Verse 19 refers to the uncleanness of a woman''s bleeding, in menstruation or after childbirth'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/18.htm'
    quote: 'signifies the uncleanness of a woman''s hemorrhage, whether menstruation or after childbirth'
  - where: section 4 plain
    claim: 'Paraphrase follows the KJV'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng'
    quote: 'Defile not ye yourselves in any of these things: for in all these the nations are defiled which I cast out before you:'

  # ---------- notes ----------
  - where: 'note 18:3 “Their statutes and the Lord’s”'
    claim: 'The word behind “their ordinances” in 18:3 is ḥuqqot (H2708)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וּ/בְ/חֻקֹּתֵי/הֶ֖ם'
  - where: 'note 18:3 “Their statutes and the Lord’s”'
    claim: 'The same word in 18:4–5 is rendered “ordinances” and “statutes,” and stands at the center of a chiasm'
    key: sc-knowhy-568
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-mormon-use-so-many-different-terms-for-law'
    quote: 'Leviticus 18:4–5, which is not a pleonastic list but a chiastic text where the two matching central elements are translated as ordinances and statutes despite being the same underlying word (both ḥuqqot).'
  - where: 'note 18:3 “Their statutes and the Lord’s”'
    claim: 'Hebrew legal terms apply to rules prescribed by God, by kings, or by Canaanites (Lev. 18:3)'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: '“apply to rules of conduct said to be prescribed by God (Exodus 18:16), kings (1 Kings 2:43), Canaanites (Leviticus 18:3), or even unjust judges.”'
  - where: 'note 18:5 “Life in the Lord’s statutes”'
    claim: 'Ezekiel repeats the promise of the statutes given in the wilderness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'And I gave them my statutes, and shewed them my judgments, which if a man do, he shall even live in them.'
  - where: 'note 18:5 “Life in the Lord’s statutes”'
    claim: 'Paul quotes the verse as the righteousness of the law, then turns to the righteousness of faith'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/10?lang=eng'
    quote: 'For Moses describeth the righteousness which is of the law, That the man which doeth those things shall live by them.'
  - where: 'note 18:5 “Life in the Lord’s statutes”'
    claim: 'Paul in Galatians sets the verse against faith'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/3?lang=eng'
    quote: 'And the law is not of faith: but, The man that doeth them shall live in them.'

  - where: 'note 18:6 “Near of kin, and uncovering nakedness”'
    claim: '“Uncover nakedness” is a Hebrew euphemism for sexual intercourse'
    key: ot-manual-lev-11-18
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-11-18-a-law-of-performances-and-ordinances-part-2-the-clean-and-the-unclean'
    quote: 'The phrase “to uncover their nakedness” (v. 6; see also vv. 7–19) was a Hebrew euphemism for sexual intercourse'
  - where: 'note 18:6 “Near of kin, and uncovering nakedness”'
    claim: '“Near of kin” is literally “flesh of his flesh,” a blood relation'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/18.htm'
    quote: '"Flesh of his flesh" is a flesh that is of his own flesh, belongs to the same flesh as himself (Genesis 2:24), and is applied to a blood-relation'
  - where: 'note 18:6 “Near of kin, and uncovering nakedness”'
    claim: 'Since husband and wife are one flesh, the husband''s nakedness is uncovered in his wife''s'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/18.htm'
    quote: 'As husband and wife are one flesh (Genesis 2:24), the nakedness of the husband is uncovered in that of his wife'
  - where: 'note 18:6 “Near of kin, and uncovering nakedness”'
    claim: 'The prohibition chiefly concerns marriage'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/18.htm'
    quote: 'The prohibition relates to both married and unmarried intercourse, though the reference is chiefly to the former'
  - where: 'note 18:6 “Near of kin, and uncovering nakedness”'
    claim: 'The law forbade relationships with close relatives by blood or by marriage'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'This legislation strictly forbade sexual relationships between close relatives, by blood or by marriage (Leviticus 18:6–18)'

  - where: 'note 18:16 “A brother’s wife”'
    claim: 'One older reading: the rule applies where the dead brother left children; if childless, the brother was required to marry the widow'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/18.htm'
    quote: 'This prohibition, however, only refers to cases in which the deceased brother had left children; for if he had died childless, the brother not only might, but was required to marry his sister-in-law (Deuteronomy 25:5).'
  - where: 'note 18:16 “A brother’s wife”'
    claim: 'Deuteronomy 25:5, the duty of a husband''s brother'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/25?lang=eng'
    quote: 'her husband’s brother shall go in unto her, and take her to him to wife, and perform the duty of an husband’s brother unto her.'
  - where: 'note 18:16 “A brother’s wife”'
    claim: 'John told Herod it was not lawful to have her'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/14?lang=eng'
    quote: 'For John said unto him, It is not lawful for thee to have her.'
  - where: 'note 18:16 “A brother’s wife”'
    claim: 'The Church''s footnote at 18:16 points to Matthew 14:3–4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng'
    quote: '16a “wife”: Lev. 20:21; Matt. 14:4 (3–4).'

  - where: 'note 18:18 “Two sisters as wives”'
    claim: 'The verse forbids marrying two sisters together; “in her lifetime” shows it does not forbid marrying a deceased wife''s sister'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/18.htm'
    quote: 'The words that follow (‘in her lifetime’) show that the law, as set down here, does not prohibit marriage with a deceased wife’s sister.'
  - where: 'note 18:18 “Two sisters as wives”'
    claim: 'One older reading: such a marriage disturbs the sisterly relation, as Jacob''s marriage to two sisters did; no punishment is fixed'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/18.htm'
    quote: 'disturb the sisterly relation, as the marriage with two sisters that was forced upon Jacob had evidently done. No punishment is fixed for the marriage with two sisters'

  - where: 'note 18:21 “Molech”'
    claim: 'Bible Dictionary: Molech was the Ammonite fire god, worshipped by passing children through fire or burning them'
    key: bd-molech
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/molech?lang=eng'
    quote: 'The abomination of the children of Ammon, a fire god, worshipped by passing children through or burning them in fire'
  - where: 'note 18:21 “Molech”'
    claim: 'Bible Dictionary: practiced by Solomon, the Northern Kingdom, Ahaz and Manasseh'
    key: bd-molech
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/molech?lang=eng'
    quote: 'Molech worship was practiced by Solomon (1 Kgs. 11:5, 7); by the people of the Northern Kingdom (2 Kgs. 17:17); and by Ahaz and Manasseh'
  - where: 'note 18:21 “Molech”'
    claim: 'Bowen: the MLK offerings were child sacrifices'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'it also forbade so-called MLK offerings (often translated as “Molech” offerings)—that is, child sacrifices (18:21).'
  - where: 'note 18:21 “Molech”'
    claim: 'Welch: idolatry belongs on the list because it was a close cousin of adultery'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Idolatry belongs on this list of unpermitted sexual relations because the unfaithfulness of idolatry was to the Hebrew mind a close cousin of adultery, especially since the covenant with the Lord was often represented as a marriage contract'
  - where: 'note 18:3 “Their statutes and the Lord’s”'
    claim: 'Verse 27: the men of the land did all these abominations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng'
    quote: '(For all these abominations have the men of the land done, which were before you, and the land is defiled;)'
  - where: 'note 18:22 “What verse 22 forbids”'
    claim: 'The Church''s statement of the law of chastity'
    key: topics-chastity
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics/chastity?lang=eng'
    quote: 'Chastity means not having any sexual relations outside of a legal marriage between a man and a woman.'
  - where: 'note 18:22 “What verse 22 forbids”'
    claim: 'Text: the chapter calls the whole list “these abominations”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng'
    quote: 'For whosoever shall commit any of these abominations, even the souls that commit them shall be cut off from among their people.'

  - where: 'note 18:23 “Confusion”'
    claim: 'BDB: tebel, confusion, violation of nature or the divine order (Lev. 18:23; 20:12)'
    key: bdb
    url: 'https://biblehub.com/hebrew/8397.htm'
    quote: 'תֶּ֫בֶל noun [masculine] confusion, violation of nature, or the divine order — Leviticus 18:23; Leviticus 20:12'
  - where: 'note 18:25 “The land that vomits”'
    claim: 'The Lord declared the same penalty for Israel as for the Canaanites'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The Lord declared the same penalty for the Israelites’ failure to observe these commandments as he had as for the Canaanites that had preceded them'
  - where: 'note 18:25 “The land that vomits”'
    claim: 'The manual sets 1 Nephi 17:32–35 beside 18:24–25: the Canaanites were cast out for these abominations'
    key: ot-manual-lev-11-18
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-11-18-a-law-of-performances-and-ordinances-part-2-the-clean-and-the-unclean'
    quote: 'These very abominations of the Canaanites caused them to be cast out of the promised land Israel was about to inherit (see Leviticus 18:24–25; 1 Nephi 17:32–35).'
  - where: 'note 18:25 “The land that vomits”'
    claim: 'Nephi: the people of the land were ripe in iniquity; the Lord esteems all flesh in one'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/17?lang=eng'
    quote: 'Behold, the Lord esteemeth all flesh in one; he that is righteous is favored of God. But behold, this people had rejected every word of God, and they were ripe in iniquity'

  - where: 'note 18:29 “Cut off”'
    claim: 'Burnside: cutting off (karet) is a characteristically divine form of punishment'
    key: burnside-lev-20
    url: 'https://byustudies.byu.edu/article/exegesis-or-eisegesis-does-chiastic-analysis-help-us-to-understand-leviticus-20'
    quote: 'karet (cutting off) is a characteristically divine form of punishment.'
  - where: 'note 18:29 “Cut off”'
    claim: 'Welch: Jesus foretells the same consequence in 3 Nephi 21:20'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Jesus foretells the same consequence for those in the latter days who fail to repent and accept Him as their Savior'
  - where: 'note 18:29 “Cut off”'
    claim: '3 Nephi 21:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/21?lang=eng'
    quote: 'whosoever will not repent and come unto my Beloved Son, them will I cut off from among my people, O house of Israel;'

  # ---------- christ / explore ----------
  - where: christ
    claim: 'The Church''s footnote at 18:5 sets 3 Nephi 15:9 beside “live”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng'
    quote: '5b “live”: Luke 10:28; 3 Ne. 15:9; D&C 84:44.'
  - where: christ
    claim: 'The risen Lord: I am he that gave the law'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/15?lang=eng'
    quote: 'Behold, I am he that gave the law, and I am he who covenanted with my people Israel; therefore, the law in me is fulfilled'
  - where: christ
    claim: '3 Nephi 15:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/15?lang=eng'
    quote: 'Behold, I am the law, and the light. Look unto me, and endure to the end, and ye shall live'
  - where: explore
    claim: 'Scripture pointers only'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/17?lang=eng'
    quote: 'And now, do ye suppose that the children of this land, who were in the land of promise, who were driven out by our fathers, do ye suppose that they were righteous? Behold, I say unto you, Nay.'
