chapter: 24
claims:
  # ---------- setting / thread / explore ----------
  - where: 'setting'
    claim: 'One older reading: the lamp and bread law follows ch. 23 as the daily service by which Israel sanctified its life and labor'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/24.htm'
    quote: 'formed part of the service in which Israel sanctified its life and labour to the Lord its God, not only at the appointed festal periods, but every day; and the law is very appropriately appended to the sanctification of the Sabbaths and feast-days, prescribed in ch. 23.'
  - where: 'setting'
    claim: 'Leviticus has only two stories, Nadab and Abihu (10) and the blasphemer (24)'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'The only two stories included in Leviticus are the account of Nadab and Abihu in Leviticus 10 and the case of the blasphemer in Leviticus 24.'
  - where: 'setting'
    claim: 'Both are stories of noncompliance ending in divine commands, springboards for further instructions'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'both stories are about noncompliance—namely the noncompliance of Nadab and Abihu in Leviticus 10 and of the blasphemer in Leviticus 24. These two woeful stories end with divine commands, and they ultimately serve as springboards for further instructions from the Lord.'
  - where: 'setting'
    claim: 'On the floorplan reading (Douglas, via Welch), the two stories are screens 1 and 2'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Douglas called these points screen 1 (chapter 10) and screen 2 (chapter 24).'
  - where: 'setting'
    claim: 'Chapter 24 stands at the second screen, the entrance to the Holy of Holies; 24:3 uses a unique expression for the veil, “veil of the covenant”'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'an explicit reference to the veil of the temple is found in Leviticus 24:3 right before this narrative account, using the unique expression pārōket hā‘ēdut, “the curtain of the pact” or “veil of the covenant.”'
  - where: 'thread'
    claim: 'Chapter 24 completes the discussion of the Holy Place'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'chapter 24 completes the discussion of the activities and implements in the Holy Place'
  - where: 'explore'
    claim: 'Numbers 9:6 ff. and 15:32–36 likewise connect laws with events'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/24.htm'
    quote: 'To mark, as is here done, the connexion between laws and the actual events of life is, as Dillm. remarks, quite in P’s manner (cp. Leviticus 10:16 ff.; Numbers 9:6 ff; Numbers 15:32-36)'

  # ---------- note 24:8 ----------
  - where: 'note 24:8 “Twelve loaves every sabbath”'
    claim: 'Twelve cakes of two tenths of an ephah each; frankincense as azcarah (cf. Lev. 2:2); twelve = the twelve tribes'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/24.htm'
    quote: 'Pure incense was then to be added to each row, which was to be (to serve) as a memorial (Azcarah, see Leviticus 2:2), as a firing for Jehovah.'
  - where: 'note 24:8 “Twelve loaves every sabbath”'
    claim: 'One older reading: the twelve loaves correspond to the twelve tribes'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/24.htm'
    quote: 'The number twelve corresponded to the number of the twelve tribes of Israel.'
  - where: 'note 24:8 “Twelve loaves every sabbath”'
    claim: 'The incense was burned every sabbath on removal of the loaves'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/24.htm'
    quote: 'which was burned upon the altar every Sabbath on the removal of the loaves as azcarah'
  - where: 'note 24:8 “Twelve loaves every sabbath”'
    claim: '“An everlasting covenant”: a pledge or sign of the covenant, like circumcision'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/24.htm'
    quote: 'i.e., a pledge or sign of the everlasting covenant, just as circumcision, as the covenant in the flesh, was to be an everlasting covenant (Genesis 17:13).'
  - where: 'note 24:8 “Twelve loaves every sabbath”'
    claim: 'The text of 24:5–9: two tenth deals per cake, two rows of six, frankincense, every sabbath, eaten by priests'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/24?lang=eng'
    quote: 'Every sabbath he shall set it in order before the Lord continually, being taken from the children of Israel by an everlasting covenant.'

  # ---------- note 24:11 ----------
  - where: 'note 24:11 ““Blasphemed the Name”: cursing or pronouncing”'
    claim: 'The Hebrew of 24:11 has only “the Name” (ha-shem)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'הַ/שֵּׁם֙'
  - where: 'note 24:11 ““Blasphemed the Name”: cursing or pronouncing”'
    claim: 'BDB: naqab I, pierce, bore'
    key: bdb
    url: 'https://biblehub.com/hebrew/5344.htm'
    quote: '1 pierce, bore with accusative 2 Kings 18:21 = Isaiah 36:6'
  - where: 'note 24:11 ““Blasphemed the Name”: cursing or pronouncing”'
    claim: 'BDB: naqab I also prick off, designate, name'
    key: bdb
    url: 'https://biblehub.com/hebrew/5344.htm'
    quote: '2 prick off, designate, wages Genesis 30:28 (J), name Isaiah 62:2'
  - where: 'note 24:11 ““Blasphemed the Name”: cursing or pronouncing”'
    claim: 'BDB: a second verb naqab, curse, under which Lev. 24:16 is listed'
    key: bdb
    url: 'https://biblehub.com/hebrew/5344.htm'
    quote: 'II. [נָקַב] verb curse'
  - where: 'note 24:11 ““Blasphemed the Name”: cursing or pronouncing”'
    claim: 'BDB lists Lev. 24:16 under the verb curse'
    key: bdb
    url: 'https://biblehub.com/hebrew/5344.htm'
    quote: 'Qal Infinitive suffix נָקְבוֺ שֵׁם Leviticus 24:16'
  - where: 'note 24:11 ““Blasphemed the Name”: cursing or pronouncing”'
    claim: 'Septuagint 24:11: named THE NAME and cursed'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/leviticus/24.htm'
    quote: 'And the son of the Israelitish woman named THE NAME and curse'
  - where: 'note 24:11 ““Blasphemed the Name”: cursing or pronouncing”'
    claim: 'Septuagint 24:16: he that names the name of the Lord'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/leviticus/24.htm'
    quote: 'And he that names the name of the Lord, let him die the death'
  - where: 'note 24:11 ““Blasphemed the Name”: cursing or pronouncing”'
    claim: 'Even blurting out the name in the heat of a fight was held worthy of death'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Even blurting out the holy name, cursing, and blaspheming in the heat of a fight was held to be worthy of death.'

  # ---------- note 24:12 ----------
  - where: 'note 24:12 “Waiting for the LORD''s word”'
    claim: 'Num. 15:34: the sabbath breaker put in ward because it was not declared what to do'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/15?lang=eng'
    quote: 'And they put him in ward, because it was not declared what should be done to him.'
  - where: 'note 24:14 “The hands of the witnesses”'
    claim: 'One older reading: the witnesses laid hands (cf. Lev. 1:4) to throw the blasphemy back on his head'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/24.htm'
    quote: 'By laying (resting, cf. Leviticus 1:4) their hands upon the head of the blasphemer, the hearers or witnesses were to throw off from themselves the blasphemy which they had heard, and return it upon the head of the blasphemer, for him to expiate.'
  - where: 'note 24:14 “The hands of the witnesses”'
    claim: 'The text: outside the camp, all who heard lay hands, all the congregation stone him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/24?lang=eng'
    quote: 'Bring forth him that hath cursed without the camp; and let all that heard him lay their hands upon his head, and let all the congregation stone him.'

  # ---------- note 24:16 ----------
  - where: 'note 24:16 “Why the Name was guarded with a life”'
    claim: 'The ruling names the stranger and the native'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/24?lang=eng'
    quote: 'as well the stranger, as he that is born in the land, when he blasphemeth the name of the Lord, shall be put to death.'
  - where: 'note 24:16 “Why the Name was guarded with a life”'
    claim: 'The case establishes that the name must be kept most holy'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'This crucial legal case of the trial of the blasphemer establishes, above all, that the name of the Lord must be kept most holy.'
  - where: 'note 24:16 “Why the Name was guarded with a life”'
    claim: 'The last step into the Holy of Holies is reverence for the sacred name'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Thus the final step that leads into the Holy of Holies and into the intimate presence of the Lord is obedience to the law of supreme reverence for the sacred name of God.'

  # ---------- note 24:20 ----------
  - where: 'note 24:20 “Talion at the center”'
    claim: 'Lev. 24:17–21 is laid out as a chiasm, the legal parallelism Alma followed'
    key: sc-knowhy-149
    url: 'https://scripturecentral.org/knowhy/why-and-how-did-alma-explain-the-meaning-of-the-word-restoration'
    quote: 'he structured his sermon in a chiastic form similar to legal parallelisms found in Mosaic Law. For instance, in Leviticus 24:17–21 we read:'
  - where: 'note 24:20 “Talion at the center”'
    claim: 'The laid-out chiasm runs from killing a man and a beast to breach, eye, tooth and back'
    key: sc-knowhy-149
    url: 'https://scripturecentral.org/knowhy/why-and-how-did-alma-explain-the-meaning-of-the-word-restoration'
    quote: 'And he that killeth any man shall surely be put to death. And he that killeth a beast shall make it good, beast for beast.'
  - where: 'note 24:20 “Talion at the center”'
    claim: 'At the chiastic center of 24:14–23 is talionic justice; not more than a tooth for a tooth'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'At the precise chiastic center of this text in Leviticus 24:14–23, the law of talionic justice is emphatically embedded. Punishments should match and mirror the crime: bruise for bruise, beast for beast, eye for eye, and not more than a tooth for a tooth, either.'
  - where: 'christ'
    claim: 'The footnote at 24:16 points to John 19:7 (the accusers’ appeal to the law)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/24?lang=eng'
    quote: '16a “blasphemeth”: John 19:7 (6–8). TG Blaspheme.'
