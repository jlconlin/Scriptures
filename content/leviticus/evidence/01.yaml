chapter: 1
claims:
  # ---------- setting / thread ----------
  - where: 'setting'
    claim: 'Leviticus begins right after the tabernacle is finished in Exodus 40 and gives instructions for the ordinances there, with very little narrative'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Leviticus begins right after the construction of the tabernacle in the wilderness was completed in Exodus, chapter 40. With this new sanctuary all set up, Leviticus presents instructions for the performance of ordinances there, and thus very little narrative is found in Leviticus.'
  - where: 'setting'
    claim: 'The material developed from the theophany at Sinai and is to be associated with Moses'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'there can be no doubt that the material in Leviticus developed from the theophany at Sinai and should be closely associated with Moses'
  - where: 'setting'
    claim: 'Present form may not come from Moses’s own handwriting'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'even though its present form may not come directly or completely from his personal handwriting.'
  - where: 'setting'
    claim: 'Chapters 1–7 give the rules for sacrifices offered in the court of the altar'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'The seven opening chapters of Leviticus set forth the rules regarding the sacrifices offered in the Court of the Altar, the first area encountered in the tabernacle.'
  - where: 'setting'
    claim: 'The court was the farthest an ordinary Israelite could go toward the Holy of Holies'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'This outer courtyard also represents the farthest that the ordinary Israelite could proceed in the temple toward God’s presence in the Holy of Holies.'
  - where: 'setting'
    claim: 'Under the law of Moses the offerings grew in number and kind'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'Later, when the Lord instituted the law of Moses, the variety and frequency of sacrificial offerings expanded.'
  - where: 'setting'
    claim: 'The book closes by giving its laws as the LORD’s commandments to Moses at Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/27?lang=eng'
    quote: 'These are the commandments, which the Lord commanded Moses for the children of Israel in mount Sinai.'
  - where: 'thread'
    claim: 'The burnt offering may come from the herd, the flock, or the birds (1:3, 10, 14)'
    key: brown-lehi-sacrifices
    url: 'https://rsc.byu.edu/jerusalem-zarahemla/what-were-those-sacrifices-offered-lehi'
    quote: 'In the case of burnt offerings, the animals for sacrifice might come from a herd or flock, or they might be birds (1:3,10, 14).'
  - where: 'thread'
    claim: 'The offerer presents, lays on hands and slays; the priest applies the blood and burns the offering'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The sacrificer himself slew his sacrifice (at the north side of the altar) … The priest collected the blood of the animal in a vessel and applied it in various ways and places to make an atonement'
  - where: 'thread'
    claim: 'Other offerings were eaten by priests or the offerer’s family; the burnt offering was burned whole after the skin went to the priest'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The whole of the burnt offering, after the skin (the priest’s perquisite) had been removed, was burnt upon the altar.'
  - where: 'thread'
    claim: 'Birds were allowed for the burnt offering in cases of poverty (a family that could not afford a larger animal)'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'turtle-doves or pigeons of either sex in cases of poverty.'

  # ---------- notes ----------
  - where: 'note 1:3 “The offering that goes up”'
    claim: 'ʿOlah derives from ʿalah, “to ascend”; the Hebrew name reflects the offering ascending, the English that it is burnt whole'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'the burnt offering, or the olah offering (derived from the Hebrew ͑alah, meaning “to ascend”); the Hebrew designation reflecting the nature by which this offering ascends into the divine realm, and the English reflecting that the entire animal or offering is burnt.'
  - where: 'note 1:3 “The offering that goes up”'
    claim: 'The Hebrew name comes from smoke ascending; burning the whole animal is the characteristic rite; constant surrender meant a burnt offering twice daily'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The burnt offering got its Hebrew name from the idea of the smoke of the sacrifice ascending to heaven. The characteristic rite was the burning of the whole animal on the altar'
  - where: 'note 1:3 “The offering that goes up”'
    claim: 'The continual burnt offering was offered twice daily because Israel’s obligation to surrender was constant'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'As the obligation to surrender was constant on the part of Israel, a burnt offering, called the continual burnt offering, was offered twice daily, morning and evening.'
  - where: 'note 1:3 “The offering that goes up”'
    claim: 'Sin offering: fat burned, rest eaten by priests; peace offering: fat burned, rest eaten by the offerer’s family; burnt offering burned whole after the skin went to the priest'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The fat of the sin offering, as the choicest part of the flesh, was in every case burnt upon the altar. The remainder of the flesh was eaten in a holy place by the priest and his sons.'
  - where: 'note 1:3 “The offering that goes up”'
    claim: 'The rest of the peace offering was eaten by the offerer and his family at the sanctuary'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The rest was given back to the sacrificers for them with their families and the Levites to eat at the Sanctuary in a sacred feast.'
  - where: 'note 1:3 “The offering that goes up”'
    claim: 'The burnt offering can be called a whole offering; the KnoWhy connects Omni 1:26 to it'
    key: sc-knowhy-467
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-mormon-say-we-must-worship-god-with-our-whole-soul'
    quote: 'The command in Omni 1:26 to “offer your whole souls as an offering” to God may connect to this type of burnt offering. Just as the whole animal was offered, we are to offer our “whole souls” to God.'
  - where: 'note 1:3 “The offering that goes up”'
    claim: 'The KJV “burnt offering” can also be translated “whole offering”'
    key: sc-knowhy-467
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-mormon-say-we-must-worship-god-with-our-whole-soul'
    quote: 'Leviticus 1 describes a sacrifice that the King James Translation calls a “burnt offering,” but which can also be translated as a “whole offering.”'

  - where: 'note 1:3 “Willing, and accepted”'
    claim: 'The Church reads the phrase as voluntary: offerings of their own voluntary will showed commitment to God'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'By offering valuable, life-sustaining objects to the Lord of their “own voluntary will,” the Israelites demonstrated their commitment to God.'
  - where: 'note 1:3 “Willing, and accepted”'
    claim: 'Ratson means goodwill, favour, acceptance, will'
    key: bdb
    url: 'https://biblehub.com/hebrew/7522.htm'
    quote: 'רָצוֺן noun [masculine] goodwill, favour, acceptance, will'
  - where: 'note 1:3 “Willing, and accepted”'
    claim: 'BDB lists Lev. 1:3 under acceptance, for acceptance for him before the LORD'
    key: bdb
    url: 'https://biblehub.com/hebrew/7522.htm'
    quote: '2 acceptance, of persons, offering sacrifice, לרצון לפני יהוה Exodus 28:38 (P); with ל person for acceptance for him before ׳י; with suffix person לרצנוֺ Leviticus 1:3'
  - where: 'note 1:3 “Willing, and accepted”'
    claim: 'Ratson comes from the verb “accept” (Strong’s 7521)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7522.htm'
    quote: 'Word Origin: [from H7521 (רָצָה - accept)]'
  - where: 'note 1:3 “Willing, and accepted”'
    claim: 'Verse 4’s “accepted” is a form of that verb (Strong’s 7521)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'נִרְצָ֥ה'
  - where: 'note 1:3 “Willing, and accepted”'
    claim: 'A modern translation renders “that he may be accepted before the Lord”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+1%3A3-4&version=ESV;NRSVUE'
    quote: 'He shall bring it to the entrance of the tent of meeting, that he may be accepted before the Lord.'
  - where: 'note 1:3 “Willing, and accepted”'
    claim: 'Burnt offerings could be brought as freewill offerings'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Some sacrifices are burnt offerings of animals from the Israelites’ cattle, herds, and flocks (verses 2–17), made as freewill offerings brought to the door of the sanctuary.'
  - where: 'note 1:3 “Willing, and accepted”'
    claim: 'The offerer chose willingly; efficacy tied to willingness'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'The offering had to be offered voluntarily, meaning the offerer willingly chose to be a part of the ritual process and was not forced to participate. That the offerer was a willing participant in the ritual process is significant and suggests that the efficacy of the rite was tied to the willingness of all participants.'
  - where: 'note 1:3 “Willing, and accepted”'
    claim: 'Offerings had to be the offerer’s own property, properly acquired'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'Under the law offerings made to God must be the offerer’s own property, properly acquired (Lev. 1:3).'
  - where: 'note 1:3 “Willing, and accepted”'
    claim: 'The Hebrew of “without blemish” means “whole, sound” (footnote 3c)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/1?lang=eng'
    quote: 'whole, sound'

  - where: 'note 1:4 “The hand on the animal’s head”'
    claim: 'The laying on of hands dedicated the animal and made it the offerer’s representative and substitute'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: '(2) The laying on of hands (Lev. 16:21) dedicated the animal to God and made it the sacrificer’s representative and substitute (Lev. 1:4; Num. 8:10).'
  - where: 'note 1:4 “The hand on the animal’s head”'
    claim: 'Lane reads the hand in 1:4 as substitution'
    key: lane-whole-meaning
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/whole-meaning-law'
    quote: 'This pattern can be seen in Leviticus 1:4: “And he [the person bringing the sacrifice] shall put his hand upon the head of the burnt offering; and it shall be accepted for him to make atonement for him.” The animal takes the place of the person in the sacrifice.'
  - where: 'note 1:4 “The hand on the animal’s head”'
    claim: 'Lane cautions that the substitutionary reading of Lev. 17:11 is heavily debated'
    key: lane-whole-meaning
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/whole-meaning-law'
    quote: 'It is important to note that this passage is heavily debated and those who hold different views on how to read it will have correspondingly different views on the role of substitutionary sacrifice in the law of Moses.'
  - where: 'note 1:4 “The hand on the animal’s head”'
    claim: 'The passage Lane’s footnote concerns is Lev. 17:11 read as a ransom'
    key: lane-whole-meaning
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/whole-meaning-law'
    quote: 'This principle of substitution of the animal’s suffering and death for human suffering and death seems to be suggested in Leviticus 17:11'
  - where: 'note 1:4 “The hand on the animal’s head”'
    claim: 'Belnap gives both readings, substitution and ownership, and turns to Numbers 8'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'Some have suggested that the placing of the hand indicated that a substitution was to take place, the animal now representing the offerer; others believe that it simply indicated ownership. [28] The performance of this act recorded in Numbers 8:6–19 may give some insight into the act’s significance.'
  - where: 'note 1:4 “The hand on the animal’s head”'
    claim: 'From Numbers 8, the laying on of hands was a transfer of representation; the Levites represented the firstborn'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'Thus it would appear that the laying of hands on another was a tangible transfer of representation. In other words, the Levites now represented the firstborn of Israel'

  - where: 'note 1:4 “What a burnt offering atoned for”'
    claim: 'The chapter heading reads the offerings as an atonement for sins'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/1?lang=eng'
    quote: 'Animals without blemish are sacrificed as an atonement for sins'
  - where: 'note 1:4 “What a burnt offering atoned for”'
    claim: 'Two kinds of atonement: for forgiveness of sins (sin offering) and not for sin at all (burnt offering)'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'Thus two types of atonement appear to be associated with the sacrificial rituals: (1) the atonement that is associated with the forgiveness of sins, reflected in the sin offering, and (2) the atonement enacted not for sin or wrongdoing at all, such as in the case of the burnt offering.'
  - where: 'note 1:4 “What a burnt offering atoned for”'
    claim: 'The burnt offering is among the rites of reconciliation or restoration'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'Our discussion of specific rituals will begin with those rites encompassing the second ritual function, reconciliation or restoration—the sacrificial offering system outlined in the first eight chapters of Leviticus. The first of the three offerings associated with reconciliation is the burnt offering'
  - where: 'note 1:4 “What a burnt offering atoned for”'
    claim: 'Brown: according to Lev. 1 a burnt offering was for atonement, purging after sin'
    key: brown-lehi-sacrifices
    url: 'https://rsc.byu.edu/jerusalem-zarahemla/what-were-those-sacrifices-offered-lehi'
    quote: 'according to Leviticus 1 a burnt offering was made for atonement—and more specifically, purging—after one had committed sin.'
  - where: 'note 1:4 “What a burnt offering atoned for”'
    claim: 'The daily burnt offerings covered all possible sin, known or not'
    key: brown-lehi-sacrifices
    url: 'https://rsc.byu.edu/jerusalem-zarahemla/what-were-those-sacrifices-offered-lehi'
    quote: 'Hence, the offerings were intended to cover all possible bases, whether the sin was known or not.'
  - where: 'note 1:4 “What a burnt offering atoned for”'
    claim: 'Lehi’s offerings were for safe return and for purging serious sins'
    key: brown-lehi-sacrifices
    url: 'https://rsc.byu.edu/jerusalem-zarahemla/what-were-those-sacrifices-offered-lehi'
    quote: 'In short, Lehi made offerings for the safe return of his sons and for purging serious sins.'
  - where: 'note 1:4 “What a burnt offering atoned for”'
    claim: 'The first offering (1 Ne. 2:7) mentions no burnt offering; the later two, after the returns from Jerusalem, do'
    key: brown-lehi-sacrifices
    url: 'https://rsc.byu.edu/jerusalem-zarahemla/what-were-those-sacrifices-offered-lehi'
    quote: 'Each set of offerings came after the return of Lehi’s sons from extended trips back to Jerusalem.'
  - where: 'note 1:4 “What a burnt offering atoned for”'
    claim: 'Lehi’s sacrifices were peace offerings of thanks, customary on completing a journey'
    key: brown-lehi-sacrifices
    url: 'https://rsc.byu.edu/jerusalem-zarahemla/what-were-those-sacrifices-offered-lehi'
    quote: 'Thus far, we have established that the sacrifices made by Lehi were peace offerings, an observation made firm through details in the account, such as Lehi’s party giving thanks and taking the occasion for rejoicing.'
  - where: 'note 1:4 “What a burnt offering atoned for”'
    claim: 'The trips were marked by the brothers’ murmuring and rebellion'
    key: brown-lehi-sacrifices
    url: 'https://rsc.byu.edu/jerusalem-zarahemla/what-were-those-sacrifices-offered-lehi'
    quote: 'Lehi confided to Nephi that “thy brothers murmur, saying it is a hard thing which I have required of them; but . . . it is a commandment of the Lord” (3:5).'
  - where: 'note 1:4 “What a burnt offering atoned for”'
    claim: 'The second return was marked by the brothers’ rebellion'
    key: brown-lehi-sacrifices
    url: 'https://rsc.byu.edu/jerusalem-zarahemla/what-were-those-sacrifices-offered-lehi'
    quote: 'Nephi, not shy in expressing his feelings about his brothers’ “rebellion,”'

  - where: 'note 1:5 “Who killed the animal”'
    claim: 'Six acts in every animal sacrifice; the offerer slew his own at the north side; later Levites or priests did'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The sacrificer himself slew his sacrifice (at the north side of the altar), and thus carried out actually the dedication to God that he had ceremonially expressed by the laying on of hands. A later custom was for the Levites or priests to slaughter the victims.'
  - where: 'note 1:5 “Who killed the animal”'
    claim: 'There were six important acts in all the animal sacrifices'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'In all the animal sacrifices of the Mosaic law there were six important acts'
  - where: 'note 1:5 “Who killed the animal”'
    claim: 'Blood of trespass, burnt and peace offerings sprinkled round about; sin offering blood on the horns'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The blood of the trespass, burnt, and peace offering was sprinkled on the altar of burnt offering round about.'
  - where: 'note 1:5 “Who killed the animal”'
    claim: 'The blood of the sin offering was smeared on the horns of the altar'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The blood of the sin offering (except in the particular case of the trespass offering) was put (smeared) upon the horns of the altar of burnt offering in ordinary cases.'
  - where: 'note 1:5 “Who killed the animal”'
    claim: 'Blood represented life; splashed on the altar, presumably affecting atonement'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'The blood was collected and splashed on the sides of the altar, presumably affecting atonement.'
  - where: 'note 1:5 “Who killed the animal”'
    claim: 'Blood represented life'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'blood represented the concept of life—the dynamic element that made living things living'

  - where: 'note 1:9 “A pleasing aroma”'
    claim: 'Sweet savour is an anthropomorphic description of God’s satisfaction and gracious acceptance, used even with sin offerings'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/1.htm'
    quote: 'an anthropomorphic description of the divine satisfaction with the sacrifices offered, or the gracious acceptance of them on the part of God (see Genesis 8:21), which is used in connection with all the sacrifices, even the expiatory or sin-offerings (Leviticus 4:31)'

  - where: 'note 1:14 “An offering any family could bring”'
    claim: 'Burnt offering animals; birds in cases of poverty'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The burnt offering might be made with male bullocks, rams, or he-goats without blemish; turtle-doves or pigeons of either sex in cases of poverty.'
  - where: 'note 1:14 “An offering any family could bring”'
    claim: 'The law of sacrifice is a broad entry point, for all conditions'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Sacrifices are to be offered under all sorts of conditions, whether in sickness or in health, well-being or in impurity, in good standing with the Lord or in need of forgiveness and drawing close to God.'
  - where: 'note 1:14 “An offering any family could bring”'
    claim: 'The law of sacrifice is meant as a broad entry point'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'The law of sacrifice is intended to be a broad entry point'

  # ---------- christ / explore ----------
  - where: 'christ'
    claim: 'The burnt offering represents all that Christ offered to bring about reconciliation'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'Similarly, the burnt offering represents all that he offered in order to bring about reconciliation as well as what we are expected to offer for this reconciliation.'
  - where: 'christ'
    claim: 'The law of Moses is not the law of sacrifice; the sacrament replaced sacrifice; the sacrifice changed from the offering to the offerer'
    key: ballard-sacrifice
    url: 'https://www.churchofjesuschrist.org/study/liahona/2002/03/the-law-of-sacrifice?lang=eng'
    quote: 'We should understand that the law of Moses is not the same thing as the law of sacrifice. … First, the ordinance of the sacrament replaced the ordinance of sacrifice; … In a sense, the sacrifice changed from the offering to the offerer.'
