chapter: 20
claims:
  - where: setting
    claim: 'Chapters 18 and 20 share a theme and many of the same cases'
    key: burnside-lev-20
    url: 'https://byustudies.byu.edu/article/exegesis-or-eisegesis-does-chiastic-analysis-help-us-to-understand-leviticus-20'
    quote: 'Both chapters have sexual offenses and other customs in neighboring nations as their theme, and many of the paradigm cases are the same'
  - where: setting
    claim: 'Chapter 20 states the penalties for its cases; chapter 18 does not set them case by case'
    key: burnside-lev-20
    url: 'https://byustudies.byu.edu/article/exegesis-or-eisegesis-does-chiastic-analysis-help-us-to-understand-leviticus-20'
    quote: 'whereas Lev 20 states the penalties for each prohibited sexual act, Lev 18 does not.'
  - where: setting
    claim: 'Welch: chapters 18 and 20 are the two pillars at the entrance'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'The two pillars are represented structurally in Leviticus by the pair of chapters 18 and 20.'
  - where: setting
    claim: 'Welch: the omission of penalties in 18 was no oversight; they were reserved as intensification for chapter 20'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'No punishments are mentioned in Leviticus 18, and that omission was probably not an oversight. The matter of punishments was simply reserved as intensification for the second iteration of the list in Leviticus 20.'
  - where: setting
    claim: 'Welch: cases punished by humans come first, those left to God second; a double warning against necromancy frames the chapter'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'incidents that may be punished by humans have been moved to the first half of the list, and those that are left to be dealt with by God appear in the second half. In addition, the framing passages of Leviticus 20 uniquely add an intensified double prohibition and double warning'
  - where: setting
    claim: 'The law applies to Israelites and to strangers who sojourn in Israel (verse 2)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/20?lang=eng'
    quote: 'Whosoever he be of the children of Israel, or of the strangers that sojourn in Israel, that giveth any of his seed unto Molech'
  - where: thread
    claim: 'Burnside: "put to death" is punishment by people; "set my face" and "cut off" by God'
    key: burnside-lev-20
    url: 'https://byustudies.byu.edu/article/exegesis-or-eisegesis-does-chiastic-analysis-help-us-to-understand-leviticus-20'
    quote: 'Short versions of these phrases (“shall be put to death” and “set my face against” and “cutting off from among their people”) recur throughout the chapter. They signify punishment either by humanity or by God.'
  - where: thread
    claim: 'Burnside: humans punish in 9–16, God in 17–18 (and 19–21)'
    key: burnside-lev-20
    url: 'https://byustudies.byu.edu/article/exegesis-or-eisegesis-does-chiastic-analysis-help-us-to-understand-leviticus-20'
    quote: 'This means that humanity is also responsible for “putting to death” in verses 9–13 and 15–16.'
  - where: thread
    claim: 'Burnside: the outer edges (2, 27) are human punishment, the inner (3, 6) divine, for Molech and wizardry'
    key: burnside-lev-20
    url: 'https://byustudies.byu.edu/article/exegesis-or-eisegesis-does-chiastic-analysis-help-us-to-understand-leviticus-20'
    quote: 'The outer edge of the large chiasm (20:2, 27), where humankind punishes for Molech worship and wizardry, parallels the outer edge of the smaller chiasm (20:3, 6), where YHWH punishes for Molech worship and wizardry.'
  - where: thread
    claim: 'Burnside: the center of the chiasm is 9–16, humankind''s responsibility to punish'
    key: burnside-lev-20
    url: 'https://byustudies.byu.edu/article/exegesis-or-eisegesis-does-chiastic-analysis-help-us-to-understand-leviticus-20'
    quote: 'The fulcrum of Lev 20 is verses 20:9–16, which focus on humankind’s responsibility to punish.'
  - where: thread
    claim: 'Welch: chapter 20 twice adds the demand to be holy (7, 26) and to obey the statutes (8, 22)'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Thus, Leviticus 20 twice adds to this structure the ultimate demand to “be holy” (verses 7, 26), obey the statutes (verses 8, 22), and maintain the statutory boundaries between the clean and the unclean (verse 25).'
  - where: section 1 plain
    claim: '"Familiar spirits" rendered as spirit mediums'
    key: sc-knowhy-491
    url: 'https://scripturecentral.org/knowhy/how-are-the-words-of-the-book-of-mormon-like-one-that-hath-a-familiar-spirit'
    quote: 'Several biblical passages, such as Leviticus 19:31, expressly prohibited Israelites from seeking out such spirit mediums'
  - where: 'note 20:3 “The sanctuary and the holy name”'
    claim: 'Welch: chapter 18''s motive was the land; chapter 20''s, not defiling the sanctuary or God''s name'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'whereas the motivation behind Leviticus 18 was to ensure that the Israelites would not be cast out of the land as its former inhabitants had been, the more elevated priestly motivation behind Leviticus 20 was to ensure that the Israelites would not defile the sanctuary or God’s name (20:3).'
  - where: 'note 20:3 “The sanctuary and the holy name”'
    claim: 'Welch: Molech was a god of Israel''s neighbors who required infant sacrifice; stoning for worshipping false gods'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Leviticus 20:2 is one of the verses that prescribes death by stoning as a punishment for worshipping false gods'
  - where: 'note 20:3 “The sanctuary and the holy name”'
    claim: 'The verse gives the reason: to defile the sanctuary and profane the holy name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/20?lang=eng'
    quote: 'because he hath given of his seed unto Molech, to defile my sanctuary, and to profane my holy name.'
  - where: 'note 20:4 “When the people look away”'
    claim: 'Burnside: assigning responsibility emphasizes collaboration, not jurisdiction'
    key: burnside-lev-20
    url: 'https://byustudies.byu.edu/article/exegesis-or-eisegesis-does-chiastic-analysis-help-us-to-understand-leviticus-20'
    quote: 'Lev 20, however, is interesting because it shows that the purpose of assigning responsibility is not to parcel up jurisdiction but to emphasize collaboration.'
  - where: 'note 20:4 “When the people look away”'
    claim: 'Burnside: humankind is apt to avoid punishing; verse 4 anticipates it'
    key: burnside-lev-20
    url: 'https://byustudies.byu.edu/article/exegesis-or-eisegesis-does-chiastic-analysis-help-us-to-understand-leviticus-20'
    quote: 'The chiasm emphasizes humankind’s responsibility because, of the two parties, humankind is apt to avoid meting out punishment, especially for idolatry, family, and sexual offenses. This is expressly anticipated by Lev 20:4'
  - where: 'note 20:4 “When the people look away”'
    claim: 'Burnside: the offenses happen near home; the family is most likely to know'
    key: burnside-lev-20
    url: 'https://byustudies.byu.edu/article/exegesis-or-eisegesis-does-chiastic-analysis-help-us-to-understand-leviticus-20'
    quote: 'would most likely have taken place either at home or close to home. Thus, the people most likely to know whether these offenses took place will be the offender’s own family.'
  - where: 'note 20:4 “When the people look away”'
    claim: 'Burnside: the penalty on the family is a motive to overcome reluctance; if humans fail, God punishes'
    key: burnside-lev-20
    url: 'https://byustudies.byu.edu/article/exegesis-or-eisegesis-does-chiastic-analysis-help-us-to-understand-leviticus-20'
    quote: 'First, it provides a powerful motive for overcoming any reluctance to initiate proceedings against an offender (see section c above). If humankind fails to punish, YHWH will punish anyway, but punishment will fall not only on the offender but also on the mishpachah.'
  - where: 'note 20:4 “When the people look away”'
    claim: 'Burnside: 20:9 beside 10–16 makes them family offenses; sexual ethics has a community aspect'
    key: burnside-lev-20
    url: 'https://byustudies.byu.edu/article/exegesis-or-eisegesis-does-chiastic-analysis-help-us-to-understand-leviticus-20'
    quote: 'the juxtaposition of 20:9 with 20:10–16 implies that these are not sexual offenses but family offenses. All this means that there is a community aspect to sexual ethics in the Bible. What people do with each other sexually is not a matter for themselves only'
  - where: 'note 20:4 “When the people look away”'
    claim: 'Burnside: the Decalogue links honoring parents with long life in the land; Lev 20 links penalties with retaining the land'
    key: burnside-lev-20
    url: 'https://byustudies.byu.edu/article/exegesis-or-eisegesis-does-chiastic-analysis-help-us-to-understand-leviticus-20'
    quote: 'Similarly, Lev 20 makes a link between punishment for cursing father and mother (20:9) and punishment for sexual offenses, which are seen as prototypical of cursing parents (20:10–16 and 20:17–21). Applying the penalties is thus linked with retaining the land (20:22).'
  - where: 'note 20:14 “Burnt with fire, and blood upon them”'
    claim: 'Cambridge: the "blood upon them" formula occurs in Ezekiel and compare Joshua 2:19; cursing parents is capital as in Exodus 21:17'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/20.htm'
    quote: 'The penalty of death is here assigned for cursing a parent, as in Exodus 21:17. … The words ‘his (their) blood shall be upon him (them)’ occur in this ch. and in Ezekiel 18:13; Ezekiel 33:5; cp. Joshua 2:19; Ezekiel 33:4.'
  - where: 'note 20:14 “Burnt with fire, and blood upon them”'
    claim: 'Keil: the guilt returns upon the doer, according to Genesis 9:6'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/20.htm'
    quote: 'The cursing of parents was a capital crime (see at Leviticus 17:4, and for the plural דּמיו Exodus 22:1 and Genesis 4:10), which was to return upon the doer of it, according to Genesis 9:6.'
  - where: 'note 20:14 “Burnt with fire, and blood upon them”'
    claim: 'Keil: death was by stoning; the burning of verse 14 is burning the corpse after death'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/20.htm'
    quote: 'was to be by stoning, according to Leviticus 20:2, Leviticus 20:27, and Deuteronomy 22:21.; and by the burning (Leviticus 20:14) we are not to understand death by fire, or burning alive, but, as we may clearly see from Joshua 7:15 and Joshua 7:25, burning the corpse after death.'
  - where: 'note 20:14 “Burnt with fire, and blood upon them”'
    claim: 'The text says only "burnt with fire"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/20?lang=eng'
    quote: 'And if a man take a wife and her mother, it is wickedness: they shall be burnt with fire, both he and they'
  - where: 'note 20:20 “Penalties the Lord keeps for Himself”'
    claim: 'Keil: no civil punishment for marriage with an aunt, uncle''s wife, brother''s wife; God reserves the punishment'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/20.htm'
    quote: 'No civil punishment, on the other hand, to be inflicted by the magistrate or by the community generally, was ordered to follow marriage with an aunt'
  - where: 'note 20:20 “Penalties the Lord keeps for Himself”'
    claim: 'Keil: the threat is held out; God would reserve the punishment to Himself'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/20.htm'
    quote: 'In all these cases the threat is simply held out, "they shall bear their iniquity," and (according to Leviticus 20:20, Leviticus 20:21) "die childless;" that is to say, God would reserve the punishment to Himself'
  - where: 'note 20:20 “Penalties the Lord keeps for Himself”'
    claim: 'Burnside: karet is a divine punishment; so are bearing iniquity, dying childless, being childless'
    key: burnside-lev-20
    url: 'https://byustudies.byu.edu/article/exegesis-or-eisegesis-does-chiastic-analysis-help-us-to-understand-leviticus-20'
    quote: 'because karet (cutting off) is a characteristically divine form of punishment.5 Other characteristically divine forms of punishment include bearing iniquity (v. 19), dying childless (v. 20), and being childless (v. 21).'
  - where: 'note 20:20 “Penalties the Lord keeps for Himself”'
    claim: 'Burnside: the aunts of v. 19 are hard cases on the boundary of near kin, with no designated punishment'
    key: burnside-lev-20
    url: 'https://byustudies.byu.edu/article/exegesis-or-eisegesis-does-chiastic-analysis-help-us-to-understand-leviticus-20'
    quote: 'They are also the only cases in the whole of verses 19–21—and the entire chapter—not to have a designated punishment.'
  - where: 'note 20:20 “Penalties the Lord keeps for Himself”'
    claim: 'Burnside: hard cases at the boundary of near kin; behavior not recommended'
    key: burnside-lev-20
    url: 'https://byustudies.byu.edu/article/exegesis-or-eisegesis-does-chiastic-analysis-help-us-to-understand-leviticus-20'
    quote: 'they are hard cases because they are right on the boundary of what constitutes near kin or family in early Israel … Even so, the behavior is not recommended (“they shall bear their iniquity”).'
  - where: 'note 20:20 “Penalties the Lord keeps for Himself”'
    claim: 'Keil: verses 17 and 18 are among the cases punished by death'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/20.htm'
    quote: 'sexual intercourse with a half-sister (Leviticus 20:17, cf. Leviticus 18:9 and Leviticus 18:11), and lying with a menstruous woman (Leviticus 20:18, cf. Leviticus 18:19). The punishment of death, which was to be inflicted in all these cases upon both the criminals'
  - where: 'note 20:26 “Separated to be His”'
    claim: 'The verb in 20:24, 25 (twice) and 26 is badal'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וָ/אַבְדִּ֥ל'
  - where: 'note 20:26 “Separated to be His”'
    claim: 'BDB: separate, set apart, of the LORD setting off Israel from other peoples (20:24, 26) and setting apart beasts as unclean (20:25)'
    key: bdb
    url: 'https://biblehub.com/hebrew/914.htm'
    quote: '2 separate, set apart, followed by מִן, of ׳י, setting off Israel from other peoples Leviticus 20:24 (H) … of setting apart (forbidding) beasts as unclean לָכֶם לְטַמֵּא Leviticus 20:25'
  - where: 'note 20:26 “Separated to be His”'
    claim: 'BDB: make a distinction between clean and unclean, holy and profane (20:25)'
    key: bdb
    url: 'https://biblehub.com/hebrew/914.htm'
    quote: '3 make a distinction between clean and unclean, holy and profane, followed by בֵּיןוּ֗֗֗בֵין Leviticus 20:25 (H)'
  - where: 'note 20:26 “Separated to be His”'
    claim: 'Welch: Israel to be a holy people separated from unclean people and beasts to belong to God'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Instead, they would be a pure and holy people, separated from unclean people and beasts in order to belong to God and be worthy of His presence (verses 25–26).'
  - where: 'note 20:27 “The mediums, first and last”'
    claim: 'Burnside: the repetition of mediums at the end is an inclusio that gives the chapter its chiastic structure'
    key: burnside-lev-20
    url: 'https://byustudies.byu.edu/article/exegesis-or-eisegesis-does-chiastic-analysis-help-us-to-understand-leviticus-20'
    quote: 'Levine is puzzled by the repetition of mediums and wizards at the end of the chapter, but the inclusio gives the chapter its overall chiastic structure'
  - where: 'note 20:27 “The mediums, first and last”'
    claim: 'Burnside: Molech and mediums each punished by both humankind and YHWH'
    key: burnside-lev-20
    url: 'https://byustudies.byu.edu/article/exegesis-or-eisegesis-does-chiastic-analysis-help-us-to-understand-leviticus-20'
    quote: 'Likewise, the second offense (turning to mediums and wizards) is punished by both YHWH (20:6) and humankind (20:27).'
  - where: 'note 20:27 “The mediums, first and last”'
    claim: 'Welch: told twice, the reader is invited to think hard about fidelity'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Being told again, the hearer or reader is invited twice to think hard about what fidelity requires.'
  - where: 'note 20:27 “The mediums, first and last”'
    claim: 'Verse 6 is the one who turns to mediums; verse 27 the one who has a familiar spirit'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/20?lang=eng'
    quote: 'A man also or woman that hath a familiar spirit, or that is a wizard, shall surely be put to death'
  - where: christ
    claim: 'The Church''s footnote at verse 10 points to John 8:5, where the law is put to the Savior'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/20?lang=eng'
    quote: '10c “adulteress”: John 8:5.'
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: explore
    claim: 'The footnote at verse 4 points to Deuteronomy 17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/20?lang=eng'
    quote: '4a “kill”: Deut. 17:5 (2–3, 5).'
