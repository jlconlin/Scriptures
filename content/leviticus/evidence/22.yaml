chapter: 22
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The book places its law in mount Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/27?lang=eng'
    quote: 'These are the commandments, which the LORD commanded Moses for the children of Israel in mount Sinai.'
  - where: 'setting'
    claim: 'Welch: the house of the Lord has house rules; chapters 21–22 ensure the holiness of the priests who serve and of those worthy to partake'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'The house of the Lord also has house rules. … The commandments in Leviticus 21 and 22 ensure the holiness of priests who officiate in setting out the twelve daily loaves of bread, of those who serve the bread of God, and of those who are worthy to partake of it'
  - where: 'setting'
    claim: 'All Israel was called to separation and holiness; the priests to a higher level'
    key: ot-manual-lev-19-27
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-19-27-a-law-of-performances-and-ordinances-part-3-laws-of-mercy-and-righteousness?lang=eng'
    quote: 'all of Israel was called to a special life of separation and holiness, but the priests who served as God’s authorized representatives to the people had to maintain an even higher level of separation and sanctification'
  - where: 'setting'
    claim: 'Bowen: the Holiness Code prepares Israel to become a temple-worthy people'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'can be seen as preparing the Israelites to become a temple-worthy people (i.e., worthy of the temple in their midst and of the land itself as a kind of temple) and to partake of Yahweh’s holiness (Atonement)'
  - where: 'setting'
    claim: 'The thanksgiving rule of 22:29–30 was given first at 7:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'And the flesh of the sacrifice of his peace offerings for thanksgiving shall be eaten the same day that it is offered'
  - where: 'thread'
    claim: 'Keil: the first part has two rules, no unclean priest may eat (2–9) and no one outside a priestly family may eat (10–16)'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/22.htm'
    quote: '(1) that no priest who had become unclean was to touch or eat them (Leviticus 22:2-9), and (2) that no one was to eat them who was not a member of a priestly family (Leviticus 22:10-16).'
  - where: 'setting'
    claim: 'Welch: chapter 21 forbids the priests improper contact with the dead and regulates their marriage'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'priests must avoid any improper contact with dead bodies (21:1–4). … They are not to marry a woman who is not a virgin (21:7, 13)'
  - where: 'setting'
    claim: 'Bowen: priests had to be free of blemishes (21:18–21)'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Like the sacrifices that they offered, priests had to be free of certain physical “blemishes” and impairments (Leviticus 21:18–21).'
  - where: 'setting'
    claim: 'Keil: the layman who eats unawares adds a fifth, as in Lev. 5:16'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/22.htm'
    quote: 'he was to bring it, i.e., an equivalent for it, with the addition of a fifth as a compensation for the priest; like a man who had sinned by unfaithfulness in relation to that which was sanctified (Leviticus 5:16).'
  - where: 'thread'
    claim: 'Keil: to keep away from the holy gifts means not treating them as unconsecrated'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/22.htm'
    quote: 'not to regard or treat them as on a par with unconsecrated things'
  - where: 'thread'
    claim: 'Keil: verses 26–30 give three laws of a similar character'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/22.htm'
    quote: 'In Leviticus 22:26-30 three laws are given of a similar character.'
  - where: 'section 2 plain'
    claim: 'Verse 16 in Hebrew: cause them to bear the iniquity of guilt in eating their holy things'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/22?lang=eng'
    quote: 'HEB And cause them to bear the iniquity of guilt in their eating of their holy things.'
  - where: 'section 3 plain'
    claim: 'Verse 24 describes castrated animals'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+22%3A24&version=ESV'
    quote: 'Any animal that has its testicles bruised or crushed or torn or cut you shall not offer to the Lord; you shall not do it within your land,'

  # ---------- notes ----------
  - where: 'note 22:2 “Holding the holy things apart”'
    claim: 'The verb in 22:2 is nazar (niphal)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וְ/יִנָּֽזְרוּ֙'
  - where: 'note 22:2 “Holding the holy things apart”'
    claim: 'BDB: the niphal at Lev. 22:2 means to hold sacredly aloof from'
    key: bdb
    url: 'https://biblehub.com/hebrew/5144.htm'
    quote: 'hold sacredly aloof from, (מִן) Leviticus 22:2 (H)'
  - where: 'note 22:2 “Holding the holy things apart”'
    claim: 'BDB: the verb means dedicate, consecrate, separate in a religious sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/5144.htm'
    quote: 'verb dedicate, consecrate, (compare WeSkizzen iii. 118), separate, in relig. and ceremonial sense'

  - where: 'note 22:3 ““Cut off from my presence” in the Book of Mormon”'
    claim: 'Welch: the penalty is more than barring from worship; could mean estrangement from the covenant society'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'This is more than a barring from participation in organized worship; since the Lord’s presence symbolically covered the entire nation of Israel, this punishment could even mean estrangement from the larger covenant society.'
  - where: 'note 22:3 ““Cut off from my presence” in the Book of Mormon”'
    claim: 'Welch: Lehi’s couplet, if alluding to Lev. 22:3, moralizes and generalizes it'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'The couplet that Lehi quoted (which appears first in 1 Nephi 2:20–21), if alluding to Leviticus 22:3, takes the Leviticus original and applies it by moralizing and generalizing it.'
  - where: 'note 22:3 ““Cut off from my presence” in the Book of Mormon”'
    claim: 'Welch: Laman and Lemuel were not ritually impure, but their moral impurity endangered the holy things'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Laman and Lemuel may not have been ritually impure, but their moral impurity was enough of a danger to the “holy things”—perhaps Nephi’s prophecies or a righteous society—that they, too, suffered estrangement from the Lord’s presence.'
  - where: 'note 22:3 ““Cut off from my presence” in the Book of Mormon”'
    claim: 'Welch lists Alma 36:30 and Helaman 12:21 with the phrase'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Leviticus 22:3 = Alma 36:30: “shall be cut off from [my/his] presence”'
  - where: 'note 22:3 ““Cut off from my presence” in the Book of Mormon”'
    claim: 'Nephi records the fulfillment: they were cut off from his presence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/5?lang=eng'
    quote: 'And behold, they were cut off from his presence.'

  - where: 'note 22:9 “A condition in “I the LORD do sanctify them””'
    claim: 'Bowen: JST Lev. 22:9 adds a condition, and the blessing of sanctification is conditional on obedience'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'To the phrase “I the Lord do sanctify them” (Leviticus 22:9), JST Leviticus 22:9 adds the condition: “if they profane not mine ordinances, I the Lord will sanctify them.” Here again we see the principle of divine reciprocity'
  - where: 'note 22:9 “A condition in “I the LORD do sanctify them””'
    claim: 'Bowen: the blessing of sanctification is conditional upon obedience'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'the addition emphasizes that the blessing of sanctification is conditional upon obedience—a covenant principle as true then as it is now'
  - where: 'note 22:9 “A condition in “I the LORD do sanctify them””'
    claim: 'Bowen: the purity laws were so the priests might maintain and partake of the LORD’s holiness'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'all of this to the end that the priest and the high priest might maintain and partake of Yahweh’s holiness (Leviticus 21:4, 6, 15, 22; 22:2)'

  - where: 'note 22:9 “A condition in “I the LORD do sanctify them””'
    claim: 'Bowen: of the six JST changes in Leviticus, three are in chapters 21–22'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Of the six verses in Leviticus to which the Prophet Joseph Smith made alterations, three are in the Holiness Code, all three in Leviticus 21–22.'

  - where: 'note 22:10 “Who in a priest''s house could eat the holy food”'
    claim: 'The word for stranger in 22:10 is zar'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'זָ֖ר'
  - where: 'note 22:10 “Who in a priest''s house could eat the holy food”'
    claim: 'BDB: zar in Lev. 22:10–13 is one of another family than the priests’'
    key: bdb
    url: 'https://biblehub.com/hebrew/2114.htm'
    quote: 'especially of another family than priests’ אִישׁ זָר Leviticus 22:12 (H) Numbers 17:5 (P); זָר Leviticus 22:10,13 (H)'

  - where: 'note 22:25 “Three kinds of “stranger””'
    claim: 'Verse 18 has ger'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'הַ/גֵּ֣ר'
  - where: 'note 22:25 “Three kinds of “stranger””'
    claim: 'Verse 25 has ben nekar'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'בֶּן נֵכָ֗ר'
  - where: 'note 22:25 “Three kinds of “stranger””'
    claim: 'BDB: ben nekar is foreigner, Lev. 22:25'
    key: bdb
    url: 'https://biblehub.com/hebrew/5236.htm'
    quote: '2 בֶּןֿ(הַ)נֵּכָר = foreigner Genesis 17:12 ("" לֹא מִזַּרְעֲךָ), Genesis 17:27; Exodus 12:43 (all P), Leviticus 22:25 (H)'

  - where: 'note 22:21 ““Perfect”: whole and sound”'
    claim: 'The same word tamim stands in 22:19 (without blemish) and 22:21 (perfect)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'תָּמִ֤ים'
  - where: 'note 22:21 ““Perfect”: whole and sound”'
    claim: 'BDB: tamim means complete, sound; whole, sound, usually of sacrificial animals'
    key: bdb
    url: 'https://biblehub.com/hebrew/8549.htm'
    quote: '2 whole, sound healthful, of men Proverbs 1:12 ("" חַיִּים); vine Ezekiel 15:5; usually of sacrificial P'
  - where: 'note 22:21 ““Perfect”: whole and sound”'
    claim: 'BDB headword sense complete, sound'
    key: bdb
    url: 'https://biblehub.com/hebrew/8549.htm'
    quote: 'תָּמִים91 adjective complete, sound'
  - where: 'note 22:21 ““Perfect”: whole and sound”'
    claim: 'KnoWhy 335: Noah, Job and Abram are called perfect; even sacrifices were to be perfect (Lev. 22:21)'
    key: sc-knowhy-335
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-be-perfect'
    quote: 'The Old Testament describes both Noah (Genesis 6:9) and Job (Job 1:1), as “perfect” and Abram was commanded to be “perfect” (Genesis 17:1). Even animal sacrifices were expected to be “perfect” (Leviticus 22:21).'
  - where: 'note 22:21 ““Perfect”: whole and sound”'
    claim: 'KnoWhy 335: in the covenantal context perfect is a synonym for faithfulness'
    key: sc-knowhy-335
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-be-perfect'
    quote: 'in the covenantal context ‘perfect’ is a synonym to faithfulness, loyalty, and trustworthiness.'
  - where: 'note 22:21 ““Perfect”: whole and sound”'
    claim: 'KnoWhy 335: the Hebrew word is the equivalent of the word “perfect” in 3 Ne. 12:48'
    key: sc-knowhy-335
    url: 'https://scripturecentral.org/knowhy/what-does-it-mean-to-be-perfect'
    quote: 'The Hebrew equivalent of this word, also translated as “perfect” can sometimes be connected to covenants.'

  - where: 'note 22:24 ““In your land”: no gelding at all”'
    claim: 'The Hebrew of the last clause: and in your land you shall not do'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וּֽ/בְ/אַרְצְ/כֶ֖ם לֹ֥א תַעֲשֽׂוּ'
  - where: 'note 22:24 ““In your land”: no gelding at all”'
    claim: 'A modern translation: testicles bruised, crushed, torn or cut; you shall not do it within your land'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+22%3A24&version=ESV'
    quote: 'Any animal that has its testicles bruised or crushed or torn or cut you shall not offer to the Lord; you shall not do it within your land,'
  - where: 'note 22:24 ““In your land”: no gelding at all”'
    claim: 'Keil: castrated animals not to be sacrificed or kept; the clause means not to castrate; Josephus and the rabbis; sacrifices never prepared outside the land'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/22.htm'
    quote: 'Castrated animals were not to be sacrificed, nor in fact to be kept in the land at all.'
  - where: 'note 22:24 ““In your land”: no gelding at all”'
    claim: 'Keil: this is the explanation of Josephus and the rabbis, required by “in your land”'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/22.htm'
    quote: 'This explanation, which is the one given by Josephus (Ant. iv. 8, 40) and all the Rabbins, is required by the expression "in your land," which does not at all suit the interpretation adopted by Clericus and Knobel'
  - where: 'note 22:24 ““In your land”: no gelding at all”'
    claim: 'Keil: sacrifices were never prepared outside the land; castration mutilates creation, like the mixtures of 19:19'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/22.htm'
    quote: 'for sacrifices were never prepared outside the land. The castration of animals is a mutilation of God''s creation, and the prohibition of it was based upon the same principle as that of mixing heterogeneous things in Leviticus 19:19.'

  - where: 'note 22:28 “A week with its mother, and never on one day with her”'
    claim: 'Keil: the young animal had not attained a mature and self-sustained life in its first week'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/22.htm'
    quote: 'The reason for this was, that the young animal had not attained to a mature and self-sustained life during the first week of its existence.'
  - where: 'note 22:28 “A week with its mother, and never on one day with her”'
    claim: 'Keil: the rule of 22:28 is related to Ex. 23:19 and Deut. 22:6–7, to keep sacred the relation of parent and offspring'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/22.htm'
    quote: 'is related to the law in Exodus 23:19 and Deuteronomy 22:6-7, and was intended to lay it down as a duty on the part of the Israelites to keep sacred the relation which God had established between parent and offspring.'
  - where: 'note 22:28 “A week with its mother, and never on one day with her”'
    claim: 'The footnotes at 22:27–28 point to Ex. 22:30 and Deut. 22:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/22?lang=eng'
    quote: 'Deut. 22:6.'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'Bowen: the unblemished priest, like the unblemished sacrifice, typifies Christ, free of physical and moral blemish'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'Viewing this legislation christologically, the “unblemished” priest, like the “unblemished” sacrifice typifies Christ, who lived free of both physical and moral blemish'
  - where: 'christ'
    claim: 'Welch: an echo of these priestly functions in Jesus’ instructions at Bountiful on the sacrament and the worthiness of those who partake'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'For an echo of these priestly functions, see the instructions Jesus gave at the temple in Bountiful regarding the disciples’ roles in bringing the sacramental emblems, passing the sacrament to the people, and ensuring the worthiness of those who partook of it (3 Nephi 18:1, 4, 28).'
  - where: 'christ'
    claim: 'The footnote at 22:20 points to Heb. 9:14 and 1 Pet. 1:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/22?lang=eng'
    quote: 'Deut. 15:21; 17:1; Heb. 9:14; 1 Pet. 1:19.'
  - where: 'christ'
    claim: 'Heb. 9:14: Christ offered himself without spot to God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'How much more shall the blood of Christ, who through the eternal Spirit offered himself without spot to God, purge your conscience from dead works to serve the living God?'
