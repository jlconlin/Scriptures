chapter: 15
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The tabernacle was set up in the first month of the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And it came to pass in the first month in the second year, on the first day of the month, that the tabernacle was reared up.'
  - where: 'when'
    claim: 'The commandments of Leviticus were given in mount Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/27?lang=eng'
    quote: 'These are the commandments, which the Lord commanded Moses for the children of Israel in mount Sinai.'
  - where: 'setting'
    claim: 'The Bible Dictionary groups 13–15 as laws relating to ceremonial uncleanness'
    key: bd-leviticus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leviticus?lang=eng'
    quote: '(3) Laws relating to ceremonial uncleanness (Lev. 13–15).'
  - where: 'setting'
    claim: 'Uncleanness was ritual, not moral'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'Uncleanness referred to being ceremonially or ritually unclean and should not be taken to mean that the touching of a dead body or the bearing of children was morally evil.'
  - where: 'setting'
    claim: 'Leviticus 16 makes atonement for the holy place because of Israel’s uncleanness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'And he shall make an atonement for the holy place, because of the uncleanness of the children of Israel, and because of their transgressions in all their sins'
  - where: 'setting'
    claim: 'Numbers 5 banishes those with a discharge with the leper (the scholar ties it to 15:31)'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'Those afflicted with pelvic discharges also need purification “lest they die through their impurity by contaminating My Tabernacle which is among them” (Leviticus 15:31). The two latter offenders are banished with the leper'
  - where: 'thread'
    claim: 'Discharges make a person and those who touch them unclean until immersion; irregular ones last longer'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Discharges by both men and women render them and those who come into contact with them unclean until they have ritually immersed. Irregular discharges render one unclean for an extended period.'
  - where: 'thread'
    claim: 'The chapter’s reason is the tabernacle among them (15:31)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/15?lang=eng'
    quote: 'Thus shall ye separate the children of Israel from their uncleanness; that they die not in their uncleanness, when they defile my tabernacle that is among them.'
  - where: 'section 1 plain'
    claim: 'The man’s discharge is from his genitals (a modern translation: “member”)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus%2015&version=NRSVUE'
    quote: 'When any man has a discharge from his member, his discharge makes him unclean.'

  # ---------- notes ----------
  - where: 'note 15:2 “The man''s discharge”'
    claim: 'A modern translation renders verses 2–3 “discharge from his member”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus%2015&version=NRSVUE'
    quote: 'When any man has a discharge from his member, his discharge makes him unclean.(A) 3 The uncleanness of his discharge is this: whether his member flows with its discharge or is stopped from discharging'
  - where: 'note 15:2 “The man''s discharge”'
    claim: 'Irregular seminal or menstrual discharges require seven days after recovery and a sacrifice'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Those with an irregular seminal or menstrual discharge must wait seven days from the return to normal bodily function and offer a sacrifice before returning to ritual cleanliness.'
  - where: 'note 15:12 “Why the clay pot is broken”'
    claim: 'One older reading: earthen vessels absorb uncleanness that washing cannot remove'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/11.htm'
    quote: 'was to be broken, i.e., destroyed, because the uncleanness as absorbed by the vessel, and could not be entirely removed by washing'
  - where: 'note 15:12 “Why the clay pot is broken”'
    claim: 'At 6:28 a bronze (copper) pot is scoured, an earthen one absorbs and is broken'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/6.htm'
    quote: 'copper vessels by a thorough cleansing; but not so with earthen vessels, which absorb the fat'
  - where: 'note 15:12 “Why the clay pot is broken”'
    claim: 'The same commentary refers 15:12 to the reasons given at 11:33 and 6:21 (KJV 6:28)'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/15.htm'
    quote: 'Vessels that he had touched were to be broken to pieces if they were of earthenware, and rinsed with water if they were of wood, for the reasons explained in Leviticus 11:33 and Leviticus 6:21.'
  - where: 'note 15:12 “Why the clay pot is broken”'
    claim: 'At 6:28 the pot was broken so holy flesh would not be desecrated; defiled pots broken for the opposite reason'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/6.htm'
    quote: 'lest any of the most holy flesh should adhere to the vessel, and be desecrated by its being used in the preparation of common food … earthen vessels that had been defiled were also ordered to be broken to pieces, though for the very opposite reason'
  - where: 'note 15:12 “Why the clay pot is broken”'
    claim: 'Leviticus 11:33: an earthen vessel an unclean creature falls into is broken'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/11?lang=eng'
    quote: 'And every earthen vessel, whereinto any of them falleth, whatsoever is in it shall be unclean; and ye shall break it.'
  - where: 'note 15:15 “An offering after an illness”'
    claim: 'Ordinary uncleanness needed only seclusion till evening and washing; certain cases needed a sin offering'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'In ordinary cases of uncleanness it was sufficient to remain in seclusion till the evening and then to wash the body. In certain cases a sin offering was necessary.'
  - where: 'note 15:15 “An offering after an illness”'
    claim: 'Leviticus 5:7 gives the same pair of birds, one for a sin offering, one for a burnt offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/5?lang=eng'
    quote: 'two turtledoves, or two young pigeons'
  - where: 'note 15:18 “Unclean, not sinful”'
    claim: 'Uncleanness was ceremonial, not moral evil'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'Uncleanness referred to being ceremonially or ritually unclean and should not be taken to mean that the touching of a dead body or the bearing of children was morally evil.'
  - where: 'note 15:18 “Unclean, not sinful”'
    claim: 'One older reading: it was not intercourse as such that defiled, but the emission of seed'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/15.htm'
    quote: 'Consequently it was not the concubitus as such which defiled, as many erroneously suppose, but the emission of seed in the coitus.'
  - where: 'note 15:18 “Unclean, not sinful”'
    claim: 'Another older reading: as unclean they could not take part in the sanctuary service; Ex. 19:15 and 1 Sam. 21 are similar'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/15.htm'
    quote: '18. As unclean they could not take part in the service of the sanctuary. Similar limitations are found Exodus 19:15; 1 Samuel 21:5 f.'
  - where: 'note 15:24 ““Flowers” and “put apart””'
    claim: 'Webster 1828 gives “menstrual discharges” as a sense of “flower”'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/flower'
    quote: '3. Menstrual discharges.'
  - where: 'note 15:24 ““Flowers” and “put apart””'
    claim: 'BDB: niddah, ceremonial impurity, especially of menstruation, at Lev. 15:19, 20, 24, 25, 26, 33'
    key: bdb
    url: 'https://biblehub.com/hebrew/5079.htm'
    quote: '1 of ceremonial impurity, as union with brother''s wife, Leviticus 20:21; especially of menstruation'
  - where: 'note 15:24 ““Flowers” and “put apart””'
    claim: 'Lev. 15:19 Hebrew: seven days she shall be in her niddah (shivʿat yamim tihyeh be-niddatah)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'בְ/נִדָּתָ֔/הּ'
  - where: 'note 15:24 ““Flowers” and “put apart””'
    claim: 'BDB lists the chapter’s occurrences'
    key: bdb
    url: 'https://biblehub.com/hebrew/5079.htm'
    quote: 'Leviticus 15:19,20,24,25'
  - where: 'note 15:24 ““Flowers” and “put apart””'
    claim: 'The King James renders niddah “flowers,” “put apart,” “separation” and other ways'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/5079.htm'
    quote: 'X far, filthiness, X flowers, menstruous (woman), put apart, X removed (woman), separation, set apart, unclean(-ness, thing, with filthiness).'
  - where: 'note 15:31 “Why uncleanness was dangerous”'
    claim: 'The tabernacle was built that the Lord might dwell among them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/25?lang=eng'
    quote: 'And let them make me a sanctuary; that I may dwell among them.'
  - where: 'note 15:31 “Why uncleanness was dangerous”'
    claim: 'One scholar: 15:31 rests on the axiom that impurity assaults the sacred even from afar'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'it is patently clear that these texts are grounded in the axiom, common to all ancient Near Eastern cultures, that impurity is the implacable foe of holiness wherever it exists; it assaults the sacred realm even from afar.'
  - where: 'note 15:31 “Why uncleanness was dangerous”'
    claim: 'No demonic impurity in Israel; man alone can contaminate the sanctuary'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'In Israel, however, there are no traces of demonic impurity.'
  - where: 'note 15:31 “Why uncleanness was dangerous”'
    claim: 'Man alone can contaminate the sanctuary and force God out'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'He alone can contaminate the sanctuary and force God out.'
  - where: 'note 15:31 “Why uncleanness was dangerous”'
    claim: 'Man can evict God, but only to destroy himself'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'Man can evict God from His earthly abode, but only to destroy himself.'
  - where: 'note 15:31 “Why uncleanness was dangerous”'
    claim: 'The sanctuary must be purged of Israel’s impurities on the Day of Atonement though they had no access'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'Yet despite the fact that Israelites have had no access, the sancta must be purged “of the impurities of the Israelites” (Leviticus 16:16).'

  # ---------- christ / explore ----------
  - where: 'christ'
    claim: 'Mark: the woman had an issue of blood twelve years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/5?lang=eng'
    quote: 'And a certain woman, which had an issue of blood twelve years,'
  - where: 'christ'
    claim: 'Mark: the fountain of her blood was dried up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/5?lang=eng'
    quote: 'And straightway the fountain of her blood was dried up; and she felt in her body that she was healed of that plague.'
  - where: 'christ'
    claim: 'Mark: virtue had gone out of him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/5?lang=eng'
    quote: 'And Jesus, immediately knowing in himself that virtue had gone out of him, turned him about in the press, and said, Who touched my clothes?'
  - where: 'christ'
    claim: 'Mark: Daughter, thy faith hath made thee whole'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/5?lang=eng'
    quote: 'And he said unto her, Daughter, thy faith hath made thee whole; go in peace, and be whole of thy plague.'
  - where: 'christ'
    claim: 'The Church’s footnote at 15:25 points to Matt. 9:20 and Luke 8:43'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/15?lang=eng'
    quote: 'Matt. 9:20; Luke 8:43.'
  - where: 'explore'
    claim: 'These regulations were fulfilled by the Atonement; Mark 7:15–23 and Acts 10:9–16 cited'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'being fulfilled by the Atonement of Jesus Christ, they are no longer required of the believers. See Mark 7:15–23; Acts 10:9–16, 28'
  - where: 'explore'
    claim: 'Deut. 23:10 has a similar precept'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/15.htm'
    quote: '16. A similar precept is found in Deuteronomy 23:10.'
  - where: 'note 15:18 “Unclean, not sinful”'
    claim: '1 Sam. 21:5: David’s men had kept from women and could eat the holy bread'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/21?lang=eng'
    quote: 'Of a truth women have been kept from us about these three days, since I came out, and the vessels of the young men are holy'
