chapter: 23
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The chapter’s laws were given at Sinai (the book’s close)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/27?lang=eng'
    quote: 'These are the commandments, which the LORD commanded Moses for the children of Israel in mount Sinai.'
  - where: 'setting'
    claim: 'One older reading: the chapter is not a calendar of feasts but a list of the days at which holy meetings were held'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/23.htm'
    quote: 'This chapter does not contain a "calendar of feasts," or a summary and completion of the directions previously given in a scattered form concerning the festal times of Israel, but simply a list of those festal days and periods of the year at which holy meetings were to be held.'
  - where: 'setting'
    claim: 'The offerings for each day are set out in Numbers 28–29'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/23.htm'
    quote: 'for seven days with sacrifices, as appointed for every day in Numbers 29:13-33'
  - where: 'setting'
    claim: 'Three of the days were the pilgrim feasts, when every man appeared before the Lord (Ex. 23:14–17)'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The law commanded that three times a year all the males of the covenant people were to appear before the Lord in the place that He should choose; that is, in the Feast of Unleavened Bread, in the Feast of Weeks, and in the Feast of Tabernacles (Ex. 23:14–17'
  - where: 'setting'
    claim: 'Welch: the calendar connects temple times with celestial cycles'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'This calendric material connects the temporal terrestrial times of temple performances with the eternal celestial cycles, that all may be done on earth as it is in the heavens.'
  - where: 'thread'
    claim: 'One older reading: the seventh month was a sabbatical month, as the seventh day of the week'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/23.htm'
    quote: 'The seventh month of the year, like the seventh day of the week, was consecrated as a Sabbath or sabbatical month'
  - where: 'thread'
    claim: 'The gleaning law of 19:9–10 is repeated at 23:22'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/23.htm'
    quote: 'Probably inserted here from Leviticus 19:9 (also H), with which it is verbally identical.'
  - where: 'thread'
    claim: 'The chapter’s text: sabbath first, the sevens, the refrains, the harvest, the reason for the booths'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/23?lang=eng'
    quote: 'That your generations may know that I made the children of Israel to dwell in booths, when I brought them out of the land of Egypt: I am the LORD your God.'

  # ---------- note 23:2 ----------
  - where: 'note 23:2 “Appointed times and holy convocations”'
    claim: 'The word for “feasts” in 23:2 is moʿed (H4150)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'מוֹעֲדֵ֣י'
  - where: 'note 23:2 “Appointed times and holy convocations”'
    claim: 'moʿed: appointed time, place, meeting; sacred season, wider than ḥag, a pilgrimage feast'
    key: bdb
    url: 'https://biblehub.com/hebrew/4150.htm'
    quote: 'appointed time, place, meeting … sacred season, RV usually set feast or appointed season (wider than חַג, which was only a feast celebrated by a pilgrimage)'
  - where: 'note 23:2 “Appointed times and holy convocations”'
    claim: 'The word in “the feast of unleavened bread” (23:6) and “the feast of tabernacles” (23:34) is ḥag (H2282)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'חַ֥ג'
  - where: 'note 23:2 “Appointed times and holy convocations”'
    claim: 'miqra qodesh: technical term for religious gathering on sabbath and sacred days; convocation, convoking'
    key: bdb
    url: 'https://biblehub.com/hebrew/4744.htm'
    quote: 'convocation; convoking, reading … usually explicitly קֹדֶשׁ ׳מ, technical term in P for religious gathering on Sabbath and certain sacred days'
  - where: 'note 23:2 “Appointed times and holy convocations”'
    claim: 'The phrase in 23:2 is miqraʾe qodesh (H4744, H6944)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'מִקְרָאֵ֣י'

  # ---------- note 23:7 ----------
  - where: 'note 23:7 “No servile work, and no work at all”'
    claim: 'The phrase is rendered “ye shall do no laborious work,” listed under the sense “labour, work”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5656.htm'
    quote: '1 labour, work, Psalm 104:23; in the field Exodus 1:14 … כל מלאכת עבדה לא תעשׂוּ ye shall do no laborious work Leviticus 23:7,8,21,25,35,36'
  - where: 'note 23:7 “No servile work, and no work at all”'
    claim: 'The separate sense of ʿavodah is the labour of a servant or slave'
    key: bdb
    url: 'https://biblehub.com/hebrew/5656.htm'
    quote: '2 labour of servant or slave: of Jacob for Laban Genesis 29:27'
  - where: 'note 23:7 “No servile work, and no work at all”'
    claim: 'The Hebrew of 23:7: kol meleʾkhet ʿavodah lo taʿasu'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'עֲבֹדָ֖ה'
  - where: 'note 23:7 “No servile work, and no work at all”'
    claim: 'The sabbath and Day of Atonement forbid all work; the other days servile work'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/23?lang=eng'
    quote: 'Ye shall do no manner of work: it shall be a statute for ever throughout your generations in all your dwellings.'

  # ---------- note 23:11 ----------
  - where: 'note 23:11 “The first sheaf, and which sabbath”'
    claim: 'The sheaf of the barley harvest was waved on the morrow after the sabbath, probably 16 Abib'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'On the morrow after the Sabbath (probably 16th Abib) a sheaf of the firstfruits of the harvest (barley) was waved before the Lord (Lev. 23:10–14).'
  - where: 'note 23:11 “The first sheaf, and which sabbath”'
    claim: 'Keil: the morrow after the first day of unleavened bread, the 16th, not the weekly sabbath in the feast'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/23.htm'
    quote: '(the morrow after the Sabbath) signifies the next day after the first day of the feast of Mazzoth, i.e., the 16th Abib (Nisan), not the day of the Sabbath which fell in the seven days'' feast of Mazzoth'
  - where: 'note 23:11 “The first sheaf, and which sabbath”'
    claim: 'Keil: the first day of unleavened bread is called sabbath whatever the weekday'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/23.htm'
    quote: 'the first day of the feast of Mazzoth is called "Sabbath," irrespectively of the day of the week upon which it fell'
  - where: 'note 23:11 “The first sheaf, and which sabbath”'
    claim: 'Cambridge (reporting Driver): the traditional reading is an unusual sense of sabbath; probably the weekly sabbath'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/23.htm'
    quote: 'but this is an unusual sense of ‘sabbath.’ He considers it probable that in its original connexion the ‘sabbath’ meant here was the ordinary weekly sabbath which fell during the seven days of Maẓẓoth.'
  - where: 'note 23:11 “The first sheaf, and which sabbath”'
    claim: 'Keil: by the sheaf Israel consecrated its daily bread and acknowledged the harvest as God’s grace'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/23.htm'
    quote: 'By offering the sheaf of first-fruits of the harvest, the Israelites were to consecrate their daily bread to the Lord their God, and practically to acknowledge that they owed the blessing of the harvest to the grace of God.'
  - where: 'note 23:11 “The first sheaf, and which sabbath”'
    claim: 'Keil: the sheaf was waved, not burned, and given to the priests'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/23.htm'
    quote: 'But as the sheaf was not burned upon the altar, but only presented symbolically to the Lord by waving, and then handed over to the priests'
  - where: 'note 23:11 “The first sheaf, and which sabbath”'
    claim: 'The count to Pentecost begins from the day of the sheaf; no new grain eaten before it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/23?lang=eng'
    quote: 'And ye shall count unto you from the morrow after the sabbath, from the day that ye brought the sheaf of the wave offering; seven sabbaths shall be complete'

  # ---------- note 23:16 ----------
  - where: 'note 23:16 “Fifty days to Pentecost”'
    claim: 'Pentecost is the Greek name and means fiftieth'
    key: lund-types-symbols
    url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
    quote: 'Christians are more familiar with this feast by its Greek title, Pentecost, which means “fiftieth.”'
  - where: 'note 23:16 “Fifty days to Pentecost”'
    claim: 'Called the feast of harvest and the feast of weeks; one day; the rite was two leavened loaves of new wheat'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'It is called (Ex. 23:16) “the feast of harvest, the firstfruits of thy labours” and (Deut. 16:10) “the feast of weeks.” The feast lasted a single day'
  - where: 'note 23:16 “Fifty days to Pentecost”'
    claim: 'The characteristic rite: two loaves of leavened bread of new wheat'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'the characteristic rite was the new meal offering; that is, two loaves of leavened bread made of fine flour of new wheat.'
  - where: 'note 23:16 “Fifty days to Pentecost”'
    claim: 'No Old Testament record of its celebration; later huge crowds, as Acts 2 shows'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The festival was prolonged in later times, and huge numbers of Jews attended it. Of this the narrative in Acts 2 is sufficient proof. … We have no record of the celebration of this feast in the Old Testament.'
  - where: 'note 23:16 “Fifty days to Pentecost”'
    claim: 'Elder McConkie (as Lund prints him): the Lord chose that day to send living fire from heaven'
    key: lund-types-symbols
    url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
    quote: 'How fitting it was instead for the Lord to choose that very day to send living fire from heaven, as it were, fire that would dwell in the hearts of men and replace forever all the fires on all the altars of the past.'
  - where: 'note 23:16 “Fifty days to Pentecost”'
    claim: 'The loaves and lambs go to the priest (23:20); Acts 2:1–4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/23?lang=eng'
    quote: 'they shall be holy to the LORD for the priest.'

  # ---------- note 23:24 ----------
  - where: 'note 23:24 “The day of the trumpet blast”'
    claim: 'teruʿah: shout or blast of war, alarm, or joy; zikhron teruʿah at Lev. 23:24'
    key: bdb
    url: 'https://biblehub.com/hebrew/8643.htm'
    quote: 'noun feminine shout or blast of war, alarm, or joy … 1st of month ׳זִכְרוֺן ת Leviticus 23:24'
  - where: 'note 23:24 “The day of the trumpet blast”'
    claim: 'The Hebrew of 23:24: zikhron (H2146) teruʿah (H8643)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'זִכְר֥וֹן'
  - where: 'note 23:24 “The day of the trumpet blast”'
    claim: 'Keil: the blast called the congregation into remembrance before Jehovah, for His favour'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/23.htm'
    quote: 'a blast of trumpets to be appointed for a memorial before Jehovah (Numbers 10:10), i.e., to call the congregation into remembrance before Jehovah, that He might turn towards it His favour and grace'
  - where: 'note 23:24 “The day of the trumpet blast”'
    claim: 'The day is known as Rosh Hashanah'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'the festivals of first fruits and Pentecost, of Rosh Hashanah, of the Day of Atonement, and of the Feast of Tabernacles'
  - where: 'note 23:24 “The day of the trumpet blast”'
    claim: 'Read: Moroni gave the plates on the Feast of Trumpets, 22 September 1827; unlikely to be accidental'
    key: read-trumpets
    url: 'https://www.churchofjesuschrist.org/study/ensign/2000/01/the-golden-plates-and-the-feast-of-trumpets?lang=eng'
    quote: 'on 22 September 1827, the very day Israel celebrated the Feast of Trumpets, Moroni gave the golden plates to the Prophet Joseph Smith. Since this feast was ripe with meaning for the theme of the regathering of Israel, it is unlikely this timing was accidental.'

  # ---------- note 23:27 ----------
  - where: 'note 23:27 “The people''s side of the Day of Atonement”'
    claim: 'The chapter’s text on the day: its name, purpose, penalties, and hours'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/23?lang=eng'
    quote: 'For whatsoever soul it be that shall not be afflicted in that same day, he shall be cut off from among his people.'
  - where: 'note 23:27 “The people''s side of the Day of Atonement”'
    claim: 'The Day of Atonement was kept as a fast'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'The Day of Atonement appears to be the only fast ordered by the law.'

  # ---------- note 23:36 ----------
  - where: 'note 23:36 “The eighth day, the great day of the feast”'
    claim: 'ʿatsereth: sacred assembly, used of the day after the feast of booths'
    key: bdb
    url: 'https://biblehub.com/hebrew/6116.htm'
    quote: '1 sacred assembly … Leviticus 23:36 (P), Numbers 29:35 (P), Nehemiah 8:18 (all of day after feast of booths)'
  - where: 'note 23:36 “The eighth day, the great day of the feast”'
    claim: 'The word in 23:36 is ʿatsereth (H6116)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'עֲצֶ֣רֶת'
  - where: 'note 23:36 “The eighth day, the great day of the feast”'
    claim: 'The eighth day ended the whole festival season; John calls it that great day of the feast'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'To the seven days was added an eighth, “the last day, that great day of the feast” (John 7:37), a day of holy convocation, which marked the ending not only of this particular feast, but of the whole festival season.'
  - where: 'note 23:36 “The eighth day, the great day of the feast”'
    claim: 'Later ceremonies: water from Siloam, illumination of the courts; Jesus probably refers to them in John 7:37 and 8:12'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: '(1) the drawing of water from Siloam and its libation on the altar … (2) the illumination of the temple courts by four golden candelabra. It is probably to these ceremonies that our Lord refers in John 7:37 and 8:12.'
  - where: 'note 23:36 “The eighth day, the great day of the feast”'
    claim: 'Gardner: Jesus waited for the great day, with no water-pouring, to declare Himself the living water'
    key: gardner-tabernacles
    url: 'https://rsc.byu.edu/learn-me/jesus-christ-feast-tabernacles'
    quote: 'The Savior waited until the “great day of the feast,” on which there was no water-pouring ceremony, to publicly declare that he was the source of “living water.”'
  - where: 'note 23:36 “The eighth day, the great day of the feast”'
    claim: 'John 7:37–38; 8:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/7?lang=eng'
    quote: 'In the last day, that great day of the feast, Jesus stood and cried, saying, If any man thirst, let him come unto me, and drink.'

  # ---------- note 23:40 ----------
  - where: 'note 23:40 “The feast of joy, and its restoration”'
    claim: 'Later Jews counted Tabernacles the greatest and most joyful feast'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'called by later Jews the Feast (John 7:37) and reckoned by them to be the greatest and most joyful of all'
  - where: 'note 23:40 “The feast of joy, and its restoration”'
    claim: 'Elder McConkie (as Lund prints him): the one Mosaic feast to be restored'
    key: lund-types-symbols
    url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
    quote: 'Elder McConkie points out that this will be the only Mosaic feast reinstituted in this gospel dispensation'
  - where: 'note 23:40 “The feast of joy, and its restoration”'
    claim: 'McConkie: restored when Jehovah reigns; the Hosanna Shout in solemn assemblies is one of its rituals'
    key: lund-types-symbols
    url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
    quote: 'the one Mosaic celebration which, as part of the restitution of all things, shall be restored when Jehovah comes to reign personally upon the earth for a thousand years. Even now we perform one of its chief rituals in our solemn assemblies, the giving of the Hosanna Shout'
  - where: 'note 23:40 “The feast of joy, and its restoration”'
    claim: 'McConkie: the harvest symbolizes Israel’s mission to gather the nations'
    key: lund-types-symbols
    url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
    quote: 'The fact that it celebrated the completion of the full harvest symbolizes the gospel reality that it is the mission of the house of Israel to gather all nations to Jehovah'

  # ---------- note 23:43 ----------
  - where: 'note 23:43 “Why Israel lived in booths”'
    claim: 'Keil: a sukkah is a booth or hut, not a tent'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/23.htm'
    quote: 'a booth or hut, is not to be confounded with אחל a tent'
  - where: 'note 23:43 “Why Israel lived in booths”'
    claim: 'Keil: the booths recalled God’s care, not privation'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/23.htm'
    quote: 'for the recollection of privation and want can never be an occasion of joy; but it was to place vividly before the eyes of the future generations of Israel a memorial of the grace, care, and protection which God afforded to His people in the great and terrible wilderness'
  - where: 'note 23:43 “Why Israel lived in booths”'
    claim: 'The booths were made of boughs; the rite was neglected from Joshua to Ezra; kept again in Nehemiah’s day'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The characteristic rite of the Feast of Tabernacles was the dwelling in booths made of the boughs of trees. This rite seems to have been neglected from the time of Joshua to the time of Ezra (Neh. 8:17).'
  - where: 'note 23:43 “Why Israel lived in booths”'
    claim: 'Latter-day Saint scholars argue King Benjamin’s gathering resembles the Feast of Tabernacles'
    key: sc-knowhy-80
    url: 'https://scripturecentral.org/knowhy/why-did-the-nephites-stay-in-their-tents-during-king-benjamins-speech'
    quote: 'LDS scholars have argued that this gathering at the temple to hear a speech was no ordinary occasion, but that the account in Mosiah 2–6 closely resembles what we know about ancient Israelite temple pilgrimage festivals, especially the Feast of Tabernacles.'
  - where: 'note 23:43 “Why Israel lived in booths”'
    claim: 'Everyone had a tent, not only travelers'
    key: sc-knowhy-80
    url: 'https://scripturecentral.org/knowhy/why-did-the-nephites-stay-in-their-tents-during-king-benjamins-speech'
    quote: 'Everyone had a tent, not just those who had come from out of town and needed a place to stay.'
  - where: 'note 23:43 “Why Israel lived in booths”'
    claim: 'Szink and Welch (as quoted): the tents may have recalled Lehi’s tent'
    key: sc-knowhy-80
    url: 'https://scripturecentral.org/knowhy/why-did-the-nephites-stay-in-their-tents-during-king-benjamins-speech'
    quote: 'To the Nephites, their festival use of tents may also have symbolized the time when Lehi and his family had ‘dwelt in a tent’ (1 Nephi 10:16)'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'Firstfruits is the law’s term for the first of the harvest offered to God (incl. Lev. 23:10); 1 Cor. 15:20 uses it of Christ as the first resurrected'
    key: belnap-plainness
    url: 'https://rsc.byu.edu/jacob/words-plainness'
    quote: 'The term itself is biblical, found first in the legal codes of the Old Testament concerning the first items of a given harvest which were to be offered up to God (see Exodus 23:16; 34:26; Leviticus 2:12, 14; 23:10; Numbers 18:12).'
  - where: 'christ'
    claim: '1 Cor. 15:20 alludes to Christ as the first resurrected being'
    key: belnap-plainness
    url: 'https://rsc.byu.edu/jacob/words-plainness'
    quote: 'First Corinthians 15:20 includes a description of Christ as the “firstfruits of them that slept,” alluding to Christ as the first resurrected being.'
  - where: 'christ'
    claim: '1 Cor. 5:7; 15:20; Acts 2:1–4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/15?lang=eng'
    quote: 'But now is Christ risen from the dead, and become the firstfruits of them that slept.'
