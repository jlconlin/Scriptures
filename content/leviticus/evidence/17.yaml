chapter: 17
claims:
  - where: setting
    claim: 'Scholars have called Leviticus 17–26 the Holiness Code since 1877'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'the second large law code in the Pentateuch is the Holiness Code, so called by biblical scholars since 1877, when A. Klostermann identified Leviticus 17–26 as a distinct unit within the Pentateuch'
  - where: setting
    claim: 'Forms of the word for holy occur more than twice as often in these ten chapters as in the rest of Leviticus'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'cognate forms of qdš “occur more than twice as many times in the ten chapters of the Holiness Code as in the other seventeen chapters of the book of Leviticus.”'
  - where: setting
    claim: 'The Holiness Code and the Priestly Code are closely related'
    key: shannon-documentary
    url: 'https://rsc.byu.edu/they-shall-grow-together/documentary-hypothesis-book-mormon'
    quote: 'The Holiness Code and the Priestly Code are closely related and deal with interests that seem to derive from the issues of the ancient priestly class.'
  - where: setting
    claim: 'Many scholars date the related priestly source to the sixth or fifth century BC'
    key: pierce-ger
    url: 'https://rsc.byu.edu/covenant-compassion/ger-pentateuch-book-mormon'
    quote: 'The gēr laws in the Holiness Code (Leviticus 17–26) and in Numbers are integrally related to the controversial P source, which many scholars date to the sixth or fifth centuries BC'
  - where: setting
    claim: 'A Latter-day Saint reading: the code prepares Israel to become a temple-worthy people'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'the Holiness Code’s (Leviticus 17–26) framing of Yahweh’s commandments to Moses in terms of holiness, ritual purity, and priestly instruction can be seen as preparing the Israelites to become a temple-worthy people'
  - where: setting
    claim: 'The code is framed as instruction to Aaron and his sons, priestly instruction to Israel (17:1–2)'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'the Holiness Code is framed as instruction to Aaron and his sons—that is, as priestly instruction (tôrâ) to the Israelites'
  - where: setting
    claim: 'One reading: the book follows the high priest''s steps through the tabernacle'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'the overall structure of Leviticus follows the steps of the high priest as he enters the Court of the Altar and then moves, step by step, into the presence of God in the Holy of Holies'
  - where: setting
    claim: 'In that reading the sacrifices of Leviticus 1–17 belong to the court of the altar'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'The experience begins in the outer Court of the Altar. There the sacrifices and purifications mentioned in Leviticus 1–17 were conducted.'

  - where: thread
    claim: 'The chapter falls into four precepts, 3–7, 8–9, 10–12, 13–16'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/17.htm'
    quote: 'The four precepts are (1) Leviticus 17:3-7; (2) Leviticus 17:8-9; (3) Leviticus 17:10-12; (4) Leviticus 17:13-16.'
  - where: thread
    claim: 'Verses 15–16 follow from 10–14, since such meat still had blood in it, and the penalty differs'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/17.htm'
    quote: 'Leviticus 17:15-16 may be considered as an obvious deduction from Leviticus 17:10-14; both kinds of meat would contain some part of the blood. … the penalty announced ‘he shall bear his iniquity’ is not the same.'
  - where: thread
    claim: 'The first part of the Holiness Code emphasizes the sanctifying character of blood'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The first part of the Holiness Code emphasizes the sanctifying character of blood (compare Moses 6:60).'
  - where: thread
    claim: 'The first law (3–7) names only Israelites in the Hebrew; the Septuagint adds the stranger; 8–9 apply to the stranger'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/17.htm'
    quote: 'The prohibition here affects the Israelites only (in the LXX. the stranger is included), whereas the command of Leviticus 17:8-9, that all sacrifices shall be brought to the tent of meeting applies to the stranger also.'

  - where: 'note 17:3 “Every ox, lamb or goat brought to the altar”'
    claim: 'The verb here means ordinary killing for food'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/17.htm'
    quote: 'the verb, though used of sacrificial slaughter (Leviticus 1:5, Leviticus 9:8, etc.), also has the sense of ordinary killing for food. This is its meaning here.'
  - where: 'note 17:3 “Every ox, lamb or goat brought to the altar”'
    claim: 'The animals named are those suitable for sacrifice'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/17.htm'
    quote: 'The animals mentioned are those which are suitable for sacrifice'
  - where: 'note 17:3 “Every ox, lamb or goat brought to the altar”'
    claim: 'A modern translation of 17:4: “he shall be held guilty of bloodshed”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+17&version=NRSVUE'
    quote: 'he shall be held guilty of bloodshed; he has shed blood, and he shall be cut off from the people.'
  - where: 'note 17:3 “Every ox, lamb or goat brought to the altar”'
    claim: 'One older reading: such slaughter was reckoned as bloodshed, blood-guiltiness'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/17.htm'
    quote: 'such slaughtering was to be reckoned as the shedding of blood, or blood-guiltiness, and punished with extermination'
  - where: 'note 17:3 “Every ox, lamb or goat brought to the altar”'
    claim: 'No distinction is made between slaughter for sacrifice and for food'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/17.htm'
    quote: 'No distinction is made between slaughtering for sacrifice and for food.'
  - where: 'note 17:3 “Every ox, lamb or goat brought to the altar”'
    claim: 'One older reading: “statute for ever” is the principle of sacrifice to the Lord alone, not the rule of slaughter, repealed for Canaan'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/17.htm'
    quote: 'The expression "a statute for ever" refers to the principle of the law, that sacrifices were to be offered to Jehovah alone, and not to the law that every animal was to be slain before the tabernacle, which was afterwards repealed by Moses, when they were about to enter Canaan, where it could no longer be carried out'
  - where: 'note 17:3 “Every ox, lamb or goat brought to the altar”'
    claim: 'Deuteronomy 12 permits killing at home when the place is too far, with the blood poured out'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/12?lang=eng'
    quote: 'If the place which the LORD thy God hath chosen to put his name there be too far from thee, then thou shalt kill of thy herd and of thy flock'

  - where: 'note 17:7 “Goat-demons”'
    claim: 'The Hebrew word se‘irim is the word for he-goats'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'לַ/שְּׂעִירִ֕ם'
  - where: 'note 17:7 “Goat-demons”'
    claim: 'The word means a he-goat; the KJV renders it also devil, satyr'
    key: bdb
    url: 'https://biblehub.com/hebrew/8163.htm'
    quote: 'KJV: devil, goat, hairy, kid, rough, satyr'
  - where: 'note 17:7 “Goat-demons”'
    claim: 'BDB: satyr, demon with a he-goat''s form; a name for idols at 2 Chr. 11:15 and Lev. 17:7'
    key: bdb
    url: 'https://biblehub.com/hebrew/8163.htm'
    quote: 'satyr, demon (with he-goat''s form, or feet'
  - where: 'note 17:7 “Goat-demons”'
    claim: 'BDB: a name for idols at 2 Chr. 11:15 and Lev. 17:7; inhabiting ruins in Isaiah'
    key: bdb
    url: 'https://biblehub.com/hebrew/8163.htm'
    quote: 'inhabiting desolate ruins, so plural שְׂעִירִים Isaiah 13:21; name for idols 2Chronicles 11:15'
  - where: 'note 17:7 “Goat-demons”'
    claim: 'A modern translation: “goat-demons, to whom they prostitute themselves”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+17&version=NRSVUE'
    quote: 'so that they may no longer offer their sacrifices for goat-demons, to whom they prostitute themselves.'
  - where: 'note 17:7 “Goat-demons”'
    claim: '“Gone a whoring” continues the figure of Jehovah as Israel''s husband; idolatry is unfaithfulness'
    key: ot-manual-lev-11-18
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-11-18-a-law-of-performances-and-ordinances-part-2-the-clean-and-the-unclean?lang=eng'
    quote: 'The concept that Israel went “a whoring” after false gods is a common one in the scriptures and continues the metaphor that Jehovah was the husband to whom Israel was married.'
  - where: 'note 17:7 “Goat-demons”'
    claim: 'Idolatry depicted as spiritual adultery'
    key: ot-manual-lev-11-18
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-11-18-a-law-of-performances-and-ordinances-part-2-the-clean-and-the-unclean?lang=eng'
    quote: 'So, in the scriptures, idolatry was often depicted as spiritual adultery.'

  - where: 'note 17:11 “Life, soul and blood”'
    claim: '“Life,” “souls” and “soul” are one Hebrew word, nefesh (H5315), three times in the verse'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'נֶ֣פֶשׁ'
  - where: 'note 17:11 “Life, soul and blood”'
    claim: '“your souls” is the plural of the same word'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'נַפְשֹׁתֵי/כֶ֑ם'
  - where: 'note 17:11 “Life, soul and blood”'
    claim: 'A modern translation: “it is the blood that makes atonement by the life”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+17&version=ESV'
    quote: 'for it is the blood that makes atonement by the life.'
  - where: 'note 17:11 “Life, soul and blood”'
    claim: 'Another modern translation: “for, as life, it is the blood that makes atonement”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+17&version=NRSVUE'
    quote: 'for, as life, it is the blood that makes atonement.'
  - where: 'note 17:11 “Life, soul and blood”'
    claim: 'Blood represented life, what made living things living'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'blood represented the concept of life—the dynamic element that made living things living'

  - where: 'note 17:11 “Blood given for the altar”'
    claim: 'Blood was, because of that significance, a divine possession used by God to effect atonement'
    key: belnap-dwell-among
    url: 'https://rsc.byu.edu/ascending-mountain-lord/i-may-dwell-among-them-liminality-ritual-tabernacle'
    quote: 'and was, by virtue of that significance, a divine possession utilized by God to affect atonement.'
  - where: 'note 17:11 “Blood given for the altar”'
    claim: 'Substitution of the animal''s death for the human''s seems suggested in 17:11'
    key: lane-whole-meaning
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/whole-meaning-law'
    quote: 'This principle of substitution of the animal’s suffering and death for human suffering and death seems to be suggested in Leviticus 17:11'
  - where: 'note 17:11 “Blood given for the altar”'
    claim: 'Read as a ransom, the animal''s blood ransoms the soul of the sinner'
    key: lane-whole-meaning
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/whole-meaning-law'
    quote: 'In reading this passage as a ransom, the blood (the life) of the animal makes an atonement for (ransoms) the soul of the sinner.'
  - where: 'note 17:11 “Blood given for the altar”'
    claim: 'The reading is heavily debated'
    key: lane-whole-meaning
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/whole-meaning-law'
    quote: 'It is important to note that this passage is heavily debated'
  - where: 'note 17:11 “Blood given for the altar”'
    claim: 'The Bible Dictionary: the atoning power was in the blood for the life in it and because the sacrifice was a type of Christ'
    key: bd-blood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/blood?lang=eng'
    quote: 'The atoning power of a sacrifice was in the blood because it was regarded as containing the life of the animal and because the sacrifice was a type of the great sacrifice who is Jesus Christ (Lev. 17:11; Heb. 9:22).'

  - where: 'note 17:13 “Burying the blood of game”'
    claim: 'Blood was recognized as the seat of life, and so was sacred and not to be consumed (on Lev. 17:10–14)'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'In the ancient world, including in ancient Israel, blood was recognized as the seat of life (compare Genesis 9:4–5; Deuteronomy 12:23; John 6:53–54). Blood was thus sacred and not to be consumed.'

  - where: christ
    claim: 'Jesus worked out a perfect atonement by shedding His own blood'
    key: bd-blood
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/blood?lang=eng'
    quote: 'Jesus worked out a perfect atonement by the shedding of His own blood'
  - where: christ
    claim: 'A Latter-day Saint reading: 17:11 helps one see the atonement in John 6:53–54'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'This conceptual framework helps us appreciate the Atonement implications of Jesus’s paradoxical teaching: “Except ye eat the flesh of the Son of man, and drink his blood, ye have no life in you.'
  - where: christ
    claim: 'Bowen compares Moses 6:60 with the sanctifying blood of chapter 17'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'The first part of the Holiness Code emphasizes the sanctifying character of blood (compare Moses 6:60).'
