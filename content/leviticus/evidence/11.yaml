chapter: 11
claims:
  - where: setting
    claim: 'Chapters 11–15 follow the priests'' charge in 10:10 to distinguish clean and unclean; ch. 11 is food and carcasses, 12–15 the uncleanness of persons, garments and houses'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/11.htm'
    quote: 'One of the chief duties of the priests was ‘to put difference between the holy and the common, and between the unclean and the clean’ (Leviticus 10:10); instructions for putting this difference appropriately follow'
  - where: setting
    claim: 'The two groups of laws: ch. 11 on food and carcasses; 12–15 on persons, garments, furniture, houses'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/11.htm'
    quote: '(1) those in ch. 11, which relate to food and contact with the carcases of animals; (2) those in chs. 12–15, concerning the uncleanness of persons, garments, furniture, and houses.'
  - where: setting
    claim: 'Welch: the chapter begins the purity section for everyday life; dietary laws regulate the daily table; holiness in the family home'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'This chapter begins a long section that sets forth requirements for maintaining purity, holiness, and often simple cleanliness in virtually every aspect of everyday life. Those who connected with the temple are to maintain holiness in the family home. Thus, dietary laws regulate what can be eaten on the daily table.'
  - where: setting
    claim: 'Uncleanness was ceremonial or ritual, not moral evil'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'Uncleanness referred to being ceremonially or ritually unclean and should not be taken to mean that the touching of a dead body or the bearing of children was morally evil.'
  - where: setting
    claim: 'Milgrom: impurity was held to be the foe of holiness, assaulting the sacred even from afar'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'it is patently clear that these texts are grounded in the axiom, common to all ancient Near Eastern cultures, that impurity is the implacable foe of holiness wherever it exists; it assaults the sacred realm even from afar.'
  - where: setting
    claim: 'Deuteronomy 14 has a parallel list of clean and unclean animals'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'Certain animals, birds, and fishes were regarded as clean and might be eaten, while others were unclean and were forbidden. See Lev. 11; Deut. 14:3–20.'
  - where: thread
    claim: 'The chapter''s classes: beasts 2–8, fishes 9–12, birds 13–19, winged swarming things 20–23; the leaping ones may be eaten'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/11.htm'
    quote: '(d) Winged swarming things Leviticus 11:20-23. … in Leviticus 11:21-22 gives a list of winged swarming things that may be eaten (those that ‘leap’), repeating in Leviticus 11:23 the prohibition of Leviticus 11:20.'
  - where: thread
    claim: 'No fish is named; birds are listed without a test'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/11.htm'
    quote: 'No fish is mentioned by name, and the distinction between clean and unclean fishes in particular cases was determined by the Jewish rabbis.'
  - where: thread
    claim: 'Verses 24–40 are uncleanness caused by dead bodies: touching, carrying; vessels, food, ovens, water, seed'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/11.htm'
    quote: '(b) further cases of defilement were caused by a carcase, (α) a vessel (Leviticus 11:32-33), (β) food (Leviticus 11:34), (γ) ovens, etc. (Leviticus 11:35), (δ) water in a pit (Leviticus 11:36), (ε) seed (Leviticus 11:37-38).'
  - where: thread
    claim: 'Verses 44–45 give the reason for the prescriptions'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/11.htm'
    quote: '45. The reason for these prescriptions is given'
  - where: thread
    claim: 'The summary in 46–47 refers only to the rules about eating'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/11.htm'
    quote: '46, 47. Summary. It refers only to the rules about eating, and so makes no reference to Leviticus 11:24-30.'
  - where: section 2 plain
    claim: 'Paraphrase follows the KJV; nothing departs from its sense'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/11?lang=eng'
    quote: 'These shall ye eat of all that are in the waters: whatsoever hath fins and scales in the waters, in the seas, and in the rivers, them shall ye eat.'
  - where: section 4 plain
    claim: 'Oven and ranges: HEB stove and cooking ovens; fountain or pit: HEB a spring and a well'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/11?lang=eng'
    quote: '35a “oven”: HEB stove and cooking ovens. … 36a “a fountain or pit”: HEB a spring and a well.'
  - where: section 5 plain
    claim: '“Whatsoever hath more feet”: or every millipede (that which has numerous legs)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/11?lang=eng'
    quote: '42a “whatsoever”: OR every millipede (or that which has numerous legs).'
  - where: section 1 plain
    claim: 'The coney is the rock hyrax'
    key: bdb
    url: 'https://biblehub.com/hebrew/8227.htm'
    quote: 'rock-badger, hyrax syriacus, AV RV coney'

  - where: 'note 11:5 “The coney and the hare”'
    claim: 'Shaphan is the rock-badger or hyrax, living in rocks (Ps. 104:18; Prov. 30:26)'
    key: bdb
    url: 'https://biblehub.com/hebrew/8227.htm'
    quote: 'שָׁפָן noun masculineLeviticus 11:5 rock-badger, hyrax syriacus, AV RV coney; — absolute ׳שׁ Deuteronomy 14:7 = Leviticus 11:5 (P; unclean animal); living in rocks, plural שְׁפַנִּים Psalm 104:18; Proverbs 30:26.'
  - where: 'note 11:5 “The coney and the hare”'
    claim: '“Coney” was an old English word for rabbit, following Jewish tradition'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/11.htm'
    quote: '‘Coney,’ an old English term for ‘rabbit,’ is the rendering of A.V., which follows the traditional Jewish interpretation.'
  - where: 'note 11:5 “The coney and the hare”'
    claim: 'Coney and hare move their jaws as if chewing the cud but are not ruminants; the language is popular, not scientific'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/11.htm'
    quote: 'The coney (rock-badger) and hare move their jaws like beasts which chew the cud, but are not ruminating animals. Here, as in other passages of the Bible, the language is popular, rather than scientific.'

  - where: 'note 11:7 “Why pork, and why these animals”'
    claim: 'Cambridge: the pig forbidden as non-ruminant; especially obnoxious either as an object of heathen worship (Isa. 65:4; 66:3, 17) or for sanitary reasons'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/11.htm'
    quote: 'the swine was specially obnoxious to the Jews, either owing to its being an object of heathen worship (cp. Isaiah 65:4; Isaiah 66:3; Isaiah 66:17), or for sanitary reasons.'
  - where: 'note 11:7 “Why pork, and why these animals”'
    claim: 'Cambridge: one principle was that animals tied to heathen worship were unclean; others rested on appearance, habits, sanitary grounds'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/11.htm'
    quote: 'One principle underlying this distinction appears to have been that animals which were recognised as in any way objects of worship by heathen neighbours, or even supposed by them to be connected with unseen supernatural beings, were to be considered unclean.'
  - where: 'note 11:7 “Why pork, and why these animals”'
    claim: 'The manual names health reasons: trichinosis in pork, poisoned shellfish'
    key: ot-manual-lev-11-18
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-11-18-a-law-of-performances-and-ordinances-part-2-the-clean-and-the-unclean?lang=eng'
    quote: 'There were practical reasons for these laws related to health and sanitation. The flesh of swine is highly susceptible to trichinosis, a malady easily transmitted to man.'
  - where: 'note 11:7 “Why pork, and why these animals”'
    claim: 'The manual: the Hebrew word for clean means more than physically clean'
    key: ot-manual-lev-11-18
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-11-18-a-law-of-performances-and-ordinances-part-2-the-clean-and-the-unclean?lang=eng'
    quote: 'But the Hebrew word for clean used in the dietary law means more than just physically clean.'
  - where: 'note 11:7 “Why pork, and why these animals”'
    claim: 'The manual quotes a Jewish writer: “unclean” is a ceremonial word, limited to Israel'
    key: ot-manual-lev-11-18
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-11-18-a-law-of-performances-and-ordinances-part-2-the-clean-and-the-unclean?lang=eng'
    quote: '‘Unclean’ in Leviticus is a ceremonial word. That is why the Torah says of camels and rabbits, ‘They are unclean for you,’ limiting the definition and the discipline to Israel.'
  - where: 'note 11:7 “Why pork, and why these animals”'
    claim: 'The manual: the diet as a teaching tool, a choice at every meal, separating Israel from the Canaanites'
    key: ot-manual-lev-11-18
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-11-18-a-law-of-performances-and-ordinances-part-2-the-clean-and-the-unclean?lang=eng'
    quote: 'God was using the diet as a teaching tool. People may forget or neglect prayer, play, work, or worship, but they seldom forget a meal. … At every meal a formal choice was made, generating quiet self-discipline. … Further, the law served to separate the Hebrews from their Canaanite neighbors.'

  - where: 'note 11:10 “A different word for abomination”'
    claim: 'The Hebrew word in 11:10 is sheqets'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'שֶׁ֥קֶץ'
  - where: 'note 11:10 “A different word for abomination”'
    claim: 'BDB: sheqets, detestation, used of the ceremonially unclean and of creatures forbidden as food in Lev. 11'
    key: bdb
    url: 'https://biblehub.com/hebrew/8263.htm'
    quote: 'שֶׁ֫קֶץ noun masculineLeviticus 7:21 detestation, detestable thing; — ׳שׁ of the ceremonially unclean. Leviticus 7:21; creatures forbidden as food: water animals without fins or scales Leviticus 11:10,11,12, birds of prey, etc., Leviticus 11:13'
  - where: 'note 11:10 “A different word for abomination”'
    claim: 'Lev. 18:22 uses a different word, toʿebah (H8441)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'תּוֹעֵבָ֖ה'

  - where: 'note 11:13 “The forbidden birds”'
    claim: 'Kirby: the list of unclean birds; swan probably an ibis; no biblical list of clean birds'
    key: kirby-birds
    url: 'https://rsc.byu.edu/vol-7-no-2-2006/way-eagle-birds-scriptures'
    quote: 'swan (probably an ibis), pelican, gier eagle, stork, heron, and lapwing. Under the provisions of the Mosaic law, these were considered to be the unclean birds that were not to be eaten (see Leviticus 11:13–19). In Deuteronomy 14:20, Moses explained that members of the house of Israel were allowed to eat clean birds, but a biblical list of them is not available.'
  - where: 'note 11:13 “The forbidden birds”'
    claim: 'The manual: forbidden birds were generally birds of prey living on carrion, or ate unclean creatures; ossifrage and gier eagle thought to be vultures'
    key: ot-manual-lev-11-18
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-11-18-a-law-of-performances-and-ordinances-part-2-the-clean-and-the-unclean?lang=eng'
    quote: 'Birds forbidden were generally birds of prey that lived on carrion, or, as in the case of the stork and heron, those that may have eaten other unclean creatures (see vv. 13–20). The ossifrage is thought to be a species of vulture, as is the gier eagle.'

  - where: 'note 11:24 “Unclean until the evening”'
    claim: 'In ordinary uncleanness, seclusion till evening then washing sufficed; in some cases a sin offering'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'In ordinary cases of uncleanness it was sufficient to remain in seclusion till the evening and then to wash the body. In certain cases a sin offering was necessary.'
  - where: 'note 11:24 “Unclean until the evening”'
    claim: 'Touching a dead body made unclean (Lev. 11:8)'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'Uncleanness also resulted from the touch of a dead body (Lev. 11:8; 21:1–4, 11; 22:4–7; Deut. 21:22).'
  - where: 'note 11:24 “Unclean until the evening”'
    claim: 'Being unclean meant separation for the rest of the day, cut off from the covenant people for a time'
    key: sc-knowhy-479
    url: 'https://scripturecentral.org/knowhy/how-is-the-day-of-atonement-understood-in-the-book-of-mormon'
    quote: 'One of the main issues with being unclean was that it meant that a person had to be separated from other people for the rest of the day, and in that way were cut off from the covenant people for a period of time (see Leviticus 11:24–40).'
  - where: 'note 11:24 “Unclean until the evening”'
    claim: 'An unclean person who ate of the peace offerings was cut off (Lev. 7:20–21); text of the chapter and of Lev. 7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'But the soul that eateth of the flesh of the sacrifice of peace offerings, that pertain unto the LORD, having his uncleanness upon him, even that soul shall be cut off from his people.'

  - where: 'note 11:33 “The pot and the cup”'
    claim: 'The vessel rules: outside contamination purified by water until evening; inside of an open vessel smashed; the inside more susceptible'
    key: sc-knowhy-169
    url: 'https://scripturecentral.org/knowhy/why-did-moroni-refer-to-vessel-impurity-in-condemning-the-central-government'
    quote: 'Implicit behind these rules is the assumption that the inside of a vessel was more susceptible to impurity than the outside.'
  - where: 'note 11:33 “The pot and the cup”'
    claim: 'The verse has the corpse fall “into the midst” of the vessel; apparently the rule applied to a pot with an inside'
    key: sc-knowhy-169
    url: 'https://scripturecentral.org/knowhy/why-did-moroni-refer-to-vessel-impurity-in-condemning-the-central-government'
    quote: 'did this rule of impurity apply only to a piece of pottery that had an inside and an outside, like a jar but not a plate? Apparently yes, otherwise how could the animal corpse fall “into the midst” of it (Leviticus 11:33)?'
  - where: 'note 11:33 “The pot and the cup”'
    claim: 'Jesus used the debate over the order of cleansing a vessel for a moral lesson (Matt. 23:26)'
    key: sc-knowhy-169
    url: 'https://scripturecentral.org/knowhy/why-did-moroni-refer-to-vessel-impurity-in-condemning-the-central-government'
    quote: 'the Jewish schools of Hillel and Shammai at the time of Jesus argued about the order of cleansing a container, whether one should purify its inside or its outside first. Jesus made use of this debate to draw a moral lesson'
  - where: 'note 11:33 “The pot and the cup”'
    claim: 'Moroni''s “inward vessel” in Alma 60:23 drew on these laws'
    key: sc-knowhy-169
    url: 'https://scripturecentral.org/knowhy/why-did-moroni-refer-to-vessel-impurity-in-condemning-the-central-government'
    quote: 'When Captain Moroni required of Pahoran that “the inward vessel shall be cleansed first, and then shall the outer vessel be cleansed also” (Alma 60:23), he invoked legal provisions from the Law of Moses that would have been known to Pahoran.'
  - where: 'note 11:33 “The pot and the cup”'
    claim: 'Text of Matt. 23:25–26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/23?lang=eng'
    quote: 'Thou blind Pharisee, cleanse first that which is within the cup and platter, that the outside of them may be clean also.'

  - where: 'note 11:7 “Why pork, and why these animals”'
    claim: 'KnoWhy 807: the food laws were given not because the unclean animals were unhealthy but to set Israel apart'
    key: sc-knowhy-807
    url: 'https://scripturecentral.org/knowhy/why-do-latter-day-saints-obey-the-word-of-wisdom'
    quote: 'According to the Lord, this health code was not given because the unclean animals were unhealthy but because the Lord wanted to set the Israelites apart from the world: “Ye shall therefore sanctify yourselves, and ye shall be holy; for I am holy” (Leviticus 11:44).'
  - where: 'note 11:44 “Holy, because the LORD is holy”'
    claim: 'Welch on 20:25–26: a holy people separated from unclean people and beasts in order to belong to God'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Instead, they would be a pure and holy people, separated from unclean people and beasts in order to belong to God and be worthy of His presence (verses 25–26).'
  - where: 'note 11:44 “Holy, because the LORD is holy”'
    claim: '1 Peter 1:16 quotes Lev. 11:44'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'See Leviticus 11:44 in 1 Peter 1:16'
  - where: 'note 11:44 “Holy, because the LORD is holy”'
    claim: 'First in the law in these words: occurrences.mjs finds “for I am holy” only at Lev. 11:44–45 (19:2 reads “for I the LORD your God am holy”); Exodus has no such line'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/11?lang=eng'
    quote: 'For I am the LORD your God: ye shall therefore sanctify yourselves, and ye shall be holy; for I am holy'
  - where: 'note 11:44 “Holy, because the LORD is holy”'
    claim: 'Text of Lev. 20:24–26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/20?lang=eng'
    quote: 'Ye shall therefore put difference between clean beasts and unclean, and between unclean fowls and clean'

  - where: 'note 11:47 “When the line was taken away”'
    claim: 'Peter''s vision and his reading of it (Acts 10:14, 28)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/10?lang=eng'
    quote: 'but God hath shewed me that I should not call any man common or unclean.'
  - where: 'note 11:47 “When the line was taken away”'
    claim: 'Wayment: Luke connects people with the unclean food in the vision; the divide between Gentiles and Jews was an issue of food; Gentiles were unclean because they ate unclean foods'
    key: wayment-peter-cornelius
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/peter-cornelius-cultural-boundaries'
    quote: 'Luke has subtly made the connection that people are equal to the unclean food in the vision. Through this connection, Luke is able to draw out the idea that the center of the divide between Gentiles and Jews in early Christianity was an issue of food.'
  - where: 'note 11:47 “When the line was taken away”'
    claim: 'Wayment: one reason Gentiles were considered unclean was that they ate unclean foods'
    key: wayment-peter-cornelius
    url: 'https://rsc.byu.edu/ministry-peter-chief-apostle/peter-cornelius-cultural-boundaries'
    quote: 'And one of the fundamental reasons Gentiles were considered unclean is because they partook of unclean foods.'
  - where: 'note 11:47 “When the line was taken away”'
    claim: 'Mark 7:19 KJV “purging all meats”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/7?lang=eng'
    quote: 'Because it entereth not into his heart, but into the belly, and goeth out into the draught, purging all meats?'
  - where: 'note 11:47 “When the line was taken away”'
    claim: 'A modern translation of Mark 7:19: “Thus he declared all foods clean.”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Mark+7%3A19&version=NRSVUE'
    quote: '19 since it enters not the heart but the stomach and goes out into the sewer?” (Thus he declared all foods clean.)'
  - where: 'note 11:47 “When the line was taken away”'
    claim: 'The regulations, fulfilled by the Atonement, are no longer required of believers'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'being fulfilled by the Atonement of Jesus Christ, they are no longer required of the believers. See Mark 7:15–23; Acts 10:9–16, 28; 15:29; 1 Tim. 4:4; 2 Ne. 25:24–27; Mosiah 13:29–32.'

  - where: christ
    claim: 'KnoWhy 479: only Christ bridges the gap between unclean humanity and a clean God'
    key: sc-knowhy-479
    url: 'https://scripturecentral.org/knowhy/how-is-the-day-of-atonement-understood-in-the-book-of-mormon'
    quote: 'Only Christ can bridge that gap between unclean or sinful humanity and an ultimately clean and purely righteous God, and the Nephite understanding of the Law of Moses helps to explain this point.'
  - where: christ
    claim: 'KnoWhy 479: being cut off from the people while physically unclean is set beside being cut off from God while spiritually unclean'
    key: sc-knowhy-479
    url: 'https://scripturecentral.org/knowhy/how-is-the-day-of-atonement-understood-in-the-book-of-mormon'
    quote: 'This connection between spiritual and physical uncleanness implies that if someone is cut off from the physical presence of the people of God for being physically unclean, then they would be cut off spiritually from God Himself for being spiritually unclean'
  - where: christ
    claim: 'KnoWhy 479 reads uncleanness through 1 Ne. 10:21'
    key: sc-knowhy-479
    url: 'https://scripturecentral.org/knowhy/how-is-the-day-of-atonement-understood-in-the-book-of-mormon'
    quote: 'In the Book of Mormon, being clean is important. 1 Nephi 10:21 states that “if ye have sought to do wickedly in the days of your probation, then ye are found unclean before the judgment-seat of God; and no unclean thing can dwell with God'
  - where: christ
    claim: 'KnoWhy 479 reads uncleanness through Alma 11:37'
    key: sc-knowhy-479
    url: 'https://scripturecentral.org/knowhy/how-is-the-day-of-atonement-understood-in-the-book-of-mormon'
    quote: 'Amulek explained this in Alma 11:37 when he stated that “no unclean thing can inherit the kingdom of heaven'
