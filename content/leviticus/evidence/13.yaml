chapter: 13
claims:
  # ---------- setting / thread ----------
  - where: 'setting'
    claim: 'The Bible Dictionary makes 13–15 the laws of ceremonial uncleanness'
    key: bd-leviticus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leviticus?lang=eng'
    quote: '(3) Laws relating to ceremonial uncleanness (Lev. 13–15).'
  - where: 'thread'
    claim: 'Leviticus calls Israel to holy observance in ordinary daily life, such as caring for the skin'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Nothing is more ordinary in the daily routine of life than washing and caring for the skin, … the book of Leviticus calls all its adherents to a daily life of holy observance of the covenant relationship'
  - where: 'thread'
    claim: 'The priest looks and pronounces; the cases end clean or unclean'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/13?lang=eng'
    quote: 'and the priest shall look on him, and pronounce him unclean.'
  # ---------- section paraphrases ----------
  - where: 'section 1 plain'
    claim: '“Plague” rendered “mark”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5061.htm'
    quote: 'stroke, plague, mark, plague-spot'
  - where: 'section 1 plain'
    claim: '“Shut up” rendered “isolate”: the footnote gives “quarantine”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/13?lang=eng'
    quote: 'OR shall quarantine.'
  - where: 'section 3 plain'
    claim: 'The “burning boil” of 13:23 is the scar of the boil'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/13.htm'
    quote: '23. the scar of the boil] The Heb. for ‘scar’ occurs only here and in Leviticus 13:28. It is from a root signifying ‘to burn,’'
  - where: 'section 6 plain'
    claim: '“His head bare” means letting the hair go loose'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/13.htm'
    quote: 'rending the garments, and letting the hair go loose'
  - where: 'section 7 plain'
    claim: '“Fretting leprosy” rendered “malignant leprosy” (footnote)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/13?lang=eng'
    quote: 'HEB malignant leprosy.'
  # ---------- notes ----------
  - where: 'note 13:2 “What “leprosy” and “plague” mean here”'
    claim: 'Biblical leprosy (tsaraʿat) is a variety of skin ailments, mostly not Hansen’s disease, that made a person ritually unclean'
    key: sc-leprosy
    url: 'https://scripturecentral.org/archive/books/book-chapter/leprosy'
    quote: 'In the Old Testament, leprosy refers to a variety of skin ailments, most of which are not to be associated with Hansen’s disease, the disease we commonly call leprosy. Instead, biblical leprosy (Hebrew ṣa‘arat) refers to those skin diseases that rendered an individual ritually unclean'
  - where: 'note 13:2 “What “leprosy” and “plague” mean here”'
    claim: 'Possible identifications are guesses: psoriasis, scabies, favus, impetigo'
    key: sc-leprosy
    url: 'https://scripturecentral.org/archive/books/book-chapter/leprosy'
    quote: 'Some potential skin infections contained under the rubric of ṣa‘arat could have been psoriasis, scabies, favus, impetigo, and other skin infections that leave a specific mark or wound.'
  - where: 'note 13:2 “What “leprosy” and “plague” mean here”'
    claim: 'In the cases of Moses, Miriam, Naaman and Uzziah, leprosy was a sign, warning or punishment'
    key: bd-leprosy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leprosy?lang=eng'
    quote: 'including Moses (Ex. 4:6–7), his sister Miriam (Num. 12:10), Naaman (2 Kgs. 5), and King Uzziah (2 Chr. 26:19–21). In these cases leprosy was given as a sign, a warning, or a punishment.'
  - where: 'note 13:2 “What “leprosy” and “plague” mean here”'
    claim: 'BDB glosses negaʿ as stroke, plague, mark, plague-spot'
    key: bdb
    url: 'https://biblehub.com/hebrew/5061.htm'
    quote: 'stroke, plague, mark, plague-spot'
  - where: 'note 13:2 “What “leprosy” and “plague” mean here”'
    claim: 'Negaʿ means stroke, plague, mark; of leprosy, the heavy touch or stroke of a disease'
    key: bdb
    url: 'https://biblehub.com/hebrew/5061.htm'
    quote: 'of leprosy, regarded as the heavy touch or stroke of a disease'
  - where: 'note 13:2 “What “leprosy” and “plague” mean here”'
    claim: 'Negaʿ also stands for the person who has it (13:4)'
    key: bdb
    url: 'https://biblehub.com/hebrew/5061.htm'
    quote: 'identification with person having it Leviticus 13:4,12,13,17,31'
  - where: 'note 13:3 “The priest examines and declares; he does not heal”'
    claim: 'Ritual uncleanness mattered more than contagiousness'
    key: sc-leprosy
    url: 'https://scripturecentral.org/archive/books/book-chapter/leprosy'
    quote: 'The ritual uncleanness was, from the biblical perspective, more important than potential contagiousness.'
  - where: 'note 13:3 “The priest examines and declares; he does not heal”'
    claim: 'Naaman, a non-Israelite, held high office despite his leprosy'
    key: sc-leprosy
    url: 'https://scripturecentral.org/archive/books/book-chapter/leprosy'
    quote: 'This is illustrated by the non- Israelite Naaman, whose leprosy was not an obstacle to his achieving a high office in the army.'
  - where: 'note 13:3 “The priest examines and declares; he does not heal”'
    claim: 'The footnote at 13:4 gives “shall quarantine”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/13?lang=eng'
    quote: 'OR shall quarantine.'
  - where: 'note 13:3 “The priest examines and declares; he does not heal”'
    claim: 'Deuteronomy tells Israel to do as the priests teach in leprosy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/24?lang=eng'
    quote: 'Take heed in the plague of leprosy, that thou observe diligently, and do according to all that the priests the Levites shall teach you:'
  - where: 'note 13:13 “Why a body turned white all over is clean”'
    claim: 'One older reading: complete whitening was the crisis of the disease'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/13.htm'
    quote: 'The breaking out of the leprous matter in this complete and rapid way upon the surface of the whole body was the crisis of the disease; the diseased matter turned into a scurf, which died away and then fell off.'
  - where: 'note 13:13 “Why a body turned white all over is clean”'
    claim: 'The “quick raw flesh” is living, raw, proud flesh'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/13.htm'
    quote: 'living, i.e., raw, proud flesh'
  - where: 'note 13:13 “Why a body turned white all over is clean”'
    claim: 'Another older commentary: a non-infectious skin disease that peels off is meant'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/13.htm'
    quote: 'A form of skin disease which is not infectious seems to be here indicated. A white efflorescence spreads over the whole body, which after a time peels off, and the skin resumes a healthy appearance.'
  - where: 'note 13:45 “The leper dressed as a mourner”'
    claim: 'The leper’s actions are a mourner’s: rent garments, loose hair, covered upper lip; parallels Lev. 10:6 and Ezek. 24:17'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/13.htm'
    quote: 'The actions of the leper here prescribed are those of a mourner; rending the garments, and letting the hair go loose (cp. Leviticus 10:6, Leviticus 21:10; Ezekiel 24:17), covering the upper lip'
  - where: 'note 13:45 “The leper dressed as a mourner”'
    claim: 'The leper was regarded as one dead, as Miriam is described'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/13.htm'
    quote: 'The leper was regarded as one dead; Miriam is so described (Numbers 12:12)'
  - where: 'note 13:45 “The leper dressed as a mourner”'
    claim: 'The cry was so that others would avoid the leper; Lam. 4:15 has the cry'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/13.htm'
    quote: 'and cry "Unclean, unclean," that every one might avoid them for fear of being defiled (Lamentations 4:15)'
  - where: 'note 13:45 “The leper dressed as a mourner”'
    claim: 'Aaron pleads that Miriam not be as one dead'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/12?lang=eng'
    quote: 'Let her not be as one dead, of whom the flesh is half consumed when he cometh out of his mother’s womb.'
  - where: 'note 13:46 “Why the leper lived outside the camp”'
    claim: 'Lepers are put outside the camp so as not to defile the camp where the Lord dwells'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/5?lang=eng'
    quote: 'Both male and female shall ye put out, without the camp shall ye put them; that they defile not their camps, in the midst whereof I dwell.'
  - where: 'note 13:46 “Why the leper lived outside the camp”'
    claim: 'Azariah king of Judah was a leper and dwelt in a several house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/15?lang=eng'
    quote: 'And the Lord smote the king, so that he was a leper unto the day of his death, and dwelt in a several house.'
  - where: 'christ'
    claim: 'The ten lepers stood afar off'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/17?lang=eng'
    quote: 'And as he entered into a certain village, there met him ten men that were lepers, which stood afar off:'
  - where: 'note 13:47 “Leprosy in cloth and leather”'
    claim: 'Clothing and walls were called leprous for mildew or fungous growth'
    key: bd-leprosy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leprosy?lang=eng'
    quote: 'clothing and walls were said to be leprous when they had patches of mildew or some fungous growth, as in Lev. 13:47–59; 14:33–37.'
  - where: 'note 13:47 “Leprosy in cloth and leather”'
    claim: 'Buildings and cloth could contract tsaraʿat and its ritual impurity'
    key: sc-leprosy
    url: 'https://scripturecentral.org/archive/books/book-chapter/leprosy'
    quote: 'In fact, under the law, buildings and cloth could also contract ṣa‘arat and its attendant ritual impurity.'
  # ---------- christ ----------
  - where: 'christ'
    claim: 'The Gospels record Jesus curing leprosy'
    key: bd-leprosy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leprosy?lang=eng'
    quote: 'Instances of Jesus curing leprosy are recorded in Matt. 8:2–4; Mark 1:40–45; Luke 5:12–15; 17:11–15.'
  - where: 'christ'
    claim: 'The Church’s footnote at 13:49 points to Luke 17:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/13?lang=eng'
    quote: 'Luke 17:14.'
  - where: 'christ'
    claim: 'Jesus touched the leper and healed him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/1?lang=eng'
    quote: 'And Jesus, moved with compassion, put forth his hand, and touched him, and saith unto him, I will; be thou clean.'
