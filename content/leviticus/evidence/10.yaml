chapter: 10
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The priests’ first offerings were made on the eighth day of their consecration'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/9?lang=eng'
    quote: 'And it came to pass on the eighth day, that Moses called Aaron and his sons, and the elders of Israel;'
  - where: 'setting'
    claim: 'The fire from before the Lord consumed the offering at the end of chapter 9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/9?lang=eng'
    quote: 'And there came a fire out from before the Lord, and consumed upon the altar the burnt offering and the fat: which when all the people saw, they shouted, and fell on their faces.'
  - where: 'setting'
    claim: 'Leviticus has only two stories, Nadab and Abihu in chapter 10 and the blasphemer in chapter 24'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'The only two stories included in Leviticus are the account of Nadab and Abihu in Leviticus 10 and the case of the blasphemer in Leviticus 24.'
  - where: 'setting'
    claim: 'Nadab was Aaron’s eldest son'
    key: bd-nadab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nadab?lang=eng'
    quote: 'Eldest son of Aaron (Ex. 6:23; Num. 3:2)'
  - where: 'setting'
    claim: 'Nadab and Abihu had gone up the mount with Moses and the elders'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: 'Come up unto the Lord, thou, and Aaron, Nadab, and Abihu, and seventy of the elders of Israel; and worship ye afar off.'
  - where: 'setting'
    claim: 'Numbers recalls their deaths, that they had no children, and that Eleazar and Ithamar served'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/3?lang=eng'
    quote: 'they had no children: and Eleazar and Ithamar ministered in the priest’s office in the sight of Aaron their father.'
  - where: 'setting'
    claim: 'Leviticus 16 is dated after the death of Aaron’s two sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'And the Lord spake unto Moses after the death of the two sons of Aaron, when they offered before the Lord, and died;'
  - where: 'thread'
    claim: 'Both of Leviticus’s stories are about noncompliance and end in divine commands that lead to further instruction'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'both stories are about noncompliance—namely the noncompliance of Nadab and Abihu in Leviticus 10 and of the blasphemer in Leviticus 24. These two woeful stories end with divine commands, and they ultimately serve as springboards for further instructions'
  - where: 'thread'
    claim: 'The chapter divides into the transgression and punishment (1–7), wine forbidden (8–9, with 10–11), eating the holy things (12–15), and Aaron’s excuse (16–20)'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/10.htm'
    quote: '(3) The first priestly transgression and its punishment (1–7) … (4) Wine and strong drink forbidden (8, 9) … (5) The law of eating the holy things (12–15) … (6) Aaron’s excuse for not eating the Sin-Offering (16–20)'
  - where: 'thread'
    claim: 'The burned sin offering was the second time the sons of Aaron had not followed the law'
    key: ot-manual-lev-1-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-1-10-a-law-of-performances-and-ordinances-part-1-sacrifices-and-offerings?lang=eng'
    quote: 'This was the second time the sons of Aaron had not followed the law.'
  - where: 'section 1 plain'
    claim: '“Strange fire” rendered as fire not authorized: the Bible Dictionary glosses it as fire not taken from the altar'
    key: bd-nadab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nadab?lang=eng'
    quote: 'struck dead for offering “strange” fire (fire not taken from the altar)'
  - where: 'section 1 plain'
    claim: '“I will be sanctified” rendered “I will show myself holy”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+10&version=NRSVUE'
    quote: '‘Through those who are near me I will show myself holy, and before all the people I will be glorified.’'
  - where: 'section 1 plain'
    claim: '“Uncover not your heads” rendered as letting the hair hang loose'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+10&version=ESV'
    quote: 'Do not let the hair of your heads hang loose, and do not tear your clothes, lest you die'
  - where: 'explore'
    claim: 'An older commentary points to Lev. 16:12 in discussing fire taken from the altar for incense'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/10.htm'
    quote: 'This is sometimes explained as fire not taken from the altar of Burnt-Offering (cp. Leviticus 16:12; Numbers 16:46)'
  - where: 'section 3 plain'
    claim: 'The meal offering and the priests’ portions are those of the offerings of chapter 9'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/10.htm'
    quote: 'The reference is to the Meal-Offering and Peace-Offering of Leviticus 9:17-18.'

  # ---------- note 10:1 ----------
  - where: 'note 10:1 “What Nadab and Abihu did wrong”'
    claim: 'The Bible Dictionary: Nadab was struck dead for offering “strange” fire, fire not taken from the altar'
    key: bd-nadab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nadab?lang=eng'
    quote: 'struck dead for offering “strange” fire (fire not taken from the altar) (Lev. 10:1; Num. 3:4; 26:61; 1 Chr. 24:2).'
  - where: 'note 10:1 “What Nadab and Abihu did wrong”'
    claim: 'The fire of 9:24 came out from before the Lord and consumed the offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/9?lang=eng'
    quote: 'And there came a fire out from before the Lord, and consumed upon the altar the burnt offering and the fat'
  - where: 'note 10:1 “What Nadab and Abihu did wrong”'
    claim: 'Welch reads the chapter as penalties for priests who perform sacrifices improperly'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Penalties are imposed if priests perform sacrifices improperly. Such rogue priests suffered the death penalty (verse 2).'
  - where: 'note 10:3 “The Lord shows Himself holy in those near Him”'
    claim: 'A modern translation renders the verb reflexively: “I will show myself holy”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+10&version=NRSVUE'
    quote: '‘Through those who are near me I will show myself holy, and before all the people I will be glorified.’'
  - where: 'note 10:3 “The Lord shows Himself holy in those near Him”'
    claim: 'Keil takes the verb reflexively, and the priests as those the Lord brought near and anointed; if they neglect to sanctify Him, He sanctifies Himself in them by judgment'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/10.htm'
    quote: 'sanctified them to Himself by anointing … that they might sanctify Him in their office and life. If they neglected this sanctification, He sanctified Himself in them by a penal judgment (Ezekiel 38:16), and thereby glorified Himself as the Holy One, who is not to be mocked.'
  - where: 'note 10:3 “The Lord shows Himself holy in those near Him”'
    claim: 'Keil: the words were not a revelation given to Moses but what the Lord made known by the priests’ election'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/10.htm'
    quote: 'Jehovah had not communicated to Moses by revelation the words which he spoke here, but had made the fact known by the position assigned to Aaron and his sons through their election to the priesthood.'
  - where: 'note 10:3 “The Lord shows Himself holy in those near Him”'
    claim: 'Cambridge: the words seem to be a quotation, in poetic parallelism; the priests are those with the right to approach God'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/10.htm'
    quote: 'The words seem to be a quotation and are in poetical parallelism … The sense is that the priests are those who have the right to approach God, and He shews Himself holy in punishing those who do it improperly.'
  - where: 'note 10:3 “The Lord shows Himself holy in those near Him”'
    claim: 'Keil: Aaron’s silence acknowledged the righteousness of God'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/10.htm'
    quote: '"And Aaron held his peace." He was obliged to acknowledge the righteousness of the holy God.'

  # ---------- note 10:6 ----------
  - where: 'note 10:6 “Why the priests could not mourn”'
    claim: 'A modern translation: “Do not let the hair of your heads hang loose”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+10&version=ESV'
    quote: 'Do not let the hair of your heads hang loose, and do not tear your clothes, lest you die'
  - where: 'note 10:6 “Why the priests could not mourn”'
    claim: 'The high priest, anointed, may not uncover his head or rend his clothes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/21?lang=eng'
    quote: 'And he that is the high priest among his brethren, upon whose head the anointing oil was poured, and that is consecrated to put on the garments, shall not uncover his head, nor rend his clothes;'
  - where: 'note 10:6 “Why the priests could not mourn”'
    claim: 'Belnap and Skinner read 10:6–7 with 21:10–12: the oil belonged to God, and the anointed Aaron may not engage in profane behavior'
    key: belnap-skinner-sinai
    url: 'https://rsc.byu.edu/creation-sinai/promise-provocation'
    quote: 'As the two passages suggest, the oil belonged to God himself, transforming that which touched it and making those items representative of him or able to interact with him. Aaron, having been anointed, is not allowed to engage in normal, “profane” behavior.'
  - where: 'note 10:6 “Why the priests could not mourn”'
    claim: 'The Student Manual: mourning would imply the Lord had been unjust'
    key: ot-manual-lev-1-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-1-10-a-law-of-performances-and-ordinances-part-1-sacrifices-and-offerings?lang=eng'
    quote: 'Aaron’s other sons were forbidden to officially mourn the death of their brothers, for this action would imply that the Lord had been unjust in the punishment (see Leviticus 10:6).'

  # ---------- note 10:9 ----------
  - where: 'note 10:9 “No wine in the sanctuary”'
    claim: 'Welch: Aaron’s sons were therefore given additional strict commandments (verses 6–11) after the penalty'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Aaron’s sons were therefore given additional strict commandments as to the proper performance of their priestly functions: to not uncover their heads or tear their clothes, to not drink wine or strong drink as they come into the tabernacle'

  # ---------- note 10:10 ----------
  - where: 'note 10:10 “Holy and common, clean and unclean”'
    claim: 'The Guide: the opposite of holy is common or profane'
    key: gs-holy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/holy?lang=eng'
    quote: 'Sacred, having a godly character, or spiritually and morally pure. The opposite of holy is common or profane.'
  - where: 'note 10:10 “Holy and common, clean and unclean”'
    claim: 'Chapter 11 closes with the same charge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/11?lang=eng'
    quote: 'To make a difference between the unclean and the clean, and between the beast that may be eaten and the beast that may not be eaten.'
  - where: 'note 10:10 “Holy and common, clean and unclean”'
    claim: 'KnoWhy #479: uncleanness was addressed as a physical problem, but 10:10 seems to connect the physical and spiritual aspects'
    key: sc-knowhy-479
    url: 'https://scripturecentral.org/knowhy/how-is-the-day-of-atonement-understood-in-the-book-of-mormon'
    quote: 'Although being unclean under the early Mosaic Law was essentially addressed as a physical problem … according to Leviticus 10:10 Aaron was supposed to make a distinction … This seems to involve and connect both the physical and spiritual aspects of being clean and unclean.'

  # ---------- note 10:16 ----------
  - where: 'note 10:16 “The sin offering that was not eaten”'
    claim: 'The goat was the people’s sin offering of 9:15, which the priests were to eat in the holy place, since its blood was not taken into the sanctuary'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/10.htm'
    quote: 'the flesh of the goat which had been brought for a sin-offering (Leviticus 9:15), and which was to have been eaten by the priests in the holy place along with the sin-offerings, whose blood was not taken into the sanctuary'
  - where: 'note 10:16 “The sin offering that was not eaten”'
    claim: 'Burning instead of eating should only have happened if the blood had been brought into the tent; Moses was angry with the sons, who acted under direction, and Aaron answered as responsible'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/10.htm'
    quote: 'This burning (as opposed to eating by the priests) should only have taken place, if (as was not done in this case) the blood had been brought into the ‘tent of meeting.’ Moses is angry with Aaron’s sons, but they acted under direction, and Aaron acknowledges his responsibility by replying.'
  - where: 'note 10:16 “The sin offering that was not eaten”'
    claim: 'Keil: “to bear the iniquity” here is to take another’s sin on oneself to cancel it, as in Ex. 28:38'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/10.htm'
    quote: '"To bear the iniquity" does not signify here, as in Leviticus 5:1, to bear and atone for the sin in its consequences, but, as in Exodus 28:38, to take the sin of another upon one''s self, for the purpose of cancelling it, to make expiation for it.'
  - where: 'note 10:16 “The sin offering that was not eaten”'
    claim: 'Cambridge gives two readings of 10:17: a general statement of the offering’s purpose, or atoning value in the priests’ eating as part of the whole rite'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/10.htm'
    quote: 'The first is a general statement as to the efficacy of the Sin-Offering; the second attributes an atoning value to the eating by the priests, although not to this action apart from the ceremonial of which it formed a constituent portion.'
  - where: 'note 10:16 “The sin offering that was not eaten”'
    claim: 'The Student Manual, quoting Clarke, reads Aaron’s answer as a father’s grief'
    key: ot-manual-lev-1-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-1-10-a-law-of-performances-and-ordinances-part-1-sacrifices-and-offerings?lang=eng'
    quote: 'God certainly has commanded me to eat of the sin-offering; but when such things as these have happened unto me, could it be good in the sight of the Lord? Does he not expect that I should feel as a father under such afflicting circumstances?'
  - where: 'note 10:16 “The sin offering that was not eaten”'
    claim: 'The Student Manual: this was the second time the sons of Aaron had not followed the law'
    key: ot-manual-lev-1-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-1-10-a-law-of-performances-and-ordinances-part-1-sacrifices-and-offerings?lang=eng'
    quote: 'This was the second time the sons of Aaron had not followed the law. Moses rebuked them, but Aaron withstood the rebuke.'
  - where: 'note 10:16 “The sin offering that was not eaten”'
    claim: 'Keil rejects the grief reading because the sin-offering meal was not joyous, and reads the judgment as a warning that they lacked the holiness the eating required'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/10.htm'
    quote: 'they might properly feel "that they had not so strong and overpowering a holiness as was required for eating the general sin-offering" … others find the reason in their grief … But this is not for a moment to be thought of, simply because the eating of the flesh of the sin-offering was not a joyous meal at all'
  - where: 'note 10:16 “The sin offering that was not eaten”'
    claim: 'Cambridge: the incident presents difficulties not satisfactorily explained; no blood had been brought in for Aaron’s calf either, and its burning drew no objection'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/10.htm'
    quote: 'no blood has yet been brought into the Holy place, not even that of the calf for Aaron’s Sin-Offering (Leviticus 9:8 ff.), and yet no objection against the burning of it was made by Moses.'
  - where: 'note 10:16 “The sin offering that was not eaten”'
    claim: 'Cambridge: the incident presents difficulties not satisfactorily explained'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/10.htm'
    quote: 'The whole incident presents difficulties which have not been satisfactorily explained'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'Leviticus 16 opens after the death of Aaron’s two sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'And the Lord spake unto Moses after the death of the two sons of Aaron, when they offered before the Lord, and died;'
  - where: 'christ'
    claim: 'An older commentary conjectures that the rules for entering the holy place were once more closely connected with this story'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/10.htm'
    quote: 'From Leviticus 16:1 it may be conjectured that the regulations for entering into the Holy place were at one time more closely connected with this narrative.'
  - where: 'christ'
    claim: 'Hebrews 9 contrasts the high priest’s work on the Day of Atonement with Christ’s, the great High Priest who offered Himself once for all'
    key: bd-fasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fasts?lang=eng'
    quote: 'In Heb. 9:6–28 a contrast is drawn between the work of the high priest on the Day of Atonement and the work of Christ, the great High Priest, who offered once for all the perfect sacrifice of Himself.'