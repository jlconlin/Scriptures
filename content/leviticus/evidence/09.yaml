chapter: 9
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The priests were consecrated seven days before they went out from the door of the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/8?lang=eng'
    quote: 'And ye shall not go out of the door of the tabernacle of the congregation in seven days, until the days of your consecration be at an end: for seven days shall he consecrate you.'
  - where: 'setting'
    claim: 'Chapters 8–10 deal with the inauguration of the priests; chapters 1–7 already assume priests at work'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Here the text deals with the inauguration of the priestly administration. … the sacrifices and the priestly administrative order set forth in chapters 1–7 already assume that priests have been consecrated and are fully operational.'
  - where: 'setting'
    claim: 'Leviticus 9 records when the whole worship system began to operate'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'Leviticus 9 records the occasion when the entire worship system commenced operation.'
  - where: 'setting'
    claim: 'How the people’s sin offering is handled here gives rise to the question of 10:16'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/9.htm'
    quote: 'the blood is not brought into the tabernacle, and the sacrifice is wholly consumed. This treatment gives rise to the question of Leviticus 10:16.'
  - where: 'thread'
    claim: 'One older reading of the order of the offerings: sin offering first, then burnt offering, then peace offering, and why'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/9.htm'
    quote: 'The sin-offering always went first, because it served to remove the estrangement of man from the holy God arising from sin … Then followed the burnt-offering, as an expression of the complete surrender of the person expiated to the Lord; and lastly the peace-offering … as a seal of covenant fellowship with the Lord in the sacrificial meal.'
  - where: 'thread'
    claim: 'One study reads Lev. 9:22–24 as repeating the elements of Exodus 24:1–11, and the offerings as maintaining covenant relationship'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'All elements of Exodus 24.1-11 are repeated: (1) Yhwh appears to the people … (2) the priests make sacrifice and peace offerings … and (3) Aaron speaks a word of blessing to the people … The Levitical sacrifices functioned to maintain and celebrate covenant relationship'

  # ---------- sections ----------
  - where: 'section 4 plain'
    claim: 'In 9:22 the Hebrew is written “his hand” and read “his hands”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'יד/ו … יָדָ֛י/ו'

  # ---------- notes ----------
  - where: 'note 9:1 “The day after the seven days”'
    claim: 'The seven days of consecration at the door of the tabernacle precede the eighth day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/8?lang=eng'
    quote: 'Therefore shall ye abide at the door of the tabernacle of the congregation day and night seven days, and keep the charge of the LORD, that ye die not: for so I am commanded.'

  - where: 'note 9:8 “Aaron’s sin offering for himself”'
    claim: 'One older reading: Aaron’s need for a sin offering after the seven days showed that the law’s offerings could not ensure perfection (Heb. 10:1)'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/9.htm'
    quote: 'even after the manifold expiation and consecration, which Aaron had received through Moses during the seven days, he had still to enter upon his service with a sin-offering and burnt-offering, this fact clearly showed that the offerings of the law could not ensure perfection (Hebrews 10:1.).'
  - where: 'note 9:8 “Aaron’s sin offering for himself”'
    claim: 'On that reading the atonement “for the people” in 9:7 was for the guilt the high priest brought on the nation (4:3)'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/9.htm'
    quote: 'referred not to sins which the people had committed, but to the guilt which the high priest, as the head of the whole congregation, had brought upon the nation by his sin (Leviticus 4:3).'
  - where: 'note 9:8 “Aaron’s sin offering for himself”'
    claim: 'The Septuagint reads “for thy house” in 9:7'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/leviticus/9.htm'
    quote: 'and make atonement for thyself, and for thy house; and offer the gifts of the people, and make atonement for them'
  - where: 'note 9:8 “Aaron’s sin offering for himself”'
    claim: '“For thy house” is the phrase of Lev. 16:11'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/9.htm'
    quote: 'LXX. has ‘and for thy house’ as in Leviticus 16:11; Leviticus 16:17.'
  - where: 'note 9:8 “Aaron’s sin offering for himself”'
    claim: 'Only here is a calf the sin offering; Jewish tradition in the Targum held it recalled the golden calf'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/9.htm'
    quote: 'Only here is a calf appointed for a Sin-Offering. According to Jewish tradition, expressed in Targ. Jon., it was to remind Aaron of his sin in making the golden calf at Horeb (Exodus 32).'
  - where: 'note 9:8 “Aaron’s sin offering for himself”'
    claim: 'The blood was not taken into the sanctuary but put on the horns of the altar of burnt offering; the flesh and skin were burnt outside the camp as for all priestly sin offerings'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/9.htm'
    quote: 'The blood was not taken into the sanctuary, but only applied to the horns of the altar of burnt-offering … The flesh and skin of the animal were burnt outside the camp, as in the case of all the sin-offerings for the priesthood (Leviticus 4:11-12).'
  - where: 'note 9:8 “Aaron’s sin offering for himself”'
    claim: 'The people’s sin offering was wholly consumed, which raises the question of 10:16'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/9.htm'
    quote: 'The Sin-Offering for the people is offered ‘as the first’ i.e. in the same way as Aaron’s Sin-Offering; the blood is not brought into the tabernacle, and the sacrifice is wholly consumed.'
  - where: 'note 9:22 “Aaron blesses the people”'
    claim: 'The Hebrew of 9:22 is written “his hand” (ketiv) and read “his hands” (qere)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'יד/ו … יָדָ֛י/ו'
  - where: 'note 9:22 “Aaron blesses the people”'
    claim: 'One study suggests Aaron’s blessing was perhaps like the blessings of Lev. 26:4–13'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: '(3) Aaron speaks a word of blessing to the people (implying benefits of the covenant, perhaps similar in content to the blessings defined in Leviticus 26.4-13).'
  - where: 'note 9:22 “Aaron blesses the people”'
    claim: 'Numbers 6 gives the blessing for Aaron and his sons to speak'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/6?lang=eng'
    quote: 'The Lord bless thee, and keep thee:'

  - where: 'note 9:23 “The glory seen by all”'
    claim: 'In the Hebrew Bible glory is equated with fire, light or brightness; the Hebrew word normally denotes heaviness'
    key: muhlestein-theophanies
    url: 'https://rsc.byu.edu/ascending-mountain-lord/darkness-light-lord-elements-israelite-theophanies'
    quote: 'As before, we see that glory is clearly equated with fire, light or brightness. A host of other references provides the same connotation for this Hebrew word that normally denotes heaviness.'
  - where: 'note 9:23 “The glory seen by all”'
    claim: 'The passages listed for glory as fire include Exodus 24:15–17 and Lev. 9:23–24'
    key: muhlestein-theophanies
    url: 'https://rsc.byu.edu/ascending-mountain-lord/darkness-light-lord-elements-israelite-theophanies'
    quote: '[34] See Exodus 24:15–17; Leviticus 9:23–24; Numbers 11:1; Deuteronomy 5:24–25; 2 Chronicles 7:1–3'
  - where: 'note 9:23 “The glory seen by all”'
    claim: 'The Hebrew word for “glory” in 9:23 is kavod (Strong’s 3519)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'כְבוֹד'
  - where: 'note 9:23 “The glory seen by all”'
    claim: 'Moses waited for the LORD’s call; at the tabernacle the call probably comes at Lev. 1:1 or 9:23; a suggestion that Moses’ role gives way to Aaron’s'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'it is clear that he had to wait until Yhwh’s invitation (24.17) which, in the tabernacle context, probably occurs in Leviticus (either 1.1 or 9.23). … B. S. Childs (Exodus, 638) suggests that here Moses’ role gives way to the priestly role of Aaron (Leviticus 9.23).'

  - where: 'note 9:24 “The fire from before the LORD”'
    claim: 'One older reading: the fire came from the visible manifestation of the LORD, like lightning, and did not come down from heaven as for David and Solomon'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/9.htm'
    quote: 'from which the fire proceeded in this instance in the form of lightning, and consumed the sacrifices upon the altar. The fire issued "from before the face of Jehovah," i.e., from the visible manifestation of Jehovah. It did not come down from heaven, like the fire of Jehovah, which consumed the sacrifices of David and Solomon'
  - where: 'note 9:24 “The fire from before the LORD”'
    claim: 'Similar manifestations of approval: Judg. 6:21; 1 Kgs. 18:38; 1 Chr. 21:26'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/9.htm'
    quote: 'God’s approval is signified … and the fire from before the Lord which consumes the Burnt-Offering and the fat. Similar manifestations of approval are recorded in Jdg 6:21; 1 Kings 18:38; 1 Chronicles 21:26.'
  - where: 'note 9:24 “The fire from before the LORD”'
    claim: 'There was already fire on the altar; the miracle was the sudden consuming of the burning offerings, to consecrate Aaron’s service'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/9.htm'
    quote: 'the sacrifices, which were already on fire, were suddenly consumed by it … inasmuch as there was already fire upon the altar when the sacrifices were placed upon it. … to give a divine consecration to the altar, or sacrificial service of Aaron and his sons'
  - where: 'note 9:24 “The fire from before the LORD”'
    claim: 'The opening words of 9:24 in Hebrew (Strong’s 3318, 784, 6440, 3068, 398)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וַ/תֵּ֤צֵא … אֵשׁ֙ … מִ/לִּ/פְנֵ֣י … יְהוָ֔ה … וַ/תֹּ֨אכַל֙'
  - where: 'note 9:24 “The fire from before the LORD”'
    claim: 'The opening words of 10:2 in Hebrew are the same five words'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וַ/תֵּ֥צֵא … אֵ֛שׁ … מִ/לִּ/פְנֵ֥י … יְהוָ֖ה … וַ/תֹּ֣אכַל'
  - where: 'note 9:24 “The fire from before the LORD”'
    claim: 'One study: because of the remedy for sin, the fire in Israel’s midst does not consume them'
    key: morales-tabernacle
    url: 'https://journal.interpreterfoundation.org/the-tabernacle-mountain-of-god-in-the-cultus-of-israel/'
    quote: 'Because of the cultic remedy for sin, “the fire that dwells in their midst” does not consume Israel (40.34-38; cf. 3.3, 24.17).'

  - where: 'note 9:24 “A shout of joy”'
    claim: 'The Hebrew verb of “shouted” in 9:24 is ranan (Strong’s 7442)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וַ/יָּרֹ֔נּוּ'
  - where: 'note 9:24 “A shout of joy”'
    claim: 'Ranan means to shout, usually for joy; the King James also renders it sing, rejoice, shout for joy'
    key: bdb
    url: 'https://biblehub.com/hebrew/7442.htm'
    quote: 'ranan: To sing, shout for joy, rejoice … KJV: aloud for joy, cry out, be joyful (greatly, make to) rejoice, (cause to) shout (for joy), (cause to) sing (aloud, for joy, out), triumph … i.e. to shout (usually for joy)'

  # ---------- christ / explore ----------
  - where: 'explore'
    claim: 'Muhlestein’s study of the glory and the fire in Israelite theophanies'
    key: muhlestein-theophanies
    url: 'https://rsc.byu.edu/ascending-mountain-lord/darkness-light-lord-elements-israelite-theophanies'
    quote: 'Kerry Muhlestein, “Darkness, Light, and the Lord: Elements of Israelite Theophanies,” in Ascending the Mountain of the Lord: Temple, Praise, and Worship in the Old Testament (2013 Sperry Symposium)'
