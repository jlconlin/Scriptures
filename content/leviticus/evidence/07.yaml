chapter: 7
claims:
  - where: when
    claim: 'The law of the offerings was given at Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'Which the LORD commanded Moses in mount Sinai, in the day that he commanded the children of Israel to offer their oblations unto the LORD, in the wilderness of Sinai.'

  - where: setting
    claim: 'Chapter 7 gives the trespass offering (1–10) and the peace offerings, thanksgiving and vow and freewill (11–19)'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'The laws regarding the most holy trespass offering are given special attention (verses 1–10), along with the handling of peace offerings, thanksgiving offerings, and voluntary offerings connected with voluntary vows (verses 11–19).'
  - where: setting
    claim: 'The peace offering is the only sacrifice with a meal for the offerer'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: '(6) The sacrificial meal (in the case of the peace offering only). The fat having been burnt and the priests’ pieces removed, the rest of the flesh was eaten by the sacrificer, his household, and the poorer Levites at the tabernacle.'
  - where: setting
    claim: 'In one older reading, verses 37–38 close the whole sacrificial law of chapters 1–7, and the place points back to Exodus 19:1'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/7.htm'
    quote: 'With Leviticus 7:37 and Leviticus 7:38 the whole of the sacrificial law (ch. 1-7) is brought to a close. … The allusion to the place in Leviticus 7:38, viz., "in the wilderness of Sinai," points on the one hand back to Exodus 19:1'
  - where: setting
    claim: 'Jarom 1:6 is read as echoing the ban on eating blood (7:26)'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Leviticus 7:26 = Jarom 1:6: both speak negatively about eating the blood of beasts'

  - where: thread
    claim: 'The peace offering''s law covers the bread with it, the eating of the flesh (with the ban on fat and blood), and the LORD''s share'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/7.htm'
    quote: 'contains instructions, (1) as to the bloodless accompaniment to these sacrifices (Leviticus 7:12-14), (2) as to the eating of the flesh of the sacrifices (Leviticus 7:15-21), with the prohibition against eating fat and blood (Leviticus 7:22-27), and (3) as to Jehovah''s share of these sacrifices (Leviticus 7:28-36).'
  - where: thread
    claim: 'The rules are to be followed scrupulously because the sacrifices belong to a covenant relationship'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'This is not because the letter of the law is an end in and of itself but because these sacrifices are a part of a covenant relationship'

  - where: thread
    claim: 'The rest of the peace offering went to the offerer''s family, eaten at the tabernacle'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: '(6) The sacrificial meal (in the case of the peace offering only). The fat having been burnt and the priests’ pieces removed, the rest of the flesh was eaten by the sacrificer, his household, and the poorer Levites at the tabernacle.'
  - where: 'note 7:6 “Most holy and holy: who ate what”'
    claim: 'The rest of the peace offering was eaten at the sanctuary by the offerer and his household'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: '(6) The sacrificial meal (in the case of the peace offering only). The fat having been burnt and the priests’ pieces removed, the rest of the flesh was eaten by the sacrificer, his household, and the poorer Levites at the tabernacle.'

  - where: section 4 plain
    claim: 'The “shoulder” is the right thigh (hind leg)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7785.htm'
    quote: '2 of sacrificial animal, specifically upper leg, thigh, hind leg, portion eaten 1 Samuel 9:24'

  - where: 'note 7:6 “Most holy and holy: who ate what”'
    claim: 'The sin offering''s flesh was eaten in a holy place by the priests; the wave breast and heave thigh by their sons and daughters in a clean place; the rest by the offerer''s household'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The remainder of the flesh was eaten in a holy place by the priest and his sons. … The wave breast (the portion of the priests generally) and the heave thigh (the portion of the officiating priest) were eaten by their sons and their daughters in a clean place.'
  - where: 'note 7:6 “Most holy and holy: who ate what”'
    claim: 'The priests'' families ate the peace-offering portions in a clean place (Lev. 10:14)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/10?lang=eng'
    quote: 'And the wave breast and heave shoulder shall ye eat in a clean place; thou, and thy sons, and thy daughters with thee'

  - where: 'note 7:12 “Thanksgiving, vow, and freewill”'
    claim: 'Todah is thanksgiving, and as an offering a division of the peace offering'
    key: bdb
    url: 'https://biblehub.com/hebrew/8426.htm'
    quote: '4 thank-offering ׳קטּר ת Amos 4:5 ("" נְדָבוֺת); a division of זֶבַח הַשְּׁלָמִים Leviticus 7:12'
  - where: 'note 7:12 “Thanksgiving, vow, and freewill”'
    claim: 'BDB lists the thanksgiving sacrifices of Psalm 107:22 under the thank-offering'
    key: bdb
    url: 'https://biblehub.com/hebrew/8426.htm'
    quote: '׳זבת זבח(י) ת Psalm 107:22; Psalm 116:17'
  - where: 'note 7:12 “Thanksgiving, vow, and freewill”'
    claim: 'The three purposes of the peace offering: thanks, a vow, a freewill offering; they could be combined'
    key: ot-manual-lev-1-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-1-10-a-law-of-performances-and-ordinances-part-1-sacrifices-and-offerings?lang=eng'
    quote: 'Thank Offering is given to thank God for all blessings (Lev. 7:12–13, 15; 22:29). Vow Offering … signifies the taking or renewing of a vow or covenant. … An individual could seemingly give the offering for any of the above declared purposes separately or together.'
  - where: 'note 7:12 “Thanksgiving, vow, and freewill”'
    claim: 'Vows were often made to obtain a favor from the LORD'
    key: bd-vows
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/vows?lang=eng'
    quote: 'Vows often had an entreating character; they were offered in order to obtain some favor from Jehovah (Gen. 28:20; 2 Sam. 15:7–8).'
  - where: 'note 7:12 “Thanksgiving, vow, and freewill”'
    claim: 'The thanksgiving sacrifice is offered "at your own will" and eaten the same day (Lev. 22:29–30)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/22?lang=eng'
    quote: 'And when ye will offer a sacrifice of thanksgiving unto the LORD, offer it at your own will. On the same day it shall be eaten up'

  - where: 'note 7:13 “Leavened bread with the thanksgiving”'
    claim: 'No leaven in offerings made to God with fire'
    key: bd-leaven
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leaven?lang=eng'
    quote: 'No leaven was allowed during the Passover Feast (Ex. 12:15, 19; 13:7; Deut. 16:4) or in offerings made to God with fire'
  - where: 'note 7:13 “Leavened bread with the thanksgiving”'
    claim: 'The leavened cakes were not for the altar, like the firstfruits of 2:12; Amos 4:5 shows leaven brought with a thanksgiving'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/7.htm'
    quote: 'besides these he is to bring leavened cakes, which are not intended for the altar (see Leviticus 2:11) but are similar in character to the offering mentioned in Leviticus 2:12. According to Amos 4:5, leaven was brought with a thanksgiving offering'
  - where: 'note 7:13 “Leavened bread with the thanksgiving”'
    claim: 'Firstfruits may be offered but not burned on the altar (Lev. 2:12)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/2?lang=eng'
    quote: 'As for the oblation of the firstfruits, ye shall offer them unto the LORD: but they shall not be burnt on the altar for a sweet savour.'

  - where: 'note 7:18 “Why not on the third day”'
    claim: 'Piggul is a technical term for unclean sacrificial flesh, used of flesh eaten on the third day'
    key: bdb
    url: 'https://biblehub.com/hebrew/6292.htm'
    quote: 'foul thing, refuse, but only as technical term of unclean sacrificial flesh; — it is ׳פ if eaten on third day Leviticus 7:18 (P), Leviticus 19:7 (H)'
  - where: 'note 7:18 “Why not on the third day”'
    claim: 'Eaten on the third day it was not well-pleasing and "not reckoned to the offerer"; the burning guarded against desecration of the holy meal'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/7.htm'
    quote: 'If any was eaten on the third day, it was not well-pleasing … and was "not reckoned to the offerer," sc., as a sacrifice well-pleasing to God … The burning on the third day was commanded … to guard against the danger of a desecration of the meal.'
  - where: 'note 7:18 “Why not on the third day”'
    claim: 'In a warm country unpreserved flesh begins to spoil by the third day'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/7.htm'
    quote: 'It became a desecration of what was holy, through the fact that in warm countries, if flesh is not most carefully preserved by artificial means, it begins to putrefy, or becomes offensive (פּגּוּל) on the third day.'
  - where: 'note 7:18 “Why not on the third day”'
    claim: 'Lev. 19:7–8 repeats the rule and calls it profaning the holy thing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/19?lang=eng'
    quote: 'And if it be eaten at all on the third day, it is abominable; it shall not be accepted.'

  - where: 'note 7:20 “Cut off from his people”'
    claim: 'Being cut off means removal from Israelite society and from the Lord''s favor'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'The punishment for those who fail to adhere to the book’s moral standards is being “cut off from among their people,” removed from Israelite society and from favor with the Lord.'
  - where: 'note 7:20 “Cut off from his people”'
    claim: 'The phrase is applied to the unclean who eat the peace offering (7:20–21, 25, 27)'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'If people who are unclean eat any of these sacrifices, they will be “cut off from [their] people” (verses 20–21, 25, 27).'
  - where: 'note 7:20 “Cut off from his people”'
    claim: 'Lev. 22:3 gives the punishment as cut off from the Lord''s presence, for the unclean who come to the holy things'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Leviticus 22:3. Here we learn the punishment for those who allow their personal ritual impurity to defile the Lord’s “holy things” … “that soul shall be cut off from my [the Lord’s] presence.”'
  - where: 'note 7:20 “Cut off from his people”'
    claim: 'Uncleanness was ritual, not moral evil'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'Uncleanness referred to being ceremonially or ritually unclean and should not be taken to mean that the touching of a dead body or the bearing of children was morally evil.'

  - where: 'note 7:30 “The wave offering”'
    claim: 'Tenuphah is a swinging, waving; a technical term for the priest''s share; used of the wave breast'
    key: bdb
    url: 'https://biblehub.com/hebrew/8573.htm'
    quote: 'a. waving, wave-offering, technical term in P (H), originally of priest''s share of sacrifice'
  - where: 'note 7:30 “The wave offering”'
    claim: 'Tenuphah: a swinging, waving'
    key: bdb
    url: 'https://biblehub.com/hebrew/8573.htm'
    quote: 'noun feminine a swinging, waving, wave-offering, offering'
  - where: 'note 7:30 “The wave offering”'
    claim: 'How the waving was done and what it meant, in one older reading'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/7.htm'
    quote: 'the priest laid the object to be waved upon the hands of the offerer, and then placed his own hands underneath, and moved the hands of the offerer backwards and forwards in a horizontal direction'
  - where: 'note 7:30 “The wave offering”'
    claim: 'The forward movement presented it to God; the backward, God giving it to the priests'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/7.htm'
    quote: 'the presentation of the sacrifice, or the symbolical transference of it to God, and by the movement backwards, the reception of it back again, as a present which God handed over to His servants the priests.'
  - where: 'note 7:30 “The wave offering”'
    claim: 'The breast is the brisket, one of the choicest parts'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/7.htm'
    quote: 'the brisket, which consists for the most part of cartilaginous fat in the case of oxen, sheep, and goats, and is one of the most savoury parts'
  - where: 'note 7:30 “The wave offering”'
    claim: 'Waving was also done at the priests'' consecration'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/7.htm'
    quote: 'At the consecration of the priests it was performed with the fat portions, the right leg, and with some cakes, as well as with the breast of the fill-offering (Leviticus 8:25-29; Exodus 29:22-26).'

  - where: 'note 7:32 “The heave offering, and a thigh, not a shoulder”'
    claim: 'Terumah is a contribution for sacred uses, properly something lifted off, separated'
    key: bdb
    url: 'https://biblehub.com/hebrew/8641.htm'
    quote: 'contribution, offering, for sacred uses … (properly something lifted off, separated)'
  - where: 'note 7:32 “The heave offering, and a thigh, not a shoulder”'
    claim: 'The Church''s footnote glosses heave offering as a contribution'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'IE a contribution.'
  - where: 'note 7:32 “The heave offering, and a thigh, not a shoulder”'
    claim: 'Terumah is used of cakes (7:14) and of the thigh (7:34)'
    key: bdb
    url: 'https://biblehub.com/hebrew/8641.htm'
    quote: 'a. of cakes and cereals Leviticus 7:14'
  - where: 'note 7:32 “The heave offering, and a thigh, not a shoulder”'
    claim: 'Shoq of a sacrificial animal is the thigh, hind leg; the Greek and Latin gave the AV "shoulder"'
    key: bdb
    url: 'https://biblehub.com/hebrew/7785.htm'
    quote: '2 of sacrificial animal, specifically upper leg, thigh, hind leg … — ᵐ5 βραχίων, ᵑ9 armus, hence AV and others shoulder'
  - where: 'note 7:32 “The heave offering, and a thigh, not a shoulder”'
    claim: 'The Bible Dictionary calls it the heave thigh, the officiating priest''s portion'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'the heave thigh (the portion of the officiating priest)'
  - where: 'note 7:32 “The heave offering, and a thigh, not a shoulder”'
    claim: 'Heave means to lift off or remove; the portion was the priest''s payment for his service'
    key: ot-manual-lev-1-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-1-10-a-law-of-performances-and-ordinances-part-1-sacrifices-and-offerings?lang=eng'
    quote: 'The term heave means, in Hebrew, “to lift off or remove.” This portion was given by the offerer to the priest in payment for his assistance.'

  - where: 'note 7:37 “The consecrations”'
    claim: 'Milluʾim means installation of priests, and names the installation offering and ram (Ex. 29:22; Lev. 8:22, 28, 33)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4394.htm'
    quote: '2 installation (of priests): Leviticus 7:37; Leviticus 8:33; = installation-offering Leviticus 8:28 ("" אִשָּׁה) compare ׳סַלֿ הַמּ Leviticus 8:31; ׳אֵיל הַמּ Exodus 29:22,26,27,31; Leviticus 8:22,29'
  - where: 'note 7:37 “The consecrations”'
    claim: 'The word stands in the Hebrew of 7:37'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/4394.htm'
    quote: 'מִלֻּאּים (millu) -- Fullness, consecration, setting (of stones)'
  - where: 'note 7:37 “The consecrations”'
    claim: 'Lev. 8:33 speaks of the days of the consecration'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/8?lang=eng'
    quote: 'until the days of your consecration be at an end: for seven days shall he consecrate you.'

  - where: christ
    claim: 'The Septuagint calls the thanksgiving "the sacrifice of praise"'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/leviticus/7.htm'
    quote: 'If a man should offer it for praise, then shall he bring, for the sacrifice of praise, loaves of fine flour made up with oil'
  - where: christ
    claim: 'The meal foreshadowed eating in the kingdom of God, in one older reading'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/7.htm'
    quote: 'became a holy covenant meal, a meal of love and joy, which represented domestic fellowship with the Lord, and thus shadowed forth, on the one hand, rejoicing before the Lord (Deuteronomy 12:12, Deuteronomy 12:18), and on the other, the blessedness of eating and drinking in the kingdom of God'
  - where: christ
    claim: 'Peace offerings presupposed peace with God; the feast symbolized fellowship'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'Peace offerings, as the name indicates, presupposed that the sacrificer was at peace with God; they were offered for the further realization and enjoyment of that peace. The characteristic rite was the sacrificial meal.'

