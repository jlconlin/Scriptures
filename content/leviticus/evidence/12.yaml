chapter: 12
claims:
  # ---------- setting / thread ----------
  - where: 'setting'
    claim: 'Chapter 11 closes on the charge to distinguish unclean and clean'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/11?lang=eng'
    quote: 'To make a difference between the unclean and the clean, and between the beast that may be eaten and the beast that may not be eaten.'
  - where: 'setting'
    claim: 'Chapters 12–15 treat childbirth, leprosy, and bodily discharges, in that order'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/12.htm'
    quote: 'They comprised the uncleanness of a woman in consequence of child-bearing (Leviticus 12:1-8), leprosy (ch. 13 and 14), and both natural and diseased secretions from the sexual organs of either male or female'
  - where: 'setting'
    claim: 'Uncleanness was ceremonial, not moral; bearing children was not morally evil'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'Uncleanness referred to being ceremonially or ritually unclean and should not be taken to mean that the touching of a dead body or the bearing of children was morally evil.'
  - where: 'setting'
    claim: 'Mary and Joseph kept the law of purification with the infant Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/2?lang=eng'
    quote: 'And when the days of her purification according to the law of Moses were accomplished, they brought him to Jerusalem, to present him to the Lord;'
  - where: 'setting'
    claim: 'The seven days of the first week match the seven days of menstrual uncleanness at 15:19'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/12.htm'
    quote: 'In the case of the menses, the uncleanness lasted seven days (Leviticus 15:19, Leviticus 15:24); in that of child-birth, either seven or fourteen days'
  - where: 'thread'
    claim: 'The periods, the offerings and the closing words of the chapter, from the text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/12?lang=eng'
    quote: 'And in the eighth day the flesh of his foreskin shall be circumcised. And she shall then continue in the blood of her purifying three and thirty days'

  # ---------- notes ----------
  - where: 'note 12:2 “Unclean, not sinful”'
    claim: 'The Bible Dictionary names the mother after childbirth as unclean for seven or fourteen days'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'For seven or fourteen days after the birth of a child the mother was unclean (Lev. 12).'
  - where: 'note 12:2 “Unclean, not sinful”'
    claim: 'Uncleanness was ritual and the bearing of children was not morally evil'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'Uncleanness referred to being ceremonially or ritually unclean and should not be taken to mean that the touching of a dead body or the bearing of children was morally evil.'
  - where: 'note 12:2 “Unclean, not sinful”'
    claim: 'A modern translation renders “the separation for her infirmity” as menstruation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus%2012&version=NRSVUE'
    quote: 'If a woman conceives and bears a male child, she shall be unclean seven days; as at the time of her menstruation, she shall be unclean.'
  - where: 'note 12:2 “Unclean, not sinful”'
    claim: 'Welch reads the chapter’s rules as celebrating and sanctifying childbearing'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Rules regarding childbirth (verses 1–8) celebrate and sanctify the most holy and exquisite purpose of family life—bringing human beings into this world.'
  - where: 'note 12:2 “Unclean, not sinful”'
    claim: 'The mother is cleansed from the issue of her blood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/12?lang=eng'
    quote: 'make an atonement for her; and she shall be cleansed from the issue of her blood.'

  - where: 'note 12:4 “The blood of her purifying”'
    claim: 'A modern translation renders the phrase “her time of blood purification”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus%2012&version=NRSVUE'
    quote: 'Her time of blood purification shall be thirty-three days; she shall not touch any holy thing or come into the sanctuary until the days of her purification are completed.'
  - where: 'note 12:4 “The blood of her purifying”'
    claim: 'Joseph Smith’s manuscript changes the wording of 12:3–5; the changes seem euphemistic and their origin cannot be known'
    key: horton-jst-pentateuch
    url: 'https://rsc.byu.edu/joseph-smith-translation/insights-exodus-leviticus-numbers-deuteronomy'
    quote: 'There are corrections in these three verses which seem euphemistic. … In verse 3, there is a change from “the flesh of his foreskin shall be circumcised” to “the man child shall be circumcised.” In verses 4 and 5, there is a change from “the blood of her purifying” to “the time of her purifying.”'
  - where: 'note 12:4 “The blood of her purifying”'
    claim: 'Horton: no objective way to know whether the changes were the Prophet’s idea'
    key: horton-jst-pentateuch
    url: 'https://rsc.byu.edu/joseph-smith-translation/insights-exodus-leviticus-numbers-deuteronomy'
    quote: 'There is probably no objective way of knowing whether these changes were the Prophet’s idea, or whether they came from the Lord.'
  - where: 'note 12:4 “The blood of her purifying”'
    claim: 'The periods are 7 + 33 days for a son and 14 + 66 for a daughter, with the sanctuary barred'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/12?lang=eng'
    quote: 'she shall touch no hallowed thing, nor come into the sanctuary, until the days of her purifying be fulfilled.'

  - where: 'note 12:5 “Twice as long for a daughter”'
    claim: 'The Student Manual: the question seems to have no key at present'
    key: ot-manual-lev-11-18
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-11-18-a-law-of-performances-and-ordinances-part-2-the-clean-and-the-unclean?lang=eng'
    quote: 'This question, however, is one that seems to have no key at present for its correct interpretation.'
  - where: 'note 12:5 “Twice as long for a daughter”'
    claim: 'The Student Manual: speculation is pointless until further revelation'
    key: ot-manual-lev-11-18
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-11-18-a-law-of-performances-and-ordinances-part-2-the-clean-and-the-unclean?lang=eng'
    quote: 'Speculation on why the Lord revealed different requirements for ceremonial purifying after the birth of male and female children is pointless until further revelation is received on the matter.'
  - where: 'note 12:5 “Twice as long for a daughter”'
    claim: 'Keil: the longer period rested on an ancient notion about the discharge after a girl’s birth'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/12.htm'
    quote: 'The prolongation of the period, in connection with the birth of a girl, was also founded upon the notion, which was very common in antiquity, that the bleeding and watery discharge continued longer after the birth of a girl than after that of a boy'
  - where: 'note 12:5 “Twice as long for a daughter”'
    claim: 'Cambridge: an ancient belief that a girl’s birth was more dangerous; the practice survived the belief'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/12.htm'
    quote: 'The belief that the birth of a girl was more dangerous for the mother than the birth of a boy prevailed among ancient nations, who considered that hostile supernatural beings were more to be feared in these cases. The practice, at here, survived the belief on which it was founded.'
  - where: 'note 12:5 “Twice as long for a daughter”'
    claim: 'The offering and the law are the same for son and daughter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/12?lang=eng'
    quote: 'This is the law for her that hath born a male or a female.'

  - where: 'note 12:6 “A sin offering when no sin was done”'
    claim: 'A modern translation calls the mother’s sin offering a purification offering'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus%2012&version=NRSVUE'
    quote: 'a lamb in its first year for a burnt offering and a pigeon or a turtledove for a purification offering.'
  - where: 'note 12:6 “A sin offering when no sin was done”'
    claim: 'Milgrom: the hatta’t is brought for severe physical impurity (as after childbirth) or for inadvertent sins'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'the hatta’t is brought by an individual under two circumstances: severe physical impurity, as that of the parturient, leper, or gonorrheic (Leviticus 12–15); or because of the commission of certain inadvertent sins (e.g., Leviticus 4).'
  - where: 'note 12:6 “A sin offering when no sin was done”'
    claim: 'The rite ends with the mother clean'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/12?lang=eng'
    quote: 'the one for the burnt offering, and the other for a sin offering: and the priest shall make an atonement for her, and she shall be clean.'

  - where: 'note 12:8 “If she could not afford a lamb”'
    claim: 'BDB lists both Lev. 5:7 and 12:8 under dei seh, “enough for (i.e. to buy) a lamb”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1767.htm'
    quote: 'Leviticus 5:7 and if his hand do not reach (if he do not command) דֵּי שֶׂה enough for (i.e. to buy) a lamb, Leviticus 12:8'
  - where: 'note 12:8 “If she could not afford a lamb”'
    claim: 'The poor mother brings two birds'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/12?lang=eng'
    quote: 'And if she be not able to bring a lamb, then she shall bring two turtles, or two young pigeons'
  - where: 'note 12:8 “If she could not afford a lamb”'
    claim: 'The sinner too poor for birds could bring flour'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/5?lang=eng'
    quote: 'But if he be not able to bring two turtledoves, or two young pigeons, then he that sinned shall bring for his offering the tenth part of an ephah of fine flour for a sin offering'

  # ---------- christ / explore ----------
  - where: 'christ'
    claim: 'Mary brought the offering of the purification at the temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/2?lang=eng'
    quote: 'And when the days of her purification according to the law of Moses were accomplished, they brought him to Jerusalem, to present him to the Lord;'
  - where: 'christ'
    claim: 'Luke 2:24 takes up Lev. 12:8'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Leviticus 12:8 in Luke 2:24'
  - where: 'christ'
    claim: 'Mary offered the sacrifices of a mother who could not afford a lamb'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/12.htm'
    quote: 'The Virgin Mary (Luke 2:24) offered the sacrifices of one whose ‘means suffice not for a lamb.’'
