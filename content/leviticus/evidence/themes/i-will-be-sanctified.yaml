    quote: 'וְ/הִתְקַדִּשְׁתֶּם֙'
  - where: 'section “Sanctify yourselves … I am the LORD which sanctify you”'
    claim: 'Pulpit on 11:44–47'
    key: pulpit-leviticus
    url: 'https://biblehub.com/commentaries/pulpit/leviticus/11.htm'
    quote: 'They were to sanctify themselves, that is, to avoid uncleanness, because God is holy, and they were God’s. They were thus taught that ceremonial cleanness of the body was a symbol of holiness of heart, and a means of attaining to the latter.'
  - where: 'section “Sanctify yourselves … I am the LORD which sanctify you”'
    claim: 'Bible Dictionary “Holiness” cites Lev. 11:44; 19:2; 21:8 for holy as moral character'
    key: bd-holiness
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/holiness?lang=eng'
    quote: 'The word holy therefore came to refer to moral character (Lev. 11:44; 19:2; 21:8; Isa. 6:3–8).'
  - where: 'section “Sanctify yourselves … I am the LORD which sanctify you”'
    claim: 'BDB piel 4d, “of God, keeping his people pure and sacred”: Ex. 31:13; Lev. 20:8; 21:8, 15, 23; 22:9, 16, 32; Ezek. 20:12; 37:28'
    key: bdb
    url: 'https://biblehub.com/hebrew/6942.htm'
    quote: 'of God, keeping his people pure and sacred'
  - where: 'section “Sanctify yourselves … I am the LORD which sanctify you”'
    claim: 'Keil on 20:7–8: both agents in one sentence'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/20.htm'
    quote: 'to sanctify themselves, i.e., to keep themselves pure from all idolatrous abominations, to be holy because Jehovah was holy (Leviticus 11:44; Leviticus 19:2), and to keep the statutes of their God who sanctified them (Exodus 31:13).'
  - where: 'section “Sanctify yourselves … I am the LORD which sanctify you”'
    claim: 'Ellicott on 20:7–8'
    key: ellicott-leviticus
    url: 'https://biblehub.com/commentaries/ellicott/leviticus/20.htm'
    quote: 'It is only by keeping the Divine ordinances that the Israelites will attain to that state of holiness which will not only arm them to resist the abominable rites and idolatrous practices denounced in the foregoing verses, but which will enable them to reflect the holiness of their Lord.'
  - where: 'section “Sanctify yourselves … I am the LORD which sanctify you”'
    claim: 'D&C 88:74 as quoted (the verse footnote 20:7a points to)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'sanctify yourselves; yea, purify your hearts, and cleanse your hands and your feet before me, that I may make you clean'
