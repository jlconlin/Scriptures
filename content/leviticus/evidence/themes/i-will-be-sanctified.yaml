page: i-will-be-sanctified
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'qādaš (H6942) stands 31 times in Leviticus: qal 2 (6:18, 27), piel 15, hitpael 2 (11:44; 20:7), niphal 2 (10:3; 22:32), hiphil 10 (22:2–3; 27:14–26); 10:3 ʾeqqādēš is niphal 1cs (HVNi1cs)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'אֶקָּדֵ֔שׁ'
  - where: 'opening'
    claim: '22:32 wĕniqdaštî, niphal 1cs (HC/VNq1cs), the only other niphal with the LORD as subject in Leviticus; the two stand at 10:3 and 22:32'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וְ/נִ֨קְדַּשְׁתִּ֔י'
  - where: 'opening'
    claim: 'Lev. 20:8 as quoted, the first of the seven participles “I am the LORD which sanctify you”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/20?lang=eng'
    quote: 'And ye shall keep my statutes, and do them: I am the Lord which sanctify you.'
  - where: 'opening'
    claim: 'Lev. 22:32 as quoted; footnote 32a “hallowed”: HEB sanctified'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/22?lang=eng'
    quote: 'but I will be hallowed among the children of Israel: I am the Lord which hallow you'
  - where: 'opening'
    claim: 'Connection made by this page: 10:3 and 22:32, the book’s two “I will be sanctified,” read together, the first over the dead priests on the priesthood’s first day, before the refrain, the second in one sentence with “I am the LORD which hallow you”; Bowen treats both verses (paras 38, 41) but reads each toward the hallowing of God’s name, not toward each other'
    key: bowen-thy-will
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/thy-will-be-done'
    quote: 'His prophecy may allude to Leviticus 22:32'
  - where: 'opening'
    claim: 'The remaining occurrences: qal 6:18, 27 (what touches the offerings becomes holy); hiphil 22:2–3; 27:14–26 (a man sanctifies house, field, firstlings); piel 25:10 (Israel hallows the jubilee); piel 16:19 (Aaron hallows the altar); 22:2 maqdišîm hiphil participle'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'מַקְדִּשִׁ֛ים'
  - where: 'opening'
    claim: 'Lev. 16:19 as quoted; 6:18, 27; 25:10; 27:14 as summarized'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'and hallow it from the uncleanness of the children of Israel'
  # ---------- section “Anointed him, to sanctify him” ----------
