page: i-will-be-sanctified
claims:
  - where: opening
    claim: 'Lev. 10:3 is a Niphal first-person singular of qadash, the LORD speaking'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'אֶקָּדֵ֔שׁ'
  - where: opening
    claim: 'Lev. 22:32 is the only other Niphal first-person form (waw + perfect)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וְ/נִ֨קְדַּשְׁתִּ֔י'
  - where: opening
    claim: 'The participle "the LORD who sanctifies you/him/them" stands seven times (20:8; 21:8, 15, 23; 22:9, 16, 32)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'מְקַדִּשְׁ/כֶֽם'
  - where: opening
    claim: 'Connection made by this page: Lev. 10:3 and Lev. 22:32 set beside each other as the two places where the LORD says He will be sanctified/hallowed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/22?lang=eng'
    quote: 'but I will be hallowed among the children of Israel: I am the LORD which hallow you'
  - where: 'section “Made holy by another''s hand”'
    claim: 'The verb in chapter 8 is Piel with Moses as subject'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וַֽיְקַדֵּ֖שׁ'
  - where: 'section “Made holy by another''s hand”'
    claim: 'Holiness is extrinsic because its source is Yahweh'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'is extrinsic rather than intrinsic because it has its ultimate source in Yahweh.'
  - where: 'section “I will be sanctified”'
    claim: 'Keil reads 10:3 as the LORD sanctifying Himself by judgment where the priests neglected the anointing sanctification'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/10.htm'
    quote: 'that they might sanctify Him in their office and life. If they neglected this sanctification, He sanctified Himself in them by a penal judgment'
  - where: 'section “I will be sanctified”'
    claim: 'The Church footnote on "held" (Lev. 10:3) sends to D&C 101:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'For all those who will not endure chastening, but deny me, cannot be sanctified.'
  - where: 'section “Sanctify yourselves”'
    claim: 'At 11:44 and 20:7 the verb is Hitpael (reflexive) with Israel as subject'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וְ/הִֽתְקַדִּשְׁתֶּ֔ם'
  - where: 'section “Sanctify yourselves”'
    claim: 'Strathearn on Lev. 11:43-44'
    key: strathearn-holiness-lord
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/holiness-lord-personal-temple-worship'
    quote: 'God’s greatest desire for his people is that they become as he is.'
  - where: 'section “I am the LORD which sanctify you”'
    claim: 'The sevenfold participle'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'מְקַדְּשָׁ/ם'
  - where: 'section “I am the LORD which sanctify you”'
    claim: 'Elsewhere Israel hallows the priest (21:8) and a man sanctifies (Hiphil) his own house or field (27:14–26)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'יַקְדִּישׁ'
  - where: 'section “I am the LORD which sanctify you”'
    claim: 'Israel hallows the priest (21:8), the holy things (22:2–3), the jubilee year (25:10); the high priest hallows the altar (16:19)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וְ/קִדַּשְׁתֶּ֗ם'
  - where: 'section “I am the LORD which sanctify you”'
    claim: 'God is the source of holiness and primary agent of sanctification'
    key: strathearn-holiness-lord
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/holiness-lord-personal-temple-worship'
    quote: 'the primary agent of sanctification'
  - where: 'section “I am the LORD which sanctify you”'
    claim: 'JST Lev. 22:9 adds a condition (Bowen)'
    key: bowen-law-codes
    url: 'https://rsc.byu.edu/creation-sinai/i-will-give-judgment-unto-him-writing'
    quote: 'the addition emphasizes that the blessing of sanctification is conditional upon obedience'
  - where: 'section “I will be hallowed”'
    claim: 'Phrases after the verb differ: b-qrovai vs b-tokh bnei Yisrael'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וְ/נִ֨קְדַּשְׁתִּ֔י'
  - where: 'section “I will be hallowed”'
    claim: 'Connection made by this page: Lev. 22:32 set beside Lev. 10:3; same speaker says it of Himself, and in the same verse "I am the LORD which hallow you"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/10?lang=eng'
    quote: 'I will be sanctified in them that come nigh me, and before all the people I will be glorified. And Aaron held his peace.'
  - where: 'section “Sanctified by His offering”'
    claim: 'Topical Guide lists Lev. 10:3 and 11:44 in one entry with Heb. 10:10, 13:12, Moro. 10:33, D&C 20:31, 76:41'
    key: tg-sanctification
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/sanctification?lang=eng'
    quote: 'sanctify yourselves, and ye shall be holy'
  - where: 'section “Sanctified by His offering”'
    claim: 'Guide to the Scriptures defines sanctification'
    key: gs-sanctification
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/sanctification?lang=eng'
    quote: 'The process of becoming free from sin, pure, clean, and holy through the Atonement of Jesus Christ'
  - where: 'section “Sanctified by His offering”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary (Mosiah 3:8; 15:1; 3 Ne. 15:1–5). Usually, when the word Lord appears in the Old Testament, it means “Jehovah.”'
  - where: 'section “Sanctified by His offering”'
    claim: 'Footnote on "without" at Heb. 13:12 sends to Lev. 4:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/13?lang=eng'
    quote: 'Jesus also, that he might sanctify the people with his own blood, suffered without the gate.'
