    claim: 'Lev. 8:12, 30 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/8?lang=eng'
    quote: 'And he poured of the anointing oil upon Aaron’s head, and anointed him, to sanctify him.'
  - where: 'section “Anointed him, to sanctify him”'
    claim: 'Piel with Moses as subject five times in ch. 8 (8:10, 11, 12, 15, 30); 8:12 lĕqaddĕšô (HR/Vpc/Sp3ms), 8:30 wayqaddēš (HC/Vpw3ms)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'לְ/קַדְּשֽׁ/וֹ'
  - where: 'section “Anointed him, to sanctify him”'
    claim: 'Lev. 8:1, 5, 36 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/8?lang=eng'
    quote: 'So Aaron and his sons did all things which the Lord commanded by the hand of Moses.'
  - where: 'section “Anointed him, to sanctify him”'
    claim: 'Ex. 29:43–44 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'I will sanctify also both Aaron and his sons, to minister to me in the priest’s office.'
  - where: 'section “Anointed him, to sanctify him”'
