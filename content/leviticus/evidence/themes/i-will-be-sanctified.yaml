  # ---------- section “I the LORD, which sanctify you, am holy” ----------
  - where: 'section “I the LORD, which sanctify you, am holy”'
    claim: 'Cambridge, introduction to Lev. 21: the refrain “I am the Lord which sanctify (hallow)” at 21:8, 15, 23; 22:9, 16, 32 indicates H'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/21.htm'
    quote: 'the refrain, ‘I am the Lord which sanctify (hallow)’ (Leviticus 21:8; Leviticus 21:15; Leviticus 21:23, Leviticus 22:9; Leviticus 22:16; Leviticus 22:32) indicate H'
  - where: 'section “I the LORD, which sanctify you, am holy”'
    claim: 'Lev. 21:8, 15, 23 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/21?lang=eng'
    quote: 'Thou shalt sanctify him therefore; for he offereth the bread of thy God: he shall be holy unto thee: for I the Lord, which sanctify you, am holy.'
  - where: 'section “I the LORD, which sanctify you, am holy”'
    claim: 'Lev. 22:9, 16 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/22?lang=eng'
    quote: 'They shall therefore keep mine ordinance, lest they bear sin for it, and die therefore, if they profane it: I the Lord do sanctify them.'
  - where: 'section “I the LORD, which sanctify you, am holy”'
    claim: 'Cambridge on 21:23 “my sanctuaries”: the plural may refer to the sacred building and its surroundings'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/21.htm'
    quote: 'The plural may have reference to the sacred building and its surroundings, as in Jeremiah 51:51.'
