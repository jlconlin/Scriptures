  - where: 'section “Sanctify yourselves … I am the LORD which sanctify you”'
    claim: 'Hitpael at 11:44 and 20:7 (HC/Vtq2mp); 20:8 mĕqaddišĕkem, piel participle (HVprmsc/Sp2mp), the first in Leviticus of seven (20:8; 21:8, 15, 23; 22:9, 16, 32)'
    key: oshb-wlc
