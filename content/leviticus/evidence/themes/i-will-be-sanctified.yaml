    key: keil-exodus
    url: 'https://biblehub.com/commentaries/kad/exodus/29.htm'
    quote: 'and it (Israel) shall be sanctified through My glory'
  - where: 'section “Anointed him, to sanctify him”'
    claim: 'Cambridge on Ex. 29:43: tent, altar and priests hallowed by the power of Jehovah’s sanctifying presence'
    key: cambridge-exodus
    url: 'https://biblehub.com/commentaries/cambridge/exodus/29.htm'
    quote: 'Tent, altar, and priests (v. 44) will alike be hallowed by the power of Jehovah’s sanctifying presence.'
  - where: 'section “Anointed him, to sanctify him”'
    claim: 'Student Manual 14-22 on Lev. 8–9'
    key: ot-manual-lev-1-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-1-10-a-law-of-performances-and-ordinances-part-1-sacrifices-and-offerings?lang=eng'
    quote: 'These chapters record the actual setting apart of Aaron and his sons and the sanctification of the tabernacle that were commanded in Exodus 28–29.'
  - where: 'section “Anointed him, to sanctify him”'
    claim: 'Keil, introduction to Lev. 8–10: consecration (8), entrance on office (9), “the sanctification of their priesthood by the judgment of God” (10)'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/8.htm'
    quote: 'the sanctification of their priesthood by the judgment of God'
  # ---------- section “I will be sanctified in them that come nigh me” ----------
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'Lev. 10:1–3 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/10?lang=eng'
    quote: 'This is it that the Lord spake, saying, I will be sanctified in them that come nigh me, and before all the people I will be glorified. And Aaron held his peace.'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'Keil on 10:3: the LORD had not communicated the words by revelation but made the fact known by the position assigned to Aaron and his sons; sanctified them by anointing that they might sanctify Him; if they neglected it, He sanctified Himself in them by a penal judgment'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/10.htm'
    quote: 'sanctified them to Himself by anointing (Leviticus 8:10, Leviticus 8:12; Exodus 29:1, Exodus 29:44; Exodus 40:13, Exodus 40:15), that they might sanctify Him in their office and life. If they neglected this sanctification, He sanctified Himself in them by a penal judgment'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'Keil on 10:3: “had not communicated to Moses by revelation the words” / “had made the fact known by the position assigned to Aaron and his sons”'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/10.htm'
    quote: 'Jehovah had not communicated to Moses by revelation the words which he spoke here, but had made the fact known by the position assigned to Aaron and his sons'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'Cambridge on 10:3: quotation in poetical parallelism; He shews Himself holy in punishing those who approach improperly'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/10.htm'
    quote: 'The words seem to be a quotation and are in poetical parallelism: “In them that come nigh me I will shew myself holy, And before all the people I will glorify myself.” The sense is that the priests are those who have the right to approach God, and He shews Himself holy in punishing those who do it improperly.'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'Pulpit on 10:3: sanctified either by the obedience or by the punishment of those that come nigh him'
    key: pulpit-leviticus
    url: 'https://biblehub.com/commentaries/pulpit/leviticus/10.htm'
    quote: 'God will be sanctified either by the obedience or by the punishment of those that come nigh him, that is, his priests.'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'Keil on 10:3: the niphal is reflexive, not passive, “I will sanctify Myself in him that is nigh to Me”'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/10.htm'
    quote: 'consequently אקּדשׁ is to be taken in a reflective and not in a passive sense'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'Ellicott on 10:3: “Better. I will sanctify myself in them that come near to me”'
    key: ellicott-leviticus
    url: 'https://biblehub.com/commentaries/ellicott/leviticus/10.htm'
    quote: 'I will sanctify myself in them that come near to me'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'BDB niphal sense 2, “be honoured or treated as sacred”: Lev. 10:3 (parallel nikbad) and 22:32 (opposed to profaning the name); sense 1 “shew oneself sacred, majestic” for Isa. 5:16; Ezek. 20:41; 28:22, 25; 36:23; 38:16; 39:27'
    key: bdb
    url: 'https://biblehub.com/hebrew/6942.htm'
    quote: 'be honoured or treated as sacred'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'BDB niphal sense 1 “shew oneself sacred, majestic”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6942.htm'
    quote: 'shew oneself sacred, majestic'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'Bowen’s translation of 10:3 in two parallel lines, and the near-synonymy of sanctify and glorify here and in Ezek. 28:22'
    key: bowen-thy-will
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/thy-will-be-done'
    quote: 'Through those who come unto me I will be sanctified / and before all the people I will be glorified'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'Bowen: 10:3 and Ezek. 28:22 suggest some equivalence between “sanctify” and “glorify”'
    key: bowen-thy-will
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/thy-will-be-done'
    quote: 'suggest some equivalence between the terms “sanctify” (i.e., to make holy) and “glorify.”'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'Num. 20:12–13 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'because the children of Israel strove with the Lord, and he was sanctified in them'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'Num. 20:13 wayyiqqādēš, niphal (HC/VNw3ms); 20:12 lĕhaqdîšēnî, hiphil infinitive “to sanctify me”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וַ/יִּקָּדֵ֖שׁ'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'Keil on Num. 20:13'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/20.htm'
    quote: 'God sanctified Himself on them, by the fact that, on the one hand, He put their unbelief to shame by the miraculous gift of water, and on the other hand punished Moses and Aaron for the weakness of their faith.'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'Student Manual 18-13 on Num. 20:12: the Lord chided Moses and Aaron for their failure to sanctify Him in the eyes of the people'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'failure to sanctify Him in the eyes of the people'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'Connection made by this page: Num. 20:12–13 set beside Lev. 10:3 (20:12 hiphil “to sanctify me,” 20:13 niphal as 10:3): in both the LORD is sanctified when those set nearest fail to sanctify Him before the people, and in both the failure is Aaron’s; at the rock the people also received water; BDB files 20:13 under sense 1, not with 10:3; no source read sets the two together'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'Because ye believed me not, to sanctify me in the eyes of the children of Israel'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'Footnote 10:3a is on “held” → D&C 101:5; there is no footnote on “sanctified”; D&C 101:5 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'For all those who will not endure chastening, but deny me, cannot be sanctified.'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'Connection made by this page: the footnote on “held” → D&C 101:5 read from Aaron’s side, the one who holds his peace under the judgment is the one in whom the sanctifying can go on (the inference is the page’s; the footnote only cross-references)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/10?lang=eng'
    quote: 'And Aaron held his peace.'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'Christofferson (Apr. 2011) quotes D&C 101:5 of the chastening that refines and prepares'
    key: christofferson-chasten
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2011/04/as-many-as-i-love-i-rebuke-and-chasten?lang=eng'
    quote: 'the very experience of enduring chastening can refine us and prepare us for greater spiritual privileges'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'Keil on 10:3: an admonition to the whole nation to sanctify God continually'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/10.htm'
    quote: 'an admonition to all who heard it, not to Aaron only but to the whole nation, to sanctify God continually in the proper way'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'Pulpit on 10:3 lists Ex. 19:22; 28:41; 29:44; Lev. 8:33 for “This is that the Lord spake”'
    key: pulpit-leviticus
    url: 'https://biblehub.com/commentaries/pulpit/leviticus/10.htm'
    quote: 'This is that the Lord spake (see Exodus 19:22; Exodus 28:41; Exodus 29:44; Leviticus 8:33)'
  - where: 'section “I will be sanctified in them that come nigh me”'
    claim: 'BDB files Num. 20:13 under niphal sense 1 (“shew oneself sacred”), not with 10:3'
    key: bdb
    url: 'https://biblehub.com/hebrew/6942.htm'
    quote: 'compare Numbers 20:13 (P)'
