  - where: 'section “Accept of the punishment”'
    claim: 'Connection made by this page: 1:4 and 26:41 use ratsah in two senses; at the altar a substitute was accepted and the man accepted for its sake; in exile, with nothing to bring, the same verb is used of a people who, confessing and humbled, accept (on BDB’s reading, pay off) the punishment of their iniquity, and the LORD answers not by accepting an offering but by refusing to abhor them; no source joins the two verses, and no intent is attributed to Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'if then their uncircumcised hearts be humbled, and they then accept of the punishment of their iniquity'
