page: accepted-for-him
claims:
  - where: 'opening'
    claim: '“Accepted” (1:4) is ratsah (H7521)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'נִרְצָ֥ה'
