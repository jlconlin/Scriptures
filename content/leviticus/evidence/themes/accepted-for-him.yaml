  - where: 'section “The offering and the heart”'
    claim: 'Connection made by this page: what the exiles of Lev. 26:41 could do was confess and, humbled, accept the punishment of their iniquity; what 2 Ne. 2:7 says Christ does is answer the ends of the law (the punishment affixed, on the manuals’ reading) for those with a broken heart and a contrite spirit; read together, the punishment the exiles accepted is what Lehi says Christ answers for the broken-hearted, the sinner’s part is still what Leviticus 26 left it, and the substitute’s part, which the exiles had no animal to carry, is Christ’s; no source joins Lev. 26:41 to 2 Ne. 2:7 or 3 Ne. 9:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/2?lang=eng'
    quote: 'he offereth himself a sacrifice for sin, to answer the ends of the law, unto all those who have a broken heart and a contrite spirit'
  - where: 'section “A broken heart and a contrite spirit”'
    claim: 'What a broken heart is'
    key: gs-broken-heart
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/broken-heart?lang=eng'
    quote: 'To have a broken heart is to be humble, contrite, repentant, and meek—that is, receptive to the will of God.'
  - where: 'section “A broken heart and a contrite spirit”'
    claim: 'The gift Christ accepts is the gift of oneself'
    key: christofferson-converted
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2004/04/when-thou-art-converted?lang=eng'
    quote: 'In reality, it is the gift of yourself—what you are and what you are becoming.'
  - where: 'section “A broken heart and a contrite spirit”'
    claim: 'The sacrament replaced sacrifice, in remembrance of Christ’s offering'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'It is now replaced in the Church by the sacrament of the bread and the water, in remembrance of the offering of Jesus Christ.'
  - where: 'section “A broken heart and a contrite spirit”'
