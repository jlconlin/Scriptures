page: accepted-for-him
claims:
  - where: 'opening'
    claim: '“Accepted” (1:4) and “accept” (26:41) are one Hebrew verb (H7521)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'נִרְצָ֥ה'
  - where: 'opening'
    claim: '“Accept” in 26:41 is the same verb (H7521)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'יִרְצ֥וּ'
  - where: 'opening'
    claim: '“Confess” (Hithpael of H3034) at 5:5'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וְהִ֨תְוַדָּ֔ה'
  - where: 'opening'
    claim: '“Confess” at 16:21'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וְהִתְוַדָּ֣ה'
  - where: 'opening'
    claim: '“Confess” at 26:40; the verb stands in these three verses only in Leviticus'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וְהִתְוַדּ֤וּ'
  - where: 'opening'
    claim: 'Connection made by this page: Lev. 1:4, 5:5–13, 16:21–22 and 26:31–45 read in the book’s order as one sequence; no source joins them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'If they shall confess their iniquity, and the iniquity of their fathers'
  - where: 'section “Accepted for him”'
    claim: 'In the Hebrew the offering is the subject of “accepted”, “for him” the offerer'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'נִרְצָ֥ה'
  - where: 'section “Accepted for him”'
    claim: '“Voluntary will” (1:3) is H7522, the noun of the verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'לִרְצֹנ֖וֹ'
  - where: 'section “Accepted for him”'
    claim: 'The lexicon’s range for H7522 includes “acceptance” as well as “will”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7522.htm'
    quote: 'with ל person for acceptance for him before ׳י; with suffix person לרצנוֺ Leviticus 1:3'
  - where: 'section “Accepted for him”'
    claim: 'The offerings pointed Israel to Christ'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'these offerings pointed Israel to Jesus Christ and His atoning sacrifice'
  - where: 'section “Accepted for him”'
    claim: 'One reading of the hand on the head'
    key: lane-whole-meaning
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/whole-meaning-law'
    quote: 'The animal takes the place of the person in the sacrifice.'
  - where: 'section “Confess, then bring what he has”'
    claim: '5:5 is the first place of “confess”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וְהִ֨תְוַדָּ֔ה'
  - where: 'section “Confess, then bring what he has”'
    claim: 'Atonement could be made for crimes voluntarily confessed'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'crimes that a man voluntarily confessed, and for which he made (if possible) compensation (Lev. 5:5)'
  - where: 'section “All their iniquities on one head”'
    claim: '16:21 is the second place of “confess”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וְהִתְוַדָּ֣ה'
  - where: 'section “All their iniquities on one head”'
    claim: 'Connection made by this page: 5:5 (“he shall confess”) set beside 16:21 (“Aaron shall… confess”): the confession moves from the sinner, before he brings his offering (5:5–6), to the priest over one animal for all Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'And Aaron shall lay both his hands upon the head of the live goat, and confess over him all the iniquities of the children of Israel'
  - where: 'section “No altar, and “I will not cast them away”'
    claim: '“Sweet odours” (26:31) is H5207, the word of the offerings’ “sweet savour”, in 17 verses of Leviticus, 26:31 among them, 1:9 the first'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'נִיחֹֽחֲכֶֽם'
  - where: 'section “No altar, and “I will not cast them away”'
    claim: 'The Church’s edition glosses 26:31 “I will not accept your burnt offerings”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'IE I will not accept your burnt offerings.'
  - where: 'section “No altar, and “I will not cast them away”'
    claim: '26:40 is the third place of “confess”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וְהִתְוַדּ֤וּ'
  - where: 'section “No altar, and “I will not cast them away”'
    claim: 'The Church’s footnote at 26:41 “humbled” is Topical Guide “Contrite Heart”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'TG Contrite Heart.'
  - where: 'section “No altar, and “I will not cast them away”'
    claim: 'BDB: 1:4 “be accepted, of sacrifices”; 26:41 “satisfy (by paying off debt)”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7521.htm'
    quote: 'be accepted, of sacrifices, with ל person, Leviticus 1:4'
  - where: 'section “No altar, and “I will not cast them away”'
    claim: 'BDB sense for 26:41'
    key: bdb
    url: 'https://biblehub.com/hebrew/7521.htm'
    quote: '4 make acceptable, satisfy (by paying off debt)'
  - where: 'section “No altar, and “I will not cast them away”'
    claim: 'The promise to remember the covenant (26:42) is cited often toward the end of the Book of Mormon'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'This promise is cited often toward the end of the Book of Mormon'
  - where: 'section “No altar, and “I will not cast them away”'
    claim: 'Connection made by this page: 1:4 and 26:41 set beside each other by the shared verb; at the start an offering is accepted for the sinner, at the end the sinner has no offering and does the accepting'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'and they then accept of the punishment of their iniquity'
  - where: 'section “The offering, and the heart”'
    claim: 'Animal sacrifice ended with the death of Christ'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'Animal sacrifice ended with the death of Jesus Christ'
  - where: 'section “The offering, and the heart”'
    claim: 'Alma 34:14: the whole meaning of the law is pointing to the great and last sacrifice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/34?lang=eng'
    quote: 'this is the whole meaning of the law, every whit pointing to that great and last sacrifice'
  - where: 'section “The offering, and the heart”'
    claim: 'Connection made by this page: 26:41 “humbled” (footnote “Contrite Heart”) set beside 2 Ne. 2:7, “a broken heart and a contrite spirit”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/2?lang=eng'
    quote: 'unto all those who have a broken heart and a contrite spirit'
  - where: 'section “The offering, and the heart”'
    claim: 'Connection made by this page: the King James “accept” of 3 Ne. 9:19 set beside “accepted” of 1:4 and the gloss at 26:31 (English only)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'for I will accept none of your sacrifices and your burnt offerings'
  - where: 'section “The offering, and the heart”'
    claim: 'Guide to the Scriptures on a broken heart'
    key: gs-broken-heart
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/broken-heart?lang=eng'
    quote: 'To have a broken heart is to be humble, contrite, repentant, and meek—that is, receptive to the will of God.'
