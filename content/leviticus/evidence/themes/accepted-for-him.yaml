    quote: 'יִרְצ֥וּ'
  - where: 'opening'
    claim: 'Connection made by this page: read in the book’s order, 1:4, 5:5–13, 16:21–22 and 26:31–45 point toward the move from the offering to the offerer that came after Christ’s sacrifice: the thing brought shrinks while the confession stays, and when the altar is gone the text shows what the animal stood in for, a person confessing, humbled and not cast away; no source joins the four passages'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'and they then accept of the punishment of their iniquity'
  - where: 'section “Accepted for him”'
    claim: 'In 1:4 the offering is the subject of “accepted”; “for him” is the offerer'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'נִרְצָ֥ה'
  - where: 'section “Accepted for him”'
    claim: '“Voluntary will” (1:3) is ratson (H7522), the noun of the verb'
