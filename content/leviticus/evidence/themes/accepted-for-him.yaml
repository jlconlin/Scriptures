  - where: 'section “One goat for all”'
    claim: 'Connection made by this page: at 5:5 the sinner confesses his own sin over his own offering; at 16:21 Aaron confesses all Israel’s iniquities over one animal for all; read together, the book has already drawn the shape it gives to Christ, one bearer for everyone with the confession of everyone spoken over Him; no source compares 5:5 with 16:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'And Aaron shall lay both his hands upon the head of the live goat, and confess over him all the iniquities of the children of Israel'
