page: them-that-come-nigh-me
claims:
  - where: opening
    claim: 'Hebrews reads the single yearly entry as a sign that the way into the holiest was not yet made manifest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'The Holy Ghost this signifying, that the way into the holiest of all was not yet made manifest, while as the first tabernacle was yet standing:'
  - where: opening
    claim: 'Come, Follow Me on the goats: God provided another way'
    key: cfm-ot-2026-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/17-thoughts?lang=eng'
    quote: 'Sin must not be allowed in God’s presence. But rather than destroy or drive out the sinners, God provided another way—a goat would be killed or driven out instead.'
  - where: 'section “The fire that accepts, and the fire that devours”'
    claim: 'The strange fire is explained as fire not taken from the altar'
    key: bd-nadab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nadab?lang=eng'
    quote: 'struck dead for offering “strange” fire (fire not taken from the altar)'
  - where: 'section “The fire that accepts, and the fire that devours”'
    claim: 'qarab (H7126) occurs 102 times in Leviticus; 9:5 "drew near" is wayyiqrebu'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וַֽ/יִּקְרְבוּ'
  - where: 'section “The fire that accepts, and the fire that devours”'
    claim: '10:1 "offered" is wayyaqribu, from the same root H7126'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וַ/יַּקְרִ֜בוּ'
  - where: 'section “The fire that accepts, and the fire that devours”'
    claim: 'Connection made by this page: the people "drew near" (9:5) and the priests "offered" (10:1) are the same verb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/10?lang=eng'
    quote: 'offered strange fire before the LORD, which he commanded them not.'
  - where: 'section “Put outside, that they die not”'
    claim: 'Bible Dictionary: uncleanness was ceremonial, not morally evil; the unclean were cut off from the congregation'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'Uncleanness referred to being ceremonially or ritually unclean and should not be taken to mean that the touching of a dead body or the bearing of children was morally evil.'
  - where: 'section “Put outside, that they die not”'
    claim: 'Bible Dictionary: the unclean were cut off from the congregation'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'So long as a person was unclean he was cut off from the congregation.'
  - where: 'section “Put outside, that they die not”'
    claim: 'Guide to the Scriptures: spiritual sense of clean'
    key: gs-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/clean-and-unclean?lang=eng'
    quote: 'In a spiritual sense, to be clean is to be free from sin and sinful desires.'
  - where: 'section “Put outside, that they die not”'
    claim: 'KnoWhy 479 joins physical and spiritual uncleanness'
    key: sc-knowhy-479
    url: 'https://scripturecentral.org/knowhy/how-is-the-day-of-atonement-understood-in-the-book-of-mormon'
    quote: 'then they would be cut off spiritually from God Himself for being spiritually unclean until that condition of impurity was removed.'
  - where: 'section “One way in, once a year”'
    claim: 'The day was the only occasion the high priest could enter the Holy of Holies'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'This day was unique because it was the only occasion when the high priest could enter the Holy of Holies, the most sacred area of the tabernacle.'
  - where: 'section “One way in, once a year”'
    claim: '16:16 "remaineth" is shoken (H7931 participle)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'הַ/שֹּׁכֵ֣ן'
  - where: 'section “One way in, once a year”'
    claim: '15:31 "tabernacle" is mishkan (H4908)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'מִשְׁכָּנִ֖/י'
  - where: 'section “One way in, once a year”'
    claim: 'Ex. 25:8 "dwell" is from the same verb H7931'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וְ/שָׁכַנְתִּ֖י'
  - where: 'section “One way in, once a year”'
    claim: 'Connection made by this page: 16:16 names "uncleanness" and "transgressions", and the tent "that remaineth among them" answers "my tabernacle that is among them" (15:31)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'because of the uncleanness of the children of Israel, and because of their transgressions in all their sins: and so shall he do for the tabernacle of the congregation, that remaineth among them in the midst of their uncleanness.'
  - where: 'section “The way into the holiest”'
    claim: 'Scripture Helps: the high priest who took blood through the veil foreshadowed Christ'
    key: scripture-helps-ex-35
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/16-exodus-35-40-leviticus-1-4-16-19?lang=eng'
    quote: 'the high priest who took the sacrificial blood through the veil foreshadowed Jesus Christ'
  - where: 'section “The way into the holiest”'
    claim: 'Tanner: Christ opened the sanctuary to all believers'
    key: tanner-advocate
    url: 'https://rsc.byu.edu/celebrating-easter/christ-our-advocate-high-priest'
    quote: 'Christ’s atoning sacrifice has opened the sanctuary of God to all believers.'
  - where: 'section “The way into the holiest”'
    claim: 'Come, Follow Me: the goats symbolized Christ, and God provided another way'
    key: cfm-ot-2026-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/17-thoughts?lang=eng'
    quote: 'the goats symbolized Jesus Christ, taking the place of the sinful people. Sin must not be allowed in God’s presence.'
  - where: 'section “The way into the holiest”'
    claim: 'Connection made by this page: the manual’s "destroy" and "drive out" set beside "devoured"/"that they die not" and "without the camp"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/13?lang=eng'
    quote: 'he shall dwell alone; without the camp shall his habitation be.'
  - where: 'section “The way into the holiest”'
    claim: 'Bible Dictionary: uncleanness was not moral evil'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'should not be taken to mean that the touching of a dead body or the bearing of children was morally evil'
  - where: 'section “One way in, once a year”'
    claim: 'The annual ceremony allowed God’s presence to remain among the people (what the shoken/mishkan connection shows)'
    key: cfm-ot-2026-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/17-thoughts?lang=eng'
    quote: 'This allowed God’s presence to remain among the people.'
  - where: 'section “The way into the holiest”'
    claim: 'The live goat was driven out of the camp of Israel'
    key: cfm-ot-2026-tabernacle
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/17-thoughts?lang=eng'
    quote: 'The goat was then driven out of the camp of Israel.'
  - where: 'section “The fire that accepts, and the fire that devours”'
    claim: 'Connection made by this page: chapter 9 brings "that which Moses commanded" (9:5); the sons bring fire "which he commanded them not" (10:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/9?lang=eng'
    quote: 'And they brought that which Moses commanded before the tabernacle of the congregation: and all the congregation drew near and stood before the LORD.'
