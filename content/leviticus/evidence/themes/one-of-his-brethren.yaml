page: one-of-his-brethren
claims:
  - where: 'opening'
    claim: 'Christ is the Redeemer who paid the price'
    key: gs-redeemer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/redeemer?lang=eng'
    quote: 'Jesus Christ is the great Redeemer of mankind because He, through His Atonement, paid the price for the sins of mankind and made possible the resurrection of all people.'
  - where: 'section “Strangers with the LORD”'
    claim: 'Israel were not actual owners of the land but strangers and sojourners in the LORD’s land'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/25.htm'
    quote: 'were not actual owners or full possessors'
  - where: 'section “The kinsman who buys back”'
    claim: 'The verb ga’al: act as kinsman; in 25:48–49 redeeming from bondage'
    key: bdb
    url: 'https://biblehub.com/hebrew/1350.htm'
    quote: 'act as kinsman, do the part of next of kin'
  - where: 'section “The kinsman who buys back”'
    claim: 'In 25:48–49 the verb is used of redeeming from bondage'
    key: bdb
    url: 'https://biblehub.com/hebrew/1350.htm'
    quote: 'in redeeming from bondage'
  - where: 'section “The kinsman who buys back”'
    claim: 'The go’el’s redemption is based on family relationship and redeemed enslaved family members'
    key: lane-redemption-gaal
    url: 'https://rsc.byu.edu/finding-christ-covenant-path/redemption-gaal'
    quote: 'It is based on familial relationship. The gōʾēl was the oldest male member of an extended family who had the familial obligation to restore that which had become unbalanced. The gōʾēl redeemed family members who had become enslaved for whatever reason.'
  - where: 'section “The price of his redemption”'
    claim: 'The Bible Dictionary names Lev. 25:48 as the redemption of a slave'
    key: bd-redemption
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/redemption?lang=eng'
    quote: 'of a slave, Lev. 25:48'
  - where: 'section “The price of his redemption”'
    claim: 'To redeem is to free a person from bondage by payment'
    key: gs-redeem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/redeem-redeemed-redemption?lang=eng'
    quote: 'to free a person from bondage by payment'
  - where: 'section “The price of his redemption”'
    claim: 'Under the law servants and property were redeemed by payment of money'
    key: curtis-redemption
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2011/10/redemption?lang=eng'
    quote: 'In Old Testament times, the law of Moses provided different ways that servants and property could be freed, or redeemed, by the payment of money (see Leviticus 25:29–32, 48–55).'
  - where: 'section “Whose servants they are”'
    claim: '“Redeem” in Ex. 6:6 is the verb ga’al, the verb of Lev. 25:48'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וְגָאַלְתִּ'
  - where: 'section “Whose servants they are”'
    claim: 'Lev. 25:48 has the same verb (ga’al)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'יִגְאָלֶ'
  - where: 'section “Whose servants they are”'
    claim: 'The LORD acted as de facto kinsman in freeing Israel from Egypt'
    key: spackman-atonement
    url: 'https://byustudies.byu.edu/article/the-israelite-roots-of-atonement-terminology'
    quote: 'already graciously acted as de facto kinsman in freeing Israel from slavery in Egypt'
  - where: 'section “Jesus Christ, the kinsman who paid”'
    claim: 'Jehovah is the go’el of Israel; his redemption grew from the family relationship of the covenants'
    key: lane-redemption-gaal
    url: 'https://rsc.byu.edu/finding-christ-covenant-path/redemption-gaal'
    quote: 'The Lord Jehovah is known throughout the Old Testament as the gōʾēl, the Redeemer of Israel.'
  - where: 'section “Jesus Christ, the kinsman who paid”'
    claim: 'Connection made by this page: Lev. 25:48 “one of his brethren may redeem him” set beside Heb. 2:11, 14–15, where Christ calls them brethren, took part of flesh and blood, and delivers those subject to bondage'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/2?lang=eng'
    quote: 'he is not ashamed to call them brethren'
  - where: 'section “Jesus Christ, the kinsman who paid”'
    claim: 'Connection made by this page: Lev. 25:51 “the price of his redemption… money” set beside 1 Pet. 1:18–19, a price that is not money'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/1?lang=eng'
    quote: 'ye were not redeemed with corruptible things, as silver and gold'
  - where: 'section “Jesus Christ, the kinsman who paid”'
    claim: 'Christ paid the price for the sins of mankind'
    key: gs-redeemer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/redeemer?lang=eng'
    quote: 'paid the price for the sins of mankind'
  - where: 'section “Jesus Christ, the kinsman who paid”'
    claim: 'If we repent we are forgiven, the price having been paid by our Redeemer'
    key: curtis-redemption
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2011/10/redemption?lang=eng'
    quote: 'if we repent, we can be forgiven of our sins, the price having been paid by our Redeemer'
  - where: 'section “Jesus Christ, the kinsman who paid”'
    claim: 'Connection made by this page: Lev. 25:47 “sell himself” set beside Isa. 52:3 “Ye have sold yourselves for nought; and ye shall be redeemed without money”, which holds both the verb “sold” (makar) and the verb “redeemed” (ga’al) of Lev. 25:47–48'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/52?lang=eng'
    quote: 'Ye have sold yourselves for nought; and ye shall be redeemed without money.'
  - where: 'section “Jesus Christ, the kinsman who paid”'
    claim: 'The verb “sell” in Lev. 25:47 is makar (H4376)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וְנִמְכַּ'
  - where: 'section “Jesus Christ, the kinsman who paid”'
    claim: 'The verb “sold” in Isa. 52:3 is makar (H4376)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'נִמְכַּרְתֶּ'
  - where: 'section “Jesus Christ, the kinsman who paid”'
    claim: 'The verb “redeemed” in Isa. 52:3 is ga’al (H1350)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'תִּגָּאֵ'
  - where: 'section “Jesus Christ, the kinsman who paid”'
    claim: 'The risen Lord speaks the words of Isa. 52:3 in 3 Ne. 20:38'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/20?lang=eng'
    quote: 'Ye have sold yourselves for naught, and ye shall be redeemed without money.'
