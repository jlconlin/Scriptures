chapter: 2
claims:
  - where: 'when'
    claim: 'The tabernacle was set up in the first month of the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And it came to pass in the first month in the second year, on the first day of the month, that the tabernacle was reared up.'
  - where: 'when'
    claim: 'The laws of the offerings were given at Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'Which the Lord commanded Moses in mount Sinai, in the day that he commanded the children of Israel to offer their oblations unto the Lord, in the wilderness of Sinai.'
  - where: 'setting'
    claim: 'Leviticus 1–7 give the rules for the sacrifices offered in the court of the altar'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'The seven opening chapters of Leviticus set forth the rules regarding the sacrifices offered in the Court of the Altar, the first area encountered in the tabernacle.'
  - where: 'setting'
    claim: 'The grain offering could not go with a sin offering, but no burnt or peace offering was complete without it'
    key: bd-meat-offering
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/meat-offering?lang=eng'
    quote: 'The Minchah could not be offered with a sin offering, but no burnt or peace offering was complete without it.'
  - where: 'setting'
    claim: 'Its name could stand for the whole morning or evening sacrifice'
    key: bd-meat-offering
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/meat-offering?lang=eng'
    quote: 'It was such an important part of the daily burnt offering that the term is sometimes used to denote the whole morning or evening sacrifice (2 Kgs. 3:20).'
  - where: 'setting'
    claim: 'Every burnt offering or vowed or freewill sacrifice was to be brought with a grain offering of flour and oil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/15?lang=eng'
    quote: 'Then shall he that offereth his offering unto the Lord bring a meat offering of a tenth deal of flour mingled with the fourth part of an hin of oil.'
  - where: 'thread'
    claim: 'One older reading: in the grain offerings the Israelite offered his daily bread to the Lord'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/2.htm'
    quote: 'there can be no doubt that in them the Israelite offered his daily bread to the Lord'
  - where: 'note 2:1 “A meat offering of flour”'
    claim: '“Meat” is used in the older sense of food'
    key: bd-meat-offering
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/meat-offering?lang=eng'
    quote: 'Hebrew minchah. The English word meat in this context is used in the older sense of “food.”'
  - where: 'note 2:1 “A meat offering of flour”'
    claim: 'The Hebrew word in 2:1 is minḥah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'מִנְחָה֙'
  - where: 'note 2:1 “A meat offering of flour”'
    claim: 'Minḥah means gift, tribute, offering'
    key: bdb
    url: 'https://biblehub.com/hebrew/4503.htm'
    quote: 'מִנְחָה153 noun feminine gift, tribute, offering'
  - where: 'note 2:1 “A meat offering of flour”'
    claim: 'It is used for tribute, including Judges 3:15'
    key: bdb
    url: 'https://biblehub.com/hebrew/4503.htm'
    quote: '2 tribute Judges 3:15,17,18'
  - where: 'note 2:1 “A meat offering of flour”'
    claim: 'As an offering to God it can be of any kind, grain or animals, as in Genesis 4'
    key: bdb
    url: 'https://biblehub.com/hebrew/4503.htm'
    quote: '3 offering made to God, of any kind, whether grain or animals Genesis 4:3,4,5'
  - where: 'note 2:1 “A meat offering of flour”'
    claim: 'The King James “meat offering” is misleading; it is a grain offering, and in the priestly laws always means that'
    key: bdb
    url: 'https://biblehub.com/hebrew/4503.htm'
    quote: 'AV meat offering, misleading < RV meal-offering'
  - where: 'note 2:1 “A meat offering of flour”'
    claim: 'In the priestly laws the word always means the grain offering'
    key: bdb
    url: 'https://biblehub.com/hebrew/4503.htm'
    quote: '5 grain-offering, always with this meaning in P'
  - where: 'note 2:1 “A meat offering of flour”'
    claim: 'The word is used of gifts made to men, as in Genesis 43:11'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The word Minchah, used frequently of gifts made to men (Gen. 43:11), and occasionally of bloody offerings (Gen. 4:4), specially denotes an unbloody or meal offering.'
  - where: 'note 2:1 “Oil and frankincense”'
    claim: 'Frankincense is the resin of Boswellia, imported from Arabia, an ingredient in the holy incense'
    key: bd-frankincense
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/frankincense?lang=eng'
    quote: 'The fragrant resinous exudation of various species of Boswellia; it was imported into Judea from Arabia (Isa. 60:6; Jer. 6:20). It was an ingredient in the holy incense for sacrificial purposes (Ex. 30:34)'
  - where: 'note 2:1 “Oil and frankincense”'
    claim: 'The Student Manual reads oil as the Holy Ghost, grain as the word of God, frankincense as prayer'
    key: ot-manual-lev-1-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-1-10-a-law-of-performances-and-ordinances-part-1-sacrifices-and-offerings?lang=eng'
    quote: 'Oil was used in the scriptures to symbolize the Holy Ghost (see D&C 45:56–57), grain to symbolize the word of God (see Mark 4:14), and frankincense to symbolize prayer (see Revelation 8:3).'
  - where: 'note 2:1 “Oil and frankincense”'
    claim: 'The manual: as man lives physically by bread, so spiritually in Christ by the word and Spirit through prayer'
    key: ot-manual-lev-1-10
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/leviticus-1-10-a-law-of-performances-and-ordinances-part-1-sacrifices-and-offerings?lang=eng'
    quote: 'As man was meant to live physically by eating bread, so too was he meant to live spiritually in Christ by partaking of the word and Spirit of the Lord through prayer.'
  - where: 'note 2:1 “Oil and frankincense”'
    claim: 'KnoWhy: the Book of Mormon idiom of pouring out the whole soul makes sense in light of the grain offering, where oil was poured on the flour'
    key: sc-knowhy-467
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-mormon-say-we-must-worship-god-with-our-whole-soul'
    quote: 'The idea of a person pouring out their whole soul makes sense when understood in light of the grain offering. As an essential part of this offering, the worshipper had to “pour” oil onto the pile of flour (Leviticus 2:2).'
  - where: 'note 2:1 “Oil and frankincense”'
    claim: 'Enos 1:9 and Mosiah 26:14 speak of pouring out the whole soul to God'
    key: sc-knowhy-467
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-mormon-say-we-must-worship-god-with-our-whole-soul'
    quote: 'Enos 1:9 and Mosiah 26:14 state that people poured out their whole souls to God.'
  - where: 'note 2:2 “The memorial: the part that goes up”'
    claim: 'The Hebrew word in 2:2 is ʾazkarah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'אַזְכָּרָתָ/הּ֙'
  - where: 'note 2:2 “The memorial: the part that goes up”'
    claim: 'Uses of the word: the shewbread’s frankincense, the grain offering, and the meal of the very poor as a sin offering'
    key: bdb
    url: 'https://biblehub.com/hebrew/234.htm'
    quote: 'used of the frankincense burned for the shew-bread'
  - where: 'note 2:2 “The memorial: the part that goes up”'
    claim: 'Uses of the word: the grain offering and the meal of the very poor as a sin offering'
    key: bdb
    url: 'https://biblehub.com/hebrew/234.htm'
    quote: 'of the meal used as חַטָּאת by the very poor Leviticus 5:12'
  - where: 'note 2:2 “The memorial: the part that goes up”'
    claim: 'ʾAzkarah comes from zakar, remember, and means a reminder'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/234.htm'
    quote: 'From zakar; a reminder'
  - where: 'note 2:3 “Most holy: the priests’ bread”'
    claim: 'The rest of the grain offering was eaten by Aaron and his sons with unleavened bread in the court'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/6?lang=eng'
    quote: 'And the remainder thereof shall Aaron and his sons eat: with unleavened bread shall it be eaten in the holy place; in the court of the tabernacle of the congregation they shall eat it.'
  - where: 'note 2:3 “Most holy: the priests’ bread”'
    claim: 'Only the males of Aaron’s line ate it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/6?lang=eng'
    quote: 'All the males among the children of Aaron shall eat of it.'
  - where: 'note 2:3 “Most holy: the priests’ bread”'
    claim: 'The priests had no inheritance in the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/18?lang=eng'
    quote: 'Thou shalt have no inheritance in their land, neither shalt thou have any part among them: I am thy part and thine inheritance among the children of Israel.'
  - where: 'note 2:3 “Most holy: the priests’ bread”'
    claim: 'The remainder was usually eaten by the priests in a holy place'
    key: bd-meat-offering
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/meat-offering?lang=eng'
    quote: 'Part was placed on the altar of burnt offering; the remainder was usually eaten by the priests in a holy place (Lev. 6:14–18, 23; Mal. 1:11).'
  - where: 'note 2:3 “Most holy: the priests’ bread”'
    claim: 'Part was burned and the remainder given to the priests'
    key: gee-last-sacrifice
    url: 'https://rsc.byu.edu/behold-lamb-god/great-last-sacrifice'
    quote: 'Part was burned on the altar (Leviticus 2:2, 8–9, 16) and the remainder given to the priests (see Leviticus 2:3, 10).'
  - where: 'note 2:11 “Why no leaven or honey”'
    claim: 'Leaven was usually a lump of old dough, and was probably forbidden for its association with corruption'
    key: bd-leaven
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leaven?lang=eng'
    quote: 'Anything that in cooking produces fermentation, a lump of old dough being generally used.'
  - where: 'note 2:11 “Why no leaven or honey”'
    claim: 'Leaven was probably forbidden because associated with corruption'
    key: bd-leaven
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leaven?lang=eng'
    quote: 'It was probably forbidden because there was associated with it the idea of corruption.'
  - where: 'note 2:11 “Why no leaven or honey”'
    claim: 'One older reading: leaven and honey are named together because both ferment; honey was used to make vinegar'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/2.htm'
    quote: 'Leaven and honey are mentioned together as things which produce fermentation. Honey has also an acidifying or fermenting quality, and was even used for the preparation of vinegar'
  - where: 'note 2:11 “Why no leaven or honey”'
    claim: 'Leaven and honey were excluded from the grain offering as fermenting substances'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'Leaven and honey, as fermenting substances, were excluded from its preparation.'
  - where: 'note 2:11 “Why no leaven or honey”'
    claim: 'One older reading of verse 12: leaven and honey may be offered as firstfruits but not on the altar'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/2.htm'
    quote: 'As an offering of first-fruits ye may offer them (leaven and honey, i.e., pastry made with them) to Jehovah, but they shall not come upon the altar.'
  - where: 'note 2:11 “Why no leaven or honey”'
    claim: 'At the feast of weeks two loaves baked with leaven are the firstfruits'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/23?lang=eng'
    quote: 'they shall be of fine flour; they shall be baken with leaven; they are the firstfruits unto the Lord.'
  - where: 'note 2:11 “Why no leaven or honey”'
    claim: 'The leavened loaves go to the priest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/23?lang=eng'
    quote: 'they shall be holy to the Lord for the priest.'
  - where: 'note 2:13 “The salt of the covenant”'
    claim: 'The priests’ portions are a covenant of salt for ever'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/18?lang=eng'
    quote: 'by a statute for ever: it is a covenant of salt for ever before the Lord unto thee and to thy seed with thee.'
  - where: 'note 2:13 “The salt of the covenant”'
    claim: 'The kingdom was given to David’s line for ever by a covenant of salt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/13?lang=eng'
    quote: 'gave the kingdom over Israel to David for ever, even to him and to his sons by a covenant of salt?'
  - where: 'note 2:13 “The salt of the covenant”'
    claim: 'The lexicon lists the covenant of salt in Numbers 18:19 and 2 Chronicles 13:5 with Leviticus 2:13'
    key: bdb
    url: 'https://biblehub.com/hebrew/4417.htm'
    quote: 'offering Leviticus 2:13 (3 t. in verse) compare Ezekiel 43:24; בְּרִית מֶ֫לַח Numbers 18:19; 2Chronicles 13:5 (compare Leviticus 2:13 see Di)'
  - where: 'note 2:13 “The salt of the covenant”'
    claim: 'One older reading: in common life salt was the symbol of covenant, treaties being made by eating bread and salt together'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/2.htm'
    quote: 'because in common life salt was the symbol of covenant; treaties being concluded and rendered firm and inviolable'
  - where: 'note 2:13 “The salt of the covenant”'
    claim: 'One older reading: the parties to an alliance ate bread and salt together as a sign of the treaty'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/2.htm'
    quote: 'by the parties to an alliance eating bread and salt together, as a sign of the treaty which they had made'
  - where: 'note 2:13 “The salt of the covenant”'
    claim: 'One older reading: a covenant of salt was an indissoluble covenant; salt preserves food from corruption'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/2.htm'
    quote: 'equivalent to an indissoluble covenant'
  - where: 'note 2:13 “The salt of the covenant”'
    claim: 'One older reading: salt preserves food from putrefaction and corruption'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/2.htm'
    quote: 'with its power to strengthen food and preserve it from putrefaction and corruption'
  - where: 'note 2:13 “The salt of the covenant”'
    claim: 'The covenant of salt (Lev. 2:13) has been set beside the Savior’s “salt of the earth” (Matt. 5:13; 3 Ne. 12:13)'
    key: asay-salt
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1980/04/salt-of-the-earth-savor-of-men-and-saviors-of-men?lang=eng'
    quote: 'In the Old Testament mention is made of a “covenant of salt” (see Lev. 2:13; Num. 18:19; 2 Chr. 13:5). In the New Testament the Savior referred to his disciples as the “salt of the earth,” and charged them to retain their savor (Matt. 5:13).'
  - where: 'note 2:13 “The salt of the covenant”'
    claim: 'The same address goes on to D&C 101:39–40, on those who covenant being the salt of the earth'
    key: asay-salt
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1980/04/salt-of-the-earth-savor-of-men-and-saviors-of-men?lang=eng'
    quote: 'and covenant with an everlasting covenant, they are accounted as the salt of the earth and the savor of men;'
  - where: 'note 2:14 “Firstfruits roasted in the ear”'
    claim: 'In 1828 English “corn” still meant all kinds of grain; American custom applied it to maize'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/corn'
    quote: 'In this sense, the word comprehends all the kinds of grain which constitute the food of men and horses. In Great Britain, corn is generally applied to wheat, rye, oats and barley. In the United States, it has the same general sense, but by custom, it is appropriated to maiz.'
  - where: 'note 2:14 “Firstfruits roasted in the ear”'
    claim: 'The Hebrew word in 2:14 is ʾaviv'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'אָבִ֞יב'
  - where: 'note 2:14 “Firstfruits roasted in the ear”'
    claim: 'ʾAviv means fresh, young ears of barley, as in Exodus 9:31'
    key: bdb
    url: 'https://biblehub.com/hebrew/24.htm'
    quote: '1 fresh, young ears of barley Exodus 9:31; indefinite Leviticus 2:14'
  - where: 'note 2:14 “Firstfruits roasted in the ear”'
    claim: 'The “beaten corn” is crushed grain, groats or grits'
    key: bdb
    url: 'https://biblehub.com/hebrew/1643.htm'
    quote: 'a crushing, but only concrete of that which is crushed, groats, grits'
  - where: 'note 2:14 “Firstfruits roasted in the ear”'
    claim: 'The grain offering of firstfruits is grain in the ear parched with fire, with oil and frankincense'
    key: bdb
    url: 'https://biblehub.com/hebrew/4503.htm'
    quote: 'grain in the ear parched with fire, with oil and frankincense Leviticus 2:14,15.'
  - where: 'note 2:14 “Firstfruits roasted in the ear”'
    claim: 'Firstfruits belonged to God, offered by the nation at the feasts and by individuals at other times'
    key: bd-firstfruits
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstfruits?lang=eng'
    quote: 'Regarded as belonging to God, and offered by the nation as a whole at the great feasts, and by private individuals at other times'
  - where: 'note 2:14 “Firstfruits roasted in the ear”'
    claim: 'Leviticus 2:12–16 is among the rules for private offerings of firstfruits; the national sheaf of barley is Lev. 23:10–14'
    key: bd-firstfruits
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstfruits?lang=eng'
    quote: 'Rules with regard to private offerings of firstfruits are found in Ex. 23:16; Lev. 2:12–16'
  - where: 'note 2:14 “Firstfruits roasted in the ear”'
    claim: 'The nation’s firstfruits included the sheaf of barley waved on the morrow of the Passover sabbath'
    key: bd-firstfruits
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstfruits?lang=eng'
    quote: '(1) the waving before the Lord of a sheaf of barley on the morrow of the Passover Sabbath (Lev. 23:10–14)'
  - where: 'christ'
    claim: 'Of the daily offering: the finest flour, and the Savior called the Bread of Life, who nourishes and gives daily strength'
    key: ot-minute-ex-25
    url: 'https://scripturecentral.org/archive/books/book-chapter/exodus-25-31'
    quote: 'The flour offered at the temple was to be the finest flour, ground down and sifted until it was the highest quality. The Savior is called the Bread of Life (John 6:35), meaning that He nourishes us and gives us daily strength as we work to become more like Him.'
  - where: 'christ'
    claim: 'One older reading: the grain offerings were symbols of spiritual food, from the true bread of life, the word of God'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/2.htm'
    quote: 'the meat-offerings cannot have denoted merely the sanctification of earthly food, but were symbols of the spiritual food prepared and enjoyed by the congregation of the Lord.'
  - where: 'christ'
    claim: 'One older reading: spiritual life is nourished only from the true bread of life, the word of God'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/2.htm'
    quote: 'from the true bread of life, or the word of God'
  - where: 'explore'
    claim: 'The “pure offering” of Malachi 1:11 is a minḥah'
    key: bdb
    url: 'https://biblehub.com/hebrew/4503.htm'
    quote: 'compare מנחה טהורה Malachi 1:11'
