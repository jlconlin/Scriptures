chapter: 4
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The tabernacle was set up in the first month of the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And it came to pass in the first month in the second year, on the first day of the month, that the tabernacle was reared up.'
  - where: 'when'
    claim: 'The laws of the offerings were given at Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'Which the LORD commanded Moses in mount Sinai, in the day that he commanded the children of Israel to offer their oblations unto the LORD'
  - where: 'setting'
    claim: 'Chapter 4 opens a new speech of the LORD to Moses; the previous one began at 1:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/1?lang=eng'
    quote: 'And the LORD called unto Moses, and spake unto him out of the tabernacle of the congregation, saying,'
  - where: 'setting'
    claim: 'The burnt offerings of chapter 1 are freewill offerings'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Some sacrifices are burnt offerings of animals from the Israelites’ cattle, herds, and flocks (verses 2–17), made as freewill offerings brought to the door of the sanctuary.'
  - where: 'setting'
    claim: 'With chapter 4 the book turns to the sacrifices for sins, the sin offering of chapter 4 and the trespass offering after it'
    key: gee-last-sacrifice
    url: 'https://rsc.byu.edu/behold-lamb-god/great-last-sacrifice'
    quote: 'After this point we move into what Josephus terms the sacrifices for sins.[21] The first of these is the hattā’t, or sin offering, which is discussed in the fourth chapter of Leviticus.'
  - where: 'setting'
    claim: 'The trespass offering of chapter 5 is the second sacrifice for sins'
    key: gee-last-sacrifice
    url: 'https://rsc.byu.edu/behold-lamb-god/great-last-sacrifice'
    quote: 'Asham: The Trespass Offering. The second type of sacrifice for sins is the ‘ašām, or trespass offering.'
  - where: 'thread'
    claim: 'The seriousness and procedure of the sin offering depend on the status of the sinner'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'The seriousness of and procedures involved with the various sin offerings depend on the status of the sinner and whether it was a sin of ignorance or negligence (verse 2).'
  - where: 'thread'
    claim: 'For the high priest and the congregation the blood goes before the veil and on the incense altar; otherwise on the altar of burnt offering'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'It was sprinkled against the veil seven times and put upon the horns of the altar of incense in the sin offerings of the high priest and the whole congregation.'

  # ---------- notes ----------
  - where: 'note 4:2 “Sin through ignorance”'
    claim: 'The Hebrew noun means a sin of error or inadvertence, opposed to sins of intention; it is also used of unintended killing'
    key: bdb
    url: 'https://biblehub.com/hebrew/7684.htm'
    quote: 'שְׁגָגָה noun feminine sin of error, inadvertence; … error (opposed to sins of intention, or בְּיָד רָמָה)'
  - where: 'note 4:2 “Sin through ignorance”'
    claim: 'The same word is used of unintended killing (the cities of refuge)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7684.htm'
    quote: '׳מַכֵּהנֶֿפֶשׁ בִּשׁ of unintended killing Numbers 35:11,15 = Joshua 20:3,9'
  - where: 'note 4:2 “Sin through ignorance”'
    claim: 'The Hebrew of 4:2 has bishgagah, “in error”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'בִ/שְׁגָגָה֙'
  - where: 'note 4:2 “Sin through ignorance”'
    claim: 'Atonement could be made for unintentional sins, but sins with a high hand did not admit of expiation'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'Sins committed with a high hand, and for which the punishment was death, did not admit of expiation under the Mosaic law (Num. 15:30–31). Atonement could be made for (1) unconscious, unintentional sins (Lev. 4:2, 22, 27; 5:15, 17)'
  - where: 'note 4:2 “Sin through ignorance”'
    claim: 'Atonement could also be made for crimes voluntarily confessed (Lev. 5:5)'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: '(3) crimes that a man voluntarily confessed, and for which he made (if possible) compensation (Lev. 5:5).'
  - where: 'note 4:2 “Sin through ignorance”'
    claim: 'The chapter''s sin has been described as one of ignorance or negligence'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'whether it was a sin of ignorance or negligence (verse 2).'
  - where: 'note 4:2 “Sin through ignorance”'
    claim: 'Numbers 15 gives the offering for the one who sins ignorantly and cuts off the one who sins presumptuously'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/15?lang=eng'
    quote: 'But the soul that doeth ought presumptuously, whether he be born in the land, or a stranger, the same reproacheth the Lord; and that soul shall be cut off from among his people.'

  - where: 'note 4:3 “The sin offering, or the purification offering”'
    claim: 'In 4:3 “his sin” and “sin offering” are the same Hebrew noun, chatta''t'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'לְ/חַטָּֽאת'
  - where: 'note 4:3 “The sin offering, or the purification offering”'
    claim: 'The lexicon gives the noun both senses, sin and sin offering, and lists this chapter under “for sin”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2403.htm'
    quote: 'חַטָּאת noun feminine … sin, sin-offering'
  - where: 'note 4:3 “The sin offering, or the purification offering”'
    claim: 'The lexicon lists Lev. 4:3, 28, 35 under “for sin”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2403.htm'
    quote: 'for sin Leviticus 4:3,28,35; Leviticus 5:6,13 (P)'
  - where: 'note 4:3 “The sin offering, or the purification offering”'
    claim: 'The fundamental idea of the sin offering was atonement, expiation, before fellowship with Jehovah'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The fundamental idea of the sin and trespass offerings was atonement, expiation. They implied that there was a sin, or some uncleanness akin to a sin, that needed atoning for before fellowship with Jehovah could be obtained.'
  - where: 'note 4:3 “The sin offering, or the purification offering”'
    claim: 'A modern translation calls it the purification offering'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+4&version=NRSVUE'
    quote: 'he shall offer for the sin that he has committed a bull of the herd as a purification offering to the Lord.'
  - where: 'note 4:3 “The sin offering, or the purification offering”'
    claim: 'One scholar: the hatta''t must be rendered purification offering, and it does not purge the offerer'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'The hatta’t must be rendered as “purification (or purgation) offering” [2] and it leads automatically to the question: Whom or what does it purge? Herein lies the first surprise: it is not the offerer of the sacrifice.'
  - where: 'note 4:3 “The sin offering, or the purification offering”'
    claim: 'The blood is the ritual detergent, used in the sanctuary and never applied to a person'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'The hatta’t blood, then, is the purging element, the ritual detergent. Its use is confined to the sanctuary, but it is never applied to a person.'
  - where: 'note 4:3 “The sin offering, or the purification offering”'
    claim: 'The priest purges the sanctuary on behalf of the person whose inadvertent offense contaminated it'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'the priest purges the most sacred objects and areas of the sanctuary on behalf of the person who caused their contamination by his physical impurity or inadvertent offense.'
  - where: 'note 4:3 “The sin offering, or the purification offering”'
    claim: 'The sanctuary needs constant purification lest God abandon it'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'Thus the sanctuary needs constant purification lest the resident god abandons it together with his devotees.'

  - where: 'note 4:3 “The anointed priest, whose sin falls on the people”'
    claim: '“The priest that is anointed” is a title of the high priest in Lev. 4'
    key: bdb
    url: 'https://biblehub.com/hebrew/4899.htm'
    quote: '2 high priest of Israel, הַכֹּהֵן הַמָּשִׁיחַ, Leviticus 4:3,5,16; Leviticus 6:15 (P)'
  - where: 'note 4:3 “The anointed priest, whose sin falls on the people”'
    claim: 'The Greek renders the anointed priest with christos; the Aramaic Targum Onqelos has “the high priest”'
    key: gee-last-sacrifice
    url: 'https://rsc.byu.edu/behold-lamb-god/great-last-sacrifice'
    quote: 'which is חישמה ןהכה (hammāšîah) in Hebrew and ὁ ἱερεὺς ὁ χριστος ὁ τετελειωμένος τὰς χεῖρας (Christos) in Greek. … while the Targum Onqelos oddly omits mention of the Messiah and instead has the high priest (אנהכ אבר)'
  - where: 'note 4:3 “The anointed priest, whose sin falls on the people”'
    claim: 'Targum Onkelos was the Aramaic version in use in Jesus''s day'
    key: gee-last-sacrifice
    url: 'https://rsc.byu.edu/behold-lamb-god/great-last-sacrifice'
    quote: 'the Aramaic of Targum Onkelos, the Aramaic version in use in Jesus’s day'
  - where: 'note 4:3 “The sin offering, or the purification offering”'
    claim: 'On this reading the object of the purgation is what receives the blood, the sanctuary'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'that which receives the purgative blood, i.e., the sanctuary and its sancta.'
  - where: 'note 4:3 “The anointed priest, whose sin falls on the people”'
    claim: 'A modern translation: his sin brings guilt on the people'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+4&version=NRSVUE'
    quote: '“If it is the anointed priest who sins, thus bringing guilt on the people, he shall offer for the sin that he has committed a bull of the herd'
  - where: 'note 4:3 “The anointed priest, whose sin falls on the people”'
    claim: 'The Greek translation: so as to cause the people to sin'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/leviticus/4.htm'
    quote: '3if the anointed priest sin so as to cause the people to sin, then shall he bring for his sin, which he has sinned, an unblemished calf of the herd to the Lord for his sin.'
  - where: 'note 4:3 “The anointed priest, whose sin falls on the people”'
    claim: 'The priest has committed or is responsible for a sin of the people'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Thus, if an anointed priest has committed or is responsible for a sin of the people against God, he must offer a bull and sprinkle its blood seven times before the veil of the temple (verses 3–12).'
  - where: 'note 4:3 “The anointed priest, whose sin falls on the people”'
    claim: 'A young bullock was the sin offering for priests as individuals or as representatives of the people'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The sin offering was a young bullock for priests as individuals or as representatives of the people'

  - where: 'note 4:6 “How far the blood is carried”'
    claim: 'Blood of the ordinary sin offering went on the horns of the altar of burnt offering; for high priest and congregation before the veil and on the incense altar; on the Day of Atonement on the mercy seat; the rest poured at the base'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'It was sprinkled against the veil seven times and put upon the horns of the altar of incense in the sin offerings of the high priest and the whole congregation. It was also sprinkled on the front of the mercy seat in the sin offering of the Day of Atonement.'
  - where: 'note 4:6 “How far the blood is carried”'
    claim: 'An individual''s inadvertence pollutes the outer altar'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'The individual’s inadvertent misdemeanor or severe physical impurity pollutes the courtyard altar, which is purged by daubing its horns with the hatta’t blood (Leviticus 4:25, 30; 9:9 ff.).'
  - where: 'note 4:6 “How far the blood is carried”'
    claim: 'The high priest''s or community''s inadvertence pollutes the shrine'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'The inadvertent misdemeanor of the high priest or the entire community pollutes the shrine, which is purged by the high priest by placing the hatta’t blood on the inner altar and before the paroket-veil (Leviticus 4:5–7, 16–18).'
  - where: 'note 4:6 “How far the blood is carried”'
    claim: 'Wanton unrepented sin pierces the veil, and its purging waits for the Day of Atonement'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'The wanton, unrepented sin not only pollutes the outer altar and penetrates into the shrine but it pierces the veil to the holy ark and kapporet, the very throne of God'
  - where: 'note 4:6 “How far the blood is carried”'
    claim: 'The wanton sinner''s pollution awaits the annual purgation on the Day of Atonement'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'the pollution wrought by his offense must await the annual purgation of the sanctuary on the Day of Atonement [9]'
  - where: 'note 4:6 “How far the blood is carried”'
    claim: 'Severity of sin varies with the depth of its penetration into the sanctuary'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'the severity of the sin-impurity varies in direct relation to the depth of its penetration into the sanctuary.'
  - where: 'note 4:6 “How far the blood is carried”'
    claim: 'A sin offering whose blood is brought into the tabernacle is not eaten but burned; otherwise the priest eats it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/6?lang=eng'
    quote: 'And no sin offering, whereof any of the blood is brought into the tabernacle of the congregation to reconcile withal in the holy place, shall be eaten: it shall be burnt in the fire.'

  - where: 'note 4:14 “Brought when the sin comes to light”'
    claim: 'A sin offering was made only after learning that a sin had been committed'
    key: gee-last-sacrifice
    url: 'https://rsc.byu.edu/behold-lamb-god/great-last-sacrifice'
    quote: 'One only made a sin offering after learning that a sin was committed (Leviticus 4:14, 23, 28).'
  - where: 'note 4:14 “Brought when the sin comes to light”'
    claim: 'A modern translation renders the verb “incur guilt,” and the “or” of 4:23 as “once”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Leviticus+4&version=NRSVUE'
    quote: 'and incurs guilt,(M) 23 once the sin that he has committed is made known to him, he shall bring as his offering a male goat without blemish.'
  - where: 'note 4:14 “Brought when the sin comes to light”'
    claim: '“Are guilty” in 4:13 is the verb ''asham (H816)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'וְ/אָשֵֽׁמוּ'
  - where: 'note 4:14 “Brought when the sin comes to light”'
    claim: 'One scholar: the offender feels guilty, and so has undergone inner purification'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'The fact that his sin is inadvertent (bišegagah) [3] and that he feels guilty (weašem) [4] means that he has undergone inner purification.'
  - where: 'note 4:14 “Brought when the sin comes to light”'
    claim: 'His act is forgiven because of inadvertence and remorse; what needs purging is the sanctuary'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'his act is forgiven because of the offender’s inadvertence and remorse—but because of the consequence of his act. His inadvertence has contaminated the sanctuary and it is his responsibility to purge it with a hatta’t.'

  - where: 'note 4:20 “Forgiven through the offering, and through Christ”'
    claim: 'The formula for the sinner ends “that he may be forgiven”; for the impure, “he shall be clean”'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'whereas for the impure person the formula reads, we kipper hakkohen . . . wetaher (ah), “the priest shall perform the purgation rite . . . and he [she] shall be clean” (e.g., Leviticus 12:6, 8; 14:9, 20). Thus the impure person needs purification and the sinner needs forgiveness.'
  - where: 'note 4:20 “Forgiven through the offering, and through Christ”'
    claim: 'Abinadi: salvation does not come by the law alone'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/13?lang=eng'
    quote: 'salvation doth not come by the law alone; and were it not for the atonement, which God himself shall make for the sins and iniquities of his people, that they must unavoidably perish, notwithstanding the law of Moses.'
  - where: 'note 4:20 “Forgiven through the offering, and through Christ”'
    claim: 'Hebrews: the blood of bulls and goats cannot take away sins'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/10?lang=eng'
    quote: 'For it is not possible that the blood of bulls and of goats should take away sins.'

  - where: 'note 4:22 “Offerings scaled to the sinner”'
    claim: 'Nasi means one lifted up, a chief, and is used of the rulers of the congregation, including Lev. 4:22'
    key: bdb
    url: 'https://biblehub.com/hebrew/5387.htm'
    quote: 'I. נָשִׂיא128 noun masculine one lifted up, i.e. a chief prince'
  - where: 'note 4:22 “Offerings scaled to the sinner”'
    claim: 'The lexicon lists Lev. 4:22 among the rulers of the congregation'
    key: bdb
    url: 'https://biblehub.com/hebrew/5387.htm'
    quote: '4 rulers of the congregation, נְשִׂיאֵי הָעֵדָה Exodus 16:22; … Leviticus 4:22'
  - where: 'note 4:22 “Offerings scaled to the sinner”'
    claim: 'The Hebrew of 4:22 has nasi'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'נָשִׂ֖יא'
  - where: 'note 4:22 “Offerings scaled to the sinner”'
    claim: 'One who cannot afford a lamb brings two turtledoves or two young pigeons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/5?lang=eng'
    quote: 'And if he be not able to bring a lamb, then he shall bring for his trespass, which he hath committed, two turtledoves, or two young pigeons, unto the LORD'
  - where: 'note 4:22 “Offerings scaled to the sinner”'
    claim: 'The higher the responsibility, the more serious the infraction and the larger the reparation'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'The higher the person’s level of responsibility, the more serious the infraction and therefore the larger the necessary reparation.'

  # ---------- christ / explore ----------
  - where: 'christ'
    claim: 'Hebrews: the bodies of beasts whose blood is brought into the sanctuary are burned without the camp; Jesus suffered without the gate'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/13?lang=eng'
    quote: 'For the bodies of those beasts, whose blood is brought into the sanctuary by the high priest for sin, are burned without the camp.'
  - where: 'christ'
    claim: 'Hebrews sets the blood of bulls and goats beside the blood of Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'How much more shall the blood of Christ, who through the eternal Spirit offered himself without spot to God, purge your conscience from dead works to serve the living God?'
  - where: 'christ'
    claim: 'King Benjamin: Christ''s blood atones for those who have ignorantly sinned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/3?lang=eng'
    quote: 'his blood atoneth for the sins of those who have fallen by the transgression of Adam, who have died not knowing the will of God concerning them, or who have ignorantly sinned.'
  - where: 'christ'
    claim: 'King Benjamin in Mosiah 3:11 apparently has the problem of unintended sin in mind'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'in Mosiah 3:11 King Benjamin says—apparently with this problem in mind—that the blood of Jesus Christ atones for unintended transgressions'
  - where: 'christ'
    claim: 'Hebrews: the high priest must offer for himself as for the people; Christ is holy and separate from sinners'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/7?lang=eng'
    quote: 'For such an high priest became us, who is holy, harmless, undefiled, separate from sinners, and made higher than the heavens;'
  - where: 'explore'
    claim: 'Milgrom''s essay reads the blood on the altar as the purging of the sanctuary'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'I shall limit myself to one ingredient, of one ritual, of one sacrifice: the blood of the hatta’t on the horns of the altar.'
