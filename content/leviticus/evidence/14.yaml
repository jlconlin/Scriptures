chapter: 14
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The law of leprosy is given by the Lord to Moses (and Aaron), as the rest of the Sinai law'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/14?lang=eng'
    quote: 'And the Lord spake unto Moses, saying,'
  - where: 'setting'
    claim: 'Chapter 13 leaves the leper living alone outside the camp'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/13?lang=eng'
    quote: 'he shall dwell alone; without the camp shall his habitation be.'
  - where: 'setting'
    claim: 'Chapter 14 gives the rites for a recovered leper to rejoin society and the inspection and cleansing of a house'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'After the disease’s disappearance, various sacrifices and cleansing rituals are required before the former leper can rejoin society.'
  - where: 'setting'
    claim: 'Jesus sent a healed leper to the priest to offer what Moses commanded'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/1?lang=eng'
    quote: 'shew thyself to the priest, and offer for thy cleansing those things which Moses commanded, for a testimony unto them.'
  - where: 'setting'
    claim: 'Jesus sent ten lepers to the priests'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/17?lang=eng'
    quote: 'Go shew yourselves unto the priests. And it came to pass, that, as they went, they were cleansed.'
  - where: 'thread'
    claim: 'One older reading: the rites signified restoration to life, removal of uncleanness and readmission to God’s presence, each answering to what the leper had lost (he was regarded as one dead)'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/14.htm'
    quote: 'The leper was regarded (1) as one dead (see on Leviticus 13:45 f.), (2) as unclean, (3) as smitten of God: hence the ceremonial indicated (1) restoration to life, (2) removal of uncleanness, (3) readmission to God’s presence.'
  - where: 'thread'
    claim: 'The chapter ends by naming its purpose'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/14?lang=eng'
    quote: 'To teach when it is unclean, and when it is clean: this is the law of leprosy.'

  # ---------- sections ----------
  - where: 'section 1 plain'
    claim: '“Scarlet” is scarlet dyed cloth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/14?lang=eng'
    quote: 'IE scarlet dyed cloth'
  - where: 'section 1 plain'
    claim: '“Running” (living) water is flowing, fresh water'
    key: bdb
    url: 'https://biblehub.com/hebrew/2416.htm'
    quote: 'feminine of water, flowing, fresh מים חיים Genesis 26:19 (J), Leviticus 14:5,6,50,51,52; Leviticus 15:13'
  - where: 'section 2 plain'
    claim: '“Three tenth deals” are three tenths of an ephah'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/14.htm'
    quote: 'three-tenths of an ephah of fine flour mixed with oil as a meat-offering'
  - where: 'section 4 plain'
    claim: '“Hollow strakes” are sunken areas; “fretting” is malignant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/14?lang=eng'
    quote: 'HEB malignant'
  - where: 'section 4 plain'
    claim: '“Hollow strakes” are sunken areas'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/14?lang=eng'
    quote: 'HEB sunken areas'
  - where: 'section 5 plain'
    claim: '“Scall” is a scaly disease'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/14?lang=eng'
    quote: 'HEB tinea or other scaly symptoms'

  # ---------- notes ----------
  - where: 'note 14:3 “The priest goes out to a man already healed”'
    claim: 'The rite begins only if the plague is already healed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/14?lang=eng'
    quote: 'And the priest shall go forth out of the camp; and the priest shall look, and, behold, if the plague of leprosy be healed in the leper;'
  - where: 'note 14:3 “The priest goes out to a man already healed”'
    claim: 'Biblical leprosy is the skin disease that made a person ritually unclean; ritual uncleanness mattered more than contagion'
    key: sc-leprosy
    url: 'https://scripturecentral.org/archive/books/book-chapter/leprosy'
    quote: 'biblical leprosy (Hebrew ṣa‘arat) refers to those skin diseases that rendered an individual ritually unclean under the law of Moses.'
  - where: 'note 14:3 “The priest goes out to a man already healed”'
    claim: 'Ritual uncleanness more important than contagion'
    key: sc-leprosy
    url: 'https://scripturecentral.org/archive/books/book-chapter/leprosy'
    quote: 'The ritual uncleanness was, from the biblical perspective, more important than potential contagiousness.'

  - where: 'note 14:4 “The two birds”'
    claim: 'A Latter-day Saint reading: the birds symbolized the candidate; the slain bird the natural man giving up his life, the freed bird freedom from sin'
    key: lund-types-symbols
    url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
    quote: 'The birds symbolized the candidate. Because of the two truths to be taught, two birds were required. The first bird was killed by the shedding of its blood, signifying that the leper (the natural man) had to give up his life.'
  - where: 'note 14:4 “The two birds”'
    claim: 'The second bird released signified freedom from the bondage of sin'
    key: lund-types-symbols
    url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
    quote: 'The second bird, after being bound together with other symbols, was released, signifying that the man had been freed from the bondage of sin.'
  - where: 'note 14:4 “The two birds”'
    claim: 'Cedar wood preserves from decay'
    key: lund-types-symbols
    url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
    quote: 'The cedar wood is still used today because of its ability to preserve surrounding objects from decay and corruption'
  - where: 'note 14:4 “The two birds”'
    claim: 'Scarlet wool a reminder of blood'
    key: lund-types-symbols
    url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
    quote: 'The word scarlet (Lev. 14:4) really meant a piece of wool dyed bright red, a reminder of blood, which is the symbol of life and also of atonement'
  - where: 'note 14:4 “The two birds”'
    claim: 'Hyssop associated with purification, reason uncertain'
    key: lund-types-symbols
    url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
    quote: 'Though we are not sure exactly why, we do know that in Old Testament times the herb hyssop was associated with purification'
  - where: 'note 14:4 “The two birds”'
    claim: 'One older reading: the rite was no true sacrifice; both birds were symbols of the leper; the slain bird showed the death he would have suffered but for God’s mercy'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/14.htm'
    quote: 'although it was no true sacrifice, since there was no sprinkling of blood in connection with it, its bloody death was intended to show that the leper would necessarily have suffered death on account of his uncleanness'
  - where: 'note 14:4 “The two birds”'
    claim: 'The same reading: the freed bird’s release represented his return to the fellowship of his nation'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/14.htm'
    quote: 'its release, to return to its fellows and into its nest, represented his deliverance from the ban of death which rested upon leprosy, and his return to the fellowship of his own nation.'
  - where: 'note 14:4 “The two birds”'
    claim: 'The “scarlet” is scarlet dyed cloth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/14?lang=eng'
    quote: 'IE scarlet dyed cloth'
  - where: 'note 14:4 “The two birds”'
    claim: 'The rite as the text gives it: one bird killed over water, the living bird dipped, the man sprinkled seven times, the bird let loose'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/14?lang=eng'
    quote: 'And he shall sprinkle upon him that is to be cleansed from the leprosy seven times, and shall pronounce him clean, and shall let the living bird loose into the open field.'

  - where: 'note 14:5 “Living water”'
    claim: 'The Hebrew of “running water” is mayim ḥayyim; the living bird of 14:6–7 has the same adjective (lemma 2416, haḥayyah)'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/2416.htm'
    quote: 'chay: Alive, living, life'
  - where: 'note 14:5 “Living water”'
    claim: 'The lexicon: ḥay of water, flowing, fresh, at Lev. 14:5–6, 50–52 and 15:13'
    key: bdb
    url: 'https://biblehub.com/hebrew/2416.htm'
    quote: 'feminine of water, flowing, fresh מים חיים Genesis 26:19 (J), Leviticus 14:5,6,50,51,52; Leviticus 15:13'
  - where: 'note 14:9 “Shaven like a newborn”'
    claim: 'A Latter-day Saint reading: shaving even the eyebrows made one look like a newborn, showing spiritual rebirth'
    key: lund-types-symbols
    url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
    quote: 'This act, including even the eyebrows, would make a person look very much like a newborn infant, who is typically virtually without hair. Thus, after going through the process of rebirth symbolically, the candidate graphically demonstrated on his own person that he was newborn spiritually.'
  - where: 'note 14:9 “Shaven like a newborn”'
    claim: 'The man shaves and washes before entering the camp and stays outside his tent seven days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/14?lang=eng'
    quote: 'and after that he shall come into the camp, and shall tarry abroad out of his tent seven days.'

  - where: 'note 14:12 “Why a trespass offering”'
    claim: 'One older reading: waving was not done with other sin and trespass offerings; by it the man was dedicated to the Lord’s service again, as the Levites were'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/14.htm'
    quote: 'By the waving, which did not take place on other occasions in connection with sin-offerings and trespass-offerings, the lamb and oil were transferred symbolically to the Lord'
  - where: 'note 14:12 “Why a trespass offering”'
    claim: 'Dedicated again to His service, as the Levites by waving'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/14.htm'
    quote: 'was dedicated to His service again, just as the Levites were dedicated to the Lord by the ceremony of waving (Numbers 8:11, Numbers 8:15).'
  - where: 'note 14:12 “Why a trespass offering”'
    claim: 'The trespass offering was required because the consecration restored the rights lost through leprosy'
    key: keil-leviticus
    url: 'https://biblehub.com/commentaries/kad/leviticus/14.htm'
    quote: 'But a trespass-offering was required as the consecration-offering, because the consecration itself served as a restoration to all the rights of the priestly covenant nation, which had been lost by the mortal ban of leprosy.'
  - where: 'note 14:12 “Why a trespass offering”'
    claim: 'For the poor the other offerings are reduced but not the guilt offering, the most important part of the rite'
    key: cambridge-leviticus
    url: 'https://biblehub.com/commentaries/cambridge/leviticus/14.htm'
    quote: 'the amount of the Meal-Offering is reduced, but the Guilt-Offering remains the same; a further indication that this sacrifice is the most important feature of the rite.'
  - where: 'note 14:12 “Why a trespass offering”'
    claim: 'The poor man still brings one lamb for a trespass offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/14?lang=eng'
    quote: 'then he shall take one lamb for a trespass offering to be waved, to make an atonement for him'

  - where: 'note 14:17 “Oil on the blood”'
    claim: 'A Latter-day Saint reading: the blood sanctified ear, hand and foot'
    key: lund-types-symbols
    url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
    quote: 'the blood of the lamb sanctifying the organ of hearing or obedience (the ear), the organ of action (the hand), and the organ of following or walking in the proper way (the foot).'
  - where: 'note 14:17 “Oil on the blood”'
    claim: 'The same reading: olive oil symbolizes the Holy Ghost (D&C 45:55–57); the oil the effect of the Spirit on the same organs'
    key: lund-types-symbols
    url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
    quote: 'Modern revelation further instructs us that olive oil symbolizes the Holy Ghost (see D&C 45:55–57). To touch with oil suggests the effect of the Spirit on the same organs of living and acting that had previously been cleansed by the blood of Christ.'
  - where: 'note 14:17 “Oil on the blood”'
    claim: 'Every aspect of life purified by the Atonement and the Holy Ghost'
    key: lund-types-symbols
    url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
    quote: 'Thus, every aspect of the candidate’s life was purified and sanctified by both the Atonement and the Holy Ghost.'
  - where: 'note 14:17 “Oil on the blood”'
    claim: 'The text: the rest of the oil is poured on his head and the priest makes atonement'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/14?lang=eng'
    quote: 'he shall pour upon the head of him that is to be cleansed: and the priest shall make an atonement for him before the Lord.'

  - where: 'note 14:34 “Leprosy in a house”'
    claim: 'Walls were said to be leprous when they had mildew or fungous growth'
    key: bd-leprosy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leprosy?lang=eng'
    quote: 'clothing and walls were said to be leprous when they had patches of mildew or some fungous growth, as in Lev. 13:47–59; 14:33–37.'
  - where: 'note 14:34 “Leprosy in a house”'
    claim: 'The house is emptied so that its contents are not made unclean; the owner reports what seems to him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/14?lang=eng'
    quote: 'that all that is in the house be not made unclean'
  - where: 'note 14:34 “Leprosy in a house”'
    claim: 'The text describes the plague in the walls'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/14?lang=eng'
    quote: 'if the plague be in the walls of the house with hollow strakes, greenish or reddish, which in sight are lower than the wall;'

  - where: 'note 14:53 “Atonement for a house”'
    claim: 'kippēr began as “rub, wipe,” in ritual “purge, purify,” and also came to mean “ransom”'
    key: spackman-atonement
    url: 'https://byustudies.byu.edu/article/the-israelite-roots-of-atonement-terminology'
    quote: 'Linguistically, kippēr began with very concrete meaning, something like “to rub, wipe,” which in a ritual setting led to “purge, purify,” as well as spinning off an entirely different meaning of “ransom,”'
  - where: 'note 14:53 “Atonement for a house”'
    claim: 'One scholar: two formulas, forgiveness for the inadvertent sinner, cleanness for the impure (citing Lev. 14:9, 20)'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'whereas for the impure person the formula reads, we kipper hakkohen . . . wetaher (ah), “the priest shall perform the purgation rite . . . and he [she] shall be clean” (e.g., Leviticus 12:6, 8; 14:9, 20). Thus the impure person needs purification and the sinner needs forgiveness.'
  - where: 'note 14:53 “Atonement for a house”'
    claim: 'The formula for the inadvertent sinner'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'we kipper hakkohen . . . wenislah lô, “the priest shall perform the purgation rite . . . that he may be forgiven”'
  - where: 'note 14:53 “Atonement for a house”'
    claim: 'The house rite ends with atonement and “it shall be clean”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/14?lang=eng'
    quote: 'and make an atonement for the house: and it shall be clean.'

  # ---------- christ / explore ----------
  - where: 'christ'
    claim: 'Jesus touched the leper and said, be thou clean'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/1?lang=eng'
    quote: 'put forth his hand, and touched him, and saith unto him, I will; be thou clean.'
  - where: 'christ'
    claim: 'Jesus touched the leper and sent him to the priest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/1?lang=eng'
    quote: 'shew thyself to the priest, and offer for thy cleansing those things which Moses commanded, for a testimony unto them.'
  - where: 'christ'
    claim: 'The ten lepers cleansed as they went'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/17?lang=eng'
    quote: 'Go shew yourselves unto the priests. And it came to pass, that, as they went, they were cleansed.'
  - where: 'christ'
    claim: 'Instances of Jesus curing leprosy'
    key: bd-leprosy
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leprosy?lang=eng'
    quote: 'Instances of Jesus curing leprosy are recorded in Matt. 8:2–4; Mark 1:40–45; Luke 5:12–15; 17:11–15.'
  - where: 'explore'
    claim: 'The article reads the leper’s cleansing in twelve aspects'
    key: lund-types-symbols
    url: 'https://rsc.byu.edu/literature-belief/old-testament-types-symbols'
    quote: 'This case is worth examining in some detail in its twelve major aspects:'
  - where: 'note 14:12 “Why a trespass offering”'
    claim: 'The trespass offering is brought for a trespass in the holy things of the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/5?lang=eng'
    quote: 'If a soul commit a trespass, and sin through ignorance, in the holy things of the Lord'
  - where: 'note 14:12 “Why a trespass offering”'
    claim: 'With amends and an added fifth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/5?lang=eng'
    quote: 'And he shall make amends for the harm that he hath done in the holy thing, and shall add the fifth part thereto'
