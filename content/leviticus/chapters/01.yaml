chapter: 1
title: The Burnt Offering
tagline: From the tent just raised, the LORD gives the first law of sacrifice. A bull, a sheep or goat, or a bird is brought, killed and burned whole on the altar, and accepted “to make atonement” for the one who brings it.
when: 'At Sinai, in the second year after the Exodus, just after the tabernacle was raised (Ex. 40:17; Lev. 1:1).'

setting: |
  Leviticus opens where Exodus ends. The tabernacle has just been raised and filled with the LORD's glory, so that Moses could not enter it ([[Ex. 40:34–35]]); now the LORD calls to him from inside it. With the sanctuary set up, the book gives the instructions for the ordinances performed there, and so it has very little story in it.

  The book gives its words as the LORD's to Moses from its first verse to its last: “These are the commandments, which the LORD commanded Moses for the children of Israel in mount Sinai” ([[Lev. 27:34]]). The Book of Mormon speaks of “the five books of Moses” on the brass plates ([[1 Ne. 5:11]]). A Latter-day Saint commentary holds that the book's material “developed from the theophany at Sinai and should be closely associated with Moses,” even if “its present form may not come directly or completely from his personal handwriting”; the scholars' view of its sources is taken up at [[Lev. 17:1]].

  Chapters 1–7 are the rules for the sacrifices offered in the court of the altar, the farthest an ordinary Israelite could go toward the Holy of Holies. Sacrifice is older than the law: Adam was commanded to “offer the firstlings of their flocks, for an offering unto the Lord” ([[Moses 5:5]]). Under Moses the offerings grew in number and kind, and this chapter gives the first of them, the burnt offering.

thread: |
  The chapter is one procedure told three times, from the costliest animal down to the cheapest: a bull from the herd (verses 3–9), a sheep or goat from the flock (verses 10–13), and a turtledove or young pigeon (verses 14–17). Each paragraph ends with the same words: “a burnt sacrifice, an offering made by fire, of a sweet savour unto the LORD.” The bird earns the same sentence as the bull.

  The work is shared between the worshiper and the priests. The worshiper brings the animal to the door of the tent, lays his hand on its head, kills it, skins it and cuts it up; the priests put the blood on the altar, lay the pieces on the fire and burn them. Other offerings left meat for the priests or for the worshiper's family to eat. This one went up whole.

  The law opens with “If any man of you bring an offering,” and it makes room for every purse: a family that could not afford a bull or a sheep could bring a bird (verse 14).

sections:
  - range: 1-2
    heading: The LORD speaks from the tent
    plain: |
      The LORD called to Moses and spoke to him from the tent of meeting. He said: “Tell the Israelites: When any of you brings an offering to the LORD, bring it from your livestock, from the herd or from the flock.
  - range: 3-9
    heading: A bull from the herd
    plain: |
      “If the offering is a burnt offering from the herd, he shall offer a male with no defect. He shall bring it of his own free will to the door of the tent of meeting, before the LORD. He shall lay his hand on the head of the burnt offering, and it will be accepted on his behalf, to make atonement for him.

      “He shall kill the young bull before the LORD, and the priests, Aaron's sons, shall bring the blood and sprinkle it all around the altar at the door of the tent. He shall skin the offering and cut it into its pieces. Aaron's sons shall put fire on the altar and lay wood in order on the fire, and the priests shall lay the pieces, the head and the fat, in order on the wood. He shall wash the entrails and the legs in water, and the priest shall burn all of it on the altar: a burnt offering, an offering made by fire, a pleasing aroma to the LORD.
  - range: 10-13
    heading: A sheep or a goat from the flock
    plain: |
      “If the burnt offering is from the flock, a sheep or a goat, he shall bring a male with no defect. He shall kill it on the north side of the altar before the LORD, and the priests, Aaron's sons, shall sprinkle its blood all around the altar. He shall cut it into its pieces, with its head and its fat, and the priest shall lay them in order on the wood on the fire. He shall wash the entrails and the legs with water, and the priest shall offer all of it and burn it on the altar: it is a burnt offering, an offering made by fire, a pleasing aroma to the LORD.
  - range: 14-17
    heading: A bird
    plain: |
      “If his burnt offering to the LORD is a bird, he shall bring a turtledove or a young pigeon. The priest shall bring it to the altar, wring off its head and burn it on the altar, and its blood shall be drained out against the side of the altar. He shall take away its crop with its feathers and throw it beside the altar on the east side, where the ashes are. He shall tear it open by the wings without dividing it in two, and the priest shall burn it on the altar, on the wood on the fire: it is a burnt offering, an offering made by fire, a pleasing aroma to the LORD.”

notes:
  - ref: 3
    phrase: burnt sacrifice
    kind: history
    title: The offering that goes up
    body: |
      The burnt offering is named for where it goes: up, as smoke, whole. Its Hebrew name, *ʿolah*, comes from *ʿalah*, “to ascend,” and reflects the way the offering “ascends into the divine realm,” while the English name reflects “that the entire animal or offering is burnt.” The Bible Dictionary ties the name to “the smoke of the sacrifice ascending to heaven” and makes the burning of the whole animal its characteristic rite.

      That is what sets it apart from the offerings in the chapters that follow. The fat of a sin offering was burned and the rest eaten by the priests; the fat of a peace offering was burned and the rest eaten by the worshiper's family at the sanctuary. The burnt offering, once its skin was taken off for the priest, was burned entire. The priest burns “all on the altar” ([[Lev. 1:9]]). Because the obligation to surrender to the LORD was constant, a burnt offering was also made for Israel twice every day, morning and evening; the priest's side of it is at [[Lev. 6:9]].

      For the same reason the offering can be called a “whole offering,” and one Latter-day Saint study hears it behind Amaleki's plea to “offer your whole souls as an offering unto him” ([[Omni 1:26]]): “Just as the whole animal was offered, we are to offer our ‘whole souls’ to God.” That is the study's reading of the connection; Amaleki does not name the burnt offering.
    sources: [belnap-dwell-among, bd-sacrifices, sc-knowhy-467]

  - ref: 3
    phrase: of his own voluntary will
    kind: words
    title: Willing, and accepted
    body: |
      The King James “of his own voluntary will” puts the weight on the offerer's choice; the Hebrew can also be read as a word about the result, and a modern translation reads it that way: “that he may be accepted before the Lord.” The word is *ratson*, “goodwill, favour, acceptance, will,” and the standard Hebrew lexicon lists this verse under “acceptance,” “for acceptance for him before” the LORD. *Ratson* comes from the verb “accept,” and that verb is the one in the next verse: “it shall be accepted for him.”

      The King James reading has support of its own, and the Church's reading follows it: by bringing offerings of their “own voluntary will,” the Israelites showed their commitment to God. Burnt offerings could be brought as freewill offerings, and the chapter begins “If any man of you bring an offering.” One Latter-day Saint study takes the phrase to mean that “the offerer willingly chose to be a part of the ritual process and was not forced to participate,” which “suggests that the efficacy of the rite was tied to the willingness of all participants.” “Will” is among the word's meanings too, so the Hebrew allows both readings.

      What made the animal acceptable is set down beside the phrase. It had to be “without blemish,” in Hebrew “whole, sound,” and the law later lists what disqualifies an animal ([[Lev. 22:19–25]]); Malachi condemns the man who “hath in his flock a male” and still sacrifices “a corrupt thing” ([[Mal. 1:14]]). It also had to be the offerer's own, “properly acquired.”
    sources: [bdb, oshb-wlc, esv, scripture-helps-ex-35, ot-minute-lev, belnap-dwell-among, bd-sacrifices, lds-scriptures]

  - ref: 4
    phrase: he shall put his hand upon the head of the burnt offering
    kind: symbol
    title: The hand on the animal's head
    body: |
      The text gives the gesture without explaining it, and faithful readers take it in two ways: as making the animal the offerer's substitute, or as marking it as his.

      The Bible Dictionary reads it as dedication and substitution: the laying on of hands “dedicated the animal to God and made it the sacrificer's representative and substitute.” One Latter-day Saint study reads it the same way, “The animal takes the place of the person in the sacrifice,” while warning that the reading of [[Lev. 17:11]] that supports it “is heavily debated” and that readers who take that verse differently “will have correspondingly different views on the role of substitutionary sacrifice in the law of Moses.”

      Another study sets out both views: “Some have suggested that the placing of the hand indicated that a substitution was to take place, the animal now representing the offerer; others believe that it simply indicated ownership.” It looks for light to Numbers 8, where the people put their hands on the Levites, who then serve the LORD in place of Israel's firstborn ([[Num. 8:10]], [[Num. 8:18]]). From that it concludes that “the laying of hands on another was a tangible transfer of representation.”

      The verse itself says only that the offering “shall be accepted for him to make atonement for him.” That Christ bore the sins of others, scripture teaches in its own words ([[Isa. 53:5–6]]; [[Alma 34:10–12]]). The high priest's two hands on the scapegoat, with confession, are a rite of their own ([[Lev. 16:21]]).
    sources: [bd-sacrifices, lane-whole-meaning, belnap-dwell-among]

  - ref: 4
    phrase: to make atonement for him
    kind: history
    title: What a burnt offering atoned for
    body: |
      The chapter names no sin, but the Church's heading to it reads these offerings as “an atonement for sins.” (The verb, *kipper*, and the mercy seat named from it are explained at [[Ex. 25:17]].)

      One Latter-day Saint study reads the chapter the same way: “a burnt offering was made for atonement—and more specifically, purging—after one had committed sin.” It notes that the priests' daily burnt offerings were meant “to cover all possible bases, whether the sin was known or not.” That study finds the difference in the Book of Mormon. When Lehi's family first camped by the Red Sea, he “made an offering” and gave thanks ([[1 Ne. 2:7]]); when his sons came back with the plates, and again when they came back with Ishmael's family, he offered “sacrifice and burnt offerings” ([[1 Ne. 5:9]]; [[1 Ne. 7:22]]). The study reads the first as a peace offering of thanks for a safe journey, and the later burnt offerings as “purging serious sins,” since both trips had been marked by the brothers' murmuring and rebellion.

      Another study draws a distinction between the offerings: the atonement “associated with the forgiveness of sins, reflected in the sin offering,” and “the atonement enacted not for sin or wrongdoing at all, such as in the case of the burnt offering,” which it counts among the rites of “reconciliation or restoration.” That is its reading. The verse itself says only that the offering is accepted “to make atonement for him.”
    sources: [lds-scriptures, brown-lehi-sacrifices, belnap-dwell-among]

  - ref: 5
    phrase: he shall kill the bullock before the LORD
    kind: history
    title: Who killed the animal
    body: |
      The worshiper killed his own offering; the priests took over at the blood. The Bible Dictionary counts six acts in every animal sacrifice and gives the third to the offerer: “The sacrificer himself slew his sacrifice (at the north side of the altar), and thus carried out actually the dedication to God that he had ceremonially expressed by the laying on of hands.” The chapter itself names the north side for the sheep or goat ([[Lev. 1:11]]). Only by a later custom did Levites or priests do the killing.

      The priests' part was the blood, which they sprinkled “round about upon the altar” ([[Lev. 1:5]]). The blood of the trespass, burnt and peace offerings was handled in that way, while the blood of a sin offering was smeared on the altar's horns. The blood stood for life, and its use on the altar, one study says, was “presumably affecting atonement.” Why the blood atones is the subject of [[Lev. 17:11]].

      With a bird the roles change. The priest himself wrings off its head and drains its blood against the side of the altar ([[Lev. 1:15]]).
    sources: [bd-sacrifices, belnap-dwell-among]

  - ref: 9
    phrase: of a sweet savour unto the LORD
    kind: symbol
    title: A pleasing aroma
    body: |
      Each of the chapter's three paragraphs ends by calling the smoke “a sweet savour unto the LORD”: the offering pleases Him, and He accepts it. The Hebrew words, and their tie to the word for “rest,” are explained at [[Gen. 8:21]], where Noah's burnt offering carries the same phrase.

      In the law of sacrifice the phrase is, in one older reading, “an anthropomorphic description of the divine satisfaction with the sacrifices offered, or the gracious acceptance of them on the part of God.” It speaks of God in human terms. It is not kept for the burnt offering. The fat of a sin offering is burned “for a sweet savour unto the LORD” as well ([[Lev. 4:31]]).
    sources: [keil-leviticus]

  - ref: 14
    phrase: of turtledoves, or of young pigeons
    kind: history
    title: An offering any family could bring
    body: |
      Birds let the poor bring the same offering as the rich. A burnt offering “might be made with male bullocks, rams, or he-goats without blemish; turtle-doves or pigeons of either sex in cases of poverty.” The law of sacrifice was meant as “a broad entry point,” its offerings brought “whether in sickness or in health, well-being or in impurity, in good standing with the Lord or in need of forgiveness.”

      The poor man's two birds, one for a sin offering and one for a burnt offering, are set out at [[Lev. 5:7]]. A mother who could not afford a lamb brought them after childbirth ([[Lev. 12:8]]), and Mary brought a “pair of turtledoves, or two young pigeons” when she and Joseph presented Jesus at the temple ([[Luke 2:24]]).
    sources: [bd-sacrifices, ot-minute-lev]

christ: |
  Sacrifice pointed to Christ from the beginning. Adam was told that his offering was “a similitude of the sacrifice of the Only Begotten of the Father, which is full of grace and truth” ([[Moses 5:7]]), and Amulek says of the whole law that it is “every whit pointing to that great and last sacrifice; and that great and last sacrifice will be the Son of God” ([[Alma 34:14]]). The New Testament uses this chapter's own terms for Him: He is “a lamb without blemish and without spot” ([[1 Pet. 1:19]]), and He “hath given himself for us an offering and a sacrifice to God for a sweetsmelling savour” ([[Eph. 5:2]]). The burnt offering, consumed whole, has been read as representing “all that he offered in order to bring about reconciliation.”

  When He came, the offerings ended. To the Nephites the risen Lord said, “your sacrifices and your burnt offerings shall be done away,” and asked instead for “a broken heart and a contrite spirit” ([[3 Ne. 9:19–20]]). The law of Moses was fulfilled, but “the law of Moses is not the same thing as the law of sacrifice.” The sacrament took the place of the ordinance of sacrifice, and so, in a sense, “the sacrifice changed from the offering to the offerer.” The offerings of the law are set out together, with what they pointed to, in [The Law and the Covenant](/old-testament/guides/law-and-covenant/#sacrifice).

