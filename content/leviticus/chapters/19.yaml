chapter: 19
title: Ye Shall Be Holy
tagline: The LORD calls all Israel to be holy as He is holy, and spells out what that means for parents, the harvest, the market, the courts, the body and the stranger, all under one refrain, “I am the LORD”; at the center stands “thou shalt love thy neighbour as thyself.”
when: 'At Sinai, in the second year after the Exodus'

setting: |
  Chapter 19 belongs to the part of Leviticus called the Holiness Code (chapters 17–26; the name is explained at [[Lev. 17]]), and it stands between the two chapters on forbidden unions, 18 and 20. In one Latter-day Saint reading of the book's shape, which follows the high priest inward through the tabernacle, the way into the holy place runs “between the twin pillars” of those two chapters and “through chapter 19, the epitome of the Holiness Code,” whose “central pinnacle” is the love of neighbor in verse 18.

  The words go “unto all the congregation of the children of Israel” ([[Lev. 19:2]]), not only to the priests. Read after the building of the tabernacle in Exodus 35–40, the chapter makes a point the tabernacle could not: a holy place does not by itself make a people holy, and these commandments were given to help Israel grow in holiness.

  Later scripture returns often to what one reading calls “the heart of the book of Leviticus.” The second great commandment of verse 18 is repeated often in the New Testament, and in the Book of Mormon Alma the Elder gives it to his people ([[Mosiah 23:15]]; see the note on verse 18).

thread: |
  The chapter is one command and its working out in ordinary life: “Ye shall be holy: for I the LORD your God am holy” ([[Lev. 19:2]]). The laws that follow can look like a list with no order, but they hang together once they are read as the working out of that command in verse 2. The first of them echo the Ten Commandments: verse 3 joins honoring parents with keeping the sabbath, verse 4 forbids images, and verse 11 joins stealing with false witness; verse 12 forbids swearing falsely by the LORD's name. The peace offering of verses 5–8 repeats a rule already given (see [[Lev. 7:18]]).

  That is the answer to the reader's question of why a law on haircuts sits beside the love of neighbor: laws of worship, of the body, of the field and of the market stand side by side, and every kind is set under the same refrain. “I am the LORD,” or “I am the LORD your God,” occurs fifteen times (verses 3, 4, 10, 12, 14, 16, 18, 25, 28, 30, 31, 32, 34, 36 and 37), a seal of the LORD's authority on each statute. In one Latter-day Saint reading, the Lord's first-person statements come here in “heightened density”: “some nine times in chapter 18, fifteen times in chapter 19, and thirteen times in chapter 20.”

  Verses 9–18 are about how an Israelite treats the poor, the hired man, the deaf and the blind, the court and the neighbor, and they end in “thou shalt love thy neighbour as thyself” ([[Lev. 19:18]]). Then “Ye shall keep my statutes” (verse 19) begins again; in one older reading those words “open the second series of commandments, which make it a duty on the part of the people of God to keep the physical and moral order of the world sacred.” At verse 34 the stranger too is to be loved “as thyself,” and the chapter closes with honest weights and measures and the reminder of who gave them: “I am the LORD your God, which brought you out of the land of Egypt” ([[Lev. 19:36]]).

sections:
  - range: 1-4
    heading: Be holy
    plain: |
      The LORD told Moses: Speak to the whole congregation of the children of Israel and tell them, You shall be holy, for I the LORD your God am holy. Each of you shall revere his mother and his father, and keep my sabbaths: I am the LORD your God. Do not turn to idols, and do not make gods of cast metal for yourselves: I am the LORD your God.
  - range: 5-8
    heading: The peace offering eaten in time
    plain: |
      When you offer a peace offering to the LORD, offer it of your own free will. It is to be eaten on the day you offer it or the next day; whatever is left until the third day must be burned. If any of it is eaten on the third day, it is a foul thing and will not be accepted. Whoever eats it bears his guilt, because he has profaned what is holy to the LORD, and he shall be cut off from his people.
  - range: 9-18
    heading: Your neighbour
    plain: |
      When you reap the harvest of your land, do not reap to the very edges of your field, and do not gather what the reapers leave behind. Do not strip your vineyard bare or pick up the grapes that have fallen; leave them for the poor and the stranger: I am the LORD your God.

      Do not steal, do not deal falsely, and do not lie to one another. Do not swear falsely by my name and so profane the name of your God: I am the LORD. Do not defraud your neighbor or rob him; do not keep a hired man's wages overnight until morning. Do not curse the deaf or put a stumbling block in front of the blind, but fear your God: I am the LORD.

      Do no injustice in judgment: do not favor the poor or defer to the great, but judge your neighbor fairly. Do not go about spreading slander among your people, and do not stand against your neighbor's blood: I am the LORD. Do not hate your brother in your heart; rebuke your neighbor openly, or you will bear sin because of him. Do not take vengeance or bear a grudge against your own people, but love your neighbor as yourself: I am the LORD.
  - range: 19-25
    heading: Keep my statutes
    plain: |
      Keep my statutes. Do not crossbreed your cattle with another kind, do not sow your field with two kinds of seed, and do not wear a garment woven of two kinds of material.

      If a man lies with a slave woman who is promised to another man but has not been redeemed or given her freedom, there shall be an inquiry and punishment; they are not to be put to death, because she was not free. He shall bring a ram to the door of the tent of meeting as his trespass offering to the LORD, and the priest shall make atonement for him with it before the LORD for the sin he has committed, and it shall be forgiven him.

      When you come into the land and plant any kind of fruit tree, treat its fruit as unfit: for three years it is “uncircumcised” to you and is not to be eaten. In the fourth year all its fruit shall be holy, an offering of praise to the LORD. In the fifth year you may eat its fruit, so that it may yield you more: I am the LORD your God.
  - range: 26-31
    heading: Blood, divination and the dead
    plain: |
      Do not eat anything with its blood. Do not practice divination or sorcery. Do not cut the hair round at the sides of your head, and do not clip the edges of your beard. Do not gash your bodies for the dead or tattoo yourselves: I am the LORD.

      Do not degrade your daughter by making her a prostitute, or the land will turn to prostitution and be filled with lewdness. Keep my sabbaths and reverence my sanctuary: I am the LORD. Do not turn to those who consult the spirits of the dead, or seek out wizards, and so be defiled by them: I am the LORD your God.
  - range: 32-37
    heading: The old, the stranger, and honest measures
    plain: |
      Rise in the presence of the gray-haired and honor the old, and fear your God: I am the LORD.

      When a stranger lives with you in your land, do not oppress him. The stranger who lives with you shall be to you as one born among you, and you shall love him as yourself, for you were strangers in the land of Egypt: I am the LORD your God.

      Do no injustice in judgment, in measuring length, in weight, or in measure. Have honest scales, honest weights, an honest ephah and an honest hin: I am the LORD your God, who brought you out of the land of Egypt. So keep all my statutes and all my judgments, and do them: I am the LORD.

notes:
  - ref: 2
    phrase: 'Ye shall be holy: for I the LORD your God am holy'
    kind: words
    title: What it is to be holy
    body: |
      To be holy is to belong to the LORD and to become like Him, and this chapter shows what that looks like in a household, a field and a court. Holy means “sacred, having a godly character, or spiritually and morally pure,” and “the opposite of holy is common or profane.” In the scriptures, being holy “means being set aside for the use of God.”

      The holiness is the LORD's before it is Israel's. In one Latter-day Saint reading, Israel's holiness “is extrinsic rather than intrinsic because it has its ultimate source in Yahweh,” and the command “presupposes the human potential to ultimately become like divinity in the latter’s defining characteristic: holiness.” The reason clause says the same in the text's own words: be holy, “for I the LORD your God am holy.”

      The command is first given at [[Lev. 11:44]], where it governs the clean and unclean animals; here it heads laws for the household, the field, the court and the market. How Jesus took it up is in the Witness of Christ below.
    sources: [gs-holy, sc-knowhy-335, bowen-law-codes, lds-scriptures]

  - ref: 9
    phrase: thou shalt not wholly reap the corners of thy field
    kind: history
    title: The corners of the field and the gleanings
    body: |
      The harvest law kept back part of every crop for people who had no land of their own. The reaper left the edges of the field standing and did not go back for what fell; the vintner did not strip the vines or pick up the fallen grapes; all of it was left “for the poor and stranger” ([[Lev. 19:10]]). The poor of the Bible are people “who have little or no money, land, or possessions and thus have little power, influence, or social standing,” and the law of Moses “defines the rights of the poor and legislates programs to help them,” gleaning among them. How much was left “depended on the charity and generosity of the landowner.”

      The book of Ruth shows the law at work. Ruth, a widow from Moab, asks leave to “glean and gather after the reapers among the sheaves” ([[Ruth 2:7]]), and Boaz tells his young men to “let fall also some of the handfuls of purpose for her” ([[Ruth 2:16]]). The law returns at [[Lev. 23:22]], among the harvest feasts.
    sources: [seely-cry-widow, lds-scriptures]

  - ref: 14
    phrase: nor put a stumblingblock before the blind, but shalt fear thy God
    kind: history
    title: The deaf and the blind
    body: |
      The law protects people who could not protect themselves, and it ties that protection to the fear of God. In one Latter-day Saint study of disability in the Bible, there is in such laws “an implied connection between the Lord’s compassion and that expected of his people,” since they stand under the command to be holy as the LORD is holy; and the verse closes with a declaration like the one that ends the law on priests with a blemish ([[Lev. 21:23]]).

      The same study notes what such laws do and do not do. In the passages it surveys, the one response the law legislates is protection of those with disabilities “from physical harm or denigration by other people.” Their care it leaves to each Israelite, “as a personal religious expectation—not legislated, but inculcated as a cultural value.”
    sources: [calabro-disability, lds-scriptures]

  - ref: 17
    phrase: thou shalt in any wise rebuke thy neighbour, and not suffer sin upon him
    kind: words
    title: Rebuke rather than hidden hatred
    body: |
      The verse sets open rebuke against hatred kept in the heart, and its last clause, “not suffer sin upon him,” is read two ways. Read of the neighbor's sin, it means that one may reprove a neighbor and refuse to tolerate his sin, but must not hate him. A modern translation reads it instead of the rebuker's own guilt if he keeps silent: “you shall reprove your neighbor, or you will incur guilt yourself.” Either way the verse rules out hatred nursed in the heart, and verse 18 goes on to rule out vengeance and the grudge.
    sources: [lds-scriptures, nrsvue]

  - ref: 18
    phrase: thou shalt love thy neighbour as thyself
    kind: scripture
    title: Love thy neighbour as thyself
    body: |
      The second great commandment first appears here, at the end of a run of laws about how Israelites treat one another, and the first half of the verse says what it rules out: “Thou shalt not avenge, nor bear any grudge against the children of thy people” ([[Lev. 19:18]]). The Hebrew word for “neighbour,” *reaʿ*, means a friend or, in a weaker sense, a “fellow, fellow-citizen, even another person”; here he is one of “the children of thy people,” and verse 34 gives the same love to the stranger (see the note there). The commandment “moves the idea of love in this case from a state of emotion to one of will”: “Each must desire the good of others as well as his own.” It ends, as verses 14 and 16 do, “with the added divine imprimatur” of the LORD's name.

      Jesus set it second only to the love of God: “And the second is like unto it, Thou shalt love thy neighbour as thyself. On these two commandments hang all the law and the prophets” ([[Matt. 22:39–40]]). When a lawyer who knew both commandments asked, “And who is my neighbour?” ([[Luke 10:29]]), He answered with the story of a Samaritan who stopped for a wounded man, and turned the question around: “Which now of these three, thinkest thou, was neighbour unto him that fell among the thieves?” ([[Luke 10:36]]). Paul ([[Rom. 13:9]]; [[Gal. 5:14]]) and James ([[James 2:8]]) quote the verse as well.

      In the Book of Mormon Alma the Elder commands his people “that every man should love his neighbor as himself” ([[Mosiah 23:15]]). In one Latter-day Saint reading, “Alma seems to be directly quoting Leviticus.”
    sources: [bdb, ot-manual-lev-19-27, poelman-gospel-church, ot-minute-lev, lds-scriptures]

  - ref: 19
    phrase: thou shalt not sow thy field with mingled seed
    kind: symbol
    title: Two kinds together
    body: |
      Verse 19 forbids crossbreeding cattle, sowing a field with two kinds of seed and wearing cloth of two kinds, and the text gives no reason; Deuteronomy repeats the law and adds the vineyard ([[Deut. 22:9–11]]). These laws stand with the other commands to keep things pure and in their proper use.

      One older reading finds the reason in creation: “By these laws the observance of the natural order and separation of things is made a duty binding upon the Israelites, the people of Jehovah, as a divine ordinance founded in the creation itself,” where God made plants and animals each “after his kind” ([[Gen. 1:11–12]]). The same reading sets aside the “symbolical, mystical, moral, and utilitarian reasons” others have offered as “foreign to the spirit of the law.”
    sources: [keil-leviticus, lds-scriptures]

  - ref: 20
    phrase: she shall be scourged; they shall not be put to death, because she was not free
    kind: history
    title: The betrothed slave woman
    body: |
      The case is a man who lies with a slave woman promised to another man but not yet freed, and the law treats it as less than adultery because she was not free. With a free woman who was betrothed, both would die ([[Deut. 22:23–24]]); here “they shall not be put to death,” and the man brings a ram as a trespass offering (verses 21–22; on that offering see [[Lev. 5:15–16]]).

      “She shall be scourged” renders a Hebrew word found only here, *biqqoret*: literally “investigation, then punishment, chastisement.” In one older reading the punishment “referred to both parties,” since the verse goes on in the plural, “they shall not be put to death,” and the point of the law is that “even the personal rights of slaves were to be upheld.”
    sources: [keil-leviticus, lds-scriptures]

  - ref: 23
    phrase: ye shall count the fruit thereof as uncircumcised
    kind: words
    title: Uncircumcised fruit
    body: |
      “Uncircumcised” fruit is fruit not yet fit to eat. The Hebrew *ʿarel*, “having foreskin, i.e. uncircumcised,” is used here “figurative of fruit trees.” On one reading the metaphor “denotes the fruit as disqualified or unfit,” as the same word describes the “uncircumcised hearts” of a people who will not listen ([[Lev. 26:41]]) and Moses's “uncircumcised lips” ([[Ex. 6:12]]).

      For three years the fruit was not eaten; in the fourth it was “holy to praise the LORD withal” ([[Lev. 19:24]]); from the fifth the owner ate it. The text does not say why. One suggestion is that the tree “was not viewed as sanctified, or set apart, for use by God’s people” until its first fruits had been given to God, as the firstborn of animals and men were. One older reading likewise sets aside the gardener's reasons (a young tree's poor fruit) and rests the law on “ethical grounds”: the fourth-year fruit was an offering of firstfruits, given “in praise and thanksgiving for the blessing which He had bestowed upon the fruit-trees.”
    sources: [bdb, ot-manual-lev-19-27, keil-leviticus, lds-scriptures]

  - ref: 28
    phrase: Ye shall not make any cuttings in your flesh for the dead, nor print any marks upon you
    kind: history
    title: Cuttings for the dead, and marks
    body: |
      Two marks on the body are forbidden: gashes cut in mourning and marks put into the skin. The second word, *qaʿaqaʿ*, means “incision, imprintment, tattoo.” Cutting was a known rite of grief and of worship: the prophets of Baal “cut themselves after their manner with knives and lancets, till the blood gushed out upon them” ([[1 Kgs. 18:28]]), and such wounds were cut in grief for the dead as well as in worship. In forbidding the cuttings and the marks, “the Lord again clearly signaled that Israel was to be different from their heathen neighbors.”
    sources: [bdb, ot-manual-lev-19-27, lds-scriptures]

  - ref: 31
    phrase: Regard not them that have familiar spirits
    kind: history
    title: Familiar spirits
    body: |
      A “familiar spirit” was “typically understood as the ghost of someone who had passed away,” and the law forbids seeking one. Those who consulted such spirits, “usually to divine the future, were called necromancers.”

      Isaiah turns the image on Jerusalem in its fall: its voice shall be “as of one that hath a familiar spirit, out of the ground” ([[Isa. 29:4]]). Nephi takes up Isaiah's words for his own people, whose record would speak “out of the ground” long after they were gone ([[2 Ne. 26:16]]). In one Latter-day Saint reading, the Book of Mormon there “turns it on its head, showing how the God of Israel can allow the dead to speak to the living in a righteous and holy way.”
    sources: [sc-knowhy-491, lds-scriptures]

  - ref: 34
    phrase: the stranger that dwelleth with you shall be unto you as one born among you
    kind: history
    title: The stranger
    body: |
      The stranger, the *ger*, was an outsider living in Israel, and the law commands Israel to treat him as one of its own and to love him as itself. The word is often used of “a man of non-Israelite birth, resident in the promised land with the permission of the Israelite authorities,” and the law's provisions for strangers “were intended to secure for them justice and fair treatment.” Such people had left “their settlement land and kinship ties to live in a new place, which left them landless and dependent,” and so were “vulnerable to exploitation and abuse.”

      The love asked for is the love of verse 18, in the same words: “thou shalt love him as thyself.” The reason given is Israel's own past: “for ye were strangers in the land of Egypt” ([[Lev. 19:34]]). The law had already set aside the gleanings for the stranger beside the poor ([[Lev. 19:10]]).
    sources: [pierce-ger, bd-stranger, lds-scriptures]

  - ref: 35
    phrase: in meteyard, in weight, or in measure
    kind: history
    title: Meteyard, weight and measure
    body: |
      The law of honest dealing covers every kind of measure a trader used. A “meteyard” is “a yard, staff or rod, used as a measure,” so the verse names the measure of length beside weight and measure, and verse 36 adds the scales and two measures by name. The ephah was a dry measure, “one-tenth of a homer”; the values of such measures “varied from time to time, which makes it difficult to arrive at a correct understanding of these things today.”

      The law gives its own reason in its last words: “I am the LORD your God, which brought you out of the land of Egypt” ([[Lev. 19:36]]).
    sources: [webster-1828, bd-weights-and-measures, lds-scriptures]

christ: |
  Jesus took up the command of verse 2 in the Sermon on the Mount: “Be ye therefore perfect, even as your Father which is in heaven is perfect” ([[Matt. 5:48]]). In one Latter-day Saint reading, the holiness command “was paraphrased by Jesus” there, and again after His resurrection at the temple in Bountiful, where He named Himself beside the Father: “Therefore I would that ye should be perfect even as I, or your Father who is in heaven is perfect” ([[3 Ne. 12:48]]). Given the closeness of the wording, “it seems reasonable that Christ was comparing holiness and perfection.” Moroni says how it comes about: “if ye by the grace of God are perfect in Christ, and deny not his power, then are ye sanctified in Christ by the grace of God” ([[Moro. 10:33]]).

  The voice of the chapter's refrain is the LORD's, Jehovah in the Hebrew (who He is: [[Ex. 3:14]]). The same Lord, in mortality, named the chapter's love of neighbor the second great commandment and showed by a Samaritan who the neighbor is (the note on verse 18).

explore: |
  - **Love of neighbor in the New Testament.** [[Matt. 22:34–40]]; [[Luke 10:25–37]]; [[Rom. 13:8–10]]; [[Gal. 5:13–14]]; [[James 2:8]].
  - **Holy and perfect.** [[Lev. 11:44–45]]; [[1 Pet. 1:15–16]]; [[Matt. 5:48]]; [[3 Ne. 12:48]]; [[Moro. 10:32–33]].
  - **The poor and the stranger at harvest.** [[Ruth 2]]; [[Deut. 24:14–22]]; [[Lev. 23:22]].

