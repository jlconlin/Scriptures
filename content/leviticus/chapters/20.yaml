chapter: 20
title: That Ye Should Be Mine
tagline: The Lord sets penalties on the sins named in chapter 18 and on giving children to Molech and seeking the dead, shares the judgment between Himself and the people, and calls Israel to be holy because He has separated them to be His.
when: 'At Sinai, in the second year after the Exodus'

setting: |
  Chapter 20 is the twin of chapter 18. Both chapters have “sexual offenses and other customs in neighboring nations as their theme,” and many of the same cases appear in both; what each law forbids is explained there (see [[Lev. 18]]). Between them stands chapter 19 and its call to holiness, and in one Latter-day Saint reading of the book's plan, chapters 18 and 20 are the two pillars at the entrance to the holy place (see [[Lev. 18]]).

  The difference is the penalties. Chapter 18 sets none case by case, closing only with the cutting off of all who do these things ([[Lev. 18:29]]); chapter 20 states the penalties for its cases. In the same reading, the first list's silence was “probably not an oversight”: the penalties were “reserved as intensification for the second iteration of the list.” The cases “that may be punished by humans have been moved to the first half of the list, and those that are left to be dealt with by God appear in the second half,” and the chapter adds at its opening and its close a “double warning” against seeking the dead that chapter 18 does not have (verses 6, 27).

  The words are still the LORD's to Moses, and they bind “the children of Israel” and “the strangers that sojourn in Israel” alike ([[Lev. 20:2]]).

thread: |
  The chapter is about who punishes, and the verbs say. “He shall surely be put to death” and “the people of the land shall stone him” are for the community to carry out; “I will set my face against that man” and “will cut him off” are the Lord's own (verses 2–3). In one reading of the chapter's structure, these phrases “signify punishment either by humanity or by God,” and the cases are set in a mirrored order by who punishes them: both the people and the Lord for Molech and the mediums at the edges (verses 2–6 and 27), the people at the center (verses 9–16), and the Lord in verses 17–21. On that reading, the center presses the people's duty hardest (see the note on verse 4).

  Around the penalties stand the reasons, in the Lord's own voice. Twice He calls the people to be holy (verses 7, 26), and twice to keep His statutes (verses 8, 22). He is the one who sanctifies them (verse 8), the land will spue them out if they do these things (verse 22), and He has severed them from the nations “that ye should be mine” (verse 26).

sections:
  - range: 1-6
    heading: Molech and the mediums
    plain: |
      The LORD told Moses to say to the children of Israel: Anyone, whether an Israelite or a stranger living in Israel, who gives one of his children to Molech must be put to death; the people of the land are to stone him. I myself will set my face against that man and cut him off from his people, because in giving his child to Molech he has defiled my sanctuary and profaned my holy name. And if the people of the land look away when he does it and do not put him to death, then I will set my face against that man and against his family, and cut off from their people both him and all who follow him in going after Molech.

      Whoever turns to spirit mediums and wizards, to go after them, I will set my face against that person and cut him off from his people.
  - range: 7-8
    heading: Be holy
    plain: |
      So sanctify yourselves and be holy, for I am the LORD your God. Keep my statutes and do them: I am the LORD who makes you holy.
  - range: 9-16
    heading: Cases the people must punish
    plain: |
      Anyone who curses his father or his mother must be put to death; he has cursed his own father or mother, and his blood is on him.

      A man who commits adultery with another man's wife, his neighbor's wife, must be put to death, both the man and the woman. A man who lies with his father's wife has uncovered his father's nakedness: both must be put to death, and their blood is on them. If a man lies with his daughter-in-law, both must be put to death; they have wrought confusion, and their blood is on them. If a man lies with a male as with a woman, both have done an abomination: they must be put to death, and their blood is on them. A man who takes a woman and her mother as well does a wicked thing: he and they are to be burned with fire, so that there is no wickedness among you. A man who lies with an animal must be put to death, and the animal killed; and if a woman approaches an animal to lie with it, kill the woman and the animal: they must be put to death, and their blood is on them.
  - range: 17-21
    heading: Cut off, and childless
    plain: |
      If a man takes his sister, his father's daughter or his mother's daughter, so that they see each other's nakedness, it is a wicked thing; they are to be cut off in the sight of their people. He has uncovered his sister's nakedness and will bear his guilt. If a man lies with a woman during her menstrual period, he has uncovered the flow of her blood and she has exposed it; both are to be cut off from their people.

      Do not uncover the nakedness of your mother's sister or your father's sister, for that is to lay bare a close relative; they will bear their guilt. A man who lies with his uncle's wife has uncovered his uncle's nakedness; they will bear their sin and die childless. A man who takes his brother's wife does an unclean thing; he has uncovered his brother's nakedness, and they will be childless.
  - range: 22-26
    heading: Separated to be the Lord's
    plain: |
      So keep all my statutes and all my judgments and do them, so that the land I am bringing you into to live does not vomit you out. Do not live by the customs of the nation I am driving out before you; they did all these things, and I abhorred them. I have told you: You will inherit their land, and I will give it to you to possess, a land flowing with milk and honey. I am the LORD your God, who has set you apart from other peoples.

      So you are to distinguish between clean and unclean animals and between unclean and clean birds, and not make yourselves detestable through the animals, birds and creeping things that I have set apart for you as unclean. You shall be holy to me, for I the LORD am holy, and I have set you apart from other peoples to be mine.
  - range: 27-27
    heading: The medium put to death
    plain: |
      A man or a woman who is a medium or a wizard must be put to death; they are to be stoned, and their blood is on them.

notes:
  - ref: 3
    phrase: to defile my sanctuary, and to profane my holy name
    kind: history
    title: The sanctuary and the holy name
    body: |
      The Lord gives His own reason for cutting off the man who gives a child to Molech: the act defiles His sanctuary and profanes His name. What Molech was, and what is not known about the rite, is at [[Lev. 18:21]]; chapter 20 adds the penalty, “death by stoning as a punishment for worshipping false gods,” and the Lord's own cutting off besides. The note on [[Lev. 16:16]] explains how Israel's sins could defile a holy place no sinner entered.

      The reason marks the difference between the twin chapters. In one Latter-day Saint reading, chapter 18 warns so that Israel “would not be cast out of the land as its former inhabitants had been,” while “the more elevated priestly motivation behind Leviticus 20 was to ensure that the Israelites would not defile the sanctuary or God's name.” The chapter's last word on the subject is the same: “ye shall be holy unto me” ([[Lev. 20:26]]).
    sources: [ot-minute-lev, lds-scriptures]

  - ref: 4
    phrase: do any ways hide their eyes from the man
    kind: structure
    title: When the people look away
    body: |
      Verse 4 warns the community not to “hide their eyes” and leave the offender alone. If the people will not act, the Lord will, and more widely: “against that man, and against his family” (verse 5).

      On the structural reading set out in the thread, the doubled penalty of verses 2–3, stoning by the people and cutting off by the Lord, is deliberate. Each case is assigned to one or both, and “the purpose of assigning responsibility is not to parcel up jurisdiction but to emphasize collaboration.” The people's part stands at the center (verses 9–16) because “humankind is apt to avoid meting out punishment, especially for idolatry, family, and sexual offenses,” and these offenses “would most likely have taken place either at home or close to home,” where “the people most likely to know whether these offenses took place will be the offender's own family.” The threat to the family in verse 5 “provides a powerful motive for overcoming any reluctance to initiate proceedings.”

      The same reading explains why cursing a parent (verse 9) opens the cases the people must punish. Set beside verses 10–16, it “implies that these are not sexual offenses but family offenses”: “What people do with each other sexually is not a matter for themselves only.” As the commandment to honor father and mother is tied to long life in the land ([[Ex. 20:12]]), so in this chapter, on this reading, “Applying the penalties is thus linked with retaining the land” (verse 22).
    sources: [burnside-lev-20, lds-scriptures]

  - ref: 14
    phrase: they shall be burnt with fire
    kind: history
    title: Burnt with fire, and blood upon them
    body: |
      Two of the chapter's penalty formulas need explaining: “their blood shall be upon them” and burning with fire. For the first (verses 9, 11–13, 16, 27), one older reading points to the same words in Ezekiel and in Joshua, where the spies say of anyone who leaves Rahab's house, “his blood shall be upon his head, and we will be guiltless” ([[Josh. 2:19]]): the one who dies answers for his own death. Another, on the man who curses his parents (verse 9), holds that the crime “was to return upon the doer of it, according to Genesis 9:6.”

      Verse 14, for a man who takes a woman and her mother, is the one case given a penalty other than plain death. The second older reading holds that death under the law was by stoning (verses 2, 27), and that by the burning “we are not to understand death by fire, or burning alive, but, as we may clearly see from Joshua 7:15 and Joshua 7:25, burning the corpse after death.” The text itself says only “burnt with fire.”
    sources: [cambridge-leviticus, keil-leviticus, lds-scriptures]

  - ref: 20
    phrase: they shall die childless
    kind: history
    title: Penalties the Lord keeps for Himself
    body: |
      For the last cases of the chapter (verses 19–21) no human court is named: the penalties are to “bear their iniquity” and to “die childless,” and they are the Lord's to carry out. In one older reading, no civil punishment “to be inflicted by the magistrate or by the community generally” followed marriage with an aunt, an uncle's wife or a brother's wife: “the threat is simply held out … that is to say, God would reserve the punishment to Himself.” The structural reading set out in the thread agrees, counting bearing iniquity, dying childless and being childless as penalties characteristically the Lord's. It goes further than the older reading on verses 17–18: it takes their cutting off as the Lord's too (see [[Lev. 18:29]]), where the older reading counts both among the cases the people punish by death.

      The same structural reading takes the aunts of verse 19 as the chapter's hardest cases, “the only cases in the whole of verses 19–21—and the entire chapter—not to have a designated punishment,” because they stand “right on the boundary of what constitutes near kin.” Even so, “the behavior is not recommended.” The note on [[Lev. 18:16]] discusses the brother's wife of verse 21 and how the law of levirate marriage stands beside it.
    sources: [keil-leviticus, burnside-lev-20]

  - ref: 26
    phrase: have severed you from other people, that ye should be mine
    kind: words
    title: Separated to be His
    body: |
      One Hebrew verb, *badal*, “separate” or “make a distinction,” stands behind three English words in verses 24–26, and it ties what Israel eats to what Israel is. The Lord “separated you from other people” (verse 24); Israel is to “put difference between” clean and unclean animals, which the Lord has “separated from you as unclean” (verse 25); and He has “severed you from other people, that ye should be mine” (verse 26).

      In one Latter-day Saint reading, that is the aim of the chapter: Israel was to be “a pure and holy people, separated from unclean people and beasts in order to belong to God and be worthy of His presence.” The animals themselves are chapter 11's subject (see [[Lev. 11]]), and the call to be holy is at [[Lev. 19:2]].
    sources: [oshb-wlc, bdb, ot-minute-lev]

  - ref: 27
    phrase: A man also or woman that hath a familiar spirit
    kind: history
    title: The mediums, first and last
    body: |
      The chapter opens and closes on mediums, and the two verses are two laws: verse 6 is about the soul “that turneth after such as have familiar spirits,” and the Lord cuts that person off; verse 27 is about the man or woman who “hath a familiar spirit,” and the people stone the medium. What a familiar spirit was, and how the Book of Mormon takes up the phrase, is at [[Lev. 19:31]], where the law first forbids seeking one. Verse 6 calls seeking them going “a whoring after them”; why worship of another power is set among sexual sins is at [[Lev. 18:21]].

      On the structural reading, the repetition is a frame: “the inclusio gives the chapter its overall chiastic structure” (an inclusio is a passage that ends as it began, and a chiastic structure one set in the mirrored order described in the thread), with Molech and mediums each “punished by both YHWH … and humankind.” In one Latter-day Saint reading, the doubled warning means the reader “is invited twice to think hard about what fidelity requires.”
    sources: [burnside-lev-20, ot-minute-lev, lds-scriptures]

christ: |
  The law of verse 10 was once put to the Savior Himself. The scribes and Pharisees brought Him a woman “taken in adultery” and said, “Moses in the law commanded us, that such should be stoned: but what sayest thou?” ([[John 8:4–5]]). He answered, “He that is without sin among you, let him first cast a stone at her” ([[John 8:7]]), and when her accusers had gone, “Neither do I condemn thee: go, and sin no more” ([[John 8:11]]).

  The voice that says in this chapter “I am the LORD which sanctify you” ([[Lev. 20:8]]) is Jehovah, the premortal Jesus Christ (see [[Ex. 3:14]]).

