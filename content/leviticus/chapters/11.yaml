chapter: 11
title: Clean and Unclean Animals
tagline: 'The LORD tells Israel which creatures of land, water and air may be eaten, how touching a carcass makes a person unclean until evening, and why it matters: “ye shall be holy; for I am holy.”'
when: 'At Sinai, in the second year after the Exodus'

setting: |
  Chapters 11–15 turn from the altar to everyday life. After Nadab and Abihu died, the priests were charged to “put difference between holy and unholy, and between unclean and clean” ([[Lev. 10:10]]), and these chapters give them what to distinguish: first food and the carcasses of animals (chapter 11; Deuteronomy gives the list again, [[Deut. 14:3–20]]), then the uncleanness of persons, garments and houses (12–15). Those who come to the temple are to keep its holiness in the home as well: “dietary laws regulate what can be eaten on the daily table.”

  “Clean” and “unclean” here are ritual words. Uncleanness “referred to being ceremonially or ritually unclean and should not be taken to mean that the touching of a dead body or the bearing of children was morally evil.” What it did was keep a person away from the holy: an unclean person who ate of the peace offerings was “cut off from his people” ([[Lev. 7:20]]). Behind it stood the sanctuary. These laws are given “that they die not in their uncleanness, when they defile my tabernacle that is among them” ([[Lev. 15:31]]); in one scholar's reading, impurity was held to be “the implacable foe of holiness wherever it exists.” Clean and unclean in the law as a whole are set out in [The Law and the Covenant](/old-testament/guides/law-and-covenant/#clean-unclean).

thread: |
  The chapter groups the creatures by habitat and, for most groups, gives a test rather than a list. Animals of the land must both part the hoof and chew the cud, and four animals that have only one of the two marks are named as unclean (verses 2–8). Creatures of the water must have fins and scales; no fish is named (9–12). Birds have no test, only a list of the forbidden (13–19). Winged swarming things are forbidden, except those with legs “to leap withal” (20–23).

  Verses 24–40 change the subject from eating to touching. A carcass makes whoever touches or carries it unclean until evening, and the rule then reaches the household: a pot, a garment, food, an oven, a well, seed for sowing. Verses 41–43 return to the creatures that swarm on the ground.

  Only near the end does the chapter give a reason: “For I am the LORD your God: ye shall therefore sanctify yourselves, and ye shall be holy; for I am holy” ([[Lev. 11:44]]), and the LORD who says it is the one who brought Israel “up out of the land of Egypt, to be your God” ([[Lev. 11:45]]). The closing summary (46–47) speaks only of eating, and of the priests' charge: “To make a difference between the unclean and the clean.”

sections:
  - range: 1-8
    heading: Animals of the land
    plain: |
      The LORD said to Moses and Aaron: “Tell the Israelites: These are the land animals you may eat. You may eat any animal that has a divided hoof, split in two, and chews the cud. But of those that only chew the cud or only have a divided hoof you shall not eat these: the camel, which chews the cud but does not have a divided hoof; it is unclean for you. The rock hyrax, which chews the cud but does not have a divided hoof; it is unclean for you. The hare, which chews the cud but does not have a divided hoof; it is unclean for you. And the pig, which has a divided hoof, split in two, but does not chew the cud; it is unclean for you. You shall not eat their meat or touch their carcasses; they are unclean for you.
  - range: 9-12
    heading: Creatures of the water
    plain: |
      “Of everything that lives in the water, in the seas and in the rivers, you may eat whatever has fins and scales. But anything in the seas or rivers that has no fins and scales, of all that swarm in the water and every living thing in it, shall be detestable to you. They shall be detestable: you shall not eat their meat, and you shall treat their carcasses as detestable. Whatever lives in the water without fins and scales is detestable to you.
  - range: 13-23
    heading: Birds and winged things
    plain: |
      “These are the birds you shall treat as detestable and not eat: the eagle, the ossifrage, the osprey, the vulture, every kind of kite and raven, the owl, the night hawk, the cuckoo, every kind of hawk, the little owl, the cormorant, the great owl, the swan, the pelican, the gier eagle, the stork, every kind of heron, the lapwing and the bat.

      “Every winged swarming thing that walks on all fours is detestable to you. But of the winged swarming things that walk on all fours you may eat those that have jointed legs above their feet for leaping on the ground: every kind of locust, bald locust, beetle and grasshopper. All other winged swarming things with four feet are detestable to you.
  - range: 24-40
    heading: Unclean by touch
    plain: |
      “These will make you unclean. Whoever touches their carcasses is unclean until evening, and whoever carries any part of their carcasses must wash his clothes and is unclean until evening. Every animal that has a hoof not split in two and does not chew the cud is unclean to you, and whoever touches one is unclean. All the four-footed animals that walk on their paws are unclean to you; whoever touches their carcasses is unclean until evening, and whoever carries their carcasses must wash his clothes and is unclean until evening.

      “Of the creatures that swarm on the ground these are unclean to you: the weasel, the mouse, every kind of tortoise, the ferret, the chameleon, the lizard, the snail and the mole. Whoever touches them when they are dead is unclean until evening. Anything one of them falls on when dead becomes unclean, whether an article of wood, a garment, a skin or a sack, any article used for work: it must be put into water, and it is unclean until evening, and then it is clean. If one falls into a clay pot, everything in the pot is unclean, and you must break the pot. Any food that could be eaten becomes unclean if water from such a pot touches it, and any drink in such a pot is unclean. Anything a part of their carcass falls on is unclean; a stove or a cooking oven must be broken down, for they are unclean and shall stay unclean to you. But a spring or a well, a gathering of water, stays clean, though whoever touches the carcass in it is unclean. If part of a carcass falls on seed to be sown, the seed stays clean; but if water has been put on the seed and part of a carcass falls on it, it is unclean to you.

      “If one of the animals you may eat dies, whoever touches its carcass is unclean until evening. Whoever eats of the carcass must wash his clothes and is unclean until evening, and whoever carries the carcass must wash his clothes and is unclean until evening.
  - range: 41-47
    heading: The reason
    plain: |
      “Every creature that swarms on the ground is detestable and shall not be eaten: whatever moves on its belly, whatever walks on all fours, or whatever has many legs, of all the creatures that swarm on the ground. You shall not eat them, for they are detestable. Do not make yourselves detestable with any swarming creature, and do not make yourselves unclean with them and so be defiled by them. For I am the LORD your God. Sanctify yourselves, therefore, and be holy, for I am holy. Do not defile yourselves with any creature that swarms on the ground. For I am the LORD who brought you up out of the land of Egypt to be your God: you shall therefore be holy, for I am holy.”

      This is the law about land animals, birds, every living creature that moves in the water and every creature that swarms on the ground, to distinguish between the unclean and the clean, and between the creature that may be eaten and the creature that may not be eaten.

notes:
  - ref: 5
    phrase: the coney, because he cheweth the cud
    kind: words
    title: The coney and the hare
    body: |
      The King James “coney” is not a rabbit but the rock hyrax, an animal that lives among rocks. The Hebrew *shaphan* is the “rock-badger, hyrax,” the creature of [[Ps. 104:18]], where “the rocks” are “for the conies,” and of [[Prov. 30:26]]. “Coney” was “an old English term for ‘rabbit’,” and the King James rendering “follows the traditional Jewish interpretation.”

      Neither the hyrax nor the hare really chews the cud, though both look as if they do: both “move their jaws like beasts which chew the cud, but are not ruminating animals.” The verse describes the animals as an observer sees them; in one older reading, “here, as in other passages of the Bible, the language is popular, rather than scientific.” The rule's point is unchanged: neither animal has a divided hoof, so neither may be eaten.
    sources: [bdb, cambridge-leviticus]

  - ref: 7
    phrase: And the swine, though he divide the hoof
    kind: history
    title: Why pork, and why these animals
    body: |
      The text gives no reason for any single animal; it gives two marks, and the pig fails one of them, for it “cheweth not the cud.” Why these marks and these animals has been answered in several ways, and none comes from the text.

      One proposed reason is health: since pork can carry trichinosis, the laws have been read as having “practical reasons … related to health and sanitation.” But “the Hebrew word for clean used in the dietary law means more than just physically clean,” and in one Jewish writer's words, “‘Unclean’ in Leviticus is a ceremonial word.” Another reading holds that the food laws were “not given because the unclean animals were unhealthy but because the Lord wanted to set the Israelites apart from the world.” The purpose shows in what the law did. The diet was “a teaching tool”: “At every meal a formal choice was made,” and the law “served to separate the Hebrews from their Canaanite neighbors.”

      One older reading looks to Israel's neighbors: animals “recognised as in any way objects of worship by heathen neighbours” were unclean, and the pig was especially hated “either owing to its being an object of heathen worship … or for sanitary reasons.” That reading points to Isaiah's condemnation of those “which eat swine's flesh” ([[Isa. 65:4]]; [[Isa. 66:17]]).

      The reason the chapter itself gives is holiness ([[Lev. 11:44]]).
    sources: [ot-manual-lev-11-18, sc-knowhy-807, cambridge-leviticus]

  - ref: 10
    phrase: they shall be an abomination unto you
    kind: words
    title: A different word for abomination
    body: |
      “Abomination” in this chapter is a word of the food laws, not the word of [[Lev. 18:22]]. Here it is *sheqets*, “detestation, detestable thing,” used “of the ceremonially unclean” and of “creatures forbidden as food”: water creatures without fins or scales, the birds of verse 13, the winged swarming things and the creatures that crawl on the ground. The “abomination” of [[Lev. 18:22]] is a different word, *toʿebah*.

      In this sense a water creature without fins and scales is “detestable”: it may not be eaten, and its carcass is treated as detestable (verse 11).
    sources: [oshb-wlc, bdb]

  - ref: 13
    phrase: the eagle, and the ossifrage, and the ospray
    kind: history
    title: The forbidden birds
    body: |
      For birds the law gives no test, only twenty names of the forbidden, and several of those names are uncertain. The “swan” of verse 18 is “probably an ibis,” and the bat at the end of the list is counted among the birds. Most of them are alike in what they eat: “Birds forbidden were generally birds of prey that lived on carrion, or, as in the case of the stork and heron, those that may have eaten other unclean creatures.” The “ossifrage” and the “gier eagle” are each “thought to be a species of vulture.”

      The clean birds are never listed. Deuteronomy says only that Israel may eat “all clean birds” ([[Deut. 14:11]]), and “a biblical list of them is not available.”
    sources: [kirby-birds, ot-manual-lev-11-18]

  - ref: 24
    phrase: shall be unclean until the even
    kind: history
    title: Unclean until the evening
    body: |
      Uncleanness from a carcass lasted the rest of the day. Touching one made a person unclean “until the even,” and in such ordinary cases “it was sufficient to remain in seclusion till the evening and then to wash the body.” Carrying a carcass went a step further: the carrier also washed his clothes (verses 25, 28, 40).

      The cost of a day's uncleanness was distance from the people and from holy things. Being unclean meant that a person “had to be separated from other people for the rest of the day,” and so was “cut off from the covenant people for a period of time.” Nor could he eat of the sacrifices: “the soul that shall touch any unclean thing … and eat of the flesh of the sacrifice of peace offerings … shall be cut off from his people” ([[Lev. 7:21]]).

      The rule did not depend on the animal being forbidden. Even an animal Israel might eat made a person unclean if it died of itself (verses 39–40).
    sources: [bd-clean-unclean, sc-knowhy-479, lds-scriptures]

  - ref: 33
    phrase: every earthen vessel, whereinto any of them falleth
    kind: scripture
    title: The pot and the cup
    body: |
      The rules for vessels draw a line between the inside of a vessel and the outside. A wooden article, a garment or a sack that one fell on was washed and was clean by evening (verse 32); a clay pot it fell into was broken, with all its contents (verse 33). The creature falls “into the midst” of the pot (the King James “whereinto”), so the rule apparently assumes a pot with an inside, a jar rather than a plate, and behind it is “the assumption that the inside of a vessel was more susceptible to impurity than the outside.”

      Later teachers argued about which side of a vessel to cleanse first, and the Savior turned the debate into a lesson on the heart: “cleanse first that which is within the cup and platter, that the outside of them may be clean also” ([[Matt. 23:26]]). Captain Moroni made the same appeal in a letter to Pahoran: “God has said that the inward vessel shall be cleansed first, and then shall the outer vessel be cleansed also” ([[Alma 60:23]]). In doing so he “invoked legal provisions from the Law of Moses that would have been known to Pahoran.”
    sources: [sc-knowhy-169, lds-scriptures]

  - ref: 44
    phrase: ye shall be holy; for I am holy
    kind: scripture
    title: Holy, because the LORD is holy
    body: |
      The reason the chapter gives for its rules is the holiness of the LORD, and this verse is the first place the law says it in these words. Israel is to keep the line between clean and unclean because the God who brought them “up out of the land of Egypt, to be your God” is holy ([[Lev. 11:45]]).

      Leviticus later spells out that link between the clean animals and Israel's separation: “I am the LORD your God, which have separated you from other people. Ye shall therefore put difference between clean beasts and unclean” ([[Lev. 20:24–25]]), and “ye shall be holy unto me: for I the LORD am holy, and have severed you from other people, that ye should be mine” ([[Lev. 20:26]]). The clean and unclean animals marked Israel as a people “separated from unclean people and beasts in order to belong to God and be worthy of His presence.”

      Peter quotes this verse to the Saints of his day: “Because it is written, Be ye holy; for I am holy” ([[1 Pet. 1:16]]). What the command means for the whole of Israel's life is the note on [[Lev. 19:2]].
    sources: [ot-minute-lev, lds-scriptures]

  - ref: 47
    phrase: To make a difference between the unclean and the clean
    kind: scripture
    title: When the line was taken away
    body: |
      The line this chapter draws between creatures was removed in the New Testament, and scripture says how. In Peter's vision a sheet full of animals came down, and when he refused, “I have never eaten any thing that is common or unclean,” the voice answered, “What God hath cleansed, that call not thou common” ([[Acts 10:14–15]]). Peter took its meaning to be about people: “God hath shewed me that I should not call any man common or unclean” ([[Acts 10:28]]). Luke's account sets people beside the unclean food of the vision, since “one of the fundamental reasons Gentiles were considered unclean is because they partook of unclean foods”; food was “the center of the divide between Gentiles and Jews in early Christianity.”

      The Savior had already spoken of food and defilement. Food goes “into the belly,” He said, not into the heart ([[Mark 7:19]]); the King James ends the verse “purging all meats,” and a modern translation reads Mark's comment as “Thus he declared all foods clean.” These laws, “being fulfilled by the Atonement of Jesus Christ, … are no longer required of the believers.”
    sources: [lds-scriptures, wayment-peter-cornelius, nrsvue, bd-clean-unclean]

christ: |
  The chapter teaches that the unclean is kept from the holy, and the Book of Mormon says the same of God's presence: “no unclean thing can dwell with God” ([[1 Ne. 10:21]]); “no unclean thing can inherit the kingdom of heaven” ([[Alma 11:37]]). One Latter-day Saint study reads the laws of uncleanness in that light: as a person unclean under the law was cut off for a time from the people, one spiritually unclean is cut off from God, and “only Christ can bridge that gap between unclean or sinful humanity and an ultimately clean and purely righteous God.”

