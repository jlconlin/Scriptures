chapter: 26
title: Blessing and Cursing
tagline: The law given at Sinai closes with the LORD's promises to an obedient Israel, five rounds of rising warnings to a disobedient one, and His word that even in exile He will remember His covenant.
when: 'At Sinai, in the second year after the Exodus'

setting: |
  The chapter closes the laws of holiness that began at [[Lev. 17]] (the name “Holiness Code” is explained there), and it closes the whole body of law the LORD gave Moses “in mount Sinai” ([[Lev. 26:46]]). Its two opening commands repeat earlier ones ([[Lev. 19:4]]; [[Lev. 19:30]]); the rest says what will follow if Israel keeps the laws already given, above all those of chapters 17–26, and what will follow if it does not.

  The pattern is an old one. The book of the covenant ended the same way, with promises and warnings ([[Ex. 23:20–33]]), and Moses sets out the blessings and the curses once more, at greater length, on the edge of the promised land ([[Deut. 28]]). Covenants and treaties in the ancient Near East “almost universally set forth stipulations, laws, and requirements,” followed by blessings for keeping them and curses for breaking them; Leviticus has its stipulations in the chapters before this one. In one Latter-day Saint reading, this chapter is where “the Abrahamic Covenant is most fully outlined for Israel.”

  The notes on [[Amos 4:6]], [[Ezek. 5:2]] and [[Dan. 9:11]] set later prophets' words beside this chapter's.

thread: |
  The LORD speaks in the first person nearly from start to finish: “I will give,” “I will set,” “I will walk,” then “I will punish,” “I will scatter,” and at the end “I will remember” (one count finds sixty-nine such statements). Two commands head it, no idols and keep the sabbaths (verses 1–2), and in one older reading they sum up the whole law at the head of the blessing and the curse.

  Then come two conditions. “If ye walk in my statutes” (verse 3) opens the blessings: rain, harvest, peace, victory, children, and the LORD's own dwelling among them (verses 4–13). “But if ye will not hearken unto me” (verse 14) opens the curses, and these take far more room (verses 14–39). They come in rounds, each opening with Israel's refusal and each “seven times” worse (verses 18, 21, 24, 28). Verse 23 shows what the blows were meant to do: the next round comes on a people that “will not be reformed by me by these things” ([[Lev. 26:23]]).

  The word “abhor” traces the turn. The Hebrew verb behind it occurs five times in Leviticus, all in this chapter. The LORD promises, “my soul shall not abhor you” (verse 11); Israel's soul abhors His judgments (verses 15, 43); He answers, “my soul shall abhor you” (verse 30). The chapter's last word on the matter is His again: “I will not cast them away, neither will I abhor them” ([[Lev. 26:44]]). The curses do not end the chapter. When the scattered people confess, the LORD remembers His covenant (verses 40–45).

sections:
  - range: 1-2
    heading: Two commands at the head
    plain: |
      Do not make idols or carved images for yourselves, do not set up sacred pillars, and do not put a carved stone in your land to bow down to; for I am the LORD your God. Keep my sabbaths and revere my sanctuary: I am the LORD.
  - range: 3-13
    heading: If you keep my commandments
    plain: |
      If you live by my statutes and keep and do my commandments, I will give you rain in its season; the land will yield its crops and the trees their fruit. Your threshing will last until the grape harvest, and the grape harvest until sowing time; you will eat your fill and live safely in your land. I will give peace in the land, and you will lie down with no one to frighten you. I will rid the land of dangerous animals, and no sword will pass through it. You will chase your enemies, and they will fall before you: five of you will chase a hundred, and a hundred of you ten thousand.

      I will turn toward you, make you fruitful and many, and keep my covenant with you. You will still be eating last year's harvest when you have to clear it out to make room for the new. I will set my dwelling among you, and I will not reject you. I will walk among you; I will be your God, and you will be my people. I am the LORD your God, who brought you out of Egypt so that you would no longer be their slaves. I broke the bars of your yoke and let you walk with your heads up.
  - range: 14-17
    heading: If you will not listen
    plain: |
      But if you will not listen to me and will not do all these commandments, if you reject my statutes and loathe my judgments and so break my covenant, then I will do this to you: I will bring terror on you, wasting disease and fever that dim the eyes and drain away life. You will sow your seed for nothing, because your enemies will eat the harvest. I will set my face against you; you will be struck down before your enemies, those who hate you will rule over you, and you will run when no one is chasing you.
  - range: 18-20
    heading: Seven times more
    plain: |
      If after all this you still will not listen, I will punish you seven times more for your sins. I will break your proud strength. I will make the sky above you like iron and the ground like bronze, so that your work is wasted: the land will yield no crops and the trees no fruit.
  - range: 21-22
    heading: Wild animals
    plain: |
      If you keep on opposing me and will not listen, I will bring seven times more blows on you, as your sins deserve. I will send wild animals among you that will take your children, destroy your cattle and leave you few, until your roads are empty.
  - range: 23-26
    heading: Sword, plague and famine
    plain: |
      If even these things do not correct you, and you keep on opposing me, then I will oppose you, and I myself will strike you seven times for your sins. I will bring a sword on you to carry out the punishment for breaking my covenant. When you gather inside your cities, I will send plague among you, and you will be handed over to the enemy. When I cut off your supply of bread, ten women will bake your bread in a single oven and hand it out by weight, and you will eat and not be satisfied.
  - range: 27-39
    heading: Desolation and exile
    plain: |
      If in spite of all this you will not listen to me but keep on opposing me, I will oppose you in fury and punish you seven times for your sins. You will eat the flesh of your own sons and daughters. I will destroy your hill shrines, cut down your incense altars, and throw your corpses on the lifeless forms of your idols, and I will reject you. I will make your cities ruins and your sanctuaries desolate, and I will take no pleasure in the smell of your offerings. I will make the land so desolate that your enemies who settle in it will be appalled. I will scatter you among the nations and pursue you with a drawn sword; your land will be desolate and your cities ruins.

      Then the land will have its sabbaths, all the time it lies desolate while you are in your enemies' land; then the land will rest and make up its sabbaths. As long as it lies desolate it will have the rest it did not have on your sabbaths while you lived there. As for those of you who are left, I will send such fear into their hearts in their enemies' lands that the sound of a blowing leaf will put them to flight. They will run as from a sword and fall when no one is chasing them, stumbling over one another, and you will not be able to stand before your enemies. You will perish among the nations, and the land of your enemies will devour you. Those who are left will waste away in their enemies' lands because of their own iniquity and their fathers' iniquity.
  - range: 40-45
    heading: I will remember my covenant
    plain: |
      But if they confess their iniquity and their fathers' iniquity, the unfaithfulness they committed against me and how they opposed me, so that I opposed them and brought them into the land of their enemies; if then their uncircumcised hearts are humbled and they pay for their iniquity: then I will remember my covenant with Jacob, my covenant with Isaac and my covenant with Abraham, and I will remember the land. The land will be left empty of them and make up its sabbaths while it lies desolate without them, and they will pay for their iniquity, because they rejected my judgments and loathed my statutes.

      Yet even then, when they are in the land of their enemies, I will not reject them or loathe them so as to destroy them completely and break my covenant with them, for I am the LORD their God. For their sake I will remember the covenant with their ancestors, whom I brought out of Egypt in the sight of the nations, to be their God: I am the LORD.
  - range: 46-46
    heading: The close of the law
    plain: |
      These are the statutes, judgments and laws that the LORD set between Himself and the children of Israel on Mount Sinai through Moses.

notes:
  - ref: 3
    phrase: If ye walk in my statutes, and keep my commandments, and do them
    kind: scripture
    title: The covenant Nephi received
    body: |
      In one Latter-day Saint reading, the Lord gave Nephi a shorter form of the same covenant when Lehi's family left Jerusalem ([[1 Ne. 2:19–24]]), and the two show “a striking similarity.” The condition is the same: “If ye walk in my statutes, and keep my commandments” here, “inasmuch as ye shall keep my commandments” in [[1 Ne. 2:20]]. The study sets Nephi's “ye shall prosper” ([[1 Ne. 2:20]]) and his “land of promise” beside the harvests and safety of verses 4–10. The brothers who rebel are “cut off from the presence of the Lord” ([[1 Ne. 2:21]]), the loss of what verses 11–12 promise. And the brothers are to be “a scourge unto thy seed, to stir them up in the ways of remembrance” ([[1 Ne. 2:24]]), which the study pairs with the LORD's promise to remember His covenant (verses 41–42).

      The study does not argue that Nephi was copying Leviticus. Its proposal is that “the same being who established the covenant with Israel, namely Jehovah, (re)established that same covenant with Lehi and Nephi.” Another Latter-day Saint reading thinks the Book of Mormon's language of keeping the commandments more likely comes from Deuteronomy, while finding the likeness to verses 3–12 “striking.”
    sources: [muhlestein-prospering, ot-minute-lev, lds-scriptures]

  - ref: 11
    phrase: I will set my tabernacle among you
    kind: symbol
    title: The LORD's dwelling among them
    body: |
      The last and greatest of the blessings is the LORD's own presence: “I will set my tabernacle among you … And I will walk among you, and will be your God, and ye shall be my people” ([[Lev. 26:11–12]]). “Tabernacle” here is *mishkan*, “dwelling-place,” a word the standard lexicon says is used in the singular, with a few exceptions, “always of abode of” the LORD. These promises are “even more important” than the harvests and victories before them, and “could be summarized in one word: Zion.”

      One Latter-day Saint reading of the whole book calls this chapter its climax: it “is like the mercy seat and the ark of the covenant at the heart of the Holy of Holies.” It gives a scholar's translation of the verse: “I will establish my presence in your midst.” On that reading the LORD's many words in the first person are the point: “for Leviticus, in the Holy of Holies, the presence of the Lord was encountered in hearing Him speak.” That is a reading of the book's shape, not something the chapter says of itself.
    sources: [oshb-wlc, bdb, ot-manual-lev-19-27, ot-minute-lev]

  - ref: 13
    phrase: I have broken the bands of your yoke, and made you go upright
    kind: symbol
    title: Made to walk upright
    body: |
      The image is of a draft animal set free, and it stands for the deliverance from Egypt. The “bands” of the yoke are, literally, “the poles of the yoke,” the bars “laid upon the necks of beasts of burden … to bend their necks and harness them for work.” In one older reading, Egypt had pressed Israel down “so that they could no longer walk upright, till God by breaking the yoke helped them to walk upright again”: “as the yoke is a figurative description of severe oppression, so going upright is a figurative description of emancipation from bondage.”

      The blessings end with what the LORD has already done (“which brought you forth out of the land of Egypt”). Verses 12–13 have been read as among the Old Testament's “powerful statements about God's love for His children.”
    sources: [keil-leviticus, sc-knowhy-422]

  - ref: 18
    phrase: then I will punish you seven times more for your sins
    kind: structure
    title: Seven times more
    body: |
      The curses rise in rounds, and each new round is for a people that has not turned back. After the first (verses 16–17), four more follow, each opening with Israel's refusal and each “seven times” heavier (verses 18, 21, 24, 28). In one older reading the blows also grow in number: barrenness of the land, “one heavier punishment”; wild beasts and childlessness, “two punishments”; “war, plague, and famine,” three; and at the last four together, the shrines destroyed, the cities overthrown, the land laid waste and the people scattered (verses 30–33). Seven, in that reading, “denotes the strengthening of the chastisement, even to the height of its full measure.”

      Verse 23 shows what the earlier blows were for: the next round comes on those who “will not be reformed by me by these things” ([[Lev. 26:23]]). The same older reading holds that if the punishments did not “bring Israel back to fidelity to its God,” the Lord would punish more severely, and that the series is “not to be understood historically, as a prediction of the temporal succession of the different punishments,” but as a picture of judgment answering sin. In one Latter-day Saint reading, the curses keep repeating through verse 38, and then the chapter turns: “if their punishments eventually lead them to repent, they can still be forgiven.”

      The sword of verse 25 “shall avenge the quarrel of my covenant.” In the same older reading, “covenant vengeance” was “punishment inflicted for a breach of the covenant, the severity of which corresponded to the greatness of the covenant blessings forfeited.”
    sources: [keil-leviticus, muhlestein-prospering, lds-scriptures]

  - ref: 26
    phrase: ten women shall bake your bread in one oven
    kind: history
    title: Bread by weight
    body: |
      The verse describes famine among a people driven into their cities (verse 25), with bread so scarce that ten women bake in a single oven. Ordinarily “every woman would require an oven for herself”; now one oven serves ten, and the bread is handed out “by weight, i.e., not as much as every one pleased, but in rations weighed out so scantily” that no one is satisfied. Samaria in the days of Joram ([[2 Kgs. 6:25]]) and Jerusalem under the Babylonians are the examples one older reading gives of how such calamities “burst upon Israel and Judah more than once when their fortified towns were besieged.”

      The next round names the worst of such a famine, parents eating their children (verse 29). The note at [[Ezek. 5:10]] says where the warning was fulfilled.
    sources: [keil-leviticus]

  - ref: 34
    phrase: Then shall the land enjoy her sabbaths
    kind: scripture
    title: The land keeps its sabbaths
    body: |
      The land was to rest every seventh year ([[Lev. 25:2–7]]). Here the LORD says that if Israel will not give it that rest, exile will: the land will lie empty and “enjoy her sabbaths … because it did not rest in your sabbaths, when ye dwelt upon it” ([[Lev. 26:34–35]]). The Chronicler reads the Babylonian exile this way. Judah was carried away “until the land had enjoyed her sabbaths: for as long as she lay desolate she kept sabbath, to fulfil threescore and ten years” ([[2 Chr. 36:21]]). The seventy years are Jeremiah's ([[Jer. 25:11–12]]; [[Jer. 29:10]]). On the verb “enjoy,” see the note on verse 41.
    sources: [lds-scriptures]

  - ref: 41
    phrase: they then accept of the punishment of their iniquity
    kind: words
    title: Accept of the punishment
    body: |
      “Accept of the punishment of their iniquity” is probably a debt image: the exiles pay off what their iniquity has cost. The verb is *ratsah*, which elsewhere in Leviticus is the word for an offering being “accepted” ([[Lev. 1:4]]). In this chapter the standard lexicon gives it the sense “make acceptable, satisfy (by paying off debt),” and it reads both uses that way. The land is “paying off its sabbaths” (verses 34 and 43, where the King James has “enjoy”), and the people pay off their guilt (verses 41 and 43). A modern translation has “they make amends for their iniquity.” Others take the verb in the same passages as “accept, be satisfied with [in payment].”

      One more passage belongs under the same sense, Isaiah's word to Jerusalem that “her iniquity is pardoned” ([[Isa. 40:2]]): “her punishment is accepted (as satisfactory).” The figure of “uncircumcised hearts” in the same verse is explained at [[Ex. 6:12]].
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]

  - ref: 42
    phrase: Then will I remember my covenant with Jacob, and also my covenant with Isaac
    kind: structure
    title: Jacob, Isaac and Abraham
    body: |
      The patriarchs are named backward, from Jacob to Abraham, and one Latter-day Saint reading takes the reversal as part of the book's movement toward the source of the covenant. The order “oddly reverses the normal sequence, perhaps to emphasize the overall progression of the text of Leviticus,” which, on that reading, moves “back in time as well as in space, into the presence of God and unto the source of the oath and covenant made by God to His people.” The same reading quotes a scholar on what is found at the tabernacle's innermost point: “still, only and always, the justice of God and his fidelity to the covenants he made with Abraham and Isaac and Jacob.”

      The reason for the order is a reading, not something the text explains. What the text does say is plain: the chapter “reaffirms the blessings and curses that are the essence of the covenant between God and Abraham,” and the LORD's answer to a people humbled in exile is to remember that covenant, and the land with it.
    sources: [ot-minute-lev]

  - ref: 44
    phrase: I will not cast them away, neither will I abhor them
    kind: scripture
    title: Not cast away
    body: |
      Even the worst of the curses does not end the covenant. Scattered “in the land of their enemies,” Israel is still the LORD's: He will not “destroy them utterly, and … break my covenant with them: for I am the LORD their God.”

      The Book of Mormon holds to the same promise. One Latter-day Saint reading notes that the Lord's promise to “remember” His covenant is “cited often toward the end of the Book of Mormon, including five times by Mormon and Moroni as the Nephite nation collapsed,” and that it “must have been especially poignant to Mormon and Moroni, who witnessed firsthand the fulfillment of many of Leviticus's curses.” Daniel's confession shares the words of verse 40; see the note at [[Dan. 9:11]].
    sources: [ot-minute-lev, lds-scriptures]

  - ref: 46
    phrase: These are the statutes and judgments and laws
    kind: history
    title: The close of the Sinai law
    body: |
      This verse closes not only the chapter but the laws given at Sinai; its “in mount Sinai” answers the opening of chapter 25 ([[Lev. 25:1]]), and it “serves as a summary statement for the book as a whole.”

      In one Latter-day Saint reading, “the statutes and judgments and laws” aim to “prepare the Israelites to become worthy of the land they will be inheriting—temple worthy, one might say—and to partake of Yahweh's holiness.” The Book of Mormon calls the law of Moses “the statutes and judgments” too, though Deuteronomy, where the phrase is far more common, is the likelier source of its wording.
    sources: [ot-minute-lev, bowen-law-codes, lds-scriptures]

christ: |
  The LORD who speaks in this chapter is the one who later stood among the Nephites and said, “I am he that gave the law, and I am he who covenanted with my people Israel; therefore, the law in me is fulfilled” ([[3 Ne. 15:5]]). In His own voice He gave the Nephites a promise in like words: “I will remember my covenant unto you, O house of Israel, and ye shall come unto the knowledge of the fulness of my gospel” ([[3 Ne. 16:12]]), a verse one Latter-day Saint list of verbal links between the Book of Mormon and Leviticus sets beside [[Lev. 26:45]]. That the LORD of the Old Testament is the premortal Christ is set out at [[Ex. 3:14]].

  The promise of His presence reaches the Church in the New Testament. The Church's footnote to [[Lev. 26:12]] points to Paul, who quotes it to the saints: “ye are the temple of the living God; as God hath said, I will dwell in them, and walk in them; and I will be their God, and they shall be my people” ([[2 Cor. 6:16]]).

explore: |
  - **The same covenant, renewed on the edge of the land.** [[Deut. 28]]; [[Deut. 30:1–10]].
  - **The covenant given to Nephi.** [[1 Ne. 2:19–24]].
  - **The warnings fulfilled, and the confession that answers them.** [[2 Chr. 36:15–21]]; [[Dan. 9:4–19]].
  - **The covenant remembered.** [[3 Ne. 16:10–12]]; [[3 Ne. 20:29]].

