chapter: 10
title: Strange Fire
tagline: On the day the priests begin their service, Aaron's two eldest sons offer fire the Lord had not commanded, and fire from the Lord kills them. Moses gives the Lord's word, Aaron is silent, and the commands that follow tell the priests how to stand near what is holy.
when: 'At Sinai, in the second year after the Exodus, on the day the priests first offered sacrifice'

setting: |
  Chapter 9 ended with the Lord's acceptance. On “the eighth day” of the priests' consecration Aaron offered his first sacrifices, and “there came a fire out from before the LORD, and consumed upon the altar the burnt offering and the fat” while the people shouted and fell on their faces ([[Lev. 9:1]]; [[Lev. 9:24]]; see the note there). Chapter 10 follows on the same day: Aaron speaks of the offerings made “this day” ([[Lev. 10:19]]).

  It is one of only two stories in Leviticus; the other is the account of the blasphemer in chapter 24. Nadab was Aaron's eldest son, and he and Abihu had gone up the mount with Moses and the seventy elders and seen the God of Israel ([[Ex. 24:1]]; [[Ex. 24:9–10]]; see the note on [[Ex. 24:1]]).

  Later scripture remembers the day twice. Numbers records that the two “died before the LORD, when they offered strange fire before the LORD,” that “they had no children,” and that Eleazar and Ithamar served as priests in their place ([[Num. 3:4]]). And the instructions for the Day of Atonement are dated by it: “after the death of the two sons of Aaron, when they offered before the LORD, and died” ([[Lev. 16:1]]).

thread: |
  Leviticus has two stories, and both are about failing to do what the Lord commanded; each ends in commands that lead into further instruction. Here the story is told in seven verses, and the rest of the chapter is what follows from it.

  The chapter falls into four parts. Verses 1–7 are the offense and the judgment: the fire, the deaths, Moses' explanation in the Lord's words (“I will be sanctified in them that come nigh me,” [[Lev. 10:3]]), Aaron's silence, and the removal of the bodies, with the surviving priests forbidden to mourn because “the anointing oil of the LORD is upon you” ([[Lev. 10:7]]). Verses 8–11 are the Lord's charge to Aaron himself: no wine in the sanctuary, so that the priests may tell holy from common and clean from unclean and teach Israel the statutes. Verses 12–15 return to the day's offerings and the portions the priests must eat. Verses 16–20 are the second time that day the sons of Aaron did not follow the law, a sin offering burned that should have been eaten, and it ends differently: Aaron gives his reason, and Moses “was content” ([[Lev. 10:20]]).

sections:
  - range: 1-7
    heading: The strange fire
    plain: |
      Nadab and Abihu, Aaron's sons, each took his censer, put fire in it and laid incense on it, and offered before the LORD fire that was not authorized, which He had not commanded them. Fire came out from the LORD and consumed them, and they died there before the LORD.

      Then Moses said to Aaron, “This is what the LORD meant when He said, ‘In those who come near me I will show myself holy, and before all the people I will be glorified.’” And Aaron was silent.

      Moses called Mishael and Elzaphan, the sons of Aaron's uncle Uzziel, and told them, “Come here and carry your kinsmen away from the front of the sanctuary to a place outside the camp.” They came and carried them out of the camp in their coats, as Moses had said.

      Moses said to Aaron and his sons Eleazar and Ithamar, “Do not let your hair hang loose or tear your clothes in mourning, or you will die and wrath will come upon the whole congregation. Your kinsmen, the whole house of Israel, may mourn the burning the LORD has kindled. But you must not leave the entrance of the tabernacle, or you will die, for the LORD's anointing oil is on you.” And they did as Moses said.
  - range: 8-11
    heading: The charge to Aaron
    plain: |
      The LORD spoke to Aaron: “You and your sons are not to drink wine or any intoxicating drink when you go into the tabernacle, or you will die. This is a permanent rule for all your generations. You are to distinguish between the holy and the common, and between the unclean and the clean, and to teach the children of Israel all the statutes the LORD has given them through Moses.”
  - range: 12-15
    heading: The priests' portions
    plain: |
      Moses told Aaron and his surviving sons, Eleazar and Ithamar, “Take the grain offering left over from today's offerings made by fire to the LORD, and eat it without leaven beside the altar, because it is most holy. Eat it in a holy place: it is your due and your sons' due from the LORD's offerings, as I have been commanded. The breast that was waved and the thigh that was lifted up you may eat in any clean place, you and your sons and daughters with you, for they are given to you and your sons as your due from the peace offerings of the children of Israel. They are to be brought with the fat for burning and waved before the LORD, and then they are yours and your sons' permanently, as the LORD has commanded.”
  - range: 16-20
    heading: The sin offering burned
    plain: |
      Moses searched diligently for the goat of the sin offering and found it had been burned. He was angry with Eleazar and Ithamar, Aaron's surviving sons, and said, “Why did you not eat the sin offering in the holy place? It is most holy, and God gave it to you to bear the iniquity of the congregation and make atonement for them before the LORD. Its blood was not brought into the holy place, so you should have eaten it there, as I commanded.”

      Aaron answered Moses, “Today they offered their sin offering and their burnt offering before the LORD, and yet these things have happened to me. If I had eaten the sin offering today, would the LORD have been pleased?” When Moses heard that, he was satisfied.

notes:
  - ref: 1
    phrase: offered strange fire before the LORD, which he commanded them not
    kind: history
    title: What Nadab and Abihu did wrong
    body: |
      The text names the fault in a single clause: the fire was one the Lord “commanded them not” ([[Lev. 10:1]]). Each brother put fire in his censer, laid incense on it, and offered it; “strange” means unauthorized, as with the “strange incense” forbidden on the golden altar (see the note on [[Ex. 30:9]]). The fault may have lain in the fire's source: Nadab was “struck dead for offering ‘strange’ fire (fire not taken from the altar).” The chapter itself says no more about what was wrong with the fire or the incense.

      The punishment came in the same form as the Lord's acceptance a few verses earlier. Then “there came a fire out from before the LORD, and consumed upon the altar the burnt offering” ([[Lev. 9:24]]); now “there went out fire from the LORD, and devoured them” ([[Lev. 10:2]]). Yet the bodies were still there to be carried out “in their coats” ([[Lev. 10:5]]).

      In one reading the story is a warning given on the first day of the priests' service: “Penalties are imposed if priests perform sacrifices improperly. Such rogue priests suffered the death penalty (verse 2).” How a fault in ritual could be mortal is the question verse 3 answers.
    sources: [bd-nadab, ot-minute-lev, lds-scriptures]
  - ref: 3
    phrase: I will be sanctified in them that come nigh me
    kind: words
    title: The Lord shows Himself holy in those near Him
    body: |
      Moses' explanation is that the Lord will be shown holy in His priests one way or another. “I will be sanctified” here means “I will show myself holy,” as a modern translation renders it: “Through those who are near me I will show myself holy, and before all the people I will be glorified.” Those who “come nigh” ([[Lev. 10:3]]) are the priests, “those who have the right to approach God.”

      In one older reading, the Lord had brought these men near to Himself and “sanctified them to Himself by anointing … that they might sanctify Him in their office and life. If they neglected this sanctification, He sanctified Himself in them by a penal judgment,” and so “glorified Himself as the Holy One, who is not to be mocked.” Whether Moses is quoting an earlier word is not certain. The words may be a quotation; or the Lord may not have given Moses these words by revelation but “had made the fact known by the position assigned to Aaron and his sons.”

      Aaron's answer is silence. The text does not say what the silence held; in the older reading, “He was obliged to acknowledge the righteousness of the holy God.” Verse 6 then forbids him the signs of mourning.

      The theme page [I Will Be Sanctified](/leviticus/themes/i-will-be-sanctified/) sets this verse beside 22:32, the other place where the LORD says He will be sanctified.
    sources: [nrsvue, cambridge-leviticus, keil-leviticus]
  - ref: 6
    phrase: Uncover not your heads, neither rend your clothes
    kind: history
    title: Why the priests could not mourn
    body: |
      Aaron and his surviving sons were forbidden the outward signs of grief because they had been anointed. “Uncover not your heads” ([[Lev. 10:6]]) means, in a modern translation, “Do not let the hair of your heads hang loose.” Loose hair and torn clothes are set against what the rest of Israel may do instead: “let your brethren, the whole house of Israel, bewail the burning which the LORD hath kindled” (the same verse). The grief was not forbidden; the priests' showing it was. The text gives the reason in the next verse: “for the anointing oil of the LORD is upon you” ([[Lev. 10:7]]). The law later makes this a standing rule for the high priest, the one “upon whose head the anointing oil was poured” ([[Lev. 21:10]]; see [[Lev. 21:10–12]]): “the oil belonged to God himself,” and “Aaron, having been anointed, is not allowed to engage in normal, ‘profane’ behavior.”

      On this occasion there may have been a second reason: to mourn “would imply that the Lord had been unjust in the punishment.”
    sources: [esv, belnap-skinner-sinai, ot-manual-lev-1-10, lds-scriptures]
  - ref: 9
    phrase: Do not drink wine nor strong drink
    kind: history
    title: No wine in the sanctuary
    body: |
      The ban on wine is the first command after the deaths, and it applies only to service, “when ye go into the tabernacle of the congregation,” under the same warning as the deaths, “lest ye die” ([[Lev. 10:9]]). It is one of the rules that came out of the judgment: “Aaron's sons were therefore given additional strict commandments as to the proper performance of their priestly functions.” The text does not say that Nadab and Abihu had been drinking.

      The command states its own purpose in the next two verses: a priest with a clear head can “put difference between holy and unholy” and “teach the children of Israel all the statutes” ([[Lev. 10:10–11]]).
    sources: [ot-minute-lev, lds-scriptures]
  - ref: 10
    phrase: put difference between holy and unholy, and between unclean and clean
    kind: words
    title: Holy and common, clean and unclean
    body: |
      Verse 10 gives the priests two different distinctions to keep: what is set apart for God from what is common, and what is clean from what is unclean. “Unholy” ([[Lev. 10:10]]) does not mean wicked: it is the common, for “the opposite of holy is common or profane.” “Unclean” and “clean” are the subject of chapters 11–15, and chapter 11 closes on this verse's charge, “To make a difference between the unclean and the clean” ([[Lev. 11:47]]); what uncleanness was, and what it barred a person from, is explained there (see [[Lev. 11]]).

      The two pairs meet in the priest's charge, and with them two kinds of concern: uncleanness under the early law was “essentially addressed as a physical problem,” but this verse “seems to involve and connect both the physical and spiritual aspects of being clean and unclean.” The priests were to judge these lines and then teach them (verse 11).
    sources: [gs-holy, sc-knowhy-479, lds-scriptures]
  - ref: 16
    phrase: Moses diligently sought the goat of the sin offering, and, behold, it was burnt
    kind: history
    title: The sin offering that was not eaten
    body: |
      Moses' anger turns on a rule of the sin offering. The goat was the people's sin offering of the day ([[Lev. 9:15]]), and its flesh “was to have been eaten by the priests in the holy place,” because its blood had not been carried into the sanctuary. Only a sin offering whose blood went inside was burned instead (verse 18; see the note on [[Lev. 6:30]]). This one was burned anyway. The rule is less tidy than Moses' words make it: Aaron's own sin offering that morning, the calf, had its blood put only on the altar outside and its flesh burned outside the camp ([[Lev. 9:9–11]]): “no blood has yet been brought into the Holy place, not even that of the calf for Aaron's Sin-Offering … and yet no objection against the burning of it was made by Moses.” The incident has been judged to hold “difficulties which have not been satisfactorily explained.” Moses blames Eleazar and Ithamar, but on one reading “they acted under direction, and Aaron acknowledges his responsibility by replying.”

      Verse 17 gives the reason the priests ate: God “hath given it you to bear the iniquity of the congregation, to make atonement for them before the LORD” ([[Lev. 10:17]]). Here “to bear the iniquity” may mean “to take the sin of another upon one's self, for the purpose of cancelling it,” as the high priest bore the iniquity of Israel's holy gifts (see the note on [[Ex. 28:38]]). The verse can also be taken either as “a general statement as to the efficacy of the Sin-Offering,” or as giving “an atoning value to the eating by the priests,” as one part of the whole rite.

      Aaron's answer is a question: “such things have befallen me: and if I had eaten the sin offering to day, should it have been accepted in the sight of the LORD?” ([[Lev. 10:19]]). Aaron's question can be read two ways. One reading hears a father's grief: “Does he not expect that I should feel as a father under such afflicting circumstances?” The other rejects that, since eating the sin offering “was not a joyous meal at all,” and takes Aaron to mean that after such a judgment they felt they had not the holiness “required for eating the general sin-offering.” The text records only the outcome: Moses “was content” ([[Lev. 10:20]]).
    sources: [keil-leviticus, cambridge-leviticus, ot-manual-lev-1-10, lds-scriptures]

christ: |
  The chapter's own sequel is the Day of Atonement. Leviticus 16 begins “after the death of the two sons of Aaron, when they offered before the LORD, and died,” and gives Aaron the one way to come within the veil, “that he die not” ([[Lev. 16:1–2]]); those rules may at one time have been “more closely connected with this narrative.” Hebrews 9 sets that high priest's yearly entry in contrast with the work of Christ, the great High Priest, who offered the perfect sacrifice of Himself once for all ([[Heb. 9:6–28]]).

