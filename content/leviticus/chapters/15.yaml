chapter: 15
title: The Tabernacle among Them
tagline: The last of the purity laws turns to discharges from the body, a man's and a woman's, in illness and in ordinary life. Each makes a person, and what that person touches, unclean for a time; each is ended by washing and waiting; and the reason for all of it is that the Lord's tabernacle stands in the camp.
when: 'At Sinai, in the second year after the Exodus'

setting: |
  Chapter 15 closes the “laws relating to ceremonial uncleanness” (chapters 13–15; the site's division puts 11–12 with them). Chapter 11 has dealt with animals, chapter 12 with childbirth, and chapters 13–14 with the skin disease and mildew the King James calls leprosy. This chapter turns to the body itself: discharges from the reproductive organs of men and of women, both those of illness and those of ordinary life. As in the chapters before it, “unclean” names a ritual state, not a moral one; what it was and what it barred a person from is explained at [[Lev. 11]].

  Chapter 16 follows, and its rites make atonement for the holy place “because of the uncleanness of the children of Israel” ([[Lev. 16:16]]). In one scholar's reading, that verse and this chapter's closing warning both show that Israel's impurity defiles the sanctuary (see the note on verse 31). Numbers later sends those with such a discharge outside the camp with the leper ([[Num. 5:2–3]]).

thread: |
  The chapter's thread is the tabernacle in the camp. Its last instruction gives the reason for every rule before it: “that they die not in their uncleanness, when they defile my tabernacle that is among them” ([[Lev. 15:31]]). The uncleanness is ritual, not moral, as in all of chapters 11–15 (see [[Lev. 11]] and the volume guide's section on [clean and unclean](/old-testament/guides/law-and-covenant/#clean-unclean)).

  The chapter takes four cases, in one older reading “two diseased and two natural secretions from the organs of generation”: a man's abnormal discharge (verses 2–15), his normal emission of semen, with the marriage act (16–18), a woman's monthly period (19–24), and her abnormal flow (25–30). Verses 31–33 give the reason and sum up.

  The cases differ in how long they last and how they end. In every one, “discharges by both men and women render them and those who come into contact with them unclean until they have ritually immersed.” An emission of semen, and the act of lying together, end with a bath and the evening (the evening is explained at [[Lev. 11:24–25]]). The monthly period lasts seven days, and a man who lies with her then is unclean seven days too. The abnormal ones last as long as the discharge does, then seven more days, and end on the eighth day with an offering at the tabernacle (the eighth day is explained at [[Lev. 14:10]]): “Irregular discharges render one unclean for an extended period.” Between the beginning and the end, uncleanness spreads by touch, to bed, seat and saddle and to whoever touches them, and it is undone by water and time.

sections:
  - range: 1-15
    heading: A man's discharge
    plain: |
      The LORD told Moses and Aaron to say to Israel: when a man has a discharge from his genitals, the discharge makes him unclean, whether it flows or is blocked. Any bed he lies on and anything he sits on becomes unclean. Anyone who touches his bed, sits where he sat, touches his body, or is spat on by him must wash his clothes and bathe, and stays unclean until evening. A saddle he rides on is unclean; whoever touches or carries anything that was under him is unclean until evening and must wash and bathe. Anyone he touches without first rinsing his hands must wash and bathe, and is unclean until evening. A clay pot he touches is to be broken, and a wooden one rinsed.

      When his discharge stops, he counts seven days, washes his clothes, bathes in running water, and is clean. On the eighth day he brings two turtledoves or two young pigeons to the priest at the entrance of the tabernacle. The priest offers one as a sin offering and one as a burnt offering, and makes atonement for him before the LORD for his discharge.
  - range: 16-18
    heading: Emission of semen
    plain: |
      When a man has an emission of semen, he bathes his whole body and is unclean until evening; any cloth or leather it touches is washed and is unclean until evening. When a man and a woman lie together, both bathe and are unclean until evening.
  - range: 19-24
    heading: A woman's monthly period
    plain: |
      When a woman has her monthly flow of blood, she is in her impurity seven days, and whoever touches her is unclean until evening. Whatever she lies or sits on during that time is unclean. Anyone who touches her bed or her seat must wash his clothes and bathe, and is unclean until evening. If a man lies with her and her flow comes on him, he is unclean seven days, and any bed he lies on is unclean.
  - range: 25-30
    heading: A prolonged flow
    plain: |
      If a woman's flow of blood goes on many days outside her monthly time, or runs past it, she is unclean as long as it lasts, just as in her monthly period, and her bed and seat are unclean in the same way; whoever touches them must wash and bathe, and is unclean until evening. When the flow stops, she counts seven days, and then she is clean. On the eighth day she brings two turtledoves or two young pigeons to the priest at the entrance of the tabernacle. He offers one as a sin offering and one as a burnt offering, and makes atonement for her before the LORD for her unclean discharge.
  - range: 31-33
    heading: The reason
    plain: |
      In this way you are to keep the children of Israel apart from their uncleanness, so that they do not die in it by defiling My tabernacle, which is among them. This is the law for the man with a discharge, for the man who has an emission of semen, for the woman in her monthly period, for anyone, man or woman, who has a discharge, and for the man who lies with a woman who is unclean.

notes:
  - ref: 2
    phrase: a running issue out of his flesh
    kind: history
    title: The man's discharge
    body: |
      The man's “issue” is an abnormal discharge from the genitals. A modern translation renders verse 2 “When any man has a discharge from his member,” and continues in verse 3, “whether his member flows with its discharge or is stopped from discharging.” The chapter does not name the illness, and it does not need to: what matters to the law is that the discharge is irregular and lasts. It is the man's counterpart to the woman's prolonged flow in verses 25–30, and both end the same way: “Those with an irregular seminal or menstrual discharge must wait seven days from the return to normal bodily function and offer a sacrifice before returning to ritual cleanliness.”
    sources: [nrsvue, ot-minute-lev]
  - ref: 12
    phrase: the vessel of earth, that he toucheth which hath the issue, shall be broken
    kind: history
    title: Why the clay pot is broken
    body: |
      A clay pot was broken because it could not be got clean. In one older reading, earthenware absorbed the uncleanness, so that it “could not be entirely removed by washing,” while a wooden vessel could be rinsed (here) and a bronze one scoured ([[Lev. 6:28]]). The same rule appears twice before this chapter, for opposite reasons. The clay pot in which the sin offering's most holy flesh was boiled was broken ([[Lev. 6:28]]), in that reading “lest any of the most holy flesh should adhere to the vessel, and be desecrated by its being used in the preparation of common food.” A clay pot that an unclean creature fell into was broken too ([[Lev. 11:33]]), and in the same reading defiled earthen vessels were broken “for the very opposite reason.” In that reading earthenware soaked up the holy and the unclean alike, and in both cases the pot went out of use.
    sources: [keil-leviticus, lds-scriptures]
  - ref: 15
    phrase: the priest shall make an atonement for him before the LORD for his issue
    kind: history
    title: An offering after an illness
    body: |
      The sin offering after a long discharge was for being made clean, not for having sinned. The man had done nothing wrong; his uncleanness was ritual (see the note on verse 18). Most uncleanness needed no offering at all: “In ordinary cases of uncleanness it was sufficient to remain in seclusion till the evening and then to wash the body. In certain cases a sin offering was necessary.” The text names them: this chapter's two abnormal discharges (verses 15, 30) and childbirth ([[Lev. 12:6–8]]). Even then the offering came only after the discharge had stopped and seven more days had passed (verses 13–14, 28–29).

      What the sin offering does is explained at [[Lev. 4:2]], where the Hebrew name for it is taken up. In one scholar's reading it is a purification offering that is brought both for inadvertent sins and for “severe physical impurity, as that of the parturient, leper, or gonorrheic (Leviticus 12–15),” and “the impure person needs purification and the sinner needs forgiveness.” The offering here is two birds, one for the sin offering and one for the burnt offering: the pair that at [[Lev. 5:7]] and [[Lev. 12:8]] is brought by one who cannot afford a lamb, and here is asked of everyone.
    sources: [bd-clean-unclean, milgrom-temple, lds-scriptures]
  - ref: 18
    phrase: they shall both bathe themselves in water
    kind: history
    title: Unclean, not sinful
    body: |
      Lying together made a man and a woman unclean only until evening, and the reason was not that it was wrong. Uncleanness under these laws “referred to being ceremonially or ritually unclean” and is not to be taken to mean that ordinary bodily life was “morally evil.” In one older reading, what defiled here was not intercourse itself but the emission of seed, the subject of verses 16–17.

      The practical effect was on worship. Another older reading puts it in a line: “As unclean they could not take part in the service of the sanctuary.” The same reading compares two similar limits elsewhere in scripture: as Israel prepared to meet the Lord at Sinai, Moses told the people, “Be ready against the third day: come not at your wives” ([[Ex. 19:15]]); and at [[1 Sam. 21:4–5]] David's men may eat the holy bread because they have kept from women.
    sources: [bd-clean-unclean, keil-leviticus, cambridge-leviticus, lds-scriptures]
  - ref: 24
    phrase: her flowers be upon him
    kind: words
    title: “Flowers” and “put apart”
    body: |
      “Flowers” is an old English word for the menstrual flow; Webster's dictionary of 1828 still gives among the senses of “flower” “Menstrual discharges.” It renders the Hebrew *niddah*, a word for ceremonial impurity, “especially of menstruation,” found at verses 19, 20, 24, 25, 26 and 33 of this chapter. The King James renders the one word several ways, among them “flowers,” “put apart” and “separation.”

      So when verse 19 says “she shall be put apart seven days,” the Hebrew says, word for word, that seven days she shall be in her *niddah*, her state of menstrual impurity; the phrase names her condition and its length. Verse 24 then says what follows if a man lies with her while she is in it: he takes on her impurity, for seven days rather than until evening.
    sources: [webster-1828, bdb, strongs-concordance, oshb-wlc]
  - ref: 31
    phrase: that they die not in their uncleanness, when they defile my tabernacle that is among them
    kind: history
    title: Why uncleanness was dangerous
    body: |
      Uncleanness was dangerous because the Lord's dwelling stood in the middle of the camp. The tabernacle was built so that He might “dwell among them” ([[Ex. 25:8]]), and an Israelite who stayed unclean defiled it. In one scholar's reading, this verse rests on the idea that “impurity is the implacable foe of holiness wherever it exists; it assaults the sacred realm even from afar,” so that the sanctuary could be defiled by people who never went near it.

      The same reading sets Israel apart from its neighbors. They feared impurity as demonic; “in Israel, however, there are no traces of demonic impurity.” What remained was the people's own: “He alone can contaminate the sanctuary and force God out.” The same reading sums up what the whole system of purification guarded against: “Man can evict God from His earthly abode, but only to destroy himself.” And on that reading the sanctuary still had to be cleansed of what Israel's impurity had left on it, “despite the fact that Israelites have had no access,” which is the work of the Day of Atonement ([[Lev. 16:16]]; see [[Lev. 16]]).
    sources: [milgrom-temple, lds-scriptures]

christ: |
  The law of verse 25 is the background of a healing the Gospels tell three times ([[Matt. 9:20–22]]; [[Mark 5:25–34]]; [[Luke 8:43–48]]); in one older reading, the woman “was thus afflicted.” Under that law a woman whose flow went on “beyond the time of her separation” was unclean “all the days of the issue” ([[Lev. 15:25]]), and she had had it “twelve years” ([[Mark 5:25]]). The law's rites could begin only after the flow had stopped (verse 28). She touched the Savior's clothes, “and straightway the fountain of her blood was dried up” ([[Mark 5:29]]). He knew “that virtue had gone out of him” ([[Mark 5:30]]), and He said to her, “Daughter, thy faith hath made thee whole; go in peace, and be whole of thy plague” ([[Mark 5:34]]).

