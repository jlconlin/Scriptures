chapter: 21
title: The Holiness of the Priests
tagline: The men who offer the bread of their God are held to a stricter holiness than Israel, in how they mourn, whom they marry and who may stand at the altar, and the high priest strictest of all.
when: 'At Sinai, in the second year after the Exodus'

setting: |
  Chapters 17–26 are the part of Leviticus scholars call the Holiness Code (see the setting of [[Lev. 17]]). Chapters 19 and 20 laid holiness on all Israel; chapters 21 and 22 turn to the priests, with rules for “the conduct of priestly activities” in the sanctuary. The priests and the high priest “were representations of Yahweh and his holiness,” which helps explain the code's many rules for them.

  The chapter is spoken to the priests (verse 1) and to Aaron (verse 17), but Moses tells it “unto all the children of Israel” as well (verse 24): the people were to know what their priests were held to. Ezekiel's vision of the restored temple repeats several of these rules for its priests, on hair, marriage and the dead ([[Ezek. 44:20–25]]). The Book of Mormon quotes and echoes Leviticus often, but none of its quotations comes from this chapter. This is one of the chapters “where more technical provisions tend to be found.”

thread: |
  The chapter moves inward in three circles, and each closes on the LORD's word that He is the one who makes holy: “I the LORD, which sanctify you, am holy” (verse 8); “I the LORD do sanctify him” (verse 15); “I the LORD do sanctify them” (verse 23).

  The first circle is every priest (verses 1–9). He may not make himself unclean for the dead, except for his nearest family; he may not mark his body in mourning; he may not marry a prostitute, a dishonored woman or a divorced woman; and a daughter who plays the harlot profanes him (verse 9). The reason is what he handles: he offers “the bread of their God” (verse 6), the food laid on the altar (see [[Lev. 3:11]]).

  The second circle is the high priest (verses 10–15). He may not mourn at all, not even for his father or mother, nor leave the sanctuary for a death; he may marry only a virgin of his own people. The anointing oil is on him (verse 12).

  The third circle is the priest with a bodily defect (verses 16–23). He may not come to the altar or the veil, but he is still a priest: he eats “the bread of his God, both of the most holy, and of the holy” (verse 22). The rules guard the places and the men the LORD has set apart.

sections:
  - range: 1-9
    heading: Every priest
    plain: |
      The LORD told Moses to say to the priests, Aaron's sons: none of you may make himself unclean for a dead person among your people, except for his closest relatives: his mother, father, son, daughter, brother, or an unmarried sister who lives near him and has no husband; for her he may become unclean. He must not make himself unclean as a husband and head of a household among his people, and so profane himself (the words are obscure; see the note on verse 4).

      Priests must not shave bald patches on their heads, shave the edges of their beards, or cut their flesh. They must be holy to their God and not profane His name, because they offer the LORD's offerings by fire, the bread of their God; so they must be holy. A priest must not marry a prostitute, a woman who has been dishonored, or a divorced woman, because he is holy to his God. Treat the priest as holy, for he offers the bread of your God; he shall be holy to you, for I the LORD, who make you holy, am holy. If a priest's daughter profanes herself by prostitution, she profanes her father; she shall be burned with fire.
  - range: 10-15
    heading: The high priest
    plain: |
      The high priest, the one among his brothers on whose head the anointing oil was poured and who has been consecrated to wear the holy garments, must not let his hair hang loose or tear his clothes in mourning. He must not go near any dead body or make himself unclean even for his father or his mother. He must not leave the sanctuary for a death, or profane the sanctuary of his God, for the consecration of his God's anointing oil is on him: I am the LORD.

      He shall marry a virgin. Not a widow, a divorced woman, a dishonored woman or a prostitute: he shall marry a virgin of his own people, so that he does not profane his descendants among his people; for I the LORD make him holy.
  - range: 16-24
    heading: Priests with a defect
    plain: |
      The LORD told Moses to say to Aaron: no man of your descendants, in any generation, who has a defect may come near to offer the bread of his God. No one with a defect may come near: a man blind, lame, pierced, or deformed; a man with a broken foot or a broken hand; one hunchbacked or a dwarf, one with a defect in his eye, a rash, running sores, or crushed testicles. No man of Aaron's line who has a defect shall come near to offer the LORD's offerings by fire; he has a defect, and he shall not come near to offer the bread of his God.

      He may eat the bread of his God, both the most holy and the holy. Only he shall not go in to the veil or come near the altar, because he has a defect, so that he does not profane my sanctuaries; for I the LORD make them holy. And Moses told this to Aaron and his sons and to all the children of Israel.

notes:
  - ref: 1
    phrase: There shall none be defiled for the dead among his people
    kind: history
    title: Defiled for the dead
    body: |
      A priest was to keep away from the uncleanness a corpse brought, except at the death of his nearest family (verses 2–3). The uncleanness was ritual, not sin (see the setting of [[Lev. 11]]), but it spread: under the law of Numbers everyone who came into the tent where a man had died was unclean for seven days ([[Num. 19:14]]). In one scholar's reading of the corpse law in [[Num. 19]], whoever was defiled by a corpse and did not purify himself “has contaminated the Lord's sanctuary”; in that reading “impurity is the implacable foe of holiness wherever it exists.”

      Joseph Smith's manuscript of the Bible changes the preposition: “There shall none be defiled with the dead,” and at verse 11, “Neither shall he go in to touch any dead body.” The change is not in the Church's printed footnotes. In one Latter-day Saint reading it may be a clarification: “for could be mistakenly understood as ‘on behalf of’,” the sense “for the dead” has in [[1 Cor. 15:29]], while “with” better gives what “seems to be the sense of the Hebrew preposition in context.” The addition at verse 11 “emphasizes that the priest must avoid physical contact with the corpse, not simply its presence.”
    sources: [lds-scriptures, milgrom-temple, horton-jst-pentateuch, bowen-law-codes]

  - ref: 4
    phrase: being a chief man among his people
    kind: words
    title: '“A chief man”: a husband?'
    body: |
      “A chief man” translates the Hebrew *baʿal*, a word that means “master” and so also “husband,” and no one is sure what the verse means. The words “are obscure,” and “the early translators have wandered in uncertainty among different renderings.”

      Taken as “a husband,” the verse would forbid a priest to mourn his wife; but it is hard to suppose, with the list of near kin in verse 2 just before it, “that a priest whose wife died was forbidden to approach the body.” One older reading holds that the wife is included in “his kin, that is near unto him” (verse 2), and takes verse 4 as a heading for the marriage rules that follow: the priest was not to profane himself “as a husband and the head of a household, either by marrying a wife of immoral or ambiguous reputation, or by training his children carelessly” (verses 7, 9). Others suspect the Hebrew has been damaged in copying, and one proposal changes the word to read “in mourning.” The paraphrase above follows the older reading and marks it as uncertain.
    sources: [oshb-wlc, bdb, keil-leviticus, cambridge-leviticus]

  - ref: 6
    phrase: They shall be holy unto their God, and not profane the name of their God
    kind: history
    title: Holy because of what they offer
    body: |
      The text gives one reason for all the priest's rules: “the offerings of the LORD made by fire, and the bread of their God, they do offer: therefore they shall be holy.” The marks of verse 5, the shaved patch on the head, the trimmed beard and the cuttings in the flesh, are signs of mourning; the priests “were restricted in the way that they were allowed to mourn.” Israel as a whole had already been told not to cut themselves “for the dead” ([[Lev. 19:28]]); the priest, who stood at the altar, is held to it again in his own law. Verse 8 lays the duty on the people too: “he shall be holy unto thee,” because the LORD who sanctifies is holy (the words spoken to all Israel at [[Lev. 19:2]]).

      Why so much weight on the priests? In one Latter-day Saint reading, “such priestly holiness would necessarily serve as a kind of beachhead for the broader hallowing (or sanctification) of the entire community”: the people were to become holy, and the priests were where it began.
    sources: [lds-scriptures, bowen-law-codes]

  - ref: 7
    phrase: They shall not take a wife that is a whore, or profane
    kind: history
    title: The priest's marriage and household
    body: |
      A priest's marriage was held to his office. An ordinary priest might not marry a prostitute, a woman “profane” (the Hebrew is used of a woman sexually dishonored), or a divorced woman, “for he is holy unto his God” (verse 7). The high priest's list adds the widow: he might marry only “a virgin of his own people,” so that he did not “profane his seed among his people” (verses 14–15). Ezekiel's restored temple holds every priest to a rule nearer the high priest's: no widow, except “a widow that had a priest before” ([[Ezek. 44:22]]).

      The household carried the priest's holiness with it. A priest's daughter who played the harlot “profaneth her father” (verse 9), and the sentence is death by fire, the sentence Judah pronounced on Tamar ([[Gen. 38:24]]). The end of all these laws was that “the priest and the high priest might maintain and partake of Yahweh's holiness.”
    sources: [lds-scriptures, bowen-law-codes, bdb]

  - ref: 10
    phrase: shall not uncover his head, nor rend his clothes
    kind: scripture
    title: The high priest who could not mourn
    body: |
      The high priest was forbidden every outward sign of grief, even for his father or mother (verse 11). Aaron and his sons were told the same, in the same words, on the day Nadab and Abihu died ([[Lev. 10:6–7]], where loosed hair and torn clothes are explained); here the rule is given for whoever is “the high priest among his brethren.” He “is not allowed to act like the rest of society during the mourning process because ‘the crown of the anointing oil of his God is upon him’” (verse 12).

      The Gospels show a high priest breaking it. At the trial of Jesus, Caiaphas tore his clothes and cried blasphemy ([[Matt. 26:65]]; [[Mark 14:63]]). In one Latter-day Saint reading he “apparently violated Leviticus 21:10” in doing so, during proceedings that were themselves illegal.
    sources: [belnap-dwell-among, bowen-law-codes, lds-scriptures]

  - ref: 12
    phrase: the crown of the anointing oil of his God is upon him
    kind: words
    title: '“The crown of the anointing oil”'
    body: |
      The “crown” here is not a headpiece but the high priest's consecration. In one older reading, the verse means “the consecration of the oil of anointing of his God is upon him”: *nezer* does not mean “the diadem of the high priest here, as in Exodus 29:6,” “but consecration.” That older reading points to the Nazarite, of whom the law says, with the same Hebrew word, which the King James there renders “consecration,” that he may not make himself unclean “for his father, or for his mother … because the consecration of his God is upon his head” ([[Num. 6:7]]).

      That is why he could not “go out of the sanctuary” (verse 12), which one older reading takes to mean leaving it to grieve or attend a funeral. In one Latter-day Saint reading, the oil marks a change worked in him by God: “This transformation by God is expressed throughout Leviticus.” The pouring of the oil on Aaron's head is at [[Lev. 8:12]].
    sources: [oshb-wlc, bdb, keil-leviticus, lds-scriptures, belnap-dwell-among]

  - ref: 17
    phrase: that hath any blemish, let him not approach to offer the bread of his God
    kind: history
    title: Priests who may not serve at the altar
    body: |
      A man of Aaron's line with a bodily defect could not offer at the altar or go in to the veil, but he stayed a priest and ate the most holy food (verses 22–23). The Hebrew word for his “blemish” is the one used of an animal unfit for the altar ([[Lev. 22:20]]). Several of the words in the list (verses 18–20) are rare and “have been subject to different translations”; the paraphrase follows one Latter-day Saint rendering. Not every condition barred a man: “while those who are blind are excluded, those who are deaf and mute are not.”

      The text's reason is “that he profane not my sanctuaries” (verse 23). The law has been read as a stigma on people with disabilities; it can as well be read the other way, as an exemption that guaranteed “that priests with disabilities were exempt from the altar service and were entitled to sustenance from the sacrifices.” The altar service was labor-intensive: “the slaughtering of animals, cutting and preparing of the parts, … tending the fire of the altar, moving frequently between the altar and the laver.” The meal of the holy food may have been the higher privilege, and the issue “is not one of impurity,” since they ate holy food in holy places with no penalty named. On this reading “to profane” is “to untie, loosen”: a priest who served anyway may have loosened an order of mercy the LORD had set, as work on the Sabbath does. Neither reading is sure: “Neither of the interpretations of this passage can be proven with certainty.”
    sources: [calabro-disability, lds-scriptures]

christ: |
  The LORD who says three times in this chapter that He sanctifies is Jehovah, the premortal Jesus Christ (see [[Ex. 3:14]]). The holiness the priests guard is His.

  In one Latter-day Saint reading, the law's demand for a priest without blemish points to Him: “the ‘unblemished’ priest, like the ‘unblemished’ sacrifice typifies Christ, who lived free of both physical and moral blemish.” The same reading notes that the high priest at His trial broke this chapter's law (see the note on verse 10). And one Latter-day Saint commentary hears “an echo of these priestly functions” in the risen Lord's instructions at Bountiful, where the disciples bring the bread and wine, give them to the people, and guard who partakes ([[3 Ne. 18:1–4]]; [[3 Ne. 18:28]]).

