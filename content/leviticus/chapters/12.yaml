chapter: 12
title: After Childbirth
tagline: A mother is unclean for a time after giving birth, a week for a son and two for a daughter, and then waits longer before she may come to the sanctuary. At the end she brings a burnt offering and a sin offering, and if she cannot afford a lamb, two birds.
when: 'At Sinai, in the second year after the Exodus'

setting: |
  Chapter 11 closed on the charge “to make a difference between the unclean and the clean” ([[Lev. 11:47]]), and the chapters that follow apply it to uncleanness that comes from the human body: childbirth here, “leprosy” in chapters 13–14, and bodily discharges in chapter 15. What uncleanness was, and what it kept a person from, is explained at [[Lev. 11]] and in the volume guide's [section on clean and unclean](/old-testament/guides/law-and-covenant/#clean-unclean). In a word, it was ceremonial and not moral.

  The chapter is eight verses long, and it borrows from the laws on either side of it. Its first week is measured by the rule for a woman's monthly uncleanness, given later at [[Lev. 15:19]]; its offerings are the burnt offering of chapter 1 and the sin offering of chapter 4; and its allowance for a poor mother is the one already made for the poor at [[Lev. 5:7]].

  The New Testament shows the law kept at the Savior's birth ([[Luke 2:22–24]]), as the Witness of Christ below sets out.

thread: |
  The chapter is a calendar with an offering at the end. A mother is unclean for seven days after a son is born, as in her monthly separation; on the eighth day, the day after that first week ends, the boy is circumcised (verses 2–3). She then waits thirty-three more days, “the blood of her purifying,” in which she is not to touch holy things or come to the sanctuary (verse 4). For a daughter both periods are doubled, fourteen days and sixty-six days (verse 5).

  When the days are over, she may come to the sanctuary she has been kept from. She brings to the door of the tabernacle a lamb for a burnt offering and a bird for a sin offering, the priest makes atonement for her, and the chapter closes on its result, “she shall be clean” (verses 6–8). The offering is the same for a son as for a daughter, and the poor mother's two birds bring her to the same end.

sections:
  - range: 1-5
    heading: The days of her purifying
    plain: |
      The LORD spoke to Moses: “Tell the Israelites: When a woman conceives and gives birth to a son, she is unclean for seven days, just as she is unclean during her monthly period. On the eighth day the boy's foreskin is to be circumcised. Then she is to wait thirty-three days more for her purification from bleeding. She must not touch anything holy or come into the sanctuary until those days are over.

      “If she gives birth to a daughter, she is unclean for two weeks, as during her period, and then she is to wait sixty-six days in the blood of her purifying.
  - range: 6-8
    heading: Her offerings
    plain: |
      “When the days of her purification are over, whether for a son or for a daughter, she is to bring to the priest at the door of the tabernacle a year-old lamb for a burnt offering and a young pigeon or a turtledove for a sin offering. He will offer them before the LORD and make atonement for her, and she will be clean from the flow of her blood. This is the law for a woman who gives birth to a boy or a girl.

      “If she cannot afford a lamb, she is to bring two turtledoves or two young pigeons, one for a burnt offering and the other for a sin offering. The priest will make atonement for her, and she will be clean.”

notes:
  - ref: 2
    phrase: then she shall be unclean seven days
    kind: history
    title: Unclean, not sinful
    body: |
      A mother's uncleanness after giving birth was ritual: it kept her from holy things and the sanctuary for a time, and it said nothing against the birth. This chapter is among the standard examples: “For seven or fourteen days after the birth of a child the mother was unclean (Lev. 12).” Uncleanness “referred to being ceremonially or ritually unclean and should not be taken to mean that … the bearing of children was morally evil.”

      The verse sets the first week by another rule: “according to the days of the separation for her infirmity” means, in a modern translation, “as at the time of her menstruation.” That law comes in chapter 15, where a woman is “put apart seven days” ([[Lev. 15:19]]). The text ties the uncleanness to the mother's bleeding: at the end she is “cleansed from the issue of her blood” ([[Lev. 12:7]]).

      Far from shaming the birth, the chapter's rules can be read to “celebrate and sanctify the most holy and exquisite purpose of family life—bringing human beings into this world.”
    sources: [bd-clean-unclean, nrsvue, ot-minute-lev, lds-scriptures]

  - ref: 4
    phrase: continue in the blood of her purifying three and thirty days
    kind: words
    title: The blood of her purifying
    body: |
      The second period is named as a time of purification, while the first week is named as uncleanness. Verse 2 says she “shall be unclean seven days”; verse 4 calls the next thirty-three days “the blood of her purifying,” which a modern translation renders “her time of blood purification.” Through it she still “shall touch no hallowed thing, nor come into the sanctuary.” The two periods together come to forty days after a son and eighty after a daughter (verses 2, 4 and 5).

      Joseph Smith's manuscript of his translation changes the wording in verses 3–5: “the man child shall be circumcised” for “the flesh of his foreskin,” and “the time of her purifying” for “the blood of her purifying.” The changes “seem euphemistic,” and “there is probably no objective way of knowing whether these changes were the Prophet's idea, or whether they came from the Lord.”
    sources: [nrsvue, horton-jst-pentateuch, lds-scriptures]

  - ref: 5
    phrase: then she shall be unclean two weeks
    kind: history
    title: Twice as long for a daughter
    body: |
      The text doubles both periods for a daughter but gives no reason, and none is known. It is a question “that seems to have no key at present for its correct interpretation,” and speculation on it “is pointless until further revelation is received on the matter.”

      Older commentaries proposed reasons from ancient medicine and belief. One older reading holds that the longer time rested on “the notion, which was very common in antiquity, that the bleeding and watery discharge continued longer after the birth of a girl than after that of a boy.” Another traces it to a belief, common among ancient peoples, “that the birth of a girl was more dangerous for the mother than the birth of a boy,” and holds that the practice “survived the belief on which it was founded.” Neither reason is given in the text; each rests on what its commentator took ancient peoples to believe.

      What the text does say is that the rest of the law is the same for both. The offering is brought “for a son, or for a daughter” ([[Lev. 12:6]]), and the chapter closes, “This is the law for her that hath born a male or a female” ([[Lev. 12:7]]).
    sources: [ot-manual-lev-11-18, keil-leviticus, cambridge-leviticus, lds-scriptures]

  - ref: 6
    phrase: a young pigeon, or a turtledove, for a sin offering
    kind: history
    title: A sin offering when no sin was done
    body: |
      The mother's sin offering is not for a sin: here it is the offering that cleanses, and a modern translation names it here “a purification offering.” The King James name and the Hebrew word behind it, *ḥaṭṭaʾt*, are explained at [[Lev. 4:3]]. The same offering served two purposes in the law; it is brought either for “severe physical impurity, as that of the parturient, leper, or gonorrheic (Leviticus 12–15),” that is, the mother after childbirth, the leper and the person with a discharge, “or because of the commission of certain inadvertent sins.”

      The ending of the rite shows which purpose this one serves. In chapter 4 the priest makes atonement and the sin “shall be forgiven” (see the note on [[Lev. 4:20]]); here the priest makes atonement and she “shall be cleansed from the issue of her blood” ([[Lev. 12:7]]), “and she shall be clean” ([[Lev. 12:8]]). What the word “atonement” does is explained at [[Ex. 25:17]].
    sources: [nrsvue, milgrom-temple, lds-scriptures]

  - ref: 8
    phrase: if she be not able to bring a lamb
    kind: scripture
    title: If she could not afford a lamb
    body: |
      A mother who could not afford a lamb brought a second bird in its place, and the same atonement was made. The allowance is the one the law had already made for a poor sinner at [[Lev. 5:7]] (see the note there): in both verses the Hebrew says the person lacks *dei seh*, “enough for (i.e. to buy) a lamb.”

      There is one difference. A sinner too poor even for two birds could bring “the tenth part of an ephah of fine flour” ([[Lev. 5:11]]); the law for the mother names nothing smaller than the birds.
    sources: [bdb, lds-scriptures]

christ: |
  Scripture shows Mary keeping this law. When the days of her purification were accomplished, she and Joseph brought Jesus to the temple, “to present him to the Lord,” and “to offer a sacrifice according to that which is said in the law of the Lord, A pair of turtledoves, or two young pigeons” ([[Luke 2:22–24]]). Luke's words take up [[Lev. 12:8]], the offering of a mother who could not bring a lamb, and one older reading draws the conclusion that Mary “offered the sacrifices of one whose ‘means suffice not for a lamb.’”

  The infant Christ was carried into the temple by a mother keeping this law. She offered for herself sacrifices that were, in Amulek's words, “every whit pointing to that great and last sacrifice; and that great and last sacrifice will be the Son of God” ([[Alma 34:14]]). How the law of sacrifice pointed to Christ and ended in Him is set out at [[Lev. 1:4]].

