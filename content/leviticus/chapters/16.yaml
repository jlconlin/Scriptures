chapter: 16
title: The Day of Atonement
tagline: Once a year the high priest passes the veil with blood, cleanses the sanctuary that Israel's uncleanness has reached, and sends a goat bearing the people's sins into the wilderness, so that the people may be clean before the LORD.
when: 'At Sinai, in the second year after the Exodus; the rite itself is kept every year on the tenth day of the seventh month'

setting: |
  The chapter picks up where the story of [[Lev. 10]] stopped. It is dated “after the death of the two sons of Aaron, when they offered before the LORD, and died” ([[Lev. 16:1]]), and the LORD's first word is a warning that Aaron is not to come within the veil whenever he chooses, “that he die not” ([[Lev. 16:2]]). What follows is the one way in. What Nadab and Abihu did is explained at [[Lev. 10:1]].

  The day is “the tenth day” of “the seventh month” ([[Lev. 16:29]]), Yom Kippur in Hebrew. The chapter never names it; the name “a day of atonement” comes in the calendar of feasts ([[Lev. 23:27–28]]), and the day's other directions are at [[Ex. 30:10]], [[Lev. 23:26–32]] and [[Num. 29:7–11]]. William Tyndale coined the English words “atonement,” “scapegoat” and “mercy seat” for this festival, and the King James translators kept them.

  The chapter stands between the laws of clean and unclean (11–15) and the laws of holiness (17–26). One reading of the book's shape follows the high priest inward through the tabernacle; in it, chapter 16 gives the “prerequisites for reconciliation with God and access to the Holy of Holies” before the holiness laws begin. Hebrews reads the day at length beside the work of Christ (see the Witness of Christ below).

thread: |
  The chapter follows one man through one day, and the order of the day carries its meaning. Aaron makes atonement first “for himself, and for his household,” then in “the holy place,” and then “for all the congregation of Israel” ([[Lev. 16:17]]), and the closing summary names them again: the sanctuary, the tabernacle, the altar, the priests and all the people ([[Lev. 16:33]]). His own bull dies, and its blood goes within the veil, before the people's goat is killed (verses 11–15).

  Two things are done with Israel's sin, and they are kept apart. The blood of the LORD's goat makes atonement for the holy place “because of the uncleanness of the children of Israel” ([[Lev. 16:16]]); the live goat carries “all the iniquities of the children of Israel” away into the wilderness ([[Lev. 16:21–22]]). Then the high priest changes his clothes, the burnt offerings are made, and everyone who handled the goat or the carcasses washes before coming back into the camp (verses 23–28).

  The people have their part: they humble themselves and do no work, the stranger as well as the native (verses 29–31). The chapter ends on the promise the whole rite serves, “that ye may be clean from all your sins before the LORD” ([[Lev. 16:30]]), and on its limit: “once a year” ([[Lev. 16:34]]).

sections:
  - range: 1-2
    heading: The warning
    plain: |
      The LORD spoke to Moses after the death of Aaron's two sons, who died when they drew near to the LORD. He said: “Tell your brother Aaron that he must not come whenever he likes into the most holy place, behind the veil, before the mercy seat on the ark, or he will die; for I appear in the cloud above the mercy seat.”
  - range: 3-10
    heading: What Aaron brings
    plain: |
      This is how Aaron may enter: with a young bull for a sin offering and a ram for a burnt offering. He must bathe and put on the holy linen garments: the linen tunic, the linen undergarment, the linen sash and the linen turban. From the congregation he takes two male goats for a sin offering and a ram for a burnt offering.

      Aaron offers his own bull as a sin offering, to make atonement for himself and his household. He sets the two goats before the LORD at the door of the tabernacle and casts lots over them, one lot for the LORD and the other for the scapegoat (see the note on verse 8). The goat on which the LORD's lot falls he offers as a sin offering. The other is set alive before the LORD, to make atonement with it, and then sent away into the wilderness.
  - range: 11-19
    heading: The blood within the veil
    plain: |
      Aaron kills the bull of his own sin offering. He takes a censer full of burning coals from the altar before the LORD and two handfuls of finely ground incense, brings them behind the veil, and puts the incense on the fire, so that its cloud covers the mercy seat over the testimony and he does not die. He sprinkles some of the bull's blood with his finger on the front of the mercy seat and seven times before it.

      Then he kills the people's goat, brings its blood behind the veil, and does the same with it. So he makes atonement for the most holy place because of the uncleanness and the transgressions of the children of Israel, and does the same for the tent, which stands among them in the middle of their uncleanness. No one else may be in the tent from the time he goes in until he comes out. Then he goes out to the altar before the LORD, puts the blood of the bull and the goat on its horns, and sprinkles blood on the altar seven times, to cleanse it and make it holy again from Israel's uncleanness.
  - range: 20-22
    heading: The live goat
    plain: |
      When he has finished cleansing the most holy place, the tent and the altar, he brings the live goat. Aaron lays both his hands on its head and confesses over it all the iniquities and transgressions of the children of Israel, putting them on the goat's head, and a man appointed for the task leads the goat away into the wilderness. The goat carries all their iniquities to a land cut off, and the man lets it go in the wilderness.
  - range: 23-28
    heading: The close of the day
    plain: |
      Aaron goes into the tent, takes off the linen garments he wore into the most holy place, and leaves them there. He bathes in a holy place, puts on his own garments, comes out, and offers his burnt offering and the people's, making atonement for himself and for the people; and he burns the fat of the sin offering on the altar. The man who led away the goat washes his clothes and bathes before he comes back into the camp. The bull and the goat of the sin offerings, whose blood was taken into the holy place, are carried outside the camp and burned, skin, flesh and dung; and the man who burns them also washes and bathes before he returns.
  - range: 29-34
    heading: A statute for ever
    plain: |
      This is a permanent statute: on the tenth day of the seventh month you shall humble yourselves and do no work at all, the native-born and the stranger living among you alike. On that day the priest makes atonement for you, to cleanse you, so that you are clean from all your sins before the LORD. It is a sabbath of complete rest for you, and you shall humble yourselves; it is a statute for ever.

      The priest who is anointed and consecrated to serve in his father's place shall make the atonement, wearing the holy linen garments. He makes atonement for the most holy place, for the tent, for the altar, for the priests and for all the people. This is an everlasting statute, to make atonement for the children of Israel for all their sins once a year. And Moses did as the LORD commanded him.

notes:
  - ref: 2
    phrase: that he come not at all times into the holy place within the veil
    kind: history
    title: Within the veil, once a year
    body: |
      Even the high priest could pass the veil only on this one day, and only in the way the chapter sets out. “The holy place” in this chapter is the inner room “within the veil” (verses 2, 12), the most holy place. “At all times” is answered at the end of the chapter by “once a year” ([[Lev. 16:34]]), on the date given in verse 29. The veil itself is described at [[Ex. 26:31]].

      The chapter's opening date makes the deaths of Nadab and Abihu the background of the warning. In one older reading the link was meant “to show the importance and holiness attached to an entrance into the inmost sanctuary of God,” and their death “was to be a solemn warning to Aaron himself.”

      The reason the text gives is the LORD's own presence: “for I will appear in the cloud upon the mercy seat” ([[Lev. 16:2]]), the place where He had promised to meet Moses ([[Ex. 25:22]]). The same older reading takes this cloud as “the cloud of the divine glory,” not the smoke of the incense in verse 13, and holds that even the anointed high priest, “if he went before it at his own pleasure, or without the expiatory blood of sacrifice, would expose himself to certain death.” Hebrews takes up the yearly entry and sets Christ's beside it (see the Witness of Christ below).

      The theme page [Them That Come Nigh Me](/leviticus/themes/them-that-come-nigh-me/) follows the way in from the fire of chapters 9–10 to this verse and to Hebrews 9.
    sources: [keil-leviticus, lds-scriptures]

  - ref: 4
    phrase: He shall put on the holy linen coat
    kind: symbol
    title: White linen in place of the garments of gold
    body: |
      For the work within the veil the high priest did not wear the garments described in [[Ex. 28]] but a coat, breeches, girdle and turban of white linen; on this day he was “clothed in white linen.” The text gives only one reason: “these are holy garments; therefore shall he wash his flesh in water, and so put them on” ([[Lev. 16:4]]). He bathed his whole body, “and not merely his hands and feet, as he did for the ordinary service.” When the work inside was done he took the linen off in the tent and left it there, bathed again, and put on his own garments to offer the burnt offerings ([[Lev. 16:23–24]]).

      Why white linen, the text does not say. One older reading rejects the idea that it was a penitent's dress (“where in all the world have clear white clothes been worn either in mourning or as a penitential garment?”) and takes the pure white of all the clothes, “even of the girdle,” as “a representation of holiness,” pointing out that the heavenly messenger in Ezekiel's and Daniel's visions is clothed in linen ([[Ezek. 9:2]]; [[Dan. 10:5]]).
    sources: [bd-fasts, keil-leviticus, lds-scriptures]

  - ref: 8
    phrase: the other lot for the scapegoat
    kind: words
    title: The scapegoat, or the goat “for Azazel”
    body: |
      The King James “scapegoat” translates a Hebrew name, *ʿazazel*: the lots are “one lot for the LORD, and the other lot for the scapegoat” ([[Lev. 16:8]]), and the second is *la-ʿazazel*, “for Azazel.” The Hebrew name is found nowhere but in this chapter (verses 8, 10 and 26). The early Greek and Latin translators took it to mean “a goat that goes away,” “probably incorrectly,” and Tyndale, following them, formed “scapegoat” from “scape,” a variant of “escape,” and “goat.”

      What Azazel means is not certain, and the readings differ. One gloss is “the completely separate one, the evil spirit regarded as dwelling in the desert.” Another takes the word to mean “entire removal,” while noting that most scholars read it as the “proper name of spirit haunting desert.” Biblical scholars now take it to be “most likely a proper name of a demon of some sort,” which is why modern translations print “Azazel.” In one Jewish reading, “the most plausible explanation is that Azazel is the name of a demon . . . who has been eviscerated of his erstwhile demonic powers”: Israel took over an old rite of banishing evil to the wilderness, which was thought “uninhabited except by the satyr-demon Azazel,” and transformed it.

      Whatever the name meant, the text never says the goat is offered to Azazel. Only the LORD's goat is sacrificed (“offer him for a sin offering,” [[Lev. 16:9]]); the other is “presented alive before the LORD” ([[Lev. 16:10]]) and sent away carrying what has been laid on it. The rite is, in that definition, the “entire removal of sin and guilt from sacred places into desert on back of goat, symbol of entire forgiveness,” and Tyndale's word is “still accurate as a description of this goat.”
    sources: [oshb-wlc, seely-tyndale, bd-fasts, bdb, ot-minute-lev, milgrom-temple, lds-scriptures]

  - ref: 13
    phrase: that the cloud of the incense may cover the mercy seat
    kind: symbol
    title: The cloud of incense over the mercy seat
    body: |
      Before any blood went in, Aaron covered the mercy seat with a cloud of incense, and the text says it was to save his life: “that he die not” ([[Lev. 16:13]]). He carried coals “from off the altar before the LORD” in a censer, with two handfuls of incense “beaten small” ([[Lev. 16:12]]), and laid the incense on the coals within the veil.

      The smoke was to “cover the mercy seat and, as it were, hide him from God.” One older reading explains the covering from what incense meant: “as burning incense was a symbol of prayer, this covering of the capporeth with the cloud of incense was a symbolical covering of the glory of the Most Holy One with prayer to God, in order that He might not see the sin.” Incense as prayer is at the note on [[Ex. 30:7]].
    sources: [bd-fasts, keil-leviticus, lds-scriptures]

  - ref: 16
    phrase: he shall make an atonement for the holy place, because of the uncleanness of the children of Israel
    kind: history
    title: Why a holy place needed atonement
    body: |
      The blood carried within the veil was for the sanctuary itself, which the text says needed cleansing because Israel's uncleanness and transgressions had reached it. The holy place first, then the tent “that remaineth among them in the midst of their uncleanness” ([[Lev. 16:16]]), then the altar outside, which the blood was to “cleanse … and hallow … from the uncleanness of the children of Israel” ([[Lev. 16:19]]).

      The day reached what the year's other offerings left untouched. Most rites of atonement were “reactive”: sin offerings were brought when someone realized a sin had been committed. “Inevitably, some sins were forgotten, hidden, or even committed without one knowing they had done anything wrong”; the Day of Atonement was “a proactive, comprehensive purge” that restored the sanctity of “the priesthood, the tabernacle, and the people.” The rite also “allowed God’s presence to remain among the people.”

      A room no one entered could still be defiled. In one reading of these laws, impurity was “a dynamic force, magnetic and malefic to the sphere of the sacred, attacking it not just by direct contact but from a distance,” so that the most holy place was polluted “though no man, not even the priest, may enter.” The same reading holds the two goats apart: “The sacrificed goat purges the sanctuary … ‘of Israel’s impurities’ … whereas the scapegoat carries off … ‘all of Israel’s transgressions.’” How deep each kind of sin was thought to reach is set out at [[Lev. 4:6]].
    sources: [lds-scriptures, sc-knowhy-849, cfm-ot-2026-tabernacle, milgrom-temple]

  - ref: 21
    phrase: lay both his hands upon the head of the live goat, and confess over him
    kind: symbol
    title: Both hands, and the sins spoken aloud
    body: |
      Here, unlike any offering before it, the text says what the laying on of hands does: it puts Israel's sins on the goat. In the offerings of chapters 1–7 the one who brings the animal lays one hand on the animal, and readers differ on what it means (see the note on [[Lev. 1:4]]). Here the high priest lays on both hands, confesses aloud “all the iniquities of the children of Israel, and all their transgressions in all their sins,” and the text adds, “putting them upon the head of the goat” ([[Lev. 16:21]]). In one Latter-day Saint reading, “Here the idea of substitution and vicarious sacrifice is spelled out explicitly,” since “it is directly stated that the animal will ‘bear on itself’ all their iniquities” (verse 22).

      The goat goes “unto a land not inhabited” ([[Lev. 16:22]]). The Hebrew *ʾereṣ gezerah*, “a land of separation,” can carry the sense of a land “‘cut off,’ i.e. whence it would not readily find its ways back.” The man who led it there washed his clothes and bathed before he came back into the camp ([[Lev. 16:26]]).

      The theme page [Accepted for Him](/leviticus/themes/accepted-for-him/) sets this confession between the sinner's in 5:5 and the scattered people's in 26:40.
    sources: [lane-whole-meaning, oshb-wlc, bdb, lds-scriptures]

  - ref: 22
    phrase: the goat shall bear upon him all their iniquities
    kind: christ
    title: The goat that bore their iniquities
    body: |
      The goats of this day can be read as figures of Jesus Christ. The scapegoat that bore Israel's iniquities “can symbolize Jesus Christ”; in these rites “the goats symbolized Jesus Christ, taking the place of the sinful people,” for “rather than destroy or drive out the sinners, God provided another way.”

      In one Latter-day Saint reading, Isaiah's suffering servant is described in language that recalls this goat. The goat's bearing of iniquities “is unique in regards to sacrificial animals and finds a parallel in Isaiah 53:12,” where the servant “bare the sin of many” ([[Isa. 53:12]]); and the servant “was cut off out of the land of the living” ([[Isa. 53:8]]), “language that evokes the scapegoat ritual.”

      Christians have not always seen Christ in the same goat. “The earliest exegetes saw Jesus not as the fulfillment of the scapegoat, but as the fulfillment of the [sacrificed] goat,” the reading of Hebrews, where Christ enters the holy place “by his own blood” ([[Heb. 9:12]]). Another Latter-day Saint reading sees Him in both: the second goat “most likely represents another aspect of what Jesus does for humanity,” and “Not only is Christ the first goat, offering Himself as our substitute … He also takes the burden of all humanity upon himself like the second goat.”
    sources: [scripture-helps-ex-35, cfm-ot-2026-tabernacle, lane-whole-meaning, sc-knowhy-675, sc-knowhy-849, lds-scriptures]

  - ref: 29
    phrase: ye shall afflict your souls
    kind: words
    title: '“Afflict your souls”: the one fast of the law'
    body: |
      In this verse to “afflict” the soul means to “humble … oneself, by fasting.” The day “appears to be the only fast ordered by the law,” and it “was kept as a national fast.”

      With the fast went rest: no work at all, “a sabbath of rest” ([[Lev. 16:31]]), and the command bound “one of your own country, or a stranger that sojourneth among you” ([[Lev. 16:29]]). Like other outward observances, the fast could become “mere formalities,” and “the danger of this was recognized by the prophets.” The same words return in [[Isa. 58:3–5]], where a people ask why they have “afflicted our soul” and the Lord takes no notice; the note there takes up the fast. The calendar of feasts repeats the command at [[Lev. 23:27–32]].
    sources: [bdb, bd-fasts, lds-scriptures]

  - ref: 30
    phrase: to cleanse you, that ye may be clean from all your sins before the LORD
    kind: scripture
    title: Clean before the LORD
    body: |
      The day's work on the sanctuary ends in a promise to the people: the priest makes atonement “for you, to cleanse you” ([[Lev. 16:30]]). The need for the whole ceremony, that the people be clean, is “expressed in” this verse. In one scholar's reading of the Hebrew, when the one atoned for is a person, the verb is followed by two prepositions, “both signifying ‘on behalf of’”: the rite is done for the people, while its blood is applied to the holy things.

      The Book of Mormon shares the hope of being clean “before the Lord.” One Latter-day Saint list of its uses of Leviticus pairs this verse with [[Ether 4:6]], where the Lord tells Moroni that the record will not go to the Gentiles until they “repent of their iniquity, and become clean before the Lord.” Nephi writes that “no unclean thing can dwell with God” ([[1 Ne. 10:21]]), a verse that “suggests that doing ‘wickedly’ is symbolically connected to being unclean,” and in one Latter-day Saint reading the Book of Mormon teaches that “only Christ can bridge that gap between unclean or sinful humanity and an ultimately clean and purely righteous God.”
    sources: [cfm-ot-2026-tabernacle, milgrom-temple, ot-minute-lev, sc-knowhy-479, lds-scriptures]

christ: |
  Hebrews sets the whole day beside the work of Christ: in Hebrews 9 “a contrast is drawn” between the high priest on the Day of Atonement and “Christ, the great High Priest, who offered once for all the perfect sacrifice of Himself.” The high priest went in “every year with blood of others” ([[Heb. 9:25]]). Christ “is not entered into the holy places made with hands, which are the figures of the true; but into heaven itself, now to appear in the presence of God for us” ([[Heb. 9:24]]), and “now once in the end of the world hath he appeared to put away sin by the sacrifice of himself” ([[Heb. 9:26]]).

  The yearly repetition marked the difference. “In those sacrifices there is a remembrance again made of sins every year” ([[Heb. 10:3]]), while “the sacrifice of Christ removes the sin and leads to the complete sanctification of the believer”: “we are sanctified through the offering of the body of Jesus Christ once for all” ([[Heb. 10:10]]). The bodies of the bull and goat burned “without the camp” ([[Lev. 16:27]]) are read of Christ, who “suffered without the gate” ([[Heb. 13:11–12]]; see the Witness of Christ in [[Lev. 4]]). The goat that bore the people's iniquities is at the note on verse 22.

explore: |
