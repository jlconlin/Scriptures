  - **Christ within the veil.** [[Heb. 9:1–28]]; [[Heb. 10:1–22]].
  - **The servant who bore iniquities.** [[Isa. 53:4–12]]; [[Mosiah 14:4–12]].
  - **Clean before the Lord.** [[1 Ne. 10:21]]; [[Ether 4:6]].

