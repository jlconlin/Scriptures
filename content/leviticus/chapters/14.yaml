chapter: 14
title: The Leper Made Clean
tagline: A healed leper comes back in stages, first outside the camp with two birds, living water and blood, then on the eighth day at the tabernacle door with offerings, blood and oil. A house with the plague in its walls is examined and cleansed the same way.
when: 'At Sinai, in the second year after the Exodus'

setting: |
  Chapter 13 taught the priest to tell the plague of leprosy from a passing sore, and it left the man who had it outside: “he shall dwell alone; without the camp shall his habitation be” ([[Lev. 13:46]]). What the word covered, and why it is not the disease now called leprosy, is explained at [[Lev. 13:2]]. Chapter 14 is the way back in. Its first part (verses 1–32) gives the rites for a person whose plague has healed, with a less costly set of offerings for the poor; its second part (verses 33–53) applies the same law to a house, for the houses of Canaan, where Israel was going (verse 34); verses 54–57 close chapters 13 and 14 together.

  Healing alone did not bring him back: after the disease has gone, “various sacrifices and cleansing rituals are required before the former leper can rejoin society.” The law was still kept in the Savior's day, when He sent healed lepers to the priests ([[Mark 1:44]]; [[Luke 17:14]]).

thread: |
  The chapter brings a man back by stages, each one nearer the sanctuary. Outside the camp the priest examines him, the rite of the two birds is performed, and he washes and shaves (verses 3–8). Then he may enter the camp, though not yet his own tent. On the seventh day he shaves and washes again, and on the eighth he stands “before the LORD, at the door of the tabernacle of the congregation” ([[Lev. 14:11]]) with his offerings, and blood and oil are put on him. One older reading takes the ceremonies to signify “restoration to life,” “removal of uncleanness,” and “readmission to God’s presence,” each answering to something the leper had lost, for he had been regarded “as one dead.”

  The law for houses follows the same course on a smaller scale: the owner reports, the priest inspects and waits seven days, the plague is cut out or the house pulled down, and a house that has healed is cleansed with the same two birds. The closing verses name what all of it is for: “To teach when it is unclean, and when it is clean” ([[Lev. 14:57]]).

sections:
  - range: 1-7
    heading: Outside the camp
    plain: |
      The LORD said to Moses: This is the law for the leper on the day he is made clean. He is to be brought to the priest, and the priest is to go out of the camp to him and look. If the man's disease has healed, the priest is to have two living, clean birds brought for him, with cedar wood, scarlet cloth and hyssop. The priest is to have one bird killed over fresh, flowing water in a clay pot. Then he is to take the living bird, the cedar wood, the scarlet and the hyssop, and dip them all in the blood of the bird killed over the water. He is to sprinkle the man being cleansed seven times, declare him clean, and let the living bird go free into the open field.
  - range: 8-20
    heading: Into the camp, and before the LORD
    plain: |
      The man is to wash his clothes, shave off all his hair and bathe, and then he may come into the camp, but he must stay outside his own tent for seven days. On the seventh day he shaves off all his hair again, head, beard and eyebrows, washes his clothes and bathes, and he is clean.

      On the eighth day he is to bring two male lambs without blemish, a year-old ewe lamb without blemish, three tenths of an ephah of fine flour mixed with oil for a grain offering, and a log of oil. The priest who cleanses him is to present him and his offerings before the LORD at the door of the tabernacle. The priest takes one male lamb as a trespass offering, with the log of oil, and waves them before the LORD. He kills the lamb where the sin offering and the burnt offering are killed, in the holy place; like the sin offering, the trespass offering belongs to the priest and is most holy.

      The priest puts some of its blood on the man's right earlobe, right thumb and right big toe. He pours some of the oil into his own left palm, dips his right finger in it, and sprinkles it seven times before the LORD. He puts oil on the same three places, on top of the blood, and pours what is left on the man's head, and so makes atonement for him before the LORD. Then the priest offers the sin offering to make atonement for him for his uncleanness, and after that the burnt offering and the grain offering on the altar. So the priest makes atonement for him, and he is clean.
  - range: 21-32
    heading: If he is poor
    plain: |
      If he is poor and cannot afford so much, he is to bring one lamb for a trespass offering to be waved, to make atonement for him, one tenth of an ephah of fine flour mixed with oil for a grain offering, a log of oil, and two turtledoves or two young pigeons, whichever he can afford, one for a sin offering and the other for a burnt offering. He brings them on the eighth day to the priest at the door of the tabernacle, before the LORD.

      The priest waves the lamb and the oil before the LORD and kills the lamb. He puts its blood, and then the oil, on the man's right ear, thumb and toe, sprinkling the oil seven times before the LORD and putting the rest on the man's head to make atonement for him. Then he offers the birds, whichever he could afford, one as a sin offering and the other as a burnt offering, with the grain offering, and makes atonement for him before the LORD. This is the law for someone with the disease who cannot afford the full offerings for his cleansing.
  - range: 33-53
    heading: Leprosy in a house
    plain: |
      The LORD said to Moses and Aaron: When you have come into Canaan, the land I am giving you, and I put a plague of leprosy in a house there, the owner is to come and tell the priest, “It seems to me there is something like a plague in my house.” The priest is to have the house emptied before he goes in to look, so that nothing in it is made unclean, and then go in. If the walls have sunken patches, greenish or reddish, that look deeper than the surface, he is to go out to the door and shut the house up for seven days. If on the seventh day the plague has spread, the stones that have it are to be pulled out and thrown into an unclean place outside the city, the inside of the house scraped all around and the scrapings dumped there too, and new stones and new plaster put in.

      If the plague breaks out again after that and has spread, it is a malignant leprosy, and the house is unclean. It is to be torn down, stones, timber and plaster, and carried out of the city to an unclean place. Anyone who goes into the house while it is shut up is unclean until evening, and anyone who sleeps or eats in it must wash his clothes.

      But if the priest comes and finds that the plague has not spread since the house was plastered, he declares the house clean, because the plague is healed. To cleanse it he takes two birds, cedar wood, scarlet and hyssop. He kills one bird over fresh water in a clay pot, dips the cedar, the hyssop, the scarlet and the living bird in the blood and the water, and sprinkles the house seven times. So he cleanses the house; he lets the living bird go free outside the city into the open fields, and makes atonement for the house, and it is clean.
  - range: 54-57
    heading: The law of leprosy
    plain: |
      This is the law for every kind of leprosy and scaly disease, for leprosy in a garment or a house, and for a rising, a scab or a bright spot: to teach when a thing is unclean and when it is clean. This is the law of leprosy.

notes:
  - ref: 3
    phrase: the priest shall go forth out of the camp
    kind: history
    title: The priest goes out to a man already healed
    body: |
      The priest does not heal the leper; he goes out to confirm a healing that has already happened. The man could not come to him, for his “habitation” was “without the camp” ([[Lev. 13:46]]), so the priest goes out, and the rite begins only “if the plague of leprosy be healed in the leper.” Nothing in the chapter gives the priest any power over the disease. His work is to examine, to “pronounce him clean” (verse 7), and then to bring him by stages back to the sanctuary.

      A healed man still needed the rites because of what had kept him out. Biblical leprosy covered the skin diseases “that rendered an individual ritually unclean under the law of Moses,” and in the biblical view that uncleanness “was … more important than potential contagiousness.” The healing ended the disease; the rites of this chapter ended the uncleanness.
    sources: [lds-scriptures, sc-leprosy]

  - ref: 4
    phrase: two birds alive and clean, and cedar wood, and scarlet, and hyssop
    kind: symbol
    title: The two birds
    body: |
      First, what was done. Outside the camp the priest had two living, clean birds brought, with cedar wood, scarlet cloth and hyssop. One bird was killed over a clay pot of fresh water, so that its blood ran into the water. The priest dipped the living bird, with the cedar, the scarlet and the hyssop, in the blood and water, sprinkled the man seven times, pronounced him clean, and let the living bird fly off “into the open field” (verses 5–7). A house that had healed was cleansed the same way (verses 49–53).

      The text gives no reason for any of it. Two readings agree that both birds stand for the man. In one Latter-day Saint reading, “the birds symbolized the candidate”: the slain bird signified “that the leper (the natural man) had to give up his life,” and the bird set free “that the man had been freed from the bondage of sin.” The same reading takes the cedar, prized for “its ability to preserve surrounding objects from decay and corruption,” as a sign of preservation, the scarlet wool as “a reminder of blood,” and hyssop as an herb “associated with purification,” though “we are not sure exactly why.” One older reading, which notes that the rite “was no true sacrifice,” takes the slain bird to show “that the leper would necessarily have suffered death on account of his uncleanness” had God's mercy not delivered him, and the freed bird's return “to its fellows and into its nest” to stand for “his return to the fellowship of his own nation.” Both are readings; the chapter says only that by this rite the priest declared him clean.
    sources: [lund-types-symbols, keil-leviticus, lds-scriptures]

  - ref: 5
    phrase: over running water
    kind: words
    title: Living water
    body: |
      “Running water” is in Hebrew *mayim ḥayyim*, literally *living water*: water that is flowing and fresh. The word is used of water in this sense in this verse, in the house rite (verses 50–52), and in the washing after a discharge ([[Lev. 15:13]]). The same adjective, *ḥay*, names the bird that is set free, the “living bird” of verses 6 and 7, so the English hides that the slain bird's blood goes into living water, and the living bird is dipped in it and let go.
    sources: [oshb-wlc, bdb]

  - ref: 9
    phrase: he shall shave all his hair off his head and his beard and his eyebrows
    kind: symbol
    title: Shaven like a newborn
    body: |
      The man shaves twice, once before he enters the camp (verse 8) and again on the seventh day, when the text is emphatic: head, beard, eyebrows, “even all his hair.” Between the two shavings he is inside the camp but must “tarry abroad out of his tent seven days” (verse 8). The text gives no reason for either.

      One Latter-day Saint reading sees a new birth. Shaving, “including even the eyebrows, would make a person look very much like a newborn infant,” so that, having passed through a symbolic rebirth, “the candidate graphically demonstrated on his own person that he was newborn spiritually.” That is a devotional reading. The verse itself says only that, shaven and washed, “he shall be clean.”
    sources: [lund-types-symbols, lds-scriptures]

  - ref: 12
    phrase: offer him for a trespass offering
    kind: history
    title: Why a trespass offering
    body: |
      The eighth day's sacrifices begin with a trespass offering, though the text names no wrong the man has done. The trespass (guilt) offering was brought for a trespass “in the holy things of the Lord,” with amends and an added fifth (see [[Lev. 5:15–16]]). Here it comes first, and the priest waves it before the LORD with the log of oil (verse 12), which in one older reading “did not take place on other occasions in connection with sin-offerings and trespass-offerings.” That commentary's answer is that the offering was a consecration. By the waving the man “was dedicated to His service again,” as the Levites were dedicated by waving ([[Num. 8:11]]), and a trespass offering was needed “because the consecration itself served as a restoration to all the rights of the priestly covenant nation, which had been lost by the mortal ban of leprosy.”

      The rule for the poor points the same way. Verses 21–22 let a poor man bring birds for the sin offering and the burnt offering, as in the poor man's offering of [[Lev. 5:7]], and less flour, but he still brings “one lamb for a trespass offering.” In another older commentary that is “a further indication that this sacrifice is the most important feature of the rite.” Its blood is the blood put on the man's ear, thumb and toe (verses 14, 25).
    sources: [keil-leviticus, cambridge-leviticus, lds-scriptures]

  - ref: 17
    phrase: upon the blood of the trespass offering
    kind: symbol
    title: Oil on the blood
    body: |
      After the blood, the priest puts oil on the same three places, the right ear, thumb and great toe, “upon the blood of the trespass offering,” and pours the rest of the oil on the man's head (verses 17–18). The marks of blood themselves, and their match with the consecration of the priests, are explained at [[Lev. 8:23]]; what this chapter adds is the oil laid over the blood.

      In one Latter-day Saint reading the blood sanctifies “the organ of hearing or obedience (the ear), the organ of action (the hand), and the organ of following or walking in the proper way (the foot).” The same reading takes olive oil as a symbol of the Holy Ghost, from [[D&C 45:55–57]], so that the oil “suggests the effect of the Spirit on the same organs of living and acting that had previously been cleansed by the blood of Christ”; in the end “every aspect of the candidate’s life was purified and sanctified by both the Atonement and the Holy Ghost.” The text says what the oil does in its own words: with it “the priest shall make an atonement for him before the LORD” (verse 18).
    sources: [lund-types-symbols, lds-scriptures]

  - ref: 34
    phrase: I put the plague of leprosy in a house
    kind: history
    title: Leprosy in a house
    body: |
      The plague in a house was a growth in its walls. The text describes it as “hollow strakes, greenish or reddish,” sunk below the face of the wall (verse 37), and walls “were said to be leprous when they had patches of mildew or some fungous growth.”

      As with the leper (see the note at verse 3), the law's concern was uncleanness. The verse gives its own reason for emptying the house before the priest goes in: “that all that is in the house be not made unclean” (verse 36). The owner reports only what “seemeth” to him (verse 35); the priest looks, waits seven days, and pronounces (verses 38–48). If the plague returns after the stones are replaced, the house is torn down and carried “out of the city into an unclean place” (verse 45).
    sources: [bd-leprosy, lds-scriptures]

  - ref: 53
    phrase: make an atonement for the house
    kind: words
    title: Atonement for a house
    body: |
      Atonement is made here for a house, not a person, and the word has a ritual sense of purging that fits a house. The verb *kipper* (its meaning is at [[Ex. 25:17]]) began with a concrete sense, “something like ‘to rub, wipe,’ which in a ritual setting led to ‘purge, purify,’” and it also came to mean “ransom.” The house rite ends not with forgiveness but with “and it shall be clean.”

      The same is true of the man. His sin offering is to “make an atonement for him that is to be cleansed from his uncleanness” (verse 19), and the eighth day ends, “and he shall be clean” (verse 20). In one scholar's reading the law keeps two endings apart: for one who sinned without knowing it, “that he may be forgiven”; for the impure, “and he [she] shall be clean,” because “the impure person needs purification and the sinner needs forgiveness.” This chapter never says that the healed man is forgiven.
    sources: [spackman-atonement, milgrom-temple, lds-scriptures]

christ: |
  The law let a priest declare a healed leper clean; it gave him no power to heal. In the Gospels the Savior heals. He touched a leper and said, “I will; be thou clean” ([[Mark 1:41]]), and the leprosy departed; then He sent the man to the priest all the same: “offer for thy cleansing those things which Moses commanded, for a testimony unto them” ([[Mark 1:44]]). He told ten lepers, “Go shew yourselves unto the priests,” and “as they went, they were cleansed” ([[Luke 17:14]]). The Gospels record other healings of lepers too ([[Matt. 8:2–4]]; [[Luke 5:12–15]]).

