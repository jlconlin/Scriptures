chapter: 5
title: Confess, Repay, and Be Forgiven
tagline: A silent witness, an uncleanness unnoticed and a rash oath call for confession and a sin offering scaled to what the sinner can afford, down to a handful of flour. Then the trespass offering adds repayment, and a fifth more, for what was kept back from the Lord's holy things.
when: 'At Sinai, in the second year after the Exodus'

setting: |
  Chapter 4 gave the sin offering for one who sins “through ignorance,” with the animal set by the sinner's rank, from the anointed priest's bullock down to the ordinary person's female goat or lamb ([[Lev. 4:2]]; [[Lev. 4:28]]; [[Lev. 4:32]]). Chapter 5 carries that offering into particular cases and then opens a new one.

  Verses 1–13 name four failures and set the offering by what the sinner can afford rather than by his rank: a female lamb or kid, two birds, or a tenth of an ephah of flour.

  Verse 14 begins again with “the LORD spake unto Moses” and introduces the trespass offering (in a modern translation the guilt offering), whose rules run on to [[Lev. 6:7]]. Its mark is repayment: what was kept back from God, or taken from a neighbor, was restored with a fifth added.

  The Book of Mormon knew these chapters. A Latter-day Saint commentary on Leviticus counts eight Nephite echoes of the altar rituals of Leviticus 5–8, among them the phrase “to do evil or to do good” (verse 4; [[Alma 12:31]]) and the requirement to confess (verse 5).

thread: |
  Every offering in the chapter ends with the priest making “an atonement for him” (verses 6, 10, 13, 16, 18), and from verse 10 on the same line adds “and it shall be forgiven him.” What leads up to that line is the chapter's subject.

  The first case is a witness who keeps silent when witnesses are called. The next three are failures a person may not notice when they happen, each “hid from him” (verses 2–4): an uncleanness left unwashed, a human uncleanness, an oath sworn without thought. Verses 1–4 can be read as one long condition with verse 5 as its consequence: when he is guilty “in one of these things,” then “he shall confess.” The order is knowing, confessing, bringing the offering, the priest's atonement, and forgiveness. One Latter-day Saint study, adding the trespass offering's repayment (verse 16), draws from these offerings “the basic process of repentance under the law of Moses.”

  The offering is set by what the sinner has. A lamb, two birds, or a little flour are each followed by the same promise, “it shall be forgiven him” (verses 10, 13).

  Verses 14–19 begin a new offering. Where the wrong has cost the Lord something, a thing due to the sanctuary held back, atonement requires payment too: the thing restored, a fifth added, and a ram (verses 15–16). Where the wrong cannot be named, the ram is brought alone (verses 17–18). [[Lev. 6:1–7]] carries the same offering on to wrongs done to a neighbor.

sections:
  - range: 1-6
    heading: Four cases, then confession
    plain: |
      If someone hears a public call, under oath, for witnesses, and he saw the matter or knows of it but does not speak up, he carries the guilt of it. Or if someone touches anything unclean, the carcass of an unclean animal, of unclean livestock or of an unclean creeping thing, without realizing it, he is unclean and guilty. Or if he touches human uncleanness of any kind without realizing it, he is guilty once he learns of it. Or if someone swears rashly, aloud, that he will do something, bad or good, whatever a person may swear without thinking, and does not realize it, he is guilty once he learns of it.

      When he is guilty in any of these, he must confess the sin he committed. Then he brings to the LORD, as the penalty for his sin, a female from the flock, a lamb or a young goat, as a sin offering, and the priest makes atonement for him for his sin.
  - range: 7-13
    heading: If he cannot afford a lamb
    plain: |
      If he cannot afford a lamb, he brings the LORD two turtledoves or two young pigeons for his trespass, one for a sin offering and the other for a burnt offering. The priest offers the sin offering first. He wrings its head at the neck but does not divide the bird, sprinkles some of its blood on the side of the altar, and drains the rest out at the altar's base. Then he offers the second bird as a burnt offering, in the way prescribed. So the priest makes atonement for him for his sin, and he is forgiven.

      If he cannot afford even two birds, he brings a tenth of an ephah of fine flour as a sin offering, with no oil and no frankincense on it, because it is a sin offering. The priest takes a handful of it as its memorial portion and burns it on the altar with the LORD's offerings made by fire. So the priest makes atonement for him for whichever of these sins he committed, and he is forgiven. The rest belongs to the priest, as with the meat offering.
  - range: 14-19
    heading: The trespass offering
    plain: |
      The LORD said to Moses: If anyone breaks faith by sinning unintentionally in the holy things of the LORD, he must bring the LORD, as his trespass offering, a ram without blemish from the flock, valued in silver by the shekel of the sanctuary. He must make good what he failed to give of the holy thing, add a fifth to it, and give it to the priest. The priest makes atonement for him with the ram of the trespass offering, and he is forgiven.

      If anyone sins by doing any of the things the LORD's commandments forbid, even though he did not know it, he is still guilty and carries his iniquity. He brings the priest a ram without blemish from the flock, at its valuation, as a trespass offering, and the priest makes atonement for him for the error he committed without knowing it, and he is forgiven. It is a trespass offering: he has truly incurred guilt before the LORD.

notes:
  - ref: 1
    phrase: hear the voice of swearing
    kind: history
    title: A witness who keeps silent
    body: |
      The “swearing” here is a public call, under oath, for witnesses to come forward. A modern translation renders the verse: “When any of you sin in that you have heard a public adjuration to testify and, although able to testify as one who has seen or learned of the matter, do not speak up, you are subject to punishment.” The sin is silence. A man who saw the matter, or knows of it, hears the call and keeps what he knows to himself, and so “he shall bear his iniquity.”

      One Latter-day Saint commentary on Leviticus finds the chapter's duty to report wrongdoing, and to see it confessed and atoned for, behind Alma's efforts in Ammonihah: that duty “appears to stand behind” them, since Alma “could not simply ignore the well-known apostasy and wickedness in that town,” and as high priest he had to speak out “or he himself would become guilty of their iniquities.” That is offered as a likely echo; Alma does not cite the verse.
    sources: [nrsvue, ot-minute-lev]
  - ref: 3
    phrase: and it be hid from him; when he knoweth of it, then he shall be guilty
    kind: history
    title: Guilt that begins when a person learns of it
    body: |
      In verses 2–3 the fault is a purification left undone because the person did not know he was unclean. The law's remedy for touching an unclean thing was washing (clean and unclean are explained at [[Lev. 11:24–25]]): “for all contact with uncleanness, washing the clothes and bathing the body in water are prescribed.” In one older reading, these verses are the cases “where, through ignorance, the purification has been omitted, and a sacrifice is necessary to avert punishment.”

      The oath of verse 4 is a word spoken and then lost from view, “hid from him” like the uncleanness. A modern translation reads “utter aloud a rash oath for a bad or a good purpose,” and “to do evil, or to do good” means any act at all.

      In verses 3 and 4 the guilt is reckoned from the moment the person learns of it: “when he knoweth of it, then he shall be guilty.” Verse 2 calls him “unclean, and guilty” even while it is hidden from him; either way, what he must do follows once he knows (verse 5).
    sources: [cambridge-leviticus, nrsvue, lds-scriptures]
  - ref: 5
    phrase: he shall confess that he hath sinned in that thing
    kind: scripture
    title: Confession comes before the offering
    body: |
      Before the animal is brought, the sinner has to say what he did. Among the sins for which atonement could be made were “crimes that a man voluntarily confessed, and for which he made (if possible) compensation (Lev. 5:5).”

      Two Latter-day Saint studies hear the law's confession in the Book of Mormon. One takes the sons of Mosiah's converts, who “were brought before the altar of God, to call on his name and confess their sins before him” ([[Alma 17:4]]), as a reference to the law of Moses: “Being brought before the altar of God and confessing their sins are part of the repentance process under the law of Moses.” The other reads Alma the Elder's charge, that only those who “repented of their sins and did confess them” would be numbered with the church ([[Mosiah 26:35]]), as “consistent with the priestly duty articulated in Leviticus 5:5.” Both are scholars' identifications; neither verse cites Leviticus.
    sources: [bd-sacrifices, gee-last-sacrifice, ot-minute-lev]
  - ref: 6
    phrase: his trespass offering
    kind: words
    title: A trespass offering that is a sin offering
    body: |
      The verse calls one animal both a “trespass offering” and “a sin offering,” and the Hebrew does the same. The first word is *ʾasham*, the name of the separate offering that begins at verse 14; the second is the *ḥaṭṭaʾt*, the sin offering of chapter 4 (see [[Lev. 4:2]]). Here *ʾasham* names no second sacrifice: a modern translation renders “as your penalty for the sin that you have committed, a female from the flock, a sheep or a goat, as a purification offering.” So the sacrifice of verse 6 “should not be confused with the trespass offering proper discussed in Leviticus 5:14–19.”

      The animal is the one chapter 4 required of an ordinary person, a female lamb or goat ([[Lev. 4:28]]; [[Lev. 4:32]]), and the rite is that of the sin offering.
    sources: [oshb-wlc, nrsvue, ot-manual-lev-1-10, lds-scriptures]
  - ref: 7
    phrase: two turtledoves, or two young pigeons
    kind: history
    title: The poor man’s offering
    body: |
      A sinner who could not afford a lamb brought two birds, and the law made the same atonement with them. Turtledoves or young pigeons were the sin offering “for the poor instead of a lamb,” and birds the burnt offering “in cases of poverty.”

      Verses 8–10 say what was done. The priest offered the sin-offering bird first: he wrung its head at the neck, sprinkled some of its blood on the side of the altar and drained the rest out at the altar's base. The second bird he offered as a burnt offering, “according to the manner” already given for birds ([[Lev. 1:14–17]]). The verse ends as the lamb's did: “the priest shall make an atonement for him for his sin which he hath sinned, and it shall be forgiven him.”
    sources: [bd-sacrifices, lds-scriptures]
  - ref: 11
    phrase: he shall put no oil upon it, neither shall he put any frankincense thereon
    kind: symbol
    title: Flour without oil or frankincense
    body: |
      The poorest sinner's offering was plain flour, because it was a sin offering. The ordinary meat offering was fine flour with oil poured on it and frankincense put on it ([[Lev. 2:1]]); this flour has neither, “for it is a sin offering.” It is handled like a meat offering, a handful burned as “a memorial” and the rest given to the priest (verses 12–13), but it is counted as a sin offering, “a further concession in the case of extreme poverty” in one older reading.

      Why oil and frankincense are left off, the text says only in that one clause. One older reading takes them as symbols: the sinner “was not allowed to add oil and incense, as symbols of the Spirit and praise of God, to the sacrifice with which he sought the forgiveness of sin.”
    sources: [lds-scriptures, cambridge-leviticus, keil-leviticus]
  - ref: 15
    phrase: commit a trespass, and sin through ignorance, in the holy things of the LORD
    kind: history
    title: Breaking faith in the holy things
    body: |
      The trespass offering proper is for taking from God what was His. The word rendered “trespass” is *maʿal*, an “unfaithful, treacherous act.” Certain sins “might be regarded as robbery, or a violation of right,” and among them were wrongs against “God directly, regarded as King of Israel, by neglecting some rites and services, payments, and offerings.” The case here is “the holy thing kept back from God”: a man who kept back some of what was due to the sanctuary, without meaning to.

      The ram is priced as well as offered: “with thy estimation by shekels of silver,” which a modern translation renders “convertible into silver by the sanctuary shekel.”

      Both cases in this chapter (verses 15, 17) are among the “unconscious, unintentional sins” for which the law allowed atonement.
    sources: [oshb-wlc, bdb, bd-sacrifices, nrsvue, lds-scriptures]
  - ref: 16
    phrase: shall add the fifth part thereto
    kind: history
    title: Restitution and the added fifth
    body: |
      Forgiveness for a trespass required two payments, the ram to God and the thing itself restored with a fifth more. Compensation was made “(1) ethically, by the trespass offering (Lev. 5:15); (2) materially, by making restitution.” The offering “seems to have been confined to offences against God or man that could be estimated and so covered by compensation.” There “seems to have been no application of the blood to the horns of the altar … because the guilt was not expiated at the altar but by compensation to the wronged person or his representative.”

      Restitution was needed because, in one older reading, the trespasser's death alone “would not repair the trespass, nor restore those rights which another had been robbed of.” A commentary on Leviticus, as one Latter-day Saint study quotes it, sets this offering's picture beside the others': “The reparation offering presents a commercial picture of sin. Sin is a debt which man incurs against God. The debt is paid through the offered animal.”
    sources: [bd-sacrifices, bdb, ot-manual-lev-1-10, lane-whole-meaning]
  - ref: 17
    phrase: though he wist it not, yet is he guilty
    kind: history
    title: Guilty though he knew it not
    body: |
      Verses 17–19 give the trespass offering for a sin committed without knowing it, one of the “unconscious, unintentional sins” for which atonement could be made. “Wist” is “knew.” One older reading takes the case further: the sins of chapter 4 “are those of which a person becomes conscious (Leviticus 4:14; Leviticus 4:23; Leviticus 4:28),” while “the case here supposed is that of one who fears that he has been guilty of some infringement of the Divine commands, but cannot specify it.” He brings a ram, but “no restitution is demanded as the amount cannot be estimated, since the offence remains unknown.”

      In Jewish usage, as the same older reading reports, it was called *ʾasham taluy*, “a suspended Guilt or Trespass-Offering,” a “voluntary offering” that “relieved a troubled conscience.” That name is the tradition's, not the text's; the text says only that the man “wist it not” and still “it shall be forgiven him” (verse 18).
    sources: [bd-sacrifices, cambridge-leviticus, lds-scriptures]

christ: |
  Every offering in this chapter ends in forgiveness given through a priest's atonement, and the law's offerings point beyond themselves to the Savior's (see [[Lev. 1:4]]).

  Scripture names one of this chapter's offerings for Him. Isaiah says of the Lord's servant, “thou shalt make his soul an offering for sin” ([[Isa. 53:10]]), and the word behind “an offering for sin” is *ʾasham*, the trespass offering of verses 14–19. A Latter-day Saint study calls that verse the “most explicit connection” between Isaiah 53 and the law, and the lexicon reads it so: “The Messianic servant offers himself as an אשׁם in compensation for the sins of the people, interposing for them as their substitute.” What the *ʾasham* means in Isaiah is taken further in the note at [[Isa. 53:10]], and Abinadi quotes the verse at [[Mosiah 14:10]].

explore: |
  - **The trespass offering for wrongs against a neighbor.** [[Lev. 6:1–7]], and the offering's rules from the priest's side, [[Lev. 7:1–7]].
  - **Confession and the fifth again.** [[Num. 5:5–8]], where the fifth is paid to the person wronged.
  - **The poor man's offering elsewhere.** [[Lev. 12:8]] with [[Luke 2:22–24]]; [[Lev. 14:21–22]].
  - **The servant made an offering.** [[Isa. 53:10]]; [[Mosiah 14:10]].

