chapter: 22
title: The Holy Things and the Animals Fit to Offer
tagline: The priests are told who may eat the holy food Israel gives them and when they must keep away from it, and every Israelite is told what kind of animal the altar will accept.
when: 'At Sinai, in the second year after the Exodus.'

setting: |
  Chapters 21 and 22 are the house rules of the LORD's house: they keep holy both the priests who serve the bread of God and those worthy to eat it. All Israel was called to be separate and holy, and the priests who stood for the LORD before the people were held to more. Chapter 21 is about the priest himself: his contact with the dead, his marriage, and the blemishes that kept him from the altar ([[Lev. 21:17]]). Chapter 22 turns to the holy things in his hands.

  Much of it repeats earlier law as it bears on the priests. The uncleanness that bars a priest from the holy food is the uncleanness of chapters 11–15; the added fifth for an unwitting offense is the rule of [[Lev. 5:16]]; the requirement “without blemish” was first given at [[Lev. 1:3]]; the thanksgiving eaten the same day was first given at [[Lev. 7:15]]. What is new is the list of who in a priest's house may eat, and the list of what makes an animal unfit.

  Taken together, the laws of chapters 17–26 can be read as preparing Israel “to become a temple-worthy people” and to share in the LORD's holiness. This chapter applies that to the food on the priest's table and the animals at the altar.

thread: |
  The chapter has three speeches, each opening “And the LORD spake unto Moses” (verses 1, 17, 26). The first is to the priests about the holy things Israel gave them to eat, and it gives two rules: no priest who is unclean may eat them (verses 2–9), and no one who is not of a priest's household may eat them (verses 10–16). The second is to the priests and “all the children of Israel”: an animal offered to the LORD must be whole, and the chapter lists what makes it unfit (verses 18–25). The third adds three short rules of the same kind, about a newborn animal, a mother and her young, and the thanksgiving meal (verses 27–30).

  Two words carry the chapter: “profane” and “hallow.” The priests must not profane the LORD's name or the holy things Israel hallows to Him (verses 2, 15); the chapter closes by turning the words on the LORD Himself: “I will be hallowed among the children of Israel: I am the LORD which hallow you” ([[Lev. 22:32]]). It is the LORD who makes holy; the priests must not treat what He has made holy as common. The refrain “I am the LORD” is taken up at [[Lev. 19]].

sections:
  - range: 1-9
    heading: When a priest may not eat
    plain: |
      The LORD spoke to Moses: “Tell Aaron and his sons to treat with reverence the holy things the Israelites dedicate to me, so that they do not profane my holy name. I am the LORD. Tell them: If any of your descendants, in any generation, comes near the holy things the Israelites dedicate to the LORD while he is unclean, that person shall be cut off from my presence. I am the LORD.

      “No descendant of Aaron who has a skin disease or a discharge may eat the holy things until he is clean. Whoever touches anything made unclean by a dead body, or has an emission of semen, or touches a creeping creature or a person that makes him unclean, is unclean until evening. He may not eat the holy things until he has bathed; when the sun is down he is clean, and then he may eat them, because they are his food. He shall not eat an animal that died of itself or was torn by beasts and so become unclean. I am the LORD. They must keep my charge, or they will bear sin for it and die because they profaned it. I am the LORD who sanctifies them.
  - range: 10-16
    heading: Who in a priest's house may eat
    plain: |
      “No one outside a priest's family may eat the holy food: not someone staying with the priest, and not a hired worker. But a slave the priest buys with his money, or one born in his house, may eat his food. If a priest's daughter marries a man outside the priestly family, she may not eat the holy offerings. But if she is widowed or divorced, has no child, and has come back to her father's house as in her youth, she may eat her father's food. No outsider may eat it.

      “If someone eats a holy thing by mistake, he shall add a fifth to it and give it to the priest with the holy thing. The priests must not profane the holy things the Israelites offer to the LORD, nor bring guilt on the people by letting them eat their holy things; for I am the LORD who sanctifies them.”
  - range: 17-25
    heading: Animals the altar will accept
    plain: |
      The LORD told Moses to say to Aaron, his sons and all the Israelites: “When any Israelite, or any stranger living in Israel, brings a burnt offering, whether for a vow or as a freewill gift, it must be a male without defect from the cattle, the sheep or the goats, for you to be accepted. Do not offer anything with a defect; it will not be accepted for you. When anyone brings a peace offering to the LORD to fulfill a vow, or as a freewill gift, from the herd or the flock, it must be whole to be accepted; it must have no defect.

      “Do not offer the LORD an animal that is blind, injured, maimed, or has a wart, an itch or scabs; do not put any of them on the altar as an offering by fire. An ox or a lamb with a limb too long or too short you may offer as a freewill gift, but not for a vow. Do not offer the LORD an animal whose testicles are bruised, crushed, torn or cut; you shall not do this in your land. And do not take any such animal from a foreigner and offer it as the food of your God: they are flawed, they have defects, and they will not be accepted for you.”
  - range: 26-33
    heading: Three more rules, and the close
    plain: |
      The LORD spoke to Moses: “When a calf, a lamb or a kid is born, it stays seven days with its mother; from the eighth day on it is acceptable as an offering by fire to the LORD. Do not kill a cow or a ewe and her young on the same day. When you offer a sacrifice of thanksgiving to the LORD, offer it so that it is accepted; eat it the same day and leave none until morning. I am the LORD.

      “Keep my commandments and do them. I am the LORD. Do not profane my holy name; I will be treated as holy among the Israelites. I am the LORD who makes you holy, who brought you out of Egypt to be your God. I am the LORD.”

notes:
  - ref: 2
    phrase: that they separate themselves from the holy things of the children of Israel
    kind: words
    title: Holding the holy things apart
    body: |
      The priests are not told to stay away from the holy things, which were their food (verse 7), but to handle them as holy. The verb is *nazar*, which means to “dedicate, consecrate, … separate, in relig. and ceremonial sense,” and here, in the reflexive form, to “hold sacredly aloof from.” The same verse gives the reason: “that they profane not my holy name.”

      The holy things here are food: verses 4, 6 and 7 speak of eating them. That made the rule a daily one. A priest who had touched something unclean could not eat his own dinner until he had bathed and the sun had gone down (verses 6–7), the waiting “until the even” explained at [[Lev. 11:24–25]].
    sources: [oshb-wlc, bdb]

  - ref: 3
    phrase: that soul shall be cut off from my presence
    kind: scripture
    title: '“Cut off from my presence” in the Book of Mormon'
    body: |
      In one Latter-day Saint reading, Lehi's warning to his family echoes this verse's penalty. Here the offender is cut off “from my presence”; elsewhere the law says “from his people” (see [[Lev. 7:20]]). For a priest who came to the holy things unclean, that was “more than a barring from participation in organized worship; since the Lord's presence symbolically covered the entire nation of Israel, this punishment could even mean estrangement from the larger covenant society.”

      Lehi warns Laman's children that “inasmuch as ye will not keep my commandments ye shall be cut off from my presence” ([[2 Ne. 4:4]]), and Nephi records that “they were cut off from his presence” ([[2 Ne. 5:20]]); nearly the same words come again at [[Alma 36:30]] and [[Hel. 12:21]]. If the couplet alludes to this verse, it “takes the Leviticus original and applies it by moralizing and generalizing it”: Laman and Lemuel “may not have been ritually impure, but their moral impurity was enough of a danger to the ‘holy things’” that they too were estranged from the Lord's presence. The link rests on the shared wording.
    sources: [ot-minute-lev, lds-scriptures]

  - ref: 9
    phrase: I the LORD do sanctify them.
    kind: scripture
    title: A condition in “I the LORD do sanctify them”
    body: |
      Joseph Smith's revision of the Bible makes the promise at the end of verse 9 conditional. The King James reads “I the LORD do sanctify them”; the revision reads “if they profane not mine ordinances, I the Lord will sanctify them.” It is one of three changes he made in chapters 21–22, and the Church's printed edition carries no footnote for it. In one Latter-day Saint reading it shows “the principle of divine reciprocity”: “the blessing of sanctification is conditional upon obedience.”

      The verse already points that way. The priests are to “keep mine ordinance, lest they bear sin for it, and die therefore, if they profane it.” On the same reading, the purity laws had a purpose beyond themselves: that the priests “might maintain and partake of Yahweh's holiness.”
    sources: [bowen-law-codes]

  - ref: 10
    phrase: There shall no stranger eat of the holy thing
    kind: history
    title: Who in a priest's house could eat the holy food
    body: |
      The holy food went to the priest's household, and the rule turns on who belonged to it. The “stranger” of verses 10–13 is *zar*, here someone “of another family than priests'.” A sojourner staying with the priest and a hired worker could not eat it (verse 10); a slave he bought, or one born in his house, could (verse 11).

      A priest's daughter followed the same rule. Married to a man outside the priestly family, she could not eat of the holy things (verse 12). If she was widowed or divorced, had no child, and came back to her father's house “as in her youth,” she ate her father's food again (verse 13).
    sources: [oshb-wlc, bdb]

  - ref: 21
    phrase: it shall be perfect to be accepted
    kind: words
    title: '“Perfect”: whole and sound'
    body: |
      “Perfect” here means whole and sound, the same Hebrew word, *tamim*, that verse 19 renders “without blemish.” The adjective means “complete, sound,” and of sacrificial animals “whole, sound.” Verses 22–24 then spell out what is not whole: blind, injured, maimed, diseased, or castrated. The same standard for the priest himself is at [[Lev. 21:17]].

      One exception is allowed. An animal with a limb “superfluous or lacking” may be a freewill offering, “but for a vow it shall not be accepted” (verse 23).

      The word reaches beyond animals. The Old Testament calls Noah and Job “perfect” and commands Abram to be “perfect,” and “even animal sacrifices were expected to be ‘perfect’ (Leviticus 22:21).” In one Latter-day Saint reading, the Hebrew word in covenant settings is “a synonym to faithfulness, loyalty, and trustworthiness,” a sense that bears on the Savior's command, “I would that ye should be perfect” ([[3 Ne. 12:48]]).
    sources: [oshb-wlc, bdb, sc-knowhy-335]

  - ref: 24
    phrase: neither shall ye make any offering thereof in your land
    kind: words
    title: '“In your land”: no gelding at all'
    body: |
      The four words of verse 24, “bruised, or crushed, or broken, or cut,” describe a castrated animal, one “that has its testicles bruised or crushed or torn or cut,” and the last clause may forbid castrating animals at all. The Hebrew of the last clause has no word for “offering”; it reads only “and in your land you shall not do,” which a modern translation gives as “you shall not do it within your land.” The King James supplies the words “make any offering thereof.”

      One older reading, following Josephus and the rabbis, takes the clause to mean that “castrated animals were not to be sacrificed, nor in fact to be kept in the land at all.” “In your land,” it argues, would make no sense of sacrifice alone, since “sacrifices were never prepared outside the land.” On that reading, “the castration of animals is a mutilation of God's creation,” forbidden on the same principle as the mixed breeding and sowing of [[Lev. 19:19]].
    sources: [esv, oshb-wlc, keil-leviticus]

  - ref: 25
    phrase: Neither from a stranger’s hand
    kind: words
    title: Three kinds of “stranger”
    body: |
      The chapter's “stranger” stands for three Hebrew words, which is why verse 18 welcomes the stranger's offering and verse 25 refuses an animal from a stranger's hand. In verses 10–13 the stranger is *zar*, anyone outside the priest's family (see the note at verse 10). In verse 18 the “strangers in Israel” are the *ger*, the foreigner who lived among Israel (see [[Lev. 19:33–34]]); he could bring a burnt offering like an Israelite. In verse 25 the word is *ben nekar*, “foreigner.” What may not be taken from him is “any of these,” the flawed animals just listed, “because their corruption is in them.” An animal unfit from an Israelite was unfit from anyone. “The bread of your God” is chapter 21's name for the offerings made by fire ([[Lev. 21:6]]).
    sources: [oshb-wlc, bdb]

  - ref: 28
    phrase: ye shall not kill it and her young both in one day
    kind: history
    title: A week with its mother, and never on one day with her
    body: |
      Verses 27–28 give two rules about a mother animal and her young, and the text gives no reason for either. A newborn calf, lamb or kid stayed seven days “under the dam” and could be offered only from the eighth day, the rule already given for the firstborn ([[Ex. 22:30]]); on the eighth day in the law, see [[Lev. 14:10]]. A cow or ewe and her young were not to be killed on the same day.

      One older reading says of the first rule that “the young animal had not attained to a mature and self-sustained life during the first week of its existence.” It sets the second beside the law against seething a kid in its mother's milk ([[Ex. 23:19]]) and the law of the mother bird ([[Deut. 22:6–7]]), as meant “to keep sacred the relation which God had established between parent and offspring.”
    sources: [keil-leviticus, lds-scriptures]

christ: |
  The animal had to be whole, and the New Testament describes Christ in the same terms: He “offered himself without spot to God” ([[Heb. 9:14]]) and is “a lamb without blemish and without spot” ([[1 Pet. 1:19]]), the two verses the Church's footnote at verse 20 points to. In one Latter-day Saint reading, “the ‘unblemished’ priest, like the ‘unblemished’ sacrifice typifies Christ, who lived free of both physical and moral blemish.” Malachi's chapter on blemished offerings carries the same point (see the Witness of Christ in [[Mal. 1]]).

  The rules for who might eat the holy food have been read beside the sacrament. One Latter-day Saint reading finds “an echo of these priestly functions” in the Savior's instructions at Bountiful about bringing the bread and wine, passing them to the people, and the worthiness of those who partake ([[3 Ne. 18:1–4]]; [[3 Ne. 18:28]]).

