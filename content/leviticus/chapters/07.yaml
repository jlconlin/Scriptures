chapter: 7
title: The Priests' Law of the Peace Offering
tagline: The LORD finishes the priests' instructions for the offerings. He gives the law of the trespass offering and the priests' shares, then the law of the peace offering, the one sacrifice the worshipper ate, with its thanksgiving bread, its time limits, and its rules of cleanness. The breast and the right thigh go to the priests.
when: 'At Sinai, in the second year after the Exodus, at the tabernacle just set up ([[Ex. 40:17]]; [[Lev. 7:38]]).'

setting: |
  Chapter 7 is the second half of the series that began at [[Lev. 6:8]]: the law of each offering given again from the priest's side (the series is described in the setting of chapter 6). It finishes the trespass offering explained at [[Lev. 5:15–16]] and [[Lev. 6:2–5]] and adds what the priests receive from the burnt and meat offerings (verses 1–10). Then it turns to the peace offering of chapter 3 and gives what that chapter left out: its kinds, thanksgiving offerings and “voluntary offerings connected with voluntary vows,” and who may eat it and when (verses 11–21).

  What is new here is the meal. Of all the sacrifices only the peace offering ended in a meal for the worshipper: once the fat was burned and the priests' pieces removed, “the rest of the flesh was eaten by the sacrificer, his household, and the poorer Levites at the tabernacle.” Most of the chapter's rules are about eating that holy food rightly.

  One older reading takes verses 37–38 as closing not only the priests' series but “the whole of the sacrificial law (ch. 1-7).” In the same reading, the words “in the wilderness of Sinai” point back to Israel's arrival there ([[Ex. 19:1]]). In the Book of Mormon the Lamanites “would drink the blood of beasts” ([[Jarom 1:6]]); that verse and verse 26 both “speak negatively about eating the blood of beasts.”

thread: |
  The chapter follows the food. Each offering in chapters 1–6 ended on the altar, in the priests' hands, or burned outside the camp ([[Lev. 4:12]]). Chapter 7 settles the last accounts. The trespass offering is eaten by the priests like the sin offering (verse 7); the officiating priest keeps the hide of the burnt offering and the baked meat offerings (verses 8–10).

  Then the peace offering: the bread brought with it (verses 12–14), the eating of the flesh, with the ban on fat and blood (verses 15–27), and the LORD's share, which He gives to the priests (verses 28–36). The rules are strict. Thanksgiving meat must be eaten the same day, vow and freewill meat by the second; what is left on the third day is burned. No one unclean may eat it, and fat and blood are never eaten at all. The rules are kept “because these sacrifices are a part of a covenant relationship.” The shares come out this way: the fat to the altar, the breast and the right thigh to the priests “by a statute for ever,” and the rest to the family that brought it, to eat “at the tabernacle.”

sections:
  - range: 1-10
    heading: The trespass offering, and the priests' shares
    plain: |
      This is the law of the trespass offering: it is most holy. It is killed where the burnt offering is killed, and its blood is sprinkled all around the altar. All its fat is offered: the rump, the fat covering the inner parts, the two kidneys with their fat by the loins, and the fatty appendage of the liver, removed with the kidneys. The priest burns them on the altar as an offering made by fire to the LORD; it is a trespass offering. Any male among the priests may eat the rest. It is to be eaten in a holy place; it is most holy.

      The sin offering and the trespass offering have one law: the meat belongs to the priest who makes atonement with it. The priest who offers anyone's burnt offering keeps its skin. Every meat offering baked in the oven or cooked in a pan or on a griddle belongs to the priest who offers it. Any meat offering mixed with oil, or dry, is shared equally by all of Aaron's sons.
  - range: 11-21
    heading: The law of the peace offering
    plain: |
      This is the law of the peace offering brought to the LORD. If someone offers it as a thanksgiving, he brings with it unleavened cakes mixed with oil, unleavened wafers spread with oil, and cakes of fine flour mixed with oil and fried, and loaves of leavened bread as well. One piece out of the whole offering is given as a heave offering to the LORD; it belongs to the priest who sprinkles the blood. The meat of a thanksgiving offering is eaten the day it is offered, with none left until morning.

      If the offering is for a vow or is a freewill offering, it may be eaten the day it is offered and the next day. Whatever is left on the third day is burned. If any of it is eaten on the third day, the offering is not accepted and is not credited to the one who offered it; it is foul, and whoever eats it bears his guilt. Meat that touches anything unclean is not eaten but burned. Anyone who is clean may eat the meat. Anyone who eats it while unclean, or after touching an unclean person, animal, or creature, is cut off from his people.
  - range: 22-27
    heading: No fat and no blood
    plain: |
      The LORD told Moses to tell the children of Israel: Eat no fat of cattle, sheep, or goats. The fat of an animal that dies of itself or is killed by wild beasts may be put to any other use, but never eaten. Whoever eats the fat of an animal that may be offered by fire to the LORD is cut off from his people. Eat no blood of bird or beast in any of your homes; whoever eats blood is cut off from his people.
  - range: 28-36
    heading: The priests' portion of the peace offering
    plain: |
      The LORD told Moses to tell the children of Israel: Whoever brings a peace offering is to bring his own part of it to the LORD. With his own hands he brings the LORD's offerings made by fire, the fat together with the breast, and the breast is waved as a wave offering before the LORD. The priest burns the fat on the altar, but the breast belongs to Aaron and his sons. The right thigh is given to the priest as a heave offering; it belongs to the son of Aaron who offers the blood and the fat.

      The LORD says: I have taken the wave breast and the heave thigh from Israel's peace offerings and given them to Aaron and his sons as their due for ever. This is the share of Aaron and his sons from the LORD's offerings, from the day they were presented to serve as priests, given them by the LORD's command on the day He anointed them, a statute for ever.
  - range: 37-38
    heading: The law of the offerings
    plain: |
      This is the law of the burnt offering, the meat offering, the sin offering, the trespass offering, the consecrations, and the peace offerings, which the LORD gave Moses at Mount Sinai, on the day He commanded Israel to bring their offerings to the LORD in the wilderness of Sinai.

notes:
  - ref: 6
    phrase: Every male among the priests shall eat thereof
    kind: history
    title: 'Most holy and holy: who ate what'
    body: |
      Three groups ate from the offerings, and the chapter keeps them apart. The sin and trespass offerings are “most holy”: their flesh “was eaten in a holy place by the priest and his sons,” the males of the priesthood (why the priests ate them is in the note on [[Lev. 6:30]]). The priests' share of the peace offering is holy but not most holy: the wave breast and the heave thigh “were eaten by their sons and their daughters in a clean place,” as the LORD later tells Aaron: “thou, and thy sons, and thy daughters with thee” ([[Lev. 10:14]]). The rest of the peace offering was eaten at the sanctuary by the worshipper and his family, who had only to be clean (verses 19–21).
    sources: [bd-sacrifices, lds-scriptures]

  - ref: 12
    phrase: If he offer it for a thanksgiving
    kind: history
    title: Thanksgiving, vow, and freewill
    body: |
      The chapter names three kinds of peace offering: a thanksgiving (verse 12), a vow, or a freewill offering (verse 16). The Hebrew *todah* is “thanksgiving,” and as an offering it is “a division of” the peace offering; it is the word of the Psalms' “sacrifices of thanksgiving” ([[Ps. 107:22]]). Vows “often had an entreating character; they were offered in order to obtain some favor from Jehovah.” The vow offering has been read as signifying “the taking or renewing of a vow or covenant,” and a worshipper could seemingly give the offering “for any of the above declared purposes separately or together.”

      The law treats the kinds differently in one respect, the time allowed to eat. The thanksgiving must be eaten the same day it is offered; the vow and freewill offerings may last into the second day (verses 15–16). The law repeats the thanksgiving rule later: “offer it at your own will. On the same day it shall be eaten up” ([[Lev. 22:29–30]]).
    sources: [bdb, ot-manual-lev-1-10, bd-vows, lds-scriptures]

  - ref: 13
    phrase: leavened bread
    kind: history
    title: Leavened bread with the thanksgiving
    body: |
      Leavened bread is brought with the thanksgiving even though no leaven was allowed “in offerings made to God with fire” (see the note on [[Lev. 2:11]]). The law has one other offering of that kind: of the firstfruits it says “they shall not be burnt on the altar for a sweet savour” ([[Lev. 2:12]]). In one older reading the leavened loaves here are like those firstfruits, “not intended for the altar”; the text itself gives a piece to the priest as a heave offering (verse 14) and puts none on the fire. The same reading takes Amos's line, “offer a sacrifice of thanksgiving with leaven” ([[Amos 4:5]]), as a witness that “leaven was brought with a thanksgiving offering.”
    sources: [bd-leaven, lds-scriptures, cambridge-leviticus]

  - ref: 18
    phrase: it shall be an abomination
    kind: history
    title: Why not on the third day
    body: |
      Meat eaten on the third day made the offering unacceptable. The word for “abomination” here is *piggul*, “foul thing, refuse,” a technical term used only “of unclean sacrificial flesh.” Such an offering “shall not be accepted, neither shall it be imputed”: it was not counted to the worshipper's credit, and the one who ate it bore the guilt. The law gives the same rule again with its reason: whoever eats it “hath profaned the hallowed thing of the LORD” ([[Lev. 19:8]]).

      Why the third day, the text does not say. In one older reading the rule guarded the holy meal from becoming common food gone bad: in a warm country, meat not carefully preserved “begins to putrefy, or becomes offensive … on the third day,” and the burning was commanded “to guard against the danger of a desecration of the meal.”
    sources: [bdb, keil-leviticus, lds-scriptures]

  - ref: 20
    phrase: even that soul shall be cut off from his people
    kind: history
    title: Cut off from his people
    body: |
      As the law's punishment, to be “cut off” means being “removed from Israelite society and from favor with the Lord.” The phrase comes four times in this chapter, each time for eating what the law withheld: the peace offering while unclean (verses 20–21), the altar fat (verse 25), or blood (verse 27). Of anyone who comes to the holy things unclean the law later says “that soul shall be cut off from my presence” ([[Lev. 22:3]]).

      In verses 20–21 the offence is not the uncleanness. Uncleanness was “ceremonially or ritually unclean” and “should not be taken to mean that the touching of a dead body or the bearing of children was morally evil.” What the verses punish is eating the LORD's sacrifice while unclean.
    sources: [ot-minute-lev, bd-clean-unclean, lds-scriptures]

  - ref: 30
    phrase: that the breast may be waved for a wave offering before the LORD
    kind: history
    title: The wave offering
    body: |
      A wave offering was a portion presented by waving it “before the LORD,” which the LORD then gave to the priests (verses 30, 34). The Hebrew *tenuphah* is “a swinging, waving,” and in the law it is a “technical term … originally of priest's share of sacrifice.” The portion here is the breast, or brisket, “one of the most savoury parts” of the animal. The worshipper brings it with his own hands, together with the fat (verse 30).

      How the waving was done the text does not describe. In one older reading “the priest laid the object to be waved upon the hands of the offerer, and then placed his own hands underneath,” and moved them toward the altar and back: forward for “the symbolical transference of it to God,” and back for “the reception of it back again, as a present which God handed over to His servants the priests.” At the consecration of the priests the fat, the right thigh and cakes are waved as well as the breast ([[Lev. 8:25–29]]).
    sources: [bdb, keil-leviticus, lds-scriptures]

  - ref: 32
    phrase: And the right shoulder shall ye give unto the priest for an heave offering
    kind: words
    title: The heave offering, and a thigh, not a shoulder
    body: |
      The heave offering was a portion set apart for the LORD's priests, and here it is the right hind leg. The Hebrew *terumah* is a “contribution, offering, for sacred uses,” properly “something lifted off, separated.” The same word names the priest's piece of the bread at verse 14. The portion “was given by the offerer to the priest in payment for his assistance”: the right thigh went to the priest who offered the blood and the fat (verse 33), the breast to the priests as a body (verse 31).

      The King James “shoulder” is a thigh. The Hebrew *shoq*, of a sacrificial animal, is the “upper leg, thigh, hind leg”; the Greek and Latin translations have other words, “hence AV and others shoulder.” It is “the heave thigh (the portion of the officiating priest),” and this chapter's paraphrase says thigh. These two shares, breast and thigh, are what other chapters mean by “the wave breast and the heave shoulder” ([[Lev. 10:14]]).
    sources: [bdb, ot-manual-lev-1-10, bd-sacrifices]

  - ref: 37
    phrase: and of the consecrations
    kind: words
    title: The consecrations
    body: |
      “The consecrations” in the summary are the offerings at the installation of the priests. The Hebrew *milluʾim* means “installation (of priests),” and it names the ram offered at that rite, “the ram of consecration” ([[Lev. 8:22]]), first commanded in [[Ex. 29:22]]. Chapter 8 carries it out over seven days, “until the days of your consecration be at an end” ([[Lev. 8:33]]).
    sources: [bdb, oshb-wlc, lds-scriptures]

christ: |
  What is this chapter's own is the thanksgiving meal. A peace offering presupposed a worshipper “at peace with God,” and its “characteristic rite was the sacrificial meal” (the meal itself is at [[Lev. 3:1]], and how all the offerings pointed to Christ and ended in Him is in chapter 1's Witness of Christ). In one older reading the meal “shadowed forth … the blessedness of eating and drinking in the kingdom of God.”

  The Greek translation of the Old Testament calls the thanksgiving “the sacrifice of praise” (verse 12). Hebrews has the same words, offered now through Christ: “By him therefore let us offer the sacrifice of praise to God continually, that is, the fruit of our lips giving thanks to his name” ([[Heb. 13:15]]). The wording is shared; Hebrews does not name Leviticus 7.

explore: |
  - **The thanksgiving in the Psalms.** [[Ps. 107:22]]; [[Ps. 116:17]]; [[Jer. 33:11]].
  - **The priest's portion abused.** [[1 Sam. 2:12–17]]: Eli's sons take the meat before the fat is burned.
  - **The rest of the peace offering.** [[Lev. 3:1–17]] for the altar's side, and [[Lev. 19:5–8]] and [[Lev. 22:21–30]] for its rules restated.

