chapter: 4
title: The Sin Offering
tagline: The LORD gives the offering for sins done in error. For a high priest's sin or the whole nation's, a bull is brought and its blood carried into the tabernacle; a ruler brings a male goat, and one of the people a female goat or lamb. In every case the priest makes atonement, and the sin is forgiven.
when: 'At Sinai, in the second year after the Exodus, with the tabernacle newly set up (Ex. 40:17).'

setting: |
  Chapter 4 opens a new speech of the LORD to Moses (verse 1); the last one began at [[Lev. 1:1]] and covered the burnt, meat and peace offerings of chapters 1–3. Those were brought freely, “of his own voluntary will” ([[Lev. 1:3]]). With chapter 4 the book turns to the sacrifices for sin: the sin offering here, and the trespass offering in the chapter that follows. This one is required: “let him bring” it (verse 3), whenever a person or the people learn they have broken one of the LORD's commandments without meaning to.

  The time and place are those of the whole book. The tabernacle has just been set up, “in the first month in the second year” ([[Ex. 40:17]]), and the LORD gives these laws to Moses “in mount Sinai” ([[Lev. 7:38]]). The tent, its veil and its two altars are described in Exodus.

  The priest's part in the same offering is given again at [[Lev. 6:24–30]], and the greatest sin offering of the year, carried within the veil on the Day of Atonement, is in chapter 16. Hebrews reads these offerings in the light of Christ (see the Witness of Christ below).

thread: |
  Chapter 4 is one rule applied to four kinds of sinner: the anointed priest, the whole congregation, a ruler, and one of the common people. The occasion is the same each time, a sin done in error against “any of the commandments of the LORD concerning things which ought not to be done” ([[Lev. 4:2]]) that comes to light afterward. The steps are the same each time: the animal is brought; the offerer lays his hand on its head (for the nation, the elders do); it is killed before the LORD; the priest applies its blood; the fat is burned on the altar; and the case ends in the same words, that the priest shall make an atonement “and it shall be forgiven” ([[Lev. 4:20]]).

  The offering changes with the sinner's standing: the higher the standing, the larger the animal, from the high priest's bull to the commoner's she-goat or lamb, and the deeper the blood is carried into the sanctuary: for the high priest and the nation it is sprinkled before the veil and put on the incense altar inside the tent; for a ruler or one of the people it goes only on the altar in the court. The pattern ties the seriousness of the sin to the standing of the one who commits it. Two notes follow that out, on what the offering cleansed (verse 3) and on how far its blood went (verse 6).

sections:
  - range: 1-2
    heading: Sins done in error
    plain: |
      The LORD spoke to Moses: “Tell the children of Israel: when anyone sins by mistake, doing something that the LORD's commandments forbid, this is what is to be done.”
  - range: 3-12
    heading: The anointed priest
    plain: |
      “If it is the anointed priest who sins, and so brings guilt on the people, he is to bring for his sin a young bull without blemish to the LORD as a sin offering. He brings it to the door of the tabernacle, lays his hand on its head, and kills it before the LORD. Then the anointed priest takes some of its blood into the tabernacle. He dips his finger in the blood and sprinkles it seven times before the LORD, in front of the veil of the sanctuary, and puts some on the horns of the altar of incense inside. All the rest of the blood he pours out at the base of the altar of burnt offering at the door.

      “He removes all the fat of the bull, the fat that covers the inner parts and all the fat on the inner parts, the two kidneys with their fat, and the caul above the liver, as is done with the peace offering, and burns them on the altar of burnt offering. But the rest of the bull, its hide and all its flesh, its head and legs, its inner parts and its dung, he carries outside the camp to a clean place, where the ashes are poured out, and burns it there on a wood fire.”
  - range: 13-21
    heading: The whole congregation
    plain: |
      “If the whole congregation of Israel errs, and the matter is hidden from the assembly, and they do something the LORD's commandments forbid and become guilty, then when the sin becomes known the congregation is to offer a young bull for the sin and bring it before the tabernacle. The elders lay their hands on the bull's head, and it is killed before the LORD. The anointed priest brings some of its blood into the tabernacle, sprinkles it seven times before the LORD in front of the veil, and puts some on the horns of the altar inside; the rest he pours out at the base of the altar of burnt offering. He burns all its fat on the altar and does with this bull just as with the first. So the priest makes atonement for them, and they are forgiven. Then he carries the bull outside the camp and burns it as he burned the first. It is the sin offering for the congregation.”
  - range: 22-26
    heading: A ruler
    plain: |
      “When a ruler sins by mistake, doing something that the commandments of the LORD his God forbid, and is guilty, once his sin is made known to him he is to bring as his offering a male goat without blemish. He lays his hand on its head and kills it where the burnt offering is killed before the LORD: it is a sin offering. The priest takes some of its blood on his finger, puts it on the horns of the altar of burnt offering, and pours out the rest at its base. He burns all its fat on the altar like the fat of the peace offering. So the priest makes atonement for him for his sin, and he is forgiven.”
  - range: 27-35
    heading: One of the people
    plain: |
      “If one of the common people sins by mistake, doing something the LORD's commandments forbid, and is guilty, once his sin is made known to him he is to bring a female goat without blemish for the sin he has committed. He lays his hand on its head and kills it where the burnt offering is killed. The priest puts some of its blood on the horns of the altar of burnt offering and pours out all the rest at its base. He removes all its fat, as the fat is removed from the peace offering, and burns it on the altar as a sweet savour to the LORD. So the priest makes atonement for him, and he is forgiven.

      “If he brings a lamb as his sin offering, it is to be a female without blemish. He lays his hand on its head and kills it as a sin offering where the burnt offering is killed. The priest puts some of its blood on the horns of the altar of burnt offering and pours out all the rest at its base. He removes all its fat, as the fat of the lamb is removed from the peace offering, and burns it on the altar with the LORD's offerings by fire. So the priest makes atonement for the sin he has committed, and he is forgiven.”

notes:
  - ref: 2
    phrase: sin through ignorance
    kind: words
    title: Sin through ignorance
    body: |
      The offering of this chapter is for a sin done without meaning to; for a sin done in open defiance the law sets no offering at all. The Hebrew phrase is *bishgagah*, “in error.” The noun means a “sin of error, inadvertence,” opposed to sins of intention, and the same word is used of a man who kills another “unawares,” the case for which the cities of refuge were set aside ([[Num. 35:11]]). It covers a sin “of ignorance or negligence.”

      The law states the other side plainly. After the offering for the one who sins “through ignorance,” Numbers goes on: “But the soul that doeth ought presumptuously, whether he be born in the land, or a stranger, the same reproacheth the Lord; and that soul shall be cut off from among his people” ([[Num. 15:30]]). Under the law of Moses atonement could be made for “unconscious, unintentional sins,” but “sins committed with a high hand, and for which the punishment was death, did not admit of expiation under the Mosaic law.” Between the two lay other cases the law did provide for, among them crimes “a man voluntarily confessed”; chapter 5 takes those up (see [[Lev. 5:5]]).
    sources: [bdb, oshb-wlc, ot-minute-lev, bd-sacrifices, lds-scriptures]

  - ref: 3
    phrase: If the priest that is anointed do sin according to the sin of the people
    kind: history
    title: The anointed priest, whose sin falls on the people
    body: |
      “The priest that is anointed” is the high priest, and his sin is treated as the nation's because it brings guilt on the people he serves. In this chapter the phrase is a title of the “high priest of Israel,” and the Aramaic translation read in Jesus's day says “the high priest” outright. The ancient Greek translation renders “anointed” with *christos*, the word behind the title Christ (on the anointing of the priests, see [[Ex. 29:7]]).

      The King James “according to the sin of the people” is obscure. It can be rendered “thus bringing guilt on the people,” and the Greek has “so as to cause the people to sin.” His error becomes the people's: he “has committed or is responsible for a sin of the people against God.” That is why his offering is the same as the one the whole congregation brings (verse 14): a young bull, the sin offering “for priests as individuals or as representatives of the people,” with its blood carried into the tent and its body burned outside the camp.
    sources: [bdb, gee-last-sacrifice, nrsvue, lxx-rahlfs, ot-minute-lev, bd-sacrifices]

  - ref: 3
    phrase: for a sin offering
    kind: words
    title: The sin offering, or the purification offering
    body: |
      The King James “sin offering” renders a Hebrew word, *ḥaṭṭaʾt*, that names both the sin and the offering brought for it. This verse uses it twice: the priest brings “for his sin” a bull “for a sin offering,” and both are *ḥaṭṭaʾt*. The word carries both senses, “sin, sin-offering.”

      The offering's “fundamental idea … was atonement, expiation”: it implied “a sin, or some uncleanness akin to a sin, that needed atoning for before fellowship with Jehovah could be obtained.”

      It is also called the “purification offering,” and one scholar argues that the name “must be rendered” so. On his reading the offering's blood cleanses not the sinner but the sanctuary. It is “the ritual detergent,” and “its use is confined to the sanctuary, but it is never applied to a person”: the priest purges the holy things “on behalf of the person who caused their contamination,” since the sanctuary “needs constant purification lest the resident god abandons it.” What is cleansed, on this reading, is “that which receives the purgative blood.” It is one scholar's reading, not the Church's, and the text leaves it open: each case still ends with the sinner forgiven (see the note on verse 20). The blood's path is followed in the note on verse 6.
    sources: [oshb-wlc, bdb, bd-sacrifices, nrsvue, milgrom-temple]

  - ref: 6
    phrase: before the veil of the sanctuary
    kind: history
    title: How far the blood is carried
    body: |
      Where the blood of the sin offering went depended on who had sinned, and in the two highest cases it was carried inside the tent. For the anointed priest and for the whole congregation, the priest sprinkled it seven times before the veil and put it on the horns of the incense altar in the holy place (verses 6–7, 17–18). For a ruler or one of the people, it went only on the horns of the altar of burnt offering in the court (verses 25, 30, 34). In every case the rest was poured out at the base of the outer altar. Beyond this chapter lies a third, innermost step: on the Day of Atonement the blood was “sprinkled on the front of the mercy seat” itself.

      One scholar reads the steps as a measure of how deep the sin had reached. The error of one person “pollutes the courtyard altar”; the error “of the high priest or the entire community pollutes the shrine”; and “the wanton, unrepented sin … pierces the veil to the holy ark,” and its cleansing must wait for the Day of Atonement in chapter 16. On that reading “the severity of the sin-impurity varies in direct relation to the depth of its penetration into the sanctuary.”

      Where the blood went also decided whether the flesh could be eaten. When the blood was taken into the tent, the meat could not be eaten: “no sin offering, whereof any of the blood is brought into the tabernacle of the congregation to reconcile withal in the holy place, shall be eaten: it shall be burnt in the fire” ([[Lev. 6:30]]). So the two bulls are burned outside the camp (verses 11–12, 21). The goat or lamb of a ruler or one of the people goes to the priest who offered it: “in the holy place shall it be eaten” ([[Lev. 6:26]]). On the incense altar's horns, see [[Ex. 30:10]].
    sources: [bd-sacrifices, milgrom-temple, lds-scriptures]

  - ref: 14
    phrase: When the sin, which they have sinned against it, is known
    kind: history
    title: Brought when the sin comes to light
    body: |
      The offering is brought when the sinner learns what he has done, not before. The congregation's sin is first “hid from the eyes of the assembly” ([[Lev. 4:13]]), and the bull is brought “when the sin … is known”; for the ruler and the commoner it is “if his sin … come to his knowledge” (verses 23, 28). One only made a sin offering “after learning that a sin was committed.” The King James “Or if his sin … come to his knowledge” can also be rendered “once the sin that he has committed is made known to him.”

      The words “and are guilty” (verse 13; also verses 22 and 27) translate one Hebrew verb, *ʾasham*, which can be rendered “incurs guilt.” One scholar takes it instead as “feels guilty”: the offender's remorse means “he has undergone inner purification,” so that what the offering still has to cleanse is the sanctuary (his reading, given in the note on verse 3).
    sources: [gee-last-sacrifice, nrsvue, oshb-wlc, milgrom-temple]

  - ref: 20
    phrase: the priest shall make an atonement for them, and it shall be forgiven them
    kind: scripture
    title: Forgiven through the offering, and through Christ
    body: |
      Each case in the chapter ends with the same promise, the priest's act and its result: atonement is made, and the sin “shall be forgiven” (verses 20, 26, 31, 35). The ending differs from the one for bodily uncleanness, where the rite closes “and she shall be clean” ([[Lev. 12:8]]): “thus the impure person needs purification and the sinner needs forgiveness.” On the meaning of “atonement,” see [[Ex. 25:17]].

      Later scripture says where that forgiveness came from. Abinadi tells King Noah's priests “that salvation doth not come by the law alone; and were it not for the atonement, which God himself shall make for the sins and iniquities of his people, that they must unavoidably perish, notwithstanding the law of Moses” ([[Mosiah 13:28]]). Hebrews puts it more sharply: “For it is not possible that the blood of bulls and of goats should take away sins” ([[Heb. 10:4]]). Amulek says what the law was for: it was “every whit pointing to that great and last sacrifice; and that great and last sacrifice will be the Son of God” ([[Alma 34:14]]).
    sources: [milgrom-temple, lds-scriptures]

  - ref: 22
    phrase: When a ruler hath sinned
    kind: history
    title: Offerings scaled to the sinner
    body: |
      The ruler of this verse is a *nasi*, a chief or prince, and his offering stands between the high priest's and the commoner's. The word means “one lifted up, i.e. a chief prince,” and is used here, as elsewhere, of the “rulers of the congregation.”

      The chapter's four cases scale the animal to the person: a young bull for the anointed priest and for the whole congregation, a male goat for a ruler, a female goat or a female lamb for one of the people (verses 3, 14, 23, 28, 32). Chapter 5 carries the scale one step lower: one who cannot afford a lamb brings “two turtledoves, or two young pigeons” ([[Lev. 5:7]]). The scale follows responsibility: “the higher the person's level of responsibility, the more serious the infraction and therefore the larger the necessary reparation.” The ruler's rank earns him a larger animal, but not a different place: his blood, like the commoner's, goes only on the outer altar (see the note on verse 6).
    sources: [bdb, oshb-wlc, ot-minute-lev, lds-scriptures]

christ: |
  Hebrews reads offerings like this chapter's in the light of Christ, in its own words. Of the sin offerings whose blood the high priest brought into the sanctuary and whose bodies were “burned without the camp” ([[Heb. 13:11]]), as the bulls of verses 5–12 and 16–21 were, and the Day of Atonement's after them ([[Lev. 16:27]]), it says: “Jesus also, that he might sanctify the people with his own blood, suffered without the gate” ([[Heb. 13:12]]); the passage is set out at [[Ex. 29:14]]. The same letter sets the blood of these animals beside His: “For if the blood of bulls and of goats, and the ashes of an heifer sprinkling the unclean, sanctifieth to the purifying of the flesh: How much more shall the blood of Christ, who through the eternal Spirit offered himself without spot to God, purge your conscience from dead works to serve the living God?” ([[Heb. 9:13–14]]).

  The anointed priest of verse 3 had to bring a bull for his own sin. Hebrews says of every such priest that “he ought, as for the people, so also for himself, to offer for sins” ([[Heb. 5:3]]), and of Christ that He is the high priest “who is holy, harmless, undefiled, separate from sinners” ([[Heb. 7:26]]), who did not need, as they did, to offer “first for his own sins” ([[Heb. 7:27]]).

  King Benjamin, apparently with this law's problem of unintended sin in mind, names whose blood covers such sins: “his blood atoneth for the sins of those who have fallen by the transgression of Adam, who have died not knowing the will of God concerning them, or who have ignorantly sinned” ([[Mosiah 3:11]]). In the next breath he turns to the one who sins knowingly: “But wo, wo unto him who knoweth that he rebelleth against God! For salvation cometh to none such except it be through repentance and faith on the Lord Jesus Christ” ([[Mosiah 3:12]]).

  How the law of sacrifice as a whole pointed to Christ, and ended in Him, is in the volume guide's section on [sacrifice](/old-testament/guides/law-and-covenant/#sacrifice).

explore: |
  - **The same law in Numbers.** [[Num. 15:22–31]], the offering for sins of ignorance and the soul that sins presumptuously.
  - **The priest's side of the sin offering.** [[Lev. 6:24–30]].
  - **The sin offering within the veil.** [[Lev. 16:11–19]], on the Day of Atonement.
  - **Hebrews on the blood of bulls and goats.** [[Heb. 9:11–14]]; [[Heb. 10:1–14]]; [[Heb. 13:10–13]].
  - **Christ's blood and the sins of ignorance.** [[Mosiah 3:11–12]].
  - **A study of the sin offering.** “The Temple in Biblical Israel: Kinships of Meaning” (Religious Studies Center, 1978) follows one rite, the blood on the horns of the altar, through the whole sanctuary.

