chapter: 27
title: Vows, Redemption, and the Tithe
tagline: What a person gives the LORD by a vow can be bought back at a price the law sets; what is already the LORD's, the firstling, the devoted thing and the tithe, cannot be vowed or, in some cases, bought back at all.
when: 'At Sinai, in the second year after the Exodus'

setting: |
  The laws given at Sinai have already ended once. Chapter 26 closed with the blessings and cursings and a summary: “These are the statutes and judgments and laws, which the LORD made between him and the children of Israel in mount Sinai by the hand of Moses” ([[Lev. 26:46]]). Chapter 27 follows with rules for vows, and ends with a second close of its own (verse 34).

  In one older reading, the directions on vows come after that close “as an appendix,” because vows “formed no integral part of the covenant laws, but were a freewill expression of piety.” No one had to vow; but “every vow, when once it had been made, was to be conscientiously and inviolably kept” (compare [[Deut. 23:21–23]]). Another older reading notes that the chapter assumes the jubilee of chapter 25 and its rights of redemption, which “may account for the position of the ch. here.”

  In one Latter-day Saint reading of the book's shape, chapters 25 and 27 stand on either side of chapter 26, and both “detail ways in which all life and land already belong to the Lord or are further consecrated to Him by sacred vows.” On that reading the closing chapter “prepares the reader to fulfill their temple vows and commitments.” The jubilee itself is explained at [[Lev. 25:10]].

thread: |
  One premise runs under every rule: “everyone and everything belongs to the Lord.” The chapter sorts what a person may give to the LORD by a vow, and buy back, from what is His already.

  Persons, animals, houses and fields may be vowed (verses 1–25). A person is bought back at a price set by age and sex; a clean animal fit for sacrifice stays holy and cannot be exchanged; an unclean animal, a house or a field can be redeemed, and the one who redeems his own gift adds a fifth to the price (verses 13, 15, 19), as in the trespass offering ([[Lev. 5:16]]). A field's price runs by the years to the jubilee.

  Then come three things that cannot be vowed in the ordinary way (verses 26–33). The firstling is “the LORD's” already, and “nothing already holy to the Lord” could be offered as a vow; an unclean firstling is bought back or sold (verse 27). The devoted thing cannot be sold or redeemed at all. The tithe “is the LORD's” too (verse 30). The words “holy unto the LORD” run through the chapter (verses 14, 21, 28, 30, 32), and the book ends on the commandments given “in mount Sinai” (verse 34).

sections:
  - range: 1-8
    heading: Persons vowed to the LORD
    plain: |
      The LORD told Moses to say to Israel: When someone makes a special vow to give a person to the LORD, the person is redeemed at the value you set. A man from twenty to sixty years old is valued at fifty shekels of silver by the sanctuary shekel, and a woman at thirty. From five to twenty years, a male is twenty shekels and a female ten. From a month to five years, a boy is five shekels of silver and a girl three. Over sixty, a man is fifteen shekels and a woman ten. If the one who vowed is too poor to pay the set value, he is to stand before the priest, and the priest shall set a value he can afford.
  - range: 9-13
    heading: Animals
    plain: |
      If the vow is of an animal fit for an offering to the LORD, whatever is given is holy. It may not be swapped, a good one for a bad or a bad for a good; if someone does swap one animal for another, both become holy. If it is an unclean animal, not fit for sacrifice, it is brought to the priest, who values it, good or bad, and his value stands. If the owner wants to buy it back, he adds a fifth to the value.
  - range: 14-15
    heading: Houses
    plain: |
      When someone dedicates his house as holy to the LORD, the priest values it, good or bad, and that value stands. If the one who dedicated it wants to buy it back, he adds a fifth to the price, and it is his again.
  - range: 16-25
    heading: Fields
    plain: |
      If someone dedicates part of his family's land to the LORD, its value is set by the seed it takes to sow: land sown with a homer of barley is valued at fifty shekels of silver. If he dedicates it right after the year of jubilee, the full value stands. If he dedicates it later, the priest counts the price by the years left until the next jubilee and takes off the rest. If he wants to buy it back, he adds a fifth to the price and it stays his. But if he does not buy it back, or if he has sold it to someone else, it can no longer be redeemed: when it goes free at the jubilee it is holy to the LORD, like a field devoted, and becomes the priest's.

      If he dedicates a field he bought, which is not part of his family's land, the priest counts its value up to the jubilee, and he pays that amount the same day as a holy gift to the LORD. In the jubilee the field goes back to the one it was bought from, whose family's land it was. All values are by the sanctuary shekel, twenty gerahs to the shekel.
  - range: 26-29
    heading: What cannot be vowed or redeemed
    plain: |
      No one may dedicate a firstling, ox or sheep, because the firstling is already the LORD's. A firstling of an unclean animal is bought back at its value with a fifth added, or if it is not bought back it is sold at its value. But nothing a man devotes to the LORD of all he has, whether person, animal or family land, may be sold or bought back: every devoted thing is most holy to the LORD. No person who is devoted may be ransomed; he must be put to death.
  - range: 30-33
    heading: The tithe
    plain: |
      All the tithe of the land, of the grain of the field or the fruit of the tree, is the LORD's; it is holy to the LORD. If someone wants to buy back any of his tithe, he adds a fifth to it. And of the herd and the flock, every tenth animal that passes under the shepherd's rod is holy to the LORD. The owner shall not pick through them, good or bad, or swap one; if he does swap one, both the animal and its substitute are holy, and they cannot be bought back.
  - range: 34-34
    heading: The end of the commandments
    plain: |
      These are the commandments the LORD gave Moses for the children of Israel at Mount Sinai.

notes:
  - ref: 2
    phrase: When a man shall make a singular vow
    kind: words
    title: 'A “singular vow”: giving a person to the LORD'
    body: |
      A “singular vow” is a special vow, and here it is a vow to give a person to the LORD. The Hebrew verb behind “singular” is *pālāʾ*, whose root speaks of what is extraordinary or difficult; with “vow” it means “make a hard vow,” and the same words open the Nazarite's vow ([[Num. 6:2]]). The vow is of “the persons” ([[Lev. 27:2]]): it is the kind of vow by which “some person or thing was given to the Lord,” and vows “often had an entreating character,” made to ask a favor of the LORD.

      Under the law a man or woman could “dedicate a person to the Lord,” and the person “had to be reckoned as the Lord's.” Hannah's vow of the child Samuel is an example of a person given to the LORD ([[1 Sam. 1:11]]). The verses that follow set the price at which such a vow was redeemed. The chapter deals with “redeeming people from obligations created by their personal vows to God”; until the vow was redeemed or kept, the person “otherwise” belonged to God.
    sources: [bdb, bd-vows, ot-manual-lev-19-27, ot-minute-lev, lds-scriptures]

  - ref: 3
    phrase: thy estimation shall be fifty shekels of silver, after the shekel of the sanctuary
    kind: history
    title: What the prices measured
    body: |
      The figures in verses 3–7 are what it cost to redeem a person vowed to the LORD. They are payments in silver by weight, since before coinage “payments were made by weight”; the shekel is explained at [[Ex. 30:15]], and the sanctuary's shekel is “twenty gerahs” ([[Lev. 27:25]]). The scale runs:

      | Age | Male | Female |
      |---|---|---|
      | a month to five years | 5 shekels | 3 shekels |
      | five to twenty | 20 | 10 |
      | twenty to sixty | 50 | 30 |
      | over sixty | 15 | 10 |

      The text gives no reason for the scale. Two older readings take it from the work a person could do: in one, the price “was regulated … according to capacity and vigour of life”; in the other, it “turned upon the comparative strength and capability of work to be fairly expected in the two sexes and at various periods of life.” Either way, the values are a price for redeeming a vow.

      The law let the poor vow too. A man “poorer than thy estimation” stood before the priest, who set a price “according to his ability that vowed” ([[Lev. 27:8]]). In one older reading the rule “made it possible for the poor man to vow his own person to the Lord.”
    sources: [bd-money, keil-leviticus, cambridge-leviticus, lds-scriptures]

  - ref: 16
    phrase: an homer of barley seed shall be valued at fifty shekels of silver
    kind: history
    title: A field priced by its seed and by the years to the jubilee
    body: |
      A field was measured by the seed it took to sow, and priced by the years left before the jubilee. “Land area was also measured by the amount of grain needed to sow it, as in Lev. 27:16”; a homer is “said to be 10 ephahs,” and is believed to be about 230 liters, or six and a half bushels. Land sown with that much barley was valued at fifty shekels ([[Lev. 27:16]]).

      The jubilee set the rest. Dedicated just after a jubilee, the field kept its full value; dedicated later, the priest counted “according to the years that remain, even unto the year of the jubilee” ([[Lev. 27:18]]). Behind the count stands the jubilee law of chapter 25, under which the family's land “shall not be sold for ever: for the land is mine; for ye are strangers and sojourners with me” ([[Lev. 25:23]]). In one Latter-day Saint reading of chapters 25–27, “Leviticus has to insist that the land belongs to God, he is the owner, and the people are his tenants.”

      A field the owner did not buy back, or sold to someone else, did not go back to him at the jubilee: it became “holy unto the LORD, as a field devoted,” and the priest's ([[Lev. 27:21]]). A field someone had bought went back at the jubilee to the family whose land it was (verses 22–24; compare [[Lev. 25:28]]).
    sources: [bd-weights-and-measures, ot-minute-lev, lds-scriptures]

  - ref: 29
    phrase: None devoted, which shall be devoted of men, shall be redeemed; but shall surely be put to death
    kind: history
    title: What could never be redeemed
    body: |
      A “devoted” thing (*ḥerem*, the ban; the verb is explained at [[Ex. 22:20]]) belonged to the LORD past any buying back. In verse 28 it is apparently “anything devoted to sanctuary under specially stringent conditions”: a person, animal or field so devoted “shall be sold or redeemed” by no one, for “every devoted thing is most holy unto the LORD” ([[Lev. 27:28]]), and devoted property went to the priests ([[Num. 18:14]]). Verse 29 goes further: “every human being who became” devoted “should be killed.” Elsewhere the same ban falls on Jericho ([[Josh. 6:17]]) and on a city in Israel that turned to other gods ([[Deut. 13:12–17]]).

      Verse 29 does not say who could be devoted, and a reader may ask whether it let a man devote another person to death. The older readings take verse 29 as something other than a private vow. One distinguishes what “individuals” set apart for God in verse 28 from “persons, such as the idolater or blasphemer, who were subjected to a judicial sentence by the authorities”: “the latter are those meant” in verse 29. The other holds that “an individual was not at liberty to devote a human being to the ban simply at his own will and pleasure,” for that would have been “a breach of the law, which prohibited the killing of any man, even though he were a slave” (see [[Ex. 21:20]]).
    sources: [bdb, cambridge-leviticus, keil-leviticus, lds-scriptures]

  - ref: 30
    phrase: all the tithe of the land
    kind: history
    title: The tithe was the LORD’s before it was given
    body: |
      The tithe is not a gift vowed but a portion that “is the LORD's” already, the words used of the firstling in verse 26. The word “denotes a tenth part, given for the service of God,” and the first recorded tithe is Abraham's to Melchizedek (see the note at [[Gen. 14:20]]). The law gave it to the Levites ([[Num. 18:21–28]]), “who in their turn give one-tenth of what they receive to the priests.”

      The chapter adds two rules. A man could buy back the tithe of his grain or fruit by adding a fifth ([[Lev. 27:31]]), but not the tithe of his animals (verse 33). Latter-day revelation gives the law of the tithe again ([[D&C 119]]); the note at [[Mal. 3:10]] takes up the tithe in the Restoration.
    sources: [bd-tithe, lds-scriptures]

  - ref: 32
    phrase: whatsoever passeth under the rod
    kind: history
    title: Counting the flock under the rod
    body: |
      The rod is the shepherd's staff, and passing under it is how a flock was counted. The shepherd's rod was “used in mustering or counting sheep”; it was “also used to count the sheep at the day's end.” Of the animals counted, “the tenth shall be holy unto the LORD” ([[Lev. 27:32]]).

      The count decided which animal it was, not the owner. “He shall not search whether it be good or bad, neither shall he change it” ([[Lev. 27:33]]), the rule already given for an animal vowed (verse 10): if he swaps one, both are holy and neither can be bought back.
    sources: [bdb, sc-knowhy-427, lds-scriptures]

  - ref: 34
    phrase: These are the commandments, which the LORD commanded Moses for the children of Israel in mount Sinai
    kind: structure
    title: The book closes as it opened
    body: |
      The last verse names the giver of all of Leviticus and the place, and it answers the book's first verse. Leviticus opened, “the LORD called unto Moses, and spake unto him out of the tabernacle of the congregation” ([[Lev. 1:1]]); it ends, “These are the commandments, which the LORD commanded Moses … in mount Sinai.” This is a “declaration of divine authorship” that “closes the revelation with a statement similar to the words with which the book began,” and the two together “form an inclusio, bookending the text with a double seal of divine approval.” (An *inclusio* is a frame: the same words at the beginning and the end of a passage.)

      The words “in mount Sinai” have closed sections of the law before ([[Lev. 7:38]]; [[Lev. 26:46]]), and here they close the book. Numbers takes up the story “in the wilderness of Sinai, in the tabernacle of the congregation” ([[Num. 1:1]]).
    sources: [ot-minute-lev, lds-scriptures]

christ: |
  The LORD who gave these commandments “to Moses … in mount Sinai” is Jehovah, and “Jehovah is the premortal Jesus Christ” (see [[Ex. 3:14]]). When He came to the Nephites He said so of the law: “Behold, I am he that gave the law, and I am he who covenanted with my people Israel; therefore, the law in me is fulfilled” ([[3 Ne. 15:5]]). What the offerings of the law pointed to is in the Witness of Christ for [[Lev. 1]].

  The chapter's rules rest on the premise that “everyone and everything belongs to the Lord.” The firstling that cannot be vowed because it is His already (verse 26) falls under the law of the firstborn, by which “the male firstborn of animals also belonged to God”; Jesus is “the firstborn of the spirit children of our Heavenly Father,” and [The Firstborn](/exodus/themes/the-firstborn/) follows that law to Him.

