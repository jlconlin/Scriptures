chapter: 6
title: Restitution, and the Fire That Never Goes Out
tagline: A man who has cheated his neighbour gives back what he took, with a fifth more, before he brings his trespass offering. Then the LORD tells the priests how to keep the altar fire burning and how to handle the burnt, grain, and sin offerings.
when: 'At Sinai, in the second year after the Exodus, at the tabernacle just set up ([[Ex. 40:17]]; [[Lev. 7:38]]).'

setting: |
  Leviticus 6 straddles a seam in the law of the offerings. Its first seven verses finish the trespass offering begun in chapter 5. In the Hebrew Bible they are still chapter 5 (verses 20–26), and the Hebrew's chapter 6 begins at the King James verse 8, so a commentary that follows the Hebrew numbers this chapter's verses differently.

  From verse 8 the audience changes. Chapters 1–5 told an Israelite what to bring. Now Moses is to “command Aaron and his sons” ([[Lev. 6:9]]), and the laws that follow, through the end of chapter 7, are “in the main … concerned with priestly duties and dues.” Most open with “This is the law of,” and the series closes with its own summary: “This is the law of the burnt offering, of the meat offering, and of the sin offering, and of the trespass offering” ([[Lev. 7:37]]).

  So the chapter comes back to offerings already explained, this time from the other side of the altar. The burnt offering is explained in chapter 1, the meat (grain) offering in chapter 2, the sin offering in chapter 4, and the trespass offering at [[Lev. 5:15–16]]. This chapter adds what the priest does with each. The lost thing found and denied in verse 3 also comes up in the civil law of [[Ex. 22:8–9]].

thread: |
  The chapter has two halves, and both are about putting things back where they belong.

  In verses 1–7 a man has kept what was his neighbour's: a deposit, a pledge, something seized, something found and then denied under oath. The law calls this a trespass “against the LORD” (see the note on verse 2), and the order of the remedy carries the point. First “the wrong has been repaid with interest,” and only then is the offender “instructed to bring a sacrifice to the priest.” The priest makes atonement, and “it shall be forgiven him” ([[Lev. 6:7]]).

  In verses 8–30 the priests are told how to keep the altar and handle what is laid on it. The fire is never to go out. The priests eat their share of the grain and sin offerings only in the court of the tabernacle. Whatever touches these “most holy” things becomes holy. Blood that spatters a garment is washed out in the holy place, so that “the most holy blood might not be carried out of the sanctuary into common life.” The rule throughout: “Sacrifices are to be carried out with precision.”

sections:
  - range: 1-7
    heading: Restitution and the trespass offering
    plain: |
      The LORD said to Moses: If anyone sins and breaks faith with the LORD by lying to his neighbour about something left with him for safekeeping, or a pledge, or something taken by robbery, or by defrauding his neighbour; or if he has found something lost and lies about it and swears falsely, in any of the things people do that are sin: then, because he has sinned and is guilty, he must give back what he took by robbery or got by fraud, or what was left in his keeping, or the lost thing he found, or anything he swore falsely about.

      He is to repay it in full, add a fifth more, and give it to its owner on the day he brings his trespass offering. Then he is to bring the priest his trespass offering to the LORD: a ram without blemish from the flock, at the value you set. The priest will make atonement for him before the LORD, and he will be forgiven for whatever he did that made him guilty.
  - range: 8-13
    heading: The burnt offering and the altar fire
    plain: |
      The LORD said to Moses: Command Aaron and his sons: This is the law of the burnt offering. The burnt offering stays on the altar fire all night until morning, and the altar fire is kept burning.

      In the morning the priest puts on his linen garment, with the linen breeches next to his body. He takes up the ashes of the burnt offering that the fire has consumed and puts them beside the altar. Then he takes off those garments, puts on others, and carries the ashes outside the camp to a clean place.

      The fire on the altar must be kept burning and never put out. Every morning the priest adds wood, lays the burnt offering on it in order, and burns on it the fat of the peace offerings. The fire must burn on the altar continually; it must never go out.
  - range: 14-18
    heading: The priests' share of the grain offering
    plain: |
      This is the law of the meat (grain) offering. Aaron's sons offer it before the LORD, in front of the altar. The priest takes a handful of its flour and oil, with all the frankincense on it, and burns it on the altar as its memorial portion, a sweet savour to the LORD.

      Aaron and his sons eat the rest, unleavened, in a holy place: they eat it in the court of the tabernacle. It must not be baked with leaven. The LORD says: I have given it to them as their share of my offerings made by fire. It is most holy, like the sin offering and the trespass offering. Any male descendant of Aaron may eat it, as a statute for all generations. Whoever touches these offerings becomes holy.
  - range: 19-23
    heading: The high priest's own grain offering
    plain: |
      The LORD said to Moses: This is the offering that Aaron and his sons are to bring to the LORD on the day he is anointed: a tenth of an ephah of fine flour as a regular grain offering, half in the morning and half in the evening. It is made with oil on a griddle; when it is baked, bring it in, and offer it in pieces as a sweet savour to the LORD.

      The priest from among Aaron's sons who is anointed to succeed him is to offer it. It is a statute for ever: the whole of it is burned to the LORD. Every grain offering of a priest is to be burned whole; it is not to be eaten.
  - range: 24-30
    heading: The priests and the sin offering
    plain: |
      The LORD said to Moses: Tell Aaron and his sons: This is the law of the sin offering. It is killed before the LORD in the place where the burnt offering is killed; it is most holy. The priest who offers it for sin is to eat it in a holy place, in the court of the tabernacle.

      Whatever touches its flesh becomes holy. If any of its blood spatters on a garment, wash that garment in a holy place. The clay pot it was boiled in must be broken; if it was boiled in a bronze pot, the pot is to be scoured and rinsed with water. Any male among the priests may eat it; it is most holy.

      But no sin offering whose blood is brought into the tabernacle to make atonement in the holy place may be eaten. It is to be burned with fire.

notes:
  - ref: 2
    phrase: commit a trespass against the LORD
    kind: history
    title: Cheating a neighbour is a trespass against the LORD
    body: |
      Every wrong listed in verses 2–3 is done to a neighbour, yet the law first names it a trespass “against the LORD.” The Hebrew word is *maʿal*, an “unfaithful, treacherous act,” a breach of faith, used of faithlessness toward people and toward God.

      The two belong together because Israel's covenant was with God. Whether a man withheld what was due to God or deprived another person “of some just claim and right,” in either case “these sins were regarded as breaches of the covenant between Jehovah and His people, requiring compensation.”

      The wrongs here are deliberate: the man lies, deceives, and swears falsely. The law of Moses did not let every sin be atoned for by sacrifice: sins “committed with a high hand, and for which the punishment was death, did not admit of expiation.” Verses 2 and 6 are given as the example of another class, for which atonement could be made: “noncapital crimes (such as theft), after punishment had been endured.”
    sources: [oshb-wlc, bdb, bd-sacrifices]

  - ref: 2
    phrase: in fellowship
    kind: words
    title: A pledge, not fellowship
    body: |
      The King James “in fellowship” does not mean companionship. The Hebrew is *tesumet yad*, meaning a “deposit,” and with *yad* (“hand”) a “pledge; security”: something handed over as surety. A modern translation reads “in a matter of a deposit or a pledge.”

      So the verse lists four ways of keeping what is a neighbour's: denying a deposit left in one's care, denying a pledge, robbery, and fraud. Verse 3 adds a fifth, the lost thing found and denied.
    sources: [oshb-wlc, bdb, nrsvue]

  - ref: 5
    phrase: shall add the fifth part more thereto
    kind: history
    title: Restitution first, then the ram
    body: |
      Forgiveness here comes in a fixed order. The wrongdoer gives back what he took in full, adds a fifth of its value, and pays it to the owner “in the day of his trespass offering” ([[Lev. 6:5]]). Then he brings the ram, the priest makes atonement, and “it shall be forgiven him” ([[Lev. 6:7]]).

      The payment had two sides. The wrong was made good “(1) ethically, by the trespass offering (Lev. 5:15); (2) materially, by making restitution.” Forgiveness “was possible after repentance (Lev. 26:40–45) and after fulfilling the law of restitution,” which required restoring the wrong completely and “an additional 20 percent.” Numbers repeats the law and names the step before the payment: “they shall confess their sin which they have done: and he shall recompense his trespass with the principal thereof, and add unto it the fifth part thereof” ([[Num. 5:7]]).

      Which wrongs the trespass offering covered in general is debated: some limit it to “unintentional, inadvertent transgressions,” others see it as “atonement for intentional sins,” and some as a “fine” or “restitution.” The offering itself, and that question, are treated at [[Lev. 5:15–16]]; the wrongs in this chapter are plainly deliberate.
    sources: [bd-sacrifices, ot-manual-lev-1-10, lds-scriptures, lane-whole-meaning]

  - ref: 11
    phrase: he shall put off his garments, and put on other garments
    kind: symbol
    title: Changing clothes to carry out the ashes
    body: |
      The priest clears the ashes from the altar in his linen garments, then changes into other clothes before carrying them out of the camp, because the garments of the altar did not leave the sanctuary. They “were worn only at the altar and in the tabernacle. On going without the sacred precincts they were removed.”

      Ezekiel's vision of the restored temple gives the same rule with its reason. The priests “shall put off their garments wherein they ministered, and lay them in the holy chambers, and they shall put on other garments; and they shall not sanctify the people with their garments” ([[Ezek. 44:19]]). What was holy could make holy what it touched (see the note on verse 18), and the people were not to be touched by it.

      The “clean place” outside the camp is where the sin offering for the anointed priest and for the whole congregation was taken: “without the camp unto a clean place, where the ashes are poured out” ([[Lev. 4:12]]). The linen garments themselves are described at [[Ex. 28:39]] and [[Ex. 28:42]].
    sources: [cambridge-leviticus, lds-scriptures]

  - ref: 13
    phrase: it shall never go out
    kind: symbol
    title: A fire that never goes out
    body: |
      The altar fire was never allowed to die, and the chapter shows how it was kept. The burnt offering burned “all night unto the morning” ([[Lev. 6:9]]), and each morning the priest laid fresh wood on the fire and set the burnt offering on it ([[Lev. 6:12]]).

      The Hebrew ties the rule to the daily offering. The word for “ever” in “the fire shall ever be burning” is *tamid*, the word behind “continually” in the two lambs offered “day by day continually” ([[Ex. 29:38]]; see the note there). It is used of “regular repetition,” above all “of ritual,” and most often of the continual burnt offering of morning and evening ([[Ex. 29:42]]).

      The text gives no reason for the rule beyond the command. It has been read as a symbol: the first fire was kindled “by direct action of Jehovah,” the priest's keeping it alive symbolized “the continuation of the covenant which made the ordinance of sacrifice everlastingly valid,” and the fire itself “the cleansing power of the Holy Spirit, which is never extinguished.” These are readings, not the text's own words. The fire that came “from before the LORD” is treated at [[Lev. 9:24]], and the other fire Aaron's sons brought at [[Lev. 10:1]].
    sources: [lds-scriptures, oshb-wlc, bdb, ot-manual-lev-1-10]

  - ref: 18
    phrase: every one that toucheth them shall be holy
    kind: words
    title: Holiness that passes by touch
    body: |
      Whoever touches the most holy offerings becomes holy. The words do not limit who may touch them; they say what touching does. The person, “priest or layman, who inadvertently comes in contact with anything that is ‘most holy,’ becomes holy (i.e. dedicated to God, and put at His disposal).” The text gives no rule for what such a person must then do. One older reading draws a consequence: the layman “had to guard against defilement in the same manner as the sanctified priests … though without sharing the priestly rights and prerogatives.” The altar is described in the same words at [[Ex. 29:37]].

      Haggai shows one limit. Asked whether holy flesh carried in a garment makes holy the bread the garment brushes, the priests answer, “No” ([[Hag. 2:12]]): the garment that holds the holy thing does not pass its holiness on.

      Verses 27–28 apply the rule to things. Sin-offering blood spattered on a garment is washed out “in the holy place,” so that “the most holy blood might not be carried out of the sanctuary into common life.” The clay pot the flesh was boiled in is broken, because, unglazed, “it was absorbent,” while “a brazen pot could be scoured.” An unclean clay pot is broken too, “though for the very opposite reason”; that law is at [[Lev. 11:33]].
    sources: [cambridge-leviticus, keil-leviticus, lds-scriptures]

  - ref: 20
    phrase: in the day when he is anointed
    kind: history
    title: The high priest’s own grain offering
    body: |
      Verses 19–23 give an offering the high priest brings for himself: a tenth of an ephah of fine flour, half in the morning and half at night, burned whole. Two of its words seem to pull apart. It is brought “in the day when he is anointed,” yet it is “perpetual,” the same *tamid* as the fire of verse 13 and the daily burnt offering.

      One older reading counts the seven days of consecration together: “when the anointing was finished, the seven were designated as ‘the day,’” as in [[Gen. 2:4]]. From then on, the offering “continued to be offered … every morning and evening during the whole term of his office.” Jewish practice in the Second Temple was the same: “the high priest offered a minḥah every day during his tenure of office … at his own expense.” Most modern commentators, though, take the phrase as a later addition, at odds with “perpetual”; some who keep it read “in the day when” as “from the time that.”

      Unlike the people's grain offering, of which the priests ate all but a handful (verses 15–16), the priest's own offering is burned whole: “it shall not be eaten” ([[Lev. 6:23]]). The text gives the rule without a reason.
    sources: [keil-leviticus, cambridge-leviticus]

  - ref: 27
    phrase: thou shalt wash that whereon it was sprinkled in the holy place
    kind: scripture
    title: Garments washed in the holy place, and in His blood
    body: |
      The risen Savior's words to the Nephites in [[3 Ne. 27:19]] have been read as an allusion to this verse. Here, sacrificial blood that falls on a garment must be washed out in the holy place. There, nothing unclean enters the Father's rest “save it be those who have washed their garments in my blood, because of their faith, and the repentance of all their sins, and their faithfulness unto the end.”

      One Latter-day Saint study calls this “another instance of inverted quotation” and says it “appears to be a fulfilling allusion to Leviticus 6:27.” The link is that study's, offered tentatively; the two verses share the garment and the blood.
    sources: [ot-minute-lev, lds-scriptures]

  - ref: 30
    phrase: to reconcile withal in the holy place
    kind: history
    title: Eaten by the priests, or burned outside the camp
    body: |
      Most sin offerings were eaten by the officiating priest in the court (verse 26), but one kind was never eaten: a sin offering whose blood was carried into the tabernacle itself. These are the offerings for the anointed priest and for the whole congregation in chapter 4, whose bull is burned “without the camp” ([[Lev. 4:12]]; [[Lev. 4:21]]). Hebrews reads that burning of Christ ([[Heb. 13:11–12]]; see the note on [[Ex. 29:14]]).

      The reason the priests ate the others is given in chapter 10, in the same words, when Moses asks Aaron's sons why they did not: “seeing it is most holy, and God hath given it you to bear the iniquity of the congregation, to make atonement for them before the LORD” ([[Lev. 10:17]]). The story is told there.

      “Reconcile” is *kipper*, the verb rendered “make an atonement” in verse 7 (the word is explained at [[Ex. 25:17]]). Here its object is a place: the blood is brought in “to reconcile withal in the holy place.” One Jewish scholar cites this verse for the point that a whole room can be the object of the rite; in his reading the sin offering's blood “purges the most sacred objects and areas of the sanctuary on behalf of the person who caused their contamination by his physical impurity or inadvertent offense.” That is one scholar's reading, given more fully at [[Lev. 4:2]].
    sources: [lds-scriptures, oshb-wlc, milgrom-temple]

christ: |
  The chapter's clearest pointer to Christ is the name of its first offering. The trespass offering is the *ʾasham*, and that is the word behind “an offering for sin” in [[Isa. 53:10]], where the servant's soul is made the offering (see the note there). One Latter-day Saint study reads Isaiah's choice of this offering as meaning that the servant's soul “is made as an atonement for deliberate sins consciously committed”; which sins the offering covered is debated (see the note on verse 5), but the wrongs of verses 2–3 are of that kind.

  Hebrews sets the sin offering burned outside the camp beside Jesus, who “suffered without the gate” ([[Heb. 13:11–12]]; see the note on [[Ex. 29:14]]).

  How the whole law of sacrifice pointed to Christ, and why it ended with Him, is set out once, in chapter 1 (see [[Lev. 1:4]]), and in the volume guide's [section on sacrifice](/old-testament/guides/law-and-covenant/#sacrifice).

