chapter: 18
title: Not after the Doings of Egypt or Canaan
tagline: The Lord sets His statutes against the customs of the land Israel left and the land it is entering, forbids marriage and intercourse within the family and the unions and rites that defile, and warns that the land itself will cast out a people who do them.
when: 'At Sinai, in the second year after the Exodus'

setting: |
  Chapter 17 opened the part of Leviticus that scholars call the Holiness Code (chapters 17–26; see [[Lev. 17]]). Chapter 17 was about the altar and the blood; chapter 18 is about the family. Its words go to “the children of Israel” as a whole ([[Lev. 18:2]]), but its rules speak to a man, “thou”; only verse 23 also says what a woman must not do.

  The chapter has a twin. Leviticus 20 covers much of the same ground, and both chapters have “sexual offenses and other customs in neighboring nations as their theme,” with many of the same cases. They are presented differently: chapter 18 names no punishments, and chapter 20 adds them. The penalties belong to chapter 20 and are explained there.

  Later scripture takes up the chapter's promise that the one who keeps the statutes “shall live in them” ([[Lev. 18:5]]): Ezekiel repeats it and Paul quotes it.

thread: |
  The chapter opens and closes on the same words, “I am the LORD your God” ([[Lev. 18:2]]; [[Lev. 18:30]]), and they make what lies between a covenant obligation. The Lord speaks in the first person some nine times in the chapter: it is His statutes, His judgments, the land to which He is bringing them.

  Between the two refrains are three movements. Verses 1–5 set two ways of life side by side: the “doings” of Egypt behind Israel and of Canaan ahead, and the Lord's statutes, in which a man shall live. Verses 6–23 are the list. First come the women of a man's own family, by blood or by marriage (verses 6–18); then intercourse during a woman's impurity, adultery, the offering of children to Molech, intercourse between males, and with animals (verses 19–23). Unions like these “would wreak havoc upon the Israelites' individual families and the community as a whole.” Verses 24–30 give the reason in a picture: the nations before Israel defiled the land with these things, and the land vomited them out. It will do the same to Israel if Israel defiles it ([[Lev. 18:28]]).

sections:
  - range: 1-5
    heading: Not the ways of Egypt or Canaan
    plain: |
      The LORD told Moses to say to the children of Israel: I am the LORD your God. Do not live as they live in Egypt, where you lived, or as they live in Canaan, where I am bringing you; do not follow their statutes. Keep my judgments and my statutes and walk in them: I am the LORD your God. Keep my statutes and my judgments, for the man who does them will live by them: I am the LORD.
  - range: 6-18
    heading: Within the family
    plain: |
      None of you is to come near a close relative to have intercourse with her: I am the LORD.

      A man must not have intercourse with his mother; nor with his father's wife, for she is his father's wife; nor with his sister or half-sister, whether she grew up in his household or elsewhere; nor with his granddaughter, for she is of his own flesh; nor with the daughter his father had by another wife, for she is his sister. He must not have intercourse with his aunt, his father's sister or his mother's sister, for she is a close relative of his parent; nor with the wife of his father's brother, for she is his aunt. He must not have intercourse with his daughter-in-law, his son's wife, nor with his brother's wife, for she is his brother's wife. He must not have intercourse with a woman and her daughter, or take her granddaughter: they are her close relatives, and it is wickedness. And he must not take a woman's sister as a second wife, to vex her, while the first is alive.
  - range: 19-23
    heading: Other unions, and Molech
    plain: |
      Do not have intercourse with a woman while she is set apart in the impurity of her bleeding. Do not lie with your neighbor's wife and so defile yourself with her. Do not give any of your children to be passed through the fire to Molech, and do not profane the name of your God: I am the LORD. Do not lie with a male as one lies with a woman: it is an abomination. Do not lie with an animal and defile yourself with it, and a woman must not stand before an animal to lie with it: it is a perversion.
  - range: 24-30
    heading: The land that casts out its people
    plain: |
      Do not defile yourselves with any of these things. The nations I am driving out before you defiled themselves with all of them, and the land was defiled; so I visited its iniquity upon it, and the land vomited out its inhabitants. Keep my statutes and my judgments, and do none of these abominations, neither the native-born nor the stranger who lives among you. The people who were there before you did all of these, and the land was defiled. Do not defile it, or it will vomit you out too, as it vomited out the nations before you. Whoever does any of these abominations will be cut off from the people. So keep my charge, and do not follow any of these abominable customs that were practiced before you, or defile yourselves with them: I am the LORD your God.

notes:
  - ref: 3
    phrase: neither shall ye walk in their ordinances
    kind: history
    title: Their statutes and the Lord's
    body: |
      Verses 3–5 set two sets of statutes against each other, and in the Hebrew both are called by one word. The word behind “their ordinances” in verse 3 is *ḥuqqot*, “statutes,” the same word the King James renders “mine ordinances” in verse 4 and “my statutes” in verse 5. In verses 4–5 it stands at the center of a mirrored order: judgments, statutes; statutes, judgments. The law's words for rules are not reserved for God's: they “apply to rules of conduct said to be prescribed by God …, kings …, Canaanites (Leviticus 18:3), or even unjust judges.” Canaan had its statutes, and the law calls them by the same word as the Lord's. Israel is to walk in the Lord's.

      The text does not describe the “doings” of Egypt and Canaan beyond what the rest of the chapter forbids; verse 27 says only that “all these abominations have the men of the land done” ([[Lev. 18:27]]).
    sources: [oshb-wlc, sc-knowhy-568, bowen-law-codes, lds-scriptures]
  - ref: 5
    phrase: which if a man do, he shall live in them
    kind: scripture
    title: Life in the Lord's statutes
    body: |
      The chapter's one promise is life: the man who keeps the Lord's statutes “shall live in them” ([[Lev. 18:5]]).

      Later scripture takes the line up two ways. Ezekiel repeats it as the Lord's gift in the wilderness, “I gave them my statutes, and shewed them my judgments, which if a man do, he shall even live in them” ([[Ezek. 20:11]]), and then tells how Israel “walked not in my statutes” ([[Ezek. 20:13]]). Paul quotes it as the definition of one kind of righteousness: “Moses describeth the righteousness which is of the law, That the man which doeth those things shall live by them” ([[Rom. 10:5]]), and goes straight on to “the righteousness which is of faith” ([[Rom. 10:6]]). In Galatians he sets it against faith outright: “the law is not of faith: but, The man that doeth them shall live in them” ([[Gal. 3:12]]).
    sources: [lds-scriptures]
  - ref: 6
    phrase: near of kin to him, to uncover their nakedness
    kind: words
    title: Near of kin, and uncovering nakedness
    body: |
      In verses 6–19, “near of kin” names the relationship and “uncover … nakedness” names the act. To “uncover … nakedness” “was a Hebrew euphemism for sexual intercourse.” “Near of kin” is literally “flesh of his flesh,” which “is applied to a blood-relation.” The rule reaches beyond marriage: it “relates to both married and unmarried intercourse, though the reference is chiefly to the former.” The list reaches past blood relatives to those related by marriage, so that it covers “close relatives, by blood or by marriage.”

      The idiom also explains the odd wording of several verses. A stepmother's nakedness “is thy father's nakedness” ([[Lev. 18:8]]), and a brother's wife's “is thy brother's nakedness” ([[Lev. 18:16]]). In one older reading this follows from Genesis: “As husband and wife are one flesh (Genesis 2:24), the nakedness of the husband is uncovered in that of his wife.” To take her is to wrong him.
    sources: [ot-manual-lev-11-18, keil-leviticus, bowen-law-codes]
  - ref: 16
    phrase: Thou shalt not uncover the nakedness of thy brother’s wife
    kind: history
    title: A brother's wife
    body: |
      Verse 16 forbids a man his brother's wife, yet the law of levirate marriage required a man whose brother died childless to marry the widow: “her husband's brother shall go in unto her, and take her to him to wife” ([[Deut. 25:5]]). One older reading reconciles the two: the prohibition “only refers to cases in which the deceased brother had left children; for if he had died childless, the brother not only might, but was required to marry his sister-in-law.”

      The Church's footnote to the verse points to the Gospels. Herod the tetrarch had taken Herodias, “his brother Philip's wife,” and John the Baptist told him, “It is not lawful for thee to have her” ([[Matt. 14:3–4]]). It cost John his life.
    sources: [keil-leviticus, lds-scriptures]
  - ref: 18
    phrase: Neither shalt thou take a wife to her sister, to vex her
    kind: history
    title: Two sisters as wives
    body: |
      Verse 18 forbids a man to marry two sisters at once, and its reason is the sisters themselves: the second would be taken “to vex her.” The rule holds only “in her life time” ([[Lev. 18:18]]); the words “show that the law, as set down here, does not prohibit marriage with a deceased wife's sister.”

      Israel's own history had the example. Jacob married Leah and Rachel, and “Rachel envied her sister” ([[Gen. 30:1]]); the story fills [[Gen. 29:30–30:24]]. One older reading names him: such a marriage would “disturb the sisterly relation, as the marriage with two sisters that was forced upon Jacob had evidently done.” The same reading notes that “no punishment is fixed for the marriage with two sisters,” and chapter 20 does not repeat it.
    sources: [cambridge-leviticus, keil-leviticus, lds-scriptures]
  - ref: 21
    phrase: pass through the fire to Molech
    kind: history
    title: Molech
    body: |
      Verse 21 forbids giving a child to Molech and calls it profaning “the name of thy God” ([[Lev. 18:21]]). Molech was “the abomination of the children of Ammon, a fire god, worshipped by passing children through or burning them in fire.” What the rite was exactly is not certain. One Latter-day Saint study reads the Hebrew *MLK* as the name of a kind of offering rather than of a god: “so-called MLK offerings (often translated as “Molech” offerings)—that is, child sacrifices.” On either reading the law forbids giving a child to another god.

      Israel did not keep the law: Molech worship “was practiced by Solomon …; by the people of the Northern Kingdom …; and by Ahaz and Manasseh,” until Josiah defiled Topheth, “that no man might make his son or his daughter to pass through the fire to Molech” ([[2 Kgs. 23:10]]).

      A rule about worship stands among sexual sins, and a Latter-day Saint reading of the twin list in chapter 20, which opens with Molech, explains why: idolatry belongs there because “the unfaithfulness of idolatry was to the Hebrew mind a close cousin of adultery, especially since the covenant with the Lord was often represented as a marriage contract.” Chapter 20 gives the penalty (see [[Lev. 20:2]]).
    sources: [bd-molech, bowen-law-codes, ot-minute-lev, lds-scriptures]
  - ref: 22
    phrase: Thou shalt not lie with mankind, as with womankind
    kind: history
    title: What verse 22 forbids
    body: |
      Verse 22 forbids a man to lie with a male as with a woman, and calls it “abomination” ([[Lev. 18:22]]). The chapter then uses the same word of the whole list: “whosoever shall commit any of these abominations” ([[Lev. 18:29]]). Chapter 20 repeats the law with its penalty ([[Lev. 20:13]]).

      Today the law of chastity is stated this way: “Chastity means not having any sexual relations outside of a legal marriage between a man and a woman.”
    sources: [lds-scriptures, topics-chastity]
  - ref: 23
    phrase: it is confusion
    kind: words
    title: Confusion
    body: |
      The King James “confusion” renders *tebel*: “confusion, violation of nature, or the divine order.” The law uses the word once more, of a man who lies with his daughter-in-law ([[Lev. 20:12]]).
    sources: [bdb]
  - ref: 25
    phrase: the land itself vomiteth out her inhabitants
    kind: symbol
    title: The land that vomits
    body: |
      The land is pictured as a body that vomits out a people who defile it ([[Lev. 18:25]]), and the warning cuts both ways. The land that spued out the Canaanites will spue out Israel too, “when ye defile it” ([[Lev. 18:28]]), and the law holds for “any stranger that sojourneth among you” as for the native-born ([[Lev. 18:26]]). The Lord “declared the same penalty for the Israelites' failure to observe these commandments” as for the Canaanites before them.

      In the Church's reading, Nephi's account of the conquest belongs beside this chapter: “these very abominations of the Canaanites caused them to be cast out of the promised land.” Reminding his brothers how Israel took the land, Nephi asks whether the people driven out were righteous and answers, “Nay” ([[1 Ne. 17:33]]): “the Lord esteemeth all flesh in one; he that is righteous is favored of God. But behold, this people had rejected every word of God, and they were ripe in iniquity” ([[1 Ne. 17:35]]). Nephi names no particular sins; the tie to this chapter is the reading's.
    sources: [bowen-law-codes, ot-manual-lev-11-18, lds-scriptures]
  - ref: 29
    phrase: shall be cut off from among their people
    kind: scripture
    title: Cut off
    body: |
      To be “cut off” is the law's penalty for the whole list (see the note on [[Lev. 7:20]]). Who does the cutting off? In one study of chapter 20, “karet (cutting off) is a characteristically divine form of punishment,” set there beside the penalties the people carry out. Chapter 18 names no penalty for the people to carry out; those come in chapter 20.

      The risen Lord used the same words of the latter days: “whosoever will not repent and come unto my Beloved Son, them will I cut off from among my people, O house of Israel” ([[3 Ne. 21:20]]).
    sources: [burnside-lev-20, ot-minute-lev, lds-scriptures]

christ: |
  The chapter is framed by “I am the LORD your God,” and among the Nephites the risen Savior claimed that voice as His own: “I am he that gave the law, and I am he who covenanted with my people Israel; therefore, the law in me is fulfilled” ([[3 Ne. 15:5]]). The Church's footnote to the promise of verse 5, that a man “shall live” in the Lord's statutes, points to His words a few verses on: “I am the law, and the light. Look unto me, and endure to the end, and ye shall live” ([[3 Ne. 15:9]]).

