chapter: 25
title: The Sabbath of the Land and the Jubilee
tagline: Every seventh year the land rests, and every fiftieth year a ram's horn proclaims liberty, land goes back to its families and Israelites sold for debt go home, because the land and the people both belong to the LORD.
when: 'At Sinai, in the second year after the Exodus'

setting: |
  The chapter is dated by its place: “the LORD spake unto Moses in mount Sinai” ([[Lev. 25:1]]), and the holiness laws close on the same place, “in mount Sinai” ([[Lev. 26:46]]). Its laws look ahead to a land Israel did not yet have: “When ye come into the land which I give you” ([[Lev. 25:2]]).

  After the holy days and weeks of [[Lev. 23]], this chapter turns to holy years. “As was the seventh day in every week and the seventh month in every year, so also was every seventh year consecrated to the Lord.” The land sabbath is already in Exodus, and Leviticus adds a jubilee after seven of them (see the note on verse 2). The next chapter brings the sabbath years back as a warning: if Israel is scattered, the land will “enjoy her sabbaths” while it lies desolate ([[Lev. 26:34]]).

  Whether the laws were kept is a fair question. The sabbatical year “was habitually broken by the Jews for a long period before the Babylonian exile”; whether a jubilee was ever kept is taken up in the note on verse 10.

thread: |
  The chapter counts years the way [[Lev. 23]] counted days and weeks. Six years of work are followed by a seventh of rest for the land (verses 1–7); seven sabbaths of years are followed by a fiftieth, in which every man returns “unto his possession” and “unto his family” ([[Lev. 25:10]]). The rest of the chapter works out what that return means. Land is priced by the harvests left before the jubilee (verses 14–17), and it may be bought back by a kinsman or by the seller (verses 23–28); houses have rules of their own (verses 29–34). Then the law turns from land to people. A poor brother is to be helped and lent to without interest (verses 35–38), and a brother who sells himself serves as a hired man and goes free, whether his master is an Israelite (verses 39–46) or a stranger (verses 47–55).

  Twice the LORD gives the reason in the first person. Of the land: “the land is mine” ([[Lev. 25:23]]). Of the people: “they are my servants, which I brought forth out of the land of Egypt” ([[Lev. 25:42]]; again in verse 55). “I am the LORD your God” closes the laws on selling, on the poor and on servants (verses 17, 38, 55), and “fear thy God” comes with it (verses 17, 36, 43). Between the laws stands a promise to those who keep them: the land will yield, and they will “dwell therein in safety” ([[Lev. 25:19]]).

sections:
  - range: 1-7
    heading: The sabbath of the land
    plain: |
      The LORD spoke to Moses on Mount Sinai: “Tell the Israelites: when you come into the land I am giving you, the land itself shall keep a sabbath to the LORD. For six years sow your fields and prune your vineyards and gather their produce. But the seventh year shall be a sabbath of complete rest for the land, a sabbath to the LORD. Do not sow your field or prune your vineyard. Do not reap what grows by itself from the last harvest, and do not gather the grapes of your untended vine; it is a year of rest for the land. What the land yields in its sabbath shall be food for all of you: for you, your male and female servants, your hired worker, the stranger living with you, your livestock and the wild animals in your land.”
  - range: 8-12
    heading: The fiftieth year
    plain: |
      “Count seven sabbaths of years, seven times seven years, forty-nine years in all. Then on the tenth day of the seventh month, the Day of Atonement, sound the ram's horn throughout your land. Make the fiftieth year holy, and proclaim liberty throughout the land to all who live in it. It shall be a jubilee for you: each of you shall go back to his own property and to his own family. In that fiftieth year you shall not sow, or reap what grows by itself, or gather from the untended vines. It is the jubilee, holy to you; you shall eat what the field produces of itself.”
  - range: 13-17
    heading: Buying and selling by the years
    plain: |
      “In the jubilee year each of you shall go back to his property. When you sell to your neighbor or buy from him, do not cheat one another. Pay him according to the number of years since the jubilee, and he shall charge you according to the number of harvests left. The more years, the higher the price; the fewer years, the lower, because what he is selling you is a number of harvests. Do not cheat one another, but fear your God, for I am the LORD your God.”
  - range: 18-22
    heading: The promise of the harvest
    plain: |
      “Keep my statutes and my judgments, and you will live in the land in safety. The land will yield its fruit, you will eat your fill, and live there securely. And if you ask, ‘What shall we eat in the seventh year, if we may not sow or gather our crops?’ I will send my blessing on you in the sixth year, so that it yields enough for three years. You will sow in the eighth year and still eat from the old harvest until the ninth year's crop comes in.”
  - range: 23-28
    heading: The redemption of the land
    plain: |
      “The land must not be sold permanently, for the land is mine; you are strangers and sojourners with me. Throughout the land you hold, you must allow the land to be bought back. If your brother becomes poor and sells some of his property, his nearest kinsman shall come and buy back what his brother sold. If he has no one to buy it back, but later becomes able to do it himself, he shall count the years since the sale, repay the buyer for the years that remain, and go back to his property. If he cannot afford it, what he sold stays with the buyer until the jubilee; then it is released, and he goes back to his property.”
  - range: 29-34
    heading: Houses, and the Levites' cities
    plain: |
      “If a man sells a house in a walled city, he may buy it back within a full year of the sale. If it is not bought back within the year, the house in the walled city belongs permanently to the buyer and his descendants; it is not released in the jubilee. But houses in villages without walls count as open country: they may be bought back, and they are released in the jubilee. The Levites, however, may buy back their houses in the cities they hold at any time. If one of the Levites does not buy one back, the house he sold in a city they hold is released in the jubilee, for the houses in the Levites' cities are their possession among the Israelites. And the pastureland around their cities may not be sold, for it is their permanent possession.”
  - range: 35-38
    heading: The poor brother
    plain: |
      “If your brother becomes poor and cannot support himself beside you, help him, even if he is a stranger or a sojourner, so that he can go on living with you. Take no interest or profit from him, but fear your God, so that your brother may live with you. Do not lend him money at interest or sell him food at a profit. I am the LORD your God, who brought you out of Egypt to give you the land of Canaan and to be your God.”
  - range: 39-46
    heading: A brother sold to an Israelite
    plain: |
      “If your brother living beside you becomes poor and sells himself to you, do not make him work as a slave. He shall be with you as a hired worker or a sojourner and serve you until the jubilee. Then he and his children shall leave you and go back to his own family and to the property of his fathers. For they are my servants, whom I brought out of Egypt; they must not be sold as slaves are sold. Do not rule over him harshly, but fear your God. The male and female slaves you have shall come from the nations around you; from them you may buy slaves. You may also buy them from the children of the strangers living among you and from their families born in your land, and they shall be your property. You may leave them to your children after you as a permanent possession; they may be your slaves for life. But over your brothers the Israelites you shall not rule one another harshly.”
  - range: 47-55
    heading: A brother sold to a stranger
    plain: |
      “If a stranger or sojourner among you becomes rich, and your brother beside him becomes poor and sells himself to the stranger, or to a member of the stranger's family, he may be bought back after he is sold. One of his brothers may buy him back, or his uncle, or his uncle's son, or any close relative of his family; or, if he prospers, he may buy himself back. He and his buyer shall count from the year he was sold to the year of jubilee, and the price shall follow the number of years, at a hired worker's wage. If many years remain, he repays a larger part of his purchase price; if only a few remain before the jubilee, he reckons it and repays for those years. He shall be treated as a worker hired year by year, and his master must not rule him harshly before your eyes. If he is not bought back in any of these ways, he and his children go free in the year of jubilee. For the Israelites are my servants; they are my servants whom I brought out of Egypt. I am the LORD your God.”

notes:
  - ref: 2
    phrase: then shall the land keep a sabbath unto the LORD
    kind: history
    title: A sabbath for the land
    body: |
      In the seventh year the land itself kept a sabbath, and kept it “unto the LORD,” because the land was His: “The land, inasmuch as it was the Lord’s, was to keep a Sabbath unto Him.” For that year no one sowed or pruned (verse 4) or harvested as a crop what came up by itself (verse 5). What grew was food for everyone alike, owner and slave, hired man and stranger, “for thee, and for thy servant, and for thy maid, and for thy hired servant, and for thy stranger that sojourneth with thee” ([[Lev. 25:6]]), and for the cattle and the wild animals as well (verse 7).

      The year was not only a rest from work. It was meant to be “not simply a year of leisure but also one of religious instruction and exercises”: at the Feast of Tabernacles, when the sabbatical year began, “the whole law was read” to the people.

      Exodus gives the law first, briefly: the land lies still in the seventh year “that the poor of thy people may eat” ([[Ex. 23:11]]; see the note there). Leviticus keeps the same land sabbath and “extends the concept to include a jubilee year every seven Sabbath years (after forty-nine years).” What would happen to the land if the years were not kept is foretold at [[Lev. 26:34–35]].
    sources: [bd-sabbatical-year, bowen-law-codes, lds-scriptures]

  - ref: 9
    phrase: in the day of atonement shall ye make the trumpet sound
    kind: history
    title: The trumpet on the Day of Atonement
    body: |
      The jubilee began on the Day of Atonement: the horn was sounded “on the tenth day of the seventh month” ([[Lev. 25:9]]), the day whose rites are set out in [[Lev. 16:29–34]]. The year of release was announced on the day Israel was cleansed. In one Latter-day Saint reading, the jubilee “was to be inaugurated on the Day of Atonement of the fiftieth year,” and the trumpet is an image Latter-day Saints know, “a variation of which bestrides many of our temples, as a symbol of the proclamation or preaching of the gospel—true liberty—to every human being on both sides of the veil.”

      The chapter does not say why the two days fall together. One older reading, printed in the Church's Old Testament manual, draws the lesson from the order: forgiven on that day, “every Israelite was called upon to proclaim throughout the land … that he too had given the soil rest, that he had freed every encumbered family estate, and that he had given liberty to every slave,” for “Inasmuch as God has forgiven his debts, he also is to forgive his debtors.” That is a reading of the date; the text itself gives only the date.
    sources: [bowen-law-codes, ot-manual-lev-19-27, lds-scriptures]

  - ref: 10
    phrase: it shall be a jubilee unto you
    kind: words
    title: 'Jubilee: the year of the ram’s horn'
    body: |
      “Jubilee” sounds like jubilation, but the Hebrew *yobel* means a ram's horn, and the year is named for the horn that announced it. The word is first “ram, ram's horn, cornet,” and then the “designation of 50th year, marked by blowing of cornets”; the clause highlighted here reads, word for word, “a ram ('s horn blowing) shall it be to you.” The year “got its name from the fact that the beginning of the year was announced by the blowing of a trumpet on the Day of Atonement.”

      What the horn proclaimed was “liberty,” the Hebrew *deror* (see the note on [[Jer. 34:8]]). Land “that had changed hands, except in non-Levitical walled cities, reverted to the family to which it had belonged at the original settlement, and all bondmen of Israelite birth were set free.”

      Whether Israel ever kept a jubilee is not known: there is “no record in the Old Testament of the observance of any year of jubilee.” In one Latter-day Saint reading, “Since the Old Testament never explicitly mentions the observance of a Jubilee year, it is difficult to imagine what it would have looked like in practice,” yet “the central ideal of the Jubilee—liberation from bondage—was very important to ancient Israelites,” and the jubilee is “the likely source for the Book of Mormon’s liberty language” in [[Mosiah 29:32]] and [[Alma 46:17]].
    sources: [oshb-wlc, bdb, bd-jubilee-year-of, ot-minute-lev, lds-scriptures]

  - ref: 21
    phrase: it shall bring forth fruit for three years
    kind: history
    title: Fruit for three years
    body: |
      The sixth year's harvest had to last three years because the fallow year pushed the next harvest back: the land lay still in the seventh year, was sown in the eighth, and gave its next crop in the ninth (verse 22). The law raises the farmer's question itself, “What shall we eat the seventh year?” ([[Lev. 25:20]]), and answers with a blessing on the sixth.

      In one older reading the arithmetic of verses 21–22 shows that “not only the year of jubilee, but the sabbatical year also, commenced in the autumn, when they first began to sow for the coming year.” In a jubilee, then, “both sowing and reaping were omitted for two years in succession,” the forty-ninth year and the fiftieth, and the sixth year's crop had to feed the people “till the harvest of the ninth or fifty-first year.” On this count “once each fifty years the land would have a double rest,” since “The seventh sabbatical year (the forty-ninth year) was to be followed by a jubilee year.”

      The law asked for trust as much as for rest. It “illustrates the commitment of faith and trust in God that was required of one who truly followed the law”: once in seven years the Israelite “was to trust wholly in God rather than in the fruits of his own labor for sustenance.”
    sources: [keil-leviticus, ot-manual-lev-19-27, lds-scriptures]

  - ref: 23
    phrase: for the land is mine; for ye are strangers and sojourners with me
    kind: history
    title: The land belongs to the LORD
    body: |
      This verse gives the reason for the whole land law: Israel could not sell its land outright, because the land was never Israel's to sell. “The land shall not be sold for ever” ([[Lev. 25:23]]): the Hebrew *liṣmitut*, “for ever,” is a word of “completion, finality,” used “of alienation of land.” A sale ran only until the next jubilee, and verse 16 says what was really bought: “according to the number of the years of the fruits doth he sell unto thee” ([[Lev. 25:16]]). The buyer paid for harvests, not for the ground.

      In one Latter-day Saint reading, “The basis for all of the foregoing legislation is the truth that the land is ultimately Yahweh’s,” and the same reading compares [[Ps. 24:1]]. The sabbath of the land rests on the same claim (see the note on verse 2).

      Israel's own standing is given in two words, “strangers and sojourners,” the words Abraham used of himself at Hebron ([[Gen. 23:4]], where the note explains them). Israel would live on the land “with me,” as the LORD says, on ground that remained His.
    sources: [oshb-wlc, bdb, bowen-law-codes, lds-scriptures]

  - ref: 25
    phrase: if any of his kin come to redeem it
    kind: history
    title: The kinsman who buys it back
    body: |
      Land sold out of poverty could come back before the jubilee, and the duty of buying it back fell first on the family. The verb “redeem” is *gaʾal*, to “act as kinsman, do the part of next of kin,” and the one who comes is the *goʾel*, the kinsman (see the note on [[Ex. 6:6]], where the LORD uses the same verb of Himself). The chapter sets the order: a kinsman buys the land back (verse 25); failing one, the seller may buy it back himself, paying for the years that remain (verses 26–27); failing that, it returns to him at the jubilee (verse 28). A man who has sold himself may be bought back the same ways, by kin or by himself: “Either his uncle, or his uncle’s son, may redeem him” ([[Lev. 25:49]]), or any near kinsman, or he himself.

      Among the duties kin owed one another was “buying back (that is, redeeming) family land that had been sold due to poverty (Lev. 25:25–34) or family members who had been sold into slavery (Lev. 25:47–50).” English has no single word for it, and some translations coin one: “kinsman-redeemer.” Jeremiah buys his cousin's field because “the right of redemption is thine” ([[Jer. 32:7]]; see the note there), and in the book of Ruth ([[Ruth 4:1–10]]), when a nearer kinsman declines, Boaz “stepped in as the goʾel or kinsman-redeemer.”
    sources: [oshb-wlc, bdb, spackman-atonement, lds-scriptures]

  - ref: 29
    phrase: a dwelling house in a walled city
    kind: history
    title: Houses in walled cities
    body: |
      Unlike a field, a house in a walled city could be sold for good. The seller had a full year to buy it back (verse 29); after that it belonged to the buyer “for ever” and did not return in the jubilee (verse 30). Houses in unwalled villages went back with the fields (verse 31). The Levites could buy back their houses at any time, “for the houses of the cities of the Levites are their possession among the children of Israel” ([[Lev. 25:33]]).

      The text gives its reason only for the villages: their houses “shall be counted as the fields of the country” ([[Lev. 25:31]]). A village house went with the family's land; a house inside a city wall did not.
    sources: [lds-scriptures]

  - ref: 36
    phrase: Take thou no usury of him, or increase
    kind: words
    title: Usury and increase
    body: |
      The law forbids making a profit from a poor brother's need, whether on money or on food. “Usury” in biblical English “often means simply charging interest on a loan,” not only an excessive rate. The Hebrew words here are *neshek*, “interest, usury (literally something bitten off),” and *tarbit*, “increment, interest, usury”; verse 37 applies the ban to money lent and to food. The reason is the brother's life: “fear thy God; that thy brother may live with thee” ([[Lev. 25:36]]). The same law is at [[Ex. 22:25]] and [[Deut. 23:19–20]].

      The ban seems to have covered lending within the covenant people: “The restriction, however, seems to be when lending to a fellow church member,” and Deuteronomy allows interest from a foreigner, “Unto a stranger thou mayest lend upon usury” ([[Deut. 23:20]]). “Latter-day revelation does not contain restrictions against interest charges.”
    sources: [oshb-wlc, bdb, bd-usury, lds-scriptures]

  - ref: 39
    phrase: thou shalt not compel him to serve as a bondservant
    kind: history
    title: A brother, not a bondman
    body: |
      An Israelite who sold himself out of poverty was to be treated as a hired worker and set free at the jubilee; foreign slaves could be bought and held for life. The chapter says both plainly. The brother serves “as an hired servant, and as a sojourner” until the jubilee, and then goes home “both he and his children with him” to “the possession of his fathers” ([[Lev. 25:40–41]]). His master is not to “rule over him with rigour” ([[Lev. 25:43]]), and the Hebrew word, *perek*, is the one used of Egypt's treatment of Israel ([[Ex. 1:13–14]]). The reason is the Exodus: “they are my servants, which I brought forth out of the land of Egypt” ([[Lev. 25:42]]). In one older reading, because they were the LORD's servants they were “not to be sold into actual slavery, and no one of them was to rule over another with severity.” How this law stands beside the seventh-year release is at the note on [[Ex. 21:2]].

      Slaves bought from the nations around Israel, or from the families of strangers living in the land, were different: “they shall be your bondmen for ever” ([[Lev. 25:46]]). The same verse ends with the limit for Israel: “over your brethren the children of Israel, ye shall not rule one over another with rigour.”
    sources: [oshb-wlc, keil-leviticus, lds-scriptures]

christ: |
  At Nazareth, Jesus announced His mission with words drawn from the jubilee. Isaiah's anointed one is sent “to proclaim liberty to the captives” and “to proclaim the acceptable year of the LORD” ([[Isa. 61:1–2]]), a passage that “deals with imagery relating to the Jubilee year” (the note on [[Isa. 61:1]] has the Hebrew). Jesus read it in the synagogue and said, “This day is this scripture fulfilled in your ears” ([[Luke 4:21]]). In one Latter-day Saint reading, “The prophet Isaiah and Jesus himself alluded to the Jubilee year when they declared their missions.”

  The same reading calls the kinsman who buys back the land “another christological type.” To call God “redeemer,” in another Latter-day Saint study, “was to claim kinship through a covenant relationship with him.” Read that way, Lehi's word to Jacob, “thou art redeemed, because of the righteousness of thy Redeemer” ([[2 Ne. 2:3]]), says that “unlike human kinsman-redeemers who are not always reliable and faithful in carrying out covenantal obligations, God is righteous. Therefore, you, Jacob, are surely redeemed, bought back, repurchased.”

explore: |
  - **The release elsewhere in the law.** [[Ex. 21:2–6]]; [[Ex. 23:10–11]]; [[Deut. 15:1–18]].
  - **A kinsman who redeems.** [[Ruth 4:1–10]]; [[Jer. 32:6–15]].
  - **Liberty proclaimed and revoked.** [[Jer. 34:8–17]].
  - **The acceptable year of the Lord.** [[Isa. 61:1–2]] with [[Luke 4:16–21]].
  - **The land's sabbaths.** [[Lev. 26:34–35]]; [[2 Chr. 36:21]].

