chapter: 13
title: The Priest Shall Look
tagline: The priest examines a mark on the skin, waits a week, looks again, and declares the person clean or unclean; the one declared unclean mourns as for the dead and lives outside the camp. The same law reaches mildew in cloth and leather.
when: 'At Sinai, in the second year after the Exodus'

setting: |
  Chapter 13 begins the “laws relating to ceremonial uncleanness (Lev. 13–15)”, after the laws of clean and unclean animals (chapter 11) and of childbirth (chapter 12). What uncleanness was, and why it was a matter of ritual and not of morals, is explained at [[Lev. 11]] and in the volume guide's section on [clean and unclean](/old-testament/guides/law-and-covenant/#clean-unclean).

  This chapter is the law for recognizing “the plague of leprosy” in a person (verses 1–46) and in cloth and leather (verses 47–59). The Lord speaks to Moses and Aaron together (verse 1), and it is to Aaron and his sons that the person is brought (verse 2). Chapter 14 follows with the rites for the one who recovers and the law for a house ([[Lev. 14]]).

thread: |
  The chapter is built on three verbs that return in nearly every paragraph: the priest shall *look*, shall *shut up*, and shall *pronounce*. It works through the cases one at a time, and in each the tests are things a person can see: whether the hair in the mark has turned white, whether it looks deeper than the skin, whether it spreads, whether raw flesh shows. Where the signs are unclear, the answer is time: seven days, and sometimes seven more.

  Every case ends, sooner or later, in one of two words. “Clean” and the person washes his clothes; “unclean” and he goes out of the camp, dressed as a mourner, crying a warning (verses 45–46). The same verdicts are then given for cloth and leather (verses 47–59). Leviticus calls Israel to “a daily life of holy observance,” and this chapter carries that call to something as ordinary as the skin.

sections:
  - range: 1-8
    heading: A swelling or a spot
    plain: |
      The LORD spoke to Moses and Aaron. When someone has a swelling, a scab or a bright spot on the skin that looks like a mark of leprosy, he is to be brought to Aaron the priest or to one of his sons. The priest examines the mark. If the hair in it has turned white and it looks deeper than the skin, it is leprosy, and the priest declares him unclean.

      If the spot is white but does not look deeper than the skin, and its hair has not turned white, the priest isolates him for seven days. On the seventh day, if the mark has not changed or spread, he isolates him seven days more. If at the next examination it has grown dim and has not spread, the priest declares him clean: it is only a scab. He washes his clothes and is clean. But if the scab spreads after the priest has seen him, he comes back, and if the priest sees that it has spread, he declares him unclean: it is leprosy.
  - range: 9-17
    heading: Raw flesh, and a body turned white
    plain: |
      When someone has a mark of leprosy, he is brought to the priest. If there is a white swelling that has turned the hair white, with raw flesh in it, it is a long-standing leprosy: the priest declares him unclean at once and does not isolate him first.

      But if the leprosy breaks out over all the skin from head to foot, as far as the priest can see, and the whole body has turned white, the priest declares him clean. Whenever raw flesh appears, he is unclean: raw flesh is unclean; it is leprosy. If the raw flesh turns white again, he comes back to the priest, and if the mark has turned white, the priest declares him clean.
  - range: 18-28
    heading: A healed boil, and a burn
    plain: |
      If a boil has healed and a white swelling or a reddish-white spot appears where it was, the priest examines it. If it looks lower than the skin and its hair has turned white, it is leprosy broken out in the boil, and the person is unclean. If there are no white hairs in it, and it is not lower than the skin but has grown dim, the priest isolates him seven days. If it spreads, he is unclean; if it stays where it is and does not spread, it is only the scar of the boil, and he is clean.

      The same holds for a burn. A white or reddish-white spot in burned skin, with white hair in it and looking deeper than the skin, is leprosy broken out in the burn, and the person is unclean. If the hair is not white and the spot is not lower than the skin but has grown dim, he is isolated seven days; if by then it has spread, he is unclean, and if it has stayed in place and grown dim, it is the scar of the burn, and he is clean.
  - range: 29-37
    heading: A sore on the head or beard
    plain: |
      If a man or a woman has a sore on the head or the beard, and it looks deeper than the skin with thin yellow hair in it, it is a scall, a leprosy of the head or beard, and the person is unclean. If it is not deeper than the skin and there is no black hair in it, the person is isolated seven days. If on the seventh day it has not spread, has no yellow hair and is not deeper than the skin, he shaves, but not the scall itself, and is isolated seven days more. If then it has not spread and is not deeper than the skin, the priest declares him clean; he washes his clothes and is clean.

      If the scall spreads after that, he is unclean, and the priest need not look for yellow hair. But if it has stopped spreading and black hair has grown in it, it is healed: he is clean, and the priest declares him clean.
  - range: 38-44
    heading: Pale spots and baldness
    plain: |
      If a man or woman has white spots on the skin and they are a dull white, it is a pale spot that grows in the skin, and the person is clean. A man whose hair has fallen out, at the crown or at the forehead, is bald, and clean. But if a reddish-white sore appears on the bald head or forehead and looks like leprosy of the skin, he is a leper; the priest declares him unclean, for the mark is on his head.
  - range: 45-46
    heading: The leper outside the camp
    plain: |
      The leper who has the mark is to tear his clothes, let the hair of his head hang loose, cover his upper lip, and cry, “Unclean, unclean.” As long as the mark is on him he is unclean. He lives alone; his dwelling is outside the camp.
  - range: 47-59
    heading: Leprosy in cloth and leather
    plain: |
      A garment of wool or linen, in the warp or the woof, or leather or anything made of leather, may have the mark of leprosy. If the mark is greenish or reddish, it is shown to the priest, who puts the article away for seven days and looks again. If the mark has spread, it is a malignant leprosy: the article is unclean and is burned.

      If it has not spread, the priest has the article washed and puts it away seven days more. If after the washing the mark has not changed its color, even though it has not spread, it is unclean and is burned: it is eating into the material, on one side or the other. If the mark has grown dim after the washing, he tears that part out of the cloth or leather; if the mark appears again, it is spreading, and the article is burned. An article from which the mark is gone after washing is washed a second time and is clean. This is the law for the mark of leprosy in cloth and leather, to declare it clean or unclean.

notes:
  - ref: 2
    phrase: like the plague of leprosy
    kind: words
    title: What “leprosy” and “plague” mean here
    body: |
      “Leprosy” in Leviticus names a group of skin diseases that made a person ritually unclean, not the disease that bears the name today. The Hebrew word is *tsaraʿat*, and in the Old Testament it “refers to a variety of skin ailments, most of which are not to be associated with Hansen's disease.” Which diseases they were can only be guessed; one suggestion is that they “could have been psoriasis, scabies, favus, impetigo, and other skin infections that leave a specific mark or wound.”

      “Plague” does not mean an epidemic. The Hebrew *negaʿ* is a “stroke, plague, mark, plague-spot,” used here “of leprosy, regarded as the heavy touch or stroke of a disease.” In this chapter it is the mark on the skin that the priest examines (verse 3), and the word also stands for the person who has it (verse 4, “him that hath the plague”).

      Was the disease a punishment? Elsewhere in scripture particular cases were: of Moses' hand, Miriam, Naaman and King Uzziah, “in these cases leprosy was given as a sign, a warning, or a punishment.” This chapter says nothing about a cause; it asks only what the priest can see.
    sources: [sc-leprosy, bd-leprosy, bdb]
  - ref: 3
    phrase: the priest shall look on him, and pronounce him unclean
    kind: history
    title: The priest examines and declares; he does not heal
    body: |
      The priest's work in this chapter is to examine and to declare a verdict, and the law gives him no treatment to prescribe. He looks for two signs: hair in the mark turned white, and a mark that looks “deeper than the skin” (verse 3). When neither is clear, he “shall shut up him that hath the plague seven days” (verse 4; another rendering is “shall quarantine”), and if nothing has changed, seven days more, to see whether the mark spreads (verses 5–6). Then he pronounces the person clean or unclean.

      What the verdict settled was first of all the person's standing before the Lord: under the law, “the ritual uncleanness was, from the biblical perspective, more important than potential contagiousness.” So Naaman, who was not an Israelite, could hold a high office in the army though he was a leper. Later law repeats that the priests decide: “Take heed in the plague of leprosy, … and do according to all that the priests the Levites shall teach you” ([[Deut. 24:8]]).
    sources: [sc-leprosy, lds-scriptures]
  - ref: 13
    phrase: 'it is all turned white: he is clean'
    kind: history
    title: Why a body turned white all over is clean
    body: |
      The chapter's strangest ruling is that a person covered with the disease “from his head even to his foot” is clean (verses 12–13), while one patch of raw flesh makes him unclean again (verses 14–15). The text gives no reason, and the explanations are older readings, not certainties.

      One older reading takes the complete whitening as the turning point of the disease: “The breaking out of the leprous matter in this complete and rapid way upon the surface of the whole body was the crisis of the disease; the diseased matter turned into a scurf, which died away and then fell off.” Another older commentary suggests that a different, harmless condition is meant: “A form of skin disease which is not infectious seems to be here indicated. A white efflorescence spreads over the whole body, which after a time peels off, and the skin resumes a healthy appearance.” Whatever the condition, the text itself makes raw flesh the sign that decides: when it appears the person is unclean, and when it turns white again he is clean (verses 14–17). The “quick raw flesh” of verse 10 is, in the first older reading's gloss, “living, i.e., raw, proud flesh.”
    sources: [keil-leviticus, cambridge-leviticus]
  - ref: 45
    phrase: 'shall cry, Unclean, unclean'
    kind: symbol
    title: The leper dressed as a mourner
    body: |
      The leper's torn clothes, loose hair and covered lip are the signs of mourning. “The actions of the leper here prescribed are those of a mourner”: rending the garments and letting the hair go loose, which the anointed priests were forbidden at the death of Nadab and Abihu ([[Lev. 10:6]]; see the note there), and covering the upper lip, which Ezekiel was told not to do when his wife died (see the note on [[Ezek. 24:17]]). In one older reading, “the leper was regarded as one dead”; Aaron's plea for Miriam when she was struck with leprosy uses the same picture: “Let her not be as one dead” ([[Num. 12:12]]).

      The cry was a warning to others. In another older reading the leper cried “Unclean, unclean” so “that every one might avoid them for fear of being defiled”; the same cry is heard in Lamentations: “Depart ye; it is unclean; depart, depart, touch not” ([[Lam. 4:15]]).
    sources: [cambridge-leviticus, keil-leviticus, lds-scriptures]
  - ref: 46
    phrase: without the camp shall his habitation be
    kind: history
    title: Why the leper lived outside the camp
    body: |
      The leper lived outside the camp because the camp was where the Lord dwelt. The text in Numbers gives the reason: Israel was to put lepers “without the camp … that they defile not their camps, in the midst whereof I dwell” ([[Num. 5:3]]).

      The exclusion lasted “all the days wherein the plague shall be in him” (verse 46), no longer; after the cleansing rite of chapter 14, “he shall come into the camp” ([[Lev. 14:8]]). Scripture shows the rule kept: Azariah king of Judah “was a leper unto the day of his death, and dwelt in a several house” ([[2 Kgs. 15:5]]).

      The theme page [Them That Come Nigh Me](/leviticus/themes/them-that-come-nigh-me/) follows the camp's edge, the fire and the veil as the book's answers to who may come near.
    sources: [lds-scriptures]
  - ref: 47
    phrase: The garment also that the plague of leprosy is in
    kind: history
    title: Leprosy in cloth and leather
    body: |
      A garment was called leprous when mildew or mold appeared in it, and the law handled it as it handled a mark on the skin: clothing and walls “were said to be leprous when they had patches of mildew or some fungous growth.” Under the law, “buildings and cloth could also contract ṣa‘arat and its attendant ritual impurity”: the concern was again uncleanness. The procedure follows the one for people: a look, seven days' wait and a second look (verses 49–58).
    sources: [bd-leprosy, sc-leprosy]

christ: |
  The law could look, wait and pronounce, and it put the unclean person outside the camp until the disease was gone; it gave the priest no cure. The Gospels record Jesus healing lepers. To one who knelt before Him, Jesus, “moved with compassion, put forth his hand, and touched him, and saith unto him, I will; be thou clean” ([[Mark 1:41]]): He touched a man whom the law of this chapter kept at a distance (verse 46). The ten lepers who “stood afar off” He sent to the priests, as this chapter sends a mark to be “shewed unto the priest” (verse 49): “Go shew yourselves unto the priests,” and “as they went, they were cleansed” ([[Luke 17:12–14]]); the Church's footnote at [[Lev. 13:49]] points to that verse. What He told the healed leper to offer “for a testimony unto them” ([[Mark 1:44]]) belongs to chapter 14 ([[Lev. 14]]).

