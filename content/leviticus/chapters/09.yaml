chapter: 9
title: The Glory and the Fire
tagline: 'On the day after their consecration Aaron and his sons begin their service. Aaron offers for himself and then for the people, blesses them, and the LORD keeps His promise to appear: His glory is seen by all, and fire from before Him consumes the offerings on the altar.'
when: 'At Sinai, in the second year after the Exodus, on the day after the seven days of the priests’ consecration (Lev. 8:33).'

setting: |
  Chapter 8 ended with Aaron and his sons kept at the door of the tabernacle for seven days and nights, “that ye die not” ([[Lev. 8:35]]), while Moses carried out on them the consecration commanded in Exodus 29 (the washing, robing and anointing are explained at [[Ex. 29:4]] and the verses after). Chapter 9 is the next day. For the first time Aaron, not Moses, stands at the altar.

  Chapters 8–10 tell of “the inauguration of the priestly administration”; the laws of the offerings in chapters 1–7 had already assumed priests at work, and here their work begins. This chapter has been called the record of the day “when the entire worship system commenced operation.”

  The LORD had already come to the tent: when it was set up, “the glory of the LORD filled the tabernacle” ([[Ex. 40:34]]). What He promises now is to be seen by the whole people at the altar outside it: “to day the LORD will appear unto you” (verse 4). The chapter ends with the promise kept, in fire.

  Two passages of the next chapter follow straight from this one. Aaron's sons Nadab and Abihu offer a fire the LORD “commanded them not” ([[Lev. 10:1]]), and Moses' anger over the people's sin offering ([[Lev. 10:16–20]]) turns on what was done with it here, in verse 15.

thread: |
  The chapter moves from command to fulfillment, and the promise is its hinge. Verses 1–6 give the order, offerings from Aaron and from the people, and the reason: “the glory of the LORD shall appear unto you” (verse 6). Verses 7–21 carry it out, Aaron's offerings first and then the people's, “as the LORD commanded” (verses 7, 10). Verses 22–24 are the answer: a blessing, the glory, and the fire.

  Both sets of offerings come in the same order: the sin offering, then the burnt offering, and then (for the people) the meat offering and the peace offerings. One older reading explains the order. The sin offering went first because it “served to remove the estrangement of man from the holy God arising from sin”; the burnt offering followed “as an expression of the complete surrender of the person expiated to the Lord”; and the peace offering came last, “as a seal of covenant fellowship with the Lord in the sacrificial meal.” The offerings themselves are explained where the law gives them ([[Lev. 1:3]]; [[Lev. 2:1]]; [[Lev. 3:1]]; [[Lev. 4:2]]).

  One study reads the end of the chapter as Sinai again. When the covenant was made, Israel offered peace offerings and its elders saw the God of Israel ([[Ex. 24:5–11]]); here “all elements of Exodus 24.1-11 are repeated”: the LORD appears to the people, the priests offer sacrifices and peace offerings, and Aaron blesses the people. On that reading the offerings of the law were there “to maintain and celebrate covenant relationship.”

sections:
  - range: 1-6
    heading: The command for the eighth day
    plain: |
      On the eighth day Moses called Aaron, his sons and the elders of Israel. He told Aaron, “Take a young calf for a sin offering and a ram for a burnt offering, both without blemish, and offer them before the LORD. And tell the children of Israel: Take a young male goat for a sin offering; a calf and a lamb, each a year old and without blemish, for a burnt offering; a bull and a ram for peace offerings, to sacrifice before the LORD; and a grain offering mixed with oil. For today the LORD will appear to you.”

      They brought what Moses commanded to the front of the tabernacle, and the whole congregation came near and stood before the LORD. Moses said, “This is what the LORD has commanded you to do, and the glory of the LORD will appear to you.”
  - range: 7-14
    heading: Aaron's own offerings
    plain: |
      Moses said to Aaron, “Go to the altar and offer your sin offering and your burnt offering, and make atonement for yourself and for the people. Then offer the people's offering and make atonement for them, as the LORD commanded.”

      So Aaron went to the altar and killed the calf of the sin offering, the one for himself. His sons brought him the blood; he dipped his finger in it, put it on the horns of the altar, and poured out the rest at the base of the altar. The fat, the kidneys and the lobe above the liver he burned on the altar, as the LORD had commanded Moses; the flesh and the hide he burned outside the camp.

      Then he killed the burnt offering. His sons handed him the blood, and he splashed it on all sides of the altar. They handed him the burnt offering piece by piece, with the head, and he burned them on the altar. He washed the inner parts and the legs and burned them on top of the burnt offering on the altar.
  - range: 15-21
    heading: The people's offerings
    plain: |
      Next he brought the people's offering. He took the goat of the people's sin offering, killed it, and offered it for sin as he had the first. He brought the burnt offering and offered it in the prescribed way. He brought the grain offering, took a handful of it, and burned it on the altar, besides the morning's burnt offering.

      He also killed the bull and the ram as the people's peace offerings. His sons handed him the blood, and he splashed it on all sides of the altar. The fat of the bull and of the ram, the fat tail, the fat covering the inner parts, the kidneys and the lobe above the liver, they laid on the breasts, and he burned the fat on the altar. The breasts and the right thigh Aaron waved as a wave offering before the LORD, as Moses commanded.
  - range: 22-24
    heading: The blessing, the glory, and the fire
    plain: |
      Aaron raised his hands toward the people and blessed them, and came down from offering the sin offering, the burnt offering and the peace offerings. Moses and Aaron went into the tabernacle, came out, and blessed the people, and the glory of the LORD appeared to all the people. Fire came out from before the LORD and consumed the burnt offering and the fat on the altar. When all the people saw it, they shouted, most likely for joy, and fell on their faces.

notes:
  - ref: 1
    phrase: on the eighth day
    kind: history
    title: The day after the seven days
    body: |
      The eighth day is the first day of the priests' service, the day after the seven days of their consecration. Through those days Aaron and his sons had stayed at the door of the tabernacle, “for seven days shall he consecrate you” ([[Lev. 8:33]]); on the eighth Moses calls them, with the elders, to begin. In chapter 8 Moses performed the rites on Aaron. From verse 7 of this chapter Aaron performs them himself, and Moses only gives the word.
    sources: [lds-scriptures]

  - ref: 8
    phrase: the calf of the sin offering, which was for himself
    kind: history
    title: Aaron’s sin offering for himself
    body: |
      Aaron's first act as a priest is a sin offering for himself, though he has just been washed, anointed and consecrated for seven days. The text gives no reason beyond the command (verse 7). One older reading takes the point to be that even after all that, “the offerings of the law could not ensure perfection,” as Hebrews says of the law's sacrifices, which “can never … make the comers thereunto perfect” ([[Heb. 10:1]]). The same reading explains why Aaron's own offering makes atonement “for the people” too (verse 7): when the anointed priest sinned, it was “according to the sin of the people” ([[Lev. 4:3]]), and his offering took away “the guilt which the high priest, as the head of the whole congregation, had brought upon the nation.” The Greek Septuagint reads “for thy house” instead of “for the people,” the words used of the high priest's own offering on the Day of Atonement ([[Lev. 16:11]]).

      The animal is a calf, where chapter 4 asks a young bullock of a priest who sins. “Only here is a calf appointed for a Sin-Offering.” A Jewish tradition, kept in an Aramaic paraphrase of the Bible (a Targum), held that it was “to remind Aaron of his sin in making the golden calf.” The calf of gold is at [[Ex. 32:4]]. That is tradition; the text gives no reason.

      What was done with the calf follows chapter 4 with one difference: its blood was not carried into the tent but put on the horns of the altar in the court (verse 9). Its flesh and hide were burned outside the camp (verse 11), “as in the case of all the sin-offerings for the priesthood”; the rule is at [[Lev. 4:11–12]]. The people's goat was then offered “as the first” (verse 15), which one older reading takes to mean that it too was burned whole, though its blood had not gone into the holy place either. That is what Moses questions in the next chapter: since “the blood of it was not brought in within the holy place,” he says, “ye should indeed have eaten it in the holy place” ([[Lev. 10:18]]).
    sources: [keil-leviticus, cambridge-leviticus, lxx-rahlfs, lds-scriptures]

  - ref: 22
    phrase: Aaron lifted up his hand toward the people, and blessed them
    kind: history
    title: Aaron blesses the people
    body: |
      Aaron's last act at the altar is to bless the people with raised hands. The Hebrew is written “his hand” but marked to be read “his hands” (a *qere*, the scribes' reading, set beside the *ketiv*, what is written); the King James follows the written form, and the plain words above follow the reading.

      His words are not given. The law later gives Aaron and his sons a blessing to speak over Israel, beginning “The LORD bless thee, and keep thee” ([[Num. 6:24]]) and ending with the LORD's own promise, “and I will bless them” ([[Num. 6:27]]). One study suggests that what Aaron said here was “perhaps similar in content to the blessings defined in Leviticus 26.4-13,” the covenant's promises of rain, harvest and peace in the land ([[Lev. 26:4–6]]).

      He blesses a second time in the next verse, with Moses, when the two come out of the tent, and the glory appears.
    sources: [oshb-wlc, morales-tabernacle, lds-scriptures]

  - ref: 23
    phrase: the glory of the LORD appeared unto all the people
    kind: symbol
    title: The glory seen by all
    body: |
      The glory that filled the tent so that even Moses could not go in ([[Ex. 40:35]]) is now seen by the whole congregation, as they had been told twice it would be (verses 4 and 6). In the Hebrew Bible this glory is “clearly equated with fire, light or brightness,” though the Hebrew word, *kavod*, “normally denotes heaviness.” The passages that show it include this one and Sinai, where “the sight of the glory of the LORD was like devouring fire on the top of the mount in the eyes of the children of Israel” ([[Ex. 24:17]]). The text does not describe what the people saw here. It says what came from it: the fire of the next verse.

      Why Moses and Aaron first went into the tent is not said. At Sinai Moses waited for the LORD to call him into the cloud, and one study holds that at the tabernacle the call “probably occurs in Leviticus (either 1.1 or 9.23)”; the same study records the suggestion that “here Moses’ role gives way to the priestly role of Aaron.” Both are readings. On why Moses could not enter at first, see [[Ex. 40:35]].
    sources: [muhlestein-theophanies, oshb-wlc, morales-tabernacle, lds-scriptures]

  - ref: 24
    phrase: there came a fire out from before the LORD
    kind: history
    title: The fire from before the LORD
    body: |
      The fire is the LORD's answer to the first offerings of the consecrated priests, the sign that He accepted them and their service. It came “from before the LORD,” from where He had shown Himself; one older reading pictures it breaking out of the glory “in the form of lightning,” and notes that it “did not come down from heaven,” as the fire did at David's altar and Solomon's temple ([[1 Chr. 21:26]]; [[2 Chr. 7:1]]). Scripture records “similar manifestations of approval”: for Gideon at [[Judg. 6:21]], and for Elijah on Carmel at [[1 Kgs. 18:38]].

      The fire did not light the altar. Aaron had already burned the fat, the pieces and the handful of grain (verses 10, 13, 17, 20), and fire was already on the altar. In the same reading, the miracle was that “the sacrifices, which were already on fire, were suddenly consumed,” and its purpose was “to give a divine consecration to the altar, or sacrificial service of Aaron and his sons.” The fire on the altar was never to go out ([[Lev. 6:13]], where the keeping of it is treated).

      The same words return in the next chapter. The five Hebrew words the King James gives here as “there came a fire out from before the LORD, and consumed” ([[Lev. 9:24]]) open [[Lev. 10:2]] as well, where it renders them “there went out fire from the LORD, and devoured them.” The fire that took Aaron's offering took his sons Nadab and Abihu, who had offered a fire the LORD had not commanded (see [[Lev. 10:1]]). One study puts the other side of it: “Because of the cultic remedy for sin, ‘the fire that dwells in their midst’ does not consume Israel.”
    sources: [keil-leviticus, cambridge-leviticus, oshb-wlc, morales-tabernacle, lds-scriptures]

  - ref: 24
    phrase: they shouted, and fell on their faces
    kind: words
    title: A shout of joy
    body: |
      The people's shout was most likely a cry of joy. The Hebrew verb is *ranan*, “to shout (usually for joy),” which the King James elsewhere renders “sing,” “rejoice” and “shout for joy.” In this verse the shout and the falling on the face stand side by side.
    sources: [oshb-wlc, bdb]

christ: |
  The LORD who appeared in the glory and the fire is Jehovah, the premortal Christ (see [[Ex. 3:14]]). Risen, He invited the Nephites to touch the prints of the nails, “that ye may know that I am the God of Israel, and the God of the whole earth, and have been slain for the sins of the world” ([[3 Ne. 11:14]]).

  Aaron began his service in the order this chapter gives, first for himself and then for the people (verse 7). Hebrews names that order to set Christ apart from it: He is the high priest “who needeth not daily, as those high priests, to offer up sacrifice, first for his own sins, and then for the people's: for this he did once, when he offered up himself” ([[Heb. 7:27]]). The anointed priest's own offering is treated at [[Lev. 4:3]].

  One gesture is shared in wording. Aaron “lifted up his hand toward the people, and blessed them” (verse 22); at the end of Luke's Gospel the risen Lord led His disciples out to Bethany, “and he lifted up his hands, and blessed them” ([[Luke 24:50]]). The likeness is in the words only, and nothing is drawn from it here.

