chapter: 2
title: The Meat Offering
tagline: The LORD tells Moses how an offering of grain is brought, as fine flour, as baked bread, or as new grain roasted in the ear. A handful goes up on the altar with all the frankincense; the rest is most holy food for the priests. No leaven or honey may be burned, and every offering must have salt.
when: 'At Sinai, in the second year after the Exodus (Ex. 40:17; Lev. 7:38).'

setting: |
  Chapter 2 continues the instructions the LORD gives Moses from the tent just raised (on that voice, and on who wrote the book, see chapter 1, [[Lev. 1:1]]). Leviticus 1–7 set out “the rules regarding the sacrifices offered in the Court of the Altar,” and after the burnt offering of chapter 1 comes the offering of grain.

  The grain offering could not be offered with a sin offering, “but no burnt or peace offering was complete without it”: whoever brought an animal for a burnt offering or a vow brought flour mingled with oil beside it ([[Num. 15:3–4]]). It was so much a part of the daily sacrifice that its name could stand for “the whole morning or evening sacrifice.” The flour and oil of that daily offering were commanded at [[Ex. 29:40]].

  This chapter treats it as a gift in its own right, brought “when any will offer.” It came from the field and the kitchen: raw flour, bread from the oven or the pan, or the first grain of the harvest.

  The same offering is given again from the priests' side, with what they do with it and how they eat it, at [[Lev. 6:14–23]].

thread: |
  The chapter tells how ordinary food is given to God. The gift comes in three forms: flour (verses 1–3), bread baked three ways (verses 4–10), and new grain roasted in the ear (verses 14–16). Each time a portion, the “memorial,” is burned on the altar: from the flour a handful with all the frankincense, from the roasted grain part of it with all the frankincense. Of the flour and the bread the text adds that the rest belongs to Aaron and his sons as “a thing most holy.” Between the forms stand two rules for every offering: nothing with leaven or honey may be burned on the altar, and nothing may be offered without salt, “the salt of the covenant of thy God” (verses 11–13).

  What is given is bread, the staple of every household. In one older reading there can be “no doubt that in them the Israelite offered his daily bread to the Lord.” The text marks what happens to it with two phrases it repeats: the part that goes up is “of a sweet savour unto the LORD” (verses 2 and 9), and the part that stays below is “most holy” (verses 3 and 10).

sections:
  - range: 1-3
    heading: Fine flour, oil and frankincense
    plain: |
      When anyone brings the LORD a grain offering, it is to be of fine flour. He is to pour oil on it and put frankincense on it, and bring it to Aaron's sons the priests. The priest takes a handful of the flour and the oil, with all the frankincense, and burns this memorial portion on the altar, an offering made by fire, a pleasing fragrance to the LORD. The rest of the grain offering belongs to Aaron and his sons. It is most holy, part of the LORD's offerings made by fire.
  - range: 4-10
    heading: Bread from the oven and the pan
    plain: |
      If you bring a grain offering baked in an oven, it is to be unleavened cakes of fine flour mixed with oil, or unleavened wafers spread with oil. If your offering is baked in a pan, it is to be of fine flour, unleavened, mixed with oil; break it in pieces and pour oil on it. It is a grain offering. If your offering is cooked in a frying pan, it is to be made of fine flour with oil.

      Bring the grain offering made of these things to the LORD. When it is presented to the priest, he brings it to the altar, takes the memorial portion from it, and burns it on the altar, an offering made by fire, a pleasing fragrance to the LORD. What is left belongs to Aaron and his sons. It is most holy, part of the LORD's offerings made by fire.
  - range: 11-13
    heading: No leaven or honey, and always salt
    plain: |
      No grain offering you bring to the LORD is to be made with leaven, for you are to burn no leaven and no honey in any offering made by fire to the LORD. As for an offering of firstfruits, you are to offer them to the LORD, but they are not to be burned on the altar as a pleasing fragrance. Season every grain offering with salt. Do not leave the salt of the covenant of your God out of your grain offering; with all your offerings you are to offer salt.
  - range: 14-16
    heading: The firstfruits, roasted in the ear
    plain: |
      If you bring the LORD a grain offering of your firstfruits, bring fresh ears of grain roasted in the fire, the grain crushed from full ears. Put oil on it and lay frankincense on it: it is a grain offering. The priest burns its memorial portion, part of the crushed grain and part of the oil, with all the frankincense. It is an offering made by fire to the LORD.

notes:
  - ref: 1
    phrase: a meat offering
    kind: words
    title: A meat offering of flour
    body: |
      The “meat offering” has no meat in it: it is an offering of grain, and “meat” here is used in its “older sense” of food. The King James rendering is “misleading”; in this chapter the word means “grain-offering.”

      The Hebrew word, *minḥah*, means first a “gift” or “tribute.” It is the present Jacob sent down to the lord of Egypt ([[Gen. 43:11]]) and the present Israel sent to Eglon king of Moab ([[Judg. 3:15]]), a present that was tribute. Offered to God it could be an offering “of any kind, whether grain or animals”: the offerings of Cain and of Abel are both called by it ([[Gen. 4:3–4]], where the note takes up why one was refused). In the laws of the offerings it always has the narrow sense.
    sources: [bd-meat-offering, oshb-wlc, bdb, bd-sacrifices]

  - ref: 1
    phrase: pour oil upon it, and put frankincense thereon
    kind: symbol
    title: Oil and frankincense
    body: |
      Oil and frankincense were added to the flour, and the chapter handles them differently. The oil goes with the flour, and only a handful of that is burned; the frankincense goes on the altar whole (verses 2 and 16). Frankincense is “the fragrant resinous exudation of various species of Boswellia,” brought from Arabia, and one of the ingredients of the holy incense ([[Ex. 30:34]]).

      The text says what was done, not what it meant. One reading takes the three together: oil for the Holy Ghost ([[D&C 45:56–57]]), grain for the word of God ([[Mark 4:14]]), frankincense for prayer ([[Rev. 8:3]]). “As man was meant to live physically by eating bread, so too was he meant to live spiritually in Christ by partaking of the word and Spirit of the Lord through prayer.”

      Another reading starts from the verb. When Book of Mormon writers speak of pouring out the whole soul to God ([[Enos 1:9]]; [[Mosiah 26:14]]), the idiom “makes sense when understood in light of the grain offering,” in which the worshipper poured oil on the flour.
    sources: [bd-frankincense, ot-manual-lev-1-10, sc-knowhy-467]

  - ref: 2
    phrase: the memorial of it
    kind: words
    title: 'The memorial: the part that goes up'
    body: |
      The “memorial” is the handful of the offering that the priest burns on the altar. Its Hebrew name, *ʾazkarah*, comes from *zakar*, “remember,” and means “a reminder,” though the text does not say who is reminded, or of what. The word is used for the burned part of a grain offering (verses 2, 9 and 16), for the handful of flour a very poor man brought as a sin offering ([[Lev. 5:12]]), and for the frankincense set on the shewbread ([[Lev. 24:7]]).

      That poor man's flour is not itself a meat offering: “he shall put no oil upon it, neither shall he put any frankincense thereon: for it is a sin offering” ([[Lev. 5:11]]). The fragrance it gave, “a sweet savour unto the LORD,” is explained at [[Lev. 1:9]].
    sources: [oshb-wlc, bdb, strongs-concordance]

  - ref: 3
    phrase: it is a thing most holy
    kind: history
    title: 'Most holy: the priests’ bread'
    body: |
      What was left of the grain offering became the priests' food, to be eaten under the rules for the most holy things. Part was burned, and “the remainder given to the priests.” The rule is given from the priests' side in chapter 6: “with unleavened bread shall it be eaten in the holy place; in the court of the tabernacle of the congregation they shall eat it” ([[Lev. 6:16]]), and “All the males among the children of Aaron shall eat of it” ([[Lev. 6:18]]). Of the most holy things, the grain offerings among them ([[Num. 18:9]]), the law says, “In the most holy place shalt thou eat it; every male shall eat it” ([[Num. 18:10]]). Who ate which offerings is set out in the note on [[Lev. 7:6]].

      In the same charge that gives the priests these portions, Aaron is told, “Thou shalt have no inheritance in their land, neither shalt thou have any part among them: I am thy part and thine inheritance” ([[Num. 18:20]]); and of the grain offering the LORD says, “I have given it unto them for their portion of my offerings made by fire” ([[Lev. 6:17]]).
    sources: [lds-scriptures, gee-last-sacrifice, bd-meat-offering]

  - ref: 11
    phrase: ye shall burn no leaven, nor any honey
    kind: symbol
    title: Why no leaven or honey
    body: |
      Leaven and honey are the two things never burned on the altar. The text gives no reason, but both were kept out of the grain offering “as fermenting substances.” Leaven was as a rule “a lump of old dough,” and it “was probably forbidden because there was associated with it the idea of corruption.” In one older reading honey is named with it because it too has “an acidifying or fermenting quality,” and was “even used for the preparation of vinegar.”

      The rule is about the altar. Verse 12 allows an offering of firstfruits that does not go on the altar, and the older reading takes the pronoun there to mean leaven and honey themselves. At the feast of weeks two loaves “baken with leaven” are “the firstfruits unto the LORD” ([[Lev. 23:17]]), and they go to the priest, not to the fire ([[Lev. 23:20]]).

      The leaven of the Passover, and Paul's reading of it, belong to [[Ex. 12:15]].
    sources: [bd-sacrifices, bd-leaven, keil-leviticus, lds-scriptures]

  - ref: 13
    phrase: the salt of the covenant of thy God
    kind: symbol
    title: The salt of the covenant
    body: |
      Salt is the one thing every offering must have, and the verse ties it to the covenant. Elsewhere a “covenant of salt” is one that lasts for ever: the priests' portions are theirs “by a statute for ever: it is a covenant of salt for ever before the LORD” ([[Num. 18:19]]), and the LORD “gave the kingdom over Israel to David for ever, even to him and to his sons by a covenant of salt” ([[2 Chr. 13:5]]).

      The text does not say why salt should mark a covenant. One older reading answers from custom: “in common life salt was the symbol of covenant,” treaties being made “by the parties to an alliance eating bread and salt together,” so that a covenant of salt was “equivalent to an indissoluble covenant.” The same reading sets salt, “with its power to strengthen food and preserve it from putrefaction and corruption,” against the leaven and honey of verse 11. The rule reaches past the grain offering to “all thine offerings,” and Ezekiel's altar has salt cast on its burnt offerings ([[Ezek. 43:24]]).

      The covenant of salt has been set beside the Savior's charge to His disciples to be “the salt of the earth” ([[Matt. 5:13]]; [[3 Ne. 12:13]]), in a conference address that goes on to the revelation that those who “covenant with an everlasting covenant” are “accounted as the salt of the earth and the savor of men” ([[D&C 101:39]]).
    sources: [lds-scriptures, bdb, keil-leviticus, asay-salt]

  - ref: 14
    phrase: green ears of corn dried by the fire
    kind: history
    title: Firstfruits roasted in the ear
    body: |
      The firstfruits offering is the new crop, roasted. “Corn” in the King James is grain: in 1828 the word still comprehended “all the kinds of grain which constitute the food of men and horses,” and only American custom had narrowed it to maize. The “green ears” are *ʾaviv*, “fresh, young ears.” The ears were parched in the fire, and the “beaten corn” is crushed grain, “groats, grits.” Then oil and frankincense were added and the memorial burned, as with the flour of verse 1.

      Firstfruits were “regarded as belonging to God,” offered by the nation at the great feasts and by individuals at other times, and this is one of the rules for a private offering. The nation's firstfruits, the sheaf of barley waved after the Passover, is at [[Lev. 23:10–11]].
    sources: [webster-1828, oshb-wlc, bdb, bd-firstfruits]

christ: |
  What sacrifice pointed to, and how it ended in Christ, is set out with chapter 1 ([[Lev. 1:4]]). This chapter's own offering is bread. The finest flour of the daily offering, itself a meat offering ([[Ex. 29:41]]), has been read as pointing to the Savior, “the Bread of Life (John 6:35), meaning that He nourishes us” (see [[Ex. 29:40]]). His own words are “I am the bread of life: he that cometh to me shall never hunger” ([[John 6:35]]).

  One older reading takes the grain offering the same way: it could not have meant “merely the sanctification of earthly food,” but stood for spiritual food, drawn “from the true bread of life, or the word of God.” Both are readings of the offering, not the text's own explanation; Leviticus says of it only that it is “a sweet savour unto the LORD.”

explore: |
  - **The priests' side.** [[Lev. 6:14–23]], the law of the meat offering as the priests keep it.
  - **Grain with the animal offerings.** [[Num. 15:1–16]].
  - **Firstfruits and the leavened loaves.** [[Lev. 23:10–20]].
  - **A pure offering among the nations.** [[Mal. 1:11]], where the “pure offering” is a *minḥah*.
  - **Salt.** [[Matt. 5:13]]; [[Mark 9:49–50]]; [[D&C 101:39–40]].

