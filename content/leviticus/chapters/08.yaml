chapter: 8
title: Aaron and His Sons Consecrated
tagline: Before all the people, Moses carries out what the LORD commanded on the mountain. He washes, robes and anoints Aaron, anoints the tabernacle and the altar, offers three sacrifices for the new priests, and keeps them seven days at the door of the tent, all “as the LORD commanded Moses.”
when: 'At Sinai, in the second year after the Exodus, with the tabernacle newly set up (Ex. 40:17).'

setting: |
  Chapter 8 turns from law to event. For seven chapters the LORD has given the laws of the offerings “in mount Sinai” ([[Lev. 7:38]]); now Moses carries out a command he received on the mountain, to make Aaron and his sons priests. He follows the instructions of [[Ex. 29]] and [[Ex. 40:12–15]], and joins to them the anointing of the tabernacle and its altar commanded in [[Ex. 40:9–11]] (verses 10–11 here). One older reading gives the reason the rite waits until now: the command “could not properly be carried out till after the appointment and regulation of the institution of sacrifice, because most of the laws of sacrifice had some bearing upon this act.”

  Chapters 8–10 belong together: “the ritual observed in the consecration of priests, together with an account of the deaths of Nadab and Abihu.” Chapter 9 is the eighth day, when Aaron first offers at the altar, and chapter 10 tells how two of his sons died. The rite was meant to teach Israel “the consecration of the priesthood teaching the need of the consecration of the life of every worshipper who would draw nigh to God.”

  The Exodus chapters already explain most of what Moses uses: the priesthood of Aaron and his sons ([[Ex. 28:1]]), each garment (chapter 28), the washing and the anointing ([[Ex. 29:4]]; [[Ex. 29:7]]), the three sacrifices and their order ([[Ex. 29:10]]), the filling of the hand ([[Ex. 29:9]]), the wave breast ([[Ex. 29:27]]), the meal ([[Ex. 29:33]]) and the seven days ([[Ex. 29:35]]).

thread: |
  The chapter is one sentence said again and again: Moses did it “as the LORD commanded Moses.” Moses gathers the people “as the LORD commanded him” (verse 4), and the words “as the LORD commanded Moses” close five more stages of the rite (verses 9, 13, 17, 21, 29); the same thought frames the whole. Moses tells the gathered people, “This is the thing which the LORD commanded to be done” (verse 5), and the account ends, “So Aaron and his sons did all things which the LORD commanded by the hand of Moses” (verse 36). All of it “was done strictly as the Lord had commanded.”

  Between those ends the rite moves in the order Exodus 29 set. The priests are washed, clothed and anointed (verses 6–13); three sacrifices are offered for them, a sin offering, a burnt offering and the ram of consecration (verses 14–29); blood and oil are sprinkled on them and their garments (verse 30); and they eat at the door and stay there seven days (verses 31–35). Through all of it Moses acts and the priests are acted on: he “performed every part of the sacrificial rite,” and they lay their hands on the animals. The men who will offer for Israel are first washed, atoned for and fed, and only on the eighth day do they go up to the altar themselves ([[Lev. 9:8]]).

  The exactness is the point, and the next two chapters show why. When two of these sons offer fire “which he commanded them not” ([[Lev. 10:1]]), they die (see the note on verse 35).

sections:
  - range: 1-5
    heading: The people gathered at the door
    plain: |
      The LORD spoke to Moses: “Take Aaron and his sons, and the garments, the anointing oil, the bull for the sin offering, the two rams, and the basket of unleavened bread, and gather the whole congregation at the door of the tabernacle.” Moses did as the LORD commanded him, and the assembly gathered at the door of the tabernacle. Moses said to them, “This is what the LORD has commanded to be done.”
  - range: 6-13
    heading: Washed, clothed, and anointed
    plain: |
      Moses brought Aaron and his sons and washed them with water. He put the coat on Aaron, tied the girdle around him, clothed him with the robe and put the ephod on him, binding it to him with the ephod's band. He put the breastplate on him and placed the Urim and Thummim in it. He set the mitre on his head, and on its front the golden plate, the holy crown, as the LORD had commanded Moses.

      Then Moses took the anointing oil and anointed the tabernacle and everything in it, and made them holy. He sprinkled some of the oil on the altar seven times, and anointed the altar with all its utensils, and the laver and its stand, to make them holy. He poured some of the anointing oil on Aaron's head and anointed him, to make him holy. Then Moses brought Aaron's sons, put coats on them, tied girdles around them, and bound caps on their heads, as the LORD had commanded Moses.
  - range: 14-21
    heading: The sin offering and the burnt offering
    plain: |
      He brought the bull for the sin offering, and Aaron and his sons laid their hands on its head. It was killed, and Moses put some of the blood with his finger on the horns of the altar all around, and so purified the altar from sin. He poured out the rest of the blood at the base of the altar and made it holy, to make atonement for it. He burned on the altar all the fat on the inner parts, the caul above the liver, and the two kidneys with their fat. The rest of the bull, its hide, its flesh and its dung, he burned outside the camp, as the LORD had commanded Moses.

      He brought the ram for the burnt offering, and Aaron and his sons laid their hands on its head. It was killed, and Moses sprinkled its blood all around the altar. The ram was cut in pieces, and Moses burned the head, the pieces and the fat. The inner parts and the legs were washed in water, and Moses burned the whole ram on the altar: a burnt offering, a pleasing aroma, an offering made by fire to the LORD, as the LORD had commanded Moses.
  - range: 22-30
    heading: The ram of consecration
    plain: |
      He brought the second ram, the ram of consecration, and Aaron and his sons laid their hands on its head. It was killed, and Moses took some of its blood and put it on the tip of Aaron's right ear, on the thumb of his right hand, and on the big toe of his right foot. He brought Aaron's sons and put blood on the tips of their right ears, the thumbs of their right hands and the big toes of their right feet, and sprinkled the rest around the altar.

      He took the fat, the rump, all the fat on the inner parts, the caul above the liver, the two kidneys with their fat, and the right shoulder. From the basket of unleavened bread that stood before the LORD he took one unleavened cake, one cake of bread made with oil, and one wafer, and laid them on the fat and the right shoulder. He put all of it in the hands of Aaron and his sons and waved it as a wave offering before the LORD. Then Moses took it from their hands and burned it on the altar on top of the burnt offering: it was an offering of consecration, a pleasing aroma, an offering made by fire to the LORD. Moses took the breast and waved it as a wave offering before the LORD; it was his own share of the ram of consecration, as the LORD had commanded Moses.

      Then Moses took some of the anointing oil and some of the blood on the altar, and sprinkled it on Aaron and his garments, and on his sons and their garments; so he made holy Aaron and his garments, and his sons and their garments with him.
  - range: 31-36
    heading: The meal and the seven days
    plain: |
      Moses said to Aaron and his sons: “Boil the meat at the door of the tabernacle and eat it there with the bread in the basket of consecration, as I commanded when I said, ‘Aaron and his sons shall eat it.’ Burn whatever is left of the meat and the bread. Do not leave the door of the tabernacle for seven days, until the days of your consecration are complete, for your consecration takes seven days. What has been done today the LORD has commanded to be done, to make atonement for you. Stay at the door of the tabernacle day and night for seven days, and keep the charge the LORD has given you, so that you do not die; for that is what I have been commanded.” And Aaron and his sons did everything the LORD had commanded through Moses.

notes:
  - ref: 3
    phrase: gather thou all the congregation together unto the door of the tabernacle of the congregation
    kind: history
    title: Made priests before all the people
    body: |
      Aaron and his sons are consecrated in public because they are being made priests for the people. The LORD's first word after naming what to bring is to gather “all the congregation” at the door of the tent, and Moses tells them what is about to be done (verse 5).

      One older reading gives the reason: the congregation was summoned “because Aaron and his sons were to be consecrated as priests for them, as standing mediators between them and the Lord.” The same reading takes “the whole congregation” to mean “the nation in the persons of its elders,” and supposes that the animals for the sacrifices “were no doubt provided by Moses at the expense of the congregation, for which the priesthood was instituted”; the text itself does not say who supplied them.

      The door of the tent is where the chapter begins and ends. The people gather there (verses 3–4), the meal is eaten there (verse 31), and the priests stay there seven days (verses 33, 35). What they are being prepared for lies beyond it: on one study's reading, “the essence of the priestly role … was access to the Presence.”
    sources: [keil-leviticus, morales-tabernacle, lds-scriptures]

  - ref: 4
    phrase: Moses did as the LORD commanded him
    kind: scripture
    title: As the LORD commanded Moses
    body: |
      The refrain that closes each stage of this rite had already closed each stage of the tabernacle's making. “As the LORD commanded Moses” ends the account of each of the priests' garments in [[Ex. 39]] (seven times, from verse 1 to verse 31) and of each furnishing set in place in [[Ex. 40]] (six times, verses 19–32), where Moses did “according to all that the LORD commanded him” ([[Ex. 40:16]]). The garments made then are the garments put on Aaron now (verses 7–9). The accounts share the wording; nothing more is drawn from it here.

      The words of verse 4 have been heard again in the Book of Mormon. Lehi, leaving Jerusalem, “was obedient unto the word of the Lord, wherefore he did as the Lord commanded him” ([[1 Ne. 2:3]]), and Nephi's answer to his father, “I will go and do the things which the Lord hath commanded” ([[1 Ne. 3:7]]), has been read as carrying “the overtones of being obedient to God's commands as Moses had been in Leviticus 8.” The identification is one scholar's.
    sources: [lds-scriptures, ot-minute-lev]

  - ref: 6
    phrase: Moses brought Aaron and his sons
    kind: scripture
    title: Moses, Aaron, and the Aaronic Priesthood
    body: |
      Moses, who consecrates Aaron, held a greater priesthood than the one Aaron receives, and latter-day revelation names the lesser one after Aaron. Moses does every part of the rite himself: he washes, robes and anoints, applies the blood, burns the offerings, and takes the priest's portion of the last ram (verse 29). Revelation says what priesthood Moses held: “the Holy Priesthood … under the hand of his father-in-law, Jethro” ([[D&C 84:6]]). The gospel law Israel failed to keep had been “administered by Moses under the authority of the Melchizedek Priesthood,” and the priesthood then given to Aaron “was of lesser power and authority.” What Aaron received, and how it differed, is at [[Ex. 28:1]].

      The Doctrine and Covenants gives the priesthood its name from this chapter's high priest: “The second priesthood is called the Priesthood of Aaron, because it was conferred upon Aaron and his seed, throughout all their generations” ([[D&C 107:13]]). In Israel it passed by birth, within Levi and, for the priests, within Aaron's family; those “lineal restrictions … were lifted when the law of Moses was fulfilled.” John the Baptist, a priest of Aaron's order, conferred it ([[D&C 13:1]]) on Joseph Smith and Oliver Cowdery “on May 15, 1829, near Harmony, Pennsylvania,” and it now “functions under the direction of the Melchizedek Priesthood.” What John's words there promise for “the sons of Levi” is at [[Mal. 3:3]].
    sources: [lds-scriptures, bd-aaronic-priesthood]

  - ref: 11
    phrase: he sprinkled thereof upon the altar seven times
    kind: history
    title: The tent and the altar anointed first
    body: |
      Before any oil touches Aaron, Moses anoints the tabernacle, everything in it, and the altar, and the altar gets more than the rest. These two verses carry out a command given in [[Ex. 40:9–10]]: “anoint the tabernacle, and all that is therein,” and “anoint the altar of the burnt offering … and it shall be an altar most holy.” The anointing presumably followed “the same pattern as the setting up of the tabernacle: beginning in the Holy of Holies and moving outward until finished at the wash laver.”

      The seven sprinklings are this chapter's own; Exodus 40 says only that the altar is to be anointed. The altar of burnt offering “was splashed seven times as well as anointed, meaning that not only was the oil poured over the top of the altar, but it was also splashed on the sides.” It is the altar where every offering of chapters 1–7 would be made.

      What the oil did, the text says in one word: it “sanctified” them (verse 10), and then it is poured on Aaron “to sanctify him” (verse 12), which made him “one who could minister.” The reading of the oil as God's own, applied once, is at [[Ex. 29:7]].
    sources: [lds-scriptures, belnap-dwell-among]

  - ref: 12
    phrase: he poured of the anointing oil upon Aaron’s head
    kind: history
    title: Oil poured on Aaron’s head
    body: |
      Only Aaron has the oil poured on his head; his sons are dressed (verse 13) and later sprinkled with oil and blood together with him (verse 30). The sons are anointed too ([[Ex. 40:15]]), but in this chapter the oil reaches them only in that sprinkling.

      The difference marks the high priest for the rest of the law. He is the one “upon whose head the anointing oil was poured” ([[Lev. 21:10]]), and the law calls him “the priest that is anointed” ([[Lev. 4:3]]). On one study's reading the pouring was a “gesture of approach,” marking the man who would go nearest to the Presence, and even that was bounded: “Even for the high priest, however, this privileged entrance was permissible merely one day a year and by measured obedience alone” (see [[Lev. 16:2]]).
    sources: [lds-scriptures, morales-tabernacle]

  - ref: 15
    phrase: purified the altar
    kind: words
    title: Purifying a new altar
    body: |
      “Purified” here is a form of the Hebrew verb for sinning, used in the sense of cleansing from sin: Moses cleanses the altar of sin. The verb, *ḥaṭaʾ*, means at root to “miss (a goal or way), go wrong, sin”; in the form used here (*wayḥaṭṭeʾ*) it means to purify from sin, and this verse is listed for that sense: “the altar, by putting the blood of the sin-offering on its horns.” The same verse ends “to make reconciliation upon it,” where the Hebrew is *lekapper*, from the verb to “cover over, atone for,” and this verse is one where its object is “the altar to which the blood of the sin-offering was applied” (on that word, see [[Ex. 25:17]]). So an altar not yet used is cleansed and atoned for before the priests may serve at it.

      Why a new altar should need this, the text does not say. One older reading notes that the altar had just been anointed (verse 11), so the blood “cannot have been to purify it a second time from uncleanness, that still adhered to it, or was inherent in it.” It “had reference simply to pollutions, with which the priests defiled the altar when officiating at it,” and was meant “to impress upon them the fact, that the blood, by which they were purified, was also to serve as the means of purifying the altar.” A scholar's reading of the sin offering as cleansing the sanctuary rather than the sinner is at [[Lev. 4:3]].
    sources: [oshb-wlc, bdb, keil-leviticus]

  - ref: 23
    phrase: put it upon the tip of Aaron’s right ear
    kind: symbol
    title: The same marks on the priest and the cleansed leper
    body: |
      What the blood on the ear, the thumb and the toe has been read to mean is at [[Ex. 29:20]]; what Leviticus adds is that the same marks are made again, on a man returning from uncleanness. When a leper is cleansed, the priest puts the blood of the trespass offering “upon the tip of the right ear of him that is to be cleansed, and upon the thumb of his right hand, and upon the great toe of his right foot” ([[Lev. 14:14]]), and then oil in the same three places ([[Lev. 14:17]]).

      The two have been read as rites of one kind. Beside the rites of atonement, which were repeated often, stood those “performed when making the relationships in the first place”: the covenant in Exodus 24, “the anointing of the tabernacle and the priests as described in Exodus 40 and Leviticus 8, and the reintroduction of the leper described in Leviticus 14.” What they share is “the placement of blood, water, or oil on the individual being introduced or reintroduced into the society.”

      Another reading takes the three extremities together, the blood “probably symbolizing the anointing of the whole body.” On that reading the rite as a whole, washing, clothing, and anointing with blood and oil, “symbolized purification—by water and blood—with a setting apart by oil.”
    sources: [lds-scriptures, belnap-dwell-among, seely-messiah]

  - ref: 35
    phrase: keep the charge of the LORD, that ye die not
    kind: words
    title: Keeping the LORD’s watch
    body: |
      For seven days the new priests stay at the door of the tent on duty to the LORD, and the warning “that ye die not” shows what was at stake. “Charge” is *mishmeret*, a “guard, watch,” and so a “charge, function”; in the priestly laws it is the “ceremonial office or function” of a priest or Levite, and to keep the LORD's *mishmeret*, as here, is to “perform the service imposed by” Him. The priests stand duty like a watch set at the door. Why the rite lasts seven days, and what the filling of the hand behind verse 33 means, is at [[Ex. 29:35]] and [[Ex. 29:9]].

      The warning is not idle. Two chapters later, two of the sons consecrated here offer “strange fire before the LORD, which he commanded them not,” and die before Him (see [[Lev. 10:1]]).
    sources: [oshb-wlc, bdb, lds-scriptures]

christ: |
  Hebrews reads the priesthood made in this chapter as one that waited for Christ. “If therefore perfection were by the Levitical priesthood, … what further need was there that another priest should rise after the order of Melchisedec, and not be called after the order of Aaron?” ([[Heb. 7:11]]). Its answer: “the law maketh men high priests which have infirmity; but the word of the oath, which was since the law, maketh the Son, who is consecrated for evermore” ([[Heb. 7:28]]). Aaron's consecration began with a sin offering on which he and his sons laid their hands (verse 14), all of it done “to make an atonement for you” (verse 34). The Savior “did not have to make sacrifice for himself because he was pure.” How Hebrews sets Aaron's calling and his daily offerings beside Christ's is in the Witness of Christ at [[Ex. 29]].

  Aaron was anointed to his office; Jesus is the Anointed One, and Peter says with what He was anointed (see [[Ex. 29:7]]). The bestowal of the Holy Ghost on Jesus after His baptism has been read as “a mortal anointing of the Messiah.” And the priesthood of Aaron continued to that baptism: John the Baptist “was a priest in the Aaronic order … and by this authority he prepared the way for and baptized Jesus.”

explore: |
  - **The command given on the mountain.** [[Ex. 29:1–37]]; [[Ex. 40:9–15]].
  - **The eighth day and after.** [[Lev. 9:1–24]], Aaron's first offerings; [[Lev. 10:1–7]], Nadab and Abihu.
  - **The same marks on the cleansed leper.** [[Lev. 14:14–18]].
  - **Christ and the priesthood of Aaron.** [[Heb. 7:11–28]].
  - **The Aaronic Priesthood restored.** [[D&C 13:1]]; [[JS—H 1:68–72]]; [[D&C 84:18–27]]; [[D&C 107:13–20]].
  - **A study of anointing.** “Jesus the Messiah: Prophet, Priest and King” (Religious Studies Center) follows the anointing of prophets, priests and kings to the Savior, who fulfilled all three offices.

