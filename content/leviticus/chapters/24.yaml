chapter: 24
title: The Lamp, the Bread, and the Name
tagline: Israel keeps the lamp burning and the bread set out before the LORD, and when a man curses the Name in a quarrel, Moses waits for the LORD's word, which sets one law for the stranger and the native alike.
when: 'At Sinai, in the second year after the Exodus'

setting: |
  The chapter follows the calendar of feasts in [[Lev. 23]] and turns from the yearly and weekly holy days to the service kept every day: the oil for the lamp and the bread set out every sabbath. One older reading finds the link there: the offerings were part of how Israel sanctified its life and labor to the LORD “not only at the appointed festal periods, but every day.”

  It is also where Leviticus tells the second of its only two stories; the first is Nadab and Abihu ([[Lev. 10:1–7]]). Both are stories of disobedience, and both end with commands from the LORD and serve “as springboards for further instructions.” On one reading of the book's shape, which follows the high priest inward through the tabernacle, these two stories are the two “screens” of the sanctuary, and chapter 24 stands at the second, the veil before the Holy of Holies. The chapter's opening uses an expression for that veil found nowhere else, “the veil of the testimony” ([[Lev. 24:3]]), the “veil of the covenant.”

  The lamp and its oil are explained at [[Ex. 27:20]], the shewbread at [[Ex. 25:30]], and “eye for eye” at [[Ex. 21:24]]. This chapter adds what is its own: the twelve loaves renewed each sabbath, and the case of the blasphemer.

thread: |
  The chapter's first half is the holy place's standing service, kept “continually”: oil the people bring so that the lamps burn (verses 2, 3 and 4), and bread set out before the LORD every sabbath (verse 8). In one Latter-day Saint reading the chapter thereby “completes the discussion of the activities and implements in the Holy Place”; its second half is the case of a man who curses the Name in a fight.

  The story is told so that the law can be given. The man is half Israelite, half Egyptian; those who bring him to Moses put him under guard “that the mind of the LORD might be shewed them” (verses 10–12). The answer is a ruling for this man and a law for every case like it: whoever blasphemes the name of the LORD dies, “as well the stranger, as he that is born in the land” (verse 16). Then come the laws of life for life and injury for injury, and the same refrain: “Ye shall have one manner of law, as well for the stranger, as for one of your own country” (verse 22). The chapter closes on obedience: “the children of Israel did as the LORD commanded Moses” (verse 23).

sections:
  - range: 1-4
    heading: Oil for the lamp
    plain: |
      The LORD spoke to Moses: “Command the Israelites to bring you pure oil of pressed olives for the light, so that the lamps may burn continually. Outside the veil of the testimony, in the tent of meeting, Aaron shall keep it in order from evening to morning before the LORD continually. This is a statute for all time, through all your generations. He shall keep the lamps in order on the pure lampstand before the LORD continually.
  - range: 5-9
    heading: The bread before the LORD
    plain: |
      “Take fine flour and bake twelve loaves of it, two tenths of an ephah in each loaf. Set them in two rows, six to a row, on the pure table before the LORD. Put pure frankincense on each row, to be a memorial portion with the bread, an offering made by fire to the LORD. Every sabbath he shall set it out before the LORD continually, given by the Israelites as an everlasting covenant. It belongs to Aaron and his sons, and they shall eat it in a holy place, for it is most holy to him, from the LORD's offerings made by fire, by a statute for all time.”
  - range: 10-12
    heading: The man who cursed the Name
    plain: |
      The son of an Israelite woman and an Egyptian father went out among the Israelites, and he and an Israelite man fought in the camp. The woman's son blasphemed the Name and cursed. They brought him to Moses (his mother's name was Shelomith, the daughter of Dibri, of the tribe of Dan), and they kept him under guard until the LORD's will should be made known to them.
  - range: 13-23
    heading: One law for the stranger and the native
    plain: |
      The LORD spoke to Moses: “Bring the one who cursed outside the camp. Let everyone who heard him lay their hands on his head, and let the whole congregation stone him. And tell the Israelites: Anyone who curses his God shall bear his sin. Whoever blasphemes the name of the LORD shall be put to death; the whole congregation shall stone him. The stranger as well as the native-born: whoever blasphemes the Name shall be put to death.

      “Whoever kills a man shall be put to death. Whoever kills an animal shall make it good, a life for a life. If anyone injures his neighbor, as he has done, so shall it be done to him: fracture for fracture, eye for eye, tooth for tooth. The injury he has given a person shall be given to him. Whoever kills an animal shall make it good, and whoever kills a man shall be put to death. You shall have one law for the stranger and for the native-born, for I am the LORD your God.”

      Moses told the Israelites, and they brought the one who had cursed outside the camp and stoned him. The Israelites did as the LORD commanded Moses.

notes:
  - ref: 8
    phrase: by an everlasting covenant
    kind: history
    title: Twelve loaves every sabbath
    body: |
      Every sabbath the twelve loaves were replaced, and the verse calls the bread “an everlasting covenant.” What the shewbread was, and its name, “bread of the presence,” are at [[Ex. 25:30]]; this chapter gives the recipe and the weekly rhythm. Each loaf took two tenths of an ephah of fine flour, and they lay in two rows of six on the gold table, with frankincense on each row as “a memorial” (verse 7), the word used for the portion of the grain offering burned to the LORD (see [[Lev. 2:2]]).

      In one older reading the twelve loaves stand for the twelve tribes, and the frankincense was burned on the altar “every Sabbath on the removal of the loaves.” The same reading compares the bread with circumcision, also called “an everlasting covenant” ([[Gen. 17:13]]): setting out the bread was “a pledge or sign of the everlasting covenant, just as circumcision, as the covenant in the flesh, was to be an everlasting covenant.” The bread was supplied by the people, “taken from the children of Israel,” and the old loaves were then eaten by the priests in a holy place as “most holy” (verse 9).
    sources: [keil-leviticus, lds-scriptures]

  - ref: 11
    phrase: blasphemed the name of the LORD, and cursed
    kind: words
    title: '“Blasphemed the Name”: cursing or pronouncing'
    body: |
      The man's offense was speaking against the Name in a curse, though one old translation took the verb to mean that he spoke the Name itself. In the Hebrew of this verse he blasphemes simply “the Name” (*ha-shem*); verse 16 spells it out as “the name of the LORD.” The verb, *naqab*, is two verbs of the same spelling: one meaning “pierce, bore” and, by extension, “designate” or name; the other meaning “curse,” the sense given for verse 16.

      The Septuagint, the ancient Greek translation, reads it the first way, as its standard English rendering shows: “the son of the Israelitish woman named THE NAME and curse,” and in verse 16, “he that names the name of the Lord, let him die the death.” The King James follows the second. Either way the words came out in a fight (verse 10): in one Latter-day Saint reading, “even blurting out the holy name, cursing, and blaspheming in the heat of a fight was held to be worthy of death.”
    sources: [oshb-wlc, bdb, lxx-rahlfs, ot-minute-lev]

  - ref: 12
    phrase: that the mind of the LORD might be shewed them
    kind: scripture
    title: Waiting for the LORD's word
    body: |
      The case was not settled by Moses or the people on their own; they held the man until the LORD gave a ruling, and the ruling came in the LORD's own words (verses 13–16).

      The law tells one other case in the same words. When a man was found gathering sticks on the sabbath, “they put him in ward, because it was not declared what should be done to him” ([[Num. 15:34]]), and again the LORD gave the sentence.
    sources: [lds-scriptures]

  - ref: 14
    phrase: let all that heard him lay their hands upon his head
    kind: symbol
    title: The hands of the witnesses
    body: |
      Those who heard the curse laid their hands on the man's head before he was stoned, and the text does not say why. The gesture is the one made over an offering ([[Lev. 1:4]]), but here it is made by witnesses over a condemned man.

      One older reading takes it as a way of giving back what they had heard: “the hearers or witnesses were to throw off from themselves the blasphemy which they had heard, and return it upon the head of the blasphemer, for him to expiate.” The execution was outside the camp, and the whole congregation took part (verses 14, 23).
    sources: [keil-leviticus, lds-scriptures]

  - ref: 16
    phrase: as well the stranger, as he that is born in the land
    kind: history
    title: Why the Name was guarded with a life
    body: |
      The ruling makes reverence for the LORD's name binding on everyone in Israel's camp, native or not, and makes its violation a capital crime. The man's father was an Egyptian, and the LORD's answer names both, the stranger and the native, and the chapter says it again of all the laws that follow (verse 22).

      Why so severe? In one Latter-day Saint reading the case “establishes, above all, that the name of the Lord must be kept most holy.” On the same reading of the book's shape as a path inward through the tabernacle (see the background above), the final step into the Holy of Holies is “obedience to the law of supreme reverence for the sacred name of God.”
    sources: [lds-scriptures, ot-minute-lev]

  - ref: 20
    phrase: Breach for breach, eye for eye, tooth for tooth
    kind: structure
    title: Talion at the center
    body: |
      The laws of verses 17–21 are set out as a chiasm, a pattern in which the second half repeats the first in reverse, and its center is the rule that the penalty mirror the wrong. Laid out, the passage runs from the man killed, to the beast killed, to the injury “as he hath done,” then to the center, “breach for breach, eye for eye, tooth for tooth,” and back out through the injury, the beast, and the man; Alma is read as shaping his teaching on restoration in the same legal form. One Latter-day Saint reading draws the pattern wider, over verses 14–23, with the same center: there “the law of talionic justice is emphatically embedded.”

      The form makes the point: the punishment matches the crime and goes no further, “not more than a tooth for a tooth, either.” What the rule means as law, and Alma's use of the principle, are at [[Ex. 21:24]].
    sources: [ot-minute-lev, sc-knowhy-149]

christ: |
  The LORD whose name the chapter guards is Jehovah, the premortal Christ (see [[Ex. 3:14]]). The Church's footnote at verse 16 sets beside the blasphemy law the words of Jesus' accusers at His trial, “We have a law, and by our law he ought to die, because he made himself the Son of God” ([[John 19:7]]); John does not name the law, so the link is the footnote's cross-reference. The talion of verse 20 is the saying the Savior took up in the Sermon on the Mount ([[Matt. 5:38]]); the note at [[Ex. 21:24]] treats it.

