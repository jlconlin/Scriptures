chapter: 17
title: The Life Is in the Blood
tagline: Every ox, lamb or goat killed, in the camp or out of it, is to be brought to the LORD's altar, and no one in Israel, native or stranger, is to eat blood, for the life is in the blood and the LORD has given it on the altar to make atonement.
when: 'At Sinai, in the second year after the Exodus'

setting: |
  Chapter 16 gave the Day of Atonement. Chapter 17 begins the part of Leviticus that scholars have called the Holiness Code since 1877: chapters 17–26. The name fits, since forms of the Hebrew word for “holy” “occur more than twice as many times in the ten chapters of the Holiness Code as in the other seventeen chapters of the book.” Scholars hold it to be closely related to the priestly material, a debated source that many of them date to the sixth or fifth century BC. The book itself gives these laws as the LORD's words to Moses ([[Lev. 17:1]]; what latter-day scripture says of the five books is in the setting of [[Lev. 1]]), and its framing in holiness and priestly instruction can be seen as preparing Israel “to become a temple-worthy people.”

  The code opens as instruction given through the priests: “Speak unto Aaron, and unto his sons, and unto all the children of Israel” ([[Lev. 17:2]]). In one reading of the book's shape, Leviticus follows the high priest's path from the court of the altar toward the Holy of Holies, and the sacrifices of chapters 1–17 belong to that outer court. Chapter 17 is still about the altar: what may be killed, where, and what becomes of the blood.

thread: |
  The chapter is four laws, each opening with “whatsoever man there be” or the like and each carrying the threat that the man will be “cut off” (on the phrase, see [[Lev. 7:20]]). Verses 3–7: every ox, lamb or goat killed is to be brought to the door of the tent and offered as a peace offering. Verses 8–9: every burnt offering or sacrifice is to be offered there and nowhere else. Verses 10–12: no blood is to be eaten. Verses 13–16: the blood of game is to be poured out and covered, and meat from an animal that died of itself or was torn, which would still hold some of its blood, makes the eater unclean. That last rule carries a lighter penalty: washing, and uncleanness until evening (see [[Lev. 11:24–25]]), and only the man who will not wash shall “bear his iniquity.”

  What holds the laws together is the blood. “The first part of the Holiness Code emphasizes the sanctifying character of blood,” and verse 11 gives the reason for the laws on blood: the life is in the blood, and the LORD has given it for His altar (verse 14 repeats the first half). So an animal's blood goes to the altar, or into the ground, and never to the table, and never to another god (verse 7).

  From verse 8 on, every law names “the strangers which sojourn among you” beside Israel; in the Hebrew the first law names only “the house of Israel,” though the Greek translation adds the stranger there too. From there on, the laws on the altar and the blood bind the stranger as well as Israel; the text does not say why. Who the stranger was is explained at [[Lev. 19:33–34]].

sections:
  - range: 1-2
    heading: To Aaron, his sons and all Israel
    plain: |
      The LORD spoke to Moses: “Speak to Aaron, to his sons and to all the children of Israel, and tell them: This is what the LORD has commanded.
  - range: 3-7
    heading: Every animal brought to the tent
    plain: |
      “If any man of the house of Israel kills an ox, a lamb or a goat, inside the camp or outside it, and does not bring it to the door of the tent of meeting to present it as an offering to the LORD before His tabernacle, he is to be held guilty of bloodshed. He has shed blood, and he shall be cut off from his people.

      “This is so that the children of Israel will bring the sacrifices they now make out in the open field to the LORD, to the priest at the door of the tent of meeting, and offer them as peace offerings to the LORD. The priest shall sprinkle the blood on the LORD's altar at the door of the tent and burn the fat as a pleasing aroma to the LORD. And they shall no longer offer their sacrifices to the goat-demons they have gone after in unfaithfulness. This is a permanent statute for them throughout their generations.
  - range: 8-9
    heading: Every offering at the one altar
    plain: |
      “Tell them also: If any man of the house of Israel, or any stranger living among you, offers a burnt offering or a sacrifice and does not bring it to the door of the tent of meeting to offer it to the LORD, that man shall be cut off from his people.
  - range: 10-14
    heading: No blood to be eaten
    plain: |
      “If any man of the house of Israel, or any stranger living among you, eats any blood at all, I will set my face against the one who eats blood and cut him off from his people. For the life of the flesh is in the blood, and I have given it to you on the altar to make atonement for your souls; it is the blood that makes atonement for the soul. That is why I have told the children of Israel: none of you shall eat blood, nor shall any stranger who lives among you.

      “If any man of the children of Israel, or any stranger living among you, hunts and catches a beast or bird that may be eaten, he shall pour out its blood and cover it with dust. For the life of every creature is its blood; that is why I have told the children of Israel, You shall not eat the blood of any creature, for the life of every creature is its blood. Whoever eats it shall be cut off.
  - range: 15-16
    heading: Meat from an animal found dead or torn
    plain: |
      “Anyone, native or stranger, who eats an animal that died of itself or was torn by wild beasts shall wash his clothes and bathe in water, and he will be unclean until evening; then he will be clean. But if he does not wash his clothes or bathe, he shall bear his guilt.”

notes:
  - ref: 3
    phrase: that killeth an ox, or lamb, or goat, in the camp
    kind: history
    title: Every ox, lamb or goat brought to the altar
    body: |
      In the camp, no one was to kill an ox, a sheep or a goat except at the altar, even for an ordinary meal. The verb here, though it is used of sacrifice elsewhere, “also has the sense of ordinary killing for food. This is its meaning here,” and the law makes “no distinction … between slaughtering for sacrifice and for food.” The animals named are “those which are suitable for sacrifice,” and verses 5–6 say what was to happen to each: brought to the priest as a peace offering, its blood sprinkled on the altar and its fat burned (the peace offering is explained in [[Lev. 3]]). The reason given is that the people had been offering such sacrifices “in the open field,” and to other powers (verses 5, 7).

      The man who kills an animal anywhere else is charged with its blood: “blood shall be imputed unto that man; he hath shed blood” ([[Lev. 17:4]]), in a modern translation “he shall be held guilty of bloodshed.” In one older reading, “such slaughtering was to be reckoned as the shedding of blood, or blood-guiltiness.” The penalty is to be cut off from his people (see [[Lev. 7:20]]); why an animal's blood weighs so much is the subject of verse 11.

      The rule was made for a camp gathered around one tent. For the land, Deuteronomy allows otherwise: “If the place which the LORD thy God hath chosen to put his name there be too far from thee, then thou shalt kill of thy herd and of thy flock … and thou shalt eat in thy gates” ([[Deut. 12:21]]), the blood still poured out “upon the earth as water” ([[Deut. 12:24]]). The “statute for ever” of verse 7 may then mean “the principle of the law, that sacrifices were to be offered to Jehovah alone,” and not the rule of slaughter, which was “repealed by Moses, when they were about to enter Canaan, where it could no longer be carried out.”
    sources: [cambridge-leviticus, nrsvue, keil-leviticus, lds-scriptures]

  - ref: 7
    phrase: offer their sacrifices unto devils, after whom they have gone a whoring
    kind: words
    title: Goat-demons
    body: |
      The King James “devils” are, in Hebrew, *seʿirim*, “he-goats.” The word is the ordinary one for a goat, but here it names something worshipped, a “satyr, demon (with he-goat's form, or feet),” and in this verse and at 2 Chronicles 11:15 a “name for idols.” In Isaiah such creatures haunt ruins (see [[Isa. 13:21]]). A modern translation reads “so that they may no longer offer their sacrifices for goat-demons.” The text says no more about who these were. What it forbids is plain: sacrifice in the open field to anyone but the LORD.

      “Gone a whoring” is the scriptures' common figure for idolatry. It “continues the metaphor that Jehovah was the husband to whom Israel was married,” so that worship given to another was unfaithfulness to Him: “idolatry was often depicted as spiritual adultery.” The same figure runs through the prophets ([[Jer. 3:8–9]]).
    sources: [oshb-wlc, bdb, nrsvue, ot-manual-lev-11-18]

  - ref: 11
    phrase: For the life of the flesh is in the blood
    kind: words
    title: Life, soul and blood
    body: |
      In this verse the animal's life that is in its blood and the worshipper's soul for which it atones are one Hebrew word, *nefesh*, which the King James renders “life” once and “souls” and “soul” after it. Blood “represented the concept of life—the dynamic element that made living things living.” What Noah was told about the same blood is at [[Gen. 9:4]].

      The last clause is clearer in modern translations. The King James “it is the blood that maketh an atonement for the soul” reads in one “it is the blood that makes atonement by the life,” and in another “for, as life, it is the blood that makes atonement.” The two put it differently, but both tie the blood's power to atone to the life it carries.
    sources: [oshb-wlc, belnap-dwell-among, esv, nrsvue]

  - ref: 11
    phrase: I have given it to you upon the altar to make an atonement for your souls
    kind: symbol
    title: Blood given for the altar
    body: |
      The ban on eating blood rests on what the LORD has done with it: He has given it to Israel for the altar. Blood was, because it carried the life, “a divine possession utilized by God to affect atonement,” and so it belonged at the altar and not at the table: “Therefore I said unto the children of Israel, No soul of you shall eat blood” ([[Lev. 17:12]]). (The word “atonement” is explained at [[Ex. 25:17]].)

      The verse does not say outright whether the animal's life stands in for the worshipper's. One Latter-day Saint reading finds the “principle of substitution of the animal's suffering and death for human suffering and death” suggested here: “In reading this passage as a ransom, the blood (the life) of the animal makes an atonement for (ransoms) the soul of the sinner.” The same study notes that the passage is debated (see the note on [[Lev. 1:4]]).

      The atoning power of the blood had two grounds: it held the life, and the sacrifice was a type of Jesus Christ, the great sacrifice. That is why this verse is read beside Hebrews: “without shedding of blood is no remission” ([[Heb. 9:22]]).
    sources: [belnap-dwell-among, lane-whole-meaning, bd-blood, lds-scriptures]

  - ref: 13
    phrase: pour out the blood thereof, and cover it with dust
    kind: history
    title: Burying the blood of game
    body: |
      The blood of game was poured out and covered because, like the blood at the altar, it was the animal's life. The rule reaches past the altar to the hunt: the hunter who takes “any beast or fowl that may be eaten” may eat the meat, but he pours its blood out and covers it with dust ([[Lev. 17:13]]), and the reason is the one given for the altar, “for it is the life of all flesh” ([[Lev. 17:14]]). In the ancient world, Israel included, blood “was recognized as the seat of life,” and it “was thus sacred and not to be consumed.” So even the blood of an animal that never came near the altar was not eaten; it went back into the ground. The text gives no further reason for the dust. Deuteronomy's like rule for animals killed at home is in the note on verse 3.
    sources: [bowen-law-codes]

christ: |
  Hebrews speaks of Christ's offering in the terms of the altar's blood, and sets it against the blood of the animals: “Neither by the blood of goats and calves, but by his own blood he entered in once into the holy place, having obtained eternal redemption for us” ([[Heb. 9:12]]). Jesus “worked out a perfect atonement by the shedding of His own blood.” In one Latter-day Saint reading, this chapter's teaching that life and atonement are in the blood “helps us appreciate the Atonement implications” of the Savior's words in John: “Whoso eateth my flesh, and drinketh my blood, hath eternal life” ([[John 6:54]]). The same reading sets the chapter beside the Lord's words to Adam, “by the blood ye are sanctified” ([[Moses 6:60]]). How the offerings ended in Christ is at chapter 1 (see [[Lev. 1]]).

