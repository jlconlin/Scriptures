chapter: 3
title: The Peace Offering
tagline: The LORD tells Moses how an Israelite is to offer a peace offering from the herd, from the sheep, or from the goats. The fat is burned on the altar as the LORD’s, and Israel is never to eat fat or blood.
when: 'At Sinai, in the second year after the Exodus, once the tabernacle was set up ([[Ex. 40:17]]).'

setting: |
  The LORD is still speaking to Moses from the tent just finished (see [[Lev. 1:1]]), and chapter 3 is the third of the offerings the book sets out one to a chapter. The altar sacrifices of the law were of three kinds, sin offerings, burnt offerings, and peace offerings; chapter 1 gave the burnt offering and chapter 2 the grain offering.

  The peace offering may have been the most common sacrifice in Israel. It was offered of the worshipper's own will, after a vow had been fulfilled or to give thanks for a blessing; chapter 7 names its kinds. When Lehi reached the valley of Lemuel and “built an altar of stones, and made an offering unto the Lord, and gave thanks” ([[1 Ne. 2:7]]), he has been read as offering a peace offering, a thanksgiving for a safe journey.

  The chapter is written from the altar's side: it says what the worshipper and the priests do with the animal's blood and fat, and stops. What happened to the meat, which the worshipper ate, comes later, in “the law of the sacrifice of peace offerings” ([[Lev. 7:11]]) and the verses after it. At Aaron's first service a peace offering is made “for the people” ([[Lev. 9:18]]).

thread: |
  The chapter says the same thing three times. A worshipper may bring a peace offering from the cattle (verses 1–5), from the sheep (verses 6–11), or from the goats (verses 12–16), and each time the steps are the same: he presents an animal without blemish, lays his hand on its head, and kills it at the tabernacle; the priests sprinkle its blood around the altar; he cuts away the fat over the inner parts, the kidneys with their fat, and the fat appendage of the liver; and the priest burns them on the altar as “an offering made by fire unto the LORD.”

  The repetition puts the weight on what goes to the altar. The burnt offering of chapter 1 went up whole; here only the fat goes up, and the chapter ends by giving the rule behind it: “all the fat is the LORD’s” (verse 16). Then it turns to all Israel and every home: “ye eat neither fat nor blood” (verse 17).

  What the chapter leaves out is as telling. It says nothing about the meat; in one older reading, the meal that followed “was already known from traditional custom,” and its rules come in chapter 7. And unlike the burnt offering, which is “accepted for him to make atonement for him” ([[Lev. 1:4]]), the peace offering is not said here to make atonement. In the Church’s reading it presupposed a worshipper already “at peace with God” (see the note on verse 1), and it ends at a table.

sections:
  - range: 1-5
    heading: A peace offering from the herd
    plain: |
      If someone’s offering is a sacrifice of peace offering from the cattle, male or female, he is to offer an animal without blemish before the LORD. He is to lay his hand on its head and kill it at the door of the tabernacle of the congregation, and Aaron’s sons the priests are to sprinkle its blood all around the altar.

      From the peace offering he is to present, as an offering made by fire to the LORD, the fat that covers the inner parts and all the fat on them, the two kidneys with the fat on them by the loins, and the fatty appendage of the liver, which he removes with the kidneys. Aaron’s sons are to burn it on the altar on top of the burnt offering that lies on the wood on the fire. It is an offering made by fire, a pleasing fragrance to the LORD.
  - range: 6-11
    heading: A peace offering from the sheep
    plain: |
      If his peace offering to the LORD is from the flock, male or female, he is to offer it without blemish. If he offers a lamb, he is to present it before the LORD, lay his hand on its head, and kill it before the tabernacle of the congregation, and Aaron’s sons are to sprinkle its blood all around the altar.

      From it he is to present as an offering made by fire to the LORD its fat: the whole fat tail, cut off close to the backbone, the fat that covers the inner parts and all the fat on them, the two kidneys with their fat by the loins, and the fatty appendage of the liver, removed with the kidneys. The priest is to burn it on the altar. It is the food of the offering made by fire to the LORD.
  - range: 12-16
    heading: A peace offering from the goats
    plain: |
      If his offering is a goat, he is to present it before the LORD, lay his hand on its head, and kill it before the tabernacle of the congregation, and the sons of Aaron are to sprinkle its blood all around the altar.

      From it he is to present his offering made by fire to the LORD: the fat that covers the inner parts and all the fat on them, the two kidneys with their fat by the loins, and the fatty appendage of the liver, removed with the kidneys. The priest is to burn them on the altar. It is the food of the offering made by fire, a pleasing fragrance. All the fat belongs to the LORD.
  - range: 17
    heading: Neither fat nor blood
    plain: |
      This is a statute for all time, for every generation, wherever you live: you are not to eat any fat or any blood.

notes:
  - ref: 1
    phrase: a sacrifice of peace offering
    kind: words
    title: 'Peace offering: an offering of well-being'
    body: |
      “Peace offering” translates *zebaḥ shelamim*, and what *shelamim* means exactly is not agreed. The standard lexicon defines it as a “sacrifice for alliance or friendship” and lists the other proposals beside it: a mark of peace with God, fellowship between God and the worshipper, a “welfare-offering,” a “thank-offering.” It adds that the “sacred meal” was the offering's special feature. Another reading is that the Hebrew term “properly means an offering for well-being.” The ancient Greek translation called it the “sacrifice of salvation.”

      Whatever the shade of the word, the Church’s reading is that these offerings “presupposed that the sacrificer was at peace with God; they were offered for the further realization and enjoyment of that peace.” The instructions are silent where the burnt offering's are not. The burnt offering is “accepted for him to make atonement for him” ([[Lev. 1:4]]); in chapter 3 the phrase “to make atonement” never appears, perhaps because “the peace offering recognizes that atonement, or reconciliation, is already present.” That is a reading of a silence, not a rule: Ezekiel's vision of the temple lists peace offerings among the offerings given “to make reconciliation for them” ([[Ezek. 45:15]]).
    sources: [oshb-wlc, bdb, brown-lehi-sacrifices, gee-last-sacrifice, bd-sacrifices, belnap-dwell-among, lds-scriptures]

  - ref: 1
    phrase: whether it be a male or female
    kind: history
    title: Male or female, but no birds
    body: |
      Unlike the burnt offering, the peace offering may be female, and it may not be a bird. A burnt offering from the herd or the flock was a male, “bullocks, rams, or he-goats,” while the peace offering “could be either male or female” (see [[Lev. 1:3]] for “without blemish”). The burnt offering could also be “turtle-doves or pigeons” for a poor man, but chapter 3 lists only cattle, sheep, and goats.

      The text gives no reason for either rule. One reason given for the second is the meal that followed (see the note on verse 16): “birds were not acceptable because they provided too little meat.” The poor man's offering of birds belongs to the burnt and sin offerings (see [[Lev. 5:7]]).
    sources: [sc-knowhy-545, bd-sacrifices, ot-manual-lev-1-10]

  - ref: 5
    phrase: upon the burnt sacrifice
    kind: history
    title: Laid on the burnt offering
    body: |
      The fat of the peace offering is burned on top of a burnt offering already on the altar. The law of the altar fire says so in its own words: each morning the priest is to “lay the burnt offering in order upon it; and he shall burn thereon the fat of the peace offerings” ([[Lev. 6:12]]). In one older reading the reason is the order of the day: the peace offering “was always preceded by the daily burnt-offering,” so that its fat “were to be laid upon the burnt-offering which was burning already.”

      The order of the sacrifices also carried a meaning. When they were offered together, “the sin always preceded the burnt, and the burnt the peace offerings,” so that their order was “the order of atonement, sanctification, and fellowship with the Lord.” The peace offering, with its meal, came last.
    sources: [lds-scriptures, keil-leviticus, bd-sacrifices]

  - ref: 9
    phrase: the whole rump
    kind: history
    title: What went on the altar
    body: |
      Only certain fat parts of the peace offering were burned, and two of the King James words in it are unfamiliar. The list is the same for every animal: the fat covering the inner organs, the fat on them, the two kidneys with the fat near the loins, and what the King James calls “the caul above the liver.” The Hebrew word, *yoteret*, is “appendage,” “most probably (fat) appendage, a (fatty) mass at opening of liver,” and has also been identified as the “caudate lobe of the liver.”

      For a sheep the list adds “the whole rump,” which the worshipper cuts off “hard by the backbone.” The Hebrew *alyah* is the “fat tail of sheep, still accounted a delicacy in the East.”
    sources: [bdb, lds-scriptures]

  - ref: 11
    phrase: the food of the offering made by fire
    kind: symbol
    title: The food of the LORD
    body: |
      The fat burned on the altar is called the LORD’s food: the Hebrew *leḥem* is “bread, food,” and bread was “the ordinary food of early Hebrews.” The law speaks of the sacrifices generally in the same way: the priests “shall be holy” because they offer “the bread of their God” ([[Lev. 21:6]]), and the Church’s footnote here points to Ezekiel, where the LORD calls the offerings “my bread, the fat and the blood” ([[Ezek. 44:7]]).

      In one older reading the phrase names food “which served as a firing for Jehovah, or reached Jehovah by being burned”: food “which Israel produced and caused to ascend to its God in fire.” It rises “for a sweet savour” (verse 16), the phrase explained at [[Lev. 1:9]]. How the LORD’s share fits into the meal is in the note on verse 16.
    sources: [oshb-wlc, bdb, lds-scriptures, keil-leviticus]

  - ref: 16
    phrase: all the fat is the LORD’s
    kind: symbol
    title: 'Three shares: the LORD’s, the priests’, and the worshipper’s'
    body: |
      The fat is the LORD’s portion, and the rest of the peace offering was eaten by the priests and the worshipper. The fat is set apart to the Lord as the blood is: in verses 16–17 “both fat and blood are considered the Lord’s.” Burning it has also been read as more than disposal: the fat was a sign of the animal’s well-being, and it “came to represent the consecration of the whole life of the individual to God.”

      Chapter 7 gives the other two shares. The breast and the right shoulder go to the priests ([[Lev. 7:30–34]], where the wave and heave offerings are explained). The meat of a thanksgiving offering had to be eaten the same day, that of a vow or a voluntary offering by the next ([[Lev. 7:15–16]]), and “the rest of the flesh was eaten by the sacrificer, his household, and the poorer Levites at the tabernacle.” The peace offering was thus eaten by “the offerer, the priests, and the Lord (symbolized by burning part of the animal on the altar and the smoke ascending to heaven), representing a covenantal meal of peace and communion between the three parties.”
    sources: [belnap-dwell-among, ot-manual-lev-1-10, lds-scriptures, bd-sacrifices, seely-sacrifice]

  - ref: 17
    phrase: that ye eat neither fat nor blood
    kind: history
    title: Neither fat nor blood
    body: |
      The rule that ends the chapter reaches past the altar to every Israelite home: “throughout all your dwellings,” no one is to eat fat or blood. Chapter 7 states its scope. The fat forbidden is that of the animals offered on the altar, “of ox, or of sheep, or of goat” ([[Lev. 7:23]]). The fat of one that died of itself or was killed by beasts “may be used in any other use” but not eaten ([[Lev. 7:24]]). The ban on blood is wider, “whether it be of fowl or of beast, in any of your dwellings” ([[Lev. 7:26]]), and the penalty for either is to be “cut off from his people” ([[Lev. 7:25]]; [[Lev. 7:27]]).

      The reason for the fat is the verse before: it is the LORD’s. The reason for the blood is given at [[Lev. 17:11]], where the full note is.
    sources: [lds-scriptures]

christ: |
  The law of sacrifice and how it pointed to Christ are treated at chapter 1 (see [[Lev. 1:4]]); what is this chapter's own is the end it reaches. The peace offering came last in the order of the sacrifices (see the note on verse 5), and it stands for a worshipper already reconciled to God and sitting down to a meal the Lord shares (see the notes on verses 1 and 16). The sacrifices before Christ pointed to Him; they “showed that it could only be through Jesus Christ that we could attain lasting peace and reconciliation with God and others.”

  The Church’s footnote to “without blemish” in verse 6 points to the Savior in the New Testament's own words: “such an high priest became us, who is holy, harmless, undefiled, separate from sinners” ([[Heb. 7:26]]), and we are redeemed “with the precious blood of Christ, as of a lamb without blemish and without spot” ([[1 Pet. 1:19]]).

explore: |
  - **The rest of the law of the peace offering.** [[Lev. 7:11–36]]: thanksgiving, vow, and freewill offerings, the meal, and the priests' portions.
  - **Peace offerings at the great occasions.** [[Ex. 24:5–11]], at the making of the covenant, and [[Lev. 9:18–24]], at Aaron's first service.
  - **Lehi's offerings.** [[1 Ne. 2:7]]; [[1 Ne. 5:9]]. “What Were Those Sacrifices Offered by Lehi?” (Religious Studies Center, 1998) reads them in the light of Leviticus 1 and 3.

