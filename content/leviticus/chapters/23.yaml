chapter: 23
title: The Appointed Times
tagline: The LORD names the days Israel is to keep holy through the year, from the weekly sabbath and the Passover in the spring, through the first sheaf and the fifty days to Pentecost, to the trumpets, the Day of Atonement and the booths of the seventh month.
when: 'At Sinai, in the second year after the Exodus; the days themselves fall through the year, from the first month to the seventh.'

setting: |
  Chapter 23 stands among the laws of holiness (chapters 17–26; the name is explained at [[Lev. 17:1]]). On one older reading the chapter is not a full “calendar of feasts” but “simply a list of those festal days and periods of the year at which holy meetings were to be held”; the offerings for each day are set out at [[Num. 28–29]].

  Three of the days were already commanded as the pilgrim feasts, when every man was to appear before the LORD ([[Ex. 23:14]], where the note explains them). The Passover itself belongs to [[Ex. 12]], and the whole year of feasts, with the sabbatical year and the jubilee, is laid out in a table in [The Law and the Covenant](/old-testament/guides/law-and-covenant/#feasts). This chapter gives what is its own: the holy convocations, the sheaf, the counting of seven weeks, the trumpets, the people's part on the Day of Atonement, and the booths with their reason.

  Several of the laws look forward to a settled life: “When ye be come into the land which I give unto you, and shall reap the harvest thereof” ([[Lev. 23:10]]). On one Latter-day Saint reading, the chapter's calendar “connects the temporal terrestrial times of temple performances with the eternal celestial cycles, that all may be done on earth as it is in the heavens.”

thread: |
  The sabbath comes first, before any yearly feast (verse 3), and the number seven runs through what follows: seven days of unleavened bread, seven weeks counted to Pentecost, and three holy days in the seventh month. On one older reading, “The seventh month of the year, like the seventh day of the week, was consecrated as a Sabbath or sabbatical month.” A few phrases return from one holy day to the next: “an holy convocation,” “ye shall do no servile work therein,” “an offering made by fire unto the LORD,” and “a statute for ever.”

  The appointed times also follow the harvest. The first sheaf is waved before anyone eats the new grain (verses 10–14), two loaves of the new wheat are offered fifty days later (verses 15–21), and the last feast comes “when ye have gathered in the fruit of the land” ([[Lev. 23:39]]). In the middle of the harvest laws stands the command to leave the corners of the field and the gleanings for the poor and the stranger (verse 22), the law of [[Lev. 19:9–10]] given again.

  The fullest reason the text gives is for the booths: “That your generations may know that I made the children of Israel to dwell in booths, when I brought them out of the land of Egypt” ([[Lev. 23:43]]). Twice the laws close with “I am the LORD your God” (verses 22 and 43).

sections:
  - range: 1-8
    heading: The sabbath, the Passover and unleavened bread
    plain: |
      The LORD said to Moses: “Tell the Israelites: These are the LORD's appointed times, which you are to proclaim as holy gatherings. They are my appointed times.

      “Work may be done for six days, but the seventh day is a sabbath of complete rest, a holy gathering. Do no work at all on it. It is the LORD's sabbath wherever you live.

      “These are the LORD's appointed times, the holy gatherings you are to proclaim at their set times. The LORD's Passover is at evening on the fourteenth day of the first month. On the fifteenth day of that month the feast of unleavened bread to the LORD begins, and for seven days you must eat bread made without yeast. On the first day hold a holy gathering and do no ordinary work. For seven days present an offering by fire to the LORD. On the seventh day hold a holy gathering and do no ordinary work.”
  - range: 9-14
    heading: The first sheaf
    plain: |
      The LORD said to Moses: “Tell the Israelites: When you come into the land I am giving you and reap its harvest, bring the priest a sheaf of the first grain you cut. He will wave the sheaf before the LORD, so that it may be accepted for you; he will wave it on the day after the sabbath. On the day you wave the sheaf, offer a male lamb a year old with no defect as a burnt offering to the LORD, with its grain offering of two tenths of an ephah of fine flour mixed with oil, an offering by fire, a pleasing aroma to the LORD, and its drink offering of a quarter of a hin of wine. Eat no bread, no roasted grain and no fresh ears of the new crop until the very day you bring this offering to your God. This is a law for all time, for all your generations, wherever you live.
  - range: 15-22
    heading: Fifty days to the feast of weeks
    plain: |
      “From the day after the sabbath, the day you brought the sheaf to be waved, count off seven full weeks, fifty days to the day after the seventh week, and then present a new grain offering to the LORD. Bring from your homes two loaves for waving, each made of two tenths of an ephah of fine flour and baked with yeast, as firstfruits to the LORD.

      “With the bread offer seven lambs a year old with no defect, one young bull and two rams. They are a burnt offering to the LORD, with their grain offerings and drink offerings, an offering by fire, a pleasing aroma to the LORD. Offer also one male goat as a sin offering and two lambs a year old as a peace offering. The priest will wave them with the bread of the firstfruits before the LORD, together with the two lambs; they are holy to the LORD and belong to the priest. On that same day proclaim a holy gathering and do no ordinary work. This is a law for all time wherever you live, for all your generations.

      “When you reap the harvest of your land, do not reap to the very edges of your field, and do not gather the gleanings of your harvest. Leave them for the poor and for the stranger. I am the LORD your God.”
  - range: 23-25
    heading: The day of trumpets
    plain: |
      The LORD said to Moses: “Tell the Israelites: On the first day of the seventh month you are to have a day of rest, a remembrance proclaimed with the blast of the horn, a holy gathering. Do no ordinary work, but present an offering by fire to the LORD.”
  - range: 26-32
    heading: The Day of Atonement
    plain: |
      The LORD said to Moses: “The tenth day of this seventh month is the Day of Atonement. Hold a holy gathering, humble yourselves, and present an offering by fire to the LORD. Do no work at all on that day, for it is a day of atonement, when atonement is made for you before the LORD your God. Anyone who does not humble himself on that day will be cut off from his people, and anyone who does any work on that day I will destroy from among his people. Do no work at all. This is a law for all time, for all your generations, wherever you live. It is a sabbath of complete rest for you, and you are to humble yourselves. Keep your sabbath from the evening of the ninth day of the month until the following evening.”
  - range: 33-36
    heading: The feast of tabernacles
    plain: |
      The LORD said to Moses: “Tell the Israelites: On the fifteenth day of this seventh month the LORD's feast of booths begins, and it lasts seven days. The first day is a holy gathering, when you are to do no ordinary work. For seven days present offerings by fire to the LORD. On the eighth day hold a holy gathering and present an offering by fire to the LORD. It is the closing assembly; do no ordinary work.
  - range: 37-38
    heading: The summary
    plain: |
      “These are the LORD's appointed times, which you are to proclaim as holy gatherings, for presenting offerings by fire to the LORD: burnt offerings and grain offerings, sacrifices and drink offerings, each on its own day. These days are besides the LORD's sabbaths, and besides your gifts, your vows and your freewill offerings to the LORD.
  - range: 39-44
    heading: The booths
    plain: |
      “On the fifteenth day of the seventh month, when you have gathered in the produce of the land, keep the LORD's feast for seven days. The first and eighth days are days of rest. On the first day take branches of fine trees, branches of palm trees, boughs of leafy trees and willows from the brook, and rejoice before the LORD your God for seven days. Keep it as a feast to the LORD for seven days each year; it is a law for all time, for all your generations; keep it in the seventh month. Live in booths for seven days. Every native-born Israelite is to live in booths, so that your descendants will know that I made the Israelites live in booths when I brought them out of the land of Egypt. I am the LORD your God.”

      So Moses told the Israelites the LORD's appointed times.

notes:
  - ref: 2
    phrase: Concerning the feasts of the LORD, which ye shall proclaim to be holy convocations
    kind: words
    title: Appointed times and holy convocations
    body: |
      The word the King James renders “feasts” here means appointed times. The list it heads opens with the weekly sabbath (verse 3) and holds the Day of Atonement (verse 27) as well as the feasts. It is *moʿadim*, from *moʿed*, “appointed time, place, meeting,” and in this chapter a “sacred season.” The word is “wider than” *ḥag*, which was “only a feast celebrated by a pilgrimage.” *Ḥag* is the word in “the feast of unleavened bread” ([[Lev. 23:6]]) and “the feast of tabernacles” ([[Lev. 23:34]]). The LORD calls the whole set “my feasts”: the times are His to appoint.

      What the times share is the “holy convocation,” *miqra qodesh*, the law's “technical term … for religious gathering on Sabbath and certain sacred days.” A convocation is a calling together, and the sabbath is “the sabbath of the LORD in all your dwellings” ([[Lev. 23:3]]).
    sources: [bdb, oshb-wlc]

  - ref: 7
    phrase: ye shall do no servile work therein
    kind: words
    title: No servile work, and no work at all
    body: |
      “Servile work” does not mean the work of servants; it means laborious work, ordinary labor. The Hebrew phrase, *kol meleʾkhet ʿavodah lo taʿasu*, is rendered “ye shall do no laborious work,” and here *ʿavodah* has the plain sense “labour, work,” not the sense “labour of servant or slave.”

      The chapter draws a line between two kinds of holy day. On the first and seventh days of unleavened bread, at Pentecost, on the day of trumpets and on the first and eighth days of tabernacles, the command is “no servile work.” On the weekly sabbath and the Day of Atonement it is stricter: “ye shall do no work therein” ([[Lev. 23:3]]), “Ye shall do no manner of work” ([[Lev. 23:31]]).
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 11
    phrase: on the morrow after the sabbath the priest shall wave it
    kind: history
    title: The first sheaf, and which sabbath
    body: |
      Which sabbath “the morrow after the sabbath” means was disputed, and since the count to Pentecost begins from this day ([[Lev. 23:15]]), the date of that feast turns on the answer. The first sheaf of the barley harvest was waved before the LORD in the week of unleavened bread, “probably 16th Abib.” One older reading takes it as the first day of unleavened bread, which was a day of rest and so was “called ‘Sabbath,’ irrespectively of the day of the week upon which it fell,” making the day of the sheaf the sixteenth of the month, “not the day of the Sabbath which fell in the seven days' feast of Mazzoth.” Another older reading reports the traditional view as “an unusual sense of ‘sabbath’” and thinks it probable that in the law's original setting “the ordinary weekly sabbath which fell during the seven days” was meant.

      No one was to eat bread, roasted grain or fresh ears of the new crop “until the selfsame day that ye have brought an offering unto your God” ([[Lev. 23:14]]). On the same older reading, by the sheaf “the Israelites were to consecrate their daily bread to the Lord their God, and practically to acknowledge that they owed the blessing of the harvest to the grace of God.” The sheaf was not burned; it was “only presented symbolically to the Lord by waving, and then handed over to the priests,” and a lamb was burned with it (verse 12). The wave offering is explained at [[Lev. 7:30–34]].
    sources: [bd-feasts, keil-leviticus, cambridge-leviticus, lds-scriptures]

  - ref: 16
    phrase: shall ye number fifty days
    kind: scripture
    title: Fifty days to Pentecost
    body: |
      The feast takes its Greek name from the count: seven weeks from the sheaf bring Israel to the fiftieth day, and the name is “Pentecost, which means ‘fiftieth.’” The law calls it “the feast of harvest, the firstfruits of thy labours” and “the feast of weeks.” It lasted a single day, and its “characteristic rite was the new meal offering; that is, two loaves of leavened bread made of fine flour of new wheat.” The loaves are leavened, and they were not burned on the altar but went to the priest ([[Lev. 23:20]]); the rule against leaven on the altar is at [[Lev. 2:11]]. “We have no record of the celebration of this feast in the Old Testament.”

      In the New Testament the day is crowded with pilgrims, and “Of this the narrative in Acts 2 is sufficient proof”: “when the day of Pentecost was fully come,” the Holy Ghost came on the disciples with “cloven tongues like as of fire” ([[Acts 2:1–4]]). Elder McConkie read the day as chosen for its meaning: “How fitting it was instead for the Lord to choose that very day to send living fire from heaven, as it were, fire that would dwell in the hearts of men and replace forever all the fires on all the altars of the past.”
    sources: [lund-types-symbols, bd-feasts, lds-scriptures]

  - ref: 24
    phrase: a memorial of blowing of trumpets
    kind: history
    title: The day of the trumpet blast
    body: |
      The first day of the seventh month is named for a sound: *zikhron teruʿah*, a memorial of the *teruʿah*, the “shout or blast of war, alarm, or joy.” This chapter gives the day no other reason (see the note in [The Law and the Covenant](/old-testament/guides/law-and-covenant/#feasts)). One older reading takes the blast as a call for the LORD to remember His people, “to call the congregation into remembrance before Jehovah, that He might turn towards it His favour and grace.” It is the festival known as Rosh Hashanah.

      The day has a place in Latter-day Saint history. One Latter-day Saint writer observes that “on 22 September 1827, the very day Israel celebrated the Feast of Trumpets, Moroni gave the golden plates to the Prophet Joseph Smith,” and judges that “Since this feast was ripe with meaning for the theme of the regathering of Israel, it is unlikely this timing was accidental.” That is her reading of the date; the chapter itself says nothing of a gathering.
    sources: [bdb, oshb-wlc, keil-leviticus, ot-minute-lev, read-trumpets]

  - ref: 27
    phrase: there shall be a day of atonement
    kind: scripture
    title: The people's side of the Day of Atonement
    body: |
      Chapter 16 gives the high priest's rite for this day; chapter 23 gives the people's part: they keep the day as a fast and do no work at all. It is the one day in the chapter with a penalty attached, and the penalty is double: the one who does not humble himself “shall be cut off from among his people,” and of the one who works the LORD says, “the same soul will I destroy from among his people” ([[Lev. 23:29–30]]). What “afflict your souls” means is at [[Lev. 16:29]].
    sources: [lds-scriptures, bd-fasts]

  - ref: 36
    phrase: it is a solemn assembly
    kind: christ
    title: The eighth day, the great day of the feast
    body: |
      The “solemn assembly” is the eighth day, the one after the seven days of booths. That day “marked the ending not only of this particular feast, but of the whole festival season,” and John calls it “the last day, that great day of the feast” ([[John 7:37]]).

      On that day Jesus stood and cried, “If any man thirst, let him come unto me, and drink” ([[John 7:37–38]]). By His time the feast had gathered ceremonies the law does not name, among them “the drawing of water from Siloam and its libation on the altar” and the lighting of the temple courts with great lamps, and “It is probably to these ceremonies that our Lord refers in John 7:37 and 8:12,” where He says, “I am the light of the world” ([[John 8:12]]). On one Latter-day Saint reading, “The Savior waited until the ‘great day of the feast,’ on which there was no water-pouring ceremony, to publicly declare that he was the source of ‘living water.’”
    sources: [bd-feasts, gardner-tabernacles, lds-scriptures]

  - ref: 40
    phrase: ye shall rejoice before the LORD your God seven days
    kind: prophets
    title: The feast of joy, and its restoration
    body: |
      Tabernacles was kept with rejoicing for seven days, and later Jews counted it “the greatest and most joyful of all.”

      Elder McConkie taught that this feast will return: “the one Mosaic celebration which, as part of the restitution of all things, shall be restored when Jehovah comes to reign personally upon the earth for a thousand years.” He saw part of it kept already: “Even now we perform one of its chief rituals in our solemn assemblies, the giving of the Hosanna Shout.” And he read the harvest it celebrated as the gathering: “it is the mission of the house of Israel to gather all nations to Jehovah.”
    sources: [bd-feasts, lund-types-symbols]

  - ref: 43
    phrase: That your generations may know that I made the children of Israel to dwell in booths
    kind: history
    title: Why Israel lived in booths
    body: |
      The booths come with a reason in the text's own words: each generation was to know that the LORD made Israel dwell in booths when He brought them out of Egypt. A booth (*sukkah*) is “a booth or hut,” made of boughs, and “is not to be confounded with” a tent. On one older reading the booths were not meant to recall hardship, “for the recollection of privation and want can never be an occasion of joy,” but “a memorial of the grace, care, and protection which God afforded to His people in the great and terrible wilderness.” The rite “seems to have been neglected from the time of Joshua to the time of Ezra (Neh. 8:17),” when the returned exiles built booths again.

      King Benjamin's gathering may show a Nephite form of the feast. At King Benjamin's speech the people “pitched their tents round about the temple, every man having his tent with the door thereof towards the temple” ([[Mosiah 2:6]]), and Latter-day Saint scholars “have argued that this gathering … closely resembles what we know about ancient Israelite temple pilgrimage festivals, especially the Feast of Tabernacles.” “Everyone had a tent, not just those who had come from out of town,” and on that reading the tents “may also have symbolized the time when Lehi and his family had ‘dwelt in a tent.’”
    sources: [keil-leviticus, bd-feasts, sc-knowhy-80]

christ: |
  The New Testament names Christ in the terms of two of these days. The Passover lamb is His: “Christ our passover is sacrificed for us” ([[1 Cor. 5:7]]; the lamb itself is at [[Ex. 12:5]]). The firstfruits of the harvest are His: Paul calls the risen Christ “the firstfruits of them that slept” ([[1 Cor. 15:20]]). “Firstfruits” comes from the law's offerings of “the first items of a given harvest which were to be offered up to God,” among them the sheaf of [[Lev. 23:10]]. Paul uses the word “alluding to Christ as the first resurrected being.” Two more are days on which the New Testament sets His work: the day of Pentecost, when the Holy Ghost was given ([[Acts 2:1–4]]; see the note on verse 16), and the last day of Tabernacles, when Jesus offered Himself as the living water (see the note on verse 36).

  What the sacrifices of these days pointed to, and how they ended in Christ, is set out with chapter 1 ([[Lev. 1:4]]).

explore: |
  - **The feasts again in the law.** [[Ex. 23:14–17]]; [[Num. 28:16–29:40]]; [[Deut. 16:1–17]].
  - **The booths kept again.** [[Neh. 8:13–18]]; [[Zech. 14:16–19]].

