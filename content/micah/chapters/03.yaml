chapter: 3
title: 'Is Not the LORD Among Us?'
tagline: Micah turns on the men who should have kept justice in Jerusalem, the rulers who devour the people and the prophets who preach peace to whoever feeds them, and sets himself against them as a prophet full of the Spirit of the Lord. Their confidence that the Lord is among them ends in the sentence that Zion will be plowed as a field.
when: 'Micah prophesied under Jotham, Ahaz and Hezekiah of Judah, about 740–700 B.C.'

setting: |
  Chapter 3 closes the book's first part, chapters 1–3, a warning that Samaria and Jerusalem will be destroyed “because of idolatry, oppression of the poor, and the corruption of religious leaders.” In this chapter the judgment falls “especially because of the iniquity of their political and religious leaders.”

  The address is to Judah. The chapter's own words place it: the leaders it accuses “build up Zion with blood, and Jerusalem with iniquity” (verse 10), and the sentence in verse 12 falls on Jerusalem and its temple hill. Its focus is corruption in Judah's courts and in its religion, “thanks especially to false prophets.”

  “Hear” opens the chapter, as it opened the book ([[Micah 1:2]]) and will open its last part ([[Micah 6:1]]), and some readers divide the book by those three calls. Read that way, or as one of “three sequences (chapters 1–2, chapters 3–5, and chapters 6–7),” the chapter opens a new movement; read the Church's way, it ends the first. Either way, the promise of chapter 4 follows it directly.

thread: |
  The chapter is three speeches of four verses each: to the rulers (verses 1–4), to the prophets (verses 5–8), and to rulers, priests and prophets together, with the sentence on Jerusalem (verses 9–12). One word runs through them. The rulers ought “to know judgment” (verse 1); Micah is “full of … judgment” (verse 8); the rulers “abhor judgment” (verse 9). The word is justice, and the chapter is about what happens to a city when those charged with justice sell it.

  Each class has turned its office into a living. The judges take bribes and treat the people like meat; the prophets say “Peace” to those who feed them; the priests teach for hire. And all of them feel safe, because the temple stands among them: “Is not the LORD among us?” Micah answers that confidence directly: Zion will be plowed as a field, and the temple hill will become like the high places of a forest.

  Micah does not end there. The next verse, [[Micah 4:1]], sets “the mountain of the house of the LORD” on top of the mountains, so that the temple hill left to the forest in 3:12 becomes, in the next chapter's vision, the mountain the nations climb. The book “interrupts these harsh words with a prophetic message of promise,” a vision of the wasted temple mount restored.

sections:
  - range: 1-4
    heading: Rulers who devour the people
    plain: |
      And I said: Hear, I pray you, you heads of Jacob and rulers of the house of Israel. Is it not your duty to know justice? You hate the good and love the evil. You strip the skin off my people and the flesh off their bones. You eat their flesh, flay their skin, break their bones and chop them up like meat for the pot, like flesh in the cauldron. Then they will cry to the LORD, and He will not answer them. He will hide His face from them at that time, because of the evil they have done.
  - range: 5-8
    heading: Prophets for hire, and a prophet full of power
    plain: |
      This is what the LORD says about the prophets who lead my people astray: when they have something to chew on, they cry “Peace,” but against anyone who puts nothing in their mouths they prepare war. So night will come on you, with no vision, and darkness, with no divining. The sun will go down on the prophets, and the day will turn black over them. The seers will be ashamed and the diviners disgraced; they will all cover their faces, because no answer comes from God. But I am full of power by the Spirit of the LORD, and full of justice and of strength, to tell Jacob his transgression and Israel his sin.
  - range: 9-12
    heading: Zion built with blood
    plain: |
      Hear this, I pray you, heads of the house of Jacob and rulers of the house of Israel, who hate justice and twist all that is straight. You build Zion with blood and Jerusalem with wrongdoing. Jerusalem's heads judge for a bribe, her priests teach for pay, her prophets divine for money, and yet they lean on the LORD and say, “Is not the LORD among us? No harm can come to us.” Therefore, because of you, Zion will be plowed like a field, Jerusalem will become heaps of ruins, and the mountain of the temple will be like the overgrown heights of a forest.

notes:
  - ref: 1
    phrase: O heads of Jacob, and ye princes of the house of Israel; Is it not for you to know judgment?
    kind: history
    title: The rulers who should know justice
    body: |
      The “heads of Jacob” and “princes” are Jerusalem's men in authority, and in this chapter above all its judges. The word rendered “princes” means a “ruler, man in authority,” and what Micah goes on to describe is “the judicial system in Jerusalem,” with judges who “hate the good, and love the evil” (verse 2).

      So the question at the end of the verse is pointed. “Judgment” here is not doom but justice (the note on verse 8 has the word), and knowing it was their office. Verse 9 says the same men “abhor judgment”; verse 11 says how: “the heads thereof judge for reward.”
    sources: [bdb, spencer-remnant]

  - ref: 3
    phrase: Who also eat the flesh of my people
    kind: symbol
    title: Rulers as butchers
    body: |
      Verses 2–3 describe the rulers as if they were butchering an animal for the pot, and the point is the comparison: they treat the people as meat. Micah likens the rulers “and their use of administrative powers to a group of cannibals who eat the flesh and break the bones of their own people,” imagery “that seared in its condemnation of their wickedness.” The courts that should have protected the weak were consuming them; it is the judicial system itself that is “cannibalistic.”
    sources: [ot-manual-11, spencer-remnant]

  - ref: 5
    phrase: that bite with their teeth, and cry, Peace; and he that putteth not into their mouths, they even prepare war against him
    kind: words
    title: Peace for a meal, war for no meal
    body: |
      The two halves of the sentence are a pair: the prophets promise peace to whoever feeds them and war to whoever does not. “Bite with their teeth” is read with “cry, Peace,” in the sense of “who preach peace if they can bite with their teeth,” that is, “if they receive something to bite (or eat).” An ancient Aramaic translation already read it this way.

      “Prepare war” is stronger in Hebrew. It is literally to “sanctify” war, “to preach a holy war,” and the idiom comes from the “custom of opening campaign by sacrifice.” Against the man who put nothing in their mouths, such prophets would “proclaim the vengeance of God.”

      Ezekiel met the same trade in Jerusalem; the note on [[Ezek. 13:19]] sets his words beside this verse.
    sources: [keil-micah, bdb, oshb-wlc]

  - ref: 7
    phrase: they shall all cover their lips; for there is no answer of God
    kind: symbol
    title: 'Covering the mouth: no answer from God'
    body: |
      To “cover their lips” is a gesture of shame, and the reason given for it is that God has stopped answering. The Hebrew word is the moustache, and the same phrase describes the leper, who “shall put a covering upon his upper lip, and shall cry, Unclean, unclean” ([[Lev. 13:45]]), and the mourner whom Ezekiel was told not to imitate: “cover not thy lips” ([[Ezek. 24:17]]).

      The punishment fits the offence. Prophets who sold visions get none: “night shall be unto you, that ye shall not have a vision” (verse 6). When false prophets prevail, “true prophecy would cease throughout the land,” and the land is left with “a night without vision or a day without light.”
    sources: [bdb, ot-manual-11]

  - ref: 8
    phrase: But truly I am full of power by the spirit of the LORD, and of judgment, and of might
    kind: words
    title: Full of justice
    body: |
      Micah sets himself against the prophets of verses 5–7, and what he claims to be full of is the very thing the rulers lack. “Judgment” here is the same Hebrew word, *mishpat*, as in verse 1 (“to know judgment”) and verse 9 (“that abhor judgment”). It means first “a verdict … pronounced judicially” and then, “abstractly, justice.” The heads of Jacob ought to know it and hate it instead; the prophet is filled with it.

      The source of his fullness is the point of the contrast. The hirelings speak when they are fed; Micah's power is “by the spirit of the LORD,” and its purpose is the one message they will not give, “to declare unto Jacob his transgression, and to Israel his sin.”
    sources: [oshb-wlc, strongs-concordance]

  - ref: 10
    phrase: They build up Zion with blood
    kind: history
    title: Built with blood
    body: |
      Zion is being built with what the leaders take from the people. They “obtain the means of erecting splendid buildings by cruel extortions, and partly also by actual judicial murders,” as Ahab did when he took Naboth's vineyard, and as Jehoiakim would later do. Jeremiah's woe on Jehoiakim fits this verse: “Woe unto him that buildeth his house by unrighteousness, and his chambers by wrong” ([[Jer. 22:13]]; compare [[1 Kgs. 21:13–16]]). The city is going up “with blood” and “with iniquity” rather than “with truth and justice.”

      The irony is that such builders “do not, however, truly build the city by this, they simply labour for its destruction.” Verse 12 shows what their building comes to.
    sources: [keil-micah, spencer-remnant, lds-scriptures]

  - ref: 11
    phrase: The heads thereof judge for reward, and the priests thereof teach for hire, and the prophets thereof divine for money
    kind: scripture
    title: Judges, priests and prophets for hire
    body: |
      Verse 11 names the judges, the priests and the prophets, and puts a price on each. The judges take bribes, the priests charge for teaching the law, the prophets sell their oracles: “The leaders, priests, and prophets were all taking money for their services.” The rulers found it easy “—for a price—to hire professional religionists to cover their actions by flattery and falsehood.”

      The Church's footnote at “money” is “TG Priestcraft,” the sin Nephi defines: “priestcrafts are that men preach and set themselves up for a light unto the world, that they may get gain and praise of the world; but they seek not the welfare of Zion” ([[2 Ne. 26:29]]). Isaiah, Micah's contemporary, said much the same of Jerusalem's princes: “every one loveth gifts, and followeth after rewards” ([[Isa. 1:23]]), a verse that belongs beside Micah 3:9–12.
    sources: [correa-jonah, ot-manual-11, lds-scriptures, scripture-helps-micah]

  - ref: 11
    phrase: Is not the LORD among us? none evil can come upon us
    kind: history
    title: Is not the LORD among us?
    body: |
      The leaders felt safe because the Lord's house stood in their city. They “placed their reliance upon Jehovah, upon the assurance that He was in the midst of them enthroned in His temple at Jerusalem, and that He would protect the city.” What they forgot was what His presence asks. They trusted it “without ever reflecting that Jehovah as the Holy One demands sanctification of life.”

      That is why the next verse names the temple hill in particular: it is mentioned “for the purpose of destroying all false trust in the temple.” Jeremiah later faced the same confidence in another form, “The temple of the LORD, The temple of the LORD” ([[Jer. 7:4]]); the note on that verse explains why the temple felt like a guarantee.
    sources: [keil-micah]

  - ref: 12
    phrase: Therefore shall Zion for your sake be plowed as a field, and Jerusalem shall become heaps
    kind: scripture
    title: 'Zion plowed: a warning remembered'
    body: |
      The destruction Micah announces “for your sake,” because of the leaders of verses 9–11, did not come in Hezekiah's day, and a century later his warning was remembered. “Heaps” are heaps of ruins. When the Assyrians came in Hezekiah's reign, they took “every major stronghold of Judah except one,” and “in the end, Jerusalem was preserved.”

      A century later the verse was still remembered. When Jeremiah was on trial for prophesying the temple's fall, “certain of the elders of the land” quoted it: “Micah the Morasthite prophesied in the days of Hezekiah king of Judah … Zion shall be plowed like a field” ([[Jer. 26:18]]). They went on to give their own account of why it had not come to pass: “did he not fear the LORD, and besought the LORD, and the LORD repented him of the evil which he had pronounced against them?” ([[Jer. 26:19]]). As the elders read it, a warning that was heeded was turned aside, not proved false; the note on [[Jer. 26:18]] has the rest of the elders' argument. The temple did fall at last, destroyed by “Nebuchadnezzar's armies in 586 BC.”
    sources: [lds-scriptures, scripture-helps-micah, vandyke-ogden-twelve, bdb]

  - ref: 12
    phrase: the mountain of the house as the high places of the forest
    kind: symbol
    title: The temple hill gone to forest
    body: |
      “The house” is the temple (the Church's footnote: “IE the temple”), and the picture is of its hill abandoned to the wild. “High places” is a pointed word in a book that opened by condemning them ([[Micah 1:5]]). On one reading, the temple “would be left like any other destroyed high place,” set on a level with the idolatrous shrines Micah condemned.

      The next verse answers this one: “the mountain of the house of the LORD shall be established in the top of the mountains” ([[Micah 4:1]]). The notes on chapter 4 take that up.
    sources: [lds-scriptures, correa-jonah]

christ: |
  Micah's rulers fed on the people and his prophets preached for bread. Nephi describes a Lord who is their opposite: He “doeth not anything save it be for the benefit of the world; for he loveth the world, even that he layeth down his own life that he may draw all men unto him” ([[2 Ne. 26:24]]), and “He commandeth that there shall be no priestcrafts” ([[2 Ne. 26:29]]). The leaders of Jerusalem took from those they were charged to protect; Christ gives Himself for the people.

  The same rule governs those who teach and lead in His Church now: “the laborer in Zion shall labor for Zion; for if they labor for money they shall perish” ([[2 Ne. 26:31]]). The Lord's presence among His people is not a guarantee that covers injustice; it is a call to the justice that Micah was “full of … by the spirit of the LORD.”

explore: |
  - [[Jer. 26:16–19]]: the elders quote Micah 3:12 and save Jeremiah's life.
  - [[Jer. 7:1–15]]: Jeremiah's temple sermon, against the same confidence as Micah 3:11.
  - [[Ezek. 13:1–23]]: the false prophets of Ezekiel's day, who also cried “Peace.”
  - [[Isa. 1:21–26]]: Isaiah on Jerusalem's corrupt princes, in the same years.
  - [[2 Ne. 26:29–31]]: Nephi on priestcraft and the laborer in Zion.
  - [[Micah 4:1–2]]: the temple hill of 3:12, raised above the mountains.

