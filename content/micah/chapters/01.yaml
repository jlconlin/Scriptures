chapter: 1
title: The LORD Cometh Forth out of His Place
tagline: The Lord comes down to testify against Samaria and Jerusalem, and Micah mourns barefoot through the towns of his own countryside, each name a sign of its fate.
when: 'Micah prophesied under Jotham, Ahaz and Hezekiah of Judah, about 740–700 B.C.'

setting: |
  The book's heading dates Micah by three kings of Judah, Jotham, Ahaz and Hezekiah, which puts him in the second half of the eighth century B.C., at the same time as Isaiah. His name is a shortened form of Micaiah, meaning “Who is like the Lord?”, and he is not the older prophet Micaiah the son of Imlah ([[1 Kgs. 22:8]]). “The Morasthite” means he came from Moresheth-gath (verse 14), a town in the Shephelah, the low hills between Judah's coastal plain and its hill country, about twenty miles southwest of Jerusalem and near the border with the Philistines.

  His message was directed to the two capitals, Samaria in the north and Jerusalem in the south. Verse 6 speaks of Samaria's fall as still to come; the Assyrians took it after a siege of three years ([[2 Kgs. 17:5–6]]), in 722 or 721 B.C. The lament over the towns of Micah's countryside (verses 10–16) is generally dated before Sennacherib's campaign against Judah in 701 B.C. [Two Kingdoms and Assyria](/old-testament/guides/two-kingdoms-and-assyria/#rulers) tells both events.

  The heading calls the book “the word of the LORD that came to Micah.” The book likely reached its final form after Micah's death, though opinions differ on when. The first of its three parts, chapters 1–3, warns that Samaria and Jerusalem will be destroyed.

thread: |
  The Lord comes to court, and **the case begins at the top.** Verse 2 summons the whole earth to hear the Lord testify, and in verses 3–4 He comes out of His place and down onto the heights, the mountains melting under Him. Verse 5 names the cause as two cities: the transgression of Jacob is Samaria, and the high places of Judah are Jerusalem. The capitals are the sources of the corruption that has spread over both kingdoms.

  Samaria falls first (verses 6–7), and then the wound moves south: “it is come unto Judah; he is come unto the gate of my people, even to Jerusalem” (verse 9). Micah does not stand apart from it. He mourns barefoot and naked (verse 8), and his lament runs through the towns of his own countryside, each meeting a fate that fits its name, and his own town is among them (verse 14).

  The judgment runs through chapter 3. Chapters 4–5 answer it with a promise that God will restore His people, and the third part, chapters 6–7, ends the book on His willingness to forgive all who repent ([[Micah 7:18–20]]).

sections:
  - range: 1-1
    heading: The heading
    plain: |
      This is the word of the Lord that came to Micah of Moresheth in the days of Jotham, Ahaz and Hezekiah, kings of Judah: what he saw concerning Samaria and Jerusalem.
  - range: 2-4
    heading: The Lord comes down
    plain: |
      Listen, all you peoples; pay attention, earth and everything in it. The Lord God, from His holy temple, will testify against you. Look: the Lord is coming out of His place. He will come down and walk on the heights of the earth. The mountains will melt under Him and the valleys split open, like wax before the fire, like water poured down a slope.
  - range: 5-7
    heading: Samaria first
    plain: |
      All this is for the transgression of Jacob and the sins of the house of Israel. What is Jacob's transgression? Is it not Samaria? And what are Judah's high places? Are they not Jerusalem? So I will make Samaria a heap of stones in the field, a place for planting vineyards. I will pour her stones down into the valley and lay bare her foundations. All her carved images will be smashed, all her wages burned with fire, and all her idols I will make a ruin. She gathered them from a prostitute's wages, and they will go back to being a prostitute's wages.
  - range: 8-9
    heading: Micah mourns
    plain: |
      For this I will wail and howl. I will go barefoot and naked. I will wail like the dragons and mourn like the ostriches. Her wound cannot be healed, for it has come to Judah; it has reached the gate of my people, Jerusalem itself.
  - range: 10-16
    heading: The lament over the towns
    plain: |
      Don't tell it in Gath; don't weep at all. In Beth-le-aphrah, the House of Dust, roll yourself in the dust. Pass on your way, people of Saphir, in naked shame. The people of Zaanan did not come out. Beth-ezel is mourning, and it will take its support away from you. The people of Maroth wait anxiously for good, but disaster has come down from the Lord to the gate of Jerusalem. People of Lachish, harness the chariot to the swift horses: you were the beginning of sin for the daughter of Zion, for the transgressions of Israel were found in you. So you will give parting gifts to Moresheth-gath. The houses of Achzib will be a deception to the kings of Israel. Again I will bring a conqueror against you, people of Mareshah; the glory of Israel will come to Adullam. Shave your heads and cut off your hair for your pampered children; make yourselves as bald as the vulture, for they have gone from you into captivity.

notes:
  - ref: 2
    phrase: let the Lord GOD be witness against you
    kind: words
    title: A witness in court
    body: |
      The book opens in the language of a courtroom. “Witness” is one of the legal words that run through Micah, with justice, judgment, judge and the indictment of [[Micah 6:1–2]]. On this reading the whole book is a lawsuit the Lord brings against Israel, and its climax is what He requires in [[Micah 6:8]]. Here the Lord Himself testifies against His people, from His holy temple, and all the earth is called to hear it.

      “Hear” also marks the book's structure on one reading, which divides it into three blocks, each opening with a call to action: here, at [[Micah 3:1]] and at [[Micah 6:1]]. On the lawsuit form the prophets use, see [How the prophets speak](/old-testament/guides/hebrew-poetry/#prophets).
    sources: [pierce-micah, correa-jonah]

  - ref: 4
    phrase: the mountains shall be molten under him
    kind: symbol
    title: The Lord comes down
    body: |
      Melting mountains and splitting valleys are the language of a theophany, the Lord appearing in power, and the picture is drawn from storm and earthquake. He comes “from his holy temple” (verse 2), which here is heaven, where He is enthroned, and He treads the heights of the earth as its Ruler. The two similes, wax before the fire and water poured down a slope, say that nothing in His path keeps its shape. The reality behind the picture is most likely the devastation a great judgment brings on a nation, and verse 5 says at once which nation: He comes to judge Israel. The image is older than Micah; the note on [[Isa. 64:3]] follows it back to Sinai and forward to [[D&C 133:40–41]].
    sources: [keil-micah]

  - ref: 5
    phrase: what are the high places of Judah? are they not Jerusalem?
    kind: history
    title: The sin of the capitals
    body: |
      Micah answers his own questions with the names of two cities. In the verse's first line Jacob and Israel together mean the whole covenant people; in the question that follows, Jacob stands for the ten northern tribes, set beside Judah. The capitals are “the centres and sources of the corruption which has spread from them over the kingdoms.” Samaria's charge is apostasy; Jerusalem's is the high places, the unlawful worship that “even the most godly kings were unable to abolish” (compare [[1 Kgs. 15:14]]).

      Naming the capitals names those who ruled from them. Chapters 1–3 hold the nation guilty for the sins of the house of Israel, and especially for the iniquity of its political and religious leaders, as chapter 3 will say outright of Jerusalem's heads, priests and prophets ([[Micah 3:9–11]]).
    sources: [keil-micah, pike-micah]

  - ref: 7
    phrase: she gathered it of the hire of an harlot
    kind: words
    title: A harlot’s wages
    body: |
      “Hires” are wages, and the word is a prostitute's pay. The same Hebrew word stands three times in this verse, and the verse can be rendered “she has gathered them of prostitute's hire, and to prostitute's hire shall they return.” On one reading these are the wages paid to the cult prostitutes of Samaria's worship, and the judgment makes them worthless.

      The image is about the covenant. Judah, like Samaria, had stooped to “the hire of an harlot” by forsaking its covenant with Jehovah and worshiping false gods, so a verse aimed at Samaria reaches Jerusalem too.
    sources: [oshb-wlc, keil-micah, correa-jonah, vandyke-ogden-twelve]

  - ref: 8
    phrase: I will go stripped and naked
    kind: symbol
    title: Barefoot and naked
    body: |
      Micah mourns in his own body before the disaster comes. “Stripped” is better rendered “barefoot,” so the line reads “I will go barefoot and naked.” What follows in verses 10–16 is a dirge, a funeral lament, and Micah performs it barefoot and naked as a sign of the shame Judah's people would feel when they were conquered and treated as captives.

      The “owls” are ostriches in the Hebrew, a bird whose cry stands here for the wailing of mourners. On the dirge as one of the prophets' forms, see [How the prophets speak](/old-testament/guides/hebrew-poetry/#prophets).
    sources: [bdb, pierce-micah]

  - ref: 9
    phrase: he is come unto the gate of my people, even to Jerusalem
    kind: history
    title: To the gate of Jerusalem
    body: |
      The wound that began in Samaria spreads to Judah and reaches Jerusalem's gate, and verse 12 repeats the image: evil “came down from the LORD unto the gate of Jerusalem.” The “gate” likely stands for the whole city, and the line may allude to Sennacherib's siege of Jerusalem in 701 B.C. ([[2 Kgs. 19]]), which Micah lamented probably a few years before it came. That year the king of Assyria came “up against all the fenced cities of Judah” ([[2 Kgs. 18:13]]); Lachish, which the lament names in verse 13, fell to him. Jerusalem itself was not taken: the Lord said of Sennacherib, “He shall not come into this city, nor shoot an arrow there” ([[2 Kgs. 19:32]]).

      What reaches Judah is Samaria's sin as well as its punishment (verse 5); the note on verse 13 gives the reading that Samaria's idolatry came south by way of Lachish.
    sources: [pierce-micah, correa-jonah, lds-scriptures]

  - ref: 10
    phrase: Declare ye it not at Gath
    kind: scripture
    title: David’s lament, and David’s cave
    body: |
      Micah begins his lament with David's. “Declare ye it not at Gath” takes up David's words over Saul and Jonathan, “Tell it not in Gath” ([[2 Sam. 1:20]]). Gath was the Philistine city of Goliath ([[1 Sam. 17:4]]), and the Hebrew plays its name against the verb for “tell.” The echo makes a contrast: David bid the women of Israel weep for the fallen, and Micah forbids weeping.

      The lament turns to David's story again near its end: “the glory of Israel” will come to Adullam (verse 15), where David found refuge in a cave when he fled from Saul ([[1 Sam. 22:1]]). The place stood for refuge in trouble. What “the glory of Israel” means in the verse is not clear.
    sources: [pierce-micah, lds-scriptures]

  - ref: 10
    phrase: in the house of Aphrah roll thyself in the dust
    kind: words
    title: A lament in place names
    body: |
      Verses 10–16 name eleven places and turn each name into a sign of what will happen to it. Aphrah means “Dust or Ashes,” and “each of the cities named in vv. 10–16 will meet a fate appropriate to the meaning of its name.” The wordplay depends on Hebrew sounds that English cannot keep:

      - **Beth-le-aphrah**, the “House of Dust,” is told to roll in the dust (*ʿāpār*), a sign of mourning, with a verb that echoes the word for “Philistines.”
      - **Maroth** means “bitterness,” and it waits for good (verse 12).
      - **Lachish** (*lākîš*) is told to harness its swift horses (*rekeš*; see the note on verse 13).
      - **Moresheth**, Micah's own town, sounds like a word for a farewell gift, and it is given “presents” (verse 14). In naming it Micah includes himself in the judgment he announces.
      - **Achzib** (*ʾakzîb*) will be a lie (*ʾakzāb*) to the kings of Israel (verse 14).
      - **Mareshah** (*mārēšâ*) is promised a *yôrēš* (verse 15). The King James “heir” is better “conqueror” or “plunderer,” so the line is not a promise of hope but a sentence.

      The passage is among the hardest in the book, and the plain words above follow one translation of it. Some towns are identified with confidence, others only tentatively or not at all, and some names may have been chosen for the wordplay alone.
    sources: [lds-scriptures, bowen-ominous-onomastics, pierce-micah]

  - ref: 13
    phrase: she is the beginning of the sin to the daughter of Zion
    kind: history
    title: Lachish, the beginning of sin
    body: |
      Lachish was Judah's chief city after Jerusalem and a sign of safety in the Shephelah, a fortress that fell to Assyria in 701 B.C. Why it should be “the beginning of the sin to the daughter of Zion” the verse does not say, and there are two readings.

      One reads the line with the call to harness the chariots: the sin is trusting horses, chariots and fortifications rather than God, as the prophets warn. The other reads it with verses 5 and 9, where Samaria's sin reaches Judah, and supposes that idolatry came into Judah from Samaria by way of Lachish; excavators have found a shrine in the city's eighth-century gate. Micah returns to both later, when the Lord promises to cut off Judah's horses, chariots and strongholds, and its images ([[Micah 5:10–14]]).
    sources: [pierce-micah, correa-jonah]

  - ref: 16
    phrase: enlarge thy baldness as the eagle
    kind: symbol
    title: Bald as the vulture
    body: |
      The lament ends with a command to mourn. Shaving the head was a sign of grief, with torn clothes, sackcloth, ashes and wailing, and it was also done to captives sent into exile; here the cause is children led away (“poll thee” is “cut off thy hair,” the footnote). The note on [[Jer. 47:5]] sets this verse beside the baldness of Gaza.

      The bird is not the bald eagle a modern reader pictures. The Hebrew *nešer* is better rendered “vulture,” the griffon vulture, whose white head against a brown body made the picture of baldness plain to Micah's hearers.
    sources: [pierce-micah, lds-scriptures]

christ: |
  The Church's footnote to “the LORD” who comes down in verse 3 to judge Samaria and Jerusalem points to the Topical Guide's “Jesus Christ, Second Coming,” and so reads His coming as Christ's. The towns of the lament are given names that spell their ruin, and those puns stand against the promise that a ruler would “come forth” from little Beth-lehem ([[Micah 5:2]]). Micah's own name asks “Who is like the Lord?”, and his book answers at its close: a God “that pardoneth iniquity” and “delighteth in mercy” ([[Micah 7:18]]).

  The judgment of this chapter falls on what Judah trusted in place of the Lord, its idols and its fortified cities. The same Lord is willing to forgive all who repent and to “cast all their sins into the depths of the sea” ([[Micah 7:19]]), so that for a disciple His coming is a warning against trusting anything in the Lord's place and a promise of forgiveness to the repentant.

