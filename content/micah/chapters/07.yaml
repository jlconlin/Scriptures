chapter: 7
title: Who Is a God Like unto Thee
tagline: Micah walks through a vineyard after the harvest and finds no one upright left. Then fallen Israel speaks, confesses her sin and waits for the Lord to raise her, and the book closes by asking who is a God like Israel's, who pardons iniquity and casts sins into the depths of the sea.
when: 'Micah prophesied under Jotham, Ahaz and Hezekiah of Judah, about 740–700 B.C.'

setting: |
  Chapter 7 ends the book's third part, chapters 6–7, and the book itself. Each of Micah's three parts moves from doom to the redemption of a remnant, and this last one does the same “with a rather different tone and style”: here the plight of Israel “is presented more personally than it is in Micah 1–5, through a series of laments.”

  Chapter 6 was the Lord's lawsuit against His people, ending in the sentence of 6:13–16. Chapter 7 begins with Micah mourning over the wickedness of the Israelites and the destruction their sins would bring (verses 1–6). Then the voice changes: the people themselves, fallen and in darkness, confess their sin and wait for the Lord (verses 7–10), receive a promise of rebuilt walls and a gathering (verses 11–13), and pray for the Lord to shepherd them again (verses 14–17).

  The book ends “with Micah’s testimony of Jehovah’s compassion and His willingness to forgive all who repent” (verses 18–20). *Come, Follow Me* names its lesson on Micah and his three neighbours “He Delighteth in Mercy” after verse 18: “the Lord does not delight in condemning us, but ‘he delighteth in mercy.’” The book that opened with the Lord coming down to judge ([[Micah 1:3]]) closes “on a particularly hopeful and worshipful note.”

thread: |
  The chapter climbs from lament to praise. **It begins at the bottom** (verses 1–6): a vineyard with no grapes, a land with no one upright, officials who take bribes, the best of men a brier, and a household where a man cannot trust his own wife. The day the watchmen warned of is coming.

  **Verse 7 is the turn.** “Therefore I will look unto the LORD.” From there Micah seems to speak for fallen Israel, and she does not deny her fall. She has sinned, she will bear the Lord's indignation, and she knows He will plead her cause and bring her to the light (verses 8–10). Her enemy, who mocked “Where is the LORD thy God?”, will see it and be ashamed.

  **The promise follows** (verses 11–13): walls built again and people coming from Assyria to Egypt and from sea to sea. Then the people pray (verse 14), asking the Lord to shepherd His flock as in the days of old, and the Lord answers with wonders like those of the Exodus, before which the nations fall silent (verses 15–17).

  **The book ends in praise** (verses 18–20). The last question, “Who is a God like unto thee?”, is answered by what He does: He pardons, does not keep His anger, casts sins into the sea, and keeps the oath He swore to Abraham.

sections:
  - range: 1-6
    heading: No one upright left
    plain: |
      Woe is me! I am like someone who comes after the summer fruit is gathered and the grapes are gleaned: there is no cluster to eat, no first-ripe fig that I long for. The faithful have vanished from the earth, and there is no one upright among men. They all lie in wait to shed blood; each hunts his brother with a net. Their hands are busy with evil. The official and the judge ask for a bribe, and the powerful man says what he wants; so together they pervert justice. The best of them is like a brier, the most upright worse than a thorn hedge. The day your watchmen warned of, the day of your punishment, is coming; then they will be thrown into confusion. Do not trust a friend or rely on a companion; guard what you say even from the wife who lies in your arms. For the son treats his father with contempt, the daughter rises against her mother, the daughter-in-law against her mother-in-law; a man's enemies are the people of his own house.
  - range: 7-10
    heading: When I fall, I shall arise
    plain: |
      But I will look to the LORD; I will wait for the God who saves me; my God will hear me. Do not gloat over me, my enemy: when I fall, I will rise; when I sit in darkness, the LORD will be my light. I will bear the LORD's anger, because I have sinned against Him, until He takes up my case and gives judgment for me. He will bring me out into the light, and I will see His righteousness. Then my enemy will see it, and shame will cover her who said to me, “Where is the LORD your God?” I will see her trampled like mud in the streets.
  - range: 11-13
    heading: A day to build the walls
    plain: |
      A day is coming to build your walls; on that day the decree will be far removed. On that day people will come to you from Assyria and the fortified cities, from the fortress to the River, from sea to sea and from mountain to mountain. But the earth will be desolate because of those who live in it, as the fruit of what they have done.
  - range: 14-17
    heading: Shepherd your people
    plain: |
      Shepherd Your people with Your staff, the flock that is Your inheritance, who live alone in a forest in the middle of Carmel; let them graze in Bashan and Gilead as in the days of old. As in the days when you came out of the land of Egypt, I will show them wonders. The nations will see and be ashamed of all their strength; they will put their hands over their mouths, and their ears will be deaf. They will lick the dust like a snake; like creatures that crawl on the ground they will come trembling out of their holes. They will turn in fear to the LORD our God, and they will fear You.
  - range: 18-20
    heading: Who is a God like You
    plain: |
      Who is a God like You, who pardons iniquity and passes over the transgression of the remnant of His inheritance? He does not hold on to His anger forever, because He delights in mercy. He will have compassion on us again; He will tread our iniquities underfoot. You will throw all their sins into the depths of the sea. You will keep faith with Jacob and show mercy to Abraham, as You swore to our fathers in days long ago.

notes:
  - ref: 1
    phrase: 'as the grapegleanings of the vintage: there is no cluster to eat: my soul desired the firstripe fruit'
    kind: symbol
    title: No cluster left on the vine
    body: |
      Micah pictures himself coming to a vineyard after the harvest, with the grapes picked and nothing left to eat. He mourns over the wickedness of Israel and the destruction its sins will bring, and verse 2 says it without the figure: “The good man is perished out of the earth: and there is none upright among men” ([[Micah 7:2]]).

      The “firstripe fruit” he longs for is the first-ripe fig, which a hungry man would look for and not find. In one reading the prophet sees himself as “a solitary grape, which had escaped the general gathering,” the only one left on God's side, who “desired to see the first-ripe fruit— distinguished and eminent piety; but he found nothing but a very imperfect or spurious kind of godliness.”
    sources: [ot-institute-manual-47, ot-manual-11, nrsvue]

  - ref: 3
    phrase: so they wrap it up
    kind: words
    title: They weave it together
    body: |
      “Wrap it up” means the powerful conspire. The Hebrew verb means “to interlace, i.e. (figuratively) to pervert”: the prince, the judge and the great man weave their wishes together, and so pervert justice.

      The “reward” the judge asks for is a bribe. A modern translation puts the verse plainly: “the official and the judge ask for a bribe, and the powerful dictate what they desire; thus they pervert justice.” The wicked sought to be paid to take part in evil, and in verse 4 the best of them is “no better than briers and thorns that poke and cause pain.”
    sources: [strongs-concordance, nrsvue, correa-jonah]

  - ref: 4
    phrase: the day of thy watchmen and thy visitation cometh
    kind: words
    title: The day of the watchmen
    body: |
      The watchmen are the prophets, and their day is the day they warned of. The Lord calls His prophet “a watchman unto the house of Israel” ([[Ezek. 33:7]]), and the next words explain whose day it is: “thy visitation,” which the Church's footnote glosses “IE punishment.” A modern translation runs the two together: “The day of their sentinels, of their punishment, has come.”

      The verb “cometh” speaks of a future “as certain as if it were already there.” When the day comes, the evil that “now envelopes itself in the appearance of good, will then burst forth without shame and without restraint”: that is the perplexity.
    sources: [keil-micah, lds-scriptures, nrsvue]

  - ref: 8
    phrase: Rejoice not against me, O mine enemy
    kind: history
    title: Fallen Israel speaks
    body: |
      From verse 7 the voice is no longer Micah's lament alone. Israel has learned to “look unto the Lord,” and from verse 8 Micah appears to speak on behalf of the people: Israel's enemies “have prevailed against her because of her wickedness,” and the enemy, a woman in verse 10, taunts Israel with the question “Where is the LORD thy God?” ([[Micah 7:10]]).

      Israel does not deny her fall or blame the enemy for it. She says she has sinned and will bear the Lord's indignation (verse 9), and she is sure of the end: the Lord will plead her cause and bring her out of her darkness “forth to the light” ([[Micah 7:9]]), and her enemy will see it and be ashamed.

      The theme page [“Until He Plead My Cause”](/micah/themes/plead-my-cause/) sets the cause of verse 9 beside the Lord's controversy of 6:2.
    sources: [correa-jonah, ot-manual-11]

  - ref: 11
    phrase: in that day shall the decree be far removed
    kind: words
    title: The decree, or the boundary
    body: |
      The word rendered “decree,” *ḥōq*, usually means “something prescribed, a statute or due,” and the King James reads it so. But *ḥōq* can also mean “prescribed limit, boundary,” and this verse is one of the places listed for that sense, under the boundary “of land of Israel.” Read that way, the line promises not that a decree is cancelled but that the land's borders will reach far out, and a modern translation has: “A day for the building of your walls! On that day the boundary shall be far extended.” The plain words above keep the King James reading; the lexicon's is the alternative.

      Verse 12 says who will come. “The fortified cities” and “the fortress” translate *māṣôr*, which is also a poetic name for Egypt, and a modern translation reads it so: people come “from Assyria to Egypt and from Egypt to the River.”
    sources: [bdb, nrsvue]

  - ref: 14
    phrase: Feed thy people with thy rod
    kind: symbol
    title: The Shepherd’s staff
    body: |
      To “feed” here is to shepherd, and the rod is a shepherd's staff: “The people, as sheep, would be shepherded (fed) with the staff (rod).” A modern translation reads “Shepherd your people with your staff, the flock that belongs to you.” After the promise of verses 11–13, the people pray for it to come true.

      The pastures they ask for are named. Mount Carmel lay in the northwest, Bashan and Gilead in the northeast. These lands may have been the first to fall to Assyria, and the prayer is that they be restored, “as in the days of old.”
    sources: [correa-jonah, nrsvue]

  - ref: 18
    phrase: Who is a God like unto thee
    kind: words
    title: Who is like God?
    body: |
      The prophet's own name asks the book's last question. Micah is a shortened form of Michael and Michaiah, names that ask who is like God and who is like the Lord, and in verse 18 “we see the prophet’s name constituting a part of the prophet’s message: God, not least in his mercy, is incomparable.” The name and the closing question “serve as bookends” of the book. The question also looks back to the song Israel sang at the sea: “Who is like unto thee, O LORD, among the gods?” ([[Ex. 15:11]]).

      At the Red Sea He showed Himself above all gods; here “He now reveals His incomparable nature in grace and compassion.” The words of pardon are “formed after Exodus 34:6-7,” the name the Lord proclaimed to Moses after the golden calf: “merciful and gracious, longsuffering, … forgiving iniquity and transgression and sin” ([[Ex. 34:6–7]]). The “remnant of his heritage” is the remnant of [[Micah 2:12]], and the “mercy” He delights in is the same word as the “mercy” of [[Micah 6:8]].
    sources: [bowen-ominous-onomastics, correa-jonah, keil-micah, oshb-wlc]

  - ref: 19
    phrase: thou wilt cast all their sins into the depths of the sea
    kind: symbol
    title: Into the depths of the sea
    body: |
      Casting sins into the sea recalls how the Lord once drowned Israel's oppressor there. At the Exodus “the depths have covered them: they sank into the bottom as a stone” ([[Ex. 15:5]]). Micah turns the image on Israel's sins: the Lord will “tread down its sins, i.e., conquer their power and tyranny by His compassion, and cast them into the depths of the sea, as He once conquered the tyrant Pharaoh.”

      Hezekiah used a like figure: “thou hast cast all my sins behind thy back” ([[Isa. 38:17]]; the note there gathers the images). Elder Dale G. Renlund quoted verses 18–19 to show that “God delights in mercy and does not begrudge its use”; his reading of loving mercy is in the note on [[Micah 6:8]].
    sources: [keil-micah, renlund-do-justly]

  - ref: 20
    phrase: the mercy to Abraham, which thou hast sworn unto our fathers from the days of old
    kind: scripture
    title: The oath to Abraham
    body: |
      Micah's last line rests the whole hope of the book on an old promise, the one the Lord swore to the fathers. The Church's footnotes follow it into the New Testament and the Book of Mormon. Before Jesus was born, Mary sang of mercy “as he spake to our fathers, to Abraham, and to his seed for ever” ([[Luke 1:55]]), and Zacharias, at the birth of his son John, praised the Lord for coming “to perform the mercy promised to our fathers, and to remember his holy covenant; the oath which he sware to our father Abraham” ([[Luke 1:72–73]]).

      In the Book of Mormon the Lord says that when His people are gathered home, He will show those who fight against His word “that I am God, and that I covenanted with Abraham that I would remember his seed forever” ([[2 Ne. 29:14]]).
    sources: [lds-scriptures, ot-institute-manual-47]

christ: |
  Micah's question, “Who is a God like unto thee, that pardoneth iniquity?”, has its full answer in Jesus Christ: the grace and compassion of verse 18 “are only fully revealed in the restoration and blessing of the remnant of His nation by Jesus Christ,” and the oath of verse 20 is the one Zacharias praised God for remembering as that redemption began ([[Luke 1:68–73]]). Verses 7–9 set the pattern for a disciple now: as we repent of our sins, we will be forgiven, “because the Lord delights in mercy.” And He gives it gladly: “surely the thing God enjoys most about being God is the thrill of being merciful, especially to those who don’t expect it and often feel they don’t deserve it.”

explore: |
  - **Foes of one's own household.** [[Matt. 10:34–36]] and [[Luke 12:51–53]], where the Saviour appears to have had verse 6 in mind (the Church's footnotes at verse 6 point there).
  - **The Lord's name proclaimed at Sinai.** [[Ex. 34:5–9]], the words verse 18 is built on.
  - **The song at the sea.** [[Ex. 15:1–13]], for verses 15 and 19.
  - **Sins removed.** [[Isa. 38:17]] and [[Ps. 103:8–12]].
  - **The remnant in Micah.** [[Micah 2:12–13]], [[Micah 4:6–7]] and [[Micah 5:7–8]].
  - **The oath to Abraham fulfilled.** [[Luke 1:46–55]] and [[Luke 1:68–79]].

