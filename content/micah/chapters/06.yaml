chapter: 6
title: What Doth the Lord Require
tagline: The Lord takes His people to court with the mountains as witnesses and asks what He has done to weary them. They ask whether ever larger sacrifices, up to a firstborn child, will satisfy Him; the prophet answers with what they had already been told, and the Lord names the false weights and the treasures of wickedness in the city.
when: 'Micah prophesied under Jotham, Ahaz and Hezekiah of Judah, about 740–700 B.C.'

setting: |
  Chapter 6 opens the last of the book’s three parts, chapters 6–7, “prophecies of a mixed character” in which the Lord “recounts His past goodness” to His people and requires “justice, goodness, and humility” of them. It begins with a summons to hear, as 1:2 and 3:1 do; the book can also be divided at those three calls.

  The chapter is a courtroom scene, an imagined conversation between the Lord and the people of Judah, who were going through the motions of worship by offering sacrifices while they went on in their sins. The Lord brings a case and calls witnesses. The form, a prophetic lawsuit, is explained in the note on [[Hosea 4:1]], and the site’s guide has it under [How the prophets speak](/old-testament/guides/hebrew-poetry/#prophets). Micah uses legal words throughout the book, and this indictment, with the answer of verse 8, is its climax.

  The notes on verse 8 give the reading of the people’s questions in verses 6–7 and the answer in verse 8 by Elder Dale G. Renlund of the Quorum of the Twelve Apostles. The second half of the chapter makes the charge concrete: the city’s false weights and the kings it imitates.

thread: |
  The chapter is a trial, and it moves through it in order. First the Lord states His case (verses 1–5): He calls the mountains to hear, invites His people to name anything He has done against them, and answers with what He did do: brought them out of Egypt, gave them Moses, Aaron and Miriam, turned Balaam’s curse into blessing, and brought them from Shittim to Gilgal.

  Then the people speak (verses 6–7), and instead of a defence they ask what offering will settle it; their offers grow from yearling calves to thousands of rams to a child. The answer (verse 8) is that they had already been told what is good, and it was not a larger offering: to do justly, to love mercy, and to walk humbly with God.

  The last part (verses 9–16) shows what they did instead. In the city the measures are short and the weights false, the rich are violent and the people lie, and Judah keeps the statutes of Omri and Ahab. The sentence is food that does not satisfy and harvests that are never gathered. Chapter 7 closes the book with the God who “delighteth in mercy” ([[Micah 7:18]]).

sections:
  - range: 1-5
    heading: The Lord’s case
    plain: |
      Hear now what the LORD says: Stand up and plead your case before the mountains, and let the hills hear your voice. Hear, you mountains and enduring foundations of the earth, the LORD’s case: the LORD has a case against His people, and He will argue it with Israel. My people, what have I done to you? How have I worn you out? Testify against me. I brought you up out of Egypt and redeemed you from the house of slavery, and I sent Moses, Aaron and Miriam before you. My people, remember what Balak king of Moab planned, and what Balaam son of Beor answered him, and what happened from Shittim to Gilgal, so that you may know the LORD’s righteous acts.
  - range: 6-8
    heading: What doth the LORD require
    plain: |
      With what shall I come before the LORD and bow before God on high? Shall I come with burnt offerings, with calves a year old? Will the LORD be pleased with thousands of rams, with ten thousand rivers of oil? Shall I give my firstborn for my transgression, my own child for the sin of my soul? You have been shown, O man, what is good. What does the LORD ask of you but to do justly, to love mercy, and to walk humbly with your God?
  - range: 9-12
    heading: Short measures in the city
    plain: |
      The LORD’s voice cries out to the city, and the wise will see Your name: listen to the rod, and to the One who appointed it. Are there still treasures gained by wickedness in the house of the wicked, and the short measure that is cursed? Shall I count a man innocent who uses dishonest scales and a bag of false weights? The rich of the city are full of violence, its people speak lies, and their tongues deceive.
  - range: 13-16
    heading: The sentence
    plain: |
      So I will make you sick with my blows and make you desolate because of your sins. You will eat and not be satisfied, and your downfall will be in your own midst; you will try to carry things away and not save them, and what you do save I will give to the sword. You will sow and not reap; you will tread olives and not anoint yourself with the oil, and press grapes and not drink the wine. For the statutes of Omri are kept, and all the practices of the house of Ahab, and you follow their counsels. So I will make you a desolation and your people an object of hissing, and you will bear the reproach of my people.

notes:
  - ref: 1
    phrase: contend thou before the mountains, and let the hills hear thy voice
    kind: symbol
    title: The mountains as witnesses
    body: |
      The mountains and hills are summoned as witnesses to the Lord’s dispute with His people. A case at law needs witnesses, and the Lord calls on the land itself to hear this one. The practice is an old one in Israel: Isaiah opens his book with heaven and earth as the witnesses, “Hear, O heavens, and give ear, O earth” ([[Isa. 1:2]]).

      “Controversy” in verse 2 is the courtroom word explained in the note on [[Hosea 4:1]], which gives this verse as an example of the form.
    sources: [correa-jonah, sc-knowhy-179]

  - ref: 3
    phrase: what have I done unto thee? and wherein have I wearied thee? testify against me
    kind: words
    title: The Lord asks to be accused
    body: |
      In His own lawsuit the Lord first asks what He has done to deserve His people’s rejection. “Testify against me” is, in Hebrew, *ʿănēh bî*, literally answer against me: the verb is the ordinary one for answering, which is also used for giving testimony. The one who brings the case invites the accused to bring a charge against Him. The people bring none; in verses 6–7 they ask instead what to offer. On one reading the weariness was theirs, not His: the Lord had always been protective and loving, and the people had grown weary and lost their trust in Him. Verses 4–5 answer the question with what He had done for them.
    sources: [ot-institute-manual-47, oshb-wlc, bdb, correa-jonah]

  - ref: 5
    phrase: from Shittim unto Gilgal
    kind: history
    title: From Shittim to Gilgal
    body: |
      Shittim was the district east of the Jordan, opposite Jericho, where Israel camped before it crossed; Gilgal was the camp of the first night on the other side, where the twelve stones from the riverbed were set up as a monument to the Jordan’s parting ([[Josh. 4:19–20]]). Balak hired Balaam while Israel was camped “in the plains of Moab on this side Jordan by Jericho” ([[Num. 22:1]]), and the curse he was hired to speak the Lord “turned … into a blessing” ([[Deut. 23:5]]); the setting of [[Num. 22]] notes that Micah remembers Balaam more kindly than later writers do. By Gilgal the people were in the land.

      What they are to “know” from it is “the righteousness of the LORD.” The Hebrew noun, *tsidqōt*, is plural, and in the plural it means “righteous acts”: the Lord asks them to remember not a quality but things He did.
    sources: [bd-shittim, bd-gilgal, lds-scriptures, oshb-wlc, bdb]

  - ref: 7
    phrase: shall I give my firstborn for my transgression, the fruit of my body for the sin of my soul?
    kind: symbol
    title: From calves to a firstborn
    body: |
      The people’s offers climb, from yearling calves to thousands of rams and ten thousand rivers of oil, and then to a child. Elder Dale G. Renlund reads the questions as satire: the people wonder whether some offering large enough could make up for sin. The answer is no. Salvation is not earned, and not even sacrifices on this impossible scale could redeem the smallest sin.

      The last offer named a real practice. The offering of a firstborn may have been an ancient practice in Israel. The account of Abraham and Isaac, in which the Lord stops the sacrifice ([[Gen. 22:2]]), has been read as a condemnation of it. A century after Micah, the Lord says through Jeremiah of the children burned in the valley of Hinnom, “which I commanded them not, neither came it into my heart” ([[Jer. 7:31]]). Whether the Lord rejected sacrifice itself is taken up in the note on [[Isa. 1:11]].
    sources: [renlund-do-justly, correa-jonah, lds-scriptures]

  - ref: 8
    phrase: He hath shewed thee, O man, what is good
    kind: words
    title: Who has told
    body: |
      Verse 8 says the answer was not new: the people asking what will please the Lord had already been told. In Hebrew the verb “has told” names no subject. The King James supplies “He,” the Lord, and a modern translation does the same: “He has told you, O mortal, what is good.” It can also be read as impersonal, “one has told,” meaning Moses in the law, and one translation keeps it so: “It hath been told thee, O man.” The same turn of thought stands in Deuteronomy, where Moses asks “what doth the LORD thy God require of thee” ([[Deut. 10:12]]).

      On either reading the people’s question had been answered before they asked it.
    sources: [oshb-wlc, nrsvue, keil-micah, ot-manual-11]

  - ref: 8
    phrase: to do justly, and to love mercy, and to walk humbly with thy God
    kind: prophets
    title: Three interconnected elements
    body: |
      Elder Dale G. Renlund reads the three requirements as one whole: Micah’s direction “contains three interconnected elements.” To do justly is to act honorably with God and with other people; a person acts honorably with God by walking humbly with Him and with others by loving mercy. Doing justly, so understood, is a practical application of the two great commandments ([[Matt. 22:37–39]]). Of the middle requirement he says, “Loving mercy means that we do not just love the mercy God extends to us; we delight that God extends the same mercy to others.”

      “Mercy” is *ḥesed*, the word explained in the note on [[Jonah 2:8]]; a modern translation renders the phrase “to love kindness.”

      In Elder Renlund’s reading, doing justly includes making covenants with God and keeping them, so the requirement of verse 8 does not stand apart from the ordinances. How the prophets set mercy beside sacrifice is followed in [[Hosea 6:6]] and on the theme page [Keep Mercy and Judgment](/hosea/themes/mercy-not-sacrifice/).
    sources: [renlund-do-justly, oshb-wlc, nrsvue]

  - ref: 9
    phrase: 'the man of wisdom shall see thy name: hear ye the rod, and who hath appointed it'
    kind: words
    title: The rod, or the tribe
    body: |
      Verse 9 is a hard line in Hebrew, and the ancient translations read it differently from the King James. Where the King James has the man of wisdom “see” the Lord’s name, all the ancient versions read “fear”: the Greek has “he shall save those that fear his name,” and a modern translation follows it. Read as the Hebrew stands, the line says the Lord’s name “has the true wisdom of life in sight.”

      The word for “rod” can also mean a tribe, so the Greek and the same modern translation have “Hear, O tribe.” Read as “rod,” the line calls Jerusalem to heed the punishment the Lord has appointed; the rod has been taken to be the power of Assyria, which Isaiah calls “the rod of mine anger” ([[Isa. 10:5]]). The King James reading is followed above; the line is uncertain either way.
    sources: [keil-micah, lxx-rahlfs, nrsvue, bdb]

  - ref: 10
    phrase: the scant measure that is abominable
    kind: words
    title: A short measure under a curse
    body: |
      The “scant measure” is a short ephah, literally an “ephah of scantness, scant measure,” and “abominable” translates *zeʿûmâ*, a word for something denounced or cursed. The law had said the same of everyone who keeps two sets of weights and measures: they “are an abomination unto the LORD thy God” ([[Deut. 25:16]]).

      Verse 11’s “wicked balances” and “bag of deceitful weights” complete the picture of a rigged sale; the note on [[Amos 8:5]] describes how it worked.
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 15
    phrase: Thou shalt sow, but thou shalt not reap
    kind: scripture
    title: The covenant’s own curses
    body: |
      The punishments of verses 14–15 rest on the law’s curses for breaking the covenant in [[Lev. 26:25–26]] and [[Deut. 28:39–40]]. Leviticus has the eating without being filled: “ye shall eat, and not be satisfied” ([[Lev. 26:26]]). In Hebrew, part of verse 15 is taken word for word from Deuteronomy, which the King James renders “thou shalt not anoint thyself with the oil” ([[Deut. 28:40]]). The Lord’s sentence is the one the covenant had already named.
    sources: [keil-micah, lds-scriptures]

  - ref: 16
    phrase: the statutes of Omri are kept, and all the works of the house of Ahab
    kind: history
    title: The statutes of Omri
    body: |
      Omri and his son Ahab were kings of the northern kingdom in the ninth century B.C. (about 884–852), more than a century before Micah. Their statutes and practices led the people into sin. Scripture says Omri “did worse than all that were before him” ([[1 Kgs. 16:25]]), and that Ahab took Jezebel to wife “and went and served Baal” ([[1 Kgs. 16:31]]).

      Micah’s hearers are the people of Judah, and they are charged with keeping a northern dynasty’s statutes: Omri, Ahab and Jezebel “were the models followed by the Israelites in the days of this prophet.” Those who follow those kings’ counsels are told they will share the desolation and the scorn.
    sources: [correa-jonah, lds-scriptures, ot-institute-manual-47, ot-manual-11]

christ: |
  Verse 6 asks how a person can come before the Lord, and Elder Renlund answers it with Jesus Christ. No offering, however vast, could redeem a single sin; through Christ’s Atonement, by obedience to the laws and ordinances of the gospel, a person can be redeemed and become what no payment could make him, and the risen Lord, ending the burnt offerings, asked instead for “a broken heart and a contrite spirit” ([[3 Ne. 9:20]]). For a disciple now, the requirement of verse 8 is lived in covenants made and kept, with the Holy Ghost teaching how to walk humbly with God.

explore: |
  - **The same question in the law.** [[Deut. 10:12–13]].
  - **Mercy, and not sacrifice.** [[1 Sam. 15:22]], [[Hosea 6:6]], [[Amos 5:21–24]] and [[Isa. 1:11–17]].
  - **Amulek and Micah’s questions.** Amulek’s sermon on the last sacrifice in [[Alma 34:10–16]] may echo Micah 6:6–8, taking his questions in reverse order before turning to justice and mercy.
  - **The verdict of mercy.** [[Micah 7:18–20]].
  - **False weights.** [[Lev. 19:35–36]], [[Prov. 11:1]] and [[Amos 8:4–6]].

