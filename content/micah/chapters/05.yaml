chapter: 5
title: Out of Thee Shall He Come Forth
tagline: Jerusalem is besieged and its judge struck on the cheek. From little Beth-lehem comes a Ruler whose goings forth are from everlasting, and He shall be the peace. The remnant of Jacob becomes dew and lion among the nations, and the Lord cuts off His own people’s horses, fortresses and idols.
when: 'Micah prophesied under Jotham, Ahaz and Hezekiah of Judah, about 740–700 B.C.'

setting: |
  The chapter closes the book’s second division, chapters 4–5, the “prophecies of restoration, with brilliant messianic promises.” The first division ended with Zion “plowed as a field” ([[Micah 3:12]]). Chapter 4 answered with the mountain of the Lord’s house, and with a daughter of Zion in labour who must go to Babylon and be redeemed there ([[Micah 4:10]]). Chapter 5 carries on in the same vein: the Lord’s people again gathered for battle, the city under siege.

  The chapter numbers differ. In the Hebrew Bible the King James 5:1 is the last verse of chapter 4 (4:14), and 5:2–15 is Hebrew 5:1–14.

  In Micah’s time Assyria was “the imperial power by which Israel was endangered” (see [Two Kingdoms and Assyria](/old-testament/guides/two-kingdoms-and-assyria/#rulers)), and the chapter names it three times in verses 5–6. The note on verse 5 takes up what that promise meant then and what it came to mean.

  Two passages of the chapter are used again in later scripture. The chief priests and scribes answer Herod from verse 2 ([[Matt. 2:4–6]]). The resurrected Saviour quotes verses 8–15 to the Nephites ([[3 Ne. 20:16–17]]; [[3 Ne. 21:12–18]]), and the notes on verses 8, 10 and 15 follow what He did with them.

thread: |
  The chapter answers a hopeless siege with a Ruler. It opens on a city under siege, where “the judge of Israel” is struck “with a rod upon the cheek” (verse 1). Then the word turns: “But thou, Beth-lehem.” The Ruler comes from a town too small to count, and His goings forth are “from everlasting.” He “shall stand and feed in the strength of the LORD” (verse 4), and “this man shall be the peace” (verse 5).

  The rest of the chapter says how He will be the peace. Read one way, Micah explains it in three steps: “(1) by defending Israel against the attacks of the imperial power (vers. 5 b, 6); (2) by exalting it into a power able to overcome the nations (vers. 7–9); and (3) by exterminating all the materials of war, and everything of an idolatrous nature, and so preventing the possibility of war (vers. 10–15).” The sections below follow that reading. In the last step, the horses, fortresses, sorceries and idols cut off are Israel’s own.

sections:
  - range: 1-1
    heading: The city besieged
    plain: |
      Now gather your troops, city of troops: the enemy has laid siege against us. They strike the judge of Israel on the cheek with a rod.
  - range: 2-4
    heading: The Ruler from Beth-lehem
    plain: |
      But you, Beth-lehem Ephratah, though you are too small to count among the clans of Judah, out of you shall come forth for Me the one who is to be ruler in Israel. His origins are from of old, from days long past. Therefore the Lord will give His people up to their enemies until the time when she who is in labour has given birth. Then the rest of his brothers shall return to the children of Israel. He shall stand and shepherd his flock in the strength of the LORD, in the majesty of the name of the LORD his God. They shall live secure, for now he shall be great to the ends of the earth.
  - range: 5-6
    heading: He shall be the peace
    plain: |
      This man shall be the peace. When the Assyrian comes into our land and tramples our palaces, we will raise against him seven shepherds, even eight leaders of men. They shall lay waste the land of Assyria with the sword, and the land of Nimrod at its gates. So he shall deliver us from the Assyrian when he comes into our land and treads within our borders.
  - range: 7-9
    heading: Dew and lion
    plain: |
      The remnant of Jacob shall be among many peoples like dew from the LORD, like showers on the grass, which wait for no man and depend on no human being. The remnant of Jacob shall be among the nations, in the midst of many peoples, like a lion among the beasts of the forest, like a young lion among flocks of sheep: when it passes through, it tramples and tears, and no one can rescue. Your hand shall be lifted up over your adversaries, and all your enemies shall be cut off.
  - range: 10-15
    heading: What the Lord cuts off
    plain: |
      “In that day,” says the LORD, “I will cut off your horses from among you and destroy your chariots. I will cut off the cities of your land and throw down all your fortresses. I will cut off sorcery from your hand, and you shall have no more fortune-tellers. I will cut off your carved idols and your sacred pillars from among you, and you shall no longer bow down to what your own hands have made. I will pull up your sacred poles from among you and destroy your cities. And in anger and fury I will take vengeance on the nations that have not listened.”

notes:
  - ref: 1
    phrase: they shall smite the judge of Israel with a rod upon the cheek
    kind: history
    title: A city under siege, its judge shamed
    body: |
      The verse pictures Jerusalem under siege and its ruler humiliated. It continues the scene of chapter 4: the enemy “had laid siege to the city and would smite the leader (judge) with a rod.” The opening line is obscure in Hebrew. A modern translation marks its meaning as uncertain and, following the Greek, reads “Now you are walled around with a wall.”

      The one struck is “the judge of Israel” himself. From that hopeless scene the next verse turns to a ruler from Beth-lehem.
    sources: [correa-jonah, nrsvue]

  - ref: 2
    phrase: Beth-lehem Ephratah, though thou be little among the thousands of Judah
    kind: history
    title: Little Beth-lehem, David’s town
    body: |
      Beth-lehem was a small town about five miles south of Jerusalem, and it was David’s. Its name means “house of bread.” Ephratah, or Ephrath, is another name for the town, and also the name of a family of Judah and of the district around it. Adding it marks this Beth-lehem off from a second Bethlehem in the land of Zebulun.

      A modern translation renders “little among the thousands of Judah” as “one of the little clans of Judah”: Beth-lehem was too small to count among Judah’s clans. Yet it was David’s home in his youth, and Samuel anointed him there ([[1 Sam. 16:1–13]]). The Ruler of Israel was to come from the same small town as David.
    sources: [gs-bethlehem, bd-bethlehem, scripture-helps-micah, ot-manual-11, nrsvue, lds-scriptures]

  - ref: 2
    phrase: out of thee shall he come forth unto me that is to be ruler in Israel
    kind: scripture
    title: How Matthew and the Joseph Smith Translation read it
    body: |
      When Herod asked where the Christ would be born, the chief priests and scribes answered from this verse, though not in Micah’s words. Micah calls Beth-lehem “little among the thousands of Judah.” Matthew has “art not the least among the princes of Juda: for out of thee shall come a Governor, that shall rule my people Israel” ([[Matt. 2:6]]). The differences have been explained as a quotation of the substance, given freely. Turning “little” into “not the least” “does not constitute a discrepancy, but simply alters the thought with an allusion to the glorification which Bethlehem would receive.” “Princes” for “thousands” was suggested by the picture of the town as a person and by the ruler named next, and it “does not alter the idea, since the families … had their heads, who represented and led them.”

      The Joseph Smith Translation of the passage has the scribes say, “It is written by the prophets, that he should be born in Bethlehem of Judea.” In the prophecy as it gives it, “in thee shall be born a prince,” and “out of thee shall come the Messiah, who shall save my people Israel” (JST Matt. 3:5–6). It makes plain that the ruler is the Messiah and that He is born there.

      The same verse was later turned against Jesus. “Shall Christ come out of Galilee?” some asked ([[John 7:41–42]]), not knowing He had been born in Bethlehem. John does not answer them by pointing to Bethlehem; he records that those who proclaimed Jesus the Christ “did so out of belief, not out of the certainty” the doubters were seeking.
    sources: [keil-micah, jst-matt-3, scripture-helps-micah, matson-fourth-gospel, lds-scriptures]

  - ref: 2
    phrase: whose goings forth have been from of old, from everlasting
    kind: christ
    title: A Ruler whose origins are from everlasting
    body: |
      Micah names the town and then says the Ruler’s origin lies far beyond it. This is “the only prophecy in the Old Testament that specifically names the birthplace of the Messiah,” and Matthew and Luke record its fulfilment ([[Matt. 2:1]]; [[Luke 2:4–7]]).

      “Goings forth” is *môṣāʾôt*, at this verse “his origin.” A modern translation has “whose origin is from of old” and, in the next line, “from ancient days.” How far back the phrase reaches is read in more than one way. One reading takes the Hebrew to convey “the idea of unknown time”: His origins are out of sight, older than anyone can trace. Another reading takes the words to affirm “the origin of the Messiah before all worlds and His appearances in the olden time,” an origin that “unquestionably presupposes His divine nature.” On either reading, the Ruler’s beginnings lie farther back than His birth in Beth-lehem.
    sources: [scripture-helps-micah, bdb, oshb-wlc, nrsvue, correa-jonah, keil-micah, lds-scriptures]

  - ref: 3
    phrase: until the time that she which travaileth hath brought forth
    kind: symbol
    title: Given up until a birth
    body: |
      The Lord will hand His people over to their enemies for a time, and the time ends with a birth. “Give them up” is used, as elsewhere, of “the surrender of Israel into the power of its enemies as a punishment for its sins.” The woman in labour has been read in two ways. Micah has just used the image for Zion, “like a woman in travail” ([[Micah 4:10]]), and the line can be read with those verses. Most Christian interpreters have read her as the mother of the Ruler of verse 2: “the mother of the Messiah.”

      Then “the remnant of his brethren shall return.” On one reading, His brethren are the people of Judah, the Ruler’s own tribe, and their return is a turning back to the Lord, together with those left of the northern tribes, the “children of Israel.” The remnant itself is explained at [[Micah 2:12]].
    sources: [keil-micah, correa-jonah, lds-scriptures]

  - ref: 5
    phrase: And this man shall be the peace
    kind: christ
    title: He shall be the peace
    body: |
      The verse calls the Ruler himself “the peace.” In this sense “the Messiah is called the Prince of peace in [Isaiah 9:6]” (the note on [[Isa. 9:6]] explains the name).

      “Seven shepherds, and eight principal men” promises more leaders than the danger needs. Seven is “the number of the works proceeding from God, so that seven shepherds, i.e. princes, would be quite sufficient; and this number is surpassed by the eight, to express the thought that there might be even more than were required.”

      The promise against Assyria “did not come about during the time of Assyria. In fact, Judah became a vassal to Assyria.” Two readings carry it further. One takes Assyria, the empire of Micah’s day, as “a type [symbol] of the nations of the world by which the people of the Lord are attacked.” Another finds the fulfilment in Christ’s victory over “His foes: death and the grave,” the victory Paul proclaims in [[1 Cor. 15:55]]. In the first century “Jesus did not participate in any violent defense of Judah.”
    sources: [ot-manual-11, correa-jonah]

  - ref: 7
    phrase: as a dew from the LORD
    kind: symbol
    title: Dew, a blessing or a warning?
    body: |
      The remnant, the descendants of the Israelites who survive, will be “in the midst of many people,” and Micah gives two pictures of what it will be there. The first is dew. “Most commentators have assumed that this image is a positive one”: dew is the Lord’s gift, coming “from the LORD” and waiting on no man. But some “more astutely note a possible negative meaning,” in line with the lion that follows, for dew can also come down on an enemy. Hushai tells Absalom, “we will light upon him as the dew falleth on the ground: and of him and of all the men that are with him there shall not be left so much as one” ([[2 Sam. 17:12]]). Read that way, the dew and the lion of verse 8 are not opposites but “closely parallel ways of envisioning the unfortunate end for all who oppose God’s work.” On either reading the passage ends in the remnant’s victory: the lion symbolizes “how it would eventually triumph over its enemies.”

      Whether the remnant is surrounded in its own land or scattered abroad “is not clear from this passage.” Micah’s first hearers “would have most likely understood this ‘remnant of Jacob’ to be Israelite descendants in the land of Israel and the Middle East, no matter how broadly Jehovah may have intended it.” The word remnant is explained at [[Micah 2:12]].
    sources: [spencer-remnant, pike-micah, scripture-helps-micah, lds-scriptures]

  - ref: 8
    phrase: as a lion among the beasts of the forest
    kind: symbol
    title: The remnant as a lion
    body: |
      The second picture is a lion. For Micah’s hearers it was no exotic animal: the Asiatic lion “was once common throughout the ancient Near East.” Lions were a royal image because of their “power, strength, majesty, and danger,” and the Bible links lion imagery with the Lord Himself and tells of Him sending real lions to punish ([[1 Kgs. 13:24–26]]). Here the remnant itself is the lion. It preys on wild beasts and on flocks alike, so that every creature fears it.

      The verbs are judgment verbs. “Treadeth down” is the verb “to trample,” the same one the Lord uses in [[Isa. 63:3]]: “I will … trample them in my fury.” Wild animals “tearing” people are, in the prophets, agents of the Lord’s judgment on sin. In verse 9 “cut off” is “a common expression of divine judgment,” and the next four verses repeat it. The remnant acts with “Jehovah’s authorization and power,” carrying out His justice.
    sources: [pike-micah, lds-scriptures]

  - ref: 8
    phrase: the remnant of Jacob shall be among the Gentiles
    kind: scripture
    title: The Saviour quotes Micah to the Nephites
    body: |
      The resurrected Saviour quoted these verses to the Nephites three times: verse 8 at [[3 Ne. 16:14–15]], verses 8–9 at [[3 Ne. 20:16–17]], and verses 8–15 at [[3 Ne. 21:12–18]] and [[3 Ne. 21:21]]. These are the only passages of Micah in the Book of Mormon besides 4:12–13.

      Beyond small differences of wording, two things in His use stand out. He spoke to His hearers as the remnant: “Then shall ye, who are a remnant of the house of Jacob, go forth among them” ([[3 Ne. 20:16]]). That is “not as a correction of Micah’s words but rather as a focused application” of them “to a different remnant of the greater ‘house of Jacob.’” And He put a condition in front of the lion: “if the Gentiles do not repent after the blessing which they shall receive, after they have scattered my people” ([[3 Ne. 20:15]]). Micah’s verses do not have that condition.

      He also showed the way out. Gentiles who “repent and hearken unto my words” “shall come in unto the covenant and be numbered among this the remnant of Jacob” ([[3 Ne. 21:22]]). Micah 5:8–15 “likely has multiple fulfillments.” One reading of the sermon holds that the Saviour “chose verses that taught specifically of God’s covenants with his people.”
    sources: [pike-micah, scripture-helps-micah, sc-knowhy-214, lds-scriptures]

  - ref: 10
    phrase: I will cut off thy horses out of the midst of thee
    kind: history
    title: The Lord cuts off what Israel trusted
    body: |
      In verses 10–14 everything the Lord cuts off belongs to His own people. They are horses and chariots, walled cities and fortresses, sorcery and fortune-tellers, carved images and standing pillars, and groves. The “groves” are *asherim*: in Hebrew “Asherah,” “either a living tree or a tree-like pole, set up as an object of worship,” the practice the prophets forbade. A modern translation has “sacred poles.” The verses appear “directed at Israel and how Jehovah will purge them of reliance on powers of their own making.” In the reading the thread follows, this is the last step of the peace of verse 5. The footnote at “horses” points to Zechariah’s like promise of the coming King: “I will cut off the chariot from Ephraim, and the horse from Jerusalem … and he shall speak peace unto the heathen” ([[Zech. 9:10]]).

      With these things gone, “the people would then have the opportunity to accept the truths that lead to eternal life.” When the Saviour quoted these verses, He set a line before them that Micah does not have: “Yea, wo be unto the Gentiles except they repent; for it shall come to pass in that day … that I will cut off thy horses” ([[3 Ne. 21:14]]). That line makes it harder to say whom “thy” means there, but the verses “should most likely be read as Israelites, as in Micah 5:10–14.”
    sources: [ot-manual-11, bd-grove, nrsvue, correa-jonah, pike-micah, lds-scriptures]

  - ref: 15
    phrase: upon the heathen, such as they have not heard
    kind: words
    title: Nations that would not listen
    body: |
      The last line names the heathen as people who “have not heard,” and the English leaves open what they had not heard. The Hebrew is *ʾăšer lōʾ šāmēʿû*, literally *which have not heard*. The verb *šāmaʿ* means to hear, “often with implication of attention, obedience,” and a modern translation has “on the nations that did not obey.” Read that way, the vengeance falls on the nations that would not listen to the Lord.

      The Saviour kept the King James words when He quoted the line, and set before it words not found in Micah: “whosoever will not repent and come unto my Beloved Son, them will I cut off from among my people, O house of Israel,” and “I will execute vengeance and fury upon them, even as upon the heathen, such as they have not heard” ([[3 Ne. 21:20–21]]). In His hands the verse warns Israelites who do not repent that “their fate will be like that of the unrepentant Gentiles.”
    sources: [oshb-wlc, bdb, nrsvue, pike-micah, lds-scriptures]

christ: |
  Micah names the town, and the Gospels name the child: Jesus was born “in Bethlehem of Judæa in the days of Herod the king” ([[Matt. 2:1]]). The prophet who saw Jerusalem’s judge struck on the cheek saw a Ruler who would “stand and feed in the strength of the LORD,” and of that Ruler he said, “this man shall be the peace.”

  The peace Micah promised is a person. The footnote to “peace” in verse 5 points to the Lord’s promise to a disciple now, that the same peace is found in Him: “Learn of me, and listen to my words; walk in the meekness of my Spirit, and you shall have peace in me” ([[D&C 19:23]]).

explore: |
  - **The Saviour’s sermon of the covenant.** [[3 Ne. 20:10–46]] and [[3 Ne. 21:1–29]], where verses 8–15 are quoted, read with the Religious Studies Center study that compares them line by line, “Passages from the Book of Micah in the Book of Mormon,” in *They Shall Grow Together* (2022).
  - **The child and His names.** [[Isa. 9:6–7]]; [[Luke 2:4–11]].
  - **Bethlehem doubted.** [[John 7:40–43]].
  - **The remnant in Micah.** [[Micah 2:12]]; [[Micah 4:7]]; [[Micah 7:18]].

