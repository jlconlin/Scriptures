chapter: 4
title: The Mountain Raised from the Ruins
tagline: The temple mount that Micah had just seen plowed like a field is lifted above the hills, and the nations stream to it to learn the Lord’s ways. The lame are gathered into a remnant, Zion goes through labor pains to Babylon and is redeemed there, and the nations that gather against her are threshed like sheaves.
when: 'Micah prophesied under Jotham, Ahaz and Hezekiah of Judah, about 740–700 B.C.'

setting: |
  Chapter 4 opens the second of the book’s three divisions. Chapters 1–3 are judgment; chapters 4–5 are “prophecies of restoration, with brilliant messianic promises,” a message of hope that God will restore His people in a future day. Another reading takes chapters 3–5 as one movement that begins in doom and works toward the redemption of the remnant. Either way, the chapter answers the last verse of chapter 3, where Zion is “plowed as a field” ([[Micah 3:12]]).

  Its first three verses are nearly the same as [[Isa. 2:2–4]]. The site’s notes on Isaiah 2 explain the last days, the temple in the tops of the mountains, the law going forth from Zion and the swords beaten into plowshares, and the note on [[Isa. 2:4]] takes up which prophet received the words first. The notes here keep to what Micah does with them.

  The rest of the chapter moves among Micah’s present, the near future and a far one, and readers have placed its scenes differently. Babylon (verse 10) is more than a century away; the triumph over the nations (verses 11–13) has been read as looking millennia ahead. The Saviour quoted verses 12–13 to the Nephites ([[3 Ne. 20:18–19]]); the note on verse 13 says what He did with them.

thread: |
  The chapter lifts Zion from the lowest place to the highest. Chapter 3 ended with “the mountain of the house” left “as the high places of the forest”; chapter 4 begins with “the mountain of the house of the LORD” set above every mountain. Between that opening and the close, the hope is not cheap. The lame and the driven out are gathered first; the kingdom returns to Zion, but only after Zion has cried out like a woman in labor and gone captive to Babylon, and there been redeemed.

  The nations gather twice. In the opening vision they come up the mountain to be taught, and they beat their swords into plowshares. At the close many nations gather against Zion to see her defiled, not knowing that the Lord has gathered them like sheaves to a threshing floor. That war harvest stands in sharp contrast to the peace of verses 1–5, and the people who were at the mercy of their enemies are made, by the Lord’s power, the ox that threshes.

sections:
  - range: 1-5
    heading: The nations come up to the Lord’s house
    plain: |
      In the last days the mountain of the LORD’s house will be set firmly as the highest of the mountains, raised above the hills, and peoples will stream to it. Many nations will come and say, “Come, let us go up to the mountain of the LORD, to the house of the God of Jacob. He will teach us His ways, and we will walk in His paths.” For the law will go out from Zion, and the word of the LORD from Jerusalem. He will judge between many peoples and settle disputes for strong nations far away. They will hammer their swords into plowshares and their spears into pruning hooks. Nation will not take up the sword against nation, and they will not train for war any more. Each person will sit under his own vine and his own fig tree, and no one will frighten them, for the LORD of hosts has said it. All the peoples walk, each in the name of its god, but we will walk in the name of the LORD our God forever and ever.
  - range: 6-8
    heading: The lame gathered, the kingdom restored
    plain: |
      “On that day,” says the LORD, “I will gather the lame, and bring together those who were driven away and those I have afflicted. I will make the lame a remnant, and those who were cast far off a strong nation, and the LORD will reign over them on Mount Zion from now on and forever.” And you, tower of the flock, hill of Daughter Zion, to you it will come: the former dominion will return, the kingdom of Daughter Jerusalem.
  - range: 9-10
    heading: Labor pains, and redemption in Babylon
    plain: |
      Why do you cry out so loudly now? Is there no king in you? Has your counselor perished, that pain has seized you like a woman giving birth? Writhe and labor, Daughter Zion, like a woman giving birth. For now you will leave the city and live in the open country, and you will go all the way to Babylon. There you will be rescued; there the LORD will redeem you from the hand of your enemies.
  - range: 11-13
    heading: The nations threshed like sheaves
    plain: |
      Now many nations have gathered against you. They say, “Let her be defiled, and let our eyes gaze on Zion.” But they do not know the LORD’s thoughts or understand His plan: He has gathered them like sheaves to the threshing floor. Get up and thresh, Daughter Zion, for I will give you horns of iron and hooves of bronze, and you will crush many peoples. You will devote what they gained to the LORD, their wealth to the Lord of the whole earth.

notes:
  - ref: 1
    phrase: But in the last days it shall come to pass
    kind: structure
    title: After the plowed field, the exalted mountain
    body: |
      Micah sets the vision of the exalted temple directly after his prophecy that the temple would be destroyed, so that the promise answers the threat. The last line of chapter 3 is “the mountain of the house as the high places of the forest” ([[Micah 3:12]]), the temple hill gone back to wild country. The next line is “But in the last days … the mountain of the house of the LORD shall be established in the top of the mountains.” The same mountain that is to be left a ruin is to be raised above every other; the wasted temple mount “would be restored.”

      The order is Micah’s own. Isaiah has nearly the same words, but in Isaiah “this vision precedes prophecies of destruction,” while in Micah it “follows prophecies of destruction and devastation and draws the reader’s attention to the promise of a preserved remnant of Israel.” Micah uses the vision “to mark a transition from destruction to promise”; Isaiah uses it “to highlight the distance between present difficulties and future redemption.” What the mountain, the law from Zion and the plowshares mean is explained at [[Isa. 2:2]], [[Isa. 2:3]] and [[Isa. 2:4]].
    sources: [spencer-remnant, correa-jonah, lds-scriptures]

  - ref: 5
    phrase: we will walk in the name of the LORD our God for ever and ever
    kind: words
    title: Walking in the name of the LORD
    body: |
      Verse 5 closes the vision with a promise about how God’s people will live, and verses 4–5 are lines Isaiah 2 does not have. The note on [[Isa. 2:4]] takes up the vine and the fig tree; the footnote points to the days of Solomon, when “Judah and Israel dwelt safely, every man under his vine and under his fig tree” ([[1 Kgs. 4:25]]).

      One reading takes verse 5 as a promise rather than a resolution: walking in the name of God does not mean only conduct shaped by His name “but walking in the strength of God, in which the nature of this God is displayed,” as in David’s words to Goliath, “I come to thee in the name of the LORD of hosts” ([[1 Sam. 17:45]]), and in the verse the footnote gives: “I will strengthen them in the LORD; and they shall walk up and down in his name” ([[Zech. 10:12]]). The same reading takes the first half of the verse to mean that there will still be nations that do not seek the Lord, and that they will not be able to disturb the peace He gives His people. Another reading ties the name to the temple of verse 1: there the people “would bear the name of the Lord.”
    sources: [keil-micah, correa-jonah, lds-scriptures]

  - ref: 6
    phrase: will I assemble her that halteth
    kind: symbol
    title: The lame of the flock
    body: |
      “Her that halteth” is a lame sheep: the Hebrew, as the footnote says, is “is lame,” and the lexicon reads the feminine word here as “personified Judah as flock,” the same picture as in [[Zeph. 3:19]]. It is the word used of Jacob limping after he wrestled at Peniel ([[Gen. 32:31]]). Micah has already pictured Israel gathered “as the flock in the midst of their fold” ([[Micah 2:12]]), and verse 8 goes on to the “tower of the flock.”

      The flock the Lord gathers is the one that cannot keep up: the lame, the strays “driven out,” and those He says “I have afflicted.” The affliction was His own (“her that I have afflicted”), and so is the gathering. Out of these He makes “a remnant” and “a strong nation” (verse 7); the note on [[Micah 2:12]] explains the remnant. God gathers the survivors “as a remnant over which he might finally rule in righteousness,” and verse 7 names the ruler: “the LORD shall reign over them in mount Zion from henceforth, even for ever.”
    sources: [bdb, spencer-remnant, lds-scriptures]

  - ref: 8
    phrase: O tower of the flock, the strong hold of the daughter of Zion
    kind: words
    title: The tower of the flock
    body: |
      The “tower of the flock” is in Hebrew *migdal ʿeder*, “tower” and “flock,” and Micah addresses it to the stronghold of Zion. The same two words are “the tower of Edar,” beyond which Jacob spread his tent after Rachel was buried on the way to Bethlehem ([[Gen. 35:19–21]]). “The strong hold” is *ʿōphel*, a fortified mound or hill within a city, here in Jerusalem; a modern translation has “hill of daughter Zion.”

      One reading holds that the phrase here cannot be the tower near Bethlehem but must be the tower of David’s royal castle on Zion, called the flock-tower “as a play upon the flock-tower by which the patriarch Jacob once pitched his tent, because David … had been called from being the shepherd of a flock to be the shepherd of the nation of Israel.” On that reading, “the first dominion” is “the splendid rule of David and Solomon,” and the promise presupposes that the kingdom has been taken from David’s house in the destruction of [[Micah 3:12]]. The same reading finds the name natural for Micah, who goes on to describe the coming ruler as a shepherd ([[Micah 5:4]]) and Israel as the Lord’s flock ([[Micah 7:14]]).
    sources: [oshb-wlc, bdb, nrsvue, keil-micah, lds-scriptures]

  - ref: 10
    phrase: Be in pain, and labour to bring forth, O daughter of Zion, like a woman in travail
    kind: symbol
    title: Labor pains that end in birth
    body: |
      Micah compares Zion’s coming distress to labor because labor ends in a birth. The pain is real, the cry of verse 9 is loud, and the prophet tells Zion to go through it, not to escape it: by the figure, “Judah would bring upon herself the pain out of which would eventually come a new life in the Lord.” The footnote sets beside it [[Isa. 66:7–8]], where Zion gives birth to a nation “at once.”

      The same figure appears in several passages where Israel goes “through a time of crisis (which is compared to a woman in the pain of childbirth) and then being delivered by the promised king, the Messiah.” The figure returns in the next chapter, where the ruler from Beth-lehem gives Israel up “until the time that she which travaileth hath brought forth” ([[Micah 5:3]]), a line that has been read as pointing back to this verse.
    sources: [ot-manual-11, sc-knowhy-93, correa-jonah, lds-scriptures]

  - ref: 10
    phrase: thou shalt go even to Babylon; there shalt thou be delivered
    kind: history
    title: Even to Babylon
    body: |
      Micah names Babylon as the place of exile at a time when Assyria was the power that threatened Judah. The line has been read as prophecy that “is amazing because Assyria was mistress of the world in Micah’s day, Babylon being only a province of Assyria,” and it looked “nearly 130 years into the future.” The possibility that the line was added later has also been raised; either way, “the text speaks of the exile to Babylon.” The footnote points to Lehi, who saw Jerusalem’s people “carried away captive into Babylon” ([[1 Ne. 1:13]]).

      What Micah stresses is the place of rescue: “there shalt thou be delivered; there the LORD shall redeem thee.” The word “there” comes twice: the rescue happens in Babylon itself.
    sources: [ot-manual-11, correa-jonah, lds-scriptures]

  - ref: 11
    phrase: Now also many nations are gathered against thee
    kind: symbol
    title: Two gatherings of the nations
    body: |
      The nations gather twice in this chapter, and the two gatherings are opposites. In verse 2, “many nations” come up the mountain to be taught. In verse 11, “many nations” gather against Zion to see her “defiled”; a modern translation has “Let her be profaned, and let our eyes gaze upon Zion.” They think the gathering is theirs. It is the Lord’s: “they know not the thoughts of the LORD … for he shall gather them as the sheaves into the floor.” Sheaves are gathered to the threshing floor so that an ox can tread them.

      Zion’s part is a role reversal: the city that “has been at the mercy of its enemies for so long, will eventually, with Jehovah’s power, triumph over and destroy them all.” That war harvest “stands in sharp contrast to the ideal age described in Micah 4:1–5.” When it happens is not said; the prophecy “likely has multiple fulfillments,” and the footnote sets it beside the gatherings of the nations in [[Joel 3:2]] and [[Zech. 12:3]].
    sources: [pike-micah, nrsvue, scripture-helps-micah, lds-scriptures]

  - ref: 13
    phrase: I will consecrate their gain unto the LORD
    kind: words
    title: Devoted to the Lord
    body: |
      “Consecrate” here is the language of holy war: what is taken from a defeated enemy is devoted to the Lord. The verb is *ḥ-r-m*, “devote to [the LORD]: for sacred uses … the spoil of the nations,” and a modern translation reads “devote their gain to the Lord.” The root “is now often translated ‘devote,’ as in devoting something to the Lord by destroying it,” and the same root is used in the account of Jericho, where Israel was to keep from “the accursed thing” ([[Josh. 6:18]]) and the city was destroyed with its inhabitants ([[Josh. 6:21]]).

      So the verse finishes the picture of the threshing floor. The ox’s iron “horn” is its power to gore; its brass hoofs crush the sheaves; and what the nations had gained goes, in the end, to “the Lord of the whole earth.” The site’s note on [[Isa. 41:15]] sets this image beside Isaiah’s threshing sledge.
    sources: [oshb-wlc, bdb, nrsvue, pike-micah, lds-scriptures]

  - ref: 13
    phrase: Arise and thresh, O daughter of Zion
    kind: scripture
    title: The Saviour’s use of the threshing ox
    body: |
      The resurrected Saviour quoted verses 12–13 to the Nephites, and in His words the Lord gathers His people where Micah has Him gather the nations. In [[3 Ne. 20]] He gives these verses right after Micah 5:8–9, reversing Micah’s order. Micah has the Lord gather the nations “as the sheaves into the floor”; the Saviour says, “I will gather my people together as a man gathereth his sheaves into the floor” ([[3 Ne. 20:18]]), and the people gathered are those He calls “my people with whom the Father hath covenanted” ([[3 Ne. 20:19]]). Those gathered then thresh. He adds, “And behold, I am he who doeth it” ([[3 Ne. 20:19]]), and the Father’s condition: “except they repent it shall fall upon them … even upon all the nations of the Gentiles” ([[3 Ne. 20:20]]). Those verses have no counterpart in Micah; the threshing falls on Gentiles who do not repent.

      The Saviour used Micah’s words after teaching the gathering of Israel in the latter days, to warn the Gentiles of that time who would reject the gospel. Then He promises, “I will establish my people, O house of Israel” ([[3 Ne. 20:21]]).
    sources: [pike-micah, scripture-helps-micah, lds-scriptures]

christ: |
  The ruler of verse 7 is the Lord Himself: “the LORD shall reign over them in mount Zion from henceforth, even for ever.” The footnote, and only the footnote, sets beside it Gabriel’s promise to Mary of the Son she would bear: “he shall reign over the house of Jacob for ever; and of his kingdom there shall be no end” ([[Luke 1:33]]). Zion’s labor pains (verses 9–10) belong to a figure found in several passages, most of which have Israel pass through crisis and then be “delivered by the promised king, the Messiah.” In Micah 4 the one who redeems is the LORD, and the next chapter names the birthplace of the coming ruler ([[Micah 5:2]]).

  The flock that He gathers and rules is made of the lame, the driven out and the afflicted (verse 6); they are not left behind but made “a strong nation.” A disciple who comes to His house now to be taught His ways walks “in the name of the LORD our God for ever and ever” (verse 5), which one reading takes to mean in His strength rather than their own.

explore: |
  - **Isaiah’s version.** [[Isa. 2:2–5]] and the site’s notes there; [[2 Ne. 12:2–5]].
  - **The lame gathered.** [[Zeph. 3:19]], with the same word for the lame flock.
  - **The threshing ox in the Book of Mormon.** [[3 Ne. 20:10–22]] and [[3 Ne. 21:12–21]], with [[Micah 5:8–15]].

