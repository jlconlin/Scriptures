chapter: 2
title: They Covet Fields
tagline: Micah names the crime behind the coming judgment, the powerful taking the land and homes of their neighbours, answers the people who tell him to stop preaching, and closes with the Lord gathering the remnant of Israel like a flock.
when: 'Micah prophesied under Jotham, Ahaz and Hezekiah of Judah, about 740–700 B.C.'

setting: |
  Chapter 1 announced the Lord's coming against Samaria and Jerusalem and ended in a lament over the towns of Judah's countryside. Chapter 2 names the crime. The book's first part, chapters 1–3, is prophecy of “judgment and ruin,” and among the sins it names is “the oppression by the upper classes.” This chapter is where that oppression is described.

  Micah was a countryman, from Moresheth in the low hills about twenty miles southwest of Jerusalem (see [[Micah 1:1]]), and the wrongs he names are the ones a farming district would feel: fields and houses taken, families turned out. Coming from the country, he may have felt them “more acutely than he would had he come from the city.” Isaiah, who prophesied in the same years, made the same complaint in Jerusalem ([[Isa. 5:8]]).

  The chapter ends with a promise (verses 12–13). The book can also be divided into three sequences, chapters 1–2, 3–5 and 6–7, “each concluding with a reflection on the theme of the remnant”; on that division these two verses close the first of them. The division the book page follows runs the judgment on through chapter 3.

thread: |
  The judgment of verses 1–5 turns on one verb. The powerful “devise iniquity” on their beds (verse 1), and the Lord answers, “against this family do I devise an evil” (verse 3): the Hebrew word is the same. They took their neighbours' fields; they will lose the land, and none of them will be left to measure out a share in the congregation of the Lord (verses 4–5).

  Then comes the reply. “Prophesy ye not,” say the people Micah has accused (verse 6). Micah answers for the Lord: the Lord's patience is not short, and His words do good to the upright. It is the people who have turned enemy, stripping cloaks off peaceful travellers and putting women out of their homes (verses 7–9). The land they have defiled is no longer a place of rest (verse 10), and the preacher they want would promise them wine (verse 11). That verse points back to verse 6, and the answer to the people who would silence Micah is complete.

  Then, without introduction, the Lord promises to gather the remnant of Jacob like a flock, and one who breaks through goes before them out of the gate, with their King and the LORD at their head (verses 12–13). Micah is no preacher of comfortable lies. He too has salvation to proclaim, “only not for the morally corrupt people of his own time”: the promise comes after the judgment, not in place of it.

sections:
  - range: 1-2
    heading: Plotted by night
    plain: |
      Woe to those who lie in bed planning wrong and working out evil! As soon as it is light they carry it out, because they have the power to. They want fields, and they seize them; they want houses, and they take them. They crush a man and his household, a man and the inheritance that belongs to his family.
  - range: 3-5
    heading: The sentence
    plain: |
      So the LORD says: I too am planning evil, against this whole people, and you will not pull your necks out from under it or walk with your heads held high, for it will be an evil time. On that day people will make a mocking song about you, and you will wail, “We are ruined. He has handed our people's share to someone else. How He takes it from me! He has turned away and divided our fields.” So none of you will be left in the LORD's assembly to measure out a share of land by lot.
  - range: 6-7
    heading: “Do not preach”
    plain: |
      “Do not preach,” they preach. “No one should preach about such things; disgrace will not catch up with us.” House of Jacob, should this be said? Has the LORD run out of patience? Is this the kind of thing He does? Do not My words do good to the one who walks uprightly?
  - range: 8-11
    heading: Enemies of their own people
    plain: |
      But lately My people have risen up like an enemy. You strip the cloak off peaceful travellers who pass by with no thought of war. You drive the women of My people out of the homes they loved, and you take My glory from their children for good. Get up and go, for this is no place of rest; because it is defiled it will destroy you with a terrible destruction. If a man came along with wind and lies, saying, “I will preach to you about wine and strong drink,” he would be just the preacher for this people.
  - range: 12-13
    heading: The flock gathered
    plain: |
      I will surely gather all of you, Jacob; I will surely bring together the remnant of Israel. I will put them together like sheep in a fold, like a flock in its pasture, loud with the crowd of people. The one who breaks through goes up before them; they break out, pass through the gate and go out by it. Their King passes on before them, the LORD at their head.

notes:
  - ref: 2
    phrase: even a man and his heritage
    kind: history
    title: A family’s inheritance
    body: |
      What the powerful took was more than property. The word rendered “heritage” means “possession, property, inheritance,” and its first sense is land “in Canaan given by” the Lord to Israel and divided among the tribes. So the verse moves from things to people: fields and houses in the first half, “a man and his house, even a man and his heritage” in the second. A modern translation has “they oppress householder and house, people and their inheritance.” To take a family's field was to take its share in the land the Lord had given.

      Isaiah made the same charge ([[Isa. 5:8]]); the note there explains the law that kept a family's land in the family.
    sources: [bdb, nrsvue]

  - ref: 3
    phrase: against this family do I devise an evil
    kind: words
    title: The Lord devises too
    body: |
      The sentence is made from the crime. Those who “devise iniquity” on their beds (verse 1) now hear that the Lord, too, is devising, and the Hebrew verb is the same in both verses. In one reading the punishment “will correspond to the sin”: they planned evil to take their neighbours' possessions, so the Lord will bring evil on them.

      “This family” is not only the oppressors' circle but “the whole of the existing nation.” The image is a yoke: they will not pull their necks out from under it, and the yoke is “subjugation to the hostile conqueror of the land and the oppression of exile.” Men who walked “haughtily,” with “the head lifted up, which is a sign of pride,” will not walk so again.
    sources: [oshb-wlc, keil-micah]

  - ref: 5
    phrase: cast a cord by lot in the congregation of the LORD
    kind: history
    title: No one left to measure out a share
    body: |
      Men who took other families' land will have no share in the land at all. When Israel entered Canaan, “the land was divided to the Israelites by lot, and then the portion that fell to each tribe was divided among the different families by measure”: the “cord” is the measuring line. To have no one to cast it “in the congregation of the LORD” is to be left “without their inheritance,” and, in one reading, to be “separated from the congregation of Jehovah.”

      Verse 4 gives the lament of the dispossessed. Their fields go to someone else: “turning away he hath divided our fields.” The Hebrew has “the rebellious” one, which has been read as Israel's name for the foreign conqueror; a modern translation, correcting the text, has “Among our captors he parcels out our fields.” The lament has been read beside what the northern kingdom saw, when the king of Assyria settled foreigners in the cities of Samaria ([[2 Kgs. 17:24]]).
    sources: [keil-micah, correa-jonah, nrsvue]

  - ref: 6
    phrase: Prophesy ye not, say they to them that prophesy
    kind: words
    title: “Do not preach,” they preach
    body: |
      The order to stop prophesying uses the prophets' own word. The Hebrew verb means to drip, and is used of speech, “especially prophecy” (the note on [[Amos 7:17]] explains it, where Amos hears the same order). Here it comes three times in one line (“talk not,” “so they talk,” “shall not talk”), and a modern translation keeps the irony: “‘Do not preach’—thus they preach.” The speakers are those Micah has accused, who answer his charges with “Prophesy ye not”; another translation makes them prophets, “their prophets say,” since the verb is the one for prophesying.

      The rest of the verse is difficult Hebrew, and the one correction proposed for it is marked as uncertain. The King James Version has “they shall not prophesy to them, that they shall not take shame”; a modern translation reads it as the speakers' own confidence: “one should not preach of such things; disgrace will not overtake us.” Either way, the accused want the warnings stopped, as Israel had told its prophets in Amos's day ([[Amos 2:12]]).
    sources: [bdb, ot-manual-11, niv, nrsvue]

  - ref: 7
    phrase: is the spirit of the LORD straitened?
    kind: words
    title: Has the Lord run out of patience?
    body: |
      “Is the spirit of the LORD straitened?” asks whether the Lord has grown impatient. The Hebrew verb behind “straitened” means “be short,” and with the word for spirit it means to “be impatient.” A modern translation has “Is the Lord’s patience exhausted?”; another notes that the line can also be read “Is the Spirit of the Lord” impatient.

      The people meet Micah's warnings by appealing to the Lord's goodness. In one Latter-day Saint reading they “imagine that his threats are irreconcilable with the goodness of the Lord,” and Micah answers that God “is not wrathful and has no love for chastening, but that He is stirred up to anger by the nation’s sins and is obliged to punish.” The proof is the next line: the Lord's words “do good to him that walketh uprightly.” It is not the Lord who has changed. As the next verse says, “my people is risen up as an enemy.”
    sources: [bdb, nrsvue, niv, ot-manual-11]

  - ref: 9
    phrase: from their children have ye taken away my glory for ever
    kind: history
    title: What was taken from the women and children
    body: |
      The victims of verses 8–9 are the defenceless: travellers who pass by “as men averse from war,” women put out of their homes, and their children. One reading makes the women widows, whom the powerful “deprive of house and home,” and the children “fatherless orphans.” Turned out of their homes, the women and children “were left destitute.” The Lord calls them “the women of my people.”

      What the Lord calls “my glory” the verse does not explain, and a modern translation has “my blessing.” In one reading it is the clothing the Lord had given them, the cloak stripped off in verse 8, and “for ever” recalls the law that a cloak taken in pledge “was to be returned before sunset, whereas ungodly creditors retained it for ever”: “thou shalt deliver it unto him by that the sun goeth down” ([[Ex. 22:26]]; see the note on [[Ex. 22:27]]). On that reading the robbery of verse 8 is not only on the highway; it is also a creditor “taking away the cloak in the public street from their own poor debtors.”
    sources: [keil-micah, niv, correa-jonah]

  - ref: 10
    phrase: this is not your rest
    kind: history
    title: No longer a place of rest
    body: |
      “Rest” is what the promised land was meant to be. Moses told Israel they were “not as yet come to the rest and to the inheritance, which the LORD your God giveth you” ([[Deut. 12:9]]), and the Hebrew word for “rest” is the same in both passages. In one Latter-day Saint reading the rest the Lord planned was tied to the temple, “the place which the LORD your God shall choose out of all your tribes to put his name there” ([[Deut. 12:5]]), and Israel “had chosen wickedness” instead.

      So the summons of verse 10 is to leave: “Arise ye, and depart,” because the land Israel has defiled will destroy it.
    sources: [correa-jonah]

  - ref: 11
    phrase: I will prophesy unto thee of wine and of strong drink
    kind: history
    title: The preacher this people wants
    body: |
      Micah ends his answer with the preacher his hearers would welcome. The verb is the same “drip” of verse 6, and a modern translation keeps it: “If someone were to go about uttering empty falsehoods, saying, ‘I will preach to you of wine and strong drink,’ such a one would be the preacher for this people!” The people who would silence Micah “would rather hear a prophecy about wine than about their own sin.”

      The drink may be more than a figure. In one Latter-day Saint reading, the wrongs Micah names in verses 1–11 include “a tendency toward substance abuse,” beside “obsession with wealth and gain” and “mistreatment of the marginalized and underprivileged.”
    sources: [bdb, nrsvue, correa-jonah, spencer-remnant]

  - ref: 12
    phrase: I will surely gather the remnant of Israel
    kind: words
    title: The remnant
    body: |
      The remnant is what survives a judgment and becomes the start of something new. In the Old Testament the word names the “part of a nation, tribe, clan, or family which survives a divine catastrophe, whether natural (flood, famine, pestilence) or not (war, exile). This group forms the nucleus for the possible future rebuilding of the community.” This is the word's first appearance in Micah; it returns at [[Micah 4:7]], [[Micah 5:3]], [[Micah 5:7–8]] and [[Micah 7:18]], and this note serves for all of them.

      The promise is of numbers as well as survival: the remnant “either will be large from the beginning or will grow, since ‘they shall make great noise by reason of the multitude of men.’” In one Latter-day Saint reading each of the book's three parts closes on the remnant, and since the northern kingdom fell in Micah's lifetime, for him “Judah itself comes eventually to serve as a kind of remnant of Israel.”

      Isaiah, in the same years, made the same promise: “The remnant shall return, even the remnant of Jacob, unto the mighty God” ([[Isa. 10:21]]).
    sources: [pike-micah, spencer-remnant, scripture-helps-micah]

  - ref: 12
    phrase: as the sheep of Bozrah
    kind: words
    title: Sheep of Bozrah, or sheep in a fold
    body: |
      “Bozrah” can be read as a common noun or as a place, and the picture is much the same either way. As a noun the Hebrew word means an “enclosure, i.e. (sheep-) fold,” and modern translations read it so: “like sheep in a fold, like a flock in its pasture; it will resound with people.” Read as the place, it is “the sheep-rich area of Bozrah,” used to show how many and how mighty the gathered people will become. Either way the scattered are pictured as a crowded flock, penned together and loud with numbers.
    sources: [bdb, nrsvue, ot-manual-11]

  - ref: 13
    phrase: The breaker is come up before them
    kind: christ
    title: The one who breaks through
    body: |
      The “breaker” is the one who opens the way for the penned-in flock. A modern translation has “The One who breaks open the way will go up before them”; behind him the people “have broken up, and have passed through the gate, and are gone out by it.” In the Latter-day Saint reading the scattered condition of Israel is “a form of imprisonment,” and the verse foretells “a Savior and Redeemer who would break the prison walls and lead the people to the promised land.”

      The last line names the leader: “their king shall pass before them, and the LORD on the head of them.” The footnote to the verse sets beside it what Christ told the Saints of this dispensation: “I will be your king and watch over you” ([[D&C 38:21]]).
    sources: [niv, ot-manual-11, lds-scriptures]

christ: |
  The chapter ends with the Lord at the head of His people. The one who breaks through the gate has been read as “a Savior and Redeemer who would break the prison walls,” and the King who goes before the flock is the Lord Himself, who told the Saints of this dispensation, “I will be your king and watch over you” ([[D&C 38:21]]).

  In a chapter where the powerful took families' fields and widows' homes, the Lord calls the women turned out of their homes “the women of my people” (verse 9): those wronged are His own. A disciple who is wronged belongs to that King, and a disciple who holds power over others holds it under Him. His words still “do good to him that walketh uprightly” (verse 7).

explore: |
  - **The same complaint against the powerful in Micah's century.** [[Isa. 5:8–10]] and [[Amos 2:6–8]].
  - **A prophet told to stop prophesying.** [[Amos 7:10–17]].
  - **The remnant again.** [[Micah 4:6–7]], [[Micah 5:7–8]] and the book's last word in [[Micah 7:18–20]].
  - “The Prophets’ Remnant Theology” (*Prophets and Prophecies of the Old Testament*, Religious Studies Center, 2017) follows the remnant through Amos, Micah and Isaiah and shows why the Book of Mormon cares about it.

