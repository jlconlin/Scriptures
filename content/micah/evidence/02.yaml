chapter: 2
claims:
  # ---- when ----
  - where: when
    claim: 'Micah prophesied under Jotham, Ahaz and Hezekiah, about 740 to 697 B.C.'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'His preaching, therefore, took place during the years from approximately 740 B.C. to 697 B.C.'
  - where: when
    claim: 'Micah prophesied in Judah under Jotham, Ahaz and Hezekiah in the eighth century BC'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Micah was a prophet in the Southern Kingdom of Judah during the reigns of Jotham, Ahaz, and Hezekiah in the eighth century BC.'

  # ---- setting ----
  - where: setting
    claim: 'Chapters 1–3 are judgment and ruin; the crime includes oppression by the upper classes'
    key: bd-micah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/micah?lang=eng'
    quote: 'Micah 1–3, prophecies of judgment and ruin on the Jewish State, lighting first on Samaria and afterwards on Jerusalem, the crime being the idolatry at the high places and also the oppression by the upper classes.'
  - where: setting
    claim: 'Moresheth was in the low hills of Judea about twenty miles southwest of Jerusalem'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'seems to have been located in the Shephelah or low hill region of Judea some twenty miles southwest of Jerusalem'
  - where: setting
    claim: 'Coming from the country, Micah felt the wrongs more acutely'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'Coming as he did, from the country, he no doubt felt these wrongs more acutely than he would had he come from the city.'
  - where: setting
    claim: 'Micah prophesied at about the same time as Isaiah, and his messages parallel Isaiah''s'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'He prophesied at around the same time as Isaiah, Amos, Hosea, and Jonah.'
  - where: setting
    claim: 'Spencer divides Micah into three sequences, each ending with the remnant; chapters 1–2 are the first'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'The book divides into three sequences (chapters 1–2, chapters 3–5, and chapters 6–7), each concluding with a reflection on the theme of the remnant.'

  # ---- thread ----
  - where: thread
    claim: 'Chapter 2 condemns the injustice of the great, threatens loss of the inheritance, answers the false prophets, and closes with the promise of the remnant'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/2.htm'
    quote: 'Micah proceeds in Micah 2:1-13 to condemn, as the principal sins, the injustice and oppressions on the part of the great (Micah 2:1, Micah 2:2), for which the nation was to be driven away from its inheritance (Micah 2:3-5).'
  - where: thread
    claim: 'Verse 11 points back to verse 6'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/2.htm'
    quote: 'With this explanation pointing back to Micah 2:6, the threatening is brought to a close.'
  - where: thread
    claim: 'The promise of verses 12–13 comes without introduction; Micah too has salvation to proclaim, but not for the corrupt people of his own time'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/2.htm'
    quote: 'Micah is indeed not a prophet, prophesying lies of wine and strong drink; nevertheless he also has salvation to proclaim, only not for the morally corrupt people of his own time.'
  - where: thread
    claim: 'The same verb, devise, in verses 1 and 3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'חֹשֵׁ֛ב'

  # ---- note 2:2 ----
  - where: 'note 2:2 “A family’s inheritance”'
    claim: 'Nachalah means possession, property, inheritance, originally gift'
    key: bdb
    url: 'https://biblehub.com/hebrew/5159.htm'
    quote: 'noun feminine possession, property, inheritance (originally gift; Late Hebrew = Biblical Hebrew)'
  - where: 'note 2:2 “A family’s inheritance”'
    claim: 'Its first sense is property in Canaan given by the Lord to Israel, then distributed among the tribes'
    key: bdb
    url: 'https://biblehub.com/hebrew/5159.htm'
    quote: 'a. in Canaan given by ׳י to Israel'
  - where: 'note 2:2 “A family’s inheritance”'
    claim: 'Modern rendering: they oppress householder and house, people and their inheritance'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+2&version=NRSVUE'
    quote: 'they oppress householder and house, people and their inheritance.'
  - where: 'note 2:3 “The Lord devises too”'
    claim: 'Verse 1 uses the verb chashab, devise'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'חֹֽשְׁבֵי'
  - where: 'note 2:3 “The Lord devises too”'
    claim: 'Verse 3 uses the same verb of the Lord'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'חֹשֵׁ֛ב'
  - where: 'note 2:3 “The Lord devises too”'
    claim: 'The punishment will correspond to the sin'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/2.htm'
    quote: 'The punishment introduced with lâkhēn (therefore) will correspond to the sin. Because they reflect upon evil, to deprive their fellow-men of their possessions, Jehovah will bring evil upon this generation'
  - where: 'note 2:3 “The Lord devises too”'
    claim: 'This family is the whole nation, not only the godless'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/2.htm'
    quote: 'is not this godless family, but the whole of the existing nation'
  - where: 'note 2:3 “The Lord devises too”'
    claim: 'The yoke is subjugation to the conqueror and exile'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/2.htm'
    quote: 'The yoke which the Lord will bring upon them is subjugation to the hostile conqueror of the land and the oppression of exile'
  - where: 'note 2:3 “The Lord devises too”'
    claim: 'To walk haughtily is to walk with head lifted up, a sign of pride'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/2.htm'
    quote: 'to walk on high, i.e., with the head lifted up, which is a sign of pride and haughtiness'

  # ---- note 2:5 ----
  - where: 'note 2:5 “No one left to measure out a share”'
    claim: 'The land was divided by lot to tribes, then by measure among families'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/2.htm'
    quote: 'the land was divided to the Israelites by lot, and then the portion that fell to each tribe was divided among the different families by measure.'
  - where: 'note 2:5 “No one left to measure out a share”'
    claim: 'The ungodly will have no further part in the inheritance and be separated from the congregation'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/2.htm'
    quote: 'the ungodly will henceforth receive no further part in the inheritance of the Lord, but that they are to be separated from the congregation of Jehovah.'
  - where: 'note 2:5 “No one left to measure out a share”'
    claim: 'The rebellious one in verse 4 is the foreign foe'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/2.htm'
    quote: 'This is the term applied by mourning Israel to the heathenish foe, to whom Jehovah apportions the fields of His people.'
  - where: 'note 2:5 “No one left to measure out a share”'
    claim: 'No cord means no inheritance'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'Therefore, the Lord would not allot the land with a cord, or in other words, they would be left without their inheritance.'
  - where: 'note 2:5 “No one left to measure out a share”'
    claim: 'Their land divided among others, as in 2 Kings 17:24'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'The people would begin to complain against the Lord after they saw their people diminished and their land divided among others (2 Kings 17:24).'
  - where: 'note 2:5 “No one left to measure out a share”'
    claim: 'Modern rendering: Among our captors he parcels out our fields; the Hebrew has the rebellious, and the translation corrects it'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+2&version=NRSVUE'
    quote: 'Among our captors he parcels out our fields.'
  - where: 'note 2:5 “No one left to measure out a share”'
    claim: 'NRSVue footnote: correction; Hebrew the rebellious'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+2&version=NRSVUE'
    quote: '2.4 Cn: Heb the rebellious'

  # ---- note 2:6 ----
  - where: 'note 2:6 ““Do not preach,” they preach”'
    claim: 'The verb (drip) is used of speech, especially prophecy; Micah 2:6 rendered talk not, so they talk'
    key: bdb
    url: 'https://biblehub.com/hebrew/5197.htm'
    quote: '2 of speech, especially prophecy (without accusative)'
  - where: 'note 2:6 ““Do not preach,” they preach”'
    claim: 'BDB on Micah 2:6: the verb three times, talk not, so they talk, shall not talk; uncertain reading in the last clause'
    key: bdb
    url: 'https://biblehub.com/hebrew/5197.htm'
    quote: '''talk not'' — so they talk — ''they (read ye?) shall not talk of these things'
  - where: 'note 2:6 ““Do not preach,” they preach”'
    claim: 'Those Micah spoke against replied, Prophesy ye not'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'When prophets like Micah inveighed against these evils, those spoken against replied: “Prophesy ye not” (Micah 2:6).'
  - where: 'note 2:6 ““Do not preach,” they preach”'
    claim: 'NIV makes the speakers prophets'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Micah+2&version=NIV'
    quote: '“Do not prophesy,” their prophets say.'
  - where: 'note 2:6 ““Do not preach,” they preach”'
    claim: 'NRSVue keeps the irony and reads the end as the speakers'' confidence'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+2&version=NRSVUE'
    quote: '“Do not preach”—thus they preach— “one should not preach of such things; disgrace will not overtake us.”'

  # ---- note 2:7 ----
  - where: 'note 2:7 “Has the Lord run out of patience?”'
    claim: 'Qatsar means be short; with ruach, be impatient'
    key: bdb
    url: 'https://biblehub.com/hebrew/7114.htm'
    quote: '= be impatient'
  - where: 'note 2:7 “Has the Lord run out of patience?”'
    claim: 'BDB lists Micah 2:7 under qatsar, be short'
    key: bdb
    url: 'https://biblehub.com/hebrew/7114.htm'
    quote: 'Qal Perfect3masculine singular קָצַר Isaiah 28:20; Micah 2:7'
  - where: 'note 2:7 “Has the Lord run out of patience?”'
    claim: 'Modern rendering: Is the Lord''s patience exhausted?'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+2&version=NRSVUE'
    quote: 'Is the Lord’s patience exhausted?'
  - where: 'note 2:7 “Has the Lord run out of patience?”'
    claim: 'NIV footnote: or, Is the Spirit of the Lord'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Micah+2&version=NIV'
    quote: 'Micah 2:7 Or Is the Spirit of the Lord'
  - where: 'note 2:7 “Has the Lord run out of patience?”'
    claim: 'The great men thought Micah''s threats irreconcilable with the Lord''s goodness'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'Such preaching on the part of Micah does not please the corrupt great men, for they imagine that his threats are irreconcilable with the goodness of the Lord.'
  - where: 'note 2:7 “Has the Lord run out of patience?”'
    claim: 'God is not wrathful but is obliged to punish the nation''s sins'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'Micah interposes (verse 7) by pointing out that God is not wrathful and has no love for chastening, but that He is stirred up to anger by the nation’s sins and is obliged to punish.'

  # ---- note 2:9 ----
  - where: 'note 2:9 “What was taken from the women and children”'
    claim: 'The women are widows deprived of house and home, in whose person the Lord is injured'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/2.htm'
    quote: 'are widows, whom they deprive of house and home, and indeed widows of the people of Jehovah, in whose person Jehovah is injured. These children are fatherless orphans'
  - where: 'note 2:9 “What was taken from the women and children”'
    claim: 'My glory is the ornament the Lord gave, the garment'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/2.htm'
    quote: 'my ornament, i.e., the ornament which I have given them. The reference, as מעל shows, is to the garment or upper coat.'
  - where: 'note 2:9 “What was taken from the women and children”'
    claim: 'For ever alludes to the law of the pledged cloak returned before sunset'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/2.htm'
    quote: 'the coat taken from the poor as a pledge was to be returned before sunset, whereas ungodly creditors retained it for ever.'
  - where: 'note 2:9 “What was taken from the women and children”'
    claim: 'Not only highway robbery: creditors taking the cloak from poor debtors'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/2.htm'
    quote: 'We have not only to think of open highway robbery, but also of their taking away the cloak in the public street from their own poor debtors'
  - where: 'note 2:9 “What was taken from the women and children”'
    claim: 'NIV renders my glory as my blessing'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Micah+2&version=NIV'
    quote: 'You take away my blessing from their children forever.'
  - where: 'note 2:9 “What was taken from the women and children”'
    claim: 'Women and children left destitute'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'The women and children were left destitute.'

  # ---- note 2:10 ----
  - where: 'note 2:10 “No longer a place of rest”'
    claim: 'This is not the rest the Lord wanted for His people'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'This is not the rest that the Lord had wanted for His people (Micah 2:10).'
  - where: 'note 2:10 “No longer a place of rest”'
    claim: 'Deuteronomy 12:9 uses the same Hebrew word for rest'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'Deuteronomy 12:9. The same word for “rest” is used in Hebrew in both passages.'
  - where: 'note 2:10 “No longer a place of rest”'
    claim: 'Correa: the Lord prepared the temple as their place of rest'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'Thus, the Lord had prepared the temple to be their place of rest, but the Israelites had chosen wickedness.'

  # ---- note 2:11 ----
  - where: 'note 2:11 “The preacher this people wants”'
    claim: 'The verb of verse 11 is the same drip/preach verb of verse 6'
    key: bdb
    url: 'https://biblehub.com/hebrew/5197.htm'
    quote: '1singular אַטִּף Micah 2:11; 3masculine plural יִטִּיפ֑וּן Micah 2:6'
  - where: 'note 2:11 “The preacher this people wants”'
    claim: 'Modern rendering of verse 11'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+2&version=NRSVUE'
    quote: 'If someone were to go about uttering empty falsehoods, saying, “I will preach to you of wine and strong drink,” such a one would be the preacher for this people!'
  - where: 'note 2:11 “The preacher this people wants”'
    claim: 'They would rather hear a prophecy about wine than about their sin'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'They would rather hear a prophecy about wine than about their own sin.'
  - where: 'note 2:11 “The preacher this people wants”'
    claim: 'Among the wrongs of 2:1–11 is substance abuse'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'obsession with wealth and gain, mistreatment of the marginalized and underprivileged, and a tendency toward substance abuse (see Micah 2:1–11).'

  # ---- note 2:12 remnant ----
  - where: 'note 2:12 “The remnant”'
    claim: 'Definition of the remnant in the Old Testament'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'part of a nation, tribe, clan, or family which survives a divine catastrophe, whether natural (flood, famine, pestilence) or not (war, exile). This group forms the nucleus for the possible future rebuilding of the community.'
  - where: 'note 2:12 “The remnant”'
    claim: 'The word remnant occurs in Micah 2:12; 4:7; 5:3, 7, 8; 7:18'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'the word remnant itself occurs in Micah 2:12; 4:7; 5:3, 7, 8; and 7:18.'
  - where: 'note 2:12 “The remnant”'
    claim: 'The remnant will be large or will grow'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'The passage even promises that the remnant either will be large from the beginning or will grow, since “they shall make great noise by reason of the multitude of men” (2:12).'
  - where: 'note 2:12 “The remnant”'
    claim: 'Three sequences, each ending with the remnant'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'The book divides into three sequences (chapters 1–2, chapters 3–5, and chapters 6–7), each concluding with a reflection on the theme of the remnant.'
  - where: 'note 2:12 “The remnant”'
    claim: 'The northern kingdom fell in Micah''s time; for Micah Judah becomes a kind of remnant'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'During the period of Micah’s prophecy, the northern kingdom of Israel was destroyed while the southern kingdom, Judah, survived. For Micah, then, Judah itself comes eventually to serve as a kind of remnant of Israel'
  - where: 'note 2:12 “The remnant”'
    claim: 'Micah 2:12 parallels Isaiah 10:20–22'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Compare Micah 2:12 with Isaiah 10:20–22'

  # ---- note 2:12 Bozrah ----
  - where: 'note 2:12 “Sheep of Bozrah, or sheep in a fold”'
    claim: 'Botsrah as a noun means enclosure, sheepfold, at Micah 2:12'
    key: bdb
    url: 'https://biblehub.com/hebrew/1223.htm'
    quote: 'noun feminine enclosure, i.e. (sheep-) fold'
  - where: 'note 2:12 “Sheep of Bozrah, or sheep in a fold”'
    claim: 'Modern rendering: like sheep in a fold'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+2&version=NRSVUE'
    quote: 'like sheep in a fold, like a flock in its pasture; it will resound with people.'
  - where: 'note 2:12 “Sheep of Bozrah, or sheep in a fold”'
    claim: 'The manual reads it as the sheep-rich area of Bozrah'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'He used the illustration of the sheep-rich area of Bozrah to illustrate how the people will become mighty.'

  # ---- note 2:13 ----
  - where: 'note 2:13 “The one who breaks through”'
    claim: 'Scattering as imprisonment; a Savior and Redeemer breaks the prison walls'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'He compared their scattered condition to a form of imprisonment and foretold a Savior and Redeemer who would break the prison walls and lead the people to the promised land.'
  - where: 'note 2:13 “The one who breaks through”'
    claim: 'NIV: The One who breaks open the way'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Micah+2&version=NIV'
    quote: 'The One who breaks open the way will go up before them'
  - where: 'note 2:13 “The one who breaks through”'
    claim: 'D&C 38 is spoken by Christ (section heading)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/38?lang=eng'
    quote: '1–6, Christ created all things'

  # ---- christ ----
  - where: christ
    claim: 'The breaker read as a Savior and Redeemer'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'foretold a Savior and Redeemer who would break the prison walls and lead the people to the promised land.'
  - where: christ
    claim: 'D&C 38 is Christ speaking'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/38?lang=eng'
    quote: '1–6, Christ created all things'
  - where: explore
    claim: 'Spencer traces the remnant through Amos, Micah and Isaiah and its use in the Book of Mormon'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'Seeing how this theme is developed in key places in the Hebrew Bible’s prophetic books should help Latter-day Saints see how the Book of Mormon is part of a long history of prophetic reflection on the idea of the remnant.'
