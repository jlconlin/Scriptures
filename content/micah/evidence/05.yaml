chapter: 5
claims:
  # ---- when, setting, thread ----
  - where: 'when'
    claim: 'Micah prophesied under Jotham, Ahaz and Hezekiah, about 740–697 B.C.'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'the prophet’s ministry was during reigns of Jotham, Ahaz, and Hezekiah, kings of Judah. His preaching, therefore, took place during the years from approximately 740 B.C. to 697 B.C.'
  - where: 'setting'
    claim: 'Chapters 4–5 are the book’s second division, prophecies of restoration with messianic promises'
    key: bd-micah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/micah?lang=eng'
    quote: '(2) Micah 4–5, prophecies of restoration, with brilliant messianic promises.'
  - where: 'setting'
    claim: 'Chapter 5 continues the previous chapter: the people gathered to battle, the city besieged'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'In the same vein as in the previous chapter, the Lord’s people would be gathered to battle. The enemy had laid siege to the city'
  - where: 'setting'
    claim: 'King James 5:1 is Hebrew 4:14 and 5:2 is Hebrew 5:1'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+5&version=NRSVUE'
    quote: '5.1 4.14 in Heb'
  - where: 'setting'
    claim: 'King James 5:2 is Hebrew 5:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'בֵּֽית'
  - where: 'setting'
    claim: 'In Micah’s time Assyria was the imperial power endangering Israel'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'because in the time of the prophet this power was the imperial power by which Israel was endangered'
  - where: 'setting'
    claim: 'The Saviour quoted Micah 5:8–15 in 3 Nephi 20–21'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'only two passages from Micah occur in the Book of Mormon—Micah 4:12–13 and 5:8–15, with an emphasis on 5:8.'
  - where: 'thread'
    claim: 'The peace of verse 5 explained in three steps: verses 5b–6, 7–9, 10–15'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: '(1) by defending Israel against the attacks of the imperial power (vers. 5 b, 6); (2) by exalting it into a power able to overcome the nations (vers. 7–9); and (3) by exterminating all the materials of war'
  - where: 'thread'
    claim: 'Third step: removing materials of war and idolatry'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'by exterminating all the materials of war, and everything of an idolatrous nature, and so preventing the possibility of war (vers. 10–15)'

  # ---- note 5:1 ----
  - where: 'note 5:1 “A city under siege, its judge shamed”'
    claim: 'The city besieged and its leader (judge) struck, continuing chapter 4'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'The enemy had laid siege to the city and would smite the leader (judge) with a rod.'
  - where: 'note 5:1 “A city under siege, its judge shamed”'
    claim: 'A modern translation reads “walled around with a wall,” marking the Hebrew uncertain and following the Greek'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+5&version=NRSVUE'
    quote: '5.1 Cn Compare Gk: Meaning of Heb uncertain'
  - where: 'note 5:1 “A city under siege, its judge shamed”'
    claim: 'The modern translation’s rendering of the opening line'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+5&version=NRSVUE'
    quote: 'Now you are walled around with a wall;'
  - where: 'note 5:1 “A city under siege, its judge shamed”'
    claim: 'From the hopeless siege the passage turns to a ruler from Bethlehem'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'When the situation looked hopeless, a ruler from Bethlehem whose origin is unknown'
  - where: 'thread'
    claim: 'The chapter turns from a hopeless siege to a ruler from Bethlehem'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'When the situation looked hopeless, a ruler from Bethlehem whose origin is unknown'

  # ---- note 5:2 Bethlehem ----
  - where: 'note 5:2 “Little Beth-lehem, David’s town”'
    claim: 'Bethlehem five miles south of Jerusalem; name means house of bread; also called Ephrath'
    key: gs-bethlehem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/bethlehem?lang=eng'
    quote: 'A small city located five miles (eight kilometers) south of Jerusalem. In Hebrew, Bethlehem means “house of bread”; it is also called Ephrath'
  - where: 'note 5:2 “Little Beth-lehem, David’s town”'
    claim: 'Bethlehem-Judah also called Ephrath; Samuel anointed David there; a second Bethlehem in Zebulun'
    key: bd-bethlehem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bethlehem?lang=eng'
    quote: 'Bethlehem-Judah, also called Ephrath (Gen. 35:19; 48:7), five miles south of Jerusalem … Samuel anoints David at Bethlehem'
  - where: 'note 5:2 “Little Beth-lehem, David’s town”'
    claim: 'Ephratah a family name in Judah and the region; David lived in Bethlehem in his youth'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Ephratah was a family name within the tribe of Judah and was the name of the region in which Bethlehem was located'
  - where: 'note 5:2 “Little Beth-lehem, David’s town”'
    claim: 'David lived in Bethlehem in his youth'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Bethlehem was also where King David lived in his youth'
  - where: 'note 5:2 “Little Beth-lehem, David’s town”'
    claim: 'Ephratah distinguishes the Bethlehem of Judah from the one in Zebulun'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'Ephratah is simply an additional name to distinguish the Bethlehem in Judah from another Bethlehem in the land assigned to the tribe of Zebulun (see Joshua 19:15).'
  - where: 'note 5:2 “Little Beth-lehem, David’s town”'
    claim: '“Thousands” rendered “clans”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+5&version=NRSVUE'
    quote: 'who are one of the little clans of Judah'
  - where: 'note 5:2 “Little Beth-lehem, David’s town”'
    claim: 'Samuel sent to Jesse the Beth-lehemite'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/16?lang=eng'
    quote: 'I will send thee to Jesse the Beth-lehemite'

  # ---- note 5:2 Matthew and JST ----
  - where: 'note 5:2 “How Matthew and the Joseph Smith Translation read it”'
    claim: 'The chief priests and scribes used Micah 5:2 to answer Herod'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'King Herod consulted the chief priests and scribes, who used Micah 5:2 to identify Bethlehem as the prophesied birthplace of the Messiah.'
  - where: 'note 5:2 “How Matthew and the Joseph Smith Translation read it”'
    claim: 'Matthew’s wording of the prophecy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/2?lang=eng'
    quote: 'And thou Bethlehem, in the land of Juda, art not the least among the princes of Juda: for out of thee shall come a Governor, that shall rule my people Israel.'
  - where: 'note 5:2 “How Matthew and the Joseph Smith Translation read it”'
    claim: 'Matthew gives the substance freely; “not the least” alters the thought toward Bethlehem’s glorification'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/5.htm'
    quote: 'does not constitute a discrepancy, but simply alters the thought with an allusion to the glorification which Bethlehem would receive through the fact of the Messiah''s springing from it'
  - where: 'note 5:2 “How Matthew and the Joseph Smith Translation read it”'
    claim: 'The quotation gives the substance freely'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/5.htm'
    quote: 'In the quotation of this verse in Matthew 2:6, the substance is given freely from memory'
  - where: 'note 5:2 “How Matthew and the Joseph Smith Translation read it”'
    claim: '“Princes” for “thousands” does not alter the idea, since the families had heads'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/5.htm'
    quote: 'it does not alter the idea, since the families (''ălâphı̄m) had their heads, who represented and led them'
  - where: 'note 5:2 “How Matthew and the Joseph Smith Translation read it”'
    claim: '“Princes” suggested by the personified town and the ruler who follows'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/5.htm'
    quote: 'was very naturally suggested by the personification of Bethlehem, and still more by the thought of the ἡγούμενος about to follow'
  - where: 'note 5:2 “How Matthew and the Joseph Smith Translation read it”'
    claim: 'JST Matthew 3:5–6 wording'
    key: jst-matt-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
    quote: 'It is written by the prophets, that he should be born in Bethlehem of Judea'
  - where: 'note 5:2 “How Matthew and the Joseph Smith Translation read it”'
    claim: 'JST Matthew 3:6 wording'
    key: jst-matt-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-matt/3?lang=eng'
    quote: 'in thee shall be born a prince, which art not the least among the princes of Judea; for out of thee shall come the Messiah, who shall save my people Israel.'
  - where: 'note 5:2 “How Matthew and the Joseph Smith Translation read it”'
    claim: 'The prophecy later used to argue wrongly Jesus was not the Messiah; they knew only Galilee'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'These people did not know Jesus had been born in Bethlehem; they only knew He was from Galilee.'
  - where: 'note 5:2 “How Matthew and the Joseph Smith Translation read it”'
    claim: 'John does not answer the doubters with the fact of Bethlehem; those who proclaimed Jesus did so out of belief'
    key: matson-fourth-gospel
    url: 'https://rsc.byu.edu/thou-art-christ-son-living-god/fourth-gospel-expectations-jewish-messiah'
    quote: 'he records that those who proclaimed him as the Christ did so out of belief, not out of the certainty that those who joined the Jews were seeking'
  - where: 'note 5:2 “How Matthew and the Joseph Smith Translation read it”'
    claim: 'John 7:41 question'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/7?lang=eng'
    quote: 'Shall Christ come out of Galilee?'

  # ---- note 5:2 goings forth ----
  - where: 'note 5:2 “A Ruler whose origins are from everlasting”'
    claim: 'Only Old Testament prophecy naming the Messiah’s birthplace; fulfilled in Jesus’s birth'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'This is the only prophecy in the Old Testament that specifically names the birthplace of the Messiah, and it was fulfilled when Jesus Christ was born in Bethlehem.'
  - where: 'note 5:2 “A Ruler whose origins are from everlasting”'
    claim: 'Môṣāʾôt at Micah 5:2: his origin'
    key: bdb
    url: 'https://biblehub.com/hebrew/4163.htm'
    quote: 'Micah 5:1 מוֺצָאוֺתָיו (compare future ruler out of Bethlehem), his origin.'
  - where: 'note 5:2 “A Ruler whose origins are from everlasting”'
    claim: 'The Hebrew words of the phrase'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'וּ/מוֹצָאֹתָ֥י/ו'
  - where: 'note 5:2 “A Ruler whose origins are from everlasting”'
    claim: 'Modern rendering of the phrase'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+5&version=NRSVUE'
    quote: 'whose origin is from of old,'
  - where: 'note 5:2 “A Ruler whose origins are from everlasting”'
    claim: 'The word conveys unknown time'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'The Hebrew word often translated by Christians as “eternal” or “everlasting” conveys the idea of unknown time.'
  - where: 'note 5:2 “A Ruler whose origins are from everlasting”'
    claim: 'The words affirm origin before all worlds and appearances in olden time; presupposes divine nature'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/5.htm'
    quote: 'the words affirm both the origin of the Messiah before all worlds and His appearances in the olden time'
  - where: 'note 5:2 “A Ruler whose origins are from everlasting”'
    claim: 'An origin before all worlds presupposes divine nature'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/5.htm'
    quote: 'The announcement of the origin of this Ruler as being before all worlds unquestionably presupposes His divine nature'
  - where: 'note 5:2 “A Ruler whose origins are from everlasting”'
    claim: 'Fulfilment in Matthew 2:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/2?lang=eng'
    quote: 'And thou Bethlehem, in the land of Juda'

  # ---- note 5:3 ----
  - where: 'note 5:3 “Given up until a birth”'
    claim: '“Give up” used of surrendering Israel to its enemies as punishment'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/5.htm'
    quote: 'נתן is applied, as in 1 Kings 14:16, to the surrender of Israel into the power of its enemies as a punishment for its sins'
  - where: 'note 5:3 “Given up until a birth”'
    claim: 'Most Christian interpreters read the travailing woman as the mother of the Messiah; others as the community'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/5.htm'
    quote: 'The travailing woman (yōlēdâh) is not the community of Israel (Theodoret, Calvin, Vitringa, and others), but the mother of the Messiah (Cyril, and most of the Christian expositors'
  - where: 'note 5:3 “Given up until a birth”'
    claim: 'His brethren are the Judaeans; return is to the Lord; with those left of the ten tribes'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/5.htm'
    quote: 'the brethren of the Ruler born at Bethlehem, are the Judaeans as the members of the Messiah''s own tribe'
  - where: 'note 5:3 “Given up until a birth”'
    claim: 'Return to the Lord, together with the remnant of the ten tribes'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/5.htm'
    quote: 'to return, not from exile to Canaan, but to Jehovah'
  - where: 'note 5:3 “Given up until a birth”'
    claim: '“The sons of Israel” are those left of the ten tribes'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/5.htm'
    quote: '"the sons of Israel" are the Israelites of the ten tribes, and, in this connection, those that are left of the ten tribes'
  - where: 'note 5:3 “Given up until a birth”'
    claim: 'The travailing woman read with Micah 4:9'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'would hand over the invaders to judg - ment until the travailing woman gave birth (see Micah 4:9).'
  - where: 'note 5:3 “Given up until a birth”'
    claim: 'Micah 4:10 uses the image of Zion in labour'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/4?lang=eng'
    quote: 'Be in pain, and labour to bring forth, O daughter of Zion, like a woman in travail'

  # ---- note 5:5 ----
  - where: 'note 5:5 “He shall be the peace”'
    claim: 'The Messiah called the Prince of peace in Isaiah 9:6'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'In this relation the Messiah is called the Prince of peace in [Isaiah 9:6]'
  - where: 'note 5:5 “He shall be the peace”'
    claim: 'Seven sufficient, eight more than required'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'Seven is mentioned as the number of the works proceeding from God, so that seven shepherds, i.e. princes, would be quite sufficient; and this number is surpassed by the eight, to express the thought that there might be even more than were required.'
  - where: 'note 5:5 “He shall be the peace”'
    claim: 'Assyria a type of the nations of the world'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'Asshur is a type [symbol] of the nations of the world by which the people of the Lord are attacked'
  - where: 'note 5:5 “He shall be the peace”'
    claim: 'The prophecy did not come about in Assyria’s time; Judah became a vassal'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'This prophecy did not come about during the time of Assyria. In fact, Judah became a vassal to Assyria after Israel’s destruction (2 Kings 18:15).'
  - where: 'note 5:5 “He shall be the peace”'
    claim: 'Final fulfilment in Christ’s victory over death and the grave'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'Jesus Christ was the final fulfillment of this prophecy. Jesus has victory over His foes: death and the grave'
  - where: 'note 5:5 “He shall be the peace”'
    claim: 'Jesus did not take part in a violent defense of Judah'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'Of course, in the first century Jesus did not participate in any violent defense of Judah.'
  - where: 'note 5:5 “He shall be the peace”'
    claim: 'The final fulfilment in Christ’s victory over death, with 1 Corinthians 15:55'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'Jesus has victory over His foes: death and the grave (“O death, where is thy sting? O grave, where is thy victory?” [1 Corinthians 15:55])'

  # ---- note 5:7 ----
  - where: 'note 5:7 “Dew, a blessing or a warning?”'
    claim: 'Most commentators read dew as positive; some read it negatively with 2 Samuel 17:12'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'Most commentators have assumed that this image is a positive one,[29] but some more astutely note a possible negative meaning'
  - where: 'note 5:7 “Dew, a blessing or a warning?”'
    claim: 'The lion symbolizes the remnant’s eventual triumph over its enemies'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Micah compared this remnant to a powerful lion, symbolizing how it would eventually triumph over its enemies.'
  - where: 'note 5:7 “Dew, a blessing or a warning?”'
    claim: 'Dew and lion as parallel images of the end of those who oppose God'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'seem in the end to serve as closely parallel ways of envisioning the unfortunate end for all who oppose God’s work'
  - where: 'note 5:7 “Dew, a blessing or a warning?”'
    claim: 'Dew in a military context at 2 Samuel 17:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/17?lang=eng'
    quote: 'we will light upon him as the dew falleth on the ground: and of him and of all the men that are with him there shall not be left so much as one'
  - where: 'note 5:7 “Dew, a blessing or a warning?”'
    claim: 'Whether surrounded in the land or scattered is unclear; Micah’s audience would understand Israelites in the land'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'Whether that means Israelites would be surrounded in the land of Israel or whether this remnant would be scattered abroad, or both, is not clear from this passage'
  - where: 'note 5:7 “Dew, a blessing or a warning?”'
    claim: 'Micah’s audience would have understood the remnant as Israelites in the land'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'Micah’s audience would have most likely understood this “remnant of Jacob” to be Israelite descendants in the land of Israel and the Middle East, no matter how broadly Jehovah may have intended it'
  - where: 'note 5:7 “Dew, a blessing or a warning?”'
    claim: 'The remnant refers to descendants of surviving Israelites'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'a remnant of the house of Israel, which refers to the descendants of surviving Israelites'

  # ---- note 5:8 lion ----
  - where: 'note 5:8 “The remnant as a lion”'
    claim: 'The Asiatic lion common in the ancient Near East; lions a royal image'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'the “Asiatic lion . . . was once common throughout the ancient Near East and Mediterranean.”[30] Lions were a popular royal image among Israelites and other ancient Near Eastern people owing to lions’ power, strength, majesty, and danger.'
  - where: 'note 5:8 “The remnant as a lion”'
    claim: 'Lion imagery associated with Jehovah; Jehovah used real lions to punish'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'Lion imagery is figuratively associated with Jehovah himself in a number of these passages.[34] And some biblical passages attribute to Jehovah the use of real lions to execute his punishment on people (e.g., 1 Kings 13:24–26'
  - where: 'note 5:8 “The remnant as a lion”'
    claim: 'The lion preys on wild beasts and domestic animals; feared by every creature'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'a lion // young lion preys on both wild beasts and domesticated animals, signifying that the lion should be feared by every creature'
  - where: 'note 5:8 “The remnant as a lion”'
    claim: '“Treadeth down” is r-m-s, to trample, used of the Lord in Isaiah 63:3'
    key: pike-micah
