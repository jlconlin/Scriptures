chapter: 3
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Micah prophesied in Judah under Jotham, Ahaz and Hezekiah, in the eighth century B.C.'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Micah was a prophet in the Southern Kingdom of Judah during the reigns of Jotham, Ahaz, and Hezekiah in the eighth century BC.'
  - where: 'when'
    claim: 'About 740 to 697 B.C.'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'His preaching, therefore, took place during the years from approximately 740 B.C. to 697 B.C.'

  # ---- setting ----
  - where: 'setting'
    claim: 'Chapters 1–3 warn that Samaria and Jerusalem will be destroyed, for idolatry, oppression of the poor and corrupt religious leaders'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Micah 1–3: A warning that Samaria and Jerusalem will be destroyed because of idolatry, oppression of the poor, and the corruption of religious leaders.'
  - where: 'setting'
    claim: 'Chapters 1–3 are judgment especially for the iniquity of political and religious leaders'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'chapters 1–3 include strongly worded prophecies of judgment and doom against Samaria … and Jerusalem … and especially because of the iniquity of their political and religious leaders'
  - where: 'setting'
    claim: 'Another reading divides the book into three sequences, chapters 1–2, 3–5 and 6–7'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'The book divides into three sequences (chapters 1–2, chapters 3–5, and chapters 6–7), each concluding with a reflection on the theme of the remnant.'
  - where: 'setting'
    claim: 'The book falls into three blocks, each beginning with a call (1:2; 3:1; 6:1)'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'The book can be divided into three blocks, each beginning with a call to action (Micah 1:2; 3:1; 6:1).'
  - where: 'setting'
    claim: 'In chapter 3 Micah focuses on corruption in Judah’s courts and in its religious institutions'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'In Micah 3, the prophet again focuses on the sins of Judah but now with an intense focus on corruption, both in Judah’s political institutions (especially in the courts) and in Judah’s religious institutions (thanks especially to false prophets).'

  # ---- thread ----
  - where: 'thread'
    claim: 'The chapter falls into three strophes of four verses: princes, false prophets, and all the leaders with the sentence on Jerusalem'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/3.htm'
    quote: 'proclaims, in three strophes of four verses each, (a) to the princes, who turn right into wrong and flay the people (Micah 3:1-4), and (b) to the false prophets'
  - where: 'thread'
    claim: 'After the harsh words Micah interrupts with a message of promise'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'But then, as before, Micah interrupts these harsh words with a prophetic message of promise.'
  - where: 'thread'
    claim: 'In 4:1–2 the wasted temple mount of 3:12 is restored'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'In the future, the wasted temple mount would be restored (compare Micah 3:12).'

  # ---- notes ----
  - where: 'note 3:1 “The rulers who should know justice”'
    claim: 'Micah describes Jerusalem’s judicial system'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'Micah describes the judicial system in Jerusalem as cannibalistic, with judges who not only “hate the good, and love the evil”'
  - where: 'note 3:3 “Rulers as butchers”'
    claim: 'The rulers are likened to cannibals'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'he likened them and their use of administrative powers to a group of cannibals who eat the flesh and break the bones of their own people (see Micah 3:2–3)'
  - where: 'note 3:3 “Rulers as butchers”'
    claim: 'The images describe the judicial system as cannibalistic'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'Micah describes the judicial system in Jerusalem as cannibalistic'
  - where: 'note 3:5 “Peace for a meal, war for no meal”'
    claim: '“Bite with their teeth” is joined to “cry, Peace”: they preach peace if they get something to eat; the Aramaic Targum already read it so'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/3.htm'
    quote: 'in the sense of "who preach peace if they can bite with their teeth," i.e., if they receive something to bite (or eat). This explanation, which has already been expressed by the Chaldee'
  - where: 'note 3:5 “Peace for a meal, war for no meal”'
    claim: '“Prepare war” is literally “sanctify war,” to declare a holy war'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/3.htm'
    quote: 'Qiddēsh milchâmâh, to sanctify war, i.e., to preach a holy war (cf. Joel 3:9), or, in reality, to proclaim the vengeance of God.'
  - where: 'note 3:5 “Peace for a meal, war for no meal”'
    claim: 'The idiom comes from the custom of opening a campaign with sacrifice'
    key: bdb
    url: 'https://biblehub.com/hebrew/6942.htm'
    quote: 'c. war, or warriors, from custom of opening campaign by sacrifice, (עַל) מִלְחָמָה ׳ק Jeremiah 6:4; Joel 4:9; Micah 3:5'
  - where: 'note 3:5 “Peace for a meal, war for no meal”'
    claim: 'The Hebrew of the phrase has the word for war after the verb qadash'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'מִלְחָמָֽה'
  - where: 'note 3:7 “Covering the mouth: no answer from God”'
    claim: 'The word rendered “lips” is the moustache; the same phrase is used in Leviticus 13:45 and Ezekiel 24:17, 22'
    key: bdb
    url: 'https://biblehub.com/hebrew/8222.htm'
    quote: 'שָׂפָם noun [masculine] moustache … ׳עָטָה עַלשֿׂ Micah 3:7; Ezekiel 24:17,22; Leviticus 13:45'
  - where: 'note 3:7 “Covering the mouth: no answer from God”'
    claim: 'True prophecy ceases: a night without vision; God does not hear (v. 4) and gives no answer (v. 7)'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'What better way is there to describe this deplorable condition than to compare it to a night without vision or a day without light? (see v. 6.) When men cry unto God, “he will not hear them” (v. 4).'
  - where: 'note 3:8 “Full of justice”'
    claim: 'The word rendered “judgment” in verses 1, 8 and 9 is mishpat'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'מִשְׁפָּ֔ט'
  - where: 'note 3:8 “Full of justice”'
    claim: 'Mishpat is a verdict pronounced judicially and, abstractly, justice'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/4941.htm'
    quote: 'properly, a verdict (favorable or unfavorable) pronounced judicially, especially a sentence or formal decree … abstractly, justice'
  - where: 'note 3:10 “Built with blood”'
    claim: 'Jerusalem built with blood and iniquity rather than truth and justice'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'All this amounts to a building up of Jerusalem “with blood” and “with iniquity” rather than with truth and justice (3:10)'
  - where: 'note 3:11 “Judges, priests and prophets for hire”'
    claim: 'The leaders, priests and prophets were all taking money for their services'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'The leaders, priests, and prophets were all taking money for their services.'
  - where: 'note 3:11 “Judges, priests and prophets for hire”'
    claim: 'The Church’s footnote at “money” is Priestcraft'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/3?lang=eng'
    quote: 'TG Priestcraft.'
  - where: 'note 3:11 “Judges, priests and prophets for hire”'
    claim: 'Scripture Helps compares Micah 3:9–12 with Isaiah 1:23'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Compare Micah 2:12 with Isaiah 10:20–22; Micah 3:9–12 with Isaiah 1:23'
  - where: 'note 3:12 “Zion plowed: a warning remembered”'
    claim: 'Jeremiah 26:18 quotes the verse in Hezekiah’s days; v. 19 says Hezekiah feared the Lord and the Lord repented of the evil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/26?lang=eng'
    quote: 'Micah the Morasthite prophesied in the days of Hezekiah king of Judah, and spake to all the people of Judah, saying, Thus saith the Lord of hosts; Zion shall be plowed like a field'
  - where: 'note 3:12 “Zion plowed: a warning remembered”'
    claim: 'Remembered a century later in Jeremiah’s time'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'His prophecies concerning the destruction of Jerusalem were remembered a century later during the time of Jeremiah.'
  - where: 'note 3:12 “Zion plowed: a warning remembered”'
    claim: 'In Hezekiah’s day the Assyrians took every stronghold but Jerusalem, which was preserved'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'The result was that the forces of Sennacherib pummeled every major stronghold of Judah except one.'
  - where: 'note 3:12 “Zion plowed: a warning remembered”'
    claim: 'Jerusalem was preserved'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'In the end, Jerusalem was preserved, but Assyria maintained control over Judah.'
  - where: 'note 3:12 “Zion plowed: a warning remembered”'
    claim: 'The temple was destroyed by Nebuchadnezzar’s armies in 586 B.C.'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'The destruction of the temple in Jerusalem by Nebuchadnezzar’s armies in 586 BC'
  - where: 'note 3:12 “Zion plowed: a warning remembered”'
    claim: '“Heaps” is a word for ruins, heaps of ruins'
    key: bdb
    url: 'https://biblehub.com/hebrew/5856.htm'
    quote: 'עִי noun [masculine] ruin, heap of ruins'
  - where: 'note 3:12 “The temple hill gone to forest”'
    claim: 'The Church’s footnote explains “the house” as the temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/3?lang=eng'
    quote: 'IE the temple.'
  - where: 'note 3:12 “The temple hill gone to forest”'
    claim: 'The temple is compared to the destroyed idolatrous high places'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'Ultimately, Zion and Jerusalem would be wasted, and the temple would be left like any other destroyed high place. The temple was now being compared to the idolatrous apostate high places of worship'
  - where: 'note 3:1 “The rulers who should know justice”'
    claim: 'The word rendered “princes” means a ruler, a man in authority'
    key: bdb
    url: 'https://biblehub.com/hebrew/7101.htm'
    quote: '3 more Generally, ruler, man in authority, Isaiah 1:10; Isaiah 22:3; Micah 3:1,9'
  - where: 'note 3:3 “Rulers as butchers”'
    claim: 'The imagery seared in its condemnation'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'vivid imagery that seared in its condemnation of their wickedness'
  - where: 'note 3:7 “Covering the mouth: no answer from God”'
    claim: 'When false prophets prophesy lies, true prophecy ceases'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'When these false prophets prophesied their lies, true prophecy would cease throughout the land and gross apostasy would set in.'

  - where: 'note 3:10 “Built with blood”'
    claim: 'Building Zion with blood means getting the means for fine buildings by extortion and judicial murder, as Ahab and later Jehoiakim did'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/3.htm'
    quote: 'obtain the means of erecting splendid buildings by cruel extortions, and partly also by actual judicial murders, as Ahab (1 Kings 21 compared with Micah 6:16), and after him Jehoiakim, had done (Jeremiah 22:13-17)'
  - where: 'note 3:10 “Built with blood”'
    claim: 'Those who build so labour for the city’s destruction'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/3.htm'
    quote: 'They do not, however, truly build the city by this, they simply labour for its destruction (Micah 3:12).'
  - where: 'note 3:11 “Judges, priests and prophets for hire”'
    claim: 'The leaders hired professional religionists to cloak their misdeeds'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'So the rich and unscrupulous leaders of Israel found it easy—for a price—to hire professional religionists to cover their actions by flattery and falsehood.'
  - where: 'note 3:11 “Is not the LORD among us?”'
    claim: 'They relied on Jehovah’s presence in His temple to protect the city'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/3.htm'
    quote: 'placed their reliance upon Jehovah, upon the assurance that He was in the midst of them enthroned in His temple at Jerusalem, and that He would protect the city and its inhabitants from misfortune'
  - where: 'note 3:11 “Is not the LORD among us?”'
    claim: 'They relied on Him without reflecting that the Holy One demands holiness of life'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/3.htm'
    quote: 'without ever reflecting that Jehovah as the Holy One demands sanctification of life'
  - where: 'note 3:11 “Is not the LORD among us?”'
    claim: 'The temple hill is named to destroy false trust in the temple (cf. Jeremiah 7:4)'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/3.htm'
    quote: 'The mountain of the house, i.e., the temple hill, is also specially mentioned, for the purpose of destroying all false trust in the temple (cf. Jeremiah 7:4).'

  # ---- christ ----
  - where: 'christ'
    claim: 'Nephi: the Lord commands that there be no priestcrafts (2 Ne. 26:24 and 26:31 are quoted with their references)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/26?lang=eng'
    quote: 'He commandeth that there shall be no priestcrafts; for, behold, priestcrafts are that men preach and set themselves up for a light unto the world, that they may get gain and praise of the world'
