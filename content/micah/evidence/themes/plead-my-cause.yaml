page: plead-my-cause
claims:
  - where: 'opening'
    claim: 'The rîb of 7:9 is the judicial conflict between Israel and the heathen power; the Lord conducts it'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/7.htm'
    quote: 'ריבי is the judicial conflict between Israel and the heathen power of the world. … This the church will bear, till the Lord conducts its conflict and secures its rights.'
  - where: 'opening'
    claim: 'Micah 6–7 is called a covenant lawsuit (Hebrew ryb)'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'chapters 6–7 contain Jehovah’s indictment of his people for violating their covenant with him and the resulting consequences (thus, a covenant lawsuit; Hebrew ryb)'
  - where: 'section “Witness against, and no answer”'
    claim: 'Each of the three blocks begins with a call: 1:2; 3:1; 6:1'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'The book can be divided into three blocks, each beginning with a call to action (Micah 1:2; 3:1; 6:1).'
  - where: 'section “Witness against, and no answer”'
    claim: 'The book uses legal words (witness 1:2, justice, judgment, indictment 6:1–2)'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'Words with legal connotation are used throughout the book, such as justice (3:1, 8–9; 6:8), judgment (3:11, 7:9), judge (4:3, 5:1, 7:3), witness (1:2), and indictment (6:1–2).'
  - where: 'section “Witness against, and no answer”'
    claim: '“Will not hear them” in 3:4 is the verb ʿānâ, “answer” (H6030; also 6:3, 6:5)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'יַעֲנֶ֖ה'
  - where: 'section “Witness against, and no answer”'
    claim: 'The Church’s note on “cry” (3:4) goes to Mosiah 11:24 (23–25)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/3?lang=eng'
    quote: 'Mosiah 11:24'
  - where: 'section “Witness against, and no answer”'
    claim: 'Mosiah 11:25: the Lord will not hear unless they repent'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/11?lang=eng'
    quote: 'And except they repent in sackcloth and ashes, and cry mightily to the Lord their God, I will not hear their prayers'
  - where: 'section “The controversy, and what He requires”'
    claim: 'The mountains are called to bear witness on behalf of the Lord and against Israel'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/6.htm'
    quote: 'to bear witness on behalf of the Lord, and against Israel.'
  - where: 'section “The controversy, and what He requires”'
    claim: '“Testify against me” is “answer against me, i.e., accuse me”'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/6.htm'
    quote: 'ענה בי, answer against me, i.e., accuse me.'
  - where: 'section “The controversy, and what He requires”'
    claim: 'Salvation is not earned'
    key: renlund-do-justly
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/10/55renlund?lang=eng'
    quote: 'The answer is no. Good deeds are not sufficient. Salvation is not earned.'
  - where: 'section “Until he plead my cause”'
    claim: 'Micah speaks on behalf of the people in 7:8–13'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: '7:8–13 Micah appeared to be speaking on behalf of the people.'
  - where: 'section “Until he plead my cause”'
    claim: 'The cause is Israel’s conflict with the world power; the Lord conducts it and secures its rights'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/7.htm'
    quote: 'ריבי is the judicial conflict between Israel and the heathen power of the world. … This the church will bear, till the Lord conducts its conflict and secures its rights.'
  - where: 'section “Until he plead my cause”'
    claim: 'The Student Manual reads 7:7–9 as Israel’s restoration: the Lord will plead her cause'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'He will plead her cause and bring her “forth to the light” (vv. 8–9).'
  - where: 'section “Until he plead my cause”'
    claim: 'Connection made by this page: the verb rîb (H7378) stands in Micah only at 6:1 and 7:9 (6:1 “contend”; 7:9 “plead”); the noun rîb (H7379) only at 6:2 (twice) and 7:9 (“my cause”); the Lord’s controversy in 6:2 and the cause He pleads in 7:9 are the same word'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'יָרִ֤יב'
  - where: 'section “Until he plead my cause”'
    claim: 'Connection made by this page (noun): rîb in 7:9 “my cause” (H7379: 6:2 twice, 7:9)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'רִיבִ/י֙'
  - where: 'section “Until he plead my cause”'
    claim: 'Connection made by this page: “to do justly” (6:8, ʿăśôt mišpāṭ) and “execute judgment for me” (7:9, wĕʿāśâ mišpāṭî) both join ʿāśâ and mišpāṭ; mišpāṭ (H4941) stands five times, 3:1, 3:8, 3:9, 6:8, 7:9, and only 6:8 and 7:9 have it with “do”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'עֲשׂ֤וֹת'
  - where: 'section “Until he plead my cause”'
    claim: 'Connection made by this page (second half): 7:9 mišpāṭ with ʿāśâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'מִשְׁפָּטִ֔/י'
  - where: 'section “He delighteth in mercy”'
    claim: 'The book ends with the Lord’s willingness to forgive all who repent'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'The book ends with Micah’s testimony of Jehovah’s compassion and His willingness to forgive all who repent.'
  - where: 'section “He delighteth in mercy”'
    claim: 'To love mercy as God does is inseparably connected to dealing justly'
    key: renlund-do-justly
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/10/55renlund?lang=eng'
    quote: 'To love mercy as God does is inseparably connected to dealing justly with others and not mistreating them.'
  - where: 'section “The Advocate”'
    claim: 'Isa. 51:22 uses the verb of Micah 7:9 (H7378)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'יָרִ֣יב'
  - where: 'section “The Advocate”'
    claim: 'Jer. 50:34 uses the verb and noun of Micah 7:9 (H7378, H7379)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'יָרִ֖יב'
  - where: 'section “The Advocate”'
    claim: 'Connection made by this page: “plead my cause” (Micah 7:9) set beside “pleading your cause” (D&C 45:3), the same English, the Lord the one who pleads; no note in D&C 45 cites Micah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'Listen to him who is the advocate with the Father, who is pleading your cause before him—'
  - where: 'section “The Advocate”'
    claim: 'Jesus Christ is our Advocate and pleads our cause with the Father'
    key: gs-advocate
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/advocate?lang=eng'
    quote: 'Jesus Christ is our Advocate with the Father (Moro. 7:28) and pleads our cause with Him.'
  - where: 'section “The Advocate”'
    claim: 'If the sinner repents, the Savior pays the penalty through the Atonement, invoking mercy'
    key: gs-justice
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/justice?lang=eng'
    quote: 'If he does repent, the Savior pays the penalty through the Atonement, invoking mercy (Alma 34:16).'
  - where: 'section “Where this reaches now”'
    claim: 'JST 1 Jn. 2:1: if any man sin and repent, we have an advocate with the Father'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-jn/2?lang=eng'
    quote: 'But if any man sin and repent, we have an advocate'
  - where: 'section “Where this reaches now”'
    claim: 'A just person repents when falling short and keeps on trying'
    key: renlund-do-justly
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/10/55renlund?lang=eng'
    quote: 'A just person chooses to obey the commandments of God, repents when falling short, and keeps on trying.'
  - where: 'section “Where this reaches now”'
    claim: 'Elder Christofferson: my Advocate … will plead my cause'
    key: ensign-2014-advocate
    url: 'https://www.churchofjesuschrist.org/study/ensign/2014/07/the-divine-mission-of-jesus-christ-advocate?lang=eng'
    quote: 'that my Advocate, him who did no sin, whose blood was shed, will plead my cause.'
