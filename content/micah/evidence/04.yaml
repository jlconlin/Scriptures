chapter: 4
claims:
  - where: 'when'
    claim: 'Micah prophesied under Jotham, Ahaz and Hezekiah, about 740–697 B.C.'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'the prophet’s ministry was during reigns of Jotham, Ahaz, and Hezekiah, kings of Judah. His preaching, therefore, took place during the years from approximately 740 B.C. to 697 B.C.'
  - where: 'setting'
    claim: 'Chapters 4–5 are the book’s second division, prophecies of restoration'
    key: bd-micah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/micah?lang=eng'
    quote: '(1) Micah 1–3, prophecies of judgment and ruin on the Jewish State … (2) Micah 4–5, prophecies of restoration, with brilliant messianic promises.'
  - where: 'setting'
    claim: 'Chapters 4–5 give hope and the promise that God will restore His people'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Micah 4–5: A message of hope and a promise that God will restore His people in a future day, and a prophecy that the Messiah would be born in Bethlehem.'
  - where: 'setting'
    claim: 'Another reading takes chapters 3–5 as one sequence, from doom to the remnant’s redemption'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'Chapters 3–5 also present prophecies of doom and destruction but then work their way toward anticipations of the remnant’s redemption.'
  - where: 'setting'
    claim: 'Micah 4:1–3 is nearly identical to Isaiah 2:2–4'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Micah 4:1–3 is nearly identical to Isaiah 2:2–4.'
  - where: 'setting'
    claim: 'Present, near and distant future events are mingled in chapters 4–5 and read differently by commentators'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'current (for Micah), near-future, and more distant future events mentioned in these chapters seem mingled together and have been interpreted differently by various commentators.'
  - where: 'setting'
    claim: 'The Savior quoted and expanded two of Micah’s prophecies to the Nephites'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'The Savior quoted from and expanded on two of Micah’s prophecies during His ministry to the Nephites and Lamanites in the Book of Mormon.'
  - where: 'thread'
    claim: 'Zion is exalted from deepest degradation to highest glory; 4:1–7 the temple mount, 4:8–13 the restored dominion through redemption from Babylon and victory'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/4.htm'
    quote: 'Zion will eventually be exalted from the deepest degradation to the highest glory.'
  - where: 'thread'
    claim: 'The war harvest of 4:12–13 contrasts with the ideal age of 4:1–5 when nations flow to the temple'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'This war harvest stands in sharp contrast to the ideal age described in Micah 4:1–5, when nations will flow to the temple in Jerusalem and peace will prevail.'
  - where: 'section 2 plain'
    claim: '“Halteth” is “is lame” in Hebrew'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/4?lang=eng'
    quote: '6a “halteth”: HEB is lame.'
  - where: 'section 2 plain'
    claim: 'Verse 8 rendered “hill of daughter Zion … the former dominion”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah%204&version=NRSVUE'
    quote: 'And you, O tower of the flock, hill of daughter Zion, to you it shall come, the former dominion shall come'
  - where: 'section 4 plain'
    claim: 'Verse 13 rendered “devote their gain to the Lord”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah%204&version=NRSVUE'
    quote: 'and shall devote their gain to the Lord, their wealth to the Lord of the whole earth.'

  - where: 'note 4:1 “After the plowed field, the exalted mountain”'
    claim: 'In Micah the vision follows prophecies of destruction; in Isaiah it precedes them'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'In the book of Micah, this vision follows prophecies of destruction and devastation and draws the reader’s attention to the promise of a preserved remnant of Israel … In the book of Isaiah, however, this vision precedes prophecies of destruction'
  - where: 'note 4:1 “After the plowed field, the exalted mountain”'
    claim: 'The wasted temple mount of 3:12 would be restored'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'In the future, the wasted temple mount would be restored (compare Micah 3:12).'
  - where: 'note 4:1 “After the plowed field, the exalted mountain”'
    claim: 'Micah 3:12 has “the mountain of the house as the high places of the forest”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/3?lang=eng'
    quote: 'Therefore shall Zion for your sake be plowed as a field, and Jerusalem shall become heaps, and the mountain of the house as the high places of the forest.'

  - where: 'note 4:5 “Walking in the name of the LORD”'
    claim: 'One reading: verse 5 is a promise, not an exhortation; walking in the name of God means walking in His strength (1 Sam. 17:45; Zech. 10:12)'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/4.htm'
    quote: 'Walking in the name of God does not mean regulating the conduct according to the name of a God … but walking in the strength of God, in which the nature of this God is displayed. This is the meaning of the phrase in 1 Samuel 17:45 and Zechariah 10:12'
  - where: 'note 4:5 “Walking in the name of the LORD”'
    claim: 'The verse assumes some nations will still not seek the Lord, and they cannot disturb the peace He creates'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/4.htm'
    quote: 'there will still be nations that do not seek Jehovah and His word, - a thought which is still further expanded in v. Micah 5:4., and involves this consolation, that such opponents of the people of God as shall be still in existence will not be able to interfere'
  - where: 'note 4:5 “Walking in the name of the LORD”'
    claim: 'The footnotes point verse 4 to 1 Kings 4:25 and verse 5 to Zechariah 10:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/4?lang=eng'
    quote: '4a “vine”: 1 Kgs. 4:25. … 5b “name”: Zech. 10:12.'
  - where: 'note 4:5 “Walking in the name of the LORD”'
    claim: 'One reading: because of the temple the people would bear the Lord’s name'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'Most likely because of the temple, the people would bear the name of the Lord.'

  - where: 'note 4:6 “The lame of the flock”'
    claim: 'The participle “her that halteth” is personified Judah as a flock (also Zeph. 3:19)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6760.htm'
    quote: 'feminine הַצֹלֵעָה as substantive, of personified Judah as flock [צאֹן] Micah 4:6,7; Zephaniah 3:19.'
  - where: 'note 4:6 “The lame of the flock”'
    claim: 'God gathers the survivors as a remnant over which He might rule in righteousness'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'God gathers the survivors of Israel’s difficult history as a remnant over which he might finally rule in righteousness'
  - where: 'note 4:6 “The lame of the flock”'
    claim: 'The footnote says “halteth” is “is lame” in Hebrew'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/4?lang=eng'
    quote: '6a “halteth”: HEB is lame.'

  - where: 'note 4:8 “The tower of the flock”'
    claim: 'The Hebrew of 4:8 has migdal ʿeder and ʿōphel'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'עֵ֗דֶר'
  - where: 'note 4:8 “The tower of the flock”'
    claim: 'ʿeder means flock, herd'
    key: bdb
    url: 'https://biblehub.com/hebrew/5739.htm'
    quote: 'I. עֵ֫דֶר noun masculineGenesis 29:2 flock, herd'
  - where: 'note 4:8 “The tower of the flock”'
    claim: 'A modern translation reads “hill of daughter Zion … the former dominion”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah%204&version=NRSVUE'
    quote: 'And you, O tower of the flock, hill of daughter Zion, to you it shall come, the former dominion shall come, the sovereignty of daughter Jerusalem.'
  - where: 'note 4:8 “The tower of the flock”'
    claim: 'Keil: not the tower near Bethlehem of Gen. 35:21 but the tower of David’s royal castle on Zion, named as a play on Jacob’s flock-tower because David was called from shepherding'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/4.htm'
    quote: 'migdal-‛ēder cannot be the flock-tower in the neighbourhood of Bethlehem, which is mentioned in Genesis 35:21, but can only be a (or rather the) tower of the Davidic palace, or royal castle upon Zion'
  - where: 'note 4:8 “The tower of the flock”'
    claim: 'The name plays on Jacob’s tower, since David was called from shepherding a flock to shepherd Israel; Micah describes the Messiah as shepherd in 5:4'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/4.htm'
    quote: 'called by Micah the flock-tower, probably as a play upon the flock-tower by which the patriarch Jacob once pitched his tent, because David, the ancestor of the divinely-chosen royal house, had been called from being the shepherd of a flock to be the shepherd of the nation of Israel'
  - where: 'note 4:8 “The tower of the flock”'
    claim: 'The “first dominion” is the rule of David and Solomon, lost with the destruction of 3:12'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/4.htm'
    quote: 'the former (first) reign, is the splendid rule of David and Solomon. This predicate presupposes that the sovereignty has departed from Zion, i.e., has been withdrawn from the Davidic family, and points back to the destruction of Jerusalem predicted in Micah 3:12.'
  - where: 'note 4:8 “The tower of the flock”'
    claim: 'Genesis 35:21 has “the tower of Edar”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/35?lang=eng'
    quote: 'And Israel journeyed, and spread his tent beyond the tower of Edar.'

  - where: 'note 4:10 “Even to Babylon”'
    claim: 'The prophecy is remarkable because Assyria ruled and Babylon was a province; it looked about 130 years ahead'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'This prophecy is amazing because Assyria was mistress of the world in Micah’s day, Babylon being only a province of Assyria. This part of Micah’s vision projected nearly 130 years into the future'
  - where: 'note 4:10 “Even to Babylon”'
    claim: 'Some read the line as a later addition; either way it speaks of the exile to Babylon'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'a prophecy or a later addition, the text speaks of the exile to Babylon, a major theme in the Old Testament.'
  - where: 'note 4:10 “Even to Babylon”'
    claim: 'The footnote at “Babylon” points to 1 Nephi 1:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/4?lang=eng'
    quote: '10b “Babylon”: 1 Ne. 1:13; Omni 1:15.'

  - where: 'note 4:10 “Labor pains that end in birth”'
    claim: 'Judah’s pain would bring forth new life in the Lord'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'Micah used the figure of travail or childbirth to illustrate that Judah would bring upon herself the pain out of which would eventually come a new life in the Lord.'
  - where: 'note 4:10 “Labor pains that end in birth”'
    claim: 'Micah 4:9–10 is among passages where Israel’s crisis is compared to childbirth and ends in deliverance by the promised king, the Messiah'
    key: sc-knowhy-93
    url: 'https://scripturecentral.org/knowhy/why-does-abinadi-use-the-phrase-the-bands-of-death'
    quote: 'Similar childbirth and atonement/redemption imagery can be found in Isaiah 37:3, Hosea 13:9–14, Micah 4:9–10 … Most of these passages speak of the people of Israel going through a time of crisis (which is compared to a woman in the pain of childbirth) and then being delivered by the promised king, the Messiah.'
  - where: 'note 4:10 “Labor pains that end in birth”'
    claim: 'The footnote at “travail” points to Isaiah 66:7–8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/4?lang=eng'
    quote: '10a “travail”: Isa. 66:7 (7–8).'

  - where: 'note 4:11 “Two gatherings of the nations”'
    claim: 'Nations are gathered like sheaves to the floor; Israel commanded to thresh them; a role reversal'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'The hope of a role reversal is plainly evident: Jerusalem/Zion, which has been at the mercy of its enemies for so long, will eventually, with Jehovah’s power, triumph over and destroy them all.'
  - where: 'note 4:11 “Two gatherings of the nations”'
    claim: 'The war harvest contrasts with the ideal age of 4:1–5'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'This war harvest stands in sharp contrast to the ideal age described in Micah 4:1–5, when nations will flow to the temple in Jerusalem and peace will prevail.'
  - where: 'note 4:11 “Two gatherings of the nations”'
    claim: 'Enemies gathered like bundles of grain; the prophecy likely has multiple fulfillments'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Micah’s prophecy likely has multiple fulfillments.'
  - where: 'note 4:11 “Two gatherings of the nations”'
    claim: 'The footnote at “gathered” points to Joel 3:2 and Zechariah 12:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/4?lang=eng'
    quote: '11a “gathered”: Joel 3:2 (1–2, 9–14); Zech. 12:3 (2–3).'

  - where: 'note 4:13 “Devoted to the Lord”'
    claim: 'BDB: devote to the Lord for sacred uses the spoil of the nations, Micah 4:13'
    key: bdb
    url: 'https://biblehub.com/hebrew/2763.htm'
    quote: '2 devote to ׳י: for sacred uses החרים ליהוה the spoil of the nations Micah 4:13'
  - where: 'note 4:13 “Devoted to the Lord”'
    claim: 'ḥ-r-m is now often translated “devote,” devoting by destroying; same root at Jericho'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'The Hebrew verb translated “consecrate” in verse 13, from the lexical root ḥ-r-m, is now often translated “devote,” as in devoting something to the Lord by destroying it. This same lexical root is used in the narrative of the Israelite destruction of Jericho'
  - where: 'note 4:13 “Devoted to the Lord”'
    claim: 'The horn signifies the ox’s power to gore; hooves crush grain'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'The “horn” signifies the power and danger of an ox that can gore someone.'
  - where: 'note 4:13 “Devoted to the Lord”'
    claim: 'A modern translation reads “devote their gain to the Lord”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah%204&version=NRSVUE'
    quote: 'and shall devote their gain to the Lord, their wealth to the Lord of the whole earth.'

  - where: 'note 4:13 “The Saviour’s use of the threshing ox”'
    claim: 'In 3 Nephi 20 Micah 4:12–13 follows Micah 5:8–9, reversing their order'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'In 3 Nephi 20, Micah 4:12–13 follows immediately after the occurrence of Micah 5:8–9. This obviously alters the order of these passages as found in the book of Micah'
  - where: 'note 4:13 “The Saviour’s use of the threshing ox”'
    claim: 'Micah gathers the nations; in 3 Nephi 20:18 the Lord gathers “my people”'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'Micah 4:12 refers to “the nations [goyîm; 4:11]” being gathered for destruction, but in 3 Nephi 20:18 the object of gather is “my people,” which could be any Israelite descendants'
  - where: 'note 4:13 “The Saviour’s use of the threshing ox”'
    claim: 'Verses 20–21 have no counterpart in Micah; the targets are unrepentant Gentiles'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'Lastly, 3 Nephi 20:20–21 has no counterpart in Micah 4. Verse 20 reiterates the point already made in verse 15 (also not in Micah) that it is unrepentant Gentiles who will be the target'
  - where: 'note 4:13 “The Saviour’s use of the threshing ox”'
    claim: 'The Savior used Micah’s words, after teaching the latter-day gathering, to warn Gentiles who reject the gospel'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'After teaching about the gathering of Israel in the latter days, the Savior referenced Micah’s words to warn of the destruction that awaited latter-day Gentiles who rejected the gospel.'
  - where: 'note 4:13 “The Saviour’s use of the threshing ox”'
    claim: 'The text of 3 Nephi 20:18–21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/20?lang=eng'
    quote: 'For I will make my people with whom the Father hath covenanted, yea, I will make thy horn iron, and I will make thy hoofs brass. … And behold, I am he who doeth it.'

  - where: 'christ'
    claim: 'The footnote at “reign” (4:7) points to Luke 1:33'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/4?lang=eng'
    quote: '7a “reign”: Luke 1:33 (30–33); D&C 1:36; A of F 1:10.'
  - where: 'christ'
    claim: 'Gabriel: he shall reign over the house of Jacob for ever'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'And he shall reign over the house of Jacob for ever; and of his kingdom there shall be no end.'
  - where: 'christ'
    claim: 'Travail imagery ends in deliverance by the promised king, the Messiah'
    key: sc-knowhy-93
    url: 'https://scripturecentral.org/knowhy/why-does-abinadi-use-the-phrase-the-bands-of-death'
    quote: 'Most of these passages speak of the people of Israel going through a time of crisis (which is compared to a woman in the pain of childbirth) and then being delivered by the promised king, the Messiah.'
  - where: 'christ'
    claim: 'Walking in the name of God is walking in His strength'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/4.htm'
    quote: 'but walking in the strength of God, in which the nature of this God is displayed.'
  - where: 'explore'
    claim: 'Zephaniah 3:19 uses the same word for the lame flock'
    key: bdb
    url: 'https://biblehub.com/hebrew/6760.htm'
    quote: 'of personified Judah as flock [צאֹן] Micah 4:6,7; Zephaniah 3:19.'

  - where: 'setting'
    claim: 'Babylon lay about 130 years ahead; the triumph over enemies looked several millennia ahead'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'This part of Micah’s vision projected nearly 130 years into the future, but time is nothing to a prophet. Then, looking several millennia into the future, Micah saw Israel return in the strength of God.'
  - where: 'note 4:1 “After the plowed field, the exalted mountain”'
    claim: 'Micah uses the vision to mark a transition from destruction to promise; Isaiah to highlight the distance'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'Thus, where the book of Micah uses the vision to mark a transition from destruction to promise, the book of Isaiah uses it to highlight the distance between present difficulties and future redemption.'
  - where: 'note 4:6 “The lame of the flock”'
    claim: 'ʿeder (flock) is used in simile at Micah 2:12'
    key: bdb
    url: 'https://biblehub.com/hebrew/5739.htm'
    quote: 'in simile also Micah 2:12; Jeremiah 31:10; Psalm 78:52; figurative of Israel Isaiah 40:11'
  - where: 'note 4:8 “The tower of the flock”'
    claim: 'ʿōphel is a fortified mound or hill within a city, in Jerusalem at Micah 4:8'
    key: bdb
    url: 'https://biblehub.com/hebrew/6076.htm'
    quote: 'mound, hill, only as acropolis; — ׳ע absolute 2 Kings 5:24 +, construct Micah 4:8; — fortified mound or hill within city, or Jerusalem'
  - where: 'note 4:8 “The tower of the flock”'
    claim: 'Genesis 35:21 has the same words, Migdal-eder'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'עֵֽדֶר'
  - where: 'note 4:8 “The tower of the flock”'
    claim: 'Rachel buried on the way to Bethlehem; Israel spread his tent beyond the tower of Edar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/35?lang=eng'
    quote: 'And Rachel died, and was buried in the way to Ephrath, which is Beth-lehem.'
  - where: 'note 4:8 “The tower of the flock”'
    claim: 'The epithet is natural for Micah, who describes the Messiah as shepherd (Heb. 5:3 = KJV 5:4) and Israel as the Lord’s sheep (7:14)'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/4.htm'
    quote: 'This epithet was a very natural one for the prophet to employ, as he not only describes the Messiah as a shepherd in Micah 5:3, but also represents Israel as the sheep of Jehovah''s inheritance in Micah 7:14'
  - where: 'note 4:10 “Labor pains that end in birth”'
    claim: 'Micah 5:3’s travailing woman has been read as pointing back to 4:9'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'would hand over the invaders to judg - ment until the travailing woman gave birth (see Micah 4:9).'
  - where: 'note 4:11 “Two gatherings of the nations”'
    claim: 'An ox threshes grain already gathered to the threshing floor by treading on it'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'The imagery of hooves in verse 13 that “beat in pieces” or crush depicts a powerful ox threshing grain, which has already been gathered to the threshing floor, by treading on it.'
  - where: 'note 4:13 “Devoted to the Lord”'
