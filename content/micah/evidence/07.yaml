chapter: 7
claims:
  - where: 'when'
    claim: 'Micah prophesied under Jotham, Ahaz and Hezekiah, about 740 to 697 B.C.'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'the prophet’s ministry was during reigns of Jotham, Ahaz, and Hezekiah, kings of Judah. His preaching, therefore, took place during the years from approximately 740 B.C. to 697 B.C.'
  - where: 'setting'
    claim: 'Chapters 6–7, in a different tone and style, move like the earlier parts from doom to the remnant’s redemption; the plight of Israel is presented more personally, through laments'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'And then chapters 6–7, with a rather different tone and style, do the same. In the last section, the plight of Israel is presented more personally than it is in Micah 1–5, through a series of laments about the impossibility of commending the covenant people to God.'
  - where: 'setting'
    claim: 'The book concludes on a hopeful and worshipful note, with confidence in God’s mercy to Abraham'
    key: spencer-remnant
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/prophets-remnant-theology'
    quote: 'The book of Micah thus concludes on a particularly hopeful and worshipful note, with confidence in God’s “mercy to Abraham” (7:20).'
  - where: 'setting'
    claim: 'The book ends with Micah’s testimony of Jehovah’s compassion and willingness to forgive all who repent'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'The book ends with Micah’s testimony of Jehovah’s compassion and His willingness to forgive all who repent.'
  - where: 'setting'
    claim: 'Chapter 7 begins with Micah mourning over Israel’s wickedness and coming destruction, then prophesies Israel’s return to righteousness'
    key: ot-institute-manual-47
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-institute-teacher-manual-2026/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Micah 7 begins with Micah mourning over the wickedness of the Israelites and the destruction that was coming because of their sins (see Micah 7:1–6). However, Micah prophesied that Israel would return to righteousness in a future day with the Lord’s help.'
  - where: 'setting'
    claim: 'Come, Follow Me takes the lesson title from 7:18: the Lord does not delight in condemning but in mercy'
    key: cfm-ot-2026-49
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/49?lang=eng'
    quote: 'As Micah put it, the Lord does not delight in condemning us, but “he delighteth in mercy” (Micah 7:18).'
  - where: 'thread'
    claim: 'Verses 1–6 use figures (the vine, the net, the brier) for the state of Israel’s wickedness'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'The prophet Micah employed three figures to portray the gross state of Israel’s wickedness: (1) the picture of a solitary grape upon the vine (see Micah 7:1); (2) a battle between a man with a net and a man without a net (see v. 2); and (3) the comparison of a wicked man to a briar or a thorn hedge (see v. 4).'
  - where: 'thread'
    claim: 'From verse 7 Israel looks to the Lord; though fallen to her enemies, the Lord will be her light, plead her cause, and her enemies will be ashamed; walls rebuilt and people gathered'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'Though her enemies have prevailed against her because of her wickedness, “the Lord shall be her light.” He will plead her cause and bring her “forth to the light” (vv. 8–9). Her enemies shall see it too and be ashamed (see v. 10).'
  - where: 'thread'
    claim: 'Verses 14–20 are a prayer for the fulfilment of the restoration, ending in a doxology'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: '“After promising Israel’s restoration, Micah prays beautifully for its fulfillment. The prayer is distinguished for the poetical elevation of its style and the appropriateness of its petition.'
  - where: 'thread'
    claim: 'Micah ends with a doxology praising God’s loving-kindness, faithfulness and compassion'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: '“Micah ends with a doxology. He revels in the prospect of Israel’s glorious future and breaks out into a strain of sublime praise and admiration for the divine attributes of loving-kindness, faithfulness, and compassion'
  - where: 'thread'
    claim: 'The prayer of verse 14 is answered by the Lord in verses 15–17, who promises to renew His covenant mercies and humble the hostile nations'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/7.htm'
    quote: 'The promise of salvation impels the congregation to pray that it may be granted (Micah 7:14); whereupon the Lord assures it that His covenant mercies shall be renewed, and promises the thorough humiliation of the hostile nations of the world (Micah 7:15-17).'
  - where: 'section 3 plain'
    claim: 'Plain words of 7:12 follow the reading “from Assyria to Egypt, and from Egypt to the River”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+7&version=NRSVUE'
    quote: 'On that day they will come to you from Assyria to Egypt and from Egypt to the River, from sea to sea and from mountain to mountain.'
  - where: 'section 1 plain'
    claim: 'Plain words of 7:3: the official and the judge ask for a bribe; they pervert justice'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+7&version=NRSVUE'
    quote: 'the official and the judge ask for a bribe, and the powerful dictate what they desire; thus they pervert justice.'

  - where: 'note 7:1 “No cluster left on the vine”'
    claim: 'Micah mourns over the wickedness of the Israelites and the coming destruction'
    key: ot-institute-manual-47
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-institute-teacher-manual-2026/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Micah 7 begins with Micah mourning over the wickedness of the Israelites and the destruction that was coming because of their sins (see Micah 7:1–6).'
  - where: 'note 7:1 “No cluster left on the vine”'
    claim: 'The prophet is like a solitary grape left after the gathering, the only one on God’s side; the first-ripe fruit is eminent piety, and he found only a spurious kind'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'He himself seemed to be the only person who was on God’s side; and he considers himself as a solitary grape, which had escaped the general gathering. … He desired to see the first-ripe fruit— distinguished and eminent piety; but he found nothing but a very imperfect or spurious kind of godliness.'
  - where: 'note 7:1 “No cluster left on the vine”'
    claim: 'The first-ripe fruit is the first-ripe fig'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+7&version=NRSVUE'
    quote: 'finds no cluster to eat; there is no first-ripe fig for which I hunger.'

  - where: 'note 7:3 “They weave it together”'
    claim: 'The verb rendered “wrap up” means to interlace, figuratively to pervert'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/5686.htm'
    quote: 'A primitive root; to interlace, i.e. (figuratively) to pervert -- wrap up.'
  - where: 'note 7:3 “They weave it together”'
    claim: 'A modern translation: the official and the judge ask for a bribe; thus they pervert justice'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+7&version=NRSVUE'
    quote: 'the official and the judge ask for a bribe, and the powerful dictate what they desire; thus they pervert justice.'
  - where: 'note 7:3 “They weave it together”'
    claim: 'The wicked sought to be paid to take part in evil'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: '7:3–4 The wicked sought to be paid to participate in evil. They were no better than briers and thorns that poke and cause pain.'

  - where: 'note 7:4 “The day of the watchmen”'
    claim: 'The watchmen are the prophets (as in Ezekiel 33:7); their day is explained by “thy visitation”; the verb treats the future as certain'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/7.htm'
    quote: 'The "day of thy watch-men," i.e., of thy prophets (Jeremiah 6:17; Ezekiel 3:17; Ezekiel 33:7), is explained in the apposition peqŭddâthekhâ (thy visitation). The perfect בּאה is prophetic of the future, which is as certain as if it were already there.'
  - where: 'note 7:4 “The day of the watchmen”'
    claim: 'The confusion: evil now dressed as good will break out without restraint'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/7.htm'
    quote: 'then will the wildest confusion come upon them, as the evil, which now envelopes itself in the appearance of good, will then burst forth without shame and without restraint, and everything will be turned upside down.'
  - where: 'note 7:4 “The day of the watchmen”'
    claim: 'The Church’s footnote glosses “visitation” as punishment'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/7?lang=eng'
    quote: '“visitation”: IE punishment.'
  - where: 'note 7:4 “The day of the watchmen”'
    claim: 'A modern translation: the day of their sentinels, of their punishment'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+7&version=NRSVUE'
    quote: 'The day of their sentinels, of their punishment, has come; now their confusion is at hand.'
  - where: 'explore'
    claim: 'The Savior appears to have had Micah 7:6 in mind in Matthew 10:35–36'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'The Savior appears to have had Micah 7:6in mind when He spoke the words recorded in Matthew 10:35–36.'
  - where: 'explore'
    claim: 'The Church’s footnotes at 7:6 point to Luke 12:53 and Matthew 10:36'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/7?lang=eng'
    quote: '“house”: Matt. 10:36 (35–36).'
  - where: 'note 7:8 “Fallen Israel speaks”'
    claim: 'From verse 8 Micah appears to speak on behalf of the people while wicked nations mock'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: '7:8–13 Micah appeared to be speaking on behalf of the people. Though wicked nations mocked,'
  - where: 'note 7:8 “Fallen Israel speaks”'
    claim: 'Israel’s enemies prevailed because of her wickedness; the Lord will be her light, plead her cause; her enemies will be ashamed'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'Though her enemies have prevailed against her because of her wickedness, “the Lord shall be her light.” He will plead her cause and bring her “forth to the light” (vv. 8–9). Her enemies shall see it too and be ashamed (see v. 10).'
  - where: 'note 7:11 “The decree, or the boundary”'
    claim: 'The word ḥōq is something prescribed, a statute; the lexicon lists Micah 7:11 under “prescribed limit, boundary … of land of Israel”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2706.htm'
    quote: '5 prescribed limit, boundary: of sea Jeremiah 5:22; Proverbs 8:29; Job 26:10; Job 38:10; of heavens Psalm 148:6; of land of Israel Micah 7:11'
  - where: 'note 7:11 “The decree, or the boundary”'
    claim: 'The word’s general sense is something prescribed, a statute'
    key: bdb
    url: 'https://biblehub.com/hebrew/2706.htm'
    quote: 'something prescribed, a statute or due'
  - where: 'note 7:11 “The decree, or the boundary”'
    claim: 'A modern translation: the boundary shall be far extended; they come from Assyria to Egypt and from Egypt to the River'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+7&version=NRSVUE'
    quote: 'A day for the building of your walls! On that day the boundary shall be far extended. On that day they will come to you from Assyria to Egypt and from Egypt to the River'
  - where: 'note 7:11 “The decree, or the boundary”'
    claim: 'Māṣôr in 7:12 is a poetic name for Egypt'
    key: bdb
    url: 'https://biblehub.com/hebrew/4693.htm'
    quote: 'מָצוֺר proper name, of a territory = מִצְרַיִם; only in poetry'
  - where: 'note 7:14 “The Shepherd’s staff”'
    claim: 'The people as sheep shepherded (fed) with the staff; Carmel in the northwest, Bashan and Gilead in the northeast; these may have been the first lands to fall to Assyria; they would be restored'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: '7:14–15 The people, as sheep, would be shepherded (fed) with the staff (rod). Mount Carmel, in the northwest, was the location of Elijah’s showdown with the prophets of Baal (1 Kings 18). Bashan and Gilead were in the northeast. These lands may have been the first to fall to Assyria. Those lands would be restored'
  - where: 'note 7:14 “The Shepherd’s staff”'
    claim: 'A modern translation: Shepherd your people with your staff'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+7&version=NRSVUE'
    quote: 'Shepherd your people with your staff, the flock that belongs to you, which lives alone in a forest'
  - where: 'note 7:18 “Who is like God?”'
    claim: 'Micah 7:18 plays on Micah’s name as a sign of mercy; the name is a shortened form of Michael and Michaiah; God, in His mercy, is incomparable'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'Micah 7:18 employs a wordplay on the name Micah as a sign of mercy … The name Micah is a hypocoristic (shortened) form of the names Michael (“Who is like El [God]?”) and Michaiah (“Who is like the Lord”?). Here again, we see the prophet’s name constituting a part of the prophet’s message: God, not least in his mercy, is incomparable.'
  - where: 'note 7:18 “Who is like God?”'
    claim: 'The prophet’s name and the closing question serve as bookends of the book'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'The book of Micah ends by stating, “Who is a God like unto thee” (7:18). The name of the prophet and this closing statement serve as bookends.'
  - where: 'note 7:18 “Who is like God?”'
    claim: 'The question looks back to Exodus 15:11; at the Exodus the Lord showed Himself above all gods, here His incomparable nature in grace'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/7.htm'
    quote: 'מי אל כּמוך looks back to Exodus 15:11; but whether Micah also plays upon his own name is doubtful. … whereas in the former Jehovah merely revealed Himself in His incomparable exaltation above all gods'
  - where: 'note 7:18 “Who is like God?”'
    claim: 'In the restoration of the nation the Lord reveals His incomparable nature in grace and compassion'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/7.htm'
    quote: 'in the restoration of the nation which had been cast out among the heathen because of its sins, and its exaltation among the nations, He now reveals His incomparable nature in grace and compassion.'
  - where: 'note 7:18 “Who is like God?”'
    claim: 'The words of pardon are formed after Exodus 34:6–7, where after the golden calf the Lord reveals Himself as gracious and forgiving'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/7.htm'
    quote: 'The words נשׂא עון וגו are formed after Exodus 34:6-7, where the Lord, after the falling away of Israel from Him by the worship of the golden calf, reveals Himself to Moses as a gracious and merciful God, who forgives guilt and sin.'

  - where: 'note 7:19 “Into the depths of the sea”'
    claim: 'He will tread down sins, conquering their power, and cast them into the sea as He drowned Pharaoh (Exodus 15:5, 10)'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/7.htm'
    quote: 'will tread down its sins, i.e., conquer their power and tyranny by His compassion, and cast them into the depths of the sea, as He once conquered the tyrant Pharaoh and drowned him in the depths of the sea (Exodus 15:5, Exodus 15:10).'
  - where: 'note 7:19 “Into the depths of the sea”'
    claim: 'Elder Renlund quotes Micah 7:18–19 in his talk on 6:8 to show God delights in mercy'
    key: renlund-do-justly
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/10/55renlund?lang=eng'
    quote: 'God delights in mercy and does not begrudge its use. In Micah’s words to Jehovah, “Who is a God like unto thee, that pardoneth iniquity, … will have compassion upon us,” and will “cast all … sins into the depths of the sea.”'

  - where: 'note 7:20 “The oath to Abraham”'
    claim: 'The Church’s footnotes at 7:20 point to 2 Nephi 29:14 and Luke 1:55, 72'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/7?lang=eng'
    quote: '“sworn”: Luke 1:55 (54–55), 72.'
  - where: 'note 7:20 “The oath to Abraham”'
    claim: 'The institute manual points to 2 Nephi 29:14 for understanding verse 20'
    key: ot-institute-manual-47
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-institute-teacher-manual-2026/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: '(If students need help understanding verse 20, you could point them to 2 Nephi 29:14.)'

  - where: 'christ'
    claim: 'The grace and compassion of 7:18 are only fully revealed in the restoration of the remnant by Jesus Christ'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/7.htm'
    quote: 'But this grace and compassion are only fully revealed in the restoration and blessing of the remnant of His nation by Jesus Christ.'
  - where: 'christ'
    claim: 'As we repent of our sins, we will be forgiven because the Lord delights in mercy'
    key: ot-institute-manual-47
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-institute-teacher-manual-2026/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'As we repent of our sins, we will be forgiven because the Lord delights in mercy.'
  - where: 'christ'
    claim: 'The thing God enjoys most about being God is the thrill of being merciful, especially to those who do not expect it'
    key: holland-laborers
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/04/the-laborers-in-the-vineyard?lang=eng'
    quote: 'It underscores the thought I heard many years ago that surely the thing God enjoys most about being God is the thrill of being merciful, especially to those who don’t expect it and often feel they don’t deserve it.'
  - where: 'setting'
    claim: 'Come, Follow Me names its lesson “He Delighteth in Mercy”'
    key: cfm-ot-2026-49
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/49?lang=eng'
    quote: 'November 30–December 6. “He Delighteth in Mercy”: Micah; Nahum; Habakkuk; Zephaniah'
  - where: 'note 7:18 “Who is like God?”'
    claim: 'The word for “mercy” in 7:18 is ḥesed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'חֶ֖סֶד'
  - where: 'explore'
    claim: 'The Church’s footnote at “enemies” points to Luke 12:53'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/7?lang=eng'
    quote: '“enemies”: Luke 12:53. TG Enemies.'
  - where: 'note 7:20 “The oath to Abraham”'
    claim: 'The Church’s footnote at “Abraham” points to 2 Nephi 29:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/7?lang=eng'
    quote: '“Abraham”: 2 Ne. 29:14.'
  - where: 'note 7:8 “Fallen Israel speaks”'
    claim: 'In verse 7 Israel has learned to look unto the Lord'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'Israel has learned to “look unto the Lord, … the God of [her] salvation” (Micah 7:7).'
  - where: 'christ'
    claim: 'The Church’s footnote at “sworn” in 7:20 points to Zacharias’s song, Luke 1:72'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/7?lang=eng'
    quote: '“sworn”: Luke 1:55 (54–55), 72.'
