chapter: 1
claims:
  # ---- when ----
  - where: 'when'
    claim: 'Micah prophesied under Jotham, Ahaz and Hezekiah, kings of Judah, in the eighth century B.C.'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Micah was a prophet in the Southern Kingdom of Judah during the reigns of Jotham, Ahaz, and Hezekiah in the eighth century BC.'
  - where: 'when'
    claim: 'His preaching ran from about 740 to 697 B.C.'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'His preaching, therefore, took place during the years from approximately 740 B.C. to 697 B.C.'

  # ---- setting ----
  - where: 'setting'
    claim: 'Micah prophesied at the same time as Isaiah'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'He prophesied at around the same time as Isaiah, Amos, Hosea, and Jonah.'
  - where: 'setting'
    claim: 'The name Micah is a shortened form of Micaiah, “Who is like the Lord?”'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'The name Micah is a hypocoristic (shortened) form of the names Michael (“Who is like El [God]?”) and Michaiah (“Who is like the Lord”?).'
  - where: 'setting'
    claim: 'Micah is to be distinguished from Micaiah the son of Imlah of 1 Kings 22'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'The prophet is to be distinguished from the elder prophet Micah, the son of Imlah (1 Kgs. 22:8ff.), as well as from ten other persons of the same name in the Old Testament.'
  - where: 'setting'
    claim: 'Micah came from Moresheth-gath, in the Shephelah, the low hills between the coastal plain and the hill country of Judah'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'Little is known about Micah, except for his origin in Moresheth-gath, a settlement in the low hill country of Judah, a region known as the Shephelah.'
  - where: 'setting'
    claim: 'The Shephelah lies between the coastal plain and the hill country of Judah'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'Micah’s region, the Judean Shephelah, is situated between the coastal plain to the west and the hill country of Judah to the east and is composed of low hills and many valleys'
  - where: 'setting'
    claim: 'Moresheth-gath was about twenty miles southwest of Jerusalem near the Philistine border; Micah’s call was to the capitals'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'one who came from Moresheth-gath, about twenty miles southwest of Jerusalem, near the border between Judah and Philistia. … Micah’s call was specifically to the capital cities of Samaria (Israel) and Jerusalem (Judah).'
  - where: 'setting'
    claim: 'The Assyrians took Samaria after a three-year siege'
    key: bd-samaria
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samaria?lang=eng'
    quote: 'the Assyrians could not capture it until after a siege of three years (2 Kgs. 17:5–6).'
  - where: 'setting'
    claim: 'Samaria fell in 722 or 721 B.C.; the lament of Micah 1 is generally dated before Sennacherib’s campaign of 701'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'Samaria’s fall, dated to 722 or 721 BC. … scholars generally agree that the lament in Micah 1 predates Sennacherib’s campaign of 701 BC.'
  - where: 'setting'
    claim: 'The book likely reached its final form after Micah’s death; opinions differ on when'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'The book of Micah likely reached its final form after Micah’s death, and there is real diversity of opinion as to when that final form occurred.'
  - where: 'setting'
    claim: 'Chapters 1–3 warn that Samaria and Jerusalem will be destroyed; chapters 4–5 are a message of hope'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Micah 1–3: A warning that Samaria and Jerusalem will be destroyed because of idolatry, oppression of the poor, and the corruption of religious leaders.'

  # ---- thread ----
  - where: 'thread'
    claim: 'The capitals are the source of the corruption that spreads over the two kingdoms'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/1.htm'
    quote: 'The capitals of the two kingdoms are the authors of the apostasy, as the centres and sources of the corruption which has spread from them over the kingdoms.'
  - where: 'thread'
    claim: 'Each town named in verses 10–16 meets a fate fitting its name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/1?lang=eng'
    quote: 'Each of the cities named in vv. 10–16 will meet a fate appropriate to the meaning of its name.'
  - where: 'thread'
    claim: 'In naming his own town, Micah includes himself in the judgment'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'Here Micah proclaims God’s judgment against his own town of Moresheth-gath. … Therefore, Micah is also indicting himself with Judah and sharing in their punishment.'
  - where: 'thread'
    claim: 'Chapters 4–5 promise that God will restore His people'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'Micah 4–5: A message of hope and a promise that God will restore His people in a future day'
  - where: 'thread'
    claim: 'The book ends with Jehovah’s willingness to forgive all who repent'
    key: scripture-helps-micah
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'The book ends with Micah’s testimony of Jehovah’s compassion and His willingness to forgive all who repent.'

  # ---- sections ----
  - where: 'section 3 plain'
    claim: '“Discover” means lay bare'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/1?lang=eng'
    quote: '6b “discover”: HEB lay bare.'
  - where: 'section 3 plain'
    claim: '“Hires” are wages'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'The graven im - ages, idols, and wages (not “hires”) that were used to pay the cultic prostitutes would lose their worth.'
  - where: 'section 4 plain'
    claim: '“Stripped” is barefoot; the “owls” are ostriches'
    key: bdb
    url: 'https://biblehub.com/hebrew/7758.htm'
    quote: 'Micah 1:8 Qr I will go barefoot and naked (Kt שילל)'
  - where: 'section 5 plain'
    claim: 'A translation of verses 11–12 (Beth-ezel removing its support; Maroth waiting anxiously)'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'the inhabitants of Zaanan do not come forth; Beth-ezel is wailing and shall remove its support from you. … For the inhabitants of Maroth wait anxiously for good'
  - where: 'section 5 plain'
    claim: 'A translation of verses 14–16 (parting gifts, deception, conqueror, bald as the eagle)'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'Therefore you shall give parting gifts to Moresheth-gath; the houses of Achzib shall be a deception to the kings of Israel. … I will again bring a conqueror upon you, inhabitants of Mareshah'
  - where: 'section 5 plain'
    claim: 'A translation of verse 16 (“pampered children”)'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'Make yourselves bald and cut off your hair for your pampered children; make yourselves as bald as the eagle, for they have gone from you into exile.'

  # ---- note 1:2 ----
  - where: 'note 1:2 “A witness in court”'
    claim: '“Witness” is one of Micah’s legal words; the book is a prophetic lawsuit whose climax is 6:8'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'Words with legal connotation are used throughout the book, such as justice (3:1, 8–9; 6:8), judgment (3:11, 7:9), judge (4:3, 5:1, 7:3), witness (1:2), and indictment (6:1–2). The climax of Micah’s prophecy is the legal indictment by God against all of Israel'
  - where: 'note 1:2 “A witness in court”'
    claim: 'One reading divides the book into three blocks, each beginning with a call to action (1:2; 3:1; 6:1)'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'The book can be divided into three blocks, each beginning with a call to action (Micah 1:2; 3:1; 6:1).'

  # ---- note 1:4 ----
  - where: 'note 1:4 “The Lord comes down”'
    claim: 'The holy temple of verse 2 is heaven; treading the high places of the earth shows Him as Ruler of the world'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/1.htm'
    quote: 'the Lord out of His holy temple," i.e., the heaven where He is enthroned (Psalm 11:4); for (1 Kings 22:3) the Lord will rise up from thence, and striding over the high places of the earth, i.e., as unbounded Ruler of the world'
  - where: 'note 1:4 “The Lord comes down”'
    claim: 'The theophany draws on storm and earthquake; the similes express complete dissolution'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/1.htm'
    quote: 'The description of this theophany is founded upon the idea of a terrible storm and earthquake, as in Psalm 18:8. … The similes, "like wax," etc. (as in Psalm 68:3), and "like water," etc., are intended to express the complete dissolution of mountains and valleys.'
  - where: 'note 1:4 “The Lord comes down”'
    claim: 'What answers to the picture is the devastation of great national judgments; here He comes to judge Israel (1:5)'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/1.htm'
    quote: 'The actual facts answering to this description are the destructive influences exerted upon nature by great national judgments.'
  - where: 'note 1:4 “The Lord comes down”'
    claim: 'He comes to execute judgment on Israel, as verse 5 says'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/1.htm'
    quote: 'according to Micah 1:5., He only comes to execute judgment upon Israel.'

  # ---- note 1:5 ----
  - where: 'note 1:5 “The sin of the capitals”'
    claim: 'In the first line of verse 5 Jacob and Israel together mean the whole covenant people; in the question Jacob is the ten tribes; the capitals are the sources of the corruption'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/1.htm'
    quote: 'Jacob and Israel in Micah 1:5 are synonymous, signifying the whole of the covenant nation, as we may see from the fact that in Micah 1:5 Jacob and not Israel is the epithet applied to the ten tribes in distinction from Judah. … The capitals of the two kingdoms are the authors of the apostasy, as the centres and sources of the corruption which has spread from them over the kingdoms.'
  - where: 'note 1:5 “The sin of the capitals”'
    claim: 'The high places were illegal worship even the most godly kings could not abolish'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/1.htm'
    quote: 'The allusion to the bâmōth of the illegal worship of the high places, which even the most godly kings were unable to abolish (see at 1 Kings 15:14)'
  - where: 'note 1:5 “The sin of the capitals”'
    claim: 'Chapters 1–3 hold the political and religious leaders especially responsible'
    key: pike-micah
    url: 'https://rsc.byu.edu/they-shall-grow-together/passages-book-micah-book-mormon'
    quote: 'because of the “sins of the house of Israel” (Mic 1:5), and especially because of the iniquity of their political and religious leaders;'

  # ---- note 1:7 ----
  - where: 'note 1:7 “A harlot’s wages”'
    claim: 'The same Hebrew word stands three times in the verse'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'מֵ/אֶתְנַ֤ן'
  - where: 'note 1:7 “A harlot’s wages”'
    claim: 'The verse is rendered “prostitute’s hire”'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/1.htm'
    quote: 'for she has gathered them of prostitute''s hire, and to prostitute''s hire shall they return.'
  - where: 'note 1:7 “A harlot’s wages”'
    claim: 'The wages were paid to cultic prostitutes and would lose their worth'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'The graven im - ages, idols, and wages (not “hires”) that were used to pay the cultic prostitutes would lose their worth.'
  - where: 'note 1:7 “A harlot’s wages”'
    claim: 'Judah too stooped to “the hire of an harlot” by forsaking the covenant and worshiping false gods'
    key: vandyke-ogden-twelve
    url: 'https://rsc.byu.edu/vol-4-no-3-2003/amos-through-malachi-major-teachings-twelve-prophets'
    quote: 'Micah is quick to point out that Judah, like Israel, had stooped to “the hire of an harlot” by forsaking her covenant relationship with Jehovah and worshiping false gods (Micah 1:7).'

  # ---- note 1:8 ----
  - where: 'note 1:8 “Barefoot and naked”'
    claim: '“Stripped” is barefoot: “I will go barefoot and naked”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7758.htm'
    quote: 'שׁוֺלָל adjective indeclinable (Ges§ 118o) barefoot (apparently stripped as to walking; always with הלן); — אֵילְכָה שׁוֺלָל וְעָרוֺם Micah 1:8 Qr I will go barefoot and naked'
  - where: 'note 1:8 “Barefoot and naked”'
    claim: 'The “owls” are ostriches, a simile of mourning in this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/3284.htm'
    quote: 'בְּנוֺתיַֿעֲנָה Micah 1:8 5t.; — ostrich, (see √ יען above); as wailing (simile of mourning) Micah 1:8'
  - where: 'note 1:8 “Barefoot and naked”'
    claim: 'The lament is a dirge performed barefoot and naked, a sign of the shame of captives'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'Micah’s words here form a prophetic dirge, or funeral lament, performed “barefoot and naked” (1:8), symbolizing the shame that would be felt by Judah’s inhabitants when conquered and treated as captives.'

  # ---- note 1:9 ----
  - where: 'note 1:9 “To the gate of Jerusalem”'
    claim: '“Gate” likely stands for the whole city and may allude to Sennacherib’s siege'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'the use of the term “gate” is likely symbolic for the entire city of Jerusalem and could be alluding to Sennacherib’s siege of Jerusalem detailed in 2 Kings 19 and 2 Chronicles 32.'
  - where: 'note 1:9 “To the gate of Jerusalem”'
    claim: 'Micah lamented the campaign probably a few years before it came'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'Hezekiah was successful in organizing a rebellion against Assyrian rule (2 Kings 18:7), but this was checked by Sennacherib’s campaign in 701 BC. Micah lamented this campaign and concomitant destruction probably a few years before it occurred.'
  - where: 'note 1:9 “To the gate of Jerusalem”'
    claim: 'The sin of Samaria affects Judah (1:5, 9); idolatry may have come into Judah from Samaria'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'In context with the sin of Samaria affecting Judah (Micah 1:5, 9), it may be that idolatry in connection with Asherah or another fertility cult had infiltrated Judah from Samaria via Lachish.'
  - where: 'note 1:9 “To the gate of Jerusalem”'
    claim: 'Lachish fell to Assyria in 701 B.C.'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'Lachish was a fortress on the border of the Philistine lands that fell to Assyria in 701 BC.'
  - where: 'note 1:9 “To the gate of Jerusalem”'
    claim: 'Sennacherib came against the fenced cities of Judah; Jerusalem was not taken (2 Kgs. 18:13; 19:32–36)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/19?lang=eng'
    quote: 'He shall not come into this city, nor shoot an arrow there'

  # ---- note 1:10 Gath ----
  - where: 'note 1:10 “David’s lament, and David’s cave”'
    claim: 'The verse takes up David’s lament (2 Sam. 1:20); the Hebrew plays Gath against “tell”; David bid Israel weep, Micah forbids it'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'This is a direct play on the name Gath against the Hebrew imperative verb taggîdû, “you (pl.) do not tell/exult.” … he encouraged the women of Israel to weep and mourn for the fallen leaders. In stark contrast, Micah proscribed weeping.'
  - where: 'note 1:10 “David’s lament, and David’s cave”'
    claim: 'Gath was the Philistine city of Goliath'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'the site referred to as Gath is commonly known as one of the major Philistine cities and the home of the Philistine champion Goliath (1 Samuel 17:4).'
  - where: 'note 1:10 “David’s lament, and David’s cave”'
    claim: 'The footnote to Gath is 1 Sam. 17:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/1?lang=eng'
    quote: '10a “Gath”: 1 Sam. 17:4.'
  - where: 'note 1:10 “David’s lament, and David’s cave”'
    claim: 'Adullam was David’s refuge; the meaning of “glory of Israel” is unclear'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'A cave at the site afforded David protection in his flight from Saul (1 Samuel 22:1) … In both cases, Adullam has a sense of refuge in the face of trouble. However, the meaning of “glory of Israel” is unclear.'

  # ---- note 1:10 Aphrah ----
  - where: 'note 1:10 “A lament in place names”'
    claim: 'Aphrah means “Dust or Ashes”; each city meets a fate fitting its name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/1?lang=eng'
    quote: '10b “Aphrah”: IE Dust or Ashes. (Each of the cities named in vv. 10–16 will meet a fate appropriate to the meaning of its name.)'
  - where: 'note 1:10 “A lament in place names”'
    claim: 'The puns: Aphrah rolling in dust (a pun on Philistines), Maroth bitterness, Lachish and steeds, Moresheth and a farewell gift, Achzib and a lie'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'Micah makes Aphrah (or Beth-le-Aphrah) a symbol of mourning through the act of rolling herself (hitpallāš[t]î, a pun on “Philistines”) in the dust (ʿāpār, v. 10).'
  - where: 'note 1:10 “A lament in place names”'
    claim: 'Maroth (“bitterness”), Lachish and “swift steeds,” Moresheth and a farewell gift'
    key: bowen-ominous-onomastics
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/ominous-onomastics'
    quote: 'Micah creates a pun on Maroth (“bitterness”) in terms of good and evil (v. 12). Fourth, Lachish (lākîš) becomes a symbol of “swift steeds” (lārekeš) … Fifth, Micah’s hometown Moresheth (see Micah 1:1; Jeremiah 26:18) sounds like a word for “farewell gift”'
  - where: 'note 1:10 “A lament in place names”'
    claim: 'Achzib is a pun on a lie'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'The place name Achzib (’akzîb) is a clear, direct pun with the word (ʾakzāb), meaning “lie, falsehood, deceptive thing.”'
  - where: 'note 1:10 “A lament in place names”'
    claim: 'Dust was a symbol of mourning'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'Here, the wordplay results in the “House of Dust” being commanded to roll in dust (‘apar), a symbol of mourning (Job 16:15, Jeremiah 6:26).'
  - where: 'note 1:10 “A lament in place names”'
    claim: '“Heir” is better “conqueror” or “plunderer”; the line is judgment, not hope'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'the word translated as “heir” (yôrēš) is better translated as “conqueror” or “plunderer.” Thus, Micah’s lament is not providing a promise of hope but a declaration of judgment as God would bring a conqueror (yôrēš) to Mareshah (mārēšâ).'
  - where: 'note 1:10 “A lament in place names”'
    claim: 'Micah includes himself in the judgment'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'Therefore, Micah is also indicting himself with Judah and sharing in their punishment.'
  - where: 'note 1:10 “A lament in place names”'
    claim: 'Eleven sites, some identified confidently, some tentatively, some not; some names may be devices for wordplay'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'incorporates the names of eleven sites, some confidently identified, some with tentative identifications, and the rest remaining unidentified. This does not account for the possibility that some sites are fictive or that the site names are symbolic and merely devices for wordplay.'
  - where: 'note 1:10 “A lament in place names”'
    claim: 'The passage is enigmatic'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'facilitate a textual and archaeological exposition of Micah 1:10–16 that may further our understanding of this enigmatic passage'

  # ---- note 1:13 ----
  - where: 'note 1:13 “Lachish, the beginning of sin”'
    claim: 'Lachish was second only to Jerusalem, a sign of safety; a rhyme with the team of horses'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'Lachish was a principal city of Judah, second only to Jerusalem, and a sign of stability and safety in the Shephelah. Micah’s wordplay here is a rhyme between Lachish and the term for a team of horses (rekeš)'
  - where: 'note 1:13 “Lachish, the beginning of sin”'
    claim: 'One reading: the sin is trust in chariots and fortifications rather than God'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'Is this a possible polemic against the horses and chariots at Lachish? Was the beginning of sin connected to pride and a false sense of security offered by the city’s fortifications? The prophets warn against trusting in military might for salvation rather than God.'
  - where: 'note 1:13 “Lachish, the beginning of sin”'
    claim: 'Another reading: idolatry came into Judah from Samaria by way of Lachish; a shrine was found in the eighth-century gate; Pierce sets Micah 5:10–14 beside it'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'Within the gate of the city dated to the eighth century BC, excavators discovered numerous stamped lmlk jar handles and a shrine consisting of a staircase leading to a room with a bench, presumably for votive offerings.'
  - where: 'note 1:13 “Lachish, the beginning of sin”'
    claim: 'Both readings fit the later proclamation against chariots, fortifications and idols in Micah 5:10–14'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'idolatry fits the context just as well as the Lord’s wrath at chariots, Judahite fortifications, or perceived security in the Shephelah as evinced in the later proclamation against all these elements in Micah 5:10–14'
  - where: 'note 1:13 “Lachish, the beginning of sin”'
    claim: 'Lachish fell to Assyria in 701'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'Lachish was a fortress on the border of the Philistine lands that fell to Assyria in 701 BC.'

  # ---- note 1:16 ----
  - where: 'note 1:16 “Bald as the vulture”'
    claim: 'Shaving the head was a mourning custom, with torn clothes, sackcloth, ashes and wailing, and was done to captives sent into exile'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'intentional shaving of the head was also a treatment for captives of military action sent into exile. Additionally, part of the expression of grief, and a way to honor the dead, involved shaving one’s head hair (and beard if applicable), tearing one’s clothes or wearing sackcloth, sitting or wallowing in ashes, putting dirt on one’s head, and wailing.'
  - where: 'note 1:16 “Bald as the vulture”'
    claim: '“Eagle” (nešer) is better “vulture,” the griffon vulture, whose white head made the picture of baldness plain'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'the Hebrew word translated as “eagle,” nešer, would be better translated as “vulture,” specifically, the Griffon vulture (Gyps fulvus) … The appearance of these vultures, which also have a white head contrasting with their brown bodies, would have produced a clear illustration of baldness'
  - where: 'note 1:16 “Bald as the vulture”'
    claim: '“Poll thee” is “cut off thy hair”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/1?lang=eng'
    quote: '16a “poll thee”: OR cut off thy hair.'

