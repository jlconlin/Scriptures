chapter: 6
claims:
  - where: 'when'
    claim: 'Micah prophesied under Jotham, Ahaz and Hezekiah, about 740 to 697 B.C.'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'the prophet’s ministry was during reigns of Jotham, Ahaz, and Hezekiah, kings of Judah. His preaching, therefore, took place during the years from approximately 740 B.C. to 697 B.C.'
  - where: 'setting'
    claim: 'Chapters 6–7 are the third division, prophecies of a mixed character; the Lord recounts His goodness and requires justice, goodness and humility'
    key: bd-micah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/micah?lang=eng'
    quote: '(3) Micah 6–7, prophecies of a mixed character; the Lord remonstrates with His people and recounts His past goodness to them; He requires from them justice, goodness, and humility.'
  - where: 'setting'
    claim: 'The book falls into three blocks, each opening with a call to action at 1:2, 3:1 and 6:1'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'The book can be divided into three blocks, each beginning with a call to action (Micah 1:2; 3:1; 6:1).'
  - where: 'setting'
    claim: 'The chapter is an imagined conversation between the Lord and the people of Judah, who went through the motions of worship'
    key: ot-institute-manual-47
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-institute-teacher-manual-2026/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'this chapter describes an imagined conversation between the Lord and the people of Judah. The people were going through the motions of worship by offering sacrifices, but they still participated in sinful behaviors'
  - where: 'setting'
    claim: 'The book’s legal language reaches its climax in the Lord’s indictment, ending in 6:8'
    key: pierce-micah
    url: 'https://rsc.byu.edu/approaching-holiness/understanding-micahs-lament-judah-micah-110-16-through-text-archaeology-geography'
    quote: 'The climax of Micah’s prophecy is the legal indictment by God against all of Israel, ending with what the Lord required, namely, to do justly, to love mercy, and to walk humbly before God (6:8).'
  - where: 'setting'
    claim: 'Elder Renlund is of the Quorum of the Twelve Apostles'
    key: renlund-do-justly
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/10/55renlund?lang=eng'
    quote: 'Of the Quorum of the Twelve Apostles'
  - where: 'thread'
    claim: 'Outline: the Lord’s goodness and Israel’s ingratitude (1–5); not outward sacrifices but righteousness, love and humble walk (6–8); punishment for violence, lying and deceit (9–16)'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/6.htm'
    quote: 'the prophet holds up before the Israelites their ingratitude for the great blessings which they have received from God (Micah 6:1-5), and teaches them that the Lord does not require outward sacrifices to appease His wrath, but righteousness, love, and humble walk with God'
  - where: 'thread'
    claim: 'In 6:6–7 the congregation speaks, asking the prophet what to do'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/6.htm'
    quote: 'As Micah has spoken in Micah 6:3-5 in the name of Jehovah, he now proceeds, in Micah 6:6, Micah 6:7, to let the congregation speak'
  - where: 'note 6:1 “The mountains as witnesses”'
    claim: 'The Lord calls the mountains and hills as witnesses to His dispute with His people'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'The Lord began by calling on the mountains and hills as witnesses to the dispute between Him and His people.'
  - where: 'note 6:1 “The mountains as witnesses”'
    claim: 'Calling heaven and earth as witnesses is an ancient Israelite practice seen in Isaiah 1:2'
    key: sc-knowhy-179
    url: 'https://scripturecentral.org/knowhy/why-did-nephi-rely-on-earlier-testimonies-of-christ'
    quote: 'This juridical move likely reflects the ancient Israelite practice manifest in Isaiah 1:2, “Hear, O heavens, and give ear, O earth: for the Lord hath spoken, I have nourished and brought up children, and they have rebelled against me.”'
  - where: 'note 6:3 “The Lord asks to be accused”'
    claim: 'The Lord is asking what He had done to deserve their rejection'
    key: ot-institute-manual-47
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-institute-teacher-manual-2026/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'in these verses, the Lord was essentially asking the people what He had done to deserve their rejection.'
  - where: 'note 6:3 “The Lord asks to be accused”'
    claim: '“Testify against me” is ʿănēh bî, the verb “answer” with “against me”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'עֲנֵ֥ה'
  - where: 'note 6:3 “The Lord asks to be accused”'
    claim: 'The verb ʿānāh means answer, respond, and also testify, bear witness'
    key: bdb
    url: 'https://biblehub.com/hebrew/6030.htm'
    quote: 'anah: To answer, respond, testify, speak, sing'
  - where: 'note 6:5 “From Shittim to Gilgal”'
    claim: 'Shittim was the camp east of Jordan opposite Jericho before the crossing'
    key: bd-shittim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shittim?lang=eng'
    quote: 'The district east of Jordan opposite Jericho, where the people encamped before crossing the Jordan'
  - where: 'note 6:5 “From Shittim to Gilgal”'
    claim: 'Gilgal was the first night’s camp after crossing the Jordan, where the twelve stones were set up'
    key: bd-gilgal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gilgal?lang=eng'
    quote: 'The place near Jericho at which the Israelite camp was made on the first night after crossing the Jordan (Josh. 4:19; 5:10; 10). Here the 12 stones from the Jordan were set up as a monument to the parting of the Jordan River by the power of God.'
  - where: 'note 6:5 “From Shittim to Gilgal”'
    claim: '“Righteousness” is the plural tsidqōt'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'צִדְק֥וֹת'
  - where: 'note 6:5 “From Shittim to Gilgal”'
    claim: 'The plural of tsedaqah means righteous acts'
    key: bdb
    url: 'https://biblehub.com/hebrew/6666.htm'
    quote: '7 plural righteous acts:'
  - where: 'note 6:7 “From calves to a firstborn”'
    claim: 'Micah’s questions are satire about exorbitant offerings; the answer is no, salvation is not earned'
    key: renlund-do-justly
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/10/55renlund?lang=eng'
    quote: 'Micah satirically wondered whether even exorbitant offerings might be enough to compensate for sin'
  - where: 'note 6:7 “From calves to a firstborn”'
    claim: 'The answer is no; even vast sacrifices cannot redeem the smallest sin'
    key: renlund-do-justly
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/10/55renlund?lang=eng'
    quote: 'The answer is no. Good deeds are not sufficient. Salvation is not earned. Not even the vast sacrifices Micah knew were impossible can redeem the smallest sin.'
  - where: 'note 6:7 “From calves to a firstborn”'
    claim: 'Offering a firstborn may have been an ancient practice in Israel, condemned by the story of Abraham and Isaac'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'The practice of offering a firstborn may have been an ancient practice in Israel and was specifically condemned by the Abraham and Isaac story (Genesis 22).'
  - where: 'note 6:8 “Who has told”'
    claim: 'The verb higgid is third person singular with no named subject'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'הִגִּ֥יד'
  - where: 'note 6:8 “Who has told”'
    claim: 'A modern translation keeps “He has told you, O mortal”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+6&version=NRSVUE'
    quote: 'He has told you, O mortal, what is good'
  - where: 'note 6:8 “Who has told”'
    claim: 'Keil reads the verb impersonally, “one has told,” namely Moses in the law, and compares Deuteronomy 10:12'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/6.htm'
    quote: 'הגּיד, impersonal, "one has told," or they have told thee, namely Moses in the law.'
  - where: 'note 6:8 “Who has told”'
    claim: 'Keil compares the same construction in Deuteronomy 10:12'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/6.htm'
    quote: 'The use of כּי אם, nisi, as in the similar connection of thought in Deuteronomy 10:12'
  - where: 'note 6:8 “Who has told”'
    claim: 'The Student Manual prints the rendering “It hath been told thee, O man”'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: '‘It hath been told thee, O man, what is good, And what the Lord doth require of thee: Only to do justly, and to love mercy, and to walk humbly with thy God.’'
  - where: 'note 6:8 “Three interconnected elements”'
    claim: 'Elder Renlund: three interconnected elements; doing justly is acting honorably with God and others, an application of the two great commandments'
    key: renlund-do-justly
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/10/55renlund?lang=eng'
    quote: 'Micah’s direction on turning our hearts to God and qualifying for salvation contains three interconnected elements. To do justly means acting honorably with God and with other people. We act honorably with God by walking humbly with Him. We act honorably with others by loving mercy.'
  - where: 'note 6:8 “Three interconnected elements”'
    claim: 'Loving mercy means delighting that God extends the same mercy to others'
    key: renlund-do-justly
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/10/55renlund?lang=eng'
    quote: 'Loving mercy means that we do not just love the mercy God extends to us; we delight that God extends the same mercy to others.'
  - where: 'note 6:8 “Three interconnected elements”'
    claim: 'A just person makes covenants with God and keeps them'
    key: renlund-do-justly
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/10/55renlund?lang=eng'
    quote: 'A just person turns away from sin and toward God, makes covenants with Him, and keeps those covenants.'
  - where: 'note 6:8 “Three interconnected elements”'
    claim: '“Mercy” is ḥesed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'חֶ֔סֶד'
  - where: 'note 6:8 “Three interconnected elements”'
    claim: 'A modern translation renders it “to love kindness”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+6&version=NRSVUE'
    quote: 'but to do justice and to love kindness'
  - where: 'note 6:9 “The rod, or the tribe”'
    claim: 'All the ancient versions read “fear” in place of “see”'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/6.htm'
    quote: 'notwithstanding the fact that ירא is adopted in all the ancient versions'
  - where: 'note 6:9 “The rod, or the tribe”'
    claim: 'Keil keeps the Hebrew: thy name has true wisdom in sight'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/6.htm'
    quote: 'Thy name sees wisdom, i.e., has the true wisdom of life in sight'
  - where: 'note 6:9 “The rod, or the tribe”'
    claim: 'Keil reads the rod as the judgment appointed, the power of Assyria, as in Isaiah 10:5'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/6.htm'
    quote: 'Hear ye, i.e., observe, the rod, viz., the judgment threatened by the Lord, and appointed for His rebellious nation. The reference is to the imperial power of Assyria, which Isaiah also describes in Isaiah 10:5'
  - where: 'note 6:9 “The rod, or the tribe”'
    claim: 'The Greek reads “he shall save those that fear his name: hear, O tribe”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/micah/6.htm'
    quote: 'The Lord''s voice shall be proclaimed in the city, and he shall save those that fear his name: hear, O tribe; and who shall order the city?'
  - where: 'note 6:9 “The rod, or the tribe”'
    claim: 'A modern translation reads “those who fear his name” and “Hear, O tribe”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Micah+6&version=NRSVUE'
    quote: '(and he shall save those who fear his name): Hear, O tribe and assembly of the city!'
  - where: 'note 6:9 “The rod, or the tribe”'
    claim: 'matteh means rod or staff, and figuratively a tribe'
    key: bdb
    url: 'https://biblehub.com/hebrew/4294.htm'
    quote: 'matteh or mattah: tribe, staff, tribes'
  - where: 'note 6:10 “A short measure under a curse”'
    claim: 'The lexicon gives “ephah of scantness, scant measure”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7332.htm'
    quote: 'Micah 6:10 ephah of scantness, scant measure.'
  - where: 'note 6:10 “A short measure under a curse”'
    claim: 'The word rendered “abominable” means denounced or cursed'
    key: bdb
    url: 'https://biblehub.com/hebrew/2194.htm'
    quote: 'Micah 6:10 an ephah of scantiness, denounced, or cursed.'
  - where: 'note 6:10 “A short measure under a curse”'
    claim: 'The words are ʾêpat rāzôn zeʿûmâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'זְעוּמָֽה'
  - where: 'note 6:10 “A short measure under a curse”'
    claim: 'The law calls those who use unjust weights and measures an abomination'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/25?lang=eng'
    quote: 'For all that do such things, and all that do unrighteously, are an abomination unto the Lord thy God.'
  - where: 'note 6:15 “The covenant’s own curses”'
    claim: 'Keil: the punishments rest on Leviticus 26:25–26 and Deuteronomy 28:39–40'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/6.htm'
    quote: 'For the individualizing of the punishment, which follows, rests upon Leviticus 26:25-26, and Deuteronomy 28:39-40.'
  - where: 'note 6:15 “The covenant’s own curses”'
    claim: '“Not anoint thee with oil” is taken word for word from Deuteronomy 28:40'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/6.htm'
    quote: 'ולא תסוּך שׁמן is taken verbatim from Deuteronomy 28:40.'
  - where: 'note 6:15 “The covenant’s own curses”'
    claim: 'Deuteronomy 28:40: olive trees but no anointing with the oil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: 'Thou shalt have olive trees throughout all thy coasts, but thou shalt not anoint thyself with the oil'
  - where: 'note 6:16 “The statutes of Omri”'
    claim: 'Omri (884–872 BC) and Ahab (871–852 BC) of Israel enacted statutes that led the people to sin'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: '6:16 Kings Omri (884–872 BC) and Ahab (871–852 BC) of Israel had enacted statutes and performed works that led the people to sin.'
  - where: 'note 6:16 “The statutes of Omri”'
    claim: 'Omri did worse than all before him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/16?lang=eng'
    quote: 'But Omri wrought evil in the eyes of the Lord, and did worse than all that were before him.'
  - where: 'note 6:16 “The statutes of Omri”'
    claim: 'The statutes of these kings were gross idolatry, and they were the models followed in Micah’s day'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'The statutes of those kings were the very grossest idolatry. Jezebel, wife of the latter, and daughter of Ithobaal, king of Tyre, had no fellow on earth.'
  - where: 'note 6:16 “The statutes of Omri”'
    claim: 'Omri, Ahab and Jezebel were the models followed in Micah’s day'
    key: ot-manual-11
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-kings-malachi/chapter-11?lang=eng'
    quote: 'Omri, Ahab, and Jezebel, were the models followed by the Israelites in the days of this prophet.'
  - where: 'christ'
    claim: 'Without Christ no one can do or be enough; through Him one can become enough; salvation through the Atonement by obedience to laws and ordinances'
    key: renlund-do-justly
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/10/55renlund?lang=eng'
    quote: 'Without the blessings that come from Heavenly Father and Jesus Christ, we can never do enough or be enough by ourselves. The good news, though, is that because of and through Jesus Christ we can become enough.'
  - where: 'christ'
    claim: 'The risen Christ replaced sacrifices with a broken heart and contrite spirit; the Holy Ghost teaches how to walk humbly with God'
    key: renlund-do-justly
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/10/55renlund?lang=eng'
    quote: 'we can enjoy the constant companionship of the Holy Ghost and be taught all things that we should do, including how to walk humbly with God.'
  - where: 'note 6:3 “The Lord asks to be accused”'
    claim: 'One reading: the Lord had always been protective and loving; the people had become wearied and lost trust'
    key: correa-jonah
    url: 'https://archive.bookofmormoncentral.org/sites/default/files/archive-files/pdf/correa/2022-11-23/jonah_micah.pdf'
    quote: 'The Lord had always been protective and loving, but the people had become wearied, lacking trust and confidence.'
  - where: 'note 6:9 “The rod, or the tribe”'
    claim: 'The city addressed is Jerusalem'
    key: keil-micah
    url: 'https://biblehub.com/commentaries/kad/micah/6.htm'
    quote: '"To the city," i.e., to the chief city of the kingdom, viz., Jerusalem.'
  - where: 'note 6:16 “The statutes of Omri”'
    claim: 'The chapter is addressed to the people of Judah'
    key: ot-institute-manual-47
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-institute-teacher-manual-2026/47-micah-nahum-habakkuk-zephaniah?lang=eng'
    quote: 'this chapter describes an imagined conversation between the Lord and the people of Judah.'
  - where: 'christ'
    claim: 'A just person makes covenants with God and keeps them'
    key: renlund-do-justly
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/10/55renlund?lang=eng'
    quote: 'To do justly and walk humbly with God is to intentionally withdraw our hand from iniquity, walk in His statutes, and remain authentically faithful.'
  - where: 'christ'
    claim: 'Salvation through the Atonement by obedience to the laws and ordinances of the gospel'
    key: renlund-do-justly
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2020/10/55renlund?lang=eng'
    quote: 'salvation from spiritual death is available to all “through the Atonement of [Jesus] Christ … by obedience to the laws and ordinances of the Gospel.”'
  - where: 'explore'
    claim: 'Amulek seems to reverse the order of Micah’s questions in Alma 34'
    key: sc-knowhy-142
    url: 'https://scripturecentral.org/knowhy/why-must-there-be-an-infinite-and-eternal-sacrifice'
    quote: 'Amulek seems to be reversing the order of Micah’s rhetorical questions, after which he launches into an exposition of justice and mercy (Alma 34:15–16).'
  - where: 'note 6:5 “From Shittim to Gilgal”'
    claim: 'The Lord turned Balaam’s curse into a blessing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/23?lang=eng'
    quote: 'the Lord thy God turned the curse into a blessing unto thee'
  - where: 'thread'
    claim: 'The Lord turned Balaam’s curse into a blessing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/23?lang=eng'
    quote: 'the Lord thy God turned the curse into a blessing unto thee'
  - where: 'note 6:7 “From calves to a firstborn”'
    claim: 'Through Jeremiah the Lord says He never commanded the burning of children at Tophet'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/7?lang=eng'
    quote: 'to burn their sons and their daughters in the fire; which I commanded them not, neither came it into my heart'
