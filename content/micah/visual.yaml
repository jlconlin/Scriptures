summary: >-
  Micah warns that Zion will be plowed as a field, and then, in the same book, sees the
  nations beat their swords into plowshares and every man sit under his vine and his fig
  tree with none to make him afraid. Out of little Bethlehem comes the ruler whose goings
  forth are from everlasting, and the book ends with the God who pardons. The image rests
  on that turn: the plowed hill of the warning, with the plowshare of the promise lying
  in its furrows.
motifs:
  - "A plowed hilltop (Micah 3:12): the near ground and most of the picture, a rounded rise of red-brown soil turned in long furrows that curve over the hill, with pale stones scattered through it and lying along its edges."
  - "A plowshare (Micah 4:3): in the furrows at the lower left of center, a plain metal blade with no handle and no beam, lying on its side in the soil and catching the light."
  - "A vine and a fig tree (Micah 4:4): at the right edge of the field, a grapevine hung with dark clusters on a low trellis of poles, beside a broad fig tree with large lobed leaves."
  - "A small town on a distant ridge (Micah 5:2): on the far left, a cluster of pale flat-roofed houses on a low ridge, small against the hills, under the low sun."
composition: >-
  A wide landscape in low gold light, seen from a slightly raised viewpoint on the plowed
  hill. The furrows fill the foreground and curve up and over the rise, with the blade
  lying in them at the lower left of center. The vine on its trellis and the fig tree
  stand at the right edge of the field. Behind the rise, folded hills with olive groves
  and a winding track fall away to blue ridges and a warm pale sky, with the sun low on
  the horizon at the upper left just above the little town on its ridge. Shadows fall
  toward the viewer, so each furrow holds a line of shadow. No figures, no animals, no
  ruins, and no tool but the blade.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The plowed hill** is Micah’s warning to Jerusalem’s rulers: “Therefore shall Zion for your sake be plowed as a field, and Jerusalem shall become heaps” ([[Micah 3:12]]).'
  - '**The metal blade lying in the furrow** is a plowshare, the promise that follows the warning: in the last days the nations “shall beat their swords into plowshares, and their spears into pruninghooks” ([[Micah 4:3]]).'
  - '**The vine and the fig tree** at the edge of the field are the peace of that day: “they shall sit every man under his vine and under his fig tree; and none shall make them afraid” ([[Micah 4:4]]).'
  - '**The little town on the far ridge** is Beth-lehem: “though thou be little among the thousands of Judah, yet out of thee shall he come forth unto me that is to be ruler in Israel; whose goings forth have been from of old, from everlasting” ([[Micah 5:2]]).'
