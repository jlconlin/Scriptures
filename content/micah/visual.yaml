alt: A plowed hilltop of red-brown furrows fills the foreground in low golden light, with a plain metal plowshare blade lying in the soil. At the right edge of the field a grapevine hung with dark clusters grows on a trellis beside a broad fig tree. Beyond, folded hills fall away to blue ridges, and a small town of pale houses sits on a far ridge at the left under the low sun.
