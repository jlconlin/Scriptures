chapter: 81
claims:
  - where: 'when'
    claim: 'The title ascribes the psalm to Asaph and gives no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/81?lang=eng'
    quote: 'To the chief Musician upon Gittith, A Psalm of Asaph.'
  - where: 'when'
    claim: 'The psalm calls for music on a feast day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/81?lang=eng'
    quote: 'Blow up the trumpet in the new moon, in the time appointed, on our solemn feast day.'
  - where: 'setting'
    claim: 'The title carries Asaph’s name and the word Gittith'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/81?lang=eng'
    quote: 'To the chief Musician upon Gittith, A Psalm of Asaph.'
  - where: 'setting'
    claim: 'Psalm 80 looks back to the leading out of Egypt and is followed by another psalm that looks back at Israel’s early history'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/81.htm'
    quote: 'Psalm 80, which looks back into the time of the leading forth out of Egypt, is followed by another with the very same Asaphic thoroughly characteristic feature of a retrospective glance at Israel''s early history'
  - where: 'setting'
    claim: 'The neighbouring psalms also use the name Joseph (77:15; 78:67; 80:1)'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2081&version=ESV'
    quote: 'Psalm 81:5 : Ps. 77:15; 78:67; 80:1'
  - where: 'setting'
    claim: 'God is the speaker in the second part, described as the Preacher of the festival'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/81.htm'
    quote: 'Jahve Himself makes Himself heard as the Preacher of the festival'
  - where: 'setting'
    claim: 'Psalm 95 has been called akin to this psalm'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/81.htm'
    quote: 'as in Psalm 95:7, which is in many ways akin to this Psalm'
  - where: 'setting'
    claim: 'Psalm 50:7 is set beside verse 8 of this psalm'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2081&version=NRSVUE'
    quote: '81.8 : Ps 50.7'
  - where: 'setting'
    claim: 'Passover and Tabernacles are the two feasts in question'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/81.htm'
    quote: 'Either the Feast of the Passover or the Feast of Tabernacles; for it must be one of these two feasts which begin on the day of the full moon.'
  - where: 'thread'
    claim: '“I heard” in verse 5 is the verb shama (H8085)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֶשְׁמָֽע'
