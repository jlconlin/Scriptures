chapter: 125
claims:
  # ---------- when ----------
  - where: when
    claim: 'The title is only “A Song of degrees”; it names no author'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/125?lang=eng'
    quote: 'A Song of degrees.'

  # ---------- setting ----------
  - where: setting
    claim: 'The songs of degrees are fifteen psalms, 120–134'
    key: bd-degrees-songs-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/degrees-songs-of?lang=eng'
    quote: 'Fifteen Psalms (120–34), probably so called because they were sung by Jewish pilgrims on their way up to Jerusalem.'
  - where: setting
    claim: 'One older reading: the people are under foreign rule, and that is the temptation to fall away'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/125.htm'
    quote: 'The people are under foreign dominion. In this lies the seductive inducement to apostasy.'
  - where: setting
    claim: 'The same reading judges the psalm late from its expressions'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/125.htm'
    quote: 'That this Psalm is one of the latest, appears from the circumstantial expression "the upright in their hearts," instead of the old one, "the upright of heart,"'
  - where: setting
    claim: 'Psalm 124 thanks the LORD for an escape from the snare'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/124?lang=eng'
    quote: 'Our soul is escaped as a bird out of the snare of the fowlers: the snare is broken, and we are escaped.'
  - where: setting
    claim: 'Psalm 126 looks back on the return of Zion’s captivity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/126?lang=eng'
    quote: 'When the Lord turned again the captivity of Zion, we were like them that dream.'

  # ---------- thread ----------
  - where: thread
    claim: 'The rod lies on the land now; the promise is that it will not last'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/125.htm'
    quote: 'The pressure of the worldly power, which now lies heavily upon the holy land, will not last for ever'
  - where: thread
    claim: 'One older reading: the faithful and those who fell away are already divided in the psalm'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/125.htm'
    quote: 'The pious and the apostate ones are already separated.'
  - where: thread
    claim: 'Verses 1 and 2 each end “for ever”; verse 3 begins “For”; verse 4 is the only address to the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/125?lang=eng'
    quote: 'Do good, O Lord, unto those that be good, and to them that are upright in their hearts.'

  # ---------- sections ----------
  - where: section 1 plain
    claim: '“Cannot be removed” is “cannot be moved”; “from henceforth” is “from this time on”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20125&version=NRSVUE'
    quote: 'which cannot be moved but abides forever'
  - where: section 2 plain
    claim: 'The rod is a scepter and the lot is allotted land; “put forth their hands unto iniquity” is to reach out to do wrong'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20125&version=NRSVUE'
    quote: 'For the scepter of wickedness shall not rest'
  - where: section 3 plain
    claim: 'The LORD leads the crooked away with evildoers; the last line is a wish, “Peace be upon Israel!”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20125&version=NRSVUE'
    quote: 'the Lord will lead away with evildoers.'

  # ---------- note 125:1 ----------
  - where: 'note 125:1 “The mountain that stays, and the city that fell”'
    claim: 'Older expositors took the verse of the heavenly Zion because of the Babylonian and Roman destructions; this reading answers that those fell on the buildings, not the mountain, and cites Micah 3:12 and 4:1'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/125.htm'
    quote: 'Older expositors are of opinion that the heavenly Zion must be understood on account of the Chaldaean and the Roman catastrophes; but these, in fact, only came upon the buildings on the mountain, not upon the mountain itself'
  - where: 'note 125:1 “The mountain that stays, and the city that fell”'
    claim: 'Zion is the comparison because the God they trust is enthroned there'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/125.htm'
    quote: 'is likened to Mount Zion, because the God to whom they believingly cling is He who sits enthroned on Zion.'
  - where: 'note 125:1 “The mountain that stays, and the city that fell”'
    claim: 'Micah foretold Zion plowed as a field'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/3?lang=eng'
    quote: 'Therefore shall Zion for your sake be plowed as a field, and Jerusalem shall become heaps, and the mountain of the house as the high places of the forest.'
  - where: 'note 125:1 “The mountain that stays, and the city that fell”'
    claim: 'Micah then foretells the mountain of the LORD’s house established in the last days; the older reading cites Micah 3:12 and 4:1 together'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/4?lang=eng'
    quote: 'But in the last days it shall come to pass, that the mountain of the house of the Lord shall be established in the top of the mountains'
  - where: 'note 125:1 “The mountain that stays, and the city that fell”'
    claim: 'The older reading cites Micah 3:12 and 4:1 for the mountain itself remaining'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/125.htm'
    quote: 'which in itself and according to its appointed destiny (vid., Micah 3:12; Micah 4:1) remained unshaken'
  - where: 'note 125:1 “The mountain that stays, and the city that fell”'
    claim: 'Mount Zion is where Solomon built the temple'
    key: bd-zion
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zion?lang=eng'
    quote: 'Solomon built his temple on Mount Zion (1 Kgs. 8:1; see also 2 Sam. 5:6–7); and Jackson County, Missouri, is called Zion in many of the revelations in the D&C'

  # ---------- note 125:2 ----------
  - where: 'note 125:2 “The picture turned around”'
    claim: 'Jerusalem was a mountain fortress ringed by deep valleys, with the Mount of Olives across the Kidron from the temple hill'
    key: bd-jerusalem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jerusalem?lang=eng'
    quote: 'Until then it had been merely a mountain fortress, about 2600 feet above sea level, surrounded by deep valleys on all sides except the north. On the east was the Valley of the Kidron, dividing the Temple Mountain from the Mount of Olives'
  - where: 'note 125:2 “The picture turned around”'
    claim: 'The songs of degrees were probably sung by pilgrims going up to Jerusalem'
    key: bd-degrees-songs-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/degrees-songs-of?lang=eng'
    quote: 'probably so called because they were sung by Jewish pilgrims on their way up to Jerusalem.'
  - where: 'note 125:2 “The picture turned around”'
    claim: 'Verse 2 is built “As… so,” with the LORD round about His people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/125?lang=eng'
    quote: 'As the mountains are round about Jerusalem, so the Lord is round about his people from henceforth even for ever.'

  # ---------- note 125:3 ----------
  - where: 'note 125:3 “A scepter over the allotted land”'
    claim: 'BDB lists the rod of Psalm 125:3 under the sense sceptre, mark of authority'
    key: bdb
    url: 'https://biblehub.com/hebrew/7626.htm'
    quote: 'truncheon, sceptre, mark of authority'
  - where: 'note 125:3 “A scepter over the allotted land”'
    claim: 'BDB: the lot is land assigned by lot, and in Psalm 125:3 land exposed to oppressive exaction'
    key: bdb
    url: 'https://biblehub.com/hebrew/1486.htm'
    quote: 'especially of land assigned by lot, allotment'
  - where: 'note 125:3 “A scepter over the allotted land”'
    claim: 'BDB on the lot in this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/1486.htm'
    quote: 'Psalm 125:3, land, exposed to oppressive exaction'
  - where: 'note 125:3 “A scepter over the allotted land”'
    claim: 'A modern translation renders scepter and allotted land'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20125&version=NRSVUE'
    quote: 'on the land allotted to the righteous,'
  - where: 'note 125:3 “A scepter over the allotted land”'
    claim: 'The land was divided to the tribes by lot'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/14?lang=eng'
    quote: 'By lot was their inheritance, as the Lord commanded by the hand of Moses, for the nine tribes, and for the half tribe.'

  # ---------- note 125:5 turn aside ----------
  - where: 'note 125:5 “Led away with the evildoers”'
    claim: 'A modern translation: they turn aside to their own crooked ways, and the LORD leads them away with evildoers'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20125&version=NRSVUE'
    quote: 'But those who turn aside to their own crooked ways,'
  - where: 'note 125:5 “Led away with the evildoers”'
    claim: '“Lead them forth” is to lead away'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20125&version=NRSVUE'
    quote: 'the Lord will lead away with evildoers.'

  - where: 'note 125:5 “Led away with the evildoers”'
    claim: 'Verse 4 names the upright in their hearts, against whom the crooked of verse 5 are set'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/125?lang=eng'
    quote: 'Do good, O Lord, unto those that be good, and to them that are upright in their hearts.'

  # ---------- note 125:5 peace ----------
  - where: 'note 125:5 “A blessing, and on whom it falls”'
    claim: 'The Hebrew of the last line is three words, peace upon Israel; the King James supplies “but” and “shall be”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/125-5.htm'
    quote: 'the LORD shall lead them forth with the workers of iniquity: [but] peace [shall be] upon Israel.'
  - where: 'note 125:5 “A blessing, and on whom it falls”'
    claim: 'The interlinear gloss of the last three words'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/125-5.htm'
    quote: 'Peace on Israel!'
  - where: 'note 125:5 “A blessing, and on whom it falls”'
    claim: 'A modern translation prints the line as a wish'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20125&version=NRSVUE'
    quote: 'Peace be upon Israel!'
  - where: 'note 125:5 “A blessing, and on whom it falls”'
    claim: 'Psalm 128, a song of degrees, ends with the same words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/128?lang=eng'
    quote: 'Yea, thou shalt see thy children’s children, and peace upon Israel.'
  - where: 'note 125:5 “A blessing, and on whom it falls”'
    claim: 'Paul limits the blessing to those who walk by the rule and calls them the Israel of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/6?lang=eng'
    quote: 'And as many as walk according to this rule, peace be on them, and mercy, and upon the Israel of God.'

  # ---------- christ ----------
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: christ
    claim: 'John saw the Lamb on Mount Sion with those who have His Father’s name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/14?lang=eng'
    quote: 'And I looked, and, lo, a Lamb stood on the mount Sion, and with him an hundred forty and four thousand, having his Father’s name written in their foreheads.'
  - where: christ
    claim: 'The Bible Dictionary lists Hebrews 12 and Revelation 14 under Zion, which the New Testament spells Sion'
    key: bd-zion
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zion?lang=eng'
    quote: 'Heb. 12:22–24; Rev. 14:1–5; and many others. (In the New Testament, Zion is spelled Sion.)'

  - where: christ
    claim: 'Hebrews says believers are come to Mount Sion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/12?lang=eng'
    quote: 'But ye are come unto mount Sion, and unto the city of the living God, the heavenly Jerusalem, and to an innumerable company of angels,'

  # ---------- explore ----------
  - where: explore
    claim: 'Zechariah has the LORD as a wall of fire round about Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/2?lang=eng'
    quote: 'For I, saith the Lord, will be unto her a wall of fire round about, and will be the glory in the midst of her.'
  - where: explore
    claim: 'Psalm 46: the city shall not be moved because God is in the midst of her'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/46?lang=eng'
    quote: 'God is in the midst of her; she shall not be moved: God shall help her, and that right early.'
  - where: explore
    claim: 'D&C 97:19: Zion cannot fall or be moved out of her place, for God is there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/97?lang=eng'
    quote: 'Surely Zion is the city of our God, and surely Zion cannot fall, neither be moved out of her place, for God is there, and the hand of the Lord is there;'
  - where: explore
    claim: 'D&C 101:17 repeats the promise when Zion’s children are scattered; the section’s summary says the Saints are afflicted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'Zion shall not be moved out of her place, notwithstanding her children are scattered.'
  - where: explore
    claim: 'An older commentary points from verse 2 to Psalm 34:7 (its 34:8) and Zechariah 2:5 for the LORD encompassing His people'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/125.htm'
    quote: 'has a still infinitely higher defence in Jahve, who encompasses it round (vid., on Psalm 34:8), as perhaps a wall of fire (Zechariah 2:5)'
  - where: explore
    claim: 'Psalm 34:7: the angel of the LORD encamps round about those who fear Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/34?lang=eng'
    quote: 'The angel of the Lord encampeth round about them that fear him, and delivereth them.'
  - where: parallels
    claim: 'An older commentary points from verse 2 to Psalm 34:7 (its 34:8)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/125.htm'
    quote: 'who encompasses it round (vid., on Psalm 34:8)'
  - where: parallels
    claim: 'Psalm 128:6 and Galatians 6:16 share the closing blessing of peace on Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/6?lang=eng'
    quote: 'peace be on them, and mercy, and upon the Israel of God.'
