chapter: 127
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The title calls the psalm a song of degrees and names Solomon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/127?lang=eng'
    quote: 'A Song of degrees for Solomon.'

  # ---- setting ----
  - where: 'setting'
    claim: 'The songs of degrees are Psalms 120–134, fifteen psalms, probably sung by pilgrims going up to Jerusalem; so Psalm 127 is the eighth and the middle one'
    key: bd-degrees-songs-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/degrees-songs-of?lang=eng'
    quote: 'Fifteen Psalms (120–34), probably so called because they were sung by Jewish pilgrims on their way up to Jerusalem.'
  - where: 'setting'
    claim: 'Psalm 122 is a song of degrees whose title names David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/122?lang=eng'
    quote: 'A Song of degrees of David.'
  - where: 'setting'
    claim: 'Psalm 124 is a song of degrees whose title names David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/124?lang=eng'
    quote: 'A Song of degrees of David.'
  - where: 'setting'
    claim: 'Psalm 131 is a song of degrees whose title names David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/131?lang=eng'
    quote: 'A Song of degrees of David.'
  - where: 'setting'
    claim: 'Psalm 133 is a song of degrees whose title names David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/133?lang=eng'
    quote: 'A Song of degrees of David.'
  - where: 'setting'
    claim: 'Psalm 127 is counted with the wisdom psalms, which give advice as Proverbs and Ecclesiastes do'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'providing advice on how to successfully live a godly life, similar to the advice found in Proverbs or Ecclesiastes: 37, 49, 73, 112, 127, 128, and 133'
  - where: 'setting'
    claim: 'The family proclamation quotes verse 3 where it speaks of the duty of husband and wife to their children'
    key: family-proclamation
    url: 'https://www.churchofjesuschrist.org/study/scriptures/the-family-a-proclamation-to-the-world/the-family-a-proclamation-to-the-world?lang=eng'
    quote: 'Husband and wife have a solemn responsibility to love and care for each other and for their children. “Children are an heritage of the Lord” (Psalm 127:3).'

  # ---- thread ----
  - where: 'thread'
    claim: 'What verses 1–2 call vain is reliance on human effort alone'
    key: scripture-helps-ps-102
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/34-psalms-102-103-110-116-119-127-128-135-139-146-150?lang=eng'
    quote: 'This psalm emphasizes the ineffectiveness of relying on human effort alone to build a house or protect a city.'
  - where: 'thread'
    claim: 'Through children, gifts from God, the Lord establishes the household of verses 3–5'
    key: scripture-helps-ps-102
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/34-psalms-102-103-110-116-119-127-128-135-139-146-150?lang=eng'
    quote: 'Verses 3–5 declare that it is through children—gifts from God—that the Lord establishes a household that can protect the community.'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Waketh” is keeping watch, and “the bread of sorrows” is bread got by anxious toil'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20127&version=NRSVUE'
    quote: 'the guard keeps watch in vain'
  - where: 'section 1 plain'
    claim: '“The bread of sorrows” is bread got by anxious toil'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20127&version=NRSVUE'
    quote: 'eating the bread of anxious toil'
  - where: 'section 2 plain'
    claim: 'The heritage and the reward are from the LORD'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20127&version=NRSVUE'
    quote: 'Sons are indeed a heritage from the Lord'
  - where: 'section 2 plain'
    claim: '“Heritage” is an inheritance'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/127-3.htm'
    quote: 'an inheritance'
  - where: 'section 2 plain'
    claim: '“Mighty man” is a warrior, and “children of the youth” are the sons of one’s youth'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20127&version=NRSVUE'
    quote: 'Like arrows in the hand of a warrior'

  # ---- note 127:0 ----
  - where: 'note 127:0 “Why the title names Solomon”'
    claim: 'A modern translation reads the title “Of Solomon”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20127&version=NRSVUE'
    quote: 'A Song of Ascents. Of Solomon.'
  - where: 'note 127:0 “Why the title names Solomon”'
    claim: 'The old Greek translation titles the psalm a song of degrees and does not name Solomon'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/127.htm'
    quote: 'A Song of Degrees. Except the Lord build the house, they that build labour in vain'
  - where: 'note 127:1 “A house is a building and a family”'
    claim: 'The son promised to David is to build the house for the LORD’s name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'He shall build an house for my name, and I will stablish the throne of his kingdom for ever.'
  - where: 'note 127:0 “Why the title names Solomon”'
    claim: 'One older reading: the psalm is a string of proverbs in the manner of the Book of Proverbs'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/127.htm'
    quote: 'it consists of a double string of proverbs, the expression of which reminds one in many ways of the Book of Proverbs'
  - where: 'note 127:0 “Why the title names Solomon”'
    claim: 'The same reading calls the psalm the unfolding of the proverb in Proverbs 10:22'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/127.htm'
    quote: 'together are like the unfolding of the proverb, Proverbs 10:22'
  - where: 'note 127:0 “Why the title names Solomon”'
    claim: 'The LORD loved Solomon at his birth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'he called his name Solomon: and the Lord loved him.'
  - where: 'note 127:0 “Why the title names Solomon”'
    claim: 'Jedidiah means “beloved of Yah” and is the name Nathan gave Solomon'
    key: bdb
    url: 'https://biblehub.com/hebrew/3041.htm'
    quote: 'proper name, masculine (beloved of Yah'
  - where: 'note 127:0 “Why the title names Solomon”'
    claim: 'The name Jedidiah is formed from the word for “beloved”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3041.htm'
    quote: 'beloved of Jah'
  - where: 'note 127:0 “Why the title names Solomon”'
    claim: 'The Hebrew word for “beloved” that forms the name is the word in Psalm 127:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/3039.htm'
    quote: 'Psalm 127:2'
  - where: 'note 127:0 “Why the title names Solomon”'
    claim: 'One older reading: the name was added to the title because verse 2 was taken as an allusion to Jedidiah and to the dream at Gibeon'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/127.htm'
    quote: 'is only added to this Song of degrees because there was found in Psalm 127:2 not only an allusion to the name Jedidiah, which Solomon received from Nathan (2 Samuel 12:25), but also to his being endowed with wisdom and riches in the dream at Gibeon'
  - where: 'note 127:0 “Why the title names Solomon”'
    claim: 'At Gibeon the LORD appeared to Solomon in a dream and offered him a gift'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/3?lang=eng'
    quote: 'In Gibeon the Lord appeared to Solomon in a dream by night: and God said, Ask what I shall give thee.'

  # ---- note 127:1 ----
  - where: 'note 127:1 “A house is a building and a family”'
    claim: 'To build a house is said of the mothers who bore the family of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'like Rachel and like Leah, which two did build the house of Israel'
  - where: 'note 127:1 “A house is a building and a family”'
    claim: 'David wishes to build the LORD a house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'Shalt thou build me an house for me to dwell in?'
  - where: 'note 127:1 “A house is a building and a family”'
    claim: 'The LORD promises to make David a house, and David’s seed is to build the house for His name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'Also the Lord telleth thee that he will make thee an house.'
  - where: 'note 127:1 “A house is a building and a family”'
    claim: 'The house promised to David is his posterity and kingdom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'And thine house and thy kingdom shall be established for ever before thee'
  - where: 'note 127:1 “A house is a building and a family”'
    claim: 'Verses 3–5 are read with verses 1–2: through children the Lord establishes a household'
    key: scripture-helps-ps-102
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/34-psalms-102-103-110-116-119-127-128-135-139-146-150?lang=eng'
    quote: 'Verses 3–5 declare that it is through children—gifts from God—that the Lord establishes a household that can protect the community.'
  - where: 'note 127:1 “A house is a building and a family”'
    claim: 'Elder Gordon B. Hinckley, of the Council of the Twelve, repeated verse 1 to those planning marriage and a home'
    key: hinckley-except-lord
    url: 'https://www.churchofjesuschrist.org/study/ensign/1971/06/except-the-lord-build-the-house?lang=eng'
    quote: 'To those of you who, with glad hearts, dream of marriage and the establishment of a home, I wish to repeat what was said of old: “Except the Lord build the house, they labour in vain that build it.”'
  - where: 'note 127:1 “A house is a building and a family”'
    claim: 'He was then of the Council of the Twelve'
    key: hinckley-except-lord
    url: 'https://www.churchofjesuschrist.org/study/ensign/1971/06/except-the-lord-build-the-house?lang=eng'
    quote: 'Of the Council of the Twelve'
  - where: 'note 127:1 “A house is a building and a family”'
    claim: 'He went on to name four cornerstones for that house'
    key: hinckley-except-lord
    url: 'https://www.churchofjesuschrist.org/study/ensign/1971/06/except-the-lord-build-the-house?lang=eng'
    quote: 'May I quickly suggest four cornerstones upon which to build that house?'

  # ---- note 127:2 ----
  - where: 'note 127:2 “Sleep given, or gifts given in sleep”'
    claim: 'The ancient Greek translation has sleep as the gift'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/127.htm'
    quote: 'while he gives sleep to his beloved'
  - where: 'note 127:2 “Sleep given, or gifts given in sleep”'
    claim: 'A modern translation has sleep as the gift'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20127&version=NRSVUE'
    quote: 'for he gives sleep to his beloved'
  - where: 'note 127:2 “Sleep given, or gifts given in sleep”'
    claim: 'The same translation notes that the line can be read as provision given during sleep'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20127&version=NRSVUE'
    quote: 'Or for he provides for his beloved during sleep'
  - where: 'note 127:2 “Sleep given, or gifts given in sleep”'
    claim: '“The bread of sorrows” is rendered “the bread of anxious toil”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20127&version=NRSVUE'
    quote: 'eating the bread of anxious toil'
  - where: 'note 127:2 “Sleep given, or gifts given in sleep”'
    claim: 'Psalm 128 promises the one who fears the LORD the fruit of his labour'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/128?lang=eng'
    quote: 'For thou shalt eat the labour of thine hands: happy shalt thou be, and it shall be well with thee.'
  - where: 'note 127:2 “Sleep given, or gifts given in sleep”'
    claim: 'What the psalm calls vain is reliance on human effort alone'
    key: scripture-helps-ps-102
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/34-psalms-102-103-110-116-119-127-128-135-139-146-150?lang=eng'
    quote: 'This psalm emphasizes the ineffectiveness of relying on human effort alone to build a house or protect a city.'

  # ---- note 127:3 ----
  - where: 'note 127:3 “Children are what the LORD gives”'
    claim: 'A modern translation: a heritage from the Lord, a reward; and “sons” for “children”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20127&version=NRSVUE'
    quote: 'Sons are indeed a heritage from the Lord'
  - where: 'note 127:3 “Children are what the LORD gives”'
    claim: 'The second half of the verse in the same translation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20127&version=NRSVUE'
    quote: 'the fruit of the womb a reward'
  - where: 'note 127:3 “Children are what the LORD gives”'
    claim: 'The Hebrew word behind “heritage” is the word for an inheritance'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/127-3.htm'
    quote: 'an inheritance'
  - where: 'note 127:3 “Children are what the LORD gives”'
    claim: 'Jacob says that God gives or withholds the fruit of the womb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/30?lang=eng'
    quote: 'Am I in God’s stead, who hath withheld from thee the fruit of the womb?'
  - where: 'note 127:3 “Children are what the LORD gives”'
    claim: 'Jacob calls his children God’s gift when Esau asks who is with him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/33?lang=eng'
    quote: 'Who are those with thee? And he said, The children which God hath graciously given thy servant.'

  # ---- note 127:5 ----
  - where: 'note 127:5 “The gate was where a town heard its cases”'
    claim: 'Boaz settles the redemption at the gate, before the elders'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'Then went Boaz up to the gate, and sat him down there'
  - where: 'note 127:5 “The gate was where a town heard its cases”'
    claim: 'The elders and people at the gate are the witnesses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/4?lang=eng'
    quote: 'And all the people that were in the gate, and the elders, said, We are witnesses.'
  - where: 'note 127:5 “The gate was where a town heard its cases”'
    claim: 'The law sends a father and mother with their case to the elders at the gate'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/21?lang=eng'
    quote: 'bring him out unto the elders of his city, and unto the gate of his place'
  - where: 'note 127:5 “The gate was where a town heard its cases”'
    claim: 'A proverb warns against oppressing the afflicted in the gate'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/22?lang=eng'
    quote: 'neither oppress the afflicted in the gate'
  - where: 'note 127:5 “The gate was where a town heard its cases”'
    claim: 'Eliphaz speaks of children crushed in the gate with none to deliver them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/5?lang=eng'
    quote: 'His children are far from safety, and they are crushed in the gate, neither is there any to deliver them.'
  - where: 'note 127:5 “The gate was where a town heard its cases”'
    claim: '“Children of the youth” are the sons of one’s youth, and the speaking in the gate is with enemies there'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20127&version=NRSVUE'
    quote: 'are the sons of one’s youth'
  - where: 'note 127:5 “The gate was where a town heard its cases”'
    claim: 'Many children were seen in ancient times as a sign of strength'
    key: scripture-helps-ps-102
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/34-psalms-102-103-110-116-119-127-128-135-139-146-150?lang=eng'
    quote: 'In ancient times, having many children was viewed as a symbol of strength.'

  # ---- christ ----
  - where: 'christ'
    claim: '“LORD” in the Old Testament usually stands for Jehovah, the premortal Jesus Christ, who came to earth'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Usually, when the word Lord appears in the Old Testament, it means “Jehovah.”'

  # ---- explore ----
  - where: 'explore'
    claim: 'Solomon’s dream at Gibeon runs to verse 15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/3?lang=eng'
    quote: 'And Solomon awoke; and, behold, it was a dream.'

  # ---- parallels ----
  - where: 'parallels'
    claim: 'Psalm 128 has children round the table of the one who fears the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/128?lang=eng'
    quote: 'thy children like olive plants round about thy table'
