chapter: 134
claims:
  # ---------- when ----------
  - where: 'when'
    claim: 'The title is “A Song of degrees” and names no author'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/134?lang=eng'
    quote: 'A Song of degrees.'

  # ---------- setting ----------
  - where: 'setting'
    claim: 'The songs of degrees are fifteen psalms, 120–134, so Psalm 134 is the last; they were probably pilgrim songs'
    key: bd-degrees-songs-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/degrees-songs-of?lang=eng'
    quote: 'Fifteen Psalms (120–34), probably so called because they were sung by Jewish pilgrims on their way up to Jerusalem.'
  - where: 'setting'
    claim: 'Each verse of the psalm names the temple: the house of the LORD, the sanctuary, Zion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/134?lang=eng'
    quote: 'Lift up your hands in the sanctuary, and bless the Lord.'
  - where: 'setting'
    claim: 'Psalm 133 opens with the same word, “Behold”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/133?lang=eng'
    quote: 'Behold, how good and how pleasant it is for brethren to dwell together in unity!'
  - where: 'setting'
    claim: 'Psalm 133 ends on Zion and the blessing commanded there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/133?lang=eng'
    quote: 'for there the Lord commanded the blessing, even life for evermore.'
  - where: 'setting'
    claim: 'Psalm 135 opens by addressing the servants of the LORD who stand in His house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/135?lang=eng'
    quote: 'Ye that stand in the house of the Lord, in the courts of the house of our God,'
  - where: 'setting'
    claim: 'One older reading: the psalm was put at the end of the songs of degrees on purpose and is a fitting close'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/134.htm'
    quote: 'this antiphon is purposely placed at the end of the collection of Songs of degrees in order to take the place of a final beracha.'
  - where: 'setting'
    claim: 'The same reading calls it an appropriate finale'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/134.htm'
    quote: 'an appropriate finale.'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'Psalm 134 is listed among the hymns of praise, which begin with a call to praise the Lord'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'These psalms often begin with a command or call to Israel to gather as a community (most importantly, at the temple) and praise the Lord: 8, 19, 29, 33, 47, 65, 66, 78, 93, 95–100, 103–6, 11, 113, 114, 117, 134, 135, 136, and 145–50.'
  - where: 'thread'
    claim: 'One older reading: the congregation calls to the priests and Levites who have the night service'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/134.htm'
    quote: 'a call to devotion and intercession, which the congregation addresses to the priests and Levites entrusted with the night-service in the Temple.'
  - where: 'thread'
    claim: 'On that reading the servants answer with a blessing on the people'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/134.htm'
    quote: 'Calling thus up to the Temple-hill, the church receives from above the benedictory counter-greeting'
  - where: 'thread'
    claim: 'The psalm is a greeting and a reply'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/134.htm'
    quote: 'This Psalm consists of a greeting, Psalm 134:1-2, and the reply thereto.'

  # ---------- sections ----------
  - where: 'section 1 plain'
    claim: 'Verse 1 may be rendered “Come, bless the LORD … who stand by night”; verse 2 “to the holy place”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20134&version=NRSVUE'
    quote: 'Lift up your hands to the holy place'
  - where: 'section 1 plain'
    claim: '“By night” is a plural in the Hebrew (“in the nights”)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/134.htm'
    quote: 'It is an error to suppose that "in the nights" can be equivalent to "early and late."'
  - where: 'section 2 plain'
    claim: 'Verse 3 is a wish: “May the Lord … bless thee”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/134.htm'
    quote: 'May the Lord, who made heaven and earth, bless thee out of Sion.'

  # ---------- note 134:1 ----------
  - where: 'note 134:1 “Who stands in the house by night”'
    claim: 'Levi was set apart to stand before the LORD, to minister and to bless in His name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/10?lang=eng'
    quote: 'to stand before the Lord to minister unto him, and to bless in his name, unto this day.'
  - where: 'note 134:1 “Who stands in the house by night”'
    claim: 'Levites were appointed to stand morning and evening to thank and praise the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/23?lang=eng'
    quote: 'And to stand every morning to thank and praise the Lord, and likewise at even;'
  - where: 'note 134:1 “Who stands in the house by night”'
    claim: 'Psalm 135 repeats the address and names the house of Levi'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/135?lang=eng'
    quote: 'Bless the Lord, O house of Levi: ye that fear the Lord, bless the Lord.'
  - where: 'note 134:1 “Who stands in the house by night”'
    claim: 'The Levite singers were employed day and night'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/9?lang=eng'
    quote: 'And these are the singers, chief of the fathers of the Levites, who remaining in the chambers were free: for they were employed in that work day and night.'
  - where: 'note 134:1 “Who stands in the house by night”'
    claim: 'Those who lodged around the house were Levites, the porters (gatekeepers)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/9?lang=eng'
    quote: 'For these Levites, the four chief porters, were in their set office, and were over the chambers and treasuries of the house of God.'
  - where: 'note 134:1 “Who stands in the house by night”'
    claim: 'They lodged around the house because the charge and the morning opening were theirs'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/9?lang=eng'
    quote: 'And they lodged round about the house of God, because the charge was upon them, and the opening thereof every morning pertained to them.'
  - where: 'note 134:1 “Who stands in the house by night”'
    claim: 'The Church’s footnote on “night” in Psalm 134:1 refers to 1 Chronicles 9:33'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/134?lang=eng'
    quote: '1 Chr. 9:33'

  # ---------- note 134:2 ----------
  - where: 'note 134:2 “Hands lifted in the holy place, or toward it”'
    claim: 'The Greek has “in the sanctuaries”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/134.htm'
    quote: 'Lift up your hands by night in the sanctuaries, and bless the Lord.'
  - where: 'note 134:2 “Hands lifted in the holy place, or toward it”'
    claim: 'A modern translation has the hands lifted to the holy place'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20134&version=NRSVUE'
    quote: 'Lift up your hands to the holy place'
  - where: 'note 134:2 “Hands lifted in the holy place, or toward it”'
    claim: 'Psalm 28:2 has hands lifted toward the holy oracle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/28?lang=eng'
    quote: 'Hear the voice of my supplications, when I cry unto thee, when I lift up my hands toward thy holy oracle.'

  # ---------- note 134:3 ----------
  - where: 'note 134:3 “The blessing returned, in the priests’ words and to one person”'
    claim: 'One older reading: the people call up to the temple hill and receive the blessing in reply'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/134.htm'
    quote: 'Calling thus up to the Temple-hill, the church receives from above the benedictory counter-greeting'
  - where: 'note 134:3 “The blessing returned, in the priests’ words and to one person”'
    claim: 'The wording is that of the priestly blessing of Numbers 6:24'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/134.htm'
    quote: 'is the ground-form of the priestly benediction.'
  - where: 'note 134:3 “The blessing returned, in the priests’ words and to one person”'
    claim: 'The blessing was given to Aaron and his sons to say over Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/6?lang=eng'
    quote: 'Speak unto Aaron and unto his sons, saying, On this wise ye shall bless the children of Israel, saying unto them,'
  - where: 'note 134:3 “The blessing returned, in the priests’ words and to one person”'
    claim: 'It begins “The LORD bless thee,” in the singular'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/6?lang=eng'
    quote: 'The Lord bless thee, and keep thee:'
  - where: 'note 134:3 “The blessing returned, in the priests’ words and to one person”'
    claim: 'The same reading: the singular addresses the people as one person and each one in it'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/134.htm'
    quote: 'It is addressed to the church as one person, and to each individual in this united, unit-like church.'
  - where: 'note 134:3 “The blessing returned, in the priests’ words and to one person”'
    claim: 'When people bless God the verb means to adore; the lexicon lists Psalm 134:1 and 2 under that sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/1288.htm'
    quote: 'bless God, adore with bended knees'
  - where: 'note 134:3 “The blessing returned, in the priests’ words and to one person”'
    claim: 'Psalm 133 says what the LORD’s blessing at Zion is'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/133?lang=eng'
    quote: 'for there the Lord commanded the blessing, even life for evermore.'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'The risen Christ told the Nephites that He created the heavens and the earth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'Behold, I am Jesus Christ the Son of God. I created the heavens and the earth, and all things that in them are.'

  # ---------- explore ----------
  - where: 'explore'
    claim: 'Psalm 135 ends with “bless the LORD” addressed to Israel, Aaron and Levi'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/135?lang=eng'
    quote: 'Bless the Lord, O house of Israel: bless the Lord, O house of Aaron:'

  # ---------- parallels ----------
  - where: 'parallels'
    claim: 'Psalm 135:1 addresses the servants of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/135?lang=eng'
    quote: 'Praise ye the Lord. Praise ye the name of the Lord; praise him, O ye servants of the Lord.'
  - where: 'parallels'
    claim: 'Psalm 115:15 has the LORD “which made heaven and earth”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/115?lang=eng'
    quote: 'Ye are blessed of the Lord which made heaven and earth.'
