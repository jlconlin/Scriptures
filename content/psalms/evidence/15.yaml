chapter: 15
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'The title ascribes the psalm to David and names no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/15?lang=eng'
    quote: 'A Psalm of David.'
  - where: setting
    claim: 'An older commentary holds that nothing is certain about the occasion except that the psalm assumes Zion as the holy mountain and the ark already removed to the tent there (2 Sam. 6:17)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/15.htm'
    quote: 'Nothing can be maintained with any certainty except that the Psalm assumes the elevation of Zion to the special designation of "the holy mountain" and the removal of the Ark to the'
  - where: setting
    claim: 'The ark was set in a tent David pitched for it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/6?lang=eng'
    quote: 'in the midst of the tabernacle that David had pitched for it'
  - where: setting
    claim: 'Psalm 15 is classified as an entrance liturgy, and Psalm 24 is another of the type'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Psalm 15 has been classified as an entrance liturgy or temple entry psalm. Psalm 24 is another psalm of this type.'
  - where: setting
    claim: 'Isaiah 33:13–16 has been called a variation of this psalm'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/15.htm'
    quote: 'Isaiah 33:13-16 is a fine variation of this Psalm.'
  - where: setting
    claim: 'Isaiah 33:14 asks who shall dwell with the devouring fire, and verse 15 answers with a list'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/33?lang=eng'
    quote: 'Who among us shall dwell with the devouring fire? who among us shall dwell with everlasting burnings?'
  - where: setting
    claim: 'One reading: Psalm 14 closes with a longing for salvation out of Zion and Psalm 15 says whom that salvation will avail'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/15.htm'
    quote: 'closed with a longing for the salvation out of Zion. Psalm 15:1-5 answers the question: who belongs to this'
  - where: setting
    claim: 'The same reading: the psalm answers whom the future salvation shall avail'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/15.htm'
    quote: 'and whom shall the future salvation avail?'

  # ---------- thread ----------
  - where: thread
    claim: 'Verse 2 gives three general characteristics'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/15.htm'
    quote: 'We have three characteristics here: a spotless walk, conduct ordered according to God''s will, and a truth-loving mode of thought.'
  - where: thread
    claim: 'The question and the general answer are followed by three groups of lines that work the answer out in detail'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/15.htm'
    quote: 'are now followed by three tristichs, which work the answer out in detail'
  - where: thread
    claim: 'The answer concerns duties toward other people and the inward state of the heart'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/15.htm'
    quote: 'But His will concerns the very substance of the Law, viz., our duties towards all men, and the inward state of the heart towards God.'
  - where: thread
    claim: 'The list has both positive and negative qualifications'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'There are five positive qualifications (“walketh uprightly,” “speaketh the truth”) and five negative qualifications (“backbiteth not,” “nor doeth evil”).'

  # ---------- sections ----------
  - where: section 1 plain
    claim: '“Abide” is to stay as a guest'
    key: bdb
    url: 'https://biblehub.com/hebrew/1481.htm'
    quote: 'so (poetry) of worshipper in Yahweh''s house Psalm 15:1'
  - where: section 1 plain
    claim: '“Tabernacle” rendered “tent”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2015&version=NRSVUE'
    quote: 'who may abide in your tent?'
  - where: section 2 plain
    claim: '“Uprightly” rendered “blamelessly”; “backbiteth” rendered “slander”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2015&version=NRSVUE'
    quote: 'who do not slander with their tongue'
  - where: section 2 plain
    claim: 'The verb for backbiting is to go about as a slanderer'
    key: bdb
    url: 'https://biblehub.com/hebrew/7270.htm'
    quote: 'Qal go about (maliciously, as slanderer'
  - where: section 3 plain
    claim: 'The “vile person” is a reprobate'
    key: bdb
    url: 'https://biblehub.com/hebrew/3988.htm'
    quote: 'Psalm 15:4 ( = reprobate; opposed to'
  - where: section 3 plain
    claim: 'The oath is kept even to his hurt'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2015&version=NRSVUE'
    quote: 'who stand by their oath even to their hurt'
  - where: section 3 plain
    claim: '“Usury” rendered lending at interest; “reward” rendered a bribe'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2015&version=NRSVUE'
    quote: 'and do not take a bribe against the innocent.'
  - where: section 3 plain
    claim: '“Moved” is shaken'
    key: bdb
    url: 'https://biblehub.com/hebrew/4131.htm'
    quote: 'be shaken, moved, overthrown'

  # ---------- note 15:1 guest ----------
  - where: 'note 15:1 “A guest in the LORD’s tent”'
    claim: 'The lexicon files Psalm 15:1 and 61:4 (Hebrew 61:5) as the worshipper in the LORD’s house'
    key: bdb
    url: 'https://biblehub.com/hebrew/1481.htm'
    quote: 'so (poetry) of worshipper in Yahweh''s house Psalm 15:1; Psalm 61:5 compare Isaiah 33:14'
  - where: 'note 15:1 “A guest in the LORD’s tent”'
    claim: 'Psalm 5:4 (Hebrew 5:5) has the same verb: evil cannot be the LORD’s guest'
    key: bdb
    url: 'https://biblehub.com/hebrew/1481.htm'
    quote: 'Psalm 5:5 evil cannot be a guest of thine'
  - where: 'note 15:1 “A guest in the LORD’s tent”'
    claim: 'The Greek translation has “sojourn”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/15.htm'
    quote: 'O Lord, who shall sojourn in thy tabernacle? and who shall dwell in thy holy mountain?'
  - where: 'note 15:1 “A guest in the LORD’s tent”'
    claim: 'A modern translation renders “tabernacle” as “tent”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2015&version=NRSVUE'
    quote: 'who may abide in your tent?'
  - where: 'note 15:1 “A guest in the LORD’s tent”'
    claim: 'The word for “tabernacle” (ohel, H168) is the word for a tent; the LORD’s tent in Psalms 15, 27 and 61 is the dwelling-place of the righteous'
    key: bdb
    url: 'https://biblehub.com/hebrew/168.htm'
    quote: 'is refuge & dwelling-place of righteous, Psalm 15:1; Psalm 27:5; Psalm 27:6; Psalm 61:5'
  - where: 'note 15:1 “A guest in the LORD’s tent”'
    claim: 'In David’s day the ark stood in a tent he had pitched for it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/6?lang=eng'
    quote: 'in the midst of the tabernacle that David had pitched for it'

  # ---------- note 15:1 gate ----------
  - where: 'note 15:1 “A question at the gate, and its answer”'
    claim: 'The psalm is classified as an entrance liturgy'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Psalm 15 has been classified as an entrance liturgy or temple entry psalm.'
  - where: 'note 15:1 “A question at the gate, and its answer”'
    claim: 'First element of the form: the worshippers ask'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'the worshippers inquire of the priest as to the qualifications for admission to the holy place (15:1)'
  - where: 'note 15:1 “A question at the gate, and its answer”'
    claim: 'Second element: the priest answers'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'the priest responds by specifying the requirements (15:2–5)'
  - where: 'note 15:1 “A question at the gate, and its answer”'
    claim: 'Third element: a blessing at the end of verse 5'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'the priest concludes with a blessing (end of 15:5)'
  - where: 'note 15:1 “A question at the gate, and its answer”'
    claim: 'The roles are given either way round: worshipper or priest asking, priest or worshipper answering'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'The worshipper (or priest) would ask, “Lord, who shall abide in thy tabernacle?” and the priest (or worshipper) would respond with the qualifications for temple service'
  - where: 'note 15:1 “A question at the gate, and its answer”'
    claim: 'The use of the psalm as a call and response is given as what “appears” to have been the case'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'Psalm 15, for example, appears to have functioned as a call and response that would allow the worshipper to enter into the temple.'
  - where: 'note 15:1 “A question at the gate, and its answer”'
    claim: 'The form of temple music is a matter of educated guesses'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'There is no way to know beyond educated guesses what form temple music would have taken.'
  - where: 'note 15:1 “A question at the gate, and its answer”'
    claim: 'The question is addressed to the LORD'
    key: skinner-seeing-god
    url: 'https://rsc.byu.edu/ascending-mountain-lord/seeing-god-his-temple-significant-theme-israels-psalms'
    quote: 'It begins with a question directed to the Lord himself'

  # ---------- note 15:1 JST ----------
  - where: 'note 15:1 “Joseph Smith’s revision names the hill Zion”'
    claim: 'The Joseph Smith Translation reading of the verse'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'In the JST, Psalm 15:1 reads, “Lord, who shall abide in thy tabernacle? who shall dwell in thy holy hill of Zion?”'
  - where: 'note 15:1 “Joseph Smith’s revision names the hill Zion”'
    claim: 'The Church’s edition gives the reading in footnote 1b'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/15?lang=eng'
    quote: 'hill of Zion?'
  - where: 'note 15:1 “Joseph Smith’s revision names the hill Zion”'
    claim: 'The Hebrew has “in the hill of thy holiness,” with no name'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'קָדְשֶֽׁ/ךָ'
  - where: 'note 15:1 “Joseph Smith’s revision names the hill Zion”'
    claim: '“Holy hill of Zion” is found in the King James Version only at Psalm 2:6'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'The phrase “holy hill of Zion” is found uniquely in Psalm 2:6 in the KJV'
  - where: 'note 15:1 “Joseph Smith’s revision names the hill Zion”'
    claim: 'The addition strengthens the parallel of tabernacle and holy hill'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'is enhanced by the JST addition “of Zion,” since Zion also refers to the temple or the dwelling place of God'
  - where: 'note 15:1 “Joseph Smith’s revision names the hill Zion”'
    claim: 'The revision adds Zion to four psalms'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'the addition of four more references to Zion in the JST (Psalms 14:7; 15:1; 46:5; 53:6)'
  - where: 'note 15:1 “Joseph Smith’s revision names the hill Zion”'
    claim: 'Zion was prominent in the Saints’ minds in early 1833'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'The concept of Zion was prominent in the minds of Church members in early 1833.'
  - where: 'note 15:1 “Joseph Smith’s revision names the hill Zion”'
    claim: 'The work on the Psalms is dated approximately to January and February 1833'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'an approximate date for the translation of Psalms of January and February 1833'
  - where: 'note 15:1 “Joseph Smith’s revision names the hill Zion”'
    claim: 'The Saints had begun moving to Missouri to build Zion'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'In 1831, Saints had started moving to Missouri to build up Zion there'
  - where: 'note 15:1 “Joseph Smith’s revision names the hill Zion”'
    claim: 'Whether Jerusalem or the New Jerusalem is meant is not clear; either way Mount Zion is the temple site'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'It is not clear if this specification is meant to signify Jerusalem or the New Jerusalem, but in either location Mount Zion is the name for the site of God’s holy temple'

  # ---------- note 15:2 ----------
  - where: 'note 15:2 “Uprightly is the word for whole”'
    claim: 'The word is tamim (H8549)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תָּ֭מִים'
  - where: 'note 15:2 “Uprightly is the word for whole”'
    claim: 'The word means complete, sound'
    key: bdb
    url: 'https://biblehub.com/hebrew/8549.htm'
    quote: 'adjective complete, sound'
  - where: 'note 15:2 “Uprightly is the word for whole”'
    claim: 'Of a person it means sound, having integrity, and the lexicon lists Genesis 17:1 in the same sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/8549.htm'
    quote: '4 sound, wholesome, unimpaired, innocent, having integrity: of God''s way Psalm 18:31'
  - where: 'note 15:2 “Uprightly is the word for whole”'
    claim: 'Genesis 17:1 is listed among the uses of the word of a man'
    key: bdb
    url: 'https://biblehub.com/hebrew/8549.htm'
    quote: 'elsewhere of man Genesis 6:9; Genesis 17:1'
  - where: 'note 15:2 “Uprightly is the word for whole”'
    claim: 'A modern translation has “blamelessly”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2015&version=NRSVUE'
    quote: 'Those who walk blamelessly and do what is right'

  # ---------- note 15:3 ----------
  - where: 'note 15:3 “Backbiting is going about with a tale”'
    claim: 'The verb (ragal, H7270) is formed from the noun for foot and means to go about'
    key: bdb
    url: 'https://biblehub.com/hebrew/7270.htm'
    quote: 'verb denominative foot it, go about'
  - where: 'note 15:3 “Backbiting is going about with a tale”'
    claim: 'In this verse it is to go about maliciously as a slanderer'
    key: bdb
    url: 'https://biblehub.com/hebrew/7270.htm'
    quote: 'Qal go about (maliciously, as slanderer'
  - where: 'note 15:3 “Backbiting is going about with a tale”'
    claim: 'The lexicon’s rendering of the line, set in parallel with “speaketh the truth” of verse 2'
    key: bdb
    url: 'https://biblehub.com/hebrew/7270.htm'
    quote: 'Psalm 15:3, he talks no slander upon his tongue'
  - where: 'note 15:3 “Backbiting is going about with a tale”'
    claim: 'Another form of the verb means slander in 2 Samuel 19:27 (Hebrew 19:28)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7270.htm'
    quote: '1 slander (compare Qal)'
  - where: 'note 15:3 “Backbiting is going about with a tale”'
    claim: 'A modern translation cross-references Leviticus 19:16 at this verse'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2015&version=NRSVUE'
    quote: '15.3 : Ex 23.1; Lev 19.16'

  # ---------- note 15:4 vile ----------
  - where: 'note 15:4 “The reprobate despised, those who fear the LORD honoured”'
    claim: 'The word is a passive form of the verb to reject'
    key: bdb
    url: 'https://biblehub.com/hebrew/3988.htm'
    quote: 'be rejected'
  - where: 'note 15:4 “The reprobate despised, those who fear the LORD honoured”'
    claim: 'The same form is used of silver in Jeremiah 6:30; in Psalm 15:4 it means a reprobate, opposed to those who fear the LORD'
    key: bdb
    url: 'https://biblehub.com/hebrew/3988.htm'
    quote: 'Jeremiah 6:30 (silver), Psalm 15:4 ( = reprobate; opposed to'
  - where: 'note 15:4 “The reprobate despised, those who fear the LORD honoured”'
    claim: 'A modern translation: the wicked are despised'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2015&version=NRSVUE'
    quote: 'in whose eyes the wicked are despised'
  - where: 'note 15:4 “The reprobate despised, those who fear the LORD honoured”'
    claim: 'One older reading: the man is despicable in his own eyes'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/15.htm'
    quote: 'despicable is he in his own eyes, worthy to be despised'
  - where: 'note 15:4 “The reprobate despised, those who fear the LORD honoured”'
    claim: 'On that reading his low view of himself is set against his respect for others, measured by the fear of God'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/15.htm'
    quote: 'he himself seems to himself unworthy of any respect, whereas he constantly shows respect to others; and the standard by which he judges is the fear of God'
  - where: 'note 15:4 “The reprobate despised, those who fear the LORD honoured”'
    claim: 'The reading’s example is David when he brought up the ark (2 Sam. 6:22)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/15.htm'
    quote: 'David, when he brought up the ark of his God, could not sufficiently degrade himself'
  - where: 'note 15:4 “The reprobate despised, those who fear the LORD honoured”'
    claim: 'The same commentary says the line is mostly translated the other way: the reprobate is despised in his eyes'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/15.htm'
    quote: 'On the other hand, it is mostly translated either, according to the usual accentuation'
  - where: 'note 15:4 “The reprobate despised, those who fear the LORD honoured”'
    claim: 'The usual translation as that commentary gives it'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/15.htm'
    quote: 'the reprobate is despised in his eyes'

  # ---------- note 15:4 oath ----------
  - where: 'note 15:4 “An oath kept though it costs him”'
    claim: 'A modern translation of the line'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2015&version=NRSVUE'
    quote: 'who stand by their oath even to their hurt'
  - where: 'note 15:4 “An oath kept though it costs him”'
    claim: 'The verb (mur, H4171) means to change, alter'
    key: bdb
    url: 'https://biblehub.com/hebrew/4171.htm'
    quote: '1 change, alter, Micah 2:4'
  - where: 'note 15:4 “An oath kept though it costs him”'
    claim: 'One older reading: the words refer to the law on rash oaths in Leviticus 5:4'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/15.htm'
    quote: 'The words have reference to Leviticus 5:4'
  - where: 'note 15:4 “An oath kept though it costs him”'
    claim: 'The same reading: the verb belongs to the law of vows, which forbids exchanging a vowed animal (Lev. 27:10)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/15.htm'
    quote: 'is native to the law of vows, which, if any one has vowed an animal in sacrifice, forbids both changing it for its money value'
  - where: 'note 15:4 “An oath kept though it costs him”'
    claim: 'The same reading: his fear of the LORD shows in how strictly he performs his vows'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/15.htm'
    quote: 'is manifest from the self-denying strictness with which he performs his vows'
  - where: 'note 15:4 “An oath kept though it costs him”'
    claim: 'The word for “to his own hurt” in Psalm 15:4 (lehara, H7489)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לְ֝/הָרַ֗ע'
  - where: 'note 15:4 “An oath kept though it costs him”'
    claim: 'Leviticus 5:4 has the same word, “to do evil”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'לְ/הָרַ֣ע'
  - where: 'note 15:4 “An oath kept though it costs him”'
    claim: 'Leviticus 27:10 has the verb mur (H4171) for exchanging a vowed animal'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lev.xml'
    quote: 'יָמִ֥יר'
  - where: 'note 15:4 “An oath kept though it costs him”'
    claim: 'The lexicon lists Leviticus 27:10 under the same verb'
    key: bdb
    url: 'https://biblehub.com/hebrew/4171.htm'
    quote: 'Leviticus 27:10,33'
  - where: 'note 15:4 “An oath kept though it costs him”'
    claim: 'The Greek translation of the line'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/15.htm'
    quote: 'He swears to his neighbour, and disappoints him not.'
  - where: 'note 15:4 “An oath kept though it costs him”'
    claim: 'The rendering “he swears to his neighbour” takes the word as “neighbour” and is rejected by the older reading'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/15.htm'
    quote: 'is entirely misapprehended when it is rendered: he swears to his neighbour'

  # ---------- note 15:5 usury ----------
  - where: 'note 15:5 “Interest on a loan to a brother”'
    claim: 'The noun (neshek, H5392) means interest'
    key: bdb
    url: 'https://biblehub.com/hebrew/5392.htm'
    quote: 'interest, usury (literally something bitten off)'
  - where: 'note 15:5 “Interest on a loan to a brother”'
    claim: 'Psalm 15:5 has the same phrase, “at interest,” as Leviticus 25:37'
    key: bdb
    url: 'https://biblehub.com/hebrew/5392.htm'
    quote: 'Leviticus 25:37 at interest, so Psalm 15:5'
  - where: 'note 15:5 “Interest on a loan to a brother”'
    claim: 'A modern translation of the line'
    key: nrsvue
