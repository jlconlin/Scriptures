chapter: 118
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The psalm has no title: the Gospel Library page goes from the chapter heading straight to verse 1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/118?lang=eng'
    quote: 'O give thanks unto the Lord; for he is good: because his mercy endureth for ever.'

  # ---- setting ----
  - where: 'setting'
    claim: 'Psalms 113–118 are the Hallel, recited at the great feasts'
    key: bd-hallel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hallel?lang=eng'
    quote: 'A name given to the group of Psalms (113–18) recited by Jews at the great feasts (Matt. 26:30; Mark 14:26).'
  - where: 'setting'
    claim: 'Psalm 107 opens with the same sentence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/107?lang=eng'
    quote: 'O give thanks unto the Lord, for he is good: for his mercy endureth for ever.'
  - where: 'setting'
    claim: 'The psalm has been called a thanksgiving liturgy for entrance to the sanctuary'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'In context, Psalm 118 is a “thanksgiving liturgy related to entrance to the sanctuary,” one that commemorates Jehovah’s devotion and favor toward Israel.'
  - where: 'setting'
    claim: 'One older reading dates the psalm after the exile'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/118.htm'
    quote: 'It is without any doubt a post-exilic song.'
  - where: 'setting'
    claim: 'That reading prefers the dedication of the rebuilt temple as the occasion'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/118.htm'
    quote: 'In connection with this reference of the Psalm to the post-exilic dedication of the Temple, Psalm 118:19-20, too, now present no difficulty.'
  - where: 'setting'
    claim: 'The crowds at the entry into Jerusalem shouted verses 25 and 26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/21?lang=eng'
    quote: 'Hosanna to the Son of David: Blessed is he that cometh in the name of the Lord; Hosanna in the highest.'
  - where: 'setting'
    claim: 'Jesus quoted verses 22 and 23 of Himself in the temple'
    key: wayment-psalms-matthew
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/jesus-use-psalms-matthew'
    quote: 'The following day He again entered the temple. On this occasion, His authority to do such things as cleanse the temple was challenged. His response, in part, includes the parable of the vineyard'
  - where: 'setting'
    claim: 'Peter quoted verse 22 before the council'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/4?lang=eng'
    quote: 'This is the stone which was set at nought of you builders, which is become the head of the corner.'
  - where: 'setting'
    claim: 'The New Testament cites or alludes to the psalm at least fifteen times, by one count'
    key: wayment-psalms-matthew
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/jesus-use-psalms-matthew'
    quote: 'Psalm 118 is, in fact, cited or alluded to at least fifteen times in the New Testament, if we do not count the occurrences where different gospel writers have recorded the same event.'

  # ---- thread ----
  - where: 'thread'
    claim: 'Verse 14 is a line of the song of Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'The Lord is my strength and song, and he is become my salvation'

  # ---- sections ----
  - where: 'section 2 plain'
    claim: '“Large place” is a broad place'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20118&version=NRSVUE'
    quote: 'the Lord answered me and set me in a broad place.'
  - where: 'section 3 plain'
    claim: '“Compassed me about” is surrounded on every side; the thorns are a fire that goes out (Hebrew “were extinguished”)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20118&version=NRSVUE'
    quote: '118.12 Gk: Heb were extinguished'
  - where: 'section 4 plain'
    claim: '“Tabernacles” are tents'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20118&version=NRSVUE'
    quote: 'There are glad songs of victory in the tents of the righteous:'
  - where: 'section 4 plain'
    claim: '“Chastened me sore” is severe discipline or punishment'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20118&version=NRSVUE'
    quote: 'The Lord has punished me severely,'
  - where: 'section 6 plain'
    claim: '“Now” in “Save now” is a particle of entreaty'
    key: bdb
    url: 'https://biblehub.com/hebrew/4994.htm'
    quote: 'particle of entreaty or'

  # ---- note 118:2 ----
  - where: 'note 118:2 “Three groups called to answer”'
    claim: 'Psalm 115 addresses Israel, the house of Aaron and those who fear the LORD in the same order'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/115?lang=eng'
    quote: 'O house of Aaron, trust in the Lord: he is their help and their shield.'
  - where: 'note 118:2 “Three groups called to answer”'
    claim: 'Psalm 115:11 addresses those who fear the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/115?lang=eng'
    quote: 'Ye that fear the Lord, trust in the Lord: he is their help and their shield.'
  - where: 'note 118:2 “Three groups called to answer”'
    claim: 'One older reading: the laity, the priests, and, as it appears, proselytes'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/118.htm'
    quote: 'then the whole body of the laity of Israel and the priests, and at last (as it appears) the proselytes (vid., on Psalm 115:9-11) who fear the God of revelation, are urgently admonished to echo it back'
  - where: 'note 118:2 “Three groups called to answer”'
    claim: 'The sentence was sung by course when the foundation of the second temple was laid'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/3?lang=eng'
    quote: 'And they sang together by course in praising and giving thanks unto the Lord; because he is good, for his mercy endureth for ever toward Israel.'

  # ---- note 118:5 ----
  - where: 'note 118:5 “From a strait to a wide place”'
    claim: '“Distress” is a noun meaning straits, in this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/4712.htm'
    quote: 'straits, distress; — absolute מִןֿ הַמֵּצַר קָרָאתִי Psalm 118:5'
  - where: 'note 118:5 “From a strait to a wide place”'
    claim: '“Large place” is a broad, roomy place, a figure of freedom from distress'
    key: bdb
    url: 'https://biblehub.com/hebrew/4800.htm'
    quote: 'broad, roomy, place; — absolute ׳מ, of pasture Hosea 4:16 (in simile); figurative of freedom from distress and anxiety 2 Samuel 22:20 = Psalm 18:20; Psalm 31:9; Psalm 118:5'
  - where: 'note 118:5 “From a strait to a wide place”'
    claim: 'A modern translation has “a broad place”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20118&version=NRSVUE'
    quote: 'the Lord answered me and set me in a broad place.'

  # ---- note 118:10 ----
  - where: 'note 118:10 “Who is surrounded by all nations”'
    claim: 'Thanksgiving psalms, 118 among them, voice the gratitude of an individual or community after deliverance'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'These psalms reflect the gratitude of an individual or community after they have been delivered from a trial by God: 18, 30, 34, 40, 66, 92, 116, 118, and 138.'
  - where: 'note 118:10 “Who is surrounded by all nations”'
    claim: 'The stone of verse 22 could be a king or Israel'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'The “stone” mentioned in 118:22 could then refer to a king or to Israel herself'
  - where: 'note 118:10 “Who is surrounded by all nations”'
    claim: 'The psalm has been read as celebrating Israel’s redemption after persecution by her oppressors'
    key: wayment-psalms-matthew
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/jesus-use-psalms-matthew'
    quote: 'Psalm 118 reads as though it were written to celebrate the Lord’s redeeming Israel following the persecution and suffering she had endured at the hands of her political oppressors.'
  - where: 'note 118:10 “Who is surrounded by all nations”'
    claim: 'A modern translation has “I cut them off” for “I will destroy them”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20118&version=NRSVUE'
    quote: 'in the name of the Lord I cut them off!'

  # ---- note 118:14 ----
  - where: 'note 118:14 “The song of Moses, sung again”'
    claim: 'Exodus 15 is the song Moses and the children of Israel sang when horse and rider were thrown into the sea'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'Then sang Moses and the children of Israel this song unto the Lord, and spake, saying, I will sing unto the Lord, for he hath triumphed gloriously: the horse and his rider hath he thrown into the sea.'
  - where: 'note 118:14 “The song of Moses, sung again”'
    claim: 'Verse 14 repeats Exodus 15:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'The Lord is my strength and song, and he is become my salvation: he is my God, and I will prepare him an habitation; my father’s God, and I will exalt him.'
  - where: 'note 118:14 “The song of Moses, sung again”'
    claim: 'Isaiah 12 places the line in a day to come'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/12?lang=eng'
    quote: 'And in that day thou shalt say, O Lord, I will praise thee'
  - where: 'note 118:14 “The song of Moses, sung again”'
    claim: 'Isaiah 12:2 has the line'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/12?lang=eng'
    quote: 'for the Lord Jehovah is my strength and my song; he also is become my salvation.'

  # ---- note 118:19 ----
  - where: 'note 118:19 “A request at the gate, and an answer”'
    claim: 'One older reading gives verses 1–19 to the procession'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/118.htm'
    quote: 'The first division (vv. 1-19) is sung by the festive procession brought up by the priests and Levites, which is ascending to the Temple with the animals for sacrifice.'
  - where: 'note 118:19 “A request at the gate, and an answer”'
    claim: 'The same reading gives verses 20–27 to the Levites, 28 to the arrivals and 29 to all'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/118.htm'
    quote: 'The second part (Psalm 118:20-27) is sung by the body of Levites who receive the festive procession. Then Psalm 118:28 is the answer of those who have arrived, and Psalm 118:29 the concluding song of all of them.'
  - where: 'note 118:19 “A request at the gate, and an answer”'
    claim: 'Nephi’s words in 2 Nephi 4:32 take up Psalm 118:19'
    key: hilton-psalms-bom
    url: 'https://rsc.byu.edu/ascending-mountain-lord/old-testament-psalms-book-mormon'
    quote: 'O Lord, wilt thou not shut the gates of thy righteousness [Psalm 118:19] before me'
  - where: 'note 118:19 “A request at the gate, and an answer”'
    claim: 'The text of 2 Nephi 4:32'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/4?lang=eng'
    quote: 'O Lord, wilt thou not shut the gates of thy righteousness before me, that I may walk in the path of the low valley'

  # ---- note 118:22 ----
  - where: 'note 118:22 “A rejected stone, and what the head of the corner is”'
    claim: 'The saying may have been a proverb of a move from humiliation to honor, of a foundation stone joining two walls'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'The verse quoted by Jesus may have been a proverb expressing “transition from humiliation to honor, in which a generally discarded stone became the foundation stone stabilizing two adjacent walls.”'
  - where: 'note 118:22 “A rejected stone, and what the head of the corner is”'
    claim: 'The stone could be a king or Israel herself'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'The “stone” mentioned in 118:22 could then refer to a king or to Israel herself'
  - where: 'note 118:22 “A rejected stone, and what the head of the corner is”'
    claim: 'Jews before and at the time of Christ appear to have read the stone of their nation and the Davidic dynasty'
    key: wayment-psalms-matthew
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/jesus-use-psalms-matthew'
    quote: 'it appears that the Jews understood the rejection of the chief cornerstone and its eventual reestablishment as a reference to their own nation and the return of the Davidic dynasty.'
  - where: 'note 118:22 “A rejected stone, and what the head of the corner is”'
    claim: 'There is little evidence that Jews at the time of Christ understood the psalm of the initial coming of the Messiah'
    key: wayment-psalms-matthew
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/jesus-use-psalms-matthew'
    quote: 'There is little, if any, evidence that the Jews at the time of Christ understood that Psalm 118 referred to the initial coming of the Messiah.'
  - where: 'note 118:22 “A rejected stone, and what the head of the corner is”'
    claim: 'The Greek has “the head of the corner”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/118.htm'
    quote: 'The stone which the builders rejected, the same is become the head of the corner.'
  - where: 'note 118:22 “A rejected stone, and what the head of the corner is”'
    claim: 'A modern translation has “the chief cornerstone”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20118&version=NRSVUE'
    quote: 'has become the chief cornerstone.'
  - where: 'note 118:22 “A rejected stone, and what the head of the corner is”'
    claim: 'Because of the gateway in verses 19–20 a keystone has been suggested'
    key: scripture-helps-ps-102
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/34-psalms-102-103-110-116-119-127-128-135-139-146-150?lang=eng'
    quote: 'Because of the imagery of a gateway in Psalm 118:19–20, some scholars suggest that the stone in verse 22 may refer to a keystone'
  - where: 'note 118:22 “A rejected stone, and what the head of the corner is”'
    claim: 'The rejected stone became the most essential part of the structure'
    key: scripture-helps-ps-102
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/34-psalms-102-103-110-116-119-127-128-135-139-146-150?lang=eng'
    quote: 'This verse speaks of a stone that builders once rejected but that eventually became the most essential part of the structure.'

  # ---- note 118:23 ----
  - where: 'note 118:23 “The Savior says the stone is Himself”'
    claim: 'Jesus quoted the verses after the parable of the vineyard, in which the son is killed'
    key: wayment-psalms-matthew
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/jesus-use-psalms-matthew'
    quote: 'He then rents it out to those who end up abusing his servants and ultimately taking the life of his son (see Matthew 21:33–40).'
  - where: 'note 118:23 “The Savior says the stone is Himself”'
    claim: 'The Savior’s reading reversed the one His hearers held'
    key: wayment-psalms-matthew
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/jesus-use-psalms-matthew'
    quote: 'Instead, the Savior interprets this scripture to mean the very opposite—the Jews become those who have oppressed the Lord’s people'
  - where: 'note 118:23 “The Savior says the stone is Himself”'
    claim: 'Peter spoke to the council'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/4?lang=eng'
    quote: 'Peter and John are arrested and brought before the council'
  - where: 'note 118:23 “The Savior says the stone is Himself”'
    claim: 'Peter sets the verse beside Isaiah’s cornerstone'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/2?lang=eng'
    quote: 'Behold, I lay in Sion a chief corner stone, elect, precious: and he that believeth on him shall not be confounded.'
  - where: 'note 118:23 “The Savior says the stone is Himself”'
    claim: 'Jacob uses Psalm 118:22 in Jacob 4:15–17'
    key: sc-knowhy-62
    url: 'https://scripturecentral.org/knowhy/why-does-jacob-quote-so-much-from-the-psalms'
    quote: 'Jacob uses Psalm 95:8 in Jacob 1:7, Psalm 145:8-9 in Jacob 4:10, Psalm 118:22 in Jacob 4:15-17, and Psalm 95:8 again in Jacob 6:6.'
  - where: 'note 118:23 “The Savior says the stone is Himself”'
    claim: 'Jacob’s words on the stone'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/jacob/4?lang=eng'
    quote: 'how is it possible that these, after having rejected the sure foundation, can ever build upon it, that it may become the head of their corner?'
  - where: 'note 118:23 “The Savior says the stone is Himself”'
    claim: 'The psalm has been said to introduce the allegory of the olive tree'
    key: wayment-psalms-matthew
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/jesus-use-psalms-matthew'
    quote: 'One might even say that Psalm 118 forms an introduction to the allegory of the olive tree (see Jacob 4:15–17).'
  - where: 'note 118:23 “The Savior says the stone is Himself”'
    claim: 'Jesus quoted the verse of Himself'
    key: scripture-helps-ps-102
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/34-psalms-102-103-110-116-119-127-128-135-139-146-150?lang=eng'
    quote: 'In the New Testament, the Savior quoted this scripture in reference to Himself.'
  - where: 'note 118:23 “The Savior says the stone is Himself”'
    claim: 'The allegory of the olive tree is the next chapter after Jacob’s question'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/jacob/5?lang=eng'
    quote: 'Jacob quotes Zenos relative to the allegory of the tame and wild olive trees'

  # ---- note 118:25 ----
  - where: 'note 118:25 “The verse that became Hosanna”'
    claim: 'Hosanna means “Save now” and is taken from this verse'
    key: bd-hosanna
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hosanna?lang=eng'
    quote: 'Save now. The word is taken from Ps. 118:25, one of the Psalms of the Hallel.'
  - where: 'note 118:25 “The verse that became Hosanna”'
    claim: 'The psalm was chanted at the Feast of Tabernacles with palm branches, hence the cry at the triumphal entry'
    key: bd-hosanna
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hosanna?lang=eng'
    quote: 'The chanting of this psalm was connected at the Feast of Tabernacles with the waving of palm branches; hence the use of the word by the multitudes at our Lord’s triumphal entry into Jerusalem'
  - where: 'note 118:25 “The verse that became Hosanna”'
    claim: '“Now” renders a particle of entreaty'
    key: bdb
    url: 'https://biblehub.com/hebrew/4994.htm'
    quote: 'particle of entreaty or'
  - where: 'note 118:25 “The verse that became Hosanna”'
    claim: 'A modern translation has “Save us, we beseech you”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20118&version=NRSVUE'
    quote: 'Save us, we beseech you, O Lord!'
  - where: 'note 118:25 “The verse that became Hosanna”'
    claim: 'The multitudes joined Hosanna to verse 26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/21?lang=eng'
    quote: 'And the multitudes that went before, and that followed, cried, saying, Hosanna to the Son of David: Blessed is he that cometh in the name of the Lord; Hosanna in the highest.'

  # ---- note 118:26 ----
  - where: 'note 118:26 “A welcome said to the Savior once, and to be said again”'
    claim: 'The crowds recited verse 26 as Jesus entered Jerusalem'
    key: wayment-psalms-matthew
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/jesus-use-psalms-matthew'
    quote: 'While He entered, they recited the now famous words of Psalm 118:26: “Blessed be he that cometh in the name of the Lord.”'
  - where: 'note 118:26 “A welcome said to the Savior once, and to be said again”'
    claim: 'John’s account adds “the King of Israel”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/12?lang=eng'
    quote: 'Took branches of palm trees, and went forth to meet him, and cried, Hosanna: Blessed is the King of Israel that cometh in the name of the Lord.'
  - where: 'note 118:26 “A welcome said to the Savior once, and to be said again”'
    claim: 'Matthew 21 is framed by verse 26 and verse 22'
    key: wayment-psalms-matthew
    url: 'https://rsc.byu.edu/sperry-symposium-classics-new-testament/jesus-use-psalms-matthew'
    quote: 'It begins with a quotation of Psalm 118:26 (see Matthew 21:9) and ends with a quotation of Psalm 118:22 (see Matthew 21:42).'
  - where: 'note 118:26 “A welcome said to the Savior once, and to be said again”'
    claim: 'Matthew 23 is the chapter of the woes on the scribes and Pharisees, and ends with the saying'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/23?lang=eng'
    quote: 'For I say unto you, Ye shall not see me henceforth, till ye shall say, Blessed is he that cometh in the name of the Lord.'
  - where: 'note 118:26 “A welcome said to the Savior once, and to be said again”'
    claim: 'Joseph Smith—Matthew gives the saying more fully, of His coming again'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-m/1?lang=eng'
    quote: 'until ye shall say: Blessed is he who cometh in the name of the Lord, in the clouds of heaven, and all the holy angels with him. Then understood his disciples that he should come again on the earth'

  # ---- note 118:27 ----
  - where: 'note 118:27 “A line whose meaning is uncertain”'
    claim: 'A modern translation marks the Hebrew of the verse as uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20118&version=NRSVUE'
    quote: '118.27 Meaning of Heb uncertain'
  - where: 'note 118:27 “A line whose meaning is uncertain”'
    claim: 'Its rendering of the line'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20118&version=NRSVUE'
    quote: 'Bind the festal procession with branches, up to the horns of the altar.'
  - where: 'note 118:27 “A line whose meaning is uncertain”'
    claim: 'The word is the ordinary word for a feast'
    key: bdb
    url: 'https://biblehub.com/hebrew/2282.htm'
    quote: 'apparently always of the three great pilgrim feasts, celebrated by processions and dancing'
  - where: 'note 118:27 “A line whose meaning is uncertain”'
    claim: 'In this verse the lexicon takes it as a festival sacrifice'
    key: bdb
    url: 'https://biblehub.com/hebrew/2282.htm'
    quote: '2 festival sacrifice (compare Late Hebrew חֲגִיגָה) Psalm 118:27'
  - where: 'note 118:27 “A line whose meaning is uncertain”'
    claim: 'The Greek has both the feast with branches and the bound victims'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/118.htm'
