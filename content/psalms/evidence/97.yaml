chapter: 97
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'Psalm 97 has no title in the Church’s edition; the page opens with the chapter heading and verse 1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/97?lang=eng'
    quote: 'The Lord reigneth; let the earth rejoice; let the multitude of isles be glad thereof.'
  - where: setting
    claim: 'The ancient Greek translation gives the psalm a title: for David, when his land is established'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/97.htm'
    quote: 'For David, when his land is established. The Lord reigns, let the earth exult, let many islands rejoice.'
  - where: setting
    claim: 'An older commentary sets aside the Greek title’s ascription to David and dates the psalm after the exile'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/97.htm'
    quote: 'is worthless; the time of restoration, from which it takes its rise, is the post-exilic'
  - where: setting
    claim: 'The same commentary describes the psalm as a mosaic of earlier psalms and prophets, Isaiah above all'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/97.htm'
    quote: 'it is composed, as mosaic-work, out of the earlier original passages of Davidic and Asaphic Psalms and of the prophets, more especially of Isaiah'
  - where: setting
    claim: 'The same commentary excepts the last strophe, verse 11 in particular, which it calls original'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/97.htm'
    quote: 'but as to the rest, particularly Psalm 97:11, this strophe is original'
  - where: setting
    claim: 'Psalms 90–106 are one of the five sections of the book (Book Four)'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'Psalms 90–106: This section begins with Moses’s prayer for the Lord to have mercy on straying Israel.'
  - where: setting
    claim: 'Psalm 97 is listed among the psalms of praise'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'praise the Lord: 8, 19, 29, 33, 47, 65, 66, 78, 93, 95–100'

  # ---------- thread ----------

  # ---------- sections ----------
  - where: section 1 plain
    claim: 'Verse 1 rendered “coastlands” and verse 2 “thick darkness” and “foundation,” as a modern translation has them'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2097&version=NRSVUE'
    quote: 'let the many coastlands be glad!'
  - where: section 1 plain
    claim: 'Verse 2: righteousness and justice are the foundation of his throne'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2097&version=NRSVUE'
    quote: 'righteousness and justice are the foundation of his throne'
  - where: section 2 plain
    claim: 'Verse 7 rendered “worthless idols” and verse 9 “most high over all the earth,” as a modern translation has them'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2097&version=NRSVUE'
    quote: 'those who make their boast in worthless idols'
  - where: section 3 plain
    claim: 'Verse 10 rendered “guards the lives of his faithful,” as a modern translation has it'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2097&version=NRSVUE'
    quote: 'he guards the lives of his faithful'

  # ---------- note 97:1 ----------

  # ---------- note 97:2 cloud ----------
  - where: 'note 97:2 “The thick darkness where God is”'
    claim: 'The word behind “darkness” in verse 2 means a heavy cloud'
    key: bdb
    url: 'https://biblehub.com/hebrew/6205.htm'
    quote: 'noun masculine cloud, heavy cloud'
  - where: 'note 97:2 “The thick darkness where God is”'
    claim: 'The lexicon lists it first as the cloud in which God dwells, at Sinai and in Solomon’s temple'
    key: bdb
    url: 'https://biblehub.com/hebrew/6205.htm'
    quote: 'in which God dwells Exodus 20:18'
  - where: 'note 97:2 “The thick darkness where God is”'
    claim: 'The lexicon lists the word joined with “cloud” in Deuteronomy 4:11 and in Psalm 97:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/6205.htm'
    quote: 'Deuteronomy 4:11 (also חשֶׁח), Deuteronomy 5:19; Psalm 97:2'
  - where: 'note 97:2 “The thick darkness where God is”'
    claim: 'A modern translation has “Clouds and thick darkness”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2097&version=NRSVUE'
    quote: 'Clouds and thick darkness are all around him'
  - where: 'note 97:2 “The thick darkness where God is”'
    claim: 'The Church’s footnote to “darkness” in verse 2 is 1 Kings 8:12; Solomon says the LORD would dwell in the thick darkness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'The Lord said that he would dwell in the thick darkness'

  # ---------- note 97:2 habitation ----------
  - where: 'note 97:2 “Habitation means foundation”'
    claim: 'The Hebrew noun means a fixed or established place, a foundation'
    key: bdb
    url: 'https://biblehub.com/hebrew/4349.htm'
    quote: 'fixed or established place, foundation (chiefly in poetry)'
  - where: 'note 97:2 “Habitation means foundation”'
    claim: 'The lexicon lists Psalm 89:14 (Hebrew 89:15) and Psalm 97:2 together as a figurative use of the same word'
    key: bdb
    url: 'https://biblehub.com/hebrew/4349.htm'
    quote: 'Psalm 89:15, so Psalm 97:2'
  - where: 'note 97:2 “Habitation means foundation”'
    claim: 'A modern translation has “the foundation of his throne”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2097&version=NRSVUE'
    quote: 'righteousness and justice are the foundation of his throne'
  - where: 'note 97:2 “Habitation means foundation”'
    claim: 'The Greek has “the establishment of his throne”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/97.htm'
    quote: 'righteousness and judgment are the establishment of his throne'
  - where: 'note 97:2 “Habitation means foundation”'
    claim: 'Psalm 89:14 says the same of the LORD’s throne'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/89?lang=eng'
    quote: 'Justice and judgment are the habitation of thy throne'

  # ---------- note 97:5 ----------
  - where: 'note 97:5 “A coming told as already seen”'
    claim: 'The Church’s chapter heading reads the psalm of the Lord’s millennial reign'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/97?lang=eng'
    quote: 'The Lord reigns in millennial glory'
  - where: 'note 97:5 “A coming told as already seen”'
    claim: 'A modern translation puts verses 4–6 in the present'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2097&version=NRSVUE'
    quote: 'The mountains melt like wax before the Lord'
  - where: 'note 97:5 “A coming told as already seen”'
    claim: 'The Greek puts verse 3 in the future'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/97.htm'
    quote: 'Fire shall go before him, and burn up his enemies round about.'
  - where: 'note 97:5 “A coming told as already seen”'
    claim: 'The Greek keeps the past tense through verse 6'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/97.htm'
    quote: 'The heavens have declared his righteousness, and all the people have seen his glory.'
  - where: 'note 97:5 “A coming told as already seen”'
    claim: 'One older reading: the poet describes the future with historical certainty'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/97.htm'
    quote: 'The poet goes on to describe that which is future with historical certainty.'
  - where: 'note 97:5 “A coming told as already seen”'
    claim: 'The same reading: what Psalm 77 says of God’s appearing in earlier times is transferred to the last time'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/97.htm'
    quote: 'of the manifestation of God in the earlier times he transfers to the revelation of God in the last time'
  - where: 'note 97:5 “A coming told as already seen”'
    claim: 'The Church’s footnotes to “melted” in verse 5 include Judges 5:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/97?lang=eng'
    quote: 'Judg. 5:5'

  # ---------- note 97:7 gods ----------
  - where: 'note 97:7 “Idols, gods, and two words that sound alike”'
    claim: 'Verse 7 has elilim (H457) for “idols”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בָּ/אֱלִילִ֑ים'
  - where: 'note 97:7 “Idols, gods, and two words that sound alike”'
    claim: 'The verb of the last line is parsed as an imperative, second person plural (HVvv2mp), and its subject is elohim (H430)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הִשְׁתַּחֲווּ'
  - where: 'note 97:7 “Idols, gods, and two words that sound alike”'
    claim: 'In the plural the word means worthless gods, idols'
    key: bdb
    url: 'https://biblehub.com/hebrew/457.htm'
    quote: 'concrete worthless gods, idols'
  - where: 'note 97:7 “Idols, gods, and two words that sound alike”'
    claim: 'The lexicon: associated by the prophets with worthlessness and used in ironic contrast with the words for gods'
    key: bdb
    url: 'https://biblehub.com/hebrew/457.htm'
    quote: 'associated by the prophets with idea of worthlessness, & used by them in iron. contrast with'
  - where: 'note 97:7 “Idols, gods, and two words that sound alike”'
    claim: 'A modern translation has “worthless idols”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2097&version=NRSVUE'
    quote: 'those who make their boast in worthless idols'
  - where: 'note 97:7 “Idols, gods, and two words that sound alike”'
    claim: 'A modern translation makes the last line a statement'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2097&version=NRSVUE'
    quote: 'all gods bow down before him'
  - where: 'note 97:7 “Idols, gods, and two words that sound alike”'
    claim: 'A modern translation gives verse 9 as “most high over all the earth”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2097&version=NRSVUE'
    quote: 'For you, O Lord, are most high over all the earth'
  - where: 'note 97:7 “Idols, gods, and two words that sound alike”'
    claim: 'The Greek has “angels” for the gods, in a command'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/97.htm'
    quote: 'worship him, all ye his angels'

  # ---------- note 97:7 Hebrews ----------
  - where: 'note 97:7 “Hebrews gives this worship to the Son”'
    claim: 'Hebrews 1:6 applies the command to the Firstbegotten'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/1?lang=eng'
    quote: 'And again, when he bringeth in the firstbegotten into the world, he saith, And let all the angels of God worship him.'
  - where: 'note 97:7 “Hebrews gives this worship to the Son”'
    claim: 'The Greek of Psalm 97:7 reads “worship him, all ye his angels”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/97.htm'
    quote: 'worship him, all ye his angels'
  - where: 'note 97:7 “Hebrews gives this worship to the Son”'
    claim: 'The Greek of Deuteronomy 32:43 has the sentence of Hebrews 1:6 word for word'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/deuteronomy/32.htm'
    quote: 'Rejoice, ye heavens, with him, and let all the angels of God worship him'
  - where: 'note 97:7 “Hebrews gives this worship to the Son”'
    claim: 'A modern translation restores the line in Deuteronomy 32:43 as “worship him, all you gods!”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy%2032%3A43&version=NRSVUE'
    quote: 'worship him, all you gods!'
  - where: 'note 97:7 “Hebrews gives this worship to the Son”'
    claim: 'Its footnote: a manuscript and the Greek have the line; the traditional Hebrew text (MT) lacks it'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Deuteronomy%2032%3A43&version=NRSVUE'
    quote: '32.43 Q ms Gk: MT lacks this line'

  # ---------- note 97:8 ----------
  - where: 'note 97:8 “The joy of verse 1 comes home to Zion”'
    claim: 'Psalm 48:11 has nearly the same line'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/48?lang=eng'
    quote: 'Let mount Zion rejoice, let the daughters of Judah be glad, because of thy judgments.'

  # ---------- note 97:10 ----------

  # ---------- note 97:11 ----------
  - where: 'note 97:11 “Light sown, or light dawned”'
    claim: 'The Hebrew of verse 11 is a passive participle of the verb “sow” (H2232)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'זָרֻ֣עַ'
  - where: 'note 97:11 “Light sown, or light dawned”'
    claim: 'The lexicon judges that the verb “rise, dawn” should probably be read, with the ancient versions'
    key: bdb
    url: 'https://biblehub.com/hebrew/2232.htm'
    quote: 'Psalm 97:11 read probably זָרַח'
  - where: 'note 97:11 “Light sown, or light dawned”'
    claim: 'The Greek has “sprung up”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/97.htm'
    quote: 'Light is sprung up for the righteous, and gladness for the upright in heart.'
  - where: 'note 97:11 “Light sown, or light dawned”'
    claim: 'A modern translation has “dawns”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2097&version=NRSVUE'
    quote: 'Light dawns for the righteous'
  - where: 'note 97:11 “Light sown, or light dawned”'
    claim: 'Its footnote: the Greek and two other ancient versions read so; the Hebrew is “is sown”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2097&version=NRSVUE'
    quote: '97.11 Gk Syr Jerome: Heb is sown'
  - where: 'note 97:11 “Light sown, or light dawned”'
    claim: 'One older reading keeps “sown” and says the ancient versions misread it as the other verb, the verb of Psalm 112:4, which differs in its last letter'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/97.htm'
    quote: 'is misapprehended by the ancient versions, inasmuch as they read'
  - where: 'note 97:11 “Light sown, or light dawned”'
    claim: 'The same reading: sown means strewn along the path of the righteous'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/97.htm'
    quote: 'strewn along his life''s way, so that he, the righteous one, advances step by step in the light'

  # ---------- christ ----------
  - where: christ
    claim: 'Jehovah, the LORD of the Old Testament, is the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: christ
    claim: 'Many psalms of Book Four are read of the millennial day and the Messiah’s reign'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'Many of these psalms describe the millennial day when Israel will find rest under the Messiah’s reign.'
  - where: christ
    claim: 'The Church’s chapter heading reads Psalm 97 of the Lord’s millennial reign'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/97?lang=eng'
    quote: 'The Lord reigns in millennial glory'

  # ---------- parallels ----------
  - where: parallels
    claim: 'Psalm 30:4 ends with the closing line of Psalm 97:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/30?lang=eng'
    quote: 'give thanks at the remembrance of his holiness'
