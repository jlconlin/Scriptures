  - where: 'note 12:5 “The LORD answers inside the psalm”'
    claim: 'The Lord as champion of the poor and needy is a recurring theme in Psalms'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Verse 5 features a recurring theme in Psalms—the idea that the Lord is the champion of the poor and needy.'

  # ---------- note 12:5 puffeth ----------
