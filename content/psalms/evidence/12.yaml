chapter: 12
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'The title ascribes the psalm to David and names no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/12?lang=eng'
    quote: 'To the chief Musician upon Sheminith, A Psalm of David.'
  - where: setting
    claim: 'The title names David and Sheminith, and no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/12?lang=eng'
    quote: 'To the chief Musician upon Sheminith, A Psalm of David.'
  - where: setting
    claim: 'Psalm 12 is a lament, a cry for help against the verbal attacks of the wicked'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Psalm 12 is a lament, a cry for help from the righteous against the (verbal) attacks of the wicked.'
  - where: setting
    claim: 'Isaiah 33:10 has the LORD say “Now will I rise, saith the LORD”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/33?lang=eng'
    quote: 'Now will I rise, saith the Lord; now will I be exalted; now will I lift up myself.'
  - where: setting
    claim: 'Joseph Smith’s work on the Psalms is dated to about January and February 1833'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'an approximate date for the translation of Psalms of January and February 1833'
  - where: setting
    claim: 'The revision moves psalms toward the last days'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'bringing their message forward to the last days and the Lord’s Coming'

  # ---------- thread ----------
  - where: thread
    claim: 'The verb “speak” (H1696) is the second word of verse 2'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יְֽדַבְּרוּ֮'
  - where: thread
    claim: 'The verb “speak” (H1696) is the last word of verse 2'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יְדַבֵּֽרוּ'
  - where: thread
    claim: 'The verb “speak” (H1696) comes a third time in verse 3 (“that speaketh”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מְדַבֶּ֥רֶת'
  - where: thread
    claim: '“Have said” in verse 4 is the verb H559'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אָֽמְר֨וּ'
  - where: thread
    claim: '“Saith” in verse 5 is the same verb, H559'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יֹאמַ֣ר'
  - where: thread
    claim: 'The Lord’s pure and sure promises are set against the flattering and proud words of verses 2–3'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Unlike the “flattering” and “proud” words coming from the “double heart” of the wicked (Psalm 12:2–3), the Lord’s promises are pure and sure.'
  - where: thread
    claim: 'The hope of verse 7 rests on the divine utterance of verse 5'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/12.htm'
    quote: 'now in the fourth there arises a consolatory hope based upon the divine utterance which was heard in the third strophe'
  - where: thread
    claim: 'The psalm ends with the present still dark'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/12.htm'
    quote: 'Thus even at last the depressing view of the present prevails in the midst of the confession of a more consolatory hope. The present is gloomy.'

  # ---------- sections ----------
  - where: section 1 plain
    claim: 'Verse 1 in a modern translation: the godly are no more, the faithful have disappeared'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2012&version=NRSVUE'
    quote: 'the faithful have disappeared from humankind'
  - where: section 1 plain
    claim: 'The Greek has “Save” for “Help”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/12.htm'
    quote: 'Save me, O Lord; for the godly man has failed'
  - where: section 1 plain
    claim: '“Flattering” is smoothness'
    key: bdb
    url: 'https://biblehub.com/hebrew/2513.htm'
    quote: 'smoothness = flattery'
  - where: section 2 plain
    claim: 'Verse 3 is a wish; verse 4 has “master”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2012&version=NRSVUE'
    quote: 'May the Lord cut off all flattering lips,'
  - where: section 2 plain
    claim: 'A modern translation has “who is our master?”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2012&version=NRSVUE'
    quote: 'who is our master?'
  - where: section 2 plain
    claim: '“Proud things” is in the Greek “great words”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/12.htm'
    quote: 'the tongue that speaks great words'
  - where: section 3 plain
    claim: 'The alternative rendering of the last clause of verse 5: to pant for it'
    key: bdb
    url: 'https://biblehub.com/hebrew/6315.htm'
    quote: 'puff, = pant for it (so most'
  - where: section 3 plain
    claim: '“Tried” is smelted, refined'
    key: bdb
    url: 'https://biblehub.com/hebrew/6884.htm'
    quote: 'smelt, refine'
  - where: section 4 plain
    claim: 'The pronoun on “preserve” is parsed as third person masculine singular (hebrew.mjs: HVqi2ms/Sp3ms)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תִּצְּרֶ֓/נּוּ'
  - where: section 4 plain
    claim: 'What is exalted in verse 8 is “worthlessness”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2149.htm'
    quote: 'noun feminine worthlessness, only'
  - where: section 4 plain
    claim: 'Verse 8 ends in Hebrew with “the children of men” (bene adam)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לִ/בְנֵ֥י'

  # ---------- note 12:1 JST ----------
  - where: 'note 12:1 “Joseph Smith’s revision sets the psalm in the day of judgment”'
    claim: 'The work on Psalms is dated to about January and February 1833'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'All of these considerations combine to give us an approximate date for the translation of Psalms of January and February 1833.'
  - where: 'note 12:1 “Joseph Smith’s revision sets the psalm in the day of judgment”'
    claim: 'The Joseph Smith Translation of Psalm 12:1'
    key: mcconkie-poetic-writings
    url: 'https://rsc.byu.edu/joseph-smith-translation/joseph-smith-poetic-writings'
    quote: 'To that theme is added these words in Psalm 12:1: “In that day thou shalt help, O Lord, the poor and the meek of the earth.”'
  - where: 'note 12:1 “Joseph Smith’s revision sets the psalm in the day of judgment”'
    claim: '“In that day” opens JST Psalms 11:1 and 12:1 and refers to the future day of judgment; three words'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'In the JST, both Psalms 11:1 and 12:1 start with the phrase “In that day,” a clear reference to the future day of God’s judgment, retribution, and triumph.'
  - where: 'note 12:1 “Joseph Smith’s revision sets the psalm in the day of judgment”'
    claim: 'The opening of JST Psalm 12:5'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: '“Therefore, thus saith the Lord, I will arise in that day, I will stand upon the earth, and I will judge the earth for the oppression of the poor, for the sighing of the needy;'
  - where: 'note 12:1 “Joseph Smith’s revision sets the psalm in the day of judgment”'
    claim: 'JST Psalm 12:5 adds that the Lord shall sit in judgment'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'The inserted phrase toward the end of JST Psalm 12:5, “the Lord shall sit in judgment,” applies to those who oppress the poor and ignore their sighing.'
  - where: 'note 12:1 “Joseph Smith’s revision sets the psalm in the day of judgment”'
    claim: '“Thus saith the Lord” is common where a prophet declares God’s words and never used in the King James Psalms'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: '“Thus saith the Lord,” is common in scripture—used over five hundred times—when a prophet is declaring the words of God, but it is never employed in Psalms in the KJV.'
  - where: 'note 12:1 “Joseph Smith’s revision sets the psalm in the day of judgment”'
    claim: 'The addition makes the psalm prophetic'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'This phrase’s addition to Psalm 12 in the JST makes this psalm prophetic, highlighting the direct revelation to the Psalmist.'
  - where: 'note 12:1 “Joseph Smith’s revision sets the psalm in the day of judgment”'
    claim: 'The clause added to JST Psalm 12:8'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'but in the day of their pride thou shalt visit them” (Psalm 12:8)'
  - where: 'note 12:1 “Joseph Smith’s revision sets the psalm in the day of judgment”'
    claim: 'The visit of JST 12:8 is punishment'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'In the JST of Psalm 12:8, the sense is clearly one of punishment of the wicked'
  - where: 'note 12:1 “Joseph Smith’s revision sets the psalm in the day of judgment”'
    claim: 'In the King James the wicked are left in power; in the revision they are punished'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'in the JST, the wicked will be punished; in the KJV, the wicked are left in their positions of power and authority.'
  - where: 'note 12:1 “Joseph Smith’s revision sets the psalm in the day of judgment”'
    claim: 'A pervasive trend of the JST psalms is a shift to the future tense'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'One pervasive trend in the JST psalms is that verses were shifted to future tense,'
  - where: 'note 12:1 “Joseph Smith’s revision sets the psalm in the day of judgment”'
    claim: 'The shift brings the message to the last days'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'bringing their message forward to the last days and the Lord’s Coming'

