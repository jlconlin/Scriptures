  # ---------- note 12:2 ----------
  - where: 'note 12:2 “Smooth lips, and a heart and a heart”'
    claim: 'The word behind “flattering” is smoothness, used of the smooth part of the neck in Genesis 27:16'
    key: bdb
    url: 'https://biblehub.com/hebrew/2513.htm'
    quote: '1 smoothness, smooth part חֶלְקַת צַוָּארָיו Genesis 27:16.'
  - where: 'note 12:2 “Smooth lips, and a heart and a heart”'
    claim: 'In this verse the word means flattery; in Isaiah 30:10 it is smooth, agreeable, flattering things'
    key: bdb
    url: 'https://biblehub.com/hebrew/2513.htm'
    quote: '3 smoothness = flattery ׳שְׂפַת חִ Psalm 12:3, compare Psalm 12:4; חֶלְקַת לָשׁוֺן Proverbs 6:24; = substantive plural smooth things, i.e. agreeable, flattering things Isaiah 30:10.'
  - where: 'note 12:2 “Smooth lips, and a heart and a heart”'
    claim: 'Genesis 27:16 is of Jacob, on whose neck Rebekah put the skins'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/27?lang=eng'
    quote: 'And she put the skins of the kids of the goats upon his hands, and upon the smooth of his neck:'
