    claim: 'The Hebrew of “a double heart” is “with a heart” …'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בְּ/לֵ֖ב'
  - where: 'note 12:2 “Smooth lips, and a heart and a heart”'
    claim: '… “and a heart”: the noun (H3820) twice'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וָ/לֵ֣ב'
  - where: 'note 12:2 “Smooth lips, and a heart and a heart”'
    claim: 'The phrase is rendered “with a double heart”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3820.htm'
    quote: 'בלב ולב with a double heart Psalm 12:3'
  - where: 'note 12:2 “Smooth lips, and a heart and a heart”'
    claim: '1 Chronicles 12:33 (Hebrew 12:34) ends with the same pair, “heart and heart” (H3820 twice)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Chr.xml'
    quote: 'וָ/לֵֽב'
  - where: 'note 12:2 “Smooth lips, and a heart and a heart”'
