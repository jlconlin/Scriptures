chapter: 144
claims:
  # ---------- setting ----------
  - where: setting
    claim: 'The ancient Greek translation adds an occasion to the title: concerning Goliad'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/144.htm'
    quote: 'A Psalm of David concerning Goliad.'
  - where: setting
    claim: 'Delitzsch takes the psalm as meant to express what David felt entering the combat with Goliath'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/144.htm'
    quote: 'it was intended to express the feelings with which David entered upon the single-handed combat with Goliath'
  - where: setting
    claim: 'Delitzsch points to 1 Samuel 17:47 as the saying the psalm grew from'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/144.htm'
    quote: 'Read 1 Samuel 17:47. The Psalm has grown out of this utterance of David.'
  - where: setting
    claim: 'The Greek addition is found in only some copies, so it is a tradition and not the Hebrew title'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/144.htm'
    quote: 'the additional inscription of the lxx (according to Origen only "in a few copies")'
  - where: setting
    claim: 'The first strophe imitates Psalm 18'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/144.htm'
    quote: 'The whole of this first strophe is an imitation of David''s great song of thanksgiving, Psalm 18.'
  - where: setting
    claim: 'Psalm 18 has the line about hands taught to war'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'He teacheth my hands to war, so that a bow of steel is broken by mine arms.'
  - where: setting
    claim: 'Verse 3 varies Psalm 8:4 and verse 4 follows Psalm 39'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/144.htm'
    quote: 'Psalm 144:4 is just such another imitation, like a miniature of Psalm 39:6., Psalm 39:11'
  - where: setting
    claim: 'The new song and the ten-stringed instrument recall Psalm 33:2–3'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/144.htm'
    quote: 'The "new song" calls to mind Psalm 33:3; Psalm 40:4; and'
  - where: setting
    claim: 'Delitzsch: the language of verses 12–14 has no assignable earlier model'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/144.htm'
    quote: 'In Psalm 144:12-14 we hear a language that is altogether peculiar, without any assignable earlier model.'
  - where: setting
    claim: 'Psalm 33:12 has the line verse 15 returns to'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/33?lang=eng'
    quote: 'Blessed is the nation whose God is the Lord; and the people whom he hath chosen for his own inheritance.'

  # ---------- thread ----------
  - where: thread
    claim: 'What Psalm 18 celebrates as done is here made a prayer'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/144.htm'
    quote: 'The deeds of God which Psalm 18 celebrates are here made an object of prayer.'
  - where: thread
    claim: 'Delitzsch sums up verses 1–4: the LORD teaches the feeble mortal who is strong only in Him'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/144.htm'
    quote: 'me the feeble mortal, who am strong only in Him'
  - where: thread
    claim: 'Psalm 18 tells the bowing of the heavens and the sending from above in the past'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'He bowed the heavens also, and came down: and darkness was under his feet.'
  - where: thread
    claim: 'Verse 11 repeats verses 7–8 as a refrain'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/144.htm'
    quote: 'From the eminence of thanksgiving the song finally descends again to petition, Psalm 144:7-8, being repeated as a refrain.'
  - where: thread
    claim: '“Salvation” in verse 10 is victory'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: 'the one who gives victory to kings'

  # ---------- sections ----------
  - where: section 1 plain
    claim: '“My strength” is “my rock”; “teacheth” is trains'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: 'who trains my hands for war and my fingers for battle'
  - where: section 1 plain
    claim: '“My goodness” is rendered “My mercy” in the Greek'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/144.htm'
    quote: 'My mercy, and my refuge; my helper, and my deliverer'
  - where: section 2 plain
    claim: 'Verses 3–4: regard, think of; a breath, a passing shadow'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: 'their days are like a passing shadow.'
  - where: section 3 plain
    claim: 'Verses 6–8: flash lightning, rout, set free, foreigners, lies'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: 'set me free and rescue me from the mighty waters'
  - where: section 4 plain
    claim: 'Verses 9–11: ten-stringed harp, victory, cruel sword'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: 'upon a ten-stringed harp I will play to you'
  - where: section 5 plain
    claim: 'Verses 12–13: plants full grown, corner pillars, barns, fields'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: 'by tens of thousands in our fields'
  - where: section 5 plain
    claim: 'The oxen of verse 14 are “laden”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5445.htm'
    quote: 'laden, Psalm 144:14'

  # ---------- note 144:1 ----------
  - where: 'note 144:1 “The opening is Psalm 18 again”'
    claim: 'Psalm 18 by its title was sung after the LORD had delivered David from his enemies'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'in the day that the Lord delivered him from the hand of all his enemies'
  - where: 'note 144:1 “The opening is Psalm 18 again”'
    claim: 'Psalm 18:34 has “He teacheth my hands to war”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'He teacheth my hands to war, so that a bow of steel is broken by mine arms.'
  - where: 'note 144:1 “The opening is Psalm 18 again”'
    claim: 'Psalm 18:2 has fortress, deliverer, my strength and high tower'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'The Lord is my rock, and my fortress, and my deliverer; my God, my strength, in whom I will trust; my buckler, and the horn of my salvation, and my high tower.'
  - where: 'note 144:1 “The opening is Psalm 18 again”'
    claim: '“My strength” in 144:1 is tsur, rock (Strong’s 6697), with the first-person suffix'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'צוּרִ֗/י'
  - where: 'note 144:1 “The opening is Psalm 18 again”'
    claim: '“My strength” in 18:2 is the same word, tsur (Strong’s 6697)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'צ֭וּרִ/י'
  - where: 'note 144:1 “The opening is Psalm 18 again”'
    claim: 'A modern translation renders verse 1 “my rock”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: 'Blessed be the Lord, my rock,'
  - where: 'note 144:1 “The opening is Psalm 18 again”'
    claim: '“My goodness” is hesed (Strong’s 2617) with the first-person suffix, the word for mercy and lovingkindness'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חַסְדִּ֥/י'
  - where: 'note 144:1 “The opening is Psalm 18 again”'
    claim: 'The Hebrew of verse 2 is “my steadfast love”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: '144.2 Cn: Heb my steadfast love'
  - where: 'note 144:1 “The opening is Psalm 18 again”'
    claim: 'The Greek has “My mercy” for “My goodness”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/144.htm'
    quote: 'My mercy, and my refuge; my helper, and my deliverer'

  # ---------- note 144:2 ----------
  - where: 'note 144:2 “My people, or the peoples”'
    claim: 'Psalm 18:47 reads “subdueth the people under me”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'It is God that avengeth me, and subdueth the people under me.'
  - where: 'note 144:2 “My people, or the peoples”'
    claim: 'The Hebrew word in 18:47 is plural, peoples (Strong’s 5971)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'עַמִּ֣ים'
  - where: 'note 144:2 “My people, or the peoples”'
    claim: 'The Hebrew of 144:2 is “my people,” singular with the first-person suffix'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'עַמִּ֣/י'
  - where: 'note 144:2 “My people, or the peoples”'
    claim: 'The Greek agrees with “my people”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/144.htm'
    quote: 'who subdues my people under me.'
  - where: 'note 144:2 “My people, or the peoples”'
    claim: 'A modern translation prints “the peoples”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: 'who subdues the peoples under me.'
  - where: 'note 144:2 “My people, or the peoples”'
    claim: 'Its margin lists a Qumran manuscript, Hebrew manuscripts, the Syriac, Aquila and Jerome for “peoples,” against the Masoretic Text'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: '144.2 Q ms Heb mss Syr Aquila Jerome: MT my people'

  # ---------- note 144:3 ----------
  - where: 'note 144:3 “Psalm 8’s question, asked again”'
    claim: 'Psalm 8:4 asks the question'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/8?lang=eng'
    quote: 'What is man, that thou art mindful of him? and the son of man, that thou visitest him?'
  - where: 'note 144:3 “Psalm 8’s question, asked again”'
    claim: '“Vanity” in verse 4 is a breath'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: 'They are like a breath;'
  - where: 'note 144:3 “Psalm 8’s question, asked again”'
    claim: 'Psalm 39:5 calls every man altogether vanity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/39?lang=eng'
    quote: 'verily every man at his best state is altogether vanity.'
  - where: 'note 144:3 “Psalm 8’s question, asked again”'
    claim: 'Psalm 102:11 has the shadow'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/102?lang=eng'
    quote: 'My days are like a shadow that declineth; and I am withered like grass.'

  # ---------- note 144:5 ----------
  - where: 'note 144:5 “Psalm 18’s rescue, asked for again”'
    claim: 'Psalm 18:9 tells the bowing of the heavens as done'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'He bowed the heavens also, and came down: and darkness was under his feet.'
  - where: 'note 144:5 “Psalm 18’s rescue, asked for again”'
    claim: 'Psalm 18:14 has the arrows and lightnings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'Yea, he sent out his arrows, and scattered them; and he shot out lightnings, and discomfited them.'
  - where: 'note 144:5 “Psalm 18’s rescue, asked for again”'
    claim: 'Psalm 18:16 has the hand from above and the many waters'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'He sent from above, he took me, he drew me out of many waters.'
  - where: 'note 144:5 “Psalm 18’s rescue, asked for again”'
    claim: 'Delitzsch: the deeds Psalm 18 celebrates are here prayed for'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/144.htm'
    quote: 'The deeds of God which Psalm 18 celebrates are here made an object of prayer.'
  - where: 'note 144:5 “Psalm 18’s rescue, asked for again”'
    claim: 'Psalm 104:32 has the hills touched and smoking'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/104?lang=eng'
    quote: 'He looketh on the earth, and it trembleth: he toucheth the hills, and they smoke.'
  - where: 'note 144:5 “Psalm 18’s rescue, asked for again”'
    claim: 'Delitzsch takes the smoking mountains from Sinai'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/144.htm'
    quote: 'taken from the mountains that smoked at the giving of the Law'
  - where: 'note 144:5 “Psalm 18’s rescue, asked for again”'
    claim: 'Sinai smoked because the LORD descended on it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng'
    quote: 'And mount Sinai was altogether on a smoke, because the Lord descended upon it in fire'

  # ---------- note 144:8 ----------
  - where: 'note 144:8 “Foreigners whose word cannot be trusted”'
    claim: 'The phrase “sons of a foreign land” means foreigner, and stands in Psalm 18:44–45 (Hebrew 45–46) and 144:7, 11'
    key: bdb
    url: 'https://biblehub.com/hebrew/5236.htm'
    quote: '= foreigner Genesis 17:12'
  - where: 'note 144:8 “Foreigners whose word cannot be trusted”'
    claim: 'Psalm 18:44 calls them “the strangers”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'As soon as they hear of me, they shall obey me: the strangers shall submit themselves unto me.'
  - where: 'note 144:8 “Foreigners whose word cannot be trusted”'
    claim: 'Delitzsch: the enemies are sons of a foreign country, as in Psalm 18'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/144.htm'
    quote: 'The enemies are called sons of a foreign country, i.e., barbarians, as in Psalm 18:45.'
  - where: 'note 144:8 “Foreigners whose word cannot be trusted”'
    claim: 'Delitzsch: the psalm explains the figure of the waters'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/144.htm'
    quote: 'and the poet has added the interpretation to the figure here'
  - where: 'note 144:8 “Foreigners whose word cannot be trusted”'
    claim: 'A modern translation has “breath” in verse 4 and “lies” in verse 8'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: 'whose mouths speak lies'
  - where: 'note 144:8 “Foreigners whose word cannot be trusted”'
    claim: 'Delitzsch: the right hand of falsehood is the hand raised for a false oath'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/144.htm'
    quote: 'i.e., the hand raised for a false oath, are only found here'

  # ---------- note 144:10 ----------
  - where: 'note 144:10 “The king names himself”'
    claim: 'Psalm 18:50 names David in the third person'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'Great deliverance giveth he to his king; and sheweth mercy to his anointed, to David, and to his seed for evermore.'
  - where: 'note 144:10 “The king names himself”'
    claim: 'A modern translation ends verse 10 with David and begins verse 11 with the sword'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: 'who rescues his servant David.'
  - where: 'note 144:10 “The king names himself”'
    claim: 'Verse 11 in that translation begins with the cruel sword'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: 'Rescue me from the cruel sword,'

  # ---------- note 144:12 structure ----------
  - where: 'note 144:12 “From the king’s rescue to the people’s plenty”'
    claim: 'The Church’s chapter heading reads the prosperity as part of what David blesses the Lord for'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/144?lang=eng'
    quote: 'David blesses the Lord for deliverance and temporal prosperity'
  - where: 'note 144:12 “From the king’s rescue to the people’s plenty”'
    claim: 'A modern translation makes verse 12 a wish'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: 'May our sons in their youth'
  - where: 'note 144:12 “From the king’s rescue to the people’s plenty”'
    claim: 'The wish continues “be like plants full grown”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: 'be like plants full grown,'
  - where: 'note 144:12 “From the king’s rescue to the people’s plenty”'
    claim: 'The Greek reads “whose children” and “their daughters,” the foreigners’ prosperity'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/144.htm'
    quote: 'whose children are as plants, strengthened in their youth: their daughters are beautiful'

  # ---------- note 144:12 corner stones ----------
  - where: 'note 144:12 “Daughters like the corners of a palace”'
    claim: 'The word is “corner,” rendered corner-pillars carved in palace fashion'
    key: bdb
    url: 'https://biblehub.com/hebrew/2106.htm'
    quote: 'Psalm 144:12 out daughters like corner (-pillar)s, carved (so Che and others, but see II.'
  - where: 'note 144:12 “Daughters like the corners of a palace”'
    claim: 'The line ends “in palace-fashion”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2106.htm'
    quote: 'in palace-fashion.'
  - where: 'note 144:12 “Daughters like the corners of a palace”'
    claim: 'A modern translation: corner pillars cut for the building of a palace'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: 'our daughters like corner pillars,'
  - where: 'note 144:12 “Daughters like the corners of a palace”'
    claim: 'The modern translation continues “cut for the building of a palace”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: 'cut for the building of a palace.'
  - where: 'note 144:12 “Daughters like the corners of a palace”'
    claim: 'The Greek has the daughters adorned after the similitude of a temple'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/144.htm'
    quote: 'sumptuously adorned after the similitude of a temple.'

  # ---------- note 144:14 ----------
  - where: 'note 144:14 “No breach in the wall, and no one led out”'
    claim: '“Breaking in” is the noun for a breach in a wall, and BDB lists this verse under that sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/6556.htm'
    quote: 'breach in wall Amos 4:3; 1 Kings 11:27; Nehemiah 6:1; Psalm 144:14'
  - where: 'note 144:14 “No breach in the wall, and no one led out”'
    claim: 'A modern translation: no breach in the walls, no exile'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: 'May there be no breach in the walls, no exile,'
  - where: 'note 144:14 “No breach in the wall, and no one led out”'
    claim: 'It notes that the Hebrew lacks “in the walls”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: '144.14 Heb lacks in the walls'
  - where: 'note 144:14 “No breach in the wall, and no one led out”'
    claim: '“Complaining” is a cry of distress'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: 'and no cry of distress in our streets.'
  - where: 'note 144:14 “No breach in the wall, and no one led out”'
    claim: 'The oxen are “laden,” taken as pregnant by many and as a token of harvest by others'
    key: bdb
    url: 'https://biblehub.com/hebrew/5445.htm'
    quote: 'laden, Psalm 144:14 (i.e. pregnant Ges Hi Ew Hup-Now Che and others; perhaps better, token of abundant harvest'
  - where: 'note 144:14 “No breach in the wall, and no one led out”'
    claim: 'A modern translation: heavy with young'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20144&version=NRSVUE'
    quote: 'and may our cattle be heavy with young.'

  # ---------- note 144:15 ----------
  - where: 'note 144:15 “Two lines, the second greater”'
    claim: '“Happy” in verse 15 is ashre (Strong’s 835), the word of Psalm 1:1 and 33:12'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אַשְׁרֵ֣י'
  - where: 'note 144:15 “Two lines, the second greater”'
    claim: 'Psalm 33:12 has the earlier line'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/33?lang=eng'
    quote: 'Blessed is the nation whose God is the Lord; and the people whom he hath chosen for his own inheritance.'
  - where: 'note 144:15 “Two lines, the second greater”'
    claim: 'The Greek sets the two lines against each other'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/144.htm'
    quote: 'Men bless the people to whom this lot belongs, but blessed is the people whose God is the Lord.'
  - where: 'note 144:15 “Two lines, the second greater”'
    claim: 'Delitzsch: no antithesis, the second line exceeds the first'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/144.htm'
    quote: 'There is, however, no antithesis intended, but only an exceeding of the first declaration by the second.'
  - where: 'note 144:15 “Two lines, the second greater”'
    claim: 'Delitzsch: to call the Giver one’s God is more than material abundance'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/144.htm'
    quote: 'is still infinitely more than the richest abundance of material blessing'

  # ---------- christ ----------
  - where: christ
    claim: 'The LORD of the Old Testament is Jehovah, the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: christ
