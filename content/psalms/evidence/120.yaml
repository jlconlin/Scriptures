chapter: 120
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'The title of Psalm 120 is “A Song of degrees” and names no author'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/120?lang=eng'
    quote: 'A Song of degrees.'
  - where: setting
    claim: 'The fifteen psalms 120–134 are the songs of degrees'
    key: bd-degrees-songs-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/degrees-songs-of?lang=eng'
    quote: 'Fifteen Psalms (120–34), probably so called because they were sung by Jewish pilgrims on their way up to Jerusalem.'
  - where: setting
    claim: 'Psalm 122 is ascribed to David in its title (so are 124, 131 and 133, each page read)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/122?lang=eng'
    quote: 'A Song of degrees of David.'
  - where: setting
    claim: 'Psalm 124 is ascribed to David in its title'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/124?lang=eng'
    quote: 'A Song of degrees of David.'
  - where: setting
    claim: 'Psalm 131 is ascribed to David in its title'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/131?lang=eng'
    quote: 'A Song of degrees of David.'
  - where: setting
    claim: 'Psalm 133 is ascribed to David in its title'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/133?lang=eng'
    quote: 'A Song of degrees of David.'
  - where: setting
    claim: 'Psalm 127 is “for Solomon” in its title'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/127?lang=eng'
    quote: 'A Song of degrees for Solomon.'
  - where: setting
    claim: 'Delitzsch: the period of the writer is uncertain, and so whether his enemies were foreigners or fellow-countrymen'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/120.htm'
    quote: 'The period at which he lived is uncertain, and it is consequently also uncertain whether he had to endure such endless malignant attacks from foreign barbarians or from his own worldly-minded fellow-countrymen.'
  - where: setting
    claim: 'Delitzsch reports a proposal (Tilling) that sets these songs just after the return from exile, when neighbouring peoples opposed the colony'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/120.htm'
    quote: 'from the time immediately succeeding the Return from the Exile, when the secret and open hostility of the Samaritans and other neighbouring peoples … sought to keep down the rise of the young colony.'
  - where: setting
    claim: 'Psalm 121 opens by lifting the eyes to the hills'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/121?lang=eng'
    quote: 'I will lift up mine eyes unto the hills, from whence cometh my help.'
  - where: setting
    claim: 'Psalm 122 stands in the gates of Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/122?lang=eng'
    quote: 'Our feet shall stand within thy gates, O Jerusalem.'
  - where: setting
    claim: 'Psalm 134, the last of the fifteen, addresses those who stand by night in the house of the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/134?lang=eng'
    quote: 'all ye servants of the Lord, which by night stand in the house of the Lord.'

  # ---------- thread ----------
  - where: thread
    claim: 'Delitzsch: the psalm closes on the dissonance of peace and war, with the opening cry for help still over it'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/120.htm'
    quote: 'the Psalm closes; and the cry for help with which it opens hovers over it, earnestly desiring its removal.'
  - where: thread
    claim: 'Delitzsch: the petition of verse 2 is the substance of the psalm and appears to rest on a previous answer to prayer; the complaint behind it is described in verse 5'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/120.htm'
    quote: 'the poet appears to base his present petition, which from Psalm 120:2 onwards is the substance of the whole Psalm, upon the fact of a previous answering of his prayers.'

  # ---------- sections ----------
  - where: section 2 plain
    claim: 'A modern translation has a warrior’s arrows and coals of the broom tree in verse 4, and “what more shall be done” in verse 3'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20120&version=NRSVUE'
    quote: 'And what more shall be done to you,'
  - where: section 2 plain
    claim: 'The plant of verse 4 is a broom shrub'
    key: bdb
    url: 'https://biblehub.com/hebrew/7574.htm'
    quote: 'a kind of broom-shrub, broom-plant, retem'
  - where: section 3 plain
    claim: 'A modern translation has “alien in Meshech,” “too long” and “those who hate peace” in verses 5–6'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20120&version=NRSVUE'
    quote: 'Woe is me, that I am an alien in Meshech'

  # ---------- note 120:0 ----------
  - where: 'note 120:0 “A song for the way up to Jerusalem”'
    claim: 'The Bible Dictionary: the fifteen psalms were probably so called because pilgrims sang them going up to Jerusalem'
    key: bd-degrees-songs-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/degrees-songs-of?lang=eng'
    quote: 'Fifteen Psalms (120–34), probably so called because they were sung by Jewish pilgrims on their way up to Jerusalem.'
  - where: 'note 120:0 “A song for the way up to Jerusalem”'
    claim: 'The Hebrew of the title is “a song of the ascents,” the noun ma‘alot'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/120-1.htm'
    quote: 'of the Ascents'
  - where: 'note 120:0 “A song for the way up to Jerusalem”'
    claim: 'The noun means step or stair; it is used of the steps of the temple and of the throne'
    key: bdb
    url: 'https://biblehub.com/hebrew/4609.htm'
    quote: 'noun feminine step, stair'
  - where: 'note 120:0 “A song for the way up to Jerusalem”'
    claim: 'The same noun is the steps of the temple and of Solomon’s throne'
    key: bdb
    url: 'https://biblehub.com/hebrew/4609.htm'
    quote: 'of throne 1 Kings 10:19,20'
  - where: 'note 120:0 “A song for the way up to Jerusalem”'
    claim: 'The same noun is the steps of the sundial in 2 Kings 20:9–11 and Isaiah 38:8, where the King James has “degrees”'
    key: bdb
    url: 'https://biblehub.com/hebrew/4609.htm'
    quote: '2 steps (forming sun-dial'
  - where: 'note 120:0 “A song for the way up to Jerusalem”'
    claim: 'The same noun is Ezra’s ascent from Babylon in Ezra 7:9'
    key: bdb
    url: 'https://biblehub.com/hebrew/4609.htm'
    quote: 'Ezra 7:9'
  - where: 'note 120:0 “A song for the way up to Jerusalem”'
    claim: 'BDB reads the title as a song of ascents to the three pilgrim feasts, sung on the way up to Jerusalem'
    key: bdb
    url: 'https://biblehub.com/hebrew/4609.htm'
    quote: 'song of ascents, to the three great pilgrim feasts, i.e. to be sung on way up to Jerusalem, titles of Psalm 120-134'
  - where: 'note 120:0 “A song for the way up to Jerusalem”'
    claim: 'Ezra 7:9 speaks of Ezra beginning to go up from Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/7?lang=eng'
    quote: 'For upon the first day of the first month began he to go up from Babylon'
  - where: 'note 120:0 “A song for the way up to Jerusalem”'
    claim: 'Jewish writers relate that the psalms were sung on fifteen steps between two courts of the temple, an explanation the manual’s source calls exploded (as the Student Manual prints its source)'
    key: ot-manual-psalms
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/the-psalms-songs-from-the-heart-of-israel?lang=eng'
    quote: 'Jewish writers relate … that these Psalms were sung on fifteen steps, leading from the court of Israel to the court of the women. This explanation is now exploded.'
  - where: 'note 120:0 “A song for the way up to Jerusalem”'
    claim: 'The manual’s source calls the pilgrim-song explanation the most prevalent and probable, and notes that journeys to Jerusalem are called ascents'
    key: ot-manual-psalms
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/the-psalms-songs-from-the-heart-of-israel?lang=eng'
    quote: 'According to the most prevalent and probable opinion, the title signifies song of the ascents, or pilgrim song, meaning a song composed for, or sung during the journeying of the people up to Jerusalem'
  - where: 'note 120:0 “A song for the way up to Jerusalem”'
    claim: 'Psalms 120–134 are often called pilgrim songs'
    key: larsen-ascending-hill
    url: 'https://journal.interpreterfoundation.org/ascending-into-the-hill-of-the-lord-what-the-psalms-can-tell-us-about-the-rituals-of-the-first-temple/'
    quote: 'These are also frequently designated as “pilgrim songs.”'
  - where: 'note 120:0 “A song for the way up to Jerusalem”'
    claim: 'The Law required appearing before the Lord three times a year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'Three times in the year all thy males shall appear before the Lord God.'
  - where: 'note 120:0 “A song for the way up to Jerusalem”'
    claim: 'Psalm 122:4 speaks of the tribes going up to Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/122?lang=eng'
    quote: 'Whither the tribes go up, the tribes of the Lord'

  # ---------- note 120:1 ----------
  - where: 'note 120:1 “A cry already answered, or one still waiting”'
    claim: 'The Greek translation has verse 1 in the past'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/120.htm'
    quote: 'In mine affliction I cried to the Lord, and he hearkened to me.'
  - where: 'note 120:1 “A cry already answered, or one still waiting”'
    claim: 'A modern translation makes verse 1 present and prints verse 2 as the words of the cry'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20120&version=NRSVUE'
    quote: 'In my distress I cry to the Lord,'
  - where: 'note 120:1 “A cry already answered, or one still waiting”'
    claim: 'The same translation: “that he may answer me”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20120&version=NRSVUE'
    quote: 'that he may answer me:'
  - where: 'note 120:1 “A cry already answered, or one still waiting”'
    claim: 'Jonah 2:2 has nearly the same sentence, spoken out of the belly of hell'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/2?lang=eng'
    quote: 'I cried by reason of mine affliction unto the Lord, and he heard me; out of the belly of hell cried I, and thou heardest my voice.'
  - where: 'note 120:1 “A cry already answered, or one still waiting”'
    claim: 'The modern translation’s cross-references at verse 1 name Jonah 2:2'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20120&version=NRSVUE'
    quote: '120.1 : Ps 102.2; Jon 2.2'

  # ---------- note 120:4 ----------
  - where: 'note 120:4 “Arrows and broom coals for the false tongue”'
    claim: 'A modern translation prints verse 4 as the reply to verse 3, with a warrior and the broom tree'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20120&version=NRSVUE'
    quote: 'with glowing coals of the broom tree!'
  - where: 'note 120:4 “Arrows and broom coals for the false tongue”'
    claim: 'The same translation: “A warrior’s sharp arrows”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20120&version=NRSVUE'
    quote: 'A warrior’s sharp arrows,'
  - where: 'note 120:4 “Arrows and broom coals for the false tongue”'
    claim: 'The King James’s “juniper” is a broom shrub, the plant of 1 Kings 19:4–5 and Psalm 120:4'
    key: bdb
    url: 'https://biblehub.com/hebrew/7574.htm'
    quote: 'a kind of broom-shrub, broom-plant, retem'
  - where: 'note 120:4 “Arrows and broom coals for the false tongue”'
    claim: 'Elijah sat down under a juniper tree in the wilderness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/19?lang=eng'
    quote: 'went a day’s journey into the wilderness, and came and sat down under a juniper tree'
  - where: 'note 120:4 “Arrows and broom coals for the false tongue”'
    claim: 'Psalm 57:4 calls the enemies’ tongue a sharp sword'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/57?lang=eng'
    quote: 'whose teeth are spears and arrows, and their tongue a sharp sword.'
  - where: 'note 120:4 “Arrows and broom coals for the false tongue”'
    claim: 'Psalm 64:3 calls bitter words arrows, and 64:7 has God shoot an arrow at those who spoke them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/64?lang=eng'
    quote: 'But God shall shoot at them with an arrow; suddenly shall they be wounded.'
  - where: 'note 120:4 “Arrows and broom coals for the false tongue”'
    claim: 'Psalm 140:9–10 asks that the mischief of their own lips cover the enemies and that burning coals fall on them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/140?lang=eng'
    quote: 'Let burning coals fall upon them: let them be cast into the fire'

  # ---------- note 120:5 ----------
  - where: 'note 120:5 “Two peoples no one could live among at once”'
    claim: 'The Church’s footnote on “Mesech” points to Meshech in Genesis 10:2 and Ezekiel 27:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/120?lang=eng'
    quote: 'Gen. 10:2; Ezek. 27:13.'
  - where: 'note 120:5 “Two peoples no one could live among at once”'
    claim: 'Meshech is a son of Japheth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/10?lang=eng'
    quote: 'The sons of Japheth; Gomer, and Magog, and Madai, and Javan, and Tubal, and Meshech, and Tiras.'
  - where: 'note 120:5 “Two peoples no one could live among at once”'
    claim: 'Meshech trades slaves and bronze vessels with Tyre'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/27?lang=eng'
    quote: 'Javan, Tubal, and Meshech, they were thy merchants: they traded the persons of men and vessels of brass in thy market.'
  - where: 'note 120:5 “Two peoples no one could live among at once”'
    claim: 'Gog is chief prince of Meshech and Tubal, and comes out of the north parts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/38?lang=eng'
    quote: 'And thou shalt come from thy place out of the north parts, thou, and many people with thee'
  - where: 'note 120:5 “Two peoples no one could live among at once”'
    claim: 'Delitzsch places the people of Meshech between the Black and Caspian Seas and says no one could dwell among them and Kedar at once'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/120.htm'
    quote: 'dwelt between the Black and the Caspian Seas, and it is impossible to dwell among them and the inhabitants of Kedar'
  - where: 'note 120:5 “Two peoples no one could live among at once”'
    claim: 'Delitzsch takes both names emblematically'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/120.htm'
    quote: 'Accordingly both these names of peoples are to be understood emblematically'
  - where: 'note 120:5 “Two peoples no one could live among at once”'
    claim: 'Delitzsch: rough and quarrelsome people have surrounded the poet too long'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/120.htm'
    quote: 'These rough and quarrelsome characters have surrounded the poet'
  - where: 'note 120:5 “Two peoples no one could live among at once”'
    claim: 'Delitzsch leaves open whether the enemies were foreigners or fellow-countrymen'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/120.htm'
    quote: 'it is consequently also uncertain whether he had to endure such endless malignant attacks from foreign barbarians or from his own worldly-minded fellow-countrymen'
  - where: 'note 120:5 “Two peoples no one could live among at once”'
    claim: 'Kedar is a son of Ishmael'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/25?lang=eng'
    quote: 'the firstborn of Ishmael, Nebajoth; and Kedar, and Adbeel, and Mibsam'
  - where: 'note 120:5 “Two peoples no one could live among at once”'
    claim: 'Kedar is named under the burden upon Arabia, with its archers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/21?lang=eng'
    quote: 'And the residue of the number of archers, the mighty men of the children of Kedar, shall be diminished'
  - where: 'note 120:5 “Two peoples no one could live among at once”'
    claim: 'Isaiah 21:13 heads the passage “The burden upon Arabia”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/21?lang=eng'
    quote: 'The burden upon Arabia.'
  - where: 'note 120:5 “Two peoples no one could live among at once”'
    claim: 'Jeremiah 49:28 counts Kedar among the men of the east; the Church’s footnote on “tents” points to Jeremiah 49:28–29'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/49?lang=eng'
    quote: 'Arise ye, go up to Kedar, and spoil the men of the east.'

  # ---------- explore / parallels ----------
  - where: explore
    claim: 'Psalm 64 answers arrows of bitter words with an arrow from God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/64?lang=eng'
    quote: 'Who whet their tongue like a sword, and bend their bows to shoot their arrows, even bitter words'
  - where: parallels
    claim: 'Jonah 2:2 nearly repeats verse 1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/2?lang=eng'
    quote: 'I cried by reason of mine affliction unto the Lord, and he heard me'
