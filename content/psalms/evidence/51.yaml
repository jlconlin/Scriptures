chapter: 51
claims:
  # ---- when / setting ----
  - where: 'when'
    claim: 'The psalm’s title, as the Church’s edition prints it above the psalm'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/51?lang=eng'
    quote: 'To the chief Musician, A Psalm of David, when Nathan the prophet came unto him, after he had gone in to Bath-sheba.'
  - where: 'setting'
    claim: 'The title'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/51?lang=eng'
    quote: 'To the chief Musician, A Psalm of David, when Nathan the prophet came unto him, after he had gone in to Bath-sheba.'
  - where: 'setting'
    claim: 'The psalm is attributed to David and believed to have been written sometime after Nathan’s rebuke'
    key: scripture-helps-ps-49
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/33-psalms-49-51-61-66-69-72-77-78-85-86?lang=eng'
    quote: 'Psalm 51 is attributed to David. It is believed to have been written sometime after Nathan rebuked David for his sin against Bathsheba and the arranged death of her husband, Uriah.'
  - where: 'setting'
    claim: 'The story: David lay with Bathsheba, she conceived, and he arranged Uriah’s death (chapter heading of 2 Samuel 11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/11?lang=eng'
    quote: 'David lies with Bathsheba, and she conceives'
  - where: 'setting'
    claim: 'David took her as his wife, and the thing displeased the Lord (2 Sam. 11:27)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/11?lang=eng'
    quote: 'David sent and fetched her to his house, and she became his wife, and bare him a son. But the thing that David had done displeased the Lord.'
  - where: 'setting'
    claim: 'Uriah is “the Hittite,” and Nathan charges David with killing him and taking his wife (2 Sam. 12:9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'thou hast killed Uriah the Hittite with the sword, and hast taken his wife to be thy wife'
  - where: 'setting'
    claim: 'Nathan’s parable of the poor man’s one ewe lamb (2 Sam. 12:3 and the chapter heading)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'But the poor man had nothing, save one little ewe lamb'
  - where: 'setting'
    claim: 'David passes sentence on the rich man before Nathan names him (2 Sam. 12:5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'the man that hath done this thing shall surely die'
  - where: 'setting'
    claim: 'In the Hebrew title Nathan’s coming is the verb bo (H935), an infinitive'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בְּֽ/בוֹא'
  - where: 'setting'
    claim: 'David’s going in to Bathsheba is the same verb bo (H935) in the title'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בָּ֝֗א'
  - where: 'setting'
    claim: 'Psalm 51 is known as a penitential psalm, a psalm of repentance'
    key: sc-knowhy-325
    url: 'https://scripturecentral.org/knowhy/why-did-lehi-quote-from-a-psalm-of-repentance-in-his-dream'
    quote: 'Psalm 51 is known as a penitential psalm, a psalm of repentance, and is traditionally associated with King David’s plea to God for mercy and forgiveness after the Bathsheba incident'
  - where: 'setting'
    claim: 'Psalm 32 is tied to the same fall'
    key: bd-david
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/david?lang=eng'
    quote: 'David’s fall gave occasion to Ps. 51 and 32.'
  - where: 'setting'
    claim: 'Paul quotes verse 4 (Rom. 3:4)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/3?lang=eng'
    quote: 'as it is written, That thou mightest be justified in thy sayings, and mightest overcome when thou art judged.'
  - where: 'setting'
    claim: 'Lehi prays the words of verse 1 in his dream'
    key: sc-knowhy-325
    url: 'https://scripturecentral.org/knowhy/why-did-lehi-quote-from-a-psalm-of-repentance-in-his-dream'
    quote: 'Psalm 51:1 from the Old Testament is very similar to this prayer of Lehi.'
  - where: 'setting'
    claim: 'The risen Lord asks the offering of verse 17 of all (3 Ne. 9:20)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'And ye shall offer for a sacrifice unto me a broken heart and a contrite spirit.'

  # ---- thread ----
  - where: 'thread'
    claim: '“Blot out” (machah, H4229) is in verse 1 and again closes verse 9: hebrew.mjs psalms --word 4229 lists Ps 51:1 and 51:9; this is the form in verse 9'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מְחֵֽה'
  - where: 'thread'
    claim: '“Wash” (kabas, H3526) of verse 2 returns in verse 7'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תְּ֝כַבְּסֵ֗/נִי'
  - where: 'thread'
    claim: 'The first part closes by returning to the language of the opening'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/51.htm'
    quote: 'Here the first part of the Psalm closes; the close recurs to the language of the opening'
  - where: 'thread'
    claim: 'The prayer for forgiveness is followed by a prayer for renewing, beginning at verse 10'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/51.htm'
    quote: 'In the second part, the prayer for justification is followed by the prayer for renewing.'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Lovingkindness” as steadfast love and “tender mercies” as abundant mercy; “throughly” as thoroughly'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2051&version=NRSVUE'
    quote: 'according to your steadfast love;'
  - where: 'section 2 plain'
    claim: '“Acknowledge” is “know”; “justified when thou speakest”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2051&version=NRSVUE'
    quote: '3 For I know my transgressions,'
  - where: 'section 3 plain'
    claim: 'The bones God has “broken” are bones He has crushed'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2051&version=NRSVUE'
    quote: 'let the bones that you have crushed rejoice.'
  - where: 'section 4 plain'
    claim: '“Presence” is the word for face (panim, H6440)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מִ/לְּ/פָנֶ֑י/ךָ'
  - where: 'section 4 plain'
    claim: '“Free spirit” is a willing spirit; “right” is steadfast'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2051&version=NRSVUE'
    quote: 'and sustain in me a willing spirit.'
  - where: 'section 5 plain'
    claim: '“Bloodguiltiness” is the guilt of bloodshed'
    key: bdb
    url: 'https://biblehub.com/hebrew/1818.htm'
    quote: 'guilt of bloodshed, blood-guiltiness'
  - where: 'section 5 plain'
    claim: '“Converted” is “return” (shub); a contrite heart is a crushed one'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2051&version=NRSVUE'
    quote: 'and sinners will return to you.'
  - where: 'section 5 plain'
    claim: '“Contrite” (dakah, niphal) is be crushed, broken'
    key: bdb
    url: 'https://biblehub.com/hebrew/1794.htm'
    quote: 'be crushed, broken, of physical distress'

  # ---- note 51:1 ----
  - where: 'note 51:1 “Hesed, the ground of the plea”'
    claim: '“Lovingkindness” in verse 1 is hesed (H2617)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'כְּ/חַסְדֶּ֑/ךָ'
  - where: 'note 51:1 “Hesed, the ground of the plea”'
    claim: 'President Nelson: hesed is the covenantal love'
    key: nelson-everlasting-covenant
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/10/04-the-everlasting-covenant?lang=eng'
    quote: 'Hesed is a special kind of love and mercy that God feels for and extends to those who have made a covenant with Him.'
  - where: 'note 51:1 “Hesed, the ground of the plea”'
    claim: 'President Nelson: because of hesed God forgives those who repent and helps those who stray'
    key: nelson-everlasting-covenant
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/10/04-the-everlasting-covenant?lang=eng'
    quote: 'He will forgive them when they repent. And should they stray, He will help them find their way back to Him.'
  - where: 'note 51:1 “Hesed, the ground of the plea”'
    claim: 'President Nelson calls hesed covenantal love'
    key: nelson-everlasting-covenant
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/10/04-the-everlasting-covenant?lang=eng'
    quote: 'In the Hebrew language, that covenantal love is called hesed'
  - where: 'note 51:1 “Hesed, the ground of the plea”'
    claim: 'The lexicon lists Ps 51:1 (Hebrew 51:3) under God’s hesed in redemption from sin'
    key: bdb
    url: 'https://biblehub.com/hebrew/2617.htm'
    quote: 'in redemption from sin Psalm 25:7; Psalm 51:3.'
  - where: 'note 51:1 “Hesed, the ground of the plea”'
    claim: 'The lexicon lists 2 Sam. 7:15 under God’s hesed in keeping covenant with David and his dynasty'
    key: bdb
    url: 'https://biblehub.com/hebrew/2617.htm'
    quote: 'with David and his dynasty 2 Samuel 7:15'
  - where: 'note 51:1 “Hesed, the ground of the plea”'
    claim: '“My mercy” in 2 Sam. 7:15 is hesed (H2617)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'וְ/חַסְדִּ֖/י'
  - where: 'note 51:1 “Hesed, the ground of the plea”'
    claim: 'The promise of 2 Samuel 7 came to David through Nathan (chapter heading; verses 4 and 17)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'According to all these words, and according to all this vision, so did Nathan speak unto David.'
  - where: 'note 51:1 “Hesed, the ground of the plea”'
    claim: '“Tender mercies” is rachamim (H7356), a different word'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'רַ֝חֲמֶ֗י/ךָ'
  - where: 'note 51:1 “Hesed, the ground of the plea”'
    claim: 'Rachamim is compassion, usually God’s'
    key: bdb
    url: 'https://biblehub.com/hebrew/7356.htm'
    quote: 'compassion: usually of God'
  - where: 'note 51:1 “Hesed, the ground of the plea”'
    claim: '1 Ne. 8:8 and Ps. 51:1 are the only verses that join the plea for mercy to “the multitude of … tender mercies”'
    key: sc-knowhy-325
    url: 'https://scripturecentral.org/knowhy/why-did-lehi-quote-from-a-psalm-of-repentance-in-his-dream'
    quote: 'these two passages are the only ones which contain in the same verse both “have mercy upon/on me” and “according unto the multitude of thy/his tender mercies.”'
  - where: 'note 51:1 “Hesed, the ground of the plea”'
    claim: 'It seems very likely that Lehi or Nephi had Psalm 51 in mind'
    key: sc-knowhy-325
    url: 'https://scripturecentral.org/knowhy/why-did-lehi-quote-from-a-psalm-of-repentance-in-his-dream'
    quote: 'It seems very likely that either Lehi, in his retelling of his dream, or Nephi, in his abridgment of his father’s record, had Psalm 51 in mind.'
  - where: 'note 51:1 “Hesed, the ground of the plea”'
    claim: 'Lehi’s dream places the prayer in a dark and dreary waste'
    key: sc-knowhy-325
    url: 'https://scripturecentral.org/knowhy/why-did-lehi-quote-from-a-psalm-of-repentance-in-his-dream'
    quote: 'he suddenly found himself “in a dark and dreary waste” (1 Nephi 8:7)'

  # ---- note 51:2 ----
  - where: 'note 51:2 “Three pictures of one request”'
    claim: '“Blot out”: transgressions no more remembered by God against the sinner'
    key: bdb
    url: 'https://biblehub.com/hebrew/4229.htm'
    quote: 'transgressions (פשׁע; no more remembered by God against sinner) Psalm 51:3'
  - where: 'note 51:2 “Three pictures of one request”'
    claim: '“Blot out” is to obliterate from the memory'
    key: bdb
    url: 'https://biblehub.com/hebrew/4229.htm'
    quote: 'blot out = obliterate from the memory'
  - where: 'note 51:2 “Three pictures of one request”'
    claim: '“Wash” (kabas) is ordinarily to wash garments by treading'
    key: bdb
    url: 'https://biblehub.com/hebrew/3526.htm'
    quote: 'wash garments (i.e. by treading)'
  - where: 'note 51:2 “Three pictures of one request”'
    claim: 'Kabas of washing a person is only in poetry and figurative, with Ps. 51:2 and 51:7 (Hebrew 51:4, 9)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3526.htm'
    quote: 'wash person, only in poetry and figurative'
  - where: 'note 51:2 “Three pictures of one request”'
    claim: '“Cleanse” (taher) is the verb for being made clean from all sins by the Day of Atonement sin offering (Lev. 16:30); the same entry lists Ps. 51:2 (Hebrew 51:4)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2891.htm'
    quote: 'Leviticus 16:30 (P; by the sin-offering of the atonement day)'
  - where: 'note 51:2 “Three pictures of one request”'
    claim: '“Wash” in verse 2 is kabas (H3526)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'כַּבְּסֵ֣/נִי'
  - where: 'note 51:2 “Three pictures of one request”'
    claim: '“Cleanse” in verse 2 is taher (H2891), which returns as “I shall be clean” in verse 7 (hebrew.mjs psalms --word 2891 lists Ps 51:2 and 51:7)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'טַהֲרֵֽ/נִי'
  - where: 'note 51:2 “Three pictures of one request”'
    claim: '“Blot out” returns at the end of verse 9 (H4229)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מְחֵֽה'
  - where: 'note 51:2 “Three pictures of one request”'
    claim: '“Throughly” is thoroughly'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2051&version=NRSVUE'
    quote: '2 Wash me thoroughly from my iniquity,'

  # ---- note 51:4 ----
  - where: 'note 51:4 “Against thee only, with Uriah dead”'
    claim: '“Sinned” in Ps. 51:4 is chata (H2398), first person'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חָטָאתִי֮'
  - where: 'note 51:4 “Against thee only, with Uriah dead”'
    claim: 'David’s “I have sinned” in 2 Sam. 12:13 is the same verb and form'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'חָטָ֖אתִי'
  - where: 'note 51:4 “Against thee only, with Uriah dead”'
    claim: 'Nathan’s charge in 2 Sam. 12:9, “to do evil in his sight,” has “the evil” (ha-ra, H7451) with “do” (H6213) and “in the eyes of” (H5869)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'הָ/רַע֮'
  - where: 'note 51:4 “Against thee only, with Uriah dead”'
    claim: 'Ps. 51:4 has the same three words: “the evil” (H7451), “in thy eyes” (H5869), “I have done” (H6213)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בְּ/עֵינֶ֗י/ךָ'
  - where: 'note 51:4 “Against thee only, with Uriah dead”'
    claim: 'The lexicon lists 2 Sam. 12:13 and Ps. 51:4 (Hebrew 51:6) together as confessions, “I have sinned against”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2398.htm'
    quote: '2 Samuel 12:13 Psalm 41:5; Psalm 51:6'
  - where: 'note 51:4 “Against thee only, with Uriah dead”'
    claim: 'One reading: true consciousness of sin sees all sin, in its ultimate ground, as against God alone'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/51.htm'
    quote: 'directly as sin against God, and in its ultimate ground as sin against Him alone'
  - where: 'note 51:4 “Against thee only, with Uriah dead”'
    claim: 'Because every human relation is the form of the relation to God, the sole Lawgiver and Judge'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/51.htm'
    quote: 'it is contradiction to the will of God, the sole and highest Lawgiver and Judge'
  - where: 'note 51:4 “Against thee only, with Uriah dead”'
    claim: 'The confession aims at God’s being shown just in His sentence, as David says Amen to Nathan’s'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/51.htm'
    quote: 'he must himself say Amen to the divine sentence, just as David does to that passed upon him by Nathan'
  - where: 'note 51:4 “Against thee only, with Uriah dead”'
    claim: 'Paul’s wording in Rom. 3:4 is that of the Greek translation of the psalm'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/51.htm'
    quote: 'that thou mightest be justified in thy sayings, and mightest overcome when thou art judged.'
  - where: 'note 51:4 “Against thee only, with Uriah dead”'
    claim: 'Rom. 3:4: God true, every man a liar, with the quotation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/3?lang=eng'
    quote: 'God forbid: yea, let God be true, but every man a liar; as it is written, That thou mightest be justified in thy sayings, and mightest overcome when thou art judged.'
  - where: 'note 51:4 “Against thee only, with Uriah dead”'
    claim: 'Joseph speaks of sin with his master’s wife as sin against God (Gen. 39:9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/39?lang=eng'
    quote: 'because thou art his wife: how then can I do this great wickedness, and sin against God?'

  # ---- note 51:7 ----
  - where: 'note 51:7 “Hyssop, the leper, and the touch of the dead”'
    claim: 'Hyssop was a kind of wild marjoram, used at Passover, for sprinkling in the purification of lepers, and in the red heifer rite'
    key: bd-hyssop
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hyssop?lang=eng'
    quote: 'A kind of wild marjoram, used at the Passover (Ex. 12:22); for sprinkling purposes in the purification of lepers (Lev. 14:4, 51) and in the sacrifice of the red heifer'
  - where: 'note 51:7 “Hyssop, the leper, and the touch of the dead”'
    claim: 'Hyssop is a little plant; a bunch of it sprinkled blood on the doorposts'
    key: bdb
    url: 'https://biblehub.com/hebrew/231.htm'
    quote: 'a bunch of h. for sprinkling blood on doorposts'
  - where: 'note 51:7 “Hyssop, the leper, and the touch of the dead”'
    claim: '“Hyssop” in verse 7 is ezob (H231)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בְ/אֵז֣וֹב'
  - where: 'note 51:7 “Hyssop, the leper, and the touch of the dead”'
    claim: '“Purge” is the verb chata, to sin (H2398), in the piel'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תְּחַטְּאֵ֣/נִי'
  - where: 'note 51:7 “Hyssop, the leper, and the touch of the dead”'
    claim: 'In that form the verb means to purify from uncleanness; the lexicon lists the leper’s house, the red heifer rite, and Ps. 51:7 (Hebrew 51:9) together'
    key: bdb
    url: 'https://biblehub.com/hebrew/2398.htm'
    quote: 'the house of the leper by application of the mixture of living water and blood of the bird Leviticus 14:49,52 (P); a person, by application of then mixture of living water and ashes of the red heifer Numbers 19:19 (P), by sprinkling with a hyssop spring Psalm 51:9.'
  - where: 'note 51:7 “Hyssop, the leper, and the touch of the dead”'
    claim: 'In Num. 19:18 a clean person does the sprinkling with hyssop'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/19?lang=eng'
    quote: 'And a clean person shall take hyssop, and dip it in the water, and sprinkle it upon the tent'
  - where: 'note 51:7 “Hyssop, the leper, and the touch of the dead”'
    claim: 'In the leper’s rite the priest uses the hyssop (Lev. 14:6, 51)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/14?lang=eng'
    quote: 'he shall take it, and the cedar wood, and the scarlet, and the hyssop, and shall dip them and the living bird in the blood of the bird that was killed over the running water'
  - where: 'note 51:7 “Hyssop, the leper, and the touch of the dead”'
    claim: 'David had killed Uriah (2 Sam. 12:9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'thou hast killed Uriah the Hittite with the sword'

  # ---- note 51:10 ----
  - where: 'note 51:10 “Create is the verb of Genesis 1”'
    claim: '“Create” in verse 10 is bara (H1254), imperative'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בְּרָא'
  - where: 'note 51:10 “Create is the verb of Genesis 1”'
    claim: 'Bara is the verb of Gen. 1:1 and is used always of divine activity'
    key: bdb
    url: 'https://biblehub.com/hebrew/1254.htm'
    quote: 'Qal Perfect Genesis 1:1 19t.'
  - where: 'note 51:10 “Create is the verb of Genesis 1”'
    claim: 'Bara is always of divine activity'
    key: bdb
    url: 'https://biblehub.com/hebrew/1254.htm'
    quote: 'shape, fashion, create, always of divine activity'
