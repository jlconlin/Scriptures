chapter: 7
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'The title ascribes the psalm to David and names its occasion, the words of Cush the Benjamite'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/7?lang=eng'
    quote: 'Shiggaion of David, which he sang unto the Lord, concerning the words of Cush the Benjamite.'
  - where: setting
    claim: 'The psalm presents David pleading for deliverance from the false accusations of Cush'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Psalm 7 presents the psalmist, David, pleading with the Lord to deliver him from the false accusations of Cush the Benjamite (Benjaminite).'
  - where: setting
    claim: 'The occasion is not recorded elsewhere; David’s recorded conflicts with Benjamites are in 1 Samuel 24–26 and 2 Samuel 16 and 20'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Although this story is not included elsewhere in the biblical record, David does have a number of documented conflicts with Benjaminites in 1 Samuel 24–26 and 2 Samuel 16, 20, and others.'
  - where: setting
    claim: 'Saul was a Benjamite'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/9?lang=eng'
    quote: 'And Saul answered and said, Am not I a Benjamite, of the smallest of the tribes of Israel?'
  - where: setting
    claim: 'In 1 Samuel 24 and 26 David spares Saul’s life'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/26?lang=eng'
    quote: 'David again spares Saul’s life'
  - where: setting
    claim: 'In 1 Samuel 24 David appeals to the Lord as judge between himself and Saul'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/24?lang=eng'
    quote: 'The Lord therefore be judge, and judge between me and thee, and see, and plead my cause, and deliver me out of thine hand.'
  - where: setting
    claim: 'One older commentary finds the psalm full of references to the time of 1 Samuel 24–26'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/7.htm'
    quote: 'One need only read 1 Samuel 24-26 to see how this Psalm abounds in unmistakeable references to this portion of David'
  - where: setting
    claim: 'Jeremiah prays to the Lord who tries the reins and the heart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/11?lang=eng'
    quote: 'But, O Lord of hosts, that judgest righteously, that triest the reins and the heart, let me see thy vengeance on them: for unto thee have I revealed my cause.'
  - where: setting
    claim: 'In Revelation 2 the Son of God says that He searches the reins and hearts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/2?lang=eng'
    quote: 'all the churches shall know that I am he which searcheth the reins and hearts'
  - where: setting
    claim: 'Nephi’s prophecy has the image of falling into the pit one has dug'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/22?lang=eng'
    quote: 'they shall fall into the pit which they digged to ensnare the people of the Lord'

  # ---------- thread ----------
  - where: thread
    claim: '“My righteousness” in verse 8 is the Hebrew noun tsedeq with “my”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'כְּ/צִדְקִ֖/י'
  - where: thread
    claim: '“His righteousness” in verse 17 is the same noun with “his”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'כְּ/צִדְק֑/וֹ'
  - where: thread
    claim: 'In verse 11 the Hebrew has “judge” followed by “righteous”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שׁוֹפֵ֣ט'
  - where: thread
    claim: 'A modern translation renders verse 11 “God is a righteous judge”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%207&version=NRSVUE'
    quote: 'God is a righteous judge'

  # ---------- sections ----------
  - where: section 1 plain
    claim: '“Put my trust” can be rendered “take refuge”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%207&version=NRSVUE'
    quote: 'O Lord my God, in you I take refuge;'
  - where: section 3 plain
    claim: 'Verse 7 rendered with the peoples assembled and the Lord taking His seat above them'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%207&version=NRSVUE'
    quote: 'and over it take your seat on high.'
  - where: section 4 plain
    claim: '“My defence” in verse 10 is “my shield”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%207&version=NRSVUE'
    quote: 'God is my shield,'
  - where: section 4 plain
    claim: 'Verse 11 rendered “a righteous judge” and a God who has indignation every day'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%207&version=NRSVUE'
    quote: 'and a God who has indignation every day.'
  - where: section 4 plain
    claim: 'Verse 12 rendered with the sinner as the one who does not repent and God as the one who whets the sword'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%207&version=NRSVUE'
    quote: 'If one does not repent, God will whet his sword;'

  # ---------- note 7:0 Shiggaion ----------
  - where: 'note 7:0 “Shiggaion”'
    claim: 'The first word of the Hebrew title is shiggaion'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שִׁגָּי֗וֹן'
  - where: 'note 7:0 “Shiggaion”'
    claim: 'Shiggaion, with Shigionoth in Habakkuk 3:1, may refer to an irregular, erratic style'
    key: bd-psalms
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/psalms?lang=eng'
    quote: 'while Shiggaion (Ps. 7) with Shigionoth (Hab. 3:1) may refer to the irregular erratic style of the compositions'
  - where: 'note 7:0 “Shiggaion”'
    claim: 'Habakkuk’s prayer is headed “upon Shigionoth”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hab/3?lang=eng'
    quote: 'A prayer of Habakkuk the prophet upon Shigionoth.'
  - where: 'note 7:0 “Shiggaion”'
    claim: 'The lexicon calls it a doubtful word and lists it in this title'
    key: bdb
    url: 'https://biblehub.com/hebrew/7692.htm'
    quote: 'doubtful word, Psalm 7:1 (title)'
  - where: 'note 7:0 “Shiggaion”'
    claim: 'It is usually derived from a verb meaning to go astray or reel, giving a wild, passionate song'
    key: bdb
    url: 'https://biblehub.com/hebrew/7692.htm'
    quote: 'go a stray, reel, i.e. wild, passionate song, with rapid changes of rhythm'
  - where: 'note 7:0 “Shiggaion”'
    claim: 'The Greek title has only “A Psalm of David”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/7.htm'
    quote: 'A Psalm of David, which he sang to the Lord because of the words of Chusi the Benjamite.'

  # ---------- note 7:0 Cush ----------
  - where: 'note 7:0 “Cush the Benjamite”'
    claim: 'The story of Cush is not in the biblical record; David’s conflicts with Benjamites are'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Although this story is not included elsewhere in the biblical record, David does have a number of documented conflicts with Benjaminites in 1 Samuel 24–26 and 2 Samuel 16, 20, and others.'
  - where: 'note 7:0 “Cush the Benjamite”'
    claim: 'Cush is not mentioned elsewhere in scripture'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/7.htm'
    quote: 'there is no mention of him elsewhere in Scripture history'
  - where: 'note 7:0 “Cush the Benjamite”'
    claim: 'One older reading: Cush was a servant of Saul who slandered David to him'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/7.htm'
    quote: 'must have been one of the many servants of Saul, his kinsman, one of the talebearers like Doeg and the Ziphites, who shamefully slandered David before Saul'
  - where: 'note 7:0 “Cush the Benjamite”'
    claim: 'Saul was a Benjamite'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/9?lang=eng'
    quote: 'And Saul answered and said, Am not I a Benjamite, of the smallest of the tribes of Israel?'
  - where: 'note 7:0 “Cush the Benjamite”'
    claim: 'Saul addressed the servants around him as Benjamites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/22?lang=eng'
    quote: 'Then Saul said unto his servants that stood about him, Hear now, ye Benjamites'
  - where: 'note 7:0 “Cush the Benjamite”'
    claim: 'At the cave David asks Saul why he listens to men’s words against him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/24?lang=eng'
    quote: 'Wherefore hearest thou men’s words, saying, Behold, David seeketh thy hurt?'
  - where: 'note 7:0 “Cush the Benjamite”'
    claim: 'Shimei, of the house of Saul, cursed David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/16?lang=eng'
    quote: 'thence came out a man of the family of the house of Saul, whose name was Shimei, the son of Gera: he came forth, and cursed still as he came.'
  - where: 'note 7:0 “Cush the Benjamite”'
    claim: 'David calls Shimei “this Benjamite”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/16?lang=eng'
    quote: 'how much more now may this Benjamite do it?'

  # ---------- note 7:3 ----------
  - where: 'note 7:3 “An oath with his life as the stake”'
    claim: 'The psalm does not say what David was accused of'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'What exactly David is accused of having done is not explained'
  - where: 'note 7:3 “An oath with his life as the stake”'
    claim: '“This” points to what the Benjamite said'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/7.htm'
    quote: 'points to the substance of those slanderous sayings of the Benjamite'
  - where: 'note 7:3 “An oath with his life as the stake”'
    claim: 'The words of verse 3 can be compared with David’s words to Saul in 1 Samuel 24 and 26'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/7.htm'
    quote: "one may compare David's words to Saul"
  - where: 'note 7:3 “An oath with his life as the stake”'
    claim: 'One reading takes “him that was at peace with me” as said with reference to Saul'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/7.htm'
    quote: 'is the name he gives (with reference to Saul) to him who stands on a peaceful, friendly footing with him'
  - where: 'note 7:3 “An oath with his life as the stake”'
    claim: 'David’s words to Saul at the cave'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/24?lang=eng'
    quote: 'know thou and see that there is neither evil nor transgression in mine hand, and I have not sinned against thee'
  - where: 'note 7:3 “An oath with his life as the stake”'
    claim: 'David’s words to Saul the second time'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/26?lang=eng'
    quote: 'for what have I done? or what evil is in mine hand?'

  # ---------- note 7:4 ----------
  - where: 'note 7:4 “The line in parentheses”'
    claim: 'The Hebrew verb can mean rescue or deliver, in poetry'
    key: bdb
    url: 'https://biblehub.com/hebrew/2502.htm'
    quote: 'rescue, deliver, with object person, but only in poetry'
  - where: 'note 7:4 “The line in parentheses”'
    claim: 'The lexicon records “but I delivered” (the King James’s rendering) and “spoiled, despoiled,” a sense found only in Aramaic'
    key: bdb
    url: 'https://biblehub.com/hebrew/2502.htm'
    quote: 'but I delivered AV Hup Ri, compare Ew; and spoiled, despoiled Ges Hi De Bae (but this only in Aramaic)'
  - where: 'note 7:4 “The line in parentheses”'
    claim: 'A modern translation keeps the line inside the oath: “or plundered my foe without cause”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%207&version=NRSVUE'
    quote: 'or plundered my foe without cause,'
  - where: 'note 7:4 “The line in parentheses”'
    claim: 'The same translation has “if I have repaid my ally with harm”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%207&version=NRSVUE'
    quote: 'if I have repaid my ally with harm'
  - where: 'note 7:4 “The line in parentheses”'
    claim: '1 Samuel 24 tells of David sparing Saul’s life in a cave'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/24?lang=eng'
    quote: 'David finds Saul in a cave and spares his life'
  - where: 'note 7:4 “The line in parentheses”'
    claim: '1 Samuel 26 tells of David sparing Saul a second time'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/26?lang=eng'
    quote: 'David again spares Saul’s life'

  # ---------- note 7:7 ----------
  - where: 'note 7:7 “The Judge takes His seat”'
    claim: 'The Hebrew word for “people” in verse 7 is plural'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לְ֭אֻמִּים'
  - where: 'note 7:7 “The Judge takes His seat”'
    claim: 'The Hebrew word for “people” in verse 8 is plural'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'עַ֫מִּ֥ים'
  - where: 'note 7:7 “The Judge takes His seat”'
    claim: 'The Greek has “the congregation of the nations”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/7.htm'
    quote: 'And the congregation of the nations shall compass thee: and for this cause do thou return on high.'
  - where: 'note 7:7 “The Judge takes His seat”'
    claim: 'The King James wording seems to have the psalmist send the Lord back to His hiding place'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'it appears to depict the psalmist telling the Lord to flee back to His hiding place'
  - where: 'note 7:7 “The Judge takes His seat”'
    claim: 'The New International Version is offered as the alternate translation that clears the verse'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'In the New International Version, the verse is rendered: “Let the assembled peoples gather around you, while you sit enthroned over them on high.”'
  - where: 'note 7:7 “The Judge takes His seat”'
    claim: 'The New International Version’s wording of verse 7'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%207&version=NIV'
    quote: 'while you sit enthroned over them on high.'
  - where: 'note 7:7 “The Judge takes His seat”'
    claim: 'The New Revised Standard Version has “take your seat on high”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%207&version=NRSVUE'
    quote: 'and over it take your seat on high.'
  - where: 'note 7:7 “The Judge takes His seat”'
    claim: 'Its footnote says the Hebrew reads “return”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%207&version=NRSVUE'
    quote: 'Cn: Heb return'
  - where: 'note 7:7 “The Judge takes His seat”'
    claim: 'The Hebrew verb in verse 7 is the verb “return”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שֽׁוּבָ/ה'

  # ---------- note 7:8 ----------
  - where: 'note 7:8 “Righteous in this matter”'
    claim: 'David is persecuted for something of which he believes he is innocent'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'for something of which he believes he is innocent'
  - where: 'note 7:8 “Righteous in this matter”'
    claim: 'David’s recorded conflicts with Benjamites include 1 Samuel 24–26'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'David does have a number of documented conflicts with Benjaminites in 1 Samuel 24–26'
  - where: 'note 7:8 “Righteous in this matter”'
    claim: 'David appeals to the Lord as judge between himself and Saul'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/24?lang=eng'
    quote: 'The Lord therefore be judge, and judge between me and thee'
  - where: 'note 7:8 “Righteous in this matter”'
    claim: 'David asks that the Lord render to every man his righteousness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/26?lang=eng'
    quote: 'The Lord render to every man his righteousness and his faithfulness'
  - where: 'note 7:8 “Righteous in this matter”'
    claim: 'Saul says David is more righteous than he'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/24?lang=eng'
    quote: 'Thou art more righteous than I'

  # ---------- note 7:9 ----------
  - where: 'note 7:9 “He who searches the reins and hearts”'
    claim: 'The Hebrew behind “reins” is the word for kidneys'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וּ/כְלָי֗וֹת'
  - where: 'note 7:9 “He who searches the reins and hearts”'
    claim: 'The kidneys are, figuratively, the seat of emotion and affection and so the object of God’s examination, here and in Jeremiah'
    key: bdb
    url: 'https://biblehub.com/hebrew/3629.htm'
    quote: '2 figurative, as seat of emotion and affection'
  - where: 'note 7:9 “He who searches the reins and hearts”'
    claim: 'The lexicon lists this verse with Jeremiah 11:20 under God’s examination of character'
    key: bdb
    url: 'https://biblehub.com/hebrew/3629.htm'
    quote: 'hence, as involving character, the object of God''s examination'
  - where: 'note 7:9 “He who searches the reins and hearts”'
    claim: 'Jeremiah prays to the Lord who judges righteously and tries the reins and the heart'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/11?lang=eng'
    quote: 'But, O Lord of hosts, that judgest righteously, that triest the reins and the heart'
  - where: 'note 7:9 “He who searches the reins and hearts”'
    claim: 'In Jeremiah 17 the Lord says it of Himself'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/17?lang=eng'
    quote: 'I the Lord search the heart, I try the reins, even to give every man according to his ways'
  - where: 'note 7:9 “He who searches the reins and hearts”'
    claim: 'The speaker of the letter to Thyatira is the Son of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/2?lang=eng'
    quote: 'These things saith the Son of God, who hath his eyes like unto a flame of fire'
  - where: 'note 7:9 “He who searches the reins and hearts”'
    claim: 'He says that He searches the reins and hearts and gives to each according to works'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/2?lang=eng'
    quote: 'all the churches shall know that I am he which searcheth the reins and hearts: and I will give unto every one of you according to your works.'

  # ---------- note 7:11 ----------
  - where: 'note 7:11 “A righteous judge”'
    claim: 'The Hebrew of verse 11 has “judge” then “righteous,” with no word for the wicked'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שׁוֹפֵ֣ט'
  - where: 'note 7:11 “A righteous judge”'
    claim: 'The word “righteous” in verse 11'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'צַדִּ֑יק'
  - where: 'note 7:11 “A righteous judge”'
    claim: 'The same adjective ends verse 9 (“the righteous God”) and is “the just” there'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'צַדִּֽיק'
  - where: 'note 7:11 “A righteous judge”'
    claim: 'The word behind “angry” is a participle of the verb “be indignant”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'זֹעֵ֥ם'
  - where: 'note 7:11 “A righteous judge”'
    claim: 'The verb means to be indignant, to have indignation'
    key: bdb
    url: 'https://biblehub.com/hebrew/2194.htm'
    quote: '1 be indignant, have indignation'
  - where: 'note 7:11 “A righteous judge”'
    claim: 'A modern translation: “God is a righteous judge”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%207&version=NRSVUE'
    quote: 'God is a righteous judge'
  - where: 'note 7:11 “A righteous judge”'
    claim: 'The same translation continues “and a God who has indignation every day”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%207&version=NRSVUE'
    quote: 'and a God who has indignation every day.'
  - where: 'note 7:11 “A righteous judge”'
    claim: 'The Greek also has “God is a righteous judge”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/7.htm'
    quote: 'God is a righteous judge, and strong, and patient'

  # ---------- note 7:12 ----------
  - where: 'note 7:12 “Who turns, and who whets the sword”'
    claim: 'The pronouns of verse 12 and the verses after are unclear in the King James Version'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'it is not clear whether the speaker is referring to God or the wicked person'
  - where: 'note 7:12 “Who turns, and who whets the sword”'
    claim: 'The New Revised Standard Version replaces the pronouns with “one” and “God,” and later with “they”'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'replacing the pronouns of verse 12 with “one” and “God” and subsequent occurrences with “they”'
  - where: 'note 7:12 “Who turns, and who whets the sword”'
    claim: 'The New Revised Standard Version’s wording of verse 12'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%207&version=NRSVUE'
    quote: 'If one does not repent, God will whet his sword;'
  - where: 'note 7:12 “Who turns, and who whets the sword”'
