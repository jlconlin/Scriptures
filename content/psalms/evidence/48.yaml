chapter: 48
claims:
  # when, setting
  - where: 'when'
    claim: 'The title gives the psalm to the sons of Korah and names no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/48?lang=eng'
    quote: 'A Song and Psalm for the sons of Korah.'
  - where: 'setting'
    claim: 'Psalm 48 is joined to Psalms 46 and 47 by the thought of the LORD exalted above the peoples'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/48.htm'
    quote: 'It is connected with Psalm 46:1-11 and Psalm 47:1-9 by the fundamental thought of the exaltation of Jahve above the peoples of the earth'
  - where: 'setting'
    claim: 'In Psalm 48 the song of thanksgiving has become a song in praise of Jerusalem'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/48.htm'
    quote: 'the song of thanksgiving for victory has become a song in praise of Jerusalem'
  - where: 'setting'
    claim: 'Psalms 46–48 are three Korahite psalms taken together'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/46.htm'
    quote: 'It is indeed equally admissible to refer these three Korahitic Psalms'
  - where: 'setting'
    claim: 'Psalm 48 is counted among the songs of Zion, which celebrate the temple at Mount Zion'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'Songs of Zion. These psalms celebrate the location of the temple at Mount Zion'
  - where: 'setting'
    claim: 'The list of the songs of Zion includes Psalm 48'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'could have acted also as a call to worship: 46, 48, 76, 84, 87, and 122.'
  - where: 'setting'
    claim: 'Jesus calls Jerusalem the city of the great King in the Sermon on the Mount'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/5?lang=eng'
    quote: 'neither by Jerusalem; for it is the city of the great King.'

  # thread
  - where: 'thread'
    claim: 'The verb “saw” of verse 5 (the kings) is the verb “seen” of verse 8 (the congregation)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'רָ֭אוּ'
  - where: 'thread'
    claim: 'The verb “seen” of verse 8 is the same Hebrew verb, in the first person plural'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'רָאִ֗ינוּ'
  - where: 'thread'
    claim: 'The “daughters of Judah” of verse 11 are rendered as the towns of Judah'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2048&version=NRSVUE'
    quote: 'let the towns of Judah rejoice'

  # section plain renderings
  - where: 'section 1 plain'
    claim: '“The mountain of his holiness” is His holy mountain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/48?lang=eng'
    quote: 'OR His holy mountain.'
  - where: 'section 1 plain'
    claim: '“Beautiful for situation” is beautiful in elevation'
    key: bdb
    url: 'https://biblehub.com/hebrew/5131.htm'
    quote: 'beautiful in elevation (of Mount Zion)'
  - where: 'section 1 plain'
    claim: '“Palaces” in verse 3 may be rendered citadels, and “is known” as has shown himself'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2048&version=NRSVUE'
    quote: 'has shown himself a sure defense.'
  - where: 'section 1 plain'
    claim: '“Palaces” in verse 3 may be rendered citadels'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2048&version=NRSVUE'
    quote: 'Within its citadels God'
  - where: 'section 2 plain'
    claim: '“They passed by together” is rendered as the kings coming on together'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2048&version=NRSVUE'
    quote: 'they came on together.'
  - where: 'section 2 plain'
    claim: 'Verse 5: the seeing and the dismay come at once'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2048&version=NRSVUE'
    quote: 'As soon as they saw it, they were astounded;'
  - where: 'section 4 plain'
    claim: '“Tell the towers” is count the towers'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2048&version=NRSVUE'
    quote: 'count its towers;'
  - where: 'section 4 plain'
    claim: '“Consider her palaces” may be rendered as passing between or through them'
    key: bdb
    url: 'https://biblehub.com/hebrew/6448.htm'
    quote: 'pass between her palaces'
  - where: 'section 4 plain'
    claim: '“Bulwarks” is rendered ramparts'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2048&version=NRSVUE'
    quote: 'consider well its ramparts;'

  # note 48:2 Situation means height
  - where: 'note 48:2 “Situation means height”'
    claim: 'The Hebrew noun means elevation or height'
    key: bdb
    url: 'https://biblehub.com/hebrew/5131.htm'
    quote: 'elevation, height'
  - where: 'note 48:2 “Situation means height”'
    claim: 'The phrase is glossed “beautiful in elevation (of Mount Zion)”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5131.htm'
    quote: 'beautiful in elevation (of Mount Zion)'
  - where: 'note 48:2 “Situation means height”'
    claim: 'A modern translation has “beautiful in elevation”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2048&version=NRSVUE'
    quote: 'beautiful in elevation,'
  - where: 'note 48:2 “Situation means height”'
    claim: 'Jerusalem was a mountain fortress about 2600 feet above the sea, with deep valleys on every side but the north'
    key: bd-jerusalem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jerusalem?lang=eng'
    quote: 'a mountain fortress, about 2600 feet above sea level, surrounded by deep valleys on all sides except the north'

  # note 48:2 The sides of the north
  - where: 'note 48:2 “The sides of the north”'
    claim: 'The Hebrew phrase of verse 2 is yarkete tsaphon'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יַרְכְּתֵ֣י'
  - where: 'note 48:2 “The sides of the north”'
    claim: 'Isaiah 14:13 has the same two Hebrew words'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'בְּ/יַרְכְּתֵ֥י'
  - where: 'note 48:2 “The sides of the north”'
    claim: 'The phrase is glossed “remote parts of the north,” in Isaiah 14:13, Ezekiel 38–39 and this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/3411.htm'
    quote: 'remote parts of the north Isaiah 14:13; Ezekiel 38:6,15; Ezekiel 39:2; Psalm 48:3'
  - where: 'note 48:2 “The sides of the north”'
    claim: 'In Isaiah 14:13 the remote parts of the north are a divine abode'
    key: bdb
    url: 'https://biblehub.com/hebrew/6828.htm'
    quote: 'remote parts of north Isaiah 14:13 (as divine abode)'
  - where: 'note 48:2 “The sides of the north”'
    claim: 'The footnote in the Church’s edition says that various lands placed the dwelling of Deity in the north, and refers to Isaiah 14:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/48?lang=eng'
    quote: 'There was in various lands a concept that the dwelling place of Deity was in the'
  - where: 'note 48:2 “The sides of the north”'
    claim: 'A modern translation renders the phrase “like the heights of Zaphon”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2048&version=NIV'
    quote: 'like the heights of Zaphon'
  - where: 'note 48:2 “The sides of the north”'
    claim: 'That translation’s note calls Zaphon the most sacred mountain of the Canaanites'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2048&version=NIV'
    quote: 'Zaphon was the most sacred mountain of the Canaanites.'

  # note 48:4 Which kings
  - where: 'note 48:4 “Which kings”'
    claim: 'The occasion proposed is the time of Jehoshaphat'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/48.htm'
    quote: 'does not apply to any period so well as to the time of Jehoshaphat'
  - where: 'note 48:4 “Which kings”'
    claim: 'Moab, Ammon and others came against Jehoshaphat'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: 'the children of Moab, and the children of Ammon, and with them other beside the Ammonites, came against Jehoshaphat to battle'
  - where: 'note 48:4 “Which kings”'
    claim: 'Jehoshaphat stood with the congregation in the temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: 'And Jehoshaphat stood in the congregation of Judah and Jerusalem, in the house of the'
  - where: 'note 48:4 “Which kings”'
    claim: 'Korahite Levites stood up to praise'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: 'of the children of the Korhites, stood up to praise'
  - where: 'note 48:4 “Which kings”'
    claim: 'The army went out toward the wilderness of Tekoa'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: 'went forth into the wilderness of Tekoa'
  - where: 'note 48:4 “Which kings”'
    claim: 'The invaders were smitten when the singing began'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: 'And when they began to sing and to praise'
  - where: 'note 48:4 “Which kings”'
    claim: 'The fear of God fell on the kingdoms round about'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: 'And the fear of God was on all the kingdoms of those countries'
  - where: 'note 48:4 “Which kings”'
    claim: 'In Chronicles Judah finds the invaders dead, and none escaped'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: 'they were dead bodies fallen to the earth, and none escaped'
  - where: 'note 48:4 “Which kings”'
    claim: '“The kings,” with the article, points to a definite number of kings'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/48.htm'
    quote: 'points to a definite number of kings known to the poet'
  - where: 'note 48:4 “Which kings”'
    claim: 'The allies camped toward Tekoa, about three hours from Jerusalem'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/48.htm'
    quote: 'The allies encamped in the desert to Tekoa, about three hours distant from Jerusalem'
  - where: 'note 48:4 “Which kings”'
    claim: 'The view from there reaches Jerusalem'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/48.htm'
    quote: 'The extensive view at that point extends even to Jerusalem'
  - where: 'note 48:4 “Which kings”'
    claim: 'Verse 9 is read as looking back to the temple service before the army set out'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/48.htm'
    quote: 'the service held in the temple before the army set out'
  - where: 'note 48:4 “Which kings”'
    claim: 'Verse 7 is read as shaped by the memory of Jehoshaphat’s wrecked merchant fleet'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/48.htm'
    quote: 'the destruction of the merchant fleet fitted out by Jehoshaphat in conjunction with Ahaziah'
  - where: 'note 48:4 “Which kings”'
    claim: 'Jehoshaphat’s ships of Tharshish were broken at Ezion-geber'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/22?lang=eng'
    quote: 'for the ships were broken at Ezion-geber'
  - where: 'note 48:4 “Which kings”'
    claim: 'The same reading allows the defeat of Sennacherib under Hezekiah as an equally admissible occasion'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/46.htm'
    quote: 'It is indeed equally admissible to refer these three Korahitic Psalms to the defeat of Sennacherib'

  # note 48:7 Ships in a song about a mountain
  - where: 'note 48:7 “Ships in a song about a mountain”'
    claim: 'Tarshish was probably Tartessus in Spain, and “ships of Tarshish” came to mean ships of the largest size'
    key: bd-tarshish
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tarshish?lang=eng'
    quote: 'Probably Tartessus in Spain; ships of Tarshish (the name came to be used to denote ships of the largest size, suitable for long voyages)'
  - where: 'note 48:7 “Ships in a song about a mountain”'
    claim: 'A modern translation makes the verse a comparison'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2048&version=NRSVUE'
    quote: 'as when an east wind shatters'
  - where: 'note 48:7 “Ships in a song about a mountain”'
    claim: 'The Hebrew verb is in the second person, addressed to God'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תְּ֝שַׁבֵּ֗ר'
  - where: 'note 48:7 “Ships in a song about a mountain”'
    claim: 'The Hebrew word for the east wind in verse 7'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'קָדִ֑ים'
  - where: 'note 48:7 “Ships in a song about a mountain”'
    claim: 'Ezekiel 27:26 has the same Hebrew word for the east wind'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הַ/קָּדִ֔ים'
  - where: 'note 48:7 “Ships in a song about a mountain”'
    claim: 'Ezekiel 27:26 has the same Hebrew verb for breaking'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'שְׁבָרֵ֖/ךְ'

  # note 48:8 For ever, and a city that fell
  - where: 'note 48:8 “For ever, and a city that fell”'
    claim: 'Lamentations 2:15 has the Hebrew noun for “joy” that verse 2 has'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'מָשׂ֖וֹשׂ'
  - where: 'note 48:8 “For ever, and a city that fell”'
    claim: 'The noun for “joy” in verse 2'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מְשׂ֪וֹשׂ'
  - where: 'note 48:8 “For ever, and a city that fell”'
    claim: 'Jerusalem was destroyed by the Romans in A.D. 70'
    key: bd-jerusalem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jerusalem?lang=eng'
    quote: 'in A.D. 70 it was entirely destroyed by the Romans under Titus'
  - where: 'note 48:8 “For ever, and a city that fell”'
    claim: 'Jerusalem was gradually rebuilt after the return'
    key: bd-jerusalem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jerusalem?lang=eng'
    quote: 'After the return it was gradually rebuilt'
  - where: 'note 48:8 “For ever, and a city that fell”'
    claim: 'One older reading: the city’s being trodden down for a season does not annul the promise'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/48.htm'
    quote: 'no more annuls the promise of God than Israel''s temporary rejection annuls Israel''s election'
  - where: 'note 48:8 “For ever, and a city that fell”'
    claim: 'That reading: the Holy City does not fall without rising again'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/48.htm'
    quote: 'The Holy City does not fall without again rising up.'
  - where: 'note 48:8 “For ever, and a city that fell”'
    claim: 'The chapter heading in the Church’s edition puts the promise in the future'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/48?lang=eng'
    quote: 'Zion, the city of God, the joy of the whole earth, will be established forever.'

  # note 48:9 Thinking on lovingkindness in the temple
  - where: 'note 48:9 “Thinking on lovingkindness in the temple”'
    claim: 'The verb is glossed “think of” in this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/1819.htm'
    quote: 'think of, followed by accusative Psalm 48:10'
  - where: 'note 48:9 “Thinking on lovingkindness in the temple”'
    claim: 'The same group of senses includes to imagine or form an idea'
    key: bdb
    url: 'https://biblehub.com/hebrew/1819.htm'
    quote: 'imagine, form an idea, devise'
  - where: 'note 48:9 “Thinking on lovingkindness in the temple”'
    claim: 'A modern translation has “We ponder your steadfast love”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2048&version=NRSVUE'
    quote: 'We ponder your steadfast love, O God,'
  - where: 'note 48:9 “Thinking on lovingkindness in the temple”'
    claim: '“Lovingkindness” is the Hebrew hesed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חַסְדֶּ֑/ךָ'

