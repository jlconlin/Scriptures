  - where: 'note 48:11 “Daughters of Judah: women or towns”'
    claim: 'One modern translation has “the towns of Judah”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2048&version=NRSVUE'
    quote: 'let the towns of Judah rejoice'
  - where: 'note 48:11 “Daughters of Judah: women or towns”'
    claim: 'Its footnote says the Hebrew is “daughters”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2048&version=NRSVUE'
    quote: '48.11 Heb daughters'
  - where: 'note 48:11 “Daughters of Judah: women or towns”'
    claim: 'Another has “the villages of Judah”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2048&version=NIV'
    quote: 'the villages of Judah are glad'

  # note 48:12 Tell means count, and then recount
  - where: 'note 48:12 “Tell means count, and then recount”'
    claim: 'Modern translations have “count” for “tell” in verse 12'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2048&version=NRSVUE'
    quote: 'count its towers;'
  - where: 'note 48:12 “Tell means count, and then recount”'
    claim: 'The verb of verse 12 (“tell the towers”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'סִ֝פְר֗וּ'
  - where: 'note 48:12 “Tell means count, and then recount”'
    claim: 'The verb of verse 13 (“tell it to the generation following”) is the same Hebrew verb in another stem'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תְּ֝סַפְּר֗וּ'
  - where: 'note 48:12 “Tell means count, and then recount”'
    claim: 'The lexicon lists the form of this verse under the verb'
    key: bdb
    url: 'https://biblehub.com/hebrew/5608.htm'
    quote: '1 Chronicles 21:2; Psalm 48:13'
  - where: 'note 48:12 “Tell means count, and then recount”'
    claim: 'One reading: the call is to the people of Jerusalem, who had waited behind the walls'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/48.htm'
    quote: 'they have remained behind the walls of the city in anxious expectation'
  - where: 'note 48:12 “Tell means count, and then recount”'
    claim: 'They are to see that the towers and bulwark are whole'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/48.htm'
    quote: 'examine them and see that its towers are all standing, its bulwark is intact'
  - where: 'note 48:12 “Tell means count, and then recount”'
    claim: 'A modern translation runs verse 13 into verse 14'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2048&version=NRSVUE'
    quote: 'that you may tell the next generation'
  - where: 'note 48:12 “Tell means count, and then recount”'
    claim: 'What is told is “that this is God”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2048&version=NRSVUE'
    quote: 'that this is God,'

