  - where: 'note 48:11 “Daughters of Judah: women or towns”'
    claim: 'The lexicon lists the plural among designations of the women of a city, land or people'
    key: bdb
    url: 'https://biblehub.com/hebrew/1323.htm'
    quote: 'often plural as designation of women of a particular city, land, or people'
  - where: 'note 48:11 “Daughters of Judah: women or towns”'
    claim: 'It lists this verse and Psalm 97:8 there'
    key: bdb
    url: 'https://biblehub.com/hebrew/1323.htm'
