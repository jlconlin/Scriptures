    claim: 'The phrase is a noun, “approach to God,” cited for Isaiah 58:2 and Psalm 73:28'
    key: bdb
    url: 'https://biblehub.com/hebrew/7132.htm'
    quote: 'approach to God'
  - where: 'note 73:28 “‘Good’ at both ends”'
    claim: 'A modern translation of the line'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2073&version=NRSVUE'
    quote: 'But for me it is good to be near God;'
  - where: 'note 73:28 “‘Good’ at both ends”'
    claim: '“Declare” in verse 28 is the verb of “speak” in verse 15 (sapper, H5608a in both; hebrew.mjs psalms 73:15, 73:28); the form in verse 28'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לְ֝/סַפֵּ֗ר'
  - where: 'note 73:28 “‘Good’ at both ends”'
    claim: 'The form of the verb in verse 15'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֲסַפְּרָ֥ה'
  - where: 'note 73:28 “‘Good’ at both ends”'
    claim: 'The lexicon lists Psalm 73:15 under the same verb, in the sense “talk”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5608.htm'
