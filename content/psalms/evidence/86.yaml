chapter: 86
claims:
  # ---- setting ----
  - where: 'setting'
    claim: 'The title ascribes the psalm to David and calls it a prayer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/86?lang=eng'
    quote: 'A Prayer of David.'
  - where: 'setting'
    claim: 'The psalm before it is headed for the sons of Korah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/85?lang=eng'
    quote: 'To the chief Musician, A Psalm for the sons of Korah.'
  - where: 'setting'
    claim: 'The psalm after it is headed for the sons of Korah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/87?lang=eng'
    quote: 'A Psalm or Song for the sons of Korah.'
  - where: 'setting'
    claim: 'Verse 15 is what the LORD said of Himself to Moses at Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'And the Lord passed by before him, and proclaimed, The Lord, The Lord God, merciful and gracious, longsuffering, and abundant in goodness and truth,'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: 'Verse 1: “hear me” is “answer me”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2086&version=NRSVUE'
    quote: 'Incline your ear, O Lord, and answer me,'
  - where: 'section 1 plain'
    claim: 'Verse 2: “soul” is life, and “holy” is devoted'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2086&version=NRSVUE'
    quote: 'Preserve my life, for I am devoted to you;'
  - where: 'section 1 plain'
    claim: 'Verse 3: “be merciful” is be gracious, and “daily” is all day long'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2086&version=NRSVUE'
    quote: 'be gracious to me, O Lord,'
  - where: 'section 1 plain'
    claim: 'Verse 3: “daily” is all day long'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2086&version=NRSVUE'
    quote: 'for to you do I cry all day long.'
  - where: 'section 1 plain'
    claim: 'Verse 5: “ready to forgive” is forgiving'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2086&version=NRSVUE'
    quote: 'For you, O Lord, are good and forgiving,'
  - where: 'section 2 plain'
    claim: 'Verse 9: “worship” is bow down'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2086&version=NRSVUE'
    quote: 'and bow down before you, O Lord,'
  - where: 'section 3 plain'
    claim: 'Verse 12: “praise” is give thanks'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2086&version=NRSVUE'
    quote: 'I give thanks to you, O Lord my God, with my whole heart,'
  - where: 'section 3 plain'
    claim: 'Verse 13: “the lowest hell” is the depths of Sheol'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2086&version=NRSVUE'
    quote: 'you have delivered my soul from the depths of Sheol.'
  - where: 'section 4 plain'
    claim: 'Verse 14: “the proud” are the insolent, and the “assemblies” a band seeking his life'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2086&version=NRSVUE'
    quote: 'O God, the insolent rise up against me;'
  - where: 'section 4 plain'
    claim: 'Verse 14: the assembly is a band that seeks his life'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2086&version=NRSVUE'
    quote: 'a band of ruffians seeks my life,'
  - where: 'section 4 plain'
    claim: 'Verse 15: “longsuffering” is slow to anger, and “truth” is faithfulness'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2086&version=NRSVUE'
    quote: 'slow to anger and abounding in steadfast love and faithfulness.'
  - where: 'section 4 plain'
    claim: 'Verse 17: “a token for good” is a sign of favor'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2086&version=NRSVUE'
    quote: 'Show me a sign of your favor,'

  # ---- note 86:0 ----
  - where: 'note 86:0 “A prayer in words found elsewhere in scripture”'
    claim: 'Verse 1’s reason is the wording of Psalm 40:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/40?lang=eng'
    quote: 'But I am poor and needy; yet the Lord thinketh upon me'
  - where: 'note 86:0 “A prayer in words found elsewhere in scripture”'
    claim: 'Verse 4 ends as Psalm 25 begins'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/25?lang=eng'
    quote: 'Unto thee, O Lord, do I lift up my soul.'
  - where: 'note 86:0 “A prayer in words found elsewhere in scripture”'
    claim: 'Verse 11 opens with the opening words of Psalm 27:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/27?lang=eng'
    quote: 'Teach me thy way, O Lord, and lead me in a plain path, because of mine enemies.'
  - where: 'note 86:0 “A prayer in words found elsewhere in scripture”'
    claim: 'Verse 14 is close to Psalm 54:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/54?lang=eng'
    quote: 'For strangers are risen up against me, and oppressors seek after my soul: they have not set God before them.'
  - where: 'note 86:0 “A prayer in words found elsewhere in scripture”'
    claim: 'An older commentary takes the psalm as later than the passages it shares words with: nearly every line an echo of earlier psalms and the Law'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/86.htm'
    quote: 'almost everything is an echo of earlier language of the Psalms and of the Law'
  - where: 'note 86:0 “A prayer in words found elsewhere in scripture”'
    claim: 'The neighboring psalms are headed for the sons of Korah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/85?lang=eng'
    quote: 'To the chief Musician, A Psalm for the sons of Korah.'
  - where: 'note 86:0 “A prayer in words found elsewhere in scripture”'
    claim: 'The psalm after it is also headed for the sons of Korah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/87?lang=eng'
    quote: 'A Psalm or Song for the sons of Korah.'

  # ---- note 86:2 ----
  - where: 'note 86:2 “Holy here means devoted”'
    claim: '“Holy” in verse 2 is the word hasid'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חָסִ֪יד'
  - where: 'note 86:2 “Holy here means devoted”'
    claim: 'Hasid means kind, pious, as denoting the practice of hesed'
    key: bdb
    url: 'https://biblehub.com/hebrew/2623.htm'
    quote: 'adjective masculine kind, pious (so, as denoting active practice of חֶסֶד, kindness'
  - where: 'note 86:2 “Holy here means devoted”'
    claim: 'The lexicon lists this verse under “a pious man, the godly”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2623.htm'
    quote: 'a pious man, the godly Psalm 4:4; Psalm 12:2; Psalm 32:6; Psalm 86:2'
  - where: 'note 86:2 “Holy here means devoted”'
    claim: 'A modern translation has “devoted to you”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2086&version=NRSVUE'
    quote: 'Preserve my life, for I am devoted to you;'
  - where: 'note 86:2 “Holy here means devoted”'
    claim: 'Hesed stands in verses 5, 13 and 15 (here the form in verse 13, “thy mercy”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חַ֭סְדְּ/ךָ'

  # ---- note 86:8 ----
  - where: 'note 86:8 “The question of Moses’ song, turned into a statement”'
    claim: 'Israel’s song at the sea asks who is like the LORD among the gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'Who is like unto thee, O Lord, among the gods? who is like thee, glorious in holiness, fearful in praises, doing wonders?'
  - where: 'note 86:8 “The question of Moses’ song, turned into a statement”'
    claim: 'The Exodus chapter is the song of Moses and Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'The children of Israel sing the song of Moses'
  - where: 'note 86:8 “The question of Moses’ song, turned into a statement”'
    claim: '“Gods” in verse 8 is elohim'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בָ/אֱלֹהִ֥ים'

  # ---- note 86:9 ----
  - where: 'note 86:9 “The same words in the song John hears”'
    claim: 'In Revelation the song of Moses and of the Lamb praises God’s works'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/15?lang=eng'
    quote: 'And they sing the song of Moses the servant of God, and the song of the Lamb, saying, Great and marvellous are thy works, Lord God Almighty'
  - where: 'note 86:9 “The same words in the song John hears”'
    claim: 'The song has the nations coming to worship, the fear of God and the glorifying of His name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/15?lang=eng'
    quote: 'Who shall not fear thee, O Lord, and glorify thy name? for thou only art holy: for all nations shall come and worship before thee'
  - where: 'note 86:9 “The same words in the song John hears”'
    claim: 'The Church’s heading to Revelation 15 says exalted Saints praise God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/15?lang=eng'
    quote: 'Exalted Saints praise God in celestial glory forever.'
  - where: 'note 86:9 “The same words in the song John hears”'
    claim: 'Psalm 22 has the nations worshipping before the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/22?lang=eng'
    quote: 'and all the kindreds of the nations shall worship before thee.'
  - where: 'note 86:9 “The same words in the song John hears”'
    claim: 'Latter-day revelation speaks of a trump all people will hear, when every knee bows'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'And this shall be the sound of his trump, saying to all people, both in heaven and in earth, and that are under the earth—for every ear shall hear it, and every knee shall bow, and every tongue shall confess'

  # ---- note 86:11 ----
  - where: 'note 86:11 “A heart made one”'
    claim: 'The verb of verse 11 is yachad'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יַחֵ֥ד'
  - where: 'note 86:11 “A heart made one”'
    claim: 'The verb means be united'
    key: bdb
    url: 'https://biblehub.com/hebrew/3161.htm'
    quote: 'verb be united'
  - where: 'note 86:11 “A heart made one”'
    claim: 'The lexicon explains the line as concentrating the heart’s affections and compares Jeremiah 32:39'
    key: bdb
    url: 'https://biblehub.com/hebrew/3161.htm'
    quote: 'unite my heart (i.e. concentrate its affections, compare Jeremiah 32:39) to fear thy name'
  - where: 'note 86:11 “A heart made one”'
    claim: 'A modern translation has “an undivided heart”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2086&version=NRSVUE'
    quote: 'give me an undivided heart to revere your name.'
  - where: 'note 86:11 “A heart made one”'
    claim: 'Jeremiah 32:39 promises Israel one heart to fear the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/32?lang=eng'
    quote: 'And I will give them one heart, and one way, that they may fear me for ever'
  - where: 'note 86:11 “A heart made one”'
    claim: 'The Greek has “let my heart rejoice”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/86.htm'
    quote: 'let my heart rejoice, that I may fear thy name.'
  - where: 'note 86:11 “A heart made one”'
    claim: 'The lexicon notes that the Greek and other versions read a different verb, “rejoice”; the pointed Hebrew is the piel imperative “unite”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3161.htm'
    quote: 'let my heart rejoice'

  # ---- note 86:13 ----
  - where: 'note 86:13 “The lowest hell is Sheol beneath”'
    claim: '“Hell” is Sheol, with the adjective tachtiyyah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תַּחְתִּיָּֽה'
  - where: 'note 86:13 “The lowest hell is Sheol beneath”'
    claim: 'The adjective means lower, lowest'
    key: bdb
    url: 'https://biblehub.com/hebrew/8482.htm'
    quote: 'adjective and substantive lower, lowest (places)'
  - where: 'note 86:13 “The lowest hell is Sheol beneath”'
    claim: 'A modern translation has “the depths of Sheol”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2086&version=NRSVUE'
    quote: 'you have delivered my soul from the depths of Sheol.'
  - where: 'note 86:13 “The lowest hell is Sheol beneath”'
    claim: 'Deuteronomy 32:22 has the same phrase in the King James'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng'
    quote: 'For a fire is kindled in mine anger, and shall burn unto the lowest hell'
  - where: 'note 86:13 “The lowest hell is Sheol beneath”'
    claim: 'Deuteronomy 32:22 has Sheol with the same adjective in a different form (tachtith)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'תַּחְתִּ֑ית'
  - where: 'note 86:13 “The lowest hell is Sheol beneath”'
    claim: 'One older reading: the hell beneath, like the earth beneath, the inner parts of the earth'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/86.htm'
    quote: 'the deliverance out of the hell beneath'
  - where: 'note 86:13 “The lowest hell is Sheol beneath”'
    claim: 'On that reading the phrase names the place below, compared with “the earth beneath”'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/86.htm'
    quote: 'the earth beneath, the inner parts of the earth'
  - where: 'note 86:13 “The lowest hell is Sheol beneath”'
    claim: 'The Church’s chapter heading has David saved from the lowest hell'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/86?lang=eng'
    quote: 'David implores God for mercy and is saved from the lowest hell'

  # ---- note 86:15 ----
  - where: 'note 86:15 “The LORD’s own words at Sinai”'
    claim: 'The LORD proclaimed these words to Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'And the Lord passed by before him, and proclaimed, The Lord, The Lord God, merciful and gracious, longsuffering, and abundant in goodness and truth,'
  - where: 'note 86:15 “The LORD’s own words at Sinai”'
    claim: 'The Hebrew of Exodus 34:6 from “God” to “truth” (here its word for “merciful”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'רַח֖וּם'
  - where: 'note 86:15 “The LORD’s own words at Sinai”'
    claim: 'Psalm 86:15 has the same words in the same order (here the same word, “full of compassion”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'רַח֣וּם'
  - where: 'note 86:15 “The LORD’s own words at Sinai”'
    claim: 'A modern translation of the verse'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2086&version=NRSVUE'
    quote: 'But you, O Lord, are a God merciful and gracious,'
  - where: 'note 86:15 “The LORD’s own words at Sinai”'
    claim: 'The modern translation continues with slow to anger, steadfast love and faithfulness'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2086&version=NRSVUE'
    quote: 'slow to anger and abounding in steadfast love and faithfulness.'
  - where: 'note 86:15 “The LORD’s own words at Sinai”'
    claim: 'Verse 5 has the same two Hebrew words, rav hesed, as verse 15'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חֶ֝֗סֶד'

  # ---- note 86:16 ----
  - where: 'note 86:16 “Servant, and son of thine handmaid”'
    claim: 'The word is maid, handmaid'
    key: bdb
    url: 'https://biblehub.com/hebrew/519.htm'
    quote: 'noun feminine maid, handmaid'
  - where: 'note 86:16 “Servant, and son of thine handmaid”'
    claim: 'It is used in address of the speaker, in token of humility'
    key: bdb
    url: 'https://biblehub.com/hebrew/519.htm'
    quote: 'referring to speaker, in token of humility'
  - where: 'note 86:16 “Servant, and son of thine handmaid”'
    claim: 'In addressing God it is used by Hannah in 1 Samuel 1:11 and in the phrase of Psalms 86:16 and 116:16'
    key: bdb
    url: 'https://biblehub.com/hebrew/519.htm'
    quote: '1 Samuel 1:11 (3 t. in verse)'
  - where: 'note 86:16 “Servant, and son of thine handmaid”'
    claim: 'Hannah calls herself the LORD’s handmaid three times in one verse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/1?lang=eng'
    quote: 'if thou wilt indeed look on the affliction of thine handmaid, and remember me, and not forget thine handmaid, but wilt give unto thine handmaid a man child'
  - where: 'note 86:16 “Servant, and son of thine handmaid”'
    claim: 'Psalm 116:16 has the same phrase'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/116?lang=eng'
    quote: 'I am thy servant, and the son of thine handmaid'
  - where: 'note 86:16 “Servant, and son of thine handmaid”'
    claim: 'A modern translation has “the child of your maidservant”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2086&version=NRSVUE'
    quote: 'save the child of your maidservant.'
  - where: 'note 86:16 “Servant, and son of thine handmaid”'
    claim: 'One older reading: he was born into the relation of a servant'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/86.htm'
    quote: 'as having been born into the relation to Him of servant; it is a relationship that has come to him by birth'
  - where: 'note 86:16 “Servant, and son of thine handmaid”'
    claim: 'The older reading notes the seventh Adonai here and calls him the servant of the sovereign Lord'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/86.htm'
    quote: 'How beautifully does the Adonaj come in here for the seventh time! He is even from his mother''s womb the servant of the sovereign Lord'
  - where: 'note 86:16 “Servant, and son of thine handmaid”'
    claim: 'Adonai stands seven times in the psalm: verses 3, 4, 5, 8, 9, 12, 15 (scripts/hebrew.mjs psalms --word 136)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֲדֹנָ֑/י'
  - where: 'note 86:16 “Servant, and son of thine handmaid”'
    claim: 'The divine name stands four times: verses 1, 6, 11, 17 (scripts/hebrew.mjs psalms --word 3068)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יְהוָ֣ה'
  - where: 'note 86:16 “Servant, and son of thine handmaid”'
    claim: 'The commentary also counts Adonai seven times'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/86.htm'
    quote: 'It possesses this characteristic, that the divine name אדני occurs seven times'

  # ---- note 86:17 ----
  - where: 'note 86:17 “A token is a sign”'
    claim: '“Token” is the word oth'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'א֗וֹת'
  - where: 'note 86:17 “A token is a sign”'
    claim: 'The word means sign; this verse is listed under sign, pledge, token'
    key: bdb
    url: 'https://biblehub.com/hebrew/226.htm'
    quote: 'sign, pledge, token Genesis 4:15'
  - where: 'note 86:17 “A token is a sign”'
    claim: 'The lexicon cites the phrase of this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/226.htm'
    quote: 'token for good Psalm 86:17'
  - where: 'note 86:17 “A token is a sign”'
    claim: 'A modern translation has “a sign of your favor”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2086&version=NRSVUE'
    quote: 'Show me a sign of your favor,'
  - where: 'note 86:17 “A token is a sign”'
    claim: '“Holpen” is helped'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2086&version=NRSVUE'
    quote: 'because you, Lord, have helped me and comforted me.'

  # ---- christ ----
  - where: 'christ'
    claim: 'Jehovah, the LORD of the Old Testament, is the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: 'christ'
    claim: 'The risen Savior told the Nephites He gave the law and covenanted with Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/15?lang=eng'
    quote: 'Behold, I am he that gave the law, and I am he who covenanted with my people Israel'
  - where: 'christ'
    claim: 'The words of verse 15 were proclaimed by the LORD at Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'And the Lord passed by before him, and proclaimed, The Lord, The Lord God, merciful and gracious, longsuffering, and abundant in goodness and truth,'
  - where: 'christ'
    claim: 'The song of Revelation 15:3–4 is called the song of Moses and the song of the Lamb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/15?lang=eng'
    quote: 'And they sing the song of Moses the servant of God, and the song of the Lamb'

  # ---- explore ----
