chapter: 124
claims:
  # ---------- when ----------
  - where: when
    claim: 'The title calls the psalm a song of degrees and ascribes it to David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/124?lang=eng'
    quote: 'A Song of degrees of David.'

  # ---------- setting ----------
  - where: setting
    claim: 'The songs of degrees are Psalms 120–134, probably sung by pilgrims going up to Jerusalem'
    key: bd-degrees
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/degrees-songs-of?lang=eng'
    quote: 'Fifteen Psalms (120–34), probably so called because they were sung by Jewish pilgrims on their way up to Jerusalem.'
  - where: setting
    claim: 'Psalm 124 is the fifth of the songs of degrees'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/124.htm'
    quote: 'of this fifth Son of degrees'
  - where: setting
    claim: 'Psalm 123, just before, is a plea for mercy that ends under the contempt of the proud'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/123?lang=eng'
    quote: 'Our soul is exceedingly filled with the scorning of those that are at ease, and with the contempt of the proud.'
  - where: setting
    claim: 'Psalm 125, just after, opens with those who trust in the LORD being as mount Zion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/125?lang=eng'
    quote: 'They that trust in the Lord shall be as mount Zion, which cannot be removed, but abideth for ever.'
  - where: setting
    claim: 'Psalm 121:2 has nearly the words of verse 8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/121?lang=eng'
    quote: 'My help cometh from the Lord, which made heaven and earth.'

  # ---------- thread ----------
  - where: thread
    claim: 'One older reading describes the psalm’s art as going back half a step for each step forward'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/124.htm'
    quote: 'in order to take one step forward it always goes back half a step'

  # ---------- sections ----------
  - where: section 1 plain
    claim: '“Quick” in verse 3 is “alive,” and the “proud waters” of verse 5 are raging waters'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20124&version=NRSVUE'
    quote: 'then they would have swallowed us up alive'
  - where: section 1 plain
    claim: 'A modern translation has “the raging waters” in verse 5'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20124&version=NRSVUE'
    quote: 'the raging waters'

  # ---------- note 124:0 ----------
  - where: 'note 124:0 “What the title says, and what the Greek title leaves out”'
    claim: 'The songs of degrees are fifteen psalms, probably pilgrim songs'
    key: bd-degrees
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/degrees-songs-of?lang=eng'
    quote: 'Fifteen Psalms (120–34), probably so called because they were sung by Jewish pilgrims on their way up to Jerusalem.'
  - where: 'note 124:0 “What the title says, and what the Greek title leaves out”'
    claim: 'The ancient Greek translation titles the psalm a song of degrees and does not name David'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/124.htm'
    quote: 'A Song of Degrees: If it had not been that the Lord was among us, let Israel now say;'
  - where: 'note 124:0 “What the title says, and what the Greek title leaves out”'
    claim: 'The Church’s edition prints “of David” in the title'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/124?lang=eng'
    quote: 'A Song of degrees of David.'

  # ---------- note 124:1 ----------
  - where: 'note 124:1 “A line the people are called to say”'
    claim: 'A modern translation renders the words as a call: let Israel now say'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20124&version=NRSVUE'
    quote: '—let Israel now say—'
  - where: 'note 124:1 “A line the people are called to say”'
    claim: 'Psalm 129 opens the same way: a line, the call to Israel, and the line again'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/129?lang=eng'
    quote: 'Many a time have they afflicted me from my youth, may Israel now say:'
  - where: 'note 124:1 “A line the people are called to say”'
    claim: 'Psalm 118:2 has the same call'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/118?lang=eng'
    quote: 'Let Israel now say, that his mercy endureth for ever.'

  # ---------- note 124:3 ----------
  - where: 'note 124:3 “‘Quick’ means alive”'
    claim: 'The first sense of “quick” in older English is alive, a sense already obsolete in 1828'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/quick'
    quote: '1. Primarily, alive; living; opposed to dead or unanimated'
  - where: 'note 124:3 “‘Quick’ means alive”'
    claim: 'A modern translation has “alive” in verse 3'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20124&version=NRSVUE'
    quote: 'then they would have swallowed us up alive'
  - where: 'note 124:3 “‘Quick’ means alive”'
    claim: 'In Numbers 16 the earth swallows Korah’s company and they go down “quick” into the pit'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'the earth open her mouth, and swallow them up, with all that appertain unto them, and they go down quick into the pit'
  - where: 'note 124:3 “‘Quick’ means alive”'
    claim: 'In Proverbs 1:12 it is the grave that swallows alive'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/1?lang=eng'
    quote: 'Let us swallow them up alive as the grave; and whole, as those that go down into the pit:'

  - where: 'note 124:3 “‘Quick’ means alive”'
    claim: 'The sense “alive” was already obsolete in 1828 except in particular phrases'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/quick'
    quote: '[In this sense, the word is obsolete, except in some compounds or in particular phrases.]'
  - where: 'note 124:3 “‘Quick’ means alive”'
    claim: 'The dictionary’s example of the sense is “the quick and the dead”'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/quick'
    quote: 'who shall judge the quick and the dead'

  # ---------- note 124:5 ----------
  - where: 'note 124:5 “An army pictured as a flood, and why the waters are proud”'
    claim: 'Isaiah pictures the king of Assyria and his army as a river in flood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/8?lang=eng'
    quote: 'the Lord bringeth up upon them the waters of the river, strong and many, even the king of Assyria, and all his glory'
  - where: 'note 124:5 “An army pictured as a flood, and why the waters are proud”'
    claim: 'An older commentary compares the stream of verse 4 to Isaiah’s picture of the Assyrian'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/124.htm'
    quote: 'the hostile power which rolls over them is likened to an overflowing stream, as in Isaiah 8:7., the Assyrian'
  - where: 'note 124:5 “An army pictured as a flood, and why the waters are proud”'
    claim: 'The Hebrew adjective translated “proud” means insolent, raging'
    key: bdb
    url: 'https://biblehub.com/hebrew/2121.htm'
    quote: 'adjective insolent, raging, only plural and figurative'
  - where: 'note 124:5 “An army pictured as a flood, and why the waters are proud”'
    claim: 'A modern translation has “raging waters”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20124&version=NRSVUE'
    quote: 'the raging waters'
  - where: 'note 124:5 “An army pictured as a flood, and why the waters are proud”'
    claim: 'Psalm 123 ends with the contempt of the proud'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/123?lang=eng'
    quote: 'with the contempt of the proud'
  - where: 'note 124:5 “An army pictured as a flood, and why the waters are proud”'
    claim: 'The “proud” of Psalm 123:4 and of Psalm 124:5 are two different Hebrew words of like meaning, and the commentary sees the two psalms meeting in them'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/124.htm'
    quote: 'the two Psalms also meet in the synonymous new formations'

  # ---------- note 124:7 ----------
  - where: 'note 124:7 “The bird does not break the snare”'
    claim: 'A modern translation has “We have escaped” for “Our soul is escaped”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20124&version=NRSVUE'
    quote: 'We have escaped like a bird'
  - where: 'note 124:7 “The bird does not break the snare”'
    claim: 'Psalm 91:3 promises deliverance from the snare of the fowler'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/91?lang=eng'
    quote: 'Surely he shall deliver thee from the snare of the fowler, and from the noisome pestilence.'

  - where: 'note 124:7 “The bird does not break the snare”'
    claim: 'One older reading takes the beasts of prey of verse 6 as the enemies’ bloodthirstiness and the fowlers of verse 7 as their cunning'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/124.htm'
    quote: 'the enemies are conceived of as beasts of prey on account of their bloodthirstiness, just as the worldly empires are in the Book of Daniel; in Psalm 124:7 as "fowlers" on account of their cunning'

  # ---------- note 124:8 ----------
  - where: 'note 124:8 “The pilgrims’ confession of the Maker of heaven and earth”'
    claim: 'Psalm 121:2 has the same confession'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/121?lang=eng'
    quote: 'My help cometh from the Lord, which made heaven and earth.'
  - where: 'note 124:8 “The pilgrims’ confession of the Maker of heaven and earth”'
    claim: 'The last of the songs of degrees ends with the same title for the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/134?lang=eng'
    quote: 'The Lord that made heaven and earth bless thee out of Zion.'
  - where: 'note 124:8 “The pilgrims’ confession of the Maker of heaven and earth”'
    claim: 'The songs of degrees are Psalms 120–134, so 134 is the last of them'
    key: bd-degrees
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/degrees-songs-of?lang=eng'
    quote: 'Fifteen Psalms (120–34)'

  # ---------- christ ----------
  - where: christ
    claim: '“LORD” in the Old Testament usually stands for Jehovah, who is Jesus Christ before His birth'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Usually, when the word Lord appears in the Old Testament, it means “Jehovah.”'
  - where: christ
    claim: 'King Benjamin names Jesus Christ the Father of heaven and earth and the Creator'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/3?lang=eng'
    quote: 'And he shall be called Jesus Christ, the Son of God, the Father of heaven and earth, the Creator of all things from the beginning'

  # ---------- explore ----------
  - where: explore
    claim: 'Jacob’s words to Laban are an “Except… had been with me” sentence; the commentary cites the verse for the construction of verse 1'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/124.htm'
    quote: 'the older language makes use of the confirmatory כּי, Genesis 31:42'
  - where: explore
    claim: 'Genesis 31:42'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/31?lang=eng'
    quote: 'Except the God of my father, the God of Abraham, and the fear of Isaac, had been with me, surely thou hadst sent me away now empty.'
  - where: explore
    claim: 'A modern translation’s cross-references set Psalm 94:17 beside verse 1'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20124&version=NRSVUE'
    quote: '124.1 : Ps 94.17; 129.1'
  - where: explore
    claim: 'Psalm 94:17'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/94?lang=eng'
    quote: 'Unless the Lord had been my help, my soul had almost dwelt in silence.'

  # ---------- parallels ----------
  - where: parallels
    claim: 'Psalm 129:1 has the same call to Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/129?lang=eng'
    quote: 'may Israel now say'
  - where: parallels
    claim: 'Isaiah 8:7 pictures the Assyrian army as a river in flood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/8?lang=eng'
    quote: 'the waters of the river, strong and many, even the king of Assyria'
