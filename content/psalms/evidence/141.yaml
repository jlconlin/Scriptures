chapter: 141
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'The Church’s edition presents the psalm as David’s; its title is “A Psalm of David” and gives no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/141?lang=eng'
    quote: 'David pleads with the Lord to hear his prayers—The reproof of the righteous is a kindness.'
  - where: setting
    claim: 'One older reading counts Psalms 140–143 as four psalms bound to one another'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/141.htm'
    quote: 'The four Psalms, Psalm 140:1-13, Psalm 141:1-10, Psalm 142:1-7, and Psalm 143:1-12, are interwoven with one another in many ways'
  - where: setting
    claim: 'Psalm 140 has the snare and the gins set for the speaker'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/140?lang=eng'
    quote: 'The proud have hid a snare for me, and cords; they have spread a net by the wayside; they have set gins for me.'
  - where: setting
    claim: 'Psalm 142 has a snare laid in the speaker’s path'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/142?lang=eng'
    quote: 'In the way wherein I walked have they privily laid a snare for me.'
  - where: setting
    claim: 'One older reading places the psalm in Absalom’s revolt, with David cut off from worship on Zion, and calls it an evening hymn'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/141.htm'
    quote: 'At that time David was driven out of Jerusalem, and consequently cut off from the sacrificial worship of God upon Zion; and our Psalm is an evening hymn of one of those troublous days.'
  - where: setting
    claim: 'Incense was burned at evening as well as in the morning'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: 'And when Aaron lighteth the lamps at even, he shall burn incense upon it, a perpetual incense before the Lord throughout your generations.'
  - where: setting
    claim: 'A lamb was offered each evening'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'The one lamb thou shalt offer in the morning; and the other lamb thou shalt offer at even:'
  - where: setting
    claim: 'A modern translation notes that the meaning of the Hebrew of verses 5–7 is uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20141&version=NRSVUE'
    quote: 'Meaning of Heb of 141.5–7 is uncertain'
  - where: setting
    claim: 'The Greek translation reads verse 5 differently from the King James'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/141.htm'
    quote: 'but let not the oil of the sinner anoint my head'

  # ---------- sections ----------
  - where: section 2 plain
    claim: 'The “watch” before the mouth is a guard, and the “dainties” are delicacies'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20141&version=NRSVUE'
    quote: 'do not let me eat of their delicacies.'
  - where: section 2 plain
    claim: 'A modern translation has “Set a guard over my mouth”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20141&version=NRSVUE'
    quote: 'Set a guard over my mouth'
  - where: section 3 plain
    claim: 'The verb the King James renders “break” is given the sense “refuse” in this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/5106.htm'
    quote: 'refuse Psalm 141:5 ((text dubious see Che).'
  - where: section 3 plain
    claim: 'A modern translation has the head, not the oil, as what does not refuse'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20141&version=ESV'
    quote: 'let my head not refuse it.'
  - where: section 3 plain
    claim: 'The first verb of verse 7 is used here of ploughing the earth'
    key: bdb
    url: 'https://biblehub.com/hebrew/6398.htm'
    quote: 'Psalm 141:7 of cleaving, ploughing'
  - where: section 3 plain
    claim: 'The “sweet” words of verse 6 are pleasant words'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20141&version=NRSVUE'
    quote: 'then they shall learn that my words were pleasant.'
  - where: section 4 plain
    claim: 'The snares and gins are traps'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20141&version=NRSVUE'
    quote: 'Keep me from the trap that they have laid for me'

  # ---------- note 141:2 ----------
  - where: 'note 141:2 “The two evening offerings, and a prayer offered as they are”'
    claim: 'A modern translation has the prayer “counted as incense”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20141&version=NRSVUE'
    quote: 'Let my prayer be counted as incense before you'
  - where: 'note 141:2 “The two evening offerings, and a prayer offered as they are”'
    claim: 'Aaron burned incense every morning and again at evening'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: 'And when Aaron lighteth the lamps at even, he shall burn incense upon it'
  - where: 'note 141:2 “The two evening offerings, and a prayer offered as they are”'
    claim: 'The second lamb of the day was offered at even with a meat offering and a drink offering, for a sweet savour'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/29?lang=eng'
    quote: 'And the other lamb thou shalt offer at even, and shalt do thereto according to the meat offering of the morning, and according to the drink offering thereof, for a sweet savour'
  - where: 'note 141:2 “The two evening offerings, and a prayer offered as they are”'
    claim: 'The continual burnt offering was offered twice daily'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'a burnt offering, called the continual burnt offering, was offered twice daily, morning and evening.'
  - where: 'note 141:2 “The two evening offerings, and a prayer offered as they are”'
    claim: 'The priest offered the incense alone in the Holy Place while the congregation prayed outside'
    key: bd-incense
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/incense?lang=eng'
    quote: 'he returned to the congregation, who were praying outside'
  - where: 'note 141:2 “The two evening offerings, and a prayer offered as they are”'
    claim: 'The priest entered the Holy Place alone with the incense'
    key: bd-incense
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/incense?lang=eng'
    quote: 'then the priest to whom the lot had fallen entered alone into the Holy Place, carrying in a censer the incense, which he cast on the fire.'
  - where: 'note 141:2 “The two evening offerings, and a prayer offered as they are”'
    claim: 'In Luke the people pray outside at the time of incense'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'And the whole multitude of the people were praying without at the time of incense.'
  - where: 'note 141:2 “The two evening offerings, and a prayer offered as they are”'
    claim: 'Ezra prayed with hands spread out at the evening sacrifice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/9?lang=eng'
    quote: 'And at the evening sacrifice I arose up from my heaviness; and having rent my garment and my mantle, I fell upon my knees, and spread out my hands unto the Lord my God,'
  - where: 'note 141:2 “The two evening offerings, and a prayer offered as they are”'
    claim: 'Gabriel came to Daniel in prayer about the time of the evening oblation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: 'touched me about the time of the evening oblation.'

  # ---------- note 141:5 (first) ----------
  - where: 'note 141:5 “Why a blow from the righteous is welcome”'
    claim: 'Proverbs calls a friend’s wounds faithful'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/27?lang=eng'
    quote: 'Faithful are the wounds of a friend; but the kisses of an enemy are deceitful.'
  - where: 'note 141:5 “Why a blow from the righteous is welcome”'
    claim: 'The Joseph Smith Translation has the righteous smite “with the word of the Lord” and reads “shall not destroy my faith”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/141?lang=eng'
    quote: 'When the righteous smite me with the word of the Lord it is a kindness; and when they reprove me, it shall be an excellent oil, and shall not destroy my faith'
  - where: 'note 141:5 “Why a blow from the righteous is welcome”'
    claim: 'The verb the King James renders “break” means to hinder, restrain, frustrate'
    key: bdb
    url: 'https://biblehub.com/hebrew/5106.htm'
    quote: 'verb hinder, restrain, frustrate'
  - where: 'note 141:5 “Why a blow from the righteous is welcome”'
    claim: 'The lexicon gives the sense “refuse” for this verse and marks the text as doubtful'
    key: bdb
    url: 'https://biblehub.com/hebrew/5106.htm'
    quote: 'refuse Psalm 141:5 ((text dubious see Che).'
  - where: 'note 141:5 “Why a blow from the righteous is welcome”'
    claim: 'A modern translation renders the clause “let my head not refuse it”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20141&version=ESV'
    quote: 'let my head not refuse it.'

  # ---------- note 141:5 (second) ----------
  - where: 'note 141:5 “Whose calamities, and what kind of prayer”'
    claim: 'The Joseph Smith Translation makes the prayer one for “them” and adds a sentence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/141?lang=eng'
    quote: 'for yet my prayer also shall be for them. I delight not in their calamities.'
  - where: 'note 141:5 “Whose calamities, and what kind of prayer”'
    claim: 'The Greek translation has the oil of the sinner, and the prayer “in their pleasures”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/141.htm'
    quote: 'The righteous shall chasten me with mercy, and reprove me: but let not the oil of the sinner anoint my head: for yet shall my prayer also be in their pleasures.'
  - where: 'note 141:5 “Whose calamities, and what kind of prayer”'
    claim: 'A modern translation has the oil of the wicked'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20141&version=NRSVUE'
    quote: 'Never let the oil of the wicked anoint my head,'
  - where: 'note 141:5 “Whose calamities, and what kind of prayer”'
    claim: 'A modern translation makes the prayer one against the deeds of the wicked'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20141&version=NRSVUE'
    quote: 'for my prayer is continually against their wicked deeds.'
  - where: 'note 141:5 “Whose calamities, and what kind of prayer”'
    claim: 'That translation follows the Greek in verse 5 and notes that the meaning of the Hebrew is uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20141&version=NRSVUE'
    quote: '141.5 Gk: Meaning of Heb uncertain'

  # ---------- note 141:7 ----------
  - where: 'note 141:7 “Verses 6 and 7 are obscure, and translations differ”'
    claim: 'A modern translation notes that the meaning of the Hebrew of verses 5–7 is uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20141&version=NRSVUE'
    quote: 'Meaning of Heb of 141.5–7 is uncertain'
  - where: 'note 141:7 “Verses 6 and 7 are obscure, and translations differ”'
    claim: 'The verb behind “overthrown” means to let drop'
    key: bdb
    url: 'https://biblehub.com/hebrew/8058.htm'
    quote: 'verb let drop'
  - where: 'note 141:7 “Verses 6 and 7 are obscure, and translations differ”'
    claim: 'One older reading has the new rulers thrown down the precipices, and compares 2 Chronicles 25:12'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/141.htm'
    quote: 'the new rulers fall a prey to the indignation of the people and are thrown down the precipices'
  - where: 'note 141:7 “Verses 6 and 7 are obscure, and translations differ”'
    claim: 'Men were cast down from the top of the rock in 2 Chronicles 25:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/25?lang=eng'
    quote: 'and brought them unto the top of the rock, and cast them down from the top of the rock, that they all were broken in pieces.'
  - where: 'note 141:7 “Verses 6 and 7 are obscure, and translations differ”'
    claim: 'The Church’s footnote on “they” in verse 6 says the righteous'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/141?lang=eng'
    quote: 'IE the righteous.'
  - where: 'note 141:7 “Verses 6 and 7 are obscure, and translations differ”'
    claim: 'The Greek translation as printed has “our bones” and a lump of earth crushed on the ground'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/141.htm'
    quote: 'As a lump of earth is crushed upon the ground, our bones have been scattered by the mouth of the grave.'
  - where: 'note 141:7 “Verses 6 and 7 are obscure, and translations differ”'
    claim: 'A modern translation prints “their bones” and Sheol'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20141&version=NRSVUE'
    quote: 'so shall their bones be strewn at the mouth of Sheol.'
  - where: 'note 141:7 “Verses 6 and 7 are obscure, and translations differ”'
    claim: 'One older reading reports that some copies of the Greek and other ancient versions have “their”'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/141.htm'
    quote: 'beside which, however, is found the reading αὐτῶν (Cod. Alex. by a second hand, and the Syriac, Arabic, and Aethiopic versions)'
  - where: 'note 141:7 “Verses 6 and 7 are obscure, and translations differ”'
    claim: 'The lexicon takes the first verb of verse 7 as cleaving, ploughing the earth'
    key: bdb
    url: 'https://biblehub.com/hebrew/6398.htm'
    quote: 'Psalm 141:7 of cleaving, ploughing'
  - where: 'note 141:7 “Verses 6 and 7 are obscure, and translations differ”'
    claim: 'One older reading takes the ploughing as an image of hope: the bones lie as seed in turned earth'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/141.htm'
    quote: 'they do not lie there in order that they may continue lying, but that they may rise up anew, as the seed that is sown sprouts up out of the upturned earth.'
  - where: 'note 141:7 “Verses 6 and 7 are obscure, and translations differ”'
    claim: 'That reading finds the hope of a resurrection here, if not directly'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/141.htm'
    quote: 'We here discern the hope of a resurrection, if not directly, at least'
  - where: 'note 141:7 “Verses 6 and 7 are obscure, and translations differ”'
    claim: 'That reading limits the hope: at least an emblem of victory after defeat'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/141.htm'
    quote: 'emblem of victory in spite of having succumbed'

  # ---------- christ ----------
  - where: christ
    claim: 'The Church’s edition ties “prayer” in verse 2 to Revelation 5:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/141?lang=eng'
    quote: 'Rev. 5:8 (1–10).'
  - where: christ
    claim: 'The elders fall before the Lamb with vials of odours that are the prayers of saints'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/5?lang=eng'
    quote: 'the four beasts and four and twenty elders fell down before the Lamb, having every one of them harps, and golden vials full of odours, which are the prayers of saints.'
  - where: christ
    claim: 'An angel offers incense with the prayers of all saints at the golden altar before the throne'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/8?lang=eng'
    quote: 'that he should offer it with the prayers of all saints upon the golden altar which was before the throne.'
  - where: christ
    claim: 'The Bible Dictionary sets Psalm 141:2 beside Revelation 5:8 and 8:3–4 under Incense'
    key: bd-incense
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/incense?lang=eng'
    quote: 'See Ps. 141:2; Mal. 1:11; Rev. 5:8; 8:3–4.'

  # ---------- explore ----------
  - where: explore
    claim: 'Psalm 7 has the wicked fall into the ditch he made'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/7?lang=eng'
    quote: 'He made a pit, and digged it, and is fallen into the ditch which he made.'
  - where: explore
    claim: 'Nephi says the nations that war against Israel fall into the pit they digged'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/22?lang=eng'
    quote: 'they shall fall into the pit which they digged to ensnare the people of the Lord.'
  - where: explore
    claim: 'The pit digged for the destruction of men is filled by those who digged it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/14?lang=eng'
    quote: 'that great pit which hath been digged for the destruction of men shall be filled by those who digged it'
  - where: explore
    claim: 'The one who reproves is to show afterward an increase of love'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/121?lang=eng'
    quote: 'Reproving betimes with sharpness, when moved upon by the Holy Ghost; and then showing forth afterwards an increase of love toward him whom thou hast reproved'
  - where: explore
    claim: 'Elijah prayed on Carmel at the time of the evening sacrifice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/18?lang=eng'
    quote: 'And it came to pass at the time of the offering of the evening sacrifice, that Elijah the prophet came near'

  # ---------- parallels ----------
  - where: parallels
    claim: 'Incense rises with the prayers of the saints'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/8?lang=eng'
    quote: 'And the smoke of the incense, which came with the prayers of the saints, ascended up before God out of the angel’s hand.'
  - where: parallels
    claim: 'Aaron burns incense every morning'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: 'And Aaron shall burn thereon sweet incense every morning'
