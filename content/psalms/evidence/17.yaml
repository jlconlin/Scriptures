  # ---------- note 17:15 face ----------
  - where: 'note 17:15 “His face and His form”'
    claim: 'The last verse expects to behold the Lord’s face and see His likeness'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'he will ultimately behold the Lord’s face and see His likeness'
  - where: 'note 17:15 “His face and His form”'
    claim: 'The expectation is bold but shared by other psalms'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'This is a bold expectation but not a unique one in Psalms.'
  - where: 'note 17:15 “His face and His form”'
    claim: 'Temunah can be a made image (Exodus 20:4) or God’s own form (Numbers 12:8)'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'can refer to an image or statue (as in Exodus 20:4) or to something similar that represents God’s appearance, but it can also refer to God’s own form (as in Numbers 12:8)'
  - where: 'note 17:15 “His face and His form”'
    claim: 'The lexicon glosses the noun “likeness, form” and puts this verse with Numbers 12:8'
    key: bdb
    url: 'https://biblehub.com/hebrew/8544.htm'
    quote: 'Numbers 12:8; Psalm 17:15'
  - where: 'note 17:15 “His face and His form”'
    claim: 'The lexicon’s gloss'
    key: bdb
    url: 'https://biblehub.com/hebrew/8544.htm'
    quote: 'likeness, form'
  - where: 'note 17:15 “His face and His form”'
    claim: 'The Greek has “glory” where the Hebrew has “likeness,” and has the speaker appear before God’s face'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/17.htm'
    quote: 'But I shall appear in righteousness before thy face: I shall be satisfied when thy glory appears.'
  - where: 'note 17:15 “His face and His form”'
    claim: 'Several psalms suggest seeing God’s face in the temple'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Multiple passages suggest an experience of seeing God’s face in the temple.'
  - where: 'note 17:15 “His face and His form”'
    claim: 'Coming into God’s presence in His house and seeing Him is a theme of the psalms'
    key: skinner-seeing-god
    url: 'https://rsc.byu.edu/ascending-mountain-lord/seeing-god-his-temple-significant-theme-israels-psalms'
    quote: 'worshippers could come into the presence of God in his holy house in Jerusalem and see him face-to-face'
  - where: 'note 17:15 “His face and His form”'
    claim: 'Tsedeq in verse 15 is righteousness as ethically right'
    key: bdb
    url: 'https://biblehub.com/hebrew/6664.htm'
    quote: 'righteousness, as ethically right Job 35:2; Psalm 17:15'

  - where: 'note 17:15 “His face and His form”'
    claim: 'The last verse’s confidence rests on his righteousness'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'due to his righteousness, he will ultimately behold the Lord’s face'
  - where: 'note 17:15 “His face and His form”'
    claim: '“The right” in verse 1 is tsedeq (Strong’s 6664)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'צֶ֗דֶק'
  - where: 'note 17:15 “His face and His form”'
    claim: '“In righteousness” in verse 15 is the same noun'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בְּ֭/צֶדֶק'

  # ---------- note 17:15 awake ----------
  - where: 'note 17:15 “Awake from which sleep?”'
    claim: 'Three readings of the awakening: ordinary sleep, sleep in the temple, or the Resurrection'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'could refer to normal sleep, to sleeping in the temple or temple grounds, or to the Resurrection, after which the psalmist knows he will see God (as in Job 19:26)'
  - where: 'note 17:15 “Awake from which sleep?”'
    claim: 'The verb is used of waking from the sleep of death and of resurrection'
    key: bdb
    url: 'https://biblehub.com/hebrew/6974.htm'
    quote: 'of resurrection Isaiah 26:19; Daniel 12:2'
  - where: 'note 17:15 “Awake from which sleep?”'
    claim: 'The lexicon records that this verse has been placed under different senses: ordinary sleep (1a), the sleep of death (2), and the LORD’s awaking (1b)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6974.htm'
    quote: 'Psalm 17:15 is put by Thes Ol Hup Du and others below 1a; Ew De Che below 2; we below 1b'
  - where: 'note 17:15 “Awake from which sleep?”'
    claim: 'Sense 1b is the LORD’s awaking to activity'
    key: bdb
    url: 'https://biblehub.com/hebrew/6974.htm'
    quote: 'awake [from sleep] to activity'
  - where: 'note 17:15 “Awake from which sleep?”'
    claim: 'The Greek has the LORD’s glory appearing where the Hebrew has the awaking'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/17.htm'
    quote: 'I shall be satisfied when thy glory appears.'
  - where: 'note 17:15 “Awake from which sleep?”'
    claim: 'The Church’s edition points the word “awake” to the Topical Guide entry on the Resurrection'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/17?lang=eng'
    quote: 'TG Resurrection.'

  - where: 'note 17:15 “Awake from which sleep?”'
    claim: 'The verb’s first sense is waking from sleep'
    key: bdb
    url: 'https://biblehub.com/hebrew/6974.htm'
    quote: '1 from sleep,'
  - where: 'note 17:15 “Awake from which sleep?”'
    claim: 'Its second sense is waking from the sleep of death'
    key: bdb
    url: 'https://biblehub.com/hebrew/6974.htm'
    quote: '2 from sleep of death'

