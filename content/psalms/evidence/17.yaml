    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2017&version=NRSVUE'
    quote: 'May their bellies be filled with what you have stored up for them;'
  - where: 'note 17:14 “A portion in this life”'
    claim: 'The lexicon calls the text of the clause about children doubtful'
    key: bdb
    url: 'https://biblehub.com/hebrew/7646.htm'
