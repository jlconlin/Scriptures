chapter: 132
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The psalm prays for an anointed king for David’s sake, so David is past and the king is of his line'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/132?lang=eng'
    quote: 'How he sware unto the Lord, and vowed unto the mighty God of Jacob;'

  # ---- setting ----
  - where: 'setting'
    claim: 'Psalm 132 has eighteen verses; the next longest song of degrees, Psalm 122, has nine (counted with scripts/show.mjs for Psalms 120–134: 7, 8, 9, 4, 8, 5, 6, 5, 6, 8, 8, 3, 18, 3, 3)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/132?lang=eng'
    quote: 'Lord, remember David, and all his afflictions:'
  - where: 'setting'
    claim: 'Psalm 132 is listed among the royal psalms'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'Royal psalms. These psalms celebrated important events in the lives of royalty, which for Christian readers often reflected the royal life and reign of the Messiah: 2, 18, 20, 21, 45, 72, 89, 101, 110, 132, and 144.'
  - where: 'setting'
    claim: 'It is the only psalm that names the ark (scripts/occurrences.mjs psalms "ark" finds one verse, 132:8)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/132.htm'
    quote: 'It is the only Psalm in which the sacred Ark is mentioned.'
  - where: 'setting'
    claim: 'The psalm has long been understood as commemorating David’s finding of the ark and its transfer to Jerusalem'
    key: larsen-ascending-hill
    url: 'https://journal.interpreterfoundation.org/ascending-into-the-hill-of-the-lord-what-the-psalms-can-tell-us-about-the-rituals-of-the-first-temple/'
    quote: 'has long been understood to have been composed to commemorate King David’s finding of the Ark and its transfer to Jerusalem'
  - where: 'setting'
    claim: 'David brought the ark to his city and set it in a tent'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/6?lang=eng'
    quote: 'set it in his place, in the midst of the tabernacle that David had pitched for it'
  - where: 'setting'
    claim: 'Nathan brought the reply that the LORD would make David a house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'Also the Lord telleth thee that he will make thee an house.'
  - where: 'setting'
    claim: 'Solomon’s dedicatory prayer ends with the words of verses 8–10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/6?lang=eng'
    quote: 'turn not away the face of thine anointed: remember the mercies of David thy servant.'
  - where: 'setting'
    claim: 'Peter takes up the oath of verse 11 at Pentecost, in its words (sworn, fruit of his loins, his throne)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/2?lang=eng'
    quote: 'knowing that God had sworn with an oath to him, that of the fruit of his loins'
  - where: 'setting'
    claim: 'D&C 109 is the prayer at the dedication of the Kirtland Temple, and its last verse uses the words of verse 16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/109?lang=eng'
    quote: 'Prayer offered at the dedication of the temple at Kirtland, Ohio, March 27, 1836.'

  # ---- note 1 ----
  - where: 'note 132:1 “What David swore, and what it cost him”'
    claim: 'David told Nathan that he lived in cedar while the ark was in a tent'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'See now, I dwell in an house of cedar, but the ark of God dwelleth within curtains.'
  - where: 'note 132:1 “What David swore, and what it cost him”'
    claim: 'David’s son was to build the house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'He shall build an house for my name, and I will stablish the throne of his kingdom for ever.'
  - where: 'note 132:1 “What David swore, and what it cost him”'
    claim: 'David gathered materials for the temple and called the labor his trouble'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/22?lang=eng'
    quote: 'in my trouble I have prepared for the house of the Lord an hundred thousand talents of gold'
  - where: 'note 132:1 “What David swore, and what it cost him”'
    claim: 'Solomon’s prayer asks God to remember David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/6?lang=eng'
    quote: 'remember the mercies of David thy servant.'

  # ---- note 6 ----
  - where: 'note 132:6 “It is the ark, and the wood is Kirjath-jearim”'
    claim: 'The feminine pronoun in verse 6 refers to the ark'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/132.htm'
    quote: 'refers to the Ark of the covenant, which is fem. also in other instances'
  - where: 'note 132:6 “It is the ark, and the wood is Kirjath-jearim”'
    claim: 'The ark was brought to Kirjath-jearim and stayed twenty years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/7?lang=eng'
    quote: 'while the ark abode in Kirjath-jearim, that the time was long; for it was twenty years'
  - where: 'note 132:6 “It is the ark, and the wood is Kirjath-jearim”'
    claim: 'David went to Kirjath-jearim with all Israel to bring up the ark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/13?lang=eng'
    quote: 'And David went up, and all Israel, to Baalah, that is, to Kirjath-jearim, which belonged to Judah, to bring up thence the ark of God'
  - where: 'note 132:6 “It is the ark, and the wood is Kirjath-jearim”'
    claim: 'Kirjath-jearim means city of woods, lay 7½ miles from Jerusalem, and held the ark twenty years'
    key: bd-kirjath-jearim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kirjath-jearim?lang=eng'
    quote: 'City of woods. A town on the boundary between Judah and Benjamin, 7½ miles northwest of Jerusalem'
  - where: 'note 132:6 “It is the ark, and the wood is Kirjath-jearim”'
    claim: 'The Church’s footnote to verse 6 gives “the wood” as the Hebrew Ya’ar, a place (printed by scripts/footnotes.mjs psalms 132: “HEB Yaʼar (a place)”); the verse as it stands on the page'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/132?lang=eng'
    quote: 'Lo, we heard of it at Ephratah: we found it in the fields of the wood.'
  - where: 'note 132:6 “It is the ark, and the wood is Kirjath-jearim”'
    claim: 'A modern translation leaves the word as the name Jaar'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20132&version=NRSVUE'
    quote: 'we found it in the fields of Jaar.'
  - where: 'note 132:6 “It is the ark, and the wood is Kirjath-jearim”'
    claim: 'One older reading: Jaar is short for Kirjath-jearim'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/132.htm'
    quote: 'Jaar is a shortened name of the city of Kirjath-Jearim.'
  - where: 'note 132:6 “It is the ark, and the wood is Kirjath-jearim”'
    claim: 'Ephratah is the ancient name of Bethlehem, and the entry lists this verse'
    key: bd-ephrath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephrath?lang=eng'
    quote: 'Fruitful. Ancient name of Bethlehem (Gen. 35:16, 19; 48:7; Ruth 4:11; Ps. 132:6; Micah 5:2).'
  - where: 'note 132:6 “It is the ark, and the wood is Kirjath-jearim”'
    claim: 'The ark was never in Bethlehem'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/132.htm'
    quote: 'This is an ancient name of Bethlehem; but the Ark of the covenant never was in Bethlehem.'
  - where: 'note 132:6 “It is the ark, and the wood is Kirjath-jearim”'
    claim: 'One older reading (Hengstenberg’s, as Delitzsch reports it, and which Delitzsch himself does not follow): in Bethlehem the ark was known only by hearsay'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/132.htm'
    quote: 'We knew of it in Bethlehem (where David had spent his youth) only by hearsay, no one had seen it; we found it in Kirjath-Jearim'
  - where: 'note 132:6 “It is the ark, and the wood is Kirjath-jearim”'
    claim: 'David was of Bethlehem, an Ephrathite’s son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/17?lang=eng'
    quote: 'Now David was the son of that Ephrathite of Beth-lehem-judah, whose name was Jesse'

  # ---- note 8 ----
  - where: 'note 132:8 “Solomon ends his temple prayer with this call”'
    claim: 'Solomon’s dedicatory prayer closes with verse 8, a little changed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/6?lang=eng'
    quote: 'Now therefore arise, O Lord God, into thy resting place, thou, and the ark of thy strength'
  - where: 'note 132:8 “Solomon ends his temple prayer with this call”'
    claim: 'A proposal: the Chronicler knew a tradition in which the psalm accompanied a re-enactment of the ark’s procession'
    key: larsen-ascending-hill
    url: 'https://journal.interpreterfoundation.org/ascending-into-the-hill-of-the-lord-what-the-psalms-can-tell-us-about-the-rituals-of-the-first-temple/'
    quote: 'may indicate that he knew of a temple tradition in which Psalm 132 was sung to accompany a re-enactment of the procession of the Ark into the temple'

  # ---- note 11 ----
  - where: 'note 132:11 “Peter reads the oath of Christ”'
    claim: 'Nathan’s promise of a seed from David’s own body'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'I will set up thy seed after thee, which shall proceed out of thy bowels, and I will establish his kingdom.'
  - where: 'note 132:11 “Peter reads the oath of Christ”'
    claim: 'Peter takes up the oath and says it was of Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/2?lang=eng'
    quote: 'that of the fruit of his loins, according to the flesh, he would raise up Christ to sit on his throne;'
  - where: 'note 132:12 “What the “if” governs”'
    claim: 'Zedekiah’s sons were killed and he was taken to Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'And they slew the sons of Zedekiah before his eyes, and put out the eyes of Zedekiah, and bound him with fetters of brass, and carried him to Babylon.'
  - where: 'note 132:12 “What the “if” governs”'
    claim: 'Kings closes with Jerusalem and the temple destroyed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'Zedekiah is captured, Jerusalem and the temple are destroyed'
  - where: 'note 132:12 “What the “if” governs”'
    claim: 'Kings closes with Jehoiachin, king of Judah, in Babylon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'did lift up the head of Jehoiachin king of Judah out of prison;'
  - where: 'note 132:12 “What the “if” governs”'
    claim: 'One older reading: the condition is on the succession, not on the endlessness of the throne'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/132.htm'
    quote: 'were conditions of the continuity of the Davidic succession; not, however - because human unfaithfulness does not annul the faithfulness of God - of the endlessness of the Davidic throne.'
  - where: 'note 132:16 “Every request answered, and with more”'
    claim: 'Psalm 132 is listed among the psalms designed for antiphonal dialogue'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'These psalms are clearly designed for antiphonal dialogue in a way that worshippers could respond to the call of a priest'
  - where: 'note 132:16 “Every request answered, and with more”'
    claim: 'Solomon’s prayer has the priests clothed with salvation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/6?lang=eng'
    quote: 'let thy priests, O Lord God, be clothed with salvation, and let thy saints rejoice in goodness.'
  - where: 'note 132:16 “Every request answered, and with more”'
    claim: 'The Kirtland dedicatory prayer ends in the words of verse 16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/109?lang=eng'
    quote: 'And let these, thine anointed ones, be clothed with salvation, and thy saints shout aloud for joy. Amen, and Amen.'
  - where: 'note 132:16 “Every request answered, and with more”'
    claim: 'The Kirtland prayer was given by revelation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/109?lang=eng'
    quote: 'The prayer had been given to the Prophet and other Church leaders by revelation'

  # ---- note 17 ----
  - where: 'note 132:17 “The horn buds as the Branch grows”'
    claim: 'The verb of verse 17 (to cause to sprout) is the verb of Jeremiah 33:15; the lexicon lists both under the same sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/6779.htm'
    quote: 'horn (קֶרֶן) of Israel Ezekiel 29:21, of David Psalm 132:17'
  - where: 'note 132:17 “The horn buds as the Branch grows”'
    claim: 'The noun Branch is from that verb and names a future ruler from David’s line; the lexicon compares this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/6780.htm'
    quote: 'future ruler, under figure of sprout from Davidic tree (compare Psalm 132:17)'
  - where: 'note 132:17 “The horn buds as the Branch grows”'
    claim: 'A modern translation has the horn sprout'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20132&version=NRSVUE'
    quote: 'There I will cause a horn to sprout up for David;'
  - where: 'note 132:17 “The horn buds as the Branch grows”'
    claim: 'Jeremiah has the Branch made to grow up unto David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/33?lang=eng'
    quote: 'will I cause the Branch of righteousness to grow up unto David'
  - where: 'christ'
    claim: 'Zacharias speaks of a horn of salvation in the house of David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'And hath raised up an horn of salvation for us in the house of his servant David;'

  # ---- christ ----
  - where: 'christ'
    claim: 'One older reading: Zacharias speaks in Luke 1:68–70 with reference to this psalm'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/132.htm'
    quote: 'With reference to our Psalm, Zacharias, the father of John the Baptist, changes that supplicatory beracha of his nation (Luke 1:68-70) into a praiseful one'
  - where: 'parallels'
    claim: 'One older reading: Zacharias speaks in Luke 1:68–70 with reference to this psalm'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/132.htm'
    quote: 'With reference to our Psalm, Zacharias, the father of John the Baptist'

  - where: 'christ'
    claim: 'The Church’s heading calls the psalm messianic'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/132?lang=eng'
    quote: 'A messianic psalm'
  - where: 'christ'
    claim: 'Gabriel promises Mary’s son the throne of David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'the Lord God shall give unto him the throne of his father David'
  - where: 'christ'
    claim: 'Peter says the oath was fulfilled in Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/2?lang=eng'
    quote: 'he would raise up Christ to sit on his throne'

  # ---- explore ----
  - where: 'explore'
    claim: 'Psalm 89 mourns the king’s crown cast to the ground'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/89?lang=eng'
    quote: 'thou hast profaned his crown by casting it to the ground.'
  - where: 'explore'
    claim: 'After Solomon’s prayer fire came down and the glory filled the house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'Now when Solomon had made an end of praying, the fire came down from heaven'
  - where: 'explore'
    claim: 'Zechariah’s Branch builds the temple and sits on a throne'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/6?lang=eng'
    quote: 'Behold the man whose name is The Branch; and he shall grow up out of his place, and he shall build the temple of the Lord'
