chapter: 94
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'Psalm 94 has no title in the Church’s edition; the page gives a chapter heading and then verse 1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/94?lang=eng'
    quote: 'The Lord will judge the earth and all men'
  - where: setting
    claim: 'The ancient Greek translation gives the psalm a title: a psalm of David for the fourth day of the week'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/94.htm'
    quote: 'A Psalm of David for the fourth day of the week.'
  - where: setting
    claim: 'Delitzsch reports a Talmudic tradition that the psalm was the Wednesday song in the temple liturgy'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/94.htm'
    quote: 'that it was the Wednesday song in the Temple liturgy'
  - where: setting
    claim: 'Delitzsch sets the ascription to David aside and calls the psalm post-Davidic'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/94.htm'
    quote: 'however, is worthless. It is a post-Davidic Psalm'
  - where: setting
    claim: 'Delitzsch dates the psalm among the latest in the book'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/94.htm'
    quote: 'Accordingly the Psalm is one of the latest, but not necessarily a Maccabaean Psalm.'
  - where: setting
    claim: 'Psalm 93 opens with “The LORD reigneth”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/93?lang=eng'
    quote: 'The Lord reigneth, he is clothed with majesty'
  - where: setting
    claim: 'Paul quotes verse 11 in 1 Corinthians 3:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/3?lang=eng'
    quote: 'And again, The Lord knoweth the thoughts of the wise, that they are vain.'

  # ---------- thread ----------
  - where: thread
    claim: 'The verbs “chastiseth” and “teacheth” of verse 10 are the Hebrew verbs of “chastenest” and “teachest” in verse 12 (Strong’s 3256 and 3925 in both verses)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יֹסֵ֣ר'
  - where: thread
    claim: 'The psalm begins and ends with a doubled line'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/94.htm'
    quote: 'The Psalm closes with an anadiplosis, just as it began with one'
  - where: thread
    claim: 'A modern translation renders verse 22 as accomplished: the LORD has become my stronghold'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2094&version=NRSVUE'
    quote: 'But the Lord has become my stronghold'
  - where: thread
    claim: 'Delitzsch hears prophetic certainty in the verbs of verses 22 and 23'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/94.htm'
    quote: 'Prophetic certainty is expressed in'

  # ---------- sections ----------
  - where: section 1 plain
    claim: 'Verse 1: “God of vengeance … shine forth”; verse 2: give the proud what they deserve'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2094&version=NRSVUE'
    quote: 'you God of vengeance, shine forth!'
  - where: section 2 plain
    claim: 'Verses 3–7: the wicked exult, pour out arrogant words, crush the people; “the LORD does not see”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2094&version=NRSVUE'
    quote: 'They pour out their arrogant words;'
  - where: section 3 plain
    claim: 'Verse 8: “dullest of the people”; verse 11: thoughts are a breath'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2094&version=NRSVUE'
    quote: 'that they are but an empty breath.'
  - where: section 4 plain
    claim: 'Verse 13: respite from days of trouble until a pit is dug'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2094&version=NRSVUE'
    quote: 'giving them respite from days of trouble,'
  - where: section 5 plain
    claim: 'Verse 17: would soon have lived in the land of silence; verse 18: my foot is slipping'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2094&version=NRSVUE'
    quote: 'my soul would soon have lived in the land of silence.'
  - where: section 5 plain
    claim: 'Verse 19: the thoughts are anxious thoughts'
    key: bdb
    url: 'https://biblehub.com/hebrew/8312.htm'
    quote: 'disquieting thoughts'
  - where: section 6 plain
    claim: 'Verse 20: mischief contrived by statute; verse 21: they band together against the life of the righteous'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2094&version=NRSVUE'
    quote: 'They band together against the life of the righteous'
  - where: section 6 plain
    claim: 'Verse 20: the word behind “iniquity” means ruin or destruction'
    key: bdb
    url: 'https://biblehub.com/hebrew/1942.htm'
    quote: 'engulfing ruin, destruction'

  # ---------- note 94:1 ----------
  - where: 'note 94:1 “God of vengeance, asked to shine”'
    claim: 'The law says vengeance belongs to the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng'
    quote: 'To me belongeth vengeance, and recompence'
  - where: 'note 94:1 “God of vengeance, asked to shine”'
    claim: '“Shew thyself” is the Hiphil of yapha, to shine out or forth; BDB lists Deut. 33:2, Ps. 50:2, 80:2 (Hebrew numbering) and 94:1 together'
    key: bdb
    url: 'https://biblehub.com/hebrew/3313.htm'
    quote: 'shine out or forth, send out beams, cause to shine'
  - where: 'note 94:1 “God of vengeance, asked to shine”'
    claim: 'A modern translation renders the verb “shine forth!”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2094&version=NRSVUE'
    quote: 'you God of vengeance, shine forth!'
  - where: 'note 94:1 “God of vengeance, asked to shine”'
    claim: 'Psalm 80:1 asks the Shepherd of Israel to shine forth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/80?lang=eng'
    quote: 'thou that dwellest between the cherubims, shine forth.'

  # ---------- parallels (D&C 121) ----------
  - where: parallels
    claim: 'Joseph Smith’s prayer asks how long the Lord’s eye will behold and His ear be penetrated'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/121?lang=eng'
    quote: 'How long shall thy hand be stayed, and thine eye, yea thy pure eye, behold from the eternal heavens the wrongs of thy people and of thy servants, and thine ear be penetrated with their cries?'
  - where: parallels
    claim: 'The prayer asks the Lord to avenge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/121?lang=eng'
    quote: 'with thy sword avenge us of our wrongs.'
  - where: parallels
    claim: 'The answer promises Joseph triumph over his foes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/121?lang=eng'
    quote: 'thou shalt triumph over all thy foes.'

  # ---------- note 94:6 ----------
  - where: 'note 94:6 “The three the law put under God’s own care”'
    claim: 'Moses says the LORD executes judgment for the fatherless and widow and loves the stranger'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/10?lang=eng'
    quote: 'He doth execute the judgment of the fatherless and widow, and loveth the stranger, in giving him food and raiment.'
  - where: 'note 94:6 “The three the law put under God’s own care”'
    claim: 'The law forbids afflicting the widow and the fatherless'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/22?lang=eng'
    quote: 'Ye shall not afflict any widow, or fatherless child.'
  - where: 'note 94:6 “The three the law put under God’s own care”'
    claim: 'The law says the LORD will hear their cry'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/22?lang=eng'
    quote: 'If thou afflict them in any wise, and they cry at all unto me, I will surely hear their cry;'
  - where: 'note 94:6 “The three the law put under God’s own care”'
    claim: 'Psalm 82:3 charges the judges to defend the poor and fatherless'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/82?lang=eng'
    quote: 'Defend the poor and fatherless: do justice to the afflicted and needy.'

  # ---------- note 94:8 ----------
  - where: 'note 94:8 “Who is being called a fool”'
    claim: 'A modern translation has “O dullest of the people”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2094&version=NRSVUE'
    quote: 'Understand, O dullest of the people;'
  - where: 'note 94:8 “Who is being called a fool”'
    claim: 'Delitzsch takes the oppressors to be non-Israelites'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/94.htm'
    quote: 'non-Israelites, who despise the God of Israel and fear not His vengeance'
  - where: 'note 94:8 “Who is being called a fool”'
    claim: 'Delitzsch takes verse 8 as a turn to doubters among the oppressed people'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/94.htm'
    quote: 'to those among the people themselves, who have been puzzled about the omniscience and indirectly about the righteousness of God by the fact that this vengeance is delayed.'
  - where: 'note 94:8 “Who is being called a fool”'
    claim: 'Delitzsch rests that on the phrase “among the people”'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/94.htm'
    quote: 'refers the address expressly to a class of men among the people whom those oppress and slay'

  - where: 'note 94:11 “Paul quotes the verse against the wisdom of the world”'
    claim: 'Paul introduces the quotation by saying the wisdom of this world is foolishness with God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/3?lang=eng'
    quote: 'For the wisdom of this world is foolishness with God.'
  - where: 'note 94:11 “Paul quotes the verse against the wisdom of the world”'
    claim: 'Paul quotes the verse with “the wise” where the psalm has “man”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/3?lang=eng'
    quote: 'And again, The Lord knoweth the thoughts of the wise, that they are vain.'
  - where: 'note 94:11 “Paul quotes the verse against the wisdom of the world”'
    claim: 'The Greek translation of the psalm has “men”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/94.htm'
    quote: 'The Lord knows the thoughts of men, that they are vain.'
  - where: 'note 94:11 “Paul quotes the verse against the wisdom of the world”'
    claim: 'A modern translation renders “vanity” as an empty breath'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2094&version=NRSVUE'
    quote: 'that they are but an empty breath.'

  # ---------- note 94:12 ----------
  - where: 'note 94:12 “Why the chastened man is called blessed”'
    claim: 'Eliphaz calls the man God corrects happy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/5?lang=eng'
    quote: 'Behold, happy is the man whom God correcteth'
  - where: 'note 94:12 “Why the chastened man is called blessed”'
    claim: 'Hebrews says the Lord chastens whom He loves, and that chastening is grievous for the present'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/12?lang=eng'
    quote: 'For whom the Lord loveth he chasteneth'
  - where: 'note 94:12 “Why the chastened man is called blessed”'
    claim: 'The Lord says the same in D&C 95:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/95?lang=eng'
    quote: 'whom I love I also chasten that their sins may be forgiven, for with the chastisement I prepare a way for their deliverance'
  - where: 'note 94:12 “Why the chastened man is called blessed”'
    claim: 'Elder Christofferson named three purposes of divine chastening'
    key: christofferson-chasten
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2011/04/as-many-as-i-love-i-rebuke-and-chasten?lang=eng'
    quote: 'Divine chastening has at least three purposes: (1) to persuade us to repent, (2) to refine and sanctify us, and (3) at times to redirect our course in life to what God knows is a better path.'
  - where: 'note 94:12 “Why the chastened man is called blessed”'
    claim: 'The talk is by Elder D. Todd Christofferson'
    key: christofferson-chasten
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2011/04/as-many-as-i-love-i-rebuke-and-chasten?lang=eng'
    quote: 'By Elder D. Todd Christofferson'

  # ---------- parallels (1 Sam. 12; Rom. 11) ----------
  - where: parallels
    claim: 'Samuel tells Israel the LORD will not forsake His people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/12?lang=eng'
    quote: 'because it hath pleased the Lord to make you his people.'
  - where: parallels
    claim: 'Paul asks whether God has cast away His people and says He has not'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/11?lang=eng'
    quote: 'God hath not cast away his people which he foreknew.'

  # ---------- note 94:15 ----------
  - where: 'note 94:15 “Justice comes back”'
    claim: 'A modern translation has justice return to the righteous'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2094&version=NRSVUE'
    quote: 'for justice will return to the righteous,'
  - where: 'note 94:15 “Justice comes back”'
    claim: 'Delitzsch: right now subdued must again be justly administered'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/94.htm'
    quote: 'the right that is now subdued must at length be again strictly maintained and justly administered'
  - where: 'note 94:15 “Justice comes back”'
    claim: 'Delitzsch: the upright in heart will side with it'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/94.htm'
    quote: 'all such will side with it'

  # ---------- note 94:17 ----------
  - where: 'note 94:17 “Silence is the grave”'
    claim: 'BDB sets the word equal to Sheol in Psalm 94:17 and lists Psalm 115:17 beside it'
    key: bdb
    url: 'https://biblehub.com/hebrew/1745.htm'
    quote: '= שְׁאוֺל Psalm 94:17'
  - where: 'note 94:17 “Silence is the grave”'
    claim: 'A modern translation has “the land of silence”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2094&version=NRSVUE'
    quote: 'my soul would soon have lived in the land of silence.'
  - where: 'note 94:17 “Silence is the grave”'
    claim: 'Psalm 115:17 uses “silence” of the dead'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/115?lang=eng'
    quote: 'neither any that go down into silence.'
  - where: 'note 94:20 “Wrong done by law”'
    claim: 'A modern translation has “wicked rulers” and “by statute”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2094&version=NRSVUE'
    quote: 'Can wicked rulers be allied with you,'
  - where: 'note 94:20 “Wrong done by law”'
    claim: 'The same translation: those who contrive mischief by statute'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2094&version=NRSVUE'
    quote: 'those who contrive mischief by statute?'
  - where: 'note 94:20 “Wrong done by law”'
    claim: 'BDB: in Psalm 94:20 the phrase is the seat or tribunal of destruction, which ruins the innocent by injustice'
    key: bdb
    url: 'https://biblehub.com/hebrew/1942.htm'
    quote: 'the seat (tribunal) of destruction (i.e. which ruins the innocent by injustice)'
  - where: 'note 94:20 “Wrong done by law”'
    claim: 'BDB reads the phrase “according to law, right” and notes that others read “against law”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2706.htm'
    quote: 'according to law, right Psalm 94:20 (others against law)'
  - where: christ
    claim: 'The Church’s footnote on “judge” in verse 2 points to the Topical Guide entry on Jesus Christ as Judge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/94?lang=eng'
    quote: 'TG Jesus Christ, Judge.'
  - where: christ
    claim: 'Abraham calls the LORD the Judge of all the earth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/18?lang=eng'
    quote: 'Shall not the Judge of all the earth do right?'
  - where: christ
    claim: 'The Father has committed all judgment to the Son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/5?lang=eng'
    quote: 'For the Father judgeth no man, but hath committed all judgment unto the Son:'
  - where: christ
    claim: 'The risen Lord says He rebukes and chastens those He loves'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/3?lang=eng'
    quote: 'As many as I love, I rebuke and chasten: be zealous therefore, and repent.'
  - where: explore
    claim: 'Paul quotes “Vengeance is mine” in Romans 12:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/12?lang=eng'
    quote: 'for it is written, Vengeance is mine; I will repay, saith the Lord.'
  - where: explore
    claim: 'Psalm 10:11 has the wicked say that God will never see'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/10?lang=eng'
    quote: 'He hath said in his heart, God hath forgotten: he hideth his face; he will never see it.'
  - where: parallels
    claim: 'Hebrews 12 teaches that chastening afterward yields the peaceable fruit of righteousness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/12?lang=eng'
    quote: 'nevertheless afterward it yieldeth the peaceable fruit of righteousness'
