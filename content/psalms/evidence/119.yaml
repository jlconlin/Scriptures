chapter: 119
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The psalm has no title in the Church’s edition; it opens at verse 1 (footnotes.mjs psalms 119: “Title (verse 0 on the site): (none)”)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/119?lang=eng'
    quote: 'Blessed are the undefiled in the way, who walk in the law of the Lord.'

  # ---- setting ----
  - where: 'setting'
    claim: 'Psalm 119 is the longest chapter in the Bible'
    key: fun-hebrew-poetry
    url: 'https://www.churchofjesuschrist.org/inspiration/fun-with-hebrew-poetry?lang=eng'
    quote: 'It’s the longest chapter in the Bible!'
  - where: 'setting'
    claim: 'It has 176 verses in 22 stanzas of eight, each named for a Hebrew letter'
    key: fun-hebrew-poetry
    url: 'https://www.churchofjesuschrist.org/inspiration/fun-with-hebrew-poetry?lang=eng'
    quote: 'It’s 176 verses long, divided into 22 stanzas of eight verses each. Each stanza is named after a Hebrew letter'
  - where: 'setting'
    claim: 'The psalm is an acrostic in which every verse of a stanza begins with the stanza’s letter'
    key: scripture-helps-ps-102
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/34-psalms-102-103-110-116-119-127-128-135-139-146-150?lang=eng'
    quote: 'Psalm 119 is an acrostic poem. The psalm is divided into 22 stanzas, one for each letter of the Hebrew alphabet. Each of the 22 stanzas has eight verses.'
  - where: 'setting'
    claim: 'The Hallel is Psalms 113–118, recited at the great feasts'
    key: bd-hallel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hallel?lang=eng'
    quote: 'A name given to the group of Psalms (113–18) recited by Jews at the great feasts'
  - where: 'setting'
    claim: 'Psalm 19:7–9 praises the law under six names (law, testimony, statutes, commandment, fear, judgments)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/19?lang=eng'
    quote: 'The law of the Lord is perfect, converting the soul: the testimony of the Lord is sure, making wise the simple.'

  # ---- thread ----
  - where: 'thread'
    claim: 'Interpreters have denied that the psalm has any plan or progression'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/119.htm'
    quote: 'Hengstenberg, and Hupfeld renounce all attempts to show that there is any accordance whatever with a set plan, and find here a series of maxims without any internal progression and connection.'

  # ---- section plain ----
  - where: 'section 2 plain'
    claim: '“Hid in mine heart” (verse 11) is to store up or treasure'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20119&version=NRSVUE'
    quote: 'I treasure your word in my heart,'
  - where: 'section 4 plain'
    claim: '“Melteth for heaviness” (verse 28) is melting away for sorrow'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20119&version=NRSVUE'
    quote: 'My soul melts away for sorrow;'
  - where: 'section 11 plain'
    claim: 'The “bottle” of verse 83 is a skin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/119?lang=eng'
    quote: 'OR waterskin.'
  - where: 'section 12 plain'
    claim: '“An end of all perfection” (verse 96) is a limit to all perfection'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20119&version=NRSVUE'
    quote: 'I have seen a limit to all perfection,'
  - where: 'section 12 plain'
    claim: '“Settled in heaven” (verse 89) is firmly fixed'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20119&version=NRSVUE'
    quote: 'your word is firmly fixed in heaven.'
  - where: 'section 14 plain'
    claim: '“My soul is continually in my hand” (verse 109) is his life'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20119&version=NRSVUE'
    quote: 'I hold my life in my hand continually,'
  - where: 'section 17 plain'
    claim: '“The entrance of thy words” (verse 130) is their opening or unfolding'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20119&version=NRSVUE'
    quote: 'The unfolding of your words gives light;'
  - where: 'section 19 plain'
    claim: '“I prevented the dawning” (verse 147) is “I arose before the dawning”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/119?lang=eng'
    quote: 'HEB I arose before the dawning.'
  - where: 'section 19 plain'
    claim: '“Mine eyes prevent the night watches” (verse 148) is that his eyes were awake before the watch'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/119?lang=eng'
    quote: 'HEB Mine eyes were awake before the night watch.'
  - where: 'section 21 plain'
    claim: '“Nothing shall offend them” (verse 165) is that nothing makes them stumble'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20119&version=NRSVUE'
    quote: 'nothing can make them stumble.'

  # ---- note 119:1 Eight lines to every letter ----
  - where: 'note 119:1 “Eight lines to every letter”'
    claim: 'Other acrostic psalms change letter with every line; Psalm 119 repeats the letter for eight lines'
    key: gee-enlarge-heart
    url: 'https://cdn.interpreterfoundation.org/ifpdf/reprints/seek-ye-words-of-wisdom/Ricks-16-Gee.pdf'
    quote: 'Unlike other acrostic psalms where every line begins with a new letter of the alphabet, in Psalm 119, the same letter of the alphabet is repeated at the beginning of eight successive lines.'
  - where: 'note 119:1 “Eight lines to every letter”'
    claim: 'Lamentations 3 has three lines to a letter'
    key: gee-enlarge-heart
    url: 'https://cdn.interpreterfoundation.org/ifpdf/reprints/seek-ye-words-of-wisdom/Ricks-16-Gee.pdf'
    quote: 'In Lamentations 3 the same letter of the alphabet begins three successive lines.'
  - where: 'note 119:1 “Eight lines to every letter”'
    claim: 'Going through the alphabet suggests completeness, “from A to Z”; ease of remembering is the other reason suggested'
    key: fun-hebrew-poetry
    url: 'https://www.churchofjesuschrist.org/inspiration/fun-with-hebrew-poetry?lang=eng'
    quote: 'One reason might be that the structure makes the text easier to remember. Going through the whole alphabet also suggests completeness—it covers everything “from A to Z” (or from aleph to tau).'
  - where: 'note 119:1 “Eight lines to every letter”'
    claim: 'The acrostic shaped the wording of a line (verse 32)'
    key: gee-enlarge-heart
    url: 'https://cdn.interpreterfoundation.org/ifpdf/reprints/seek-ye-words-of-wisdom/Ricks-16-Gee.pdf'
    quote: 'Using the expression would destroy the acrostic in the Psalm because one would need to place the preposition in front of the first word in the sentence.'

  # ---- note 119:1 Eight names for one thing ----
  - where: 'note 119:1 “Eight names for one thing”'
    claim: 'Torah means direction, instruction, law'
    key: bdb
    url: 'https://biblehub.com/hebrew/8451.htm'
    quote: 'direction, instruction, law'
  - where: 'note 119:1 “Eight names for one thing”'
    claim: 'The lexicon’s first sense of torah is instruction, first of all a mother’s or a father’s'
    key: bdb
    url: 'https://biblehub.com/hebrew/8451.htm'
    quote: 'of a mother Proverbs 1:8; Proverbs 6:20,23; of a father Proverbs 3:1'
  - where: 'note 119:1 “Eight names for one thing”'
    claim: 'Two Hebrew words are both “word” in the King James: dabar (H1697, as in verse 105) and imrah (H565, as in verse 148); the quote is the stem of the verse 148 form'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אִמְרָתֶֽ'
  - where: 'note 119:1 “Eight names for one thing”'
    claim: 'A modern translation renders imrah in verse 148 as “promise”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20119&version=NRSVUE'
    quote: 'that I may meditate on your promise.'
  - where: 'note 119:1 “Eight names for one thing”'
    claim: 'The names are synonyms running through the whole psalm'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/119.htm'
    quote: 'a many-linked chain of synonyms which runs through the whole Psalm'
  - where: 'note 119:1 “Eight names for one thing”'
    claim: 'The Masora (the notes of the ancient Jewish scribes) found one of ten expressions in every verse but 122'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/119.htm'
    quote: '"In every verse," this is the observation of the Masora on Psalm 119:122, "v. 122 only excepted, we find one of the ten'

  # ---- note 119:9 ----
  - where: 'note 119:9 “Who is praying, and what has happened to him”'
    claim: 'One older reading: the poet is a young man, derided and persecuted'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/119.htm'
    quote: 'The poet is a young man, who finds himself in a situation which is clearly described: he is derided, oppressed, persecuted'
  - where: 'note 119:9 “Who is praying, and what has happened to him”'
    claim: 'The same reading supposes a date under Greek rule, and offers it as natural to suppose'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/119.htm'
    quote: 'It is natural to suppose that the composition of the Psalm falls in those times of the Greek domination in which the government was hostile'
  - where: 'note 119:9 “Who is praying, and what has happened to him”'
    claim: 'The same reading thinks the psalm the work of a prisoner'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/119.htm'
    quote: 'is the work of one in prison, who whiled away his time with this plaiting together of his complaints'
  - where: 'note 119:9 “Who is praying, and what has happened to him”'
    claim: 'The same reading infers his youth from verse 9, with verses 99–100 as corroboration'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/119.htm'
    quote: 'it is clear that the poet himself is a "young man," a fact that is also corroborated by Psalm 119:99, Psalm 119:100'

  # ---- note 119:25 ----
  - where: 'note 119:25 “Quicken me”'
    claim: 'A modern translation has “revive me” in verse 25'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20119&version=NRSVUE'
    quote: 'revive me according to your word.'
  - where: 'note 119:25 “Quicken me”'
    claim: 'A modern translation has “give me life” in verse 107'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20119&version=NRSVUE'
    quote: 'give me life, O Lord, according to your word.'

  # ---- note 119:32 ----
  - where: 'note 119:32 “An enlarged heart”'
    claim: 'The Church’s footnote on “heart” in verse 32 reads it as understanding'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/119?lang=eng'
    quote: 'IE understanding.'
  - where: 'note 119:32 “An enlarged heart”'
    claim: 'A modern translation has “enlarge my understanding”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20119&version=NRSVUE'
    quote: 'for you enlarge my understanding.'
  - where: 'note 119:32 “An enlarged heart”'
    claim: 'The idiom occurs only here in the Hebrew Bible'
    key: gee-enlarge-heart
    url: 'https://cdn.interpreterfoundation.org/ifpdf/reprints/seek-ye-words-of-wisdom/Ricks-16-Gee.pdf'
    quote: 'As a result, the expression is a hapax legomenon (an expression that occurs only once) in the Hebrew Bible.'
  - where: 'note 119:32 “An enlarged heart”'
    claim: 'The Egyptian idiom “to enlarge the heart” means to have joy'
    key: gee-enlarge-heart
    url: 'https://cdn.interpreterfoundation.org/ifpdf/reprints/seek-ye-words-of-wisdom/Ricks-16-Gee.pdf'
    quote: 'is literally “to enlarge the heart,” but it means “to have joy.”'
  - where: 'note 119:32 “An enlarged heart”'
    claim: 'On that reading the verse means he runs because God has brought him joy'
    key: gee-enlarge-heart
    url: 'https://cdn.interpreterfoundation.org/ifpdf/reprints/seek-ye-words-of-wisdom/Ricks-16-Gee.pdf'
    quote: 'As a calque on an Egyptian expression, Psalm 119:32 would mean, “I will run on the path of your commandments because you have brought me joy.”'
  - where: 'note 119:32 “An enlarged heart”'
    claim: 'The same study finds the idiom in the Book of Mormon, citing Alma 17:29'
    key: gee-enlarge-heart
    url: 'https://cdn.interpreterfoundation.org/ifpdf/reprints/seek-ye-words-of-wisdom/Ricks-16-Gee.pdf'
    quote: 'his heart was swollen within him with joy” (Alma 17:29)'
  - where: 'note 119:32 “An enlarged heart”'
    claim: 'The study concludes that the idiom came from Egyptian into Hebrew and into the Book of Mormon'
    key: gee-enlarge-heart
    url: 'https://cdn.interpreterfoundation.org/ifpdf/reprints/seek-ye-words-of-wisdom/Ricks-16-Gee.pdf'
    quote: 'So this idiom, originally from Egyptian and calqued into Hebrew, has also found its way into'
  - where: 'note 119:32 “An enlarged heart”'
    claim: '“Run” is used because “walk in the way” needs a preposition before the first word, which would break the acrostic'
    key: gee-enlarge-heart
    url: 'https://cdn.interpreterfoundation.org/ifpdf/reprints/seek-ye-words-of-wisdom/Ricks-16-Gee.pdf'
    quote: 'Using the expression would destroy the acrostic in the Psalm because one would need to place the preposition in front of the first word in the sentence.'
  - where: 'note 119:32 “An enlarged heart”'
    claim: 'Verse 32 begins with derek, “way” (H1870), whose first letter is daleth (the Hebrew text of Psalm 119:32 in the Open Scriptures file); the quote is that word'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'דֶּֽרֶךְ'

  # ---- note 119:71 ----
  - where: 'note 119:71 “What the affliction taught him”'
    claim: 'A modern translation has “humbled” in verse 67'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20119&version=NRSVUE'
    quote: 'Before I was humbled I went astray,'
  - where: 'note 119:71 “What the affliction taught him”'
    claim: 'A modern translation has “humbled” in verse 71'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20119&version=NRSVUE'
    quote: 'It is good for me that I was humbled,'

  # ---- note 119:83 ----
  - where: 'note 119:83 “A skin bottle hung in the smoke”'
    claim: 'The Hebrew word is a skin bottle, used for wine and milk'
    key: bdb
    url: 'https://biblehub.com/hebrew/4997.htm'
    quote: 'skin-bottle, skin'
  - where: 'note 119:83 “A skin bottle hung in the smoke”'
    claim: 'In this verse the simile is of a skin shrivelled and useless'
    key: bdb
    url: 'https://biblehub.com/hebrew/4997.htm'
    quote: 'i.e. shrivelled and useless Psalm 119:83'
  - where: 'note 119:83 “A skin bottle hung in the smoke”'
    claim: 'A modern translation has “wineskin in the smoke”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20119&version=NRSVUE'
    quote: 'For I have become like a wineskin in the smoke,'
  - where: 'note 119:83 “A skin bottle hung in the smoke”'
    claim: 'The lexicon records other explanations of the skin in the smoke'
    key: bdb
    url: 'https://biblehub.com/hebrew/4997.htm'
    quote: 'as black and wrinkled outwardly, while retaining the choice wine within'


  # ---- note 119:105 ----
  - where: 'note 119:105 “The word and the light”'
    claim: 'A modern translation has “the unfolding of your words” in verse 130'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20119&version=NRSVUE'
    quote: 'The unfolding of your words gives light;'
  - where: 'note 119:105 “The word and the light”'
    claim: 'In the Old Testament light, said of Jehovah, is often coupled with another word John uses of Jesus; Psalm 119:105 (word and light) is among the examples given'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'light, when used with reference to Jehovah, is often coupled with another word, a word that is used to describe Jesus in the Gospel of John'
  - where: 'note 119:105 “The word and the light”'
    claim: 'Because Jesus is Jehovah incarnate, those words may be applied to Him as John applies them'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'Because Jesus is Jehovah incarnate, all of the above words may appropriately be applied to Him as John does.'
  - where: 'note 119:105 “The word and the light”'
    claim: 'John calls Jesus the Word and Jesus says He is the light'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'as well as the Word (see John 1:1, 14). Jesus says that He is the light (see John 8:12)'

  # ---- note 119:165 ----
  - where: 'note 119:165 “Offend means cause to stumble”'
    claim: 'The Hebrew noun is a stumbling or stumbling block'
    key: bdb
    url: 'https://biblehub.com/hebrew/4383.htm'
    quote: 'a stumbling, means or occasion of stumbling, stumbling-block'
  - where: 'note 119:165 “Offend means cause to stumble”'
    claim: 'A modern translation has “nothing can make them stumble”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20119&version=NRSVUE'
    quote: 'nothing can make them stumble.'
  - where: 'note 119:165 “Offend means cause to stumble”'
    claim: 'Elder Bednar taught that to be offended is a choice'
    key: bednar-nothing-offend
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2006/10/and-nothing-shall-offend-them?lang=eng'
    quote: 'To be offended is a choice we make; it is not a condition inflicted or imposed upon us by someone or something else.'
  - where: 'note 119:165 “Offend means cause to stumble”'
    claim: 'He closed the address with the verse and with the Atonement as the source of strength'
    key: bednar-nothing-offend
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2006/10/and-nothing-shall-offend-them?lang=eng'
    quote: 'Through the strengthening power of the Atonement of Jesus Christ, you and I can be blessed to avoid and triumph over offense. “Great peace have they which love thy law: and nothing shall offend them” (Psalm 119:165).'

  # ---- note 119:176 ----
  - where: 'note 119:176 “The lost sheep of the last verse”'
    claim: 'One older reading sets the verse beside Isaiah 53:6'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/119.htm'
    quote: 'perhaps the accentuation is correct when it does not allow itself to be determined by Isaiah 53:6'
  - where: 'note 119:176 “The lost sheep of the last verse”'
    claim: 'The same reading finds the confession strange after the loyalty the psalm attests'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/119.htm'
    quote: 'which is attested a hundredfold in the Psalm, it may seem strange that he can say of himself'
  - where: 'note 119:176 “The lost sheep of the last verse”'
    claim: 'On that reading the lost sheep is one in imminent danger of destruction'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/119.htm'
    quote: 'and in imminent danger of total destruction'
  - where: 'note 119:176 “The lost sheep of the last verse”'
    claim: 'On that reading his going astray is not apostasy'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/119.htm'
    quote: 'his going astray is no apostasy; his home, to which he longs to return when he has been betrayed into by-ways, is beside the Lord.'

  # ---- christ ----
  - where: 'christ'
    claim: 'The Savior says He gave the law and covenanted with Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/15?lang=eng'
    quote: 'Behold, I am he that gave the law, and I am he who covenanted with my people Israel'
