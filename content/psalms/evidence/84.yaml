chapter: 84
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'The title gives the psalm to the sons of Korah and names no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/84?lang=eng'
    quote: 'To the chief Musician upon Gittith, A Psalm for the sons of Korah.'
  - where: setting
    claim: 'The Korah titles fall in two groups, 42 and 44–49, then 84–85 and 87–88'
    key: bd-korah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/korah?lang=eng'
    quote: 'formed a guild of musicians (2 Chr. 20:19; titles of Ps. 42; 44–49; 84–85; 87–88)'
  - where: setting
    claim: 'Psalm 84 is listed among the Songs of Zion, psalms that celebrate the temple on Zion and long to visit it'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'These psalms celebrate the location of the temple at Mount Zion, rejoice that the Lord’s presence is there, and express a longing to visit the temple that could have acted also as a call to worship: 46, 48, 76, 84, 87, and 122.'
  - where: setting
    claim: 'The law commanded the males of the covenant people to appear before the Lord three times a year, at Unleavened Bread, Weeks and Tabernacles'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'that is, in the Feast of Unleavened Bread, in the Feast of Weeks, and in the Feast of Tabernacles (Ex. 23:14–17; Deut. 16:16)'
  - where: setting
    claim: 'One older reading places the psalm in David’s flight from Absalom'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/84.htm'
    quote: 'for the poet is among the followers of David, the banished one'
  - where: setting
    claim: 'That reading dates the psalm to David’s persecution by Absalom'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/84.htm'
    quote: 'a Psalm belonging to the time of David''s persecution by Absalom'
  - where: setting
    claim: 'The Church’s footnote at “appeareth” in verse 7 refers to Deuteronomy 16:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/84?lang=eng'
    quote: 'Deut. 16:16'
  - where: setting
    claim: 'The same reading takes the poet for a Levite'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/84.htm'
    quote: 'the Levite poet means himself together with his family'
  - where: setting
    claim: 'The same reading has the poet praying for the king, not as the king'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/84.htm'
    quote: 'The prayer takes the form of an intercession for God''s anointed'
  - where: setting
    claim: 'Psalm 84 has been called the counterpart of Psalm 42'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/84.htm'
    quote: 'The origin of this Psalm has been treated of already in connection with its counterpart, Psalm 42:1.'

  # ---------- thread ----------
  - where: thread
    claim: 'The Hebrew exclamation ashre stands in verse 4'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אַ֭שְׁרֵי'
  - where: thread
    claim: 'The same word stands in verse 5'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אַשְׁרֵ֣י'
  - where: thread
    claim: 'The same word stands in verse 12'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אַֽשְׁרֵ֥י'
  - where: thread
    claim: 'The same word opens Psalm 1:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אַ֥שְֽׁרֵי'

  # ---------- sections ----------
  - where: 'section 1 plain'
    claim: '“Amiable are thy tabernacles” is “lovely is Thy dwelling place”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/84?lang=eng'
    quote: 'HEB lovely is Thy dwelling place.'
  - where: 'section 1 plain'
    claim: '“Crieth out” is a shout of joy; “Blessed” is “Happy”; “still praising” is “ever”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2084&version=NRSVUE'
    quote: 'my heart and my flesh sing for joy'
  - where: 'section 1 plain'
    claim: 'A modern translation has “Even the sparrow finds a home” and “Happy are those who live in your house”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2084&version=NRSVUE'
    quote: 'Happy are those who live in your house,'
  - where: 'section 2 plain'
    claim: 'The “ways” are highways'
    key: bdb
    url: 'https://biblehub.com/hebrew/4546.htm'
    quote: 'raised way, highway, public road (never of street in city)'
  - where: 'section 2 plain'
    claim: '“Make it a well” is “make it a place of springs”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2084&version=NRSVUE'
    quote: 'they make it a place of springs;'
  - where: 'section 2 plain'
    claim: 'The rain is the early rain, and it covers the valley with pools'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2084&version=NRSVUE'
    quote: 'the early rain also covers it with pools.'
  - where: 'section 4 plain'
    claim: '“A thousand” means a thousand elsewhere'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/84?lang=eng'
    quote: 'IE a thousand elsewhere.'
  - where: 'section 4 plain'
    claim: '“Be a doorkeeper” is to stand at the threshold'
    key: bdb
    url: 'https://biblehub.com/hebrew/5605.htm'
    quote: 'I choose standing at the threshold in the house of my God'

  # ---------- note 84:0 ----------
  - where: 'note 84:0 “The title’s terms, and the second group of Korah psalms”'
    claim: 'Korah’s descendants were musicians and doorkeepers; their titles are Psalms 42, 44–49, 84–85 and 87–88'
    key: bd-korah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/korah?lang=eng'
    quote: 'His descendants, the Korahites, or Korathites, formed a guild of musicians (2 Chr. 20:19; titles of Ps. 42; 44–49; 84–85; 87–88), while others held the responsible post of doorkeeper (porter in KJV) of the temple (1 Chr. 9:17–19).'

  # ---------- note 84:1 ----------
  - where: 'note 84:1 “Lovely in English, beloved in Hebrew”'
    claim: 'In older English “amiable” meant lovely, deserving of affection, and was usually said of persons'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/amiable'
    quote: 'deserving of affection; applied usually to persons. But in Psalms 84:1, there is an exception'
  - where: 'note 84:1 “Lovely in English, beloved in Hebrew”'
    claim: 'The Hebrew adjective is a poetic word meaning beloved'
    key: bdb
    url: 'https://biblehub.com/hebrew/3039.htm'
    quote: 'adjective (poetry) beloved'
  - where: 'note 84:1 “Lovely in English, beloved in Hebrew”'
    claim: 'The same adjective is used of Benjamin in Deuteronomy 33:12'
    key: bdb
    url: 'https://biblehub.com/hebrew/3039.htm'
    quote: 'construct יְדִיד Deuteronomy 33:12'
  - where: 'note 84:1 “Lovely in English, beloved in Hebrew”'
    claim: 'For this verse the lexicon gives “lovely”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3039.htm'
    quote: 'how lovely are thy habitations'
  - where: 'note 84:1 “Lovely in English, beloved in Hebrew”'
    claim: 'The adjective in verse 1 is this word, in the feminine plural'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יְּדִיד֥וֹת'
  - where: 'note 84:1 “Lovely in English, beloved in Hebrew”'
    claim: '“Tabernacles” is the plural of the word for a dwelling, set here with the verses that use it of God’s abode in Zion'
    key: bdb
    url: 'https://biblehub.com/hebrew/4908.htm'
    quote: 'God''s abode in Zion Ezekiel 37:27; Psalm 132:5; Psalm 132:7, compare Psalm 43:3; Psalm 84:2'

  # ---------- note 84:2 ----------
  - where: 'note 84:2 “A cry of joy, not of pain”'
    claim: 'The verb behind “crieth out” is a ringing cry of joy'
    key: bdb
    url: 'https://biblehub.com/hebrew/7442.htm'
    quote: 'give a ringing cry, in joy, exultation, especially in praise to'
  - where: 'note 84:2 “A cry of joy, not of pain”'
    claim: 'A modern translation has “sing for joy”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2084&version=NRSVUE'
    quote: 'my heart and my flesh sing for joy'
  - where: 'note 84:2 “A cry of joy, not of pain”'
    claim: 'The Greek has “exulted”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/84.htm'
    quote: 'my heart and my flesh have exulted in the living god.'
  - where: 'note 84:2 “A cry of joy, not of pain”'
    claim: 'The verb “longeth” is the one used in Genesis 31:30 of longing for a father’s house'
    key: bdb
    url: 'https://biblehub.com/hebrew/3700.htm'
    quote: 'Genesis 31:30 thou didst long sorely'

  # ---------- note 84:3 ----------
  - where: 'note 84:3 “Birds at home by the altars”'
    claim: 'One scholar the lexicon cites takes the swallow as a simile of quiet, peace and security'
    key: bdb
    url: 'https://biblehub.com/hebrew/1866.htm'
    quote: 'makes simile of quiet, peace, security'
  - where: 'note 84:3 “Birds at home by the altars”'
    claim: 'One older reading takes the bird as the singer himself'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/84.htm'
    quote: 'By the bird that has found a comfortable snug home on the place of the altars of Jahve in the Temple-court and in the Temple-house, he means himself.'
  - where: 'note 84:3 “Birds at home by the altars”'
    claim: 'On that reading the psalm does not raise the question whether birds really nested there'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/84.htm'
    quote: 'without giving any occasion for the discussion whether this has taken place in reality'

  # ---------- note 84:5 ----------
  - where: 'note 84:5 “Highways in the heart”'
    claim: 'The Hebrew of the clause is two words; the first is “highways”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מְ֝סִלּ֗וֹת'
  - where: 'note 84:5 “Highways in the heart”'
    claim: 'The second word is “in their heart”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בִּ/לְבָבָֽ/ם'
  - where: 'note 84:5 “Highways in the heart”'
    claim: 'The noun means a raised way or public road, never a city street'
    key: bdb
    url: 'https://biblehub.com/hebrew/4546.htm'
    quote: 'raised way, highway, public road (never of street in city)'
  - where: 'note 84:5 “Highways in the heart”'
    claim: 'The lexicon takes it here of the ascents to Zion'
    key: bdb
    url: 'https://biblehub.com/hebrew/4546.htm'
    quote: 'of the ascents to Zion in the mind of the pious Psalm 84:6'
  - where: 'note 84:5 “Highways in the heart”'
    claim: 'A modern translation supplies “to Zion”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2084&version=NRSVUE'
    quote: 'in whose heart are the highways to Zion.'
  - where: 'note 84:5 “Highways in the heart”'
    claim: 'and notes that the Hebrew lacks the words'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2084&version=NRSVUE'
    quote: 'Heb lacks to Zion'
  - where: 'note 84:5 “Highways in the heart”'
    claim: 'The Greek paraphrases'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/84.htm'
    quote: 'in his heart he has purposed to go up'

  # ---------- note 84:6 ----------
  - where: 'note 84:6 “A dry valley made a place of springs”'
    claim: 'The lexicon takes Baca as the balsam tree and the valley as “balsam-vale”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1057.htm'
    quote: 'Psalm 84:7 balsam-vale'
  - where: 'note 84:6 “A dry valley made a place of springs”'
    claim: 'The plural of the word is the trees of 2 Samuel 5:23–24'
    key: bdb
    url: 'https://biblehub.com/hebrew/1057.htm'
    quote: '2 Samuel 5:23,24 = 1 Chronicles 14:14,15'
  - where: 'note 84:6 “A dry valley made a place of springs”'
    claim: 'The Greek has “the valley of weeping”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/84.htm'
    quote: 'the valley of weeping'
  - where: 'note 84:6 “A dry valley made a place of springs”'
    claim: 'One older commentary denies that the name means weeping'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/84.htm'
    quote: 'does not signify the "Valley of weeping," as Hupfeld at last renders it'
  - where: 'note 84:6 “A dry valley made a place of springs”'
    claim: 'It takes the tree as one common in arid valleys, which could give its name to an arid valley'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/84.htm'
    quote: 'which is very common in the arid valley of Mecca, and therefore might also have given its name to some arid valley of the Holy Land'
  - where: 'note 84:6 “A dry valley made a place of springs”'
    claim: 'A modern translation has “a place of springs”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2084&version=NRSVUE'
    quote: 'they make it a place of springs;'
  - where: 'note 84:6 “A dry valley made a place of springs”'
    claim: 'The Hebrew word as the text has it is tagged as the word for blessing'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בְּ֝רָכ֗וֹת'
  - where: 'note 84:6 “A dry valley made a place of springs”'
    claim: 'The lexicon renders the clause with “blessings”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1293.htm'
    quote: 'yea, the early rain covereth with blessings Psalm 84:7'
  - where: 'note 84:6 “A dry valley made a place of springs”'
    claim: 'The word for a pool is a separate noun of the same consonants'
    key: bdb
    url: 'https://biblehub.com/hebrew/1295.htm'
    quote: 'noun feminine pool, pond'
  - where: 'note 84:6 “A dry valley made a place of springs”'
    claim: 'A modern translation keeps “pools”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2084&version=NRSVUE'
    quote: 'the early rain also covers it with pools.'
  - where: 'note 84:6 “A dry valley made a place of springs”'
    claim: 'The Greek has “blessings”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/84.htm'
    quote: 'for there the law-giver will grant blessings'
  - where: 'note 84:6 “A dry valley made a place of springs”'
    claim: 'The rain is the early rain'
    key: bdb
    url: 'https://biblehub.com/hebrew/4175.htm'
    quote: '(early) rain'
  - where: 'note 84:6 “A dry valley made a place of springs”'
    claim: 'The early rain is the autumn rain on the sown fields'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/84.htm'
    quote: 'a gentle rain, like that which refreshes the sown fields in the autumn'
  - where: 'note 84:6 “A dry valley made a place of springs”'
    claim: 'One reading: the pilgrims’ faith brings the water, and God answers with rain'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/84.htm'
    quote: 'Not only does their faith bring forth water out of the sand and rock of the desert, but God also on His part lovingly anticipates their love'
  - where: 'note 84:6 “A dry valley made a place of springs”'
    claim: 'The same reading sets the verse beside Isaiah 35:7 and 41:18, where God does it'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/84.htm'
    quote: 'as being wrought by the omnipotence of God, who brings His people home to Zion, appears here as the result of the power of faith'

  # ---------- note 84:7 ----------
  - where: 'note 84:7 “The law’s word for coming to the feasts”'
    claim: 'The law commanded the males of the covenant people to appear before the Lord three times a year'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The law commanded that three times a year all the males of the covenant people were to appear before the Lord in the place that He should choose'
  - where: 'note 84:7 “The law’s word for coming to the feasts”'
    claim: 'The command was seldom observed in Old Testament times'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'It was not and could not be generally or even frequently observed.'
  - where: 'note 84:7 “The law’s word for coming to the feasts”'
    claim: 'Elkanah went up once a year'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'Elkanah, a pious Israelite of the times of the later Judges, went up to Shiloh once a year'
  - where: 'note 84:7 “The law’s word for coming to the feasts”'
    claim: 'The verb of verse 7'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יֵרָאֶ֖ה'
  - where: 'note 84:7 “The law’s word for coming to the feasts”'
    claim: 'The same verb in the same form in Deuteronomy 16:16'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'יֵרָאֶ֨ה'
  - where: 'note 84:7 “The law’s word for coming to the feasts”'
    claim: 'The lexicon lists this verse (Hebrew 84:8) under the sense “appear, present oneself,” before God'
    key: bdb
    url: 'https://biblehub.com/hebrew/7200.htm'
    quote: 'appear, of man, = present oneself'
  - where: 'note 84:7 “The law’s word for coming to the feasts”'
    claim: 'The Greek has God as the one seen'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/84.htm'
    quote: 'the God of gods shall be seen in Sion.'
  - where: 'note 84:7 “The law’s word for coming to the feasts”'
    claim: 'A modern translation reads the same'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2084&version=NRSVUE'
    quote: 'the God of gods will be seen in Zion.'
  - where: 'note 84:7 “The law’s word for coming to the feasts”'
    claim: 'Seeing God has been called the preeminent image in the Psalms for the experience of God in the temple, with 84:7 listed'
    key: skinner-seeing-god
    url: 'https://rsc.byu.edu/ascending-mountain-lord/seeing-god-his-temple-significant-theme-israels-psalms'
    quote: '‘Seeing God’ is the preeminent image [in the Psalms] for the experience of God in the temple (Psalm. 17:15; 42:2; 63:2; 84:7; cf. 11:7; Job 33:26)'
  - where: 'note 84:7 “The law’s word for coming to the feasts”'
    claim: 'The Church’s footnote at “appeareth” refers to Deuteronomy 16:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/84?lang=eng'
    quote: 'Deut. 16:16'

  # ---------- note 84:9 ----------
  - where: 'note 84:9 “Is the shield God or the anointed?”'
    claim: '“Our shield” is the first word of the verse in Hebrew'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מָ֭גִנֵּ/נוּ'
  - where: 'note 84:9 “Is the shield God or the anointed?”'
    claim: 'The last word of the verse is “thine anointed”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מְשִׁיחֶֽ/ךָ'
  - where: 'note 84:9 “Is the shield God or the anointed?”'
    claim: 'A modern translation makes the shield the one God is asked to look at'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2084&version=NRSVUE'
    quote: 'Behold our shield, O God;'
  - where: 'note 84:9 “Is the shield God or the anointed?”'
    claim: 'That translation cross-references Psalm 2:2 at this verse'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2084&version=NRSVUE'
    quote: '84.9 : Gen 15.1; Ps 2.2'
  - where: 'note 84:9 “Is the shield God or the anointed?”'
    claim: 'The lexicon lists verses 9 and 11 (Hebrew 10 and 12) among those where the shield is the LORD'
    key: bdb
    url: 'https://biblehub.com/hebrew/4043.htm'
    quote: 'as defence of his servants'
  - where: 'note 84:9 “Is the shield God or the anointed?”'
    claim: 'The lexicon’s list includes this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/4043.htm'
    quote: 'Psalm 84:10; Psalm 84:12'
  - where: 'note 84:9 “Is the shield God or the anointed?”'
    claim: 'The lexicon lists “thine anointed” of this verse (Hebrew 84:10) under the high priest of Israel'
    key: bdb
    url: 'https://biblehub.com/hebrew/4899.htm'
    quote: 'high priest of Israel'
  - where: 'note 84:9 “Is the shield God or the anointed?”'
    claim: 'That list names this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/4899.htm'
    quote: 'Psalm 84:10'

  # ---------- note 84:10 ----------
  - where: 'note 84:10 “Standing at the threshold”'
    claim: 'The verb means to stand at, or guard, the threshold'
    key: bdb
    url: 'https://biblehub.com/hebrew/5605.htm'
    quote: 'stand at, or guard, the threshold'
  - where: 'note 84:10 “Standing at the threshold”'
    claim: 'The lexicon’s rendering of the clause, with “I choose”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5605.htm'
    quote: 'I choose standing at the threshold in the house of my God'
  - where: 'note 84:10 “Standing at the threshold”'
    claim: 'The verb of the clause in the Hebrew text'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הִ֭סְתּוֹפֵף'
  - where: 'note 84:10 “Standing at the threshold”'
