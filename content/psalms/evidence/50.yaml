chapter: 50
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The title ascribes the psalm to Asaph and gives no occasion'
    key: bd-asaph
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/asaph?lang=eng'
    quote: 'mentioned in the titles of various Psalms.'

  # ---- setting ----
  - where: 'setting'
    claim: 'The series of psalms of the sons of Korah closes with Psalm 49, just before this psalm'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/50.htm'
    quote: 'With the preceding Psalm the series of the Korahitic Elohim-Psalms of the primary collection (Psalm 1:1) closes.'
  - where: 'setting'
    claim: 'Psalm 51 takes up sacrifice again'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/51?lang=eng'
    quote: 'For thou desirest not sacrifice; else would I give it: thou delightest not in burnt offering.'
  - where: 'setting'
    claim: 'The psalms that bear Asaph’s name are Psalm 50 and Psalms 73–83'
    key: bd-asaph
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/asaph?lang=eng'
    quote: 'Ps. 50; 73–83.'
  - where: 'setting'
    claim: 'Psalm 50 is the only psalm of Asaph in the first collection; the main group is in the third book'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/50.htm'
    quote: 'the principal group of them is to be found in the third book (Psalm 73:1), and the primary collection contains only one of them, viz., Psalm 50'
  - where: 'setting'
    claim: 'The psalms of Asaph have a prophetic and judicial character, with God introduced as speaking'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/50.htm'
    quote: 'they are distinguished from the Korahitic Psalms by their prophetically judicial character. As in the prophets, God is frequently introduced as speaking'
  - where: 'setting'
    claim: 'The fire and storm are read as heralding the Lawgiver of Sinai, so they recall Sinai'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/50.htm'
    quote: 'Fire and storm are the harbingers of the Lawgiver of Sinai who now appears as Judge.'
  - where: 'setting'
    claim: 'The chapter heading of the Church’s edition reads the psalm of the Second Coming'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/50?lang=eng'
    quote: 'Asaph speaks of the Second Coming'

  # ---- thread ----
  - where: 'thread'
    claim: 'Verse 14 has the verb “sacrifice” with the noun todah, “thanksgiving”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תּוֹדָ֑ה'
  - where: 'thread'
    claim: 'Verse 23 has the same verb and noun, “one who sacrifices thanksgiving”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'זֹבֵ֥חַ'

  # ---- sections ----
  - where: 'section 2 plain'
    claim: 'Verse 8: the burnt offerings are continually before God'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2050&version=NRSVUE'
    quote: 'your burnt offerings are continually before me.'
  - where: 'section 3 plain'
    claim: 'Verse 16: the Church’s footnote gives “What authority have you”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/50?lang=eng'
    quote: 'What authority have you'
  - where: 'section 3 plain'
    claim: 'Verse 21: “set them in order” as laying out a case'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2050&version=NRSVUE'
    quote: 'But now I rebuke you and lay the charge before you.'
  - where: 'section 4 plain'
    claim: 'Verse 23: “ordereth his conversation aright” is going the right way'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2050&version=NRSVUE'
    quote: 'to those who go the right way,'

  # ---- note 50:0 ----
  - where: 'note 50:0 “Asaph the seer”'
    claim: 'Asaph was a Levite who led David’s choir and founded a family of singers'
    key: bd-asaph
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/asaph?lang=eng'
    quote: 'A cymbal-playing Levite appointed leader of David’s choir. Founded a family of singers called the “sons of Asaph” or “children of Asaph”'
  - where: 'note 50:0 “Asaph the seer”'
    claim: 'Asaph was chief of the Levites before the ark and played cymbals'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'but Asaph made a sound with cymbals;'
  - where: 'note 50:0 “Asaph the seer”'
    claim: 'The sons of Asaph, Heman and Jeduthun were set apart to prophesy with instruments'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/25?lang=eng'
    quote: 'who should prophesy with harps, with psalteries, and with cymbals'
  - where: 'note 50:0 “Asaph the seer”'
    claim: 'Chronicles calls Asaph a seer and names his words beside David’s'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/29?lang=eng'
    quote: 'with the words of David, and of Asaph the seer.'
  - where: 'note 50:0 “Asaph the seer”'
    claim: 'The guild lasted until after the exile, and some psalms of Asaph may be by its later musicians'
    key: scripture-helps-ps-49
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/33-psalms-49-51-61-66-69-72-77-78-85-86?lang=eng'
    quote: 'Asaph is credited with composing Psalms 50 and 73–83, though some of these may have been written by successive musicians of his guild.'
  - where: 'note 50:0 “Asaph the seer”'
    claim: 'The guild continued until after the Babylonian exile; the sons of Korah were also temple singers'
    key: scripture-helps-ps-49
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/33-psalms-49-51-61-66-69-72-77-78-85-86?lang=eng'
    quote: 'He established a guild of musicians that continued until after the Babylonian exile. Like the sons of Korah, Asaph’s group also served as temple singers.'
  - where: 'note 50:0 “Asaph the seer”'
    claim: 'Twelve psalms carry the name: Psalm 50 and Psalms 73–83'
    key: bd-asaph
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/asaph?lang=eng'
    quote: 'Ps. 50; 73–83.'

  # ---- note 50:1 ----
  - where: 'note 50:1 “Three names in a row”'
    claim: 'Verse 1 has El, Elohim and the divine name in succession'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֱֽלֹהִ֡ים'
  - where: 'note 50:1 “Three names in a row”'
    claim: 'A modern translation keeps three names'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2050&version=NRSVUE'
    quote: 'The mighty one, God the Lord,'
  - where: 'note 50:1 “Three names in a row”'
    claim: 'The Greek takes the first two as “The God of gods”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/50.htm'
    quote: 'The God of gods, the Lord, has spoken'
  - where: 'note 50:1 “Three names in a row”'
    claim: 'Joshua 22:22 has the same three Hebrew names, twice'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'אֱלֹהִ֨ים'
  - where: 'note 50:1 “Three names in a row”'
    claim: 'The eastern tribes, accused of rebellion, call on God by these names'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'The Lord God of gods, the Lord God of gods, he knoweth, and Israel he shall know; if it be in rebellion'

  # ---- note 50:3 ----
  - where: 'note 50:3 “The God of Sinai comes to speak”'
    claim: 'Sinai was covered with thunder, lightning and cloud'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng'
    quote: 'there were thunders and lightnings, and a thick cloud upon the mount'
  - where: 'note 50:3 “The God of Sinai comes to speak”'
    claim: '“Our God shall come” has been set beside the promise that the Lord would come down on Sinai'
    key: sc-knowhy-90
    url: 'https://scripturecentral.org/knowhy/did-abinadi-prophesy-during-pentecost'
    quote: '“Our God shall come” (Psalm 50:3); On “the third day the Lord will come down” (Exodus 19:11)'
  - where: 'note 50:3 “The God of Sinai comes to speak”'
    claim: 'Verse 7 echoes the opening of the Ten Commandments'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'I am the Lord thy God, which have brought thee out of the land of Egypt, out of the house of bondage.'
  - where: 'note 50:3 “The God of Sinai comes to speak”'
    claim: 'It has been argued that Psalms 50 and 81 were sung at Pentecost'
    key: sc-knowhy-90
    url: 'https://scripturecentral.org/knowhy/did-abinadi-prophesy-during-pentecost'
    quote: 'Hebrew University professor Moshe Weinfeld argued that Psalms 50 and 81 were likely sung at Pentecost.'
  - where: 'note 50:3 “The God of Sinai comes to speak”'
    claim: 'Pentecost celebrated the giving of the law at Sinai'
    key: sc-knowhy-90
    url: 'https://scripturecentral.org/knowhy/did-abinadi-prophesy-during-pentecost'
    quote: 'which celebrated the giving of the Law to Moses on Mount Sinai'
  - where: 'note 50:3 “The God of Sinai comes to speak”'
    claim: 'The verb “keep silence” in verse 3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יֶ֫חֱרַ֥שׁ'
  - where: 'note 50:3 “The God of Sinai comes to speak”'
    claim: 'Verse 21 has the same verb, “I kept silence”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הֶחֱרַ֗שְׁתִּי'

  - where: 'note 50:3 “The God of Sinai comes to speak”'
    claim: 'The Church’s footnote on “God” in verse 7 refers to the opening of the Ten Commandments'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/50?lang=eng'
    quote: 'Ex. 20:2'

  # ---- note 50:4 ----
  - where: 'note 50:4 “Heaven and earth as witnesses”'
    claim: 'Moses called heaven and earth to witness against Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/4?lang=eng'
    quote: 'I call heaven and earth to witness against you this day'
  - where: 'note 50:4 “Heaven and earth as witnesses”'
    claim: 'The song of Moses opens by addressing the heavens and the earth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng'
    quote: 'Give ear, O ye heavens, and I will speak; and hear, O earth, the words of my mouth.'
  - where: 'note 50:4 “Heaven and earth as witnesses”'
    claim: 'Isaiah opens with the same address and a charge of rebellion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/1?lang=eng'
    quote: 'Hear, O heavens, and give ear, O earth: for the Lord hath spoken, I have nourished and brought up children, and they have rebelled against me.'
  - where: 'note 50:4 “Heaven and earth as witnesses”'
    claim: 'Verses 4–7 have been described as God’s lawsuit against His people'
    key: sc-knowhy-90
    url: 'https://scripturecentral.org/knowhy/did-abinadi-prophesy-during-pentecost'
    quote: 'Psalm 50:4–7 has been described as God’s lawsuit against his people'

  # ---- note 50:5 covenant ----
  - where: 'note 50:5 “A covenant cut over sacrifice”'
    claim: 'The Hebrew has a participle of the verb “cut” with “my covenant” and “over sacrifice”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'כֹּרְתֵ֖י'
  - where: 'note 50:5 “A covenant cut over sacrifice”'
    claim: 'To cut a covenant is to make one, explained from the cutting up of the sacrificial victim; this verse is listed'
    key: bdb
    url: 'https://biblehub.com/hebrew/3772.htm'
    quote: 'cut, or make a covenant (because of the cutting up and distribution of the flesh of the victim for eating in the sacrifice of the covenants'
  - where: 'note 50:5 “A covenant cut over sacrifice”'
    claim: 'The covenant sacrifice of the verse has been read as that of Exodus 24'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/50.htm'
    quote: 'In a covenant relationship, consecrated and ratified by a covenant sacrifice'
  - where: 'note 50:5 “A covenant cut over sacrifice”'
    claim: 'At Sinai burnt offerings and peace offerings were sacrificed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: 'which offered burnt offerings, and sacrificed peace offerings of oxen unto the Lord.'
  - where: 'note 50:5 “A covenant cut over sacrifice”'
    claim: 'Moses sprinkled the blood of the covenant on the people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/24?lang=eng'
    quote: 'Behold the blood of the covenant, which the Lord hath made with you concerning all these words.'
  - where: 'note 50:5 “A covenant cut over sacrifice”'
    claim: 'A modern translation has “my faithful ones”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2050&version=NRSVUE'
    quote: '“Gather to me my faithful ones,'
  - where: 'note 50:5 “A covenant cut over sacrifice”'
    claim: 'The Hebrew word for “saints” is hasid, the pious or godly; this verse is listed'
    key: bdb
    url: 'https://biblehub.com/hebrew/2623.htm'
    quote: 'my pious ones Psalm 50:5'
  - where: 'note 50:5 “A covenant cut over sacrifice”'
    claim: 'The accused bear names that express their relationship to God, not their state of heart'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/50.htm'
    quote: 'are mentioned by names which, without their state of mind and heart corresponding to them, express the relationship to Himself in which God has placed them'

  # ---- note 50:5 gathering ----
  - where: 'note 50:5 “The gathering before the Lord comes”'
    claim: 'The Lectures on Faith read verses 3–5 of a gathering in the last days before the Lord comes'
    key: jsp-dc-1835
    url: 'https://www.josephsmithpapers.org/paper-summary/doctrine-and-covenants-1835/69'
    quote: 'in the last days, before the Lord comes, he is to gather together his saints who have made a covenant with him by sacrifice. Ps. 50:3, 4, 5.'
  - where: 'note 50:5 “The gathering before the Lord comes”'
    claim: 'The passage is in the sixth lecture, in the 1835 Doctrine and Covenants (the lecture begins on page 58)'
    key: jsp-dc-1835
    url: 'https://www.josephsmithpapers.org/paper-summary/doctrine-and-covenants-1835/66'
    quote: 'LECTURE SIXTH.'
  - where: 'note 50:5 “The gathering before the Lord comes”'
    claim: 'The lecture’s subject there is sacrifice as the way of knowing one is accepted of God'
    key: jsp-dc-1835
    url: 'https://www.josephsmithpapers.org/paper-summary/doctrine-and-covenants-1835/69'
    quote: 'from the days of righteous Abel to the present time, the knowledge that men have that they are accepted in the sight of God, is obtained by offering sacrifice'

  # ---- note 50:8 ----
  - where: 'note 50:8 “The altar is not what is wrong”'
    claim: 'A modern translation makes the second half of verse 8 a statement'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2050&version=NRSVUE'
    quote: 'your burnt offerings are continually before me.'
  - where: 'note 50:8 “The altar is not what is wrong”'
    claim: 'Sacrifices carried prayer, devotion and thankfulness'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'They were accompanied by prayer, devotion, and dedication, and represented an acknowledgment on the part of the individual of his duty toward God, and also a thankfulness to the Lord for his life and blessings'
  - where: 'explore'
    claim: 'Psalm 40:6 says God did not desire sacrifice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/40?lang=eng'
    quote: 'Sacrifice and offering thou didst not desire; mine ears hast thou opened'
  - where: 'explore'
    claim: 'Psalms 40, 51 and this psalm are read as echoes of Samuel’s words to Saul'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/50.htm'
    quote: 'they are all echoes of the grand utterance of Samuel (1 Samuel 15:22)'
  - where: 'explore'
    claim: 'The same thought is found in Psalms 40 and 51'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/50.htm'
    quote: 'It is the very same fundamental thought which is expressed in Psalm 40:7-9'
  - where: 'explore'
    claim: 'Samuel told Saul that to obey is better than sacrifice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: 'Behold, to obey is better than sacrifice, and to hearken than the fat of rams.'

  # ---- note 50:14 ----
  - where: 'note 50:14 “Thanksgiving as the sacrifice”'
    claim: '“Offer” is the verb zabach, to sacrifice'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'זְבַ֣ח'
  - where: 'note 50:14 “Thanksgiving as the sacrifice”'
    claim: 'The noun is todah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תּוֹדָ֑ה'
  - where: 'note 50:14 “Thanksgiving as the sacrifice”'
    claim: 'Todah means thanksgiving in worship'
    key: bdb
    url: 'https://biblehub.com/hebrew/8426.htm'
    quote: 'thanksgiving in songs of liturgical worship'
  - where: 'note 50:14 “Thanksgiving as the sacrifice”'
    claim: 'Todah is also the thank-offering, a division of the peace offering; the lexicon lists Psalm 50:14 and 23 there'
    key: bdb
    url: 'https://biblehub.com/hebrew/8426.htm'
    quote: 'offer a thank-offering Psalm 50:14; Psalm 50:23'
  - where: 'note 50:14 “Thanksgiving as the sacrifice”'
    claim: 'The law names the sacrifice of thanksgiving among the peace offerings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'If he offer it for a thanksgiving, then he shall offer with the sacrifice of thanksgiving unleavened cakes mingled with oil'
  - where: 'note 50:14 “Thanksgiving as the sacrifice”'
    claim: 'The Greek has “the sacrifice of praise”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/50.htm'
    quote: 'Offer to God the sacrifice of praise; and pay thy vows to the Most High.'
  - where: 'note 50:14 “Thanksgiving as the sacrifice”'
    claim: 'A modern translation has “a sacrifice of thanksgiving”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2050&version=NRSVUE'
    quote: 'Offer to God a sacrifice of thanksgiving,'
  - where: 'note 50:14 “Thanksgiving as the sacrifice”'
    claim: 'An older reading: the thanksgiving of the heart in place of the thank-offering'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/50.htm'
    quote: 'God desires the thanksgiving of the heart and the performance of that which has been vowed'
  - where: 'note 50:14 “Thanksgiving as the sacrifice”'
    claim: 'The law has a vowed offering beside the thank-offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'But if the sacrifice of his offering be a vow, or a voluntary offering'

  - where: 'note 50:14 “Thanksgiving as the sacrifice”'
    claim: 'The verb zabach means to slaughter for sacrifice; the lexicon lists Psalm 50:14 and 23 with todah as its object'
    key: bdb
    url: 'https://biblehub.com/hebrew/2076.htm'
    quote: 'slaughter for sacrifice'

  # ---- note 50:16 ----
  - where: 'note 50:16 “Reciting the law and breaking it”'
    claim: 'An older reading: verses 18–19 condemn the breaking of the eighth, seventh and ninth commandments'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/50.htm'
    quote: 'the transgression of the eighth commandment is condemned, in Psalm 50:18 that of the seventh, in Psalm 50:19. that of the ninth (concerning the truthfulness of testimony)'
  - where: 'note 50:16 “Reciting the law and breaking it”'
    claim: 'The Ten Commandments forbid adultery, theft and false witness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'Thou shalt not steal.'
  - where: 'note 50:16 “Reciting the law and breaking it”'
    claim: 'Noah’s priests said they taught the law of Moses, and Abinadi asked why they did not keep it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/12?lang=eng'
    quote: 'If ye teach the law of Moses why do ye not keep it?'
  - where: 'note 50:16 “Reciting the law and breaking it”'
    claim: 'Abinadi’s accusation has been set beside verses 16 and 22'
    key: sc-knowhy-90
    url: 'https://scripturecentral.org/knowhy/did-abinadi-prophesy-during-pentecost'
    quote: 'In order to teach the law, one must keep it or be cursed (Psalm 50:16, 22); this is the essence of Abinadi’s accusation'

  # ---- note 50:21 ----
  - where: 'note 50:21 “What the wicked made of God’s silence”'
    claim: 'The Greek adds “wickedly” and supplies “thine offences”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/50.htm'
    quote: 'thou thoughtest wickedly that I should be like thee, but I will reprove thee, and set thine offences before thee.'
  - where: 'note 50:21 “What the wicked made of God’s silence”'
    claim: '“Reprove” in verses 8 and 21 is the same Hebrew form'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אוֹכִיחֶ֑/ךָ'
  - where: 'note 50:21 “What the wicked made of God’s silence”'
    claim: 'The verb means to arrange or set in order, as wood on an altar'
    key: bdb
    url: 'https://biblehub.com/hebrew/6186.htm'
    quote: 'set or lay in order, as wood'
  - where: 'note 50:21 “What the wicked made of God’s silence”'
    claim: 'The verb is used of drawing up for battle'
    key: bdb
    url: 'https://biblehub.com/hebrew/6186.htm'
    quote: 'arrange a battle, i.e. draw up in battle order'
  - where: 'note 50:21 “What the wicked made of God’s silence”'
    claim: 'In law the verb is to set forth a case, probably the sense in Psalm 50:21, where the object is omitted'
    key: bdb
    url: 'https://biblehub.com/hebrew/6186.htm'
    quote: 'state in order, set forth a legal case Job 13:18; Job 23:4, so probably (object omitted) of God Psalm 50:21'
  - where: 'note 50:21 “What the wicked made of God’s silence”'
    claim: 'A modern translation has “lay the charge before you”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2050&version=NRSVUE'
