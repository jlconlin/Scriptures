chapter: 145
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The title ascribes the psalm to David and gives no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/145?lang=eng'
    quote: 'David’s Psalm of praise.'

  # ---- setting ----
  - where: 'setting'
    claim: 'Psalm 145 has a title naming David; the psalm that follows has none and begins with “Praise ye the LORD”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/146?lang=eng'
    quote: 'Praise ye the Lord. Praise the Lord, O my soul.'
  - where: 'setting'
    claim: 'The book’s last psalm ends with “Praise ye the LORD” and asks every thing that has breath to praise'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/150?lang=eng'
    quote: 'Let every thing that hath breath praise the Lord. Praise ye the Lord.'
  - where: 'setting'
    claim: 'The psalm is an acrostic: its verses begin with the letters of the Hebrew alphabet in order'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20145&version=NIV'
    quote: 'This psalm is an acrostic poem, the verses of which (including verse 13b) begin with the successive letters of the Hebrew alphabet.'
  - where: 'setting'
    claim: 'Verse 8 repeats the LORD’s words to Moses at Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'The Lord, The Lord God, merciful and gracious, longsuffering, and abundant in goodness and truth'
  - where: 'setting'
    claim: 'Psalm 104:27 is close to verse 15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/104?lang=eng'
    quote: 'These wait all upon thee; that thou mayest give them their meat in due season.'
  - where: 'setting'
    claim: 'Nebuchadnezzar’s confession in Daniel 4:3 is nearly verse 13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/4?lang=eng'
    quote: 'his kingdom is an everlasting kingdom, and his dominion is from generation to generation.'
  - where: 'setting'
    claim: 'Nephi ends his first chapter (verse 20 of 20) with “tender mercies”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng'
    quote: 'the tender mercies of the Lord are over all those whom he hath chosen, because of their faith'

  # ---- thread ----
  - where: 'thread'
    claim: 'Verse 8 is the sentence proclaimed at Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'And the Lord passed by before him, and proclaimed, The Lord, The Lord God, merciful and gracious'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Unsearchable” is that there is no searching it out'
    key: bdb
    url: 'https://biblehub.com/hebrew/2714.htm'
    quote: 'i.e. it is unsearchable Job 5:9; Job 9:10; Psalm 145:3'
  - where: 'section 4 plain'
    claim: '“Meat” in verse 15 is food'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20145&version=NRSVUE'
    quote: 'and you give them their food in due season.'

  # ---- note 145:0 ----
  - where: 'note 145:0 “A title no other psalm has”'
    claim: 'The King James title of the psalm'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/145?lang=eng'
    quote: 'David’s Psalm of praise.'
  - where: 'note 145:0 “A title no other psalm has”'
    claim: 'The first word of the psalm in Hebrew, its title, is tehillah (H8416)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תְּהִלָּ֗ה'
  - where: 'note 145:0 “A title no other psalm has”'
    claim: 'The lexicon gives Psalm 145:1 alone for the word as a title, “praise-song,” and says its plural is the later Hebrew name of the Psalms'
    key: bdb
    url: 'https://biblehub.com/hebrew/8416.htm'
    quote: '3 praise-song, as title, תְּהִלָּה לְדָוִד Psalm 145:1 (so Late Hebrew ספר תהלות & תְּהִלִּים, תִּילִּים, = Psalms).'
  - where: 'note 145:0 “A title no other psalm has”'
    claim: 'The word is common inside the psalms (thirty occurrences in the book, among them Psalm 34:1 and 145:21)'
    key: bdb
    url: 'https://biblehub.com/hebrew/8416.htm'
    quote: '1 praise, adoration, thanksgiving, paid to'
  - where: 'note 145:0 “A title no other psalm has”'
    claim: 'The title of Psalm 100 is a different Hebrew word, todah (H8426)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תוֹדָ֑ה'

  # ---- note 145:9 ----
  - where: 'note 145:9 “Tender mercies, in Nephi’s first chapter and in an apostle’s sermon”'
    claim: 'Nephi ends his first chapter with the tender mercies of the Lord over those chosen because of their faith'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/1?lang=eng'
    quote: 'the tender mercies of the Lord are over all those whom he hath chosen, because of their faith, to make them mighty even unto the power of deliverance.'
  - where: 'note 145:9 “Tender mercies, in Nephi’s first chapter and in an apostle’s sermon”'
    claim: 'Jacob has “in great mercy, over all his works”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/jacob/4?lang=eng'
    quote: 'he counseleth in wisdom, and in justice, and in great mercy, over all his works.'
  - where: 'note 145:9 “Tender mercies, in Nephi’s first chapter and in an apostle’s sermon”'
    claim: 'Hilton counts five allusions to Psalm 145, more than to any other psalm'
    key: hilton-psalms-bom
    url: 'https://rsc.byu.edu/ascending-mountain-lord/old-testament-psalms-book-mormon'
    quote: 'three psalms (5, 62, and 89) contain three, Psalm 95 has four allusions, and Psalm 145 has five.'
  - where: 'note 145:9 “Tender mercies, in Nephi’s first chapter and in an apostle’s sermon”'
    claim: 'The study finds the psalm used by Nephi, Jacob, Alma and Ammon, and compares verse 9 with 1 Nephi 1:20'
    key: hilton-psalms-bom
    url: 'https://rsc.byu.edu/ascending-mountain-lord/old-testament-psalms-book-mormon'
    quote: 'Psalm 145 contains text that is utilized by Nephi, Jacob, Alma, and Ammon, including echoes of phrases as “his tender mercies are over all his works” (Psalm 145:9; compare 1 Nephi 1:20)'
  - where: 'note 145:9 “Tender mercies, in Nephi’s first chapter and in an apostle’s sermon”'
    claim: 'The study lists Jacob 4:10 as an allusion to verse 9, and calls its cases allusions'
    key: hilton-psalms-bom
    url: 'https://rsc.byu.edu/ascending-mountain-lord/old-testament-psalms-book-mormon'
    quote: 'Psalm 145:9 Jacob 4:10; Alma 37:12 Over all his works'
  - where: 'note 145:9 “Tender mercies, in Nephi’s first chapter and in an apostle’s sermon”'
    claim: 'Elder Bednar spoke on 1 Nephi 1:20 in the address'
    key: bednar-tender-mercies
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2005/04/the-tender-mercies-of-the-lord?lang=eng'
    quote: 'Near the conclusion of the singing, to my mind came this verse from the Book of Mormon'
  - where: 'note 145:9 “Tender mercies, in Nephi’s first chapter and in an apostle’s sermon”'
    claim: 'Elder Bednar’s description of the Lord’s tender mercies, which come from the Savior'
    key: bednar-tender-mercies
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2005/04/the-tender-mercies-of-the-lord?lang=eng'
    quote: 'the very personal and individualized blessings, strength, protection, assurances, guidance, loving-kindness, consolation, support, and spiritual gifts which we receive from and because of and through the Lord Jesus Christ'
  - where: 'note 145:9 “Tender mercies, in Nephi’s first chapter and in an apostle’s sermon”'
    claim: 'He taught that God has no list of favorites'
    key: bednar-tender-mercies
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2005/04/the-tender-mercies-of-the-lord?lang=eng'
    quote: 'God does not have a list of favorites to which we must hope our names will someday be added.'
  - where: 'note 145:9 “Tender mercies, in Nephi’s first chapter and in an apostle’s sermon”'
    claim: 'He testified that the tender mercies are available to all'
    key: bednar-tender-mercies
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2005/04/the-tender-mercies-of-the-lord?lang=eng'
    quote: 'I testify that the tender mercies of the Lord are available to all of us'
  - where: 'note 145:9 “Tender mercies, in Nephi’s first chapter and in an apostle’s sermon”'
    claim: 'He taught that people become chosen by choosing God'
    key: bednar-tender-mercies
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2005/04/the-tender-mercies-of-the-lord?lang=eng'
    quote: 'Thus we become God’s chosen and invite His tender mercies as we use our agency to choose God.'
  - where: 'note 145:9 “Tender mercies, in Nephi’s first chapter and in an apostle’s sermon”'
    claim: 'He quoted Psalm 145:9 near the end of the address'
    key: bednar-tender-mercies
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2005/04/the-tender-mercies-of-the-lord?lang=eng'
    quote: 'Truly, “the Lord is good to all: and his tender mercies are over all his works” (Psalm 145:9).'

  # ---- note 145:13 kingdom ----
  - where: 'note 145:13 “The words a king of Babylon says twice”'
    claim: 'Nebuchadnezzar’s proclamation opens with the everlasting kingdom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/4?lang=eng'
    quote: 'How great are his signs! and how mighty are his wonders! his kingdom is an everlasting kingdom, and his dominion is from generation to generation.'
  - where: 'note 145:13 “The words a king of Babylon says twice”'
    claim: 'He was driven from men'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/4?lang=eng'
    quote: 'The same hour was the thing fulfilled upon Nebuchadnezzar: and he was driven from men'
  - where: 'note 145:13 “The words a king of Babylon says twice”'
    claim: 'When his understanding returned he blessed the Most High and said it again'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/4?lang=eng'
    quote: 'mine understanding returned unto me, and I blessed the most High, and I praised and honoured him that liveth for ever, whose dominion is an everlasting dominion, and his kingdom is from generation to generation'

  # ---- note 145:13 missing letter ----
  - where: 'note 145:13 “The missing letter, and the line other Bibles add here”'
    claim: 'The acrostic has no verse for the letter nun'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/145.htm'
    quote: 'every first line of the distich has the ordinal letter; but the distich Nun is wanting.'
  - where: 'note 145:13 “The missing letter, and the line other Bibles add here”'
    claim: 'The missing line belongs after verse 13 (a translation that prints it calls it verse 13b)'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20145&version=NIV'
    quote: 'the verses of which (including verse 13b) begin with the successive letters of the Hebrew alphabet.'
  - where: 'note 145:13 “The missing letter, and the line other Bibles add here”'
    claim: 'The Greek translation has a line after verse 13'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/145.htm'
    quote: 'The Lord is faithful in his words, and holy in all his works.'
  - where: 'note 145:13 “The missing letter, and the line other Bibles add here”'
    claim: 'The Hebrew word behind the Greek “faithful” is ne’eman, which begins with nun'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/145.htm'
    quote: 'Πιστὸς (נאמן as in Psalm 111:7)'
  - where: 'note 145:13 “The missing letter, and the line other Bibles add here”'
    claim: 'A modern translation prints the line within verse 13'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20145&version=NRSVUE'
    quote: 'is faithful in all his words'
  - where: 'note 145:13 “The missing letter, and the line other Bibles add here”'
    claim: 'The same translation’s second half of the line'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20145&version=NRSVUE'
    quote: 'gracious in all his deeds.'
  - where: 'note 145:13 “The missing letter, and the line other Bibles add here”'
    claim: 'The evidence for the line: one Masoretic manuscript, the Dead Sea Scrolls, the Syriac and the Greek; most Masoretic manuscripts lack it'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20145&version=NIV'
    quote: 'One manuscript of the Masoretic Text, Dead Sea Scrolls and Syriac (see also Septuagint); most manuscripts of the Masoretic Text do not have the last two lines of verse 13.'
  - where: 'note 145:13 “The missing letter, and the line other Bibles add here”'
    claim: 'The Greek line is verse 17 with two words changed'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/145.htm'
    quote: 'according with Psalm 145:17, with the change only of two words of this distich'
  - where: 'note 145:13 “The missing letter, and the line other Bibles add here”'
    claim: 'One older reading takes the gap as the poet’s freedom'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/145.htm'
    quote: 'We are contented to see in the omission of the Nun-strophe an example of that freedom with which the Old Testament poets are wont to handle this kind of forms.'
  - where: 'note 145:13 “The missing letter, and the line other Bibles add here”'
    claim: 'It reports others who think the verse was lost'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/145.htm'
    quote: 'think that the Nun-strophe has been lost'

  # ---- note 145:16 ----
  - where: 'note 145:16 “Every creature fed from one hand”'
    claim: 'A modern translation has “food” for “meat”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20145&version=NRSVUE'
    quote: 'and you give them their food in due season.'
  - where: 'note 145:16 “Every creature fed from one hand”'
    claim: 'Psalm 104:27 has nearly the words of verse 15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/104?lang=eng'
    quote: 'These wait all upon thee; that thou mayest give them their meat in due season.'
  - where: 'note 145:16 “Every creature fed from one hand”'
    claim: 'Psalm 104:28 has the open hand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/104?lang=eng'
    quote: 'That thou givest them they gather: thou openest thine hand, they are filled with good.'
  - where: 'note 145:16 “Every creature fed from one hand”'
    claim: 'Psalm 104 is a song about the creation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/104?lang=eng'
    quote: 'Who laid the foundations of the earth, that it should not be removed for ever.'

  # ---- note 145:20 ----
  - where: 'note 145:20 “The one dark line, and who the last “all” are”'
    claim: '“In truth” is prayer from the heart'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/145.htm'
    quote: 'in firmness, certainty, truth, i.e., so that the prayer comes from their heart and is holy fervour'
  - where: 'note 145:20 “The one dark line, and who the last “all” are”'
    claim: 'The contrast is with hypocrites'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/145.htm'
    quote: 'He remains at a distance from the hypocrites, just as their heart remains far from Him'
  - where: 'note 145:20 “The one dark line, and who the last “all” are”'
    claim: 'Those who fear Him in verse 19 are those who love Him in verse 20'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/145.htm'
    quote: 'Those who are called in Psalm 145:19 those who fear Him, are called in Psalm 145:20 those who love Him.'
  - where: 'note 145:20 “The one dark line, and who the last “all” are”'
    claim: 'Nephi has the phrase “the wicked will he destroy”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/30?lang=eng'
    quote: 'the Lord God shall cause a great division among the people, and the wicked will he destroy; and he will spare his people'
  - where: 'note 145:20 “The one dark line, and who the last “all” are”'
    claim: 'The study counts 2 Nephi 30:10 as an allusion to verse 20'
    key: hilton-psalms-bom
    url: 'https://rsc.byu.edu/ascending-mountain-lord/old-testament-psalms-book-mormon'
    quote: 'Psalm 145:20 2 Nephi 30:10 The wicked will he destroy'

  # ---- christ ----
  - where: 'christ'
    claim: '“LORD” stands for Jehovah, who is the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: 'christ'
    claim: 'Elder Bednar taught that tender mercies are received through Jesus Christ'
    key: bednar-tender-mercies
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2005/04/the-tender-mercies-of-the-lord?lang=eng'
    quote: 'spiritual gifts which we receive from and because of and through the Lord Jesus Christ'

  # ---- explore ----
  - where: 'explore'
    claim: 'Daniel 4:34 has nearly the words of verse 13 again'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/4?lang=eng'
    quote: 'whose dominion is an everlasting dominion, and his kingdom is from generation to generation'
  - where: 'explore'
    claim: 'Elder Bednar’s address is on the tender mercies of the Lord'
    key: bednar-tender-mercies
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2005/04/the-tender-mercies-of-the-lord?lang=eng'
    quote: 'I have reflected repeatedly upon the phrase “the tender mercies of the Lord.”'
