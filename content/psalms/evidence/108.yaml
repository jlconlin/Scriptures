chapter: 108
claims:
  # ---- when / setting ----
  - where: 'when'
    claim: 'The title ascribes the psalm to David and names no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/108?lang=eng'
    quote: 'A Song or Psalm of David.'
  - where: 'setting'
    claim: 'The title ascribes the psalm to David and names no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/108?lang=eng'
    quote: 'A Song or Psalm of David.'
  - where: 'setting'
    claim: 'The first half is the close of Psalm 57 (57:7–11; the commentary numbers by the Hebrew, 57:8–12)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/108.htm'
    quote: 'This first half is taken from Psalm 57:8-12.'
  - where: 'setting'
    claim: 'The second half is the close of Psalm 60 (60:5–12; 60:7–14 in the Hebrew numbering)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/108.htm'
    quote: 'Psalm 60:7-14 forms this second half.'
  - where: 'setting'
    claim: 'Psalm 57’s title sets it in the cave when David fled from Saul'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/57?lang=eng'
    quote: 'To the chief Musician, Al-taschith, Michtam of David, when he fled from Saul in the cave.'
  - where: 'setting'
    claim: 'Psalm 60’s title sets it in David’s wars with Aram and Edom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/60?lang=eng'
    quote: 'when he strove with Aram-naharaim and with Aram-zobah, when Joab returned, and smote of Edom in the valley of salt twelve thousand.'
  - where: 'setting'
    claim: 'One older reading: the psalm bears David’s name because it is compiled from Davidic materials'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/108.htm'
    quote: 'It is inscribed a Psalm-song by David, but only because it is compiled out of ancient Davidic materials.'
  - where: 'setting'
    claim: 'The same reading: the two pieces were put together and taken out of their historical setting'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/108.htm'
    quote: 'just put together, not soldered together, and taken out of their original historical connection.'
  - where: 'setting'
    claim: 'Psalm 107 opens with a call to give thanks to the LORD (and the Church’s page prints no title above it)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/107?lang=eng'
    quote: 'O give thanks unto the Lord, for he is good: for his mercy endureth for ever.'
  - where: 'setting'
    claim: 'The first word of Psalm 107:1 is an imperative of the verb H3034; hebrew.mjs psalms 107:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הֹד֣וּ'
  - where: 'setting'
    claim: '“I will praise thee” in 108:3 is the same verb, H3034; hebrew.mjs psalms 108:3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אוֹדְ/ךָ֖'
  - where: 'setting'
    claim: 'The same older reading: the psalm is the echo to the call that opens Psalm 107 (the commentary cites the verse by the Hebrew number, 108:4)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/108.htm'
    quote: 'and the whole contents of this Psalm is the echo to the'
  - where: 'setting'
    claim: 'Psalm 109’s title has David’s name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/109?lang=eng'
    quote: 'To the chief Musician, A Psalm of David.'
  - where: 'setting'
    claim: 'Psalm 110’s title has David’s name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/110?lang=eng'
    quote: 'A Psalm of David.'

  # ---- thread ----
  - where: 'thread'
    claim: 'Psalm 57 begins with a plea for mercy until calamities pass'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/57?lang=eng'
    quote: 'in the shadow of thy wings will I make my refuge, until these calamities be overpast.'
  - where: 'thread'
    claim: 'Psalm 60 begins with the people telling God He has cast them off'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/60?lang=eng'
    quote: 'O God, thou hast cast us off, thou hast scattered us, thou hast been displeased; O turn thyself to us again.'
  - where: 'thread'
    claim: 'Psalm 60 ends with the same two lines as Psalm 108'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/60?lang=eng'
    quote: 'Through God we shall do valiantly: for he it is that shall tread down our enemies.'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Fixed” is steadfast'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm+108&version=NRSVUE'
    quote: 'My heart is steadfast, O God, my heart is steadfast;'
  - where: 'section 1 plain'
    claim: '“My glory” is the inner self'
    key: bdb
    url: 'https://biblehub.com/hebrew/3519.htm'
    quote: 'my honour, poetic of the seat of honour in the inner man, the noblest part of man'
  - where: 'section 1 plain'
    claim: '“The people” is plural, the peoples'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm+108&version=NRSVUE'
    quote: 'among the peoples,'
  - where: 'section 2 plain'
    claim: '“Mete out” is to measure out'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/108.htm'
    quote: 'and will measure out the valley of tents.'
  - where: 'section 2 plain'
    claim: '“The strength of mine head” is a helmet'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm+108&version=NRSVUE'
    quote: 'Ephraim is my helmet;'
  - where: 'section 2 plain'
    claim: '“Lawgiver” is rendered sceptre'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm+108&version=NRSVUE'
    quote: 'Judah is my scepter.'
  - where: 'section 2 plain'
    claim: '“Washpot” is a washbasin'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm+108&version=NRSVUE'
    quote: 'Moab is my washbasin;'
  - where: 'section 2 plain'
    claim: '“Will I triumph” is a shout of triumph'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm+108&version=NRSVUE'
    quote: 'over Philistia I shout in triumph.'
  - where: 'section 3 plain'
    claim: 'The “strong city” is a fortified city'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm+108&version=NRSVUE'
    quote: 'Who will bring me to the fortified city?'
  - where: 'section 3 plain'
    claim: '“Cast us off” is rejected us'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/108.htm'
    quote: 'Wilt not thou, O God, who hast rejected us?'
  - where: 'section 3 plain'
    claim: '“Vain is the help of man”: human help is worthless'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm+108&version=NRSVUE'
    quote: 'for human help is worthless.'

  # ---- note 108:1 ----
  - where: 'note 108:1 “The close of Psalm 57, with four changes”'
    claim: 'Verses 1–5 are taken from the close of Psalm 57'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/108.htm'
    quote: 'This first half is taken from Psalm 57:8-12.'
  - where: 'note 108:1 “The close of Psalm 57, with four changes”'
    claim: 'Psalm 57:7 says “my heart is fixed” twice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/57?lang=eng'
    quote: 'My heart is fixed, O God, my heart is fixed: I will sing and give praise.'
  - where: 'note 108:1 “The close of Psalm 57, with four changes”'
    claim: 'The Hebrew of 108:1 has the participle “fixed” (H3559) and “my heart” once, then “God,” the two verbs of singing, and “also my glory”; 57:7 has the pair twice; hebrew.mjs psalms 108:1 and 57:7'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'כְּבוֹדִֽ/י'
  - where: 'note 108:1 “The close of Psalm 57, with four changes”'
    claim: 'The Greek of this psalm has the phrase twice'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/108.htm'
    quote: 'O God, my heart is ready, my heart is ready; I will sing and sing psalms with my glory.'
  - where: 'note 108:1 “The close of Psalm 57, with four changes”'
    claim: 'A modern translation prints the phrase twice and notes that the Hebrew text lacks the second'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm+108&version=NRSVUE'
    quote: '108.1 Heb mss Gk Syr: MT lacks my heart is steadfast'
  - where: 'note 108:1 “The close of Psalm 57, with four changes”'
    claim: 'In Psalm 57:8 “my glory” is told to awake'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/57?lang=eng'
    quote: 'Awake up, my glory; awake, psaltery and harp: I myself will awake early.'
  - where: 'note 108:1 “The close of Psalm 57, with four changes”'
    claim: '“My glory” is the inner self, and the lexicon lists Psalm 108:1 (Hebrew 108:2) as parallel to “my heart”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3519.htm'
    quote: 'my honour, poetic of the seat of honour in the inner man, the noblest part of man'
  - where: 'note 108:1 “The close of Psalm 57, with four changes”'
    claim: 'One older reading: “my glory” is taken up as a closer definition of who sings, his soul'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/108.htm'
    quote: 'He will do it, yea,his soul with all its godlike powers shall do it.'
  - where: 'note 108:1 “The close of Psalm 57, with four changes”'
    claim: 'A modern translation follows Psalm 57:8 and prints a command to the soul'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm+108&version=NRSVUE'
    quote: 'Awake, my soul!'
  - where: 'note 108:1 “The close of Psalm 57, with four changes”'
    claim: 'Psalm 57:9 has adonai, the title (H136); hebrew.mjs psalms 57:9'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֲדֹנָ֑/י'
  - where: 'note 108:1 “The close of Psalm 57, with four changes”'
    claim: 'Psalm 108:3 has the divine name (H3068); hebrew.mjs psalms 108:3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יְהוָ֑ה'
  - where: 'note 108:1 “The close of Psalm 57, with four changes”'
    claim: 'The commentary notes the same change of name'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/108.htm'
    quote: 'Jahve in Psalm 108:4 is transformed out of the Adonaj'
  - where: 'note 108:1 “The close of Psalm 57, with four changes”'
    claim: 'Elsewhere the psalm says “God” (verses 1, 5, 7, 11, 13 in the Church’s text)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/108?lang=eng'
    quote: 'Be thou exalted, O God, above the heavens: and thy glory above all the earth;'
  - where: 'note 108:1 “The close of Psalm 57, with four changes”'
    claim: 'Psalm 57:10 has “unto the heavens”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/57?lang=eng'
    quote: 'For thy mercy is great unto the heavens, and thy truth unto the clouds.'
  - where: 'note 108:1 “The close of Psalm 57, with four changes”'
    claim: 'Psalm 108:4 has the preposition me‘al (H5921 with min) before “heavens,” where 57:10 has ‘ad (H5704); both keep ‘ad before “clouds”; hebrew.mjs psalms 108:4 and 57:10'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מֵֽ/עַל'

  # ---- note 108:6 ----
  - where: 'note 108:6 “Where the two psalms are joined”'
    claim: 'The King James ends verse 5 with a semicolon and begins verse 6 with “That”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/108?lang=eng'
    quote: 'Be thou exalted, O God, above the heavens: and thy glory above all the earth;'
  - where: 'note 108:6 “Where the two psalms are joined”'
    claim: 'In Psalm 60 the line has “hear me,” and it follows that psalm’s complaint (60:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/60?lang=eng'
    quote: 'That thy beloved may be delivered; save with thy right hand, and hear me.'
  - where: 'note 108:6 “Where the two psalms are joined”'
    claim: 'A modern translation puts the command first and the purpose clause after it'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm+108&version=NRSVUE'
    quote: 'Give victory with your right hand, and answer me,'
  - where: 'note 108:6 “Where the two psalms are joined”'
    claim: 'The same translation’s purpose clause'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm+108&version=NRSVUE'
    quote: 'so that those whom you love may be rescued.'

  # ---- note 108:9 ----
  - where: 'note 108:9 “The close of Psalm 60, and the line that differs”'
    claim: 'Verses 6–13 are the close of Psalm 60'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/60?lang=eng'
    quote: 'Gilead is mine, and Manasseh is mine; Ephraim also is the strength of mine head; Judah is my lawgiver;'
  - where: 'note 108:9 “The close of Psalm 60, and the line that differs”'
    claim: 'Psalm 60:8 addresses Philistia'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/60?lang=eng'
    quote: 'Moab is my washpot; over Edom will I cast out my shoe: Philistia, triumph thou because of me.'
  - where: 'note 108:9 “The close of Psalm 60, and the line that differs”'
    claim: 'The verb is a first-person imperfect in Psalm 108:9 and a feminine imperative in 60:8 (Hebrew 108:10; 60:10)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7321.htm'
    quote: 'Imperfect1singular אֶתְרוֺעָ֑ע Psalm 108:10; 3masculine plural יִתְרוֺעֲעוּ Psalm 65:14; Imperative feminine singular הִתְרוֺעָ֑עִי Psalm 60:10'
  - where: 'note 108:9 “The close of Psalm 60, and the line that differs”'
    claim: 'A modern translation’s rendering of the line'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm+108&version=NRSVUE'
    quote: 'over Philistia I shout in triumph.'
  - where: 'note 108:9 “The close of Psalm 60, and the line that differs”'
    claim: 'The Greek of this psalm has a statement about the Philistines'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/108.htm'
    quote: 'Moab is the caldron of my hope; over Idumea will I cast my sandal; the Philistines are made subject to me.'

  # ---- note 108:11 ----
  - where: 'note 108:11 “The same Hebrew as Psalm 60, in different English”'
    claim: 'The King James wording of Psalm 60:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/60?lang=eng'
    quote: 'Wilt not thou, O God, which hadst cast us off? and thou, O God, which didst not go out with our armies?'
  - where: 'note 108:11 “The same Hebrew as Psalm 60, in different English”'
    claim: 'The Hebrew of 108:11 is all but that of 60:10: it lacks the pronoun “thou” (H859), which stands in 60:10, and spells “our hosts” without a vowel letter; hebrew.mjs psalms 108:11 and 60:10'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אַתָּ֣ה'
  - where: 'note 108:11 “The same Hebrew as Psalm 60, in different English”'
    claim: 'The Greek makes both halves questions'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/108.htm'
    quote: 'Wilt not thou, O God, who hast rejected us? and wilt not thou, O God, go forth with our hosts?'
  - where: 'note 108:11 “The same Hebrew as Psalm 60, in different English”'
    claim: 'A modern translation reads a complaint in both halves'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm+108&version=NRSVUE'
    quote: 'Have you not rejected us, O God? You do not go out, O God, with our armies.'
  - where: 'note 108:11 “The same Hebrew as Psalm 60, in different English”'
    claim: 'Psalm 60 opens with the same verb, and those verses are not in Psalm 108'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/60?lang=eng'
    quote: 'O God, thou hast cast us off, thou hast scattered us, thou hast been displeased; O turn thyself to us again.'

  # ---- christ ----
  - where: 'christ'
    claim: 'The divine name stands in verse 3; hebrew.mjs psalms 108:3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יְהוָ֑ה'
  - where: 'christ'
    claim: '“LORD” in the Old Testament usually means Jehovah'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Usually, when the word Lord appears in the Old Testament, it means “Jehovah.”'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: 'christ'
    claim: 'The Church’s chapter heading names Judah as the Lord’s lawgiver'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/108?lang=eng'
    quote: 'David praises and exalts God—Judah is the Lord’s lawgiver.'
  - where: 'christ'
    claim: 'Jacob’s blessing on Judah has “lawgiver” in the King James'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/49?lang=eng'
    quote: 'The sceptre shall not depart from Judah, nor a lawgiver from between his feet, until Shiloh come'
  - where: 'christ'
    claim: 'Shiloh in Genesis 49:10 has been read as a prophecy of the Messiah'
    key: bd-shiloh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shiloh?lang=eng'
    quote: 'The name as found in Gen. 49:10 has been regarded by many biblical scholars as a prophecy of the coming of Messiah.'

  # ---- explore / parallels ----
  - where: 'explore'
    claim: 'Psalm 107 opens with the call to give thanks'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/107?lang=eng'
    quote: 'O give thanks unto the Lord, for he is good: for his mercy endureth for ever.'
  - where: 'explore'
    claim: 'Psalms 109 and 110 are psalms of David by their titles'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/110?lang=eng'
    quote: 'A Psalm of David.'
  - where: 'parallels'
    claim: 'Psalm 57:9 has “O Lord,” the title'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/57?lang=eng'
    quote: 'I will praise thee, O Lord, among the people: I will sing unto thee among the nations.'
  - where: 'parallels'
    claim: 'The verb of Psalm 107:1 and of 108:3 is the same (H3034); hebrew.mjs psalms 107:1 and 108:3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הֹד֣וּ'
  - where: 'parallels'
    claim: 'Genesis 49:10 has the lawgiver of Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/49?lang=eng'
    quote: 'nor a lawgiver from between his feet'
