chapter: 16
claims:
  # ---------- setting ----------
  - where: setting
    claim: 'Michtam stands in the titles of Psalm 16 and of five later psalms, 56–60'
    key: bdb
    url: 'https://biblehub.com/hebrew/4387.htm'
    quote: 'Psalm 56:1; Psalm 57:1; Psalm 58:1; Psalm 59:1'
  - where: setting
    claim: 'Peter quoted verses 8–11 at Pentecost; the psalm has been read as messianic since New Testament times'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Psalm 16 has been interpreted as a messianic psalm since at least New Testament times. The Apostle Peter quoted verses 8–11 of the psalm in his inspired speech at Pentecost'
  - where: setting
    claim: 'Paul quoted verse 10 in a synagogue in Antioch'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Paul, preaching in a synagogue in Antioch, also quoted from Psalm 16:10'
  - where: setting
    claim: 'Peter names David as the speaker of the psalm'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/2?lang=eng'
    quote: 'For David speaketh concerning him, I foresaw the Lord always before my face'
  - where: setting
    claim: 'The Church’s edition heads the psalm as messianic'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/16?lang=eng'
    quote: 'A messianic psalm of David'

  # ---------- thread ----------
  - where: thread
    claim: 'One reading: the hope of verse 10 rests on the speaker’s calling God his own'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/16.htm'
    quote: 'it is impossible for the man, who, in appropriating faith and actual experience, calls God his own, to fall into the hands of death'
  - where: thread
    claim: '“Hell” in verse 10 is Sheol'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לִ/שְׁא֑וֹל'
  - where: thread
    claim: 'Sheol is the place where all people go after death'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'This refers to the place where all people go after death, regardless of their moral character.'

  # ---------- sections ----------
  - where: section 1 plain
    claim: 'Verses 1–3 rendered “take refuge,” “no good apart from you,” “holy ones in the land,” “noble ones”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2016&version=NRSVUE'
    quote: 'As for the holy ones in the land, they are the noble ones'
  - where: section 1 plain
    claim: 'Verse 2: “I have no good apart from you”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2016&version=NRSVUE'
    quote: 'I have no good apart from you.'
  - where: section 2 plain
    claim: '“Maintainest my lot” as “hold my lot”; “lines” as boundary lines'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2016&version=NRSVUE'
    quote: 'The boundary lines have fallen for me in pleasant places'
  - where: section 2 plain
    claim: 'The “lines” are measuring cords'
    key: bdb
    url: 'https://biblehub.com/hebrew/2256.htm'
    quote: 'measuring-cord, line'
  - where: section 3 plain
    claim: '“Reins” are the emotions of the speaker’s own heart, which correct him'
    key: bdb
    url: 'https://biblehub.com/hebrew/3256.htm'
    quote: 'my reins (the emotions of my own heart) correct, admonish me'
  - where: section 4 plain
    claim: '“Leave” is to abandon'
    key: bdb
    url: 'https://biblehub.com/hebrew/5800.htm'
    quote: 'thou wilt not abandon my soul'

  # ---------- note 16:0 ----------
  - where: 'note 16:0 “Michtam, a word of unknown meaning”'
    claim: 'The title’s first word is Michtam'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מִכְתָּ֥ם'
  - where: 'note 16:0 “Michtam, a word of unknown meaning”'
    claim: 'The meaning of Michtam is unknown; it is a technical term of psalm titles'
    key: bdb
    url: 'https://biblehub.com/hebrew/4387.htm'
    quote: 'a technical term in Psalm titles, meaning unknown'
  - where: 'note 16:0 “Michtam, a word of unknown meaning”'
    claim: 'It stands in six titles (Psalms 16 and 56–60), always with David’s name'
    key: bdb
    url: 'https://biblehub.com/hebrew/4387.htm'
    quote: 'Psalm 56:1; Psalm 57:1; Psalm 58:1; Psalm 59:1'
  - where: 'note 16:0 “Michtam, a word of unknown meaning”'
    claim: 'Michtam is counted among the titles that describe a psalm’s character, and has been rendered Golden Psalm'
    key: bd-psalms
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/psalms?lang=eng'
    quote: 'Some of the titles appear to be intended to indicate the character of the Psalm, as Maschil'
  - where: 'note 16:0 “Michtam, a word of unknown meaning”'
    claim: 'Rendered by some “Golden Psalm”; the psalms that have it'
    key: bd-psalms
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/psalms?lang=eng'
    quote: 'Michtam, rendered by some Golden Psalm (Ps. 16; 56–60)'
  - where: 'note 16:0 “Michtam, a word of unknown meaning”'
    claim: 'The Greek title is “A writing of David”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/16.htm'
    quote: 'A writing of David.'

  # ---------- note 16:2 ----------
  - where: 'note 16:2 “No good apart from Thee”'
    claim: 'The second half of verse 2 begins with “my goodness” (a noun with a first-person suffix)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'ט֝וֹבָתִ֗/י'
  - where: 'note 16:2 “No good apart from Thee”'
    claim: 'The verse’s first word is a verb in the second person feminine singular'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אָמַ֣רְתְּ'
  - where: 'note 16:2 “No good apart from Thee”'
    claim: 'The Greek: “I said to the Lord,” and God has no need of the speaker’s goodness'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/16.htm'
    quote: 'I said to the Lord, Thou art my Lord; for thou has no need of my goodness.'
  - where: 'note 16:2 “No good apart from Thee”'
    claim: 'A modern translation: “I have no good apart from you”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2016&version=NRSVUE'
    quote: 'I have no good apart from you.'
  - where: 'note 16:2 “No good apart from Thee”'
    claim: 'That translation marks the Hebrew of verse 2 as uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2016&version=NRSVUE'
    quote: '16.2 Jerome Tg: Meaning of Heb uncertain'
  - where: 'note 16:2 “No good apart from Thee”'
    claim: 'That translation begins the verse “I say”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2016&version=NRSVUE'
    quote: 'I say to the'

  - where: 'note 16:2 “No good apart from Thee”'
    claim: 'The footnote in the Church’s edition gives the Hebrew as “I have no good apart from Thee” (footnote 2a, read with footnotes.mjs)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/16?lang=eng'
    quote: 'I have no good apart from Thee.'

  # ---------- note 16:3 ----------
  - where: 'note 16:3 “The saints are the holy ones in the land”'
    claim: 'The adjective is used of Israel as a holy nation in Exodus 19:6'
    key: bdb
    url: 'https://biblehub.com/hebrew/6918.htm'
    quote: 'Exodus 19:6 (E)'
  - where: 'note 16:4 “Offerings he will not pour, names he will not say”'
    claim: 'One commentary denies that the verb can mean “hasten” here and renders it “taken in exchange”'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/16.htm'
    quote: 'they have taken in exchange that which is not God'
  - where: 'note 16:3 “The saints are the holy ones in the land”'
    claim: 'The word for saints is qedoshim'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לִ֭/קְדוֹשִׁים'
  - where: 'note 16:3 “The saints are the holy ones in the land”'
    claim: 'The adjective is used of Israel as a holy nation (Ex. 19:6), and in the plural means sacred ones, saints, in this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/6918.htm'
    quote: 'sacred ones, saints Deuteronomy 33:3 (song), Psalm 16:3'
  - where: 'note 16:3 “The saints are the holy ones in the land”'
    claim: 'A modern translation: “the holy ones in the land”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2016&version=NRSVUE'
    quote: 'As for the holy ones in the land, they are the noble ones'

  # ---------- note 16:4 ----------
  - where: 'note 16:4 “Offerings he will not pour, names he will not say”'
    claim: 'A modern translation: the drink offerings are poured out'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2016&version=NRSVUE'
    quote: 'their drink offerings of blood I will not pour out'
  - where: 'note 16:4 “Offerings he will not pour, names he will not say”'
    claim: 'One reading: the offerings are called “of blood” for the guilt of those who bring them'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/16.htm'
    quote: 'because they are offered with blood-stained hands and blood-guilty consciences'
  - where: 'note 16:4 “Offerings he will not pour, names he will not say”'
    claim: 'The psalm has a point of contact with Exodus 23:13'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/16.htm'
    quote: 'with indisputably ancient portions of the Pentateuch (Exodus 23:13; Exodus 19:6; Genesis 49:6)'
  - where: 'note 16:4 “Offerings he will not pour, names he will not say”'
    claim: 'Exodus 23:13 forbids mentioning the names of other gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/23?lang=eng'
    quote: 'make no mention of the name of other gods, neither let it be heard out of thy mouth'
  - where: 'note 16:4 “Offerings he will not pour, names he will not say”'
    claim: 'The Hebrew has “another” with no noun for “god”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אַחֵ֪ר'
  - where: 'note 16:4 “Offerings he will not pour, names he will not say”'
    claim: 'A modern translation has “choose another god”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2016&version=NRSVUE'
    quote: 'Those who choose another god multiply their sorrows'
  - where: 'note 16:4 “Offerings he will not pour, names he will not say”'
    claim: 'That translation marks the Hebrew of verse 4 as uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2016&version=NRSVUE'
    quote: '16.4 Cn: Meaning of Heb uncertain'

  # ---------- note 16:5 ----------
  - where: 'note 16:5 “The LORD as his share of the land”'
    claim: 'The “lines” are a measuring cord, used here as a figure of a favoured life'
    key: bdb
    url: 'https://biblehub.com/hebrew/2256.htm'
    quote: 'measuring-cord, line'
  - where: 'note 16:5 “The LORD as his share of the land”'
    claim: 'The word is figurative in this psalm'
    key: bdb
    url: 'https://biblehub.com/hebrew/2256.htm'
    quote: 'figurative (of favoured life)'
  - where: 'note 16:5 “The LORD as his share of the land”'
    claim: 'Measuring lines were cast and land fell to its owner as they fell'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/16.htm'
    quote: 'are cast (Micah 2:5) and fall to any one just where and as far as his property is assigned to him'
  - where: 'note 16:5 “The LORD as his share of the land”'
    claim: 'Joshua 17:5 uses the same Hebrew expression of an allotted portion of land falling to someone'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/16.htm'
    quote: 'is also said of the falling to any one of his allotted portion of land'
  - where: 'note 16:5 “The LORD as his share of the land”'
    claim: 'Joshua 17:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/17?lang=eng'
    quote: 'And there fell ten portions to Manasseh'
  - where: 'note 16:5 “The LORD as his share of the land”'
    claim: 'The LORD was the part and inheritance of Aaron, who had no land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/18?lang=eng'
    quote: 'Thou shalt have no inheritance in their land, neither shalt thou have any part among them: I am thy part and thine inheritance among the children of Israel.'
  - where: 'note 16:5 “The LORD as his share of the land”'
    claim: 'The tribe of Levi received no territory'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/16.htm'
    quote: 'The tribe of Levi received no territory in the distribution of the country'
  - where: 'note 16:5 “The LORD as his share of the land”'
    claim: 'One reading: what Levi was outwardly holds of every believer'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/16.htm'
    quote: 'in outward relation to the nation, holds good, in all its deep spiritual significance, of every believer'

  # ---------- note 16:7 ----------
  - where: 'note 16:7 “Instructed at night from within”'
    claim: 'The reins (kidneys) are figuratively the seat of emotion and affection, this verse included'
    key: bdb
    url: 'https://biblehub.com/hebrew/3629.htm'
    quote: 'figurative, as seat of emotion and affection Job 19:27; Proverbs 23:16; Psalm 16:7'
  - where: 'note 16:7 “Instructed at night from within”'
    claim: 'The verb here: the reins correct, admonish'
    key: bdb
    url: 'https://biblehub.com/hebrew/3256.htm'
    quote: 'my reins (the emotions of my own heart) correct, admonish me'
  - where: 'note 16:7 “Instructed at night from within”'
    claim: 'The Greek has “chastened”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/16.htm'
    quote: 'my reins too have chastened me even till night'

  # ---------- note 16:8 ----------
  - where: 'note 16:8 “Peter quotes the psalm as the Greek has it”'
    claim: 'Peter quoted verses 8–11; “I foresaw” comes from the Septuagint'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'The expression “I foresaw” comes from the Septuagint.'
  - where: 'note 16:8 “Peter quotes the psalm as the Greek has it”'
    claim: 'In Peter’s quotation David sees the future ministry of Christ'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'In Peter’s quotation, David sees the future mortal ministry of Christ'
  - where: 'note 16:8 “Peter quotes the psalm as the Greek has it”'
    claim: 'The Greek of verse 8'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/16.htm'
    quote: 'I foresaw the Lord always before my face'
  - where: 'note 16:8 “Peter quotes the psalm as the Greek has it”'
    claim: 'The Greek of verse 9 has “my tongue”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/16.htm'
    quote: 'my tongue exulted'
  - where: 'note 16:8 “Peter quotes the psalm as the Greek has it”'
    claim: 'The Greek of verse 11'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/16.htm'
    quote: 'Thou hast made known to me the ways of life; thou wilt fill me with joy with thy countenance'
  - where: 'note 16:8 “Peter quotes the psalm as the Greek has it”'
    claim: '“My glory” is a poetic name for the inner self'
    key: bdb
    url: 'https://biblehub.com/hebrew/3519.htm'
    quote: 'my honour, poetic of the seat of honour in the inner man, the noblest part of man'
  - where: 'note 16:8 “Peter quotes the psalm as the Greek has it”'
    claim: 'Acts 2:25–28 as Peter quotes the psalm'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/2?lang=eng'
    quote: 'Therefore did my heart rejoice, and my tongue was glad; moreover also my flesh shall rest in hope'
  - where: 'note 16:8 “Peter quotes the psalm as the Greek has it”'
    claim: 'Acts 2:28 has no clause about the right hand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/2?lang=eng'
    quote: 'Thou hast made known to me the ways of life; thou shalt make me full of joy with thy countenance.'

  # ---------- note 16:10 hell ----------
  - where: 'note 16:10 “Not abandoned to Sheol”'
    claim: 'The Hebrew is “to Sheol,” a preposition and the name'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לִ/שְׁא֑וֹל'
  - where: 'note 16:10 “Not abandoned to Sheol”'
    claim: 'The verb is the one for God’s forsaking or abandoning a person'
    key: bdb
    url: 'https://biblehub.com/hebrew/5800.htm'
    quote: 'of God’s forsaking, abandoning men'
  - where: 'note 16:10 “Not abandoned to Sheol”'
    claim: 'In this verse: thou wilt not abandon my soul to Sheol'
    key: bdb
    url: 'https://biblehub.com/hebrew/5800.htm'
    quote: 'thou wilt not abandon my soul'
  - where: 'note 16:10 “Not abandoned to Sheol”'
    claim: 'A modern translation: “give me up to Sheol”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2016&version=NRSVUE'
    quote: 'For you do not give me up to Sheol'
  - where: 'note 16:10 “Not abandoned to Sheol”'
    claim: 'Peter testified that the psalm was fulfilled by Jesus Christ'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'Peter testified that David’s psalm was ultimately fulfilled by Jesus Christ'
  - where: 'note 16:10 “Not abandoned to Sheol”'
    claim: 'The Savior did not remain in the world of spirits'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'the Savior did not remain in the world of spirits after His death'
  - where: 'note 16:10 “Not abandoned to Sheol”'
    claim: 'The Church’s chapter heading reads the verse of David’s own future redemption from hell'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/16?lang=eng'
    quote: 'in his own future redemption from hell'

  # ---------- note 16:10 Holy One ----------
  - where: 'note 16:10 “The Holy One is the faithful one”'
    claim: 'The word is hasid, as the Leningrad text prints it, a singular with “thy”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חֲ֝סִידְ/ךָ֗'
  - where: 'note 16:10 “The Holy One is the faithful one”'
    claim: 'A modern translation: “your faithful one”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2016&version=NRSVUE'
    quote: 'or let your faithful one see the Pit'
  - where: 'note 16:10 “The Holy One is the faithful one”'
    claim: 'The Greek has the singular'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/16.htm'
    quote: 'neither wilt thou suffer thine Holy One to see corruption'
  - where: 'note 16:10 “The Holy One is the faithful one”'
    claim: 'Peter and Paul quote the singular'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/13?lang=eng'
    quote: 'Thou shalt not suffer thine Holy One to see corruption.'
  - where: 'note 16:10 “The Holy One is the faithful one”'
    claim: 'The Church’s chapter heading identifies the Holy One as the Messiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/16?lang=eng'
    quote: 'God will not suffer His Holy One (the Messiah) to see corruption'

  # ---------- note 16:10 corruption ----------
  - where: 'note 16:10 “David saw corruption; Jesus did not”'
    claim: 'Peter: David is dead and buried'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/2?lang=eng'
    quote: 'Men and brethren, let me freely speak unto you of the patriarch David, that he is both dead and buried, and his sepulchre is with us unto this day.'
  - where: 'note 16:10 “David saw corruption; Jesus did not”'
    claim: 'Peter: David was a prophet who knew God’s oath that Christ would come of his line to sit on his throne'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/2?lang=eng'
    quote: 'Therefore being a prophet, and knowing that God had sworn with an oath to him, that of the fruit of his loins, according to the flesh, he would raise up Christ to sit on his throne'
  - where: 'note 16:10 “David saw corruption; Jesus did not”'
    claim: 'Peter: David spoke of the resurrection of Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/2?lang=eng'
    quote: 'He seeing this before spake of the resurrection of Christ, that his soul was not left in hell, neither his flesh did see corruption.'
  - where: 'note 16:10 “David saw corruption; Jesus did not”'
    claim: 'Paul: David saw corruption'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/13?lang=eng'
    quote: 'For David, after he had served his own generation by the will of God, fell on sleep, and was laid unto his fathers, and saw corruption'
  - where: 'note 16:10 “David saw corruption; Jesus did not”'
    claim: 'Paul: He whom God raised saw no corruption'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/13?lang=eng'
    quote: 'But he, whom God raised again, saw no corruption.'
  - where: 'note 16:10 “David saw corruption; Jesus did not”'
    claim: 'Paul argued in Antioch that David was not speaking of himself'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Paul went on to argue that David was not speaking of himself in this verse because, as they all knew, David had died'
  - where: 'note 16:10 “David saw corruption; Jesus did not”'
    claim: 'The Greek has “corruption”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/16.htm'
    quote: 'neither wilt thou suffer thine Holy One to see corruption'
  - where: 'note 16:10 “David saw corruption; Jesus did not”'
    claim: 'The Hebrew word is shachat, a pit'
    key: bdb
    url: 'https://biblehub.com/hebrew/7845.htm'
