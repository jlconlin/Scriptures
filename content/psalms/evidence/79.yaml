chapter: 79
claims:
  - where: 'when'
    claim: 'The title ascribes the psalm to Asaph'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/79?lang=eng'
    quote: 'A Psalm of Asaph.'
  - where: 'when'
    claim: 'The Church’s chapter heading describes the occasion without dating it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/79?lang=eng'
    quote: 'The heathen nations destroy Jerusalem and defile the temple—Israel pleads for forgiveness and deliverance.'

  - where: 'setting'
    claim: 'Asaph’s psalms are 50 and 73–83'
    key: bd-asaph
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/asaph?lang=eng'
    quote: 'mentioned in the titles of various Psalms. See 1 Chr. 6:39; 15:17, 19; 16:4–7, 37; 25:1–9; 2 Chr. 5:12; 20:14; Ezra 2:41; 3:10; Neh. 7:44; Ps. 50; 73–83.'
  - where: 'setting'
    claim: 'Some psalms under Asaph’s name may be by later musicians of his guild, which lasted past the exile'
    key: scripture-helps-ps-49
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/33-psalms-49-51-61-66-69-72-77-78-85-86?lang=eng'
    quote: 'He established a guild of musicians that continued until after the Babylonian exile. … though some of these may have been written by successive musicians of his guild.'
  - where: 'setting'
    claim: 'A lament spoken as “we” is the communal kind'
    key: sc-knowhy-438
    url: 'https://scripturecentral.org/knowhy/why-do-biblical-psalms-of-lament-show-up-in-the-book-of-mormon'
    quote: 'Psalms of lament come in two basic types: individual (in which the speaker is “I/me”), and communal (“we/us”).'
  - where: 'setting'
    claim: 'Kings records the burning of the temple and of all the houses of Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'and all the houses of Jerusalem, and every great man’s house burnt he with fire'
  - where: 'setting'
    claim: 'Lamentations mourns the nations entering the sanctuary'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/1?lang=eng'
    quote: 'the heathen entered into her sanctuary'
  - where: 'setting'
    claim: 'Psalm 79 has been called the companion of Psalm 74'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/79.htm'
    quote: 'This Psalm is in every respect the pendant of Psalm 74.'
  - where: 'setting'
    claim: 'The flock of verse 13 joins the psalm to the end of Psalm 78'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/79.htm'
    quote: 'the conception of Israel as of a flock, in which respect Psalm 79:1-13 is judiciously appended to Psalm 78:70-72'
  - where: 'setting'
    claim: 'The Church’s heading names the two things the psalm does, and gives no date'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/79?lang=eng'
    quote: 'The heathen nations destroy Jerusalem and defile the temple—Israel pleads for forgiveness and deliverance.'

  - where: 'thread'
    claim: 'A lament’s usual parts include a petition and a vow of praise'
    key: sc-knowhy-438
    url: 'https://scripturecentral.org/knowhy/why-do-biblical-psalms-of-lament-show-up-in-the-book-of-mormon'
    quote: '(1) invocation, (2) complaint, (3) confession of trust, (4) petition, and (5) vow of praise'
  - where: 'thread'
    claim: '“Reproach” in verse 4 and verse 12 is one Hebrew noun, and “neighbours” one word in both verses'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חֶ֭רְפָּה'
  - where: 'thread'
    claim: '“Shed” in verse 3, “pour out” in verse 6 and “shed” in verse 10 are one Hebrew verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שָׁפְכ֬וּ'
  - where: 'thread'
    claim: '“Have not known” in verse 6 and “let him be known” in verse 10 are one Hebrew verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יִוָּדַ֣ע'
  - where: 'thread'
    claim: 'Psalm 44, another lament of the nation, says the people have kept the covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/44?lang=eng'
    quote: 'yet have we not forgotten thee, neither have we dealt falsely in thy covenant'

  - where: 'section 1 plain'
    claim: 'Verse 1: “heathen” is “nations,” and “on heaps” is “in ruins”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2079&version=NRSVUE'
    quote: 'they have laid Jerusalem in ruins.'
  - where: 'section 1 plain'
    claim: 'Verse 4: “reproach” is a taunt'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2079&version=NRSVUE'
    quote: 'We have become a taunt to our neighbors,'
  - where: 'section 3 plain'
    claim: 'Verse 8: “former iniquities” are the forefathers’, and “prevent us” is “come to meet us”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2079&version=NRSVUE'
    quote: 'let your compassion come speedily to meet us,'
  - where: 'section 3 plain'
    claim: 'Verse 9: “purge away” is rendered “forgive”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2079&version=NRSVUE'
    quote: 'deliver us and forgive our sins,'
  - where: 'section 4 plain'
    claim: 'Verse 11: “appointed to die” is “doomed to die”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2079&version=NRSVUE'
    quote: 'according to your great power, preserve those doomed to die.'

  - where: 'note 79:1 “Which ruin of Jerusalem?”'
    claim: 'A modern translation has “the nations” where the King James has “the heathen”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2079&version=NRSVUE'
    quote: '1 O God, the nations have come into your inheritance;'
  - where: 'note 79:1 “Which ruin of Jerusalem?”'
    claim: 'Kings records the burning of the temple and the city by the Babylonians'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/25?lang=eng'
    quote: 'and all the houses of Jerusalem, and every great man’s house burnt he with fire'
  - where: 'note 79:1 “Which ruin of Jerusalem?”'
    claim: 'Chronicles records a slaughter in the sanctuary itself at the Babylonian conquest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/36?lang=eng'
    quote: 'who slew their young men with the sword in the house of their sanctuary'
  - where: 'note 79:1 “Which ruin of Jerusalem?”'
    claim: 'One older commentary holds that the defiling of the temple together with a massacre of the faithful fits only the Maccabean age'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/79.htm'
    quote: 'in conjunction with a defiling of the Temple and a massacre of the servants of God, of the Chasdm (1 Macc. 7:13, 2 Macc. 14:6), such as the age of the Seleucidae exclusively can exhibit'
  - where: 'note 79:1 “Which ruin of Jerusalem?”'
    claim: 'The same commentary grants that the Babylonian period also saw the temple and city destroyed'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/79.htm'
    quote: 'concerning a destruction of the Temple and of Jerusalem, such as only the age of the Seleucidae (1 Macc. 1:31; 3:45, 2 Macc. 8:3) together with the Chaldaean period'
  - where: 'note 79:1 “Which ruin of Jerusalem?”'
    claim: '1 Maccabees quotes verses 2–3 as words already written, over sixty men killed in one day'
    key: first-maccabees
    url: 'https://biblehub.com/apocrypha/1_maccabees/7.htm'
    quote: 'he took of them threescore men, and slew them in one day, according to the words which he wrote, 17 The flesh of thy saints have they cast out, and their blood have they shed round about Jerusalem, and there was none to bury them.'
  - where: 'note 79:1 “Which ruin of Jerusalem?”'
    claim: 'The Church’s heading gives no date'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/79?lang=eng'
    quote: 'The heathen nations destroy Jerusalem and defile the temple—Israel pleads for forgiveness and deliverance.'

  - where: 'note 79:1 “Micah’s word about Jerusalem”'
    claim: 'Micah foretold that Jerusalem would become heaps'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/micah/3?lang=eng'
    quote: 'Therefore shall Zion for your sake be plowed as a field, and Jerusalem shall become heaps'
  - where: 'note 79:1 “Micah’s word about Jerusalem”'
    claim: 'Micah’s saying was quoted at Jeremiah’s trial as spoken in Hezekiah’s days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/26?lang=eng'
    quote: 'Micah the Morasthite prophesied in the days of Hezekiah king of Judah'
  - where: 'note 79:1 “Micah’s word about Jerusalem”'
    claim: 'The psalm’s word for “heaps” is the word of Micah 3:12 (Strong’s 5856)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Mic.xml'
    quote: 'עִיִּ֣ין'
  - where: 'note 79:1 “Micah’s word about Jerusalem”'
    claim: 'The same word stands in Psalm 79:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לְ/עִיִּֽים'
  - where: 'note 79:1 “Micah’s word about Jerusalem”'
    claim: 'The word means a ruin'
    key: bdb
    url: 'https://biblehub.com/hebrew/5856.htm'
    quote: 'a ruin, heap of ruins'

  - where: 'note 79:2 “The unburied dead and the covenant’s curse”'
    claim: 'Deuteronomy lists unburied bodies left to birds and beasts among the curses of the covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: 'And thy carcase shall be meat unto all fowls of the air, and unto the beasts of the earth, and no man shall fray them away.'
  - where: 'note 79:2 “The unburied dead and the covenant’s curse”'
    claim: 'Jeremiah foretold the same of Judah, and that there would be none to bury them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/14?lang=eng'
    quote: 'and they shall have none to bury them'
  - where: 'note 79:2 “The unburied dead and the covenant’s curse”'
    claim: '“Saints” is hasidim, an adjective meaning kind, pious'
    key: bdb
    url: 'https://biblehub.com/hebrew/2623.htm'
    quote: 'kind, pious'
  - where: 'note 79:2 “The unburied dead and the covenant’s curse”'
    claim: 'The word in verse 2 is Strong’s 2623'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חֲ֝סִידֶ֗י/ךָ'
  - where: 'note 79:5 “Jealousy is the covenant’s word”'
    claim: 'In scripture “jealous” can mean fervent, with deep feelings about someone'
    key: gs-jealous
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jealous-jealousy?lang=eng'
    quote: '(1) to be fervent and to have sensitive and deep feelings about someone or something'
  - where: 'note 79:5 “Jealousy is the covenant’s word”'
    claim: 'The lexicon files this verse under God’s jealousy against men, joined with fire'
    key: bdb
    url: 'https://biblehub.com/hebrew/7068.htm'
    quote: 'b. of God against men'
  - where: 'note 79:5 “Jealousy is the covenant’s word”'
    claim: 'The law gives Jealous as a name of the Lord, in the command to worship no other god'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'For thou shalt worship no other god'
  - where: 'note 79:5 “Jealousy is the covenant’s word”'
    claim: 'A modern translation joins the jealousy and the anger'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2079&version=NRSVUE'
    quote: 'Will your jealous wrath burn like fire?'

  - where: 'note 79:6 “Jeremiah’s prayer, and the verb of verse 3”'
    claim: 'Jeremiah 10:25 has the same prayer, longer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/10?lang=eng'
    quote: 'Pour out thy fury upon the heathen that know thee not, and upon the families that call not on thy name: for they have eaten up Jacob, and devoured him, and consumed him, and have made his habitation desolate.'
  - where: 'note 79:6 “Jeremiah’s prayer, and the verb of verse 3”'
    claim: 'Jeremiah has “families” (a different Hebrew noun) where the psalm has “kingdoms”; “pour out” and “wrath” are the same Hebrew words in both'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'מִשְׁפָּח֔וֹת'
  - where: 'note 79:6 “Jeremiah’s prayer, and the verb of verse 3”'
    claim: '“Pour out” (verse 6) is the verb of “shed” in verses 3 and 10 (Strong’s 8210)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שְׁפֹ֤ךְ'
  - where: 'note 79:8 “The forefathers’ sins, and our own”'
    claim: 'A modern translation reads the iniquities as the ancestors’'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2079&version=NRSVUE'
    quote: '8 Do not remember against us the iniquities of our ancestors;'
  - where: 'note 79:8 “The forefathers’ sins, and our own”'
    claim: 'The ancient Greek reads the iniquities as the people’s own old sins'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/79.htm'
    quote: 'Remember not our old transgressions'
  - where: 'note 79:8 “The forefathers’ sins, and our own”'
    claim: 'The Hebrew word can be an adjective, “former,” or a noun, “former persons, ancestors”; the lexicon lists this verse under “former”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7223.htm'
    quote: 'as substantive, former persons, ancestors, men of old'
  - where: 'note 79:8 “The forefathers’ sins, and our own”'
    claim: 'Lamentations says the fathers sinned and the children bear it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/5?lang=eng'
    quote: 'Our fathers have sinned, and are not; and we have borne their iniquities.'
  - where: 'note 79:8 “The forefathers’ sins, and our own”'
    claim: 'Daniel confesses both together in a prayer for Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/9?lang=eng'
    quote: 'because for our sins, and for the iniquities of our fathers, Jerusalem and thy people are become a reproach to all that are about us'
  - where: 'note 79:9 “Atonement asked for the name’s sake”'
    claim: '“Purge away” is the verb kipper, to cover over, make propitiation'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'denominative cover over (figurative), pacify, make propitiation'
  - where: 'note 79:9 “Atonement asked for the name’s sake”'
    claim: 'With God as subject the verb describes an atonement that He provides and men could not'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'It is conceived that God in his sovereignty may himself provide an atonement or covering for men and their sins which could not be provided by men.'
  - where: 'note 79:9 “Atonement asked for the name’s sake”'
    claim: 'The lexicon lists Psalm 78:38 and Psalm 79:9 together under that use'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'with accusative of the sin Psalm 65:4; Psalm 78:38'
  - where: 'note 79:9 “Atonement asked for the name’s sake”'
    claim: 'The verb in verse 9 is Strong’s 3722, and “thy name” stands in verse 6 and twice in verse 9'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וְ/כַפֵּ֥ר'
  - where: 'note 79:9 “Atonement asked for the name’s sake”'
    claim: 'A modern translation has “forgive”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2079&version=NRSVUE'
    quote: 'deliver us and forgive our sins,'
  - where: 'note 79:9 “Atonement asked for the name’s sake”'
    claim: 'In Ezekiel the Lord says He will act for His name’s sake and not for Israel’s'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'I do not this for your sakes, O house of Israel, but for mine holy name’s sake, which ye have profaned among the heathen, whither ye went.'

  - where: 'note 79:10 “The question the nations ask”'
    claim: 'Moses used the same argument after the golden calf'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng'
    quote: 'Wherefore should the Egyptians speak, and say, For mischief did he bring them out'
  - where: 'note 79:10 “The question the nations ask”'
    claim: 'Joel gives the priests the same question to pray'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'wherefore should they say among the people, Where is their God?'
  - where: 'note 79:10 “The question the nations ask”'
    claim: 'The song of Moses promises that God will avenge the blood of His servants'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng'
    quote: 'for he will avenge the blood of his servants, and will render vengeance to his adversaries'
  - where: 'note 79:10 “The question the nations ask”'
    claim: '“Blood” and “servants” in Deuteronomy 32:43 are the Hebrew words of Psalm 79:10'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'עֲבָדָ֖י/ו'
  - where: 'note 79:10 “The question the nations ask”'
    claim: '“Let him be known” (verse 10) is the verb of “have not known thee” (verse 6), Strong’s 3045'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יִוָּדַ֣ע'

  - where: 'note 79:11 “Sons of death”'
    claim: 'The Hebrew is “children of death,” those appointed to death'
    key: bdb
    url: 'https://biblehub.com/hebrew/8546.htm'
    quote: 'children of death, those worthy of death and appointed to death, Psalm 79:11; Psalm 102:21'
  - where: 'note 79:11 “Sons of death”'
    claim: 'The Hebrew words of verse 11 are “sons of” and “death”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תְמוּתָֽה'
  - where: 'note 79:11 “Sons of death”'
    claim: '“Power” is the word for arm, as the ancient Greek renders it'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/79.htm'
    quote: 'according to the greatness of thine arm preserve the sons of the slain ones'
  - where: 'note 79:11 “Sons of death”'
    claim: 'The lexicon sets the phrase beside the song at the sea'
    key: bdb
    url: 'https://biblehub.com/hebrew/2220.htm'
    quote: 'Exodus 15:16 (song)'
  - where: 'note 79:11 “Sons of death”'
    claim: 'Psalm 102:20 has the same pair, the prisoner’s groaning and those appointed to death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/102?lang=eng'
    quote: 'To hear the groaning of the prisoner; to loose those that are appointed to death;'

  - where: 'note 79:12 “Sevenfold, into the bosom”'
    claim: 'Sevenfold means a requital carried out in full'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/79.htm'
    quote: 'A sevenfold requital (cf. Genesis 4:15, Genesis 4:24) is a requital that is fully carried out as a criminal sentence, for seven is the number of a completed process.'
  - where: 'note 79:12 “Sevenfold, into the bosom”'
    claim: 'The bosom is where a person receives and holds what is handed to him'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/79.htm'
    quote: 'The bosom is mentioned as that in which one takes up and holds that which is handed to him (Luke 6:38)'
  - where: 'note 79:12 “Sevenfold, into the bosom”'
    claim: 'One reading of why the neighbours are singled out'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/79.htm'
    quote: 'these, who might most readily come to the knowledge of the God of Israel as the one living and true God, have the greatest degree of guilt on account of their reviling of God'
  - where: 'note 79:12 “Sevenfold, into the bosom”'
    claim: '“Reproach” is the noun of verse 4, and “neighbours” the word of verse 4'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לִ/שְׁכֵנֵ֣י/נוּ'

  - where: 'note 79:13 “The flock gets the last word”'
    claim: 'A lament commonly ends in a vow of praise'
    key: sc-knowhy-438
    url: 'https://scripturecentral.org/knowhy/why-do-biblical-psalms-of-lament-show-up-in-the-book-of-mormon'
    quote: '(1) invocation, (2) complaint, (3) confession of trust, (4) petition, and (5) vow of praise'
  - where: 'note 79:13 “The flock gets the last word”'
    claim: 'The Hebrew opens the verse with “and we,” the pronoun written out'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וַ/אֲנַ֤חְנוּ'
  - where: 'note 79:13 “The flock gets the last word”'
    claim: 'Psalm 74 opens with the same name for the people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/74?lang=eng'
    quote: 'why doth thine anger smoke against the sheep of thy pasture?'
  - where: 'note 79:13 “The flock gets the last word”'
    claim: 'Ezekiel has the Lord call Israel the flock of His pasture'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/34?lang=eng'
    quote: 'And ye my flock, the flock of my pasture, are men, and I am your God'

  - where: 'christ'
    claim: 'Jehovah, the God of Israel, is the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: 'christ'
    claim: 'The Church’s footnote on “sheep” in verse 13 sends the reader to Alma 5, where the good shepherd calls in the name of Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/5?lang=eng'
    quote: 'the good shepherd doth call you; yea, and in his own name he doth call you, which is the name of Christ'
  - where: 'christ'
    claim: 'The Savior calls Himself the good shepherd who gives His life for the sheep'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/10?lang=eng'
    quote: 'I am the good shepherd: the good shepherd giveth his life for the sheep.'

  - where: 'explore'
    claim: 'Lamentations 5 prays over the same ruin: reproach, the inheritance turned to strangers, “for ever”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/5?lang=eng'
    quote: 'Our inheritance is turned to strangers, our houses to aliens.'
  - where: 'explore'
    claim: 'The souls under the altar ask how long until their blood is avenged'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/6?lang=eng'
    quote: 'dost thou not judge and avenge our blood on them that dwell on the earth?'
  - where: 'explore'
    claim: 'Revelation later says the blood of His servants has been avenged'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/19?lang=eng'
    quote: 'and hath avenged the blood of his servants at her hand'
  - where: 'parallels'
    claim: 'Jeremiah 10:25 repeats verses 6–7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/10?lang=eng'
    quote: 'Pour out thy fury upon the heathen that know thee not'
  - where: 'parallels'
    claim: 'Psalm 44:13 has the line of verse 4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/44?lang=eng'
    quote: 'Thou makest us a reproach to our neighbours, a scorn and a derision to them that are round about us.'

  - where: 'setting'
    claim: 'One older reading hears Micah 3:12 in verse 1 and Deuteronomy 28:26 in verse 2'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/79.htm'
    quote: 'The complaint in Psalm 79:1 reminds one of the prophecy of Micah, Micah 3:12, which in its time excited so much vexation (Jeremiah 26:18); and Psalm 79:2, Deuteronomy 28:26.'
  - where: 'note 79:10 “The question the nations ask”'
    claim: 'The plea “wherefore should they say” is traced to Moses’ prayer in the law'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/79.htm'
    quote: '(Exodus 32:12, cf. Numbers 14:13-17; Deuteronomy 9:28)'
  - where: 'note 79:10 “The question the nations ask”'
    claim: 'One older reading bases the wish of verse 10 on Deuteronomy 32:43, and ties the question to Joel 2:17'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/79.htm'
    quote: 'Here (cf. Psalm 115:2) it originates out of Joel 2:17. The wish expressed in Psalm 79:10 is based upon Deuteronomy 32:43.'
  - where: 'note 79:10 “The question the nations ask”'
    claim: '“In our sight”: the people wish to see the promise kept themselves'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/79.htm'
    quote: 'The poet wishes in company with his contemporaries, as eye-witnesses, to experience what God has promised in the early times, viz., that He will avenge the blood of His servants.'
  - where: 'note 79:9 “Atonement asked for the name’s sake”'
    claim: 'In the law the verb is used of atonement by legal rites, made by the priest'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'cover over, atone for sin and persons by legal rites'
  - where: 'note 79:9 “Atonement asked for the name’s sake”'
    claim: 'The lexicon’s first example of that use is the priest making atonement'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'and the priest shall make atonement Leviticus 16:32'
