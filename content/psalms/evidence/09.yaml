    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הִגָּי֣וֹן'
  - where: 'note 9:16 “Higgaion”'
    claim: 'The Greek renders Higgaion Selah as “A song of Pause”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/9.htm'
    quote: 'A song of Pause.'

  # ---------- note 9:17 ----------
  - where: 'note 9:17 “Back to Sheol”'
    claim: 'The Hebrew word is Sheol'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
