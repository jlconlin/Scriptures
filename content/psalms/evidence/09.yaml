  - where: 'note 9:17 “Back to Sheol”'
    claim: 'The verb “turned” is “return” (H7725)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יָשׁ֣וּבוּ'
  - where: 'note 9:17 “Back to Sheol”'
    claim: 'The same verb in verse 3, “turned back”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בְּ/שׁוּב'
  - where: 'note 9:17 “Back to Sheol”'
    claim: 'A modern translation of the line'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%209&version=NRSVUE'
    quote: 'The wicked shall depart to Sheol'
  - where: 'note 9:17 “Back to Sheol”'
    claim: 'The Greek has Hades'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/9.htm'
    quote: 'Let sinners be driven away into Hades'

  # ---------- note 9:20 ----------
  - where: 'note 9:20 “Only mortals”'
    claim: 'The word for “man” in verse 19'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֱנ֑וֹשׁ'
