  - where: 'note 9:16 “Higgaion”'
    claim: 'The word occurs three times in Psalms: here (scripts/hebrew.mjs psalms --word 1902)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הִגָּי֥וֹן'
  - where: 'note 9:16 “Higgaion”'
    claim: 'The word in Psalm 19:14 (Hebrew 19:15), “meditation”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וְ/הֶגְי֣וֹן'
  - where: 'note 9:16 “Higgaion”'
