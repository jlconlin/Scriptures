chapter: 103
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The title ascribes the psalm to David and gives no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/103?lang=eng'
    quote: 'A Psalm of David.'

  # ---- setting ----
  - where: 'setting'
    claim: 'The psalm before this one is the prayer of an afflicted man'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/102?lang=eng'
    quote: 'The psalmist offers a prayer of the afflicted'
  - where: 'setting'
    claim: 'Psalm 102 has the speaker withered like grass'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/102?lang=eng'
    quote: 'My days are like a shadow that declineth; and I am withered like grass.'
  - where: 'setting'
    claim: 'Psalm 102 looks for mercy on Zion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/102?lang=eng'
    quote: 'Thou shalt arise, and have mercy upon Zion: for the time to favour her, yea, the set time, is come.'
  - where: 'setting'
    claim: 'The Hebrew sentence “Bless the LORD, O my soul” stands in Psalms 103:1, 2, 22 and 104:1, 35'
    key: bdb
    url: 'https://biblehub.com/hebrew/1288.htm'
    quote: 'Psalm 103:1; Psalm 103:2; Psalm 103:22; Psalm 104:1; Psalm 104:35'
  - where: 'setting'
    claim: 'Psalm 104 opens with the sentence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/104?lang=eng'
    quote: 'Bless the Lord, O my soul. O Lord my God, thou art very great; thou art clothed with honour and majesty.'
  - where: 'setting'
    claim: 'Psalm 104 closes with the sentence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/104?lang=eng'
    quote: 'Bless thou the Lord, O my soul. Praise ye the Lord.'
  - where: 'setting'
    claim: 'Verse 8 repeats what the LORD proclaimed at Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'And the Lord passed by before him, and proclaimed, The Lord, The Lord God, merciful and gracious, longsuffering, and abundant in goodness and truth,'
  - where: 'setting'
    claim: 'The Lord says the words of verse 8 of Himself in Doctrine and Covenants 76'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng'
    quote: 'For thus saith the Lord—I, the Lord, am merciful and gracious unto those who fear me'
  - where: 'setting'
    claim: 'The Lectures on Faith quote verses 6–8 and 17–18'
    key: lectures-on-faith-3
    url: 'https://rsc.byu.edu/lectures-faith-historical-perspective/lecture-3'
    quote: 'The Lord is merciful and gracious, slow to anger, and plenteous in mercy” (Ps 103:6–8).'

  - where: 'setting'
    claim: 'Doctrine and Covenants 76 was given to Joseph Smith and Sidney Rigdon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng'
    quote: 'A vision given to Joseph Smith the Prophet and Sidney Rigdon, at Hiram, Ohio, February 16, 1832.'

  # ---- thread ----
  - where: 'thread'
    claim: 'In Psalm 102 the afflicted speaker says he is withered like grass'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/102?lang=eng'
    quote: 'My days are like a shadow that declineth; and I am withered like grass.'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Destruction” in verse 4 is the pit'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20103&version=NRSVUE'
    quote: 'who redeems your life from the Pit,'
  - where: 'section 2 plain'
    claim: '“Chide” in verse 9 is rendered “accuse”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20103&version=NRSVUE'
    quote: 'He will not always accuse,'
  - where: 'section 3 plain'
    claim: '“Our frame” in verse 14 is how we were made'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20103&version=NRSVUE'
    quote: 'For he knows how we were made;'

  # ---- note 103:1 ----
  - where: 'note 103:1 “A man telling himself to bless God”'
    claim: 'With God as its object the Hebrew verb “bless” means to adore, kneeling'
    key: bdb
    url: 'https://biblehub.com/hebrew/1288.htm'
    quote: 'bless God, adore with bended knees'

  # ---- note 103:4 ----
  - where: 'note 103:4 “Destruction is the pit”'
    claim: 'A modern translation has “the Pit” for “destruction”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20103&version=NRSVUE'
    quote: 'who redeems your life from the Pit,'
  - where: 'note 103:4 “Destruction is the pit”'
    claim: 'The Hebrew noun means pit'
    key: bdb
    url: 'https://biblehub.com/hebrew/7845.htm'
    quote: 'noun feminine pit'
  - where: 'note 103:4 “Destruction is the pit”'
    claim: 'The lexicon lists this verse among those where the word is the pit of Sheol'
    key: bdb
    url: 'https://biblehub.com/hebrew/7845.htm'
    quote: 'Psalm 103:4; personified Job 17:14'

  # ---- note 103:7 ----
  - where: 'note 103:7 “The prayer of Moses after the golden calf”'
    claim: 'Israel had made and worshipped the calf'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng'
    quote: 'they have made them a molten calf, and have worshipped it'
  - where: 'note 103:7 “The prayer of Moses after the golden calf”'
    claim: 'Moses asked to be shown the LORD’s way'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/33?lang=eng'
    quote: 'shew me now thy way, that I may know thee, that I may find grace in thy sight: and consider that this nation is thy people.'
  - where: 'note 103:7 “The prayer of Moses after the golden calf”'
    claim: 'The LORD promised to proclaim His name before Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/33?lang=eng'
    quote: 'I will make all my goodness pass before thee, and I will proclaim the name of the Lord before thee'
  - where: 'note 103:7 “The prayer of Moses after the golden calf”'
    claim: 'The proclamation at Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'The Lord, The Lord God, merciful and gracious, longsuffering, and abundant in goodness and truth,'
  - where: 'note 103:7 “The prayer of Moses after the golden calf”'
    claim: 'Verse 7 has Moses’ prayer of Exodus 33:13 in mind'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/103.htm'
    quote: 'The poet has in his mind Moses'' prayer: "make known to me now Thy way" (Exodus 33:13)'
  - where: 'note 103:7 “The prayer of Moses after the golden calf”'
    claim: 'The “ways” are God’s own ways of acting, not the paths He commands'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/103.htm'
    quote: 'those which He Himself follows in the course of His redemptive history'
  - where: 'note 103:7 “The prayer of Moses after the golden calf”'
    claim: 'The words of Exodus 34:6 became a formula of Israel’s faith'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/103.htm'
    quote: 'is become a formula of the Israelitish faith'
  - where: 'note 103:7 “The prayer of Moses after the golden calf”'
    claim: 'Joel has the formula'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/joel/2?lang=eng'
    quote: 'for he is gracious and merciful, slow to anger, and of great kindness, and repenteth him of the evil.'
  - where: 'note 103:7 “The prayer of Moses after the golden calf”'
    claim: 'Psalm 145 has the formula'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/145?lang=eng'
    quote: 'The Lord is gracious, and full of compassion; slow to anger, and of great mercy.'
  - where: 'note 103:7 “The prayer of Moses after the golden calf”'
    claim: 'A modern translation has “accuse” for “chide”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20103&version=NRSVUE'
    quote: 'He will not always accuse,'

  # ---- note 103:8 ----
  - where: 'note 103:8 “The Lord says it of Himself again”'
    claim: 'The Lord speaks the words of verse 8 in the first person and adds “unto those who fear me”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng'
    quote: 'For thus saith the Lord—I, the Lord, am merciful and gracious unto those who fear me, and delight to honor those who serve me in righteousness and in truth unto the end.'
  - where: 'note 103:8 “The Lord says it of Himself again”'
    claim: 'The Lord who speaks in that revelation is the Savior'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng'
    quote: 'for the Lord is God, and beside him there is no Savior.'
  - where: 'note 103:8 “The Lord says it of Himself again”'
    claim: 'The third Lecture on Faith sets Exodus 34:6 and Psalm 103:6–8, 17–18 together'
    key: lectures-on-faith-3
    url: 'https://rsc.byu.edu/lectures-faith-historical-perspective/lecture-3'
    quote: 'The Lord is merciful and gracious, slow to anger, and plenteous in mercy” (Ps 103:6–8).'
  - where: 'note 103:8 “The Lord says it of Himself again”'
    claim: 'The lecture concludes that God has always been so and always will be'
    key: lectures-on-faith-3
    url: 'https://rsc.byu.edu/lectures-faith-historical-perspective/lecture-3'
    quote: 'Secondly, he is merciful and gracious, slow to anger, abundant in goodness, and he was so from everlasting, and will be to everlasting.'
  - where: 'note 103:8 “The Lord says it of Himself again”'
    claim: 'The lecture says why faith needs this knowledge of God'
    key: lectures-on-faith-3
    url: 'https://rsc.byu.edu/lectures-faith-historical-perspective/lecture-3'
    quote: 'those who know their weakness and liability to sin would be in constant doubt of salvation if it were not for the idea which they have of the excellency of the character of God'

  # ---- note 103:14 ----
  - where: 'note 103:14 “Frame is what was formed”'
    claim: 'The Hebrew noun means form or framing'
    key: bdb
    url: 'https://biblehub.com/hebrew/3336.htm'
    quote: 'form, framing, purpose'
  - where: 'note 103:14 “Frame is what was formed”'
    claim: 'In this verse it is the form of man as made of dust'
    key: bdb
    url: 'https://biblehub.com/hebrew/3336.htm'
    quote: 'form of man as made of the dust'
  - where: 'note 103:14 “Frame is what was formed”'
    claim: 'The related verb is used of God forming Adam as a potter'
    key: bdb
    url: 'https://biblehub.com/hebrew/3335.htm'
    quote: '(as a potter) forming Adam out of'
  - where: 'note 103:14 “Frame is what was formed”'
    claim: 'Genesis 2:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/2?lang=eng'
    quote: 'And the Lord God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul.'
  - where: 'note 103:14 “Frame is what was formed”'
    claim: 'A modern translation renders “how we were made”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20103&version=NRSVUE'
    quote: 'For he knows how we were made;'

  # ---- note 103:17 ----
  - where: 'note 103:17 “What outlasts the grass”'
    claim: '“Mercy” in this psalm is hesed, covenantal love'
    key: scripture-helps-ps-102
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/34-psalms-102-103-110-116-119-127-128-135-139-146-150?lang=eng'
    quote: 'The Hebrew word translated as “mercy” in Psalm 103 is hesed, which is often used in the Old Testament in reference to God’s covenantal love.'
  - where: 'note 103:17 “What outlasts the grass”'
    claim: 'The words about generations at Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'Keeping mercy for thousands, forgiving iniquity and transgression and sin, and that will by no means clear the guilty; visiting the iniquity of the fathers upon the children, and upon the children’s children, unto the third and to the fourth generation.'
  - where: 'note 103:17 “What outlasts the grass”'
    claim: 'The Ten Commandments name those to whom mercy is shown'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/20?lang=eng'
    quote: 'And shewing mercy unto thousands of them that love me, and keep my commandments.'
  - where: 'note 103:17 “What outlasts the grass”'
    claim: 'Verse 17’s “children’s children” has been read beside Exodus 20:6 and 34:7'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/103.htm'
    quote: 'children''s children, according to Exodus 20:6; Exodus 34:7; Deuteronomy 7:9'
  - where: 'note 103:17 “What outlasts the grass”'
    claim: 'Verse 18 describes those who keep His covenant and precepts'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/103.htm'
    quote: 'which rewards faithful adherence to His covenant and conscientious fulfilment of His precepts'

  # ---- note 103:20 ----
  - where: 'note 103:20 “Out to all His works, and back to one soul”'
    claim: 'Psalm 148 calls on the angels and the hosts together'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/148?lang=eng'
    quote: 'Praise ye him, all his angels: praise ye him, all his hosts.'

  # ---- christ ----
  - where: 'christ'
    claim: '“LORD” in the Old Testament usually means Jehovah'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Usually, when the word Lord appears in the Old Testament, it means “Jehovah.”'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: 'christ'
    claim: 'The Lord who speaks the psalm’s words in Doctrine and Covenants 76 is the Savior'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/76?lang=eng'
    quote: 'for the Lord is God, and beside him there is no Savior.'
  - where: 'christ'
    claim: 'The Savior’s mercy reaches back before His atoning sacrifice because of that sacrifice'
    key: scripture-helps-ps-102
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/34-psalms-102-103-110-116-119-127-128-135-139-146-150?lang=eng'
    quote: 'Because of the Savior’s atoning sacrifice, the Savior’s mercy can be extended even to those who lived before His atoning sacrifice was performed'
  - where: 'christ'
    claim: 'King Benjamin on remission of sins before Christ came'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/3?lang=eng'
    quote: 'the same might receive remission of their sins, and rejoice with exceedingly great joy, even as though he had already come among them.'

  # ---- explore ----
  - where: 'explore'
    claim: 'The third Lecture on Faith reasons from these verses'
    key: lectures-on-faith-3
    url: 'https://rsc.byu.edu/lectures-faith-historical-perspective/lecture-3'
    quote: 'Having an idea of these facts does away with doubt and makes faith exceedingly strong.'

  # ---- parallels ----
  - where: 'parallels'
    claim: 'Exodus 33:13, the prayer verse 7 looks back to'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/33?lang=eng'
    quote: 'shew me now thy way, that I may know thee'
  - where: 'parallels'
    claim: 'Genesis 2:7, man formed of dust'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/2?lang=eng'
    quote: 'And the Lord God formed man of the dust of the ground'
