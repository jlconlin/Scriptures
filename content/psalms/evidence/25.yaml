  # note 25:16
  - where: 'note 25:16 “Alone and poor”'
    claim: '“Desolate” is yachid'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יָחִ֖יד'
