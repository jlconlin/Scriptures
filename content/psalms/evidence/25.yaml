    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/israels-ancient-psalms'
    quote: 'Several other verses from Psalms reflect the kind of poor people that Jesus was referring to in this Beatitude (Psalms 10:8; 14:6; 22:24; 25:16; as well as others).'

