    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תִּ֫זְכֹּ֥ר'
  - where: 'note 25:7 “Three rememberings”'
    claim: 'Verse 7 has the verb a third time, “remember thou me”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'זְכָר'
  - where: 'note 25:7 “Three rememberings”'
    claim: '“Lovingkindnesses” in verse 6 is the plural of hesed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וַ/חֲסָדֶ֑י/ךָ'
  - where: 'note 25:7 “Three rememberings”'
    claim: '“Mercy” in verse 7 is hesed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'כְּ/חַסְדְּ/ךָ֥'
  - where: 'note 25:7 “Three rememberings”'
    claim: '“Mercy” in verse 10 is hesed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חֶ֣סֶד'
  - where: 'note 25:7 “Three rememberings”'
    claim: 'A modern translation renders the word “steadfast love” in verses 6 and 7 and “ever of old” as “from of old”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2025&version=NRSVUE'
    quote: 'for they have been from of old.'
  - where: 'note 25:7 “Three rememberings”'
    claim: 'Verse 7 in a modern translation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2025&version=NRSVUE'
    quote: 'according to your steadfast love remember me'

  # note 25:11
  - where: 'note 25:11 “The greatness of the sin as the reason”'
    claim: 'The “for” gives the ground of the need and urgency of the petition'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/25.htm'
    quote: 'gives the ground of the need and urgency of the petition'
  - where: 'note 25:11 “The greatness of the sin as the reason”'
    claim: 'The ground of hope is the name, God’s nature shown in mercy and truth, and nothing the psalmist has done'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/25.htm'
    quote: 'His nature that has become manifest in His mercy and truth, permits him to ask and to hope for forgiveness, not for the sake of anything whatever that he has done, but just for the sake of this name'
  - where: 'note 25:11 “The greatness of the sin as the reason”'
    claim: 'The commentary sets Jeremiah 14:7 beside the verse'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/25.htm'
    quote: 'but just for the sake of this name (Jeremiah 14:7; Isaiah 43:25)'
  - where: 'note 25:11 “The greatness of the sin as the reason”'
    claim: 'A modern translation: “pardon my guilt, for it is great”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2025&version=NRSVUE'
    quote: 'pardon my guilt, for it is great.'

  # note 25:13
  - where: 'note 25:13 “The meek, and the earth their children inherit”'
    claim: '“The meek” of verse 9 is anavim, twice'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'עֲ֭נָוִים'
  - where: 'note 25:13 “The meek, and the earth their children inherit”'
    claim: 'The word names the poor, weak and afflicted of Israel, and is usually rendered meek; the lexicon lists Psalm 25:9 and 37:11 together'
    key: bdb
    url: 'https://biblehub.com/hebrew/6035.htm'
    quote: 'poor, weak and afflicted Israel (usually rendered meek)'
  - where: 'note 25:13 “The meek, and the earth their children inherit”'
    claim: 'The general gloss of the word'
    key: bdb
    url: 'https://biblehub.com/hebrew/6035.htm'
    quote: 'poor, afflicted, humble, meek'
  - where: 'note 25:13 “The meek, and the earth their children inherit”'
    claim: 'Verse 13 has the verb “inherit” and the noun “earth” or “land”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יִ֣ירַשׁ'
  - where: 'note 25:13 “The meek, and the earth their children inherit”'
    claim: 'Psalm 37:11 has the same word for the meek with the same verb and noun'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וַ/עֲנָוִ֥ים'
  - where: 'note 25:13 “The meek, and the earth their children inherit”'
    claim: 'Psalm 37:11, the verb “shall inherit”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יִֽירְשׁוּ'
  - where: 'note 25:13 “The meek, and the earth their children inherit”'
    claim: 'A modern translation has “land” for “earth” and “children” for “seed”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2025&version=NRSVUE'
    quote: 'and their children shall possess the land.'
  - where: 'note 25:13 “The meek, and the earth their children inherit”'
    claim: 'Psalm 37:11 in the King James text: the meek shall inherit the earth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/37?lang=eng'
    quote: 'But the meek shall inherit the earth'
  - where: 'note 25:13 “The meek, and the earth their children inherit”'
    claim: 'Psalm 37:11 is the foundation of the third Beatitude'
    key: skinner-beatitudes
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/israels-ancient-psalms'
    quote: 'There is no mistaking the direct influence of and foundation laid by Psalm 37:11 for this beatitude'
  - where: 'note 25:13 “The meek, and the earth their children inherit”'
    claim: 'Latter-day scripture reveals the meek as those who obtain the celestial kingdom (D&C 88:17 quoted)'
    key: skinner-beatitudes
    url: 'https://rsc.byu.edu/sermon-mount-latter-day-scripture/israels-ancient-psalms'
    quote: 'the Lord himself revealed in latter-day scripture that the meek are those who shall obtain the celestial kingdom'

