chapter: 25
claims:
  # setting
  - where: 'setting'
    claim: 'Psalms 25–31 stand in the first of the five books of the Psalter'
    key: alford-baker-psalm-nephi
    url: 'https://rsc.byu.edu/ascending-mountain-lord/parallels-between-psalms-25-31-psalm-nephi'
    quote: 'Psalms 25–31 appear in what is often identified as the first of five “books” of the Psalter (Psalms 1–41).'
  - where: 'setting'
    claim: 'The psalm has no historical background that can be identified'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/25.htm'
    quote: 'It is without any definite background indicating the history of the times in which it was composed'
  - where: 'setting'
    claim: 'Psalm 25 has been classed as the lament of one person'
    key: alford-baker-psalm-nephi
    url: 'https://rsc.byu.edu/ascending-mountain-lord/parallels-between-psalms-25-31-psalm-nephi'
    quote: 'He identified Psalms 25–28 and 31 as individual laments'
  - where: 'setting'
    claim: 'The psalm weaves trust, guilt over past sin, and the threat of enemies'
    key: alford-baker-psalm-nephi
    url: 'https://rsc.byu.edu/ascending-mountain-lord/parallels-between-psalms-25-31-psalm-nephi'
    quote: 'guilt over past sin (vv. 7, 11, 18), the enemy threat (vv. 2, 15, 19)'
  - where: 'setting'
    claim: 'The three strands, with the verses of the first'
    key: alford-baker-psalm-nephi
    url: 'https://rsc.byu.edu/ascending-mountain-lord/parallels-between-psalms-25-31-psalm-nephi'
    quote: 'weaves together various attitudes which include trust in and longing for God’s response (vv. 1–2, 5b, 15, 16, 20–21)'
  - where: 'setting'
    claim: 'Psalm 25 is an alphabetic psalm and the companion of Psalm 34'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/25.htm'
    quote: 'it is one of the nine alphabetical Psalms of the whole collection, and the companion to Psalm 34'
  - where: 'setting'
    claim: 'The alphabetic arrangement is handled freely and not carried through'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/25.htm'
    quote: 'is handled very freely and not fully carried out'
  - where: 'setting'
    claim: 'Verse 1 (after the title) begins with aleph'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֵלֶ֥י/ךָ'
  - where: 'setting'
    claim: 'Verse 3 begins with gimel'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'גַּ֣ם'
  - where: 'setting'
    claim: 'Verse 4 begins with daleth'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'דְּרָכֶ֣י/ךָ'
  - where: 'setting'
    claim: 'The essay suggests Psalms 25–31 may have influenced Nephi’s psalm'
    key: alford-baker-psalm-nephi
    url: 'https://rsc.byu.edu/ascending-mountain-lord/parallels-between-psalms-25-31-psalm-nephi'
    quote: 'The purpose of this essay is to suggest that Psalms 25–31 may have had a particular influence upon Nephi as he wrote his psalm.'

  # thread
  - where: 'thread'
    claim: '“Wait” in verse 3 is the verb qavah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'קֹ֭וֶי/ךָ'
  - where: 'thread'
    claim: '“Wait” in verse 5 is the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'קִ֝וִּ֗יתִי'
  - where: 'thread'
    claim: '“Wait” in verse 21 is the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'קִוִּיתִֽי/ךָ'
  - where: 'thread'
    claim: 'The verb means to wait or look eagerly for, and the lexicon lists Psalm 25:5 and 25:21 and Isaiah 40:31 under it'
    key: bdb
    url: 'https://biblehub.com/hebrew/6960.htm'
    quote: 'wait, or look eagerly, for'
  - where: 'thread'
    claim: '“Ashamed” in verse 2 and in verse 20 is one Hebrew verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֵב֑וֹשָׁה'
  - where: 'thread'
    claim: '“Ashamed” in verse 20'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֵ֝ב֗וֹשׁ'

  # sections
  - where: 'section 1 plain'
    claim: 'Verse 3: those who “transgress without cause” are the wantonly treacherous'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2025&version=NRSVUE'
    quote: 'let them be ashamed who are wantonly treacherous.'
  - where: 'section 3 plain'
    claim: 'Verse 9: “the meek … in judgment” as the humble led in what is right'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2025&version=NRSVUE'
    quote: 'He leads the humble in what is right'
  - where: 'section 4 plain'
    claim: 'Verse 14: the “secret” as the LORD’s friendship or confidence'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2025&version=NRSVUE'
    quote: 'The friendship of the Lord is for those who fear him'
  - where: 'section 5 plain'
    claim: 'Verse 16: “desolate” is lonely'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2025&version=NRSVUE'
    quote: 'for I am lonely and afflicted.'

  # note 25:7
  - where: 'note 25:7 “Three rememberings”'
