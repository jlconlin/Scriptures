  - where: 'note 25:17 “Nephi’s psalm beside this one”'
    claim: 'The stated purpose of the essay'
    key: alford-baker-psalm-nephi
    url: 'https://rsc.byu.edu/ascending-mountain-lord/parallels-between-psalms-25-31-psalm-nephi'
    quote: 'may have had a particular influence upon Nephi as he wrote his psalm'
  - where: 'note 25:17 “Nephi’s psalm beside this one”'
    claim: 'Nephi’s grief over his sins is set beside Psalm 25:7, 11 and 17–18'
    key: alford-baker-psalm-nephi
    url: 'https://rsc.byu.edu/ascending-mountain-lord/parallels-between-psalms-25-31-psalm-nephi'
    quote: 'These verses from Psalms sound similar in tone:'
  - where: 'note 25:17 “Nephi’s psalm beside this one”'
    claim: 'Psalm 25:17–18 is one of the verses listed'
    key: alford-baker-psalm-nephi
