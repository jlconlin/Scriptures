chapter: 122
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The title ascribes the psalm to David and gives no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/122?lang=eng'
    quote: 'A Song of degrees of David.'

  # ---- setting ----
  - where: 'setting'
    claim: 'The songs of degrees are fifteen psalms, 120–134, probably sung by pilgrims going up to Jerusalem'
    key: bd-degrees-songs-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/degrees-songs-of?lang=eng'
    quote: 'Fifteen Psalms (120–34), probably so called because they were sung by Jewish pilgrims on their way up to Jerusalem.'
  - where: 'setting'
    claim: 'Psalm 120, the first song of degrees, is sung by one who sojourns among strangers (verse 5) and has dwelt with a hater of peace'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/120?lang=eng'
    quote: 'My soul hath long dwelt with him that hateth peace.'
  - where: 'setting'
    claim: 'Psalm 121 looks up to the hills'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/121?lang=eng'
    quote: 'I will lift up mine eyes unto the hills, from whence cometh my help.'
  - where: 'setting'
    claim: 'The psalm is read as one of the pilgrimage psalms'
    key: skinner-seeing-god
    url: 'https://rsc.byu.edu/ascending-mountain-lord/seeing-god-his-temple-significant-theme-israels-psalms'
    quote: 'Each of the pilgrimages culminated in the experience of the temple, a feeling captured by one of the pilgrimage psalms:'
  - where: 'setting'
    claim: 'Israel was commanded to appear before the LORD at the feasts'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The law commanded that three times a year all the males of the covenant people were to appear before the Lord in the place that He should choose'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: 'Verse 2 rendered “are standing,” not the King James future'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20122&version=NRSVUE'
    quote: 'Our feet are standing'
  - where: 'section 2 plain'
    claim: 'Verse 3 rendered “joined firmly together”; verse 4 “as Israel was commanded”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20122&version=NRSVUE'
    quote: 'as was decreed for Israel,'
  - where: 'section 3 plain'
    claim: 'Verse 6b rendered as a wish; verse 7 “prosperity” as safety'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20122&version=NRSVUE'
    quote: 'and security within your towers.'

  # ---- note 0 ----
  - where: 'note 122:0 “David’s name, and a house of the LORD before the temple”'
    claim: 'The sanctuary at Shiloh is called the house of the LORD in Hannah’s story'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/1?lang=eng'
    quote: 'brought him unto the house of the Lord in Shiloh'
  - where: 'note 122:0 “David’s name, and a house of the LORD before the temple”'
    claim: 'In David’s lifetime the narrative says he came into the house of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'Then David arose from the earth, and washed, and anointed himself, and changed his apparel, and came into the house of the Lord, and worshipped'
  - where: 'note 122:0 “David’s name, and a house of the LORD before the temple”'
    claim: 'David himself said the ark was in a tent'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'See now, I dwell in an house of cedar, but the ark of God dwelleth within curtains.'
  - where: 'note 122:0 “David’s name, and a house of the LORD before the temple”'
    claim: 'The house for the LORD’s name was left for David’s son to build'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'He shall build an house for my name'
  - where: 'note 122:0 “David’s name, and a house of the LORD before the temple”'
    claim: 'One older reading dates the poet after the exile, from verse 3'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/122.htm'
    quote: 'The poet of the Psalm before us, however, lived much later. He lived, as is to be inferred with Hupfeld from Psalm 122:3, in the time of the post-exilic Jerusalem which rose again out of its ruins.'
  - where: 'note 122:0 “David’s name, and a house of the LORD before the temple”'
    claim: 'That reading takes “builded” as built up again, while granting the word itself means only to build'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/122.htm'
    quote: 'Jerusalem, O thou who art built up again - true,'

  # ---- note 1 ----
  - where: 'note 122:1 “An invitation, and then the gates”'
    claim: 'The pilgrimages culminated in the experience of the temple, a feeling this psalm captures'
    key: skinner-seeing-god
    url: 'https://rsc.byu.edu/ascending-mountain-lord/seeing-god-his-temple-significant-theme-israels-psalms'
    quote: 'Each of the pilgrimages culminated in the experience of the temple, a feeling captured by one of the pilgrimage psalms:'
  - where: 'note 122:1 “An invitation, and then the gates”'
    claim: 'The feasts were accompanied by joy centered on the temple'
    key: skinner-seeing-god
    url: 'https://rsc.byu.edu/ascending-mountain-lord/seeing-god-his-temple-significant-theme-israels-psalms'
    quote: 'Always the activities of the three pilgrimage festivals were accompanied by the singing of psalms and a feeling of joy centered on the temple.'
  - where: 'note 122:1 “An invitation, and then the gates”'
    claim: 'The Hebrew of verse 2 is a participle with a perfect, “standing have been our feet,” not a future'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/122-2.htm'
    quote: 'Standing V‑Qal‑Prtcpl‑fp'
  - where: 'note 122:1 “An invitation, and then the gates”'
    claim: 'The verb with the participle is a perfect, glossed “have been”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/122-2.htm'
    quote: 'have been V‑Qal‑Perf‑3cp'
  - where: 'note 122:1 “An invitation, and then the gates”'
    claim: 'A modern translation has “Our feet are standing”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20122&version=NRSVUE'
    quote: 'Our feet are standing'
  - where: 'note 122:1 “An invitation, and then the gates”'
    claim: 'The Greek has “Our feet stood”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/122.htm'
    quote: 'Our feet stood in thy courts, O Jerusalem.'

  # ---- note 3 ----
  - where: 'note 122:3 “A city joined to itself”'
    claim: 'The Hebrew is literally “joined to itself together”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/122-3.htm'
    quote: 'that is joined to itself together.'
  - where: 'note 122:3 “A city joined to itself”'
    claim: 'A modern translation has “bound firmly together”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20122&version=NRSVUE'
    quote: 'that is bound firmly together.'
  - where: 'note 122:3 “A city joined to itself”'
    claim: 'The Greek takes the line of people: a city whose fellowship is complete'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/122.htm'
    quote: 'Jerusalem is built as a city whose fellowship is complete.'

  # ---- note 4 ----
  - where: 'note 122:4 “Going up was commanded”'
    claim: 'A modern translation renders the phrase “as was decreed for Israel”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20122&version=NRSVUE'
    quote: 'as was decreed for Israel,'
  - where: 'note 122:4 “Going up was commanded”'
    claim: 'The same translation’s cross-references at verse 4 include Deut. 16:16'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20122&version=NRSVUE'
    quote: '122.4 : Ex 16.34; Deut 16.16'
  - where: 'note 122:4 “Going up was commanded”'
    claim: 'The law commanded three appearances a year at the place the LORD would choose, at three named feasts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/16?lang=eng'
    quote: 'in the feast of unleavened bread, and in the feast of weeks, and in the feast of tabernacles'
  - where: 'note 122:4 “Going up was commanded”'
    claim: 'The command is the law of the three feasts (Ex. 23:14–17; Deut. 16:16)'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'The law commanded that three times a year all the males of the covenant people were to appear before the Lord in the place that He should choose'
  - where: 'note 122:4 “Going up was commanded”'
    claim: 'The ordinance presupposed a peace seldom had, and was not generally observed in Old Testament times'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'This ordinance presupposed a state of settled peace rarely if ever realized in the history of the people in Old Testament times. It was not and could not be generally or even frequently observed.'
  - where: 'note 122:4 “Going up was commanded”'
    claim: 'Jeroboam feared that going up to sacrifice at Jerusalem would turn the people back to their lord, Rehoboam, and made two calves'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'Whereupon the king took counsel, and made two calves of gold, and said unto them, It is too much for you to go up to Jerusalem'

  # ---- note 5 ----
  - where: 'note 122:5 “Why thrones are a reason to go up”'
    claim: 'A modern translation’s cross-references at verse 5 are Deut. 17:8 and 2 Chr. 19:8, the laws and the court of judgment at the chosen place'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20122&version=NRSVUE'
    quote: '122.5 : Deut 17.8; 2 Chr 19.8'
  - where: 'note 122:5 “Why thrones are a reason to go up”'
    claim: 'People with a controversy came to the king for judgment in David’s day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/15?lang=eng'
    quote: 'when any man that had a controversy came to the king for judgment'
  - where: 'note 122:5 “Why thrones are a reason to go up”'
    claim: 'Solomon built a porch of judgment for his throne among the buildings of his own house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/7?lang=eng'
    quote: 'Then he made a porch for the throne where he might judge, even the porch of judgment'
  - where: 'note 122:5 “Why thrones are a reason to go up”'
    claim: 'The law sent hard cases up to the place the LORD would choose'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/17?lang=eng'
    quote: 'then shalt thou arise, and get thee up into the place which the Lord thy God shall choose'
  - where: 'note 122:5 “Why thrones are a reason to go up”'
    claim: 'Jehoshaphat set Levites, priests and chiefs of the fathers in Jerusalem for judgment'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/19?lang=eng'
    quote: 'Moreover in Jerusalem did Jehoshaphat set of the Levites, and of the priests, and of the chief of the fathers of Israel, for the judgment of the Lord, and for controversies'

  # ---- note 6 ----
  - where: 'note 122:6 “Peace, asked for a city”'
    claim: 'The Hebrew words for peace, prosper and prosperity alliterate with each other and with the name Jerusalem'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/122.htm'
    quote: 'is again taken up, and both accord with the name of Jerusalem.'
  - where: 'note 122:6 “Peace, asked for a city”'
    claim: 'Verse 6 in Hebrew: shalom, Yerushalayim, yishlayu'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/122-6.htm'
    quote: 'yiš·lā·yū,'
  - where: 'note 122:6 “Peace, asked for a city”'
    claim: 'Verse 7’s “prosperity” is shalvah'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/122-7.htm'
    quote: 'šal·wāh'
  - where: 'note 122:6 “Peace, asked for a city”'
    claim: 'A modern translation renders 6b as a wish'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20122&version=NRSVUE'
    quote: 'May they prosper who love you.'
  - where: 'note 122:6 “Peace, asked for a city”'
    claim: 'The same translation has “security” for “prosperity” in verse 7'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20122&version=NRSVUE'
    quote: 'and security within your towers.'
  - where: 'note 122:6 “Peace, asked for a city”'
    claim: 'The two motives are love of the brethren and of the house of God'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/122.htm'
    quote: 'The twofold motive of such an earnest wish for peace is love for the brethren and love for the house of God.'
  - where: 'note 122:6 “Peace, asked for a city”'
    claim: 'One older commentary sets Jer. 29:7 (“seek the peace”) beside the psalm’s resolve to seek the city’s good'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/122.htm'
    quote: 'Deuteronomy 23:6, Jeremiah 29:7). For although he is now again far from Jerusalem after the visit that is over, he still remains united in love to the holy city'
  - where: 'note 122:6 “Peace, asked for a city”'
    claim: 'Jeremiah tells the exiles to seek the peace of Babylon and pray for it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/29?lang=eng'
    quote: 'And seek the peace of the city whither I have caused you to be carried away captives, and pray unto the Lord for it'
  # ---- christ ----
  - where: 'christ'
    claim: 'The LORD of the Old Testament is Jehovah, the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: 'christ'
    claim: 'Jesus went up to Jerusalem for the Passover during His ministry'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/2?lang=eng'
    quote: 'And the Jews’ passover was at hand, and Jesus went up to Jerusalem,'
  # ---- explore ----
  - where: 'explore'
    claim: 'Psalms 125 and 128 close with peace upon Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/128?lang=eng'
    quote: 'Yea, thou shalt see thy children’s children, and peace upon Israel.'
  - where: 'explore'
    claim: 'Psalm 125 closes with peace upon Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/125?lang=eng'
    quote: 'but peace shall be upon Israel.'
  - where: 'explore'
    claim: 'Isaiah has many people say, let us go up to the mountain of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/2?lang=eng'
    quote: 'Come ye, and let us go up to the mountain of the Lord, to the house of the God of Jacob'

  # ---- parallels ----
  - where: 'parallels'
    claim: 'The Savior promises the Twelve thrones of judgment over the tribes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/19?lang=eng'
    quote: 'ye also shall sit upon twelve thrones, judging the twelve tribes of Israel.'
