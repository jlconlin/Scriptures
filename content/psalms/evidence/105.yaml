chapter: 105
claims:
  - where: 'when'
    claim: 'The Church’s edition prints no title above Psalm 105; the page opens with the chapter heading and verse 1.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/105?lang=eng'
    quote: 'O give thanks unto the Lord; call upon his name: make known his deeds among the people.'
  - where: 'when'
    claim: 'In Chronicles the song that opens with these verses is given by David to Asaph on the day the ark is set in its tent.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'Then on that day David delivered first this psalm to thank the Lord into the hand of Asaph and his brethren.'
  - where: 'when'
    claim: 'The ark was brought up to Jerusalem.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/15?lang=eng'
    quote: 'And David gathered all Israel together to Jerusalem, to bring up the ark of the Lord unto his place, which he had prepared for it.'

  - where: 'setting'
    claim: 'The psalm draws its history from the books of Moses and puts it into verse.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/105.htm'
    quote: 'and clothes it in a poetic garb'
  - where: 'setting'
    claim: 'Psalm 105 is close in subject to Psalm 78, but it retells the history as a hymn and not as a lesson, and it stops with Moses and Joshua.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/105.htm'
    quote: 'The recapitulation here, however, is made not with any didactic purpose, but with the purpose of forming a hymn, and does not come down beyond the time of Moses and Joshua.'
  - where: 'setting'
    claim: 'The song in 1 Chronicles 16 has Psalm 105:1–15 as its first part (verses 8–22), then Psalm 96, then lines of Psalm 106.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/105.htm'
    quote: 'is, so far as its first part is concerned (1 Chronicles 16:8-22), taken from our Psalm'
  - where: 'setting'
    claim: 'David gave the song to Asaph and his brethren on the day the ark came to Jerusalem.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'Then on that day David delivered first this psalm to thank the Lord into the hand of Asaph and his brethren.'
  - where: 'setting'
    claim: 'Psalm 106, which follows, tells the same history as a confession of Israel’s sins.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/106?lang=eng'
    quote: 'We have sinned with our fathers, we have committed iniquity, we have done wickedly.'

  - where: 'setting'
    claim: 'Psalm 78 tells the history so that the coming generation will know it.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/78?lang=eng'
    quote: 'That the generation to come might know them, even the children which should be born; who should arise and declare them to their children:'

  - where: 'section 1 plain'
    claim: 'The “people” of verse 1 are the peoples, the nations.'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20105&version=NRSVUE'
    quote: 'make known his deeds among the peoples'
  - where: 'section 3 plain'
    claim: '“Suffered no man to do them wrong” means that He allowed no one to oppress them.'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20105&version=NRSVUE'
    quote: 'he allowed no one to oppress them'
  - where: 'section 4 plain'
    claim: 'The “senators” of verse 22 are elders.'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20105&version=NRSVUE'
    quote: 'and to teach his elders wisdom'
  - where: 'section 6 plain'
    claim: '“Divers sorts of flies” are swarms of flies, and “coasts” is the country.'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20105&version=NRSVUE'
    quote: 'He spoke, and there came swarms of flies'
  - where: 'section 6 plain'
    claim: '“In all their coasts” means throughout their country.'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20105&version=NRSVUE'
    quote: 'and gnats throughout their country'

  - where: 'note 105:1 “The same fifteen verses in David’s song before the ark”'
    claim: 'Chronicles gives the song as delivered by David to Asaph the day the ark was brought in.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'Then on that day David delivered first this psalm to thank the Lord into the hand of Asaph and his brethren.'
  - where: 'note 105:1 “The same fifteen verses in David’s song before the ark”'
    claim: 'Where the psalm says God has remembered His covenant, Chronicles commands the congregation to be mindful of it.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'Be ye mindful always of his covenant; the word which he commanded to a thousand generations;'
  - where: 'note 105:1 “The same fifteen verses in David’s song before the ark”'
    claim: 'Where the psalm says “they,” Chronicles says “ye.”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'When ye were but few, even a few, and strangers in it.'
  - where: 'note 105:1 “The same fifteen verses in David’s song before the ark”'
    claim: 'Where the psalm has “seed of Abraham,” Chronicles has “seed of Israel.”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'O ye seed of Israel his servant, ye children of Jacob, his chosen ones.'
  - where: 'note 105:1 “The same fifteen verses in David’s song before the ark”'
    claim: 'The Chronicles song leaves Psalm 105 after “do my prophets no harm” and goes on with Psalm 96.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'Sing unto the Lord, all the earth; shew forth from day to day his salvation.'
  - where: 'note 105:1 “The same fifteen verses in David’s song before the ark”'
    claim: '“The people” in verse 1 is plural: the peoples.'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20105&version=NRSVUE'
    quote: 'make known his deeds among the peoples'

  - where: 'note 105:5 “A recital of what God did”'
    claim: 'A Latter-day Saint study calls this kind of recital a historical credo and defines it.'
    key: ricks-psalm-105
    url: 'https://interpreterfoundation.org/journal/psalm-105-chiasmus-credo-covenant-and-temple'
    quote: 'The historical credo6 is a literary recollection of the experience of the patriarchs in the land of Canaan, of the experience of the children of Israel in bondage in Egypt, of their deliverance from bondage, and of their journey to the land of Canaan.'
  - where: 'note 105:5 “A recital of what God did”'
    claim: 'The study gives Deuteronomy 26:5–9 as the outstanding instance and finds the credo in Psalm 105.'
    key: ricks-psalm-105
    url: 'https://interpreterfoundation.org/journal/psalm-105-chiasmus-credo-covenant-and-temple'
    quote: 'Psalm 105 recounts Abraham, Isaac, and Jacob’s experience of wandering and the promise to Jacob of the land of Canaan'
  - where: 'note 105:5 “A recital of what God did”'
    claim: 'The study reads Nephi’s speech in 1 Nephi 17 as a form of the same recital.'
    key: ricks-psalm-105
    url: 'https://interpreterfoundation.org/journal/psalm-105-chiasmus-credo-covenant-and-temple'
    quote: 'Strikingly, Nephi recites a form of the historical credo to his brothers Laman and Lemuel while building a ship in Bountiful'
  - where: 'note 105:5 “A recital of what God did”'
    claim: 'The worshipper bringing firstfruits recites the history, beginning with the father who went down to Egypt with a few.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/26?lang=eng'
    quote: 'And thou shalt speak and say before the Lord thy God, A Syrian ready to perish was my father, and he went down into Egypt, and sojourned there with a few, and became there a nation, great, mighty, and populous:'
  - where: 'note 105:5 “A recital of what God did”'
    claim: 'The recital in Deuteronomy ends with the gift of the land.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/26?lang=eng'
    quote: 'And he hath brought us into this place, and hath given us this land, even a land that floweth with milk and honey.'
  - where: 'note 105:5 “A recital of what God did”'
    claim: 'Nephi gives the remembered covenant as the reason for the Exodus.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/17?lang=eng'
    quote: 'he covenanted with them, yea, even Abraham, Isaac, and Jacob; and he remembered the covenants which he had made; wherefore, he did bring them out of the land of Egypt.'

  - where: 'note 105:10 “What the covenant holds, and what the psalm names”'
    claim: 'The land of Canaan was promised to Abraham as an everlasting possession within an everlasting covenant.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/17?lang=eng'
    quote: 'And I will give unto thee, and to thy seed after thee, the land wherein thou art a stranger, all the land of Canaan, for an everlasting possession; and I will be their God.'
  - where: 'note 105:10 “What the covenant holds, and what the psalm names”'
    claim: 'The oath to Abraham was repeated to Isaac.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/26?lang=eng'
    quote: 'I will give all these countries, and I will perform the oath which I sware unto Abraham thy father;'
  - where: 'note 105:10 “What the covenant holds, and what the psalm names”'
    claim: 'The land was promised again to Jacob at Bethel.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/28?lang=eng'
    quote: 'the land whereon thou liest, to thee will I give it, and to thy seed;'
  - where: 'note 105:10 “What the covenant holds, and what the psalm names”'
    claim: 'The covenant’s promises include Christ’s coming through Abraham’s lineage as well as the lands.'
    key: bd-abraham-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abraham-covenant-of?lang=eng'
    quote: 'Included in the divine promises to Abraham were the assurances that (1) Christ would come through his lineage, and that (2) Abraham’s posterity would receive certain lands as an eternal inheritance'
  - where: 'note 105:10 “What the covenant holds, and what the psalm names”'
    claim: 'The covenant was renewed with Isaac and with Jacob.'
    key: bd-abraham-covenant
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abraham-covenant-of?lang=eng'
    quote: 'It was renewed with Isaac (Gen. 26:1–4, 24) and again with Jacob (Gen. 28; 35:9–13; 48:3–4).'
  - where: 'note 105:10 “What the covenant holds, and what the psalm names”'
    claim: 'When the covenant was made, the Lord foretold the sojourn and bondage in a foreign land.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/15?lang=eng'
    quote: 'Know of a surety that thy seed shall be a stranger in a land that is not theirs, and shall serve them; and they shall afflict them four hundred years;'
  - where: 'note 105:10 “What the covenant holds, and what the psalm names”'
    claim: 'He also foretold the judgment on that nation and the departure with great substance.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/15?lang=eng'
    quote: 'And also that nation, whom they shall serve, will I judge: and afterward shall they come out with great substance.'

  - where: 'note 105:15 “The anointed and the prophets are the patriarchs”'
    claim: 'The Lord plagued Pharaoh on account of Sarai.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/12?lang=eng'
    quote: 'And the Lord plagued Pharaoh and his house with great plagues because of Sarai Abram’s wife.'
  - where: 'note 105:15 “The anointed and the prophets are the patriarchs”'
    claim: 'God told Abimelech that Abraham is a prophet.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/20?lang=eng'
    quote: 'Now therefore restore the man his wife; for he is a prophet, and he shall pray for thee, and thou shalt live'
  - where: 'note 105:15 “The anointed and the prophets are the patriarchs”'
    claim: 'Abimelech forbade his people to touch Isaac or Rebekah.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/26?lang=eng'
    quote: 'And Abimelech charged all his people, saying, He that toucheth this man or his wife shall surely be put to death.'
  - where: 'note 105:15 “The anointed and the prophets are the patriarchs”'
    claim: 'The lexicon gives this verse and its parallel in Chronicles as the one place where the word “anointed” is used of the patriarchs.'
    key: bdb
    url: 'https://biblehub.com/hebrew/4899.htm'
    quote: '5 patriarchs, regarded as anointed kings Psalm 105:15 = 1 Chronicles 16:22.'
  - where: 'note 105:15 “The anointed and the prophets are the patriarchs”'
    claim: 'The word is plural: anointed ones.'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20105&version=NRSVUE'
    quote: 'Do not touch my anointed ones'
  - where: 'note 105:17 “Sold by his brothers, sent by God”'
    claim: 'Joseph told his brothers that God had sent him ahead of them.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/45?lang=eng'
    quote: 'that ye sold me hither: for God did send me before you to preserve life.'
  - where: 'note 105:17 “Sold by his brothers, sent by God”'
    claim: 'Joseph said that God meant the brothers’ evil for good.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/50?lang=eng'
    quote: 'But as for you, ye thought evil against me; but God meant it unto good, to bring to pass, as it is this day, to save much people alive.'
  - where: 'note 105:17 “Sold by his brothers, sent by God”'
    claim: 'Verses 16–17 can be read with the sending earlier than the famine.'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20105&version=NRSVUE'
    quote: 'he had sent a man ahead of them'
  - where: 'note 105:17 “Sold by his brothers, sent by God”'
    claim: 'Genesis says Joseph was put in the prison where the king’s prisoners were bound; it names no fetters.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/39?lang=eng'
    quote: 'put him into the prison, a place where the king’s prisoners were bound: and he was there in the prison.'
  - where: 'note 105:17 “Sold by his brothers, sent by God”'
    claim: 'Joseph calls the place a dungeon.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/40?lang=eng'
    quote: 'here also have I done nothing that they should put me into the dungeon.'

  - where: 'note 105:19 “Whose word came, and what tried Joseph”'
    claim: 'A modern translation renders “his word” as “what he had said.”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20105&version=NRSVUE'
    quote: 'until what he had said came to pass,'
  - where: 'note 105:19 “Whose word came, and what tried Joseph”'
    claim: 'In prison Joseph offered to interpret the dreams of Pharaoh’s butler and baker.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/40?lang=eng'
    quote: 'And Joseph said unto them, Do not interpretations belong to God? tell me them, I pray you.'
  - where: 'note 105:19 “Whose word came, and what tried Joseph”'
    claim: 'The butler told Pharaoh that what Joseph had said came to pass.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/41?lang=eng'
    quote: 'And it came to pass, as he interpreted to us, so it was; me he restored unto mine office, and him he hanged.'
  - where: 'note 105:19 “Whose word came, and what tried Joseph”'
    claim: 'The second line of the verse in that translation.'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20105&version=NRSVUE'
    quote: 'the word of the Lord kept testing him.'
  - where: 'note 105:19 “Whose word came, and what tried Joseph”'
    claim: 'One older reading takes “his word” as Joseph’s telling of his dreams.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/105.htm'
    quote: 'open-hearted word concerning his visions'
  - where: 'note 105:19 “Whose word came, and what tried Joseph”'
    claim: 'The same reading takes the word of the LORD as the revelation of His promises, which tried and purified Joseph.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/105.htm'
    quote: 'is the revelation of God conveying His promises, which came to him in the same form, which had to try, to prove, and to purify him'
  - where: 'note 105:19 “Whose word came, and what tried Joseph”'
    claim: 'The reading allows that “his word” could be the LORD’s, and gives its reason for preferring Joseph’s.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/105.htm'
    quote: 'appears to be the word of Jahve, but then one would expect from Psalm 105:19 a more parallel turn of expression'
  - where: 'note 105:19 “Whose word came, and what tried Joseph”'
    claim: 'The testing was to prove a faithfulness that held in abasement.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/105.htm'
    quote: 'proved a faithfulness that wavered not, and a confidence that knew no despair'
  - where: 'note 105:19 “Whose word came, and what tried Joseph”'
    claim: 'When his brothers bowed before him, Joseph remembered his dreams.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'And Joseph remembered the dreams which he dreamed of them'

  - where: 'note 105:19 “Whose word came, and what tried Joseph”'
    claim: 'The reading takes Joseph’s word as the word of his exaltation, shown him in dreams.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/105.htm'
    quote: 'the word concerning this exaltation which had been revealed to him in dreams (Genesis 42:9)'
  - where: 'note 105:19 “Whose word came, and what tried Joseph”'
    claim: 'In Genesis 42 the brothers bow before Joseph (the chapter heading in the Church’s edition).'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/42?lang=eng'
    quote: 'They bow before Joseph'

  - where: 'note 105:23 “Why Egypt is the land of Ham”'
    claim: 'Genesis lists Mizraim among the sons of Ham.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/10?lang=eng'
    quote: 'And the sons of Ham; Cush, and Mizraim, and Phut, and Canaan.'
  - where: 'note 105:23 “Why Egypt is the land of Ham”'
    claim: 'Mizraim is the Hebrew name for Egypt.'
    key: bd-mizraim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/mizraim?lang=eng'
    quote: 'The Hebrew name for Egypt. Mizraim was the son of Ham, son of Noah (Gen. 10:6).'
  - where: 'note 105:23 “Why Egypt is the land of Ham”'
    claim: 'The Egyptians descend from Ham through Mizraim, and three psalms name Egypt for Ham.'
    key: bd-ham
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ham?lang=eng'
    quote: 'from Mizraim the Egyptians'
  - where: 'note 105:23 “Why Egypt is the land of Ham”'
    claim: 'The Bible Dictionary lists the psalm verses that tie Ham to Egypt.'
    key: bd-ham
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ham?lang=eng'
    quote: 'a portion of Ham’s descendants settled in Egypt (Ps. 78:51; 105:23; 106:22)'

  - where: 'note 105:25 “Did God make the Egyptians hate Israel?”'
    claim: 'In Exodus Pharaoh gives Israel’s numbers and strength as the reason for his policy.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/1?lang=eng'
    quote: 'Behold, the people of the children of Israel are more and mightier than we:'
  - where: 'note 105:25 “Did God make the Egyptians hate Israel?”'
    claim: 'Pharaoh proposes to deal “wisely,” the psalm’s “subtilly.”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/1?lang=eng'
    quote: 'Come on, let us deal wisely with them; lest they multiply'
  - where: 'note 105:25 “Did God make the Egyptians hate Israel?”'
    claim: 'One older reading: the hatred was God’s work indirectly, through His blessing of Israel, which stirred jealousy.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/105.htm'
    quote: "It was indirectly God's work, inasmuch as He gave increasing might to His people, which excited their jealousy."
  - where: 'note 105:28 “Eight plagues, with the darkness first”'
    claim: 'The plagues are not in the order of Exodus, here or in Psalm 78.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/105.htm'
    quote: 'Here, too, as in Psalm 78, the miraculous judgments of the ten plagues to not stand in exactly historical order.'
  - where: 'note 105:28 “Eight plagues, with the darkness first”'
    claim: 'The psalm begins with the ninth plague, the darkness, and one older reading says why.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/105.htm'
    quote: 'The poet begins with the ninth, which was the most distinct self-representation of divine wrath, viz., the darkness'
  - where: 'note 105:28 “Eight plagues, with the darkness first”'
    claim: 'From the darkness the psalm passes to the first plague, the blood, and then the second, the frogs.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/105.htm'
    quote: 'passes over to the first (Exodus 7:14-25), viz., the red blood is appended to the black darkness. The second plague follows, viz., the frogs'
  - where: 'note 105:28 “Eight plagues, with the darkness first”'
    claim: 'Verse 31 has the fourth plague (flies) and then the third (gnats, the King James “lice”).'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/105.htm'
    quote: 'he next briefly touches upon the fourth plague, viz., the gad-fly'
  - where: 'note 105:28 “Eight plagues, with the darkness first”'
    claim: 'From the third plague the psalm goes to the seventh, the hail, and then the eighth, the locusts.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/105.htm'
    quote: 'takes a leap over to the seventh, viz., the hail'
  - where: 'note 105:28 “Eight plagues, with the darkness first”'
    claim: 'The eighth plague, the locusts, follows the seventh.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/105.htm'
    quote: 'The seventh plague is followed by the eighth'
  - where: 'note 105:28 “Eight plagues, with the darkness first”'
    claim: 'The fifth and sixth plagues are left out, and the tenth closes the list.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/105.htm'
    quote: 'are left unmentioned; and the tenth plague closes, viz., the smiting of the first-born'
  - where: 'note 105:28 “Eight plagues, with the darkness first”'
    claim: 'The fifth plague, left out, is the murrain; the sixth is the boils.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/105.htm'
    quote: 'The fifth plague, viz., the pestilence, murrain (Exodus 9:1-7), and the sixth, viz.,'
  - where: 'note 105:28 “Eight plagues, with the darkness first”'
    claim: 'The third plague, the gnats (the King James “lice”), is named after the fourth.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/105.htm'
    quote: 'viz., the gnats, which are passed over in Psalm 78'
  - where: 'note 105:28 “Eight plagues, with the darkness first”'
    claim: 'The psalm passes from the tenth plague to the departure without the Passover.'
