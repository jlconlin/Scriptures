    key: hymn-lord-my-shepherd
    url: 'https://www.churchofjesuschrist.org/study/manual/hymns/the-lord-is-my-shepherd?lang=eng'
    quote: 'The Lord is my Shepherd; no want shall I know.'
  - where: 'explore'
    claim: 'Hymn no. 108 carries the psalm as far as the valley of verse 4'
    key: hymn-lord-my-shepherd
    url: 'https://www.churchofjesuschrist.org/study/manual/hymns/the-lord-is-my-shepherd?lang=eng'
