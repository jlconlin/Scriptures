chapter: 28
claims:
  # ---- when, setting ----
  - where: 'when'
    claim: 'The title ascribes the psalm to David and gives no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/28?lang=eng'
    quote: 'A Psalm of David.'
  - where: 'setting'
    claim: 'The psalm is a petition to be heard and an acknowledgement that the prayer was answered'
    key: alford-baker-psalm-nephi
    url: 'https://rsc.byu.edu/ascending-mountain-lord/parallels-between-psalms-25-31-psalm-nephi'
    quote: 'Psalm 28 is a petition to the Lord to hear his prayers and an acknowledgement that God has answered those prayers.'
  - where: 'setting'
    claim: 'Psalms 25–28 have been classed as laments of one person'
    key: alford-baker-psalm-nephi
    url: 'https://rsc.byu.edu/ascending-mountain-lord/parallels-between-psalms-25-31-psalm-nephi'
    quote: 'He identified Psalms 25–28 and 31 as individual laments, Psalm 29 as a hymn, and Psalm 30 as a thanksgiving psalm.'
  - where: 'setting'
    claim: 'One older reading places Psalms 26–28 in Absalom’s rebellion'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/28.htm'
    quote: 'To Psalm 26:1-12 and Psalm 27:1-14 a third Psalm is here added, belonging to the time of the persecution by Absolom.'
  - where: 'setting'
    claim: 'The same reading notes that Psalm 29 closes in a similar way and so stands next'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/28.htm'
    quote: 'is similar, but promissory, and consequently it is placed next to Psalm 28:1-9.'
  - where: 'setting'
    claim: 'It has been proposed that Psalms 25–31 influenced Nephi’s psalm'
    key: alford-baker-psalm-nephi
    url: 'https://rsc.byu.edu/ascending-mountain-lord/parallels-between-psalms-25-31-psalm-nephi'
    quote: 'The purpose of this essay is to suggest that Psalms 25–31 may have had a particular influence upon Nephi as he wrote his psalm.'

  - where: 'setting'
    claim: 'Psalms 25–31 are all attributed to David'
    key: alford-baker-psalm-nephi
    url: 'https://rsc.byu.edu/ascending-mountain-lord/parallels-between-psalms-25-31-psalm-nephi'
    quote: 'All seven of Psalms 25–31 are attributed to King David'

  # ---- thread ----
  - where: 'thread'
    claim: 'Verse 6 has the Hebrew words of verse 2, “the voice of my supplications,” with the verb “hear” now in the perfect'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שָׁ֝מַע'
  - where: 'thread'
    claim: 'The verb “lift up” of verse 2 (nasa) is the verb “lift them up” of verse 9'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וְ֝/נַשְּׂאֵ֗/ם'
  - where: 'thread'
    claim: 'Verses 4 and 5 use one Hebrew phrase, “the work of hands,” of the wicked and of the LORD'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'כְּ/מַעֲשֵׂ֣ה'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: 'Verse 2: the “oracle” is the inner sanctuary'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2028&version=NRSVUE'
    quote: 'toward your most holy sanctuary.'
  - where: 'section 2 plain'
    claim: 'Verse 3: “draw me not away” is “do not drag me away”; verse 4: “their desert” is their due'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2028&version=NRSVUE'
    quote: 'Do not drag me away with the wicked'
  - where: 'section 2 plain'
    claim: 'Verse 4: “render to them their desert” is their due reward'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2028&version=NRSVUE'
    quote: 'render them their due reward.'
  - where: 'section 4 plain'
    claim: 'Verse 8: “saving strength” is a saving refuge; verse 9: “feed” and “lift up” are shepherd and carry'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2028&version=NRSVUE'
    quote: 'he is the saving refuge of his anointed.'
  - where: 'section 4 plain'
    claim: 'Verse 9: shepherd and carry'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2028&version=NRSVUE'
    quote: 'be their shepherd and carry them forever.'

  # ---- note 28:1 ----
  - where: 'note 28:1 “A silence that would be death”'
    claim: 'Verse 1 uses two different Hebrew verbs for being silent (charash, H2790, then chashah, H2814)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תֶּֽחֱשֶׁ֥ה'
  - where: 'note 28:1 “A silence that would be death”'
    claim: 'The first verb means to be silent, dumb, speechless'
    key: bdb
    url: 'https://biblehub.com/hebrew/2790.htm'
    quote: 'be silent, dumb, speechless'
  - where: 'note 28:1 “A silence that would be death”'
    claim: 'The lexicon files Psalm 28:1 under the sense “be deaf,” with the LORD as subject'
    key: bdb
    url: 'https://biblehub.com/hebrew/2790.htm'
    quote: '2 be deaf, subject ׳י, followed by מִמֶּנִּי Psalm 28:1'
  - where: 'note 28:1 “A silence that would be death”'
    claim: 'The “pit” (bor) in poetry is the pit of the grave, and “those going down to the pit” is a set phrase that includes this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/953.htm'
    quote: 'pit of the grave'
  - where: 'note 28:1 “A silence that would be death”'
    claim: 'The phrase “those going down to the pit” is listed for Psalm 28:1 and stands in parallel with Sheol elsewhere'
    key: bdb
    url: 'https://biblehub.com/hebrew/953.htm'
    quote: 'those going down to (the) pit Psalm 28:1; Psalm 143:7; Isaiah 38:18'
  - where: 'note 28:1 “A silence that would be death”'
    claim: 'A modern translation renders the first plea “do not refuse to hear me”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2028&version=NRSVUE'
    quote: 'my rock, do not refuse to hear me,'

  # ---- note 28:2 oracle ----
  - where: 'note 28:2 “The oracle is a room, not a message”'
    claim: 'The Hebrew word is debir, the hindmost, innermost room of the temple, the holy of holies'
    key: bdb
    url: 'https://biblehub.com/hebrew/1687.htm'
    quote: 'hindmost chamber, innermost room of the temple of Solomon'
  - where: 'note 28:2 “The oracle is a room, not a message”'
    claim: 'It is the place of the ark, the throne-room of the LORD'
    key: bdb
    url: 'https://biblehub.com/hebrew/1687.htm'
    quote: 'the place of the ark and the cherubic images, the throne-room of Yahweh'
  - where: 'note 28:2 “The oracle is a room, not a message”'
    claim: 'The King James “oracle” follows the Latin oraculum, on a derivation from the verb “speak” that the lexicon calls incorrect'
    key: bdb
    url: 'https://biblehub.com/hebrew/1687.htm'
    quote: 'on the incorrect theory that it was derived from'
  - where: 'note 28:2 “The oracle is a room, not a message”'
    claim: 'Apart from this verse the lexicon lists the word only in Kings and Chronicles, of Solomon’s temple'
    key: bdb
    url: 'https://biblehub.com/hebrew/1687.htm'
    quote: '1 Kings 6:5,16,19,20,21,22,23,31; 1 Kings 7:49'
  - where: 'note 28:2 “The oracle is a room, not a message”'
    claim: 'The word occurs once in the Psalms (hebrew.mjs psalms --word 1687: 1 occurrence)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'דְּבִ֥יר'
  - where: 'note 28:2 “The oracle is a room, not a message”'
    claim: 'In Kings the oracle is the room prepared for the ark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/6?lang=eng'
    quote: 'And the oracle he prepared in the house within, to set there the ark of the covenant of the Lord.'
  - where: 'note 28:2 “The oracle is a room, not a message”'
    claim: 'In 1828 English “oracle” could mean the most holy place of the temple'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/oracle'
    quote: 'The sanctuary or most holy place in the temple, in which was deposited the ark of the covenant.'
  - where: 'note 28:2 “The oracle is a room, not a message”'
    claim: 'The same dictionary gives the plural “oracles” as God’s revelations'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/oracle'
    quote: 'oracles, in the plural, denotes the communications, revelations or messages delivered by God to prophets.'
  - where: 'note 28:2 “The oracle is a room, not a message”'
    claim: 'A modern translation has “your most holy sanctuary,” with the note “your innermost sanctuary”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2028&version=NRSVUE'
    quote: 'Heb your innermost sanctuary'
  - where: 'note 28:2 “The oracle is a room, not a message”'
    claim: 'A modern translation prints “your most holy sanctuary”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2028&version=NRSVUE'
    quote: 'toward your most holy sanctuary.'
  - where: 'note 28:2 “The oracle is a room, not a message”'
    claim: 'The Greek has “thy holy temple”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/28.htm'
    quote: 'when I lift up my hands toward thy holy temple.'

  - where: 'note 28:2 “The oracle is a room, not a message”'
    claim: 'The lexicon compares an Arabic word for the back, the part behind'
    key: bdb
    url: 'https://biblehub.com/hebrew/1687.htm'
    quote: 'compare Arabic back, part behind'

  # ---- note 28:2 hands ----
  - where: 'note 28:2 “Hands raised toward the place of the ark”'
    claim: 'Prayer with uplifted hands is recorded most often in connection with the first temple'
    key: sc-knowhy-638
    url: 'https://scripturecentral.org/knowhy/why-did-ancient-israelites-lift-their-hands-in-praise'
    quote: 'Accounts of praying with uplifted hands are recorded multiple times throughout the scriptures, most often in connection to the first temple in Jerusalem.'
  - where: 'note 28:2 “Hands raised toward the place of the ark”'
    claim: 'The gesture has been read as exposing hands and heart to show the petitioner pure'
    key: sc-knowhy-638
    url: 'https://scripturecentral.org/knowhy/why-did-ancient-israelites-lift-their-hands-in-praise'
    quote: 'by exposing the hands and heart, it could show the Lord that the petitioner was pure and able to stand in the presence of the Lord.'
  - where: 'note 28:2 “Hands raised toward the place of the ark”'
    claim: 'Other readings: surrender, humility, and requesting a specific blessing'
    key: sc-knowhy-638
    url: 'https://scripturecentral.org/knowhy/why-did-ancient-israelites-lift-their-hands-in-praise'
    quote: 'showing one’s surrender before God, expressing one’s humility and desire to serve God, and requesting a specific blessing, have also been offered.'
  - where: 'note 28:2 “Hands raised toward the place of the ark”'
    claim: 'The readings are not mutually exclusive'
    key: sc-knowhy-638
    url: 'https://scripturecentral.org/knowhy/why-did-ancient-israelites-lift-their-hands-in-praise'
    quote: 'interpretations are not mutually exclusive'
  - where: 'note 28:2 “Hands raised toward the place of the ark”'
    claim: 'Solomon’s dedicatory prayer speaks of anyone who spreads his hands toward the house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'and spread forth his hands toward this house:'

  # ---- note 28:3 ----
  - where: 'note 28:3 “Dragged off with the wicked”'
    claim: 'The verb is “draw, drag”; in this verse, with the LORD as subject, to lead or drag off to doom'
    key: bdb
    url: 'https://biblehub.com/hebrew/4900.htm'
    quote: 'lead or drag off (to doom, subject ׳י) Psalm 28:3 (compare Psalm 26:9)'
  - where: 'note 28:3 “Dragged off with the wicked”'
    claim: 'A modern translation has “Do not drag me away”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2028&version=NRSVUE'
    quote: 'Do not drag me away with the wicked'
  - where: 'note 28:3 “Dragged off with the wicked”'
    claim: 'The Greek adds “destroy me not”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/28.htm'
    quote: 'Draw not away my soul with sinners, and destroy me not with the workers of iniquity'

  # ---- note 28:4 ----
  - where: 'note 28:4 “Their hands’ work and His”'
    claim: 'Verse 4 has “the work of their hands” (ma‘aseh yedehem)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'כְּ/מַעֲשֵׂ֣ה'
  - where: 'note 28:4 “Their hands’ work and His”'
    claim: 'Verse 5 has the same noun and the same word for hands, “the work of his hands” (ma‘aseh yadav)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יָדָ֑י/ו'
  - where: 'note 28:4 “Their hands’ work and His”'
    claim: 'A modern translation keeps one English word: “the work of their hands” and “the work of his hands”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2028&version=NRSVUE'
    quote: 'or the work of his hands,'
  - where: 'note 28:4 “Their hands’ work and His”'
    claim: 'The Greek likewise has “works” in both verses'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/28.htm'
    quote: 'Because they have not attended to the works of the Lord, even to the works of his hands'


  # ---- note 28:5 ----
  - where: 'note 28:5 “Pulled down and not built”'
    claim: 'The verbs are haras (H2040) and banah (H1129)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יֶ֝הֶרְסֵ֗/ם'
  - where: 'note 28:5 “Pulled down and not built”'
    claim: 'Jeremiah 1:10 has the same two verbs side by side (“to throw down, to build”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'וְ/לַ/הֲר֑וֹס'
  - where: 'note 28:5 “Pulled down and not built”'
    claim: 'The contrast of building and pulling down has been called like Jeremiah’s style'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/28.htm'
    quote: 'to pull down (with a personal object, as in Exodus 15:7), is like Jeremiah''s style'
  - where: 'note 28:5 “Pulled down and not built”'
    claim: 'One older reading: the verse is the reverse of the promise of 2 Samuel 7, said of Absalom’s party'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/28.htm'
    quote: 'Hence they shall experience the very reverse of the divine promise given to David: Jahve will pull them down and not build them up'
  - where: 'note 28:5 “Pulled down and not built”'
    claim: 'A modern translation: “he will break them down and build them up no more”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2028&version=NRSVUE'
    quote: 'he will break them down and build them up no more.'

  # ---- note 28:6 ----
  - where: 'note 28:6 “The plea of verse 2, answered in its own words”'
    claim: 'Verse 2 has the imperative “hear” with “the voice of my supplications”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שְׁמַ֤ע'
  - where: 'note 28:6 “The plea of verse 2, answered in its own words”'
    claim: 'Verse 6 has the perfect “he has heard” with the same two nouns'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שָׁ֝מַע'
  - where: 'note 28:6 “The plea of verse 2, answered in its own words”'
    claim: 'One older reading: the second half gives thanks for what the first asked'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/28.htm'
    quote: 'The first half of the Psalm prayed for deliverance and for judgment; this second half gives thanks for both.'
  - where: 'note 28:6 “The plea of verse 2, answered in its own words”'
    claim: 'Either certainty came as he prayed, or the second part was added later'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/28.htm'
    quote: 'at this point the certainty of being answered dawns upon him. But it is even possible that he added this second part later on, as a memorial of the answer he experienced to his prayer'
  - where: 'note 28:6 “The plea of verse 2, answered in its own words”'
    claim: 'The same reading judges that it sounds like something that happened'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/28.htm'
    quote: 'It sounds, at all events, like the record of something that has actually taken place.'

  # ---- note 28:7 ----
  - where: 'note 28:7 “Lines set beside the psalm of Nephi”'
    claim: 'The proposal is offered as a possibility, not a certainty'
    key: alford-baker-psalm-nephi
    url: 'https://rsc.byu.edu/ascending-mountain-lord/parallels-between-psalms-25-31-psalm-nephi'
    quote: 'We cannot determine with certainty the specific influences that affected Nephi as he drafted his psalm'
  - where: 'note 28:7 “Lines set beside the psalm of Nephi”'
    claim: 'Psalms 25–31 may have had a particular influence on Nephi'
    key: alford-baker-psalm-nephi
    url: 'https://rsc.byu.edu/ascending-mountain-lord/parallels-between-psalms-25-31-psalm-nephi'
    quote: 'The purpose of this essay is to suggest that Psalms 25–31 may have had a particular influence upon Nephi as he wrote his psalm.'
  - where: 'note 28:7 “Lines set beside the psalm of Nephi”'
    claim: 'Psalm 28:7 is set beside Nephi’s “I have trusted in thee”'
    key: alford-baker-psalm-nephi
    url: 'https://rsc.byu.edu/ascending-mountain-lord/parallels-between-psalms-25-31-psalm-nephi'
    quote: 'Nephi says, “O Lord, I have trusted in thee and I will trust in thee forever” (2 Nephi 4:34)'
  - where: 'note 28:7 “Lines set beside the psalm of Nephi”'
    claim: 'Psalm 28:7 is set beside Nephi’s “Rejoice, O my heart”'
    key: alford-baker-psalm-nephi
    url: 'https://rsc.byu.edu/ascending-mountain-lord/parallels-between-psalms-25-31-psalm-nephi'
    quote: 'Nephi says, “Rejoice, O my heart” (2 Nephi 4:28).'
  - where: 'note 28:7 “Lines set beside the psalm of Nephi”'
    claim: 'Psalm 28:6 is set beside Nephi’s “hath heard my cry”'
    key: alford-baker-psalm-nephi
    url: 'https://rsc.byu.edu/ascending-mountain-lord/parallels-between-psalms-25-31-psalm-nephi'
    quote: 'Nephi declares that the Lord “hath heard my cry” (2 Nephi 4:23)'
  - where: 'note 28:7 “Lines set beside the psalm of Nephi”'
    claim: 'Nephi’s “my rock” is called phrasing almost taken directly from Psalms, with Psalm 28:1 listed'
    key: alford-baker-psalm-nephi
    url: 'https://rsc.byu.edu/ascending-mountain-lord/parallels-between-psalms-25-31-psalm-nephi'
    quote: 'phrasing that is almost taken directly from Psalms.'
  - where: 'note 28:7 “Lines set beside the psalm of Nephi”'
    claim: 'The phrase “my heart” is in four consecutive psalms only in Psalms 25–31, and nine times in Nephi’s psalm'
    key: alford-baker-psalm-nephi
    url: 'https://rsc.byu.edu/ascending-mountain-lord/parallels-between-psalms-25-31-psalm-nephi'
    quote: 'Psalms 25–31 is the only place in the Psalter where four consecutive psalms use it.'
  - where: 'note 28:7 “Lines set beside the psalm of Nephi”'
    claim: 'Another study lists Psalm 28:1 among the psalms behind “my rock” in 2 Nephi 4:35'
    key: hilton-psalms-bom
    url: 'https://rsc.byu.edu/ascending-mountain-lord/old-testament-psalms-book-mormon'
    quote: 'my rock [Psalms 18:2, 46; 28:1; 31:3; 42:9; 62:2, 6; 71:3; 78:35; 92:15] and mine everlasting God.'

  - where: 'note 28:7 “Lines set beside the psalm of Nephi”'
    claim: 'The proposal is that Nephi turned to the psalms on the brass plates'
    key: alford-baker-psalm-nephi
    url: 'https://rsc.byu.edu/ascending-mountain-lord/parallels-between-psalms-25-31-psalm-nephi'
    quote: 'it is not unreasonable to entertain the possibility that Nephi may have turned to the brass plates for consolation and inspiration'

  # ---- note 28:8 ----
  - where: 'note 28:8 “Whose strength”'
    claim: 'The Hebrew has “to them” (lamo), with no noun for it to refer to'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לָ֑/מוֹ'
  - where: 'note 28:8 “Whose strength”'
    claim: 'The Greek reads “the strength of his people”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/28.htm'
    quote: 'The Lord is the strength of his people, and the saving defender of his anointed.'
  - where: 'note 28:8 “Whose strength”'
    claim: 'The Greek reflects le‘ammo, “to his people,” as in Psalm 29:11; the Hebrew as it stands yields a similar sense, and “they” are Israel'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/28.htm'
    quote: 'reads לעמּו, as in Psalm 29:11'
  - where: 'note 28:8 “Whose strength”'
    claim: 'The Hebrew of Psalm 29:11 has “to his people”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לְ/עַמּ֣/וֹ'
  - where: 'note 28:8 “Whose strength”'
    claim: 'A modern translation reads as the Greek does'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2028&version=NRSVUE'
    quote: 'The Lord is the strength of his people;'
  - where: 'note 28:8 “Whose strength”'
    claim: 'One older reading: the king’s deliverance is his people’s, because he is their head'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/28.htm'
    quote: 'by virtue of which he is the head of Israel. For this very reason his deliverance is the deliverance of Israel'
  - where: 'note 28:8 “Whose strength”'
    claim: '“His anointed” is the word mashiach (H4899)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מְשִׁיח֣/וֹ'

  # ---- note 28:9 ----
  - where: 'note 28:9 “Shepherd them and carry them”'
    claim: '“Feed” is the verb for shepherding (ra‘ah, H7462)'
    key: oshb-wlc
