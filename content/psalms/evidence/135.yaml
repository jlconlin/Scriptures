chapter: 135
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The psalm has no title; it begins at once with the call to praise, and its singers stand in the courts of the house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/135?lang=eng'
    quote: 'Ye that stand in the house of the Lord, in the courts of the house of our God,'

  # ---- setting ----
  - where: 'setting'
    claim: 'The songs of degrees are the fifteen psalms 120–134, so Psalm 135 follows them directly'
    key: bd-degrees-songs-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/degrees-songs-of?lang=eng'
    quote: 'Fifteen Psalms (120–34), probably so called because they were sung by Jewish pilgrims on their way up to Jerusalem.'
  - where: 'setting'
    claim: 'Psalm 134 begins with a call to the servants who stand in the house of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/134?lang=eng'
    quote: 'Behold, bless ye the Lord, all ye servants of the Lord, which by night stand in the house of the Lord.'
  - where: 'setting'
    claim: 'Psalm 135 is listed among the psalms of praise, which begin with a call to gather and praise'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'These psalms often begin with a command or call to Israel to gather as a community (most importantly, at the temple) and praise the Lord: 8, 19, 29, 33, 47, 65, 66, 78, 93, 95–100, 103–6, 11, 113, 114, 117, 134, 135, 136, and 145–50.'
  - where: 'setting'
    claim: 'An older commentary describes the psalm as a mosaic'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/135.htm'
    quote: 'It is a Psalm in the mosaic style.'
  - where: 'setting'
    claim: 'Its pieces come from the Law, the Prophets and the Psalms'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/135.htm'
    quote: 'Psalm 135 takes its tesserulae out of the Law, Prophets, and Psalms.'
  - where: 'setting'
    claim: 'Psalm 136 tells of the firstborn of Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/136?lang=eng'
    quote: 'To him that smote Egypt in their firstborn: for his mercy endureth for ever:'
  - where: 'setting'
    claim: 'Psalm 136 names Sihon, with a refrain after the line'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/136?lang=eng'
    quote: 'Sihon king of the Amorites: for his mercy endureth for ever:'
  - where: 'setting'
    claim: 'Psalm 136 has the land given as a heritage'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/136?lang=eng'
    quote: 'And gave their land for an heritage: for his mercy endureth for ever:'

  # ---- thread ----
  - where: 'thread'
    claim: 'Psalm 134 ends with a blessing out of Zion on the worshipper'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/134?lang=eng'
    quote: 'The Lord that made heaven and earth bless thee out of Zion.'

  # ---- sections ----
  - where: 'section 2 plain'
    claim: '“Vapours” are clouds'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20135&version=NRSVUE'
    quote: 'He it is who makes the clouds rise at the end of the earth;'
  - where: 'section 2 plain'
    claim: '“Treasuries” rendered storehouses'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20135&version=NRSVUE'
    quote: 'storehouses'
  - where: 'section 4 plain'
    claim: '“Judge” and “repent himself” in verse 14 are vindication and compassion'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20135&version=NRSVUE'
    quote: 'and have compassion on his servants.'
  - where: 'section 4 plain'
    claim: '“Thy memorial” is how He is remembered or renowned'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20135&version=NRSVUE'
    quote: 'your renown, O Lord, throughout all ages.'

  # ---- note 135:1 ----
  - where: 'note 135:1 “The call of Psalm 134, widened”'
    claim: 'Psalm 134 opens with the call to the servants who stand in the house by night'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/134?lang=eng'
    quote: 'Behold, bless ye the Lord, all ye servants of the Lord, which by night stand in the house of the Lord.'
  - where: 'note 135:1 “The call of Psalm 134, widened”'
    claim: 'Psalm 134 ends with a blessing on the worshipper out of Zion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/134?lang=eng'
    quote: 'The Lord that made heaven and earth bless thee out of Zion.'
  - where: 'note 135:1 “The call of Psalm 134, widened”'
    claim: 'An older commentary reads Psalm 135 as an expansion of Psalm 134'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/135.htm'
    quote: 'a Psalm-song expanded out of this shorter hymn, that is in part drawn from Psalm 115'
  - where: 'note 135:1 “The call of Psalm 134, widened”'
    claim: 'The same commentary takes the servants of verse 1 to be all who fear the LORD, not the official servants only'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/135.htm'
    quote: 'those who fear Him as a body'
  - where: 'note 135:1 “The call of Psalm 134, widened”'
    claim: 'The same commentary: the blessing of 134:3 becomes praise in 135:21'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/135.htm'
    quote: 'the wishing of a blessing in Psalm 134:3 is turned into an ascription of praise'

  # ---- note 135:4 ----
  - where: 'note 135:4 “A treasure is what He chose and kept for Himself”'
    claim: 'The Hebrew noun (segullah) is valued property, used as the LORD’s always of Israel, first at Exodus 19:5; BDB lists Deut. 7:6 and Ps. 135:4 under it'
    key: bdb
    url: 'https://biblehub.com/hebrew/5459.htm'
    quote: 'valued property, peculiar treasure'
  - where: 'note 135:4 “A treasure is what He chose and kept for Himself”'
    claim: 'The same noun is in Deuteronomy 7:6 (“special people”) and Malachi 3:17 (“jewels”)'
    key: bdb
    url: 'https://biblehub.com/hebrew/5459.htm'
    quote: 'Deuteronomy 7:6; Deuteronomy 14:2; Deuteronomy 26:18'
  - where: 'note 135:4 “A treasure is what He chose and kept for Himself”'
    claim: 'The phrase is first spoken at Sinai, with a condition'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng'
    quote: 'Now therefore, if ye will obey my voice indeed, and keep my covenant, then ye shall be a peculiar treasure unto me above all people: for all the earth is mine:'
  - where: 'note 135:4 “A treasure is what He chose and kept for Himself”'
    claim: 'Deuteronomy 7:6 has the verb “chosen” with “special people”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/7?lang=eng'
    quote: 'the Lord thy God hath chosen thee to be a special people unto himself, above all people that are upon the face of the earth.'
  - where: 'note 135:4 “A treasure is what He chose and kept for Himself”'
    claim: 'Malachi 3:17 has “jewels”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/3?lang=eng'
    quote: 'And they shall be mine, saith the Lord of hosts, in that day when I make up my jewels;'

  # ---- note 135:5 ----
  - where: 'note 135:5 “Above all gods, and the idols of verse 15”'
    claim: 'Psalm 95:3 makes the same comparison, a great King above all gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/95?lang=eng'
    quote: 'For the Lord is a great God, and a great King above all gods.'

  # ---- note 135:7 ----
  - where: 'note 135:7 “The same sentence in Jeremiah 10”'
    claim: 'Jeremiah 10:13 has the sentence of verse 7 nearly word for word'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/10?lang=eng'
    quote: 'he causeth the vapours to ascend from the ends of the earth; he maketh lightnings with rain, and bringeth forth the wind out of his treasures.'
  - where: 'note 135:7 “The same sentence in Jeremiah 10”'
    claim: 'Jeremiah 10 speaks of gods decked with silver and gold'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/10?lang=eng'
    quote: 'They deck it with silver and with gold; they fasten it with nails and with hammers, that it move not.'
  - where: 'note 135:7 “The same sentence in Jeremiah 10”'
    claim: 'A modern translation has “clouds” for “vapours”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20135&version=NRSVUE'
    quote: 'He it is who makes the clouds rise at the end of the earth;'
  - where: 'note 135:7 “The same sentence in Jeremiah 10”'
    claim: 'A modern translation has “storehouses” for “treasuries”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20135&version=NRSVUE'
    quote: 'storehouses'

  # ---- note 135:11 ----
  - where: 'note 135:11 “The first two kings, east of the Jordan”'
    claim: 'Sihon refused Israel passage and came out to fight'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
    quote: 'And Sihon would not suffer Israel to pass through his border: but Sihon gathered all his people together, and went out against Israel into the wilderness'
  - where: 'note 135:11 “The first two kings, east of the Jordan”'
    claim: 'Og of Bashan came out against Israel next'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
    quote: 'And they turned and went up by the way of Bashan: and Og the king of Bashan went out against them, he, and all his people, to the battle at Edrei.'
  - where: 'note 135:11 “The first two kings, east of the Jordan”'
    claim: 'With Sihon the LORD began to give Israel its inheritance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/2?lang=eng'
    quote: 'Behold, I have begun to give Sihon and his land before thee: begin to possess, that thou mayest inherit his land.'
  - where: 'note 135:11 “The first two kings, east of the Jordan”'
    claim: 'Joshua 12 counts two kings east of the Jordan and thirty-one west'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/12?lang=eng'
    quote: 'Two kings on the east of the Jordan and thirty-one on the west are conquered by Israel.'
  - where: 'note 135:11 “The first two kings, east of the Jordan”'
    claim: 'Psalm 136 names Sihon and the heritage in the same order'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/136?lang=eng'
    quote: 'Sihon king of the Amorites: for his mercy endureth for ever:'

  # ---- note 135:13 ----
  - where: 'note 135:13 “The name given at the bush, said back to Him”'
    claim: 'At the bush the LORD gives Moses His name and calls it His memorial to all generations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: 'this is my name for ever, and this is my memorial unto all generations.'
  - where: 'note 135:13 “The name given at the bush, said back to Him”'
    claim: 'A modern translation has “your renown” for “thy memorial”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20135&version=NRSVUE'
    quote: 'your renown, O Lord, throughout all ages.'

  # ---- note 135:14 ----
  - where: 'note 135:14 “A line from the Song of Moses, and what repent means in it”'
    claim: 'Verse 14 is Deuteronomy 32:36, where the people’s power is gone'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng'
    quote: 'For the Lord shall judge his people, and repent himself for his servants, when he seeth that their power is gone, and there is none shut up, or left.'
  - where: 'note 135:14 “A line from the Song of Moses, and what repent means in it”'
    claim: 'A modern translation has “vindicate”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20135&version=NRSVUE'
    quote: 'vindicate his people'
  - where: 'note 135:14 “A line from the Song of Moses, and what repent means in it”'
    claim: 'and “have compassion”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20135&version=NRSVUE'
    quote: 'have compassion on his servants'
  - where: 'note 135:14 “A line from the Song of Moses, and what repent means in it”'
    claim: 'The Song’s next verse asks where the nations’ gods are'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng'
    quote: 'And he shall say, Where are their gods, their rock in whom they trusted,'
  - where: 'note 135:14 “A line from the Song of Moses, and what repent means in it”'
    claim: 'Hebrews quotes the line'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/10?lang=eng'
    quote: 'And again, The Lord shall judge his people.'
  - where: 'note 135:14 “A line from the Song of Moses, and what repent means in it”'
    claim: 'and follows it with a warning'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/10?lang=eng'
    quote: 'It is a fearful thing to fall into the hands of the living God.'
  - where: 'note 135:14 “A line from the Song of Moses, and what repent means in it”'
    claim: 'An older commentary takes verse 14 from Deuteronomy 32:36 and refers the reader to Hebrews 10:30–31 for the same line'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/135.htm'
    quote: 'so Psalm 135:14 is taken from Deuteronomy 32:36, cf. Psalm 90:13, and vid., on Hebrews 10:30-31.'

  # ---- note 135:17 ----
  - where: 'note 135:17 “Idols without the breath the LORD commands”'
    claim: 'Psalm 115 has the noses that smell not, where Psalm 135 has the breath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/115?lang=eng'
    quote: 'They have ears, but they hear not: noses have they, but they smell not:'
  - where: 'note 135:17 “Idols without the breath the LORD commands”'
    claim: 'Jeremiah says of the cast image that there is no breath in it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/10?lang=eng'
    quote: 'for his molten image is falsehood, and there is no breath in them.'
  - where: 'note 135:17 “Idols without the breath the LORD commands”'
    claim: '“Wind” in verse 7 is ruach (Strong’s 7307; hebrew.mjs psalms 135:7, word 9)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'ר֝וּחַ'
  - where: 'note 135:17 “Idols without the breath the LORD commands”'
    claim: '“Breath” in verse 17 is the same word, ruach (Strong’s 7307; hebrew.mjs psalms 135:17, word 8)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'ר֥וּחַ'
  - where: 'note 135:17 “Idols without the breath the LORD commands”'
    claim: '“Wind” in Jeremiah 10:13 is ruach (Strong’s 7307; hebrew.mjs jeremiah 10:13, word 15)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'ר֖וּחַ'
  - where: 'note 135:17 “Idols without the breath the LORD commands”'
    claim: '“Breath” in Jeremiah 10:14, the next verse, is the same word (Strong’s 7307; hebrew.mjs jeremiah 10:14, word 13)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Jer.xml'
    quote: 'ר֥וּחַ'
  - where: 'note 135:17 “Idols without the breath the LORD commands”'
    claim: 'Ruach means breath, wind, spirit (the Brown-Driver-Briggs entry)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7307.htm'
    quote: 'breath, wind, spirit; — absolute'

  # ---- note 135:20 ----
  - where: 'note 135:20 “A fourth group, the Levites”'
    claim: 'Psalm 115 calls on Israel, the house of Aaron, and those who fear the LORD: three groups, without Levi'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/115?lang=eng'
    quote: 'O house of Aaron, trust in the Lord: he is their help and their shield.'
  - where: 'note 135:20 “A fourth group, the Levites”'
    claim: 'The Levites are sometimes distinguished from the priests'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'The Levites are sometimes spoken of as distinct from the priests'
  - where: 'note 135:20 “A fourth group, the Levites”'
    claim: 'Their work was to assist the priests'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'The work of the Levites was to assist the priests'
  - where: 'note 135:20 “A fourth group, the Levites”'
    claim: 'They were musicians'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'They acted as musicians'

  # ---- christ ----
  - where: 'christ'
    claim: 'The name Jehovah denotes the eternal I Am, with Exodus 3:14 and John 8:58 cited; the LORD of the Old Testament is Jehovah'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'It denotes “the eternal I Am” (Ex. 3:14; John 8:58).'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ, and LORD in the Old Testament usually means Jehovah'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: 'christ'
    claim: 'Jesus says “Before Abraham was, I am”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/8?lang=eng'
    quote: 'Jesus said unto them, Verily, verily, I say unto you, Before Abraham was, I am.'
  - where: 'christ'
    claim: 'The Greek rendering of the “peculiar treasure” of Exodus 19:5 is the phrase of Titus 2:14'
    key: bdb
    url: 'https://biblehub.com/hebrew/5459.htm'
    quote: 'λαὸς περιούσιος = Titus 2:14'
  - where: 'christ'
    claim: 'Titus 2:14 says Christ gave Himself to purify a peculiar people to Himself'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/titus/2?lang=eng'
    quote: 'Who gave himself for us, that he might redeem us from all iniquity, and purify unto himself a peculiar people, zealous of good works.'

  # ---- explore ----
  - where: 'explore'
    claim: 'First Peter calls the saints a peculiar people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/2?lang=eng'
    quote: 'But ye are a chosen generation, a royal priesthood, an holy nation, a peculiar people;'

  # ---- parallels ----
  - where: 'parallels'
    claim: 'Psalm 136 has the heritage given to Israel after Sihon and Og'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/136?lang=eng'
    quote: 'Even an heritage unto Israel his servant: for his mercy endureth for ever.'
