    claim: 'The ancient Greek translation heads it “A Psalm of David”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/98.htm'
    quote: 'A Psalm of David. Sing to the Lord a new song'
  - where: setting
    claim: 'Psalms 90–106 are one of the five sections of the book, and many of them describe the millennial day'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'Psalms 90–106: This section begins with Moses’s prayer for the Lord to have mercy on straying Israel. Many of these psalms describe the millennial day'
  - where: setting
    claim: 'Psalm 98 is listed among the psalms of praise, which begin with a call to gather and praise'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'These psalms often begin with a command or call to Israel to gather as a community (most importantly, at the temple) and praise the Lord: 8, 19, 29, 33, 47, 65, 66, 78, 93, 95–100'
  - where: setting
    claim: 'After the call, psalms of praise give the reasons: the Lord’s power and mercy and what He has done'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'After the call to praise, the hymns describe the power and the mercy of the Lord, often describing what he has done for Israel in the past'
  - where: setting
    claim: 'Psalm 96 opens with the same call, has the sea roar, and closes with the LORD coming to judge the world with righteousness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/96?lang=eng'
    quote: 'Before the Lord: for he cometh, for he cometh to judge the earth: he shall judge the world with righteousness'
  - where: setting
    claim: 'Psalm 96 opens “O sing unto the LORD a new song”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/96?lang=eng'
    quote: 'O sing unto the Lord a new song: sing unto the Lord, all the earth.'
  - where: setting
    claim: 'One older commentary holds that the beginning and end of Psalm 98 come from Psalm 96'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/98.htm'
    quote: 'The beginning and end are taken from Psalm 96:1-13.'
  - where: setting
    claim: 'The same commentary holds that nearly all the middle comes from the second part of Isaiah'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/98.htm'
    quote: 'Almost all that lies between is taken from the second part of Isaiah.'
  - where: thread
    claim: 'Psalm 98:1 gives the reason for the new song: what the LORD has done (the new song is treated on the site at Psalm 33:3)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/98?lang=eng'
    quote: 'O sing unto the Lord a new song; for he hath done marvellous things'
