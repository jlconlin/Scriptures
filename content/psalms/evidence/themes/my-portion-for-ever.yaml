page: my-portion-for-ever
claims:
  - where: 'section “The promise, and the sight”'
    claim: 'The Church’s cross-reference at “prosper” in Psalm 1:3 is Gen. 39:3 (Joseph)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/1?lang=eng'
    quote: '“prosper”: Gen. 39:3 (2–3); Mosiah 1:7; Alma 50:20'
  - where: 'section “The promise, and the sight”'
    claim: 'Joseph as a slave: the LORD made all that he did to prosper (Gen. 39:3)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/39?lang=eng'
    quote: 'And his master saw that the Lord was with him, and that the Lord made all that he did to prosper in his hand.'
  - where: 'section “The promise, and the sight”'
    claim: '“Prosper” in Psalm 1:3 is a Hebrew verb (H6743, tsalach)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יַצְלִֽיחַ'
  - where: 'section “The promise, and the sight”'
    claim: '“Prospereth” in Psalm 37:7 is the same verb (H6743)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בְּ/מַצְלִ֣יחַ'
  - where: 'section “The promise, and the sight”'
    claim: 'Connection made by this page: Psalm 1:3 (“whatsoever he doeth shall prosper”) set beside Psalm 37:7 (“him who prospereth in his way”), on the shared verb: what Psalm 1 promises the righteous, Psalm 37 admits of a wicked man'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/37?lang=eng'
    quote: 'fret not thyself because of him who prospereth in his way'
  - where: 'section “I was envious”'
    claim: '“Envious” in Psalm 37:1 is the Hebrew verb qana (H7065)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תְּ֝קַנֵּ֗א'
  - where: 'section “I was envious”'
    claim: '“Envious” in Psalm 73:3 is the same verb (H7065)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'קִ֭נֵּאתִי'
  - where: 'section “I was envious”'
    claim: '“Prosperity” in Psalm 73:3 is shalom (H7965), “peace”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שְׁל֖וֹם'
  - where: 'section “I was envious”'
    claim: '“Peace” in Psalm 37:11 is the same word (H7965)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שָׁלֽוֹם'
  - where: 'section “I was envious”'
    claim: 'Connection made by this page: Psalm 73:3 set beside Psalm 37:1 and 37:11: the speaker is envious, as 37:1 forbade, and sees the wicked holding the word (peace) that Psalm 37:11 gave the meek'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/73?lang=eng'
    quote: 'For I was envious at the foolish, when I saw the prosperity of the wicked.'
  - where: 'section “The sanctuary, and the portion”'
    claim: '“Part” in Numbers 18:20 is the Hebrew heleq (H2506), the noun translated “portion” in Psalm 73:26'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'חֶלְקְ/ךָ֙'
  - where: 'section “The sanctuary, and the portion”'
    claim: '“Portion” in Psalm 73:26 is heleq (H2506)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וְ/חֶלְקִ֗/י'
  - where: 'section “The sanctuary, and the portion”'
    claim: '“Portion” in Psalm 17:14 (“their portion in this life”) is the same noun (H2506)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חֶלְקָ֥/ם'
  - where: 'section “The sanctuary, and the portion”'
    claim: 'Connection made by this page: Psalm 17:14 (“their portion in this life”) set beside Psalm 73:26 (“my portion for ever”), on the shared noun: the two verses have a portion in this life and a portion for ever'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/73?lang=eng'
    quote: 'My flesh and my heart faileth: but God is the strength of my heart, and my portion for ever.'
  - where: 'section “The sanctuary, and the portion”'
    claim: 'Connection made by this page: Psalm 1:3 (“prosper”), Psalm 37:11 (“inherit the earth”) and Psalm 73:26 (“God is… my portion for ever”) read as a sequence in what is offered: how a man’s work fares, where he lives, whom he has'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/73?lang=eng'
    quote: 'But God is the strength of my heart, and my portion for ever.'
  - where: 'section “Planted in the house”'
    claim: '“Planted” in Psalm 92:13 is the Hebrew shatal (H8362)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שְׁ֭תוּלִים'
  - where: 'section “Planted in the house”'
    claim: '“Planted” (of the tree) in Psalm 1:3 is the same verb (H8362)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שָׁת֪וּל'
  - where: 'section “Planted in the house”'
    claim: 'Connection made by this page: the tree of Psalm 1:3 set beside the righteous “planted in the house of the LORD” (92:13), the place where Psalm 73 turned (73:17)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/92?lang=eng'
    quote: 'Those that be planted in the house of the LORD shall flourish in the courts of our God.'
  - where: 'section “The meek, the earth, and the Redemption”'
    claim: '3 Nephi 12:5 has the same promise'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/12?lang=eng'
    quote: 'And blessed are the meek, for they shall inherit the earth.'
  - where: 'section “The meek, the earth, and the Redemption”'
    claim: 'D&C 88:14, 17: the resurrection comes through the redemption made for us, and the redemption of the soul is through him that quickeneth all things, in whose bosom the poor and the meek shall inherit the earth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'And the redemption of the soul is through him that quickeneth all things, in whose bosom it is decreed that the poor and the meek of the earth shall inherit it.'
  - where: 'section “The meek, the earth, and the Redemption”'
    claim: 'D&C 88:14: through the redemption made for you comes the resurrection from the dead'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'Now, verily I say unto you, that through the redemption which is made for you is brought to pass the resurrection from the dead.'
  - where: 'section “The meek, the earth, and the Redemption”'
    claim: 'The Church’s cross-reference at “meek” in D&C 88:17 includes Matt. 5:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: '“meek”: Zeph. 2:3 (1–3); Matt. 5:5; D&C 38:20.'
  - where: 'section “The meek, the earth, and the Redemption”'
    claim: 'To inherit the earth means to inherit the celestial kingdom'
    key: dc-student-manual-2017-88
    url: 'https://www.churchofjesuschrist.org/study/manual/doctrine-and-covenants-student-manual-2017/chapter-33-doctrine-and-covenants-88-1-69?lang=eng'
    quote: 'To inherit the earth means to inherit the celestial kingdom.'
  - where: 'section “The meek, the earth, and the Redemption”'
    claim: 'What the Father offers is Himself and His Son'
    key: christofferson-relationship-god
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/04/41christofferson?lang=eng'
    quote: 'What our Heavenly Father offers us is Himself and His Son, a close and enduring relationship with Them through the grace and mediation of Jesus Christ, our Redeemer.'
  - where: 'section “The meek, the earth, and the Redemption”'
    claim: 'The talk quotes “joint-heirs with Christ”; it does not cite the psalm'
    key: christofferson-relationship-god
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/04/41christofferson?lang=eng'
    quote: 'Recalling Paul’s expression, we are “joint-heirs with Christ; if so be that we suffer with him, that we may be also glorified together.”'
  - where: 'section “The meek, the earth, and the Redemption”'
    claim: 'Romans 8:17: heirs of God and joint-heirs with Christ, if we suffer with him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/8?lang=eng'
    quote: 'heirs of God, and joint-heirs with Christ; if so be that we suffer with him'
  - where: 'section “The meek, the earth, and the Redemption”'
    claim: 'Connection made by this page: Elder Christofferson’s “What our Heavenly Father offers us is Himself and His Son” set beside “God is… my portion for ever” (Ps. 73:26): each names God Himself as what is given; the words differ, and the talk does not cite the psalm'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/73?lang=eng'
    quote: 'But God is the strength of my heart, and my portion for ever.'
  - where: 'section “The sanctuary, and the portion”'
    claim: '“Their end” in Psalm 73:17 is the Hebrew acharit (H319)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לְ/אַחֲרִיתָֽ/ם'
  - where: 'section “The sanctuary, and the portion”'
    claim: '“The end” in Psalm 37:37 and 37:38 is the same noun (H319)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אַחֲרִ֖ית'
  - where: 'section “The meek, the earth, and the Redemption”'
    claim: 'God’s plan is not a cosmic vending machine that delivers a chosen blessing for a sum of good works'
    key: christofferson-relationship-god
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2022/04/41christofferson?lang=eng'
    quote: 'We ought not to think of God’s plan as a cosmic vending machine'
