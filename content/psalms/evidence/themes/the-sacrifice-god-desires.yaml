page: the-sacrifice-god-desires
claims:
  - where: 'section “Lo, I come”'
    claim: '“Desire” (40:6) and “delight” (40:8) are one Hebrew verb (chaphets, H2654)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חָפַ֗צְתָּ'
  - where: 'section “Lo, I come”'
    claim: 'The verb of 40:8 (“delight”) is the same as that of 40:6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חָפָ֑צְתִּי'
  - where: 'section “Lo, I come”'
    claim: 'The same Hebrew verb (chaphets, H2654) is in Ps. 51:6, “thou desirest truth in the inward parts”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חָפַ֣צְתָּ'
  - where: 'section “Lo, I come”'
    claim: 'The same verb is in Ps. 51:16, “thou desirest not sacrifice”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תַחְפֹּ֣ץ'
  - where: 'section “Lo, I come”'
    claim: 'The same verb is in Ps. 51:19, “Then shalt thou be pleased”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תַּחְפֹּ֣ץ'
  - where: 'section “Lo, I come”'
    claim: 'Connection made by this page: Psalms 40 and 51, set side by side, use one verb for the sacrifice God does not desire (40:6; 51:16) and for what is named beside it, truth within (51:6) and delight in His will (40:8)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/51?lang=eng'
    quote: 'For thou desirest not sacrifice; else would I give it: thou delightest not in burnt offering.'
  - where: 'section “Lo, I come”'
    claim: '1 Sam. 15:22, “to obey is better than sacrifice” (the Church’s edition cross-references it at Ps. 40:6a and 51:16a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: 'Behold, to obey is better than sacrifice, and to hearken than the fat of rams.'
  - where: 'section “The broken heart, and the altar after it”'
    claim: 'Under the law the broken heart was to accompany the animal sacrifice (the KnoWhy quoting M. Catherine Thomas; her work not read)'
    key: sc-knowhy-198
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-tell-all-people-to-sacrifice-a-broken-heart-and-a-contrite-spirit'
    quote: 'under the law of Moses, the broken heart was to accompany the animal sacrifice (cf. Ps 51:17–19)'
  - where: 'section “The offering of Jesus Christ, and ours”'
    claim: 'Sacrifices were a similitude of the sacrifice of the Only Begotten Son of God'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'offering the firstlings of their flocks in a similitude of the sacrifice that would be made of the Only Begotten Son of God (Moses 5:4–8)'
  - where: 'section “The offering of Jesus Christ, and ours”'
    claim: 'Heb. 10:5 quotes the psalm with “a body hast thou prepared me”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/10?lang=eng'
    quote: 'Wherefore when he cometh into the world, he saith, Sacrifice and offering thou wouldest not, but a body hast thou prepared me'
  - where: 'section “The offering of Jesus Christ, and ours”'
    claim: 'The Greek (Septuagint) form of Ps. 40:6 reads “a body hast thou prepared me,” the wording Heb. 10:5 quotes'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/40.htm'
    quote: 'Sacrifice and offering thou wouldest not; but a body hast thou prepared me: whole-burnt-offering and sacrifice for sin thou didst not require.'
  - where: 'section “The offering of Jesus Christ, and ours”'
    claim: 'The speaker of Psalm 40 also confesses iniquity (40:12)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/40?lang=eng'
    quote: 'mine iniquities have taken hold upon me'
  - where: 'section “The offering of Jesus Christ, and ours”'
    claim: '2 Ne. 2:7 is an allusion to Ps. 51:16–17; the believer must offer himself as well as take Christ’s offering'
    key: sc-knowhy-275
    url: 'https://scripturecentral.org/knowhy/how-are-atonement-resurrection-judgment-and-redemption-interconnected'
    quote: 'This is an allusion to Psalms 51:16–17'
  - where: 'section “The offering of Jesus Christ, and ours”'
    claim: 'To take advantage of Christ’s offering people must offer themselves'
    key: sc-knowhy-275
    url: 'https://scripturecentral.org/knowhy/how-are-atonement-resurrection-judgment-and-redemption-interconnected'
    quote: 'To take advantage of Christ’s offering of Himself as “a sacrifice for sin,” people must offer up themselves as well.'
  - where: 'section “What only God can give”'
    claim: 'Connection made by this page: the requests of 51:10, 32:5 and 130:3–8, set beside the sacrifice verses, show what the worshipper cannot bring'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/130?lang=eng'
    quote: 'And he shall redeem Israel from all his iniquities.'
