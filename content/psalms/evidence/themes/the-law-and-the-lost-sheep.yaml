page: the-law-and-the-lost-sheep
claims:
  - where: 'section “Delight, and a plea”'
    claim: 'Praise of the law’s perfection in Psalm 19 turns the psalmist’s thoughts inward and he pleads with the Lord to help him do better'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'cause him to turn his thoughts inward as he considers how his own life measures up to the standard of that law and pleads with the Lord to help him do better'
  - where: 'section “The last verse”'
    claim: '“Lost” is in one verse of the King James Psalms (occurrences.mjs psalms "lost"); of the 36 verses with “seek,” God is asked to seek only at 10:15 (wickedness) and here (a person)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/119?lang=eng'
    quote: 'I have gone astray like a lost sheep; seek thy servant; for I do not forget thy commandments.'
  - where: 'section “The last verse”'
    claim: 'Straying is a past event in 119:67'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/119?lang=eng'
    quote: 'Before I was afflicted I went astray: but now have I kept thy word.'
  - where: 'section “The last verse”'
    claim: 'Straying is a danger in 119:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/119?lang=eng'
    quote: 'With my whole heart have I sought thee: O let me not wander from thy commandments.'
  - where: 'section “The last verse”'
    claim: 'One older reading: the going astray is no apostasy; the sheep’s home is beside the Lord'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/119.htm'
    quote: 'his going astray is no apostasy; his home, to which he longs to return when he has been betrayed into by-ways, is beside the Lord.'
  - where: 'section “The last verse”'
    claim: 'The Hebrew word behind “lost” in 119:176 (H6)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֹ֭בֵד'
  - where: 'section “The last verse”'
    claim: 'The same word (H6) is “perish” in 1:6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תֹּאבֵֽד'
  - where: 'section “The shepherd who restores”'
    claim: 'The Hebrew noun “soul” (nephesh) with the root “turn back” stands in 19:7'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מְשִׁ֣יבַת'
  - where: 'section “The shepherd who restores”'
    claim: 'The same root and noun stand in 23:3 (“restoreth my soul”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יְשׁוֹבֵ֑ב'
  - where: 'section “The shepherd who restores”'
    claim: 'Connection made by this page: what Psalm 19 says the law does (converting the soul), Psalm 23 says the shepherd does'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/19?lang=eng'
    quote: 'The law of the LORD is perfect, converting the soul'
  - where: 'section “The shepherd who restores”'
    claim: 'Ps. 23:3 wording'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/23?lang=eng'
    quote: 'He restoreth my soul'
  - where: 'section “The shepherd who restores”'
    claim: 'The verb of “err” in 95:10 (H8582)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תֹּעֵ֣י'
  - where: 'section “The shepherd who restores”'
    claim: 'The verb of “I have gone astray” in 119:176 is the same (H8582); six occurrences in Psalms'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תָּעִ֗יתִי'
  - where: 'section “The shepherd who restores”'
    claim: 'Connection made by this page: Ps. 95:10 and 119:176 set side by side on the shared verb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/95?lang=eng'
    quote: 'It is a people that do err in their heart, and they have not known my ways'
  - where: 'section “I will seek that which was lost”'
    claim: 'The Hebrew word for “lost” in Ezek. 34:16 is the same as in Ps. 119:176 (H6)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'הָ/אֹבֶ֤דֶת'
  - where: 'section “I will seek that which was lost”'
    claim: 'Ezek. 34:16 “I will seek” is the same verb as “seek” in Ps. 119:176 (H1245)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ezek.xml'
    quote: 'אֲבַקֵּשׁ֙'
  - where: 'section “I will seek that which was lost”'
    claim: 'The Hebrew “seek” of 119:176 (H1245)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בַּקֵּ֣שׁ'
  - where: 'section “I will seek that which was lost”'
    claim: 'Connection made by this page: the psalmist’s request (Ps. 119:176) and the LORD’s promise (Ezek. 34:16) are in the same two Hebrew words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/34?lang=eng'
    quote: 'I will seek that which was lost, and bring again that which was driven away'
  - where: 'section “I will seek that which was lost”'
    claim: 'Isa. 53:6 uses the verb “gone astray” of Ps. 119:176'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'תָּעִ֔ינוּ'
  - where: 'section “I will seek that which was lost”'
    claim: 'Isa. 53:6 wording'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/53?lang=eng'
    quote: 'the Lord hath laid on him the iniquity of us all'
  - where: 'section “I will seek that which was lost”'
    claim: 'The Topical Guide “Sheep” lists 119:176 with Isa. 53:6, 1 Pet. 2:25 and Alma 5:37'
    key: tg-sheep
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/sheep?lang=eng'
    quote: 'gone astray like a lost sheep, Ps. 119:176 (Isa. 53:6; 1 Pet. 2:25; Mosiah 14:6; Alma 5:37).'
  - where: 'section “The lawgiver and the shepherd”'
    claim: 'Luke 15:4 wording'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/15?lang=eng'
    quote: 'go after that which is lost, until he find it'
  - where: 'section “The lawgiver and the shepherd”'
    claim: '1 Pet. 2:25 wording'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/2?lang=eng'
    quote: 'For ye were as sheep going astray; but are now returned unto the Shepherd and Bishop of your souls.'
  - where: 'section “The lawgiver and the shepherd”'
    claim: 'The Topical Guide “Jesus Christ, Good Shepherd” lists Ps. 95:7 with John 10:14'
    key: tg-jesus-christ-good-shepherd
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/jesus-christ-good-shepherd?lang=eng'
    quote: 'people of his pasture, and the sheep of his hand, Ps. 95:7.'
  - where: 'section “The lawgiver and the shepherd”'
    claim: 'Connection made by this page: “sheep… hear… voice” in John 10:27 and Ps. 95:7 (King James wording)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/10?lang=eng'
    quote: 'My sheep hear my voice, and I know them, and they follow me'
  - where: 'section “The lawgiver and the shepherd”'
    claim: 'Ps. 95:7 wording'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/95?lang=eng'
    quote: 'we are the people of his pasture, and the sheep of his hand. To day if ye will hear his voice'
  - where: 'section “The lawgiver and the shepherd”'
    claim: 'Connection made by this page: the Lord who says He gave the law (3 Ne. 15:5) set beside the Son of man who came to seek the lost (Luke 19:10)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/15?lang=eng'
    quote: 'Behold, I am he that gave the law, and I am he who covenanted with my people Israel; therefore, the law in me is fulfilled'
  - where: 'section “The lawgiver and the shepherd”'
    claim: '3 Ne. 15:9 wording'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/15?lang=eng'
    quote: 'Behold, I am the law, and the light.'
  - where: 'section “The lawgiver and the shepherd”'
    claim: 'Luke 19:10 wording'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/19?lang=eng'
    quote: 'For the Son of man is come to seek and to save that which was lost.'
  - where: 'section “The lawgiver and the shepherd”'
    claim: 'The Church’s footnote at Ezek. 34:16 (“lost”) refers to Luke 15:4 and 19:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/34?lang=eng'
    quote: 'Luke 15:4; 19:10'
  - where: 'section “The lawgiver and the shepherd”'
    claim: '3 Ne. 15:10 wording'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/15?lang=eng'
    quote: 'I have given unto you the commandments; therefore keep my commandments.'
