page: the-unanswered-prayer
claims:
  - where: 'section “How long, and why”'
    claim: 'The Church edition’s footnote 1b at Ps. 13:1, on “hide”, points to D&C 121:1 (1–2)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/13?lang=eng'
    quote: 'D&C 121:1 (1–2).'
  - where: 'section “How long, and why”'
    claim: 'D&C 121:1 reads “O God, where art thou? And where is the pavilion that covereth thy hiding place?”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/121?lang=eng'
    quote: 'O God, where art thou? And where is the pavilion that covereth thy hiding place?'
  - where: 'section “Prayed from the cross”'
    claim: 'The cry showed Christ had descended below all things so as to succor his people'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'that cry showed that Christ had truly “descended below all things” (D&C 88:6), so that he could understand and succor his people (Alma 7:12)'
  - where: 'section “Prayed from the cross”'
    claim: 'Hopkin ties Joseph Smith’s question (D&C 121:1) to Jesus’s cry'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'Joseph Smith wrote a letter expressing sentiments connected to Jesus’s cry, penning the phrase “O God, where art thou?” (D&C 121:1)'
  - where: 'section “Prayed from the cross”'
    claim: 'Hopkin gives D&C 122:8 as God’s response recorded later in the same letter'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'Later in the letter, Joseph recorded God’s response, teaching him that even if Joseph had felt alone, he needed to remember that Christ had descended even lower'
  - where: 'section “Prayed from the cross”'
    claim: 'D&C 122:8 reads “The Son of Man hath descended below them all”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/122?lang=eng'
    quote: 'The Son of Man hath descended below them all.'
  - where: 'section “Neither hath he hid his face”'
    claim: '“Hide thy face” in 13:1 is the same Hebrew verb and phrase as “hidest thou thy face” in 88:14 (H5641 hiphil + “face”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תַּסְתִּ֖יר'
  - where: 'section “Neither hath he hid his face”'
    claim: 'Verses 23–25 look back on the trial as past; the one heard in 22:24 is the psalm’s sufferer'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'Verses 23–25 speak of the trial as already having passed, declaring that God has already “heard” and responded to the cry of the sufferer (Ps. 22:24)'
  - where: 'section “Neither hath he hid his face”'
    claim: '“Hid” in Psalm 22:24 is the same Hebrew verb (H5641 hiphil) as in 13:1 and 88:14'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הִסְתִּ֣יר'
  - where: 'section “Neither hath he hid his face”'
    claim: 'Connection made by this page: Psalm 13:1 and 88:14 ask why God hides His face, and Psalm 22:24 says of its own sufferer that He has not hid his face; set beside each other on the shared verb, comparison only'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/22?lang=eng'
    quote: 'neither hath he hid his face from him; but when he cried unto him, he heard.'
  - where: 'section “Neither hath he hid his face”'
    claim: 'Hebrews gives Psalm 22:22 to Christ, who is not ashamed to call them brethren'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/2?lang=eng'
    quote: 'he is not ashamed to call them brethren, Saying, I will declare thy name unto my brethren, in the midst of the church will I sing praise unto thee.'
  - where: 'section “Neither hath he hid his face”'
    claim: 'Hebrews quotes the final section of the psalm to stress the victorious nature of the Atonement'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'the author of Hebrews chose to emphasize the victorious nature of Jesus’s Atonement by quoting from the final section of the psalm'
  - where: 'section “The book called Praises”'
    claim: 'The Hebrew name of the book is Tehillim, “Praises”'
    key: bd-psalms
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/psalms?lang=eng'
    quote: 'The Psalms collectively are called in Hebrew Tehillim or “Praises,”'
  - where: 'section “The book called Praises”'
    claim: 'The last section (Psalms 107–150) praises God for delivering Israel through the Messiah'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'Psalms 107–150: These psalms praise God for delivering Israel through the Messiah.'
  - where: 'section “The book called Praises”'
    claim: 'Connection made by this page: the book that keeps Psalm 88 as it is also ends in praise; the praise at the end does not answer each lament'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/150?lang=eng'
    quote: 'Let every thing that hath breath praise the LORD.'
