  - where: 'section “Upon himself shall his crown flourish”'
    claim: 'Psalm 132 should be carefully compared with 89'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/132.htm'
    quote: 'In many respects it resembles Psalms 89, with which it should be carefully compared'
  - where: 'section “Upon himself shall his crown flourish”'
    claim: 'On that reading 89 is of the Exile without hope, 132 hopeful after the Restoration'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/132.htm'
    quote: 'without one ray of hope in the immediate present, Psalms 132 breathes a spirit of hopefulness which presumes the Restoration'
  - where: 'section “Upon himself shall his crown flourish”'
    claim: 'On another reading 132 belongs to a time when the Davidic throne still stood'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/132.htm'
    quote: 'At all events it belongs to a time in which the Davidic throne was still standing'
  - where: 'section “Upon himself shall his crown flourish”'
    claim: 'Ps. 132:12 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/132?lang=eng'
    quote: 'If thy children will keep my covenant and my testimony that I shall teach them, their children shall also sit upon thy throne for evermore.'
  - where: 'section “Upon himself shall his crown flourish”'
    claim: 'The “if” was a condition of the continuity of the succession, not of the endlessness of the throne'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/132.htm'
    quote: 'were conditions of the continuity of the Davidic succession; not, however - because human unfaithfulness does not annul the faithfulness of God - of the endlessness of the Davidic throne'
  - where: 'section “Upon himself shall his crown flourish”'
    claim: 'One older reading sets the oath of 132:11 beside 89:3, 35'
    key: pulpit-psalms
    url: 'https://biblehub.com/commentaries/pulpit/psalms/132.htm'
    quote: 'The Lord hath sworn in truth unto David (comp. Psalm 89:3, 35).'
