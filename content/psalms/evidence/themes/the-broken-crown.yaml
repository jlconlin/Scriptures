  - where: 'section “Thou hast profaned his crown”'
    claim: 'Ps. 89:51 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/89?lang=eng'
    quote: 'wherewith they have reproached the footsteps of thine anointed.'
  - where: 'section “Thou hast profaned his crown”'
    claim: '89:52 is the formula ending Book III, yet heard as a subtle gesture of hope'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'the psalm ends with a final benediction, a subtle gesture of hope'
  - where: 'section “Thou hast profaned his crown”'
    claim: 'One reading sets the psalm in the exile, Jehoiachin a captive in Babylon'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/89.htm'
    quote: 'if it was written while Jehoiachin was still a dishonoured captive in Babylon'
  - where: 'section “Thou hast profaned his crown”'
    claim: 'Another sets it under Rehoboam after Shishak spoiled the Temple and Palace'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/89.htm'
    quote: 'conquered the fortified cities of Judah, and spoiled the Temple and Palace'
  - where: 'section “Thou hast profaned his crown”'
    claim: 'A third reading dates it to the persecution under Antiochus Epiphanes'
    key: ellicott-psalms
    url: 'https://biblehub.com/commentaries/ellicott/psalms/89.htm'
    quote: 'The time of the persecution of Antiochus Epiphanes suits best all the conditions presented by the psalm.'
  - where: 'section “Thou hast profaned his crown”'
    claim: 'The Church’s footnote at Ps. 89:39 “casting” points to D&C 132:39'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/89?lang=eng'
    quote: 'D&C 132:39 (37–39).'
  - where: 'section “Thou hast profaned his crown”'
    claim: 'D&C 132:39: David fell from his exaltation in the case of Uriah and his wife'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng'
    quote: 'save in the case of Uriah and his wife; and, therefore he hath fallen from his exaltation'
  - where: 'section “Thou hast profaned his crown”'
    claim: 'David’s failure resulted in a loss of blessings, but God never abandoned David or the promise'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'resulted in a loss of blessings (see Doctrine and Covenants 132:39), but the narrative asserts that God never abandoned David or the covenantal promise.'
