    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/96?lang=eng'
    quote: 'TG Jesus Christ, Jehovah.'
  - where: 'section “The LORD reigneth”'
    claim: 'Connection made by this page: read in the book’s order after Psalm 89, where David’s throne was cast to the ground (89:44), the psalms of “The LORD reigneth” (93:1–2; 97:2) answer the question of 89:49 in Psalm 89’s own words (the verb and stem of 89:37, the line of 89:14), singing again after the lament what was sung before it, but of the LORD’s own throne, which was never cast down; this is only half an answer, since they say nothing of David’s line. No source reads Book Four as an answer to Psalm 89, and the order is the book’s, not the order of composition'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/93?lang=eng'
    quote: 'Thy throne is established of old: thou art from everlasting.'
  - where: 'section “Upon himself shall his crown flourish”'
    claim: 'Ps. 132:10 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/132?lang=eng'
    quote: 'turn not away the face of thine anointed.'
  - where: 'section “Upon himself shall his crown flourish”'
    claim: 'Ps. 132:11 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/132?lang=eng'
    quote: 'The Lord hath sworn in truth unto David; he will not turn from it; Of the fruit of thy body will I set upon thy throne.'
