    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חִלַּ֖לְתָּ'
  - where: 'section “Thou hast profaned his crown”'
    claim: 'nēzer means consecration and the crown of the high priest or the king as the mark of consecration'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/89.htm'
    quote: 'means (1) consecration, and (2) the crown or diadem of the high priest (Exodus 29:6) or the king (2 Samuel 1:10), as the mark of consecration to their office.'
  - where: 'section “Thou hast profaned his crown”'
    claim: 'BDB lists Ps. 89:39 (Heb. 89:40) and 132:18 together, of nēzer as a symbol of royal power'
    key: bdb
    url: 'https://biblehub.com/hebrew/5145.htm'
    quote: 'symbol of royal power Psalm 89:40; Psalm 132:18'
  - where: 'section “Thou hast profaned his crown”'
    claim: 'The crown is sacred, and casting it down made the sacred thing vile'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/89.htm'
    quote: 'God has therefore made the sacred thing vile by casting it to the ground'
  - where: 'section “Thou hast profaned his crown”'
    claim: '“Swarest” (89:49) is the niphal of H7650, the stem of “I have sworn” in 89:3 and 89:35'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'נִשְׁבַּ֥עְתָּ'
  - where: 'section “Thou hast profaned his crown”'
    claim: '“I have sworn” in 89:3 is the niphal of H7650'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'נִ֝שְׁבַּ֗עְתִּי'
  - where: 'section “Thou hast profaned his crown”'
    claim: '“I have sworn” in 89:35 is the niphal of H7650'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
