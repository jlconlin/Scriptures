page: the-broken-crown
claims:
  - where: 'section “The king and the oath”'
    claim: 'The Church’s chapter heading for Psalm 72 calls Solomon a type of the Messiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/72?lang=eng'
    quote: 'David speaks of Solomon, who is made a type of the Messiah'
  - where: 'section “The crown on the ground”'
    claim: '“Thine anointed” (Ps. 89:38) is the same Hebrew word (H4899) as “his anointed” in Ps. 2:2'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מְשִׁיחֶֽ/ךָ'
  - where: 'section “The crown on the ground”'
    claim: '“His anointed” in Ps. 2:2 is the Hebrew word (H4899) that stands in Ps. 89:38'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מְשִׁיחֽ/וֹ'
  - where: 'section “The crown on the ground”'
    claim: 'The verb of “My covenant will I not break” (Ps. 89:34) is H2490, the verb of “profaned” (Ps. 89:39)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֲחַלֵּ֥ל'
  - where: 'section “The crown on the ground”'
    claim: 'The verb of “profaned” (Ps. 89:39) is H2490, the verb of “will I not break” (Ps. 89:34)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חִלַּ֖לְתָּ'
  - where: 'section “The crown on the ground”'
    claim: 'Verse 52 is the doxology that marks the end of the third division'
    key: ot-manual-psalms
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/the-psalms-songs-from-the-heart-of-israel?lang=eng'
    quote: 'At the end of each division, the break is marked with a doxology, or formal declaration of God’s power and glory (see Psalms 41:13; 72:19; 89:52; 106:48).'
  - where: 'section “The LORD reigneth”'
    claim: 'Connection made by this page: read after Psalm 89, where David’s throne was cast down, Psalm 93 speaks of a throne that is the LORD’s own (Ps. 93:1–2)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/93?lang=eng'
    quote: 'Thy throne is established of old'
  - where: 'section “The LORD reigneth”'
    claim: 'The Hebrew of Ps. 97:2, “Righteousness and judgment are the habitation of his throne,” is four words'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'צֶ֥דֶק וּ֝/מִשְׁפָּ֗ט מְכ֣וֹן כִּסְאֽ/וֹ'
  - where: 'section “The LORD reigneth”'
    claim: 'Ps. 89:14, “Justice and judgment are the habitation of thy throne,” has the same four words but for the suffix'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'צֶ֣דֶק וּ֭/מִשְׁפָּט מְכ֣וֹן כִּסְאֶ֑/ךָ'
  - where: 'section “The LORD reigneth”'
    claim: 'Many psalms of Book Four describe the millennial day when Israel will find rest under the Messiah’s reign'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'Many of these psalms describe the millennial day when Israel will find rest under the Messiah''s reign.'
  - where: 'section “The oath again”'
    claim: 'The Hebrew word for “crown” in Ps. 132:18 (H5145) occurs in Psalms only there and at 89:39 (Ps. 21:3 has another word, H5850)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'נִזְרֽ/וֹ'
  - where: 'section “The oath again”'
    claim: 'Connection made by this page: the crown cast to the ground (Ps. 89:39) and the crown that flourishes (Ps. 132:18), words of one Hebrew noun, set beside each other'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/132?lang=eng'
    quote: 'upon himself shall his crown flourish'
  - where: 'section “The throne given”'
    claim: 'One older reading: Zacharias had Ps. 132:17 in mind at Luke 1:69'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/132.htm'
    quote: 'Zacharias appears to have had this passage in mind, Luke 1:69'
  - where: 'section “The throne given”'
    claim: 'The earthly kings of Israel ultimately failed, but Jesus would not fail'
    key: sc-knowhy-865
    url: 'https://scripturecentral.org/knowhy/why-does-god-declare-jesus-to-be-his-son'
    quote: 'The earthly kings of Israel and Judah ultimately failed to do everything they were supposed to do, but Jesus would not fail'
  - where: 'section “The throne given”'
    claim: 'One older reading: the Incarnation was the true solution of the psalmist’s perplexity in Psalm 89'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/89.htm'
    quote: 'the Incarnation was the true solution of the Psalmist''s perplexity'
