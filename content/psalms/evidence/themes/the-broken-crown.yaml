  - where: 'opening'
    claim: 'Acts 2:30 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/2?lang=eng'
    quote: 'he would raise up Christ to sit on his throne;'
  - where: 'opening'
    claim: 'Jesus is both the promisor and the fulfillment of the promise to David'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'Jesus is simultaneously the promisor and the fulfillment of the promise.'
