    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/the-psalms-songs-from-the-heart-of-israel?lang=eng'
    quote: 'At the end of each division, the break is marked with a doxology, or formal declaration of God’s power and glory (see Psalms 41:13; 72:19; 89:52; 106:48).'
  - where: 'opening'
    claim: 'Ps. 97:2b repeats the line of 89:14a'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/97.htm'
    quote: '2 b is taken from Psalm 89:14 a'
  - where: 'opening'
    claim: 'The Hebrew noun for “crown” (nēzer, H5145) in Ps. 132:18 occurs in Psalms only there and at 89:39 (occurrences.mjs psalms --hebrew 5145: 2 occurrences)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'נִזְרֽ/וֹ'
  - where: 'opening'
    claim: 'The psalms of the LORD’s own reign and those of His Anointed are two series that converge but do not meet in the Old Testament'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/93.htm'
    quote: 'The two series, it is true, converge in the Old Testament, but do not meet'
  - where: 'opening'
    claim: 'On one reading Psalm 89 dates from Rehoboam’s reign'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/89.htm'
    quote: 'During this very period Psalm 89 took its rise. The young Davidic king, whom loss and disgrace make prematurely old, is Rehoboam'
  - where: 'opening'
    claim: 'On the same reading Psalm 132 is favoured as Solomon’s, so older than Psalm 89'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/132.htm'
    quote: 'The view that it was composed by Solomon himself when the Ark of the covenant was removed out of the tent-temple on Zion into the Temple-building'
  - where: 'opening'
    claim: 'The same reading: the history that fulfils them shows the coming of the Anointed and of Jahve one and the same'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/93.htm'
    quote: 'the parusia of the Anointed One and the parusia of Jahve is one and the same'
  - where: 'opening'
    claim: 'Psalm 89 is the most extensive biblical exposition of the Davidic covenant'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'Psalm 89 contains the most extensive biblical exposition of the Davidic covenant.'
  - where: 'opening'
    claim: 'Acts 13:34: God raised Jesus from the dead'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/13?lang=eng'
