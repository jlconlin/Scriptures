    claim: 'Ps. 89:39, 44 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/89?lang=eng'
    quote: 'Thou hast made his glory to cease, and cast his throne down to the ground.'
  - where: 'section “Thou hast profaned his crown”'
    claim: 'The verb of “will I not break” (89:34) is H2490 (ḥālal), the verb of “profaned” (89:39)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֲחַלֵּ֥ל'
  - where: 'section “Thou hast profaned his crown”'
    claim: 'The verb of “profaned” (89:39) is H2490 (ḥālal), the verb of “break” in 89:34'
