page: who-can-ransom
claims:
  - where: 'section “A grave where no one praises”'
    claim: 'Sheol is the Hebrew name for the abode of departed spirits, rendered “grave,” “pit,” “hell”'
    key: bd-sheol
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sheol?lang=eng'
    quote: 'The Hebrew name for the abode of departed spirits (corresponding to the Greek Hades), translated in the KJV “grave,” “pit,” and “hell,” depending on the context'
  - where: 'section “A grave where no one praises”'
    claim: '“Grave” in Psalm 6:5 and 30:3 is Sheol (H7585)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בִּ֝/שְׁא֗וֹל'
  - where: 'section “The price no one can pay”'
    claim: '“Corruption” in 49:9 is the Hebrew word shachath (H7845), as in 16:10'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הַ/שָּֽׁחַת'
  - where: 'section “The price no one can pay”'
    claim: '“Corruption” in 16:10 is the same word (H7845)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שָֽׁחַת'
  - where: 'section “Two shepherds”'
    claim: '“Feed” in 49:14 is the verb ra‘ah (H7462)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יִ֫רְעֵ֥/ם'
  - where: 'section “Two shepherds”'
    claim: '“My shepherd” in 23:1 is a form of the same verb (H7462)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'רֹ֝עִ֗'
  - where: 'section “Two shepherds”'
    claim: 'One older reading contrasts Death with the good Shepherd of Psalm 23'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/49.htm'
    quote: 'Not the good Shepherd (Psalm 23:1), whose pasture is the land of the living, but Death, into whose power they have fallen irrecoverably, shall pasture them.'
  - where: 'section “Two shepherds”'
    claim: 'Connection made by this page: Psalm 49:14 (death feeds the sheep) set beside Psalm 23:4 (the sheep of the LORD fear no evil in death’s shadow), on the shepherd verb shared with 23:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/23?lang=eng'
    quote: 'Yea, though I walk through the valley of the shadow of death, I will fear no evil: for thou art with me'
  - where: 'section “Two shepherds”'
    claim: 'The “valley of the shadow of death” can mean darkness or gloom, representing times of distress or danger'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'The Hebrew word translated as “shadow of death” can also mean “darkness” or “gloom.” The “valley of the shadow of death” represents times of distress or danger.'
  - where: 'section “But God”'
    claim: '“Redeem” in 49:15 is the verb of 49:7 (H6299)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יִפְדֶּ֣ה'
  - where: 'section “But God”'
    claim: '“Receive” in 49:15 is laqach (H3947)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יִקָּחֵ֣/נִי'
  - where: 'section “But God”'
    claim: '“Receive” in 73:24 is the same verb (H3947)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תִּקָּחֵֽ/נִי'
  - where: 'section “But God”'
    claim: 'Hosea 13:14 has the verb “ransom” (H6299) beside “from the hand of Sheol”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Hos.xml'
    quote: 'אֶפְדֵּ֔/ם'
  - where: 'section “But God”'
    claim: 'Hosea 13:14 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/13?lang=eng'
    quote: 'I will ransom them from the power of the grave; I will redeem them from death'
  - where: 'section “The one who was not left, and the ransom”'
    claim: 'Peter on David and Psalm 16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/2?lang=eng'
    quote: 'he seeing this before spake of the resurrection of Christ, that his soul was not left in hell, neither his flesh did see corruption.'
  - where: 'section “The one who was not left, and the ransom”'
    claim: 'Connection made by this page: Psalm 49:7 (“give to God a ransom”) set beside Matthew 20:28 (“a ransom for many”), on the shared English word'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/20?lang=eng'
    quote: 'Even as the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many.'
  - where: 'section “The one who was not left, and the ransom”'
    claim: 'To redeem is to deliver, purchase or ransom; the Atonement redeems all from physical death'
    key: gs-redeem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/redeem-redeemed-redemption?lang=eng'
    quote: 'To deliver, to purchase, or to ransom, such as to free a person from bondage by payment.'
  - where: 'section “The one who was not left, and the ransom”'
    claim: 'The Atonement redeems all mankind from physical death'
    key: gs-redeem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/redeem-redeemed-redemption?lang=eng'
    quote: 'Jesus’ Atonement redeems all mankind from physical death.'
  - where: 'section “The one who was not left, and the ransom”'
    claim: 'Curtis reads Psalm 49:15 as the Atonement, not bought by corruptible things'
    key: curtis-redemption
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2011/10/redemption?lang=eng'
    quote: 'this redemption does not come by “corruptible things, as silver and gold” (1 Peter 1:18)'
  - where: 'section “The one who was not left, and the ransom”'
    claim: 'Connection made by this page: Psalm 49:14 (death shepherds the sheep) set beside Hebrews 13:20 (“that great shepherd of the sheep”)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/13?lang=eng'
    quote: 'that brought again from the dead our Lord Jesus, that great shepherd of the sheep'
  - where: 'section “The one who was not left, and the ransom”'
    claim: 'D&C 128:22 calls on the dead to praise the King Immanuel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/128?lang=eng'
    quote: 'Let the dead speak forth anthems of eternal praise to the King Immanuel'
  - where: 'section “The one who was not left, and the ransom”'
    claim: 'Connection made by this page: Psalm 115:17 (“The dead praise not the LORD”) set beside D&C 138:23 (the dead acknowledge the Son of God as Redeemer)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/138?lang=eng'
    quote: 'acknowledged the Son of God as their Redeemer and Deliverer from death and the chains of hell'
  - where: 'section “The one who was not left, and the ransom”'
    claim: 'The Church’s footnote on “dead” in Psalm 115:17 points to D&C 128:22'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/115?lang=eng'
    quote: 'D&C 128:22.'
  - where: 'section “The one who was not left, and the ransom”'
    claim: 'Curtis quotes Psalm 49:15 and says its redemption is the Atonement'
    key: curtis-redemption
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2011/10/redemption?lang=eng'
    quote: 'The redemption referred to in these three scriptures, of course, is the Atonement of Jesus Christ.'
  - where: 'section “The one who was not left, and the ransom”'
    claim: '“Corruption” in Acts 2:31 renders the word of Psalm 16:10, which Psalm 49:9 also has (H7845)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הַ/שָּֽׁחַת'
