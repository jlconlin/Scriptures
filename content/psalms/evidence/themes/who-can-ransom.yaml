page: who-can-ransom
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'Ps. 49:6 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/49?lang=eng'
    quote: 'They that trust in their wealth, and boast themselves in the multitude of their riches;'
  - where: 'opening'
    claim: 'Ps. 49:7–9 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/49?lang=eng'
    quote: 'None of them can by any means redeem his brother, nor give to God a ransom for him:'
  - where: 'opening'
    claim: 'Ps. 49:8 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/49?lang=eng'
    quote: '(For the redemption of their soul is precious, and it ceaseth for ever:)'
  - where: 'opening'
    claim: 'Ps. 49:9 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/49?lang=eng'
    quote: 'That he should still live for ever, and not see corruption.'
  - where: 'opening'
    claim: 'Ps. 49:15 as quoted (also the table)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/49?lang=eng'
    quote: 'But God will redeem my soul from the power of the grave: for he shall receive me.'
  - where: 'opening'
    claim: 'The language of Ps. 49:7–8 is borrowed from the law of Ex. 21:30, the ransom of a life forfeited through a goring ox'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/49.htm'
    quote: 'The language of this verse and the next is borrowed from the ancient law in Exodus 21:30'
  - where: 'opening'
    claim: 'Keil and Delitzsch explain the ransom of Ps. 49:7 by Ex. 21:30'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/49.htm'
    quote: 'Exodus 21:30 and frequently) can be given to God'
  - where: 'opening'
    claim: 'pādâ: redemption for an assessed price, the law of the firstborn (Ex. 13:13, 15; 34:20; Num. 18:15–17)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6299.htm'
    quote: '1 for an assessed price Exodus 13:13,15; Exodus 34:20 (J), Leviticus 27:27; Numbers 3:46,48,49,51; Numbers 18:15,16,17 (P).'
  - where: 'opening'
    claim: 'kōper at Ex. 30:12: the half shekel paid by each male counted at the census, to the LORD'
    key: bdb
    url: 'https://biblehub.com/hebrew/3724.htm'
    quote: 'is a half shekel of the sanctuary paid by each male above twenty years at the census in order that there might be no plague upon them. It was offered to Yahweh'
  - where: 'opening'
    claim: 'Ex. 30:12 as quoted (“for his soul unto the LORD”)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: 'then shall they give every man a ransom for his soul unto the Lord'
  - where: 'opening'
    claim: 'The Church’s chapter heading of Psalm 49 sets man’s inability against God’s redemption'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/49?lang=eng'
    quote: 'Men cannot be ransomed or redeemed by wealth—God alone can redeem a soul from the grave'
  - where: 'opening'
    claim: '1 Pet. 1:18–19 as quoted (also the table)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/1?lang=eng'
    quote: 'But with the precious blood of Christ, as of a lamb without blemish and without spot:'
  - where: 'opening'
    claim: 'Table: Ps. 6:5 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/6?lang=eng'
    quote: 'in the grave who shall give thee thanks?'
  - where: 'opening'
    claim: 'Table: Ps. 49:14 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/49?lang=eng'
    quote: 'Like sheep they are laid in the grave; death shall feed on them'
  - where: 'opening'
    claim: 'Table: Ps. 16:10 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/16?lang=eng'
    quote: 'For thou wilt not leave my soul in hell'
  - where: 'opening'
    claim: 'Table: Acts 2:31 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/2?lang=eng'
    quote: 'that his soul was not left in hell, neither his flesh did see corruption.'
  - where: 'opening'
    claim: 'Curtis: the price having been paid by our Redeemer'
    key: curtis-redemption
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2011/10/redemption?lang=eng'
    quote: 'the price having been paid by our Redeemer'
  # ---------- section “In the grave who shall give thee thanks?” ----------
  - where: 'section “In the grave who shall give thee thanks?”'
    claim: 'Ps. 6:5 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/6?lang=eng'
    quote: 'For in death there is no remembrance of thee: in the grave who shall give thee thanks?'
  - where: 'section “In the grave who shall give thee thanks?”'
    claim: 'Ps. 115:17 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/115?lang=eng'
    quote: 'The dead praise not the Lord, neither any that go down into silence.'
  - where: 'section “In the grave who shall give thee thanks?”'
    claim: '“The grave” in Ps. 6:5 is sheol (H7585)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בִּ֝/שְׁא֗וֹל'
  - where: 'section “In the grave who shall give thee thanks?”'
    claim: 'Sheol is the Hebrew name for the abode of departed spirits'
    key: bd-sheol
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sheol?lang=eng'
    quote: 'The Hebrew name for the abode of departed spirits'
  - where: 'section “In the grave who shall give thee thanks?”'
    claim: 'Sheol is where all people go after death and was viewed as inescapable'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'This refers to the place where all people go after death, regardless of their moral character. It is also sometimes translated as “grave” or “pit.” Sheol was generally viewed as inescapable.'
  - where: 'section “In the grave who shall give thee thanks?”'
    claim: 'Ps. 30:3 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/30?lang=eng'
    quote: 'thou hast kept me alive, that I should not go down to the pit.'
  - where: 'section “In the grave who shall give thee thanks?”'
    claim: 'Ps. 89:48 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/89?lang=eng'
    quote: 'What man is he that liveth, and shall not see death? shall he deliver his soul from the hand of the grave?'
  - where: 'section “In the grave who shall give thee thanks?”'
    claim: 'The Church’s footnote 49:9a (“live”) sends to Ps. 89:48 (footnotes.mjs psalms 49)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/49?lang=eng'
    quote: 'That he should still live for ever, and not see corruption.'
  - where: 'section “In the grave who shall give thee thanks?”'
    claim: '“The power of the grave” in Ps. 49:15 is miyyad šĕʾôl, “from the hand of Sheol”, the phrase of Ps. 89:48 (hebrew.mjs psalms 49:15; 89:48)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מִֽ/יַּד'
  - where: 'section “In the grave who shall give thee thanks?”'
    claim: 'Ps. 89:48 miyyad šĕʾôl'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מִ/יַּד'
  # ---------- section “Nor give to God a ransom for him” ----------
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'The rich make a god of their wealth, which cannot deliver from death'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/49.htm'
    quote: 'These men make a god of their wealth. They trust in it and glory in it, as the godly man trusts in Jehovah and glories in Him (Psalm 32:10; Psalm 34:2). But how powerless it is! It cannot deliver anyone from death.'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'Ex. 21:30: an owner whose ox was known to gore forfeited his life and might pay a ransom instead'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/49.htm'
    quote: 'If a man’s neglect to keep a dangerous ox under proper control had been the cause of another man’s death, his life was forfeit. But he might redeem his life by paying a ransom'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'Ex. 21:30 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/21?lang=eng'
    quote: 'If there be laid on him a sum of money, then he shall give for the ransom of his life whatsoever is laid upon him.'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'kōper is “the price of a life, ransom”; at Ex. 21:30 it stands parallel to pidyôn napšô'
    key: bdb
    url: 'https://biblehub.com/hebrew/3724.htm'
    quote: 'noun masculine the price of a life, ransom (ποινή, wergild)'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'Ex. 21:30 has kōper and pidyôn (H6306b) napšô'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'פִּדְיֹ֣ן'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'Ps. 49:8 has pidyôn napšām, “the redemption of their soul” (hebrew.mjs psalms 49:8)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'פִּדְי֥וֹן'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'The psalm’s language is borrowed from Ex. 21:30, where ransom and redemption of life occur together'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/49.htm'
    quote: 'The language of this verse and the next is borrowed from the ancient law in Exodus 21:30, where the words ransom and redemption of life (or soul) occur together'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'kōper (H3724) stands once in Psalms, at 49:7 (occurrences.mjs psalms --hebrew 3724: 1 occurrence in 1 verse)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'כָּפְרֽ/וֹ'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'pādâ: first sense, redemption for an assessed price, with the law of the firstborn'
    key: bdb
    url: 'https://biblehub.com/hebrew/6299.htm'
    quote: '1 for an assessed price Exodus 13:13,15; Exodus 34:20 (J), Leviticus 27:27; Numbers 3:46,48,49,51; Numbers 18:15,16,17 (P).'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'Ex. 13:2 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/13?lang=eng'
    quote: 'both of man and of beast: it is mine.'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'Ex. 13:13 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/13?lang=eng'
    quote: 'and all the firstborn of man among thy children shalt thou redeem.'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'Ex. 34:20 repeats the law of redeeming the firstborn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'All the firstborn of thy sons thou shalt redeem.'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'Num. 18:16 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/18?lang=eng'
    quote: 'for the money of five shekels, after the shekel of the sanctuary, which is twenty gerahs.'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'Ex. 30:12 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: 'When thou takest the sum of the children of Israel after their number, then shall they give every man a ransom for his soul unto the Lord, when thou numberest them; that there be no plague among them'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'The census ransom of Ex. 30:12 was half a shekel paid by each male counted'
    key: bdb
    url: 'https://biblehub.com/hebrew/3724.htm'
    quote: 'is a half shekel of the sanctuary paid by each male above twenty years at the census in order that there might be no plague upon them.'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'Ex. 30:15 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: 'The rich shall not give more, and the poor shall not give less than half a shekel'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'Num. 35:31: the law takes no ransom for a murderer’s life (the clause linking to Between the Dead and the Living)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/35?lang=eng'
    quote: 'Moreover ye shall take no satisfaction for the life of a murderer'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'The lexicon lists the Qal infinitive absolute of pādâ at Num. 18:15 and Ps. 49:8 (KJV 49:7) only'
    key: bdb
    url: 'https://biblehub.com/hebrew/6299.htm'
    quote: 'Infinitive absolute מָּדֹה Numbers 18:15; Psalm 49:8'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'Ps. 49:7 pādōh yipdeh: infinitive absolute (HVqa) with the imperfect (hebrew.mjs psalms 49:7)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'פָדֹ֣ה'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'Num. 18:15 pādōh tipdeh, “shalt thou surely redeem”: infinitive absolute (HVqa) with the imperfect (hebrew.mjs numbers 18:15)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'פָּדֹ֣ה'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'Num. 18:15 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/18?lang=eng'
    quote: 'nevertheless the firstborn of man shalt thou surely redeem'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'Ex. 30:12 has nātan “give” (וְ/נָ֨תְנ֜וּ), ʾîš “man” (אִ֣ישׁ) and kōper (כֹּ֧פֶר) to the LORD (hebrew.mjs exodus 30:12)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'כֹּ֧פֶר'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'Ps. 49:7 has ʾîš “man” (אִ֑ישׁ), nātan “give” (יִתֵּ֖ן) and kōper (כָּפְרֽ/וֹ) to God (hebrew.mjs psalms 49:7)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יִתֵּ֖ן'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'Connection made by this page: Ps. 49:7 stands in two of the places where the law set a fixed price on Israelite lives, the redemption of the firstborn and the census ransom. Its “by any means redeem” (pādōh yipdeh) is the Qal infinitive with the imperfect, as in the firstborn law (pādōh tipdeh, Num. 18:15), and its “give to God a ransom” has the verb, the “man” and the kōper of Ex. 30:12, given in both to God. So the psalm turns the law’s small, payable prices into a price no man can pay against death. Cambridge and Keil and Delitzsch make the link to Ex. 21:30; none of the commentaries read on 49:7–8 names Ex. 30:12 or the firstborn law, and BDB files 49:7’s kōper with Ex. 21:30, not with the census ransom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: 'then shall they give every man a ransom for his soul unto the Lord'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'ESV renders Ps. 49:8 “the ransom of their life is costly and can never suffice”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Psalm+49%3A7-15&version=ESV'
    quote: 'for (D)the ransom of their life is costly and can never suffice'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'šaḥat in Ps. 49:9 (BDB’s 49:10) is the “pit of Sheol”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7845.htm'
    quote: 'Psalm 16:10 ("" שִׁאוֺל), Psalm 49:10'
  - where: 'section “Nor give to God a ransom for him”'
    claim: 'At Ex. 21:30 the ransom was paid to the relatives of the dead man'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/49.htm'
    quote: 'his life by paying a ransom to the relatives of the deceased person'
  # ---------- section “Death shall feed on them” ----------
  - where: 'section “Death shall feed on them”'
    claim: 'Ps. 49:12 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/49?lang=eng'
    quote: 'Nevertheless man being in honour abideth not: he is like the beasts that perish.'
  - where: 'section “Death shall feed on them”'
    claim: 'Ps. 49:14 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/49?lang=eng'
    quote: 'Like sheep they are laid in the grave; death shall feed on them'
  - where: 'section “Death shall feed on them”'
    claim: 'rāʿâ I: pasture, tend; Ps. 49:15 (KJV 49:14) under its metaphorical use'
    key: bdb
    url: 'https://biblehub.com/hebrew/7462.htm'
    quote: 'metaphor גֹּרֶן וָיֶקֶב לֹא יִרְעֵם Hosea 9:2, but read יֵדָעֵם ᵐ5 We Now GASm; מָוֶת יִרְעֵם Psalm 49:15.'
  - where: 'section “Death shall feed on them”'
    claim: 'Ps. 49:14 yirʿēm and 23:1 rōʿî are the same lemma, H7462b (hebrew.mjs psalms 49:14; 23:1)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יִ֫רְעֵ֥/ם'
  - where: 'section “Death shall feed on them”'
    claim: 'Ps. 23:1 rōʿî “my shepherd”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'רֹ֝עִ֗/י'
  - where: 'section “Death shall feed on them”'
    claim: 'ESV: “death shall be their shepherd”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Psalm+49%3A7-15&version=ESV'
    quote: 'Like sheep they are appointed for Sheol; death shall be their shepherd'
  - where: 'section “Death shall feed on them”'
    claim: 'Sheol is their fold; Keil and Delitzsch set Death the shepherd against the good Shepherd of Ps. 23:1'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/49.htm'
    quote: 'so that they are shut up in it like sheep in their fold'
  - where: 'section “Death shall feed on them”'
    claim: 'Keil and Delitzsch: not the good Shepherd of Ps. 23:1, whose pasture is the land of the living'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/49.htm'
    quote: 'Not the good Shepherd (Psalm 23:1), whose pasture is the land of the living, but Death'
  - where: 'section “Death shall feed on them”'
    claim: 'Ps. 49:20 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/49?lang=eng'
    quote: 'Man that is in honour, and understandeth not, is like the beasts that perish.'
  - where: 'section “Death shall feed on them”'
    claim: 'Keil and Delitzsch on the second refrain: the prospect belongs to the worldly rich man'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/49.htm'
    quote: 'The gloomy prospect of the future does not belong to the rich man as such, but to the worldly and carnally minded rich man.'
  - where: 'section “Death shall feed on them”'
    claim: 'Ps. 49:6 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/49?lang=eng'
    quote: 'They that trust in their wealth'
  # ---------- section “But God will redeem my soul” ----------
  - where: 'section “But God will redeem my soul”'
    claim: 'Ps. 49:15 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/49?lang=eng'
    quote: 'But God will redeem my soul from the power of the grave: for he shall receive me.'
  - where: 'section “But God will redeem my soul”'
    claim: 'Ps. 49:15 yipdeh with ʾĕlōhîm as subject, the same Qal imperfect 3ms as yipdeh ʾîš in 49:7 (hebrew.mjs psalms 49:7; 49:15)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יִפְדֶּ֣ה'
  - where: 'section “But God will redeem my soul”'
    claim: 'BDB files Ps. 49:8 (KJV 49:7) under redemption from violence and death'
    key: bdb
    url: 'https://biblehub.com/hebrew/6299.htm'
    quote: '2 from violence and death 1 Samuel 14:45; Job 6:23; Psalm 49:8.'
  - where: 'section “But God will redeem my soul”'
    claim: 'BDB: sense 3, God subject, with the underlying thought of payment'
    key: bdb
    url: 'https://biblehub.com/hebrew/6299.htm'
    quote: '3 God subject (underlying thought of payment):'
  - where: 'section “But God will redeem my soul”'
    claim: 'BDB lists Ps. 49:16 (KJV 49:15) and Hos. 13:14, “from the hand of Sheol”, under God subject'
    key: bdb
    url: 'https://biblehub.com/hebrew/6299.htm'
    quote: 'מיד שׁאול Psalm 49:16; Hosea 13:14'
  - where: 'section “But God will redeem my soul”'
