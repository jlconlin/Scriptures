page: who-may-enter
claims:
  - where: 'section “Far from the house”'
    claim: 'Psalm 15:1 (“abide… dwell… tabernacle”) has the Hebrew verbs gur and shakan and the noun ohel; gur is the first verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יָג֣וּר'
  - where: 'section “Far from the house”'
    claim: 'Psalm 120:5 has the same verbs and noun (gur “sojourn,” shakan “dwell,” ohel “tents”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'גַ֣רְתִּי'
  - where: 'section “Far from the house”'
    claim: 'Connection made by this page: Psalm 120:5 (“I sojourn in Mesech, … I dwell in the tents of Kedar”) set beside Psalm 15:1 (“who shall abide in thy tabernacle?”), on the three shared Hebrew words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/120?lang=eng'
    quote: 'Woe is me, that I sojourn in Mesech, that I dwell in the tents of Kedar!'
  - where: 'section “Far from the house”'
    claim: 'The songs of degrees are probably so called because Jewish pilgrims sang them on the way up to Jerusalem'
    key: bd-degrees-songs-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/degrees-songs-of?lang=eng'
    quote: 'Fifteen Psalms (120–34), probably so called because they were sung by Jewish pilgrims on their way up to Jerusalem.'
  - where: 'section “Brought near”'
    claim: 'Connection made by this page: Psalm 5:7, 43:3 and 65:3–4 (mercy, led, purged, chosen and brought near) set beside the questions of Psalm 15:1 and 24:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/65?lang=eng'
    quote: 'as for our transgressions, thou shalt purge them away. Blessed is the man whom thou choosest, and causest to approach unto thee'
  - where: 'section “The King at the gates”'
    claim: 'The verb “shall come in” in Psalm 24:7 is the Hebrew verb bo’, as in 118:19'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וְ֝/יָב֗וֹא'
  - where: 'section “The King at the gates”'
    claim: 'Psalm 118:19 “I will go into them” is the same Hebrew verb (bo’)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אָֽבֹא'
  - where: 'section “The King at the gates”'
    claim: 'Connection made by this page: the King’s “shall come in” (Ps. 24:7) set beside the worshipper’s “Open to me the gates… I will go into them” (Ps. 118:19), on the gates and the verb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/118?lang=eng'
    quote: 'Open to me the gates of righteousness: I will go into them, and I will praise the LORD: This gate of the LORD, into which the righteous shall enter.'
  - where: 'section “The King at the gates”'
    claim: 'Joseph Smith’s revision of Psalm 24:10 says the King shall redeem his people and establish them in righteousness'
    key: jst-ps-24
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ps/24?lang=eng'
    quote: 'Even the king of glory shall come unto you; and shall redeem his people, and shall establish them in righteousness.'
  - where: 'section “The King at the gates”'
    claim: 'Connection made by this page: JST Ps. 24:10 “establish them in righteousness” set beside Ps. 24:5 “righteousness from the God of his salvation,” on the shared word'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/24?lang=eng'
    quote: 'He shall receive the blessing from the LORD, and righteousness from the God of his salvation.'
  - where: 'section “The King at the gates”'
    claim: 'The crowds said to Jesus “Blessed is he that cometh in the name of the Lord”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/21?lang=eng'
    quote: 'Blessed is he that cometh in the name of the Lord; Hosanna in the highest.'
  - where: 'section “The forerunner”'
    claim: 'Connection made by this page: Ps. 24:3 “stand in his holy place” set beside Heb. 9:12 “entered in once into the holy place”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'by his own blood he entered in once into the holy place, having obtained eternal redemption for us.'
  - where: 'section “The forerunner”'
    claim: 'The Atonement of Jesus Christ gives us access to God’s presence'
    key: scripture-helps-nt-heb-7-13
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-new-testament/46-hebrews-7-13?lang=eng'
    quote: 'Just as the veil of the temple gave the high priest access to the Holy of Holies, the Atonement of Jesus Christ gives us access to God’s presence.'
  - where: 'section “The forerunner”'
    claim: 'Hebrews 10:19–22: boldness to enter by the blood of Jesus, a true heart, bodies washed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/10?lang=eng'
    quote: 'Let us draw near with a true heart in full assurance of faith, having our hearts sprinkled from an evil conscience, and our bodies washed with pure water.'
  - where: 'section “The forerunner”'
    claim: 'Elder Bednar, on Psalm 24:3–4: good works can never produce clean hands and a pure heart; the Atonement provides a cleansing and redeeming power'
    key: bednar-clean-hands
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2007/10/clean-hands-and-a-pure-heart?lang=eng'
    quote: 'All of our worthy desires and good works, as necessary as they are, can never produce clean hands and a pure heart. It is the Atonement of Jesus Christ that provides both a cleansing and redeeming power'
  - where: 'section “The forerunner”'
    claim: 'Nephi joins “pure hearts and clean hands” to belief in Christ and worship of the Father in his name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/25?lang=eng'
    quote: 'and worship the Father in his name, with pure hearts and clean hands'
  - where: 'section “The forerunner”'
    claim: '2 Nephi 25:16 is almost certainly a quote from Psalm 24'
    key: sc-knowhy-51
    url: 'https://scripturecentral.org/knowhy/why-does-nephi-quote-a-temple-psalm-while-commenting-on-isaiah'
    quote: '2 Nephi 25:16 contains a distinctive phrase, “with pure hearts and clean hands,” which is almost certainly a quote from Psalm 24'
