page: what-is-man
claims:
  - where: 'section “The question, and the first answer”'
    claim: 'The Church’s footnote gives the Hebrew of Ps. 8:5 “lower” as “less than the gods”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/8?lang=eng'
    quote: 'HEB less than the gods.'
  - where: 'section “The question, and the first answer”'
    claim: 'The Hebrew word translated “angels” in Ps. 8:5 is Elohim'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'However, the Hebrew word translated as “angels” is Elohim, which is a name for God.'
  - where: 'section “The question, and the first answer”'
    claim: 'Sperry traces “angels” to the Septuagint'
    key: sperry-psalm-8
    url: 'https://www.churchofjesuschrist.org/study/ensign/1972/02/a-note-on-psalm-8-4-6?lang=eng'
    quote: 'The translation “angels” seems first to have appeared in the Septuagint (Greek) Version of the Psalms'
  - where: 'section “The question, and the first answer”'
    claim: 'Scripture Helps joins Ps. 8:3–5 to being children of God, quoting the Family Proclamation'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'As children of God, we have the potential to become like Him.'
  - where: 'section “The question, and the first answer”'
    claim: 'The Family Proclamation: all human beings are created in the image of God, each with a divine nature and destiny'
    key: family-proclamation
    url: 'https://www.churchofjesuschrist.org/study/scriptures/the-family-a-proclamation-to-the-world/the-family-a-proclamation-to-the-world?lang=eng'
    quote: 'All human beings—male and female—are created in the image of God. Each is a beloved spirit son or daughter of heavenly parents, and, as such, each has a divine nature and destiny.'
  - where: 'section “The question again”'
    claim: 'Ps. 144:3 has the two Hebrew words for man of Ps. 8:4 (enosh, H582, and adam, H120) in reverse order'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אָ֭דָם'
  - where: 'section “The question again”'
    claim: 'Ps. 144:3 has enosh (H582) after ben'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֱ֝נ֗וֹשׁ'
  - where: 'section “The question again”'
    claim: 'Ps. 8:4 has enosh (H582) first, then ben adam'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֱנ֥וֹשׁ'
  - where: 'section “The question again”'
    claim: 'Delitzsch reads Ps. 144:3 as “a variation of Psalm 8:5” (Hebrew numbering; KJV 8:4)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/144.htm'
    quote: 'It is evident that Psalm 144:3 is a variation of Psalm 8:5 with the use of other verbs.'
  - where: 'section “The question again”'
    claim: 'The Church’s footnote at Ps. 90:3 gives the Hebrew as “returnest man to dust”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/90?lang=eng'
    quote: 'HEB returnest man to dust.'
  - where: 'section “The question again”'
    claim: 'Connection made by this page: the psalms are read in the order 8, 144, 90, 103: Psalm 8 asks “What is man” and answers with glory; Psalm 144 asks again and answers “vanity”; Psalms 90 and 103 speak of man as dust and of the Lord’s pity and mercy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/144?lang=eng'
    quote: 'LORD, what is man, that thou takest knowledge of him! or the son of man, that thou makest account of him!'
  - where: 'section “The question again”'
    claim: 'Uchtdorf sets “man is nothing” beside God’s work and glory to save and exalt mankind'
    key: uchtdorf-you-matter-2011
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2011/10/you-matter-to-him?lang=eng'
    quote: 'This is a paradox of man: compared to God, man is nothing; yet we are everything to God.'
  - where: 'section “The question again”'
    claim: 'God’s work and glory is to save and exalt mankind'
    key: uchtdorf-you-matter-2011
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2011/10/you-matter-to-him?lang=eng'
    quote: 'His work and glory—the purpose for this magnificent universe—is to save and exalt mankind.'
  - where: 'section “We see Jesus”'
    claim: 'The New Testament Student Manual reads Ps. 8:4–6 in Heb. 2:9 as a messianic prophecy of Christ’s condescension; Christ came to earth to experience mortality'
    key: nt-manual-hebrews-1-6
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/hebrews/chapter-48-hebrews-1-6?lang=eng'
    quote: 'Paul drew upon a messianic prophecy from Psalm 8:4–6 when he stated in Hebrews 2:9 that Jesus “was made a little lower than the angels.” Christ condescended from His premortal throne and came to earth so that He could experience mortality with its physical restrictions'
  - where: 'section “We see Jesus”'
    claim: 'Bowen: Hebrews reads Psalm 8 of Jesus; the psalm’s original generic reading applies to the audience, the many sons and daughters'
    key: bowen-brethren-hebrews-2
    url: 'https://rsc.byu.edu/household-god/he-not-ashamed-call-them-brethren'
    quote: 'Although Hebrews reads Psalm 8 Christologically to describe the process of Jesus’s enthronement, the original reading of the psalm—the more generic anthropological reading—applies to the audience'

  - where: 'section “The question, and the first answer”'
    claim: 'Larsen sets Ps. 8:6 beside God’s declaration in the Creation, Gen. 1:26'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Compare this with God’s own declaration in the Creation: “God said, Let us make man in our image, after our likeness: and let them have dominion over the fish of the sea” (Genesis 1:26).'
  - where: 'section “Many sons unto glory”'
    claim: 'Bowen: Hebrews’ message includes Jesus’ solidarity with humankind from his sibling relationship'
    key: bowen-brethren-hebrews-2
    url: 'https://rsc.byu.edu/household-god/he-not-ashamed-call-them-brethren'
    quote: 'A key component of the message of Hebrews about Jesus as divine Son and atoning High Priest is his solidarity with humankind that grows out of his sibling relationship with them.'
