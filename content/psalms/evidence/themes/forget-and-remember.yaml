page: forget-and-remember
claims:
  - where: opening
    claim: 'Connection made by this page: Psalms 78 and 106 both say the people forgot and God remembered (Ps. 78:11 “forgat his works”, Ps. 106:45 “he remembered for them his covenant”)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/106?lang=eng'
    quote: 'And he remembered for them his covenant, and repented according to the multitude of his mercies.'
  - where: 'section “Retold, so as not to forget”'
    claim: 'Psalm 105 has been read as a historical credo and a covenant text'
    key: ricks-psalm-105
    url: 'https://journal.interpreterfoundation.org/psalm-105-chiasmus-credo-covenant-and-temple/'
    quote: 'Psalm 105 displays many features that may be found in the rich ancient Israelite literary and historical tradition, among them chiasmus and the historical credo. But covenant (and, by implication, the temple), also a part of Psalm 105'
  - where: 'section “Retold, so as not to forget”'
    claim: 'Come, Follow Me reads Psalm 78:6–7 together with the sacrament and asks how it helps us “always remember”'
    key: cfm-ot-2026-35
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/35?lang=eng'
    quote: 'As you read Psalms 77:11; 78:6–7 together, you could share with each other how you try to “remember the works of the Lord” (Psalm 77:11), including His works in your life. How does the sacrament help us “always remember”? (Moroni 4:3; 5:2).'
  - where: 'section “They forgot”'
    claim: 'The people’s forgetting in Ps. 78:7 is shakach (H7911)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יִ֭שְׁכְּחוּ'
  - where: 'section “They forgot”'
    claim: 'The same verb in Ps. 78:11'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וַ/יִּשְׁכְּח֥וּ'
  - where: 'section “They forgot”'
    claim: 'The same verb in Ps. 106:13'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שָׁכְח֣וּ'
  - where: 'section “They forgot”'
    claim: 'The same verb in Ps. 106:21'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שָׁ֭כְחוּ'
  - where: 'section “They forgot”'
    claim: 'Biblical “forgot” has the nuance “to ignore” or “to take lightly”, not an accidental lapse'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'The biblical term, on the other hand, has the nuance of “to ignore” or “to take lightly.”'
  - where: 'section “They forgot”'
    claim: 'Moses warns Israel not to forget the Lord when the heart is lifted up (Deut. 8:14)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/8?lang=eng'
    quote: 'Then thine heart be lifted up, and thou forget the Lord thy God, which brought thee forth out of the land of Egypt, from the house of bondage;'
  - where: 'section “They forgot”'
    claim: 'President Eyring: with blessings comes the temptation to forget their source (he cites no psalm)'
    key: eyring-remember
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2007/10/o-remember-remember?lang=eng'
    quote: 'But with those blessings comes the temptation to forget their source.'
  - where: 'section “Harden not your heart”'
    claim: 'The Church’s footnote on “in” (Ps. 95:8) reads “at Meribah” in the Hebrew'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/95?lang=eng'
    quote: '“in”: HEB at Meribah.'
  - where: 'section “Harden not your heart”'
    claim: 'Hebrews 3 quotes Psalm 95:7 as the Holy Ghost’s words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/3?lang=eng'
    quote: 'Wherefore (as the Holy Ghost saith, To day if ye will hear his voice,'
  - where: 'section “Harden not your heart”'
    claim: 'Hebrews applies it to brethren (3:12)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/3?lang=eng'
    quote: 'Take heed, brethren, lest there be in any of you an evil heart of unbelief, in departing from the living God.'
  - where: 'section “Harden not your heart”'
    claim: 'D&C 84:24 defines the rest the Lord swore they would not enter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'swore that they should not enter into his rest while in the wilderness, which rest is the fulness of his glory.'
  - where: 'section “Harden not your heart”'
    claim: 'Jacob 1:7 and Hebrews 3:8 both draw on Psalm 95:8'
    key: sc-knowhy-533
    url: 'https://scripturecentral.org/knowhy/why-new-testament-words-and-phrases-are-in-the-book-of-mormon-part-5-how-often-were'
    quote: 'it is clear that the source of both passages is Psalm 95:8'
  - where: 'section “God remembered”'
    claim: 'The Church’s footnote at Ps. 105:8 “covenant” is Ex. 2:24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/105?lang=eng'
    quote: '8a “covenant”: Ex. 2:24.'
  - where: 'section “God remembered”'
    claim: 'Ex. 2:24: God remembered his covenant with Abraham, Isaac and Jacob'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/2?lang=eng'
    quote: 'And God heard their groaning, and God remembered his covenant with Abraham, with Isaac, and with Jacob.'
  - where: 'section “God remembered”'
    claim: 'Connection made by this page: Ps. 106:7 (the fathers “remembered not the multitude of thy mercies”) set beside Ps. 106:45 (God “remembered… according to the multitude of his mercies”), on the shared words: the mercies the fathers did not remember are the measure by which God remembered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/106?lang=eng'
    quote: 'they remembered not the multitude of thy mercies'
  - where: 'section “God remembered”'
    claim: '“Multitude” in Ps. 106:7 is rov (H7230)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'רֹ֣ב'
  - where: 'section “God remembered”'
    claim: '“According to the multitude” in Ps. 106:45 is the same noun (H7230)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'כְּ/רֹ֣ב'
  - where: 'section “God remembered”'
    claim: '“Remembered not” in Ps. 106:7 is zakar (H2142)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'זָ֭כְרוּ'
  - where: 'section “God remembered”'
    claim: '“He remembered” in Ps. 106:45 is the same verb (H2142)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וַ/יִּזְכֹּ֣ר'
  - where: 'section “God remembered”'
    claim: '“Mercies” in Ps. 106:7 is from hesed (H2617)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חֲסָדֶ֑י/ךָ'
  - where: 'section “God remembered”'
    claim: '“Mercies” in Ps. 106:45 is from hesed (H2617)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חסד/ו'
  - where: 'section “God remembered”'
    claim: 'Hesed is often used in the Old Testament of God’s covenantal love'
    key: scripture-helps-ps-102
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/34-psalms-102-103-110-116-119-127-128-135-139-146-150?lang=eng'
    quote: 'The Hebrew word translated as “mercy” in Psalm 103 is hesed, which is often used in the Old Testament in reference to God’s covenantal love.'
  - where: 'section “Gather us, and the gathered”'
    claim: 'The Psalter is in five books, each ended by a doxology (including Ps. 106:48), so Psalm 107 begins the fifth'
    key: ot-manual-psalms
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/the-psalms-songs-from-the-heart-of-israel?lang=eng'
    quote: 'Psalms 1 through 41, 42 through 72, 73 through 89, 90 through 106, and 107 through 150. At the end of each division, the break is marked with a doxology, or formal declaration of God’s power and glory (see Psalms 41:13; 72:19; 89:52; 106:48).'
  - where: 'section “Gather us, and the gathered”'
    claim: '“Gather” in Ps. 106:47 is qabats (H6908)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וְ/קַבְּצֵ/נוּ֮'
  - where: 'section “Gather us, and the gathered”'
    claim: '“Gathered” in Ps. 107:3 is the same verb (H6908)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'קִ֫בְּצָ֥/ם'
  - where: 'section “Gather us, and the gathered”'
    claim: 'Delitzsch: thanks are given in 107:3 for what was desired in 106:47'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/107.htm'
    quote: 'Thanks are here given in Psalm 107:3 for what was there desired in v. 47.'
  - where: 'section “Gather us, and the gathered”'
    claim: 'Ammon’s words in Alma 26:6–8 likely borrow from Psalms 106–107'
    key: sc-knowhy-133
    url: 'https://scripturecentral.org/knowhy/why-did-ammon-borrow-so-much-from-tradition-in-alma-26'
    quote: 'Much of this language likely borrows from scriptural sources such as Psalms 106–107.'
  - where: 'section “The Rock, the rest, and remembering Him”'
    claim: 'A study of Psalm 105 as a covenant text reads the sacrament prayer as a covenant renewal, with “always remember him” among its terms'
    key: ricks-psalm-105
    url: 'https://journal.interpreterfoundation.org/psalm-105-chiasmus-credo-covenant-and-temple/'
    quote: 'and always remember him (Terms of the Covenant/Review of God’s Relations)'
