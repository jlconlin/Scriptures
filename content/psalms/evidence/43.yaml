chapter: 43
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'Psalm 43 has no title in the Church’s edition; the page opens with the chapter heading and verse 1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/43?lang=eng'
    quote: 'Judge me, O God, and plead my cause against an ungodly nation'
  - where: setting
    claim: 'In Psalm 42 the singer is in the land of Jordan and of the Hermonites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/42?lang=eng'
    quote: 'therefore will I remember thee from the land of Jordan, and of the Hermonites, from the hill Mizar.'
  - where: setting
    claim: 'In Psalm 42 he remembers going to the house of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/42?lang=eng'
    quote: 'I went with them to the house of God, with the voice of joy and praise'
  - where: setting
    claim: 'In Psalm 42 he is taunted daily with “Where is thy God?”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/42?lang=eng'
    quote: 'while they say daily unto me, Where is thy God?'
  - where: setting
    claim: 'Psalm 42’s title names the sons of Korah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/42?lang=eng'
    quote: 'for the sons of Korah'

  # ---------- thread ----------
  - where: thread
    claim: 'One older reading: the two psalms are one poem in three parts, and only the third reaches confident prayer'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/42.htm'
    quote: 'And it is not until the third part (Psalm 43:1-5) that complaint, resignation, and hope are perfected by the language of confident prayer which supervenes.'
  - where: thread
    claim: 'The same reading counts three parts, each complaint overcome by the refrain'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/42.htm'
    quote: 'The one Psalm consists of three parts: thrice his pain breaks forth into complaint'
  - where: thread
    claim: 'In Psalm 42 the house of God is remembered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/42?lang=eng'
    quote: 'When I remember these things, I pour out my soul in me: for I had gone with the multitude'
  - where: thread
    claim: 'The verb of verse 2 means reject (so “seems to have rejected him”)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2186.htm'
    quote: 'elsewhere God rejects people Psalm 43:2'

  # ---------- sections ----------
  - where: section 1 plain
    claim: '“Judge me” is “Vindicate me,” and “plead my cause” is to defend a case'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2043&version=NRSVUE'
    quote: 'Vindicate me, O God, and defend my cause'
  - where: section 1 plain
    claim: '“Ungodly” is “not hasid,” the adjective of the active practice of hesed'
    key: bdb
    url: 'https://biblehub.com/hebrew/2623.htm'
    quote: 'a nation, not pious, = ungodly Psalm 43:1'
  - where: section 1 plain
    claim: 'The singular “man” can be rendered as a plural class'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2043&version=NRSVUE'
    quote: 'from those who are deceitful and unjust'
  - where: section 1 plain
    claim: '“Cast off” is to reject'
    key: bdb
    url: 'https://biblehub.com/hebrew/2186.htm'
    quote: 'verb reject, spurn'
  - where: section 2 plain
    claim: '“Tabernacles” can be rendered as God’s dwelling'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2043&version=NRSVUE'
    quote: 'and to your dwelling.'
  - where: section 3 plain
    claim: '“Cast down” is from a verb for bowing'
    key: bdb
    url: 'https://biblehub.com/hebrew/7817.htm'
    quote: 'verb bow, be bowed down,'
  - where: section 3 plain
    claim: '“Disquieted” is from a verb meaning to murmur, of the soul in discouragement'
    key: bdb
    url: 'https://biblehub.com/hebrew/1993.htm'
    quote: 'murmur, figurative of soul'
  - where: section 3 plain
    claim: '“Health of my countenance” is the salvation of my face, that is, person'
    key: bdb
    url: 'https://biblehub.com/hebrew/3444.htm'
    quote: 'the salvation of my face (person;'

  # ---------- note 43:1 structure ----------
  - where: 'note 43:1 “Psalms 42 and 43 as one poem”'
    claim: 'Psalm 42:11 has the refrain in the words of Psalm 43:5 (with “hope thou”)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/42?lang=eng'
    quote: 'Why art thou cast down, O my soul? and why art thou disquieted within me? hope thou in God: for I shall yet praise him, who is the health of my countenance, and my God.'
  - where: 'note 43:1 “Psalms 42 and 43 as one poem”'
    claim: 'Psalm 42:9 has the second half of 43:2 unchanged in the King James'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/42?lang=eng'
    quote: 'why go I mourning because of the oppression of the enemy?'
  - where: 'note 43:1 “Psalms 42 and 43 as one poem”'
    claim: 'Psalm 43 has no heading in the Church’s edition, and Psalm 42 has one'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/42?lang=eng'
    quote: 'for the sons of Korah'
  - where: 'note 43:1 “Psalms 42 and 43 as one poem”'
    claim: 'Many Hebrew manuscripts have the two as one psalm'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2042-43&version=NIV'
    quote: 'In many Hebrew manuscripts Psalms 42 and 43 constitute one psalm.'
  - where: 'note 43:1 “Psalms 42 and 43 as one poem”'
    claim: 'The Greek translation heads Psalm 43 “A Psalm of David”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/43.htm'
    quote: 'A Psalm of David. Judge me, o God, and plead my cause, against an ungodly nation'

  # ---------- note 43:1 ungodly ----------
  - where: 'note 43:1 “The word behind ungodly”'
    claim: 'The Hebrew of “ungodly” is the negative with hasid (H2623)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חָסִ֑יד'
  - where: 'note 43:1 “The word behind ungodly”'
    claim: 'Hasid means kind, pious, denoting the active practice of hesed'
    key: bdb
    url: 'https://biblehub.com/hebrew/2623.htm'
    quote: 'adjective masculine kind, pious (so, as denoting active practice of'
  - where: 'note 43:1 “The word behind ungodly”'
    claim: 'The lexicon’s gloss of this phrase'
    key: bdb
    url: 'https://biblehub.com/hebrew/2623.htm'
    quote: 'a nation, not pious, = ungodly Psalm 43:1'
  - where: 'note 43:1 “The word behind ungodly”'
    claim: '“Lovingkindness” in Psalm 42:8 (Hebrew 42:9) is hesed (H2617)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חַסְדּ֗/וֹ'
  - where: 'note 43:1 “The word behind ungodly”'
    claim: 'The King James renders the same noun “mercy” in Psalm 57:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/57?lang=eng'
    quote: 'God shall send forth his mercy and his truth.'
  - where: 'note 43:1 “The word behind ungodly”'
    claim: 'A modern translation has “an ungodly people”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2043&version=NRSVUE'
    quote: 'against an ungodly people;'
  - where: 'note 43:1 “The word behind ungodly”'
    claim: '“Man” is singular in the Hebrew (ish, H376)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מֵ֤/אִישׁ'
  - where: 'note 43:1 “The word behind ungodly”'
    claim: 'The same translation renders the singular as a plural'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2043&version=NRSVUE'
    quote: 'from those who are deceitful and unjust'

  # ---------- note 43:2 ----------
  - where: 'note 43:2 “A harder word than forgotten”'
    claim: 'Psalm 42:9 has “forgotten” and “God my rock”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/42?lang=eng'
    quote: 'I will say unto God my rock, Why hast thou forgotten me?'
  - where: 'note 43:2 “A harder word than forgotten”'
    claim: 'The Hebrew verb of 42:9 (Hebrew 42:10) is forget (H7911); of 43:2, zanach (H2186)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'זְנַ֫חְתָּ֥/נִי'
  - where: 'note 43:2 “A harder word than forgotten”'
    claim: 'Zanach means reject, spurn'
    key: bdb
    url: 'https://biblehub.com/hebrew/2186.htm'
    quote: 'verb reject, spurn'
  - where: 'note 43:2 “A harder word than forgotten”'
    claim: 'The verb is used elsewhere of God rejecting His people'
    key: bdb
    url: 'https://biblehub.com/hebrew/2186.htm'
    quote: 'elsewhere God rejects people Psalm 43:2; Psalm 60:3; Psalm 77:8; Psalm 88:15; Zechariah 10:6'
  - where: 'note 43:2 “A harder word than forgotten”'
    claim: 'A modern translation of “the God of my strength”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2043&version=NRSVUE'
    quote: 'For you are the God in whom I take refuge;'
  - where: 'note 43:3 “Two guides sent from God”'
    claim: 'One older reading calls light and truth two angels of God'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/43.htm'
    quote: 'The poet wishes to be guided by these two angels of God'
  - where: 'note 43:3 “Two guides sent from God”'
    claim: 'Psalm 57:3 (Hebrew 57:4) has the same verb send (H7971) and the same noun truth (H571), with hesed (H2617)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וַ/אֲמִתּֽ/וֹ'
  - where: 'note 43:3 “Two guides sent from God”'
    claim: 'Psalm 43:3 has send (H7971) and truth (H571)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וַ֭/אֲמִתְּ/ךָ'
  - where: 'note 43:3 “Two guides sent from God”'
    claim: 'The King James wording of Psalm 57:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/57?lang=eng'
    quote: 'God shall send forth his mercy and his truth.'
  - where: 'note 43:3 “Two guides sent from God”'
    claim: 'Exodus 15:13 has the verb lead (H5148) and hesed (H2617)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'נָחִ֥יתָ'
  - where: 'note 43:3 “Two guides sent from God”'
    claim: 'Psalm 43:3 has the verb lead (H5148)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יַנְח֑וּ/נִי'
  - where: 'note 43:3 “Two guides sent from God”'
    claim: 'The King James wording of Exodus 15:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'Thou in thy mercy hast led forth the people which thou hast redeemed: thou hast guided them in thy strength unto thy holy habitation.'
  - where: 'note 43:3 “Two guides sent from God”'
    claim: 'The older reading connects verse 3 with Psalm 57:3 (Hebrew 57:4) and Exodus 15:13'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/43.htm'
    quote: 'In connection with Psalm 43:3 one is reminded of Psalm 57:4 and Exodus 15:13'
  - where: 'note 43:3 “Two guides sent from God”'
    claim: 'The older reading: light and truth is equivalent to mercy and truth'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/43.htm'
    quote: '"Light and truth" is equivalent to mercy and truth. What is intended is the light of mercy or loving-kindness which is coupled with the truth of fidelity to the promises'

  # ---------- note 43:3 hill ----------
  - where: 'note 43:3 “Hill, dwelling, altar”'
    claim: '“Tabernacles” is the plural of mishkan (H4908)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מִשְׁכְּנוֹתֶֽי/ךָ'
  - where: 'note 43:3 “Hill, dwelling, altar”'
    claim: 'Mishkan means dwelling-place, tabernacle'
    key: bdb
    url: 'https://biblehub.com/hebrew/4908.htm'
    quote: 'dwelling-place, ''tabernacle'''
  - where: 'note 43:3 “Hill, dwelling, altar”'
    claim: 'The lexicon sets this verse and Psalm 84:1 (Hebrew 84:2) with God’s abode in Zion'
    key: bdb
    url: 'https://biblehub.com/hebrew/4908.htm'
    quote: 'God''s abode in Zion Ezekiel 37:27; Psalm 132:5; Psalm 132:7, compare Psalm 43:3; Psalm 84:2'
  - where: 'note 43:5 “The singer speaks to his own soul”'
    claim: 'The verb means bow, be bowed down, crouch'
    key: bdb
    url: 'https://biblehub.com/hebrew/7817.htm'
    quote: 'verb bow, be bowed down,'
  - where: 'note 43:5 “The singer speaks to his own soul”'
    claim: 'It is used of a mourner’s bowing'
    key: bdb
    url: 'https://biblehub.com/hebrew/7817.htm'
    quote: 'bow, of mourner'
  - where: 'note 43:5 “The singer speaks to his own soul”'
    claim: 'The form here means be cast down, despairing, and is listed only in Psalms 42 and 43, of “my soul”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7817.htm'
    quote: 'be cast down, despairing'
  - where: 'note 43:5 “The singer speaks to his own soul”'
    claim: 'The entry lists that form for Psalm 42:6, 7, 12 and 43:5 (Hebrew numbering) only'
    key: bdb
    url: 'https://biblehub.com/hebrew/7817.htm'
    quote: 'Psalm 42:6; Psalm 42:12; Psalm 43:5 (all with subject'
  - where: 'note 43:5 “The singer speaks to his own soul”'
    claim: 'The verb behind “disquieted” is glossed murmur, growl, roar, be boisterous'
    key: bdb
    url: 'https://biblehub.com/hebrew/1993.htm'
    quote: 'verb murmur, growl, roar, be boisterous'
  - where: 'note 43:5 “The singer speaks to his own soul”'
    claim: 'It is used here of the soul in discouragement'
    key: bdb
    url: 'https://biblehub.com/hebrew/1993.htm'
    quote: 'in discouragement Psalm 42:6; Psalm 42:12; Psalm 43:5'
  - where: 'note 43:5 “The singer speaks to his own soul”'
    claim: 'It is used elsewhere of the roar of waves'
    key: bdb
    url: 'https://biblehub.com/hebrew/1993.htm'
    quote: 'roar, of waves'
  - where: 'note 43:5 “The singer speaks to his own soul”'
    claim: '“Health of my countenance” is the salvation of my face, face standing for the person'
    key: bdb
    url: 'https://biblehub.com/hebrew/3444.htm'
    quote: 'the salvation of my face (person;'
  - where: 'note 43:5 “The singer speaks to his own soul”'
    claim: 'A modern translation of the last line'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2043&version=NRSVUE'
    quote: 'my help and my God.'

  # ---------- note 43:5 christ ----------
  - where: 'note 43:5 “The refrain and the Savior’s words in Gethsemane”'
    claim: 'The Greek word for “very sad” in the refrain is perilypos'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sepd/psalms/43.htm'
    quote: 'ἵνα τί περίλυπος εἶ, ψυχή, καὶ ἵνα τί συνταράσσεις με;'
  - where: 'note 43:5 “The refrain and the Savior’s words in Gethsemane”'
    claim: 'Matthew 26:38 in Greek has perilypos of “my soul”'
    key: greek-nt
    url: 'https://biblehub.com/text/matthew/26-38.htm'
    quote: 'Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου'
  - where: 'note 43:5 “The refrain and the Savior’s words in Gethsemane”'
    claim: 'The King James wording of Matthew 26:38'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'My soul is exceeding sorrowful, even unto death'
  - where: 'note 43:5 “The refrain and the Savior’s words in Gethsemane”'
    claim: 'Psalm 43 is in a published list of psalms with no direct relationship with the New Testament (Shire’s list, as Hilton reports it)'
    key: hilton-psalms-bom
    url: 'https://rsc.byu.edu/ascending-mountain-lord/old-testament-psalms-book-mormon'
    quote: 'The Psalms he lists as having no direct relationship with the New Testament include 25, 43, 54'

  # ---------- christ ----------
  - where: christ
    claim: 'The Greek refrain and Matthew 26:38 share the word perilypos'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/42.htm'
    quote: 'Why art thou thus cast down... (lxx ἵνα τί περίλυπος εἶ, κ. τ. λ., cf. Matthew 26:38; John 12:27)'
  - where: christ
    claim: 'The psalm calls God “my exceeding joy” and asks Him to send light and truth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/43?lang=eng'
    quote: 'Then will I go unto the altar of God, unto God my exceeding joy'

  # ---------- explore / parallels ----------
  - where: explore
    claim: 'Psalm 84 speaks of the Lord’s tabernacles and altars'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/84?lang=eng'
    quote: 'How amiable are thy tabernacles'
  - where: parallels
    claim: 'Exodus 15:13: led in mercy to the holy habitation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'thou hast guided them in thy strength unto thy holy habitation.'
  - where: explore
    claim: 'Psalm 84:3 names the Lord’s altars'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/84?lang=eng'
    quote: 'even thine altars'
