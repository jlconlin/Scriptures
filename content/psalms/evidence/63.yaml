    quote: 'Here, as in Psalm 61:1-8, David gives utterance to his longing for the sanctuary; and in both Psalms he speaks of himself as king'
  - where: 'note 63:11 “The king, and whose name is sworn by”'
    claim: 'Grammatically “him” may be God or the king; Delitzsch decides for God'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/63.htm'
    quote: 'So far as the language is concerned, both references are admissible; but as regards the subject-matter, only the latter.'
  - where: 'note 63:11 “The king, and whose name is sworn by”'
    claim: 'His reason: Israel swears by the LORD’s name only'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/63.htm'
    quote: 'But the Israelite is to swear by the name of Jahve and by no other, Deuteronomy 6:13'
  - where: 'note 63:11 “The king, and whose name is sworn by”'
    claim: 'The Greek leaves “by him” open'
    key: lxx-rahlfs
