chapter: 47
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'The title gives the psalm to the sons of Korah and names no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/47?lang=eng'
    quote: 'To the chief Musician, A Psalm for the sons of Korah.'
  - where: setting
    claim: 'The title gives the psalm to the sons of Korah and names no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/47?lang=eng'
    quote: 'To the chief Musician, A Psalm for the sons of Korah.'
  - where: setting
    claim: 'Psalm 47 is listed among the psalms of praise, which open with a call to gather and praise the Lord'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'These psalms often begin with a command or call to Israel to gather as a community (most importantly, at the temple) and praise the Lord: 8, 19, 29, 33, 47'
  - where: setting
    claim: 'After the call such psalms give the reasons, often the Lord’s reign as king'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'After the call to praise, the hymns describe the power and the mercy of the Lord, often describing what he has done for Israel in the past and emphasizing his role as the creator and his divine reign as king of Israel'
  - where: setting
    claim: 'These psalms are now thought to belong to national festival gatherings (a reconstruction: “now thought”)'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'These psalms, once thought of as synagogue hymns, are now thought to mark times of national festival gatherings'
  - where: setting
    claim: 'One older reading finds the occasion in Jehoshaphat’s victory, a victory without a conflict'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/47.htm'
    quote: 'a victory without a conflict, and consequently all the more manifestly a victory of Jahve'
  - where: setting
    claim: 'The same reading ties the psalm to the return to the temple in 2 Chronicles 20:28'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/47.htm'
    quote: 'an event that was outwardly represented in the conducting of the Ark back to the temple (2 Chronicles 20:28)'
  - where: setting
    claim: 'The people returned to Jerusalem with psalteries, harps and trumpets to the house of the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: 'And they came to Jerusalem with psalteries and harps and trumpets unto the house of the Lord.'
  - where: setting
    claim: 'On that reading Psalm 47 shares with Psalm 46 both the thought of the Lord’s kingly exaltation over the peoples and its occasion'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/47.htm'
    quote: 'has, in common with Psalm 46:1-11, not only the thought of the kingly exaltation of Jahve over the peoples of the earth, but also its historical occasion'

  # ---------- thread ----------
  - where: thread
    claim: 'The “people” of verse 1 is plural in Hebrew (peoples)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הָ֭/עַמִּים'
  - where: thread
    claim: 'One older reading: the Lord’s true victory is a change in the hearts of the peoples, so that they worship with joy'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/47.htm'
    quote: 'The true and final victory of Jahve consists not in a submission that is brought about by war and bloodshed and in consternation that stupefies the mind, but in a change in the minds and hearts of the peoples, so that they render joyful worship unto Him'
  - where: thread
    claim: 'Verse 5 “gone up” and verse 9 “exalted” are the same Hebrew verb (H5927: qal perfect in verse 5, niphal in verse 9)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'נַעֲלָֽה'
  - where: thread
    claim: 'On the same older reading the exaltation of the last line is the result of the going up of verse 5'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/47.htm'
    quote: 'He is gone up in triumph, and is in consequence thereof highly exalted'

  # ---------- sections ----------
  - where: section 1 plain
    claim: 'Verses 1–4 rendered with “peoples,” “awesome,” and past tenses, as a modern translation has them'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2047&version=NRSVUE'
    quote: 'He subdued peoples under us'
  - where: section 1 plain
    claim: 'Verse 4 in the past, “the pride of Jacob whom he loves”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2047&version=NRSVUE'
    quote: 'the pride of Jacob whom he loves'
  - where: section 1 plain
    claim: 'Verse 2: “terrible” as awe'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2047&version=NRSVUE'
    quote: 'For the Lord, the Most High, is awesome,'
  - where: section 2 plain
    claim: 'Verse 7: “with a psalm” beside the King James’s “with understanding”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2047&version=NRSVUE'
    quote: 'sing praises with a psalm'
  - where: section 3 plain
    claim: 'Verse 8: “heathen” are the nations; “holy throne”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2047&version=NRSVUE'
    quote: 'God is king over the nations;'
  - where: section 3 plain
    claim: 'Verse 9: the princes gathered “as” the people of the God of Abraham; “highly exalted”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2047&version=NRSVUE'
    quote: 'as the people of the God of Abraham'
  - where: section 3 plain
    claim: 'The shields are the rulers of the earth'
    key: bdb
    url: 'https://biblehub.com/hebrew/4043.htm'
    quote: 'figurative of rulers of earth Psalm 47:10'

  # ---------- note 47:1 ----------
  - where: 'note 47:1 “All the peoples, not one people”'
    claim: 'The word for “people” in verse 1 is plural (H5971, morphology Ncmpa)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הָ֭/עַמִּים'
  - where: 'note 47:1 “All the peoples, not one people”'
    claim: 'The same plural stands in verse 3 (“the people under us”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'עַמִּ֣ים'
  - where: 'note 47:1 “All the peoples, not one people”'
    claim: 'The plural stands in verse 9 (“the princes of the people”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'עַמִּ֨ים'
  - where: 'note 47:1 “All the peoples, not one people”'
    claim: 'The second “people” of verse 9 (“the people of the God of Abraham”) is singular (morphology Ncmsc)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'עַם֮'
  - where: 'note 47:1 “All the peoples, not one people”'
    claim: 'The Greek has “all ye nations” in verse 1'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/47.htm'
    quote: 'Clap your hands, all ye nations; shout to God with a voice of exultation.'
  - where: 'note 47:1 “All the peoples, not one people”'
    claim: 'A modern translation prints “peoples” in verse 1'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2047&version=NRSVUE'
    quote: 'Clap your hands, all you peoples;'
  - where: 'note 47:1 “All the peoples, not one people”'
    claim: 'A modern translation prints “peoples” in verse 3'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2047&version=NRSVUE'
    quote: 'He subdued peoples under us'
  - where: 'note 47:1 “All the peoples, not one people”'
    claim: 'A modern translation prints “peoples” in verse 9'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2047&version=NRSVUE'
    quote: 'The princes of the peoples gather'
  - where: 'note 47:1 “All the peoples, not one people”'
    claim: 'The verb for clapping is used here of clapping the hands in triumph'
    key: bdb
    url: 'https://biblehub.com/hebrew/8628.htm'
    quote: '3 strike, clap hands; in triumph'
  - where: 'note 47:1 “All the peoples, not one people”'
    claim: 'The shout of verse 1 in a modern translation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2047&version=NRSVUE'
    quote: 'shout to God with loud songs of joy.'

  # ---------- note 47:2 ----------
  - where: 'note 47:2 “Terrible means awe-inspiring”'
    claim: 'The Hebrew is a form (niphal participle) of the verb to fear, and this verse is listed under “cause astonishment and awe” of the Lord (Psalm 47:3 in the Hebrew numbering)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3372.htm'
    quote: '2 cause astonishment and awe: of Yahweh himself Psalm 47:3'
  - where: 'note 47:2 “Terrible means awe-inspiring”'
    claim: 'Webster’s second sense of “terrible” in 1828'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/terrible'
    quote: 'Adapted to impress dread, terror or solemn awe and reverence.'
  - where: 'note 47:2 “Terrible means awe-inspiring”'
    claim: 'Webster illustrates that sense with Deuteronomy 7:21'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/terrible'
    quote: 'The Lord thy God is among you, a mighty God and terrible Deuteronomy 7:21.'
  - where: 'note 47:2 “Terrible means awe-inspiring”'
    claim: 'A modern translation has “awesome”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2047&version=NRSVUE'
    quote: 'For the Lord, the Most High, is awesome,'

  # ---------- note 47:4 ----------
  - where: 'note 47:4 “Chosen already, and the pride of Jacob”'
    claim: 'The Greek puts verse 3 in the past'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/47.htm'
    quote: 'He has subdued the peoples under us, and the nations under our feet.'
  - where: 'note 47:4 “Chosen already, and the pride of Jacob”'
    claim: 'The Greek puts verse 4 in the past'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/47.htm'
    quote: 'He has chosen out his inheritance for us, the beauty of Jacob which he loved.'
  - where: 'note 47:4 “Chosen already, and the pride of Jacob”'
    claim: 'A modern translation puts verse 3 in the past'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2047&version=NRSVUE'
    quote: 'He subdued peoples under us'
  - where: 'note 47:4 “Chosen already, and the pride of Jacob”'
    claim: 'A modern translation puts verse 4 in the past'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2047&version=NRSVUE'
    quote: 'He chose our heritage for us,'
  - where: 'note 47:4 “Chosen already, and the pride of Jacob”'
    claim: 'One older reading calls the Hebrew forms futures and still takes them as historical, because election is done once for all'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/47.htm'
    quote: 'the choosing (election) is an act done once for all and not a continued act; we are therefore driven to regard the futures'
  - where: 'note 47:4 “Chosen already, and the pride of Jacob”'
    claim: 'The futures are to be taken as a statement of historical facts'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/47.htm'
    quote: 'as a statement of historical facts'
  - where: 'note 47:4 “Chosen already, and the pride of Jacob”'
    claim: 'The first sense of the word behind “excellency”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1347.htm'
    quote: '1 exaltation, majesty, excellence,'
  - where: 'note 47:4 “Chosen already, and the pride of Jacob”'
    claim: 'It is used of nations for their wealth, power and magnificence, with Jacob in this verse (Psalm 47:5 in the Hebrew numbering) listed'
    key: bdb
    url: 'https://biblehub.com/hebrew/1347.htm'
    quote: 'a. of nations, their wealth, power, magnificence of buildings'
  - where: 'note 47:4 “Chosen already, and the pride of Jacob”'
    claim: 'A modern translation has “the pride of Jacob”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2047&version=NRSVUE'
    quote: 'the pride of Jacob whom he loves'
  - where: 'note 47:4 “Chosen already, and the pride of Jacob”'
    claim: 'On the older reading the pride of Jacob is the Holy Land'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/47.htm'
    quote: 'The Holy Land is called the pride'
  - where: 'note 47:4 “Chosen already, and the pride of Jacob”'
    claim: 'It is Jacob’s pride as the gift of grace'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/47.htm'
    quote: 'of Jacob, as being the gift of grace of which this, the people of God'

  # ---------- note 47:5 ----------
  - where: 'note 47:5 “The words of the day the ark was brought up”'
    claim: 'The narrative of the ark brought up with shouting and the sound of the trumpet'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/6?lang=eng'
