  - where: 'note 47:7 “With understanding is the title word Maschil”'
    claim: 'A modern translation has “with a psalm”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2047&version=NRSVUE'
    quote: 'sing praises with a psalm'
  - where: 'note 47:7 “With understanding is the title word Maschil”'
    claim: 'Its footnote gives the Hebrew as Maskil'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2047&version=NRSVUE'
    quote: '47.7 Heb Maskil'
  - where: 'note 47:7 “With understanding is the title word Maschil”'
    claim: 'The Greek has “with understanding”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/47.htm'
    quote: 'For God is king of all the earth: sing praises with understanding.'

