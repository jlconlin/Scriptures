    claim: 'The lexicon cites 2 Samuel 6:15 under the sense “shout of joy with religious impulse”'
    key: bdb
    url: 'https://biblehub.com/hebrew/8643.htm'
    quote: '3 shout of joy with religious impulse, 1 Samuel 4:5,6 (twice in verse); 2 Samuel 6:15 = 1 Chronicles 15:28'
  - where: 'note 47:5 “The words of the day the ark was brought up”'
    claim: 'It cites this verse (Psalm 47:6 in the Hebrew numbering) under the same sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/8643.htm'
    quote: 'Psalm 33:3; Psalm 47:6'

  # ---------- note 47:7 ----------
  - where: 'note 47:7 “With understanding is the title word Maschil”'
    claim: '“With understanding” is one Hebrew word, maskil'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מַשְׂכִּֽיל'
