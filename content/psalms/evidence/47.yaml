  # ---------- note 47:9 Abraham ----------
  - where: 'note 47:9 “The nations gathered as Abraham’s people”'
    claim: 'In Hebrew “people of the God of Abraham” follows “are gathered” directly, with no preposition or connecting word (words 3–6 of the verse)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'עַם֮'
  - where: 'note 47:9 “The nations gathered as Abraham’s people”'
    claim: 'A modern translation supplies “as”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2047&version=NRSVUE'
    quote: 'as the people of the God of Abraham'
  - where: 'note 47:9 “The nations gathered as Abraham’s people”'
    claim: 'The Greek has the rulers assembled “with the God of Abraam”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/47.htm'
    quote: 'The rulers of the people are assembled with the God of Abraam'
  - where: 'note 47:9 “The nations gathered as Abraham’s people”'
    claim: 'The Greek and Syriac read the word differently; the commentary defends “people”'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/47.htm'
    quote: 'with Ewald, and following the lxx and Syriac; and it is also inadmissible'
  - where: 'note 47:9 “The nations gathered as Abraham’s people”'
    claim: 'The word is called ambiguous, and the translation “people” praised'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/47.htm'
    quote: 'because they have translated the ambiguous'
  - where: 'note 47:9 “The nations gathered as Abraham’s people”'
    claim: 'One older reading: the nobles of the nations join the people of the God of Abraham'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/47.htm'
    quote: 'enter into the society of the people of the God of Abraham'
  - where: 'note 47:9 “The nations gathered as Abraham’s people”'
    claim: 'On that reading the promise to Abraham of blessing for the nations is being fulfilled'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/47.htm'
    quote: 'The promise concerning the blessing of the tribes of the nations in the seed of the patriarch is being fulfilled'
  - where: 'note 47:9 “The nations gathered as Abraham’s people”'
    claim: 'The promise at Abraham’s call'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/12?lang=eng'
