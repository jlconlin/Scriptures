    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שׁוֹפָֽר'
  - where: 'note 47:5 “The words of the day the ark was brought up”'
    claim: '2 Samuel 6:15 has the same phrase, “sound of the shofar” (H6963, H7782)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'שׁוֹפָֽר'
  - where: 'note 47:5 “The words of the day the ark was brought up”'
    claim: 'The psalm’s verb “gone up” is H5927 (qal perfect)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'עָלָ֣ה'
  - where: 'note 47:5 “The words of the day the ark was brought up”'
    claim: '“Brought up” in 2 Samuel 6:15 is the same verb, H5927, in the hiphil (causative) participle'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'מַעֲלִ֖ים'
