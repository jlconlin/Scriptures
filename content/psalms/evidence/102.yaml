chapter: 102
claims:
  # ---------- when ----------
  - where: when
    claim: 'The psalm speaks of Zion’s stones and dust; it gives no date'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/102?lang=eng'
    quote: 'For thy servants take pleasure in her stones, and favour the dust thereof.'

  # ---------- setting ----------
  - where: setting
    claim: 'Psalms 90–106 form one section of the book, and many of its psalms describe the day when Israel rests under the Messiah’s reign'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'Psalms 90–106: This section begins with Moses’s prayer for the Lord to have mercy on straying Israel. Many of these psalms describe the millennial day when Israel will find rest under the Messiah’s reign.'
  - where: setting
    claim: 'The book of Psalms is in five sections'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'The book of Psalms is divided into five sections, each ending with a final expression of praise'
  - where: setting
    claim: 'One older reading places the psalm among the exiles in Babylon'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/102.htm'
    quote: 'The servants of God do not feel at home in Babylon'
  - where: setting
    claim: 'On that reading the speaker is one person and is not a figure for the nation'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/102.htm'
    quote: 'It is to be taken, too, just as personally as it sounds, and the person is not to be construed into a nation.'
  - where: setting
    claim: 'Yet the speaker shares Jerusalem’s calamity'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/102.htm'
    quote: 'the poet is a servant of Jahve, who shares the calamity that has befallen Jerusalem and its homeless people'
  - where: setting
    claim: 'Hebrews 1:10–12 quotes verses 25–27 in a chain addressed to the Son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/1?lang=eng'
    quote: 'And, Thou, Lord, in the beginning hast laid the foundation of the earth; and the heavens are the works of thine hands:'
  - where: setting
    claim: 'D&C 124:6 uses the words of verse 13; the revelation is dated 19 January 1841'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/124?lang=eng'
    quote: 'For, behold, I am about to call upon them to give heed to the light and glory of Zion, for the set time has come to favor her.'

  # ---------- sections ----------
  - where: section 2 plain
    claim: 'Verses 6–8: owls of the wilderness and waste places; lying awake; the name used as a curse'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: 'those who deride me use my name for a curse.'
  - where: section 2 plain
    claim: 'Verse 10: lifted up and thrown aside; verse 11: a lengthening shadow'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: 'for you have lifted me up and thrown me aside.'
  - where: section 3 plain
    claim: 'Verse 12: enthroned for ever; verse 13: the appointed time'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: 'the appointed time has come.'
  - where: section 3 plain
    claim: 'Verse 18: a people not yet born; verse 20: those doomed to die'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: 'to set free those who were doomed to die,'
  - where: section 4 plain
    claim: 'Verses 23–24: strength broken in midcourse; taken away at the midpoint of life'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: 'He has broken my strength in midcourse;'

  # ---------- note 102:0 ----------
  - where: 'note 102:0 “A title that names a condition, not a person”'
    claim: 'The Greek title makes it a prayer for the poor man'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/102.htm'
    quote: 'A Prayer for the Poor; when he is deeply afflicted, and pours out his supplication before the Lord.'
  - where: 'note 102:0 “A title that names a condition, not a person”'
    claim: 'A modern translation has “faint” for the King James “overwhelmed”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: 'A prayer of one afflicted, when faint and pleading before the Lord.'

  - where: 'note 102:0 “A title that names a condition, not a person”'
    claim: 'The title in the Church’s edition: “overwhelmed” and “poureth out his complaint”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/102?lang=eng'
    quote: 'A Prayer of the afflicted, when he is overwhelmed, and poureth out his complaint before the Lord.'

  # ---------- note 102:6 ----------
  - where: 'note 102:6 “Birds of the waste places”'
    claim: 'A modern translation has two owls'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: 'I am like a desert owl of the wilderness,'
  - where: 'note 102:6 “Birds of the waste places”'
    claim: 'The second bird in a modern translation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: 'like a little owl of the waste places.'
  - where: 'note 102:6 “Birds of the waste places”'
    claim: 'The translation notes that the Hebrew of verse 6 is uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: '102.6 Meaning of Heb uncertain'
  - where: 'note 102:6 “Birds of the waste places”'
    claim: '“I watch” is “I lie awake”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: 'I lie awake;'
  - where: 'note 102:6 “Birds of the waste places”'
    claim: 'The Greek keeps the pelican'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/102.htm'
    quote: 'I have become like a pelican of the wilderness;'
  - where: 'note 102:6 “Birds of the waste places”'
    claim: 'The Greek puts the owl in a ruined house'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/102.htm'
    quote: 'I have become like an owl in a ruined house.'
  - where: 'note 102:8 “His name has become a curse”'
    claim: 'A modern translation: the mockers use his name for a curse'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: 'those who deride me use my name for a curse.'
  - where: 'note 102:8 “His name has become a curse”'
    claim: 'The enemies swear by him, wishing others the fate of “this man”; Isaiah 65:15 and Jeremiah 29:22 show the practice'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/102.htm'
    quote: 'These swear by him, inasmuch as they say when they want to curse: "God do unto thee as unto this man," which is to be explained according to Isaiah 65:15; Jeremiah 29:22.'
  - where: 'note 102:8 “His name has become a curse”'
    claim: 'The reproach is that he is forsaken of God'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/102.htm'
    quote: 'His grief is that his enemies reproach him as one forsaken of God.'
  # ---------- note 102:10 ----------
  - where: 'note 102:10 “Picked up to be thrown”'
    claim: 'A modern translation: lifted up and thrown aside'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: 'for you have lifted me up and thrown me aside.'

  # ---------- note 102:12 ----------
  - where: 'note 102:12 “The turn: a throne that outlasts the ruin”'
    claim: '“Endure” is “are enthroned forever” in a modern translation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: 'are enthroned forever;'
  - where: 'note 102:12 “The turn: a throne that outlasts the ruin”'
    claim: '“Thy remembrance” is “your name”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: 'your name endures to all generations.'
  - where: 'note 102:12 “The turn: a throne that outlasts the ruin”'
    claim: 'The translation’s cross-reference for verse 12 is Lamentations 5:19'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: '102.12 : Ps 135.13; Lam 5.19'
  - where: 'note 102:12 “The turn: a throne that outlasts the ruin”'
    claim: 'The remembrance is the name, the LORD’s ever-living memorial'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/102.htm'
    quote: 'The Name which Jahve makes Himself by self-attestation never falls a prey to the dead past, it is His ever-living memorial'
  - where: 'note 102:12 “The turn: a throne that outlasts the ruin”'
    claim: 'Verse 12 follows “I am withered like grass” with “But thou, O LORD”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/102?lang=eng'
    quote: 'But thou, O Lord, shalt endure for ever; and thy remembrance unto all generations.'

  # ---------- note 102:13 ----------
  - where: 'note 102:13 “The Lord repeats the line in 1841”'
    claim: 'D&C 124:6 in the Church’s edition'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/124?lang=eng'
    quote: 'For, behold, I am about to call upon them to give heed to the light and glory of Zion, for the set time has come to favor her.'
  - where: 'note 102:13 “The Lord repeats the line in 1841”'
    claim: 'The revelation is dated 19 January 1841'
    key: jsp-revelations-dc-124
    url: 'https://www.churchofjesuschrist.org/study/church-historians-press/jsp-revelations/dc-124-1841_01_19_020?lang=eng'
    quote: 'On 19 January 1841, JS dictated a revelation in Nauvoo, Illinois, designating the city as the new gathering place for the Latter-day Saints.'
  - where: 'note 102:13 “The Lord repeats the line in 1841”'
    claim: 'The editors’ note on verse 6 of the revelation refers to Psalm 102:13 and Isaiah 60'
    key: jsp-revelations-dc-124
    url: 'https://www.churchofjesuschrist.org/study/church-historians-press/jsp-revelations/dc-124-1841_01_19_020?lang=eng'
    quote: 'See Psalm 102:13; and Isaiah 60:1–3, 14.'
  - where: 'note 102:13 “The Lord repeats the line in 1841”'
    claim: 'The revelation came while the Saints, expelled from Missouri, were clearing and draining the land at Commerce (Nauvoo)'
    key: jsp-revelations-dc-124
    url: 'https://www.churchofjesuschrist.org/study/church-historians-press/jsp-revelations/dc-124-1841_01_19_020?lang=eng'
    quote: 'Since their expulsion from northern Missouri in winter 1838–1839, the Saints had devoted much of their time to resettling in the area of Commerce, Illinois, where they cleared the heavily forested peninsula, drained the swampy flats'
  - where: 'note 102:13 “The Lord repeats the line in 1841”'
    claim: 'A modern translation: the appointed time'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: 'the appointed time has come.'

  # ---------- note 102:14 ----------
  - where: 'note 102:14 “Loving the rubble”'
    claim: 'A modern translation: the servants hold the stones dear'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: 'For your servants hold its stones dear'
  - where: 'note 102:14 “Loving the rubble”'
    claim: 'and pity its dust'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: 'and have pity on its dust.'
  - where: 'note 102:14 “Loving the rubble”'
    claim: 'The stones and dust are the ruins of Jerusalem, yearned over by the exiles; Nehemiah 4:2 is compared'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/102.htm'
    quote: 'their loving yearning lingers over the ruins, the stones and the heaps of the rubbish (Nehemiah 4:2), of Jerusalem.'
  - where: 'note 102:16 “Elder McConkie on when Zion is built”'
    claim: 'The sermon was given by Elder McConkie on 27 February 1977 in Lima, Peru'
    key: mcconkie-build-zion
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1977/04/come-let-israel-build-zion?lang=eng'
    quote: 'The following sermon was given by Elder McConkie on 27 February 1977 in Lima, Peru.'
  - where: 'note 102:16 “Elder McConkie on when Zion is built”'
    claim: 'He quoted verse 18 as a message sent to a later people'
    key: mcconkie-build-zion
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1977/04/come-let-israel-build-zion?lang=eng'
    quote: '“This shall be written for the generation to come”; it is sent to “the people which shall be created,” to a people who “shall praise the Lord.”'
  - where: 'note 102:16 “Elder McConkie on when Zion is built”'
    claim: 'He identified that people as the Latter-day Saints'
    key: mcconkie-build-zion
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1977/04/come-let-israel-build-zion?lang=eng'
    quote: 'We are that people, a people who once again receive revelation'
  - where: 'note 102:16 “Elder McConkie on when Zion is built”'
    claim: 'He quoted verses 13 and 16 as the message'
    key: mcconkie-build-zion
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1977/04/come-let-israel-build-zion?lang=eng'
    quote: 'The message is that “when the Lord shall build up Zion, he shall appear in his glory.”'
  - where: 'note 102:16 “Elder McConkie on when Zion is built”'
    claim: 'Zion is built up when the Lord appears; perfected after the Second Coming'
    key: mcconkie-build-zion
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1977/04/come-let-israel-build-zion?lang=eng'
    quote: 'Zion shall be built up—she shall obtain that perfection and glory which is hers—when the Lord appears in his glory.'
  - where: 'note 102:16 “Elder McConkie on when Zion is built”'
    claim: 'Zion is perfected after the Second Coming'
    key: mcconkie-build-zion
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1977/04/come-let-israel-build-zion?lang=eng'
    quote: 'Zion shall be perfected after the second coming of Christ.'
  - where: 'note 102:16 “Elder McConkie on when Zion is built”'
    claim: 'The building of Zion occurs in stages'
    key: mcconkie-build-zion
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1977/04/come-let-israel-build-zion?lang=eng'
    quote: 'This gathering of Israel and this building of Zion in the last days occurs in stages.'
  - where: 'note 102:16 “Elder McConkie on when Zion is built”'
    claim: 'The present responsibility is to lay the foundation'
    key: mcconkie-build-zion
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1977/04/come-let-israel-build-zion?lang=eng'
    quote: 'the Lord has laid upon us the responsibility to lay the foundation for that which is to be.'
  - where: 'note 102:18 “A record for people not yet born”'
    claim: 'A modern translation: let this be recorded'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: 'Let this be recorded for a generation to come,'
  - where: 'note 102:18 “A record for people not yet born”'
    claim: 'for a people yet unborn'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: 'so that a people yet unborn may praise the Lord:'
  - where: 'note 102:18 “A record for people not yet born”'
    claim: 'The translation’s cross-reference for verse 18 is Psalm 22:31'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: '102.18 : Ps 22.31; Rom 15.4'
  - where: 'note 102:18 “A record for people not yet born”'
    claim: 'Verses 19–20 say what is to be written: He looked down and heard'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/102?lang=eng'
    quote: 'For he hath looked down from the height of his sanctuary; from heaven did the Lord behold the earth;'

  # ---------- note 102:20 ----------
  - where: 'note 102:20 “The prisoners of Psalm 79, heard”'
    claim: 'The translation’s cross-reference for verse 20 is Psalm 79:11'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20102&version=NRSVUE'
    quote: '102.20 : Ps 79.11'
  - where: 'note 102:20 “The prisoners of Psalm 79, heard”'
    claim: 'Verse 20 says the LORD looked down to hear the prisoner and to loose those appointed to death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/102?lang=eng'
    quote: 'To hear the groaning of the prisoner; to loose those that are appointed to death;'

  # ---------- note 102:25 ----------
  - where: 'note 102:25 “Hebrews gives these lines to the Son”'
    claim: 'Hebrews 1:10–12 quotes the verses, with “Lord” and “fold them up”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/1?lang=eng'
    quote: 'And as a vesture shalt thou fold them up, and they shall be changed: but thou art the same, and thy years shall not fail.'
  - where: 'note 102:25 “Hebrews gives these lines to the Son”'
    claim: 'The Greek psalm adds the address “O Lord”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/102.htm'
    quote: 'In the beginning thou, O Lord, didst lay the foundation of the earth; and the heavens are the works of thine hands.'
  - where: 'note 102:25 “Hebrews gives these lines to the Son”'
    claim: 'The Greek psalm has “fold them”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/102.htm'
    quote: 'and as a vesture shalt thou fold them, and they shall be changed.'
  - where: 'note 102:25 “Hebrews gives these lines to the Son”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'

  # ---------- note 102:27 ----------
  - where: 'note 102:27 “Thou art He”'
    claim: 'One reading: the phrase is “Thou art He,” the unalterably same One, and is taken from Isaiah (41:4; 43:10; 46:4; 48:12)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/102.htm'
    quote: 'Thou art He, i.e., unalterably the same One, is also taken from the mouth of the prophet, Isaiah 41:4; Isaiah 43:10; Isaiah 46:4; Isaiah 48:12'
  - where: 'note 102:27 “Thou art He”'
    claim: 'The confession of the Creator in verse 25 recalls Isaiah 48:13'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/102.htm'
    quote: 'The confession of God the Creator in Psalm 102:26 reminds one in its form of Isaiah 48:13'
  - where: 'note 102:27 “Thou art He”'
    claim: 'On the same reading the plea rests not on God’s eternity in itself but on the restoration of Israel that is looked for'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/102.htm'
    quote: 'the poet supports not by the eternity of God in itself, but by the work of the rejuvenation of the world and of the restoration of Israel that is to be looked for'
  - where: 'note 102:27 “Thou art He”'
    claim: 'which God can accomplish because He is ever-living'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/102.htm'
    quote: 'which He can and will bring to an accomplishment, because He is the ever-living One.'
  - where: 'note 102:27 “Thou art He”'
    claim: 'The name Jehovah denotes the Unchangeable One'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'It denotes the “Unchangeable One,” “the eternal I Am”'
  - where: 'note 102:27 “Thou art He”'
    claim: 'Hebrews 1:12 quotes “thou art the same” of the Son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/1?lang=eng'
    quote: 'but thou art the same, and thy years shall not fail.'

  # ---------- christ ----------
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'Hebrews gives verses 25–27 as words to the Son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/1?lang=eng'
    quote: 'But unto the Son he saith, Thy throne, O God, is for ever and ever'
  - where: christ
    claim: 'Verse 16 has been taught as a promise of the Second Coming'
    key: mcconkie-build-zion
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1977/04/come-let-israel-build-zion?lang=eng'
    quote: 'Zion shall be perfected after the second coming of Christ.'
  - where: christ
    claim: 'The Lord says in 1841 that the set time has come'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/124?lang=eng'
    quote: 'for the set time has come to favor her.'

  # ---------- explore ----------
  - where: explore
    claim: 'Hebrews 1 goes on from these verses to quote Psalm 110:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/1?lang=eng'
    quote: 'But to which of the angels said he at any time, Sit on my right hand, until I make thine enemies thy footstool?'
  - where: explore
    claim: 'The commentary read sets this psalm’s faith beside Psalm 90'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/102.htm'
    quote: 'Faith lays hold upon this guarantee as in Psalm 90.'

  - where: explore
    claim: 'The section 90–106 opens with the prayer of Moses (Psalm 90)'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'This section begins with Moses’s prayer for the Lord to have mercy on straying Israel.'

  # ---------- parallels ----------
  - where: parallels
    claim: 'Hebrews 1:10–12 follows the Greek wording of the psalm'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/102.htm'
    quote: 'They shall perish, but thou remainest: and they all shall wax old as a garment'
