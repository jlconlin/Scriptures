chapter: 130
claims:
  - where: 'setting'
    claim: 'One older reading (Delitzsch) dates the psalm late on the ground of its vocabulary.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/130.htm'
    quote: 'brings our Psalm down into a later period of the language'
  - where: 'setting'
    claim: 'Delitzsch holds that the chronicler built the close of Solomon’s prayer (2 Chr. 6:40–42) from Psalm 130:2 and Psalm 132.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/130.htm'
    quote: 'is compiled out of passages of Psalm 130:1-8'
  - where: 'setting'
    claim: 'Solomon’s prayer in Chronicles asks that God’s ears be attent to prayer, close to verse 2.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/6?lang=eng'
    quote: 'let thine ears be attent unto the prayer that is made in this place'
  - where: 'setting'
    claim: 'Psalm 131 ends with the call of 130:7.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/131?lang=eng'
    quote: 'Let Israel hope in the Lord from henceforth and for ever.'
  - where: 'thread'
    claim: 'The repeated watchmen’s line conveys long waiting.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/130.htm'
    quote: 'gives the impression of protracted, painful waiting'
  - where: 'section 2 plain'
    claim: '“Feared” in verse 4 is rendered as reverence.'
    key: bd-fear
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fear?lang=eng'
    quote: 'In such passages fear is equivalent to reverence, awe, worship'
  - where: 'section 2 plain'
    claim: '“Mark” is rendered as keeping watch; the verb is “keep, watch, preserve.”'
    key: bdb
    url: 'https://biblehub.com/hebrew/8104.htm'
    quote: 'keep, watch, preserve'
  - where: 'section 4 plain'
    claim: 'A modern translation renders verse 8 “It is he who will redeem Israel”; the plain rendering follows it.'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20130&version=NRSVUE'
    quote: 'It is he who will redeem Israel'
  - where: 'note 130:1 “The depths are deep water”'
    claim: 'Psalm 69 pictures distress as sinking in deep waters.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/69?lang=eng'
    quote: 'I sink in deep mire, where there is no standing: I am come into deep waters, where the floods overflow me.'
  - where: 'note 130:1 “The depths are deep water”'
    claim: 'In Psalm 69 the deep waters stand beside those who hate the speaker.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/69?lang=eng'
    quote: 'let me be delivered from them that hate me, and out of the deep waters'
  - where: 'note 130:1 “The depths are deep water”'
    claim: 'The word for “depths” in 130:1 is figurative, and is joined to “waters” for distress in Psalm 69:2 and 69:14 (Hebrew 69:3, 15).'
    key: bdb
    url: 'https://biblehub.com/hebrew/4615.htm'
    quote: 'Ezekiel 27:34 (fall of Tyre), Psalm 69:3; Psalm 69:15 (distress)'
  - where: 'note 130:4 “Why forgiveness leads to fear”'
    claim: 'The fear of the Lord in such passages is reverence.'
    key: bd-fear
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fear?lang=eng'
    quote: 'In such passages fear is equivalent to reverence, awe, worship'
  - where: 'note 130:4 “Why forgiveness leads to fear”'
    claim: 'The other fear is what sin produces, beginning with Adam.'
    key: bd-fear
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fear?lang=eng'
    quote: 'The first effect of Adam’s sin was that he was afraid'
  - where: 'note 130:4 “Why forgiveness leads to fear”'
    claim: 'God teaches men to ask forgiveness with confidence rather than fear.'
    key: bd-fear
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/fear?lang=eng'
    quote: 'Ever since the Fall God has been teaching men not to fear, but with penitence to ask forgiveness in full confidence of receiving it.'
  - where: 'note 130:4 “Why forgiveness leads to fear”'
    claim: 'A modern translation renders “feared” as “revered.”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20130&version=NRSVUE'
    quote: 'so that you may be revered'
  - where: 'note 130:4 “Why forgiveness leads to fear”'
    claim: 'Solomon asks God to hear and forgive.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'Then hear thou in heaven thy dwelling place, and forgive, and do, and give to every man according to his ways'
  - where: 'note 130:4 “Why forgiveness leads to fear”'
    claim: 'Solomon asks God to forgive, with the purpose that Israel fear Him.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'That they may fear thee all the days that they live in the land which thou gavest unto our fathers.'
  - where: 'note 130:6 “Watching for the morning”'
    claim: 'The watchers of verse 6 are a participle of shamar.'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/130-6.htm'
    quote: 'more than those watching'
  - where: 'note 130:6 “Watching for the morning”'
    claim: 'In Isaiah 21:11 the participle of the same verb is a city’s watchman.'
    key: bdb
    url: 'https://biblehub.com/hebrew/8104.htm'
    quote: 'especially Participle watch, watchman, of city Isaiah 21:11'
  - where: 'note 130:6 “Watching for the morning”'
    claim: 'Isaiah’s watchman is asked about the night and answers that morning comes.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/21?lang=eng'
    quote: 'The watchman said, The morning cometh, and also the night'
  - where: 'note 130:6 “Watching for the morning”'
    claim: 'A modern translation repeats the line with no added words.'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20130&version=NRSVUE'
    quote: 'more than those who watch for the morning'
  - where: 'note 130:8 “Redeemed from sins, not from enemies”'
    claim: 'Psalm 25 ends with a prayer for Israel’s redemption from troubles.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/25?lang=eng'
    quote: 'Redeem Israel, O God, out of all his troubles.'
  - where: 'note 130:8 “Redeemed from sins, not from enemies”'
    claim: 'What it means to redeem.'
    key: gs-redeem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/redeem-redeemed-redemption?lang=eng'
    quote: 'To deliver, to purchase, or to ransom, such as to free a person from bondage by payment.'
  - where: 'note 130:8 “Redeemed from sins, not from enemies”'
    claim: 'A modern translation renders verse 8 “It is he who will redeem Israel.”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20130&version=NRSVUE'
    quote: 'It is he who will redeem Israel'
  - where: 'note 130:8 “Redeemed from sins, not from enemies”'
    claim: 'The NRSVUE cross-reference at verse 8 is Luke 1:68.'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20130&version=NRSVUE'
    quote: '130.8 : Lk 1.68'
  - where: 'note 130:8 “Redeemed from sins, not from enemies”'
    claim: 'One older reading (Delitzsch) describes the mercy of verse 7 as removing guilt.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/130.htm'
    quote: 'the mercy, which removes the guilt of sin and its consequences'
  - where: 'note 130:8 “Redeemed from sins, not from enemies”'
    claim: 'Delitzsch reads the redemption of verse 8 as spiritual redemption.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/130.htm'
    quote: 'He means complete and final redemption, above all, in the genuinely New Testament manner, spiritual redemption.'
  - where: 'christ'
    claim: 'Redemption refers to the Atonement of Jesus Christ.'
    key: gs-redeem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/redeem-redeemed-redemption?lang=eng'
    quote: 'Redemption refers to the Atonement of Jesus Christ and to deliverance from sin.'
  - where: 'christ'
    claim: 'The psalm’s LORD is the divine name (Yah in verse 3).'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/130-3.htm'
    quote: 'O YAH'
  - where: 'parallels'
    claim: 'Titus 2:14 has “redeem us from all iniquity.”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/titus/2?lang=eng'
    quote: 'that he might redeem us from all iniquity'
