chapter: 136
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The psalm has no title; the Gospel Library page goes from the chapter heading to verse 1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/136?lang=eng'
    quote: 'Give thanks unto God for all things, for His mercy endures forever.'

  # ---- setting ----
  - where: 'setting'
    claim: 'The refrain stands twenty-six times, at the end of every verse'
    key: parry-refrain
    url: 'https://rsc.byu.edu/preserved-translation/refrain'
    quote: 'For his mercy endureth forever is found twenty-six times in Psalm 136 (at the end of every verse).'
  - where: 'setting'
    claim: 'Psalm 136 was known as the “Great Hallel”; the Hallel is Psalms 113–118'
    key: bd-hallel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hallel?lang=eng'
    quote: 'A name given to the group of Psalms (113–18) recited by Jews at the great feasts (Matt. 26:30; Mark 14:26). Ps. 136 was generally known as the “Great Hallel.”'
  - where: 'setting'
    claim: 'The refrain is sung before the ark in David’s day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'O give thanks unto the Lord; for he is good; for his mercy endureth for ever.'
  - where: 'setting'
    claim: 'The refrain is sung at the dedication of Solomon’s temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/5?lang=eng'
    quote: 'praised the Lord, saying, For he is good; for his mercy endureth for ever: that then the house was filled with a cloud'
  - where: 'setting'
    claim: 'The refrain is sung when the second temple’s foundation is laid'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/3?lang=eng'
    quote: 'because he is good, for his mercy endureth for ever toward Israel'
  - where: 'setting'
    claim: 'Psalm 135 sets the LORD above all gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/135?lang=eng'
    quote: 'For I know that the Lord is great, and that our Lord is above all gods.'
  - where: 'setting'
    claim: 'Psalm 135 has the smiting of Egypt’s firstborn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/135?lang=eng'
    quote: 'Who smote the firstborn of Egypt, both of man and beast.'
  - where: 'setting'
    claim: 'Psalm 135:10–12 has the kings, Sihon and Og, and the heritage, in nearly the words of 136:17–22'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/135?lang=eng'
    quote: 'Who smote great nations, and slew mighty kings;'
  - where: 'setting'
    claim: 'Verses 17–22 are taken from Psalm 135:10–12 with slight change'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/136.htm'
    quote: 'The words are taken over, as are the six lines of Psalm 136:17-22 in the main, from Psalm 135:10-12, with only a slight alteration in the expression.'
  - where: 'setting'
    claim: 'The titles of verses 2–3 and the phrase of verse 12 are also in Deuteronomy 10:17 and 4:34 (the source says they were taken from there; the chapter says only that the wording is shared)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/136.htm'
    quote: 'Psa 136:2 and Psalm 136:3 (God of gods and Lord of lords) are taken from Deuteronomy 10:17; Psalm 136:12 (with a strong hand and stretched-out arm) from Deuteronomy 4:34'
  - where: 'setting'
    claim: 'Deuteronomy 4:34 speaks of the deliverance from Egypt by a stretched out arm'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/4?lang=eng'
    quote: 'by a mighty hand, and by a stretched out arm, and by great terrors, according to all that the Lord your God did for you in Egypt before your eyes'

  # ---- thread ----
  - where: 'thread'
    claim: 'Up to verse 9 the psalm praises the Creator; from verse 10 the God of Israel’s history'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/136.htm'
    quote: 'Up to this point it is God the absolute in general, the Creator of all things, to the celebration of whose praise they are summoned; and from this point onwards the God of the history of salvation.'
  - where: 'thread'
    claim: 'The last verse returns to the beginning'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/136.htm'
    quote: 'the closing verse, which recurs to the beginning'

  # ---- note 136:1 ----
  - where: 'note 136:1 “An answer sung at the LORD’s house”'
    claim: 'At the bringing in of the ark the singers and trumpeters sang the refrain and the house was filled with a cloud'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/5?lang=eng'
    quote: 'as the trumpeters and singers were as one, to make one sound to be heard in praising and thanking the Lord'
  - where: 'note 136:1 “An answer sung at the LORD’s house”'
    claim: 'When the fire came down all Israel bowed to the pavement and said the refrain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/7?lang=eng'
    quote: 'they bowed themselves with their faces to the ground upon the pavement, and worshipped, and praised the Lord, saying, For he is good; for his mercy endureth for ever.'
  - where: 'note 136:1 “An answer sung at the LORD’s house”'
    claim: 'At the second temple’s foundation they sang the refrain “by course”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/3?lang=eng'
    quote: 'And they sang together by course in praising and giving thanks unto the Lord; because he is good, for his mercy endureth for ever toward Israel.'
  - where: 'note 136:1 “An answer sung at the LORD’s house”'
    claim: 'A modern translation renders “sang together by course” as singing responsively'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Ezra%203%3A11&version=NRSVUE'
    quote: 'and they sang responsively, praising and giving thanks to the Lord'
  - where: 'note 136:1 “An answer sung at the LORD’s house”'
    claim: 'The form of temple music is a matter of educated guesses'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'There is no way to know beyond educated guesses what form temple music would have taken.'
  - where: 'note 136:1 “An answer sung at the LORD’s house”'
    claim: 'The form of some psalms indicates that some temple music was likely responsorial or antiphonal'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'indicates that some of the music was likely responsorial or antiphonal'
  - where: 'note 136:1 “An answer sung at the LORD’s house”'
    claim: 'A refrain can invite the audience to take part'
    key: parry-refrain
    url: 'https://rsc.byu.edu/preserved-translation/refrain'
    quote: 'They can give prominence to doctrines or truths (see first example below); invite participation by the audience (second example below)'

  # ---- note 136:2 ----
  - where: 'note 136:2 “The God of gods”'
    claim: 'Moses calls the LORD God of gods and Lord of lords'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/10?lang=eng'
    quote: 'For the Lord your God is God of gods, and Lord of lords, a great God, a mighty, and a terrible, which regardeth not persons, nor taketh reward:'
  - where: 'note 136:2 “The God of gods”'
    claim: 'Psalm 135 says the Lord is above all gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/135?lang=eng'
    quote: 'For I know that the Lord is great, and that our Lord is above all gods.'

  # ---- note 136:10 ----
  - where: 'note 136:10 “Why the death of the firstborn is answered with mercy”'
    claim: 'Before the plagues the LORD calls Israel His firstborn son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/4?lang=eng'
    quote: 'And thou shalt say unto Pharaoh, Thus saith the Lord, Israel is my son, even my firstborn:'
  - where: 'note 136:10 “Why the death of the firstborn is answered with mercy”'
    claim: 'Pharaoh is warned that refusal will cost his firstborn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/4?lang=eng'
    quote: 'Let my son go, that he may serve me: and if thou refuse to let him go, behold, I will slay thy son, even thy firstborn.'
  - where: 'note 136:10 “Why the death of the firstborn is answered with mercy”'
    claim: 'The song at the sea calls the deliverance the LORD’s mercy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'Thou in thy mercy hast led forth the people which thou hast redeemed: thou hast guided them in thy strength unto thy holy habitation.'
  - where: 'note 136:10 “Why the death of the firstborn is answered with mercy”'
    claim: '“Mercy” in Exodus 15:13 is hesed (Strong’s 2617) with a suffix'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/exodus/15-13.htm'
    quote: 'ḇə·ḥas·də·ḵā'
  - where: 'note 136:10 “Why the death of the firstborn is answered with mercy”'
    claim: '“Mercy” in the refrain of Psalm 136 is the same noun, hesed (Strong’s 2617), with a suffix'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/136-1.htm'
    quote: 'ḥas·dōw.'
  - where: 'note 136:10 “Why the death of the firstborn is answered with mercy”'
    claim: 'Moses says Israel was brought out because the LORD loved them and kept His oath to the fathers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/7?lang=eng'
    quote: 'But because the Lord loved you, and because he would keep the oath which he had sworn unto your fathers, hath the Lord brought you out with a mighty hand'
  - where: 'note 136:10 “Why the death of the firstborn is answered with mercy”'
    claim: 'In Ezra the refrain is sung with “toward Israel”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/3?lang=eng'
    quote: 'for his mercy endureth for ever toward Israel'

  # ---- note 136:21 ----
  - where: 'note 136:21 “The heritage east of the Jordan”'
    claim: 'The two kingdoms lay on the far side of the Jordan, from the Arnon to Hermon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/3?lang=eng'
    quote: 'And we took at that time out of the hand of the two kings of the Amorites the land that was on this side Jordan, from the river of Arnon unto mount Hermon;'
  - where: 'note 136:21 “The heritage east of the Jordan”'
    claim: 'Moses gave that land to Reuben and Gad'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/3?lang=eng'
    quote: 'And this land, which we possessed at that time, from Aroer, which is by the river Arnon, and half mount Gilead, and the cities thereof, gave I unto the Reubenites and to the Gadites.'
  - where: 'note 136:21 “The heritage east of the Jordan”'
    claim: 'and to half the tribe of Manasseh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/3?lang=eng'
    quote: 'And the rest of Gilead, and all Bashan, being the kingdom of Og, gave I unto the half tribe of Manasseh'
  - where: 'note 136:21 “The heritage east of the Jordan”'
    claim: 'Psalm 135:11 goes on past Sihon and Og to all the kingdoms of Canaan, which Psalm 136 does not name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/135?lang=eng'
    quote: 'Sihon king of the Amorites, and Og king of Bashan, and all the kingdoms of Canaan:'
  - where: 'note 136:21 “The heritage east of the Jordan”'
    claim: 'The land of the two kings lay east of the Jordan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/4?lang=eng'
    quote: 'two kings of the Amorites, which were on this side Jordan toward the sunrising'

  # ---- note 136:23 ----
  - where: 'note 136:23 “The history becomes “us””'
    claim: 'One older reading: at verse 23 the praise turns to a very recent experience'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/136.htm'
    quote: 'In Psalm 136:23 the praise changes suddenly to that which has been experienced very recently.'
  - where: 'note 136:23 “The history becomes “us””'
    claim: 'Psalm 145:15 says God gives all their food'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/145?lang=eng'
    quote: 'The eyes of all wait upon thee; and thou givest them their meat in due season.'

  # ---- note 136:26 ----
  - where: 'note 136:26 “Mormon’s “endureth forever””'
    claim: 'Mormon says charity endures forever'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/moro/7?lang=eng'
    quote: 'But charity is the pure love of Christ, and it endureth forever; and whoso is found possessed of it at the last day, it shall be well with him.'
  - where: 'note 136:26 “Mormon’s “endureth forever””'
    claim: 'Mormon has been read as alluding to the Psalms'
    key: sc-knowhy-361
    url: 'https://scripturecentral.org/knowhy/what-does-it-really-mean-to-have-charity'
    quote: 'Mormon then alluded to the Psalms to help explain charity even more.'
  - where: 'note 136:26 “Mormon’s “endureth forever””'
    claim: 'The psalm is a list of God’s acts each closed by the refrain; Mormon also gives a list and says charity endures forever'
    key: sc-knowhy-361
    url: 'https://scripturecentral.org/knowhy/what-does-it-really-mean-to-have-charity'
    quote: 'This psalm includes a long list of God’s acts of charity towards men, where each verse ends with the phrase “for his [charity] endureth forever.” Mormon also included a long list about charity'
  - where: 'note 136:26 “Mormon’s “endureth forever””'
    claim: 'The Hebrew word of the refrain is used of God’s covenant love and of human love'
    key: sc-knowhy-361
    url: 'https://scripturecentral.org/knowhy/what-does-it-really-mean-to-have-charity'
    quote: 'which describes both God’s covenantal love for humanity, and our love for each other, appears often in Psalm 136'
  - where: 'note 136:26 “Mormon’s “endureth forever””'
    claim: 'Mormon’s list of what charity is'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/moro/7?lang=eng'
    quote: 'And charity suffereth long, and is kind, and envieth not, and is not puffed up'
  - where: 'note 136:26 “Mormon’s “endureth forever””'
    claim: 'Moroni calls the Lord’s love for the children of men charity'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/ether/12?lang=eng'
    quote: 'And now I know that this love which thou hast had for the children of men is charity'
  - where: 'note 136:26 “Mormon’s “endureth forever””'
    claim: 'The Book of Mormon uses charity of God’s love for us and of our love for each other'
    key: sc-knowhy-361
    url: 'https://scripturecentral.org/knowhy/what-does-it-really-mean-to-have-charity'
    quote: 'Thus, charity in the Book of Mormon, as in the New Testament, can describe God’s love for us and our love for each other.'

  # ---- christ ----
  - where: 'christ'
    claim: 'The Lamb is Lord of lords'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/17?lang=eng'
    quote: 'These shall make war with the Lamb, and the Lamb shall overcome them: for he is Lord of lords, and King of kings'
  - where: 'christ'
    claim: 'The rider of Revelation 19, who is Christ by the chapter heading, bears the name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/19?lang=eng'
    quote: 'And he hath on his vesture and on his thigh a name written, King of Kings, and Lord of Lords.'
  - where: 'christ'
    claim: 'The LORD of the Old Testament is Jehovah, the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'

  # ---- explore ----
  - where: 'explore'
    claim: 'Jehoshaphat appoints singers to go before the army saying the refrain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: 'he appointed singers unto the Lord, and that should praise the beauty of holiness, as they went out before the army, and to say, Praise the Lord; for his mercy endureth for ever.'
  - where: 'explore'
    claim: 'Psalm 106 tells the history with Israel’s sins confessed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/106?lang=eng'
    quote: 'We have sinned with our fathers, we have committed iniquity, we have done wickedly.'
  - where: 'setting'
    claim: 'Psalm 106 begins with the call to give thanks and the refrain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/106?lang=eng'
    quote: 'O give thanks unto the Lord; for he is good: for his mercy endureth for ever.'
  - where: 'setting'
    claim: 'Psalm 107 begins with the call to give thanks and the refrain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/107?lang=eng'
    quote: 'O give thanks unto the Lord, for he is good: for his mercy endureth for ever.'
  - where: 'setting'
    claim: 'Psalm 118 begins with the call to give thanks and the refrain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/118?lang=eng'
    quote: 'O give thanks unto the Lord; for he is good: because his mercy endureth for ever.'
  - where: 'explore'
    claim: 'Nehemiah 9 tells the same history as a confession (the chapter heading)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/9?lang=eng'
    quote: 'The Jews fast and confess their sins'

  # ---- parallels ----
  - where: 'parallels'
    claim: 'The parallels are the verses quoted in the notes and setting above'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'Thou in thy mercy hast led forth the people which thou hast redeemed'
