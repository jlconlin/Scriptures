  # ---- christ ----
  - where: 'christ'
    claim: 'The psalm has been called a prophecy of the Jerusalem above of Galatians 4:26'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/87.htm'
    quote: 'It is a prophecy in O.T. language of “the Jerusalem that is above, which is our mother” (Galatians 4:26).'
  - where: 'christ'
    claim: 'The words of Galatians 4:26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/4?lang=eng'
    quote: 'But Jerusalem which is above is free, which is the mother of us all.'
  - where: 'christ'
    claim: 'On the same reading the psalm looks forward to Ephesians 2:12 and 2:19'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/87.htm'
    quote: 'It looks forward to the time when the Gentiles shall no longer be “alienated from the commonwealth of Israel” but “fellow citizens with the saints, and of the household of God” (Ephesians 2:12; Ephesians 2:19).'
  - where: 'christ'
    claim: 'The words of Ephesians 2:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/eph/2?lang=eng'
    quote: 'being aliens from the commonwealth of Israel, and strangers from the covenants of promise'
  - where: 'christ'
    claim: 'The words of Ephesians 2:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/eph/2?lang=eng'
    quote: 'Now therefore ye are no more strangers and foreigners, but fellowcitizens with the saints, and of the household of God;'
  - where: 'christ'
    claim: 'On the same reading all nations are adopted as citizens of Zion'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/87.htm'
    quote: 'It depicts Zion as the metropolis of the universal kingdom of God, into which all nations are adopted as citizens.'
  - where: 'christ'
    claim: 'Adoption: one of non-Israelite lineage becomes a member of the house of Israel through faith in Christ, baptism and the Holy Ghost'
    key: bd-adoption
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/adoption?lang=eng'
    quote: 'A person who is of non-Israelite lineage becomes a member of the house of Israel through faith in Jesus Christ when it is accompanied by baptism in water and the reception of the Holy Ghost.'

  # ---- explore ----
  - where: 'explore'
    claim: 'The thought of verse 4 has been found in Isaiah 19:24–25 in different language'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/87.htm'
    quote: 'The thought is the same as that of Isaiah 19:24-25, though it is expressed in different language.'
  - where: 'explore'
    claim: 'Isaiah 2:2–4 and Zechariah 2:11 and 8:20–23 are among the prophecies said to lead up to the psalm'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/87.htm'
    quote: 'though many prophecies lead up to it. See especially Isaiah 2:2-4 (= Micah 4:1-3); Isaiah 11:10; Isaiah 18:7; Isaiah 19:19 ff; Isaiah 44:5; Isaiah 60:1 ff.; Zephaniah 2:11; Zephaniah 3:9-10; Zechariah 2:11; Zechariah 8:20-23.'
  - where: 'explore'
    claim: 'The other songs of Zion'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'Songs of Zion. These psalms celebrate the location of the temple at Mount Zion'
  - where: 'explore'
    claim: 'Revelation 21:27: those written in the Lamb’s book of life enter the city'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/21?lang=eng'
    quote: 'but they which are written in the Lamb’s book of life.'

