chapter: 87
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The title gives the psalm to the sons of Korah and names no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/87?lang=eng'
    quote: 'A Psalm or Song for the sons of Korah.'

  # ---- setting ----
  - where: 'setting'
    claim: 'Psalm 87 is listed among the songs of Zion with Psalms 46, 48, 76, 84 and 122'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'could have acted also as a call to worship: 46, 48, 76, 84, 87, and 122.'
  - where: 'setting'
    claim: 'The words of Psalm 86:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/86?lang=eng'
    quote: 'All nations whom thou hast made shall come and worship before thee, O Lord; and shall glorify thy name.'
  - where: 'setting'
    claim: 'Psalm 87 has been read as expanding the thought of Psalm 86:9'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/87.htm'
    quote: 'it expands the thought of Psalm 86:9 in the style and the spirit of prophecy'
  - where: 'setting'
    claim: 'Psalm 87 has been read as taking up the thought of Psalm 86:9'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/87.htm'
    quote: 'The mission thought in Psalm 86:9 becomes the ruling thought in this Korahitic Psalm.'
  - where: 'setting'
    claim: 'The psalm has been called terse and enigmatic'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/87.htm'
    quote: 'It is terse, abrupt, enigmatic, like a prophetic oracle'
  - where: 'setting'
    claim: 'Selah stands at the end of verses 3 and 6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/87?lang=eng'
    quote: 'Glorious things are spoken of thee, O city of God. Selah.'
  - where: 'setting'
    claim: 'In verse 4 God Himself is the speaker'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/87.htm'
    quote: 'God Himself is the speaker'
  - where: 'setting'
    claim: 'One proposed date is Hezekiah’s reign, after the Assyrian army was destroyed and gifts were brought to Jerusalem (2 Chr. 32:23)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/87.htm'
    quote: 'to suppose that the Psalm was composed when, in consequence of the destruction of the Assyrian army before Jerusalem, offerings and presents were brought from many quarters for Jahve and the king of Judah (2 Chronicles 32:23)'
  - where: 'setting'
    claim: 'The psalm has been assigned to the age of Hezekiah'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/87.htm'
    quote: 'The Psalm has been assigned, with considerable plausibility, to the age of Hezekiah.'
  - where: 'setting'
    claim: 'The words of 2 Chronicles 32:23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/32?lang=eng'
    quote: 'And many brought gifts unto the Lord to Jerusalem, and presents to Hezekiah king of Judah'
  - where: 'setting'
    claim: 'The other proposed date is after the return from Babylon'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/87.htm'
    quote: 'It seems best then to suppose that the Psalm was written (like Psalms 85) after the Return from Babylon'
  - where: 'setting'
    claim: 'The argument for the later date is that Babylon is named and not Assyria'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/87.htm'
    quote: 'the mention of Babylon rather than Assyria points to a date after that power had taken the place of Assyria as the mistress of Western Asia'

  # ---- thread ----
  - where: 'thread'
    claim: '“Was born” is the same Hebrew verb in the same form in verses 4, 5 and 6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יֻלַּד'
  - where: 'thread'
    claim: 'The glorious things of verse 3 are unfolded in God’s words in verse 4'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/87.htm'
    quote: 'The glorious contents of the promise are now unfolded, and that with the most vivid directness: Jahve Himself takes up the discourse'
  - where: 'thread'
    claim: 'What God declares in verse 4 is the glorious thing of verse 3: the city is to become the birthplace of all nations'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/87.htm'
    quote: 'declares the gracious, glorious, world-wide mission of His chosen and beloved city: it shall become the birth-place of all nations'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“His foundation” is the city He founded'
    key: bdb
    url: 'https://biblehub.com/hebrew/3248.htm'
    quote: 'foundation = city founded'
  - where: 'section 2 plain'
    claim: 'Rahab is Egypt'
    key: bdb
    url: 'https://biblehub.com/hebrew/2142.htm'
    quote: 'Rahab (= Egypt) Psalm 87:4'
  - where: 'section 2 plain'
    claim: '“To them that know me” is rendered among those who know me, and “Ethiopia” is Cush'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2087&version=NRSVUE'
    quote: 'Among those who know me I mention Rahab and Babylon;'
  - where: 'section 2 plain'
    claim: '“Ethiopia” is rendered Cush'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2087&version=NRSVUE'
    quote: 'Philistia, too, and Tyre, with Cush'
  - where: 'section 2 plain'
    claim: '“This and that man” is this one and that one; “the highest” is the Most High'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2087&version=NRSVUE'
    quote: 'for the Most High himself will establish it.'
  - where: 'section 2 plain'
    claim: '“People” in verse 6 is plural, peoples'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2087&version=NRSVUE'
    quote: 'as he registers the peoples,'

  # ---- note 87:1 ----
  - where: 'note 87:1 “The city He founded”'
    claim: 'The noun means foundation in the sense of a city founded'
    key: bdb
    url: 'https://biblehub.com/hebrew/3248.htm'
    quote: 'foundation = city founded'
  - where: 'note 87:1 “The city He founded”'
    claim: 'A modern translation renders verse 1 as the city He founded'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2087&version=NRSVUE'
    quote: 'On the holy mount stands the city he founded;'
  - where: 'note 87:1 “The city He founded”'
    claim: 'Another modern translation renders verse 1 as God founding His city'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2087&version=NIV'
    quote: 'He has founded his city on the holy mountain.'
  - where: 'note 87:1 “The city He founded”'
    claim: 'The pronoun on “foundation” is third person masculine singular (the word is coded Sp3ms)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יְ֝סוּדָת֗/וֹ'
  - where: 'note 87:1 “The city He founded”'
    claim: 'The city is addressed in the feminine in verse 3 (“of thee,” coded Sp2fs) and is “her” in verse 5 (Sp3fs)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בָּ֑/ךְ'

  # ---- note 87:2 ----
  - where: 'note 87:2 “The gates, and the other dwellings of Jacob”'
    claim: 'Psalm 78:60: God forsook the tabernacle of Shiloh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/78?lang=eng'
    quote: 'So that he forsook the tabernacle of Shiloh, the tent which he placed among men;'
  - where: 'note 87:2 “The gates, and the other dwellings of Jacob”'
    claim: 'Psalm 78:68: God chose mount Zion, which He loved'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/78?lang=eng'
    quote: 'But chose the tribe of Judah, the mount Zion which he loved.'
  - where: 'note 87:2 “The gates, and the other dwellings of Jacob”'
    claim: '“Loveth” in verse 2 is the Hebrew verb numbered 157'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֹהֵ֣ב'
  - where: 'note 87:2 “The gates, and the other dwellings of Jacob”'
    claim: '“Loved” in Psalm 78:68 is the same Hebrew verb (157)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אָהֵֽב'
  - where: 'note 87:2 “The gates, and the other dwellings of Jacob”'
    claim: 'Psalm 132:13: the LORD chose Zion for His habitation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/132?lang=eng'
    quote: 'For the Lord hath chosen Zion; he hath desired it for his habitation.'
  - where: 'note 87:2 “The gates, and the other dwellings of Jacob”'
    claim: '“Dwellings” in verse 2 is the Hebrew noun numbered 4908'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מִשְׁכְּנ֥וֹת'
  - where: 'note 87:2 “The gates, and the other dwellings of Jacob”'
    claim: '“Tabernacles” in Numbers 24:5 is the same Hebrew noun (4908)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'מִשְׁכְּנֹתֶ֖י/ךָ'
  - where: 'note 87:2 “The gates, and the other dwellings of Jacob”'
    claim: 'Numbers 24:5, Balaam’s blessing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/24?lang=eng'
    quote: 'How goodly are thy tents, O Jacob, and thy tabernacles, O Israel!'
  - where: 'note 87:2 “The gates, and the other dwellings of Jacob”'
    claim: 'The gates stand for the city, and fit the thought of pilgrims entering from all nations'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/87.htm'
    quote: 'A poetical expression for the city, specially appropriate with reference to the thought of the crowd of pilgrims (Psalm 122:2) entering it from all nations'
  - where: 'note 87:2 “The gates, and the other dwellings of Jacob”'
    claim: 'The same word is rendered “tabernacles” in Numbers 24:5, and the other cities are goodly too'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/87.htm'
    quote: 'Better than any of the other cities of Israel, though they too are goodly (Numbers 24:5, where the same word is rendered ‘tabernacles’).'

  # ---- note 87:4 nations ----
  - where: 'note 87:4 “Five nations, and Egypt under a nickname”'
    claim: 'Rahab in this verse is Egypt'
    key: bdb
    url: 'https://biblehub.com/hebrew/2142.htm'
    quote: 'Rahab (= Egypt) Psalm 87:4'
  - where: 'note 87:4 “Five nations, and Egypt under a nickname”'
    claim: 'A modern translation notes Rahab as a poetic name for Egypt'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2087&version=NIV'
    quote: 'Psalm 87:4 A poetic name for Egypt'
  - where: 'note 87:4 “Five nations, and Egypt under a nickname”'
    claim: 'The Hebrew name in this verse (Strong’s 7294)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'רַ֥הַב'
  - where: 'note 87:4 “Five nations, and Egypt under a nickname”'
    claim: 'The name of Rahab of Jericho in Joshua 2:1 is a different Hebrew word (Strong’s 7343)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'רָחָ֖ב'
  - where: 'note 87:4 “Five nations, and Egypt under a nickname”'
    claim: '“Ethiopia” is Cush in Hebrew'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'כּ֑וּשׁ'
  - where: 'note 87:4 “Five nations, and Egypt under a nickname”'
    claim: 'A modern translation has God mention the nations among those who know Him'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2087&version=NRSVUE'
    quote: 'Among those who know me I mention Rahab and Babylon;'
  - where: 'note 87:4 “Five nations, and Egypt under a nickname”'
    claim: 'Another modern translation has “among those who acknowledge me” and prints verse 4 as God’s speech'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2087&version=NIV'
    quote: 'among those who acknowledge me—'
  - where: 'note 87:4 “Five nations, and Egypt under a nickname”'
    claim: 'A modern translation’s cross-reference at verse 4 is Isaiah 19:25'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2087&version=NIV'
    quote: 'Psalm 87:4 : Isa 19:25'
  - where: 'note 87:4 “Five nations, and Egypt under a nickname”'
    claim: 'Isaiah 19:25: Egypt and Assyria blessed with Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/19?lang=eng'
    quote: 'Blessed be Egypt my people, and Assyria the work of my hands, and Israel mine inheritance.'

  # ---- note 87:4 born ----
  - where: 'note 87:4 “Born there means born in Zion”'
    claim: 'The Hebrew has only the demonstrative “this” (coded as a demonstrative pronoun), with no word for “man”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'זֶ֝֗ה'
  - where: 'note 87:4 “Born there means born in Zion”'
    claim: 'A modern translation keeps “This one was born there”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2087&version=NRSVUE'
    quote: '“This one was born there,” they say.'
  - where: 'note 87:4 “Born there means born in Zion”'
    claim: 'Another modern translation names the place as Zion'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2087&version=NIV'
    quote: 'This one was born in Zion.'
  - where: 'note 87:4 “Born there means born in Zion”'
    claim: 'On one older reading “this” points to nation after nation, and “there” is Zion'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/87.htm'
    quote: 'but to nation after nation (cf. זה העם, Isaiah 23:13), by fixing the eye upon each one separately. And שׁם refers to Zion.'
  - where: 'note 87:4 “Born there means born in Zion”'
    claim: 'The birth is a right of citizenship in Zion as a second mother-city'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/87.htm'
    quote: 'the nations will attain a right of citizenship in Zion (πολιτεία τοῦ Ἰσραήλ, Ephesians 2:12) as in their second mother-city'
  - where: 'note 87:4 “Born there means born in Zion”'
    claim: 'Another older commentary: citizenship conferred as by right of birth'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/87.htm'
    quote: 'The franchise of Zion is conferred upon them as though it were theirs by right of birth.'
  - where: 'note 87:4 “Born there means born in Zion”'
    claim: 'Isaiah 44:5 is called the key to the psalm’s meaning'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/87.htm'
    quote: 'As to the rest, Isaiah 44:5 is the key to its meaning.'
  - where: 'note 87:4 “Born there means born in Zion”'
    claim: 'The words of Isaiah 44:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/44?lang=eng'
    quote: 'One shall say, I am the Lord’s; and another shall call himself by the name of Jacob'
  - where: 'note 87:4 “Born there means born in Zion”'
    claim: 'The psalmist does not have the New Testament new birth in full view, but the change is, from the New Testament point of view, the new birth'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/87.htm'
    quote: 'The poet does not combine with it the idea of being born again in the depth of its New Testament meaning'
  - where: 'note 87:4 “Born there means born in Zion”'
    claim: 'The change the nations undergo is, from the New Testament point of view, the new birth of water and the Spirit'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/87.htm'
    quote: 'experience a spiritual change which, regarded from the New Testament point of view, is the new birth out of water and the Spirit'
  - where: 'note 87:4 “Born there means born in Zion”'
    claim: 'The words refer primarily to nations, yet foreshadow the new birth (John 3)'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/87.htm'
    quote: 'for primarily they refer to nations not to individuals; yet we may see in them a foreshadowing of the truth that a new birth is requisite for entrance into the kingdom of God (John 3:3 ff.).'
  - where: 'note 87:4 “Born there means born in Zion”'
    claim: 'The words of John 3:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/3?lang=eng'
    quote: 'Except a man be born of water and of the Spirit, he cannot enter into the kingdom of God.'

  # ---- note 87:5 ----
  - where: 'note 87:5 “One by one, and Zion as mother”'
    claim: 'The Hebrew of “this and that man” is the word for a man, twice, joined by “and”; the verse has no word for mother'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אִ֣ישׁ'
  - where: 'note 87:5 “One by one, and Zion as mother”'
    claim: 'A modern translation has “This one and that one were born in it”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2087&version=NRSVUE'
    quote: '“This one and that one were born in it,”'
  - where: 'note 87:5 “One by one, and Zion as mother”'
    claim: 'The ancient Greek translation has a man say that Sion is his mother'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/87.htm'
    quote: 'A man shall say, Sion is my mother; and such a man was born in her; and the Highest himself has founded her.'
  - where: 'note 87:5 “One by one, and Zion as mother”'
    claim: '“The highest” is rendered “the Most High”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2087&version=NRSVUE'
    quote: 'for the Most High himself will establish it.'
  - where: 'note 87:5 “One by one, and Zion as mother”'
    claim: 'The Hebrew of “shall establish her” in verse 5 (verb 3559 with a feminine suffix)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יְכוֹנְנֶ֣/הָ'
  - where: 'note 87:5 “One by one, and Zion as mother”'
    claim: 'Psalm 48:8 has the same verb in the same form with the same suffix'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יְכוֹנְנֶ֖/הָ'
  - where: 'note 87:5 “One by one, and Zion as mother”'
    claim: 'The words of Psalm 48:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/48?lang=eng'
    quote: 'in the city of our God: God will establish it for ever. Selah.'

  # ---- note 87:6 ----
  - where: 'note 87:6 “The LORD’s register of the peoples”'
    claim: 'A modern translation has the LORD write in the register of the peoples'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2087&version=NIV'
    quote: 'The Lord will write in the register'
  - where: 'note 87:6 “The LORD’s register of the peoples”'
    claim: 'Another modern translation has Him record as He registers the peoples'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2087&version=NRSVUE'
    quote: 'as he registers the peoples,'
  - where: 'note 87:6 “The LORD’s register of the peoples”'
    claim: '“People” is plural in Hebrew (coded as a plural noun)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'עַמִּ֑ים'
  - where: 'note 87:6 “The LORD’s register of the peoples”'
    claim: 'A modern translation’s cross-reference at verse 6 is Ezekiel 13:9'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2087&version=NRSVUE'
    quote: '87.6 : Ezek 13.9'
  - where: 'note 87:6 “The LORD’s register of the peoples”'
    claim: 'Another modern translation’s cross-references at verse 6 include Psalm 69:28 and Isaiah 4:3'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2087&version=NIV'
    quote: 'Psalm 87:6 : Ex 32:32; Ps 69:28; Isa 4:3; Mal 3:16'
  - where: 'note 87:6 “The LORD’s register of the peoples”'
    claim: 'Ezekiel 13:9: the writing of the house of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/13?lang=eng'
    quote: 'neither shall they be written in the writing of the house of Israel'
  - where: 'note 87:6 “The LORD’s register of the peoples”'
    claim: 'Isaiah 4:3: those written among the living in Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/4?lang=eng'
    quote: 'even every one that is written among the living in Jerusalem'
  - where: 'note 87:6 “The LORD’s register of the peoples”'
    claim: 'Psalm 69:28, a psalm of David by the Church’s heading: the book of the living'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/69?lang=eng'
    quote: 'Let them be blotted out of the book of the living, and not be written with the righteous.'
  - where: 'note 87:6 “The LORD’s register of the peoples”'
    claim: 'The book of life is spoken of in the New Testament, and the scriptures indicate a heavenly record of the faithful by name'
    key: bd-book-of-life
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/book-of-life?lang=eng'
    quote: 'However, the scriptures indicate that a heavenly record is kept of the faithful, whose names are recorded, as well as an account of their righteous deeds'
  - where: 'note 87:6 “The LORD’s register of the peoples”'
    claim: 'The New Testament passages that speak of the book of life'
    key: bd-book-of-life
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/book-of-life?lang=eng'
    quote: 'Spoken of in Philip. 4:3; Rev. 3:5; 13:8; 17:8; 20:12; 21:27; 22:19'

  # ---- note 87:7 ----
  - where: 'note 87:7 “A hard last line”'
    claim: 'Verse 7 is five Hebrew words: two participles, “all,” “my springs,” and “in thee”; the second word is a participle, not a finite verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
