chapter: 149
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The Church’s edition prints no title above verse 1; the page opens with the chapter heading and the verse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/149?lang=eng'
    quote: 'Praise ye the Lord. Sing unto the Lord a new song, and his praise in the congregation of saints.'

  # ---- setting ----
  - where: 'setting'
    claim: 'Psalm 146 opens and closes with “Praise ye the LORD”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/146?lang=eng'
    quote: 'The Lord shall reign for ever, even thy God, O Zion, unto all generations. Praise ye the Lord.'
  - where: 'setting'
    claim: 'Psalm 147 opens and closes with “Praise ye the LORD”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/147?lang=eng'
    quote: 'He hath not dealt so with any nation: and as for his judgments, they have not known them. Praise ye the Lord.'
  - where: 'setting'
    claim: 'Psalm 148 opens with “Praise ye the LORD” and calls on the heavens'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/148?lang=eng'
    quote: 'Praise ye the Lord. Praise ye the Lord from the heavens: praise him in the heights.'
  - where: 'setting'
    claim: 'Psalm 148 ends with the saints, the children of Israel, and with “Praise ye the LORD”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/148?lang=eng'
    quote: 'He also exalteth the horn of his people, the praise of all his saints; even of the children of Israel, a people near unto him. Praise ye the Lord.'
  - where: 'setting'
    claim: 'Psalm 149 ends with “Praise ye the LORD”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/149?lang=eng'
    quote: 'To execute upon them the judgment written: this honour have all his saints. Praise ye the Lord.'
  - where: 'setting'
    claim: 'Psalm 150, the last psalm, opens and closes with “Praise ye the LORD”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/150?lang=eng'
    quote: 'Let every thing that hath breath praise the Lord. Praise ye the Lord.'
  - where: 'setting'
    claim: 'One older reading places Psalms 147–149 in the restoration under Ezra and Nehemiah'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/147.htm'
    quote: 'It is the tone of the restoration-period of Ezra and Nehemiah that meets us sounding forth out of this and the two following Psalms'
  - where: 'setting'
    claim: 'The same reading says so of Psalm 149 itself'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/149.htm'
    quote: 'This Psalm is also explained, as we have already seen on Psalm 147, from the time of the restoration under Ezra and Nehemiah.'
  - where: 'setting'
    claim: 'The New Testament uses the two-edged sword of the word of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/4?lang=eng'
    quote: 'For the word of God is quick, and powerful, and sharper than any twoedged sword'
  - where: 'setting'
    claim: 'Latter-day revelation uses the two-edged sword of the Lord’s word'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/6?lang=eng'
    quote: 'give heed unto my word, which is quick and powerful, sharper than a two-edged sword'
  - where: 'setting'
    claim: 'John sees a two-edged sword go out of the mouth of the risen Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/1?lang=eng'
    quote: 'out of his mouth went a sharp twoedged sword'

  # ---- thread ----
  - where: 'thread'
    claim: '“Saints” stands in verses 1, 5 and 9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/149?lang=eng'
    quote: 'Let the saints be joyful in glory: let them sing aloud upon their beds.'

  # ---- notes ----
  - where: 'note 149:1 “Who the saints are”'
    claim: 'Verse 5 has the word “saints” again, and verse 9 has “all his saints”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/149?lang=eng'
    quote: 'To execute upon them the judgment written: this honour have all his saints.'
  - where: 'note 149:1 “Who the saints are”'
    claim: 'Psalm 148’s last verse identifies the saints as the children of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/148?lang=eng'
    quote: 'the praise of all his saints; even of the children of Israel, a people near unto him'
  - where: 'note 149:1 “Who the saints are”'
    claim: 'A modern translation renders “the congregation of saints” as “the assembly of the faithful”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20149&version=NRSVUE'
    quote: 'his praise in the assembly of the faithful.'
  - where: 'note 149:1 “Who the saints are”'
    claim: 'The Hebrew word for “saints” in verse 1 (hasidim, Strong’s 2623) is the word of Psalm 4:3, where it is explained'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חֲסִידִֽים'

  - where: 'note 149:2 “Israel’s Maker and Zion’s King”'
    claim: 'Isaiah has the LORD call Himself Israel’s creator and King in one sentence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/43?lang=eng'
    quote: 'I am the Lord, your Holy One, the creator of Israel, your King.'
  - where: 'note 149:2 “Israel’s Maker and Zion’s King”'
    claim: 'Psalm 100 joins being made by the LORD with being His people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/100?lang=eng'
    quote: 'it is he that hath made us, and not we ourselves; we are his people, and the sheep of his pasture.'
  - where: 'note 149:2 “Israel’s Maker and Zion’s King”'
    claim: 'Psalm 146, the first of the closing five, ends with the LORD reigning as Zion’s God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/146?lang=eng'
    quote: 'The Lord shall reign for ever, even thy God, O Zion, unto all generations.'
  - where: 'note 149:2 “Israel’s Maker and Zion’s King”'
    claim: 'The only other kings in the psalm are those bound in verse 8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/149?lang=eng'
    quote: 'To bind their kings with chains, and their nobles with fetters of iron;'

  - where: 'note 149:4 “Salvation as an adornment”'
    claim: 'The verb of “beautify” is used with Israel as object in Isaiah 55:5 and 60:9, and with the temple as object, and BDB lists Psalm 149:4 under it'
    key: bdb
    url: 'https://biblehub.com/hebrew/6286.htm'
    quote: '(object Israel) Isaiah 55:5; Isaiah 60:9; with accusative of temple'
  - where: 'note 149:4 “Salvation as an adornment”'
    claim: 'A modern translation: adorns the humble with victory'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20149&version=NRSVUE'
    quote: 'he adorns the humble with victory.'
  - where: 'note 149:4 “Salvation as an adornment”'
    claim: 'Isaiah 55:5: the LORD has glorified Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/55?lang=eng'
    quote: 'because of the Lord thy God, and for the Holy One of Israel; for he hath glorified thee.'
  - where: 'note 149:4 “Salvation as an adornment”'
    claim: 'Isaiah 60:13: the sanctuary is beautified'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/60?lang=eng'
    quote: 'to beautify the place of my sanctuary; and I will make the place of my feet glorious.'
  - where: 'note 149:4 “Salvation as an adornment”'
    claim: 'Isaiah 61:10: salvation as a garment the LORD puts on His people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/61?lang=eng'
    quote: 'he hath clothed me with the garments of salvation, he hath covered me with the robe of righteousness'
  - where: 'note 149:4 “Salvation as an adornment”'
    claim: 'Psalm 132:16: priests clothed with salvation, saints shouting for joy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/132?lang=eng'
    quote: 'I will also clothe her priests with salvation: and her saints shall shout aloud for joy.'

  - where: 'note 149:5 “Why they sing on their beds”'
    claim: 'One older reading: the saints shout for joy on the beds where they had complained'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/149.htm'
    quote: 'they shout for joy upon their beds, upon which they have hitherto poured forth their complaints over the present'
  - where: 'note 149:5 “Why they sing on their beds”'
    claim: 'The same reading: the bed is the place of soliloquy, and its tears become shouts of joy'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/149.htm'
    quote: 'for the bed is the place of soliloquy (Psalm 4:5), and the tears shed there (Psalm 6:7) are turned into shouts of joy in the case of Israel.'
  - where: 'note 149:5 “Why they sing on their beds”'
    claim: 'Psalm 4:4: communing with one’s heart on the bed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/4?lang=eng'
    quote: 'Stand in awe, and sin not: commune with your own heart upon your bed, and be still.'
  - where: 'note 149:5 “Why they sing on their beds”'
    claim: 'Psalm 6:6: tears on the bed at night'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/6?lang=eng'
    quote: 'all the night make I my bed to swim; I water my couch with my tears.'

  - where: 'note 149:6 “The sword, in the psalm and in later scripture”'
    claim: 'The pairing of praise and sword suggests the sword may stand for the force of words'
    key: scripture-helps-ps-102
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/34-psalms-102-103-110-116-119-127-128-135-139-146-150?lang=eng'
    quote: 'The sword in this psalm may represent the penetrating force of words, particularly words of praise.'
  - where: 'note 149:6 “The sword, in the psalm and in later scripture”'
    claim: 'In Hebrew and in Greek the word for two-edged means two-mouthed'
    key: ensign-two-edged-sword
    url: 'https://www.churchofjesuschrist.org/study/ensign/2017/02/a-two-edged-sword?lang=eng'
    quote: 'In the Bible, both the Greek and Hebrew words for two-edged mean “two-mouthed,” referring to how the blade consumes what it touches.'
  - where: 'note 149:6 “The sword, in the psalm and in later scripture”'
    claim: 'The biblical languages so associate the two-edged sword with the word'
    key: ensign-two-edged-sword
    url: 'https://www.churchofjesuschrist.org/study/ensign/2017/02/a-two-edged-sword?lang=eng'
    quote: 'the original Bible languages inherently contain an association between a two-edged sword and the word.'
  - where: 'note 149:6 “The sword, in the psalm and in later scripture”'
    claim: 'Verses 7–8 name what the sword is for'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/149?lang=eng'
    quote: 'To execute vengeance upon the heathen, and punishments upon the people;'
  - where: 'note 149:6 “The sword, in the psalm and in later scripture”'
    claim: 'Isaiah 49:2: the servant’s mouth made like a sharp sword'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/49?lang=eng'
    quote: 'And he hath made my mouth like a sharp sword; in the shadow of his hand hath he hid me'
  - where: 'note 149:6 “The sword, in the psalm and in later scripture”'
    claim: 'Hebrews 4:12: the word of God sharper than any two-edged sword'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/4?lang=eng'
    quote: 'For the word of God is quick, and powerful, and sharper than any twoedged sword'
  - where: 'note 149:6 “The sword, in the psalm and in later scripture”'
    claim: 'Ephesians 6:17: the sword of the Spirit is the word of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/eph/6?lang=eng'
    quote: 'And take the helmet of salvation, and the sword of the Spirit, which is the word of God:'
  - where: 'note 149:6 “The sword, in the psalm and in later scripture”'
    claim: 'D&C 6:2: the Lord’s word sharper than a two-edged sword'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/6?lang=eng'
    quote: 'Behold, I am God; give heed unto my word, which is quick and powerful, sharper than a two-edged sword'

  - where: 'note 149:9 “A sentence already written, and who carries it out”'
    claim: 'One older reading: “written” means the Law and prophecy in general'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/149.htm'
    quote: 'has neither this nor that passage of Scripture in his mind, but the testimony of the Law and of prophecy in general, that all kingdoms shall become God''s and His Christ''s.'
  - where: 'note 149:9 “A sentence already written, and who carries it out”'
    claim: 'The same reading takes the subjugation of verses 7–9 as real, not without bloodshed'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/149.htm'
    quote: 'Subjugation (and certainly not without bloodshed) is the scriptural'
  - where: 'note 149:9 “A sentence already written, and who carries it out”'
    claim: 'The same reading: the psalm has been used to stir up religious war, and a Christian cannot pray it unchanged'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/149.htm'
    quote: 'We see that the Christian cannot make such a Psalm directly his own without disavowing the apostolic warning'
  - where: 'note 149:9 “A sentence already written, and who carries it out”'
    claim: 'The same reading: the psalm became the watchword of grave errors when prayed without change'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/149.htm'
    quote: 'Under the illusion that it might be used as a prayer without any spiritual transmutation, Psalm 149:1-9 has become the watchword of the most horrible errors.'
  - where: 'note 149:9 “A sentence already written, and who carries it out”'
    claim: 'The same reading: the one who prays it must transpose it'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/149.htm'
    quote: 'The praying Christian must there transpose the letter of this Psalm into the spirit of the New Covenant'
  - where: 'note 149:9 “A sentence already written, and who carries it out”'
    claim: 'A modern translation: the judgment decreed'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20149&version=NRSVUE'
    quote: 'to execute on them the judgment decreed.'
  - where: 'note 149:9 “A sentence already written, and who carries it out”'
    claim: 'Deuteronomy 32:35: vengeance belongs to the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng'
    quote: 'To me belongeth vengeance, and recompence; their foot shall slide in due time'
  - where: 'note 149:9 “A sentence already written, and who carries it out”'
    claim: '2 Corinthians 10:4: the weapons of our warfare are not carnal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-cor/10?lang=eng'
    quote: '(For the weapons of our warfare are not carnal, but mighty through God to the pulling down of strong holds;)'
  - where: 'parallels'
    claim: 'Daniel 7:22: judgment given to the saints'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/7?lang=eng'
    quote: 'Until the Ancient of days came, and judgment was given to the saints of the most High; and the time came that the saints possessed the kingdom.'

  # ---- christ ----
  - where: 'christ'
    claim: 'The LORD of the Old Testament is Jehovah, the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: 'christ'
    claim: 'Revelation 1:16: a sharp two-edged sword from the mouth of the risen Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/1?lang=eng'
    quote: 'and out of his mouth went a sharp twoedged sword: and his countenance was as the sun shineth in his strength.'
  - where: 'christ'
    claim: 'Revelation 19:15: the sword from His mouth smites the nations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/19?lang=eng'
    quote: 'And out of his mouth goeth a sharp sword, that with it he should smite the nations'
  - where: 'christ'
    claim: 'Revelation 19:16: His name is King of kings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/19?lang=eng'
    quote: 'And he hath on his vesture and on his thigh a name written, King of Kings, and Lord of Lords.'
  - where: 'christ'
    claim: 'A Church magazine article lists Psalm 149:6 and Revelation 1:16 together as uses of the image of the two-edged sword'
    key: ensign-two-edged-sword
    url: 'https://www.churchofjesuschrist.org/study/ensign/2017/02/a-two-edged-sword?lang=eng'
    quote: 'It is used in many contexts. (See Judges 3:16; Psalm 149:6; Proverbs 5:4; Revelation 1:16; 2:12.)'
  - where: 'christ'
    claim: 'Matthew 5:5: the Savior blesses the meek'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/5?lang=eng'
    quote: 'Blessed are the meek: for they shall inherit the earth.'

  # ---- explore ----
  - where: 'explore'
    claim: 'D&C 84:98 introduces a new song given by revelation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'and with the voice together sing this new song, saying:'

  # ---- parallels ----
  - where: 'parallels'
    claim: 'Isaiah 43:15 has the two titles of verse 2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/43?lang=eng'
    quote: 'I am the Lord, your Holy One, the creator of Israel, your King.'
