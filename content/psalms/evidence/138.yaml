chapter: 138
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The title ascribes the psalm to David and gives no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/138?lang=eng'
    quote: 'A Psalm of David.'

  # ---- setting ----
  - where: 'setting'
    claim: 'Psalm 139 carries David’s name in its title'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/139?lang=eng'
    quote: 'To the chief Musician, A Psalm of David.'
  - where: 'setting'
    claim: 'Psalm 140 carries David’s name in its title'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/140?lang=eng'
    quote: 'To the chief Musician, A Psalm of David.'
  - where: 'setting'
    claim: 'Psalm 141 carries David’s name in its title'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/141?lang=eng'
    quote: 'A Psalm of David.'
  - where: 'setting'
    claim: 'Psalm 142 carries David’s name in its title'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/142?lang=eng'
    quote: 'Maschil of David; A Prayer when he was in the cave.'
  - where: 'setting'
    claim: 'Psalm 143 carries David’s name in its title'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/143?lang=eng'
    quote: 'A Psalm of David.'
  - where: 'setting'
    claim: 'Psalm 144 carries David’s name in its title'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/144?lang=eng'
    quote: 'A Psalm of David.'
  - where: 'setting'
    claim: 'Psalm 145 carries David’s name in its title, the eighth in the run'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/145?lang=eng'
    quote: 'David’s Psalm of praise.'
  - where: 'setting'
    claim: 'Psalm 137 is the psalm of the captives in Babylon, who ask how they can sing the LORD’s song there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/137?lang=eng'
    quote: 'How shall we sing the Lord’s song in a strange land?'
  - where: 'setting'
    claim: 'One older reading contrasts the silenced praise of Psalm 137 with the kings’ song of Psalm 138'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/138.htm'
    quote: 'the praise of Jahve, which according to Psalm 137:3 was obliged to be dumb in the presence of the heathen, will, according to Psalm 138:5, be sung by the kings of the heathen themselves'
  - where: 'setting'
    claim: 'A modern translation renders “I will praise thee” as giving thanks'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20138&version=NRSVUE'
    quote: 'I give you thanks, O Lord, with my whole heart;'
  - where: 'setting'
    claim: 'Psalm 138 is listed among the songs of thanksgiving, sung after deliverance from a trial'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'Songs of thanksgiving. These psalms reflect the gratitude of an individual or community after they have been delivered from a trial by God: 18, 30, 34, 40, 66, 92, 116, 118, and 138.'
  - where: 'thread'
    claim: 'Verse 6 is joined to the kings’ song of verse 5 as its reason'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20138&version=NRSVUE'
    quote: 'For though the Lord is high, he regards the lowly,'
  - where: 'setting'
    claim: 'One older reading takes the psalm as an echo of the promise of 2 Samuel 7'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/138.htm'
    quote: 'an echo of 2 Samuel 7 (1 Chronicles 17). The superabundant promise which made the throne of David and of his seed an eternal throne is here gratefully glorified.'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Worship” in verse 2 is bowing down, and “praise” is giving thanks'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20138&version=NRSVUE'
    quote: 'I bow down toward your holy temple'
  - where: 'section 2 plain'
    claim: '“Sing in the ways of the LORD” is to sing of them'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20138&version=NRSVUE'
    quote: 'They shall sing of the ways of the Lord,'
  - where: 'section 3 plain'
    claim: '“Perfect that which concerneth me” is to complete or fulfil for me'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20138&version=NRSVUE'
    quote: 'The Lord will fulfill his purpose for me;'

  # ---- note 138:1 ----
  - where: 'note 138:1 “Who the gods are”'
    claim: 'The Hebrew word in verse 1 is elohim (H430)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֱלֹהִ֣ים'
  - where: 'note 138:1 “Who the gods are”'
    claim: 'The Greek translation has angels'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/138.htm'
    quote: 'I will sing psalms to thee before the angels'
  - where: 'note 138:1 “Who the gods are”'
    claim: 'The lexicon lists a sense of elohim as rulers or judges'
    key: bdb
    url: 'https://biblehub.com/hebrew/430.htm'
    quote: 'rulers, judges, either as divine representatives at sacred places or as reflecting divine majesty and power'
  - where: 'note 138:1 “Who the gods are”'
    claim: 'The lexicon places Psalm 138:1 under that sense and records that others read angels, God, or gods'
    key: bdb
    url: 'https://biblehub.com/hebrew/430.htm'
    quote: 'but angels'
  - where: 'note 138:1 “Who the gods are”'
    claim: 'A modern translation keeps “the gods”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20138&version=NRSVUE'
    quote: 'before the gods I sing your praise;'
  - where: 'note 138:1 “Who the gods are”'
    claim: 'Psalm 82 opens with God standing among the gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/82?lang=eng'
    quote: 'God standeth in the congregation of the mighty; he judgeth among the gods.'

  # ---- note 138:2 temple ----
  - where: 'note 138:2 “Worship toward the temple”'
    claim: 'Solomon prays that the LORD watch the place where His name is and hear prayer made toward it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'even toward the place of which thou hast said, My name shall be there: that thou mayest hearken unto the prayer which thy servant shall make toward this place.'
  - where: 'note 138:2 “Worship toward the temple”'
    claim: 'The people too are to pray toward the place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'when they shall pray toward this place'
  - where: 'note 138:2 “Worship toward the temple”'
    claim: 'Daniel prayed toward Jerusalem from his own chamber'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/dan/6?lang=eng'
    quote: 'his windows being open in his chamber toward Jerusalem, he kneeled upon his knees three times a day, and prayed'
  - where: 'note 138:2 “Worship toward the temple”'
    claim: 'Psalm 5:7 has the same clause'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/5?lang=eng'
    quote: 'in thy fear will I worship toward thy holy temple.'

  # ---- note 138:2 word ----
  - where: 'note 138:2 “A word greater than all His name”'
    claim: 'The Greek has no “word” in the line'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/138.htm'
    quote: 'for thou hast magnified thy holy name above every thing.'
  - where: 'note 138:2 “A word greater than all His name”'
    claim: 'A modern translation corrects the line'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20138&version=NRSVUE'
    quote: 'for you have exalted your name and your word'
  - where: 'note 138:2 “A word greater than all His name”'
    claim: 'Its footnote marks the rendering as a correction and gives the Hebrew'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20138&version=NRSVUE'
    quote: 'Cn: Heb you have exalted your word above all your name'
  - where: 'note 138:2 “A word greater than all His name”'
    claim: 'One older reading takes the word as a promise surpassing all by which God had made Himself a name'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/138.htm'
    quote: 'He has given a promise which infinitely surpasses everything by which He has hitherto established a name and memorial for Himself'
  - where: 'note 138:2 “A word greater than all His name”'
    claim: 'That reading has the promise through Nathan in view and compares 2 Samuel 7:21'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/138.htm'
    quote: 'If the promise by the mouth of Nathan (2 Samuel 7) is meant, then we may compare 2 Samuel 7:21.'
  - where: 'note 138:2 “A word greater than all His name”'
    claim: 'David says the great things were done for the LORD’s word’s sake'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'For thy word’s sake, and according to thine own heart, hast thou done all these great things, to make thy servant know them.'
  - where: 'note 138:2 “A word greater than all His name”'
    claim: 'David asks that the LORD’s name be magnified for ever'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'And let thy name be magnified for ever, saying, The Lord of hosts is the God over Israel'
  - where: 'note 138:2 “A word greater than all His name”'
    claim: 'On that reading mercy is God’s condescending love and truth His faithfulness'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/138.htm'
    quote: 'for His mercy, i.e., His anticipating, condescending love, and for His truth, i.e., truthfulness and faithfulness'

  # ---- note 138:6 ----
  - where: 'note 138:6 “The high LORD and the lowly”'
    claim: 'A modern translation begins verse 6 with “For”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20138&version=NRSVUE'
    quote: 'For though the Lord is high, he regards the lowly,'
  - where: 'note 138:6 “The high LORD and the lowly”'
    claim: 'A modern translation renders the second half'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20138&version=NRSVUE'
    quote: 'but the haughty he perceives from far away.'

  # ---- note 138:8 ----
  - where: 'note 138:8 “What the LORD will finish”'
    claim: 'After the verb the Hebrew has only a preposition with “me” (H1157), and no object'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בַּ֫עֲדִ֥/י'
  - where: 'note 138:8 “What the LORD will finish”'
    claim: 'The verb means to bring to an end, complete, and is the verb of Psalm 57:2 (Hebrew 57:3)'
    key: bdb
    url: 'https://biblehub.com/hebrew/1584.htm'
    quote: 'bring to an end, complete'
  - where: 'note 138:8 “What the LORD will finish”'
    claim: 'The lexicon renders the verb with “for me” at Psalm 57:3 and sets Psalm 138:8 beside it'
    key: bdb
    url: 'https://biblehub.com/hebrew/1584.htm'
    quote: 'God that completeth, accomplisheth, for me'
  - where: 'note 138:8 “What the LORD will finish”'
    claim: 'A modern translation supplies “his purpose”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20138&version=NRSVUE'
    quote: 'The Lord will fulfill his purpose for me;'
  - where: 'note 138:8 “What the LORD will finish”'
    claim: 'The Joseph Smith Translation reads “perfect me in knowledge, concerning his kingdom”'
    key: mcconkie-poetic-writings
    url: 'https://rsc.byu.edu/joseph-smith-translation/joseph-smith-poetic-writings'
    quote: 'is improved to read, “The Lord will perfect me in knowledge, concerning his kingdom.”'
  - where: 'note 138:8 “What the LORD will finish”'
    claim: 'The revision changes the closing plea into a declaration that the merciful Lord will not forsake'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'The Prophet changed Psalm 138 from a plea for God to remember his children to a doxology—a bold and positive declaration that the merciful Lord will not forsake them'

  # ---- christ ----
  - where: 'christ'
    claim: 'The LORD of the Old Testament is Jehovah, the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: 'christ'
    claim: 'Verse 8 has been read beside Philippians 1:6'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/138.htm'
    quote: 'the word begun He will carry out, ἐπιτελεῖν (Philippians 1:6)'
  - where: 'christ'
    claim: 'Paul names the day of Jesus Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/philip/1?lang=eng'
    quote: 'he which hath begun a good work in you will perform it until the day of Jesus Christ'

  # ---- explore ----
  - where: 'explore'
    claim: 'Psalm 57:2 has the verb of verse 8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/57?lang=eng'
    quote: 'unto God that performeth all things for me.'

  - where: 'explore'
    claim: 'Psalm 113 has the LORD on high looking on the low'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/113?lang=eng'
    quote: 'Who humbleth himself to behold the things that are in heaven, and in the earth!'
  - where: 'explore'
    claim: 'Psalm 139 opens with the LORD knowing a man’s thought from afar off'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/139?lang=eng'
    quote: 'thou understandest my thought afar off.'
  - where: 'explore'
    claim: 'One older reading sets Psalm 113:6 and Psalm 139:2 beside verse 6'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/138.htm'
    quote: 'unnoticed (Psalm 113:6), but on the contrary makes him the especial object of His regard; and on the other hand even from afar (cf. Psalm 139:2) He sees through'

  # ---- parallels ----
  - where: 'parallels'
    claim: 'The Lord commands a proclamation to all the kings of the world'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/124?lang=eng'
    quote: 'This proclamation shall be made to all the kings of the world, to the four corners thereof'
  - where: 'parallels'
    claim: 'Psalm 113 has the LORD dwelling on high and humbling Himself to behold'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/113?lang=eng'
    quote: 'Who is like unto the Lord our God, who dwelleth on high'
