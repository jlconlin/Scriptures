    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/38.htm'
    quote: 'renouncing all self-help, to abandon his cause to God'
  - where: 'note 38:13 “Why he does not answer”'
    claim: 'A modern translation cross-references Psalm 39:2 and 9 at this verse'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2038&version=NRSVUE'
    quote: '38.13 : Ps 39.2, 9'
  - where: 'note 38:13 “Why he does not answer”'
    claim: 'Psalm 39:9 gives the silence and its reason'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/39?lang=eng'
    quote: 'I was dumb, I opened not my mouth; because thou didst it.'

  # ---------- note 38:18 ----------
  - where: 'note 38:18 “Sorry means anxious”'
    claim: 'The verb means to be anxious, concerned, with this verse cited'
    key: bdb
    url: 'https://biblehub.com/hebrew/1672.htm'
    quote: '1 be anxious, concerned, with reference to, in behalf of'
  - where: 'note 38:18 “Sorry means anxious”'
    claim: 'The Greek has “be distressed”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/38.htm'
    quote: 'For I will declare mine iniquity, and be distressed for my sin.'
  - where: 'note 38:18 “Sorry means anxious”'
    claim: 'Psalm 32:5 reports forgiveness after confession'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/32?lang=eng'
    quote: 'and thou forgavest the iniquity of my sin'

  # ---------- note 38:20 ----------
  - where: 'note 38:20 “Guilty before God, wronged by men”'
    claim: 'One older reading: the good he follows is his conduct toward these foes'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/38.htm'
    quote: 'David means more particularly that which is brought into exercise in relation to his present foes.'
  - where: 'note 38:20 “Guilty before God, wronged by men”'
    claim: 'A modern translation reads “foes without cause” in verse 19'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2038&version=NRSVUE'
    quote: 'Those who are my foes without cause are mighty'
  - where: 'note 38:20 “Guilty before God, wronged by men”'
