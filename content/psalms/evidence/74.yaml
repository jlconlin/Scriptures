  # ---- note 74:14 ----
  - where: 'note 74:14 “Leviathan: Egypt at the sea, and the sea monster of creation”'
    claim: 'Leviathan is a great monster, here symbolic of a nation'
    key: bd-leviathan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/leviathan?lang=eng'
    quote: 'Any great sea or land monster, such as the crocodile, either as an actual creature (Job 41:1) or as symbolic of a nation (Ps. 74:14); a large serpent (Isa. 27:1).'
  - where: 'note 74:14 “Leviathan: Egypt at the sea, and the sea monster of creation”'
    claim: 'The lexicon takes Leviathan here as figurative of Egypt'
    key: bdb
    url: 'https://biblehub.com/hebrew/3882.htm'
    quote: 'figurative of Egypt as all-engulfing Psalm 74:14'
  - where: 'note 74:14 “Leviathan: Egypt at the sea, and the sea monster of creation”'
    claim: 'The lexicon glosses the dragons of verse 13 as the Egyptians'
    key: bdb
    url: 'https://biblehub.com/hebrew/8577.htm'
    quote: '3 sea- (or river-) monster, Genesis 1:21 (P); figurative Job 7:12; Psalm 74:13 (i.e. Egyptains)'
  - where: 'note 74:14 “Leviathan: Egypt at the sea, and the sea monster of creation”'
    claim: 'The Church’s footnotes to verse 15 point to the water from the rock and the crossing of the Jordan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/74?lang=eng'
    quote: 'Josh. 3:17 (14–17)'
  - where: 'note 74:14 “Leviathan: Egypt at the sea, and the sea monster of creation”'
    claim: 'Many scholars read these verses of a myth of the Lord killing a cosmic sea monster'
    key: sc-knowhy-866
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-talk-about-leviathan'
    quote: 'Although cryptic, these verses are understood by many biblical scholars to be a reference to a myth in which Yahweh kills a cosmic sea-monster.'
  - where: 'note 74:14 “Leviathan: Egypt at the sea, and the sea monster of creation”'
    claim: 'In the Babylonian story a god kills the sea monster and makes heaven and earth from her body'
    key: sc-knowhy-866
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-talk-about-leviathan'
    quote: 'After catching Tiamat in a cosmic net, he kills her and divides her body in two, using half to create the heavens and half to create the earth.'
  - where: 'note 74:14 “Leviathan: Egypt at the sea, and the sea monster of creation”'
    claim: 'The shared idea is a God who turns chaos into order'
    key: sc-knowhy-866
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-talk-about-leviathan'
    quote: 'Thus, both the Old Testament and Enuma Elish contain the notion of a God who destroys chaos and turns it into order.'
  - where: 'note 74:14 “Leviathan: Egypt at the sea, and the sea monster of creation”'
    claim: 'A modern translation has creatures of the wilderness, with a footnote that the Hebrew has “people”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2074&version=NRSVUE'
    quote: 'you gave him as food for the creatures of the wilderness.'
  - where: 'note 74:14 “Leviathan: Egypt at the sea, and the sea monster of creation”'
    claim: 'The Greek has the Ethiopian nations'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/74.htm'
    quote: 'thou didst give him for meat to the Ethiopian nations.'

