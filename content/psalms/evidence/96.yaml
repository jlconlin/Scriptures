chapter: 96
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'Psalm 96 has no title in the Church’s edition; the page opens with the chapter heading and verse 1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/96?lang=eng'
    quote: 'O sing unto the Lord a new song: sing unto the Lord, all the earth.'
  - where: when
    claim: 'In Chronicles the song is delivered on the day the ark is brought into David’s tent in Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'Then on that day David delivered first this psalm to thank the Lord into the hand of Asaph and his brethren'
  - where: setting
    claim: 'In Chronicles David delivers the song to Asaph on the day the ark is set in the tent he pitched for it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'So they brought the ark of God, and set it in the midst of the tent that David had pitched for it'
  - where: setting
    claim: '1 Chronicles 16:23–33 corresponds to Psalm 96:1–13'
    key: skinner-seeing-god
    url: 'https://rsc.byu.edu/ascending-mountain-lord/seeing-god-his-temple-significant-theme-israels-psalms'
    quote: '1 Chronicles 16:23–33 with Psalm 96:1–13'
  - where: setting
    claim: 'The song in 1 Chronicles 16 seems to be made of three canonical psalms'
    key: skinner-seeing-god
    url: 'https://rsc.byu.edu/ascending-mountain-lord/seeing-god-his-temple-significant-theme-israels-psalms'
    quote: 'seems to be an amalgamation of three other canonical psalms'
  - where: setting
    claim: 'The ancient Greek translation gives the psalm a title'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/96.htm'
    quote: 'When the house was built after the Captivity, a Song of David.'
  - where: setting
    claim: 'One older commentary takes the second half of the Greek title as rightly making the psalm post-exilic'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/96.htm'
    quote: 'By this the lxx correctly interprets the Psalm as a post-exilic song'
  - where: setting
    claim: 'Psalms 90–106 are one of the five sections of the book, and many of them are read of the millennial day and the Messiah’s reign'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'Many of these psalms describe the millennial day when Israel will find rest under the Messiah’s reign.'

  # ---------- thread ----------
  - where: thread
    claim: 'One older reading: the psalm gives joyous expression to the conviction that the religion of the LORD is for all mankind'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/96.htm'
    quote: 'The fact that the religion of Jahve is destined for mankind at large, here receives the most triumphantly joyous, lyrical expression.'

  # ---------- sections ----------
  - where: section 1 plain
    claim: '“Shew forth” is the verb for heralding glad tidings'
    key: bdb
    url: 'https://biblehub.com/hebrew/1319.htm'
    quote: 'herald as glad tidings: the salvation of God'
  - where: section 1 plain
    claim: 'A modern translation: nations, marvelous works, peoples'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2096&version=NRSVUE'
    quote: 'his marvelous works among all the peoples'
  - where: section 2 plain
    claim: 'The idols are worthless gods'
    key: bdb
    url: 'https://biblehub.com/hebrew/457.htm'
    quote: 'concrete worthless gods, idols'
  - where: section 2 plain
    claim: 'A modern translation has “revered” for “feared”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2096&version=NRSVUE'
    quote: 'he is to be revered above all gods'
  - where: section 3 plain
    claim: 'A modern translation: families of the peoples; holy splendor; tremble'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2096&version=NRSVUE'
    quote: 'Worship the Lord in holy splendor'
  - where: section 4 plain
    claim: 'A modern translation: is king; firmly established; equity; sing for joy; he is coming'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2096&version=NRSVUE'
    quote: 'He will judge the peoples with equity.'
  - where: section 4 plain
    claim: 'Another modern translation has “faithfulness” for “truth” in verse 13'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2096&version=ESV'
    quote: 'and the peoples in his faithfulness.'

  # ---------- note 96:1 ----------
  - where: 'note 96:1 “A new song for all the earth”'
    claim: 'One older reading: the new song presupposes a new state of things'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/96.htm'
    quote: 'The new song assumes a new form of things'
  - where: 'note 96:1 “A new song for all the earth”'
    claim: 'That new state is the beginning of the recognition of the LORD among all nations'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/96.htm'
    quote: 'of the recognition of Jahve throughout the whole world of nations, and of His accession to the lordship over the whole earth'
  - where: 'note 96:1 “A new song for all the earth”'
    claim: 'Isaiah 42:10 opens with the same words and goes on to the sea and all that is in it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/42?lang=eng'
    quote: 'Sing unto the Lord a new song, and his praise from the end of the earth, ye that go down to the sea, and all that is therein'
  - where: 'note 96:1 “A new song for all the earth”'
    claim: 'The older commentary notes that verse 1 is verbally the same as Isaiah 42:10'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/96.htm'
    quote: 'We read Psalm 96:1 verbally the same in Isaiah 42:10'
  - where: 'note 96:1 “A new song for all the earth”'
    claim: 'D&C 84:98: all who remain shall know the Lord and sing the new song together'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Until all shall know me, who remain, even from the least unto the greatest'
  - where: parallels
    claim: 'The Church’s footnote 1b on “song” cites D&C 84:98 (97–102)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/96?lang=eng'
    quote: '84:98 (97–102)'

  # ---------- note 96:2 ----------
  - where: 'note 96:2 “Shew forth is the verb for bringing good tidings”'
    claim: '“Shew forth” in verse 2 is the verb basar (H1319), an imperative'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בַּשְּׂר֥וּ'
  - where: 'note 96:2 “Shew forth is the verb for bringing good tidings”'
    claim: 'The verb means to bear tidings'
    key: bdb
    url: 'https://biblehub.com/hebrew/1319.htm'
    quote: 'verb bear tidings'
  - where: 'note 96:2 “Shew forth is the verb for bringing good tidings”'
    claim: 'In this verse it is to herald God’s salvation as glad tidings; the same sense is listed for Isaiah 52:7'
    key: bdb
    url: 'https://biblehub.com/hebrew/1319.htm'
    quote: 'herald as glad tidings: the salvation of God'
  - where: 'note 96:2 “Shew forth is the verb for bringing good tidings”'
    claim: 'The lexicon lists Psalm 96:2 and Isaiah 52:7 under the same sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/1319.htm'
    quote: 'His salvation daily Psalm 96:2 = 1 Chronicles 16:23'
  - where: 'note 96:2 “Shew forth is the verb for bringing good tidings”'
    claim: 'Isaiah 52:7: good tidings, salvation, and the message “Thy God reigneth”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/52?lang=eng'
    quote: 'that publisheth salvation; that saith unto Zion, Thy God reigneth!'

  # ---------- note 96:5 ----------
  - where: 'note 96:5 “Gods that are nothings”'
    claim: '“Gods” in verses 4 and 5 is elohim (H430); “idols” in verse 5 is elilim (H457)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֱלִילִ֑ים'
  - where: 'note 96:5 “Gods that are nothings”'
    claim: 'The plural means worthless gods, idols'
    key: bdb
    url: 'https://biblehub.com/hebrew/457.htm'
    quote: 'concrete worthless gods, idols'
  - where: 'note 96:5 “Gods that are nothings”'
    claim: 'Whatever its origin, the prophets associated the word with worthlessness and used it in ironic contrast with the words for God'
    key: bdb
    url: 'https://biblehub.com/hebrew/457.htm'
    quote: 'associated by the prophets with idea of worthlessness, & used by them in iron. contrast with'
  - where: 'note 96:5 “Gods that are nothings”'
    claim: 'Psalm 95:3 calls the LORD a great King above all gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/95?lang=eng'
    quote: 'For the Lord is a great God, and a great King above all gods.'

  # ---------- note 96:6 ----------
  - where: 'note 96:6 “The same song in Chronicles, before there was a temple”'
    claim: '1 Chronicles 16:23–33 corresponds to the whole of Psalm 96'
    key: skinner-seeing-god
    url: 'https://rsc.byu.edu/ascending-mountain-lord/seeing-god-his-temple-significant-theme-israels-psalms'
    quote: '1 Chronicles 16:23–33 with Psalm 96:1–13'
  - where: 'note 96:6 “The same song in Chronicles, before there was a temple”'
    claim: 'Chronicles has “place” where the psalm has “sanctuary”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'Glory and honour are in his presence; strength and gladness are in his place.'
  - where: 'note 96:6 “The same song in Chronicles, before there was a temple”'
    claim: 'Chronicles has “come before him” where the psalm has “come into his courts”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'bring an offering, and come before him: worship the Lord in the beauty of holiness.'
  - where: 'note 96:6 “The same song in Chronicles, before there was a temple”'
    claim: 'One older reading: the chronicler may have changed “sanctuary” to “place” because the temple was not yet built when the ark was brought in'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/96.htm'
    quote: 'because when the Ark was brought in, the Temple'
  - where: 'note 96:6 “The same song in Chronicles, before there was a temple”'
    claim: 'The Chronicles version begins without “O sing unto the LORD a new song”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'Sing unto the Lord, all the earth; shew forth from day to day his salvation.'
  - where: 'note 96:6 “The same song in Chronicles, before there was a temple”'
    claim: 'In Chronicles the cry stands among the rejoicing of heaven and earth, as what men are to say'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'Let the heavens be glad, and let the earth rejoice: and let men say among the nations, The Lord reigneth.'
  - where: 'note 96:6 “The same song in Chronicles, before there was a temple”'
    claim: 'The Chronicles version ends at the coming to judge, without the psalm’s last line'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'Then shall the trees of the wood sing out at the presence of the Lord, because he cometh to judge the earth.'
  - where: 'note 96:6 “The same song in Chronicles, before there was a temple”'
    claim: 'The song in Chronicles joins this psalm to parts of Psalms 105 and 106'
    key: skinner-seeing-god
    url: 'https://rsc.byu.edu/ascending-mountain-lord/seeing-god-his-temple-significant-theme-israels-psalms'
    quote: '1 Chronicles 16:8–22 corresponds with Psalm 105:1–15; 1 Chronicles 16:23–33 with Psalm 96:1–13; and 1 Chronicles 16:34–36 with Psalm 106:1, 47–48'
  - where: 'note 96:6 “The same song in Chronicles, before there was a temple”'
    claim: 'A BYU study allows that the Chronicles song may well be later than the psalms it resembles'
    key: skinner-seeing-god
    url: 'https://rsc.byu.edu/ascending-mountain-lord/seeing-god-his-temple-significant-theme-israels-psalms'
    quote: 'While this may well mean that 1 Chronicles 16 was composed later than the psalms it resembles'
  - where: 'note 96:6 “The same song in Chronicles, before there was a temple”'
    claim: 'The older commentary holds that the chronicler strung together passages of the Psalms'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/96.htm'
    quote: 'he there strings together familiar reminiscences of the Psalms'
  - where: 'note 96:6 “The same song in Chronicles, before there was a temple”'
    claim: 'The scene in Chronicles: Levites with psalteries, harps and cymbals before the ark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'Jeiel with psalteries and with harps; but Asaph made a sound with cymbals'

  - where: 'note 96:6 “The same song in Chronicles, before there was a temple”'
    claim: 'The same study still holds that 1 Chronicles 16 preserves the authentic historical setting for Psalm 105'
    key: skinner-seeing-god
    url: 'https://rsc.byu.edu/ascending-mountain-lord/seeing-god-his-temple-significant-theme-israels-psalms'
    quote: 'I believe that 1 Chronicles 16 preserves the authentic historical setting for Psalm 105'
  - where: 'note 96:6 “The same song in Chronicles, before there was a temple”'
    claim: 'Priests with trumpets stood before the ark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'Benaiah also and Jahaziel the priests with trumpets'

  # ---------- note 96:7 ----------
  - where: 'note 96:7 “The lines of Psalm 29, addressed to the nations”'
    claim: 'Psalm 29:1–2 has the same three “give” lines, addressed to the mighty'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/29?lang=eng'
    quote: 'Give unto the Lord, O ye mighty, give unto the Lord glory and strength.'
  - where: 'note 96:7 “The lines of Psalm 29, addressed to the nations”'
    claim: 'A modern translation has “families of the peoples”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2096&version=NRSVUE'
    quote: 'Ascribe to the Lord, O families of the peoples'

  # ---------- note 96:10 ----------
  - where: 'note 96:10 “What the nations are to be told”'
    claim: 'A modern translation of the first clause'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2096&version=NRSVUE'
    quote: 'Say among the nations, “The Lord is king!'
  - where: 'note 96:10 “What the nations are to be told”'
    claim: 'A modern translation makes the second clause a present fact'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2096&version=NRSVUE'
    quote: 'The world is firmly established; it shall never be moved.'

  - where: 'note 96:10 “What the nations are to be told”'
    claim: 'Psalm 93:1 has the same line about the world, in the present in the King James'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/93?lang=eng'
    quote: 'the world also is stablished, that it cannot be moved'

  # ---------- note 96:12 ----------
  - where: 'note 96:12 “Why the trees sing at a judgment”'
    claim: 'The verb “judge” in verse 13 is shaphat (H8199)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יִשְׁפֹּֽט'
  - where: 'note 96:12 “Why the trees sing at a judgment”'
    claim: 'The verb means to act as law-giver, judge, governor'
    key: bdb
    url: 'https://biblehub.com/hebrew/8199.htm'
    quote: 'act as law-giver, judge, governor (giving law, deciding controversies and executing law, civil, religious, political, social; both early and late)'
  - where: 'note 96:12 “Why the trees sing at a judgment”'
    claim: 'Psalm 67:4 sets judging beside governing as the nations’ reason for joy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/67?lang=eng'
    quote: 'O let the nations be glad and sing for joy: for thou shalt judge the people righteously, and govern the nations upon earth.'
  - where: 'note 96:12 “Why the trees sing at a judgment”'
    claim: 'Another modern translation has “faithfulness”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2096&version=ESV'
    quote: 'and the peoples in his faithfulness.'

  - where: christ
    claim: 'John 5:22: all judgment is committed to the Son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/5?lang=eng'
    quote: 'For the Father judgeth no man, but hath committed all judgment unto the Son'

  # ---------- christ ----------
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'

  # ---------- explore / parallels ----------
  - where: explore
    claim: 'The parts of 1 Chronicles 16 and the psalms they correspond to'
    key: skinner-seeing-god
    url: 'https://rsc.byu.edu/ascending-mountain-lord/seeing-god-his-temple-significant-theme-israels-psalms'
    quote: '1 Chronicles 16:8–22 corresponds with Psalm 105:1–15; 1 Chronicles 16:23–33 with Psalm 96:1–13; and 1 Chronicles 16:34–36 with Psalm 106:1, 47–48'
  - where: explore
    claim: 'Psalm 98 closes with the coming to judge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/98?lang=eng'
    quote: 'Before the Lord; for he cometh to judge the earth'
  - where: 'note 96:1 “A new song for all the earth”'
    claim: 'D&C 84:99–102 gives the words of the new song'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'The Lord hath brought again Zion'
  - where: parallels
    claim: 'Isaiah 52:7: the bringer of good tidings says “Thy God reigneth”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/52?lang=eng'
    quote: 'that saith unto Zion, Thy God reigneth!'
  - where: parallels
    claim: 'Psalm 98:7–9: the sea roars before the LORD who comes to judge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/98?lang=eng'
    quote: 'Let the sea roar, and the fulness thereof; the world, and they that dwell therein.'
