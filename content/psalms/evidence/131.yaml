chapter: 131
claims:
  - where: 'setting'
    claim: 'One older reading (Delitzsch) hears the psalm as an echo of David’s answer to Michal in 2 Samuel 6:21–22.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/131.htm'
    quote: 'it is like an echo of the answer (2 Samuel 6:21.) with which David repelled the mocking observation of Michal'
  - where: 'setting'
    claim: 'Delitzsch takes David as the model of the psalm’s state of mind and supposes a later poet holding him up to Israel after the Exile.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/131.htm'
    quote: 'In general David is the model of the state of mind which the poet expresses here'
  - where: 'setting'
    claim: 'Delitzsch places the poet and his hearers after the Exile.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/131.htm'
    quote: 'to the Israel of the period after the Exile'
  - where: 'setting'
    claim: 'David answered Michal that he would be base in his own sight.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/6?lang=eng'
    quote: 'And I will yet be more vile than thus, and will be base in mine own sight'
  - where: 'setting'
    claim: 'Michal saw David dancing as the ark came into the city and despised him.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/6?lang=eng'
    quote: 'saw king David leaping and dancing before the Lord; and she despised him in her heart.'
  - where: 'setting'
    claim: 'The title ascribes the psalm to David, and the psalm has three verses.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/131?lang=eng'
    quote: 'A Song of degrees of David.'
  - where: 'setting'
    claim: 'Psalm 130:7 has the call that Psalm 131:3 repeats.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/130?lang=eng'
    quote: 'Let Israel hope in the Lord: for with the Lord there is mercy'
  - where: 'thread'
    claim: 'Verse 1 disowns pride in three places: the heart, the eyes, and what a person goes after.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/131.htm'
    quote: 'Pride has its seat in the heart, in the eyes especially it finds its expression, and great things are its sphere'
  - where: 'thread'
    claim: 'What verse 1 gives up is overreach, not effort: the opposite of the too-wonderful is the attainable.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/131.htm'
    quote: 'is not that which is trivial, but that which is attainable'
  - where: 'section 1 plain'
    claim: '“Exercise myself” is rendered as busying oneself, and “too high” as too wonderful.'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20131&version=NRSVUE'
    quote: 'I do not occupy myself with things'
  - where: 'section 2 plain'
    claim: '“Behaved and quieted myself” is rendered as levelling and stilling the soul.'
    key: bdb
    url: 'https://biblehub.com/hebrew/7737.htm'
    quote: 'I have smoothed (composed) and stilled my soul'
  - where: 'section 2 plain'
    claim: 'The last clause of verse 2 is rendered with the soul beside or within the speaker.'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20131&version=NRSVUE'
    quote: 'Or my soul within me is like a weaned child'
  - where: 'section 3 plain'
    claim: '“From henceforth” is rendered “from now on.”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20131&version=NRSVUE'
    quote: 'from this time on and forevermore'

  - where: 'note 131:1 “What he does not reach for”'
    claim: 'The Hebrew behind “too high for me” means too difficult to understand, and the lexicon lists Job 42:3 under the same sense.'
    key: bdb
    url: 'https://biblehub.com/hebrew/6381.htm'
    quote: 'be difficult to understand; with מן person too difficult for Psalm 131:1; Proverbs 30:18; Job 42:3'
  - where: 'note 131:1 “What he does not reach for”'
    claim: 'A modern translation has “too great and too marvelous for me.”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20131&version=NRSVUE'
    quote: 'too great and too marvelous for me.'
  - where: 'note 131:1 “What he does not reach for”'
    claim: 'A modern translation renders “exercise myself” as “occupy myself.”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20131&version=NRSVUE'
    quote: 'I do not occupy myself with things'
  - where: 'note 131:1 “What he does not reach for”'
    claim: 'Job confesses that he spoke of things too wonderful for him, which he did not understand.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/42?lang=eng'
    quote: 'therefore have I uttered that I understood not; things too wonderful for me, which I knew not.'

  - where: 'note 131:2 “A soul levelled and made still”'
    claim: 'The lexicon renders the clause “I have smoothed (composed) and stilled my soul”; the object is “my soul.”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7737.htm'
    quote: 'I have smoothed (composed) and stilled my soul'
  - where: 'note 131:2 “A soul levelled and made still”'
    claim: 'The same verb in Isaiah 28:25 is the levelling of ground.'
    key: bdb
    url: 'https://biblehub.com/hebrew/7737.htm'
    quote: 'Isaiah 28:25 he hath levelled its'
  - where: 'note 131:2 “A soul levelled and made still”'
    claim: 'A modern translation has “I have calmed and quieted my soul.”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20131&version=NRSVUE'
    quote: 'But I have calmed and quieted my soul,'
  - where: 'note 131:2 “A soul levelled and made still”'
    claim: 'Isaiah’s ploughman makes the face of the ground plain before he sows.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/28?lang=eng'
    quote: 'When he hath made plain the face thereof, doth he not cast abroad the fitches'

  - where: 'note 131:2 “Why a weaned child”'
    claim: 'To wean is to complete a child’s nursing; the word in Psalm 131:2 is a weaned child.'
    key: bdb
    url: 'https://biblehub.com/hebrew/1580.htm'
    quote: 'wean a child (complete his nursing)'
  - where: 'note 131:2 “Why a weaned child”'
    claim: 'Abraham made a feast on the day Isaac was weaned.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/21?lang=eng'
    quote: 'Abraham made a great feast the same day that Isaac was weaned.'
  - where: 'note 131:2 “Why a weaned child”'
    claim: 'Hannah kept Samuel at home until he was weaned and then brought him to the house of the Lord to stay.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/1?lang=eng'
    quote: 'I will not go up until the child be weaned, and then I will bring him, that he may appear before the Lord, and there abide for ever.'
  - where: 'note 131:2 “Why a weaned child”'
    claim: 'Delitzsch: the child is fully weaned, not one just beginning.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/131.htm'
    quote: 'not one that is only just begun to be weaned, but an actually weaned child'
  - where: 'note 131:2 “Why a weaned child”'
    claim: 'Delitzsch: such a child lies on its mother without craving the breast, content to have her.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/131.htm'
    quote: 'without crying impatiently and craving for its mother''s breast, but contented with the fact that it has its mother'
  - where: 'note 131:2 “Why a weaned child”'
    claim: 'Delitzsch: the soul, restless by nature, is stilled.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/131.htm'
    quote: 'his soul, which is by nature restless and craving, is stilled'
  - where: 'note 131:2 “Why a weaned child”'
    claim: 'Delitzsch: the soul does not want God’s gifts but is satisfied in fellowship with Him.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/131.htm'
    quote: 'it does not long after earthly enjoyment and earthly good that God should give these to it, but it is satisfied in the fellowship of God'
  - where: 'note 131:2 “Why a weaned child”'
    claim: 'A modern translation renders the last clause “my soul is like the weaned child that is with me.”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20131&version=NRSVUE'
    quote: 'my soul is like the weaned child that is with me.'
  - where: 'note 131:2 “Why a weaned child”'
    claim: 'The same translation gives an alternative in its footnote.'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20131&version=NRSVUE'
    quote: 'Or my soul within me is like a weaned child'

  - where: 'note 131:2 “Humbled as a little child”'
    claim: 'A modern translation’s cross-references set Matthew 18:3 beside Psalm 131:2.'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20131&version=NRSVUE'
    quote: '131.2 : Ps 62.1; Mt 18.3; 1 Cor 14.20'
  - where: 'note 131:2 “Humbled as a little child”'
    claim: 'The Savior set a child among the disciples and said they must become as little children and humble themselves as the child.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/18?lang=eng'
    quote: 'Whosoever therefore shall humble himself as this little child, the same is greatest in the kingdom of heaven.'

  - where: 'christ'
    claim: 'The note on verse 2 rests on the cross-reference a modern translation gives to Matthew 18:3.'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20131&version=NRSVUE'
    quote: '131.2 : Ps 62.1; Mt 18.3; 1 Cor 14.20'
  - where: 'explore'
    claim: 'Lamentations 3:26 speaks of waiting quietly for the Lord’s salvation.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/3?lang=eng'
    quote: 'It is good that a man should both hope and quietly wait for the salvation of the Lord.'
  - where: 'explore'
    claim: 'Psalm 62:1 has the soul waiting on God.'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/62?lang=eng'
    quote: 'Truly my soul waiteth upon God: from him cometh my salvation.'
  - where: 'explore'
    claim: 'Delitzsch explains the verb “quieted” from Psalm 62:1 (Hebrew 62:2) and Lamentations 3:26.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/131.htm'
    quote: 'in Psalm 62:2, and'
  - where: 'explore'
    claim: 'A modern translation cross-references Psalm 62:1 at verse 2.'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20131&version=NRSVUE'
    quote: '131.2 : Ps 62.1; Mt 18.3; 1 Cor 14.20'
  - where: 'explore'
    claim: 'One older reading hears David’s answer to Michal behind the psalm.'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/131.htm'
    quote: 'it is like an echo of the answer (2 Samuel 6:21.) with which David repelled the mocking observation of Michal'
