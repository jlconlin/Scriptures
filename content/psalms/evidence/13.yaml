chapter: 13
claims:
  # ---- when, setting ----
  - where: 'when'
    claim: 'The title ascribes the psalm to David and names no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/13?lang=eng'
    quote: 'To the chief Musician, A Psalm of David.'
  - where: 'setting'
    claim: 'The title ascribes the psalm to David and names no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/13?lang=eng'
    quote: 'To the chief Musician, A Psalm of David.'
  - where: 'setting'
    claim: 'The psalm is a lament in the face of perils from enemies'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'This psalm, like many others, presents the psalmist’s lament to God in the face of perils at the hands of wicked enemies.'
  - where: 'setting'
    claim: 'An older commentary relays the suggestion that the psalm belongs to the time of Saul’s pursuit of David'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/13.htm'
    quote: 'Hitzig assigns Psalm 13:1-6 to the time when Saul posted watchers to hunt David from place to place'
  - where: 'setting'
    claim: 'The commentary gives that suggestion only a “perhaps”'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/13.htm'
    quote: 'Perhaps this view is correct.'
  - where: 'setting'
    claim: 'The psalm has affinities with Joseph Smith’s prayer in Liberty Jail'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'its affinities with Joseph Smith’s prayerful lament in Liberty Jail recorded in Doctrine and Covenants 121'
  - where: 'setting'
    claim: 'The psalm has affinities with Nephi’s psalm in 2 Nephi 4'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'its affinities with Nephi’s Psalm, found in 2 Nephi 4'

  # ---- thread ----
  - where: 'thread'
    claim: 'The psalm falls into three groups of decreasing size'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/13.htm'
    quote: 'The Psalm consists of three strophes, or if it be preferred, three groups of decreasing magnitude.'
  - where: 'thread'
    claim: 'Five lines of lament, four of prayer, three of anticipation'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/13.htm'
    quote: 'Three lines of joyous anticipation now follow the five of lament and four of prayer.'
  - where: 'thread'
    claim: 'The image of ever smaller waves until the sea is still'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/13.htm'
    quote: 'This song as it were casts up constantly lessening waves, until it becomes still as the sea when smooth as a mirror'
  - where: 'thread'
    claim: 'Verse 3 has three imperatives; the first is a causative imperative (“look”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הַבִּ֣יטָֽ/ה'
  - where: 'thread'
    claim: '“Hear me” is the verb answer'
    key: bdb
    url: 'https://biblehub.com/hebrew/6030.htm'
    quote: 'verb answer, respond'
  - where: 'thread'
    claim: 'A modern translation has “answer me”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2013&version=NRSVUE'
    quote: 'Consider and answer me, O Lord my God!'
  - where: 'thread'
    claim: 'The psalm records no answer from the Lord'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Whereas Psalm 13 does not record an answer from the Lord'
  - where: 'thread'
    claim: 'The enemies’ rejoicing in verse 4 is the same Hebrew verb as the heart’s rejoicing in verse 5 (verse 4 form)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יָ֝גִ֗ילוּ'
  - where: 'thread'
    claim: 'The enemies’ rejoicing in verse 4 is the same Hebrew verb as the heart’s rejoicing in verse 5 (verse 5 form)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יָ֤גֵ֥ל'
  - where: 'thread'
    claim: 'The first request is matched to the complaint that God has forgotten'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/13.htm'
    quote: 'In contrast to God''s seeming to have forgotten him and to wish neither to see nor know anything of his need, he prays'
  - where: 'thread'
    claim: 'The second request is matched to his perplexity'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/13.htm'
    quote: 'In contrast to his being in perplexity what course to take and unable to help himself, he prays'
  - where: 'thread'
    claim: 'The third request is matched to the enemy’s triumph'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/13.htm'
    quote: 'In contrast to the triumphing of his foe'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Daily” rendered “all day long”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2013&version=NRSVUE'
    quote: 'and have sorrow in my heart all day long?'
  - where: 'section 2 plain'
    claim: '“Hear me” rendered “answer me”; “moved” rendered “shaken”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2013&version=NRSVUE'
    quote: 'my foes will rejoice because I am shaken.'
  - where: 'section 3 plain'
    claim: '“Mercy” rendered “steadfast love”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2013&version=NRSVUE'
    quote: 'But I trusted in your steadfast love;'

  # ---- note 13:1 How long ----
  - where: 'note 13:1 “How long, four times, and for ever”'
    claim: 'The Hebrew question (“until when”) opens verse 1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אָ֣נָה'
  - where: 'note 13:1 “How long, four times, and for ever”'
    claim: 'The same question stands again in verse 2 (four times in all, by the word list of verses 1–2)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אָ֨נָה'
  - where: 'note 13:1 “How long, four times, and for ever”'
    claim: 'The word behind “for ever” means everlastingness, and its short form stands in this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/5331.htm'
    quote: 'everlastingness, ever, usually לָנֶצַח for ever'
  - where: 'note 13:1 “How long, four times, and for ever”'
    claim: 'The lexicon lists this verse (Hebrew 13:2) with Psalms 74:10, 79:5 and 89:47 (King James 89:46) under the same word'
    key: bdb
    url: 'https://biblehub.com/hebrew/5331.htm'
    quote: 'Psalm 74:10; Psalm 74:19; Psalm 77:9; Psalm 79:5; Psalm 89:47'
  - where: 'note 13:1 “How long, four times, and for ever”'
    claim: 'A modern translation divides the line differently'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2013&version=NRSVUE'
    quote: 'How long, O Lord? Will you forget me forever?'
  - where: 'note 13:1 “How long, four times, and for ever”'
    claim: 'The King James wording of the verse, with “for ever?” as its own question'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/13?lang=eng'
    quote: 'How long wilt thou forget me, O Lord? for ever? how long wilt thou hide thy face from me?'

  # ---- note 13:1 hidden face ----
  - where: 'note 13:1 “The hidden face”'
    claim: 'For the LORD to hide His face from someone is to withdraw His favour'
    key: bdb
    url: 'https://biblehub.com/hebrew/5641.htm'
    quote: 'hides his face from (מִן person), i.e. withdraws his favour'
  - where: 'note 13:1 “The hidden face”'
    claim: 'The lexicon lists Deuteronomy 31:17 and this verse (Hebrew 13:2) under that sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/5641.htm'
    quote: 'Deuteronomy 31:17; Deuteronomy 32:20; Jeremiah 33:5; Ezekiel 39:23,24,29; Psalm 13:2'
  - where: 'note 13:1 “The hidden face”'
    claim: 'Deuteronomy 31:17 is set beside this verse'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Deuteronomy 31:17; Psalms 10:1; 35:17; 88:14; 89:46; Lamentations 5:20; Doctrine and Covenants 121'
  - where: 'note 13:1 “The hidden face”'
    claim: 'In Deuteronomy the LORD hides His face because Israel has turned to other gods'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/31?lang=eng'
    quote: 'And I will surely hide my face in that day for all the evils which they shall have wrought, in that they are turned unto other gods.'

  # ---- note 13:2 counsel ----
  - where: 'note 13:2 “Counsel in the soul”'
    claim: 'The Hebrew noun is plural (“counsels”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'עֵצ֡וֹת'
  - where: 'note 13:2 “Counsel in the soul”'
    claim: 'The noun means counsel or advice, and the lexicon cites this phrase (Hebrew 13:3)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6098.htm'
    quote: 'אָשִׁית עֵצוֺת בְּנַפְשִׁי Psalm 13:3'
  - where: 'note 13:2 “Counsel in the soul”'
    claim: 'A modern translation reads “pain” with the Syriac'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2013&version=NRSVUE'
    quote: 'How long must I bear pain in my soul'
  - where: 'note 13:2 “Counsel in the soul”'
    claim: 'Its footnote gives the Hebrew as “hold counsels”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2013&version=NRSVUE'
    quote: 'Syr: Heb hold counsels'
  - where: 'note 13:2 “Counsel in the soul”'
    claim: 'The same translation has “all day long” for “daily”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2013&version=NRSVUE'
    quote: 'and have sorrow in my heart all day long?'

  # ---- note 13:2 Joseph Smith ----
  - where: 'note 13:2 “Joseph Smith asks the same question”'
    claim: 'The psalm has affinities with Joseph Smith’s prayer in Liberty Jail (D&C 121:1–2)'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'its affinities with Joseph Smith’s prayerful lament in Liberty Jail recorded in Doctrine and Covenants 121. Compare Psalm 13:1–2 with Doctrine and Covenants 121:1–2'
  - where: 'note 13:2 “Joseph Smith asks the same question”'
    claim: 'The psalm records no answer; Joseph Smith received one (D&C 121:7–9)'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Whereas Psalm 13 does not record an answer from the Lord, Joseph Smith received an extensive response in Doctrine and Covenants 121 that comforted his troubled heart.'
  - where: 'note 13:2 “Joseph Smith asks the same question”'
    claim: 'Joseph Smith’s prayer asks “how long” twice and speaks of God’s hiding place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/121?lang=eng'
    quote: 'Yea, O Lord, how long shall they suffer these wrongs and unlawful oppressions'
  - where: 'note 13:2 “Joseph Smith asks the same question”'
    claim: 'The Lord’s answer speaks of the length of the affliction and of the foes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/121?lang=eng'
    quote: 'And then, if thou endure it well, God shall exalt thee on high; thou shalt triumph over all thy foes.'
  - where: 'note 13:2 “Joseph Smith asks the same question”'
    claim: 'The answer calls the affliction a small moment'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/121?lang=eng'
    quote: 'thine adversity and thine afflictions shall be but a small moment'

  # ---- note 13:3 lighten ----
  - where: 'note 13:3 “Light in the eyes is life”'
    claim: 'The lexicon’s sense “lighten, of the eyes,” with this verse (Hebrew 13:4) and Ezra 9:8'
    key: bdb
    url: 'https://biblehub.com/hebrew/215.htm'
    quote: 'lighten, of the eyes, הָאִיר עֵינַיִם, subject ׳י, his law, etc. Proverbs 29:13; Psalm 13:4; Psalm 19:9; Ezra 9:8.'
  - where: 'note 13:3 “Light in the eyes is life”'
    claim: 'To lighten dimmed eyes is to impart new life, seen in the brightness of the eye, as with Jonathan'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/13.htm'
    quote: 'To lighten the eyes that are dimmed with sorrow and ready to break, is equivalent to, to impart new life (Ezra 9:8), which is reflected in the fresh clear brightness of the eye (1 Samuel 14:27, 1 Samuel 14:29).'
  - where: 'note 13:3 “Light in the eyes is life”'
    claim: 'Jonathan’s eyes were enlightened when he ate'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/14?lang=eng'
    quote: 'see, I pray you, how mine eyes have been enlightened, because I tasted a little of this honey.'
  - where: 'note 13:3 “Light in the eyes is life”'
    claim: 'Ezra uses the phrase for a little reviving'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/9?lang=eng'
    quote: 'that our God may lighten our eyes, and give us a little reviving in our bondage.'
  - where: 'note 13:3 “Light in the eyes is life”'
    claim: 'The same verb, in the same stem, is used of God’s face shining in the priestly blessing'
    key: bdb
    url: 'https://biblehub.com/hebrew/215.htm'
    quote: 'make shine, of face of God'
  - where: 'note 13:3 “Light in the eyes is life”'
    claim: 'That sense is the priest’s blessing of Numbers 6:25, which reappears in Psalm 31:17 (King James 31:16)'
    key: bdb
    url: 'https://biblehub.com/hebrew/215.htm'
    quote: 'Numbers 6:25 (priest''s blessing), reappearing Psalm 31:17'
  - where: 'note 13:3 “Light in the eyes is life”'
    claim: 'One reading: the light asked for is the light of God’s face'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/13.htm'
    quote: 'The lightening light, to which האיר points, is the light of love beaming from the divine countenance, Psalm 31:17.'
  - where: 'note 13:3 “Light in the eyes is life”'
    claim: 'The prayer is that the enemy’s triumph not be completed by his dying'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/13.htm'
    quote: 'in order that the triumph of his enemy may not be made complete by his dying'
  - where: 'note 13:3 “Light in the eyes is life”'
    claim: 'The Hebrew has “lest I sleep the death” (the noun death with the article)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הַ/מָּֽוֶת'
  - where: 'note 13:3 “Light in the eyes is life”'
    claim: 'The Greek has “lest I sleep in death”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/13.htm'
    quote: 'lighten mine eyes, lest I sleep in death;'

  # ---- note 13:4 moved ----
  - where: 'note 13:4 “Moved means shaken”'
    claim: 'The verb means be shaken, moved, overthrown'
    key: bdb
    url: 'https://biblehub.com/hebrew/4131.htm'
    quote: 'all in poetry, mostly with negative (בַּל13t.; לֹא6t.), be shaken, moved, overthrown'
  - where: 'note 13:4 “Moved means shaken”'
    claim: 'It is often said, with a negative, of the righteous as secure; this verse (Hebrew 13:5) is without the negative'
    key: bdb
    url: 'https://biblehub.com/hebrew/4131.htm'
    quote: 'often of righteous, as secure, Psalm 10:6; Psalm 15:5; Psalm 16:8'
  - where: 'note 13:4 “Moved means shaken”'
    claim: 'This verse is listed as a case without the negative'
    key: bdb
    url: 'https://biblehub.com/hebrew/4131.htm'
    quote: 'compare (without negative) Psalm 13:5'
  - where: 'note 13:4 “Moved means shaken”'
    claim: 'A modern translation has “shaken”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2013&version=NRSVUE'
    quote: 'my foes will rejoice because I am shaken.'

  # ---- note 13:5 the turn ----
  - where: 'note 13:5 “The turn, before any answer”'
    claim: 'The Hebrew of verse 5 begins with “and I,” the pronoun written out'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וַ/אֲנִ֤י'
  - where: 'note 13:5 “The turn, before any answer”'
    claim: 'The word behind “mercy” is hesed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בְּ/חַסְדְּ/ךָ֣'
  - where: 'note 13:5 “The turn, before any answer”'
    claim: 'A modern translation has “I trusted” and “steadfast love”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2013&version=NRSVUE'
    quote: 'But I trusted in your steadfast love;'
  - where: 'note 13:5 “The turn, before any answer”'
    claim: 'The psalm records no answer from the Lord'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Whereas Psalm 13 does not record an answer from the Lord'
  - where: 'note 13:5 “The turn, before any answer”'
    claim: 'The psalmist’s faith is what leads him to trust and to sing'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'The psalmist, in Psalm 13, had also gained great faith in the Lord, leading him to trust in God’s mercy'
  - where: 'note 13:5 “The turn, before any answer”'
    claim: 'A lament’s usual elements include a confession of trust and a vow of praise'
    key: sc-knowhy-438
    url: 'https://scripturecentral.org/knowhy/why-do-biblical-psalms-of-lament-show-up-in-the-book-of-mormon'
    quote: '(1) invocation, (2) complaint, (3) confession of trust, (4) petition, and (5) vow of praise'
  - where: 'note 13:5 “The turn, before any answer”'
    claim: 'Nephi’s psalm is compared with verses 5–6'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Compare, for example, the similarity in wording and meaning in the following phrases:'
  - where: 'note 13:5 “The turn, before any answer”'
    claim: 'Psalm 13:5 is listed among the psalm verses that 2 Nephi 4:19 may allude to'
    key: hilton-psalms-bom
    url: 'https://rsc.byu.edu/ascending-mountain-lord/old-testament-psalms-book-mormon'
    quote: 'nevertheless, I know in whom I have trusted [Psalms 13:5; 26:1; 33:21]'
  - where: 'note 13:5 “The turn, before any answer”'
    claim: 'The study treats such matches as potential allusions'
    key: hilton-psalms-bom
    url: 'https://rsc.byu.edu/ascending-mountain-lord/old-testament-psalms-book-mormon'
    quote: 'In this paper I focus on potential textual allusions'
  - where: 'note 13:5 “The turn, before any answer”'
    claim: 'Nephi’s words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/4?lang=eng'
    quote: 'nevertheless, I know in whom I have trusted.'

  # ---- note 13:6 bountifully ----
  - where: 'note 13:6 “A song for what the LORD has done”'
    claim: 'The verb with this preposition means deal bountifully with; this verse and Psalm 116:7 are listed'
    key: bdb
    url: 'https://biblehub.com/hebrew/1580.htm'
    quote: 'with עַל person deal bountifully with Psalm 13:6; Psalm 116:7; Psalm 119:17; Psalm 142:8'
  - where: 'note 13:6 “A song for what the LORD has done”'
    claim: 'The verb is in the perfect (completed action)'
    key: bdb
    url: 'https://biblehub.com/hebrew/1580.htm'
    quote: 'Qal Perfect Psalm 13:6'
  - where: 'note 13:6 “A song for what the LORD has done”'
    claim: 'The verb as it stands in the Hebrew text'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'גָמַ֣ל'
  - where: 'note 13:6 “A song for what the LORD has done”'
    claim: 'One reading of the perfect: the song is for the time when the deed is done'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/13.htm'
    quote: 'The perfect in Psalm 13:6 is to be properly understood thus: the celebration follows the fact that inspires him to song.'
  - where: 'note 13:6 “A song for what the LORD has done”'
    claim: 'The last verses are anticipation, sure of being answered'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/13.htm'
    quote: 'the believing joy which anticipates the certainty of being answered'
  - where: 'note 13:6 “A song for what the LORD has done”'
    claim: 'Outwardly nothing need have changed'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/13.htm'
    quote: 'Though it rage without as much now as ever - peace reigns in the depth of his heart.'

  # ---- christ ----
  - where: 'christ'
    claim: 'Jehovah, the LORD of the Old Testament, is the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: 'christ'
    claim: 'The divine name stands in verses 1, 3 and 6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לַ/יהוָ֑ה'
  - where: 'christ'
    claim: '“Salvation” in verse 5 (Hebrew 13:6) is yeshuah, salvation by God, here with a verb of rejoicing'
    key: bdb
    url: 'https://biblehub.com/hebrew/3444.htm'
    quote: 'with verbs of rejoicing בישׁועה 1 Samuel 2:1; Isaiah 25:9; Psalm 9:15; Psalm 13:6'
  - where: 'christ'
    claim: 'The noun is used of salvation by God'
    key: bdb
    url: 'https://biblehub.com/hebrew/3444.htm'
    quote: 'salvation by God, primarily from external evils'
  - where: 'christ'
    claim: 'The same cry from Liberty Jail received an answer'
    key: ot-minute-psalms-1-20
