chapter: 121
claims:
  - where: 'when'
    claim: 'The songs of degrees are fifteen psalms, 120–134'
    key: bd-degrees-songs-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/degrees-songs-of?lang=eng'
    quote: 'Fifteen Psalms (120–34), probably so called because they were sung by Jewish pilgrims on their way up to Jerusalem.'

  - where: 'setting'
    claim: 'The songs of degrees were probably so called because pilgrims sang them on the way up to Jerusalem'
    key: bd-degrees-songs-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/degrees-songs-of?lang=eng'
    quote: 'probably so called because they were sung by Jewish pilgrims on their way up to Jerusalem'

  - where: 'setting'
    claim: 'Psalm 121 was likely a hymn for pilgrims on the way to the temple'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'Psalm 121 likely was used as a liturgical hymn for the use of pilgrims on their way to the temple in Jerusalem.'

  - where: 'setting'
    claim: 'The psalm bears the title “A Song of degrees” and names no author or occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/121?lang=eng'
    quote: 'A Song of degrees.'

  - where: 'setting'
    claim: 'Psalm 120 is sung far from home, among those who hate peace'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/120?lang=eng'
    quote: 'Woe is me, that I sojourn in Mesech, that I dwell in the tents of Kedar!'

  - where: 'setting'
    claim: 'Psalm 120:6 speaks of dwelling with one who hates peace'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/120?lang=eng'
    quote: 'My soul hath long dwelt with him that hateth peace.'

  - where: 'setting'
    claim: 'Psalm 122 opens with going into the house of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/122?lang=eng'
    quote: 'I was glad when they said unto me, Let us go into the house of the Lord.'

  - where: 'setting'
    claim: 'The title “who made heaven and earth” returns in Psalm 124:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/124?lang=eng'
    quote: 'Our help is in the name of the Lord, who made heaven and earth.'

  - where: 'setting'
    claim: 'The title returns in Psalm 134:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/134?lang=eng'
    quote: 'The Lord that made heaven and earth bless thee out of Zion.'

  - where: 'thread'
    claim: '“Keep” in verses 3–5 and “preserve” in verses 7–8 are one Hebrew verb (Strong’s 8104); here in verse 7, twice'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/121-7.htm'
    quote: '8104 [e] … will guard you'

  - where: 'thread'
    claim: 'The same verb in verse 3'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/121-3.htm'
    quote: '8104 [e] … the One guarding you'

  - where: 'thread'
    claim: 'The same verb in verse 8, making six uses with verses 4 and 5'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/121-8.htm'
    quote: '8104 [e] … will guard'

  - where: 'section 1 plain'
    claim: 'Verse 1b is a question'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20121&version=NRSVUE'
    quote: 'from where will my help come?'

  - where: 'section 4 plain'
    claim: '“Preserve” is “keep,” and “thy soul” is your life'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20121&version=NRSVUE'
    quote: 'he will keep your life.'

  - where: 'note 121:1 “A question, and the hills are not the answer”'
    claim: 'The Hebrew word behind “from whence” is an interrogative, “whence?”, and the lexicon lists this verse under it'
    key: bdb
    url: 'https://biblehub.com/hebrew/370.htm'
    quote: 'whence? Genesis 29:4; Genesis 42:7 … Nahum 3:7; Psalm 121:1; Job 28:12,20'

  - where: 'note 121:1 “A question, and the hills are not the answer”'
    claim: 'The Hebrew text of verse 1 has the interrogative “from where”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/121-1.htm'
    quote: 'from where'

  - where: 'note 121:1 “A question, and the hills are not the answer”'
    claim: 'A modern translation prints the line as a question'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20121&version=NRSVUE'
    quote: 'from where will my help come?'

  - where: 'note 121:3 “Someone begins to say “thy””'
    claim: 'One older reading: the singer answers himself and goes on speaking to himself'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/121.htm'
    quote: 'In Psalm 121:3 and further the answering one goes on speaking to the questioner.'

  - where: 'note 121:3 “Someone begins to say “thy””'
    claim: 'Another older reading: a second speaker answers the first'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/121.htm'
    quote: 'it is more natural to hear in these verses the voice of another speaker, answering the first with words of encouragement.'

  - where: 'note 121:3 “Someone begins to say “thy””'
    claim: 'The psalm suits singing in turn, though how it was sung cannot be determined'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/121.htm'
    quote: 'Though we cannot determine the precise manner in which it was sung, it is specially adapted for antiphonal singing'

  - where: 'note 121:3 “Someone begins to say “thy””'
    claim: 'The negative of verse 3 usually expresses a wish or prohibition; on that reading verse 4 answers the wish'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/121.htm'
    quote: 'it is preferable, with R.V. marg., to retain the usual deprecative meaning of ’al; May he not suffer thy foot to be moved; may he that keepeth thee not slumber!'

  - where: 'note 121:3 “Someone begins to say “thy””'
    claim: 'On that reading verse 4 says the prayer is not needed'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/121.htm'
    quote: 'there is no need for such a prayer, for Israel’s keeper never sleeps.'

  - where: 'note 121:3 “Someone begins to say “thy””'
    claim: 'The Greek translation reads verse 3 as a wish'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/121.htm'
    quote: 'Let not thy foot be moved; and let not thy keeper slumber.'

  - where: 'note 121:3 “Someone begins to say “thy””'
    claim: 'The negative in verse 3 is ’al'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/121-3.htm'
    quote: '408 [e] … Not'

  - where: 'note 121:3 “Someone begins to say “thy””'
    claim: 'The negative in verse 4 is the plain lo’'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/121-4.htm'
    quote: 'Adv‑NegPrt'

  - where: 'note 121:3 “Someone begins to say “thy””'
    claim: 'Some grammarians hold that the negative of verse 3 can carry only the speaker’s feeling, which is why the King James statement was kept'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/121.htm'
    quote: 'sometimes expresses merely the subjective feeling and sympathy of the speaker with the act'

  - where: 'note 121:3 “Someone begins to say “thy””'
    claim: 'Israel’s keeper is not as the nations suppose their gods to be, with 1 Kings 18:27'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/121.htm'
    quote: 'He is not such as the heathen suppose their gods to be (1 Kings 18:27), but unceasing in His vigilance.'

  - where: 'note 121:4 “A watchman who does not sleep”'
    claim: 'The participle of the verb is used especially of a watchman of a city'
    key: bdb
    url: 'https://biblehub.com/hebrew/8104.htm'
    quote: 'especially Participle watch, watchman, of city Isaiah 21:11'

  - where: 'note 121:4 “A watchman who does not sleep”'
    claim: '“He that keepeth” in verse 4 is a participle of that verb (Strong’s 8104)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/121-4.htm'
    quote: '8104 [e] … the One guarding'

  - where: 'note 121:3 “Someone begins to say “thy””'
    claim: 'Elijah mocks Baal as a god who may be asleep'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/18?lang=eng'
    quote: 'either he is talking, or he is pursuing, or he is in a journey, or peradventure he sleepeth, and must be awaked.'

  - where: 'explore'
    claim: 'The LORD promised to keep Jacob wherever he went'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/28?lang=eng'
    quote: 'And, behold, I am with thee, and will keep thee in all places whither thou goest'

  - where: 'explore'
    claim: '“He that keepeth Israel” may allude to Genesis 28:15'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/121.htm'
    quote: 'He that keepeth Israel may be an allusion to Genesis 28:15.'

  - where: 'note 121:4 “President Hinckley’s conference theme”'
    claim: 'President Hinckley took the words of the verse as the theme of his address at the April 1983 general conference'
    key: hinckley-slumbers-not
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1983/04/he-slumbers-not-nor-sleeps?lang=eng'
    quote: 'I should like to use those wonderful, reassuring words as something of a theme.'

  - where: 'note 121:4 “President Hinckley’s conference theme”'
    claim: 'President Kimball could not attend in person and was weak'
    key: hinckley-slumbers-not
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1983/04/he-slumbers-not-nor-sleeps?lang=eng'
    quote: 'President Kimball is unable to be with us in person. … But he is weak, and his body is tired.'

  - where: 'note 121:4 “President Hinckley’s conference theme”'
    claim: 'He applied the verse to the Lord’s watch over the Church'
    key: hinckley-slumbers-not
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1983/04/he-slumbers-not-nor-sleeps?lang=eng'
    quote: 'The Almighty is blessing his church and his people. He is watching over them. He neither slumbers nor sleeps as he guides, directs, and moves'

  - where: 'note 121:4 “President Hinckley’s conference theme”'
    claim: 'Of the concern that the President of the Church is always elderly, he said he did not worry'
    key: hinckley-slumbers-not
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1983/04/he-slumbers-not-nor-sleeps?lang=eng'
    quote: 'I do not worry. I am honored in the opportunity to serve with him who now stands as the prophet to this people.'

  - where: 'note 121:4 “President Hinckley’s conference theme”'
    claim: 'The concern he answered'
    key: hinckley-slumbers-not
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1983/04/he-slumbers-not-nor-sleeps?lang=eng'
    quote: 'Some express concern that the President of the Church is likely always to be a rather elderly man'

  - where: 'note 121:4 “President Hinckley’s conference theme”'
    claim: 'He closed with the psalm’s words'
    key: hinckley-slumbers-not
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1983/04/he-slumbers-not-nor-sleeps?lang=eng'
    quote: 'I bear witness to you this morning that he, watching over Israel, slumbers not nor sleeps.'

  - where: 'note 121:6 “What the moon does”'
    claim: 'The sun’s harm is sunstroke; a belief in harm from the moon was widespread'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/121.htm'
    quote: 'Sunstroke is of course common and dangerous in the East'

  - where: 'note 121:6 “What the moon does”'
    claim: 'The metaphor follows from the shade of verse 5'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/121.htm'
    quote: 'The metaphor is naturally suggested by ‘shade’ in Psalm 121:5.'

  - where: 'note 121:6 “What the moon does”'
    claim: 'A belief in harm from the moon (“moonstroke”) was widespread'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/121.htm'
    quote: 'the belief in ‘moonstroke’'

  - where: 'note 121:6 “What the moon does”'
    claim: 'One older answer: moonlight itself was thought to injure'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/121.htm'
    quote: 'may become insupportable, may affect the eyes injuriously'

  - where: 'note 121:6 “What the moon does”'
    claim: 'The other answer: the moon stands for the cold of night, as in Genesis 31:40'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/121.htm'
    quote: 'Many expositors, nevertheless, understand the destructive influence of the moon meant here of the nightly cold, which is mentioned elsewhere in the same antithesis. Genesis 31:40'

  - where: 'note 121:6 “What the moon does”'
    claim: 'Jacob pairs the day’s drought and the night’s frost'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/31?lang=eng'
    quote: 'in the day the drought consumed me, and the frost by night'

  - where: 'note 121:6 “What the moon does”'
    claim: 'The right hand is the usual place of the protector'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/121.htm'
    quote: 'that being the usual position of the champion or protector'

  - where: 'note 121:7 “Keep and preserve are one word, said six times”'
    claim: 'The verb means keep, watch, preserve'
    key: bdb
    url: 'https://biblehub.com/hebrew/8104.htm'
    quote: 'verb keep, watch, preserve'

  - where: 'note 121:7 “Keep and preserve are one word, said six times”'
    claim: '“Preserve” in verse 7 is the verb of “keep” (Strong’s 8104), twice in the verse'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/121-7.htm'
    quote: '8104 [e] … will guard you'

  - where: 'note 121:7 “Keep and preserve are one word, said six times”'
    claim: 'The same verb in verse 8'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/121-8.htm'
    quote: '8104 [e] … will guard'

  - where: 'note 121:7 “Keep and preserve are one word, said six times”'
    claim: 'The same verb in verse 3'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/121-3.htm'
    quote: '8104 [e] … the One guarding you'

  - where: 'note 121:7 “Keep and preserve are one word, said six times”'
    claim: 'The same verb in verse 4'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/121-4.htm'
    quote: '8104 [e] … the One guarding'

  - where: 'note 121:7 “Keep and preserve are one word, said six times”'
    claim: 'The same verb in verse 5, “thy keeper”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/121-5.htm'
    quote: '8104 [e] … the One guarding you'

  - where: 'note 121:7 “Keep and preserve are one word, said six times”'
    claim: 'A modern translation keeps to the one word “keep”; “thy soul” is “your life”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20121&version=NRSVUE'
    quote: 'he will keep your life.'

  - where: 'christ'
    claim: '“LORD” in the Old Testament usually stands for Jehovah, who is the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Usually, when the word Lord appears in the Old Testament, it means “Jehovah.”'

  - where: 'christ'
    claim: 'King Benjamin’s angel names Jesus Christ the Father of heaven and earth and the Creator'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/3?lang=eng'
    quote: 'And he shall be called Jesus Christ, the Son of God, the Father of heaven and earth, the Creator of all things from the beginning'

  - where: 'christ'
    claim: 'The risen Lord says He created the heavens and the earth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'I created the heavens and the earth, and all things that in them are.'

  - where: 'explore'
    claim: 'Psalm 134:3 is the last line of the songs of degrees'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/134?lang=eng'
    quote: 'The Lord that made heaven and earth bless thee out of Zion.'

  - where: 'parallels'
    claim: 'Psalm 124:8 gives the people the answer of verse 2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/124?lang=eng'
    quote: 'Our help is in the name of the Lord, who made heaven and earth.'
