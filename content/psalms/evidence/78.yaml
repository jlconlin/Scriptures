chapter: 78
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The title of the psalm'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/78?lang=eng'
    quote: 'Maschil of Asaph.'

  # ---- setting ----
  - where: 'setting'
    claim: 'Psalms 50 and 73–83 carry Asaph’s name, so Psalm 78 is the sixth of the eleven in a row'
    key: scripture-helps-ps-49
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/33-psalms-49-51-61-66-69-72-77-78-85-86?lang=eng'
    quote: 'Asaph is credited with composing Psalms 50 and 73–83, though some of these may have been written by successive musicians of his guild.'
  - where: 'setting'
    claim: 'Psalm 78 is listed among the psalms of praise, which call Israel together and describe what the Lord has done for Israel in the past'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'After the call to praise, the hymns describe the power and the mercy of the Lord, often describing what he has done for Israel in the past'
  - where: 'setting'
    claim: 'The list of psalms of praise includes 78'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'praise the Lord: 8, 19, 29, 33, 47, 65, 66, 78, 93, 95–100'
  - where: 'setting'
    claim: 'The heading in the Church’s edition ends with the choice of Judah and David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/78?lang=eng'
    quote: 'The Israelites are to teach the Lord’s law to their children'
  - where: 'setting'
    claim: 'Matthew quotes verse 2 of Jesus’s teaching in parables'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/13?lang=eng'
    quote: 'That it might be fulfilled which was spoken by the prophet, saying, I will open my mouth in parables'
  - where: 'setting'
    claim: 'The Student Manual’s table of Old Testament passages in the New pairs John 6:31 with Psalm 78:24'
    key: ot-manual-psalms
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/the-psalms-songs-from-the-heart-of-israel?lang=eng'
    quote: 'John 6:31 | Psalm 78:24'
  - where: 'setting'
    claim: 'Paul says the wilderness events were written for our admonition'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/10?lang=eng'
    quote: 'Now all these things happened unto them for ensamples: and they are written for our admonition'

  # ---- thread ----
  - where: 'thread'
    claim: 'Zoan is named at the start of both tellings (verses 12 and 43)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/78?lang=eng'
    quote: 'How he had wrought his signs in Egypt, and his wonders in the field of Zoan'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Dark sayings” are riddles'
    key: bdb
    url: 'https://biblehub.com/hebrew/2420.htm'
    quote: 'noun feminine riddle, enigmatic, perplexing saying or question'
  - where: 'section 4 plain'
    claim: '“Corn of heaven” is grain; “angels’ food” is the bread of angels'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2078&version=NRSVUE'
    quote: 'Mortals ate of the bread of angels'
  - where: 'section 5 plain'
    claim: 'The Church’s footnote 34c: “inquired early” may be rendered “earnestly sought”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/78?lang=eng'
    quote: 'OR earnestly sought.'
  - where: 'section 6 plain'
    claim: '“Limited” (verse 41) rendered “pained”'
    key: bdb
    url: 'https://biblehub.com/hebrew/8428.htm'
    quote: 'verb Hiph`il probably pain, wound (figurative)'
  - where: 'section 6 plain'
    claim: 'The Church’s footnotes: “floods” (verse 44) is streams in Hebrew, and “tabernacles” (verse 51) is tents'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/78?lang=eng'
    quote: 'HEB streams.'
  - where: 'section 7 plain'
    claim: 'The “deceitful bow” of verse 57 is a treacherous bow'
    key: bdb
    url: 'https://biblehub.com/hebrew/7423.htm'
    quote: 'treacherous bow (simile) Hosea 7:16; Psalm 78:57 (failing him who trusts to it)'
  - where: 'section 8 plain'
    claim: 'Verse 65: a warrior shouting because of wine; verse 66: the enemies are driven back'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2078&version=NRSVUE'
    quote: 'like a warrior shouting because of wine.'
  - where: 'section 8 plain'
    claim: 'Verse 66 rendered as putting the enemies to rout'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2078&version=NRSVUE'
    quote: 'He put his adversaries to rout'
  - where: 'section 8 plain'
    claim: 'Verse 69: the sanctuary built like the high heavens'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2078&version=NRSVUE'
    quote: 'He built his sanctuary like the high heavens'
  - where: 'section 8 plain'
    claim: '“Feed” and “fed” in verses 71–72 are the verb to shepherd'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/78.htm'
    quote: 'to be the shepherd of Jacob his servant, and Israel his inheritance.'

  # ---- note 78:2 ----
  - where: 'note 78:2 “A parable made of history”'
    claim: 'The Hebrew word for “parable,” mashal, means proverb or parable'
    key: bdb
    url: 'https://biblehub.com/hebrew/4912.htm'
    quote: 'proverb, parable (of sentences constructed in parallelism, usually of Hebrew Wisdom, but occasionally of other types)'
  - where: 'note 78:2 “A parable made of history”'
    claim: 'The Hebrew word for “dark sayings” means a riddle'
    key: bdb
    url: 'https://biblehub.com/hebrew/2420.htm'
    quote: 'noun feminine riddle, enigmatic, perplexing saying or question'
  - where: 'note 78:2 “A parable made of history”'
    claim: 'In Psalm 78:2 the word is a lesson taught indirectly'
    key: bdb
    url: 'https://biblehub.com/hebrew/2420.htm'
    quote: 'a lesson taught indirectly Psalm 78:2'
  - where: 'note 78:2 “A parable made of history”'
    claim: 'The Hebrew of verse 2 has “parable” in the singular (morphology Ncmsa)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בְ/מָשָׁ֣ל'
  - where: 'note 78:2 “A parable made of history”'
    claim: 'The ancient Greek translation of verse 2'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/78.htm'
    quote: 'I will open my mouth in parables: I will utter dark sayings which have been from the beginning.'
  - where: 'note 78:2 “A parable made of history”'
    claim: 'Matthew’s quotation of the verse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/13?lang=eng'
    quote: 'That it might be fulfilled which was spoken by the prophet, saying, I will open my mouth in parables; I will utter things which have been kept secret from the foundation of the world.'
  - where: 'note 78:9 “Ephraim and the bow that turned”'
    claim: 'The verse has been called awkward where it stands'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/78.htm'
    quote: 'Psalm 78:9, which comes in now in the midst of this description, is awkward and unintelligible.'
  - where: 'note 78:9 “Ephraim and the bow that turned”'
    claim: 'One proposal refers it to Ephraim’s part in the conquest of Canaan'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/78.htm'
    quote: 'that the powerful warlike tribe of Ephraim grew weary in the work of the conquest of Canaan (Judges 1), and did not render the services which might have been expected from it?'
  - where: 'note 78:9 “Ephraim and the bow that turned”'
    claim: 'The reading that takes the verse generally and figuratively, by verse 57'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/78.htm'
    quote: 'the statement consequently must be understood more generally and, according to Psalm 78:57, figuratively'
  - where: 'note 78:9 “Ephraim and the bow that turned”'
    claim: 'What is said of Ephraim holds of all Israel'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/78.htm'
    quote: 'what is here said of the Ephraimites also holds good of the Israelites in general, as Psalm 78:57 shows'
  - where: 'note 78:9 “Ephraim and the bow that turned”'
    claim: 'The verse prepares for the rejection of Shiloh and Ephraim later in the psalm'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/78.htm'
    quote: 'preparing the way for the rejection of Shiloh and Ephraim related further on'
  - where: 'note 78:9 “Ephraim and the bow that turned”'
    claim: 'The verb “turned back” in verse 9 (Strong’s 2015, qal)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הָ֝פְכ֗וּ'
  - where: 'note 78:9 “Ephraim and the bow that turned”'
    claim: 'The verb “were turned aside” in verse 57 is the same verb (Strong’s 2015, niphal), and the bow is the same noun as in verse 9'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'נֶ֝הְפְּכ֗וּ'
  - where: 'note 78:9 “Ephraim and the bow that turned”'
    claim: 'A deceitful bow is a treacherous one that fails the one who trusts it'
    key: bdb
    url: 'https://biblehub.com/hebrew/7423.htm'
    quote: 'treacherous bow (simile) Hosea 7:16; Psalm 78:57 (failing him who trusts to it)'
  - where: 'note 78:9 “Ephraim and the bow that turned”'
    claim: 'Joshua was of Ephraim, and Shiloh lay in its land'
    key: bd-ephraim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephraim?lang=eng'
    quote: 'Joshua belonged to this tribe, and to him was due much of its subsequent greatness.'
  - where: 'note 78:9 “Ephraim and the bow that turned”'
    claim: 'Shiloh was among the sites in the land of Joseph’s sons'
    key: bd-ephraim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephraim?lang=eng'
    quote: 'having within its limits historic sites like Shechem, Ebal, Gerizim, and Shiloh'
  - where: 'note 78:9 “Ephraim and the bow that turned”'
    claim: 'Hosea is speaking of Ephraim when he uses the image of the deceitful bow'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/7?lang=eng'
    quote: 'Ephraim also is like a silly dove without heart'

  # ---- note 78:19 ----
  - where: 'note 78:19 “The question asked after the miracle”'
    claim: 'The craving for meat in Numbers 11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/11?lang=eng'
    quote: 'And while the flesh was yet between their teeth, ere it was chewed, the wrath of the Lord was kindled against the people'
  - where: 'note 78:19 “The question asked after the miracle”'
    claim: 'Paul’s use of the same events'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/10?lang=eng'
    quote: 'Now these things were our examples, to the intent we should not lust after evil things, as they also lusted.'

  # ---- note 78:25 ----
  - where: 'note 78:19 “The question asked after the miracle”'
    claim: 'The Church’s footnote 19a sends “table” to the complaint of Exodus 16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/78?lang=eng'
    quote: 'Ex. 16:3 (3–5).'
  - where: 'note 78:19 “The question asked after the miracle”'
    claim: 'The Church’s footnote 21a sends “fire” to Numbers 11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/78?lang=eng'
    quote: 'Num. 11:1 (1, 10).'

  - where: 'note 78:25 “Bread of the mighty, and the bread of life”'
    claim: 'A modern translation has “the grain of heaven” in verse 24'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2078&version=NRSVUE'
    quote: 'and gave them the grain of heaven.'
  - where: 'note 78:25 “Bread of the mighty, and the bread of life”'
    claim: 'The ancient Greek has “the bread of heaven” in verse 24'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/78.htm'
    quote: 'and rained upon them manna to eat, and gave them the bread of heaven.'
  - where: 'note 78:25 “Bread of the mighty, and the bread of life”'
    claim: 'The Hebrew of verse 25 is “bread of the mighty” (abbirim, Strong’s 47)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אַ֭בִּירִים'
  - where: 'note 78:25 “Bread of the mighty, and the bread of life”'
    claim: 'The adjective means mighty, valiant'
    key: bdb
    url: 'https://biblehub.com/hebrew/47.htm'
    quote: 'adjective mighty, valiant'
  - where: 'note 78:25 “Bread of the mighty, and the bread of life”'
    claim: 'The lexicon takes it of angels in this verse and compares Psalm 103:20'
    key: bdb
    url: 'https://biblehub.com/hebrew/47.htm'
    quote: '2 angels Psalm Psalm 78:25 (compare Psalm 103:20).'
  - where: 'note 78:25 “Bread of the mighty, and the bread of life”'
    claim: 'The ancient Greek has “angels’ bread” in verse 25'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/78.htm'
    quote: 'Man ate angels'' bread; he sent them provision to the full.'
  - where: 'note 78:25 “Bread of the mighty, and the bread of life”'
    claim: 'John 6:31 is paired with Psalm 78:24 in the Church’s manual'
    key: ot-manual-psalms
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/the-psalms-songs-from-the-heart-of-israel?lang=eng'
    quote: 'John 6:31 | Psalm 78:24'
  - where: 'note 78:25 “Bread of the mighty, and the bread of life”'
    claim: 'The crowd asks for a sign and quotes the line about bread from heaven'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/6?lang=eng'
    quote: 'Our fathers did eat manna in the desert; as it is written, He gave them bread from heaven to eat.'
  - where: 'note 78:25 “Bread of the mighty, and the bread of life”'
    claim: 'They asked Him for a sign'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/6?lang=eng'
    quote: 'What sign shewest thou then, that we may see, and believe thee?'

  # ---- note 78:38 ----
  - where: 'note 78:38 “The verb of atonement”'
    claim: 'The verb of “forgave” is kipper (Strong’s 3722), in the piel imperfect (morphology Vpi3ms)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יְכַפֵּ֥ר'
  - where: 'note 78:38 “The verb of atonement”'
    claim: 'With God as subject the verb means to cover, to treat as covered; the lexicon cites this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'with God as subject, with accusative of person, cover, i.e. treat as covered, view propitiously'
  - where: 'note 78:38 “The verb of atonement”'
    claim: 'The lexicon’s comment on God as the one who atones'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'It is conceived that God in his sovereignty may himself provide an atonement or covering for men and their sins which could not be provided by men.'
  - where: 'note 78:41 “Limited, or pained”'
    claim: 'The Hebrew verb of “limited” (Strong’s 8428)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הִתְווּ'
  - where: 'note 78:41 “Limited, or pained”'
    claim: 'The lexicon’s meaning for the verb, citing this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/8428.htm'
    quote: 'verb Hiph`il probably pain, wound (figurative)'
  - where: 'note 78:41 “Limited, or pained”'
    claim: 'The ancient Greek has “provoked”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/78.htm'
    quote: 'Yea, they turned back, and tempted God, and provoked the Holy One of Israel.'
  - where: 'note 78:41 “Limited, or pained”'
    claim: 'A modern translation has “provoked”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2078&version=NRSVUE'
    quote: 'and provoked the Holy One of Israel.'

  # ---- note 78:49 ----
  - where: 'note 78:49 “The evil angels sent on Egypt”'
    claim: 'The Hebrew joins the word for angels or messengers (Strong’s 4397) to a plural adjective (Strong’s 7451)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מַלְאֲכֵ֥י'
  - where: 'note 78:49 “The evil angels sent on Egypt”'
    claim: 'One reading: not wicked angels but angels that bring misfortune'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/78.htm'
    quote: 'but angels that bring misfortune'
  - where: 'note 78:49 “The evil angels sent on Egypt”'
    claim: 'On that reading the psalmist paraphrases the destroyer of Exodus 12'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/78.htm'
    quote: 'The poet thus paraphrases the המּשׁחית that is collectively conceived in Exodus 12:13, Exodus 12:23'
  - where: 'note 78:49 “The evil angels sent on Egypt”'
    claim: 'A modern translation of the phrase'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2078&version=NRSVUE'
    quote: 'a company of destroying angels.'
  - where: 'note 78:49 “The evil angels sent on Egypt”'
    claim: 'The destroyer in Exodus 12:23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/12?lang=eng'
    quote: 'and will not suffer the destroyer to come in unto your houses to smite you'
  - where: 'note 78:49 “The evil angels sent on Egypt”'
    claim: 'The Church’s footnote 49a points to the Topical Guide on evil spirits'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/78?lang=eng'
    quote: 'TG Spirits, Evil or Unclean.'
  - where: 'note 78:44 “The plagues the psalm tells”'
    claim: 'The psalm goes from the first plague to the fourth and joins the second to it'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/78.htm'
    quote: 'From this the poet takes a leap over to the fourth plague'
  - where: 'note 78:44 “The plagues the psalm tells”'
    claim: 'Locusts (the eighth) and hail (the seventh) follow; the third is left out'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/78.htm'
    quote: 'the third plague, the gnats and midges, כּנּים, is left unmentioned'
  - where: 'note 78:44 “The plagues the psalm tells”'
    claim: 'The pestilence and the death of the firstborn are brought together in verses 49–51'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/78.htm'
    quote: 'brings the fifth Egyptian plague, the pestilence (Exodus 9:1-7), and the tenth and last, the smiting of the first-born'

  # ---- note 78:60 ----
  - where: 'note 78:60 “The day the ark was taken”'
    claim: 'Shiloh lay in Ephraim and held the tabernacle through most of the period of the Judges'
    key: bd-shiloh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shiloh?lang=eng'
    quote: 'in the tribe of Ephraim (Josh. 18:1; Judg. 18:31). The tabernacle was here during the greater part of the period of the Judges'
  - where: 'note 78:60 “The day the ark was taken”'
    claim: 'It remained the religious center until the ark was lost at Ebenezer'
    key: bd-shiloh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shiloh?lang=eng'
    quote: 'the place continued to be the religious center of the nation (1 Sam. 1:3) until after the loss of the Ark in the disastrous battle of Ebenezer'
  - where: 'note 78:60 “The day the ark was taken”'
    claim: 'The Bible Dictionary’s entry on Shiloh, which tells of the loss of the ark at Ebenezer, refers to this verse'
    key: bd-shiloh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shiloh?lang=eng'
    quote: 'Ps. 78:60'
  - where: 'note 78:60 “The day the ark was taken”'
    claim: 'The battle in 1 Samuel 4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/4?lang=eng'
    quote: 'And the ark of God was taken; and the two sons of Eli, Hophni and Phinehas, were slain.'
  - where: 'note 78:60 “The day the ark was taken”'
    claim: 'The naming of I-chabod'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/4?lang=eng'
    quote: 'And she named the child I-chabod, saying, The glory is departed from Israel: because the ark of God was taken'
  - where: 'note 78:60 “The day the ark was taken”'
    claim: '“His strength” in verse 61 is the ark, as in Psalm 132:8'
    key: bdb
    url: 'https://biblehub.com/hebrew/5797.htm'
    quote: 'manifested in connection with the ark'
  - where: 'note 78:60 “The day the ark was taken”'
    claim: 'The lexicon’s line on Psalm 78:61'
    key: bdb
    url: 'https://biblehub.com/hebrew/5797.htm'
    quote: '= ark Psalm 78:61.'

  # ---- note 78:65 ----
  - where: 'note 78:65 “The sleeper and the warrior”'
    claim: 'God seemed to sleep while Israel served its enemies'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/78.htm'
    quote: 'for He seemed to sleep whilst Israel had become a servant to the heathen'
  - where: 'note 78:65 “The sleeper and the warrior”'
    claim: 'The warrior is one whose courage is heightened by wine'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/78.htm'
    quote: 'like a hero whose courage is heightened by the strengthening and exhilarating influence of wine'
  - where: 'note 78:65 “The sleeper and the warrior”'
    claim: 'A modern translation of the second simile'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2078&version=NRSVUE'
    quote: 'like a warrior shouting because of wine.'
  - where: 'note 78:65 “The sleeper and the warrior”'
    claim: 'Verse 66 is worded after 1 Samuel 5:6'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/78.htm'
