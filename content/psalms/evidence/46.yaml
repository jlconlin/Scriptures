chapter: 46
claims:
  # setting
  - where: 'setting'
    claim: 'Psalm 46 is counted among the songs of Zion, which celebrate the temple at Mount Zion and the Lord’s presence there'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'Songs of Zion. These psalms celebrate the location of the temple at Mount Zion'
  - where: 'setting'
    claim: 'The songs of Zion listed are Psalms 46, 48, 76, 84, 87 and 122'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'could have acted also as a call to worship: 46, 48, 76, 84, 87, and 122.'
  - where: 'setting'
    claim: 'One older reading finds the key to Psalms 46–48 in the deliverance under Jehoshaphat (2 Chronicles 20)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/46.htm'
    quote: 'does the chronicler give us the key to the Asaphic Psalm 83 (76?) and to the Korahitic Psalm 46-48'
  - where: 'setting'
    claim: 'In that deliverance the invaders turned their weapons on one another'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/46.htm'
    quote: 'had turned their weapons against one another, being disbanded in the confusion of flight'
  - where: 'setting'
    claim: 'The same reading allows that the three psalms may equally be referred to the defeat of Sennacherib under Hezekiah'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/46.htm'
    quote: 'It is indeed equally admissible to refer these three Korahitic Psalms to the defeat of'
  - where: 'setting'
    claim: 'Korahite Levites stood up to praise in Jehoshaphat’s day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: 'And the Levites, of the children of the Kohathites, and of the children of the Korhites, stood up to praise'
  - where: 'setting'
    claim: 'The Assyrian army was destroyed in a night in Hezekiah’s day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/19?lang=eng'
    quote: 'and when they arose early in the morning, behold, they were all dead corpses'
  - where: 'setting'
    claim: 'Joseph Smith’s translation shifts the psalm to a prophecy of the future'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'inspired translation shifts this psalm to a prophecy of the future'
  - where: 'setting'
    claim: 'D&C 101 was given when the Saints had been driven from Jackson County'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'Mobs had driven them from their homes in Jackson County'

  # section plain renderings
  - where: 'section 1 plain'
    claim: 'Verse 2 can be rendered “though the earth should change” and “in the heart of the sea”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2046&version=NRSVUE'
    quote: 'Therefore we will not fear, though the earth should change'
  - where: 'section 1 plain'
    claim: 'The help of verse 1 is one that lets itself be found in distress'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/46.htm'
    quote: 'as being one who allows Himself to be found in times of distress'
  - where: 'section 2 plain'
    claim: 'Verse 5: help when the morning dawns; verse 6: the kingdoms totter'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2046&version=NRSVUE'
    quote: 'God will help it when the morning dawns.'
  - where: 'section 2 plain'
    claim: 'The refrain’s “refuge” may be rendered fortress or stronghold'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2046&version=NRSVUE'
    quote: '46.7 Or fortress'
  - where: 'section 3 plain'
    claim: '“Heathen” in verse 10 is the nations'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2046&version=NRSVUE'
    quote: 'I am exalted among the nations'

  # note 46:0 Alamoth
  - where: 'note 46:0 “Alamoth”'
    claim: 'The phrase is to the voice of young women, literally or of soprano or falsetto of boys'
    key: bdb
    url: 'https://biblehub.com/hebrew/5959.htm'
    quote: 'to (the voice of) young women, either literally, or of soprano or falsetto of boys'
  - where: 'note 46:0 “Alamoth”'
    claim: 'The word is the plural of the noun for a young woman'
    key: bdb
    url: 'https://biblehub.com/hebrew/5959.htm'
    quote: 'noun feminine young woman'
  - where: 'note 46:0 “Alamoth”'
    claim: 'Alamoth is glossed “maidens,” Sheminith “the octave,” and such titles seem to imply singing in parts'
    key: bd-psalms
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/psalms?lang=eng'
    quote: 'such titles as “Set to Alamoth” (“maidens,” Ps. 46), or “Set to the Sheminith” (“the octave,” Ps. 6; 12), seem to imply that there was singing in parts'
  - where: 'note 46:0 “Alamoth”'
    claim: 'Eight musicians are named as playing on Alamoth when the ark was brought up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/15?lang=eng'
    quote: 'And Zechariah, and Aziel, and Shemiramoth, and Jehiel, and Unni, and Eliab, and Maaseiah, and Benaiah, with psalteries on Alamoth'
  - where: 'note 46:0 “Alamoth”'
    claim: 'A modern translation leaves the word untranslated'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2046&version=NRSVUE'
    quote: 'To the leader. Of the Korahites. According to Alamoth. A Song.'
  - where: 'note 46:0 “Alamoth”'
    claim: 'The Greek title does not treat the word as a musical term'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/46.htm'
    quote: 'For the end, for the sons of Core; a Psalm concerning secret things.'

  # note 46:2 Creation coming undone
  - where: 'note 46:2 “Creation coming undone”'
    claim: 'A modern translation has the earth change and the mountains shake in the heart of the sea'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2046&version=NRSVUE'
    quote: 'though the earth should change'
  - where: 'note 46:2 “Creation coming undone”'
    claim: 'The modern translation’s phrase for “the midst of the sea”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2046&version=NRSVUE'
    quote: 'though the mountains shake in the heart of the sea'
  - where: 'note 46:2 “Creation coming undone”'
    claim: 'One reading: the mountains sink back into the waters of the third day of creation and chaos returns'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/46.htm'
    quote: 'sink back again into the waters out of which they appeared on the third day of the creation, so that consequently the old chaos should return'
  - where: 'note 46:2 “Creation coming undone”'
    claim: 'On that reading the congregation supposes the most extreme case'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/46.htm'
    quote: 'supposes the most extreme case, viz., the falling in of the universe which has been creatively set in order'
  - where: 'note 46:2 “Creation coming undone”'
    claim: 'The same reading rejects taking the mountains as an allegory of kingdoms'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/46.htm'
    quote: 'We are no more to regard the language as being allegorical here'
  - where: 'note 46:2 “Creation coming undone”'
    claim: 'The lexicon calls the changing earth and slipping mountains symbolic of extreme insecurity'
    key: bdb
    url: 'https://biblehub.com/hebrew/4131.htm'
    quote: '(both symbolic of extreme insecurity)'

  # note 46:2 Zenos
  - where: 'note 46:2 “Zenos and the mountains carried”'
    claim: 'Zenos was known to Nephi from the plates of brass'
    key: sc-knowhy-313
    url: 'https://scripturecentral.org/knowhy/why-did-zenos-quote-from-psalm-46-in-his-prophecy-of-christs-death'
    quote: 'Nephi quoted the words of prophets known to him from the plates of brass'
  - where: 'note 46:2 “Zenos and the mountains carried”'
    claim: 'Psalm 46:2 is the only passage that speaks of mountains being carried'
    key: sc-knowhy-313
    url: 'https://scripturecentral.org/knowhy/why-did-zenos-quote-from-psalm-46-in-his-prophecy-of-christs-death'
    quote: 'Although a number of biblical passages speak of mountains being “lifted up” or “removed,” Psalm 46:2 is the only passage that speaks of mountains being “carried.”'
  - where: 'note 46:2 “Zenos and the mountains carried”'
    claim: 'The two passages share the voice of God and the name “the God of Jacob”'
    key: sc-knowhy-313
    url: 'https://scripturecentral.org/knowhy/why-did-zenos-quote-from-psalm-46-in-his-prophecy-of-christs-death'
    quote: 'there are a number of shared elements between 1 Nephi 19 and Psalm 46, which suggests there is some kind of deeper relationship between these passages'
  - where: 'note 46:2 “Zenos and the mountains carried”'
    claim: 'It cannot be known whether Zenos quoted the psalm'
    key: sc-knowhy-313
    url: 'https://scripturecentral.org/knowhy/why-did-zenos-quote-from-psalm-46-in-his-prophecy-of-christs-death'
    quote: 'Although we cannot know if Zenos was, indeed, quoting Psalm 46 specifically, he was certainly in touch with the traditions that we find there'
  - where: 'note 46:2 “Zenos and the mountains carried”'
    claim: 'The psalm is not a prophecy of the kind Nephi cites, but shares the imagery of the day of the Lord'
    key: sc-knowhy-313
    url: 'https://scripturecentral.org/knowhy/why-did-zenos-quote-from-psalm-46-in-his-prophecy-of-christs-death'
    quote: 'Although Psalm 46 does not appear to be a prophecy like those cited by Nephi in 1 Nephi 19, the elements shared between these passages are found throughout the corpus of prophetic literature'
  - where: 'note 46:2 “Zenos and the mountains carried”'
    claim: 'Zenos applied the imagery to the time of Christ’s death as well as the Second Coming'
    key: sc-knowhy-313
    url: 'https://scripturecentral.org/knowhy/why-did-zenos-quote-from-psalm-46-in-his-prophecy-of-christs-death'
    quote: 'that this imagery applied not only to the Second Coming of Christ, but also to the time of His death'
  - where: 'note 46:2 “Zenos and the mountains carried”'
    claim: 'Hebrews 12:26–28 appears to draw on Psalm 46:2, 5–6'
    key: sc-knowhy-313
    url: 'https://scripturecentral.org/knowhy/why-did-zenos-quote-from-psalm-46-in-his-prophecy-of-christs-death'
    quote: 'These ideas appear to be drawing on the declarations in Psalm 46:2, 5–6 that the earth and mountains will be moved, as well as the worldly kingdoms.'
  - where: 'note 46:2 “Zenos and the mountains carried”'
    claim: 'Nephi’s quotation of Zenos'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/19?lang=eng'
    quote: 'by the opening of the earth, and by mountains which shall be carried up'
  - where: 'note 46:2 “Zenos and the mountains carried”'
    claim: 'Hebrews speaks of a kingdom that cannot be moved'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/12?lang=eng'
    quote: 'Wherefore we receiving a kingdom which cannot be moved'

  # note 46:4 river
  - where: 'note 46:4 “The river that makes the city glad”'
    claim: 'One reading: in verse 5 God stands where the river stood in verse 4'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/46.htm'
    quote: 'in the place of the river we find Him from whom the river issues forth'
  - where: 'note 46:4 “The river that makes the city glad”'
    claim: 'The image is taken from the river of Eden'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/46.htm'
    quote: 'a stream issued from Eden, to water the whole garden, so a stream makes Jerusalem as it were into another paradise'
  - where: 'note 46:4 “The river that makes the city glad”'
    claim: 'What is intended is the river of grace, as in Psalm 36:8 (Hebrew 36:9)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/46.htm'
    quote: 'What is intended is the river of grace, which is also likened to a river of paradise in Psalm 36:9.'
  - where: 'note 46:4 “The river that makes the city glad”'
    claim: 'The same reading holds that the psalm’s stream suggested the figure of Isaiah 33:21'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/46.htm'
    quote: 'the image of the stream in the Psalm has suggested the grandly bold figure of the prophet in v. 21'
  - where: 'note 46:4 “The river that makes the city glad”'
    claim: 'The river of Eden'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/2?lang=eng'
    quote: 'And a river went out of Eden to water the garden'
  - where: 'note 46:4 “The river that makes the city glad”'
    claim: 'Isaiah 33:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/33?lang=eng'
    quote: 'will be unto us a place of broad rivers and streams'
  - where: 'note 46:4 “The river that makes the city glad”'
    claim: 'Psalm 36:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/36?lang=eng'
    quote: 'thou shalt make them drink of the river of thy pleasures'

  # note 46:5 JST
  - where: 'note 46:5 “Joseph Smith’s translation, “Zion shall come””'
    claim: 'The manuscript’s verse 5'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/98'
    quote: 'For Zion shall come, and God shall be in the midst of her.'
  - where: 'note 46:5 “Joseph Smith’s translation, “Zion shall come””'
    claim: 'The manuscript’s future verbs in verse 6'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/98'
    quote: 'The heathen shall be enraged, and there Kingdoms shall be mooved, and the lord shall utter his voice, and the earth shall be melted'
  - where: 'note 46:5 “Joseph Smith’s translation, “Zion shall come””'
    claim: 'The manuscript’s verse 8'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/98'
    quote: 'he shall make in the earth in the latter days'
  - where: 'note 46:5 “Joseph Smith’s translation, “Zion shall come””'
    claim: 'The whole psalm is put into a future context'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'The events become prophetic, set not in the Psalmist’s lifetime but “in the latter days” (v. 8).'
  - where: 'note 46:5 “Joseph Smith’s translation, “Zion shall come””'
    claim: 'The translation adds Zion to four psalms: 14:7; 15:1; 46:5; 53:6'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'the addition of four more references to Zion in the JST (Psalms 14:7; 15:1; 46:5; 53:6)'
  - where: 'note 46:5 “Joseph Smith’s translation, “Zion shall come””'
    claim: 'The translation of Psalms is dated to about January and February 1833'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'an approximate date for the translation of Psalms of January and February 1833'
  - where: 'note 46:5 “Joseph Smith’s translation, “Zion shall come””'
    claim: 'Zion was prominent in the Saints’ minds in early 1833'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'The concept of Zion was prominent in the minds of Church members in early 1833.'
  - where: 'note 46:5 “Joseph Smith’s translation, “Zion shall come””'
    claim: 'The wording is a sure statement, compared with Moses 7:64'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'this translation is a prophetically sure statement—Zion will come and God shall be in her midst (compare Moses 7:64)'
  - where: 'note 46:5 “Joseph Smith’s translation, “Zion shall come””'
    claim: 'Moses 7:64'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/7?lang=eng'
    quote: 'And there shall be mine abode, and it shall be Zion'

  # note 46:5 right early
  - where: 'note 46:5 “Help at the turn of the morning”'
    claim: 'The verb in the phrase means to turn toward, approach, of evening or morning'
    key: bdb
    url: 'https://biblehub.com/hebrew/6437.htm'
    quote: 'turn toward, approach, of evening'
  - where: 'note 46:5 “Help at the turn of the morning”'
    claim: 'The same phrase is in Exodus 14:27, and the psalm’s use is figurative'
    key: bdb
    url: 'https://biblehub.com/hebrew/6437.htm'
    quote: 'Exodus 14:27; Judges 19:26; Psalm 46:6 (figurative)'
  - where: 'note 46:5 “Help at the turn of the morning”'
    claim: 'A modern translation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2046&version=NRSVUE'
    quote: 'God will help it when the morning dawns.'
  - where: 'note 46:5 “Help at the turn of the morning”'
    claim: 'Exodus 14:27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/14?lang=eng'
    quote: 'the sea returned to his strength when the morning appeared'

  # note 46:6 structure
  - where: 'note 46:6 “The sea’s words used of the nations”'
    claim: 'Verse 3 “roar” is the verb hamah (H1993)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יֶהֱמ֣וּ'
  - where: 'note 46:6 “The sea’s words used of the nations”'
    claim: 'Verse 6 “raged” is the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הָמ֣וּ'
  - where: 'note 46:6 “The sea’s words used of the nations”'
    claim: 'Verse 6 “were moved” is the verb mot (H4131), as in verse 2 (“carried”) and verse 5 (“moved”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מָ֣טוּ'
  - where: 'note 46:6 “The sea’s words used of the nations”'
    claim: 'Verse 5 “shall not be moved” has the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תִּמּ֑וֹט'
  - where: 'note 46:6 “The sea’s words used of the nations”'
    claim: 'The verb is used of waves roaring (compare Psalm 46:3, Hebrew 46:4)'
    key: bdb
    url: 'https://biblehub.com/hebrew/1993.htm'
    quote: 'roar, of waves'
  - where: 'note 46:6 “The sea’s words used of the nations”'
    claim: 'and of peoples being tumultuous (Psalm 46:6, Hebrew 46:7)'
    key: bdb
    url: 'https://biblehub.com/hebrew/1993.htm'
    quote: 'be tumultuous, of peoples Psalm 46:7'
  - where: 'note 46:6 “The sea’s words used of the nations”'
    claim: 'The second verb means totter, slip'
    key: bdb
    url: 'https://biblehub.com/hebrew/4131.htm'
    quote: 'totter, slip'
  - where: 'note 46:6 “The sea’s words used of the nations”'
    claim: 'In the passive stem (verse 5) it is be shaken, moved, overthrown'
    key: bdb
    url: 'https://biblehub.com/hebrew/4131.htm'
    quote: 'be shaken, moved, overthrown'
  - where: 'note 46:6 “The sea’s words used of the nations”'
    claim: 'A modern translation of verse 6'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2046&version=NRSVUE'
    quote: 'The nations are in an uproar; the kingdoms totter'
  - where: 'note 46:6 “The sea’s words used of the nations”'
    claim: 'A modern translation of verse 5'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2046&version=NRSVUE'
    quote: 'God is in the midst of the city; it shall not be moved'
  - where: 'note 46:6 “The sea’s words used of the nations”'
    claim: 'Isaiah 17:12 compares the noise of peoples to the seas'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/17?lang=eng'
    quote: 'Woe to the multitude of many people, which make a noise like the noise of the seas'

