chapter: 140
claims:
  # ---------- when / setting / thread ----------
  - where: when
    claim: 'The Church’s edition heads the psalm as a prayer of David for deliverance from his enemies; the title names David and gives no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/140?lang=eng'
    quote: 'David prays for deliverance from his enemies—The Lord maintains the cause of the poor and afflicted.'
  - where: setting
    claim: 'Delitzsch proposes that the psalm may be explained from the rebellion of Absalom'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/140.htm'
    quote: 'may be explained from the circumstances of the rebellion of Absalom'
  - where: setting
    claim: 'Delitzsch finds Psalms 58 and 64 very similar to this psalm'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/140.htm'
    quote: 'Psalm 58:1-11 and Psalm 64:1-10 are very similar.'
  - where: setting
    claim: 'Psalm 141 prays to be kept from snares and gins'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/141?lang=eng'
    quote: 'Keep me from the snares which they have laid for me, and the gins of the workers of iniquity.'
  - where: setting
    claim: 'Psalm 142 speaks of a snare laid secretly in the speaker’s way'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/142?lang=eng'
    quote: 'In the way wherein I walked have they privily laid a snare for me.'
  - where: setting
    claim: 'Paul quotes verse 3 in Romans 3:13'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/3?lang=eng'
    quote: 'the poison of asps is under their lips'
  - where: thread
    claim: 'Delitzsch says that at verse 12 (his 13, by the Hebrew numbering) the mood changes and the rage has spent itself'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/140.htm'
    quote: 'With Psalm 140:13 the mood and language now again become cheerful, the rage has spent itself'
  - where: thread
    claim: 'The “evil speaker” of verse 11 is rendered “the slanderer” in the NRSVUE'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20140&version=NRSVUE'
    quote: 'Do not let the slanderer be established in the land;'

  # ---------- sections ----------
  - where: section 2 plain
    claim: 'A gin is a trap (verse 5)'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/gin'
    quote: 'A trap; a snare.'
  - where: section 4 plain
    claim: 'The “evil speaker” of verse 11 is a slanderer'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20140&version=NRSVUE'
    quote: 'Do not let the slanderer be established in the land;'

  # ---------- note 140:1 ----------
  - where: 'note 140:1 “One enemy or many”'
    claim: 'The NRSVUE renders the two singulars of verse 1 as plurals'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20140&version=NRSVUE'
    quote: 'Deliver me, O Lord, from evildoers;'
  - where: 'note 140:1 “One enemy or many”'
    claim: 'The NRSVUE has “those who are violent” for “the violent man”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20140&version=NRSVUE'
    quote: 'protect me from those who are violent'
  - where: 'note 140:1 “One enemy or many”'
    claim: 'Delitzsch: the relative clause of verse 2 shows that “the violent man” is not one person only'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/140.htm'
    quote: 'The relative clause shows that אישׁ חמסים is not intended to be understood exclusively of one person.'

  # ---------- note 140:3 ----------
  - where: 'note 140:3 “Paul says it of everyone”'
    claim: 'Paul quotes the line in Romans 3:13, after a line that matches Psalm 5:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/3?lang=eng'
    quote: 'Their throat is an open sepulchre; with their tongues they have used deceit; the poison of asps is under their lips:'
  - where: 'note 140:3 “Paul says it of everyone”'
    claim: 'Brenton’s translation of the Greek psalm has Paul’s line word for word'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/140.htm'
    quote: 'They have sharpened their tongue as the tongue of a serpent; the poison of asps is under their lips.'
  - where: 'note 140:3 “Paul says it of everyone”'
    claim: 'Paul has proved Jews and Gentiles all under sin, and the chain ends with every mouth stopped'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/3?lang=eng'
    quote: 'for we have before proved both Jews and Gentiles, that they are all under sin;'

  # ---------- note 140:5 ----------
  - where: 'note 140:5 “The hunter’s gear”'
    claim: 'In 1828 a gin was a trap or snare'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/gin'
    quote: 'A trap; a snare.'
  - where: 'note 140:5 “The hunter’s gear”'
    claim: 'The NRSVUE has a trap, a net spread with cords, and snares set along the road'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20140&version=NRSVUE'
    quote: 'along the road they have set snares for me.'
  - where: 'note 140:5 “The hunter’s gear”'
    claim: 'The next two psalms return to the snare (141:9; 142:3)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/141?lang=eng'
    quote: 'Keep me from the snares which they have laid for me, and the gins of the workers of iniquity.'
  - where: 'note 140:5 “The hunter’s gear”'
    claim: 'Psalm 142:3 has a snare laid secretly in the way'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/142?lang=eng'
    quote: 'In the way wherein I walked have they privily laid a snare for me.'

  # ---------- note 140:7 ----------
  - where: 'note 140:7 “God as the helmet”'
    claim: 'Delitzsch takes the verb of what God does on the day of battle: He protects the head of His anointed against the deadly blow'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/140.htm'
    quote: 'He protects the head of His anointed against the deadly blow.'
  - where: 'note 140:7 “God as the helmet”'
    claim: 'Delitzsch takes the image to be the helmet and compares Isaiah 59:17'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/140.htm'
    quote: 'point to the helmet as being'
  - where: 'note 140:7 “God as the helmet”'
    claim: 'In Isaiah 59:17 the LORD Himself puts on a helmet of salvation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/59?lang=eng'
    quote: 'For he put on righteousness as a breastplate, and an helmet of salvation upon his head'
  - where: 'note 140:7 “God as the helmet”'
    claim: 'The address of verse 7 is the divine name (pointed to be read as “God”) followed by Adonai, “my Lord”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יְהֹוִ֣ה'
  - where: 'note 140:7 “God as the helmet”'
    claim: 'The NRSVUE renders the second word of the address “my Lord”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20140&version=NRSVUE'
    quote: 'O Lord, my Lord, my strong deliverer,'

  # ---------- note 140:10 ----------
  - where: 'note 140:10 “What the curse asks for”'
    claim: 'Psalm 7:16 says that the wicked man’s mischief returns on his own head'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/7?lang=eng'
    quote: 'His mischief shall return upon his own head, and his violent dealing shall come down upon his own pate.'
  - where: 'note 140:10 “What the curse asks for”'
    claim: 'The “evil speaker” of verse 11 is in Hebrew a “man of tongue,” the noun of verse 3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לָשׁוֹן֮'
  - where: 'note 140:10 “What the curse asks for”'
    claim: 'The NRSVUE renders “evil speaker” as “the slanderer”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20140&version=NRSVUE'
    quote: 'Do not let the slanderer be established in the land;'
  - where: 'note 140:12 “The LORD takes the poor man’s case”'
    claim: 'The NRSVUE renders the verse in the language of a court: the cause of the needy, justice for the poor'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20140&version=NRSVUE'
    quote: 'I know that the Lord maintains the cause of the needy'
  - where: 'note 140:12 “The LORD takes the poor man’s case”'
    claim: 'The NRSVUE has “executes justice for the poor” in the second half'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20140&version=NRSVUE'
    quote: 'and executes justice for the poor.'
  - where: 'note 140:12 “The LORD takes the poor man’s case”'
    claim: 'In Psalm 9:4 David says the same of his own right and cause, with the LORD on the throne as judge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/9?lang=eng'
    quote: 'For thou hast maintained my right and my cause; thou satest in the throne judging right.'

  # ---------- christ ----------
  - where: christ
    claim: 'Paul’s chain of quotations leads to redemption in Christ Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/3?lang=eng'
    quote: 'Being justified freely by his grace through the redemption that is in Christ Jesus:'
