chapter: 19
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'The title ascribes the psalm to David and addresses it to the chief Musician'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/19?lang=eng'
    quote: 'To the chief Musician, A Psalm of David.'
  - where: setting
    claim: 'The title ascribes the psalm to David and addresses it to the chief Musician'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/19?lang=eng'
    quote: 'To the chief Musician, A Psalm of David.'
  - where: setting
    claim: 'The psalm has been categorized as a wisdom hymn with language like that of Proverbs'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'The psalm has been categorized as a wisdom hymn, with language sometimes reminiscent of that found in parts of the book of Proverbs.'
  - where: setting
    claim: 'The psalm divides into praise of God as Creator (1–6) and as Lawgiver (7–14)'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'a hymn of praise to God as Creator (verses 1–6) and a hymn of praise to God as Lawgiver (verses 7–14)'
  - where: setting
    claim: 'One older reading supposes the psalm was prompted by the sky by day, as Psalm 8 by the sky at night'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/19.htm'
    quote: 'if we suppose the Psalm to be called forth by the aspect of the heavens by day, just as Psalm 8:1-9 was by the aspect of the heavens by night'
  - where: setting
    claim: 'On that reading it is morning; the psalmist rejoices at the light and prepares for the day’s work'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/19.htm'
    quote: 'It is morning, and the psalmist rejoices on the one hand at the dawning light of day, and on the other he prepares himself for the days'' work lying before him'
  - where: setting
    claim: 'Psalm 18’s title calls David the servant of the LORD, and both psalms call on the LORD as “my rock”'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/19.htm'
    quote: 'In both Psalms, in the former at the beginning, in the latter at the close, he calls upon Jahve by the name צוּרי, my rock.'
  - where: setting
    claim: 'The title of Psalm 18 calls David the servant of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'A Psalm of David, the servant of the'
  - where: setting
    claim: 'These points of contact have been offered as the reason a collector placed Psalm 19 after Psalm 18, one on God’s revelation in David’s history and the other in nature and the Law'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/19.htm'
    quote: 'have concurred to lead the collector to append Psalm 19:1-14, which celebrates God''s revelation of Himself in nature and in the Law, to Psalm 18, which celebrates God''s revelation of Himself in the history of David'
  - where: setting
    claim: 'Paul quotes verse 4 in Romans 10:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/10?lang=eng'
    quote: 'their sound went into all the earth, and their words unto the ends of the world'

  # ---------- thread ----------
  - where: thread
    claim: 'God is named once in verses 1–6, as El'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֵ֑ל'
  - where: thread
    claim: 'In the first part God is called El once; in the second He is called by the covenant name seven times, the last with further titles'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/19.htm'
    quote: 'in the first part God is called אל according to his relationship of power to the world, and is only mentioned once; whereas in the second part, He is called by His covenant name יהוה, and mentioned seven times'
  - where: thread
    claim: 'No sign marks the transition at verse 7 except the change of the divine name'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/19.htm'
    quote: 'No sign is made use of to mark the transition from the one part to the other, but it is indicated by the introduction of the divine name'
  - where: thread
    claim: 'One reading: the heavens tell God’s glory but not His will'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/19.htm'
    quote: 'the heavens indeed tell of the glory of God, but not of His will'
  - where: thread
    claim: 'The word “hid” in verse 6 is from the Hebrew verb to hide (H5641)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'נִ֝סְתָּ֗ר'
  - where: thread
    claim: 'The word “secret faults” in verse 12 is from the same verb (H5641)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מִֽ/נִּסְתָּר֥וֹת'
  - where: thread
    claim: 'Reflection on the law in verses 7–10 turns the psalmist inward in verses 11–14'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'cause him to turn his thoughts inward as he considers how his own life measures up to the standard of that law and pleads with the Lord to help him do better (verses 11–14)'

  # ---------- sections ----------
  - where: 'section 1 plain'
    claim: 'Verse 3 can be rendered as a statement that the heavens’ voice is not heard'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2019&version=NRSVUE'
    quote: 'their voice is not heard;'
  - where: 'section 1 plain'
    claim: 'Verse 4 is rendered “voice” where the King James has “line”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2019&version=NRSVUE'
    quote: 'yet their voice goes out through all the earth'
  - where: 'section 1 plain'
    claim: 'The tent is set “in the heavens,” and the sun rises at one end and circles to the other'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2019&version=NRSVUE'
    quote: 'In the heavens he has set a tent for the sun,'
  - where: 'section 2 plain'
    claim: '“Converting the soul” is to refresh or restore it'
    key: bdb
    url: 'https://biblehub.com/hebrew/7725.htm'
    quote: 'accusative נֶפֶשׁ = refresh Lamentations 1:11,16,19; Psalm 19:8; Proverbs 25:13; Ruth 4:15.'
  - where: 'section 2 plain'
    claim: '“Statutes” is rendered “precepts”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2019&version=NRSVUE'
    quote: 'the precepts of the Lord are right,'
  - where: 'section 2 plain'
    claim: 'The honeycomb line is honey dripping from the comb'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2019&version=NRSVUE'
    quote: 'and drippings of the honeycomb.'
  - where: 'section 3 plain'
    claim: '“Cleanse” is to acquit or clear; “secret faults” are hidden ones'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2019&version=NRSVUE'
    quote: 'Clear me from hidden faults.'
  - where: 'section 3 plain'
    claim: 'The word in verse 13 may be read as presumptuous men'
    key: bdb
    url: 'https://biblehub.com/hebrew/2086.htm'
    quote: 'also from presumptuous men hold back thy servant'
  - where: 'section 3 plain'
    claim: '“Upright” is rendered “blameless”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2019&version=NRSVUE'
    quote: 'Then I shall be blameless'
  - where: 'section 3 plain'
    claim: '“My strength” is rendered “my rock”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2019&version=NRSVUE'
    quote: 'my rock and my redeemer.'

  # ---------- note 19:1 ----------
  - where: 'note 19:1 “Creation as a witness of God”'
    claim: 'Alma tells Korihor that all things denote there is a God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/30?lang=eng'
    quote: 'all things denote there is a God; yea, even the earth, and all things that are upon the face of it, yea, and its motion, yea, and also all the planets which move in their regular form do witness that there is a Supreme Creator.'
  - where: 'note 19:1 “Creation as a witness of God”'
    claim: 'The first half of the psalm recalls the reasoning of Alma’s testimony to Korihor'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'The expressions of awe inspired by the majesty of God’s handiwork in this hymn recall the reasoning featured in the prophet Alma’s testimony to Korihor in the Book of Mormon'
  - where: 'note 19:1 “Creation as a witness of God”'
    claim: 'D&C 88:45 describes the sun, moon and stars giving their light'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'the sun giveth his light by day, and the moon giveth her light by night, and the stars also give their light'
  - where: 'note 19:1 “Creation as a witness of God”'
    claim: 'D&C 88:47 says that whoever has seen the least of these has seen God moving in majesty and power'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'any man who hath seen any or the least of these hath seen God moving in his majesty and power'
  - where: 'note 19:1 “Creation as a witness of God”'
    claim: 'An astronaut speaking in general conference joined Psalm 19:1 and D&C 88:47 as they came to mind while he looked at the earth from orbit'
    key: lind-heavens-declare
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1985/10/the-heavens-declare-the-glory-of-god?lang=eng'
    quote: '“The heavens declare the glory of God.” (Ps. 19:1.) If you have seen the heavens, you have “seen God moving in his majesty and power.” (D&C 88:47.)'
  - where: 'note 19:1 “Creation as a witness of God”'
    claim: 'The speaker was describing looking down on the earth from space'
    key: lind-heavens-declare
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1985/10/the-heavens-declare-the-glory-of-god?lang=eng'
    quote: 'To look down on the earth from space is absolutely incredible.'
  - where: 'note 19:1 “Creation as a witness of God”'
    claim: '“Declare” is a participle in Hebrew (morphology HVprmpa)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מְֽסַפְּרִ֥ים'
  - where: 'note 19:1 “Creation as a witness of God”'
    claim: 'A modern translation renders the participle “are telling”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2019&version=NRSVUE'
    quote: 'The heavens are telling the glory of God,'
  - where: 'note 19:1 “Creation as a witness of God”'
    claim: 'The name for God in verse 1 is El'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'כְּבֽוֹד'

  # ---------- note 19:3 ----------
  - where: 'note 19:3 “Speech in every language, or speech without sound”'
    claim: 'The Hebrew line ends with “without” (beli), with no word for “where”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בְּ֝לִ֗י'
  - where: 'note 19:3 “Speech in every language, or speech without sound”'
    claim: 'then “heard” (a participle of the verb to hear)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'נִשְׁמָ֥ע'
  - where: 'note 19:3 “Speech in every language, or speech without sound”'
    claim: 'then “their voice”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'קוֹלָֽ/ם'
  - where: 'note 19:3 “Speech in every language, or speech without sound”'
    claim: 'The Greek translation reads the line as the King James does'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/19.htm'
    quote: 'There are no speeches or words, in which their voices are not heard.'
  - where: 'note 19:3 “Speech in every language, or speech without sound”'
    claim: 'A modern translation makes the line an independent statement'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2019&version=NRSVUE'
    quote: 'their voice is not heard;'
  - where: 'note 19:3 “Speech in every language, or speech without sound”'
    claim: 'and begins verse 4 with “yet”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2019&version=NRSVUE'
    quote: 'yet their voice goes out through all the earth'

  # ---------- note 19:4 ----------
  - where: 'note 19:4 “Line or sound, and Paul’s quotation”'
    claim: 'The Hebrew word is a measuring line'
    key: bdb
    url: 'https://biblehub.com/hebrew/6957.htm'
    quote: 'measuring-line'
  - where: 'note 19:4 “Line or sound, and Paul’s quotation”'
    claim: 'In this verse the line is taken as a figure of the heavens’ domain, and the lexicon judges the text probably read “their sound”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6957.htm'
    quote: '(AV their line. figurative of their domain) read probably קֹלָם their sound'
  - where: 'note 19:4 “Line or sound, and Paul’s quotation”'
    claim: 'The Greek translation has “voice”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/19.htm'
    quote: 'Their voice is gone out into all the earth, and their words to the ends of the world.'
  - where: 'note 19:4 “Line or sound, and Paul’s quotation”'
    claim: '“Their line” in the Hebrew text of verse 4'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'קַוָּ֗/ם'
  - where: 'note 19:4 “Line or sound, and Paul’s quotation”'
    claim: '“Their voice,” the last word of verse 3, which differs from “their line” by one consonant'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'קוֹלָֽ/ם'
  - where: 'note 19:4 “Line or sound, and Paul’s quotation”'
    claim: 'Paul has just said that faith comes by hearing the word'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/10?lang=eng'
    quote: 'So then faith cometh by hearing, and hearing by the word of God.'
  - where: 'note 19:4 “Line or sound, and Paul’s quotation”'
    claim: 'Paul quotes the verse with “sound”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/10?lang=eng'
    quote: 'But I say, Have they not heard? Yes verily, their sound went into all the earth, and their words unto the ends of the world.'

  # ---------- note 19:5 ----------
  - where: 'note 19:5 “The sun as bridegroom and runner”'
    claim: 'The “chamber” is a bride-chamber, at root a canopy'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/19.htm'
    quote: 'shows that this word means a bride-chamber; properly (from חפף to cover) it means a canopy'
  - where: 'note 19:5 “The sun as bridegroom and runner”'
    claim: 'A modern translation has “wedding canopy”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2019&version=NRSVUE'
    quote: 'which comes out like a bridegroom from his wedding canopy,'
  - where: 'note 19:5 “The sun as bridegroom and runner”'
    claim: 'One reading: the bridegroom is the freshness of the morning light'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/19.htm'
    quote: 'The morning light has in it a freshness and cheerfulness, as it were a renewed youth.'
  - where: 'note 19:5 “The sun as bridegroom and runner”'
    claim: 'The Greek has “giant” for the strong man'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/19.htm'
    quote: 'he will exult as a giant to run his course'
  - where: 'note 19:5 “The sun as bridegroom and runner”'
    claim: 'The sun is like a hero in its course'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/19.htm'
    quote: 'inasmuch as it marches on its way ever anew, light-giving and triumphant'
  - where: 'note 19:5 “The sun as bridegroom and runner”'
    claim: 'The word in verse 6 is the heat of the sun'
    key: bdb
    url: 'https://biblehub.com/hebrew/2535.htm'
    quote: 'heat of sun Psalm 19:7.'
  - where: 'note 19:5 “The sun as bridegroom and runner”'
    claim: 'The heat is the sun’s enlightening and warming influence'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/19.htm'
    quote: 'is the enlightening and warming influence of the sun'

  # ---------- note 19:7 structure ----------
  - where: 'note 19:7 “From the sun to the law”'
    claim: 'God is named once in verses 1–6, as El (verse 1)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֵ֑ל'
  - where: 'note 19:7 “From the sun to the law”'
    claim: 'The divine name begins at verse 7'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תּ֘וֹרַ֤ת'
  - where: 'note 19:7 “From the sun to the law”'
    claim: 'El once in the first part, the covenant name seven times in the second'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/19.htm'
    quote: 'in the first part God is called אל according to his relationship of power to the world, and is only mentioned once; whereas in the second part, He is called by His covenant name יהוה, and mentioned seven times'
  - where: 'note 19:7 “From the sun to the law”'
    claim: 'No connecting word marks the change of subject'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/19.htm'
    quote: 'No sign is made use of to mark the transition from the one part to the other'
  - where: 'note 19:7 “From the sun to the law”'
    claim: 'The psalm is read as two hymns, to the Creator and to the Lawgiver'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'a hymn of praise to God as Creator (verses 1–6) and a hymn of praise to God as Lawgiver (verses 7–14)'
  - where: 'note 19:7 “From the sun to the law”'
    claim: 'One reading: the heavens tell God’s glory but not His will'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/19.htm'
    quote: 'the heavens indeed tell of the glory of God, but not of His will'
  - where: 'note 19:7 “From the sun to the law”'
    claim: 'The word for “pure” also means clear'
    key: bdb
    url: 'https://biblehub.com/hebrew/1249.htm'
    quote: 'pure, clear: בר לבב pure in heart Psalm 24:4'
  - where: 'note 19:7 “From the sun to the law”'
    claim: 'The commandment’s purity has been glossed as the clearness of sunlight'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/19.htm'
    quote: 'clear, like the light of the sun'
  - where: 'note 19:7 “From the sun to the law”'
    claim: '“Hid” in verse 6 is from the verb to hide (H5641)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'נִ֝סְתָּ֗ר'
  - where: 'note 19:7 “From the sun to the law”'
    claim: '“Secret faults” in verse 12 is from the same verb (H5641)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מִֽ/נִּסְתָּר֥וֹת'
  - where: 'note 19:7 “From the sun to the law”'
    claim: 'The word for “law” means instruction or teaching'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/19.htm'
    quote: 'does not in itself mean the law, but a pointing out, instruction, doctrine or teaching'
  - where: 'note 19:7 “From the sun to the law”'
    claim: 'One reading: “the fear of the LORD” is here a precept, what revelation demands'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/19.htm'
    quote: 'is not the fear of God as an act performed, but as a precept, it is what God''s revelation demands, effects, and maintains'

  # ---------- note 19:7 words ----------
  - where: 'note 19:7 “Converting the soul means restoring it”'
    claim: 'The verb is to turn back, return'
    key: bdb
    url: 'https://biblehub.com/hebrew/7725.htm'
    quote: 'turn back, return:'
  - where: 'note 19:7 “Converting the soul means restoring it”'
    claim: 'With “soul” as object it means to refresh, as in this verse (Hebrew 19:8)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7725.htm'
    quote: 'accusative נֶפֶשׁ = refresh Lamentations 1:11,16,19; Psalm 19:8; Proverbs 25:13; Ruth 4:15.'
  - where: 'note 19:7 “Converting the soul means restoring it”'
    claim: 'A modern translation has “reviving the soul”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2019&version=NRSVUE'
    quote: 'reviving the soul;'
  - where: 'note 19:7 “Converting the soul means restoring it”'
    claim: 'The same verb (H7725) stands in Psalm 23:3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יְשׁוֹבֵ֑ב'
  - where: 'note 19:7 “Converting the soul means restoring it”'
    claim: 'The form in this verse (H7725)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מְשִׁ֣יבַת'
  - where: 'note 19:7 “Converting the soul means restoring it”'
    claim: '“Perfect,” said of the law, is sound, wholesome, unimpaired'
    key: bdb
    url: 'https://biblehub.com/hebrew/8549.htm'
    quote: 'sound, wholesome, unimpaired, innocent, having integrity: of God''s way Psalm 18:31 = 2 Samuel 22:31; work Deuteronomy 32:4; law Psalm 19:8'
  - where: 'note 19:7 “Converting the soul means restoring it”'
    claim: 'The simple person is open-minded'
    key: bdb
    url: 'https://biblehub.com/hebrew/6612.htm'
    quote: 'adjective simple, possibly as open-minded'
  - where: 'note 19:7 “Converting the soul means restoring it”'
    claim: 'open to wisdom or to folly'
    key: bdb
    url: 'https://biblehub.com/hebrew/6612.htm'
    quote: 'open to the instruction of wisdom or folly'
  - where: 'note 19:7 “Converting the soul means restoring it”'
