chapter: 49
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The title gives the psalm to the sons of Korah and names no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/49?lang=eng'
    quote: 'To the chief Musician, A Psalm for the sons of Korah.'

  # ---- setting ----
  - where: 'setting'
    claim: 'The sons of Korah were descendants of Korah who sang at the temple'
    key: scripture-helps-ps-49
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/33-psalms-49-51-61-66-69-72-77-78-85-86?lang=eng'
    quote: 'The sons of Korah were some of Korah’s descendants who eventually functioned as priestly musicians and sang at the temple.'
  - where: 'setting'
    claim: 'Psalms 42 and 44–49 carry the name of the sons of Korah, so Psalm 49 closes the first run (the others are 84–85 and 87–88)'
    key: scripture-helps-ps-49
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/33-psalms-49-51-61-66-69-72-77-78-85-86?lang=eng'
    quote: 'The sons of Korah are mentioned in Psalms 42; 44–49; 84–85; and 87–88.'
  - where: 'setting'
    claim: 'The psalm is a teaching poem in which the poet addresses men as a preacher'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/49.htm'
    quote: 'The poet here steps forward as a preacher in the midst of men.'
  - where: 'setting'
    claim: 'The psalm is counted among the didactic psalms'
    key: bdb
    url: 'https://biblehub.com/hebrew/4912.htm'
    quote: 'didactic psalms Psalm 49:5; Psalm 78:2.'
  - where: 'setting'
    claim: 'The psalm has an introduction and two parts marked out by a refrain'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/49.htm'
    quote: 'the two parts of the sermon following thereupon, Psalm 49:6, Psalm 49:14, which are marked out by a refrain, in which there is only a slight variation of expression'
  - where: 'setting'
    claim: 'God (Elohim) is named in verse 7 (Hebrew 49:8)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לֵ/אלֹהִ֣ים'
  - where: 'setting'
    claim: 'Nephi’s psalm may echo verse 15'
    key: hilton-psalms-bom
    url: 'https://rsc.byu.edu/ascending-mountain-lord/old-testament-psalms-book-mormon'
    quote: 'O Lord, wilt thou redeem my soul [Psalm 49:15]?'
  - where: 'setting'
    claim: 'Verse 15 was taught in general conference of the Atonement of Jesus Christ'
    key: curtis-redemption
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2011/10/redemption?lang=eng'
    quote: 'The Psalmist wrote, “But God will redeem my soul from the power of the grave” (Psalm 49:15).'

  # ---- thread ----
  - where: 'thread'
    claim: 'Among men a life could sometimes be bought back with money, but no ransom can be given to God'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/49.htm'
    quote: 'Among men certainly it is possible under some circumstances for one who is delivered over to death to be freed by money'
  - where: 'thread'
    claim: 'The verb “redeem” in verse 15 (Hebrew 49:16) is the verb of verse 7 (Hebrew 49:8): H6299 in both'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יִפְדֶּ֣ה'
  - where: 'thread'
    claim: 'The contrast of the psalm is that no man can redeem another and God only can'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/49.htm'
    quote: 'no man can redeem another, Elohim only can redeem man'
  - where: 'thread'
    claim: 'Death is the shepherd of the flock in verse 14'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'Death shall be their shepherd'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Parable” is a proverb and “dark saying” a riddle'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'I will incline my ear to a proverb'
  - where: 'section 1 plain'
    claim: '“Dark saying” is a riddle, set to the music of the harp'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'I will solve my riddle to the music of the harp.'
  - where: 'section 2 plain'
    claim: '“My heels” means those who would take advantage of the speaker'
    key: bdb
    url: 'https://biblehub.com/hebrew/6120.htm'
    quote: 'i.e. of those who would take some insidious advantage of me.'
  - where: 'section 2 plain'
    claim: '“Precious” is “be costly”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3365.htm'
    quote: 'c. be costly,'
  - where: 'section 2 plain'
    claim: '“It ceaseth for ever”: the one who would pay must let it alone for ever'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/49.htm'
    quote: 'he (whoever might wish to lay it down) lets it alone (is obliged to let it alone) for ever'
  - where: 'section 2 plain'
    claim: '“Corruption” in verse 9 is the pit'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'and never see the Pit.'
  - where: 'section 3 plain'
    claim: '“Their inward thought”: what is within them is the belief that their houses are for ever'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/49.htm'
    quote: 'the contents of their inward part is the self-delusion that their houses are everlasting'
  - where: 'section 3 plain'
    claim: '“Abideth not”: continue, endure'
    key: bdb
    url: 'https://biblehub.com/hebrew/3885.htm'
    quote: 'absolute, of man, continue, endure, Psalm 49:13'
  - where: 'section 4 plain'
    claim: '“Feed on them” is “shepherd them”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'Death shall be their shepherd'
  - where: 'section 4 plain'
    claim: '“Their beauty shall consume” is “their form shall waste away”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'and their form shall waste away'
  - where: 'section 4 plain'
    claim: '“From the power of the grave” is literally “from the hand of Sheol” (H3027, hand; Hebrew 49:16)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מִֽ/יַּד'
  - where: 'section 4 plain'
    claim: '“Receive” is the verb “take” (H3947); the hope is that God will take him to Himself'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/49.htm'
    quote: 'gives expression to the hope, that God will wrest him out of the power of'
  - where: 'section 5 plain'
    claim: '“He blessed his soul”: counted himself happy'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'Though in their lifetime they count themselves happy'

  # ---- note 49:4 ----
  - where: 'note 49:4 “A riddle set to the harp”'
    claim: 'Mashal is a proverb or parable, used also of a poem of various kinds, including this psalm'
    key: bdb
    url: 'https://biblehub.com/hebrew/4912.htm'
    quote: '5 poem, of various kinds:'
  - where: 'note 49:4 “A riddle set to the harp”'
    claim: 'Mashal is the word for a proverb'
    key: bdb
    url: 'https://biblehub.com/hebrew/4912.htm'
    quote: 'noun masculineIsaiah 14:4 proverb, parable (of sentences constructed in parallelism, usually of Hebrew Wisdom, but occasionally of other types)'
  - where: 'note 49:4 “A riddle set to the harp”'
    claim: 'Hidah is a riddle or perplexing saying'
    key: bdb
    url: 'https://biblehub.com/hebrew/2420.htm'
    quote: 'noun feminine riddle, enigmatic, perplexing saying or question'
  - where: 'note 49:4 “A riddle set to the harp”'
    claim: 'The word is used of Samson’s riddle in Judges 14'
    key: bdb
    url: 'https://biblehub.com/hebrew/2420.htm'
    quote: '2 riddle, enigma, to be guessed, in Judges 14:'
  - where: 'note 49:4 “A riddle set to the harp”'
    claim: 'The word is used of the queen of Sheba’s questions to Solomon'
    key: bdb
    url: 'https://biblehub.com/hebrew/2420.htm'
    quote: '3 perplexing questions by which queen of Sheba put Solomon to the test'
  - where: 'note 49:4 “A riddle set to the harp”'
    claim: 'In this verse the word is taken as a perplexing moral problem, with the verb “open, propound”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2420.htm'
    quote: 'perplexing moral problem Psalm 49:5 (with'
  - where: 'note 49:4 “A riddle set to the harp”'
    claim: 'The verb with the riddle is taken as “open, propound”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2420.htm'
    quote: 'open, propound;'
  - where: 'note 49:4 “A riddle set to the harp”'
    claim: 'A modern translation has “solve my riddle”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'I will solve my riddle to the music of the harp.'
  - where: 'note 49:4 “A riddle set to the harp”'
    claim: 'The noun in verse 4 (Hebrew 49:5) is mashal, H4912'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לְ/מָשָׁ֣ל'

  # ---- note 49:5 ----
  - where: 'note 49:5 “Heels, or those at his heels”'
    claim: 'The Greek reads “the iniquity of my heel”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/49.htm'
    quote: 'the iniquity of my heel shall compass me.'
  - where: 'note 49:5 “Heels, or those at his heels”'
    claim: 'The word is taken as a verbal adjective, “overreacher,” distinct from the noun “heel”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6120.htm'
    quote: 'verbal adjective overreacher, Psalm 49:6'
  - where: 'note 49:5 “Heels, or those at his heels”'
    claim: 'The phrase speaks of those who would take advantage of the speaker'
    key: bdb
    url: 'https://biblehub.com/hebrew/6120.htm'
    quote: 'i.e. of those who would take some insidious advantage of me.'
  - where: 'note 49:5 “Heels, or those at his heels”'
    claim: 'A modern translation has “my persecutors,” and continues the sentence into verse 6'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'when the iniquity of my persecutors surrounds me,'
  - where: 'note 49:5 “Heels, or those at his heels”'
    claim: 'Verse 6 continues the description: “those who trust in their wealth”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'those who trust in their wealth'
  - where: 'note 49:5 “Heels, or those at his heels”'
    claim: 'The heel is an instrument of attack in Psalm 41:9 (Hebrew 41:10), a figure for taking cruel advantage'
    key: bdb
    url: 'https://biblehub.com/hebrew/6119.htm'
    quote: 'hath made great the heel against me, i.e. given me insidiously a great fall (figurative for taken some cruel advantage of me'
  - where: 'note 49:5 “Heels, or those at his heels”'
    claim: 'Verse 6 (Hebrew 49:7) opens with a participle with the article, “those who trust” (H982, morphology HTd/Vqrmpa); hebrew.mjs psalms 49:6 shows the only finite verb is the reflexive “boast” at the end'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הַ/בֹּטְחִ֥ים'

  # ---- note 49:7 ----
  - where: 'note 49:7 “The price of a life”'
    claim: 'Kopher is the price of a life, a ransom'
    key: bdb
    url: 'https://biblehub.com/hebrew/3724.htm'
    quote: 'noun masculine the price of a life, ransom'
  - where: 'note 49:7 “The price of a life”'
    claim: 'Kopher is used in Exodus 21:30, in parallel with “redemption of his life”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3724.htm'
    quote: '1 a price for ransom of a life Job 33:24; Job 36:18;'
  - where: 'note 49:7 “The price of a life”'
    claim: 'The noun “redemption” of verse 8 (Hebrew 49:9) occurs with “soul/life” in Exodus 21:30 and here'
    key: bdb
    url: 'https://biblehub.com/hebrew/6306.htm'
    quote: 'Exodus 21:30 (E), Psalm 49:9.'
  - where: 'note 49:7 “The price of a life”'
    claim: 'The law of the goring ox allows a sum of money as the ransom of the owner’s life'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/21?lang=eng'
    quote: 'If there be laid on him a sum of money, then he shall give for the ransom of his life whatsoever is laid upon him.'
  - where: 'note 49:7 “The price of a life”'
    claim: '“Precious” in verse 8 means costly'
    key: bdb
    url: 'https://biblehub.com/hebrew/3365.htm'
    quote: 'c. be costly,'
  - where: 'note 49:7 “The price of a life”'
    claim: '“Ceaseth” is a verb for cease, forbear, with this verse listed'
    key: bdb
    url: 'https://biblehub.com/hebrew/2308.htm'
    quote: 'no complem. expressed, cease, forbear Judges 15:7'
  - where: 'note 49:7 “The price of a life”'
    claim: 'A modern translation renders verses 7–8 generally: no ransom avails, and it can never suffice'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'Truly, no ransom avails for one’s life;'
  - where: 'note 49:7 “The price of a life”'
    claim: 'The same translation has “and can never suffice” for “it ceaseth for ever”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'and can never suffice,'
  - where: 'note 49:7 “The price of a life”'
    claim: 'The translation’s footnote gives “no one can ransom a brother” as the alternative'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'Or no one can ransom a brother'
  - where: 'note 49:7 “The price of a life”'
    claim: '“Corruption” in verse 9 (Hebrew 49:10) is “pit,” the pit of Sheol, as in Psalm 16:10'
    key: bdb
    url: 'https://biblehub.com/hebrew/7845.htm'
    quote: 'noun feminine pit;'
  - where: 'note 49:7 “The price of a life”'
    claim: 'The Greek keeps “brother” at the head of the sentence'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/49.htm'
    quote: 'A brother does not redeem, shall a man redeem?'

  # ---- note 49:11 ----
  - where: 'note 49:11 “Houses for ever, or graves for houses”'
    claim: 'The Hebrew text has qirbam, “their inward part” (H7130; Hebrew 49:12)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'קִרְבָּ֤/ם'
  - where: 'note 49:11 “Houses for ever, or graves for houses”'
    claim: 'The word is the inward part as the faculty of thought'
    key: bdb
    url: 'https://biblehub.com/hebrew/7130.htm'
    quote: 'b. as faculty of thought and emotion'
  - where: 'note 49:11 “Houses for ever, or graves for houses”'
    claim: 'The Greek reads “their sepulchres are their houses for ever”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/49.htm'
    quote: 'And their sepulchres are their houses for ever, even their tabernacles to all generations'
  - where: 'note 49:11 “Houses for ever, or graves for houses”'
    claim: 'A modern translation adopts the reading “graves”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'Their graves are their homes forever,'
  - where: 'note 49:11 “Houses for ever, or graves for houses”'
    claim: 'The translation’s note says it follows the Greek and Syriac against the Hebrew “their inward thought”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'Gk Syr Compare Tg: Heb their inward thought'
  - where: 'note 49:11 “Houses for ever, or graves for houses”'
    claim: 'The same translation ends the verse with the naming of lands'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'though they named lands their own.'

  # ---- note 49:12 ----
  - where: 'note 49:12 “A refrain with one word changed”'
    claim: 'The verb of verse 12 (Hebrew 49:13) is yalin (H3885)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יָלִ֑ין'
  - where: 'note 49:12 “A refrain with one word changed”'
    claim: 'The verb of verse 20 (Hebrew 49:21) is yavin (H995); the two differ by one letter'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יָבִ֑ין'
  - where: 'note 49:12 “A refrain with one word changed”'
    claim: 'The verb of verse 12 is used of man in the sense continue, endure'
    key: bdb
    url: 'https://biblehub.com/hebrew/3885.htm'
    quote: 'absolute, of man, continue, endure, Psalm 49:13'
  - where: 'note 49:12 “A refrain with one word changed”'
    claim: 'The Greek has “understands not” in verse 12 as well'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/49.htm'
    quote: 'And man being in honour, understands not: he is compared to the senseless cattle, and is like to them.'
  - where: 'note 49:12 “A refrain with one word changed”'
    claim: 'A modern translation has “cannot abide in their pomp” in both verses'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'Mortals cannot abide in their pomp;'

  # ---- note 49:14 ----
  - where: 'note 49:14 “Death as their shepherd”'
    claim: 'The verb “feed” is pasture, tend, and its use with Death here is listed as a metaphor'
    key: bdb
    url: 'https://biblehub.com/hebrew/7462.htm'
    quote: 'a. pasture, tend (pascere), literal, with accusative'
  - where: 'note 49:14 “Death as their shepherd”'
    claim: 'A modern translation has “Death shall be their shepherd”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'Death shall be their shepherd'
  - where: 'note 49:14 “Death as their shepherd”'
    claim: '“The grave” is Sheol both times in the verse (H7585; Hebrew 49:15)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לִֽ/שְׁא֣וֹל'
  - where: 'note 49:14 “Death as their shepherd”'
    claim: 'One older reading contrasts Death with the good Shepherd of Psalm 23'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/49.htm'
    quote: 'Not the good Shepherd (Psalm 23:1), whose pasture is the land of the living, but Death, into whose power they have fallen irrecoverably, shall pasture them.'
  - where: 'note 49:14 “Death as their shepherd”'
    claim: 'A modern translation marks the verse as uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'Meaning of Heb uncertain'
  - where: 'note 49:14 “Death as their shepherd”'
    claim: 'The same translation replaces the clause about the upright with a correction'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'Cn: Heb the upright shall have dominion over them in the morning'
  - where: 'note 49:14 “Death as their shepherd”'
    claim: 'Morning in poetry is a figure of joy after a night of distress, with this verse listed'
    key: bdb
    url: 'https://biblehub.com/hebrew/1242.htm'
    quote: 'figurative of bright joy after night of distress (poetry)'
  - where: 'note 49:14 “Death as their shepherd”'
    claim: 'One older reading takes the morning as the end of oppression for all the upright'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/49.htm'
    quote: 'a morning which not merely for individuals, but for all the upright, will be the end of oppression and the dawn of dominion'
  - where: 'note 49:14 “Death as their shepherd”'
    claim: 'The same reading says that in New Testament language this is the resurrection morning'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/49.htm'
    quote: 'expressed in New Testament language, of the resurrection morn'
  - where: 'note 49:14 “Death as their shepherd”'
    claim: '“Their beauty” is their outward form'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/49.htm'
    quote: 'Here the word is used to denote materiality or corporeity, including the whole outward appearance'
  - where: 'note 49:14 “Death as their shepherd”'
    claim: 'A modern translation: their form wastes away and Sheol is their home'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'and their form shall waste away;'
  - where: 'note 49:14 “Death as their shepherd”'
    claim: 'The same translation ends the verse “Sheol shall be their home”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2049&version=NRSVUE'
    quote: 'Sheol shall be their home.'
  - where: 'note 49:14 “Death as their shepherd”'
    claim: 'The last clause answers the houses of verse 11'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/49.htm'
    quote: 'To them, who thought to have built houses for eternity and called great districts of country after their own names, there remains no longer any'

  # ---- note 49:15 (receive) ----
  - where: 'note 49:15 “The verb used of Enoch”'
    claim: '“Receive” is the verb laqach, take (H3947; Hebrew 49:16)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יִקָּחֵ֣/נִי'
  - where: 'note 49:15 “The verb used of Enoch”'
    claim: 'The same verb is used of God taking Enoch in Genesis 5:24'
    key: bdb
    url: 'https://biblehub.com/hebrew/3947.htm'
    quote: 'Genesis 5:24 (P)'
  - where: 'note 49:15 “The verb used of Enoch”'
    claim: 'God took Enoch'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/5?lang=eng'
