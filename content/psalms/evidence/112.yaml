chapter: 112
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The psalm has no title: the Church’s page begins at verse 1 with the hallelujah (footnotes.mjs psalms 112: “Title: (none)”)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/112?lang=eng'
    quote: 'Praise ye the Lord. Blessed is the man that feareth the Lord, that delighteth greatly in his commandments.'

  # ---- setting ----
  - where: 'setting'
    claim: 'Psalm 111 opens with the same “Praise ye the LORD”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/111?lang=eng'
    quote: 'Praise ye the Lord. I will praise the Lord with my whole heart, in the assembly of the upright, and in the congregation.'
  - where: 'setting'
    claim: 'Psalm 111 has been called the first of a trilogy of hallelujah psalms'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/111.htm'
    quote: 'With Psalm 111:1-10 begins a trilogy of Hallelujah-Psalms.'
  - where: 'setting'
    claim: 'Psalms 111 and 112 are both alphabetic, each of twenty-two lines beginning with the twenty-two letters'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/111.htm'
    quote: 'both are sententious, and both alphabetical. Each consists of twenty-two lines with the twenty-two letters of the alphabet at the beginning'
  - where: 'setting'
    claim: 'The alphabet begins at “Blessed” (aleph), after the hallelujah, which stands outside it; the lines run two to a verse through verse 8 and three in verses 9 and 10 (hebrew.mjs psalms 112:1-10: the line-opening words run aleph to tav, verse 9 with pe, tsade, qof and verse 10 with resh, shin, tav)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אַשְׁרֵי'
  - where: 'setting'
    claim: 'Psalm 112 celebrates those whose conduct follows the divine pattern, as Psalm 111 celebrated God’s government'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/112.htm'
    quote: 'is now followed by another coinciding with it in structure … which celebrates the men whose conduct is ordered after the divine pattern.'
  - where: 'setting'
    claim: 'Paul quotes verse 9 in 2 Corinthians 9:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-cor/9?lang=eng'
    quote: '(As it is written, He hath dispersed abroad; he hath given to the poor: his righteousness remaineth for ever.'

  # ---- thread ----
  - where: 'thread'
    claim: 'Psalm 111 ends with the fear of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/111?lang=eng'
    quote: 'The fear of the Lord is the beginning of wisdom: a good understanding have all they that do his commandments: his praise endureth for ever.'
  - where: 'thread'
    claim: 'Psalm 111 says of the LORD that His righteousness endures for ever and that He is gracious and full of compassion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/111?lang=eng'
    quote: 'He hath made his wonderful works to be remembered: the Lord is gracious and full of compassion.'

  # ---- sections ----
  - where: 'section 2 plain'
    claim: 'Verse 5 can be rendered as a statement that it goes well with the generous man'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20112&version=NRSVUE'
    quote: 'It is well with those who deal generously and lend'
  - where: 'section 3 plain'
    claim: 'Verse 8 means looking in triumph on enemies'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20112&version=NRSVUE'
    quote: 'in the end they will look in triumph on their foes.'
  - where: 'section 3 plain'
    claim: '“Dispersed” in verse 9 is giving freely'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20112&version=NRSVUE'
    quote: 'They have distributed freely; they have given to the poor'

  # ---- note 112:1 ----
  - where: 'note 112:1 “Psalm 111’s lines, said again of a man”'
    claim: 'Psalm 111:10 joins the fear of the LORD and the doing of His commandments'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/111?lang=eng'
    quote: 'The fear of the Lord is the beginning of wisdom: a good understanding have all they that do his commandments'
  - where: 'note 112:1 “Psalm 111’s lines, said again of a man”'
    claim: 'Psalm 111:3 says “his righteousness endureth for ever” of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/111?lang=eng'
    quote: 'His work is honourable and glorious: and his righteousness endureth for ever.'
  - where: 'note 112:1 “Psalm 111’s lines, said again of a man”'
    claim: 'Psalm 111:4 says the LORD is gracious and full of compassion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/111?lang=eng'
    quote: 'He hath made his wonderful works to be remembered: the Lord is gracious and full of compassion.'
  - where: 'note 112:1 “Psalm 111’s lines, said again of a man”'
    claim: 'One reading: what Psalm 111:3 says of God’s righteousness, Psalm 112:3 says of the God-fearer’s, which is the copy of the divine and the work and gift of God'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/112.htm'
    quote: 'this also standeth fast for ever, it is indeed the copy of the divine, it is the work and gift of God'

  # ---- note 112:3 ----
  - where: 'note 112:3 “Wealth, and what the psalm says he does with it”'
    claim: '“Discretion” in verse 5 is rendered “justice” in a modern translation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20112&version=NRSVUE'
    quote: 'who conduct their affairs with justice.'
  - where: 'note 112:3 “Wealth, and what the psalm says he does with it”'
    claim: 'The Greek version renders it “with judgment”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/112.htm'
    quote: 'The good man is he that pities and lends: he will direct his affairs with judgment.'
  - where: 'note 112:3 “Wealth, and what the psalm says he does with it”'
    claim: 'Paul, quoting verse 9, says God gives sufficiency so that the saints may abound to every good work'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-cor/9?lang=eng'
    quote: 'And God is able to make all grace abound toward you; that ye, always having all sufficiency in all things, may abound to every good work:'

  # ---- note 112:4 ----
  - where: 'note 112:4 “Who is gracious and full of compassion”'
    claim: 'The second half of verse 4 begins with an adjective and has no pronoun or verb; the King James “he is” is supplied (bracketed on the interlinear page; the raw Hebrew file has three adjectives, H2587, H7349, H6662)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/112-4.htm'
    quote: 'Unto the upright there ariseth light in the darkness: [he is] gracious, and full of compassion, and righteous.'
  - where: 'note 112:4 “Who is gracious and full of compassion”'
    claim: 'One reading takes the three adjectives as naming God by His attributes, pointing back to Exodus 34:6 and Psalm 111:4'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/112.htm'
    quote: 'The three adjectives (as in Psalm 111:4, pointing back to Exodus 34:6, cf. Psalm 145:8; Psalm 116:5) are a mention of God according to His attributes.'
  - where: 'note 112:4 “Who is gracious and full of compassion”'
    claim: 'On that reading God is the light, and the verse is set beside Malachi 4:2'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/112.htm'
    quote: 'God Himself is the light which arises in darkness for those who are sincere in their dealings with Him; He is the Sun of righteousness with wings of rays dispensing "grace" and "tender mercies," Malachi 4:2.'
  - where: 'note 112:4 “Who is gracious and full of compassion”'
    claim: 'The same reading holds that He rises for those who are compassionate as He is, from verse 5'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/112.htm'
    quote: 'The fact that He arises for those who are compassionate as He is compassionate, is evident from Psalm 112:5.'
  - where: 'note 112:4 “Who is gracious and full of compassion”'
    claim: 'The lexicon: “gracious” is used only as an attribute of God, and lists Psalm 112:4'
    key: bdb
    url: 'https://biblehub.com/hebrew/2587.htm'
    quote: 'adjective gracious, only used as an attribute of God'
  - where: 'note 112:4 “Who is gracious and full of compassion”'
    claim: 'The lexicon: “compassionate” is always of God, and lists Psalm 112:4'
    key: bdb
    url: 'https://biblehub.com/hebrew/7349.htm'
    quote: 'adjective compassionate; — always of God'
  - where: 'note 112:4 “Who is gracious and full of compassion”'
    claim: 'A modern translation makes the upright the subject of the whole verse and gives the three adjectives to them'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20112&version=NRSVUE'
    quote: 'They rise in the darkness as a light for the upright;
      they are gracious, merciful, and righteous.'
  - where: 'note 112:4 “Who is gracious and full of compassion”'
    claim: 'The LORD proclaimed Himself merciful and gracious to Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'And the Lord passed by before him, and proclaimed, The Lord, The Lord God, merciful and gracious, longsuffering, and abundant in goodness and truth,'
  - where: 'note 112:4 “Who is gracious and full of compassion”'
    claim: 'Malachi promises the Sun of righteousness to those who fear the LORD’s name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/4?lang=eng'
    quote: 'But unto you that fear my name shall the Sun of righteousness arise with healing in his wings'
  - where: 'note 112:4 “Who is gracious and full of compassion”'
    claim: 'Psalm 111:4 uses the two adjectives of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/111?lang=eng'
    quote: 'the Lord is gracious and full of compassion.'

  # ---- note 112:7 ----
  - where: 'note 112:7 “The man who fears is not afraid”'
    claim: '“Feareth” in verse 1 is the verb H3372 (hebrew.mjs psalms 112:1)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יָרֵ֣א'
  - where: 'note 112:7 “The man who fears is not afraid”'
    claim: '“Shall not be afraid” in verses 7 and 8 is the same verb, H3372 (hebrew.mjs psalms 112:7-8)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יִירָ֑א'
  - where: 'note 112:7 “The man who fears is not afraid”'
    claim: 'Verse 8 in Hebrew has no word for “desire”: it ends “until he sees on his enemies” (hebrew.mjs psalms 112:8: H5704, H834, H7200, H6862); a modern translation renders it as looking in triumph'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20112&version=NRSVUE'
    quote: 'Their hearts are steady; they will not be afraid;
      in the end they will look in triumph on their foes.'
  - where: 'note 112:7 “The man who fears is not afraid”'
    claim: 'The verses as the Church’s edition prints them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/112?lang=eng'
    quote: 'He shall not be afraid of evil tidings: his heart is fixed, trusting in the Lord.'

  # ---- note 112:9 ----
  - where: 'note 112:9 “Paul quotes the verse to the Corinthians”'
    claim: 'Paul quotes Psalm 112:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-cor/9?lang=eng'
    quote: '(As it is written, He hath dispersed abroad; he hath given to the poor: his righteousness remaineth for ever.'
  - where: 'note 112:9 “Paul quotes the verse to the Corinthians”'
    claim: 'The subject of the chapter is an offering for the saints'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-cor/9?lang=eng'
    quote: 'For as touching the ministering to the saints, it is superfluous for me to write to you:'
  - where: 'note 112:9 “Paul quotes the verse to the Corinthians”'
    claim: 'The verse before the quotation credits God’s grace with the giver’s sufficiency'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-cor/9?lang=eng'
    quote: 'And God is able to make all grace abound toward you; that ye, always having all sufficiency in all things, may abound to every good work:'
  - where: 'note 112:9 “Paul quotes the verse to the Corinthians”'
    claim: 'The verse after it looks to God to increase the fruits of their righteousness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-cor/9?lang=eng'
    quote: 'multiply your seed sown, and increase the fruits of your righteousness;)'

  # ---- note 112:10 ----
  - where: 'note 112:10 “What perishes and what lasts”'
    claim: 'Psalm 112 ends with “perish”, said of the desire of the wicked'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/112?lang=eng'
    quote: 'The wicked shall see it, and be grieved; he shall gnash with his teeth, and melt away: the desire of the wicked shall perish.'

  - where: 'parallels'
    claim: 'Psalm 1 ends with “perish”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/1?lang=eng'
    quote: 'For the Lord knoweth the way of the righteous: but the way of the ungodly shall perish.'


  # ---- christ ----
  - where: 'christ'
    claim: 'LORD usually stands for Jehovah, who is the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary (Mosiah 3:8; 15:1; 3 Ne. 15:1–5). Usually, when the word Lord appears in the Old Testament, it means “Jehovah.”'
  - where: 'christ'
    claim: 'One reading of verse 4 makes God the light and joins it to Malachi 4:2'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/112.htm'
    quote: 'He is the Sun of righteousness with wings of rays dispensing "grace" and "tender mercies," Malachi 4:2.'
  - where: 'christ'
    claim: 'Paul grounds the giving in grace God makes abound'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-cor/9?lang=eng'
    quote: 'And God is able to make all grace abound toward you'
