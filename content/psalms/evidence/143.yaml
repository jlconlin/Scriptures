chapter: 143
claims:
  # ---------- when ----------
  - where: 'when'
    claim: 'The title ascribes the psalm to David and gives no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/143?lang=eng'
    quote: 'A Psalm of David.'

  # ---------- setting ----------
  - where: 'setting'
    claim: 'Some copies of the Greek translation add an occasion to the title: when his son pursued him'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/143.htm'
    quote: 'A Psalm of David, when his son pursued him.'
  - where: 'setting'
    claim: 'Other Greek copies have no title at all; the Greek title names Absalom'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/143.htm'
    quote: 'In some codices of the lxx this Psalm (as Euthymius also bears witness) has no inscription at all; in others, however, it has the inscription'
  - where: 'setting'
    claim: 'Psalm 3 is set in the flight from Absalom by its own title'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/3?lang=eng'
    quote: 'A Psalm of David, when he fled from Absalom his son.'
  - where: 'setting'
    claim: 'Psalm 142, the psalm before, is by its title a prayer from the cave'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/142?lang=eng'
    quote: 'Maschil of David; A Prayer when he was in the cave.'
  - where: 'setting'
    claim: 'Psalm 142:3 has the words of verse 4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/142?lang=eng'
    quote: 'When my spirit was overwhelmed within me, then thou knewest my path.'
  - where: 'setting'
    claim: 'Psalm 142:7 asks that the soul be brought out of prison, as verse 11 asks that it be brought out of trouble'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/142?lang=eng'
    quote: 'Bring my soul out of prison, that I may praise thy name'
  - where: 'setting'
    claim: 'One older reading finds the second half of the psalm made of the language of earlier psalms'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/143.htm'
    quote: 'In this second half the Psalm seems still more like a reproduction of the thoughts of earlier Psalms.'
  - where: 'setting'
    claim: 'Christian tradition counts Psalm 143 the last of the seven penitential psalms'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/143.htm'
    quote: 'the church has chosen Psalm 143:1-12 for the last of its seven Psalmi poenitentiales'
  - where: 'setting'
    claim: 'Paul writes the sentence of verse 2 in Romans 3:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/3?lang=eng'
    quote: 'Therefore by the deeds of the law there shall no flesh be justified in his sight: for by the law is the knowledge of sin.'
  - where: 'setting'
    claim: 'Paul writes it again in Galatians 2:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/2?lang=eng'
    quote: 'for by the works of the law shall no flesh be justified.'
  - where: 'setting'
    claim: 'Romans 3:20 is tied to verse 2 in a modern translation’s cross-references'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20143&version=NRSVUE'
    quote: '143.2 : Job 4.17; 14.3; Ps 130.3; Eccl 7.20; Rom 3.20'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'The Selah after verse 6 divides the psalm into two halves'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/143.htm'
    quote: 'The Sela at the close of Psalm 143:6 divides the Psalm into two halves.'

  # ---------- sections ----------
  - where: 'section 2 plain'
    claim: '“Smitten my life down to the ground” is rendered as crushing'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20143&version=NRSVUE'
    quote: 'crushing my life to the ground,'
  - where: 'section 2 plain'
    claim: '“A thirsty land” is a parched land'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20143&version=NRSVUE'
    quote: 'my soul thirsts for you like a parched land.'
  - where: 'section 4 plain'
    claim: '“The land of uprightness” is level ground'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20143&version=NRSVUE'
    quote: 'on a level path.'
  - where: 'section 4 plain'
    claim: '“Quicken me” asks for life'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20143&version=NRSVUE'
    quote: 'preserve my life.'

  # ---------- note 143:1 ----------
  - where: 'note 143:1 “Why he appeals to God’s righteousness”'
    claim: 'One older reading: the righteousness of verse 1 is not the righteousness that repays'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/143.htm'
    quote: 'righteousness, not in a recompensative legal sense, but in an evangelical sense'
  - where: 'note 143:1 “Why he appeals to God’s righteousness”'
    claim: 'One older reading: the righteousness is the earnestness with which God maintains the order of salvation'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/143.htm'
    quote: 'the strictness and earnestness with which He maintains the order of salvation established by His holy love'
  - where: 'note 143:1 “Why he appeals to God’s righteousness”'
    claim: 'The faithfulness of verse 1 is God’s keeping of His promises'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/143.htm'
    quote: 'that is to say, His faithfulness to His promises'
  - where: 'note 143:1 “Why he appeals to God’s righteousness”'
    claim: 'The prayer is that mercy and not justice take its course'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/143.htm'
    quote: 'that He therefore would let mercy instead of justice have its course with him'
  - where: 'note 143:1 “Why he appeals to God’s righteousness”'
    claim: 'In verses 11–12 righteousness stands beside the rescue and mercy beside the cutting off, the reverse of what is expected'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/143.htm'
    quote: 'here loving-kindness (mercy) and righteousness, are coupled together; and that so that mercy is not named beside'

  # ---------- note 143:2 ----------
  - where: 'note 143:2 “No man living, and what Paul adds”'
    claim: 'The Hebrew verb in verse 2 is to be justified by acquittal'
    key: bdb
    url: 'https://biblehub.com/hebrew/6663.htm'
    quote: 'by acquittal Psalm 143:2'
  - where: 'note 143:2 “No man living, and what Paul adds”'
    claim: 'A modern translation renders the line “no one living is righteous before you”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20143&version=NRSVUE'
    quote: 'for no one living is righteous before you.'
  - where: 'note 143:2 “No man living, and what Paul adds”'
    claim: 'Romans 3:20 is cross-referenced to this verse, with Job and Psalm 130:3'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20143&version=NRSVUE'
    quote: '143.2 : Job 4.17; 14.3; Ps 130.3; Eccl 7.20; Rom 3.20'
  - where: 'note 143:2 “No man living, and what Paul adds”'
    claim: 'Job asks how a man can be just with God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/9?lang=eng'
    quote: 'I know it is so of a truth: but how should man be just with God?'
  - where: 'note 143:2 “No man living, and what Paul adds”'
    claim: 'Psalm 130:3 asks who could stand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/130?lang=eng'
    quote: 'If thou, Lord, shouldest mark iniquities, O Lord, who shall stand?'
  - where: 'note 143:2 “No man living, and what Paul adds”'
    claim: 'Romans 3:20 adds “by the deeds of the law”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/3?lang=eng'
    quote: 'Therefore by the deeds of the law there shall no flesh be justified in his sight'
  - where: 'note 143:2 “No man living, and what Paul adds”'
    claim: 'Galatians 2:16 adds “by the works of the law”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/2?lang=eng'
    quote: 'for by the works of the law shall no flesh be justified.'
  - where: 'note 143:2 “No man living, and what Paul adds”'
    claim: 'Paul goes on to say how a person is justified'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/3?lang=eng'
    quote: 'Being justified freely by his grace through the redemption that is in Christ Jesus:'
  - where: 'note 143:2 “No man living, and what Paul adds”'
    claim: 'Lehi says that by the law no flesh is justified'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/2?lang=eng'
    quote: 'And by the law no flesh is justified; or, by the law men are cut off.'
  - where: 'note 143:2 “No man living, and what Paul adds”'
    claim: 'Lehi names the Messiah’s merits, mercy and grace as the only way into God’s presence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/2?lang=eng'
    quote: 'there is no flesh that can dwell in the presence of God, save it be through the merits, and mercy, and grace of the Holy Messiah'
  - where: 'note 143:2 “No man living, and what Paul adds”'
    claim: '2 Nephi 2 is Lehi’s teaching on redemption through the Messiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/2?lang=eng'
    quote: 'Redemption comes through the Holy Messiah'
  - where: 'note 143:2 “No man living, and what Paul adds”'
    claim: 'The Church’s footnote to Romans 3:20 points to Lehi’s words in 2 Nephi 2:5–8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/3?lang=eng'
    quote: '2 Ne. 2:5 (5–8)'
  - where: 'note 143:2 “No man living, and what Paul adds”'
    claim: 'The Church’s footnotes to 2 Nephi 2:5 point to Galatians 2:16 and Romans 3:20–24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/2?lang=eng'
    quote: 'Rom. 3:20 (20–24)'

  # ---------- note 143:3 ----------
  - where: 'note 143:3 “Darkness like the grave”'
    claim: 'Psalm 28:1 has the phrase of verse 7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/28?lang=eng'
    quote: 'lest, if thou be silent to me, I become like them that go down into the pit.'
  - where: 'note 143:3 “Darkness like the grave”'
    claim: 'Lamentations 3:6 is nearly the same line'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/3?lang=eng'
    quote: 'He hath set me in dark places, as they that be dead of old.'
  - where: 'note 143:3 “Darkness like the grave”'
    claim: 'The Hebrew words of the line in verse 3 (dark places, made me dwell, like the dead of old) are in this verse'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מֵתֵ֥י'
  - where: 'note 143:3 “Darkness like the grave”'
    claim: 'The same four Hebrew words make up Lamentations 3:6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Lam.xml'
    quote: 'מֵתֵ֥י'
  - where: 'note 143:3 “Darkness like the grave”'
    claim: 'In Lamentations 3 the one who brings the speaker into darkness is God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/3?lang=eng'
    quote: 'I am the man that hath seen affliction by the rod of his wrath.'
  - where: 'note 143:3 “Darkness like the grave”'
    claim: 'The verb of “Quicken me” in verse 11 is to revive'
    key: bdb
    url: 'https://biblehub.com/hebrew/2421.htm'
    quote: 'revive, the people of'
  - where: 'note 143:3 “Darkness like the grave”'
    claim: 'A modern translation renders “Quicken me” as “preserve my life”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20143&version=NRSVUE'
    quote: 'preserve my life.'

  # ---------- note 143:8 ----------
  - where: 'note 143:8 “Morning after the darkness”'
    claim: 'A modern translation: let me hear of your steadfast love in the morning'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20143&version=NRSVUE'
    quote: 'Let me hear of your steadfast love in the morning,'
  - where: 'note 143:8 “Morning after the darkness”'
    claim: 'Psalm 90:14 asks for mercy early, in the morning'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/90?lang=eng'
    quote: 'O satisfy us early with thy mercy; that we may rejoice and be glad all our days.'
  - where: 'note 143:8 “Morning after the darkness”'
    claim: 'One older reading: the prayer is that the night of affliction end with the next morning'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/143.htm'
    quote: 'With the prayer that the night of affliction may have an end with the next morning'

  # ---------- note 143:10 ----------
  - where: 'note 143:10 “Level ground”'
    claim: 'The Hebrew noun is a level place, a figure for safety'
    key: bdb
    url: 'https://biblehub.com/hebrew/4334.htm'
    quote: 'level place (free from obstacles), figurative for place of safety, comfort, and prosperity Psalm 26:12'
  - where: 'note 143:10 “Level ground”'
    claim: 'A modern translation: let your good spirit lead me on a level path'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20143&version=NRSVUE'
    quote: 'Let your good spirit lead me'
  - where: 'note 143:10 “Level ground”'
    claim: 'The same noun is in Psalm 27:11'
    key: bdb
    url: 'https://biblehub.com/hebrew/4334.htm'
    quote: 'Psalm 27:11'
  - where: 'note 143:10 “Level ground”'
    claim: 'Psalm 27:11 asks to be led in a plain path'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/27?lang=eng'
    quote: 'Teach me thy way, O Lord, and lead me in a plain path, because of mine enemies.'
  - where: 'note 143:10 “Level ground”'
    claim: 'The Levites’ prayer says God gave His good spirit to instruct Israel, with the manna'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/9?lang=eng'
    quote: 'Thou gavest also thy good spirit to instruct them, and withheldest not thy manna from their mouth, and gavest them water for their thirst.'
  - where: 'note 143:10 “Level ground”'
    claim: 'The prayer of Nehemiah 9 is the Levites’'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/9?lang=eng'
    quote: 'The Jews fast and confess their sins—The Levites bless and praise the'

  # ---------- note 143:12 ----------
  - where: 'note 143:12 “Asked of mercy, by a servant”'
    claim: '“Mercy” in verse 12 is the Hebrew word of “lovingkindness” in verse 8 (Strong’s 2617 in both)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חַסְדְּ'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'The LORD of the Old Testament is Jehovah, the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: 'christ'
    claim: 'God set forth Christ to declare His righteousness for the remission of sins'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/3?lang=eng'
    quote: 'Whom God hath set forth to be a propitiation through faith in his blood, to declare his righteousness for the remission of sins that are past, through the forbearance of God;'
  - where: 'christ'
    claim: 'In the same passage Paul says God is both just and the justifier'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/3?lang=eng'
    quote: 'To declare, I say, at this time his righteousness: that he might be just, and the justifier of him which believeth in Jesus.'
  - where: 'christ'
    claim: 'To be justified is to be pardoned and declared guiltless'
    key: gs-justification
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/justification-justify?lang=eng'
    quote: 'To be pardoned from punishment for sin and declared guiltless.'
  - where: 'christ'
    claim: 'Justification comes by the Savior’s grace through faith in Him'
    key: gs-justification
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/justification-justify?lang=eng'
    quote: 'A person is justified by the Savior’s grace through faith in Him.'
  - where: 'christ'
    claim: 'The Savior satisfied justice by His suffering, so that condemnation is removed and the law is not'
    key: christofferson-justification
    url: 'https://www.churchofjesuschrist.org/study/ensign/2001/06/justification-and-sanctification?lang=eng'
    quote: 'Pardon comes by the grace of Him who has satisfied the demands of justice by His own suffering'
  - where: 'christ'
    claim: 'He removes condemnation without removing the law'
    key: christofferson-justification
    url: 'https://www.churchofjesuschrist.org/study/ensign/2001/06/justification-and-sanctification?lang=eng'
    quote: 'He removes our condemnation without removing the law.'

  # ---------- explore ----------
  - where: 'explore'
    claim: 'Psalm 77 considers the days of old'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/77?lang=eng'
    quote: 'I have considered the days of old, the years of ancient times.'
  - where: 'explore'
    claim: 'Psalm 77 meditates on God’s work'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/77?lang=eng'
    quote: 'I will meditate also of all thy work, and talk of thy doings.'
  - where: 'explore'
    claim: 'Lamentations 3 comes to a morning and to God’s faithfulness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/3?lang=eng'
    quote: 'They are new every morning: great is thy faithfulness.'
  - where: 'explore'
    claim: 'Psalm 63:1 has the soul thirsting in a dry and thirsty land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/63?lang=eng'
    quote: 'my soul thirsteth for thee, my flesh longeth for thee in a dry and thirsty land, where no water is;'

  # ---------- parallels ----------
  - where: 'parallels'
    claim: 'Romans 3:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/3?lang=eng'
    quote: 'by the deeds of the law there shall no flesh be justified in his sight'
  - where: 'parallels'
    claim: 'Galatians 2:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/gal/2?lang=eng'
    quote: 'by the works of the law shall no flesh be justified'
  - where: 'parallels'
    claim: '2 Nephi 2:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/2?lang=eng'
    quote: 'by the law no flesh is justified'
  - where: 'parallels'
    claim: 'Lamentations 3:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lam/3?lang=eng'
    quote: 'He hath set me in dark places, as they that be dead of old.'
  - where: 'parallels'
    claim: 'Psalm 142:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/142?lang=eng'
    quote: 'When my spirit was overwhelmed within me'
  - where: 'parallels'
    claim: 'Nehemiah 9:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/9?lang=eng'
    quote: 'Thou gavest also thy good spirit to instruct them'
  - where: 'parallels'
    claim: 'Psalm 27:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/27?lang=eng'
    quote: 'lead me in a plain path'
