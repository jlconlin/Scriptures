    claim: 'Isaiah 46:4 has the same noun for “hoar hairs” (H7872)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'שֵיבָ֖ה'
  - where: 'note 71:18 “Old age and gray hair”'
    claim: 'Isaiah 46:3–4 in the King James text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/46?lang=eng'
    quote: 'And even to your old age I am he; and even to hoar hairs will I carry you'
  - where: 'note 71:18 “Old age and gray hair”'
    claim: 'A modern translation’s cross-references join verse 6 to Isaiah 46:3'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2071&version=NRSVUE'
    quote: '71.6 : Ps 22.9, 10; 34.1; Isa 46.3'
  - where: 'note 71:18 “Old age and gray hair”'
    claim: 'The Hebrew of “this generation” is “to a generation”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2071&version=NRSVUE'
    quote: 'Gk Compare Syr: Heb to a generation, to all who come'
  - where: 'note 71:18 “Old age and gray hair”'
    claim: '“Strength” in verse 18 is “arm” (zeroa, H2220)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'זְרוֹעֲ/ךָ֣'
  - where: 'note 71:18 “Old age and gray hair”'
    claim: 'The Greek translates it “arm”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/71.htm'
    quote: 'until I shall have declared thine arm'
  - where: 'note 71:18 “Old age and gray hair”'
    claim: 'Psalm 22:31 ends on telling a people yet to be born'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/22?lang=eng'
    quote: 'unto a people that shall be born'

  - where: 'note 71:20 “Brought up from the depths”'
    claim: 'A modern translation renders “quicken” as revive'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2071&version=NRSVUE'
    quote: 'will revive me again'
  - where: 'note 71:20 “Brought up from the depths”'
    claim: 'The depths are abysses, a figure of extreme danger'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/71.htm'
    quote: 'are, like the gates of death (Psalm 9:14), a figure of extreme perils and dangers'
  - where: 'note 71:20 “Brought up from the depths”'
    claim: 'The written text (ketiv) of “shewed me” has the suffix “us”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הראית/נו'
  - where: 'note 71:20 “Brought up from the depths”'
    claim: 'The written text of “quicken me” has “us” as well'
