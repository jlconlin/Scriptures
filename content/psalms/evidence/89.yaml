    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/89.htm'
    quote: 'into the first decade of whose reign Ethan the Ezrahite may have survived king Solomon'
  - where: 'note 89:45 “Which king?”'
    claim: 'Shishak in Rehoboam’s fifth year took Judah’s fortified cities and spoiled temple and palace (1 Kgs. 14:25–28)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/89.htm'
    quote: 'conquered the fortified cities of Judah, and spoiled the Temple and Palace'
  - where: 'note 89:45 “Which king?”'
    claim: 'On that reading the king is Rehoboam'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/89.htm'
    quote: 'The young Davidic king, whom loss and disgrace make prematurely old, is Rehoboam'
  - where: 'note 89:45 “Which king?”'
    claim: 'Another reading dates the psalm to the exile'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/89.htm'
    quote: 'It can hardly be earlier than the destruction of Jerusalem and the downfall of the Davidic kingdom'
  - where: 'note 89:45 “Which king?”'
    claim: 'On that reading the king is Jehoiachin, eighteen at his accession, who reigned three months and ten days (2 Kgs. 24:8)'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/89.htm'
    quote: 'when he came to the throne, and he reigned only three months and ten days'
  - where: 'note 89:45 “Which king?”'
    claim: 'A Latter-day Saint study counts Psalm 89 among earlier psalms placed at strategic points of the Psalter; it does not date it'
    key: sc-knowhy-439
    url: 'https://scripturecentral.org/knowhy/why-are-certain-biblical-psalms-used-by-book-of-mormon-authors'
    quote: 'earlier psalms, such as Psalms 89, 106, 107, 110, and 145, were scattered throughout the book in strategic positions'

