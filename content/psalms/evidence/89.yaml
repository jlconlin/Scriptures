chapter: 89
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The title ascribes the psalm to Ethan the Ezrahite'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/89?lang=eng'
    quote: 'Maschil of Ethan the Ezrahite.'

  # ---- setting ----
  - where: 'setting'
    claim: 'The Psalter is in five books, the third being Psalms 73 through 89'
    key: ot-manual-psalms
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/the-psalms-songs-from-the-heart-of-israel?lang=eng'
    quote: 'Psalms 1 through 41, 42 through 72, 73 through 89, 90 through 106, and 107 through 150'
  - where: 'setting'
    claim: 'Each of the five books ends with a doxology; Book Three’s is 89:52'
    key: ot-manual-psalms
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/the-psalms-songs-from-the-heart-of-israel?lang=eng'
    quote: 'At the end of each division, the break is marked with a doxology, or formal declaration of God’s power and glory (see Psalms 41:13; 72:19; 89:52; 106:48).'
  - where: 'setting'
    claim: 'Psalm 89 is counted among the royal psalms, which concern the Israelite king'
    key: larsen-dust-crown
    url: 'https://interpreterfoundation.org/journal/from-dust-to-exalted-crown-royal-and-temple-themes-common-to-the-psalms-and-the-dead-sea-scrolls'
    quote: 'including Psalms 2, 18, 20, 21, 45, 72, 89, 101, 110, 132, 144, and possibly others — are thus designated due to their content, which includes mentions of the Israelite monarchy'
  - where: 'setting'
    claim: 'The heading in the Church’s edition calls Psalm 89 a messianic psalm'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/89?lang=eng'
    quote: 'A messianic psalm'
  - where: 'setting'
    claim: 'Paul’s “I have found David” in Acts 13:22 is cross-referenced to verse 20'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2089&version=NRSVUE'
    quote: '89.20 : 1 Sam 16.1, 12; Acts 13.22'
  - where: 'setting'
    claim: 'The titles of Rev. 1:5 are drawn from verses 27 and 37'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/89.htm'
    quote: 'in language borrowed from this verse and Psalm 89:37'

  # ---- thread ----
  - where: 'thread'
    claim: 'The Hebrew word behind “mercy” (hesed) stands seven times in the psalm: verses 1, 2, 14, 24, 28, 33, 49'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חֶ֣סֶד'
  - where: 'thread'
    claim: 'The Hebrew word behind “faithfulness” stands seven times: verses 1, 2, 5, 8, 24, 33, 49'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֱמוּנָתְ/ךָ֣'

  # ---- sections ----
  - where: 'section 2 plain'
    claim: 'Verses 5–7: the “saints” are the holy ones, and the “sons of the mighty” heavenly beings'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2089&version=NRSVUE'
    quote: 'your faithfulness in the assembly of the holy ones.'
  - where: 'section 2 plain'
    claim: 'Verse 8: the last clause says that faithfulness surrounds the LORD'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2089&version=NRSVUE'
    quote: 'Your faithfulness surrounds you.'
  - where: 'section 2 plain'
    claim: 'Verse 14: “habitation” of the throne is its foundation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2089&version=NRSVUE'
    quote: 'Righteousness and justice are the foundation of your throne;'
  - where: 'section 3 plain'
    claim: 'Verse 15: the “joyful sound” is the festal shout'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2089&version=NRSVUE'
    quote: 'Happy are the people who know the festal shout,'
  - where: 'section 7 plain'
    claim: 'Verse 48: “the hand of the grave” is the power of Sheol'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2089&version=NRSVUE'
    quote: 'Who can escape the power of Sheol?'

  # ---- note 89:0 ----
  - where: 'note 89:0 “Ethan the Ezrahite”'
    claim: 'Kings names Ethan the Ezrahite and Heman among the sages Solomon surpassed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/4?lang=eng'
    quote: 'For he was wiser than all men; than Ethan the Ezrahite, and Heman, and Chalcol, and Darda, the sons of Mahol'
  - where: 'note 89:0 “Ethan the Ezrahite”'
    claim: 'The title of Psalm 88 names Heman the Ezrahite'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/88?lang=eng'
    quote: 'Maschil of Heman the Ezrahite.'
  - where: 'note 89:0 “Ethan the Ezrahite”'
    claim: 'A Levite Ethan, son of Kushaiah, was appointed a singer with Heman and Asaph'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/15?lang=eng'
    quote: 'So the singers, Heman, Asaph, and Ethan, were appointed to sound with cymbals of brass;'
  - where: 'note 89:0 “Ethan the Ezrahite”'
    claim: 'One older reading keeps the Ezrahite of Judah apart from the Levite singer Ethan'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/89.htm'
    quote: 'the Ezrahite, of the tribe of Judah (1 Kings 5:11 1 Kings 4:31, 1 Chronicles 2:6), is made to be one and the same person with Ethan (Jeduthun) the son of Kushaiah the Merarite, of the tribe of Levi'

  # ---- note 89:1 ----
  - where: 'note 89:1 “Mercy and faithfulness, seven times each”'
    claim: 'One Hebrew noun (hesed, Strong’s 2617) is “mercies” or “mercy” in verses 1, 2, 14, 24, 28 and “lovingkindness(es)” in 33 and 49'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חֶ֣סֶד'
  - where: 'note 89:1 “Mercy and faithfulness, seven times each”'
    claim: 'One Hebrew noun (Strong’s 530) is “faithfulness” in verses 1, 2, 5, 8, 24, 33 and “truth” in verse 49'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֱמוּנָתְ/ךָ֣'
  - where: 'note 89:1 “Mercy and faithfulness, seven times each”'
    claim: 'One Hebrew verb (Strong’s 7650) is “sworn” in verses 3 and 35 and “swarest” in verse 49'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'נִשְׁבַּ֣עְתִּי'

  # ---- note 89:3 ----
  - where: 'note 89:3 “Nathan’s promise, called a covenant and an oath”'
    claim: 'The promise came through Nathan when David wished to build a house; the LORD said He would make David a house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'Also the Lord telleth thee that he will make thee an house.'
  - where: 'note 89:3 “Nathan’s promise, called a covenant and an oath”'
    claim: 'Nathan’s oracle has “my servant David” and “build”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'hast revealed to thy servant, saying, I will build thee an house'
  - where: 'note 89:3 “Nathan’s promise, called a covenant and an oath”'
    claim: 'David’s last words call the promise an everlasting covenant'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/23?lang=eng'
    quote: 'yet he hath made with me an everlasting covenant, ordered in all things, and sure'

  # ---- note 89:5 ----
  - where: 'note 89:5 “The saints are the holy ones of heaven”'
    claim: 'The Hebrew of verses 5 and 7 has “holy ones” (qedoshim)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'קְדֹשִֽׁים'
  - where: 'note 89:5 “The saints are the holy ones of heaven”'
    claim: 'In verse 6 “the mighty” is elim, a plural of El (Strong’s 410)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֵלִים'
  - where: 'note 89:5 “The saints are the holy ones of heaven”'
    claim: 'A modern translation has “the assembly of the holy ones” in verse 5'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2089&version=NRSVUE'
    quote: 'your faithfulness in the assembly of the holy ones.'
  - where: 'note 89:5 “The saints are the holy ones of heaven”'
    claim: 'A modern translation has “the heavenly beings” in verse 6 and “the council of the holy ones” in verse 7'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2089&version=NRSVUE'
    quote: 'Who among the heavenly beings is like the Lord,'
  - where: 'note 89:5 “The saints are the holy ones of heaven”'
    claim: 'Verse 7 in a modern translation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2089&version=NRSVUE'
    quote: 'a God feared in the council of the holy ones,'
  - where: 'note 89:5 “The saints are the holy ones of heaven”'
    claim: 'The Greek has “the sons of God” in verse 6'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/89.htm'
    quote: 'and who shall be likened to the Lord among the sons of God?'
  - where: 'note 89:5 “The saints are the holy ones of heaven”'
    claim: 'A Latter-day Saint study reads verses 5–7 as a depiction of the divine assembly'
    key: smoot-council-hebrew-bible
    url: 'https://interpreterfoundation.org/journal/the-divine-council-in-the-hebrew-bible-and-the-book-of-mormon'
    quote: 'In turning to Psalm 89, we see a striking depiction of the divine assembly of Yahweh.'
  - where: 'note 89:5 “The saints are the holy ones of heaven”'
    claim: 'The same study argues from Ps. 89:5–8 that the gods of Psalm 82 are divine beings, not humans'
    key: smoot-council-hebrew-bible
    url: 'https://interpreterfoundation.org/journal/the-divine-council-in-the-hebrew-bible-and-the-book-of-mormon'
    quote: 'it becomes clear these gods cannot be humans but must be divine beings'
  - where: 'note 89:5 “The saints are the holy ones of heaven”'
    claim: 'The footnotes of the Church’s edition attach the Topical Guide entries “Church” and “Saints” to “congregation” (5a) and “saints” (7a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/89?lang=eng'
    quote: 'TG Saints'

  # ---- note 89:10 ----
  - where: 'note 89:10 “Rahab is the sea monster, and Egypt”'
    claim: 'The Rahab of this verse is glossed as a mythical sea monster, parallel to “sea” here and to the dragon in Isa. 51:9'
    key: bdb
    url: 'https://biblehub.com/hebrew/7293.htm'
    quote: '1 mythical sea monster'
  - where: 'note 89:10 “Rahab is the sea monster, and Egypt”'
    claim: 'Rahab, Leviathan and the raging sea symbolize the powers of chaos'
    key: sc-knowhy-34
    url: 'https://scripturecentral.org/knowhy/why-does-jacob-choose-a-monster-as-a-symbol-for-death-and-hell'
    quote: 'Together, they all symbolized the powers of chaos, or those forces that endanger the lives of mortal beings'
  - where: 'note 89:10 “Rahab is the sea monster, and Egypt”'
    claim: 'Many scholars take 89:10 and like verses as allusions to a myth of the LORD killing a sea monster'
    key: sc-knowhy-866
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-talk-about-leviathan'
    quote: 'Although cryptic, these verses are understood by many biblical scholars to be a reference to a myth in which Yahweh kills a cosmic sea-monster.'
  - where: 'note 89:10 “Rahab is the sea monster, and Egypt”'
    claim: 'Psalm 87 lists Rahab with Babylon among the nations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/87?lang=eng'
    quote: 'I will make mention of Rahab and Babylon to them that know me'
  - where: 'note 89:10 “Rahab is the sea monster, and Egypt”'
    claim: 'In Ps. 87:4 Rahab is an emblematic name of Egypt'
    key: bdb
    url: 'https://biblehub.com/hebrew/7293.htm'
    quote: 'emblematic name of Egypt'

  # ---- note 89:15 ----
  - where: 'note 89:15 “The joyful sound is a shout”'
    claim: 'The Hebrew word (teruah) is a shout or blast of war, alarm, or joy'
    key: bdb
    url: 'https://biblehub.com/hebrew/8643.htm'
    quote: 'noun feminine shout or blast of war, alarm, or joy'
  - where: 'note 89:15 “The joyful sound is a shout”'
    claim: 'The lexicon files this verse under the shout of joy in worship'
    key: bdb
    url: 'https://biblehub.com/hebrew/8643.htm'
    quote: '3 shout of joy with religious impulse'
  - where: 'note 89:15 “The joyful sound is a shout”'
    claim: 'A modern translation has “the festal shout”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2089&version=NRSVUE'
    quote: 'Happy are the people who know the festal shout,'
  - where: 'note 89:15 “The joyful sound is a shout”'
    claim: 'One Latter-day Saint reading takes the people of verse 15 as the mortal congregation reacting to the wonders recited'
    key: larsen-dust-crown
    url: 'https://interpreterfoundation.org/journal/from-dust-to-exalted-crown-royal-and-temple-themes-common-to-the-psalms-and-the-dead-sea-scrolls'
    quote: 'we now see a group of people in verse 15 who we should understand to be the mortal congregation that are participating, perhaps reacting, here'
  - where: 'note 89:15 “The joyful sound is a shout”'
    claim: 'The same reading, from the Qumran hymns: the shout answers the revelation of God’s mysteries'
    key: larsen-dust-crown
    url: 'https://interpreterfoundation.org/journal/from-dust-to-exalted-crown-royal-and-temple-themes-common-to-the-psalms-and-the-dead-sea-scrolls'
    quote: 'that festal shout that they know to give is the appropriate reaction to the revelation of God’s mysteries presented in the preceding verses'
  - where: 'note 89:15 “The joyful sound is a shout”'
    claim: 'Balaam uses the word of Israel in the wilderness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/23?lang=eng'
    quote: 'the shout of a king is among them'

  # ---- note 89:19 ----
  - where: 'note 89:19 “The vision, and who received it”'
    claim: 'Nathan’s message to David is called a vision'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'According to all these words, and according to all this vision, so did Nathan speak unto David.'
  - where: 'note 89:19 “The vision, and who received it”'
    claim: 'The Hebrew text as printed has a plural, “thy faithful ones” (masculine plural with suffix)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לַֽ/חֲסִידֶ֗י/ךָ'
  - where: 'note 89:19 “The vision, and who received it”'
    claim: 'Some manuscripts have the singular; the traditional text and the ancient versions the plural, read by one commentary as the people of Israel'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/89.htm'
    quote: 'So some MSS. But the traditional text, supported apparently by all the Ancient Versions, reads the plural, to thy saints, or rather to thy beloved; i.e. the people of Israel'
  - where: 'note 89:19 “The vision, and who received it”'
    claim: 'One older reading takes the plural as Samuel and Nathan'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/89.htm'
    quote: 'The plural refers to Samuel and Nathan, for the statement brings together what was revealed to these two prophets concerning David.'
  - where: 'note 89:19 “The vision, and who received it”'
    claim: 'The word for “holy one” (hasid) names one who practices hesed'
    key: bdb
    url: 'https://biblehub.com/hebrew/2623.htm'
    quote: 'adjective masculine kind, pious (so, as denoting active practice of חֶסֶד, kindness'
  - where: 'note 89:19 “The vision, and who received it”'
    claim: 'Verse 22 echoes 2 Sam. 7:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'neither shall the children of wickedness afflict them any more, as beforetime'

  # ---- note 89:27 ----
  - where: 'note 89:27 “The youngest son made firstborn, and highest of kings”'
    claim: 'David was the youngest of Jesse’s sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/16?lang=eng'
    quote: 'There remaineth yet the youngest, and, behold, he keepeth the sheep.'
  - where: 'note 89:27 “The youngest son made firstborn, and highest of kings”'
    claim: 'The firstborn son is the heir and leader of the family'
    key: bd-firstborn
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstborn?lang=eng'
    quote: 'the firstborn son is the heir and inherits the leadership of the family upon the death of the father'
  - where: 'note 89:27 “The youngest son made firstborn, and highest of kings”'
    claim: 'The standing of firstborn could be given to one not born first'
    key: bd-firstborn
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstborn?lang=eng'
    quote: 'Joseph, though not the firstborn of Jacob, received the inheritance as though he were the firstborn'
  - where: 'note 89:27 “The youngest son made firstborn, and highest of kings”'
    claim: '“Higher” is the Hebrew elyon (Strong’s 5945)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'עֶ֝לְי֗וֹן'
  - where: 'note 89:27 “The youngest son made firstborn, and highest of kings”'
    claim: 'The lexicon lists this verse as the word’s use of the Davidic king, and compares Deut. 28:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/5945.htm'
    quote: '3 of Davidic king exalted above monarchs Psalm 89:28 (compare Deuteronomy 28:1, above).'
  - where: 'note 89:27 “The youngest son made firstborn, and highest of kings”'
    claim: 'The same word is the divine title Most High'
    key: bdb
    url: 'https://biblehub.com/hebrew/5945.htm'
    quote: 'noun masculine Highest, Most High (probably = foregoing)'
  - where: 'note 89:27 “The youngest son made firstborn, and highest of kings”'
    claim: 'Verses 26–27 belong with the texts in which God calls Israel’s king His son'
    key: sc-knowhy-865
    url: 'https://scripturecentral.org/knowhy/why-does-god-declare-jesus-to-be-his-son'
    quote: 'God declares the king of Israel to be his son, showing the special relationship between God and the king'

  # ---- note 89:30 ----
  - where: 'note 89:30 “The sons may be punished; the oath stands”'
    claim: 'Verses 30–33 are cross-referenced to 2 Sam. 7:14–15'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2089&version=NRSVUE'
    quote: '89.30 : 2 Sam 7.14'
  - where: 'note 89:30 “The sons may be punished; the oath stands”'
    claim: 'Verse 29 is cross-referenced to Jeremiah 33'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2089&version=NRSVUE'
    quote: '89.29 : Deut 11.21; Isa 9.7; Jer 33.17'
  - where: 'note 89:30 “The sons may be punished; the oath stands”'
    claim: 'Psalm 132 puts the sons’ sitting on the throne under a condition'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/132?lang=eng'
    quote: 'If thy children will keep my covenant and my testimony that I shall teach them, their children shall also sit upon thy throne for evermore.'

  # ---- note 89:37 ----
  - where: 'note 89:37 “John’s titles for Jesus Christ come from this psalm”'
    claim: 'The promise of verse 27 was not fully realized in David’s successors, and John’s titles in Rev. 1:5 borrow from verses 27 and 37'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/89.htm'
    quote: 'never fully realised in any of his successors, points forward to Him Whom St John styles in language borrowed from this verse and Psalm 89:37'
  - where: 'note 89:37 “John’s titles for Jesus Christ come from this psalm”'
    claim: 'What the witness of verse 37 is has been debated: sun, moon, or rainbow'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/89.htm'
    quote: 'Is it the sun, or the moon, or the rainbow?'
  - where: 'note 89:37 “John’s titles for Jesus Christ come from this psalm”'
    claim: 'On another construal of the Hebrew the witness is God Himself'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/89.htm'
    quote: 'The witness is God Himself, Who thus confirms His promise with a final attestation.'
  - where: 'note 89:37 “John’s titles for Jesus Christ come from this psalm”'
    claim: 'The other construal of verse 37'
    key: cambridge-psalms
    url: 'https://biblehub.com/commentaries/cambridge/psalms/89.htm'
    quote: 'And the witness in the sky is faithful.'
  - where: 'note 89:37 “John’s titles for Jesus Christ come from this psalm”'
    claim: 'The heading in the Church’s edition reads verse 27 of God’s Firstborn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/89?lang=eng'
    quote: 'God’s Firstborn will be made higher than the kings of the earth.'
  - where: 'note 89:37 “John’s titles for Jesus Christ come from this psalm”'
    claim: 'Jesus is the firstborn of the Father’s spirit children and the first to rise from the dead'
    key: bd-firstborn
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstborn?lang=eng'
    quote: 'Jesus is the firstborn of the spirit children of our Heavenly Father, the Only Begotten of the Father in the flesh, and the first to rise from the dead in the Resurrection'

  # ---- note 89:39 ----
  - where: 'note 89:39 “The complaint in the oath’s own words”'
    claim: 'One Hebrew verb (Strong’s 2490) is “break” in verses 31 and 34 and “profaned” in verse 39'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חִלַּ֖לְתָּ'
  - where: 'note 89:39 “The complaint in the oath’s own words”'
    claim: 'The verb in verse 34, “will I not break”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֲחַלֵּ֥ל'
  - where: 'note 89:39 “The complaint in the oath’s own words”'
    claim: 'One Hebrew verb (Strong’s 7311) is “exalted” in verses 19 and 24 and “set up” in verse 42'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הֲ֭רִימוֹתָ'
  - where: 'note 89:39 “The complaint in the oath’s own words”'
    claim: 'The word for crown (nezer) means consecration; a crown is a sign of consecration, and the word is used of the high priest’s'
    key: bdb
