chapter: 33
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'The Hebrew psalm has no title: its first word is the verb of verse 1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'רַנְּנ֣וּ'
  - where: setting
    claim: 'The Church’s edition prints no title above the psalm; its text begins with verse 1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/33?lang=eng'
    quote: 'Rejoice in the Lord, O ye righteous: for praise is comely for the upright.'
  - where: setting
    claim: 'Psalm 33 is listed among the psalms of praise, which begin with a call to Israel to gather and praise'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'These psalms often begin with a command or call to Israel to gather as a community (most importantly, at the temple) and praise the Lord: 8, 19, 29, 33, 47'
  - where: setting
    claim: 'After the call, such hymns describe the Lord’s power and mercy and His role as creator'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'After the call to praise, the hymns describe the power and the mercy of the Lord, often describing what he has done for Israel in the past and emphasizing his role as the creator'
  - where: setting
    claim: 'Such psalms are now thought to mark national festival gatherings at the temple'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'are now thought to mark times of national festival gatherings'
  - where: setting
    claim: 'The next psalm to speak of a new song is Psalm 40'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/40?lang=eng'
    quote: 'And he hath put a new song in my mouth, even praise unto our God'
  - where: setting
    claim: 'Isaiah calls for a new song'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/42?lang=eng'
    quote: 'a new song, and his praise from the end of the earth'
  - where: setting
    claim: 'A new song is sung in the Revelation of John'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/5?lang=eng'
    quote: 'And they sung a new song, saying, Thou art worthy to take the book'
  - where: setting
    claim: 'The Doctrine and Covenants gives the words of a new song'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'and with the voice together sing this new song, saying:'
  - where: setting
    claim: 'John says all things were made by the Word'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/1?lang=eng'
    quote: 'All things were made by him; and without him was not any thing made that was made.'

  # ---------- thread ----------
  - where: thread
    claim: '“Stood fast” in verse 9 is the Hebrew verb amad (Strong’s 5975)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וַֽ/יַּעֲמֹֽד'
  - where: thread
    claim: '“Standeth” in verse 11 is the same verb (Strong’s 5975)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תַּעֲמֹ֑ד'
  - where: thread
    claim: 'The last verse addresses the LORD in the second person (“to thee”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חַסְדְּ/ךָ֣'
  - where: thread
    claim: '“Goodness” in verse 5 is hesed, the word translated “mercy” in verse 22'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חֶ֥סֶד'

  # ---------- plain words ----------
  - where: section 1 plain
    claim: 'Verses 1–3 in a modern translation: praise befits; lyre; harp of ten strings; loud shouts'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2033&version=NRSVUE'
    quote: 'make melody to him with the harp of ten strings'
  - where: section 1 plain
    claim: 'Verse 3: “with loud shouts”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2033&version=NRSVUE'
    quote: 'play skillfully on the strings, with loud shouts'
  - where: section 2 plain
    claim: 'Verses 4–5: upright, faithfulness, justice, steadfast love'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2033&version=NRSVUE'
    quote: 'the earth is full of the steadfast love of the Lord'
  - where: section 2 plain
    claim: 'Verse 4: “done in faithfulness”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2033&version=NRSVUE'
    quote: 'and all his work is done in faithfulness'
  - where: section 2 plain
    claim: 'The Church’s footnote gives “justice” for “judgment” in verse 5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/33?lang=eng'
    quote: 'HEB justice.'
  - where: section 2 plain
    claim: 'Verse 9: “it came to be … it stood firm”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2033&version=NRSVUE'
    quote: 'for he spoke, and it came to be'
  - where: section 3 plain
    claim: 'The Church’s footnote gives “nations” for “heathen” in verse 10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/33?lang=eng'
    quote: 'HEB nations, Gentiles.'
  - where: section 3 plain
    claim: 'Verse 10: “frustrates the plans of the peoples”; verse 12: “Happy is the nation”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2033&version=NRSVUE'
    quote: 'he frustrates the plans of the peoples'
  - where: section 3 plain
    claim: 'Verse 12: “Happy”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2033&version=NRSVUE'
    quote: 'Happy is the nation whose God is the Lord'
  - where: section 4 plain
    claim: 'Verses 13–15: sees all humankind; fashions the hearts of them all'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2033&version=NRSVUE'
    quote: 'he who fashions the hearts of them all'
  - where: section 4 plain
    claim: 'Verses 16–17: great army; war horse; victory'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2033&version=NRSVUE'
    quote: 'A king is not saved by his great army'
  - where: section 4 plain
    claim: 'The word behind “a vain thing” is falsehood, what deceives'
    key: bdb
    url: 'https://biblehub.com/hebrew/8267.htm'
    quote: 'deception, what deceives, disappoints, and betrays one'
  - where: section 5 plain
    claim: 'Verses 20–22: waits; is glad; steadfast love'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2033&version=NRSVUE'
    quote: 'Let your steadfast love, O Lord, be upon us'

  # ---------- note 33:1 ----------
  - where: 'note 33:1 “The psalm begins where Psalm 32 ends”'
    claim: 'The last verse of Psalm 32'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/32?lang=eng'
    quote: 'Be glad in the Lord, and rejoice, ye righteous: and shout for joy, all ye that are upright in heart.'
  - where: 'note 33:1 “The psalm begins where Psalm 32 ends”'
    claim: '“Rejoice” in 33:1 is the Hebrew verb ranan (Strong’s 7442)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'רַנְּנ֣וּ'
  - where: 'note 33:1 “The psalm begins where Psalm 32 ends”'
    claim: '“Shout for joy” in 32:11 is the same verb (Strong’s 7442)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וְ֝/הַרְנִ֗ינוּ'
  - where: 'note 33:1 “The psalm begins where Psalm 32 ends”'
    claim: 'Both verses address the righteous (Strong’s 6662) and the upright (Strong’s 3477)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לַ֝/יְשָׁרִ֗ים'
  - where: 'note 33:1 “The psalm begins where Psalm 32 ends”'
    claim: 'The Greek psalm has the title “A Psalm of David”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/33.htm'
    quote: 'A Psalm of David. Rejoice in the Lord, ye righteous; praise becomes the upright.'
  - where: 'note 33:1 “The psalm begins where Psalm 32 ends”'
    claim: 'A modern translation: praise befits the upright'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2033&version=NRSVUE'
    quote: 'Praise befits the upright.'
  - where: 'note 33:1 “The psalm begins where Psalm 32 ends”'
    claim: '“Right” in verse 4 is the word for “upright” in verse 1 (Strong’s 3477)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יָשָׁ֥ר'

  # ---------- note 33:2 ----------
  - where: 'note 33:2 “One instrument of ten strings”'
