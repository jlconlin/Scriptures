    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/33.htm'
    quote: 'This portion of the song is like a paraphrase of the אשׁרי in Deuteronomy 33:29.'
  - where: 'note 33:12 “The nation is Israel, His inheritance”'
