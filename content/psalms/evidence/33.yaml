    claim: 'The Lord gives the words of a new song that all will sing together'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'and with the voice together sing this new song, saying:'
  - where: 'note 33:3 “Why the song is new”'
    claim: 'The song announces that the Lord has redeemed Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'The Lord hath redeemed his people, Israel,'
  - where: 'note 33:3 “Why the song is new”'
