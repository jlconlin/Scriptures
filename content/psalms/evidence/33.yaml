    quote: 'And he hath put a new song in my mouth'
  - where: 'note 33:3 “Why the song is new”'
    claim: 'Psalm 98 gives the reason for its new song'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/98?lang=eng'
    quote: 'for he hath done marvellous things'
