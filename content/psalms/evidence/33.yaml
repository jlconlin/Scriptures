    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'עָ֝שׂ֗וֹר'
  - where: 'note 33:2 “One instrument of ten strings”'
    claim: 'The lexicon takes the two words as one instrument, a harp with ten strings, here and in Psalm 144:9'
    key: bdb
    url: 'https://biblehub.com/hebrew/5035.htm'
    quote: 'a harp with ten strings Psalm 33:2; Psalm 144:9'
  - where: 'note 33:2 “One instrument of ten strings”'
    claim: 'The Greek has one instrument of ten strings'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/33.htm'
    quote: 'a psaltery of ten strings'
  - where: 'note 33:2 “One instrument of ten strings”'
    claim: 'A modern translation of verse 2'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2033&version=NRSVUE'
    quote: 'make melody to him with the harp of ten strings'
  - where: 'note 33:2 “One instrument of ten strings”'
    claim: 'A modern translation has “lyre” for the first instrument'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2033&version=NRSVUE'
    quote: 'with the lyre'
  - where: 'note 33:2 “One instrument of ten strings”'
    claim: 'Psalm 144:9 joins a new song to the same instrument'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/144?lang=eng'
    quote: 'upon a psaltery and an instrument of ten strings will I sing praises unto thee'

  # ---------- note 33:3 ----------
  - where: 'note 33:3 “Why the song is new”'
    claim: 'Psalm 40: the singer brought up from the pit'
    key: lds-scriptures
