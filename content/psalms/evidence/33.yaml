  # ---------- note 33:12 ----------
  - where: 'note 33:12 “The nation is Israel, His inheritance”'
    claim: 'The covenant at Sinai: a treasure above all people, for all the earth is His'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng'
    quote: 'then ye shall be a peculiar treasure unto me above all people: for all the earth is mine'
  - where: 'note 33:12 “The nation is Israel, His inheritance”'
    claim: 'A modern translation’s cross-references for verse 12 include Exodus 19:5'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2033&version=NRSVUE'
    quote: '33.12 : Ex 19.5; Deut 7.6; Ps 144.15'
  - where: 'note 33:12 “The nation is Israel, His inheritance”'
    claim: 'Moses’ blessing on the tribes ends by calling Israel happy'
