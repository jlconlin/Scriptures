  - where: 'note 33:3 “Why the song is new”'
    claim: 'The same reading supposes a deliverance of the nation without war'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/33.htm'
    quote: 'It owes its composition apparently to some deliverance of the nation from heathen oppression, which had resulted from God''s interposition and without war.'
  - where: 'note 33:3 “Why the song is new”'
    claim: 'Psalm 96 has the phrase'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/96?lang=eng'
    quote: 'a new song: sing unto the'
  - where: 'note 33:3 “Why the song is new”'
    claim: 'Psalm 144 has the phrase'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/144?lang=eng'
    quote: 'I will sing a new song unto thee, O God'
  - where: 'note 33:3 “Why the song is new”'
    claim: 'Psalm 149 has the phrase'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/149?lang=eng'
    quote: 'a new song, and his praise in the congregation of saints'
  - where: 'note 33:3 “Why the song is new”'
    claim: '“A loud noise” is teruah, here a shout of joy with the music of worship'
    key: bdb
    url: 'https://biblehub.com/hebrew/8643.htm'
    quote: 'shout of joy with religious impulse'

  # ---------- note 33:6 ----------
  - where: 'note 33:6 “The word that made the heavens”'
    claim: 'The creation account begins with God speaking and the light appearing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/1?lang=eng'
    quote: 'And God said, Let there be light: and there was light.'
  - where: 'note 33:6 “The word that made the heavens”'
    claim: 'The Church’s footnote on “spake” in verse 9 points to Genesis 1:3 and Doctrine and Covenants 38:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/33?lang=eng'
    quote: 'D&C 38:3'
  - where: 'note 33:6 “The word that made the heavens”'
    claim: 'The Church’s footnote on “word” in verse 6 points to the Joseph Smith Translation of John 1 and to the Topical Guide entry on Jesus Christ as Creator'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/33?lang=eng'
    quote: 'TG Jesus Christ, Creator'
  - where: 'note 33:6 “The word that made the heavens”'
    claim: 'John names the Word'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/1?lang=eng'
    quote: 'In the beginning was the Word, and the Word was with God, and the Word was God.'
  - where: 'note 33:6 “The word that made the heavens”'
    claim: 'All things were made by the Word'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/1?lang=eng'
    quote: 'All things were made by him; and without him was not any thing made that was made.'
  - where: explore
    claim: 'The Lord told Moses that the word of His power is His Only Begotten Son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'And by the word of my power, have I created them, which is mine Only Begotten Son'
  - where: 'note 33:6 “The word that made the heavens”'
    claim: 'The Savior says He is the one who spoke and the world was made'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/38?lang=eng'
    quote: 'I am the same which spake, and the world was made, and all things came by me.'
  - where: 'note 33:6 “The word that made the heavens”'
    claim: '“Word” in verses 4 and 6 is the same Hebrew noun, dabar (Strong’s 1697)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בִּ/דְבַ֣ר'

