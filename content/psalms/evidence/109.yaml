chapter: 109
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'The title ascribes the psalm to David and gives no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/109?lang=eng'
    quote: 'A Psalm of David.'
  - where: setting
    claim: 'Peter cites the psalm as spoken by the Holy Ghost through David, concerning Judas'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/1?lang=eng'
    quote: 'this scripture must needs have been fulfilled, which the Holy Ghost by the mouth of David spake before concerning Judas, which was guide to them that took Jesus.'
  - where: setting
    claim: 'Peter quotes Psalm 69:25 and Psalm 109:8 together'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/1?lang=eng'
    quote: 'Let his habitation be desolate, and let no man dwell therein: and his bishoprick let another take.'
  - where: setting
    claim: 'Delitzsch: the curses are poured out here at greater length than anywhere else'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/109.htm'
    quote: 'The anathemas that are here poured forth more extensively than anywhere else speak in favour of David'
  - where: setting
    claim: 'Delitzsch: Psalm 109 is closest to Psalm 69'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/109.htm'
    quote: 'But Psalm 109 is most closely related to Psalm 69.'
  - where: setting
    claim: 'The chapter heading in the Church’s edition takes the curses as David’s, due to the wicked'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/109?lang=eng'
    quote: 'David speaks of the cursings due to the wicked and deceitful'
  - where: thread
    claim: 'The last verse answers verse 6: the accuser at the right hand of the tormentor, God at the right hand of the tormented'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/109.htm'
    quote: 'At the right hand of the tormentor stands Satan as an accuser, at the right hand of the tormented one stands God as his vindicator'

  # ---------- sections ----------
  - where: section 1 plain
    claim: 'Verse 4: “they are my adversaries” is “they accuse me”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20109&version=NRSVUE'
    quote: 'In return for my love they accuse me'
  - where: section 1 plain
    claim: 'Verse 4: the Hebrew of the last clause is “I prayer”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20109&version=NRSVUE'
    quote: 'Heb I prayer'
  - where: section 2 plain
    claim: 'Verse 6: “Satan” rendered “an accuser”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20109&version=NRSVUE'
    quote: 'let an accuser stand on his right.'
  - where: section 2 plain
    claim: 'Verse 7: the prayer is counted as sin'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20109&version=NRSVUE'
    quote: 'let his prayer be counted as sin.'
  - where: section 2 plain
    claim: 'Verse 11: the “extortioner” is a creditor'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20109&version=NRSVUE'
    quote: 'May the creditor seize all that he has'
  - where: section 2 plain
    claim: 'Verse 10: the “desolate places” are the ruins of the family’s former home, and the children wander away from them'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/109.htm'
    quote: 'His children wander up and down far from these ruins'
  - where: section 3 plain
    claim: 'Verse 18: cursing worn as a coat, soaking in like water'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20109&version=NRSVUE'
    quote: 'He clothed himself with cursing as his coat'
  - where: section 3 plain
    claim: 'Verse 20: “adversaries” rendered “accusers”; “my soul” as “my life”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20109&version=NRSVUE'
    quote: 'May that be the reward of my accusers from the Lord'
  - where: section 4 plain
    claim: 'Verse 23: an evening shadow'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20109&version=NRSVUE'
    quote: 'I am gone like a shadow at evening'
  - where: section 4 plain
    claim: 'Verse 23: “tossed up and down” is “shaken off”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20109&version=NRSVUE'
    quote: 'I am shaken off like a locust.'
  - where: section 4 plain
    claim: 'Verse 24: “my flesh faileth of fatness” means the body has grown gaunt'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20109&version=NRSVUE'
    quote: 'my body has become gaunt.'
  - where: section 5 plain
    claim: 'Verse 29: wrapped in their own shame as in a mantle'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20109&version=NRSVUE'
    quote: 'may they be wrapped in their own shame as in a mantle.'
  - where: section 5 plain
    claim: 'Verse 31: He stands at the right hand of the needy'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20109&version=NRSVUE'
    quote: 'For he stands at the right hand of the needy'

  # ---------- note 109:4 ----------
  - where: 'note 109:4 “A prayer for his adversaries”'
    claim: 'The Hebrew reads “I prayer”; the modern translation follows the Syriac'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20109&version=NRSVUE'
    quote: '109.4 Syr: Heb I prayer'
  - where: 'note 109:4 “A prayer for his adversaries”'
    claim: 'The modern translation has the speaker praying for his accusers'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20109&version=NRSVUE'
    quote: 'even while I make prayer for them.'
  - where: 'note 109:4 “A prayer for his adversaries”'
    claim: 'The Greek fills out the clause as continued prayer'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/109.htm'
    quote: 'Instead of loving me, they falsely accused me: but I continued to pray.'
  - where: 'note 109:4 “A prayer for his adversaries”'
    claim: 'The Joseph Smith Translation of verse 4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ps/109?lang=eng'
    quote: 'And, notwithstanding my love, they are my adversaries; yet I will continue in prayer for them.'
  - where: 'note 109:4 “A prayer for his adversaries”'
    claim: 'The Church’s edition summarizes the change'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ps/109?lang=eng'
    quote: 'We are to pray for our adversaries.'
  - where: 'note 109:4 “A prayer for his adversaries”'
    claim: 'The Savior commands prayer for persecutors'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/5?lang=eng'
    quote: 'pray for them which despitefully use you, and persecute you'

  # ---------- note 109:6 (many to one) ----------
  - where: 'note 109:6 “From many enemies to one man”'
    claim: 'Delitzsch: at verse 6 the writer turns to one among the many'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/109.htm'
    quote: 'The writer now turns to one among the many'
  - where: 'note 109:6 “From many enemies to one man”'
    claim: 'Delitzsch: who the one man was is not known'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/109.htm'
    quote: 'Is this Doeg the Edomite, or Cush the Benjamite? We do not know.'
  - where: 'note 109:6 “From many enemies to one man”'
    claim: 'Delitzsch: the man held a prominent position'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/109.htm'
    quote: 'the one individual must have held a prominent position among the enemies of the psalmist'
  - where: 'note 109:6 “From many enemies to one man”'
    claim: 'The modern translation supplies “They say” before verse 6, making verses 6–19 a quotation, and notes that the Hebrew lacks the words'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20109&version=NRSVUE'
    quote: '109.6 Heb lacks They say'
  - where: 'note 109:6 “From many enemies to one man”'
    claim: 'In that translation verse 20 turns the quoted curse back on the accusers'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20109&version=NRSVUE'
    quote: 'May that be the reward of my accusers from the Lord'
  - where: 'note 109:6 “From many enemies to one man”'
    claim: 'The Church’s chapter heading takes the curses as David’s'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/109?lang=eng'
    quote: 'David speaks of the cursings due to the wicked and deceitful'
  - where: 'note 109:6 “From many enemies to one man”'
    claim: 'Peter reads the psalm’s words as spoken concerning Judas'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/1?lang=eng'
    quote: 'which the Holy Ghost by the mouth of David spake before concerning Judas'

  # ---------- note 109:6 (Satan) ----------
  - where: 'note 109:6 “An accuser in court”'
    claim: 'The noun satan, sense 1: an adversary, personal or national; Psalm 109:6 is placed under it'
    key: bdb
    url: 'https://biblehub.com/hebrew/7854.htm'
    quote: '1 adversary, in General, personal or national'
  - where: 'note 109:6 “An accuser in court”'
    claim: 'The lexicon’s second sense is the superhuman adversary, of Job and of Zechariah 3'
    key: bdb
    url: 'https://biblehub.com/hebrew/7854.htm'
    quote: '2 superhuman adversary'
  - where: 'note 109:6 “An accuser in court”'
    claim: 'The verb from the same noun means to be or act as adversary, and is the verb of Psalm 109:4, 20 and 29'
    key: bdb
    url: 'https://biblehub.com/hebrew/7853.htm'
    quote: 'verb denominative (Gerber30) be or act as adversary'
  - where: 'note 109:6 “An accuser in court”'
    claim: 'The lexicon lists the verb at Psalm 109:4, and its participle (“mine adversaries”) at 109:20 and 109:29'
    key: bdb
    url: 'https://biblehub.com/hebrew/7853.htm'
    quote: 'Psalm 38:21; Psalm 109:4; Infinitive construct suffix'
  - where: 'note 109:6 “An accuser in court”'
    claim: 'A modern translation has “an accuser”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20109&version=NRSVUE'
    quote: 'let an accuser stand on his right.'
  - where: 'note 109:6 “An accuser in court”'
    claim: 'The Greek has “the devil”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/109.htm'
    quote: 'let the devil stand at his right hand.'
  - where: 'note 109:6 “An accuser in court”'
    claim: 'Zechariah sees Satan at the right hand of the accused high priest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/3?lang=eng'
    quote: 'Joshua the high priest standing before the angel of the Lord, and Satan standing at his right hand to resist him.'

  # ---------- note 109:8 ----------
  - where: 'note 109:8 “Peter reads the line of Judas”'
    claim: 'Peter quotes the line with Psalm 69:25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/1?lang=eng'
    quote: 'For it is written in the book of Psalms, Let his habitation be desolate, and let no man dwell therein: and his bishoprick let another take.'
  - where: 'note 109:8 “Peter reads the line of Judas”'
    claim: 'Matthias is chosen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/1?lang=eng'
    quote: 'and the lot fell upon Matthias; and he was numbered with the eleven apostles.'
  - where: 'note 109:8 “Peter reads the line of Judas”'
    claim: 'Judas fell by transgression from the apostleship'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/1?lang=eng'
    quote: 'That he may take part of this ministry and apostleship, from which Judas by transgression fell'
  - where: 'note 109:8 “Peter reads the line of Judas”'
    claim: 'The Hebrew noun (H6486) means oversight, charge, and so office'
    key: bdb
    url: 'https://biblehub.com/hebrew/6486.htm'
    quote: '2. a. oversight, charge'
  - where: 'note 109:8 “Peter reads the line of Judas”'
    claim: 'The lexicon thinks the word in Psalm 109:8 is perhaps “store, things laid up,” and reports “office” as the reading of others'
    key: bdb
    url: 'https://biblehub.com/hebrew/6486.htm'
    quote: '4 store, things laid up, Isaiah 15:7; Psalm 109:8 (perhaps;'
  - where: 'note 109:8 “Peter reads the line of Judas”'
    claim: 'The Greek psalm reads an overseer’s office'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/109.htm'
    quote: 'let another take his office of overseer.'
  - where: 'note 109:8 “Peter reads the line of Judas”'
    claim: 'The Church’s footnote on “bishoprick” in Acts 1:20 gives the Greek as overseership, office, and refers to Psalm 109:8 and D&C 114:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/1?lang=eng'
    quote: 'overseership, office.'
  - where: 'note 109:8 “Peter reads the line of Judas”'
    claim: 'The Lord uses the phrase of those who deny His name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/114?lang=eng'
    quote: 'inasmuch as there are those among you who deny my name, others shall be planted in their stead and receive their bishopric.'
  - where: 'note 109:8 “Peter reads the line of Judas”'
    claim: 'The revelation is dated April 11, 1838'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/114?lang=eng'
    quote: 'Revelation given through Joseph Smith the Prophet, at Far West, Missouri, April 11, 1838.'
  - where: 'note 109:8 “Peter reads the line of Judas”'
    claim: 'The section summary: it concerns Church positions held by those who are not faithful'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/114?lang=eng'
    quote: 'Church positions held by those who are not faithful'

  # ---------- note 109:17 ----------
  - where: 'note 109:17 “The curse he chose”'
    claim: 'The Greek reads verse 17 as a statement of what will follow, not a wish'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/109.htm'
    quote: 'He loved cursing also, and it shall come upon him'
  - where: 'note 109:17 “The curse he chose”'
    claim: 'Delitzsch: verses 16–18 are not in the form of a wish'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/109.htm'
    quote: 'is not expressed after the manner of a wish in Psalm 109:16-18, but in the historical form'
  - where: 'note 109:17 “The curse he chose”'
    claim: 'Delitzsch: the man’s fate follows from the course he chose'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/109.htm'
    quote: 'as being the result that followed of inward necessity from the matter of fact of the course which he had himself determined upon'
  - where: 'note 109:17 “The curse he chose”'
    claim: 'James: judgment without mercy for one who showed none'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/james/2?lang=eng'
    quote: 'For he shall have judgment without mercy, that hath shewed no mercy'
  - where: 'note 109:17 “The curse he chose”'
    claim: 'Alma: what is sent out returns'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/41?lang=eng'
    quote: 'For that which ye do send out shall return unto you again, and be restored'

  # ---------- note 109:23 ----------
  - where: 'note 109:23 “Shaken off like a locust”'
    claim: 'The verb (H5287) means to shake, shake out or off'
    key: bdb
    url: 'https://biblehub.com/hebrew/5287.htm'
    quote: 'verb shake, shake out or off'
  - where: 'note 109:23 “Shaken off like a locust”'
    claim: 'The lexicon’s rendering of the line, and what the simile means'
    key: bdb
    url: 'https://biblehub.com/hebrew/5287.htm'
    quote: 'I am shaken out like a locust (from fold of a garment; simile of perishing helplessly)'
  - where: 'note 109:23 “Shaken off like a locust”'
    claim: 'A modern translation has “shaken off”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20109&version=NRSVUE'
    quote: 'I am shaken off like a locust.'
  - where: 'note 109:23 “Shaken off like a locust”'
    claim: 'The shadow is an evening shadow'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20109&version=NRSVUE'
    quote: 'I am gone like a shadow at evening'
  - where: 'note 109:23 “Shaken off like a locust”'
    claim: 'Psalm 102 has the same image of the declining shadow'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/102?lang=eng'
    quote: 'My days are like a shadow that declineth; and I am withered like grass.'

  # ---------- christ ----------
  - where: christ
    claim: 'Peter says the Holy Ghost spoke the psalm by David concerning Judas'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/1?lang=eng'
    quote: 'this scripture must needs have been fulfilled, which the Holy Ghost by the mouth of David spake before concerning Judas, which was guide to them that took Jesus.'
  - where: christ
    claim: 'Delitzsch counts Psalm 109 with 22 and 69 as a typically prophetic psalm'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/109.htm'
    quote: 'like Psalm 22 and Psalm 69, is a typically prophetic Psalm'
  - where: christ
    claim: 'Delitzsch: what David says of himself is carried by the Spirit of prophecy beyond himself'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/109.htm'
    quote: 'is carried by the Spirit of prophecy beyond himself'
  - where: christ
    claim: 'Delitzsch: the curses are not fitting in the mouth of the suffering Savior'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/109.htm'
    quote: 'These imprecations are not, however, appropriate in the mouth of the suffering Saviour.'
  - where: christ
    claim: 'The Savior prays for those who crucify Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/23?lang=eng'
    quote: 'Father, forgive them; for they know not what they do.'
  - where: christ
    claim: 'John names Jesus Christ the advocate with the Father'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-jn/2?lang=eng'
    quote: 'we have an advocate with the Father, Jesus Christ the righteous'
  - where: christ
    claim: 'The Lord calls Himself the advocate who pleads the cause of His people'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/45?lang=eng'
    quote: 'Listen to him who is the advocate with the Father, who is pleading your cause before him'

  # ---------- explore / parallels ----------
  - where: explore
    claim: 'In Zechariah 3 the LORD rebukes Satan'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/zech/3?lang=eng'
    quote: 'And the Lord said unto Satan, The Lord rebuke thee, O Satan'
  - where: explore
    claim: 'Revelation calls the adversary the accuser of the brethren, cast down'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/12?lang=eng'
    quote: 'for the accuser of our brethren is cast down, which accused them before our God day and night.'
  - where: explore
    claim: 'Psalm 110:5 puts the Lord at the king’s right hand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/110?lang=eng'
    quote: 'The Lord at thy right hand shall strike through kings in the day of his wrath.'
  - where: parallels
    claim: 'Psalm 69:25 is the other line Peter quotes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/69?lang=eng'
    quote: 'Let their habitation be desolate; and let none dwell in their tents.'
  - where: parallels
    claim: 'The Church’s footnote on verse 6 refers to Zechariah 3:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/109?lang=eng'
    quote: 'an adversary, accuser'
