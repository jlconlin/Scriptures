chapter: 126
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'The psalm’s title is “A Song of degrees” and names no author; the psalm looks back on the LORD turning the captivity of Zion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/126?lang=eng'
    quote: 'When the Lord turned again the captivity of Zion, we were like them that dream.'
  - where: setting
    claim: 'The songs of degrees are fifteen psalms, 120–134 (Psalm 126 is the seventh)'
    key: bd-degrees-songs-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/degrees-songs-of?lang=eng'
    quote: 'Fifteen Psalms (120–34), probably so called because they were sung by Jewish pilgrims on their way up to Jerusalem.'
  - where: setting
    claim: 'The return from Babylon followed the decree of Cyrus of Persia, who let the Jews go back to build the temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/1?lang=eng'
    quote: 'King Cyrus of Persia lets the Jews go back to Jerusalem to build the temple'
  - where: setting
    claim: 'Delitzsch takes the singers to be the exiles back in their land, looking back on their release'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/126.htm'
    quote: 'It is the exiles at home again upon the soil of their fatherland who here cast back a glance into the happy time when their destiny suddenly took another turn'
  - where: setting
    claim: 'Psalm 85 has the same shape: thanks for the captivity of Jacob brought back, then a prayer to be turned (Delitzsch makes the comparison)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/126.htm'
    quote: 'which also gives thanks for the restoration of the captive ones of Israel on the one hand, and on the other hand has to complain of the wrath that is still not entirely removed, and prays for a national restoration'
  - where: setting
    claim: 'Psalm 126 follows a psalm that also names Zion (Delitzsch: the word Zion connects the two)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/126.htm'
    quote: 'which the favourite word Zion connects with the preceding Psalm'
  - where: setting
    claim: 'D&C 31, 33 and 75 promise sheaves to those sent to preach the gospel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/33?lang=eng'
    quote: 'Laborers are called to declare the gospel in the eleventh hour'

  # ---------- thread ----------
  - where: thread
    claim: 'Verses 1–3 are a look back at the past; Delitzsch reports that some expositors read them of the future and rejects that reading'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/126.htm'
    quote: 'There are expositors indeed who also transfer the grateful retrospect with which this Song of degrees (Psalm 126:1-3)'
  - where: thread
    claim: 'The streams of verse 4 are the watercourses of the Negev, the south country'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20126&version=NRSVUE'
    quote: 'like the watercourses in the Negeb'

  # ---------- sections ----------
  - where: section 1 plain
    claim: 'Verse 2’s “singing” is rendered “shouts of joy,” and “the heathen” are the nations'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20126&version=NRSVUE'
    quote: 'and our tongue with shouts of joy; then it was said among the nations'
  - where: section 2 plain
    claim: 'Verse 4 names the watercourses of the Negev; verse 6’s “precious seed” is the seed for sowing'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20126&version=NRSVUE'
    quote: 'bearing the seed for sowing, shall come home with shouts of joy, carrying their sheaves'
  - where: section 2 plain
    claim: 'The Negev is the dry “south country”'
    key: bd-negev
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/negev?lang=eng'
    quote: 'Dry or parched land, also called “south country”'

  # ---------- note 126:1 captivity ----------
  - where: parallels
    claim: 'The same phrase is used of Job, who is given twice what he had before'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/42?lang=eng'
    quote: 'And the Lord turned the captivity of Job, when he prayed for his friends: also the Lord gave Job twice as much as he had before.'
  - where: 'note 126:1 “To turn a captivity is to restore what was lost”'
    claim: 'BDB lists “restore the captivity of” as a fixed phrase with the LORD as subject, used of Israel or Judah in Deuteronomy, Jeremiah, Amos, Joel and the Psalms'
    key: bdb
    url: 'https://biblehub.com/hebrew/7622.htm'
    quote: 'in phrase restore the captivity of'
  - where: 'note 126:1 “To turn a captivity is to restore what was lost”'
    claim: 'A modern translation renders verse 1 “restored the fortunes of Zion”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20126&version=NRSVUE'
    quote: 'When the Lord restored the fortunes of Zion'

  # ---------- note 126:1 dream ----------
  - where: thread
    claim: 'On Delitzsch’s reading the redemption came so suddenly that it seemed at first a dream and not real'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/126.htm'
    quote: 'the redemption that broke upon us so suddenly seemed to us at first not to be a reality but a beautiful dream'

  # ---------- note 126:2 ----------
  - where: 'note 126:2 “The nations say it before Israel does”'
    claim: 'Ezekiel says the nations round about will know that the LORD rebuilt and replanted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/36?lang=eng'
    quote: 'Then the heathen that are left round about you shall know that I the Lord build the ruined places, and plant that that was desolate'

  # ---------- note 126:4 captivity ----------
  - where: 'note 126:4 “Why the people ask for what they have already received”'
    claim: 'Cyrus permitted all worshippers of Jehovah to return, and only part of the people did'
    key: bd-captivities
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/captivities-of-the-israelites?lang=eng'
    quote: 'who permitted all worshippers of Jehovah to return and build the temple in Jerusalem. Only part of the people availed themselves of this permission; the rest remained behind and formed the dispersion.'
  - where: 'note 126:4 “Why the people ask for what they have already received”'
    claim: 'Moses’s promise is of a gathering from all the nations where Israel was scattered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/30?lang=eng'
    quote: 'gather thee from all the nations, whither the Lord thy God hath scattered thee'
  - where: 'note 126:4 “Why the people ask for what they have already received”'
    claim: 'Psalm 85 opens with the captivity of Jacob brought back and then asks to be turned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/85?lang=eng'
    quote: 'thou hast brought back the captivity of Jacob'

  # ---------- note 126:4 streams ----------
  - where: 'note 126:4 “Dry streambeds that run again”'
    claim: 'The Negev is dry land called the south country, stretching from the hills of Judah toward the desert'
    key: bd-negev
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/negev?lang=eng'
    quote: 'Dry or parched land, also called “south country”; the district stretching southward from the hills of Judah toward the desert.'
  - where: 'note 126:4 “Dry streambeds that run again”'
    claim: 'A modern translation names the Negev in verse 4'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20126&version=NRSVUE'
    quote: 'like the watercourses in the Negeb'

  # ---------- note 126:5 ----------
  - where: 'note 126:5 “Why the sower weeps”'
    claim: 'Delitzsch takes the sowers to be the returned exiles working parched ground with little hope of a crop'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/126.htm'
    quote: 'who are again sowing the old soil of their native land, and that with tears, because the ground is so parched that there is little hope of the seed springing up'
  - where: 'note 126:5 “Why the sower weeps”'
    claim: 'Delitzsch recalls the drought of Haggai’s time'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/126.htm'
    quote: 'One is reminded here of the drought and failure of the crops with which the new colony was visited in the time of Haggai'
  - where: 'note 126:5 “Why the sower weeps”'
    claim: 'Delitzsch takes the tearful sowing as an emblem of the rebuilding, begun with tears (Ezra 3:12)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/126.htm'
    quote: 'the tearful sowing is only an emblem of the new foundation-laying, which really took place not without many tears (Ezra 3:12)'
  - where: 'note 126:5 “Why the sower weeps”'
    claim: 'At the laying of the second temple’s foundation the old men who had seen the first house wept while others shouted for joy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/3?lang=eng'
    quote: 'who were ancient men, that had seen the first house, when the foundation of this house was laid before their eyes, wept with a loud voice; and many shouted aloud for joy'
  - where: 'note 126:5 “Why the sower weeps”'
    claim: 'Haggai records a drought on the land and on all the labour of the hands'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hag/1?lang=eng'
    quote: 'And I called for a drought upon the land'
  - where: 'note 126:5 “Why the sower weeps”'
    claim: 'A modern translation has “the seed for sowing”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20126&version=NRSVUE'
    quote: 'bearing the seed for sowing'

  # ---------- note 126:6 ----------
  - where: 'note 126:6 “The Lord promises sheaves to those who preach His gospel”'
    claim: 'The Church’s edition footnotes verse 6 to D&C 75:5, 31:5 and 33:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/126?lang=eng'
    quote: 'D&C 31:5; 33:9'
  - where: 'note 126:6 “The Lord promises sheaves to those who preach His gospel”'
    claim: 'D&C 31 is addressed to Thomas B. Marsh, called to preach the gospel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/31?lang=eng'
    quote: 'Thomas B. Marsh is called to preach the gospel'
  - where: 'note 126:6 “The Lord promises sheaves to those who preach His gospel”'
    claim: 'D&C 33 calls laborers to declare the gospel in the eleventh hour'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/33?lang=eng'
    quote: 'Laborers are called to declare the gospel in the eleventh hour'
  - where: 'note 126:6 “The Lord promises sheaves to those who preach His gospel”'
    claim: 'D&C 75 is addressed to elders who preach the gospel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/75?lang=eng'
    quote: 'Faithful elders who preach the gospel will gain eternal life'
  - where: 'note 126:6 “The Lord promises sheaves to those who preach His gospel”'
    claim: 'Ammon speaks of sheaves gathered into the garners'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/26?lang=eng'
    quote: 'behold the number of your sheaves! And they shall be gathered into the garners, that they are not wasted.'

  # ---------- christ ----------
  - where: christ
    claim: 'The Church’s edition footnotes “great things” in verse 2 to Luke 1:49'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/126?lang=eng'
    quote: 'Luke 1:49'
  - where: christ
    claim: 'Delitzsch says the psalm’s language coincides with the beatitude on those who mourn'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/126.htm'
    quote: 'in its general sense the language of the Psalm coincides with the language of the Preacher on the Mount, Matthew 5:4'
  - where: christ
    claim: 'The speaker of D&C 31 names Himself Jesus Christ, the Redeemer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/31?lang=eng'
    quote: 'These words are not of man nor of men, but of me, even Jesus Christ, your Redeemer, by the will of the Father.'

  # ---------- explore / parallels ----------
  - where: explore
    claim: 'Amos sets a harvest that overtakes itself beside the captivity of Israel brought again'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/9?lang=eng'
    quote: 'And I will bring again the captivity of my people of Israel'
  - where: explore
    claim: 'Isaiah has the ransomed of the LORD returning to Zion with songs'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/35?lang=eng'
    quote: 'And the ransomed of the Lord shall return, and come to Zion with songs and everlasting joy upon their heads'
  - where: explore
    claim: 'The Savior speaks of sower and reaper rejoicing together'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/4?lang=eng'
    quote: 'that both he that soweth and he that reapeth may rejoice together'
  - where: parallels
    claim: 'Mary says that He who is mighty has done great things for her'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'For he that is mighty hath done to me great things; and holy is his name.'
  # ---------- added in review ----------
  - where: 'note 126:1 “To turn a captivity is to restore what was lost”'
    claim: 'The same translation gives an alternative reading of verse 1 in its footnote: brought back those who returned to Zion'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20126&version=NRSVUE'
    quote: 'Or brought back those who returned to Zion'
  - where: thread
    claim: 'Delitzsch: the streams of the Negev disappear in summer and return in winter'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/126.htm'
    quote: 'thirsts for the rain-water streams, which disappear in the summer season and regularly return in the winter season'
  - where: 'note 126:4 “Dry streambeds that run again”'
    claim: 'Delitzsch: the streams of the Negev disappear in summer and return in winter'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/126.htm'
    quote: 'thirsts for the rain-water streams, which disappear in the summer season and regularly return in the winter season'
  - where: 'note 126:4 “Dry streambeds that run again”'
    claim: 'Delitzsch reads the comparison as the land longing for its people to flow back as the Negev longs for its streams'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/126.htm'
    quote: 'the holy land yearns after an abundant, reanimating influx of population'
  - where: 'note 126:6 “The Lord promises sheaves to those who preach His gospel”'
    claim: 'The Church’s edition footnotes “sheaves” in Alma 26:5 to D&C 33:9 and 75:5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/26?lang=eng'
    quote: 'D&C 33:9; 75:5'
