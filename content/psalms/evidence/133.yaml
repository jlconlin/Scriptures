chapter: 133
claims:
  # ---------- when ----------
  - where: 'when'
    claim: 'The title names David and gives no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/133?lang=eng'
    quote: 'A Song of degrees of David.'

  # ---------- setting ----------
  - where: 'setting'
    claim: 'The songs of degrees are fifteen psalms, 120–134, probably sung by pilgrims going up to Jerusalem; Psalm 133 is the fourteenth'
    key: bd-degrees-songs-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/degrees-songs-of?lang=eng'
    quote: 'Fifteen Psalms (120–34), probably so called because they were sung by Jewish pilgrims on their way up to Jerusalem.'
  - where: 'setting'
    claim: 'Psalm 132 says the LORD has chosen Zion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/132?lang=eng'
    quote: 'For the Lord hath chosen Zion; he hath desired it for his habitation.'
  - where: 'setting'
    claim: 'Psalm 134, the last song of degrees, ends with a blessing out of Zion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/134?lang=eng'
    quote: 'The Lord that made heaven and earth bless thee out of Zion.'
  - where: 'setting'
    claim: 'Joseph Smith quoted all three verses in a letter to the Saints from Nauvoo'
    key: tpjs-2007-ch-23
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-23?lang=eng'
    quote: 'for there the Lord commanded the blessing, even life for evermore!’ Unity is power. [See Psalm 133:1–3.]'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'The verb of the oil in verse 2, used twice, is Hebrew yarad (Strong’s 3381), a participle each time'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/133-2.htm'
    quote: 'which is running down'
  - where: 'thread'
    claim: 'The verb of the dew in verse 3 is the same verb in the same form'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/133-3.htm'
    quote: 'which is coming down'
  - where: 'thread'
    claim: 'The lexicon lists the oil of verse 2 (twice) under the verb “go down, descend”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3381.htm'
    quote: 'of oil descending upon (על) beard, etc. Psalm 133:2 (twice in verse).'
  - where: 'thread'
    claim: 'One older reading: the brotherly love the psalm praises is, like the dew, born from above'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/133.htm'
    quote: 'thus born from above'

  # ---------- sections ----------
  - where: 'section 2 plain'
    claim: 'The ointment is oil, and it runs down'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20133&version=NRSVUE'
    quote: 'It is like the precious oil on the head'
  - where: 'section 3 plain'
    claim: 'The line can be read as one dew, Hermon’s, coming down on the mountains of Zion'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20133&version=NRSVUE'
    quote: 'It is like the dew of Hermon'

  # ---------- note 133:1 Joseph Smith ----------
  - where: 'note 133:1 “Joseph Smith quotes the whole psalm to the Saints”'
    claim: 'Joseph Smith introduced the psalm as the Psalmist’s and quoted verse 1'
    key: tpjs-2007-ch-23
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-23?lang=eng'
    quote: 'Now, let me say once for all, like the Psalmist of old, ‘How good and how pleasant it is for brethren to dwell together in unity.’'
  - where: 'note 133:1 “Joseph Smith quotes the whole psalm to the Saints”'
    claim: 'He applied the oil and the dew to unity'
    key: tpjs-2007-ch-23
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-23?lang=eng'
    quote: 'as the dew of Hermon that descended upon the mountains of Zion,’ is such unity'
  - where: 'note 133:1 “Joseph Smith quotes the whole psalm to the Saints”'
    claim: 'He closed with a sentence of his own'
    key: tpjs-2007-ch-23
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-23?lang=eng'
    quote: 'Unity is power.'
  - where: 'note 133:1 “Joseph Smith quotes the whole psalm to the Saints”'
    claim: 'The letter was to the Saints, dated 1 November 1843, from Nauvoo'
    key: tpjs-2007-ch-23
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-23?lang=eng'
    quote: 'from a letter from Joseph Smith to the Saints, Nov. 1, 1843, Nauvoo, Illinois, published in Times and Seasons'
  - where: 'note 133:1 “Joseph Smith quotes the whole psalm to the Saints”'
    claim: 'In December 1840 he wrote to the Twelve and other leaders serving in Great Britain'
    key: tpjs-2007-ch-23
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-23?lang=eng'
    quote: 'In December 1840 the Prophet wrote to members of the Quorum of the Twelve and other priesthood leaders who were serving missions in Great Britain'
  - where: 'note 133:1 “Joseph Smith quotes the whole psalm to the Saints”'
    claim: 'In that letter he said unity is strength and quoted verse 1'
    key: tpjs-2007-ch-23
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-23?lang=eng'
    quote: 'unity is strength. ‘How pleasing it is for brethren to dwell together in unity!’'
  - where: 'note 133:1 “Joseph Smith quotes the whole psalm to the Saints”'
    claim: 'He promised blessings to the Saints and the Church for cultivating unity'
    key: tpjs-2007-ch-23
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-23?lang=eng'
    quote: 'Let the Saints of the Most High ever cultivate this principle, and the most glorious blessings must result, not only to them individually, but to the whole Church'

  # ---------- note 133:1 brethren ----------
  - where: 'note 133:1 “Who the brethren are”'
    claim: 'The songs of degrees were probably sung by pilgrims on the way up to Jerusalem'
    key: bd-degrees-songs-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/degrees-songs-of?lang=eng'
    quote: 'probably so called because they were sung by Jewish pilgrims on their way up to Jerusalem'
  - where: 'note 133:1 “Who the brethren are”'
    claim: 'Psalm 122 calls Jerusalem the city to which the tribes go up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/122?lang=eng'
    quote: 'Whither the tribes go up, the tribes of the Lord'
  - where: 'note 133:1 “Who the brethren are”'
    claim: 'One older reading: the dwelling together is Israel’s at the three feasts'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/133.htm'
    quote: 'a blessed joy which Israel has enjoyed during the three great Feasts, although only for a brief period'
  - where: 'note 133:1 “Who the brethren are”'
    claim: 'One older reading: brethren already united by blood and heart also dwell in one place'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/133.htm'
    quote: 'when brethren united by blood and heart also'

  # ---------- note 133:2 oil ----------
  - where: 'note 133:2 “The oil that consecrated Aaron”'
    claim: 'The holy anointing oil of the law of Moses was olive oil mixed with spices, restricted to certain ceremonies'
    key: bd-anoint
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/anoint?lang=eng'
    quote: 'The holy anointing oil used in the law of Moses was composed of olive oil mixed with spices and was to be restricted in use to certain specified ceremonies (Ex. 30:22–33; 37:29).'
  - where: 'note 133:2 “The oil that consecrated Aaron”'
    claim: 'The oil was compounded by the LORD’s direction'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: 'And thou shalt make it an oil of holy ointment, an ointment compound after the art of the apothecary: it shall be an holy anointing oil.'
  - where: 'note 133:2 “The oil that consecrated Aaron”'
    claim: 'It was holy and forbidden to common use'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/30?lang=eng'
    quote: 'Upon man’s flesh shall it not be poured, neither shall ye make any other like it, after the composition of it: it is holy, and it shall be holy unto you.'
  - where: 'note 133:2 “The oil that consecrated Aaron”'
    claim: 'Moses poured it on Aaron’s head to sanctify him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/8?lang=eng'
    quote: 'And he poured of the anointing oil upon Aaron’s head, and anointed him, to sanctify him.'

  # ---------- note 133:2 collar ----------
  - where: 'note 133:2 “Collar or hem, and one verb three times”'
    claim: 'The Hebrew word is “mouth,” and the lexicon lists this verse, with “probably,” beside the opening of the high priest’s robe'
    key: bdb
    url: 'https://biblehub.com/hebrew/6310.htm'
    quote: 'high-priest''s robe Exodus 28:32 5t., compare probably Psalm 133:2'
  - where: 'note 133:2 “Collar or hem, and one verb three times”'
    claim: 'The high priest’s robe had a hole in the top'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/28?lang=eng'
    quote: 'And there shall be an hole in the top of it, in the midst thereof'
  - where: 'note 133:2 “Collar or hem, and one verb three times”'
    claim: 'A modern translation has the collar'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20133&version=NRSVUE'
    quote: 'running down over the collar of his robes'
  - where: 'note 133:2 “Collar or hem, and one verb three times”'
    claim: 'Both verbs of the oil in verse 2 are the Hebrew verb yarad (Strong’s 3381)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/133-2.htm'
    quote: 'which is running down'
  - where: 'note 133:2 “Collar or hem, and one verb three times”'
    claim: 'The verb of the dew in verse 3 is the same verb'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/133-3.htm'
    quote: 'which is coming down'
  - where: 'note 133:2 “Collar or hem, and one verb three times”'
    claim: 'The lexicon lists the oil of verse 2, twice, under this verb'
    key: bdb
    url: 'https://biblehub.com/hebrew/3381.htm'
    quote: 'of oil descending upon (על) beard, etc. Psalm 133:2 (twice in verse).'
  - where: 'note 133:2 “Collar or hem, and one verb three times”'
    claim: 'The lexicon lists the dew of verse 3 under the same verb'
    key: bdb
    url: 'https://biblehub.com/hebrew/3381.htm'
    quote: 'location Numbers 11:9 (JE), Psalm 133:3'

  # ---------- note 133:3 dew ----------
  - where: 'note 133:3 “Dew from the far north on Zion”'
    claim: 'Hermon is 9,400 feet high, in the extreme northeast of the Holy Land'
    key: bd-hermon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hermon?lang=eng'
    quote: 'A mountain, 9400 feet high, in the extreme northeast of the Holy Land'
  - where: 'note 133:3 “Dew from the far north on Zion”'
    claim: 'A modern translation has one dew, Hermon’s, falling on Zion'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20133&version=NRSVUE'
    quote: 'which falls on the mountains of Zion.'
  - where: 'note 133:3 “Dew from the far north on Zion”'
    claim: 'The modern translation’s first half of the line'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20133&version=NRSVUE'
    quote: 'It is like the dew of Hermon'
  - where: 'note 133:3 “Dew from the far north on Zion”'
    claim: 'Joseph Smith quoted the line with one dew'
    key: tpjs-2007-ch-23
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-23?lang=eng'
    quote: 'as the dew of Hermon that descended upon the mountains of Zion'
  - where: 'note 133:3 “Dew from the far north on Zion”'
    claim: 'Dew was of great importance for want of rain, and is spoken of as a source of fertility'
    key: bd-dew
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dew?lang=eng'
    quote: 'Of great importance in Palestine owing to the want of rain during a large portion of the year; hence spoken of as a source of fertility'
  - where: 'note 133:3 “Dew from the far north on Zion”'
    claim: 'In poetry dew stands for a good effect produced quietly; the entry lists this verse'
    key: bd-dew
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dew?lang=eng'
    quote: 'in poetry as typical of any beneficial effect produced by quiet means (Deut. 32:2; Ps. 110:3; 133:3'
  - where: 'note 133:3 “Dew from the far north on Zion”'
    claim: 'One older reading: cold air from Hermon could carry a heavy dew to Jerusalem'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/133.htm'
    quote: 'might very well be diverted to Jerusalem by the operation of the cold current of air sweeping down from the north over Hermon'
  - where: 'note 133:3 “Dew from the far north on Zion”'
    claim: 'One older reading: the figure is of northern and southern brethren meeting in Jerusalem at the feasts'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/133.htm'
    quote: 'when brethren out of the north unite with brethren in the south in Jerusalem'

  # ---------- note 133:3 blessing ----------
  - where: 'note 133:3 “A blessing commanded, and the blessing is life”'
    claim: 'Deuteronomy 28 promises obedient Israel a commanded blessing on its storehouses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: 'The Lord shall command the blessing upon thee in thy storehouses, and in all that thou settest thine hand unto'
  - where: 'note 133:3 “A blessing commanded, and the blessing is life”'
    claim: 'Leviticus 25 has the LORD command His blessing in the sixth year, before the sabbath year, as a harvest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'Then I will command my blessing upon you in the sixth year, and it shall bring forth fruit for three years.'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'The Savior prays that His disciples may be one'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/17?lang=eng'
    quote: 'That they all may be one; as thou, Father, art in me, and I in thee, that they also may be one in us'
  - where: 'christ'
    claim: 'In the same prayer He speaks of giving eternal life'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/17?lang=eng'
    quote: 'that he should give eternal life to as many as thou hast given him'
  - where: 'christ'
    claim: 'The Lord commands the Church to be one'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/38?lang=eng'
    quote: 'I say unto you, be one; and if ye are not one ye are not mine.'
  - where: 'christ'
    claim: 'Christ and Messiah both mean “anointed”'
    key: bd-anointed-one
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/anointed-one?lang=eng'
    quote: 'The English word Christ is from a Greek word meaning “anointed” and is the equivalent of Messiah, which is from a Hebrew and Aramaic term meaning “anointed.”'
  - where: 'christ'
    claim: 'The Bible Dictionary goes from the holy anointing oil of the law of Moses to God’s anointing of Jesus'
    key: bd-anoint
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/anoint?lang=eng'
    quote: 'Peter says that “God anointed Jesus of Nazareth with the Holy Ghost and with power” (Acts 10:38). See Anointed One.'
  - where: 'christ'
    claim: 'Hebrews 5 speaks of Aaron’s calling and then of Christ as high priest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/5?lang=eng'
    quote: 'So also Christ glorified not himself to be made an high priest'
  - where: 'christ'
    claim: 'The Church’s manual chapter titled with verse 1 lists the Savior’s prayer in John 17 and D&C 38:24–27 among its related scriptures on unity'
    key: tpjs-2007-ch-23
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-23?lang=eng'
    quote: 'Related Scriptures: Matthew 18:19–20; John 17:6–26; Mosiah 18:21; 3 Nephi 11:29–30; D&C 38:24–27; Moses 7:18'

  # ---------- explore ----------
  - where: 'explore'
    claim: 'Moses 7:18 says why the Lord called His people Zion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/7?lang=eng'
    quote: 'And the Lord called his people Zion, because they were of one heart and one mind'
  - where: 'explore'
    claim: 'Chapter 23 of the Joseph Smith volume takes its title from verse 1'
    key: tpjs-2007-ch-23
    url: 'https://www.churchofjesuschrist.org/study/manual/teachings-joseph-smith/chapter-23?lang=eng'
    quote: 'Chapter 23: ‘How Good and How Pleasant It Is … to Dwell Together in Unity’'

  # ---------- parallels ----------
  - where: 'parallels'
    claim: 'Deuteronomy 28:8 has the phrase “command the blessing”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: 'The Lord shall command the blessing upon thee'
