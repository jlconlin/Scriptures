  - where: 'note 35:27 “The enemies’ words, turned”'
    claim: '“Rejoiced” in verse 15 is the verb samach (Strong’s 8055)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שָׂמְח֪וּ'
  - where: 'note 35:27 “The enemies’ words, turned”'
    claim: '“Be glad” in verse 27 is the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וְ/יִשְׂמְחוּ֮'
  - where: 'note 35:27 “The enemies’ words, turned”'
    claim: 'In verses 15, 19 and 24 the verb is to rejoice arrogantly'
    key: bdb
    url: 'https://biblehub.com/hebrew/8055.htm'
    quote: 'rejoice arrogantly, exult at'
  - where: 'note 35:27 “The enemies’ words, turned”'
    claim: '“Peace” in verse 20 is shalom (Strong’s 7965)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שָׁל֗וֹם'
  - where: 'note 35:27 “The enemies’ words, turned”'
    claim: '“Prosperity” in verse 27 is the same word'
    key: oshb-wlc
