  # ---- note 35:27 ----
  - where: 'note 35:27 “The enemies’ words, turned”'
    claim: '“Magnify themselves” in verse 26 is the verb gadal (Strong’s 1431)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הַֽ/מַּגְדִּילִ֥ים'
  - where: 'note 35:27 “The enemies’ words, turned”'
    claim: '“Be magnified” in verse 27 (and in 40:16) is the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יִגְדַּ֣ל'
  - where: 'note 35:27 “The enemies’ words, turned”'
    claim: 'The verb is used in a bad sense of the enemies in verse 26'
    key: bdb
    url: 'https://biblehub.com/hebrew/1431.htm'
