chapter: 34
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The title ascribes the psalm to David and places it when he “changed his behaviour before Abimelech”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/34?lang=eng'
    quote: 'A Psalm of David, when he changed his behaviour before Abimelech; who drove him away, and he departed.'
  - where: 'when'
    claim: 'The Abimelech of the title is Achish, king of Gath'
    key: bd-abimelech
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abimelech?lang=eng'
    quote: 'In title of Ps. 34 same as Achish (1 Sam. 21:11).'

  # ---- setting ----
  - where: 'setting'
    claim: 'Psalm 34 is counted among the songs of thanksgiving, sung by one who has been delivered from a trial'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'Songs of thanksgiving. These psalms reflect the gratitude of an individual or community after they have been delivered from a trial by God: 18, 30, 34, 40, 66, 92, 116, 118, and 138.'
  - where: 'setting'
    claim: 'The psalm itself makes no express reference to the incident in Philistia'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/34.htm'
    quote: 'The Psalm does not contain any express reference to that incident in Philistia'
  - where: 'setting'
    claim: 'The psalm is an acrostic of two-line verses in the order of the Hebrew alphabet'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/34.htm'
    quote: 'It consists of verses of two lines, which follow one another according to the order of the letters of the alphabet.'
  - where: 'setting'
    claim: 'The sixth letter (vav) has no verse, and a second verse beginning with pe follows the last letter, as in Psalm 25, which has been called its counterpart'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/34.htm'
    quote: 'The ו is wanting, just as the נ is wanting in Psalm 145; and after ת, as in Psalm 25, which is the counterpart to Psalm 34, follows a second supernumerary פ.'
  - where: 'setting'
    claim: 'Peter quotes verses 12–16 in his first letter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/3?lang=eng'
    quote: 'For he that will love life, and see good days, let him refrain his tongue from evil, and his lips that they speak no guile'

  # ---- thread ----
  - where: 'thread'
    claim: 'The psalm falls into two main parts; the second, from verse 11, takes the tone of a teaching poem'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/34.htm'
    quote: 'The first main division of the Psalm is ended; the second (much the same as in Psalm 32:1-11) assumes more the tone of a didactic poem'
  - where: 'thread'
    claim: '“This poor man” in verse 6 has been read as David pointing to himself'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/34.htm'
    quote: 'David points to himself. From the great peril in which he was placed at the court of the Philistines, from which God has rescued him, he turns his thoughts with gratitude and praise to all the deliverances which lie in the past.'
  - where: 'thread'
    claim: 'In verse 5 the speaker’s own experience is turned into a general truth'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/34.htm'
    quote: 'his own personal experience is generalised into an experimental truth'

  # ---- sections ----
  - where: 'section 2 plain'
    claim: 'Verse 5: “lightened” is to beam or be radiant'
    key: bdb
    url: 'https://biblehub.com/hebrew/5102.htm'
    quote: 'beam, be radiant, figurative of joy'
  - where: 'section 5 plain'
    claim: 'Verse 18: “contrite” is crushed'
    key: bdb
    url: 'https://biblehub.com/hebrew/1793.htm'
    quote: 'adjective contrite (crushed)'
  - where: 'section 6 plain'
    claim: 'Verses 21–22: “be desolate” is to be held guilty and bear the punishment'
    key: bdb
    url: 'https://biblehub.com/hebrew/816.htm'
    quote: 'be held guilty, bear punishment Psalm 34:22; Psalm 34:23'

  # ---- note 34:0 ----
  - where: 'note 34:0 “David before the king of Gath”'
    claim: 'David fled from Saul to Achish king of Gath, was recognized, and was afraid'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/21?lang=eng'
    quote: 'And David laid up these words in his heart, and was sore afraid of Achish the king of Gath.'
  - where: 'note 34:0 “David before the king of Gath”'
    claim: 'The narrative uses the title’s own phrase, “changed his behaviour,” and says he feigned madness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/21?lang=eng'
    quote: 'And he changed his behaviour before them, and feigned himself mad in their hands, and scrabbled on the doors of the gate, and let his spittle fall down upon his beard.'
  - where: 'note 34:0 “David before the king of Gath”'
    claim: 'The Hebrew noun behind “behaviour” in 1 Samuel 21:13 is ta‘am'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'טַעְמ/וֹ֙'
  - where: 'note 34:0 “David before the king of Gath”'
    claim: 'The noun means judgment or sense, and the phrase in both places is “to change, disguise one’s judgement, sense,” of David feigning madness'
    key: bdb
    url: 'https://biblehub.com/hebrew/2940.htm'
    quote: 'change, disguise one''s judgement, sense 1 Samuel 21:13; Psalm 34:1, of David feigning madness'
  - where: 'note 34:0 “David before the king of Gath”'
    claim: 'A modern translation renders the title “when he feigned madness”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2034&version=NRSVUE'
    quote: 'Of David, when he feigned madness before Abimelech'
  - where: 'note 34:0 “David before the king of Gath”'
    claim: 'The Bible Dictionary identifies the Abimelech of the title with Achish'
    key: bd-abimelech
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abimelech?lang=eng'
    quote: 'In title of Ps. 34 same as Achish (1 Sam. 21:11).'
  - where: 'note 34:0 “David before the king of Gath”'
    claim: 'One older reading takes Abimelech as the title of the Philistine kings, as Pharaoh is of the Egyptian'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/34.htm'
    quote: 'is the title of the Philistine kings, just as Pharaoh is title of the Egyptian'
  - where: 'note 34:0 “David before the king of Gath”'
    claim: 'The title of Psalm 56 places that psalm in Gath as well'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/56?lang=eng'
    quote: 'when the Philistines took him in Gath'

  # ---- note 34:5 ----
  - where: 'note 34:5 “Faces made radiant”'
    claim: 'The verb behind “were lightened” means to beam or be radiant, a figure of joy, and occurs in this sense here and in Isaiah 60:5'
    key: bdb
    url: 'https://biblehub.com/hebrew/5102.htm'
    quote: 'beam, be radiant, figurative of joy: ׳תִּרְאִי וְנ Isaiah 60:5, ׳הִבִּיטוּ אֵלָיו וְנ Psalm 34:6'
  - where: 'note 34:5 “Faces made radiant”'
    claim: 'The Hebrew verb in verse 5'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וְ/נָהָ֑רוּ'
  - where: 'note 34:5 “Faces made radiant”'
    claim: 'Isaiah 60:5 has the same verb, where the King James Version has “flow together”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'וְ/נָהַ֔רְתְּ'
  - where: 'note 34:5 “Faces made radiant”'
    claim: 'The Greek makes the verse a command addressed to the hearers, with “your faces”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/34.htm'
    quote: 'Draw near to him, and be enlightened: and your faces shall not by any means be ashamed.'
  - where: 'note 34:5 “Faces made radiant”'
    claim: 'A modern translation follows the Greek, Syriac and Jerome with “your” where the Hebrew has “their”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2034&version=NRSVUE'
    quote: '34.5 Gk Syr Jerome: Heb their'
  - where: 'note 34:5 “Faces made radiant”'
    claim: 'The modern translation’s wording of the verse'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2034&version=NRSVUE'
    quote: 'Look to him, and be radiant'

  # ---- note 34:7 ----
  - where: 'note 34:7 “One angel, camped like an army”'
    claim: 'One reading takes the angel as a single figure, the one who dealt with the patriarchs and went with Israel to Canaan, and not as a collective'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/34.htm'
    quote: 'is none other than He who was the medium of Jahve''s intercourse with the patriarchs, and who accompanied Israel to Canaan. This name is not collective'
  - where: 'note 34:7 “One angel, camped like an army”'
    claim: 'On that reading he can encamp around them as captain of the LORD’s host, with a host of angels under him'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/34.htm'
    quote: 'in so far as He is the Captain of the host of Jahve (Joshua 5:14), and consequently is accompanied by a host of inferior ministering angels'
  - where: 'note 34:7 “One angel, camped like an army”'
    claim: 'The same reading gives a second way: as a spirit not limited by space he can protect on every side'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/34.htm'
    quote: 'or insofar as He can, as being a spirit not limited by space, furnish protection that covers them on every side'
  - where: 'note 34:7 “One angel, camped like an army”'
    claim: 'The same reading says the verb is perhaps an allusion to Mahanaim, the angel camp that met Jacob'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/34.htm'
    quote: 'is perhaps an allusion to מחנים in Genesis 32:2., that angel-camp which joined itself to Jacob''s camp'
  - where: 'note 34:7 “One angel, camped like an army”'
    claim: 'In some Old Testament passages the angel of the Lord speaks as the voice of God Himself'
    key: bd-angels
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/angels?lang=eng'
    quote: 'In some passages the “angel of the Lord” speaks as the voice of God Himself (Gen. 22:11–12).'
  - where: 'note 34:7 “One angel, camped like an army”'
    claim: 'A modern translation sets 2 Kings 6:17 beside the verse'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2034&version=NRSVUE'
    quote: '34.7 : 2 Kings 6.17; Dan 6.22'

  # ---- note 34:8 ----
  - where: 'note 34:8 “Taste, and the word in the title”'
    claim: 'The verb means to taste and, figuratively, to perceive'
    key: bdb
    url: 'https://biblehub.com/hebrew/2938.htm'
    quote: 'verb taste, perceive'
  - where: 'note 34:8 “Taste, and the word in the title”'
    claim: 'The Hebrew verb in verse 8'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'טַעֲמ֣וּ'
  - where: 'note 34:8 “Taste, and the word in the title”'
    claim: 'The noun in the title (“behaviour”) is the noun of this verb: taste, and figuratively judgment or discernment (the derivation is the Strong’s line on the lexicon page)'
    key: bdb
    url: 'https://biblehub.com/hebrew/2940.htm'
    quote: 'figurative judgement, discretion, discernment'
  - where: 'note 34:8 “Taste, and the word in the title”'
    claim: 'The same page derives the noun from the verb “taste”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2940.htm'
    quote: 'from H2938'
  - where: 'note 34:8 “Taste, and the word in the title”'
    claim: 'Helaman 12:1 is listed among the Book of Mormon’s allusions to the Psalms, for this verse'
    key: hilton-psalms-bom
    url: 'https://rsc.byu.edu/ascending-mountain-lord/old-testament-psalms-book-mormon'
    quote: 'Case 15 Psalm 34:8 Helaman 12:1 See that the Lord . . . good . . . bless . . . trust in him'
  - where: 'note 34:8 “Taste, and the word in the title”'
    claim: 'The list is of proposed textual allusions'
    key: hilton-psalms-bom
    url: 'https://rsc.byu.edu/ascending-mountain-lord/old-testament-psalms-book-mormon'
    quote: 'I have proposed forty-three instances in which there may be textual allusions to the Psalms within the Book of Mormon.'
  - where: 'note 34:8 “Taste, and the word in the title”'
    claim: 'Peter uses the words of verse 8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/2?lang=eng'
    quote: 'If so be ye have tasted that the Lord is gracious.'
  - where: 'note 34:8 “Taste, and the word in the title”'
    claim: 'The Church’s heading to 1 Peter 2 says that Christ is the chief cornerstone'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/2?lang=eng'
    quote: 'Converts are newborn babes in Christ—He is the chief cornerstone'

  # ---- note 34:10 ----
  - where: 'note 34:10 “The want that Psalm 23 denies”'
    claim: '“Want” in verse 9 is a noun meaning need or poverty'
    key: bdb
    url: 'https://biblehub.com/hebrew/4270.htm'
    quote: 'noun [masculine] need, thing needed, poverty'
  - where: 'note 34:10 “The want that Psalm 23 denies”'
    claim: 'The noun in verse 9'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מַ֝חְס֗וֹר'
  - where: 'note 34:10 “The want that Psalm 23 denies”'
    claim: 'The noun is from the verb “to lack” (the Strong’s line on the lexicon page)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4270.htm'
    quote: 'from H2637'
  - where: 'note 34:10 “The want that Psalm 23 denies”'
    claim: '“Shall not want” in verse 10 is that verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יַחְסְר֥וּ'
  - where: 'note 34:10 “The want that Psalm 23 denies”'
    claim: 'Psalm 23:1, “I shall not want,” has the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֶחְסָֽר'
  - where: 'note 34:10 “The want that Psalm 23 denies”'
    claim: 'A modern translation sets Psalm 23:1 beside verse 9'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2034&version=NRSVUE'
    quote: '34.9 : Ps 23.1'
  - where: 'note 34:10 “The want that Psalm 23 denies”'
    claim: 'The Greek has “the rich” where the Hebrew has young lions'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/34.htm'
    quote: 'The rich have become poor and hungry: but they that seek the Lord diligently shall not want any good thing.'

  # ---- note 34:12 ----
  - where: 'note 34:12 “The lesson Peter quotes”'
    claim: 'Peter quotes verses 12–16, turning the question into a statement'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/3?lang=eng'
    quote: 'For he that will love life, and see good days, let him refrain his tongue from evil, and his lips that they speak no guile'
  - where: 'note 34:12 “The lesson Peter quotes”'
    claim: 'Peter’s quotation ends with the face of the Lord against evildoers and leaves out the cutting off of their remembrance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/3?lang=eng'
    quote: 'For the eyes of the Lord are over the righteous, and his ears are open unto their prayers: but the face of the Lord is against them that do evil.'
  - where: 'note 34:12 “The lesson Peter quotes”'
    claim: 'Peter is writing to Saints who may suffer for righteousness’ sake, and has just told them not to return evil for evil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/3?lang=eng'
    quote: 'Not rendering evil for evil, or railing for railing: but contrariwise blessing'

  # ---- note 34:18 ----
  - where: 'note 34:18 “The Book of Mormon’s phrase”'
    claim: 'The phrases “broken heart” and “contrite spirit” appear together only once in the Bible, in this verse; the four words together only here and in Psalm 51:17'
    key: hilton-psalms-bom
    url: 'https://rsc.byu.edu/ascending-mountain-lord/old-testament-psalms-book-mormon'
    quote: 'they appear together only once in the Bible. Furthermore, within the Bible, the four words broken, heart, contrite, and spirit only appear together in Psalms 34:18 and 51:17.'
  - where: 'note 34:18 “The Book of Mormon’s phrase”'
    claim: 'The Book of Mormon and Doctrine and Covenants passages listed as using the phrase of this verse'
    key: hilton-psalms-bom
    url: 'https://rsc.byu.edu/ascending-mountain-lord/old-testament-psalms-book-mormon'
    quote: 'Case 16 Psalm 34:18 2 Nephi 2:7; 3 Nephi 9:20, 12:19; Mormon 2:14; Ether 4:15; Moroni 6:2 Broken heart . . . contrite spirit D&C 20:37; 59:8'
  - where: 'note 34:18 “The Book of Mormon’s phrase”'
    claim: 'The teaching is found in the Psalms and may have been on the plates of brass'
    key: sc-knowhy-198
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-tell-all-people-to-sacrifice-a-broken-heart-and-a-contrite-spirit'
    quote: 'the teaching can be found in the Old Testament, especially in the Psalms, and thus may have been included on the plates of brass that Lehi’s family obtained in Jerusalem'
  - where: 'note 34:18 “The Book of Mormon’s phrase”'
    claim: 'The adjective behind “contrite” means crushed and occurs in Isaiah 57:15 and here'
    key: bdb
    url: 'https://biblehub.com/hebrew/1793.htm'
    quote: 'adjective contrite (crushed) — דַּכָּא Isaiah 57:15; דַּכְּאֵי Psalm 34:19'
  - where: 'note 34:18 “The Book of Mormon’s phrase”'
    claim: '“Broken” in verse 18 is the verb shavar'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לְ/נִשְׁבְּרֵי'
  - where: 'note 34:18 “The Book of Mormon’s phrase”'
    claim: '“Broken” in verse 20 is the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'נִשְׁבָּֽרָה'

  # ---- note 34:20 ----
  - where: 'note 34:20 “A bone of him shall not be broken”'
    claim: 'One reading takes the unbroken bones as a picture of the thought that God does not let the righteous come to the last extremity'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/34.htm'
    quote: 'a pictorial exemplification of the thought that God does not suffer the righteous to come to the extremity'
  - where: 'note 34:20 “A bone of him shall not be broken”'
    claim: 'The same reading holds that the scripture John quotes may be referred to this psalm as well as to Exodus 12:46'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/34.htm'
    quote: 'the Old Testament prophecy, which is quoted in John 19:33-37, may be just as well referred to our Psalm as to Exodus 12:46'
  - where: 'note 34:20 “A bone of him shall not be broken”'
    claim: 'Elder James E. Talmage wrote that Christ, the great Passover sacrifice, died without a bone broken, as was prescribed for the paschal lambs'
    key: talmage-jesus-christ-35
    url: 'https://www.churchofjesuschrist.org/study/manual/jesus-the-christ/chapter-35?lang=eng'
    quote: 'Christ, the great Passover sacrifice, of whom all altar victims had been but suggestive prototypes, died through violence yet without a bone of His body being broken, as was a prescribed condition of the slain paschal lambs.'
  - where: 'note 34:20 “A bone of him shall not be broken”'
    claim: 'The Church’s chapter heading reads the verse of the Messiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/34?lang=eng'
    quote: 'He says that not one of the Messiah’s bones will be broken'
  - where: 'note 34:20 “A bone of him shall not be broken”'
    claim: 'John’s account: the soldiers did not break His legs, and John cites a scripture fulfilled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/19?lang=eng'
    quote: 'For these things were done, that the scripture should be fulfilled, A bone of him shall not be broken.'

  # ---- note 34:22 ----
  - where: 'note 34:22 “Desolate, or held guilty”'
    claim: 'The verb means to be held guilty and bear punishment, and the lexicon lists both verses under that sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/816.htm'
    quote: 'be held guilty, bear punishment Psalm 34:22; Psalm 34:23'
  - where: 'note 34:22 “Desolate, or held guilty”'
    claim: 'The verb in verse 21'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יֶאְשָֽׁמוּ'
  - where: 'note 34:22 “Desolate, or held guilty”'
    claim: 'The same verb in verse 22'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יֶ֝אְשְׁמ֗וּ'
  - where: 'note 34:22 “Desolate, or held guilty”'
    claim: 'A modern translation has “condemned” in both verses'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2034&version=NRSVUE'
    quote: 'none of those who take refuge in him will be condemned'
  - where: 'note 34:22 “Desolate, or held guilty”'
    claim: 'Verse 21 begins with tav, the last letter of the alphabet'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תְּמוֹתֵ֣ת'
  - where: 'note 34:22 “Desolate, or held guilty”'
    claim: 'Verse 22 begins with pe'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'פּוֹדֶ֣ה'
  - where: 'note 34:22 “Desolate, or held guilty”'
    claim: 'Verse 16 also begins with pe'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'פְּנֵ֣י'

  # ---- christ ----
  - where: 'christ'
    claim: 'The Church’s chapter heading reads verse 20 of the Messiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/34?lang=eng'
    quote: 'He says that not one of the Messiah’s bones will be broken'
  - where: 'christ'
    claim: 'The promises to the righteous are fulfilled in Christ as the righteous One in the fullest sense'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/34.htm'
    quote: 'because He is the righteous One in the most absolute sense'
  - where: 'christ'
