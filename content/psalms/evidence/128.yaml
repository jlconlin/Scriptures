chapter: 128
claims:
  # ---------- when ----------
  - where: 'when'
    claim: 'The title is “A Song of degrees” and names no author'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/128-1.htm'
    quote: '{{A Song of degrees. }} Blessed [is] every one that feareth the LORD; that walketh in his ways.'

  # ---------- setting ----------
  - where: 'setting'
    claim: 'The songs of degrees are fifteen psalms, 120–134, probably sung by pilgrims going up to Jerusalem'
    key: bd-degrees-songs-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/degrees-songs-of?lang=eng'
    quote: 'Fifteen Psalms (120–34), probably so called because they were sung by Jewish pilgrims on their way up to Jerusalem.'
  - where: 'setting'
    claim: 'Psalm 127 opens with the house built in vain unless the LORD builds it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/127?lang=eng'
    quote: 'Except the Lord build the house, they labour in vain that build it: except the Lord keep the city, the watchman waketh but in vain.'
  - where: 'setting'
    claim: 'Psalm 127 calls children a heritage of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/127?lang=eng'
    quote: 'Lo, children are an heritage of the Lord: and the fruit of the womb is his reward.'
  - where: 'setting'
    claim: 'Psalm 127 ends with the word that begins Psalm 128, and the two were placed together for that reason, in one older reading'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/128.htm'
    quote: 'In both instances they are Psalms placed together, of which one begins with ashrê and one ends with ashrê. In other respects Psalm 128:1-6 and Psalm 127:1-5 supplement one another.'
  - where: 'setting'
    claim: 'One older reading: Psalm 127 shows what makes a man happy as a gift, Psalm 128 as a reward'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/128.htm'
    quote: 'That which makes man happy is represented in Psalm 127:1-5 as a gift coming as a blessing, and in Psalm 128:1-6 as a reward coming as a blessing'
  - where: 'thread'
    claim: 'One older reading: the blessing of the individual comes from God who dwells in Zion and is completed in the prosperity of the city and the whole people'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/128.htm'
    quote: 'Every blessing the individual enjoys comes from the God of salvation, who has taken up His abode in Zion, and is perfected in participation in the prosperity of the holy city and of the whole church'
  - where: 'setting'
    claim: 'Psalm 112 opens with nearly the same sentence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/112?lang=eng'
    quote: 'Praise ye the Lord. Blessed is the man that feareth the Lord, that delighteth greatly in his commandments.'

  # ---------- sections ----------
  - where: 'section 1 plain'
    claim: 'The rendering “Happy is everyone” for “Blessed is every one” follows a modern translation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20128&version=NRSVUE'
    quote: 'Happy is everyone who fears the Lord'
  - where: 'section 1 plain'
    claim: 'The rendering “within your house” for “by the sides of thine house,” and young olive trees for “olive plants,” follows a modern translation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20128&version=NRSVUE'
    quote: 'within your house; your children will be like olive shoots around your table.'
  - where: 'section 2 plain'
    claim: 'The closing words are a wish, “Peace be upon Israel”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20128&version=NRSVUE'
    quote: 'Peace be upon Israel!'

  # ---------- note 128:1 ----------
  - where: 'note 128:1 “Blessed and happy are one word here; the blessing of verse 4 is another”'
    claim: '“Blessed” in verse 1 is Strong’s 835'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/128-1.htm'
    quote: '835 [e] ’aš·rê'
  - where: 'note 128:1 “Blessed and happy are one word here; the blessing of verse 4 is another”'
    claim: '“happy” in verse 2 is the same word, Strong’s 835, with a suffix'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/128-2.htm'
    quote: '835 [e] ’aš·re·ḵā'
  - where: 'note 128:1 “Blessed and happy are one word here; the blessing of verse 4 is another”'
    claim: '“blessed” in verse 4 is a different word, the verb Strong’s 1288, in the passive'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/128-4.htm'
    quote: '1288 [e] yə·ḇō·raḵ'
  - where: 'note 128:1 “Blessed and happy are one word here; the blessing of verse 4 is another”'
    claim: '“shall bless thee” in verse 5 is the same verb, Strong’s 1288, with the LORD as subject'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/128-5.htm'
    quote: '1288 [e] yə·ḇā·reḵ·ḵā'
  - where: 'note 128:1 “Blessed and happy are one word here; the blessing of verse 4 is another”'
    claim: 'The word of verses 1–2 is an exclamation, “O happiness, blessedness of,” and it stands at Psalms 1:1, 127:5 and 128:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/835.htm'
    quote: 'abstract intensive exclamation O happiness, blessedness of'
  - where: 'note 128:1 “Blessed and happy are one word here; the blessing of verse 4 is another”'
    claim: 'The lexicon lists Psalm 127:5 and Psalm 1:1 under the same word'
    key: bdb
    url: 'https://biblehub.com/hebrew/835.htm'
    quote: 'Psalm 34:9; Psalm 40:5; Psalm 94:12; Psalm 127:5; (הָ)אִישׁ Psalm 1:1; Psalm 112:1'
  - where: 'note 128:1 “Blessed and happy are one word here; the blessing of verse 4 is another”'
    claim: 'A modern translation has “Happy” in verse 1'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20128&version=NRSVUE'
    quote: 'Happy is everyone who fears the Lord'
  - where: 'note 128:1 “Blessed and happy are one word here; the blessing of verse 4 is another”'
    claim: 'A modern translation has “happy” in verse 2 as well'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20128&version=NRSVUE'
    quote: 'you shall be happy, and it shall go well with you.'
  - where: 'note 128:1 “Blessed and happy are one word here; the blessing of verse 4 is another”'
    claim: 'Psalm 1 opens with “Blessed is the man”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/1?lang=eng'
    quote: 'Blessed is the man that walketh not in the counsel of the ungodly'

  # ---------- note 128:2 ----------
  - where: 'note 128:2 “Eating what your own hands have earned”'
    claim: 'Leviticus 26, the chapter of the covenant’s blessings and curses, threatens that enemies will eat what Israel sows'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'ye shall sow your seed in vain, for your enemies shall eat it.'
  - where: 'note 128:2 “Eating what your own hands have earned”'
    claim: 'Deuteronomy 28 sets blessings for obedience beside curses, among them a vineyard planted and not harvested'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: 'thou shalt plant a vineyard, and shalt not gather the grapes thereof.'
  - where: 'note 128:2 “Eating what your own hands have earned”'
    claim: 'Deuteronomy 28:33: a foreign nation eats Israel’s labours'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: 'The fruit of thy land, and all thy labours, shall a nation which thou knowest not eat up'
  - where: 'note 128:2 “Eating what your own hands have earned”'
    claim: 'Isaiah 65:22 promises the Lord’s people the work of their hands'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/65?lang=eng'
    quote: 'They shall not build, and another inhabit; they shall not plant, and another eat: for as the days of a tree are the days of my people, and mine elect shall long enjoy the work of their hands.'
  - where: 'note 128:2 “Eating what your own hands have earned”'
    claim: 'An older commentary reads the verse against the passages where enemies are to devour the harvests, Deuteronomy 28:30–33 and Leviticus 26:16'
    key: ellicott-psalms
    url: 'https://biblehub.com/commentaries/psalms/128-2.htm'
    quote: 'is rendered still more emphatic by references to the numerous passages where it is foretold that enemies would devour the harvests (Deuteronomy 28:30-33; Leviticus 26:16).'
  # ---------- note 128:3 ----------
  - where: 'note 128:3 “A vine inside the house, olive shoots around the table”'
    claim: 'The Hebrew word behind “sides” means the recess or innermost part, and the lexicon places Psalm 128:3 under “a house”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3411.htm'
    quote: 'figurative angle, recess, extreme parts: as recesses of Mt. Ephraim Judges 19:1,18; of Lebanon 2 Kings 19:23 = Isaiah 37:24; of recesses or innermost part of a cave 1 Samuel 24:4; a house Amos 6:10; Psalm 128:3'
  - where: 'note 128:3 “A vine inside the house, olive shoots around the table”'
    claim: 'A modern translation has “within your house” and “olive shoots”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20128&version=NRSVUE'
    quote: 'within your house; your children will be like olive shoots around your table.'
  - where: 'note 128:3 “A vine inside the house, olive shoots around the table”'
    claim: 'One older reading: the phrase does not belong to the vine image but means the privacy of the house'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/128.htm'
    quote: 'does not belong to the figure, as Kimchi is of opinion, who thinks of a vine starting out of the room and climbing up in the open air outside. What is meant is the angle, corner, or nook … the background, the privacy of the house'
  - where: 'note 128:3 “A vine inside the house, olive shoots around the table”'
    claim: 'One older reading: the olive shoots are young trees, and the image is of promise'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/128.htm'
    quote: 'thus fresh as young layered small olive-trees and thus promising are they.'
  # ---------- note 128:5 ----------
  - where: 'note 128:5 “The blessing comes from Zion”'
    claim: 'A modern translation reads verse 5 as wishes'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20128&version=NRSVUE'
    quote: 'May you see the prosperity of Jerusalem'
  - where: 'note 128:5 “The blessing comes from Zion”'
    claim: 'Psalm 20:2 sets “the sanctuary” parallel to “Zion”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/20?lang=eng'
    quote: 'Send thee help from the sanctuary, and strengthen thee out of Zion;'
  - where: 'note 128:5 “The blessing comes from Zion”'
    claim: 'Psalm 133:3 says the LORD commanded the blessing on Zion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/133?lang=eng'
    quote: 'the mountains of Zion: for there the Lord commanded the blessing, even life for evermore.'
  - where: 'note 128:5 “The blessing comes from Zion”'
    claim: 'Psalm 134, the last song of degrees, closes with “bless thee out of Zion”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/134?lang=eng'
    quote: 'The Lord that made heaven and earth bless thee out of Zion.'
  - where: 'note 128:5 “The blessing comes from Zion”'
    claim: 'Psalm 122:6 joins the peace of Jerusalem and the prospering of those who love her'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/122?lang=eng'
    quote: 'Pray for the peace of Jerusalem: they shall prosper that love thee.'

  # ---------- note 128:6 ----------
  - where: 'note 128:6 “Grandchildren, and a prayer for the whole people”'
    claim: 'Job lived to see his sons’ sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/42?lang=eng'
    quote: 'After this lived Job an hundred and forty years, and saw his sons, and his sons’ sons, even four generations.'
  - where: 'note 128:6 “Grandchildren, and a prayer for the whole people”'
    claim: 'Proverbs calls children’s children the crown of old men'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/17?lang=eng'
    quote: 'Children’s children are the crown of old men; and the glory of children are their fathers.'
  - where: 'note 128:6 “Grandchildren, and a prayer for the whole people”'
    claim: 'The King James supplies “and” before “peace upon Israel” (marked as supplied)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/128-6.htm'
    quote: 'Yea, thou shalt see thy children''s children, [and] peace upon Israel.'
  - where: 'note 128:6 “Grandchildren, and a prayer for the whole people”'
    claim: 'A literal translation sets the closing words off as their own sentence, “Peace on Israel!”, with no “and”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/128-6.htm'
    quote: 'And see the sons of thy sons! Peace on Israel!'
  - where: 'note 128:6 “Grandchildren, and a prayer for the whole people”'
    claim: 'A modern translation prints the closing words as a separate prayer'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20128&version=NRSVUE'
    quote: 'Peace be upon Israel!'
  - where: 'note 128:6 “Grandchildren, and a prayer for the whole people”'
    claim: 'Psalm 125 ends with the same words about peace on Israel, as a promise in the King James'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/125?lang=eng'
    quote: 'the Lord shall lead them forth with the workers of iniquity: but peace shall be upon Israel.'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'The LORD of the Old Testament is Jehovah, the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: 'christ'
    claim: 'Psalm 127 opens by saying that labour without the LORD is vain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/127?lang=eng'
    quote: 'Except the Lord build the house, they labour in vain that build it'

  # ---------- explore / parallels ----------
  - where: 'explore'
    claim: 'Deuteronomy 28 sets blessings for obedience before its curses (chapter heading)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/28?lang=eng'
    quote: 'If the children of Israel are obedient, they will be blessed temporal'
  - where: 'explore'
    claim: 'Leviticus 26 promises blessings to an obedient Israel (chapter heading)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'Temporal and spiritual blessings will abound in Israel if the people'
  - where: 'parallels'
    claim: 'Psalm 134:3 closes the songs of degrees with the blessing out of Zion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/134?lang=eng'
    quote: 'The Lord that made heaven and earth bless thee out of Zion.'
  - where: 'parallels'
    claim: 'Isaiah 65:22: the elect enjoy the work of their hands'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/65?lang=eng'
    quote: 'mine elect shall long enjoy the work of their hands.'
