    key: sc-knowhy-62
    url: 'https://scripturecentral.org/knowhy/why-does-jacob-quote-so-much-from-the-psalms'
    quote: 'Nephi had consecrated Jacob as a temple priest and teacher (2 Nephi 5:26)'
  - where: 'note 95:8 “Jacob and Alma take up the warning”'
    claim: 'An allusion to part of a psalm would recall the rest'
    key: sc-knowhy-62
    url: 'https://scripturecentral.org/knowhy/why-does-jacob-quote-so-much-from-the-psalms'
    quote: 'A shorthand allusion to one part of a psalm would have effectively brought to mind all the rest of the words of that psalm.'
