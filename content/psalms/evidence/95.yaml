    url: 'https://biblehub.com/commentaries/cambridge/psalms/95.htm'
    quote: 'The A.V. follows the LXX in taking this clause as the protasis to Psalm 95:8. But here the Psalmist is still speaking (‘his voice’), while in Psalm 95:8 God speaks; and it is better to take it as a wish'
  - where: 'note 95:7 “The turn, from the singers’ call to God’s own voice”'
    claim: 'A modern translation prints the clause as a wish'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2095&version=NRSVUE'
