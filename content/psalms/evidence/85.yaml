    quote: 'יְבוּלָ֔/הּ'

  # ---- note 85:11 (second) ----
  - where: 'note 85:11 “The Lord’s words to Enoch, and the Book of Mormon”'
    claim: 'Moses 7:62–63 takes up Psalm 85:10–11'
    key: sc-evidence-534
    url: 'https://scripturecentral.org/evidence/intertextuality-with-1-enoch-and-psalm-85'
    quote: 'In Moses 7:62–63, readers encounter an instance of strong multi-layer intertextuality with Psalm 85:10–11.'
  - where: 'note 85:11 “The Lord’s words to Enoch, and the Book of Mormon”'
    claim: 'The two phrases of Psalm 85:11 are inverted in Moses 7:62'
    key: sc-evidence-534
    url: 'https://scripturecentral.org/evidence/intertextuality-with-1-enoch-and-psalm-85'
    quote: 'are inverted and rendered slightly differently in Moses 7:62'
  - where: 'note 85:11 “The Lord’s words to Enoch, and the Book of Mormon”'
    claim: 'Moses has “send down” where the psalm has “look down”'
    key: sc-evidence-534
