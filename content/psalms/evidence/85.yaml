chapter: 85
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The title names the sons of Korah and gives no occasion or date'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/85?lang=eng'
    quote: 'To the chief Musician, A Psalm for the sons of Korah.'

  # ---- setting ----
  - where: 'setting'
    claim: 'The chapter heading in the Church’s edition identifies the truth out of the earth as the Book of Mormon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/85?lang=eng'
    quote: 'Truth will spring out of the earth (the Book of Mormon), and righteousness will look down from heaven.'
  - where: 'setting'
    claim: 'One older reading takes verses 1–3 as the words of a people returned from exile'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/85.htm'
    quote: 'certainly sound as though they came from the lips of a people restored to their fatherland'
  - where: 'setting'
    claim: 'On that reading the prayer comes from a time when the promised restoration had not arrived'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/85.htm'
    quote: 'the distance between the temporal and spiritual condition of Israel and the national restoration, promised together with the termination of the Exile, made itself distinctly felt'
  - where: 'setting'
    claim: 'Moses 7:62 has the pair of Psalm 85:11, righteousness from heaven and truth out of the earth'
    key: sc-evidence-534
    url: 'https://scripturecentral.org/evidence/intertextuality-with-1-enoch-and-psalm-85'
    quote: 'In Moses 7:62–63, readers encounter an instance of strong multi-layer intertextuality with Psalm 85:10–11.'
  - where: 'setting'
    claim: 'One older reading calls the psalm’s allegory Isaiah’s manner and names Isaiah 45:8'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/85.htm'
    quote: 'are mentioned under a charming allegory exactly after Isaiah''s manner, Isaiah 32:16., Isaiah 45:8; Isaiah 59:14'

  # ---- thread ----
  - where: 'thread'
    claim: 'The six verbs of verses 1–3 are perfects and have been read as a remembrance of the past'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/85.htm'
    quote: 'The six perfects are a remembrance of former events, since nothing precedes to modify them.'
  - where: 'thread'
    claim: 'The verb shub (Strong’s 7725) occurs five times in the psalm; first in verse 1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שַׁ֝֗בְתָּ'
  - where: 'thread'
    claim: 'The verb shub in verse 8, the fifth occurrence, with the people as subject'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יָשׁ֥וּבוּ'
  - where: 'thread'
    claim: 'A modern translation’s cross-references set Habakkuk 2:1 beside verse 8'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2085&version=NRSVUE'
    quote: '85.8 : Hab 2.1; Zech 7.9'
  - where: 'thread'
    claim: 'The final verse has the LORD present and walking in the land'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/85.htm'
    quote: 'Jahve Himself is present in the land'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: 'A modern translation renders “brought back the captivity” as restoring fortunes'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2085&version=NRSVUE'
    quote: 'you restored the fortunes of Jacob'
  - where: 'section 2 plain'
    claim: 'In verse 6 the Greek keeps the verb “turn” that the King James renders “again”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/85.htm'
    quote: 'O God, thou wilt turn and quicken us'
  - where: 'section 4 plain'
    claim: 'The verb of “look down” means to lean over and look'
    key: bdb
    url: 'https://biblehub.com/hebrew/8259.htm'
    quote: 'lean over (and look)'
  - where: 'section 4 plain'
    claim: 'A modern translation renders the last line as making a path for His steps'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2085&version=NRSVUE'
    quote: 'and will make a path for his steps'

  # ---- note 85:1 ----
  - where: 'note 85:1 “A restoration already behind them”'
    claim: 'The lexicon lists the set phrase “restore the captivity of”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7622.htm'
    quote: 'in phrase restore the captivity of'
  - where: 'note 85:1 “A restoration already behind them”'
    claim: 'The lexicon has a group of uses of the phrase said of Israel or Judah'
    key: bdb
    url: 'https://biblehub.com/hebrew/7622.htm'
    quote: 'a. of Israel (or Judah)'
  - where: 'note 85:1 “A restoration already behind them”'
    claim: 'Psalm 85:1 (Hebrew 85:2) is in that group, with Psalm 14:7'
    key: bdb
    url: 'https://biblehub.com/hebrew/7622.htm'
    quote: 'Psalm 14:7 = Psalm 53:7; Psalm 85:2'
  - where: 'note 85:1 “A restoration already behind them”'
    claim: 'A modern translation renders the phrase “restored the fortunes”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2085&version=NRSVUE'
    quote: 'you restored the fortunes of Jacob'
  - where: 'note 85:1 “A restoration already behind them”'
    claim: 'Its cross-references set Jeremiah 30:18 and Ezekiel 39:25 beside verse 1'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2085&version=NRSVUE'
    quote: '85.1 : Jer 30.18; Ezek 39.25'
  - where: 'note 85:1 “A restoration already behind them”'
    claim: 'One older reading takes the phrase literally here, of the end of a national judgment'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/85.htm'
    quote: 'here said of a cessation of a national judgment, seems to be meant literally, not figuratively'
  - where: 'note 85:1 “A restoration already behind them”'
    claim: 'On that reading verses 1–3 sound like a people restored to their land'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/85.htm'
    quote: 'certainly sound as though they came from the lips of a people restored to their fatherland'
  - where: 'note 85:1 “A restoration already behind them”'
    claim: 'On that reading, assuming a date after the exile, the psalm comes from a time when the promised restoration fell short'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/85.htm'
    quote: 'it was composed at a period in which the distance between the temporal and spiritual condition of Israel and the national restoration, promised together with the termination of the Exile, made itself distinctly felt'
  - where: 'note 85:1 “A restoration already behind them”'
    claim: 'The same commentary reports the view that the psalm has no historical occasion'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/85.htm'
    quote: 'Hengstenberg maintains that "the Psalm does not admit of any historical interpretation,"'

  # ---- note 85:4 ----
  - where: 'note 85:4 “Five turnings”'
    claim: 'Verse 1: the verb shub (Strong’s 7725), “brought back”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שַׁ֝֗בְתָּ'
  - where: 'note 85:4 “Five turnings”'
    claim: 'Verse 3: the same verb, in its causative form, “turned thyself”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הֱ֝שִׁיב֗וֹתָ'
  - where: 'note 85:4 “Five turnings”'
    claim: 'Verse 4: the same verb as an imperative with “us” attached'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שׁ֭וּבֵ/נוּ'
  - where: 'note 85:4 “Five turnings”'
    claim: 'Verse 6: the same verb, rendered “again” in the King James'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תָּשׁ֣וּב'
  - where: 'note 85:4 “Five turnings”'
    claim: 'Verse 8: the same verb, third person plural, of the people'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יָשׁ֥וּבוּ'
  - where: 'note 85:4 “Five turnings”'
    claim: 'The lexicon sets verse 4 (Hebrew 85:5) with the idiom of restoring captivity, the verb with a personal suffix'
    key: bdb
    url: 'https://biblehub.com/hebrew/7725.htm'
    quote: 'with suffix person Psalm 85:5'
  - where: 'note 85:4 “Five turnings”'
    claim: 'A modern translation renders verse 4 “Restore us again”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2085&version=NRSVUE'
    quote: 'Restore us again, O God of our salvation'
  - where: 'note 85:4 “Five turnings”'
    claim: 'The lexicon lists verse 6 (Hebrew 85:7) under the verb beside another verb, in the sense of reversing one’s action'
    key: bdb
    url: 'https://biblehub.com/hebrew/7725.htm'
    quote: "reverse one's action, + verb Joshua 2:23"
  - where: 'note 85:4 “Five turnings”'
    claim: 'The Greek keeps both verbs in verse 6'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/85.htm'
    quote: 'O God, thou wilt turn and quicken us; and thy people shall rejoice in thee.'

  # ---- note 85:8 ----
  - where: 'note 85:8 “A warning in the Hebrew, a promise in the Greek”'
    claim: 'The Hebrew noun is glossed “stupidity” in this verse, and the lexicon recommends another reading with the Greek'
    key: bdb
    url: 'https://biblehub.com/hebrew/3690.htm'
    quote: 'stupidity Psalm 85:9 (but read'
  - where: 'note 85:8 “A warning in the Hebrew, a promise in the Greek”'
    claim: 'The noun in verse 8 (Strong’s 3690)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לְ/כִסְלָֽה'
  - where: 'note 85:8 “A warning in the Hebrew, a promise in the Greek”'
    claim: 'The lexicon lists the verb in verse 8 (Hebrew 85:9) under returning to a state or course of life'
    key: bdb
    url: 'https://biblehub.com/hebrew/7725.htm'
    quote: 'to a state or course of life'
  - where: 'note 85:8 “A warning in the Hebrew, a promise in the Greek”'
    claim: 'The Greek has a different last clause'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/85.htm'
    quote: 'for he shall speak peace to his people, and to his saints, and to those that turn their heart toward him.'
  - where: 'note 85:8 “A warning in the Hebrew, a promise in the Greek”'
    claim: 'A modern translation adopts the Greek reading'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2085&version=NRSVUE'
    quote: 'to his faithful, to those who turn to him in their hearts'
  - where: 'note 85:8 “A warning in the Hebrew, a promise in the Greek”'
    claim: 'It gives the Hebrew in a footnote'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2085&version=NRSVUE'
    quote: '85.8 Gk: Heb but let them not turn back to folly'
  - where: 'note 85:8 “A warning in the Hebrew, a promise in the Greek”'
    claim: 'Another modern translation keeps the Hebrew (the page prints cross-reference letters inside the line)'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2085&version=ESV'
    quote: 'but let them not (N)turn back to (O)folly'
  - where: 'note 85:8 “A warning in the Hebrew, a promise in the Greek”'
    claim: '“Saints” in verse 8 is hasid (Strong’s 2623)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חֲסִידָ֑י/ו'

  # ---- note 85:9 ----
  - where: 'note 85:9 “Whose glory dwells in the land”'
    claim: '“Glory” in verse 9 has no possessive suffix'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'כָּב֣וֹד'
  - where: 'note 85:9 “Whose glory dwells in the land”'
