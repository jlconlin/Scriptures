    key: bdb
    url: 'https://biblehub.com/hebrew/7931.htm'
    quote: 'location Psalm 85:10'
  - where: 'note 85:9 “Whose glory dwells in the land”'
    claim: 'Exodus 25:8 is listed in the same group'
    key: bdb
    url: 'https://biblehub.com/hebrew/7931.htm'
    quote: 'Exodus 25:8; Exodus 29:46; Numbers 5:3 (all P)'
  - where: 'note 85:9 “Whose glory dwells in the land”'
    claim: 'Exodus 25:8 has the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וְ/שָׁכַנְתִּ֖י'
  - where: 'note 85:9 “Whose glory dwells in the land”'
    claim: 'A modern translation prints “his glory”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2085&version=NRSVUE'
    quote: 'that his glory may dwell in our land'

  # ---- note 85:10 ----
  - where: 'note 85:10 “Four attributes meet like persons”'
    claim: 'The verb in verse 10 means to meet each other, and its use of mercy and truth is figurative'
    key: bdb
    url: 'https://biblehub.com/hebrew/6298.htm'
    quote: 'meet together, each other'
  - where: 'note 85:10 “Four attributes meet like persons”'
    claim: 'The lexicon marks the use in Psalm 85:10 (Hebrew 85:11) as figurative'
    key: bdb
    url: 'https://biblehub.com/hebrew/6298.htm'
    quote: 'figurative of חֶסֶד וֶאֱמֶת Psalm 85:11'
  - where: 'note 85:10 “Four attributes meet like persons”'
    claim: 'Proverbs 22:2 has the same verb in the same form'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Prov.xml'
    quote: 'נִפְגָּ֑שׁוּ'
  - where: 'note 85:10 “Four attributes meet like persons”'
    claim: 'The words of the pair in verse 10 are hesed and emet'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וֶ/אֱמֶ֥ת'
  - where: 'note 85:10 “Four attributes meet like persons”'
    claim: 'The lexicon renders the pair “kindness (lovingkindness) and fidelity” and lists it in psalm after psalm, this verse among them'
    key: bdb
    url: 'https://biblehub.com/hebrew/2617.htm'
    quote: 'kindness (lovingkindness) and fidelity Genesis 24:27'
  - where: 'note 85:10 “Four attributes meet like persons”'
    claim: 'The pair is in Exodus 34:6'
    key: bdb
    url: 'https://biblehub.com/hebrew/571.htm'
    quote: 'abundant in mercy and faithfulness Exodus 34:6'
  - where: 'note 85:10 “Four attributes meet like persons”'
    claim: 'Exodus 34:6 has the same two Hebrew words'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וֶ/אֱמֶֽת'
  - where: 'note 85:10 “Four attributes meet like persons”'
    claim: 'The lexicon calls the pair messengers of God to men in Psalms 57:3, 85:10 and 89:14 (Hebrew numbering in the quote), comparing 43:3'
    key: bdb
    url: 'https://biblehub.com/hebrew/571.htm'
    quote: 'they are messengers of God to men Psalm 57:4; Psalm 85:11; Psalm 89:15 compare Psalm 43:3'
  - where: 'note 85:10 “Four attributes meet like persons”'
    claim: 'A modern translation’s cross-references set Psalm 72:3 beside verse 10'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2085&version=NRSVUE'
    quote: '85.10 : Ps 72.3; Lk 2.14'
  - where: 'note 85:10 “Four attributes meet like persons”'
    claim: 'The Greek tells verses 10–11 in the past'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/85.htm'
    quote: 'Truth has sprung out of the earth; and righteousness has looked down from heaven.'
  - where: 'note 85:10 “Four attributes meet like persons”'
    claim: 'A modern translation tells verses 10–11 in the future'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2085&version=NRSVUE'
    quote: 'Steadfast love and faithfulness will meet'

