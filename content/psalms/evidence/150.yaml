chapter: 150
claims:
  - where: 'when'
    claim: 'The Gospel Library prints no title above Psalm 150; under the chapter heading the text begins with verse 1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/150?lang=eng'
    quote: 'Praise ye the Lord. Praise God in his sanctuary: praise him in the firmament of his power.'
  - where: 'setting'
    claim: 'The book of Psalms is in five sections, each ending in praise'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'The book of Psalms is divided into five sections, each ending with a final expression of praise:'
  - where: 'setting'
    claim: 'Each of Psalms 146–150 ends with hallelujah'
    key: bdb
    url: 'https://biblehub.com/hebrew/1984.htm'
    quote: 'Psalm 146:10; Psalm 147:20; Psalm 148:14; Psalm 149:9; Psalm 150:6'
  - where: 'setting'
    claim: 'Each of Psalms 146–150 begins with hallelujah (hebrew.mjs psalms --word 3050 lists Yah at 146:1, 147:1, 148:1, 149:1 and 150:1, each after the imperative of H1984)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הַ֥לְלוּ'
  - where: 'setting'
    claim: 'Chronicles puts psalteries, harps and cymbals in the hands of the Levites at the temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/5?lang=eng'
    quote: 'Also the Levites which were the singers, all of them of Asaph, of Heman, of Jeduthun, with their sons and their brethren, being arrayed in white linen, having cymbals and psalteries and harps'
  - where: 'thread'
    claim: 'The verb to praise (H1984) occurs thirteen times in the six verses: three in verse 1 and two in each of verses 2–6; ten are imperatives between the opening and closing hallelujah (count from hebrew.mjs psalms 150:1-6)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תְּהַלֵּ֥ל'
  - where: 'thread'
    claim: 'Psalm 146, a neighbor, gives its reasons for praise at length'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/146?lang=eng'
    quote: 'Which executeth judgment for the oppressed: which giveth food to the hungry. The Lord looseth the prisoners:'
  - where: 'section 2 plain'
    claim: '“Excellent greatness” is in Hebrew the abundance of His greatness'
    key: bdb
    url: 'https://biblehub.com/hebrew/7230.htm'
    quote: 'multitude, abundance, greatness'
  - where: 'section 3 plain'
    claim: 'The trumpet is a horn; psaltery and harp are a harp (or lute) and a lyre'
    key: bdb
    url: 'https://biblehub.com/hebrew/5035.htm'
    quote: 'a musical instrument, either a portable harp, or a lute, guitar'
  - where: 'section 3 plain'
    claim: 'The second pair of cymbals are cymbals of teruah, a shout'
    key: bdb
    url: 'https://biblehub.com/hebrew/8643.htm'
    quote: 'shout or blast of war, alarm, or joy'
  - where: 'section 4 plain'
    claim: '“Every thing that hath breath” is every breathing thing'
    key: bdb
    url: 'https://biblehub.com/hebrew/5397.htm'
    quote: 'every breathing thing Deuteronomy 20:16'

  - where: 'note 150:1 “Hallelujah is a command to a congregation”'
    claim: '“Praise ye” is the plural imperative of the verb to praise (hebrew.mjs: H1984, morphology HVpv2mp, Piel imperative second person masculine plural), followed by Yah (H3050)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הַ֥לְלוּ'
  - where: 'note 150:1 “Hallelujah is a command to a congregation”'
    claim: 'Yah is a contracted form of the divine name'
    key: bdb
    url: 'https://biblehub.com/hebrew/3050.htm'
    quote: 'proper name, of deity contracted from'
  - where: 'note 150:1 “Hallelujah is a command to a congregation”'
    claim: 'The lexicon renders the word “praise ye yah”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1984.htm'
    quote: 'note especially: praise ye yah!'
  - where: 'note 150:1 “Hallelujah is a command to a congregation”'
    claim: 'Written as one word, it stands always at the beginning or end of a psalm, chiefly in late psalms, and is apparently liturgical'
    key: bdb
    url: 'https://biblehub.com/hebrew/1984.htm'
    quote: 'always at beginning or end of Psalm (chiefly late), apparently liturgical'
  - where: 'note 150:1 “Hallelujah is a command to a congregation”'
    claim: 'The earliest psalm in the lexicon’s list of hallelujahs is Psalm 104:35 (hebrew.mjs psalms --word 3050: the earlier verses with Yah, 68:4, 68:18, 77:11, 89:8, 94:7, 94:12 and 102:18, are not the word hallelujah)'
    key: bdb
    url: 'https://biblehub.com/hebrew/1984.htm'
    quote: '(2) at end Psalm 104:35 (above), Psalm 105:45; Psalm 106:48; Psalm 113:9'
  - where: 'note 150:1 “Hallelujah is a command to a congregation”'
    claim: 'The last five psalms each end with it'
    key: bdb
    url: 'https://biblehub.com/hebrew/1984.htm'
    quote: 'Psalm 146:10; Psalm 147:20; Psalm 148:14; Psalm 149:9; Psalm 150:6'
  - where: 'note 150:1 “Hallelujah is a command to a congregation”'
    claim: 'The Greek translation does not translate the word but spells it out: Alleluia'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/150.htm'
    quote: 'Alleluia. Praise God in his holy places: praise him in the firmament of his power.'
  - where: 'note 150:1 “Hallelujah is a command to a congregation”'
    claim: 'Hallelujah means “Praise ye the Lord,” and the Bible Dictionary points from the Psalms to Revelation 19:1–6'
    key: bd-hallelujah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hallelujah?lang=eng'
    quote: 'Praise ye the Lord. An expression found at the beginning or the end of a large number of Psalms (see Ps. 146:1; Rev. 19:1–6).'

  - where: 'note 150:1 “The sanctuary and the firmament: one place or two”'
    claim: '“His sanctuary” is in Hebrew “his holy [place]” (H6944 with the preposition in and the suffix his)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בְּ/קָדְשׁ֑/וֹ'
  - where: 'note 150:1 “The sanctuary and the firmament: one place or two”'
    claim: 'The word is used as a place name for the holy place of the tabernacle and the temple'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/150.htm'
    quote: 'of the Tabernacle and of the Temple'
  - where: 'note 150:1 “The sanctuary and the firmament: one place or two”'
    claim: 'The Greek has the plural, “holy places”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/150.htm'
    quote: 'Praise God in his holy places'
  - where: 'note 150:1 “The sanctuary and the firmament: one place or two”'
    claim: '“Firmament” is the word of Genesis 1:6 (H7549), the vault of heaven'
    key: bdb
    url: 'https://biblehub.com/hebrew/7549.htm'
    quote: 'the vault of heaven, or'
  - where: 'note 150:1 “The sanctuary and the firmament: one place or two”'
    claim: 'One older reading takes both halves of the verse of heaven'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/150.htm'
    quote: 'designate that which is heavenly, belonging to the other world, as an object of praise'
  - where: 'note 150:1 “The sanctuary and the firmament: one place or two”'
    claim: 'The lexicon lists the command of Psalm 150:1 with Psalm 148’s summons to angels, sun and moon'
    key: bdb
    url: 'https://biblehub.com/hebrew/1984.htm'
    quote: 'summons to angles, sun, moon, etc. (all created things) to praise'
  - where: 'note 150:1 “The sanctuary and the firmament: one place or two”'
    claim: 'The same list sets Psalm 150:1 after Psalm 148:2–4 and puts the commands of verses 2–5 under temple worship'
    key: bdb
    url: 'https://biblehub.com/hebrew/1984.htm'
    quote: 'Psalm 148:4; Psalm 150:1; of temple-worship Psalm 150:2'

  - where: 'note 150:2 “The psalm’s only reasons: what God has done and what He is”'
    claim: '“Mighty acts” is a plural, the mighty deeds of God, a word found also at Deuteronomy 3:24, Psalm 106:2 and Psalm 145:4'
    key: bdb
    url: 'https://biblehub.com/hebrew/1369.htm'
    quote: 'mighty deeds of God Deuteronomy 3:24; Psalm 20:7; Psalm 71:16; Psalm 106:2; Psalm 145:4'
  - where: 'note 150:2 “The psalm’s only reasons: what God has done and what He is”'
    claim: 'The word behind “excellent” means multitude or abundance'
    key: bdb
    url: 'https://biblehub.com/hebrew/7230.htm'
    quote: 'multitude, abundance, greatness'
  - where: 'note 150:2 “The psalm’s only reasons: what God has done and what He is”'
    claim: 'The Greek reads “according to his abundant greatness”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/150.htm'
    quote: 'praise him according to his abundant greatness'
  - where: 'note 150:2 “The psalm’s only reasons: what God has done and what He is”'
    claim: 'The two halves of verse 2 have different prepositions; the first means on account of'
    key: bdb
    url: 'https://biblehub.com/hebrew/1984.htm'
    quote: 'on account of) Psalm 150:2'

  - where: 'note 150:3 “The horn and the temple’s instruments”'
    claim: 'The “trumpet” is the shofar (H7782)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שׁוֹפָ֑ר'
  - where: 'note 150:3 “The horn and the temple’s instruments”'
    claim: 'The shofar is a curved animal horn'
    key: bdb
    url: 'https://biblehub.com/hebrew/7782.htm'
    quote: 'is a curved horn, as of cow or ram'
  - where: 'note 150:3 “The horn and the temple’s instruments”'
    claim: 'The horn was mostly an instrument of war and only rarely, and chiefly late, a sacred one'
    key: bdb
    url: 'https://biblehub.com/hebrew/7782.htm'
    quote: 'horn, mostly as used in war, rarely, and chiefly late, as sacred instrument'
  - where: 'note 150:3 “The horn and the temple’s instruments”'
    claim: 'The silver trumpets of Numbers 10:2 are a different Hebrew word (H2689)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'חֲצֽוֹצְרֹ֣ת'
  - where: 'note 150:3 “The horn and the temple’s instruments”'
    claim: 'The trumpet at Sinai in Exodus 19:16 is the shofar (H7782)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'שֹׁפָ֖ר'
  - where: 'note 150:3 “The horn and the temple’s instruments”'
    claim: 'The trumpet of 2 Samuel 6:15 is the shofar'
    key: bdb
    url: 'https://biblehub.com/hebrew/7782.htm'
    quote: '2 Samuel 6:15 +'
  - where: 'note 150:3 “The horn and the temple’s instruments”'
    claim: 'The “psaltery” (nebel) is a harp or lute'
    key: bdb
    url: 'https://biblehub.com/hebrew/5035.htm'
    quote: 'a musical instrument, either a portable harp, or a lute, guitar'
  - where: 'note 150:3 “The horn and the temple’s instruments”'
    claim: 'The “harp” (kinnor) is a lyre'
    key: bdb
    url: 'https://biblehub.com/hebrew/3658.htm'
    quote: 'lyre (on formation compare'
  - where: 'note 150:3 “The horn and the temple’s instruments”'
    claim: 'The psalteries and harps of 2 Chronicles 5:12 are the same two Hebrew words (H5035, H3658), and its trumpets are the priests’ trumpets (H2689)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Chr.xml'
    quote: 'וּ/בִ/נְבָלִ֣ים'
  - where: 'note 150:3 “The horn and the temple’s instruments”'
    claim: 'The dedication of Solomon’s temple has been read as showing the music itself bringing the Lord’s presence into the house'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'This passage points to the music and singing itself as the behavior that directly led to the presence of God entering into the temple.'
  - where: 'note 150:3 “The horn and the temple’s instruments”'
    claim: '“Stringed instruments” is the word for strings'
    key: bdb
    url: 'https://biblehub.com/hebrew/4482.htm'
    quote: 'string (of harp)'
  - where: 'note 150:3 “The horn and the temple’s instruments”'
    claim: 'The “organ” is a pipe, by the ancient Aramaic rendering a reed-pipe or flute'
    key: bdb
    url: 'https://biblehub.com/hebrew/5748.htm'
    quote: 'a reed-pipe or flute'
  - where: 'note 150:3 “The horn and the temple’s instruments”'
    claim: 'The organ of Genesis 4:21 is the same word (H5748), beside the harp (H3658)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'וְ/עוּגָֽב'
  - where: 'note 150:3 “The horn and the temple’s instruments”'
    claim: 'The cymbals are a percussion instrument with a clashing sound'
    key: bdb
    url: 'https://biblehub.com/hebrew/6767.htm'
    quote: 'musical instrument of percussion, cymbals (with clashing sound'
  - where: 'note 150:3 “The horn and the temple’s instruments”'
    claim: 'The “high sounding” cymbals are cymbals of teruah, a shout or blast'
    key: bdb
    url: 'https://biblehub.com/hebrew/8643.htm'
    quote: 'shout or blast of war, alarm, or joy'
  - where: 'note 150:3 “The horn and the temple’s instruments”'
    claim: 'The same word is the shout that went up with the ark in 2 Samuel 6:15'
    key: bdb
    url: 'https://biblehub.com/hebrew/8643.htm'
    quote: 'shout of joy with religious impulse, 1 Samuel 4:5,6 (twice in verse); 2 Samuel 6:15'
  - where: 'note 150:3 “The horn and the temple’s instruments”'
    claim: 'Little is known of how Hebrew music sounded; the psalms were probably sung to simple melodies with instruments'
    key: bd-music
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/music?lang=eng'
    quote: 'Little is known about the form or character of Hebrew music.'

  - where: 'note 150:3 “The horn and the temple’s instruments”'
    claim: 'Genesis 4:21 is among the early references to music in the Old Testament'
    key: bd-music
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/music?lang=eng'
    quote: 'There are early references in the Old Testament to the practice of music (Gen. 4:21; 31:27).'
  - where: 'note 150:6 “Everything that breathes”'
    claim: 'The subject of the verb is “all the breath”: all (H3605) with the article and breath (H5397)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'כֹּ֣ל'

  - where: 'note 150:4 “Timbrel and dance are the sound of triumph”'
    claim: 'The timbrel is a hand drum or tambourine, played especially by dancing women'
    key: bdb
    url: 'https://biblehub.com/hebrew/8596.htm'
    quote: 'timbrel, held and struck with hand, especially by dancing women'
  - where: 'note 150:4 “Timbrel and dance are the sound of triumph”'
    claim: 'The timbrel marks exultation and triumph, as at Exodus 15:20'
    key: bdb
    url: 'https://biblehub.com/hebrew/8596.htm'
    quote: 'exultation, triumph Exodus 15:20'
  - where: 'note 150:4 “Timbrel and dance are the sound of triumph”'
    claim: 'Miriam’s timbrels in Exodus 15:20 are the same word (H8596)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'בְּ/תֻפִּ֖ים'
  - where: 'note 150:4 “Timbrel and dance are the sound of triumph”'
    claim: 'Dance is a token of joy and, in Psalms 149:3 and 150:4, an act of praise accompanied by the timbrel'
    key: bdb
    url: 'https://biblehub.com/hebrew/4234.htm'
    quote: 'dance, token of joyousness Psalm 30:12'
  - where: 'note 150:4 “Timbrel and dance are the sound of triumph”'
    claim: 'Psalm 149:3 has the same two Hebrew words, dance (H4234) and timbrel (H8596)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בְ/מָח֑וֹל'
  - where: 'note 150:4 “Timbrel and dance are the sound of triumph”'
    claim: 'Doctrine and Covenants 136 was given at Winter Quarters, the camp of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/136?lang=eng'
    quote: 'The word and will of the Lord, given through President Brigham Young at Winter Quarters, the camp of Israel'

  - where: 'note 150:6 “Everything that breathes”'
    claim: 'The verb changes in verse 6 from the plural imperative to the third person (hebrew.mjs: HVpi3fs, Piel imperfect third person feminine singular, its subject “breath”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תְּהַלֵּ֥ל'
  - where: 'note 150:6 “Everything that breathes”'
    claim: '“Breath” is neshamah (H5397)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הַ֭/נְּשָׁמָה'
  - where: 'note 150:6 “Everything that breathes”'
    claim: 'The “breath of life” of Genesis 2:7 is the same word (H5397)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'נִשְׁמַ֣ת'
  - where: 'note 150:6 “Everything that breathes”'
    claim: 'The phrase means every breathing thing; the lexicon lists Psalm 150:6 under that sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/5397.htm'
    quote: 'every breathing thing Deuteronomy 20:16'
  - where: 'note 150:6 “Everything that breathes”'
    claim: 'One reading: the instruments show the call was to Israel especially, and verse 6 widens it to all mankind'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/150.htm'
    quote: 'as the names of instruments thus heaped up show, to Israel especially'
  - where: 'note 150:6 “Everything that breathes”'
    claim: 'The same reading takes the breath as the breath of life given by God and the phrase as all mankind'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/150.htm'
    quote: 'i.e., to all mankind'

  - where: 'note 150:6 “The fifth book closes with a whole psalm”'
    claim: 'The book of Psalms is in five sections, each ending in praise'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'The book of Psalms is divided into five sections, each ending with a final expression of praise:'
  - where: 'note 150:6 “The fifth book closes with a whole psalm”'
    claim: 'The five books are Psalms 1–41, 42–72, 73–89, 90–106 and 107–150, each break marked by a doxology'
    key: ot-manual-psalms
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/the-psalms-songs-from-the-heart-of-israel?lang=eng'
    quote: 'At the end of each division, the break is marked with a doxology, or formal declaration of God’s power and glory (see Psalms 41:13; 72:19; 89:52; 106:48).'
  - where: 'note 150:6 “The fifth book closes with a whole psalm”'
    claim: 'Psalm 150 is itself a doxology and closes the collection'
    key: ot-manual-psalms
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/the-psalms-songs-from-the-heart-of-israel?lang=eng'
    quote: 'Psalms 150 is itself a doxology, using the Hebrew Hallelujah, “praise ye the Lord,” at its beginning and end, as well as the word praise eleven other times.'
  - where: 'note 150:6 “The fifth book closes with a whole psalm”'
    claim: 'The verb to praise occurs thirteen times in the psalm (count from hebrew.mjs psalms 150:1-6: three in verse 1, two in each of verses 2–6)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הַֽלְל֥וּ/הוּ'
  - where: 'note 150:6 “The fifth book closes with a whole psalm”'
    claim: 'The Hebrew name of the book is Tehillim, Praises'
    key: bd-psalms
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/psalms?lang=eng'
    quote: 'The Psalms collectively are called in Hebrew Tehillim or “Praises,”'
  - where: 'note 150:6 “The fifth book closes with a whole psalm”'
    claim: 'Tehillim comes from the verb halal, to praise, the root of hallelujah'
    key: ot-manual-psalms
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/the-psalms-songs-from-the-heart-of-israel?lang=eng'
    quote: 'The psalms in Hebrew are called Tehillim, a word coming from the Hebrew word halal, “to praise”'

