    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: 'christ'
    claim: 'Yah in “Praise ye the LORD” is a short form of the name Jehovah'
    key: bdb
    url: 'https://biblehub.com/hebrew/3050.htm'
    quote: 'proper name, of deity contracted from'
  - where: 'christ'
    claim: 'The Bible Dictionary joins hallelujah in the Psalms to the Alleluia of Revelation 19:1–6'
    key: bd-hallelujah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hallelujah?lang=eng'
    quote: 'Praise ye the Lord. An expression found at the beginning or the end of a large number of Psalms (see Ps. 146:1; Rev. 19:1–6).'
  - where: 'christ'
