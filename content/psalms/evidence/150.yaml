    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/19?lang=eng'
    quote: 'The marriage supper of the Lamb is made ready'
  - where: 'explore'
    claim: 'A Religious Studies Center study treats the music of the Levites and the temple setting of the psalms'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'connect Israelite music directly to the office of the Levites and a temple setting'
  - where: 'parallels'
    claim: 'The Lord’s word to the camp of Israel names singing, music, dancing and a prayer of praise'
