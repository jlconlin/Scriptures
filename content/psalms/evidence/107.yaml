chapter: 107
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The psalm has been read of the return from exile'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/107.htm'
    quote: 'here it is the Israel redeemed out of the lands of the Exile'

  # ---- setting ----
  - where: 'setting'
    claim: 'Psalm 107 is the first psalm of the fifth book of the Psalter'
    key: ot-manual-psalms
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/the-psalms-songs-from-the-heart-of-israel?lang=eng'
    quote: 'Psalms 1 through 41, 42 through 72, 73 through 89, 90 through 106, and 107 through 150'
  - where: 'setting'
    claim: 'Psalm 107:3 gives thanks for what Psalm 106:47 asked'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/107.htm'
    quote: 'Thanks are here given in Psalm 107:3 for what was there desired in v. 47.'
  - where: 'setting'
    claim: 'Psalms 105, 106 and 107 have been read as a set of three'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/107.htm'
    quote: 'These three anonymous Psalms form a trilogy in the strictest sense'
  - where: 'setting'
    claim: 'The themes of the three: the LORD’s deeds for Israel (105), Israel’s sinful conduct (106), the praise due from those redeemed out of exile (107)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/107.htm'
    quote: 'The theme of Psalm 107, finally, is the sacrifice of praise that is due to Him who redeemed them out of exile and all kinds of destruction.'
  - where: 'setting'
    claim: 'On that reading the opening call is addressed to the returned exiles'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/107.htm'
    quote: 'The introit, with the call upon them to grateful praise, is addressed to the returned exiles.'
  - where: 'setting'
    claim: 'The release of the Babylonian exiles had drawn scattered Israelites home from other countries'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/107.htm'
    quote: 'the Jewish state newly founded by the release of the Babylonian exiles had induced the scattered fellow-countrymen in all countries to return home'
  - where: 'setting'
    claim: 'The Church’s chapter heading reads the psalm of Israel gathered and redeemed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/107?lang=eng'
    quote: 'The people of Israel are to praise and thank the Lord when they are gathered and redeemed'
  - where: 'setting'
    claim: 'Zacharias uses the words of verse 10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'To give light to them that sit in darkness and in the shadow of death'
  - where: 'setting'
    claim: 'The Gospels tell of a storm stilled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/8?lang=eng'
    quote: 'Then he arose, and rebuked the winds and the sea; and there was a great calm.'
  - where: 'setting'
    claim: 'Ammon’s words in Alma 26 have been heard as borrowing from Psalms 106–107'
    key: sc-knowhy-133
    url: 'https://scripturecentral.org/knowhy/why-did-ammon-borrow-so-much-from-tradition-in-alma-26'
    quote: 'Much of this language likely borrows from scriptural sources such as Psalms 106–107.'

  # ---- thread ----
  - where: 'thread'
    claim: '“Mercy” in verse 1 is the Hebrew hesed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חַסְדּֽ/וֹ'
  - where: 'thread'
    claim: '“Goodness” in the refrain (verse 8) is the same word'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חַסְדּ֑/וֹ'
  - where: 'thread'
    claim: '“Lovingkindness” in verse 43 is the same word'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חַֽסְדֵ֥י'

  # ---- note 107:2 ----
  - where: 'note 107:2 “What the redeemed are to say, and who promised they would”'
    claim: 'Jeremiah foretells that those returned from captivity will say the sentence of verse 1 and bring the sacrifice of praise'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/33?lang=eng'
    quote: 'the voice of them that shall say, Praise the Lord of hosts: for the Lord is good; for his mercy endureth for ever: and of them that shall bring the sacrifice of praise into the house of the Lord'
  - where: 'note 107:2 “What the redeemed are to say, and who promised they would”'
    claim: 'Jeremiah gives the return of the captivity as the reason'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/33?lang=eng'
    quote: 'For I will cause to return the captivity of the land'
  - where: 'note 107:2 “What the redeemed are to say, and who promised they would”'
    claim: 'The sentence was sung when the foundation of the second temple was laid'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/3?lang=eng'
    quote: 'because he is good, for his mercy endureth for ever toward Israel. And all the people shouted with a great shout, when they praised the Lord, because the foundation of the house of the Lord was laid.'
  - where: 'note 107:2 “What the redeemed are to say, and who promised they would”'
    claim: 'Isaiah names Zion’s people “The redeemed of the LORD”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/62?lang=eng'
    quote: 'And they shall call them, The holy people, The redeemed of the Lord'

  # ---- note 107:3 ----
  - where: 'note 107:3 “The Hebrew says “from the sea””'
    claim: 'The last word of verse 3 in the Hebrew is “and from the sea” (yam)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/107-3.htm'
    quote: 'וּמִיָּֽם׃'
  - where: 'note 107:3 “The Hebrew says “from the sea””'
    claim: 'The word means sea, locally the west, rarely the south'
    key: bdb
    url: 'https://biblehub.com/hebrew/3220.htm'
    quote: 'locally, the west, or (rarely) the south'
  - where: 'note 107:3 “The Hebrew says “from the sea””'
    claim: 'West is “sea-ward” from the position of the Mediterranean; at Psalm 107:3 the lexicon suggests reading “from the south”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3220.htm'
    quote: 'originally sea-ward, from position of Mediterranean with reference to Palestine'
  - where: 'note 107:3 “The Hebrew says “from the sea””'
    claim: 'The lexicon suggests reading a similar word, “from the south”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3220.htm'
    quote: 'but read perhaps'
  - where: 'note 107:3 “The Hebrew says “from the sea””'
    claim: 'The NRSVUE prints “south” with a note that the Hebrew has “sea”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20107&version=NRSVUE'
    quote: 'Heb sea'
  - where: 'note 107:3 “The Hebrew says “from the sea””'
    claim: 'Isaiah speaks of the gathering from east, west, north and south'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/43?lang=eng'
    quote: 'I will bring thy seed from the east, and gather thee from the west'
  - where: 'note 107:3 “The Hebrew says “from the sea””'
    claim: 'Nephi speaks of the gathering from the four quarters of the earth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/22?lang=eng'
    quote: 'And he gathereth his children from the four quarters of the earth'

  # ---- note 107:6 ----
  - where: 'note 107:6 “Four rescues told in one pattern”'
    claim: 'One older reading takes the four pictures as examples and not allegories of the Exile'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/107.htm'
    quote: 'not so much allegorical, personifying the Exile, as rather exemplificative'
  - where: 'note 107:6 “Four rescues told in one pattern”'
    claim: 'The returned nation had seen destruction in every form abroad and could tell of many deliverances'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/107.htm'
    quote: 'seen destruction in every form in a strange land, and can tell of the most manifold divine deliverances'

  # ---- note 107:10 ----
  - where: 'note 107:10 “Prisoners in darkness, in Isaiah, Luke and Alma”'
    claim: 'Isaiah’s servant brings out those who sit in darkness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/42?lang=eng'
    quote: 'to bring out the prisoners from the prison, and them that sit in darkness out of the prison house'
  - where: 'note 107:10 “Prisoners in darkness, in Isaiah, Luke and Alma”'
    claim: 'Zacharias uses the phrase of verse 10 (his words at the birth of John, by the chapter heading)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'To give light to them that sit in darkness and in the shadow of death, to guide our feet into the way of peace.'
  - where: 'note 107:10 “Prisoners in darkness, in Isaiah, Luke and Alma”'
    claim: 'Alma 5:7 as set beside Psalm 107:13 in the KnoWhy’s chart'
    key: sc-knowhy-111
    url: 'https://scripturecentral.org/knowhy/why-did-alma-add-chains-of-hell-to-abinadis-phrase-bands-of-death'
    quote: 'they were encircled about by the bands of death, and the chains of hell, and an everlasting destruction did await them'
  - where: 'note 107:10 “Prisoners in darkness, in Isaiah, Luke and Alma”'
    claim: 'Alma says the bands were loosed'
    key: sc-knowhy-111
    url: 'https://scripturecentral.org/knowhy/why-did-alma-add-chains-of-hell-to-abinadis-phrase-bands-of-death'
    quote: 'were the bands of death broken, and the chains of hell which encircled them about, were they loosed? I say unto you, Yea, they were loosed'
  - where: 'note 107:10 “Prisoners in darkness, in Isaiah, Luke and Alma”'
    claim: 'Psalm 107:10–14 is similar to what Alma taught in Alma 5, and in both the afflicted cry to the Lord'
    key: sc-knowhy-111
    url: 'https://scripturecentral.org/knowhy/why-did-alma-add-chains-of-hell-to-abinadis-phrase-bands-of-death'
    quote: 'which are actually quite similar to what Alma was teaching in these opening verses of Alma 5. In particular, these psalms speak of the afflicted calling upon or crying unto the Lord for deliverance, as also did Alma.'
  - where: 'note 107:10 “Prisoners in darkness, in Isaiah, Luke and Alma”'
    claim: 'In Alma 5 the deliverance is from physical death (the bands of death) and from the spiritual death (the chains of hell) that results from sin'
    key: sc-knowhy-111
    url: 'https://scripturecentral.org/knowhy/why-did-alma-add-chains-of-hell-to-abinadis-phrase-bands-of-death'
    quote: 'that otherwise results from sin during this mortal life'

  # ---- note 107:20 ----
  - where: 'note 107:20 “Healed by a word that is sent”'
    claim: '“Fools” is a moral word here'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/107.htm'
    quote: 'is also an ethical notion, and not confined to the idea of defective intellect merely'
  - where: 'note 107:20 “Healed by a word that is sent”'
    claim: 'One older reading: the word is God’s messenger and here a mediator of healing'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/107.htm'
    quote: 'is God''s messenger (Psalm 105:19, cf. Isaiah 55:10.), and appears here as a mediator of the divine healing'

  # ---- note 107:29 ----
  - where: 'note 107:29 “Who it is that stills the sea”'
    claim: 'Jesus speaks to the sea and the disciples ask what manner of man He is'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'said unto the sea, Peace, be still. And the wind ceased, and there was a great calm.'
  - where: 'note 107:29 “Who it is that stills the sea”'
    claim: 'The disciples’ question in Mark 4:41'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/mark/4?lang=eng'
    quote: 'What manner of man is this, that even the wind and the sea obey him?'
  - where: 'note 107:29 “Who it is that stills the sea”'
    claim: 'Jesus does what is proper only to Jehovah, especially in the natural world'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'A major argument for Jesus being Jehovah incarnate is that He does what is proper only to Jehovah.'
  - where: 'note 107:29 “Who it is that stills the sea”'
    claim: 'The disciples’ question is answered from Psalm 107:23–30'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'The answer to the disciples’ question is found in the Psalms'
  - where: 'note 107:29 “Who it is that stills the sea”'
    claim: 'Jehovah made and controls the natural world, and is in the boat'
    key: keller-jesus-jehovah
    url: 'https://rsc.byu.edu/jesus-christ-son-god-savior/jesus-jehovah-yhwh'
    quote: 'It is Jehovah who made the natural world. It is He who controls it. It is He who is in the boat.'

  # ---- note 107:33 ----
  - where: 'note 107:33 “After verse 32 the refrains stop”'
    claim: 'Verse 35 is nearly Isaiah 41:18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/41?lang=eng'
    quote: 'I will make the wilderness a pool of water, and the dry land springs of water'
  - where: 'note 107:33 “After verse 32 the refrains stop”'
    claim: 'The first half of verse 40 is Job 12:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/12?lang=eng'
    quote: 'He poureth contempt upon princes, and weakeneth the strength of the mighty.'
  - where: 'note 107:33 “After verse 32 the refrains stop”'
    claim: 'The second half of verse 40 is Job 12:24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/12?lang=eng'
    quote: 'and causeth them to wander in a wilderness where there is no way'

  # ---- note 107:43 ----
  - where: 'note 107:43 “Lovingkindness is the mercy of verse 1”'
    claim: '“Mercy” in verse 1 is hesed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חַסְדּֽ/וֹ'
  - where: 'note 107:43 “Lovingkindness is the mercy of verse 1”'
    claim: '“Goodness” in the refrain (verses 8, 15, 21, 31) is hesed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חַסְדּ֑/וֹ'
  - where: 'note 107:43 “Lovingkindness is the mercy of verse 1”'
    claim: '“Lovingkindness” in verse 43 is hesed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חַֽסְדֵ֥י'
  - where: 'note 107:43 “Lovingkindness is the mercy of verse 1”'
    claim: 'The NRSVUE has “steadfast love” in verse 1'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20107&version=NRSVUE'
    quote: 'for his steadfast love endures forever'
  - where: 'note 107:43 “Lovingkindness is the mercy of verse 1”'
    claim: 'The NRSVUE has “Let them thank … for his steadfast love” in the refrain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20107&version=NRSVUE'
    quote: 'Let them thank the Lord for his steadfast love'
  - where: 'note 107:43 “Lovingkindness is the mercy of verse 1”'
    claim: 'The NRSVUE has “steadfast love” in verse 43'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20107&version=NRSVUE'
    quote: 'and consider the steadfast love of the Lord'
  - where: 'note 107:43 “Lovingkindness is the mercy of verse 1”'
    claim: 'The verb “give thanks” of verse 1 (hodu)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הֹד֣וּ'
  - where: 'note 107:43 “Lovingkindness is the mercy of verse 1”'
    claim: '“Praise” in the refrain (verse 8) is the same verb (yodu)'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/psalms/107-8.htm'
    quote: 'יוֹד֣וּ'
  - where: 'note 107:43 “Lovingkindness is the mercy of verse 1”'
    claim: 'Hosea closes with nearly the same sentence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/14?lang=eng'
    quote: 'Who is wise, and he shall understand these things?'

  # ---- christ ----
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: 'christ'
    claim: 'Jesus Christ is the Redeemer'
    key: gs-redeemer
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/redeemer?lang=eng'
    quote: 'Jesus Christ is the great Redeemer of mankind because He, through His Atonement, paid the price for the sins of mankind'
  - where: 'christ'
    claim: 'Zacharias blesses the Lord for visiting and redeeming His people, and ends with light for those in darkness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'Blessed be the Lord God of Israel; for he hath visited and redeemed his people'

  # ---- parallels ----
  - where: 'parallels'
    claim: 'Psalm 106:47 prays for the gathering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/106?lang=eng'
    quote: 'gather us from among the heathen, to give thanks unto thy holy name'
