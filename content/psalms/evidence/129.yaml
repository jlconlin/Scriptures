chapter: 129
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'The title of Psalm 129 is only “A Song of degrees”: it names no author; the Church’s heading names no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/129?lang=eng'
    quote: 'A Song of degrees.'
  - where: setting
    claim: 'Delitzsch finds in Psalm 129 the situation of a deliverance already experienced, and compares Psalm 124'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/129.htm'
    quote: 'has not only the call "let Israel say," but also the situation of a deliverance that has been experienced'
  - where: setting
    claim: 'Delitzsch says the psalm looks back gratefully and forward confidently from that deliverance'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/129.htm'
    quote: 'from which point it looks gratefully back and confidently forward into the future'
  - where: setting
    claim: 'Psalm 128 closes with a blessing out of Zion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/128?lang=eng'
    quote: 'The Lord shall bless thee out of Zion: and thou shalt see the good of Jerusalem all the days of thy life.'

  # ---------- thread ----------
  - where: thread
    claim: 'The psalm’s wish is aimed at those who hate Zion, as the Church’s chapter heading summarizes it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/129?lang=eng'
    quote: 'The Lord is righteous—Let those be confounded who hate Zion.'

  # ---------- sections ----------
  - where: section 1 plain
    claim: 'A modern translation has “they made their furrows long” and “he has cut the cords of the wicked”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20129&version=NRSVUE'
    quote: 'they made their furrows long.'
  - where: section 2 plain
    claim: 'A modern translation has “put to shame,” “reapers,” and “arms” for the King James “confounded,” “mower,” and “bosom”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20129&version=NRSVUE'
    quote: 'with which reapers do not fill their hands'
  - where: section 2 plain
    claim: 'The Church’s footnote to verse 7 gives the Hebrew of “mower” as reaper'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/129?lang=eng'
    quote: 'HEB reaper.'

  # ---------- note 129:1 ----------
  - where: 'note 129:1 “The youth of Israel was Egypt”'
    claim: 'The NRSVUE cross-references set Hosea 2:15 beside verse 1'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20129&version=NRSVUE'
    quote: '129.1 : Ps 88.15; 124.1; Hos 2.15'
  - where: 'note 129:1 “The youth of Israel was Egypt”'
    claim: 'Hosea sets the days of Israel’s youth beside the day she came up out of Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/2?lang=eng'
    quote: 'as in the days of her youth, and as in the day when she came up out of the land of Egypt.'
  - where: 'note 129:1 “The youth of Israel was Egypt”'
    claim: 'Hosea speaks of Israel as a child called out of Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/11?lang=eng'
    quote: 'When Israel was a child, then I loved him, and called my son out of Egypt.'
  - where: 'note 129:1 “The youth of Israel was Egypt”'
    claim: 'Exodus says the Egyptians afflicted Israel in bondage'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/1?lang=eng'
    quote: 'But the more they afflicted them, the more they multiplied and grew.'

  # ---------- note 129:3 ----------
  - where: 'note 129:3 “A people ploughed like a field”'
    claim: 'Delitzsch reads the picture as the oppressors treating the people’s back as arable land'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/129.htm'
    quote: 'they ill-treated the stretched-forth back of the people who were held in subjection, as though it were arable land'
  - where: 'note 129:3 “A people ploughed like a field”'
    claim: 'Delitzsch says the oppressors set no limit and drew the furrow long'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/129.htm'
    quote: 'without restraining their ferocity and setting a limit to their spoiling of the enslaved people and country, they drew their furrow-strip'
  - where: 'note 129:3 “A people ploughed like a field”'
    claim: 'Delitzsch sets Isaiah 51:23, enemies going over Israel’s back, beside verse 3'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/129.htm'
    quote: 'Elsewhere it is said that the enemies have driven over Israel (Psalm 66:12), or have gone over its back (Isaiah 51:23)'
  - where: 'note 129:3 “A people ploughed like a field”'
    claim: 'Isaiah describes Jerusalem made to bow down and lay her body as the ground for those who went over'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/51?lang=eng'
    quote: 'Bow down, that we may go over: and thou hast laid thy body as the ground, and as the street, to them that went over.'
  - where: 'note 129:3 “A people ploughed like a field”'
    claim: 'Delitzsch says the word for cords in verse 4 is suggested by the ploughing metaphor of verse 3, and compares Job 39:10'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/129.htm'
    quote: 'as in Psalm 2:3; here, however, it is suggested by the metaphor in Psalm 129:3, cf. Job 39:10'
  - where: 'note 129:3 “A people ploughed like a field”'
    claim: 'Delitzsch also takes the cords as those that held Israel bound'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/129.htm'
    quote: 'with which they held Israel bound'
  - where: 'note 129:3 “A people ploughed like a field”'
    claim: 'Delitzsch reads “The LORD is righteous” as a universal truth verified in the present deliverance'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/129.htm'
    quote: 'this is an universal truth, which has been verified in the present circumstances'
  - where: 'note 129:3 “A people ploughed like a field”'
    claim: 'A modern translation has “he has cut the cords of the wicked”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20129&version=NRSVUE'
    quote: 'he has cut the cords of the wicked.'
  - where: 'note 129:3 “A people ploughed like a field”'
    claim: 'In Job the wild ox is bound with a band in the furrow'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/39?lang=eng'
    quote: 'Canst thou bind the unicorn with his band in the furrow?'

  # ---------- note 129:5 ----------
  - where: 'note 129:5 “What is asked for those who hate Zion”'
    claim: 'A modern translation renders “confounded and turned back” as put to shame and turned backward'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20129&version=NRSVUE'
    quote: 'be put to shame and turned backward.'

  # ---------- note 129:6 ----------
  - where: 'note 129:6 “Grass on a roof, and no harvest”'
    claim: 'The roofs of Israelite houses were flat'
    key: bd-house
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/house?lang=eng'
    quote: 'The roofs were invariably flat and could in many cases be reached by an outside staircase'
  - where: 'note 129:6 “Grass on a roof, and no harvest”'
    claim: 'A modern translation has “withers before it grows up”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20129&version=NRSVUE'
    quote: 'that withers before it grows up,'
  - where: 'note 129:6 “Grass on a roof, and no harvest”'
    claim: 'A modern translation has binders of sheaves who do not fill their arms'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20129&version=NRSVUE'
    quote: 'or binders of sheaves their arms,'
  - where: 'note 129:6 “Grass on a roof, and no harvest”'
    claim: 'A modern translation has reapers who do not fill their hands with the roof grass'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20129&version=NRSVUE'
    quote: 'with which reapers do not fill their hands'
  - where: 'note 129:6 “Grass on a roof, and no harvest”'
    claim: 'Isaiah uses the grass on the housetops, with “confounded,” of the inhabitants of cities that fell'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/37?lang=eng'
    quote: 'they were dismayed and confounded: they were as the grass of the field, and as the green herb, as the grass on the housetops, and as corn blasted before it be grown up.'
  - where: 'note 129:6 “Grass on a roof, and no harvest”'
    claim: 'The words are in the LORD’s answer concerning Sennacherib king of Assyria'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/37?lang=eng'
    quote: 'Whereas thou hast prayed to me against Sennacherib king of Assyria'
  - where: 'note 129:6 “Grass on a roof, and no harvest”'
    claim: 'The inhabitants are those of the cities Sennacherib laid waste'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/37?lang=eng'
    quote: 'that thou shouldest be to lay waste defenced cities into ruinous heaps.'
  - where: 'note 129:6 “Grass on a roof, and no harvest”'
    claim: 'The same words stand in 2 Kings 19:26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-kgs/19?lang=eng'
    quote: 'as the grass on the housetops, and as corn blasted before it be grown up.'

  # ---------- christ ----------
  - where: christ
    claim: '“LORD” in the Old Testament usually stands for Jehovah, who is Jesus Christ before His birth'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Usually, when the word Lord appears in the Old Testament, it means “Jehovah.”'
  - where: christ
    claim: 'The NRSVUE cross-references set Matthew 16:18 beside verse 2'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20129&version=NRSVUE'
    quote: '129.2 : Mt 16.18'
  - where: christ
    claim: 'The Savior promises that the gates of hell will not prevail against His Church'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/16?lang=eng'
    quote: 'upon this rock I will build my church; and the gates of hell shall not prevail against it.'

  # ---------- explore ----------
  - where: explore
    claim: 'Nephi says that all who fight against Zion will be destroyed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/22?lang=eng'
    quote: 'And all that fight against Zion shall be destroyed'
  - where: explore
    claim: 'Jacob says that Gentiles who repent and do not fight against Zion will be saved'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/6?lang=eng'
    quote: 'if it so be that they shall repent and fight not against Zion, and do not unite themselves to that great and abominable church, they shall be saved'
  - where: explore
    claim: 'Isaiah speaks of the nations that fight against mount Zion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/29?lang=eng'
    quote: 'so shall the multitude of all the nations be, that fight against mount Zion.'
  - where: explore
    claim: 'Psalm 126 ends with the sower coming home with his sheaves'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/126?lang=eng'
    quote: 'bringing his sheaves with him.'
  - where: explore
    claim: 'Boaz and his reapers exchange a blessing in the field'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ruth/2?lang=eng'
    quote: 'said unto the reapers, The Lord be with you. And they answered him, The Lord bless thee.'
  - where: explore
    claim: 'Delitzsch calls the greeting of verse 8 one taken from life and sets Boaz’s greeting in Ruth 2:4 beside it'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/129.htm'
    quote: 'The greeting addressed to the reapers in Psalm 129:8 is taken from life'
  - where: explore
    claim: 'Delitzsch sets against the psalm’s end the harvest the righteous gather'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/129.htm'
    quote: 'there is before the righteous a garnering in of that which they have sown amidst the exchange of joyful benedictory greetings'

  # ---------- parallels ----------
  - where: parallels
    claim: 'Psalm 124 opens with a line, “now may Israel say,” and the line again'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/124?lang=eng'
    quote: 'now may Israel say'
