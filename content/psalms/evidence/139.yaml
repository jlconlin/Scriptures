chapter: 139
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The title ascribes the psalm to David and gives no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/139?lang=eng'
    quote: 'To the chief Musician, A Psalm of David.'

  # ---- setting ----
  - where: 'setting'
    claim: 'The title ascribes the psalm to David and names no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/139?lang=eng'
    quote: 'To the chief Musician, A Psalm of David.'
  - where: 'setting'
    claim: 'Delitzsch finds Aramaic influence in the psalm’s language and so places it among psalms later than David'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/139.htm'
    quote: 'bear marks of the influence which the Aramaic language of the Babylonian kingdom exerted over the exiles'
  - where: 'setting'
    claim: 'In Jeremiah the LORD asks whether anyone can hide from Him and whether He does not fill heaven and earth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/23?lang=eng'
    quote: 'Can any hide himself in secret places that I shall not see him?'
  - where: 'setting'
    claim: 'Amos names hell and heaven together'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/9?lang=eng'
    quote: 'Though they dig into hell, thence shall mine hand take them; though they climb up to heaven, thence will I bring them down:'
  - where: 'setting'
    claim: 'Scripture Helps treats verses 19–22, the “perfect hatred,” as the question of this psalm'
    key: scripture-helps-ps-102
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/34-psalms-102-103-110-116-119-127-128-135-139-146-150?lang=eng'
    quote: 'The writer of Psalm 139 used the phrase “perfect hatred” to describe his displeasure with those who oppose God.'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: 'Verse 2: thoughts known from far away; verse 3: “compassest” rendered as searching out'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20139&version=NRSVUE'
    quote: 'You search out my path and my lying down'
  - where: 'section 1 plain'
    claim: 'Verse 5: “beset” rendered as hemmed in'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20139&version=NRSVUE'
    quote: 'You hem me in, behind and before,'
  - where: 'section 2 plain'
    claim: 'Verse 8: “hell” is Sheol'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20139&version=NRSVUE'
    quote: 'if I make my bed in Sheol, you are there.'
  - where: 'section 3 plain'
    claim: 'Verse 13: inward parts formed, and knit together in the womb'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20139&version=NRSVUE'
    quote: 'you knit me together in my mother’s womb.'
  - where: 'section 3 plain'
    claim: 'Verse 15: woven in the depths of the earth'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20139&version=NRSVUE'
    quote: 'intricately woven in the depths of the earth.'
  - where: 'section 3 plain'
    claim: 'Verse 16: what is written in the book is the days formed for him'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20139&version=NRSVUE'
    quote: 'all the days that were formed for me,'
  - where: 'section 4 plain'
    claim: 'Verse 22: “perfect hatred” is completeness of hatred'
    key: bdb
    url: 'https://biblehub.com/hebrew/8503.htm'
    quote: 'with completeness of hatred I hate them.'
  - where: 'section 5 plain'
    claim: 'Verse 24: the “wicked way” is in Hebrew a hurtful way'
    key: bdb
    url: 'https://biblehub.com/hebrew/6090.htm'
    quote: 'Psalm 139:24 hurtful way (of any wicked habit;'

  # ---- note 139:5 ----
  - where: 'note 139:5 “Beset means hemmed in”'
    claim: 'In older English to beset is to surround, hem in, besiege'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/beset'
    quote: 'To surround; to inclose; to hem in; to besiege;'
  - where: 'note 139:5 “Beset means hemmed in”'
    claim: 'A modern translation has “You hem me in”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20139&version=NRSVUE'
    quote: 'You hem me in, behind and before,'

  # ---- note 139:7 ----
  - where: 'note 139:7 “Present everywhere through His Spirit”'
    claim: 'The Guide to the Scriptures defines God’s omnipresence as presence everywhere through His spirit and cites these verses with D&C 88'
    key: gs-omnipresent
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/omnipresent?lang=eng'
    quote: 'God’s ability to be present everywhere through His spirit (Ps. 139:7–12; D&C 88:7–13, 41).'
  - where: 'note 139:7 “Present everywhere through His Spirit”'
    claim: 'D&C 88:12 describes the light that fills the immensity of space'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'Which light proceedeth forth from the presence of God to fill the immensity of space'
  - where: 'note 139:7 “Present everywhere through His Spirit”'
    claim: 'D&C 88:13 has God on His throne and in the midst of all things'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'even the power of God who sitteth upon his throne, who is in the bosom of eternity, who is in the midst of all things.'
  - where: 'note 139:7 “Present everywhere through His Spirit”'
    claim: 'D&C 88:41: all things are before Him and round about Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'He comprehendeth all things, and all things are before him, and all things are round about him;'
  - where: 'note 139:7 “Present everywhere through His Spirit”'
    claim: 'Jeremiah 23:24 speaks of hiding in secret places and of the LORD filling heaven and earth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/23?lang=eng'
    quote: 'Can any hide himself in secret places that I shall not see him?'

  # ---- note 139:8 ----
  - where: 'note 139:8 “God is in Sheol too”'
    claim: 'The word translated “hell” in verse 8 is Sheol; a modern translation keeps the name'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20139&version=NRSVUE'
    quote: 'if I make my bed in Sheol, you are there.'
  - where: 'note 139:8 “God is in Sheol too”'
    claim: 'Amos 9:2 names hell and heaven as places from which the LORD’s hand takes those who flee'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/9?lang=eng'
    quote: 'Though they dig into hell, thence shall mine hand take them; though they climb up to heaven, thence will I bring them down:'

  # ---- note 139:15 ----
  - where: 'note 139:15 “Woven in the depths”'
    claim: 'In older English “curiously” means with care and art; Webster cites this verse'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/curiously'
    quote: 'With nice care and art; exactly; neatly; elegantly.'
  - where: 'note 139:15 “Woven in the depths”'
    claim: 'The Hebrew verb is that of working in colours or embroidering'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/139.htm'
    quote: 'to be worked in different colours, or also embroidered'
  - where: 'note 139:15 “Woven in the depths”'
    claim: 'In this verse the verb means “I was skilfully wrought (woven)”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7551.htm'
    quote: 'Psalm 139:15 I was skilfully wrought (woven,'
  - where: 'note 139:15 “Woven in the depths”'
    claim: 'A modern translation renders “covered me” in verse 13 as knit together'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20139&version=NRSVUE'
    quote: 'you knit me together in my mother’s womb.'
  - where: 'note 139:15 “Woven in the depths”'
    claim: '“The lowest parts of the earth” is a figure for the hidden interior of the womb'
    key: bdb
    url: 'https://biblehub.com/hebrew/8482.htm'
    quote: 'figurative of the dark and hidden interior of the womb Psalm 139:15.'
  - where: 'note 139:15 “Woven in the depths”'
    claim: 'Delitzsch hears a reference to the first formation of the human body from the dust of the earth'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/139.htm'
    quote: 'with the same retrospective reference to the first formation of the human body out of the dust of the earth'
  - where: 'note 139:15 “Woven in the depths”'
    claim: 'Delitzsch: the manner of Adam’s creation is repeated in every person’s formation'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/139.htm'
    quote: 'creation is repeated in the formation of every man'

  # ---- note 139:16 ----
  - where: 'note 139:16 “What was written in the book”'
    claim: 'A modern translation takes the things written in the book to be the days formed for the psalmist'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20139&version=NRSVUE'
    quote: 'all the days that were formed for me,'
  - where: 'note 139:16 “What was written in the book”'
    claim: 'The same translation marks the verse as uncertain in the Hebrew'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20139&version=NRSVUE'
    quote: '139.16 Meaning of Heb uncertain'
  - where: 'note 139:16 “What was written in the book”'
    claim: 'Delitzsch takes the days as the subject of “were written”'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/139.htm'
    quote: 'which were already formed, are the subject.'
  - where: 'note 139:16 “What was written in the book”'
    claim: '“My substance, yet being unperfect” is one Hebrew word for the embryo'
    key: bdb
    url: 'https://biblehub.com/hebrew/1564.htm'
    quote: 'Psalm 139:16 mine imperfect substance (RV) did thine eyes see.'
  - where: 'note 139:16 “What was written in the book”'
    claim: 'Delitzsch sets the verse beside Jeremiah 1:5'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/139.htm'
    quote: 'just as Jahve says with reference to Jeremiah, Jeremiah 1:5.'

  # ---- note 139:22 ----
  - where: 'note 139:22 “Whose enemies they are”'
    claim: '“Perfect hatred” is in Hebrew completeness of hatred'
    key: bdb
    url: 'https://biblehub.com/hebrew/8503.htm'
    quote: 'with completeness of hatred I hate them.'

  # ---- note 139:23 ----
  - where: 'note 139:23 “The first line becomes the last prayer”'
    claim: 'The “wicked way” of verse 24 is a hurtful way, said of any wicked habit'
    key: bdb
    url: 'https://biblehub.com/hebrew/6090.htm'
    quote: 'Psalm 139:24 hurtful way (of any wicked habit;'
  - where: 'note 139:23 “The first line becomes the last prayer”'
    claim: 'A modern translation notes that the Hebrew of “wicked” in verse 24 is “hurtful”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20139&version=NRSVUE'
    quote: '139.24 Heb hurtful'

  # ---- christ ----
  - where: 'christ'
    claim: 'The speaker of D&C 38:1–2 is Jesus Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/38?lang=eng'
    quote: 'Thus saith the Lord your God, even Jesus Christ, the Great I Am, Alpha and Omega, the beginning and the end,'
  - where: 'christ'
    claim: 'He says He knows all things, all things being present before His eyes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/38?lang=eng'
    quote: 'The same which knoweth all things, for all things are present before mine eyes;'
  - where: 'christ'
    claim: 'The Guide to the Scriptures cites D&C 88:7–13 beside Psalm 139:7–12'
    key: gs-omnipresent
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/omnipresent?lang=eng'
    quote: 'God’s ability to be present everywhere through His spirit (Ps. 139:7–12; D&C 88:7–13, 41).'
  - where: 'christ'
    claim: 'D&C 88:6–7: He descended below all things to be in all things; this is the light of Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/88?lang=eng'
    quote: 'Which truth shineth. This is the light of Christ.'

  # ---- explore ----
  - where: 'explore'
    claim: 'The Guide to the Scriptures sets D&C 88:7–13, 41 beside verses 7–12'
    key: gs-omnipresent
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/omnipresent?lang=eng'
    quote: 'God’s ability to be present everywhere through His spirit (Ps. 139:7–12; D&C 88:7–13, 41).'
