chapter: 113
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The psalm has no title; the Gospel Library page goes from the chapter heading straight to verse 1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/113?lang=eng'
    quote: 'Praise ye the Lord. Praise, O ye servants of the Lord, praise the name of the Lord.'

  # ---- setting ----
  - where: 'setting'
    claim: 'Psalms 113–118 are called the Hallel and were recited at the great feasts'
    key: bd-hallel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hallel?lang=eng'
    quote: 'A name given to the group of Psalms (113–18) recited by Jews at the great feasts (Matt. 26:30; Mark 14:26).'
  - where: 'setting'
    claim: 'Psalms 113 and 114 were sung at the beginning of the Passover meal'
    key: nt-student-manual-9
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/introduction-to-matthew/chapter-9?lang=eng'
    quote: 'Psalms 113–14 were traditionally sung at the beginning of the meal, and Psalms 115–18 were traditionally sung as part of the formal closing of a Passover meal.'
  - where: 'setting'
    claim: 'Verses 7–8 are nearly 1 Samuel 2:8, in the song of Hannah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/2?lang=eng'
    quote: 'He raiseth up the poor out of the dust, and lifteth up the beggar from the dunghill, to set them among princes'
  - where: 'setting'
    claim: 'One older reading: the psalmist has Hannah’s own story in view behind the barren woman of verse 9'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/113.htm'
    quote: 'Together with the song of Hannah the poet has before his eye Hannah''s exaltation out of sorrow and reproach.'

  # ---- thread ----
  - where: 'thread'
    claim: 'Verse 6 pictures God looking far down on the heavens and the earth'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20113&version=NRSVUE'
    quote: 'who looks far down'

  # ---- sections ----
  - where: 'section 2 plain'
    claim: 'Verses 5–6: seated on high, looking far down on the heavens and the earth'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20113&version=NRSVUE'
    quote: 'who is seated on high,'
  - where: 'section 2 plain'
    claim: 'The verb of verse 6 with “to behold” means to make low in order to look'
    key: bdb
    url: 'https://biblehub.com/hebrew/8213.htm'
    quote: 'he who maketh low to look upon heaven and earth'
  - where: 'section 3 plain'
    claim: 'The dunghill is an ash heap'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20113&version=NRSVUE'
    quote: 'and lifts the needy from the ash heap,'
  - where: 'section 3 plain'
    claim: 'Verse 9: the barren woman is given a home'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20113&version=NRSVUE'
    quote: '9 He gives the barren woman a home,'

  # ---- note 113:1 ----
  - where: 'note 113:1 “The first psalm of the Hallel”'
    claim: 'The Hallel is Psalms 113–118, recited at the great feasts; the entry cites Matt. 26:30 and Mark 14:26'
    key: bd-hallel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hallel?lang=eng'
    quote: 'A name given to the group of Psalms (113–18) recited by Jews at the great feasts (Matt. 26:30; Mark 14:26).'
  - where: 'note 113:1 “The first psalm of the Hallel”'
    claim: 'Singing the Hallel was among the ceremonies added to the Passover in later times'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'In later times the following ceremonies were added: … (3) Ps. 113–18 (the Hallel) were sung.'
  - where: 'note 113:1 “The first psalm of the Hallel”'
    claim: 'Psalms 113–114 were sung at the beginning of the Passover meal and 115–118 at its formal close'
    key: nt-student-manual-9
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/introduction-to-matthew/chapter-9?lang=eng'
    quote: 'Psalms 113–14 were traditionally sung at the beginning of the meal, and Psalms 115–18 were traditionally sung as part of the formal closing of a Passover meal.'
  - where: 'note 113:1 “The first psalm of the Hallel”'
    claim: 'The hymn of Matt. 26:30 was probably the Hallel'
    key: nt-student-manual-9
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/introduction-to-matthew/chapter-9?lang=eng'
    quote: 'The “hymn” the Savior and His disciples sang at the conclusion of the Last Supper was probably the traditional Jewish recitation from Psalms 113–18, called the Hallel.'
  - where: 'note 113:1 “The first psalm of the Hallel”'
    claim: 'The closing hymn was likely the last part of the Hallel, Psalms 115–118'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'Likely, this hymn was the last part of the great Hallel, a magnificent set of messianic psalms (Psalms 115–18) whose thinly veiled meanings testify of Jesus Christ.'
  - where: 'note 113:1 “The first psalm of the Hallel”'
    claim: 'The Last Supper is taken to have followed the traditional order of the Passover meal'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'We have every reason to believe the Seder meal proceeded in the traditional manner—up to a point.'
  - where: 'note 113:1 “The first psalm of the Hallel”'
    claim: 'In that order Psalms 113 and 114 were sung before the second cup'
    key: skinner-life-jesus
    url: 'https://rsc.byu.edu/new-testament-history-culture-society/life-jesus-nazareth'
    quote: 'the first parts of the Hallel (Psalms 113 and 114) were sung. The second cup of wine was blessed and drunk.'
  - where: 'note 113:1 “The first psalm of the Hallel”'
    claim: 'Matthew says a hymn was sung after the supper and does not name it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'And when they had sung an hymn, they went out into the mount of Olives.'

  # ---- note 113:3 ----
  - where: 'note 113:3 “From east to west, as in Malachi”'
    claim: 'Malachi 1:11 has the same phrase with “among the Gentiles” and “in every place”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/mal/1?lang=eng'
    quote: 'For from the rising of the sun even unto the going down of the same my name shall be great among the Gentiles; and in every place incense shall be offered unto my name'

  # ---- note 113:6 ----
  - where: 'note 113:6 “He stoops to look, and He gives seats”'
    claim: 'The verb of verse 6 is a helping verb with “to look”: he makes low to look; the lexicon sets it beside the phrase of verse 5'
    key: bdb
    url: 'https://biblehub.com/hebrew/8213.htm'
    quote: 'he who maketh low to look upon heaven and earth'
  - where: 'note 113:6 “He stoops to look, and He gives seats”'
    claim: 'A modern translation of verses 5–6'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20113&version=NRSVUE'
    quote: 'who is seated on high,'
  - where: 'note 113:6 “He stoops to look, and He gives seats”'
    claim: 'A modern translation of verse 6'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20113&version=NRSVUE'
    quote: 'who looks far down'
  - where: 'note 113:6 “He stoops to look, and He gives seats”'
    claim: 'One Hebrew verb, yashab (H3427), stands in verse 5 (“dwelleth”), verse 8 (“set”) and verse 9 (“maketh … to keep house”); hebrew.mjs psalms 113:1-9; the quote is the first letters of the verse 9 form, moshivi'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מֽוֹש'
  - where: 'note 113:6 “He stoops to look, and He gives seats”'
    claim: 'The lexicon lists verses 8 and 9 under the causative of yashab, “cause to dwell,” and renders verse 9'
    key: bdb
    url: 'https://biblehub.com/hebrew/3427.htm'
    quote: 'giving a dwelling to her that is barren of house'
  - where: 'note 113:6 “He stoops to look, and He gives seats”'
    claim: 'A modern translation of verse 9'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20113&version=NRSVUE'
    quote: '9 He gives the barren woman a home,'
  - where: 'note 113:6 “He stoops to look, and He gives seats”'
    claim: 'A modern translation of verse 8 keeps the sitting'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20113&version=NRSVUE'
    quote: '8 to make them sit with princes,'

  # ---- note 113:7 ----
  - where: 'note 113:7 “Hannah’s song, and Mary’s”'
    claim: 'Hannah’s song has the words of verses 7–8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/2?lang=eng'
    quote: 'He raiseth up the poor out of the dust, and lifteth up the beggar from the dunghill, to set them among princes, and to make them inherit the throne of glory'
  - where: 'note 113:7 “Hannah’s song, and Mary’s”'
    claim: 'The Hebrew noun is a refuse heap or dunghill, perhaps an ash heap (the lexicon marks that sense as doubtful), the beggars’ resting place in both verses; the lexicon compares Job 2:8'
    key: bdb
    url: 'https://biblehub.com/hebrew/830.htm'
    quote: 'ash-heap(?), refuse-heap, dung-hill (probably originally fire-place stones, compare Arabic below √); — ׳א absolute as beggars'' resting-place 1 Samuel 2:8 = Psalm 113:7'
  - where: 'note 113:7 “Hannah’s song, and Mary’s”'
    claim: 'A modern translation has “ash heap”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20113&version=NRSVUE'
    quote: 'and lifts the needy from the ash heap,'
  - where: 'note 113:7 “Hannah’s song, and Mary’s”'
    claim: 'Job sat among the ashes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/2?lang=eng'
    quote: 'And he took him a potsherd to scrape himself withal; and he sat down among the ashes.'
  - where: 'note 113:7 “Hannah’s song, and Mary’s”'
    claim: 'Hannah’s song speaks of the barren woman bearing; Hannah had been barren'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/1?lang=eng'
    quote: 'because the Lord had shut up her womb.'
  - where: 'note 113:7 “Hannah’s song, and Mary’s”'
    claim: 'One reading: the thoughts of verses 7–8 are taken from Hannah’s song'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/113.htm'
    quote: 'The thoughts of Psalm 113:7 and Psalm 113:8 are transplanted from the song of Hannah.'
  - where: 'note 113:7 “Hannah’s song, and Mary’s”'
    claim: 'One reading: verse 9 has Hannah’s own exaltation in view, in the psalmist’s own words'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/113.htm'
    quote: 'Together with the song of Hannah the poet has before his eye Hannah''s exaltation out of sorrow and reproach.'
  - where: 'note 113:7 “Hannah’s song, and Mary’s”'
    claim: 'The psalmist does not repeat 1 Sam. 2:5 but generalizes Hannah’s experience'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/113.htm'
    quote: 'He does not, however, repeat the words of her song which have reference to this (1 Samuel 2:5), but clothes his generalization of her experience in his own language.'
  - where: 'note 113:7 “Hannah’s song, and Mary’s”'
    claim: 'Mary’s song is in the same strain as Hannah’s and this psalm, because of God’s condescension to the lowly'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/113.htm'
    quote: 'Thus it becomes explicable that Mary in her Magnificat breaks forth into the same strain with the song of Hannah (1 Samuel 2) and this Psalm.'
  - where: 'note 113:7 “Hannah’s song, and Mary’s”'
    claim: 'The psalm gives prominence to the condescension of the exalted God toward the lowly'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/113.htm'
    quote: 'the Psalm gives prominence to the condescension of the infinitely exalted One towards the lowly one'
  - where: 'note 113:7 “Hannah’s song, and Mary’s”'
    claim: 'The Church’s footnote at Luke 1:46 sends the reader of Mary’s song to Hannah’s'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: '1 Sam. 2:1 (1–10)'
  - where: 'note 113:7 “Hannah’s song, and Mary’s”'
    claim: 'Mary’s words on the low estate and the lowly exalted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'He hath put down the mighty from their seats, and exalted them of low degree.'

  # ---- christ ----
  - where: 'christ'
    claim: '“LORD” in the Old Testament usually means Jehovah'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Usually, when the word Lord appears in the Old Testament, it means “Jehovah.”'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: 'christ'
    claim: 'The Church’s footnote on “humbleth” in verse 6 points to the Topical Guide entry on the condescension of Jesus Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/113?lang=eng'
    quote: 'TG Jesus Christ, Condescension of.'
  - where: 'christ'
    claim: 'The angel asks Nephi about the condescension of God and shows him the Son of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/11?lang=eng'
    quote: 'And he said unto me: Knowest thou the condescension of God?'
  - where: 'christ'
    claim: 'Nephi sees the Lamb of God among the people, healing the sick'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/11?lang=eng'
    quote: 'I beheld the Lamb of God going forth among the children of men. And I beheld multitudes of people who were sick'
  - where: 'christ'
    claim: 'The hymn the Savior sang after the Last Supper was probably the Hallel'
    key: nt-student-manual-9
    url: 'https://www.churchofjesuschrist.org/study/manual/new-testament-student-manual/introduction-to-matthew/chapter-9?lang=eng'
    quote: 'The “hymn” the Savior and His disciples sang at the conclusion of the Last Supper was probably the traditional Jewish recitation from Psalms 113–18, called the Hallel.'

  # ---- parallels ----
  - where: 'parallels'
    claim: 'The song at the sea asks who is like the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/15?lang=eng'
    quote: 'Who is like unto thee, O Lord, among the gods?'
