chapter: 18
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'The title ascribes the psalm to David and dates it to the time of his deliverance from all his enemies and from Saul'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'who spake unto the Lord the words of this song in the day that the Lord delivered him from the hand of all his enemies, and from the hand of Saul'
  - where: setting
    claim: 'The same song is 2 Samuel 22, introduced in nearly the words of the title'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/22?lang=eng'
    quote: 'And David spake unto the Lord the words of this song in the day that the Lord had delivered him out of the hand of all his enemies, and out of the hand of Saul'
  - where: setting
    claim: 'The next chapter of Samuel begins with David’s last words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/23?lang=eng'
    quote: 'Now these be the last words of David.'
  - where: setting
    claim: 'Psalm 18 is listed among the songs of thanksgiving, which are defined so'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'These psalms reflect the gratitude of an individual or community after they have been delivered from a trial by God: 18, 30, 34, 40, 66, 92, 116, 118, and 138.'
  - where: setting
    claim: 'Psalm 18 is also listed among the royal psalms'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'Psalm 18, for example, could fit in category 3 in that it provides thanksgiving after a successful battle'
  - where: setting
    claim: 'Psalm 18 is a royal psalm and has been called the king’s psalm of thanksgiving'
    key: ot-minute-psalm-18-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1813'
    quote: 'Psalm 18 has been called the king’s psalm of thanksgiving.'

  - where: setting
    claim: 'Psalm 144:7 borrows from this psalm'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/18.htm'
    quote: 'the borrowed passage, Psalm 144:7'
  - where: setting
    claim: 'Habakkuk 3:19 echoes the line on hinds’ feet (verse 33; the commentary numbers by the Hebrew)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/18.htm'
    quote: 'writers of the later time of the kings here and there use language which is borrowed from it or are echoes of it (comp. Proverbs 30:5 with Psalm 18:31; Habakkuk 3:19 with Psalm 18:34)'

  # ---------- thread ----------
  - where: thread
    claim: 'The psalm divides into two halves, the second beginning at King James verse 31 (Hebrew 18:32)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/18.htm'
    quote: 'The Psalm divides into two halves; for the strain of praise begins anew with Psalm 18:32, after having run its first course and come to a beautiful close in Psalm 18:31.'

  # ---------- sections ----------
  - where: section 1 plain
    claim: 'Verse 2: the second “rock,” and “take refuge”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2018&version=NRSVUE'
    quote: 'my God, my rock in whom I take refuge,'
  - where: section 2 plain
    claim: 'Verses 4–5: cords, Sheol, confronted'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2018&version=NRSVUE'
    quote: 'the cords of Sheol entangled me;'
  - where: section 4 plain
    claim: 'Verses 16–19: reached down, support, a broad place'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2018&version=NRSVUE'
    quote: 'He brought me out into a broad place;'
  - where: section 5 plain
    claim: 'Verse 23: “upright” rendered “blameless”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2018&version=NRSVUE'
    quote: 'I was blameless before him,'
  - where: section 6 plain
    claim: 'Verses 25–27: loyal, crooked and shrewd, a humble people'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2018&version=NRSVUE'
    quote: 'With the loyal you show yourself loyal;'
  - where: section 6 plain
    claim: 'Verse 28: “candle” is a lamp'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2018&version=NRSVUE'
    quote: 'It is you who light my lamp;'
  - where: section 7 plain
    claim: 'Verses 33–34: a deer’s feet; a bow of bronze, bent'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2018&version=NRSVUE'
    quote: 'so that my arms can bend a bow of bronze.'
  - where: section 8 plain
    claim: 'Verse 40: “given me the necks” means made them turn their backs'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2018&version=NRSVUE'
    quote: 'You made my enemies turn their backs to me,'
  - where: section 8 plain
    claim: 'Verses 43–45: nations; foreigners who lose heart and come out of their strongholds'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2018&version=NRSVUE'
    quote: 'and came trembling out of their strongholds.'

  # ---------- note 18:0 the same song ----------
  - where: 'note 18:0 “The same song is in 2 Samuel 22”'
    claim: '2 Samuel 22 gives the same song, beginning with the psalm’s verse 2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/22?lang=eng'
    quote: 'And he said, The Lord is my rock, and my fortress, and my deliverer;'
  - where: 'note 18:0 “The same song is in 2 Samuel 22”'
    claim: 'Samuel’s copy stands after a chapter on David’s Philistine wars'
    key: ot-minute-psalm-18-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1813'
    quote: 'a version of Psalm 18 appears in 2 Samuel 22, inserted after a chapter concerning David’s battles against the Philistines'
  - where: 'note 18:0 “The same song is in 2 Samuel 22”'
    claim: 'Samuel has “waves of death” where the psalm has “sorrows of death”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/22?lang=eng'
    quote: 'When the waves of death compassed me, the floods of ungodly men made me afraid;'
  - where: 'note 18:0 “The same song is in 2 Samuel 22”'
    claim: 'Samuel has “thou art my lamp” at the psalm’s verse 28, and “tower of salvation” in the last verse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/22?lang=eng'
    quote: 'He is the tower of salvation for his king: and sheweth mercy to his anointed, unto David, and to his seed for evermore.'

  # ---------- note 18:0 when ----------
  - where: 'note 18:0 “When David sang it, and why Saul is named”'
    claim: '“In the day” means at the time'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/18.htm'
    quote: 'equals at the time, as in Genesis 2:4, and frequently'

  - where: 'note 18:0 “When David sang it, and why Saul is named”'
    claim: 'The Bible Dictionary places the psalm at the height of the kingdom'
    key: bd-david
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/david?lang=eng'
    quote: 'while Ps. 18 (2 Sam. 22) marks the highest point of the national prosperity'
  - where: 'note 18:0 “When David sang it, and why Saul is named”'
    claim: 'One older reading: the song comes after the promises of 2 Samuel 7 and its close looks back to them'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/18.htm'
    quote: 'springs entirely from the new self-consciousness to which he was raised by the promises recorded in 2 Samuel 7; and towards the end, it closes with express retrospective reference to these promises'
  - where: 'note 18:0 “When David sang it, and why Saul is named”'
    claim: 'Saul is singled out because that danger was the most personal and the longest'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/18.htm'
    quote: 'The deliverance out of the hand of Saul is made specially prominent'
  - where: 'note 18:0 “When David sang it, and why Saul is named”'
    claim: 'The danger from Saul described'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/18.htm'
    quote: 'was of the most personal, the most perilous, and the most protracted kind'
  - where: 'note 18:0 “When David sang it, and why Saul is named”'
    claim: 'David is the first after Moses and Joshua called the servant of the LORD'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/18.htm'
    quote: 'who is the first after Moses and Joshua to bear this designation'

  - where: 'note 18:0 “When David sang it, and why Saul is named”'
    claim: 'The title calls David the servant of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'A Psalm of David, the servant of the Lord'
  - where: 'note 18:2 “A horn is strength”'
    claim: 'Adonijah caught hold of the horns of the altar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/1?lang=eng'
    quote: 'And Adonijah feared because of Solomon, and arose, and went, and caught hold on the horns of the altar.'

  # ---------- note 18:1 ----------
  - where: 'note 18:1 “A word for love found in this form only here”'
    claim: 'The verb of verse 1 is racham (Strong’s 7355) in the simple (Qal) stem'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֶרְחָמְ/ךָ֖'
  - where: 'note 18:1 “A word for love found in this form only here”'
    claim: 'The lexicon lists the simple stem for this verse alone, notes that the line is not in 2 Samuel 22, and suggests it may be a gloss'
    key: bdb
    url: 'https://biblehub.com/hebrew/7355.htm'
    quote: 'I love thee (perhaps gloss; see not in'
  - where: 'note 18:1 “A word for love found in this form only here”'
    claim: 'Elsewhere the verb means to have compassion'
    key: bdb
    url: 'https://biblehub.com/hebrew/7355.htm'
    quote: 'have compassion, compassionate'
  - where: 'note 18:1 “A word for love found in this form only here”'
    claim: 'Its subject is usually God, with His people as object; Psalm 103:13 is listed'
    key: bdb
    url: 'https://biblehub.com/hebrew/7355.htm'
    quote: '1 usually of God: with accusative of his people'
  - where: 'note 18:1 “A word for love found in this form only here”'
    claim: 'A modern translation has “I love you”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2018&version=NRSVUE'
    quote: 'I love you, O Lord, my strength.'
  - where: 'note 18:1 “A word for love found in this form only here”'
    claim: 'Samuel’s copy begins with the psalm’s verse 2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/22?lang=eng'
    quote: 'And he said, The Lord is my rock, and my fortress, and my deliverer;'
  - where: 'note 18:1 “A word for love found in this form only here”'
    claim: 'The first verse expresses intimacy and devotion'
    key: ot-minute-psalm-18-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1813'
    quote: 'Note the feelings of intimacy and devotion for the Lord expressed in the first verse'

  # ---------- note 18:2 names ----------
  - where: 'note 18:2 “Names from the wilderness years”'
    claim: 'The metaphors of verse 2 convey the speaker’s past experience of the Lord’s protection'
    key: ot-minute-psalm-18-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1813'
    quote: 'using several metaphors that communicate the speaker’s experience with the Lord’s protection and security in times past'
  - where: 'note 18:2 “Names from the wilderness years”'
    claim: 'The first “rock” is sela (Strong’s 5553)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'סַֽלְעִ֥/י'
  - where: 'note 18:2 “Names from the wilderness years”'
    claim: 'Sela means a crag or cliff'
    key: bdb
    url: 'https://biblehub.com/hebrew/5553.htm'
    quote: 'crag, cliff, synonym'
  - where: 'note 18:2 “Names from the wilderness years”'
    claim: 'The cliff of 1 Samuel 23:25, 28 is listed among particular cliffs called sela'
    key: bdb
    url: 'https://biblehub.com/hebrew/5553.htm'
    quote: '1 Samuel 23:28 compare 1 Samuel 23:25'
  - where: 'note 18:2 “Names from the wilderness years”'
    claim: 'The place where Saul broke off the pursuit was named Sela-hammahlekoth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/23?lang=eng'
    quote: 'Wherefore Saul returned from pursuing after David, and went against the Philistines: therefore they called that place Sela-hammahlekoth.'
  - where: 'note 18:2 “Names from the wilderness years”'
    claim: '“Fortress” is metsudah (Strong’s 4686)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וּ/מְצוּדָתִ֗/י'
  - where: 'note 18:2 “Names from the wilderness years”'
    claim: 'Metsudah means a fastness or stronghold'
    key: bdb
    url: 'https://biblehub.com/hebrew/4686.htm'
    quote: 'noun feminine fastness, stronghold'
  - where: 'note 18:2 “Names from the wilderness years”'
    claim: 'It is the word for David’s “hold” in 1 Samuel 22:4–5 and 24:22 (Hebrew 24:23)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4686.htm'
    quote: 'fastness of David, 1 Samuel 22:4,5; 1 Samuel 24:23'
  - where: 'note 18:2 “Names from the wilderness years”'
    claim: '“My strength” in the middle of verse 2 is tsur, rock (Strong’s 6697)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'צ֭וּרִ/י'
  - where: 'note 18:2 “Names from the wilderness years”'
    claim: 'A modern translation has “my rock in whom I take refuge”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2018&version=NRSVUE'
    quote: 'my God, my rock in whom I take refuge,'
  - where: 'note 18:2 “Names from the wilderness years”'
    claim: 'Tsur is the word in “the rocks of the wild goats” (1 Samuel 24:2; Hebrew 24:3)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6697.htm'
    quote: 'home of goats 1 Samuel 24:3'
  - where: 'note 18:2 “Names from the wilderness years”'
    claim: '“Trust” is the verb chasah, to take refuge (Strong’s 2620)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֶֽחֱסֶה'
  - where: 'note 18:2 “Names from the wilderness years”'
    claim: 'Used of God, tsur means the support and defence of His people'
    key: bdb
    url: 'https://biblehub.com/hebrew/6697.htm'
    quote: 'figurative of God (33 t.) as support and defence of his people'
  - where: 'note 18:2 “Names from the wilderness years”'
    claim: 'In Deuteronomy 32 it is a name of God'
    key: bdb
    url: 'https://biblehub.com/hebrew/6697.htm'
    quote: 'proper name, of deity (the Rock Deuteronomy 32:4,18'

  # ---------- note 18:2 horn ----------
  - where: 'note 18:2 “A horn is strength”'
    claim: 'A horn was a symbol of strength and power'
    key: ot-minute-psalm-18-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1813'
    quote: 'In biblical times, a horn was a symbol of strength and power.'
  - where: 'note 18:2 “A horn is strength”'
    claim: 'The lexicon files this verse under the horn as a symbol of strength, said of the LORD as deliverer'
    key: bdb
    url: 'https://biblehub.com/hebrew/7161.htm'
    quote: 'figurative, of person, symbol of strength'
  - where: 'note 18:2 “A horn is strength”'
    claim: 'The horns of the altar were a place of refuge'
    key: ot-minute-psalm-18-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1813'
    quote: 'The horns of the altar became a place of refuge for those seeking sanctuary and mercy (see 1 Kings 1:50–53).'
  - where: 'note 18:2 “A horn is strength”'
    claim: 'Jesus Christ is called the horn of salvation in Luke 1:69'
    key: ot-minute-psalm-18-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1813'
    quote: 'The Savior Jesus Christ is referred to as the “horn of salvation” (Luke 1:69).'
  - where: 'note 18:2 “A horn is strength”'
    claim: 'Hannah’s song has the lifted horn at its beginning and end'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/2?lang=eng'
    quote: 'and he shall give strength unto his king, and exalt the horn of his anointed'

  # ---------- note 18:4 ----------
  - where: 'note 18:4 “Cords, or pangs”'
    claim: 'The word behind “sorrows” is chevel (Strong’s 2256)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חֶבְלֵי'
  - where: 'note 18:4 “Cords, or pangs”'
    claim: 'The Hebrew word can mean cord or pain'
    key: sc-knowhy-93
    url: 'https://scripturecentral.org/knowhy/why-does-abinadi-use-the-phrase-the-bands-of-death'
    quote: 'The Hebrew word hevel expresses an impressive array of meanings, including “cord, rope, band, snare” or “pain, pang, travail”'
  - where: 'note 18:4 “Cords, or pangs”'
    claim: 'The ancient Greek has “pangs”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/18.htm'
    quote: 'The pangs of death compassed me, and the torrents of ungodliness troubled me exceedingly.'
  - where: 'note 18:4 “Cords, or pangs”'
    claim: 'A modern translation has cords in both verses'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2018&version=NRSVUE'
    quote: 'The cords of death encompassed me;'
  - where: 'note 18:4 “Cords, or pangs”'
    claim: 'Verse 5 in a modern translation: cords of Sheol, and “confronted” for “prevented”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2018&version=NRSVUE'
    quote: 'the cords of Sheol entangled me;'

  - where: 'note 18:4 “Cords, or pangs”'
    claim: 'The lexicon reads the phrase with Sheol as cords, and for verse 4 prefers the wording of 2 Samuel 22:5'
    key: bdb
    url: 'https://biblehub.com/hebrew/2256.htm'
    quote: 'see 2 Samuel 22:5 and'
  - where: 'note 18:4 “Cords, or pangs”'
    claim: 'The same spelling serves two nouns, “cord” and “pain, pang”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2256.htm'
    quote: 'noun masculineIsaiah 66:7 (but see Jeremiah 49:24) pain, pang'
  - where: 'note 18:4 “Cords, or pangs”'
    claim: 'Samuel has “waves of death”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/22?lang=eng'
    quote: 'When the waves of death compassed me, the floods of ungodly men made me afraid;'
  - where: 'note 18:4 “Cords, or pangs”'
    claim: '“Hell” in verse 5 is Sheol'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שְׁא֣וֹל'

  # ---------- note 18:5 ----------
  - where: 'note 18:5 “The bands of death, and the king’s rescue read of Christ”'
    claim: 'The Hebrew phrase of verse 4 can be translated “bands of death”'
    key: sc-knowhy-93
    url: 'https://scripturecentral.org/knowhy/why-does-abinadi-use-the-phrase-the-bands-of-death'
    quote: 'that can be translated “bands of death” (as in the Darby Bible Translation). The phrase appears in Psalms 18:4 and 116:3'
  - where: 'note 18:5 “The bands of death, and the king’s rescue read of Christ”'
    claim: 'Abinadi and Alma seem to know the phrase'
    key: ot-minute-psalm-18-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1845'
    quote: 'both Abinadi and Alma the Younger seem to be familiar with the Hebrew phrase heveli-mot'
  - where: 'note 18:5 “The bands of death, and the king’s rescue read of Christ”'
    claim: 'Alma joins “the chains of hell” to “the bands of death”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/5?lang=eng'
    quote: 'they were encircled about by the bands of death, and the chains of hell'
  - where: 'note 18:5 “The bands of death, and the king’s rescue read of Christ”'
    claim: 'One reading: the psalm’s imagery prefigures the Savior’s death and resurrection'
    key: ot-minute-psalm-18-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1845'
    quote: 'A close reading of Psalm 18 reveals imagery that can, similarly, be understood as prefiguring Jesus Christ’s death and resurrection (and perhaps also His baptism).'
  - where: 'note 18:5 “The bands of death, and the king’s rescue read of Christ”'
    claim: 'The psalm presents a royal figure who cries out and is saved from death'
    key: ot-minute-psalm-18-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1845'
    quote: 'The king cries out to God and is then miraculously saved from death.'
  - where: 'note 18:5 “The bands of death, and the king’s rescue read of Christ”'
    claim: 'The royal figure is the Lord’s anointed of verse 50'
    key: ot-minute-psalm-18-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1845'
    quote: 'The psalm presents a royal figure'

  # ---------- note 18:7 ----------
  - where: 'note 18:7 “A rescue told as the LORD’s coming in storm”'
    claim: 'No such event is recorded in David’s life'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/18.htm'
    quote: 'we find no express record of any incident in David''s life of the kind recorded in 1 Samuel 7:10'
  - where: 'note 18:7 “A rescue told as the LORD’s coming in storm”'
    claim: 'One older reading: a real experience, idealised into a grand picture'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/18.htm'
    quote: 'works up into a grand majestic picture of his miraculous deliverance'
  - where: 'note 18:7 “A rescue told as the LORD’s coming in storm”'
    claim: 'The description may be meant to recall Sinai'
    key: ot-minute-psalm-18-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-186-19'
    quote: 'is meant to invoke in the audience the memory of God’s unforgettable visitation on Mount Sinai'
  - where: 'note 18:7 “A rescue told as the LORD’s coming in storm”'
    claim: 'A theophany is a divine appearance'
    key: ot-minute-psalm-18-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-186-19'
    quote: 'theophany (or divine appearance)'
  - where: 'note 18:7 “A rescue told as the LORD’s coming in storm”'
    claim: 'The martial imagery is nearer Judges 5 and Habakkuk 3; Exodus 15 is also compared'
    key: ot-minute-psalm-18-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-186-19'
