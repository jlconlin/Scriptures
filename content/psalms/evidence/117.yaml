chapter: 117
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The psalm has no title; the Church’s edition prints only a chapter heading above verse 1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/117?lang=eng'
    quote: 'O praise the Lord, all ye nations: praise him, all ye people.'

  # ---- setting ----
  - where: 'setting'
    claim: 'Psalm 117 is the shortest psalm'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/117.htm'
    quote: 'this shortest of all the Psalms, a Hallelujah addressed to the heathen world'
  - where: 'setting'
    claim: 'Psalms 113–118 are the Hallel, recited at the great feasts'
    key: bd-hallel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hallel?lang=eng'
    quote: 'A name given to the group of Psalms (113–18) recited by Jews at the great feasts (Matt. 26:30; Mark 14:26).'
  - where: 'setting'
    claim: 'The singing of Psalms 113–118 was among the ceremonies later added to the Passover'
    key: bd-feasts
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/feasts?lang=eng'
    quote: 'In later times the following ceremonies were added: … (3) Ps. 113–18 (the Hallel) were sung.'
  - where: 'setting'
    claim: 'Psalm 116 is a thanksgiving psalm that ends in hallelujah, and Psalm 117 follows it'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/117.htm'
    quote: 'The thanksgiving Psalm ending in Hallelujah is followed by this shortest of all the Psalms'
  - where: 'setting'
    claim: 'Psalm 116 ends in the courts of the LORD’s house with “Praise ye the LORD”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/116?lang=eng'
    quote: 'In the courts of the Lord’s house, in the midst of thee, O Jerusalem. Praise ye the Lord.'
  - where: 'setting'
    claim: 'Paul quotes verse 1 in Romans 15:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/15?lang=eng'
    quote: 'And again, Praise the Lord, all ye Gentiles; and laud him, all ye people.'
  - where: 'setting'
    claim: 'The quotation is one of a series on the Gentiles glorifying God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/15?lang=eng'
    quote: 'And that the Gentiles might glorify God for his mercy; as it is written'

  # ---- thread ----
  - where: 'thread'
    claim: 'Paul quotes verse 1 in Romans'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/15?lang=eng'
    quote: 'And again, Praise the Lord, all ye Gentiles; and laud him, all ye people.'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Great” in verse 2 is a verb of strength, to prevail'
    key: bdb
    url: 'https://biblehub.com/hebrew/1396.htm'
    quote: 'with עַל prevail over, subject enemies 2 Samuel 11:23, blessings Genesis 49:26(J), mercy of God Psalm 103:11; Psalm 117:2.'
  - where: 'section 1 plain'
    claim: '“Truth” in verse 2 is rendered “faithfulness,” and “people” as “peoples”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20117&version=NRSVUE'
    quote: 'and the faithfulness of the Lord endures forever.'

  # ---- note 117:1 ----
  - where: 'note 117:1 “Paul’s scripture for the Gentiles”'
    claim: 'Paul quotes verse 1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/15?lang=eng'
    quote: 'And again, Praise the Lord, all ye Gentiles; and laud him, all ye people.'
  - where: 'note 117:1 “Paul’s scripture for the Gentiles”'
    claim: '“Gentiles” means “the nations”'
    key: bd-gentile
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gentile?lang=eng'
    quote: 'The word Gentiles means “the nations” and eventually came to be used to mean all those not of the house of Israel.'
  - where: 'note 117:1 “Paul’s scripture for the Gentiles”'
    claim: 'The first of Paul’s four passages (Romans 15:9) is Psalm 18:49'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'Therefore will I give thanks unto thee, O Lord, among the heathen, and sing praises unto thy name.'
  - where: 'note 117:1 “Paul’s scripture for the Gentiles”'
    claim: 'Romans 15:9 introduces the first passage'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/15?lang=eng'
    quote: 'as it is written, For this cause I will confess to thee among the Gentiles, and sing unto thy name.'
  - where: 'note 117:1 “Paul’s scripture for the Gentiles”'
    claim: 'The second of the four passages (Romans 15:10) comes between, so that the psalm is third'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/15?lang=eng'
    quote: 'And again he saith, Rejoice, ye Gentiles, with his people.'
  - where: 'note 117:1 “Paul’s scripture for the Gentiles”'
    claim: 'The last of the four is Isaiah’s root of Jesse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/15?lang=eng'
    quote: 'And again, Esaias saith, There shall be a root of Jesse, and he that shall rise to reign over the Gentiles; in him shall the Gentiles trust.'
  - where: 'note 117:1 “Paul’s scripture for the Gentiles”'
    claim: 'Paul’s introducing sentence has “the truth of God” and the promises to the fathers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/15?lang=eng'
    quote: 'Now I say that Jesus Christ was a minister of the circumcision for the truth of God, to confirm the promises made unto the fathers:'
  - where: 'note 117:1 “Paul’s scripture for the Gentiles”'
    claim: 'The same sentence has the Gentiles glorifying God “for his mercy”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/15?lang=eng'
    quote: 'And that the Gentiles might glorify God for his mercy; as it is written'

  # ---- note 117:2 toward us ----
  - where: 'note 117:2 “Who “us” is, and why the nations should praise for it”'
    claim: 'On Delitzsch’s reading the mercy of verse 2 is mercy over Israel'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/117.htm'
    quote: 'the mercy or loving-kindness of Jahve, which proves itself mighty over Israel'
  - where: 'note 117:2 “Who “us” is, and why the nations should praise for it”'
    claim: 'The verb behind “is great,” with the preposition, means prevail over, and is used of God’s mercy here and in Psalm 103:11'
    key: bdb
    url: 'https://biblehub.com/hebrew/1396.htm'
    quote: 'with עַל prevail over, subject enemies 2 Samuel 11:23, blessings Genesis 49:26(J), mercy of God Psalm 103:11; Psalm 117:2.'
  - where: 'note 117:2 “Who “us” is, and why the nations should praise for it”'
    claim: 'Delitzsch: mercy and truth will be displayed in Israel and go out from Israel to the world'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/117.htm'
    quote: 'Mercy and truth are the two divine powers which shall one day be perfectly developed and displayed in Israel, and going forth from Israel, shall conquer the world.'

  # ---- note 117:2 truth ----
  - where: 'note 117:2 “Mercy and truth, the pair from Sinai”'
    claim: 'At Sinai the LORD proclaimed Himself abundant in goodness and truth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/34?lang=eng'
    quote: 'And the Lord passed by before him, and proclaimed, The Lord, The Lord God, merciful and gracious, longsuffering, and abundant in goodness and truth,'
  - where: 'note 117:2 “Mercy and truth, the pair from Sinai”'
    claim: '“Merciful kindness” in Psalm 117:2 is hesed (Strong’s 2617)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חַסְדּ֗/וֹ'
  - where: 'note 117:2 “Mercy and truth, the pair from Sinai”'
    claim: '“Truth” in Psalm 117:2 is emeth (Strong’s 571)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וֶֽ/אֱמֶת'
  - where: 'note 117:2 “Mercy and truth, the pair from Sinai”'
    claim: '“Goodness” in Exodus 34:6 is hesed (Strong’s 2617)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'חֶ֥סֶד'
  - where: 'note 117:2 “Mercy and truth, the pair from Sinai”'
    claim: '“Truth” in Exodus 34:6 is emeth (Strong’s 571)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וֶ/אֱמֶֽת'
  - where: 'note 117:2 “Mercy and truth, the pair from Sinai”'
    claim: 'The lexicon lists the two as associated attributes, beginning from Exodus 34:6, and gives “faithfulness” for the word in Psalm 117:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/571.htm'
    quote: 'these attributes are also associated Psalm 40:11; Psalm 40:12; Psalm 61:8; Psalm 115:1; Psalm 138:2; Isaiah 16:5; Genesis 24:27 (J)'
  - where: 'note 117:2 “Mercy and truth, the pair from Sinai”'
    claim: 'In Psalm 117:2 the word is God’s faithfulness'
    key: bdb
    url: 'https://biblehub.com/hebrew/571.htm'
    quote: 'the faithfulness of God endureth for ever Psalm 117:2'
  - where: 'note 117:2 “Mercy and truth, the pair from Sinai”'
    claim: 'A modern translation has “faithfulness”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20117&version=NRSVUE'
    quote: 'and the faithfulness of the Lord endures forever.'

  # ---- christ ----
  - where: 'christ'
    claim: 'LORD usually means Jehovah, and Jehovah is the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary (Mosiah 3:8; 15:1; 3 Ne. 15:1–5). Usually, when the word Lord appears in the Old Testament, it means “Jehovah.”'
  - where: 'christ'
    claim: 'Paul says Christ came to confirm the promises and that the Gentiles might glorify God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/15?lang=eng'
    quote: 'Now I say that Jesus Christ was a minister of the circumcision for the truth of God, to confirm the promises made unto the fathers:'
  - where: 'christ'
    claim: 'The Bible Dictionary gives Matthew 26:30 for the recitation of the Hallel at the feasts'
    key: bd-hallel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hallel?lang=eng'
    quote: 'A name given to the group of Psalms (113–18) recited by Jews at the great feasts (Matt. 26:30; Mark 14:26).'
  - where: 'christ'
    claim: 'The hymn of Matthew 26:30'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'And when they had sung an hymn, they went out into the mount of Olives.'

  # ---- explore / parallels ----
  - where: 'explore'
    claim: 'Psalms 113–118 are the Hallel'
    key: bd-hallel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hallel?lang=eng'
    quote: 'A name given to the group of Psalms (113–18) recited by Jews at the great feasts'
  - where: 'parallels'
    claim: 'Psalm 103:11 has “so great is his mercy,” with the same verb as verse 2'
    key: bdb
    url: 'https://biblehub.com/hebrew/1396.htm'
    quote: 'mercy of God Psalm 103:11; Psalm 117:2.'
  - where: 'parallels'
    claim: 'The wording of Psalm 103:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/103?lang=eng'
    quote: 'For as the heaven is high above the earth, so great is his mercy toward them that fear him.'
