chapter: 116
claims:
  # ---- setting ----
  - where: 'setting'
    claim: 'The psalm names no author and ends with hallelujah'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/116.htm'
    quote: 'We have here another anonymous Psalm closing with Hallelujah.'
  - where: 'setting'
    claim: 'The speaker is one person, giving thanks after a deadly danger'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/116.htm'
    quote: 'a thanksgiving song with a fresh recollection of some deadly peril that has just been got the better of'
  - where: 'setting'
    claim: 'Psalm 115 ends by saying the dead do not praise the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/115?lang=eng'
    quote: 'The dead praise not the Lord, neither any that go down into silence.'
  - where: 'setting'
    claim: 'Psalm 115 ends with “we will bless the LORD”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/115?lang=eng'
    quote: 'But we will bless the Lord from this time forth and for evermore. Praise the Lord.'
  - where: 'setting'
    claim: 'Psalms 113–118 are the Hallel, recited at the great feasts'
    key: bd-hallel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hallel?lang=eng'
    quote: 'A name given to the group of Psalms (113–18) recited by Jews at the great feasts (Matt. 26:30; Mark 14:26).'
  - where: 'setting'
    claim: 'The hymn sung at the Last Supper would have been part of the Hallel'
    key: bd-hymns
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hymns?lang=eng'
    quote: 'such as in the account of the Last Supper (Matt. 26:30), where the hymn would be part of the Hallel (Ps. 113–18'
  - where: 'setting'
    claim: 'Paul quotes verse 10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-cor/4?lang=eng'
    quote: 'We having the same spirit of faith, according as it is written, I believed, and therefore have I spoken; we also believe, and therefore speak;'

  # ---- section plains ----
  - where: 'section 1 plain'
    claim: '“Hell” in verse 3 is Sheol'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20116&version=NRSVUE'
    quote: 'the pangs of Sheol laid hold on me;'
  - where: 'section 3 plain'
    claim: '“In my haste” in verse 11 is “in my alarm”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2648.htm'
    quote: 'Infinitive with ב = noun, in my alarm Psalm 31:23; Psalm 116:11'

  # ---- note 116:3 ----
  - where: 'note 116:3 “The words of Psalm 18 for the edge of death”'
    claim: 'Psalm 18, David’s song, has the sorrows of death compassing him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'The sorrows of death compassed me, and the floods of ungodly men made me afraid.'
  - where: 'note 116:3 “The words of Psalm 18 for the edge of death”'
    claim: 'Psalm 18 has the sorrows of hell'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'The sorrows of hell compassed me about: the snares of death prevented me.'
  - where: 'note 116:3 “The words of Psalm 18 for the edge of death”'
    claim: 'Psalm 18 opens with love for the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'I will love thee, O Lord, my strength.'
  - where: 'note 116:3 “The words of Psalm 18 for the edge of death”'
    claim: 'The Hebrew word translated “hell” in verse 3 is Sheol'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שְׁא֣וֹל'
  - where: 'note 116:3 “The words of Psalm 18 for the edge of death”'
    claim: 'A modern translation leaves Sheol untranslated in verse 3'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20116&version=NRSVUE'
    quote: 'the pangs of Sheol laid hold on me;'

  # ---- note 116:8 ----
  - where: 'note 116:8 “What Psalm 56 asks, this psalm says is done”'
    claim: 'Psalm 56 ends with a statement of deliverance from death and a question about the feet and the walk before God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/56?lang=eng'
    quote: 'For thou hast delivered my soul from death: wilt not thou deliver my feet from falling, that I may walk before God in the light of the living?'

  # ---- note 116:10 ----
  - where: 'note 116:10 “Paul takes the line as his own”'
    claim: 'Paul quotes the verse as the spirit of his faith'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-cor/4?lang=eng'
    quote: 'We having the same spirit of faith, according as it is written, I believed, and therefore have I spoken; we also believe, and therefore speak;'
  - where: 'note 116:10 “Paul takes the line as his own”'
    claim: 'Paul goes on to the Resurrection'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-cor/4?lang=eng'
    quote: 'Knowing that he which raised up the Lord Jesus shall raise up us also by Jesus, and shall present us with you.'
  - where: 'note 116:10 “Paul takes the line as his own”'
    claim: 'The Greek translation reads “I believed, wherefore I have spoken”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/116.htm'
    quote: 'I believed, wherefore I have spoken: but I was greatly afflicted.'
  - where: 'note 116:10 “Paul takes the line as his own”'
    claim: 'A modern translation joins the halves of the verse differently'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20116&version=NRSVUE'
    quote: '10 I kept my faith, even when I said,'
  - where: 'note 116:10 “Paul takes the line as his own”'
    claim: 'The modern translation makes “I am greatly afflicted” what he said'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20116&version=NRSVUE'
    quote: '“I am greatly afflicted”;'

  # ---- note 116:11 ----
  - where: 'note 116:11 “Haste is alarm, not rashness”'
    claim: 'The verb means to be in a hurry or alarm, and this phrase is “in my alarm”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2648.htm'
    quote: 'be in a hurry or alarm, of hurried flight 2 Samuel 4:4; 2 Kings 7:15; Infinitive with ב = noun, in my alarm Psalm 31:23; Psalm 116:11'
  - where: 'note 116:11 “Haste is alarm, not rashness”'
    claim: 'A modern translation has “in my consternation”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20116&version=NRSVUE'
    quote: '11 I said in my consternation,'
  - where: 'note 116:11 “Haste is alarm, not rashness”'
    claim: 'Psalm 31:22 has the same phrase'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/31?lang=eng'
    quote: 'For I said in my haste, I am cut off from before thine eyes'

  # ---- note 116:12 ----
  - where: 'note 116:12 “The answer is a cup lifted in thanks”'
    claim: 'A modern translation has the cup lifted up'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20116&version=NRSVUE'
    quote: '13 I will lift up the cup of salvation'
  - where: 'note 116:12 “The answer is a cup lifted in thanks”'
    claim: 'One older reading: the cup is a figure from the Passover'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/116.htm'
    quote: 'by using a figure taken from the Passover (Matthew 26:27), the memorial repast in celebration of the redemption out of Egypt.'
  - where: 'note 116:12 “The answer is a cup lifted in thanks”'
    claim: 'The same reading: the cup is raised and drunk in thanks for manifold salvation'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/116.htm'
    quote: 'The cup of salvation is that which is raised aloft and drunk amidst thanksgiving for the manifold and abundant salvation'
  - where: 'note 116:12 “The answer is a cup lifted in thanks”'
    claim: 'The same reading: the vow offerings came with eating and drinking before God'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/116.htm'
    quote: 'A common and joyous eating and drinking in the presence of God was associated with the shelamim.'

  # ---- note 116:13 ----
  - where: 'note 116:13 “Sung on the night of Gethsemane”'
    claim: 'They sang a hymn and went to the Mount of Olives'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'And when they had sung an hymn, they went out into the mount of Olives.'
  - where: 'note 116:13 “Sung on the night of Gethsemane”'
    claim: 'The Savior prayed that the cup might pass'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/26?lang=eng'
    quote: 'O my Father, if it be possible, let this cup pass from me: nevertheless not as I will, but as thou wilt.'
  - where: 'note 116:13 “Sung on the night of Gethsemane”'
    claim: 'The hymn would be part of the Hallel'
    key: bd-hymns
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hymns?lang=eng'
    quote: 'where the hymn would be part of the Hallel (Ps. 113–18'
  - where: 'note 116:13 “Sung on the night of Gethsemane”'
    claim: 'Lambert: Psalms 115–118 were probably the last words Jesus sang with the disciples before Gethsemane'
    key: lambert-passover-easter
    url: 'https://interpreterfoundation.org/journal/our-faithful-lord-passover-to-easter'
    quote: 'Psalms 115–18 would probably have been the last words Jesus sang with his disciples before they left for Gethsamane.'
  - where: 'note 116:13 “Sung on the night of Gethsemane”'
    claim: 'Lambert asks the reader to consider Christ singing of the cup of salvation'
    key: lambert-passover-easter
    url: 'https://interpreterfoundation.org/journal/our-faithful-lord-passover-to-easter'
    quote: 'When we read the moving Hallel, we consider how Christ might have felt, singing about “the cup of salvation.”'
  - where: 'note 116:13 “Sung on the night of Gethsemane”'
    claim: 'Lambert sets the cup imagery beside the prayer in Gethsemane'
    key: lambert-passover-easter
    url: 'https://interpreterfoundation.org/journal/our-faithful-lord-passover-to-easter'
    quote: 'and in Gethsemane he said “Father, if you are willing, take this cup from me” (Matthew 26:39, Mark 14:36, Luke 22:42).'

  # ---- note 116:15 ----
  - where: 'note 116:15 “Why the death of his saints is precious”'
    claim: 'Psalm 72:14 says the blood of the poor is precious in the king’s sight'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/72?lang=eng'
    quote: 'He shall redeem their soul from deceit and violence: and precious shall their blood be in his sight.'
  - where: 'note 116:15 “Why the death of his saints is precious”'
    claim: 'One older reading takes Psalm 72:14 as the source of the line'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/116.htm'
    quote: 'as in the primary passage Psalm 72:14.'
  - where: 'note 116:15 “Why the death of his saints is precious”'
    claim: 'The same reading: God does not lightly allow the death of His saints'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/116.htm'
    quote: 'The death of His saints is no trifling matter with God; He does not lightly suffer it to come about; He does not suffer His own to be torn away from Him by death.'
  - where: 'note 116:15 “Why the death of his saints is precious”'
    claim: 'President Nelson: death is precious as a homecoming (note 13 of the talk)'
    key: nelson-decisions-eternity
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2013/10/decisions-for-eternity?lang=eng'
    quote: 'Death is precious because it is a “homecoming” for the Saint with the Lord.'
  - where: 'note 116:15 “Why the death of his saints is precious”'
    claim: 'A modern translation has “his faithful ones” for “his saints”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20116&version=NRSVUE'
    quote: 'is the death of his faithful ones.'

  # ---- note 116:17 ----
  - where: 'note 116:17 “A vow paid at the altar, and a meal”'
    claim: 'Leviticus names the sacrifice of thanksgiving among the peace offerings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'If he offer it for a thanksgiving, then he shall offer with the sacrifice of thanksgiving unleavened cakes mingled with oil'
  - where: 'note 116:17 “A vow paid at the altar, and a meal”'
    claim: 'Leviticus names the vow offering beside it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'But if the sacrifice of his offering be a vow, or a voluntary offering, it shall be eaten the same day that he offereth his sacrifice'
  - where: 'note 116:17 “A vow paid at the altar, and a meal”'
    claim: 'The thanksgiving sacrifice is a peace offering and is eaten'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/7?lang=eng'
    quote: 'And the flesh of the sacrifice of his peace offerings for thanksgiving shall be eaten the same day that it is offered'
  - where: 'note 116:17 “A vow paid at the altar, and a meal”'
    claim: 'The meal was the characteristic rite of the peace offering'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'The characteristic rite was the sacrificial meal.'
  - where: 'note 116:17 “A vow paid at the altar, and a meal”'
    claim: 'The worshipper and his household ate the rest of the flesh'
    key: bd-sacrifices
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/sacrifices?lang=eng'
    quote: 'the rest of the flesh was eaten by the sacrificer, his household, and the poorer Levites at the tabernacle.'
  - where: 'note 116:17 “A vow paid at the altar, and a meal”'
    claim: 'Jonah promises thanksgiving and payment of his vow'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jonah/2?lang=eng'
    quote: 'But I will sacrifice unto thee with the voice of thanksgiving; I will pay that that I have vowed. Salvation is of the Lord.'

  # ---- christ ----
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ, and LORD usually stands for that name'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary (Mosiah 3:8; 15:1; 3 Ne. 15:1–5). Usually, when the word Lord appears in the Old Testament, it means “Jehovah.”'
  - where: 'christ'
    claim: 'The Last Supper hymn was from the Hallel'
    key: bd-hymns
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hymns?lang=eng'
    quote: 'where the hymn would be part of the Hallel (Ps. 113–18'

  # ---- explore ----
  - where: 'explore'
    claim: 'Lambert’s article follows the Passover meal with the Hallel in its place'
    key: lambert-passover-easter
    url: 'https://interpreterfoundation.org/journal/our-faithful-lord-passover-to-easter'
    quote: 'During the ﬁrst century ce, the Hallel (Psalms 113–18) were sung while the priests sacriﬁced lambs in the temple and during the Passover meal.'
  - where: 'explore'
    claim: 'The Savior speaks of the bitter cup'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/19?lang=eng'
    quote: 'and would that I might not drink the bitter cup, and shrink'

  # ---- parallels ----
  - where: 'parallels'
    claim: 'Psalm 72:14 has “precious” of the blood of the poor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/72?lang=eng'
    quote: 'and precious shall their blood be in his sight.'
