chapter: 110
claims:
  - where: 'when'
    claim: 'The title above the psalm is only “A Psalm of David”; it names no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/110?lang=eng'
    quote: 'A Psalm of David.'
  - where: 'setting'
    claim: 'The title above the psalm is only “A Psalm of David”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/110?lang=eng'
    quote: 'A Psalm of David.'
  - where: 'setting'
    claim: 'The psalm’s first setting was likely a coronation, where the LORD inducts the king as co-ruler and seats him at His right hand'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'In the original context of Psalm 110, the setting was likely a coronation'
  - where: 'setting'
    claim: 'Psalm 110:1 is the Old Testament text the New Testament quotes most often'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'Psalm 110:1 is the most-quoted Old Testament text in the New Testament, appearing over thirty times.'
  - where: 'setting'
    claim: 'Melchizedek is named in only two Old Testament passages, this psalm and Genesis 14'
    key: scripture-helps-ps-102
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/34-psalms-102-103-110-116-119-127-128-135-139-146-150?lang=eng'
    quote: 'Psalm 110 is one of only two passages in the Old Testament that mention Melchizedek'
  - where: 'setting'
    claim: 'Hebrews quotes verse 4 in its account of Christ’s priesthood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/7?lang=eng'
    quote: 'For he testifieth, Thou art a priest for ever after the order of Melchisedec.'

  - where: 'thread'
    claim: 'The law of Moses gave no priesthood to Judah, the king’s tribe'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/7?lang=eng'
    quote: 'For it is evident that our Lord sprang out of Juda; of which tribe Moses spake nothing concerning priesthood.'
  - where: 'thread'
    claim: 'Jesus put the question of David’s “my Lord” to the Pharisees'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/22?lang=eng'
    quote: 'If David then call him Lord, how is he his son?'

  - where: 'section 1 plain'
    claim: '“My Lord” is the word for a human lord or master, so “my lord”'
    key: bdb
    url: 'https://biblehub.com/hebrew/113.htm'
    quote: 'singular lord, master (1) reference to men'
  - where: 'section 1 plain'
    claim: '“The rod of thy strength” is rendered “your mighty scepter”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20110&version=NRSVUE'
    quote: 'your mighty scepter.'
  - where: 'section 1 plain'
    claim: '“Willing in the day of thy power” means volunteering on the day of the king’s host'
    key: bdb
    url: 'https://biblehub.com/hebrew/5071.htm'
    quote: 'thy people will be (all) voluntariness in the day of thy host (be ready to volunteer'
  - where: 'section 1 plain'
    claim: 'The Hebrew text of “the beauties of holiness” is “in holy splendor”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20110&version=NRSVUE'
    quote: 'MT in holy splendor'
  - where: 'section 1 plain'
    claim: '“Morning” is a noun meaning dawn'
    key: bdb
    url: 'https://biblehub.com/hebrew/4891.htm'
    quote: 'noun [masculine] dawn'
  - where: 'section 1 plain'
    claim: '“Thy youth” here means young men'
    key: bdb
    url: 'https://biblehub.com/hebrew/3208.htm'
    quote: '= young men'
  - where: 'section 1 plain'
    claim: 'A modern translation has the youth come to the king like dew'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20110&version=NRSVUE'
    quote: 'like dew, your youth will come to you.'
  - where: 'section 2 plain'
    claim: '“Will not repent” is “will not change his mind”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20110&version=NRSVUE'
    quote: 'The Lord has sworn and will not change his mind,'
  - where: 'section 2 plain'
    claim: '“After the order of” can be rendered “after the manner of”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1700.htm'
    quote: 'after the order, or manner, of Melchizedek Psalm 110:4'
  - where: 'section 3 plain'
    claim: '“Many countries” is a wide land or the wide earth'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20110&version=NRSVUE'
    quote: 'over the wide earth.'
  - where: 'section 3 plain'
    claim: '“Many countries” is a great, broad land'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/110.htm'
    quote: 'but upon a great (broad) land'
  - where: 'section 3 plain'
    claim: '“The heads” in verse 6 is a singular noun in Hebrew (H7218)'
    key: oshb-wlc
