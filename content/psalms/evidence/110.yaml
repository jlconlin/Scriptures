    quote: 'רֹ֝֗אשׁ'
  - where: 'section 3 plain'
    claim: '“The brook in the way” is the stream by the path'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20110&version=NRSVUE'
    quote: 'He will drink from the stream by the path;'

  - where: 'note 110:1 “LORD and Lord are two different Hebrew words”'
    claim: 'Jewish readers did not say the divine name but substituted Adonai'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'the Jews, in reading, never mentioned it but substituted one of the other names of God, usually Adonai'
  - where: 'note 110:1 “LORD and Lord are two different Hebrew words”'
    claim: 'The King James follows the custom and prints the name as LORD or GOD in small capitals'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'In the KJV, the Jewish custom has been followed, and the name is generally denoted by Lord or God, printed in small capitals.'
  - where: 'note 110:1 “LORD and Lord are two different Hebrew words”'
    claim: 'The first Lord of verse 1 is the divine name (H3068) and the second is adoni (H113 with a first-person suffix)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אדֹנִ֗'
  - where: 'note 110:1 “LORD and Lord are two different Hebrew words”'
    claim: 'Adon means lord or master, said of men: a master, a king'
    key: bdb
    url: 'https://biblehub.com/hebrew/113.htm'
    quote: 'singular lord, master (1) reference to men'
  - where: 'note 110:1 “LORD and Lord are two different Hebrew words”'
    claim: 'The Masoretic vowel pointing distinguishes the forms of the word used of God from the form used of a man; Psalm 110:1 is listed with the human form adoni'
    key: bdb
    url: 'https://biblehub.com/hebrew/113.htm'
    quote: 'are variations of Masoretic pointing to distinguish divine reference from human'
  - where: 'note 110:1 “LORD and Lord are two different Hebrew words”'
    claim: 'In the psalm Jehovah tells the king to sit at His right hand as an appointed ruler'
    key: scripture-helps-ps-102
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/34-psalms-102-103-110-116-119-127-128-135-139-146-150?lang=eng'
    quote: 'to sit at Jehovah’s right hand as an appointed ruler'
  - where: 'note 110:1 “LORD and Lord are two different Hebrew words”'
    claim: 'The Greek renders both Lords with the one word Kyrios'
    key: frederick-use-of-ot
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/use-old-testament-new-testament-gospels'
    quote: 'Both are rendered in the Greek of Psalm 110:1 and Mark’s Gospel as Kyrios.'
  - where: 'note 110:1 “LORD and Lord are two different Hebrew words”'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: gs-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth as a son of Mary'
  - where: 'note 110:1 “LORD and Lord are two different Hebrew words”'
    claim: 'The modern Latter-day Saint usage of Jehovah and Elohim was not taken from the Hebrew Bible and can mislead if imposed on it'
    key: davis-hoskisson-elohim
    url: 'https://rsc.byu.edu/vol-14-no-1-2013/usage-title-elohim'
    quote: 'Since the modern Latter-day Saint usage of Jehovah and Elohim was not taken from the Hebrew Bible, it can create misunderstandings if imposed upon the Hebrew scriptural account.'
  - where: 'note 110:1 “LORD and Lord are two different Hebrew words”'
    claim: 'Peter concludes from the verse that God made Jesus Lord and Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/2?lang=eng'
    quote: 'God hath made that same Jesus, whom ye have crucified, both Lord and Christ.'
  - where: 'note 110:1 “LORD and Lord are two different Hebrew words”'
    claim: 'Hebrews quotes verse 1 as spoken by God to the Son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/1?lang=eng'
    quote: 'But to which of the angels said he at any time, Sit on my right hand, until I make thine enemies thy footstool?'
  - where: 'note 110:1 “LORD and Lord are two different Hebrew words”'
    claim: 'The speaker in Hebrews 1 is the one who calls Himself the Son’s Father'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/1?lang=eng'
    quote: 'I will be to him a Father, and he shall be to me a Son'

