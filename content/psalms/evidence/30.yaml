  - where: 'note 30:5 “Weeping lodges for the night”'
    claim: 'The word for joy, with no verb beside it'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'רִנָּֽה'
  - where: 'note 30:5 “Weeping lodges for the night”'
    claim: 'Isaiah 54:7–8: a small moment, a little wrath, the hidden face'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/54?lang=eng'
    quote: 'In a little wrath I hid my face from thee for a moment; but with everlasting kindness will I have mercy on thee'
  - where: 'note 30:5 “Weeping lodges for the night”'
    claim: 'The Joseph Smith Translation of verse 5, as the Church’s footnote 5a gives it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/30?lang=eng'
    quote: 'For his anger kindleth against the wicked; they repent, and in a moment it is turned away, and they are in his favor, and he giveth them life; therefore, weeping may'

  # ---------- note 30:5 prophets ----------
  - where: 'note 30:5 “The morning as resurrection and as forgiveness”'
    claim: 'Elder Thomas S. Monson applied the verse to those who know that life continues beyond the grave'
    key: monson-hopeless-dawn
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/04/hopeless-dawn-joyful-morning?lang=eng'
    quote: 'knowing that life continues beyond the grave, she, her father, her brothers, her sisters, and indeed all who share this knowledge of divine truth can declare to the world: “Weeping may endure for a night, but joy cometh in the morning.”'
  - where: 'note 30:5 “The morning as resurrection and as forgiveness”'
    claim: 'He told of a child beside her mother’s casket'
    key: monson-hopeless-dawn
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/04/hopeless-dawn-joyful-morning?lang=eng'
    quote: 'she led me to the casket in which rested the body of her beloved mother'
  - where: 'note 30:5 “The morning as resurrection and as forgiveness”'
    claim: 'His testimony of the Son as the firstfruits of the resurrection and of the joyful morning'
    key: monson-hopeless-dawn
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1976/04/hopeless-dawn-joyful-morning?lang=eng'
    quote: 'his Beloved Son is the firstfruits of the resurrection, that the gospel of Jesus Christ is that penetrating light that makes of every hopeless dawn a joyful morning'
  - where: 'note 30:5 “The morning as resurrection and as forgiveness”'
    claim: 'Elder Craig C. Christensen of the Seventy applied the verse to repentance'
    key: christensen-exquisite-joy
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/26christensen?lang=eng'
    quote: 'The nights may seem long, but the morning does come, and oh, how exquisite is the peace and resplendent joy we feel as the Savior’s Atonement frees us from sin and suffering.'
  - where: 'note 30:5 “The morning as resurrection and as forgiveness”'
    claim: 'He quoted the psalmist in a section on repentance'
    key: christensen-exquisite-joy
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2023/04/26christensen?lang=eng'
    quote: 'As we repent of our sins, we must focus on the great joy that follows.'

  # ---------- note 30:6 ----------
  - where: 'note 30:6 “What he said in his ease”'
    claim: 'The word behind “prosperity”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בְ/שַׁלְוִ֑/י'
  - where: 'note 30:6 “What he said in his ease”'
    claim: 'It means ease, prosperity'
    key: bdb
    url: 'https://biblehub.com/hebrew/7959.htm'
    quote: 'ease, prosperity'
  - where: 'note 30:6 “What he said in his ease”'
    claim: 'Psalm 10:6 gives nearly the same sentence to the wicked'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/10?lang=eng'
    quote: 'He hath said in his heart, I shall not be moved: for I shall never be in adversity.'
  - where: 'note 30:6 “What he said in his ease”'
    claim: 'One older reading compares the speaker’s self-confidence with that of the wicked in Psalm 10:6'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/30.htm'
    quote: 'he contrasts his former self-confidence, in which (like the'
  - where: 'note 30:6 “What he said in his ease”'
    claim: 'On that reading he trusted the gift and not the Giver'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/30.htm'
    quote: 'Instead of confiding in the Giver, he trusted in the gift, as though it had been his own work.'
  - where: 'note 30:6 “What he said in his ease”'
    claim: 'The same reading points to Deuteronomy 8:11–18'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/30.htm'
    quote: 'The inevitable consequence of such carnal security, as it is more minutely described in Deuteronomy 8:11-18, is some humbling divine chastisement.'
  - where: 'note 30:6 “What he said in his ease”'
    claim: 'Deuteronomy 8:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/8?lang=eng'
    quote: 'Then thine heart be lifted up, and thou forget the Lord thy God'
  - where: 'note 30:6 “What he said in his ease”'
    claim: 'The same reading takes the mountain as Zion, the emblem of David’s kingdom'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/30.htm'
    quote: 'The mountain is Zion, which is strong by natural position and by the additions of art (2 Samuel 5:9); and this, as being the castle-hill, is the emblem of the kingdom of David'
  - where: 'note 30:6 “What he said in his ease”'
    claim: 'The ancient Greek has “my beauty” where the Hebrew has “my mountain”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/30.htm'
    quote: 'O Lord, in thy good pleasure thou didst add strength to my beauty: but thou didst turn away thy face, and I was troubled.'
  - where: 'note 30:6 “What he said in his ease”'
    claim: 'A modern translation makes the mountain a comparison for the speaker'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2030&version=NRSVUE'
    quote: 'you had established me as a strong mountain'
  - where: 'note 30:6 “What he said in his ease”'
    claim: 'On the same reading the withdrawal of favour was brought about by his self-exaltation'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/30.htm'
    quote: 'God''s withdrawal of favour, which is brought about by his self-exaltation'

