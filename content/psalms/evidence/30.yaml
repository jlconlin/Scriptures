chapter: 30
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'The title ascribes the psalm to David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/30?lang=eng'
    quote: 'A Psalm and Song at the dedication of the house of David.'
  - where: setting
    claim: 'The speaker cried to the LORD and was healed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/30?lang=eng'
    quote: 'I cried unto thee, and thou hast healed me.'
  - where: setting
    claim: 'The healing of verse 2 suggests a rescue from grave illness or injury and not from actual death'
    key: ot-minute-psalm-30
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-30'
    quote: 'may indicate that he was not brought back from actual death but from a serious, perhaps nearly fatal, illness or injury'
  - where: setting
    claim: 'Psalm 30 is counted among the songs of thanksgiving, which give thanks after deliverance from a trial'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'Songs of thanksgiving. These psalms reflect the gratitude of an individual or community after they have been delivered from a trial by God: 18, 30, 34, 40, 66, 92, 116, 118, and 138.'
  - where: setting
    claim: 'Such thanks would typically have been shown with a sacrifice at the temple and a sung psalm'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'This gratitude typically would have been demonstrated with a sacrifice at the temple, and accompanied by the singing of a hymn or psalm.'
  - where: setting
    claim: 'Psalm 30 belongs to the series Psalms 25–31, notable for covenant and temple themes'
    key: ot-minute-psalm-30
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-30'
    quote: 'Psalm 30 is another in the series of Psalms 25–31, which are notable for their focus on themes of covenant and temple.'
  - where: explore
    claim: 'Nephi’s psalm is 2 Nephi 4:16–35'
    key: alford-baker-psalm-nephi
    url: 'https://rsc.byu.edu/ascending-mountain-lord/parallels-between-psalms-25-31-psalm-nephi'
    quote: 'Nephi’s soul-searching introspection found in 2 Nephi 4:16–35'
  - where: section 1 plain
    claim: '“Lifted me up” rendered “drawn me up”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2030&version=NRSVUE'
    quote: 'for you have drawn me up'
  - where: section 2 plain
    claim: '“His faithful ones” and “his holy name”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2030&version=NRSVUE'
    quote: 'O you his faithful ones'
  - where: section 3 plain
    claim: '“Prosperity” is ease'
    key: bdb
    url: 'https://biblehub.com/hebrew/7959.htm'
    quote: 'ease, prosperity'
  - where: section 3 plain
    claim: '“Troubled” rendered “dismayed”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2030&version=NRSVUE'
    quote: 'I was dismayed'
  - where: section 4 plain
    claim: '“My blood” means my death'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2030&version=NRSVUE'
    quote: 'What profit is there in my death'
  - where: section 5 plain
    claim: '“My glory” rendered “my soul”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2030&version=NRSVUE'
    quote: 'so that my soul may praise you and not be silent'

  # ---------- note 30:0 ----------
  - where: 'note 30:0 “Which house was dedicated”'
    claim: 'The Hebrew title has “the dedication of the house” and then “of David” as a separate phrase: the word for dedication'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חֲנֻכַּ֖ת'
  - where: 'note 30:0 “Which house was dedicated”'
    claim: '“The house,” with the article and no owner attached'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הַ/בַּ֣יִת'
  - where: 'note 30:0 “Which house was dedicated”'
    claim: '“Of David,” with the preposition that ascribes a psalm'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לְ/דָוִֽד'
  - where: 'note 30:0 “Which house was dedicated”'
    claim: 'The King James joins “house” and “of David”; several modern translations read “the temple; of David”'
    key: ot-minute-psalm-30
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-30'
    quote: 'Although the King James Version translates the line as “at the dedication of the house of David,” several modern translations render it as “for the dedication of the temple; of (by) David.”'
  - where: 'note 30:0 “Which house was dedicated”'
    claim: 'A modern translation’s title'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2030&version=NRSVUE'
    quote: 'A Psalm. A Song at the dedication of the temple. Of David.'
  - where: 'note 30:0 “Which house was dedicated”'
    claim: 'The ancient Greek translation reads as the King James does'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/30.htm'
    quote: 'For the end, a Psalm and Song at the dedication of the house of David.'
  - where: 'note 30:0 “Which house was dedicated”'
    claim: 'If the psalm is David’s and the house is the temple, the title is anachronistic'
    key: ot-minute-psalm-30
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-30'
    quote: 'if the psalm were written by David, the assertion is anachronistic since the temple was dedicated under Solomon'
  - where: 'note 30:0 “Which house was dedicated”'
    claim: 'It may be an older psalm later used at the second temple’s dedication'
    key: ot-minute-psalm-30
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-30'
    quote: 'it may have been an earlier psalm that was later used as part of the second temple’s dedication'
  - where: 'note 30:0 “Which house was dedicated”'
    claim: 'The Talmud records its use at Hanukkah, the feast of the temple’s rededication'
    key: ot-minute-psalm-30
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-30'
    quote: 'The Talmud indicates that it was used for the celebration of Hanukkah (b. Sop 18b), which involved the cleansing and (re)dedication of the temple under Judas Maccabaeus.'
  - where: 'note 30:0 “Which house was dedicated”'
    claim: 'One older reading takes the house to be David’s own newly finished citadel on Zion'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/30.htm'
    quote: 'it must be the dedication of the citadel on Zion, the building of which was just completed'
  - where: 'note 30:0 “Which house was dedicated”'
    claim: 'One older reading: the dedication of David’s citadel on Zion, delayed by a severe illness'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/30.htm'
    quote: 'to infer from the Psalm itself, that David had been delayed by some severe illness from taking possession of the new building'
  - where: 'note 30:0 “Which house was dedicated”'
    claim: 'The psalm contains nothing that points to the dedication of a sanctuary'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/30.htm'
    quote: 'The Psalm, however, also does not contain anything that should point to a dedication of a sanctuary'

  # ---------- note 30:1 ----------
  - where: 'note 30:1 “Drawn up like water from a well”'
    claim: 'The verb of “lifted me up”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'דִלִּיתָ֑/נִי'
  - where: 'note 30:1 “Drawn up like water from a well”'
    claim: 'It is the verb for drawing water, as in Exodus 2:19'
    key: bdb
    url: 'https://biblehub.com/hebrew/1802.htm'
    quote: 'verb draw (water)'
  - where: 'note 30:1 “Drawn up like water from a well”'
    claim: 'In this verse it is figurative, with the LORD as subject'
    key: bdb
    url: 'https://biblehub.com/hebrew/1802.htm'
    quote: 'thou hast drawn me up'
  - where: 'note 30:1 “Drawn up like water from a well”'
    claim: 'A modern translation keeps the image'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2030&version=NRSVUE'
    quote: 'for you have drawn me up'
  - where: 'note 30:1 “Drawn up like water from a well”'
    claim: '“The grave” in verse 3 is Sheol'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שְׁא֣וֹל'
  - where: 'note 30:1 “Drawn up like water from a well”'
    claim: 'The word for “pit” is the ordinary word for a pit, cistern or well'
    key: bdb
    url: 'https://biblehub.com/hebrew/953.htm'
    quote: 'pit, cistern, well'
  - where: 'note 30:1 “Drawn up like water from a well”'
    claim: 'In poetry it is the pit of the grave, and of Sheol in this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/953.htm'
    quote: '(in poetry & late; never with article) pit of the grave'

  # ---------- note 30:3 ----------
  - where: 'note 30:3 “Brought back from the edge of death”'
    claim: 'Verse 2’s healing suggests the speaker was not brought back from actual death'
    key: ot-minute-psalm-30
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-30'
    quote: 'may indicate that he was not brought back from actual death but from a serious, perhaps nearly fatal, illness or injury'
  - where: 'note 30:3 “Brought back from the edge of death”'
    claim: 'The question has been debated, and some read the verse as a prophecy of Christ’s Resurrection'
    key: ot-minute-psalm-30
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-30'
    quote: 'Was the psalmist (who is traditionally thought to be King David) claiming to have been resurrected from the dead? Some, including Orthodox Christians, read the psalm as a prophecy of Christ’s Resurrection.'
  - where: 'note 30:3 “Brought back from the edge of death”'
    claim: 'The Hebrew has a written form (ketiv), a plural participle, “those going down”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מ/יורדי'
  - where: 'note 30:3 “Brought back from the edge of death”'
    claim: 'and a form to be read (qere), an infinitive with “my”: “from my going down”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מִ/יָּֽרְדִ/י'
  - where: 'note 30:3 “Brought back from the edge of death”'
    claim: 'The written form is probably meant as a participle: revived from those who sink into the grave'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/30.htm'
    quote: 'it is probably intended to be read as a participle'
  - where: 'note 30:3 “Brought back from the edge of death”'
    claim: 'A modern translation prints the written form'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2030&version=NRSVUE'
    quote: 'restored me to life from among those gone down to the Pit'
  - where: 'note 30:3 “Brought back from the edge of death”'
    claim: 'and gives the other in its margin'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2030&version=NRSVUE'
    quote: 'Or that I should not go down to the Pit'
  - where: 'note 30:3 “Brought back from the edge of death”'
    claim: 'The ancient Greek agrees with the written form'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/30.htm'
    quote: 'thou hast delivered me from among them that go down to the pit'

  # ---------- note 30:4 ----------
  - where: 'note 30:4 “The name He is remembered by”'
    claim: 'The word behind “remembrance”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לְ/זֵ֣כֶר'
  - where: 'note 30:4 “The name He is remembered by”'
    claim: 'It means remembrance or memorial'
    key: bdb
    url: 'https://biblehub.com/hebrew/2143.htm'
    quote: 'remembrance, memorial'
  - where: 'note 30:4 “The name He is remembered by”'
    claim: 'As a memorial it is that by which one is remembered, used so of the LORD in Exodus 3:15'
    key: bdb
    url: 'https://biblehub.com/hebrew/2143.htm'
    quote: 'memorial, by which one is remembered'
  - where: 'note 30:4 “The name He is remembered by”'
    claim: 'The lexicon places this verse under remembrance of the LORD’s character and works, with Psalm 97:12'
    key: bdb
    url: 'https://biblehub.com/hebrew/2143.htm'
    quote: 'character and works Psalm 30:5; Psalm 97:12; Psalm 111:4'
  - where: 'note 30:4 “The name He is remembered by”'
    claim: 'A modern translation renders “his holy name”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2030&version=NRSVUE'
    quote: 'and give thanks to his holy name'
  - where: 'note 30:4 “The name He is remembered by”'
    claim: 'Exodus 3:15 sets “name” and “memorial” side by side'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: 'this is my name for ever, and this is my memorial unto all generations'
  - where: 'note 30:4 “The name He is remembered by”'
    claim: 'Psalm 97:12 ends with the same line'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/97?lang=eng'
    quote: 'give thanks at the remembrance of his holiness'
  - where: 'note 30:4 “The name He is remembered by”'
    claim: '“Saints” is the plural of hasid'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חֲסִידָ֑י/ו'
  - where: 'note 30:4 “The name He is remembered by”'
    claim: 'In the plural the word means the pious, those faithful and devoted to God’s service; this verse is listed'
    key: bdb
    url: 'https://biblehub.com/hebrew/2623.htm'
    quote: 'plural the pious, godly, those of the people who were faithful, devoted to God''s service'
  - where: 'note 30:4 “The name He is remembered by”'
    claim: 'A modern translation: faithful ones'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2030&version=NRSVUE'
    quote: 'O you his faithful ones'

  # ---------- note 30:5 words ----------
  - where: 'note 30:5 “Weeping lodges for the night”'
    claim: 'The Hebrew of the first half: “a moment”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'רֶ֨גַע'
  - where: 'note 30:5 “Weeping lodges for the night”'
    claim: '“life” set against it'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'חַיִּ֪ים'
  - where: 'note 30:5 “Weeping lodges for the night”'
    claim: 'The lexicon’s rendering of the first half, with Isaiah 54:7 beside it'
    key: bdb
    url: 'https://biblehub.com/hebrew/7281.htm'
    quote: 'a moment (passes) in his anger (opposed to'
  - where: 'note 30:5 “Weeping lodges for the night”'
    claim: 'The lexicon lists Isaiah 54:7 next under the same word'
    key: bdb
    url: 'https://biblehub.com/hebrew/7281.htm'
    quote: 'Isaiah 54:7'
  - where: 'note 30:5 “Weeping lodges for the night”'
    claim: 'A modern translation takes “life” as a lifetime'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2030&version=NRSVUE'
    quote: 'his favor is for a lifetime'
  - where: 'note 30:5 “Weeping lodges for the night”'
    claim: 'The verb of “endure” in the second half'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יָלִ֥ין'
  - where: 'note 30:5 “Weeping lodges for the night”'
    claim: 'It means to lodge, to pass the night'
    key: bdb
    url: 'https://biblehub.com/hebrew/3885.htm'
