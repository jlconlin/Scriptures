  # ---------- note 11:7 ----------
  - where: 'note 11:7 “The upright shall behold His face”'
    claim: 'The King James seems to have the Lord’s face looking on the upright'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'in a manner that seems to depict the Lord’s face (countenance) looking upon the upright'
  - where: 'note 11:7 “The upright shall behold His face”'
    claim: 'The Hebrew order indicates that the upright behold the Lord’s face'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'The Hebrew of this verse, however, makes this statement in reverse order, indicating that it is the upright which shall behold the Lord’s face.'
  - where: 'note 11:7 “The upright shall behold His face”'
    claim: 'A modern translation has “the upright shall behold his face”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2011&version=NRSVUE'
    quote: 'the upright shall behold his face.'
  - where: 'note 11:7 “The upright shall behold His face”'
    claim: 'The Church’s footnote 7b gives the alternative rendering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/11?lang=eng'
    quote: 'the upright shall behold His face'
  - where: 'note 11:7 “The upright shall behold His face”'
    claim: 'The Greek has the face beholding'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/11.htm'
    quote: 'For the Lord is righteous, and loves righteousness; his face beholds uprightness.'
  - where: 'note 11:7 “The upright shall behold His face”'
    claim: 'In Hebrew usage the face is what is seen, not what sees'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/11.htm'
    quote: 'is always used only as that which is to be seen, not as that which itself sees'
  - where: 'note 11:7 “The upright shall behold His face”'
    claim: 'The context expects the end of the upright in contrast to that of the ungodly'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/11.htm'
    quote: 'one expects to find something respecting the end of the upright in contrast to that of the ungodly'
  - where: 'note 11:7 “The upright shall behold His face”'
    claim: 'Only the upright will see the Lord’s face'
    key: skinner-seeing-god
    url: 'https://rsc.byu.edu/ascending-mountain-lord/seeing-god-his-temple-significant-theme-israels-psalms'
    quote: 'We might even say that only upright persons will see the Lord’s face, for that is the message of the passage.'
  - where: 'note 11:7 “The upright shall behold His face”'
    claim: 'Psalm 11:7 is one of several psalms confident that the righteous will behold God’s face'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Psalms 11:7; 24:6; 27:4, 8; 42:2; 63:2; 105:4 share this confidence that the righteous who seek God’s face will ultimately have the privilege of beholding it.'

