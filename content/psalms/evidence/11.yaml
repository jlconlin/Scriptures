    quote: 'His eyelids try the children of men (search them through and through) Psalm 11:4.'
  - where: 'note 11:4 “Eyelids that try”'
    claim: 'The verb’s first sense is examine, scrutinize, and Psalm 11:5 is listed under it'
    key: bdb
    url: 'https://biblehub.com/hebrew/974.htm'
    quote: '1 examine, scrutinize, try Psalm 11:5; Psalm 139:23; Job 7:18'
  - where: 'note 11:4 “Eyelids that try”'
    claim: 'Elsewhere the verb is used with the metaphor of gold'
    key: bdb
    url: 'https://biblehub.com/hebrew/974.htm'
    quote: 'a. with the metaphor of gold Job 23:10'
  - where: 'note 11:4 “Eyelids that try”'
    claim: 'The gold metaphor is of trying as one tries gold'
    key: bdb
    url: 'https://biblehub.com/hebrew/974.htm'
    quote: 'and I will try them as one tries gold Zechariah 13:9'
  - where: 'note 11:4 “Eyelids that try”'
    claim: 'A Latter-day Saint reading: He tries the faith of the righteous and loves and protects them'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'although He tries the faith of the righteous, He loves them and will ultimately protect them from the wicked'
  - where: 'note 11:4 “Eyelids that try”'
    claim: 'The Church’s chapter heading keeps the King James division: the righteous tested, the wicked hated'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/11?lang=eng'
    quote: 'The Lord tests the righteous and hates the wicked'
  - where: 'note 11:4 “Eyelids that try”'
    claim: 'The Greek puts the ungodly with the righteous as objects of the testing'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/11.htm'
    quote: 'The Lord tries the righteous and the ungodly: and he that loves unrighteousness hates his own soul.'
  - where: 'note 11:4 “Eyelids that try”'
    claim: 'A modern translation divides the verse the same way'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2011&version=NRSVUE'
    quote: 'The Lord tests the righteous and the wicked,'

  # ---------- note 11:6 ----------
  - where: 'note 11:6 “The rain of Sodom and the cup”'
    claim: 'The LORD rained brimstone and fire on Sodom and Gomorrah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/19?lang=eng'
    quote: 'Then the Lord rained upon Sodom and upon Gomorrah brimstone and fire from the Lord out of heaven;'
  - where: 'note 11:6 “The rain of Sodom and the cup”'
    claim: 'An older commentary connects the fire and brimstone with Genesis 19:24'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/11.htm'
    quote: 'In addition to fire and brimstone (Genesis 19:24)'
  - where: 'note 11:6 “The rain of Sodom and the cup”'
    claim: 'The Hebrew word as it stands is the word for a bird-trap'
    key: bdb
    url: 'https://biblehub.com/hebrew/6341.htm'
    quote: 'bird-trap'
  - where: 'note 11:6 “The rain of Sodom and the cup”'
    claim: 'The Greek keeps “snares”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/11.htm'
    quote: 'He shall rain upon sinners snares, fire, and brimstone, and a stormy blast shall be the portion of their cup.'
  - where: 'note 11:6 “The rain of Sodom and the cup”'
    claim: 'The lexicon refers Psalm 11:6 away from “snare” to the entry for coal'
    key: bdb
    url: 'https://biblehub.com/hebrew/6341.htm'
    quote: 'Psalm 11:6 see'
  - where: 'note 11:6 “The rain of Sodom and the cup”'
