chapter: 53
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'The title ascribes the psalm to David and names no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/53?lang=eng'
    quote: 'To the chief Musician upon Mahalath, Maschil, A Psalm of David.'
  - where: setting
    claim: 'The title ascribes the psalm to David and gives two performance terms (Mahalath, Maschil) beside the address to the chief Musician'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/53?lang=eng'
    quote: 'To the chief Musician upon Mahalath, Maschil, A Psalm of David.'
  - where: setting
    claim: 'Psalm 53 is another version of Psalm 14'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Psalm 53, which is another version of the same psalm within the book of Psalms'
  - where: setting
    claim: 'Psalm 14 has “the LORD” where Psalm 53 has “God” (14:2 beside 53:2)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/14?lang=eng'
    quote: 'The Lord looked down from heaven upon the children of men, to see if there were any that did understand, and seek God.'
  - where: setting
    claim: 'The name of God stands seven times in each psalm; in Psalm 53 all seven are Elohim'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/53.htm'
    quote: 'In both recensions of the Psalm the name of God occurs seven times. In Psalm 14:1-7 it reads three times Elohim and four times Jahve; in the Psalm before us it is all seven times Elohim'
  - where: setting
    claim: 'Psalm 53:1 has “abominable iniquity” and 53:3 “gone back”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/53?lang=eng'
    quote: 'Corrupt are they, and have done abominable iniquity: there is none that doeth good.'
  - where: setting
    claim: 'Psalm 14:1 has “abominable works” and 14:3 “gone aside”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/14?lang=eng'
    quote: 'They are corrupt, they have done abominable works, there is none that doeth good.'
  - where: setting
    claim: 'Psalm 14 has two verses (5–6) on God with the righteous and the poor man’s refuge, where Psalm 53 has one verse (5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/14?lang=eng'
    quote: 'Ye have shamed the counsel of the poor, because the Lord is his refuge.'
  - where: setting
    claim: 'One older commentary takes Psalm 53 to be a later variation of Psalm 14'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/53.htm'
    quote: 'Psalm 53:1-6 is a later variation of Psalm 14:1-7'

  # ---------- thread ----------
  - where: thread
    claim: 'In Psalm 14 the reason for the fear is God’s presence with the righteous'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/14?lang=eng'
    quote: 'There were they in great fear: for God is in the generation of the righteous.'
  - where: thread
    claim: 'On one reading verse 4 in this psalm comes to refer to Israel’s foreign foes'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/53.htm'
    quote: 'receives a reference to the foreign foes of Israel originally alien to the Psalm'
  - where: thread
    claim: 'The last verse is shared with Psalm 14:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/14?lang=eng'
    quote: 'Oh that the salvation of Israel were come out of Zion! when the Lord bringeth back the captivity of his people, Jacob shall rejoice, and Israel shall be glad.'
  - where: thread
    claim: 'The verb of “despised” in verse 5 is used of God rejecting men (the Church’s footnote also gives “rejected”)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3988.htm'
    quote: 'God rejects men Hosea 4:6'

  # ---------- sections ----------
  - where: section 2 plain
    claim: '“Despised” can be rendered “rejected”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3988.htm'
    quote: 'God rejects men Hosea 4:6'
  - where: section 2 plain
    claim: 'A modern translation has “rejected” in verse 5'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2053&version=NRSVUE'
    quote: 'they will be put to shame, for God has rejected them'

  # ---------- note 53:0 ----------
  - where: 'note 53:0 “Mahalath and Maschil”'
    claim: 'Mahalath stands only in the titles of Psalms 53 and 88 (53:1 and 88:1 by the Hebrew numbering)'
    key: bdb
    url: 'https://biblehub.com/hebrew/4257.htm'
    quote: 'noun feminine only in Psalm titles'
  - where: 'note 53:0 “Mahalath and Maschil”'
    claim: 'It is apparently a catchword naming a tune, and its meaning is doubtful'
    key: bdb
    url: 'https://biblehub.com/hebrew/4257.htm'
    quote: 'apparently a catchword in a song, giving name to tune; meaning dubious'
  - where: 'note 53:0 “Mahalath and Maschil”'
    claim: 'The Greek translation writes the word as a name without translating it'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/53.htm'
    quote: 'For the end, a Psalm of David upon Maeleth, of instruction.'
  - where: 'note 53:0 “Mahalath and Maschil”'
    claim: 'A modern translation keeps the word as a name'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2053&version=NRSVUE'
    quote: 'To the leader: according to Mahalath. A Maskil of David.'
  - where: 'note 53:0 “Mahalath and Maschil”'
    claim: 'The title of Psalm 53'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/53?lang=eng'
    quote: 'To the chief Musician upon Mahalath, Maschil, A Psalm of David.'
  - where: 'note 53:0 “Mahalath and Maschil”'
    claim: 'The title of Psalm 14 has neither Mahalath nor Maschil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/14?lang=eng'
    quote: 'To the chief Musician, A Psalm of David.'

  # ---------- note 53:2 ----------
  - where: 'note 53:2 “God where Psalm 14 has the LORD”'
    claim: 'Psalm 53:2 opens with Elohim (Strong’s 430); Elohim stands in verses 1, 2 (twice), 4, 5 (twice) and 6, seven times, and the divine name nowhere'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֱֽלֹהִ֗ים'
  - where: 'note 53:2 “God where Psalm 14 has the LORD”'
    claim: 'Psalm 14:2 opens with the divine name (Strong’s 3068), which stands in 14:2, 4, 6 and 7; Elohim stands in 14:1, 2 and 5'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יְֽהוָ֗ה'
  - where: 'note 53:2 “God where Psalm 14 has the LORD”'
    claim: 'The fool’s saying has Elohim in both psalms (14:1 and 53:1)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֱלֹהִ֑ים'
  - where: 'note 53:2 “God where Psalm 14 has the LORD”'
    claim: 'Psalm 53:2 and 53:6 in the King James'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/53?lang=eng'
    quote: 'When God bringeth back the captivity of his people, Jacob shall rejoice, and Israel shall be glad.'
  - where: 'note 53:2 “God where Psalm 14 has the LORD”'
    claim: 'Psalm 14:2 and 14:7 in the King James have “the LORD”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/14?lang=eng'
    quote: 'when the Lord bringeth back the captivity of his people'

  # ---------- note 53:5 where no fear was ----------
  - where: 'note 53:5 “Fear with nothing to fear, or fear like no other”'
    claim: 'Psalm 14:5 has no “where no fear was”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/14?lang=eng'
    quote: 'There were they in great fear: for God is in the generation of the righteous.'
  - where: 'note 53:5 “Fear with nothing to fear, or fear like no other”'
    claim: 'A modern translation takes the added words as a measure of the terror'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2053&version=NRSVUE'
    quote: 'in terror such as has not been'
  - where: 'note 53:5 “Fear with nothing to fear, or fear like no other”'
    claim: 'The same translation puts the verse in the future'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2053&version=NRSVUE'
    quote: 'There they shall be in great terror'
  - where: 'note 53:5 “Fear with nothing to fear, or fear like no other”'
    claim: 'The Greek translation of Psalm 53 reads “where there was no fear”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/53.htm'
    quote: 'There were they greatly afraid, where there was no fear'
  - where: 'note 53:5 “Fear with nothing to fear, or fear like no other”'
    claim: 'The Greek translation has the same words in Psalm 14:5'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/14.htm'
    quote: 'There were they alarmed with fear, where there was no fear; for God is in the righteous generation.'

  # ---------- note 53:5 besieger ----------
  - where: 'note 53:5 “A besieger scattered, where the two psalms part”'
    claim: 'Psalm 53:5 in the King James'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/53?lang=eng'
    quote: 'There were they in great fear, where no fear was: for God hath scattered the bones of him that encampeth against thee: thou hast put them to shame, because God hath despised them.'
  - where: 'note 53:5 “A besieger scattered, where the two psalms part”'
    claim: 'The verb “encamp” is used in this verse (53:6 in the Hebrew numbering) with a suffix in a hostile sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/2583.htm'
    quote: 'followed by suffix accusative with hostile sense'
  - where: 'note 53:5 “A besieger scattered, where the two psalms part”'
    claim: 'One reading: the words are addressed to the people of God, and the one encamped is their besieger'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/53.htm'
    quote: 'The words are addressed to the people of God: Elohim hath scattered the bones'
  - where: 'note 53:5 “A besieger scattered, where the two psalms part”'
    claim: 'The same reading: “of thy besieger”'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/53.htm'
    quote: 'of thy besieger, i.e., of him who had encamped against thee'
  - where: 'note 53:5 “A besieger scattered, where the two psalms part”'
    claim: 'The same reading: fear seized the enemies when there was no outward ground for it, a panic wrought by God'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/53.htm'
    quote: 'when no fear, i.e., no outward ground for fear, existed'
  - where: 'note 53:5 “A besieger scattered, where the two psalms part”'
    claim: 'The same reading calls it a God-wrought panic'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/53.htm'
    quote: 'a God-wrought panic'
  - where: 'note 53:5 “A besieger scattered, where the two psalms part”'
    claim: 'The same reading: verse 4 (5 in the Hebrew numbering) now refers to Israel’s foreign foes, which was originally alien to the psalm'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/53.htm'
    quote: 'receives a reference to the foreign foes of Israel originally alien to the Psalm'
  - where: 'note 53:5 “A besieger scattered, where the two psalms part”'
    claim: 'The same reading supposes a later poet adapting the psalm to a recent catastrophe'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/53.htm'
    quote: 'A later poet, perhaps belonging to the time of Jehoshaphat or Hezekiah, has here adapted the Davidic Psalm to some terrible catastrophe that has just taken place'
  - where: 'note 53:5 “A besieger scattered, where the two psalms part”'
    claim: 'The same reading names the confederates under Jehoshaphat (2 Chronicles 20:22–24) and Sennacherib’s army (Isaiah 37:36) as such cases'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/53.htm'
    quote: 'Such as the case with the host of the confederates in the days of Jehoshaphat (2 Chronicles 20:22-24); such also with the army of Sennacherib before Jerusalem (Isaiah 37:36)'
  - where: 'note 53:5 “A besieger scattered, where the two psalms part”'
    claim: '2 Chronicles 20:22, in Jehoshaphat’s reign'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: 'And when they began to sing and to praise, the Lord set ambushments against the children of Ammon, Moab, and mount Seir, which were come against Judah; and they were smitten.'
  - where: 'note 53:5 “A besieger scattered, where the two psalms part”'
    claim: '2 Chronicles 20:24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/20?lang=eng'
    quote: 'they looked unto the multitude, and, behold, they were dead bodies fallen to the earth, and none escaped'
  - where: 'note 53:5 “A besieger scattered, where the two psalms part”'
    claim: 'Isaiah 37:36, in Hezekiah’s reign'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/37?lang=eng'
    quote: 'Then the angel of the Lord went forth, and smote in the camp of the Assyrians a hundred and fourscore and five thousand'
  - where: 'note 53:5 “A besieger scattered, where the two psalms part”'
    claim: 'The Greek translation of the line'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/53.htm'
    quote: 'for God has scattered the bones of the men-pleasers; they were ashamed, for God despised them.'
  - where: 'note 53:5 “A besieger scattered, where the two psalms part”'
    claim: 'A modern translation of the line'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2053&version=NRSVUE'
    quote: 'For God will scatter the bones of the ungodly'
  - where: 'note 53:5 “A besieger scattered, where the two psalms part”'
    claim: 'The same translation makes the shame the enemies’ own'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2053&version=NRSVUE'
    quote: 'they will be put to shame, for God has rejected them'
  - where: 'note 53:5 “A besieger scattered, where the two psalms part”'
    claim: 'The Hebrew verb “put to shame” is a second-person masculine singular perfect (morphology HVhp2ms)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הֱ֝בִשֹׁ֗תָה'

  # ---------- christ ----------
  - where: christ
    claim: 'Paul quotes the verdict in Romans 3:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/3?lang=eng'
    quote: 'They are all gone out of the way, they are together become unprofitable; there is none that doeth good, no, not one.'
  - where: christ
    claim: 'Paul’s argument is that all are under sin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/3?lang=eng'
    quote: 'for we have before proved both Jews and Gentiles, that they are all under sin'
  - where: christ
    claim: 'Paul’s answer is redemption in Christ Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/3?lang=eng'
    quote: 'Being justified freely by his grace through the redemption that is in Christ Jesus'
  - where: christ
    claim: 'The word for salvation in Psalm 53:6 is plural (morphology HNcfpc)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יְשֻׁע֪וֹת'
  - where: christ
    claim: 'The word for salvation in Psalm 14:7 is singular (morphology HNcfsc)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יְשׁוּעַ֪ת'
  - where: christ
    claim: 'One reading takes the plural as full and final salvation'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/53.htm'
    quote: 'the expression is strengthened, the plural signifies entire, full, and final salvation'

  # ---------- explore / parallels ----------
  - where: explore
    claim: 'Psalm 88 is the other psalm whose title has Mahalath'
    key: bdb
    url: 'https://biblehub.com/hebrew/4257.htm'
    quote: 'Psalm 53:1; Psalm 88:1'
  - where: parallels
    claim: 'The rout of 2 Chronicles 20:22–24 and of Isaiah 37:36 are set beside verse 5 by one reading'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/53.htm'
    quote: 'Such as the case with the host of the confederates in the days of Jehoshaphat (2 Chronicles 20:22-24); such also with the army of Sennacherib before Jerusalem (Isaiah 37:36)'
  - where: parallels
    claim: 'Isaiah 37 is set in Hezekiah’s reign, and 2 Chronicles 20 in Jehoshaphat’s'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/37?lang=eng'
    quote: 'Hezekiah seeks counsel from Isaiah to save Jerusalem'
