    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/11?lang=eng'
    quote: 'he hath kindled fire upon it, and the branches of it are broken.'
  - where: 'note 52:8 “The tree that is not uprooted”'
    claim: 'Nob was one of the places where the tabernacle stood'
    key: bd-nob
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nob?lang=eng'
    quote: 'one of the places where the tabernacle stood before the building of the temple'
  - where: 'note 52:8 “The tree that is not uprooted”'
    claim: 'Nob, the city of the priests, was put to the sword'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/22?lang=eng'
    quote: 'And Nob, the city of the priests, smote he with the edge of the sword'
  - where: 'note 52:8 “The tree that is not uprooted”'
    claim: 'The tree of Psalm 1'
    key: lds-scriptures
