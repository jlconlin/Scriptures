    key: bdb
    url: 'https://biblehub.com/hebrew/8327.htm'
    quote: '= deal with the roots'
  - where: 'note 52:8 “The tree that is not uprooted”'
    claim: 'Psalm 92 plants the righteous in the house of the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/92?lang=eng'
    quote: 'Those that be planted in the house of the'
