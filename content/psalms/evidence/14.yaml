  # ---------- note 14:7 Zion ----------
  - where: 'note 14:7 “Zion established out of heaven”'
    claim: 'The Joseph Smith Translation of verse 7'
    key: jst-ps-14
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ps/14?lang=eng'
    quote: 'Oh that Zion were established out of heaven, the salvation of Israel. O Lord, when wilt thou establish Zion? When the Lord bringeth back the captivity of his people, Jacob shall rejoice, Israel shall be glad.'
  - where: 'note 14:7 “Zion established out of heaven”'
