chapter: 14
claims:
  # ---------- when / setting ----------
  - where: when
    claim: 'The title ascribes the psalm to David and addresses it to the chief Musician; it names no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/14?lang=eng'
    quote: 'To the chief Musician, A Psalm of David.'
  - where: setting
    claim: 'The title ascribes the psalm to David and addresses it to the chief Musician'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/14?lang=eng'
    quote: 'To the chief Musician, A Psalm of David.'
  - where: setting
    claim: 'Psalm 53 is another version of the same psalm'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Psalm 53, which is another version of the same psalm within the book of Psalms'
  - where: setting
    claim: 'Psalm 53 says “God” where Psalm 14 says “the LORD” (53:2 beside 14:2), and has “God” in every place (seven times)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/53?lang=eng'
    quote: 'God looked down from heaven upon the children of men, to see if there were any that did understand, that did seek God.'
  - where: setting
    claim: 'The Hebrew of Psalm 14 has the divine name (four times: verses 2, 4, 6, 7) beside Elohim (three times: verses 1, 2, 5)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יְֽהוָ֗ה'
  - where: setting
    claim: 'Paul quotes the psalm to show that Jews and Gentiles are all under sin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/3?lang=eng'
    quote: 'for we have before proved both Jews and Gentiles, that they are all under sin'
  - where: setting
    claim: 'Joseph Smith used Psalm 14:1 and 14:3 in his 1832 history of the First Vision'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'During the account of the vision itself, he quoted Psalm 14:3 as part of what the Lord said to him'
  - where: setting
    claim: 'The translation of Psalm 14 was most probably finished in January or February 1833'
    key: wright-bradley-none-good
    url: 'https://byustudies.byu.edu/article/none-that-doeth-good'
    quote: 'The most probable dates of completion for the translation of Psalm 14 (January or February 1833) and the writing of the 1832 account (July–September 1832)'
  - where: setting
    claim: 'The Joseph Smith Translation reworks verses 1–7 and is printed in the appendix with a heading on the loss of truth in the last days and the establishment of Zion'
    key: jst-ps-14
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ps/14?lang=eng'
    quote: 'The Psalmist sees the loss of truth in the last days and looks forward to the establishment of Zion.'

  # ---------- thread ----------
  - where: thread
    claim: 'The Hebrew particle ein (“there is not”) stands in “There is no God” and again in “there is none that doeth good” in verse 1, and twice in verse 3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֵ֣ין'
  - where: thread
    claim: 'The second ein of verse 3 (“no, not one”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֵ֝֗ין'
  - where: thread
    claim: 'The word for God in the fool’s saying is Elohim'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֱלֹהִ֑ים'
  - where: thread
    claim: 'Those called “my people” in verse 4 are the “generation of the righteous” of verse 5, set against corrupt humanity'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/14.htm'
    quote: 'the generation of the righteous, in opposition to the corrupted humanity of the time'

  # ---------- sections ----------
  - where: section 3 plain
    claim: 'Verse 6 can be rendered as an attempt against the plans of the poor'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2014&version=NRSVUE'
    quote: 'You would confound the plans of the poor'
  - where: section 3 plain
    claim: 'Verse 5 can be rendered “with the company of the righteous”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2014&version=NRSVUE'
    quote: 'for God is with the company of the righteous'

  # ---------- note 14:1 fool ----------
  - where: 'note 14:1 “The fool is senseless toward God, not slow-witted”'
    claim: 'The Hebrew word for “fool” in verse 1 is nabal'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'נָבָ֣ל'
  - where: 'note 14:1 “The fool is senseless toward God, not slow-witted”'
    claim: 'Nabal is used especially of moral and religious insensibility, with the idea of what is ignoble'
    key: bdb
    url: 'https://biblehub.com/hebrew/5036.htm'
    quote: 'adjective foolish, senseless, especially of the man who has no perception of ethical and religious claims, and with collateral idea of ignoble, disgraceful'
  - where: 'note 14:1 “The fool is senseless toward God, not slow-witted”'
    claim: 'As a noun the word is an impious and presumptuous fool; Isaiah 32:6 characterizes him; Psalm 14:1 is listed as his denying God'
    key: bdb
    url: 'https://biblehub.com/hebrew/5036.htm'
    quote: 'elsewhere as substantive (impious and presumptuous) fool, Isaiah 32:5'
  - where: 'note 14:1 “The fool is senseless toward God, not slow-witted”'
    claim: 'Isaiah 32:6 is listed as describing the nabal; Psalm 14:1 as his denying God'
    key: bdb
    url: 'https://biblehub.com/hebrew/5036.htm'
    quote: 'characterized as at once irreligious and churlish, Isaiah 32:6; denying God Psalm 14:1'
  - where: 'note 14:1 “The fool is senseless toward God, not slow-witted”'
    claim: 'The name Nabal in 1 Samuel 25:25 is spelled as the word for fool is'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Sam.xml'
    quote: 'נָבָ֗ל'
  - where: 'note 14:1 “The fool is senseless toward God, not slow-witted”'
    claim: 'Nabal was a churlish man of Carmel in David’s story'
    key: bdb
    url: 'https://biblehub.com/hebrew/5037.htm'
    quote: 'a churlish man of Carmel, whose widow David married'
  - where: 'note 14:1 “The fool is senseless toward God, not slow-witted”'
    claim: 'Abigail plays on her husband’s name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/25?lang=eng'
    quote: 'for as his name is, so is he; Nabal is his name, and folly is with him'
  - where: 'note 14:1 “The fool is senseless toward God, not slow-witted”'
    claim: 'The King James calls the nabal of Isaiah 32:6 “the vile person,” whose heart works iniquity and who empties the soul of the hungry'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/32?lang=eng'
    quote: 'For the vile person will speak villany, and his heart will work iniquity'
  - where: 'note 14:1 “The fool is senseless toward God, not slow-witted”'
    claim: 'A modern translation makes the fool plural from the first word'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2014&version=NRSVUE'
    quote: 'Fools say in their hearts'

  # ---------- note 14:1 JST ----------
  - where: 'note 14:1 “Joseph Smith’s translation gives the fool a reason”'
    claim: 'The Joseph Smith Translation of verse 1'
    key: jst-ps-14
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ps/14?lang=eng'
    quote: 'The fool hath said in his heart, There is no man that hath seen God. Because he showeth himself not unto us, therefore there is no God.'
  - where: 'note 14:1 “Joseph Smith’s translation gives the fool a reason”'
    claim: 'The translation gives the fool’s reason: he has not seen God and concludes no one has'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'The reason why he thinks there is no God is that he has not seen God and, by extension, concludes that no person has.'
  - where: 'note 14:1 “Joseph Smith’s translation gives the fool a reason”'
    claim: 'The Hebrew of the denial is two words, ein Elohim'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֵ֣ין'
  - where: 'note 14:1 “Joseph Smith’s translation gives the fool a reason”'
    claim: 'The expansion makes the dispute whether God appears to human beings'
    key: wright-bradley-none-good
    url: 'https://byustudies.byu.edu/article/none-that-doeth-good'
    quote: 'making the immediate matter of dispute not whether God exists but whether God appears to human beings'
  - where: 'note 14:1 “Joseph Smith’s translation gives the fool a reason”'
    claim: 'On this reading those who reject appearances of God become the fool'
    key: wright-bradley-none-good
    url: 'https://byustudies.byu.edu/article/none-that-doeth-good'
    quote: 'Consequently, those who reject the occurrence of theophanies become the'
  - where: 'note 14:1 “Joseph Smith’s translation gives the fool a reason”'
    claim: 'The added words import “No man hath seen God” (John 1:18; 1 John 4:12), which he had met twice in the translation'
    key: wright-bradley-none-good
    url: 'https://byustudies.byu.edu/article/none-that-doeth-good'
    quote: 'one he had already encountered twice in his work on the JST'
  - where: 'note 14:1 “Joseph Smith’s translation gives the fool a reason”'
    claim: 'He had already revised those two passages so that they supported his vision'
    key: wright-bradley-none-good
    url: 'https://byustudies.byu.edu/article/none-that-doeth-good'
    quote: 'transforming them from potential prooftexts against his theophany into passages supporting it'
  - where: 'note 14:1 “Joseph Smith’s translation gives the fool a reason”'
    claim: 'The article quotes JS—H 1:21 as the minister’s rejection of the vision'
    key: wright-bradley-none-good
    url: 'https://byustudies.byu.edu/article/none-that-doeth-good'
    quote: 'that there were no such things as visions or revelations in these days'
  - where: 'note 14:1 “Joseph Smith’s translation gives the fool a reason”'
    claim: 'The article’s inference: the expansion reflects his experience after the First Vision'
    key: wright-bradley-none-good
    url: 'https://byustudies.byu.edu/article/none-that-doeth-good'
    quote: 'this expansion makes the psalm more accurately reflect his own experience after the First Vision'
  - where: 'note 14:1 “Joseph Smith’s translation gives the fool a reason”'
    claim: 'The minister’s answer in Joseph Smith—History 1:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1?lang=eng'
    quote: 'there were no such things as visions or revelations in these days'

  # ---------- note 14:2 ----------
