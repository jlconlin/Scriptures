    quote: 'that all their creeds were an abomination in his sight; that those professors were all corrupt'
  - where: 'note 14:3 “The verse in the First Vision”'
    claim: 'Joseph Smith—History 1:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/js-h/1?lang=eng'
    quote: 'that those professors were all corrupt'
  - where: 'note 14:3 “The verse in the First Vision”'
