    claim: 'Joseph Smith had learned of Enoch’s Zion in translating Genesis'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'Through the translation of Genesis, Joseph Smith had learned of Enoch’s Zion'
  - where: 'note 14:7 “Zion established out of heaven”'
    claim: 'Moses 7:62: righteousness sent down out of heaven, and a holy city called Zion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/7?lang=eng'
    quote: 'And righteousness will I send down out of heaven'
  - where: 'note 14:7 “Zion established out of heaven”'
    claim: 'Moses 7:62 names the holy city Zion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/7?lang=eng'
    quote: 'an Holy City, that my people may gird up their loins, and be looking forth for the time of my coming; for there shall be my tabernacle, and it shall be called Zion, a New Jerusalem'
  - where: 'note 14:7 “Zion established out of heaven”'
    claim: 'The psalms were likely translated in January 1833'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'In January 1833—the likely time he was translating the psalms'
  - where: 'note 14:7 “Zion established out of heaven”'
    claim: 'The changed verse read as a prayer for Enoch’s city to return and join the New Jerusalem in Jackson County'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'was an impassioned call for Enoch’s city to return and join the fledgling New Jerusalem in Jackson County (Moses 7:62–63)'
  - where: 'note 14:7 “Zion established out of heaven”'
    claim: 'The added question implies that Zion may not come soon'
    key: lefevre-jst-psalms
    url: 'https://rsc.byu.edu/ascending-mountain-lord/give-me-right-word-o-lord-jst-changes-psalms'
    quote: 'implies, like D&C 58:3–4, that it may not be soon'

