  - where: 'note 14:2 “A verdict that rests on looking”'
    claim: '“To see” in Psalm 14:2 is the infinitive of the verb to see with the preposition (Strong’s 7200)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לִ֭/רְאוֹת'
  - where: 'note 14:2 “A verdict that rests on looking”'
    claim: 'Genesis 11:5 has the same infinitive (Strong’s 7200) and “the children of men”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'לִ/רְאֹ֥ת'
  - where: 'note 14:2 “A verdict that rests on looking”'
    claim: 'Genesis 11:5 in the King James'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/11?lang=eng'
    quote: 'came down to see the city and the tower, which the children of men builded'
  - where: 'note 14:2 “A verdict that rests on looking”'
    claim: 'The verb for “looked down” is the word for looking out of a window'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/14.htm'
    quote: 'It is the proper word for looking out of a window'
  - where: 'note 14:2 “A verdict that rests on looking”'
    claim: 'God’s judgment is pictured as resting on knowledge of the facts'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/14.htm'
    quote: 'God''s judgment rests upon a knowledge of the matter of fact, which is represented in such passages after the manner of men'
  - where: 'note 14:2 “A verdict that rests on looking”'
    claim: 'A modern translation renders “understand” as “wise”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2014&version=NRSVUE'
    quote: 'to see if there are any who are wise'

