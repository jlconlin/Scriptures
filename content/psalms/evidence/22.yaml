chapter: 22
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The title ascribes the psalm to David and gives no occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/22?lang=eng'
    quote: 'To the chief Musician upon Aijeleth Shahar, A Psalm of David.'

  # ---- setting ----
  - where: 'setting'
    claim: 'The title of the psalm in the King James Version'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/22?lang=eng'
    quote: 'To the chief Musician upon Aijeleth Shahar, A Psalm of David.'
  - where: 'setting'
    claim: 'A modern translation renders the untranslated words “The Deer of the Dawn”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2022&version=NRSVUE'
    quote: 'To the leader: according to The Deer of the Dawn. A Psalm of David.'
  - where: 'setting'
    claim: 'Titles of this kind are probably names of tunes'
    key: bd-psalms
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/psalms?lang=eng'
    quote: 'The other titles are all probably names of tunes, well known at the time, to which the Psalms were appointed to be sung.'
  - where: 'setting'
    claim: 'The lament is the most common kind of psalm'
    key: sc-knowhy-438
    url: 'https://scripturecentral.org/knowhy/why-do-biblical-psalms-of-lament-show-up-in-the-book-of-mormon'
    quote: 'This form of expressing lament to God was so common that it makes up the largest category of psalm in the biblical Book of Psalms.'
  - where: 'setting'
    claim: 'New Testament writers quote or allude to Psalm 22 at least eleven times; it and Isaiah 53 are called twin pillars'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'Psalm 22 was quoted or alluded to at least eleven times by New Testament authors,1 while Isaiah 53 was used at least ten times.2 Indeed, these texts could be considered the twin pillars of Old Testament prophecy regarding Christ.'
  - where: 'setting'
    claim: 'The evangelists allude to verses 7–8 and 18, and Hebrews quotes verse 22'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'To the New Testament literary allusions in the chart must be added Hebrews 2:12'
  - where: 'setting'
    claim: 'The chapter heading in the Church’s edition calls it a messianic psalm of David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/22?lang=eng'
    quote: 'A messianic psalm of David—He foretells events in the Messiah’s life'
  - where: 'setting'
    claim: 'Two ways of understanding a psalm such as Psalm 22: an inspired foretelling, or a prayer out of Israel’s experience later seen fulfilled'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'The second, held by many biblical scholars, is that the Psalms were originally written by inspired authors to reflect the yearnings, experiences, and understanding of Israelites in their time.'
  - where: 'setting'
    claim: 'The two views need not exclude each other'
    key: hopkin-psalms-sung
    url: 'https://rsc.byu.edu/ascending-mountain-lord/psalms-sung-power-music-sacred-worship'
    quote: 'For Latter-day Saints, these two viewpoints need not be seen as mutually exclusive.'

  # ---- thread ----
  - where: 'thread'
    claim: 'The last word of verse 21 in Hebrew is “you have answered me”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'עֲנִיתָֽ/נִי'
  - where: 'thread'
    claim: 'Verse 2 has the same verb, “you do not answer”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תַעֲנֶ֑ה'
  - where: 'thread'
    claim: 'The verb means answer'
    key: bdb
    url: 'https://biblehub.com/hebrew/6030.htm'
    quote: 'verb answer, respond'
  - where: 'thread'
    claim: 'The psalm’s last Hebrew word is the verb “he has done”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'עָשָֽׂה'
  - where: 'thread'
    claim: 'The closing line is rendered “he has done it”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2022&version=NRSVUE'
    quote: 'saying that he has done it.'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“The words of my roaring” is his cry of distress'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/22?lang=eng'
    quote: 'IE my cry of distress.'
  - where: 'section 1 plain'
    claim: 'Verse 2: “you do not answer… find no rest”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2022&version=NRSVUE'
    quote: 'and by night but find no rest.'
  - where: 'section 2 plain'
    claim: 'Verse 3: enthroned on the praises; verse 5: not put to shame'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2022&version=NRSVUE'
    quote: 'in you they trusted and were not put to shame.'
  - where: 'section 3 plain'
    claim: 'Verse 7: they sneer and shake their heads'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2022&version=NRSVUE'
    quote: 'they sneer at me; they shake their heads;'
  - where: 'section 5 plain'
    claim: 'Verses 15–17 in a modern translation'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2022&version=NRSVUE'
    quote: 'you lay me in the dust of death.'
  - where: 'section 5 plain'
    claim: 'Verse 17: “I can count all my bones. They stare and gloat over me”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2022&version=NRSVUE'
    quote: 'They stare and gloat over me;'
  - where: 'section 6 plain'
    claim: '“My darling” is “my only one,” his life'
    key: bdb
    url: 'https://biblehub.com/hebrew/3173.htm'
    quote: 'my only one, poetic for my life'
  - where: 'section 6 plain'
    claim: '“Unicorns” are wild oxen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/22?lang=eng'
    quote: 'HEB bison, wild ox.'
  - where: 'section 6 plain'
    claim: 'The Hebrew of verse 21 ends “answered”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2022&version=NRSVUE'
    quote: '22.21 Heb answered'
  - where: 'section 7 plain'
    claim: 'Verse 25: “From you comes my praise”; verse 26: “May your hearts live forever”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2022&version=NRSVUE'
    quote: 'From you comes my praise in the great congregation;'
  - where: 'section 8 plain'
    claim: 'Verses 27–31: families of the nations; future generations told about the Lord; a people yet unborn'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2022&version=NRSVUE'
    quote: 'future generations will be told about the Lord'
  - where: 'section 8 plain'
    claim: 'Verse 29: “the fat ones of the earth”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/22.htm'
    quote: 'All the fat ones of the earth have eaten and worshipped'

  # ---- note 1: The shape of a lament ----
  - where: 'note 22:1 “The shape of a lament”'
    claim: 'What a psalm of lament is'
    key: sc-knowhy-438
    url: 'https://scripturecentral.org/knowhy/why-do-biblical-psalms-of-lament-show-up-in-the-book-of-mormon'
    quote: 'A psalm of lament is, essentially, a song of complaint to the Lord regarding difficulties being endured, and a petition for His help.'
  - where: 'note 22:1 “The shape of a lament”'
    claim: 'The wording quoted in the note (summary paragraph)'
    key: sc-knowhy-438
    url: 'https://scripturecentral.org/knowhy/why-do-biblical-psalms-of-lament-show-up-in-the-book-of-mormon'
    quote: 'A psalm of lament is a song of complaint to the Lord regarding difficulties being endured, and a petition for His help.'
  - where: 'note 22:1 “The shape of a lament”'
    claim: 'About a third of the psalms are laments'
    key: sc-knowhy-438
    url: 'https://scripturecentral.org/knowhy/why-do-biblical-psalms-of-lament-show-up-in-the-book-of-mormon'
    quote: 'Roughly one third of all the 150 biblical psalms are laments or contain laments.'
  - where: 'note 22:1 “The shape of a lament”'
    claim: 'The five usual elements of a lament'
    key: sc-knowhy-438
    url: 'https://scripturecentral.org/knowhy/why-do-biblical-psalms-of-lament-show-up-in-the-book-of-mormon'
    quote: 'although the order can be rearranged: (1) invocation, (2) complaint, (3) confession of trust, (4) petition, and (5) vow of praise.'
  - where: 'note 22:1 “The shape of a lament”'
    claim: 'Psalm 22 is given as an example of the form, with petition in verses 19–21 and vow of praise in 22–31'
    key: sc-knowhy-438
    url: 'https://scripturecentral.org/knowhy/why-do-biblical-psalms-of-lament-show-up-in-the-book-of-mormon'
    quote: 'Psalm 22, well known due to its use in the New Testament (Matthew 27:35, 39, 46, etc.), is a good example of the typical elements of this genre.'
  - where: 'note 22:1 “The shape of a lament”'
    claim: 'The lament runs through verse 18, the request for aid is verses 19–21, and the psalm ends in triumph'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'moving from a sufferer’s cries of anguish because of his trials (vv. 1–18), to a request for aid (vv. 19–21), and ending in a note of triumph as the sufferer anticipates the assistance he will receive from God or expresses gratitude that the desired assistance has come (vv. 22–31).'

  # ---- note 2: The first line, prayed from the cross ----
  - where: 'note 22:1 “The first line, prayed from the cross”'
    claim: 'Matthew and Mark give the line as Christ’s only statement on the cross'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'Both Matthew and Mark included this opening sentence as Christ’s only statement while upon the cross (Matt. 27:46; Mark 15:34).'
  - where: 'note 22:1 “The first line, prayed from the cross”'
    claim: 'Matthew and Mark give the saying in Aramaic, the spoken language'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'the effort that Mark and Matthew used to provide the original Aramaic for Jesus’s statement.64 This language, the spoken language of Jews in Christ’s day'
  - where: 'note 22:1 “The first line, prayed from the cross”'
    claim: 'A psalm’s first line served as its title'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'As has been said, the first line was typically used as the title for the entire psalm.'
  - where: 'note 22:1 “The first line, prayed from the cross”'
    claim: 'The Gospels’ allusions come from the beginning, middle and end of the lament, so the whole psalm was in view'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'indicates that the entire Psalm, rather than just the opening line, provided a lens for the passion narratives.'
  - where: 'note 22:1 “The first line, prayed from the cross”'
    claim: 'The cry as teaching: one phrase communicating the whole psalm, including the final victory'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'was still lovingly teaching his people by communicating to them the many concepts contained in Psalm 22—including his final victory over suffering—while uttering only one short phrase.'
  - where: 'note 22:1 “The first line, prayed from the cross”'
    claim: 'The text of Matthew 27:46–47'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/27?lang=eng'
    quote: 'Eli, Eli, lama sabachthani?'

  # ---- note 3: Did the Father forsake Him? ----
  - where: 'note 22:1 “Did the Father forsake Him?”'
    claim: 'Elder Holland calls the moment a divine withdrawal'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'that concluding descent into the paralyzing despair of divine withdrawal when He cries in ultimate loneliness, “My God, my God, why hast thou forsaken me?”'
  - where: 'note 22:1 “Did the Father forsake Him?”'
    claim: 'The Father did not forsake His Son'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'With all the conviction of my soul I testify that He did please His Father perfectly and that a perfect Father did not forsake His Son in that hour.'
  - where: 'note 22:1 “Did the Father forsake Him?”'
    claim: 'The Father briefly withdrew His Spirit and presence'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'that the supreme sacrifice of His Son might be as complete as it was voluntary and solitary, the Father briefly withdrew from Jesus the comfort of His Spirit, the support of His personal presence.'
  - where: 'note 22:1 “Did the Father forsake Him?”'
    claim: 'The reason given: the sinless Son had to feel spiritual death'
    key: holland-none-with-him
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2009/04/none-were-with-him?lang=eng'
    quote: 'He had to feel what it was like to die not only physically but spiritually'

  # ---- note 4: Enthroned on Israel’s praises ----
  - where: 'note 22:3 “Enthroned on Israel’s praises”'
    claim: 'The verb is yashav, to sit or dwell'
    key: bdb
    url: 'https://biblehub.com/hebrew/3427.htm'
    quote: 'To sit, dwell, remain, inhabit'
  - where: 'note 22:3 “Enthroned on Israel’s praises”'
    claim: 'The verb is used especially of the Lord sitting enthroned'
    key: bdb
    url: 'https://biblehub.com/hebrew/3427.htm'
    quote: 'sitting (enthroned), Psalm 2:4'
  - where: 'note 22:3 “Enthroned on Israel’s praises”'
    claim: 'This verse (Hebrew 22:4) is listed among the examples'
    key: bdb
    url: 'https://biblehub.com/hebrew/3427.htm'
    quote: 'Psalm 22:4 (see with עַל, above)'
  - where: 'note 22:3 “Enthroned on Israel’s praises”'
    claim: 'The Hebrew words of the verse: “sitting” and “praises”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תְּהִלּ֥וֹת'
  - where: 'note 22:3 “Enthroned on Israel’s praises”'
    claim: 'Verse 25 “my praise” is the same noun (Strong’s 8416)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תְֽהִלָּ֫תִ֥/י'
  - where: 'note 22:3 “Enthroned on Israel’s praises”'
    claim: 'A modern translation: enthroned on the praises of Israel'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2022&version=NRSVUE'
    quote: 'enthroned on the praises of Israel.'
  - where: 'note 22:3 “Enthroned on Israel’s praises”'
    claim: 'The Greek divides the line differently'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/22.htm'
    quote: 'But thou, the praise of Israel, dwellest in a sanctuary.'
  - where: 'note 22:3 “Enthroned on Israel’s praises”'
    claim: 'The book’s Hebrew name means “Praises”'
    key: bd-psalms
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/psalms?lang=eng'
    quote: 'The Psalms collectively are called in Hebrew Tehillim or “Praises,”'

  # ---- note 5: A worm, and no man ----
  - where: 'note 22:6 “A worm, and no man”'
    claim: 'The worm is a symbol of insignificance in Isaiah 41:14, Job 25:6 and this verse'
    key: bdb
    url: 'https://biblehub.com/hebrew/8438.htm'
    quote: 'symbol of insignificance Isaiah 41:14; Job 25:6'
  - where: 'note 22:6 “A worm, and no man”'
    claim: 'The Hebrew word in the verse'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תוֹלַ֣עַת'
  - where: 'note 22:6 “A worm, and no man”'
    claim: 'The transliteration tola‘at, and Job 25:6 uses a form of the word'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'How much less man, that is a worm? and the son of man, which is a worm (Heb. tole‘ah)?'
  - where: 'note 22:6 “A worm, and no man”'
    claim: '“Despised” in verse 6 is the verb bazah (Strong’s 959)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בְז֥וּי'
  - where: 'note 22:6 “A worm, and no man”'
    claim: '“He hath not despised” in verse 24 is the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בָזָ֨ה'
  - where: 'note 22:6 “A worm, and no man”'
    claim: '“Despised” in Isaiah 53:3 is the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Isa.xml'
    quote: 'נִבְזֶה֙'
  - where: 'note 22:6 “A worm, and no man”'
    claim: 'The verse and Isaiah 53:3 have been connected by the shared root'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'both using the same root for “despised . . . of men”'
  - where: 'note 22:6 “A worm, and no man”'
    claim: 'The same word names the insect that yielded scarlet'
    key: bdb
    url: 'https://biblehub.com/hebrew/8438.htm'
    quote: 'of the coccus ilicis yielding scarlet colour'
  - where: 'note 22:6 “A worm, and no man”'
    claim: 'The proposal that “worm” also hints at the scarlet of kingship'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'The soldiers at Christ’s crucifixion, for example, placed upon him a robe of scarlet (see Matt. 27:28; a purple robe in John 19:2) to mock him as “King of the Jews.”'
  - where: 'note 22:6 “A worm, and no man”'
    claim: 'The text of Job 25:6 and Isaiah 53:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/25?lang=eng'
    quote: 'How much less man, that is a worm?'

  # ---- note 6: His trust turned into a taunt ----
  - where: 'note 22:8 “His trust turned into a taunt”'
    claim: 'The scorn follows the trust of verses 3–5'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'the sufferer openly expressed trust in God in verses 3–5 and is subsequently mocked when his continued suffering appears to contradict the value of that reliance.'
  - where: 'note 22:8 “His trust turned into a taunt”'
    claim: 'The Greek psalm and the Gospels share vocabulary'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'The LXX phrase “wagging their heads” uses the same Greek roots as those found in Matthew 27:39 and Mark 15:29'
  - where: 'note 22:8 “His trust turned into a taunt”'
    claim: 'The text of Matthew 27:39–43'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/27?lang=eng'
    quote: 'He trusted in God; let him deliver him now, if he will have him'

  # ---- note 7: Bulls, a lion, dogs ----
  - where: 'note 22:12 “Bulls, a lion, dogs”'
    claim: 'Bashan lay east of the Jordan and was known for its cattle'
    key: bd-bashan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bashan?lang=eng'
    quote: 'The district east of Jordan and north of Gilead'
  - where: 'note 22:12 “Bulls, a lion, dogs”'
    claim: 'Bashan was known for its breed of cattle'
    key: bd-bashan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/bashan?lang=eng'
    quote: 'It was an area rich in grain production and known for its breed of cattle (Ps. 22:12)'
  - where: 'note 22:12 “Bulls, a lion, dogs”'
    claim: 'The Greek has “fat bulls”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/22.htm'
    quote: 'Many bullocks have compassed me: fat bulls have beset me round.'
  - where: 'note 22:12 “Bulls, a lion, dogs”'
    claim: '“Dogs” is a term of contempt'
    key: hopkin-psalm-22
    url: 'https://byustudies.byu.edu/article/my-god-my-god-why-hast-thou-forsaken-me-psalm-22-and-the-mission-of-christ'
    quote: 'a derisive term often reserved in the Bible for the ritually impure'
  - where: 'note 22:12 “Bulls, a lion, dogs”'
    claim: 'Re’em is the wild ox; the Greek “one-horned” is marked erroneous'
    key: bdb
    url: 'https://biblehub.com/hebrew/7214.htm'
    quote: '(erroneous) μονοκέρως'
  - where: 'note 22:12 “Bulls, a lion, dogs”'
    claim: 'Re’em means wild ox'
    key: bdb
    url: 'https://biblehub.com/hebrew/7214.htm'
    quote: 'wild ox, as fierce and strong'
  - where: 'note 22:12 “Bulls, a lion, dogs”'
    claim: 'The Greek translation has “unicorns”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/22.htm'
    quote: 'from the horns of the unicorns.'
  - where: 'note 22:12 “Bulls, a lion, dogs”'
    claim: '“My darling” is “my only one,” a poetic name for life'
    key: bdb
    url: 'https://biblehub.com/hebrew/3173.htm'
