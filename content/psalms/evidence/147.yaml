chapter: 147
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The psalm has been read of the restoration under Ezra and Nehemiah (given as a reading, not a fact)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/147.htm'
    quote: 'It is the tone of the restoration-period of Ezra and Nehemiah that meets us sounding forth out of this and the two following Psalms'

  # ---- setting ----
  - where: 'setting'
    claim: 'One older reading hears the period of Ezra and Nehemiah in the psalm'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/147.htm'
    quote: 'It is the tone of the restoration-period of Ezra and Nehemiah that meets us sounding forth out of this and the two following Psalms'
  - where: 'setting'
    claim: 'The same reading thinks a connection with the dedication of the walls very probable'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/147.htm'
    quote: 'the reference to the Feast of the Dedication of the walls is very probable'
  - where: 'setting'
    claim: 'The dedication of the wall was kept with thanksgiving, singing and instruments'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/12?lang=eng'
    quote: 'to keep the dedication with gladness, both with thanksgivings, and with singing, with cymbals, psalteries, and with harps'
  - where: 'setting'
    claim: 'The psalm before this one also opens and closes with “Praise ye the Lord” (the five closing psalms are described at Psalm 150)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/146?lang=eng'
    quote: 'The Lord shall reign for ever, even thy God, O Zion, unto all generations. Praise ye the Lord.'
  - where: 'setting'
    claim: 'Psalm 146 opens with “Praise ye the Lord”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/146?lang=eng'
    quote: 'Praise ye the Lord. Praise the Lord, O my soul.'
  - where: 'setting'
    claim: 'Psalm 148 opens with “Praise ye the Lord”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/148?lang=eng'
    quote: 'Praise ye the Lord. Praise ye the Lord from the heavens'
  - where: 'setting'
    claim: 'Psalm 148 closes with “Praise ye the Lord”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/148?lang=eng'
    quote: 'a people near unto him. Praise ye the Lord.'
  - where: 'setting'
    claim: 'Psalm 149 opens with “Praise ye the Lord”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/149?lang=eng'
    quote: 'Praise ye the Lord. Sing unto the Lord a new song'
  - where: 'setting'
    claim: 'Psalm 149 closes with “Praise ye the Lord”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/149?lang=eng'
    quote: 'this honour have all his saints. Praise ye the Lord.'
  - where: 'setting'
    claim: 'Psalm 150 opens with “Praise ye the Lord”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/150?lang=eng'
    quote: 'Praise ye the Lord. Praise God in his sanctuary'
  - where: 'setting'
    claim: 'Psalm 150 closes with “Praise ye the Lord”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/150?lang=eng'
    quote: 'Let every thing that hath breath praise the Lord. Praise ye the Lord.'
  - where: 'setting'
    claim: 'In the Greek, verse 12 begins a new psalm with its own heading (verses 1–11 carry the Greek number 146; verse 12 on do not)'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/147.htm'
    quote: 'Alleluia, a Psalm of Aggaeus and Zacharias. Praise the Lord, O Jerusalem; praise thy God, O Sion.'
  - where: 'setting'
    claim: 'The Greek makes verses 12–20 a psalm by themselves'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/147.htm'
    quote: 'In the lxx this strophe is a Psalm (Lauda Jerusalem) of itself.'
  - where: 'setting'
    claim: 'Isaiah 40:26 has the stars brought out by number and called by names'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/40?lang=eng'
    quote: 'that bringeth out their host by number: he calleth them all by names'
  - where: 'setting'
    claim: 'Isaiah 40:28 has the understanding that cannot be searched'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/40?lang=eng'
    quote: 'there is no searching of his understanding'
  - where: 'setting'
    claim: 'Isaiah 61:1 has the binding up of the brokenhearted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/61?lang=eng'
    quote: 'he hath sent me to bind up the brokenhearted'

  # ---- thread ----
  - where: 'thread'
    claim: 'The horse and the legs are a warrior’s strength'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/147.htm'
    quote: 'but only that God has no pleasure in the warrior''s horse and in athletic strength'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Comely” rendered “fitting”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20147&version=NRSVUE'
    quote: 'a song of praise is fitting'
  - where: 'section 1 plain'
    claim: '“Telleth” rendered “counts”: to tell is to count'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/tell'
    quote: 'To count; to number.'
  - where: 'section 1 plain'
    claim: '“Infinite” rendered “cannot be numbered”: the Hebrew is “there is no number”'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/147.htm'
    quote: 'to His understanding there is no number'
  - where: 'section 4 plain'
    claim: '“Hoarfrost” rendered “frost” and “morsels” rendered “crumbs”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20147&version=NRSVUE'
    quote: 'he scatters frost like ashes'
  - where: 'section 4 plain'
    claim: '“Morsels” rendered “crumbs”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20147&version=NRSVUE'
    quote: 'like crumbs'
  - where: 'section 4 plain'
    claim: '“Sheweth” rendered “declares”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20147&version=NRSVUE'
    quote: 'He declares his word to Jacob'

  # ---- note 147:2 ----
  - where: 'note 147:2 “A city with its gates barred again, and a promise being kept”'
    claim: 'Moses promised that the Lord would gather scattered Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/30?lang=eng'
    quote: 'will return and gather thee from all the nations, whither the Lord thy God hath scattered thee'
  - where: 'note 147:2 “A city with its gates barred again, and a promise being kept”'
    claim: 'In his prayer Nehemiah asks God to remember the word given through Moses, the scattering and the gathering of those who turn to Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/1?lang=eng'
    quote: 'Remember, I beseech thee, the word that thou commandedst thy servant Moses'
  - where: 'note 147:2 “A city with its gates barred again, and a promise being kept”'
    claim: 'Nehemiah’s builders set bars on gate after gate (verses 3, 6, 13, 14, 15)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/3?lang=eng'
    quote: 'they laid the beams thereof, and set up the doors thereof, and the locks thereof, and the bars thereof'
  - where: 'note 147:2 “A city with its gates barred again, and a promise being kept”'
    claim: 'When the wall was built Nehemiah ordered the gates shut and barred'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/7?lang=eng'
    quote: 'let them shut the doors, and bar them'
  - where: 'note 147:2 “A city with its gates barred again, and a promise being kept”'
    claim: 'Isaiah calls the Lord the gatherer of the outcasts of Israel and promises a further gathering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/56?lang=eng'
    quote: 'The Lord God which gathereth the outcasts of Israel saith, Yet will I gather others to him'

  # ---- note 147:4 ----
  - where: 'note 147:4 “Why the stars come straight after the broken hearts”'
    claim: '“Tell” in older English means to count'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/tell'
    quote: 'To count; to number.'
  - where: 'note 147:4 “Why the stars come straight after the broken hearts”'
    claim: 'Isaiah 40:26 has the host brought out by number, called by names, none failing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/40?lang=eng'
    quote: 'that bringeth out their host by number: he calleth them all by names by the greatness of his might, for that he is strong in power; not one faileth'
  - where: 'note 147:4 “Why the stars come straight after the broken hearts”'
    claim: 'The next verse of Isaiah quotes Israel’s complaint that God does not see them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/40?lang=eng'
    quote: 'Why sayest thou, O Jacob, and speakest, O Israel, My way is hid from the Lord'
  - where: 'note 147:4 “Why the stars come straight after the broken hearts”'
    claim: 'The connection of the stars with the broken hearts is explained from Isaiah 40:26–27'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/147.htm'
    quote: 'The connection of the thoughts, which the poet now brings to the stars, becomes clear from the primary passage, Isaiah 40:26, cf. Isaiah 40:27.'
  - where: 'note 147:4 “Why the stars come straight after the broken hearts”'
    claim: 'Relieving human woe is a small matter to the One who numbers the stars'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/147.htm'
    quote: 'To be acquainted with human woe and to relieve it is an easy and small matter to Him who allots a number to the stars, that are to man innumerable'
  - where: 'note 147:4 “Why the stars come straight after the broken hearts”'
    claim: 'The Lord told Moses that all things are numbered to Him because they are His and He knows them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'innumerable are they unto man; but all things are numbered unto me, for they are mine and I know them'

  # ---- note 147:5 ----
  - where: 'note 147:5 “Infinite is “no number””'
    claim: 'Verse 5 ends with “there is not” (H369) and the noun “number” (H4557), the noun of verse 4 (hebrew.mjs psalms 147:4-5)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מִסְפָּֽר'
  - where: 'note 147:5 “Infinite is “no number””'
    claim: 'Verse 4 has the same noun for the number of the stars'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מִ֭סְפָּר'
  - where: 'note 147:5 “Infinite is “no number””'
    claim: 'The lexicon lists Psalm 147:5 under the phrase meaning innumerable, and 147:4 under “number”'
    key: bdb
    url: 'https://biblehub.com/hebrew/4557.htm'
    quote: 'it was (they were) innumerable'
  - where: 'note 147:5 “Infinite is “no number””'
    claim: 'A modern translation renders “beyond measure”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20147&version=NRSVUE'
    quote: 'his understanding is beyond measure'

  # ---- note 147:10 ----
  - where: 'note 147:10 “The war horse, the strong legs, and the crying ravens”'
    claim: 'The horse in the Psalms is trusted for war'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/20?lang=eng'
    quote: 'Some trust in chariots, and some in horses: but we will remember the name of the Lord our God.'
  - where: 'note 147:10 “The war horse, the strong legs, and the crying ravens”'
    claim: 'Psalm 33:17 calls the horse vain for safety'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/33?lang=eng'
    quote: 'An horse is a vain thing for safety: neither shall he deliver any by his great strength.'
  - where: 'note 147:10 “The war horse, the strong legs, and the crying ravens”'
    claim: 'A modern translation renders the legs as a runner’s speed'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20147&version=NRSVUE'
    quote: 'nor his pleasure in the speed of a runner'
  - where: 'note 147:10 “The war horse, the strong legs, and the crying ravens”'
    claim: 'Its footnote gives the Hebrew as “legs of a person”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20147&version=NRSVUE'
    quote: 'Heb legs of a person'
  - where: 'note 147:10 “The war horse, the strong legs, and the crying ravens”'
    claim: 'Job has the young ravens crying to God for food'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/job/38?lang=eng'
    quote: 'Who provideth for the raven his food? when his young ones cry unto God, they wander for lack of meat.'
  - where: 'note 147:10 “The war horse, the strong legs, and the crying ravens”'
    claim: 'The Savior pointed to the ravens God feeds'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/12?lang=eng'
    quote: 'Consider the ravens: for they neither sow nor reap; which neither have storehouse nor barn; and God feedeth them'
  - where: 'note 147:10 “The war horse, the strong legs, and the crying ravens”'
    claim: '“Mercy” in verse 11 is hesed (H2617; hebrew.mjs psalms 147:11), the word explained at Psalm 51:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לְ/חַסְדּֽ/וֹ'

  # ---- note 147:18 ----
  - where: 'note 147:18 “One word for the weather and for the law”'
    claim: 'Psalm 33:6 has the heavens made by the word of the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/33?lang=eng'
    quote: 'By the word of the Lord were the heavens made; and all the host of them by the breath of his mouth.'
  - where: 'note 147:18 “One word for the weather and for the law”'
    claim: 'Psalm 148:8 has snow and wind fulfilling His word'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/148?lang=eng'
    quote: 'Fire, and hail; snow, and vapour; stormy wind fulfilling his word:'
  - where: 'note 147:18 “One word for the weather and for the law”'
    claim: 'Isaiah compares the word to rain and snow that come down and do their work'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/55?lang=eng'
    quote: 'For as the rain cometh down, and the snow from heaven, and returneth not thither, but watereth the earth'
  - where: 'note 147:18 “One word for the weather and for the law”'
    claim: 'One older reading: the word by which God rules nature is the word given to Israel as statutes and judgments'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/147.htm'
    quote: 'The word, which is the medium of God''s cosmical rule, is gone forth as a word of salvation to Israel, and, unfolding itself in statutes and judgments'

  # ---- note 147:20 ----
  - where: 'note 147:20 “What Israel alone had been given”'
    claim: 'Moses names the same pair, statutes and judgments, as what no other nation has'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/4?lang=eng'
    quote: 'And what nation is there so great, that hath statutes and judgments so righteous as all this law, which I set before you this day?'
  - where: 'note 147:20 “What Israel alone had been given”'
    claim: 'Amos joins Israel’s being known with being held to account'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/amos/3?lang=eng'
    quote: 'You only have I known of all the families of the earth: therefore I will punish you for all your iniquities.'
  - where: 'note 147:20 “What Israel alone had been given”'
    claim: 'The Lord brings forth His word to all nations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/2-ne/29?lang=eng'
    quote: 'I bring forth my word unto the children of men, yea, even upon all the nations of the earth'
  - where: 'note 147:20 “What Israel alone had been given”'
    claim: 'Alma teaches that the Lord grants His word to all nations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/29?lang=eng'
    quote: 'the Lord doth grant unto all nations, of their own nation and tongue, to teach his word'

  # ---- christ ----
  - where: 'christ'
    claim: 'Jesus read of healing the brokenhearted in Nazareth and said the scripture was fulfilled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/4?lang=eng'
    quote: 'And he began to say unto them, This day is this scripture fulfilled in your ears.'
  - where: 'christ'
    claim: 'At His coming the angels gather His elect from the four winds'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/24?lang=eng'
    quote: 'they shall gather together his elect from the four winds, from one end of heaven to the other'
  - where: 'christ'
    claim: 'The Church’s edition has a footnote at “outcasts” in verse 2 pointing to Matthew 24:31 (footnote 2b, as footnotes.mjs psalms 147 prints it)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/147?lang=eng'
    quote: 'Matt. 24:31'

  # ---- explore ----
  - where: 'explore'
    claim: 'Psalm 33:16–18 ends, as verse 11 here does, with those who fear Him and hope in His mercy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/33?lang=eng'
    quote: 'Behold, the eye of the Lord is upon them that fear him, upon them that hope in his mercy;'
  - where: 'explore'
    claim: 'Moses 1:33 has worlds without number, created by the Son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/1?lang=eng'
    quote: 'And worlds without number have I created; and I also created them for mine own purpose'
  - where: 'explore'
    claim: 'Psalm 148:3 calls on the stars to praise'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/148?lang=eng'
    quote: 'Praise ye him, sun and moon: praise him, all ye stars of light.'
  - where: 'explore'
    claim: 'Psalm 107 sings the gathering from the four quarters'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/107?lang=eng'
    quote: 'And gathered them out of the lands, from the east, and from the west, from the north, and from the south.'
  - where: 'explore'
    claim: 'Isaiah 11:12 has the outcasts of Israel assembled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/11?lang=eng'
    quote: 'shall assemble the outcasts of Israel, and gather together the dispersed of Judah from the four corners of the earth'
  - where: 'explore'
    claim: 'Psalm 148 names snow and stormy wind among those called to praise'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/148?lang=eng'
    quote: 'Fire, and hail; snow, and vapour; stormy wind fulfilling his word:'
