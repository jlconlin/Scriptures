chapter: 2
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The Saints in Jerusalem quote Psalm 2:1–2 as spoken by David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/4?lang=eng'
    quote: 'Who by the mouth of thy servant David hast said, Why did the heathen rage, and the people imagine vain things?'

  # ---- setting ----
  - where: 'setting'
    claim: 'Acts 4:25 names David as the one through whom the psalm was spoken'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/4?lang=eng'
    quote: 'Who by the mouth of thy servant David hast said, Why did the heathen rage'
  - where: 'setting'
    claim: 'Paul cites it by number as the second psalm'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/13?lang=eng'
    quote: 'as it is also written in the second psalm, Thou art my Son, this day have I begotten thee.'
  - where: 'setting'
    claim: 'Psalms 1 and 2 introduce the whole collection'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'The first two psalms serve as an introduction to the entire collection.'
  - where: 'setting'
    claim: 'What a royal psalm is, and that Psalm 2 is the first of them'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Psalm 2 is the first psalm in the collection that is labeled a royal psalm, a category delineated by modern scholars to identify those psalms that feature discussion of, or speech from, the Israelite monarch or that celebrate the office of human kingship.'
  - where: 'setting'
    claim: 'Many scholars read Psalm 2 of the enthronement of a king in Jerusalem'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Many scholars interpret Psalm 2 to be about the enthronement, or coronation, of a historical Israelite king on Mount Zion in Jerusalem.'
  - where: 'setting'
    claim: 'The psalm was likely given its place at the head of the book after the monarchy had ended'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Psalm 2 would likely have been placed in its current position in the introduction to the book of Psalms in a later period, after the time of the Davidic monarchy, when there were no more kings being enthroned.'
  - where: 'setting'
    claim: 'Those who gave the book its final form would have read the psalm of a king still to come'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'those who put together the book of Psalms in its final form would have understood Psalm 2 to be looking forward prophetically to the coming of a future messianic king'
  - where: 'setting'
    claim: 'The promise to David in 2 Samuel 7: the Lord a father to David’s heir'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'I will be his father, and he shall be my son.'

  # ---- thread ----
  - where: 'thread'
    claim: 'Psalm 1 opens with the Hebrew word ashre, “blessed”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אַ֥שְֽׁרֵי'
  - where: 'thread'
    claim: 'Psalm 2:12 closes with the same word, ashre'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אַ֝שְׁרֵ֗י'
  - where: 'thread'
    claim: 'The verb behind “put their trust” (chasah) means to flee for protection, to take refuge'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/2620.htm'
    quote: 'A primitive root; to flee for protection (compare batach); figuratively, to confide in'

  # ---- sections ----
  - where: 'thread'
    claim: 'Some traditions read Psalms 1 and 2 as one psalm enclosed by the word “blessed” (1:1 and 2:12)'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'Some traditions view the first two psalms as a single psalm enclosed by the word happy—or “blessed” in the King James Version (see Psalms 1:1 and 2:12'
  - where: 'section 2 plain'
    claim: 'The verb of verse 6 (nasak) is rendered “installed”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5258.htm'
    quote: 'Psalm 2:6 I have installed my king upon Zion.'
  - where: 'section 4 plain'
    claim: '“Put their trust” is to take refuge'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/2620.htm'
    quote: 'NASB: take refuge, seek refuge, taken refuge, takes refuge'

  # ---- note 2:1 first Saints ----
  - where: 'note 2:1 “The first Saints prayed this psalm”'
    claim: 'The Saints quote verses 1–2 as David’s words, given by God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/4?lang=eng'
    quote: 'Who by the mouth of thy servant David hast said, Why did the heathen rage, and the people imagine vain things?'
  - where: 'note 2:1 “The first Saints prayed this psalm”'
    claim: 'They name Herod, Pilate, the Gentiles and the people of Israel as those gathered against Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/4?lang=eng'
    quote: 'For of a truth against thy holy child Jesus, whom thou hast anointed, both Herod, and Pontius Pilate, with the Gentiles, and the people of Israel, were gathered together,'
  - where: 'note 2:1 “The first Saints prayed this psalm”'
    claim: 'The prayer says the plotters did only what God had determined'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/4?lang=eng'
    quote: 'For to do whatsoever thy hand and thy counsel determined before to be done.'
  - where: 'note 2:1 “The first Saints prayed this psalm”'
    claim: 'They ask for boldness to speak'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/4?lang=eng'
    quote: 'grant unto thy servants, that with all boldness they may speak thy word'
  - where: 'note 2:1 “The first Saints prayed this psalm”'
    claim: 'The Greek version of the psalm reads “against his Christ,” the wording Acts 4:26 has'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/2.htm'
    quote: 'The kings of the earth stood up, and the rulers gathered themselves together, against the Lord, and against his Christ'
  - where: 'note 2:1 “The first Saints prayed this psalm”'
    claim: 'The Church’s study help notes that Peter and John associated verses 1–3 with the rejection of Jesus Christ'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'In the New Testament, Peter and John associated these words with the rejection of Jesus Christ.'

  # ---- note 2:1 imagine ----
  - where: 'note 2:1 “The nations meditate too”'
    claim: 'The verb of 2:1 is hagah, here “imagine, devise”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1897.htm'
    quote: 'imagine, devise, with accusative Psalm 2:1; Proverbs 24:2'
  - where: 'note 2:1 “The nations meditate too”'
    claim: 'The verb in Psalm 2:1 (H1897)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יֶהְגּוּ'
  - where: 'note 2:1 “The nations meditate too”'
    claim: 'The same verb (H1897) is “meditate” in Psalm 1:2'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'יֶהְגֶּ֗ה'
  - where: 'note 2:1 “The nations meditate too”'
    claim: 'Psalm 1:6 has “way” and “perish” (derek, abad), as Psalm 2:12 does'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'תֹּאבֵֽד'
  - where: 'note 2:1 “The nations meditate too”'
    claim: 'The language of Psalms 1 and 2 overlaps, and the two were placed together as an introduction'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'the themes, messages, and language of Psalms 1 and 2 are seen as overlapping and were given their current place by the editors of the collection’s final form'
  - where: 'note 2:1 “The nations meditate too”'
    claim: 'Some read the righteous man of Psalm 1 and the anointed king of Psalm 2 as one figure'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Many commentators have seen a connection between the righteous man of Psalm 1 and the anointed king of Psalm 2, suggesting that they are one and the same'

  # ---- note 2:2 anointed ----
  - where: 'note 2:2 “The word behind Messiah and Christ”'
    claim: 'The Hebrew of “his anointed” is mashiach with a suffix'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'מְשִׁיחֽ/וֹ'
  - where: 'note 2:2 “The word behind Messiah and Christ”'
    claim: 'Mashiach is first the king of Israel, anointed by divine command; in Psalm 2:2 the Davidic dynasty'
    key: bdb
    url: 'https://biblehub.com/hebrew/4899.htm'
    quote: 'king of Israel anointed by divine command'
  - where: 'note 2:2 “The word behind Messiah and Christ”'
    claim: 'The lexicon places Psalm 2:2 under the Davidic dynasty with messianic ideals attached'
    key: bdb
    url: 'https://biblehub.com/hebrew/4899.htm'
    quote: 'Davidic dynasty with Messianic ideals attached Psalm 2:2'
  - where: 'note 2:2 “The word behind Messiah and Christ”'
    claim: 'The word is also used of the high priest and of Cyrus'
    key: bdb
    url: 'https://biblehub.com/hebrew/4899.htm'
    quote: 'Cyrus as commissioned by'
  - where: 'note 2:2 “The word behind Messiah and Christ”'
    claim: 'The high priest is called the anointed'
    key: bdb
    url: 'https://biblehub.com/hebrew/4899.htm'
    quote: 'high priest of Israel'
  - where: 'note 2:2 “The word behind Messiah and Christ”'
    claim: 'David is anointed by Samuel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/16?lang=eng'
    quote: 'Then Samuel took the horn of oil, and anointed him in the midst of his brethren'
  - where: 'note 2:2 “The word behind Messiah and Christ”'
    claim: 'David calls Saul the Lord’s anointed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/24?lang=eng'
    quote: 'seeing he is the anointed of the Lord'
  - where: 'note 2:2 “The word behind Messiah and Christ”'
    claim: 'Messiah means “the anointed,” and Christ is its Greek equivalent'
    key: bd-messiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/messiah?lang=eng'
    quote: 'An Aramaic word meaning “the anointed.”'
  - where: 'note 2:2 “The word behind Messiah and Christ”'
    claim: 'As a title, Messiah denotes the expected King and Deliverer; Christ is the Greek equivalent'
    key: bd-messiah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/messiah?lang=eng'
    quote: 'Used as the title of an office, it denotes the King and Deliverer whose coming the Jews were eagerly expecting. In the New Testament the deliverer is called the Christ, which is the Greek equivalent of Messiah'
  - where: 'note 2:2 “The word behind Messiah and Christ”'
    claim: 'The Greek version of the psalm has “his Christ”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/2.htm'
    quote: 'against the Lord, and against his Christ'
  - where: 'note 2:2 “The word behind Messiah and Christ”'
    claim: 'A royal psalm features the Israelite king or celebrates kingship; many are also recognized as messianic'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'Many of these royal psalms are also recognized as messianic psalms.'
  - where: 'note 2:2 “The word behind Messiah and Christ”'
    claim: 'The definition of a royal psalm'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'those psalms that feature discussion of, or speech from, the Israelite monarch or that celebrate the office of human kingship'

  # ---- note 2:4 laugh ----
  - where: 'note 2:4 “Why the Lord laughs”'
    claim: 'One reading: the laughter marks the infinite distance between God and the rebels'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/2.htm'
    quote: 'He laughs at the defiant ones, for between them and Him there is an infinite distance'
  - where: 'note 2:4 “Why the Lord laughs”'
    claim: 'The Lord is enthroned above the tumult'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/2.htm'
    quote: 'He is enthroned above them in unapproachable majesty and ever-abiding glory'
  - where: 'note 2:4 “Why the Lord laughs”'
    claim: 'Psalm 37:13 has the Lord laughing at the wicked because He sees his day coming'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/37?lang=eng'
    quote: 'The Lord shall laugh at him: for he seeth that his day is coming.'
  - where: 'note 2:4 “Why the Lord laughs”'
    claim: 'Psalm 59:8 has the same pair, laughter and derision, of the heathen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/59?lang=eng'
    quote: 'But thou, O Lord, shalt laugh at them; thou shalt have all the heathen in derision.'

  # ---- note 2:7 son ----
  - where: 'note 2:7 “Israel’s king was called God’s son”'
    claim: 'In several Old Testament verses God declares the king of Israel His son'
    key: sc-knowhy-865
    url: 'https://scripturecentral.org/knowhy/why-does-god-declare-jesus-to-be-his-son'
    quote: 'In several verses of the Old Testament, God declares the king of Israel to be his son, showing the special relationship between God and the king.'
  - where: 'note 2:7 “Israel’s king was called God’s son”'
    claim: '“Son of God” was understood as a title for the king'
    key: sc-knowhy-865
    url: 'https://scripturecentral.org/knowhy/why-does-god-declare-jesus-to-be-his-son'
    quote: 'the phrase “son of God” would have been understood as a title for the king. Thus, declaring someone to be a “son of God” would have been one way of declaring them to be the king.'
  - where: 'note 2:7 “Israel’s king was called God’s son”'
    claim: 'The promise to David about his seed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: 'I will be his father, and he shall be my son.'
  - where: 'note 2:7 “Israel’s king was called God’s son”'
    claim: 'The same is said of Solomon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/28?lang=eng'
    quote: 'for I have chosen him to be my son, and I will be his father.'
  - where: 'note 2:7 “Israel’s king was called God’s son”'
    claim: 'Psalm 89 has the king call God his father and God make him firstborn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/89?lang=eng'
    quote: 'Also I will make him my firstborn, higher than the kings of the earth.'
  - where: 'note 2:7 “Israel’s king was called God’s son”'
    claim: 'Psalm 2 is among the messianic psalms that relate to the covenant with David'
    key: scripture-helps-ps-1
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/32-psalms-1-2-3-19-33-40-46?lang=eng'
    quote: 'Many of the messianic psalms also relate to the fulfillment of the Davidic covenant (see Psalms 2; 18; 45; 72; 89; 110; 132).'
  - where: 'note 2:7 “Israel’s king was called God’s son”'
    claim: 'The anointed king is the one who announces the decree'
    key: ot-minute-psalms-1-20
    url: 'https://scripturecentral.org/archive/books/book-chapter/psalm-1-20'
    quote: 'The anointed king, or Messiah, then announces the decree that the Lord has given him'

  # ---- note 2:7 begotten ----
  - where: 'note 2:7 “The New Testament hears the Father speaking to Jesus”'
    claim: 'Paul quotes the verse of God’s raising up Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/13?lang=eng'
    quote: 'God hath fulfilled the same unto us their children, in that he hath raised up Jesus again; as it is also written in the second psalm, Thou art my Son, this day have I begotten thee.'
  - where: 'note 2:7 “The New Testament hears the Father speaking to Jesus”'
    claim: 'Hebrews 1:5 quotes it beside 2 Samuel 7:14 to set the Son above the angels'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/1?lang=eng'
    quote: 'For unto which of the angels said he at any time, Thou art my Son, this day have I begotten thee? And again, I will be to him a Father, and he shall be to me a Son?'
  - where: 'note 2:7 “The New Testament hears the Father speaking to Jesus”'
    claim: 'Hebrews 5:5 quotes it of Christ’s call as high priest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/5?lang=eng'
    quote: 'So also Christ glorified not himself to be made an high priest; but he that said unto him, Thou art my Son, to day have I begotten thee.'
  - where: 'note 2:7 “The New Testament hears the Father speaking to Jesus”'
    claim: 'Hebrews 5:6 goes straight on to Psalm 110:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/5?lang=eng'
    quote: 'As he saith also in another place, Thou art a priest for ever after the order of Melchisedec.'
  - where: 'note 2:7 “The New Testament hears the Father speaking to Jesus”'
    claim: 'The voice at the baptism in Luke 3:22'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/3?lang=eng'
    quote: 'a voice came from heaven, which said, Thou art my beloved Son; in thee I am well pleased.'
  - where: 'note 2:7 “The New Testament hears the Father speaking to Jesus”'
    claim: 'Some manuscripts of Luke 3:22 have the words of Psalm 2:7 instead'
    key: sc-knowhy-865
    url: 'https://scripturecentral.org/knowhy/why-does-god-declare-jesus-to-be-his-son'
    quote: 'However, some New Testament manuscripts instead state, “And the Holy Ghost descended in a bodily shape like a dove upon him, and a voice came from heaven, which said, Thou art my Son; this day have I begotten thee.”'
  - where: 'note 2:7 “The New Testament hears the Father speaking to Jesus”'
    claim: 'That shows some ancient readers connected the baptism with the psalm about the king'
    key: sc-knowhy-865
    url: 'https://scripturecentral.org/knowhy/why-does-god-declare-jesus-to-be-his-son'
    quote: 'at least some ancient readers of Luke’s gospel connected God’s declaration of Jesus’ sonship with this verse from the Psalms about the King of Israel being God’s son'
  - where: 'note 2:7 “The New Testament hears the Father speaking to Jesus”'
    claim: 'Jesus is Son in two ways: Only Begotten in the flesh, and the ultimate King'
    key: sc-knowhy-865
    url: 'https://scripturecentral.org/knowhy/why-does-god-declare-jesus-to-be-his-son'
    quote: 'Jesus truly is the Son of God in two ways: the only begotten Son of God in the flesh, as well as the ultimate King.'

  # ---- note 2:9 rod of iron ----
  - where: 'note 2:9 “Break, or shepherd?”'
    claim: 'The Hebrew verb as pointed is from ra‘a‘, to break; the lexicon recommends reading it as “shepherd” with the ancient versions'
    key: bdb
    url: 'https://biblehub.com/hebrew/7489.htm'
    quote: 'Psalm 2:9 (but read תִּרְעֵם, see I.'
  - where: 'note 2:9 “Break, or shepherd?”'
    claim: 'Ra‘ah is to pasture, tend; its related noun in Assyrian means ruler'
    key: bdb
    url: 'https://biblehub.com/hebrew/7462.htm'
    quote: 'verb pasture, tend, graze (Assyrian rê°û, verb pasture, noun ruler'
  - where: 'note 2:9 “Break, or shepherd?”'
    claim: 'The Greek version of the psalm reads “rule” (poimaneis, shepherd)'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/2.htm'
    quote: 'Thou shalt rule them with a rod of iron; thou shalt dash them in pieces as a potter''s vessel.'
  - where: 'note 2:9 “Break, or shepherd?”'
    claim: 'The Greek verb in the psalm is poimaneis'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sepd/psalms/2.htm'
    quote: 'ποιμανεῖς αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ'
  - where: 'note 2:9 “Break, or shepherd?”'
    claim: 'Revelation 2:27 has the same Greek verb, “he will shepherd”'
    key: greek-nt
    url: 'https://biblehub.com/interlinear/revelation/2-27.htm'
    quote: 'poimanei ποιμανεῖ he will shepherd'
  - where: 'note 2:9 “Break, or shepherd?”'
    claim: 'Revelation 2:26–27: the Savior gives the promise to those who overcome, as He received it of the Father'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/2?lang=eng'
    quote: 'And he shall rule them with a rod of iron; as the vessels of a potter shall they be broken to shivers: even as I received of my Father.'
  - where: 'note 2:9 “Break, or shepherd?”'
    claim: 'Revelation 12:5 uses the line of the man child'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/12?lang=eng'
    quote: 'And she brought forth a man child, who was to rule all nations with a rod of iron'
  - where: 'note 2:9 “Break, or shepherd?”'
    claim: 'Revelation 19:15 uses it of the rider whose mouth holds a sword'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rev/19?lang=eng'
    quote: 'And out of his mouth goeth a sharp sword, that with it he should smite the nations: and he shall rule them with a rod of iron'
  - where: 'note 2:9 “Break, or shepherd?”'
    claim: 'The Joseph Smith Translation of Revelation 2:27 reads “the word of God” for the rod of iron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-rev/2?lang=eng'
    quote: 'And he shall rule them with the word of God; and they shall be in his hands as the vessels of clay in the hands of a potter; and he shall govern them by faith, with equity and justice, even as I received of my Father.'

  # ---- note 2:12 kiss ----
  - where: 'note 2:12 “Homage to the king, in a hard line of Hebrew”'
    claim: 'To kiss is to do homage, as Samuel kissed Saul'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/2.htm'
    quote: 'To kiss is equivalent to to do homage. Samuel kisses Saul (1 Samuel 10:1), saying that thereby he does homage to him.'
  - where: 'note 2:12 “Homage to the king, in a hard line of Hebrew”'
    claim: 'Samuel anoints Saul and kisses him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/10?lang=eng'
    quote: 'Then Samuel took a vial of oil, and poured it upon his head, and kissed him'
  - where: 'note 2:12 “Homage to the king, in a hard line of Hebrew”'
    claim: 'The word for “Son” in verse 12 is bar'
    key: oshb-wlc
