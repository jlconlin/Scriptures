chapter: 106
claims:
  # ---- when ----
  - where: 'when'
    claim: 'The psalm is anonymous (no title)'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/106.htm'
    quote: 'With this anonymous Psalm begins the series of the strictly Hallelujah-Psalms'

  # ---- setting ----
  - where: 'setting'
    claim: 'The psalm is anonymous and is a hallelujah psalm'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/106.htm'
    quote: 'With this anonymous Psalm begins the series of the strictly Hallelujah-Psalms'
  - where: 'setting'
    claim: 'Verse 48 is the blessing that closes the Fourth Book'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/106.htm'
    quote: 'together with the Beracha (Psalm 106:48) which closes the Fourth Book of the Psalms'
  - where: 'setting'
    claim: 'Psalms 78, 105 and 106 recite the history with three different purposes'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/106.htm'
    quote: 'In Psalm 78 it is didactic; in Psalm 105 hymnic; and here in Psalm 106 penitential.'
  - where: 'setting'
    claim: 'Its kin are the prayers of confession: Solomon’s, Daniel’s, and the Levites’ in Nehemiah 9'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/106.htm'
    quote: 'Solomon''s prayer at the dedication of the Temple, 1 Kings 8. And to this kind of tephilla, the Vidduj, belong, beyond the range of the Psalter, the prayer of Daniel'
  - where: 'setting'
    claim: 'The Levites’ prayer in Nehemiah 9 confesses the calf and the fathers’ provocations'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/9?lang=eng'
    quote: 'Yea, when they had made them a molten calf, and said, This is thy God that brought thee up out of Egypt, and had wrought great provocations;'
  - where: 'setting'
    claim: 'Chronicles gives the song as delivered by David to Asaph and his brethren'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'Then on that day David delivered first this psalm to thank the Lord into the hand of Asaph and his brethren.'
  - where: 'setting'
    claim: 'Chronicles puts the first verse and the last two of the psalm at the end of that song'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/106.htm'
    quote: 'in 1 Chronicles 16:34-36, puts the first and last verses of this Psalm (Psalm 106:1, Psalm 106:47), together with the Beracha (Psalm 106:48)'

  # ---- thread ----
  - where: 'thread'
    claim: 'Psalm 105 opens its history from the covenant God remembered (its wilderness without murmuring is the subject of the site’s note on Ps. 105:40, to which the thread points)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/105?lang=eng'
    quote: 'He hath remembered his covenant for ever, the word which he commanded to a thousand generations.'

  # ---- sections ----
  - where: 'section 3 plain'
    claim: 'Verse 15: a wasting sickness sent among them'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20106&version=NRSVUE'
    quote: 'but sent a wasting disease among them.'
  - where: 'section 3 plain'
    claim: 'Verse 16: Aaron the holy one of the LORD'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20106&version=NRSVUE'
    quote: 'and of Aaron, the holy one of the Lord.'
  - where: 'section 4 plain'
    claim: 'Verse 26: the raised hand is an oath'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20106&version=NRSVUE'
    quote: '26 Therefore he raised his hand and swore to them'
  - where: 'section 4 plain'
    claim: 'Verse 30: Phinehas intervened'
    key: bdb
    url: 'https://biblehub.com/hebrew/6419.htm'
    quote: 'Psalm 106:30 (absolute) he interposed (by slaying offender)'
  - where: 'section 5 plain'
    claim: 'Verse 37: demons'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20106&version=NRSVUE'
    quote: 'and their daughters to the demons;'
  - where: 'section 6 plain'
    claim: 'Verse 45: He showed compassion'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20106&version=NRSVUE'
    quote: 'and showed compassion according to the abundance of his steadfast love.'

  # ---- notes ----
  - where: 'note 106:4 “One voice before the confession”'
    claim: 'The Greek has the plural in verse 4'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/106.htm'
    quote: 'Remember us, O Lord, with the favour thou hast to thy people: visit us with thy salvation;'

  - where: 'note 106:6 “The confession Solomon foresaw”'
    claim: 'Solomon’s prayer foresees captives confessing with three verbs'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'saying, We have sinned, and have done perversely, we have committed wickedness;'
  - where: 'note 106:6 “The confession Solomon foresaw”'
    claim: 'Verse 6 and verse 46 have been traced to Solomon’s prayer'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/106.htm'
    quote: 'From this source comes Psalm 106:6, and also from this source Psalm 106:46, cf. 1 Kings 8:50'
  - where: 'note 106:6 “The confession Solomon foresaw”'
    claim: 'A modern translation joins the singers and the fathers as fellow sinners'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20106&version=NRSVUE'
    quote: '6 Both we and our ancestors have sinned;'

  - where: 'note 106:7 “The rebellion at the sea came before the crossing”'
    claim: 'The complaint at the sea was made before the crossing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/14?lang=eng'
    quote: 'Because there were no graves in Egypt, hast thou taken us away to die in the wilderness?'
  - where: 'note 106:7 “The rebellion at the sea came before the crossing”'
    claim: 'A modern translation has “rebelled” for “provoked”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20106&version=NRSVUE'
    quote: 'but rebelled against the Most High at the Red Sea.'

  - where: 'note 106:8 “Ezekiel tells the same history with the same reason”'
    claim: 'Ezekiel 20 repeats that the LORD acted for His name’s sake before the nations who saw the exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'But I wrought for my name’s sake, that it should not be polluted before the heathen, in whose sight I brought them out.'
  - where: 'note 106:8 “Ezekiel tells the same history with the same reason”'
    claim: 'Ezekiel 20 ends with a return to the land, for His name’s sake'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'when I have wrought with you for my name’s sake, not according to your wicked ways'

  - where: 'note 106:15 “Leanness is the plague that came with the quails”'
    claim: 'The craving for meat ended in a plague while they ate'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/11?lang=eng'
    quote: 'And while the flesh was yet between their teeth, ere it was chewed, the wrath of the Lord was kindled against the people, and the Lord smote the people with a very great plague.'
  - where: 'note 106:15 “Leanness is the plague that came with the quails”'
    claim: 'A modern translation has a wasting disease sent among them'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20106&version=NRSVUE'
    quote: 'but sent a wasting disease among them.'
  - where: 'note 106:15 “Leanness is the plague that came with the quails”'
    claim: 'One older reading: the verse takes the plague of Numbers 11:33–35 as a wasting disease'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/106.htm'
    quote: 'inasmuch as he interprets Numbers 11:33-35 of a wasting disease'

  - where: 'note 106:16 “The holy one the rebels said was no holier than they”'
    claim: 'Dathan and Abiram were Reubenites who rose with Korah, whom Numbers names first'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'Now Korah, the son of Izhar, the son of Kohath, the son of Levi, and Dathan and Abiram, the sons of Eliab, and On, the son of Peleth, sons of Reuben, took men:'
  - where: 'note 106:16 “The holy one the rebels said was no holier than they”'
    claim: 'A modern translation renders “saint” as holy one'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20106&version=NRSVUE'
    quote: 'and of Aaron, the holy one of the Lord.'
  - where: 'note 106:16 “The holy one the rebels said was no holier than they”'
    claim: 'The census says the earth swallowed them with Korah and that Korah’s children did not die'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'Notwithstanding the children of Korah died not.'

  - where: 'note 106:20 “Their glory was God Himself”'
    claim: 'Jeremiah uses the same words of Israel exchanging its God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/2?lang=eng'
    quote: 'Hath a nation changed their gods, which are yet no gods? but my people have changed their glory for that which doth not profit.'
  - where: 'note 106:20 “Their glory was God Himself”'
    claim: 'A modern translation writes “the glory of God”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20106&version=NRSVUE'
    quote: '20 They exchanged the glory of God'
  - where: 'note 106:20 “Their glory was God Himself”'
    claim: 'Paul uses nearly the same words of mankind’s idolatry'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/1?lang=eng'
    quote: 'And changed the glory of the uncorruptible God into an image made like to corruptible man'

  - where: 'note 106:23 “The man in the gap”'
    claim: 'Ezekiel gives the picture of a man making up the hedge and standing in the gap'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/22?lang=eng'
    quote: 'And I sought for a man among them, that should make up the hedge, and stand in the gap before me for the land, that I should not destroy it: but I found none.'
  - where: 'note 106:23 “The man in the gap”'
    claim: 'Moses pleaded after the calf and offered to be blotted out'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/32?lang=eng'
    quote: 'Yet now, if thou wilt forgive their sin—; and if not, blot me, I pray thee, out of thy book which thou hast written.'
  - where: 'note 106:23 “The man in the gap”'
    claim: 'The Joseph Smith Translation makes the sparing conditional on the people’s repentance'
    key: jst-ex-32
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/32?lang=eng'
    quote: 'If they will repent of the evil which they have done, I will spare them, and turn away my fierce wrath'

  - where: 'note 106:26 “A raised hand is an oath”'
    claim: 'A modern translation renders the raised hand as an oath'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20106&version=NRSVUE'
    quote: '26 Therefore he raised his hand and swore to them'
  - where: 'note 106:26 “A raised hand is an oath”'
    claim: 'After the spies’ report the LORD swore the generation would fall in the wilderness, having despised the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'But your little ones, which ye said should be a prey, them will I bring in, and they shall know the land which ye have despised.'
  - where: 'note 106:26 “A raised hand is an oath”'
    claim: 'Ezekiel reports an oath in the wilderness to scatter them among the heathen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/20?lang=eng'
    quote: 'I lifted up mine hand unto them also in the wilderness, that I would scatter them among the heathen, and disperse them through the countries;'
  - where: 'note 106:26 “A raised hand is an oath”'
    claim: 'Verses 24–27 refer to the rebellion after the spies’ report in Numbers 13–14'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/106.htm'
    quote: 'the rebellion in consequence of the report of the spies, which he brings forward as the fourth principal sin, is narrated in Numbers 13, Numbers 14'
  - where: 'note 106:26 “A raised hand is an oath”'
    claim: 'Ezekiel 20:23 is related to verse 26'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/106.htm'
    quote: 'Ezekiel 20:23 stands in a not accidental relationship to Psalm 106:26'

  - where: 'note 106:30 “Phinehas stepped between”'
    claim: 'Phinehas killed the man and the woman and the plague stopped'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/25?lang=eng'
    quote: 'And he went after the man of Israel into the tent, and thrust both of them through, the man of Israel, and the woman through her belly. So the plague was stayed from the children of Israel.'
  - where: 'note 106:30 “Phinehas stepped between”'
    claim: 'Phinehas was Aaron’s grandson and killed the two offenders at Peor'
    key: bd-phinehas
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/phinehas?lang=eng'
    quote: 'Grandson of Aaron (Ex. 6:25); kills the two offenders at Peor (Num. 25:7, 11; 31:6; Ps. 106:30)'
  - where: 'note 106:30 “Phinehas stepped between”'
    claim: 'The verb’s sense is intervene, interpose, whence both judging and praying'
    key: bdb
    url: 'https://biblehub.com/hebrew/6419.htm'
    quote: 'verb probably intervene, interpose (hence both arbitrate, judge, and intercede, pray'
  - where: 'note 106:30 “Phinehas stepped between”'
    claim: 'For this verse the lexicon gives “he interposed”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6419.htm'
    quote: 'Psalm 106:30 (absolute) he interposed (by slaying offender)'
  - where: 'note 106:30 “Phinehas stepped between”'
    claim: 'A modern translation has “interceded”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20106&version=NRSVUE'
    quote: '30 Then Phinehas stood up and interceded,'
  - where: 'note 106:30 “Phinehas stepped between”'
    claim: 'The Greek has “made atonement”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/106.htm'
    quote: 'Then Phinees stood up, and made atonement: and the plague ceased.'

  - where: 'note 106:31 “The words said of Abraham, said of a priest”'
    claim: 'Numbers gives Phinehas and his seed the covenant of an everlasting priesthood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/25?lang=eng'
    quote: 'And he shall have it, and his seed after him, even the covenant of an everlasting priesthood; because he was zealous for his God, and made an atonement for the children of Israel.'
  - where: 'note 106:31 “The words said of Abraham, said of a priest”'
    claim: 'One reading: the deed sprang from faith and proved him righteous, so the verse does not contradict Genesis 15'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/106.htm'
    quote: 'it was indeed an act which sprang from a constancy in faith, and one which obtained for him the acceptation of a righteous man for the sake of this upon which it was based, by proving him to be such.'

  - where: 'note 106:33 “Whose spirit was provoked at the waters of strife”'
    claim: 'A modern translation takes the spirit as Moses’s, made bitter'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20106&version=NRSVUE'
    quote: '33 for they made his spirit bitter,'
  - where: 'note 106:33 “Whose spirit was provoked at the waters of strife”'
    claim: 'The verb’s sense is to be contentious, rebellious'
    key: bdb
    url: 'https://biblehub.com/hebrew/4784.htm'
    quote: 'be contentious, refractory, rebellious'
  - where: 'note 106:33 “Whose spirit was provoked at the waters of strife”'
    claim: 'One reading: the verb is that of verses 7 and 43, of obstinacy against God, and the spirit is God’s (Isaiah 63:10); Moses was carried away by it; the event is in the fortieth year'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/106.htm'
    quote: 'since he suffered himself to be carried away by the persevering obstinacy of the people against the Spirit of God'
  - where: 'note 106:33 “Whose spirit was provoked at the waters of strife”'
    claim: 'The same verb stands in verses 7 and 43, of obstinacy against God'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/106.htm'
    quote: 'as in Psalm 106:7, Psalm 106:43, Psalm 78:17, Psalm 78:40, Psalm 78:56, of obstinacy against God'
  - where: 'note 106:33 “Whose spirit was provoked at the waters of strife”'
    claim: 'The waters of strife fall in the fortieth year'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/106.htm'
    quote: 'the insurrection against Moses and Aaron at the waters of strife in the fortieth year'
  - where: 'note 106:33 “Whose spirit was provoked at the waters of strife”'
    claim: 'The LORD charged Moses and Aaron with unbelief at Meribah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'Because ye believed me not, to sanctify me in the eyes of the children of Israel, therefore ye shall not bring this congregation into the land which I have given them.'
  - where: 'note 106:33 “Whose spirit was provoked at the waters of strife”'
    claim: 'In the form used in verses 7, 33 and 43 the verb is always of rebellion toward God'
    key: bdb
    url: 'https://biblehub.com/hebrew/4784.htm'
    quote: 'shew disobedience, rebelliousness, always toward God'

  - where: 'note 106:37 “The gods of Canaan called demons”'
    claim: 'The lexicon glosses the word “apparently demon”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7700.htm'
    quote: 'noun [masculine] apparently demon'
  - where: 'note 106:37 “The gods of Canaan called demons”'
    claim: 'The lexicon cites the word in Deuteronomy 32:17 and here'
    key: bdb
    url: 'https://biblehub.com/hebrew/7700.htm'
    quote: 'Deuteronomy 32:17 (compare Dr), Psalm 106:37 (human sacrifice).'
  - where: 'note 106:37 “The gods of Canaan called demons”'
    claim: 'A modern translation has “demons”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20106&version=NRSVUE'
    quote: 'and their daughters to the demons;'
  - where: 'note 106:37 “The gods of Canaan called demons”'
    claim: 'The Song of Moses says Israel sacrificed to devils'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/32?lang=eng'
    quote: 'They sacrificed unto devils, not to God; to gods whom they knew not, to new gods that came newly up, whom your fathers feared not.'

  - where: 'note 106:45 “The covenant that threatened the scattering also promised this”'
    claim: 'Leviticus 26 threatens scattering and promises that the covenant will be remembered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/26?lang=eng'
    quote: 'Then will I remember my covenant with Jacob, and also my covenant with Isaac, and also my covenant with Abraham will I remember; and I will remember the land.'
  - where: 'note 106:45 “The covenant that threatened the scattering also promised this”'
    claim: 'Judges gives the pattern of enemies, judges, and the LORD relenting at their groaning'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/2?lang=eng'
    quote: 'for it repented the Lord because of their groanings by reason of them that oppressed them and vexed them.'
  - where: 'note 106:45 “The covenant that threatened the scattering also promised this”'
    claim: 'A modern translation has “showed compassion” for “repented”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%20106&version=NRSVUE'
    quote: 'and showed compassion according to the abundance of his steadfast love.'

  - where: 'note 106:47 “The ending in David’s song, and in Ammon’s”'
    claim: 'Chronicles has the prayer of verse 47 in David’s song'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'And say ye, Save us, O God of our salvation, and gather us together, and deliver us from the heathen, that we may give thanks to thy holy name, and glory in thy praise.'
  - where: 'note 106:47 “The ending in David’s song, and in Ammon’s”'
    claim: 'Chronicles reports the people saying Amen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'Blessed be the Lord God of Israel for ever and ever. And all the people said, Amen, and praised the Lord.'
  - where: 'note 106:47 “The ending in David’s song, and in Ammon’s”'
    claim: 'Ammon’s thanksgiving likely borrows from Psalms 106–107'
    key: sc-knowhy-133
    url: 'https://scripturecentral.org/knowhy/why-did-ammon-borrow-so-much-from-tradition-in-alma-26'
    quote: 'Ammon sings praises and gives “thanks to his holy name.” Much of this language likely borrows from scriptural sources such as Psalms 106–107.'

  # ---- christ ----
  - where: 'christ'
    claim: 'Paul, recalling the wilderness, says it was Christ whom Israel tempted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/10?lang=eng'
    quote: 'Neither let us tempt Christ, as some of them also tempted, and were destroyed of serpents.'
  - where: 'christ'
    claim: 'Moses’s pleading after the calf is read as a reminder of Christ the advocate'
    key: scripture-helps-ex-19
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/15-exodus-19-20-24-31-34?lang=eng'
    quote: 'Moses’s pleading with the Lord on behalf of his people can remind us of Jesus Christ, who is our advocate with the Father.'
  - where: 'christ'
    claim: 'The Joseph Smith Translation calls Moses mediator of the first covenant'
    key: jst-gal-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gal/3?lang=eng'
    quote: 'who was ordained by the hand of angels to be a mediator of this first covenant, (the law.)'
  - where: 'christ'
    claim: 'and Christ the one mediator of the new covenant'
    key: jst-gal-3
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-gal/3?lang=eng'
    quote: 'but there is one mediator of the new covenant, who is Christ'

  # ---- explore ----
  - where: 'explore'
    claim: 'Paul says the wilderness events are written for our admonition'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/10?lang=eng'
    quote: 'Now all these things happened unto them for ensamples: and they are written for our admonition, upon whom the ends of the world are come.'
  - where: 'explore'
    claim: 'Psalm 107, the first of Book Five, opens with the thanksgiving of this psalm’s first verse'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/107?lang=eng'
    quote: 'O give thanks unto the Lord, for he is good: for his mercy endureth for ever.'
  - where: 'explore'
    claim: 'Psalm 107 speaks of a people gathered out of the lands'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/107?lang=eng'
    quote: 'And gathered them out of the lands, from the east, and from the west, from the north, and from the south.'

  # ---- parallels ----
  - where: 'parallels'
    claim: 'Phinehas turned away wrath'
    key: lds-scriptures
