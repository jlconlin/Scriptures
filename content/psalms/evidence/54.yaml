chapter: 54
claims:
  # ---- when, setting ----
  - where: 'when'
    claim: 'The title ascribes the psalm to David and sets it when the Ziphites informed Saul'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/54?lang=eng'
    quote: 'when the Ziphims came and said to Saul, Doth not David hide himself with us?'
  - where: 'setting'
    claim: 'The title ascribes the psalm to David and names the occasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/54?lang=eng'
    quote: 'A Psalm of David, when the Ziphims came and said to Saul'
  - where: 'setting'
    claim: 'The psalm is a Maschil, as the two psalms before it are'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/54.htm'
    quote: 'like the two preceding Psalms'
  - where: 'setting'
    claim: 'David was hiding from Saul in the wilderness of Ziph'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/23?lang=eng'
    quote: 'And David saw that Saul was come out to seek his life: and David was in the wilderness of Ziph in a wood.'
  - where: 'setting'
    claim: 'The Ziphites went to Saul at Gibeah and told him where David was'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/23?lang=eng'
    quote: 'Then came up the Ziphites to Saul to Gibeah, saying, Doth not David hide himself with us in strong holds in the wood'
  - where: 'setting'
    claim: 'The title has the wording of 1 Samuel 23:19 and 26:1'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/54.htm'
    quote: 'The form of the inscription of the Psalm is word for word the same as both in 1 Samuel 23:19 and in 1 Samuel 26:1'
  - where: 'setting'
    claim: 'The Ziphites inform Saul a second time in 1 Samuel 26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/26?lang=eng'
    quote: 'And the Ziphites came unto Saul to Gibeah, saying, Doth not David hide himself in the hill of Hachilah, which is before Jeshimon?'
  - where: 'setting'
    claim: 'The Hebrew has “God” (Elohim) in verses 1, 2, 3 and 4'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֱ֭לֹהִים'
  - where: 'setting'
    claim: 'The Hebrew has “the Lord” (Adonai) once, in verse 4'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֲ֝דֹנָ֗/י'
  - where: 'setting'
    claim: 'The Hebrew has the divine name once, in verse 6'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שִּׁמְ/ךָ֖'

  # ---- thread ----
  - where: 'thread'
    claim: 'The psalm falls into two parts divided by the Selah'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/54.htm'
    quote: 'This short song is divided into two parts by Sela The first half prays for help and answer.'
  - where: 'thread'
    claim: 'In the second half the speaker is certain of being heard and vows thanksgiving'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/54.htm'
    quote: 'In this second half, the poet, in the certainty of being heard, rejoices in help, and makes a vow of thanksgiving.'
  - where: 'thread'
    claim: 'Verse 4 opens with the Hebrew word translated “Behold”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'הִנֵּ֣ה'
  - where: 'thread'
    claim: 'A modern translation opens verse 4 with “But surely”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2054&version=NRSVUE'
    quote: 'But surely, God is my helper'
  - where: 'thread'
    claim: 'One reading: the past tenses of verse 7 give the ground of the thanksgiving'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/54.htm'
    quote: 'The praeterites mention the ground of the thanksgiving.'
  - where: 'thread'
    claim: 'On that reading what is still hoped for is spoken of as already past'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/54.htm'
    quote: 'What David now still hopes for will then lie behind him in the past.'

  # ---- sections ----
  - where: 'section 1 plain'
    claim: '“Judge me” rendered “vindicate me”; “oppressors” rendered “the ruthless”; “my soul” rendered “my life”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2054&version=NRSVUE'
    quote: 'and vindicate me by your might.'
  - where: 'section 1 plain'
    claim: '“Oppressors” rendered “the ruthless”, and “my soul” rendered “my life”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2054&version=NRSVUE'
    quote: 'the ruthless seek my life'
  - where: 'section 2 plain'
    claim: 'Verse 4b rendered “the upholder of my life”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2054&version=NRSVUE'
    quote: 'the Lord is the upholder of my life.'
  - where: 'section 2 plain'
    claim: '“In thy truth” rendered “in your faithfulness”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2054&version=NRSVUE'
    quote: 'In your faithfulness, put an end to them.'
  - where: 'section 2 plain'
    claim: 'The word for “enemies” in verse 5 is glossed “(insidious) watcher”'
    key: bdb
    url: 'https://biblehub.com/hebrew/8324.htm'
    quote: 'noun masculine (insidious) watcher'
  - where: 'section 2 plain'
    claim: 'The Greek has “return evil” for “reward evil”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/54.htm'
    quote: 'He shall return evil to mine enemies'
  - where: 'section 3 plain'
    claim: '“Praise thy name” rendered “give thanks”; verse 7b rendered without “his desire”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2054&version=NRSVUE'
    quote: 'I will give thanks to your name, O Lord, for it is good.'
  - where: 'section 3 plain'
    claim: 'Verse 7b rendered without “his desire”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2054&version=NRSVUE'
    quote: 'and my eye has looked in triumph on my enemies.'

  # ---- note on the title ----
  - where: 'note 54:0 “The Ziphites tell Saul where David is”'
    claim: 'Ziph is listed among the cities given to Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/15?lang=eng'
    quote: 'Maon, Carmel, and Ziph, and Juttah,'
  - where: 'note 54:0 “The Ziphites tell Saul where David is”'
    claim: 'Joshua 15 is the list of Judah’s inheritance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/15?lang=eng'
    quote: 'Judah is given an inheritance in Canaan'
  - where: 'note 54:0 “The Ziphites tell Saul where David is”'
    claim: 'David was in the wilderness of Ziph and Saul sought him daily'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/23?lang=eng'
    quote: 'And Saul sought him every day, but God delivered him not into his hand.'
  - where: 'note 54:0 “The Ziphites tell Saul where David is”'
    claim: 'The Ziphites went up to Saul at Gibeah with the question the title quotes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/23?lang=eng'
    quote: 'Then came up the Ziphites to Saul to Gibeah, saying, Doth not David hide himself with us in strong holds in the wood'
  - where: 'note 54:0 “The Ziphites tell Saul where David is”'
    claim: 'They offered to hand David over'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/23?lang=eng'
    quote: 'and our part shall be to deliver him into the king'
  - where: 'note 54:0 “The Ziphites tell Saul where David is”'
    claim: 'Saul blessed them and sent them back to learn David’s hiding places'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/23?lang=eng'
    quote: 'See therefore, and take knowledge of all the lurking places where he hideth himself, and come ye again to me with the certainty'
  - where: 'note 54:0 “The Ziphites tell Saul where David is”'
    claim: 'Saul’s men surrounded David’s at a mountain in the wilderness of Maon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/23?lang=eng'
    quote: 'for Saul and his men compassed David and his men round about to take them.'
  - where: 'note 54:0 “The Ziphites tell Saul where David is”'
    claim: 'A messenger reported a Philistine invasion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/23?lang=eng'
    quote: 'But there came a messenger unto Saul, saying, Haste thee, and come; for the Philistines have invaded the land.'
  - where: 'note 54:0 “The Ziphites tell Saul where David is”'
    claim: 'Saul broke off the pursuit'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/23?lang=eng'
    quote: 'Wherefore Saul returned from pursuing after David, and went against the Philistines'
  - where: 'note 54:0 “The Ziphites tell Saul where David is”'
    claim: 'The Ziphites inform on David again, in nearly the same words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/26?lang=eng'
    quote: 'And the Ziphites came unto Saul to Gibeah, saying, Doth not David hide himself in the hill of Hachilah, which is before Jeshimon?'

  # ---- 54:1 name ----
  - where: 'note 54:1 “Saved by a name”'
    claim: 'One reading: the name of God is the manifestation of His nature'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/54.htm'
    quote: 'The Name of God is the manifestation of His nature, which has mercy as its central point'
  - where: 'note 54:1 “Saved by a name”'
    claim: 'On that reading God’s might is one side of the name'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/54.htm'
    quote: 'the all-conquering might of God, which is only one side of the divine Name'
  - where: 'note 54:1 “Saved by a name”'
    claim: 'On that reading the subject of “hath delivered me” in verse 7 is the name'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/54.htm'
    quote: 'is the Name of God; the post-biblical language'
  - where: 'note 54:1 “Saved by a name”'
    claim: 'The closing words resemble the close of Psalm 52'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/54.htm'
    quote: 'the resemblance in the closing words'
  - where: 'note 54:1 “Saved by a name”'
    claim: 'Verse 1 has “by thy name” (the Hebrew word for name with “thy”)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'בְּ/שִׁמְ/ךָ֣'
  - where: 'note 54:1 “Saved by a name”'
    claim: 'Verse 6 has “thy name” again, followed by the divine name, its only occurrence in the psalm'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'שִּׁמְ/ךָ֖'
  - where: 'note 54:1 “Saved by a name”'
    claim: 'Psalm 52 ends on the name that is good'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/52?lang=eng'
    quote: 'and I will wait on thy name; for it is good before thy saints.'

  # ---- 54:1 judge ----
  - where: 'note 54:1 “Judge me means vindicate me”'
    claim: 'The verb is to judge, and one of its senses is to plead a cause'
    key: bdb
    url: 'https://biblehub.com/hebrew/1777.htm'
    quote: 'plead the cause'
  - where: 'note 54:1 “Judge me means vindicate me”'
    claim: 'The lexicon places this verse under executing judgment, vindicating, against enemies'
    key: bdb
    url: 'https://biblehub.com/hebrew/1777.htm'
    quote: 'execute judgment, vindicate, in battle against enemies'
  - where: 'note 54:1 “Judge me means vindicate me”'
    claim: 'The lexicon renders the line “in thy might judge me (vindicate me)”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1777.htm'
    quote: 'in thy might judge me (vindicate me) Psalm 54:3'
  - where: 'note 54:1 “Judge me means vindicate me”'
    claim: 'A modern translation has “vindicate me by your might”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2054&version=NRSVUE'
    quote: 'and vindicate me by your might.'

  # ---- 54:3 strangers ----
  - where: 'note 54:3 “Why men of Judah are called strangers”'
    claim: 'The word usually means foreigners, and the lexicon lists this verse there'
    key: bdb
    url: 'https://biblehub.com/hebrew/2114.htm'
    quote: 'foreigners (as such usually enemies)'
  - where: 'note 54:3 “Why men of Judah are called strangers”'
    claim: 'The word for “oppressors” is used of formidable adversaries'
    key: bdb
    url: 'https://biblehub.com/hebrew/6184.htm'
    quote: 'in bad sense of formidable adversaries'
  - where: 'note 54:3 “Why men of Judah are called strangers”'
    claim: 'Ziph is a town of Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/15?lang=eng'
    quote: 'Maon, Carmel, and Ziph, and Juttah,'
  - where: 'note 54:3 “Why men of Judah are called strangers”'
    claim: 'One reading: the Ziphites, though of Judah, are strangers because they sided against David'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/54.htm'
    quote: 'because they had taken the side against David'
  - where: 'note 54:3 “Why men of Judah are called strangers”'
    claim: 'The Ziphites were Judahites like David'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/54.htm'
    quote: 'although Judaeans like David'
  - where: 'note 54:3 “Why men of Judah are called strangers”'
    claim: 'The same word can mean an outsider in a wider sense, such as one who is not a priest'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/54.htm'
    quote: 'is also a stranger in the widest sense, regulated in each instance according to the opposite, e.g., the non-priest'
  - where: 'note 54:3 “Why men of Judah are called strangers”'
    claim: 'The lexicon also has the sense of one outside a family or the priests’ family'
    key: bdb
    url: 'https://biblehub.com/hebrew/2114.htm'
    quote: 'to the family, of another household'
  - where: 'note 54:3 “Why men of Judah are called strangers”'
    claim: 'Handing over a fugitive might otherwise have been a subject’s duty'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/54.htm'
    quote: 'Under other circumstances this might have been their duty as subjects.'
  - where: 'note 54:3 “Why men of Judah are called strangers”'
    claim: 'On that reading the last line of the verse names what made it wrong'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/54.htm'
    quote: 'In this instance, however, it was godlessness'
  - where: 'note 54:3 “Why men of Judah are called strangers”'
    claim: 'The Hebrew word here is zarim'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'זָרִ֨ים'
  - where: 'note 54:3 “Why men of Judah are called strangers”'
    claim: 'Psalm 86:14 has zedim, a word one letter different'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'זֵ֘דִ֤ים'
  - where: 'note 54:3 “Why men of Judah are called strangers”'
    claim: 'A modern translation has “the insolent” here'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2054&version=NRSVUE'
    quote: 'For the insolent have risen against me'

  # ---- 54:4 upholder ----
  - where: 'note 54:4 “The Lord as the one who upholds his life”'
    claim: 'A modern translation has “the upholder of my life”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2054&version=NRSVUE'
    quote: 'the Lord is the upholder of my life.'
  - where: 'note 54:4 “The Lord as the one who upholds his life”'
    claim: 'That translation follows the Greek, the Syriac and Jerome; the Hebrew is “of those who uphold” or “with those who uphold”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2054&version=NRSVUE'
    quote: 'Gk Syr Jerome: Heb is of those who uphold or is with those who uphold'
  - where: 'note 54:4 “The Lord as the one who upholds his life”'
    claim: 'The Greek has “the helper of my soul”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/54.htm'
    quote: 'For lo! God assists me; and the Lord is the helper of my soul.'
  - where: 'note 54:4 “The Lord as the one who upholds his life”'
    claim: '“The Lord” in this verse is the title Adonai, not the divine name'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'אֲ֝דֹנָ֗/י'
  - where: 'note 54:4 “The Lord as the one who upholds his life”'
    claim: 'The word for “soul” is the same in verses 3 and 4, and a modern translation has “life” in verse 3'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2054&version=NRSVUE'
    quote: 'the ruthless seek my life'
  - where: 'note 54:4 “The Lord as the one who upholds his life”'
    claim: 'The Hebrew word translated “soul” in verses 3 and 4 is the same'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'נַפְשִֽׁ/י'

  # ---- 54:5 cut off ----
  - where: 'note 54:5 “A prayer against those who watch him”'
    claim: 'The lexicon lists this verse under faithfulness as an attribute of God'
    key: bdb
    url: 'https://biblehub.com/hebrew/571.htm'
    quote: 'an attribute of God Psalm 54:7'
  - where: 'note 54:5 “A prayer against those who watch him”'
    claim: 'The word’s senses are firmness, faithfulness, truth'
    key: bdb
    url: 'https://biblehub.com/hebrew/571.htm'
    quote: 'firmness, faithfulness, truth'
  - where: 'note 54:5 “A prayer against those who watch him”'
    claim: 'A modern translation has “In your faithfulness”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2054&version=NRSVUE'
    quote: 'In your faithfulness, put an end to them.'
  - where: 'note 54:5 “A prayer against those who watch him”'
    claim: 'The word for “enemies” in verse 5 is glossed “(insidious) watcher”'
    key: bdb
    url: 'https://biblehub.com/hebrew/8324.htm'
    quote: 'noun masculine (insidious) watcher'
  - where: 'note 54:5 “A prayer against those who watch him”'
    claim: 'Verse 5 has this word for enemies'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'לְ/שֹׁרְרָ֑/י'
  - where: 'note 54:5 “A prayer against those who watch him”'
    claim: 'Verse 7 has a different word for enemies'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וּ֝/בְ/אֹיְבַ֗/י'

  # ---- 54:6 freely ----
  - where: 'note 54:6 “A sacrifice given freely”'
    claim: 'The lexicon reads the word here as “voluntarily”'
    key: bdb
    url: 'https://biblehub.com/hebrew/5071.htm'
    quote: 'Psalm 54:8 voluntarily'
  - where: 'note 54:6 “A sacrifice given freely”'
    claim: 'The same noun is the name of the freewill offering'
    key: bdb
    url: 'https://biblehub.com/hebrew/5071.htm'
    quote: 'freewill, voluntary, offering'
  - where: 'note 54:6 “A sacrifice given freely”'
    claim: 'The freewill offering is distinguished from the offering that pays a vow'
    key: bdb
    url: 'https://biblehub.com/hebrew/5071.htm'
    quote: 'votive offering Leviticus 7:16'
  - where: 'note 54:6 “A sacrifice given freely”'
    claim: 'The Greek has “willingly”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/54.htm'
    quote: 'I will willingly sacrifice to thee'
  - where: 'note 54:6 “A sacrifice given freely”'
    claim: 'A modern translation names the offering'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2054&version=NRSVUE'
    quote: 'With a freewill offering I will sacrifice to you'
  - where: 'note 54:6 “A sacrifice given freely”'
    claim: 'The law sets a vow and a freewill offering side by side as two kinds of peace offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/22?lang=eng'
    quote: 'to accomplish his vow, or a freewill offering in beeves or sheep, it shall be perfect to be accepted'

  # ---- 54:7 desire ----
  - where: 'note 54:7 “The Hebrew has no word for desire”'
    claim: 'The Hebrew of the last line is three words: on my enemies, has looked, my eye (first word)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'וּ֝/בְ/אֹיְבַ֗/י'
  - where: 'note 54:7 “The Hebrew has no word for desire”'
    claim: 'The Hebrew of the last line: the verb “has looked”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'רָאֲתָ֥ה'
  - where: 'note 54:7 “The Hebrew has no word for desire”'
    claim: 'The Hebrew of the last line: “my eye”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: 'עֵינִֽ/י'
  - where: 'note 54:7 “The Hebrew has no word for desire”'
    claim: 'The Greek has “my desire”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/psalms/54.htm'
    quote: 'and mine eye has seen my desire upon mine enemies.'
  - where: 'note 54:7 “The Hebrew has no word for desire”'
    claim: 'A modern translation has “looked in triumph”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Psalm%2054&version=NRSVUE'
    quote: 'and my eye has looked in triumph on my enemies.'
  - where: 'note 54:7 “The Hebrew has no word for desire”'
    claim: 'The verb with this preposition means to look at with interest'
    key: bdb
