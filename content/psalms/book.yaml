description: A phrase-by-phrase companion to the book of Psalms, grounded in the restored gospel of Jesus Christ.
divisionsBlurb: One hundred and fifty songs in five books, each closing with a line of praise. The last five psalms end the whole collection in hallelujahs.
home:
  blurb: Israel’s book of praises, a hundred and fifty prayers and songs sung at the temple, quoted in the New Testament more than any other book of the Old, and on the Savior’s lips at the cross.

intro: |
  The Psalms are Israel’s hymns and prayers. In Hebrew the book is called *Tehillim*, “Praises,” and its hundred and fifty poems were gathered into five books, each ending with a line of praise. Seventy-three carry David’s name in their titles; others are ascribed to Asaph, the sons of Korah, Solomon, and Moses, and many to no one.

  They are praise, complaint, thanksgiving, confession, and instruction, spoken to God more often than about Him. The New Testament quotes this book more than any other in the Old, and the Savior prayed its words on the cross: “My God, my God, why hast thou forsaken me?” ([[Ps. 22:1]]) and “Into thine hand I commit my spirit” ([[Ps. 31:5]]).

  For the poetry, begin with [Hebrew Poetry and the Prophets’ Speech](/old-testament/guides/hebrew-poetry/#psalms); for the setting of worship, see [The Temple and Worship](/old-testament/guides/temple-and-worship/#worship).

# The five books are the Psalter’s own division, each closed by a doxology (41:13; 72:19; 89:52; 106:48).
# Keys must not repeat another book’s (the colors are global variables).
divisions:
  - key: psalms1
    range: [1, 41]
    name: Book One
    blurb: Two psalms open the collection, the blessed man and the anointed king. Nearly all the rest carry David’s name, among them the shepherd psalm and the cry the Savior took up on the cross.
    color: '#2f5f8a'
    darkColor: '#8fbfe6'
  - key: psalms2
    range: [42, 72]
    name: Book Two
    blurb: Songs of the sons of Korah and of David in trouble, David’s prayer for a clean heart, and a closing prayer for the king whose dominion reaches from sea to sea.
    color: '#7a4a8a'
    darkColor: '#c9a0d8'
  - key: psalms3
    range: [73, 89]
    name: Book Three
    blurb: The psalms of Asaph, Israel’s history retold, the sanctuary in ruins, and at the end the question of what has become of the covenant with David.
    color: '#8a4a3a'
    darkColor: '#e0a898'
  - key: psalms4
    range: [90, 106]
    name: Book Four
    blurb: The prayer of Moses, then song after song declaring that the Lord reigns, and Israel’s story told twice, once as His faithfulness and once as their forgetting.
    color: '#3f7a5a'
    darkColor: '#94d0ae'
  - key: psalms5
    range: [107, 150]
    name: Book Five
    blurb: The king who is a priest after the order of Melchizedek, the stone the builders refused, the long psalm on the word of God, the songs of degrees, and five hallelujahs to close.
    color: '#8a6a2a'
    darkColor: '#dcbc74'

