chapter: 115
title: Not unto Us
tagline: A people mocked by the nations refuses the glory for itself, sets the God who acts beside gods that have mouths and say nothing, and is told three times to trust Him.
when: 'Undated; the psalm has no title and names no occasion'

setting: |
  The psalm has no title, and nothing in it names a king, a place, or an event. What it shows is a people speaking together (“us,” “our God”) while the nations ask where their God is. The taunt is discussed at [[Ps. 79:10]].

  It belongs to the Hallel, Psalms 113–118, sung at the great feasts and at Passover; see the note on [[Ps. 113:1]]. The psalm just before this one is about the redemption from Egypt: “When Israel went out of Egypt” ([[Ps. 114:1]]).

  Two parts of the psalm are found again in the Psalter. The description of the idols in verses 4–8 returns, shortened, in [[Ps. 135:15–18]]. The three groups called on in verses 9–11 (Israel, the house of Aaron, and those who fear the LORD) are called on again in [[Ps. 118:2–4]], and in [[Ps. 135:19–20]] with the house of Levi added.

thread: |
  Psalm 115 is **an answer to a taunt**. The nations ask, “Where is now their God?” and verse 3 begins the reply.

  The first reply sets two kinds of god side by side. Israel’s God is “in the heavens,” and He “hath done whatsoever he hath pleased.” The gods of the nations are silver and gold, “the work of men’s hands,” and verses 5–7 go over them part by part: each part is there, and none of them does anything. Verse 8 then says what becomes of their worshippers: “They that make them are like unto them; so is every one that trusteth in them.”

  “Trusteth” is the word the psalm turns on. The next three verses take it up as a command, to Israel, to the house of Aaron, and to all who fear the LORD: “trust in the LORD.” Each command is followed by the same promise, “he is their help and their shield.”

  At verse 12 the psalm says “us” again, and the question of verse 2 has given way to confidence: “The LORD hath been mindful of us: he will bless us.”

  The last verses come back to heaven and earth. The heavens are the LORD’s, the earth is given to men, and the psalm that described mouths that do not speak ends with the dead, who do not praise, and with a people who say, “But we will bless the LORD.” The people who would take no glory in verse 1 end by blessing Him in verse 18.

sections:
  - range: 1-3
    heading: Not unto us, but unto thy name
    plain: |
      Not to us, LORD, not to us, but to Your name give glory, for the sake of Your mercy and Your truth. Why should the nations say, “Where is their God now?” Our God is in the heavens, and He has done whatever He pleased.
  - range: 4-8
    heading: Gods that men have made
    plain: |
      Their idols are silver and gold, made by men’s hands. They have mouths and do not speak, eyes and do not see, ears and do not hear, noses and do not smell, hands and do not handle, feet and do not walk; they make no sound in their throats. Those who make them are like them, and so is everyone who trusts in them.
  - range: 9-11
    heading: Trust in the LORD
    plain: |
      Israel, trust in the LORD: He is their help and their shield. House of Aaron, trust in the LORD: He is their help and their shield. You who fear the LORD, trust in the LORD: He is their help and their shield.
  - range: 12-15
    heading: He will bless us
    plain: |
      The LORD has kept us in mind, and He will bless us. He will bless the house of Israel and the house of Aaron. He will bless those who fear the LORD, the small with the great. The LORD will add to you more and more, to you and to your children. You are blessed by the LORD, who made heaven and earth.
  - range: 16-18
    heading: The heavens, the earth, and the living
    plain: |
      The heavens are the LORD’s, but the earth He has given to the children of men. The dead do not praise the LORD, nor do any who go down into silence. But we will bless the LORD, from now on and for ever. Praise the LORD.

notes:
  - ref: 1
    phrase: Not unto us, O LORD, not unto us
    kind: scripture
    title: The glory is asked for the name, not for Israel
    body: |
      The psalm opens by disclaiming, twice, any glory for the people and asking that it go to God’s name. Verse 2 gives the occasion: the nations are asking where Israel’s God is. The two reasons the verse gives for the request are His as well: “for thy mercy, and for thy truth’s sake.”

      The LORD says the same of Himself through Isaiah: “For mine own sake, even for mine own sake, will I do it: for how should my name be polluted? and I will not give my glory unto another” ([[Isa. 48:11]]). There the LORD says it. Here the people say it of themselves.

      A modern translation has “steadfast love” and “faithfulness” for “mercy” and “truth.” “Mercy” is *hesed*, the covenant love explained at [[Ps. 51:1]]. The people rest their plea on what God is, not on anything they have done.
    sources: [lds-scriptures, nrsvue, oshb-wlc]

  - ref: 3
    phrase: our God is in the heavens
    kind: scripture
    title: Where He is, and what He can do
    body: |
      Verse 3 answers the nations’ question of verse 2: Israel’s God is “in the heavens,” and nothing hinders Him: “he hath done whatsoever he hath pleased.”

      Psalm 135, which repeats this psalm’s lines about the idols, repeats this one too and fills it out: “Whatsoever the LORD pleased, that did he in heaven, and in earth, in the seas, and all deep places” ([[Ps. 135:6]]).

      The verse does not say that God will do what Israel wants. It says He does what He pleases.
    sources: [lds-scriptures]

  - ref: 5
    phrase: They have mouths, but they speak not
    kind: symbol
    title: A body with nothing living in it
    body: |
      The list in verses 5–7 goes over an idol part by part: it has the form of a living being, and none of its parts does what it is for.

      Speech stands first and comes back at the end: “neither speak they through their throat,” or in a modern translation, “they make no sound in their throats.” The idol has no word to give and cannot so much as make a noise.

      The prophets say the same of idols. Jeremiah says that they “speak not: they must needs be borne, because they cannot go” ([[Jer. 10:5]]), and Daniel tells Belshazzar that he has praised gods “which see not, nor hear, nor know” ([[Dan. 5:23]]).
    sources: [lds-scriptures, nrsvue]

  - ref: 8
    phrase: They that make them are like unto them
    kind: scripture
    title: Makers who become like what they make
    body: |
      Verse 8 turns the list of verses 5–7 on the worshipper: it says that whoever makes such a thing, or trusts it, becomes like it. The King James states this as a fact. The ancient Greek version, in English translation, has it as a wish: “Let those that make them become like to them, and all who trust in them.”

      The list suggests what the likeness is. The idol has eyes and does not see, and Isaiah says of those who make idols, “he hath shut their eyes, that they cannot see; and their hearts, that they cannot understand” ([[Isa. 44:18]]). One older reading takes the verse as far as it will go: the worshippers “become like to their idols,” and “being deprived of their consciousness, life, and existence, they come to nothing.”

      The verse does not say that only the craftsman is at risk. “Every one that trusteth in them” is included, and that word carries the psalm into verse 9.
    sources: [lds-scriptures, lxx-rahlfs, delitzsch-psalms]

  - ref: 8
    phrase: every one that trusteth in them
    kind: prophets
    title: President Kimball on what a man trusts most
    body: |
      President Spencer W. Kimball defined idolatry by what a man trusts, which is this verse’s word. Writing to the Church in 1976, he said: “Whatever thing a man sets his heart and his trust in most is his god; and if his god doesn’t also happen to be the true and living God of Israel, that man is laboring in idolatry.”

      He described how it happens. Because faith has always seemed harder than relying on what is at hand, “carnal man has tended to transfer his trust in God to material things.” He called this “a dominant theme in the Old Testament,” and he cited the Lord’s words in our day about those who walk every man after a god “whose image is in the likeness of the world, and whose substance is that of an idol” ([[D&C 1:16]]).
    sources: [kimball-false-gods, lds-scriptures]

  - ref: 9
    phrase: he is their help and their shield
    kind: structure
    title: A second voice answers
    body: |
      The odd “their” of verse 9 suggests that the speaker changes there. In verses 1–3 the people speak of “us” and “our God.” In verses 9–11 someone addresses them: “O Israel, trust thou in the LORD.” Each time, a line follows that speaks about them and not to them: “he is their help and their shield.” At verse 12 it is “us” again, at verses 14–15 “you,” and at verse 18 “we.”

      An older explanation is that the psalm is “an antiphonal song,” one sung by voices in turn: after Israel’s confession “there now arises a voice that addresses itself to Israel.” Another psalm has the same line as a confession by the people: “he is our help and our shield” ([[Ps. 33:20]]). The ancient Greek version has statements where the King James has commands: “The house of Israel trusts in the Lord: he is their helper and defender.”

      How the psalm was divided among singers is not recorded anywhere. That it was written for more than one voice is an inference from the pronouns.
    sources: [lds-scriptures, delitzsch-psalms, lxx-rahlfs]

  - ref: 11
    phrase: Ye that fear the LORD
    kind: history
    title: The third group
    body: |
      “Ye that fear the LORD” may reach beyond Israel, though the psalm does not say who they are. The first two groups are named by descent: the whole people, and the house of Aaron. The third is named by what it does. The same three stand together in [[Ps. 118:2–4]].

      One older reading holds that they are “probably the proselytes,” people of other nations who had joined Israel’s worship, and that in any case “the notion of ‘those who fear Jahve’ extends beyond Israel.” By New Testament times most synagogues had “God-fearing” Gentiles attached to them, who attended the services without becoming full proselytes, and Paul addresses such people beside Israel at Antioch: “Men of Israel, and ye that fear God, give audience” ([[Acts 13:16]]).

      The fear of the LORD is explained at [[Ps. 111:10]].
    sources: [lds-scriptures, delitzsch-psalms, bd-proselytes]

  - ref: 12
    phrase: The LORD hath been mindful of us
    kind: structure
    title: Three calls, three blessings, and the blessing returned
    body: |
      Verse 12 is where the psalm turns from asking to assurance, and it does so by answering verses 9–11 point for point. Israel, the house of Aaron, and those who fear the LORD were each told to trust. Now each is promised a blessing, in the same order: “he will bless the house of Israel; he will bless the house of Aaron. He will bless them that fear the LORD.”

      Nothing in the psalm reports a rescue between verse 2 and verse 12. The nations are still there. What stands between is the call to trust. The psalm now speaks of what God has already done (“hath been mindful of us”) and reasons forward from it (“he will bless us”).

      The word “bless” then travels through the rest of the psalm. He “will bless” four times in verses 12–13, the people “are blessed of the LORD” in verse 15, and in verse 18 the direction reverses: “we will bless the LORD.”
    sources: [lds-scriptures]

  - ref: 16
    phrase: the earth hath he given to the children of men
    kind: scripture
    title: Given by the one who made it
    body: |
      Verse 16 does not say that the earth has passed out of God’s hands. The verse before it has just called Him the LORD “which made heaven and earth,” and another psalm says without qualification, “The earth is the LORD’s, and the fulness thereof” ([[Ps. 24:1]]). What men hold, they hold as a gift from its maker.
    sources: [lds-scriptures]

  - ref: 17
    phrase: The dead praise not the LORD
    kind: scripture
    title: Those who go down into silence
    body: |
      Verse 17 says that the dead do not praise, and verse 18 sets the living congregation against them. “Silence” is a name for the place of the dead ([[Ps. 94:17]]), the Sheol explained at [[Ps. 6:5]]. The ancient Greek version has “Hades” here and spells out the contrast in the next verse: “But we, the living, will bless the Lord.”

      The psalm draws one conclusion from the line: the praise falls to those who are alive, and the people take it on themselves “from this time forth and for evermore.” What latter-day revelation adds to verses like this one is set out at [[Ps. 6:5]].
    sources: [lds-scriptures, lxx-rahlfs]

christ: |
  The LORD to whose name this psalm gives the glory is Jehovah, the premortal Jesus Christ ([[Ps. 110:1]]).

  The hymn sung at the end of the Last Supper ([[Matt. 26:30]]) has been connected with the Hallel, to which this psalm belongs, though the Gospels do not name the hymn; see the note on [[Ps. 113:1]].

  The psalm says that the dead do not praise. The Church’s edition of the Bible points from that verse to a passage of latter-day revelation in which they do, and the reason given is Christ: “Let the dead speak forth anthems of eternal praise to the King Immanuel, who hath ordained, before the world was, that which would enable us to redeem them out of their prison” ([[D&C 128:22]]).

explore: |
  - **The same lines again.** [[Ps. 135]], which repeats verses 3–8 and the three groups, and turns “trust in the LORD” into “bless the LORD.”
  - **The prophets on idols.** [[Isa. 44:9–20]], [[Isa. 46:1–7]] and [[Jer. 10:1–16]].
  - **The taunt.** [[Ps. 42:3]], [[Ps. 79:10]] and [[Joel 2:17]].
  - **For the name’s sake.** [[Ezek. 36:16–32]] and [[Isa. 48:9–11]].
  - **The rest of the Hallel.** [[Ps. 113]]–118, read as the psalms of one feast.

