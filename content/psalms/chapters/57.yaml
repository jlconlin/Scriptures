chapter: 57
title: My Heart Is Fixed
tagline: A man in hiding asks for mercy, lies down among enemies he calls lions, and twice asks that God be exalted above the heavens; between the two he says his heart is steady and that he will wake the dawn with a song.
when: 'By its title, David’s, when he fled from Saul in the cave'

setting: |
  Psalm 57 stands in Book Two of the Psalms. Its title ascribes it to David and sets it in his flight from Saul, “in the cave”; the notes on the title take up the cave and the words “Al-taschith.” What a title is worth as evidence is discussed at [[Ps. 3:1]].

  It follows Psalm 56 and begins with the same plea, “Be merciful unto me, O God” ([[Ps. 56:1]]). Both psalms are called Michtam ([[Ps. 16:1]]), and both speak of an enemy who “would swallow me up,” with one Hebrew verb used the same way in each.

  The psalm opens as a lament (for the form, see [[Ps. 22:1]]), but half of it is praise. The enemies are never named: they are lions, “the sons of men,” and “they.” The divine name does not appear. The speaker says “God” throughout, as Book Two usually does ([[Ps. 42:1]]), with “God most high” in verse 2 and “O Lord,” the title *Adonai*, in verse 9.

  The second half was sung again. Verses 7–11 return, with small changes, as the first five verses of Psalm 108, and the rest of that psalm is the close of Psalm 60 ([[Ps. 108:1–5]]; [[Ps. 60:5–12]]).

thread: |
  Psalm 57 is prayed **from under cover, looking up**. The speaker is low throughout the first half: he shelters under wings (verse 1), he lies down among enemies (verse 4), his soul is “bowed down,” and a pit has been dug in front of him (verse 6). What he hopes for is above him. He cries to “God most high,” help is to be sent “from heaven,” and twice he asks that God be exalted “above the heavens.”

  The psalm has two halves, and each ends with that request (verses 5 and 11); in Hebrew the two verses differ by a single letter, the article on “heavens” in verse 5. The first half is plea. The second opens with the enemies’ net and pit, and the men who dug the pit “are fallen themselves” into it. The psalm reports no other rescue. From the next verse on the speaker says his heart is fixed, calls his harp awake, and promises a song among the nations.

  The refrain asks the same thing both times. The first time it comes straight from among the lions, before anything has been said of the enemies’ fall. The second time it follows the reason for praise, which is the same mercy and truth the speaker said God would send in verse 3, now measured by the height of the heavens (verse 10).

sections:
  - range: 1-3
    heading: Under the shadow of thy wings
    plain: |
      Be merciful to me, O God, be merciful to me, for my soul has taken shelter in You. In the shadow of Your wings I will shelter until these calamities have passed. I will cry to God Most High, to God who accomplishes all things for me. He will send from heaven and save me from the reproach of the one who would swallow me up. God will send out His mercy and His truth.
  - range: 4-5
    heading: Among lions
    plain: |
      My soul is among lions. I lie down among men who are on fire, whose teeth are spears and arrows and whose tongue is a sharp sword. Be exalted above the heavens, O God; let Your glory be over all the earth.
  - range: 6-8
    heading: The pit, and a steady heart
    plain: |
      They spread a net for my steps, and my soul was bowed down. They dug a pit in front of me, and they have fallen into it themselves. My heart is steadfast, O God, my heart is steadfast; I will sing and give praise. Wake up, my glory. Wake up, psaltery and harp. I will wake the dawn.
  - range: 9-11
    heading: Among the nations
    plain: |
      I will praise You, O Lord, among the peoples; I will sing to You among the nations. For Your mercy is great, reaching to the heavens, and Your truth to the clouds. Be exalted above the heavens, O God; let Your glory be over all the earth.

notes:
  - ref: 0
    phrase: Al-taschith
    kind: words
    title: Destroy not, probably the name of a tune
    body: |
      “Al-taschith” is two Hebrew words, a command not to destroy, and the likeliest explanation is that they name the tune the psalm was sung to. They stand in four titles: this one, the next two, and that of Psalm 75. The words have been explained as “probably the opening words to a popular song,” and as “some well-known ode beginning with the expression”; titles of this kind are taken as probably the names of melodies known at the time. That is an inference from how the titles are used, and the song itself is not preserved. The ancient Greek translators did not keep the words as a name. They translated them, and their title runs “Destroy not: by David, for a memorial,” before it comes to Saul and the cave.

      The words occur elsewhere in scripture. Isaiah has them as something said of a cluster of grapes: “Destroy it not; for a blessing is in it” ([[Isa. 65:8]]). Moses prayed, “destroy not thy people and thine inheritance” ([[Deut. 9:26]]), with the verb in the form the title has. The same verb is in David’s words to Abishai over the sleeping Saul, “Destroy him not” ([[1 Sam. 26:9]]). Whether the title has any of these in view is not known, and one older reading is that it does not: “There is no actual reference in the words” to Moses’ prayer or to David’s.

      The title’s other terms are explained where they first appear: “To the chief Musician” at [[Ps. 8:1]] and “Michtam” at [[Ps. 16:1]].
    sources: [oshb-wlc, strongs-concordance, ot-manual-psalms, bd-psalms, lxx-rahlfs, biblehub-interlinear, delitzsch-psalms, lds-scriptures]

  - ref: 0
    phrase: when he fled from Saul in the cave
    kind: history
    title: Two caves in Samuel
    body: |
      The title does not say which cave, and the story of David’s flight from Saul has two. Early in it he “escaped to the cave Adullam” ([[1 Sam. 22:1]]), where his family and some four hundred men gathered to him. Later, in the wilderness of En-gedi, Saul went into a cave while “David and his men remained in the sides of the cave” ([[1 Sam. 24:3]]). David’s men urged him to strike ([[1 Sam. 24:4]]). He would not: “The LORD forbid that I should do this thing unto my master” ([[1 Sam. 24:6]]).

      The psalm itself names no place and no person. One other title speaks of the cave, that of Psalm 142, “A Prayer when he was in the cave.”
    sources: [lds-scriptures]

  - ref: 1
    phrase: 'my soul trusteth in thee: yea, in the shadow of thy wings will I make my refuge'
    kind: words
    title: One verb for trust and refuge
    body: |
      The King James’s “trusteth” and “make my refuge” translate the same Hebrew verb, used twice in the verse, first in the Hebrew perfect and then in the imperfect. A modern translation keeps one English verb for both: his soul “takes refuge” in God, and in the shadow of the wings “I will take refuge.” The trust of the first line and the refuge of the second are the same act, sheltering in God, said once of the present and once of the time until the danger is past.

      The same translation renders “these calamities” as “the destroying storms.” On the wings as a figure for the LORD’s protection, see the note on [[Ps. 17:8]].
    sources: [oshb-wlc, bdb, nrsvue]

  - ref: 2
    phrase: that performeth all things for me
    kind: words
    title: God who brings to completion
    body: |
      The Hebrew of this phrase is a single verb with “for me,” and it has no object; “all things” is the translators’ supply. The verb is found only in the Psalms. Its sense is to end or complete, and this line has been rendered “God that completeth, accomplisheth, for me,” with nothing added. A modern translation fills the gap differently: “God who fulfills his purpose for me.” The ancient Greek has another thought, “the God who has benefited me.”

      The verb has the LORD for its subject once more in the Psalms: “The LORD will perfect that which concerneth me” ([[Ps. 138:8]]). In this psalm the speaker, still in hiding, calls on God as the one who carries a matter through.
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 3
    phrase: God shall send forth his mercy and his truth
    kind: words
    title: What God sends from heaven
    body: |
      What God sends is His mercy and His truth, and the verse holds the answer back for a line. It says “He shall send from heaven” with nothing named as sent, turns to the enemy, and only then gives the object. “Mercy” is *hesed*, the word explained in the note on [[Ps. 51:1]], and a modern translation renders the pair “his steadfast love and his faithfulness.”

      The pair returns in verse 10 as the reason for the song: “thy mercy is great unto the heavens, and thy truth unto the clouds.”
    sources: [oshb-wlc, nrsvue, lds-scriptures]

  - ref: 4
    phrase: I lie even among them that are set on fire
    kind: words
    title: Lying down among men on fire
    body: |
      The line is difficult, and translations differ over it, but in the Hebrew the speaker says he lies down, and the enemies are men aflame. The verb is in a form that states an intention: he will lie down. The word behind “set on fire” means to “blaze up, flame,” and it is used here “figurative of enemies.” One modern translation prints a corrected text in which the lions “greedily devour human prey,” and notes that the Hebrew has “are aflame for.” The ancient Greek reads “I lay down to sleep, though troubled.”

      However the line is construed, the weapons that follow are all in the mouth: teeth that are “spears and arrows” and a tongue that is “a sharp sword.”
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs]

  - ref: 7
    phrase: My heart is fixed
    kind: words
    title: A heart made firm
    body: |
      The heart that is “fixed” is firm or steadfast, and the Hebrew word comes from the verb used a verse earlier for the enemies’ work. They “prepared” a net (verse 6); his heart is “fixed.” The word here has the sense “be fixed aright, stedfast,” and its use in verse 6 is compared with preparing weapons for a “hostile purpose.”

      The same word describes the righteous man who hears bad news without fear, “his heart is fixed, trusting in the LORD” ([[Ps. 112:7]]), and it is the “right” of David’s prayer, “renew a right spirit within me” ([[Ps. 51:10]]). The ancient Greek took it in the other sense the verb allows: “My heart, O God, is ready.”
    sources: [oshb-wlc, bdb, lxx-rahlfs, lds-scriptures]

  - ref: 8
    phrase: I myself will awake early
    kind: words
    title: Waking the dawn
    body: |
      The Hebrew of the last clause can be read “I will awake the dawn,” with the dawn as the thing awakened. The two calls before it, to “my glory” and to the instruments, are simple commands to wake. The third verb is in a causative form, to rouse something else, and the word after it is the noun for dawn. So the line has been rendered “I will arouse the dawn,” and a modern translation prints “I will awake the dawn.” The King James and the ancient Greek take “dawn” as a word of time, “at dawn,” which the Hebrew also allows. On “my glory” as the speaker’s own self, see the note on [[Ps. 30:12]].

      On one older reading this makes the psalm a song for the night. The speaker says in verse 4 that he will lie down among enemies, and here he looks to the morning: “we have before us an evening or nightly song,” whose “evening mood” was “hope of victory” and whose morning mood is “certainty of victory.” On that reading he does not wait for daylight to be glad, and “with the music of stringed instruments and with song he will awake the not yet risen dawn.”
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs, delitzsch-psalms]

  - ref: 9
    phrase: among the nations
    kind: scripture
    title: Praise promised among the nations
    body: |
      The vow of praise reaches past Israel: the speaker, in hiding, says he will sing among “the people” and “the nations,” both plural in Hebrew. One older reading takes this as David’s sense of his calling, that “his vocation extends beyond Israel, and the events of his life are to be for the benefit of mankind,” and sets the verse beside two others. One is the end of David’s song of deliverance, “Therefore will I give thanks unto thee, O LORD, among the heathen” ([[Ps. 18:49]]), which Paul quotes of the Gentiles; the note there has his use of it. The other is Psalm 22, where one man’s rescue ends with “all the ends of the world” turning to the LORD ([[Ps. 22:27]]).
    sources: [oshb-wlc, delitzsch-psalms, lds-scriptures]

christ: |
  The psalm never speaks the divine name. Where its second half is sung again, the name stands in the line: the “O Lord” of verse 9 is “O LORD,” Jehovah, in [[Ps. 108:3]]. Jehovah is the premortal Jesus Christ.

  What the psalm says of the Lord is what its speaker says from hiding. He performs all things for the one who cries to Him. He sends from heaven and saves, and what He sends is His mercy and His truth. The speaker asks that His glory be above all the earth, and promises to sing to Him among the nations.

explore: |
  - **The two caves.** [[1 Sam. 22:1–2]], and [[1 Sam. 24:1–22]], where David spares Saul and afterward calls to him from outside the cave; then [[Ps. 142]], the other psalm whose title sets it in the cave.
  - **Lying down to sleep.** [[Ps. 4:8]], where the psalmist lies down in peace and sleeps.
  - **The other psalms with this title.** Psalms 58, 59 and 75 carry “Al-taschith” as well; Psalm 59 is set on the night Saul’s men watched David’s house ([[1 Sam. 19:11]]).

parallels:
  - ref: Ps. 108:1–5
    note: Verses 7–11 of this psalm, sung again with small changes; “O Lord” becomes “O LORD.”
  - ref: Ps. 36:5
    note: The LORD’s mercy and faithfulness measured by the heavens and the clouds, as in verse 10.
  - ref: 1 Sam. 24:3
    note: David and his men in the sides of the cave at En-gedi, one of the two caves the title may mean.
  - ref: Ps. 138:8
    note: The verb of verse 2 again, with the LORD as the one who completes.
  - ref: 2 Ne. 4:35
    note: Nephi’s “I will cry unto thee, my God” has been counted as an allusion to verse 2.

