chapter: 1
title: The Tree and the Chaff
tagline: The book of praises opens with a poem that neither prays nor praises. It draws one man rooted like a watered tree, sets against him the many who blow away like chaff, and says why the two end so differently.
when: 'Undated; the psalm has no title and names no author or occasion'

setting: |
  Psalm 1 has no title, no named author and no occasion, and it is not addressed to God. The Hebrew name of the book is “Praises,” and its first poem contains none. It describes two kinds of people and says how each ends. That suits the place it holds: the first two psalms “serve as an introduction to the entire collection.” Some traditions go further and count the two as a single psalm, because the word “Blessed” opens this one and closes the next ([[Ps. 2:12]]). The Hebrew word is the same in both places.

  The collection it introduces is 150 poems in five sections, each ending in praise (see [[Ps. 150:1]]). When they were gathered into one book is not known exactly, though most scholars agree that it “was likely assembled after the Babylonian exile.” The psalm gives no sign of its own date.

  Psalm 1 is often called a wisdom psalm, because like Proverbs it sets out “two ways,” that of the righteous and that of the wicked. Two other passages stand close to it. Jeremiah has the same tree beside the water ([[Jer. 17:8]]), and Joshua is given the same charge to meditate on the law day and night ([[Josh. 1:8]]). Both are taken up in the notes. Every later psalm takes for granted how Hebrew verse is built, and the second note on verse 1 explains it.

thread: |
  The psalm is a single contrast, and a lopsided one. Three verses belong to one man. Two belong to the wicked, who are always plural. A last verse gives the reason for the difference.

  The portrait of the man begins with what he does not do (verse 1), turns on “But” to the one thing he does (verse 2), and then leaves description for a picture: a tree beside running water (verse 3). At verse 4 the psalm turns, in three Hebrew words: not so the wicked. They get a picture too, but only half a line of it, chaff on the wind. The “Therefore” of verse 5 draws the conclusion: they will not hold their place when judgment comes.

  Verse 6 says why, and it is the only verse in which the LORD does anything. He “knoweth the way of the righteous.” Nothing is said to be done to the wicked; their way “shall perish.” A psalm whose first word is “Blessed” ends on the word “perish,” and between the two it gives no command. It describes, and it leaves the reader where two ways part.

sections:
  - range: 1-3
    heading: The man who is like a tree
    plain: |
      How happy the man who has not walked by the advice of the wicked, or stood in the path of sinners, or taken a seat among the scoffers. His delight is in the LORD’s instruction, and he muses on it day and night. He is like a tree planted beside streams of water: it gives its fruit when the season comes, and its leaves do not wither. Whatever he does succeeds.
  - range: 4-5
    heading: The wicked, who are like chaff
    plain: |
      Not so the wicked. They are like chaff that the wind drives off. So the wicked will not hold their ground when judgment comes, and sinners will have no place in the gathering of the righteous.
  - range: 6
    heading: Two ways
    plain: |
      For the LORD has regard for the way of the righteous, but the way of the wicked will perish.

notes:
  - ref: 1
    phrase: Blessed is the man
    kind: words
    title: The word behind the Beatitudes
    body: |
      “Blessed” here is an exclamation about the man, not a blessing asked for him: how happy he is. The Hebrew word, *ashre*, is used only in this fixed form, as an “exclamation O happiness, blessedness of.” The psalm does not pray that such a man be blessed. It points to him and says that he is.

      The form is a favorite of this book. The word is counted 44 times in the Hebrew Bible, and the majority “is found in Psalms (26 times).” Psalm 1 sets it at the head of the whole collection, and the next psalm ends with it: “Blessed are all they that put their trust in him” ([[Ps. 2:12]]).

      The ancient Greek translation, the Septuagint, renders the word “as makarios/makarioi, as in Psalm 1:1,” and the same Greek word stands in the New Testament at the head of each Beatitude. The Savior opened the Sermon on the Mount with a series of sayings in this form, beginning “Blessed are the poor in spirit” ([[Matt. 5:3]]), and the Beatitudes “are based on an original form of Hebrew speech found more often than not in the Psalms.”
    sources: [bdb, oshb-wlc, skinner-beatitudes]

  - ref: 1
    phrase: walketh not in the counsel of the ungodly, nor standeth in the way of sinners, nor sitteth in the seat of the scornful
    kind: structure
    title: How a Hebrew verse is built
    body: |
      Hebrew poetry is built on matched lines, not on rhyme, and this verse shows the method at once. The device is called parallelism. A poet “sets forth his ideas in the first line, then restates, reinforces, or reconfigures them in the next line.” The second line may echo the first, oppose it, or build on it. Because the pattern lies in the meaning and not in the sound, it “survives translation into the prose of any language with remarkably little loss.”

      So the thing to notice in any pair of lines in the Psalms is what the second adds to the first.

      Verse 1 has three lines. The man does not walk, does not stand and does not sit, and each line names a different company: the ungodly, sinners, the scornful. On one reading “the three appellations form a climax”: first a way of thinking, then a way of living, then a settled place among “those who scoff at religion.” The last line’s word for where he sits “signifies both seat” and “assembling,” so that line is about joining a company. The psalm will end with another company, “the congregation of the righteous” (verse 5).

      The rest of the psalm uses the other common patterns. Verse 3 builds, “each succeeding line adding to the first.” Verse 6 sets its two lines against each other, the pattern called antithetic, “a contrasting thought in the second line to accentuate the thought of the first.”
    sources: [parry-synonymous, ot-manual-g, delitzsch-psalms]

  - ref: 2
    phrase: in his law doth he meditate day and night
    kind: words
    title: Meditating on the LORD’s instruction day and night
    body: |
      The Hebrew verb behind “meditate” can describe a sound, so the meditation of this verse may be spoken. The verb is used of a “lion growling over prey” and of a moan “in distress (like dove).” Said of a person and a text, as here, it means to “(soliloquize) meditate, muse,” and to soliloquize is to talk to oneself. That suggests someone going over the words half aloud, though the verse does not say so. And “law” is wider than a code of statutes: the word is *torah*, “direction, instruction, law.”

      The line shares its words with the LORD’s charge to Joshua. When Joshua took the place of Moses, the LORD told him, “This book of the law shall not depart out of thy mouth; but thou shalt meditate therein day and night” ([[Josh. 1:8]]), and promised him, “then thou shalt make thy way prosperous” ([[Josh. 1:8]]). The verb for meditating and the phrase “day and night” are the same in Hebrew, and so is the verb for prospering, which comes in verse 3. What was required of Israel’s leader after Moses is here said of “the man.”

      The law asked the same of Israel’s king. He was to write out his own copy of the law, “and he shall read therein all the days of his life” ([[Deut. 17:19]]). For that reason, on one reading, the man of this psalm is the king whom the next psalm calls the LORD’s anointed ([[Ps. 2:2]]).
    sources: [bdb, oshb-wlc, ot-minute-psalms-1-20]

  - ref: 3
    phrase: like a tree planted by the rivers of water
    kind: symbol
    title: A tree set beside the channels
    body: |
      The Hebrew words of verse 3 can describe a tree set in its place beside channels of water, not one that sprang up wild on a riverbank. “Planted” translates a verb that means to “transplant,” used in poetry of a tree or vine. “Rivers” is a word for a “channel, (artificial) canal,” and in another psalm for “irrigating canals from river.” If those senses hold here, the tree was moved to where it stands and the water was led to it. The verse also follows directly from verse 2: it is the man who keeps to the LORD’s instruction who becomes like the tree.

      The tree bears fruit “in his season,” and its leaf does not wither. Jeremiah has the same tree, with the same Hebrew word for “planted,” and says outright that heat and drought will come to it (see the note on [[Jer. 17:8]]).

      Where the tree stands the psalm does not say. Other passages plant the righteous in the temple: “Those that be planted in the house of the LORD shall flourish in the courts of our God” ([[Ps. 92:13]]), which has the same verb, and Ezekiel saw trees “whose leaf shall not fade” growing by the river that flows from the sanctuary ([[Ezek. 47:12]]). From such passages the tree of this verse has been read as the tree of life, “planted in or near the temple.” That is one reading, and it rests on the other passages more than on this verse, which says only “a tree.”
    sources: [bdb, oshb-wlc, ot-minute-psalms-1-20]

  - ref: 4
    phrase: like the chaff which the wind driveth away
    kind: symbol
    title: Chaff, and the judgment it pictures
    body: |
      Chaff is the psalm’s picture of the wicked at the judgment. It is the husk “threshed loose” from the grain, and the Hebrew word used here appears “always as driven by wind,” and always in a comparison. Beside the tree it is everything the tree is not, “without root below, without fruit above.”

      “Therefore,” verse 5 goes on, the wicked “shall not stand in the judgment.” The verb is one for holding one’s ground, to “maintain oneself.” The psalm does not say when this judgment is held. On one reading it is “God’s judgment, when and wheresoever he may hold it,” the decision that “separates outwardly that which is now inwardly separate,” righteous and unrighteous, wheat and chaff.

      The same reading bears on the promise of verse 3, that whatever the righteous man does shall prosper. Whatever the wicked have in the meantime, at that judgment their “temporary prosperity, which had no divine roots,” will “come to a fearful end.”
    sources: [bdb, strongs-concordance, delitzsch-psalms]

  - ref: 6
    phrase: the LORD knoweth the way of the righteous
    kind: words
    title: What it means that the LORD knows a way
    body: |
      “Knoweth” in this verse means more than being informed: it is to “take notice of, regard.” It is the knowing by which God is said to know “his true servants,” and by which He knew Israel “as chosen people”: “You only have I known of all the families of the earth” ([[Amos 3:2]]).

      The verse opens with “For,” so it gives the reason for everything before it: the tree and the chaff end differently because the LORD has regard for one way and not for the other.

      The verse is a prominent statement of what is called the doctrine of the two ways, that “there are only two ways to live: the way of life, and the way of death.” Moses set them before Israel: “I have set before you life and death, blessing and cursing: therefore choose life” ([[Deut. 30:19]]). Lehi set them before his sons, who were “free to choose liberty and eternal life, through the great Mediator of all men, or to choose captivity and death” ([[2 Ne. 2:27]]).
    sources: [bdb, sc-knowhy-287]

christ: |
  The Sermon on the Mount begins as the book of Psalms begins. “Blessed is the man” is the first line of the book the Savior quoted so often, and His Beatitudes take the same form of speech (see the first note on verse 1).

  The man of the psalm has also been read as more than an example. Psalms 1 and 2 together introduce the collection, and “many commentators have seen a connection between the righteous man of Psalm 1 and the anointed king of Psalm 2, suggesting that they are one and the same—the chosen Messiah who loves and follows the law of the Lord.” The psalm itself says only “the man,” and the reading depends on taking the two psalms as one introduction. For “his anointed,” see [[Ps. 2:2]].

explore: |
  - **The other half of the introduction.** [[Ps. 2:1–12]].
  - **Jeremiah’s heath and tree.** [[Jer. 17:5–8]], the same contrast with a curse set before the blessing.
  - **The charge to Joshua and the law of the king.** [[Josh. 1:7–8]] and [[Deut. 17:18–20]].
  - **Trees by the river of the sanctuary.** [[Ezek. 47:1–12]] and [[Rev. 22:1–2]].
  - **The two ways.** [[Deut. 30:15–20]] and [[2 Ne. 2:27]].
  - **Delight in the law at full length.** [[Ps. 119:1–8]], which opens with the same Hebrew word, “Blessed.”
  - **Psalms 1 and 2 read together.** The chapter “Psalm 1–20” in *Old Testament Minute: Psalms* reads the two as one introduction, with the king and the temple in view.

