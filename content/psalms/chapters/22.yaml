chapter: 22
title: Why Hast Thou Forsaken Me?
tagline: A man ringed by enemies and near death asks why God is far off, is answered in the middle of a verse, and vows a praise that reaches the ends of the world and a people not yet born.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  Psalm 22 stands in Book One of the Psalms, just before the shepherd psalm ([[Ps. 23:1]]). Its title ascribes it to David and names no occasion in his life.

  The speaker is one man, surrounded and wasting, who prays his way from complaint to praise. That movement is the form of a lament, the most common kind of psalm; the first note on verse 1 sets out its parts.

  The New Testament reads the psalm of the Crucifixion. The Savior prayed its first line from the cross ([[Matt. 27:46]]), and New Testament writers quote or allude to it “at least eleven times.” The heading in the Church’s edition calls it “a messianic psalm of David” in which “He foretells events in the Messiah’s life,” and it has been set beside Isaiah 53 as one of “the twin pillars of Old Testament prophecy regarding Christ.”

  Such a psalm can be read as an inspired foretelling of Christ, or as a prayer written out of Israel’s own experience that the Gospel writers saw fulfilled in Him; “these two viewpoints need not be seen as mutually exclusive.” This chapter takes the prayer first and the fulfilment after.

thread: |
  Psalm 22 is about **distance and an answer**. Its first question is why God is “so far,” and twice more he pleads against that distance: “Be not far from me” (verse 11), “be not thou far from me, O LORD” (verse 19). What is near instead is trouble, and a ring of enemies.

  The lament does not move in a straight line. It swings between what is happening to the speaker and what he knows of God, and each swing is marked: “But thou art holy” (verse 3), “But I am a worm” (verse 6), “But thou art he that took me out of the womb” (verse 9). He never stops addressing the God who does not answer, and he argues from what God has done before, for Israel and for him.

  The turn comes in the middle of verse 21, in one Hebrew word: “thou hast answered me.” It is the verb of verse 2, where he cried and God did not answer. The psalm does not say what happened between the plea and that word. It reports no rescue and never mentions the enemies again.

  What follows is the vow of praise, and it keeps widening, from his brethren to a people yet to be born. The psalm that began by asking why God was so far from helping ends on the single Hebrew verb “he has done.”

sections:
  - range: 1-2
    heading: Why art thou so far?
    plain: |
      My God, my God, why have You forsaken me? Why are You so far from helping me, so far from my cry of distress? My God, I call by day and You do not answer, and by night I am not silent.
  - range: 3-5
    heading: Our fathers trusted, and were delivered
    plain: |
      Yet You are holy, enthroned on the praises of Israel. Our fathers trusted in You; they trusted, and You delivered them. They cried to You and were rescued; they trusted in You and were not put to shame.
  - range: 6-8
    heading: A worm, and no man
    plain: |
      But I am a worm and not a man, scorned by everyone and despised by the people. All who see me mock me; they sneer and shake their heads: “He trusted in the LORD; let the LORD deliver him. Let Him rescue him, since He delights in him.”
  - range: 9-11
    heading: My God from the womb
    plain: |
      Yet it was You who brought me out of the womb and made me hope at my mother’s breast. From birth I was cast on You; from my mother’s womb You have been my God. Do not be far from me, for trouble is near and there is no one to help.
  - range: 12-18
    heading: Surrounded
    plain: |
      Many bulls surround me; strong bulls of Bashan close in. They open their mouths wide against me like a tearing, roaring lion. I am poured out like water, and all my bones are out of joint. My heart is like wax, melting inside me. My strength is dried up like a piece of broken pottery, my tongue sticks to my jaws, and You lay me in the dust of death. Dogs surround me; a company of evildoers closes in on me; they have pierced my hands and my feet. I can count all my bones. They stare and gloat over me. They divide my clothes among themselves and cast lots for my garment.
  - range: 19-21
    heading: Be not far; thou hast answered
    plain: |
      But You, O LORD, do not be far off. O my strength, hurry to help me. Deliver my life from the sword, my only life from the power of the dog. Save me from the lion’s mouth. From the horns of the wild oxen You have answered me.
  - range: 22-26
    heading: Praise in the great congregation
    plain: |
      I will tell of Your name to my brethren; in the middle of the congregation I will praise You. You who fear the LORD, praise Him; all you descendants of Jacob, glorify Him; stand in awe of Him, all you descendants of Israel. For He has not despised or abhorred the affliction of the afflicted one. He has not hidden His face from him, and when he cried to Him, He heard. From You comes my praise in the great congregation; I will pay my vows before those who fear Him. The meek will eat and be satisfied; those who seek the LORD will praise Him. May your hearts live for ever.
  - range: 27-31
    heading: The ends of the world, and a people yet unborn
    plain: |
      All the ends of the earth will remember and turn to the LORD, and all the families of the nations will worship before Him, for the kingdom is the LORD’s and He rules over the nations. All the fat ones of the earth will eat and worship; all who go down to the dust will kneel before Him, and no one can keep his own soul alive. A posterity will serve Him; it will be counted to the Lord for a generation. They will come and declare His righteousness to a people not yet born: that He has done it.

notes:
  - ref: 0
    phrase: Aijeleth Shahar
    kind: words
    title: The Deer of the Dawn
    body: |
      The two Hebrew words the King James leaves untranslated are rendered “The Deer of the Dawn” in a modern translation, and titles of this kind are “probably names of tunes, well known at the time.”
    sources: [nrsvue, bd-psalms]
  - ref: 1
    phrase: My God, my God
    kind: structure
    title: The shape of a lament
    body: |
      Psalm 22 is a lament, and its parts are the parts most laments have. A psalm of lament is “a song of complaint to the Lord regarding difficulties being endured, and a petition for His help,” and the kind is common: “Roughly one third of all the 150 biblical psalms are laments or contain laments.” Its usual elements, “although the order can be rearranged,” are five: “(1) invocation, (2) complaint, (3) confession of trust, (4) petition, and (5) vow of praise.”

      This psalm has each of them. The invocation is two words, repeated. The complaint runs to verse 18, broken twice by a turn to what the speaker knows of God (verses 3–5 and 9–10), each beginning “But thou.” The petition is verses 19–21. The vow of praise, verses 22–31, is a third of the psalm.

      Two things about the form matter here. The complaint is itself prayer: the man who says God has forsaken him says it to God, and calls Him “my God” three times in the first two verses. And a lament moves toward praise, “ending in a note of triumph as the sufferer anticipates the assistance he will receive from God or expresses gratitude that the desired assistance has come.” In a psalm of this shape the first line is where the prayer starts, not where it ends.
    sources: [sc-knowhy-438, hopkin-psalm-22]

  - ref: 1
    phrase: why hast thou forsaken me?
    kind: scripture
    title: The first line, prayed from the cross
    body: |
      Jesus prayed this line on the cross, and it has been read as naming the whole psalm. “And about the ninth hour Jesus cried with a loud voice, saying, Eli, Eli, lama sabachthani? that is to say, My God, my God, why hast thou forsaken me?” ([[Matt. 27:46]]; see [[Mark 15:34]]). Matthew and Mark give it as His only saying from the cross, and they keep it first in “the original Aramaic,” “the spoken language of Jews in Christ’s day.” Some who stood by misheard it: “This man calleth for Elias” ([[Matt. 27:47]]).

      Did He mean the one line, or the psalm? A psalm’s “first line was typically used as the title for the entire psalm,” and the Gospels draw on the middle and end of the lament as well as its opening (verses 7–8 and 18), which “indicates that the entire Psalm, rather than just the opening line, provided a lens for the passion narratives.” On this reading the cry is real anguish and also a pointer. Those who knew the psalm knew where it goes: to a God who “hath not despised nor abhorred the affliction of the afflicted” (verse 24) and to all nations worshipping.

      That is a reading, argued from how psalms were cited. The Gospels do not say what He intended. What the cry meant between the Son and the Father is the subject of the next note.
    sources: [lds-scriptures, hopkin-psalm-22]

  - ref: 1
    phrase: why art thou so far from helping me
    kind: prophets
    title: Did the Father forsake Him?
    body: |
      Elder Jeffrey R. Holland has taught both that the Father withdrew from the Son on the cross and that He did not forsake Him. He called the moment of this cry “that concluding descent into the paralyzing despair of divine withdrawal,” and then affirmed both things. On one side: “a perfect Father did not forsake His Son in that hour.” On the other: “that the supreme sacrifice of His Son might be as complete as it was voluntary and solitary, the Father briefly withdrew from Jesus the comfort of His Spirit, the support of His personal presence.” The reason he gave is that the sinless Son “had to feel what it was like to die not only physically but spiritually.”

      The psalm’s speaker, for his part, asks why God is “so far” and twice more asks Him not to be (verses 11 and 19). He never says that God is not his God. When the psalm looks back, its own verdict is that God had not “hid his face from him; but when he cried unto him, he heard” (verse 24).
    sources: [holland-none-with-him]

  - ref: 3
    phrase: O thou that inhabitest the praises of Israel
    kind: words
    title: Enthroned on Israel’s praises
    body: |
      The Hebrew pictures God seated as king upon the praises of Israel, and the verses that follow say what those praises were for. “Inhabitest” is a form of *yashav*, to sit or dwell, a verb used especially of the Lord “sitting (enthroned),” this verse included. A modern translation has “enthroned on the praises of Israel.” The Greek translators divided the line another way: “thou, the praise of Israel, dwellest in a sanctuary.”

      Verses 4–5 give the content of the praise: “Our fathers trusted in thee: they trusted, and thou didst deliver them.” “Trusted” comes three times in two verses. The sufferer is setting his case beside Israel’s story. The fathers cried and were delivered; he cries and is not answered (verse 2).

      The word returns. “Praises” here and “my praise” in verse 25 are the same Hebrew noun. By the end he has a praise of his own to bring to “the great congregation.”
    sources: [bdb, nrsvue, lxx-rahlfs, oshb-wlc]

  - ref: 6
    phrase: But I am a worm, and no man
    kind: symbol
    title: A worm, and no man
    body: |
      “Worm” says how small and despised he has become, and the rest of the verse says in whose eyes. The Hebrew word, *tola‘at*, stands for the worm as a “symbol of insignificance.” Bildad uses a form of it for all humankind before God, “How much less man, that is a worm?” ([[Job 25:6]]), and the Lord uses it of Israel (see the note on [[Isa. 41:14]]). Here the sufferer says it of himself and at once explains it: “a reproach of men, and despised of the people.” Verse 7 follows with the onlookers’ laughter. He is no man to them.

      “Despised” ties the verse to two other places. It is the verb of “He is despised and rejected of men” ([[Isa. 53:3]]), and the two passages have been set side by side on the strength of it. It also returns in verse 24 with God as its subject and a negative before it: “he hath not despised nor abhorred the affliction of the afflicted.” The people’s judgment of the sufferer and God’s judgment are opposite, and the psalm says so with one word.

      One Latter-day Saint proposal hears a second sense as well. The same Hebrew word names the insect that yielded scarlet dye, and the soldiers put “a robe of scarlet” on Jesus to mock Him as a king, so that “worm” would hint at royalty beneath the abasement. The verse’s own next words point to the first sense. The second is a suggestion.
    sources: [bdb, oshb-wlc, hopkin-psalm-22, lds-scriptures]

  - ref: 8
    phrase: He trusted on the LORD that he would deliver him
    kind: scripture
    title: His trust turned into a taunt
    body: |
      The mockers quote the sufferer’s faith back at him, and at the cross the chief priests said nearly the same words. In the psalm the taunt answers verses 4–5. He has just said that the fathers trusted and were delivered, and the onlookers reply, in effect: then let the LORD deliver you. He “is subsequently mocked when his continued suffering appears to contradict the value of that reliance.”

      Matthew tells the Crucifixion in these lines. Those who passed by “reviled him, wagging their heads” ([[Matt. 27:39]]), and the chief priests, scribes and elders said, “He trusted in God; let him deliver him now, if he will have him” ([[Matt. 27:43]]). In the Greek psalm the phrase for the wagging heads “uses the same Greek roots as those found in Matthew 27:39 and Mark 15:29.” In the psalm, the people who speak this line are the sufferer’s enemies.
    sources: [lds-scriptures, hopkin-psalm-22]

  - ref: 12
    phrase: strong bulls of Bashan have beset me round
    kind: symbol
    title: Bulls, a lion, dogs
    body: |
      The enemies are pictured as animals closing a ring around him, and the plea for rescue later names the animals in reverse. Bashan, east of the Jordan, was “known for its breed of cattle”; the Greek has simply “fat bulls.” After the bulls comes “a ravening and a roaring lion” (verse 13), and then dogs (verse 16), “a derisive term often reserved in the Bible for the ritually impure.” The verbs all say one thing: “compassed,” “beset me round,” “compassed,” “inclosed.” Verse 16 drops the figure for a moment and says who they are: “the assembly of the wicked.”

      When he asks for rescue (verses 20–21) the list runs backward: the dog, the lion’s mouth, the horns of the “unicorns.” That last word is the Hebrew *re’em*, the “wild ox”; “unicorn” came in through the Greek translation, an “erroneous” rendering.

      “My darling” in verse 20 belongs to the same plea. The Hebrew is “my only one,” a poetic name for his life, “the one unique and priceless possession which can never be replaced.”
    sources: [bd-bashan, lxx-rahlfs, bdb, hopkin-psalm-22]

  - ref: 15
    phrase: thou hast brought me into the dust of death
    kind: symbol
    title: A body giving out, and who has brought him there
    body: |
      Verses 14–15 describe a body failing part by part, and the last line holds God responsible. Poured out like water, bones out of joint, a heart like melting wax, strength “dried up like a potsherd,” a tongue stuck to the jaws: the images run from flowing to dry. A potsherd is “a broken piece of pottery,” and a drop of water on unglazed ware “would be soaked up almost instantly,” so the image has been read as one of “extreme thirst.”

      Then the line turns to God: “thou hast brought me into the dust of death.” Enemies surround him, yet the sentence is addressed to “thou.” The dust comes back at the end of the psalm: “all they that go down to the dust shall bow before him” (verse 29).

      John records that Jesus said He thirsted so that the scripture might be fulfilled ([[John 19:28]]), and John does not name the scripture. This verse has been read as one it fits, since John “links Christ’s thirst with his death” as the psalm does.
    sources: [hopkin-psalm-22, lds-scriptures]

  - ref: 16
    phrase: they pierced my hands and my feet
    kind: words
    title: '“Pierced,” or “like a lion”'
    body: |
      The King James “they pierced” follows the ancient Greek translation, the standard Hebrew text reads “like a lion,” and a Dead Sea scroll supports the Greek. The difference is one letter. The evidence, in order:

      **The Hebrew text.** The Masoretic Text, the standard Hebrew text, has *ka’ari*: “like a lion [are] my hands and my feet,” with no verb. A translation that keeps it must supply one, as in “like a lion they maul my hands and feet.”

      **The Greek.** The Septuagint, the Greek translation “compiled in the third century BC,” has a verb: “they pierced my hands and my feet.” The Greek word “could mean dig, bury, gouge, or bore, as with a horn, pick, or sharp tool.” Because the surviving copies are later, some have held that Christians altered the line. Two Jewish translators of the second century AD, Aquila and Symmachus, worked after that dispute had begun and “were likely influenced by it,” yet they too “employed a third-person plural verb in this location, although they differed as to the meaning of the verb.”

      **The scroll.** A fragment of a Psalms scroll found at Naḥal Ḥever, in the Dead Sea wilderness, and published in 1997 has the word ending in the letter *waw*, not *yod*, which makes it a verb. These “are the two letters most easily confused in Hebrew.” The scrolls in question are dated to the middle of the first century AD.

      The conclusion drawn in the Latter-day Saint studies of the verse is that the verb “was not a late change introduced into the manuscripts of the Psalms in support of Christian theology.” What the verb means is less settled than that it is a verb. Its meaning is “dubious, perhaps bore, or dig, or hew,” and another rendering is “they bound my hands and feet,” printed with the note “Meaning of Heb uncertain.”

      The Gospels tell that He was crucified ([[Luke 23:33]]); they “do not specifically mention the piercing of Christ’s hands and feet,” though “this was a typical mode of crucifixion.” The risen Lord shows it: “Behold my hands and my feet” ([[Luke 24:39]]), and to the Nephites, “feel the prints of the nails in my hands and in my feet” ([[3 Ne. 11:14]]).
    sources: [oshb-wlc, sc-knowhy-641, lxx-rahlfs, hopkin-psalm-22-16, hopkin-psalm-22, bdb, nrsvue, lds-scriptures]

  - ref: 18
    phrase: They part my garments among them, and cast lots upon my vesture
    kind: scripture
    title: One line in the psalm, two acts in John
    body: |
      In the psalm the two halves of the verse say one thing twice, and John saw each half happen. The doubling is the ordinary way of Hebrew verse (see [[Ps. 1:1]]).

      All four Gospels tell of the soldiers doing this at the cross. John alone separates two acts. The soldiers “took his garments, and made four parts,” but of the seamless coat they said, “Let us not rend it, but cast lots for it” ([[John 19:23–24]]). John then quotes the verse and says it happened “that the scripture might be fulfilled” ([[John 19:24]]). Where the psalm’s poetry repeats itself, John “saw a nuance in the parallel phrases that closely connected with Christ’s experience.”
    sources: [lds-scriptures, hopkin-psalm-22]

  - ref: 21
    phrase: thou hast heard me
    kind: words
    title: The turn, in one word
    body: |
      The psalm turns in the middle of this verse, on one Hebrew word that means *you have answered me*. It is the verb of verse 2, where the King James has “thou hearest not” and a modern translation “you do not answer.” In Hebrew it is the last word of the verse, and after it there is no more complaint. That translation prints the line as a new beginning, “From the horns of the wild oxen you have rescued me,” with the note “Heb answered.” The Greek translators did not find the turn here; they read “regard my lowliness.”

      The psalm does not say what happened between the plea and the answer. Two readings are offered. One takes the past tense as an expression of confidence: “in the very midst of his supplication there springs up in the mind of the suppliant the assurance of being heard and answered.” The other hears the rest of the psalm as spoken afterward, since verses 23–25 “speak of the trial as already having passed.” The form of a lament allows either (see the first note on verse 1).

      Read of Christ, the praise that follows comes after death and not in place of it: the triumphant verses “can only refer to events subsequent to Christ’s sacrifice and death on the cross.”
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs, delitzsch-psalms, hopkin-psalm-22]

  - ref: 22
    phrase: I will declare thy name unto my brethren
    kind: scripture
    title: Hebrews gives this line to Christ
    body: |
      Hebrews quotes this verse as Christ’s own words and makes “my brethren” its point. In the psalm the sufferer vows that, once delivered, he will tell what God has done among his own people, in the assembly at worship. Hebrews says that the Son and those He sanctifies “are all of one: for which cause he is not ashamed to call them brethren, Saying, I will declare thy name unto my brethren, in the midst of the church will I sing praise unto thee” ([[Heb. 2:11–12]]). The wording follows the Greek psalm, which has “in the midst of the church will I sing praise to thee.”

      Hebrews does not say where or when He declares the Father’s name. One Latter-day Saint reading sees in “the congregation” the gathering of the faithful dead to whom the Savior came between His death and resurrection ([[D&C 138:12–19]]), and hears the psalm’s congregation in the way that gathering is described. That is offered as a fit. The psalm’s own scene is a worshipper paying his vows.
    sources: [lds-scriptures, lxx-rahlfs, hopkin-psalm-22]

  - ref: 26
    phrase: The meek shall eat and be satisfied
    kind: history
    title: The vow and the meal
    body: |
      The meal has been read as the thank-offering he vowed, shared with the poor. “I will pay my vows” (verse 25) is the language of sacrifice. On one older reading he will bring the offerings “which he vowed to God when in the extremest peril,” and the flesh of such an offering, after the altar’s portion, “was used by the offerer to make a joyous meal” (see [[Lev. 7:16]]). The law does not require that the poor be invited; the reading finds it “rendered probable.” Then “the meek” are his guests, “those who are outwardly and spiritually poor,” and “your heart shall live for ever” is “the host’s blessing upon his guests.”

      The verse has also been read of the sacrament of the Lord’s Supper. That is a reading; the meal in the psalm is the worshipper’s own.
    sources: [delitzsch-psalms, hopkin-psalm-22, lds-scriptures]

  - ref: 27
    phrase: All the ends of the world shall remember and turn unto the LORD
    kind: structure
    title: The widening circle
    body: |
      The praise spreads outward in rings, from one man’s brethren to the whole world, the dead, and the unborn. It begins with “my brethren” (verse 22) and passes to “all ye the seed of Israel” (verse 23), then to “all the ends of the world” and “all the kindreds of the nations” (verse 27), then to the dead, “all they that go down to the dust” (verse 29), and last to “a people that shall be born” (verse 31). Verse 28 gives the ground: “the kingdom is the LORD’s.”

      Translations differ on verse 29; one, marking a correction of the Hebrew, has “all who sleep in the earth bow down.” In that rendering as in the King James, the dead are among those who bow. A Latter-day Saint reading takes them as “all who have been born of the dust of the earth and will return to it in death,” who will bow as Paul says every knee shall ([[Philip. 2:10–11]]).

      Elder Bruce R. McConkie read verses 27–28 of “the final millennial triumph of truth.”
    sources: [nrsvue, hopkin-psalm-22]

  - ref: 31
    phrase: that he hath done this
    kind: words
    title: 'The last word: “he has done”'
    body: |
      The psalm ends on a single Hebrew verb, “he has done,” with no object. “This” is the translators’ supply; a modern translation has “saying that he has done it.” What the unborn generation is to be told is left that wide.

      The “seed” of verse 30 joins the psalm to Isaiah’s servant, who after his suffering “shall see his seed” ([[Isa. 53:10]]); the two chapters have been connected at this point, with the seed taken as those “spiritually begotten” through Christ’s Atonement ([[Mosiah 5:7]]). Elder Bruce R. McConkie applied the closing verse to the Church’s own preaching: “we now declare unto all people born after Messiah’s day, the righteousness of the Father in sending his Son and the righteousness of the Son in doing all things for men that needed to be done.”
    sources: [oshb-wlc, nrsvue, hopkin-psalm-22, lds-scriptures]

christ: |
  The New Testament reads this psalm of Jesus Christ from its first line to its vow of praise. The evangelists tell of the mockery and the divided garments in its words, and John says the soldiers acted “that the scripture might be fulfilled” ([[John 19:24]]). Hebrews hears Him speaking in verse 22 ([[Heb. 2:12]]).

  The psalm does not end in the dust of death. On the road to Emmaus the risen Lord asked, “Ought not Christ to have suffered these things, and to enter into his glory?” ([[Luke 24:26]]), a description that “fits the pattern of Psalm 22 precisely.” The psalm that opens forsaken closes with the kingdom the LORD’s, the ends of the world turning to Him, and a people not yet born being told what He has done.

explore: |
  - **The Crucifixion beside the psalm.** [[Matt. 27:33–50]] and [[John 19:23–30]], read with verses 1, 7–8, 15 and 18 open.
  - **The other pillar.** [[Isa. 53]], for “despised,” the silence of the sufferer, and the “seed” he sees.
  - **The companion lament.** [[Ps. 69]], which has been called this psalm’s “counterpart.”
  - **“O God, where art thou?”** Joseph Smith’s prayer from Liberty Jail and the Lord’s answer, “The Son of Man hath descended below them all” ([[D&C 121:1–8]]; [[D&C 122:8]]).
  - **The cry from the cross.** Elder Jeffrey R. Holland, “None Were with Him” (general conference, April 2009).
  - **The fullest Latter-day Saint study.** Shon D. Hopkin, “‘My God, My God, Why Hast Thou Forsaken Me?’: Psalm 22 and the Mission of Christ,” *BYU Studies* 52, no. 4 (2013), goes through the psalm verse by verse with the early Christian readings.

parallels:
  - ref: Matt. 27:46
    note: Jesus prays verse 1 from the cross; Mark 15:34 has the same.
  - ref: Matt. 27:39–43
    note: The passers-by wag their heads and the chief priests say, “He trusted in God; let him deliver him now,” the taunt of verses 7–8.
  - ref: John 19:23–24
    note: The soldiers divide His garments and cast lots for the coat; John quotes verse 18 as fulfilled.
  - ref: Heb. 2:11–12
    note: Verse 22 is quoted as Christ’s words about those He calls brethren.
  - ref: Isa. 53:3
    note: The servant is “despised,” the same Hebrew verb as in verse 6.

