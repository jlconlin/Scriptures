chapter: 112
title: Blessed Is the Man That Feareth the LORD
tagline: The psalm before this one praised the LORD; this one takes its lines and uses them to describe the man who fears Him, down to what he does with his money and what he is not afraid of.
when: 'Undated; the psalm has no title and names no occasion'

setting: |
  Psalm 112 has no title, and nothing in it points to a time or an occasion. It names no king, no place and no event, and the enemies of verse 8 are not identified.

  It is the second of a pair. Psalm 111 and Psalm 112 both open with “Praise ye the LORD,” the hallelujah explained at [[Ps. 150:1]], and Psalm 111 has been called the first of “a trilogy of Hallelujah-Psalms.”

  The two are built alike. In Hebrew both are acrostics, the device explained at [[Ps. 9:1]]: each “consists of twenty-two lines with the twenty-two letters of the alphabet at the beginning.” Here that means two lines to a verse through verse 8 and three in each of the last two verses. The opening hallelujah stands outside the scheme, and the alphabet starts at “Blessed.”

  The two also share a subject, seen from its two sides. Psalm 111 praises the LORD for His works. Psalm 112 describes the person who fears Him, and has been said to celebrate “the men whose conduct is ordered after the divine pattern.” The note on verse 1 sets the shared lines side by side.

  Later scripture takes up one verse. Paul quotes verse 9 to the saints at Corinth when he asks them to give ([[2 Cor. 9:9]]).

thread: |
  Psalm 112 is **a portrait of the one who fears the LORD, drawn with the words Psalm 111 used for the LORD Himself**. It does not turn, as a lament does. An acrostic walks through the alphabet, and this one walks around a single man.

  It begins where the psalm before it stopped. Psalm 111 ends, “The fear of the LORD is the beginning of wisdom” ([[Ps. 111:10]]), and Psalm 112 opens by calling the man who has that fear blessed. Verses 2–3 say what comes to him: children who are strong, a house with wealth in it. Then come the lines the two psalms share. “His righteousness endureth for ever” was said of God; here it is said of the man, twice. “Gracious, and full of compassion” was said of God; it stands here at verse 4.

  The middle of the psalm says what the likeness looks like in practice, and it is mostly a matter of money and nerve. He lends and gives (verses 5 and 9). He “shall not be afraid of evil tidings,” because his heart is “fixed” (verses 7–8). The man who was introduced as fearing the LORD is described, twice, as not afraid.

  Verse 9 gathers it up: he has given to the poor, his righteousness lasts, his horn is lifted. Only then does anyone else enter. The wicked man gets the last verse, where he looks on, grinds his teeth, and melts away. The psalm’s last word about him is that his desire “shall perish.”

sections:
  - range: 1-3
    heading: Blessed is the man
    plain: |
      Praise the LORD. Blessed is the man who fears the LORD and takes great delight in His commandments. His children will be mighty on the earth; the generation of the upright will be blessed. Wealth and riches will be in his house, and his righteousness lasts for ever.
  - range: 4-6
    heading: Light in the darkness
    plain: |
      Light rises in the darkness for the upright: gracious, full of compassion, and righteous. It goes well with the man who is generous and lends; he will manage his affairs with judgment. He will never be moved. The righteous will be remembered for ever.
  - range: 7-9
    heading: A heart that is fixed
    plain: |
      He will not be afraid of bad news; his heart is firm, trusting in the LORD. His heart is steady and he will not be afraid, until he looks in triumph on his enemies. He has scattered his gifts; he has given to the poor. His righteousness lasts for ever, and his horn will be lifted up in honour.
  - range: 10
    heading: The wicked shall see it
    plain: |
      The wicked man will see it and be vexed. He will gnash his teeth and melt away. What the wicked long for will come to nothing.

notes:
  - ref: 1
    phrase: Blessed is the man that feareth the LORD
    kind: structure
    title: Psalm 111’s lines, said again of a man
    body: |
      Psalm 112 says of the man who fears the LORD what Psalm 111 said of the LORD. The earlier psalm ends, “The fear of the LORD is the beginning of wisdom: a good understanding have all they that do his commandments” ([[Ps. 111:10]]). Psalm 112 begins with a man who “feareth the LORD” and “delighteth greatly in his commandments.”

      The shared lines follow. Of the LORD, Psalm 111 says “his righteousness endureth for ever” ([[Ps. 111:3]]). Psalm 112 says the same sentence of the man, in the same verse, and again in verse 9. Psalm 111 says “the LORD is gracious and full of compassion” ([[Ps. 111:4]]), and the words return here in verse 4, where it is disputed whether they are said of the man or of God (see the note on [[Ps. 112:4]]).

      A man whose righteousness “endureth for ever” is a large claim, and the pairing shows what kind of claim it is. On one older reading, his righteousness is “the copy of the divine,” and it is “the work and gift of God.” It lasts, that is, because it was God’s first.
    sources: [lds-scriptures, delitzsch-psalms]

  - ref: 3
    phrase: Wealth and riches shall be in his house
    kind: scripture
    title: Wealth, and what the psalm says he does with it
    body: |
      The psalm promises wealth in verse 3 and spends the rest of its length on how the man handles it. He “sheweth favour, and lendeth” (verse 5). He “hath dispersed, he hath given to the poor” (verse 9). “Discretion” in verse 5 can sound like mere prudence, but other versions render the word differently: a modern translation has “who conduct their affairs with justice,” and the ancient Greek version has “with judgment.”

      What the psalm says will last is not the wealth. Both times the phrase “endureth for ever” appears, in verse 3 and again in verse 9, its subject is “his righteousness.” The riches are in the house; the lasting thing is elsewhere.

      Paul reads the psalm the same way when he quotes verse 9. God gives “all sufficiency in all things” so that the saints “may abound to every good work” ([[2 Cor. 9:8]]); the note on [[Ps. 112:9]] has his argument.
    sources: [lds-scriptures, nrsvue, lxx-rahlfs]

  - ref: 4
    phrase: he is gracious, and full of compassion, and righteous
    kind: words
    title: Who is gracious and full of compassion
    body: |
      The Hebrew of this line names no one, and readers divide over whether it describes the LORD or the upright man. It is three adjectives and nothing else. The King James “he is” has no counterpart in the Hebrew, so the translators’ “he” leaves the question open.

      One older reading takes the three adjectives as “a mention of God according to His attributes.” The usage of the words is on its side. The first two are the words the LORD proclaimed of Himself to Moses, “merciful and gracious” ([[Ex. 34:6]]), and Psalm 111 has just used them of Him. Elsewhere the first is “only used as an attribute of God” and the second is “always of God,” and this verse is listed with the rest. On this reading God is the light of the first half of the verse: “God Himself is the light which arises in darkness for those who are sincere in their dealings with Him.” The same reading sets the verse beside Malachi’s promise that “unto you that fear my name shall the Sun of righteousness arise” ([[Mal. 4:2]]).

      The other reading makes the man the subject of the whole verse. A modern translation has “They rise in the darkness as a light for the upright; they are gracious, merciful, and righteous.” Then the psalm has done here what it did in verse 3, and given to the God-fearer words that elsewhere belong to God alone.

      On either reading the man’s compassion is in view. Even the first holds that the light rises for those “who are compassionate as He is compassionate.”
    sources: [biblehub-interlinear, delitzsch-psalms, bdb, nrsvue, lds-scriptures]

  - ref: 7
    phrase: He shall not be afraid of evil tidings
    kind: words
    title: The man who fears is not afraid
    body: |
      The psalm uses one Hebrew verb for the fear of verse 1 and for the fear this man does not have. He “feareth the LORD” in verse 1; in verses 7 and 8 he “shall not be afraid,” and the verb is the same each time. The English hides the echo by changing the word. The man is defined by one fear at the start and by the absence of fear in the middle.

      The psalm does not say that bad news never reaches him. “Evil tidings” come; what holds is his heart, which is “fixed” and “established,” and the reason given is that he is “trusting in the LORD.” The fixed heart is explained at [[Ps. 57:7]], where David says the same of his own.

      Verse 8 gives the fearlessness an end point: “until he see his desire upon his enemies.” The words “his desire” are supplied by the translators, as in the line explained at [[Ps. 54:7]]; a modern translation has “in the end they will look in triumph on their foes.” What the man does is look. The psalm gives him no act against his enemies.
    sources: [oshb-wlc, nrsvue, lds-scriptures]

  - ref: 9
    phrase: He hath dispersed, he hath given to the poor
    kind: scripture
    title: Paul quotes the verse to the Corinthians
    body: |
      Paul quotes this verse while gathering an offering, and he puts God’s giving ahead of the giver’s. He is writing about “the ministering to the saints” ([[2 Cor. 9:1]]), and he has just said that “God loveth a cheerful giver” ([[2 Cor. 9:7]]). Then: “As it is written, He hath dispersed abroad; he hath given to the poor: his righteousness remaineth for ever” ([[2 Cor. 9:9]]).

      The sentence before the quotation says where the means to give come from. “God is able to make all grace abound toward you; that ye, always having all sufficiency in all things, may abound to every good work” ([[2 Cor. 9:8]]). The sentence after it looks to God to “multiply your seed sown, and increase the fruits of your righteousness” ([[2 Cor. 9:10]]). So in Paul’s hands the psalm’s open-handed man is someone who has first been given to.

      The verse ends with the man’s horn “exalted with honour.” A horn is the figure for strength explained at [[Ps. 18:2]].
    sources: [lds-scriptures]

  - ref: 10
    phrase: the desire of the wicked shall perish
    kind: structure
    title: What perishes and what lasts
    body: |
      The psalm gives its last verse to the wicked, and its last word is “perish.” What perishes is “the desire of the wicked.” Against it stand the things the psalm has said will last: the man’s righteousness “endureth for ever” (verses 3 and 9), and he “shall be in everlasting remembrance” (verse 6).

      The wicked man is given nothing to do but watch. He “shall see it,” and then he “shall gnash with his teeth, and melt away.”
    sources: [lds-scriptures]

christ: |
  The LORD whom this man fears is Jehovah, the premortal Jesus Christ (see the note on [[Ps. 110:1]]). So the One Psalm 111 praises, whose righteousness endures for ever and who is gracious and full of compassion ([[Ps. 111:3–4]]), is He, and the man of Psalm 112 is described in words first said of Him.

  Paul quotes the psalm of His disciples, and the note on verse 9 shows how: their giving follows from grace that God has first made to abound toward them. On one older reading of verse 4, the light that rises in the darkness for the upright is God Himself, and that reading sets the line beside Malachi’s “Sun of righteousness” ([[Mal. 4:2]]); the note on verse 4 gives it and the alternative.

explore: |
  - **The other half of the pair.** [[Ps. 111]], read first, with its verses 3, 4 and 10 beside this psalm’s 3, 4 and 1.
  - **The words behind verse 4.** [[Ex. 34:6]], where the LORD proclaims Himself “merciful and gracious,” and [[Ps. 103:8]], which repeats it.
  - **Paul’s argument.** [[2 Cor. 9:6–11]], the paragraph that quotes verse 9.
  - **Riches and their purpose.** [[Jacob 2:17–19]].
  - **The first “Blessed is the man.”** [[Ps. 1]], which opens with the same words and also ends on “perish.”

parallels:
  - ref: Ps. 111:10
    note: The psalm before this one ends with the fear of the LORD and the doing of His commandments; this one begins there.
  - ref: Ps. 111:3–4
    note: “His righteousness endureth for ever” and “gracious and full of compassion,” said of the LORD, return here in verses 3, 4 and 9.
  - ref: 2 Cor. 9:9
    note: Paul quotes verse 9 as he asks the Corinthian saints to give.
  - ref: Ex. 34:6
    note: The LORD proclaims Himself “merciful and gracious,” the words behind verse 4.
  - ref: Ps. 1:6
    note: The first psalm also opens with “Blessed is the man” and ends with “perish.”

