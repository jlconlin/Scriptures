chapter: 82
title: God Judges among the Gods
tagline: In the council of heaven God charges those He set to judge with failing the poor, sentences them to die like men, and is asked to rise and judge the earth Himself.
when: 'Undated; a psalm of Asaph by its title'

setting: |
  The title reads “A Psalm of Asaph.” Asaph was “a cymbal-playing Levite appointed leader of David’s choir” who “founded a family of singers,” and his name stands over Psalm 50 and Psalms 73–83; he and his guild are introduced at [[Ps. 50:1]]. The title gives no occasion, and nothing in the psalm dates it.

  Psalm 82 is not a prayer until its last verse. The first seven verses report a trial: God takes His place in an assembly, accuses those who sit there of judging unjustly, and passes sentence. The scene is the council of heaven, which the Old Testament describes in several places. Who the accused are is the question every reader of the psalm has to face, and it is taken up at verse 6.

  Short as it is, the psalm is quoted at two important places in later scripture. The Savior quoted verse 6 when He was accused of blasphemy ([[John 10:34–36]]), and the vision of the celestial glory says of the exalted, “as it is written, they are gods, even the sons of God” ([[D&C 76:58]]). The psalm is read here first as the trial it describes, and then as the Savior and the Restoration use it.

thread: |
  Psalm 82 is a courtroom scene in eight verses, and **one verb holds it together: judge.** God “judgeth among the gods” (verse 1). His charge is “How long will ye judge unjustly?” (verse 2). His command, “Defend the poor and fatherless,” is the same verb in Hebrew: judge the poor and fatherless (verse 3). And the last verse asks God to “judge the earth” (verse 8). The psalm is about what judging is for, who has failed at it, and who is left to do it.

  It moves in four steps. The court sits, with God standing in it (verse 1). He speaks the indictment, which is also a job description: those with power are there for the poor, the fatherless, the afflicted and the needy, and they have favored the wicked instead (verses 2–4). Then the voice changes from “ye” to “they,” and the finding is given: they do not know and will not understand, and because of them the foundations of the earth are shaking (verse 5). The sentence follows. God Himself called them gods and children of the Most High, and they will die like men all the same (verses 6–7).

  The turn is at verse 8, where for the first time someone other than God speaks. Having watched the trial, the psalmist prays: “Arise, O God, judge the earth.” The verbs answer the sentence. The gods will “fall”; God is asked to “arise,” and the reason given is that all nations are to be His inheritance. The psalm does not end with justice done. It ends with a prayer that God will take the work into His own hands.

sections:
  - range: 1
    heading: The court sits
    plain: |
      God stands in the assembly of heaven and gives judgment there, among the gods.
  - range: 2-4
    heading: The charge
    plain: |
      How long will you give unjust rulings and take the side of the wicked? Judge for the poor and the fatherless, and see that the afflicted and the needy get justice. Rescue the poor and the needy from the power of the wicked.
  - range: 5
    heading: The finding
    plain: |
      They know nothing and refuse to understand. They go on walking in the dark, and all the foundations of the earth are shaken.
  - range: 6-7
    heading: The sentence
    plain: |
      I myself said, “You are gods, and all of you are children of the Most High.” Even so, you will die as mortals do, and fall like any prince.
  - range: 8
    heading: The prayer
    plain: |
      Rise, O God, and judge the earth, for all the nations will be Your inheritance.

notes:
  - ref: 1
    phrase: the congregation of the mighty
    kind: words
    title: The congregation of the mighty is the council of God
    body: |
      The phrase names a heavenly assembly: the Hebrew is “congregation of El,” and *El* is a word for God, which the King James has translated as an adjective, “the mighty.” The standard lexicon renders it “congregation of El, of company of angels.” The ancient Greek translation has “God stands in the assembly of gods,” and a modern translation has “God has taken his place in the divine council.”

      So the psalm opens with God standing among heavenly beings, and the scene is not unique to it. Micaiah says, “I saw the LORD sitting on his throne, and all the host of heaven standing by him on his right hand and on his left” ([[1 Kgs. 22:19]]), and Job opens on “a day when the sons of God came to present themselves before the LORD” ([[Job 1:6]]). Here the council is on trial.

      That is the force of “standeth.” The verb means to “station oneself, take one’s stand, for definite purpose,” and the lexicon sets this verse beside Isaiah’s courtroom: “The LORD standeth up to plead, and standeth to judge the people” ([[Isa. 3:13]]). In Isaiah the accused are the elders and princes who have “the spoil of the poor” in their houses ([[Isa. 3:14]]).

      The word translated “gods” is *elohim*, the same word as “God” at the start of the verse; its range is explained at [[Ps. 8:5]].
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, scripture-helps-ps-49, lds-scriptures]
  - ref: 1
    phrase: he judgeth among the gods
    kind: prophets
    title: Joseph Smith preached from this verse
    body: |
      Joseph Smith quoted this verse in a sermon on the plurality of Gods on 16 June 1844. A hearer’s notes record that he began from [[Rev. 1:6]], went on “to show the plurality of Gods” from the Hebrew of Genesis 1, taught that “the Son also was a distinct personage But in the image of the Father,” quoted the Savior’s prayer in John 17, “and also the 82 psalm 1st verse God standith in the Congragations of the Mighty; he Judgeth among the Gods.” The notes are brief and give no comment of his on the verse. They show where he placed it: among the scriptures that speak of more than one who is called God.

      Restoration scripture describes such an assembly in its own words. Abraham saw the spirits “that were organized before the world was,” and “God saw these souls that they were good, and he stood in the midst of them, and he said: These I will make my rulers” ([[Abr. 3:22–23]]). A revelation to Joseph Smith speaks of what “was ordained in the midst of the Council of the Eternal God of all other gods before this world was” ([[D&C 121:32]]). One Latter-day Saint study calls Abraham’s vision “a scene that is really a textbook instance of the motif of the divine assembly. These are premortal human beings.” In both, God stands in the midst of others, and in Abraham those others are to be rulers.

      The likeness should not be pressed into an identity. The psalm shows a council under judgment and Abraham a council being commissioned, and Latter-day Saint scholars “acknowledge that an LDS understanding of the council does not precisely mirror the perspectives manifested in the Bible.”
    sources: [jsp-discourse-1844-06-16-mcintire, peterson-ye-are-gods, bokovoy-ye-really-are-gods, lds-scriptures]
  - ref: 3
    phrase: Defend the poor and fatherless
    kind: scripture
    title: Defend is the verb judge
    body: |
      “Defend” translates the verb “judge,” so the command is the positive form of the accusation in verse 2: stop judging unjustly, and judge the poor and fatherless. The Greek translation keeps the word, “Judge the orphan and poor,” and a modern translation has “Give justice to the weak and the orphan.” In the psalm’s view a judge is there for the people who cannot make a court listen: the poor, the fatherless, the afflicted, the needy. Against them stands one opponent, “the wicked,” named in verses 2 and 4.

      The failure is described as accepting “the persons of the wicked,” which is to “show partiality to the wicked.” Deuteronomy uses the same Hebrew expression to say what God never does: He is “God of gods, and Lord of lords, a great God, a mighty, and a terrible, which regardeth not persons, nor taketh reward” ([[Deut. 10:17]]).

      Behind the trial is the idea that a judge’s authority is God’s and not his own: “the power to rule is seen as belonging strictly to God,” and “those to whom he grants power incur God’s wrath when they fail in their commission.”
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, frederick-ot-in-nt-gospels, lds-scriptures]
  - ref: 5
    phrase: all the foundations of the earth are out of course
    kind: symbol
    title: Unjust judgment shakes the foundations of the earth
    body: |
      The line says that corrupt judgment is not a local wrong: it unsettles the world. “Out of course” is 1611 English for a verb that means to “be shaken, moved, overthrown,” used here as a figure of general disorder. A modern translation has “all the foundations of the earth are shaken.”

      The image treats justice as part of how the earth was built. One reading takes the foundations to be the commands the judges have broken, “as it were the shafts and pillars” on which ordered life rests, so that “their transgression makes the land, the earth, to totter physically and morally.” Another psalm uses the same picture: “If the foundations be destroyed, what can the righteous do?” ([[Ps. 11:3]]).

      The verse also marks a change in the trial. Verses 2–4 are spoken to the accused: “How long will ye.” Verse 5 speaks about them: “They know not.” The same reading hears in the change a verdict that the warning has failed, that “no result is to be expected from the divine admonition: they still go their ways.” Their ignorance is not innocent: the verse says that they will not understand, and that they walk on in darkness. The sentence of verses 6–7 follows from that refusal.
    sources: [bdb, nrsvue, delitzsch-psalms, lds-scriptures]
  - ref: 6
    phrase: Ye are gods
    kind: words
    title: Who the gods of the psalm are
    body: |
      The Church’s study helps read the gods as judges whom God had appointed and who stand accused in the council of heaven, and Latter-day Saint scholars have argued that they are heavenly beings as well. The psalm gives ground for each: it sets the scene in heaven and gives the accused an earthly task.

      **Judges who hold God’s authority.** The charge of verses 2–4 is the work of a court. The Church’s reading keeps the heavenly setting and says that in it “God appears to be addressing those He had appointed as judges but who had judged unjustly,” so that “Ye are gods” probably speaks of the divine authority He had given them. They are gods “in the sense that they are exercising authority granted unto them by God.” The standard lexicon gives *elohim* such a sense, “rulers, judges, either as divine representatives at sacred places or as reflecting divine majesty and power,” and puts this psalm under it, while recording that other scholars read “angels.” The usual example is the law that sends a servant and his master before “the judges,” where the Hebrew word is *elohim* ([[Ex. 21:6]]).

      **Heavenly beings.** Latter-day Saint scholars have defended a second reading, in which the accused are themselves members of the council. Verse 7 has little force if they are ordinary men: “If they were already mortals, this would hardly be a serious penalty.” One Latter-day Saint study of the psalm judges that the Exodus laws “provide very weak support” for *elohim* as “merely human judges,” and that “the consensus of contemporary biblical scholarship … is that the action depicted in this psalm occurs in the divine council.” A second accepts “the biblical use of the word elohim as a literal reference to gods rather than human judges.” The lexicon’s gloss on “children of the most High” leaves the question open in four words: “either monarchs or angel-princes.”

      **Both.** The same Latter-day Saint study argues that the choice is forced only if gods and human beings are different kinds of being. If, as the Restoration teaches, “gods and men form a single class, differentiated along a spectrum of holiness, wisdom, and power,” then verses 2–4 can speak of human rulers and verses 6–7 of divine beings without contradiction. This is an argument made by Latter-day Saint scholars, not a position the Church has taken. On any of these readings the psalm is plain about one thing: God gave the title, and the title did not shield anyone from His judgment.
    sources: [scripture-helps-ps-49, bdb, frederick-ot-in-nt-gospels, peterson-ye-are-gods, bokovoy-ye-really-are-gods, lds-scriptures]
  - ref: 6
    phrase: I have said
    kind: christ
    title: The Savior quotes the line in His own defense
    body: |
      Jesus quoted this verse when He was about to be stoned for blasphemy, and He used it to defend the title Son of God. He had said, “I and my Father are one” ([[John 10:30]]). His hearers took up stones, “because that thou, being a man, makest thyself God” ([[John 10:33]]). He answered, “Is it not written in your law, I said, Ye are gods? If he called them gods, unto whom the word of God came, and the scripture cannot be broken; Say ye of him, whom the Father hath sanctified, and sent into the world, Thou blasphemest; because I said, I am the Son of God?” ([[John 10:34–36]]).

      The argument is from scripture’s own usage: “how can the Jews condemn him for ‘making himself God’ when their own scriptures apply the title of ‘God’ to beings other than Jehovah?” It also runs from the greater title to the lesser. If scripture says “gods” of those to whom God’s word came, the One whom the Father sanctified and sent may surely say “Son of God.” The irony is that the lesser title understates the case, since “Jesus actually is God made flesh.”

      Two things in His wording bear on the psalm. He identifies its speaker as God: “he called them gods.” And He describes those addressed as those “unto whom the word of God came,” adding that “the scripture cannot be broken.”

      Whether the Savior’s argument needs the gods of the psalm to be truly divine is disputed among those who have studied it. One Latter-day Saint reading holds that it does: “It does not seem that Jesus’ citation of a metaphorical use of the term god, as applied to human beings, would go very far toward justifying his ascription to himself of literal divinity,” so that the verse “must apply to human beings … yet it must also involve genuinely divine beings.” Another reads the gods as rulers who held authority God had granted, and takes the argument as one from scripture’s use of the title. John reports the result either way: they tried again to seize Him, and He escaped ([[John 10:39]]).
    sources: [frederick-ot-in-nt-gospels, peterson-ye-are-gods, lds-scriptures]
  - ref: 6
    phrase: children of the most High
    kind: prophets
    title: Children of the Most High in latter-day revelation
    body: |
      Latter-day revelation takes up the verse and applies it to what God’s children may become. The vision of the three glories says of those who inherit the celestial kingdom, “Wherefore, as it is written, they are gods, even the sons of God” ([[D&C 76:58]]). The words “as it is written” refer to earlier scripture, and the Church’s edition gives this verse and the Savior’s quotation of it among the places.

      Modern prophets and apostles have cited the verse when teaching that we are children of God. Elder Patrick Kearon took the psalm’s phrase itself, with the verse in his note: “The Holy Spirit can bear witness to your heart that you are indeed a child of the Most High.”
    sources: [lds-scriptures, scripture-helps-ps-49, kearon-receive-gift]
  - ref: 7
    phrase: ye shall die like men
    kind: words
    title: Like men, or like Adam
    body: |
      The sentence is mortality, and the Hebrew allows it to be heard as an allusion to the Fall. The phrase is *ke-adam*. *Adam* is the ordinary word for humankind, and this verse is classed among those where it means man “as feeble, earthly, mortal”; a modern translation has “you shall die like mortals.” But *adam* is also the first man’s name, so that “passages that may originally have had clear reference to Adam may have been translated as referring only to man,” and the phrase “translated as ‘like man’ in the KJV, could just as easily be read as ‘like Adam.’” The same choice has to be made at [[Hosea 6:7]]. The Church’s footnote at “die” in this verse sends the reader to Paul: “For as in Adam all die, even so in Christ shall all be made alive” ([[1 Cor. 15:22]]).

      On either reading the point of the verse is the gap between the title and the end. “But” opens it, and it answers the “I have said” of verse 6: whatever they were called, they will end as every human being ends. The second line says it again from the side of rank. They will “fall like one of the princes,” or “like any prince.”

      Who could receive such a sentence depends on who the gods are (see the note on verse 6). If they are judges, it strips an honor: the title did not exempt them from the common end. If they are members of the heavenly council, it is a real loss. One Latter-day Saint scholar, with the casting down of Satan in view ([[Moses 4:3]]), observes that in the ancient Near East members of a divine council “often appear to receive a type of reprimand suggestive of the punishment given Lucifer in LDS scripture,” and suggests that if some of the council were punished for rebellion before the world was made, the Savior “may very well have interpreted Psalm 82 as a reflection of this event.” That is offered as a possibility, and the psalm does not name the occasion.
    sources: [oshb-wlc, bdb, nrsvue, pritchett-fall, sc-knowhy-28, bokovoy-ye-really-are-gods, lds-scriptures]
  - ref: 8
    phrase: thou shalt inherit all nations
    kind: scripture
    title: The Most High and the inheritance of the nations
    body: |
      The last line uses the words of Moses’ song, where the Most High gives the nations their inheritance: “When the most High divided to the nations their inheritance, when he separated the sons of Adam, he set the bounds of the people according to the number of the children of Israel” ([[Deut. 32:8]]). The next verse names Jacob as “the lot of his inheritance” ([[Deut. 32:9]]). The Hebrew verb behind the dividing of an inheritance is the one the psalm uses for “inherit,” and “most High” is the title of verse 6.

      The song has an old variant that bears on the psalm’s council. Where the traditional Hebrew text has “the children of Israel,” a modern translation follows a Dead Sea scroll and the Greek and reads “according to the number of the gods.” One Latter-day Saint scholar takes that form of the verse as the earliest sign of “God assigning members of his council to assume important positions of administrative responsibility.” That depends on the variant, and it is one reading.

      The plain sense does not depend on it. In Moses’ song the Lord’s portion is one people, Jacob; in the psalm’s last line the inheritance is all nations. A modern translation puts the line in the present, “for all the nations belong to you,” and the King James in the future, “thou shalt inherit.”
    sources: [oshb-wlc, nrsvue, bokovoy-ye-really-are-gods, lds-scriptures]

christ: |
  The psalm ends by asking for a Judge, and the Church’s edition answers at the word “judge” in verse 8 with a single cross-reference, to Jesus Christ as Judge. The Savior said it of Himself: “For the Father judgeth no man, but hath committed all judgment unto the Son” ([[John 5:22]]). Where the psalm’s judges favored the wicked and left the poor undefended, Isaiah says of the Branch from Jesse, “with righteousness shall he judge the poor, and reprove with equity for the meek of the earth” ([[Isa. 11:4]]).

  The prayer also calls the Judge heir of all nations, and another psalm makes that promise to the Lord’s anointed (see [[Ps. 2:2]]): “I shall give thee the heathen for thine inheritance” ([[Ps. 2:8]]).

  He also quoted the psalm. Charged with making Himself God, He answered from verse 6 and named Himself the One “whom the Father hath sanctified, and sent into the world” ([[John 10:36]]). And the revelation that calls the exalted “gods, even the sons of God” says in the next breath that “they are Christ’s, and Christ is God’s” ([[D&C 76:58–59]]).

explore: |
  - **The Savior’s argument in full.** Read [[John 10:22–39]], from the question at the Feast of Dedication to the attempt to seize Him.
  - **The council elsewhere.** [[1 Kgs. 22:19–23]], [[Job 1:6–12]], and [[Ps. 89:5–7]]; for the Restoration’s account, [[Abr. 3:22–28]] and [[D&C 121:28–32]].
  - **The same trial on earth.** [[Isa. 3:13–15]] has the Lord standing to judge the elders and princes for what they have done to the poor.
  - **Children, then heirs.** [[Rom. 8:16–17]] speaks of the children of God as heirs with Christ, and [[D&C 76:50–60]] says of whom “they are gods” is written.
  - **The word *elohim*.** [[Ps. 8:5]], where the King James translates it “angels.”
  - **A long study worth the time.** Daniel C. Peterson’s essay “‘Ye Are Gods’: Psalm 82 and John 10 as Witnesses to the Divine Nature of Humankind” (on Scripture Central’s archive) works through the ancient evidence for the council and argues that Latter-day Saints are well placed to reconcile the psalm with the Savior’s use of it.

parallels:
  - ref: John 10:34–36
    note: The Savior quotes verse 6 when accused of blasphemy for calling Himself the Son of God.
  - ref: D&C 76:58
    note: “As it is written, they are gods, even the sons of God,” said of those who inherit the celestial glory.
  - ref: Deut. 32:8–9
    note: The Most High divides the nations their inheritance; the psalm uses the same verb in its last line and the same title in verse 6.
  - ref: Isa. 3:13–15
    note: The Lord stands to judge the elders and princes for oppressing the poor.
  - ref: Abr. 3:22–23
    note: God stands in the midst of the spirits and chooses His rulers.
  - ref: Ps. 2:8
    note: The nations promised as an inheritance to the Lord’s anointed.

