chapter: 32
title: Whose Sin Is Covered
tagline: David calls the forgiven man blessed, tells how silence about his sin wasted him until he confessed it, and then teaches others to come to God without being dragged.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  Psalm 32 stands in Book One of the Psalms. Its title ascribes it to David, and Paul quotes its opening as David’s ([[Rom. 4:6–8]]). The title names no occasion, and the psalm does not say what the sin was.

  An older reading places it after David’s sin with Bathsheba. On that reading “David was like one under sentence of condemnation” for a year; Psalm 51 was written “in the very midst of the penitential struggle,” and this psalm “after he had recovered his inward peace.” That is a reading, and the chapter does not depend on it. David’s story and what became of him are told with Psalm 51 (see the note on [[Ps. 51:14]]).

  The psalm has been called “a didactic Psalm, concerning the way of penitence which leads to the forgiveness of sins,” and it is built to teach. It gives the result first, in two lines that begin “Blessed” (on the word, see [[Ps. 1:1]]). Then it tells the experience behind them, and from verse 6 it turns to others. Three times the telling stops at “Selah” (see the note on [[Ps. 3:2]]): after the suffering, after the forgiveness, and after the refuge.

thread: |
  Psalm 32 is about **who covers the sin**. Its first verse calls the man blessed “whose sin is covered.” Its fifth says how David came to be that man: “mine iniquity have I not hid.” In Hebrew “covered” and “hid” are one verb. While David covered his sin himself, by keeping silent, he wasted under God’s hand (verses 3–4). When he stopped covering it, God covered it.

  The turn is verse 5, and it is quick. Two verses describe the silence, with days and nights of it. The confession and the forgiveness take one verse between them: “I said, I will confess my transgressions unto the LORD; and thou forgavest the iniquity of my sin.”

  After that the psalm looks beyond David’s own case. Because of what happened to him, “every one that is godly” should pray (verse 6). The God whose hand was heavy on him is now his “hiding place” (verse 7). Then comes instruction, with a warning: do not be the horse or mule that must be bridled before it will come (verses 8–9).

  The psalm also changes its sound. It opens on David’s “roaring all the day long,” moves to “songs of deliverance,” and ends by telling the upright to “shout for joy.” What surrounds him changes too: one Hebrew verb says that songs “compass” him in verse 7 and that mercy shall “compass” the one who trusts in verse 10.

sections:
  - range: 1-2
    heading: Blessed is the forgiven
    plain: |
      Blessed is the one whose transgression is forgiven, whose sin is covered. Blessed is the man to whom the LORD does not charge iniquity, and in whose spirit there is no deceit.
  - range: 3-4
    heading: When I kept silence
    plain: |
      While I kept silent, my bones wore out with my groaning all day long. Day and night Your hand was heavy on me; my strength dried up as in the heat of summer.
  - range: 5-5
    heading: I acknowledged my sin
    plain: |
      I made my sin known to You and did not cover my iniquity. I said, “I will confess my transgressions to the LORD,” and You forgave the guilt of my sin.
  - range: 6-7
    heading: A hiding place
    plain: |
      Because of this, let everyone who is godly pray to You at a time when You may be found; when the great waters flood, they will not reach him. You are my hiding place. You will keep me from trouble and surround me with songs of deliverance.
  - range: 8-9
    heading: Not as the horse or the mule
    plain: |
      I will instruct you and teach you the way you should go; I will counsel you with my eye upon you. Do not be like a horse or a mule, which have no understanding, which must be held with bit and bridle or they will not come near you.
  - range: 10-11
    heading: Mercy shall compass him about
    plain: |
      The wicked have many sorrows, but mercy will surround the one who trusts in the LORD. Be glad in the LORD and rejoice, you righteous; shout for joy, all you who are upright in heart.

notes:
  - ref: 0
    phrase: Maschil
    kind: words
    title: Maschil, and the verb of verse 8
    body: |
      The meaning of “Maschil” as a label is uncertain, but the word is formed from the verb translated “I will instruct thee” in verse 8. It stands in the titles of thirteen psalms, and this is the first of them. Some titles “appear to be intended to indicate the character of the Psalm,” and this one has been explained as “giving instruction.” The ancient Greek translation took it that way: “A Psalm of instruction by David.” A modern translation leaves it as a name, “A Maskil.”

      Beside that sense, a “didactic poem,” two others have been proposed: a “contemplative poem” and a “skilful, artistic song.”

      Whatever the label means on the other twelve, this psalm does teach. Its eighth verse uses the verb behind the title, in the sense “cause to consider, give insight, teach,” so that here the label and the psalm’s own words agree.
    sources: [bd-psalms, bdb, lxx-rahlfs, nrsvue, oshb-wlc]

  - ref: 1
    phrase: whose sin is covered
    kind: words
    title: Three words for sin, three for its removal, and one condition
    body: |
      Verses 1–2 name sin three ways and its removal three ways, and then add one thing about the man himself. The King James “transgression,” “sin,” and “iniquity” are three different Hebrew nouns. One older reading distinguishes them as “a breaking loose or tearing away from God,” “a deviation from that which is well-pleasing to God,” and “a perversion, distortion, misdeed.” The third word can also mean the guilt a deed leaves: “iniquity, guilt, or punishment of iniquity.”

      The three verbs are three pictures. “Forgiven” is forgiveness as “a lifting up and taking away.” “Covered” means covered “by God, which he thus puts out of sight.” “Imputeth not” is a word for reckoning, “impute, reckon”: the iniquity is not put to his account. A weight is carried off, a thing is put out of sight, and a charge is not entered.

      The fourth line is unlike the three before it. Those say what God does with sin; “in whose spirit there is no guile” says something about the man. The Hebrew noun means “deceit, treachery,” and in this verse “deception.” On the same older reading it is the deceit “which denies and hides, or extenuates and excuses, this or that favourite sin.” The man called blessed has had transgression, sin, and iniquity. What he does not have is pretence about them, and verse 5 uses the plainest words for that: “mine iniquity have I not hid.” The Savior’s greeting of Nathanael has been set beside the line: “Behold an Israelite indeed, in whom is no guile!” ([[John 1:47]]).
    sources: [oshb-wlc, bdb, delitzsch-psalms, nrsvue]

  - ref: 2
    phrase: imputeth not iniquity
    kind: scripture
    title: Paul quotes David beside Abraham
    body: |
      Paul quotes these two verses in Romans 4 as David’s witness to a blessedness that is reckoned to a person “without works.” He has just cited Genesis: Abraham “believed in the LORD; and he counted it to him for righteousness” ([[Gen. 15:6]]). He goes on, “Even as David also describeth the blessedness of the man, unto whom God imputeth righteousness without works” ([[Rom. 4:6]]), and quotes the psalm: “Blessed is the man to whom the Lord will not impute sin” ([[Rom. 4:8]]). His quotation is plural in its first line, as the Greek psalm is: “Blessed are they whose transgressions are forgiven.”

      The two passages Paul joins share a verb. The Hebrew word for “counted” in Genesis and “imputeth” here is the same, with the sense “impute, reckon.” To Abraham something was reckoned; to David something was not.

      Paul’s question is who may have this blessedness: “Cometh this blessedness then upon the circumcision only, or upon the uncircumcision also?” ([[Rom. 4:9]]).
    sources: [lds-scriptures, bdb, lxx-rahlfs, oshb-wlc]

  - ref: 3
    phrase: When I kept silence
    kind: symbol
    title: What the silence cost him
    body: |
      The silence lasts until David says his sin to God in verse 5, and he describes its cost as a body wearing out under God’s hand. He was not quiet. He was “roaring all the day long,” which a modern translation gives as “groaning.” What he had not yet done is the thing verse 5 reports.

      Three images follow. His bones “waxed old.” A hand lay heavy on him day and night, and he says whose: “thy hand.” And his “moisture” turned to summer drought. The Hebrew word is sap or juice, “my juice (sap, life-moisture) is transformed,” though the line is hard enough that one translation notes “Meaning of Heb uncertain,” and the Greek translators read something else altogether: “I became thoroughly miserable while a thorn was fastened in me.” The psalm does not say whether David was ill or is describing a state of soul.

      Joseph Smith revised these two verses. After the silence he added “my spirit failed within me. When I opened my mouth,” put “speaking” for “roaring,” and made it God’s “spirit” that was heavy and not His “hand.” The revised lines have been read as reflecting “Joseph Smith’s burden of declaring God’s word to so many people.” That is one reading of the change, not a reading of David’s psalm.
    sources: [nrsvue, bdb, lxx-rahlfs, lefevre-jst-psalms]

  - ref: 5
    phrase: mine iniquity have I not hid
    kind: words
    title: He stopped covering, and God covered
    body: |
      The psalm turns in this verse, on the verb of verse 1: “hid” here and “covered” there are the same Hebrew word. In verse 1 it is the man “covered in respect of sin (by God, which he thus puts out of sight)”; here it is David who did not cover or conceal his iniquity. Proverbs uses the verb the same way: “He that covereth his sins shall not prosper: but whoso confesseth and forsaketh them shall have mercy” ([[Prov. 28:13]]).

      The rest of the opening’s vocabulary comes back with it. The King James has all three of its words for sin here, now with “my” and “mine” (in Hebrew the word for “sin” is a slightly different form), and “forgavest” is the verb of “forgiven.” Verse 5 is how the blessing of verse 1 came to be David’s.

      The confession is made to God. The verse has been cited as an example of how penitents “confess to God in prayer,” and of an Old Testament pattern in which “the penitent was encouraged to hold back nothing from the Lord.” Revelation to Joseph Smith says the same of the Lord: “I, the Lord, forgive sins unto those who confess their sins before me and ask forgiveness” ([[D&C 64:7]]).
    sources: [oshb-wlc, bdb, kimball-confession]

  - ref: 6
    phrase: in a time when thou mayest be found
    kind: words
    title: A time of finding
    body: |
      The Hebrew says only “at a time of finding,” and the King James supplies who is found. A modern translation gives the literal words in a note, “Heb at a time of finding only,” and corrects the text to read “at a time of distress.” The King James reading takes the one found to be the LORD, as a standard lexicon also does, and Isaiah uses the verb that way: “Seek ye the LORD while he may be found” ([[Isa. 55:6]]).
    sources: [nrsvue, oshb-wlc, bdb]

  - ref: 8
    phrase: I will instruct thee and teach thee
    kind: words
    title: Who is the teacher?
    body: |
      The speaker of verse 8 is either the LORD, answering David, or David, turning to teach what he has learned; the text does not mark a change, and it has been read both ways. A standard lexicon lists the verb here with the LORD as its subject. On the other side it is argued that if the LORD were speaking, “the person addressed must be the poet, who, however, has already attained the knowledge here treated of,” so that “It is he himself who now directly adopts the tone of the teacher.” On that reading David is keeping the promise of the other psalm of his repentance: “Then will I teach transgressors thy ways” ([[Ps. 51:13]]).

      Either way the verse is where the title’s word is at work (see the note on the title).

      “I will guide thee with mine eye” translates a Hebrew verb meaning “advise, counsel.” A modern translation has “I will counsel you with my eye upon you,” and the Greek “I will fix mine eyes upon thee.” The eye is the teacher’s watchful care, “with sympathising love taking an interest in thee.”
    sources: [bdb, delitzsch-psalms, nrsvue, lxx-rahlfs]

  - ref: 9
    phrase: lest they come near unto thee
    kind: words
    title: The mule that will not come
    body: |
      The last clause may mean the opposite of what the King James suggests: without the bridle the animal will not come, or stay, near. The King James, like the Greek (“lest they should come nigh to thee”), pictures an animal held back from its handler. A modern translation has “else it will not stay near you,” and an older commentary renders “otherwise there is no coming near to thee,” on the ground that the other sense “does not produce any point of comparison corresponding to the context of this Psalm.” That rendering rests on a usage of the Hebrew that its own author calls “without further support,” so neither is certain.

      On either rendering the warning is spoken to more than one hearer (“Be ye not” is plural in the Hebrew), and its sense is that “not constrained, but willing obedience is becoming to man.” On the second rendering the animal has been taken as “the sinner, who will not come to God, although God only is his help, and who, as David has learned by experience, must first of all endure inward torture, before he comes to a right state of mind.” That is one reading.
    sources: [lxx-rahlfs, nrsvue, delitzsch-psalms, oshb-wlc]

  - ref: 10
    phrase: mercy shall compass him about
    kind: words
    title: Mercy on every side
    body: |
      “Compass” is the verb of verse 7, and “mercy” is *hesed*, the covenant love explained at [[Ps. 51:1]]: the psalm’s last promise is that mercy will surround the one who trusts. The verb means to “encompass (with protection).” In verse 7 it was “songs of deliverance” that surrounded David; here it is mercy that surrounds anyone “that trusteth in the LORD.” What happened to him is promised to others.

      *Hesed* has a relative in this psalm. “Godly” in verse 6 is *hasid*, “kind, pious,” a word most often taken to denote the active practice of *hesed*.
    sources: [oshb-wlc, bdb]

christ: |
  Paul’s argument in Romans 4, where he quotes this psalm, ends in Jesus Christ. Righteousness, he says, will be reckoned to those who “believe on him that raised up Jesus our Lord from the dead; Who was delivered for our offences, and was raised again for our justification” ([[Rom. 4:24–25]]). Elsewhere he uses the psalm’s language of not imputing for what God did in His Son: “God was in Christ, reconciling the world unto himself, not imputing their trespasses unto them” ([[2 Cor. 5:19]]).

  In the psalm it is the LORD who forgives, covers, and does not impute, and the LORD to whom David confesses.

explore: |
  - **The other psalm of David’s repentance.** [[Ps. 51]], which an older reading places in the struggle that this psalm looks back on; on that reading its verse 13 promises the teaching that verse 8 here gives.
  - **Paul’s argument.** [[Rom. 4:1–12]], where Abraham and David are the two witnesses.
  - **“Upright in heart.”** The psalm’s last phrase is one of those in the Psalms that have been connected with “Blessed are the pure in heart” ([[Matt. 5:8]]).

parallels:
  - ref: Rom. 4:6–8
    note: Paul quotes verses 1–2 as David’s description of the blessedness of the one to whom God does not impute sin.
  - ref: Prov. 28:13
    note: Covering one’s sins and confessing them, with the Hebrew verb of verses 1 and 5.
  - ref: Ps. 51:13
    note: David’s promise to teach transgressors, which on one reading verse 8 keeps.
  - ref: 2 Cor. 5:19
    note: God in Christ “not imputing their trespasses unto them.”
  - ref: John 1:47
    note: Nathanael, “in whom is no guile.”

