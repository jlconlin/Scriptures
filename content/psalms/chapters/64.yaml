chapter: 64
title: Arrows of Bitter Words
tagline: A man hunted by slander asks God to hide him, describes the plotters who think no one sees, and and then says that God will shoot at them and their own tongue will fall on them.
when: 'Undated; a psalm of David by its title'

setting: |
  By its title the psalm is David’s, and the title names no occasion. “To the chief Musician” is explained under the title of Psalm 8 ([[Ps. 8:1]]). Nothing inside the psalm supplies what the title leaves out. It has no name, no place and no event, and it has been said of it that “it is wanting in any specially defined features and cannot with any certainty be identified with one or other of the two great periods of suffering in the life of David.”

  What the psalm does show is the kind of danger. Nobody in it draws a real sword. The enemies meet in private, sharpen their tongues, and shoot “bitter words” from hiding at a blameless man. The speaker calls his own prayer a complaint (see the note on verse 1).

  The psalm stands in Book Two, where “God” largely takes the place of the divine name ([[Ps. 42:1]]). It says “God” three times, in verses 1, 7 and 9, and the divine name once, in its last verse.

  It is ten verses long. Six of them pass before God does anything, and one sentence, at verse 7, reverses the rest.

thread: |
  The psalm is built on a reversal, and **the reversal is made out of the enemies’ own words.**

  It opens with three requests: hear my voice, preserve my life, hide me (verses 1–2). The speaker asks nothing else in the whole psalm. He never asks God to strike anyone.

  Then comes the complaint, four verses of it (verses 3–6). The enemies whet their tongues like a sword. Their arrows are bitter words. They shoot “in secret,” they shoot “suddenly,” and they “fear not.” They talk over where to hide their snares and ask, “Who shall see them?” Verse 6 ends inside them: the heart “is deep.”

  The turn is at verse 7, “But God.” No change in the speaker’s situation is reported. What follows is a statement about God, and its words have all been used already. They shot; God shoots. They had arrows; God has an arrow. They struck suddenly; they are wounded suddenly. The tongue they sharpened in verse 3 falls on them in verse 8. In the Hebrew these are the same words, repeated (see the note on verse 7).

  After that the psalm widens. It began with one voice and “my life.” It ends with “all that see them,” “all men,” “the righteous,” and “all the upright in heart.” The plotters did not fear (verse 4); now all men do (verse 9). And the righteous take refuge in the LORD (verse 10).

sections:
  - range: 1-2
    heading: Hear, preserve, hide
    plain: |
      God, hear my voice as I make my complaint. Guard my life from dread of the enemy. Hide me from the private council of the wicked and from the crowd of those who do evil.
  - range: 3-6
    heading: The plotters
    plain: |
      They sharpen their tongue like a sword and aim their arrows, which are bitter words, to shoot from hiding at a blameless man. They shoot at him suddenly and are not afraid. They strengthen one another in an evil plan. They talk about hiding snares and say, “Who will see them?” They search out wrongs and carry the search through to the end. The inner thought of each of them, and the heart, is deep.
  - range: 7-9
    heading: But God
    plain: |
      But God will shoot an arrow at them, and suddenly they will be wounded. Their own tongue will come down on them, and everyone who sees them will flee. Then all people will fear. They will tell what God has done and think carefully about His work.
  - range: 10
    heading: The righteous take refuge
    plain: |
      The righteous will be glad in the LORD and take refuge in Him, and all whose hearts are upright will glory.

notes:
  - ref: 1
    phrase: in my prayer
    kind: words
    title: The prayer is a complaint
    body: |
      The word the King James translates “prayer” is a word for a complaint. The Hebrew noun means a “plaint, complaint,” and a modern translation has “Hear my voice, O God, in my complaint.” The grievance itself fills verses 3–6.

      What he asks first is protection from fear. The word behind “fear” is a noun for dread, and the request in the King James, as in the Hebrew, is that his life be kept “from fear of the enemy.” The same modern translation turns the phrase into a description of the man, “the dread enemy.” In the King James wording the first thing he asks to be kept from is the dread itself.

      For the parts a prayer of complaint usually has, see [[Ps. 22:1]].
    sources: [bdb, nrsvue]
  - ref: 2
    phrase: from the insurrection of the workers of iniquity
    kind: words
    title: A private circle and a throng
    body: |
      The two halves of verse 2 name two gatherings, a private circle and a crowd. “Secret counsel” is a word for a council, a “divan or circle of familiar friends,” used in this verse “in bad sense.”

      “Insurrection” suggests an armed revolt, but the Hebrew noun means a “throng.” A modern translation hears plotting in both halves and renders them “the secret plots of the wicked” and “the scheming of evildoers.”

      The speaker asks to be hidden from both.
    sources: [bdb, nrsvue]
  - ref: 3
    phrase: whet their tongue like a sword
    kind: symbol
    title: Weapons made of words
    body: |
      Every weapon in the psalm’s complaint is speech, and the verse says so itself. The sword is the tongue, and the arrows are explained in the same breath: “even bitter words.” A modern translation folds the explanation into the image: “who aim bitter words like arrows.”

      The two weapons are described differently. The sword is whetted, sharpened before it is used. The arrows are shot, and verse 4 says twice how: “in secret,” and “suddenly.”
    sources: [nrsvue]
  - ref: 4
    phrase: the perfect
    kind: words
    title: Perfect means a person of integrity
    body: |
      “The perfect” is a blameless man, a person of integrity. The Hebrew adjective means “complete, morally innocent, having integrity,” and both the ancient Greek translation and a modern English one have “the blameless.” The same word describes Job in the first verse of his book: “that man was perfect and upright” ([[Job 1:1]]).
    sources: [bdb, nrsvue, lxx-rahlfs]
  - ref: 5
    phrase: Who shall see them?
    kind: scripture
    title: The question secrecy asks
    body: |
      The plotters’ question is whether anyone will see, and a modern translation makes it a question about themselves: “Who can see us?” That translation notes that the Hebrew has “them,” which the King James keeps. Its cross-reference for the verse is the wicked man of another psalm, who “hath said in his heart, God hath forgotten: he hideth his face; he will never see it” ([[Ps. 10:11]]). Read beside that verse, the question is a denial that God sees.

      How the Lord answers the question in Restoration scripture is given at the end of the chapter, with [[Alma 37:25]].
    sources: [nrsvue]
  - ref: 6
    phrase: they accomplish a diligent search
    kind: words
    title: A verse read in more than one way
    body: |
      The versions disagree about who is speaking in verse 6. The Hebrew plays on a single root three times in a row, the verb “search out,” the noun “a search,” and “searched.” The King James keeps the repetition in “search out,” “a diligent search.”

      The trouble is the verb between them, which the King James gives as “they accomplish.” “It is doubtful whether” that form is “we” or “they.” If it is “we,” the plotters are still talking, congratulating themselves: “we are ready, a clever stroke is concocted.” A modern translation goes that way and carries their speech from verse 5 through most of this verse: “Who can search out our crimes? We have thought out a cunningly conceived plot.” It marks its first clause as a departure from the Hebrew, which it gives as “They search out crimes.” If the form is “they,” as the King James has it, the poet is describing them. The ancient Greek translators took it so and heard exhaustion in it: “they have wearied themselves with searching diligently.”

      On either reading the verse ends with the same remark: the inward thought and the heart are “deep.” One reading takes it as the poet’s own comment, added with irony after the cleverness he has just described. On that reading the next verse answers it: the heart is deep, “but not too deep for God, who knoweth the heart.”
    sources: [oshb-wlc, delitzsch-psalms, nrsvue, lxx-rahlfs]
  - ref: 7
    phrase: But God shall shoot at them with an arrow
    kind: structure
    title: Their own weapons, turned on them
    body: |
      Verses 7 and 8 answer verses 3 and 4 in the same words, so that the judgment is the plotters’ own attack returned to them. Four Hebrew words come back. The enemies aimed their arrows (verse 3); God shoots an arrow. They “shoot” twice in verse 4; God shoots. They shoot “suddenly”; “suddenly shall they be wounded.” They sharpened “their tongue” (verse 3); “their own tongue” falls on them (verse 8). The King James shows all four. One reading calls what happens “a retribution springing from the malicious craftiness of the enemies” and stresses its suddenness: God “will just as suddenly surprise the enemies of His anointed with their death-blow, as they had plotted it for him.”

      A reader of the cursing psalms may notice what is absent here. The speaker does not ask for any of this. His requests ended at verse 2, and verses 7–9 are statements. (For psalms that do ask, see [[Ps. 5:10]].)

      They are statements of confidence. The King James puts every verb of them in the future. On the same reading the Hebrew verb forms “represent that which is future, with all the certainty of an historical fact,” and the ancient Greek translation puts verse 9 in the past: “and every man was alarmed, and they related the works of God, and understood his deeds.” The psalm never says that the danger has passed.
    sources: [oshb-wlc, delitzsch-psalms, lxx-rahlfs]
  - ref: 8
    phrase: make their own tongue to fall upon themselves
    kind: words
    title: The tongue that brings its owners down
    body: |
      The Hebrew of this line is difficult, but the readings below agree that the plotters are undone by what they said. In the King James “they” make their own tongue fall on themselves. One older commentary thought that wording “an odd fancy” and preferred an unnamed agent: “one overthrows him, inasmuch as their tongue, i.e., the sin of their tongue with which they sought to destroy others, comes upon themselves.” A modern translation makes God the subject, “Because of their tongue he will bring them to ruin,” and records the Hebrew as “They will bring him to ruin, their tongue being against them.”
    sources: [delitzsch-psalms, nrsvue]
  - ref: 9
    phrase: all men shall fear
    kind: words
    title: The fear the plotters lacked
    body: |
      The fear of verse 9 is the fear that was missing in verse 4, and the Hebrew uses the same verb for both. The plotters shot at a blameless man “and fear not.” When God has acted, “all men shall fear.”

      It is a different word from the one the psalm began with. The “fear of the enemy” in verse 1 is a noun for dread, and the speaker asked to be kept from it. The fear of verse 9 comes with seeing what God has done.

      The two verses name two responses. Those who see the plotters’ end in verse 8 recoil: the verb behind “flee away” in verse 8 is used of fleeing “in horror, disgust,” and a modern translation has “all who see them will shake with horror.” In verse 9 all men “declare the work of God,” and they “wisely consider of his doing,” where the verb means to “give attention to, consider, ponder.” The same translation has “and ponder what he has done.”
    sources: [oshb-wlc, bdb, nrsvue]
  - ref: 10
    phrase: glad in the LORD
    kind: words
    title: The name of the LORD, once, at the end
    body: |
      The last verse is the only one in the psalm with the divine name. Verses 1, 7 and 9 say “God,” as most of Book Two does ([[Ps. 42:1]]); here the righteous are glad “in the LORD.”

      “Trust” in this verse is the verb to “seek refuge,” and a modern translation has “take refuge in him.” The word is discussed at [[Ps. 11:1]].
    sources: [oshb-wlc, bdb, nrsvue]

christ: |
  The psalm’s last verse names the One in whom the righteous are glad and take refuge as the LORD. That is the covenant name of the God of Israel, and “Jehovah is the premortal Jesus Christ.”

  The plotters ask, “Who shall see them?” The Church’s edition sets beside that question two passages of Restoration scripture. Alma repeats to his son what God had spoken of those who work in darkness: “I will bring forth out of darkness unto light all their secret works and their abominations” ([[Alma 37:25]]). And in a revelation to Joseph Smith an angel’s trump is to “reveal the secret acts of men, and the thoughts and intents of their hearts” ([[D&C 88:109]]).

explore: |
  - **A mouth that destroys its owner.** “A fool’s mouth is his destruction, and his lips are the snare of his soul” ([[Prov. 18:7]]).
  - **The tongue as a weapon.** [[Ps. 57:4]] and [[Jer. 9:3]], and Jeremiah’s “Their tongue is as an arrow shot out” ([[Jer. 9:8]]). For the tongue as a razor, see [[Ps. 52:2]]; for shooting from hiding, [[Ps. 11:2]].

parallels:
