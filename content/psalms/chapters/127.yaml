chapter: 127
title: Except the LORD Build the House
tagline: Builders, watchmen and early risers work for nothing unless the LORD works too, and what makes a house stand, its children, is something He gives.
when: 'Undated; a song of degrees whose title names Solomon'

setting: |
  Psalm 127 is the eighth of the fifteen songs of degrees (Psalms 120–134), probably the songs of pilgrims on their way up to Jerusalem; the name is explained at [[Ps. 120:1]]. It stands in the middle of the fifteen, and its title names Solomon where four of the others name David.

  No line of it is spoken to God. It teaches, in short sayings, and belongs with the psalms that give “advice on how to successfully live a godly life, similar to the advice found in Proverbs or Ecclesiastes.” It names no occasion and no king.

  The psalm after it speaks of the same things, labour and house and children, and promises them to “every one that feareth the LORD” ([[Ps. 128:1]]).

  In the latter days the third verse is quoted in “The Family: A Proclamation to the World,” where it speaks of what husband and wife owe their children.

thread: |
  Psalm 127 looks like **two sayings set side by side, and it is one**. The first two verses say “vain” three times: of the builders, of the watchman, of people who rise early and sit up late. The last three are about children. The turn is the word “Lo” at verse 3.

  What joins the halves is the house. In verse 1 it is a thing men labour on, beside a city a watchman guards. Verses 3–5 speak of a household, and the psalm ends at the city again, with a father and his sons “in the gate.”

  The second thing that joins them is giving. What verses 1–2 call vain is human effort alone: the builders build and the watchman stays awake, and it is for nothing only “except the LORD” builds and keeps. An earlier song of degrees says of Him, “he that keepeth Israel shall neither slumber nor sleep” ([[Ps. 121:4]]). Verse 2 ends with rest, and with the psalm’s first verb of giving: “he giveth his beloved sleep.” Verse 3 then names what is given. Children are “an heritage” and a “reward,” and it is through them, gifts from God, that the Lord establishes the household.

sections:
  - range: 1-2
    heading: Except the LORD build the house
    plain: |
      Unless the LORD builds the house, the men who build it work for nothing. Unless the LORD guards the city, the watchman keeps watch for nothing. It is useless for you to get up early and stay up late, eating bread won by anxious toil; He gives His beloved sleep.
  - range: 3-5
    heading: An heritage of the LORD
    plain: |
      See: children are an inheritance from the LORD, and the fruit of the womb is a reward from Him. The children of a man’s youth are like arrows in a warrior’s hand. Happy is the man whose quiver is full of them. They will not be put to shame when they speak with their enemies in the gate.

notes:
  - ref: 0
    phrase: for Solomon
    kind: history
    title: Why the title names Solomon
    body: |
      The title ties this song to Solomon, and one older reading finds the reason in two things: one word in verse 2, and the psalm’s form. Whether the words mean “for Solomon” or “of Solomon” is the question asked of the same words at [[Ps. 72:1]]; a modern translation has “Of Solomon” here. The old Greek translation heads the psalm only “A Song of Degrees,” without the name.

      The word is “his beloved.” When Solomon was born “the LORD loved him” ([[2 Sam. 12:24]]), and Nathan “called his name Jedidiah, because of the LORD” ([[2 Sam. 12:25]]). Jedidiah means “beloved of Yah,” and the first half of the name is the Hebrew word translated “his beloved” in verse 2. On that reading the name was put in the title because verse 2 was heard as “an allusion to the name Jedidiah” and to the night at Gibeon, when “the LORD appeared to Solomon in a dream by night: and God said, Ask what I shall give thee” ([[1 Kgs. 3:5]]). Solomon received his gift asleep.

      The form is the other reason. The psalm is a string of sayings like those of the book that opens “The proverbs of Solomon the son of David, king of Israel” ([[Prov. 1:1]]), and the same reading calls it “the unfolding of the proverb” that says, “The blessing of the LORD, it maketh rich, and he addeth no sorrow with it” ([[Prov. 10:22]]).
    sources: [lds-scriptures, nrsvue, lxx-rahlfs, bdb, delitzsch-psalms]

  - ref: 1
    phrase: Except the LORD build the house
    kind: scripture
    title: A house is a building and a family
    body: |
      “House” in scripture is both a building and the family that lives in it, and the psalm moves from the one to the other. To build a house can mean to raise a family. The elders at the gate of Bethlehem bless Ruth to be like Rachel and Leah, “which two did build the house of Israel” ([[Ruth 4:11]]).

      The promise to David uses both meanings. David wants to build the LORD a house. The answer comes through Nathan: “the LORD telleth thee that he will make thee an house” ([[2 Sam. 7:11]]), and David repeats it in his prayer, “I will build thee an house” ([[2 Sam. 7:27]]). The house David is promised is his posterity and his kingdom, and a son of his is the one who “shall build an house for my name” ([[2 Sam. 7:13]]).

      In the psalm the house of verse 1 has workmen and stands beside a city with a watchman, and verses 3–5 speak only of children. It is through them that the Lord establishes a household able to protect the community.

      Elder Gordon B. Hinckley, then of the Twelve, took the verse of a home. He repeated it to those who “dream of marriage and the establishment of a home,” and went on to name “four cornerstones upon which to build that house.”
    sources: [lds-scriptures, scripture-helps-ps-102, hinckley-except-lord]

  - ref: 2
    phrase: for so he giveth his beloved sleep
    kind: words
    title: Sleep given, or gifts given in sleep
    body: |
      The last line of verse 2 can be read two ways: sleep is the gift, or the gift comes during sleep. As the King James has it, sleep is the gift. The ancient Greek translation agrees, “he gives sleep to his beloved,” and so does a modern translation. That translation also notes the other way to take the Hebrew: “he provides for his beloved during sleep.” Read so, what the anxious chase from dawn until late comes to the LORD’s beloved while they rest.

      Either way the line answers the people of the first half of the verse, who “eat the bread of sorrows.” The phrase is “the bread of anxious toil” in a modern translation: bread that costs worry to get.

      What the psalm calls vain is reliance on human effort alone, not work. The psalm that follows promises the one who fears the LORD, “thou shalt eat the labour of thine hands: happy shalt thou be” ([[Ps. 128:2]]).
    sources: [nrsvue, lxx-rahlfs, scripture-helps-ps-102, lds-scriptures]

  - ref: 3
    phrase: children are an heritage of the LORD
    kind: scripture
    title: Children are what the LORD gives
    body: |
      “Of the LORD” and “his reward” mean from Him: children are something the LORD gives. A modern translation has “Sons are indeed a heritage from the Lord” for the first line and “the fruit of the womb a reward” for the second, and the word behind “heritage” is the word for an inheritance.

      This is how the patriarchs speak of their families. When Rachel demands children of Jacob he answers, “Am I in God’s stead, who hath withheld from thee the fruit of the womb?” ([[Gen. 30:2]]). When Esau asks who is with him, he says, “The children which God hath graciously given thy servant” ([[Gen. 33:5]]).

      The Hebrew word for “children” in this verse is the word for sons, and the modern translation keeps it.
    sources: [lds-scriptures, nrsvue, biblehub-interlinear]

  - ref: 5
    phrase: they shall speak with the enemies in the gate
    kind: history
    title: The gate was where a town heard its cases
    body: |
      The gate of a town was where its elders sat and its disputes were settled, and it is there that the father of verse 5 meets his enemies. Boaz “went up to the gate, and sat him down there” to settle the matter of Ruth before the elders ([[Ruth 4:1]]). The law sends a family’s case to “the elders of his city, and unto the gate of his place” ([[Deut. 21:19]]).

      A man could be wronged there. A proverb warns, “neither oppress the afflicted in the gate” ([[Prov. 22:22]]), and Eliphaz says of the foolish man’s children, “they are crushed in the gate, neither is there any to deliver them” ([[Job 5:4]]).

      The father of the psalm has sons beside him. The arrows of verse 4 are “the sons of one’s youth” in a modern translation, and in the ancient world many children were seen as a sign of strength. With his quiver full, he is not put to shame.
    sources: [lds-scriptures, nrsvue, scripture-helps-ps-102]

christ: |
  The LORD who builds the house and keeps the city is Jehovah, who came to earth as Jesus Christ; the name is explained at [[Ps. 110:1]]. The psalm says three things of Him: that building and watching come to nothing unless He builds and keeps, that He gives to His beloved, and that children are His heritage and His reward.

explore: |
  - **The companion psalm.** [[Ps. 128]], on the labour, the table and the children of the one who fears the LORD.
  - **Two houses in one promise.** [[2 Sam. 7:1–29]], where David offers to build and is told what the LORD will build.
  - **The keeper who does not sleep.** [[Ps. 121:3–4]].
  - **Solomon’s gift in the night.** [[1 Kgs. 3:5–15]], the dream at Gibeon.
  - **A house that is a people.** [[Heb. 3:3–6]], where Christ is “a son over his own house; whose house are we.”

parallels:
  - ref: 2 Sam. 7:11
    note: The LORD tells David that He will make him a house, meaning his posterity and kingdom.
  - ref: 2 Sam. 12:25
    note: Solomon is named Jedidiah; “his beloved” in verse 2 is the first half of that name.
  - ref: Ps. 121:4
    note: The keeper of Israel neither slumbers nor sleeps; verse 1 says the watchman wakes in vain without Him.
  - ref: Ps. 128:2–3
    note: The next psalm promises labour that feeds and children round the table to the one who fears the LORD.
  - ref: Ruth 4:11
    note: Rachel and Leah “did build the house of Israel”; the blessing is spoken in the gate.
  - ref: Gen. 33:5
    note: Jacob calls his children those “which God hath graciously given.”
  - ref: Heb. 3:6
    note: Christ is a son over His own house, “whose house are we.”

