chapter: 4
title: In Peace I Will Lie Down
tagline: Shamed by people who love lies, the psalmist asks for the light of the LORD’s face, tells his detractors to be silent on their beds, and lies down on his own to sleep.
when: 'Undated; a psalm of David by its title'

setting: |
  The title ascribes the psalm to David and names no occasion.

  It stands beside Psalm 3 and is read with it. The two are alike “in many ways,” and that likeness “may be why they were placed in proximity to each other.” The speaker of Psalm 3 has woken after a night’s sleep ([[Ps. 3:5]]). This one is about to lie down, so that if Psalm 3 is a prayer for the morning, “Psalm 4 could be seen as an evening prayer for protection.” Both psalms report what other people are saying, and in Hebrew they introduce it with the same two words: “Many there be which say” ([[Ps. 3:2]]) and “There be many that say” (verse 6).

  The psalm says little about the trouble itself. The speaker has been in distress before and was brought out of it (verse 1). Some people are turning his “glory into shame” and running after lies (verse 2), and many are asking whether any good is coming (verse 6). The psalm does not say who they are.

  Verse 6 prays in the words of the blessing that Aaron and his sons spoke over Israel ([[Num. 6:24–26]]), and verse 4, as the ancient Greek translation worded it, has the words of Paul’s sentence to the Ephesians ([[Eph. 4:26]]).

thread: |
  The psalm speaks in three directions. Verse 1 is said to God. Verses 2–5 turn and address the “sons of men.” Verses 6–8 turn back to the LORD. **The prayer that opens by asking to be heard ends in sleep, and in the middle of the psalm the speaker tells other people that the LORD will hear him.**

  The opening verse holds a plea and a memory together. He calls on the “God of my righteousness” (in a modern translation, “O God of my right”), and between “Hear me” and “hear my prayer” he sets what God has already done: “thou hast enlarged me when I was in distress.”

  Then he faces his detractors. “How long?” is asked twice (verse 2), and it is followed by “But know” (verse 3): the LORD has set apart the godly man for Himself, and “the LORD will hear when I call unto him.” The request of verse 1 has become a statement. A string of commands follows: tremble and do not sin, speak in your own hearts on your beds and be silent, offer right sacrifices, trust the LORD (verses 4–5).

  The last turn begins with what many are saying, “Who will shew us any good?” The prayer that follows is the priests’ blessing turned into a request, “upon us” (verse 6); the verse does not mark whether the many are still speaking or the psalmist prays it with them. Then he says what he already has: more gladness in his heart than in the time of their full harvest (verse 7), and peace in which to lie down and sleep (verse 8). The men of verse 4 were sent to their beds to be silent. The psalm ends with its speaker on his.

sections:
  - range: 1
    heading: Hear me, as before
    plain: |
      Answer me when I call, God of my right. When I was hemmed in, You made room for me. Be gracious to me and hear my prayer.
  - range: 2-5
    heading: To those who shame him
    plain: |
      You people, how long will you turn my honor into disgrace? How long will you love what is empty and go looking for lies? Know this: the LORD has marked out the one who is faithful to Him as His own, and the LORD will hear when I call to Him. Tremble, and do not sin. Speak in your own hearts on your beds, and be silent. Offer right sacrifices, and put your trust in the LORD.
  - range: 6-8
    heading: The light of His face, and sleep
    plain: |
      Many are saying, “Who will show us anything good?” LORD, lift up the light of Your face upon us. You have put more gladness in my heart than in the time when their grain and their wine are plentiful. In peace I will both lie down and sleep, for You alone, LORD, make me live in safety.

notes:
  - ref: 0
    phrase: on Neginoth
    kind: words
    title: Neginoth, a psalm for strings
    body: |
      The psalm was to be sung to stringed instruments. Neginoth is the plural of a Hebrew word for “music (of stringed instrument),” and it is found “especially” in the titles of psalms: this one, then Psalms 6, 54, 55, 67 and 76, and once outside the book, at the end of Habakkuk’s prayer ([[Hab. 3:19]]). Psalm 61 has the singular, Neginah. Psalms so titled “were to be accompanied by stringed instruments,” and a modern translation prints this title as “To the leader: with stringed instruments.”

      The title is also addressed “To the chief Musician,” the one who directed the singing. That phrase is explained under the title of Psalm 8 ([[Ps. 8:1]]), and what a psalm’s title is, and what it is worth as evidence, under the title of Psalm 3 ([[Ps. 3:1]]).
    sources: [bdb, bd-psalms, nrsvue, lds-scriptures]
  - ref: 1
    phrase: thou hast enlarged me when I was in distress
    kind: words
    title: Room in a tight place
    body: |
      “Enlarged” and “distress” are a pair in Hebrew: the first is a verb of width and the second a noun of narrowness. The verb means to “be, or grow, wide, large,” and in the form used here to “make large” or to “enlarge” a territory; done for a person, as in this verse, it is a figure “of deliverance.” The noun is “straits, distress,” and the adjective spelled the same way means “narrow, tight.” The ancient Greek translation kept the picture, “thou hast made room for me in tribulation,” and so does a modern one: “You gave me room when I was in distress.”

      In the King James the line stands in the past tense between two requests, “Hear me” and “hear my prayer.”
    sources: [bdb, lxx-rahlfs, nrsvue]
  - ref: 2
    phrase: seek after leasing
    kind: words
    title: Leasing is lying
    body: |
      “Leasing” is an old English word for lies. A dictionary of 1828 defines it as “Falsehood; lies” and already marks it “Obsolete or nearly so.” The Hebrew noun behind it means a “lie, falsehood, deceptive thing,” and a modern translation has “seek after lies.” The psalm does not say what the lies were.
    sources: [webster-1828, bdb, nrsvue]
  - ref: 3
    phrase: the LORD hath set apart him that is godly for himself
    kind: words
    title: The godly man, and the difference the LORD makes
    body: |
      The speaker answers his detractors that the LORD has set the godly person apart as His own. “Him that is godly” is one Hebrew word, *hasid*, built on *hesed*, the word explained at [[Ps. 51:1]]. It means “kind, pious,” and on the usual view describes a person “as denoting active practice of” that kindness; as a noun it is “a pious man, the godly.” A modern translation has “the faithful.”

      “Set apart” is a verb for making a distinction. With the LORD as its subject it is to “make separate,” and it is the verb of the plagues in Egypt: “that ye may know how that the LORD doth put a difference between the Egyptians and Israel” ([[Ex. 11:7]]).

      The wording of this line is not certain. The Hebrew may once have read differently, “hath made wonderful (his) kindness to me,” and the ancient Greek translation has something close to that: “the Lord has done wondrous things for his holy one.” Either way the verse goes on to the same assurance: “the LORD will hear when I call unto him.”
    sources: [bdb, nrsvue, oshb-wlc]
  - ref: 4
    phrase: Stand in awe, and sin not
    kind: scripture
    title: Tremble, or be angry, and do not sin
    body: |
      The King James’s “Stand in awe” translates a verb that means to shake, and the old translations disagree about what kind of shaking is meant. The Hebrew verb is to “be agitated, quiver, quake, be excited, perturbed,” and this verse is listed among its uses of people “in fear, awe,” which is the King James’s choice. The ancient Greek translation chose anger: “Be ye angry, and sin not.” A modern translation leaves it open with “When you are disturbed, do not sin,” and puts “are angry” in the margin.

      Paul’s sentence to the Ephesians has the Greek psalm’s words, and the two have long been compared: “Be ye angry, and sin not: let not the sun go down upon your wrath” ([[Eph. 4:26]]). The Joseph Smith Translation of Paul’s sentence makes it a question: “Can ye be angry, and not sin?”

      The rest of the verse says what to do with the agitation, whichever it is. “Commune with your own heart” uses the same verb as “say” in verse 6, and the Greek has “what ye say in your hearts.” “Be still” is to “be silent.” The speaking is to be done inwardly, on their beds, and then to stop.
    sources: [bdb, lxx-rahlfs, nrsvue, delitzsch-psalms, lds-scriptures, oshb-wlc]
  - ref: 5
    phrase: Offer the sacrifices of righteousness
    kind: history
    title: Right sacrifices
    body: |
      On one older reading, the command is to bring real offerings in a right state and is not a figure for good deeds in place of offerings. That reading takes the phrase to mean “sacrifices offered with a right mind, conformed to the will of God,” against a “hypocritical mind,” and a modern translation has simply “Offer right sacrifices.”

      The reading leans on two other places where the same phrase stands. Moses says of Zebulun and Issachar that “there they shall offer sacrifices of righteousness” ([[Deut. 33:19]]). Psalm 51 ends, “Then shalt thou be pleased with the sacrifices of righteousness, with burnt offering and whole burnt offering” ([[Ps. 51:19]]), where the offerings on the altar are named. In both, on this reading, the phrase means “real sacrifices, not merely symbols of moral acts.”

      The Hebrew word for “righteousness” here is the one in verse 1, where the speaker calls on the “God of my righteousness.”
    sources: [delitzsch-psalms, nrsvue, oshb-wlc, lds-scriptures]
  - ref: 6
    phrase: lift thou up the light of thy countenance upon us
    kind: scripture
    title: The priests’ blessing, prayed back
    body: |
      The prayer of verse 6 is made from the words of the priestly blessing. Aaron and his sons were to say over Israel, “The LORD make his face shine upon thee, and be gracious unto thee: The LORD lift up his countenance upon thee, and give thee peace” ([[Num. 6:25–26]]). The psalm folds the two lines into one request: the shining of the first, the lifting up and the countenance of the second. As the Hebrew text is parsed, the verb “lift up” and the noun are the blessing’s own, and “face” and “countenance” are one word. The blessing’s importance in Israel “can be seen through the many biblical passages that borrow from its language, especially in mentions of the Lord lifting up the light of His countenance.”

      The blessing has been tied to the temple, where, on one account of its ancient worship, “when the Lord appeared, He would ‘lift up’ the light of His countenance and His face would ‘shine’ upon the people.” That account is a reconstruction; the wording shared with Numbers is in the text.

      In the blessing a priest speaks and the people are “thee.” In the psalm the prayer is for “us,” and the verse does not mark who prays it. In the King James the prayer follows the question of the many without a break. A modern translation closes its quotation marks only after the prayer, so that the many say both lines, and makes the first a wish: “O that we might see some good!”
    sources: [lds-scriptures, oshb-wlc, sc-knowhy-212, sc-knowhy-437]
  - ref: 8
    phrase: for thou, LORD, only makest me dwell in safety
    kind: words
    title: Alone, and safe
    body: |
      “Only” here means “alone,” and the line can be heard two ways. The King James attaches the word to the LORD, as a modern translation does: “for you alone, O LORD, make me lie down in safety.” The Hebrew word is a noun for “isolation, separation,” used “especially with verbs of dwelling” and as a figure “of freedom from attack, security.” Read that way it is the sleeper who is alone: “makest me dwell solitarily, in safety.” Moses’s blessing uses the word so: “Israel then shall dwell in safety alone” ([[Deut. 33:28]]). On either reading the safety is the LORD’s doing.

      One reading of the psalm as an evening prayer hears the command of verse 4, with its bed, as the Lord’s reply to the psalmist, who then “is reassured” and lies down; in the psalm’s own sequence verse 4 stands among the commands addressed to the “sons of men” (verses 2–5).
    sources: [bdb, nrsvue, ot-minute-psalms-1-20]

christ: |
  The psalm asks the LORD to lift up the light of His countenance on His people. The Book of Mormon records a day when that light was seen. As the Nephite disciples prayed, “Jesus blessed them as they did pray unto him; and his countenance did smile upon them, and the light of his countenance did shine upon them” ([[3 Ne. 19:25]]).

  That verse “follows much of Numbers 6:25–26 very closely,” and it has been read as “Jesus’ performance of the Priestly Blessing.” The words Aaron’s sons pronounced over Israel, and that this psalm turns into a prayer, are said there of the Savior’s own face, as the disciples saw it.

explore: |
  - **Morning and evening.** Read Psalms 3 and 4 as a pair: [[Ps. 3:1–8]] wakes, and this psalm lies down. Notice what “many” are saying in each ([[Ps. 3:2]]; verse 6) and how each is answered.
  - **The shining face in other psalms.** The words of the priestly blessing return in [[Ps. 31:16]], [[Ps. 67:1]] and [[Ps. 80:3]].
  - **Paul’s use of verse 4.** Read [[Eph. 4:25–27]] for what Paul sets around the line.

parallels:
  - ref: Num. 6:24–26
    note: The priestly blessing, whose words verse 6 turns into a prayer.
  - ref: 3 Ne. 19:25
    note: Jesus blesses the praying disciples, and the light of His countenance shines on them.
  - ref: Eph. 4:26
    note: Paul’s sentence has the words of the Greek translation of verse 4, “Be ye angry, and sin not.”
  - ref: Ps. 3:5
    note: The morning beside this evening; the psalm before this one wakes from the sleep this one lies down to.
  - ref: Deut. 33:28
    note: Israel dwelling “in safety alone,” with the Hebrew word behind “only” in verse 8.

