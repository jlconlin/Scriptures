chapter: 101
title: A King’s Vow
tagline: A king sings of mercy and justice to the LORD and vows what he will be in his own heart, whom he will keep in his house, and how he will judge in the city of the LORD.
when: 'Undated; a psalm of David by its title'

setting: |
  The title ascribes the psalm to David and names no occasion. The speaker is plainly a king. He has a house with servants in it, he can call the faithful of the land to live with him, and he can cut the wicked off from a city. The psalm is counted among the royal psalms, the songs of Israel’s king (see [[Ps. 2:2]]).

  The psalms just before it in Book Four (Psalms 90–106) sing the reign of the LORD Himself: “The LORD reigneth” opens Psalms 93, 97 and 99 ([[Ps. 93:1]]). One older reading takes a line from them as this psalm’s motto: “thou executest judgment and righteousness in Jacob” ([[Ps. 99:4]]). After those psalms a human king speaks. In Book Four only this psalm and Psalm 103 carry David’s name in their titles.

  The psalm has been placed, with Psalms 15, 24 and 68, at “the removal of the Ark to Jerusalem,” when David brought the ark up from the house of Obed-edom to his own city ([[2 Sam. 6:12]]). That is a judgment about a psalm that names no event, and it is given as probable. The note on verse 2 takes up the one line of the psalm that seems to ask for it.

thread: |
  Nearly every line of the psalm is a vow, and the vows move outward. **The king begins with his own heart and ends at the gates of the city, and one unanswered question to the LORD stands near the beginning.**

  Verse 1 is the only verse about singing. The king will sing “of mercy and judgment,” and he will sing to the LORD. Then the vows begin with himself (verses 2–4). He will keep to “a perfect way,” and the first place he names for it is “within my house.” He speaks of his eyes and his heart: no wicked thing before the one, no frowardness in the other.

  In the middle of verse 2 he stops and asks, “O when wilt thou come unto me?” Nothing in the psalm answers him, and the vows resume.

  From verse 5 the vows turn to other people: his household, the land, and at last the city. He will silence the secret slanderer and will not put up with the proud. His eyes, which refused the wicked thing in verse 3, look for “the faithful of the land” in verse 6, and the liar of verse 7 may not stay “in my sight.” What he vowed for himself he requires of his servants in the same words: the one who “walketh in a perfect way” shall serve him. Verse 8 reaches the whole land and ends by saying whose city it is. It is not his. It is “the city of the LORD.”

sections:
  - range: 1
    heading: The song
    plain: |
      I will sing of mercy and of justice. To You, LORD, I will make music.
  - range: 2-4
    heading: What the king vows for himself
    plain: |
      I will give careful thought to the way of integrity. When will You come to me? Inside my own house I will live with a whole heart. I will not set anything base before my eyes. I hate what those who turn aside do, and it will not cling to me. A perverse heart will be far from me, and I will have nothing to do with a wicked person.
  - range: 5-8
    heading: Whom he will keep, and whom he will cut off
    plain: |
      Whoever slanders a neighbor in secret, I will cut off. A haughty look and a proud heart I will not put up with. My eyes are on the faithful of the land, so that they may live with me; the one who walks in the way of integrity will serve me. No one who practices deceit will live in my house, and no one who tells lies will stay in my sight. Morning by morning I will destroy all the wicked of the land, to cut off every evildoer from the city of the LORD.

notes:
  - ref: 2
    phrase: O when wilt thou come unto me?
    kind: history
    title: The one question among the vows
    body: |
      In the middle of the vows stands a question to the LORD, and it has been read as David’s longing for the ark to come to Jerusalem. The ancient Greek translation reads it as the King James does: “When wilt thou come to me?” A modern translation takes it differently, as a question about the blameless way of the line before: “When shall I attain it?”

      As the King James has it, the question sounds like something David said. When Uzzah died beside the ark, “David was afraid of the LORD that day, and said, How shall the ark of the LORD come to me?” ([[2 Sam. 6:9]]). He left the ark three months in the house of Obed-edom and brought it up to the city of David only after he heard that the LORD had blessed that house ([[2 Sam. 6:11–12]]).

      The psalm has accordingly been placed at the bringing of the ark, as “probably composed” then. One older reading is more exact and sets it in those three months. On that reading David’s fearful question about the ark has become a longing for the LORD to come, and the vows are his resolve “to give earnest heed to the sanctity of his walk, of his rule, and of his house” before the LORD arrives. It also explains the psalm’s last words: once the LORD has come to David, Jerusalem is “the city of the LORD.”

      All this is reconstruction, since the psalm names no occasion.
    sources: [lxx-rahlfs, nrsvue, lds-scriptures, bd-david, delitzsch-psalms]
  - ref: 2
    phrase: with a perfect heart
    kind: words
    title: Perfect means whole, not sinless
    body: |
      “Perfect” in this psalm means integrity. It does not claim sinlessness. The Hebrew word in “a perfect way” (verses 2 and 6) means “sound, wholesome, unimpaired, innocent, having integrity,” and the phrase behind “a perfect heart” is “integrity of mind.” A modern translation has “the way that is blameless” and “integrity of heart.” The first word is the “uprightly” of [[Ps. 15:2]], where it has its own note.

      The King James itself translates the second phrase as “integrity” where scripture says it of David. The LORD tells Solomon to walk “as David thy father walked, in integrity of heart, and in uprightness” ([[1 Kgs. 9:4]]), and another psalm says that David shepherded Israel “according to the integrity of his heart” ([[Ps. 78:72]]). The same two Hebrew words stand behind all three. So the thing the king vows here is the thing scripture later credits to David.

      Scripture also records the exception. David “turned not aside from any thing that he commanded him all the days of his life, save only in the matter of Uriah the Hittite” ([[1 Kgs. 15:5]]).
    sources: [bdb, nrsvue, lds-scriptures]
  - ref: 6
    phrase: that they may dwell with me
    kind: scripture
    title: The king’s house and the LORD’s holy hill
    body: |
      The king asks of those who would live in his house what Psalm 15 asks of those who would live on the LORD’s hill. That psalm begins, “LORD, who shall abide in thy tabernacle? who shall dwell in thy holy hill? He that walketh uprightly, and worketh righteousness, and speaketh the truth in his heart. He that backbiteth not with his tongue” ([[Ps. 15:1–3]]).

      Three of those lines have a counterpart here. The one who “walketh in a perfect way” shall serve the king, and “uprightly” there is the same Hebrew word as “perfect” here. The one who tells lies shall not dwell in his house (verse 7). The one who slanders a neighbour in secret is cut off (verse 5). The two psalms have been assigned to the same occasion, the bringing of the ark to Jerusalem (see the note on verse 2).

      The question at the gate of the LORD’s hill is taken up at [[Ps. 24:3]].
    sources: [lds-scriptures, bdb, bd-david]
  - ref: 8
    phrase: I will early destroy
    kind: history
    title: Morning by morning, the king as judge
    body: |
      “Early” is “morning by morning,” and the verse describes a king’s standing work as judge. The Hebrew is a plural, “every morning afresh,” and in this verse it comes to “almost = continually.” A modern translation has “Morning by morning I will destroy all the wicked in the land.”

      The verse is to be compared with the charge the LORD gave the royal house through Jeremiah: “O house of David, thus saith the LORD; Execute judgment in the morning, and deliver him that is spoiled out of the hand of the oppressor” ([[Jer. 21:12]]). Judging was the king’s office. Of David’s reign it is written, “David executed judgment and justice unto all his people” ([[2 Sam. 8:15]]).
    sources: [bdb, nrsvue, lds-scriptures]

christ: |
  Psalm 101 is one of the royal psalms, which “for Christian readers often reflected the royal life and reign of the Messiah.” David’s reign came to be regarded as “the type of the more glorious age to which the nation looked forward when Messiah should come,” the age of which Isaiah says, “And in mercy shall the throne be established: and he shall sit upon it in truth in the tabernacle of David, judging, and seeking judgment” ([[Isa. 16:5]]).

  The LORD to whom the king sings, whose coming he asks for and whose city he keeps, is Jehovah, and “Jehovah is the premortal Jesus Christ.”
explore: |
  - **The ark comes to the city of David.** Read [[2 Sam. 6:1–19]], and then the other psalms assigned to that occasion: [[Ps. 15:1–5]], [[Ps. 24:1–10]] and Psalm 68.
  - **David on just rule.** His last words, [[2 Sam. 23:1–5]], beside the charge to his house in [[Jer. 22:1–5]].
  - **The King to come.** “A King shall reign and prosper, and shall execute judgment and justice in the earth” ([[Jer. 23:5]]).

parallels:
  - ref: 2 Sam. 6:9–12
    note: David asks how the ark shall come to him, and after three months brings it to his city.
  - ref: Ps. 15:1–3
    note: Who may dwell on the LORD’s hill, in the terms this king uses for his own house.
  - ref: 1 Kgs. 9:4
    note: The LORD says that David walked in integrity of heart, the phrase of verse 2.
  - ref: Jer. 21:12
    note: The house of David is charged to execute judgment in the morning.
  - ref: Isa. 16:5
    note: A throne established in mercy, and one judging on it in the tabernacle of David.

