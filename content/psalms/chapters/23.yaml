chapter: 23
title: The LORD Is My Shepherd
tagline: A king who once kept sheep speaks as one of the flock, and when the valley darkens he stops talking about his shepherd and talks to Him.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  The title is only “A Psalm of David.” It names no occasion, and the psalm itself names no event. (What a title is and what it is worth is said at [[Ps. 3:1]].) One older reading places the psalm in David’s flight from Absalom; it is given at verse 5, as one reading.

  David kept sheep before he kept Israel. He told Saul, “Thy servant kept his father’s sheep” ([[1 Sam. 17:34]]), and a later psalm says the Lord “took him from the sheepfolds” ([[Ps. 78:70]]). The speaker knows the work from the shepherd’s side, and here he speaks as one of the flock. He was not the first to do so. Jacob, a shepherd himself, blessed Joseph’s sons by “the God which fed me all my life long unto this day” ([[Gen. 48:15]]), and “fed” there is the Hebrew verb for shepherding, the word behind “my shepherd” here.

  In Book One the psalm stands between two very different neighbors. Psalm 22 begins, “My God, my God, why hast thou forsaken me?” ([[Ps. 22:1]]), and Psalm 24 asks, “Who shall ascend into the hill of the LORD?” ([[Ps. 24:3]]). The image returns in later scripture: the prophets promise that the Lord will shepherd His people Himself ([[Isa. 40:11]]; [[Ezek. 34:11]]), and Jesus says, “I am the good shepherd” ([[John 10:11]]).

thread: |
  Psalm 23 asks for nothing. It has been grouped with the psalms of lament or prayer, many of which describe a trial, plead for help, and end in confidence. This psalm has the confidence without the rest: there is no complaint in it and no request. **What moves in it is not the psalmist’s situation but whom he is speaking to.**

  Verses 1–3 talk *about* the Lord: “he maketh me,” “he leadeth me,” “he restoreth.” The scene is pasture and water, and nearly every verb is the shepherd’s. Verse 4 brings the valley, and the grammar changes with the light: “for thou art with me.” From there through verse 5 the psalmist speaks *to* the Lord. The trouble has not been removed. The valley is still there in verse 4 and the enemies are still there in verse 5. What has changed is that the shepherd is near enough to address.

  A second change comes at verse 5. The shepherd gives way to a host, and the sheep to a guest with a table, oil, and a full cup. Verse 6 returns to speaking about the Lord, and the journey that began in a field ends in a house. The one who was led now stays.

  So the psalm goes from being provided for, to being accompanied, to being welcomed, to being home. The center is the short sentence in verse 4, and the last word is not the pasture but “the house of the LORD.”

sections:
  - range: 1-3
    heading: He leads me
    plain: |
      The Lord is my shepherd; I lack nothing. He has me lie down in green pastures and leads me to waters where I can rest. He brings my life back. He leads me along the right tracks, for the sake of His own name.
  - range: 4
    heading: Thou art with me
    plain: |
      Even when I walk through the darkest valley, I fear no harm, because You are with me. Your rod and Your staff comfort me.
  - range: 5-6
    heading: A table and a house
    plain: |
      You lay a table for me while my enemies look on. You pour oil on my head, and my cup is full to overflowing. Only goodness and mercy will pursue me all the days of my life, and I will live in the house of the Lord for the length of my days.

notes:
  - ref: 1
    phrase: The LORD
    kind: christ
    title: Jehovah is the shepherd, and Jesus took the name
    body: |
      The shepherd of this psalm is Jehovah by name, and Jesus claimed the title for Himself. “The LORD” in capitals stands for the divine name (see [[Ps. 110:1]] for LORD and Lord), and it is the psalm’s first word: Jehovah is my shepherd.

      So when Jesus said in Jerusalem, “I am the good shepherd, and know my sheep, and am known of mine” ([[John 10:14]]), He was saying more than that He was kind. He was making an identification: He and Jehovah were “the same being, the same Shepherd.” His words have been read as “an open announcement by Jesus that He was Jehovah, the Messiah, the King of Israel,” which helps explain why some who heard Him answered, “He hath a devil, and is mad” ([[John 10:20]]).

      Restoration scripture uses the name the same way. The Lord says in this dispensation, “I am the good shepherd, and the stone of Israel” ([[D&C 50:44]]), and Alma tells Zarahemla that “the good shepherd doth call you; yea, and in his own name he doth call you, which is the name of Christ” ([[Alma 5:38]]).
    sources: [pike-shepherd, oshb-wlc]

  - ref: 1
    phrase: my shepherd
    kind: symbol
    title: Shepherd was a king’s title
    body: |
      To call someone a shepherd in David’s world was to call him a ruler. As earthly representatives of their gods, “ancient Near Eastern kings were often described as shepherds of the people they ruled,” and they used the title “to illustrate their divine sanction to rule, their ability to provide and care for their subjects, and their power to protect their people from enemies.” Hebrew does the same: its verb for shepherding is used of ruling a people as a flock. The image is tender, and it is also a statement about who governs.

      The verb is the one the Lord used of David himself: “Thou shalt feed my people Israel” ([[2 Sam. 5:2]]). In the psalm that bears his name, the man appointed to shepherd Israel takes the sheep’s place and says “my shepherd.”
    sources: [pike-shepherd, bdb]

  - ref: 1
    phrase: I shall not want
    kind: words
    title: Want means lack
    body: |
      “Want” here means lack, not desire: with this shepherd I shall not go without. The Hebrew verb means to lack or be in want, and the Greek translation has “I shall want nothing.” Moses uses the same verb to sum up the wilderness years: “these forty years the LORD thy God hath been with thee; thou hast lacked nothing” ([[Deut. 2:7]]).
    sources: [bdb, lxx-rahlfs, oshb-wlc]

  - ref: 2
    phrase: the still waters
    kind: words
    title: Waters of rest
    body: |
      The Hebrew is “waters of rest.” The noun means rest or quietness, and also a resting-place; the Greek translation has “the water of rest.” It is the word for the rest the wilderness generation forfeited, when the Lord swore “that they should not enter into my rest” ([[Ps. 95:11]]).

      “Leadeth” is exact as well. Shepherds in ancient Israel “led their flocks, rather than driving their flocks from behind,” and this verse is one of the passages that show it. The sheep reaches the water by following someone who has gone ahead.
    sources: [bdb, nrsvue, lxx-rahlfs, pike-shepherd]

  - ref: 3
    phrase: He restoreth my soul
    kind: words
    title: Brought back to life
    body: |
      “Restoreth” is a form of the common Hebrew verb for turning back or returning, and the picture is of something brought back. In this form it means to “restore, refresh.” For “soul” a modern translation gives “life” in its margin: he brings my life back.

      The same root may sound again in the psalm’s last line; see the note on verse 6.
    sources: [bdb, nrsvue, oshb-wlc]

  - ref: 3
    phrase: the paths of righteousness for his name’s sake
    kind: words
    title: Right tracks, for the shepherd’s own name
    body: |
      The “paths” are tracks, and “righteousness” says they are the right ones; the reason given for the leading is in the shepherd and not in the sheep. The Hebrew noun means a track, and is used also of a “course of action, or life,” and in this verse of a good and right one. A modern translation has simply “right paths.” For a sheep the right track is the one that arrives. For the psalmist it is also a way of living, and the Hebrew does not make him choose.

      “For his name’s sake” says why. On one reading, the name is what the Lord has shown Himself to be: He “has revealed Himself as the gracious One, and as such He will prove and glorify Himself” in the need of the one who follows His leading.

      Nephi and Alma have the phrase. Nephi hoped his brothers “would walk in the paths of righteousness” ([[1 Ne. 16:5]]), and Alma told the people of Gideon, “I perceive that ye are in the paths of righteousness” ([[Alma 7:19]]). Both have been counted among the Book of Mormon’s allusions to the Psalms, in a count that says of all such finds that “uncovering allusions is a difficult and subjective endeavor.”
    sources: [bdb, nrsvue, delitzsch-psalms, hilton-psalms-bom]

  - ref: 4
    phrase: the valley of the shadow of death
    kind: words
    title: Death’s shadow, or deep darkness
    body: |
      The translations differ here because one Hebrew word can be read two ways. As the text is vocalized it is probably a compound, “death-shadow,” which is how the Greek translation usually renders it and what the King James has. Most modern scholars read the same consonants as a single word meaning “darkness, deep darkness,” which gives “the darkest valley,” with the older rendering kept in the margin.

      Either way the word is wider than dying. Its sense in this verse is the figurative one “of extreme danger.” Elsewhere the same word describes the world of the dead: Job speaks of going to “the land of darkness and the shadow of death” ([[Job 10:21]]).
    sources: [bdb, lxx-rahlfs, nrsvue]

  - ref: 4
    phrase: for thou art with me
    kind: structure
    title: From he to thou at the center
    body: |
      At these words the psalmist stops speaking about the Lord and begins speaking to Him. In verses 1–3 the Lord is “he.” Here, for the first time, the pronoun is “thou,” and it stays through verse 5: “thy rod,” “thou preparest,” “thou anointest.” Verse 6 goes back to “the LORD.”

      The change comes exactly where the danger does. In green pastures the sheep can describe its shepherd to others. In the dark valley it speaks to him. Nothing in the verse says the valley grew lighter; the stated reason for not fearing is company, not rescue.

      The sentence also sits at the middle of the poem. In the Hebrew text, setting aside the two words of the title, twenty-six words come before “for thou art with me” and twenty-six after. Whether the poet counted, the text does not say.
    sources: [oshb-wlc]

  - ref: 5
    phrase: Thou preparest a table before me in the presence of mine enemies
    kind: symbol
    title: The shepherd becomes a host
    body: |
      In verse 5 the picture changes from a flock to a feast: the Lord is now a host, and the psalmist a guest at His table. The enemies are not destroyed or driven off. They are present, and on one reading they “must look quietly on” while the guest is served. The Greek translation calls them “them that afflict me.”

      One older reading ties the table to a particular day. When David fled from Absalom and crossed the Jordan with his people, three men brought beds, basins, wheat, barley, flour, and beans to his camp ([[2 Sam. 17:27–28]]), “for they said, The people is hungry, and weary, and thirsty, in the wilderness” ([[2 Sam. 17:29]]). On that reading the table is “an abundance of daily bread” arriving while the enemy was still in the field. The psalm’s title does not say so, and the line does not need the occasion to be understood.
    sources: [delitzsch-psalms, lxx-rahlfs]

  - ref: 5
    phrase: thou anointest my head with oil
    kind: words
    title: A guest’s anointing, not a king’s
    body: |
      This is the oil of a feast, poured on a guest at the table, not the oil that makes a king. The Hebrew verb is not the one used for consecration. It means to “make fat,” and so to anoint richly, a “symbol of festivity and joy.” The consecrating verb is another, *mashach*, to anoint “as consecration, solemn setting apart to an office,” and it is the verb the Psalms use of the king: “with my holy oil have I anointed him” ([[Ps. 89:20]]). (For “his anointed,” see [[Ps. 2:2]].)

      So David, who had been anointed king ([[1 Sam. 16:13]]), does not speak here of his office. He speaks of being made welcome.
    sources: [bdb, oshb-wlc]

  - ref: 6
    phrase: Surely goodness and mercy shall follow me
    kind: words
    title: Pursued by goodness
    body: |
      “Follow” is too mild: the Hebrew verb means to pursue, to chase. Elsewhere in the Psalms it is what enemies do: “save me from all them that persecute me” ([[Ps. 7:1]]); “deliver me from the hand of mine enemies, and from them that persecute me” ([[Ps. 31:15]]). Here it is used “in good sense,” to “attend closely upon.”

      The choice of word answers verse 5. There the enemies were in view. Here the only things on the psalmist’s heels are goodness and mercy; on one reading, “Foes are now pursuing him, but prosperity and favour alone shall pursue him.” The opening word supports that: “Surely” can also be translated “Only.”

      “Mercy” is *hesed*, explained at [[Ps. 51:1]].
    sources: [bdb, oshb-wlc, delitzsch-psalms, nrsvue]

  - ref: 6
    phrase: I will dwell in the house of the LORD for ever
    kind: words
    title: Dwell or return, and for how long
    body: |
      Two words in the psalm’s last line are less settled in Hebrew than in English: “dwell,” and “for ever.”

      **Dwell.** The Greek translation has “my dwelling shall be in the house of the Lord,” and the King James agrees. But the Hebrew verb as it is written looks like a form of “return,” the root behind “restoreth” in verse 3. One reading keeps both: he will return and, “having returned, dwell in the house of Jahve.” If so, the psalm ends with a homecoming.

      **For ever.** The Hebrew is “for length of days,” and it stands parallel to “all the days of my life” in the first half of the verse. A modern translation has “my whole life long,” and the Greek “for a very long time.” Read strictly, the psalmist’s hope is to live out his days in the Lord’s house, the same hope as “that I may dwell in the house of the LORD all the days of my life” ([[Ps. 27:4]]). The King James “for ever” reaches further than the Hebrew words do.

      The “house of the LORD” is the sanctuary. What it meant to come there is told at [[Ps. 24:3]].
    sources: [delitzsch-psalms, lxx-rahlfs, oshb-wlc, nrsvue, bdb]

christ: |
  The psalm’s shepherd is Jehovah, and Jesus took the title to Himself: “I am the good shepherd: the good shepherd giveth his life for the sheep” ([[John 10:11]]). What that claim meant is in the note on verse 1. The apostles kept the name, calling Him “that great shepherd of the sheep” ([[Heb. 13:20]]) and “the Shepherd and Bishop of your souls” ([[1 Pet. 2:25]]). Nephi says of the Holy One of Israel that “he shall feed his sheep, and in him they shall find pasture” ([[1 Ne. 22:25]]).

  In John’s vision the shepherd is the Lamb. Of those who have come out of great tribulation he writes, “the Lamb which is in the midst of the throne shall feed them, and shall lead them unto living fountains of waters” ([[Rev. 7:17]]). “Feed” there is the Greek verb to shepherd, and the leading to water is the picture of this psalm’s second verse.

explore: |
  - **The Good Shepherd in His own words.** [[John 10:1–18]] and [[John 10:27–29]], where the sheep hear His voice and no one plucks them from His hand.
  - **The Lord as shepherd in the prophets.** [[Ezek. 34:11–16]], where the Lord says He will search for His sheep Himself, and [One Shepherd](/ezekiel/themes/one-shepherd/), which follows the image through Ezekiel; also [[Isa. 40:11]].
  - **Alma on whose sheep we are.** [[Alma 5:37–41]] and [[Alma 5:57–60]].
  - **The house at the end of the psalm.** [[Ps. 27:4–6]], which asks for the same dwelling, and Psalm 24, which asks who may enter it.
  - **The psalm as it is sung.** “The Lord Is My Shepherd” (*Hymns*, no. 108) puts the psalm into verse, from its first line to the valley.
  - **The shepherd as king.** “Jesus, the Great Shepherd-King,” a Religious Studies Center study, sets out the royal and divine meaning of the title from the ancient Near East to John 10 and Revelation 7.

parallels:
  - ref: John 10:11–14
    note: Jesus calls Himself the good shepherd, who knows His sheep and gives His life for them.
  - ref: Rev. 7:15–17
    note: The Lamb shepherds those who serve in God’s temple and leads them to living fountains of waters.
  - ref: Ezek. 34:11–15
    note: The Lord promises to search out His sheep Himself, feed them in good pasture, and make them lie down.
  - ref: 1 Ne. 22:25
    note: The Holy One of Israel gathers and feeds His sheep, “and in him they shall find pasture.”

