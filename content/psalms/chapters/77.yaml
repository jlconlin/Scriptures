chapter: 77
title: Hath God Forgotten to Be Gracious?
tagline: A sleepless man asks six times whether God’s favour has ended, then stops searching himself and recites what God did at the sea, and the psalm ends there.
when: 'By its title, a psalm of Asaph; no occasion is given'

setting: |
  Psalm 77 stands in the third of the Psalter’s five books (Psalms 73–89), among the psalms under Asaph’s name. Neither the title nor the psalm gives an occasion, an enemy or an event.

  One voice speaks, an “I” who cannot sleep. Yet what he asks is whether God has cast off for ever, and the comfort he reaches for is the nation’s oldest memory, the crossing of the sea. For that reason his trouble has been read as “an affliction shared in company with the whole of his people,” though “it remains obscure what kind of national affliction it is.”

  The psalm has the address and the complaint of a lament (the form is set out at [[Ps. 22:1]]), and it lacks two of a lament’s usual parts, the petition and the vow of praise. From the first verse to the last it asks God for nothing.

  Its second half is a hymn on the Exodus that uses words of the song Israel sang at the sea ([[Ex. 15:11–13]]), and the same storm at the sea is in Habakkuk’s prayer ([[Hab. 3:10–15]]). The heading in the Church’s edition gives the psalm two movements: the righteous cry to the Lord, and they remember His wonders of old.

thread: |
  Psalm 77 is about **remembering**, and it turns on what is remembered. In the first half the psalmist remembers God and groans (verse 3). He remembers his own song in the night (verse 6) and thinks over the days of old (verse 5), and the result is six questions, each asking in a different way whether God’s favour has ended (verses 7–9).

  The turn is verse 10, a line whose Hebrew can be read in two ways (see its note). After it the verbs of the first half come back with new objects: “I will remember the works of the LORD,” “thy wonders of old,” “thy doings.” He stops examining his own spirit and begins to recite what God did.

  From there the psalm changes its grammar. Verses 1–12 are full of “I” and “my.” After verse 12 the psalmist does not say “I” again; verses 13–20 speak to God as “thou” throughout. The psalm that opened with “my voice,” twice in one verse, comes to “the voice of thy thunder.”

  It ends on the far side of the sea, with a people led like a flock. The six questions get no reply in words, and the night of verse 2 is never said to be over. What the psalmist has at the end is the memory of a God whose way went through the sea and whose “footsteps are not known.”

sections:
  - range: 1-3
    heading: A cry in the night
    plain: |
      I cry aloud to God; I cry aloud to God, and He gives ear to me. In the day of my trouble I seek the Lord. All night my hand is stretched out and does not tire; my soul refuses to be comforted. I remember God, and I moan; I muse, and my spirit grows faint.
  - range: 4-6
    heading: Sleepless, searching his own heart
    plain: |
      You keep my eyelids from closing. I am so troubled that I cannot speak. I think over the days of old, the years long past. I remember my song in the night; I muse with my own heart, and my spirit searches.
  - range: 7-9
    heading: Six questions
    plain: |
      Will the Lord cast off for ever, and never again show favour? Has His mercy ceased for ever? Has His promise failed for evermore? Has God forgotten to be gracious? Has He in anger shut up His compassion?
  - range: 10-12
    heading: I will remember
    plain: |
      And I said, This is my sickness; but I will remember the years of the right hand of the Most High. I will remember the deeds of the LORD; yes, I will remember Your wonders of old. I will meditate on all Your work and muse on Your doings.
  - range: 13-15
    heading: Who is so great a God?
    plain: |
      Your way, O God, is holy. Who is so great a God as our God? You are the God who does wonders; You have made Your strength known among the peoples. With Your arm You redeemed Your people, the sons of Jacob and Joseph.
  - range: 16-20
    heading: Thy way is in the sea
    plain: |
      The waters saw You, O God; the waters saw You and writhed, and the depths trembled. The clouds poured out water, the skies gave voice, and Your arrows went abroad. The voice of Your thunder was in the whirlwind; lightning lit the world; the earth trembled and shook. Your way was in the sea and Your path in the great waters, and Your footprints were not known. You led Your people like a flock by the hand of Moses and Aaron.

notes:
  - ref: 0
    phrase: to Jeduthun
    kind: history
    title: The names in the title
    body: |
      Each term of the title is explained where it first appears in the book: Jeduthun at [[Ps. 39:1]], Asaph at [[Ps. 50:1]], and “To the chief Musician” at [[Ps. 8:1]]. Where the King James has “to Jeduthun,” a modern translation prints the title as “To the leader: according to Jeduthun. Of Asaph. A Psalm.”
    sources: [lds-scriptures, nrsvue]

  - ref: 1
    phrase: and he gave ear unto me
    kind: words
    title: Heard already, or asking to be heard
    body: |
      The King James has the psalmist heard before his complaint begins, and the clause is also translated as the purpose of his cry. A modern translation has “aloud to God, that he may hear me.” The ancient Greek translation agrees with the King James: “and he gave heed to me.”

      The choice changes how the first half reads. With the King James, the hearing comes first and the verses after it are told as past: “I sought,” “I remembered.” With the other rendering the cry is still going up, and nothing in verses 1–9 says that it has been heard. On either reading the psalm quotes no answer from God.
    sources: [nrsvue, lxx-rahlfs]

  - ref: 2
    phrase: my sore ran in the night, and ceased not
    kind: words
    title: A hand stretched out all night
    body: |
      The Hebrew has a hand where the King James has “my sore,” and the picture is of a man praying, not of a wound. The noun is the one the King James translates “hand” in verse 20. The verb is glossed for this verse as “be stretched out,” with a question mark after it, so the sense is likely and not certain. A modern translation has “in the night my hand is stretched out without wearying,” and the ancient Greek translation also has hands: “even with my hands by night before him.”
    sources: [bdb, nrsvue, lxx-rahlfs, oshb-wlc]

  - ref: 3
    phrase: I remembered God, and was troubled
    kind: structure
    title: Remembering, before the turn and after
    body: |
      The psalmist does the same two things on both sides of the psalm’s turn, remembering and musing, and what changes is what he remembers. One Hebrew verb for “remember” stands in verses 3 and 6 and twice in verse 11. A second verb is “complained” in verse 3, “commune” in verse 6 and “talk” in verse 12; its senses are “muse, complain, in poetry talk (of).”

      In the first half the objects are God Himself and the psalmist’s own past. “I remembered God,” and he “was troubled,” a verb for a low sound (“murmur”) that a modern translation renders “I think of God, and I moan.” He remembers “my song in the night,” and his spirit begins to search. Of his sleeplessness he says to God, “You keep my eyelids from closing.”

      In verses 11–12 the objects are deeds: “the works of the LORD,” “thy wonders of old,” “all thy work,” “thy doings.” “Of old” there is the same Hebrew phrase as “of old” in verse 5. The psalm does not say in so many words why the thought of God made him groan; what follows the remembering of the first half is the six questions of verses 7–9.
    sources: [oshb-wlc, bdb, nrsvue]

  - ref: 9
    phrase: Hath God forgotten to be gracious?
    kind: scripture
    title: Words shared with Exodus 34:6
    body: |
      Several words of the questions in verses 8–9 are words the LORD used of Himself at Sinai. There He proclaimed His name to Moses: “The LORD, The LORD God, merciful and gracious, longsuffering, and abundant in goodness and truth” ([[Ex. 34:6]]).

      “Goodness” there and “mercy” in verse 8 are one Hebrew noun, *hesed* (explained at [[Ps. 51:1]]). The King James has “gracious” in both places. “Merciful” there is an adjective meaning “compassionate,” used “always of God,” and what the psalmist fears God has shut up is “his compassion.” The Hebrew noun for anger that stands inside “longsuffering” there is the “anger” of verse 9. The psalm does not quote that verse, and the text does not say whether the psalmist had it in mind; the words are shared.

      The questions are left standing. He does not answer them yes or no.
    sources: [lds-scriptures, oshb-wlc, bdb]

  - ref: 10
    phrase: This is my infirmity
    kind: words
    title: The hinge verse and its two readings
    body: |
      Verse 10 is where the psalm turns, and its Hebrew is read in two ways: with the King James, as the resolve to remember the years of God’s right hand, or as a last complaint that His right hand has changed. The line has six Hebrew words and none of them is “I will remember”: the King James and the translations that read with it supply those words.

      Two of the six carry the doubt. “My infirmity” is read either as “my sickness” or, from another root, as “my piercing, my wound.” The other word is spelled exactly as “years” is in verse 5, and the same letters are also a form of the verb for changing. Both are on record: “years,” with the King James, and “the right hand of the Highest is changed.” A modern translation takes the second, “that the right hand of the Most High has changed,” and so did the ancient Greek translators: “this is the change of the right hand of the Most High.”

      On the King James reading the psalmist calls this his own infirmity and sets against it the years of God’s right hand. On the other, his grief is that the right hand of the Most High is not what it was. On either reading the next line is the same: “I will remember the works of the LORD.”
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs]

  - ref: 14
    phrase: Thou art the God that doest wonders
    kind: scripture
    title: The hymn uses the words of the song at the sea
    body: |
      What the psalmist remembers is the Exodus, and several of his words are those of the song Israel sang on the far shore. Moses’ song asks, “Who is like unto thee, O LORD, among the gods? who is like thee, glorious in holiness, fearful in praises, doing wonders?” ([[Ex. 15:11]]). Verse 13 gives the question back, “who is so great a God as our God?”, and verses 13–14 repeat two of the song’s phrases in the same Hebrew: “doing wonders,” and the phrase the King James translates “in holiness” there and “in the sanctuary” here.

      On one reading that verse of the song is “the primary passage” behind this one, and verse 13 therefore says “in holiness” and not “in the sanctuary.” A modern translation agrees: “Your way, O God, is holy.”

      The song continues, “Thou in thy mercy hast led forth the people which thou hast redeemed” ([[Ex. 15:13]]), and speaks of “the greatness of thine arm” ([[Ex. 15:16]]). The psalm has the same two Hebrew verbs, “redeemed” in verse 15 and “leddest” in verse 20, and the arm. “Mercy” in that line of the song is *hesed*, the word of the psalmist’s question in verse 8.
    sources: [lds-scriptures, oshb-wlc, delitzsch-psalms, nrsvue]

  - ref: 15
    phrase: the sons of Jacob and Joseph
    kind: history
    title: Joseph, a name the psalms of Asaph use
    body: |
      The psalm does not say why Joseph’s name stands here beside Jacob’s for the people; in the Psalms the name is used this way only in psalms of Asaph. Five verses in the Psalms name Joseph. One is about the man himself, “who was sold for a servant” ([[Ps. 105:17]]). The other four are in psalms whose titles name Asaph: this verse, [[Ps. 78:67]], [[Ps. 80:1]] and [[Ps. 81:5]].

      Psalm 78 sets “the tabernacle of Joseph” beside “the tribe of Ephraim,” and Psalm 80 has the image this psalm ends on: “thou that leadest Joseph like a flock” ([[Ps. 80:1]]).
    sources: [lds-scriptures]

  - ref: 16
    phrase: The waters saw thee, O God
    kind: symbol
    title: The sea sees God, and a storm
    body: |
      The crossing is told as a storm in which the sea itself sees God and is seized with pain. “Afraid” is a verb for twisting or writhing “in pain, especially childbirth”; in one older commentary the waters “fell as it were into pangs of travail.” Then come “lines taken from the picture of a thunder-storm”: rain, thunder in the skies, and God’s “arrows,” which “are the lightnings.” Where the King James has the thunder “in the heaven,” the Hebrew word is read “whirlwind”; whether it means the whirlwind or the rolling of the thunder is “open to question,” with the usage of the language “in favour of the latter,” the whirlwind. On this reading the storm shows “how all the powers of nature became the servants” of the Lord when He delivered Israel.

      The “sound” the skies send out in verse 17 and “the voice of thy thunder” in verse 18 are one Hebrew word, and it is the word for “my voice” in verse 1.

      Habakkuk’s prayer has the scene in nearly the same terms. “The mountains saw thee, and they trembled” ([[Hab. 3:10]]) uses the verb that is “afraid” here; the arrows are there ([[Hab. 3:11]]); and so is the way through the water: “Thou didst walk through the sea with thine horses, through the heap of great waters” ([[Hab. 3:15]]). Which poem drew on the other has been argued both ways. One older commentator holds the psalm to be the earlier, so that “Where our Psalm leaves off, Habakkuk 3 goes on.”
    sources: [bdb, delitzsch-psalms, oshb-wlc, lds-scriptures]

  - ref: 19
    phrase: thy footsteps are not known
    kind: symbol
    title: No footprints, and no return to the complaint
    body: |
      The hymn ends on a God who acted without being seen, and the psalm never goes back to the psalmist’s night. “Footsteps” is the word for a heel and so for a footprint, and the clause is rendered “thy footprints were not known (the waters closing over them).” God’s way went through the sea and nothing was left to show where He had walked: “His person and His working were invisible, but the result which attested His active presence was visible.” The psalm’s last verse is the people, led “like a flock by the hand of Moses and Aaron.”

      “Thy way” stands twice in the hymn, in verse 13 and here, and it is one Hebrew word. The first says what God’s way is like and the second where it went.

      Then the psalm stops. The six questions have had no reply. He has not said that his trouble is over, and he makes no vow of praise, one of a lament’s usual parts ([[Ps. 22:1]]). Some have judged the psalm damaged or unfinished for that reason. Another reading is that “it is the Asaphic manner thus to close with an historical picture,” and that the old redemption “is to him a prophecy of the future lying behind the afflictive years of the present.”
    sources: [bdb, delitzsch-psalms, oshb-wlc, sc-knowhy-438]

christ: |
  The psalm’s hymn is addressed to the God who redeemed Israel with His arm and led them like a flock, and “Jehovah is the premortal Jesus Christ.” Paul names Christ in the same story. He reminds the Corinthians “how that all our fathers were under the cloud, and all passed through the sea” ([[1 Cor. 10:1]]), and says of the Rock they drank from in the wilderness, “that Rock was Christ” ([[1 Cor. 10:4]]).

  The psalm’s last image is a people led like a flock. Jesus said of Himself, “I am the good shepherd, and know my sheep, and am known of mine” ([[John 10:14]]).

explore: |
  - **The song at the sea.** [[Ex. 15:1–18]], the song whose words the hymn of verses 13–20 uses.
  - **Habakkuk’s prayer.** [[Hab. 3]], with the same storm, and with a request this psalm never makes: “in wrath remember mercy” ([[Hab. 3:2]]).
  - **The same memory in Isaiah.** [[Isa. 63:11–14]], where the question is “Where is he that brought them up out of the sea with the shepherd of his flock?” ([[Isa. 63:11]]).
  - **The flock in a later psalm of Asaph.** “Give ear, O Shepherd of Israel, thou that leadest Joseph like a flock” ([[Ps. 80:1]]).
  - **Alma on the same deliverance.** He tells his son he will praise God for ever, “for he has brought our fathers out of Egypt, and he has swallowed up the Egyptians in the Red Sea” ([[Alma 36:28]]).

parallels:
  - ref: Ex. 15:11
    note: Moses’ song asks who is like the LORD, “glorious in holiness … doing wonders,” the words of verses 13–14.
  - ref: Ex. 15:13
    note: The song has the leading and the redeeming of verses 15 and 20.
  - ref: Hab. 3:10–15
    note: Habakkuk’s prayer has the waters, the arrows and the way through the sea.
  - ref: Isa. 63:11–12
    note: Isaiah remembers the sea, the shepherd of the flock and the hand of Moses.
  - ref: Ps. 80:1
    note: Another psalm of Asaph addresses the Shepherd who leads Joseph like a flock.

