chapter: 19
title: The Heavens Declare
tagline: The sky tells God’s glory without a word, the law of the LORD tells His will, and the man who has heard both asks to be cleared of the faults he cannot see.
when: 'Undated; a psalm of David by its title'

setting: |
  The title ascribes the psalm to David and addresses it to the chief Musician (see the note on [[Ps. 8:1]]). It names no occasion.

  The psalm has been called a wisdom hymn, with language at times like that of Proverbs (its second half more than its first), and it falls into two parts: praise of God as Creator (verses 1–6) and praise of God as Lawgiver (verses 7–14). One older reading supposes that it was called forth by the sky by day, as Psalm 8 was by the sky at night, and so that it is a morning psalm, the psalmist glad of the daylight and making ready for the day’s work. That is a supposition; the psalm does not say.

  It stands beside Psalm 18, David’s song of deliverance, and shares words with it. The title of Psalm 18 calls David the LORD’s servant, and here he twice calls himself “thy servant”; both psalms call on the LORD as “my rock” in the Hebrew. Those points of contact have been offered as the reason a collector set the two together, one psalm on what God showed in David’s life and the next on what He shows in the sky and in the law.

  Paul quotes verse 4 in [[Rom. 10:18]].

thread: |
  Psalm 19 has three movements, and each is smaller in scale and closer to the speaker than the one before: the sky, the law, and one man’s heart.

  It begins with speech that has no speaker. The heavens “declare,” each day hands the message to the next, and the sun runs from one end of heaven to the other. God is named once in these six verses, by the name *El*, and nobody is addressed. The last line about the sun is that “there is nothing hid from the heat thereof.”

  **The first turn is at verse 7, and nothing announces it.** With no “and” or “but,” the subject is the law, and the name of God changes: “the LORD,” the divine name, comes six times in three verses. The lines also change shape. Each names the law and says what it is, and in verses 7–8 what it does to a person. On one reading the second half is there because the first cannot do its work: the heavens tell that God is glorious, but not what He asks.

  **The second turn is at verse 11, where the psalmist first speaks to God**: “thy servant.” The law he has praised has shown him himself. He cannot see all his own errors (verse 12), and the word for the faults that are “secret” comes from the same Hebrew verb as what could not be “hid” from the sun. So he asks for two things, to be cleared of what he doesn’t know and to be kept back from what is presumptuous (see the note on verse 13).

  The psalm that began with the heavens’ speech ends with a man’s: “the words of my mouth.” He offers them to the LORD by a seventh and last use of the name, with two titles added, “my strength, and my redeemer.”

sections:
  - range: 1-6
    heading: What the heavens say
    plain: |
      The heavens are telling the glory of God, and the sky shows what His hands have made. Each day pours out speech to the next, and each night passes knowledge on to the next. There is no speech and there are no words; no voice of theirs is heard (the King James takes the line differently: see the note on verse 3). Yet their voice (the King James has “line”) goes out through all the earth, and their words to the end of the world. In the heavens He has pitched a tent for the sun. It comes out like a bridegroom from his chamber and, like a strong man, is glad to run its course. It rises at one end of the heavens and circles to the other, and nothing is hidden from its heat.
  - range: 7-10
    heading: What the law of the LORD does
    plain: |
      The LORD’s law is perfect; it restores the soul. The LORD’s testimony is sure; it makes the simple wise. The LORD’s precepts are right; they gladden the heart. The LORD’s commandment is pure; it gives light to the eyes. The fear of the LORD is clean; it stands forever. The LORD’s judgments are true, and all of them are just. They are more to be desired than gold, than much fine gold, and sweeter than honey dripping from the comb.
  - range: 11-14
    heading: The servant’s prayer
    plain: |
      By them Your servant is warned, and there is great reward in keeping them. But who can see his own errors? Clear me of the faults that are hidden from me. Hold Your servant back, too, from presumptuous sins (or, as the Hebrew may mean, from presumptuous men), and do not let them rule over me. Then I will be blameless, and innocent of great transgression. Let the words of my mouth and the meditation of my heart be acceptable before You, LORD, my rock and my redeemer.

notes:
  - ref: 1
    phrase: The heavens declare the glory of God
    kind: scripture
    title: Creation as a witness of God
    body: |
      The psalm’s opening claim, that the sky testifies of its Maker, is made again in the Book of Mormon. Alma answers Korihor’s demand for a sign with it: “all things denote there is a God; yea, even the earth, and all things that are upon the face of it, yea, and its motion, yea, and also all the planets which move in their regular form do witness that there is a Supreme Creator” ([[Alma 30:44]]). The awe of the psalm’s first half has been said to “recall the reasoning” of that testimony.

      A revelation to Joseph Smith has been set beside the verse. After describing the sun, the moon and the stars giving their light, it says that “any man who hath seen any or the least of these hath seen God moving in his majesty and power” ([[D&C 88:47]]). An astronaut who had looked down on the earth from space told a general conference that this verse of the psalm and that verse of the revelation came into his mind together.

      Two details of the Hebrew matter. “Declare” is a participle, which a modern translation renders “The heavens are telling”: the telling is going on, and verse 2 has it pass from day to day and from night to night. And the name for God here is *El*; the divine name waits until verse 7 (see the note there). For the firmament, see the note on [[Gen. 1:6]].
    sources: [lds-scriptures, ot-minute-psalms-1-20, lind-heavens-declare, oshb-wlc, nrsvue]
  - ref: 3
    phrase: where their voice is not heard
    kind: words
    title: Speech in every language, or speech without sound
    body: |
      Verse 3 can mean that the heavens are understood in every language, as the King James has it, or that they speak without making any sound. The Hebrew has no word for “where.” The line ends with three words: “without,” “heard,” “their voice.”

      The King James joins those words to what goes before: there is no speech or language in which the heavens’ voice goes unheard. The ancient Greek translation reads the same way, “There are no speeches or words, in which their voices are not heard.” Taken so, the line says that the message needs no translating.

      A modern translation makes the line a statement of its own, “their voice is not heard;” and has to begin verse 4 with a word the Hebrew does not have, “yet their voice goes out through all the earth.” Taken so, the line is a paradox: day speaks to day and night to night (verse 2), and not a sound is made.

      Both renderings come from the same three Hebrew words, and the translations divide between them.
    sources: [oshb-wlc, lxx-rahlfs, nrsvue]
  - ref: 4
    phrase: Their line
    kind: scripture
    title: Line or sound, and Paul’s quotation
    body: |
      “Line” is what the Hebrew text says, but the ancient Greek translation has “voice,” and Paul quotes the verse with “sound.” The Hebrew word is the cord a builder or surveyor stretches, a “measuring-line.” Read so, the line of the heavens has been run out over the whole earth, a figure “of their domain.”

      The Greek reads, “Their voice is gone out into all the earth, and their words to the ends of the world,” which makes the two halves of the line say one thing. In Hebrew “their line” and “their voice” (the last word of verse 3) differ by a single consonant, and it has been proposed that the text should “probably” be read “their sound.” That is a judgment and not a certainty. The Hebrew as it stands says “line.”

      Paul uses the verse to answer his own question about hearing. Faith comes by hearing the word of God, he says, and then: “But I say, Have they not heard? Yes verily, their sound went into all the earth, and their words unto the ends of the world” ([[Rom. 10:18]]). In the psalm “their” means the heavens.
    sources: [bdb, lxx-rahlfs, oshb-wlc, lds-scriptures]
  - ref: 5
    phrase: as a bridegroom coming out of his chamber
    kind: symbol
    title: The sun as bridegroom and runner
    body: |
      The sun is pictured as a bridegroom and then as a runner, two figures of gladness and strength. Its place in the heavens is a “tabernacle,” a tent, that God has set for it (verse 4).

      The “chamber” is a bride-chamber, a word that means at root “a canopy,” and a modern translation has “wedding canopy.” On one reading the comparison is to how morning looks: “The morning light has in it a freshness and cheerfulness, as it were a renewed youth.” Then the figure changes to a “strong man” (the Greek has “giant”) who is glad of the race, because the sun “marches on its way ever anew, light-giving and triumphant.”

      Verse 6 gives its reach, from one end of heaven to the other, and closes on its “heat.” The Hebrew word is the “heat of sun,” and it has been explained as “the enlightening and warming influence of the sun.”
    sources: [delitzsch-psalms, nrsvue, lxx-rahlfs, bdb]
  - ref: 7
    phrase: The law of the LORD is perfect
    kind: structure
    title: From the sun to the law
    body: |
      At verse 7 the psalm changes its subject from the sun to the law with no connecting word, and the name of God changes with it. In verses 1–6 God is named once, as *El*. In verses 7–14 He is the LORD, the divine name, seven times. The psalm has been read as two hymns in one, “a hymn of praise to God as Creator (verses 1–6) and a hymn of praise to God as Lawgiver (verses 7–14).”

      One reading finds the reason for the second half in what the first cannot do: “the heavens indeed tell of the glory of God, but not of His will.” The sky can say that God is glorious. What He asks has to be said in words.

      One word of the second half has been tied to the sun. The commandment is “pure,” a word that also means “clear,” and it has been glossed as “clear, like the light of the sun”; it is “enlightening the eyes.”

      Six names stand for the one subject: law, testimony, statutes, commandment, fear, judgments. The first “does not in itself mean the law, but a pointing out, instruction, doctrine or teaching.” The fifth, the fear of the LORD, is on the same reading “not the fear of God as an act performed, but as a precept,” the reverence that God’s revelation “demands, effects, and maintains.”
    sources: [oshb-wlc, delitzsch-psalms, ot-minute-psalms-1-20, bdb]
  - ref: 7
    phrase: converting the soul
    kind: words
    title: Converting the soul means restoring it
    body: |
      “Converting the soul” means bringing the soul back, restoring or refreshing it, and not a change of religion. The Hebrew is a form of the verb to “turn back, return,” which with “soul” as its object means to “refresh.” A modern translation has “reviving the soul.” The same verb stands behind “He restoreth my soul” ([[Ps. 23:3]]).

      Each line of verses 7–8 pairs a quality of the law with something it does to a person. It is “perfect,” in the sense of “sound, wholesome, unimpaired,” and it restores. It is sure, and it makes wise “the simple.” The Hebrew word for the simple possibly means “open-minded”: one “open to the instruction of wisdom or folly.” The Greek translators wrote “babes.” It is right, and gladdens the heart; it is pure, and gives light to the eyes.
    sources: [bdb, nrsvue, oshb-wlc, lxx-rahlfs]
  - ref: 12
    phrase: cleanse thou me from secret faults
    kind: words
    title: Faults hidden from the one who commits them
    body: |
      The “secret faults” are errors the psalmist cannot see in himself, not sins he is concealing from others. The question before the plea says so: “Who can understand his errors?” The Hebrew noun means “error.” “Secret faults” is one word in Hebrew, things that are hidden, from the same verb as “hid” in verse 6, where nothing is hidden from the sun’s heat.

      “Cleanse” here translates a verb that means to “hold innocent, acquit.” He asks to be cleared of what he does not know to confess.

      The law of Moses distinguished two kinds of sin. For one who should “sin through ignorance” ([[Num. 15:27]]) there was an offering, “and it shall be forgiven him” ([[Num. 15:28]]). But “the soul that doeth ought presumptuously” ([[Num. 15:30]]) was cut off. One reading sets verses 12 and 13 on that passage. The “errors” take in “the whole province” of unwitting sin, the sins “which even he, who is most earnestly striving after sanctification, does not discern,” and verse 13, where its word is taken as sins (see the note there), turns to the other kind.

      It is the law that sends him to this prayer. His reflections on its perfection “cause him to turn his thoughts inward as he considers how his own life measures up to the standard of that law.” The law has been called for that reason “a mirror of self-knowledge.”
    sources: [bdb, oshb-wlc, delitzsch-psalms, ot-minute-psalms-1-20, lds-scriptures]
  - ref: 13
    phrase: presumptuous sins
    kind: words
    title: Presumptuous sins, or presumptuous men
    body: |
      The King James supplies “sins” to a Hebrew adjective that stands alone, “insolent, presumptuous,” and the word may mean people instead. “Sins” continues verse 12, which spoke of errors and hidden faults. The Joseph Smith Translation changes “sins” to “acts.”

      Elsewhere the word is a “technical term for godless, rebellious men,” and one reading takes it so here: this verse too “probably” says “also from presumptuous men hold back thy servant.” A modern translation agrees: “Keep back your servant also from the insolent.” The Greek translators have “the attack of strangers.” On that reading “let them not have dominion over me” is a prayer not to be ruled by the arrogant.

      Then, he says, he will be “innocent,” which is the verb of “cleanse” in verse 12. “The great transgression” has no article in Hebrew, and a modern translation has simply “innocent of great transgression.”
    sources: [bdb, nrsvue, lxx-rahlfs, lds-scriptures, oshb-wlc]
  - ref: 14
    phrase: O LORD, my strength, and my redeemer
    kind: christ
    title: My rock and my redeemer
    body: |
      The psalm’s last words call the LORD by two titles, rock and kinsman-redeemer, and “Jehovah is the premortal Jesus Christ.”

      “My strength” translates the Hebrew for “my rock,” and a modern translation prints “my rock and my redeemer.” The word is used of God “as support and defence of his people,” and the psalm before this one calls on Him by the same Hebrew word, which the King James renders “my strength” there too ([[Ps. 18:2]]).

      “Redeemer” is *go’el*. The verb means to “act as kinsman, do the part of next of kin,” and with God as its subject it means to redeem, “implying personal relationship.” What a kinsman-redeemer did for his family is set out in the note on [[Isa. 41:14]]. When Israelites asked God to redeem them, “they were considering Him to be their kin through the covenant relationship they had with Him.”

      This verse is among those cited to show that Jehovah was “understood to be Israel’s Redeemer.” The Redeemer is Jesus Christ, who “through His Atonement, paid the price for the sins of mankind.”
    sources: [gs-jehovah, bdb, nrsvue, sc-knowhy-436, sc-knowhy-12, gs-redeemer]

christ: |
  The psalm ends on the word “redeemer,” spoken to the LORD, who is Jehovah, the premortal Jesus Christ. The note on verse 14 takes up the title and the kinship it implies.

  The prayer that leads to that word asks Him to clear the psalmist of faults he cannot see (verse 12), to keep him back (verse 13), and to accept his words (verse 14).

explore: |
  - **The night sky beside the day sky.** [[Ps. 8:3–4]] looks at the moon and the stars, and this psalm at the sun; the two have been read as a pair, the heavens by night and by day.
  - **The law praised at length.** Psalm 119 has been set beside the second half of this psalm.
  - **My redeemer.** Job uses the same title in the same form: “For I know that my redeemer liveth” ([[Job 19:25]]).

parallels:
  - ref: Rom. 10:18
    note: Paul quotes verse 4, with “sound” for “line,” after asking, “Have they not heard?”
  - ref: Alma 30:44
    note: Alma tells Korihor that the earth and the planets witness that there is a Supreme Creator.
  - ref: D&C 88:45–47
    note: Whoever has seen the least of the sun, moon and stars “hath seen God moving in his majesty and power.”
  - ref: Num. 15:27–31
    note: The law’s distinction between sin through ignorance and sin done presumptuously, which one reading sets behind verses 12–13.
  - ref: Job 19:25
    note: “My redeemer,” the title that closes the psalm.

