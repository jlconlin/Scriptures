chapter: 17
title: I Shall Be Satisfied
tagline: A hunted man asks the LORD to hear his cause and to keep him, and ends by setting what his enemies have in this life beside what he hopes for, which is to see God’s face.
when: 'Undated; a prayer of David by its title'

setting: |
  The title ascribes the prayer to David and names no occasion. It is “a righteous individual’s prayer for protection”: the speaker is surrounded by enemies who want his life, pictured in verse 12 as a lion. Others are in danger with him, since verse 11 says “us.”

  On one reading all this “corresponds, line for line, with the situation of David in the wilderness of Maon,” when “Saul and his men compassed David and his men round about to take them” ([[1 Sam. 23:26]]). That is a suggestion; the psalm itself names no one.

  Psalm 17 stands beside Psalm 16 for a reason that can be seen in both. Each looks back on the night ([[Ps. 16:7]]; verse 3 here), each asks to be kept, and each “closes with the hope of a blessed and satisfying vision of God.” They do so “notwithstanding a great dissimilarity in their tone.”

  Joseph Smith revised the opening of the psalm when he worked through the Psalms, by early 1833 (see the note on verse 1).

thread: |
  The psalm is a case laid before a judge, and it has three requests: that God “hear him,” that He “behold his innocence,” and that He “deliver and protect him.” **It turns in its last verse, where the speaker stops looking at his enemies and says what he will have instead of what they have.**

  Verses 1–5 ask for a hearing. He has a just cause, his lips are not deceitful, and he has already been tested, at night, and nothing was found. Verses 6–9 ask to be kept. He asks God to show His “marvellous lovingkindness,” the word *hesed* that is explained at [[Ps. 51:1]], and to be guarded as closely as the pupil of an eye. Verses 10–12 describe the enemies: closed hearts, proud mouths, and eyes fixed on bringing him down. Verses 13–14 call on the LORD to act. God saves from “those that rise up” (verse 7), and so the prayer is “Arise, O LORD” (verse 13), with the same Hebrew verb. Psalm 3 makes the same call (see [[Ps. 3:7]]).

  Then comes “As for me.” The men of verse 14 have their portion in this life, and they are “full.” He “shall be satisfied,” and the Hebrew verb is the one just used of them. With these words he sets his own good against theirs.

  The last verse also takes up words of the first two. The psalm began with “the right,” with a judgment that should come from God’s “presence,” which in Hebrew is His face, and with God’s eyes that “behold.” The same three Hebrew words return in “I will behold thy face in righteousness.” At the beginning God’s eyes are asked to behold what is right. At the end the speaker expects to behold God.

sections:
  - range: 1-5
    heading: Hear a just cause
    plain: |
      LORD, hear a just cause. Listen to my cry and to my prayer, which does not come from lying lips. Let the judgment in my case come from You, and let Your eyes see what is right. You have tested my heart. You have come to examine me at night. You have tried me and will find nothing; I have resolved that my mouth will not sin. As for what other men do, by the word of Your lips I have kept myself from the paths of the violent. Hold my steps firm in Your paths so that my feet do not slip.
  - range: 6-9
    heading: Keep me
    plain: |
      I call on You because You will answer me, O God. Bend Your ear to me and hear what I say. Show Your wonderful lovingkindness, You who save by Your right hand those who take refuge in You from those who rise against them. Guard me like the pupil of the eye. Hide me in the shadow of Your wings from the wicked who oppress me, from the deadly enemies who surround me.
  - range: 10-12
    heading: The men who surround him
    plain: |
      They are shut in by their own fat, and their mouths speak with pride. Now they have surrounded us at every step. Their eyes are set on throwing us to the ground. He is like a lion hungry to tear its prey, like a young lion crouching in a hidden place.
  - range: 13-14
    heading: Arise, O LORD
    plain: |
      Rise up, LORD. Confront him and bring him down. Rescue my life from the wicked by Your sword, from men by Your hand, LORD: from men of this passing world, whose share is in this life. You fill their bellies from Your store. They have children in plenty, and they leave what is left of their wealth to their little ones.
  - range: 15
    heading: As for me
    plain: |
      But I, in righteousness, will see Your face. When I awake I shall be satisfied with Your likeness.

notes:
  - ref: 0
    phrase: A Prayer
    kind: words
    title: Five psalms are headed A Prayer
    body: |
      The title calls this poem a prayer, a name that only five psalms carry: this one and Psalms 86, 90, 102 and 142. Outside the Psalter the prayer of Habakkuk carries it too. The Hebrew word is *tefillah*, and it comes again in verse 1 as “my prayer.” As a title it marks a “poetic, liturgical prayer.”

      The same word is once used for David’s psalms as a body: “The prayers of David the son of Jesse are ended” ([[Ps. 72:20]]). What a title is, and what it is worth as evidence, is discussed under the title of Psalm 3 ([[Ps. 3:1]]).
    sources: [oshb-wlc, bdb, lds-scriptures]
  - ref: 1
    phrase: Hear the right
    kind: words
    title: A just cause and a verdict
    body: |
      The first two verses use the language of a court: “the right” is a just cause, and “my sentence” is the verdict the speaker wants from God. The Hebrew noun in verse 1 is the common one for righteousness, used here of “righteousness, justice, in a case or cause,” and a modern translation has “Hear a just cause, O Lord.” The ancient Greek translators attached the word to God and wrote “O Lord of my righteousness.”

      “Sentence” in verse 2 is the judgment given in his case. The Greek has “Let my judgment come forth from thy presence,” and a modern translation has “From you let my vindication come” and then “let your eyes see the right.” He says he is in the right, and he asks the judge whose eyes see “the things that are equal” to say so.
    sources: [bdb, nrsvue, lxx-rahlfs]
  - ref: 1
    phrase: that goeth not out of feigned lips
    kind: scripture
    title: Joseph Smith’s revision asks for the right word
    body: |
      In Joseph Smith’s revision the psalm no longer opens by asking to be heard. It asks to be taught: “Give me right word, O Lord; speak and thy servant shall hear.” The last clause of the verse becomes a statement about the one praying: “I come not unto thee out of feigned lips.”

      The plea for a hearing is still there, since “attend unto my cry” stays. What the change adds is a promise. Its “most important addition is the commitment to hear the Lord’s teachings, implying both hearing the words and obeying them.” In verse 3 the revision reads “thou shalt find nothing evil in me,” an addition that “agrees with the LXX version of this verse,” the ancient Greek, which has “unrighteousness has not been found in me.”

      The revised psalm has been read beside the Prophet’s own account of himself. After the First Vision he was troubled by his sins, yet he said that no one need suppose him “guilty of any great or malignant sins” ([[JS—H 1:28]]).
    sources: [lefevre-jst-psalms, lxx-rahlfs, lds-scriptures]
  - ref: 3
    phrase: thou hast tried me, and shalt find nothing
    kind: words
    title: Tested as metal is tested
    body: |
      The claim to be found with “nothing” is the result of an assay, and the verb “tried” is the refiner’s: it means to “smelt, refine, test.” The Greek translators wrote the fire into the line, “thou hast tried me as with fire.” The visit “in the night” is an examination too: the verb there is used of a visit “to search, test.”

      How can anyone say this to God? He is asking God “to behold his innocence.” David’s plea of righteousness in Psalm 7 is discussed at [[Ps. 7:8]]. One older reading goes further into what such words meant. The night is the hour “when the bottom of a man’s heart is at once made manifest,” and the test found nothing “that is separated as dross from the gold.” Yet a confession like this “does not claim to be clear from sins, but only from a conscious love of sin.”

      A modern translation makes the test conditional: “if you test me, you will find no wickedness in me.”
    sources: [bdb, lxx-rahlfs, ot-minute-psalms-1-20, delitzsch-psalms, nrsvue]
  - ref: 8
    phrase: Keep me as the apple of the eye
    kind: symbol
    title: The pupil of the eye, and wings
    body: |
      “The apple of the eye” is the pupil, and the phrase is a “simile of preciousness” in each place where the Old Testament uses the word of an eye. The point of the comparison is that “the apple of the eye is an object of the most careful self-preservation.”

      The image is also used of a whole people. “The primary passage for this bold figure” is the song of Moses, where the Lord found Israel in the wilderness and “kept him as the apple of his eye” ([[Deut. 32:10]]). The song’s next verse has wings: “As an eagle stirreth up her nest, fluttereth over her young, spreadeth abroad her wings” ([[Deut. 32:11]]). On one older reading the psalm’s second figure is “taken from the eagle, which hides its young under its wings, likewise from Deuteronomy 32.” In the song the Lord kept Israel so, and in the psalm one man asks to be kept so.

      The wings return often in the Psalms as a figure of the LORD “as protector of his people” ([[Ps. 36:7]] and [[Ps. 91:4]] among them).
    sources: [bdb, delitzsch-psalms, lds-scriptures]
  - ref: 10
    phrase: They are inclosed in their own fat
    kind: words
    title: Fat that shuts the heart
    body: |
      The line is about hearts that cannot be moved. The Hebrew has “their fat” and a verb of shutting, and the fat is the fat of the midriff, used as a figure “of unreceptive heart.” A modern translation gives the sense without the picture: “They close their hearts to pity.” The Greek kept the picture, as the King James does: “They have enclosed themselves with their own fat.”

      Another psalm uses the same figure: “Their heart is as fat as grease” ([[Ps. 119:70]]), which is to say that “their heart is as unresponsive as the midriff-fat near it.” The second half of the verse adds proud speech.
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs]
  - ref: 13
    phrase: which is thy sword
    kind: words
    title: The sword and the hand are the LORD’s
    body: |
      The King James makes the wicked God’s sword, and the men of verse 14 His hand, but the Hebrew has no words for “which is” and “which are.” In Hebrew “from the wicked” and “thy sword” simply stand next to each other, and the reader has to decide how they are joined. The Church’s edition offers “by” in its footnotes to both verses.

      Read that way, the sword is what the LORD rescues with. A modern translation has “By your sword deliver my life from the wicked,” and the ancient Greek makes the words a fresh request, “draw thy sword.” Both take the sword as God’s own, and not as a name for the wicked.

      “Disappoint him” is “confront them, overthrow them!” in a modern translation.
    sources: [oshb-wlc, lds-scriptures, nrsvue, lxx-rahlfs]
  - ref: 14
    phrase: which have their portion in this life
    kind: words
    title: A portion in this life
    body: |
      The enemies are described by where their share lies: in this life. The Hebrew word behind “world” means “duration, world,” the world as a span of time, so that “men of the world” are men of the passing age.

      On one older reading the phrase “becomes clear from the converse in Psalm 16:5,” where the speaker says, “The LORD is the portion of mine inheritance and of my cup” ([[Ps. 16:5]]). One man’s portion is the LORD, and the others’ portion is life itself. “The contrast is not so much between this life and the life to come, as between the world (life) and God.”

      The rest of the verse is read in more than one way, and the text of the clause about children has been judged “dubious.” As the King James has it, God Himself fills these men from His store, and they have children and wealth to leave behind. The same older reading takes this as a statement and not a complaint: by giving them all they want, God “absolutely deprives them of all claim to possessions that extend beyond the world and this present temporal life,” and “there is not the slightest alloy of murmur or envy in the words.” A modern translation turns the lines into wishes: “May their bellies be filled with what you have stored up for them.”

      The psalm’s answer is the next verse.
    sources: [bdb, delitzsch-psalms, nrsvue, lds-scriptures]
  - ref: 15
    phrase: I will behold thy face in righteousness
    kind: scripture
    title: His face and His form
    body: |
      The psalm ends with the hope of seeing God, His face and His likeness. It is “a bold expectation but not a unique one in Psalms.” The same hope closes Psalm 11 (see [[Ps. 11:7]]).

      “Likeness” makes the hope more definite. The Hebrew word, *temunah*, means “likeness, form.” It is the word for the made image that the commandment forbids, “but it can also refer to God’s own form,” as when the Lord says of Moses, “the similitude of the LORD shall he behold” ([[Num. 12:8]]). Here it appears to be used in that second way. The Greek translators have “glory” in its place: “I shall be satisfied when thy glory appears.”

      Where he expects this is not said. Several psalms “suggest an experience of seeing God’s face in the temple,” and the belief that “worshippers could come into the presence of God in his holy house in Jerusalem and see him face-to-face” is a theme of several of them. The temple in the Psalms is taken up at [[Ps. 24:3]].

      “In righteousness” is in Hebrew the word the psalm began with, “the right” of verse 1. The confidence of the last verse is that “due to his righteousness, he will ultimately behold the Lord’s face.”
    sources: [ot-minute-psalms-1-20, bdb, oshb-wlc, lxx-rahlfs, skinner-seeing-god, lds-scriptures]
  - ref: 15
    phrase: when I awake
    kind: words
    title: Awake from which sleep?
    body: |
      The psalm does not say what sleep he will wake from, and more than one answer has been given. The awakening “could refer to normal sleep, to sleeping in the temple or temple grounds, or to the Resurrection, after which the psalmist knows he will see God.” Job says the last of these outright: “yet in my flesh shall I see God” ([[Job 19:26]]).

      The Hebrew verb is used of waking “from sleep” and “from sleep of death,” and so “of resurrection,” as in Isaiah and Daniel. Interpreters have divided over this verse between ordinary sleep and the sleep of death. Others have taken it as waking “from night of distress and helplessness,” and it has also been placed under a further sense, in which the one who awakes is the LORD, roused “to activity.”

      The Church’s edition points the word to the Resurrection in its footnote.
    sources: [ot-minute-psalms-1-20, bdb, lxx-rahlfs, lds-scriptures]

christ: |
  The psalm’s last hope is to see the LORD’s face “in righteousness.” The Savior’s promise in the Sermon on the Mount has been set beside that line: “Blessed are the pure in heart: for they shall see God” ([[Matt. 5:8]]).

  Latter-day revelation repeats the promise and ties it to the Lord’s house. If His people build a house to Him and keep it undefiled, He says, “all the pure in heart that shall come into it shall see God” ([[D&C 97:16]]). See also [[D&C 93:1]], where the Lord says who shall see His face, which is quoted in the chapter on Psalm 11.

explore: |
  - **The hope to see His face.** [[Ps. 11:7]], [[Ps. 27:4]], [[Ps. 27:8]] and [[Ps. 42:2]] share this psalm’s closing hope.
  - **Psalm 16 beside Psalm 17.** Read them together: “Preserve me” and “Keep me,” the portion ([[Ps. 16:5]]), and the two endings ([[Ps. 16:11]]).

parallels:
  - ref: Deut. 32:10–11
    note: The Lord keeps Israel as the apple of His eye, and the eagle spreads her wings; the first passage for the image of verse 8.
  - ref: Ps. 16:5
    note: The LORD as the speaker’s portion, the converse of the men whose portion is in this life.
  - ref: Num. 12:8
    note: Moses beholds the similitude of the LORD, the same Hebrew word as “likeness” in verse 15.
  - ref: Job 19:26
    note: Job expects to see God in his flesh, cited for the reading of “when I awake” as the Resurrection.
  - ref: D&C 97:15–16
    note: The pure in heart who come into the Lord’s house shall see God.

