chapter: 35
title: Plead My Cause
tagline: A man hunted and slandered by people he once mourned for asks the LORD to take his case and his defence, and three times promises the praise he will give when it is done.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  Psalm 35 stands in Book One of the Psalms, beside Psalm 34; these are the only two psalms that name “the angel of the LORD.” Its title ascribes it to David and gives no occasion.

  The speaker is one man with many enemies. They have set a trap for him, they bring witnesses against him, and they are people whose sicknesses he once mourned as if they were his family’s. One older reading places the psalm in the years when Saul hunted David and calls it “the lyrical expansion of that which David expresses before Saul” outside the cave: “The LORD therefore be judge, and judge between me and thee, and see, and plead my cause, and deliver me out of thine hand” ([[1 Sam. 24:15]]). The psalm itself names no one.

  It is a lament ([[Ps. 22:1]] sets out the form), and it makes its plea three times over. Its closing lines are shared with another psalm ([[Ps. 40:14–16]]).

  Two things bring later readers to it. It prays hard against the enemies; the note on verse 4 takes that up. And the Savior told His disciples that a line written “in their law” was fulfilled in Him: “They hated me without a cause” ([[John 15:25]]).

thread: |
  Psalm 35 is **one case argued three times**. It has three parts (verses 1–10, 11–18 and 19–28), and each “opens with a cry for deliverance; and closes, in the certain assumption that it will take place, with a vow of thanksgiving.” The first part is a string of wishes against the hunters. The second is calmer and tells the wrong itself: he had fasted and prayed for these people. The third comes back to the opening word, “my cause,” and hands the whole matter to the Judge.

  All three parts are full of **quoted speech**. After the weapons, he asks the LORD for a sentence: “say unto my soul, I am thy salvation” (verse 3). His enemies’ words are quoted too. They say, “Aha, aha, our eye hath seen it” (verse 21), and he asks that they not be left to say, “We have swallowed him up” (verse 25). Three speeches of praise are promised: his bones shall say, “LORD, who is like unto thee” (verse 10); his friends shall say, “Let the LORD be magnified” (verse 27); and his own tongue shall speak of God’s righteousness “all the day long” (verse 28).

  The psalm reports no rescue. Every vow is in the future: “shall be joyful,” “I will give thee thanks,” “shall speak.” It ends where it began, with the case before the LORD and the speaker sure of the verdict.

sections:
  - range: 1-3
    heading: Plead my cause
    plain: |
      Take up my case, O LORD, against those who accuse me; fight those who fight me. Take shield and buckler and rise to help me. Draw the spear and block the way against my pursuers. Say to my soul, “I am your salvation.”
  - range: 4-8
    heading: Let his own net catch him
    plain: |
      Let those who seek my life be shamed and disgraced; let those who plan my harm be turned back in confusion. Let them be like chaff before the wind, with the angel of the LORD driving them. Let their path be dark and slippery, with the angel of the LORD pursuing them. For no reason they hid their net for me; for no reason they dug a pit for my life. Let ruin come on such a man when he does not expect it; let the net he hid catch him, and let him fall into that very ruin.
  - range: 9-10
    heading: Who is like unto thee?
    plain: |
      Then my soul will rejoice in the LORD and be glad in His salvation. All my bones will say, “LORD, who is like You? You rescue the poor man from one too strong for him, the poor and needy from the one who robs him.”
  - range: 11-16
    heading: Evil for good
    plain: |
      Violent witnesses stand up; they question me about things I know nothing of. They repay me evil for good, and my soul is left bereaved. Yet when they were sick I wore sackcloth and humbled myself with fasting, and my prayer came back into my own bosom. I went about as though for a friend or a brother; I bowed low like a man mourning his mother. But when I stumbled they were glad and gathered together. Low men gathered against me, and I did not know it; they tore at me and would not stop. Like godless jesters at a feast, they ground their teeth at me.
  - range: 17-18
    heading: How long wilt thou look on?
    plain: |
      Lord, how long will You look on? Bring my soul back from their ravages, my only life from the lions. I will thank You in the great congregation; among a mighty people I will praise You.
  - range: 19-21
    heading: Our eye hath seen it
    plain: |
      Do not let my lying enemies gloat over me, or those who hate me for no reason wink the eye. They do not speak peace; they plan deceit against the quiet people of the land. They open their mouths wide against me and say, “Aha, aha, our own eyes have seen it.”
  - range: 22-26
    heading: Thou hast seen
    plain: |
      You have seen, O LORD; do not be silent. O Lord, do not be far from me. Rouse Yourself and awake for my judgment, for my cause, my God and my Lord. Judge me, O LORD my God, by Your righteousness, and do not let them gloat over me. Do not let them say in their hearts, “Aha, just what we wanted.” Do not let them say, “We have swallowed him up.” Let all who are glad at my hurt be shamed and confounded together; let those who make themselves great against me be clothed in shame and dishonor.
  - range: 27-28
    heading: Let the LORD be magnified
    plain: |
      Let those who delight in my vindication shout for joy and be glad, and let them say always, “Great is the LORD, who delights in the welfare of His servant.” And my tongue will tell of Your righteousness and of Your praise all day long.

notes:
  - ref: 1
    phrase: Plead my cause, O LORD, with them that strive with me
    kind: words
    title: A lawsuit and a battle
    body: |
      The psalm opens in a courtroom and, half a line later, on a battlefield. “Plead,” “strive” and (in verse 23) “my cause” are one Hebrew root, *rib*, whose verb means to “strive, contend,” with fists, with words, or at law, where it is to “conduct a (legal) case.” The second half of the line answers with soldiers’ words, “fight against them that fight against me,” and verses 2–3 hand the LORD a shield, a buckler and a spear.

      The two pictures fit the trouble the psalm goes on to tell: the speaker is hunted (verses 3–7) and he is accused (verse 11).

      The root returns when the psalm comes round to its close: “awake to my judgment, even unto my cause” (verse 23). The same verb is in David’s words to Saul, “plead my cause” ([[1 Sam. 24:15]]), where it means taking his part.
    sources: [oshb-wlc, bdb]

  - ref: 4
    phrase: Let them be confounded and put to shame that seek after my soul
    kind: scripture
    title: What the curses ask for
    body: |
      Verses 4–8 and 26 are wishes spoken to God: each is “let them” or “let him,” and none says what the speaker himself will do. How prayers of this kind are read, and how the Savior’s command to love enemies stands above them, is the note at [[Ps. 137:8]].

      What this psalm asks in particular is that the trap work on the one who set it: “let his net that he hath hid catch himself” (verse 8). The Psalms say this more than once ([[Ps. 7:15]]; [[Ps. 9:15]]).
    sources: [lds-scriptures]

  - ref: 5
    phrase: let the angel of the LORD chase them
    kind: symbol
    title: The angel of the LORD, guard and pursuer
    body: |
      The angel of the LORD appears in the Psalms only here and in the psalm before, and the two psalms give him opposite work. There he “encampeth round about them that fear him, and delivereth them” ([[Ps. 34:7]]). Here he is behind the enemy, driving them like chaff ([[Ps. 1:4]] has the image) down a path that is “dark and slippery.”

      An angel in the Old Testament is a messenger of God, and in some passages the angel of the LORD “speaks as the voice of God Himself.” The psalm says no more of him than what he does.

      The second verb is verse 3’s. “Persecute” in verse 6 is the Hebrew verb to “pursue,” used of God’s judgment, and it is the word verse 3 used of the enemies, “them that persecute me.” The pursuers are to be pursued.
    sources: [oshb-wlc, bdb, bd-angels, lds-scriptures]

  - ref: 7
    phrase: without cause have they hid for me their net in a pit
    kind: words
    title: 'Without cause: for nothing'
    body: |
      “Without cause” is one Hebrew word, *hinnam*, and the psalm says it three times, twice in this verse and again in verse 19. Its first sense is “gratis, gratuitously, for nothing,” as a man may “serve for nought”; the sense here is “without cause, undeservedly, especially of groundless hostility or attack.” The enmity is unearned.

      The second part of the psalm shows how far that goes. He had not merely left these people alone: when they were sick he fasted for them (verse 13), and what came back was “evil for good” (verse 12).
    sources: [oshb-wlc, bdb]

  - ref: 10
    phrase: LORD, who is like unto thee
    kind: scripture
    title: The question from the song at the sea
    body: |
      The praise he promises has the words of the question Israel sang after the Red Sea: “Who is like unto thee, O LORD, among the gods?” ([[Ex. 15:11]]). The Hebrew behind “who is like unto thee” is the same two words in both places. In Exodus Moses and all Israel sing it after Pharaoh’s host is cast into the sea. Here one man’s bones are to say it, of the LORD who rescues “the poor from him that is too strong for him.”
    sources: [oshb-wlc, lds-scriptures]

  - ref: 11
    phrase: they laid to my charge things that I knew not
    kind: words
    title: Witnesses of violence, and their questions
    body: |
      The second part opens in court, and the Hebrew is sharper than “false witnesses.” They are witnesses of *hamas*, violence, the law’s phrase for “a witness that promotes violence and wrong,” and what they do is ask: a modern translation has “they ask me about things I do not know,” and the Greek, “Unjust witnesses arose, and asked me.” He is being examined about things he has no knowledge of.

      The law of Moses names this kind of witness and gives the sentence: “Then shall ye do unto him, as he had thought to have done unto his brother” ([[Deut. 19:16–19]]).
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs]

  - ref: 13
    phrase: my prayer returned into mine own bosom
    kind: words
    title: A prayer that came back to his bosom
    body: |
      The line is obscure, and it has been read in more than one way. What is certain is the setting: when his enemies were ill he put on sackcloth, fasted, and prayed for them.

      One reading takes it as his posture. He prayed with his head sunk on his breast, “like Elijah” on Carmel, who “put his face between his knees” ([[1 Kgs. 18:42]]), so that the prayer seemed to fall back into his own bosom. A modern translation follows this: “I prayed with head bowed on my bosom.”

      A second takes it as repayment. The bosom is the fold of the robe at the breast, and elsewhere what God returns “into their bosom” is recompense ([[Isa. 65:6–7]]). This verse has been set with those, as a figure meaning to “requite into bosom,” with nothing said of how a prayer is repaid.

      The modern translation’s margin leaves it as bare as the Hebrew: “My prayer turned back.” However the line is read, he prayed for them, and they were glad when he fell.
    sources: [delitzsch-psalms, nrsvue, bdb, oshb-wlc]

  - ref: 15
    phrase: the abjects gathered themselves together against me
    kind: words
    title: Abjects, and mockers for a cake
    body: |
      Two of the King James Version’s strangest phrases stand in these verses, and the Hebrew behind each is uncertain. An “abject,” as a noun, was a person “in the lowest condition and despicable.” The Hebrew word as it stands means “smitten ones,” but it is probably to be read as a similar word meaning “aliens,” and a modern translation has “ruffians whom I did not know.”

      “Hypocritical mockers in feasts” (verse 16) is in Hebrew “mockers of a cake,” explained as “mockers of (for) a cake, i. e. buffoons.” The same translation corrects the text, comparing the Greek, to “they impiously mocked more and more,” and puts the Hebrew in its margin.

      Whichever words are right, the two verses say one thing: a crowd has gathered against him, and it makes sport of his fall.
    sources: [webster-1828, oshb-wlc, bdb, nrsvue]

  - ref: 19
    phrase: that hate me without a cause
    kind: christ
    title: '“They hated me without a cause”'
    body: |
      Jesus said this line was fulfilled in Him. He told His disciples that the world’s hatred of Him and of His Father had come “that the word might be fulfilled that is written in their law, They hated me without a cause” ([[John 15:25]]).

      The words are in two psalms. “Hate me without a cause” translates the same Hebrew phrase here and in [[Ps. 69:4]], and John does not say which the Lord had in mind. One list of the Savior’s uses of the Psalms sets His words beside this verse.
    sources: [lds-scriptures, olmstead-saviors-use, oshb-wlc, bdb]

  - ref: 22
    phrase: This thou hast seen, O LORD
    kind: words
    title: What the enemies saw, the LORD has seen
    body: |
      One verb, to see, passes from God to the enemies and back in the verses around the third plea. The second part ended, “Lord, how long wilt thou look on?” (verse 17). The enemies then boast, “Aha, aha, our eye hath seen it” (verse 21): they have watched him fall. He answers with their own word: “This thou hast seen, O LORD.” The Hebrew verb is the same in all three verses.

      What he asks of the One who has seen is that He not stay silent or far off (“keep not silence”; “be not far from me”) and that He wake “to my judgment.” Psalm 22 pleads against the same distance ([[Ps. 22:11]]).
    sources: [oshb-wlc]

  - ref: 27
    phrase: Let the LORD be magnified, which hath pleasure in the prosperity of his servant
    kind: words
    title: The enemies’ words, turned
    body: |
      Three words the psalm has used of the enemies come back in the closing blessing, said of the LORD and of the speaker’s friends.

      *Magnify.* The enemies “magnify themselves against me” (verse 26); the friends say, “Let the LORD be magnified.” It is one Hebrew verb.

      *Rejoice.* The enemies “rejoiced” in his adversity (verse 15) and are not to “rejoice over me” (verses 19, 24), where the verb means to “rejoice arrogantly, exult.” In verse 27 the same verb is the friends’ “be glad.”

      *Peace.* The enemies “speak not peace” (verse 20). “Prosperity” in verse 27 is that word, *shalom*, and the Greek keeps it: the LORD desires “the peace of his servant.”

      Another psalm has the friends’ line in the same Hebrew words: “say continually, The LORD be magnified” ([[Ps. 40:16]]).
    sources: [oshb-wlc, bdb, lxx-rahlfs]

christ: |
  The Savior took one line of this psalm for Himself: “They hated me without a cause” ([[John 15:25]]). The note on verse 19 gives His words and the two psalms that have the phrase.

  Of the LORD the psalm says that He delivers “the poor from him that is too strong for him” (verse 10) and that He has seen (verse 22). It asks Him to judge “according to thy righteousness” (verse 24) and to say, “I am thy salvation” (verse 3).

explore: |
  - **The Lord’s own use of the line.** [[John 15:18–25]], read with verses 7, 12 and 19 open.
  - **David and Saul at the cave.** [[1 Sam. 24:9–19]], where David says “plead my cause” and Saul answers, “thou hast rewarded me good, whereas I have rewarded thee evil.”
  - **The companion psalm.** [[Ps. 34]], where the angel of the LORD camps around those who fear Him.
  - **The other psalm with the line.** [[Ps. 69:4]], and the lament it opens.
  - **Liberty Jail.** [[D&C 121:1–6]], Joseph Smith’s “How long” and his plea to be avenged; the Church’s footnotes there point to verses 1 and 17 of this psalm. The Lord’s answer follows in [[D&C 121:7–8]].
  - **The closing lines again.** [[Ps. 40:13–17]] and [[Ps. 70]].

parallels:
  - ref: John 15:25
    note: Jesus says the words of verse 19 (and of Ps. 69:4) are fulfilled in the hatred shown Him.
  - ref: 1 Sam. 24:15
    note: David to Saul, “plead my cause,” with the verb of verse 1.
  - ref: Ps. 34:7
    note: The only other psalm to name the angel of the LORD; there he guards, here he pursues.
  - ref: Ex. 15:11
    note: The song at the sea asks “Who is like unto thee,” the question of verse 10.
  - ref: Ps. 40:14–16
    note: Shares the wish of verse 4, the “Aha, aha” of verse 21 and the blessing of verse 27.
  - ref: D&C 121:2
    note: Joseph Smith’s “How long” from Liberty Jail; the Church’s footnote there cites verse 17.

