chapter: 113
title: Who Is Like unto the LORD Our God
tagline: A call to praise the name of the LORD everywhere and always, because the God who sits above the heavens stoops to look, and lifts a poor man from the ash heap and a childless woman into a home.
when: 'Undated; the psalm has no title'

setting: |
  The psalm has no title and names no occasion. It opens and closes with “Praise ye the LORD,” the hallelujah explained at [[Ps. 150:1]], as the two psalms before it open ([[Ps. 111:1]]; [[Ps. 112:1]]).

  It is also a beginning. It is the first psalm of the Hallel, Psalms 113–118, and at Passover this psalm and the next were by tradition sung as the meal began (see the note on [[Ps. 113:1]]). The next one starts, “When Israel went out of Egypt” ([[Ps. 114:1]]).

  The psalm shares its closing verses with an older song. Verses 7 and 8 are nearly a verse of the song of Hannah ([[1 Sam. 2:8]]), and one older reading sees Hannah’s own story behind the barren woman of verse 9. Mary’s song in Luke 1 takes up the same theme.

thread: |
  Psalm 113 is a hymn in two movements: **a call to praise, and then the reason, which is that the One who sits highest of all looks down to the lowest**.

  Verses 1–3 are the call. “The name of the LORD” is said three times in three verses, and the praise is given two measures: “from this time forth and for evermore,” and “from the rising of the sun unto the going down of the same.”

  Verse 4 begins the reason with height. The LORD is “high above all nations,” and His glory is “above the heavens.” Then verse 5 asks the question the psalm is built around: “Who is like unto the LORD our God?” The answer has two halves that pull in opposite directions. He “dwelleth on high,” and He “humbleth himself to behold.” From where He sits, even the heavens are something to look far down on.

  The turn is there, between verses 5 and 6. Everything before it goes up. After it the psalm goes down: heaven, earth, the dust, the dunghill. The psalm does not praise God for being too high to notice. What makes Him unlike anyone is that He is that high and still looks, and that what He looks for is the poor man and the woman with no child.

  Then the direction reverses once more, and this time it is people who rise. The poor man is seated “with the princes of his people”; the barren woman becomes “a joyful mother of children.” The psalm ends with the words it began with.

sections:
  - range: 1-3
    heading: Praise the name of the LORD
    plain: |
      Praise the LORD! Praise Him, you servants of the LORD; praise the name of the LORD. May the name of the LORD be blessed from now on and for ever. From where the sun rises to where it sets, the name of the LORD is to be praised.
  - range: 4-6
    heading: High above the heavens, and looking down
    plain: |
      The LORD is high above all the nations, and His glory is above the heavens. Who is like the LORD our God? He is seated on high, and He stoops far down to look on the heavens and the earth.
  - range: 7-9
    heading: Out of the dust
    plain: |
      He raises the poor man out of the dust and lifts the needy from the ash heap, to seat him with princes, the princes of his own people. He gives the childless woman a home and makes her the joyful mother of children. Praise the LORD!

notes:
  - ref: 1
    phrase: Praise ye the LORD
    kind: history
    title: The first psalm of the Hallel
    body: |
      Psalm 113 opens the Hallel, Psalms 113–118, which were “recited by Jews at the great feasts.” Its first words, “Praise ye the LORD,” are the hallelujah explained at [[Ps. 150:1]].

      The Passover custom bears on the Gospel account of the Last Supper. The singing of the Hallel was one of the ceremonies added to the Passover meal “in later times,” and by tradition it was divided: Psalms 113 and 114 at the beginning of the meal, and Psalms 115–118 as part of its formal close.

      After the Last Supper, “when they had sung an hymn, they went out into the mount of Olives” ([[Matt. 26:30]]). Matthew does not name the hymn. It “was probably” the Hallel, and “likely” its last part, Psalms 115–118. If the meal that night “proceeded in the traditional manner” at least that far, this psalm was sung earlier in the evening, before the second cup of wine. That is an inference from the custom, not something the Gospels record.
    sources: [bd-hallel, bd-feasts, nt-student-manual-9, skinner-life-jesus, lds-scriptures]

  - ref: 3
    phrase: From the rising of the sun unto the going down of the same
    kind: scripture
    title: From east to west, as in Malachi
    body: |
      The sunrise and sunset of verse 3 measure the earth from one end to the other, as the same words do in Malachi. Verse 2 has already measured the praise in time, “from this time forth and for evermore.” Verse 3 adds a measure of place. Malachi uses the same phrase, and the line beside it speaks of place: “from the rising of the sun even unto the going down of the same my name shall be great among the Gentiles; and in every place incense shall be offered unto my name” ([[Mal. 1:11]]). Malachi’s verse, like this one, is about the name of the LORD, and the psalm’s next line is “The LORD is high above all nations.”
    sources: [lds-scriptures]

  - ref: 6
    phrase: Who humbleth himself to behold
    kind: words
    title: He stoops to look, and He gives seats
    body: |
      “Humbleth himself” here means that God bends down in order to see, and verses 5 and 6 are a matched pair: He goes high to sit and goes low to look. That is how the Hebrew of verse 6 reads, “he who maketh low to look upon heaven and earth,” and it is built like the phrase of verse 5. A modern translation has Him “seated on high” and then one “who looks far down” on the heavens and the earth.

      He looks down on the heavens as well as the earth, since verse 4 has placed His glory “above the heavens.”

      The King James Version hides a second link. “Dwelleth” in verse 5, “set” in verse 8 and “maketh … to keep house” in verse 9 are one Hebrew verb, to sit or to dwell. The LORD sits on high; He lifts the poor man “to make them sit with princes,” as the modern translation has it; and the odd phrase about the barren woman, “to keep house,” means “giving a dwelling to her that is barren of house,” or “He gives the barren woman a home.”
    sources: [bdb, oshb-wlc, nrsvue]

  - ref: 7
    phrase: lifteth the needy out of the dunghill
    kind: scripture
    title: Hannah’s song, and Mary’s
    body: |
      Verses 7 and 8 together follow one verse of Hannah’s song nearly word for word, and the dunghill in both is the place where a beggar sat. Hannah sang, “He raiseth up the poor out of the dust, and lifteth up the beggar from the dunghill, to set them among princes, and to make them inherit the throne of glory” ([[1 Sam. 2:8]]). The Hebrew noun is a refuse heap or dunghill, perhaps an ash heap, named in both verses “as beggars’ resting-place”; a modern translation has “ash heap.” Compare Job, who in his misery “sat down among the ashes” ([[Job 2:8]]).

      One older reading carries Hannah into verse 9 as well. Her song says that “the barren hath born seven” ([[1 Sam. 2:5]]), and she had been that woman: “the LORD had shut up her womb” ([[1 Sam. 1:6]]). On this reading the thoughts of verses 7 and 8 are “transplanted from the song of Hannah,” and in verse 9 the psalmist “has before his eye Hannah’s exaltation out of sorrow and reproach.” He does not quote her line about the barren woman. He gives “his generalization of her experience in his own language.” What one woman sang about her own rescue becomes what a congregation sings about its God.

      Mary sings the same way, and the Latter-day Saint edition sends a reader of her song back to Hannah’s. God “hath regarded the low estate of his handmaiden” ([[Luke 1:48]]); “He hath put down the mighty from their seats, and exalted them of low degree” ([[Luke 1:52]]). An older reading gives the reason: the psalm “gives prominence to the condescension of the infinitely exalted One towards the lowly one,” and so Mary “breaks forth into the same strain with the song of Hannah” and with this psalm. For Hannah’s song elsewhere in the Psalms, see the note on [[Ps. 75:7]]. See also [Women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/#the-women).
    sources: [lds-scriptures, bdb, nrsvue, delitzsch-psalms]

christ: |
  The LORD who stoops in this psalm is Jehovah, the Savior before His birth (see the note on [[Ps. 110:1]]).

  In the Latter-day Saint edition of the Bible the word “humbleth” in verse 6 carries a footnote to the condescension of Jesus Christ. “Condescension” is the angel’s word in Nephi’s vision. He asks, “Knowest thou the condescension of God?” ([[1 Ne. 11:16]]), and shows Nephi a virgin who is “the mother of the Son of God, after the manner of the flesh” ([[1 Ne. 11:18]]). He says again, “Look and behold the condescension of God!” ([[1 Ne. 11:26]]), and Nephi sees the Lamb of God among the people, healing the sick (see [[1 Ne. 11:31]]), and at the end “lifted up upon the cross and slain for the sins of the world” ([[1 Ne. 11:33]]). The psalm praises a God who looks down from above the heavens and lifts the poor out of the dust. In Nephi’s vision the Son of God comes down among them.

  If the Passover meal on the night of the Last Supper followed the custom, the Savior sang this psalm Himself; the note on [[Ps. 113:1]] gives the evidence.

explore: |
  - **Hannah’s story and song.** [[1 Sam. 1]] and [[1 Sam. 2:1–10]]: the barren wife, the son she asked for, and the song this psalm shares a verse with.
  - **Mary’s song.** [[Luke 1:46–55]], where the lowly are exalted again.
  - **The condescension of God.** [[1 Ne. 11:13–33]], the angel’s question and what Nephi is shown in answer.
  - **The rest of the Hallel.** [[Ps. 114]] through [[Ps. 118]], the psalms sung with this one at Passover.
  - **The name among the nations.** [[Mal. 1:11]], which uses verse 3’s phrase of every place on earth.

parallels:
  - ref: 1 Sam. 2:8
    note: Hannah’s song raises the poor from the dust and the beggar from the dunghill, to set them among princes; verses 7–8 are nearly the same words.
  - ref: 1 Sam. 2:5
    note: “The barren hath born seven,” beside verse 9.
  - ref: Luke 1:52
    note: Mary sings of the mighty put down and “them of low degree” exalted.
  - ref: Mal. 1:11
    note: The name of the LORD great “from the rising of the sun even unto the going down of the same.”
  - ref: Ex. 15:11
    note: The song at the sea asks the question of verse 5, “Who is like unto thee, O LORD, among the gods?”
  - ref: 1 Ne. 11:16
    note: The angel asks Nephi, “Knowest thou the condescension of God?”
  - ref: Matt. 26:30
    note: The hymn sung after the Last Supper, probably from the Hallel that this psalm begins.

