chapter: 50
title: God Is Judge Himself
tagline: God comes in fire to try His covenant people, finds no fault with their altars, and asks for thanksgiving and a life that matches the words in their mouths.
when: 'By its title, a psalm of Asaph; undated'

setting: |
  Psalm 50 stands in Book Two of the Psalms. It follows the psalms of the sons of Korah ([[Ps. 42:1]]) and comes just before David’s confession, which takes up sacrifice again: “thou delightest not in burnt offering” ([[Ps. 51:16]]). It is the first of the twelve psalms that bear Asaph’s name. The other eleven, Psalms 73–83, stand together in Book Three.

  Nobody in the psalm asks God for anything. A voice announces that God is coming to judge His people, and from verse 7 God Himself speaks, to the end. In that it reads like a prophet’s oracle. The psalms of Asaph have been described as marked by a “prophetically judicial character,” in which, “as in the prophets, God is frequently introduced as speaking.”

  The psalm names no king, no enemy and no event. The heading in the Church’s edition reads it of the future and says that in it “Asaph speaks of the Second Coming.” The fire and storm in which God comes recall Sinai (see the note on verse 3).

thread: |
  Psalm 50 is **a trial in which the judge is also the witness**. Verses 1–6 convene the court. God speaks, shines out of Zion, comes with fire, calls heaven and earth, and has His covenant people gathered. Then He makes two speeches.

  The first (verses 7–15) is to “my people,” whose burnt offerings are always before Him. They are not reproved for their sacrifices. God already owns every animal they could bring. What He asks for is thanksgiving, vows kept, and to be called on “in the day of trouble.”

  The second (verses 16–21) is to “the wicked,” who have His statutes in their mouths and go along with thieves and adulterers and slander a brother. Their mistake was about His silence: “thou thoughtest that I was altogether such an one as thyself.”

  The psalm speaks twice of God’s silence. It opens by announcing that God “shall not keep silence” (verse 3), and near the end He explains what the silence was: “These things hast thou done, and I kept silence” (verse 21). The last two verses hold a warning and a promise. The promise takes up the words of verse 14 again: the one who sacrifices thanksgiving glorifies God and will be shown “the salvation of God.”

sections:
  - range: 1-6
    heading: The court is convened
    plain: |
      The mighty God, the LORD, has spoken and summoned the earth from where the sun rises to where it sets. Out of Zion, perfect in beauty, God has shone. Our God is coming and will not be silent; a fire devours before Him, and a great storm is all around Him. He calls to the heavens above and to the earth, so that He may judge His people: “Gather My saints to Me, those who made a covenant with Me by sacrifice.” The heavens declare His righteousness, for God Himself is judge.
  - range: 7-15
    heading: 'To my people: not for thy sacrifices'
    plain: |
      Hear, My people, and I will speak; Israel, I will testify against you. I am God, your God. I do not reprove you for your sacrifices; your burnt offerings are always before Me. I will take no bull from your house and no goats from your pens. Every beast of the forest is Mine, and the cattle on a thousand hills. I know every bird of the mountains, and the wild creatures of the field are Mine. If I were hungry I would not tell you, for the world and all that fills it is Mine. Do I eat the flesh of bulls or drink the blood of goats? Offer God thanksgiving, and pay your vows to the Most High. Call on Me in the day of trouble; I will deliver you, and you will glorify Me.
  - range: 16-21
    heading: 'To the wicked: what hast thou to do with my statutes?'
    plain: |
      But to the wicked God says: What authority have you to recite My statutes or take My covenant in your mouth? You hate instruction and throw My words behind you. When you saw a thief you went along with him, and you have thrown in your lot with adulterers. You give your mouth to evil, and your tongue frames deceit. You sit and speak against your brother; you slander your own mother’s son. You did these things and I kept silent, and you thought I was just like you. But I will reprove you and lay it all out before your eyes.
  - range: 22-23
    heading: A warning and a promise
    plain: |
      Consider this, you who forget God, or I will tear you in pieces with no one to deliver. Whoever offers thanksgiving glorifies Me, and to the one who sets his way right I will show the salvation of God.

notes:
  - ref: 0
    phrase: Asaph
    kind: history
    title: Asaph the seer
    body: |
      Asaph was a Levite musician of David’s day, and Chronicles also calls him a seer. When the ark came to Jerusalem David set Levites to minister before it with “Asaph the chief,” who “made a sound with cymbals” ([[1 Chr. 16:5]]). The sons of Asaph, of Heman and of Jeduthun were set apart to “prophesy with harps, with psalteries, and with cymbals” ([[1 Chr. 25:1]]). In Hezekiah’s day the Levites sang praise “with the words of David, and of Asaph the seer” ([[2 Chr. 29:30]]).

      He “founded a family of singers,” the sons of Asaph, and that guild lasted until after the exile in Babylon, so some of the psalms under his name may be the work of its later musicians. Twelve psalms carry the name: this one and Psalms 73–83. The other guild of temple singers named in the titles is the sons of Korah ([[Ps. 42:1]]).
    sources: [lds-scriptures, bd-asaph, scripture-helps-ps-49]

  - ref: 1
    phrase: The mighty God, even the LORD
    kind: words
    title: Three names in a row
    body: |
      The psalm opens with three Hebrew names for God set side by side: *El*, *Elohim*, and the divine name that the King James prints as LORD. The King James joins them with “even.” A modern translation keeps three, “The mighty one, God the Lord,” and the Greek translators took the first two as one title: “The God of gods, the Lord.”

      The same three names stand together, twice over, in the answer of the eastern tribes when the rest of Israel accused them of breaking faith: “The LORD God of gods, the LORD God of gods, he knoweth” ([[Josh. 22:22]]).

      After this verse the divine name does not appear again in the psalm. From verse 2 on the psalm calls Him “God.”
    sources: [oshb-wlc, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 3
    phrase: Our God shall come, and shall not keep silence
    kind: symbol
    title: The God of Sinai comes to speak
    body: |
      God arrives as He arrived at Sinai, in fire and storm, and the first thing said of His coming is that He will not stay silent. At Sinai “there were thunders and lightnings, and a thick cloud upon the mount” ([[Ex. 19:16]]). Israel had been told that “the third day the LORD will come down” ([[Ex. 19:11]]), and the psalm’s “Our God shall come” has been set beside that promise. When He speaks in verse 7 He begins as the Ten Commandments begin ([[Ex. 20:2]]).

      One proposal is about when the psalm was sung: Psalms 50 and 81 “were likely sung at Pentecost,” the feast that “celebrated the giving of the Law to Moses on Mount Sinai.” The psalm itself names no feast.

      “Keep silence” is the phrase to watch. The same Hebrew verb returns in verse 21, “I kept silence,” where God says what the wicked made of His quiet. The coming announced here is the end of that silence.
    sources: [lds-scriptures, sc-knowhy-90, oshb-wlc]

  - ref: 4
    phrase: He shall call to the heavens from above, and to the earth
    kind: history
    title: Heaven and earth as witnesses
    body: |
      Heaven and earth are called as witnesses, which makes the scene a court and the psalm a case at law. Moses summoned the same two when he set the covenant before Israel: “I call heaven and earth to witness against you this day” ([[Deut. 4:26]]). His song opens, “Give ear, O ye heavens, and I will speak; and hear, O earth, the words of my mouth” ([[Deut. 32:1]]). Isaiah’s book begins the same way, with the Lord’s charge against children who “have rebelled against me” ([[Isa. 1:2]]). Verses 4–7 have “been described as God’s lawsuit against his people.”

      In this court “God is judge himself” (verse 6), and He is also the one who gives evidence: “I will testify against thee” (verse 7).

      The defendant is not the nations. The whole earth is called, “from the rising of the sun unto the going down thereof,” to watch the judging of “his people.”
    sources: [lds-scriptures, sc-knowhy-90]

  - ref: 5
    phrase: those that have made a covenant with me by sacrifice
    kind: words
    title: A covenant cut over sacrifice
    body: |
      The Hebrew says, word for word, that these are the people who cut God’s covenant over sacrifice, and the line has been read as pointing to the covenant made at Sinai. To “cut” a covenant is the Hebrew idiom for making one, explained from “the cutting up and distribution of the flesh of the victim for eating in the sacrifice of the covenants.” At Sinai young men “offered burnt offerings, and sacrificed peace offerings of oxen unto the LORD” ([[Ex. 24:5]]), and Moses sprinkled the blood on the people and said, “Behold the blood of the covenant, which the LORD hath made with you concerning all these words” ([[Ex. 24:8]]).

      Those summoned are called “my saints,” in a modern translation “my faithful ones.” The Hebrew word, *hasid*, is explained at [[Ps. 4:3]]. On one older reading “saints” names their standing and not their conduct: the accused “are mentioned by names which, without their state of mind and heart corresponding to them, express the relationship to Himself in which God has placed them.”
    sources: [oshb-wlc, bdb, lds-scriptures, nrsvue, delitzsch-psalms]

  - ref: 5
    phrase: Gather my saints together unto me
    kind: prophets
    title: The gathering before the Lord comes
    body: |
      The gathering of verses 3–5 has been read of the last days. The sixth of the Lectures on Faith, printed in the 1835 Doctrine and Covenants, says that “in the last days, before the Lord comes, he is to gather together his saints who have made a covenant with him by sacrifice,” and then quotes the three verses. Its subject at that point is sacrifice as the way a person knows that God accepts him: “from the days of righteous Abel to the present time, the knowledge that men have that they are accepted in the sight of God, is obtained by offering sacrifice.”

      In the psalm the gathering is a summons to court (verse 4), and those gathered are the covenant people.
    sources: [jsp-dc-1835, lds-scriptures]

  - ref: 8
    phrase: I will not reprove thee for thy sacrifices
    kind: history
    title: The altar is not what is wrong
    body: |
      God says outright that Israel’s sacrifices are not the charge against them. A modern translation makes the second half of the verse a plain statement: “your burnt offerings are continually before me.” The offerings are being made.

      What He denies is that He needs them. Verses 9–13 go through the stalls and the forests and the hills, and every animal is already His. “If I were hungry, I would not tell thee” (verse 12), and the question of verse 13 expects the answer no.

      Sacrifice had other purposes. Offerings “were accompanied by prayer, devotion, and dedication, and represented an acknowledgment on the part of the individual of his duty toward God, and also a thankfulness to the Lord for his life and blessings.” Verse 14 asks for the thankfulness.
    sources: [nrsvue, bd-sacrifices]

  - ref: 14
    phrase: Offer unto God thanksgiving
    kind: words
    title: Thanksgiving as the sacrifice
    body: |
      “Offer” is the Hebrew verb for sacrificing, and “thanksgiving” is also the name of an offering, so the line can be heard in two ways. The noun, *todah*, means “thanksgiving in songs of liturgical worship” and also the “thank-offering,” which the law treats as one kind of peace offering: “the sacrifice of thanksgiving” ([[Lev. 7:12]]). The Greek has “Offer to God the sacrifice of praise,” and a modern translation “Offer to God a sacrifice of thanksgiving.”

      On one reading the verse asks for that offering at the altar; a standard lexicon lists this verse under the thank-offering. On another, older reading the altar offering is set aside here for what it was meant to carry: in its place “God desires the thanksgiving of the heart and the performance of that which has been vowed.” The two agree on what is asked for, which is thanks.

      Verses 14–15 then give a sequence: vows, a call “in the day of trouble,” deliverance, and God glorified. The law knew a vowed offering beside the thank-offering ([[Lev. 7:16]]).
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, delitzsch-psalms, lds-scriptures]

  - ref: 16
    phrase: What hast thou to do to declare my statutes
    kind: scripture
    title: Reciting the law and breaking it
    body: |
      The second speech is to people who can recite the covenant and do not keep it. The charge names three things: going along with a thief, sharing with adulterers, and a mouth given to deceit and to slander of a brother (verses 18–20). Theft, adultery and false witness are the eighth, seventh and ninth of the Ten Commandments ([[Ex. 20:14–16]]), and the charge has been read as naming the three in turn.

      Abinadi put the same question to the priests of King Noah. They told him, “We teach the law of Moses” ([[Mosiah 12:28]]), and he answered, “If ye teach the law of Moses why do ye not keep it?” ([[Mosiah 12:29]]). The likeness has been pointed out: “In order to teach the law, one must keep it or be cursed (Psalm 50:16, 22); this is the essence of Abinadi’s accusation.”
    sources: [lds-scriptures, sc-knowhy-90, delitzsch-psalms]

  - ref: 21
    phrase: thou thoughtest that I was altogether such an one as thyself
    kind: words
    title: What the wicked made of God’s silence
    body: |
      While God kept silent the wicked concluded that He was like them, and He answers by laying out His case. The Greek adds a judgment on the thought: “thou thoughtest wickedly that I should be like thee.”

      “Reprove” is the word of verse 8. There God said, “I will not reprove thee” for sacrifices. Here, of these things, “I will reprove thee.”

      “Set them in order” is a word that fits a courtroom. The Hebrew verb means to arrange, as one would “set or lay in order” wood on an altar or draw up troops “in battle order.” In a legal setting it is to “state in order, set forth a legal case,” the sense proposed for this verse. A modern translation has “lay the charge before you.”

      The verb has no object in the Hebrew, so translators supply one. The King James has “them,” and the Greek “thine offences.” The Joseph Smith Translation supplies another: “and set covenants in order.” Covenant is the psalm’s word for what these people made (verse 5) and what they take in their mouths (verse 16).
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, lds-scriptures]

  - ref: 23
    phrase: to him that ordereth his conversation aright
    kind: words
    title: Conversation means conduct
    body: |
      “Conversation” in the King James means the way a person lives, not talk, and the Hebrew is only two words, one for setting and one for a way. That sense was still listed first in 1828: “General course of manners; behavior; deportment; especially as it respects morals.” A modern translation has “those who go the right way.” The Greek translators divided the line differently: “that is the way wherein I will shew to him the salvation of God.”

      The first half of the verse returns to verse 14. “Whoso offereth praise” has the same Hebrew verb and noun as “Offer unto God thanksgiving,” and “glorifieth me” has the verb of verse 15, “thou shalt glorify me.”
    sources: [webster-1828, oshb-wlc, nrsvue, lxx-rahlfs]

christ: |
  The psalm says that “God is judge himself” (verse 6), and the Church’s edition points from that line to Jesus Christ as Judge. The Savior said of Himself, “For the Father judgeth no man, but hath committed all judgment unto the Son” ([[John 5:22]]). The same edition reads the psalm of His Second Coming, and the Lectures on Faith read its gathering of the last days (see the second note on verse 5).

  The judge of this psalm is also the deliverer. In the middle of His testimony against Israel He says, “call upon me in the day of trouble: I will deliver thee” (verse 15), and the psalm’s last words are “the salvation of God.”

  One older reading hears in the two speeches what Jesus later taught on the mount: “the very same discourse concerning the worthlessness of dead works and concerning the true will of God that Jesus addresses to the assembled people when He enters upon His ministry.”

explore: |
  - **The other psalm of Sinai.** [[Ps. 81:8–10]], also Asaph’s by its title, has “Hear, O my people, and I will testify unto thee” and the opening words of the Ten Commandments.
  - **Sacrifice elsewhere in the Psalms.** [[Ps. 40:6–8]] and [[Ps. 51:16–19]]. Samuel’s word to Saul is in [[1 Sam. 15:22]]; on one older reading these psalms and Psalm 50 “are all echoes of the grand utterance of Samuel.”
  - **Heaven and earth as witnesses.** The song of Moses, [[Deut. 32:1–43]], and [[Isa. 1:2]].
  - **Abinadi before Noah’s priests.** [[Mosiah 12:25–37]], read beside verses 16–21.
  - **Asaph’s other psalms.** Psalms 73–83. [[Ps. 82:1]] is another scene of God judging.

parallels:
  - ref: Deut. 32:1
    note: Moses calls on the heavens and the earth to hear, as God calls them in verse 4.
  - ref: Ex. 24:8
    note: The covenant at Sinai is sealed with the blood of sacrifice; verse 5 speaks of a covenant made by sacrifice.
  - ref: Ps. 81:8
    note: Another psalm of Asaph in which God says, “Hear, O my people, and I will testify unto thee.”
  - ref: Mosiah 12:29
    note: Abinadi asks Noah’s priests why they teach the law and do not keep it, the charge of verse 16.
  - ref: John 5:22
    note: The Father “hath committed all judgment unto the Son.”

