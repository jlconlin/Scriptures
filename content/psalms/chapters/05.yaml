chapter: 5
title: In the Morning
tagline: A man with enemies sets his prayer before his King at daybreak, enters the Lord’s house by the abundance of His mercy, and asks that all who take refuge in Him be covered as with a shield.
when: 'Undated; a psalm of David by its title'

setting: |
  The title ascribes the psalm to David and names no occasion.

  The prayer is said in the morning (verse 3). It “can be seen as another morning prayer for protection and justice,” and it follows two psalms often read as a pair, Psalm 3 as a prayer for the morning and Psalm 4 as one for the evening (see the note on [[Ps. 3:5]]). The speaker says he will come into the Lord’s house (verse 7). He has enemies, and most of what the psalm says of them concerns their speech: they lie, they flatter, they plot (verses 6, 9–10). He asks for two things, that the Lord lead him and that the Lord judge them.

  Two of its lines meet the reader again in later scripture. Paul quotes verse 9 in the chain of scriptures by which he shows that all are under sin ([[Rom. 3:13]]). And the language of the psalm has been set beside Nephi’s psalm, which makes the request of verse 8 ([[2 Ne. 4:33]]).

thread: |
  The psalm “presents a case to the Lord for why his enemies should be punished and why the righteous should be preserved,” and it is built by turning back and forth between the two parties.

  It opens by asking to be heard (verses 1–3). Then it describes the God who is being asked: He takes no pleasure in wickedness, and the boaster, the liar and the man of blood cannot stand before Him (verses 4–6). “But as for me” (verse 7): the speaker will come into the house. Then the enemies again, their mouths and throats and tongues (verses 9–10). Then “But let all those that put their trust in thee rejoice” (verses 11–12).

  **The turn is at verse 7: “But as for me.”** Verse 4 has just said that evil cannot lodge with God. The speaker says he will enter “in the multitude of thy mercy,” and the righteousness he then asks to be led in is the Lord’s: “thy righteousness” (verse 8).

  The Hebrew phrase behind “in the multitude of” comes once more, in verse 10, where the enemies are to be cast out “in the multitude of their transgressions.” The reason the verse gives is “they have rebelled against thee.”

  The last two verses widen from “me” to “all those that put their trust in thee.” The psalm that began with one man’s murmur ends with the righteous surrounded by the Lord’s favour.

sections:
  - range: 1-3
    heading: Hear me in the morning
    plain: |
      Listen to my words, LORD; understand my murmuring. Pay attention to the sound of my cry, my King and my God, for it is to You that I pray. In the morning, LORD, You will hear my voice. In the morning I will set my prayer in order before You, and I will keep watch.
  - range: 4-6
    heading: Who cannot stand before Him
    plain: |
      For You are not a God who takes pleasure in wickedness, and evil cannot be Your guest. Boasters will not keep their place before Your eyes. You hate all who do iniquity. You will destroy those who speak lies; the LORD abhors the man of blood and deceit.
  - range: 7-8
    heading: But as for me
    plain: |
      But I, by the abundance of Your mercy, will come into Your house. In reverence for You I will bow down toward Your holy temple. Lead me, LORD, in Your righteousness, because of my enemies; make Your way straight in front of me.
  - range: 9-10
    heading: The case against the enemies
    plain: |
      For nothing in their mouth can be relied on. Within they are wickedness itself, their throat is an open grave, and they make their tongue smooth. Hold them guilty, God. Let them fall by their own plans. For the abundance of their transgressions cast them out, because they have rebelled against You.
  - range: 11-12
    heading: Joy under His cover
    plain: |
      But let all who take refuge in You rejoice. Let them sing for joy for ever, because You defend them, and let those who love Your name be joyful in You. For You, LORD, will bless the righteous; You will surround him with favour as with a great shield.

notes:
  - ref: 0
    phrase: Nehiloth
    kind: words
    title: Nehiloth
    body: |
      Nehiloth is taken as a direction that the psalm be accompanied by “wind instruments,” as the Neginoth in the title of Psalm 4 is taken of strings. A modern translation accordingly prints “for the flutes.”

      That is the usual explanation, and it rests on little. The word stands in this title and nowhere else, and strictly it is of “meaning unknown.” The link with the Hebrew word for a flute has been disputed, and the word has also been thought “possibly designation of a melody.” The ancient Greek translators read a different word altogether and wrote “concerning her that inherits.”

      The address to the chief Musician is explained at the title of Psalm 4 ([[Ps. 4:1]]). What a title is, and what it is worth as evidence, is discussed at the title of Psalm 3 ([[Ps. 3:1]]).
    sources: [bd-psalms, bdb, nrsvue, lxx-rahlfs]
  - ref: 1
    phrase: consider my meditation
    kind: words
    title: A murmur before a cry
    body: |
      The “meditation” the Lord is asked to consider is something barely spoken. The Hebrew noun means a “whisper, musing,” and the line is rendered “understand my murmuring (whispering, faint utterance).” A modern translation has “attend to my sighing.”

      The prayer gives itself three names in two verses: “my words,” this “meditation,” and then “the voice of my cry” (verse 2).
    sources: [bdb, nrsvue]
  - ref: 3
    phrase: in the morning will I direct my prayer unto thee, and will look up
    kind: words
    title: A prayer set in order, and a watch kept
    body: |
      “Direct” translates a verb for arranging things in order, and “look up” a verb for keeping watch: the speaker lays something out before the Lord at daybreak and then looks out for the answer.

      What he lays out the Hebrew does not say. The verb, to “arrange or set in order,” has no object in this line, and the King James supplies “my prayer.” The same verb is used for laying the wood and the offering on an altar, and also for setting out words, as when one must “state in order, set forth a legal case.” Two readings follow.

      In one older reading the picture is the altar. The priests laid the wood for the morning offering at dawn, and “the morning prayer is compared to this morning sacrifice”: the speaker “brings his prayer before God as a spiritual sacrifice and looks out for an answer.”

      In the other, what is arranged is words. This is the more probable sense of the verb here, to “arrange words” rather than “arranging a sacrifice,” and a modern translation prints “in the morning I plead my case to you and watch.”

      On either reading he then waits. The second verb means to “look out or about,” to “keep watch,” and here “I will look out (expectantly).” Habakkuk uses the same verb when he takes his post: “I will stand upon my watch, and set me upon the tower, and will watch to see what he will say unto me” ([[Hab. 2:1]]).
    sources: [bdb, oshb-wlc, delitzsch-psalms, nrsvue]
  - ref: 4
    phrase: neither shall evil dwell with thee
    kind: symbol
    title: Evil cannot be God’s guest
    body: |
      “Dwell” here is the verb for lodging with someone as a guest, and the line has been rendered “evil cannot be a guest of thine.” The verb’s ordinary sense is to “sojourn,” to live somewhere as a newcomer, and a modern translation keeps it: “evil will not sojourn with you.”

      The Psalms use this verb of the worshipper in the Lord’s house. Psalm 15 opens with it: “LORD, who shall abide in thy tabernacle?” ([[Ps. 15:1]]). That psalm asks who may be the Lord’s guest. This verse says who may not, and verses 5–6 name them one by one before the speaker says, in verse 7, that he will go in.

      Who may ascend the hill of the Lord is taken up at [[Ps. 24:3]].
    sources: [bdb, nrsvue]
  - ref: 5
    phrase: thou hatest all workers of iniquity
    kind: words
    title: The boasters, and the God who hates iniquity
    body: |
      The verse says outright that God hates those who work iniquity, and one older reading takes this as the other side of His holiness: “if He did not hate evil (Psalm 11:5), His love would not be a holy love.” The psalm it cites reads: “The LORD trieth the righteous: but the wicked and him that loveth violence his soul hateth” ([[Ps. 11:5]]).

      “The foolish” of the same verse are a particular kind of fool. The Hebrew word means “boastful ones, boasters,” and a modern translation has “The boastful will not stand before your eyes.”

      The psalm itself says two more things of the same God. He has mercy in abundance (verse 7), and those who are cast out are those who “have rebelled against thee” (verse 10).
    sources: [delitzsch-psalms, bdb, nrsvue]
  - ref: 7
    phrase: thy holy temple
    kind: history
    title: A house and a temple in David’s day
    body: |
      Solomon built the temple ([[1 Kgs. 6:1]]), but the words “house” and “temple” were used of the Lord’s sanctuary before it. At Shiloh, when Hannah prayed for a son, “Eli the priest sat upon a seat by a post of the temple of the LORD” ([[1 Sam. 1:9]]); the Hebrew word is the one in this verse, used there “of early, pre-Solomonic house at Shiloh.” And of David himself it is told that after his child died he “came into the house of the LORD, and worshipped” ([[2 Sam. 12:20]]).

      David’s sanctuary in Jerusalem was a tent, “the tabernacle that David had pitched for it,” that is, for the ark ([[2 Sam. 6:17]]). One older reading takes the psalm of that tent: “It is the tabernacle on Zion in which was the ark of the covenant that is meant here.” On that reading David is in Jerusalem, about to go up to the morning service, and he will enter the court and “prostrate himself in worship” toward the inner sanctuary. Whether the title is right to ascribe the psalm to David is a separate question (see [[Ps. 3:1]]).

      The verb for “worship” is one of bowing down, as in a modern translation: “I will bow down toward your holy temple.”

      He comes in “in the multitude of thy mercy.” The word for mercy is *hesed*, the “steadfast love” of a modern translation, which is explained at [[Ps. 51:1]].
    sources: [lds-scriptures, bdb, delitzsch-psalms, nrsvue, oshb-wlc]
  - ref: 8
    phrase: make thy way straight before my face
    kind: scripture
    title: Nephi’s psalm asks for the same thing
    body: |
      Nephi’s psalm makes the request of this verse, in nearly its words: “Wilt thou make my path straight before me!” ([[2 Ne. 4:33]]).

      The likeness is wider than one line. The two prayers have been set side by side for their “similarity of language.” Both cry to the Lord. Both ask for help on account of enemies, the psalm “because of mine enemies” and Nephi with “Do not anger again because of mine enemies” ([[2 Ne. 4:29]]). And where the psalm closes with the righteous surrounded by favour as by a shield (verse 12), Nephi asks, “O Lord, wilt thou encircle me around in the robe of thy righteousness!” ([[2 Ne. 4:33]]).

      What has been pointed out is a likeness of language. It is not shown that Nephi was quoting this psalm.
    sources: [ot-minute-psalms-1-20, lds-scriptures]
  - ref: 9
    phrase: their throat is an open sepulchre
    kind: scripture
    title: Paul says it of everyone
    body: |
      Paul quotes this line, and he does not say it of his enemies. He says it of all humankind. In Romans 3 he has “proved both Jews and Gentiles, that they are all under sin” ([[Rom. 3:9]]), and he supports the charge with what is written: “Their throat is an open sepulchre; with their tongues they have used deceit” ([[Rom. 3:13]]). The line is one link in “a chain of partial scriptural quotations,” drawn from several psalms, Proverbs and Isaiah and run together without a break.

      Paul’s second clause is not the King James’s “they flatter with their tongue.” His wording is that of the ancient Greek translation of the psalm: “with their tongues they have used deceit.” In the Hebrew they “make smooth” the tongue, which is to “flatter with it.”

      In the psalm the four parts named in this verse, mouth, inward part, throat and tongue, belong to the speaker’s enemies. In Romans the description is of every mouth: Paul’s chain ends “that every mouth may be stopped, and all the world may become guilty before God” ([[Rom. 3:19]]).
    sources: [lds-scriptures, sc-knowhy-535, lxx-rahlfs, bdb]
  - ref: 10
    phrase: Destroy thou them, O God
    kind: words
    title: Hold them guilty
    body: |
      “Destroy thou them” is, in the Hebrew, a verdict asked of a judge: “declare them guilty.” A modern translation has “Make them bear their guilt, O God,” and the ancient Greek, “Judge them, O God.”

      The rest of the verse keeps to that. The enemies are to fall by their own counsels, so that what undoes them is what they planned. They are to be cast out for the number of their transgressions. And the reason given at the end is not the harm done to the speaker: “for they have rebelled against thee.”

      The speaker asks God to judge and does nothing himself. How prayers of this kind are read, and how they stand beside the Savior’s command to love one’s enemies, is taken up at [[Ps. 137:8]].
    sources: [bdb, nrsvue, lxx-rahlfs]
  - ref: 12
    phrase: with favour wilt thou compass him as with a shield
    kind: symbol
    title: A shield that covers the whole body
    body: |
      The shield of the last line is the great one, a “large shield (covering whole body),” larger than the ordinary shield. It is the kind Goliath had carried ahead of him: “one bearing a shield went before him” ([[1 Sam. 17:7]]).

      “Compass” means surround: “as with a shield, with favour will thou surround him.” What stands around the righteous on every side is the Lord’s favour.

      The verse before has a covering as well. Where the King James has “thou defendest them,” a modern translation has “Spread your protection over them.”
    sources: [bdb, nrsvue]

christ: |
  Psalm 5 points to the Savior in the One it addresses. The LORD of the psalm is Jehovah, and “Jehovah is the premortal Jesus Christ.” He is the One the speaker calls “my King, and my God” (verse 2), into whose house a man comes by the abundance of His mercy (verse 7), and who surrounds the righteous with favour (verse 12).

  Paul carries one line further. He uses verse 9 to show that all are under sin (see the note on that verse), and a few verses later he gives the remedy: “Being justified freely by his grace through the redemption that is in Christ Jesus” ([[Rom. 3:24]]).

explore: |
  - **Morning and evening.** Read Psalms 3, 4 and 5 together: [[Ps. 3:5]], [[Ps. 4:8]] and verse 3 here.
  - **Paul’s chain.** [[Rom. 3:9–26]], from the charge that all are under sin to the redemption that is in Christ Jesus.
  - **Nephi’s psalm.** [[2 Ne. 4:16–35]], beside verses 2–3, 7–8 and 11–12.
  - **The Lord’s guest.** [[Ps. 15:1–5]] and [[Ps. 24:3–6]], on who may lodge in His tabernacle and stand in His holy place.

parallels:
  - ref: Rom. 3:13
    note: Paul quotes verse 9, in its Greek form, of all humankind.
  - ref: 2 Ne. 4:33
    note: Nephi asks that his path be made straight before him and that he be encircled in the robe of the Lord’s righteousness.
  - ref: Ps. 15:1
    note: The same Hebrew verb, of the one who may lodge in the Lord’s tabernacle.
  - ref: Hab. 2:1
    note: The prophet keeps watch for the Lord’s answer, in the verb of verse 3.

