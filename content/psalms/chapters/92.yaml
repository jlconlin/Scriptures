chapter: 92
title: A Song for the Sabbath Day
tagline: The one psalm given to the Sabbath calls it good to praise the LORD for His works, and sets the grass of the wicked beside the trees planted in His house.
when: 'Undated; the title names no author and gives the psalm to the Sabbath day'

setting: |
  No author is named and no occasion in anyone’s life. The title gives the psalm to a day instead, and it is the only place in the book of Psalms where the word Sabbath is written.

  The psalm is the third of the fourth book (Psalms 90–106), the section that begins with the prayer of Moses and in which many psalms look to a day of rest under the Messiah’s reign. It shares more with that prayer than its place; the notes on verses 4 and 15 follow the words it has in common with Psalm 90 and with the song of Moses.

  It is a song of thanksgiving, the kind sung by a person or a people after God has delivered them, and usually beside a sacrifice at the temple. The psalm’s own details fit that. It has instruments (verse 3), it speaks of the house of the LORD and the courts of our God (verse 13), and its singer says “I” and “my” in verses 4, 10, 11 and 15. He tells nothing else of himself. His enemies are also the LORD’s (verse 9), and by the end he is speaking of the righteous as a company.

  Latter-day revelation gives its own law of the Sabbath in Doctrine and Covenants 59, and the Church’s edition joins the first verse of the psalm to it (see the note on verse 1).

thread: |
  The psalm begins by calling praise good and ends by showing who is still praising in old age. **Between the two it answers a difficulty in one line: the wicked flourish, and the LORD is on high for ever.**

  Verses 1–3 say what is good: to give thanks, to sing, to declare the LORD’s lovingkindness in the morning and His faithfulness at night, with the ten-stringed instrument and psaltery of [[Ps. 33:2]] and the harp’s “solemn sound,” the word explained at [[Ps. 9:16]]. Lovingkindness is the covenant love explained at [[Ps. 51:1]]. Verse 4 gives the reason: “thou, LORD, hast made me glad through thy work.”

  Verses 5–7 turn from gladness to depth. God’s thoughts are “very deep,” and there is something a brutish man does not know. The wicked spring up like grass, and all the workers of iniquity flourish. The psalm does not deny that they do. It says where the flourishing ends: “that they shall be destroyed for ever.”

  Verse 8 stands alone in the middle, the shortest line of the psalm: “But thou, LORD, art most high for evermore.” Everything after it is seen from there. The LORD’s enemies perish and are scattered (verse 9). The singer’s horn is lifted and he is anointed with fresh oil (verse 10).

  The last four verses answer the grass with trees. The righteous flourish too, with the same Hebrew verb, but as a palm and a cedar, planted in the house of the LORD and still bearing in old age. They are there “to shew that the LORD is upright,” with the verb verse 2 used for declaring His lovingkindness, and the singer closes with his own witness, “he is my rock.”

sections:
  - range: 1-4
    heading: It is good to give thanks
    plain: |
      It is good to give thanks to the LORD and to sing praises to Your name, Most High; to declare Your lovingkindness in the morning and Your faithfulness in the nights, on the instrument of ten strings and the psaltery, with the solemn sound of the harp. For You, LORD, have made me glad by what You have done; at the works of Your hands I sing for joy.
  - range: 5-9
    heading: What the fool does not see
    plain: |
      How great Your works are, LORD! Your thoughts are very deep. A brutish man does not know, and a fool does not understand this: when the wicked sprout like grass and all who do evil blossom, it is that they will be destroyed for ever. But You, LORD, are on high for ever. For look, Your enemies, LORD, look, Your enemies will perish; all who do evil will be scattered.
  - range: 10-11
    heading: My horn lifted up
    plain: |
      But You have lifted up my horn like the horn of a wild ox; I am anointed with fresh oil. My eye has looked on my enemies, and my ears have heard of the evildoers who rise against me. (The King James puts these verses in the future.)
  - range: 12-15
    heading: Planted in the house of the LORD
    plain: |
      The righteous will flourish like the palm tree and grow like a cedar in Lebanon. Planted in the house of the LORD, they will flourish in the courts of our God. In old age they will still bear fruit; they will be full of sap and green, to declare that the LORD is upright. He is my rock, and there is no unrighteousness in Him.

notes:
  - ref: 0
    phrase: for the sabbath day
    kind: history
    title: The psalm for the Sabbath day
    body: |
      The title gives the psalm to the Sabbath, and the word is written nowhere else in the book of Psalms. A modern translation divides the Hebrew title into two, “A Psalm. A Song for the Sabbath Day.” The ancient Greek translation has the same day in its title: “A Psalm of a Song for the Sabbath-day.”

      Later Jewish tradition records how it was used. The Talmud is cited for a list of psalms “sung on each day of the week,” and the list ends with “Saturday (the Sabbath), Psalm 92.” It has been placed in the temple service after the exile, sung “in the morning at the drink-offering” of the first daily lamb. On the Sabbath “the daily sacrifices were doubled” (see [[Num. 28:9–10]]).

      After its title the psalm says nothing of the Sabbath, of rest, or of a seventh day. The rabbis of the Talmud are reported to have disagreed over which Sabbath the title means, “the Sabbath of the Creation” or “the final Sabbath of the world’s history,” which one of them called “the day that is altogether Sabbath.” The second has been judged “relatively more correct,” since the psalm looks to an end in which the wicked are gone and the righteous flourish. That is one commentator’s reading. The title itself names only the day.
    sources: [oshb-wlc, nrsvue, lxx-rahlfs, hopkin-psalms-sung, delitzsch-psalms, bd-sabbath]
  - ref: 1
    phrase: to give thanks unto the LORD
    kind: scripture
    title: Thanks and the Lord’s day in Doctrine and Covenants 59
    body: |
      The Church’s edition joins this verse to the revelation that gives the Sabbath law for this dispensation, the revelation that “confirms the significance of the Sabbath (or Lord’s day).” Its footnote on “thanks” is to the command “Thou shalt thank the Lord thy God in all things” ([[D&C 59:7]]).

      Two verses later the same revelation turns to the day. The Saints are to go to the house of prayer “upon my holy day” ([[D&C 59:9]]), “For verily this is a day appointed unto you to rest from your labors, and to pay thy devotions unto the Most High” ([[D&C 59:10]]). The psalm addresses its praise by that title, “O most High.” The revelation asks that the day be kept “with thanksgiving, with cheerful hearts and countenances” ([[D&C 59:15]]).

      The footnote makes only the first of these connections. The rest is the revelation’s own wording, set here beside the psalm’s.
    sources: [lds-scriptures, bd-sabbath]
  - ref: 4
    phrase: through thy work
    kind: words
    title: Which works make him glad
    body: |
      The works that gladden the singer are wider than the six days of creation. “The works of thy hands” is the phrase another psalm uses for the creation over which man was given dominion ([[Ps. 8:6]]), and yet the phrase is also used, in this verse among others, of the LORD’s deeds “especially in deliverance and in judgment.”

      The Sabbath was kept for both kinds of work. It commemorated God’s rest at the Creation ([[Ex. 20:11]]) and also the redemption from Egypt ([[Deut. 5:15]]), so that the day was “symbolic of the mighty works of God.”

      The prayer of Moses two psalms earlier has this verse’s words. It prays, “O satisfy us early with thy mercy; that we may rejoice and be glad all our days” ([[Ps. 90:14]]), and then, “Let thy work appear unto thy servants” ([[Ps. 90:16]]). In Hebrew “early” is “in the morning” and “mercy” is the “lovingkindness” of verse 2 here, both in the same words. “Rejoice,” “be glad” and “thy work” are the Hebrew words behind “triumph,” “made me glad” and “thy work” in this verse. Neither psalm says that the one answers the other. The words are shared: Psalm 90 has them in a request, and this psalm in thanks.
    sources: [oshb-wlc, bdb, bd-sabbath, lds-scriptures]
  - ref: 6
    phrase: neither doth a fool understand this
    kind: words
    title: What the fool does not understand
    body: |
      “This” can point back to the depth of God’s thoughts or forward to verse 7, and a modern translation takes it forward. It ends the verse with a colon, “the stupid cannot understand this:” and goes on, “though the wicked sprout like grass,” “they are doomed to destruction forever.” Read that way, what the fool misses is where the prosperity of the wicked ends. The King James, with its full stop after verse 6, leaves the word free to point back to verse 5.

      “Brutish” translates a noun meaning “brutishness,” and it is not kept for the wicked. Psalm 73 is troubled by this same sight, “I was envious at the foolish, when I saw the prosperity of the wicked” ([[Ps. 73:3]]), and its speaker uses the word of himself: “So foolish was I, and ignorant: I was as a beast before thee” ([[Ps. 73:22]]). What changed him was the sanctuary: he “went into the sanctuary of God; then understood I their end” ([[Ps. 73:17]]).

      The grass says how long the flourishing lasts. “Spring” is a verb for budding and sending out shoots, and “flourish” in verse 7 is the verb Moses’ prayer uses of grass: “In the morning it flourisheth, and groweth up; in the evening it is cut down, and withereth” ([[Ps. 90:6]]). Verse 12 will set trees against it.
    sources: [nrsvue, bdb, oshb-wlc, lds-scriptures]
  - ref: 8
    phrase: But thou, LORD, art most high for evermore
    kind: structure
    title: The line at the centre
    body: |
      Verse 8 is the middle of the psalm and its shortest line: four words in Hebrew, with seven verses before it and seven after. It stands between the two sentences on the wicked. Verse 7 has them destroyed “for ever,” and verse 9 has them perish and scatter. Between them the psalm turns to God and says only where He is, and for how long.

      “Most high” here is not the title of verse 1. That was a name, *Elyon*. This is a noun for a height, used by itself for the “height of heaven,” and a modern translation has the LORD “on high forever.”

      The divine name is written seven times in the psalm, and the fourth of the seven is in this verse. The seven has been read as the Sabbath’s number: the psalm “repeats the most sacred Name seven times,” and on a division of it into five stanzas the middle one is counted as seven lines, so that “the middle of the Psalm bears the stamp of the sabbatic number.” That is one commentator’s observation, and his middle is that stanza, not this verse. The count of the name can be checked in the text, and nothing in the psalm says whether the poet intended it.
    sources: [oshb-wlc, bdb, nrsvue, delitzsch-psalms]
  - ref: 10
    phrase: I shall be anointed with fresh oil
    kind: words
    title: Fresh oil, and a deliverance already given
    body: |
      A modern translation reads the verbs of verses 10 and 11 as past, so that the singer is giving thanks for something done: “But you have exalted my horn like that of the wild ox,” and “you have anointed me with fresh oil.” The King James puts both verses in the future. The past reading suits a song of thanksgiving (see the setting).

      The verb behind “anointed” is not the usual one. Elsewhere it means to mix, and it is the “technical term of sacrifice” for an offering’s flour mixed with oil. In the sense it has in this verse it is found nowhere else (“verb not elsewhere in this sense”). The ancient Greek translators read the same letters as another word and wrote “mine old age with rich mercy.” That reading “is not favoured by context,” and the line is left “doubtful.”

      “Fresh” is an adjective for trees, “luxuriant, fresh,” and here it is given to oil. It comes back in verse 14, where the righteous in old age are “flourishing.” The singer’s oil and the righteous in their old age have one word.

      Who the singer is the psalm does not say. A horn is strength, as explained at [[Ps. 18:2]], and the “unicorn” is a wild ox, as at [[Ps. 29:6]].
    sources: [nrsvue, bdb, lxx-rahlfs, oshb-wlc]
  - ref: 11
    phrase: see my desire on mine enemies
    kind: words
    title: “My desire” is supplied
    body: |
      The Hebrew has no word for “desire” in this verse. It says that the singer’s eye has looked on his enemies and that his ears hear of those who rise against him. The King James supplies “my desire” twice, as it supplies “his desire” at [[Ps. 54:7]], where the idiom is explained. The noun for the enemies in the first half is a “dubious word.” The ancient Greek has simply “mine eye has seen mine enemies,” and a modern translation supplies an object of its own, “My eyes have seen the downfall of my enemies.”

      The psalm before this one has the same sight, with the same Hebrew verb for looking: “Only with thine eyes shalt thou behold and see the reward of the wicked” ([[Ps. 91:8]]).
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue]
  - ref: 12
    phrase: flourish like the palm tree
    kind: symbol
    title: Grass answered by trees
    body: |
      The righteous are given the same verb as the wicked and a different plant. “Flourish” in verses 12 and 13 is the Hebrew verb the King James translated “spring” in verse 7, and it is used within this one psalm both “of righteous” and “of wicked.” There the wicked sprouted as grass. Here the righteous sprout as a palm and as a cedar of Lebanon, and verse 14 says what the difference is: “They shall still bring forth fruit in old age.”

      “Planted” is the word used of the tree by the water in [[Ps. 1:3]]. That psalm sets its tree by rivers of water. This one sets its trees in the house of the LORD and the courts of our God. An olive tree stands in the same place in [[Ps. 52:8]].

      “Fat and flourishing” describes a tree. The first word is “fat, full of oil (?) or sap,” and the second is the “fresh” of verse 10; a modern translation has “they are always green and full of sap.”

      Verse 15 goes on from the fruit to its purpose: “To shew that the LORD is upright.” The verb is the “shew forth” of verse 2. The psalm began by calling it good to declare the LORD’s lovingkindness and faithfulness, and it ends with the old, planted in His courts, who are still declaring.
    sources: [bdb, oshb-wlc, nrsvue]
  - ref: 15
    phrase: he is my rock, and there is no unrighteousness in him
    kind: scripture
    title: The opening of the song of Moses
    body: |
      The last verse says in the singer’s own voice what Moses’ song says at its beginning: “He is the Rock, his work is perfect: for all his ways are judgment: a God of truth and without iniquity, just and right is he” ([[Deut. 32:4]]). “Rock” and “right” (“upright” here) are the same Hebrew words in both, and “iniquity” and “unrighteousness” are two forms of one word. Three more words of that verse are earlier in the psalm: “work” (verse 4), “truth” (the “faithfulness” of verse 2), and “just” (“the righteous” of verse 12).

      The old who flourish in the courts have accordingly been read as those who live long in order “to confirm the confession which Moses, in Deuteronomy 32:4, places at the head of his great song.” It is also reported that at the Sabbath offering of [[Num. 28:9]] “a part of the song Deuteronomy 32” was sung. On that report the psalm and the song belonged to the worship of the same day.

      The rock is a figure of God “as support and defence of his people.” Moses says “the Rock.” The psalm’s singer says “my rock.”
    sources: [lds-scriptures, oshb-wlc, delitzsch-psalms, bdb]

christ: |
  The LORD whose works this psalm sings is Jehovah, and “Jehovah is the premortal Jesus Christ.” The day the psalm was sung on was kept in memory of His works, the Creation and the deliverance from Egypt. After His Ascension the Church kept the first day of the week as a commemoration of a third, His Resurrection.

  He said of Himself, “the Son of man is Lord also of the sabbath” ([[Mark 2:28]]). In this dispensation He is the one who speaks of “my holy day” and appoints it for devotions “unto the Most High” (see the note on verse 1).

  The psalm’s own witness of Him is its last line. Those who have lived longest in His house are there to declare that He is upright, and that there is no unrighteousness in Him.

explore: |
  - **Moses beside the psalm.** Read [[Deut. 32:1–4]] with verse 15, and [[Ps. 90:13–17]] with verses 2–4.
  - **The prosperity of the wicked.** [[Ps. 73:1–28]] works through at length what verses 6–7 say in two lines; [[Ps. 37:35–36]] has the wicked as a spreading tree that passes away.
  - **The Lord’s day.** [[D&C 59:7–21]], where thanksgiving, the house of prayer, and the fulness of the earth are joined to the Sabbath.

parallels:
  - ref: Deut. 32:4
    note: The opening of the song of Moses, whose words (rock, right, without iniquity) close the psalm.
  - ref: Ps. 90:14–16
    note: Moses’ prayer asks for mercy in the morning, gladness, and the sight of God’s work; verses 2 and 4 have the same Hebrew words.
  - ref: Ps. 73:17–22
    note: Another psalm on the end of the wicked, whose speaker calls himself by the word translated “brutish” here.
  - ref: D&C 59:7–12
    note: The Lord’s law of the Sabbath, joined to verse 1 by the Church’s footnote.
  - ref: Ps. 1:3
    note: The tree planted by the water, with the same word for “planted” (also Ps. 52:8).
  - ref: Ps. 91:8
    note: The righteous look on the reward of the wicked.

