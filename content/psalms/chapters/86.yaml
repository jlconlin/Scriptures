chapter: 86
title: Unite My Heart
tagline: A servant in danger asks to be heard, and the reasons he gives move from his own need to what the Lord has said He is.
when: 'Undated; a prayer of David by its title'

setting: |
  The title ascribes the prayer to David and names no occasion. The psalm stands between two psalms headed for the sons of Korah.

  What can be known of the speaker’s trouble comes late and briefly. In verse 14 “the proud” have risen against him and “the assemblies of violent men” are after his life. Before that he has said only that he is “poor and needy” and that he cries daily. He names no sin and asks for no particular punishment on his enemies, only that they see God’s favor on him and be ashamed.

  A reader who knows the Psalms and the books of Moses will keep recognizing lines, for much of the prayer is made of words used elsewhere in scripture. The note on the title lists the plainest of them. The weightiest is verse 15, which is what the LORD said of Himself to Moses at Sinai.

  The words of verse 9, that all nations “shall come and worship before thee,” stand again in a song John hears in his Revelation ([[Rev. 15:4]]).

thread: |
  Nearly every request in this prayer comes with its reason attached, and **the reasons change from “I am” to “thou art.”**

  The first four are about the one praying. Hear me, “for I am poor and needy.” Preserve me, “for I am holy.” Be merciful, “for I cry unto thee daily.” Gladden me, “for unto thee, O Lord, do I lift up my soul” (verses 1–4). Then the ground shifts: “For thou, Lord, art good, and ready to forgive” (verse 5). From there on the reasons are about God.

  Three statements of what God is stand at verses 5, 10 and 15. The Lord is good and forgiving (verse 5), so the servant can ask. He is great, and “God alone” (verse 10), so that no other god compares and every nation He made will come to Him (verses 8–9). And He is “full of compassion, and gracious, longsuffering, and plenteous in mercy and truth” (verse 15), which is the Lord’s own description of Himself, set directly against the men who “have not set thee before them” (verse 14).

  Between the second and third of these stands a request of another kind: “Teach me thy way, O LORD … unite my heart to fear thy name” (verse 11). The enemies are not named until verse 14, after the praise and after that request.

  The psalm ends still asking. Its last petitions (verses 16–17) follow verse 15 at once: “O turn unto me, and have mercy upon me.”

sections:
  - range: 1-7
    heading: Hear me, for thou art good
    plain: |
      Turn Your ear to me, LORD, and answer me, for I am poor and in need. Guard my life, for I am devoted to You. You are my God; save Your servant, who trusts in You. Be gracious to me, Lord, for I call to You all day long. Make Your servant’s soul glad, for it is to You, Lord, that I lift up my soul. For You, Lord, are good and forgiving, rich in mercy to all who call on You. Listen to my prayer, LORD; pay heed to the sound of my pleading. In the day of my trouble I call on You, for You will answer me.
  - range: 8-10
    heading: None like thee
    plain: |
      There is none like You among the gods, Lord, and there are no works like Yours. All the nations You have made will come and bow down before You, Lord, and will give glory to Your name. For You are great and You do wonders. You alone are God.
  - range: 11-13
    heading: An undivided heart
    plain: |
      Teach me Your way, LORD, and I will walk in Your truth. Make my heart one, to fear Your name. I will thank You, Lord my God, with all my heart, and I will give glory to Your name for ever. For Your mercy toward me is great, and You have rescued my soul from the depths of Sheol.
  - range: 14-17
    heading: The proud, and the God of Sinai
    plain: |
      God, insolent men have risen against me. A band of violent men is seeking my life, and they do not set You before them. But You, Lord, are a God compassionate and gracious, slow to anger, and rich in mercy and faithfulness. Turn to me and be gracious to me. Give Your strength to Your servant, and save the son of Your handmaid. Show me a sign of Your favor, so that those who hate me may see it and be ashamed, because You, LORD, have helped me and comforted me.

notes:
  - ref: 0
    phrase: A Prayer of David
    kind: scripture
    title: A prayer in words found elsewhere in scripture
    body: |
      Much of this prayer is said in words that stand elsewhere in the Psalms and in the books of Moses. The reason of verse 1 is the last verse of Psalm 40: “But I am poor and needy” ([[Ps. 40:17]]; the pair of words is explained at [[Ps. 70:5]]). Verse 4 ends as Psalm 25 begins: “Unto thee, O LORD, do I lift up my soul” ([[Ps. 25:1]]). Verse 11 opens with the opening words of [[Ps. 27:11]], “Teach me thy way, O LORD.” Verse 14 is close to a verse of Psalm 54: “For strangers are risen up against me, and oppressors seek after my soul: they have not set God before them” ([[Ps. 54:3]]). Verse 8 takes up Israel’s song at the sea and verse 15 the LORD’s words at Sinai; each has its own note.

      On one older reading the psalm came after those passages and draws on them: here “almost everything is an echo of earlier language of the Psalms and of the Law.”

      The psalms on either side are headed for the sons of Korah (see [[Ps. 42:1]]). The name “A Prayer” is explained under the title of Psalm 17 ([[Ps. 17:1]]).
    sources: [lds-scriptures, delitzsch-psalms]
  - ref: 2
    phrase: for I am holy
    kind: words
    title: Holy here means devoted
    body: |
      “Holy” here is *hasid*, the word for one who is devoted, explained at [[Ps. 4:3]]: “kind, pious,” the adjective that belongs to *hesed*. In this verse it is used as a noun, “a pious man, the godly.” A modern translation has “for I am devoted to you.”

      The rest of the verse stands beside it: he is “thy servant that trusteth in thee.” Like the other reasons of verses 1–4, it is offered as a reason to be kept.

      *Hesed* itself comes three times in the psalm, each time as God’s: the “mercy” of verses 5, 13 and 15.
    sources: [oshb-wlc, bdb, nrsvue]
  - ref: 8
    phrase: Among the gods there is none like unto thee
    kind: scripture
    title: The question of Moses’ song, turned into a statement
    body: |
      Verse 8 answers a question Israel sang after the sea. “Who is like unto thee, O LORD, among the gods? who is like thee, glorious in holiness, fearful in praises, doing wonders?” ([[Ex. 15:11]]). The psalm says it as a fact: “there is none like unto thee.”

      Verse 10 then goes further than the comparison: “thou art God alone.” The psalm sets the two side by side and does not stop to say who the “gods” of verse 8 are. The word is *elohim*, the word discussed at [[Ps. 8:5]], and who the “gods” of another psalm are is taken up at [[Ps. 82:1]].
    sources: [lds-scriptures, oshb-wlc]
  - ref: 9
    phrase: All nations whom thou hast made shall come and worship before thee
    kind: scripture
    title: The same words in the song John hears
    body: |
      The words of this verse stand in a song John hears in heaven. In his vision “they sing the song of Moses the servant of God, and the song of the Lamb, saying, Great and marvellous are thy works, Lord God Almighty” ([[Rev. 15:3]]), and the song goes on, “Who shall not fear thee, O Lord, and glorify thy name? for thou only art holy: for all nations shall come and worship before thee; for thy judgments are made manifest” ([[Rev. 15:4]]). Both halves of verse 9 are there: the nations that “shall come and worship before thee,” and the glorifying of the name. The Church’s edition heads that chapter of Revelation as the praise of exalted Saints.

      The psalm adds three words that the song does not have: “whom thou hast made.” The nations that will come are His own making. Psalm 22 holds the same hope, “all the kindreds of the nations shall worship before thee” ([[Ps. 22:27]]).

      The psalm does not say when. Latter-day revelation speaks of a trump whose sound all people will hear, “for every ear shall hear it, and every knee shall bow, and every tongue shall confess” ([[D&C 88:104]]).
    sources: [lds-scriptures]
  - ref: 11
    phrase: unite my heart to fear thy name
    kind: words
    title: A heart made one
    body: |
      He asks that his heart be made single. The verb means “be united,” and the line has been explained as “unite my heart (i.e. concentrate its affections).” A modern translation has “give me an undivided heart to revere your name.” The request has a counterpart in the LORD’s promise through Jeremiah: “And I will give them one heart, and one way, that they may fear me for ever” ([[Jer. 32:39]]). There the one heart is a gift God promises His people; here one man asks for it.

      The ancient Greek translation read the same consonants as a different verb and has “let my heart rejoice, that I may fear thy name.” The Hebrew text as it is pointed says “unite.”

      The next verse takes up the word: “I will praise thee, O Lord my God, with all my heart.”
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs, lds-scriptures]
  - ref: 13
    phrase: thou hast delivered my soul from the lowest hell
    kind: words
    title: The lowest hell is Sheol beneath
    body: |
      “The lowest hell” is Sheol, the world of the dead (explained at [[Ps. 6:5]]), with an adjective meaning “lower, lowest.” A modern translation has “the depths of Sheol.” The same two words, the adjective in a slightly different form, stand in Moses’ song, of a fire that “shall burn unto the lowest hell” ([[Deut. 32:22]]). On one older reading the phrase is “the hell beneath,” said as one says “the earth beneath, the inner parts of the earth”: Sheol named as the place below.

      The verb is in the past, though the enemies of verse 14 are still at hand. The King James and a modern translation take it as a rescue already given, and so does the Church’s chapter heading, which has David “saved from the lowest hell.” That mercy is the reason he gives for the praise of verse 12: “For great is thy mercy toward me.”
    sources: [oshb-wlc, bdb, nrsvue, delitzsch-psalms, lds-scriptures]
  - ref: 15
    phrase: full of compassion, and gracious, longsuffering, and plenteous in mercy and truth
    kind: scripture
    title: The LORD’s own words at Sinai
    body: |
      Verse 15 is what the LORD said of Himself to Moses. At Sinai “the LORD passed by before him, and proclaimed, The LORD, The LORD God, merciful and gracious, longsuffering, and abundant in goodness and truth” ([[Ex. 34:6]]). The King James translates the two verses differently, but from “God” to “truth” the Hebrew words are the same in both and in the same order. A modern translation of the psalm has “a God merciful and gracious,” who is “slow to anger and abounding in steadfast love and faithfulness.”

      So the psalmist does not describe God in words of his own. Against men who “have not set thee before them,” he sets what God has said He is, and the plea follows at once: “O turn unto me, and have mercy upon me.”

      Verse 5 already has the phrase “plenteous in mercy,” the same two Hebrew words, and adds to them “ready to forgive,” a single adjective that occurs nowhere else in the Psalms. “Mercy” in both verses is *hesed*, explained at [[Ps. 51:1]].
    sources: [lds-scriptures, oshb-wlc, nrsvue, bdb]
  - ref: 16
    phrase: save the son of thine handmaid
    kind: words
    title: Servant, and son of thine handmaid
    body: |
      “The son of thine handmaid” is a servant’s way of naming himself, not a statement about David’s mother. The word is the ordinary one for a “maid, handmaid,” used when a speaker refers to herself “in token of humility,” and used in addressing God by Hannah, who calls herself “thine handmaid” three times in one verse ([[1 Sam. 1:11]]). In prayer the phrase with “son” comes once more: “I am thy servant, and the son of thine handmaid” ([[Ps. 116:16]]). A modern translation has “the child of your maidservant.” On one older reading the speaker means that he was “born into the relation” of a servant to God: “it is a relationship that has come to him by birth.”

      The phrase belongs with the way he speaks all through the psalm. He calls himself “thy servant” three times (verses 2, 4 and 16). And he calls God “Lord,” in lower case, seven times (verses 3, 4, 5, 8, 9, 12 and 15), beside the four times he uses the name “LORD” (verses 1, 6, 11 and 17). The lower-case word is the title *Adonai*; the two words are explained at [[Ps. 110:1]]. The same older reading notes the seventh “Lord” in verse 15, just before this line, and sums up the speaker as “the servant of the sovereign Lord.”
    sources: [bdb, oshb-wlc, nrsvue, delitzsch-psalms, lds-scriptures]
  - ref: 17
    phrase: Shew me a token for good
    kind: words
    title: A token is a sign
    body: |
      The last request is for something visible. “Token” is the Hebrew word for a sign, here in the sense “sign, pledge, token.” A modern translation has “Show me a sign of your favor.” What the sign should be he leaves to God.

      Its purpose is stated: “that they which hate me may see it, and be ashamed.” He asks nothing else concerning his enemies. “Holpen” is “helped,” and the psalm closes on it: “because thou, LORD, hast holpen me, and comforted me.” Whether the sign was given the psalm does not say.
    sources: [oshb-wlc, bdb, nrsvue]

christ: |
  The Lord to whom this prayer is made is Jesus Christ. “Jehovah is the premortal Jesus Christ,” and the risen Savior said to the Nephites, “Behold, I am he that gave the law, and I am he who covenanted with my people Israel” ([[3 Ne. 15:5]]). The words of verse 15, proclaimed at Sinai ([[Ex. 34:6]]), are therefore His words about Himself.

  The words of verse 9 stand in a song that bears His name. John calls it “the song of Moses the servant of God, and the song of the Lamb” ([[Rev. 15:3]]).

explore: |
  - **The words of Sinai through scripture.** Read [[Ex. 34:6]] beside [[Num. 14:18]] and [[Joel 2:13]], and see what each speaker asks on the strength of them.
  - **The psalms this prayer draws on.** [[Ps. 25]], [[Ps. 40:13–17]] and [[Ps. 54]].

parallels:
  - ref: Ex. 34:6
    note: The LORD’s description of Himself to Moses, repeated in verse 15.
  - ref: Ex. 15:11
    note: The question of Moses’ song, answered in verse 8.
  - ref: Rev. 15:3–4
    note: The song of Moses and of the Lamb has the words of verse 9.
  - ref: Jer. 32:39
    note: The one heart, promised to Israel, that verse 11 asks for.
  - ref: Ps. 116:16
    note: The other place where a psalmist calls himself the son of God’s handmaid.
  - ref: Ps. 54:3
    note: The verse that verse 14 nearly repeats (also Ps. 40:17 in verse 1 and Ps. 25:1 in verse 4).

