chapter: 123
title: As the Eyes of Servants
tagline: A scorned people fixes its eyes on the King in the heavens, as a servant watches a master’s hand, and asks for mercy without yet receiving an answer.
when: 'Undated; a song of degrees that names no author'

setting: |
  Psalm 123 is the fourth of the fifteen songs of degrees, the group explained at [[Ps. 120:1]]. Its title names no author and no occasion, and the psalm itself names no place, no king and no enemy. All it tells of the people who sing it is that they are despised by people more comfortable than they are.

  It shares words with the psalms around it. Two psalms earlier a pilgrim says, “I will lift up mine eyes unto the hills” ([[Ps. 121:1]]); here the eyes are lifted to the one who dwells in the heavens. The psalm just before it ends at “the house of the LORD our God” ([[Ps. 122:9]]), and this one takes up the same name for Him in verse 2. The psalm that follows is the song of a people who have come through: “If it had not been the LORD who was on our side” ([[Ps. 124:1]]).

  It has four verses: a lament of the people (see [[Ps. 22:1]]) cut down to a look and a plea.

thread: |
  **The psalm holds a look and makes one request, and it ends before the request is answered.**

  It begins with one voice: “Unto thee lift I up mine eyes.” By the next verse the voice is a people’s, “our eyes,” and it stays so to the end. The one it looks to is not only above; a modern translation has “enthroned in the heavens,” and the picture that follows is of a household. Servants watch a master’s hand and a maid her mistress’s, and that is how this people watches the LORD, “until that he have mercy upon us.” The word “until” sets no date: the look is to last as long as the waiting does.

  The psalm turns at verse 3, from the look to the plea, and it climbs there as by steps. Verse 2 closes with “have mercy upon us,” and verse 3 opens by saying it twice. Verse 3 closes with “exceedingly filled with contempt,” and verse 4 says it again and at last says whose contempt it is.

  So the reason for the prayer comes last, and nothing comes after it. There is no vow of praise and no word that God has heard. The last sound in the psalm is the scorn of “those that are at ease,” and the people are still looking up.

sections:
  - range: 1-2
    heading: Our eyes wait upon the LORD
    plain: |
      I lift my eyes to You, who sit enthroned in the heavens. As servants keep their eyes on their master’s hand, and a maid on the hand of her mistress, so our eyes are on the LORD our God until He shows us mercy.
  - range: 3-4
    heading: Have mercy upon us
    plain: |
      Have mercy on us, LORD, have mercy on us, for we have had more than enough of contempt. We have had our fill and more of the scorn of the comfortable and the contempt of the proud.

notes:
  - ref: 2
    phrase: look unto the hand of their masters
    kind: symbol
    title: Why the servant watches the hand
    body: |
      The hand the servants watch is the one that runs the house, and the psalm sets this people before the LORD as that household’s servants, men and women alike. One older reading spells the picture out: “this hand regulates the whole house,” and the servants “wait upon their winks and signs with most eager attention.” The same reading adds that the people’s future lies in that hand, which is why their eyes stay on it.

      The verse itself names what they are watching for: “until that he have mercy upon us.”
    sources: [delitzsch-psalms]
  - ref: 3
    phrase: exceedingly filled with contempt
    kind: words
    title: More than enough of contempt
    body: |
      The people are not saying that they feel contempt; they are saying they have been given all of it they can take. The verb is the one for having eaten one’s fill, “be sated, satisfied, surfeited,” and it is used here as a figure for being weary of a thing. A modern translation renders the two lines “we have had more than enough of contempt” and “Our soul has had more than its fill.” Verse 4 settles whose contempt it is: “the scorning of those that are at ease.”
    sources: [bdb, nrsvue]
  - ref: 4
    phrase: those that are at ease
    kind: scripture
    title: Who the scorners are
    body: |
      The psalm does not name the scorners; it describes them by their circumstances, and other scripture shows what the description means. “At ease” is a word for people to whom nothing bad has happened, and it carries, in this verse and some others, the “collateral idea of careless, wanton, arrogant.” Job uses it with the psalm’s word for contempt to say how such people think: “He that is ready to slip with his feet is as a lamp despised in the thought of him that is at ease” ([[Job 12:5]]). Those who have not fallen despise the one who has. Amos turns the same word on Israel’s own comfortable class: “Woe to them that are at ease in Zion” ([[Amos 6:1]]).

      When the psalm was written is not known. The Church’s edition sets beside this verse the mockery that met the builders of Jerusalem’s wall in Nehemiah’s day, from men who “laughed us to scorn, and despised us” ([[Neh. 2:19]]), and Nehemiah’s prayer then is close to this psalm’s: “Hear, O our God; for we are despised” ([[Neh. 4:4]]). That is a likeness and not a date.
    sources: [lds-scriptures, bdb, biblehub-interlinear]

christ: |
  The King enthroned in the heavens, to whom the servants look, is Jehovah, who is Jesus Christ (see [[Ps. 110:1]]). What the psalm says of Him is brief. His people are the servants of His house, their eyes are on His hand, and what they wait for from it is mercy.

explore: |
  - **The psalm that follows.** [[Ps. 124:1–8]], the next song of degrees, sung by a people who can say, “Our soul is escaped as a bird out of the snare of the fowlers” ([[Ps. 124:7]]).
  - **Eyes lifted elsewhere in the songs of degrees.** [[Ps. 121:1–2]], where the look goes to the hills and the help “cometh from the LORD, which made heaven and earth” ([[Ps. 121:2]]).
  - **The same prayer in a story.** [[Neh. 4:1–9]], where the mocked builders pray and go on building.

parallels:
  - ref: Ps. 2:4
    note: The same address, there rendered “He that sitteth in the heavens.”
  - ref: Ps. 121:1
    note: The eyes are lifted to the hills; here, to the heavens.
  - ref: Ps. 145:15
    note: “The eyes of all wait upon thee.”
  - ref: Job 12:5
    note: The one at ease despises the one whose foot slips.
  - ref: Neh. 4:4
    note: The mocked builders of the wall pray, “we are despised.”

