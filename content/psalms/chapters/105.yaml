chapter: 105
title: He Hath Remembered His Covenant
tagline: Israel is called to remember what the LORD did, from Abraham’s wanderings through Joseph’s irons and the plagues of Egypt to the land of Canaan, because the LORD remembered what He had promised.
when: 'Undated; the psalm has no title. Its first fifteen verses are sung in 1 Chronicles 16, on the day David brought the ark to Jerusalem'

setting: |
  Psalm 105 tells Israel’s story from Abraham’s wanderings to the gift of Canaan. It takes the story from Genesis and Exodus and “clothes it in a poetic garb.” Nothing in it says when it was written.

  Its first fifteen verses stand also in Chronicles, at the head of the song David gave to Asaph and his brethren on the day the ark came to Jerusalem ([[1 Chr. 16:7–22]]). That song continues with Psalm 96 and closes with lines of Psalm 106; the note on verse 1 sets the psalm’s wording beside that of Chronicles.

  Two other psalms tell the same history, and each tells it for a different purpose. Psalm 78 tells it “That the generation to come might know” ([[Ps. 78:6]]). Here the retelling is made “not with any didactic purpose, but with the purpose of forming a hymn,” and it stops at the entry into the land. Psalm 106, which follows, goes over the same ground as a confession: “We have sinned with our fathers” ([[Ps. 106:6]]). The two stand together as one history told twice, once as what God did and once as what Israel did.

thread: |
  Psalm 105 is about **remembering, on both sides of a covenant**. It opens as a call to worship (verses 1–6) whose last command is “Remember his marvellous works.” Everything after that is the reason, and the reason begins with the same verb turned around: “He hath remembered his covenant for ever” (verse 8).

  The covenant is stated in one sentence, God’s own: “Unto thee will I give the land of Canaan” (verse 11). The rest of the psalm follows that promise through everything that stood against it. The heirs were “very few, and strangers.” A famine came on the land. One of them was sold and put in irons. In Egypt they were hated and dealt with craftily.

  In the telling, nearly everything is something God does. He “called for a famine.” He “sent a man before them.” He “turned their heart.” He “sent Moses,” “sent darkness,” “spake,” “smote,” “brought them forth,” “spread a cloud,” “opened the rock.” Israel is the subject of few verbs: they went, they came, they asked.

  The turn is the word “For” in verse 42: “For he remembered his holy promise, and Abraham his servant.” That is the explanation of the whole history, and it brings back verse 8. Two verses later the land is given, and the last verse says what it was given for: “That they might observe his statutes, and keep his laws.”

sections:
  - range: 1-6
    heading: Give thanks, seek, remember
    plain: |
      Give thanks to the LORD and call on His name. Make His deeds known among the peoples. Sing to Him, and tell of all His wonderful works. Glory in His holy name; let the hearts of those who seek the LORD be glad. Seek the LORD and His strength; seek His face always. Remember the marvellous works He has done, His wonders and the judgments He has spoken, you offspring of Abraham His servant, you children of Jacob, His chosen.
  - range: 7-11
    heading: The covenant with Abraham, Isaac and Jacob
    plain: |
      He is the LORD our God, and His judgments reach through all the earth. He has remembered His covenant for ever, the word He commanded for a thousand generations: the covenant He made with Abraham, the oath He swore to Isaac, which He confirmed to Jacob as a law and to Israel as an everlasting covenant, saying, “To you I will give the land of Canaan as the portion you inherit.”
  - range: 12-15
    heading: A few strangers, and kings reproved
    plain: |
      That was when they were only a few men, very few, and strangers in the land, going from one nation to another and from one kingdom to another people. He allowed no one to wrong them, and He reproved kings for their sakes: “Do not touch my anointed, and do my prophets no harm.”
  - range: 16-22
    heading: Joseph, sent ahead
    plain: |
      He called a famine on the land and broke the whole staff of bread. He sent a man ahead of them, Joseph, who was sold as a slave. They hurt his feet with fetters, and he was laid in iron, until the time his word came; the word of the LORD tried him. The king sent and released him; the ruler of the people set him free. He made him lord of his house and ruler of all he owned, to bind his princes at his pleasure and to teach his elders wisdom.
  - range: 23-25
    heading: Israel in the land of Ham
    plain: |
      Then Israel came into Egypt, and Jacob lived as a stranger in the land of Ham. The LORD made His people increase greatly and made them stronger than their enemies. He turned the Egyptians’ heart to hate His people and to deal craftily with His servants.
  - range: 26-36
    heading: Moses, Aaron and the plagues
    plain: |
      He sent Moses His servant, and Aaron whom He had chosen. They showed His signs among them and wonders in the land of Ham. He sent darkness and made it dark, and they did not rebel against His word. He turned their waters to blood and killed their fish. Their land swarmed with frogs, even in the rooms of their kings. He spoke, and swarms of flies came, and lice through all their country. He gave them hail for rain, and flaming fire in their land. He struck their vines and fig trees and broke the trees of their country. He spoke, and the locusts came, and caterpillars without number, and ate every green plant in their land and the fruit of their ground. He struck down all the firstborn in their land, the chief of all their strength.
  - range: 37-41
    heading: Out of Egypt and through the wilderness
    plain: |
      He brought Israel out with silver and gold, and no one among their tribes was feeble. Egypt was glad when they left, for the fear of them had fallen on it. He spread a cloud for a covering, and fire to give light at night. The people asked, and He brought quails and filled them with the bread of heaven. He opened the rock and the waters gushed out; they ran through the dry places like a river.
  - range: 42-45
    heading: For he remembered
    plain: |
      For He remembered His holy promise, and Abraham His servant. He brought His people out with joy, His chosen with gladness. He gave them the lands of the nations, and they inherited what other peoples had laboured for, so that they might observe His statutes and keep His laws. Praise the LORD.

notes:
  - ref: 1
    phrase: make known his deeds among the people
    kind: scripture
    title: The same fifteen verses in David’s song before the ark
    body: |
      Verses 1–15 are also the opening of the song Chronicles gives for the day the ark was brought to Jerusalem, with small differences, two of which turn the words toward the congregation. “Then on that day David delivered first this psalm to thank the LORD into the hand of Asaph and his brethren” ([[1 Chr. 16:7]]). The song follows the psalm as far as “do my prophets no harm” and then passes to Psalm 96 (see the note on [[Ps. 96:6]] for how the two texts are related).

      Three differences stand out. The psalm addresses the “seed of Abraham”; Chronicles has “seed of Israel his servant” ([[1 Chr. 16:13]]). The psalm says of the patriarchs, “When they were but a few men in number”; Chronicles says to the congregation, “When ye were but few” ([[1 Chr. 16:19]]). And where the psalm states a fact about God, “He hath remembered his covenant for ever,” Chronicles gives a command: “Be ye mindful always of his covenant” ([[1 Chr. 16:15]]).

      So Chronicles speaks to the people before the ark: they are the “ye” who were few, and they are told to be mindful of the covenant. The psalm says that God has remembered it, and goes on through thirty more verses that Chronicles does not use.

      “The people” of verse 1 is plural, “the peoples”: the deeds are to be made known among the nations.
    sources: [lds-scriptures, nrsvue]

  - ref: 5
    phrase: Remember his marvellous works that he hath done
    kind: scripture
    title: A recital of what God did
    body: |
      What Israel is told to remember is a story the law had Israel recite: the fathers, Egypt, the deliverance and the land. Such a recital has been called a “historical credo,” that is, “a literary recollection of the experience of the patriarchs in the land of Canaan, of the experience of the children of Israel in bondage in Egypt, of their deliverance from bondage, and of their journey to the land of Canaan.”

      The Israelite who brought his firstfruits was to “speak and say before the LORD thy God” such a recital. It begins, “A Syrian ready to perish was my father, and he went down into Egypt, and sojourned there with a few” ([[Deut. 26:5]]), and it ends, “he hath brought us into this place, and hath given us this land” ([[Deut. 26:9]]). Psalm 105 has the same four stations, the fathers, Egypt, the deliverance and the land, made into a song.

      Nephi “recites a form of the historical credo to his brothers” while building the ship in Bountiful, and he gives the psalm’s own reason for the Exodus: the Lord “covenanted with them, yea, even Abraham, Isaac, and Jacob; and he remembered the covenants which he had made; wherefore, he did bring them out of the land of Egypt” ([[1 Ne. 17:40]]).
    sources: [ricks-psalm-105, lds-scriptures]

  - ref: 10
    phrase: an everlasting covenant
    kind: scripture
    title: What the covenant holds, and what the psalm names
    body: |
      The psalm names one promise of the covenant, the land, and follows it through three generations. Genesis has each step. To Abraham: “all the land of Canaan, for an everlasting possession” ([[Gen. 17:8]]). To Isaac: “I will perform the oath which I sware unto Abraham thy father” ([[Gen. 26:3]]). To Jacob at Bethel: “the land whereon thou liest, to thee will I give it, and to thy seed” ([[Gen. 28:13]]).

      The covenant holds more than the land. Its promises included “that (1) Christ would come through his lineage, and that (2) Abraham’s posterity would receive certain lands as an eternal inheritance.” The psalm speaks only of the second.

      The history the psalm goes on to tell was itself part of what Abraham was told. On the day the covenant was made the Lord said, “Know of a surety that thy seed shall be a stranger in a land that is not theirs, and shall serve them” ([[Gen. 15:13]]), and “afterward shall they come out with great substance” ([[Gen. 15:14]]). The psalm tells the sojourn in Egypt (verse 23), the judgments on that nation (verses 28–36) and the leaving “with silver and gold” (verse 37).
    sources: [lds-scriptures, bd-abraham-covenant]

  - ref: 15
    phrase: Touch not mine anointed, and do my prophets no harm
    kind: history
    title: The anointed and the prophets are the patriarchs
    body: |
      In this psalm the anointed and the prophets are Abraham, Isaac and Jacob with their households, and the kings who were reproved are the Pharaoh and the Abimelech of Genesis. “The LORD plagued Pharaoh and his house with great plagues because of Sarai Abram’s wife” ([[Gen. 12:17]]). God came to Abimelech in a dream and said of Abraham, “he is a prophet, and he shall pray for thee” ([[Gen. 20:7]]). In Isaac’s day Abimelech charged his people, “He that toucheth this man or his wife shall surely be put to death” ([[Gen. 26:11]]).

      Elsewhere “the LORD’s anointed” is Israel’s king (see the note on [[Ps. 2:2]]). Here, and in the same line in Chronicles, the word is used of “patriarchs, regarded as anointed kings,” and it is plural: a modern translation has “my anointed ones.” The wanderers, “very few, and strangers,” are spoken of as kings.

      This line and the promise of the land in verse 11 are the only words God speaks in the psalm.
    sources: [lds-scriptures, bdb, nrsvue]

  - ref: 17
    phrase: He sent a man before them, even Joseph
    kind: scripture
    title: Sold by his brothers, sent by God
    body: |
      The psalm says of Joseph what Joseph said of himself: the selling was a sending. To his brothers he said, “God did send me before you to preserve life” ([[Gen. 45:5]]), and after their father’s death, “ye thought evil against me; but God meant it unto good” ([[Gen. 50:20]]). The psalm keeps both halves in one verse: “He sent a man before them, even Joseph, who was sold for a servant.”

      The famine is named first (verse 16), but the sending came before it: a modern translation has “he had sent a man ahead of them.”

      The psalm also tells what Genesis does not. Genesis says only that Joseph was put in “a place where the king’s prisoners were bound” ([[Gen. 39:20]]), which he calls “the dungeon” ([[Gen. 40:15]]). The psalm gives the fetters on his feet and the iron.
    sources: [lds-scriptures, nrsvue]

  - ref: 19
    phrase: the word of the LORD tried him
    kind: words
    title: Whose word came, and what tried Joseph
    body: |
      The verse has two “words.” The first, “his word,” can be read as Joseph’s own or as the LORD’s; the second is the LORD’s. A modern translation has “until what he had said came to pass,” and gives the second line as “the word of the LORD kept testing him.”

      Read as Joseph’s, the word that came is what he said in prison. To Pharaoh’s butler and baker he said, “Do not interpretations belong to God? tell me them, I pray you” ([[Gen. 40:8]]), and the butler afterward told Pharaoh, “as he interpreted to us, so it was” ([[Gen. 41:13]]). The psalm’s next verse is the king sending to release him.

      One older reading takes “his word” instead as Joseph’s “open-hearted word concerning his visions,” the dreams in which his exaltation had been shown him, which he remembered when his brothers bowed before him ([[Gen. 42:9]]). On that reading the word of the LORD “is the revelation of God conveying His promises, which came to him in the same form, which had to try, to prove, and to purify him,” and what was proved in prison was “a faithfulness that wavered not, and a confidence that knew no despair.” The same reading grants that “his word” could be the LORD’s in both lines.
    sources: [nrsvue, delitzsch-psalms, lds-scriptures]

  - ref: 23
    phrase: the land of Ham
    kind: history
    title: Why Egypt is the land of Ham
    body: |
      Egypt is called by the name of Noah’s son Ham because Genesis traces the Egyptians to him. “And the sons of Ham; Cush, and Mizraim, and Phut, and Canaan” ([[Gen. 10:6]]), and Mizraim is “the Hebrew name for Egypt.” The name stands for Egypt here, in verse 27, and in the two neighboring psalms that tell this history ([[Ps. 78:51]]; [[Ps. 106:22]]).
    sources: [lds-scriptures, bd-mizraim, bd-ham]

  - ref: 25
    phrase: He turned their heart to hate his people
    kind: scripture
    title: Did God make the Egyptians hate Israel?
    body: |
      The verse says that God turned Egypt’s heart, and the verse before it says how: He blessed Israel. He “increased his people greatly; and made them stronger than their enemies” (verse 24), and the hatred followed. Exodus tells it in the same order with Pharaoh speaking: “Behold, the people of the children of Israel are more and mightier than we” ([[Ex. 1:9]]), and then, “Come on, let us deal wisely with them” ([[Ex. 1:10]]), which the psalm calls dealing “subtilly.” One older reading puts it that the hatred was God’s work “indirectly,” “inasmuch as He gave increasing might to His people, which excited their jealousy.”
    sources: [lds-scriptures, delitzsch-psalms]

  - ref: 28
    phrase: He sent darkness, and made it dark
    kind: scripture
    title: Eight plagues, with the darkness first
    body: |
      The psalm tells eight of the ten plagues and begins with the ninth. Its order is darkness, blood, frogs, flies and lice together, hail, locusts, and the death of the firstborn. In Exodus the darkness comes next to last ([[Ex. 10:21–23]]); the flies come after the lice; and the murrain on the cattle and the boils, the fifth and sixth plagues, “are left unmentioned.” The psalm then passes straight from the firstborn to the departure, with no Passover.

      Why the darkness leads, the psalm does not say. One older reading is that it was “the most distinct self-representation of divine wrath.” Psalm 78 makes its own choice of plagues in its own order (see the note on [[Ps. 78:44]]). Here the end stays where Exodus has it, with the firstborn.
    sources: [delitzsch-psalms, lds-scriptures]

  - ref: 28
    phrase: they rebelled not against his word
    kind: words
    title: Who did not rebel?
    body: |
      The line is disputed, and the reading depends on who “they” are. The King James follows the Hebrew, which has the “not.” The ancient Greek translation does not have it: “yet they rebelled against his words.” A modern translation follows the Greek, “they rebelled against his words,” with the note “Heb they did not rebel.” Read that way, “they” are the Egyptians.

      One older reading keeps the Hebrew and asks who could be meant. It rules out the Egyptians, since “did not rebel” would be a strange way to describe a “final compliance, which was wrung from them.” It takes “they” as Moses and Aaron, the subject of the verse before, who “executed the terrible commands accurately and willingly”; the contrast it draws is with the waters of Meribah, where the same two were charged with rebelling against the LORD’s word (see [[Num. 20:24]]).

      The King James has the Hebrew text behind it, and on this reading the line is about the obedience of Moses and Aaron; the other reading rests on the Greek. Who “they” are is not certain.
    sources: [lxx-rahlfs, nrsvue, delitzsch-psalms]

  - ref: 40
    phrase: The people asked, and he brought quails
    kind: scripture
    title: The wilderness without the murmuring
    body: |
      The psalm tells the wilderness as three gifts, a cloud, food and water, and it leaves out every complaint. Exodus says that before the quails and the manna “the whole congregation of the children of Israel murmured against Moses and Aaron in the wilderness” ([[Ex. 16:2]]). Psalm 78 says of the same request, “they tempted God in their heart by asking meat for their lust” ([[Ps. 78:18]]). Here it is three words: “The people asked.” There is no rebellion at the sea, no golden calf, and no forty years.

      The next psalm tells what this one leaves out. Psalm 106 goes over the history again as a confession. Of the request for food it says they “lusted exceedingly in the wilderness, and tempted God in the desert” ([[Ps. 106:14]]). Of Egypt it says, “they remembered not the multitude of thy mercies” ([[Ps. 106:7]]). Yet that psalm too comes to God’s remembering: “he remembered for them his covenant” ([[Ps. 106:45]]).
    sources: [lds-scriptures]

  - ref: 45
    phrase: That they might observe his statutes, and keep his laws
    kind: scripture
    title: What the land was given for
    body: |
      The last verse gives the purpose of the whole history: the land was given so that Israel would keep God’s law in it. Moses joined the law and the land in the same way: “hearken, O Israel, unto the statutes and unto the judgments, which I teach you, for to do them, that ye may live, and go in and possess the land” ([[Deut. 4:1]]). The book of Abraham has the condition in the promise itself. The Lord tells Abraham of “a strange land which I will give unto thy seed after thee for an everlasting possession, when they hearken to my voice” ([[Abr. 2:6]]).

      The psalm stops there, with the people in the land. Psalm 106, which follows, ends with the prayer “gather us from among the heathen” ([[Ps. 106:47]]).
    sources: [lds-scriptures]

christ: |
  The LORD who made this covenant and remembered it is Jehovah; the heading to Abraham 2 reads, “Jehovah appears to him at Haran.” The psalm follows the covenant’s promise of the land. That Christ would come through Abraham’s lineage was promised in the same covenant (see the note on verse 10).

  It is this covenant that Zacharias names in Luke. He blesses the God of Israel for acting “to remember his holy covenant” ([[Luke 1:72]]), “The oath which he sware to our father Abraham” ([[Luke 1:73]]).

explore: |
  - **The other half of the story.** [[Ps. 106]], read straight after this psalm: the same events, told as Israel’s forgetting, and coming to the same remembered covenant ([[Ps. 106:45]]).
  - **The history told to teach.** [[Ps. 78]], the same history told “That the generation to come might know them” ([[Ps. 78:6]]).
  - **The song before the ark.** [[1 Chr. 16:7–36]], where verses 1–15 are joined to Psalm 96 and the opening and close of Psalm 106.
  - **The covenant’s own forecast.** [[Gen. 15:13–18]], and Joseph’s reading of his life in [[Gen. 45:5–8]] and [[Gen. 50:20]].
  - **Nephi’s recital.** [[1 Ne. 17:23–42]], the same history told to his brothers.
  - **The psalm as a covenant text.** Stephen D. Ricks, “Psalm 105: Chiasmus, Credo, Covenant, and Temple,” *Interpreter* 45 (2021): 371–84, sets the psalm beside the pattern of covenant making in Exodus and in King Benjamin’s address.

parallels:
  - ref: 1 Chr. 16:8–22
    note: Verses 1–15, sung before the ark; Chronicles says “Be ye mindful always of his covenant” where the psalm says “He hath remembered.”
  - ref: Gen. 15:13–14
    note: The sojourn, the bondage and the leaving “with great substance,” foretold to Abraham when the covenant was made.
  - ref: Gen. 45:5
    note: Joseph says, “God did send me before you,” the psalm’s verse 17.
  - ref: Deut. 26:5–9
    note: The recital an Israelite made with his firstfruits, from the fathers to the land.
  - ref: 1 Ne. 17:40
    note: Nephi gives the remembered covenant with Abraham, Isaac and Jacob as the reason the Lord brought Israel out of Egypt.
  - ref: Ps. 106:6–7
    note: The next psalm tells the same history as a confession.
  - ref: Luke 1:72–73
    note: Zacharias blesses God for remembering “his holy covenant; The oath which he sware to our father Abraham.”

sources: [lds-scriptures, bd-abraham-covenant, bd-ham, bd-mizraim, ricks-psalm-105, delitzsch-psalms, nrsvue, lxx-rahlfs, bdb]
