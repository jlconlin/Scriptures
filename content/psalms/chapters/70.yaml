chapter: 70
title: Make Haste
tagline: Five verses that begin and end with the same cry for speed, and between the cries set those who seek the speaker’s life against those who seek God.
when: 'Undated; a psalm of David by its title'

setting: |
  The title ascribes the psalm to David and names no occasion.

  A reader of the book has met these verses before. They are the last five verses of Psalm 40, with small changes, and the note on [[Ps. 40:13]] sets the two side by side. There the plea follows a thanksgiving for a rescue already given. Here it stands by itself.

  The psalm does not say how it came to stand in the book twice. One older reading is that this portion of Psalm 40 was “detached from it and converted into the Elohimic style,” that is, with “God” put for most of its uses of the divine name. On that reading the original psalm was in this way “modified and appropriated to a special liturgical use.” That is an inference from the two texts and from the title.

  Its neighbors share its words. On the same reading it was placed after Psalm 69 because the two are alike in content, above all this psalm’s last verse and the line “But I am poor and sorrowful” ([[Ps. 69:29]]). The psalm that follows takes up the plea again, “O my God, make haste for my help” ([[Ps. 71:12]]), and the wish against those “that seek my hurt” ([[Ps. 71:13]]).

thread: |
  The psalm is a plea with nothing around it. Of the parts a lament usually has (they are laid out at [[Ps. 22:1]]), this one keeps the address and the plea. It gives no account of what has happened and makes no vow of praise. It asks.

  It asks first for speed. In the Hebrew the only command of verse 1 is its last word, “make haste,” and the same command returns in verse 5, followed by its negative, “make no tarrying,” which is to say, do not delay. **The psalm ends where it began, still asking.**

  Between the two cries stand two groups of people. The first “seek after my soul” and say “Aha, aha” (verses 2–3). The second seek God and say “Let God be magnified” (verse 4). He asks that the first be turned back in shame and that the second rejoice.

  The turn is at the first word of verse 5, “But.” Having wished gladness on everyone who seeks God, he says of himself that he is “poor and needy,” and he goes back to the cry of verse 1. In Psalm 40 the same verse holds a sentence of trust, “yet the Lord thinketh upon me” ([[Ps. 40:17]]). That sentence is not here. What stands in its place is a second “make haste.” Nothing in the five verses says that help has come. What they do say, in the same breath as the plea, is who God is to the speaker: “thou art my help and my deliverer.”

sections:
  - range: 1
    heading: Hurry
    plain: |
      God, rescue me! LORD, hurry to help me!
  - range: 2-3
    heading: Those who seek his life
    plain: |
      Let those who are after my life be shamed and disgraced. Let those who want to see me hurt be driven back and humiliated. Let those who say “Aha, aha!” turn back because of their shame.
  - range: 4
    heading: Those who seek God
    plain: |
      Let everyone who seeks You rejoice and be glad in You. Let those who love Your salvation never stop saying, “Let God be magnified.”
  - range: 5
    heading: Hurry, and do not delay
    plain: |
      But I am poor and needy. God, hurry to me! You are my help and my deliverer. LORD, do not delay.

notes:
  - ref: 0
    phrase: to bring to remembrance
    kind: words
    title: A remembrance, and in the Greek a plea
    body: |
      The title’s last phrase is a single Hebrew verb form whose meaning is uncertain. It stands in only one other title, that of Psalm 38, and the note there explains the two senses proposed for it, praise and a memorial offering ([[Ps. 38:1]]).

      The ancient Greek translators made the title of this psalm a sentence that runs into the prayer: “for a remembrance, that the Lord may save me.” In that version the remembrance and the plea for rescue belong together.

      “To the chief Musician” is explained under the title of Psalm 8 ([[Ps. 8:1]]).
    sources: [oshb-wlc, bdb, lxx-rahlfs, lds-scriptures]

  - ref: 1
    phrase: Make haste, O God, to deliver me
    kind: scripture
    title: The end of Psalm 40, standing alone
    body: |
      This verse is [[Ps. 40:13]] with its first word gone and one of its two names for God changed. The note there lists the differences between the two psalms. Two of them shape this verse.

      *The missing verb.* Psalm 40 begins the line “Be pleased, O LORD, to deliver me.” The Hebrew of this psalm has no “be pleased.” It has five words and one command, which comes last: God, to deliver me; LORD, to my help, hasten. The King James Version says “Make haste” twice where the Hebrew says it once. A modern translation supplies Psalm 40’s verb instead: “Be pleased, O God, to deliver me.” As the Hebrew stands, the verse is two calls on God with the request held to the final word.

      *The names.* In Psalm 40 these five verses call on “the LORD” three times, on “the Lord” (the title, not the name) once, and on “my God” once. Here “God” stands three times and “the LORD” twice. The change is not carried through evenly. In verse 4 “The LORD be magnified” has become “Let God be magnified,” but in the last verse the exchange runs the other way: Psalm 40 ends “O my God” ([[Ps. 40:17]]), and this psalm ends “O LORD.” Psalm 53 makes the same kind of change to Psalm 14, “God looked down from heaven” for “The LORD looked down from heaven” ([[Ps. 53:2]]; [[Ps. 14:2]]).
    sources: [oshb-wlc, lds-scriptures, nrsvue]

  - ref: 2
    phrase: that seek after my soul
    kind: structure
    title: Two kinds of seekers and what each says
    body: |
      The middle of the psalm sets two groups against each other by giving them the same two Hebrew verbs: each seeks (verses 2 and 4), and each says (verses 3 and 4). One group seeks the speaker’s “soul,” which is his life (“who seek my life”), and says “Aha, aha.” The other seeks God and says, continually, “Let God be magnified.”

      “Let God be magnified” is about God, and a modern translation gives it as a plain statement: “God is great!” The rejoicing he asks for is “in thee.” Psalm 35 has the same two sayings, and the note on [[Ps. 35:27]] takes up the word “magnified.”

      Verses 2 and 3 are wishes addressed to God. Each is “let them,” and none says what the speaker will do. The note on [[Ps. 35:4]] explains what such wishes ask for, and the full treatment of prayers against enemies is in the notes on [[Ps. 137:8]].
    sources: [oshb-wlc, nrsvue, lds-scriptures]

  - ref: 3
    phrase: Aha, aha
    kind: words
    title: Aha is pleasure at another’s fall
    body: |
      “Aha” translates a Hebrew interjection “expressing joy,” and in the Psalms the joy is “satisfaction over the misfortune of an enemy or rival.” Psalm 35 gives their words in full: “Aha, aha, our eye hath seen it” ([[Ps. 35:21]]). Here the cry stands without an object, and even the “unto me” of [[Ps. 40:15]] is absent.

      “For a reward of their shame” does not mean that shame earns a prize. The Hebrew word behind “reward” means a consequence, and the phrase is “in consequence of the disgrace falling upon them.” A modern translation has “turn back because of their shame.”

      The verb differs from Psalm 40’s. There the mockers are to “be desolate”; here they are to “be turned back,” a different Hebrew verb.
    sources: [bdb, nrsvue, oshb-wlc, lds-scriptures]

  - ref: 5
    phrase: But I am poor and needy
    kind: words
    title: Poor and needy, and still asking
    body: |
      “Poor and needy” is the Psalms’ language for a person who is afflicted and needs God’s deliverance. The first word is “poor, weak, afflicted,” used of the faithful “afflicted by wicked nations or the wicked in Israel itself.” The second is one “needing help, deliverance from trouble, especially as delivered by God.” The two are a set pair in the Psalms, and another psalm opens its prayer with them: “Bow down thine ear, O LORD, hear me: for I am poor and needy” ([[Ps. 86:1]]).

      What follows the words is where this psalm departs furthest from Psalm 40. Where that psalm has its sentence of trust ([[Ps. 40:17]]), this one repeats the command that ended verse 1, and its final words add the negative: “make no tarrying,” from a verb meaning to “delay, tarry.”
    sources: [bdb, lds-scriptures, oshb-wlc]

christ: |
  The psalm calls on God by His covenant name in its first verse and its last: “O LORD.” That name is Jehovah, and “Jehovah is the premortal Jesus Christ.”

  The first verse asks the LORD “to help me,” and the last, in the same breath as that name, says “thou art my help and my deliverer.”

  The psalm these verses come from is read of the Savior in the New Testament, where its middle verses are introduced with the words “when he cometh into the world, he saith” ([[Heb. 10:5]]). Hebrews quotes verses 6–8 of that psalm and not this plea; the second note on [[Ps. 40:6]] follows the argument.

explore: |
  - **The plea in its first setting.** Read [[Ps. 40:1–17]] through and notice what stands before these five verses: a rescue already given and a new song.
  - **The same cry elsewhere.** [[Ps. 22:19]], [[Ps. 38:22]] and [[Ps. 71:12]] all ask God to make haste.
  - **The mockers and the friends at length.** [[Ps. 35:19–28]] has both sayings of this psalm, with more of what each group says.

parallels:
  - ref: Ps. 40:13–17
    note: The same five verses, at the end of a psalm of thanksgiving, with “yet the Lord thinketh upon me.”
  - ref: Ps. 35:21–27
    note: The mockers’ “Aha, aha” and the friends’ “Let the LORD be magnified.”
  - ref: Ps. 71:12–13
    note: The next psalm repeats the plea for haste and the wish against those who seek his hurt.
  - ref: Ps. 38:22
    note: The other psalm titled “to bring to remembrance” ends with the same plea.

