chapter: 58
title: A God That Judgeth in the Earth
tagline: A question put to those who judge, a charge that they cannot be reasoned with, one prayer that God disarm them, and an answer spoken by an onlooker at the end.
when: 'By its title, a Michtam of David; no occasion is given'

setting: |
  Psalm 58 stands in the middle of five psalms in a row (56–60) whose titles call them Michtams of David. Its title names no occasion. One older reading sets it in the days of Absalom, who courted Israel with the promise of justice: “Oh that I were made judge in the land” ([[2 Sam. 15:4]]). That is an inference. The psalm names no one.

  Those it addresses are people who judge. The heading in the Church’s edition takes them to be wicked judges, and in Psalm 82 God asks those who judge, “How long will ye judge unjustly” ([[Ps. 82:2]]).

  Its place after Psalm 57 has been explained by one image. There the speaker lies among men “whose teeth are spears and arrows” ([[Ps. 57:4]]), and here the prayer is that God break the teeth of the wicked. The two titles also share the words “Al-taschith,” probably the name of a tune.

  The psalm complains and pleads, but not about the speaker’s own trouble: there is no “I” or “me” in it. Its plea is that God break the teeth of the wicked and sweep them away. How the cursing psalms are read is set out at [[Ps. 137:8]]; the notes here say what is this psalm’s own.

thread: |
  Psalm 58 opens with a question and closes with its answer. The question is put to those who hold the power to judge: “do ye judge uprightly?” The answer is given by someone else, an onlooker, after everything is over: “verily he is a God that judgeth in the earth.” The verb is the same in both lines, and so is the place. The wrong of verse 2 is done “in the earth,” and the judging of verse 11 is done “in the earth.”

  Between the two lines the psalm moves in three steps, and the person addressed changes at each. Verses 1–2 speak to the judges: “ye.” Verses 3–5 turn away and speak about them: “they.” They have lied from the start, and they are like a serpent that stops its own ear.

  The psalm turns at verse 6, the only verse that speaks to God. One older reading explains the turn by the stopped ear: if the wicked will not hear, nothing remains but to pray for their removal. In Hebrew the verse begins with “God” and ends with “LORD,” the one place the psalm has the divine name. What the prayer asks, in a rush of pictures through verse 9, is that their teeth be broken and that they melt and pass away.

  The last two verses are spoken about what follows. The speaker asked the judges whether they speak righteousness; at the end it is “the righteous” who rejoices, and “a man,” no one in particular, who draws the conclusion.

sections:
  - range: 1-2
    heading: Do ye judge uprightly?
    plain: |
      Do you really speak what is right, you who judge? Do you judge people fairly? No. In your hearts you work out wrongs, and on the earth your hands weigh out violence.
  - range: 3-5
    heading: The deaf adder
    plain: |
      The wicked have turned aside from the womb; they have gone astray from birth, telling lies. Their venom is like a serpent’s. They are like a deaf adder that stops its ear and will not listen to the voice of charmers, however skilled the one who casts the spell.
  - range: 6-9
    heading: Break their teeth, O God
    plain: |
      O God, break the teeth in their mouths; tear out the fangs of the young lions, O LORD. Let them vanish like water that runs away; when they aim their arrows, let the arrows be as if cut in pieces. Let them be like a snail that melts as it goes, like a child born dead that never sees the sun. Before your pots can feel the heat of the thorns, He will sweep them away as with a whirlwind, the green and the burning alike.
  - range: 10-11
    heading: Verily there is a reward
    plain: |
      The righteous will be glad when he sees the vengeance; he will wash his feet in the blood of the wicked. And people will say, “Surely there is a reward for the righteous; surely there is a God who judges on the earth.”

notes:
  - ref: 0
    phrase: Al-taschith
    kind: words
    title: Do not destroy
    body: |
      The words the King James leaves untranslated mean “Do Not Destroy,” and they are probably the name of a tune. The same words head Psalms 57, 59 and 75, and they are taken up at their first appearance ([[Ps. 57:1]]). “To the chief Musician” is explained at [[Ps. 8:1]] and “Michtam” at [[Ps. 16:1]].
    sources: [nrsvue, bd-psalms, lds-scriptures]

  - ref: 1
    phrase: O congregation
    kind: words
    title: Congregation, silence, or gods
    body: |
      The word the King James translates “congregation” is uncertain, and other readings make the line an address to the powerful. As the Hebrew text has it, the word is a noun meaning “silence.” The standard lexicon doubts that sense here and advises reading a different word in its place. Two modern translations read another word, and they differ: “Do you indeed decree what is right, you gods?” and “Do you rulers indeed speak justly?” The ancient Greek has no word of address in the first half of the line: “If ye do indeed speak righteousness, then do ye judge rightly, ye sons of men.”

      Whichever word is read, the verse says what these people do. They “speak righteousness” and they “judge,” which is the work of a court.

      The reading “gods” sends a reader to Psalm 82, where God “judgeth among the gods” ([[Ps. 82:1]]) and asks, with the verb of this verse, “How long will ye judge unjustly” ([[Ps. 82:2]]). Who the gods of that psalm are, human judges who hold God’s authority or members of His heavenly council, is taken up in the note on [[Ps. 82:6]]. This psalm has no scene in heaven. Its judges do their wrong “in the earth” (verse 2), and it is in the earth that God is said at the end to judge.
    sources: [oshb-wlc, bdb, nrsvue, niv, lxx-rahlfs, lds-scriptures]

  - ref: 3
    phrase: The wicked are estranged from the womb
    kind: scripture
    title: Astray from the womb
    body: |
      The line’s subject is “the wicked,” and what it charges them with is “speaking lies”; the verse does not speak of everyone who is born.

      The Church’s edition marks “astray” with a reference to the topic of being conceived in sin, the subject of a better-known line, “in sin did my mother conceive me” ([[Ps. 51:5]]). That line has been taken to teach original sin, the idea that all are condemned for what Adam and Eve did. The Church calls that idea false: by Restoration scripture a person is born innocent, though into a fallen condition.
    sources: [lds-scriptures, scripture-helps-ps-49, nrsvue]

  - ref: 4
    phrase: they are like the deaf adder that stoppeth her ear
    kind: symbol
    title: The serpent that will not be charmed
    body: |
      The adder of this verse is deaf because it stops its own ear, so that no charmer reaches it. The Hebrew word names “a venomous serpent, perhaps cobra,” and the “charmers” of verse 5 are literally “whisperers,” that is, serpent-charmers. Ecclesiastes mentions the same practice: “Surely the serpent will bite without enchantment” ([[Eccl. 10:11]]).

      One older reading presses the wording: this is a serpent that “makes itself deaf,” and so “a figure of the self-hardening evil-doer.” The best charmer fails, “charming never so wisely.”

      On that reading the image explains the turn the psalm takes next. “The most inventive affection and the most untiring patience cannot change their mind. Nothing therefore remains to David but to hope for their removal, and to pray for it.”
    sources: [bdb, niv, nrsvue, delitzsch-psalms, lds-scriptures]

  - ref: 6
    phrase: Break their teeth, O God, in their mouth
    kind: scripture
    title: The one prayer of the psalm
    body: |
      Verse 6 is the only verse of the psalm addressed to God, and it asks Him to break the teeth of lions. Everything before it was said to the judges or about them; here the speaker turns to the One who can do something.

      The wicked were a serpent with venom in verse 4; now they are young lions, and a modern translation gives their “great teeth” as “fangs.” The neighbouring psalm has lions and teeth together: “My soul is among lions,” among men “whose teeth are spears and arrows” ([[Ps. 57:4]]). Psalm 3 also speaks of broken teeth (see the note on [[Ps. 3:7]]).

      The speaker does nothing himself and proposes to do nothing; he asks. How prayers of this kind are read, with the Savior’s higher law, is set out in the note on [[Ps. 137:8]].
    sources: [nrsvue, lds-scriptures]

  - ref: 8
    phrase: As a snail which melteth, let every one of them pass away
    kind: symbol
    title: The snail and the untimely birth
    body: |
      The pictures of verses 7–8 are of things that vanish: water that runs off, a snail that melts, a child that never sees the sun. The snail’s Hebrew name has been explained by its “slimy trail,” and the line imagines it wasting away along that trail: “a slug that melts away as it moves along.” The untimely birth is a child that never lives to see the sun; Job uses the same Hebrew word when he wishes he had been one, “as infants which never saw light” ([[Job 3:16]]).

      The second half of verse 7 is the unclear line among them. The King James has “let them be as cut in pieces,” and does not say whether “them” is the arrows or the wicked. One modern translation marks the Hebrew “uncertain,” corrects it, and reads “like grass let them be trodden down and wither”; another keeps the arrows and has them “fall short.” On each reading the weapon or the man fails.
    sources: [bdb, niv, nrsvue, lds-scriptures]

  - ref: 9
    phrase: Before your pots can feel the thorns
    kind: words
    title: Before the pot is warm
    body: |
      The verse is a picture of speed: judgment comes before a cooking pot has felt the fire under it. That much is common to the translations quoted here, which otherwise go different ways. The “thorns” are the bramble or buckthorn, named here “as fuel,” and the verb means to “sweep or whirl away,” as a storm wind does. “Your pots” speaks to the judges once more.

      The last words are the difficulty. The King James has “both living, and in his wrath.” Modern translations take the two words of the fuel, “whether green or ablaze” or “whether they be green or dry.” The ancient Greek read the whole line otherwise: “Before your thorns feel the white thorn, he shall swallow you up as living, as in his wrath.”
    sources: [bdb, lxx-rahlfs, nrsvue, niv]

  - ref: 10
    phrase: The righteous shall rejoice when he seeth the vengeance
    kind: scripture
    title: Whose vengeance the righteous sees
    body: |
      The righteous man in this verse sees vengeance; the psalm does not say that he takes it. The verse follows a prayer that asked God to act, and verse 9 has just said who acts: “he shall take them away as with a whirlwind.” One modern translation brings out that he is a witness: “The righteous will rejoice when they see vengeance done.”

      The second half of the verse is a picture of feet wet with the blood of the fallen. Another psalm has it, after saying who strikes: “But God shall wound the head of his enemies” ([[Ps. 68:21]]), “That thy foot may be dipped in the blood of thine enemies” ([[Ps. 68:23]]).

      Verse 11 says what the rejoicing is about. It begins “So that,” and what follows is a confession about God: that there is a reward for the righteous, and that there is a Judge.
    sources: [lds-scriptures, nrsvue]

  - ref: 11
    phrase: verily he is a God that judgeth in the earth
    kind: structure
    title: The answer to the first question
    body: |
      The last line answers the first, in the first line’s own words. “Judgeth” is the Hebrew verb of “do ye judge” in verse 1. “In the earth” is the phrase of verse 2, where the judges’ hands weigh out violence. And the one who says it is “a man,” the Hebrew *adam*, the word of “sons of men” in verse 1. The judges were asked whether they judge rightly on the earth; a man answers that God does.

      The Hebrew has a detail that English cannot show. “Judgeth” is a plural form, though it goes with “God,” so that a modern translation, which prints “surely there is a God who judges on earth,” notes that the words could be read “there are gods who judge.” One older reading takes the plural as deliberate. The name of God, which “is construed with the plural” in other places too, has it here “in order to set the infinite majesty and omnipotence of the heavenly Judge in contrast with these puffed-up ‘gods’” of verse 1; those who had been misled are compelled to confess “that there is really one higher than the high ones.” That depends on reading “gods” in verse 1 (see the note there), and it is one reading of the grammar.
    sources: [oshb-wlc, nrsvue, delitzsch-psalms]

christ: |
  The psalm’s one prayer calls on God by name, “O LORD” (verse 6). That name is Jehovah, and “Jehovah is the premortal Jesus Christ.” The Church’s edition marks “judgeth” in the last line with a reference to Jesus Christ as Judge, and the Savior said of Himself, “the Father judgeth no man, but hath committed all judgment unto the Son” ([[John 5:22]]).

explore: |
  - **The same charge, in the council of heaven.** [[Ps. 82:1–8]], with the note on [[Ps. 82:6]].
  - **Judged of God or of man.** The Church’s edition sets King Mosiah’s words on judges beside verse 1 ([[Mosiah 29:11]]). He goes on: “the judgments of God are always just, but the judgments of man are not always just” ([[Mosiah 29:12]]).
  - **The psalms on either side.** Psalms 57 and 59 carry the same words in their titles and are set by them in David’s flight from Saul ([[Ps. 57:1]]; [[Ps. 59:1]]).

parallels:
  - ref: Ps. 82:2
    note: God asks the gods, “How long will ye judge unjustly,” with the verb of verse 1.
  - ref: Ps. 57:4
    note: The speaker is “among lions,” among men “whose teeth are spears and arrows”; here the prayer is that God break the teeth of the young lions.
  - ref: Isa. 48:8
    note: Israel “wast called a transgressor from the womb.”
  - ref: Job 3:16
    note: The “untimely birth” that never saw light, the same Hebrew word as in verse 8.
  - ref: Ps. 68:23
    note: The foot dipped in the blood of enemies whom God has wounded.
  - ref: Mosiah 29:12
    note: “The judgments of God are always just, but the judgments of man are not always just.”

