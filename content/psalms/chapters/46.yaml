chapter: 46
title: God Is Our Refuge
tagline: With the earth giving way and the nations in uproar, a congregation sings that God is in the midst of His city, and then God Himself tells the nations to be still.
when: 'Undated; for the sons of Korah by its title'

setting: |
  The psalm stands among the Korahite psalms near the head of Book Two (for the family, see [[Ps. 42:1]]). It is counted with the songs of Zion, psalms that “celebrate the location of the temple at Mount Zion” and rejoice that the Lord is present there: Psalms 46, 48, 76, 84, 87 and 122.

  No occasion is named. One older reading finds “the key” to Psalms 46–48 in the deliverance under Jehoshaphat. The invaders of Judah turned their weapons on one another, and “the children of the Korhites” were among the Levites who stood up to praise ([[2 Chr. 20:19]]). The same reading allows that it is “equally admissible” to refer the three psalms to the destruction of Sennacherib’s army in Hezekiah’s day ([[2 Kgs. 19:35]]). Either is a proposal. The psalm itself speaks only of nations in uproar around a city that God does not let fall.

  It is a congregation’s song: “our refuge,” “with us,” and never “I” until God speaks in verse 10. Three stanzas are each closed by “Selah” (on the word, see [[Ps. 3:2]]), and the last two by a refrain.

  Later scripture takes the psalm up. A prophecy of Zenos shares its wording (see the note on verse 2), the Lord repeats verse 10 to the Saints driven from Jackson County ([[D&C 101:16]]), and Joseph Smith’s translation turns the psalm toward the future (see the first note on verse 5).

thread: |
  Psalm 46 states its conclusion first: “God is our refuge and strength.” The rest of the psalm tests that sentence against three scenes, the made world, a city and the whole earth, and **in each stanza what is shaken is set beside the one thing that is not.**

  The first stanza (verses 1–3) takes the made world. The earth changes, the mountains go down into the sea, the waters roar. Nothing is said to stop any of it. The congregation says only, “Therefore will not we fear.”

  The second stanza (verses 4–7) narrows to a city, and the water changes. In place of the roaring sea there is a river that makes the city glad, and in place of the river, a verse later, there is God Himself: “God is in the midst of her; she shall not be moved.” The nations rage and the kingdoms are moved in the words just used of the sea and the mountains (see the note on verse 6). One sentence ends it: “he uttered his voice, the earth melted.” The refrain follows for the first time.

  The third stanza (verses 8–11) widens to the whole earth. The congregation is called to look at what the LORD has done, and what it sees is the wreckage of weapons: bow, spear and chariot. He makes wars cease “unto the end of the earth.”

  The turn comes at verse 10. Until then the congregation has spoken about God. Now God speaks, once, in His own person, and to the nations: “Be still, and know that I am God.” The congregation’s last word is the refrain, unchanged. The psalm began with what God is to His people and ends there, having heard Him say it of Himself to everyone else.

sections:
  - range: 1-3
    heading: Though the earth be removed
    plain: |
      God is our shelter and our strength, a help that is always found when trouble comes. So we will not be afraid, though the earth should change and the mountains slip into the heart of the sea, though its waters roar and foam and the mountains shake at its swelling.
  - range: 4-7
    heading: The city that is not moved
    plain: |
      There is a river whose streams make the city of God glad, the holy dwelling place of the Most High. God is within her, and she will not be moved. God will help her as morning breaks. Nations raged and kingdoms tottered; He gave voice, and the earth melted. The LORD of hosts is with us. The God of Jacob is our stronghold.
  - range: 8-11
    heading: Be still
    plain: |
      Come and see what the LORD has done, the desolations He has made on the earth. He ends wars to the ends of the earth. He breaks the bow, cuts the spear in two, and burns the chariot. “Be still, and know that I am God. I will be exalted among the nations; I will be exalted in the earth.” The LORD of hosts is with us. The God of Jacob is our stronghold.

notes:
  - ref: 0
    phrase: A Song upon Alamoth
    kind: words
    title: Alamoth
    body: |
      Alamoth is a direction to the musicians, and it may mean that the song was set for high voices. The word is the plural of the Hebrew for a young woman, so that the phrase is “to (the voice of) young women, either literally, or of soprano or falsetto of boys.” Glossed “maidens,” it is paired with Sheminith (“the octave”), and titles of this kind “seem to imply that there was singing in parts.”

      The word occurs once outside the Psalms. When David brought the ark up to Jerusalem, eight of the musicians played “with psalteries on Alamoth” ([[1 Chr. 15:20]]), and the next verse has harps “on the Sheminith” ([[1 Chr. 15:21]]; see [[Ps. 6:1]]).

      None of this is certain. A modern translation leaves the word as it is, “According to Alamoth,” and the ancient Greek translation has no musical term here: its title reads “a Psalm concerning secret things.”

      The rest of the title is explained elsewhere: “To the chief Musician” at [[Ps. 8:1]] and the sons of Korah at [[Ps. 42:1]].
    sources: [bdb, bd-psalms, lds-scriptures, nrsvue, lxx-rahlfs]
  - ref: 2
    phrase: though the earth be removed
    kind: symbol
    title: Creation coming undone
    body: |
      The first stanza imagines the made world falling back into the sea. Where the King James has the earth “removed,” a modern translation has “though the earth should change,” and the mountains go down “in the heart of the sea.”

      One reading takes the picture from Genesis. The mountains “sink back again into the waters out of which they appeared on the third day of the creation, so that consequently the old chaos should return.” On that reading the congregation “supposes the most extreme case, viz., the falling in of the universe which has been creatively set in order,” and the language is not to be taken as an allegory in which the mountains are kingdoms. The changing earth and the slipping mountains are “both symbolic of extreme insecurity.”
    sources: [delitzsch-psalms, bdb, nrsvue]
  - ref: 2
    phrase: the mountains be carried into the midst of the sea
    kind: scripture
    title: Zenos and the mountains carried
    body: |
      Zenos’s prophecy of the signs at the death of Christ shares this verse’s rare word “carried.” Nephi, who knew the prophecy from the plates of brass, quotes him: the Lord would visit the house of Israel “by the opening of the earth, and by mountains which shall be carried up” ([[1 Ne. 19:11]]). Other passages of the Bible speak of mountains lifted up or removed, but only this verse speaks of mountains being “carried.”

      The two passages share more than that, among other things the voice of God and the name “the God of Jacob” ([[1 Ne. 19:10]]; verse 7 here). Whether Zenos was quoting the psalm cannot be known. He “was certainly in touch with the traditions that we find there.”

      The psalm “does not appear to be a prophecy” of the kind Nephi cites. Its imagery, though, is that of the prophets’ day of the Lord, and Zenos applied such imagery “not only to the Second Coming of Christ, but also to the time of His death.”

      Hebrews seems to draw on the same verses. It speaks of “the removing of those things that are shaken” ([[Heb. 12:27]]) and of “a kingdom which cannot be moved” ([[Heb. 12:28]]), ideas that “appear to be drawing on” the psalm’s moved mountains and kingdoms and its unmoved city.
    sources: [sc-knowhy-313, lds-scriptures]
  - ref: 4
    phrase: There is a river
    kind: symbol
    title: The river that makes the city glad
    body: |
      On one reading, the river set against the roaring sea of verse 3 is “the river of grace.” The psalm does not name the stream, and its next verse says, “God is in the midst of her.” That reading follows the move: “in the place of the river we find Him from whom the river issues forth.” It likens the stream to the river of another psalm: “thou shalt make them drink of the river of thy pleasures” ([[Ps. 36:8]]).

      The same reading takes the picture from Eden, where “a river went out of Eden to water the garden” ([[Gen. 2:10]]): here, likewise, “a stream makes Jerusalem as it were into another paradise.”

      It also holds that “the image of the stream in the Psalm has suggested” a bolder figure in Isaiah: “But there the glorious LORD will be unto us a place of broad rivers and streams; wherein shall go no galley with oars, neither shall gallant ship pass thereby” ([[Isa. 33:21]]).
    sources: [delitzsch-psalms, lds-scriptures]
  - ref: 5
    phrase: God is in the midst of her
    kind: scripture
    title: Joseph Smith’s translation, “Zion shall come”
    body: |
      Joseph Smith’s translation turns this verse, and with it the whole psalm, toward a city still to come. In the manuscript the verse begins, “For Zion shall come, and God shall be in the midst of her,” and the verbs that follow are moved into the future: the heathen “shall be enraged,” the Lord “shall utter his voice,” and the desolations of verse 8 are those He “shall make in the earth in the latter days.” The psalm’s events thus “become prophetic, set not in the Psalmist’s lifetime.”

      This is one of four psalms in which the translation adds the name Zion (Psalms 14, 15, 46 and 53). The work on Psalms is dated to about January and February 1833, when “the concept of Zion was prominent in the minds of Church members.” Here the wording is no plea. It is “a prophetically sure statement—Zion will come and God shall be in her midst.”

      Compare what Enoch was told of the latter-day Zion: “there shall be mine abode, and it shall be Zion” ([[Moses 7:64]]).
    sources: [jsp-ot2, lefevre-jst-psalms, lds-scriptures]
  - ref: 5
    phrase: and that right early
    kind: words
    title: Help at the turn of the morning
    body: |
      “Right early” translates a Hebrew phrase for the approach of morning, and a modern translation has “God will help it when the morning dawns.”

      The same Hebrew phrase tells when the sea closed over Pharaoh’s army: “the sea returned to his strength when the morning appeared” ([[Ex. 14:27]]). In the psalm the phrase is used figuratively.
    sources: [bdb, nrsvue, lds-scriptures]
  - ref: 6
    phrase: The heathen raged, the kingdoms were moved
    kind: structure
    title: The sea’s words used of the nations
    body: |
      The first stanza’s two verbs for the sea and the mountains return in the second stanza for the nations and the kingdoms, and the city is said not to be moved.

      The waters “roar” (verse 3) and the heathen “raged.” That is one Hebrew verb, used to “roar, of waves” and to “be tumultuous, of peoples.” The mountains are “carried” into the sea (verse 2), the kingdoms “were moved,” and the city “shall not be moved” (verse 5). That is one verb again, to totter or slip, and in verse 5 to “be shaken, moved, overthrown.” A modern translation keeps the last pair together: “the kingdoms totter,” but of the city, “it shall not be moved.”

      Isaiah compares peoples and seas outright: “Woe to the multitude of many people, which make a noise like the noise of the seas” ([[Isa. 17:12]]).

      The psalm does not explain the echo. In its own words, the mountains and the kingdoms are shaken alike, and the city with God in its midst is not.
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]
  - ref: 7
    phrase: The LORD of hosts is with us
    kind: christ
    title: With us, the word in Immanuel’s name
    body: |
      The refrain’s “with us” is the Hebrew word that begins the name Immanuel. *ʿImmanu* is “with us.” Followed by *El*, God, it is the name Isaiah gave the promised child ([[Isa. 7:14]]) and the watchword he gave Judah when the nations gathered: “it shall not stand: for God is with us” ([[Isa. 8:10]]). The refrain has been heard as a reminder of that watchword. Matthew gives the name to Jesus: “they shall call his name Emmanuel, which being interpreted is, God with us” ([[Matt. 1:23]]).

      The psalm’s own statement is that the LORD of hosts was with His people in their city. On that name, see [[Ps. 24:10]].

      The second half of the refrain changes a word. “Refuge” in verse 1 is a shelter. Here it is a different Hebrew word, also used of God as a refuge, for which a modern translation offers “fortress.”

      It has been supposed that the refrain once closed the first stanza too and “has accidentally fallen out here.” That is a conjecture.
    sources: [oshb-wlc, delitzsch-psalms, bdb, nrsvue, lds-scriptures]
  - ref: 10
    phrase: Be still
    kind: words
    title: A command to stop, spoken to the nations
    body: |
      “Be still” is a command to let go and stop, and God speaks it to the nations. The verb is plural, and in this form it means to “let alone, i.e. do nothing, be quiet.” Samuel uses it in this sense to Saul: “Stay, and I will tell thee what the LORD hath said to me this night” ([[1 Sam. 15:16]]).

      Verse 10 is the only verse of the psalm in which someone says “I,” and a modern translation prints it as a quotation. It follows directly on the broken bow and the burned chariot, and Joseph Smith’s translation names the hearers: the Lord burns the chariot “and saith unto the nations, Be still, and know that I am God.”
    sources: [oshb-wlc, bdb, nrsvue, jsp-ot2, lds-scriptures]
  - ref: 10
    phrase: know that I am God
    kind: prophets
    title: The Lord repeats the words to the Saints of Zion
    body: |
      The Lord spoke this line again in December 1833, to Saints in Missouri. Mobs “had driven them from their homes in Jackson County,” Missouri, and the revelation given at Kirtland says: “Therefore, let your hearts be comforted concerning Zion; for all flesh is in mine hands; be still and know that I am God” ([[D&C 101:16]]).

      The revelation came “shortly after the work” on the translation of the Psalms, in which God says these words to the nations in the latter days (see the note on verse 5). It has been read as the fulfilment, “in effect,” of the psalm as the Prophet translated it.

      Elder David A. Bednar taught from the revelation that the Lord’s admonition “entails much more than simply not talking or not moving.” It “may be a way of reminding us to focus upon the Savior unfailingly as the ultimate source of the spiritual stillness of the soul that strengthens us to do and overcome hard things.”
    sources: [lds-scriptures, lefevre-jst-psalms, bednar-be-still]

christ: |
  The refrain says that the LORD of hosts is “with us,” and its word is the one in the name Immanuel, which Matthew gives to Jesus: “God with us” ([[Matt. 1:23]]; see the note on verse 7).

  The New Testament seldom uses the psalm. A prophet on the plates of brass may have: Zenos foretold the signs of the Savior’s death in language this psalm shares (see the second note on verse 2). It has also been suggested, tentatively, that “I will be exalted” in verse 10 can be rendered as being lifted up among the nations, and that Hebrews “may have” read it of Christ, who “endured the cross” and “is set down at the right hand of the throne of God” ([[Heb. 12:2]]).

  In the latter days the Lord took the words of verse 10 as His own to comfort His Saints ([[D&C 101:16]]).

explore: |
  - **The other songs of Zion.** Read beside this psalm [[Ps. 48:1–8]], where the kings who assemble against the city of God hurry away, and [[Ps. 76:1–6]], where God breaks the arrows, the shield and the sword in Zion.
  - **The end of war.** Verse 9 has been read as “a prelude to the ceasing of all war” foretold in [[Isa. 2:4]] and [[Micah 4:3]].

parallels:
  - ref: D&C 101:16
    note: The Lord repeats verse 10 to the Saints driven from Jackson County.
  - ref: 1 Ne. 19:10–12
    note: Zenos foretells the signs of Christ’s death in wording this psalm shares, including mountains “carried.”
  - ref: Isa. 8:10
    note: The watchword “God is with us” when the nations gather against Judah (also Matt. 1:23).
  - ref: Heb. 12:26–28
    note: What can be shaken is removed, and a kingdom that cannot be moved remains.
  - ref: Isa. 33:21
    note: The LORD Himself as a place of broad rivers and streams for His city.

