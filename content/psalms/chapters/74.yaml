chapter: 74
title: Remember Thy Congregation
tagline: With the sanctuary burned and no prophet left to say how long, the congregation reminds God of the sea He divided and asks Him to plead His own cause.
when: 'By its title, a psalm of Asaph; after a burning of the sanctuary, and which one is debated'

setting: |
  Psalm 74 is the second of the eleven psalms in a row, 73–83, that carry Asaph’s name. It is a lament of the whole people, spoken as “we” and “us” (the form is set out at [[Ps. 22:1]]; an earlier lament of the nation is [[Ps. 44:9]]).

  What has happened is told in verses 3–8. Enemies have come into the sanctuary, set up their own signs there, hacked its carved woodwork to pieces, set it on fire and brought it “to the ground,” and burned every other meeting place in the land. Kings records one such day, when the captain of Nebuchadnezzar’s guard “burnt the house of the LORD” ([[2 Kgs. 25:9]]), and Lamentations mourns that day in lines that sound like some of the psalm’s ([[Lam. 2:6–9]]). Psalm 79 has been read as coming from the same circumstances as this psalm. Some lines have been thought to fit a later desecration better, and the note on verse 7 gives both sides.

  The psalm names no king, no priest and no leader of any kind. Its one prophet is the one who is missing (verse 9). Apart from a single “my” in verse 12, the only speaker is the congregation, and from the first line to the last it speaks to God.

thread: |
  Psalm 74 is **a prayer that argues from memory**. Its verbs of asking are “remember” (verses 2, 18 and 22) and “forget not” (verses 19 and 23), and what it fears has one Hebrew word, which the King James gives as “for ever” in verses 1, 10 and 19 and as “perpetual” in verse 3. Has God cast off His people for ever? The ruins look permanent, and nobody can say how long.

  The psalm moves in four steps. It asks God to remember the congregation He purchased and to come and look at the ruins (verses 1–3). It tells Him what the enemy did in His own house (verses 4–9). It asks how long, and why His hand is idle (verses 10–11).

  Then it turns. “For God is my King of old”: verses 12–17 say nothing about the enemy and address God seven times over as “thou,” the one who divided the sea, broke the heads of Leviathan, opened the spring, dried the rivers, and made day and night and the seasons. The psalm reports no change in the ruins between verse 11 and verse 12. What changes is its subject.

  From that memory it asks again (verses 18–23), and the requests are bolder: remember, deliver not, forget not, have respect unto the covenant, arise. A vow of praise is one of the usual parts of a lament. This one has none, and no answer is reported. Its last line is still the enemy’s noise, going up “continually.”

sections:
  - range: 1-3
    heading: Why hast thou cast us off?
    plain: |
      O God, why have You cast us off for ever? Why does Your anger smoke against the sheep of Your pasture? Remember Your congregation, which You purchased long ago and redeemed to be the tribe of Your inheritance, and this Mount Zion where You have lived. Turn Your steps toward the endless ruins, toward everything the enemy has wrecked in the sanctuary.
  - range: 4-9
    heading: Axes, hammers and fire
    plain: |
      Your enemies roared in the middle of Your meeting place and set up their own signs as signs. They looked like men swinging axes in a thicket of trees. And now they smash all its carved work with hatchets and hammers. They have set Your sanctuary on fire; they have defiled the dwelling place of Your name and brought it to the ground. They said in their hearts, “Let us crush them altogether,” and they burned every meeting place of God in the land. We do not see our signs. There is no prophet any more, and no one among us knows how long.
  - range: 10-11
    heading: How long?
    plain: |
      How long, O God, will the adversary scoff? Will the enemy revile Your name for ever? Why do You hold back Your hand, Your right hand? Draw it out of Your bosom.
  - range: 12-17
    heading: God is my King of old
    plain: |
      Yet God is my King from of old, working salvation in the midst of the earth. You divided the sea by Your strength; You broke the heads of the dragons on the waters. You crushed the heads of Leviathan and gave him as food to the dwellers of the wilderness. You split open spring and torrent; You dried up ever-flowing rivers. The day is Yours, and the night is Yours; You set the light and the sun in place. You fixed all the borders of the earth; summer and winter, You made them.
  - range: 18-23
    heading: Arise, plead thine own cause
    plain: |
      Remember this: the enemy has scoffed, O LORD, and a foolish people has reviled Your name. Do not hand over the soul of Your turtledove to the multitude of the wicked; do not forget the congregation of Your poor for ever. Look to the covenant, for the dark places of the earth are full of the homes of cruelty. Do not let the oppressed turn back ashamed; let the poor and needy praise Your name. Rise up, O God, and plead Your own cause; remember how the fool scoffs at You all day long. Do not forget the voice of Your enemies, the uproar of those who rise against You, which goes up continually.

notes:
  - ref: 0
    phrase: Asaph
    kind: history
    title: A psalm of Asaph about a ruined sanctuary
    body: |
      The name in the title need not mean that David’s own choir leader wrote about a burned sanctuary. Asaph was the Levite David set over his choir ([[Ps. 50:1]] has the full note on him). But the musicians who took his name were a guild that lasted until after the Babylonian exile, and some of the psalms under his name may have been written by its later members. The list of those who came home from Babylon still counts among the singers “the children of Asaph, an hundred twenty and eight” ([[Ezra 2:41]]). A psalm “of Asaph” can therefore be the work of that family at a later day.

      “Maschil” is explained at [[Ps. 32:1]].
    sources: [bd-asaph, scripture-helps-ps-49, lds-scriptures]

  - ref: 2
    phrase: which thou hast purchased of old
    kind: scripture
    title: The words of the song at the sea
    body: |
      Verse 2 describes the congregation in words that the song Israel sang after crossing the sea used of the people God brought out of Egypt. That song praised the Lord for “the people which thou hast redeemed” ([[Ex. 15:13]]), spoke of the people “which thou hast purchased” ([[Ex. 15:16]]), and looked ahead: “Thou shalt bring them in, and plant them in the mountain of thine inheritance” ([[Ex. 15:17]]). Verse 2 has all of these: a congregation purchased, redeemed, God’s inheritance, and the mount where He has dwelt. The Hebrew verbs for “purchased” and “redeemed” and the noun “inheritance” are the same in both places.

      The song’s last picture is of the place God made to dwell in, “the Sanctuary, O Lord, which thy hands have established” ([[Ex. 15:17]]). The psalm’s next verse is about the sanctuary in ruins.

      “Of old” comes back in verse 12, in the same Hebrew word, at the psalm’s turn.
    sources: [lds-scriptures, oshb-wlc]

  - ref: 4
    phrase: they set up their ensigns for signs
    kind: words
    title: Their signs and our signs
    body: |
      One Hebrew word stands behind “ensigns” and “signs” in this verse and “our signs” in verse 9, and one older reading takes the two verses as a pair: the enemy’s signs stand where Israel’s can no longer be seen. The word can mean “ensigns, standards,” the banners of an army, and this verse has been listed under that sense. The older reading holds that military standards are not meant. Set up in the sanctuary, the word has “the religious reference in which it is used of circumcision and of the Sabbath,” and “our signs” in verse 9 are “the instituted ordinances of divine worship,” now out of sight “because the enemies have set them aside.” On that reading the two verses are a deliberate pair, “our signs” being “the direct antithesis” of theirs.

      The place has a careful name too. “Thy congregations” translates a word for an appointed meeting or its place. The phrase has been rendered “in the midst of thine assembly” and, in a modern translation, “within your holy place.” The same word returns in verse 8.
    sources: [oshb-wlc, bdb, delitzsch-psalms, nrsvue]

  - ref: 5
    phrase: A man was famous according as he had lifted up axes upon the thick trees
    kind: words
    title: Axes in a thicket
    body: |
      The Hebrew of verse 5 is obscure, and what is clear in it is the picture of axes swung at wood as in a forest. A modern translation marks the verse “Meaning of Heb uncertain” and, correcting it from the Greek and Syriac versions, reads it of the enemy hacking with axes at the wooden trellis of the upper entrance. The ancient Greek has the enemy cutting down the doors “with axes as in a wood of trees.” The King James joins the verse to the next as a contrast: a man was once known for lifting axes on thick trees, “but now” the axes fall on the sanctuary.

      What they break in verse 6 is “the carved work.” The Hebrew word is the one used of Solomon’s temple, whose walls he carved “with carved figures of cherubims and palm trees and open flowers” ([[1 Kgs. 6:29]]).
    sources: [nrsvue, lxx-rahlfs, oshb-wlc, lds-scriptures]

  - ref: 7
    phrase: They have cast fire into thy sanctuary
    kind: history
    title: Which burning of the sanctuary?
    body: |
      The psalm gives no date, and two have been argued: the destruction of Jerusalem by Nebuchadnezzar’s army, and the persecution under Antiochus Epiphanes some four centuries later.

      The fire speaks for the first. Chronicles says of the Babylonians that “they burnt the house of God” ([[2 Chr. 36:19]]), and the psalm says the sanctuary was set on fire and brought to the ground. Even the older reading that prefers the later date grants that verse 7 “applies just as unconditionally as it runs to the Chaldaeans, but not to the Syrians,” whose troops “burnt down several of the Temple-gates and razed many of its apartments.” Lamentations, over the Babylonian ruin, has the psalm’s own subjects in a few verses: the place of assembly destroyed, a noise in the house of the Lord, prophets with no vision ([[Lam. 2:6–9]]).

      For the second date, verses 4, 8 and 9 are held to be “the most satisfactorily explained from the Maccabaean age”: foreign signs in the temple, meeting places taken as synagogues, and a time when “it was felt more painfully than ever that prophecy had become dumb.” That reading decides for the later date in guarded words, “we yield to the force of the impression,” and allows that if the Babylonian ruin is meant the author could be “an Asaphite of the time of the Exile.”

      It is one older commentator’s judgment, and a hesitant one. The Church’s heading names no date, and this site’s chapter on Lamentations reads the psalm beside the Babylonian burning (see the note on [[Lam. 2:9]]).
    sources: [delitzsch-psalms, lds-scriptures]

  - ref: 8
    phrase: all the synagogues of God in the land
    kind: words
    title: “Synagogues” are God’s appointed meeting places
    body: |
      The word behind “synagogues” means an appointed meeting or the place of one, and it is the word translated “congregations” in verse 4. The phrase has been rendered “assembly places,” “all the appointed places of El in the land,” and “all the meeting places of God in the land.” What the King James calls synagogues are places appointed for meeting God.

      The ancient Greek translators took the word as appointed feasts and the whole line as the enemy’s speech: “Come, let us abolish the feasts of the Lord from the earth.”

      Whether synagogues are meant is one of the points argued in dating the psalm (see the note on verse 7).
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 9
    phrase: there is no more any prophet
    kind: history
    title: No prophet, and no one who knows how long
    body: |
      The loss the psalm names last, after the building, is the loss of a voice: no prophet, and so no one who can say how long this will last. Verse 10 then puts that question to God Himself. Lamentations says something close over fallen Jerusalem: “her prophets also find no vision from the LORD” ([[Lam. 2:9]]).

      The line also bears on the psalm’s date. Said just after the Babylonians burned the temple it “would seem strange,” since “Jeremiah’s term of active service lasted beyond this” and “six years before the destruction Ezekiel appeared”; and the verse in Lamentations does not quite match, “for there it is assumed that there were prophets, a fact which is here denied.” One older reading offers two answers. The psalm may speak from the middle of the exile, when Jeremiah’s seventy years “were then still a riddle without any generally known solution.” Or it belongs to the later persecution discussed at verse 7, which is the answer that reading prefers.
    sources: [delitzsch-psalms, lds-scriptures]

  - ref: 11
    phrase: pluck it out of thy bosom
    kind: symbol
    title: The right hand kept in the bosom
    body: |
      The picture is of God holding His right hand against His chest, unused, and the prayer is that He draw it out and act. A modern translation has “why do you keep your hand in your bosom?” and marks the rendering as a correction of the Hebrew.

      Lamentations says of the fall of Jerusalem that the Lord “hath drawn back his right hand from before the enemy” ([[Lam. 2:3]]; see the note on [[Lam. 2:5]]). The psalm asks why.
    sources: [nrsvue, lds-scriptures]

  - ref: 12
    phrase: For God is my King of old
    kind: structure
    title: 'The turn: seven times “thou”'
    body: |
      The psalm turns here by changing its subject, from what the enemy has done to what God has done. A modern translation marks the turn with “Yet.” Verses 4–8 belonged to “they”: they roar, they set up, they break down, they have cast fire, they have burned. In verses 13–17 the Hebrew sets the pronoun “thou” in front of seven verbs whose form already says “thou”: thou didst divide, thou brakest the heads of leviathan, thou didst cleave, thou driedst up, thou hast prepared, thou hast set, thou hast made.

      This is also the one place where a single voice speaks, “my King,” in a psalm that otherwise says “us” and “we.” And “of old” repeats the word of verse 2: the congregation was purchased of old, and God has been King of old.
    sources: [oshb-wlc, nrsvue]

  - ref: 14
    phrase: Thou brakest the heads of leviathan in pieces
    kind: symbol
    title: 'Leviathan: Egypt at the sea, and the sea monster of creation'
    body: |
      Leviathan in this verse is a sea monster that stands for a nation, and the nation is Egypt, broken when God divided the sea. Leviathan is “any great sea or land monster,” named in this verse as “symbolic of a nation.” The “dragons” of verse 13 have been glossed as the Egyptians and Leviathan here as “figurative of Egypt.” The next verse stays with that history: the Church’s edition ties it to the water from the rock and the drying of the Jordan. Isaiah sets the same two things together, the wounded dragon and “the depths of the sea a way for the ransomed to pass over” ([[Isa. 51:10]]; see the note on [[Isa. 51:9]]).

      One reading looks further back than the Exodus. Verses 16–17 go on to day and night, the sun, the borders of the earth and the seasons, and the lines about Leviathan, though cryptic, are “understood by many biblical scholars to be a reference to a myth in which Yahweh kills a cosmic sea-monster,” as in the Babylonian story in which a god kills the sea monster and makes heaven and earth of her body. On that reading the Old Testament shares with that story the notion of “a God who destroys chaos and turns it into order.” What the psalm plainly does is put the sea, the rock, the river, and the sun and seasons into one list of what God has done.

      The carcass is given “to the people inhabiting the wilderness.” A modern translation has “the creatures of the wilderness,” and the Greek translators made it “the Ethiopian nations.” Isaiah sets the last slaying of Leviathan in the future ([[Isa. 27:1]]).
    sources: [bd-leviathan, bdb, sc-knowhy-866, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 19
    phrase: the soul of thy turtledove
    kind: symbol
    title: A dove among wild beasts
    body: |
      The congregation calls itself God’s turtledove here, as it called itself the sheep of His pasture in verse 1, and the line may be asking that the dove not be given to wild animals. The King James’s “multitude” and “congregation” translate one Hebrew word used twice. A modern translation renders it “wild animals” the first time and “life” the second: “Do not deliver the soul of your dove to the wild animals” and then “do not forget the life of your poor forever.” The Greek has “wild beasts” and “souls.”

      Where the Hebrew has “thy turtledove,” the Greek has “a soul that gives praise to thee.”
    sources: [oshb-wlc, nrsvue, lxx-rahlfs]

  - ref: 20
    phrase: Have respect unto the covenant
    kind: scripture
    title: What the plea rests on
    body: |
      The psalm rests its plea on the covenant and on God’s own name, and it makes no confession of sin. Psalm 79, over a defiled temple, does: “O remember not against us former iniquities” ([[Ps. 79:8]]). Psalm 74 has no such line, and its “why” in verse 1 is left without an answer. What it puts before God is what is His. It is “thy congregation,” “thine inheritance,” “thy sanctuary” and “thy name” that have suffered, “thy turtledove” that is in danger, and at the end “thine own cause” that He is asked to plead.

      Which covenant is meant is not said. The Hebrew has “the covenant”; the Greek and a modern translation read “your covenant.” The psalm’s own account of the bond is in verse 2: a people purchased and redeemed to be God’s inheritance.
    sources: [lds-scriptures, nrsvue, lxx-rahlfs]

christ: |
  The God this psalm calls “my King of old, working salvation in the midst of the earth” is Jehovah, and “Jehovah is the premortal Jesus Christ.” The one time the psalm uses the divine name, it is to say that the enemy has reproached Him (verse 18). The deeds it remembers are His. Paul says that the fathers who “passed through the sea” ([[1 Cor. 10:1]]) and drank in the wilderness “drank of that spiritual Rock that followed them: and that Rock was Christ” ([[1 Cor. 10:4]]).

  Jacob used a monster as his picture of death and hell, praising God, “who prepareth a way for our escape from the grasp of this awful monster; yea, that monster, death and hell” ([[2 Ne. 9:10]]). The sea monsters of the Old Testament, Leviathan among them, “symbolized the powers of chaos” and are “personifications or symbols of death and hell,” and Jacob’s image has been read as a depiction of how Christ the Redeemer overcomes them (see the note on [[Isa. 51:9]]).

  The psalm itself stops before any of this. It ends asking the King to arise.

explore: |
  - **Another lament over the temple.** [[Ps. 79]] has what this psalm does not, a closing vow of praise ([[Ps. 79:13]]).
  - **Lamentations over fallen Jerusalem.** [[Lam. 2:1–9]], for the right hand drawn back, the place of assembly, and the prophets without vision.
  - **The song at the sea.** [[Ex. 15:1–18]], read beside verse 2.
  - **Leviathan elsewhere.** [[Ps. 89:9–10]], and [[Ps. 104:26]], where he is a creature of the sea, “that leviathan, whom thou hast made to play therein.” Scripture Central’s KnoWhy #866, “Why Does the Old Testament Talk about Leviathan?”, is a short account of the creation reading.
parallels:
  - ref: Ex. 15:16
    note: The song at the sea calls Israel the people “which thou hast purchased”; verse 2 asks God to remember the congregation He purchased of old.
  - ref: 2 Kgs. 25:9
    note: Nebuchadnezzar’s captain of the guard burns the house of the LORD.
  - ref: Lam. 2:9
    note: Over fallen Jerusalem, “her prophets also find no vision from the LORD”; compare verse 9.
  - ref: Isa. 51:9
    note: Isaiah calls on the arm of the LORD that “wounded the dragon” and dried the sea.
  - ref: Ps. 79:1
    note: Another psalm of Asaph over the defiled temple and Jerusalem laid “on heaps.”

