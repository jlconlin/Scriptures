chapter: 84
title: A Day in Thy Courts
tagline: A singer who loves the house of the LORD follows the pilgrims through a dry valley to Zion, prays for the Lord’s anointed, and would sooner stand at God’s threshold than live anywhere else.
when: 'Undated; a psalm for the sons of Korah by its title'

setting: |
  Psalm 84 belongs to the sons of Korah, and it opens the second group of psalms that carry their name (see the note on the title). It has been set among the “Songs of Zion,” psalms that “celebrate the location of the temple at Mount Zion, rejoice that the Lord’s presence is there, and express a longing to visit the temple.”

  That longing had a calendar behind it. The law commanded the men of the covenant people to appear before the Lord three times a year, at the feasts of Unleavened Bread, Weeks and Tabernacles. The Church’s edition refers the “appeareth before God” of verse 7 to that command, so the psalm’s road and its arrival “in Zion” are read here as such a journey (see the note on verse 7).

  No occasion is named. The psalm speaks of courts and altars, of Zion, and of “thine anointed,” and that is all it shows of its time. Nor does it say where the singer stands: verses 1–3 long for the courts, and verses 5–7 speak of the pilgrims as “they.” One older reading takes him for a Levite who is away with David during Absalom’s revolt and who prays for his king; the psalm itself names neither David nor an exile. The same reading calls this psalm the “counterpart” of Psalm 42, where another Korah psalm thirsts “for the living God” ([[Ps. 42:2]]).

thread: |
  Psalm 84 begins with a place and ends with a person. **Its first line loves a house, and its last line blesses the one who trusts the Lord of that house.**

  Three times it says “Blessed,” the exclamation of [[Ps. 1:1]], and each time of someone different. First come those who “dwell in thy house” and are always there to praise (verse 4). Then comes the man whose strength is in the Lord and who has the roads in his heart (verse 5); the next two verses put him on those roads. Last is “the man that trusteth in thee” (verse 12), and here no house, road or city is named.

  Between the second blessing and the third the psalm does three things. It follows the pilgrims through a dry valley that turns to springs, and they go “from strength to strength” until each one appears before God in Zion (verses 6–7). It prays, once, and the prayer is for the Lord’s anointed (verses 8–9). Then it gives its reasons, each beginning with “For”: one day in the courts outweighs a thousand, and the LORD God is a sun and shield who withholds no good thing (verses 10–11).

  One name runs through the whole. “LORD of hosts” stands in the first verse, the third and the last, and in a longer form at the prayer of verse 8. It is the name given to the King of glory at the gates in [[Ps. 24:10]], and here the singer sets “my King, and my God” beside it (verse 3).

sections:
  - range: 1-4
    heading: The dwelling, and those who live there
    plain: |
      How lovely Your dwelling place is, LORD of hosts! My soul longs, and even faints, for the courts of the LORD; my heart and my body shout for joy to the living God. Even the sparrow has found a home, and the swallow a nest for herself where she may lay her young, at Your altars, LORD of hosts, my King and my God. How happy are those who live in Your house; they are always praising You.
  - range: 5-7
    heading: The road to Zion
    plain: |
      How happy is the one whose strength is in You, who has the highways in his heart. Passing through the valley of Baca, they make it a place of springs, and the early rain covers it with pools. They go from strength to strength; each one appears before God in Zion.
  - range: 8-9
    heading: A prayer for the anointed
    plain: |
      LORD God of hosts, hear my prayer; listen, God of Jacob. Look, O God our shield, and look on the face of Your anointed.
  - range: 10-12
    heading: One day, and the reason
    plain: |
      For one day in Your courts is better than a thousand elsewhere. I would rather stand at the threshold of the house of my God than live in the tents of wickedness. For the LORD God is a sun and a shield; the LORD gives grace and glory, and He withholds no good thing from those who walk uprightly. LORD of hosts, how happy is the one who trusts in You.

notes:
  - ref: 0
    phrase: A Psalm for the sons of Korah
    kind: history
    title: The title’s terms, and the second group of Korah psalms
    body: |
      The sons of Korah were a family of temple musicians and doorkeepers, and this psalm opens the second group that carries their name. The title’s terms are explained where they first appear: “To the chief Musician” and Gittith at [[Ps. 8:1]], and the sons of Korah at [[Ps. 42:1]]. What this psalm needs from that note is the family’s work at the sanctuary. Korah’s descendants “formed a guild of musicians,” while others “held the responsible post of doorkeeper,” which bears on verse 10.

      Their name stands over Psalm 42 and Psalms 44–49, and then over Psalms 84–85 and 87–88.
    sources: [bd-korah]

  - ref: 1
    phrase: How amiable are thy tabernacles
    kind: words
    title: Amiable means beloved
    body: |
      “Amiable” here means lovely, and the Hebrew word behind it is “beloved.” In older English the word meant “deserving of affection” and was “applied usually to persons,” and an early American dictionary names this very verse as the exception.

      The Hebrew is like the English in that. The adjective is a word of the poets meaning “beloved,” and it is said of people: Moses calls Benjamin “the beloved of the LORD” ([[Deut. 33:12]]) with this word. In this verse it is rendered “how lovely are thy habitations.” The psalm opens, then, with a word of affection that is usually kept for a person and gives it to a place.

      “Tabernacles” is the plural of the Hebrew word for a dwelling, and this verse stands with those that use it of “God’s abode in Zion.” The same plural is discussed at [[Ps. 43:3]].
    sources: [webster-1828, bdb, oshb-wlc, lds-scriptures]

  - ref: 2
    phrase: crieth out for the living God
    kind: words
    title: A cry of joy, not of pain
    body: |
      The cry of this line is a shout of joy: the Hebrew verb means to “give a ringing cry, in joy, exultation, especially in praise.” A modern translation has “my heart and my flesh sing for joy,” and the ancient Greek translation has heart and flesh that “have exulted in the living god.”

      So the verse holds two things together. Its first half is homesickness. The verb for “longeth” is the one Laban uses of Jacob, who “sore longedst after thy father’s house” ([[Gen. 31:30]]), and the soul “fainteth” with it. Its second half is singing. The whole person is named in the two halves: soul, heart and flesh.

      “The living God” is the name the other great Korah psalm of longing uses: “My soul thirsteth for God, for the living God” ([[Ps. 42:2]]).
    sources: [bdb, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 3
    phrase: the sparrow hath found an house
    kind: symbol
    title: Birds at home by the altars
    body: |
      The nesting birds picture safety and being at home in God’s house, and they have been read as the singer’s picture of himself. On one view the swallow here “makes simile of quiet, peace, security.” One older reading goes further: “By the bird that has found a comfortable snug home on the place of the altars” the poet “means himself,” and the psalm says only indirectly that birds nested in the temple, “without giving any occasion for the discussion whether this has taken place in reality.”

      The verse ends by turning from the nest to the one whose altars they are, and the address grows as it goes: “O LORD of hosts, my King, and my God.”
    sources: [bdb, delitzsch-psalms]

  - ref: 5
    phrase: in whose heart are the ways of them
    kind: words
    title: Highways in the heart
    body: |
      The “ways” in the heart are highways, and the Hebrew does not say where they lead. It has only two words: highways, and in their heart. The noun means a “raised way, highway, public road,” and it has been taken in this verse “of the ascents to Zion in the mind of the pious.”

      A modern translation fills in the destination, “in whose heart are the highways to Zion,” and notes that the Hebrew lacks the last two words. The Greek translators paraphrased: “in his heart he has purposed to go up.”

      The second “Blessed,” then, is said of someone who is not in the house. What he has of it is the road there, and he has that in his heart.
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs]

  - ref: 6
    phrase: the valley of Baca
    kind: symbol
    title: A dry valley made a place of springs
    body: |
      Baca is most likely the name of a tree, and the valley called after it is a dry place that the pilgrims turn into a place of springs. The name has been rendered “balsam-vale,” and the same word in the plural is the trees of David’s battle, which the King James calls “the mulberry trees” ([[2 Sam. 5:23]]). The ancient Greek translation has “the valley of weeping.” One older commentary rejects that meaning and takes the tree for one that grows in arid valleys, so that it “might also have given its name to some arid valley of the Holy Land.” No place of the name is identified in the psalm.

      What happens there is told in two clauses. First the travelers act: they “make it a well,” or in a modern translation “a place of springs.” Then the sky answers. The rain is the early rain of autumn, “like that which refreshes the sown fields,” and the Hebrew text, with the vowels it has been handed down with, says that this rain “covereth with blessings.” The word for a pool is a separate noun with the same consonants; the King James and a modern translation read “pools,” while the Greek has “blessings.”

      One reading takes the two clauses as two agents. The pilgrims’ “faith” brings “water out of the sand and rock of the desert, but God also on His part lovingly anticipates their love.” It adds that Isaiah gives the same change to God alone, as in “I will make the wilderness a pool of water, and the dry land springs of water” ([[Isa. 41:18]]), while the psalm shows it “as the result of the power of faith” in people who are on their way to Him.
    sources: [bdb, lxx-rahlfs, delitzsch-psalms, nrsvue, oshb-wlc, lds-scriptures]

  - ref: 7
    phrase: appeareth before God
    kind: scripture
    title: The law’s word for coming to the feasts
    body: |
      To appear before God is the law’s own phrase for going up to the sanctuary at the feasts, so verse 7 is the arrival that the road of verses 5–6 was for. The law commanded that three times a year the men of the covenant people “were to appear before the Lord in the place that He should choose.” The verb of this verse is the verb of that command, in the same form ([[Deut. 16:16]]), and the Church’s edition refers “appeareth” to it. Here the verb is taken as to “present oneself” before God.

      The command was seldom kept in full. In Old Testament times it “was not and could not be generally or even frequently observed,” and a devout man such as Elkanah “went up to Shiloh once a year.”

      The Greek translation and a modern one read the line with God as the one who is seen: “the God of gods shall be seen in Sion.” Seeing God has been called “the preeminent image” in the Psalms “for the experience of God in the temple,” and this verse is among those listed for it. How appearing before God and seeing His face are related in the Hebrew is discussed at [[Ps. 42:2]].
    sources: [bd-feasts, oshb-wlc, bdb, lxx-rahlfs, nrsvue, skinner-seeing-god, lds-scriptures]

  - ref: 9
    phrase: O God our shield
    kind: words
    title: Is the shield God or the anointed?
    body: |
      The King James takes “our shield” as a name for God, and a modern translation takes it as a name for the anointed one of the same verse. In the Hebrew “our shield” is the first word of the verse and “thine anointed” the last, and the line can be divided either way. The King James has “Behold, O God our shield.” A modern translation has “Behold our shield, O God,” which makes the shield the person God is asked to look at, the same person as the anointed in the second half of the line.

      This verse has been listed among those where the shield is the LORD, “as defence of his servants,” and two verses later the psalm says so in plain words: “the LORD God is a sun and shield.”

      Who the anointed is, the psalm does not say. A modern translation refers the reader from this verse to [[Ps. 2:2]], where the word is explained and the anointed is the king the LORD sets on Zion. This verse has also been listed with those where the anointed is the “high priest of Israel.” Either way the psalm’s one petition is for him: verse 8 asks to be heard, and verse 9 is what is asked. The psalm does not say why a song about the road to the temple stops to pray for him.
    sources: [oshb-wlc, nrsvue, bdb]

  - ref: 10
    phrase: I had rather be a doorkeeper
    kind: words
    title: Standing at the threshold
    body: |
      “Be a doorkeeper” translates a single verb that means to “stand at, or guard, the threshold,” and the line is a choice between a doorway and a dwelling. Rendered closely, the clause is “I choose standing at the threshold in the house of my God.” Against the threshold the singer sets a settled life inside “the tents of wickedness”: he would take the edge of the one before a place within the other. The Greek translation has “I would rather be an abject in the house of God.”

      The title gives the psalm to a family that knew the post. Some of Korah’s descendants “held the responsible post of doorkeeper” at the temple, and Chronicles calls the Korahites “keepers of the gates of the tabernacle” ([[1 Chr. 9:19]]). The psalm does not say that its singer was one of them.
    sources: [bdb, oshb-wlc, lxx-rahlfs, bd-korah]

  - ref: 11
    phrase: a sun and shield
    kind: symbol
    title: God called a sun
    body: |
      This verse calls God a sun, and on one reading it is “the only instance in which God is directly called a sun” in scripture. The same reading explains the pair of images. He is a shield “as protecting those who flee to Him,” and a sun “as the Being who dwells in an unapproachable light,” a light that reaches people as “the grace and glory” of the next clause.

      The image suits a psalm about the temple. In the Psalms the experience of God in His house “is described as an experience of brilliant light or is expressed metaphorically by comparing God with the sun,” and this verse is the example given.

      Not every ancient reader had the image. The Greek translation has a different line in its place, “For the Lord loves mercy and truth,” and it has been proposed to read the word as a “pinnacle” or battlement, though most read “sun.”
    sources: [delitzsch-psalms, skinner-seeing-god, lxx-rahlfs, bdb]

christ: |
  The house this psalm loves is the house of “the LORD of hosts.” In the Old Testament “LORD” usually stands for the name Jehovah, and “Jehovah is the premortal Jesus Christ.” The singer’s “my King, and my God” (verse 3) is said to the LORD of hosts.

  The psalm also prays for “thine anointed” (verse 9). What that title became is told at [[Ps. 2:2]].

  The Church’s edition joins the “sun” of verse 11 to the words the risen Lord gave the Nephites from Malachi: “unto you that fear my name, shall the Son of Righteousness arise with healing in his wings” ([[3 Ne. 25:2]]). Malachi’s own text has “the Sun of righteousness” ([[Mal. 4:2]]).

explore: |
  - **The counterpart.** [[Ps. 42]] and [[Ps. 43]], the other Korah poem that cries for “the living God” and asks when it will appear before Him.
  - **The pilgrim arrives.** [[Ps. 122:1–4]], another of the Songs of Zion, sung with feet inside the gates.
  - **One thing desired.** [[Ps. 27:4]], to dwell in the house of the LORD all the days of a life.
  - **Who may come in.** [[Ps. 24:3–6]], where the temple in the Psalms is discussed.
  - **Springs and a highway in the desert.** [[Isa. 35:6–8]] and [[Isa. 41:17–20]].

parallels:
  - ref: Ps. 42:1–2
    note: Another Korah psalm thirsts for the living God and asks when it will appear before Him.
  - ref: Deut. 16:16
    note: The command to appear before the LORD three times a year, in the verb of verse 7.
  - ref: 1 Chr. 9:19
    note: The Korahites as keepers of the gates of the tabernacle; compare the doorkeeper of verse 10.
  - ref: Isa. 41:18
    note: The wilderness made a pool and the dry land springs of water.
  - ref: Mal. 4:2
    note: The Sun of righteousness rises with healing in his wings (also 3 Ne. 25:2); compare verse 11.
  - ref: Ps. 27:4
    note: One thing desired, to dwell in the house of the LORD.

