chapter: 72
title: Give the King Thy Judgments
tagline: A prayer that God will lend the king His own justice, and that the poor, the land, and at last every nation will be blessed by it.
when: 'By its title, “for Solomon”; the closing line counts it with the prayers of David'

setting: |
  Psalm 72 is the last psalm of Book Two of the Psalms, and it is a royal psalm, one of those about Israel’s king (see the note on [[Ps. 2:2]]). It is a prayer for a king: that God will give him His own justice, and that the poor, the land, and in the end all nations will be the better for it.

  The king in view is Solomon. The heading in the Church’s edition reads the psalm as David speaking of his son, “who is made a type of the Messiah.” The books of Kings tell the reign the psalm prays over. Solomon asked God for “an understanding heart to judge thy people” ([[1 Kgs. 3:9]]), ruled “from the river unto the land of the Philistines” ([[1 Kgs. 4:21]]), and received the queen of Sheba and her gold ([[1 Kgs. 10:1–10]]). The psalm asks for all of that and for more: a dominion to “the ends of the earth” and a name that lasts as long as the sun.

  Later scripture took up the larger hope. Zechariah repeats verse 8 of a king who comes to Jerusalem “lowly, and riding upon an ass” ([[Zech. 9:9]]), and Matthew quotes that prophecy of Jesus ([[Matt. 21:4–5]]).

  The prayer for the king ends at verse 17. Verses 18–19 are the blessing that closes Book Two, and verse 20 says that the prayers of David are ended (see the note there).

thread: |
  Psalm 72 makes **one request and then follows it outward**. The request is verse 1: give the king Your judgments. Everything after it, down to verse 17, is what the psalmist hopes will come of that gift.

  The hopes widen in three steps. First come the people, and among them the poor (verses 2–4). Then time: as long as the sun and moon endure (verses 5–7). Then space: from sea to sea, the people of the desert, the kings of the far west and the far south, and finally “all kings” and “all nations” (verses 8–11).

  At verse 12 the psalm turns back, and the turn is the word “For.” The nations are to serve him for this reason: “he shall deliver the needy when he crieth.” The widest hope in the psalm is made to rest on its smallest people. The poor who were the king’s first charge in verse 2 are the ground of his dominion in verse 12.

  Verses 15–17 gather the wishes into blessing: long life, grain on the hilltops, a name that all nations bless. Then the voice lifts from the king altogether, and the last blessing is for “the LORD God, the God of Israel, who only doeth wondrous things.” A psalm that began by asking God to give ends by blessing God as the only doer of wonders.

sections:
  - range: 1-4
    heading: Give the king thy judgments
    plain: |
      O God, give the king Your judgments, and Your righteousness to the king’s son. May he judge Your people rightly and Your poor with justice. May the mountains and the hills bear peace for the people, through righteousness. May he defend the poor of the people, save the children of the needy, and crush the oppressor.
  - range: 5-7
    heading: As long as the sun and moon
    plain: |
      May they fear You as long as the sun and moon last, through all generations. May he come down like rain on a mown field, like showers that water the earth. In his days may the righteous flourish, and peace abound until the moon is no more.
  - range: 8-11
    heading: From sea to sea
    plain: |
      May he rule from sea to sea, and from the River to the ends of the earth. May the people of the desert bow before him and his enemies lick the dust. May the kings of Tarshish and of the isles bring tribute, and the kings of Sheba and Seba bring gifts. May all kings bow down to him and all nations serve him.
  - range: 12-14
    heading: For he shall deliver the needy
    plain: |
      For he delivers the needy who cry out, the poor, and the one who has no helper. He has pity on the weak and the needy and saves their lives. He redeems them from oppression and violence, and their blood is precious in his sight.
  - range: 15-17
    heading: His name shall endure
    plain: |
      May he live, and may gold of Sheba be given him; may prayer be made for him always, and blessing all day long. May there be plenty of grain in the land, waving on the tops of the mountains like Lebanon, and may the people of the cities flourish like grass. May his name last for ever, as long as the sun. May all nations be blessed in him and call him blessed.
  - range: 18-20
    heading: Blessed be the LORD God
    plain: |
      Blessed be the LORD God, the God of Israel, who alone does wonders. Blessed be His glorious name for ever; may the whole earth be filled with His glory. Amen, and Amen. The prayers of David the son of Jesse are ended.

notes:
  - ref: 0
    phrase: for Solomon
    kind: words
    title: For Solomon, or of Solomon?
    body: |
      The Hebrew of the title can be read “for Solomon” or “of Solomon,” and the Church’s edition reads it as David’s prayer for his son. It is one letter, the preposition *le*, set before the name. The same letter stands before David’s name in the titles that ascribe psalms to him, as in the title of Psalm 3, so the title could also be read as naming Solomon the author. Here and at Psalm 127 the King James has “for Solomon,” the ancient Greek translation agrees, and a modern translation has “Of Solomon.”

      Read as “for,” it is a father’s prayer for his heir. The Church’s edition takes it so, in the heading “David speaks of Solomon,” and President Jeffrey R. Holland read verse 1 the same way: David is “the king” who appeals to God, and Solomon is “the king’s son.” The closing line counts the psalm with “the prayers of David” (verse 20).

      On either reading the psalm is a prayer for Solomon’s reign. What a title is worth as evidence is discussed under the title of Psalm 3 ([[Ps. 3:1]]).
    sources: [oshb-wlc, lds-scriptures, lxx-rahlfs, nrsvue, scripture-helps-ps-49]

  - ref: 1
    phrase: Give the king thy judgments
    kind: history
    title: A king who asks for God’s justice
    body: |
      The psalm’s one direct request is that God give the king His own judgments, and Kings tells of Solomon asking for the same thing. Everything in the first two verses belongs to God: “thy judgments,” “thy righteousness,” “thy people,” “thy poor.” The king is to judge a people who are not his, with a justice that is not his.

      When the Lord appeared to Solomon, Solomon asked, “Give therefore thy servant an understanding heart to judge thy people, that I may discern between good and bad: for who is able to judge this thy so great a people?” ([[1 Kgs. 3:9]]). After his judgment between the two mothers, all Israel “saw that the wisdom of God was in him, to do judgment” ([[1 Kgs. 3:28]]).

      The psalm does not mention that prayer. One older reading hears verses 1 and 2 as “the echo” of the Lord’s offer to Solomon and of Solomon’s answer. Both prayers call the people God’s.
    sources: [lds-scriptures, bd-solomon, cambridge-psalms]

  - ref: 2
    phrase: He shall judge
    kind: words
    title: '‘He shall,’ or ‘may he’?'
    body: |
      The psalm’s verbs can be read as wishes, and a modern translation renders them so: “May he judge your people with righteousness.” The King James has futures throughout, “He shall judge,” which makes the psalm sound like a prediction.

      The Hebrew gives the prayer good support. Verse 1 is a plain request, “Give,” and several of the verbs after it are in the jussive, the Hebrew verb form for a wish: “have dominion” in verse 8, “live” in verse 15, and the “be” that opens verses 16 and 17. The closing line also calls what comes before it “prayers” (verse 20).

      So the psalm is first a prayer. The King James’s futures still have something behind them. Solomon’s rule did not reach the ends of the earth (see the note on verse 8), and Zechariah says the words of verse 8 as a prediction of a king still to come: “his dominion shall be from sea even to sea, and from the river even to the ends of the earth” ([[Zech. 9:10]]).
    sources: [nrsvue, oshb-wlc, lds-scriptures]

  - ref: 3
    phrase: The mountains shall bring peace
    kind: symbol
    title: Peace as the land’s harvest
    body: |
      The mountains are pictured yielding peace as land yields a crop. A modern translation has “May the mountains yield prosperity for the people,” and the hills too, “in righteousness.” The Hebrew word is *shalom*, which the King James gives as “peace” here and in verse 7. The last words of the verse say how it comes: “by righteousness.”

      The picture of a fruitful land returns twice. In verse 6 the king comes down “like rain,” and in verse 16 grain stands “upon the top of the mountains.”

      Solomon’s name means “Peaceable,” and the promise of his birth plays on it: “his name shall be Solomon, and I will give peace and quietness unto Israel in his days” ([[1 Chr. 22:9]]). Verse 7 asks for “abundance of peace” in “his days.”
    sources: [nrsvue, oshb-wlc, bd-solomon, lds-scriptures]

  - ref: 5
    phrase: They shall fear thee
    kind: words
    title: '‘Thee’ is God, not the king'
    body: |
      The “thee” of this verse is God, the only one the psalm addresses. The psalm speaks to God in verse 1 and speaks of the king in the third person throughout. In the Hebrew as it stands, then, the hope is that people will fear God for as long as there is a sun.

      The ancient Greek translation read the line of the king’s own length of days: “he shall continue as long as the sun.” A modern translation does the same: “May he live while the sun endures.” The King James keeps the Hebrew. The king’s lasting name comes in verse 17 on either reading.
    sources: [oshb-wlc, lxx-rahlfs, nrsvue]

  - ref: 6
    phrase: like rain upon the mown grass
    kind: symbol
    title: Rain on a mown field
    body: |
      A good king is pictured as rain falling on a mown meadow. The Hebrew word behind “mown grass” means a “shearing” or “mowing,” and in this verse “land to be mown.” The same word is used of a sheep’s fleece, and the ancient Greek translation has “rain upon a fleece.” Verse 7 goes on to growth: “In his days shall the righteous flourish.”
    sources: [bdb, lxx-rahlfs]

  - ref: 8
    phrase: from sea to sea, and from the river unto the ends of the earth
    kind: scripture
    title: The promised borders, and past them
    body: |
      The verse starts from the borders God promised Israel and runs past them to the ends of the earth. At Sinai the Lord set the bounds “from the Red sea even unto the sea of the Philistines, and from the desert unto the river” ([[Ex. 23:31]]), and on one older reading the psalm’s words are “a poetical generalisation” of that promise and of the account of Solomon’s rule. The river is the Euphrates, which is “frequently called in scripture ‘the River’” and was “the boundary of the land promised to the seed of Abraham.” Which seas the psalm means it does not say, and the phrase may be general. Solomon held the promised extent. He “reigned over all kingdoms from the river unto the land of the Philistines, and unto the border of Egypt” ([[1 Kgs. 4:21]]).

      The psalm keeps the old starting points and drops the far limit. The rule it asks for runs from sea to sea, and from the river not to the desert or to Egypt but “unto the ends of the earth.”

      Zechariah has the line of a king still to come, and says what kind of king he is: “behold, thy King cometh unto thee: he is just, and having salvation; lowly, and riding upon an ass” ([[Zech. 9:9]]), and his dominion is the one this verse asks for ([[Zech. 9:10]]). Matthew quotes the first of those verses when Jesus enters Jerusalem ([[Matt. 21:4–5]]).
    sources: [lds-scriptures, bd-euphrates, cambridge-psalms]

  - ref: 10
    phrase: The kings of Tarshish and of the isles
    kind: history
    title: The far west and the far south
    body: |
      Tarshish lay far to the west of Israel and Sheba far to the south, and Kings has both names in its account of Solomon’s wealth. Tarshish was “probably Tartessus in Spain,” and Sheba’s descendants “gave their name to a portion of southern Arabia.”

      “Once in three years came the navy of Tharshish, bringing gold, and silver, ivory, and apes, and peacocks” ([[1 Kgs. 10:22]]), though the name there may mark the kind of ship, since it “came to be used to denote ships of the largest size, suitable for long voyages.” The queen of Sheba “gave the king an hundred and twenty talents of gold” ([[1 Kgs. 10:10]]). And “all the earth sought to Solomon, to hear his wisdom,” and “they brought every man his present” ([[1 Kgs. 10:24–25]]).

      The psalm asks for more than visitors with gifts: “all kings shall fall down before him” (verse 11). In Isaiah “all they from Sheba shall come: they shall bring gold and incense” ([[Isa. 60:6]]), and the note there sets the gifts of Matthew’s wise men beside this verse.
    sources: [bd-tarshish, bd-sheba, lds-scriptures]

  - ref: 12
    phrase: For he shall deliver the needy when he crieth
    kind: structure
    title: Why the kings bow
    body: |
      “For” gives the reason the nations are to serve this king: he rescues the poor. The psalm has just reached its widest point, “all kings” and “all nations” (verse 11), and it grounds that at once in the people it began with. The poor and needy are named in verses 2 and 4 and again in verses 12 and 13. One older reading states the logic in a sentence: “The elevation of the king to the dominion of the world is the reward of his condescension.”

      Solomon’s reign answered the prayer for a time. In his good years “Judah and Israel dwelt safely, every man under his vine and under his fig tree” ([[1 Kgs. 4:25]]). But “the end of his reign was not like the beginning and the middle of it,” and after his death the people said to his son Rehoboam, “Thy father made our yoke grievous” ([[1 Kgs. 12:4]]).

      So the prayer was larger than the king it was made for. The royal psalms, this one among them, “picture an ideal divine king priest judge never fully realized in any actual king of Israel.”
    sources: [delitzsch-psalms, lds-scriptures, ot-manual-psalms]

  - ref: 14
    phrase: He shall redeem their soul
    kind: words
    title: The kinsman’s verb
    body: |
      “Redeem” is the word for what a next of kin does for a relative in trouble, and here it is said of the king and the poor. The Hebrew verb, *ga’al*, means to “redeem, act as kinsman.” In the law a relative buys back a poor man’s land, or the man himself from bondage: “if any of his kin come to redeem it, then shall he redeem that which his brother sold” ([[Lev. 25:25]]).

      It is the verb behind Isaiah’s title for the Lord, “thy Redeemer” ([[Isa. 48:17]]); the note on [[Isa. 41:14]] explains the title. “Their soul” is their life.
    sources: [oshb-wlc, bdb, lds-scriptures, nrsvue]

  - ref: 15
    phrase: prayer also shall be made for him continually
    kind: words
    title: Prayer and blessing for the king
    body: |
      The prayer “for him” is prayer made for the king, which is what this psalm itself is. The King James leaves the verse’s pronouns open; a modern translation reads the king throughout: “May prayer be made for him continually” is followed by “blessings invoked for him all day long.”

      “Praised,” in the King James, is in Hebrew the verb “bless,” and that verb carries the psalm to its end. The people bless the king here. In verse 17 “men shall be blessed in him.” Then verses 18 and 19 each begin with the same word, now said of God: “Blessed be the LORD God,” “blessed be his glorious name.”
    sources: [nrsvue, oshb-wlc]

  - ref: 16
    phrase: an handful of corn
    kind: words
    title: A handful of corn, or plenty of grain?
    body: |
      The picture is probably of abundance, grain growing all the way up the hills, though the Hebrew word is uncertain. The word that the King James renders “handful” is of doubtful meaning, “if correct, probably abundance, plenty,” and a modern translation asks for “abundance of grain in the land” that will “wave on the tops of the mountains.” “Corn” is the King James’s word for grain.

      The hilltops are where verse 3 looked for peace, and here they carry a harvest. The end of the verse turns from fields to people, who are to “flourish like grass of the earth”: “may people blossom in the cities.”
    sources: [bdb, nrsvue]

  - ref: 17
    phrase: men shall be blessed in him
    kind: scripture
    title: The words of Abraham’s promise
    body: |
      The psalm’s last wish for the king is worded like the promise God made to Abraham. To Abraham the Lord said, “in thee shall all families of the earth be blessed” ([[Gen. 12:3]]), and after Abraham was commanded to offer Isaac, “in thy seed shall all the nations of the earth be blessed” ([[Gen. 22:18]]). The psalm says of the king, “men shall be blessed in him,” with the Hebrew verb of the second promise in the same form. The ancient Greek translation brings the wording closer still, with the words it has in the first promise: “all the tribes of the earth shall be blessed in him.”

      The psalm does not name Abraham. One older reading takes the line as “an allusion to the promises to Abraham and Isaac.” Of the promise in Genesis Paul says who the seed is: “He saith not, And to seeds, as of many; but as of one, And to thy seed, which is Christ” ([[Gal. 3:16]]).
    sources: [lds-scriptures, lxx-rahlfs, oshb-wlc, cambridge-psalms]

  - ref: 18
    phrase: Blessed be the LORD God, the God of Israel
    kind: structure
    title: The blessing that closes Book Two
    body: |
      Verses 18–19 close the second of the Psalter’s five books as well as this psalm. Each division ends with such a line, “a doxology, or formal declaration of God’s power and glory,” and the five endings are set side by side in the note on [[Ps. 150:6]].

      This is the only verse of Psalm 72 with the divine name, which the King James prints as “LORD.” After seventeen verses about a king, it says that the LORD “only doeth wondrous things.” The last wish, in verse 19, has words the Lord spoke in the wilderness: “all the earth shall be filled with the glory of the LORD” ([[Num. 14:21]]).
    sources: [ot-manual-psalms, oshb-wlc, lds-scriptures]

  - ref: 20
    phrase: The prayers of David the son of Jesse are ended
    kind: history
    title: The prayers of David are ended
    body: |
      The line closes “the prayers of David,” yet psalms headed with his name come after it. Psalm 86 is headed “A Prayer of David,” and Psalm 110, “A Psalm of David,” is still to come.

      President Jeffrey R. Holland taught that the text would seem to indicate that this “may be the last of David’s canonized psalms,” and that whether it is or not, it “could certainly serve well as a valedictory declaration regarding the Son of God who would one day come with the additional title of Son of David.”

      One older reading takes the line as the closing mark of “the primary collection,” older than the book as it now stands: “No one taking a survey of the whole Psalter, with the many Psalms of David that follow beyond Psalm 72, could possibly have placed this key-stone here.” On that reading it shows that the whole “was at least preceded by one smaller collection,” and the book of Job has a line of the same kind: “The words of Job are ended” ([[Job 31:40]]).
    sources: [lds-scriptures, delitzsch-psalms, scripture-helps-ps-49]

christ: |
  The Church’s edition calls Solomon in this psalm “a type of the Messiah,” and President Jeffrey R. Holland taught that the prayer for an earthly king moves him “into a type or prefiguration of Christ, the Heavenly King.” The psalm asks for a reign without limit in time or place. “Only the Messiah combines these roles in the endless, universal reign of peace and justice envisaged by the psalmists.”

  Jesus set Himself above Solomon. Speaking of the queen who “came from the uttermost parts of the earth to hear the wisdom of Solomon,” He said, “behold, a greater than Solomon is here” ([[Matt. 12:42]]). And the king to whom Zechariah gives the dominion of verse 8 is the one Matthew sees entering Jerusalem (see the note on verse 8).

explore: |
  - **The reign the psalm prays over.** [[1 Kgs. 3:5–28]], [[1 Kgs. 4:20–34]] and [[1 Kgs. 10:1–25]], read with verses 1–2, 8 and 10 open; then [[1 Kgs. 12:1–16]] beside verses 12–14.
  - **The king who judges the poor.** [[Isa. 11:1–9]], where the stem of Jesse judges the poor “with righteousness” and the earth is filled with the knowledge of the Lord.
  - **The dominion repeated.** [[Zech. 9:9–10]], with [[Matt. 21:1–11]].
  - **A throne as lasting as the sun.** [[Ps. 89:35–37]], the next book’s psalm of the covenant with David.
  - **The earth filled.** [[D&C 65:2]], where the gospel rolls forth “until it has filled the whole earth,” beside verse 19.
  - **The other royal psalms.** [[Ps. 2]], [[Ps. 45]] and [[Ps. 110]].

parallels:
  - ref: Zech. 9:10
    note: Zechariah repeats verse 8 of the king who comes lowly to Jerusalem.
  - ref: 1 Kgs. 3:9
    note: Solomon asks for an understanding heart to judge God’s people; on one older reading verses 1–2 echo it.
  - ref: 2 Sam. 23:3–4
    note: David’s last words picture the just ruler as morning light and grass after rain; the simile of verse 6 may have been suggested by them.
  - ref: Gen. 22:18
    note: The promise that all nations will be blessed in Abraham’s seed; verse 17 has been read as an allusion to it.
  - ref: Num. 14:21
    note: “All the earth shall be filled with the glory of the LORD,” the wish of verse 19.

