chapter: 6
title: How Long?
tagline: A sick and frightened man asks the LORD to turn back to him before he dies, weeps through the night, and then, with nothing reported in between, tells his enemies that he has been heard.
when: 'Undated; a psalm of David by its title'

setting: |
  The title ascribes the psalm to David and names no occasion. Its musical terms are taken up in the note on the title.

  The speaker is ill. He is weak, his bones shake, he lies awake weeping, and he fears that he may die. The psalm “is a prayer for healing of both body and spirit,” and the one praying “appears to be in declining health.” He has enemies as well (verses 7, 8 and 10), though the psalm never says who they are or what they have done. And he takes what he suffers as the LORD’s anger, without naming any sin.

  The psalm moves as many laments do, from trouble to plea to confidence; the form is set out at [[Ps. 22:1]]. Verse 5 has the book’s first mention of Sheol, the place of the dead, which is explained in the note on that verse.

  Its words come again in later scripture three times. Foretelling His death, the Savior spoke of His troubled soul in the language of verses 3–4 ([[John 12:27]]). The dismissal of verse 8 stands, in the same words, in two of His sayings ([[Luke 13:27]]; [[Matt. 7:23]]). And Nephi, closing his record, wrote of his own tears by night in words very near verse 6 ([[2 Ne. 33:3]]).

thread: |
  Seven verses plead and three are sure, and **nothing stands between verse 7 and verse 8 to say what changed.**

  The pleading is all address. The name of the LORD comes five times in the first four verses, each time with a request or a question: do not rebuke, have mercy, heal, how long, return. The sufferer’s bones are “vexed,” then his soul is “sore vexed,” and there the sentence gives out. “But thou, O LORD, how long?” has no verb in Hebrew, and a modern translation prints it with a dash. He gives two reasons for being heard, and neither is his own merit: the LORD’s mercy (verse 4), and that the dead give Him no thanks (verse 5). Then the prayer sinks into the night, with the soaked bed and the eye worn out by grief (verses 6–7).

  Verse 8 rounds on the enemies and orders them off, “for the LORD hath heard the voice of my weeping.” The name comes three times in two verses, and now the LORD is the subject: He has heard, He has heard, He will receive. The psalm reports no healing and no word spoken in answer. Many laments move this way, from the trial to the plea to confidence, and some speak of God’s help as though it had already come (see the note on verse 8).

  The last verse hands the sufferer’s words to his enemies. He was “sore vexed”; they are to be. He asked the LORD to “return”; they are to “return,” turned back in shame. Verse 3 asked “how long?” The psalm’s last word is “suddenly.”

sections:
  - range: 1-3
    heading: Not in anger
    plain: |
      LORD, do not rebuke me in Your anger, and do not discipline me in Your wrath. Be gracious to me, LORD, for I am weak. Heal me, LORD, for my bones shake with terror. My soul is terrified too. And You, LORD, how long?
  - range: 4-5
    heading: Two reasons to be heard
    plain: |
      Turn back, LORD, and rescue my life. Save me for the sake of Your steadfast love. For in death no one remembers You. In Sheol, who will give You thanks?
  - range: 6-7
    heading: The night
    plain: |
      I am worn out with groaning. All night long I flood my bed with tears and soak my couch. My eye wastes away with grief; it has grown old because of all my foes.
  - range: 8-10
    heading: The LORD has heard
    plain: |
      Away from me, all you who do evil, for the LORD has heard the sound of my weeping. The LORD has heard my plea; the LORD will accept my prayer. Let all my enemies be ashamed and terrified. Let them turn back, ashamed, in a moment.

notes:
  - ref: 0
    phrase: upon Sheminith
    kind: words
    title: Sheminith, the eighth
    body: |
      Sheminith is the Hebrew for “the eighth,” and it is a direction to the musicians whose meaning is not certain. The ancient Greek translators simply rendered it: the psalm is “for the eighth.” The word stands in the titles of Psalms 6 and 12 and in one other place, where musicians play “with harps on the Sheminith to excel” ([[1 Chr. 15:21]]). Titles of this kind are glossed “the octave” and “seem to imply that there was singing in parts.”

      One older reading goes further. Since Chronicles has harps played on it, the word “is not the name of an instrument,” and set beside Alamoth (“maidens,” [[Ps. 46:1]]) it would be “a designation of the bass.” That reading notes that both psalms headed with Sheminith are sorrowful ones, “to be played in the lower octave.”

      “To the chief Musician” and Neginoth, the stringed instruments, are explained under the title of Psalm 4 ([[Ps. 4:1]]).
    sources: [oshb-wlc, lxx-rahlfs, bd-psalms, delitzsch-psalms, lds-scriptures]
  - ref: 1
    phrase: rebuke me not in thine anger
    kind: scripture
    title: A plea against anger, with no sin confessed
    body: |
      The psalm opens by taking its suffering as the LORD’s rebuke, and yet it confesses no sin anywhere. Another psalm begins with almost the same sentence, “O LORD, rebuke me not in thy wrath: neither chasten me in thy hot displeasure” ([[Ps. 38:1]]), and goes on to say what this one does not: “neither is there any rest in my bones because of my sin” ([[Ps. 38:3]]).

      Christian tradition has nevertheless counted Psalm 6 “the first of the seven” penitential psalms (with 32, 38, 51, 102, 130 and 143). One older reading defends the count. The speaker “is a penitent,” whose sense of God’s wrath is “well-grounded,” and his request is exact: he “does not pray for the removal of the chastisement but of the chastisement in wrath.” Jeremiah prays the same distinction: “O LORD, correct me, but with judgment; not in thine anger, lest thou bring me to nothing” ([[Jer. 10:24]]).

      The psalm itself says less than that reading does. It names no fault and asks for no forgiveness. It asks for mercy, healing and rescue, and it reads as a sick man’s prayer to be made whole in body and in spirit.
    sources: [lds-scriptures, delitzsch-psalms, ot-minute-psalms-1-20]
  - ref: 2
    phrase: my bones are vexed
    kind: words
    title: Vexed means terrified
    body: |
      “Vexed” in this psalm is terror, not annoyance. The Hebrew verb is to “be disturbed, dismayed, terrified,” and it is used “especially at chastisements & judgments of” the LORD. A modern translation has bones that “are shaking with terror” and a soul “struck with terror.”

      The word runs through the psalm. Of the verb’s ten occurrences in the Psalms three are here: the bones (verse 2), then the soul, with “sore” added (verse 3), and at the end the enemies (verse 10).
    sources: [bdb, nrsvue, oshb-wlc]
  - ref: 3
    phrase: My soul is also sore vexed
    kind: christ
    title: The Savior’s troubled soul
    body: |
      Jesus took up these words as He foretold His death: “Now is my soul troubled; and what shall I say? Father, save me from this hour: but for this cause came I unto this hour” ([[John 12:27]]). In saying so “the Savior quoted from this psalm as he foretold his own imminent suffering and death.”

      The link is plainer in Greek than in English. In the ancient Greek translation of the psalm the soul is “troubled,” with the verb John uses, and the “save me” of verse 4 is the same two Greek words as in the Gospel.

      The psalmist asks to be saved because the dead give no thanks (verses 4–5). In John the words “save me from this hour” are followed at once by “but for this cause came I unto this hour,” and the prayer that comes next is “Father, glorify thy name” ([[John 12:28]]).
    sources: [lds-scriptures, ot-minute-psalms-1-20, lxx-rahlfs, greek-nt]
  - ref: 4
    phrase: for thy mercies’ sake
    kind: words
    title: Mercies is hesed
    body: |
      The ground of the plea is the LORD’s *hesed*, which the King James translates “mercies” here and a modern translation “steadfast love.” The sufferer offers no innocence and makes no vow. He asks to be saved because of what the LORD is like. The word is explained at [[Ps. 51:1]].
    sources: [oshb-wlc, nrsvue]
  - ref: 5
    phrase: in death there is no remembrance of thee
    kind: scripture
    title: What the Restoration adds
    body: |
      Latter-day revelation shows the righteous dead praising God, a picture this verse does not have. The verse itself can be heard in two ways. Its notion of death “may reflect the author’s limited understanding of the afterlife compared to the clearer picture we possess in the Restoration, or it may be expressing a concern similar to that of Amulek”: “after this day of life, which is given us to prepare for eternity, behold, if we do not improve our time while in this life, then cometh the night of darkness wherein there can be no labor performed” ([[Alma 34:33]]).

      The clearer picture is of a world of spirits. In President Joseph F. Smith’s vision of the Savior’s visit there, the righteous dead “rejoiced in their redemption, and bowed the knee and acknowledged the Son of God as their Redeemer and Deliverer from death and the chains of hell” ([[D&C 138:23]]), and “they sang praises unto his holy name” ([[D&C 138:24]]).

      None of that is in the psalm, and the psalm is heard first as it stands: a sick man who sees only silence past the grave, and asks to live.
    sources: [ot-minute-psalms-1-20, lds-scriptures]
  - ref: 5
    phrase: in the grave
    kind: words
    title: The grave is Sheol
    body: |
      “The grave” here is *sheol*, the Hebrew name for the place of the dead, and this is the first of its sixteen appearances in the Psalms. Sheol is “the Hebrew name for the abode of departed spirits (corresponding to the Greek Hades),” and the King James translates it “grave,” “pit,” or “hell” as the context suggests. The ancient Greek version has “Hades” in this verse, and a modern translation leaves the word as it is: “in Sheol who can give you praise?”

      Sheol is where all people go after death, “regardless of their moral character,” and it “was generally viewed as inescapable.” What the psalmist fears in it is what the verse says: no remembrance of God and no thanks. This is one of the passages where the righteous dread Sheol for the want of the “praise or presence of God there (as in temple).”

      So the argument of verses 4–5 is about praise. He asks for his life in order to go on giving thanks. Hezekiah, recovered from his sickness ([[Isa. 38:9]]), prays the same way: “For the grave cannot praise thee, death can not celebrate thee” ([[Isa. 38:18]]), and then, “The living, the living, he shall praise thee, as I do this day” ([[Isa. 38:19]]). Another psalm says more: “But God will redeem my soul from the power of the grave: for he shall receive me” ([[Ps. 49:15]]).
    sources: [oshb-wlc, bd-sheol, lxx-rahlfs, nrsvue, scripture-helps-ps-1, bdb, lds-scriptures]
  - ref: 6
    phrase: I water my couch with my tears
    kind: scripture
    title: Nephi’s pillow
    body: |
      Nephi writes of his own prayers in words very like these, and he “was apparently familiar with this psalm.” Closing his record he writes, “For I pray continually for them by day, and mine eyes water my pillow by night, because of them; and I cry unto my God in faith, and I know that he will hear my cry” ([[2 Ne. 33:3]]).

      The psalmist weeps over his own affliction. Nephi’s tears are “because of them,” his people.

      For the bed made “to swim” a modern translation has “every night I flood my bed with tears;” and then “I drench my couch with my weeping.”
    sources: [ot-minute-psalms-1-20, lds-scriptures, nrsvue]
  - ref: 8
    phrase: Depart from me, all ye workers of iniquity
    kind: scripture
    title: The same words in two sayings of the Savior
    body: |
      The words of this line stand twice in the Savior’s teaching, each time as a dismissal. In a parable in Luke the master of the house answers those shut outside, “I tell you, I know you not whence ye are; depart from me, all ye workers of iniquity” ([[Luke 13:27]]), which in the King James is the psalm’s clause word for word. At the end of the Sermon on the Mount He says it of Himself: “And then will I profess unto them, I never knew you: depart from me, ye that work iniquity” ([[Matt. 7:23]]).

      In Greek each Gospel has part of the Greek psalm’s wording. Luke has its opening words (“depart from me, all”), and Matthew its closing phrase (“ye that work iniquity”).

      Neither Gospel says that the psalm is being quoted; the shared wording is what can be seen. In the psalm a sick man says it to his enemies once he knows he has been heard. In Matthew the Savior says it “in that day” to those who call Him “Lord, Lord” ([[Matt. 7:22]]).
    sources: [lds-scriptures, lxx-rahlfs, greek-nt]
  - ref: 8
    phrase: the LORD hath heard the voice of my weeping
    kind: structure
    title: The turn at verse 8
    body: |
      The psalm turns here from pleading to certainty without saying what happened. Up to verse 7 every sentence asks or grieves. From this verse the LORD “hath heard” twice, in the Hebrew form for a completed act, and “will receive,” in the form for one not yet complete.

      No healing is reported and no answer is quoted. Many laments end this way. Those who pray them describe their trial, plead, and then “express their complete confidence that God will deliver them. Sometimes they speak of God’s help as if he has already saved them.”

      What the sufferer claims to know is small and exact. He does not say that he is well. He says that his weeping has been heard. The note on [[Ps. 22:21]] takes up another psalm’s turn.
    sources: [oshb-wlc, hopkin-psalms-sung]
  - ref: 10
    phrase: let them return and be ashamed suddenly
    kind: words
    title: His own words, given to his enemies
    body: |
      The last verse gives the enemies the sufferer’s own verbs. “Sore vexed” is the phrase of verse 3, the same Hebrew verb and adverb. “Return” is the verb of verse 4, where he asked the LORD to turn back toward him; here the enemies are to turn back from him. On one reading the echo is the point of the verse: “That which he seems to have to suffer, shall in reality be the lot of his enemies.”

      The Hebrew makes a sound of it. “Return” and “be ashamed” are *yashubu* and *yeboshu*, the same consonants in a different order, a “coincidence,” as the same reading says, “if not intentional.” The last word, “suddenly,” is “in a moment” in a modern translation.

      The King James prints the verse as a wish (“Let”). A modern translation prints it as a statement: “All my enemies shall be ashamed and struck with terror.” Either way what is looked for is shame and retreat, and it is left to the LORD. On the Psalms’ prayers against enemies, [[Ps. 5:10]].
    sources: [oshb-wlc, delitzsch-psalms, nrsvue]

christ: |
  The Savior quoted this psalm as He foretold His death. He said, “Now is my soul troubled” ([[John 12:27]]), in the language of verses 3–4, and went on to the hour He had come for (see the note on verse 3). The words of verse 8 are also the words with which He says He will dismiss the workers of iniquity ([[Matt. 7:23]]; compare [[Luke 13:27]]).

  The psalmist’s fear in verse 5 is that the dead give God no thanks. In the vision of the Savior’s visit to the world of spirits, the righteous dead praise Him as their Redeemer ([[D&C 138:23–24]]; see the notes on verse 5).

explore: |
  - **The same opening, with a confession.** [[Ps. 38]], which begins as this psalm does and names the sin.
  - **“How long?”** The question asked four times over in [[Ps. 13:1–2]].
  - **Hezekiah’s prayer.** [[Isa. 38:9–20]], a sick king’s thanksgiving that makes the argument of verse 5.

parallels:
  - ref: John 12:27
    note: The Savior speaks of His troubled soul and of the prayer “save me” in the words of verses 3–4.
  - ref: Luke 13:27
    note: The master of the house dismisses the workers of iniquity in the words of verse 8; Matt. 7:23 has the same at the end of the Sermon on the Mount.
  - ref: 2 Ne. 33:3
    note: Nephi’s eyes water his pillow by night for his people, the image of verse 6.
  - ref: Ps. 38:1
    note: Nearly the same opening sentence, in a psalm that confesses sin.
  - ref: Isa. 38:18–19
    note: Hezekiah’s prayer that the grave cannot praise the LORD, as in verse 5.

