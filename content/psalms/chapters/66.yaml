chapter: 66
title: Come and See, Come and Hear
tagline: The whole earth is called to praise the God who dried the sea and brought His people through the fire, and then one worshipper goes into His house to pay his vows and tell what God has done for his soul.
when: 'Undated; the title names no author and no occasion'

setting: |
  Psalm 66 is a song of thanksgiving, a kind of psalm that reflects “the gratitude of an individual or community after they have been delivered from a trial by God.” It has also been counted among the psalms of praise, which open with a call to praise the Lord and go on to tell His power and mercy, “often describing what he has done for Israel in the past.” This psalm does both. It calls all the earth to sing, tells of the sea and the river, and then gives thanks for a rescue of its own day.

  What that rescue was, the psalm does not say. Verses 10–12 give it only in images: silver in the refiner’s fire, a net, a load on the back, riders overhead, fire and water. The one who speaks at the end means to go into God’s house with burnt offerings (verses 13–15).

  The psalm never uses the name the King James prints as “LORD.” God is “God” throughout, and once “the Lord” (verse 18).

thread: |
  The psalm issues two invitations, and they divide it. “Come and see the works of God” (verse 5) points to what God did for a whole people. “Come and hear… what he hath done for my soul” (verse 16) is the testimony of one person. **The psalm moves from the widest circle to the smallest: all the earth, then Israel, then “I.”**

  It opens with the earth (verses 1–4). Every land is told to shout, sing, and say to God how awe-inspiring His works are. Then the first invitation gives the nations something to look at: the sea turned to dry land and the river crossed on foot (verses 5–7). That was long ago, and verse 7 goes on in the present: “He ruleth by his power for ever.”

  The second call to the peoples (verse 8) brings the story into the singers’ own time. They have been through a trial of their own, and the telling of it ends, “but thou broughtest us out” (verse 12).

  The turn comes at verse 13. “We” and “us” stop, and one voice says, “I will go into thy house.” He brings the offerings he vowed when he was in trouble (verses 13–15), and then issues the second invitation, addressed to “all ye that fear God.” What he has to tell is short. He cried to God, and God heard him. The psalm closes on a blessing: God has not turned away his prayer, “nor his mercy from me.”

sections:
  - range: 1-4
    heading: All the earth is called to sing
    plain: |
      Shout for joy to God, all the earth. Sing the glory of His name and make His praise glorious. Say to God, “How awe-inspiring Your works are! Your power is so great that Your enemies come cringing before You. All the earth will bow down to You and sing to You; they will sing to Your name.”
  - range: 5-7
    heading: Come and see what God did at the sea
    plain: |
      Come and see what God has done; what He does among humankind is awe-inspiring. He turned the sea into dry land, and they crossed the river on foot. There we rejoiced in Him. He rules by His might for ever, and His eyes keep watch on the nations. Let the rebellious not lift themselves up.
  - range: 8-12
    heading: Tried like silver, and brought out
    plain: |
      Bless our God, you peoples, and let the sound of His praise be heard. He has kept us alive and has not let our feet slip. For You, God, have tested us; You have refined us as silver is refined. You brought us into the net and laid a heavy load on our backs. You made men ride over our heads. We went through fire and through water, but You brought us out into a place of abundance.
  - range: 13-15
    heading: Vows paid in God’s house
    plain: |
      I will come into Your house with burnt offerings. I will pay You my vows, the ones my lips made and my mouth spoke when I was in trouble. I will offer You burnt offerings of fattened animals, with the smoke of rams; I will offer bulls and goats.
  - range: 16-20
    heading: Come and hear what God did for me
    plain: |
      Come and listen, all of you who fear God, and I will tell what He has done for me. I cried out to Him with my mouth, and His praise was on my tongue. If I had cherished wickedness in my heart, the Lord would not have listened. But God has listened; He has paid attention to the sound of my prayer. Blessed be God, who has not turned away my prayer or taken His mercy from me.

notes:
  - ref: 0
    phrase: A Song or Psalm
    kind: words
    title: A song, a psalm, and no author
    body: |
      The title gives two names for the piece and no name for its writer. The Hebrew sets two nouns side by side, the word for a song and the word for a psalm, with no “or” between them; a modern translation prints “A Song. A Psalm.” The psalms on either side carry both words too. Psalm 65 is “A Psalm and Song of David,” Psalm 67 “A Psalm or Song,” and Psalm 68 “A Psalm or Song of David.”

      Psalm 66 names neither David nor anyone else, so this chapter speaks only of the psalmist. “To the chief Musician” is explained at [[Ps. 8:1]], and what a title is worth as evidence at [[Ps. 3:1]].
    sources: [oshb-wlc, nrsvue, lds-scriptures]
  - ref: 1
    phrase: all ye lands
    kind: words
    title: All the earth, and all its peoples
    body: |
      The call to praise goes to the whole earth, not to Israel alone. “All ye lands” is the Hebrew for “all the earth,” the same two words that verse 4 translates “All the earth,” and a modern translation has “all the earth” in both verses.

      The second call, in verse 8, is addressed as widely. “Ye people” is a plural, “peoples”; the ancient Greek translation has “ye Gentiles,” and a modern translation “O peoples.” (The same hidden plural is discussed at [[Ps. 47:1]].) What the peoples are asked to do is “bless our God.” The God is Israel’s, and the praise is asked of everyone.
    sources: [oshb-wlc, nrsvue, lxx-rahlfs]
  - ref: 3
    phrase: submit themselves unto thee
    kind: words
    title: Enemies who come cringing
    body: |
      The verb translated “submit themselves” describes enemies who yield because they must, and it carries a hint that the yielding is put on. Said of beaten enemies it means to “come cringing” or “make shew of obedience.” A related form is explained as originally meaning to “act deceptively, feigning obedience.” The ancient Greek translation has “thine enemies shall lie to thee,” and a modern translation “your enemies cringe before you.”

      The King James has “the strangers shall submit themselves unto me” for this verb in [[Ps. 18:44]], and “thine enemies shall be found liars unto thee” for the related form in [[Deut. 33:29]].

      The verse gives the cause: it is “through the greatness of thy power.” Verse 4 then uses other verbs of “all the earth,” which shall worship and sing.

      “Terrible,” in this verse and in verse 5, means awe-inspiring; see [[Ps. 47:2]].
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue]
  - ref: 6
    phrase: there did we rejoice in him
    kind: history
    title: Two crossings, and who rejoiced there
    body: |
      Verse 6 remembers two crossings, the Red Sea and the Jordan, and in the King James the singers say “we” of those who rejoiced there. “The flood” is the Hebrew word for a river, and both the ancient Greek translation and a modern one have “the river.” Israel “went into the midst of the sea upon the dry ground” under Moses ([[Ex. 14:22]]), and “all the Israelites passed over on dry ground” through the Jordan under Joshua ([[Josh. 3:17]]).

      “They went through,” the psalm says, and then, “there did we rejoice in him.” One older reading explains the “we” in a sentence: “The church of all ages is a unity, the separate parts being jointly involved in the whole.”

      The verb “rejoice” has a form that ordinarily looks forward, and the Greek translators took it so: “there shall we rejoice in him.” The King James keeps the past, which the same older reading defends as sound Hebrew.

      On that reading verse 7 is why the old story is sung: “He ruleth by his power for ever,” and the power shown at the sea “is ever the same.”
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, delitzsch-psalms, lds-scriptures]
  - ref: 10
    phrase: thou hast tried us, as silver is tried
    kind: symbol
    title: Refined, with God as the refiner
    body: |
      The trial is pictured as the smelting of silver, and the psalm says plainly that God was the one who did it. “Tried” is a verb for working metal, to “smelt, refine, test,” and the ancient Greek translation writes the fire into the line: “thou hast tried us with fire as silver is tried.” (For what refining does to silver, see the note on [[Ps. 12:6]].)

      Every line of verses 10–12 but one has God for its subject: “thou, O God, hast proved us,” “thou broughtest us into the net,” “thou laidst affliction upon our loins,” “thou hast caused men to ride over our heads.” The men who rode over them are in the picture, but the psalm does not speak to them. It speaks to God about what He did, and the last verb of the series is His as well: “thou broughtest us out.”
    sources: [oshb-wlc, bdb, lxx-rahlfs]
  - ref: 12
    phrase: a wealthy place
    kind: words
    title: Brought out into abundance
    body: |
      “A wealthy place” translates a single Hebrew word that means saturation, the word behind “my cup runneth over” in [[Ps. 23:5]], where the cup is “well-filled.” In the Hebrew as it stands, the people who went through fire and water come out to fullness.

      The ancient versions and most modern interpreters read a slightly different word here, “to (a place of) relief.” Following it, the Greek has “thou broughtest us out into a place of refreshment,” and a modern translation “a spacious place.”
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue]
  - ref: 13
    phrase: I will go into thy house
    kind: structure
    title: The voice changes from we to I
    body: |
      From verse 13 to the end the voice is “I,” not “we,” and the psalm does not say who he is.

      One older reading holds that from here “the poet himself speaks,” but “as being a member of the community at large,” and that what obliges him to give thanks is “that which the whole congregation, and he together with it, has experienced.” On that reading the two halves tell one deliverance, first as the people’s and then as one worshipper’s. That is a reading. The psalm sets the two halves side by side and does not say how they are related.

      The move into the temple fits what a song of thanksgiving was for. Such gratitude “typically would have been demonstrated with a sacrifice at the temple, and accompanied by the singing of a hymn or psalm.”
    sources: [delitzsch-psalms, hopkin-psalms-sung]
  - ref: 15
    phrase: with the incense of rams
    kind: history
    title: Burnt offerings for vows made in trouble
    body: |
      The psalmist pays his vows with burnt offerings. Vows were often made to ask a favor of the Lord, and his lips uttered these “when I was in trouble” (verse 14). (On vows and the offerings that went with them, see [[Ps. 56:12]] and [[Ps. 50:14]].)

      In a burnt offering the whole animal was burned on the altar. There was no meal for the offerer afterward; only the peace offering had one. The animals for a burnt offering were bullocks, rams, or he-goats, and verse 15 has bullocks, rams and goats, with fatlings besides.

      “The incense of rams” is not incense in the usual sense. The word means “smoke, odour of (burning) sacrifice, incense,” and in this verse it is the “sweet smoke of sacrifice”; a modern translation has “the smoke of the sacrifice of rams.” The burnt offering “got its Hebrew name from the idea of the smoke of the sacrifice ascending to heaven.”
    sources: [bd-vows, bd-sacrifices, bdb, nrsvue]
  - ref: 18
    phrase: If I regard iniquity in my heart
    kind: words
    title: What it is to regard iniquity in the heart
    body: |
      To “regard” iniquity here is perhaps to look on it with approval; the word has also been taken as to intend it. The Hebrew verb is the ordinary word for seeing, and it can mean to “look at with favour.” A modern translation has “If I had cherished iniquity in my heart,” and one older reading “If I had aimed at evil in my heart.” On that reading the verse is about a prayer whose words go one way and whose heart goes another: “For a hypocritical prayer, coming from a heart which has not its aim sincerely directed towards Him, He does not hear.”

      The verse is the first step of an argument that verse 19 completes. Had he cherished iniquity, the Lord would not have heard; “but verily God hath heard me.” He reasons from the answer back to the prayer, and the charge of a divided heart is, on the same reading, “refuted… from the result.”

      The ancient Greek translation makes the line a wish against himself: “If I have regarded iniquity in my heart, let not the Lord hearken to me.”

      The psalm’s last verse names what he was given along with the answer. God has not turned away “his mercy,” and the word is *hesed*, explained at [[Ps. 51:1]].
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs, delitzsch-psalms]

christ: |
  The psalm praises the God who turned the sea into dry land (verse 6). Paul says who was with Israel at that crossing: “all our fathers were under the cloud, and all passed through the sea” ([[1 Cor. 10:1]]), and they “drank of that spiritual Rock that followed them: and that Rock was Christ” ([[1 Cor. 10:4]]). In those verses Paul taught that Christ was the Jehovah of the Old Testament.

explore: |
  - **Through fire and water.** [[Isa. 43:1–3]], with the note on [[Isa. 43:2]].
  - **Vows paid in the Lord’s house.** [[Ps. 116:12–19]], another song of thanksgiving.

