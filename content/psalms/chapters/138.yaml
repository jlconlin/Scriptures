chapter: 138
title: Though the LORD Be High
tagline: A man gives thanks for an answered prayer in the hearing of the great, expects every king on earth to join him, and ends, still in trouble, sure that the LORD will finish what He has begun.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  The title gives David’s name and no occasion, and the psalm names no event; its enemies (verse 7) are not named either. It is the first of eight psalms in a row that carry his name in their titles, from here to [[Ps. 145]].

  It stands beside a psalm of a very different kind. In Psalm 137 the captives in Babylon ask, “How shall we sing the LORD’s song in a strange land?” ([[Ps. 137:4]]). Here the song is sung “before the gods,” and verse 4 expects foreign kings to take it up. One older reading sets the two psalms side by side: the praise that “was obliged to be dumb in the presence of the heathen” will be “sung by the kings of the heathen themselves.”

  The psalm is a thanksgiving, the song of someone who cried out and was answered (verse 3). “I will praise thee” is “I give you thanks” in a modern translation, and Psalm 138 is counted among the “songs of thanksgiving.” The kind is described at [[Ps. 30]].

  One older reading hears in the psalm David’s answer to the promise the LORD made him through Nathan; see the note on [[Ps. 138:2]].

thread: |
  Psalm 138 is **one man’s thanks, widened to every king on earth, and then brought back to a man who is still in trouble**.

  Verses 1–3 are personal. He will give thanks with his whole heart, in front of “the gods,” facing the temple, and verse 3 says why: “In the day when I cried thou answeredst me.” What the answer was is worth noticing. He does not say that the trouble ended. He says that he was “strengthenedst … with strength in my soul.”

  At verse 4 the view widens. What happened to one man will be heard by “all the kings of the earth,” and they will sing too. Verse 6 gives the reason for their song: the LORD is high, and He looks at the lowly.

  Verse 7 returns to the singer, and the tense has changed. The answered prayer is behind him, but “Though I walk in the midst of trouble” is where he is now. The answer of verse 3 is the ground for what he expects: “thou wilt revive me.” Then comes the confidence of verse 8, that the LORD will bring his matter to its end, resting on a mercy that “endureth for ever.”

  The last line is the psalm’s only request. After seven verses of thanks he asks one thing: “forsake not the works of thine own hands.”

sections:
  - range: 1-3
    heading: Thanks with a whole heart
    plain: |
      I will give You thanks with my whole heart; before the gods I will sing Your praise. I will bow down toward Your holy temple and thank Your name for Your lovingkindness and Your truth, for You have made Your word great above all Your name. On the day I called, You answered me and put strength in my soul.
  - range: 4-6
    heading: All the kings of the earth
    plain: |
      All the kings of the earth will give You thanks, LORD, when they hear the words of Your mouth. They will sing of the ways of the LORD, for the glory of the LORD is great. High as the LORD is, He looks on the lowly, and the proud He knows from far off.
  - range: 7-8
    heading: In the midst of trouble
    plain: |
      Though I walk in the middle of trouble, You will keep me alive. You will stretch out Your hand against the rage of my enemies, and Your right hand will save me. The LORD will finish what He has begun for me. Your mercy, LORD, lasts for ever. Do not let go of what Your own hands have made.

notes:
  - ref: 1
    phrase: before the gods
    kind: words
    title: Who the gods are
    body: |
      The psalm does not say who the “gods” are, and the verse has long been read in more than one way. The Hebrew word is *elohim*, the ordinary word for God, which is also used of other beings; its range is explained at [[Ps. 8:5]].

      The ancient Greek translation took them to be heavenly: “I will sing psalms to thee before the angels.” The standard Hebrew lexicon puts this verse with those in which the word means “rulers, judges,” people “reflecting divine majesty and power,” and records that other interpreters have read “angels” or “gods” here. A modern translation leaves the line as the King James has it: “before the gods I sing your praise.”

      If they are heavenly beings, the singer stands where Psalm 82 opens, in the council of God ([[Ps. 82:1]]). If they are rulers, verse 1 looks ahead to verse 4, where “all the kings of the earth” join the song.

      On any of these readings the “gods” are an audience and nothing more. The praise is sung in front of them, and it is sung “unto thee.”
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, lds-scriptures]

  - ref: 2
    phrase: I will worship toward thy holy temple
    kind: history
    title: Worship toward the temple
    body: |
      To worship “toward” the temple is to turn to the place where the LORD’s name is, and the worshipper need not be inside it. Solomon’s prayer at the dedication speaks the same way. He asks the LORD to watch over “the place of which thou hast said, My name shall be there” ([[1 Kgs. 8:29]]) and to hear His people “when they shall pray toward this place” ([[1 Kgs. 8:30]]). Daniel did so far from the city, “his windows being open in his chamber toward Jerusalem” ([[Dan. 6:10]]).

      In this verse the two things stand together as they do in Solomon’s prayer: the singer bows toward the temple and gives thanks to “thy name.”

      The clause is word for word the one in [[Ps. 5:7]], and the note there takes up what a reader of a psalm of David will ask, how he could speak of a temple before Solomon built one.
    sources: [lds-scriptures]

  - ref: 2
    phrase: thou hast magnified thy word above all thy name
    kind: scripture
    title: A word greater than all His name
    body: |
      As the Hebrew stands, the line says that the LORD has made His word greater than His whole name, and translators have found it hard. The ancient Greek has no “word” in it at all: “thou hast magnified thy holy name above every thing.” A modern translation has the LORD exalting “your name and your word” above everything and tells the reader in a footnote that this is a correction, the Hebrew being “you have exalted your word above all your name.” The King James follows the Hebrew.

      One older reading keeps the Hebrew and takes “word” as a promise: the LORD “has given a promise which infinitely surpasses everything by which He has hitherto established a name and memorial for Himself.” The promise it has in mind is the one given to David through Nathan: “thine house and thy kingdom shall be established for ever before thee” ([[2 Sam. 7:16]]).

      That reading compares David’s prayer after the promise: “For thy word’s sake, and according to thine own heart, hast thou done all these great things” ([[2 Sam. 7:21]]). The same prayer asks that “thy name be magnified for ever” ([[2 Sam. 7:26]]). Read so, the “name” is the renown of what the LORD had already done, and the “word” is what He has now promised, which goes beyond it.

      This is a reading, since the psalm names no occasion. The two things he gives thanks for in the same verse, “lovingkindness” and “truth,” are on the same reading the LORD’s love and His faithfulness; the first word is explained at [[Ps. 51:1]].
    sources: [lxx-rahlfs, nrsvue, delitzsch-psalms, lds-scriptures]

  - ref: 6
    phrase: yet hath he respect unto the lowly
    kind: words
    title: The high LORD and the lowly
    body: |
      Verse 6 gives the reason for the kings’ song in verse 5: the LORD’s height does not keep Him from seeing those who are low. A modern translation begins the verse with “For,” which ties it to the line before, where they sing “for great is the glory of the LORD.”

      The second half of the verse is the other side. “The proud he knoweth afar off” is “the haughty he perceives from far away” in a modern translation: distance hides nothing from Him. The lowly are regarded and the proud are known.
    sources: [nrsvue]

  - ref: 8
    phrase: The LORD will perfect that which concerneth me
    kind: scripture
    title: What the LORD will finish
    body: |
      “Perfect” here means to finish, and the Hebrew does not say what is finished. The verb is the one behind “performeth” in [[Ps. 57:2]], where it is explained: to “bring to an end, complete.” After it the Hebrew has only “for me.” The King James fills the gap with “that which concerneth me,” and a modern translation with “The LORD will fulfill his purpose for me.”

      Joseph Smith’s revision gives the verb an object, and it is the singer himself: “The Lord will perfect me in knowledge, concerning his kingdom.” What the LORD completes, in that reading, is a person.

      The revision also changes the end of the verse. In the King James the psalm closes on a request, “forsake not the works of thine own hands.” The revision makes it a statement that the LORD is merciful and will not forsake them, so that the psalm is changed “from a plea for God to remember his children to a doxology,” a song of praise to its last word. When and how the Prophet revised the Psalms is told at [[Ps. 11:1]].
    sources: [oshb-wlc, bdb, nrsvue, mcconkie-poetic-writings, lefevre-jst-psalms]

christ: |
  The LORD who is high and yet looks on the lowly is Jehovah, and Jehovah is the Savior before His birth (see [[Ps. 110:1]]).

  The confidence of verse 8, that the LORD will carry through what He has begun for His servant, has been read beside Paul’s, who names the day on which the work is finished: “he which hath begun a good work in you will perform it until the day of Jesus Christ” ([[Philip. 1:6]]).

explore: |
  - **David’s prayer after the promise.** [[2 Sam. 7:18–29]], where “word,” “name,” “magnified” and “for ever” all stand together.
  - **The same verb.** [[Ps. 57:2]], “God that performeth all things for me.”
  - **The high One and the low.** [[Ps. 113:5–7]].
  - **Praying toward the house.** [[1 Kgs. 8:22–53]], Solomon’s prayer at the dedication of the temple.
  - **The next psalm.** [[Ps. 139]], where the LORD again knows from “afar off”: “thou understandest my thought afar off” ([[Ps. 139:2]]).

parallels:
  - ref: 2 Sam. 7:25–26
    note: David asks that the LORD’s word to him be established and His name magnified for ever.
  - ref: Ps. 5:7
    note: The same clause, “worship toward thy holy temple.”
  - ref: 1 Kgs. 8:29–30
    note: Solomon asks the LORD to hear prayer made “toward this place,” where His name is.
  - ref: Ps. 113:5–6
    note: The LORD dwells on high and humbles Himself to behold what is in heaven and on earth.
  - ref: Ps. 57:2
    note: The verb of verse 8, with God as the one who completes.
  - ref: D&C 124:3
    note: The Lord commands a proclamation “to all the kings of the world.”
  - ref: Philip. 1:6
    note: He who has begun a good work will perform it.

