chapter: 133
title: How Good and How Pleasant
tagline: A pilgrim song says in three verses what it is like when brethren dwell together as one, with holy oil running down the high priest and the dew of a far mountain falling on Zion, and then says why.
when: 'By its title, David’s; no occasion is given'

setting: |
  Psalm 133 is the next to last of the fifteen songs of degrees, the pilgrim songs (see [[Ps. 120:1]]). Its title names David and gives no occasion, and the psalm itself names no king, no enemy and no event.

  Its neighbours help to place it. The psalm before it says that “the LORD hath chosen Zion” ([[Ps. 132:13]]), and the psalm after it ends the fifteen with a blessing “out of Zion” ([[Ps. 134:3]]). Between them this psalm sets brethren dwelling together and, in its last line, a blessing commanded on Zion.

  Joseph Smith quoted all three verses to the Saints in Nauvoo, in a letter quoted in the note on [[Ps. 133:1]].

thread: |
  Psalm 133 is **one exclamation and two pictures of it, and both pictures move downward**. Verse 1 asks for nothing and commands nothing. It points, “Behold,” and says that brethren dwelling together in unity is good and pleasant.

  The pictures follow at once, “It is like” and “As.” Oil is poured on a head, runs onto the beard, and goes on down the garment. Dew that belongs to Hermon comes down on the mountains of Zion. The King James uses three verbs for this coming down; the Hebrew uses one (see the note on [[Ps. 133:2]]). One older reading says of the love the psalm praises that it is “born from above.”

  The turn is the word “for” in the last line. Until then the psalm has spoken of what is good for brethren; now it gives the reason, and the reason is the LORD: “for there the LORD commanded the blessing.” A psalm that opened on what is pleasant closes on what He gives: “life for evermore.”

sections:
  - range: 1
    heading: How good and how pleasant
    plain: |
      Look how good it is, and how pleasant, when brethren live together as one.
  - range: 2
    heading: Like the oil on Aaron’s head
    plain: |
      It is like the precious oil poured on the head, running down onto the beard, Aaron’s beard, and running down to the edge of his robes.
  - range: 3
    heading: Like the dew of Hermon on Zion
    plain: |
      It is like the dew of Hermon coming down on the mountains of Zion. For there the LORD commanded the blessing: life for evermore.

notes:
  - ref: 1
    phrase: Behold, how good and how pleasant it is
    kind: prophets
    title: Joseph Smith quotes the whole psalm to the Saints
    body: |
      Joseph Smith quoted this psalm entire in a letter to the Saints from Nauvoo, dated 1 November 1843, and added a sentence of three words to it. “Now, let me say once for all, like the Psalmist of old, ‘How good and how pleasant it is for brethren to dwell together in unity.’” He went on through the oil and the dew, saying of both that this “is such unity,” gave the psalm’s last line, and then closed in his own words: “Unity is power.”

      He had used the first verse three years before. In December 1840 he wrote to the Twelve and other leaders serving in Great Britain that “unity is strength,” gave the verse in words a little different from the King James, and continued: “Let the Saints of the Most High ever cultivate this principle, and the most glorious blessings must result, not only to them individually, but to the whole Church.”
    sources: [tpjs-2007-ch-23]

  - ref: 1
    phrase: for brethren to dwell together in unity
    kind: history
    title: Who the brethren are
    body: |
      The psalm does not say who the brethren are, and its heading is the best clue. It stands among the songs sung by pilgrims going up to Jerusalem, the city “whither the tribes go up” ([[Ps. 122:4]]). On one older reading that is the scene: the “blessed joy which Israel has enjoyed during the three great Feasts, although only for a brief period,” when people from every part of the land were in one city.

      On that reading “dwell together” is meant literally. The brethren are already brethren, “united by blood and heart,” and for some days they are also in one place. The verse then praises a people gathered to worship.
    sources: [delitzsch-psalms, bd-degrees-songs-of, lds-scriptures]

  - ref: 2
    phrase: the precious ointment upon the head
    kind: symbol
    title: The oil that consecrated Aaron
    body: |
      The oil of the first picture is the holy anointing oil of the tabernacle, and the scene is the consecration of Israel’s high priest. The LORD gave Moses its making, “an oil of holy ointment, an ointment compound after the art of the apothecary” ([[Ex. 30:25]]), olive oil mixed with spices. He also fenced it: “Upon man’s flesh shall it not be poured, neither shall ye make any other like it” ([[Ex. 30:32]]). It was kept for certain ceremonies and for no common use.

      One of those ceremonies is the one the psalm remembers. When Aaron was set apart, Moses “poured of the anointing oil upon Aaron’s head, and anointed him, to sanctify him” ([[Lev. 8:12]]).

      So the thing brethren’s unity is likened to was holy: made by the LORD’s direction, forbidden to ordinary life, and poured out to sanctify a man for the sanctuary.
    sources: [lds-scriptures, bd-anoint]

  - ref: 2
    phrase: that went down to the skirts of his garments
    kind: words
    title: Collar or hem, and one verb three times
    body: |
      How far down the oil runs is uncertain, and the word for its running is the same word the psalm uses of the dew. The Hebrew says the oil comes down on the “mouth” of his garments. The same word names the opening of the high priest’s robe, the “hole in the top of it” ([[Ex. 28:32]]), and this verse probably belongs with that use; a modern translation has “running down over the collar of his robes.” The King James has “skirts.” Either way the oil goes down.

      “Ran down” and “went down” in this verse and “descended” in verse 3 are one Hebrew verb, used of the oil twice and of the dew once. The King James varied its English; the psalm repeats itself, so that what happens on Aaron’s head and what happens on Zion’s mountains are told in the same word.
    sources: [bdb, biblehub-interlinear, nrsvue, lds-scriptures]

  - ref: 3
    phrase: As the dew of Hermon
    kind: symbol
    title: Dew from the far north on Zion
    body: |
      The second picture brings the dew of a mountain at the land’s northern end down on the hills of Jerusalem. Hermon stands 9,400 feet high “in the extreme northeast of the Holy Land.” The King James makes two dews of the line, “and as the dew that descended.” A modern translation has one, “the dew of Hermon,” and it is that dew “which falls on the mountains of Zion.” Joseph Smith quoted it the same way, “as the dew of Hermon that descended upon the mountains of Zion.”

      Dew was “of great importance in Palestine owing to the want of rain during a large portion of the year,” so that scripture speaks of it “as a source of fertility,” and in poetry it stands for “any beneficial effect produced by quiet means.”

      How Hermon’s dew can fall on Zion the psalm does not explain. One older reading answers in two ways. As a fact of weather, a heavy dew “might very well be diverted to Jerusalem” by cold air “sweeping down from the north over Hermon.” As a figure, it is what happens at the feasts, “when brethren out of the north unite with brethren in the south in Jerusalem.”
    sources: [bd-hermon, bd-dew, nrsvue, tpjs-2007-ch-23, delitzsch-psalms]

  - ref: 3
    phrase: for there the LORD commanded the blessing
    kind: scripture
    title: A blessing commanded, and the blessing is life
    body: |
      The last line gives a reason, and the reason is a place and an act of the LORD. “There” is Zion, named in the line before.

      A blessing that is “commanded” is the language of the law of Moses. To an obedient Israel Moses promised, “The LORD shall command the blessing upon thee in thy storehouses” ([[Deut. 28:8]]), and of the year before the land’s sabbath the LORD said, “I will command my blessing upon you in the sixth year” ([[Lev. 25:21]]). In both places the blessing is a harvest. Here the psalm names it in its closing words: “even life for evermore.”

      For the other songs of degrees that speak of blessing from Zion, see the note at [[Ps. 128:5]].
    sources: [lds-scriptures]

christ: |
  The LORD who commanded the blessing on Zion is Jehovah, who is the Savior before His birth (see [[Ps. 110:1]]). The oneness that verse 1 calls good and pleasant is what He prays for and commands. In His prayer for His disciples He asks “that they all may be one; as thou, Father, art in me, and I in thee” ([[John 17:21]]), and in the same prayer He speaks of His power to “give eternal life to as many as thou hast given him” ([[John 17:2]]). In a revelation to the Church He says it as a command: “be one; and if ye are not one ye are not mine” ([[D&C 38:27]]).

  The psalm’s first picture is the anointing of Israel’s high priest. The New Testament gives both the anointing and the office to Jesus. His titles Christ and Messiah both mean “anointed”; Peter says that “God anointed Jesus of Nazareth with the Holy Ghost and with power” ([[Acts 10:38]]); and Hebrews, speaking of Aaron’s calling, says “so also Christ glorified not himself to be made an high priest” ([[Heb. 5:5]]).

explore: |
  - **Aaron’s anointing.** [[Ex. 30:22–33]] for the oil and [[Lev. 8:1–12]] for the day it was poured.
  - **The psalms on either side.** [[Ps. 132]], where the LORD chooses Zion, and [[Ps. 134]], where the blessing goes out from it.
  - **A people named for being one.** [[Moses 7:18]]: “the Lord called his people Zion, because they were of one heart and one mind.”
  - **The Savior’s prayer.** [[John 17:20–23]].
  - **Joseph Smith on unity.** Chapter 23 of *Teachings of Presidents of the Church: Joseph Smith* takes its title from verse 1 and gathers what he said on the subject.

parallels:
  - ref: Lev. 8:12
    note: Moses pours the anointing oil on Aaron’s head, the scene of verse 2.
  - ref: Ex. 30:25
    note: The holy anointing oil, compounded by the LORD’s direction.
  - ref: Deut. 28:8
    note: The LORD will “command the blessing” on an obedient Israel, the phrase of verse 3.
  - ref: Ps. 132:13–17
    note: The LORD chooses Zion and says what He will do “there.”
  - ref: Ps. 134:3
    note: The last song of degrees ends with blessing “out of Zion.”
  - ref: John 17:21
    note: The Savior prays that those who believe on Him “all may be one.”
  - ref: Moses 7:18
    note: The Lord calls His people Zion because they are of one heart and one mind.

