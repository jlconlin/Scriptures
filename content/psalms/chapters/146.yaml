chapter: 146
title: Put Not Your Trust in Princes
tagline: One singer vows a lifetime of praise, warns against leaning on rulers who die and take their plans with them, and names the helper who made everything, keeps His word, and reigns for ever.
when: 'Undated; the psalm has no title and names no occasion'

setting: |
  Psalm 146 has no title. Psalm 145 is the last psalm that carries one, and from here to the end of the book there is no author’s name and no occasion.

  It is the first of the five psalms that close the Psalter, and all five open and close with “Praise ye the LORD” (in Hebrew, *hallelujah*; see the note on [[Ps. 150:1]]). Psalm 145 ends with a promise, “My mouth shall speak the praise of the LORD” ([[Ps. 145:21]]), and this one opens with that praise.

  It also shares that psalm’s lines. There the LORD “raiseth up all those that be bowed down” ([[Ps. 145:14]]) and gives all creatures “their meat in due season” ([[Ps. 145:15]]), and His “kingdom is an everlasting kingdom” ([[Ps. 145:13]]). Here He raises the bowed down, feeds the hungry, and reigns for ever.

  Two later passages stand close to it. Near the end of his own psalm Nephi gives the same warning: “I will not put my trust in the arm of flesh” ([[2 Ne. 4:34]]). And when John the Baptist sent from prison to ask who Jesus was, the Savior answered with a list of works that begins where verse 8 begins: “The blind receive their sight” ([[Matt. 11:5]]).

thread: |
  Psalm 146 is **a choice between two helpers, settled by which one lasts**. It opens with a call to praise. The call goes out to everyone and then, in the same verse, to the singer’s own soul. He answers for himself in verse 2: he will praise as long as he lives.

  Then, before any praise is sung, comes a warning. Do not trust princes. The reason is not that princes are wicked. It is that they are mortal: a prince’s breath goes out, he goes back to the ground, and “in that very day his thoughts perish.” Whatever he meant to do for you dies with him.

  The psalm turns at verse 5 with the word “Happy.” Against the prince stands “the God of Jacob,” and the rest of the psalm says why He can be relied on. He made heaven, earth and sea, so He is able. He “keepeth truth for ever,” so He keeps His word. And He is at work now, for the oppressed, the hungry, the prisoners, the blind, the bowed down, the strangers, the fatherless and the widow.

  The last verse gives the helper a title the psalm has been holding back. The psalm began by refusing princes; it ends with a king: “The LORD shall reign for ever.” The prince’s help lasts until “that very day.” This reign runs “unto all generations.”

sections:
  - range: 1-2
    heading: While I live
    plain: |
      Praise the LORD, all of you. Praise the LORD, my soul. I will praise the LORD as long as I live; I will sing praises to my God as long as I am.
  - range: 3-4
    heading: Princes die, and their plans with them
    plain: |
      Do not put your trust in princes, or in any mortal man, who cannot save. His breath leaves him and he goes back to the ground he came from; that same day his plans come to nothing.
  - range: 5-6
    heading: Happy is he whose help is the God of Jacob
    plain: |
      Happy is the one whose help is the God of Jacob, whose hope is in the LORD his God. He made heaven and earth, the sea and everything in them. He keeps faith for ever.
  - range: 7-9
    heading: What the LORD does
    plain: |
      He gives justice to the oppressed and food to the hungry. The LORD sets prisoners free. The LORD opens the eyes of the blind. The LORD lifts up those who are bent low. The LORD loves the righteous. The LORD watches over the strangers; He restores the fatherless and the widow. But the way of the wicked He makes crooked.
  - range: 10
    heading: The LORD shall reign for ever
    plain: |
      The LORD will reign for ever: your God, Zion, through all generations. Praise the LORD.

notes:
  - ref: 1
    phrase: Praise the LORD, O my soul
    kind: scripture
    title: The call to everyone, then to himself
    body: |
      The singer gives the order to a congregation and then turns it on himself. “Praise ye the LORD” is addressed to many (see the note on [[Ps. 150:1]]); “Praise the LORD, O my soul” is addressed to one, and verse 2 is his answer.

      Both lines have been heard before in the book. “Bless the LORD, O my soul” opens Psalms 103 and 104 ([[Ps. 103:1]]; [[Ps. 104:1]]), and here the word is “praise,” as in the call before it. Verse 2 is nearly a line from the end of Psalm 104: “I will sing unto the LORD as long as I live: I will sing praise to my God while I have my being” ([[Ps. 104:33]]).

      In verse 2 the praise will last as long as the singer does. Verse 4 then says how long a prince lasts, and verse 10 how long the LORD reigns.
    sources: [lds-scriptures]

  - ref: 3
    phrase: nor in the son of man, in whom there is no help
    kind: words
    title: A son of man is a mortal, and he cannot save
    body: |
      “The son of man” here is not a title. It is the Old Testament’s ordinary way of saying “a man,” as at [[Ps. 8:4]], and a modern translation has simply “mortals.” The line widens the warning from princes to anyone human.

      “Help” is a strong word in the Hebrew. It means “deliverance, salvation,” the rescue that elsewhere comes from God in battle or in trouble. So the charge against the prince is not that he is unkind. It is that he has no rescue to give.

      An earlier psalm says the same thing as a comparison: “It is better to trust in the LORD than to put confidence in princes” ([[Ps. 118:9]]). Jeremiah says it as a curse, “Cursed be the man that trusteth in man, and maketh flesh his arm” ([[Jer. 17:5]]). Near the end of his own psalm Nephi has both the refusal and the curse: “I will not put my trust in the arm of flesh,” and “cursed is he that putteth his trust in man or maketh flesh his arm” ([[2 Ne. 4:34]]). The note on [[Ps. 25:17]] compares Nephi’s psalm with the Psalms.
    sources: [bd-son-of-man, nrsvue, bdb, lds-scriptures]

  - ref: 4
    phrase: he returneth to his earth; in that very day his thoughts perish
    kind: scripture
    title: Back to the ground, and his plans with him
    body: |
      Verse 4 gives the reason for the warning: the man who is trusted dies, and what he intended dies the same day. “Thoughts” is the King James word for what a modern translation calls “plans,” and one older reading “projects or plans.” The verse is about what becomes of a ruler’s purposes.

      The wording reaches back to Genesis. “Son of man” in verse 3 is, in Hebrew, “son of *adam*,” and the same older reading takes that name together with “his earth” in this verse as joining two verses about Adam: “the LORD God formed man of the dust of the ground, and breathed into his nostrils the breath of life” ([[Gen. 2:7]]), and “dust thou art, and unto dust shalt thou return” ([[Gen. 3:19]]). On that reading, the breath that was given goes out, and the man goes back to what he was made from.

      What the Psalms say of the dead, and what the Restoration adds, is treated at [[Ps. 6:5]]. Alma says of the spirit at death that “the spirits of all men, whether they be good or evil, are taken home to that God who gave them life” ([[Alma 40:11]]).
    sources: [nrsvue, delitzsch-psalms, oshb-wlc, lds-scriptures]

  - ref: 6
    phrase: which keepeth truth for ever
    kind: structure
    title: 'Why He can be trusted: able, faithful, and at work'
    body: |
      From verse 5 the psalm gives its reasons for trusting the LORD, and they come in an order. “Happy” is the word translated “Blessed” in the first line of the book (see the note on [[Ps. 1:1]]); here it marks the turn from the helper who fails to the one who does not.

      The first reason is power. He “made heaven, and earth, the sea, and all that therein is.” The second is constancy. “Truth” in this line is faithfulness: on one older reading, He “unchangeably adheres to the fulfilling of His promises.”

      The third reason is what He is doing. Verses 7–9 are a list of acts, and from the middle of verse 7 five lines in a row begin with “The LORD.” Nearly everyone named is in need: the oppressed, the hungry, the prisoners, the blind, the bowed down, the strangers, the fatherless, the widow. The wicked come last, in a single line.
    sources: [delitzsch-psalms, oshb-wlc, lds-scriptures]

  - ref: 8
    phrase: The LORD openeth the eyes of the blind
    kind: christ
    title: The works Jesus named to John
    body: |
      What the psalm says the LORD does, Jesus pointed to as the sign of who He was. John the Baptist, in prison, sent two disciples to ask, “Art thou he that should come, or do we look for another?” ([[Matt. 11:3]]). He told them to report what they had seen and heard: “The blind receive their sight, and the lame walk, the lepers are cleansed, and the deaf hear, the dead are raised up, and the poor have the gospel preached to them” ([[Matt. 11:5]]).

      Isaiah’s servant is sent “To open the blind eyes, to bring out the prisoners from the prison” ([[Isa. 42:7]]). The psalm has the same two acts side by side, the prisoners in verse 7 and the blind in verse 8. The note on [[Isa. 42:7]] follows the freeing of prisoners into the Savior’s work among the dead.

      In the psalm the one who does these things is named five times, and the name is the LORD (see the note on [[Ps. 110:1]]).
    sources: [lds-scriptures]

  - ref: 9
    phrase: The LORD preserveth the strangers; he relieveth the fatherless and widow
    kind: scripture
    title: The law’s three, and the way that is bent
    body: |
      The strangers, the fatherless and the widow are the three the law of Moses puts under the LORD’s own care; the note on [[Ps. 94:6]] gives the law’s words. In Psalm 94 they are the people the proud kill, and the psalmist asks how long. Here they are the people the LORD keeps.

      “Relieveth” means more than easing a burden. The verb means to “restore, relieve,” and the next psalm uses it again: “The LORD lifteth up the meek: he casteth the wicked down to the ground” ([[Ps. 147:6]]).

      “Turneth upside down” translates a word that means to “bend, make crooked”: the LORD bends their road.
    sources: [bdb, lds-scriptures]

christ: |
  The helper this psalm sets against every prince is the LORD, and the note on [[Ps. 110:1]] says who the LORD of the Psalms is. The psalm says that He opens the eyes of the blind, and when John’s messengers asked Jesus whether He was the one who should come, the blind receiving their sight stood first in His answer (see the note on verse 8).

  The psalm’s last word about Him is that He “shall reign for ever,” Zion’s God “unto all generations.”

explore: |
  - **The psalm before it.** [[Ps. 145]], which ends by promising the praise this psalm begins, and shares its lines about the bowed down, the hungry and the everlasting kingdom.
  - **The four hallelujahs that follow.** [[Ps. 147]]–150, each opening and closing as this one does; the note on [[Ps. 150:6]] says how they close the book.
  - **The servant who opens blind eyes and frees prisoners.** [[Isa. 42:1–7]], and the mission the Savior announced at Nazareth in [[Luke 4:18]].
  - **The song at the sea.** [[Ex. 15:18]], the last line of the song at the sea: “The LORD shall reign for ever and ever.”

parallels:
