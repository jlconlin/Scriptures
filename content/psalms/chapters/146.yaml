    note: The vow of verse 2, in nearly the same words.
  - ref: Ps. 118:8–9
    note: Better to trust in the LORD than to put confidence in man or in princes.
  - ref: 2 Ne. 4:34
    note: Nephi will not put his trust in the arm of flesh.
  - ref: Gen. 3:19
    note: Dust returning to dust, beside the prince’s return “to his earth” in verse 4.
  - ref: Ps. 145:14
    note: The LORD raises up all who are bowed down, as in verse 8.
  - ref: Matt. 11:2–5
    note: Jesus answers John’s question with the works of verses 7–8.
  - ref: Isa. 42:7
    note: The servant opens blind eyes and brings prisoners out.
  - ref: Ex. 15:18
    note: The song at the sea ends with the words that open verse 10.

