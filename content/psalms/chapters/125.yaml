chapter: 125
title: Round About His People
tagline: A people living under a wicked ruler’s rod is told that it stands as firm as Mount Zion, because of who stands around it.
when: 'Undated; the title names no author and the psalm no ruler'

setting: |
  Psalm 125 is one of the fifteen songs of degrees, Psalms 120–134; the note on the title at [[Ps. 120:1]] explains the name. Its title gives no author, and the psalm names no king, no enemy and no year.

  What it does show is a people living under a rule that is not their own. Verse 3 speaks of “the rod of the wicked” lying on the land of the righteous, and one older reading takes that as the psalm’s whole situation: “The people are under foreign dominion.” It adds what the danger of that is: “In this lies the seductive inducement to apostasy.” The same reading judges from the psalm’s turns of phrase that it “is one of the latest.” That is one judgment, made from style; the psalm itself gives no date.

  The songs on either side of it look back on trouble that is past. Psalm 124 thanks the LORD that “the snare is broken, and we are escaped” ([[Ps. 124:7]]), and Psalm 126 remembers the day “the LORD turned again the captivity of Zion” ([[Ps. 126:1]]).

thread: |
  Psalm 125 begins with two comparisons and ends with a prayer, and **verse 3, between them, says why the comparisons needed saying.**

  The comparisons come from what could be seen at Jerusalem. Those who trust in the LORD are like Mount Zion, which does not move (verse 1). Then the picture is turned around: the people are the city, and the LORD is the ring of mountains about it (verse 2). Each line ends on the same words, “for ever.”

  Verse 3 opens with “For,” and gives the ground of that confidence as a promise about the future: the rod of the wicked “shall not rest” on the lot of the righteous. On one older reading the promise is made about a present burden: the pressure “now lies heavily upon the holy land,” and what is promised is that it “will not last for ever.” The verse also says why the LORD will end it, and the reason is a worry about the righteous themselves: “lest the righteous put forth their hands unto iniquity.”

  That worry turns the psalm to prayer. In verse 4 it speaks to the LORD for the first and only time, asking good for the good. Verse 5 then looks at those who “turn aside unto their crooked ways,” and says where the LORD will lead them; on the same reading, “the pious and the apostate ones are already separated.” The psalm closes with a blessing: “peace shall be upon Israel.”

sections:
  - range: 1-2
    heading: As mount Zion
    plain: |
      Those who trust in the LORD are like Mount Zion, which cannot be moved and stands for ever. As the mountains stand around Jerusalem, so the LORD stands around His people, from now on and for ever.
  - range: 3-3
    heading: The rod shall not rest
    plain: |
      For the scepter of wickedness will not stay on the land allotted to the righteous, or the righteous themselves might reach out their hands to do wrong.
  - range: 4-5
    heading: Do good to the good
    plain: |
      Do good, LORD, to those who are good, to those whose hearts are upright. But those who turn off into their own crooked ways the LORD will lead away with the evildoers. Peace be upon Israel!

notes:
  - ref: 1
    phrase: which cannot be removed
    kind: scripture
    title: The mountain that stays, and the city that fell
    body: |
      The comparison is to the hill and not to the city built on it: those who trust in the LORD are as fixed as Mount Zion itself. A reader who knows that Jerusalem fell to Babylon, and to Rome after it, will ask how Zion “cannot be removed.” One older reading answers that those disasters “only came upon the buildings on the mountain, not upon the mountain itself,” and it points to Micah, who foretold both things of the one hill. Zion would “be plowed as a field” ([[Micah 3:12]]), and yet “in the last days” it is “the mountain of the house of the LORD” that “shall be established in the top of the mountains” ([[Micah 4:1]]).

      On the same reading Zion is the measure of steadfastness for a reason. It is the hill where “Solomon built his temple,” and the God these people cling to “is He who sits enthroned on Zion.”
    sources: [delitzsch-psalms, bd-zion, lds-scriptures]
  - ref: 2
    phrase: the mountains are round about Jerusalem
    kind: symbol
    title: The picture turned around
    body: |
      Verse 2 turns the picture of verse 1 around and gives the reason those who trust cannot be moved. In verse 1 the people were the mountain. Here they are the city, and the LORD is the mountains standing around them.

      The picture is the city’s own. Jerusalem was “a mountain fortress, about 2600 feet above sea level, surrounded by deep valleys on all sides except the north,” with the Mount of Olives facing the temple hill across the Kidron on the east. And the songs of degrees were probably “sung by Jewish pilgrims on their way up to Jerusalem,” who would have had those heights in front of them as they sang.
    sources: [bd-jerusalem, bd-degrees-songs-of, lds-scriptures]
  - ref: 3
    phrase: the rod of the wicked
    kind: words
    title: A scepter over the allotted land
    body: |
      The verse is about who rules the land: the “rod” is a ruler’s scepter, and the “lot” is the land Israel received by lot. A modern translation puts the two together: “the scepter of wickedness shall not rest on the land allotted to the righteous.” The word “lot” reaches back to the conquest, when “by lot was their inheritance” ([[Josh. 14:2]]). So the complaint is exact. The inheritance the LORD gave by lot has a wicked power’s scepter lying on it.

      The second half of the verse gives the reason the rod will be lifted, and it concerns the righteous and not the ruler: “lest the righteous put forth their hands unto iniquity.”
    sources: [bdb, nrsvue, lds-scriptures]
  - ref: 5
    phrase: turn aside unto their crooked ways
    kind: words
    title: Led away with the evildoers
    body: |
      Verse 5 is about people who leave the straight road by their own choice, and to “lead them forth” is to lead them away. A modern translation makes both plain: they “turn aside to their own crooked ways,” and “the LORD will lead away with evildoers.” They are set against those who are “upright in their hearts” in verse 4, crooked against upright.

      The psalm does not say who they are, and it does not call them workers of iniquity. It says they will share those workers’ road.
    sources: [nrsvue, lds-scriptures]
  - ref: 5
    phrase: peace shall be upon Israel
    kind: scripture
    title: A blessing, and on whom it falls
    body: |
      The last line is a blessing said over the people more than a forecast. The King James supplies “but” and “shall be”; the Hebrew has three words, “Peace upon Israel,” and a modern translation prints it as a cry: “Peace be upon Israel!” The same words end another song of degrees, a blessing on a household: “thou shalt see thy children’s children, and peace upon Israel” ([[Ps. 128:6]]).

      Coming straight after the sentence on those who turn aside, the line reads as a blessing on the Israel the psalm has described: those who trust (verse 1), “his people” whom the LORD surrounds (verse 2), the upright in heart (verse 4). Paul’s blessing at the end of Galatians is as particular. Peace is for “as many as walk according to this rule,” and he gives them the name “the Israel of God” ([[Gal. 6:16]]).
    sources: [biblehub-interlinear, nrsvue, lds-scriptures]

christ: |
  The LORD who stands round about His people in this psalm is Jehovah, who is Jesus Christ before His birth; the note at [[Ps. 110:1]] explains the name.

  The New Testament keeps the name of the psalm’s mountain, spelled Sion, and sets Him on it. John saw that “a Lamb stood on the mount Sion,” with those who bear His Father’s name ([[Rev. 14:1]]). Hebrews tells believers that they have already come to that mountain ([[Heb. 12:22]]).

explore: |
  - **Zion that cannot be moved.** [[Ps. 46:4–5]], where the city “shall not be moved” because God is in the midst of her; and in latter-day revelation [[D&C 97:18–21]] and [[D&C 101:16–18]], where Zion “cannot fall, neither be moved out of her place.”
  - **Mountains that do move.** [[Isa. 54:10]], where the mountains may depart and the LORD’s kindness will not.
  - **The LORD round about.** [[Ps. 34:7]], where the angel of the LORD encamps round about those who fear Him; [[Zech. 2:4–5]], where He is a wall of fire around a Jerusalem without walls; and [[2 Kgs. 6:15–17]], where Elisha’s servant is shown what stands around the city.
  - **The hills in the songs of degrees.** [[Ps. 121:1–8]].

parallels:
  - ref: Ps. 128:6
    note: Another song of degrees closes with “peace upon Israel.”
  - ref: Gal. 6:16
    note: Paul’s blessing of peace on “the Israel of God.”
  - ref: Ps. 34:7
    note: The angel of the LORD encamps round about those who fear Him.

sources: [lds-scriptures, bd-degrees-songs-of, bd-zion, bd-jerusalem, gs-jehovah, delitzsch-psalms, bdb, nrsvue, biblehub-interlinear]
