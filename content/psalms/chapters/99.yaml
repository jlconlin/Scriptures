chapter: 99
title: Holy Is He
tagline: The LORD reigns above the cherubim and the peoples shake; three times the psalm stops to say that He is holy, and the third time it has told how He forgave and still held His people to account.
when: 'Undated; the psalm has no title'

setting: |
  Psalm 99 has no title in the King James. The ancient Greek translation gives it one, “A Psalm of David.” The psalm itself names no author and no occasion.

  It is the last of three psalms that open with the cry “The LORD reigneth”; the others are Psalms 93 and 97. The cry is explained at [[Ps. 93:1]], and its use across the Psalms at [[Ps. 47:8]].

  The scene is the sanctuary on Zion. The LORD is enthroned above the cherubim (verse 1), His people worship at His footstool (verse 5), and the last verse sends them to His holy hill. Nothing in the nine verses fixes a date.

  What sets this psalm apart from the other two is its memory. Its last part reaches back past every king of Israel to Moses, Aaron and Samuel, and to the pillar of cloud in the wilderness.

thread: |
  The psalm falls into three parts, and each closes on the same word: “it is holy” (verse 3), “he is holy” (verse 5), “the LORD our God is holy” (verse 9). One older reading hears in the three “an earthly echo of the trisagion of the seraphim,” the threefold “Holy” of [[Isa. 6:3]]. **Each part looks at a smaller circle than the one before: all peoples, then Jacob, then three men who prayed.**

  The first part is the widest. The LORD reigns, and it is the peoples and the earth that shake (verses 1–3). He is “great in Zion,” but “high above all the people.” What is asked of them is trembling and then praise, and on the same older reading the trembling is not despair but “a trembling that leads on to salvation.”

  The second part narrows to one nation. The King loves justice, and He has done it “in Jacob” (verse 4). The response is to exalt Him and worship at His footstool (verse 5).

  The turn is verse 6. The psalm leaves the present for the past and names three men who called on Him and were answered. This third part is the longest, and it ends on two things said of Him together: He forgave them, and He took vengeance on what they had done (verse 8). The psalm does not explain how the two go together. It calls Him holy a third time, at greater length than before. He is, on that older reading, “holy in love and in wrath.”

sections:
  - range: 1-3
    heading: Holy above the nations
    plain: |
      The LORD is King; let the peoples tremble. He sits enthroned on the cherubim; let the earth shake. The LORD is great in Zion, and He is high over all the peoples. Let them praise Your great and fearful name. Holy is He!
  - range: 4-5
    heading: Holy in justice
    plain: |
      Mighty King, who loves justice, You have set what is fair in place; You have done what is just and right in Jacob. Lift up the LORD our God, and worship at His footstool. Holy is He!
  - range: 6-9
    heading: Holy in forgiving and in judging
    plain: |
      Moses and Aaron were among His priests, and Samuel among those who called on His name. They called to the LORD, and He answered them. He spoke to them in the pillar of cloud; they kept His decrees and the statute He gave them. LORD our God, You answered them. You were a God who forgave them, and yet You punished their wrongdoings. Lift up the LORD our God, and worship at His holy hill, for the LORD our God is holy.

notes:
  - ref: 1
    phrase: let the people tremble
    kind: words
    title: The peoples who tremble
    body: |
      Those told to tremble in verse 1 are “peoples,” in the plural, which the King James’s “people” hides. The Hebrew noun is plural, and a modern translation has “let the peoples tremble!” The same plural returns in verse 2, where the LORD is high above “all the people.”

      The second half of the line widens the call to the earth. “Let the earth be moved” is, in a modern translation, “let the earth quake!”

      The other psalm that opens this way follows the cry with gladness: “The LORD reigneth; let the earth rejoice” ([[Ps. 97:1]]). This one follows it with shaking, and by verse 3 the shaken peoples are asked for praise.
    sources: [oshb-wlc, nrsvue, lds-scriptures]

  - ref: 1
    phrase: he sitteth between the cherubims
    kind: symbol
    title: The throne above the ark
    body: |
      The LORD’s seat “between the cherubims” is the ark in the sanctuary, pictured as His throne. A modern translation has “He sits enthroned upon the cherubim.” The ark was known by this description: Israel once sent to Shiloh for “the ark of the covenant of the LORD of hosts, which dwelleth between the cherubims” ([[1 Sam. 4:4]]). What the cherubim were, and how the Psalms use the phrase, is set out at [[Ps. 80:1]].
    sources: [nrsvue, lds-scriptures]

  - ref: 3
    phrase: for it is holy
    kind: structure
    title: Three times holy
    body: |
      The psalm says “holy” at the end of each of its three parts, and the Hebrew of the first two is identical. The King James gives “it is holy” in verse 3, as though of the name, and “he is holy” in verse 5. The Hebrew is the same two words both times, and a modern translation prints both as a cry: “Holy is he!” The third, in verse 9, is longer and names Him: “the LORD our God is holy.”

      The three stand after three different things: the LORD’s rule over the peoples, His justice in Jacob, and His forgiving and punishing of His own people. So it is worth asking what the word says of Him. Things and places were holy that were set apart for a sacred purpose, but the word “came to refer to moral character,” because what marked the LORD off from other gods “was His personal character.” The law drew the consequence for the people: “Ye shall be holy: for I the LORD your God am holy” ([[Lev. 19:2]]).
    sources: [oshb-wlc, nrsvue, bd-holiness]

  - ref: 4
    phrase: The king’s strength also loveth judgment
    kind: words
    title: Which king loves judgment
    body: |
      The king of verse 4 is most naturally the LORD, whose reign the psalm has just declared. The King James keeps the wording of the Hebrew, which is hard, and leaves a reader asking whose strength is meant. A modern translation turns the line into an address to Him, “Mighty King, lover of justice,” and marks the change as a correction of the Hebrew, which reads “And a king’s strength.”

      The rest of the verse is spoken to the LORD and credits the justice to Him: “thou dost establish equity, thou executest judgment and righteousness in Jacob.” “Judgment” is justice. And with “in Jacob” the psalm’s view narrows from all peoples to one.
    sources: [nrsvue]

  - ref: 5
    phrase: worship at his footstool
    kind: symbol
    title: The footstool and the holy hill
    body: |
      The LORD’s footstool is a figure for the place where He rests, perhaps the ark itself. The Hebrew word is “never literal” in the Old Testament, and in this verse it is “perhaps of ark (as place on which God rests).” David used it so when he spoke of building “an house of rest for the ark of the covenant of the LORD, and for the footstool of our God” ([[1 Chr. 28:2]]). Another psalm has the same summons with the ark beside it: “We will go into his tabernacles: we will worship at his footstool” ([[Ps. 132:7]]), and then, “Arise, O LORD, into thy rest; thou, and the ark of thy strength” ([[Ps. 132:8]]). The word is discussed further at [[Lam. 2:1]], and a footstool of another kind at [[Ps. 110:1]].

      The last verse repeats the summons and changes one word. For “footstool” it has “his holy hill,” in a modern translation “his holy mountain.” Many passages of scripture speak of the temple “not as built on a hill or mountain, but as the hill or mountain of the Lord,” and this verse is one of them. Going up to that hill is the subject of [[Ps. 24:3]].
    sources: [bdb, nrsvue, skinner-seeing-god, lds-scriptures]

  - ref: 6
    phrase: Moses and Aaron among his priests, and Samuel among them that call upon his name
    kind: history
    title: Three who called and were answered
    body: |
      Moses, Aaron and Samuel each stood between the LORD and Israel, and scripture shows each of them heard.

      Aaron is the plainest case of a priest doing so. When a plague broke out after Korah’s rebellion he ran into the congregation with incense “and made an atonement for the people” ([[Num. 16:47]]).

      Moses is counted with the priests because he did a priest’s work before Aaron was consecrated. He “twice performed priestly acts which laid as it were a foundation for all times to come”: at Sinai “Moses took the blood, and sprinkled it on the people” ([[Ex. 24:8]]), and it was he who consecrated Aaron and his sons ([[Lev. 8:30]]). Restoration scripture says that he held “the Holy Priesthood which he received under the hand of his father-in-law, Jethro” ([[D&C 84:6]]). He was heard in prayer as well: the LORD would have destroyed Israel “had not Moses his chosen stood before him in the breach, to turn away his wrath” ([[Ps. 106:23]]).

      Samuel is set among those who call on the name. When the Philistines came up against Israel, “Samuel cried unto the LORD for Israel; and the LORD heard him” ([[1 Sam. 7:9]]). At the end of his life as judge he told the people, “God forbid that I should sin against the LORD in ceasing to pray for you” ([[1 Sam. 12:23]]).

      Jeremiah names two of the three in the same role. To a later generation the LORD said, “Though Moses and Samuel stood before me, yet my mind could not be toward this people” ([[Jer. 15:1]]).
    sources: [delitzsch-psalms, lds-scriptures]

  - ref: 7
    phrase: He spake unto them in the cloudy pillar
    kind: scripture
    title: Who was spoken to from the cloud
    body: |
      The cloudy pillar belongs to Moses’s story, so “them” in this verse is hard to take of all three men of verse 6. In the wilderness, when Moses went into the tent, “the cloudy pillar descended, and stood at the door of the tabernacle, and the LORD talked with Moses” ([[Ex. 33:9]]). Once Aaron was called with Miriam, when “the LORD came down in the pillar of the cloud” ([[Num. 12:5]]).

      One older reading therefore takes “them” as the people. In the accounts “it is always Moses only, not Aaron, much less Samuel, with whom God negotiates in such a manner,” so the pronoun “refers to the whole people,” the nation of priests and praying ones to which the three belonged. Exodus supports the wider view: when the LORD spoke with Moses, “all the people saw the cloudy pillar stand at the tabernacle door: and all the people rose up and worshipped” ([[Ex. 33:10]]).

      The same question returns in verse 8, and the same reading answers it the same way. If “them” there were only the three, “vengeance” and “inventions” would be “too strong expressions” for their failings. On this reading the verse remembers “the generation of the desert, which fell short of the promise.” The psalm does not mark where it passes from the three to the people, so this is a reading and not something the text says outright.
    sources: [delitzsch-psalms, lds-scriptures]

  - ref: 8
    phrase: thou wast a God that forgavest them, though thou tookest vengeance of their inventions
    kind: scripture
    title: Forgiven, and still held to account
    body: |
      The verse says two things of God in one breath, and the Hebrew sets them side by side as two titles: a forgiving God, and an avenger. A modern translation keeps the balance in two lines, “you were a forgiving God to them” and then “but an avenger of their wrongdoings.”

      “Inventions” is misleading in today’s English. The Hebrew noun is a word for deeds, and of people it usually means “practices = evil deeds.” The vengeance is God’s, taken “on their doings,” those of His own people.

      The first title is the one the LORD gave Himself at Sinai. “Forgavest” is the Hebrew participle of His proclamation of His name to Moses, where it is translated “forgiving,” and that sentence has the same two sides: “forgiving iniquity and transgression and sin, and that will by no means clear the guilty” ([[Ex. 34:7]]).

      On the reading given at verse 7, this verse remembers the wilderness generation, and Numbers tells of a day when both things were done to it at once. After the spies’ report the people refused the land, and Moses prayed for them in the words of that proclamation. The LORD answered, “I have pardoned according to thy word” ([[Num. 14:20]]). The nation was not destroyed. But of the generation that had refused, He said, “Surely they shall not see the land which I sware unto their fathers” ([[Num. 14:23]]).
    sources: [oshb-wlc, nrsvue, bdb, lds-scriptures]

christ: |
  The LORD who reigns in this psalm is Jehovah, and Jehovah is the premortal Jesus Christ. Paul says so of the wilderness years that verse 7 remembers. He reminds the Corinthians that “all our fathers were under the cloud” ([[1 Cor. 10:1]]) and says of the Rock that went with them, “that Rock was Christ” ([[1 Cor. 10:4]]). The Church’s edition heads that chapter “Christ is the God of Israel and the spiritual Rock that guided them.”

  The song John hears at the end is close to verses 1–3. Those who have overcome sing “the song of Moses the servant of God, and the song of the Lamb” ([[Rev. 15:3]]): “Who shall not fear thee, O Lord, and glorify thy name? for thou only art holy: for all nations shall come and worship before thee” ([[Rev. 15:4]]).

explore: |
  - **The LORD reigneth.** Read [[Ps. 93:1]] and [[Ps. 97:1]] beside this psalm, and notice what each sets after the cry: the floods, the earth’s gladness, the peoples’ trembling.
  - **The name proclaimed at Sinai.** [[Ex. 34:6–7]] is the fullest statement of what verse 8 says in a line. Moses prays it back to the LORD in [[Num. 14:18]].
  - **Those who stood before Him.** [[Ex. 32:30–32]], [[Num. 16:46–48]] and [[1 Sam. 12:19–23]] show the three at prayer; [[Jer. 15:1]] shows what it meant when even they could not avail.

parallels:
  - ref: Isa. 6:3
    note: The seraphim cry “Holy” three times before the Lord on His throne.
  - ref: 1 Chr. 28:2
    note: David calls the ark’s resting place “the footstool of our God.”
  - ref: Ps. 132:7
    note: The same summons to worship at His footstool, with the ark named in the next verse.
  - ref: Ex. 33:9–10
    note: The LORD speaks with Moses from the cloudy pillar while all the people worship.
  - ref: Jer. 15:1
    note: Moses and Samuel named together as those who stood before the LORD for the people.
  - ref: Ex. 34:6–7
    note: The LORD proclaims His name as forgiving and as by no means clearing the guilty.
  - ref: Num. 14:20–23
    note: The LORD pardons at Moses’s word, and the generation still does not see the land.
  - ref: Rev. 15:3–4
    note: The song of Moses and of the Lamb, “thou only art holy,” with all nations coming to worship.

sources: [lds-scriptures, oshb-wlc, bdb, lxx-rahlfs, nrsvue, delitzsch-psalms, skinner-seeing-god, bd-holiness, gs-jehovah]
