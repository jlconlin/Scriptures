chapter: 148
title: Praise Him from the Heavens, Praise Him from the Earth
tagline: The whole creation is called to praise the LORD, angels and stars, sea monsters and storm, kings and children, and the last reason given is what He has done for one people.
when: 'Undated; the psalm has no title'

setting: |
  Psalm 148 has no title and names no author, no enemy, and no occasion. It asks for nothing. It is the third of the last five psalms, each of which opens and closes with “Praise ye the LORD,” the hallelujah explained at [[Ps. 150:1]].

  Its neighbors show where it stands. Psalm 147 praises the LORD for what He does in the sky and the weather and for what He gives Israel, and ends by saying that He “hath not dealt so with any nation” ([[Ps. 147:20]]). Psalm 148 keeps both subjects and reverses the proportion: thirteen verses for the creation and one, the last, for Israel. Psalm 149 then begins where this one ends, with the LORD’s “praise in the congregation of saints” ([[Ps. 149:1]]).

  Much of the psalm’s roll is the creation account’s. The waters above the heavens ([[Gen. 1:7]]), the lights, the sea monsters ([[Gen. 1:21]]), the cattle, the creeping things and the fowl all stand in the first chapter of Genesis.

thread: |
  Psalm 148 is **one choir called in two companies, heaven’s and earth’s, and each told why it sings**. “Praise ye the LORD from the heavens” gathers the first company (verses 1–4), and “Praise the LORD from the earth” gathers the second (verses 7–12). Each call ends in the same line, “Let them praise the name of the LORD,” followed by “for” and a reason (verses 5 and 13).

  The first call starts at the top. It begins in “the heights” with the angels and goes on to sun, moon and stars, the highest heavens and the waters above them (the waters of [[Gen. 1:7]]; see the note on [[Gen. 1:6]]). The heavens’ reason is their own making: “he commanded, and they were created,” and He set them a bound they keep.

  The earth’s company begins in the deeps and ends with people: sea monsters, weather, mountains, trees, animals, and then kings, princes, young and old. Nothing is asked of the kings that is not asked of the hail.

  The turn is in the last two verses. The earth’s reason is the LORD Himself, whose name alone is exalted and whose glory is “above the earth and heaven.” Then verse 14 adds a reason of another kind: He has lifted up the horn of His people. A psalm that summoned everything that exists ends with “the children of Israel, a people near unto him.”

sections:
  - range: 1-4
    heading: Praise him from the heavens
    plain: |
      Praise the LORD! Praise the LORD from the heavens; praise Him in the heights. Praise Him, all His angels; praise Him, all His hosts. Praise Him, sun and moon; praise Him, all you shining stars. Praise Him, highest heavens, and you waters above the heavens.
  - range: 5-6
    heading: He commanded, and they were created
    plain: |
      Let them praise the name of the LORD, because He gave the command and they were created. He set them in place for ever and ever; He gave a decree that will not pass.
  - range: 7-12
    heading: Praise him from the earth
    plain: |
      Praise the LORD from the earth, you sea monsters and all the deeps; fire and hail, snow and mist, and the storm wind that carries out His word; mountains and all hills, fruit trees and all cedars; wild animals and all cattle, creeping things and winged birds; kings of the earth and all peoples, princes and all rulers of the earth; young men and young women together, old men and children.
  - range: 13-14
    heading: His name alone, and a people near to him
    plain: |
      Let them praise the name of the LORD, because His name alone is exalted; His glory is above earth and heaven. He lifts up the horn of His people, the praise of all His saints, of the children of Israel, a people near to Him. Praise the LORD!

notes:
  - ref: 2
    phrase: all his hosts
    kind: words
    title: The hosts are the holy beings around the LORD
    body: |
      The “hosts” called on beside the angels are the LORD’s heavenly company. His host is “all the holy beings who surround Him and do His will,” and this verse is one of the places that shows it. An earlier psalm calls on the angels and the hosts together in the same way and describes both by their obedience: the angels “do his commandments” and the hosts “do his pleasure” ([[Ps. 103:20–21]]).

      The same word is used elsewhere for “the inanimate creations of the Lord, such as the stars and planets,” as when Moses warns Israel against worshipping “the sun, and the moon, and the stars, even all the host of heaven” ([[Deut. 4:19]]). The psalm names those next, in verse 3, and calls them to praise with the rest.
    sources: [pike-hebrew-words, lds-scriptures]

  - ref: 6
    phrase: he hath made a decree which shall not pass
    kind: scripture
    title: The decree is a bound set for the heavens
    body: |
      The “decree” is a limit fixed for the heavenly bodies, and the line can be read two ways. The Hebrew noun here is a “prescribed limit, boundary,” used elsewhere of the bound set for the sea. The King James leaves open what does not pass. One reading is that the decree itself will never pass away. The other is that nothing passes it: a modern translation has “he fixed their bounds, which cannot be passed,” and gives the first reading in its margin.

      Jeremiah speaks of the same fixed order in the sky, the LORD’s “ordinances of the moon and of the stars” ([[Jer. 31:35]]). In the next verse, where “ordinances” is this psalm’s noun, he makes that order the measure of Israel’s lasting: “If those ordinances depart from before me, saith the LORD, then the seed of Israel also shall cease from being a nation before me for ever” ([[Jer. 31:36]]; see the note there).
    sources: [bdb, nrsvue, lds-scriptures]

  - ref: 7
    phrase: ye dragons, and all deeps
    kind: symbol
    title: The sea monsters sing first
    body: |
      The first voices called from the earth are sea monsters, which an earlier psalm names as the LORD’s enemies. The “dragons” are sea monsters, as a modern translation prints it, and the “deeps” are the ocean depths. That earlier psalm uses the same Hebrew word for a foe: “thou brakest the heads of the dragons in the waters” ([[Ps. 74:13]], where the sea monster is explained).

      Here there is no battle. The word is also the one behind the “great whales” God made on the fifth day ([[Gen. 1:21]]; see the note there), and this psalm, like that chapter, names the monsters among the things God made. So does [[Ps. 104:26]], where leviathan is made “to play” in the sea.
    sources: [nrsvue, oshb-wlc, lds-scriptures]

  - ref: 14
    phrase: He also exalteth the horn of his people
    kind: symbol
    title: Why the psalm ends with Israel
    body: |
      The last reason for the praise of heaven and earth is something done for one people: the LORD has given them strength. A horn is strength (see [[Ps. 18:2]]), and a horn lifted up is “increase of might, dignity”; in this verse it is taken as “restoration of might.” A modern translation has “He has raised up a horn for his people.”

      The psalm does not say when. One older reading places it after the exile, when Israel had been “gathered together again” and Jerusalem rebuilt, and takes the horn as one the people did not have until it was given. That is an inference; the psalm names no occasion.

      The phrases that follow describe the people. The “saints” are the faithful (see [[Ps. 4:3]]). “A people near unto him” is how Moses spoke of Israel: “what nation is there so great, who hath God so nigh unto them” ([[Deut. 4:7]]). On the same older reading the nearness explains the psalm’s shape. The people who stand near Him know what He has done, and so Israel “comes forward in this Psalm as the leader” of all creatures, beginning a hallelujah that heaven and earth are to take up.
    sources: [bdb, nrsvue, delitzsch-psalms, lds-scriptures]

christ: |
  The LORD of this psalm is Jehovah, the Savior before He came in the flesh (see [[Ps. 110:1]]), and its first reason for praise is His work. “He commanded, and they were created”: John says of the Word that “all things were made by him” ([[John 1:3]]), and the Father told Moses of the worlds, “by the Son I created them” ([[Moses 1:33]]).

  In John’s vision the praise of every creature goes to the Lamb as well. “Every creature which is in heaven, and on the earth, and under the earth, and such as are in the sea” gives blessing and honor “unto him that sitteth upon the throne, and unto the Lamb for ever and ever” ([[Rev. 5:13]]).

explore: |
  - **The creation account.** [[Gen. 1]], and Abraham’s account, in which what is commanded obeys ([[Abr. 4:9–18]]).
  - **Law given to all things.** [[D&C 88:36–47]], which ends by saying that anyone who has seen the least of these bodies “hath seen God moving in his majesty and power.”
  - **Creation called to rejoice.** [[Isa. 44:23]], [[Isa. 55:12]] and [[Ps. 98:7–9]], with the Prophet Joseph Smith’s call to the mountains, the trees, and the sun, moon and stars in [[D&C 128:22–23]].
  - **Every creature praising.** [[Rev. 5:11–14]], and the last psalm’s last verse, [[Ps. 150:6]].
  - **The neighbors.** [[Ps. 147]], which gives Israel’s reasons at length, and [[Ps. 149]], which takes up “the congregation of saints.”

parallels:
  - ref: Gen. 1:7
    note: The waters above the firmament, which verse 4 calls “waters that be above the heavens.”
  - ref: Ps. 103:20–21
    note: The angels and the hosts are called on together, as in verse 2.
  - ref: D&C 88:42–45
    note: A law given to all things, by which sun, moon and stars keep their courses.
  - ref: Jer. 31:35–36
    note: The ordinances of moon and stars as the measure of Israel’s lasting.
  - ref: D&C 128:23
    note: Mountains, seas, trees, sun, moon and stars called to praise in the latter days.
  - ref: Rev. 5:13
    note: Every creature in heaven, earth and sea praises Him on the throne and the Lamb.

