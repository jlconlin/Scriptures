chapter: 13
title: How Long, O LORD?
tagline: A man who thinks God has forgotten him asks “How long?” four times, begs for light before he dies, and then, with no answer recorded, says that he has trusted and will sing.
when: 'Undated; a psalm of David by its title'

setting: |
  The title ascribes the psalm to David and names no occasion. One suggestion, offered with no more than a “Perhaps,” places it in the years when Saul hunted David from place to place. The psalm itself says only that there is an enemy, that he has the upper hand, and that the speaker expects to die if nothing changes.

  It is a lament of one person, “in the face of perils at the hands of wicked enemies,” and its six verses hold the whole form: complaint, plea, and praise. (The parts of a lament are set out at [[Ps. 22:1]].) Nothing in it asks for the enemy’s punishment, and nothing in it confesses a sin. The speaker’s whole trouble is that the LORD seems to have forgotten him.

  Two later prayers in Restoration scripture have “affinities” with it. Joseph Smith in Liberty Jail asks “how long” of a God in hiding ([[D&C 121:1–3]]), and Nephi’s psalm has a line close to verse 5, “I know in whom I have trusted” ([[2 Ne. 4:19]]).

thread: |
  The psalm has three parts, complaint, prayer and trust, each shorter than the one before, and it has been pictured as a sea that “casts up constantly lessening waves, until it becomes still.” **The question the psalm leaves open is what stilled it.**

  The complaint (verses 1–2) is four questions that begin the same way. The first two are about God, who forgets and hides His face. The third is about the speaker, alone with his own counsels and his sorrow. The fourth is about the enemy, who is on top.

  The plea (verses 3–4) has three requests, and they have been matched to the complaint one by one. “Consider,” that is, look, is said “in contrast to God’s seeming to have forgotten him.” “Hear me” (“answer me,” in a modern translation) is said “in contrast to his being in perplexity what course to take.” The request for light in his eyes is said “in contrast to the triumphing of his foe.” Two reasons follow, each beginning “Lest”: he will die, and his enemies will rejoice.

  Then verse 5 begins “But I.” The psalm “does not record an answer from the Lord.” Nor does it say that the enemy has gone. What has changed is whose joy is spoken of. In verse 4 it was the enemies who would “rejoice”; in verse 5 the same verb belongs to his own heart, and its ground is “thy mercy” and “thy salvation.” He asked “How long?” and was not told. The psalm ends with a vow to sing, and the notes on verses 5 and 6 take up what that vow rests on.

sections:
  - range: 1-2
    heading: Four times, how long?
    plain: |
      How long, LORD? Will You forget me for ever? How long will You hide Your face from me? How long must I take counsel with myself, with grief in my heart all day long? How long will my enemy stand over me?
  - range: 3-4
    heading: Look, answer, give light
    plain: |
      Look at me and answer me, LORD my God. Put light in my eyes, or I will sleep in death, and my enemy will say, “I have beaten him,” and those who trouble me will be glad that I am shaken.
  - range: 5-6
    heading: But I have trusted
    plain: |
      But as for me, I have trusted in Your faithful love. My heart will be glad in Your salvation. I will sing to the LORD, because He has dealt generously with me.

notes:
  - ref: 1
    phrase: How long wilt thou forget me, O LORD? for ever?
    kind: words
    title: How long, four times, and for ever
    body: |
      The psalm opens with one Hebrew question, “until when?”, asked four times in two verses, and in the first line it is set beside “for ever.” The King James keeps the two side by side as separate questions; a modern translation divides the line otherwise, “How long, O Lord? Will you forget me forever?”

      The pairing is not peculiar to this psalm. It comes again in “How long, LORD? wilt thou be angry for ever?” ([[Ps. 79:5]]) and in “How long, LORD? wilt thou hide thyself for ever?” ([[Ps. 89:46]]).
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]
  - ref: 1
    phrase: hide thy face from me
    kind: symbol
    title: The hidden face
    body: |
      For the LORD to hide His face is for Him to withdraw His favour, and the same phrase stands in His warning to Israel. In Deuteronomy the LORD says of a day to come, “I will forsake them, and I will hide my face from them, and they shall be devoured” ([[Deut. 31:17]]), and the next verse gives the cause, that “they are turned unto other gods.”

      The speaker of Psalm 13 names no cause. He does not say that he has sinned, and he does not say that he is innocent. He says only that the face is hidden and asks how long.
    sources: [bdb, lds-scriptures, ot-minute-psalms-1-20]
  - ref: 2
    phrase: take counsel in my soul
    kind: words
    title: Counsel in the soul
    body: |
      The Hebrew says that he sets “counsels,” in the plural, in his own soul. The noun is the ordinary word for counsel or advice.

      Not every translation keeps it. A modern translation follows the ancient Syriac version and prints “How long must I bear pain in my soul,” with a footnote that the Hebrew has “hold counsels.” The King James keeps the Hebrew. On either reading the second half of the line is plain: the sorrow is in his heart “daily,” or “all day long.”
    sources: [oshb-wlc, bdb, nrsvue]
  - ref: 2
    phrase: how long shall mine enemy be exalted over me
    kind: scripture
    title: Joseph Smith asks the same question
    body: |
      Joseph Smith’s prayer from Liberty Jail has the psalm’s question, and in his case the answer is recorded. His prayer begins with the hidden God, “O God, where art thou? And where is the pavilion that covereth thy hiding place?” ([[D&C 121:1]]), and then asks twice what the psalm asks four times: “How long shall thy hand be stayed” ([[D&C 121:2]]), and “how long shall they suffer these wrongs and unlawful oppressions” ([[D&C 121:3]]).

      The two prayers part at the answer. The psalm records none, whereas Joseph Smith “received an extensive response” that “comforted his troubled heart.” It begins, “My son, peace be unto thy soul; thine adversity and thine afflictions shall be but a small moment” ([[D&C 121:7]]), and it goes on to promise, “thou shalt triumph over all thy foes” ([[D&C 121:8]]).
    sources: [ot-minute-psalms-1-20, lds-scriptures]
  - ref: 3
    phrase: lighten mine eyes
    kind: symbol
    title: Light in the eyes is life
    body: |
      To have one’s eyes lightened is to be revived, and the speaker asks for it lest he die. When Jonathan tasted a little honey, “his eyes were enlightened” ([[1 Sam. 14:27]]). Ezra thanks God for a respite, “that our God may lighten our eyes, and give us a little reviving in our bondage” ([[Ezra 9:8]]). To lighten eyes “dimmed with sorrow and ready to break” is “to impart new life.”

      The sleep he fears is death itself. The Hebrew says, word for word, *lest I sleep the death*, and the ancient Greek translation has “lest I sleep in death.” He prays so that “the triumph of his enemy may not be made complete by his dying.”

      The verb is also the one used of God’s own face. In the priestly blessing it is the word for “The LORD make his face shine upon thee” ([[Num. 6:25]]), and another psalm prays, “Make thy face to shine upon thy servant” ([[Ps. 31:16]]). On one reading, the light he asks for is the light of the LORD’s face, “the light of love beaming from the divine countenance.”
    sources: [bdb, delitzsch-psalms, lds-scriptures, oshb-wlc, lxx-rahlfs]
  - ref: 4
    phrase: when I am moved
    kind: words
    title: Moved means shaken
    body: |
      “Moved” here is a Hebrew verb meaning to “be shaken, moved, overthrown,” and Hebrew poetry mostly says that someone shall not be moved. It is said “often of righteous, as secure”: “because he is at my right hand, I shall not be moved” ([[Ps. 16:8]]).

      This verse is one of the places where the negative is missing. The speaker does not say that he shall not be moved. He says that he may be, and that his enemies are waiting to rejoice at it. A modern translation has “my foes will rejoice because I am shaken.”
    sources: [bdb, nrsvue, lds-scriptures]
  - ref: 5
    phrase: But I have trusted in thy mercy
    kind: structure
    title: The turn, before any answer
    body: |
      The psalm turns on the words “But I,” and what follows them is a statement about the speaker, not a report of anything God has done. The Hebrew of the verse begins with the pronoun written out, “and I.” Then comes a verb in the past: “I have trusted,” or “I trusted” in a modern translation.

      Its object is “thy mercy.” The Hebrew word is *hesed*, the “steadfast love” of a modern translation, which is explained at [[Ps. 51:1]].

      Laments commonly include a “confession of trust” and a “vow of praise,” so the turn belongs to the form. But a longer lament turns on the words “thou hast heard me” ([[Ps. 22:21]]). This psalm has no such words.

      Nephi’s psalm has a line close to this one. After his sorrow he says, “nevertheless, I know in whom I have trusted” ([[2 Ne. 4:19]]), a line counted as a possible allusion to this verse and to two others in the Psalms.
    sources: [oshb-wlc, nrsvue, ot-minute-psalms-1-20, sc-knowhy-438, hilton-psalms-bom, lds-scriptures]
  - ref: 6
    phrase: because he hath dealt bountifully with me
    kind: words
    title: A song for what the LORD has done
    body: |
      The last line gives a reason in the past tense for a song still to come, and the psalm has told of no deliverance. “I will sing” looks forward. “He hath dealt bountifully” is a completed act in the Hebrew, a verb that with this construction means to “deal bountifully with” someone. Another psalm has the same words, “for the LORD hath dealt bountifully with thee” ([[Ps. 116:7]]).

      One reading takes the past tense from the standpoint of the song: “the celebration follows the fact that inspires him to song.” He will sing when the LORD has acted, and he is sure enough of it to speak as if it were done. On that reading the last two verses are “the believing joy which anticipates the certainty of being answered,” and nothing outward need have changed: “Though it rage without as much now as ever - peace reigns in the depth of his heart.”

      The psalm does not decide between a deliverance already received and one only expected. It ends with the vow.
    sources: [bdb, oshb-wlc, delitzsch-psalms, lds-scriptures]

christ: |
  The one addressed as “O LORD my God” is Jehovah, the premortal Jesus Christ. So the mercy this man has trusted and the salvation his heart waits to rejoice in are His.

  What the psalm says of the Lord is what its speaker says of Him: that His *hesed* can be trusted, that salvation is His, and that He deals bountifully.

explore: |
  - **Nephi’s psalm.** [[2 Ne. 4:16–35]], which has affinities with this psalm in wording and meaning.
  - **The longer lament.** [[Ps. 22:1]], where the complaint is that God has forsaken, and the turn comes at verse 21.

parallels:
  - ref: D&C 121:1–3
    note: Joseph Smith in Liberty Jail asks where God is hiding and “how long”; the answer begins at verse 7.
  - ref: 2 Ne. 4:19
    note: Nephi, after his sorrow, says “I know in whom I have trusted”; compare verse 5.
  - ref: Deut. 31:17
    note: The LORD warns that He will hide His face from a covenant-breaking Israel; compare verse 1.
  - ref: Num. 6:25
    note: The priestly blessing asks that the LORD’s face shine, with the verb of verse 3.

