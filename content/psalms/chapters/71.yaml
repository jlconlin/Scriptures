chapter: 71
title: When I Am Old and Grayheaded
tagline: An old man who has leaned on God since birth asks not to be forsaken now, so that he can tell the next generation what God has done.
when: 'Undated; the psalm has no title, and its speaker is old'

setting: |
  Psalm 71 stands between two psalms that carry names. Before it is a short plea that its title gives to David ([[Ps. 70:1]]); after it is the psalm for Solomon, which ends “The prayers of David the son of Jesse are ended” ([[Ps. 72:20]]).

  It has no title of its own. The Greek translation supplies one: “By David, a Psalm sung by the sons of Jonadab, and the first that were taken captive.” The sons of Jonadab are the Rechabites of Jeremiah’s day, who call “Jonadab the son of Rechab our father” ([[Jer. 35:6]]). The heading in the Church’s edition also speaks of David. The psalm itself names no one.

  What the psalm does show is its speaker. He is old, or nearly so (verses 9 and 18). He has trusted God since his youth and has spent his life telling what God has done (verses 5 and 17). And he has enemies who take his weakness as proof that God has left him (verses 10–11). He prays as one man in trouble, in the form set out at [[Ps. 22:1]], and largely in the words of older psalms; the note on verse 1 says which.

thread: |
  Psalm 71 is a prayer about **a whole life and its last stretch**. The speaker measures his trust by his age. God brought him from the womb (verse 6), has been his trust and his teacher “from my youth” (verses 5 and 17), and is now asked to stay through old age and gray hair (verses 9 and 18). One request is made twice, “forsake me not,” and between the two his enemies say that God already has (verse 11).

  The reason he gives for wanting more time is his work: “until I have shewed thy strength unto this generation” (verse 18). He has told of God’s deeds all his life, and the psalm is full of mouth, lips and tongue. What he tells is God’s “righteousness,” named five times. One Hebrew word, “continually,” comes three times: he will come to God continually (verse 3), praise continually (verse 6), hope continually (verse 14).

  The turn is at verse 14, “But I will hope continually.” After it there is one more plea, and then the verbs look ahead: “shalt quicken me,” “shalt bring me up,” “I will also praise thee.” The psalm began “let me never be put to confusion,” asks in the middle that his enemies be “confounded,” and ends by saying that they “are confounded”: one Hebrew verb in all three places. The last line speaks of what he hopes for “as though it had already taken place.” The psalm does not say that it has.

sections:
  - range: 1-4
    heading: A rock to come to
    plain: |
      In You, LORD, I take refuge; let me never be put to shame. In Your righteousness deliver me and rescue me; turn Your ear to me and save me. Be to me a rock to live in, where I can always come. You have given the command to save me, for You are my rock and my fortress. My God, rescue me from the hand of the wicked, from the grip of the unjust and cruel.
  - range: 5-8
    heading: From the womb
    plain: |
      For You are my hope, Lord GOD, my trust since my youth. I have leaned on You since birth; it was You who took me from my mother’s womb; my praise is always of You. I have become a sign to many, but You are my strong refuge. Let my mouth be filled with Your praise and Your glory all day long.
  - range: 9-13
    heading: Not now, in old age
    plain: |
      Do not throw me aside in old age; do not leave me when my strength is spent. For my enemies talk about me, and those who watch for my life plot together. They say, “God has left him. Chase him and seize him, for no one will rescue him.” O God, do not be far from me; my God, hurry to help me. Let those who accuse me be shamed and come to an end; let those who seek my harm be covered with scorn and disgrace.
  - range: 14-18
    heading: Until I have told it
    plain: |
      But I will go on hoping, and add to all Your praise. My mouth will tell of Your righteousness and Your salvation all day long, though they are more than I can count. I will come with the mighty deeds of the Lord GOD; I will speak of Your righteousness, Yours alone. O God, You have taught me since my youth, and to this day I declare Your wonders. So now that I am old and gray, O God, do not leave me, until I have told of Your arm to the next generation, of Your might to all who are to come.
  - range: 19-21
    heading: Who is like unto thee?
    plain: |
      Your righteousness, O God, reaches the heights. You have done great things; O God, who is like You? You have made me see many hard troubles, and You will give me life again; from the depths of the earth You will bring me up again. You will add to my greatness, and surround me with comfort.
  - range: 22-24
    heading: Harp, lips and tongue
    plain: |
      And I will praise You with the harp for Your faithfulness, my God; I will sing to You with the lyre, Holy One of Israel. My lips will shout for joy when I sing to You, and so will my soul, which You have redeemed. All day long my tongue will speak of Your righteousness, for those who sought my harm are shamed and disgraced.

notes:
  - ref: 1
    phrase: In thee, O LORD, do I put my trust
    kind: scripture
    title: A prayer made of older psalms
    body: |
      Most of this psalm’s opening, and many lines after it, are lines the Psalter already has. Verses 1–3 are the first three verses of Psalm 31, which begins “In thee, O LORD, do I put my trust; let me never be ashamed: deliver me in thy righteousness” ([[Ps. 31:1]]). Verses 5–6 rework the trust from the womb of [[Ps. 22:9–10]]. Verse 12 joins two pleas that Psalms 22, 35, 38 and 40 make, “be not far from me” ([[Ps. 35:22]]) and “make haste to help me” ([[Ps. 40:13]]). The last verse is very nearly the last verse of Psalm 35: “And my tongue shall speak of thy righteousness and of thy praise all the day long” ([[Ps. 35:28]]).

      Why would a psalm be built this way? One older reading is that the language of the older psalms has “become the mental property, so to speak, of the author, and is revived in him by experiences of a similar character.” On that reading the borrowing fits the speaker. A man taught from his youth (verse 17) prays in old age in the words he has prayed all his life. He does not only repeat them, and the notes on verses 3 and 6 show two places where he changes a word.

      The wishes against his enemies in verses 13 and 24 come with the borrowed lines. They are requests made to God, like those of [[Ps. 35:4]]; how such prayers are read is the note at [[Ps. 137:8]].
    sources: [delitzsch-psalms, lds-scriptures]

  - ref: 3
    phrase: Be thou my strong habitation
    kind: words
    title: A rock to live in
    body: |
      The psalm changes the line it borrows: Psalm 31 asks for a strong rock, and this psalm asks for a rock to live in. Psalm 31 has “be thou my strong rock, for an house of defence to save me” ([[Ps. 31:2]]). Its Hebrew word after “rock” is *ma‘oz*. Here the word is *ma‘on*, one letter different, which the King James translates “habitation.”

      The words that follow differ as well. The Hebrew reads, as a modern translation’s note gives it, “to come continually you have commanded.” The King James makes of this “whereunto I may continually resort: thou hast given commandment to save me.” The Greek translation has “a strong hold to save me” instead, close to Psalm 31, and the modern translation follows the Greek: “Be to me a rock of refuge.” Translators divide over whether to keep the Hebrew as it stands or to follow the Greek.

      As the Hebrew stands, he asks for more than a place to run to once. He asks for a place to live and to come to “continually,” the first of the psalm’s three uses of that word. What the rock and the fortress are is explained at [[Ps. 18:2]], and why he asks God to be what he says God already is, at [[Ps. 31:2]].
    sources: [oshb-wlc, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 6
    phrase: thou art he that took me out of my mother’s bowels
    kind: words
    title: Cut from the womb
    body: |
      The line says that God Himself delivered him at birth, though its Hebrew verb is rare and the ancient translations read it otherwise. It reworks “thou art he that took me out of the womb” ([[Ps. 22:9]]) with a different verb. The root of this one means to “cut, (cut off, sever),” which gives the picture of a child cut loose from his mother.

      The Greek translation has “thou art my protector” instead. A modern translation follows the Greek and Jerome, “my protector since my mother’s womb,” and gives the Hebrew in a note. The first half of the verse is plainer in that translation than in the King James: “By thee have I been holden up” is “I have leaned upon you.”

      On either reading the verse carries the claim of verse 5 further back: “from my youth” becomes “from the womb.” The plea comes three verses later, that the God who has held him up since birth not cast him off in old age.
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, lds-scriptures]

  - ref: 7
    phrase: I am as a wonder unto many
    kind: words
    title: A sign to many
    body: |
      “Wonder” here is the word for a sign or portent, and the verse does not say whether the many who look at him see a blessing or a warning. The Hebrew *mopheth* is a “wonder, sign, portent.” Its four other uses in the Psalms are of God’s own wonders, three of them the signs done in Egypt ([[Ps. 78:43]]; [[Ps. 105:27]]; [[Ps. 135:9]]).

      The word can point either way. This verse has been classed as said of “one protected by” the LORD, and one older reading agrees: “Brought safely through dangers of every kind,” he has become “a wonder, a miracle” to those who have watched. But the same word is used of the curses that would lie on a disobedient Israel “for a sign and for a wonder” ([[Deut. 28:46]]), and a modern translation’s “portent” leaves that darker sense open.

      Whichever the many see, the second half of the verse says what he holds to: “but thou art my strong refuge.”
    sources: [oshb-wlc, bdb, delitzsch-psalms, nrsvue, lds-scriptures]

  - ref: 9
    phrase: Cast me not off in the time of old age
    kind: prophets
    title: President Benson repeats the plea
    body: |
      President Ezra Taft Benson repeated this verse in general conference when he turned to the families of the old. In the psalm it is a prayer to God. In an address to the elderly of the Church, he repeated it at the point where he began to “speak to the families of the elderly,” and went on: “We encourage families to give their elderly parents and grandparents the love, care, and attention they deserve.”

      The psalm’s own fear is narrower. The speaker’s strength is failing (the second half of the verse), and the next two verses say what his enemies make of that.
    sources: [benson-elderly]

  - ref: 11
    phrase: God hath forsaken him
    kind: words
    title: The enemies say he is forsaken
    body: |
      The psalm uses one Hebrew verb for “forsake” three times, and the middle time it is in the enemies’ mouths. He asks, “forsake me not when my strength faileth” (verse 9). They say, “God hath forsaken him” (verse 11). He asks again, “O God, forsake me not” (verse 18).

      The enemies reason from what they can see. An old man whose strength is going has, they conclude, no one to deliver him, and so he can be chased down and taken. His prayer stands on both sides of their saying and asks God to make it false.

      The verb is that of the first line of Psalm 22, “why hast thou forsaken me?” ([[Ps. 22:1]]), a psalm this one draws on. There the sufferer says it of himself. Here he never says that God has forsaken him: he leaves that to his enemies and asks only that it not come true. The mockers of Psalm 22 argue in the same way, from a man’s trouble to God’s absence; see the note on [[Ps. 22:8]].
    sources: [oshb-wlc, lds-scriptures]

  - ref: 16
    phrase: I will go in the strength of the Lord GOD
    kind: words
    title: Coming with the mighty deeds
    body: |
      The Hebrew noun is plural, “mighty deeds,” so the line is less about being made strong than about what he comes to tell. A modern translation has “I will come praising the mighty deeds.” The same noun in the singular is “thy power” in verse 18, where it is plainly something he declares. The King James wording can be heard as a promise that the Lord will strengthen him, and the Hebrew does not rule that out, but the lines on either side are all about telling: “My mouth shall shew forth thy righteousness,” “I will make mention of thy righteousness, even of thine only.”

      The clause that ends verse 15, “for I know not the numbers thereof,” belongs with this. The numbers are those of God’s saving acts: “they are innumerable,” or in a modern rendering, “though their number is past my knowledge.” Another psalm says the same of God’s works: “they are more than can be numbered” ([[Ps. 40:5]]). He will spend all day telling what he cannot count.

      “Righteousness” in these lines is something God does. Verse 2 asks to be delivered by it, verse 15 pairs it with salvation, and the modern translation renders it there “your righteous acts.”
    sources: [oshb-wlc, nrsvue, bdb, lds-scriptures]

  - ref: 18
    phrase: Now also when I am old and grayheaded
    kind: scripture
    title: Old age and gray hair
    body: |
      He asks to be kept until he has told the next generation, and the two words he uses for his age are the two in which Isaiah has the LORD promise to carry His people. The reason for the plea is in the verse: “until I have shewed thy strength unto this generation.” “Strength” is in Hebrew “arm,” as the Greek translates it. “This generation” is in Hebrew simply “a generation,” and the parallel line, “every one that is to come,” suggests that he means the rising one. He has declared God’s works “hitherto” (verse 17), and he asks for time to finish. Psalm 22 ends on the same hope, that God’s righteousness will be declared “unto a people that shall be born” ([[Ps. 22:31]]).

      “Old and grayheaded” translates two Hebrew nouns, old age and gray hair. The same two, in the same order, stand in Isaiah: “And even to your old age I am he; and even to hoar hairs will I carry you” ([[Isa. 46:4]]). The LORD says it to a people “borne by me from the belly” ([[Isa. 46:3]]), and a modern translation’s cross-references send the reader of verse 6 there. The psalm and the oracle cover the same span, from the womb to gray hair. In the psalm one man asks; in Isaiah the LORD promises it to all Israel. The shared words are in the text, and no source read here says that either passage has the other in view. See the note on [[Isa. 46:4]].
    sources: [oshb-wlc, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 20
    phrase: shalt quicken me again
    kind: words
    title: Brought up from the depths
    body: |
      To “quicken” is to make alive, and the verse speaks of rescue from the edge of death as a coming up out of the earth. A modern translation has “will revive me again.” On one reading the depths, like “the gates of death” in another psalm, are “a figure of extreme perils and dangers”: the speaker is alive, and has been as good as buried. The psalm says no more than that about what lies beyond death. What the Psalms mean by the grave is the note at [[Ps. 6:5]].

      The Hebrew has a detail the King James does not show. The consonants as written (the *ketiv*) have “us” on the first two verbs, shewed and quicken. The reading handed down beside them (the *qere*) is “me,” and the King James follows it. The third verb, “bring me up,” is “me” in both. With “us,” the old man counts his troubles among his people’s; one reading takes him to mean what he has “experienced in common with others in the history of his own nation.”

      “The depths of the earth” is also one of the phrases that a Latter-day Saint study lists as shared by the Psalms and the Book of Mormon and found nowhere else in scripture. There the wicked are “buried up in the depths of the earth” ([[3 Ne. 9:6]]), and three disciples cast into the earth are, “by his power,” “delivered out of the depths of the earth” ([[3 Ne. 28:20]]). The study counts such phrases as allusions to the Psalms.
    sources: [nrsvue, oshb-wlc, delitzsch-psalms, hilton-psalms-bom, lds-scriptures]

  - ref: 22
    phrase: O thou Holy One of Israel
    kind: christ
    title: The Holy One of Israel
    body: |
      The last name the psalm gives to God is a title of Jesus Christ. It is a “name for the Savior used 34 times in the Old Testament, most frequently by Isaiah,” and it comes only three times in the Psalms: here, at [[Ps. 78:41]], and at [[Ps. 89:18]]. The title is frequent in the Book of Mormon, and Nephi says outright whose name it is: “Christ is the Holy One of Israel” ([[2 Ne. 25:29]]). For Isaiah’s use of the title, see the note on [[Isa. 12:6]].
    sources: [bd-holy-one, lds-scriptures]

christ: |
  The psalm names the one it prays to: “O thou Holy One of Israel” (verse 22), the title that Nephi gives to Christ (see the note on that verse).

  Read with that name, the psalm is a lifetime’s account of what the Savior has been to one person. He upheld him from the womb, taught him from his youth, and is trusted to give him life again and bring him up from the depths. The old man already speaks of “my soul, which thou hast redeemed” (verse 23), and what he asks for his last years is time to tell of it.

explore: |
  - **The psalms it is made from.** [[Ps. 31:1–3]], [[Ps. 22:9–11]], [[Ps. 40:13–14]] and [[Ps. 35:26–28]], read beside verses 1–3, 5–6, 12–13 and 24.
  - **Carried to gray hairs.** [[Isa. 46:3–4]], where the LORD promises Israel what this psalm asks for one man.
  - **Another old man’s witness.** [[Ps. 37:25]], “I have been young, and now am old.”
  - **Its neighbors.** [[Ps. 70]], the short plea before it, and [[Ps. 72]], the prayer for the king’s son that follows it.

parallels:
  - ref: Ps. 31:1–3
    note: The first three verses of the psalm, nearly word for word.
  - ref: Ps. 22:9–10
    note: Trust that began at the womb, reworked in verses 5–6.
  - ref: Ps. 35:28
    note: The tongue that speaks of God’s righteousness all the day long, as in verse 24.
  - ref: Isa. 46:3–4
    note: The LORD carries His people from the womb to old age and gray hair, the two words of verse 18.
  - ref: 2 Ne. 25:29
    note: Nephi says that Christ is the Holy One of Israel, the title of verse 22.

