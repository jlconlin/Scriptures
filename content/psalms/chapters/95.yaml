chapter: 95
title: To Day If Ye Will Hear His Voice
tagline: Worshippers call one another to sing and then to kneel before the King who made the world, and on their knees they hear His voice warn them not to be what their fathers were at Meribah.
when: 'No title; Hebrews quotes it as spoken “in David”'

setting: |
  Psalm 95 has no title in the King James. The ancient Greek translation heads it “The praise of a Song by David,” and Hebrews quotes it as what God says “in David” ([[Heb. 4:7]]). Nothing in its eleven verses names an occasion.

  On one older reading it is “the first of a group of Psalms (95–100)” made for worship, with [[Ps. 93]] as their “prelude.”

  It has two parts: a call to worship (verses 1–7) and a warning in God’s own voice (verses 8–11). It has “much in common” with [[Ps. 81]], which also remembers Meribah. Later scripture preaches from the second part. Hebrews 3–4 expounds it at length, Jacob and Alma take it up in the Book of Mormon, and a revelation to Joseph Smith says what its last word means ([[D&C 84:24]]).

thread: |
  Psalm 95 is **an invitation with a warning inside it**. Twice the singers call one another forward, “O come,” and each call is followed by “For” and a reason. The first call is loud (sing, make a joyful noise), and its reason is the world: the LORD is King above all gods, and the depths, the peaks, the sea and the land are His. The second call is low (bow down, kneel), and its reason is nearer: “he is our God; and we are the people of his pasture.”

  Then, in the middle of verse 7, the psalm turns. “To day if ye will hear his voice” breaks in, and the voice itself follows. From verse 8 God speaks, and He speaks about the flock He led before this one: the fathers at Meribah and Massah, who had seen His work and still put Him to the proof, the forty years, and the oath that shut them out of His rest.

  The psalm ends there. It does not return to praise, and no comfort follows the oath. The last thing the kneeling worshippers hear is what became of a people who were His flock and would not listen. The fathers had their day in the wilderness. The singers, who have just called themselves His sheep, are told that theirs is “To day.”

sections:
  - range: 1-2
    heading: Come, let us sing
    plain: |
      Come, let us sing to the LORD; let us make a joyful noise to the Rock who saves us. Let us come before Him with thanksgiving and make a joyful noise to Him with songs.
  - range: 3-5
    heading: A great King above all gods
    plain: |
      For the LORD is a great God, a great King above all gods. The depths of the earth are in His hand, and the heights of the mountains are His. The sea is His, because He made it, and His hands formed the dry land.
  - range: 6-7
    heading: Come, let us kneel
    plain: |
      Come, let us worship and bow down; let us kneel before the LORD who made us. For He is our God, and we are the people He pastures, the flock in His hand. Today, if you will hear His voice,
  - range: 8-11
    heading: Harden not your heart
    plain: |
      Do not harden your hearts as at Meribah, as on the day of Massah in the wilderness, when your fathers tested Me and put Me to the proof, though they had seen what I did. For forty years I loathed that generation, and I said, “They are a people whose hearts go astray; they have not known My ways.” So I swore in My anger that they would not enter My rest.

notes:
  - ref: 3
    phrase: a great King above all gods
    kind: scripture
    title: Whether the psalm grants other gods
    body: |
      The psalm measures the LORD against “all gods” without saying what they are; the next psalm calls them idols. It makes the same comparison, “he is to be feared above all gods” ([[Ps. 96:4]]), and then gives its verdict: “For all the gods of the nations are idols: but the LORD made the heavens” ([[Ps. 96:5]]). This psalm gives the same reason in verse 5: the sea is His because He made it, and His hands formed the dry land.

      The heavenly council, and who stands in it, is taken up at [[Ps. 82:1]].
    sources: [lds-scriptures]

  - ref: 4
    phrase: the strength of the hills is his also
    kind: words
    title: Depths and peaks, sea and land
    body: |
      The King James “strength of the hills” means the mountain peaks. A modern translation has “the depths of the earth” in the first half of the line and “the heights of the mountains” in the second. So verse 4 names the lowest places and the highest, and verse 5 the sea and the dry land. Between them the two verses claim the whole world for the LORD.
    sources: [nrsvue]

  - ref: 6
    phrase: 'let us worship and bow down: let us kneel'
    kind: history
    title: Where the worshippers are standing
    body: |
      The psalm does not say where its worshippers are, and it has been read as a hymn for the temple. In the first call they “come before his presence” (verse 2), and in the second they kneel “before the LORD our maker.” It has been described as “sung when worshippers journeyed to Jerusalem,” and as “preparing worshippers to enter into God’s presence.” No title or narrative confirms that setting.
    sources: [sc-knowhy-62, hilton-psalms-bom]

  - ref: 7
    phrase: To day if ye will hear his voice
    kind: structure
    title: The turn, from the singers’ call to God’s own voice
    body: |
      In the middle of this verse the singers stop calling one another to worship, and by verse 9 the speaker is God: “your fathers tempted me, proved me.” The clause between the two still says “his voice.”

      The King James, like the ancient Greek translation, makes the clause the condition of verse 8 (if you hear, do not harden), and Hebrews and Jacob quote it so ([[Heb. 3:7–8]]; [[Jacob 6:6]]). The Hebrew word for “if” can also voice a wish, and on one reading, which a modern translation follows, the sentence ends here: “O that today you would listen to his voice!” “Hear” is more than listening. The Hebrew idiom means “to hear obediently.”

      “To day” stands first in the clause, and on one older reading that “gives prominence to the present, in which this call to obedience goes forth, as a decisive turning-point.” The fathers’ day was “the day of temptation in the wilderness” (verse 8). The singers’ day is this one. Hebrews rests its exhortation on the word: “exhort one another daily, while it is called To day” ([[Heb. 3:13]]).
    sources: [lds-scriptures, lxx-rahlfs, nrsvue, cambridge-psalms, delitzsch-psalms]

  - ref: 8
    phrase: Harden not your heart
    kind: scripture
    title: Jacob and Alma take up the warning
    body: |
      Two Book of Mormon prophets preach from these verses, and both join the warning to the way into the Lord’s rest through Christ. Jacob opens his book with the psalm’s ending. He labored to persuade his people “to come unto Christ, and partake of the goodness of God, that they might enter into his rest, lest by any means he should swear in his wrath they should not enter in, as in the provocation in the days of temptation while the children of Israel were in the wilderness” ([[Jacob 1:7]]). He closes with the psalm’s turn: “Yea, today, if ye will hear his voice, harden not your hearts; for why will ye die?” ([[Jacob 6:6]]).

      The two are adjoining phrases of the psalm, taken in reverse order. Jacob was a consecrated priest and teacher, and among people who knew the psalms an allusion of this kind “would have effectively brought to mind all the rest of the words of that psalm.” Whether the psalm stood on the plates of brass is not known; it “may have been” there.

      Alma sets a promise beside the oath. The Lord promises that “whosoever repenteth, and hardeneth not his heart, he shall have claim on mercy through mine Only Begotten Son, unto a remission of his sins; and these shall enter into my rest” ([[Alma 12:34]]), and then that “whosoever will harden his heart and will do iniquity, behold, I swear in my wrath that he shall not enter into my rest” ([[Alma 12:35]]). The psalm states only the oath.

      [The People Forget; God Remembers](/psalms/themes/forget-and-remember/) follows the warning not to harden the heart from the wilderness stories of Psalms 78 and 106 to Hebrews.
    sources: [lds-scriptures, hilton-psalms-bom, sc-knowhy-62]

  - ref: 8
    phrase: as in the provocation, and as in the day of temptation in the wilderness
    kind: history
    title: Meribah and Massah, and what the test was
    body: |
      “Provocation” and “temptation” are place names in the Hebrew, Meribah and Massah, the two names given to the place where Israel demanded water. The story and the names are explained at [[Ps. 81:7]]. The ancient Greek translation turned the names into common nouns, “as in the provocation, according to the day of irritation in the wilderness,” and Hebrews quotes the psalm in that form ([[Heb. 3:8]]).

      What the fathers did there is told with the naming of the place: “they tempted the LORD, saying, Is the LORD among us, or not?” ([[Ex. 17:7]]). A modern translation of verse 9 has God say that they “put me to the proof, though they had seen my work.” The demand came “after the miraculous Passover, after their passage through the Red Sea dry shod, and after the outpouring of manna and quail from heaven.” The law later forbade the thing by this place’s name: “Ye shall not tempt the LORD your God, as ye tempted him in Massah” ([[Deut. 6:16]]).

      The psalm then passes from that one day to forty years. When the forty-year sentence is pronounced, the LORD says the people “have tempted me now these ten times, and have not hearkened to my voice” ([[Num. 14:22]]). On one Latter-day Saint reading, the provocation “refers not only to the specific incident at Meribah but to a persistent behavior of the children of Israel.”
    sources: [lds-scriptures, lxx-rahlfs, nrsvue, thomas-provocation]

  - ref: 11
    phrase: Unto whom I sware in my wrath
    kind: scripture
    title: The rest was the land, and Hebrews says it was more
    body: |
      In the wilderness story the “rest” is the promised land, and Hebrews argues from this psalm that the land did not exhaust it. The LORD’s oath is in Numbers: “Surely they shall not see the land which I sware unto their fathers” ([[Num. 14:23]]). Moses calls the land by the psalm’s word, a noun that means “resting-place”: “ye are not as yet come to the rest and to the inheritance” ([[Deut. 12:9]]). Another psalm uses the word of Zion, where the LORD says, “This is my rest for ever: here will I dwell” ([[Ps. 132:14]]).

      Hebrews quotes the whole warning ([[Heb. 3:7–11]]) and reasons from when the psalm was sung. Long after Joshua, God “limiteth a certain day, saying in David, To day, after so long a time” ([[Heb. 4:7]]). If the land had been all that was meant, the psalm would have nothing left to offer: “For if Jesus had given them rest, then would he not afterward have spoken of another day” ([[Heb. 4:8]]). “Jesus” there is Joshua, as a modern translation prints it. The conclusion follows: “There remaineth therefore a rest to the people of God” ([[Heb. 4:9]]).

      Hebrews also names what kept the fathers out: “they could not enter in because of unbelief” ([[Heb. 3:19]]).
    sources: [lds-scriptures, bdb, nrsvue]

  - ref: 11
    phrase: my rest
    kind: scripture
    title: Modern revelation says what the rest is
    body: |
      A revelation to Joseph Smith retells this oath and says what its last word means: the rest is “the fulness of his glory.” Moses “sought diligently to sanctify his people that they might behold the face of God” ([[D&C 84:23]]). “But they hardened their hearts and could not endure his presence; therefore, the Lord in his wrath, for his anger was kindled against them, swore that they should not enter into his rest while in the wilderness, which rest is the fulness of his glory” ([[D&C 84:24]]). Joseph Smith’s revision of Exodus sets the same two words side by side: “I have sworn in my wrath, that they shall not enter into my presence, into my rest, in the days of their pilgrimage” (Joseph Smith Translation, Exodus 34:2).

      Both passages also put a limit on the oath that the psalm does not state: “while in the wilderness,” and “in the days of their pilgrimage.”
    sources: [lds-scriptures]

christ: |
  Paul names the LORD whom the fathers tested in the wilderness. Israel “drank of that spiritual Rock that followed them: and that Rock was Christ” ([[1 Cor. 10:4]]), and Paul warns his own readers out of the same story: “Neither let us tempt Christ, as some of them also tempted” ([[1 Cor. 10:9]]). The heading to that chapter in the Church’s edition says it in a line: “Christ is the God of Israel and the spiritual Rock that guided them.”

  Hebrews and Jacob preach the psalm as a call to Him. Hebrews sets its “To day” beside the words “we are made partakers of Christ, if we hold the beginning of our confidence steadfast unto the end” ([[Heb. 3:14]]). Jacob’s first use of the psalm begins with persuading his people “to come unto Christ.”

explore: |
  - **Hebrews on the psalm.** Read [[Heb. 3:7–19]] and [[Heb. 4:1–11]] with verses 7–11 open; the two chapters work through “To day,” the oath and the rest phrase by phrase.
  - **The two days in the wilderness.** [[Ex. 17:1–7]] for Massah and Meribah, and [[Num. 14:20–35]] for the oath and the forty years.
  - **A psalm with much in common.** [[Ps. 81]], where Meribah comes at verse 7.
  - **The flock again.** [[Ps. 100:3]], “we are his people, and the sheep of his pasture,” in a psalm that has the call to worship without the warning. The shepherd and his flock are treated at [[Ps. 23:1]].
  - **The rest of the Lord in Alma.** [[Alma 12:33–37]] and [[Alma 13:12–16]], where many “were made pure and entered into the rest of the Lord their God.”
  - **“I will give you rest.”** [[Matt. 11:28–30]].
  - **A Latter-day Saint study of what Israel refused.** M. Catherine Thomas, “The Provocation in the Wilderness and the Rejection of Grace,” in *Sperry Symposium Classics: The Old Testament* (2005).

parallels:
  - ref: Heb. 3:7–11
    note: Verses 7–11 are quoted as what “the Holy Ghost saith” and then expounded through Hebrews 4:11.
  - ref: Heb. 4:7
    note: “To day” is quoted as spoken “in David,” long after Joshua, to show that a rest remains.
  - ref: Jacob 1:7
    note: Jacob labors that his people might enter the Lord’s rest and not provoke Him “as in the provocation in the days of temptation.”
  - ref: Jacob 6:6
    note: “Yea, today, if ye will hear his voice, harden not your hearts.”
  - ref: Alma 12:35
    note: The oath, with its promise beside it in verse 34.
  - ref: D&C 84:24
    note: The oath retold, with the rest explained as “the fulness of his glory.”
  - ref: Ex. 17:7
    note: The place named Massah and Meribah because Israel tempted the LORD.
  - ref: Ps. 81:7
    note: The same place, told as the LORD’s test of Israel.

