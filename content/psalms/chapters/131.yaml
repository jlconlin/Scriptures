chapter: 131
title: As a Weaned Child
tagline: A speaker disowns pride of heart, eye and reach, says he has stilled his own soul like a weaned child with its mother, and tells Israel to hope.
when: 'By its title, David’s; the psalm names no occasion'

setting: |
  Psalm 131 is one of the songs of degrees (the note on the title at [[Ps. 120:1]] explains the name), and its title ascribes it to David. It is three verses long.

  A reader may wonder how a king can say he does not occupy himself with great matters. One older reading hears in the psalm “an echo of the answer” David gave Michal, who despised him when she saw him dancing as the ark came into the city ([[2 Sam. 6:16]]): “And I will yet be more vile than thus, and will be base in mine own sight” ([[2 Sam. 6:22]]). On that reading David is “the model of the state of mind which the poet expresses here,” and the poet is a later one, holding David up “to the Israel of the period after the Exile.” That is one reading. The title says David, and the psalm does not date itself.

  It stands directly after Psalm 130, and its last verse takes up that psalm’s call: “Let Israel hope in the LORD” ([[Ps. 130:7]]).

thread: |
  Psalm 131 moves **from three things the speaker is not, to one picture of what he is, to a word for the whole people.**

  Verse 1 is all denial. His heart is not haughty, his eyes are not lofty, and he does not busy himself with what is beyond him. On one older reading the three go inward to outward, and what he gives up is overreach and not effort, since the opposite of the too-wonderful “is not that which is trivial, but that which is attainable.”

  In verse 2 he does not say he was born quiet. He says he quieted himself, and then gives the psalm’s one image, the weaned child with its mother. The notes on verse 2 take up the verbs and the image.

  Verse 3 turns outward. A psalm that has said “I” and “my” in every line ends with “Israel.” The call is to hope, and the hope is given no end: “from henceforth and for ever.”

sections:
  - range: 1
    heading: Not haughty, not lofty
    plain: |
      LORD, my heart is not proud and my eyes are not raised high. I have not busied myself with great things, or with things too wonderful for me.
  - range: 2
    heading: A soul made still
    plain: |
      Surely I have levelled and stilled my soul. Like a weaned child with its mother, like that weaned child, is my soul with me.
  - range: 3
    heading: Let Israel hope
    plain: |
      Israel, hope in the LORD, from now on and for ever.

notes:
  - ref: 1
    phrase: things too high for me
    kind: scripture
    title: What he does not reach for
    body: |
      The “things too high” are things beyond the speaker’s understanding. A modern translation has “too great and too marvelous for me,” and for “exercise myself” it has “occupy myself.” The Hebrew word means “too difficult for” a person to understand, and Job uses it of himself after the LORD has answered him: “therefore have I uttered that I understood not; things too wonderful for me, which I knew not” ([[Job 42:3]]).
    sources: [bdb, nrsvue, lds-scriptures]

  - ref: 2
    phrase: I have behaved and quieted myself
    kind: words
    title: A soul levelled and made still
    body: |
      “Behaved” here does not mean good conduct. The speaker says he has composed his own soul: more literally the clause is “I have smoothed (composed) and stilled my soul,” and a modern translation has “I have calmed and quieted my soul.”

      The first verb is used of levelling ground. Isaiah’s ploughman does it before he sows: “When he hath made plain the face thereof” ([[Isa. 28:25]]).
    sources: [bdb, nrsvue, lds-scriptures]

  - ref: 2
    phrase: as a child that is weaned of his mother
    kind: symbol
    title: Why a weaned child
    body: |
      A weaned child has finished nursing, and on one older reading that is the picture: a child with its mother who no longer cries for the breast. The Hebrew verb means to “wean a child (complete his nursing).” Abraham “made a great feast the same day that Isaac was weaned” ([[Gen. 21:8]]), and Hannah kept Samuel at home “until the child be weaned” ([[1 Sam. 1:22]]) and then took him to the house of the LORD to stay.

      On that reading this is not an infant asleep after feeding: the child is “not one that is only just begun to be weaned, but an actually weaned child,” who lies on its mother “without crying impatiently and craving for its mother’s breast, but contented with the fact that it has its mother.” Read so, the image says what the stilled soul wants. It “does not long after earthly enjoyment and earthly good that God should give these to it, but it is satisfied in the fellowship of God.” The psalm gives the picture and does not explain it, so this is a reading.

      The last clause is translated two ways. A modern translation prints “my soul is like the weaned child that is with me,” which keeps a child in the scene, and gives in its footnote “my soul within me is like a weaned child,” which makes the soul the child.
    sources: [bdb, delitzsch-psalms, nrsvue, lds-scriptures]

  - ref: 2
    phrase: my soul is even as a weaned child
    kind: scripture
    title: Humbled as a little child
    body: |
      The Savior taught that entering His kingdom requires becoming as a little child, and a modern translation sets His saying beside this verse. He “called a little child unto him, and set him in the midst of them” ([[Matt. 18:2]]), and said, “Except ye be converted, and become as little children, ye shall not enter into the kingdom of heaven” ([[Matt. 18:3]]). He then named the quality He meant: “Whosoever therefore shall humble himself as this little child, the same is greatest in the kingdom of heaven” ([[Matt. 18:4]]).
    sources: [nrsvue, lds-scriptures]

christ: |
  The LORD in whom Israel is told to hope is Jehovah, who is Jesus Christ before His birth ([[Ps. 110:1]] has the note). The psalm says one thing of Him, and says it in its last verse: He may be hoped in “from henceforth and for ever.”

  A modern translation sets beside the psalm’s child the Savior’s saying about becoming as little children. The note on verse 2, “Humbled as a little child,” has His words in Matthew 18.

explore: |
  - **The song before.** [[Ps. 130:7]], the call this psalm ends on, there with its reasons.
  - **The quiet soul.** [[Ps. 62:1]] and [[Lam. 3:26]], the soul that waits on God.
  - **David and Michal.** [[2 Sam. 6:16–22]], the scene one older reading hears behind the psalm.

parallels:
  - ref: Ps. 130:7
    note: “Let Israel hope in the LORD,” the call verse 3 repeats.
  - ref: Job 42:3
    note: Job’s “things too wonderful for me,” the phrase of verse 1.
  - ref: Matt. 18:3–4
    note: The Savior sets a little child before the disciples as the measure of humility.

sources: [lds-scriptures, bdb, nrsvue, delitzsch-psalms]
