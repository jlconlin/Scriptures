chapter: 98
title: The Salvation of Our God
tagline: A new song for a rescue the whole earth has watched; all the earth, then the sea and the rivers are called to shout before the LORD, the King, who comes to judge the world with righteousness.
when: 'Undated; the title is only “A Psalm,” and the psalm names no author or occasion'

setting: |
  This is the only psalm whose title is “A Psalm” and nothing more. The ancient Greek translation supplies a name: “A Psalm of David.” The psalm itself names no author and no occasion, and it does not say what the “marvellous things” of verse 1 were.

  It stands in the fourth of the Psalter’s five books (Psalms 90–106), among the psalms of praise, which call the congregation to worship and then give the reasons, among them the LORD’s reign as King (see [[Ps. 47:8]]). Many psalms of this part of the book “describe the millennial day.”

  Psalm 98 is a near twin of Psalm 96. Both open with “O sing unto the LORD a new song,” both call on the sea to roar, and both close with the LORD coming to judge the world with righteousness. One older reading holds that the beginning and end “are taken from” Psalm 96 and nearly all the middle from the later chapters of Isaiah. Which was written first is a judgment; the shared wording can be checked, and the note on verse 3 follows Isaiah’s.

thread: |
  Psalm 98 is three stanzas of three verses, and **the song widens with each: from what the LORD did for the house of Israel, to all the earth, to the sea and the rivers and the hills.** Two reasons frame it, each beginning with “for.” The first looks back: “for he hath done marvellous things” (verse 1). The last looks ahead: “for he cometh to judge the earth” (verse 9).

  The first stanza is the only one that tells of anything done. The LORD’s own hand and arm have won a rescue (the King James’s “victory” is the word for salvation; see the note on verse 1). He did it for the house of Israel, and in full view of the nations. That is why the song is new: the reason verse 1 gives for it is something God has done (on the new song, see the note on [[Ps. 33:3]]). It is also why the call can go beyond Israel. What “all the ends of the earth have seen” (verse 3), “all the earth” is told to shout about (verse 4).

  The second stanza is all sound: voices, harp, trumpets and horn. It ends on the one title the psalm gives Him, “the LORD, the King” (verse 6).

  The third stanza goes past humankind. The sea is to roar, the rivers to clap, the hills to sing, and only then does the psalm say what they are all facing: the King is coming as Judge. So the psalm turns from a salvation already seen to a judgment on its way, and verse 9 says of the judgment what verse 2 said of the salvation, that it is done in righteousness.

sections:
  - range: 1-3
    heading: What the LORD has done
    plain: |
      Sing a new song to the LORD, for He has done wonders. His own right hand and His holy arm have won Him the victory. The LORD has made His salvation known; He has uncovered His righteousness before the eyes of the nations. He has remembered His steadfast love and His faithfulness to the house of Israel. All the ends of the earth have seen the salvation of our God.
  - range: 4-6
    heading: All the earth before the King
    plain: |
      Shout to the LORD, all the earth; break out in song, sing for joy, and sing praises. Sing praises to the LORD with the harp, with the harp and the sound of melody. With trumpets and the blast of the horn, shout before the King, the LORD.
  - range: 7-9
    heading: The sea, the rivers and the hills before the Judge
    plain: |
      Let the sea thunder, and everything in it, the world and all who live in it. Let the rivers clap their hands; let the hills sing for joy together before the LORD, for He comes to judge the earth. He will judge the world with righteousness, and the peoples with equity.

notes:
  - ref: 1
    phrase: hath gotten him the victory
    kind: words
    title: Victory here is the word for salvation
    body: |
      The “victory” of verse 1 and the “salvation” of verses 2 and 3 are one idea in the psalm, and translators show it by choosing one English word for all three. The ancient Greek translation has that the hand and arm “have wrought salvation for him,” and keeps “salvation” in the next two verses. A modern translation goes the other way and prints “victory” three times. The verb in verse 1 is the ordinary Hebrew verb to “deliver,” which, used by itself, can mean to “gain victory.” So the first stanza says one thing three times over: He saved, He made the saving known, and the ends of the earth saw it.

      Twice in Isaiah the same verb says that the LORD’s arm brought salvation for Him. In both places He looks for someone to stand with Him and finds no one: “he saw that there was no man, and wondered that there was no intercessor: therefore his arm brought salvation unto him” ([[Isa. 59:16]]); “I looked, and there was none to help; and I wondered that there was none to uphold: therefore mine own arm brought salvation unto me” ([[Isa. 63:5]]). The psalm does not tell that story. But in its first stanza every deed is the LORD’s, and the nations and the ends of the earth only watch.
    sources: [bdb, lxx-rahlfs, nrsvue, lds-scriptures]
  - ref: 1
    phrase: his right hand, and his holy arm
    kind: scripture
    title: The right hand of the song at the sea
    body: |
      The saving right hand is the language of Israel’s first song, the one sung at the Red Sea, and the Church’s edition ties the word “hand” here to it: “Thy right hand, O LORD, is become glorious in power: thy right hand, O LORD, hath dashed in pieces the enemy” ([[Ex. 15:6]]). That song ends with the LORD’s kingship, “The LORD shall reign for ever and ever” ([[Ex. 15:18]]), and this psalm names Him King in verse 6.

      One older reading makes the link the key to the psalm. The new song is “not the song of Moses, but the counterpart” of it. The song at the sea was the first to sing of the LORD’s reign; this one sings “the final glory of the divine kingdom, which through judgment breaks through to its full reality.” The same reading compares John’s vision, where both are sung: “they sing the song of Moses the servant of God, and the song of the Lamb” ([[Rev. 15:3]]). That is an interpretation of the psalm’s place, and the psalm does not mention Egypt or the crossing.

      “His holy arm” is a phrase from Isaiah; see the note on verse 3.
    sources: [lds-scriptures, delitzsch-psalms]
  - ref: 3
    phrase: all the ends of the earth have seen the salvation of our God
    kind: scripture
    title: The same line in Isaiah, there a promise
    body: |
      The second half of verse 3 is the last line of a verse in Isaiah with one change: Isaiah says “shall see,” and the psalm says “have seen.” Isaiah’s verse reads, “The LORD hath made bare his holy arm in the eyes of all the nations; and all the ends of the earth shall see the salvation of our God” ([[Isa. 52:10]]). The rest of that verse is in the psalm as well: “his holy arm” in verse 1, and “in the sight of the heathen” in verse 2, which in Hebrew is Isaiah’s “in the eyes of all the nations” without the “all”; the King James wording hides the match.

      One older reading calls Isaiah’s verse “the primary passage,” the source the psalmist drew on. That is a judgment about which came first, and the text shows only the shared words.

      Later scripture keeps Isaiah’s future. Abinadi quotes Isaiah’s verse whole ([[Mosiah 15:31]]) and goes on, “The time shall come when all shall see the salvation of the Lord” ([[Mosiah 16:1]]). Modern revelation says of the Lord’s coming that “he shall make bare his holy arm in the eyes of all the nations, and all the ends of the earth shall see the salvation of their God” ([[D&C 133:3]]). The psalm says “have seen.” The Savior’s own quotation of the line is taken up in the note on [[Isa. 52:10]].
    sources: [oshb-wlc, delitzsch-psalms, lds-scriptures]
  - ref: 3
    phrase: He hath remembered his mercy and his truth toward the house of Israel
    kind: scripture
    title: Mercy remembered where the nations can see
    body: |
      What the nations watch in this psalm is the LORD keeping His word to one people. “His mercy and his truth” is in a modern translation “his steadfast love and faithfulness,” and “mercy” is the Hebrew word explained at [[Ps. 51:1]].

      The Church’s edition ties verse 2 to a place where such remembering is promised. In Leviticus the LORD says, “I will for their sakes remember the covenant of their ancestors, whom I brought forth out of the land of Egypt in the sight of the heathen, that I might be their God” ([[Lev. 26:45]]). There what He remembers is a covenant, and there too He has acted “in the sight of the heathen.” The “heathen” are simply the nations, as the ancient Greek and a modern translation print the word.

      Mary’s song has the same thought in nearly the same words. “He hath holpen his servant Israel, in remembrance of his mercy” ([[Luke 1:54]]), she says, “As he spake to our fathers, to Abraham, and to his seed for ever” ([[Luke 1:55]]); a modern translation cross-references the two verses.
    sources: [nrsvue, oshb-wlc, lxx-rahlfs, lds-scriptures]
  - ref: 6
    phrase: before the LORD, the King
    kind: history
    title: Shouting and trumpets before the King
    body: |
      The shout and the trumpets this psalm calls for are sounds that scripture also records when a king was acclaimed, and the psalm asks for them “before the LORD, the King.” “King” comes only this once in the psalm, at the end of the middle stanza.

      “Make a joyful noise” (verses 4 and 6) is a verb that means to “raise a shout” or to “give a blast with clarion or horn.” Among its uses are the war cry, the shout “in applause,” and the shout “in public worship with music and sacrifice,” under which both verses of this psalm are listed. The shout in applause is the one heard the day Saul was presented: “all the people shouted, and said, God save the king” ([[1 Sam. 10:24]]). When Solomon was anointed, “they blew the trumpet; and all the people said, God save king Solomon” ([[1 Kgs. 1:39]]). When the king’s son was crowned in Athaliah’s day, “they clapped their hands, and said, God save the king” ([[2 Kgs. 11:12]]), and “all the people of the land rejoiced, and blew with trumpets” ([[2 Kgs. 11:14]]). The psalm has the shout, the trumpets and, in verse 8, the clapping. It does not say that it was sung at any ceremony; the proposal that psalms like this one belonged to a festival of the LORD’s kingship is described at [[Ps. 47:8]].

      Two wind instruments are named. The ancient Greek distinguishes them as “trumpets of metal” and “a trumpet of horn,” and a modern translation calls the King James’s “cornet” simply “the horn.” On the horn see the note on [[Ps. 150:3]], and on the horn and the silver trumpets at Israel’s feasts, the note on [[Ps. 81:3]].
    sources: [bdb, lxx-rahlfs, nrsvue, hopkin-psalms-sung, lds-scriptures]
  - ref: 8
    phrase: Let the floods clap their hands
    kind: symbol
    title: The floods of Psalm 93 now applaud
    body: |
      The rivers that lifted up their voice five psalms earlier clap their hands here. “Floods” is the Hebrew word for rivers (the ancient Greek has “The rivers shall clap their hands together”), and they are the floods of “The floods have lifted up, O LORD, the floods have lifted up their voice; the floods lift up their waves” ([[Ps. 93:3]]); a modern translation cross-references the two verses. There the LORD is set above their noise: “The LORD on high is mightier than the noise of many waters” ([[Ps. 93:4]]). Here the noise of the waters is praise: the sea’s “roar” in verse 7 can be put “let the sea thunder,” in praise.

      Clapping and shouting are what another psalm asks of the peoples before God the King: “O clap your hands, all ye people; shout unto God with the voice of triumph” ([[Ps. 47:1]]). Here the rivers and the hills are asked for the same, and verse 9 gives the reason: “for he cometh to judge the earth.” Isaiah’s trees that clap their hands are taken up at [[Ps. 96:12]].
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, lds-scriptures]
  - ref: 9
    phrase: for he cometh to judge the earth
    kind: christ
    title: The Judge who comes
    body: |
      Scripture names the Judge whose coming ends the psalm: Jesus Christ. The Church’s edition ties “judge” in this verse to two passages. Of the prophet Moses foretold, Nephi says that he “was the Holy One of Israel; wherefore, he shall execute judgment in righteousness” ([[1 Ne. 22:21]]). The book of Moses names “Jesus Christ, a righteous Judge, who shall come in the meridian of time” ([[Moses 6:57]]). Psalm 96 ends with the same coming, and the note on [[Ps. 96:12]] takes up what the judging is and why the earth is glad of it.

      This psalm has already called Him King, and Isaiah sets the two titles side by side: “For the LORD is our judge, the LORD is our lawgiver, the LORD is our king; he will save us” ([[Isa. 33:22]]).
    sources: [lds-scriptures, bdb]

christ: |
  The LORD whom the psalm calls King and Judge is Jehovah, and Jehovah is Jesus Christ before His birth.

  The psalm’s first reason for singing is a salvation the ends of the earth have seen. The risen Savior quoted that line, in Isaiah’s wording, to the Nephites and added, “the Father and I are one” ([[3 Ne. 20:35]]); and modern revelation uses it of the day He comes again ([[D&C 133:3]]).

  Its second is a coming to judge, and the note on verse 9 has the passages that name Him the Judge.

explore: |
  - **The twin psalm.** Read [[Ps. 96:1–13]] beside this one, noticing what each has that the other lacks: Psalm 96 has the idols of the nations and the offering brought into His courts, and Psalm 98 has the hand and arm and the remembered covenant. The line about the roaring sea stands also in [[1 Chr. 16:32]].
  - **The song of Moses and the new song.** [[Ex. 15:1–18]], then [[Rev. 15:3–4]] and [[Rev. 5:9–10]], and the new song the Lord gives in [[D&C 84:98–102]].
  - **Creation called to praise its King.** [[Isa. 55:12]] and [[Isa. 44:23]], and the call to the mountains, seas and rivers to “tell the wonders of your Eternal King” ([[D&C 128:23]]).

parallels:
  - ref: Ps. 96:1
    note: The same opening call; Psalm 96 also has the roaring sea (96:11) and the same closing sentence but for its last word (96:13).
  - ref: Isa. 52:10
    note: The holy arm, the eyes of the nations, and the ends of the earth seeing the salvation of our God, there as a promise (“shall see”).
  - ref: Ex. 15:6
    note: The right hand of the LORD in the song at the sea (the Church’s footnote to verse 1).
  - ref: Isa. 59:16
    note: The LORD’s arm “brought salvation unto him,” the phrase of verse 1 (also Isa. 63:5).
  - ref: Lev. 26:45
    note: The covenant remembered “in the sight of the heathen” (the Church’s footnote to verse 2).
  - ref: Luke 1:54–55
    note: Mary sings that God has helped Israel “in remembrance of his mercy.”
  - ref: D&C 133:3
    note: The line of verse 3, in Isaiah’s future tense, used of the Lord’s coming.
  - ref: Ps. 93:3
    note: The floods that lifted up their voice; here they clap their hands.

