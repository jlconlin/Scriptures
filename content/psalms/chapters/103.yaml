chapter: 103
title: Forget Not All His Benefits
tagline: A man orders his own soul to bless the LORD, counts what he has been given, traces it to the words spoken to Moses at Sinai, and ends by calling the angels and all creation to join him.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  The title ascribes the psalm to David and names no occasion, and the psalm supplies none. It names no enemy, and from its first verse to its last it asks God for nothing.

  It follows a psalm of a very different mood. Psalm 102 is the prayer of an afflicted man who says, “I am withered like grass” ([[Ps. 102:11]]), and who looks for the LORD to “have mercy upon Zion” ([[Ps. 102:13]]). Psalm 103 has the grass and the mercy too, and is all praise.

  It is also paired with the psalm that comes after it. “Bless the LORD, O my soul” opens and closes this psalm and opens and closes [[Ps. 104]], and the sentence stands in no other psalm.

  The psalm looks back to Sinai. Verse 7 names Moses, and verse 8 repeats what the LORD proclaimed of Himself to him there ([[Ex. 34:6]]). Later scripture takes up its words in turn. In a revelation to Joseph Smith and Sidney Rigdon the Lord says verse 8 of Himself ([[D&C 76:5]]), and the Lectures on Faith quote verses 6–8 and 17–18 to show what kind of being God is.

thread: |
  Psalm 103 is **one man’s thanks, traced to its source and then handed to everyone**. It begins as small as a psalm can: a man speaking to himself. The benefits he counts in verses 3–5 are his own, and every “thy” in them is addressed to his own soul.

  At verse 6 the view widens to “all that are oppressed” and to Israel, and verse 8 turns from what the LORD does to what He is. The words are not the singer’s own. They are what the LORD said of Himself to Moses: “merciful and gracious, slow to anger, and plenteous in mercy.” The verses that follow stay with that sentence. His anger does not last (verse 9). He has not repaid “us” as our sins deserved (verse 10); the singer has stopped saying “thy” and now speaks for a people. Three measures follow: the height of heaven for the mercy, the distance from east to west for the removal of sin, and a father’s pity for the LORD’s own.

  Then the psalm says why God pities, and it is the turn of the whole. He “remembereth that we are dust.” In the psalm before this one, to wither like grass is the sufferer’s complaint ([[Ps. 102:11]]). Here man’s frailty is the reason given for God’s compassion, and verse 17 answers it with “But”: the grass is gone when the wind passes, and the mercy is “from everlasting to everlasting.”

  The last four verses carry the call upward to the throne, the angels, the hosts, all His works, and then back to where it started: “bless the LORD, O my soul.”

sections:
  - range: 1-5
    heading: Forget not all his benefits
    plain: |
      Bless the LORD, my soul; let everything in me bless His holy name. Bless the LORD, my soul, and do not forget any of what He has done for you. He forgives all your sins and heals all your sicknesses. He buys your life back from the pit and crowns you with lovingkindness and tender mercies. He fills you with good things, so that your youth comes back like the eagle’s.
  - range: 6-10
    heading: What He made known to Moses
    plain: |
      The LORD does what is right and gives justice to all who are oppressed. He showed Moses His ways and the children of Israel His deeds. The LORD is merciful and gracious, slow to anger and full of mercy. He will not accuse for ever or keep His anger for ever. He has not treated us as our sins deserve or paid us back for our iniquities.
  - range: 11-14
    heading: As high as heaven, as far as the east from the west
    plain: |
      As high as the heaven is above the earth, so great is His mercy toward those who fear Him. As far as the east is from the west, so far has He removed our transgressions from us. As a father pities his children, the LORD pities those who fear Him. He knows how we were formed; He remembers that we are dust.
  - range: 15-18
    heading: Grass, and a mercy that is everlasting
    plain: |
      A man’s days are like grass. He blooms like a flower of the field; the wind passes over the flower and it is gone, and its place does not know it any more. But the mercy of the LORD is from everlasting to everlasting on those who fear Him, and His righteousness reaches to their children’s children: to those who keep His covenant and remember His commandments and do them.
  - range: 19-22
    heading: Bless the LORD, all his works
    plain: |
      The LORD has set His throne in the heavens, and His kingdom rules over all. Bless the LORD, you His angels, mighty in strength, who do what He commands and listen for the voice of His word. Bless the LORD, all His hosts, His servants who do His will. Bless the LORD, all His works, in every place He rules. Bless the LORD, my soul.

notes:
  - ref: 1
    phrase: Bless the LORD, O my soul
    kind: structure
    title: A man telling himself to bless God
    body: |
      The psalm opens with a man giving an order to himself, and what he orders is worship. He speaks to “my soul” and to “all that is within me,” and through verse 5 every “thee” and “thy” is still his own soul. No one else is addressed until verse 20.

      How a man can bless God is answered by the Hebrew verb. With a person as its subject and God as its object, its sense is to “adore with bended knees.”

      Verse 2 says what the soul is told to do: “forget not all his benefits.” The list follows at once, each item beginning “Who.”
    sources: [bdb]

  - ref: 4
    phrase: Who redeemeth thy life from destruction
    kind: words
    title: Destruction is the pit
    body: |
      “Destruction” here is the grave, so the third benefit is a life bought back from death. A modern translation has “who redeems your life from the Pit,” which is what the Hebrew noun means, and in this verse it is taken as the pit of Sheol (see [[Ps. 6:5]]).

      Forgiveness stands first in the list, before healing and before rescue from the pit, and the two halves of verse 3 are built alike: “all thine iniquities,” “all thy diseases.” After the rescue comes more than survival. The life brought back from the pit is crowned, and the crown is “lovingkindness and tender mercies,” the pair of words David pleads in [[Ps. 51:1]].
    sources: [nrsvue, bdb]

  - ref: 7
    phrase: He made known his ways unto Moses
    kind: scripture
    title: The prayer of Moses after the golden calf
    body: |
      Verse 7 looks back to Moses at Sinai after the golden calf, and verse 8 repeats what the LORD said to him there. Israel had made the calf; the LORD’s own account is that “they have made them a molten calf, and have worshipped it” ([[Ex. 32:8]]). Moses then prayed, “shew me now thy way, that I may know thee,” and added, “consider that this nation is thy people” ([[Ex. 33:13]]). The LORD promised, “I will proclaim the name of the LORD before thee” ([[Ex. 33:19]]), and He did: “The LORD, The LORD God, merciful and gracious, longsuffering, and abundant in goodness and truth” ([[Ex. 34:6]]).

      On one reading the psalmist has that prayer in mind. The “ways” made known to Moses are then God’s own, “those which He Himself follows in the course of His redemptive history,” and not the paths He commands people to walk. Moses asked to know Him, and the proclamation that verse 8 repeats in shorter form was the answer. The note on [[Ps. 86:15]] sets the words side by side.

      Israel went on repeating the answer: Joel preaches repentance from it (see [[Joel 2:13]]), and [[Ps. 145:8]] sings it again. At Sinai it was said after Israel had made the calf, and verses 9–10 apply it to “us.” He “will not always chide,” where a modern translation has “accuse,” and He “hath not dealt with us after our sins.”
    sources: [lds-scriptures, delitzsch-psalms, nrsvue]

  - ref: 8
    phrase: The LORD is merciful and gracious
    kind: scripture
    title: The Lord says it of Himself again
    body: |
      The Lord repeats this verse in the first person in a latter-day revelation, with the psalm’s own condition attached. The vision of the degrees of glory opens by declaring that “the Lord is God, and beside him there is no Savior” ([[D&C 76:1]]), and then He speaks: “I, the Lord, am merciful and gracious unto those who fear me” ([[D&C 76:5]]). “Merciful and gracious” is verse 8. “Those who fear me” is this psalm’s phrase, used three times, in verses 11, 13 and 17, for those who receive His mercy and pity.

      The third of the Lectures on Faith builds on the same verses. It sets Exodus 34:6 beside verses 6–8 and 17–18 of this psalm and draws from them that God “was so from everlasting, and will be to everlasting.” Then it says why a person needs to know it. Without the knowledge that God is slow to anger and forgiving, “those who know their weakness and liability to sin would be in constant doubt of salvation.”
    sources: [lds-scriptures, lectures-on-faith-3]

  - ref: 14
    phrase: he knoweth our frame
    kind: words
    title: Frame is what was formed
    body: |
      “Our frame” means the way we were made, and the Hebrew word ties the verse to the creation of Adam. In this verse it is the “form of man as made of the dust,” and the verb it comes from is the verb of [[Gen. 2:7]]: “the LORD God formed man of the dust of the ground.” A modern translation has “he knows how we were made.”

      He knows what He formed, and He remembers what He formed it from. This is the reason the psalm gives for the pity of verse 13, introduced with “For.” Dust as the measure of human life is explained at [[Ps. 90:3]].

      [Dust and Glory](/psalms/themes/what-is-man/) follows the dust of this verse from Psalm 8’s glory and Psalm 144’s shadow to Hebrews 2.
    sources: [bdb, lds-scriptures, nrsvue]

  - ref: 17
    phrase: But the mercy of the LORD is from everlasting to everlasting
    kind: scripture
    title: What outlasts the grass
    body: |
      Against the grass of verses 15–16 the psalm sets one thing that does not pass, and it is the LORD’s mercy. Isaiah makes the same contrast and puts “the word of our God” on the lasting side ([[Isa. 40:8]]). The mercy is the covenant love explained at [[Ps. 51:1]], and verse 18 names the covenant at once.

      “Children’s children” also stands in the words spoken at Sinai, and the verse has been read beside them. What Moses heard went on: “Keeping mercy for thousands,” and “visiting the iniquity of the fathers upon the children, and upon the children’s children, unto the third and to the fourth generation” ([[Ex. 34:7]]). In the psalm what reaches the children’s children is “his righteousness.”

      Verse 18 says who receives it, and that too has been read beside Sinai. There mercy is shown “unto thousands of them that love me, and keep my commandments” ([[Ex. 20:6]]). Here “them that fear him,” named three times in the psalm, are “such as keep his covenant” and remember His commandments “to do them.”
    sources: [lds-scriptures, scripture-helps-ps-102, delitzsch-psalms]

  - ref: 20
    phrase: Bless the LORD, ye his angels
    kind: structure
    title: Out to all His works, and back to one soul
    body: |
      The psalm ends by handing its opening command to everything that exists. Verse 19 sets the scene, a throne in the heavens and a kingdom that “ruleth over all.” Then the command of verse 1 is given three times in the plural: to the angels, to “all ye his hosts,” and to “all his works in all places of his dominion.” [[Ps. 148:2]] calls on the same two companies together.

      The angels are described by what they do: they “do his commandments, hearkening unto the voice of his word,” and the hosts “do his pleasure.” Verse 18 has just asked the same of people, who are to remember His commandments “to do them.”

      The last line returns to the singular: “bless the LORD, O my soul,” the words of verse 1.
    sources: [lds-scriptures]

christ: |
  The LORD whom this psalm blesses is the Savior. “LORD” in the Old Testament usually stands for the name Jehovah, and “Jehovah is the premortal Jesus Christ.” In the latter days He speaks the psalm’s words of Himself, in the revelation quoted in the note on [[Ps. 103:8]].

  The psalm says that God “hath not dealt with us after our sins” and that His mercy is “from everlasting to everlasting.” It does not say how. Later scripture does: the mercy reaches backward as well as forward because of the Savior’s atoning sacrifice, so that those who believed before He came could “receive remission of their sins,” and rejoice “even as though he had already come among them” ([[Mosiah 3:13]]).

explore: |
  - **The story behind verses 7–8.** [[Ex. 32]]–34: the calf, the prayer of Moses, and the name proclaimed.
  - **The same words elsewhere.** [[Ps. 86:15]], [[Ps. 145:8]] and [[Joel 2:13]], each putting the Sinai sentence to a different use.
  - **The companion psalm.** [[Ps. 104]], which opens and closes with the same line and blesses the LORD for His works.
  - **Grass and what endures.** [[Isa. 40:6–8]] and [[Ps. 90:5–6]].
  - **Why faith needs a merciful God.** The third of the Lectures on Faith, which reasons from verses 6–8 and 17–18.

parallels:
  - ref: Ex. 34:6–7
    note: The LORD proclaims His name to Moses; verse 8 repeats the words, and verse 17 takes up “children’s children.”
  - ref: Ex. 33:13
    note: Moses prays, “shew me now thy way,” the prayer verse 7 looks back to.
  - ref: D&C 76:5
    note: The Lord says of Himself that He is “merciful and gracious unto those who fear me.”
  - ref: Isa. 40:31
    note: Strength renewed, pictured by the eagle, as in verse 5.
  - ref: Gen. 2:7
    note: Man is formed of dust; “our frame” in verse 14 is the noun of that verb.
  - ref: Ps. 104:1
    note: The next psalm opens with the first line of this one.

