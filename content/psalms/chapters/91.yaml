chapter: 91
title: Under the Shadow of the Almighty
tagline: Three voices promise shelter to the one who makes the LORD his dwelling, and the last voice is the LORD’s own.
when: 'Undated; the psalm has no title'

setting: |
  Psalm 91 has no title, and its author is not known. The Greek translation heads it “by David,” which one older judgment calls an inscription “without any warrant.”

  It follows the psalm titled “A Prayer of Moses the man of God,” and the two share words. Psalm 90 opens, “LORD, thou hast been our dwelling place” ([[Ps. 90:1]]), and the “habitation” of verse 9 here is the same Hebrew noun. Psalm 90 asks, “Let thy work appear unto thy servants” ([[Ps. 90:16]]), and this psalm ends with the LORD promising to “shew him my salvation”; on one reading that is why it was placed here. So it has been suggested that Psalm 91 “may have been written as a response to Psalm 90,” and even that Moses wrote both. The psalm itself names no one.

  The speaker changes several times and the psalm never says so. The note on verse 2 sorts the voices out.

  The Church’s edition reads the psalm of the Messiah. The New Testament quotes verses 11–12 in the account of the Savior’s temptation, and there the one quoting is the devil ([[Matt. 4:6]]). This chapter takes the promise first as the psalm gives it, to anyone who shelters with the LORD, and then turns to that scene.

thread: |
  Psalm 91 moves by **changes of voice**, and its turn is the moment God begins to speak.

  Verse 1 states a rule about anyone who shelters with the Most High. In verse 2 an “I” claims the rule for himself. From verse 3 a voice speaks to a “thee,” and its promises climb. He will be covered (verse 4). He will not fear, at any hour (verses 5–6). He will stand while thousands fall (verses 7–8). Angels will carry him (verses 11–12). At the last he is no longer hiding at all: he treads the lion and the serpent underfoot (verse 13). In the middle of this, at verse 9, the “I” breaks in again for half a line.

  Then, at verse 14, with no “thus saith the LORD,” the speaker is God. He talks about the man, not to him: “I will deliver him.” Everything before this was said about God. The last three verses are what God says about the person who trusts Him, in seven verbs of His own.

  His speech also says something the earlier voices did not. They promised that no evil would come near. He says, “I will be with him in trouble.”

sections:
  - range: 1-2
    heading: My refuge and my fortress
    plain: |
      Whoever lives in the shelter of the Most High lodges in the shadow of the Almighty. I say of the LORD: He is my refuge and my fortress, my God, in whom I trust.
  - range: 3-8
    heading: Thou shalt not be afraid
    plain: |
      He will rescue you from the fowler’s trap and from the deadly pestilence. He will cover you with His feathers, and under His wings you will take refuge; His faithfulness is a shield and buckler. You will not fear the terror of the night or the arrow that flies by day, the pestilence that walks in darkness or the destruction that lays waste at noon. A thousand may fall at your side, ten thousand at your right hand, but it will not come near you. You will only look on and see the wicked repaid.
  - range: 9-13
    heading: Angels, and the lion underfoot
    plain: |
      For You, LORD, are my refuge. You have made the Most High your dwelling, so no evil will befall you and no plague will come near your tent. He will command His angels concerning you, to guard you in all your ways. They will carry you on their hands so that you do not strike your foot against a stone. You will tread on the lion and the adder; the young lion and the serpent you will trample underfoot.
  - range: 14-16
    heading: I will be with him in trouble
    plain: |
      Because he is attached to Me in love, I will deliver him. I will set him on high, because he knows My name. He will call on Me and I will answer him. I will be with him in trouble. I will rescue him and honor him. With long life I will satisfy him, and I will show him My salvation.

notes:
  - ref: 1
    phrase: the secret place of the most High
    kind: words
    title: A hiding place and a night’s lodging
    body: |
      The opening verse joins two words of shelter, a hiding place and a night’s lodging. “Secret place” translates a noun meaning “covering, hiding-place, secrecy”; it is the word another psalm uses for the LORD’s tent as a place to be hidden (see the note on [[Ps. 27:5]]). “Abide” is a verb meaning to “lodge, pass the night.”

      “The Almighty” is *Shaddai*, the “divine name of patriarchs” in Genesis (see the note on [[Gen. 17:1]]). In the Psalms it stands only here and at [[Ps. 68:14]].
    sources: [bdb, oshb-wlc]

  - ref: 2
    phrase: I will say of the LORD
    kind: structure
    title: Three voices
    body: |
      The psalm changes speaker without saying so, and the changes are its plan. Verse 1 speaks of “he.” Verse 2 says “I.” Verses 3–8 say “thou.” Verse 9 has “my refuge” and “thy habitation” in one sentence. In verses 14–16 the “I” is God, who speaks of the man as “him.”

      Some translations smooth this over. The Greek has “He shall say to the Lord” in verse 2, and a modern translation makes verses 1–2 one address: “You who live in the shelter of the Most High… will say to the Lord.” The Hebrew verb is in the first person: I say.

      On one older reading the shifts are a “dramatic arrangement”: there are “two voices that speak,” and “at last the voice of Jahve comes in as a third.” One voice makes the promises (verses 3–8, and verses 9–13 from “thou hast made”). The other answers with its own trust (verse 2 and the first words of verse 9). Then the LORD speaks as the third. Whether the psalm was ever sung that way, “perhaps by three choirs, we cannot tell.”

      Verse 9 shows the seam. The King James joins its halves with “which is,” words the Hebrew does not have. The Greek renders the first half as a sentence by itself: “For thou, O Lord, art my hope.” That is the second voice, breaking in for one line before the promises go on.
    sources: [delitzsch-psalms, lxx-rahlfs, nrsvue, oshb-wlc]

  - ref: 4
    phrase: his truth shall be thy shield and buckler
    kind: symbol
    title: Wings and a shield
    body: |
      Verse 4 sets a bird’s wings beside a soldier’s shield and says what the shield is. The wings are explained in the note on [[Ps. 17:8]]. “Trust” in this verse is the verb for taking refuge (see the note on [[Ps. 11:1]]); a modern translation has “under his wings you will find refuge.”

      The shield is “his truth,” which the same translation renders “his faithfulness is a shield and defense”; the buckler is likewise taken as a figure of the LORD’s “faithfulness.”
    sources: [bdb, nrsvue, oshb-wlc]

  - ref: 6
    phrase: the destruction that wasteth at noonday
    kind: words
    title: Four dangers for every hour
    body: |
      Verses 5 and 6 name four dangers and spread them across the whole day: terror “by night,” an arrow “by day,” pestilence “in darkness,” destruction “at noonday.” Between them the four leave no hour uncovered.

      “Noisome” in verse 3 is older English. In 1828 it was defined as “noxious to health; hurtful,” with “noisome pestilence” as an example. The Hebrew behind it is a word for a “chasm,” used as a figure for “destruction,” and a modern translation has “the deadly pestilence.” The “destruction” of verse 6 is a different Hebrew noun, one used “of pestilence.” So the “destruction” at noonday is disease too, like the pestilence of the line before it.
    sources: [webster-1828, bdb, nrsvue]

  - ref: 10
    phrase: There shall no evil befall thee
    kind: scripture
    title: What the promise does and does not say
    body: |
      Read alone, verses 7–10 say that harm never reaches the faithful. The psalm’s own last voice shows that this is not the whole promise. When the LORD speaks for Himself, He says, “I will be with him in trouble; I will deliver him” (verse 15). The man He describes is in trouble, calls out, and needs rescue. What God promises him is His company and a deliverance.

      “The promise provided in Psalms 91 is not that faithful followers will be free from the difficulties and trials of life.” Where God does not give the victory in this life, He will deliver in the end those who trust Him.

      How the tempter used verses 11–12, and how the Savior answered him, is in the note on verse 11.
    sources: [church-psalm-91, lds-scriptures]

  - ref: 11
    phrase: he shall give his angels charge over thee
    kind: christ
    title: The verse the tempter quoted
    body: |
      Verses 11–12 are quoted in the New Testament by the devil. Jesus is on a pinnacle of the temple, and the tempter says, “If thou be the Son of God, cast thyself down: for it is written, He shall give his angels charge concerning thee: and in their hands they shall bear thee up, lest at any time thou dash thy foot against a stone” ([[Matt. 4:6]]). Matthew’s quotation passes over the psalm’s words “to keep thee in all thy ways.” Luke’s has “to keep thee” and stops there ([[Luke 4:10]]).

      The psalm speaks its promise to one who has made the Most High his habitation (verse 9). The tempter was urging Jesus “to wantonly throw Himself upon the Father’s protection.” Had the leap ended as he promised, it would also have been a public sign, whose fame “would have spread as fire in the dry grass,” though nothing warrants saying that such a thought had any place in the Savior’s mind.

      The Savior does not dispute the psalm. He answers it with Moses: “It is written again, Thou shalt not tempt the Lord thy God” ([[Matt. 4:7]]). The verse He quotes goes on, “as ye tempted him in Massah” ([[Deut. 6:16]]), and at Massah Israel had demanded proof, “saying, Is the LORD among us, or not?” ([[Ex. 17:7]]). In this way “the lines of the psalmist were met by the binding fiat of the prophet of the exodus.” In short, “Satan tempted Jesus to tempt the Father,” and “God alone must decide when and how His wonders shall be wrought.” Elder Howard W. Hunter drew the rule from the scene: “faith is to precede the miracle; miracles are not to precede the faith.”

      Matthew ends the account with angels. When the devil left, “angels came and ministered unto him” ([[Matt. 4:11]]).
    sources: [lds-scriptures, talmage-jesus-christ-10, hunter-temptations]

  - ref: 13
    phrase: the young lion and the dragon
    kind: symbol
    title: Lion and serpent underfoot
    body: |
      The last promise before God speaks is victory, not shelter: the one who was covered and carried now treads on what threatened him. The four creatures are two lions and two snakes. The “dragon” of this verse is probably “a large snake or snakelike animal.”

      On one older reading the animals stand for “all kinds of destructive powers,” the lions for “open power” and the adder and dragon for “venomous secret malice.” The same reading says the promise “calls to mind” the Savior’s words to the Seventy: “Behold, I give unto you power to tread on serpents and scorpions, and over all the power of the enemy: and nothing shall by any means hurt you” ([[Luke 10:19]]). It points to Paul as well: “the God of peace shall bruise Satan under your feet shortly” ([[Rom. 16:20]]).

      In the wilderness the tempter’s quotation stopped at verse 12. This is the next line.
    sources: [bd-dragon, delitzsch-psalms, lds-scriptures]

  - ref: 14
    phrase: Because he hath set his love upon me
    kind: words
    title: The LORD speaks for Himself
    body: |
      In verses 14–16 the speaker is God, and He gives the reason for all that was promised above: the man’s attachment to Him. “Set his love” is a verb meaning to “be attached to, love,” and it occurs only here in the Psalms. In Deuteronomy it is the word for the LORD’s own love of Israel: “The LORD did not set his love upon you, nor choose you, because ye were more in number than any people” ([[Deut. 7:7]]). Here it runs the other way, and is used “of love to” the LORD.

      “I will set him on high” answers that love. The verb means to “set (securely) on high,” from a root for being “(inaccessibly) high,” out of an enemy’s reach.

      The speech has seven verbs in God’s first person: deliver, set on high, answer, deliver, honour, satisfy, shew. In the middle of them stands the one promise that has no verb in Hebrew, only three words: with him, I, in trouble.
    sources: [bdb, oshb-wlc, lds-scriptures]

christ: |
  The Church’s edition heads this “A messianic psalm,” in which the Lord will deliver the Messiah “and honor Him.”

  In the Gospels the psalm is quoted to Jesus by the tempter, as a reason to throw Himself from the temple, and He refuses to put His Father to the test ([[Matt. 4:5–7]]). Matthew then says that angels came and ministered to Him ([[Matt. 4:11]]).

  The LORD’s own words in verse 15 put the trouble first, and the deliverance and the honour after it.

explore: |
  - **The temptation beside the psalm.** [[Matt. 4:1–11]] and [[Luke 4:1–13]], read with verses 9–13 open.
  - **The prayer before it.** [[Ps. 90]], for “our dwelling place” (verse 1) and the request that the LORD’s work appear (verse 16).
  - **Another psalm in more than one voice.** [[Ps. 121]], where an “I” looks to the hills and a second voice answers, “he that keepeth thee will not slumber.”
  - **The second temptation at length.** James E. Talmage, *Jesus the Christ*, chapter 10, “In the Wilderness of Judea.”

parallels:
  - ref: Matt. 4:6
    note: The devil quotes verses 11–12 to Jesus on the pinnacle of the temple; Luke 4:10–11 has the same, with “to keep thee.”
  - ref: Matt. 4:7
    note: The Savior answers the quotation with Deut. 6:16, “Thou shalt not tempt the Lord thy God.”
  - ref: Luke 10:19
    note: The Seventy are given power “to tread on serpents and scorpions”; compare verse 13.
  - ref: Deut. 7:7
    note: The LORD “set his love” on Israel; verse 14 uses the same Hebrew verb of a man’s love for Him.

