chapter: 8
title: What Is Man?
tagline: Under a night sky the psalmist asks why the Maker of the stars should keep humankind in mind, and answers with what God has done, crowning man and setting all things under his feet.
when: 'Undated; a psalm of David by its title'

setting: |
  The title ascribes the psalm to David.

  No occasion is named. The speaker looks at the moon and the stars and does not mention the sun, which suggests a night sky. The psalm asks God for nothing. It is a hymn of praise and a creation psalm.

  The New Testament returns to it several times. Jesus quoted verse 2 in the temple ([[Matt. 21:16]]), Paul uses the words of verse 6 of the risen Christ ([[1 Cor. 15:27]]; [[Eph. 1:22]]), and Hebrews quotes verses 4–6 and reads them of Jesus ([[Heb. 2:6–9]]). The Church’s edition accordingly heads it “A messianic psalm of David.”

thread: |
  Psalm 8 opens and closes with the same line: “O LORD our Lord, how excellent is thy name in all the earth!” Everything else stands inside that frame, and **the question in the middle, “What is man?”, is asked and answered inside it.**

  The psalm moves by contrasts of scale. God’s glory is set above the heavens (verse 1), yet the strength He establishes against His enemies comes from the mouths of infants (verse 2). Then the speaker looks up. The heavens are “the work of thy fingers,” and against the moon and the stars a human being is very small. So he asks why God should remember such a creature and attend to him (verse 4).

  The turn comes at verse 5, where the King James’s “For” is “Yet” in a modern translation. Nothing in the sky has changed, and the psalm does not answer by saying that man is larger than he looked. It answers with four things God has done: made him “a little lower than the angels” (the note on verse 5 takes up the word), crowned him with glory and honour, given him dominion over the works of God’s hands, and put all things under his feet (verses 5–6). God is the subject of every verb. Verses 7–8 list the creatures under that dominion, which is the dominion of [[Gen. 1:26]].

  Then the first line returns (verse 9). A psalm about human glory ends where it began, with the name of the Lord, because the glory was His gift. Hebrews adds that we do not yet see all things put under man, but we do see Jesus crowned (see the note on verse 6).

sections:
  - range: 1-2
    heading: The name in all the earth
    plain: |
      Lord, our Lord, how majestic Your name is through all the earth! You have set Your glory above the heavens. From the mouths of little children and nursing infants You have established strength because of Your enemies, to silence the enemy and the avenger.
  - range: 3-4
    heading: The question under the stars
    plain: |
      When I look at Your heavens, which Your fingers made, at the moon and the stars that You set in place, what is a human being, that You remember him? What is a mortal, that You attend to him?
  - range: 5-8
    heading: Crowned and given dominion
    plain: |
      Yet You have made him only a little lower than God (the King James has “angels”), and You have crowned him with glory and honor. You have made him ruler over what Your hands have made. You have put everything under his feet: all the sheep and oxen, and the wild animals too, the birds of the air, the fish of the sea, and whatever travels the paths of the seas.
  - range: 9
    heading: The name again
    plain: |
      Lord, our Lord, how majestic Your name is through all the earth!

notes:
  - ref: 0
    phrase: To the chief Musician upon Gittith
    kind: words
    title: The chief Musician and Gittith
    body: |
      The psalm is addressed to whoever led the singing: the Hebrew behind “chief Musician” is a verb for one who acts “as overseer, superintendent, director.” Gittith is uncertain. The word stands in three titles (Psalms 8, 81 and 84), looks like “belonging to Gath,” and “may relate either to the melody or to the instrument used in the performance.” The ancient Greek translators took it for a similar word and wrote “concerning the wine-presses.” What a title is, and what it is worth as evidence, is discussed under the title of Psalm 3 ([[Ps. 3:1]]).
    sources: [bdb, bd-psalms, lxx-rahlfs]
  - ref: 1
    phrase: O LORD our Lord
    kind: words
    title: The name and the title
    body: |
      The opening address joins two different Hebrew words that the King James spells alike, the divine name and a title with “our” attached. It can be said simply as “Jehovah our Lord.” The name and the title stand side by side again in [[Ps. 110:1]], where the difference between them carries the verse, and they are explained there.

      Where the King James has “excellent,” a modern translation has “how majestic is your name.”

      The line returns as the last verse, without its second half. Whatever the psalm says of human glory, it says between two acclamations of His name.
    sources: [oshb-wlc, ot-minute-psalms-1-20, nrsvue]
  - ref: 2
    phrase: hast thou ordained strength
    kind: scripture
    title: Strength in the psalm, praise in the Savior’s quotation
    body: |
      The Hebrew says that God has “founded strength, or a stronghold” out of the mouths of children, while the ancient Greek translation says He has “perfected praise,” and the Greek form is the one Jesus quoted. The Hebrew verb means to establish, and a modern translation keeps the building image: “you have founded a bulwark because of your foes.”

      Jesus used the verse on the day He cleansed the temple. The chief priests and scribes saw “the children crying in the temple, and saying, Hosanna to the Son of David; they were sore displeased” ([[Matt. 21:15]]). When they challenged Him He answered, “Yea; have ye never read, Out of the mouth of babes and sucklings thou hast perfected praise?” ([[Matt. 21:16]]). He answers the objection to the children’s hosannas with the psalm’s babes.

      How strength can come out of infants’ mouths, and why infants should be set against “the enemy and the avenger,” is the puzzle of the Hebrew line. One reading takes the strength as “victorious power, which God creates for Himself out of the mouths of children that confess Him,” pictured as a fortress. On that reading the point is God’s choice of means: it is “by obscure and naturally feeble instruments” that He makes His name glorious on the earth.
    sources: [bdb, lxx-rahlfs, nrsvue, delitzsch-psalms, lds-scriptures]
  - ref: 4
    phrase: the son of man
    kind: words
    title: Son of man means a human being here
    body: |
      In this verse “the son of man” is the second half of a parallel line and means what “man” means in the first half: a human being. (On the two halves of a line of Hebrew verse, see [[Ps. 1:1]].) The two halves use two different Hebrew words for humankind, and a modern translation renders them simply “humans” and “mortals.”

      The verbs are a pair as well. The first question, “What is man, that thou art mindful of him?”, is more literally “What is man, that thou dost remember him?” And “visitest” does not mean paying a call. The verb is to “pay attention to, observe (with care, practical interest),” used in this verse of God’s providence. The question, then, is why the Maker of the moon and the stars should keep one small creature in mind and look after him.

      The question is asked twice more in scripture, and what follows it differs each time. Job asks it as a complaint: “What is man, that thou shouldest magnify him? and that thou shouldest set thine heart upon him? And that thou shouldest visit him every morning, and try him every moment?” ([[Job 7:17–18]]). Another psalm asks it and goes on to how brief a life is: “Man is like to vanity: his days are as a shadow that passeth away” ([[Ps. 144:4]]). Psalm 8 goes on to a crown (verse 5).

      Hebrews reads the phrase of Jesus; see the note on verse 6.

      [Dust and Glory](/psalms/themes/what-is-man/) follows this question through Psalms 144, 90 and 103 to Hebrews, which reads the psalm of Jesus.
    sources: [oshb-wlc, nrsvue, sperry-psalm-8, bdb, lds-scriptures]
  - ref: 5
    phrase: a little lower than the angels
    kind: words
    title: The word behind angels is Elohim
    body: |
      The Hebrew word translated “angels” is *Elohim*, a name for God, so the line says that God made man “lack little of God.” *Elohim* “can also be rendered as ‘God’ or ‘gods,’” and its use is wide: beside God Himself it is used of “rulers, judges,” of “divine ones, superhuman beings including God and angels,” and of “angels.” Interpreters have differed over this verse. Some have taken the word here of the divine ones, the superhuman beings; the Greek reads angels, and the Revised Version “and most moderns” read God.

      “Angels” entered through the Greek. The translation made in the centuries before Christ has “Thou madest him a little less than angels.” The writer of [[Heb. 2:7]] quotes the psalm in that form, and from there the word passed into the Latin versions “and thence into the King James Version.” Why “angels” was chosen is a matter of conjecture. Perhaps the Greek translators could not accept “the bold Hebrew doctrine” of the line, and the wording of the King James and other translations “may have occurred because of hesitancy among translators to associate mankind with God.”

      “A little lower than God” is the “more accurate translation,” and a modern translation prints it. The Church reads the line with the teaching that human beings are children of God who can become like Him. Read so, verse 5 “makes sense in conjunction with verse 6,” where man is given dominion, and with the image and likeness of [[Gen. 1:26]]. The psalm’s own wording still holds two things: man is lower, and it is God who made him what he is.

      Who the *elohim* are is asked again at [[Ps. 82:6]].
    sources: [oshb-wlc, bdb, lxx-rahlfs, sperry-psalm-8, scripture-helps-ps-1, nrsvue, ot-minute-psalms-1-20]
  - ref: 6
    phrase: Thou madest him to have dominion over the works of thy hands
    kind: scripture
    title: Genesis 1 sung back to God
    body: |
      Verses 6–8 are the dominion of Genesis 1 turned into praise. In Genesis God says, “Let us make man in our image, after our likeness: and let them have dominion over the fish of the sea, and over the fowl of the air, and over the cattle” ([[Gen. 1:26]]). The psalm names the same three realms in the opposite order, from the sheep and oxen to the birds to the fish, and says it all to God in the second person: “Thou madest him.”

      Set beside “God’s own declaration in the Creation,” the psalm’s answer to “What is man?” is the dominion God gave at the beginning.

      What man rules the psalm calls “the works of thy hands,” as it called the heavens “the work of thy fingers” (verse 3).
    sources: [ot-minute-psalms-1-20, lds-scriptures]
  - ref: 6
    phrase: thou hast put all things under his feet
    kind: christ
    title: Not yet true of us, already true of Jesus
    body: |
      The New Testament reads this line of Jesus Christ, and Hebrews says that it is not yet true of humankind. Hebrews quotes verses 4–6 and then says what every reader can see: “But now we see not yet all things put under him” ([[Heb. 2:8]]). Humankind does not yet rule all things. The next sentence gives the psalm its fulfilment: “But we see Jesus, who was made a little lower than the angels for the suffering of death, crowned with glory and honour; that he by the grace of God should taste death for every man” ([[Heb. 2:9]]).

      So Hebrews takes the psalm’s “son of man” “as a reference to Jesus,” who was made lower “when he condescended to come to earth.” In Hebrews the phrase for “a little” is rendered by a modern translation as a measure of time, “for a little while lower than the angels.” Read that way, the line gives an order of time: lower for a while, then crowned.

      Paul uses the same words of the risen Lord, “For he hath put all things under his feet” ([[1 Cor. 15:27]]), just after saying, “The last enemy that shall be destroyed is death” ([[1 Cor. 15:26]]). The language of verse 6 is taken there for “Christ’s ultimate victory and sovereignty over all Creation.”

      Hebrews does not take the psalm away from humankind in giving it to Christ. Its next verse speaks of God “in bringing many sons unto glory, to make the captain of their salvation perfect through sufferings” ([[Heb. 2:10]]). For enemies made the footstool of the Lord at God’s right hand, see [[Ps. 110:1]].

      [Dust and Glory](/psalms/themes/what-is-man/) reads Psalm 8 beside Psalms 144, 90 and 103, which answer the same question with a shadow, dust and a Father’s pity.
    sources: [lds-scriptures, ot-minute-psalms-1-20, nrsvue]

christ: |
  The New Testament reads Psalm 8 of Jesus Christ, once by His own mouth. In the temple, when children cried “Hosanna to the Son of David” and the chief priests objected, He answered with verse 2 ([[Matt. 21:15–16]]).

  The fuller witness is in Hebrews. The psalm says that God has crowned man and put all things under his feet; Hebrews observes that we do not yet see this, “But we see Jesus” ([[Heb. 2:9]]), made lower “for the suffering of death” and then “crowned with glory and honour.” The note on verse 6 follows that passage and Paul’s use of the same line.

explore: |
  - **Hebrews’ whole argument.** Read [[Heb. 2:5–18]] through, watching how the writer moves from the psalm to why the Savior had to share flesh and blood.
  - **All things under His feet.** Compare [[1 Cor. 15:20–28]] and [[Eph. 1:20–22]] with [[Ps. 110:1]].
  - **The creation the psalm sings.** [[Gen. 1:26–28]], and the heavens again in [[Ps. 19:1–6]].

parallels:
  - ref: Matt. 21:15–16
    note: Jesus answers the chief priests with verse 2 when children praise Him in the temple.
  - ref: Heb. 2:6–9
    note: Verses 4–6 quoted and read of Jesus, made lower for the suffering of death and crowned.
  - ref: 1 Cor. 15:25–27
    note: Paul quotes verse 6 of the risen Christ, with death as the last enemy (also Eph. 1:22).
  - ref: Gen. 1:26–28
    note: The dominion the psalm praises God for giving.
  - ref: Job 7:17–18
    note: Job asks the same question as a complaint (also Ps. 144:3–4).

