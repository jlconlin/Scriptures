chapter: 94
title: He That Planted the Ear
tagline: A people crushed by the proud calls on the judge of the earth, argues with those who say He does not see, and ends sure that the wicked will be paid with their own iniquity.
when: 'Undated; the psalm has no title'

setting: |
  Psalm 94 has no title in the Hebrew or in the King James. The ancient Greek translation supplies one, “A Psalm of David for the fourth day of the week,” and one older reading keeps the second half of it and discards the first: it reports a Talmudic tradition that this “was the Wednesday song in the Temple liturgy,” and judges the psalm later than David, “one of the latest” in the book. That date is one judgment. The psalm names no author, no king and no enemy.

  It stands between a psalm that opens with the cry “The LORD reigneth” ([[Ps. 93:1]]) and those that take the cry up again ([[Ps. 96:10]]; [[Ps. 97:1]]; [[Ps. 99:1]]). Psalm 94 does not use the phrase. Its name for the King is “judge of the earth.”

  The psalm prays for a people and for one man. It begins with “thy people” and “thine heritage,” passes in verse 16 to “me,” and ends with “the LORD our God.” Paul quotes verse 11 to the Corinthians ([[1 Cor. 3:20]]).

thread: |
  The wicked of Psalm 94 have a creed of one line: “The LORD shall not see” (verse 7). **The psalm answers that line twice, first by an argument and then by a witness, and only then says again what it asked for at the start.**

  It opens as a lament does (see [[Ps. 22:1]]), with an appeal and a complaint. The appeal is to the God of vengeance and the judge of the earth (verses 1–2); the complaint is that the proud crush His people, kill the widow, the stranger and the fatherless, and say that He takes no notice (verses 3–7).

  Then the speaker turns from God to people, and reasons with them. The Maker of the ear hears, the Maker of the eye sees, and the Teacher of mankind knows (verses 8–11). The turn of the psalm follows in verse 12, and it is a beatitude: “Blessed is the man whom thou chastenest.” The verbs said of God and the nations in verse 10, chastening and teaching, are said here of God and one man, and a term is set to the man’s trouble: “until the pit be digged for the wicked.”

  The witness comes next. “Who will rise up for me?” (verse 16) is answered by what has already happened to the speaker: his foot slipped, and he was held (verses 17–19).

  The close returns to the opening. The psalm began with a doubled line and ends with one. Verse 2 asked the judge to “render a reward to the proud,” and verse 23 says that He “shall bring upon them their own iniquity.” A modern translation has “the LORD has become my stronghold” in verse 22, and one older reading hears “prophetic certainty” in the verbs of the last two verses: the speaker tells the end as if he had seen it.

sections:
  - range: 1-2
    heading: God of vengeance, shine forth
    plain: |
      O LORD, God of vengeance, God of vengeance, shine forth! Rise up, judge of the earth, and give the proud what they have earned.
  - range: 3-7
    heading: How long shall the wicked triumph?
    plain: |
      LORD, how long will the wicked, how long will the wicked exult? They pour out insolent words; all the workers of iniquity boast. They crush Your people, LORD, and afflict Your heritage. They kill the widow and the stranger and murder the fatherless, and they say, “The LORD does not see; the God of Jacob takes no notice.”
  - range: 8-11
    heading: Shall He not hear?
    plain: |
      Understand, you dullest of the people; you fools, when will you be wise? He who planted the ear, does He not hear? He who formed the eye, does He not see? He who disciplines nations, does He not correct, He who teaches mankind knowledge? The LORD knows the thoughts of man, that they are a breath.
  - range: 12-15
    heading: Blessed is the man whom thou chastenest
    plain: |
      Blessed is the man whom You discipline, LORD, and teach out of Your law, to give him rest from days of trouble until a pit is dug for the wicked. For the LORD will not cast off His people or forsake His inheritance. Judgment will come back to righteousness, and all the upright in heart will follow it.
  - range: 16-19
    heading: Thy mercy held me up
    plain: |
      Who rises up for me against the evildoers? Who stands with me against the workers of iniquity? If the LORD had not been my help, my soul would soon have been living in the land of silence. When I said, “My foot is slipping,” Your mercy, LORD, held me up. When anxious thoughts crowd within me, Your comforts delight my soul.
  - range: 20-23
    heading: The throne of iniquity
    plain: |
      Can a throne of ruin be Your ally, one that shapes mischief by statute? They band together against the life of the righteous and condemn innocent blood. But the LORD has become my stronghold, and my God the rock where I take refuge. He will turn their own iniquity back on them and cut them off in their wickedness; the LORD our God will cut them off.

notes:
  - ref: 1
    phrase: to whom vengeance belongeth
    kind: scripture
    title: God of vengeance, asked to shine
    body: |
      The psalm’s first address names God by what He has kept for Himself, and what it asks of Him is that He appear. The LORD says it of Himself in the law: “To me belongeth vengeance, and recompence” ([[Deut. 32:35]]). The speaker asks God to do what is God’s to do.

      “Shew thyself” is the verb to “shine out or forth, send out beams,” and a modern translation has “shine forth!” The Shepherd of Israel is asked for the same in [[Ps. 80:1]], where it is explained.

      How the psalms that pray against enemies are to be read is set out at [[Ps. 137:8]].
    sources: [bdb, nrsvue, lds-scriptures]
  - ref: 6
    phrase: They slay the widow and the stranger, and murder the fatherless
    kind: scripture
    title: The three the law put under God’s own care
    body: |
      The widow, the stranger and the fatherless are the people the law of Moses names as the LORD’s own charge. Moses says of Him, “He doth execute the judgment of the fatherless and widow, and loveth the stranger, in giving him food and raiment” ([[Deut. 10:18]]).

      The law also said what would follow if they were wronged, and it said it in terms of hearing: “Ye shall not afflict any widow, or fatherless child” ([[Ex. 22:22]]); “If thou afflict them in any wise, and they cry at all unto me, I will surely hear their cry” ([[Ex. 22:23]]). In the next verse of the psalm the oppressors say that the LORD will not see.

      Another psalm commands those who judge to “Defend the poor and fatherless” ([[Ps. 82:3]]).
    sources: [lds-scriptures]
  - ref: 8
    phrase: ye brutish among the people
    kind: history
    title: Who is being called a fool
    body: |
      Verse 8 stops speaking to God and speaks to people, and the psalm does not say plainly who they are. For “ye brutish” a modern translation has “O dullest of the people.” They are “among the people,” and the people of this psalm is the LORD’s (verse 5).

      One older reading takes the oppressors of verses 4–7 to be “non-Israelites, who despise the God of Israel and fear not His vengeance,” and has verse 8 turn from them “to those among the people themselves, who have been puzzled about the omniscience and indirectly about the righteousness of God by the fact that this vengeance is delayed.” Read so, the argument of verses 9–11 is spoken to the LORD’s own people in their doubt. That is one reading; the psalm names no nation.
    sources: [nrsvue, delitzsch-psalms]
  - ref: 11
    phrase: The LORD knoweth the thoughts of man, that they are vanity
    kind: scripture
    title: Paul quotes the verse against the wisdom of the world
    body: |
      Paul quotes this verse with one word changed. He is telling the Corinthians that “the wisdom of this world is foolishness with God” ([[1 Cor. 3:19]]), and his second proof is the psalm: “And again, The Lord knoweth the thoughts of the wise, that they are vain” ([[1 Cor. 3:20]]). The psalm says “man,” and the ancient Greek translation of the psalm says “men”; “the wise” is Paul’s wording.

      “Vanity” is not conceit here. A modern translation renders the line “that they are but an empty breath.”
    sources: [lds-scriptures, lxx-rahlfs, nrsvue]
  - ref: 12
    phrase: Blessed is the man whom thou chastenest
    kind: scripture
    title: Why the chastened man is called blessed
    body: |
      The man is called blessed because the chastening is teaching, and the verse says so in its second half: “and teachest him out of thy law.” Verse 13 gives the purpose, which is rest, and the limit, “until the pit be digged for the wicked.” (For the word “Blessed,” see [[Ps. 1:1]].)

      Scripture says the same elsewhere, and adds the reason. Eliphaz says it to Job: “Behold, happy is the man whom God correcteth” ([[Job 5:17]]). Hebrews gives the ground, “For whom the Lord loveth he chasteneth” ([[Heb. 12:6]]), and admits that “no chastening for the present seemeth to be joyous, but grievous” ([[Heb. 12:11]]). In this dispensation the Lord has said it in His own voice: “whom I love I also chasten that their sins may be forgiven, for with the chastisement I prepare a way for their deliverance” ([[D&C 95:1]]).

      Elder D. Todd Christofferson taught that “Divine chastening has at least three purposes: (1) to persuade us to repent, (2) to refine and sanctify us, and (3) at times to redirect our course in life to what God knows is a better path.”
    sources: [lds-scriptures, christofferson-chasten]
  - ref: 15
    phrase: judgment shall return unto righteousness
    kind: words
    title: Justice comes back
    body: |
      The line says that judgment, which has gone wrong, will come back to being right. Translations differ over where it returns. The King James has “unto righteousness.” A modern translation makes it a people: “for justice will return to the righteous.” One older reading explains the King James’s sense: “the right that is now subdued must at length be again strictly maintained and justly administered.”

      The second half of the line says who will be glad of it. The upright in heart “shall follow it,” which on the same reading means that they “will side with it.”
    sources: [nrsvue, delitzsch-psalms]
  - ref: 17
    phrase: dwelt in silence
    kind: words
    title: Silence is the grave
    body: |
      “Silence” in this verse is a name for the place of the dead, and the speaker says he was nearly a resident of it. The word stands for Sheol here, and a modern translation has “the land of silence.” Another psalm uses it so: “The dead praise not the LORD, neither any that go down into silence” ([[Ps. 115:17]]). Sheol is explained at [[Ps. 6:5]].
    sources: [bdb, nrsvue, lds-scriptures]
  - ref: 20
    phrase: the throne of iniquity
    kind: words
    title: Wrong done by law
    body: |
      The last charge against the wicked is that they sit in a seat of authority and do their harm legally. The “throne of iniquity” is “the seat (tribunal) of destruction,” one “which ruins the innocent by injustice,” and a modern translation has simply “wicked rulers.”

      “By a law” can be taken two ways. The phrase is read “according to law, right,” though others read it “against law.” A modern translation takes the first, “those who contrive mischief by statute.” Verse 21 gives the result: they “condemn the innocent blood.”
    sources: [bdb, nrsvue]

christ: |
  Psalm 94 calls on the LORD as “judge of the earth,” and the Church’s edition ties that title to its Topical Guide entry “Jesus Christ, Judge.” Abraham had used nearly the same title in pleading for Sodom: “Shall not the Judge of all the earth do right?” ([[Gen. 18:25]]). The Savior said who holds the office: “For the Father judgeth no man, but hath committed all judgment unto the Son” ([[John 5:22]]).

  The psalm’s Judge is also the one who chastens and teaches (verse 12), and the risen Lord says that of Himself: “As many as I love, I rebuke and chasten: be zealous therefore, and repent” ([[Rev. 3:19]]).

explore: |
  - **Vengeance left with God.** [[Deut. 32:35–43]], where the LORD claims vengeance as His own in the song of Moses, and Paul’s use of it in [[Rom. 12:19–21]].
  - **The prayer and its answer.** [[D&C 121:1–10]] beside verses 1–7 of the psalm.
  - **The judge who does see.** [[Ps. 10:11–14]], where the same boast is made and answered, and [[Ps. 82:1–8]], where unjust judges are themselves judged.

parallels:
  - ref: 1 Cor. 3:19–20
    note: Paul quotes verse 11 of the wisdom of this world.
  - ref: Rom. 11:1–2
    note: Paul says that God has not cast away His people, as verse 14 says (also 1 Sam. 12:22).
  - ref: Deut. 32:35
    note: Vengeance belongs to the LORD, as verse 1 says.
  - ref: D&C 121:1–8
    note: Joseph Smith asks “how long,” appeals to the Lord’s eye and ear, and is promised triumph.
  - ref: Heb. 12:5–11
    note: The Lord chastens those He loves, the beatitude of verse 12 (also Job 5:17; D&C 95:1).

