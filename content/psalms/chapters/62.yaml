chapter: 62
title: My Soul, Wait Thou Only upon God
tagline: A man with plotters at his back says that God alone is his rock, tells his own soul to stay still there, and then weighs every other thing a person might trust and finds it lighter than a breath.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  Psalm 62 stands in Book Two of the Psalms; on the names of God in that book, see [[Ps. 42:1]]. Here the divine name never appears: it is “God” seven times and, in the last verse, “Lord,” the title.

  The title ascribes the psalm to David and names no occasion. One older reading places it in the time of Absalom’s revolt and takes the “excellency” the plotters mean to cast him down from (verse 4) as the throne. The psalm itself names no enemy and tells no story.

  It asks God for nothing. A modern translation heads it “Song of Trust in God Alone,” and that is its subject: the speaker says where his safety lies, tells his own soul to stay there, and then tells the people.

  Psalm 39 is its near relation. Both carry Jeduthun’s name in the title, both lean on the same small Hebrew word, and both call humankind “vanity” ([[Ps. 39:5]]).

  The last line, that God renders to every man according to his work, stands again in Proverbs and in Paul ([[Prov. 24:12]]; [[Rom. 2:6]]), and the Savior says it of the Son of man ([[Matt. 16:27]]).

thread: |
  Psalm 62 says one thing three times over, and **the turn is at verse 5, where what the speaker said about his soul becomes an order he gives it.** Two Selahs, after verses 4 and 8, mark off three parts.

  In the first (verses 1–4) he states his confidence: his soul is still before God, who is his rock. He adds a qualifier, that he will not be “greatly” moved, and then turns on the men who are after him. On one reading of verse 3, they see him as a wall already leaning.

  The second part (verses 5–8) begins again in almost the same words, but now he says them to himself: “My soul, wait thou only upon God.” The refrain returns without “greatly.” The enemies are not mentioned again. The names he gives God multiply: rock, salvation, defence, glory, strength, refuge. Then “my” becomes “us.” He turns to the people and gives them what he has just given his own soul: “Trust in him at all times.”

  The third part (verses 9–12) says why nothing else will hold. People of every rank, set on a scale, weigh less than a breath. Gain taken by force is no better, and wealth is not to have the heart. Against these stand two things God has spoken: power is His, and mercy is His.

  Only in the last verse does the speaker address God. Before it he speaks to the enemies, to his own soul, and to the people. “Rock” throughout is the Hebrew word explained at [[Ps. 18:2]].

sections:
  - range: 1-2
    heading: Still before God
    plain: |
      Truly, my soul is still before God; my salvation comes from Him. He alone is my rock and my salvation, my fortress. I shall not be greatly shaken.
  - range: 3-4
    heading: The men who want him down
    plain: |
      How long will you assail a man? You will all be slain, like a leaning wall and a tottering fence. Their only plan is to throw him down from his high place. They take pleasure in lies. They bless with their mouths, and inwardly they curse.
  - range: 5-8
    heading: Said again, to his soul and to the people
    plain: |
      My soul, be still before God alone, for my hope comes from Him. He alone is my rock and my salvation, my fortress. I shall not be shaken. My salvation and my honor rest on God; my strong rock, my refuge, is in God. Trust in Him at all times, you people. Pour out your hearts before Him. God is a refuge for us.
  - range: 9-10
    heading: Men on the scale
    plain: |
      People of low rank are only a breath, and people of high rank are a lie. Put on the scales, they go up; all together they are lighter than a breath. Do not trust in extortion, and do not put empty hopes in robbery. If wealth grows, do not set your heart on it.
  - range: 11-12
    heading: Two things heard
    plain: |
      God has spoken once, and twice I have heard it: power belongs to God. And to You, O Lord, belongs steadfast love, for You repay every man according to what he has done.

notes:
  - ref: 0
    phrase: to Jeduthun
    kind: history
    title: Jeduthun’s name again
    body: |
      Jeduthun was the head of one of the three families David set apart for the music of the sanctuary, “who should prophesy with harps, with psalteries, and with cymbals” ([[1 Chr. 25:1]]). His name stands in three titles, those of Psalms 39, 62 and 77, and what it is doing there is discussed under the title of Psalm 39 ([[Ps. 39:1]]). “To the chief Musician” is explained under the title of Psalm 8 ([[Ps. 8:1]]).
    sources: [lds-scriptures]
  - ref: 1
    phrase: Truly
    kind: words
    title: One small word, six times
    body: |
      Six of the psalm’s twelve verses begin with the same Hebrew particle, *ak*, and the King James hides the repetition by translating it three ways: “Truly” (verse 1), “only” (verses 2, 4, 5 and 6) and “Surely” (verse 9).

      The word has two senses. It can affirm, “surely,” or it can work “with a restrictive force, emphasizing what follows,” as “only” does. In some verses the two “agree equally with the context,” and interpreters have chosen differently. A modern translation hears the restrictive sense from the first line on: “For God alone my soul waits in silence,” “He alone is my rock.”

      Read that way, God alone is the one waited for and the only rock (verses 1, 2, 5, 6), the plotters have only one plan (verse 4), and humankind is “but a breath” (verse 9).
    sources: [oshb-wlc, bdb, nrsvue]
  - ref: 1
    phrase: my soul waiteth upon God
    kind: words
    title: Waiting is silence
    body: |
      The Hebrew line has no verb of waiting. It has a noun meaning “silence, still waiting, repose,” so that the words run roughly: toward God, silence, my soul. A modern translation keeps both ideas, “my soul waits in silence.” The noun is found in only four verses of the Psalms. One of them is in the other Jeduthun psalm of David, where the speaker says, “I was dumb with silence” ([[Ps. 39:2]]).

      For this verse the sense given is “still waiting, resignation,” and the ancient Greek translators understood it as submission: “Shall not my soul be subjected to God?” The psalm itself goes on to tell the people, “pour out your heart before him” (verse 8). The speaker makes no request anywhere in the psalm, and he does not speak to God at all until its last verse.
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs]
  - ref: 3
    phrase: 'ye shall be slain all of you: as a bowing wall shall ye be'
    kind: words
    title: Who is the leaning wall?
    body: |
      In the King James the attackers are the wall and will be slain; in other renderings, ancient and modern, the man they attack is the wall, and they are the ones doing the battering. A modern translation asks “will you batter your victim, all of you,” and goes on, “as you would a leaning wall, a tottering fence?” The ancient Greek translation agrees: “ye are all slaughtering as with a bowed wall and a broken hedge.”

      The difference lies in the vowels of one Hebrew verb. Two ways of pronouncing it were handed down. The first is passive and gives the King James’s “ye shall be slain.” The second is active. One older reading prefers the active, because the passive “produces a thought that is here introduced too early, and one that is inappropriate to the figures that follow.” On that reading the question “How long?” runs through the whole verse, and “a man” is set against “all of you.” To the attackers he looks “like a bent, overhanging wall” that needs one more push, “and yet they rush in upon him.”

      The “excellency” of verse 4 is his “dignity,” his high standing; a modern translation has “a person of prominence.”
    sources: [nrsvue, lxx-rahlfs, delitzsch-psalms, bdb]
  - ref: 5
    phrase: My soul, wait thou only upon God
    kind: structure
    title: The confession becomes a command
    body: |
      Verse 5 repeats verse 1 with one change that the King James keeps: the statement about his soul is now an order to it. In verse 1 the Hebrew text as it was handed down has the noun “silence.” Here it has the verb, in the form of a command addressed to the soul. With this preposition the verb means to “be silent to i.e. be resigned to.” That contrast depends on how verse 1 is read: some interpreters would read the verb in verse 1 as well, and one modern translation prints “For God alone my soul waits in silence” in both places.

      Between the two verses stand the plotters of verses 3 and 4. A second change goes with the first: “my salvation” in verse 1 becomes “my expectation,” which is “my hope” in a modern translation.

      A speaker who addresses his own soul is also heard in the refrain of Psalm 42; see [[Ps. 42:5]].
    sources: [oshb-wlc, bdb, nrsvue]
  - ref: 6
    phrase: I shall not be moved
    kind: structure
    title: The second time without greatly
    body: |
      Verse 6 is verse 2 again, word for word in the Hebrew, except that the last word, “greatly,” is gone. In verse 2 the qualifier concedes that he may be shaken. On one older reading it means he will not totter “so that it should come to his falling and remaining down,” which is the thought of another psalm: “Though he fall, he shall not be utterly cast down: for the LORD upholdeth him with his hand” ([[Ps. 37:24]]).

      The second time there is no concession. Another older reading hears in the bare “I shall not be moved” the language of “more entire confidence” than the psalm began with. That is one reading of a single missing word. What follows verse 6 in the psalm is not a return to the enemies but a longer list of what God is to him (verse 7) and a call to the people to trust as he does (verse 8).
    sources: [oshb-wlc, delitzsch-psalms, barnes-psalms, lds-scriptures]
  - ref: 9
    phrase: lighter than vanity
    kind: symbol
    title: Weighed, and the scale goes up
    body: |
      The verse sets humankind on a balance, and the pan rises: “in the balances they go up; they are together lighter than a breath.” “Vanity” is the Hebrew *hebel*, a breath, explained at [[Ps. 39:5]].

      The Hebrew has two phrases for “men” here, and the King James takes them as two ranks, low and high, as a modern translation does (“those of low estate,” “those of high estate”). The ancient Greek translation makes no distinction: “the sons of men are vain; the sons of men are false.” The high are called “a lie,” the same Hebrew word as the “lies” the plotters delight in (verse 4).

      The weighing stands between two commands that share a Hebrew verb. In verse 8 the people were told, “Trust in him at all times,” and verse 10 says what not to trust: “Trust not in oppression.”

      Verse 10 then plays on the word. “Become not vain” is a verb made from *hebel*, to “act emptily, become vain,” and the sense here is given as “do not become vain (i.e. be demoralized) by robbery.” Jeremiah uses the verb the same way of Israel’s fathers, who “walked after vanity, and are become vain” ([[Jer. 2:5]]).
    sources: [nrsvue, lxx-rahlfs, oshb-wlc, bdb, lds-scriptures]
  - ref: 11
    phrase: God hath spoken once; twice have I heard this
    kind: words
    title: A saying counted one, two
    body: |
      “Once” and “twice” introduce a pair: the line counts up to two and then names two things. The ancient Greek translation says so outright, “God has spoken once, and I have heard these two things.” The first is “that power belongeth unto God,” and the second is the first half of verse 12, “unto thee, O Lord, belongeth mercy.” Job has the same way of counting: “For God speaketh once, yea twice, yet man perceiveth it not” ([[Job 33:14]]).

      Both words have already been at work in the psalm or in the book. “Power” is the Hebrew word translated “strength” in verse 7, “the rock of my strength.” “Mercy” is *hesed*, which a modern translation renders “steadfast love”; the word is explained at [[Ps. 51:1]].
    sources: [lxx-rahlfs, nrsvue, oshb-wlc, lds-scriptures]
  - ref: 12
    phrase: thou renderest to every man according to his work
    kind: scripture
    title: Judgment as a reason for trust
    body: |
      The psalm ends by giving God’s judgment of every person by his work as the reason (“for”) for what has gone before. How it is a reason has been read in more than one way. Taken alone, repaying each according to his work is “an act of justice rather than of mercy.” One older reading is that “for” looks back over the whole psalm: “power, mercy, equity” together are why God can be trusted, and a God who was not just could not be. Another takes the repayment as falling two ways. Whoever sets himself against God meets His power “as a power for punishment,” and whoever gives up his own will to God’s receives from His mercy “the promised reward of faithfulness.” Both are commentators’ readings; the psalm states the connection and does not explain it.

      The line is said again elsewhere in scripture. Proverbs asks, “shall not he render to every man according to his works?” ([[Prov. 24:12]]). Paul writes that God “will render to every man according to his deeds” ([[Rom. 2:6]]), and his wording has been identified as that of the psalm’s Greek translation, which reads “thou wilt recompense every one according to his works.”
    sources: [barnes-psalms, delitzsch-psalms, lxx-rahlfs, lds-scriptures]

christ: |
  The psalm ends by saying to the Lord, “thou renderest to every man according to his work.” In the Gospel the Savior uses nearly the same words of the Son of man, who “shall come in the glory of his Father with his angels; and then he shall reward every man according to his works” ([[Matt. 16:27]]).

explore: |
  - **The other Jeduthun psalm of David.** Read [[Ps. 39:1–13]] beside this one.
  - **Pouring out the heart.** Hannah says she has “poured out my soul before the LORD” ([[1 Sam. 1:15]]); compare [[Lam. 2:19]].
  - **Nations on the scale.** [[Isa. 40:15–17]], where the nations are “the small dust of the balance.”

parallels:
  - ref: Ps. 39:5–11
    note: The companion psalm, with Jeduthun’s name and “every man is vanity.”
  - ref: Prov. 24:12
    note: The last line of the psalm as a question.
  - ref: Rom. 2:6
    note: Paul states verse 12 of God’s judgment.
  - ref: Matt. 16:27
    note: The Savior says the Son of man will reward every man according to his works.
  - ref: Job 33:14
    note: The same counting, once and twice, of God’s speaking.

