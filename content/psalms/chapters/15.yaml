chapter: 15
title: Who Shall Abide in Thy Tabernacle?
tagline: The psalmist asks the LORD who may stay as a guest in His tent, and the answer is a portrait of a person whose walk, tongue, oath and money can be trusted.
when: 'Undated; a psalm of David by its title'

setting: |
  The title ascribes the psalm to David and names no occasion. It has been said that nothing can be maintained “with any certainty” about its date except that it assumes the ark had already been brought to the tent on Zion ([[2 Sam. 6:17]]).

  The psalm “has been classified as an entrance liturgy or temple entry psalm”: a question about who may come into the LORD’s dwelling, followed by the answer. Psalm 24 is another psalm of this kind, and the fuller account of the hill, the sanctuary and the question asked at its gate is given there ([[Ps. 24:3]]). Isaiah has a passage of the same shape, a question about who can dwell with the devouring fire and a list in reply ([[Isa. 33:14–16]]).

  The psalm before this one ends with a longing for Zion: “Oh that the salvation of Israel were come out of Zion!” ([[Ps. 14:7]]). One reading takes Psalm 15 as the sequel, saying whom that salvation will avail.

thread: |
  Psalm 15 is one question and one answer. Verse 1 asks the LORD who may stay in His tent and live on His holy hill, and **the answer is a description of a person, most of it about how he deals with other people.**

  The answer goes from the general to the particular. Verse 2 gives three broad marks, which have been summed up as “a spotless walk, conduct ordered according to God’s will, and a truth-loving mode of thought.” The verses that follow “work the answer out in detail,” and the details are close to the ground: what he does with his tongue and to his neighbour (verse 3), whom he honours and whether he keeps his oath (verse 4), what he does with his money and with a bribe (verse 5). What he does is set beside what he refuses to do.

  The turn is the last line. The question asked who shall abide and who shall dwell. The close does not say that such a person shall dwell there; it says, “He that doeth these things shall never be moved.” The note on verse 5 takes up the change.

sections:
  - range: 1
    heading: The question
    plain: |
      LORD, who may stay as a guest in Your tent? Who may live on Your holy hill?
  - range: 2-3
    heading: His walk and his tongue
    plain: |
      The one who walks blamelessly and does what is right, and who speaks the truth in his heart. He does not go about slandering with his tongue, he does his neighbour no harm, and he takes up no reproach against the person near him.
  - range: 4-5
    heading: His regard, his oath and his money
    plain: |
      In his eyes the reprobate is despised, but he honours those who fear the LORD. He keeps what he has sworn even when it costs him. He does not lend his money at interest, and he takes no bribe against an innocent person. Whoever does these things will never be shaken.

notes:
  - ref: 1
    phrase: who shall abide in thy tabernacle
    kind: words
    title: A guest in the LORD’s tent
    body: |
      To “abide” in the LORD’s tabernacle is to stay there as a guest. The Hebrew verb is the one for living somewhere as a sojourner, used “of a woman in another’s house as lodger or guest” and, in poetry, “of worshipper in Yahweh’s house.” The ancient Greek translation keeps the sense: “who shall sojourn in thy tabernacle?” The word behind “tabernacle” is the Hebrew word for a tent, and a modern translation has “who may abide in your tent?” By its title the psalm is David’s, and in his day the ark stood on Zion “in the midst of the tabernacle that David had pitched for it” ([[2 Sam. 6:17]]). The note at [[Ps. 24:3]] explains the hill and the house.

      The question, then, is who may be the LORD’s guest. Psalm 5 uses the same verb to say who will not be there: “neither shall evil dwell with thee” ([[Ps. 5:4]]), that is, “evil cannot be a guest of thine.” Psalm 61 has the same verb of the same tent: “I will abide in thy tabernacle for ever” ([[Ps. 61:4]]). In both psalms the LORD’s tent is the “dwelling-place of righteous.”
    sources: [bdb, lxx-rahlfs, nrsvue, lds-scriptures]
  - ref: 1
    phrase: who shall dwell
    kind: structure
    title: A question at the gate, and its answer
    body: |
      The psalm is a question and an answer, and it has been read as an exchange spoken at the entrance to the sanctuary. The form is described in three parts: “the worshippers inquire of the priest as to the qualifications for admission to the holy place” (verse 1), “the priest responds by specifying the requirements” (verses 2–5), and “the priest concludes with a blessing” (the last line of verse 5).

      Who asked and who answered is not certain. The parts have also been given the other way round, with the question from “the worshipper (or priest)” and the reply from “the priest (or worshipper).” All of this is reconstruction, and the note at [[Ps. 24:3]] gives the proposals and their limits.

      What the text itself shows is that the question is “directed to the Lord himself,” and that the answer speaks of the righteous person in the third person.
    sources: [ot-minute-psalms-1-20, hopkin-psalms-sung, skinner-seeing-god]
  - ref: 1
    phrase: thy holy hill
    kind: scripture
    title: Joseph Smith’s revision names the hill Zion
    body: |
      Joseph Smith’s revision adds two words to the verse, so that the question ends “who shall dwell in thy holy hill of Zion?” The Hebrew has only “thy holy hill.” The addition gives the line the wording of [[Ps. 2:6]], the one place where “holy hill of Zion” is found in the King James Bible, and it strengthens the pairing of the verse’s two halves, “since Zion also refers to the temple or the dwelling place of God.”

      The change is one of a group. The revision adds Zion to four psalms (14:7; 15:1; 46:5; 53:6). The work on the Psalms has been dated approximately to January and February 1833, and the “concept of Zion was prominent in the minds of Church members in early 1833,” after the Saints “had started moving to Missouri to build up Zion there.”

      Which Zion the revised verse means “is not clear”: it may be Jerusalem or the New Jerusalem, “but in either location Mount Zion is the name for the site of God’s holy temple.”
    sources: [lefevre-jst-psalms, ot-minute-psalms-1-20, oshb-wlc, lds-scriptures]
  - ref: 2
    phrase: walketh uprightly
    kind: words
    title: Uprightly is the word for whole
    body: |
      “Uprightly” translates a Hebrew word for wholeness: applied to a person it means “sound, wholesome, unimpaired, innocent, having integrity.” A modern translation has “Those who walk blamelessly.”

      It is the word the LORD used to Abram, where the King James has “perfect”: “walk before me, and be thou perfect” ([[Gen. 17:1]]).
    sources: [bdb, nrsvue, oshb-wlc]
  - ref: 3
    phrase: backbiteth not with his tongue
    kind: words
    title: Backbiting is going about with a tale
    body: |
      To backbite, in the Hebrew, is to go about as a slanderer. The verb is formed from the word for foot and means to “foot it, go about,” here “maliciously, as slanderer”; the line is “he talks no slander upon his tongue.” In another form the verb is used when Mephibosheth tells David what his servant has done: “he hath slandered thy servant unto my lord the king” ([[2 Sam. 19:27]]).

      The law has the same picture of a slanderer on the move: “Thou shalt not go up and down as a talebearer among thy people” ([[Lev. 19:16]]).

      The line stands in parallel with the last clause of verse 2. The one who speaks truth in his heart is the one with no slander on his tongue.
    sources: [bdb, nrsvue]
  - ref: 4
    phrase: a vile person is contemned
    kind: words
    title: The reprobate despised, those who fear the LORD honoured
    body: |
      The “vile person” is a reprobate, and the line is half of a pair about whose standing this man respects. The Hebrew word is a form of the verb to “be rejected.” Jeremiah uses it of silver: “Reprobate silver shall men call them, because the LORD hath rejected them” ([[Jer. 6:30]]). Here it stands opposite “them that fear the LORD.” “Contemned” means despised, and a modern translation has “in whose eyes the wicked are despised.” As the King James reads it, the verse says where his honour goes: to those who fear the LORD, and not to the reprobate.

      The Hebrew can be divided differently, and one older reading takes the first half of the man himself: “despicable is he in his own eyes, worthy to be despised.” On that reading the verse sets his low view of himself against the respect he shows to others, “and the standard by which he judges is the fear of God.” Its example is David, who said on the day he brought up the ark, “I will yet be more vile than thus, and will be base in mine own sight” ([[2 Sam. 6:22]]). The line “is mostly translated” as the King James has it.
    sources: [bdb, nrsvue, delitzsch-psalms]
  - ref: 4
    phrase: sweareth to his own hurt, and changeth not
    kind: words
    title: An oath kept though it costs him
    body: |
      The line describes a man who keeps his sworn word when keeping it has turned to his loss. Modern translations say it plainly: “who stand by their oath even to their hurt,” or “who keeps his oath even when it hurts.” The verb behind “changeth” means to “change, alter,” and it has no object in the Hebrew.

      One older reading hears the law of Moses in both halves. “To his own hurt” is the wording of the law on rash oaths, “if a soul swear, pronouncing with his lips to do evil, or to do good” ([[Lev. 5:4]]), and “changeth” is the verb of the law of vows, which forbids exchanging an animal once it has been vowed ([[Lev. 27:10]]). On this reading the man’s fear of the LORD shows in “the self-denying strictness with which he performs his vows.”

      The ancient Greek translation has a different line: “He swears to his neighbour, and disappoints him not.” A rendering “to his neighbour” takes the word for “hurt” as the word for neighbour, and the same older reading holds that the sense is “entirely misapprehended” when the line is rendered so.
    sources: [nrsvue, skinner-seeing-god, bdb, oshb-wlc, delitzsch-psalms, lxx-rahlfs]
  - ref: 5
    phrase: putteth not out his money to usury
    kind: history
    title: Interest on a loan to a brother
    body: |
      “Usury” here is interest on a loan, which the law of Moses forbade an Israelite to take from a brother. The Hebrew noun means “interest, usury (literally something bitten off),” and a modern translation has “who do not lend money at interest.” The psalm’s phrase is the phrase of the law: “Thou shalt not give him thy money upon usury, nor lend him thy victuals for increase” ([[Lev. 25:37]]).

      In Exodus the borrower is poor: “If thou lend money to any of my people that is poor by thee, thou shalt not be to him as an usurer, neither shalt thou lay upon him usury” ([[Ex. 22:25]]). Leviticus gives the reason: “Take thou no usury of him, or increase: but fear thy God; that thy brother may live with thee” ([[Lev. 25:36]]). Deuteronomy states the rule for any brother and permits interest from a foreigner ([[Deut. 23:19–20]]).
    sources: [bdb, nrsvue, lds-scriptures]
  - ref: 5
    phrase: He that doeth these things
    kind: structure
    title: Ten requirements, perhaps counted on the fingers
    body: |
      “These things” have been counted as ten, and the number may be deliberate. “Scholars have noted that there are ten requirements for temple entry listed in this psalm, perhaps following the pattern of the Ten Commandments,” five of them stated positively and five negatively.

      Two reasons have been offered for the number. Ten “connoted wholeness, completeness, and correctness.” And it has been proposed that worshippers had to recite the conditions from memory, “using their ten fingers as memory devices.”

      The count is a reading of the list, since the psalm gives no number. Read so, the psalm preserves something like “an ancient certification of temple worthiness.” Latter-day Saint writers have compared it with a temple recommend, though whether that “is a valid connection” has been left open.
    sources: [ot-minute-psalms-1-20, skinner-seeing-god, hopkin-psalms-sung]
  - ref: 5
    phrase: shall never be moved
    kind: words
    title: The promise is to stand fast
    body: |
      The last line promises that this person will not be shaken, and it does not repeat the question’s words about dwelling. The verb means to “be shaken, moved, overthrown,” and with a negative it is used “often of righteous, as secure.” The next psalm has it: “because he is at my right hand, I shall not be moved” ([[Ps. 16:8]]).

      The change of wording has been noticed. The psalm might have closed by saying that such a man shall dwell on the hill, and “the concluding sentence takes a different form.” On one older reading the line still answers the question, in its inward sense: “he stands fast, being upheld by Jahve, hidden in His fellowship.” Where the psalm is read as an exchange at the gate (see the note on verse 1), this line is the priest’s blessing.
    sources: [bdb, oshb-wlc, delitzsch-psalms, ot-minute-psalms-1-20]

christ: |
  The dwelling the psalm asks about is the LORD’s, and Restoration scripture speaks of dwelling in His presence with Jesus Christ named. The cross-references at verse 1 in the Church’s edition lead to “These shall dwell in the presence of God and his Christ forever and ever” ([[D&C 76:62]]), and to “no unclean thing can dwell there, or dwell in his presence” ([[Moses 6:57]]), a verse that goes on to name “the Son of Man, even Jesus Christ, a righteous Judge.”

  One older reading sets the psalm’s answer beside the Savior’s saying as He concludes the Sermon on the Mount: “Not every one that saith unto me, Lord, Lord, shall enter into the kingdom of heaven; but he that doeth the will of my Father which is in heaven” ([[Matt. 7:21]]).

explore: |
  - **The companion psalm.** [[Ps. 24:3–6]] asks about the hill of the LORD again.
  - **Isaiah’s version.** [[Isa. 33:14–17]], which has been called “a fine variation of this Psalm.”
  - **The LORD’s tent in other psalms.** [[Ps. 5:4]]; [[Ps. 27:4–5]]; [[Ps. 61:4]].
  - **A fuller study.** Andrew C. Skinner, “Seeing God in His Temple: A Significant Theme in Israel’s Psalms” (2013 Sperry Symposium), reads Psalm 15 beside Psalm 24 and beside the purity declarations required at Egyptian temples.

parallels:
  - ref: Ps. 24:3–5
    note: The question about the hill of the LORD, answered with clean hands and a pure heart.
  - ref: Isa. 33:14–16
    note: A question about who can dwell with the devouring fire, answered with a list of the same kind.
  - ref: Ps. 2:6
    note: The King James verse with “holy hill of Zion,” the wording Joseph Smith’s revision gives verse 1.
  - ref: Lev. 25:36–37
    note: The law against lending to a brother at interest (also Ex. 22:25; Deut. 23:19–20).
  - ref: D&C 76:62
    note: Those who dwell in the presence of God and His Christ.

