chapter: 51
title: Create in Me a Clean Heart
tagline: A king who has taken a man’s wife and then his life asks God to blot out the sin, and then asks for more than that, a heart made new, and offers a broken one.
when: 'By its title, David’s, when Nathan the prophet came to him after he had gone in to Bathsheba (2 Samuel 11–12)'

setting: |
  The title reads, “To the chief Musician, A Psalm of David, when Nathan the prophet came unto him, after he had gone in to Bath-sheba.” The psalm is attributed to David and is believed to have been written sometime after Nathan’s rebuke. The title asks that it be read there.

  The story is in 2 Samuel 11–12. David lay with Bathsheba, the wife of Uriah the Hittite, and she conceived. He arranged Uriah’s death in battle and took her as his wife. “But the thing that David had done displeased the LORD” ([[2 Sam. 11:27]]). Nathan came with a story of a rich man who took a poor man’s one ewe lamb, let the king pass sentence, and said, “Thou art the man” ([[2 Sam. 12:7]]). David’s reply in the story is one sentence: “I have sinned against the LORD” ([[2 Sam. 12:13]]). The psalm is that sentence at full length. The Hebrew title has one verb for both visits: Nathan “came” to David as David had “gone in” to Bathsheba.

  It is a lament, of the kind called penitential, a psalm of repentance; Psalm 32 is tied to the same fall. Later scripture returns to it. Paul quotes verse 4, Lehi’s prayer in his dream is very close to verse 1, and the risen Lord asks of all people the offering named in verse 17.

thread: |
  The psalm moves from asking God to remove something to asking Him to make something. Verses 1–9 are about the sin: blot it out, wash it, cleanse it. The three requests of verses 1–2 come back in verses 7–9, and the first part closes on the verb it opened with, “blot out.” Then verse 10 turns. “Create in me a clean heart” asks for what was not there before, and the next three lines ask for a spirit made steadfast, a Spirit not taken away, and a spirit made willing.

  Only after that does David say what he will do: “Then will I teach transgressors thy ways.” The vow of praise that ends a lament (see [[Ps. 22:1]]) is here first a vow to teach other sinners, and before he sings he asks the Lord to open his lips.

  Two things set this lament apart. It has no enemies in it: the trouble David brings is himself. And nearly every line is confession or request. He brings no offering until verse 17, and the one he names there is the one God will not despise: “a broken and a contrite heart.” The last two verses widen the prayer from the king to his city.

sections:
  - range: 1-2
    heading: According to thy lovingkindness
    plain: |
      Have mercy on me, O God, in keeping with Your steadfast love; in keeping with Your many compassions, wipe out my transgressions. Wash me through and through from my iniquity, and make me clean from my sin.
  - range: 3-6
    heading: Against thee only have I sinned
    plain: |
      I know my transgressions, and my sin is always in front of me. Against You, You only, I have sinned, and I have done what is evil in Your eyes; so You are right when You speak and clear when You judge. I was brought forth in iniquity, and in sin my mother conceived me. You desire truth in the inmost parts, and in the hidden place You will teach me wisdom.
  - range: 7-9
    heading: Purge me, and I shall be clean
    plain: |
      Purge me with hyssop and I shall be clean; wash me and I shall be whiter than snow. Let me hear joy and gladness, so that the bones You have crushed may rejoice. Hide Your face from my sins, and wipe out all my iniquities.
  - range: 10-12
    heading: Create in me a clean heart
    plain: |
      Create a clean heart for me, O God, and make a steadfast spirit new within me. Do not throw me out from before Your face, and do not take Your holy Spirit from me. Give me back the joy of Your salvation, and hold me up with a willing spirit.
  - range: 13-17
    heading: The sacrifices of God
    plain: |
      Then I will teach transgressors Your ways, and sinners will turn back to You. Deliver me from the guilt of blood, O God, God of my salvation, and my tongue will sing of Your righteousness. Lord, open my lips, and my mouth will tell Your praise. You do not desire sacrifice, or I would give it; a burnt offering does not please You. The sacrifices of God are a broken spirit. A broken and crushed heart, O God, You will not despise.
  - range: 18-19
    heading: Do good unto Zion
    plain: |
      In Your good pleasure do good to Zion; build the walls of Jerusalem. Then You will be pleased with sacrifices of righteousness, with burnt offering and whole burnt offering; then bullocks will be offered on Your altar.

notes:
  - ref: 1
    phrase: according to thy lovingkindness
    kind: words
    title: Hesed, the ground of the plea
    body: |
      David’s first appeal is to what God is, and the word that carries it is *hesed*, “lovingkindness.” He brings no record of service and no excuse. The mercy he asks for is measured by two things in God, His lovingkindness and “the multitude of thy tender mercies.”

      *Hesed* is the love that belongs to a covenant; the note on [[Hos. 2:19]] says more of the word. President Russell M. Nelson taught that it is “a special kind of love and mercy that God feels for and extends to those who have made a covenant with Him,” and he said what it does for someone who stands where David stands: “He will forgive them when they repent. And should they stray, He will help them find their way back to Him.” In this verse it is God’s *hesed* “in redemption from sin.”

      The word had already been spoken to David. When the Lord promised him a lasting house, He said of David’s heir, “my mercy shall not depart away from him, as I took it from Saul” ([[2 Sam. 7:15]]), and “mercy” there is *hesed*. The prophet who carried that promise to David was Nathan, the same prophet who now came with the rebuke.

      The second measure, “tender mercies,” is a different Hebrew word, compassion, used “usually of God.” Lehi prays in nearly these words in the dark waste of his dream, “that he would have mercy on me, according to the multitude of his tender mercies” ([[1 Ne. 8:8]]). These are the only two verses in the Bible and the Book of Mormon that join that plea for mercy to that phrase. The likeness has been taken to show that Lehi, or Nephi in recording him, very likely had this psalm in mind.
    sources: [nelson-everlasting-covenant, oshb-wlc, bdb, lds-scriptures, sc-knowhy-325]

  - ref: 2
    phrase: Wash me throughly from mine iniquity
    kind: symbol
    title: Three pictures of one request
    body: |
      The first two verses ask for one thing with three verbs, and each has its own picture. “Blot out” is to “obliterate from the memory,” so that the transgressions are “no more remembered by God against sinner.” “Wash” is the laundering verb. Its ordinary use is to “wash garments (i.e. by treading),” and it is used of washing a person “only in poetry.” “Cleanse” belongs to the sanctuary: the same verb is used of Israel’s being made clean from all its sins “by the sin-offering of the atonement day.”

      “Throughly” is the older spelling of “thoroughly.”

      All three verbs return. “Wash” and the word for “clean” are in verse 7, and “blot out” closes verse 9, so that the same plea stands on both sides of the confession in verses 3–6. He asks, says why he must ask, and asks again.
    sources: [bdb, oshb-wlc, nrsvue]

  - ref: 4
    phrase: Against thee, thee only, have I sinned
    kind: scripture
    title: Against thee only, with Uriah dead
    body: |
      David’s line does not deny what he did to Uriah and Bathsheba, and it is worded like the story of Nathan’s rebuke. The charge there was, “Wherefore hast thou despised the commandment of the LORD, to do evil in his sight?” ([[2 Sam. 12:9]]). David’s reply in the story was “I have sinned against the LORD” ([[2 Sam. 12:13]]). “Sinned” in the psalm is the same Hebrew verb, and “done this evil in thy sight” has the Hebrew words of the charge. The murder is not out of view either: verse 14 names it.

      Why “only”? One reading is that a sense of sin that goes deep enough sees any sin “in its ultimate ground as sin against Him alone,” because every tie to another person rests on the tie to God, “the sole and highest Lawgiver and Judge.” Scripture speaks this way elsewhere. Joseph, refusing his master’s wife, says, “how then can I do this great wickedness, and sin against God?” ([[Gen. 39:9]]). And in modern revelation the Lord counts David’s wrong as done to Himself: “in none of these things did he sin against me save in the case of Uriah and his wife” ([[D&C 132:39]]).

      The second half of the verse gives the purpose of the confession, that God be “justified” and “clear” in His sentence. In the story David had passed sentence before he knew whom he was judging: “the man that hath done this thing shall surely die” ([[2 Sam. 12:5]]). Here he says that the Judge is right. Paul quotes the line to say that God is true though every man be a liar ([[Rom. 3:4]]); his wording, “mightest overcome when thou art judged,” is that of the Greek translation of the psalm.
    sources: [lds-scriptures, oshb-wlc, delitzsch-psalms, lxx-rahlfs]

  - ref: 7
    phrase: Purge me with hyssop
    kind: symbol
    title: Hyssop, the leper, and the touch of the dead
    body: |
      Hyssop was the plant used for sprinkling in the law’s rites of cleansing, and David asks God to use it on him. It was “a kind of wild marjoram.” A bunch of it put the lamb’s blood on the doorposts at the first Passover ([[Ex. 12:22]]). It was used “for sprinkling purposes in the purification of lepers.” And with it “a clean person” sprinkled the water of purification on anyone who had touched “a bone, or one slain, or one dead, or a grave” ([[Num. 19:18]]).

      “Purge” is the right word for it. The Hebrew verb is the ordinary word for sinning, in a form that means to purify from uncleanness, and it is used in that sense of the cleansing of the leper’s house, of the person sprinkled with the water of purification, and of this verse. David’s request is made in the language of those rites.
    sources: [bd-hyssop, bdb, oshb-wlc, lds-scriptures]

  - ref: 10
    phrase: Create in me a clean heart
    kind: words
    title: Create is the verb of Genesis 1
    body: |
      “Create” is *bara*, the verb of “In the beginning God created the heaven and the earth” ([[Gen. 1:1]]), and the Hebrew Bible uses it “always of divine activity.” No one but God is its subject. Here it is used of a transformation, as it is of the new heaven and earth that take the place of the old. David has asked to be washed; now he asks for something to be made.

      The second line says it again with “renew,” and the “right” spirit of that line is a steadfast one.

      What David asks for himself the Lord later promises to all Israel: “A new heart also will I give you, and a new spirit will I put within you” ([[Ezek. 36:26]]).
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]

  - ref: 11
    phrase: take not thy holy spirit from me
    kind: history
    title: The Spirit that came on David and departed from Saul
    body: |
      One reading ties this plea to what David had seen happen to Saul. On the day Samuel anointed him, “the Spirit of the LORD came upon David from that day forward” ([[1 Sam. 16:13]]), and the next verse begins, “But the Spirit of the LORD departed from Saul” ([[1 Sam. 16:14]]). David knew that king at close hand, first at his court and then as a fugitive from him. On this reading the Spirit he fears to lose “is none other than that which came upon him by means of the anointing.” To be rejected “as He rejected Saul” would be the worst that could come to him as king and as a man.

      “Holy spirit” is in Hebrew “the spirit of thy holiness,” and the phrase is found again in Isaiah, of Israel who “vexed his holy Spirit” ([[Isa. 63:10]]).

      The first half of the verse has a word that verse 9 has already used. “Presence” is the Hebrew word for face. David has just asked God to hide His face from the sins, and now he asks not to be cast away from that face himself.
    sources: [lds-scriptures, oshb-wlc, bdb, bd-david, delitzsch-psalms]

  - ref: 12
    phrase: uphold me with thy free spirit
    kind: words
    title: A willing spirit
    body: |
      The “free spirit” is a willing spirit, and the Hebrew has no word for “thy.” The adjective means inclined, generous, noble, so that the phrase is “a willing spirit”; a modern translation has “sustain in me a willing spirit.”

      Read so, there are three spirits in verses 10–12. The first and the third are David’s own spirit, to be made steadfast and willing. The one between them is God’s holy Spirit, and David asks only that it not be taken.
    sources: [oshb-wlc, bdb, nrsvue]

  - ref: 14
    phrase: Deliver me from bloodguiltiness
    kind: scripture
    title: Bloodguiltiness, and what became of David
    body: |
      “Bloodguiltiness” is the Hebrew word for blood in the plural, which means “guilt of bloodshed,” and with it David names the murder. Nathan had said it without softening: “thou hast killed Uriah the Hittite with the sword” ([[2 Sam. 12:9]]).

      What answer did the prayer receive? Nathan’s word in the story is double. “The LORD also hath put away thy sin; thou shalt not die” ([[2 Sam. 12:13]]); and yet “the sword shall never depart from thine house” ([[2 Sam. 12:10]]). Latter-day revelation says more. The Lord says of him that “he hath fallen from his exaltation, and received his portion” ([[D&C 132:39]]). The Church’s teaching is that David could be forgiven of his sins except for the murder of Uriah, and that he received a promise that his soul would not be left in hell. Joseph Smith taught, as Wilford Woodruff recorded the sermon, that David sought repentance “carefully with tears” but could obtain it only through hell. The words of the promise are those of a psalm, “thou wilt not leave my soul in hell” ([[Ps. 16:10]]), which Peter reads of the resurrection of Christ while saying of David that he “is both dead and buried” ([[Acts 2:29]]).

      Psalm 51 itself announces no pardon. It asks.
    sources: [oshb-wlc, bdb, lds-scriptures, bd-david, scripture-helps-ps-49, jsp-discourse-1844-03-10]

  - ref: 16
    phrase: thou desirest not sacrifice
    kind: words
    title: What God desires, three times
    body: |
      The psalm uses one Hebrew verb for what God wants three times, and together the three answer whether He wants sacrifice. “Thou desirest truth in the inward parts” (verse 6). “Thou desirest not sacrifice” (verse 16). “Then shalt thou be pleased with the sacrifices of righteousness” (verse 19), where “be pleased with” is the same verb. Sacrifice is not thrown out. It comes third. God wants the inward thing first, and the altar is welcome after it.

      David is not alone in saying so. Samuel told Saul, “to obey is better than sacrifice” ([[1 Sam. 15:22]]). In the psalm just before this one God says, “I will take no bullock out of thy house” ([[Ps. 50:9]]), and an earlier psalm has this same verb: “Sacrifice and offering thou didst not desire” ([[Ps. 40:6]]). The offerings were commanded. What the Psalms show in speaking of the broken heart is that “the more spiritual type of sacrifice was what was truly important.”

      [The Sacrifice God Desires](/psalms/themes/the-sacrifice-god-desires/) follows the verb into Psalm 40 and the question of sacrifice through the Psalms.
    sources: [oshb-wlc, bdb, lds-scriptures, sc-knowhy-27]

  - ref: 17
    phrase: a broken and a contrite heart
    kind: scripture
    title: The crushed heart, from David to the Savior’s command
    body: |
      The offering David names is his own crushed heart, and later scripture makes it the offering asked of everyone. “Contrite” means crushed, and it is the verb of verse 8, “the bones which thou hast broken,” where it means to “crush to pieces.” He asks that God not “despise” it, and that is Nathan’s word for what David had done: “thou hast despised me” ([[2 Sam. 12:10]]).

      The four words broken, heart, contrite, and spirit come together in only two verses of the Bible, this one and [[Ps. 34:18]]. The Book of Mormon has them on Lehi’s lips: the Messiah offers Himself “unto all those who have a broken heart and a contrite spirit” ([[2 Ne. 2:7]]). Psalms such as this one “may have been included on the plates of brass.” Then the risen Lord, speaking to the Nephites out of the darkness, did away with the animal offerings and kept David’s: “ye shall offer for a sacrifice unto me a broken heart and a contrite spirit” ([[3 Ne. 9:20]]). The same command is given in this dispensation ([[D&C 59:8]]).

      Elder Neal A. Maxwell said what kind of offering this is: “real, personal sacrifice never was placing an animal on the altar. Instead, it is a willingness to put the animal in us upon the altar and letting it be consumed!”
    sources: [oshb-wlc, bdb, lds-scriptures, hilton-psalms-bom, sc-knowhy-198, maxwell-deny-yourselves]

  - ref: 18
    phrase: build thou the walls of Jerusalem
    kind: history
    title: Why a confession ends with Jerusalem’s walls
    body: |
      The last two verses turn from one man to the city, and whether they are David’s own or a later addition is an open question.

      One explanation is that the verses were added later. A prayer to build Jerusalem’s walls, “rebuild the walls” in a modern translation, suits the exiles in Babylon, whose way home lay through penitence, and it is a natural supposition that these lines are “a liturgical addition made by the church of the Exile.”

      The other is that they are David’s. On this reading the request is “not inadmissible in the mouth of David,” since the Hebrew “build” can mean to go on building what is unfinished, and at this point “David’s prayer for himself here passes over into an intercession on behalf of all Israel.”

      Either way the ending completes verse 16: the psalm “comes back to the material sacrifices that are offered in a right state of mind.”
    sources: [delitzsch-psalms, nrsvue]

christ: |
  What David asks for, the apostles preach as given through Jesus Christ. Peter, preaching in the temple, puts two of the psalm’s words in one sentence: “Repent ye therefore, and be converted, that your sins may be blotted out” ([[Acts 3:19]]). “Blot out” is David’s first request, and “converted” is what he vowed sinners would be.

  The offering of verse 17 is the one the risen Savior asks for, as a sacrifice “unto me” ([[3 Ne. 9:20]]). Lehi joins it to the Savior’s own offering: the Messiah “offereth himself a sacrifice for sin, to answer the ends of the law” ([[2 Ne. 2:7]]), for those who have a broken heart and a contrite spirit. Amulek says the whole law pointed to it, “and that great and last sacrifice will be the Son of God” ([[Alma 34:14]]).

  The Hebrew word behind “contrite” means crushing, and a closely related form of it is the “bruised” of Isaiah’s Servant: “he was bruised for our iniquities” ([[Isa. 53:5]]).

explore: |
  - **The story behind the title.** Read [[2 Sam. 11:1–27]] and [[2 Sam. 12:1–25]], and then the psalm again.
  - **The other psalm of David’s fall.** [[Ps. 32:1–5]] is tied to the same occasion and speaks from the far side of confession.
  - **Lehi’s dream.** Read [[1 Ne. 8:8–12]] beside verses 1 and 7–8, for the words they share.
  - **The broken heart.** Read [[Isa. 57:15]] beside verse 17.

parallels:
  - ref: 2 Sam. 12:13
    note: David’s confession to Nathan, “I have sinned against the LORD”; compare verse 4.
  - ref: Rom. 3:4
    note: Paul quotes verse 4, in the wording of the Greek translation.
  - ref: 1 Ne. 8:8
    note: Lehi prays for mercy “according to the multitude of his tender mercies”; compare verse 1.
  - ref: Ezek. 36:26
    note: The Lord promises Israel a new heart and a new spirit; compare verse 10.
  - ref: Acts 3:19
    note: Peter preaches that sins may be “blotted out”; compare verses 1 and 13.
  - ref: 3 Ne. 9:20
    note: The risen Lord asks for the sacrifice of a broken heart and a contrite spirit; compare verse 17.

