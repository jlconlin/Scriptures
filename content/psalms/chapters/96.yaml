chapter: 96
title: Say Among the Nations
tagline: All the earth is called to sing a new song and to carry its news to the nations; the gods of the peoples are nothings, the LORD is King, and field and forest sing because He is coming to judge.
when: 'Undated; the psalm has no title. 1 Chronicles 16 has its lines in the song of the day David brought the ark to Jerusalem'

setting: |
  Psalm 96 has no title, and it names no author and no occasion. Scripture gives its lines a setting elsewhere, and the ancient Greek translation gives the psalm another.

  The first is in Chronicles. When the ark was brought into the tent David had pitched for it in Jerusalem, “David delivered first this psalm to thank the LORD into the hand of Asaph and his brethren” ([[1 Chr. 16:7]]), and verses 23–33 of the song that follows are this psalm, nearly line for line. That song “seems to be an amalgamation of three other canonical psalms.” The note on verse 6 sets the two texts side by side and says what has been made of the likeness.

  The Greek translation supplies a title: “When the house was built after the Captivity, a Song of David.” One older reading takes the psalm, with the second half of that title, for a song from after the exile. The psalm itself speaks of a sanctuary and of courts, and it does not say whose.

  It stands in the fourth of the Psalter’s five books (Psalms 90–106), many of whose psalms are read of the millennial day and the Messiah’s reign. It shares its opening call for a new song with Psalm 98 (see [[Ps. 33:3]]) and its cry “The LORD reigneth” with Psalms 93, 97 and 99 (see [[Ps. 93:1]]).

thread: |
  Psalm 96 is three summonses, each to a wider audience than the last, and **what begins as a song for the LORD ends as news for the world: say among the nations that He reigns, because He is coming.**

  The first summons is to sing (verses 1–3). “Sing” comes three times, and by the third the singing has become telling: shew forth His salvation, declare His glory among the nations. Verses 4–6 give the reason, and it is a comparison. The LORD is to be feared “above all gods,” and the next line says what those gods amount to. They are idols, and He made the heavens.

  The second summons is to the nations themselves (verses 7–9). “Give” comes three times, as “sing” did. The families of the peoples are to do more than hear about the LORD. They are to bring an offering and come into His courts.

  The third summons turns on verse 10, the one line the psalm puts into its hearers’ mouths: “the LORD reigneth.” From there the verbs change. The psalm stops commanding people and begins wishing joy on everything else, the heavens, the earth, the sea, the field, and last the trees of the wood (verses 11–12). The reason is held back to the final verse and then said twice: “for he cometh, for he cometh to judge the earth.”

  So the reasons move from what the LORD is to what He is about to do. One older reading hears in the psalm the conviction that the worship of the LORD “is destined for mankind at large,” given its “most triumphantly joyous” expression.

sections:
  - range: 1-3
    heading: Sing, and tell the nations
    plain: |
      Sing a new song to the LORD; sing to the LORD, all the earth. Sing to the LORD and bless His name; carry the good news of His salvation from one day to the next. Tell of His glory among the nations, and of His marvelous works among all the peoples.
  - range: 4-6
    heading: Above all gods
    plain: |
      For the LORD is great and greatly to be praised; He is to be held in awe above all gods. For all the gods of the peoples are worthless idols, but the LORD made the heavens. Honor and majesty are before Him; strength and beauty are in His sanctuary.
  - range: 7-9
    heading: The nations called to His courts
    plain: |
      Give to the LORD, you families of the peoples, give to the LORD glory and strength. Give to the LORD the glory that belongs to His name; bring an offering and come into His courts. Worship the LORD in holy splendor; tremble before Him, all the earth.
  - range: 10-13
    heading: The King is coming
    plain: |
      Say among the nations, “The LORD is King.” The world stands firm and cannot be shaken; He will judge the peoples with equity. Let the heavens be glad and the earth rejoice; let the sea roar, and everything that fills it. Let the field exult, and everything in it. Then all the trees of the forest will sing for joy before the LORD, for He is coming, He is coming to judge the earth. He will judge the world with righteousness and the peoples with His faithfulness.

notes:
  - ref: 1
    phrase: a new song
    kind: scripture
    title: A new song for all the earth
    body: |
      What sets this new song apart is who is to sing it: “all the earth.” Why a song is called new is taken up at [[Ps. 33:3]]. One older reading finds the new thing here in the psalm’s own reach: “The new song assumes a new form of things,” the beginning of a recognition of the LORD “throughout the whole world of nations.”

      Isaiah opens a song with the same words, “Sing unto the LORD a new song, and his praise from the end of the earth” ([[Isa. 42:10]]), and that verse goes on to call on those who go down to the sea “and all that is therein,” as this psalm calls on the sea “and the fulness thereof” (verse 11).

      Modern revelation gives the words of a new song and says when it will be sung. It belongs to the day when all who remain “shall know me,” and they “shall lift up their voice, and with the voice together sing this new song” ([[D&C 84:98]]). The song itself follows in verses 99–102.
    sources: [lds-scriptures, delitzsch-psalms]
  - ref: 2
    phrase: shew forth his salvation
    kind: words
    title: Shew forth is the verb for bringing good tidings
    body: |
      “Shew forth” translates the Hebrew verb for carrying good news, so the singers are being sent as messengers. The verb means to “bear tidings,” and in this verse to “herald as glad tidings” the salvation of God.

      It is the verb of Isaiah’s messenger on the mountains: “How beautiful upon the mountains are the feet of him that bringeth good tidings, that publisheth peace; that bringeth good tidings of good, that publisheth salvation; that saith unto Zion, Thy God reigneth!” ([[Isa. 52:7]]). His tidings are of salvation, and his words are that God reigns. The psalm’s tidings are of salvation too, and the words it gives the nations in verse 10 are that the LORD reigns.

      “From day to day” makes it a standing errand and not a single announcement.
    sources: [oshb-wlc, bdb, lds-scriptures]
  - ref: 5
    phrase: idols
    kind: words
    title: Gods that are nothings
    body: |
      Verse 5 answers the question verse 4 raises, whether there are other gods to rank the LORD above, with a play on words. “Gods” in both verses is *elohim*. “Idols” is *elilim*, a word that sounds like it and means “worthless gods, idols.” Whatever its origin, the word was “associated by the prophets with idea of worthlessness” and used in ironic contrast with the words for God. In Hebrew the line says that all the *elohim* of the peoples are *elilim*, and the second half of the verse sets against them what the LORD has done: He “made the heavens.”

      Psalm 95 has just called the LORD “a great King above all gods,” and whether such a line grants that other gods exist is taken up at [[Ps. 95:3]]. Where the Psalms speak of gods as a heavenly company around Him, the question is a different one; see [[Ps. 82:1]].
    sources: [oshb-wlc, bdb, lds-scriptures]
  - ref: 6
    phrase: in his sanctuary
    kind: scripture
    title: The same song in Chronicles, before there was a temple
    body: |
      In Chronicles this psalm is sung before the ark in David’s tent, and the lines that mention a temple read differently there. Verses 23–33 of the song in 1 Chronicles 16 correspond to the whole psalm. Where the psalm has “strength and beauty are in his sanctuary,” Chronicles has “strength and gladness are in his place” ([[1 Chr. 16:27]]). Where the psalm says “come into his courts,” Chronicles says “bring an offering, and come before him” ([[1 Chr. 16:29]]). One older reading gives a reason for the first change: the chronicler may have altered the word “because when the Ark was brought in, the Temple” was not yet built.

      Chronicles also has no “new song.” Its version begins at the psalm’s second line, “Sing unto the LORD, all the earth; shew forth from day to day his salvation” ([[1 Chr. 16:23]]). The cry of verse 10 stands later there, among the rejoicing of heaven and earth, and it is put in other mouths: “let men say among the nations, The LORD reigneth” ([[1 Chr. 16:31]]). And the song stops at “because he cometh to judge the earth” ([[1 Chr. 16:33]]), without the psalm’s last line about how He will judge.

      Which text came first is not settled by setting them side by side. The song in Chronicles joins this psalm to parts of Psalms 105 and 106. That “may well mean” the chapter was composed later than the psalms it resembles, though on the same reading Chronicles still “preserves the authentic historical setting” of Psalm 105, the first of the three. One older reading is less guarded and holds that the chronicler “strings together familiar reminiscences of the Psalms.” What Chronicles adds is a scene: Levites with psalteries, harps and cymbals, and priests with trumpets, before the ark on the day it came to Jerusalem.
    sources: [lds-scriptures, skinner-seeing-god, delitzsch-psalms]
  - ref: 7
    phrase: O ye kindreds of the people
    kind: scripture
    title: The lines of Psalm 29, addressed to the nations
    body: |
      Verses 7–9 have the opening lines of Psalm 29 with a different address. That psalm begins, “Give unto the LORD, O ye mighty, give unto the LORD glory and strength. Give unto the LORD the glory due unto his name; worship the LORD in the beauty of holiness” ([[Ps. 29:1–2]]). The “mighty” there are heavenly beings (see [[Ps. 29:1]]). Here the same three “give” lines are spoken to the “kindreds of the people,” which a modern translation renders “families of the peoples.” What that psalm asks of heaven, this one asks of every family on earth.

      The psalm also has a line that Psalm 29 does not: “bring an offering, and come into his courts.” The peoples are to come in person, with a gift, into His courts. Psalm 22 says the same of them: “all the kindreds of the nations shall worship before thee” ([[Ps. 22:27]]).

      For “the beauty of holiness,” see [[Ps. 29:2]].
    sources: [lds-scriptures, nrsvue]
  - ref: 10
    phrase: the LORD reigneth
    kind: scripture
    title: What the nations are to be told
    body: |
      Verse 10 gives the words the singers are to carry to the nations, and they are short: the LORD reigns, the world stands firm, and He will judge the peoples rightly. Where the King James has “heathen,” a modern translation has “Say among the nations, ‘The LORD is king!’” The cry itself, and whether it reports a standing fact or an accession, is discussed at [[Ps. 93:1]] and [[Ps. 47:8]].

      The second clause is the line of Psalm 93 about the world, which the King James puts in the present there (“is stablished”) and in the future here; see [[Ps. 93:2]]. A modern translation makes it a present fact here as well: “The world is firmly established; it shall never be moved.”

      The third clause is the psalm’s first mention of judging. Why that is something to sing about is the subject of the note on verse 12.
    sources: [nrsvue, lds-scriptures]
  - ref: 12
    phrase: then shall all the trees of the wood rejoice
    kind: symbol
    title: Why the trees sing at a judgment
    body: |
      The judging that sea, field and forest rejoice at is wider than passing sentence. The Hebrew verb of verse 13 means to “act as law-giver, judge, governor,” which covers “giving law, deciding controversies and executing law.” Another psalm puts the two side by side and makes them the nations’ reason for joy: “O let the nations be glad and sing for joy: for thou shalt judge the people righteously, and govern the nations upon earth” ([[Ps. 67:4]]).

      The psalm says how He will judge three times over: “righteously” (verse 10), “with righteousness,” and “with his truth,” where a modern translation has “the peoples in his faithfulness.”
    sources: [oshb-wlc, bdb, esv, lds-scriptures]

christ: |
  The LORD of this psalm is Jehovah, and Jehovah is Jesus Christ before His birth. The psalm calls Him three things: the Maker of the heavens (verse 5), the King (verse 10), and the Judge who is coming (verse 13). Of the last the Savior spoke Himself: “For the Father judgeth no man, but hath committed all judgment unto the Son” ([[John 5:22]]).

  The last line of verse 13 is nearly the one Paul speaks at Athens, where God “will judge the world in righteousness by that man whom he hath ordained” ([[Acts 17:31]]); see [[Ps. 9:8]], where the line first stands.

explore: |
  - **The song before the ark.** Read [[1 Chr. 16:7–36]] through. Its first part corresponds to [[Ps. 105:1–15]] and its close to [[Ps. 106:1]] and [[Ps. 106:47–48]], with Psalm 96 between them.
  - **The companion psalm.** [[Ps. 98:1–9]] opens with the same call for a new song and closes on the same coming to judge. Read the two together and see what each has that the other lacks.
  - **The cry.** [[Ps. 93:1]], [[Ps. 97:1]] and [[Ps. 99:1]] open with “The LORD reigneth”; only this psalm sends it to the nations as a message.

parallels:
  - ref: 1 Chr. 16:23–33
    note: The psalm as part of the song David delivered to Asaph when the ark came to Jerusalem, with “place” for “sanctuary” and no “new song.”
  - ref: Ps. 29:1–2
    note: The three “give” lines, there addressed to the heavenly beings and here to the families of the peoples.
  - ref: Isa. 42:10
    note: The same opening words, “Sing unto the LORD a new song,” with the sea and all that is in it.
  - ref: Isa. 52:7
    note: The bringer of good tidings, by the verb of verse 2, whose message is “Thy God reigneth!”
  - ref: Ps. 98:7–9
    note: The sea roars and the hills are joyful before the LORD, who comes to judge the earth.
  - ref: D&C 84:98
    note: The new song that all who know the Lord will sing together (the Church’s footnote to verse 1).
  - ref: John 5:22
    note: The Father has committed all judgment to the Son.

