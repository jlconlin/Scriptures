chapter: 121
title: He That Keepeth Thee
tagline: A traveler looks at the hills and asks where help will come from, answers that it comes from their Maker, and is then told six times over that the LORD will keep him.
when: 'Undated; the second of the fifteen songs of degrees (Psalms 120–134)'

setting: |
  The psalm names no author, no enemy and no occasion. It is the second of the fifteen songs of degrees; the title is explained at [[Ps. 120:1]]. This one was likely a hymn for pilgrims traveling to the temple, and what it promises suits a journey: a foot that does not slip, shade from the sun, safety at night, and a safe going out and coming in.

  The psalm before it is sung far from home, among people who hate peace ([[Ps. 120:5–6]]). The psalm after it begins, “I was glad when they said unto me, Let us go into the house of the LORD” ([[Ps. 122:1]]).

  As the King James reads it, the psalm asks God for nothing. After the question of verse 1 every line is a statement of trust. Verse 3 may be a wish instead; the note on [[Ps. 121:3]] gives that reading.

  Its title for God, the LORD “which made heaven and earth,” returns twice more in the songs of degrees ([[Ps. 124:8]]; [[Ps. 134:3]]).

thread: |
  Psalm 121 is **one question, one answer, and then the answer said over to the one who asked**. The question is in verse 1: where will my help come from? Verse 2 answers it in the same voice. Help comes from the LORD, and the reason for trusting it is that He made heaven and earth, which includes the hills the singer is looking at.

  At verse 3 the voice changes. “My” becomes “thy,” and someone speaks to the traveler until the end. What this voice says turns on one word. The King James has “keep” in verses 3–5 and “preserve” in verses 7–8, and they are the same Hebrew verb, used six times between verse 3 and verse 8.

  The promise moves between one person and the whole people. Verse 3 is said to “thee.” Verse 4 speaks of “he that keepeth Israel.” Verse 5 comes back to the one traveler: “The LORD is thy keeper.” From there the keeping is spread over every hour (“by day,” “by night”), every harm (“all evil”), every movement (“thy going out and thy coming in”) and all time (“from this time forth, and even for evermore”).

sections:
  - range: 1-2
    heading: Where does my help come from?
    plain: |
      I lift my eyes to the hills. Where will my help come from? My help comes from the LORD, who made heaven and earth.
  - range: 3-4
    heading: Your keeper does not sleep
    plain: |
      He will not let your foot slip; the One who keeps you will not doze. Look: the One who keeps Israel neither dozes nor sleeps.
  - range: 5-6
    heading: Shade by day and by night
    plain: |
      The LORD is your keeper. The LORD is your shade, close at your right hand. The sun will not strike you by day, nor the moon by night.
  - range: 7-8
    heading: Kept from this time forth
    plain: |
      The LORD will keep you from all evil; He will keep your life. The LORD will keep your going out and your coming in, from now on and for ever.

notes:
  - ref: 1
    phrase: from whence cometh my help
    kind: words
    title: A question, and the hills are not the answer
    body: |
      The second half of verse 1 is a question in Hebrew, and verse 2 answers it. The King James prints no question mark, and its line can be read as saying that help comes from the hills. The Hebrew word behind “from whence” is a question word, “whence?”, and a modern translation prints the line as a question: “from where will my help come?”

      Read that way, the hills are where the singer is looking when he asks, and they are not where help comes from. The answer passes over them to the One who made them: “My help cometh from the LORD, which made heaven and earth.” The psalm does not say which hills these are.
    sources: [bdb, biblehub-interlinear, nrsvue]

  - ref: 3
    phrase: He will not suffer thy foot to be moved
    kind: structure
    title: Someone begins to say “thy”
    body: |
      From verse 3 to the end someone speaks to the singer of verses 1–2, and the psalm does not say who. The change can be read two ways. On one reading the singer is speaking to himself: he has asked and answered his own question, and now “the answering one goes on speaking to the questioner.” On the other it is “the voice of another speaker, answering the first with words of encouragement,” and the psalm is “specially adapted for antiphonal singing,” that is, for voices that sing in turn, though “we cannot determine the precise manner in which it was sung.”

      Verse 3 may also be a wish and not yet a promise. Verse 3 uses the Hebrew “not” that is usual in wishes and prohibitions; verse 4 uses the plain “not.” The ancient Greek translation took verse 3 as a wish: “Let not thy foot be moved; and let not thy keeper slumber.” On this reading verse 4 answers the wish with a fact, introduced by “Behold”: “there is no need for such a prayer, for Israel’s keeper never sleeps.” The King James reads both verses as statements, and the Hebrew may allow that too: some grammarians hold that this negative can simply carry the speaker’s feeling about the act.

      On either reading verse 4 says more than verse 3. “Will not slumber” becomes “shall neither slumber nor sleep,” and “thee” becomes “Israel.” The nations could suppose that their gods slept, and verse 4 says that Israel’s keeper does not. On Carmel Elijah mocked the prophets of Baal when their god did not answer: “peradventure he sleepeth, and must be awaked” ([[1 Kgs. 18:27]]).
    sources: [delitzsch-psalms, cambridge-psalms, lxx-rahlfs, biblehub-interlinear, lds-scriptures]

  - ref: 4
    phrase: he that keepeth Israel
    kind: symbol
    title: A watchman who does not sleep
    body: |
      The picture is of a watchman, and the psalm says of this one what can be said of no human guard. The Hebrew word for “he that keepeth” is used especially of the watchman of a city, and the verse rules out sleep for this watchman twice, with two verbs.

      In their worst hours Israel’s own singers could still cry to the LORD as if He slept: “Awake, why sleepest thou, O Lord?” The note on [[Ps. 44:23]] sets that cry beside this verse.

      Verse 5 then says to one traveler what verse 4 says of the whole people: “The LORD is thy keeper.”
    sources: [bdb, biblehub-interlinear]

  - ref: 4
    phrase: shall neither slumber nor sleep
    kind: prophets
    title: President Hinckley’s conference theme
    body: |
      President Gordon B. Hinckley took this verse as the theme of an address at the April 1983 general conference and applied the keeper of Israel to the Church. President Spencer W. Kimball was too weak to attend in person.

      “The Almighty is blessing his church and his people. He is watching over them,” President Hinckley said, and the Lord “neither slumbers nor sleeps” as He guides and directs it. Of the concern that a President of the Church will always be an elderly man he said, “I do not worry,” and he closed with the psalm: “I bear witness to you this morning that he, watching over Israel, slumbers not nor sleeps.”
    sources: [hinckley-slumbers-not]

  - ref: 6
    phrase: nor the moon by night
    kind: symbol
    title: What the moon does
    body: |
      The psalm does not say what harm the moon does, and two answers have been given. The sun’s harm needs no explaining. The shade of verse 5 leads to it, and “Sunstroke is of course common and dangerous in the East.”

      For the moon, one answer is that moonlight itself injures. A belief in moonstroke was widespread, and one older reading holds that the moon’s rays really “may affect the eyes injuriously.” The other answer is that the moon stands for the night and its cold. Jacob describes his years as a shepherd with the same pair: “in the day the drought consumed me, and the frost by night” ([[Gen. 31:40]]). Neither answer can be shown to be the psalmist’s.

      Whatever the moon’s harm, the line covers the night as its first half covers the day. The shade may be “upon thy right hand” because that is the usual place of a defender; the note on [[Ps. 110:5]] explains the place.
    sources: [cambridge-psalms, delitzsch-psalms, lds-scriptures]

  - ref: 7
    phrase: The LORD shall preserve thee from all evil
    kind: structure
    title: Keep and preserve are one word, said six times
    body: |
      “Preserve” in verses 7–8 is the same Hebrew verb as “keep” in verses 3–5, so the psalm uses one verb six times. The verb means “keep, watch, preserve.” The King James changes the English word at verse 7 and hides the count: “he that keepeth thee,” “he that keepeth Israel,” “thy keeper,” and then “preserve” three times. A modern translation keeps to one English word, so that the second half of verse 7 reads “he will keep your life.”

      What is kept is named line by line: a foot, then “thee,” then Israel, then “thee from all evil,” then “thy soul,” which is the person’s life, then “thy going out and thy coming in.” The last line adds time without end.
    sources: [biblehub-interlinear, bdb, nrsvue]

christ: |
  The LORD who keeps Israel is Jehovah, the name the Old Testament’s “LORD” usually stands for, and Jehovah is the Savior before His birth (see [[Ps. 110:1]]).

  The psalm rests its trust on one fact about Him: He “made heaven and earth.” The Book of Mormon gives that work to Jesus Christ by name. An angel told King Benjamin that He would be called “Jesus Christ, the Son of God, the Father of heaven and earth, the Creator of all things from the beginning” ([[Mosiah 3:8]]). The risen Lord said it of Himself to the Nephites: “I created the heavens and the earth, and all things that in them are” ([[3 Ne. 9:15]]).

explore: |
  - **The songs on either side.** [[Ps. 120]], sung far from home, and [[Ps. 122]], sung at the gates of Jerusalem.
  - **The Maker of heaven and earth, twice more.** [[Ps. 124:8]] and [[Ps. 134:3]], the last line of the songs of degrees.
  - **The promise to Jacob.** [[Gen. 28:10–22]]: the LORD’s word at Bethel that He will keep Jacob wherever he goes, which “he that keepeth Israel” may recall.
  - **The cry that God would wake.** [[Ps. 44:23]], a psalm that prays as if the keeper of Israel had fallen asleep.

parallels:
  - ref: Gen. 28:15
    note: The LORD promises Jacob, “I am with thee, and will keep thee in all places whither thou goest.”
  - ref: 1 Kgs. 18:27
    note: Elijah mocks a god who may be asleep and need waking.
  - ref: Ps. 124:8
    note: “Our help is in the name of the LORD, who made heaven and earth,” the answer of verse 2 sung by the people.
  - ref: Ps. 44:23
    note: A psalm that asks the LORD why He sleeps.

