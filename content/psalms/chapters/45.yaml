chapter: 45
title: A Song for the King’s Wedding
tagline: A court poet sings to a king on his wedding day, calls his throne everlasting, turns to counsel the bride, and promises a name remembered in every generation.
when: 'Undated; a song for a king’s wedding, and the king is not named'

setting: |
  Psalm 45 stands in Book Two of the Psalms, among the psalms that carry the name of the sons of Korah (see [[Ps. 42:1]]). It is a poet’s song to a king on the day of his marriage. It contains no prayer and no complaint, and almost every line is spoken to the king or to his bride.

  It belongs with the royal psalms, songs made for great occasions in the lives of Israel’s kings. Christian readers have read these psalms of the Messiah (see [[Ps. 2:2]]). The psalm does not name the king, and who he was is uncertain; the note on “A Song of loves” in the title gives the proposals.

  Hebrews quotes two of its verses, giving verses 6 and 7 as words God speaks “unto the Son” ([[Heb. 1:8–9]]). This chapter takes the song as a song for Israel’s king first, and then follows Hebrews.

thread: |
  Psalm 45 is **praise that keeps its eyes on one man**. The poet begins with himself, a heart astir and a tongue like a scribe’s pen (verse 1), and after that he hardly looks away from the king.

  The praise climbs in three steps, and each step comes to a “therefore.” The king is fair and gracious in speech: “therefore God hath blessed thee for ever” (verse 2). He loves righteousness and hates wickedness: “therefore God, thy God, hath anointed thee” (verse 7). His name will be kept alive by this song: “therefore shall the people praise thee for ever and ever” (verse 17). Between verses 2 and 7 the bridegroom is armed and sent out to ride for truth. Just before verse 7 stands the line Hebrews quotes, “Thy throne, O God, is for ever and ever.”

  The turn comes at verse 10. The poet faces the bride, “Hearken, O daughter,” and for three verses “thy” means her. Even there the subject is the king: she is to leave her father’s house for his. Verses 13–15 watch her led into the palace, and verse 16 turns back to him with the wedding’s hope, which is sons.

  The song that opened on the poet’s tongue closes on the poet’s promise. “For ever” is said of the king’s blessing, of his throne, and last of his praise.

sections:
  - range: 1
    heading: The poet’s heart is stirred
    plain: |
      My heart is astir with a good theme. I speak my verses to the king; my tongue is the pen of a skilled scribe.
  - range: 2-5
    heading: Fairer than the children of men, and armed
    plain: |
      You are fairer than the sons of men; grace is poured on your lips; therefore God has blessed you for ever. Strap your sword on your thigh, mighty one, in your glory and your majesty. In your majesty ride on and prosper, for the sake of truth and meekness and righteousness, and your right hand will teach you fearsome things. Your arrows are sharp in the heart of the king’s enemies; peoples fall beneath you.
  - range: 6-9
    heading: The throne, the anointing, and the wedding hall
    plain: |
      Your throne, O God, is for ever and ever; the sceptre of your kingdom is a sceptre of equity. You love righteousness and hate wickedness; therefore God, your God, has anointed you with the oil of gladness above your fellows. All your robes are fragrant with myrrh and aloes and cassia; out of the ivory palaces you are made glad. Kings’ daughters are among your ladies of honour; at your right hand stands the queen in gold of Ophir.
  - range: 10-12
    heading: Hearken, O daughter
    plain: |
      Listen, daughter; look, and bend your ear. Forget your own people and your father’s house, and the king will desire your beauty. He is your lord; bow to him. The daughter of Tyre will come with a gift, and the richest of the people will seek your favour.
  - range: 13-15
    heading: The bride is brought to the king
    plain: |
      The king’s daughter is all glorious within her chamber; her clothing is woven with gold. In embroidered robes she is led to the king, and the virgins who follow her, her companions, are brought to you. With gladness and rejoicing they are led along; they enter the king’s palace.
  - range: 16-17
    heading: Sons, and a name for ever
    plain: |
      In place of your fathers you will have sons, and you will make them princes in all the earth. I will make your name remembered in every generation; therefore the peoples will praise you for ever and ever.

notes:
  - ref: 0
    phrase: upon Shoshannim
    kind: words
    title: A tune called Lilies
    body: |
      “Shoshannim” is the Hebrew word for lilies, and it is most likely the name of the tune the psalm was sung to. The word means “lily, probably any lily-like flower,” and in the Song of Solomon it is used as a “simile of bride.” In the titles of the Psalms its sense is less sure, “meaning not clear.” A modern translation prints “according to Lilies,” and titles of this kind are “all probably names of tunes, well known at the time, to which the Psalms were appointed to be sung.” The ancient Greek translators did not read a flower at all; they wrote “for alternate strains.”

      The title’s other terms are explained where they first appear: “To the chief Musician” at [[Ps. 8:1]], “Maschil” at [[Ps. 32:1]], and “the sons of Korah” at [[Ps. 42:1]].
    sources: [bdb, nrsvue, bd-psalms, lxx-rahlfs]

  - ref: 0
    phrase: A Song of loves
    kind: history
    title: A love song, and the king it was written for
    body: |
      The title’s last words mean “a song of love,” and the psalm is a wedding song for a king it does not name. The Greek translators read the Hebrew word as a person, “a Song concerning the beloved.” A modern translation heads the psalm “Ode for a Royal Wedding.”

      Which wedding is not known: “the person of the king who is celebrated is a matter of doubt and controversy.” What can be said is that the psalm was “a poem composed for some special occasion,” addressed to a king who lived when the poet did. Two proposals show how the guessing goes. One is Solomon’s marriage to Pharaoh’s daughter ([[1 Kgs. 3:1]]), against which it has been argued that “the entire absence of any mention of Egypt is decisive against this view.” The other is the marriage of Joram of Judah to Athaliah, the daughter of Ahab ([[2 Kgs. 8:18]]), urged because the psalm mentions Tyre and ivory palaces and Ahab “built a palace of ivory.” Neither can be shown. The second is offered only as a conjecture, with the admission that Joram and Athaliah did not live up to the song.

      The reading that takes it as a song for a king of the poet’s own day also explains why the psalm can say so much of one man. A king of David’s house held a kingship to which were attached “great promises extending into the unlimited future” (see [[2 Sam. 7:16]]), and the poet praises him in the light of those promises.
    sources: [bdb, lxx-rahlfs, nrsvue, delitzsch-psalms]

  - ref: 4
    phrase: ride prosperously because of truth and meekness and righteousness
    kind: words
    title: Riding out for truth and meekness
    body: |
      The wedding song arms the bridegroom before it enthrones him, and it names what he fights for: truth, meekness and righteousness. Meekness is an unexpected word beside a sword and sharp arrows. One modern translation removes it, printing “for the cause of truth and to defend the right” and noting that the Hebrew has “and the meekness of.” The King James keeps the Hebrew, and so did the Greek translators: “because of truth and meekness and righteousness.” The king’s wars are to be for these things, and verses 6–7 say the same of his rule.
    sources: [oshb-wlc, nrsvue, lxx-rahlfs]

  - ref: 6
    phrase: Thy throne, O God, is for ever and ever
    kind: words
    title: A king addressed as God
    body: |
      In the psalm this line is spoken to the king, and the usual reading of the Hebrew is the King James reading: the poet calls him “God.” The Hebrew has no verb. It sets three things side by side: “thy throne,” *Elohim*, and “for ever and ever.” The Greek translators took *Elohim* as an address, “Thy throne, O God, is for ever and ever,” and a modern translation agrees: “Your throne, O God, endures forever and ever.” That is the reading of “most scholars ancient and modern.”

      The other way of taking the three words makes *Elohim* a description of the throne: *thy throne is God’s*, a throne that belongs to God. It is a recognized alternative, and Chronicles speaks of Israel’s throne in that way (compare [[1 Chr. 28:5]]).

      What would it mean to call a king *Elohim*? The word has a range (see [[Ps. 8:5]] and [[Ps. 82:6]]), and one of its senses is “godlike one.” It is used so of Moses, to whom the Lord said, “See, I have made thee a god to Pharaoh” ([[Ex. 7:1]]), and this verse has been placed with that one. The psalm’s next sentence speaks of the king’s own God: “God, thy God, hath anointed thee.”
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, bdb, lds-scriptures]

  - ref: 6
    phrase: the sceptre of thy kingdom is a right sceptre
    kind: scripture
    title: Hebrews gives these lines to the Son
    body: |
      Hebrews quotes verses 6 and 7 as words God speaks to His Son. The epistle opens with a chain of scripture showing that the Son is “so much better than the angels” ([[Heb. 1:4]]). The chain begins with [[Ps. 2:7]] and ends with [[Ps. 110:1]], and this psalm stands between them. Of the angels God says that they are His “ministers.” Then: “But unto the Son he saith, Thy throne, O God, is for ever and ever: a sceptre of righteousness is the sceptre of thy kingdom” ([[Heb. 1:8]]).

      Two things change between the psalm and the epistle. The speaker changes: a court poet addressed the king, and in Hebrews it is God who says these words. And the wording follows the Greek psalm, which has “Thou hast loved righteousness, and hated iniquity,” where the King James psalm has “lovest” and “wickedness.”

      Hebrews keeps the second verse whole: “therefore God, even thy God, hath anointed thee with the oil of gladness above thy fellows” ([[Heb. 1:9]]). The Son who is addressed as God is anointed by One who is His God. Hebrews sets the two sayings side by side: the angels are ministers, and the Son has a throne “for ever and ever.”
    sources: [lds-scriptures, lxx-rahlfs]

  - ref: 7
    phrase: anointed thee with the oil of gladness above thy fellows
    kind: words
    title: The oil of gladness
    body: |
      The verb here is the one behind the title Messiah, and in this verse God Himself does the anointing. “Anointed” is a form of *mashach*; the noun made from it is explained at [[Ps. 2:2]]. In Israel “kings were anointed to their office by the prophets.” The psalm says that God did it, and it gives the reason: the king loves righteousness.

      “The oil of gladness” is the same pair of Hebrew words as “the oil of joy for mourning” in [[Isa. 61:3]]. That chapter opens with one who says “the LORD hath anointed me” ([[Isa. 61:1]]), and near its end come a bridegroom and a bride dressed for their wedding ([[Isa. 61:10]]). A separate suggestion concerns the clothing: there is “likely also a parallel between the marriage imagery in Isaiah 61:10 and the royal marriage in Psalm 45,” where king and bride alike wear splendid vestments.

      “Above thy fellows” ranks him among his equals: “fellows” here are companions “of like rank.”
    sources: [oshb-wlc, bd-anoint, larsen-dust-crown, bdb, lds-scriptures]

  - ref: 8
    phrase: out of the ivory palaces, whereby they have made thee glad
    kind: words
    title: Music from ivory palaces
    body: |
      What gladdens the king from the ivory palaces is probably music. The King James “whereby” translates a short Hebrew word that looks like a form of “from.” It is more likely the word for the string of a harp, which Psalm 150 uses in the plural for “stringed instruments” (see [[Ps. 150:4]]). So a modern translation has “From ivory palaces stringed instruments make you glad.” The reading rests on a small correction to the Hebrew and is marked “probably.”

      Kings records one such building: among Ahab’s works it lists “the ivory house which he made” ([[1 Kgs. 22:39]]).
    sources: [bdb, nrsvue, lds-scriptures]

  - ref: 10
    phrase: forget also thine own people, and thy father’s house
    kind: history
    title: Counsel to the bride
    body: |
      At verse 10 the poet stops speaking to the king and speaks to the bride, and what he asks of her is a change of house. The Hebrew verbs and pronouns turn feminine here and stay so through verse 12. She is to forget her people and her father’s house, and the reason follows: “for he is thy Lord.”

      The capital letter in “Lord” is the translators’. The Hebrew word is the ordinary one for a lord or master, and in this verse it has the sense “husband.” “Worship” likewise is the act of bowing, so that a modern translation reads, “Since he is your lord, bow to him.” In the psalm’s own scene these are a queen’s honours to the king who is her husband.

      Verse 12 promises her honour from abroad. “The daughter of Tyre” can be read as the city itself, “Daughter Tyre,” coming with gifts. Tyre was “an important commercial and seaport town,” so the gift comes from a great trading port.

      The “queen” of verse 9 is a rare word for a king’s wife, a “(queen-)consort.” In the Psalms it is found only here, and elsewhere it is used of the wife of the Persian king ([[Neh. 2:6]]).
    sources: [oshb-wlc, bdb, nrsvue, bd-tyre]

  - ref: 13
    phrase: all glorious within
    kind: words
    title: Glorious within her chamber
    body: |
      “Within” says where the bride is, not what she is like inside. The Hebrew adverb means “within the house,” and a modern translation makes the place plain: “The princess is decked in her chamber with gold-woven robes.” The next verses follow her from there: she is led to the king in embroidered robes with her companions behind her (verse 14), and the whole train enters the palace (verse 15).

      The King James wording can be heard as praise of inward character, but the sentence goes on at once to her clothing.
    sources: [bdb, nrsvue]

  - ref: 14
    phrase: She shall be brought unto the king
    kind: christ
    title: The Bridegroom and the bride
    body: |
      Scripture calls Jesus Christ the Bridegroom, and this psalm’s bride has been read as His people. “Jesus Christ is symbolized in the scriptures as the Bridegroom. The Church is His symbolic bride.” He used the figure of Himself: “Can the children of the bridechamber mourn, as long as the bridegroom is with them?” ([[Matt. 9:15]]). John saw the end of the story: “the marriage of the Lamb is come, and his wife hath made herself ready” ([[Rev. 19:7]]).

      The allegorical reading of the psalm as a song of the Church compares the bride of Revelation, “arrayed in shining white linen (byssus), which denotes her righteousness,” with the bride here, whose “variegated, golden garments denote her glory.” Hebrews applies verses 6–7 to the Son and does not go on to the bride.

      Latter-day revelation uses the same figure for the Church, which is to “be adorned as a bride” for the Lord’s coming ([[D&C 109:74]]). The prophets’ use of the marriage image for the Lord and Israel is taken up at [[Isa. 54:5]].
    sources: [gs-bridegroom, delitzsch-psalms, lds-scriptures]

  - ref: 16
    phrase: Instead of thy fathers shall be thy children
    kind: words
    title: Sons in place of fathers
    body: |
      Verse 16 is spoken to the king again, and it states the hope of the wedding. English “thy” hides the change, but the Hebrew pronouns, feminine since verse 10, are masculine here; a modern translation adds the words “O king” to make it plain. In place of his fathers he is to have sons, and the sons are to rule: “princes in all the earth.”

      The “I” of the last verse is the poet. The verb is in the first person, as in verse 1, where he spoke of his own tongue. It is the poet who says he will make the king’s name “be remembered in all generations.”
    sources: [oshb-wlc, nrsvue]

christ: |
  Hebrews reads the centre of this psalm of Jesus Christ. The words “Thy throne, O God, is for ever and ever” are, in the epistle, God’s words “unto the Son” ([[Heb. 1:8]]), and the anointing with “the oil of gladness” is His ([[Heb. 1:9]]). The title Christ means the anointed one (see [[Ps. 2:2]]). The heading in the Church’s edition reads the whole psalm of the Messiah.

explore: |
  - **The chain in Hebrews.** [[Heb. 1:5–13]], with [[Ps. 2:7]], this psalm, and [[Ps. 110:1]] open: three royal psalms that Hebrews reads of the Son.
  - **The marriage of the Lamb.** [[Rev. 19:7–9]], the wedding John saw, with the bride arrayed in fine linen.
  - **The oil of joy.** [[Isa. 61:1–3]] and [[Isa. 61:10]], for the anointed one, the oil, and the wedding garments.
  - **The Lord as husband.** [[Isa. 54:5]] and [[Isa. 62:5]], the prophets’ form of the image.

parallels:
  - ref: Heb. 1:8–9
    note: Verses 6–7 are quoted as God’s words to the Son.
  - ref: Isa. 61:3
    note: “The oil of joy” is the same Hebrew phrase as “the oil of gladness” in verse 7.
  - ref: Rev. 19:7–8
    note: The marriage of the Lamb, and the bride arrayed in fine linen.

