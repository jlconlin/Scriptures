chapter: 40
title: Lo, I Come
tagline: A man lifted out of the pit sings a new song, says that God wants a hearing ear and not an offering, and then, with trouble all around him again, asks the same God to hurry.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  The title ascribes Psalm 40 to David and names no occasion in his life.

  The psalm is in two unequal parts, and they come in an order a reader does not expect. Verses 1–10 give thanks for a rescue that is over: the pit, the rock, the new song, the report made to the congregation. Verses 11–17 are a plea out of present trouble, with enemies at hand and no rescue yet. A lament usually moves from complaint to praise (see the first note on [[Ps. 22:1]]); this psalm runs the other way. One older reading supposes a speaker who “has just been rescued from danger, and, on the other, is still exposed to peril,” so that praise comes first. The psalm itself does not say.

  Its last five verses appear again, with small changes, as Psalm 70.

  The Epistle to the Hebrews quotes verses 6–8 as the words of Jesus Christ at His coming into the world ([[Heb. 10:5–7]]), and the heading in the Church’s edition calls the whole a messianic psalm of David. This chapter takes the prayer first and what Hebrews does with it after; the note on verse 12 takes up the speaker’s confession of his iniquities.

thread: |
  Psalm 40 moves from **what God has done to what He is asked to do**, and the second part is built out of the first.

  The thanksgiving climbs. God heard; God lifted him out and set him on rock; God gave him a song (verses 1–3). Then the speaker asks what he can give back, and his answer is the center of the psalm. He does not answer with an offering. “Sacrifice and offering thou didst not desire”; what God did was to open his ears. So he brings himself: “Lo, I come … I delight to do thy will.” In the Hebrew, “desire” in verse 6 and “delight” in verse 8 are one verb: what God did not desire was sacrifice, and what the speaker delights in is God’s will. And the servant has done what he could do with a mouth: he told the great congregation (verses 9–10).

  The turn is at verse 11, and it comes without warning. “I have not refrained my lips,” he has just said; now, in the same Hebrew verb, “Withhold not thou thy tender mercies from me.” The lovingkindness and truth he has declared are the lovingkindness and truth he asks to be kept by. The evils around him are now beyond counting, as God’s works were.

  The psalm does not end rescued. Its last words are “make no tarrying, O my God.” The man who began by saying “I waited patiently” is waiting again.

sections:
  - range: 1-3
    heading: Out of the pit, a new song
    plain: |
      I waited and waited for the LORD, and He bent down to me and heard my cry. He brought me up out of a dreadful pit, out of the mud and mire, set my feet on a rock, and made my steps firm. He put a new song in my mouth, a song of praise to our God. Many will see it and fear, and will trust in the LORD.
  - range: 4-5
    heading: More than can be numbered
    plain: |
      Blessed is the man who makes the LORD his trust and does not turn to the proud or to those who go off after lies. O LORD my God, You have done many wonderful works, and Your thoughts toward us are many; no one can set them out in order before You. If I tried to tell them all, they would be more than can be counted.
  - range: 6-8
    heading: Not sacrifice, but an open ear
    plain: |
      Sacrifice and offering You did not desire; You have dug ears for me. Burnt offering and sin offering You did not ask for. Then I said, “Here I am; I come. In the roll of the book it is written of me. I delight to do Your will, O my God; Your law is deep within me.”
  - range: 9-10
    heading: Told in the great congregation
    plain: |
      I have told the glad news of righteousness in the great congregation. I have not held back my lips, O LORD, as You know. I have not hidden Your righteousness inside my heart. I have spoken of Your faithfulness and Your salvation; I have not kept Your lovingkindness and Your truth from the great congregation.
  - range: 11-12
    heading: Withhold not thou
    plain: |
      Do not hold back Your tender mercies from me, O LORD; let Your lovingkindness and Your truth always keep me. For evils without number have closed in around me. My iniquities have caught up with me, so that I cannot look up. They are more than the hairs of my head, and my heart fails me.
  - range: 13-15
    heading: Make haste to help me
    plain: |
      Be pleased, O LORD, to deliver me; O LORD, hurry to help me. Let those who seek my life to destroy it be ashamed and confounded together. Let those who wish me harm be driven back and put to shame. Let those who say to me, “Aha, aha,” be left desolate as the wages of their shame.
  - range: 16-17
    heading: The LORD be magnified
    plain: |
      Let all who seek You rejoice and be glad in You; let those who love Your salvation say always, “The LORD be magnified.” As for me, I am poor and needy, yet the Lord thinks of me. You are my help and my deliverer; do not delay, O my God.

notes:
  - ref: 1
    phrase: I waited patiently for the LORD
    kind: words
    title: Waiting, I waited
    body: |
      “Patiently” translates a doubling: the Hebrew has the verb “wait” twice, an infinitive set beside the finite verb, *waiting, I waited*. The King James gives the doubling as an adverb. The verb is the one behind “Wait on the LORD” (see the note on [[Ps. 27:14]]), to “wait, or look eagerly, for.” What he looked for is in the rest of the verse: that God would bend toward him and hear.

      The psalm opens with a waiting that was answered and closes, in verse 17, with a request that the answer not be delayed this time.
    sources: [oshb-wlc, bdb]

  - ref: 2
    phrase: an horrible pit, out of the miry clay
    kind: symbol
    title: A pit of tumult and a rock
    body: |
      The pit is named for its noise, and the rescue is told as a change of footing. The word behind “horrible” is a noun for a “roar (of waters, etc.), din, crash, uproar,” so the Hebrew phrase is a “pit of roaring,” possibly of waters. Translators have not been sure what to do with it. The ancient Greek has “a pit of misery,” and a modern translation corrects the text to read “desolate pit” while noting that the Hebrew is “pit of tumult.”

      The second image is mire, and another psalm, one that has been compared with this verse, says what mire and water mean for the man in them: “I sink in deep mire, where there is no standing: I am come into deep waters, where the floods overflow me” ([[Ps. 69:2]]).

      The psalm does not say what the pit was. What it tells is the reversal. He was down and God brought him up; he had no footing and God set him on a rock and “established my goings.” Then came the new song (see the note on [[Ps. 33:3]]).
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, lds-scriptures]

  - ref: 6
    phrase: mine ears hast thou opened
    kind: words
    title: Ears dug for hearing
    body: |
      The Hebrew says that God has *dug* ears for the speaker, and the clause is the psalm’s answer to what God wants in place of sacrifice. The verb means to dig. Here it is used “with allusion to the cavity of the ear,” and the sense is “thou hast given me the means of hearing and obeying thy will.” A modern translation has “you have given me an open ear.”

      The clause sits between two lines that say what God did not ask for. Four kinds of offering are named, two by what they are made of (the slain animal and the grain offering) and two by what they are for (the burnt offering and the sin offering). Set in the middle of that list, the dug ears are the thing God did want: “God desires not sacrifices but hearing ears, and consequently the submission of the person himself in willing obedience.” On this reading the verse is “the echo” of Samuel’s word to Saul, “Behold, to obey is better than sacrifice, and to hearken than the fat of rams” ([[1 Sam. 15:22]]).

      The verse does not say that the law of sacrifice was no command of God. The same reading puts it carefully: the point is that “the true, essential will of God is not directed to such sacrifices.” The speaker has just asked, in effect, what he can return for wonders past counting (verse 5), and he finds that the return God looks for is himself.

      The same verb that says what God did not “desire” returns in verse 8 as the speaker’s “I delight.”
    sources: [oshb-wlc, bdb, nrsvue, delitzsch-psalms, lds-scriptures]

  - ref: 6
    phrase: Sacrifice and offering thou didst not desire
    kind: christ
    title: Hebrews hears Christ speaking
    body: |
      The Epistle to the Hebrews quotes verses 6–8 as the words of Jesus Christ, and it quotes them in a form that differs from the Hebrew at one word. “Wherefore when he cometh into the world, he saith, Sacrifice and offering thou wouldest not, but a body hast thou prepared me” ([[Heb. 10:5]]). Where the psalm has ears, Hebrews has a body.

      The wording is that of the ancient Greek translation of the psalm, which reads “Sacrifice and offering thou wouldest not; but a body hast thou prepared me.” The Hebrew text has “ears” and no word for a body in the clause. Hebrews quotes the psalm as the Greek has it.

      Hebrews also stops the quotation early. In the Greek psalm as in the Hebrew, the speaker goes on to his delight in God’s will and the law in his heart. Hebrews ends at “to do thy will, O God” ([[Heb. 10:7]]), and then takes up two of the words it has quoted. The first is *will*. The offerings named in the psalm are those “which are offered by the law” ([[Heb. 10:8]]), and over against them stands one who comes to do God’s will: “He taketh away the first, that he may establish the second” ([[Heb. 10:9]]). The second word is *body*: “By the which will we are sanctified through the offering of the body of Jesus Christ once for all” ([[Heb. 10:10]]).

      So the psalm’s contrast between offerings and an obedient person becomes, in Hebrews, the contrast between the sacrifices of the law and the one offering of the Son. In the psalm the speaker brings himself instead of a sacrifice. In Hebrews the one who says “Lo, I come” brings Himself as the sacrifice.
    sources: [lds-scriptures, lxx-rahlfs, oshb-wlc]

  - ref: 7
    phrase: in the volume of the book it is written of me
    kind: words
    title: The roll of the book
    body: |
      “Volume” is a scroll, and the psalm does not say which scroll or what it says about the speaker. The Hebrew phrase means a “roll of writing, book”; a modern translation has “in the scroll of the book it is written of me.” The King James “volume” is the same thing, a book in the form of a roll.

      One older reading gives the line a setting in Israel’s law. With “Lo, I come,” it says, “the servant places himself at the call of his master.” The roll is the law, and Deuteronomy in particular, “written upon skins and rolled up together,” which the law of the king required every king of Israel to keep beside him: “he shall write him a copy of this law in a book,” and “he shall read therein all the days of his life” ([[Deut. 17:18–19]]). “Written of me” then means written concerning him: the book “prescribes to him, as a man, and more especially as the king, the right course of conduct.” He comes before God with the book that says what is asked of him, and verse 8 adds that it is inside him as well.

      That is one reading, and it has the king most in view. Hebrews keeps the clause, in a parenthesis, in the mouth of Christ ([[Heb. 10:7]]), where what is written in the book is written of Him.
    sources: [oshb-wlc, bdb, nrsvue, delitzsch-psalms, lds-scriptures]

  - ref: 9
    phrase: I have preached righteousness in the great congregation
    kind: words
    title: Glad tidings in the great congregation
    body: |
      “Preached” is the Hebrew verb for bringing good news, used elsewhere of word of a victory or of the birth of a son. Its sense here is to “herald as glad tidings,” and a modern translation has “I have told the glad news of deliverance.” The speaker’s rescue is news, and he has carried it to the assembled people.

      He says so five ways in two verses, three of them by denial: he has not refrained his lips, not hid, not concealed. What he has told is all God’s: “thy righteousness,” “thy faithfulness,” “thy salvation,” “thy lovingkindness and thy truth.” (For lovingkindness, the Hebrew *hesed*, see the note on [[Ps. 51:1]].)

      The verb is the one Isaiah uses of him “that bringeth good tidings” ([[Isa. 52:7]]) and of the anointed servant, whom “the LORD hath anointed … to preach good tidings unto the meek” ([[Isa. 61:1]]). The heading in the Church’s edition reads this verse of the psalm of the Messiah, who “will come and preach righteousness.”
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]

  - ref: 11
    phrase: Withhold not thou thy tender mercies from me
    kind: structure
    title: The plea takes up the thanksgiving’s words
    body: |
      The psalm turns from thanks to petition at this verse, and the petition is made out of the words of the thanksgiving. Three of them carry across.

      *Withhold.* “I have not refrained my lips” (verse 9) and “Withhold not thou” are one Hebrew verb. He did not hold back his report of God’s mercy; he asks God not to hold back the mercy.

      *Lovingkindness and truth.* The pair he has not concealed from the congregation (verse 10) is the pair he asks to “continually preserve” him (verse 11). He asks for what he has been preaching.

      *More than.* God’s works and thoughts “are more than can be numbered” (verse 5); the evils around him are “innumerable,” and his iniquities “are more than the hairs of mine head” (verse 12). “They are more than” is the same Hebrew verb in both verses.

      The King James wording shows one more. The thanksgiving speaks of God’s “thoughts which are to us-ward” (verse 5), and the psalm’s last verse says, “I am poor and needy; yet the Lord thinketh upon me.”
    sources: [oshb-wlc]

  - ref: 12
    phrase: mine iniquities have taken hold upon me
    kind: scripture
    title: A messianic psalm whose speaker confesses iniquity
    body: |
      The speaker of this verse confesses iniquities of his own, in a psalm that Hebrews quotes as the Savior’s words and that the heading in the Church’s edition calls messianic. Hebrews quotes no further than verse 8.

      One older reading takes the psalm in stages. In verses 6–8 the words of David are “so moulded by the Holy Spirit, the Spirit of prophecy, that they sound at the same time like the words of the second David.” But “we are not thereby compelled to understand the whole Psalm as typically predictive”: on this reading the psalm comes down from that height after verse 8, and by this verse the prophetic strain “has entirely ceased.” David here speaks for himself: his misdeeds have “overtaken him in their consequences,” and he cannot lift his eyes.

      That is one reading; the Church’s heading calls the psalm messianic and does not divide it. For a prayer that is its speaker’s own and is also fulfilled in Christ, see the notes on [[Ps. 22:1]].
    sources: [lds-scriptures, delitzsch-psalms]

  - ref: 13
    phrase: Be pleased, O LORD, to deliver me
    kind: scripture
    title: The ending is also Psalm 70
    body: |
      Verses 13–17 stand in the Psalter a second time as Psalm 70, with small differences. Among them: Psalm 70 opens “Make haste, O God, to deliver me” ([[Ps. 70:1]]) where this verse has “Be pleased, O LORD.” Its friends say “Let God be magnified” ([[Ps. 70:4]]) where these say “The LORD be magnified.” And in its last verse the line of trust is gone. This psalm has “yet the Lord thinketh upon me”; Psalm 70 has another plea, “make haste unto me, O God” ([[Ps. 70:5]]). Neither psalm says which came first.

      The plea also shares its language with Psalm 35. That psalm has the wish “Let them be confounded and put to shame that seek after my soul” (the note on [[Ps. 35:4]] says what such wishes ask for, and the full treatment of prayers against enemies is in the notes on [[Ps. 137:8]]). The mockers there say the same “Aha, aha, our eye hath seen it” ([[Ps. 35:21]]), and the friends the same “Let the LORD be magnified” ([[Ps. 35:27]]). In this psalm too the wishes are requests: he asks God to act.
    sources: [lds-scriptures]

christ: |
  The New Testament reads the center of this psalm as the Savior’s own words. “When he cometh into the world, he saith”: so Hebrews introduces verses 6–8 ([[Heb. 10:5]]), and it finds in them the reason for His coming. The law’s offerings were repeated year after year because “it is not possible that the blood of bulls and of goats should take away sins” ([[Heb. 10:4]]). Against them Hebrews sets the one who says, “Lo, I come to do thy will, O God” ([[Heb. 10:9]]), and the offering of His body once for all. The second note on [[Ps. 40:6]] follows the argument.

explore: |
  - **The argument in full.** [[Heb. 10:1–18]], read with verses 6–8 of the psalm open.
  - **The same ending by itself.** [[Ps. 70]], five verses, with the title “to bring to remembrance.”
  - **Another opened ear.** [[Isa. 50:4–7]], where the servant’s ear is wakened morning by morning and he does not turn back.
  - **Sacrifice and the heart.** [[Ps. 51:16–17]], where David says God does not delight in burnt offering and names the sacrifice He will not despise.

parallels:
  - ref: Heb. 10:5–7
    note: Verses 6–8 are quoted as the words of Christ when He comes into the world, with “a body hast thou prepared me” where the psalm has ears.
  - ref: Ps. 70:1–5
    note: Verses 13–17 again, as a psalm by themselves, with small changes.
  - ref: 1 Sam. 15:22
    note: Samuel to Saul, “to obey is better than sacrifice.”
  - ref: Isa. 50:5
    note: The servant says, “The Lord GOD hath opened mine ear, and I was not rebellious.”
  - ref: Ps. 35:27
    note: The friends of the afflicted say continually, “Let the LORD be magnified.”

