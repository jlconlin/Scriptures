chapter: 106
title: We Have Sinned with Our Fathers
tagline: A scattered people go back over their history from the Red Sea to the idols of Canaan, own every failure in it as theirs, and rest their plea on the God who each time remembered His covenant.
when: 'Undated; its last prayer asks to be gathered “from among the heathen” (verse 47)'

setting: |
  Psalm 106 is anonymous. It begins and ends with “Praise ye the LORD,” the word hallelujah (explained at [[Ps. 150:1]]), and it is the last psalm of Book Four: verse 48 is the line of praise that closes that book.

  It is the companion of the psalm before it. [[Ps. 105]] tells Israel’s story as what God did and stops at the gift of the land. This psalm goes over the same years as what Israel did. Three psalms recite the history: Psalm 78 to teach, Psalm 105 to praise, and this one to confess. Its nearest kin are the prayers of confession: Solomon’s at the dedication of the temple, Daniel’s, and the Levites’ in Nehemiah’s day ([[Neh. 9]]).

  Nothing in the psalm dates it, but the last verses suggest that the singers are scattered among other nations. They ask to be gathered “from among the heathen” (verse 47), and verse 46 speaks of “those that carried them captives.”

  Chronicles sets the psalm’s first verse and its last two at the close of the song David gave to Asaph and his brethren ([[1 Chr. 16:34–36]]); the note on verse 47 sets the two endings side by side.

thread: |
  Psalm 106 is **a confession made of two kinds of memory**: Israel forgets, and God remembers. The fathers “remembered not the multitude of thy mercies” (verse 7). They “soon forgat his works” (verse 13). They “forgat God their saviour” (verse 21). At the end He “remembered for them his covenant” (verse 45). And the one thing the singer asks for himself, before the confession begins, is “Remember me” (verse 4).

  Between those lines come eight scenes, seven on the way from Egypt and one long one in the land: the panic at the Red Sea, the craving for meat, the envy of Moses and Aaron, the calf, the refusal of the land, Baal-peor, the waters of strife, and then the idols of Canaan. The psalm before this one tells the wilderness without the murmuring (see the note on [[Ps. 105:40]]). Here the murmuring is the story, and the singers do not stand outside it: “We have sinned with our fathers.”

  Twice a man stands between the people and what they have earned. Moses “stood before him in the breach” (verse 23), and Phinehas “stood up” (verse 30); wrath is turned, and a plague stops.

  But the psalm turns on a word said of God. “Nevertheless he saved them for his name’s sake” (verse 8) follows the first sin, and “Nevertheless he regarded their affliction” (verse 44) follows the last. That is how a confession can open with “his mercy endureth for ever” and end with “Save us.” The history it tells is the ground of the plea.

sections:
  - range: 1-5
    heading: Praise, and one man’s request
    plain: |
      Praise the LORD. Give thanks to the LORD, for He is good; His mercy lasts for ever. Who can tell all the mighty acts of the LORD, or make all His praise heard? Blessed are those who keep justice and do what is right at all times. Remember me, LORD, with the favour You show Your people; come to me with Your salvation, so that I may see the good of Your chosen ones, rejoice in the gladness of Your nation, and glory with Your inheritance.
  - range: 6-12
    heading: At the Red Sea
    plain: |
      We have sinned, we and our fathers; we have done wrong and acted wickedly. Our fathers in Egypt did not understand Your wonders or remember Your many mercies, and they rebelled at the sea, the Red Sea. Yet He saved them for His name’s sake, to make His mighty power known. He rebuked the Red Sea and it dried up, and He led them through the depths as through open country. He saved them from the hand of the one who hated them; the waters covered their enemies, and not one was left. Then they believed His words and sang His praise.
  - range: 13-23
    heading: Craving, envy, and the calf
    plain: |
      They soon forgot what He had done and did not wait for His counsel. They craved greedily in the wilderness and put God to the test, and He gave them what they asked and sent a wasting sickness among them. In the camp they envied Moses, and Aaron, the LORD’s holy one. The earth opened and swallowed Dathan and covered Abiram’s company, and fire burned up the wicked. At Horeb they made a calf and bowed to a cast image, trading their glory for the likeness of an ox that eats grass. They forgot God their saviour, who had done great things in Egypt and fearful things at the Red Sea. So He said He would destroy them, and would have, had not Moses His chosen one stood in the breach before Him to turn back His wrath.
  - range: 24-33
    heading: The land despised, Baal-peor, the waters of strife
    plain: |
      They despised the pleasant land and did not believe His word; they murmured in their tents and would not listen to the LORD. So He raised His hand and swore that He would make them fall in the wilderness, and scatter their descendants among the nations. They yoked themselves to Baal-peor and ate sacrifices offered to the dead. They provoked Him with what they did, and a plague broke out among them. Then Phinehas stood up and intervened, and the plague was stopped; and that was counted to him as righteousness through all generations for ever. They angered Him also at the waters of strife, and it went badly with Moses because of them, for they provoked his spirit, and he spoke rashly with his lips.
  - range: 34-43
    heading: In the land
    plain: |
      They did not destroy the nations as the LORD had commanded, but mixed with them and learned their ways. They served their idols, which became a snare to them. They sacrificed their sons and their daughters to demons, shedding innocent blood to the idols of Canaan, and the land was polluted with blood. They were defiled by their own works and unfaithful in their own deeds. So the LORD’s anger burned against His people and He abhorred His own inheritance. He gave them into the hand of the nations; those who hated them ruled them, and their enemies oppressed them. Many times He delivered them, but they went on provoking Him and were brought low for their iniquity.
  - range: 44-48
    heading: Nevertheless
    plain: |
      Yet He looked on their distress when He heard their cry. He remembered His covenant for their sake and showed compassion according to His many mercies, and He made their captors pity them. Save us, LORD our God, and gather us from among the nations, so that we may give thanks to Your holy name and glory in Your praise. Blessed be the LORD God of Israel from everlasting to everlasting; and let all the people say, Amen. Praise the LORD.

notes:
  - ref: 4
    phrase: Remember me, O LORD
    kind: structure
    title: One voice before the confession
    body: |
      Before the people confess, one worshipper prays for himself: verses 4–5 are the only lines of the psalm that say “me” and “I.” Verse 6 says “We,” and the closing prayer says “Save us.” The ancient Greek translation has the plural already here: “Remember us, O Lord,” and “visit us with thy salvation.”
    sources: [lxx-rahlfs]

  - ref: 6
    phrase: We have sinned with our fathers
    kind: scripture
    title: The confession Solomon foresaw
    body: |
      The three verbs of this verse are the confession Solomon said a captive Israel would one day make. At the dedication of the temple he prayed for a people carried away for their sins, who would “bethink themselves in the land whither they were carried captives” and say, “We have sinned, and have done perversely, we have committed wickedness” ([[1 Kgs. 8:47]]). Daniel prays nearly the same words: “We have sinned, and have committed iniquity, and have done wickedly” ([[Dan. 9:5]]).

      Verse 46 echoes the same prayer. Solomon asked that God would “give them compassion before them who carried them captive” ([[1 Kgs. 8:50]]), and the psalm reports that He “made them also to be pitied of all those that carried them captives.”

      The fathers are not being blamed in the singers’ place. A modern translation has “Both we and our ancestors have sinned.” The singers count themselves in, and the history that follows is told as their own.
    sources: [lds-scriptures, delitzsch-psalms, nrsvue]

  - ref: 7
    phrase: provoked him at the sea
    kind: history
    title: The rebellion at the sea came before the crossing
    body: |
      The rebellion at the Red Sea was the complaint Israel made before the water parted. They said to Moses, “Because there were no graves in Egypt, hast thou taken us away to die in the wilderness?” ([[Ex. 14:11]]), and told him it had “been better for us to serve the Egyptians” ([[Ex. 14:12]]). Where the King James has “provoked,” a modern translation has “rebelled.”

      Verse 12 is the other side of that day. After the crossing “the people feared the LORD, and believed the LORD, and his servant Moses” ([[Ex. 14:31]]), and “Then sang Moses and the children of Israel this song unto the LORD” ([[Ex. 15:1]]).

      [The People Forget; God Remembers](/psalms/themes/forget-and-remember/) follows what Israel forgot and what God remembered through Psalms 78, 105 and 106.
    sources: [lds-scriptures, nrsvue]

  - ref: 8
    phrase: for his name’s sake
    kind: scripture
    title: Ezekiel tells the same history with the same reason
    body: |
      He saved them for the sake of His own name, and Ezekiel, retelling this history, says what was at stake in it. Three times in that chapter the LORD says of Israel’s rebellions, “But I wrought for my name’s sake, that it should not be polluted before the heathen” ([[Ezek. 20:9]]; see also [[Ezek. 20:14]] and [[Ezek. 20:22]]). The nations were those “in whose sight I brought them out.” The psalm says the same thing from the other side: He saved them “that he might make his mighty power to be known.”

      So the reason for the rescue lies in Him and not in them. Ezekiel’s chapter gives the same reason for the return it promises, “when I shall bring you into the land of Israel” ([[Ezek. 20:42]]): “when I have wrought with you for my name’s sake, not according to your wicked ways” ([[Ezek. 20:44]]).
    sources: [lds-scriptures]

  - ref: 15
    phrase: sent leanness into their soul
    kind: words
    title: Leanness is the plague that came with the quails
    body: |
      The “leanness” is a wasting sickness, and the verse is about the day Israel wept for meat. The people “fell a lusting” and said, “Who shall give us flesh to eat?” ([[Num. 11:4]]). The meat was given, and “while the flesh was yet between their teeth, ere it was chewed,” the LORD “smote the people with a very great plague” ([[Num. 11:33]]). The place was named for it, “because there they buried the people that lusted” ([[Num. 11:34]]).

      A modern translation has “sent a wasting disease among them” where the King James has “into their soul.”
    sources: [lds-scriptures, nrsvue, delitzsch-psalms]

  - ref: 16
    phrase: Aaron the saint of the LORD
    kind: history
    title: The holy one the rebels said was no holier than they
    body: |
      The word “saint” here means holy one, and holiness was what the rebels disputed. Korah, with Dathan and Abiram of the tribe of Reuben, rose against Moses and Aaron with the charge, “Ye take too much upon you, seeing all the congregation are holy, every one of them” ([[Num. 16:3]]). Moses answered that the LORD would show “who is holy” ([[Num. 16:5]]). A modern translation renders the psalm’s phrase “Aaron, the holy one of the Lord.”

      Verses 17–18 give the two endings of the story. The earth “opened her mouth, and swallowed them up” ([[Num. 16:32]]), and “there came out a fire from the LORD, and consumed the two hundred and fifty men that offered incense” ([[Num. 16:35]]).

      The psalm names Dathan and Abiram and not Korah, whom Numbers names first, and it gives no reason. Moses does the same when he retells the story, recalling “what he did unto Dathan and Abiram” ([[Deut. 11:6]]). The later census says the earth swallowed them “together with Korah” ([[Num. 26:10]]) and adds, “Notwithstanding the children of Korah died not” ([[Num. 26:11]]).
    sources: [lds-scriptures, nrsvue]

  - ref: 20
    phrase: changed their glory
    kind: scripture
    title: Their glory was God Himself
    body: |
      The glory Israel traded away was their God. Jeremiah says it in the same words, “my people have changed their glory for that which doth not profit” ([[Jer. 2:11]]), and a modern translation of the psalm writes it out: “They exchanged the glory of God.”

      What they took in exchange is put as low as the psalm can put it. The calf was hailed with “These be thy gods, O Israel, which brought thee up out of the land of Egypt” ([[Ex. 32:4]]). The psalm calls it the likeness “of an ox that eateth grass,” and the next verse says whom they had forgotten: “God their saviour, which had done great things in Egypt.”

      Paul uses nearly the same words of the idolatry of all mankind, who “changed the glory of the uncorruptible God into an image made like to corruptible man, and to birds, and fourfooted beasts, and creeping things” ([[Rom. 1:23]]).
    sources: [lds-scriptures, nrsvue]

  - ref: 23
    phrase: stood before him in the breach
    kind: symbol
    title: The man in the gap
    body: |
      To stand in the breach is to stand where a wall is broken, between a people and their destruction, and Ezekiel gives the picture in full. In his day the LORD “sought for a man among them, that should make up the hedge, and stand in the gap before me for the land, that I should not destroy it: but I found none” ([[Ezek. 22:30]]). At Horeb there was such a man.

      Exodus tells what Moses did. The LORD said, “let me alone, that my wrath may wax hot against them, and that I may consume them: and I will make of thee a great nation” ([[Ex. 32:10]]). Moses instead “besought the LORD his God” ([[Ex. 32:11]]), and the next day he went further: “Yet now, if thou wilt forgive their sin—; and if not, blot me, I pray thee, out of thy book which thou hast written” ([[Ex. 32:32]]). In his own retelling the prayer was, “destroy not thy people and thine inheritance” ([[Deut. 9:26]]).

      The King James text of Exodus says, after Moses’s first plea, that “the LORD repented of the evil which he thought to do unto his people” ([[Ex. 32:14]]). The Joseph Smith Translation gives His answer there as a condition: “If they will repent of the evil which they have done, I will spare them, and turn away my fierce wrath.”
    sources: [lds-scriptures, jst-ex-32]

  - ref: 26
    phrase: he lifted up his hand against them
    kind: scripture
    title: A raised hand is an oath
    body: |
      To lift the hand here is to swear, not to strike. A modern translation has “he raised his hand and swore to them.” The occasion is the refusal to enter Canaan after the spies’ report, when the LORD said, “As truly as I live” ([[Num. 14:28]]), and swore that their “carcases shall fall in this wilderness” ([[Num. 14:29]]). Canaan is there called “the land which ye have despised” ([[Num. 14:31]]); the psalm says they “despised the pleasant land.”

      Verse 27 carries the oath on to their descendants, and Ezekiel reports the same thing in the LORD’s own voice: “I lifted up mine hand unto them also in the wilderness, that I would scatter them among the heathen, and disperse them through the countries” ([[Ezek. 20:23]]).
    sources: [lds-scriptures, nrsvue, delitzsch-psalms]

  - ref: 30
    phrase: executed judgment
    kind: words
    title: Phinehas stepped between
    body: |
      What Phinehas did was to intervene, and the translations render the verb three ways. At Peor Israel ate at “the sacrifices of their gods” ([[Num. 25:2]]) and “joined himself unto Baal-peor” ([[Num. 25:3]]), and a plague was killing the people. Phinehas, a grandson of Aaron, “took a javelin in his hand” ([[Num. 25:7]]), followed an Israelite man and a woman into the tent and killed them both, and “the plague was stayed from the children of Israel” ([[Num. 25:8]]). By then “those that died in the plague were twenty and four thousand” ([[Num. 25:9]]).

      The Hebrew verb probably has the sense “intervene, interpose,” and both judging and praying come from it. The King James takes the judging side. A modern translation has “interceded.” The ancient Greek has “made atonement,” and Numbers says of the deed that Phinehas “made an atonement for the children of Israel” ([[Num. 25:13]]).

      Moses stood in the breach “to turn away his wrath” (verse 23), and the LORD said of Phinehas that he “hath turned my wrath away from the children of Israel” ([[Num. 25:11]]).
    sources: [lds-scriptures, bd-phinehas, bdb, nrsvue, lxx-rahlfs]

  - ref: 31
    phrase: counted unto him for righteousness
    kind: scripture
    title: The words said of Abraham, said of a priest
    body: |
      The phrase is the one Genesis uses of Abraham: “he believed in the LORD; and he counted it to him for righteousness” ([[Gen. 15:6]]). Paul builds on that verse, “Abraham believed God, and it was counted unto him for righteousness” ([[Rom. 4:3]]). The psalm says it of a deed.

      In Numbers, what Phinehas received was a covenant. “Behold, I give unto him my covenant of peace” ([[Num. 25:12]]), “And he shall have it, and his seed after him, even the covenant of an everlasting priesthood; because he was zealous for his God” ([[Num. 25:13]]). The psalm’s “unto all generations for evermore” answers to that promise to his seed.

      On one older reading the two passages do not disagree. The deed was “an act which sprang from a constancy in faith,” and it showed him to be the righteous man he already was.
    sources: [lds-scriptures, delitzsch-psalms]

  - ref: 33
    phrase: they provoked his spirit
    kind: words
    title: Whose spirit was provoked at the waters of strife
    body: |
      The spirit that was provoked may be Moses’s or God’s. As the King James reads, the people embittered Moses until he spoke rashly, and a modern translation has “they made his spirit bitter.” But the Hebrew verb is the one behind “provoked” in verses 7 and 43, where the rebellion is against God, and its sense is to “be contentious, refractory, rebellious.” On that reading the people rebelled against God’s Spirit, as Isaiah says of Israel, “they rebelled, and vexed his holy Spirit” ([[Isa. 63:10]]), and Moses “suffered himself to be carried away by the persevering obstinacy of the people.”

      Either way the psalm keeps two faults apart. The waters of strife are the “water of Meribah” ([[Num. 20:13]]) of the fortieth year; the earlier Meribah is explained at [[Ps. 81:7]]. There Moses said, “Hear now, ye rebels; must we fetch you water out of this rock?” ([[Num. 20:10]]), and the LORD’s charge was against him and Aaron: “Because ye believed me not, to sanctify me in the eyes of the children of Israel, therefore ye shall not bring this congregation into the land which I have given them” ([[Num. 20:12]]).

      The psalm does not excuse the words; “unadvisedly” is its verdict on them. But it lays the occasion on the people, as Moses himself did: “the LORD was angry with me for your sakes” ([[Deut. 1:37]]).
    sources: [lds-scriptures, delitzsch-psalms, nrsvue, bdb]

  - ref: 37
    phrase: unto devils
    kind: history
    title: The gods of Canaan called demons
    body: |
      The psalm says that the children sacrificed to Canaan’s idols were given to demons. That is what the King James “devils” means here: a modern translation has “demons,” and the Hebrew word, glossed “apparently demon,” is the one in the Song of Moses: “They sacrificed unto devils, not to God; to gods whom they knew not” ([[Deut. 32:17]]). Paul says the same to the Corinthians: “the things which the Gentiles sacrifice, they sacrifice to devils, and not to God” ([[1 Cor. 10:20]]).
    sources: [lds-scriptures, bdb, nrsvue]

  - ref: 45
    phrase: he remembered for them his covenant
    kind: scripture
    title: The covenant that threatened the scattering also promised this
    body: |
      God’s remembering is itself promised in the covenant. The chapter of Leviticus that warns, “I will scatter you among the heathen” ([[Lev. 26:33]]), goes on to name a condition, “If they shall confess their iniquity, and the iniquity of their fathers” ([[Lev. 26:40]]), and then a promise: “Then will I remember my covenant with Jacob, and also my covenant with Isaac, and also my covenant with Abraham will I remember; and I will remember the land” ([[Lev. 26:42]]). The psalm before this one opens its history with the same remembering: “He hath remembered his covenant for ever” ([[Ps. 105:8]]).

      The book of Judges tells the years in the land the same way. There the LORD “sold them into the hands of their enemies round about” ([[Judg. 2:14]]), then “raised up judges” ([[Judg. 2:16]]), for “it repented the LORD because of their groanings” ([[Judg. 2:18]]).

      Where the King James says that God “repented,” a modern translation has that He “showed compassion according to the abundance of his steadfast love.” The mercy in that line is the covenant love explained at [[Ps. 51:1]].

      [The People Forget; God Remembers](/psalms/themes/forget-and-remember/) follows God’s remembered covenant from this verse to the gathering prayed for in Psalm 106:47 and given thanks for in Psalm 107.
    sources: [lds-scriptures, nrsvue]

  - ref: 47
    phrase: gather us from among the heathen
    kind: scripture
    title: The ending in David’s song, and in Ammon’s
    body: |
      The psalm’s last two verses are also the last lines of the song Chronicles gives to David. There the prayer reads, “Save us, O God of our salvation, and gather us together, and deliver us from the heathen, that we may give thanks to thy holy name, and glory in thy praise” ([[1 Chr. 16:35]]). The psalm ends with a call, “let all the people say, Amen.” Chronicles reports it answered: “And all the people said, Amen, and praised the LORD” ([[1 Chr. 16:36]]). The rest of that song is set out at [[Ps. 105:1]].

      Verse 48 is at once the end of the psalm and the end of Book Four. The endings of the five books are compared at [[Ps. 150:6]].

      Ammon’s thanksgiving in the Book of Mormon is close to this prayer. Rejoicing over the Lamanite converts, he says, “let us give thanks to his holy name” ([[Alma 26:8]]), in language that “likely borrows from scriptural sources such as Psalms 106–107.”
    sources: [lds-scriptures, sc-knowhy-133]

christ: |
  The psalm calls the LORD “God their saviour” (verse 21), and Paul names Him. Going over this same wilderness history for the Corinthians, he writes, “Neither let us tempt Christ, as some of them also tempted” ([[1 Cor. 10:9]]). The one Israel put to the test in the wilderness is, for Paul, Christ.

  Moses in the breach is the psalm’s picture of one who stands between, and his pleading after the calf “can remind us of Jesus Christ, who is our advocate with the Father.” The Joseph Smith Translation sets the two side by side. Moses “was ordained by the hand of angels to be a mediator of this first covenant,” but “there is one mediator of the new covenant, who is Christ.”

explore: |
  - **The companion psalm.** [[Ps. 105]], the same history told as what God did.
  - **The other confessions.** Solomon’s prayer in [[1 Kgs. 8:46–50]], Daniel’s in [[Dan. 9:4–19]], and the Levites’ in [[Neh. 9]].
  - **The history as the LORD tells it.** [[Ezek. 20]], with its refrain “for my name’s sake.”
  - **Paul’s use of these scenes.** [[1 Cor. 10:1–11]], which ends, “they are written for our admonition” ([[1 Cor. 10:11]]).
  - **The stories behind the psalm.** [[Ex. 32]] for the calf; [[Num. 11]], [[Num. 14]], [[Num. 16]], [[Num. 20]] and [[Num. 25]] for the rest.
  - **The next psalm.** Book Five opens with the thanksgiving of this psalm’s first verse and goes on to a people of whom it says He “gathered them out of the lands” ([[Ps. 107:3]]).

parallels:
  - ref: 1 Chr. 16:34–36
    note: The psalm’s first verse and its last two close the song David gave to Asaph.
  - ref: 1 Kgs. 8:47
    note: Solomon foresees captives confessing in the words of verse 6.
  - ref: Dan. 9:5
    note: Daniel makes the same confession.
  - ref: Ezek. 20:23
    note: The LORD lifted up His hand in the wilderness to scatter them among the heathen, as in verses 26–27.
  - ref: Ex. 32:10–14
    note: Moses pleads after the calf; the psalm says he stood in the breach.
  - ref: Num. 25:11–13
    note: Phinehas turns away wrath and receives the covenant of an everlasting priesthood.
  - ref: Rom. 1:23
    note: Paul speaks of changing the glory of God into an image, in words close to verse 20.
  - ref: 1 Cor. 10:6–11
    note: Paul draws warnings from the wilderness scenes the psalm confesses.
  - ref: Lev. 26:40–42
    note: Confession of their own and their fathers’ iniquity, and the covenant remembered.
  - ref: Ps. 105:8
    note: The companion psalm begins from the covenant God remembers.

