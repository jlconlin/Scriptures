chapter: 97
title: Light Is Sown for the Righteous
tagline: The LORD reigns and comes in cloud and fire; the hills melt, the idols’ servants are shamed, Zion hears and is glad, and for the righteous there is light.
when: 'Undated; the psalm has no title'

setting: |
  Psalm 97 has no title. The ancient Greek translation supplies one: “For David, when his land is established.” One older reading sets the ascription to David aside and dates the psalm after the return from exile, as a piece of “mosaic-work” made from earlier psalms and from the prophets, “more especially of Isaiah.” That is one judgment; the psalm itself names no author and no occasion.

  Much of the psalm does stand elsewhere in nearly the same words: the throne’s foundation in [[Ps. 89:14]], the lightnings in [[Ps. 77:18]], Zion and the daughters of Judah in [[Ps. 48:11]], the last line in [[Ps. 30:4]]. That older reading holds the closing verses, and verse 11 above all, to be the psalm’s own.

  It stands in the fourth of the Psalter’s five books (Psalms 90–106) and is counted with the psalms of praise. It is the second psalm to open with “The LORD reigneth,” after [[Ps. 93:1]] and before [[Ps. 99:1]], and it follows a psalm that ends with the LORD coming “to judge the earth” ([[Ps. 96:13]]).

thread: |
  The psalm announces that the LORD reigns and then follows the news outward and home again. **The joy asked of the whole earth in verse 1 is found, by verse 8, in Zion, and by the end it is promised to the righteous.**

  Verse 1 calls on the earth and its coasts to be glad. Verses 2–6 say why by showing the King: cloud and thick darkness around Him, fire before Him, lightning over the world, the hills running like wax. The earth sees and trembles; “all the people see his glory.”

  Verse 7 is the first response, and it is shame: those who serve images are confounded, and the gods themselves are told to bow.

  The turn is verse 8. “Zion heard, and was glad,” and at the same moment the psalm stops speaking about the LORD and speaks to Him: “thy judgments, O LORD,” “thou, LORD, art high.” What made the earth tremble makes Zion rejoice.

  Verses 10–12 then turn to the hearers. Those who love the LORD are to hate evil; He keeps them. Light is sown for the righteous, and gladness with it.

sections:
  - range: 1-6
    heading: The King comes
    plain: |
      The LORD is King. Let the earth rejoice; let the many coastlands be glad. Cloud and thick darkness are around Him; righteousness and justice are the foundation of His throne. Fire goes before Him and burns up His enemies on every side. His lightnings lit up the world; the earth saw and trembled. The hills melted like wax before the LORD, before the Lord of all the earth. The heavens tell His righteousness, and all the peoples see His glory.
  - range: 7-9
    heading: Idols shamed, Zion glad
    plain: |
      Let all who serve carved images be put to shame, those who boast in worthless idols; bow down to Him, all you gods. Zion heard and was glad, and the daughters of Judah rejoiced, because of Your judgments, O LORD. For You, LORD, are most high over all the earth; You are exalted far above all gods.
  - range: 10-12
    heading: Light for the righteous
    plain: |
      You who love the LORD, hate evil. He guards the lives of His faithful ones; He rescues them from the hand of the wicked. Light is sown for the righteous, and gladness for the upright in heart. Be glad in the LORD, you righteous, and give thanks at the remembrance of His holiness.

notes:
  - ref: 2
    phrase: Clouds and darkness are round about him
    kind: symbol
    title: The thick darkness where God is
    body: |
      The darkness around the LORD is a thick cloud: the word is not the ordinary Hebrew word for the dark but one for a “cloud, heavy cloud,” used of the cloud “in which God dwells.” At Sinai “the people stood afar off, and Moses drew near unto the thick darkness where God was” ([[Ex. 20:21]]), and Moses later reminded Israel that the mountain burned “with darkness, clouds, and thick darkness” ([[Deut. 4:11]]). The word stands beside “cloud” there as it does in this verse, and a modern translation gives the line as “Clouds and thick darkness are all around him.”

      So the darkness marks where God is, not that He is absent. Solomon said as much when the cloud filled the temple, in the verse the Church’s edition sets beside this one: “The LORD said that he would dwell in the thick darkness” ([[1 Kgs. 8:12]]).
    sources: [bdb, nrsvue, lds-scriptures]
  - ref: 2
    phrase: the habitation of his throne
    kind: words
    title: Habitation means foundation
    body: |
      Righteousness and judgment are what the throne stands on, not where it lives. “Habitation” translates a word for a “fixed or established place, foundation,” and this verse is listed as a figurative use of it. A modern translation has “the foundation of his throne,” and the ancient Greek “the establishment of his throne.”

      The same thing is said to the LORD, with the same word, in the psalm of the oath to David: “Justice and judgment are the habitation of thy throne” ([[Ps. 89:14]]).

      The verse sets two things side by side: a cloud around the King, and a foundation under His throne that the psalm can name. Both nouns come back: the heavens declare “his righteousness” in verse 6, and Zion is glad “because of thy judgments” in verse 8.
    sources: [bdb, nrsvue, lxx-rahlfs, lds-scriptures]
  - ref: 5
    phrase: The hills melted like wax
    kind: scripture
    title: A coming told as already seen
    body: |
      Verses 4 and 5 describe the LORD’s coming in the past tense, and they have been read of a coming still ahead. In the King James the fire “goeth” and “burneth,” but the lightnings “enlightened,” the earth “saw,” and the hills “melted.” Translators have handled the change differently. A modern translation puts every line in the present (“The mountains melt like wax before the Lord”). The ancient Greek makes verse 3 a future, “Fire shall go before him,” and keeps the past through verse 6: “The heavens have declared his righteousness.”

      The pictures are of things Israel had already seen. Verse 4 is nearly a line from a psalm about the day when “thy way is in the sea” ([[Ps. 77:19]]): “the lightnings lightened the world” ([[Ps. 77:18]]). Deborah sang that “the mountains melted from before the LORD, even that Sinai” ([[Judg. 5:5]]). The fire of verse 3 is taken up in the note on [[Ps. 50:3]].

      The Church’s edition places the psalm in the future: its heading has the Lord reigning “in millennial glory.” One older reading explains the past tense by the poet’s confidence: he “goes on to describe that which is future with historical certainty,” and what the earlier psalm said “of the manifestation of God in the earlier times he transfers to the revelation of God in the last time.”
    sources: [nrsvue, lxx-rahlfs, delitzsch-psalms, lds-scriptures]
  - ref: 7
    phrase: all ye gods
    kind: words
    title: Idols, gods, and two words that sound alike
    body: |
      Verse 7 has two different Hebrew words that sound alike: the *elilim* that men boast of and the *elohim* told to worship. *Elilim* is the prophets’ scornful word for “worthless gods, idols,” and a modern translation has “worthless idols.” The psalm before this one says outright that “all the gods of the nations are idols” ([[Ps. 96:5]]), and the wordplay is explained there.

      Who the *elohim* of the last line are, the verse does not say. The ancient Greek took them for heavenly beings: “worship him, all ye his angels” (on “angels” for this word, see the note on [[Ps. 8:5]]). The King James and the Greek have a command, as the vowel marks of the Hebrew text make the verb; a modern translation makes it a statement, “all gods bow down before him.”

      On any of these readings the outcome is the one verse 9 states: the LORD is “exalted far above all gods,” or, in a modern translation of the first half, “most high over all the earth.” The psalm does not stop to say what the gods are, only where they stand. The larger question of who “gods” are in the Psalms is taken up in the note on [[Ps. 82:6]].
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs]
  - ref: 7
    phrase: worship him
    kind: christ
    title: Hebrews gives this worship to the Son
    body: |
      The New Testament applies a command in these words to Jesus Christ. Hebrews says that when the Father “bringeth in the firstbegotten into the world, he saith, And let all the angels of God worship him” ([[Heb. 1:6]]).

      The sentence is in the Greek Old Testament, in two places. The Greek of this verse reads “worship him, all ye his angels.” The Greek of the Song of Moses has “let all the angels of God worship him,” which is Hebrews’ sentence word for word, in a verse ([[Deut. 32:43]]) where the King James has no such line. A modern translation restores it there as “worship him, all you gods!” and notes that the traditional Hebrew text “lacks this line,” which it supplies from another manuscript and the Greek.

      So Hebrews’ wording is closest to the Song of Moses, and this psalm carries the same command. In both the one to be worshipped is the LORD. Hebrews says it of the Son.
    sources: [lds-scriptures, lxx-rahlfs, nrsvue]
  - ref: 8
    phrase: Zion heard, and was glad
    kind: structure
    title: The joy of verse 1 comes home to Zion
    body: |
      The gladness asked of the earth in verse 1 is reported of Zion in verse 8, with the same pair of words. In verse 1 the earth is to “rejoice” and the isles to “be glad.” In verse 8 Zion “was glad” and the daughters of Judah “rejoiced,” in the other order.

      What Zion heard is not stated. The reason for her joy is: “because of thy judgments,” the word on which the throne stands in verse 2. Here too the psalm begins to address the LORD directly, and it does so for two verses only.

      The line is nearly one from a psalm about Zion: “Let mount Zion rejoice, let the daughters of Judah be glad, because of thy judgments” ([[Ps. 48:11]]). Who the daughters of Judah are is taken up in the note on [[Ps. 48:11]]. In Isaiah a cry much like this psalm’s first words is a message carried to Zion, by the one “that saith unto Zion, Thy God reigneth!” ([[Isa. 52:7]]).
    sources: [lds-scriptures]
  - ref: 11
    phrase: Light is sown for the righteous
    kind: words
    title: Light sown, or light dawned
    body: |
      The Hebrew says that light is sown, like seed, where several ancient translations read a different verb. The ancient Greek has “Light is sprung up for the righteous,” and a modern translation follows it and two other ancient versions with “Light dawns for the righteous,” noting that the Hebrew is “is sown.” The two verbs differ by their last letter, and the other one stands in a line much like this: “Unto the upright there ariseth light in the darkness” ([[Ps. 112:4]]). A standard lexicon judges that “dawns” should probably be read here.

      One older reading keeps “sown” and holds that the versions misread it. On that reading the light is not buried like grain but “strewn along his life’s way, so that he, the righteous one, advances step by step in the light.”
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, delitzsch-psalms]

christ: |
  The LORD who reigns in this psalm is Jehovah, and “Jehovah is the premortal Jesus Christ and came to earth as a son of Mary.” In the New Testament the worship commanded in verse 7 is given to the Firstbegotten ([[Heb. 1:6]]; see the note on verse 7).

  The Church’s edition heads the psalm as the Lord’s millennial reign, and many psalms of this fourth book are understood to describe the millennial day of the Messiah’s reign.

explore: |
  - **The LORD reigneth.** Read [[Ps. 93:1]], [[Ps. 96:10]] and [[Ps. 99:1]] beside this psalm, with [[Ps. 47:8]] and [[Isa. 52:7]], watching what each sets after the cry.
  - **Mountains at His presence.** [[Judg. 5:5]], [[Micah 1:3–4]], [[Nahum 1:5]], [[Isa. 64:1–3]] and [[D&C 133:40–44]].
  - **Light for the righteous.** [[Ps. 112:4]], [[Isa. 58:10]] and [[D&C 50:24]].

