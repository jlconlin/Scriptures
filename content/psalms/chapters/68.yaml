chapter: 68
title: Let God Arise
tagline: The God who marched from Sinai before His people goes up to the hill He has chosen, and the psalm that opens with His enemies scattered ends with the kingdoms of the earth called to sing.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  Psalm 68 stands in Book Two of the Psalms. Its title ascribes it to David and names no occasion.

  It opens with the words Moses spoke when the ark set forward, and that has led readers to look for a time when the ark moved. Two have been proposed from David’s life: the day he brought the ark up to Zion, and the war with Ammon and Syria, when the ark went out with the army. Neither is more than a proposal.

  The psalm’s Hebrew is hard. It has been placed with the Song of Deborah and the blessing of Moses in the earliest stage of the language. Two of its words occur only here, one of them marked “meaning unknown,” and a modern translation marks the Hebrew of verse 30 as uncertain. The notes say where the King James and later translations part.

  The psalm is full of older scripture. Moses’s words at the ark begin it, the march from Sinai is told in words of Deborah’s song, and Moses’s blessing has been set beside the thousands of verse 17. Paul quotes verse 18 of the ascended Christ ([[Eph. 4:8]]).

thread: |
  Psalm 68 follows **God on the move**. He arises (verse 1), marches through the wilderness before His people (verse 7), scatters kings (verse 14), chooses a hill to dwell in (verse 16), and ascends on high as a conqueror (verse 18). Then the worshippers see His “goings” in the sanctuary (verse 24). Verse 17 sets Sinai and the holy place side by side.

  The psalm has been divided after the ascent of verse 18 into two halves, the first dwelling “more upon the mighty deed God has wrought” and the second on what that deed works in His people and in the nations. The second half opens with a blessing, “Blessed be the Lord” (verse 19), and the psalm closes on the same word: “Blessed be God” (verse 35).

  The God who does all this is described before the march begins: “A father of the fatherless, and a judge of the widows” (verse 5). Along the way the psalm names the poor, for whom He has prepared of His goodness (verse 10), and the woman who stayed at home and divided the spoil (verse 12).

  The last movement widens the circle. Kings bring presents because of the temple at Jerusalem (verse 29), Egypt and Ethiopia come, and the “kingdoms of the earth” are told to sing (verse 32). The rider of verse 4 rides again in verse 33, and the psalm’s last statement is that He gives strength to His people.

sections:
  - range: 1-3
    heading: Let God arise
    plain: |
      Let God arise and His enemies be scattered; let those who hate Him run from before Him. Drive them off like smoke; as wax melts in front of a fire, let the wicked perish in God’s presence. But let the righteous be glad and rejoice before God, with great joy.
  - range: 4-6
    heading: Father of the fatherless
    plain: |
      Sing to God; sing praises to His name. Extol Him who rides upon the heavens, whose name is JAH, and rejoice before Him. In His holy dwelling God is a father to the fatherless and a defender of widows. God gives the solitary a household and brings out those who are bound in chains, but the rebellious live in a dry land.
  - range: 7-10
    heading: The march from Sinai
    plain: |
      O God, when You went out before Your people and marched through the wilderness, the earth shook and the heavens poured down at God’s presence; Sinai itself was moved at the presence of God, the God of Israel. You sent plentiful rain, O God, and strengthened Your inheritance when it was weary. Your congregation settled in it; in Your goodness, O God, You provided for the poor.
  - range: 11-14
    heading: The word, and those who published it
    plain: |
      The Lord gave the word, and a great company published it. Kings and their armies fled, and fled again, and the woman who stayed at home divided the spoil. Though you have lain among the pots, you will be like the wings of a dove covered with silver, her feathers with yellow gold. When the Almighty scattered kings in the land, it was white as snow on Salmon.
  - range: 15-18
    heading: The hill God desires
    plain: |
      The hill of God is like the hill of Bashan, a high hill like the hill of Bashan. Why do you leap, you high hills? This is the hill God desires to dwell in; the LORD will dwell in it for ever. God’s chariots are twenty thousand, thousands of angels; the Lord is among them, as at Sinai, in the holy place. You have ascended on high and led captivity captive; You have received gifts for men, even for the rebellious, so that the LORD God might dwell among them.
  - range: 19-23
    heading: The God of salvation
    plain: |
      Blessed be the Lord, who loads us with benefits day by day, the God of our salvation. Our God is the God who saves, and the ways out from death belong to GOD the Lord. But God will strike the head of His enemies, of anyone who goes on in his trespasses. The Lord said, “I will bring my people back from Bashan; I will bring them back from the depths of the sea,” so that your foot may be dipped in the blood of your enemies, and the tongues of your dogs in the same.
  - range: 24-27
    heading: The procession in the sanctuary
    plain: |
      They have seen Your goings, O God, the goings of my God, my King, in the sanctuary. The singers went first and the players on instruments after, and among them the young women playing timbrels. Bless God in the congregations, bless the Lord, you who spring from the fountain of Israel. There is little Benjamin with their ruler, the princes of Judah and their council, the princes of Zebulun and the princes of Naphtali.
  - range: 28-31
    heading: Kings shall bring presents
    plain: |
      Your God has commanded your strength; strengthen, O God, what You have done for us. Because of Your temple at Jerusalem kings will bring presents to You. Rebuke the company of spearmen, the herd of bulls with the calves of the peoples, until each submits with pieces of silver; scatter the peoples who delight in war. Princes will come out of Egypt; Ethiopia will soon stretch out her hands to God.
  - range: 32-35
    heading: Sing, ye kingdoms of the earth
    plain: |
      Sing to God, you kingdoms of the earth; sing praises to the Lord, to Him who rides upon the ancient heaven of heavens. He sends out His voice, a mighty voice. Ascribe strength to God; His majesty is over Israel and His strength is in the clouds. O God, You are awesome from Your holy places. The God of Israel gives strength and power to His people. Blessed be God.

notes:
  - ref: 1
    phrase: Let God arise, let his enemies be scattered
    kind: scripture
    title: The words Moses spoke when the ark set out
    body: |
      The psalm begins with the words Moses said when the ark of the covenant set forward in the wilderness: “Rise up, LORD, and let thine enemies be scattered; and let them that hate thee flee before thee” ([[Num. 10:35]]). The Hebrew of the two verses has the same three verbs in the same order (arise, be scattered, flee) and the same two words for the enemies.

      Two things are changed. Moses spoke to the LORD, and the psalm speaks about Him: “thine enemies” has become “his enemies,” so that a prayer said at the head of a marching camp is now a wish. And where Moses used the divine name, the psalm has “God.”

      Another psalm takes its cry from the same words (see the note on [[Ps. 3:7]]).
    sources: [oshb-wlc, lds-scriptures]

  - ref: 4
    phrase: rideth upon the heavens
    kind: words
    title: A rider through the deserts, or on the clouds
    body: |
      The Hebrew word here is not the word for heavens. It is the plural of *arabah*, a “desert-plain, steppe,” here in its general sense, “the steppe.” Read so, the line praises the God who rides through the wilderness, and three verses later the psalm describes that march.

      The King James “heavens” matches the end of the psalm, where God “rideth upon the heavens of heavens” (verse 33); there the Hebrew does have the word for heavens. A modern translation has “him who rides upon the clouds” and gives the other reading in its margin: “cast up a highway for him who rides through the deserts.” The ancient Greek has him who “rides upon the west.”
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs]

  - ref: 4
    phrase: JAH
    kind: words
    title: The short form of the divine name
    body: |
      JAH is *Yah*, the divine name in a shortened form, “contracted from” the four-letter name that the King James usually prints as LORD. The song at the Red Sea has it ([[Ex. 15:2]]); it “first appears in early poems” such as that one, and it is the last syllable of *hallelujah* (see the note on [[Ps. 150:1]]).

      The name comes twice in this psalm. The second time the King James translates it: “the LORD God” of verse 18 is *Yah Elohim* in Hebrew.
    sources: [bdb, oshb-wlc]

  - ref: 6
    phrase: God setteth the solitary in families
    kind: words
    title: The solitary brought home
    body: |
      The line says in Hebrew that God makes the solitary dwell in a house. The “solitary” have been explained as “friendless wanderers or exiles,” whom God causes “to dwell at home.” A modern translation has “God gives the desolate a home to live in.”

      The second half of the line says a like thing of prisoners, who are brought out of their chains. Both halves continue verse 5: the God who is father to the fatherless and judge of the widow gives the one who is alone a household and the one who is bound his freedom.
    sources: [oshb-wlc, bdb, nrsvue]

  - ref: 8
    phrase: even Sinai itself was moved at the presence of God, the God of Israel
    kind: scripture
    title: The march from Sinai in Deborah’s words
    body: |
      Verses 7–8 share much of their wording with the Song of Deborah: “LORD, when thou wentest out of Seir, when thou marchedst out of the field of Edom, the earth trembled, and the heavens dropped, the clouds also dropped water” ([[Judg. 5:4]]). The mountains melted, “even that Sinai from before the LORD God of Israel” ([[Judg. 5:5]]). The Hebrew of the two passages shares its verbs for going out and marching, its words for the earth quaking and the heavens dropping, the abrupt “this Sinai,” and the closing “God of Israel.”

      They differ too. The song names the LORD where the psalm says “God,” as in verse 1, and the song has Him march from Seir and Edom where the psalm has Him go “before thy people” through the wilderness. The song’s words return in verse 18, and perhaps in verse 13.

      In the psalm the shaking of Sinai is followed at once by rain: the God at whose presence the heavens dropped sends “a plentiful rain” on His weary inheritance (verse 9).
    sources: [oshb-wlc, lds-scriptures]

  - ref: 11
    phrase: great was the company of those that published it
    kind: words
    title: The women who carried the news
    body: |
      Those who “published” the word are women. The Hebrew is a feminine plural form of the verb to “bear tidings,” used of good news and here of a victory; a modern translation has “those who bore the tidings” and notes “company of the women.”

      The psalm keeps them in view. In the next verse “she that tarried at home divided the spoil,” and in the procession of verse 25 the young women play timbrels. After the Red Sea, Miriam took a timbrel, “and all the women went out after her with timbrels and with dances” ([[Ex. 15:20]]), and one reading sets this verse beside Miriam and Deborah: Israel’s deliverances from Pharaoh and from Sisera, with others after them, “were celebrated by singing women.”
    sources: [oshb-wlc, bdb, nrsvue, delitzsch-psalms, lds-scriptures]

  - ref: 13
    phrase: Though ye have lien among the pots
    kind: words
    title: Among the pots, the sheepfolds, or the hearths
    body: |
      The word the King James renders “pots” is uncertain. It is “probably” a form of the word in Deborah’s reproach of Reuben, “Why abodest thou among the sheepfolds” ([[Judg. 5:16]]), and the psalm’s phrase may be “based on” that line. That word is “probably fire-places or ash-heaps,” the hearths of a village or camp, though most interpreters have taken it as “sheepfolds,” and a modern translation has “among the sheepfolds” here.

      On one reading the picture is of peace after war. To lie among the sheepfolds is “an emblem of thriving peace,” and the dove is Israel, called God’s “turtledove” in another psalm ([[Ps. 74:19]]). The silver and gold on its wings are the spoil of verse 12: a time of “peaceful prosperity enhanced by rich spoils.”
    sources: [oshb-wlc, bdb, nrsvue, delitzsch-psalms]

  - ref: 16
    phrase: Why leap ye, ye high hills?
    kind: symbol
    title: The high hills probably look on with envy
    body: |
      The high hills are probably watching with envy, not leaping. The Hebrew verb is found only here, and its sense is given as to “watch stealthily, or with envious hostility”; a modern translation renders the line “Why do you look with envy, O many-peaked mountain.”

      Bashan is the “district east of Jordan and north of Gilead,” and in that translation verse 15 addresses its heights: “O mighty mountain, mountain of Bashan.” They watch another hill, the one “which God desireth to dwell in.” The verse does not name it, but verse 29 speaks of “thy temple at Jerusalem,” and the hill has been identified as the temple mount, Mount Moriah ([[2 Chr. 3:1]]). This is one of the verses in which the Psalms “define the temple as the Lord’s dwelling place.”

      What sets the hill apart in the verse is God’s desire for it. What it meant to go up that hill is told at [[Ps. 24:3]].
    sources: [oshb-wlc, bdb, nrsvue, bd-bashan, skinner-seeing-god]

  - ref: 17
    phrase: the Lord is among them, as in Sinai, in the holy place
    kind: words
    title: Sinai in the holy place
    body: |
      The Hebrew of this clause is four words with no verb and no “as”: the Lord, among them, Sinai, in the holy place. The King James supplies “as in” to make a comparison. A modern translation, marking a correction of the text, reads “the Lord came from Sinai into the holy place.”

      On either reading the verse names Sinai and the holy place together, and a host is with the Lord. Moses’s blessing has been set beside the verse: “The LORD came from Sinai,” and “he came with ten thousands of saints” ([[Deut. 33:2]]).

      “Thousands of angels” translates a word of uncertain meaning. It has been explained as “repetition,” that is, “thousands twice-told”; the ancient Greek has “thousands of rejoicing ones.”
    sources: [oshb-wlc, nrsvue, bdb, lxx-rahlfs]

  - ref: 18
    phrase: thou hast received gifts for men
    kind: christ
    title: Received gifts, and gave them
    body: |
      In the psalm this is a conqueror’s ascent: God goes up on high “leading captives” and receives gifts. “Led captivity captive” is the phrase sung to Barak in Deborah’s song, with the same Hebrew verb and noun: “lead thy captivity captive” ([[Judg. 5:12]]). The next clause has been read as gifts received “among men”; the ancient Greek has “thou hast received gifts for man,” and a modern translation “receiving gifts from people.” Read as received “among men,” the gifts are homage, “like to the tribute which the vanquished bring to the victor.”

      Paul quotes the verse with “gave” where the psalm has “received”: “When he ascended up on high, he led captivity captive, and gave gifts unto men” ([[Eph. 4:8]]). His wording is not the Greek version’s, which has “received,” and it has been asked whether he had an old Aramaic paraphrase of the psalm in mind. One reading explains Paul’s “gave” from what the verse had come to mean. Paul “interprets in the light and in the sense of the history that realizes it”: what this Victor gained “He has gained not for His own aggrandisement, but for the interests of men,” and the gifts He received are gifts “which He now distributes among men.”

      Paul then says who ascended and what the gifts are. The ascent is Christ’s, and it followed a descent: “He that descended is the same also that ascended up far above all heavens, that he might fill all things” ([[Eph. 4:10]]). The gifts are those who minister in His Church: “he gave some, apostles; and some, prophets; and some, evangelists; and some, pastors and teachers” ([[Eph. 4:11]]). A revelation to Joseph Smith speaks of Jesus Christ in the same pair of terms: “He that ascended up on high, as also he descended below all things” ([[D&C 88:6]]).
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, delitzsch-psalms, lds-scriptures]

  - ref: 20
    phrase: the issues from death
    kind: words
    title: Escapes from death
    body: |
      “Issues” are ways out. The Hebrew noun means an “outgoing,” and in this verse it is glossed “escapes from (literally for, i.e. in view of) death”; a modern translation has “to God, the Lord, belongs escape from death.”

      The line is the second half of a pair. In the first half “salvation” is a plural too, “saving acts,” and the second half names death. The psalm does not say how death is escaped. It says to whom the way out belongs.
    sources: [oshb-wlc, bdb, nrsvue]

  - ref: 22
    phrase: I will bring again from Bashan
    kind: words
    title: Whom the Lord brings back
    body: |
      The Hebrew does not say whom the Lord will bring back. It has only the verb, twice, with “from Bashan” and “from the depths of the sea,” and the King James supplies “my people.” A modern translation supplies “them.”

      Two answers have been given. Jewish captives after the destruction of Jerusalem are said to have taken the verse as “a promise which has Israel as its object.” The other reading looks to the next verse, which gives the purpose, and concludes that “the foes of Israel are conceived of as its object”: even if they hide “in the most out-of-the-way places, God will fetch them back.”

      Verse 23 is a battlefield image of total defeat. In verse 21 the one who strikes is God. How such lines are read is discussed at [[Ps. 137:8]].
    sources: [oshb-wlc, nrsvue, delitzsch-psalms]

  - ref: 24
    phrase: They have seen thy goings, O God
    kind: history
    title: A procession into the sanctuary
    body: |
      The “goings” are a procession, whether of the worshippers or of God Himself. The Hebrew word means “a going, way, travelling-company,” and this verse is placed under the “going, marching, progress of God into the sanctuary”; a modern translation has “the processions of my God, my King, into the sanctuary.”

      The word may refer “to solemn processions of worshippers” or “to the theophanic progress of God himself” (a theophany is an appearing of God). The psalm has followed God from Sinai to His hill, and verse 25 shows the worshippers: singers first, players after, young women with timbrels among them, and then the tribes with their princes.

      The psalm is among those that have been judged “clearly designed for antiphonal dialogue,” sung in call and response, and a modern translation sets verse 26 in quotation marks, as words sung: “Bless God in the great congregation.”
    sources: [oshb-wlc, bdb, nrsvue, hopkin-psalms-sung]

  - ref: 31
    phrase: Ethiopia shall soon stretch out her hands unto God
    kind: history
    title: Egypt and Cush come to God
    body: |
      “Ethiopia” is Cush in Hebrew, the land reaching southward from the frontier of Egypt, and the verse names it with Egypt among those who come to God.

      Who comes from Egypt is not certain. “Princes” translates a word found only here, its “meaning unknown”; the ancient Greek has “Ambassadors shall arrive out of Egypt,” and a modern translation “Let bronze be brought from Egypt.”
    sources: [oshb-wlc, bd-ethiopia, bdb, lxx-rahlfs, nrsvue]

christ: |
  The Church’s edition heads this psalm as messianic, and the New Testament shows where. Paul reads the ascent of verse 18 as the ascension of Jesus Christ, and the gifts of that verse as gifts the risen Lord gives to His Church (see the note on verse 18). He adds what the psalm does not say, that the one who went up had first gone down: “Now that he ascended, what is it but that he also descended first into the lower parts of the earth?” ([[Eph. 4:9]]).

  The God of the psalm bears the divine name in its short form, JAH. He is “a father of the fatherless, and a judge of the widows” (verse 5), He “daily loadeth us with benefits” (verse 19), and to Him “belong the issues from death” (verse 20). The psalm’s last statement about Him is that He “giveth strength and power unto his people.”

explore: |
  - **The song behind the psalm.** [[Judg. 5]], read with verses 7–8, 13 and 18 open.
  - **The ark setting out and coming to rest.** [[Num. 10:33–36]], the two sayings of Moses of which verse 1 takes the first.
  - **Moses’s blessing.** [[Deut. 33:2]], the Lord coming from Sinai with His thousands, and the God “who rideth upon the heaven” ([[Deut. 33:26]]).
  - **The gifts of the ascended Christ.** [[Eph. 4:7–16]], Paul’s reading of verse 18 in full.

parallels:
  - ref: Num. 10:35
    note: Moses’s words when the ark set forward, which verse 1 repeats as a wish.
  - ref: Judg. 5:4–5
    note: The Song of Deborah has the march of verses 7–8 in much the same Hebrew.
  - ref: Deut. 33:2
    note: The LORD comes from Sinai with ten thousands of saints; compare verse 17.
  - ref: Eph. 4:8
    note: Paul quotes verse 18 of Christ’s ascension, with “gave gifts unto men.”
  - ref: D&C 88:6
    note: Jesus Christ is the one who “ascended up on high” and “descended below all things.”

