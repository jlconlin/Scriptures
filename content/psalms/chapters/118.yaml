chapter: 118
title: The Stone Which the Builders Refused
tagline: A man who was hemmed in by enemies and nearly dead comes to the temple gate to give thanks, and the blessing spoken there is the one Jerusalem later shouted to Jesus.
when: 'Undated; the psalm has no title'

setting: |
  The psalm has no title and names no occasion. It is the last psalm of the Hallel, Psalms 113–118, a group “recited by Jews at the great feasts” (see the note on [[Ps. 113:1]]).

  It begins and ends with one sentence, “O give thanks unto the LORD; for he is good,” which also opens [[Ps. 107]]. Between the two comes one man’s account of a rescue, which from verse 19 on is set at the temple’s gate and then at its altar. The psalm has been called a “thanksgiving liturgy related to entrance to the sanctuary.” One older reading places it after the return from Babylon, at the dedication of the rebuilt temple; the psalm itself does not say.

  The psalm runs through the last week of the Savior’s life. The crowds at His entry into Jerusalem shouted verses 25 and 26. He quoted verses 22 and 23 of Himself in the temple, and Peter did the same before the council. By one count the New Testament cites or alludes to this psalm at least fifteen times.

thread: |
  Psalm 118 moves **from a tight place to an open gate, and from “I” to “we.”** It starts with a call to three groups to answer with one sentence. Then one voice takes over and tells what happened to him. He called “in distress” and was set “in a large place.” He was surrounded, and the psalm says “compassed” four times in three verses. He was pushed hard to make him fall, and the LORD helped him.

  At verse 14 the story becomes a song, and it is not a new one. It is a line from the song of Moses, followed by a threefold cheer for “the right hand of the LORD.” Verses 17 and 18 say what the rescue amounted to: “I shall not die, but live.”

  Verse 19 is the turn. The man who was hemmed in stands before gates and asks that they be opened, and verse 20 reads as the answer. From there the singular gives way to the plural: “it is marvellous in our eyes,” “we will rejoice.” The saying about the stone comes in that plural voice. What was refused has become the head of the corner, and it is the LORD’s doing.

  The psalm does not end there. Having given thanks for a rescue, it asks for another: “Save now.” A blessing comes back from inside the house, the procession reaches the altar, and the first sentence is said again.

sections:
  - range: 1-4
    heading: Let Israel now say
    plain: |
      Give thanks to the LORD, for He is good; His mercy endures for ever. Let Israel say it: His mercy endures for ever. Let the house of Aaron say it. Let those who fear the LORD say it.
  - range: 5-9
    heading: Out of distress, into a large place
    plain: |
      In my distress I called on the LORD, and He answered me and set me in a wide place. The LORD is on my side, and I will not be afraid; what can man do to me? The LORD takes my part among those who help me, so I shall see my desire on those who hate me. It is better to trust in the LORD than to rely on man, better to trust in the LORD than to rely on princes.
  - range: 10-14
    heading: They compassed me about
    plain: |
      All nations surrounded me, but in the name of the LORD I will destroy them. They surrounded me, surrounded me on every side, but in the name of the LORD I will destroy them. They swarmed round me like bees and went out like a fire of thorns; in the name of the LORD I will destroy them. You pushed me hard to make me fall, but the LORD helped me. The LORD is my strength and my song, and He has become my salvation.
  - range: 15-18
    heading: I shall not die, but live
    plain: |
      The sound of joy and salvation is in the tents of the righteous: the right hand of the LORD does valiantly; the right hand of the LORD is lifted high; the right hand of the LORD does valiantly. I shall not die; I shall live and tell what the LORD has done. The LORD has disciplined me severely, but He has not handed me over to death.
  - range: 19-21
    heading: Open to me the gates
    plain: |
      Open the gates of righteousness to me; I will go in through them and praise the LORD. This is the gate of the LORD, and the righteous shall enter by it. I will praise You, for You have heard me and have become my salvation.
  - range: 22-25
    heading: The stone, the day, and “Save now”
    plain: |
      The stone the builders refused has become the head stone of the corner. This is the LORD’s doing, and it is a marvel in our eyes. This is the day the LORD has made; we will rejoice and be glad in it. Save, we beg You, O LORD; O LORD, we beg You, send prosperity.
  - range: 26-29
    heading: Blessed be he that cometh
    plain: |
      Blessed is he who comes in the name of the LORD; we have blessed you from the house of the LORD. The LORD is God, and He has given us light. Bind the sacrifice with cords, all the way to the horns of the altar. You are my God, and I will praise You; You are my God, and I will exalt You. Give thanks to the LORD, for He is good; His mercy endures for ever.

notes:
  - ref: 2
    phrase: Let Israel now say
    kind: history
    title: Three groups called to answer
    body: |
      The psalm opens by calling three groups, one after another, to answer with the same sentence: Israel, the house of Aaron, and “them that fear the LORD.” [[Ps. 115:9–11]] addresses the same three in the same order, ending, “Ye that fear the LORD, trust in the LORD” ([[Ps. 115:11]]).

      The psalm does not say who the third group is. One older reading takes the first two as the laity and the priests and the third, “as it appears,” as proselytes, people from outside Israel who had come to fear Israel’s God. That is offered as likely, not as certain.

      Their answer, “his mercy endureth for ever,” is the sentence sung when the foundation of the second temple was laid: priests and Levites “sang together by course” that the LORD is good, “for his mercy endureth for ever toward Israel” ([[Ezra 3:11]]). The “mercy” is the covenant love explained at [[Ps. 51:1]].
    sources: [lds-scriptures, delitzsch-psalms]

  - ref: 5
    phrase: set me in a large place
    kind: words
    title: From a strait to a wide place
    body: |
      The rescue is pictured as room to move. “Distress” translates a Hebrew noun meaning “straits,” a tight place, and the “large place” is a “broad, roomy, place,” used here as a figure “of freedom from distress and anxiety.” A modern translation has “set me in a broad place.”

      The singer goes on to say that he was surrounded: “compassed me about” comes four times in verses 10–12.
    sources: [bdb, nrsvue]

  - ref: 10
    phrase: All nations compassed me about
    kind: history
    title: Who is surrounded by all nations
    body: |
      The psalm never names its speaker, and what he says fits either a king or a people speaking as one man: it is “all nations” that surround him. Thanksgiving psalms such as this one voice the gratitude “of an individual or community” after a deliverance, and the rejected stone of verse 22 “could then refer to a king or to Israel herself.” The whole psalm has been read “as though it were written to celebrate the Lord’s redeeming Israel” after her suffering under foreign powers.

      “In the name of the LORD” is said three times, once for each “I will destroy them,” where a modern translation has “I cut them off.” Verse 13 then says how near he came to falling: “but the LORD helped me.”
    sources: [hopkin-psalms-sung, frederick-use-of-ot, wayment-psalms-matthew, nrsvue]

  - ref: 14
    phrase: The LORD is my strength and song, and is become my salvation
    kind: scripture
    title: The song of Moses, sung again
    body: |
      Verse 14 is a line from the song of Moses, which Moses and the children of Israel sang when the LORD had thrown horse and rider into the sea: “The LORD is my strength and song, and he is become my salvation” ([[Ex. 15:2]]). The singer gives thanks for his own rescue in the words of that earlier one.

      Isaiah uses the same line of a day still to come. “In that day,” he tells his hearers, they will say, “the LORD JEHOVAH is my strength and my song; he also is become my salvation” ([[Isa. 12:2]]).
    sources: [lds-scriptures]

  - ref: 19
    phrase: Open to me the gates of righteousness
    kind: structure
    title: A request at the gate, and an answer
    body: |
      At verse 19 the singer has reached the temple and asks to be let in, and verse 20 reads as the reply from inside.

      One older reading divides the whole psalm between two choirs. Verses 1–19 are “sung by the festive procession” on its way up to the temple; verses 20–27 belong to “the body of Levites who receive the festive procession”; verse 28 is the reply of those who have arrived, and verse 29 is sung by everyone. The exact division is a reconstruction. That voices alternate is plain from the text: “we have blessed you out of the house of the LORD” (verse 26) is spoken by people already inside.

      The reply names a condition: “the righteous shall enter.” Who may enter the LORD’s house is explained at [[Ps. 24:3]].

      Nephi alludes to the line in his own prayer: “O Lord, wilt thou not shut the gates of thy righteousness before me” ([[2 Ne. 4:32]]).
    sources: [delitzsch-psalms, hilton-psalms-bom, lds-scriptures]

  - ref: 22
    phrase: The stone which the builders refused is become the head stone of the corner
    kind: symbol
    title: A rejected stone, and what the head of the corner is
    body: |
      In the psalm the stone is a picture of the singer’s own reversal: he was thrust at and nearly dead, and now he stands in the LORD’s house. The saying may have been a proverb for a “transition from humiliation to honor,” and the stone could be a king or Israel herself. It appears that Jews of the Savior’s day read it of “their own nation and the return of the Davidic dynasty,” and there is “little, if any, evidence” that they understood the psalm of “the initial coming of the Messiah.” What He did with the verse is in the next note.

      Which stone is meant is less certain than the King James wording suggests. The ancient Greek translation has only “the head of the corner,” as the New Testament does where it quotes the verse. A modern translation has “the chief cornerstone,” and the proverb has been explained of a “foundation stone stabilizing two adjacent walls.” But because the psalm has just spoken of a gateway, a keystone has also been suggested. Either way the stone that was thrown aside ends as the one the building most depends on.
    sources: [frederick-use-of-ot, scripture-helps-ps-102, wayment-psalms-matthew, lxx-rahlfs, nrsvue]

  - ref: 23
    phrase: This is the LORD’s doing
    kind: christ
    title: The Savior says the stone is Himself
    body: |
      Jesus quoted verses 22 and 23 of Himself. He had just given the parable of the vineyard, whose tenants kill the owner’s son. Then He asked, “Did ye never read in the scriptures, The stone which the builders rejected, the same is become the head of the corner: this is the Lord’s doing, and it is marvellous in our eyes?” ([[Matt. 21:42]]). The chief priests and Pharisees “perceived that he spake of them” ([[Matt. 21:45]]). If they had taken the stone to be their own nation (see the note on verse 22), He read the verse to mean “the very opposite.”

      Peter named the builders to the council: “This is the stone which was set at nought of you builders, which is become the head of the corner” ([[Acts 4:11]]). Later he set the verse beside Isaiah’s cornerstone ([[1 Pet. 2:6–7]]; see the note on [[Isa. 28:16]]).

      In the Book of Mormon Jacob uses the verse looking ahead. He says that “by the stumbling of the Jews they will reject the stone upon which they might build and have safe foundation” ([[Jacob 4:15]]), and that “this stone shall become the great, and the last, and the only sure foundation, upon which the Jews can build” ([[Jacob 4:16]]). Then he asks how those who rejected it can ever build on it, “that it may become the head of their corner” ([[Jacob 4:17]]). The allegory of the olive tree follows at once ([[Jacob 5]]), and it has been suggested that the psalm in this way forms “an introduction to the allegory of the olive tree.”
    sources: [lds-scriptures, scripture-helps-ps-102, wayment-psalms-matthew, sc-knowhy-62]

  - ref: 25
    phrase: Save now, I beseech thee, O LORD
    kind: history
    title: The verse that became Hosanna
    body: |
      The word hosanna is taken from this verse, and it means “Save now.” The “now” is not a demand for speed. It renders a Hebrew “particle of entreaty,” a “please,” and a modern translation has “Save us, we beseech you.”

      The cry had a place in Israel’s worship. At the Feast of Tabernacles the chanting of this psalm went with the waving of palm branches, which is why the multitudes used the word when Jesus rode into Jerusalem. They joined it to the next verse: “Hosanna to the Son of David: Blessed is he that cometh in the name of the Lord; Hosanna in the highest” ([[Matt. 21:9]]). In the psalm the cry is a prayer to the LORD; the multitudes raised it “to the Son of David.”
    sources: [bd-hosanna, bdb, nrsvue, lds-scriptures]

  - ref: 26
    phrase: Blessed be he that cometh in the name of the LORD
    kind: christ
    title: A welcome said to the Savior once, and to be said again
    body: |
      In the psalm this blessing is spoken from the temple. The second half of the verse says where the speakers stand: “we have blessed you out of the house of the LORD.”

      The crowds said it to Jesus as He rode into Jerusalem, and in John’s account they added a title: “Blessed is the King of Israel that cometh in the name of the Lord” ([[John 12:13]]). Matthew 21 is framed by the psalm, with this verse near its beginning and verse 22 near its end.

      Jesus later used the verse of a day still ahead. After His woes on the scribes and Pharisees He said, “Ye shall not see me henceforth, till ye shall say, Blessed is he that cometh in the name of the Lord” ([[Matt. 23:39]]). The Pearl of Great Price gives the saying more fully. They will not see Him “until ye shall say: Blessed is he who cometh in the name of the Lord, in the clouds of heaven, and all the holy angels with him,” and the disciples then understood “that he should come again on the earth” ([[JS—M 1:1]]).
    sources: [lds-scriptures, wayment-psalms-matthew]

  - ref: 27
    phrase: bind the sacrifice with cords, even unto the horns of the altar
    kind: words
    title: A line whose meaning is uncertain
    body: |
      The second half of verse 27 is obscure in Hebrew, and translations differ about what is being bound. A modern translation marks it “Meaning of Heb uncertain.”

      The word the King James translates “sacrifice” is ordinarily the word for a feast; here the lexicon takes it as a “festival sacrifice,” which is the King James reading. The ancient Greek translation has both ideas: “celebrate the feast with thick branches, binding the victims even to the horns of the altar.” A modern translation leaves the victims out: “Bind the festal procession with branches, up to the horns of the altar.” The psalm has been read as picturing a procession that passes through the gates and circles the altar.

      The horns stood at the corners of the altar of burnt offering: “thou shalt make the horns of it upon the four corners thereof” ([[Ex. 27:2]]). On either reading the line ends at the altar.
    sources: [nrsvue, bdb, lxx-rahlfs, sc-knowhy-62, lds-scriptures]

christ: |
  The Savior read this psalm of Himself. He is the stone the builders refused, by His own word in the temple ([[Matt. 21:42]]) and by Peter’s before the council: “Neither is there salvation in any other” ([[Acts 4:12]]). The notes on verses 22–26 follow that reading through the Gospels and the Book of Mormon.

  He probably sang it as well. After the Last Supper, “when they had sung an hymn, they went out into the mount of Olives” ([[Matt. 26:30]]). The hymn “was probably” the Hallel, whose closing psalms, 115–118, were traditionally sung at the end of a Passover meal (see the note on [[Ps. 113:1]]). If so, this psalm, the last of them, was among the words He sang that night before going out. That is an inference from the custom; the Gospels do not name the hymn.

explore: |
  - **The stone through scripture.** [[Isa. 28:16]], [[Matt. 21:33–46]], [[Acts 4:8–12]], [[1 Pet. 2:4–8]] and [[Jacob 4:15–17]], with the allegory of the olive tree that follows in [[Jacob 5]].
  - **The song this psalm borrows.** [[Ex. 15:1–18]], and Isaiah’s use of the same line in [[Isa. 12]].
  - **The gate.** [[Ps. 24:3–6]] and [[Ps. 15]], on who may enter the LORD’s house, and [[2 Ne. 4:32–33]].
  - **The entry into Jerusalem.** [[Matt. 21:1–16]] and [[John 12:12–16]], where verses 25 and 26 are shouted.
  - **The rest of the Hallel.** [[Ps. 113]] through [[Ps. 117]].

parallels:
  - ref: Matt. 21:42
    note: Jesus quotes verses 22–23 of Himself after the parable of the vineyard.
  - ref: Matt. 21:9
    note: The multitudes shout verses 25 and 26 as He enters Jerusalem.
  - ref: Matt. 23:39
    note: The Savior says He will not be seen again until verse 26 is said.
  - ref: Acts 4:11
    note: Peter tells the council that they are the builders who set the stone at nought.
  - ref: Jacob 4:15–17
    note: Jacob foresees the rejection of the stone and asks how it can become “the head of their corner.”
  - ref: Ex. 15:2
    note: The line of the song of Moses that verse 14 repeats.
  - ref: Heb. 13:6
    note: Verse 6 is quoted, “I will not fear what man shall do unto me.”

