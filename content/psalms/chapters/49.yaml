chapter: 49
title: God Will Redeem My Soul
tagline: A singer calls the whole world to hear a riddle set to the harp, asks why he should fear the wealthy who wrong him, and answers with a price no man can pay and a God who will.
when: 'Undated; by its title a psalm for the sons of Korah'

setting: |
  Psalm 49 stands in Book Two and closes the first run of psalms that carry the name of the sons of Korah, a family whose descendants “sang at the temple.” The title’s terms are explained where they first appear: the sons of Korah at [[Ps. 42:1]] and “To the chief Musician” at [[Ps. 8:1]].

  The psalm is not a prayer. No line of it is addressed to God, who is named only twice (verses 7 and 15), and “the LORD” does not appear. The singer turns instead to an audience, “all ye inhabitants of the world,” and teaches: “The poet here steps forward as a preacher in the midst of men.” It is a teaching poem, counted among the “didactic psalms.”

  Nothing in it gives a date or an occasion. What it shows is a man with wealthy people around him who do him wrong (verses 5–6), and neighbors who are impressed by them (verses 16–18).

  After four verses of introduction the poem has two halves, verses 5–12 and 13–20, each closed by nearly the same line. Verse 15 has been taken up since: Nephi’s own psalm may echo it, and it has been taught in general conference of the Atonement of Jesus Christ (see the second note on verse 15).

thread: |
  Psalm 49 is **a question about fear, answered with a ransom**. The question is put in verse 5: “Wherefore should I fear in the days of evil,” when those who wrong him are rich and all around him?

  The first half answers by looking at what the rich cannot buy. Among men a life could sometimes be bought back with money. Before God it cannot: no one can “redeem his brother, nor give to God a ransom for him.” The wise die, the fool dies, the estate goes to someone else, and the man who named his lands after himself “abideth not.”

  The second half goes down with them. They are a flock driven to the grave with Death for a shepherd (verse 14). Then the psalm turns, and the singer speaks of himself for the first time since verse 5: “But God will redeem my soul from the power of the grave: for he shall receive me.” The verb is the one that verse 7 denied to every man. What no brother can pay for, God will do. The psalm does not say how, or at what price.

  From there the question of verse 5 comes back as counsel: “Be not thou afraid when one is made rich.” The refrain returns with one word changed: the man who is like the beasts that perish is now the man “that is in honour, and understandeth not.”

sections:
  - range: 1-4
    heading: A riddle for the whole world
    plain: |
      Hear this, all you peoples; listen, everyone who lives in the world, low and high, rich and poor together. My mouth will speak wisdom, and what my heart has pondered is understanding. I will bend my ear to a proverb; I will open my riddle to the music of the harp.
  - range: 5-9
    heading: No man can pay the ransom
    plain: |
      Why should I be afraid in evil days, when the wrongdoing of those at my heels surrounds me, people who trust in their wealth and boast of how rich they are? Not one of them can by any means redeem his brother or give God a ransom for him. The redemption of a soul is costly, and the attempt must be given up for ever: that he should go on living always and never see the pit.
  - range: 10-12
    heading: The wise die, and the fool
    plain: |
      For he sees that wise men die; the fool and the senseless perish as well, and leave their wealth to others. In their own minds their houses will last for ever and their dwellings through every generation; they give their own names to their lands. Yet man in his honour does not last. He is like the beasts that perish.
  - range: 13-15
    heading: Death their shepherd; God my redeemer
    plain: |
      This path of theirs is their folly, and still those who come after them approve what they said. Like sheep they are laid in the grave, and Death is their shepherd. The upright will rule over them in the morning, and their form will waste away in the grave, away from their dwelling. But God will redeem my soul from the hand of the grave, for He will take me.
  - range: 16-20
    heading: Be not afraid when one is made rich
    plain: |
      Do not be afraid when a man grows rich, when the glory of his house increases. When he dies he will carry nothing away, and his glory will not go down after him. Though he counted himself blessed while he lived, and though people praise you when you do well for yourself, he will go to the generation of his fathers, who will never see light. Man in his honour, who does not understand, is like the beasts that perish.

notes:
  - ref: 4
    phrase: I will open my dark saying upon the harp
    kind: words
    title: A riddle set to the harp
    body: |
      The singer calls his poem a proverb and a riddle: a hard question, set to music. “Parable” is *mashal*, the Hebrew word for a proverb, used also for a “poem, of various kinds,” this psalm among them. “Dark saying” is *hidah*, a “riddle, enigmatic, perplexing saying or question.” It is the word for Samson’s riddle in Judges 14 and for the “perplexing questions” the queen of Sheba brought to Solomon. Here it has been taken as a “perplexing moral problem.” The question of verse 5 follows at once: why should he fear, when those who wrong him surround him?

      “Open” can be heard two ways. One modern translation has “I will solve my riddle to the music of the harp.” The verb has also been taken as “open, propound”: to set the riddle out, not to answer it.
    sources: [bdb, nrsvue, oshb-wlc]

  - ref: 5
    phrase: the iniquity of my heels
    kind: words
    title: Heels, or those at his heels
    body: |
      The “heels” are most likely people: those who come up behind the singer to bring him down. The Hebrew word looks like the ordinary word for a heel, and the ancient Greek translators read it so: “the iniquity of my heel shall compass me.” It is taken here instead as a related word, an “overreacher,” so that the phrase speaks “of those who would take some insidious advantage of me.” A modern translation has “the iniquity of my persecutors surrounds me.” The heel is elsewhere a figure for the same kind of wrong, as when a trusted friend “hath lifted up his heel against me” ([[Ps. 41:9]]).

      On that reading the psalm’s rich men and the singer’s enemies are one group. Verse 6 has no verb of its own in Hebrew. It opens with a participle, “those who trust,” which describes the people just named: “my persecutors … those who trust in their wealth.”
    sources: [bdb, lxx-rahlfs, nrsvue, oshb-wlc]

  - ref: 7
    phrase: nor give to God a ransom for him
    kind: history
    title: The price of a life
    body: |
      A ransom was a payment the law of Moses knew: money given in place of a life that was forfeit. The Hebrew word, *kopher*, is “the price of a life, ransom.” The case in the law is the owner of an ox known to gore, whose negligence has cost a life. A sum could be laid on him instead: “then he shall give for the ransom of his life whatsoever is laid upon him” ([[Ex. 21:30]]). That verse has both of the terms this psalm uses, the “ransom” of verse 7 and the “redemption of their soul” of verse 8.

      So the psalm takes a payment the law allowed among men and sets it before God, where no one can make it. “Precious” in verse 8 means “costly.” “It ceaseth for ever” translates a verb for “cease, forbear,” and one modern translation has “and can never suffice.” What the payment would have to buy is named in verse 9: to live on and “not see corruption.” The Hebrew word there is “pit,” the “pit of Sheol,” as at [[Ps. 16:10]].

      “His brother” is how the Hebrew begins the sentence, and the Greek keeps it: “A brother does not redeem, shall a man redeem?” A modern translation makes the line general, “Truly, no ransom avails for one’s life,” and gives “no one can ransom a brother” as the alternative. On either reading the buyer is a man and the price is beyond him.
    sources: [bdb, lds-scriptures, nrsvue, lxx-rahlfs]

  - ref: 11
    phrase: Their inward thought is, that their houses shall continue for ever
    kind: words
    title: Houses for ever, or graves for houses
    body: |
      Two ancient readings of this line differ by the order of two letters, and each is ironic in its own way. The Hebrew text as it stands has *qirbam*, the inward part as the seat of thought, and the King James follows it: in their own minds their houses will stand for ever. The Greek translators read the letters in the other order, as “their grave”: “And their sepulchres are their houses for ever, even their tabernacles to all generations.” That reading has been preferred by a number of scholars, and one modern translation adopts it: “Their graves are their homes forever,” it begins, and the verse ends, “though they named lands their own.”

      In the Hebrew reading the rich are mistaken about how long their houses will last. In the Greek they do get a house for ever, and it is the tomb. Both readings keep the last clause. These are people who put their own names on their lands, and verse 10 has already said where the lands go: they “leave their wealth to others.”
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue]

  - ref: 12
    phrase: abideth not
    kind: structure
    title: A refrain with one word changed
    body: |
      The two halves of the psalm end on nearly the same line, and in the Hebrew text the two differ by a single letter. Verse 12 says that man in honour “abideth not,” a verb used here of man in the sense “continue, endure.” Verse 20 says that man in honour “understandeth not.” The two verbs are *yalin* and *yavin*.

      Not every ancient copy kept the difference. The Greek has “understands not” in both places, and one modern translation has “cannot abide in their pomp” in both. As the Hebrew stands, the first refrain says that man in honour does not last, and the second that man in honour who does not understand is like the beasts that perish.
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue]

  - ref: 14
    phrase: death shall feed on them
    kind: symbol
    title: Death as their shepherd
    body: |
      In Hebrew Death is the shepherd of this flock, not its devourer. The verb is the ordinary one for a herdsman’s work, “pasture, tend,” and its use here is a metaphor: “Death shall be their shepherd.” The verse has opened with the flock, “Like sheep they are laid in the grave,” and “the grave,” twice in this verse, is Sheol (see [[Ps. 6:5]]). One older reading sets the picture against another psalm: “Not the good Shepherd (Psalm 23:1), whose pasture is the land of the living, but Death, into whose power they have fallen irrecoverably, shall pasture them.”

      The rest of the verse is among the hardest lines in the psalm. One modern translation marks it “Meaning of Heb uncertain” and replaces the clause about the upright with a correction. The Hebrew text, which the King James follows, says that the upright will rule over them “in the morning.” Morning in Hebrew poetry is a figure “of bright joy after night of distress.” The same older reading takes it here as more than one man’s relief: “a morning which not merely for individuals, but for all the upright, will be the end of oppression and the dawn of dominion,” or, “expressed in New Testament language,” the morning of the resurrection. The psalm itself says only “the morning.”

      In the last clause “their beauty” is their outward form, and a modern translation has “their form shall waste away,” and then, “Sheol shall be their home.” The same older reading ties the clause to the houses of verse 11: of those nothing is left.
    sources: [bdb, nrsvue, delitzsch-psalms, oshb-wlc]

  - ref: 15
    phrase: for he shall receive me
    kind: words
    title: The verb used of Enoch
    body: |
      “Receive” is the Hebrew verb “take,” the verb used when God took Enoch. “And Enoch walked with God: and he was not; for God took him” ([[Gen. 5:24]]). Another psalm that wrestles with the prosperity of the wicked uses it the same way: “Thou shalt guide me with thy counsel, and afterward receive me to glory” ([[Ps. 73:24]]). These two verses have been called “the true parallels” to this one, and the line has been read as an allusion to Enoch. On that reading the singer hopes “that God will wrest him out of the power of” Sheol “and take him to Himself.”

      “Power” is literally “hand”: God will redeem his soul from the hand of Sheol. In verse 14 the dead are a flock in Death’s keeping. Here one of them is taken out of that hand by God.

      How much the singer understood of this is a fair question, and the psalm gives little to go on. He does not say when God will take him, or how, or whether he expects to die first. The reading that hears Enoch in the line also calls the hope “a ‘bold flight’ of faith,” one whose substance “is only a dim inkling of what may be.” That is one reading of what the psalmist knew. What the verse plainly says is that the grave has a grip, that money does not loosen it, and that God will. What the Restoration adds about the world of spirits is taken up at [[Ps. 6:5]].
    sources: [oshb-wlc, bdb, delitzsch-psalms, lds-scriptures]

  - ref: 15
    phrase: But God will redeem my soul from the power of the grave
    kind: christ
    title: Redemption not bought with silver
    body: |
      The verb of this verse is the verb of verse 7, and the redemption it speaks of has been taught in general conference as the Atonement of Jesus Christ. In verse 7 no man “can by any means redeem his brother.” Here God “will redeem my soul.” The psalm leaves the price unsaid. Hosea has the Lord make the same promise in His own voice and in the same terms, redemption from the hand of Sheol: “I will ransom them from the power of the grave; I will redeem them from death” ([[Hosea 13:14]]).

      Elder LeGrand R. Curtis Jr. quoted this verse in general conference beside one from Lehi and one from Isaiah and said, “The redemption referred to in these three scriptures, of course, is the Atonement of Jesus Christ.” Unlike the redemptions of the law of Moses, which were made “by the payment of money,” this one “does not come by” what Peter calls “corruptible things, as silver and gold” ([[1 Pet. 1:18]]). Peter’s sentence goes on to say what it does come by: “the precious blood of Christ” ([[1 Pet. 1:19]]). Among its effects, Elder Curtis taught, is that “temporal death is overcome, and all will be resurrected.”

      Nephi may have had the verse in mind. In the prayer that closes his own psalm he asks, “O Lord, wilt thou redeem my soul?” ([[2 Ne. 4:31]]), and the line has been listed among the potential allusions to the Psalms in that passage, with this verse as its source.
    sources: [oshb-wlc, bdb, curtis-redemption, lds-scriptures, hilton-psalms-bom]

christ: |
  Psalm 49 sets a need beside a promise. The need is a ransom for a life, which no man can give to God for his brother, however rich he is. The promise is that God will redeem the singer’s soul from the grave and take him. The psalm says nothing of what stands between the two.

  The redemption of verse 15 has been taught in general conference as the Atonement of Jesus Christ: a redemption that comes through His blood and not by silver and gold, and by which all will be resurrected (see the second note on verse 15).

explore: |
  - **The Lord’s own promise in the same words.** [[Hosea 13:14]], with the note there on whether the lines are a promise or a question.
  - **The other psalm on the prosperity of the wicked.** [[Ps. 73]], with its line “afterward receive me to glory” (verse 24).
  - **The rich man who blessed his soul.** [[Luke 12:16–21]], a parable that has been compared with verse 18.
  - **Nephi’s psalm.** [[2 Ne. 4:17–35]], where “wilt thou redeem my soul?” may echo verse 15.
  - **Sheol and the pit.** The notes at [[Ps. 6:5]] and [[Ps. 16:10]].
  - **Redemption in general conference.** Elder LeGrand R. Curtis Jr., “Redemption” (October 2011).

parallels:
  - ref: Hosea 13:14
    note: The Lord promises to ransom from “the power of the grave,” the phrase of verse 15.
  - ref: Gen. 5:24
    note: God “took” Enoch; the same Hebrew verb stands behind “receive” in verse 15.
  - ref: Ps. 73:24
    note: Another psalm on the prosperity of the wicked hopes that God will “receive me to glory.”
  - ref: 1 Pet. 1:18–19
    note: Redemption is not with silver and gold but with the precious blood of Christ.
  - ref: 2 Ne. 4:31
    note: Nephi asks, “O Lord, wilt thou redeem my soul?”, listed as a potential allusion to verse 15.

