chapter: 126
title: Sowing in Tears
tagline: A people who once laughed like dreamers when the LORD brought them home ask Him to do it again, and are told that the one who sows weeping will carry in the harvest.
when: 'Undated; the psalm looks back on a return to Zion, most naturally the return from Babylon'

setting: |
  This is the seventh of the fifteen songs of degrees (Psalms 120–134); the name is explained at [[Ps. 120:1]]. Its title names no author and no occasion.

  The psalm itself shows a people who have been brought back to Zion and remember the day. It names no king and no year. The return it remembers is most naturally the one that followed the decree of Cyrus of Persia, when “the LORD stirred up the spirit of Cyrus” to send the Jews home to build the temple ([[Ezra 1:1]]), and one older reading takes the singers to be “the exiles at home again upon the soil of their fatherland.” That is a reading; the psalm does not say so.

  It stands after a psalm that says those who trust in the LORD “shall be as mount Zion, which cannot be removed” ([[Ps. 125:1]]), and it shares its shape with [[Ps. 85:1–7]], which also thanks the LORD for bringing back the captivity of Jacob and then asks Him to turn His people again.

  Latter-day revelation takes up its last image, the sheaves, in promises to those sent to preach the gospel (see the note on [[Ps. 126:6]]).

thread: |
  Psalm 126 has two halves of three verses each, and **the second half asks for what the first half says has already been given**. “When the LORD turned again the captivity of Zion” (verse 1) becomes “Turn again our captivity, O LORD” (verse 4). The psalm turns there, from a memory to a prayer.

  The memory is told as joy that could hardly be believed: dreamers, laughter, singing. Even the nations said what had happened, and verse 3 takes their sentence and changes one word: “for them” becomes “for us.” Verses 1–3 are a look back, though some have read them as a hope still to come.

  The prayer of verse 4 shows that the joy did not last, or was not complete. The psalm does not explain the trouble. It asks for the first mercy to be repeated, and gives a picture of what it asks for: the streambeds of the south country, dry in summer, that run again with the winter rain.

  No report of an answer follows. What follows is a promise, said twice, first as a saying about anyone (“They that sow in tears shall reap in joy”) and then as a picture of one man walking out with his seed and coming back with his sheaves. The psalm that began with laughter ends with weeping still going on, and with “doubtless” set against it.

sections:
  - range: 1-3
    heading: When the LORD turned our captivity
    plain: |
      When the LORD brought Zion back from captivity, it was like a dream to us. Our mouths were full of laughter and our tongues of glad shouting. Even among the nations people said, “The LORD has done great things for them.” The LORD has done great things for us, and we are glad.
  - range: 4-6
    heading: Turn it again
    plain: |
      LORD, bring us back again, like the streambeds of the south country when the water returns. Those who sow with tears will reap with shouts of joy. The one who goes out weeping, carrying his seed to sow, will surely come home rejoicing, carrying his sheaves.

notes:
  - ref: 1
    phrase: turned again the captivity of Zion
    kind: words
    title: To turn a captivity is to restore what was lost
    body: |
      “Turned again the captivity” is a set phrase for the LORD restoring a people, and it is wider than letting prisoners go; the idiom is explained at [[Ps. 14:7]]. A modern translation renders this verse “When the LORD restored the fortunes of Zion,” and gives as another possible reading “brought back those who returned to Zion.” On either reading the verse remembers the LORD bringing Zion home, and verse 4 asks for the same thing in the same words.
    sources: [bdb, nrsvue]
  - ref: 2
    phrase: The LORD hath done great things for them
    kind: scripture
    title: The nations say it before Israel does
    body: |
      The first to say what the LORD has done are onlookers; in verse 3 Israel repeats their sentence with one word changed. Ezekiel had said that the restoration would have this audience: “Then the heathen that are left round about you shall know that I the LORD build the ruined places, and plant that that was desolate: I the LORD have spoken it, and I will do it” ([[Ezek. 36:36]]). In the psalm, too, the bringing home of Zion is seen from outside as the LORD’s own act.
    sources: [lds-scriptures]
  - ref: 4
    phrase: Turn again our captivity
    kind: history
    title: Why the people ask for what they have already received
    body: |
      The psalm gives no reason for asking again, but the return from Babylon, the one it most naturally remembers, was only partial. Cyrus permitted all who worshipped Jehovah to go back, and only part of the people went; the rest “remained behind and formed the dispersion.” Moses’s promise had been larger than one journey home: “the LORD thy God will turn thy captivity, and have compassion upon thee, and will return and gather thee from all the nations, whither the LORD thy God hath scattered thee” ([[Deut. 30:3]]).

      Psalm 85 prays in the same order. It begins, “thou hast brought back the captivity of Jacob” ([[Ps. 85:1]]), and three verses later asks, “Turn us, O God of our salvation” ([[Ps. 85:4]]). In both psalms the thanks for the earlier mercy come first and the plea after.

      The note on [[Jer. 30:3]] follows the promise beyond the return from Babylon to the gathering of the last days. See [Israel's Story in One Place](/old-testament/guides/israels-story/#return) for the sequence.
    sources: [bd-captivities, lds-scriptures]
  - ref: 4
    phrase: as the streams in the south
    kind: symbol
    title: Dry streambeds that run again
    body: |
      The “streams in the south” are the watercourses of the Negev, which dry up in summer and run again with the winter rain. The prayer asks that the people come back as the water does. “South” here is a place: the Negev, “dry or parched land, also called ‘south country,’” reaching from the hills of Judah toward the desert. A modern translation has “like the watercourses in the Negeb.”

      One older reading draws the comparison out. The land longs for “an abundant, reanimating influx of population” as the Negev “thirsts for the rain-water streams, which disappear in the summer season and regularly return in the winter season.”
    sources: [bd-negev, nrsvue, delitzsch-psalms]
  - ref: 5
    phrase: They that sow in tears
    kind: symbol
    title: Why the sower weeps
    body: |
      The psalm does not say why the sower weeps. One older reading is that those who had come home were sowing ground so dry that a crop could hardly be hoped for. It takes the sowers to be those working “the old soil of their native land,” weeping “because the ground is so parched that there is little hope of the seed springing up,” and it recalls the drought of Haggai’s day, when the LORD “called for a drought upon the land… and upon all the labour of the hands” ([[Hag. 1:11]]). This reading takes the sowing as an emblem of the work of rebuilding, which began with tears. When the foundation of the second temple was laid, many of the old men who had seen the first house “wept with a loud voice; and many shouted aloud for joy” ([[Ezra 3:12]]).

      The “precious seed” of verse 6 is the seed he carries out to scatter; a modern translation has “bearing the seed for sowing.”
    sources: [delitzsch-psalms, lds-scriptures, nrsvue]
  - ref: 6
    phrase: bringing his sheaves with him
    kind: scripture
    title: The Lord promises sheaves to those who preach His gospel
    body: |
      Latter-day revelation takes up the sheaves of verse 6 in promises to those sent to preach the gospel. To Thomas B. Marsh, called to preach: “thrust in your sickle with all your soul, and your sins are forgiven you, and you shall be laden with sheaves upon your back” ([[D&C 31:5]]). To laborers called in the eleventh hour: “open your mouths and spare not, and you shall be laden with sheaves upon your backs, for lo, I am with you” ([[D&C 33:9]]). To elders sent to preach: “if ye are faithful ye shall be laden with many sheaves, and crowned with honor, and glory, and immortality, and eternal life” ([[D&C 75:5]]).

      Ammon had used the picture long before: “behold the number of your sheaves! And they shall be gathered into the garners, that they are not wasted” ([[Alma 26:5]]).
    sources: [lds-scriptures]

christ: |
  The psalm’s one actor is the LORD. He turns the captivity, He does the great things, and He is asked to do them again; the people only laugh, pray, sow and weep. He is Jehovah, who came into the world as Jesus Christ ([[Ps. 110:1]]).

  Mary, who was to bear the Savior, says the “great things” of verse 2 of herself: “For he that is mighty hath done to me great things; and holy is his name” ([[Luke 1:49]]).

  The promise to those who weep is one the Savior made in His own voice. On one older reading, “in its general sense the language of the Psalm coincides with the language of the Preacher on the Mount”: “Blessed are they that mourn: for they shall be comforted” ([[Matt. 5:4]]). And the one who promises sheaves to His servants in this dispensation signs the promise: “These words are not of man nor of men, but of me, even Jesus Christ, your Redeemer” ([[D&C 31:13]]).

explore: |
  - **A turned captivity and a harvest together.** [[Amos 9:13–15]], where “the plowman shall overtake the reaper” and the LORD says, “I will bring again the captivity of my people of Israel.”
  - **Coming to Zion with songs.** [[Isa. 35:10]], where “sorrow and sighing shall flee away.”
  - **Sower and reaper.** [[John 4:36–37]], where the Savior says that “he that soweth and he that reapeth may rejoice together.”

parallels:
  - ref: Deut. 30:3
    note: Moses promises that the LORD will turn Israel’s captivity and gather them from all nations.
  - ref: Job 42:10
    note: The LORD turns the captivity of Job and gives him twice what he had before.
  - ref: Ps. 85:1–4
    note: Thanks for the captivity of Jacob brought back, then a prayer to be turned again.
  - ref: Ezek. 36:36
    note: The nations round about will know that the LORD rebuilt and replanted, as verse 2 has them say.
  - ref: Luke 1:49
    note: Mary says that He who is mighty has done great things for her, as verses 2–3 say of Zion.
  - ref: D&C 31:5
    note: The Lord promises those who preach that they will be laden with sheaves (also D&C 33:9; 75:5; Alma 26:5).

sources: [lds-scriptures, bd-degrees-songs-of, bd-captivities, bd-negev, bdb, nrsvue, delitzsch-psalms]
