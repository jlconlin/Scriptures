chapter: 20
title: The Name Against the Chariots
tagline: A people pray for their king before a battle, one voice announces that the LORD saves His anointed, and the people answer that others trust in chariots and horses but they call on the name of the LORD.
when: 'Undated; a psalm of David by its title'

setting: |
  The title ascribes the psalm to David and addresses it to the chief Musician (see [[Ps. 8:1]]).

  The psalm itself shows a king, his people, and a day of trouble. Its words “give the sense that the king is preparing for a battle and his people are praying for God to strengthen and protect him.” It is a hymn made for use in a ceremony, and the setting “seems to be a ceremony for the king’s departure for battle.” For that reason “it is often categorized as one of the royal psalms,” the songs about Israel’s king (see [[Ps. 2:2]]). No enemy and no war is named.

  Verse 3 speaks of the king’s offerings, and verse 2 looks for help from the sanctuary in Zion. On one older reading the prayer “is made in the sanctuary on the heights of Zion,” while the king “offers sacrifice according to custom before the commencement of the battle” (compare [[1 Sam. 13:9]]).

  The next psalm gives thanks for a king whose request has been granted, and the two have been read as a pair (see the note on verse 4). The Church’s edition heads this one with what verse 6 announces: “The Lord saves His anointed.”

thread: |
  Psalm 20 is a prayer that hears its own answer. **It begins with a people wishing their king well before a battle, and before it ends the same people are sure of the outcome; the hinge is one voice in verse 6 saying, “Now know I.”**

  Verses 1–5 are a chain of wishes spoken to the king: may the LORD hear, defend, send help, strengthen, remember, accept, grant, fulfil. The people ask nothing for themselves. Even the joy they promise is joy “in thy salvation,” the king’s victory. Every wish depends on the LORD, who is named in the first line of the section and again in its last.

  Then the speaker changes from “we” to “I,” and the wish becomes knowledge (verse 6). The psalm does not say what has happened between verses 5 and 6 (see the note on verse 6). What the voice knows is that “the LORD saveth his anointed,” and that the answer asked for in verse 1 will come: “hear” in verses 1, 6 and 9 is one Hebrew verb, to answer.

  Verses 7–9 return to “we.” In verse 8 the people speak of the outcome in the past tense: “They are brought down and fallen: but we are risen.” The two sides are told apart by what each relies on, chariots and horses or “the name of the LORD our God.” That name runs through the psalm. It defends the king (verse 1), the banners are raised in it (verse 5), and the people set it against chariots and horses (verse 7).

  The last verse prays again in the words of the first: hear, in the day. The psalm that has announced its answer still closes by asking.

sections:
  - range: 1-5
    heading: The people’s wishes for the king
    plain: |
      May the LORD answer you in the day of trouble. May the name of the God of Jacob set you on high, out of reach. May He send you help from the sanctuary and hold you up from Zion. May He remember all your offerings and accept your burnt sacrifice. May He give you what your heart desires and bring all your plans to pass. We will shout for joy at your victory, and in the name of our God we will raise our banners. May the LORD grant everything you ask.
  - range: 6
    heading: One voice announces the answer
    plain: |
      Now I know that the LORD saves His anointed. He will answer him from His holy heaven with the saving strength of His right hand.
  - range: 7-9
    heading: The people’s confidence
    plain: |
      Some trust in chariots and some in horses, but we call on the name of the LORD our God. They have been brought down and have fallen, but we have risen and stand upright. Save, LORD! May the king answer us in the day we call.

notes:
  - ref: 1
    phrase: The LORD hear thee
    kind: history
    title: A people’s prayer for their king
    body: |
      The first five verses are spoken to the king, and the speakers are his people. The “thee” is one man, whom verse 6 calls the LORD’s anointed. These verses are “a prayer given by the congregation (or a priest/prophet representing the congregation) on behalf of the king.”

      “Hear” is closer to “answer.” The Hebrew verb is the one used of God “answering (graciously),” and a modern translation begins, “The Lord answer you in the day of trouble!” The same verb returns twice: “he will hear him” (verse 6) and “hear us when we call” (verse 9).
    sources: [ot-minute-psalms-1-20, oshb-wlc, bdb, nrsvue]
  - ref: 1
    phrase: the name of the God of Jacob defend thee
    kind: words
    title: Set on high by the name of Jacob’s God
    body: |
      “Defend” translates a verb that means to “set (securely) on high,” so the wish is that the king be lifted where his enemies cannot reach him.

      Jacob’s own words may explain why God is called “the God of Jacob” here. Returning to Beth-el, Jacob said he would build an altar “unto God, who answered me in the day of my distress” ([[Gen. 35:3]]). The Hebrew words there for “answered,” “in the day” and “distress” are the words of this line for “hear,” “in the day” and “trouble.” One older reading finds it “not improbable” that the wish was shaped on that verse: may the God who answered Jacob answer the king.
    sources: [bdb, oshb-wlc, delitzsch-psalms]
  - ref: 3
    phrase: accept thy burnt sacrifice
    kind: words
    title: Remembering and accepting the king’s offerings
    body: |
      Both verbs of the verse ask for the LORD’s favor on what the king has brought. “Remember” is used here of God remembering a worshipper’s “devotion.” “Accept” is literally to find the burnt offering fat, that is, acceptable, and the ancient Greek translation has “enrich thy whole-burnt-offering.”
    sources: [bdb, lxx-rahlfs]
  - ref: 4
    phrase: Grant thee according to thine own heart
    kind: scripture
    title: The next psalm gives thanks for this request
    body: |
      Psalm 21 speaks of this wish as granted: “Thou hast given him his heart’s desire, and hast not withholden the request of his lips” ([[Ps. 21:2]]). On one older reading the two psalms form a pair that “refer to the same event relatively, as prayer and thanksgiving.” For the other words the two psalms share, see the note on [[Ps. 21:1]].
    sources: [delitzsch-psalms, lds-scriptures]
  - ref: 5
    phrase: we will set up our banners
    kind: words
    title: Raising the standard in God’s name
    body: |
      The verb, as the Hebrew text stands, means to “set up standard in battle,” and this is the only place the Psalms use it. The people picture standards raised in the name of their God. A modern translation renders “thy salvation,” in the first half of the verse, as “your victory.”

      The ancient Greek translation reads the line differently, “in the name of our God shall we be magnified,” and other Hebrew verbs have been proposed in place of the one behind “set up our banners,” one of them following the Greek. So the banners are the reading of the Hebrew as it has come down, and not a certain one.
    sources: [bdb, oshb-wlc, nrsvue, lxx-rahlfs]
  - ref: 6
    phrase: Now know I
    kind: structure
    title: One voice announces the answer
    body: |
      The psalm turns here, from “we” to “I” and from wishing to knowing. The verse “appears to be a declaration perhaps by the high priest or prophet,” and it is “a turning point in the psalm, in which something (perhaps a ritual or a divine sign) has given the priest/prophet the assurance” that the prayer has been heard. The psalm does not say what that something was.

      “His anointed” is the king. For the word, see [[Ps. 2:2]].
    sources: [ot-minute-psalms-1-20]
  - ref: 6
    phrase: from his holy heaven
    kind: words
    title: The sanctuary and heaven share a word
    body: |
      The help asked “from the sanctuary” in verse 2 is now expected “from his holy heaven,” and one Hebrew noun stands behind “sanctuary” there and “holy” here.

      Solomon’s prayer at the dedication of the temple, which has been set beside this psalm, has both places together. When the people go out to battle and pray toward the house built for the LORD’s name, he asks, “Then hear thou in heaven their prayer and their supplication, and maintain their cause” ([[1 Kgs. 8:45]]).

      For Zion and the temple hill in the Psalms, see [[Ps. 24:3]].
    sources: [oshb-wlc, ot-minute-psalms-1-20, lds-scriptures]
  - ref: 7
    phrase: 'Some trust in chariots, and some in horses'
    kind: scripture
    title: Chariots and horses against a name
    body: |
      The law speaks of horses and chariots in two places, once to Israel’s king and once to its army. The law of the king says, “he shall not multiply horses to himself” ([[Deut. 17:16]]), and the law of war, “When thou goest out to battle against thine enemies, and seest horses, and chariots, and a people more than thou, be not afraid of them” ([[Deut. 20:1]]). The verse has been set beside both, and beside what David said to Goliath: “Thou comest to me with a sword, and with a spear, and with a shield: but I come to thee in the name of the LORD of hosts” ([[1 Sam. 17:45]]).

      The Hebrew line has one verb, at its end, and “trust” is supplied for the first half from it. That verb is “remember” in the King James. With “in the name” it means to mention or call on, and some take it here as “boast of, praise.” A modern translation has, “Some take pride in chariots and some in horses, but our pride is in the name of the Lord our God.”

      For Isaiah on horses and chariots, see the note on [[Isa. 2:7]].
    sources: [lds-scriptures, delitzsch-psalms, ot-minute-psalms-1-20, oshb-wlc, bdb, nrsvue]
  - ref: 9
    phrase: let the king hear us when we call
    kind: words
    title: Who the king is in the last line
    body: |
      The last line can be divided two ways, and they differ on who “the king” is. The King James follows the Hebrew text as it stands. A modern translation’s footnote gives the Hebrew as “give victory, O Lord; let the King answer us when we call.” There the king is the one who answers the people’s call.

      The ancient Greek translation divides the words otherwise: “O Lord, save the king: and hear us in whatever day we call upon thee.” A modern translation follows it: “Give victory to the king, O Lord; answer us when we call.” Read so, the people end as they began, praying for their king.

      On either reading the line returns to verse 1. “Hear” is the same verb, and where the King James has “when we call” the Hebrew has the word “day” again, as the Greek shows (“in whatever day we call upon thee”), which answers “the day of trouble.”
    sources: [nrsvue, lxx-rahlfs, oshb-wlc]

christ: |
  Psalm 20 is a prayer for Israel’s king, and it calls him “his anointed,” the word that became Messiah (see [[Ps. 2:2]]). The Greek translators wrote “his Christ” in verse 6: “the Lord has saved his Christ.”

  The psalm’s last cry, “Save, LORD,” has the Hebrew verb of another psalm’s cry, “Save now, I beseech thee, O LORD” ([[Ps. 118:25]]). Hosanna is taken from that verse, and the multitudes used it at the Savior’s entry into Jerusalem: “Hosanna to the Son of David” ([[Matt. 21:9]]). One older reading calls that shout “a peculiar application” of this psalm’s prayer for the king, made by way of Psalm 118.

explore: |
  - **The thanksgiving that follows.** Read [[Ps. 21:1–7]] straight after this psalm and mark what is said to have been given.
  - **The law behind verse 7.** [[Deut. 17:14–20]] on the king and [[Deut. 20:1–4]] on going to war.
  - **Other songs about the king.** [[Ps. 2:1–12]] and [[Ps. 110:1–7]].

parallels:
  - ref: Ps. 21:1–2
    note: The king has been given his heart’s desire and rejoices in the LORD’s salvation.
  - ref: Deut. 20:1–4
    note: Israel is not to fear horses and chariots, for the LORD goes with them to save them.
  - ref: 1 Sam. 17:45
    note: David meets Goliath’s weapons with the name of the LORD of hosts.
  - ref: Gen. 35:3
    note: Jacob speaks of God who answered him in the day of his distress.
  - ref: 1 Kgs. 8:44–45
    note: Solomon asks that prayer made toward the temple before battle be heard in heaven.
  - ref: Isa. 31:1
    note: Woe to those who trust in chariots and horses and do not look to the Holy One of Israel.

sources: [lds-scriptures, oshb-wlc, bdb, lxx-rahlfs, nrsvue, ot-minute-psalms-1-20, delitzsch-psalms, bd-hosanna]
