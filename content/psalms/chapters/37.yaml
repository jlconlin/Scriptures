chapter: 37
title: Fret Not Thyself
tagline: An old teacher tells a learner not to burn at the success of the wicked, because it will not last, and promises the land to those who wait, among them the meek.
when: 'Undated; a psalm of David by its title, in the voice of a man now old (verse 25)'

setting: |
  The title ascribes the psalm to David. Its speaker presents himself as an old man: “I have been young, and now am old” (verse 25). He is teaching. Every line is spoken to a learner or about the righteous and the wicked, and none is spoken to God. The psalm has no prayer in it and no praise.

  In Hebrew it is an acrostic, the device explained at [[Ps. 9:1]]. It is made of “shorter utterances of the proverbial form following the order of the letters of the alphabet,” most of them four lines long. So it moves saying by saying, with “recurrences to a previous thought.” Its opening words are in Proverbs too, in the same Hebrew form: “Fret not thyself because of evil men” ([[Prov. 24:19]]).

  The trouble behind the psalm is that people who do wrong are doing well. Psalms 49 and 73 and the book of Job take up the same trouble. Here the answer comes from a teacher who has watched for a long time.

  The Savior made verse 11 a beatitude ([[Matt. 5:5]]), and latter-day revelation repeats its promise ([[D&C 88:17]]).

thread: |
  Psalm 37 answers one temptation, and its answer is **time**. The temptation is named three times in the same words, “Fret not thyself” (verses 1, 7, 8): do not burn at the sight of evildoers who prosper. The reasons the teacher gives have to do with time. They shall “soon” be cut down like the grass (verse 2). “For yet a little while, and the wicked shall not be” (verse 10). The Lord laughs at the plotter, “for he seeth that his day is coming” (verse 13).

  As an acrostic, the psalm does not turn at one point as a lament does. It circles. What holds the circles together is two verbs, each used five times. The wicked are “cut off” (verses 9, 22, 28, 34, 38), and the others “inherit” the land (verses 9, 11, 22, 29, 34). Three times the two verbs stand in one verse. The heirs go by several names: those who wait on the LORD, the meek, those He blesses, the righteous.

  Between the commands the teacher sets the two kinds of people side by side: the plotter and the just man, the borrower who does not repay and the giver, the man whose arms are broken and the man the LORD holds up.

  Twice he steps forward as a witness: “I have been young, and now am old” (verse 25), and “I have seen the wicked in great power” (verse 35). What he reports took a lifetime to see, and he tells the learner, “thou shalt see it” (verse 34). Until then the instruction is to trust, to do good, to be still and to wait. The last lines say where the outcome comes from: “the salvation of the righteous is of the LORD” (verse 39).

sections:
  - range: 1-6
    heading: Fret not; trust, delight, commit
    plain: |
      Do not burn with vexation over evildoers, and do not envy those who do wrong. They will soon be cut down like grass and wither like green plants. Trust in the LORD and do good; live in the land and be fed. Take your delight in the LORD, and He will give you what your heart asks. Commit your way to the LORD and trust Him, and He will act. He will bring out your righteousness like the light, and the justice of your cause like noon.
  - range: 7-11
    heading: Be still, for yet a little while
    plain: |
      Be still before the LORD and wait patiently for Him. Do not burn over the one whose way prospers, the man who carries out wicked schemes. Let go of anger and leave wrath behind. Do not fret; it leads only to doing evil. Evildoers will be cut off, but those who wait for the LORD will inherit the land. A little while yet and the wicked will be gone; you will look carefully at his place and he will not be there. But the meek will inherit the land and delight in abundant peace.
  - range: 12-15
    heading: The plotter, and the Lord who laughs
    plain: |
      The wicked man plots against the just and grinds his teeth at him. The Lord laughs at him, because He sees that his day is coming. The wicked have drawn the sword and bent the bow to bring down the poor and needy and to kill those who walk uprightly. Their sword will enter their own heart, and their bows will be broken.
  - range: 16-22
    heading: A little, and an inheritance for ever
    plain: |
      The little that one righteous man has is better than the wealth of many wicked. The arms of the wicked will be broken, but the LORD holds up the righteous. The LORD knows the days of the upright, and their inheritance will last for ever. They will not be put to shame in an evil time, and in days of famine they will have enough. But the wicked will perish. The enemies of the LORD are like the glory of the pastures (the King James has “the fat of lambs”): they vanish, like smoke they vanish. The wicked man borrows and does not repay, but the righteous man is generous and gives. Those the LORD blesses will inherit the land, and those He curses will be cut off.
  - range: 23-26
    heading: Though he fall
    plain: |
      A man’s steps are made firm by the LORD, who delights in his way. When he falls he will not be thrown down headlong, because the LORD holds his hand. I was young and now I am old, and I have not seen the righteous forsaken or his children seeking bread. He is always generous and lends, and his children are blessed.
  - range: 27-33
    heading: The LORD forsaketh not his saints
    plain: |
      Turn from evil and do good, and live for ever. For the LORD loves justice and does not forsake His saints. They are kept for ever, but the children of the wicked will be cut off. The righteous will inherit the land and live in it for ever. The mouth of the righteous speaks wisdom, and his tongue speaks of justice. The law of his God is in his heart, and his steps do not slip. The wicked man watches the righteous and looks for a way to kill him. The LORD will not leave him in that man’s hand or condemn him when he is judged.
  - range: 34-40
    heading: Wait, and thou shalt see it
    plain: |
      Wait for the LORD and keep His way, and He will raise you up to inherit the land; when the wicked are cut off, you will see it. I have seen a wicked man in great power, spreading himself like a green tree in its native soil. Then he passed away and was gone; I looked for him and he could not be found. Watch the blameless man and look at the upright, for there is a future for the man of peace. But transgressors will be destroyed together; the future of the wicked will be cut off. The salvation of the righteous is from the LORD, their strength in the time of trouble. The LORD helps them and delivers them. He delivers them from the wicked and saves them, because they trust in Him.

notes:
  - ref: 1
    phrase: Fret not thyself
    kind: words
    title: Do not heat yourself
    body: |
      The Hebrew behind “fret” is a verb of heat, so the command is against burning with resentment more than against worrying. In this form the verb means to “heat oneself in vexation,” and the psalm has it three times (verses 1, 7 and 8). The same form opens the saying in [[Prov. 24:19]].

      Verse 8 shows what the teacher fears from that heat. It sets the word beside “anger” and “wrath,” and its last clause, which the King James renders “fret not thyself in any wise to do evil,” is in a modern translation “Do not fret—it leads only to evil.”
    sources: [bdb, oshb-wlc, nrsvue]

  - ref: 4
    phrase: he shall give thee the desires of thine heart
    kind: words
    title: Delight first, then the desires
    body: |
      The promise of the heart’s desires depends on the command in front of it, to delight in the LORD. “Delight thyself” is a strong verb, to “take exquisite delight.” The psalm uses it once more, of the meek, who “shall delight themselves in the abundance of peace” (verse 11).

      Is the verse a promise of whatever one wants? One older reading answers from the first half of the line: the person who “finds his highest delight in God, cannot desire anything that is at enmity with God,” and also “can desire nothing that God, with whose will his own is thoroughly blended in love, would refuse him.” On that reading the delight changes the desires before they are granted. The psalm itself does not explain the promise; it sets it among commands to trust, to commit and to wait.
    sources: [bdb, oshb-wlc, delitzsch-psalms]

  - ref: 5
    phrase: Commit thy way unto the LORD
    kind: words
    title: Roll your way onto the LORD, and be still
    body: |
      “Commit” is the Hebrew verb for rolling, and “Rest” two verses later is a verb for silence. The first is the word used when someone would “roll a stone,” as from the mouth of a well. Here what is rolled is “thy way,” and it is rolled onto the LORD. Proverbs gives the same counsel with the same verb: “Commit thy works unto the LORD” ([[Prov. 16:3]]).

      “Rest in the LORD” (verse 7) is to “be silent to” Him, and a modern translation has “Be still.” The teacher’s next words are “wait patiently for him.”
    sources: [bdb, oshb-wlc, nrsvue]

  - ref: 11
    phrase: the meek
    kind: scripture
    title: The line the Savior made a beatitude
    body: |
      The third Beatitude rests on this half verse: “Blessed are the meek: for they shall inherit the earth” ([[Matt. 5:5]]). The risen Lord said it again to the Nephites ([[3 Ne. 12:5]]). The Hebrew word for “the meek,” and the way the Psalms use it of Israel’s poor and afflicted, is discussed in the note on [[Ps. 25:13]].

      The psalm promises the inheritance five times, each time to people named differently: “those that wait upon the LORD” (verse 9), “the meek” (verse 11), “such as be blessed of him” (verse 22), “the righteous” (verse 29), and the one who will “wait on the LORD, and keep his way” (verse 34). Verses 21–22 put the merciful beside the meek: “according to Psalm 37, both the meek (Psalm 37:11) and the merciful inherit the earth.”

      Of meekness itself Elder David A. Bednar taught: “Meekness is strong, not weak; active, not passive; courageous, not timid; restrained, not excessive; modest, not self-aggrandizing; and gracious, not brash.”

      [My Portion for Ever](/psalms/themes/my-portion-for-ever/) follows the promise from Psalm 1 to Psalm 73 and to the Doctrine and Covenants.
    sources: [lds-scriptures, oshb-wlc, skinner-beatitudes, bednar-meek]

  - ref: 11
    phrase: shall inherit the earth
    kind: words
    title: The land, and the earth
    body: |
      “Earth” and “land” in this psalm are one Hebrew word, so the promise can be read of the land of promise or of the whole earth. The word is *erets*. It comes six times (verses 3, 9, 11, 22, 29, 34), and the King James has “land” for three of them and “earth” for the other three. A modern translation keeps “land” throughout: “But the meek shall inherit the land.”

      For the first hearers the land was the land of promise. On one older reading it “is throughout this Psalm the promised possession,” and what verse 22 holds out to the blessed is “the promise given to the patriarchs.” The same reading sees the horizon widening, since meekness “will at length become the inheritor of the land, yea of the earth,” while judging that the psalm’s “for ever” (verse 18) “is not as yet thought of as extending into the future world, as in the New Testament.”

      Latter-day revelation carries the promise to the earth itself. The passage that gives the earth to the poor and the meek ([[D&C 88:17]]; see the note on [[Ps. 25:13]]) has been called “invaluable commentary on the beatitude.” It goes on to say that the earth “must needs be sanctified from all unrighteousness, that it may be prepared for the celestial glory” ([[D&C 88:18]]), and that after it dies and is quickened again “the righteous shall inherit it” ([[D&C 88:26]]).
    sources: [oshb-wlc, nrsvue, delitzsch-psalms, lds-scriptures, skinner-beatitudes]

  - ref: 13
    phrase: for he seeth that his day is coming
    kind: symbol
    title: What the Lord sees
    body: |
      The Lord laughs because He sees, and the verb “see” returns through the rest of the psalm. The Lord sees now (verse 13). The old teacher says twice what he has seen in a long life (verses 25 and 35). The learner is promised, “thou shalt see it” (verse 34), and is told to “behold the upright” (verse 37). It is one Hebrew verb in all five places.

      The image of God laughing at those who set themselves against Him is taken up in the note on [[Ps. 2:4]]. Here it answers verse 12, where the wicked man plots and grinds his teeth.
    sources: [oshb-wlc]

  - ref: 20
    phrase: as the fat of lambs
    kind: words
    title: Fat of lambs, or the glory of the pastures
    body: |
      The Hebrew phrase may be about meadows rather than lambs. Its first word means precious or splendid, here used as a noun, “glory.” Its second is a word for pasture, which has also been translated “lambs” after ancient versions; the King James has lambs too. Read as pasture, the phrase is “like the glory of the pastures (i.e. like gay, but short-lived, flowers),” and a modern translation agrees: “the enemies of the LORD are like the glory of the pastures.” The Greek translation has something else again, that the Lord’s enemies vanish “at the moment of their being honoured and exalted.”
    sources: [bdb, oshb-wlc, nrsvue, lxx-rahlfs]

  - ref: 24
    phrase: Though he fall, he shall not be utterly cast down
    kind: words
    title: Falling, but held by the hand
    body: |
      The verse allows that the good man falls and promises that the LORD keeps hold of him. “Utterly cast down” is a verb for being thrown: “when he falls he shall not be hurled headlong.” The reason is in the last clause, which in Hebrew says that the LORD upholds “his hand.” The Greek has “the Lord supports his hand,” and a modern translation, “holds us by the hand.”

      “A good man” in verse 23 is in Hebrew simply “a man,” and where the King James has “ordered,” a modern translation has his steps “made firm.” “Upholdeth” is the verb of verse 17, where “the LORD upholdeth the righteous” stands against “the arms of the wicked shall be broken.”
    sources: [bdb, oshb-wlc, lxx-rahlfs, nrsvue]

  - ref: 25
    phrase: yet have I not seen the righteous forsaken
    kind: words
    title: What the old man says he has not seen
    body: |
      The old man’s testimony is about being abandoned, and the psalm around it does not say that the righteous never go without. In this same psalm the righteous man has only “a little” (verse 16). He lives through “the evil time” and “the days of famine” (verse 19). He falls (verse 24). He is plotted against, hunted and brought to judgment (verses 12, 14, 32–33).

      “Forsaken” is the word to watch. The Hebrew verb returns twice in the next verses with the LORD as its subject: He “forsaketh not his saints” (verse 28) and “will not leave him” in the hand of the wicked (verse 33). “Begging bread” is in Hebrew “seeking bread,” as the Greek also has it.

      One older reading draws the conclusion: “Temporary forsakenness and destitution the Psalm does not deny.” It meets the doubt “by contrasting that which in the end abides with that which is transitory,” and, the same reading adds, the psalm “only solves its problem, in so far as it is placed in the light of the New Testament.”
    sources: [oshb-wlc, lxx-rahlfs, delitzsch-psalms]

  - ref: 35
    phrase: spreading himself like a green bay tree
    kind: symbol
    title: A tree in its native soil
    body: |
      The Hebrew names no kind of tree; it says the wicked man spread like a green tree in its own soil. The word the King James turns into “bay tree” means a native, and here “a native tree, growing in its natural soil,” a figure “of prosperous wicked.” The Greek translation has “like the cedars of Libanus,” and a modern translation has nearly the same: “towering like a cedar of Lebanon.”

      Verse 36 follows: “Yet he passed away, and, lo, he was not.” The Greek and the modern translation make the witness the one who moves, “Again I passed by, and they were no more.” When he looked for the tree, it could not be found.
    sources: [bdb, oshb-wlc, lxx-rahlfs, nrsvue]

  - ref: 37
    phrase: the end of that man is peace
    kind: words
    title: An end, a future, a posterity
    body: |
      The Hebrew word for “end” here means what comes after, and it can mean a person’s descendants. Both verses have been placed under the sense “posterity,” with the allowance that it is “possibly not more than” a future. A modern translation has “for there is posterity for the peaceable,” and the Greek, “there is a remnant to the peaceable man.” On any of these readings the man of peace has a future, and verse 38 says that the future of the wicked is cut off.

      “The perfect man” is the Hebrew *tam*, “complete, morally innocent, having integrity”; the modern translation has “the blameless.” The Sermon on the Mount’s command to be perfect ([[Matt. 5:48]]) has been said to be “reflected in” this verse.
    sources: [bdb, oshb-wlc, nrsvue, lxx-rahlfs, skinner-beatitudes]

christ: |
  The promise at the center of this psalm is one the Savior spoke in His own voice when He made verse 11 a beatitude ([[Matt. 5:5]]). He also took the word for Himself: “I am meek and lowly in heart” ([[Matt. 11:29]]). Meekness has been called “a defining attribute of the Redeemer.”

  The psalm ends by saying whose work the outcome is: “the salvation of the righteous is of the LORD” (verse 39). Latter-day revelation speaks of the inheritance and of redemption in one sentence: “the redemption of the soul is through him that quickeneth all things, in whose bosom it is decreed that the poor and the meek of the earth shall inherit it” ([[D&C 88:17]]).

explore: |
  - **The Sermon on the Mount beside the psalm.** [[Matt. 5:5]] with verse 11, [[Matt. 5:7]] with verses 21–22, and [[Matt. 5:48]] with verse 37.
  - **The same trouble, asked as a question.** [[Ps. 73]], [[Ps. 49]] and the book of Job, where the doubts have been said to be “set at rest in exactly the same way.”
  - **The sayings in Proverbs.** [[Prov. 24:19–20]] and [[Prov. 16:3]].
  - **The other promise to the meek in the Psalms.** [[Ps. 25:9–13]].

parallels:
  - ref: Matt. 5:5
    note: The Savior makes verse 11 the third Beatitude; 3 Nephi 12:5 has the same.
  - ref: D&C 88:17
    note: The poor and the meek of the earth shall inherit it, said of the earth made celestial.
  - ref: Prov. 24:19
    note: The psalm’s opening command, in the same Hebrew form.
  - ref: Ps. 25:13
    note: The seed of the man who fears the LORD shall inherit the earth.

