chapter: 52
title: The Razor and the Olive Tree
tagline: An informer who boasts of the ruin his tongue has worked is told what God will do to him, and the man he informed on answers that he is a green olive tree in the house of God.
when: 'By its title, David’s, when Doeg the Edomite informed on him to Saul'

setting: |
  The title sets the psalm in the years when Saul hunted David, at the moment an informer’s report reached the king. The note on the title tells the story from 1 Samuel 21–22. It is one of eight psalms whose titles assign them to that time, and the first of four in a row, Psalms 52–55, that are each headed a Maschil of David.

  For most of its length the psalm is not a prayer. Verses 1–7 are spoken to a man and then about him, and God is “he” until the last verse, where the speaker turns and says “thee.” God is named “God” throughout and never “the LORD.” The speaker does not name himself or his enemy, and he says nothing of any wrong done to himself.

thread: |
  **The psalm sets two trusts side by side, and it names the *hesed* of God at its opening and again at its turn**: “goodness” in verse 1 and “mercy” in verse 8 translate the same Hebrew noun.

  It begins with a question, “Why boastest thou thyself in mischief, O mighty man?”, and sets beside it, in the same verse, the kindness of God that lasts all day. Then comes the charge (verses 2–4), and nearly all of it is about speech. The tongue plans ruin, cuts like a razor, loves a lie, loves words that devour.

  Verse 5 turns on one word, “likewise.” The man’s tongue has devoured, and God will likewise pull him down, out of his tent and out of the land of the living. Verses 6–7 bring in witnesses. The righteous see it, fear, and laugh, and what they say of him is about where he put his trust: “this is the man that made not God his strength; but trusted in the abundance of his riches.”

  Verse 8 turns again, on “But I.” The speaker uses the verb the righteous have just used: the man “trusted” in his riches, and “I trust in the mercy of God.” The man is uprooted, and the speaker is a tree. The last verse turns to God Himself and promises thanks “for ever, because thou hast done it,” though the psalm has described no rescue. The note on verse 9 takes that up.

sections:
  - range: 1-4
    heading: The charge against the tongue
    plain: |
      Why do you boast of evil, you mighty man? The kindness of God lasts all day long. Your tongue plans ruin. It is like a sharpened razor, you worker of deceit. You love evil more than good, and a lie more than saying what is right. You love every word that devours, you deceitful tongue.
  - range: 5-7
    heading: What God will do, and what the righteous will say
    plain: |
      So God will pull you down for ever. He will snatch you up and tear you out of your tent, and root you out of the land of the living. The righteous will see it and be afraid, and they will laugh at him: “Look, this is the man who would not make God his refuge. He trusted in his great riches and grew strong in his evil desire.”
  - range: 8-9
    heading: The olive tree in the house of God
    plain: |
      But I am like a luxuriant olive tree in the house of God. I trust in the kindness of God for ever and ever. I will thank You for ever, because You have done it. And I will wait for Your name, for it is good, in the presence of Your faithful ones.

notes:
  - ref: 0
    phrase: when Doeg the Edomite came and told Saul
    kind: history
    title: What Doeg told, and what it cost
    body: |
      Doeg was Saul’s chief herdsman, and what he told the king cost the lives of eighty-five priests and their city. David, in flight from Saul, came alone to the priest Ahimelech at Nob, a priestly city and “one of the places where the tabernacle stood before the building of the temple,” and was given the hallowed bread. One of Saul’s men saw it: “his name was Doeg, an Edomite, the chiefest of the herdmen that belonged to Saul” ([[1 Sam. 21:7]]).

      Doeg then made his report to Saul: “I saw the son of Jesse coming to Nob, to Ahimelech the son of Ahitub” ([[1 Sam. 22:9]]). Saul sent for Ahimelech and all his father’s house, accused them of conspiracy and sentenced them to death. His own footmen “would not put forth their hand” against the priests ([[1 Sam. 22:17]]). Doeg would. He “slew on that day fourscore and five persons that did wear a linen ephod” ([[1 Sam. 22:18]]), and then Nob itself was put to the sword, people and animals alike.

      One son of Ahimelech, Abiathar, escaped to David, and David took the deaths on himself: “I knew it that day, when Doeg the Edomite was there, that he would surely tell Saul: I have occasioned the death of all the persons of thy father’s house” ([[1 Sam. 22:22]]).

      Of all this the title names only the telling. What a title is, and what it is worth as evidence, is discussed at [[Ps. 3:1]]; “To the chief Musician” is explained at [[Ps. 8:1]] and “Maschil” at [[Ps. 32:1]].
    sources: [lds-scriptures, bd-nob]

  - ref: 1
    phrase: O mighty man
    kind: words
    title: A hero, said with scorn
    body: |
      The Hebrew word is *gibbor*, a “strong, valiant man,” a warrior, and on one reading the psalm uses it as a taunt. “It is bad enough to behave wickedly, but bad in the extreme to boast of it at the same time as an heroic act,” and so the man is “sarcastically called” a hero. The ground given for the scorn is that this hero brought about a massacre, “not, however, by the strength of his hand, but by the cunning of his tongue.”

      When the righteous speak of him in verse 7 they use a different word, *geber*, which is “man as strong, distinguished from women, children, and non-combatants whom he is to defend.” The psalm calls him a strong man at its opening and again after he has been pulled down.
    sources: [oshb-wlc, bdb, delitzsch-psalms]

  - ref: 1
    phrase: the goodness of God endureth continually
    kind: words
    title: The kindness of God, all day long
    body: |
      The second half of verse 1 is four Hebrew words, *hesed* of God “all the day,” and “goodness” is the King James’s translation of *hesed* ([[Ps. 51:1]] explains the word). The clause has no verb of its own. It is counted among the places where God’s *hesed* is called everlasting.

      The words stand in the middle of an accusation, and not every translation has them there. The Greek translation has no “goodness of God” here at all. It reads “Why dost thou, O mighty man, boast of iniquity in thy mischief? All the day.” A modern translation follows a corrected text, “of mischief done against the godly,” and records the Hebrew in a footnote as “the kindness of God.”

      The King James follows the Hebrew, and in the Hebrew the word comes back. In verse 8 the speaker says, “I trust in the mercy of God for ever and ever,” and “mercy” is *hesed* again. The kindness of God that is set against the boast in verse 1 is what the speaker trusts at the end.
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue]

  - ref: 2
    phrase: like a sharp razor
    kind: symbol
    title: The psalm indicts the tongue, not the sword
    body: |
      In 1 Samuel Doeg kills with his own hand, yet the psalm never mentions a sword. Its one blade is a figure for his tongue. The Hebrew word means a razor, and the Greek translation has “like a sharpened razor.” Every charge in verses 2–4 but one, “Thou lovest evil more than good,” is a charge about speech, and verse 4 ends by addressing the man simply as “thou deceitful tongue.”

      This follows the title, which gives the occasion as the moment Doeg “came and told Saul.” In the narrative the report comes first ([[1 Sam. 22:9]]), and only afterward “Doeg the Edomite turned, and he fell upon the priests” ([[1 Sam. 22:18]]).

      The psalm does not say what the “lying” of verse 3 consisted of. As 1 Samuel gives his words, Doeg reported things he had seen: that Ahimelech inquired of the Lord for David, “gave him victuals, and gave him the sword of Goliath the Philistine” ([[1 Sam. 22:10]]). What Saul heard in the report was treason: “Why have ye conspired against me, thou and the son of Jesse” ([[1 Sam. 22:13]]). Ahimelech answered that he “knew nothing of all this, less or more” ([[1 Sam. 22:15]]). The narrative leaves it there, and the psalm’s own words for the tongue are “working deceitfully” and “devouring.”
    sources: [lds-scriptures, bdb, lxx-rahlfs]

  - ref: 5
    phrase: pluck thee out of thy dwelling place
    kind: words
    title: Four verbs of demolition
    body: |
      Verse 5 uses four verbs, and each one takes the man farther from where he lives. The first is the verb for pulling down a structure, such as an altar, a tower, a house or a city wall, used here of “an individual,” with God as its subject. The second is to “snatch up,” a word used mostly of fire and coals. The third is to “pull or tear away,” and the “dwelling place” he is torn from is in Hebrew a tent, so that the clause has been rendered “pluck thee up tent-less.” The fourth is made from the noun for a root and means to “deal with the roots”: “he shall root thee up” from the land of the living.

      The third verb is a word of the covenant’s curses. Moses warned Israel that if they would not obey, “ye shall be plucked from off the land whither thou goest to possess it” ([[Deut. 28:63]]), and the verb there is the verb of this verse.

      The speaker does none of this himself. In the Hebrew and in the King James the verse is a statement of what God will do, and the Greek translation makes it a wish, “may God destroy thee for ever.” How such lines are read, and how the Savior’s command to love enemies stands above them, is the note at [[Ps. 137:8]].
    sources: [bdb, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 6
    phrase: shall laugh at him
    kind: words
    title: What the righteous laugh at
    body: |
      The verb is a hard one, to “laugh at, usually in contempt, derision,” and the psalm gives the laughers’ words so that the reader can hear what the laugh is about. The Greek translation and a modern one both add “and say,” making verse 7 their speech. They do not speak of his pain. They point at his mistake: he would not make God his refuge, and he trusted his wealth.

      Fear comes before the laughter. The righteous “shall see, and fear,” two verbs that are a play of sounds in Hebrew, and only then laugh. On one reading the laughter is therefore not gloating but “joy at the ultimate breaking through of justice long hidden and not discerned.” The same reading points out that the Old Testament itself condemns gloating at an enemy’s fall: “Rejoice not when thine enemy falleth, and let not thine heart be glad when he stumbleth” ([[Prov. 24:17]]).

      The Lord’s own laughter at those who plot against Him is discussed at [[Ps. 2:4]].
    sources: [bdb, delitzsch-psalms, lxx-rahlfs, lds-scriptures]

  - ref: 7
    phrase: strengthened himself in his wickedness
    kind: words
    title: A refuge made of wealth
    body: |
      The fault the righteous name in verse 7 is a misplaced trust, and the Hebrew states it more sharply than the English. “Strength” in the first line is a “place or means of safety, protection,” a word used of God as a refuge, and a modern translation says he would not take “refuge in God.”

      About Doeg’s wealth 1 Samuel says only that he was “the chiefest of the herdmen that belonged to Saul” ([[1 Sam. 21:7]]).

      The last word of the verse is uncertain. “Wickedness” is the noun translated “mischiefs” in verse 2. There, in the plural, it means ruin “wrought, or meditated, by one against another.” Here it can be taken in its other sense, desire: he “became strong through his (evil) desire.” But the line before it speaks of riches, and the reading “wealth,” found in two ancient versions, has been preferred. A modern translation prints it, “and sought refuge in wealth,” with the Hebrew recorded in a footnote as “in his destruction.” Either way the charge is the same. He made himself strong with something other than God.

      The verb “trusted” is the hinge to the next verse, where the speaker says “I trust” with the same Hebrew verb and a different object.
    sources: [bdb, oshb-wlc, nrsvue, lds-scriptures]

  - ref: 8
    phrase: like a green olive tree in the house of God
    kind: symbol
    title: The tree that is not uprooted
    body: |
      The speaker’s picture of himself is a tree in full growth, three verses after the other man was uprooted. The man who trusted his riches is torn from his tent and rooted “out of the land of the living,” by a verb made from the word for roots. The speaker is a tree, alive and standing in the house of God.

      “Green” is more than a colour. The Hebrew adjective means “luxuriant, fresh” and is used of trees; the Greek translation has “a fruitful olive.” The psalm says twice how long this lasts: he trusts “for ever and ever” and will give thanks “for ever.”

      Which house the speaker means the psalm does not say. In the story the title points to, Nob, a place where the tabernacle stood, was put to the sword ([[1 Sam. 22:19]]), and David was a fugitive.

      Other scripture uses the same picture. A later psalm says of the righteous, “Those that be planted in the house of the LORD shall flourish in the courts of our God” ([[Ps. 92:13]]). Jeremiah shows the other possibility. The Lord named Judah “A green olive tree, fair, and of goodly fruit,” and then, for her broken covenant, “he hath kindled fire upon it, and the branches of it are broken” ([[Jer. 11:16]]). The tree planted by the water at the opening of the book is at [[Ps. 1:3]].
    sources: [bdb, lxx-rahlfs, bd-nob, lds-scriptures]

  - ref: 9
    phrase: 'because thou hast done it: and I will wait on thy name'
    kind: words
    title: Done, with no object, and a doubtful “wait”
    body: |
      The psalm ends by thanking God for something it has not described, and the Hebrew does not say what. “Thou hast done it” is a single verb with no object; “it” is the translators’ supply. Psalm 22 closes on the same verb in the same way ([[Ps. 22:31]]). Nothing in verses 1–8 reports a rescue. The man’s fall in verse 5 is still to come, yet the speaker speaks of God’s act as finished. One reading takes the verb of “the gracious and just carrying out of that which was aimed at in the election of David.”

      The next clause is doubtful in a different way. The Hebrew says “I will wait on thy name,” and the Greek translation agrees. But the vow is made “before thy saints,” and it has been objected that what a man does in the presence of the congregation “must be something that is audible or visible to them.” So a conjecture replaces “wait” with a verb of declaring, and a modern translation prints it, “I will proclaim your name, for it is good,” with a footnote giving the Hebrew as “wait for.”

      The King James follows the Hebrew. “Saints” is the Hebrew *hasidim*, explained at [[Ps. 4:3]].
    sources: [oshb-wlc, delitzsch-psalms, bdb, nrsvue, lxx-rahlfs, lds-scriptures]

christ: |
  What the speaker trusts is the *hesed* of God, named in verse 1 and again in verse 8; the word is explained at [[Ps. 51:1]]. The psalm says “God” throughout and never “the LORD,” but the God whose house and whose saints it speaks of is the God of Israel, whose “covenant or proper name” is Jehovah, and “Jehovah is the premortal Jesus Christ.” The psalm sets trust in Him against trust in riches, and its last line waits on His name, “for it is good.”

explore: |
  - **The story behind the title.** Read [[1 Sam. 21:1–9]] and [[1 Sam. 22:6–23]] through, and notice David’s words to Abiathar at the end.
  - **The other psalms of the flight from Saul.** The titles of Psalms 7, 34, 54, 56, 57, 59 and 142 place them in the same years.
  - **The olive tree as Israel.** Paul and Zenos use the olive tree for Israel and the Gentiles ([[Rom. 11:17–24]]; [[Jacob 5]]).

parallels:
  - ref: 1 Sam. 22:9–22
    note: The narrative the title points to. Doeg’s report, the killing of the priests of Nob, and David’s grief.
  - ref: Deut. 28:63
    note: The covenant curse of being “plucked from off the land” has the verb of verse 5.
  - ref: Ps. 92:12–14
    note: The righteous planted in the house of the Lord, still fruitful in old age.
  - ref: Jer. 11:16
    note: Judah named a green olive tree, and the tree burned.

