chapter: 149
title: A Song in the Mouth, a Sword in the Hand
tagline: The congregation of saints is called to a new song, with dancing and at night on their beds, and then the same people are given a two-edged sword and a judgment already written to carry out.
when: 'Undated; the psalm has no title and names no author'

setting: |
  Psalm 149 has no title and names no author and no occasion. Its place in the book says the most about it. It is the fourth of the five psalms that close the Psalter, each of which opens and closes with “Praise ye the LORD,” the word explained at [[Ps. 150:1]].

  It begins where the psalm before it ends. Psalm 148 calls on heaven and earth to praise and finishes with Israel alone: the LORD “exalteth the horn of his people, the praise of all his saints; even of the children of Israel, a people near unto him” ([[Ps. 148:14]]). Psalm 149 keeps that last company and addresses no one else. Its singers are “the congregation of saints,” “Israel,” and “the children of Zion.”

  One older reading hears in this psalm and its neighbors “the tone of the restoration-period of Ezra and Nehemiah,” the years after the return from Babylon. That is an inference from the psalm’s tone; the psalm itself gives no date.

  The dance and timbrel of verse 3 come again in the next psalm and are explained there ([[Ps. 150:4]]). The two-edged sword of verse 6 goes further. The New Testament and the revelations of the latter days use that image for the word of God, and John sees such a sword in the mouth of the Savior.

thread: |
  Psalm 149 is **praise that ends with a sword in the hand**, and it turns in the middle of a sentence.

  The first five verses are a summons to joy. A new song is called for (the phrase is explained at [[Ps. 33:3]]), and it is to be sung in the congregation, with dancing and with timbrel and harp. Verse 4 gives the reason, with “For”: the LORD “taketh pleasure in his people,” and He “will beautify the meek with salvation.” The people who sing are called the meek, and it is the LORD who adorns them. Verse 5 follows them home, where they “sing aloud upon their beds.”

  Verse 6 is the hinge. Its first half belongs to everything before it, “the high praises of God” in the mouth. Its second half begins something else: “and a twoedged sword in their hand.” The three verses that remain say what the sword is for, each beginning with “To”: to execute vengeance on the nations, to bind their kings, to execute “the judgment written.”

  Two things hold the halves together. The same people are in both: “saints” stands in the first verse, in verse 5, and in the last, and the hand that holds the sword in verse 6 is theirs. And in both halves the deciding act is the LORD’s. He beautifies the meek with salvation, and the judgment the saints carry out is one already “written.” The psalm calls that an “honour,” and ends as it began: “Praise ye the LORD.”

sections:
  - range: 1-3
    heading: A new song in the congregation
    plain: |
      Praise the LORD. Sing a new song to the LORD, and sing His praise where His saints are gathered. Let Israel be glad in the One who made him, and let the children of Zion rejoice in their King. Let them praise His name with dancing, and make music to Him with timbrel and harp.
  - range: 4-5
    heading: He will beautify the meek with salvation
    plain: |
      For the LORD delights in His people, and He will adorn the meek with salvation. Let the saints rejoice in the glory given them, and let them sing for joy on their beds.
  - range: 6-9
    heading: The judgment written
    plain: |
      Let the high praises of God be in their mouths and a two-edged sword in their hands: to bring vengeance on the nations and punishment on the peoples, to bind their kings with chains and their nobles with iron fetters, and to carry out on them the judgment that is written. This is the honor of all His saints. Praise the LORD.

notes:
  - ref: 1
    phrase: the congregation of saints
    kind: scripture
    title: Who the saints are
    body: |
      The saints of this psalm are Israel gathered to worship, and the word frames the whole poem. It stands in the first verse, in verse 5, and in the last verse, and the lines between give the same people four other names: “Israel,” “the children of Zion,” “his people,” and “the meek.”

      The psalm before this one makes the identification in so many words. Its last verse speaks of “all his saints; even of the children of Israel, a people near unto him” ([[Ps. 148:14]]), and this psalm opens with those saints assembled.

      The word is the one explained at [[Ps. 4:3]], and a modern translation has “the assembly of the faithful.” The honor of verse 9 belongs to “all his saints,” the whole congregation that sang in verse 1.
    sources: [lds-scriptures, oshb-wlc, nrsvue]

  - ref: 2
    phrase: him that made him
    kind: scripture
    title: Israel’s Maker and Zion’s King
    body: |
      Verse 2 rejoices in the LORD under two titles at once, the Maker of Israel and the King of Zion, and Isaiah puts the same two in one sentence. There the LORD says, “I am the LORD, your Holy One, the creator of Israel, your King” ([[Isa. 43:15]]). Psalm 100 joins being made by the LORD to being His people: “it is he that hath made us, and not we ourselves; we are his people” (see the notes at [[Ps. 100:3]]).

      The King is the LORD Himself. No king of Israel appears in the psalm, and the only other kings in it are the ones in chains in verse 8. The psalm that opens this closing run of five ends on the same reign: “The LORD shall reign for ever, even thy God, O Zion, unto all generations” ([[Ps. 146:10]]).
    sources: [lds-scriptures]

  - ref: 4
    phrase: he will beautify the meek with salvation
    kind: words
    title: Salvation as an adornment
    body: |
      To beautify the meek with salvation is to dress them in it: the rescue God gives is pictured as an ornament they wear. A modern translation has “he adorns the humble with victory” (on “victory” where the King James has “salvation,” see [[Ps. 98:1]]).

      The verb is one Isaiah uses of Israel and of the temple. With Israel as its object the King James has “glorify”: the nations will run to Israel “because of the LORD thy God, and for the Holy One of Israel; for he hath glorified thee” ([[Isa. 55:5]]). With the temple as its object it has “beautify”: the glory of Lebanon comes “to beautify the place of my sanctuary” ([[Isa. 60:13]]). Here the meek are its object.

      Salvation worn as clothing is in Isaiah too, “he hath clothed me with the garments of salvation” ([[Isa. 61:10]], with a note there), and in the promise to Zion: “I will also clothe her priests with salvation: and her saints shall shout aloud for joy” ([[Ps. 132:16]]).
    sources: [bdb, nrsvue, lds-scriptures]

  - ref: 5
    phrase: upon their beds
    kind: symbol
    title: Why they sing on their beds
    body: |
      On one older reading, the saints sing on the beds where they had wept: they “shout for joy upon their beds, upon which they have hitherto poured forth their complaints.” The reading rests on how two earlier psalms speak of the bed. It is “the place of soliloquy,” as in “commune with your own heart upon your bed, and be still” ([[Ps. 4:4]]), and it is the place of tears, as in “all the night make I my bed to swim; I water my couch with my tears” ([[Ps. 6:6]]). The tears shed there, the reading concludes, “are turned into shouts of joy.”
    sources: [lds-scriptures, delitzsch-psalms]

  - ref: 6
    phrase: a twoedged sword in their hand
    kind: symbol
    title: The sword, in the psalm and in later scripture
    body: |
      The sword stands in the same line as the praise, mouth and hand together, and that pairing suggests that the sword “may represent the penetrating force of words, particularly words of praise.” The language of the Bible leans the same way. In both Hebrew and Greek the word for two-edged means two-mouthed, so that the biblical languages carry “an association between a two-edged sword and the word.”

      Other scripture puts the sword in the mouth, or names it as the word. Isaiah’s servant says of the LORD, “he hath made my mouth like a sharp sword” ([[Isa. 49:2]]). The one weapon in Paul’s armor of God is “the sword of the Spirit, which is the word of God” ([[Eph. 6:17]]). Hebrews and the revelations of the latter days call the word of God sharper than a two-edged sword ([[Heb. 4:12]]; [[D&C 6:2]]).

      Verses 7–9 go on to say what the sword is for: vengeance on the nations, their kings in chains, a judgment carried out. How those verses have been read is taken up in the note on verse 9.
    sources: [scripture-helps-ps-102, ensign-two-edged-sword, lds-scriptures]

  - ref: 9
    phrase: the judgment written
    kind: scripture
    title: A sentence already written, and who carries it out
    body: |
      The saints do not pass the sentence of verses 7–9. They carry out one that is already “written,” and the psalm does not say where. One older reading takes it of no single passage but of “the testimony of the Law and of prophecy in general, that all kingdoms shall become God’s and His Christ’s.” A modern translation has “the judgment decreed.” On vengeance as the LORD’s own, “To me belongeth vengeance, and recompence” ([[Deut. 32:35]]), see the note at [[Ps. 94:1]], and for prayers of this kind [[Ps. 137:8]].

      The same older reading takes the conquest of these verses as a real one, “not without bloodshed,” and so it adds a warning. The verses have been taken as a call to holy war, and it answers that a Christian “cannot make such a Psalm directly his own without disavowing the apostolic warning,” which is Paul’s: “the weapons of our warfare are not carnal” ([[2 Cor. 10:4]]). Whoever prays the psalm now “must there transpose the letter of this Psalm into the spirit of the New Covenant.”
    sources: [delitzsch-psalms, nrsvue, lds-scriptures]

christ: |
  The King in whom the children of Zion rejoice is the LORD, and the LORD of the Psalms is the Savior before His birth (see [[Ps. 110:1]]). It is He who takes pleasure in His people and adorns the meek with salvation, and it is He who said, “Blessed are the meek: for they shall inherit the earth” ([[Matt. 5:5]]).

  The two-edged sword of verse 6 is an image scripture uses again of Him. In John’s first vision of the risen Lord, “out of his mouth went a sharp twoedged sword” ([[Rev. 1:16]]). When He comes with the name “King of Kings” ([[Rev. 19:16]]), the sword is still in His mouth and the nations are before it: “out of his mouth goeth a sharp sword, that with it he should smite the nations” ([[Rev. 19:15]]).

  That the judgment is His is explained at [[Ps. 94:1]].

explore: |
  - **The psalm this one continues.** [[Ps. 148]], which ends with the saints of Israel, and [[Ps. 150]], which ends the book with the dance and timbrel of verse 3.
  - **The King and the sword.** [[Rev. 19:11–16]], beside [[Rev. 1:12–18]].
  - **The meek adorned.** [[Isa. 61:1–3]] and [[Isa. 61:10]], with the notes there.
  - **The saints and the kingdom.** [[Dan. 7:18–27]].
  - **A new song given by revelation.** [[D&C 84:98–102]].

parallels:
  - ref: Ps. 148:14
    note: The psalm before ends with “all his saints; even of the children of Israel,” the company this psalm addresses.
  - ref: Isa. 43:15
    note: The LORD calls Himself “the creator of Israel, your King,” the two titles of verse 2.
  - ref: Isa. 61:10
    note: Salvation as a garment put on by the LORD, as in verse 4.
  - ref: Ps. 132:16
    note: Priests clothed with salvation and saints shouting aloud for joy.
  - ref: Heb. 4:12
    note: The word of God is “sharper than any twoedged sword.”
  - ref: D&C 6:2
    note: The Lord says of His own word that it is “sharper than a two-edged sword.”
  - ref: Rev. 19:15
    note: A sharp sword goes out of the mouth of the King of kings to smite the nations.
  - ref: Dan. 7:22
    note: Judgment is given to the saints of the most High.

