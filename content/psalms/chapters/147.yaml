chapter: 147
title: He Counts the Stars and Binds Up Wounds
tagline: Three calls to praise. The God who numbers the stars, sends the rain and commands the snow is the God who heals the broken in heart, feeds the crying raven and has given His word to Israel.
when: 'Undated and without a title; its rebuilt Jerusalem and gathered outcasts have been read of the years after the exile'

setting: |
  The psalm has no title and names no author. What it shows of its own time is in verses 2 and 13: Jerusalem is being built up, the outcasts of Israel are being gathered, and the bars of the city’s gates have been made strong. One older reading hears in it “the tone of the restoration-period of Ezra and Nehemiah” and thinks a reference to the dedication of Nehemiah’s wall “very probable”; that dedication was kept “with thanksgivings, and with singing, with cymbals, psalteries, and with harps” ([[Neh. 12:27]]). That is an inference from the psalm’s words. The psalm itself names no occasion.

  It is the second of the five psalms that close the book (see the note on [[Ps. 146:1]]). The Greek translation counts its third call to praise, at verse 12, as the beginning of a new psalm, so that verses 12–20 stand there as a psalm by themselves.

thread: |
  Psalm 147 is **three calls to praise, and each one sets the LORD’s power over sky and weather beside His care for the lowly and for Zion**. The calls are at verses 1, 7 and 12, and after each the psalm gives its reasons.

  The first reasons begin in a city that is being rebuilt. The LORD builds Jerusalem, gathers the outcasts and binds up wounds. Then, with no word of transition, He counts the stars and names them. Verse 6 comes back to earth: He lifts up the meek.

  The second stanza runs the other way, from the sky down. Clouds, rain and mountain grass lead to the beasts and to raven chicks crying for food. Then the psalm says what does not please Him, the war horse and the strong legs of a man, and what does: “them that fear him,” who “hope in his mercy.”

  The third stanza returns to Jerusalem, now with barred gates, children, peace and wheat, and then turns to winter. His word runs out and there is snow, frost and ice; He sends His word again and it all melts.

  The psalm ends on something different, at verse 19. The reasons for praise until then are things God does: building, healing, feeding, freezing, thawing. The last reason is something He has said. His word is shown to Jacob as “his statutes and his judgments,” and the psalm ends on that gift, which is Israel’s own.

sections:
  - range: 1-6
    heading: He heals the broken in heart and counts the stars
    plain: |
      Praise the LORD. It is good to sing praises to our God; it is pleasant, and praise is fitting. The LORD is building up Jerusalem and gathering the outcasts of Israel. He heals those whose hearts are broken and binds up their wounds. He counts the number of the stars and calls each of them by name. Our Lord is great and mighty in power; His understanding cannot be numbered. The LORD lifts up the meek and throws the wicked down to the ground.
  - range: 7-11
    heading: Rain for the earth, and food for the ravens
    plain: |
      Sing to the LORD with thanksgiving; sing praise to our God on the harp. He covers the sky with clouds, makes rain ready for the earth, and makes grass grow on the mountains. He gives the animals their food, and the young ravens when they cry. He takes no delight in the strength of a horse and no pleasure in the legs of a man. The LORD takes pleasure in those who fear Him, in those who hope in His mercy.
  - range: 12-14
    heading: Praise thy God, O Zion
    plain: |
      Praise the LORD, Jerusalem; praise your God, Zion. He has made the bars of your gates strong and has blessed your children within you. He makes peace within your borders and fills you with the finest wheat.
  - range: 15-20
    heading: His word runs swiftly
    plain: |
      He sends His command to the earth, and His word runs very quickly. He gives snow like wool and scatters frost like ashes. He throws down His ice like crumbs; who can stand before His cold? He sends out His word and melts them; He makes His wind blow, and the waters run. He declares His word to Jacob, His statutes and His judgments to Israel. He has not done this for any other nation; they have not known His judgments. Praise the LORD.

notes:
  - ref: 2
    phrase: he gathereth together the outcasts of Israel
    kind: history
    title: A city with its gates barred again, and a promise being kept
    body: |
      The gathering of outcasts is the keeping of a promise Moses recorded, and the psalm speaks of it in the present: the LORD “doth build” and “gathereth.”

      Moses had told Israel that after their scattering the LORD would “return and gather thee from all the nations, whither the LORD thy God hath scattered thee” ([[Deut. 30:3]]). Nehemiah’s prayer for Jerusalem asks God to remember that word, given to a people who turn back to Him: “though there were of you cast out unto the uttermost part of the heaven, yet will I gather them from thence” ([[Neh. 1:9]]).

      Nehemiah’s book also shows what verse 13 means by the bars of the gates. At gate after gate the builders “set up the doors thereof, the locks thereof, and the bars thereof” ([[Neh. 3:3]]), and when the wall stood, Nehemiah ordered of the gates, “let them shut the doors, and bar them” ([[Neh. 7:3]]). Whether the psalm was written for that wall is the inference described in the setting, but a city with barred gates is a city that has walls again.

      Isaiah gives the LORD the same title and has Him promise to gather still more: “The Lord GOD which gathereth the outcasts of Israel saith, Yet will I gather others to him, beside those that are gathered unto him” ([[Isa. 56:8]]).
    sources: [lds-scriptures]

  - ref: 4
    phrase: He telleth the number of the stars
    kind: scripture
    title: Why the stars come straight after the broken hearts
    body: |
      Verse 4 can be read as the reason verse 3 can be believed: the One who binds up wounds is the One who counts the stars. “Telleth” is older English for counting (“To count; to number”), so the line says that He knows how many stars there are, and He has a name for each.

      The step from a wounded heart to the night sky looks abrupt. Isaiah takes the same step in the other direction and shows what joins the two. He tells Jacob to look up at the host that God “bringeth out … by number,” where “he calleth them all by names” and “not one faileth” ([[Isa. 40:26]]). The very next verse quotes Jacob’s complaint: “My way is hid from the LORD” ([[Isa. 40:27]]). Isaiah’s answer to people who think God has lost sight of them is the stars, of which He loses none. One older reading puts the psalm’s logic this way: “To be acquainted with human woe and to relieve it is an easy and small matter to Him who allots a number to the stars, that are to man innumerable.”

      The Lord said as much to Moses of the worlds He had made: “innumerable are they unto man; but all things are numbered unto me, for they are mine and I know them” ([[Moses 1:35]]).

      The note on [[Isa. 40:26]] has more on the stars as a host.
    sources: [lds-scriptures, delitzsch-psalms, webster-1828]

  - ref: 5
    phrase: his understanding is infinite
    kind: words
    title: Infinite is “no number”
    body: |
      “Infinite” translates a Hebrew phrase that says there is no number, and its noun is the word translated “number” in the verse before. He sets a number to the stars (verse 4); to His own understanding there is no number (verse 5). The phrase is the ordinary Hebrew for “innumerable,” and a modern translation has “beyond measure.”

      So the English reader meets an abstract word where the Hebrew has a plain one, used in both verses. The stars are beyond a man’s counting and God counts them; the understanding that counts them has no count.

      Isaiah makes the same move after his own verse on the stars: “there is no searching of his understanding” ([[Isa. 40:28]]).
    sources: [oshb-wlc, bdb, nrsvue]

  - ref: 10
    phrase: he taketh not pleasure in the legs of a man
    kind: symbol
    title: The war horse, the strong legs, and the crying ravens
    body: |
      The horse and the legs stand for the strength a man trusts in, and the verse says that God takes no pleasure in either. Elsewhere in the Psalms the horse belongs to armies: “Some trust in chariots, and some in horses” ([[Ps. 20:7]]); “a mighty man is not delivered by much strength” ([[Ps. 33:16]]); “An horse is a vain thing for safety” ([[Ps. 33:17]]). For the legs a modern translation has “the speed of a runner” and notes that the Hebrew is “legs of a person.”

      The verse is placed between two others that explain it. Verse 9 has just named creatures with no strength at all, the young ravens “which cry,” and they are fed. Job has the same picture, “Who provideth for the raven his food? when his young ones cry unto God” ([[Job 38:41]]), and the Savior used it: “Consider the ravens … God feedeth them” ([[Luke 12:24]]). Verse 11 then names the people God does take pleasure in: those who “fear him” and “hope in his mercy.” (The mercy is the covenant love explained at [[Ps. 51:1]].) The psalm says “pleasure” twice, once of the strong legs and once of those who hope; the first is denied and the second affirmed.
    sources: [lds-scriptures, nrsvue, oshb-wlc]

  - ref: 18
    phrase: He sendeth out his word, and melteth them
    kind: scripture
    title: One word for the weather and for the law
    body: |
      The “word” that melts the ice in this verse is named again in the next, where it is given to Israel. It comes three times in five verses. In verse 15 it is a commandment sent to the earth that “runneth very swiftly.” Here it is sent out and the ice melts. In verse 19 it is shown “unto Jacob.”

      Between the first and second sending stands a winter: snow, hoarfrost, ice, and a cold before which no one can stand. All of it comes at His word and goes at His word. Other scripture speaks of God’s word this way, as something that acts. “By the word of the LORD were the heavens made” ([[Ps. 33:6]]). The next psalm has “snow, and vapour; stormy wind fulfilling his word” ([[Ps. 148:8]]). Isaiah compares the word to rain and snow that come down and do their work: “So shall my word be that goeth forth out of my mouth: it shall not return unto me void” ([[Isa. 55:11]]).

      Then the psalm keeps the word and changes its hearer. In verse 18 it is sent to ice and wind. In verse 19 it is declared to a people, as “his statutes and his judgments.” One older reading takes the two as one: the word by which God rules the natural world “is gone forth as a word of salvation to Israel,” unfolding itself in statutes and judgments.
    sources: [lds-scriptures, delitzsch-psalms]

  - ref: 20
    phrase: He hath not dealt so with any nation
    kind: scripture
    title: What Israel alone had been given
    body: |
      The psalm’s last reason for praise is that God had shown Israel His statutes and judgments, which other nations had not known. Moses said so in the same pair of words: “what nation is there so great, that hath statutes and judgments so righteous as all this law, which I set before you this day?” ([[Deut. 4:8]]).

      The gift carried a weight with it. Through Amos the LORD says, “You only have I known of all the families of the earth: therefore I will punish you for all your iniquities” ([[Amos 3:2]]).

      The Book of Mormon adds what the psalm does not say, that the Lord’s word goes to more nations than one. The Lord asks, “Know ye not that there are more nations than one?” and declares, “I bring forth my word unto the children of men, yea, even upon all the nations of the earth” ([[2 Ne. 29:7]]). Alma teaches that “the Lord doth grant unto all nations, of their own nation and tongue, to teach his word, yea, in wisdom, all that he seeth fit that they should have” ([[Alma 29:8]]). The psalm gives thanks for what Israel had then, and these verses say what the Lord intended for the rest.
    sources: [lds-scriptures]

christ: |
  The LORD of this psalm is Jehovah, who came into the world as Jesus Christ (see [[Ps. 110:1]]), and two of the works the psalm praises are works the Gospels give to Him.

  The first is the healing of verse 3. In the synagogue at Nazareth He read from Isaiah, “he hath sent me to heal the brokenhearted” ([[Luke 4:18]]), and then said, “This day is this scripture fulfilled in your ears” ([[Luke 4:21]]). The psalm says the LORD heals the broken in heart and binds up their wounds. In Nazareth Jesus said that He was sent to heal the brokenhearted.

  The second is the gathering of verse 2. Of His coming in glory He said that the angels “shall gather together his elect from the four winds, from one end of heaven to the other” ([[Matt. 24:31]]), the verse the Church’s edition of the Bible sets beside “outcasts” here.

explore: |
  - **The stars and the forgotten.** [[Isa. 40:26–31]], where the host called by name answers the complaint “My way is hid from the LORD.”
  - **Numbered unto me.** [[Moses 1:33–39]], where worlds no man can number are counted and known, and the Lord says what His work is.
  - **The wall and its dedication.** [[Neh. 6:15–16]] and [[Neh. 12:27–43]].
  - **Not by horses.** [[Ps. 20:7]], and [[Ps. 33:16–18]], which ends as verse 11 does, with those who fear Him and hope in His mercy.
  - **The gathering sung elsewhere.** [[Ps. 107:2–3]], and [[Isa. 11:12]] on the outcasts of Israel.
  - **The next psalm.** [[Ps. 148]] calls on the stars, the snow and the stormy wind of this psalm to give the praise themselves.

parallels:
  - ref: Isa. 40:26–28
    note: The stars brought out by number and called by names, and an understanding that cannot be searched; verses 4–5.
  - ref: Isa. 61:1
    note: The anointed one is sent “to bind up the brokenhearted”; verse 3.
  - ref: Deut. 30:3
    note: The promise that the LORD would gather scattered Israel; verse 2.
  - ref: Moses 1:35
    note: Worlds innumerable to man are “numbered unto me, for they are mine and I know them.”
  - ref: Job 38:41
    note: The young ravens cry to God for food; verse 9.
  - ref: Deut. 4:8
    note: No nation has “statutes and judgments so righteous”; verses 19–20.
  - ref: Luke 4:18
    note: The Savior reads of healing the brokenhearted and says the scripture is fulfilled.

