chapter: 78
title: That the Generation to Come Might Know
tagline: A teacher tells Israel’s history twice, from Egypt to the fall of Shiloh, so that the children will not forget what their fathers forgot, and he ends with a shepherd taken from the sheepfolds.
when: 'By its title, a Maschil of Asaph; the history it tells ends with David'

setting: |
  Psalm 78 is the sixth of the eleven psalms in a row (73–83) that carry Asaph’s name. Asaph and his guild of temple singers are introduced at [[Ps. 50:1]], and “Maschil,” the other word of the title, at [[Ps. 32:1]].

  The speaker is a teacher. He asks “my people” for a hearing, joins them as “we” (verses 3–4), and then tells the nation’s history for the rest of the psalm: the plagues, the sea, the wilderness, the land, the loss of the ark at Shiloh, and the choice of Judah, Zion and David. The psalm has been grouped with the psalms of praise, which call Israel together and go on, “often describing what he has done for Israel in the past.” This one tells the past so that the children “might not be as their fathers” (verse 8).

  The psalm says nothing of the kingdom’s division or of exile, and its title names no occasion.

  The New Testament takes it up. Matthew quotes verse 2 of the Savior’s teaching in parables ([[Matt. 13:35]]), the crowd Jesus had fed quotes its bread from heaven to Him ([[John 6:31]]), and Paul says the same wilderness history was written “for our admonition” ([[1 Cor. 10:11]]).

thread: |
  Psalm 78 is **history told so that it will not be forgotten**. The opening gives the reason. God commanded the fathers to tell their children, “that they might set their hope in God, and not forget the works of God” (verse 7), and not be like the generation before them. The history itself begins at verse 12.

  The teacher tells it twice. The first telling (verses 12–39) begins “in the field of Zoan” and follows Israel through the sea and the wilderness, where they ate bread from heaven and did not believe. The second (verses 40–72) begins again at Zoan (verse 43), goes through the plagues, and carries the story into the land, to the fall of Shiloh and the choice of David. Each telling sets what God did beside how the people answered, comes to His anger, and ends with something they had not earned.

  Forgetting and remembering mark the turns. Ephraim “forgat his works” (verse 11). Under judgment Israel “remembered that God was their rock” (verse 35), but with flattering mouths. They “remembered not his hand” (verse 42). Against these stands one act of memory that holds: “he remembered that they were but flesh” (verse 39).

  So each telling ends in an act of God. The first ends in forgiveness: “But he, being full of compassion, forgave their iniquity” (verse 38). The second ends in a choice: Judah, mount Zion, and David. The teacher called all this a parable (verse 2), and he closes without drawing the lesson for his hearers.

sections:
  - range: 1-8
    heading: Tell it to the children
    plain: |
      Listen, my people, to my law; turn your ears to what I say. I will open my mouth in a parable and speak riddles from long ago, things we have heard and known, which our fathers told us. We will not hide them from their children. We will tell the coming generation the praises of the LORD, His strength, and the wonders He has done. He set a testimony in Jacob and a law in Israel, and commanded our fathers to teach them to their children, so that the next generation would know them, the children yet to be born, and would rise and tell their own children. Then they would put their hope in God, not forget His works, and keep His commandments. They would not be like their fathers, a stubborn and rebellious generation whose heart was not set right and whose spirit was not faithful to God.
  - range: 9-11
    heading: Ephraim turned back
    plain: |
      The men of Ephraim, armed with bows, turned back on the day of battle. They did not keep God’s covenant and refused to walk in His law. They forgot what He had done and the wonders He had shown them.
  - range: 12-16
    heading: The sea, the cloud, and the rock
    plain: |
      He did marvels before their fathers in Egypt, in the field of Zoan. He divided the sea and brought them through, and made the waters stand like a heap. He led them by a cloud in the day and by the light of fire all night. He split rocks in the wilderness and gave them drink as from the great deep. He brought streams out of the rock and made water run down like rivers.
  - range: 17-31
    heading: Bread from heaven, and wrath
    plain: |
      Yet they sinned still more against Him and provoked the Most High in the wilderness. They tested God in their hearts by demanding the food they craved. They spoke against God: “Can God set a table in the wilderness? He struck the rock and water gushed out; can He give bread as well, or provide meat for His people?” The LORD heard and was angry. Fire was kindled against Jacob, because they did not believe in God or trust His salvation. Yet He had commanded the clouds above and opened the doors of heaven. He rained down manna for them to eat and gave them the grain of heaven. Man ate the bread of angels; He sent them food to the full. He made the east wind blow and brought in the south wind by His power. He rained meat on them like dust, birds like the sand of the sea, and let it fall in the middle of their camp, all around their tents. They ate and were filled, for He gave them what they craved. But they had not yet turned from their craving, and the food was still in their mouths, when the anger of God came on them. It killed the fattest of them and struck down the chosen men of Israel.
  - range: 32-39
    heading: They sought Him, and He forgave
    plain: |
      For all this they still sinned and did not believe in His wonders. So He let their days end in emptiness and their years in trouble. When He slew them they sought Him; they turned back and sought God earnestly. They remembered that God was their rock, and the Most High God their redeemer. But they flattered Him with their mouths and lied to Him with their tongues. Their heart was not right with Him, and they were not faithful to His covenant. Yet He, being full of compassion, forgave their iniquity and did not destroy them. Many times He turned His anger away and did not stir up all His wrath. He remembered that they were only flesh, a wind that passes and does not come back.
  - range: 40-55
    heading: From Egypt to the land
    plain: |
      How often they provoked Him in the wilderness and grieved Him in the desert! They turned back and tested God, and pained the Holy One of Israel. They did not remember His hand, or the day He delivered them from the enemy: how He set His signs in Egypt and His wonders in the field of Zoan. He turned their rivers to blood, so that they could not drink from their streams. He sent swarms of flies that devoured them and frogs that ruined them. He gave their crops to the caterpillar and the fruit of their labor to the locust. He destroyed their vines with hail and their sycomore trees with frost. He gave their cattle to the hail and their flocks to thunderbolts. He loosed on them His burning anger, wrath, indignation and trouble, sending evil angels among them. He cleared a path for His anger. He did not spare them from death but gave their lives to the plague, and struck every firstborn in Egypt, the first of their strength in the tents of Ham. But He led His own people out like sheep and guided them in the wilderness like a flock. He led them safely, and they were not afraid, while the sea covered their enemies. He brought them to the border of His sanctuary, to this mountain that His right hand had won. He drove out nations before them, measured out their inheritance by line, and settled the tribes of Israel in their tents.
  - range: 56-64
    heading: Shiloh forsaken
    plain: |
      Yet they tested and provoked the Most High God and did not keep His testimonies. They turned back and were faithless like their fathers; they turned like a treacherous bow. They angered Him with their high places and made Him jealous with their carved images. God heard, and was angry, and utterly rejected Israel. He left the tabernacle at Shiloh, the tent He had pitched among men. He gave His strength into captivity and His glory into the enemy’s hand. He gave His people to the sword and was angry with His inheritance. Fire consumed their young men, and their young women had no wedding. Their priests fell by the sword, and their widows made no lament.
  - range: 65-72
    heading: The Lord awakes and chooses
    plain: |
      Then the Lord awoke as if from sleep, like a warrior who shouts because of wine. He beat back His enemies and put them to lasting shame. He refused the tent of Joseph and did not choose the tribe of Ephraim. He chose the tribe of Judah, mount Zion, which He loved. He built His sanctuary like the high heavens, like the earth that He has founded forever. He chose David His servant and took him from the sheepfolds. From following the ewes heavy with young He brought him to shepherd Jacob His people, Israel His inheritance. And David shepherded them with an upright heart and guided them with skillful hands.

notes:
  - ref: 2
    phrase: I will open my mouth in a parable
    kind: scripture
    title: A parable made of history
    body: |
      The “parable” the teacher promises is the history itself. The Hebrew word, *mashal*, means a “proverb, parable” and reaches to other kinds of poem. Its partner, “dark sayings,” is the word for a “riddle, enigmatic, perplexing saying,” used here of “a lesson taught indirectly.” Yet no story and no riddle follows, only what “we have heard and known, and our fathers have told us” (verse 3). What makes the history a lesson is its purpose, that the hearers “might not be as their fathers” (verse 8).

      Matthew quotes the verse when he sums up the Savior’s day of parables. Jesus spoke to the multitude in parables “that it might be fulfilled which was spoken by the prophet, saying, I will open my mouth in parables; I will utter things which have been kept secret from the foundation of the world” ([[Matt. 13:35]]). The first line agrees with the ancient Greek translation of the psalm, which has the plural, “I will open my mouth in parables,” where the Hebrew has one parable. The second line differs from it: the Greek psalm reads “dark sayings which have been from the beginning.”

      [The People Forget; God Remembers](/psalms/themes/forget-and-remember/) follows the retelling of the exodus in Psalms 78, 105 and 106 as a call not to forget the works of God.
    sources: [bdb, oshb-wlc, lxx-rahlfs, lds-scriptures]

  - ref: 9
    phrase: The children of Ephraim
    kind: history
    title: Ephraim and the bow that turned
    body: |
      Ephraim’s turning back is tied to no named battle, and one reading takes the verse as a figure for the tribe’s unfaithfulness and not as the report of a retreat. The verse arrives before the history has begun, and it has been called “awkward and unintelligible” where it stands. One proposal asks whether Ephraim “grew weary in the work of the conquest of Canaan”; the reading followed here understands the statement “more generally and, according to Psalm 78:57, figuratively.”

      Verse 57 supplies the picture. There Israel “turned back, and dealt unfaithfully like their fathers: they were turned aside like a deceitful bow.” The Hebrew verb of “turned aside” is the verb of “turned back” in verse 9, and the bow is the same word. A deceitful bow is a “treacherous bow,” one “failing him who trusts to it.” Hosea, in a chapter that names Ephraim, has the same image: “they are like a deceitful bow” ([[Hosea 7:16]]).

      Why single out one tribe, when what is said of it “also holds good of the Israelites in general”? Ephraim was Joshua’s tribe (“Joshua belonged to this tribe”), and the land of Joseph’s sons held “historic sites like Shechem, Ebal, Gerizim, and Shiloh.” The reason given on the reading followed here is where the psalm is going. It is on its way to the day God “chose not the tribe of Ephraim” (verse 67), and this verse is “preparing the way” for that one.
    sources: [delitzsch-psalms, oshb-wlc, bdb, bd-ephraim, lds-scriptures]

  - ref: 19
    phrase: Can God furnish a table in the wilderness?
    kind: scripture
    title: The question asked after the miracle
    body: |
      The question is unbelief and not inquiry, because the people ask it while granting the miracle just before it: “he smote the rock, that the waters gushed out… can he give bread also?” (verse 20). The psalm’s own verdict is that “they believed not in God, and trusted not in his salvation” (verse 22).

      The history behind these verses is told in two places. Exodus 16 has the first complaint, when the people remembered Egypt, “when we sat by the flesh pots, and when we did eat bread to the full” ([[Ex. 16:3]]), and were given manna and quails. Numbers 11 has the craving for meat, when the people “fell a lusting” and said, “Who shall give us flesh to eat?” ([[Num. 11:4]]), and the psalm follows that account to its end. God answers the taunt by doing what they doubted. He opens “the doors of heaven” for bread and rains birds “like as the sand of the sea.” Then the gift becomes the judgment. The wrath came “while their meat was yet in their mouths” (verses 30–31), as Numbers tells it: “while the flesh was yet between their teeth, ere it was chewed” ([[Num. 11:33]]). The psalm’s comment on the feast is that “he gave them their own desire” (verse 29).

      Paul draws a warning from the same events. They “were our examples, to the intent we should not lust after evil things, as they also lusted” ([[1 Cor. 10:6]]).
    sources: [lds-scriptures]

  - ref: 25
    phrase: Man did eat angels’ food
    kind: christ
    title: Bread of the mighty, and the bread of life
    body: |
      The manna of these verses is the “bread from heaven” that a crowd held up to Jesus, and He answered that He is that bread. The psalm gives it two names. “The corn of heaven” (verse 24) is “the grain of heaven” in a modern translation and “the bread of heaven” in the ancient Greek. “Angels’ food” is in Hebrew the bread of the mighty: the word means “mighty, valiant,” understood here of angels, like the angels “that excel in strength” ([[Ps. 103:20]]). The Greek already has “angels’ bread.”

      The day after He fed the five thousand, the people asked Jesus, “What sign shewest thou,” and quoted scripture to Him: “Our fathers did eat manna in the desert; as it is written, He gave them bread from heaven to eat” ([[John 6:31]]). The line has been paired with verse 24 of this psalm. Jesus corrected them about the giver and about the bread: “Moses gave you not that bread from heaven; but my Father giveth you the true bread from heaven” ([[John 6:32]]). Then He said, “I am the bread of life” ([[John 6:35]]).

      Jesus also said what the manna did not do: “Your fathers did eat manna in the wilderness, and are dead” ([[John 6:49]]), but “if any man eat of this bread, he shall live for ever” ([[John 6:51]]).
    sources: [nrsvue, lxx-rahlfs, oshb-wlc, bdb, ot-manual-psalms, lds-scriptures]

  - ref: 38
    phrase: forgave their iniquity
    kind: words
    title: The verb of atonement
    body: |
      “Forgave” translates the Hebrew verb for covering or atoning, *kipper*, and here God is the one who does it. Where God is the subject of the verb, the thought is that “God in his sovereignty may himself provide an atonement or covering for men and their sins which could not be provided by men.”

      Where the verse stands makes the same point. It follows directly on a repentance that was false: “they did flatter him with their mouth,” and “their heart was not right with him” (verses 36–37). Nothing in the people accounts for the forgiveness. The verse gives its cause in its first words, “he, being full of compassion.”
    sources: [oshb-wlc, bdb]

  - ref: 41
    phrase: limited the Holy One of Israel
    kind: words
    title: Limited, or pained
    body: |
      The Hebrew verb behind “limited” probably means paining or grieving God, not setting bounds to Him. Its meaning is given as “probably pain, wound,” in a figurative sense, and the ancient Greek and a modern translation both have “provoked the Holy One of Israel.” That sense matches the line before it, where they “grieve him in the desert” (verse 40).

      On either rendering the next verse gives the cause: “They remembered not his hand.”
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue]

  - ref: 44
    phrase: turned their rivers into blood
    kind: scripture
    title: The plagues the psalm tells
    body: |
      The plagues of verses 44–51 are a selection, and they are not in the order of Exodus. The psalm starts with the first, the water turned to blood, then “takes a leap over to the fourth,” the flies, and joins the second, the frogs, to it. The locusts and the hail follow, and the pestilence and the death of the firstborn are brought together in verses 49–51. The third plague, the gnats, “is left unmentioned,” and the psalm has no boils and no darkness.
    sources: [delitzsch-psalms]

  - ref: 49
    phrase: by sending evil angels among them
    kind: words
    title: The evil angels sent on Egypt
    body: |
      “Evil angels” translates a Hebrew phrase that joins the word for angels or messengers to a plural adjective for evil. The footnote in the Church’s edition sends the reader from the phrase to the Topical Guide’s entry on evil or unclean spirits.

      The phrase has also been read of messengers who bring evil on Egypt and are not themselves wicked: “angels that bring misfortune,” or in a modern translation “a company of destroying angels.” On that reading the psalmist is paraphrasing “the destroyer” whom the LORD would not allow into Israel’s houses on the night the firstborn died ([[Ex. 12:23]]). That is one reading, and the psalm does not say more of them.
    sources: [oshb-wlc, delitzsch-psalms, nrsvue, lds-scriptures]

  - ref: 60
    phrase: he forsook the tabernacle of Shiloh
    kind: history
    title: The day the ark was taken
    body: |
      Verses 60–64 tell of the battle in which the Philistines captured the ark and Shiloh stopped being Israel’s sanctuary. Shiloh lay “in the tribe of Ephraim,” the tabernacle stood there “during the greater part of the period of the Judges,” and it remained the nation’s religious center “until after the loss of the Ark in the disastrous battle of Ebenezer.” Samuel tells of that day: “there fell of Israel thirty thousand footmen” ([[1 Sam. 4:10]]), and “the ark of God was taken; and the two sons of Eli, Hophni and Phinehas, were slain” ([[1 Sam. 4:11]]).

      The psalm never says “ark.” It says God “delivered his strength into captivity, and his glory into the enemy’s hand” (verse 61). “Strength” is the ark here, as in “the ark of thy strength” ([[Ps. 132:8]]). In Samuel’s account the mother who named her child I-chabod said, “The glory is departed from Israel: for the ark of God is taken” ([[1 Sam. 4:22]]).

      In the psalm’s wording God is the one who acts. He “forsook” the tent and “delivered” the ark, and the Philistines are only “the enemy’s hand.” The cause is in verse 58: high places and graven images. Jeremiah later sent Jerusalem to look at the place, “and see what I did to it for the wickedness of my people Israel” ([[Jer. 7:12]]); the note there tells the rest.
    sources: [bd-shiloh, bdb, lds-scriptures]

  - ref: 65
    phrase: Then the Lord awaked as one out of sleep
    kind: symbol
    title: The sleeper and the warrior
    body: |
      The Lord’s sleep is a comparison, and it has been read of how things had looked while Israel served its enemies: “He seemed to sleep.” Another psalm prays in those terms: “Awake, why sleepest thou, O Lord?” ([[Ps. 44:23]]). This verse says only “as one out of sleep.”

      The second picture is a soldier roused and shouting, “like a warrior shouting because of wine” in a modern translation, a hero “whose courage is heightened” by it.

      What the Lord does on waking (verse 66) has been read first of the Philistines who held the ark. Its wording is “moulded after 1 Samuel 5:6,” where the hand of the LORD “was heavy upon them of Ashdod” ([[1 Sam. 5:6]]) while the ark stood in the house of their god Dagon. On the same reading the verse also takes in “all the victories under Samuel, Saul, and David” that came after.
    sources: [delitzsch-psalms, nrsvue, lds-scriptures]

  - ref: 67
    phrase: chose not the tribe of Ephraim
    kind: scripture
    title: What passed to Judah, and what stayed with Joseph
    body: |
      What God refuses in this verse is “the tabernacle of Joseph,” the place of His sanctuary, and what He chooses in Judah is a mountain and a king. The tabernacle had stood at Shiloh, in Ephraim. The sanctuary would now stand on Zion, and the people’s shepherd would be David (verses 68–70).

      Chronicles keeps the rule and the birthright apart. Reuben’s birthright “was given unto the sons of Joseph” ([[1 Chr. 5:1]]), and yet “Judah prevailed above his brethren, and of him came the chief ruler; but the birthright was Joseph’s” ([[1 Chr. 5:2]]). Jeremiah, long after David, still hears the Lord say, “I am a father to Israel, and Ephraim is my firstborn” ([[Jer. 31:9]]).

      Scripture says more of the tribe than this verse does. “Ephraim was given the birthright in Israel,” and in the last days it has been that tribe’s privilege “first to bear the message of the Restoration of the gospel to the world and to gather scattered Israel.”

      The psalm names no merit of Judah’s for the choice. The idolatry of verses 56–58 is charged to Israel as a whole, and the one reason given for Zion is that God “loved” it (verse 68).
    sources: [bd-shiloh, bd-ephraim, lds-scriptures]

  - ref: 71
    phrase: to feed Jacob his people
    kind: words
    title: To feed is to shepherd
    body: |
      “Feed” here and “fed” in verse 72 are the Hebrew verb for tending a flock, so David is taken from one flock and given another. The ancient Greek says David was brought “to be the shepherd of Jacob.” The Lord’s word to David through Nathan has the same picture: “I took thee from the sheepcote, from following the sheep, to be ruler over my people” ([[2 Sam. 7:8]]). The tribes who anointed him king recalled the promise, “Thou shalt feed my people Israel” ([[2 Sam. 5:2]]).

      In the psalm the first shepherd is God. He “made his own people to go forth like sheep, and guided them in the wilderness like a flock” (verse 52), and the psalm before this one ends, “Thou leddest thy people like a flock by the hand of Moses and Aaron” ([[Ps. 77:20]]). David comes last in that line. Of the fathers the psalm said “their heart was not right with him” (verse 37); of David it says he fed the flock “according to the integrity of his heart.”
    sources: [oshb-wlc, bdb, lxx-rahlfs, lds-scriptures]

christ: |
  The New Testament hears Jesus Christ in this psalm. Its opening line was “fulfilled,” Matthew says, when Jesus taught the multitude in parables ([[Matt. 13:35]]). Its bread from heaven was quoted to Him, and He answered, “I am the living bread which came down from heaven” ([[John 6:51]]).

  Paul names the God of the psalm’s wilderness. The psalm says the people “remembered that God was their rock, and the high God their redeemer” (verse 35). Paul, recalling the same wilderness and the drink from the rock, says “that Rock was Christ” ([[1 Cor. 10:4]]). The God of Israel who led them through that wilderness is Jesus Christ.

  The psalm ends with a shepherd. Ezekiel, long after David, has the Lord promise, “I will set up one shepherd over them, and he shall feed them, even my servant David” ([[Ezek. 34:23]]), and Jesus said, “I am the good shepherd: the good shepherd giveth his life for the sheep” ([[John 10:11]]). [One Shepherd](/ezekiel/themes/one-shepherd/) follows that promise through Ezekiel.

explore: |
  - **The same history in other psalms.** [[Ps. 105]] and [[Ps. 106]], headed in the Church’s edition “Make the Lord’s doings known among all men” and “Israel rebelled.”
  - **The song of Moses.** [[Deut. 32:7]], “ask thy father, and he will shew thee,” and the Rock that Israel forgot ([[Deut. 32:18]]).
  - **Nephi tells the same history to his brothers.** [[1 Ne. 17:23–42]]: the Red Sea, the manna and the rock, and a people who “hardened their hearts, even as ye have.”

parallels:
  - ref: Matt. 13:34–35
    note: Matthew quotes verse 2 as fulfilled when Jesus taught the multitude in parables.
  - ref: John 6:31
    note: The crowd quotes “He gave them bread from heaven to eat,” and Jesus answers that He is the bread of life.
  - ref: 1 Cor. 10:4–11
    note: Paul recalls the wilderness, says the Rock was Christ, and calls the events written “for our admonition.”
  - ref: Num. 11:33
    note: The wrath that came while the flesh was still between their teeth, as in verses 30–31.
  - ref: 1 Sam. 4:10–22
    note: The ark is taken and the glory departs from Israel, the day of verses 60–64.
  - ref: Jer. 7:12–14
    note: The Lord points Jerusalem to Shiloh and what He did to it.
  - ref: 2 Sam. 7:8
    note: David taken from the sheepcote to rule the Lord’s people, as in verses 70–71.

