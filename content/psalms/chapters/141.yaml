chapter: 141
title: Prayer Set Forth as Incense
tagline: A man with snares laid for him asks first that his prayer be received as an offering and that his own mouth and heart be guarded, and only then that he be kept from the trap.
when: 'By its title, David’s; no occasion is given'

setting: |
  Psalm 141 is a psalm of David by its title, which names no occasion. Its neighbors share its danger. The snare and the gins of verse 9 are set for the speaker in [[Ps. 140:5]], and a snare is laid in his path in [[Ps. 142:3]]; one older reading counts Psalms 140–143 as four psalms “interwoven with one another in many ways.”

  The same reading proposes an occasion where the title gives none. It places the psalm in Absalom’s revolt, when “David was driven out of Jerusalem, and consequently cut off from the sacrificial worship of God upon Zion,” and calls it “an evening hymn of one of those troublous days.” Verse 2 speaks of the incense and the sacrifice offered each evening at the sanctuary ([[Ex. 30:8]]; [[Ex. 29:39]]), but the psalm itself does not say where its speaker is.

  The Hebrew of the middle of the psalm is difficult. A modern translation notes that the meaning of verses 5–7 is uncertain, and the ancient Greek translation reads verse 5 differently from the King James. The notes on those verses give what can be said and mark what cannot.

thread: |
  The enemies of Psalm 141 do not appear as enemies until verse 9. **Before the psalm asks to be kept from their snares, it asks to be kept from becoming one of them.**

  It opens as a lament does (see [[Ps. 22:1]]), with a cry for a hearing (verse 1). Then it asks something about the prayer itself: that it be received as the incense and the evening sacrifice are received (verse 2).

  The requests that follow are all about the speaker. He asks for a watch on his mouth and a door on his lips, for a heart not bent toward evil, and for no place at the table of “men that work iniquity” (verses 3–4). Those men are named here as company he might keep, not yet as a danger to his life. Against their dainties he sets the blows of the righteous, which he calls a kindness and oil for his head (verse 5).

  The end of verse 5 and verses 6–7 look toward the fall of the wicked and toward bones scattered at the mouth of the grave, in lines whose wording is uncertain.

  The psalm turns in verse 8: “But mine eyes are unto thee.” Only now does it say what has been done to him. Snares have been laid, and he asks to be kept from them, and that the wicked fall into their own nets while he escapes (verses 9–10). The King James says “keep” twice, in verse 3 of the door of his lips and in verse 9 of the snares, and his own mouth comes first.

sections:
  - range: 1-2
    heading: Let my prayer be as incense
    plain: |
      LORD, I call to You; come quickly to me. Hear my voice when I call. Let my prayer be set before You as incense, and my lifted hands as the evening sacrifice.
  - range: 3-4
    heading: A watch before my mouth
    plain: |
      Set a guard at my mouth, LORD; keep the door of my lips. Do not let my heart lean toward anything evil, to join in wicked deeds with men who do wrong, and do not let me eat their delicacies.
  - range: 5-7
    heading: The blows of the righteous
    plain: |
      Let a righteous man strike me; it is a kindness. Let him correct me; it is fine oil; let my head not refuse it. For still my prayer continues in their calamities. When their judges are overthrown in stony places, they will hear my words, for they are pleasant. As when someone ploughs and breaks up the earth, our bones are scattered at the mouth of the grave.
  - range: 8-10
    heading: Mine eyes are unto thee
    plain: |
      But my eyes are on You, GOD the Lord. In You I trust; do not leave my soul destitute. Keep me from the snare they have laid for me, and from the traps of those who do wrong. Let the wicked fall into their own nets while I escape.

notes:
  - ref: 2
    phrase: as incense
    kind: symbol
    title: The two evening offerings, and a prayer offered as they are
    body: |
      David asks that his prayer and his raised hands be received as the sanctuary’s daily offerings were. A modern translation has “Let my prayer be counted as incense before you.”

      Both offerings were made twice a day. Aaron was to burn incense on the altar each morning ([[Ex. 30:7]]), and again “when Aaron lighteth the lamps at even” ([[Ex. 30:8]]). A lamb was offered each morning and another in the evening with its meat offering and drink offering, “for a sweet savour, an offering made by fire unto the LORD” ([[Ex. 29:41]]). This was the “continual burnt offering,” which “was offered twice daily, morning and evening.”

      The people prayed while the incense burned. The priest “entered alone into the Holy Place” with the incense and then came back to the congregation, “who were praying outside.” Luke shows the same at the temple of his day: “the whole multitude of the people were praying without at the time of incense” ([[Luke 1:10]]). The hour of the evening offering is an hour of prayer elsewhere in scripture. Ezra rose “at the evening sacrifice,” fell on his knees, “and spread out my hands unto the LORD my God” ([[Ezra 9:5]]). Gabriel came to Daniel in prayer “about the time of the evening oblation” ([[Dan. 9:21]]).

      The psalm goes a step past praying at the hour of the offering. It asks that the prayer be taken as the offering, and the lifted hands as the sacrifice. For the lifted hands, see [[Ps. 28:2]].
    sources: [lds-scriptures, bd-incense, bd-sacrifices, nrsvue]
  - ref: 5
    phrase: Let the righteous smite me; it shall be a kindness
    kind: scripture
    title: Why a blow from the righteous is welcome
    body: |
      The blow is a rebuke, and David calls it a kindness because of who gives it. The second half of the line says what kind of blow it is: “let him reprove me.” Proverbs has the same thought: “Faithful are the wounds of a friend; but the kisses of an enemy are deceitful” ([[Prov. 27:6]]). The Joseph Smith Translation says what the righteous strike with: “When the righteous smite me with the word of the Lord it is a kindness.”

      The rebuke is “an excellent oil,” and the King James adds that it “shall not break my head.” The verb behind “break” means to “hinder, restrain, frustrate,” and in this verse it is taken as “refuse,” though the Hebrew text of the clause is marked as doubtful. A modern translation accordingly makes the clause a wish about the head and not a statement about the oil: “let my head not refuse it.” The Joseph Smith Translation gives the clause as a statement about the reproof, which “shall not destroy my faith.”
    sources: [lds-scriptures, bdb, esv]
  - ref: 5
    phrase: for yet my prayer also shall be in their calamities
    kind: scripture
    title: Whose calamities, and what kind of prayer
    body: |
      The King James leaves open whether this prayer is for “them” or against them, and the Joseph Smith Translation makes it a prayer for them: “for yet my prayer also shall be for them. I delight not in their calamities.” It does not say who “them” are. What it does say plainly is that he prays for them and does not delight in calamity.

      The Hebrew of the line is uncertain, which is why other versions read it so differently. In the ancient Greek translation the righteous chasten him, “but let not the oil of the sinner anoint my head: for yet shall my prayer also be in their pleasures.” A modern translation follows the Greek for the oil, “Never let the oil of the wicked anoint my head,” and makes the prayer one against the wicked: “for my prayer is continually against their wicked deeds.” Its notes say that the meaning of the Hebrew is uncertain.

      How the psalms that pray against enemies are to be read is set out at [[Ps. 137:8]].
    sources: [lds-scriptures, lxx-rahlfs, nrsvue]
  - ref: 7
    phrase: Our bones are scattered at the grave’s mouth
    kind: words
    title: Verses 6 and 7 are obscure, and translations differ
    body: |
      The wording of verses 6 and 7 is uncertain; a modern translation says so in a note on verses 5–7. Three questions can be put to them.

      *Who is overthrown, and who hears?* The verb behind “overthrown” means to “let drop.” One older reading sets the psalm in Absalom’s revolt and takes the overthrown to be the new rulers, “thrown down the precipices.” Men were once cast down “from the top of the rock” in that way ([[2 Chr. 25:12]]). The Church’s edition notes that the “they” who then hear David’s words are “the righteous.”

      *Whose bones?* The King James has “our bones,” and so does the Greek translation as it is printed. A modern translation prints “so shall their bones be strewn at the mouth of Sheol,” which makes the verse the end of the wicked; one older reading reports that some copies of the Greek and other ancient versions have “their.” In the King James the bones are those of the speaker and his companions. “The grave” is Sheol (see [[Ps. 6:5]]).

      *What is the picture?* The King James has someone cutting wood. The first of its two verbs is used here of “cleaving, ploughing” the earth, and the Greek has “As a lump of earth is crushed upon the ground.” One older reading takes the plough as a sign of hope: the bones lie in the ground “that they may rise up anew, as the seed that is sown sprouts up out of the upturned earth.” It finds here “the hope of a resurrection,” if not said directly then at least as an emblem of victory after defeat. That is one reading of a doubtful line, and the psalm does not develop it.

      Whatever verse 7 says of the bones, verse 8 answers it with “But mine eyes are unto thee.”
    sources: [nrsvue, bdb, delitzsch-psalms, lxx-rahlfs, lds-scriptures]

christ: |
  The LORD to whom the psalm prays is Jehovah (see [[Ps. 110:1]]), and John’s vision takes up the image of verse 2. The Church’s edition ties “prayer” in that verse to [[Rev. 5:8]], where the elders “fell down before the Lamb” holding “golden vials full of odours, which are the prayers of saints.” Later an angel stands at the golden altar before the throne with incense to offer “with the prayers of all saints” ([[Rev. 8:3]]), “And the smoke of the incense, which came with the prayers of the saints, ascended up before God out of the angel’s hand” ([[Rev. 8:4]]).

  David asked that his own prayer be set before the LORD as incense, and in Revelation that is how the prayers of the saints come before God.

explore: |
  - **The wicked caught in their own trap.** [[Ps. 7:15]], and Nephi’s word that the nations that war against Israel “shall fall into the pit which they digged to ensnare the people of the Lord” ([[1 Ne. 22:14]]; also [[1 Ne. 14:3]]).
  - **Reproof, from the side of the one who gives it.** [[D&C 121:43]], where the one who reproves is told to show afterward an increase of love.
  - **Prayer at the hour of the offering.** Elijah on Carmel, [[1 Kgs. 18:36]].

parallels:
  - ref: Rev. 8:3–4
    note: Incense rises before God with the prayers of the saints (also Rev. 5:8).
  - ref: Ex. 30:7–8
    note: Aaron burns incense morning and evening; the evening lamb is in Ex. 29:38–42.
  - ref: Luke 1:10
    note: The people pray outside at the time of incense.
  - ref: Ps. 140:5
    note: The snare and the gins of verse 9 (also Ps. 142:3).
  - ref: 1 Ne. 22:14
    note: Those who dig a pit for the Lord’s people fall into it, as verse 10 asks (also Ps. 7:15).

