chapter: 136
title: For His Mercy Endureth for Ever
tagline: The psalm names what God has done, from the making of the heavens to the giving of bread, and after every line the same answer comes back.
when: 'Undated; the psalm has no title'

setting: |
  The psalm has no title and names no occasion. Every verse has two halves: the first names the LORD or something He has done, and the second is one unchanging answer, given twenty-six times. It came to be known as the “Great Hallel,” beside the Hallel of Psalms 113–118.

  The answer is not this psalm’s alone. Chronicles and Ezra record it in Israel’s worship: before the ark in David’s day ([[1 Chr. 16:34]]), at the dedication of Solomon’s temple ([[2 Chr. 5:13]]), and when the foundation of the second temple was laid ([[Ezra 3:11]]). Three other psalms begin with the same call to give thanks ([[Ps. 106:1]]; [[Ps. 107:1]]; [[Ps. 118:1]]).

  It stands beside Psalm 135 and tells the same story: both set the LORD above all gods and go from Egypt’s firstborn to Sihon and Og, and verses 17–22 here follow [[Ps. 135:10–12]] closely, cut into six lines with the answer after each.

  It also shares wording with Deuteronomy: the titles of verses 2–3 are in [[Deut. 10:17]], and the “stretched out arm” of the deliverance from Egypt is in [[Deut. 4:34]].

thread: |
  Psalm 136 is **one sentence of thanks that keeps being interrupted by the reason for it**. Three times it says “O give thanks,” to the LORD, to the God of gods, to the Lord of lords. Then the command stops and a long chain hangs from it: “To him who alone doeth great wonders,” “To him that by wisdom made the heavens,” “To him that smote Egypt.” No new command comes until the last verse. Everything between is a description of the one to be thanked.

  The chain runs in order. It begins with creation: the heavens, the earth spread “above the waters” (the picture is explained at [[Ps. 24:2]]), the sun, the moon and the stars. It goes on to Egypt and the sea, then to the wilderness, the two kings, and the land.

  What holds it together is that the answer never changes. Making the sun is answered with “his mercy endureth for ever.” So is the death of Egypt’s firstborn, and so is the fall of Og. The psalm does not sort God’s acts into the gentle and the severe; the mercy it names after each is the covenant love explained at [[Ps. 51:1]].

  The turn is at verse 23. Until then the psalm has spoken of “Israel” and “his people.” Now it says “us”: He “remembered us in our low estate.” Verse 25 then goes wider than Israel, to “all flesh,” and the last verse returns to the opening command: “O give thanks unto the God of heaven.”

sections:
  - range: 1-3
    heading: O give thanks
    plain: |
      Give thanks to the LORD, for He is good; His mercy lasts for ever. Give thanks to the God of gods. Give thanks to the Lord of lords. (Every line of the psalm is followed by the same answer: His mercy lasts for ever.)
  - range: 4-9
    heading: To him that made the heavens
    plain: |
      Give thanks to Him who alone does great wonders; who made the heavens by wisdom; who spread the earth out above the waters; who made the great lights, the sun to rule the day, and the moon and the stars to rule the night. After each line: His mercy lasts for ever.
  - range: 10-15
    heading: Out of Egypt and through the sea
    plain: |
      To Him who struck Egypt in its firstborn and brought Israel out from among them, with a strong hand and an outstretched arm; who divided the Red Sea into parts and made Israel pass through the middle of it, but overthrew Pharaoh and his army in the Red Sea. After each line: His mercy lasts for ever.
  - range: 16-22
    heading: Through the wilderness, into a heritage
    plain: |
      To Him who led His people through the wilderness; who struck great kings and killed famous kings, Sihon king of the Amorites and Og the king of Bashan, and gave their land as a heritage, a heritage to Israel His servant. After each line: His mercy lasts for ever.
  - range: 23-26
    heading: Who remembered us
    plain: |
      He remembered us when we were brought low, and He has redeemed us from our enemies. He gives food to all flesh. Give thanks to the God of heaven. After each line: His mercy lasts for ever.

notes:
  - ref: 1
    phrase: for his mercy endureth for ever
    kind: history
    title: An answer sung at the LORD’s house
    body: |
      The second half of every verse is a response, and the Old Testament shows it being sung at the house of the LORD. When the ark was brought into Solomon’s temple, the singers and trumpeters “praised the LORD, saying, For he is good; for his mercy endureth for ever,” and “then the house was filled with a cloud” ([[2 Chr. 5:13]]). When fire came down on the sacrifices, all the children of Israel bowed to the pavement and said the same words ([[2 Chr. 7:3]]). When the foundation of the second temple was laid, “they sang together by course in praising and giving thanks unto the LORD; because he is good, for his mercy endureth for ever toward Israel” ([[Ezra 3:11]]). A modern translation renders “sang together by course” as “they sang responsively.”

      So the psalm was likely sung in parts, one voice or choir naming each deed and another answering. That is an inference from its form and from those scenes; the psalm does not assign the parts. What form temple music took can only be guessed at, though the form of some psalms suggests that some of it was sung in answer, and a refrain can invite those who hear it to take part.

      The “mercy” is the covenant love explained at [[Ps. 51:1]]. The note on [[Ps. 107:2]] follows the sentence into Jeremiah’s promise that it would be heard again in Jerusalem.
    sources: [lds-scriptures, nrsvue, hopkin-psalms-sung, parry-refrain]

  - ref: 2
    phrase: the God of gods
    kind: scripture
    title: The God of gods
    body: |
      “God of gods” and “Lord of lords” set the LORD over everything else that is called a god or a lord, and the psalm does not stop to say who those are. The two titles are the ones Moses uses: “For the LORD your God is God of gods, and Lord of lords” ([[Deut. 10:17]]). The psalm’s next line says that He “alone doeth great wonders,” and the psalm before this one says in plain terms, “our Lord is above all gods” ([[Ps. 135:5]]). The note on [[Ps. 82:1]] takes up who the “gods” of such verses are.
    sources: [lds-scriptures]

  - ref: 10
    phrase: smote Egypt in their firstborn
    kind: scripture
    title: Why the death of the firstborn is answered with mercy
    body: |
      Scripture calls the deliverance from Egypt the LORD’s mercy to Israel, and the psalm counts the last plague as part of that deliverance: verses 10 and 11 are one sentence. The song Israel sang on the far shore says, “Thou in thy mercy hast led forth the people which thou hast redeemed” ([[Ex. 15:13]]), and “mercy” there is the same Hebrew word as in this psalm’s refrain. Moses gives the reason the LORD brought them out: “because the LORD loved you, and because he would keep the oath which he had sworn unto your fathers, hath the LORD brought you out with a mighty hand” ([[Deut. 7:8]]). When the refrain is sung in Ezra it is sung with its object, mercy “toward Israel” ([[Ezra 3:11]]).

      Exodus also records that the plague came after a warning. Before any plague fell, Moses was sent to tell Pharaoh, “Israel is my son, even my firstborn” ([[Ex. 4:22]]), and what would follow a refusal: “I will slay thy son, even thy firstborn” ([[Ex. 4:23]]).

      The psalm itself does not explain the line. These are the terms in which the rest of scripture speaks of the same event.
    sources: [lds-scriptures, biblehub-interlinear]

  - ref: 21
    phrase: gave their land for an heritage
    kind: history
    title: The heritage east of the Jordan
    body: |
      The “heritage” of verses 21–22 is “their land,” the country of the two kings just named, east of the Jordan. Who Sihon and Og were, and how the two wars began, is told at [[Ps. 135:11]]. Their kingdoms lay “on this side Jordan toward the sunrising” ([[Deut. 4:47]]) and reached “from the river of Arnon unto mount Hermon” ([[Deut. 3:8]]), and Moses gave that country to Reuben, Gad and half the tribe of Manasseh ([[Deut. 3:12–13]]).

      Psalm 135 has these lines too, and there the list goes on past the two kings to “all the kingdoms of Canaan” ([[Ps. 135:11]]). This psalm names only Sihon and Og.
    sources: [lds-scriptures]

  - ref: 23
    phrase: Who remembered us in our low estate
    kind: structure
    title: The history becomes “us”
    body: |
      At verse 23 the psalm stops telling Israel’s history and begins to speak as “us.” Through verse 22 the people are “Israel,” “his people,” “Israel his servant.” Now the singers say that He remembered “us” and redeemed “us from our enemies.”

      The psalm does not say what the low estate was. On one older reading the praise here “changes suddenly to that which has been experienced very recently,” but the psalm names no event.

      What the text does show is that the singers put their own rescue in the same list as the Red Sea and the land, under the same answer. Then verse 25 goes past Israel altogether. The verbs change from what He did to what He does, and the one who receives is “all flesh.” Another psalm says the same: “The eyes of all wait upon thee; and thou givest them their meat in due season” ([[Ps. 145:15]]).
    sources: [lds-scriptures, delitzsch-psalms]

  - ref: 26
    phrase: for his mercy endureth for ever
    kind: scripture
    title: Mormon’s “endureth forever”
    body: |
      Mormon’s words about charity have been read as an allusion to this psalm’s refrain: “But charity is the pure love of Christ, and it endureth forever” ([[Moro. 7:47]]). The psalm is a long list of what God has done, each line closed by the refrain. Mormon gives a list of his own just before, of what charity is and does ([[Moro. 7:45]]), and on this reading the likeness is meant: he “also included a long list about charity,” and then says that it endures.

      The reading depends on what the refrain’s word means. On this account it “describes both God’s covenantal love for humanity, and our love for each other,” and the Book of Mormon uses “charity” in both directions. Moroni says to the Lord, “this love which thou hast had for the children of men is charity” ([[Ether 12:34]]).

      This is a proposal, resting on the shared phrase and the shared form. The phrase is not this psalm’s alone, and Mormon does not name the psalm.
    sources: [sc-knowhy-361, lds-scriptures]

christ: |
  The New Testament gives the title of verse 3 to Jesus Christ. In John’s vision the kings of the earth “shall make war with the Lamb, and the Lamb shall overcome them: for he is Lord of lords, and King of kings” ([[Rev. 17:14]]), and the rider on the white horse wears the name “King of Kings, and Lord of Lords” ([[Rev. 19:16]]). The LORD of the psalm is Jehovah, who is Jesus Christ before His birth (see the note on [[Ps. 110:1]]), so the works it lists are His.

  The psalm says that His mercy endures and shows it by what He did for Israel. Mormon names the love that “endureth forever” as “the pure love of Christ” ([[Moro. 7:47]]); the note on [[Ps. 136:26]] gives the reading that joins his words to this refrain.

explore: |
  - **The psalm before it.** [[Ps. 135]] tells the same history, from the LORD above all gods to Sihon and Og, without the refrain.
  - **The refrain at the temple.** [[2 Chr. 5:11–14]] and [[2 Chr. 7:1–6]] at Solomon’s dedication, and [[Ezra 3:10–13]] at the second temple’s foundation.
  - **The refrain before an army.** [[2 Chr. 20:21]], where Jehoshaphat appoints singers to go out ahead of the soldiers saying it.
  - **The same history as confession.** [[Ps. 106]] and [[Neh. 9]] tell the story this psalm tells, with Israel’s sins left in.

parallels:
  - ref: Ps. 135:10–12
    note: The lines on Sihon, Og and the heritage, which verses 17–22 follow closely with the refrain added.
  - ref: Deut. 10:17
    note: Moses calls the LORD “God of gods, and Lord of lords,” the titles of verses 2–3.
  - ref: 2 Chr. 5:13
    note: The refrain is sung at the dedication of Solomon’s temple, and the house is filled with a cloud.
  - ref: Ezra 3:11
    note: The refrain is sung “by course” when the second temple’s foundation is laid.
  - ref: Ex. 15:13
    note: The song at the sea calls the deliverance from Egypt the LORD’s mercy.
  - ref: Moro. 7:47
    note: Charity “endureth forever,” words that have been read as an allusion to the refrain.
  - ref: Rev. 17:14
    note: The Lamb is “Lord of lords, and King of kings.”

