chapter: 88
title: Day and Night Before Thee
tagline: A man who has been near death all his life prays three times to the God he holds responsible, asks whether the dead can praise, and ends on the word “darkness.”
when: 'Undated; by its title, of the sons of Korah and of Heman the Ezrahite'

setting: |
  Psalm 88 follows a short and cheerful song of Zion ([[Ps. 87:1]]), and the two “stand near one another as contrasts.” This one has been called “the darkest, gloomiest, of all the plaintive Psalms.”

  The speaker is one person, and he is near death. He has been so “from my youth up” (verse 15). His friends keep away from him, and he prays every day. He names no enemy and confesses no sin, and he does not say what his affliction is; the note on verse 8 gives one old proposal. Everything that has happened to him he attributes to the God he is praying to.

  The psalm is a lament, the kind of psalm whose usual course from complaint to praise is set out at [[Ps. 22:1]]. It has the address and the complaint, and it stops there. Six questions about whether the dead can praise stand at the center of the psalm (verses 10–12). They are about the world of the dead, which verse 3 names in Hebrew: “the grave” there is Sheol, explained at [[Ps. 6:5]].

thread: |
  Psalm 88 is **a prayer that gets no answer and does not stop**. Three times the speaker says that he has cried to the LORD: “day and night” (verse 1), “daily” (verse 9), and “in the morning” (verse 13). Hebrew uses a different verb each time.

  After the first cry he says where he is: counted with the dead, laid in the lowest pit, shut in (verses 3–8). After the second he argues. If he dies, who will be left to tell of God’s wonders (verses 10–12)? After the third he asks why (verse 14), and nothing comes back.

  What makes the psalm hard is whom he holds responsible. The verbs are addressed to God: “Thou hast laid me in the lowest pit,” “thou hast afflicted me,” “Thou hast put away mine acquaintance,” “thou hast made me an abomination.” The wrath, the waves and the terrors are all “thy.” Yet the one he accuses is the only one he speaks to, and the first thing he calls Him is “God of my salvation.”

  Most laments turn. Psalm 22 turns in the middle of a verse ([[Ps. 22:21]]), and Psalm 13 in its last two verses ([[Ps. 13:5]]). This one does not. Its last line repeats verse 8, and its last word in Hebrew is “darkness.”

sections:
  - range: 1-2
    heading: Let my prayer come before thee
    plain: |
      LORD, God of my salvation, I cry out by day and by night before You. Let my prayer come before You; bend Your ear to my cry.
  - range: 3-7
    heading: Counted with the dead
    plain: |
      For my soul is full of troubles, and my life has come to the edge of Sheol. I am counted with those who go down to the pit; I am like a man with no strength left, set adrift among the dead, like the slain who lie in the grave, whom You remember no more, who are cut off from Your hand. You have put me in the lowest pit, in dark places, in the depths. Your wrath presses down on me, and You have afflicted me with all Your breakers.
  - range: 8-9
    heading: Shut in, and still calling
    plain: |
      You have put those who know me far from me and made me a thing they loathe. I am shut in and cannot get out. My eye grows dim with affliction. Every day I have called on You, LORD; I have spread out my hands to You.
  - range: 10-12
    heading: Shall the dead praise thee?
    plain: |
      Do You work wonders for the dead? Do the shades rise up to praise You? Is Your lovingkindness told in the grave, Your faithfulness in the place of ruin? Are Your wonders known in the dark, Your righteousness in the land of forgetfulness?
  - range: 13-18
    heading: Why hidest thou thy face?
    plain: |
      But I, LORD, cry to You, and in the morning my prayer comes to meet You. LORD, why do You cast me off? Why do You hide Your face from me? I have been afflicted and close to death since my youth; I bear Your terrors, and I am in despair. Your fierce wrath has swept over me; Your terrors have cut me off. They surround me like water all day long; they close in on me together. You have put lover and friend far from me, and my companions are in darkness.

notes:
  - ref: 0
    phrase: upon Mahalath Leannoth
    kind: words
    title: Mahalath Leannoth
    body: |
      Leannoth is a word added here to the Mahalath of [[Ps. 53:1]], and the lexicon, the ancient Greek and a modern translation each handle it differently. Mahalath itself is “apparently a catchword in a song, giving name to tune; meaning dubious.” The lexicon sets Leannoth beside a form of a verb for singing, as in “the sound of distinct singing.” The ancient Greek has “for responsive strains.” A modern translation leaves both words as a name: “according to Mahalath Leannoth.”

      The rest of the title is explained elsewhere: “To the chief Musician” at [[Ps. 8:1]], and Maschil at [[Ps. 32:1]].
    sources: [bdb, lxx-rahlfs, nrsvue]

  - ref: 0
    phrase: Heman the Ezrahite
    kind: history
    title: Heman, and the two names in the title
    body: |
      The title gives the psalm two names, the sons of Korah and Heman the Ezrahite, and scripture knows a Heman who fits each. One is a temple singer. Chronicles lists “Heman a singer” among the Levites and traces his line back to Korah ([[1 Chr. 6:33–37]]), and it calls him “the king’s seer in the words of God” ([[1 Chr. 25:5]]). A Heman of that family would explain why a psalm “of Heman” is also “for the sons of Korah” (see [[Ps. 42:1]]).

      The other is a sage. Solomon “was wiser than all men; than Ethan the Ezrahite, and Heman, and Chalcol, and Darda” ([[1 Kgs. 4:31]]), and Chronicles has an Ethan and a Heman among “the sons of Zerah” ([[1 Chr. 2:6]]), which would make this Heman “not of the tribe of Levi, but of Judah.” The next psalm bears the name of his companion: its title reads “Maschil of Ethan the Ezrahite.”

      The title does not say how one man could be both. One older reading holds that two statements of the psalm’s origin stand side by side here and “are irreconcilable,” and it prefers the second. The psalm itself tells nothing of its author but his suffering.
    sources: [lds-scriptures, delitzsch-psalms]

  - ref: 1
    phrase: O LORD God of my salvation
    kind: words
    title: One name of hope and three cries
    body: |
      The psalm begins with a name of hope, and after it come three reports of praying, each with its own Hebrew verb. “Salvation” is the common Old Testament noun for “salvation by God, primarily from external evils, but often with added spiritual idea.” He never says what form it should take. The only request in the psalm is that he be heard: “Let my prayer come before thee: incline thine ear unto my cry” (verse 2).

      “I have cried” (verse 1), “I have called” (verse 9) and “have I cried” (verse 13) are three different verbs in Hebrew, and each has its time: “day and night,” “daily,” “in the morning.” Where the King James has “prevent” in verse 13, the Hebrew verb is to “come to meet” someone, and it is used of worshippers coming before the LORD.

      The third cry begins with an emphatic “But I.” In Hebrew the pronoun stands first, directly after the questions about the dead in verses 10–12.
    sources: [bdb, oshb-wlc]

  - ref: 5
    phrase: Free among the dead
    kind: words
    title: Free, as a released slave is free
    body: |
      “Free” is the word for a slave who has been let go, and here it means adrift, cut off from God’s remembrance. The Hebrew adjective means “free from slavery,” as of the bondservant released in the seventh year. Job uses it of the dead: “The small and great are there; and the servant is free from his master” ([[Job 3:19]]). For this verse the lexicon glosses the phrase “among the dead I am free (i.e. adrift, cut off from Yahweh’s remembrance),” and the rest of the verse says as much in plain terms: the dead are those “whom thou rememberest no more,” and “they are cut off from thy hand.”

      A modern translation gives the sense without the figure, “like those forsaken among the dead.” The ancient Greek keeps the figure: “free among the dead.”

      He does not say that he is dead. He is “counted with” those who go down to the pit (verse 4) and “like” the slain.
    sources: [bdb, lds-scriptures, nrsvue, lxx-rahlfs]

  - ref: 7
    phrase: thou hast afflicted me with all thy waves
    kind: symbol
    title: The pit, the dark, and thy waves
    body: |
      The images of verses 6–7 are the grave and the sea, and the psalmist calls both God’s doing. Verse 6 puts him in “the lowest pit, in darkness, in the deeps”; the Hebrew word for “darkness” there is used of a dark place of God’s wrath, like Sheol (see [[Ps. 6:5]]). Then the picture changes to drowning. “Waves” is the Hebrew word for a “breaker, of sea,” used as a figure “of calamities,” and in this verse of calamities “as sent by” the LORD.

      The same word, with the same pronoun, stands in two other prayers. Another psalm of the sons of Korah has “all thy waves and thy billows are gone over me” ([[Ps. 42:7]]), and Jonah prays from the fish, “all thy billows and thy waves passed over me” ([[Jonah 2:3]]). In all three the waves are “thy” waves.

      The Korahite psalm goes on at once, “Yet the LORD will command his lovingkindness in the daytime” ([[Ps. 42:8]]). This psalm has no “yet.” It comes back to the water in verse 17, where the terrors surround him “like water.”
    sources: [bdb, lds-scriptures]

  - ref: 8
    phrase: I am shut up, and I cannot come forth
    kind: history
    title: What his affliction is
    body: |
      The psalm never names the affliction, and one old proposal is leprosy. What he tells is this: he has been close to death “from my youth up” (verse 15), those who know him have been put far away and find him “an abomination,” and he is “shut up.” That verb is the ordinary one for confining a person; here it is a figure, set against going out.

      One older reading finds that the verse “sounds, according to Leviticus 13, very much like the complaint of a leper.” The law made such a man live apart: “he shall dwell alone; without the camp shall his habitation be” ([[Lev. 13:46]]). On that reading “shut up” is the leper’s separation, and the lifelong sickness of verse 15 is the same disease.

      That is a reading, and the psalm does not confirm it. A modern translation has only “I am shut in so that I cannot escape.” What the verse does insist on is who has done it: “Thou hast put away mine acquaintance far from me; thou hast made me an abomination unto them.” The line returns to end the psalm, as the note on verse 18 shows.
    sources: [delitzsch-psalms, bdb, nrsvue, lds-scriptures]

  - ref: 10
    phrase: shall the dead arise and praise thee?
    kind: words
    title: Six questions about the dead
    body: |
      The three verses ask six questions, and together they make his one argument: a dead man cannot tell what God has done.

      The questions pile up names for the place. The second “dead” in verse 10 is a different word from the first: *rephaim*, the “shades, ghosts,” a name for the dead in Sheol. A modern translation has “Do the shades rise up to praise you?” “Destruction” in verse 11 is *Abaddon*, a Hebrew word for “the place of the lost,” or “place of ruin,” within Sheol. “The land of forgetfulness” is one more designation of the same place. With “the grave” and “the dark,” that makes four names in two verses, on top of the pit and the deeps of verse 6.

      Against them he sets what belongs to God: “wonders” (twice), “lovingkindness,” “faithfulness” and “righteousness.” Lovingkindness is *hesed* (see [[Ps. 51:1]]). The verbs are verbs of telling: “praise,” “declared,” “known.”

      The same argument is made in a single verse at [[Ps. 6:5]]. The notes there explain Sheol and tell what the Restoration adds to the psalms’ picture of the dead.
    sources: [oshb-wlc, bdb, nrsvue, bd-abaddon]

  - ref: 15
    phrase: I am distracted
    kind: words
    title: A word of unknown meaning
    body: |
      “Distracted” translates a Hebrew verb found only in this verse, and its meaning is not known. The lexicon records one derivation that gives “be confused, helpless” and reports that others correct the text to a different verb. The ancient Greek has “brought low and into despair.” A modern translation has “I am desperate” and adds, “Meaning of Heb uncertain.”

      The rest of the verse is clear. He has been “afflicted and ready to die from my youth up,” so the psalm is not about a sudden disaster. What he prays about has lasted his whole life, and the terrors he bears are once more “thy terrors.”
    sources: [bdb, lxx-rahlfs, nrsvue]

  - ref: 18
    phrase: and mine acquaintance into darkness
    kind: structure
    title: The last word is darkness
    body: |
      The psalm ends on the Hebrew word for darkness, and it ends without turning. The last line repeats verse 8, with the same verb of putting far away and the same word for those who know him. In Hebrew the final clause is only two words, “mine acquaintance” and “darkness,” and English has to supply what joins them. The King James has “into”; a modern translation has “my companions are in darkness.” An older commentary has a starker rendering, “My familiar friends are gloomy darkness.” The same word, in the plural, is the “darkness” of verse 6, where God has laid him, and in this verse it stands for the grave or Sheol.

      Other laments reach an answer or a vow of praise (see [[Ps. 22:21]]). Here, in that commentary’s words, “the gloom of melancholy does not brighten up to become a hope.” What is left at the end is what was there at the beginning. He is still speaking to the “LORD God of my salvation,” and the same reading takes that name, and “his praying itself,” as the evidence “that the spark of faith within him is not utterly extinguished.”
    sources: [oshb-wlc, nrsvue, delitzsch-psalms, bdb]

christ: |
  The God this psalm addresses is the LORD, and “Jehovah is the premortal Jesus Christ.” The sufferer calls Him “God of my salvation” before he says anything else, and he keeps speaking to Him through every charge he lays.

explore: |
  - **The same argument in one verse.** [[Ps. 6:5]], with its notes on Sheol and on what the Restoration adds.
  - **Laments that turn.** [[Ps. 22]], where the answer comes in the middle of verse 21, and the Korahite [[Ps. 42]], with the same waves and a refrain of hope ([[Ps. 42:11]]).
  - **Job.** [[Job 19:13–19]], the same complaint of friends and kin estranged. The psalm’s “points of contact with the Book of Job” have been called more striking than its echoes of other psalms.

parallels:
  - ref: Ps. 6:5
    note: The argument of verses 10–12 in one verse; the note there explains Sheol.
  - ref: Ps. 42:7
    note: Another psalm of the sons of Korah, with the same Hebrew word for “waves,” also called “thy” waves.
  - ref: Jonah 2:3
    note: Jonah’s prayer has the same word, “all thy billows and thy waves.”
  - ref: Job 3:19
    note: “Free” in the grave, the same Hebrew word as in verse 5.

sources: [lds-scriptures, oshb-wlc, bdb, lxx-rahlfs, nrsvue, delitzsch-psalms, bd-abaddon, gs-jehovah]
