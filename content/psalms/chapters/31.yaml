chapter: 31
title: Into Thine Hand
tagline: A hunted man puts his life in God’s hand, prays the whole prayer a second time from lower down, and ends by telling how he had thought himself cut off and was heard.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  Psalm 31 stands in Book One of the Psalms. Its title ascribes it to David and names no occasion. One older reading keeps the title, “though not without some degree of hesitation,” and places the psalm in the years when Saul hunted him. The psalm itself names no person and no place.

  The speaker’s enemies plot against his life, and his neighbours avoid him. He complains, declares his trust, pleads and praises, which are the parts of a lament ([[Ps. 22:1]]). The psalm moves quickly from complaint to rejoicing, and it does so more than once.

  Other scripture takes up its lines. Its opening verses open Psalm 71 as well ([[Ps. 71:1–3]]). Verse 13 shares a clause with Jeremiah ([[Jer. 20:10]]), and two lines are close to lines of Jonah’s prayer ([[Jonah 2:4]]; [[Jonah 2:8]]). Luke records that the Savior died with verse 5 on His lips ([[Luke 23:46]]), and the heading in the Church’s edition has David “Speaking as the Messiah” in that verse.

  The psalm is also the last of a run of seven, Psalms 25–31, that has been compared with the psalm of Nephi ([[2 Ne. 4:16–35]]); the note on verse 19 gives the comparison.

thread: |
  Psalm 31 **prays its prayer twice**, and near the end it looks back on the fear behind both.

  Verses 1–8 are already a whole prayer. He asks to be delivered, calls God his rock, commits his spirit into God’s hand, and ends rejoicing over a rescue told in the past tense: “thou hast considered my trouble,” “thou hast set my feet in a large room.”

  Verse 9 starts the prayer over, in deeper distress: “Have mercy upon me, O LORD, for I am in trouble.” Now come the details the first prayer left out: a body worn down by grief, neighbours who flee, slander, and a plot against his life. One older reading hears the first part as a “paean before victory,” after which “there again breaks forth the petition.” The change from complaint to assurance in this psalm has been called “brusque,” with “no apparent cause.”

  The second prayer turns at verse 14, “But I trusted in thee, O LORD,” and the next line returns to the hand of verse 5: “My times are in thy hand.” Twice the psalm names the enemy’s hand, and twice he puts himself in God’s.

  From verse 19 the psalm is praise, and verse 22 looks back: “I said in my haste, I am cut off from before thine eyes: nevertheless thou heardest.” The psalm ends by telling all who hope in the LORD to take courage.

sections:
  - range: 1-5
    heading: Into thine hand
    plain: |
      In You, O LORD, I have taken shelter; never let me be put to shame. Deliver me, because You are righteous. Bend Your ear to me and rescue me quickly. Be a rock of strength to me, a fortified house to save me. For You are my rock and my fortress; for Your name’s sake lead me and guide me. Pull me out of the net they have hidden for me, for You are my strength. Into Your hand I entrust my spirit. You have redeemed me, O LORD, God of truth.
  - range: 6-8
    heading: A large room
    plain: |
      I hate those who hold to worthless idols; my trust is in the LORD. I will be glad and rejoice in Your mercy, because You have seen my trouble and known the distress of my soul. You have not handed me over to the enemy. You have set my feet in an open place.
  - range: 9-13
    heading: Fear on every side
    plain: |
      Have mercy on me, O LORD, for I am in trouble. My eye is wasted with grief, and my soul and body with it. My life is used up in sorrow and my years in sighing; my strength fails because of my iniquity, and my bones waste away. I am a reproach to all my enemies and still more to my neighbours, a dread to those who know me; people who see me in the street run from me. I am forgotten like a dead man, out of mind; I am like a broken pot. For I have heard the slander of many, fear on every side, while they sat together against me and planned to take my life.
  - range: 14-18
    heading: My times are in thy hand
    plain: |
      But I have trusted in You, O LORD. I have said, “You are my God.” My times are in Your hand; deliver me from the hand of my enemies and from those who pursue me. Make Your face shine on Your servant; save me for Your mercy’s sake. Do not let me be put to shame, O LORD, for I have called on You. Let the wicked be put to shame and be silent in the grave. Let the lying lips be silenced that speak hard things against the righteous with pride and contempt.
  - range: 19-22
    heading: Hidden in thy presence
    plain: |
      How great is the goodness You have stored up for those who fear You, and worked for those who trust in You, in the sight of all! You hide them in the shelter of Your presence from the pride of men; You keep them in a booth, away from the quarrel of tongues. Blessed be the LORD, for He has shown me His wonderful kindness in a strong city. In my alarm I had said, “I am cut off from before Your eyes.” Yet You heard the voice of my pleading when I cried to You.
  - range: 23-24
    heading: Love the LORD, all ye his saints
    plain: |
      Love the LORD, all you His saints. The LORD keeps the faithful and repays in full the one who acts in pride. Be strong, and He will strengthen your heart, all you who hope in the LORD.

notes:
  - ref: 2
    phrase: be thou my strong rock
    kind: symbol
    title: Asking God to be what He is
    body: |
      Verse 2 asks God to be a rock, verse 3 says He already is one, and the second is given as the reason for the first: “be thou my strong rock,” “For thou art my rock and my fortress.” One older reading calls this “the logic of every believing prayer.” The speaker asks God to become for him, in what now happens, what his faith holds that “He is even now.” Verse 4 is built the same way: pull me out, “for thou art my strength.”

      The rock and the fortress are named with the Hebrew words of David’s song in Psalm 18 and are explained at [[Ps. 18:2]].
    sources: [delitzsch-psalms, oshb-wlc]

  - ref: 5
    phrase: Into thine hand I commit my spirit
    kind: words
    title: A spirit entrusted to God’s hand
    body: |
      “Commit” is a word for leaving something in another’s keeping, and in the psalm it is said by a man who is asking to be kept alive. The Hebrew verb in this form means to “commit, entrust,” and elsewhere to “deposit” a thing in a place. What he entrusts is his spirit, and the place is God’s hand.

      The lines around it are the words of a man asking to live. He has just asked to be led, guided and pulled out of a net (verses 3–4), and he goes on to say that he will be glad (verse 7). The reason he gives for his trust is already in the past: “thou hast redeemed me.” The one he entrusts it to is the “LORD God of truth,” or in a modern translation the “faithful God.”
    sources: [bdb, nrsvue]

  - ref: 5
    phrase: thou hast redeemed me, O LORD God of truth
    kind: christ
    title: The Savior’s last words from the cross
    body: |
      Jesus died with the first half of this verse on His lips, and He added one word to it. “And when Jesus had cried with a loud voice, he said, Father, into thy hands I commend my spirit: and having said thus, he gave up the ghost” ([[Luke 23:46]]). The ancient Greek translation of the psalm has the plural too: “Into thine hands I will commit my spirit.”

      In the psalm the words are a hunted man’s trust that he will be kept alive. On the cross they are said at death. One older reading states the difference this way: “Like David, He commends His spirit to God; but not, that He may not die, but that dying He may not die.”

      Elder Jeffrey R. Holland set the saying at the end of the loneliness of the cross. “The trust He lived by told Him in spite of His feelings that divine compassion is never absent, that God is always faithful, that He never flees nor fails us.” And so, “With faith in the God He knew was there, He could say in triumph,” the words Luke records.

      Stephen, as he was stoned, prayed in the same form to the risen Lord: “Lord Jesus, receive my spirit” ([[Acts 7:59]]).
    sources: [lds-scriptures, lxx-rahlfs, delitzsch-psalms, holland-none-with-him, nrsvue]

  - ref: 6
    phrase: lying vanities
    kind: words
    title: Lying vanities are idols
    body: |
      “Lying vanities” is a name for false gods, and it stands next to the “God of truth” of the verse before. The first Hebrew word means “vapour, breath,” and so whatever is “evanescent, unsubstantial, worthless”; it is used “as of idols.” A modern translation has “worthless idols.” Jonah’s prayer has the same two Hebrew words: “They that observe lying vanities forsake their own mercy” ([[Jonah 2:8]]).

      In the Hebrew text as printed, and in the King James, it is the speaker who hates those who keep such gods. The Greek makes God the one who hates them, and the modern translation follows it, with a note that the Hebrew reads as the King James does. Either way the line ends on the contrast: “but I trust in the LORD.”
    sources: [bdb, nrsvue, lxx-rahlfs, oshb-wlc]

  - ref: 8
    phrase: thou hast set my feet in a large room
    kind: words
    title: A wide place, and then a narrow one
    body: |
      “A large room” is open ground, and the Hebrew word for trouble in the next verse is a word for a tight place. The noun here means a “broad, roomy, place” and is used as a figure “of freedom from distress and anxiety.” “I am in trouble” in verse 9 uses the word for “straits, distress,” whose adjective means “narrow, tight.” The same pair of pictures is explained at [[Ps. 4:1]].

      So the first prayer ends with him standing in the open, and the next line has him in the narrows again: “Have mercy upon me, O LORD, for I am in trouble.”
    sources: [bdb]

  - ref: 10
    phrase: because of mine iniquity
    kind: words
    title: Iniquity, its punishment, or misery
    body: |
      “Iniquity” here is the only fault of his own that the sufferer names in the psalm, and the word has been read three ways. The Hebrew word is the word for iniquity, as the King James has it. It has a further sense, “Consequence of, or punishment for, iniquity,” and this verse has been listed under it. The ancient Greek translation has something else, “my strength has been weakened through poverty,” and a modern translation goes with them and with the Syriac: “my strength fails because of my misery,” with a note that the Hebrew has “my iniquity.”

      Elsewhere the psalm speaks of enemies, slander and a plot, and it never asks for forgiveness. As the Hebrew stands, though, he does not claim to be without fault.
    sources: [bdb, lxx-rahlfs, nrsvue]

  - ref: 13
    phrase: fear was on every side
    kind: scripture
    title: A clause shared with Jeremiah
    body: |
      The Hebrew phrase here, *magor missabib*, is the one Jeremiah made his own, and the clause around it stands in his book nearly word for word. “For I heard the defaming of many, fear on every side” ([[Jer. 20:10]]): in Hebrew the first six words of that verse are the first six of this one. Jeremiah also gave the phrase as a name to the priest who had put him in the stocks, and the note on [[Jer. 20:3]] explains it.

      One older reading, keeping the title’s David, holds that Jeremiah’s line “may be just as much a reminiscence” of a psalm he knew, since his language is “so strongly imbued with that of the Psalter.”
    sources: [oshb-wlc, delitzsch-psalms, lds-scriptures]

  - ref: 15
    phrase: My times are in thy hand
    kind: words
    title: God’s hand and the enemy’s
    body: |
      The psalm sets God’s hand against the enemy’s, and this verse has both in one line. “Hand” comes four times, the same Hebrew word each time: “Into thine hand I commit my spirit” (verse 5); thou “hast not shut me up into the hand of the enemy” (verse 8); and here, “My times are in thy hand: deliver me from the hand of mine enemies.”

      “My times” is a plural that means a person’s “experiences, fortunes.” The Greek translators wrote “My lots are in thy hands.” In verse 5 he entrusts his spirit. Here he says that what befalls him is in the same hand.
    sources: [oshb-wlc, bdb, lxx-rahlfs]

  - ref: 16
    phrase: Make thy face to shine upon thy servant
    kind: scripture
    title: The shining face, and a hiding place in it
    body: |
      This verse asks for what the priests’ blessing pronounces, and four verses later the same face is where the faithful are hidden. Aaron and his sons were to say, “The LORD make his face shine upon thee” ([[Num. 6:25]]). The Hebrew verb for “shine” and the noun for “face” are the same here; another prayer built on that blessing is discussed at [[Ps. 4:6]]. What the shining of the Lord’s face brings in the Psalms is explained at [[Ps. 24:5]]; the next words of this verse are “save me.”

      “The secret of thy presence” in verse 20 is, word for word, the hiding place of thy face. “Presence” is the word “face,” and “secret” is a noun for a “covering, hiding-place,” used of the LORD “as shelter.” The “pavilion” beside it is a booth, a “rude or temporary shelter” of the kind put up for soldiers in the field and watchmen in a vineyard. Hiding place and shelter are paired again in [[Ps. 27:5]].
    sources: [lds-scriptures, oshb-wlc, bdb]

  - ref: 17
    phrase: let them be silent in the grave
    kind: words
    title: Silence for the lying lips
    body: |
      He asks that the wicked be silenced, and what they have done to him was done with their mouths. He has “heard the slander of many” (verse 13), and he asks that “the lying lips be put to silence” (verse 18). He opened the psalm asking never to be ashamed, and here he asks that the shame fall on them.

      “The grave” is *sheol*, the word explained at [[Ps. 6:5]]; a modern translation has “let them go dumbfounded to Sheol.” He asks God to do this and does nothing himself. How prayers of this kind are read is taken up in the note on [[Ps. 137:8]].
    sources: [oshb-wlc, nrsvue]

  - ref: 19
    phrase: Oh how great is thy goodness
    kind: scripture
    title: Nephi’s psalm and this one
    body: |
      Nephi’s psalm has been compared closely with Psalms 25–31, and this verse is one of the lines compared. Nephi writes of “the great goodness of the Lord, in showing me his great and marvelous works” ([[2 Ne. 4:17]]). The psalm exclaims over a goodness “wrought for them that trust in thee,” and in the Psalms only one other place, [[Ps. 145:7]], speaks of the Lord’s “great goodness.”

      Verse 15, “deliver me from the hand of mine enemies,” has likewise been set beside Nephi’s “Wilt thou deliver me out of the hands of mine enemies?” ([[2 Ne. 4:31]]), and the psalm’s quick movement “from complaint to rejoicing” beside Nephi’s own.

      The proposal behind the comparison, and its caution, are given in the note on [[Ps. 25:17]].
    sources: [alford-baker-psalm-nephi, lds-scriptures]

  - ref: 21
    phrase: in a strong city
    kind: words
    title: A fortified city, or a besieged one
    body: |
      The Hebrew can mean a city that is fortified or a city under siege, and translations go both ways. The noun covers “siege-enclosure, siege, entrenchment.” Here it has been taken as an “entrenched city,” with the remark that others read “besieged.” The Greek has “a fortified city.” A modern translation takes the other sense and makes it a comparison: “when I was beset as a city under siege.”

      On the first reading the kindness was shown him in a place of safety, and on the second while he was shut in. The psalm names no city.
    sources: [bdb, lxx-rahlfs, nrsvue]

  - ref: 22
    phrase: I said in my haste
    kind: words
    title: Haste is alarm
    body: |
      “In my haste” means in my alarm, and the verse shows that the despair in this psalm is being remembered. The Hebrew verb is to “be in trepidation, hurry, or alarm,” and this phrase is rendered “in my alarm.” The Greek translators wrote “in my extreme fear,” and the same words stand in their title for the psalm: “an utterance of extreme fear.”

      What he said in that state was “I am cut off from before thine eyes.” Jonah says nearly the same from the deep: “Then I said, I am cast out of thy sight” ([[Jonah 2:4]]). In Hebrew the two verbs differ by one letter. A modern translation, following other Hebrew manuscripts of the psalm, has “I am driven far from your sight.”

      Then comes “nevertheless.” The man who speaks the psalm has already been heard, and he says so.
    sources: [bdb, lxx-rahlfs, oshb-wlc, nrsvue]

  - ref: 23
    phrase: all ye his saints
    kind: words
    title: Saints are the people of hesed
    body: |
      “Saints” translates *hasidim*, a word made from *hesed*, and the psalm has used *hesed* of God three times. It is “mercy” in verse 7, “mercies” in verse 16 and “kindness” in verse 21. The adjective means “kind, pious.” Both words are explained elsewhere: *hesed* at [[Ps. 51:1]] and *hasid* at [[Ps. 4:3]]. The people called on to love the LORD carry the name of the quality the psalm has just praised in Him.

      A lament commonly closes with a vow of praise ([[Ps. 22:1]]). This one closes with a charge to the congregation. Its last line, “Be of good courage, and he shall strengthen your heart,” has the two verbs of [[Ps. 27:14]], said there to one person and here to all.
    sources: [oshb-wlc, bdb, sc-knowhy-438]

christ: |
  The Savior made verse 5 His own at the moment of His death ([[Luke 23:46]]), and the heading of the Church’s edition reads the verse as David speaking as the Messiah. The note on verse 5 gives the saying as Luke records it and Elder Holland’s teaching on it. It has been observed that He took His last word on the cross from this psalm, as He had taken the cry of forsakenness from another ([[Ps. 22:1]]; [[Matt. 27:46]]).

  The man who says the line in the psalm is surrounded by slander and a plot “to take away my life” (verse 13) and is forgotten “as a dead man” (verse 12). He entrusts himself all the same, and at the end he has been heard. One older reading sees in verses 9–13 a figure of the Passion that stays “within the limits of the type,” without the prophetic heightening of Psalm 22.

explore: |
  - **The death of Jesus in Luke.** [[Luke 23:44–46]], read beside verse 5; then Stephen’s prayer in [[Acts 7:59–60]].
  - **Jeremiah’s complaint.** [[Jer. 20:7–13]], where the prophet speaks the clause of verse 13.
  - **Jonah’s prayer.** [[Jonah 2:2–9]], which has the “lying vanities” of verse 6 and a line close to verse 22.
  - **The opening again.** [[Ps. 71:1–3]].
  - **The psalm of Nephi.** [[2 Ne. 4:16–35]], with Kenneth L. Alford and D. Bryce Baker, “Parallels between Psalms 25–31 and the Psalm of Nephi,” in *Ascending the Mountain of the Lord* (2013), which sets the two side by side.

parallels:
  - ref: Luke 23:46
    note: Jesus dies with the first half of verse 5 on His lips, adding “Father.”
  - ref: Acts 7:59
    note: Stephen, dying, prays “Lord Jesus, receive my spirit.”
  - ref: Jer. 20:10
    note: The first six Hebrew words are those of verse 13, “I heard the defaming of many, fear on every side.”
  - ref: Jonah 2:8
    note: Jonah’s prayer has the same Hebrew phrase as verse 6, “lying vanities.”
  - ref: Ps. 71:1–3
    note: Another psalm opens with the opening of this one.
  - ref: Num. 6:25
    note: The priests’ blessing, “The LORD make his face shine upon thee,” is asked for in verse 16.
  - ref: 2 Ne. 4:17
    note: Nephi’s “great goodness of the Lord” has been set beside verse 19.

