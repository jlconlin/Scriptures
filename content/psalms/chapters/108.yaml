chapter: 108
title: Through God We Shall Do Valiantly
tagline: The endings of two older psalms are sung as one, a song promised among the nations and then God’s claim on the land, with a prayer that He lead the way into Edom.
when: 'By its title, David’s; no occasion is given'

setting: |
  Psalm 108 is the second psalm of Book Five, and a reader of the book has met all of it before. Its first five verses are the close of Psalm 57 ([[Ps. 57:7–11]]), and its last eight are the close of Psalm 60 ([[Ps. 60:5–12]]), each with small changes that the notes set out.

  Both of those psalms carry an occasion in their titles: David in the cave when he fled from Saul, and David at war with Aram and Edom. This title keeps David’s name and gives no occasion. Its first words, “A Song or Psalm,” are explained at [[Ps. 66:1]].

  The psalm does not say who joined the two pieces, or when. One older reading is that it bears David’s name “only because it is compiled out of ancient Davidic materials,” and that the two pieces were “just put together, not soldered together, and taken out of their original historical connection.”

  “I will praise thee” in verse 3 is the same Hebrew verb as “O give thanks unto the LORD,” which opens the psalm before it ([[Ps. 107:1]]), a psalm with no title. The older reading just quoted takes the whole of this psalm as “the echo” to that call. The two psalms after it carry David’s name in their titles as well.

thread: |
  Psalm 108 is **two endings made into one prayer**. What it takes from each older psalm is the part that comes after the trouble has been told. Psalm 57 begins with a man asking for mercy “until these calamities be overpast” ([[Ps. 57:1]]), and Psalm 60 with a people telling God, “thou hast cast us off, thou hast scattered us” ([[Ps. 60:1]]). Neither beginning is here. The psalm opens where Psalm 57 arrives, with a fixed heart and a song promised among the nations, and verse 4 gives the reason for the song: mercy “great above the heavens.”

  The join is at verses 5 and 6. Verse 5 asks that God be exalted above the heavens, and verse 6 asks Him to save with His right hand. From there the psalm follows Psalm 60. God has spoken (verse 7), and this oracle, the word He speaks, says whose the land is. Shechem and Succoth, Gilead and Manasseh, Ephraim and Judah are His, and Moab, Edom and Philistia are His to dispose of. Then the speaker asks who will lead him into Edom, which the oracle has just claimed.

  So the order of the whole is praise, a plea, God’s word, a question, and confidence. Praise comes before anything is asked. Only one clause, “who hast cast us off” in verse 11, shows that anything has gone wrong, and the psalm does not say what. It ends as Psalm 60 ends: “vain is the help of man,” and “Through God we shall do valiantly.”

sections:
  - range: 1-5
    heading: My heart is fixed
    plain: |
      My heart is steadfast, O God. I will sing and give praise, and so will my inmost self. Wake up, psaltery and harp; I will wake early. I will praise You, O LORD, among the peoples, and sing praises to You among the nations. For Your mercy is great above the heavens, and Your truth reaches to the clouds. Be exalted above the heavens, O God, and let Your glory be over all the earth.
  - range: 6-9
    heading: God hath spoken
    plain: |
      So that those You love may be rescued, save with Your right hand, and answer me. God has spoken in His holiness: “I will rejoice. I will divide up Shechem and measure out the valley of Succoth. Gilead is mine, and Manasseh is mine. Ephraim is the helmet on my head; Judah is my sceptre. Moab is my washbasin. Over Edom I throw my shoe. Over Philistia I shout in triumph.”
  - range: 10-13
    heading: Who will lead me into Edom?
    plain: |
      Who will bring me to the fortified city? Who will lead me to Edom? Will not You, O God, who rejected us? Will You not go out with our armies, O God? Give us help against the trouble, for the help men give is worthless. With God we will do valiantly; He is the one who will tread down our enemies.

notes:
  - ref: 1
    phrase: even with my glory
    kind: scripture
    title: The close of Psalm 57, with four changes
    body: |
      Verses 1–5 are [[Ps. 57:7–11]] sung again, and four things in them differ from the older psalm.

      *The heart, once.* Psalm 57 has “My heart is fixed, O God, my heart is fixed” ([[Ps. 57:7]]). Here the Hebrew text says it once. The ancient Greek has it twice in this psalm too, “my heart is ready, my heart is ready,” and a modern translation restores the second on that evidence, noting that the Hebrew text “lacks” it. What “fixed” means is explained at [[Ps. 57:7]].

      *My glory.* In Psalm 57 the singer wakes it: “Awake up, my glory” ([[Ps. 57:8]]). Here that command is gone, and the words are joined to the singing instead. The glory is the singer’s own self, “the seat of honour in the inner man, the noblest part of man” (see [[Ps. 30:12]]), and in this verse it stands beside “my heart.” On one older reading the line says that he will sing, “yea, his soul with all its godlike powers shall do it.” A modern translation follows Psalm 57 here and prints “Awake, my soul!”

      *The name.* “O Lord” in [[Ps. 57:9]] is the title. Here it is “O LORD,” the divine name, and it is the only time the name stands in the psalm. Everywhere else the psalm says “God.”

      *Above the heavens.* Psalm 57 measures the mercy “unto the heavens” ([[Ps. 57:10]]). Here the Hebrew has a different preposition and the mercy is “above the heavens,” while the truth still reaches “unto the clouds.”
    sources: [lds-scriptures, oshb-wlc, lxx-rahlfs, nrsvue, bdb, delitzsch-psalms]

  - ref: 6
    phrase: That thy beloved may be delivered
    kind: structure
    title: Where the two psalms are joined
    body: |
      Verse 6 is where Psalm 60 begins to be heard, and in the King James it runs on from the verse before. In Psalm 60 the line follows a complaint. Here it follows the request of verse 5, and the King James ends that verse with a semicolon, so that one sentence crosses the join: be exalted above the heavens, “That thy beloved may be delivered.”

      A modern translation divides the lines the other way. It puts the command first, “Give victory with your right hand, and answer me,” and then its purpose, “so that those whom you love may be rescued.”
    sources: [lds-scriptures, nrsvue]

  - ref: 9
    phrase: over Philistia will I triumph
    kind: scripture
    title: The close of Psalm 60, and the line that differs
    body: |
      Verses 6–13 are [[Ps. 60:5–12]], and one line of the oracle has a different sense here. The notes on that psalm explain the rest: who speaks and what “in his holiness” means ([[Ps. 60:6]]), the helmet and the staff ([[Ps. 60:7]]), the washpot and the shoe ([[Ps. 60:8]]).

      In Psalm 60 the line on Philistia is spoken to her: “Philistia, triumph thou because of me” ([[Ps. 60:8]]). The verb there is a command. Here the same verb is in the first person, and a modern translation has “over Philistia I shout in triumph.” The Greek of this psalm has a statement as well, though a different one: “the Philistines are made subject to me.”
    sources: [lds-scriptures, bdb, nrsvue, lxx-rahlfs]

  - ref: 11
    phrase: who hast cast us off
    kind: words
    title: The same Hebrew as Psalm 60, in different English
    body: |
      Verse 11 reads differently from its twin in the King James, though the Hebrew of the two verses is all but the same. Psalm 60 has “Wilt not thou, O God, which hadst cast us off? and thou, O God, which didst not go out with our armies?” ([[Ps. 60:10]]). There the second half looks back at a defeat. Here the translators made both halves hopeful questions: “and wilt not thou, O God, go forth with our hosts?” The Greek reads this psalm the same way, as two questions.

      The Hebrew can also be taken as a complaint, and a modern translation prints it so: “Have you not rejected us, O God? You do not go out, O God, with our armies.”

      In Psalm 60 the clause repeats that psalm’s first words, “O God, thou hast cast us off” ([[Ps. 60:1]]), which are not sung here. The verb is explained at [[Ps. 44:9]].
    sources: [lds-scriptures, oshb-wlc, lxx-rahlfs, nrsvue]

christ: |
  The LORD whom the singer promises to praise “among the nations” in verse 3 is Jehovah, the premortal Jesus Christ (see [[Ps. 110:1]]).

  The psalm says of God that His mercy is “great above the heavens,” and that rescue is His alone: “vain is the help of man,” and “he it is that shall tread down our enemies.”

  The heading of the Church’s edition singles out one line of the oracle, that Judah is the Lord’s lawgiver. The King James has the same word in Jacob’s blessing on that tribe ([[Gen. 49:10]]), where Shiloh has been read as a prophecy of the Messiah. The note on [[Ps. 60:7]] says more.

explore: |
  - **The two beginnings that were left out.** [[Ps. 57:1–6]] and [[Ps. 60:1–4]], the trouble each older psalm starts from.
  - **The psalm before it.** [[Ps. 107]], which opens with the call “O give thanks unto the LORD.”
  - **The two psalms of David that follow.** [[Ps. 109]] and [[Ps. 110]].

parallels:
  - ref: Ps. 57:7–11
    note: The first five verses, with “O Lord” where this psalm has “O LORD.”
  - ref: Ps. 60:5–12
    note: The last eight verses, where they follow a complaint instead of praise.
  - ref: Ps. 107:1
    note: “O give thanks,” the verb of this psalm’s “I will praise thee” in verse 3.
  - ref: Gen. 49:10
    note: The lawgiver of Judah, the word of verse 8.

