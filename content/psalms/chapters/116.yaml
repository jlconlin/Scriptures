chapter: 116
title: The Cup of Salvation
tagline: A man brought back from the edge of death asks what he can give the LORD in return, and answers by lifting a cup, calling on His name, and paying his vows in front of everyone.
when: 'Undated; the psalm has no title'

setting: |
  Psalm 116 has no title and names no author. Its speaker is one person, and what has happened to him is told in the psalm itself: death had hold of him, he called on the LORD, and he lives. He does not say whether the danger was sickness or an enemy. The last verses say where he is headed with his thanks: “the courts of the LORD’s house,” in Jerusalem, with all the people watching.

  The psalm before it ends, “The dead praise not the LORD, neither any that go down into silence. But we will bless the LORD from this time forth and for evermore” ([[Ps. 115:17–18]]). Psalm 116 is a single voice out of that “we,” a man who was nearly among the silent.

  It is one of the six psalms called the Hallel, “recited by Jews at the great feasts”; the note at [[Ps. 113:1]] introduces the group and its place at the Last Supper, and the note on verse 13 has the cup of this psalm on that night. Paul quotes verse 10 as the words of his own faith ([[2 Cor. 4:13]]).

  Like Psalms 113 and 117, the psalm closes with “Praise ye the LORD,” the Hebrew hallelujah, explained at [[Ps. 150:1]].

thread: |
  Psalm 116 is **a thanksgiving that does not know how to repay**. It is built on one phrase, used for two different things. In verse 4 the man is in the grip of death, and “Then called I upon the name of the LORD” is a cry for his life. In verses 13 and 17 he is safe, and “call upon the name of the LORD” is what he will do with a cup in his hand and an offering at the altar. Verse 2 has already said it will be so for the rest of his days: “therefore will I call upon him as long as I live.”

  The first nine verses tell the rescue. He loves the LORD because he was heard (verses 1–2). He tells what the danger was and gives the whole prayer he prayed in it, which is one line long (verses 3–4). Then he says what the LORD is, “gracious,” “righteous,” “merciful,” in words close to those spoken at Sinai ([[Ps. 103:8]] has the note), and what He does for “the simple” (the word is explained at [[Ps. 19:7]]). He tells his own soul that it can rest, and counts what was saved: his life, his eyes, his feet.

  The psalm turns at verse 10 and comes to its question in verse 12: “What shall I render unto the LORD for all his benefits toward me?” The answer of verses 13–14 is a cup taken, the LORD’s name called on, and vows paid in public. Verse 15 says how the LORD regards the death of His saints, verse 16 says what the rescued man now is, “thy servant,” and verses 17–19 give the answer of verses 13–14 a second time, now with the place named.

sections:
  - range: 1-4
    heading: He hath heard my voice
    plain: |
      I love the LORD, because He has heard my voice and my pleading. He bent His ear toward me, so I will call on Him as long as I live. The pangs of death were all around me, and the pains of Sheol took hold of me; I found trouble and sorrow. Then I called on the name of the LORD: “O LORD, I beg You, save my life.”
  - range: 5-9
    heading: Return unto thy rest, O my soul
    plain: |
      The LORD is gracious and righteous; our God is merciful. The LORD watches over the simple. I was brought low, and He helped me. Go back to your rest, my soul, for the LORD has been generous with you. You have rescued my soul from death, my eyes from tears, and my feet from falling. I will walk before the LORD in the land of the living.
  - range: 10-14
    heading: What shall I render unto the LORD?
    plain: |
      I believed, and so I spoke; I was badly afflicted. In my alarm I said, “All men are liars.” What can I give back to the LORD for all the good He has done me? I will take the cup of salvation and call on the name of the LORD. I will pay my vows to the LORD now, in front of all His people.
  - range: 15-19
    heading: In the courts of the LORD’s house
    plain: |
      The death of His saints is precious in the eyes of the LORD. O LORD, I am truly Your servant; I am Your servant, the son of Your handmaid. You have untied my bonds. I will offer You the sacrifice of thanksgiving and call on the name of the LORD. I will pay my vows to the LORD now, in front of all His people, in the courts of the LORD’s house, in the middle of you, O Jerusalem. Praise the LORD.

notes:
  - ref: 3
    phrase: The sorrows of death compassed me
    kind: scripture
    title: The words of Psalm 18 for the edge of death
    body: |
      The speaker describes his danger in words that Psalm 18, David’s song of deliverance by its title, also has, and they mean that he nearly died. That song has “The sorrows of death compassed me” ([[Ps. 18:4]]) and “The sorrows of hell compassed me about” ([[Ps. 18:5]]). It also begins as this psalm does, with love: “I will love thee, O LORD, my strength” ([[Ps. 18:1]]).

      “Hell” in this verse is the Hebrew word Sheol, and a modern translation leaves it untranslated: “the pangs of Sheol laid hold on me.” What Sheol is, and what the psalmists feared in it, is explained at [[Ps. 6:5]]. The word behind “sorrows” is explained at [[Ps. 18:4]].
    sources: [lds-scriptures, oshb-wlc, nrsvue]

  - ref: 8
    phrase: thou hast delivered my soul from death
    kind: scripture
    title: What Psalm 56 asks, this psalm says is done
    body: |
      Verses 8–9 say as done what the last verse of Psalm 56 half states and half asks: “For thou hast delivered my soul from death: wilt not thou deliver my feet from falling, that I may walk before God in the light of the living?” ([[Ps. 56:13]]). Here there is no question. The soul and the feet are both delivered, “mine eyes from tears” is added between them, and the walking “before the LORD” is no longer a hope but an intention.

      “The land of the living” stands where the other psalm has “the light of the living.” In this psalm it is set against the death and Sheol of verse 3: he is still among the living, and nearly was not. The note at [[Ps. 56:13]] compares the two verses.
    sources: [lds-scriptures]

  - ref: 10
    phrase: I believed, therefore have I spoken
    kind: scripture
    title: Paul takes the line as his own
    body: |
      Paul quotes this verse to say why he speaks, and the faith he means is faith in the Resurrection. “We having the same spirit of faith, according as it is written, I believed, and therefore have I spoken; we also believe, and therefore speak” ([[2 Cor. 4:13]]). His next words say what is believed: “Knowing that he which raised up the Lord Jesus shall raise up us also by Jesus” ([[2 Cor. 4:14]]). The psalm he reaches for is the thanksgiving of a man delivered from death.

      The ancient Greek translation reads the sentence the same way, “I believed, wherefore I have spoken.” A modern translation of the Hebrew joins the two halves differently: “I kept my faith, even when I said,” and then his words, “I am greatly afflicted.” On either rendering the verse puts faith and affliction in the same moment. He believed while he was “greatly afflicted,” and not only once the affliction was over.
    sources: [lds-scriptures, lxx-rahlfs, nrsvue]

  - ref: 11
    phrase: I said in my haste
    kind: words
    title: Haste is alarm, not rashness
    body: |
      “In my haste” means in my alarm: the phrase names the fear he was in, and it does not say that he spoke too quickly. The Hebrew verb is to “be in a hurry or alarm,” and this phrase is rendered “in my alarm”; a modern translation has “in my consternation.” The same words stand in [[Ps. 31:22]], where the note has more.
    sources: [bdb, nrsvue, lds-scriptures]

  - ref: 12
    phrase: What shall I render unto the LORD
    kind: symbol
    title: The answer is a cup lifted in thanks
    body: |
      The question of verse 12 is answered with three things he will do: take a cup, call on the LORD’s name, and pay his vows. The psalm does not say what the cup is. A modern translation has “I will lift up the cup of salvation.”

      On one older reading the cup is “a figure taken from the Passover,” the meal that remembers the deliverance from Egypt, and it is the cup “raised aloft and drunk amidst thanksgiving” for all the saving help he has had. The same reading connects it with the vows of the next verse, since the offerings that paid a vow ended in a meal: “A common and joyous eating and drinking in the presence of God” went with them. The note on verse 17 has the offering.

      So what he gives back is thanks, said aloud and in company.
    sources: [nrsvue, delitzsch-psalms]

  - ref: 13
    phrase: the cup of salvation
    kind: christ
    title: Sung on the night of Gethsemane
    body: |
      Psalm 116 was probably among the last words the Savior sang before He went to Gethsemane. The Gospels do not name the hymn, but they place it: “And when they had sung an hymn, they went out into the mount of Olives” ([[Matt. 26:30]]). That hymn “would be part of the Hallel” (the note at [[Ps. 113:1]] has the custom), and on one reading Psalms 115–118 “would probably have been the last words Jesus sang with his disciples before they left.”

      If so, He sang of taking “the cup of salvation” and, a little later, prayed about a cup: “O my Father, if it be possible, let this cup pass from me: nevertheless not as I will, but as thou wilt” ([[Matt. 26:39]]). Setting the two cups side by side is a reading of the night and not a statement of the Gospels: an invitation to “consider how Christ might have felt, singing about ‘the cup of salvation.’”
    sources: [lds-scriptures, bd-hymns, lambert-passover-easter]

  - ref: 15
    phrase: Precious in the sight of the LORD is the death of his saints
    kind: prophets
    title: Why the death of his saints is precious
    body: |
      President Russell M. Nelson read this line of the death of the faithful when it comes: it is precious because it is a “homecoming” for the Saint with the Lord.

      In the psalm the line is said by a man the LORD has just kept from dying. Another psalm says something close of a king who rescues the poor: “He shall redeem their soul from deceit and violence: and precious shall their blood be in his sight” ([[Ps. 72:14]]). One older reading takes that verse as the source of this one and hears it the same way: “The death of His saints is no trifling matter with God; He does not lightly suffer it to come about.” That reading is of the rescue the psalm has just told, and not of death when it does come.

      “Saints” is the word explained at [[Ps. 4:3]]; a modern translation has “his faithful ones.”
    sources: [nelson-decisions-eternity, lds-scriptures, delitzsch-psalms, nrsvue]

  - ref: 17
    phrase: the sacrifice of thanksgiving
    kind: history
    title: A vow paid at the altar, and a meal
    body: |
      The “sacrifice of thanksgiving” and the paying of a vow are offerings the law of Moses names, and the flesh of both was eaten. Leviticus lists them as two kinds of peace offering: one brought “for a thanksgiving” ([[Lev. 7:12]]), and one where “the sacrifice of his offering be a vow” ([[Lev. 7:16]]). The peace offering’s “characteristic rite was the sacrificial meal”: after the altar’s and the priests’ portions, the rest of the flesh “was eaten by the sacrificer, his household, and the poorer Levites.”

      The psalm names the company and the place: the vow is paid “in the presence of all his people,” “in the courts of the LORD’s house.” Jonah promises the same two things in one sentence: “But I will sacrifice unto thee with the voice of thanksgiving; I will pay that that I have vowed” ([[Jonah 2:9]]). The notes at [[Ps. 50:14]] and [[Ps. 22:26]] have more on the thank offering and the vow.
    sources: [lds-scriptures, bd-sacrifices]

christ: |
  The LORD who hears this man and keeps him from death is Jehovah, the premortal Jesus Christ; the note at [[Ps. 110:1]] has the name.

  The psalm was probably also in His own mouth, as part of the hymn He sang with His disciples before going out to the Mount of Olives; the note on [[Ps. 116:13]] sets the “cup of salvation” beside the cup He prayed about that night.

  Paul heard the psalm’s faith as faith in the Resurrection, as the note on [[Ps. 116:10]] shows.

explore: |
  - **The rest of the hymn.** [[Ps. 113]]–118, read as the psalms of the Passover table, ending with the rejected stone of [[Ps. 118:22]].
  - **The cup in Gethsemane.** [[Matt. 26:36–46]], and the Savior’s own account of “the bitter cup” in [[D&C 19:16–19]].
  - **Paul’s use of verse 10.** [[2 Cor. 4:7–18]], where “I believed, and therefore have I spoken” is said by a man “always delivered unto death.”
  - **The servant’s name for himself.** [[Ps. 86:16]], where “the son of thine handmaid” has its note.
  - **Vows made in danger and paid in the temple.** [[Ps. 66:13–15]] and [[Jonah 2:1–9]].
  - **The Passover and the Last Supper.** The article “Our Faithful Lord: Passover to Easter” follows the meal step by step, with the Hallel in its place.

parallels:
  - ref: Ps. 18:4–5
    note: David’s song has the “sorrows of death” and “sorrows of hell” of verse 3.
  - ref: Ps. 56:13
    note: The prayer for feet kept from falling and a walk before God, which verses 8–9 give as done.
  - ref: 2 Cor. 4:13
    note: Paul quotes verse 10 as the spirit of his own faith.
  - ref: Matt. 26:30
    note: The hymn sung at the end of the Last Supper, taken from the Hallel psalms.
  - ref: Ps. 72:14
    note: The blood of the poor is “precious” in the king’s sight, as the death of the saints is in verse 15.
  - ref: Jonah 2:9
    note: A man brought back from death promises thanksgiving and the payment of his vow.

