chapter: 124
title: If It Had Not Been the LORD
tagline: Israel looks back on a danger it did not survive by its own strength, and says who was on its side.
when: 'By its title, David’s; the psalm names no occasion'

setting: |
  Psalm 124 is the fifth of the fifteen songs of degrees, Psalms 120–134, probably sung by pilgrims on the way up to Jerusalem. The note on the title at [[Ps. 120:1]] explains the name.

  The psalm is the voice of a people. It speaks as “us” and “we” from beginning to end, and verse 1 names the speaker: “now may Israel say.” What Israel has come through is not named. There were “men” who “rose up against us,” and their “wrath was kindled”; no nation, king, or battle is mentioned.

  Its neighbors are worth reading with it. Psalm 123, just before, is a plea: “Have mercy upon us, O LORD,” for “our soul is exceedingly filled… with the contempt of the proud” ([[Ps. 123:3–4]]). Psalm 124 looks back on a trouble already past. Psalm 125, just after, opens with a statement of trust: “They that trust in the LORD shall be as mount Zion, which cannot be removed” ([[Ps. 125:1]]).

  The last verse is close kin to [[Ps. 121:2]], and the note on verse 8 follows the line through the songs of degrees.

thread: |
  Psalm 124 is **a thanksgiving told almost entirely as what did not happen**. Verses 1–5 are one long sentence, “If it had not been the LORD… Then… Then… Then,” and every “then” is a disaster that never came: swallowed alive, overwhelmed by the waters, the stream gone over the soul. For five verses the psalm does not describe the rescue. It describes the end Israel was headed for and names the one reason it was not reached.

  The sentence moves slowly. The “If” is said twice before anything follows it, and “gone over our soul” is said twice before the sentence ends. One older reading says the psalm’s art is that “in order to take one step forward it always goes back half a step.”

  The turn is verse 6: “Blessed be the LORD.” The imagined disasters stop and the real outcome is stated, first as something withheld (“who hath not given us as a prey”) and then as something done: “the snare is broken, and we are escaped.” Verse 8 then gives the rule the story proves. The “If” of verse 1 supposed the LORD absent; the last verse says where help is in fact found.

sections:
  - range: 1-5
    heading: What would have happened
    plain: |
      If the LORD had not been for us (let Israel say it), if the LORD had not been for us when men rose against us, they would have swallowed us alive in their burning anger. The flood would have swept us away, the torrent would have gone over us, the raging waters would have gone over our heads.
  - range: 6-8
    heading: What did happen
    plain: |
      Blessed be the LORD, who did not hand us over to be torn by their teeth. We got away like a bird out of the hunters’ trap: the trap broke, and we are free. Our help is in the name of the LORD, the Maker of heaven and earth.

notes:
  - ref: 0
    phrase: A Song of degrees of David
    kind: history
    title: What the title says, and what the Greek title leaves out
    body: |
      The title makes two statements, that this is a pilgrim song and that it is David’s, and the second is not in every ancient copy. “A Song of degrees” puts the psalm among the fifteen that were probably pilgrims’ songs; the note at [[Ps. 120:1]] has the account.

      “Of David” is in the Hebrew text the King James translates. The ancient Greek translation heads the psalm only “A Song of Degrees” and goes straight to the first line. What a psalm’s title is worth as evidence is taken up at [[Ps. 3:1]].
    sources: [bd-degrees, lxx-rahlfs, lds-scriptures]

  - ref: 1
    phrase: now may Israel say
    kind: structure
    title: A line the people are called to say
    body: |
      “Now may Israel say” is a summons to the whole people to say the line, and it explains why the line comes twice. A modern translation sets the words off between dashes as an aside, “—let Israel now say—,” in the middle of the sentence. Verse 2 is then the same line again, carried forward.

      The form is not peculiar to this psalm. Another song of degrees opens exactly so: “Many a time have they afflicted me from my youth, may Israel now say: Many a time have they afflicted me from my youth” ([[Ps. 129:1–2]]). The same call comes near the opening of Psalm 118: “Let Israel now say, that his mercy endureth for ever” ([[Ps. 118:2]]).

      The point of the form is in the word “Israel.” The deliverance is not told as one man’s story. The people are called to say for themselves, as “us,” what would have become of them without the LORD.
    sources: [lds-scriptures, nrsvue]

  - ref: 3
    phrase: swallowed us up quick
    kind: words
    title: “Quick” means alive
    body: |
      “Quick” here is the old word for “alive,” not “fast.” Its first sense in older English was “alive; living; opposed to dead,” a sense already obsolete in ordinary speech two centuries ago, and a modern translation has “they would have swallowed us up alive.” The same word is in the phrase “the quick and the dead.”

      Being swallowed alive is a picture the Old Testament uses elsewhere. The ground did it to Korah’s company, when the earth was to “open her mouth, and swallow them up” so that “they go down quick into the pit” ([[Num. 16:30]]). The violent men of Proverbs plan it for their victim: “Let us swallow them up alive as the grave” ([[Prov. 1:12]]). In those places the swallower is the earth or the grave. Here “they” are the “men” of verse 2, and verse 6 gives them teeth.
    sources: [webster-1828, nrsvue, lds-scriptures]

  - ref: 5
    phrase: the proud waters
    kind: symbol
    title: An army pictured as a flood, and why the waters are proud
    body: |
      The flood of verses 4–5 is a picture of the enemy. Isaiah draws an invading army the same way. He warns Judah that “the Lord bringeth up upon them the waters of the river, strong and many, even the king of Assyria,” which “shall overflow and go over” until it reaches “even to the neck” ([[Isa. 8:7–8]]; see the note on [[Isa. 8:7]]). One older reading sets the psalm’s stream beside that passage.

      “Proud” belongs to the same picture. The Hebrew adjective means “insolent, raging,” and is used only as a figure. The King James takes the first sense and a modern translation the second: “the raging waters.” With “proud,” the psalm is also joined to the one before it, which ended with Israel’s soul “filled… with the contempt of the proud” ([[Ps. 123:4]]). The Hebrew word there is a different one of like meaning, and the same older reading sees the two psalms meeting in the pair.
    sources: [lds-scriptures, bdb, nrsvue, delitzsch-psalms]

  - ref: 7
    phrase: the snare is broken, and we are escaped
    kind: symbol
    title: The bird does not break the snare
    body: |
      The third picture of danger is a trap, and the psalm says that the snare “is broken,” not that the bird broke it. The verses on either side say whose doing the escape was: verse 6 blesses the LORD, “who hath not given us as a prey,” and verse 8 says where Israel’s help is. “Our soul” is the psalm’s way of saying “we,” as a modern translation has it: “We have escaped like a bird.”

      The snare adds something to the pictures before it. One older reading takes the teeth of verse 6 as the enemies’ bloodthirstiness and the fowlers of verse 7 as their “cunning.” Another psalm makes the same rescue a promise: “Surely he shall deliver thee from the snare of the fowler” ([[Ps. 91:3]]).
    sources: [lds-scriptures, nrsvue, delitzsch-psalms]

  - ref: 8
    phrase: who made heaven and earth
    kind: scripture
    title: The pilgrims’ confession of the Maker of heaven and earth
    body: |
      The psalm’s last line is a confession the songs of degrees keep returning to. It has already been said by a single traveler: “My help cometh from the LORD, which made heaven and earth” ([[Ps. 121:2]]). It is said once more in the last line of the last of the fifteen: “The LORD that made heaven and earth bless thee out of Zion” ([[Ps. 134:3]]). Here the “my” has become “our.”

      The closing words answer the psalm’s own beginning. What rose against Israel in verse 2 was “men,” and the psalm has spent five verses on how strong they were. The last verse sets against them the One who made heaven and earth.
    sources: [lds-scriptures, bd-degrees]

christ: |
  The LORD who was on Israel’s side is the Savior: “LORD” in the Old Testament usually stands for the name Jehovah, and Jehovah is Jesus Christ before His birth ([[Ps. 110:1]] has the note).

  The psalm’s help is “the LORD, who made heaven and earth,” and the angel who spoke to King Benjamin gives that title to Him by name: “he shall be called Jesus Christ, the Son of God, the Father of heaven and earth, the Creator of all things from the beginning” ([[Mosiah 3:8]]).

explore: |
  - **The same call to Israel.** [[Ps. 129:1–2]], another rescue told with “may Israel now say.”
  - **“Unless the LORD had been my help.”** [[Ps. 94:17]], one person’s form of this psalm’s first line; and Jacob’s to Laban, “Except the God of my father… had been with me” ([[Gen. 31:42]]).

parallels:
  - ref: Ps. 121:2
    note: “My help cometh from the LORD, which made heaven and earth,” the confession of verse 8 in one traveler’s mouth.
  - ref: Ps. 129:1
    note: Another song of degrees that opens with a line, “may Israel now say,” and the line again.
  - ref: Isa. 8:7
    note: The king of Assyria and his army as a river in flood.
  - ref: Ps. 91:3
    note: “He shall deliver thee from the snare of the fowler.”

sources: [lds-scriptures, bd-degrees, gs-jehovah, lxx-rahlfs, nrsvue, webster-1828, bdb, delitzsch-psalms]
