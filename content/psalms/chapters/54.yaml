chapter: 54
title: Save Me by Thy Name
tagline: Betrayed to the king by men of his own tribe, a hunted man asks God for a verdict, declares that God is his helper, and promises a sacrifice of his own free will.
when: 'By its title, David’s, when the Ziphites told Saul where he was hiding'

setting: |
  Psalm 54 stands in Book Two of the Psalms. Its title ascribes it to David and calls it a Maschil, as the two psalms before it are, and it places the prayer in the years when Saul hunted him.

  The occasion is told in 1 Samuel. David was hiding “in the wilderness of Ziph in a wood” ([[1 Sam. 23:15]]) when the people of the place went to Saul at Gibeah and offered to hand him over. The title’s wording is “word for word” that of the narrative, which tells of the Ziphites informing on David twice ([[1 Sam. 23:19]]; [[1 Sam. 26:1]]). The note on the title follows the first telling to its end.

  The psalm is seven verses long, and it has the parts of a lament in small: a plea, a complaint, a statement of trust, and a vow of praise (for the form, see the first note on [[Ps. 22:1]]).

  As in most of Book Two, the speaker says “God” far more than “the LORD” (see [[Ps. 42:1]]). The Hebrew has *Elohim* four times, in verses 1 to 4, the title “the Lord” once, in verse 4, and the divine name once only, in verse 6, where the speaker praises it.

thread: |
  The psalm turns once, at the Selah that ends verse 3. **Before it the speaker asks; after it he is sure.**

  The first half is three requests and a reason. Save me, judge me, hear me; “For” strangers have risen against him, violent men want his life, and God does not come into their reckoning (verses 1–3). It “prays for help and answer.”

  Verse 4 begins “Behold,” which a modern translation gives as “But surely.” Nothing has been reported between the two verses. The enemies are still there in verse 5. What has changed is the speaker, who now talks “in the certainty of being heard.” He says what God is to him, a helper and the one who holds up his life, and what God will do. Halfway through verse 5 he stops talking about God and speaks to Him again: “cut them off in thy truth.”

  Then comes the vow (verses 6–7): a sacrifice freely given and thanks to the name, “For he hath delivered me out of all trouble.” The deliverance is in the past tense while the danger is still present. One reading takes these past tenses as the ground of the thanksgiving he has just promised: “What David now still hopes for will then lie behind him in the past.”

  The psalm begins with the name of God and ends with it. He asks to be saved “by thy name” in verse 1 and promises to praise “thy name, O LORD” in verse 6 (see the first note on verse 1).

sections:
  - range: 1-3
    heading: Save me, judge me, hear me
    plain: |
      God, save me by Your name, and by Your might vindicate me. God, hear my prayer; listen to the words of my mouth. For strangers have risen against me, and ruthless men are seeking my life. They have not set God before them.
  - range: 4-5
    heading: God is my helper
    plain: |
      See, God is my helper; the Lord is the one who upholds my life. He will turn the evil back on those who watch for me. In Your faithfulness, put an end to them.
  - range: 6-7
    heading: A sacrifice and thanks to the name
    plain: |
      Of my own free will I will sacrifice to You. I will give thanks to Your name, LORD, for it is good. For He has delivered me out of every trouble, and my eye has looked on my enemies.

notes:
  - ref: 0
    phrase: when the Ziphims came and said to Saul
    kind: history
    title: The Ziphites tell Saul where David is
    body: |
      The title sets the psalm at the moment David was betrayed by the people among whom he was hiding. Ziph is listed among the towns of Judah ([[Josh. 15:55]]), and David had taken refuge in the wilderness near it, where “Saul sought him every day, but God delivered him not into his hand” ([[1 Sam. 23:14]]).

      Then the Ziphites went up to Saul at Gibeah with the question the title quotes: “Doth not David hide himself with us in strong holds in the wood, in the hill of Hachilah, which is on the south of Jeshimon?” ([[1 Sam. 23:19]]). They offered more than information: “our part shall be to deliver him into the king’s hand” ([[1 Sam. 23:20]]). Saul blessed them and sent them back to learn “all the lurking places where he hideth himself” ([[1 Sam. 23:23]]).

      The hunt nearly succeeded. In the wilderness of Maon the two companies were on opposite sides of one mountain, “for Saul and his men compassed David and his men round about to take them” ([[1 Sam. 23:26]]). At that point a messenger reached Saul with word that the Philistines had invaded, and he broke off the pursuit ([[1 Sam. 23:27–28]]).

      The Ziphites inform on David a second time, in almost the same words ([[1 Sam. 26:1]]), and the title does not say which occasion it means.

      The title’s other terms are explained where each first appears: the chief Musician under the title of Psalm 8 ([[Ps. 8:1]]), Neginoth under that of Psalm 4 ([[Ps. 4:1]]), and Maschil under that of Psalm 32 ([[Ps. 32:1]]). What a title is worth as evidence is discussed under the title of Psalm 3 ([[Ps. 3:1]]).
    sources: [lds-scriptures]
  - ref: 1
    phrase: by thy name
    kind: words
    title: Saved by a name
    body: |
      To be saved by God’s name is, on one older reading, to be saved by what God is. “The Name of God is the manifestation of His nature,” and the parallel half of the line names one part of that nature: the strength by which he asks to be judged is “the all-conquering might of God, which is only one side of the divine Name.”

      The psalm returns to the name at its end, and there it speaks it. Verse 1 addresses “God” and asks to be saved “by thy name.” Verse 6 promises, “I will praise thy name, O LORD; for it is good,” and that is the one place in the psalm where the Hebrew has the divine name itself.

      The same reading carries the name into the last verse. The King James begins verse 7 “For he hath delivered me,” and the one who delivers, on that reading, “is the Name of God.”

      The psalm two before this one closes in nearly the same way: “I will wait on thy name; for it is good before thy saints” ([[Ps. 52:9]]).
    sources: [delitzsch-psalms, oshb-wlc, lds-scriptures]
  - ref: 1
    phrase: judge me
    kind: words
    title: Judge me means vindicate me
    body: |
      “Judge me” is a request for a verdict in his favor. He is not asking to be examined. The Hebrew verb is to judge, and its senses include to “plead the cause” of someone and to “execute judgment, vindicate, in battle against enemies.” This line is placed under the last of these, as “in thy might judge me (vindicate me),” and a modern translation prints it “vindicate me by your might.”

      So the two halves of verse 1 ask for one thing.
    sources: [bdb, nrsvue]
  - ref: 3
    phrase: strangers
    kind: words
    title: Why men of Judah are called strangers
    body: |
      Ziph was a town of Judah ([[Josh. 15:55]]), so the people the title names were David’s own tribesmen, yet the word translated “strangers” usually means foreigners. The Hebrew is *zarim*, “foreigners (as such usually enemies),” and the word beside it, “oppressors,” is used “in bad sense of formidable adversaries.”

      One reading keeps the title and the word together. The word can mean an outsider of other kinds (someone “of another household,” or one who is not a priest), and the Ziphites, “although Judaeans like David,” could be called strangers “because they had taken the side against David.” The same reading takes the verse’s last line as the charge against them. To hand a fugitive to the king “might have been their duty as subjects”; here “it was godlessness,” because “they have not set God before them.”

      Another psalm has this verse almost word for word: “O God, the proud are risen against me, and the assemblies of violent men have sought after my soul; and have not set thee before them” ([[Ps. 86:14]]). Where this psalm has *zarim*, that one has *zedim*, “the proud,” a word that differs from it by one letter. A modern translation prints “the insolent” in Psalm 54 as well. The Hebrew text as it stands says strangers.
    sources: [bdb, oshb-wlc, delitzsch-psalms, nrsvue, lds-scriptures]
  - ref: 4
    phrase: the Lord is with them that uphold my soul
    kind: words
    title: The Lord as the one who upholds his life
    body: |
      The second half of verse 4 calls the Lord the upholder of the speaker’s life, though the King James wording can sound as if He were one supporter among several. The Hebrew is literally “of those who uphold” or “with those who uphold.” The ancient Greek translation has the singular, “the Lord is the helper of my soul,” and a modern translation follows it and other ancient versions: “the Lord is the upholder of my life.”

      Read so, the line repeats its first half, as Hebrew verse does ([[Ps. 1:1]]): God is my helper, the Lord holds me up.

      Two smaller points. “The Lord” here is the title *Adonai*, not the divine name (on the difference, see [[Ps. 110:1]]). And “my soul” is the same Hebrew word in verses 3 and 4, where a modern translation has “life”: the men of verse 3 seek his life, and the Lord of verse 4 sustains it.
    sources: [nrsvue, lxx-rahlfs, oshb-wlc]
  - ref: 5
    phrase: cut them off in thy truth
    kind: words
    title: A prayer against those who watch him
    body: |
      The request is made to God, and the speaker says nothing of acting himself: “He shall reward evil,” and then, turning to address Him, “cut them off.” How prayers of this kind are read, and how the Savior’s command to love enemies stands above them, is the note at [[Ps. 137:8]].

      Two words are particular to this psalm. “In thy truth” appeals to God’s reliability. The Hebrew word covers “firmness, faithfulness, truth,” this verse is listed with the passages where it is “an attribute of God,” and a modern translation has “In your faithfulness.”

      And “mine enemies” in this verse is not the ordinary word for an enemy, which comes in verse 7. It is a word glossed “(insidious) watcher.”
    sources: [bdb, nrsvue, oshb-wlc]
  - ref: 6
    phrase: I will freely sacrifice unto thee
    kind: history
    title: A sacrifice given freely
    body: |
      “Freely” translates the Hebrew word that also names a kind of sacrifice, the freewill offering. Here the word has been taken as the manner of the gift, “voluntarily,” which is how the King James and the ancient Greek (“I will willingly sacrifice to thee”) read it. A modern translation takes it as the offering itself: “With a freewill offering I will sacrifice to you.”

      The two readings come to much the same thing, because the offering was named for its freedom. The law sets it beside the sacrifice that pays a vow and keeps the two apart: a man brings a peace offering “to accomplish his vow, or a freewill offering in beeves or sheep” ([[Lev. 22:21]]). The one discharges a promise already made; the other is brought of the giver’s own will.

      So what this verse promises is given of his own will, with the reason attached: the name of the LORD “is good.”
    sources: [bdb, lxx-rahlfs, nrsvue, lds-scriptures]
  - ref: 7
    phrase: mine eye hath seen his desire upon mine enemies
    kind: words
    title: The Hebrew has no word for desire
    body: |
      The Hebrew of the last line is three words (on my enemies, has looked, my eye), and “his desire” is the translators’ supply. The ancient Greek supplied something similar but made the desire the speaker’s: “mine eye has seen my desire upon mine enemies.” A modern translation has “my eye has looked in triumph on my enemies.”

      What kind of look is meant has to come from the verb. With the preposition used here it means to “look at with interest,” and its uses are sorted by the feeling in the look: kindness, anger, grief, apprehension, joy. This verse is placed with looking “with joy, pleasure.” The next group, looking “with exultation, triumph,” to “feast eyes upon, sometimes gloat over (fallen enemies),” has the similar line of [[Ps. 118:7]] and does not list this one.

      On that sorting the look that ends the psalm is one of joy, where the modern translation hears triumph. The line itself says nothing of what became of the enemies.
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, bdb]

christ: |
  The name by which the speaker asks to be saved, and which he promises to praise, is spoken in verse 6: “O LORD,” the divine name, Jehovah. “Jehovah is the premortal Jesus Christ.”

  What the psalm says of Him is what its speaker says: that His name saves and is good, that He is a helper and the one who upholds a threatened life, and that He is faithful.

explore: |
  - **The story behind the title.** Read [[1 Sam. 23:14–29]], and then [[1 Sam. 26:1–25]], where the Ziphites inform again and David spares Saul’s life.
  - **The psalm of the other informer.** Psalm 52 is set by its title when Doeg the Edomite told Saul that David had come to the house of Ahimelech ([[Ps. 52:1]]).

parallels:
  - ref: 1 Sam. 23:19–28
    note: The Ziphites offer to deliver David to Saul, and Saul is called away when he has David surrounded.
  - ref: 1 Sam. 26:1
    note: The Ziphites inform on David a second time, in nearly the title’s words.
  - ref: Ps. 86:14
    note: Verse 3 almost word for word, with “the proud” where this psalm has “strangers.”
  - ref: Ps. 118:7
    note: The LORD among the speaker’s helpers, and the look upon those who hate him.
  - ref: Ps. 52:9
    note: A neighboring psalm that also closes on the name that is good.

