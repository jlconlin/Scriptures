chapter: 26
title: Judge Me, O LORD
tagline: A man asks the LORD to examine him, says which company he has refused and which house he loves, and ends standing on level ground among those who bless the LORD.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  Psalm 26 stands in Book One of the Psalms, in a run of seven psalms, 25–31, “notable for their focus on themes of covenant and temple.” Its title ascribes it to David and names no occasion. By form it has been classed with its neighbours as the lament of one person: the speaker asks to be judged, says how he has lived, and asks not to share the end of the wicked. These seven psalms have also been set beside Nephi’s psalm ([[2 Ne. 4:16–35]]); see the note on verse 12.

  Psalm 26 is bound to Psalm 25 “by similarity of thought and expression,” but it has no confession of sin, and Psalm 25 makes one three times ([[Ps. 25:7]]); the note on verse 11 takes that up.

  It “is often considered to be related to the temple entry psalms,” Psalms 15 and 24, which ask who may go up to the LORD’s house; the note on verse 2 takes up that reading. An older reading sets the psalm in Absalom’s revolt, when David left Jerusalem and sent the ark back, saying that if he found favour the LORD would “bring me again, and shew me both it, and his habitation” ([[2 Sam. 15:25]]). The psalm itself tells no story and names no place but the house it loves.

thread: |
  Psalm 26 begins and ends on the same two things, a walk and a footing. “I have walked in mine integrity … I shall not slide” (verse 1); “I will walk in mine integrity … My foot standeth in an even place” (verses 11–12). **Between those lines a man asks to be judged and says which company he belongs to.**

  The first word is the request: “Judge me.” He asks the LORD to examine his reins and heart (verse 2), and gives as his ground the LORD’s lovingkindness, which he keeps before his eyes (verse 3; the word is *hesed*, explained at [[Ps. 51:1]]).

  Then he sorts his life by where he is to be found. There is a company he has not sat with and will not, “the congregation of evil doers” (verses 4–5). There is a place he loves, the altar and the house where the LORD’s glory dwells (verses 6–8).

  Only in verse 9 does the request of verse 1 come out in full: “Gather not my soul with sinners.” Having kept apart from them, he asks not to be taken away with them.

  The turn is at verse 11, “But as for me.” The claim of integrity returns, and two requests stand beside it: “redeem me, and be merciful unto me.” The man who asks to be judged also asks for ransom and grace. The last verse asks for nothing. On one reading, “The prayer is changed into rejoicing which is certain of the answer.” His foot stands on level ground, and the man who would not sit in one congregation blesses the LORD in another.

sections:
  - range: 1-3
    heading: Judge me, and examine me
    plain: |
      Vindicate me, LORD, for I have walked in my integrity, and I have trusted in the LORD, so I shall not slip. Examine me, LORD, and test me; refine my inmost feelings and my heart. For Your steadfast love is before my eyes, and I have walked in Your truth.
  - range: 4-5
    heading: The company he has refused
    plain: |
      I have not sat with worthless men, and I will not go about with those who hide what they are. I have hated the assembly of evildoers, and I will not sit with the wicked.
  - range: 6-8
    heading: The altar and the house
    plain: |
      I will wash my hands in innocence and go around Your altar, LORD, to raise a voice of thanksgiving and to tell of all Your wonderful works. LORD, I have loved the house where You live, the place where Your glory dwells.
  - range: 9-10
    heading: Not with them
    plain: |
      Do not take my soul away with sinners, or my life with men of blood, whose hands hold wicked schemes and whose right hand is full of bribes.
  - range: 11-12
    heading: On level ground
    plain: |
      But as for me, I will walk in my integrity. Ransom me, and be gracious to me. My foot stands on level ground; in the assemblies I will bless the LORD.

notes:
  - ref: 1
    phrase: Judge me, O LORD
    kind: words
    title: To be judged is to be vindicated
    body: |
      “Judge me” asks for a verdict in the speaker’s favour: the verb here has the sense of “vindicating,” and a modern translation has “Vindicate me, O Lord.” Judgment is what he wants, not what he fears.

      Other psalms make the same request in the same word. One begins, “Judge me, O God, and plead my cause against an ungodly nation” ([[Ps. 43:1]]). In another David says, “judge me, O LORD, according to my righteousness, and according to mine integrity that is in me” ([[Ps. 7:8]]).
    sources: [bdb, nrsvue]
  - ref: 1
    phrase: I have walked in mine integrity
    kind: words
    title: Integrity is wholeness of heart
    body: |
      “Integrity” translates a Hebrew noun, *tom*, that means “completeness, integrity”: the wholeness of heart with which a thing is done. Abimelech uses the same noun. He had taken Sarah without knowing she was Abraham’s wife, and he pleads, “in the integrity of my heart and innocency of my hands have I done this” ([[Gen. 20:5]]). God grants the plea, “Yea, I know that thou didst this in the integrity of thy heart,” and adds that He had kept Abimelech from sinning ([[Gen. 20:6]]). Both of Abimelech’s nouns are in this psalm: integrity here, and innocency of hands in verse 6.

      On one older reading the word means “perfect freedom from all sinful intent,” and the speaker “does not self-righteously hold himself to be morally perfect” but “appeals only to the fundamental tendency of his inmost nature.” When the claim returns it has a plea beside it: “I will walk in mine integrity: redeem me, and be merciful unto me” (verse 11).

      A closely related word is “uprightly” in [[Ps. 15:2]], where it is explained.
    sources: [bdb, oshb-wlc, delitzsch-psalms]
  - ref: 2
    phrase: Examine me, O LORD, and prove me
    kind: history
    title: A worshipper asking to be examined
    body: |
      The speaker asks for the examination that Psalms 15 and 24 put as a question. Those psalms ask who may come to the LORD’s house: “Who shall ascend into the hill of the LORD? or who shall stand in his holy place?” ([[Ps. 24:3]]). On one reading Psalm 26 “apparently presents an individual’s answer to the temple guardians,” who were likely priests. In verses 1–5 he declares “his innocence and compliance with temple entry requirements,” and he wants to be “found worthy to enter the temple.” The psalm describes no gate and no questioner, so this is a reconstruction; the question at the gate is discussed at [[Ps. 24:3]].

      He asks with three verbs. The third is a metalworker’s verb, to “smelt, refine, test,” and the ancient Greek translation renders it “purify as with fire my reins and my heart.” “Reins” are the kidneys (explained at [[Jer. 11:20]]), and the pair amounts to a request to “test my heart and my mind.”
    sources: [ot-minute-psalm-26, bdb, lxx-rahlfs]
  - ref: 4
    phrase: dissemblers
    kind: words
    title: Vain persons and dissemblers
    body: |
      The verse names two kinds of people, the hollow and the hidden. “Vain persons” are “worthless men” in the Hebrew. “Dissemblers” translates a word for “those who conceal themselves, i.e. their thoughts.” In older English a dissembler is “a hypocrite; one who conceals his opinions or dispositions under a false appearance,” and a modern translation has “hypocrites.”
    sources: [bdb, webster-1828, nrsvue]
  - ref: 5
    phrase: the congregation of evil doers
    kind: words
    title: Two words for congregation
    body: |
      The “congregation” of this verse and the “congregations” of the last verse are two different Hebrew words. The one here is an assembly, in this verse one gathered “for evil counsel.” The one in verse 12, “in the congregations will I bless the LORD,” means an “assembly, for worship,” and in the plural “possibly choirs.” That second word comes only twice in the Psalms, in verse 12 and at [[Ps. 68:26]].

      The speaker says he has hated the first. For the LORD’s own hatred of iniquity, see the note on [[Ps. 5:5]].
    sources: [bdb, oshb-wlc]
  - ref: 6
    phrase: 'I will wash mine hands in innocency: so will I compass thine altar'
    kind: symbol
    title: Washed hands and a walk around the altar
    body: |
      Washing the hands declared them innocent, and it was also what a priest did before he came near the altar. Aaron and his sons were to wash at the laver “when they come near to the altar to minister” ([[Ex. 30:20]]). In the law of the unsolved killing, the elders of the nearest city wash their hands and say, “Our hands have not shed this blood” ([[Deut. 21:7]]). Pilate’s washing before the multitude is the same symbolic act ([[Matt. 27:24]]).

      Readers differ on whether the speaker describes a rite or borrows its language. On one reading, once admitted through the gates, he “goes on to perform a washing ritual before approaching the altar of the temple.” On an older reading the washing “is in this instance only a rhetorical figure made use of to confess his consciousness of innocence,” shaped by “the idea of the priest washing his hands preparatory to the service of the altar.” Psalm 73 has the identical phrase beside a cleansed heart: “Verily I have cleansed my heart in vain, and washed my hands in innocency” ([[Ps. 73:13]]).

      To “compass” the altar is to “march or go about” it, here “in solemn procession,” and verse 7 says what the procession is for: thanksgiving, and the telling of the LORD’s works.

      For clean hands as what the hill of the LORD requires, see the note on [[Ps. 24:4]].
    sources: [lds-scriptures, ot-minute-psalm-26, delitzsch-psalms, bdb]
  - ref: 8
    phrase: the place where thine honour dwelleth
    kind: words
    title: The tabernacle of thy glory
    body: |
      What the speaker loves about the house is that the LORD’s glory lives in it. “Honour” is *kavod*, the Hebrew word for glory, and “where … dwelleth” is in Hebrew a noun, *mishkan*, the word for the tabernacle. The ancient Greek translation has “the place of the tabernacle of thy glory.”

      The two words meet on the day Moses finished the tabernacle, when “the glory of the LORD filled the tabernacle” ([[Ex. 40:34]]). Before it was built the LORD had promised that the place where He met Israel would be “sanctified by my glory” ([[Ex. 29:43]]). As the sacred tent was “sanctified by the Glory,” so in this verse the house of the psalmist’s day is the place where that glory has its dwelling.

      The next psalm puts the same love as a single wish: “that I may dwell in the house of the LORD all the days of my life” ([[Ps. 27:4]]). The two psalms have been described together as discussing “the Psalmist’s love for the temple.”
    sources: [oshb-wlc, lxx-rahlfs, bdb, alford-baker-psalm-nephi]
  - ref: 9
    phrase: Gather not my soul with sinners
    kind: words
    title: Gathered up with sinners
    body: |
      “Gather” here means to “gather and take away, remove, withdraw”: the speaker asks that his soul not be taken away with sinners. The ancient Greek translation has “Destroy not my soul together with the ungodly,” and a modern translation, “Do not sweep me away with sinners.”
    sources: [bdb, lxx-rahlfs, nrsvue]
  - ref: 11
    phrase: redeem me, and be merciful unto me
    kind: words
    title: A man of integrity asks for ransom and grace
    body: |
      The speaker who walks in integrity asks in the same verse to be ransomed and shown favour. “Redeem” is a verb meaning to “ransom,” and a modern translation gives the second request as “be gracious to me.”

      The same pleas are in the psalm before this one and help bind the two together: “Redeem Israel, O God, out of all his troubles” ([[Ps. 25:22]]), and “have mercy upon me; for I am desolate and afflicted” ([[Ps. 25:16]]). Psalm 25 asks for them while confessing sin. Psalm 26 confesses none, and asks for them all the same.
    sources: [bdb, nrsvue, delitzsch-psalms]
  - ref: 12
    phrase: My foot standeth in an even place
    kind: scripture
    title: Level ground, and Nephi’s plain road
    body: |
      The psalm that opened with “I shall not slide” closes with a foot on level ground. “Slide” is a verb used of feet that “slip,” and the “even place” is a “level place (free from obstacles), figurative for place of safety, comfort, and prosperity.” The next psalm asks to be led there, with the same Hebrew noun: “lead me in a plain path” ([[Ps. 27:11]]).

      Nephi’s psalm has been set beside this line. He prays, “that I may walk in the path of the low valley, that I may be strict in the plain road” ([[2 Ne. 4:32]]). His question “O Lord, wilt thou redeem my soul?” ([[2 Ne. 4:31]]) has likewise been compared with verse 11 of this psalm. The authors of the comparison suggest only that Psalms 25–31 “may have had a particular influence” on Nephi as he wrote; their words are quoted at [[Ps. 25:17]].
    sources: [bdb, oshb-wlc, alford-baker-psalm-nephi]

christ: |
  The psalm is addressed throughout to the LORD, who is Jehovah, the premortal Jesus Christ. He is asked here to do two things: to judge, trying the reins and the heart, and to redeem.

  The Savior said that the Father “hath committed all judgment unto the Son” ([[John 5:22]]). In Revelation the Son of God ([[Rev. 2:18]]) says, “I am he which searcheth the reins and hearts” ([[Rev. 2:23]]; see the note on [[Ps. 7:9]]). It is this Judge whom the speaker asks to redeem him and be merciful to him (verse 11).

explore: |
  - **Who may come in.** [[Ps. 15:1–5]] and [[Ps. 24:3–6]], the two psalms that ask the question this one has been read as answering.
  - **Washed hands, a second time.** [[Ps. 73:13–17]], where the same line is spoken in discouragement until the speaker goes into the sanctuary.
  - **The house he loves.** [[Ps. 27:4–6]] and [[Ps. 84:1–4]].

parallels:
  - ref: Ps. 24:3–4
    note: The question of who may ascend the hill of the LORD, answered with clean hands and a pure heart (also Ps. 15:1–2).
  - ref: Ps. 7:8
    note: David asks to be judged according to his integrity (also Ps. 43:1).
  - ref: Gen. 20:5–6
    note: Abimelech pleads integrity of heart and innocency of hands, and God grants it.
  - ref: Ps. 73:13
    note: The same phrase, hands washed in innocency.
  - ref: Ps. 28:3
    note: The request not to be drawn away with the wicked.
  - ref: 2 Ne. 4:31–33
    note: Nephi asks to be redeemed and to walk in the plain road.

