chapter: 36
title: The Fountain of Life
tagline: A man with no dread of God is set beside a God whose lovingkindness fills the heavens, and the psalmist asks to be kept where the fountain is.
when: 'Undated; a psalm of David by its title'

setting: |
  The title ascribes the psalm to David and names no occasion (see the note on the title).

  Nothing in the psalm points to an event. One older commentary groups it with Psalms 12, 14 and 37 as psalms in which David “complains of the moral corruption of his generation,” reflections “of the character of the time, not of particular occurrences.” The wicked man of the first four verses has no name. He is one man in verse 1, and by verse 11 the Hebrew speaks of the wicked in the plural.

  The psalm has three parts that differ in kind: a portrait of that man (verses 1–4), a hymn to the LORD (verses 5–9), and a prayer (verses 10–12). Complaint comes first, then praise, and only at the end does the speaker ask for anything.

  The hymn comes to rest in the sanctuary, where those who trust God are fed from “the fatness of thy house” (verse 8).

  Paul quotes verse 1 in [[Rom. 3:18]], as the last of the scriptures he gathers to show the whole world under sin.

thread: |
  Psalm 36 sets two portraits side by side and then asks to be kept with the second. **The turn is at verse 5, and it comes with no word of transition.** There is no “but” and no “yet.” After four verses on a man, the psalm says “Thy mercy, O LORD,” and for five verses it does not look at him again.

  The first portrait is small. Everything in verses 1–4 happens inside one person: the voice of transgression, flattery in his own eyes, words in his mouth, plans on his bed. God is mentioned once, as something he does not dread.

  The second is as wide as creation: the heavens, the clouds, the mountains, the great deep, man and beast (verses 5–6). Then it narrows, to one house where the children of men are sheltered, fed and given drink (verses 7–8), and to one source: “with thee is the fountain of life” (verse 9). The first portrait twice named the wicked man’s eyes (verses 1–2). The hymn ends with what “we” see, and by whose light.

  The prayer asks for the hymn to go on. The word for “mercy” in verse 5 and the word for “righteousness” in verse 6 both return in verse 10, where the speaker asks that they continue. Only then does he ask anything for himself (verse 11), and only then do the wicked come back into view. The last verse sees them already fallen, in the past tense, and the psalm does not say what happened between the asking and the seeing (see the note on verse 12).

sections:
  - range: 1-4
    heading: The man with no dread of God
    plain: |
      Transgression speaks to the wicked man deep in his heart (the King James has “my heart”); there is no dread of God before his eyes. He flatters himself in his own eyes until his iniquity is found out and hated. The words of his mouth are harm and deceit; he has stopped acting wisely and doing good. He plans harm on his bed, he takes his stand on a road that is not good, and he does not reject evil.
  - range: 5-9
    heading: Lovingkindness as high as the heavens
    plain: |
      LORD, Your lovingkindness is in the heavens, and Your faithfulness reaches to the clouds. Your righteousness is like the mighty mountains; Your judgments are a great deep. LORD, You save man and beast. How precious Your lovingkindness is, O God! The children of men take refuge in the shadow of Your wings. They are filled from the rich fare of Your house, and You give them drink from the river of Your delights. For the fountain of life is with You; in Your light we see light.
  - range: 10-12
    heading: Continue it, and keep me
    plain: |
      Continue Your lovingkindness to those who know You, and Your righteousness to the upright in heart. Do not let the foot of the proud tread on me, or the hand of the wicked drive me away. There the workers of iniquity have fallen; they are thrown down and cannot rise.

notes:
  - ref: 0
    phrase: the servant of the LORD
    kind: history
    title: David the servant of the LORD
    body: |
      Only two psalm titles add “the servant of the LORD” to David’s name, this one and the title of Psalm 18.

      Scripture gives the same name to Moses at his death, “So Moses the servant of the LORD died there in the land of Moab” ([[Deut. 34:5]]), and to Joshua at his ([[Josh. 24:29]]). Of David the LORD Himself used the word when He sent Nathan: “Go and tell my servant David” ([[2 Sam. 7:5]]). The title of Psalm 18 has a note on the phrase as well ([[Ps. 18:1]]).

      The chief Musician is explained under the title of Psalm 8 ([[Ps. 8:1]]).
    sources: [lds-scriptures]
  - ref: 1
    phrase: saith within my heart
    kind: words
    title: Transgression speaks an oracle
    body: |
      The verse opens with the word that scripture uses for a prophet’s utterance, and gives it to sin. The Hebrew noun behind “saith” is the one for the “utterance, declaration, revelation” of a prophet, and here it is “transgression personified, speaking with prophetic voice.”

      Whose heart it speaks in is the harder question. The Hebrew text as printed has “my heart,” and the King James follows it: David perceives in his own heart what transgression says to the wicked. The ancient Greek translation has “his”: “The transgressor, that he may sin, says within himself.” “His heart” has been adopted as the reading of the Hebrew too, and a modern translation has transgression speak to the wicked “deep in their hearts.”

      With “his heart” the voice speaks inside the wicked man. With “my heart” the psalmist is reporting what he has understood about that man.
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue]
  - ref: 1
    phrase: there is no fear of God before his eyes
    kind: scripture
    title: Dread, and Paul’s last quotation
    body: |
      The fear this man lacks is dread, and the Hebrew word is not the usual one for reverence. Here it means an “object of dread”: God is nothing he is afraid of. The more familiar phrase, the “fear of God” that means “reverence, piety,” uses a different noun.

      Paul ends a chain of quotations in Romans 3 with this line: “There is no fear of God before their eyes” ([[Rom. 3:18]]). The psalm’s “his” is “their” in Paul, who is speaking of everyone: “we have before proved both Jews and Gentiles, that they are all under sin” ([[Rom. 3:9]]). The chain, and what Paul does with the psalms’ pictures of the wicked, is discussed in the note on [[Ps. 5:9]].
    sources: [oshb-wlc, bdb, lds-scriptures]
  - ref: 2
    phrase: until his iniquity be found to be hateful
    kind: words
    title: A hard line about self-flattery
    body: |
      The second half of verse 2 is obscure in Hebrew, and the translations go three ways. The first half is clear enough. The verb is to “deal smoothly,” and it is done “in his own eyes.”

      The King James takes the rest as a limit of time: he flatters himself until his iniquity is found out and seen for what it is. A modern translation takes it as what the flattery tells him, “that their iniquity cannot be found out and hated.” The ancient Greek translation reads, “For he has dealt craftily before him, to discover his iniquity and hate it.”
    sources: [bdb, nrsvue, lxx-rahlfs]
  - ref: 5
    phrase: Thy mercy
    kind: words
    title: One word behind mercy and lovingkindness
    body: |
      “Mercy” in this verse and “lovingkindness” in verses 7 and 10 are one Hebrew word, *hesed*, so the psalm names it three times. A modern translation uses a single phrase for all three, “steadfast love.” The word itself is explained in the note on [[Ps. 51:1]].

      The hymn opens with *hesed* (verse 5) and exclaims over it (verse 7), and the prayer asks that it continue (verse 10).
    sources: [oshb-wlc, nrsvue]
  - ref: 6
    phrase: like the great mountains
    kind: symbol
    title: Mountains of God and the great deep
    body: |
      The verse measures God’s justice by the highest and the lowest things in creation. The “great mountains” are in Hebrew “mountains of El,” and the ancient Greek translation keeps them so: “the mountains of God.” The divine name is used here “as characterizing mighty things in nature,” which gives “mighty mountains.”

      The “great deep” is the “deep, of subterranean waters,” and the two Hebrew words are the same two as in the story of the Flood, when “were all the fountains of the great deep broken up” ([[Gen. 7:11]]).

      One older reading says what each image is for. The righteousness is like the mountains because it is “unchangeably firm,” and the judgments are a great deep because they are “incomprehensible and unsearchable.” The same reading recalls the Flood at the last line of the verse, where God’s compassion, “as in the case of the Flood,” takes in the animals along with humankind. The verb the King James renders “preservest” is the verb to save, and a modern translation has “you save humans and animals alike.”
    sources: [oshb-wlc, bdb, lxx-rahlfs, delitzsch-psalms, nrsvue, lds-scriptures]
  - ref: 8
    phrase: the river of thy pleasures
    kind: symbol
    title: A feast in God’s house and a river of delights
    body: |
      Verse 8 pictures those who shelter under God’s wings as guests in His house, fed and given drink, and the word for the drink is one that Hebrew probably associated with the name Eden.

      “Fatness” is rich food. The word is used “of food and drink,” and in this verse it passes over “into figurative of spiritual blessing.” One older reading sees behind it “the abundant fare of the priests” from the LORD’s table and “the festive joy of the guests” at the communion offering, “here treated according to their spiritual significance.” Jeremiah uses the same word in a promise: “I will satiate the soul of the priests with fatness” ([[Jer. 31:14]]).

      “Pleasures” is the plural of *eden*, “luxury, dainty, delight,” used in this verse of the “delights of worshipping” the LORD. The name of the garden was “probably associated” in Hebrew with this word. So the same older reading calls the stream “a paradisaic river of delights” and sets it beside the first river in scripture: “And a river went out of Eden to water the garden” ([[Gen. 2:10]]).

      The house is “His sanctuary.” On what house a psalm of David could mean, see the note on [[Ps. 5:7]]; on going up to it, the note on [[Ps. 24:3]]; and on the wings of verse 7, the note on [[Ps. 17:8]].
    sources: [bdb, delitzsch-psalms, oshb-wlc, lds-scriptures]
  - ref: 9
    phrase: the fountain of life
    kind: christ
    title: The LORD is the fountain
    body: |
      The fountain of life is “with thee,” and elsewhere the same word is a figure for the LORD Himself. In Jeremiah He says, “they have forsaken me the fountain of living waters” ([[Jer. 2:13]]). The Hebrew word for fountain is the same there as here.

      The LORD who there calls Himself the fountain of living waters is Jehovah, and “Jehovah is the premortal Jesus Christ.” Living water, in turn, is “a symbol of the Lord Jesus Christ and His teachings.”

      Jeremiah’s second use of the title is discussed in the note on [[Jer. 17:13]].
    sources: [bdb, gs-jehovah, gs-living-water, lds-scriptures]
  - ref: 9
    phrase: in thy light shall we see light
    kind: scripture
    title: Light and life in one verse
    body: |
      Verse 9 puts life and light in one sentence, which few Old Testament verses do, and the same pair is in a title of the Savior. John writes, “In him was life; and the life was the light of men” ([[John 1:4]]). Jesus said, “I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life” ([[John 8:12]]). To the people at Bountiful He joined the two in a title that He uses “only in the Book of Mormon”: “I am the light and the life of the world” ([[3 Ne. 11:11]]).

      In the psalm the light is the LORD’s own, “thy light.” The line has been set beside the psalmist’s words that the LORD made him “exceeding glad with thy countenance” ([[Ps. 21:6]]), in an account of how the psalmist “especially exulted in the opportunity to come into the Lord’s presence.”
    sources: [sc-knowhy-341, skinner-seeing-god, lds-scriptures]
  - ref: 11
    phrase: remove me
    kind: words
    title: Remove means drive into wandering
    body: |
      The Hebrew verb behind “remove” is to “cause to wander aimlessly, as fugitives.” A modern translation has “or the hand of the wicked drive me away,” and for the first half of the verse, “Do not let the foot of the arrogant tread on me.”

      So the speaker prays against two things, being trampled and being driven out.
    sources: [bdb, nrsvue]
  - ref: 12
    phrase: There are the workers of iniquity fallen
    kind: words
    title: A fall seen before it happens
    body: |
      The last verse does not ask for the wicked to fall. It reports the fall as done, and points to it: “There.” The Hebrew verb is in the past tense, although nothing in the psalm has told of any fall.

      One older reading takes the past tenses as prophetic. While he prays, “the future all at once becomes unveiled to him”; being “certain in his own mind that his prayer will be heard,” he sees the adversaries overthrown, and “There” “points to the place where the judgment is executed.” The same word opens the same kind of sentence in another psalm: “There were they in great fear” ([[Ps. 14:5]]).

      A modern translation puts the scene in the present: “There the evildoers lie prostrate.”
    sources: [oshb-wlc, delitzsch-psalms, nrsvue, lds-scriptures]

christ: |
  The hymn of verses 5–9 is addressed to the LORD, who is Jehovah, the premortal Jesus Christ. Its last verse calls Him the fountain of life and the light by which we see. In Jeremiah the LORD names Himself “the fountain of living waters” ([[Jer. 2:13]]), and at Bountiful the risen Savior said, “I am the light and the life of the world” ([[3 Ne. 11:11]]). The notes on verse 9 follow both figures.

explore: |
  - **The same portrait in neighboring psalms.** [[Ps. 12:1–4]], [[Ps. 14:1–3]] and [[Ps. 37:1–11]] have been grouped with this psalm as complaints about the wickedness of a whole generation.
  - **Light and life together.** [[John 1:1–9]] and [[3 Ne. 11:10–11]]; in the Old Testament, [[Prov. 6:23]] and [[Job 33:28]].

parallels:
  - ref: Rom. 3:18
    note: Paul quotes verse 1 as the last link in his chain of scriptures on the world under sin.
  - ref: Jer. 2:13
    note: The LORD calls Himself the fountain of living waters, with the same Hebrew word for fountain.
  - ref: Gen. 2:10
    note: The river that went out of Eden; “pleasures” in verse 8 is the plural of a word that Hebrew probably associated with the name Eden.
  - ref: John 8:12
    note: Jesus is the light of the world, and His followers have the light of life (also John 1:4).
  - ref: 3 Ne. 11:11
    note: The risen Lord calls Himself the light and the life of the world.

sources: [lds-scriptures, oshb-wlc, bdb, lxx-rahlfs, nrsvue, delitzsch-psalms, skinner-seeing-god, sc-knowhy-341, gs-jehovah, gs-living-water]
