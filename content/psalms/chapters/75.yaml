chapter: 75
title: God Is the Judge
tagline: A congregation gives thanks, God answers that He will judge at the time He has set, and the psalm tells the proud that no one is lifted up except by Him.
when: 'Undated; a psalm of Asaph by its title'

setting: |
  The title gives the psalm to Asaph (see [[Ps. 50:1]]). It belongs to the third book of the Psalter (Psalms 73–89), where several psalms present God as a judge who can rebuke wicked rulers.

  No occasion is named, and the psalm names no enemy. It speaks only of “the fools” and “the wicked,” and of the whole earth. One older reading sets it in the years when Assyria threatened Jerusalem, because of the direction the psalm leaves out in verse 6 (see the note there). It is offered only as a probability, about as likely as another proposal that puts the psalm in the time of the Maccabees.

  The psalm before it ends with a plea, “Arise, O God, plead thine own cause” ([[Ps. 74:22]]). In this one God says that He will judge, and the psalm has been read as beholding what Psalm 74 prays for.

  The psalm stands close to an older song. Hannah’s song ([[1 Sam. 2:1–10]]) has been called the only influence that can be seen in the psalm. The note on verse 7 sets the two side by side.

thread: |
  Psalm 75 has three voices, and the turn comes when the second one speaks. A congregation begins: “Unto thee, O God, do we give thanks” (verse 1). Then an “I” speaks who judges the earth and holds up its pillars (verses 2–3): the congregation’s words have given way to God’s, and on the reading followed here He goes on to warn the boasters and the wicked (verses 4–5). In verse 6 God is spoken of again in the third person, and on that reading the congregation has taken the word back (verses 6–8). A single voice then vows praise “for ever” (verse 9).

  **One verb holds the psalm together: to lift up.** The wicked are told not to lift up their horn (verses 4 and 5). The King James’s “promotion” in verse 6 is the same Hebrew verb, used as a noun: lifting up comes from no quarter of the earth. Verse 7 says who does it: God “putteth down one, and setteth up another,” and “setteth up” is the verb again. It returns in the last line, where the horns of the righteous “shall be exalted” (verse 10). So the psalm does not condemn being lifted up. Its quarrel is with those who lift themselves.

  Between the warning and the vow stands the cup (verse 8). It is the judge’s sentence, pictured as wine in the LORD’s hand that the wicked must drain.

  The last verse, with its “will I cut off,” follows the singer’s vow without a break. The note on verse 2 gives one reading of who says it.

sections:
  - range: 1
    heading: The congregation gives thanks
    plain: |
      We thank You, God, we thank You. Your name is near, and people tell of the wonders You have done.
  - range: 2-5
    heading: God speaks
    plain: |
      When the time I have set arrives, I will judge with equity. The earth and everyone who lives on it may melt with fear, but I am the one who keeps its pillars steady. I say to the boasters, Do not boast, and to the wicked, Do not lift up your horn. Do not lift your horn on high, and do not speak with an arrogant neck.
  - range: 6-8
    heading: The judge and His cup
    plain: |
      Lifting up does not come from the east or from the west or from the wilderness (the King James has “the south”). God is the judge. He brings one down and lifts another up. In the LORD’s hand there is a cup of foaming wine, fully mixed. He pours from it, and all the wicked of the earth will drain it, dregs and all.
  - range: 9-10
    heading: Praise for ever, and the horns
    plain: |
      As for me, I will tell of it for ever. I will sing praises to the God of Jacob. All the horns of the wicked I will cut off, but the horns of the righteous will be lifted high.

notes:
  - ref: 0
    phrase: Al-taschith
    kind: words
    title: Do Not Destroy
    body: |
      “Al-taschith” is Hebrew for “Do Not Destroy,” as a modern translation prints it in this title, and the ancient Greek translators also translated the words: “Destroy not.” The words stand in three other titles, those of Psalms 57–59, and what they are is taken up at the first of them, [[Ps. 57:1]]. The title’s other terms are explained where they first appear: “To the chief Musician” at [[Ps. 8:1]] and Asaph at [[Ps. 50:1]].
    sources: [nrsvue, lxx-rahlfs, lds-scriptures]
  - ref: 1
    phrase: for that thy name is near
    kind: words
    title: The name that is near
    body: |
      The Hebrew of this line is abrupt, and the King James smooths it. Word for word it says that God’s name is near and that “they” have told His wonders, with nothing to say who they are and no “for that” to join the halves. A modern translation keeps the three short clauses: “we give thanks; your name is near. People tell of your wondrous deeds.”

      The ancient Greek translation has a different sentence: “we will give thanks, and call upon thy name.” The Hebrew as it stands has been judged “striking, but doubtful,” and the correction proposed for it reads with the Greek, of those who call on the name.

      If the Hebrew is kept, this is one of the lines in which “near” is said “of God.”
    sources: [oshb-wlc, nrsvue, lxx-rahlfs, bdb]
  - ref: 2
    phrase: When I shall receive the congregation
    kind: words
    title: God answers, and names a set time
    body: |
      The “I” of this verse is read as God, and what He takes hold of is a time, not a congregation. The Hebrew noun is *mo‘ed*, which with this verb means an “appointed time.” A modern translation has “At the set time that I appoint, I will judge with equity,” and the ancient Greek translation has “When I shall take a set time.” The same noun is the second word of the Hebrew name for the tabernacle, “tent of meeting.” The King James renders that name “the tabernacle of the congregation” ([[Ex. 29:42]]) and gives the noun the same English word here.

      Nothing in the text marks a change of speaker, but the “I” who will judge also keeps the earth’s pillars steady (verse 3), and the verse is read as the place where “the words of the church suddenly change into the words of God.” He will judge, and at a time He has fixed.

      On that reading God is still speaking in verses 4–5, after the Selah. Verse 6, which speaks of God in the third person, is where the congregation “takes up the words of God.” The same reading leaves the last verse with the singer, who “measures himself” by what verse 7 calls God’s own work.
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs, delitzsch-psalms, lds-scriptures]
  - ref: 3
    phrase: I bear up the pillars of it
    kind: symbol
    title: The earth melts, and its pillars hold
    body: |
      The verse sets a world coming apart against the God who keeps it standing. “Dissolved” is a verb for melting, used as a figure for people who are “helpless, disorganized (through terror, etc.).” It is the word for the inhabitants of Canaan who “melt away” at Israel’s approach in the song at the sea ([[Ex. 15:15]]).

      Against that, God says “I.” The verb the King James gives as “bear up” means to regulate or set right: “I regulate (or adjust) her pillars.” A modern translation has “it is I who keep its pillars steady.” The claim comes directly after the promise to judge.
    sources: [bdb, oshb-wlc, nrsvue, lds-scriptures]
  - ref: 4
    phrase: Lift not up the horn
    kind: symbol
    title: The horn the wicked lift for themselves
    body: |
      To lift up the horn is to carry oneself as strong, and here it is the pose of the arrogant. The horn as a figure is explained at [[Ps. 18:2]]; the picture here is of a horn “lifted up,” as by a lordly animal. In most places the lifted horn denotes “increase of might, dignity.” In these two verses the sense is “haughtiness, arrogance.”

      The rest of the warning fits. The “fools” are boasters; the verb means to “be boastful,” and a modern translation has “I say to the boastful, ‘Do not boast.’” In verse 5 the word beside “neck” is an adjective used of speech, “forward, arrogant,” and a modern translation has “or speak with insolent neck.”

      The last verse finishes the image. The opposite of lifting a horn is to “hew off horns, i.e. reduce, humiliate,” and that is what is promised for the horns of the wicked, while “the horns of the righteous shall be exalted” (verse 10).
    sources: [bdb, nrsvue, lds-scriptures]
  - ref: 6
    phrase: promotion cometh neither from the east, nor from the west, nor from the south
    kind: words
    title: Lifting up, the wilderness, and the missing north
    body: |
      This verse speaks of lifting up and of the wilderness, where the King James has “promotion” and “the south,” and it leaves the north unnamed. “Promotion” is the verb of verses 4 and 5 again, “lift up,” here in a form that works as a noun, “exaltation.” The proud were told not to lift up their horns, and this verse gives the reason: lifting up does not come from any place on the map.

      “The south” is the Hebrew word for wilderness, which the King James translates as “south” in this verse. A modern translation has “not from the wilderness comes lifting up.”

      The last word can also be read differently. The same Hebrew letters spell “mountains,” and the ancient Greek translation took them so: “neither from the east, nor from the west, nor from the desert mountains.” Read that way the sentence breaks off unfinished, and verse 7 completes it.

      Then there is the north. East, west, and the southern wilderness are named, and the fourth direction is not. The text gives no reason. One older reading finds a setting in the silence: the omission “shows that it is a northern power” that threatens Israel, which looks for help neither to the east nor the west nor toward Egypt beyond the desert, but to God alone. This is an inference from a gap, and the psalm names no nation.
    sources: [oshb-wlc, bdb, strongs-concordance, nrsvue, lxx-rahlfs, delitzsch-psalms]
  - ref: 7
    phrase: he putteth down one, and setteth up another
    kind: scripture
    title: Hannah’s song beside the psalm
    body: |
      This line is nearly Hannah’s, and most of the psalm’s images stand in her song. Hannah sang, “The LORD maketh poor, and maketh rich: he bringeth low, and lifteth up” ([[1 Sam. 2:7]]). The Hebrew of the psalm’s “putteth down” and “setteth up” uses the same two verbs as her “bringeth low” and “lifteth up.”

      The other echoes can be listed. She begins, “mine horn is exalted in the LORD” ([[1 Sam. 2:1]]), and ends with the LORD who will “exalt the horn of his anointed” ([[1 Sam. 2:10]]); the psalm ends with the horns of the righteous exalted. She warns, “Talk no more so exceeding proudly; let not arrogancy come out of your mouth” ([[1 Sam. 2:3]]), and her word for “arrogancy” is the word translated “stiff” in verse 5 of the psalm. She says that the pillars of the earth are the LORD’s, “and he hath set the world upon them” ([[1 Sam. 2:8]]), though with a different Hebrew word for pillars. And she says, “the LORD shall judge the ends of the earth” ([[1 Sam. 2:10]]).

      Hannah’s song speaks of the full and the hungry, and of the barren woman and the mother of many ([[1 Sam. 2:5]]); the psalm speaks of “all the wicked of the earth.” Daniel says it of kings: “he removeth kings, and setteth up kings” ([[Dan. 2:21]]). This woman's story is told alongside others in [Women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/#the-women).
    sources: [oshb-wlc, bdb, lds-scriptures]
  - ref: 8
    phrase: in the hand of the LORD there is a cup
    kind: symbol
    title: The cup of judgment
    body: |
      The cup is the judge’s sentence, pictured as wine that the guilty must drink. This use of the word is the “(wine-) cup of judgement” from which “the nations, or Israel, must drink,” and the prophets develop it at length: Jerusalem has drunk “the cup of his fury” ([[Isa. 51:17]]), and Jeremiah is told, “Take the wine cup of this fury at my hand” ([[Jer. 25:15]]).

      The details describe the wine. “The wine is red” is taken as “wine which foams,” though others derive the verb from a root meaning “be red.” “Full of mixture” means “wine mixed with spices.” The ancient Greek translation has the opposite, “unmingled wine.”

      The dregs are the sediment at the bottom. Where the King James has “wring them out,” a modern translation has “all the wicked of the earth shall drain it down to the dregs.”
    sources: [bdb, lxx-rahlfs, nrsvue, lds-scriptures]
  - ref: 8
    phrase: all the wicked of the earth shall wring them out, and drink them
    kind: christ
    title: The bitter cup the Savior drank
    body: |
      The cup the Savior spoke of in Gethsemane takes up the image of this verse. He spoke of His atoning suffering and death as a cup, a word that drew on scripture’s image of God’s wrath and of the judgment and punishment of the wicked, with this verse among the examples. In Gethsemane Jesus prayed, “O my Father, if it be possible, let this cup pass from me: nevertheless not as I will, but as thou wilt” ([[Matt. 26:39]]). To the Nephites His first words about Himself include “I have drunk out of that bitter cup which the Father hath given me, and have glorified the Father in taking upon me the sins of the world” ([[3 Ne. 11:11]]).

      Alma’s “bitter cup” is the one the wicked drink as the consequence of sin, with its dregs ([[Alma 40:26]]), and the Savior uses the same name for His own. Drinking the bitter cup is “an apt metaphor” for taking on Himself the sins of the world: He “suffered the consequences of sin (drank the ‘bitter cup’) on behalf of all, so that those who repent may not have to drink of the bitter cup themselves.” He says it Himself in a revelation to Joseph Smith: “I, God, have suffered these things for all, that they might not suffer if they would repent” ([[D&C 19:16]]), though He would “that I might not drink the bitter cup, and shrink” ([[D&C 19:18]]).

      The psalm’s own cup is for the wicked of the earth. What the Book of Mormon and the Doctrine and Covenants add is a Savior who drank a bitter cup so that those who repent need not.
    sources: [lds-scriptures, nt-student-manual-14, sc-knowhy-341]

christ: |
  The psalm’s confession is “God is the judge” (verse 7), and the cup of verse 8 is in the hand of the LORD, Jehovah, who “is the premortal Jesus Christ.” The Savior says where judgment rests: “For the Father judgeth no man, but hath committed all judgment unto the Son” ([[John 5:22]]). Enoch, repeating the Lord’s words to Adam, names Him “Jesus Christ, a righteous Judge, who shall come in the meridian of time” ([[Moses 6:57]]).

  The same Lord drank a bitter cup Himself (see the note on verse 8).

explore: |
  - **Hannah’s song.** Read [[1 Sam. 2:1–10]] beside the psalm and mark what each says of horns, proud speech, pillars, and the LORD who brings low and lifts up. Mary’s song has the same reversal: “He hath put down the mighty from their seats, and exalted them of low degree” ([[Luke 1:52]]).
  - **The cup in the prophets.** [[Isa. 51:17–23]] follows the cup out of Jerusalem’s hand and into the hand of her oppressors; [[Jer. 25:15–29]] sends it round the nations.

parallels:
  - ref: 1 Sam. 2:1–10
    note: Hannah’s song, with the horn, the arrogant speech, the pillars of the earth, and the LORD who brings low and lifts up.
  - ref: Dan. 2:21
    note: God removes kings and sets up kings.
  - ref: Isa. 51:17–23
    note: The cup of the LORD’s fury, drunk to the dregs and then taken away.
  - ref: Jer. 25:15–29
    note: The wine cup of fury that all the nations must drink.
  - ref: Alma 40:26
    note: The wicked drink the dregs of a bitter cup (also Mosiah 3:26).
  - ref: 3 Ne. 11:11
    note: The Savior has drunk the bitter cup the Father gave Him (also Matt. 26:39; D&C 19:16–18).

