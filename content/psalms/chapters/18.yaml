chapter: 18
title: The LORD Is My Rock
tagline: A king looks back on a life of rescues. God came down in storm to draw him out of the flood, then armed him to stand and fight, and the song ends with mercy promised to David’s seed for evermore.
when: 'By its title, David’s, at the time when the LORD had delivered him from all his enemies and from Saul'

setting: |
  Psalm 18 is in Book One of the Psalms. Its title gives it to David and to a season of his life: the time when the LORD had delivered him from all his enemies, and from Saul. The same song, with small differences, is 2 Samuel 22, set near the end of David’s story, just before “the last words of David” ([[2 Sam. 23:1]]). The first two notes take up the title; “To the chief Musician” is explained at [[Ps. 8:1]].

  It is a song of thanksgiving, one of the psalms that “reflect the gratitude of an individual or community after they have been delivered from a trial by God,” and it “has been called the king’s psalm of thanksgiving.” It is also counted among the royal psalms (see [[Ps. 2:2]]): the singer is the LORD’s king and “his anointed” (verse 50).

  Later scripture draws on it. Zacharias has the “horn of salvation” of verse 2 ([[Luke 1:69]]), Paul quotes verse 49 ([[Rom. 15:9]]), and lines of the song come back in [[Ps. 144:7]] and [[Hab. 3:19]].

thread: |
  Psalm 18 is a **look back**, and it tells a life as one rescue. It opens with love and a rush of names for God (verses 1–3), and then tells the story the names come from.

  The song falls into two halves: the praise comes to a close at verse 30 and “begins anew” at verse 31. In the first half David is helpless. He is caught in the cords of death and going under, and the one thing he does is cry out (verse 6). Everything after that is the LORD’s doing. He hears, He comes down in earthquake and storm, He reaches from above and draws the man out of the water. Then David says why (verses 20–30): he had kept faith with the LORD, and the LORD deals with people as they deal with Him.

  In the second half David is on his feet. He is sure-footed on the heights, he bends the bow, he pursues and strikes. Yet every one of these is said to be given: it is God who “girdeth me with strength,” who “teacheth my hands to war,” who has “enlarged my steps under me.” The God who came down to lift him out now makes him able to stand. (On the lines against his enemies in verses 37–42, see the note on the cursing psalms at [[Ps. 137:8]].)

  The close (verses 46–50) turns from the story to praise: “The LORD liveth.” In its last line the song reaches past the singer. The mercy shown to David is for “his seed for evermore.”

sections:
  - range: 1-3
    heading: My rock, my fortress, my deliverer
    plain: |
      I love You, O LORD, my strength. The LORD is my crag, my stronghold, and my rescuer; my God, my rock, in whom I take refuge; my shield, the horn that saves me, my high tower. I call on the LORD, who is worthy of praise, and I am saved from my enemies.
  - range: 4-6
    heading: The cords of death, and a cry
    plain: |
      The cords of death were around me, and floods of wickedness terrified me. The cords of Sheol were around me, and the snares of death met me. In my distress I called on the LORD and cried to my God. From His temple He heard my voice, and my cry came to His ears.
  - range: 7-15
    heading: He bowed the heavens and came down
    plain: |
      Then the earth shook, and the foundations of the hills trembled, because He was angry. Smoke rose from His nostrils and devouring fire from His mouth. He bent the heavens and came down, with thick darkness under His feet. He rode on a cherub and flew, on the wings of the wind. He wrapped Himself in darkness, in dark waters and thick clouds. Out of the brightness before Him came hail and coals of fire. The LORD thundered in the heavens; the Most High gave His voice. He shot His arrows and scattered them, lightning and routed them. Then the beds of the waters were seen and the foundations of the world were laid bare at Your rebuke, O LORD, at the blast of the breath of Your nostrils.
  - range: 16-19
    heading: Drawn out of many waters
    plain: |
      He reached from on high and took me; He drew me out of deep waters. He rescued me from my strong enemy and from those who hated me, for they were too strong for me. They came at me in the day of my disaster, but the LORD was my support. He brought me out into a wide place; He rescued me because He delighted in me.
  - range: 20-24
    heading: According to my righteousness
    plain: |
      The LORD dealt with me according to my righteousness; according to the cleanness of my hands He repaid me. For I have kept the ways of the LORD and have not wickedly turned from my God. All His judgments were before me, and I did not put His statutes away from me. I was blameless before Him and kept myself from iniquity. So the LORD has repaid me according to my righteousness, according to the cleanness of my hands in His sight.
  - range: 25-30
    heading: With the merciful, merciful
    plain: |
      With the loyal You show Yourself loyal; with the blameless, blameless; with the pure, pure; and with the crooked You show Yourself shrewd. You save a humble people and bring down haughty eyes. You light my lamp; the LORD my God lights up my darkness. By You I have run through a troop, and by my God I have leaped over a wall. As for God, His way is perfect; the word of the LORD is proven; He is a shield to all who take refuge in Him.
  - range: 31-36
    heading: The God who arms me
    plain: |
      For who is God but the LORD? Who is a rock but our God? It is God who arms me with strength and makes my way sound. He makes my feet like a deer’s and sets me on the heights. He trains my hands for war, so that my arms can bend a bow of bronze. You have given me the shield of Your salvation; Your right hand has held me up, and Your gentleness has made me great. You have made room for my steps, and my feet have not slipped.
  - range: 37-45
    heading: Enemies under his feet, nations at his word
    plain: |
      I pursued my enemies and overtook them, and did not turn back until they were finished. I struck them down so that they could not rise; they fell under my feet. You armed me with strength for the battle and put under me those who rose against me. You made my enemies turn their backs, and I destroyed those who hated me. They cried out and no one saved them; they cried to the LORD, and He did not answer. I beat them fine as dust before the wind and threw them out like the mud of the streets. You delivered me from the strife of the people and made me head of the nations; a people I had not known serve me. As soon as they hear of me they obey; foreigners submit to me. Foreigners lose heart and come trembling out of their strongholds.
  - range: 46-50
    heading: The LORD liveth
    plain: |
      The LORD lives! Blessed be my rock, and exalted be the God of my salvation, the God who avenges me and subdues peoples under me, who delivers me from my enemies. You lift me above those who rise against me; You rescue me from the violent man. Therefore I will thank You, O LORD, among the nations, and sing praise to Your name. He gives great deliverance to His king and shows mercy to His anointed, to David and to his seed for evermore.

notes:
  - ref: 0
    phrase: the words of this song
    kind: scripture
    title: The same song is in 2 Samuel 22
    body: |
      Psalm 18 is also 2 Samuel 22: the book of Samuel gives the whole song and introduces it in nearly the words of this title. There it begins, “And David spake unto the LORD the words of this song in the day that the LORD had delivered him out of the hand of all his enemies, and out of the hand of Saul” ([[2 Sam. 22:1]]). That copy stands among the closing chapters of David’s story, “inserted after a chapter concerning David’s battles against the Philistines.”

      The two copies run side by side, and the differences are small. Only the psalm has verse 1; Samuel begins at “The LORD is my rock.” Where the psalm has “the sorrows of death,” Samuel has “the waves of death” ([[2 Sam. 22:5]]). Where the psalm says “thou wilt light my candle,” Samuel says “thou art my lamp, O LORD” ([[2 Sam. 22:29]]). And Samuel’s last verse begins, “He is the tower of salvation for his king” ([[2 Sam. 22:51]]). The notes on verses 1, 4, 26 and 35 take up the differences that bear on the meaning.
    sources: [lds-scriptures, ot-minute-psalm-18-1]

  - ref: 0
    phrase: from the hand of Saul
    kind: history
    title: When David sang it, and why Saul is named
    body: |
      The title dates the song to a season, the time when David’s enemies were behind him, and it names Saul apart from the rest. “In the day” has been explained as “at the time,” and of the psalms connected with David’s life this one “marks the highest point of the national prosperity.”

      One older reading is more exact. It sets the song after the promise Nathan brought to David of a house and a throne that would last ([[2 Sam. 7:12–16]]): the song “springs entirely from the new self-consciousness to which he was raised by the promises recorded in 2 Samuel 7,” and its last verse looks back to them (see the note on verse 50).

      By then Saul had long been dead. On the same reading he is named because “the deliverance out of the hand of Saul is made specially prominent” in the song itself, the danger from him having been “of the most personal, the most perilous, and the most protracted kind.” The names for God in verse 2 are, on that reading, “the fruits of the affliction out of which David’s song has sprung, viz., his persecution by Saul.”

      The title also calls David “the servant of the LORD.” On that reading he is “the first after Moses and Joshua to bear this designation.”
    sources: [delitzsch-psalms, bd-david, lds-scriptures]

  - ref: 1
    phrase: I will love thee
    kind: words
    title: A word for love found in this form only here
    body: |
      The verb of the psalm’s first line is an unusual one for love, and this form of it is recorded for this verse alone. In its other forms the verb means to “have compassion,” and its subject is “usually” God: it is the word for what He feels toward His people, as in “Like as a father pitieth his children, so the LORD pitieth them that fear him” ([[Ps. 103:13]]). Here David says the word to the LORD. A modern translation has simply “I love you.”

      The line is not in Samuel’s copy of the song, which begins with verse 2, and for that reason it has been suspected of being a later addition (“perhaps gloss”). As the psalm stands, it opens the song with “feelings of intimacy and devotion” before any of the story is told.
    sources: [oshb-wlc, bdb, nrsvue, ot-minute-psalm-18-1, lds-scriptures]

  - ref: 2
    phrase: my rock, and my fortress
    kind: symbol
    title: Names from the wilderness years
    body: |
      The names David gives God are places of refuge, and three of them are words the story of his flight from Saul uses for the places where he hid; the note on the title gives the reading that the names come from those years. They are “metaphors that communicate the speaker’s experience with the Lord’s protection and security in times past.”

      - **“My rock”** is *sela*, a “crag, cliff.” In the wilderness of Maon, with Saul’s men closing around him, David “came down into a rock” ([[1 Sam. 23:25]]). When Saul was called away, the place was named Sela-hammahlekoth ([[1 Sam. 23:28]]), a cliff named with this word.
      - **“My fortress”** is *metsudah*, a “fastness, stronghold.” It is the word for “the hold” where David kept himself: “David and his men gat them up unto the hold” ([[1 Sam. 24:22]]).
      - **“My strength,”** in the middle of the verse, is in Hebrew a second word for rock, *tsur*. A modern translation has “my rock in whom I take refuge.” It is the word in “the rocks of the wild goats” ([[1 Sam. 24:2]]), where Saul went to look for him.

      “In whom I will trust” is the verb of taking refuge (see [[Ps. 11:1]]).

      *Tsur* is more than a figure. Said of God it means the “support and defence of his people,” and the song of Moses uses it as His name: “He is the Rock, his work is perfect” ([[Deut. 32:4]]). The psalm returns to it twice, in “who is a rock save our God?” (verse 31) and “blessed be my rock” (verse 46).
    sources: [ot-minute-psalm-18-1, oshb-wlc, bdb, nrsvue, lds-scriptures]

  - ref: 2
    phrase: the horn of my salvation
    kind: symbol
    title: A horn is strength
    body: |
      A horn stands for strength, so “the horn of my salvation” names the LORD as the strength that saves. The picture is an animal’s horn: “In biblical times, a horn was a symbol of strength and power,” and in this verse the horn is a “symbol of strength,” said of the LORD as deliverer. Hannah’s song has the figure too, “mine horn is exalted in the LORD” ([[1 Sam. 2:1]]), and her song ends with the LORD who will “exalt the horn of his anointed” ([[1 Sam. 2:10]]).

      The horns of the altar belong beside it. The altar’s corners were called horns, and they “became a place of refuge for those seeking sanctuary and mercy,” as when Adonijah fled to them (see [[1 Kgs. 1:50]]).

      Zacharias uses the phrase of the Savior: God “hath raised up an horn of salvation for us in the house of his servant David” ([[Luke 1:69]]).
    sources: [ot-minute-psalm-18-1, bdb, lds-scriptures]

  - ref: 4
    phrase: The sorrows of death compassed me
    kind: words
    title: Cords, or pangs
    body: |
      The Hebrew word behind “sorrows” can mean pangs or cords, and most modern translations choose cords. The word, *hevel*, covers “cord, rope, band, snare” or “pain, pang, travail.” The King James chose pain, as the ancient Greek translation had (“The pangs of death compassed me”). A modern translation has “The cords of death encompassed me” and, in verse 5, “the cords of Sheol entangled me.”

      For verse 4 itself the wording of Samuel’s copy has been preferred, “the waves of death” ([[2 Sam. 22:5]]), which goes with the “floods” in the second half of the line.

      “Hell” in verse 5 is Sheol, the realm of the dead (see [[Ps. 6:5]]).
    sources: [oshb-wlc, sc-knowhy-93, bdb, lxx-rahlfs, nrsvue, lds-scriptures]

  - ref: 5
    phrase: The sorrows of hell compassed me about
    kind: christ
    title: The bands of death, and the king’s rescue read of Christ
    body: |
      The Hebrew phrase of verse 4, as the psalm has it, can be translated “bands of death,” the phrase the Book of Mormon uses of the Savior’s victory, and one Latter-day Saint reading sees in the king’s rescue a figure of His. Abinadi and Alma “seem to be familiar with the Hebrew phrase.” Abinadi uses it of the Resurrection: “And thus God breaketh the bands of death, having gained the victory over death” ([[Mosiah 15:8]]). Alma joins to it “the chains of hell” ([[Alma 5:7]]), as the psalm sets Sheol beside death.

      On that reading the psalm “presents a royal figure,” the LORD’s anointed, bound by the bands of death and down in Sheol, who cries out and “is then miraculously saved from death,” and the imagery can “be understood as prefiguring Jesus Christ’s death and resurrection (and perhaps also His baptism).”

      This is offered as a reading. In the psalm the one rescued is David, who goes on, “He delivered me from my strong enemy” (verse 17).
    sources: [sc-knowhy-93, ot-minute-psalm-18-4, lds-scriptures]

  - ref: 7
    phrase: Then the earth shook and trembled
    kind: symbol
    title: A rescue told as the LORD’s coming in storm
    body: |
      David describes his rescue as an appearing of God in earthquake and storm, a picture that may be meant to recall Sinai. Nothing like it is told in his story: there is “no express record of any incident in David’s life of the kind.” One older reading supposes a real experience behind it, which David “idealises” into “a grand majestic picture of his miraculous deliverance.”

      At Sinai the LORD came with “thunders and lightnings, and a thick cloud upon the mount” ([[Ex. 19:16]]), and “the whole mount quaked greatly” ([[Ex. 19:18]]). The description of this theophany (a divine appearance) may be “meant to invoke in the audience the memory of God’s unforgettable visitation on Mount Sinai,” though its martial tone is nearer the songs of [[Judg. 5]] and [[Hab. 3]]. The song at the Red Sea is compared as well. In verse 15 the beds of the waters are laid bare “at the blast of the breath of thy nostrils” (Samuel’s copy says “the channels of the sea”), and that song has “with the blast of thy nostrils the waters were gathered together” ([[Ex. 15:8]]).

      One older reading sets the LORD’s coming “for the help of David” beside “the deliverance of Israel out of Egypt” and “the giving of the Law on Sinai.” It has also been proposed that the psalm belonged to a temple rite in which God’s appearing was re-enacted, so that “the Sinai theophany was reproduced in the temple of Jerusalem”; that is a reconstruction.

      Two details. The “temple” from which the cry is heard (verse 6) is, on the older reading, the LORD’s “heavenly dwelling-place, which is both palace and temple” (see [[Ps. 11:4]]). And the cherub He rides is one of the “heavenly creatures, the exact form being unknown,” whose figures stood on the mercy seat of the ark. Nephi’s psalm has been counted as alluding to the end of verse 10 in the words “upon the wings of” ([[2 Ne. 4:25]]).
    sources: [delitzsch-psalms, ot-minute-psalm-18-6, bd-cherubim, hilton-psalms-bom, lds-scriptures]

  - ref: 16
    phrase: he drew me out of many waters
    kind: words
    title: Drawn out, as Moses was
    body: |
      The verb for “drew me out” is the verb that explains Moses’ name, and it is recorded only there and in this line of David’s song. Pharaoh’s daughter “called his name Moses: and she said, Because I drew him out of the water” ([[Ex. 2:10]]). The verb’s entry has that verse and this one, with its twin in [[2 Sam. 22:17]], and no other.

      The next verse goes on without the figure: “He delivered me from my strong enemy.”
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 20
    phrase: according to my righteousness
    kind: history
    title: What righteousness David claims
    body: |
      David’s claim is that he kept faith with the LORD, and the next verses say what he means by it. He has “kept the ways of the LORD,” has not “wickedly departed from my God,” and has kept the LORD’s judgments before him (verses 21–22). “Upright” in verse 23 is the Hebrew *tamim*, “blameless” in a modern translation, which one older reading explains as being “with his whole soul undividedly devoted to Him.”

      That reading sets three testimonies beside these verses, and the last names an exception. David’s own, before Saul: “The LORD render to every man his righteousness and his faithfulness” ([[1 Sam. 26:23]]). The LORD’s: David “followed me with all his heart” ([[1 Kgs. 14:8]]). And the history’s: David “turned not aside from any thing that he commanded him all the days of his life, save only in the matter of Uriah the Hittite” ([[1 Kgs. 15:5]]).

      The psalm does not say whether it was sung before that matter or after it. The book of Samuel tells of Uriah in its eleventh chapter and gives the song in its twenty-second, and the older reading takes the song as a look back over the whole life, in which God “did not cast him off even when he fell into sin.” His fall “gave occasion to” Psalm 51 (see [[Ps. 51:14]] on what became of him); David makes a like claim at [[Ps. 7:8]].
    sources: [oshb-wlc, nrsvue, delitzsch-psalms, bd-david, lds-scriptures]

  - ref: 26
    phrase: with the froward thou wilt shew thyself froward
    kind: words
    title: How God meets the crooked
    body: |
      The verse says that God deals with each person as that person deals with Him, and its last line says how He deals with the devious. Three times a word for a kind of person is answered by a verb of the same root: merciful, upright, pure. The fourth time the Hebrew changes words. The person is *iqqesh*, twisted, and the verb is a different one, to twist, which in another form is Rachel’s “I have wrestled.” One rendering of the line is “with the twisted thou dost deal tortuously.”

      Translators have softened it in several ways. The King James has “froward” twice here and “unsavoury” in Samuel’s copy ([[2 Sam. 22:27]]); the footnote in the Church’s edition offers “with the twisted thou wilt be subtle”; a modern translation has “with the crooked you show yourself shrewd.”

      One older reading states the principle of all four lines: “God’s conduct to man is the reflection of the relation in which man has placed himself to God.” For the crooked, on that reading, it means “paradoxical judgments, giving the perverse over to his perverseness.”

      “Merciful” in verse 25 is *hasid*, the word for one who practises *hesed* (see [[Ps. 51:1]]): “with the kind thou shewest thyself kind.”
    sources: [oshb-wlc, bdb, nrsvue, delitzsch-psalms, lds-scriptures]

  - ref: 34
    phrase: a bow of steel is broken by mine arms
    kind: words
    title: A bow of bronze, bent
    body: |
      “Steel” is bronze, and the bow is probably bent, not broken. The Hebrew word means “copper, bronze,” and in 1611 “steel” had “an older, broader range of meaning” that took in hardened copper alloys. A modern translation has “so that my arms can bend a bow of bronze”; the verb is mostly taken as to “press down,” a sense marked “dubious.”

      Such a bow was probably not of solid metal. The phrase “probably refers to a composite bow, bound and/or inlaid with bronze,” a strong and costly weapon that for a long time “remained primarily a weapon of royalty.” The verse credits the strength to draw it to the God who “teacheth my hands to war.”

      Nephi’s bow “made of fine steel” ([[1 Ne. 16:18]]) has been compared with this one.
    sources: [bdb, sc-knowhy-548, nrsvue, lds-scriptures]

  - ref: 35
    phrase: thy gentleness hath made me great
    kind: words
    title: Gentleness, an uncertain word
    body: |
      The word translated “gentleness” is the Hebrew for humility, and said of God it has been taken as His condescension; the reading is uncertain. Elsewhere the noun means “humility, meekness.” For this verse “condescension” has been given, and marked “dubious.”

      The witnesses do not agree. Samuel’s copy has a different Hebrew word at this place, though the King James translates both “thy gentleness” ([[2 Sam. 22:36]]). The ancient Greek has “thy correction has upheld me.” A modern translation prints “your help has made me great” and keeps “gentleness” in a footnote.
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, lds-scriptures]

  - ref: 49
    phrase: among the heathen
    kind: scripture
    title: Paul hears the Gentiles in this line
    body: |
      Paul quotes this verse as scripture’s word that the Gentiles would praise God. “Heathen” is “nations” in the Hebrew, here as in verse 43. In the psalm David, made “the head of the heathen” (verse 43), vows to thank the LORD among them.

      Paul writes that Christ came so “that the Gentiles might glorify God for his mercy; as it is written, For this cause I will confess to thee among the Gentiles, and sing unto thy name” ([[Rom. 15:9]]). His wording is that of the Greek psalm: “Therefore will I confess to thee, O Lord, among the Gentiles, and sing to thy name.” Three more passages on the Gentiles follow it ([[Rom. 15:10–12]]), the last of them Isaiah’s “root of Jesse.”
    sources: [lds-scriptures, lxx-rahlfs]

  - ref: 50
    phrase: to his anointed, to David, and to his seed for evermore
    kind: christ
    title: Mercy to David’s seed for evermore
    body: |
      The last verse names the singer and reaches past him: the mercy shown to David is promised to his line for ever, a promise of a throne that Gabriel’s words to Mary take up. “His anointed” is the word behind *Messiah* (see [[Ps. 2:2]]), and “mercy” is *hesed* (see [[Ps. 51:1]]).

      The verse “is an echo of the Messianic promises in 2 Samuel 7:12-16,” where Nathan told David, “my mercy shall not depart away from him” ([[2 Sam. 7:15]]) and “thy throne shall be established for ever” ([[2 Sam. 7:16]]). One older reading asks where “for evermore” has held: “In whom, but in Christ, the son of David, has the fallen throne of David any lasting continuance?”

      Gabriel told Mary that her son would be given “the throne of his father David” ([[Luke 1:32]]), and that “of his kingdom there shall be no end” ([[Luke 1:33]]).
    sources: [oshb-wlc, delitzsch-psalms, lds-scriptures]

christ: |
  Psalm 18 is a king’s thanksgiving, and royal psalms “for Christian readers often reflected the royal life and reign of the Messiah.” The New Testament takes up this one’s words. Zacharias’s “horn of salvation” ([[Luke 1:69]]) is David’s name for the LORD in verse 2. Paul quotes verse 49 of the Gentiles’ praise ([[Rom. 15:9]]). And Hebrews, showing the Son to be one with those He calls brethren, has Him say, “I will put my trust in him” ([[Heb. 2:13]]), to which the Church’s edition refers the reader at verse 2.

  The song’s last word is “for evermore.” The notes on verses 5 and 50 give the reading of the king’s rescue as a figure of the Savior’s, and the promise to David’s seed that Gabriel’s words to Mary take up.

explore: |
  - **The song in its other setting.** [[2 Sam. 22:1–51]], read beside the psalm; then the “last words of David” that follow it ([[2 Sam. 23:1–7]]).
  - **The wilderness years.** [[1 Sam. 23:14–29]] and [[1 Sam. 24:1–22]], for the rock, the hold, and the cliffs of verse 2.
  - **The Rock in the song of Moses.** [[Deut. 32:4]], [[Deut. 32:15]] and [[Deut. 32:30–31]].
  - **Nephi’s rock.** [[2 Ne. 4:30]] and [[2 Ne. 4:35]], where Nephi calls the Lord “the rock of my salvation” and “my rock.”
  - **The promise behind the last verse.** [[2 Sam. 7:8–16]], and Zacharias’s song in [[Luke 1:68–75]].

parallels:
  - ref: 2 Sam. 22:1–51
    note: The same song, with small differences, near the end of David’s story.
  - ref: Rom. 15:9
    note: Paul quotes verse 49 of the Gentiles glorifying God.
  - ref: Luke 1:69
    note: Zacharias blesses God for “an horn of salvation” raised up in the house of David (verse 2).
  - ref: Ex. 19:16–18
    note: Thunder, lightning, thick cloud, smoke and a quaking mountain at Sinai, which verses 7–13 may be meant to recall.
  - ref: Ex. 2:10
    note: Moses is named for being drawn out of the water, the verb of verse 16.
  - ref: 2 Sam. 7:12–16
    note: Nathan’s promise of mercy and a throne to David’s seed for ever (verse 50).

