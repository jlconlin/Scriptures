chapter: 53
title: Fear Where No Fear Was
tagline: The psalm of the fool who says there is no God is sung a second time, with “God” for every “the LORD” and a new verse in which the people’s besieger is scattered.
when: 'Undated; a psalm of David by its title'

setting: |
  The title ascribes the psalm to David and adds two directions for its performance, which the first note takes up. It names no occasion.

  A reader of the book has met this psalm before. Psalm 14 is the same poem, and Psalm 53 has been called “another version of the same psalm.” Most of what a reader asks of it is answered in that chapter and is not repeated here: who the fool is ([[Ps. 14:1]]), what Paul does with the verdict that no one does good ([[Ps. 14:3]]), and what “captivity” means in the last verse ([[Ps. 14:7]]).

  Three things differ. Every “the LORD” of Psalm 14 is “God” here, so that the name of God stands seven times and is the same word each time. A few words are changed: “abominable iniquity” where Psalm 14 has “abominable works” ([[Ps. 14:1]]), and “gone back” where it has “gone aside” ([[Ps. 14:3]]). And where Psalm 14 has two verses on God’s presence with the righteous and on the poor man’s refuge, this psalm has one verse about an enemy camp destroyed.

  One older reading takes Psalm 53 to be “a later variation” of Psalm 14. The psalm itself says nothing of how it came to stand in the book twice.

thread: |
  Psalm 53 moves as Psalm 14 does until its fifth verse. A fool says in his heart that there is no God, and corruption goes with the saying (verse 1). God looks down from heaven to see whether anyone understands and seeks Him (verse 2), and finds no one who does good, “no, not one” (verse 3). Then a voice that can say “my people” asks whether the wrongdoers know nothing, they who eat up that people like bread and never call on God (verse 4).

  The turn is at the first word of verse 5, “There.” In both psalms terror falls on the devourers at that word. **What Psalm 53 changes is the reason for the terror.** In Psalm 14 they are afraid because God is with the righteous. Here they are afraid “where no fear was,” and the reason given is a defeat: God has scattered the bones of one who encamped against “thee,” and those God has rejected are put to shame. On one reading, the devourers of verse 4 are then Israel’s foreign enemies.

  The last verse is the wish that closes Psalm 14 as well: that Israel’s salvation would come out of Zion, and that Jacob would rejoice when God brings back His people.

sections:
  - range: 1-3
    heading: The fool’s saying and what God finds
    plain: |
      The senseless man tells himself, “There is no God.” Such people are corrupt, and the wrong they do is abominable; not one of them does good. God looked down from heaven on humankind to see whether anyone had understanding, anyone who sought God. Every one of them has turned back; all alike have gone bad. No one does good, not even one.
  - range: 4-5
    heading: The devourers in terror
    plain: |
      Do the wrongdoers know nothing, they who devour my people the way they eat bread and never call on God? There they were, seized with dread where there was nothing to dread, for God has scattered the bones of the one who camped against you. You have put them to shame, because God has rejected them.
  - range: 6
    heading: Salvation out of Zion
    plain: |
      If only Israel’s salvation would come out of Zion! When God brings back His captive people, Jacob will rejoice and Israel will be glad.

notes:
  - ref: 0
    phrase: upon Mahalath, Maschil
    kind: words
    title: Mahalath and Maschil
    body: |
      Mahalath is probably the name of a tune, and its meaning is uncertain. The word stands “only in Psalm titles,” here and over Psalm 88, and is “apparently a catchword in a song, giving name to tune; meaning dubious.” The ancient Greek translators left it untranslated and wrote it as a name, “upon Maeleth.” A modern translation does much the same: “according to Mahalath.”

      The rest of the title is shared with other psalms. “To the chief Musician” is explained at [[Ps. 8:1]], and Maschil at [[Ps. 32:1]]. The title of Psalm 14 has neither Mahalath nor Maschil.
    sources: [bdb, lxx-rahlfs, nrsvue, lds-scriptures]
  - ref: 2
    phrase: God looked down from heaven
    kind: words
    title: God where Psalm 14 has the LORD
    body: |
      The plainest difference between the two psalms is the name of God: wherever Psalm 14 has the divine name, Psalm 53 has *Elohim*, “God.” Psalm 14 reads, “The LORD looked down from heaven” ([[Ps. 14:2]]), and this verse says the same of God. In the Hebrew of Psalm 14 the divine name stands four times (verses 2, 4, 6 and 7) and *Elohim* three times. In Psalm 53 God is named seven times, and every time the word is *Elohim*. (On the two names and the King James’s capitals, see [[Ps. 110:1]].)

      The change reaches the last line, where “when the LORD bringeth back the captivity of his people” ([[Ps. 14:7]]) becomes “When God bringeth back.” The fool’s saying is not touched, since it has *Elohim* in both psalms. The psalm gives no reason for the change.
    sources: [oshb-wlc, lds-scriptures]
  - ref: 5
    phrase: where no fear was
    kind: words
    title: Fear with nothing to fear, or fear like no other
    body: |
      These words are not in Psalm 14, and they can be read in two ways. Psalm 14 has only “There were they in great fear” ([[Ps. 14:5]]). The Hebrew here goes on with three more words: “not,” “was,” “fear.” The King James has “where no fear was,” and the ancient Greek translation agrees: “where there was no fear.” A modern translation takes the words as a measure, terror “such as has not been.”

      The Greek has the same words in Psalm 14, and translations differ over the tense of the verse; the note on [[Ps. 14:5]] has both points. The next note gives a reading that takes the words as the King James does.
    sources: [oshb-wlc, nrsvue, lxx-rahlfs, lds-scriptures]
  - ref: 5
    phrase: God hath scattered the bones of him that encampeth against thee
    kind: history
    title: A besieger scattered, where the two psalms part
    body: |
      Here Psalm 53 leaves Psalm 14 and gives the fear a different cause: an enemy camped against God’s people has been destroyed. Psalm 14’s cause is that “God is in the generation of the righteous” ([[Ps. 14:5]]).

      The Hebrew verb behind “encampeth” is used in this verse “with hostile sense,” as of an army pitched against someone, and nothing earlier in the psalm says who “thee” is. One older reading takes the words as “addressed to the people of God”: God has scattered the bones “of thy besieger.” On that reading the fear “where no fear was” fell when there was “no outward ground for fear,” so that it was “a God-wrought panic.” The devourers of verse 4 are then Israel’s foreign foes, a reference “originally alien to the Psalm.”

      The same reading supposes an occasion. “A later poet, perhaps belonging to the time of Jehoshaphat or Hezekiah,” it suggests, adapted David’s psalm “to some terrible catastrophe that has just taken place.” It points to a rout in each reign. In Jehoshaphat’s, when the people “began to sing and to praise, the LORD set ambushments against the children of Ammon, Moab, and mount Seir” ([[2 Chr. 20:22]]), and Judah found only “dead bodies fallen to the earth” ([[2 Chr. 20:24]]). In Hezekiah’s, “the angel of the LORD went forth, and smote in the camp of the Assyrians” ([[Isa. 37:36]]). The psalm names neither king, and the occasion is a conjecture.

      Translators have not agreed about the line. The Greek has God scattering “the bones of the men-pleasers,” and a modern translation has “the bones of the ungodly.” Both make the shame the enemies’ own, “they were ashamed” and “they will be put to shame,” where the Hebrew verb is a second-person form, as the King James has it.
    sources: [lds-scriptures, bdb, delitzsch-psalms, lxx-rahlfs, nrsvue, oshb-wlc]

christ: |
  Psalm 53 shares its verdict with Psalm 14, and Paul quotes that verdict on his way to a witness of Christ. “There is none that doeth good, no, not one” ([[Rom. 3:12]]) is part of his proof that all are under sin, and his answer to it is “the redemption that is in Christ Jesus” ([[Rom. 3:24]]). The second note on [[Ps. 14:3]] follows the argument.

  The psalm’s own last line longs for “the salvation of Israel” to come out of Zion. In this psalm the Hebrew word for salvation is plural, where Psalm 14 has the singular, and one older reading takes the plural to mean “entire, full, and final salvation.”

explore: |
  - **The twin psalm.** [[Ps. 14]], read beside this one, above all at verses 5–6.
  - **Two camps that were scattered.** [[2 Chr. 20:14–24]] and [[Isa. 37:33–36]], the deliverances one reading sets beside verse 5.
  - **The other psalm upon Mahalath.** [[Ps. 88]], the only other psalm with the word in its title.

parallels:
  - ref: Ps. 14:1–7
    note: The same psalm with “the LORD” four times and a different fifth and sixth verse.
  - ref: Rom. 3:10–12
    note: Paul quotes the verdict the two psalms share to show that all are under sin.
  - ref: 2 Chr. 20:22–24
    note: A rout in Jehoshaphat’s reign that one reading sets beside verse 5.
  - ref: Isa. 37:36
    note: The Assyrian camp before Jerusalem in Hezekiah’s reign, set beside verse 5 by the same reading.

