chapter: 87
title: Born in Zion
tagline: A song of the city God founded hears Him name Egypt, Babylon and three more nations among those who know Him, and enter each on His register as born in Zion.
when: 'Undated; for the sons of Korah by its title'

setting: |
  Psalm 87 is one of the psalms of the sons of Korah (for the family, see [[Ps. 42:1]]) and one of the songs of Zion, a group that also takes in Psalms 46, 48, 76, 84 and 122. The psalm just before it says, “All nations whom thou hast made shall come and worship before thee, O Lord” ([[Ps. 86:9]]), and this one has been read as that thought enlarged into a whole song.

  It is seven verses long and very compressed; it has been called “terse, abrupt, enigmatic, like a prophetic oracle.” Selah stands after verses 3 and 6 (on the word, see [[Ps. 3:2]]).

  The speaker changes. Verses 1–3 speak of the LORD and then address the city. In verse 4 the “I” is God, who speaks of “them that know me.” Verses 5–6 speak of Him again as “the highest” and “the LORD.”

  The title names no occasion, and two dates have been proposed. One is the reign of Hezekiah, after the Assyrian army was destroyed and “many brought gifts unto the LORD to Jerusalem” ([[2 Chr. 32:23]]). The other is after the return from exile, because the psalm names Babylon and not Assyria as the great power beside Egypt. Each is a proposal; the psalm itself gives no date.

thread: |
  Psalm 87 is about who belongs to Zion. It begins with the city: God founded it, He loves its gates, and “Glorious things are spoken of thee.” The first Selah falls there, before any of those things has been said.

  **The turn is verse 4, where God Himself speaks.** He names five foreign nations, beginning with the two that held Israel captive, and says of them what no one expects: “this man was born there.” This is the glorious thing spoken of Zion: she is to be the birthplace of nations, Egypt and Babylon among them.

  One Hebrew verb carries the rest. “Was born” comes three times in three verses, in the same form each time: of the nations (verse 4), of one person after another (verse 5), and in the LORD’s own register (verse 6). The psalm reports no conquest of these peoples and no journey. They are declared native, and the declaration is written down.

  The psalm ends in music. Its last words are a song to the city: “all my springs are in thee.”

sections:
  - range: 1-3
    heading: The city He founded
    plain: |
      The city He founded stands on the holy mountains. The LORD loves the gates of Zion more than every other dwelling place in Jacob. Glorious things are said of you, city of God.
  - range: 4-6
    heading: This one was born there
    plain: |
      “I name Egypt and Babylon among those who know Me. Look: Philistia and Tyre, with Cush. This one was born there.” And of Zion it will be said, “This one and that one were born in her,” and the Most High Himself will establish her. The LORD will count, as He writes down the peoples: “This one was born there.”
  - range: 7
    heading: All my springs are in thee
    plain: |
      Singers and dancers alike say, “All my springs are in you.”

notes:
  - ref: 1
    phrase: His foundation
    kind: words
    title: The city He founded
    body: |
      The psalm opens on a pronoun with no name before it: “His” is the LORD’s, and the “foundation” is the city He founded. The Hebrew noun is glossed “foundation = city founded,” and modern translations say so outright: “On the holy mount stands the city he founded,” or “He has founded his city on the holy mountain.”

      In Hebrew the pronoun is masculine, while the city is feminine wherever the psalm refers to it (“thee” in verse 3, “her” in verse 5). So “his” is not the city’s. It belongs to the LORD, who is not named until verse 2.
    sources: [bdb, oshb-wlc, nrsvue, niv]

  - ref: 2
    phrase: the gates of Zion more than all the dwellings of Jacob
    kind: scripture
    title: The gates, and the other dwellings of Jacob
    body: |
      The psalm gives no reason for the LORD’s preference but love, and another psalm tells the same choice in the same word. There God “forsook the tabernacle of Shiloh” ([[Ps. 78:60]]) and “chose the tribe of Judah, the mount Zion which he loved” ([[Ps. 78:68]]); “loved” is the Hebrew verb of this verse. A later psalm adds what the choice was for: “For the LORD hath chosen Zion; he hath desired it for his habitation” ([[Ps. 132:13]]). The note on [[Ps. 78:67]] follows what passed from Shiloh to Zion.

      The places Zion is set above are not belittled. “Dwellings” is the word Balaam uses when he blesses the camp: “How goodly are thy tents, O Jacob, and thy tabernacles, O Israel!” ([[Num. 24:5]]).

      Naming the gates for the whole city has been explained as a “poetical expression for the city, specially appropriate with reference to the thought of the crowd of pilgrims” who enter it “from all nations.” On that reading the psalm’s second line already looks toward its fourth verse, where the nations arrive.
    sources: [lds-scriptures, oshb-wlc, cambridge-psalms]

  - ref: 4
    phrase: Rahab and Babylon
    kind: history
    title: Five nations, and Egypt under a nickname
    body: |
      Rahab is Egypt, so the list begins with the land of Israel’s bondage and the land of its exile. The name is glossed “Rahab (= Egypt)” for this verse, and a modern translation notes it as a “poetic name for Egypt.” It is not the Rahab of Jericho, whose name is a different Hebrew word. Where the nickname comes from is explained at [[Isa. 51:9]] and [[Isa. 30:7]]. “Ethiopia” is Cush in Hebrew (see [[Ps. 68:31]]).

      Egypt is the country of “the house of bondage” ([[Ex. 20:2]]), and Babylon is where the exiles sat down and wept ([[Ps. 137:1]]). Philistia, Tyre and Cush follow.

      The speaker is God, and He does not name these nations to an audience so much as place them in a company. Modern translations have “Among those who know me I mention Rahab and Babylon,” or “among those who acknowledge me.” The peoples that enslaved and deported Israel are listed with those who know the LORD.

      Isaiah has a saying like it about another pair of empires: “Blessed be Egypt my people, and Assyria the work of my hands, and Israel mine inheritance” ([[Isa. 19:25]]).
    sources: [bdb, niv, nrsvue, oshb-wlc, lds-scriptures]

  - ref: 4
    phrase: this man was born there
    kind: words
    title: Born there means born in Zion
    body: |
      “There” is Zion, and “this man” is each of the nations in turn, declared a native of the city. The Hebrew has only “this one”; a modern translation keeps “This one was born there,” and another fills in the place: “This one was born in Zion.” On one older reading the pronoun points “to nation after nation,” “by fixing the eye upon each one separately.”

      A birth by declaration is a grant of citizenship. The nations “will attain a right of citizenship in Zion,” as in a “second mother-city”; or, in another older wording, “The franchise of Zion is conferred upon them as though it were theirs by right of birth.” A verse of Isaiah has been called “the key to its meaning.” There one person after another takes the LORD’s name and Jacob’s: “One shall say, I am the LORD’s; and another shall call himself by the name of Jacob” ([[Isa. 44:5]]).

      Whether this is the new birth the Savior taught is a further question, and the older readings stop short of saying so outright. The psalmist “does not combine with it the idea of being born again in the depth of its New Testament meaning,” and the words refer “primarily” to “nations not to individuals.” Yet both readings see the line pointing that way. On one, the nations undergo a change that, “regarded from the New Testament point of view, is the new birth out of water and the Spirit”; on the other, the words are “a foreshadowing of the truth that a new birth is requisite for entrance into the kingdom of God.” Jesus told Nicodemus, “Except a man be born of water and of the Spirit, he cannot enter into the kingdom of God” ([[John 3:5]]).
    sources: [oshb-wlc, nrsvue, niv, delitzsch-psalms, cambridge-psalms, lds-scriptures]

  - ref: 5
    phrase: This and that man was born in her
    kind: words
    title: One by one, and Zion as mother
    body: |
      Verse 5 turns from the nations to the city and counts her children one at a time. The Hebrew simply says the word for a man twice, joined by the word for and; a modern translation has “This one and that one were born in it.”

      The ancient Greek translation makes the city a mother outright: “A man shall say, Sion is my mother; and such a man was born in her.” The Hebrew text as printed has no word for “mother” in the verse.

      The second half of the verse says who keeps such a city standing. “The highest” is the divine title rendered “the Most High” in modern translations, and “shall establish her” is the Hebrew verb, in the same form, of an earlier song of Zion: “God will establish it for ever” ([[Ps. 48:8]]).
    sources: [oshb-wlc, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 6
    phrase: when he writeth up the people
    kind: symbol
    title: The LORD’s register of the peoples
    body: |
      The picture is a roll of citizens, and the LORD Himself keeps it. Modern translations have Him write “in the register” of the peoples, or record the line “as he registers the peoples.” “People” is plural in Hebrew, peoples, and the verb “count” is the ordinary one for counting things “to learn their number.” The entry He makes is the sentence of verse 4, now in writing: “this man was born there.”

      Other scripture knows such a roll. Ezekiel says false prophets shall not “be written in the writing of the house of Israel” ([[Ezek. 13:9]]). Isaiah calls those left in Zion “every one that is written among the living in Jerusalem” ([[Isa. 4:3]]), and a psalm of David speaks of “the book of the living” ([[Ps. 69:28]]). Ezekiel’s roll is the house of Israel’s, and Isaiah’s is Jerusalem’s. This one is of the peoples, and against each of them it enters Zion as the place of birth.

      The New Testament speaks of a book of life, and the scriptures indicate that “a heavenly record is kept of the faithful, whose names are recorded.” The psalm does not use that name. What it shows is the LORD doing the writing.
    sources: [nrsvue, niv, oshb-wlc, bdb, lds-scriptures, bd-book-of-life]

  - ref: 7
    phrase: all my springs are in thee
    kind: words
    title: A hard last line
    body: |
      The last verse is a fragment in Hebrew, five words without a main verb, and the translations do not agree on it. The King James supplies “shall be there.” A modern translation supplies a verb of speaking, “Singers and dancers alike say,” and makes the last words their song: “All my springs are in you.”

      The second word is the first difficulty. It has been taken as “pipe-players,” which is close to the King James’s “players on instruments,” or as a form of the verb “dance.” The ancient Greek translators read something else altogether: “The dwelling of all within thee is as the dwelling of those that rejoice.” The lexicon that explains “springs” marks its own explanation “si vera lectio,” if the reading is right, and notes that others read a word for “dwelling,” which is what the Greek has.

      Taken as it stands, the spring is a figure for a “source of happiness, enjoyment.” The noun is the one in Isaiah’s “with joy shall ye draw water out of the wells of salvation” ([[Isa. 12:3]]). “In thee” is addressed to the city, as “of thee” is in verse 3. Another psalm says to God, “with thee is the fountain of life” ([[Ps. 36:9]]), and another song of the sons of Korah puts a river in the city of God (see the note on [[Ps. 46:4]]).

      So the psalm, on the reading that keeps “springs,” ends with those who belong to Zion singing that everything they draw on is in her.
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs, lds-scriptures]

christ: |
  This psalm has been called “a prophecy in O.T. language” of the city Paul describes to Gentile converts: “Jerusalem which is above is free, which is the mother of us all” ([[Gal. 4:26]]). On the same reading it looks forward to what he told the Ephesians. They had been “aliens from the commonwealth of Israel” ([[Eph. 2:12]]). Now those who were far off “are made nigh by the blood of Christ” ([[Eph. 2:13]]), “no more strangers and foreigners, but fellowcitizens with the saints” ([[Eph. 2:19]]).

  The same reading has all nations “adopted as citizens” of Zion. Adoption is also the name under which the Church teaches how one who is not of Israel comes to belong to it: a person “of non-Israelite lineage becomes a member of the house of Israel through faith in Jesus Christ when it is accompanied by baptism in water and the reception of the Holy Ghost.”

explore: |
  - **Egypt and Assyria blessed with Israel.** [[Isa. 19:19–25]], where the thought of verse 4 has been found in different language.
  - **The prophecies that lead up to it.** [[Isa. 2:2–4]] and [[Zech. 8:20–23]], with “many nations shall be joined to the LORD in that day, and shall be my people” ([[Zech. 2:11]]).
  - **The other songs of Zion.** [[Ps. 46]], [[Ps. 48]], [[Ps. 76]], [[Ps. 84]] and [[Ps. 122]].
  - **The city at the end of scripture.** [[Rev. 21:24–27]], where the nations walk in the city’s light, its gates are never shut, and those who enter are “they which are written in the Lamb’s book of life.”

