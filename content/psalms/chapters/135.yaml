chapter: 135
title: Whatsoever the LORD Pleased
tagline: The servants who stand in the LORD’s house are called to praise Him, given the reasons from creation, Egypt and Canaan, shown the idols that can do nothing, and called again to bless Him out of Zion.
when: 'Undated and untitled; the singers stand in the courts of the LORD’s house at Jerusalem'

setting: |
  The psalm has no title and names no occasion. What it shows of itself is a place: its singers “stand in the house of the LORD, in the courts of the house of our God,” and its last line is spoken from Zion and Jerusalem.

  It comes directly after the fifteen songs of degrees, Psalms 120–134. Like the last of them, it begins with a call to the servants who stand in the LORD’s house ([[Ps. 134:1]]). It opens and closes with “Praise ye the LORD” (see the note on [[Ps. 150:1]]). It is a hymn of praise, one of the psalms that “begin with a command or call to Israel to gather as a community (most importantly, at the temple) and praise the Lord.”

  Much of it can be found somewhere else in scripture. One older description calls it “a Psalm in the mosaic style,” whose pieces are taken “out of the Law, Prophets, and Psalms”: words from Exodus and Deuteronomy, a sentence of Jeremiah’s, the idol lines of [[Ps. 115:4–8]]. The notes say where each comes from and what the psalm does with it.

  The psalm that follows is its companion. [[Ps. 136]] tells the same history, the firstborn of Egypt, Sihon and Og, and the land given as a heritage, with a refrain after every line.

thread: |
  Psalm 135 is **an argument for praise built from two lists of verbs**. It opens with a call (verses 1–3) and gives its reasons with the word “For”: the LORD chose Jacob (verse 4), and He is “above all gods” (verse 5).

  Verse 6 states what the rest will prove: “Whatsoever the LORD pleased, that did he.” Then comes the first list. He “causeth” the clouds to rise, “maketh” lightning, “bringeth” the wind. He “smote” Egypt’s firstborn, “sent” wonders, “slew” kings, and “gave” their land to Israel. Every verb is something done.

  At verse 13 the psalm turns. For the two lines of that verse it stops speaking about the LORD and speaks to Him: “Thy name, O LORD, endureth for ever.” Verse 14 then looks ahead for the first time: He “will judge his people.” What He did for the fathers He will do for His servants.

  The second list is the idols’, and its verbs are all denied: they “speak not,” “see not,” “hear not,” and have no breath. The psalm does not argue with the nations’ gods. It sets a list of what they cannot do beside the list of what the LORD has done.

  Then the opening call returns, widened to four groups, and the blessing that Psalm 134 asked to come out of Zion on the worshipper is given back: “Blessed be the LORD out of Zion.”

sections:
  - range: 1-4
    heading: Praise him, ye that stand in his house
    plain: |
      Praise the LORD. Praise the name of the LORD; praise Him, you His servants, who stand in the house of the LORD, in the courts of the house of our God. Praise the LORD, for the LORD is good; sing praises to His name, for it is pleasant. For the LORD chose Jacob for Himself, Israel as His own treasure.
  - range: 5-7
    heading: Whatsoever the LORD pleased
    plain: |
      I know that the LORD is great, that our Lord is above all gods. Whatever the LORD pleased He did, in heaven and on earth, in the seas and in all the depths. He makes the clouds rise from the ends of the earth; He makes lightning for the rain; He brings the wind out of His storehouses.
  - range: 8-12
    heading: Egypt, the kings, and the land
    plain: |
      He struck down the firstborn of Egypt, of man and of beast. He sent signs and wonders into the midst of Egypt, on Pharaoh and all his servants. He struck great nations and killed mighty kings: Sihon king of the Amorites, Og king of Bashan, and all the kingdoms of Canaan. He gave their land as a heritage, a heritage to Israel His people.
  - range: 13-14
    heading: Thy name endureth for ever
    plain: |
      Your name, O LORD, lasts for ever; You are remembered, O LORD, through all generations. For the LORD will take up His people’s cause, and He will have compassion on His servants.
  - range: 15-18
    heading: Silver and gold, the work of men’s hands
    plain: |
      The idols of the nations are silver and gold, made by human hands. They have mouths and do not speak; they have eyes and do not see. They have ears and do not hear, and there is no breath in their mouths. Those who make them are like them, and so is everyone who trusts in them.
  - range: 19-21
    heading: Blessed be the LORD out of Zion
    plain: |
      Bless the LORD, house of Israel; bless the LORD, house of Aaron. Bless the LORD, house of Levi; you who fear the LORD, bless the LORD. Blessed be the LORD out of Zion, He who dwells at Jerusalem. Praise the LORD.

notes:
  - ref: 1
    phrase: O ye servants of the LORD
    kind: structure
    title: The call of Psalm 134, widened
    body: |
      The psalm opens with the call that opens Psalm 134, and it closes by turning that psalm’s last line around. Psalm 134 begins, “bless ye the LORD, all ye servants of the LORD, which by night stand in the house of the LORD” ([[Ps. 134:1]]), and ends with a blessing on the worshipper: “The LORD that made heaven and earth bless thee out of Zion” ([[Ps. 134:3]]). Here the servants again “stand in the house of the LORD,” and the last verse sends the blessing the other way: “Blessed be the LORD out of Zion.” One older reading takes this psalm to be “a Psalm-song expanded out of this shorter hymn.”

      The servants are a larger company here. Psalm 134 speaks to those in the house at night. This psalm adds “the courts of the house of our God,” and when the call comes back in verses 19–20 it names the house of Israel, the priests, the Levites, and all who fear the LORD. On the same older reading, the servants of verse 1 are not the temple’s officers alone but “those who fear Him as a body.”
    sources: [lds-scriptures, delitzsch-psalms]

  - ref: 4
    phrase: his peculiar treasure
    kind: words
    title: A treasure is what He chose and kept for Himself
    body: |
      “Peculiar treasure” is the LORD’s own phrase from Sinai, and the Hebrew noun in it is “valued property.” The note on [[Mal. 3:17]], where the same word is translated “jewels,” explains it.

      At Sinai the phrase came with a condition: “if ye will obey my voice indeed, and keep my covenant, then ye shall be a peculiar treasure unto me above all people” ([[Ex. 19:5]]). The psalm says the LORD “hath chosen” Jacob, which is Moses’ wording in Deuteronomy: “the LORD thy God hath chosen thee to be a special people unto himself” ([[Deut. 7:6]]), where “special” is the same noun. And the psalm gives the choice as a reason for praise: verse 4 begins with “For.”
    sources: [bdb, lds-scriptures]

  - ref: 5
    phrase: our Lord is above all gods
    kind: scripture
    title: Above all gods, and the idols of verse 15
    body: |
      The psalm sets the LORD above “all gods” in verse 5, and when it comes to the gods of the nations in verse 15 it calls them “silver and gold, the work of men’s hands.” [[Ps. 95:3]] makes the same comparison, “a great King above all gods,” and its note takes up whether such a line grants that other gods exist; the heavenly council is at [[Ps. 82:1]].
    sources: [lds-scriptures]

  - ref: 7
    phrase: he bringeth the wind out of his treasuries
    kind: scripture
    title: The same sentence in Jeremiah 10
    body: |
      Verse 7 stands nearly word for word in Jeremiah, where it belongs to an argument against idols. Jeremiah 10 sets the gods that workmen “deck” with “silver and with gold” beside the God who made the earth (see the note on [[Jer. 10:12]]), and says of Him: “he causeth the vapours to ascend from the ends of the earth; he maketh lightnings with rain, and bringeth forth the wind out of his treasures” ([[Jer. 10:13]]). In the psalm the sentence follows verse 6, which says that the LORD did whatever He pleased, and the idols of silver and gold come in verse 15.

      The picture is of a storehouse. A modern translation has “clouds” for “vapours” and “storehouses” for “treasuries”: the wind is kept, and He brings it out when He pleases.
    sources: [lds-scriptures, nrsvue]

  - ref: 11
    phrase: Sihon king of the Amorites, and Og king of Bashan
    kind: history
    title: The first two kings, east of the Jordan
    body: |
      Sihon and Og were the first kings Israel defeated. Both fell east of the Jordan, before the people crossed it. Israel asked Sihon for passage, and he “would not suffer Israel to pass through his border” and came out to fight ([[Num. 21:23]]). Og of Bashan then “went out against them” ([[Num. 21:33]]).

      The psalm’s word for what followed is “heritage,” and Deuteronomy speaks of the war with Sihon in that language. Before the battle the LORD says, “I have begun to give Sihon and his land before thee: begin to possess, that thou mayest inherit his land” ([[Deut. 2:31]]). The inheritance began there. “All the kingdoms of Canaan” covers the rest in a phrase; Joshua 12 lists the two kings east of the Jordan and thirty-one west of it.

      [[Ps. 136:17–22]] tells the same wars in the same order and names the same two kings.
    sources: [lds-scriptures]

  - ref: 13
    phrase: thy memorial, O LORD, throughout all generations
    kind: scripture
    title: The name given at the bush, said back to Him
    body: |
      Verse 13 turns the LORD’s words at the burning bush into praise addressed to Him. There He gave Moses His name for Israel and added, “this is my name for ever, and this is my memorial unto all generations” ([[Ex. 3:15]]). For “thy memorial” a modern translation has “your renown.”

      The two lines of verse 13 are the only ones in which the psalm speaks to the LORD. Before them and after them He is “he.” The psalm began by calling for praise of “the name of the LORD,” and it comes back to the name after the list of what He did in Egypt and beyond the Jordan. The name was given to Moses before any of that happened, with the promise that it would last. The psalm, sung in the courts of His house after all of it, says that it has.
    sources: [lds-scriptures, nrsvue]

  - ref: 14
    phrase: he will repent himself concerning his servants
    kind: scripture
    title: A line from the Song of Moses, and what repent means in it
    body: |
      Verse 14 quotes the Song of Moses, and in it “judge” and “repent” are both promises to Israel. The Song says, “For the LORD shall judge his people, and repent himself for his servants, when he seeth that their power is gone” ([[Deut. 32:36]]). The judging is done for a people with no strength left, and a modern translation of the psalm has “vindicate his people” and “have compassion on his servants.” “Repent” here is not repentance from sin; the note on [[Ps. 90:13]] explains the word.

      In the Song the next verse asks, “Where are their gods, their rock in whom they trusted” ([[Deut. 32:37]]); the psalm’s next verse is on the idols of the nations.

      The New Testament quotes the first half of the line as a warning: “The Lord shall judge his people” ([[Heb. 10:30]]), and then, “It is a fearful thing to fall into the hands of the living God” ([[Heb. 10:31]]). In the psalm, as in the Song, those words stand beside compassion.
    sources: [lds-scriptures, nrsvue, delitzsch-psalms]

  - ref: 17
    phrase: neither is there any breath in their mouths
    kind: symbol
    title: Idols without the breath the LORD commands
    body: |
      Verses 15–18 repeat the idol lines of Psalm 115 in shorter form and add one thing: the idols have no breath. The note on [[Ps. 115:5]] goes through the list, and the note on [[Ps. 115:8]] takes up how makers become like what they make. Psalm 115 says of the idols’ noses that “they smell not” ([[Ps. 115:6]]) and goes on to hands, feet and throat. This psalm stops at the ears and ends, “neither is there any breath in their mouths,” close to Jeremiah’s verdict on the cast image, “there is no breath in them” ([[Jer. 10:14]]).

      “Breath” here and “wind” in verse 7 are one Hebrew word, *ruach*, which means breath, wind and spirit (see the note on [[Ps. 104:30]]). Jeremiah has the word in adjacent verses, once for the wind the LORD brings out ([[Jer. 10:13]]) and once for what the image lacks, and the psalm has it in both places too. The LORD brings *ruach* out of His storehouses; the images have none in their own mouths.
    sources: [lds-scriptures, oshb-wlc, bdb]

  - ref: 20
    phrase: Bless the LORD, O house of Levi
    kind: history
    title: A fourth group, the Levites
    body: |
      The closing call names four groups where two earlier psalms name three, and the one added is the house of Levi. [[Ps. 115:9–11]] and [[Ps. 118:2–4]] call on Israel, the house of Aaron, and those who fear the LORD; the note on [[Ps. 115:11]] takes up who the last may be. The Levites are “sometimes spoken of as distinct from the priests,” and this psalm names them apart from the house of Aaron. Their work “was to assist the priests,” and they “acted as musicians.”
    sources: [lds-scriptures, bd-levites]

christ: |
  The LORD whom this psalm praises is Jehovah, whom Latter-day Saints know as Jesus Christ before His birth (see the note on [[Ps. 110:1]]). Verse 13 praises the name He gave at the burning bush. That name denotes “the eternal I Am,” and Jesus said of Himself, “Before Abraham was, I am” ([[John 8:58]]).

  The “peculiar treasure” of verse 4 is Sinai’s phrase ([[Ex. 19:5]]), and the ancient Greek translation’s words for it there are the words Paul uses when he writes that Jesus Christ “gave himself for us, that he might redeem us from all iniquity, and purify unto himself a peculiar people” ([[Titus 2:14]]).

explore: |
  - **The short hymn before it.** [[Ps. 134]], three verses, with the same opening call and the blessing out of Zion.
  - **The same history with a refrain.** [[Ps. 136]], which tells of Egypt, Sihon and Og, and the heritage, line by line.
  - **The idol lines at full length.** [[Ps. 115:4–8]], and Jeremiah’s chapter on the living God and the gods of the workmen, [[Jer. 10:1–16]].
  - **The Song of Moses.** [[Deut. 32:36–39]], where the line of verse 14 is followed by the question, “Where are their gods?”
  - **The peculiar treasure.** [[Ex. 19:5–6]], [[Deut. 7:6]], [[Mal. 3:17]] and [[1 Pet. 2:9]].

parallels:
  - ref: Ps. 134:1–3
    note: The opening call to the servants who stand in the LORD’s house, and the blessing “out of Zion” that verse 21 turns around.
  - ref: Ex. 19:5
    note: The LORD offers to make Israel “a peculiar treasure unto me above all people.”
  - ref: Jer. 10:13
    note: Verse 7, nearly word for word, in Jeremiah’s contrast of the living God with idols.
  - ref: Ex. 3:15
    note: “This is my name for ever, and this is my memorial unto all generations,” the words verse 13 says back to the LORD.
  - ref: Deut. 32:36
    note: The line of the Song of Moses that verse 14 quotes.
  - ref: Ps. 115:4–8
    note: The idol lines, which verses 15–18 repeat in shorter form.
  - ref: Ps. 136:17–22
    note: Sihon, Og and the heritage, in the same order.

