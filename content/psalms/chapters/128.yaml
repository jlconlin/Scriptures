chapter: 128
title: The Labour of Thine Hands
tagline: A song for the road to Jerusalem calls the one who fears the LORD happy, shows him at his own table with his wife and children, and then blesses him from Zion with the good of the city and peace on all Israel.
when: 'Undated; a song of degrees that names no author'

setting: |
  Psalm 128 is the ninth of the fifteen songs of degrees (Psalms 120–134), probably the songs of pilgrims on their way up to Jerusalem; the name is explained at [[Ps. 120:1]]. It names no author and no occasion, and it has no enemy in it.

  It is the companion of the psalm before it. Psalm 127 says that a house is built in vain “except the LORD build” it ([[Ps. 127:1]]), calls children “an heritage of the LORD” ([[Ps. 127:3]]), and ends, “Happy is the man that hath his quiver full of them” ([[Ps. 127:5]]). Psalm 128 takes up the house, the labour, the eating and the children, and it begins with the word the other ends on (see the note on verse 1). One older reading puts the difference this way: what makes a man happy is shown in Psalm 127 “as a gift coming as a blessing,” and in Psalm 128 “as a reward coming as a blessing.”

  The psalm also belongs with [[Ps. 112]], which opens with nearly the same sentence: “Blessed is the man that feareth the LORD.” The fear of the LORD itself is explained at [[Ps. 111:10]].

thread: |
  Psalm 128 **begins at one man’s table and ends with all Israel**. It opens with a general saying about “every one that feareth the LORD,” and its second line describes the same person by what he does: he “walketh in his ways.”

  In verse 2 the psalm stops speaking about him and speaks to him: “thou shalt eat.” The picture is drawn from the inside outward. First his hands and what they have earned, then his house with his wife in it, then his table with his children around it. Verse 4 steps back with “Behold” and repeats the opening, so that the scene is framed on both sides by the fear of the LORD. Nothing in the picture is grand. He eats what he worked for, and his wife and children are in the room.

  Verse 5 is the turn: the blessing is given a source. It comes “out of Zion,” and what it gives the man to see grows wider with each line: “the good of Jerusalem,” then his “children’s children,” then “peace upon Israel.” The household of verse 3 is where his happiness is seen. Its source is the LORD who dwells in Zion, and it is made complete in the good of the city and of the whole people. A song that started with what one man eats ends with a people.

sections:
  - range: 1-4
    heading: The happiness of the one who fears the LORD
    plain: |
      Happy is everyone who fears the LORD and walks in His ways. You will eat what your own hands have worked for; you will be happy, and it will go well with you. Your wife will be like a fruitful vine within your house, and your children like young olive trees around your table. See, this is how the man who fears the LORD is blessed.
  - range: 5-6
    heading: A blessing out of Zion
    plain: |
      The LORD will bless you from Zion, and you will see the good of Jerusalem all the days of your life. You will see your children’s children. Peace be upon Israel.

notes:
  - ref: 1
    phrase: Blessed is every one that feareth the LORD
    kind: words
    title: Blessed and happy are one word here; the blessing of verse 4 is another
    body: |
      “Blessed” in verse 1 and “happy” in verse 2 translate one Hebrew word, and “blessed” in verse 4 translates a different one. The King James hides the first link and suggests a second that is not there.

      The word of verses 1 and 2 is an exclamation about a person, “O happiness, blessedness of,” and a modern translation keeps it the same in both verses: “Happy is everyone who fears,” and “you shall be happy.” It is the word that opens the Psalter, and it is explained at [[Ps. 1:1]]. It is also the word that closes the psalm before this one: “Happy is the man that hath his quiver full” ([[Ps. 127:5]]).

      The word of verse 4, “thus shall the man be blessed,” is the verb of verse 5, “The LORD shall bless thee,” where the LORD is the one who acts. So the psalm’s two halves say different things in words the English blurs. Verses 1–2 call the man happy. Verses 4–5 say that he is blessed, and that the LORD is the one who blesses.
    sources: [biblehub-interlinear, bdb, nrsvue, lds-scriptures]

  - ref: 2
    phrase: thou shalt eat the labour of thine hands
    kind: scripture
    title: Eating what your own hands have earned
    body: |
      To eat the produce of one’s own work sounds like the least a person could hope for, and in the Law it is exactly what disobedient Israel is told it will lose. Among the curses of the covenant are these: “ye shall sow your seed in vain, for your enemies shall eat it” ([[Lev. 26:16]]); “thou shalt plant a vineyard, and shalt not gather the grapes thereof” ([[Deut. 28:30]]); “The fruit of thy land, and all thy labours, shall a nation which thou knowest not eat up” ([[Deut. 28:33]]).

      The psalm does not quote those chapters, but set against their warnings that enemies would devour the harvest, its plain picture becomes emphatic: the labour of the one who fears the LORD ends up on his own table. Isaiah promises the same to the Lord’s people: “they shall not plant, and another eat,” and “mine elect shall long enjoy the work of their hands” ([[Isa. 65:22]]).
    sources: [lds-scriptures, ellicott-psalms]

  - ref: 3
    phrase: by the sides of thine house
    kind: symbol
    title: A vine inside the house, olive shoots around the table
    body: |
      “By the sides of thine house” most likely means “within your house,” so that the wife, like the children, is pictured indoors. The King James wording suggests a vine trained up an outside wall. The Hebrew word means the “recess” or “innermost part” of a thing, here of a house, and a modern translation has “within your house.” One older reading says outright that the phrase is no part of the vine image and describes where the wife is: in “the privacy of the house.” The children are placed the same way, “round about thy table.” The verse fills in the room where the man of verse 2 sits down to eat.

      The “olive plants” are young trees, “olive shoots” in a modern translation, and the same older reading takes the point of the image to be their freshness and promise: the children are “fresh as young layered small olive-trees.”
    sources: [bdb, nrsvue, delitzsch-psalms]

  - ref: 5
    phrase: The LORD shall bless thee out of Zion
    kind: scripture
    title: The blessing comes from Zion
    body: |
      Verse 5 says where the man’s blessing comes from. The King James reads its lines as promises, “shall bless” and “shalt see.” A modern translation reads them as wishes spoken over him: “May you see the prosperity of Jerusalem.”

      “Out of Zion” names the place of the LORD’s sanctuary. An earlier psalm sets the two side by side: “Send thee help from the sanctuary, and strengthen thee out of Zion” ([[Ps. 20:2]]). The songs of degrees return to the thought twice before they end. On Zion “the LORD commanded the blessing, even life for evermore” ([[Ps. 133:3]]), and the last of the fifteen closes with this psalm’s own words: “The LORD that made heaven and earth bless thee out of Zion” ([[Ps. 134:3]]). The good things of verses 2–3 are in the man’s house, and the psalm says they come from Zion.

      The same verse sets his good beside the city’s. He is to see “the good of Jerusalem all the days of thy life,” and an earlier song of degrees says of the city, “Pray for the peace of Jerusalem: they shall prosper that love thee” ([[Ps. 122:6]]).
    sources: [nrsvue, lds-scriptures]

  - ref: 6
    phrase: and peace upon Israel
    kind: scripture
    title: Grandchildren, and a prayer for the whole people
    body: |
      The last verse gives the man a long life, measured in grandchildren, and then speaks peace on more than his family. Elsewhere in scripture, seeing one’s children’s children marks a full life: Job “saw his sons, and his sons’ sons, even four generations” ([[Job 42:16]]), and the proverb calls children’s children “the crown of old men” ([[Prov. 17:6]]).

      The closing words stand by themselves. The King James joins them to what the man will see by supplying “and,” which is marked as the translators’ addition. A literal translation has only “Peace on Israel!”, and a modern translation prints the words as a prayer by itself: “Peace be upon Israel!”

      The same line ends an earlier song of degrees, where the King James makes it a promise: “but peace shall be upon Israel” ([[Ps. 125:5]]). In Psalm 128 it comes after the man’s table, his city and his descendants, and the psalm’s last word is for the people he belongs to.
    sources: [biblehub-interlinear, nrsvue, lds-scriptures]

christ: |
  The LORD whom this man fears, and who blesses him out of Zion, is Jehovah, and Jehovah is the Savior before His birth; that is explained at [[Ps. 110:1]].

  The psalm itself puts Him at both ends of the man’s happiness. The life it calls happy is one that walks “in his ways,” and the good that fills the house in verses 2–3, the fruit of the man’s own labour included, is called in verses 4–5 the LORD’s blessing. The psalm before it says the same from the other side: “Except the LORD build the house, they labour in vain that build it” ([[Ps. 127:1]]).

explore: |
  - **The companion psalm.** [[Ps. 127]], on the house the LORD builds and on children as His heritage.
  - **The other portrait of the one who fears the LORD.** [[Ps. 112]].
  - **The blessings and curses behind verse 2.** [[Lev. 26:3–16]] and [[Deut. 28:1–14]], [[Deut. 28:30–33]]: who eats the harvest.
  - **The promise carried forward.** [[Isa. 65:21–23]], where the Lord’s people build and inhabit, plant and eat.
  - **Blessing from Zion at the end of the songs of degrees.** [[Ps. 133]] and [[Ps. 134]].

parallels:
  - ref: Ps. 127:1–5
    note: The companion psalm; it shares the house, the labour, the eating and the children, and it ends with the word that opens this one.
  - ref: Ps. 112:1
    note: Opens with nearly the same sentence about the man who fears the LORD.
  - ref: Deut. 28:33
    note: Among the covenant’s curses, a foreign nation eats Israel’s labours; verse 2 promises the reverse.
  - ref: Isa. 65:22
    note: The Lord’s elect “shall long enjoy the work of their hands.”
  - ref: Ps. 134:3
    note: The last song of degrees closes with “bless thee out of Zion.”
  - ref: Ps. 125:5
    note: An earlier song of degrees ends with the same words about peace on Israel.

sources: [lds-scriptures, bd-degrees-songs-of, biblehub-interlinear, bdb, nrsvue, delitzsch-psalms, ellicott-psalms, gs-jehovah]
