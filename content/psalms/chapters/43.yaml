chapter: 43
title: Send Out Thy Light and Thy Truth
tagline: Far from the house of God and seeming to himself cast off, the singer asks for a verdict, for two guides to bring him back to the altar, and tells his soul a third time to hope.
when: 'Undated; the psalm has no title'

setting: |
  Psalm 43 has no title, and it reads as the close of the psalm before it. It closes with the refrain that Psalm 42 sounds twice ([[Ps. 42:5]], [[Ps. 42:11]]), and its second verse repeats a line of that psalm almost word for word ([[Ps. 42:9]]). Many Hebrew manuscripts copy the two as a single psalm. The ancient Greek translation keeps them apart and gives this one a heading of its own, “A Psalm of David.” The note on verse 1 sets out the evidence.

  Read that way, the situation is the one Psalm 42 describes. The singer is far from the sanctuary, in “the land of Jordan, and of the Hermonites” ([[Ps. 42:6]]). He remembers going up “to the house of God, with the voice of joy and praise” ([[Ps. 42:4]]), and he is taunted every day with “Where is thy God?” ([[Ps. 42:10]]). Psalm 42’s title assigns the poem to the sons of Korah, who are explained there ([[Ps. 42:1]]).

  Psalm 43 does not name the “ungodly nation” or the “deceitful and unjust man,” and nothing in it fixes a date.

thread: |
  Psalm 42 remembers and complains. Psalm 43 asks. **The turn is at verse 3, where the “why” of verse 2 gives way to a request to be led.**

  The first two verses are a plea in a court. God is asked to give a verdict and to argue the singer’s case against an ungodly nation, and then the “why” of Psalm 42 returns with a stronger verb: the God who is his strength seems to have rejected him (verse 2).

  Verse 3 follows with a request. He asks God to send out His light and His truth as guides, and he names where they are to bring him: the holy hill and the dwelling of God. Verse 4 goes a step further and says what he will do when he arrives, at the altar and with the harp. In Psalm 42 the house of God was a memory ([[Ps. 42:4]]). Here it is a destination. On one older reading of the two psalms as a single poem in three parts, it is only in this third part that “complaint, resignation, and hope are perfected by the language of confident prayer.”

  Then the refrain comes a third time (verse 5). The singer still has to tell his soul to hope. The poem ends with praise promised, “I shall yet praise him,” and not yet given.

sections:
  - range: 1-2
    heading: A plea for a verdict
    plain: |
      Vindicate me, God, and argue my case against an ungodly nation. Rescue me from the deceitful and unjust. You are the God of my strength. Why have You rejected me? Why do I go about in mourning under the enemy’s oppression?
  - range: 3-4
    heading: Light and truth to lead him back
    plain: |
      Send out Your light and Your truth. Let them lead me and bring me to Your holy hill and to the place where You dwell. Then I will come to the altar of God, to God who is my greatest joy, and I will praise You with the harp, O God, my God.
  - range: 5
    heading: The refrain a third time
    plain: |
      Why are you bowed down, my soul, and why do you murmur within me? Hope in God, for I will praise Him yet, my deliverance and my God.

notes:
  - ref: 1
    phrase: Judge me, O God
    kind: structure
    title: Psalms 42 and 43 as one poem
    body: |
      Psalm 43 shares its refrain and a line with Psalm 42, and many manuscripts copy the two as one psalm. The refrain that closes this psalm has already closed two parts of that one: “Why art thou cast down, O my soul? and why art thou disquieted within me? hope thou in God: for I shall yet praise him, who is the health of my countenance, and my God” ([[Ps. 42:11]]; see also [[Ps. 42:5]]). The second half of verse 2 here is a line of that psalm unchanged: “why go I mourning because of the oppression of the enemy?” ([[Ps. 42:9]]). And Psalm 43, unlike Psalm 42, has no heading.

      The manuscripts differ. “In many Hebrew manuscripts Psalms 42 and 43 constitute one psalm.” The ancient Greek translation separates them and supplies this one with a title, “A Psalm of David.”

      Read as one poem, the shape is three stanzas, each ending in the same refrain ([[Ps. 42:1–5]]; [[Ps. 42:6–11]]; Psalm 43). “Judge me,” which opens the third, is explained at [[Ps. 26:1]].
    sources: [lds-scriptures, niv, lxx-rahlfs]
  - ref: 1
    phrase: an ungodly nation
    kind: words
    title: The word behind ungodly
    body: |
      “Ungodly” is two words in Hebrew, *lo hasid*, “not *hasid*,” and *hasid* is the adjective that belongs to *hesed*, the word behind the King James’s “lovingkindness” and “mercy” (explained at [[Ps. 51:1]]). The adjective means “kind, pious,” and it denotes the “active practice of” *hesed*; this phrase is glossed “a nation, not pious, = ungodly.”

      Who they are the psalm does not say. “Nation” is a Hebrew word for a nation or people, and a modern translation has “an ungodly people.” “The deceitful and unjust man” is singular in Hebrew; the same translation makes it plural, “those who are deceitful and unjust.” The psalm does not say whether one chief enemy is meant.
    sources: [oshb-wlc, bdb, nrsvue]
  - ref: 2
    phrase: why dost thou cast me off
    kind: words
    title: A harder word than forgotten
    body: |
      Verse 2 repeats a verse of Psalm 42 with a stronger verb. There the singer asks, “Why hast thou forgotten me?” ([[Ps. 42:9]]). Here the verb is one that means to “reject, spurn,” a word used elsewhere of God rejecting His people.

      The name he calls God by changes as well. “God my rock” in Psalm 42 becomes “the God of my strength,” which a modern translation gives as “the God in whom I take refuge.” The second question, about going in mourning under the enemy’s oppression, is carried over unchanged.
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]
  - ref: 3
    phrase: thy light and thy truth
    kind: symbol
    title: Two guides sent from God
    body: |
      Light and truth are pictured as two guides whom God sends out to lead the singer to the sanctuary. The Hebrew stresses them with a pronoun the King James folds into “them”: let *them* lead me. One older reading calls them “these two angels of God.”

      The same reading sets the verse beside two passages with the same vocabulary. Another psalm says, “God shall send forth his mercy and his truth” ([[Ps. 57:3]]). It has the same verb for sending and the same word for truth, with *hesed* (“mercy”) where this psalm has light. And in the song at the sea Israel sings, “Thou in thy mercy hast led forth the people which thou hast redeemed: thou hast guided them in thy strength unto thy holy habitation” ([[Ex. 15:13]]). “Led forth” there is the verb for “lead” here, and “mercy” is again *hesed*. That reading takes “light and truth” as “equivalent to mercy and truth,” namely “the light of mercy or loving-kindness which is coupled with the truth of fidelity to the promises.” It is one reading and not the only possible one. The verse is also compared with one in which the Lord is a “light to guide.”
    sources: [oshb-wlc, delitzsch-psalms, bdb, lds-scriptures]
  - ref: 3
    phrase: unto thy holy hill, and to thy tabernacles
    kind: history
    title: Hill, dwelling, altar
    body: |
      The place the guides are to bring him to is the sanctuary. The “holy hill” is explained at [[Ps. 24:3]]. “Tabernacles” is the plural of the Hebrew word for a dwelling, the word used of the tabernacle, and the lexicon sets this verse with those that use it of “God’s abode in Zion,” among them another psalm’s “How amiable are thy tabernacles, O LORD of hosts!” ([[Ps. 84:1]]).

      Verse 4 then draws in closer. From the hill and the dwelling he goes “unto the altar of God,” and from the altar “unto God my exceeding joy.”
    sources: [oshb-wlc, bdb]
  - ref: 5
    phrase: Why art thou cast down, O my soul?
    kind: words
    title: The singer speaks to his own soul
    body: |
      The refrain is the singer talking to himself. The verbs are feminine singular in Hebrew, addressed to “my soul,” which is a feminine noun. He questions his own distress and then gives it an order.

      Both verbs of the question are physical. “Cast down” is from a verb that means to bow or crouch and is used of a mourner’s bowing. In the form found here it means to “be cast down, despairing,” and that form is listed only for Psalms 42 and 43, every time of “my soul.” “Disquieted” is from a verb glossed “murmur, growl, roar, be boisterous.” It is used here of the soul “in discouragement” and elsewhere of the roar of waves.

      The answer is a command and a reason: “hope in God: for I shall yet praise him.” What he will praise God as is “the health of my countenance,” in Hebrew “the salvation of my face,” where “face” stands for the person. A modern translation has simply “my help and my God.”
    sources: [oshb-wlc, bdb, nrsvue]
  - ref: 5
    phrase: why art thou disquieted within me
    kind: christ
    title: The refrain and the Savior’s words in Gethsemane
    body: |
      In its ancient Greek form the refrain shares a word with what the Savior said of His own soul in Gethsemane. The Greek translation renders the refrain, “Wherefore art thou very sad, O my soul? and wherefore dost thou trouble me?” Its word for “very sad” is *perilypos*. In Gethsemane Jesus said, “My soul is exceeding sorrowful, even unto death” ([[Matt. 26:38]]), and “exceeding sorrowful” is the same Greek word, said of “my soul.” The comparison has been drawn where the refrain first appears ([[Ps. 42:5]]), and also with His earlier words, “Now is my soul troubled; and what shall I say? Father, save me from this hour: but for this cause came I unto this hour” ([[John 12:27]]).

      This is an echo and should be held as one: Psalm 43 has been listed among the psalms with “no direct relationship with the New Testament.” What the two texts share is one word, used in each of the speaker’s own soul.
    sources: [lxx-rahlfs, greek-nt, delitzsch-psalms, hilton-psalms-bom, lds-scriptures]

christ: |
  What the psalm says of the Lord is that He is the one who vindicates, who is the singer’s strength, who sends out light and truth, and who is Himself the “exceeding joy” at the end of the road.

  The nearest the psalm comes to the Savior’s life is its refrain. In Greek its word for the sorrowing soul is the word He used of His own soul in Gethsemane ([[Matt. 26:38]]); the note on verse 5 gives the evidence and its limits.

explore: |
  - **The whole poem.** Read [[Ps. 42:1–11]] and Psalm 43 together as one, marking the three refrains and what changes in the stanza before each.
  - **The Lord’s dwelling and altars.** [[Ps. 84:1–4]] speaks of the Lord’s “tabernacles” and His altars.

parallels:
  - ref: Ps. 42:5
    note: The refrain, sounded there twice (also Ps. 42:11) and here a third time.
  - ref: Ps. 42:9
    note: The line that verse 2 repeats, with “forgotten” where this psalm has “cast off.”
  - ref: Ps. 57:3
    note: God sends forth His mercy and His truth.
  - ref: Ex. 15:13
    note: The Lord leads His redeemed people in mercy to His holy habitation.
  - ref: Matt. 26:38
    note: The Savior’s words of His soul in Gethsemane, which share a Greek word with the refrain as the Greek translation has it.

