    note: The same flock and the same Maker, in the psalm this one echoes.
  - ref: Deut. 4:35
    note: “The LORD he is God,” said to Israel of what it had been shown.
  - ref: 1 Kgs. 18:39
    note: The same confession from the people on Carmel.
  - ref: Lev. 7:12
    note: The sacrifice of thanksgiving, the offering the title’s word can name.
  - ref: Jer. 33:11
    note: The opening words of verse 5, beside the thank offering brought to the LORD’s house.
  - ref: John 10:14
    note: Jesus is the good shepherd who knows His sheep.

