chapter: 100
title: Enter His Gates with Thanksgiving
tagline: The whole earth is called to the LORD’s house with a shout, and is given two reasons to come, that He made us and we are His, and that His mercy does not run out.
when: 'Undated; the title names no author'

setting: |
  Psalm 100 stands at the end of a run of psalms about the LORD’s rule. Three of them open with the cry “The LORD reigneth” ([[Ps. 93:1]]; [[Ps. 97:1]]; [[Ps. 99:1]]). This one has no such cry and does not use the word *king*. It is the short song that follows them, and on one older reading its place is deliberate: it closes the series as “the echo” of the first half of Psalm 95.

  It is a psalm of praise in the plain sense of the term: such psalms “often begin with a command or call to Israel to gather as a community (most importantly, at the temple) and praise the Lord,” and then say why. Psalm 100 does this twice in five verses. It names no author and no occasion. What it does show is a place. There are gates and courts to go through (verse 4), so the singers are at the LORD’s house or on their way to it (on going up to it in the Psalms, see [[Ps. 24:3]]), and the title’s word is the thanksgiving they are to bring (see the note on the title).

  No trouble is mentioned in it, no enemy, and no request.

thread: |
  The psalm is **two summonses, each with its reason**. Verses 1–2 call, and verse 3 says what the worshippers are to know. Verse 4 calls again, and verse 5 begins with “For.” Psalm 95 is built the same way through its first seven verses, and then turns to a warning ([[Ps. 95:8]]). Psalm 100 has the calls and the reasons and stops there.

  The calls are seven commands: make a joyful noise, serve, come, know, enter, be thankful, bless. They also move. The first is shouted to “all ye lands,” that is, to all the earth (see [[Ps. 66:1]], where the phrase is explained). The next bring the hearers “before his presence,” then through “his gates,” then into “his courts.” The psalm names no new audience on the way, and one older reading takes those who enter in verse 4 to be those called in verse 1, “the men of all nations,” as in a neighboring psalm’s “bring an offering, and come into his courts” ([[Ps. 96:8]]).

  The fourth command of the seven, the middle one, is “Know ye.” What is to be known is whose the worshippers are. The LORD is God; He made them; they are His people and His flock (verse 3).

  The second reason turns from the worshippers to Him. He is good, His mercy is everlasting, and His faithfulness lasts through every generation (verse 5). The psalm ends on that word about time: the generations change, and what they come to give thanks for does not.

sections:
  - range: 1-3
    heading: Come before Him, and know whose you are
    plain: |
      Shout for joy to the LORD, all the earth. Serve the LORD gladly; come into His presence with singing. Know that the LORD is God. He made us, and not we ourselves (or, as the Hebrew is read aloud, “and we are his”). We are His people, the sheep He pastures.
  - range: 4-5
    heading: Enter with thanks, for He is good
    plain: |
      Go in through His gates with thanksgiving and into His courts with praise. Give Him thanks and bless His name. For the LORD is good. His mercy lasts for ever, and His faithfulness through every generation.

notes:
  - ref: 0
    phrase: A Psalm of praise
    kind: words
    title: The title’s praise is the thanksgiving of verse 4
    body: |
      The word the King James translates “praise” in the title is the word it translates “thanksgiving” in verse 4, so the title names what the psalm goes on to ask for. The Hebrew is *todah*. The ancient Greek translation heads the psalm “A Psalm for Thanksgiving,” and a modern translation “A Psalm of thanksgiving.” The “praise” of verse 4 is a different Hebrew word.

      *Todah* is also the name of an offering (see [[Ps. 50:14]], where the two senses are set out). A standard lexicon divides its uses, and it puts verse 4 under “thanksgiving in songs of liturgical worship” and the title under the “thank-offering.” Read that way, the title means a psalm for the thank offering, which is “the sacrifice of thanksgiving” ([[Lev. 7:12]]). That offering was a kind of peace offering, and its flesh “shall be eaten the same day that it is offered” ([[Lev. 7:15]]).

      The title does not settle this by itself. It is two Hebrew words, “a psalm” and “for thanksgiving,” and the second can be the thanks or the offering.
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, lds-scriptures]
  - ref: 3
    phrase: Know ye that the LORD he is God
    kind: scripture
    title: Israel’s confession, addressed to all the earth
    body: |
      “The LORD he is God” is a sentence the Old Testament has elsewhere as Israel’s confession, and here it is addressed to all the earth. Moses says it twice in one speech. The first time it is of what Israel had been shown: “Unto thee it was shewed, that thou mightest know that the LORD he is God; there is none else beside him” ([[Deut. 4:35]]). The second is a command much like the psalm’s: “Know therefore this day, and consider it in thine heart, that the LORD he is God in heaven above, and upon the earth beneath: there is none else” ([[Deut. 4:39]]). On Carmel the people say it when the fire falls: “And when all the people saw it, they fell on their faces: and they said, The LORD, he is the God; the LORD, he is the God” ([[1 Kgs. 18:39]]).

      Moses’s words say what the sentence means: the LORD is God, and no other is. In Deuteronomy it is said to Israel, and on Carmel Israel says it. In this psalm it stands in a summons that opened with “all ye lands.” The likeness is in the wording; none of these verses cites another.
    sources: [lds-scriptures]
  - ref: 3
    phrase: and not we ourselves
    kind: words
    title: One letter between “not we ourselves” and “we are his”
    body: |
      The Hebrew of this phrase has come down in two forms, one letter apart, and they give two different sentences. The Hebrew text preserves both, as it does with this same pair of words in fifteen places: one form is written in the line (the *ketiv*) and another is given as the reading (the *qere*). As written, the word is “not,” which gives the King James’s “and not we ourselves.” As read, it is “his,” which gives “and we are his.” The ancient Greek translation follows the written form, “he made us, and not we ourselves.” A modern translation follows the form that is read and puts the other in a footnote: “It is he who made us, and we are his.”

      An older commentary weighs the two and finds that “both readings accord with the context,” but gives the form that is read “the preference,” among other reasons because of the parallel in [[Ps. 95:7]], where “he is our God” is followed at once by “we are the people of his pasture.” With that reading verse 3 says one thing three ways: we are His, His people, His flock.

      The difference is smaller than it looks. “Not we ourselves” denies that the worshippers are their own makers; “we are his” says who their owner is. Either way the verse goes on to say whose people and whose flock they are. The same commentary takes “made us” of more than creation: Israel is the LORD’s work “not merely as a people, but as the people of God.”
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, delitzsch-psalms, lds-scriptures]
  - ref: 5
    phrase: his mercy is everlasting
    kind: scripture
    title: The line Jeremiah hears beside the thank offering
    body: |
      The first half of the psalm’s last verse is a line the Old Testament has elsewhere, and Jeremiah sets it beside the thank offering. He promises that in the ruined cities of Judah there will again be heard “the voice of them that shall say, Praise the LORD of hosts: for the LORD is good; for his mercy endureth for ever: and of them that shall bring the sacrifice of praise into the house of the LORD” ([[Jer. 33:11]]). Jeremiah’s “his mercy endureth for ever” and the psalm’s “his mercy is everlasting” are the same two Hebrew words, and his “sacrifice of praise” is *todah*, the word in this psalm’s title. So Jeremiah has the line where the psalm has it, with thanksgiving at the LORD’s house. That shows the line in use there. It does not show that this psalm was what was sung. Other psalms open with the line: “O give thanks unto the LORD; for he is good: for his mercy endureth for ever” ([[Ps. 136:1]]; also [[Ps. 106:1]]).

      “Mercy” is *hesed*, which is explained at [[Ps. 51:1]]. “Truth” translates a word whose basic sense is “firmness, steadfastness, fidelity,” and a modern translation renders the pair “his steadfast love endures forever and his faithfulness to all generations.” So the second half of the verse is not about doctrine being correct. It says that He can be relied on, and for how long.
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]

christ: |
  The LORD whom the psalm calls all the earth to thank is Jehovah, and “Jehovah is the premortal Jesus Christ.” The psalm says two things of Him in verse 3: He made us, and we are “the sheep of his pasture.”

  Jesus said of Himself, “I am the good shepherd, and know my sheep, and am known of mine” ([[John 10:14]]). The fuller account of Jehovah as shepherd and of the title Jesus claimed is at [[Ps. 23:1]].

explore: |
  - **The longer version of the call.** [[Ps. 95:1–7]] has the same shout, the same thanksgiving and the same flock, and then the warning this psalm leaves out.
  - **The thank offering.** [[Lev. 7:11–15]] for the offering itself, and [[Jer. 33:10–11]] for its song heard again in Jerusalem.
  - **The nations at the LORD’s house.** [[Ps. 96:7–9]] and [[Isa. 2:2–3]].
  - **The shepherd and His flock.** [[John 10:1–16]], with [[Ezek. 34:11–16]].

parallels:
