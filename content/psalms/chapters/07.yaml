chapter: 7
title: Judge Me, O LORD
tagline: Accused of something he says he has not done, David stakes his life on an oath, calls the Judge of all peoples to hear his case, and sees the slanderer fall into the pit he dug.
when: 'By its title, David’s, sung over the words of Cush the Benjamite; the occasion is not recorded elsewhere'

setting: |
  The title ascribes the psalm to David and gives it an occasion that the narrative books do not record: something said by a Benjamite named Cush (see the two notes on the title). The psalm itself shows what kind of words they were. David is pursued, he swears that he has not done what is charged, and he asks God to judge.

  Benjamin was the tribe of Saul, and David’s recorded conflicts with Benjamites fall in two periods: the years when Saul hunted him (1 Samuel 24–26) and the troubles of his own reign (2 Samuel 16 and 20). The title does not say which. The notes here read the psalm beside 1 Samuel 24–26, where David twice spares Saul and appeals to the LORD as judge between them; one older reading finds the psalm full of references to that time.

  The psalm’s line about the God who “trieth the hearts and reins” is prayed by Jeremiah ([[Jer. 11:20]]) and spoken in Revelation by the Son of God ([[Rev. 2:23]]), and its image of the pit appears again in Nephi’s prophecy ([[1 Ne. 22:14]]).

thread: |
  Psalm 7 is a case brought to court. Someone has said something about David, and **David takes the accusation to the one Judge who can try it.**

  It opens with refuge and danger (verses 1–2): many pursuers, and one among them like a lion. Then David swears (verses 3–5). If he has done “this,” if there is wrong on his hands, let the enemy run him down and tread his life into the earth. He names no evidence and calls no witness. The psalm gives only his oath, and the Selah falls on it.

  Having sworn, he summons the Judge (verses 6–9). The scale changes at once. The peoples gather, the LORD is above them, and David’s case becomes one among the cases of the world: “The LORD shall judge the people: judge me, O LORD.”

  The turn comes at verse 10. Through verse 9 David keeps calling on the LORD by name (“O LORD my God,” “Arise, O LORD,” “judge me, O LORD”); from verse 10 he no longer addresses Him and speaks about Him. No verdict is announced and nothing is reported to have happened. The psalm simply describes the Judge, who is righteous and whose weapons are ready (verses 11–13), and then the accuser, whose evil comes back on his own head (verses 14–16).

  One word holds the psalm together. David asks to be judged “according to my righteousness” (verse 8) and ends by praising the LORD “according to his righteousness” (verse 17), the same Hebrew noun with a different owner. Between the two, God is “the righteous God” (verse 9) and, in the Hebrew of verse 11, a righteous judge. A psalm that begins with one man’s innocence ends with God’s justice.

sections:
  - range: 1-2
    heading: Refuge from the lion
    plain: |
      LORD my God, I have taken refuge in You. Save me from all who pursue me, and rescue me, or he will tear me like a lion and rip me to pieces with no one to rescue.
  - range: 3-5
    heading: The oath
    plain: |
      LORD my God, if I have done this, if there is wrong on my hands, if I have paid back with evil the one who was at peace with me (I, who rescued the man who was my enemy for no cause), then let the enemy chase me down and seize me. Let him trample my life into the ground and lay my honor in the dust.
  - range: 6-9
    heading: The Judge is summoned
    plain: |
      Rise up, LORD, in Your anger. Lift Yourself up against the fury of my enemies, and wake for me to the judgment You have commanded. Let the assembled peoples surround You; take Your place on high above them (the King James has “return thou on high”). The LORD judges the peoples. Judge me, LORD, by my righteousness and by the integrity that is in me. Let the evil of the wicked come to an end, and make the righteous stand firm, for the righteous God tests hearts and inmost feelings.
  - range: 10-13
    heading: A righteous judge with weapons ready
    plain: |
      My shield is with God, who saves the upright in heart. God is a righteous judge (the King James has “God judgeth the righteous”), a God who is indignant every day. If he does not turn back, he will sharpen his sword; he has bent his bow and made it ready (who each “he” is, see the note on verse 12). He has prepared deadly weapons for him and readies his arrows against the persecutors.
  - range: 14-16
    heading: The pit
    plain: |
      Look at him: he is in labor with wickedness, he has conceived trouble, and he gives birth to a lie. He dug a pit and hollowed it out, and he has fallen into the hole he made. His trouble comes back on his own head, and his violence comes down on his own skull.
  - range: 17
    heading: The vow of praise
    plain: |
      I will praise the LORD as His righteousness deserves, and sing praise to the name of the LORD Most High.

notes:
  - ref: 0
    phrase: Shiggaion
    kind: words
    title: Shiggaion
    body: |
      Shiggaion is a name for the kind of song this is, and its meaning is uncertain. The word stands in this title and, in the plural, over the prayer of Habakkuk, “upon Shigionoth” ([[Hab. 3:1]]). The two together “may refer to the irregular erratic style of the compositions.”

      It is a “doubtful word.” One derivation is from a verb meaning to go astray or reel, which would make a Shiggaion a “wild, passionate song, with rapid changes of rhythm.” The ancient Greek translators did not keep the word and wrote only “A Psalm of David.”

      What a title is, and what it is worth as evidence, is discussed under the title of Psalm 3 ([[Ps. 3:1]]).
    sources: [bd-psalms, bdb, lxx-rahlfs, oshb-wlc, lds-scriptures]
  - ref: 0
    phrase: Cush the Benjamite
    kind: history
    title: Cush the Benjamite
    body: |
      Cush is otherwise unknown: the title gives his tribe and says that David sang about his words, and that is all. The story “is not included elsewhere in the biblical record.”

      His tribe may point toward Saul. Saul was a Benjamite ([[1 Sam. 9:21]]) and addressed the servants around him as “ye Benjamites” ([[1 Sam. 22:7]]). One older reading therefore takes Cush for “one of the many servants of Saul,” a talebearer who slandered David to the king. That is an inference, though the narrative has room for it. Outside the cave David asks Saul, “Wherefore hearest thou men’s words, saying, Behold, David seeketh thy hurt?” ([[1 Sam. 24:9]]).

      It is not the only possibility. David’s recorded conflicts with Benjamites also include 2 Samuel 16, where Shimei, “a man of the family of the house of Saul,” cursed David as he fled Jerusalem ([[2 Sam. 16:5]]), and David called him “this Benjamite” ([[2 Sam. 16:11]]). The title names neither time.
    sources: [ot-minute-psalms-1-20, delitzsch-psalms, lds-scriptures]
  - ref: 3
    phrase: if I have done this
    kind: scripture
    title: An oath with his life as the stake
    body: |
      David answers the accusation with an oath: if he has done it, let the enemy take his life. The form is three ifs (verses 3–4) and then the penalty he calls down on himself (verse 5), which is pursuit, capture, and his life trodden into the earth.

      The psalm never says what “this” is.

      The oath can be set beside what David said to Saul. At the cave he said, “there is neither evil nor transgression in mine hand” ([[1 Sam. 24:11]]), and the second time, “what evil is in mine hand?” ([[1 Sam. 26:18]]). The psalm says, “if there be iniquity in my hands.” On that reading, which is one among others, “him that was at peace with me” is said “with reference to Saul.”
    sources: [ot-minute-psalms-1-20, delitzsch-psalms, lds-scriptures]
  - ref: 4
    phrase: yea, I have delivered him that without cause is mine enemy
    kind: words
    title: The line in parentheses
    body: |
      The King James Version reads this line as a protest that interrupts the oath, and other translations read it as one more charge that David denies. The difference is one Hebrew verb.

      In poetry the verb can mean “rescue, deliver,” and “but I delivered” is the King James’s choice. Read so, David breaks off his “if” to say that he has in fact rescued a man who was his enemy for no reason. The narrative twice tells of David sparing Saul’s life (1 Samuel 24 and 26).

      Others take the verb as “spoiled, despoiled,” though it has that sense “only in Aramaic.” The New Revised Standard Version follows that sense and keeps the whole sentence inside the oath, so that “if I have repaid my ally with harm” is followed by a second charge, “or plundered my foe without cause.”
    sources: [bdb, nrsvue, lds-scriptures]
  - ref: 7
    phrase: return thou on high
    kind: words
    title: The Judge takes His seat
    body: |
      Verses 6–8 ask the LORD to hold court, with the nations gathered around Him and Himself above them as judge. The cry “Arise, O LORD” was heard in [[Ps. 3:7]]; here it leads to “the judgment that thou hast commanded.”

      The court is larger than the case. “People” in verse 7 and in verse 8 is plural in the Hebrew, and the ancient Greek has “the congregation of the nations.” David sets his own cause inside the judgment of all peoples.

      “Return thou on high” is the difficulty. As the King James words it, the line “appears to depict the psalmist telling the Lord to flee back to His hiding place.” The Hebrew verb is “return,” and translators have handled it in two ways. The New International Version renders the line “while you sit enthroned over them on high.” The New Revised Standard Version prints “over it take your seat on high” and says in a footnote that the Hebrew reads “return.” In both, the LORD does not leave the assembly. He presides over it.
    sources: [ot-minute-psalms-1-20, niv, nrsvue, lxx-rahlfs, oshb-wlc]
  - ref: 8
    phrase: according to my righteousness
    kind: scripture
    title: Righteous in this matter
    body: |
      The righteousness David asks to be judged by is the innocence he claims of the thing he is accused of. The psalm shows him persecuted “for something of which he believes he is innocent.”

      In 1 Samuel 24–26, where conflicts of his with Benjamites are recorded, he makes an appeal of the same kind to Saul’s face: “The LORD therefore be judge, and judge between me and thee” ([[1 Sam. 24:15]]), and later, “The LORD render to every man his righteousness and his faithfulness” ([[1 Sam. 26:23]]). Saul answered, “Thou art more righteous than I” ([[1 Sam. 24:17]]).
    sources: [ot-minute-psalms-1-20, lds-scriptures]
  - ref: 9
    phrase: the righteous God trieth the hearts and reins
    kind: christ
    title: He who searches the reins and hearts
    body: |
      The words this line uses of the righteous God, that He tries hearts and reins, are spoken in Revelation by the Son of God of Himself. “Reins” are the kidneys, which in Hebrew stand for the “seat of emotion and affection” and so, with the heart, for what God examines in a person. “Reins” is explained at [[Jer. 11:20]], where Jeremiah prays to the LORD “that judgest righteously, that triest the reins and the heart.”

      In Jeremiah the LORD says it of Himself: “I the LORD search the heart, I try the reins, even to give every man according to his ways” ([[Jer. 17:10]]). In Revelation the speaker is “the Son of God” ([[Rev. 2:18]]), and He says, “all the churches shall know that I am he which searcheth the reins and hearts: and I will give unto every one of you according to your works” ([[Rev. 2:23]]).
    sources: [bdb, oshb-wlc, lds-scriptures]
  - ref: 11
    phrase: God judgeth the righteous
    kind: words
    title: A righteous judge
    body: |
      The Hebrew of this verse says that God is a righteous judge, and it has no word for the wicked. The New Revised Standard Version has “God is a righteous judge” for the first half and “a God who has indignation every day” for the second, and the ancient Greek begins the same way. The King James Version has “the righteous” as the ones judged, and adds “with the wicked.”

      Read with the Hebrew, the verse is about the Judge and not about two classes of people. The first half says whose indignation the second half speaks of: a judge’s, and a righteous one’s.

      “Righteous” here is the word of verse 9, where it is both “the just” whom David asks God to establish and “the righteous God.”
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs]
  - ref: 12
    phrase: If he turn not, he will whet his sword
    kind: words
    title: Who turns, and who whets the sword
    body: |
      On one reading, the first “he” of this verse is the sinner who may turn and the second is God, who whets the sword. The Hebrew has only “he,” so that in the King James Version “it is not clear whether the speaker is referring to God or the wicked person.” The New Revised Standard Version decides by naming them, “If one does not repent, God will whet his sword,” and notes that the Hebrew has “he.” From verse 14 on, “he” is the wicked man.

      The sword is being sharpened and the bow is already bent, but the sentence begins with “if.” On the same reading the weapons picture God’s anger, and “it is only the divine forbearance that prevents it from immediately breaking forth.”
    sources: [ot-minute-psalms-1-20, nrsvue, oshb-wlc, delitzsch-psalms]

christ: |
  The psalm’s hope is a judge who is righteous and who tries the heart. The LORD to whom David appeals is Jehovah, the premortal Jesus Christ. The Savior said that the Father “hath committed all judgment unto the Son” ([[John 5:22]]), and in Revelation He says of Himself that He searches the reins and hearts (see the note on verse 9). The Church’s edition of the Bible ties the word “judge” in verse 8 to its Topical Guide entry on Jesus Christ as Judge.

explore: |
  - **David and Saul at the cave.** [[1 Sam. 24:8–22]] and [[1 Sam. 26:17–25]], where David pleads his innocence and leaves the judgment to the LORD.
  - **Him that judgeth righteously.** Jeremiah’s prayer in [[Jer. 11:18–20]], and Peter’s account of how the Savior answered those who reviled Him ([[1 Pet. 2:21–23]]).
  - **The pit.** [[Ps. 9:15–16]] and [[1 Ne. 22:13–14]].
  - **The other Shiggaion.** Habakkuk’s prayer, [[Hab. 3:1–19]].

parallels:
  - ref: 1 Sam. 24:9–17
    note: David tells Saul there is no evil in his hand and asks the LORD to judge between them; Saul calls him the more righteous.
  - ref: 1 Sam. 26:18–23
    note: David’s second appeal, after sparing Saul again.
  - ref: Jer. 11:20
    note: Jeremiah prays to the LORD who judges righteously and tries the reins and the heart (also Jer. 17:10; 20:12).
  - ref: Rev. 2:23
    note: The Son of God says that He searches the reins and hearts.
  - ref: Ps. 9:15–16
    note: The nations sunk in the pit they made.
  - ref: 1 Ne. 22:14
    note: Those who fight against Israel fall into the pit they dug (also 1 Ne. 14:3).

