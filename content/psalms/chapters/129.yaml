chapter: 129
title: Yet They Have Not Prevailed
tagline: Israel looks back on a lifetime of being ploughed like a field, says who cut the cords, and wishes those who hate Zion the end of grass on a roof.
when: 'Undated; the title names no author and the psalm no occasion'

setting: |
  The title puts Psalm 129 among the songs of degrees; the note on the title at [[Ps. 120:1]] explains the name. It names no author, and the psalm names no king, no enemy, and no battle.

  The speaker is a nation talking as one person. “May Israel now say” hands the congregation its line, and the line is then said again and carried forward, as in [[Ps. 124:1–2]], where the form is explained. This psalm too is sung after a rescue: one older reading finds in it “the situation of a deliverance that has been experienced,” from which it looks “gratefully back and confidently forward.”

  What Israel looks back on is long. “Many a time” covers every trouble of the nation’s life without choosing one, and which rescue was the latest is not said.

  The psalm before this one closes with a blessing: “The LORD shall bless thee out of Zion” ([[Ps. 128:5]]). Psalm 129 closes with those who hate Zion, and with a blessing that nobody says.

thread: |
  Psalm 129 has two halves, a memory (verses 1–4) and a wish (verses 5–8), and **both are pictures from the farm: in the first Israel is the field, and in the second its enemies are the crop.**

  The memory is of being worked like ground. Ploughmen went over Israel’s back and made their furrows long (verse 3). The psalm turns twice inside this half. Verse 2 turns on one word, “yet”: all of that happened, and Israel is still here to say so. Verse 4 gives the reason, and gives it before it gives the act: “The LORD is righteous.” Then the act, in one stroke: He cut the cords.

  The wish begins at verse 5 and asks that those who hate Zion be shamed and turned back. Then the farm returns, with the parts changed. Those who hate Zion are now what grows, and what grows is grass on a housetop, which withers before it is grown. Nothing is reaped from it (verse 7), and so nobody walks past and calls out a blessing to the harvesters (verse 8).

  The psalm that began with a field ploughed long ends with a harvest that never happens. Those who hate Zion come to nothing in it, and the people that was ploughed is the one left to sing.

sections:
  - range: 1-4
    heading: What they did, and who stopped it
    plain: |
      They have afflicted me again and again since I was young (let Israel say it), again and again since I was young, and still they have not overcome me. Ploughmen ploughed across my back and drove their furrows long. The LORD is just: He has cut the cords of the wicked.
  - range: 5-8
    heading: Grass on the housetops
    plain: |
      May all who hate Zion be put to shame and turned back. May they be like grass on a rooftop, which withers before it has grown. No reaper gets a handful of it, and no binder of sheaves an armful. And no one passing by calls out, “The blessing of the LORD be upon you! We bless you in the name of the LORD.”

notes:
  - ref: 1
    phrase: from my youth
    kind: history
    title: The youth of Israel was Egypt
    body: |
      The “me” of the psalm is the whole people, and scripture places that people’s youth in Egypt. Verse 1 says who is speaking: “may Israel now say.” The psalm does not say when the nation was young. Hosea does, in the verse a modern translation’s cross-references set beside this one: Israel will sing “as in the days of her youth, and as in the day when she came up out of the land of Egypt” ([[Hosea 2:15]]). He speaks of the nation as a child in the same way: “When Israel was a child, then I loved him, and called my son out of Egypt” ([[Hosea 11:1]]).

      Read so, the affliction the psalm remembers goes back to the bondage in Egypt ([[Ex. 1:11–12]]), where the nation began, and “many a time” covers everything since. The psalm lists none of it. Its one statement about all of it is the second half of verse 2.
    sources: [lds-scriptures, nrsvue]

  - ref: 3
    phrase: The plowers plowed upon my back
    kind: symbol
    title: A people ploughed like a field
    body: |
      The picture makes Israel’s back the ground and its oppressors the men who plough it, and on one older reading the cords of verse 4 belong to the same picture. On that reading the oppressors used “the stretched-forth back of the people” “as though it were arable land,” and set no limit to it: “they made long their furrows.” Isaiah has a like posture, forced on Jerusalem by tormentors who said, “Bow down, that we may go over,” so that “thou hast laid thy body as the ground, and as the street, to them that went over” ([[Isa. 51:23]]).

      The word for the cords in verse 4 is, on the same reading, “suggested by the metaphor” of verse 3, and the passage to set beside it is the LORD’s question to Job about the wild ox: “Canst thou bind the unicorn with his band in the furrow?” ([[Job 39:10]]). There the band is what ties the animal to its ploughing. They are also the cords “with which they held Israel bound.” The LORD does not loosen them. A modern translation has simply “he has cut the cords of the wicked.”

      The verse gives the reason before the act: “The LORD is righteous.” On the same older reading the line states “an universal truth, which has been verified in the present circumstances.” Verse 2 said that the oppressors did not prevail; verse 4 says why.
    sources: [delitzsch-psalms, nrsvue, lds-scriptures]

  - ref: 5
    phrase: that hate Zion
    kind: words
    title: What is asked for those who hate Zion
    body: |
      The wish of verses 5–8 is that Zion’s enemies fail, and it names them by what they hate and not by their nation. What is asked is that they be “confounded and turned back,” which a modern translation gives as “put to shame and turned backward”: “confounded” here is shamed, and the attack is to end as an embarrassment and a retreat. The verses after it ask that they come to nothing. The cursing psalms as a whole are taken up at [[Ps. 137:8]].
    sources: [nrsvue]

  - ref: 6
    phrase: the grass upon the housetops
    kind: symbol
    title: Grass on a roof, and no harvest
    body: |
      Grass on a housetop grows where nothing is ever harvested, and verses 6–8 follow it to the harvest and the greeting it never reaches. The roofs of Israel’s houses “were invariably flat,” and the verse has grass coming up on them that “withereth afore it groweth up,” or in a modern translation “withers before it grows up.”

      Isaiah has the same picture. In the LORD’s answer about Sennacherib king of Assyria, the people of the cities he laid waste “were of small power, they were dismayed and confounded: they were as the grass of the field, and as the green herb, as the grass on the housetops, and as corn blasted before it be grown up” ([[Isa. 37:27]]; the same words are in [[2 Kgs. 19:26]]). Isaiah’s verse has “confounded” and the roof grass together, as verses 5 and 6 of the psalm do.

      Verse 7 takes the grass to reaping time. In a modern translation it is grass “with which reapers do not fill their hands,” nor “binders of sheaves their arms.” Verse 8 goes one step further. It takes for granted that people passing a harvest field call a blessing to those at work in it, and here no one does, because there is no harvest to greet. In the picture nobody cuts the grass down: it withers before it is grown and leaves nothing to gather.
    sources: [lds-scriptures, bd-house, nrsvue]

christ: |
  The LORD who cut the cords is Jehovah, who is Jesus Christ before His birth ([[Ps. 110:1]] has the note). The one reason the psalm gives for Israel’s survival is that He is righteous (verse 4).

  Israel’s line in verse 2 is “yet they have not prevailed against me.” A modern translation’s cross-references set beside it the Savior’s promise about His Church: “the gates of hell shall not prevail against it” ([[Matt. 16:18]]).

explore: |
  - **The same call, another rescue.** [[Ps. 124:1–8]], the other song of degrees that begins with a line for Israel to say.
  - **Those who fight against Zion.** [[1 Ne. 22:14–19]]; [[2 Ne. 6:12–13]]; [[Isa. 29:7–8]].
  - **A harvest that does come.** [[Ps. 126:5–6]], three psalms earlier, where the sower comes home with his sheaves, and [[Ruth 2:4]], where Boaz and his reapers trade a harvest blessing like the one in verse 8.

parallels:
  - ref: Ps. 124:1
    note: Another song of degrees that gives Israel a line to say and then says it again.
  - ref: Hosea 2:15
    note: The days of Israel’s youth, when she came up out of Egypt; the “youth” of verse 1.
  - ref: Isa. 51:23
    note: Jerusalem’s body laid “as the ground” for her tormentors to go over.
  - ref: Isa. 37:27
    note: The peoples Assyria overran, “as the grass on the housetops” (also 2 Kgs. 19:26).
  - ref: Ruth 2:4
    note: Boaz and his reapers exchange a harvest blessing.
  - ref: 1 Ne. 22:14
    note: “All that fight against Zion shall be destroyed.”

sources: [lds-scriptures, bd-house, gs-jehovah, delitzsch-psalms, nrsvue]
