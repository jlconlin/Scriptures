chapter: 140
title: Adders’ Poison Under Their Lips
tagline: A man hunted by slanderers asks the LORD to keep him, asks that their words fall back on their own heads, and ends sure that the LORD takes the case of the poor.
when: 'By its title, David’s; no occasion is given'

setting: |
  The psalm gives no occasion. Its title names David and nothing more, and the prayer names no enemy, no place and no year. One older reading holds that it “may be explained from the circumstances of the rebellion of Absalom.” That is a proposal, and nothing in the psalm settles it. (For “To the chief Musician,” see [[Ps. 8:1]].)

  What the psalm does show is the kind of trouble. The enemies plan in their hearts, sharpen their tongues, and hide traps beside the road, and they are “gathered together for war.” The speaker speaks of battle too: God has covered his head “in the day of battle” (verse 7).

  The psalm is a lament (see [[Ps. 22:1]]), and it has near relations in the book. The same older reading finds Psalms 58 and 64 “very similar,” and the two psalms that follow this one pray against the same snares ([[Ps. 141:9]]; [[Ps. 142:3]]).

  Paul quotes verse 3 in his letter to the Romans ([[Rom. 3:13]]).

thread: |
  The enemies of Psalm 140 fight with their mouths. They have tongues like a serpent’s and poison under their lips (verse 3), and the last name the psalm gives one of them is “an evil speaker” (verse 11), a slanderer. **The speaker answers with his own voice, and the psalm follows that voice from plea to certainty.**

  It begins with two pleas of the same build, “Deliver me, O LORD” (verses 1–3) and “Keep me, O LORD” (verses 4–5). Each asks for protection, uses the line “preserve me from the violent man,” goes on to say what the enemies have done, and closes with Selah (see [[Ps. 3:2]]). The first describes their tongues, the second their traps.

  The third part is the speaker’s own speech: “I said unto the LORD, Thou art my God” (verse 6). He has one fact to set against the plotting, that God has covered his head in the day of battle (verse 7), and one request, that the wicked not get what they want (verse 8).

  Then come the wishes against the enemy (verses 9–11). They ask that the harm go back where it came from: the mischief of their lips on their own heads, and evil hunting the man who set the traps.

  The turn is at verse 12, “I know.” The psalm tells of no rescue between the wishes and this line. On one older reading the speaker’s own “rage has spent itself,” and what follows is confidence that the LORD takes up the cause of the afflicted. The last verse gives the mouth its right use. Lips that carried poison opened the psalm, and it closes with the righteous giving thanks to God’s name.

sections:
  - range: 1-3
    heading: Deliver me from the evil man
    plain: |
      Deliver me, LORD, from the evil man; guard me from the man of violence. They plot harm in their hearts and are always mustering for war. They have sharpened their tongues like a serpent’s, and the poison of adders is under their lips.
  - range: 4-5
    heading: They have spread a net by the wayside
    plain: |
      Keep me, LORD, from the hands of the wicked; guard me from the man of violence, from those who mean to trip my steps. The proud have hidden a snare for me, and cords; they have spread a net beside the path and set traps for me.
  - range: 6-8
    heading: Thou art my God
    plain: |
      I said to the LORD, “You are my God; hear the voice of my pleading, LORD.” O GOD the Lord, the strength that saves me, You covered my head in the day of battle. Do not give the wicked what they desire, LORD; do not let their plot succeed, or they will exalt themselves.
  - range: 9-11
    heading: Let the mischief of their own lips cover them
    plain: |
      As for the heads of those who surround me, let the mischief of their own lips cover them. Let burning coals fall on them; let them be thrown into the fire, into deep pits, never to rise again. Let no slanderer be established in the land; evil will hunt the man of violence until it overthrows him.
  - range: 12-13
    heading: The cause of the afflicted
    plain: |
      I know that the LORD will uphold the cause of the afflicted and the right of the poor. Surely the righteous will give thanks to Your name; the upright will dwell in Your presence.

notes:
  - ref: 1
    phrase: the evil man
    kind: history
    title: One enemy or many
    body: |
      The “evil man” and the “violent man” are not one man but a kind of man, and there are many of them, as the next words show: “Which imagine mischiefs in their heart; continually are they gathered together for war” (verse 2). The verse passes from one man to “they” without a break, and that clause shows that “the violent man” is not meant “exclusively of one person.” A modern translation makes the plural plain from the start. Its first line is “Deliver me, O Lord, from evildoers;” and its second asks, “protect me from those who are violent”.

      The psalm never names them. It tells what they are by what they do: they plot in the heart (verse 2), wound with the tongue and lips (verse 3), and lay traps with the hands (verses 4–5). In verse 5 they are “the proud.” The speaker stands alone against them, as his words show: “me,” “my goings,” “my head.”
    sources: [nrsvue, delitzsch-psalms]
  - ref: 3
    phrase: adders’ poison is under their lips
    kind: scripture
    title: Paul says it of everyone
    body: |
      Paul quotes this line of all humankind, where the psalm says it of the speaker’s enemies. It stands in the chain of scriptures he brings in Romans 3, joined to a line of [[Ps. 5:9]]: “Their throat is an open sepulchre; with their tongues they have used deceit; the poison of asps is under their lips” ([[Rom. 3:13]]). Paul’s “asps” for the psalm’s “adders” is the wording of the ancient Greek translation, which in its English rendering has his line word for word: “the poison of asps is under their lips.”

      In the psalm the line draws a boundary. On one side are the proud with their venom, and on the other the afflicted, the righteous and the upright (verses 12–13). Paul removes the boundary. He has “proved both Jews and Gentiles, that they are all under sin” ([[Rom. 3:9]]), and the quotations are his evidence, brought “that every mouth may be stopped” ([[Rom. 3:19]]). The note on [[Ps. 14:3]] follows his argument to its end.
    sources: [lds-scriptures, lxx-rahlfs]
  - ref: 5
    phrase: they have spread a net by the wayside
    kind: symbol
    title: The hunter’s gear
    body: |
      Verse 5 lists a hunter’s whole kit, a snare, cords, a net and gins, and the picture is of a man stalked as game. A gin was “a trap; a snare.” A modern translation has “a trap,” a net spread with cords, and snares set “along the road.”

      Two details say what kind of danger this is. The traps are hidden, so the attack is one the victim cannot see coming. And the traps lie “by the wayside,” on the path the speaker walks; verse 4 had said that they “purposed to overthrow my goings.” The enemies do not come out to meet him. They wait for him to walk into what they have laid.

      The psalm turns the image around before it ends: “evil shall hunt the violent man to overthrow him” (verse 11). The verb of verse 4, “overthrow,” comes back in the King James upon the man who planned it, and the hunter becomes the quarry. The next two psalms keep the image. One asks, “Keep me from the snares which they have laid for me, and the gins of the workers of iniquity” ([[Ps. 141:9]]), and the other complains, “In the way wherein I walked have they privily laid a snare for me” ([[Ps. 142:3]]).
    sources: [webster-1828, nrsvue, lds-scriptures]
  - ref: 7
    phrase: thou hast covered my head in the day of battle
    kind: symbol
    title: God as the helmet
    body: |
      The speaker says that God was his helmet. To cover the head in the day of battle is a helmet’s work, and the verse gives that work to God, whom it calls “the strength of my salvation.” The King James puts the covering in the past, as a thing done. On one older reading the Hebrew verb tells what God does when the day of battle comes: He protects “the head of His anointed against the deadly blow.” On either reading it is the speaker’s ground for asking now.

      The same older reading sets the verse beside Isaiah’s picture of the LORD arming Himself: “he put on righteousness as a breastplate, and an helmet of salvation upon his head” ([[Isa. 59:17]]).

      The address, “O GOD the Lord,” joins two names. “GOD” in capitals stands for the divine name, as “LORD” does elsewhere. The second, “the Lord,” is the word for a master; a modern translation renders it “my Lord.” The note on [[Ps. 110:1]] explains the two.
    sources: [delitzsch-psalms, lds-scriptures, oshb-wlc, nrsvue]
  - ref: 10
    phrase: Let burning coals fall upon them
    kind: scripture
    title: What the curse asks for
    body: |
      The curse of verses 9–11 asks that the enemies’ own harm come back on them, and it leaves the doing to God. How such prayers are to be read is taken up at [[Ps. 137:8]]. Two things are this psalm’s own.

      The first is the measure. The opening wish is “let the mischief of their own lips cover them” (verse 9), and the last is that evil “hunt the violent man” (verse 11), as the proud had hunted the speaker with their traps (verse 5). The one who is not to be established in the earth is the “evil speaker,” in Hebrew *a man of tongue*, the same word as the sharpened tongues of verse 3; a modern translation has “the slanderer.” So these wishes hand back what the enemies did. Another psalm of David states the rule: “His mischief shall return upon his own head” ([[Ps. 7:16]]). Verse 10 adds coals, fire and deep pits, and it does not say who is to send them: the verse has “let,” and no hand is named.

      The second is that the speaker does nothing. Every request is addressed to the LORD (“Grant not, O LORD”) or left as a wish, and the psalm ends with the cause in the LORD’s keeping (verse 12).
    sources: [lds-scriptures, oshb-wlc, nrsvue]
  - ref: 12
    phrase: maintain the cause of the afflicted
    kind: scripture
    title: The LORD takes the poor man’s case
    body: |
      “Cause” and “right” are the words of a court, and the verse says that the LORD sees to it that the afflicted get their hearing and their verdict. A modern translation keeps the legal sense: the LORD “maintains the cause of the needy” and “executes justice for the poor.”

      David says the same of himself in an earlier psalm, and there the picture of the court is complete: “For thou hast maintained my right and my cause; thou satest in the throne judging right” ([[Ps. 9:4]]). Here the speaker has prayed for “me” through eleven verses, and when he comes to say what he knows, he says it of all the afflicted and the poor.
    sources: [nrsvue, lds-scriptures]

christ: |
  The psalm’s certainty is about a judge: the LORD “will maintain the cause of the afflicted, and the right of the poor.” The LORD of the Psalms is Jehovah, who came as Jesus Christ (see [[Ps. 110:1]]), and judgment is committed to the Son (see [[Ps. 94:1]]).

  Paul takes verse 3 another way. He uses it as part of his proof that all are under sin, and a few verses later he gives the answer: “Being justified freely by his grace through the redemption that is in Christ Jesus” ([[Rom. 3:24]]).

explore: |
  - **The tongue as a weapon.** [[Ps. 64:1–10]] and [[Ps. 120:1–7]], two more prayers against it, and [[James 3:5–8]] on the tongue and its poison.
  - **The helmet of salvation.** [[Isa. 59:16–17]], where the LORD arms Himself, beside [[Eph. 6:13–17]] and [[D&C 27:15–18]].
  - **The judge of the poor.** [[Isa. 11:1–5]] and [[Ps. 72:1–4]], where the same is asked of Israel’s king.
  - **Dwelling in His presence.** [[Ps. 16:11]] and [[Ps. 23:6]] beside the last line of this psalm.

parallels:
  - ref: Rom. 3:13
    note: Paul quotes verse 3 in his proof that all are under sin.
  - ref: Ps. 141:9
    note: The next psalm prays against the same snares and gins (also Ps. 142:3).
  - ref: Ps. 7:16
    note: The wicked man’s mischief returns upon his own head, as verse 9 asks.
  - ref: Isa. 59:17
    note: The helmet of salvation; verse 7 says God covered the speaker’s head.
  - ref: Ps. 9:4
    note: David says of himself what verse 12 says of all the afflicted, that the LORD maintains his right and his cause.

