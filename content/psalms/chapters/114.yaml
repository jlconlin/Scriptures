chapter: 114
title: Tremble, Thou Earth
tagline: The exodus in eight verses, told as a sea that ran and mountains that jumped, with the name of the One they ran from kept back until the end.
when: 'Undated; the psalm has no title and looks back on the exodus'

setting: |
  Psalm 114 has no title and names no author. It is the second of the six psalms (113–118) called the Hallel, “recited by Jews at the great feasts” (see the note on [[Ps. 114:1]]).

  Of those six psalms it is the only one that names Egypt, and it tells the whole journey in eight verses: the going out, the sea, the Jordan, the shaking mountains, the water from the rock. It does not tell them in order, and it names none of the people who led. Moses, Aaron, Pharaoh and Joshua are absent. The actors are a sea, a river, mountains and hills, and One who is not named until verse 7.

  Other scripture has the stories it compresses: the sea in [[Ex. 14]], the mountain in [[Ex. 19]], the Jordan in [[Josh. 3]], and the rock in [[Ex. 17]] and [[Num. 20]]. Paul, recalling the same sea and the same rock, says who was with Israel there ([[1 Cor. 10:1–4]]).

thread: |
  Psalm 114 **keeps back the name of the One it is about**. Its eight verses fall into four pairs. The first says what happened to Israel: when the people left Egypt they became “his sanctuary” and “his dominion,” and the psalm does not say whose. The second says what happened to the world around them. The sea fled, the Jordan turned back, the mountains jumped like sheep. “The sea saw it,” and the psalm does not say what it saw.

  The third pair turns the story into a question, put to the sea, the river and the hills themselves: what was the matter with you? They do not answer. The singer does, in the fourth pair, and his answer is a command, not an explanation: “Tremble, thou earth, at the presence of the Lord.” Only here, in the next-to-last verse, is God named.

  Then the last verse changes what the name means. Everything so far has run from Him or shaken before Him. The psalm ends with what He gives: a rock made into a pool, flint into a spring. The God whose presence drove back the sea is the God who gave a thirsty people water.

sections:
  - range: 1-2
    heading: When Israel went out
    plain: |
      When Israel left Egypt, when the house of Jacob left a people whose speech was foreign to them, Judah became His holy place and Israel His realm.
  - range: 3-4
    heading: The sea fled
    plain: |
      The sea saw, and ran. The Jordan turned back. The mountains leaped like rams, and the little hills like lambs.
  - range: 5-6
    heading: What ailed thee?
    plain: |
      What was the matter with you, sea, that you ran? And you, Jordan, that you turned back? You mountains, that you leaped like rams, and you little hills, like lambs?
  - range: 7-8
    heading: At the presence of the Lord
    plain: |
      Tremble, earth, before the Lord, before the God of Jacob, who turned the rock into a pool of water and the flint into a spring.

notes:
  - ref: 1
    phrase: When Israel went out of Egypt
    kind: history
    title: A psalm for the Passover table
    body: |
      Psalm 114 is one of the six psalms sung at Passover, and the only one of them that names Egypt. The group, Psalms 113–118, is the Hallel, explained at [[Ps. 113:1]]. The law gave a father his answer for the night when his children would ask, “What mean ye by this service?” ([[Ex. 12:26]]). In later times the telling was part of the meal: the “history of the redemption from Egypt was related by the head of the household,” and the Hallel was sung.

      That may place the psalm on the night of the Last Supper. The hymn Jesus and the Twelve sang before they went out to the Mount of Olives ([[Matt. 26:30]]) is taken to be the Hallel, and by the custom of the feast Psalms 113–114 “are sung early in the feast.” If the meal went that way, the Savior and the Twelve sang this psalm earlier the same night, at the table.
    sources: [bd-hallel, bd-feasts, lambert-passover-easter, lds-scriptures]

  - ref: 2
    phrase: Judah was his sanctuary
    kind: scripture
    title: A people made into a holy place
    body: |
      The verse says what Israel became at the exodus, and it calls the people, not a building, a sanctuary.

      The first thing a reader stops at is “his.” No one has been named for the word to point to; a modern translation supplies “God’s” and notes that the Hebrew has only “his.” The psalm keeps the name until verse 7.

      The second is that a tribe should be a sanctuary. At Sinai the people just out of Egypt were told what they were to be: “ye shall be unto me a kingdom of priests, and an holy nation” ([[Ex. 19:6]]), and that promise has been set beside this verse. A building followed, for one stated purpose: “let them make me a sanctuary; that I may dwell among them” ([[Ex. 25:8]]). One older reading is that the verse speaks of that dwelling: the nation is called Judah because God made it His sanctuary “by setting up His sanctuary” “in the midst of it,” at Jerusalem, and it is called Israel as the people over whom He placed Himself as King.

      In that reading Judah and Israel are both names of the one redeemed nation, as “Israel” and “the house of Jacob” are in verse 1.
    sources: [nrsvue, delitzsch-psalms, lds-scriptures]

  - ref: 3
    phrase: 'The sea saw it, and fled: Jordan was driven back'
    kind: scripture
    title: Two crossings in one line
    body: |
      The line joins two crossings: the sea on the way out of Egypt, and the Jordan on the way into the land. At the sea the LORD “made the sea dry land, and the waters were divided” ([[Ex. 14:21]]). At the Jordan the waters “stood and rose up upon an heap,” and “the people passed over right against Jericho” ([[Josh. 3:16]]). Joshua set the two side by side himself, on the far bank: the Jordan was dried up “as the LORD your God did to the Red sea” ([[Josh. 4:23]]).

      What the psalm adds is that the waters act for themselves. In the histories the water is acted upon: divided, cut off, heaped up. Here the sea is a creature that sees and runs, and the river is one that turns around.

      The King James supplies “it.” A modern translation has “The sea looked and fled,” and the ancient Greek translation “The sea saw and fled,” neither with an object. What the sea saw is left for verse 7 to say. Another psalm says it outright: “The waters saw thee, O God” ([[Ps. 77:16]]).
    sources: [lds-scriptures, nrsvue, lxx-rahlfs]

  - ref: 4
    phrase: The mountains skipped like rams
    kind: symbol
    title: The mountains read as Sinai
    body: |
      The skipping mountains have long been read as a picture of Sinai shaking when the LORD came down on it, though the psalm does not name the place. This verse and verse 6 are taken “of Sinai quaking at law-giving,” and the story says, “the whole mount quaked greatly” ([[Ex. 19:18]]). Other songs remember the day in the same way. Deborah sang, “The mountains melted from before the LORD, even that Sinai” ([[Judg. 5:5]]), and another psalm has “even Sinai itself was moved at the presence of God” ([[Ps. 68:8]]). The mountain is out of order here, after the Jordan; the psalm gathers the wonders and does not tell them in sequence.

      Rams and lambs make something immense small and skittish. Whether the leaping is glad or frightened the image does not say; the psalm’s own word for it, in verse 7, is “Tremble.” Another psalm has Lebanon “skip like a calf” ([[Ps. 29:6]]) at the voice of the LORD.
    sources: [bdb, lds-scriptures]

  - ref: 7
    phrase: at the presence of the Lord
    kind: structure
    title: The answer is a command
    body: |
      Verse 7 answers the question of verses 5–6, and it is the first time the psalm names God. The questions are put to the sea, the river and the hills as though the singer stood in front of them, and a modern translation gives them in the present tense: “Why is it, O sea, that you flee?” One older reading says the poet “lives and moves in this olden time as a contemporary,” so that past and present “flow together,” and that his answer to his own question “takes the form of a triumphant mandate.” He does not tell the sea why it ran. He tells the whole earth to do what the sea did.

      The name, when it comes, is “Lord,” printed here without the capitals that mark the divine name. It is the ordinary Hebrew word for a lord or master, used in this verse of God; the difference is explained at [[Ps. 110:1]]. “LORD” in capitals is not printed anywhere in the psalm. The second title, “the God of Jacob,” answers to “the house of Jacob” in verse 1.
    sources: [nrsvue, delitzsch-psalms, bdb, biblehub-interlinear]

  - ref: 8
    phrase: turned the rock into a standing water
    kind: history
    title: Water from the rock
    body: |
      The last wonder the psalm names is the water Israel drank in the wilderness, and it is the only one of the four in which nothing flees or shakes. “Standing water” is a pool: a modern translation has “a pool of water.”

      Israel was given water from rock twice. At Horeb the LORD told Moses, “thou shalt smite the rock, and there shall come water out of it, that the people may drink” ([[Ex. 17:6]]). Later Moses “smote the rock twice: and the water came out abundantly” ([[Num. 20:11]]). “Flint” is Moses’s own word when he looked back on those years and spoke of the God “who brought thee forth water out of the rock of flint” ([[Deut. 8:15]]).

      So the psalm that began with a sea running away ends with water that stays.
    sources: [nrsvue, lds-scriptures]

christ: |
  The psalm calls its God “the Lord” and “the God of Jacob” and gives Him no other name. Later scripture says who He is. Paul recalls the same sea and the same rock: the fathers “all passed through the sea” ([[1 Cor. 10:1]]), and the Rock they drank from, he says, was Christ ([[1 Cor. 10:4]]; see [[Ps. 95:8]]). In a latter-day revelation the Lord says of Himself what the psalm says of its God. He is “the God of Abraham and of Isaac and of Jacob” ([[D&C 136:21]]), and He says, “I am he who led the children of Israel out of the land of Egypt” ([[D&C 136:22]]).

  If the hymn He and the Twelve sang on the night of the Last Supper was the Hallel, this psalm was in His own mouth as well (see the note on [[Ps. 114:1]]). Of the feast at which those psalms were sung, Paul writes, “Christ our passover is sacrificed for us” ([[1 Cor. 5:7]]).

explore: |
  - **The stories behind the psalm.** [[Ex. 14]] (the sea), [[Ex. 19:16–19]] (the mountain), [[Josh. 3]] (the Jordan), [[Ex. 17:1–7]] and [[Num. 20:1–11]] (the rock).
  - **The rest of the Hallel.** [[Ps. 113]] and [[Ps. 115]]–118, the psalms sung with this one at the feast.
  - **The exodus sung elsewhere in the Psalms.** [[Ps. 77:16–20]], where the waters see God; [[Ps. 66:6]]; [[Ps. 78]], which tells at length what this psalm tells in a line.
  - **The earth before its Lord in Restoration scripture.** [[Hel. 12:9–16]], [[Moses 7:13]] and [[D&C 133:40–44]].

parallels:
  - ref: Ex. 14:21–22
    note: The sea is divided and Israel crosses on dry ground; verse 3 says the sea “fled.”
  - ref: Josh. 3:16
    note: The Jordan stands in a heap while the people cross opposite Jericho.
  - ref: Josh. 4:23
    note: Joshua sets the drying of the Jordan beside the drying of the Red Sea, as verse 3 does.
  - ref: Ex. 19:18
    note: Mount Sinai quakes when the LORD descends on it; the skipping mountains of verses 4 and 6.
  - ref: Ex. 17:6
    note: Water from the rock in Horeb, the wonder of verse 8.
  - ref: 1 Cor. 10:1–4
    note: Paul recalls the sea and the rock and says the Rock was Christ.
  - ref: Moses 7:13
    note: At Enoch’s word the earth trembles, mountains flee and rivers turn out of their course.
  - ref: D&C 133:42
    note: At the Lord’s coming “all nations shall tremble at thy presence.”

sources: [lds-scriptures, bd-hallel, bd-feasts, lambert-passover-easter, nrsvue, lxx-rahlfs, delitzsch-psalms, bdb, biblehub-interlinear]
