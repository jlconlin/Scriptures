chapter: 119
title: O How Love I Thy Law
tagline: One hard-pressed man goes through the alphabet eight lines to a letter, telling God what His word is to him, asking to be taught and kept alive, and ending as a lost sheep who asks to be sought.
when: 'Undated; the psalm has no title and names no author'

setting: |
  Psalm 119 has no title, names no author, and mentions no event by which it could be dated. What it shows of its speaker is in the note on verse 9.

  It is the longest psalm and “the longest chapter in the Bible”: 176 verses in twenty-two stanzas of eight. The Hebrew letter printed over each stanza marks the form. The psalm is an acrostic, the device explained at [[Ps. 9:1]], and here all eight verses of a stanza begin with the stanza’s letter.

  In the book it comes directly after the Hallel, the group of psalms (113–118) recited at the great feasts.

  Two earlier psalms share its subject. [[Ps. 1]] opens with the same word, “Blessed,” and describes the man whose “delight is in the law of the LORD” and who meditates in it “day and night” ([[Ps. 1:2]]). The second half of Psalm 19 praises the law under six names and says of the LORD’s judgments, “More to be desired are they than gold, yea, than much fine gold: sweeter also than honey and the honeycomb” ([[Ps. 19:10]]). Psalm 119 has the gold (verses 72, 127) and the honey (verse 103), and it stays with the subject for 176 verses.

thread: |
  Psalm 119 is **one man telling God, letter by letter, what His word is to him**. It has been doubted that the psalm has any plan beyond its alphabet, and it does not tell a story. It does have a speaker in trouble, a lowest point, and a turn.

  It begins from outside. “Blessed are they” is said of other people (verses 1–3). At verse 4 he turns to God, “Thou hast commanded us,” and at verse 5 to himself: “O that my ways were directed to keep thy statutes!” From there to the end nearly every line is spoken to God, and the law is never the law in the abstract. It is “thy law,” “thy word,” “the law of thy mouth.”

  What he says is not what a reader expects from a psalm about commandments. He does not report success. He asks: teach me, open my eyes, incline my heart, order my steps, quicken me. Keeping comes after giving: “Give me understanding, and I shall keep thy law” (verse 34).

  Trouble presses in as the stanzas go on, from the proud and from princes, and in the eleventh stanza (verses 81–88) he is nearly spent: “When wilt thou comfort me?” The twelfth opens the second half of the psalm with what he holds to: “For ever, O LORD, thy word is settled in heaven.” He says what that word has been to him: “Unless thy law had been my delights, I should then have perished in mine affliction” (verse 92). The stanza after it (verses 97–104) is one of only two that ask for nothing: “O how love I thy law!”

  The cries come back, and the last verse is the surprise. The psalm that opened with “the undefiled in the way” ends, “I have gone astray like a lost sheep; seek thy servant.”

sections:
  - range: 1-8
    heading: Blessed are they that keep his testimonies
    plain: |
      Blessed are those whose way is blameless, who walk in the law of the LORD. Blessed are those who keep His testimonies and seek Him with the whole heart. They do no wrong; they walk in His ways. You have commanded us to keep Your precepts diligently. If only my ways were set to keep Your statutes! Then I would not be ashamed when I look at all Your commandments. I will praise You with an upright heart when I have learned Your righteous judgments. I will keep Your statutes; do not forsake me utterly.
  - range: 9-16
    heading: Thy word have I hid in mine heart
    plain: |
      How shall a young man keep his way clean? By guarding it according to Your word. I have sought You with my whole heart; do not let me wander from Your commandments. I have stored up Your word in my heart so that I would not sin against You. Blessed are You, LORD; teach me Your statutes. With my lips I have told all the judgments of Your mouth. I have rejoiced in the way of Your testimonies as much as in all riches. I will meditate on Your precepts and look to Your ways. I will delight in Your statutes; I will not forget Your word.
  - range: 17-24
    heading: Open thou mine eyes
    plain: |
      Deal generously with Your servant, so that I may live and keep Your word. Open my eyes, that I may see wonderful things in Your law. I am a stranger on the earth; do not hide Your commandments from me. My soul is crushed with longing for Your judgments at all times. You have rebuked the proud, who are cursed, who stray from Your commandments. Take reproach and contempt away from me, for I have kept Your testimonies. Princes sat and spoke against me, but Your servant meditated on Your statutes. Your testimonies are my delight and my counsellors.
  - range: 25-32
    heading: My soul cleaveth unto the dust
    plain: |
      My soul clings to the dust; give me life according to Your word. I told You my ways and You heard me; teach me Your statutes. Make me understand the way of Your precepts, and I will speak of Your wonderful works. My soul melts away for sorrow; strengthen me according to Your word. Put the way of lying far from me, and graciously give me Your law. I have chosen the way of truth; I have set Your judgments before me. I have held fast to Your testimonies; LORD, do not put me to shame. I will run the way of Your commandments when You enlarge my heart.
  - range: 33-40
    heading: Teach me, O LORD
    plain: |
      Teach me, LORD, the way of Your statutes, and I will keep it to the end. Give me understanding, and I will keep Your law and observe it with my whole heart. Make me walk in the path of Your commandments, for I delight in it. Bend my heart toward Your testimonies and not toward gain. Turn my eyes away from looking at what is empty, and give me life in Your way. Make Your word sure to Your servant, who is devoted to fearing You. Turn away the reproach I dread, for Your judgments are good. I have longed for Your precepts; give me life in Your righteousness.
  - range: 41-48
    heading: I will speak before kings
    plain: |
      Let Your mercies come to me, LORD, Your salvation, according to Your word. Then I will have an answer for the one who reproaches me, for I trust in Your word. Do not take the word of truth wholly out of my mouth, for I have hoped in Your judgments. So I will keep Your law continually, for ever and ever, and I will walk at liberty, for I seek Your precepts. I will speak of Your testimonies before kings and not be ashamed. I will delight in Your commandments, which I have loved. I will lift up my hands to Your commandments, which I have loved, and meditate on Your statutes.
  - range: 49-56
    heading: Songs in the house of my pilgrimage
    plain: |
      Remember Your word to Your servant, the word You have made me hope in. This is my comfort in my affliction: Your word has given me life. The proud have mocked me greatly, yet I have not turned from Your law. I remembered Your judgments of old, LORD, and comforted myself. Horror has seized me because of the wicked who forsake Your law. Your statutes have been my songs in the house where I am a pilgrim. I have remembered Your name in the night, LORD, and have kept Your law. This has been mine, because I kept Your precepts.
  - range: 57-64
    heading: Thou art my portion
    plain: |
      You are my portion, LORD; I have said that I would keep Your words. I sought Your favour with my whole heart; be merciful to me according to Your word. I thought about my ways and turned my feet to Your testimonies. I hurried and did not delay to keep Your commandments. Bands of the wicked have robbed me, but I have not forgotten Your law. At midnight I will rise to thank You for Your righteous judgments. I am a companion of all who fear You and keep Your precepts. The earth, LORD, is full of Your mercy; teach me Your statutes.
  - range: 65-72
    heading: It is good for me that I have been afflicted
    plain: |
      You have dealt well with Your servant, LORD, according to Your word. Teach me good judgment and knowledge, for I have believed Your commandments. Before I was afflicted I went astray, but now I keep Your word. You are good and do good; teach me Your statutes. The proud have forged a lie against me, but I will keep Your precepts with my whole heart. Their heart is thick as fat, but I delight in Your law. It is good for me that I was afflicted, so that I might learn Your statutes. The law of Your mouth is better to me than thousands of pieces of gold and silver.
  - range: 73-80
    heading: Thy hands have made me
    plain: |
      Your hands made me and shaped me; give me understanding, that I may learn Your commandments. Those who fear You will be glad when they see me, because I have hoped in Your word. I know, LORD, that Your judgments are right and that in faithfulness You have afflicted me. Let Your merciful kindness comfort me, according to Your word to Your servant. Let Your tender mercies come to me, that I may live, for Your law is my delight. Let the proud be ashamed, for they wronged me without a cause; but I will meditate on Your precepts. Let those who fear You turn to me, those who know Your testimonies. Let my heart be sound in Your statutes, that I may not be ashamed.
  - range: 81-88
    heading: When wilt thou comfort me?
    plain: |
      My soul faints for Your salvation, but I hope in Your word. My eyes fail, looking for Your word; I say, When will You comfort me? I have become like a skin bottle in the smoke, yet I do not forget Your statutes. How many are the days of Your servant? When will You judge those who persecute me? The proud have dug pits for me, against Your law. All Your commandments are faithful; they persecute me wrongfully; help me. They had almost made an end of me on earth, but I did not forsake Your precepts. Give me life according to Your lovingkindness, and I will keep the testimony of Your mouth.
  - range: 89-96
    heading: Settled in heaven
    plain: |
      For ever, LORD, Your word stands firm in heaven. Your faithfulness is to all generations; You established the earth, and it stands. They continue to this day according to Your ordinances, for all things are Your servants. If Your law had not been my delight, I would have perished in my affliction. I will never forget Your precepts, for by them You have given me life. I am Yours; save me, for I have sought Your precepts. The wicked have waited to destroy me, but I will consider Your testimonies. I have seen a limit to everything perfect, but Your commandment is exceedingly broad.
  - range: 97-104
    heading: O how love I thy law
    plain: |
      How I love Your law! It is my meditation all day. Through Your commandments You have made me wiser than my enemies, for they are always with me. I have more understanding than all my teachers, for Your testimonies are my meditation. I understand more than the aged, because I keep Your precepts. I have kept my feet from every evil way, that I might keep Your word. I have not turned from Your judgments, for You have taught me. How sweet Your words are to my taste, sweeter than honey to my mouth! Through Your precepts I get understanding; therefore I hate every false way.
  - range: 105-112
    heading: A lamp unto my feet
    plain: |
      Your word is a lamp to my feet and a light to my path. I have sworn, and I will do it, to keep Your righteous judgments. I am greatly afflicted; give me life, LORD, according to Your word. Accept, I pray, the freewill offerings of my mouth, LORD, and teach me Your judgments. My life is always in my hand, yet I do not forget Your law. The wicked have set a snare for me, yet I have not strayed from Your precepts. I have taken Your testimonies as my inheritance for ever, for they are the joy of my heart. I have bent my heart to do Your statutes always, to the end.
  - range: 113-120
    heading: My hiding place and my shield
    plain: |
      I hate vain thoughts, but I love Your law. You are my hiding place and my shield; I hope in Your word. Go away from me, you evildoers, for I will keep the commandments of my God. Uphold me according to Your word, that I may live, and do not let me be ashamed of my hope. Hold me up and I will be safe, and I will look to Your statutes continually. You have trodden down all who stray from Your statutes, for their deceit is falsehood. You put away all the wicked of the earth like dross; therefore I love Your testimonies. My flesh trembles for fear of You, and I am afraid of Your judgments.
  - range: 121-128
    heading: It is time for thee, LORD, to work
    plain: |
      I have done what is just and right; do not leave me to my oppressors. Stand surety for Your servant’s good; do not let the proud oppress me. My eyes fail, looking for Your salvation and for Your righteous word. Deal with Your servant according to Your mercy, and teach me Your statutes. I am Your servant; give me understanding, that I may know Your testimonies. It is time for You to act, LORD, for they have made Your law void. Therefore I love Your commandments more than gold, more than fine gold. Therefore I hold all Your precepts to be right in everything, and I hate every false way.
  - range: 129-136
    heading: The entrance of thy words giveth light
    plain: |
      Your testimonies are wonderful; therefore my soul keeps them. The opening of Your words gives light; it gives understanding to the simple. I opened my mouth and panted, because I longed for Your commandments. Look on me and be merciful to me, as You do to those who love Your name. Order my steps in Your word, and let no iniquity rule over me. Deliver me from the oppression of man, and I will keep Your precepts. Make Your face shine on Your servant, and teach me Your statutes. Rivers of water run down from my eyes, because people do not keep Your law.
  - range: 137-144
    heading: Righteous art thou, O LORD
    plain: |
      You are righteous, LORD, and Your judgments are upright. The testimonies You have commanded are righteous and very faithful. My zeal has consumed me, because my enemies have forgotten Your words. Your word is very pure; therefore Your servant loves it. I am small and despised, yet I do not forget Your precepts. Your righteousness is an everlasting righteousness, and Your law is the truth. Trouble and anguish have taken hold of me, yet Your commandments are my delight. The righteousness of Your testimonies is everlasting; give me understanding, and I shall live.
  - range: 145-152
    heading: Thou art near, O LORD
    plain: |
      I cried with my whole heart; hear me, LORD; I will keep Your statutes. I cried to You; save me, and I will keep Your testimonies. I rose before the dawn and cried; I hoped in Your word. My eyes were awake before the night watches, that I might meditate on Your word. Hear my voice according to Your lovingkindness; LORD, give me life according to Your judgment. Those who follow after mischief draw near; they are far from Your law. You are near, LORD, and all Your commandments are truth. I have long known of Your testimonies that You founded them for ever.
  - range: 153-160
    heading: Consider mine affliction
    plain: |
      Look on my affliction and deliver me, for I do not forget Your law. Plead my cause and deliver me; give me life according to Your word. Salvation is far from the wicked, for they do not seek Your statutes. Great are Your tender mercies, LORD; give me life according to Your judgments. My persecutors and enemies are many, yet I do not turn from Your testimonies. I saw the transgressors and was grieved, because they did not keep Your word. See how I love Your precepts; give me life, LORD, according to Your lovingkindness. Your word is true from the beginning, and every one of Your righteous judgments endures for ever.
  - range: 161-168
    heading: Great peace have they which love thy law
    plain: |
      Princes have persecuted me without a cause, but my heart stands in awe of Your word. I rejoice at Your word like one who finds great spoil. I hate and abhor lying, but I love Your law. Seven times a day I praise You for Your righteous judgments. Those who love Your law have great peace, and nothing makes them stumble. LORD, I have hoped for Your salvation and done Your commandments. My soul has kept Your testimonies, and I love them exceedingly. I have kept Your precepts and Your testimonies, for all my ways are before You.
  - range: 169-176
    heading: Seek thy servant
    plain: |
      Let my cry come before You, LORD; give me understanding according to Your word. Let my plea come before You; deliver me according to Your word. My lips will pour out praise when You have taught me Your statutes. My tongue will speak of Your word, for all Your commandments are righteousness. Let Your hand help me, for I have chosen Your precepts. I have longed for Your salvation, LORD, and Your law is my delight. Let my soul live, and it will praise You, and let Your judgments help me. I have gone astray like a lost sheep; seek Your servant, for I do not forget Your commandments.

notes:
  - ref: 1
    phrase: Blessed are the undefiled in the way
    kind: structure
    title: Eight lines to every letter
    body: |
      The psalm goes through the whole Hebrew alphabet and gives each letter eight verses, where the other alphabet psalms give a letter one line. The third chapter of Lamentations comes nearest, with three lines to a letter ([[Lam. 3]]).

      Two reasons for writing this way have been suggested, and neither is stated in the text. One is memory: the pattern makes a long poem easier to remember. The other is completeness: to go through the whole alphabet is to cover a subject “from A to Z.”

      The form also bound the poet, since every line had to begin with its letter. The wording of at least one line has been explained that way (see the note on [[Ps. 119:32]]).
    sources: [gee-enlarge-heart, fun-hebrew-poetry]

  - ref: 1
    phrase: the law of the LORD
    kind: words
    title: Eight names for one thing
    body: |
      “Law” in this psalm is wider than a legal code, and the seven other names that take turns with it are near synonyms for it. The Hebrew word is *torah*, “direction, instruction, law,” and its first sense in the lexicon is the instruction a mother or a father gives a child (see the note on [[Ps. 1:2]]).

      The King James Version gives the names as law, testimonies, precepts, statutes, commandments, judgments, and word. “Word” stands for two Hebrew words, and a modern translation sometimes renders the second “promise,” as in verse 148: “that I may meditate on your promise.” The names have been called “a many-linked chain of synonyms which runs through the whole Psalm.” Each is “thy,” and three times the psalmist says it comes from God’s mouth (verses 13, 72, 88).

      The chain is nearly unbroken: the ancient Jewish scribes, counting with a list of ten such expressions, found only verse 122 without one. Five of the King James names already stand together in [[Ps. 19:7–9]].
    sources: [bdb, nrsvue, delitzsch-psalms, oshb-wlc]

  - ref: 9
    phrase: Wherewithal shall a young man cleanse his way
    kind: history
    title: Who is praying, and what has happened to him
    body: |
      The psalm names no author, but it shows its speaker: a man under attack for his loyalty to God’s word, and probably a young one. Princes “sit and speak against” him (verse 23) and persecute him “without a cause” (verse 161). The proud mock him (verse 51), forge a lie against him (verse 69), and dig pits for him (verse 85). He has been robbed (verse 61), and his enemies “had almost consumed me upon earth” (verse 87). He calls himself “small and despised” (verse 141).

      His youth is an inference from two places. He asks how “a young man” is to keep his way clean, and he says he understands more than his teachers and “the ancients” (verses 99–100). He takes no credit for it. Each time he gives the word as the reason: “for thy testimonies are my meditation,” “because I keep thy precepts.”

      One older reading goes further than the text does. It holds that “the poet is a young man, who finds himself in a situation which is clearly described: he is derided, oppressed, persecuted,” supposes that the psalm comes from “those times of the Greek domination in which the government was hostile,” and thinks it probably “the work of one in prison.” The psalm gives no place or date, and the reading offers these as suppositions.
    sources: [delitzsch-psalms]

  - ref: 25
    phrase: quicken thou me according to thy word
    kind: words
    title: Quicken me
    body: |
      To quicken is to make alive (see the note on [[Ps. 71:20]]), and the psalmist asks for it nine times. A modern translation has “revive me” here and “give me life” in verse 107. Twice he says it has already been done, and both times the word did it: “thy word hath quickened me” (verse 50); “with them thou hast quickened me” (verse 93).

      He asks God for life, and he asks it “according to thy word.” Verse 17 makes the same request in other words: “Deal bountifully with thy servant, that I may live, and keep thy word.”
    sources: [nrsvue]

  - ref: 32
    phrase: when thou shalt enlarge my heart
    kind: words
    title: An enlarged heart
    body: |
      To “enlarge my heart” is an idiom for giving understanding: the Church’s edition explains “heart” as “understanding,” and a modern translation has “for you enlarge my understanding.”

      Another sense has been proposed from Egyptian. The phrase with this form of the verb “is a hapax legomenon (an expression that occurs only once) in the Hebrew Bible.” Egyptian has the same expression, which is literally “to enlarge the heart,” but it means “to have joy.” On that reading the verse says, “I will run on the path of your commandments because you have brought me joy,” and the same idiom is found in the Book of Mormon, where Ammon’s “heart was swollen within him with joy” ([[Alma 17:29]]). This remains a proposal, and “understanding” is the reading of the Church’s edition.

      The proposal also accounts for the running. The ordinary Hebrew expression is to walk in a way, but it begins with a preposition, and “using the expression would destroy the acrostic.” Every line of this stanza must begin with the letter daleth, as “way” does.
    sources: [lds-scriptures, nrsvue, gee-enlarge-heart, oshb-wlc]

  - ref: 71
    phrase: It is good for me that I have been afflicted
    kind: scripture
    title: What the affliction taught him
    body: |
      He calls his affliction good because of what he learned in it, and he says so three times in a few verses. First comes the fact: “Before I was afflicted I went astray: but now have I kept thy word” (verse 67). Then the verdict of this verse, with its reason: “that I might learn thy statutes.” Then he names who did it and in what spirit: “thou in faithfulness hast afflicted me” (verse 75). A modern translation has “humbled” for “afflicted” in verses 67 and 71.

      He does not call everything that has happened to him good. What the proud did was done “without a cause” (verse 78), and he asks God to judge it. And the verse after his confession asks for relief: “Let, I pray thee, thy merciful kindness be for my comfort” (verse 76).

      Why scripture calls the chastened man blessed is the note at [[Ps. 94:12]].
    sources: [nrsvue]

  - ref: 83
    phrase: like a bottle in the smoke
    kind: symbol
    title: A skin bottle hung in the smoke
    body: |
      The bottle is a leather one, dried out by smoke. The Hebrew word is a “skin-bottle, skin,” the kind that held wine or milk, and in this verse the picture is taken to be of one “shrivelled and useless,” though the smoke has been explained in other ways. A modern translation has “like a wineskin in the smoke.”

      The image belongs to the stanza it stands in. His soul faints, his eyes fail with looking, and he asks, “When wilt thou comfort me?” The skin in the smoke is what the waiting has done to him: he is dried out and good for nothing. The line turns on its last clause: “yet do I not forget thy statutes.”
    sources: [bdb, nrsvue]

  - ref: 105
    phrase: Thy word is a lamp unto my feet
    kind: christ
    title: The word and the light
    body: |
      In the psalm God’s word is a light to walk by, and the Gospel of John gives both names, the Word and the light, to Jesus. The lamp is “unto my feet” and the light “unto my path,” and the stanza goes on to snares laid for him and a life carried “continually in my hand.” Verse 130 says where the light comes from: “The entrance of thy words giveth light.” “Entrance” there is an opening, and a modern translation has “the unfolding of your words.”

      John opens his Gospel with “In the beginning was the Word” ([[John 1:1]]), and Jesus said, “I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life” ([[John 8:12]]). In the Old Testament light is often said of Jehovah and coupled, as in this verse, with another word that John uses of Jesus, and since Jesus is Jehovah come in the flesh, such words “may appropriately be applied to Him as John does.” That reads the psalm from the Gospel; the psalmist himself is speaking of what God has said.
    sources: [keller-jesus-jehovah, nrsvue]

  - ref: 165
    phrase: nothing shall offend them
    kind: prophets
    title: Offend means cause to stumble
    body: |
      “Offend” here means to trip: those who love the law have nothing in their path to fall over. The Hebrew noun is “a stumbling, means or occasion of stumbling, stumbling-block,” and a modern translation has “nothing can make them stumble.” It is a bold thing to say in a stanza that begins, “Princes have persecuted me without a cause.”

      Elder David A. Bednar took the verse for the title and the close of a general conference address on taking offense. “To be offended is a choice we make,” he taught; “it is not a condition inflicted or imposed upon us by someone or something else.” He ended with the verse and with where the strength for it comes from: “Through the strengthening power of the Atonement of Jesus Christ, you and I can be blessed to avoid and triumph over offense.”
    sources: [bdb, nrsvue, bednar-nothing-offend]

  - ref: 176
    phrase: I have gone astray like a lost sheep; seek thy servant
    kind: scripture
    title: The lost sheep of the last verse
    body: |
      The longest praise of God’s law ends with its singer lost and asking to be found. It began with “the undefiled in the way,” who “do no iniquity.” In verse 10 he said, “With my whole heart have I sought thee.” His last request is that God seek him. He does not take back his loyalty, and the final clause keeps it: “for I do not forget thy commandments.”

      The confession sounds like Isaiah’s, “All we like sheep have gone astray” ([[Isa. 53:6]]), and after so much loyalty “it may seem strange that he can say” it of himself. One older reading takes the lost sheep to be less a sinner than a man cut off and “in imminent danger of total destruction”: “his going astray is no apostasy; his home, to which he longs to return when he has been betrayed into by-ways, is beside the Lord.” The psalm itself does not say which he means.

      The shepherd of the Psalms, and the Savior’s claim to the title, is the note at [[Ps. 23:1]].
    sources: [delitzsch-psalms]

christ: |
  The LORD to whom all 176 verses are spoken is Jehovah, the Savior before His birth (see the note on [[Ps. 110:1]]), and the risen Savior said of Himself, “Behold, I am he that gave the law” ([[3 Ne. 15:5]]). The psalmist’s devotion is to the giver as well as to the law: “Thou art my portion, O LORD” (verse 57), and “I am thine, save me” (verse 94).

  The psalm’s word and light are names the Gospel of John gives to Him (see the note on [[Ps. 119:105]]).

  The last verse leaves a sheep asking to be sought, and the shepherd of the Psalms is the same LORD (see the note on [[Ps. 23:1]]).

explore: |
  - **The two companion psalms.** [[Ps. 1]], on the man who meditates in the law day and night, and [[Ps. 19:7–14]], on the law under six names.
  - **The word as a guide.** [[Alma 37:38–46]], on the Liahona and the words of Christ.
  - **The Word and the light.** [[John 1:1–14]] and [[John 8:12]].
  - **The lost sheep sought.** [[Ezek. 34:11–16]] and [[Luke 15:1–7]].

parallels:
  - ref: Ps. 19:7–10
    note: The law praised under six names, and valued above gold and honey as in verses 72, 103 and 127.
  - ref: Ps. 1:1–2
    note: The other psalm that opens with “Blessed” and with delight in the law of the LORD.
  - ref: John 8:12
    note: The Savior calls Himself the light of the world.
  - ref: Alma 37:44–45
    note: The word of Christ points a straight course, as the lamp of verse 105 lights the path.
  - ref: Ezek. 34:16
    note: The LORD promises to seek what was lost, as the psalm’s last verse asks.
  - ref: Isa. 53:6
    note: “All we like sheep have gone astray.”
  - ref: Luke 15:4
    note: The shepherd goes after the lost sheep until he finds it.

