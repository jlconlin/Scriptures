chapter: 10
title: Why Standest Thou Afar Off?
tagline: The psalmist asks why the LORD stands far off while a man who thinks God sees nothing hunts the poor, then answers that man’s private sayings one by one and ends with the LORD as King.
when: 'Undated; it has no title and continues Psalm 9, a psalm of David by its title'

setting: |
  Psalm 10 has no title because it is the second half of a poem. Many ancient manuscripts, the Greek especially, count Psalms 9 and 10 as one psalm, and the two together “appear to be one complete acrostic poem,” in which the first letters of the lines follow the Hebrew alphabet in order, “although some letters are missing.” Psalm 9 begins the alphabet. Psalm 10 takes it up at *lamed* in verse 1, passes over six letters through the long description of the wicked man, and resumes at verse 12, so that the last four letters head the last four stanzas. Psalm 9 carries the title, which ascribes the poem to David, and the Church’s edition heads Psalm 10 with David as its speaker.

  The pair is “a hymn of thanksgiving (Psalm 9) followed by a lament (Psalm 10).” (The parts of a lament are set out at [[Ps. 22:1]].) Psalm 9 thanks the LORD for judging the nations and sheltering the oppressed. Psalm 10 names no occasion and no army. Its enemy is a man who waits in ambush near the villages for the poor and tells himself that God will never look into it.

  Paul quotes verse 7 in [[Rom. 3:14]].

thread: |
  Psalm 10 begins with two questions put to God: why He stands far off, and why He hides Himself “in times of trouble.” Psalm 9 had just sung of the LORD enthroned as judge. This half is “the painful acknowledgment that that great day has not yet arrived.”

  Most of the psalm (verses 2–11) is a portrait of one wicked man, and the portrait is drawn largely from the inside. Three times the psalmist reports what the man “hath said in his heart”: that he will never be moved (verse 6), that God has forgotten and will never see (verse 11), and that God will not require it (verse 13).

  The turn comes at verse 12 with “Arise, O LORD.” Nothing has changed in the villages. **From here the prayer takes up the wicked man’s own words and says the opposite to God.** The man says God has forgotten; the prayer is “forget not the humble.” The man says God will never see; the psalmist says, “Thou hast seen it.” The man says God will not require it; the psalmist asks God to seek out his wickedness until none is left.

  The last three verses turn to confidence: “The LORD is King for ever and ever.” Verses 17–18 “return to the more hopeful themes of Psalm 9,” and the poem that began in praise ends with the desire of the humble heard.

sections:
  - range: 1-2
    heading: The question
    plain: |
      LORD, why do You stand far away? Why do You hide Yourself in times of trouble? In his pride the wicked man hunts down the poor. Let such men be caught in the schemes they have devised.
  - range: 3-11
    heading: The man who thinks God sees nothing
    plain: |
      The wicked man boasts of what he craves, and blesses the greedy, whom the LORD abhors. In his haughtiness he does not seek; “There is no God” is all he thinks (the King James has “God is not in all his thoughts”). His ways prosper at all times (the King James has “grievous”). Your judgments are far above him, out of his sight, and he scoffs at all his enemies. He tells himself, “I shall not be moved; I shall never be in trouble.” His mouth is full of cursing, deceit and fraud, and mischief lies under his tongue. He sits in ambush near the villages and murders the innocent in hidden places; his eyes watch for the helpless. He lies in wait like a lion in its den, to seize the poor, and he seizes them when he draws them into his net. He stoops and crouches, and the helpless fall by his might. He tells himself, “God has forgotten. He hides His face. He will never see it.”
  - range: 12-15
    heading: Arise, O LORD
    plain: |
      Arise, LORD! God, lift up Your hand. Do not forget the humble. Why does the wicked man despise God and tell himself, “You will not require it”? You have seen it. You look on mischief and spite, to repay it with Your hand. The poor man leaves himself to You; You are the helper of the fatherless. Break the arm of the wicked and evil man; seek out his wickedness until You find none.
  - range: 16-18
    heading: The LORD is King
    plain: |
      The LORD is King for ever and ever; the nations have perished from His land. LORD, You have heard the desire of the humble. You will prepare their heart and turn Your ear to hear, to judge for the fatherless and the oppressed, so that man, who is from the earth, may strike terror no more.

notes:
  - ref: 1
    phrase: in times of trouble
    kind: scripture
    title: The refuge of Psalm 9, now far off
    body: |
      The psalm’s first question takes up, word for word, a promise made a few verses earlier. Psalm 9 says that the LORD “will be a refuge for the oppressed, a refuge in times of trouble” ([[Ps. 9:9]]). Psalm 10 opens by asking why He hides Himself “in times of trouble,” and the two Hebrew words are the same in both verses, in the same form.

      Psalm 9 looks “forward to the day when the Lord will reign over the earth in righteousness from Zion.” Psalm 10 begins from the admission that the day is not yet here.
    sources: [lds-scriptures, oshb-wlc, ot-minute-psalms-1-20]
  - ref: 4
    phrase: God is not in all his thoughts
    kind: words
    title: No God, or a God who does nothing
    body: |
      The Hebrew of this line is blunter than the King James: the words are “there is no God,” given as the sum of what the wicked man thinks. A modern translation prints it as his own speech: “all their thoughts are, ‘There is no God.’” It is the fool’s saying in another psalm: “The fool hath said in his heart, There is no God” ([[Ps. 14:1]]).

      The first half of the verse can be read the same way. The Hebrew has only “will not seek,” with nothing said of who seeks or what is sought. The King James takes the wicked man as the one who will not seek after God. The verb can also mean to require or call to account, as it does in verse 13, and the same modern translation makes the clause another of the man’s thoughts: “God will not seek it out.”

      What kind of unbelief this is the rest of the psalm shows. The man speaks of God in verses 11 and 13, and what he says there is that God has forgotten, does not see, and will not require anything of him. The wicked of this psalm “do not appear to be particularly concerned about His future judgments.”
    sources: [oshb-wlc, nrsvue, bdb, ot-minute-psalms-1-20]
  - ref: 6
    phrase: He hath said in his heart
    kind: structure
    title: Three things said in the heart
    body: |
      The portrait of the wicked man is built around three sayings that he speaks only to himself, in verses 6, 11 and 13, each introduced by the same Hebrew phrase.

      The first is “I shall not be moved: for I shall never be in adversity.” Elsewhere in the Psalms those are the words of someone who trusts the LORD: “because he is at my right hand, I shall not be moved” ([[Ps. 16:8]]). One reading draws the contrast: what “the believer can say by reason of his fellowship with God” this man says “in godless self-confidence.”

      The second and third are about God directly: “God hath forgotten: he hideth his face; he will never see it” (verse 11), and “Thou wilt not require it” (verse 13). The notes on verses 12 and 15 show where the prayer takes up the same words.
    sources: [oshb-wlc, delitzsch-psalms, lds-scriptures]
  - ref: 7
    phrase: His mouth is full of cursing and deceit and fraud
    kind: scripture
    title: Paul’s use of the line in Romans
    body: |
      Paul quotes this line in Romans, and he applies it more widely than the psalm does. In the psalm it describes one kind of man, the oppressor, who is set against the poor and the humble. In Romans it stands in a chain of Old Testament quotations ([[Rom. 3:10–18]]) that Paul brings to support a charge against everyone: “we have before proved both Jews and Gentiles, that they are all under sin” ([[Rom. 3:9]]).

      His wording is “Whose mouth is full of cursing and bitterness” ([[Rom. 3:14]]). “Bitterness” is not in the Hebrew psalm, which has “deceit.” It is in the ancient Greek translation, where the verse reads, “Whose mouth is full of cursing, and bitterness, and fraud.” Paul’s wording agrees with the Greek at that word, and he stops before “fraud.”
    sources: [lds-scriptures, lxx-rahlfs]
  - ref: 10
    phrase: He croucheth, and humbleth himself
    kind: words
    title: Crouching, or bowed down
    body: |
      “Humbleth himself” translates a verb for crouching or being bowed down, and the line is read in more than one way. With the lion of verse 9 still in view, a modern translation has simply “They stoop, they crouch,” and the same verb is used of lions in Job: “When they couch in their dens, and abide in the covert to lie in wait?” ([[Job 38:40]]).

      The verse is hard in Hebrew, and it can be divided differently. The verb also means to “be bowed down, prostrated, humbled,” and the line has been taken that way, of the victim brought low “by man.” The Greek has the hunter himself “bow down and fall when he has mastered the poor.”

      Two other words in the verse need a gloss. “His strong ones” is unexplained in the King James; the modern translation has the helpless fall “by their might.” And “the poor” in this verse and in verses 8 and 14 is a different word from “the poor” of verses 2 and 9. It means the “helpless” or “hapless,” it is found in the Psalms only in these three verses, and its text and meaning are “dubious” in all three.
    sources: [nrsvue, bdb, lxx-rahlfs, oshb-wlc]
  - ref: 12
    phrase: Arise, O LORD
    kind: scripture
    title: Arise, and forget not
    body: |
      The plea begins with the call that ended Psalm 9, and its next words answer the wicked man with his own verb. “Arise, O LORD; let not man prevail” ([[Ps. 9:19]]) is the same Hebrew word as the “Arise” here. It is the call that opens the plea of Psalm 3 as well, and where it comes from is discussed in the note on [[Ps. 3:7]].

      “Forget not the humble” takes up verse 11, where the man has told himself, “God hath forgotten.” The verb is the same. It was already used in Psalm 9, of the LORD: “he forgetteth not the cry of the humble” ([[Ps. 9:12]]).

      Verse 14 does the same with the man’s other claim. He said of God, “he will never see it.” The psalmist says to God, with the same verb, “Thou hast seen it.”
    sources: [oshb-wlc, lds-scriptures]
  - ref: 15
    phrase: seek out his wickedness till thou find none
    kind: words
    title: One verb behind seek and require
    body: |
      One Hebrew verb lies behind “seek” in verse 4, “require” in verse 13 and “seek out” here. Its sense in these verses is to “exact, often with collateral idea of avenging.” Psalm 9 had used it of the LORD in just that sense: “When he maketh inquisition for blood, he remembereth them” ([[Ps. 9:12]]).

      In verse 4 the wicked man will not seek (or, on the other reading given in the note there, thinks that God will not). In verse 13 he says to God in his heart, “Thou wilt not require it,” which a modern translation gives as “You will not call us to account.” In verse 15 the psalmist asks for exactly what the man has ruled out: that God would require his wickedness of him, and go on requiring it until there is none left to find.

      The first half of the verse, “Break thou the arm of the wicked,” is one of the Psalms’ prayers against an enemy. The psalmist asks God to do it and does not do it himself. The cursing psalms are taken up at [[Ps. 5:10]].
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]
  - ref: 16
    phrase: the heathen are perished out of his land
    kind: history
    title: The heathen in a psalm about the villages
    body: |
      “The heathen” are the nations of Psalm 9, brought back in the poem’s closing lines. Psalm 10 has so far described an oppressor at home, a man in ambush near the villages, and has not mentioned foreign peoples at all. The Hebrew word is the one translated “heathen” and “nations” five times in Psalm 9, where the LORD rebukes and judges them ([[Ps. 9:5]], [[Ps. 9:19–20]]). On one reading the two enemies have become one for the psalmist: “the heathen in Israel and the heathen world outside of Israel are blended together into one to his mind,” and he sees the LORD’s own land, the land of which the law says “for the land is mine; for ye are strangers and sojourners with me” ([[Lev. 25:23]]), cleared of both.

      The tense is the other question. The Hebrew verb is in a completed-action form, and the King James keeps it: the heathen “are perished.” The ancient Greek translation and a modern one both put it in the future: “the nations shall perish from his land.” The same older reading explains the past tense as certainty: the judgment “by the anticipation of faith, here stands before the mind of the suppliant as an accomplished fact.” The verse has also been read more simply, as the psalmist recalling that the “day of justice will come.”
    sources: [oshb-wlc, delitzsch-psalms, lds-scriptures, nrsvue, lxx-rahlfs, ot-minute-psalms-1-20]
  - ref: 18
    phrase: the man of the earth
    kind: words
    title: Man, from the earth
    body: |
      “Man” in the last line is *enosh*, a word for “man, mankind, mostly in poetry,” used “especially” where man is set over against God. It is the word of Psalm 8’s question, “What is man, that thou art mindful of him?” ([[Ps. 8:4]]).

      Psalm 9 closes with the same word. That psalm ends, “Put them in fear, O LORD: that the nations may know themselves to be but men” ([[Ps. 9:20]]), and “men” there is *enosh*. Both halves of the poem use the word in their last verse.

      The Hebrew of the line is uncertain. The verb behind “oppress” is glossed “cause trembling,” and a modern translation, which marks the meaning as uncertain, renders the line “so that those from earth may strike terror no more.”
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]

christ: |
  The King of verse 16 is the LORD, and “Jehovah is the premortal Jesus Christ.” The psalm’s hope is in Him: that He sees, that He requires, and that He hears “the desire of the humble.” The deliverance of the last two verses is what “the Righteous King will bring to the poor and oppressed.” On one reading, the kingship the psalmist confesses must at last be realised in the universality that John heard announced: “The kingdoms of this world are become the kingdoms of our Lord, and of his Christ; and he shall reign for ever and ever” ([[Rev. 11:15]]).

explore: |
  - **The whole poem.** Read Psalms 9 and 10 through as one, watching for the words the second half takes from the first: “times of trouble” ([[Ps. 9:9]]), “forgetteth not” ([[Ps. 9:12]]), “Arise” ([[Ps. 9:19]]), and “men” ([[Ps. 9:20]]).
  - **The same question in other mouths.** [[Ps. 13:1–2]] and [[Ps. 22:1]] ask it, and Psalm 13’s opening has been set beside Joseph Smith’s prayer in Liberty Jail, with this psalm’s first verse listed among its relatives: [[D&C 121:1–6]].

parallels:
  - ref: Ps. 9:9
    note: The promise of a refuge “in times of trouble,” which the first verse turns into a question.
  - ref: Ps. 9:19–20
    note: The “Arise” of verse 12 and the “men” of verse 18, at the close of the first half of the poem.
  - ref: Rom. 3:14
    note: Paul quotes verse 7, with the Greek’s “bitterness,” among the scriptures that show all are under sin.
  - ref: Ps. 14:1
    note: The fool who says in his heart that there is no God.

