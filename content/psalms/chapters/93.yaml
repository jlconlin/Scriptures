chapter: 93
title: Mightier Than Many Waters
tagline: The LORD reigns, robed and girded; the floods lift up their voice against a world He has made firm, and the psalm answers only that He is mightier, and that holiness befits His house.
when: 'Undated; the psalm has no title'

setting: |
  Psalm 93 has no title in the Hebrew or in the King James. The ancient Greek translation supplies one: “For the day before the Sabbath, when the land was first inhabited, the praise of a Song by David.” One older reading sets the ascription to David aside and keeps the first part: by its report of the Talmud this was the psalm of the sixth day of the week, because on that day God “had completed His creative work and began to reign” over His creatures. The psalm just before it is, by its title, “for the sabbath day.” The psalm itself names no author and no occasion.

  It stands in the fourth of the Psalter’s five books (Psalms 90–106), and it is the first psalm to open with “The LORD reigneth,” the cry that returns in [[Ps. 96:10]], [[Ps. 97:1]] and [[Ps. 99:1]]. It is counted with the psalms of praise, which dwell on the Lord’s “role as the creator and his divine reign as king of Israel.” How such psalms may have been used at Israel’s festivals is taken up at [[Ps. 47:8]].

  The same older reading dates the whole group after the return from exile. That is one judgment; nothing in the five verses fixes a date.

thread: |
  Psalm 93 is five verses with one threat in them, and **it meets the threat without a battle: the floods lift up their voice, and the psalm answers only that the LORD is mightier.**

  It opens with an announcement about the LORD. He reigns, robed in majesty and girded with strength, and the world stands firm (verse 1). Then it turns and speaks to Him: “Thy throne is established of old” (verse 2). One Hebrew verb says “stablished” of the world and “established” of the throne.

  Verse 3 is the only trouble in the psalm. The floods lift up three times, each line taking up the last, and the third time the verb moves from “have lifted up” to “lift up.” Nothing is said of what they threaten or whom.

  The turn is verse 4, and what makes it is a comparison, not an event. The LORD does not rebuke the sea here, or divide it. He is “on high,” and He is “mightier,” and the word for His might is the one the verse has just given the waves.

  Verse 5 comes down from the height to the earth, to His testimonies, which are “very sure,” and to His house, which holiness befits. On one older reading that is where the kingship is exercised: He is “King of His people,” the people who keep “His revelation” and worship “in His temple.”

sections:
  - range: 1-2
    heading: The King and His throne
    plain: |
      The LORD is King. He has robed Himself in majesty; the LORD has robed Himself and belted on strength. The world too stands firm and cannot be shaken. Your throne has stood firm from of old; You are from everlasting.
  - range: 3-4
    heading: The floods and the One on high
    plain: |
      The rivers have lifted up, O LORD, the rivers have lifted up their voice; the rivers lift up their crashing. Mightier than the voices of many waters, mightier than the mighty breakers of the sea, is the LORD on high.
  - range: 5
    heading: His testimonies and His house
    plain: |
      What You have decreed is altogether sure. Holiness befits Your house, O LORD, for ever.

notes:
  - ref: 1
    phrase: The LORD reigneth
    kind: words
    title: He reigns, or He has become King
    body: |
      “The LORD reigneth” can be heard as a standing fact or as news. The Hebrew is two words, the divine name and a verb in the completed tense that means to “be, or become king, or queen, reign.” The King James gives it as a present, and a modern translation has “is king.” One older reading presses the tense and hears an accession: “Jahve has entered upon the kingship and now reigns.” The cry and its use across the Psalms are introduced at [[Ps. 47:8]]; this is the first psalm to begin with it.

      On that older reading the cry looks forward. The verb is used “in relation to the last time” when Isaiah’s messenger says to Zion, “Thy God reigneth!” ([[Isa. 52:7]]), and when the elders in John’s vision give thanks “because thou hast taken to thee thy great power, and hast reigned” ([[Rev. 11:17]]). The reading does not mean that He was not King before: “He is King, and now too shows Himself to the world in the royal robe.” Verse 2 says as much of the throne: it is “of old.”
    sources: [oshb-wlc, bdb, nrsvue, delitzsch-psalms, lds-scriptures]
  - ref: 1
    phrase: wherewith he hath girded himself
    kind: symbol
    title: Robed in majesty, girded with strength
    body: |
      The LORD wears two things in verse 1: majesty as a robe and strength as a belt. For the first a modern translation has “he is robed in majesty.” The Hebrew verb for “girded himself” is recorded in this form in only one other verse, where it means to “gird oneself, for war”: Isaiah’s taunt to the nations, “gird yourselves, and ye shall be broken in pieces” ([[Isa. 8:9]]). That sense belongs to Isaiah’s verse. The psalm says only what He is girded with, which is strength.

      The word for “majesty” is also used of the sea. Its first sense is a “lifting up,” and it is the word for the “swelling of the sea” in another psalm, where the King James has “Thou rulest the raging of the sea” ([[Ps. 89:9]]).
    sources: [oshb-wlc, bdb, nrsvue]
  - ref: 2
    phrase: Thy throne is established of old
    kind: words
    title: One verb for the world and the throne
    body: |
      The world “is stablished” and the throne “is established” by one Hebrew verb, in two lines that follow each other. The King James varies the spelling; the Hebrew does not vary the word. Verse 1 says that the world stands and cannot be moved, and verse 2 sets beside it a firmness that is older: the throne has stood “of old,” and the One who sits on it is “from everlasting.”

      Here the psalm also turns to face Him. Verse 1 spoke about the LORD. From “Thy throne” on, every verse but the fourth speaks to Him.

      The line about the world returns three psalms later, where the nations are to be told “that the LORD reigneth: the world also shall be established that it shall not be moved” ([[Ps. 96:10]]). The Hebrew of that clause is the same five words as here. The King James puts it in the future there (“shall be established”) and in the present here.
    sources: [oshb-wlc, lds-scriptures]
  - ref: 3
    phrase: the floods lift up their waves
    kind: symbol
    title: What the rising rivers are
    body: |
      The psalm does not say what the floods are; one older reading takes them as the nations. The Hebrew word is the one for rivers, though by verse 4 the water is “the sea.” The verb comes three times, and its tense changes on the third: “have lifted up,” “have lifted up,” then “lift up.” One reading takes the change strictly: “The perfects affirm what has taken place, the future that which even now as yet is taking place.” What the floods lift up last is a word found nowhere else in the Psalms, for the “crashing, dashing” of waves. A modern translation has “the floods lift up their roaring.”

      On that older reading the waters are the powers of history. The sea “is an emblem of the Gentile world,” and the rivers “are emblems of worldly kingdoms,” as the Nile is of Egypt and the Euphrates of Assyria. Isaiah uses the picture that way outright. The LORD brings up on Judah “the waters of the river, strong and many, even the king of Assyria” ([[Isa. 8:7]]), and Isaiah speaks of “the rushing of nations, that make a rushing like the rushing of mighty waters” ([[Isa. 17:12]]). Psalm 46 uses one set of words for the sea and for the nations (see the note on [[Ps. 46:6]]).
    sources: [oshb-wlc, bdb, nrsvue, delitzsch-psalms, lds-scriptures]
  - ref: 4
    phrase: mightier than the noise of many waters
    kind: words
    title: The waters’ own words, given to the LORD
    body: |
      Verse 4 answers the floods in their own vocabulary. The “noise” of the many waters is the plural of the “voice” the floods lifted up in verse 3. And “mightier” and “mighty” are one Hebrew adjective, “majestic,” said first of the waves and then of the LORD. It is a word from Moses’s song at the sea, where the waters cover Pharaoh’s host and “they sank as lead in the mighty waters” ([[Ex. 15:10]]). The psalm grants the sea its grandeur and then says the same word of the LORD “on high.”

      The Hebrew line is compressed, and translators have divided it differently. The King James makes it a comparison throughout. A modern translation does the same, “More majestic than the thunders of mighty waters,” and notes that it corrects a Hebrew text that reads “majestic are the waves.” The ancient Greek has no comparison at all: “the billows of the sea are wonderful: the Lord is wonderful in high places.” All three leave the LORD on high, above the waves.
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs, lds-scriptures]
  - ref: 5
    phrase: holiness becometh thine house
    kind: words
    title: Sure testimonies, and a house that holiness befits
    body: |
      The last verse names two things on the earth, the LORD’s word and His house. “Testimonies” is a word used “always of laws as divine testimonies or solemn charges,” and a modern translation has “Your decrees are very sure.”

      “Becometh” is older English for “suits.” To become is “to suit or be suitable; to be congruous; to befit,” and the Hebrew verb in this verse means to “be befitting.” A modern translation has “holiness befits your house.” That verb is recorded in only two other verses, and one of them is Isaiah’s verse of the messenger whose feet are beautiful upon the mountains, who “saith unto Zion, Thy God reigneth!” ([[Isa. 52:7]]). “Beautiful” there and “becometh” here are the same word.
    sources: [oshb-wlc, bdb, nrsvue, webster-1828]

christ: |
  The LORD who reigns in this psalm is Jehovah, and “Jehovah is the premortal Jesus Christ and came to earth as a son of Mary.” An angel told King Benjamin that “the Lord Omnipotent who reigneth, who was, and is from all eternity to all eternity, shall come down from heaven among the children of men” ([[Mosiah 3:5]]), and that “he shall be called Jesus Christ, the Son of God” ([[Mosiah 3:8]]).

  The Church’s edition ties “clothed” in verse 1 to the day when “the Son of Man shall come down in heaven, clothed in the brightness of his glory” ([[D&C 65:5]]), and many psalms of this part of the book are read of the millennial day and the Messiah’s reign.

  One older reading explains how a psalm about the LORD’s own kingship, with no anointed king in it, belongs beside the psalms about His Anointed. The two lines of promise “run parallel with one another” through the Old Testament, and it is the fulfilment that shows the coming of the Anointed One and the coming of the LORD to be “one and the same.”

explore: |
  - **The LORD reigneth.** Read [[Ps. 96:10]], [[Ps. 97:1]] and [[Ps. 99:1]] after this psalm, with [[Ps. 47:8]] and [[Isa. 52:7]], watching what each sets after the cry.
  - **The voice of many waters.** In this psalm it belongs to the floods. Elsewhere it describes the Lord’s own voice: [[Ezek. 43:2]], [[Rev. 1:15]], [[D&C 110:3]] and [[D&C 133:22]]. In [[Rev. 19:6]] a voice like many waters says that the Lord God omnipotent reigneth.

parallels:
  - ref: Ps. 96:10
    note: The opening cry and the line about the world, repeated in the same Hebrew words.
  - ref: Isa. 52:7
    note: The messenger says to Zion, “Thy God reigneth!”; his feet are “beautiful” by the verb behind “becometh” in verse 5.
  - ref: Ps. 89:9
    note: The LORD rules the raging of the sea; “raging” is the word for “majesty” in verse 1.
  - ref: Ex. 15:10
    note: The “mighty waters” of the song at the sea, by the adjective of verse 4.
  - ref: Rev. 19:6
    note: A voice like many waters says that the Lord God omnipotent reigneth.
  - ref: D&C 65:5
    note: The Son of Man coming clothed in the brightness of His glory (the Church’s footnote to verse 1).
  - ref: Mosiah 3:5
    note: The Lord Omnipotent who reigneth, from all eternity to all eternity, comes down among men.

