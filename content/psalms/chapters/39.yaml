chapter: 39
title: A Stranger with Thee
tagline: A sufferer who vowed to keep silent breaks into prayer, measures his life as a handbreadth and a breath, and finds that the only thing left to wait for is the Lord.
when: 'Undated; a psalm of David by its title'

setting: |
  The title ascribes the psalm to David and names no occasion. What the psalm shows of its speaker is little: he is under a “stroke” he takes to be from God’s hand (verse 10), he has transgressions to be delivered from (verse 8), and the wicked are in front of him (verse 1).

  It stands in Book One next to Psalm 38, where the sufferer is “as a dumb man that openeth not his mouth” ([[Ps. 38:13]]), and that shared silence has been given as the reason the two were placed together. Psalm 62 has been judged closer still: it also carries Jeduthun’s name and also calls humankind “vanity” ([[Ps. 62:9]]).

  The confession of verse 12, that he is a stranger and a sojourner, recurs in scripture ([[1 Chr. 29:15]]; [[Heb. 11:13]]; [[1 Pet. 2:11]]); the note on verse 12 follows the phrase.

thread: |
  Psalm 39 begins with a vow of silence that gives way to prayer. **It moves from a silence the speaker imposed on himself to a silence whose reason he finds in God (“because thou didst it,” verse 9).** The turn between them is verse 7: “And now, Lord, what wait I for? my hope is in thee.”

  Verses 1–3 tell the story. He resolved to guard his tongue as long as the wicked stood before him. It did not work. His sorrow was stirred, his heart grew hot, the fire burned, and “then spake I with my tongue.” What follows is not said to the wicked or about them. It is said to the LORD.

  The first thing he asks is to know his end and the measure of his days (verse 4), and he supplies the measure himself: a handbreadth, “as nothing before thee.” One small Hebrew word stands four times in verses 5, 6 and 11 (“verily” once and “surely” three times in the King James), and each time it introduces a verdict on human life. “Every man is vanity” closes two stanzas, each followed by Selah (verses 5 and 11).

  “And now” is a customary way to mark a turning point, and verse 7 is one. If a man at his firmest is a breath, and what he gathers goes to someone he cannot name, what is left to wait for? The answer names no thing, only a person: “my hope is in thee.” From there he asks for deliverance from his transgressions (verse 8) and the lifting of the stroke (verse 10), and he is silent again, for a new reason (see the note on verse 9).

  The psalm does not end in praise. It ends in tears, with a plea to be let alone for a little “before I go hence, and be no more.” The hope of verse 7 and the darkness of verse 13 are both left standing.

sections:
  - range: 1-3
    heading: The vow of silence, and its failure
    plain: |
      I said, I will watch how I go, so that I do not sin with my tongue. I will keep a muzzle on my mouth as long as the wicked is in front of me. I was dumb and still. I kept quiet, even from good, and my pain was stirred up. My heart grew hot inside me; as I mused, the fire burned. Then I spoke with my tongue.
  - range: 4-6
    heading: A handbreadth and a breath
    plain: |
      LORD, let me know my end, and what the measure of my days is; let me know how fleeting I am. You have made my days a few handbreadths, and my lifetime is as nothing before You. Surely every man, standing firm, is only a breath. Surely a man goes about as a shadow. Surely they are in turmoil for nothing: he heaps things up and does not know who will gather them.
  - range: 7-11
    heading: My hope is in thee
    plain: |
      And now, Lord, what do I wait for? My hope is in You. Deliver me from all my transgressions; do not make me the scorn of the fool. I was dumb; I did not open my mouth, because it was You who did it. Take Your stroke away from me; I am worn out by the blow of Your hand. When You correct a man with rebukes for iniquity, You consume what is dear to him as a moth does. Surely every man is a breath.
  - range: 12-13
    heading: A guest who asks to be heard
    plain: |
      Hear my prayer, LORD, and listen to my cry; do not be silent at my tears. For I am a stranger with You, a sojourner, as all my fathers were. Look away from me, that I may smile again, before I go and am no more.

notes:
  - ref: 0
    phrase: even to Jeduthun
    kind: history
    title: Jeduthun, one of David’s three musicians
    body: |
      Jeduthun was one of the three Levites whose families David set over the music of the sanctuary, so the title connects the psalm with a named musician or his choir. Chronicles lists him beside Asaph and Heman among those “who should prophesy with harps, with psalteries, and with cymbals” ([[1 Chr. 25:1]]). He was appointed with Heman when the ark was brought up ([[1 Chr. 16:41–42]]), and his six sons served “under the hands of their father Jeduthun, who prophesied with a harp” ([[1 Chr. 25:3]]). He was “chief of one of the three choirs of the temple.”

      His name stands in three titles: here, at Psalm 62, and at Psalm 77, which is a psalm of Asaph. What it is doing there is uncertain. The King James’s “even to Jeduthun” reads as if he were the chief Musician himself; a modern translation has simply “to Jeduthun.” The other view takes the name in all three titles as a musical direction, “after the manner of (the choir of) Yeduthun.” In this title that view treats the Hebrew preposition as a copyist’s error.

      The chief Musician is explained under the title of Psalm 8 ([[Ps. 8:1]]).
    sources: [lds-scriptures, bdb, nrsvue]
  - ref: 1
    phrase: I will keep my mouth with a bridle
    kind: words
    title: A muzzle, and what he feared to say
    body: |
      The “bridle” is a muzzle, and the psalm does not say what words it was meant to hold in. The Hebrew noun is found only here in the Psalms, and the line means “let me keep a muzzle for my mouth, to avoid (hasty and) erring speech.”

      The verse gives one clue to what the sin would have been: the vow holds “while the wicked is before me.” On one older reading he meant not to sin “by any murmuring complaint concerning his own misfortune, when he saw the prosperity of the ungodly.” The prosperity is the commentator’s inference. The psalm mentions the wicked only in this verse and “the foolish” in verse 8, and of wealth it says only that a man heaps it up without knowing who will gather it (verse 6).

      What the text does show is that he counted speech in front of the wicked a risk of sin, and that when he finally speaks, in verse 4, he speaks to the LORD.
    sources: [bdb, delitzsch-psalms, oshb-wlc]
  - ref: 2
    phrase: even from good
    kind: words
    title: Silent even from good
    body: |
      The phrase is in Hebrew only “from good,” and translators have completed it in different ways. The King James’s “even from good” suggests that he kept back even what was good to say. The ancient Greek translators made that explicit: he “kept silence from good words.” A modern translation takes it of the result, “I held my peace to no avail.”

      The readings agree about what came of the silence. “My sorrow was stirred,” or “my distress grew worse.” Holding his tongue did not quiet him: the heat of verse 3 follows, and then the prayer of verses 4–13.
    sources: [oshb-wlc, lxx-rahlfs, nrsvue]
  - ref: 4
    phrase: make me to know mine end
    kind: words
    title: A prayer to know how short life is
    body: |
      The verse asks one thing three times, to be taught how brief his life is: his end, the measure of his days, how frail he is. A modern translation has “let me know how fleeting my life is.” He then gives the measure himself in verse 5.

      The prayer of Moses makes a like request and says what it is for: “So teach us to number our days, that we may apply our hearts unto wisdom” ([[Ps. 90:12]]). Psalm 39 goes on from the shortness of life to the question of verse 7, what there is to wait for.
    sources: [nrsvue, lds-scriptures]
  - ref: 5
    phrase: altogether vanity
    kind: words
    title: Vanity is a breath
    body: |
      “Vanity” here is a breath, a thing that is gone almost as soon as it comes, and has nothing to do with conceit. The Hebrew word is *hebel*, and a modern translation renders the line “Surely everyone stands as a mere breath.” It is the word Ecclesiastes uses again and again “of the fruitlessness of all human enterprise and endeavour.”

      The psalm leans on it. *Hebel* stands in only eight verses of the Psalms, and three of them are here: “vanity” in verse 5, “in vain” in verse 6, and “vanity” in verse 11. Twice it ends a stanza.

      Two other words in the verse are sharper than the English. “Handbreadth” is plural, “(a few) hand-breadths are my days”: a life measured by the width of a hand. And “at his best state” is a single Hebrew word for standing or standing firm, so that the line reads “every man, (even) the firm-standing, is wholly vanity.” The expression is unusual enough that the Hebrew text has been doubted. As it stands, it speaks of a man when he seems most secure.
    sources: [oshb-wlc, bdb, nrsvue]
  - ref: 6
    phrase: walketh in a vain shew
    kind: symbol
    title: A man as a passing shadow
    body: |
      The “vain shew” is an image or a shadow: a person goes about as the outline of something, with no substance of his own. The Hebrew word means an image, used here in the sense of a “mere, empty, image, semblance,” so that “a (mere) semblance man walks about.” The Greek translators wrote “man walks in a shadow,” and a modern translation has “Surely everyone goes about like a shadow.”

      The rest of the verse says what the shadow does. He is “disquieted in vain,” where “in vain” is the *hebel* of verse 5, and he heaps up riches “and knoweth not who shall gather them.”
    sources: [bdb, lxx-rahlfs, nrsvue, oshb-wlc]
  - ref: 9
    phrase: because thou didst it
    kind: structure
    title: The second silence
    body: |
      The psalm has two silences, told with the same Hebrew verb, and the second is not the first over again. “I was dumb” in verse 2 and “I was dumb” in verse 9 are the same word in the same form. The first silence was his own resolution, kept before the wicked, and it failed (verse 3). The second has its reason outside him: “because thou didst it,” or “for it is you who have done it.”

      What God did is not named. The next verse speaks of “thy stroke.” On one older reading it is his affliction: “he is silent and calm; for God is the author, viz., of his affliction,” and yet “it is permitted to him to pray that God would suffer mercy to take the place of right.” The Greek translators read the clause of creation instead, “for thou art he that made me.”

      Verse 9 is itself spoken to God, and the verses on both sides of it are petitions. At the end he asks God not to be silent: “hold not thy peace at my tears” (verse 12). The King James uses “peace” there and in verse 2 for two different Hebrew verbs.
    sources: [oshb-wlc, nrsvue, lxx-rahlfs, delitzsch-psalms]
  - ref: 11
    phrase: dost correct man for iniquity
    kind: scripture
    title: Suffering taken as correction
    body: |
      The speaker takes his suffering as God’s correction for sin. He asks to be delivered “from all my transgressions” (verse 8). He calls his trouble “thy stroke” and “the blow of thine hand” (verse 10), where the Hebrew is stronger than “blow”: “the hostility of thy hand.” Then he makes his own case a rule for everyone: under God’s rebukes a man’s “beauty” is consumed as by a moth. A modern translation has “what is dear to them” for the beauty, and one older reading pictures the result “as a moth-eaten garment falls into rags.”

      One older reading sets the psalm beside the book of Job, which “is occupied with the same riddle” but “advances a step further.” In this psalm “David does not know how to disassociate in his mind sin and suffering,” while Job “thinks of suffering and love together.” The comparison is that reading’s; the psalm does not make it. In the psalm the speaker asks for deliverance from his transgressions (verse 8) before he asks for relief (verse 10).
    sources: [bdb, nrsvue, delitzsch-psalms]
  - ref: 12
    phrase: for I am a stranger with thee, and a sojourner
    kind: scripture
    title: A resident alien on God’s land
    body: |
      “Stranger” and “sojourner” are the law’s words for people who live on land that is not theirs, and the psalmist says that this is his standing with God. The first is a “sojourner, temporary dweller, new-comer (no inherited rights)”; the second is apparently a more temporary and dependent kind of resident, and is used figuratively “of one enjoying only a temporary tenure.” In Israel a stranger was a foreigner who lived in the land by permission, and the law’s provisions for strangers “were intended to secure for them justice and fair treatment.” The verse gives this standing as the reason he should be heard: “Hear my prayer … for I am a stranger with thee.”

      The law of the land has the same pair: “The land shall not be sold for ever: for the land is mine; for ye are strangers and sojourners with me” ([[Lev. 25:23]]). There it is said of all Israel and of the land. In the psalm one man says it of himself. David says it again, in the plural, when the offerings for the temple are brought: “For we are strangers before thee, and sojourners, as were all our fathers: our days on the earth are as a shadow, and there is none abiding” ([[1 Chr. 29:15]]). In all three passages the one the strangers live with is the Lord.

      He is not a stranger to God but one who lodges with Him, “your passing guest” in a modern translation.

      Hebrews says the same of the fathers. The patriarchs “confessed that they were strangers and pilgrims on the earth” ([[Heb. 11:13]]), and Hebrews adds what the psalm does not say, that such people “desire a better country, that is, an heavenly” ([[Heb. 11:16]]).
    sources: [bdb, bd-stranger, lds-scriptures, nrsvue]
  - ref: 13
    phrase: O spare me
    kind: words
    title: Look away from me
    body: |
      The last request is, in Hebrew, that God look away: “cause thy gaze to turn away from me.” A modern translation has “Turn your gaze away from me, that I may smile again,” since the verb behind “recover strength” means to “shew a smile, look cheerful.” This comes one verse after he asked God to hear, to give ear, and not to keep silent.

      Job prays the same way: “How long wilt thou not depart from me, nor let me alone till I swallow down my spittle?” ([[Job 7:19]]); and, with the same verb for taking comfort, “Are not my days few? cease then, and let me alone, that I may take comfort a little” ([[Job 10:20]]).

      The psalm’s last words speak of death as an end: “before I go hence, and be no more.” What the psalmists say of the grave, and what the Restoration adds, is taken up at [[Ps. 6:5]].
    sources: [bdb, nrsvue, lds-scriptures]

christ: |
  The psalm calls on the LORD by name (verses 4 and 12), and the LORD is Jehovah, “the premortal Jesus Christ.” It is to Him that the speaker, having counted his own days as a handbreadth and every man as a breath, says “my hope is in thee” (verse 7), and of Him that he asks, “Deliver me from all my transgressions” (verse 8).

explore: |
  - **Another psalm with Jeduthun’s name.** [[Ps. 62:1–12]] weighs men as “lighter than vanity” (verse 9). Read the two together.
  - **The man who heaps up.** In the Savior’s parable of the rich man ([[Luke 12:16–21]]), God asks what verse 6 says a man does not know: “then whose shall those things be, which thou hast provided?” ([[Luke 12:20]]).
  - **Strangers who seek a country.** [[Heb. 11:8–16]], and with it [[D&C 45:11–14]], where the Savior speaks of those who “confessed they were strangers and pilgrims on the earth.”

parallels:
  - ref: 1 Chr. 29:15
    note: David’s prayer at the offering for the temple, with the words of verse 12 and life as a shadow.
  - ref: Lev. 25:23
    note: The land is the Lord’s, and Israel are strangers and sojourners with Him.
  - ref: Heb. 11:13–16
    note: The fathers confessed they were strangers and pilgrims and desired a heavenly country (also 1 Pet. 2:11).
  - ref: Ps. 62:9
    note: Another psalm with Jeduthun’s name, where men are lighter than vanity.
  - ref: Ps. 90:12
    note: The prayer to be taught to number our days.
  - ref: Job 10:20–21
    note: Job asks to be let alone for a little before he goes and does not return (also Job 7:19).
  - ref: Jer. 20:9
    note: A word held in becomes a fire that cannot be contained.

