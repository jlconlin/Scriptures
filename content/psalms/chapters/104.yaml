chapter: 104
title: How Manifold Are Thy Works
tagline: A hymn that goes through the creation from the sky to the sea and finds God still at work in it, watering, feeding, and giving breath to everything He has made.
when: 'Undated; the psalm has no title'

setting: |
  The psalm has no title. The ancient Greek translation heads it “A Psalm of David,” but nothing in the psalm names its writer or its occasion.

  Its first line ties it to the psalm before it. “Bless the LORD, O my soul” opens and closes Psalm 103 as well, and no other psalm has the line ([[Ps. 103:1]], where it is discussed). On one reading the two share a theme as well as a line: there it is God’s rule “in the kingdom of grace,” here His rule “in the kingdom of nature.”

  This is a hymn about the creation. It keeps Genesis 1 in view from the light of verse 2 to the LORD’s joy in His works in verse 31 (see the note on verse 2), and its subject is the providence by which He keeps every living thing alive. It asks God for nothing until its last verse.

  Other scripture takes up two of its lines. Hebrews quotes verse 4 of the angels ([[Heb. 1:7]]), and the picture of every creature waiting for God to open His hand returns in [[Ps. 145:15–16]]. The psalm’s last words, “Praise ye the LORD,” are the first hallelujah in the book of Psalms (see the note on verse 35).

thread: |
  **Psalm 104 praises a Creator who is still at work.** Genesis tells what God made. This psalm says what He does: He sends the springs, waters the hills, makes the grass grow, makes the darkness, opens His hand.

  The psalm moves downward and outward. It begins in the sky, with God wrapped in light, His chambers set on the waters above, cloud and wind for His chariot (verses 1–4). Then comes the earth, founded so that it will not move, and the deep that covered it driven back to its place by His rebuke (verses 5–9). Once the water has its bound it becomes a gift: springs in the valleys, rain on the hills, and after them a long list in which every creature has drink, food and a house. The wild asses drink, the birds sing in the branches, the stork has her fir trees, the wild goats their high hills, the conies their rocks (verses 10–18).

  Man enters the list at verse 14 without ceremony, between the cattle and the cedars. He is given wine and oil besides his bread, and in verse 23 he takes the day shift, going out to his work when the lions go home to their dens. He is fed from the same hand as the rest.

  Verse 24 is the turn. The list breaks into an exclamation, “O LORD, how manifold are thy works!” The sea follows, with Leviathan at play in it, and then the lines the psalm has been moving toward: all of them wait on God. He opens His hand and they are filled; He hides His face and they are troubled; He takes their breath and they die; He sends His spirit and they are created (verses 27–30).

  The close is a wish and a vow: may the LORD rejoice in His works, and the singer will sing as long as he lives. One line jars, “Let the sinners be consumed out of the earth” (see the note on verse 35). Then the psalm returns to its first words.

sections:
  - range: 1-4
    heading: The King in His sky
    plain: |
      Bless the LORD, my soul! LORD my God, You are very great. You are clothed in honor and majesty and wrapped in light like a robe. You stretch out the heavens like a tent curtain. You set the beams of Your chambers on the waters, make the clouds Your chariot, and go about on the wings of the wind. You make Your angels spirits and Your ministers a flaming fire (or: You make the winds Your messengers and flames of fire Your servants).
  - range: 5-9
    heading: The earth founded and the waters sent to their place
    plain: |
      You set the earth on its foundations so that it can never be shaken. You covered it with the deep like a garment, and the waters stood above the mountains. At Your rebuke they fled; at the sound of Your thunder they hurried away, up over the mountains and down the valleys, to the place You had made for them. You set a boundary they may not cross, so that they never again cover the earth.
  - range: 10-18
    heading: Water, food and a home for each
    plain: |
      He sends springs into the valleys, and they run between the hills. They give drink to every wild animal; the wild asses quench their thirst. Beside them the birds of the sky make their home and sing among the branches. From His chambers He waters the hills, and the earth has its fill of what You do. He makes grass grow for the cattle and plants for people to tend, to bring food out of the earth: wine that gladdens the heart, oil that makes the face shine, and bread that strengthens the heart. The LORD’s trees have their fill, the cedars of Lebanon that He planted. Birds nest in them; the stork has her house in the fir trees. The high hills belong to the wild goats, and the rocks shelter the conies (rock badgers).
  - range: 19-23
    heading: Night for the lions, day for man
    plain: |
      He made the moon to mark the times of the month and the year; the sun knows when to set. You bring darkness and it is night, and all the animals of the forest come creeping out. The young lions roar for their prey and seek their food from God. When the sun rises they slip away and lie down in their dens. Then man goes out to his work and labors until evening.
  - range: 24-30
    heading: The sea, and the breath of every living thing
    plain: |
      LORD, how manifold are Your works! In wisdom You made them all; the earth is full of what You have created. There is the sea, great and wide, with creeping things past counting, living things small and great. There go the ships, and there is Leviathan, which You made to play in it. All of them look to You to give them their food at the right time. You give it and they gather it; You open Your hand and they are filled with good things. You hide Your face and they are troubled; You take away their breath and they die and return to their dust. You send out Your spirit and they are created, and You renew the face of the ground.
  - range: 31-35
    heading: May the LORD rejoice in His works
    plain: |
      May the glory of the LORD last forever; may the LORD rejoice in His works. He looks at the earth and it trembles; He touches the hills and they smoke. I will sing to the LORD as long as I live; I will sing praise to my God while I have being. May my thoughts of Him be sweet; I will be glad in the LORD. Let sinners be consumed from the earth, and let the wicked be no more. Bless the LORD, my soul. Praise the LORD!

notes:
  - ref: 2
    phrase: who stretchest out the heavens like a curtain
    kind: scripture
    title: Genesis 1 sung in the present tense
    body: |
      The psalm goes through the creation in roughly the order of Genesis 1, but as something God is doing now. It begins with light (verse 2; [[Gen. 1:3]]) and the heavens stretched over the waters (verses 2–3; [[Gen. 1:6–8]]). The waters withdraw to their place and the land stands clear (verses 6–9; [[Gen. 1:9]]). Grass and herb follow (verse 14; [[Gen. 1:11–12]]), then the moon and the sun (verse 19; [[Gen. 1:14–18]]), then the sea and its swarming life (verse 25; [[Gen. 1:20–21]]). At the end the psalm wishes that the LORD may rejoice in His works (verse 31), as at the first He looked at everything He had made, “and, behold, it was very good” ([[Gen. 1:31]]).

      The match is loose. On one reading the psalm is “altogether an echo” of the seven days, written by a poet who “has the order of the days of creation before his mind,” and yet it is not “so worked out that each single group celebrates the work of a day of creation.” It “begins with the light and closes with an allusion to the divine Sabbath,” but beasts and birds are drinking and nesting long before the sea is reached, and man is at work in verse 23.

      The larger difference is the tense. Genesis tells a thing said and done: “And God said, Let the waters under the heaven be gathered together unto one place, and let the dry land appear: and it was so” ([[Gen. 1:9]]). The psalm says He sends, waters, makes to grow, gives. The same reading explains why: what happened once at the creation can be told as present “because the original setting is continued in the preservation of the world.” The psalm treats making the world and keeping it as one work.
    sources: [delitzsch-psalms, lds-scriptures]
  - ref: 4
    phrase: Who maketh his angels spirits
    kind: scripture
    title: Winds made messengers, or angels made spirits
    body: |
      The line can be read in two directions, and the New Testament quotes it in the one the King James follows. The Hebrew word behind “angels” is the ordinary word for a “messenger,” and the word behind “spirits” means “breath, wind, spirit”; it is the word translated “wind” at the end of verse 3. So the Church’s edition offers the alternative “the winds His messengers,” and a modern translation prints “you make the winds your messengers” and “fire and flame your ministers.” That reading suits what stands around it, where the clouds are His chariot and He walks on the wings of the wind. The weather runs His errands.

      The ancient Greek translators took the line the other way, with the angels as what is made, and so does Hebrews when it quotes the verse ([[Heb. 1:7]]). In the Greek it runs, “Who makes his angels spirits, and his ministers a flaming fire.” Hebrews is setting the angels beside the Son. This is what scripture says of the angels; “But unto the Son he saith, Thy throne, O God, is for ever and ever” ([[Heb. 1:8]]). The angels are “ministering spirits, sent forth to minister” ([[Heb. 1:14]]).

      On either reading the messengers are servants, made and sent, and Hebrews sets the Son on the other side of that line.
    sources: [bdb, oshb-wlc, nrsvue, lxx-rahlfs, lds-scriptures]
  - ref: 9
    phrase: that they turn not again to cover the earth
    kind: scripture
    title: The bound of the sea, at the Creation and after the Flood
    body: |
      By their place in the psalm, verses 6–9 are the gathering of the waters at the creation, and the Church’s footnotes point to the Flood as well. The deep covers the earth just after its founding, God rebukes it, and the waters go to the place He founded for them, as in Genesis they are “gathered together unto one place” so that dry land appears ([[Gen. 1:9]]; see the note on verse 2).

      But waters standing above the mountains is also what happened in Noah’s day, and the footnote to verse 6 points there ([[Gen. 7:19]]). The footnote to verse 9, on waters that will not return to cover the earth, points to Enoch, to whom the Lord “sware unto him with an oath, that he would stay the floods” ([[Moses 7:51]]). The psalm’s words fit both, and it names neither.
    sources: [lds-scriptures]
  - ref: 26
    phrase: there is that leviathan, whom thou hast made to play therein
    kind: symbol
    title: Leviathan at play
    body: |
      In this psalm the sea monster is one more of God’s creatures, made to play in the sea. Elsewhere in the Old Testament Leviathan is an enemy. God breaks its heads in [[Ps. 74:14]], and Isaiah has the LORD punish “leviathan that crooked serpent” with His sword ([[Isa. 27:1]]). One reading puts this verse with those, among the places that “refer to beings known as Leviathan and Rahab whom Yahweh slays,” verses “understood by many biblical scholars to be a reference to a myth in which Yahweh kills a cosmic sea-monster” (the note on [[Ps. 74:14]] sets that reading out). The verse itself tells of no battle; the creature is at play.

      Leviathan can be “any great sea or land monster,” an actual animal or a symbol, and the psalm does not say what kind of creature it has in mind; the Greek translators wrote “this dragon.” What the psalm does say is that God made it. A modern translation has “Leviathan that you formed to sport in it.” It comes in the same line as the ships, and the next verse puts it with everything else that waits on God for its food.
    sources: [bd-leviathan, sc-knowhy-866, lxx-rahlfs, nrsvue]
  - ref: 30
    phrase: Thou sendest forth thy spirit, they are created
    kind: words
    title: One word for breath and for spirit
    body: |
      “Breath” in verse 29 and “spirit” in verse 30 are the same Hebrew word, so the two verses say one thing from both sides. The word, *ruach*, means “breath, wind, spirit,” and a modern translation notes at verse 30 that “your spirit” may be read “your breath.” God takes away their *ruach* and they die; He sends out His *ruach* and they are created. What leaves the creature in the one verse and what God sends in the other go by one name.

      The psalm says “created” of what is happening now, as it has said “sendeth” and “watereth” of the springs and the rain (see the note on verse 2). What is renewed is “the face of the ground,” as a modern translation has it.
    sources: [oshb-wlc, bdb, nrsvue]
  - ref: 35
    phrase: Let the sinners be consumed out of the earth
    kind: scripture
    title: Sinners in a good creation, and the first hallelujah
    body: |
      The psalm closes by wishing sinners gone from the creation it has praised, and then adds the first hallelujah in the book of Psalms. Through the psalm every creature has had its place, its food and its house, and the LORD has just been asked to rejoice in His works. On one reading that is why the wish comes here: the psalm “closes with the wish that evil may be expelled from this good creation,” because sinners “are contrary to the purpose of the good creation of God” and “mar the joy of His creatures.” How such prayers are to be read is set out at [[Ps. 137:8]].

      The psalm then repeats its first line and adds a new one. “Praise ye the LORD” is the Hebrew hallelujah (the note on the word is at [[Ps. 150:1]]), and within the Psalter it “is found here for the first time.” The first line was spoken to the singer’s own soul. The hallelujah “summons all creatures to the praise of God.”
    sources: [delitzsch-psalms, lds-scriptures]

christ: |
  The LORD this psalm praises is Jehovah, and the Restoration says plainly who did the work of creation: God the Father formed the heavens and the earth through His Son, Jesus Christ. The Father tells Moses, “by the Son I created them, which is mine Only Begotten” ([[Moses 1:33]]), and John writes, “All things were made by him” ([[John 1:3]]).

  Hebrews 1 is where the New Testament touches this psalm. It opens by saying that God made the worlds by His Son ([[Heb. 1:2]]). It quotes verse 4 to show the angels as servants ([[Heb. 1:7]]; see the note on verse 4), and of the Son it says, in the words of Psalm 102, “Thou, Lord, in the beginning hast laid the foundation of the earth” ([[Heb. 1:10]]).

explore: |
  - **Genesis beside the psalm.** Read [[Gen. 1:1–31]] and then the psalm again, watching what the psalm keeps, what it moves, and where it changes “God made” into “He makes.”
  - **The Lord’s questions to Job.** In [[Job 38:1–41]] the Lord asks Job about the foundations of the earth and the doors of the sea, the ground this psalm covers as praise.
  - **Fed from God’s hand.** [[Ps. 145:15–16]] and the Savior’s [[Matt. 6:26]].
  - **The fulness of the earth.** [[D&C 59:16–21]], with what it asks in return.
  - **The other creation psalms.** [[Ps. 8:3–8]] and [[Ps. 19:1–6]]; for Leviathan as an enemy, [[Ps. 74:13–14]].

parallels:
  - ref: Gen. 1:1–31
    note: The order of creation that the psalm follows loosely and turns into the present tense.
  - ref: Heb. 1:7
    note: Verse 4 quoted of the angels, who are set beside the Son.
  - ref: Ps. 103:1
    note: The neighboring psalm opens and closes with the same line.
  - ref: Ps. 145:15–16
    note: Every creature waiting for God to open His hand (verses 27–28).
  - ref: Job 38:8–11
    note: The Lord shuts up the sea with doors and sets its limit (verse 9).
  - ref: D&C 59:16–20
    note: The things of the earth made to gladden the heart and strengthen the body (verse 15).

