chapter: 122
title: Within Thy Gates, O Jerusalem
tagline: A pilgrim is glad to be asked up to the house of the LORD, stands inside Jerusalem’s gates, looks at the city, and prays for its peace.
when: 'By its title, David’s; no occasion is given'

setting: |
  This is the third of the fifteen songs of degrees (Psalms 120–134); the name is explained at [[Ps. 120:1]]. Of the first three it is the one set inside the city. Psalm 120 is the song of a sojourner who has lived too long “with him that hateth peace” ([[Ps. 120:6]]). Psalm 121 looks up: “I will lift up mine eyes unto the hills” ([[Ps. 121:1]]). Psalm 122 stands inside the gates and asks for peace.

  The title gives the song to David and names no occasion. The psalm itself shows a city with gates, walls and palaces, a house of the LORD in it, the tribes coming up to give thanks, and the house of David sitting in judgment.

  It is read as a song of the pilgrim feasts, when Israel was commanded to appear before the LORD (see the note on [[Ps. 122:4]]).

thread: |
  Psalm 122 is **a pilgrim’s arrival, and what he does once he is there**. It opens with one man’s gladness at an invitation: “Let us go into the house of the LORD.” By verse 2 the “I” has become “our,” and the feet are inside the gates. The journey between is not told.

  Then he looks. Verses 3–5 are addressed to no one; they say what the city is. It is built and holds together. The tribes come up to it because they were told to, and they come to give thanks. And it is where judgment is given, from the thrones of David’s house.

  At verse 6 the psalm turns from describing the city to speaking to it. The man who was glad to come now asks something for the place: “Pray for the peace of Jerusalem.” Peace is named in each of the next three verses, and the city is addressed as “thee.”

  He gives two reasons, one to a verse. He asks for his “brethren and companions’ sakes,” and he asks “because of the house of the LORD our God.” The psalm ends on the words it began with. The house of the LORD is why he was glad to come, and it is why he will seek the city’s good.

sections:
  - range: 1-2
    heading: Glad to go up
    plain: |
      I was glad when they said to me, “Let us go to the house of the LORD.” Our feet are standing inside your gates, Jerusalem.
  - range: 3-5
    heading: The city the tribes come up to
    plain: |
      Jerusalem is built as a city joined firmly together. The tribes go up to it, the tribes of the LORD, as Israel was commanded, to give thanks to the name of the LORD. For thrones of judgment are set there, the thrones of the house of David.
  - range: 6-9
    heading: Peace be within thee
    plain: |
      Pray for the peace of Jerusalem: may those who love you prosper. Peace be inside your walls, and safety inside your palaces. For the sake of my brothers and my friends I will say, “Peace be within you.” For the sake of the house of the LORD our God I will seek your good.

notes:
  - ref: 0
    phrase: of David
    kind: history
    title: David’s name, and a house of the LORD before the temple
    body: |
      The title gives this song to David, and yet the psalm goes up to “the house of the LORD,” which was left for David’s son to build ([[2 Sam. 7:13]]). The phrase did not wait for Solomon. The sanctuary at Shiloh is called by it in Hannah’s story: she brought her son “unto the house of the LORD in Shiloh” ([[1 Sam. 1:24]]). It is used in David’s own lifetime too. He “came into the house of the LORD, and worshipped” ([[2 Sam. 12:20]]), though he had said himself that “the ark of God dwelleth within curtains” ([[2 Sam. 7:2]]). So the title and the words of verses 1 and 9 do not contradict each other.

      One older reading infers from verse 3 that the poet “lived much later,” in the Jerusalem “which rose again out of its ruins” after the exile, taking “builded” as “built up again.” The psalm does not say so. What a title is worth is discussed at [[Ps. 3:1]].
    sources: [lds-scriptures, delitzsch-psalms]

  - ref: 1
    phrase: Let us go into the house of the LORD
    kind: history
    title: An invitation, and then the gates
    body: |
      The psalm opens with an invitation from other people, “they said unto me,” and it is in the plural: “Let us go.” It has been read as a pilgrimage psalm that catches what every one of those journeys ended in, “the experience of the temple,” and the feasts were marked throughout by “a feeling of joy centered on the temple.”

      Verse 2 is not a hope for the future, though the King James Version makes it sound like one. The Hebrew does not have a future tense here; it says that the feet have been standing. A modern translation has “Our feet are standing,” and the old Greek has “Our feet stood.” The first puts the pilgrims in the gates as the song is sung; the second has the singer looking back on having stood there. In both the journey is over by the second verse, and the rest of the psalm is spoken by someone who has seen the city.
    sources: [skinner-seeing-god, biblehub-interlinear, nrsvue, lxx-rahlfs]

  - ref: 3
    phrase: compact together
    kind: words
    title: A city joined to itself
    body: |
      “Compact together” says that Jerusalem holds together as one thing. The Hebrew is, word for word, a city “joined to itself together,” and a modern translation has “bound firmly together.” The English can suggest walls and houses built close.

      The ancient Greek translators heard it of people, and rendered the line “a city whose fellowship is complete.” The verse itself does not settle which is meant, and the sentence does not stop at verse 3: it runs on, “Whither the tribes go up.”
    sources: [biblehub-interlinear, nrsvue, lxx-rahlfs]

  - ref: 4
    phrase: unto the testimony of Israel
    kind: scripture
    title: Going up was commanded
    body: |
      “The testimony of Israel” is most likely the law that told the tribes to come. A modern translation gives the phrase as “as was decreed for Israel,” taking “testimony” as a decree, and refers the reader to the law of Moses: “Three times in a year shall all thy males appear before the LORD thy God in the place which he shall choose” ([[Deut. 16:16]]), at the feasts of unleavened bread, of weeks and of tabernacles.

      So what the singer of verse 1 was glad to be asked to do was, on this reading, a commandment. The psalm also says what the tribes came to do, which was “to give thanks unto the name of the LORD.”

      Two things in the record bear on the journey. The first is how hard it was to keep. The command “presupposed a state of settled peace rarely if ever realized” in Old Testament times, and could not be kept generally or even often. The second is what a rival king feared from it. When the northern tribes broke away, Jeroboam reasoned, “If this people go up to do sacrifice in the house of the LORD at Jerusalem, then shall the heart of this people turn again unto their lord” ([[1 Kgs. 12:27]]). He set up golden calves and told his people, “It is too much for you to go up to Jerusalem” ([[1 Kgs. 12:28]]).
    sources: [lds-scriptures, nrsvue, bd-feasts]

  - ref: 5
    phrase: thrones of judgment
    kind: history
    title: Why thrones are a reason to go up
    body: |
      The thrones of judgment are a reason the tribes come, as the “For” that begins verse 5 shows: Jerusalem was where a case could be heard. In Israel the king was a judge. People with a dispute “came to the king for judgment” ([[2 Sam. 15:2]]), and Solomon built beside his palace “a porch for the throne where he might judge” ([[1 Kgs. 7:7]]).

      The law had joined the place of worship and the place of judgment before there was a king. A local court with “a matter too hard for thee in judgment” was to “get thee up into the place which the LORD thy God shall choose” ([[Deut. 17:8]]) and lay it before the priests and the judge there. A later king of David’s line, Jehoshaphat, seated priests, Levites and heads of families in Jerusalem “for the judgment of the LORD, and for controversies” ([[2 Chr. 19:8]]).

      So the psalm names two houses in Jerusalem, the LORD’s and David’s. The psalm does not say why the thrones are plural; it says only that they belong to “the house of David.”
    sources: [lds-scriptures, nrsvue]

  - ref: 6
    phrase: Pray for the peace of Jerusalem
    kind: scripture
    title: Peace, asked for a city
    body: |
      The last four verses ask one thing for Jerusalem, and say it three times: peace. In Hebrew the request is partly made of sound. The words for “peace,” “prosper” and “prosperity” (*shalom*, *yishlayu*, *shalvah*) chime with one another, and all of them with the name *Yerushalayim*, so that the prayer seems to be drawn out of the city’s own name.

      “They shall prosper that love thee” is a wish more than a promise. A modern translation has “May they prosper who love you,” and gives verse 7’s “prosperity” as “security.” What is asked is the quiet of a city that is safe inside its walls.

      The reasons are the brethren and the house of the LORD (verses 8–9). The psalm’s “seek thy good” has been compared with Jeremiah’s word to the exiles in Babylon, to “seek the peace of the city whither I have caused you to be carried away captives” ([[Jer. 29:7]]).
    sources: [lds-scriptures, delitzsch-psalms, biblehub-interlinear, nrsvue]

christ: |
  The LORD whose house the tribes go up to is Jehovah, who is Jesus Christ before His birth ([[Ps. 110:1]]), and in mortality He made the pilgrim’s journey Himself. At twelve He was in the company that “went up to Jerusalem after the custom of the feast” ([[Luke 2:42]]), and during His ministry “Jesus went up to Jerusalem” for the Passover ([[John 2:13]]).

explore: |
  - **The songs on either side.** [[Ps. 120]] and [[Ps. 121]], the far country and the road; then [[Ps. 125]] and [[Ps. 128]], which both close with peace upon Israel.
  - **The command behind the journey.** [[Deut. 16:1–17]], the three feasts and the place the LORD would choose.
  - **The same invitation in the last days.** [[Isa. 2:2–3]], where many people say, “Come ye, and let us go up to the mountain of the LORD.”
  - **Who may go in.** [[Ps. 24:3]], on ascending the hill of the LORD.
  - **A king against the pilgrimage.** [[1 Kgs. 12:25–33]], Jeroboam’s calves and his feast.

parallels:
  - ref: Deut. 16:16
    note: The law commands Israel to appear before the LORD three times a year, the “testimony” of verse 4.
  - ref: Isa. 2:3
    note: Many people say, “let us go up to the mountain of the LORD, to the house of the God of Jacob.”
  - ref: Luke 2:41–42
    note: Jesus goes up to Jerusalem with His family for the Passover.
  - ref: Luke 19:41–42
    note: The Savior weeps over Jerusalem and speaks of “the things which belong unto thy peace.”
  - ref: Matt. 19:28
    note: The Savior promises the Twelve thrones, “judging the twelve tribes of Israel.”
  - ref: D&C 109:62
    note: The Kirtland Temple prayer asks that Jerusalem may begin to be redeemed.

