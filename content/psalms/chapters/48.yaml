chapter: 48
title: The City of the Great King
tagline: A congregation that has watched invading kings turn and run praises the God who is in Zion, then is sent to walk round the city and count its towers so that it can tell the next generation.
when: 'Undated; for the sons of Korah by its title'

setting: |
  Psalm 48 has been read together with the two psalms before it, which are also for the sons of Korah (for the family, see [[Ps. 42:1]]). On that reading the three are joined by one thought, the LORD exalted above the peoples of the earth: Psalm 46 opens “God is our refuge and strength” ([[Ps. 46:1]]), and Psalm 47 calls Him “a great King over all the earth” ([[Ps. 47:2]]). In Psalm 48 the song of thanksgiving has become a song in praise of the city itself. It is counted with the songs of Zion, psalms that “celebrate the location of the temple at Mount Zion.”

  The title names no occasion. The psalm tells of kings who came against the city together and fled at the sight of it (verses 4–7), and of a congregation that afterward stands in the temple (verse 9). The note on verse 4 gives the occasion that has been proposed.

  The speaker is “we” from beginning to end; no single voice is heard. A Selah closes verse 8 (on the word, see [[Ps. 3:2]]).

  Two later passages have the words of verse 2. The Savior calls Jerusalem “the city of the great King” ([[Matt. 5:35]]), and Lamentations puts “The joy of the whole earth” ([[Lam. 2:15]]) in the mouths of those who mocked the city after it fell.

thread: |
  Psalm 48 praises a city and the God who is in it. It opens “Great is the LORD” and closes “this God is our God,” and Zion (her height, her palaces, her towers) fills the lines between.

  The psalm has three verbs in order: heard, seen, tell. **Its hinge is verse 8: “As we have heard, so have we seen.”** What has been seen is told in verses 4–7. Kings assembled and advanced, and then “They saw it, and so they marvelled; they were troubled, and hasted away.” The psalm reports no battle. The kings see and flee; the congregation sees and stays to praise, and the Hebrew verb is the same for both.

  After the Selah the congregation is in the temple, and its praise travels outward and back: from “the midst of thy temple” (verse 9) to “the ends of the earth” (verse 10), then home to Mount Zion and the daughters of Judah (verse 11).

  The last turn is a command. Those who have seen are sent to walk round the city and count its towers, “that ye may tell it to the generation following.” The final verse follows with its reason: “For this God is our God for ever and ever.” What this generation has seen, the next is to be told.

sections:
  - range: 1-3
    heading: Great is the LORD in His city
    plain: |
      The LORD is great and greatly to be praised in the city of our God, on His holy mountain. Mount Zion rises in beauty, the joy of the whole earth, on the sides of the north, the city of the great King. In her strongholds God has made Himself known as a refuge.
  - range: 4-8
    heading: The kings saw and fled
    plain: |
      For look, the kings gathered and came on together. They saw, and at once they were astounded; they panicked and ran. Trembling seized them there, pain like that of a woman in labor. With an east wind You shatter the ships of Tarshish. What we had heard we have now seen, in the city of the LORD of hosts, the city of our God. God will make it stand for ever.
  - range: 9-11
    heading: Praise from the temple to the ends of the earth
    plain: |
      In the middle of Your temple, O God, we have thought on Your lovingkindness. As Your name is, O God, so is Your praise, to the ends of the earth. Your right hand is full of righteousness. Let Mount Zion be glad and the daughters of Judah rejoice because of Your judgments.
  - range: 12-14
    heading: Walk about Zion
    plain: |
      Walk around Zion; go all the way round her. Count her towers. Look closely at her ramparts and pass through her palaces, so that you can tell the next generation. For this God is our God for ever and ever. He will guide us even to death.

notes:
  - ref: 2
    phrase: Beautiful for situation
    kind: words
    title: Situation means height
    body: |
      “Situation” here is elevation. The Hebrew noun means “elevation, height,” and the phrase is glossed “beautiful in elevation (of Mount Zion)”; a modern translation prints the same words.

      Jerusalem stood high. Until David took it, it had been a mountain fortress, about 2,600 feet above the sea, with deep valleys on every side but the north.
    sources: [bdb, nrsvue, bd-jerusalem]

  - ref: 2
    phrase: on the sides of the north
    kind: symbol
    title: The sides of the north
    body: |
      “The sides of the north” are the words Isaiah has for the far north as a divine dwelling, and the psalm says them of Zion.

      The two Hebrew words (*yarkete tsaphon*) are the words of the king of Babylon’s boast that he will sit “upon the mount of the congregation, in the sides of the north” ([[Isa. 14:13]]). They are glossed “remote parts of the north,” and in Isaiah’s verse those parts are named “as divine abode.” In various lands the dwelling place of Deity was thought to be in the north, and the phrase in this verse is explained from that belief.

      One modern translation treats the second word as a name: “like the heights of Zaphon” is Mount Zion, with the note that “Zaphon was the most sacred mountain of the Canaanites.” That is one translation’s reading; on it the psalm likens Zion to that mountain.
    sources: [oshb-wlc, bdb, lds-scriptures, niv]

  - ref: 4
    phrase: the kings were assembled
    kind: history
    title: Which kings
    body: |
      The psalm does not name the kings, and the occasion that has been proposed for it is the invasion of Judah in Jehoshaphat’s day. Moab, Ammon and others came against him. He stood with the congregation in the temple, and Levites “of the children of the Korhites” ([[2 Chr. 20:19]]) stood up to praise. The army went out toward the wilderness of Tekoa, and when the singing began the invaders “were smitten” ([[2 Chr. 20:22]]). Afterward “the fear of God was on all the kingdoms of those countries” ([[2 Chr. 20:29]]).

      One older reading fits the psalm to that story. On it, “the kings,” with the article, “points to a definite number of kings known to the poet.” The allies camped toward Tekoa, “about three hours distant from Jerusalem,” where the view reaches the city, so that they “saw it” and fled. Verse 9 looks back to “the service held in the temple before the army set out.” And the wrecked ships of verse 7 are taken as shaped by a memory from the same reign, when Jehoshaphat’s own merchant fleet was “broken at Ezion-geber” ([[1 Kgs. 22:48]]).

      Chronicles tells the end differently from the psalm, where the kings see and run: when Judah came to the watchtower the invaders “were dead bodies fallen to the earth, and none escaped” ([[2 Chr. 20:24]]). The same reading grants that it is “equally admissible” to refer Psalms 46–48 to the defeat of Sennacherib’s army under Hezekiah. Either is a proposal. The psalm itself names no king and no year.
    sources: [delitzsch-psalms, lds-scriptures]

  - ref: 7
    phrase: the ships of Tarshish
    kind: symbol
    title: Ships in a song about a mountain
    body: |
      Ships of Tarshish were ships of the largest size, and the psalm names them in a song that is otherwise about a city on a mountain. Tarshish was “probably Tartessus in Spain,” and the name “came to be used to denote ships of the largest size, suitable for long voyages.”

      One modern translation makes the verse a comparison and joins it to the kings’ panic: trembling seized them “as when an east wind shatters” such ships. The Hebrew verb is in the second person, as the King James has it: “Thou breakest.” The congregation turns from describing the kings to addressing God.

      Ezekiel has the same picture in the verse after he mentions the ships of Tarshish: “the east wind hath broken thee in the midst of the seas” ([[Ezek. 27:26]]), with the Hebrew words for the east wind and for breaking that this verse has.
    sources: [bd-tarshish, nrsvue, oshb-wlc]

  - ref: 8
    phrase: God will establish it for ever
    kind: scripture
    title: For ever, and a city that fell
    body: |
      The congregation sings that God will establish the city for ever, and Jerusalem afterward fell; one older reading answers that “The Holy City does not fall without again rising up.”

      Scripture itself records the fall. Lamentations has the passers-by hiss at the ruined city and ask, “Is this the city that men call The perfection of beauty, The joy of the whole earth?” ([[Lam. 2:15]]). The last phrase is in verse 2 of this psalm, with the same Hebrew noun for “joy.” After the return from exile Jerusalem was gradually rebuilt, and in A.D. 70 the Romans destroyed it entirely.

      On that reading, the city’s being trodden down for a season “no more annuls the promise of God than Israel’s temporary rejection annuls Israel’s election.” The promise is still read as future: Zion will be established for ever.
    sources: [lds-scriptures, oshb-wlc, bd-jerusalem, delitzsch-psalms]

  - ref: 9
    phrase: We have thought of thy lovingkindness
    kind: words
    title: Thinking on lovingkindness in the temple
    body: |
      The verb for what the congregation does in the temple is one of pondering or picturing. It is glossed “think of” in this verse, among senses that include to “imagine, form an idea”; a modern translation has “We ponder your steadfast love.”

      “Lovingkindness” is the Hebrew *hesed*, which is explained at [[Ps. 51:1]].
    sources: [bdb, nrsvue, oshb-wlc]

  - ref: 11
    phrase: the daughters of Judah
    kind: words
    title: 'Daughters of Judah: women or towns'
    body: |
      The daughters of Judah may be the women of Judah or its towns, and translations divide. The plural is “often” a “designation of women of a particular city, land, or people,” and the phrase here and in [[Ps. 97:8]] has been listed with that use. Modern translations take it as a figure for the smaller places around the capital: “the towns of Judah,” with a note that the Hebrew is “daughters,” or “the villages of Judah.”
    sources: [bdb, nrsvue, niv]

  - ref: 12
    phrase: tell the towers thereof
    kind: words
    title: Tell means count, and then recount
    body: |
      To “tell” the towers is to count them, and the same Hebrew verb returns in the next verse for telling the next generation. Modern translations have “count its towers” here and “tell” there; the King James has one English word for both. In Hebrew the counting and the recounting are one verb in two forms.

      One reading explains why the towers need counting. The call is to the people of Jerusalem, who “have remained behind the walls of the city in anxious expectation” while the army was away. Now they are to go round the outside and “see that its towers are all standing, its bulwark is intact.”

      The purpose is stated in the text: “that ye may tell it to the generation following.” A modern translation runs the sentence on into verse 14, “that you may tell the next generation” “that this is God,” so that this is what the next generation is told.
    sources: [nrsvue, oshb-wlc, bdb, delitzsch-psalms]

  - ref: 14
    phrase: even unto death
    kind: words
    title: Unto death, or for evermore
    body: |
      The psalm’s last two Hebrew words are uncertain, and ancient and modern translations give them differently. As the Hebrew text is printed, they are a preposition and the word for death, and the King James follows it: God will guide “even unto death.”

      The ancient Greek translation ends “he will be our guide for evermore,” and modern translations have “He will be our guide forever” or “even to the end.” It has also been proposed to read the two words as one, the musical term Alamoth of Psalm 46’s title (“to (the voice of) young women”; see [[Ps. 46:1]]), and to move it “probably to Psalm 49:1,” that is, to the heading of the next psalm. If that proposal is right, it is not part of this psalm’s last sentence at all.

      What stands without question is the line before it: “this God is our God for ever and ever,” and He “will be our guide.”
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, niv, bdb]

christ: |
  The King of this psalm is named in its first line: the LORD, great in the city of our God. In the Sermon on the Mount Jesus gives Jerusalem the name it has in verse 2: His disciples are not to swear by it, “for it is the city of the great King” ([[Matt. 5:35]]).

  The New Testament also carries the name of Mount Zion forward. Hebrews tells believers that they “are come unto mount Sion, and unto the city of the living God, the heavenly Jerusalem,” and names among those they have come to “Jesus the mediator of the new covenant” ([[Heb. 12:24]]). The psalm ends with a God who is “our God for ever and ever” and who guides His people.

explore: |
  - **The two songs before it.** [[Ps. 46]] and [[Ps. 47]], the refuge and the King, which have been read together with this psalm.
  - **Jehoshaphat’s deliverance.** [[2 Chr. 20:1–30]], the story that has been proposed as the psalm’s occasion.
  - **Isaiah’s Zion.** [[Isa. 33:17–22]], where points of coincidence with this psalm have been noted. Isaiah asks “where is he that counted the towers?” ([[Isa. 33:18]]) with the verb and the noun of verse 12, and promises Jerusalem as “a tabernacle that shall not be taken down” ([[Isa. 33:20]]).
  - **The mountain in the north.** [[Isa. 14:13]], the boast that uses the phrase of verse 2.
  - **Zion in latter-day revelation.** The Bible Dictionary’s entry “Zion” gathers the uses of the name; begin with [[Moses 7:18–19]] and [[D&C 45:66–67]].

parallels:
  - ref: Matt. 5:35
    note: Jesus calls Jerusalem “the city of the great King.”
  - ref: Lam. 2:15
    note: After the city’s fall, passers-by mock it with the words of verse 2, “The joy of the whole earth.”
  - ref: Isa. 14:13
    note: The king of Babylon’s boast has the same Hebrew phrase, “the sides of the north.”
  - ref: 2 Chr. 20:19
    note: Korahite Levites stand up to praise before Jehoshaphat’s deliverance.
  - ref: Ps. 97:8
    note: Zion is glad and the daughters of Judah rejoice “because of thy judgments,” nearly the line of verse 11.
  - ref: Heb. 12:22
    note: Believers are come “unto mount Sion, and unto the city of the living God, the heavenly Jerusalem.”

sources: [lds-scriptures, bd-jerusalem, bd-tarshish, bd-zion, hopkin-psalms-sung, delitzsch-psalms, bdb, oshb-wlc, lxx-rahlfs, nrsvue, niv]
