chapter: 139
title: Search Me, O God
tagline: A man who knows that God has searched him through, who can think of no place where God is not, and who was seen before he was born, ends by asking to be searched.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  The title ascribes the psalm to David and names no occasion (“To the chief Musician” is explained with the title of [[Ps. 8]]). The psalm gives none either. There is no sickness in it, no battle, and no enemy until verse 19. One older commentary finds in its vocabulary “marks of the influence which the Aramaic language of the Babylonian kingdom exerted over the exiles,” and on that ground sets it later than David; that is a judgment from the language, and the title is what the psalm itself offers.

  It is a prayer from the first word to the last. Every verse is spoken to God except the half line in verse 19 that tells the “bloody men” to leave. It falls into four parts of six verses each: what God knows of him (1–6), where God is (7–12), how God made him (13–18), and then the wicked (19–22) and his own heart (23–24).

  Other scripture stands close to it. In Jeremiah the LORD puts the question of verse 7 from His own side ([[Jer. 23:24]]), and Amos names the heaven and hell of verse 8 together ([[Amos 9:2]]). Verses 7–12 are read with the revelation on light in [[D&C 88]] as the scriptures on God’s presence everywhere. Its four verses of hatred are the reason it is counted among the cursing psalms, which are treated together at [[Ps. 137:8]].

thread: |
  Psalm 139 is **a man’s account of being wholly known, which becomes a request to be known**. Its first verse states a fact: “thou hast searched me, and known me.” Its last two verses ask for the same thing: “Search me, O God, and know my heart.” Everything between explains how he gets from one to the other.

  The first part counts what God knows: when he sits and rises, his thoughts, his road, the word not yet spoken. It is not all comfortable. He is “beset” behind and before, and the next part opens by asking where he could “flee.” He tries the places in thought (heaven, the grave, the far side of the sea, the dark), and in each of them he finds God. At the farthest of them he finds a hand that leads him.

  The third part gives the reason, and it begins with “For.” God knows him because God made him. He was seen in the womb, before he had a shape, and his days were written before he had lived one. Here the tone settles: “How precious also are thy thoughts unto me, O God!”

  Then the psalm turns without warning to the wicked. He asks God to slay them and declares his hatred of them complete. This is the hardest turn in the psalm, and the psalm does not explain it. What it does is go straight on to the closing prayer. The man who has just said whose side he is on asks God to look for “any wicked way” in him, and to lead him.

sections:
  - range: 1-6
    heading: Thou hast searched me, and known me
    plain: |
      LORD, You have searched me and You know me. You know when I sit down and when I get up; You understand my thoughts from far away. You search out my path and my lying down, and You are familiar with all my ways. Before a word is on my tongue, LORD, You know all of it. You have hemmed me in behind and before, and laid Your hand on me. Knowledge like this is too wonderful for me. It is high, and I cannot reach it.
  - range: 7-12
    heading: Whither shall I flee from thy presence?
    plain: |
      Where could I go from Your spirit? Where could I flee from Your presence? If I go up to heaven, You are there. If I make my bed in Sheol, You are there. If I take the wings of the morning and live at the farthest edge of the sea, even there Your hand will lead me and Your right hand will hold me. If I say, “Surely the darkness will cover me,” even the night will be light around me. Darkness hides nothing from You. The night shines like the day; darkness and light are alike to You.
  - range: 13-18
    heading: Fearfully and wonderfully made
    plain: |
      For You created my inward parts; You knit me together in my mother’s womb. I will praise You, for I am fearfully and wonderfully made. Your works are marvellous, and my soul knows it well. My frame was not hidden from You when I was made in secret, woven with skill in the depths of the earth. Your eyes saw me before I was formed, and in Your book the days shaped for me were all written before one of them had come. How precious Your thoughts are to me, O God! How great is the sum of them! If I counted them, they would outnumber the sand. When I awake, I am still with You.
  - range: 19-22
    heading: I hate them with perfect hatred
    plain: |
      Surely You will slay the wicked, O God. Depart from me, you men of blood. They speak against You wickedly, and Your enemies take Your name in vain. Do I not hate those who hate You, LORD? Am I not grieved by those who rise up against You? I hate them with a complete hatred. I count them my enemies.
  - range: 23-24
    heading: Search me, O God
    plain: |
      Search me, O God, and know my heart. Test me, and know my thoughts. See whether there is any hurtful way in me, and lead me in the way everlasting.

notes:
  - ref: 5
    phrase: Thou hast beset me behind and before
    kind: words
    title: Beset means hemmed in
    body: |
      “Beset” means surrounded on every side, and the word has an edge the psalm does not remove at once. In older English to beset is “To surround; to inclose; to hem in; to besiege.” A modern translation has “You hem me in, behind and before.”

      Whether that is welcome, the verses around it answer two ways. A hand is laid on him, and verse 6 calls the knowledge “too wonderful for me.” The same hand comes back in verse 10, where it leads and holds. But verse 7 asks where he might “flee.” In the psalm’s last two verses he asks for the searching himself (see the note on verse 23).
    sources: [webster-1828, nrsvue]

  - ref: 7
    phrase: Whither shall I go from thy spirit
    kind: scripture
    title: Present everywhere through His Spirit
    body: |
      The psalm says how God is everywhere, and it is by His “spirit” and His “hand.” The question sets “thy spirit” beside “thy presence,” and the answer in verse 10 is “thy hand” and “thy right hand.” These verses are the Old Testament passage given for what God’s omnipresence is: His “ability to be present everywhere through His spirit.”

      Latter-day revelation, cited beside the psalm for the same teaching, describes that presence as light. It “proceedeth forth from the presence of God to fill the immensity of space” ([[D&C 88:12]]), and it is “the power of God who sitteth upon his throne, who is in the bosom of eternity, who is in the midst of all things” ([[D&C 88:13]]). In that sentence God sits on His throne and is in the midst of all things at once. The same revelation says of Him that “all things are before him, and all things are round about him” ([[D&C 88:41]]).

      The question is not a plan of escape. Each place is tried only in thought (“If I ascend,” “If I take,” “If I say”), and what he finds at the farthest of them is guidance: “Even there shall thy hand lead me.” In Jeremiah the LORD asks the same question from His own side: “Do not I fill heaven and earth?” ([[Jer. 23:24]]). There it answers anyone who would hide “in secret places.”
    sources: [gs-omnipresent, lds-scriptures]

  - ref: 8
    phrase: if I make my bed in hell, behold, thou art there
    kind: scripture
    title: God is in Sheol too
    body: |
      “Hell” here is Sheol, and the verse says that God is present there. A modern translation keeps the Hebrew name: “if I make my bed in Sheol, you are there.” What Sheol is, the note on [[Ps. 6:5]] explains.

      That psalm is the one to set beside this verse. There the psalmist tells the LORD that “in death there is no remembrance of thee” ([[Ps. 6:5]]). This psalm does not say that the dead praise God. It says something from the other direction: God is not absent from the place where they lie.

      Amos names the same two places, and in his mouth they are a threat to people running from judgment: “Though they dig into hell, thence shall mine hand take them; though they climb up to heaven, thence will I bring them down” ([[Amos 9:2]]). The hand is in both passages. In Amos it takes. In verse 10 of this psalm it leads and holds.
    sources: [nrsvue, lds-scriptures]

  - ref: 15
    phrase: curiously wrought in the lowest parts of the earth
    kind: symbol
    title: Woven in the depths
    body: |
      The verse pictures the unborn child as fine needlework made where no one could watch. “Curiously” does not mean strangely. In older English it means “With nice care and art; exactly; neatly; elegantly.” The Hebrew verb belongs to the weaver and the embroiderer, “to be worked in different colours, or also embroidered,” and in this verse it means “I was skilfully wrought.” Verse 13 has the same picture. A modern translation gives “covered me” there as “you knit me together in my mother’s womb.”

      “The lowest parts of the earth” is the puzzle, since verse 13 has just said he was made in the womb. The phrase is taken as a figure “of the dark and hidden interior of the womb.” One older reading hears more in it: a look back to the first man, formed “out of the dust of the earth,” so that the making of Adam is “repeated in the formation of every man.”

      On either reading the weight falls on the verse’s first clause: “My substance was not hid from thee.” Verses 11–12 said the dark hides nothing from God. This verse says the same of the most hidden place the psalmist can name.
    sources: [webster-1828, delitzsch-psalms, bdb, nrsvue]

  - ref: 16
    phrase: in thy book all my members were written
    kind: scripture
    title: What was written in the book
    body: |
      What stands written in God’s book may be the psalmist’s days and not the parts of his body; the line is hard and its translation uncertain. The King James takes the things written to be “my members.” A modern translation reads that in the book were written “all the days that were formed for me,” and it marks the verse “Meaning of Heb uncertain.” One older reading agrees about the days: they, “which were already formed, are the subject.” The phrase “my substance, yet being unperfect” is a single Hebrew word for the embryo, “mine imperfect substance.”

      Read this way the verse takes the psalm’s claim one step further back. God saw him before he had a shape, and his days were written “when as yet there was none of them.”

      That older reading sets the verse beside the LORD’s word to Jeremiah: “Before I formed thee in the belly I knew thee” ([[Jer. 1:5]]). What Latter-day Saints draw from that verse is in the note on [[Jer. 1:5]]. The psalm speaks of what God saw and what He wrote, and it stops there. Its own response comes in the next verse, and it is wonder: “How precious also are thy thoughts unto me, O God!”
    sources: [nrsvue, delitzsch-psalms, bdb]

  - ref: 22
    phrase: I hate them with perfect hatred
    kind: scripture
    title: Whose enemies they are
    body: |
      The men he hates are God’s enemies before they are his, and he leaves the slaying to God. Verse 19 looks to God to slay the wicked; to the men themselves he says only “depart from me.” The charges are all on God’s account: they “speak against thee wickedly,” they “hate thee,” they “rise up against thee.” Only then does he say, “I count them mine enemies.”

      “Perfect” means complete. The Hebrew is “with completeness of hatred I hate them.” How the phrase is read beside the Savior’s higher law is in the note on [[Ps. 137:8]], which treats the cursing psalms together and gives His words.

      What belongs to this psalm is the next verse. Having called his hatred complete, he asks at once to have his own heart searched for “any wicked way.” The psalm does not say what the search found.
    sources: [bdb]

  - ref: 23
    phrase: Search me, O God, and know my heart
    kind: structure
    title: The first line becomes the last prayer
    body: |
      The psalm ends by asking for what its first verse said had already been done. “Thou hast searched me, and known me” is a statement. “Search me, O God, and know my heart” takes up both of its verbs as requests, and “know my thoughts” reaches back to verse 2, “thou understandest my thought afar off.”

      What God is to look for is “any wicked way,” in the Hebrew a “hurtful way,” said “of any wicked habit.” He does not claim there is none. The last request is to be led: “lead me in the way everlasting.” In verse 10 the leading was something he found wherever he went. Here he asks for it.
    sources: [bdb, nrsvue]

christ: |
  The LORD to whom the psalm is spoken is Jehovah (see the note on [[Ps. 110:1]]), the God who in verses 1–6 knows a man through. In latter-day revelation Jesus Christ says of Himself that He is “the Lord your God, even Jesus Christ,” and “The same which knoweth all things, for all things are present before mine eyes” ([[D&C 38:2]]).

  The revelation cited beside verses 7–12 for God’s presence everywhere names the light that fills all space: “This is the light of Christ” ([[D&C 88:7]]). The verse before it says how He came to be in all things. He “descended below all things, in that he comprehended all things, that he might be in all and through all things, the light of truth” ([[D&C 88:6]]).

explore: |
  - **Light in all things.** [[D&C 88:6–13]] and [[D&C 88:41]], the revelation read beside verses 7–12 for God’s presence everywhere.
  - **The same question from God’s side.** [[Jer. 23:23–24]], and the flight to heaven and hell in [[Amos 9:2–4]].
  - **Known before birth.** [[Jer. 1:5]] and its note.
  - **Sheol in another psalm.** [[Ps. 6:5]], where death has no remembrance of God, beside verse 8 here.
  - **The cursing psalms.** The note on [[Ps. 137:8]], with [[Matt. 5:43–44]].

parallels:
  - ref: Jer. 23:24
    note: The LORD asks whether anyone can hide from Him, and whether He does not fill heaven and earth.
  - ref: Amos 9:2
    note: Hell and heaven named together as places that cannot hide a man from the LORD’s hand.
  - ref: D&C 88:12–13
    note: The light that proceeds from God’s presence to fill the immensity of space.
  - ref: Jer. 1:5
    note: The LORD knew Jeremiah before he was formed; verse 16 says God saw the psalmist before he had a shape.
  - ref: Ps. 6:5
    note: The grave as a place with no remembrance of God, beside verse 8.

