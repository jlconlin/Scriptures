chapter: 73
title: Until I Went into the Sanctuary
tagline: A man who nearly lost his footing over the ease of the wicked tells how he kept silent, went into the sanctuary, and came out wanting nothing but God.
when: 'By its title, a psalm of Asaph; no occasion is given'

setting: |
  Psalm 73 opens Book Three of the Psalms and the run of eleven psalms that carry Asaph’s name (73–83). Asaph and his guild of temple singers are introduced at [[Ps. 50:1]]. The title gives no occasion, and nothing in the psalm fixes a date.

  The speaker is one man telling what happened to him. He is not surrounded by enemies or sick; his trouble is what he has seen. The wicked are well, and he, who has kept his heart clean, is “plagued” every morning. His question is asked elsewhere in scripture in nearly the same words. Jeremiah puts it to the Lord: “Wherefore doth the way of the wicked prosper?” ([[Jer. 12:1]]). Job asks, “Wherefore do the wicked live, become old, yea, are mighty in power?” ([[Job 21:7]]).

  What sets this psalm apart is that it tells the story from the inside: how near the speaker came to giving up, what held him back, and where the answer came. The answer does not come by argument. It comes in a place.

thread: |
  Psalm 73 is a **confession told backward**. Its first verse is the conclusion: “Truly God is good to Israel.” Everything after it tells how the speaker almost stopped believing that sentence and how he came to say it again.

  One small Hebrew word marks the three stages. It opens verse 1 (“Truly”), verse 13 (“Verily”) and verse 18 (“Surely”). The first is the creed. The second is the counter-creed he reached by looking at the wicked: “Verily I have cleansed my heart in vain.” The third is what he saw in the sanctuary: “Surely thou didst set them in slippery places.”

  The turn is verse 17, and it is a turn of place before it is a turn of thought: he went into the sanctuary, and “then understood I their end.”

  A second marker runs beside the first: “and I,” four times in the Hebrew (verses 2, 22, 23 and 28). “But as for me,” my feet were almost gone. “And I” was a beast before thee. “And I,” nevertheless, am continually with thee. “And I”: it is good for me to draw near to God. The word “good” of verse 1 comes back in verse 28: the good that God gives the pure in heart turns out to be Himself.

sections:
  - range: 1-3
    heading: Truly God is good; but as for me
    plain: |
      Truly God is good to Israel, to those whose hearts are clean. But as for me, my feet had almost given way; my steps had nearly slipped. For I envied the boasters when I saw how well the wicked fared.
  - range: 4-12
    heading: What he saw
    plain: |
      They have no pangs in their death, and their bodies are strong. They are not in trouble as other people are, nor struck as other people are. So pride is the necklace they wear and violence the garment that covers them. Their eyes bulge from fatness; they have more than a heart could wish. They mock and talk wickedly of oppression; they talk from on high. They set their mouth against the heavens, and their tongue walks through the earth. So his people turn this way, and waters in full measure are drained out for them. And they say, “How does God know? Is there knowledge in the Most High?” Look: these are the wicked, always at ease, and their wealth grows.
  - range: 13-17
    heading: In vain? Until the sanctuary
    plain: |
      Truly I have kept my heart clean for nothing, and washed my hands in innocence for nothing. All day long I have been struck, and chastened every morning. If I had said, “I will talk like this,” I would have betrayed the generation of Your children. When I tried to think it through, it was wearisome to me, until I went into the sanctuary of God. Then I understood their end.
  - range: 18-22
    heading: Their end, and his own folly
    plain: |
      Truly You set them in slippery places; You cast them down to ruin. How suddenly they become a desolation, swept away, finished by terrors! Like a dream when one wakes, so, Lord, when You rouse Yourself You will despise their image. When my heart was soured and I was pierced within, I was stupid and knew nothing; I was a beast before You.
  - range: 23-28
    heading: Nevertheless I am continually with thee
    plain: |
      Yet I am always with You; You have taken hold of my right hand. You will guide me with Your counsel, and afterward receive me to glory. Whom have I in heaven but You? And beside You I desire nothing on earth. My flesh and my heart give out, but God is the rock of my heart and my portion for ever. Those who are far from You will perish; You destroy all who are unfaithful to You. But as for me, to be near God is my good. I have made the Lord GOD my refuge, so that I may tell of all Your works.

notes:
  - ref: 1
    phrase: Truly God is good to Israel
    kind: structure
    title: One small word, three times
    body: |
      The Hebrew word *ak* opens verses 1, 13 and 18, and the three sentences it introduces are the psalm in outline. The King James varies the English: “Truly,” “Verily,” “Surely.” The word is the one that runs through Psalm 62 (see the note on [[Ps. 62:1]]). It can affirm (“surely”) or restrict (“only”), and here, as in several psalms, “the affirmative and restrictive senses agree equally with the context”: God is surely good to Israel, or nothing but good.

      The affirming sense fits this psalm closely: the word often introduces “with emphasis the expression of a truth (or supposed truth) newly perceived.” Verse 13 is the supposed truth, the conclusion the speaker drew from watching the wicked. Verse 18 is the truth newly perceived, in the sanctuary. Verse 1 is the truth he started with, said again by a man who has now tested it.

      “Heart” ties the three together as well. The Hebrew word comes six times (verses 1, 7, 13, 21 and twice in 26): the clean heart God is good to, the heart of the wicked that has all it could wish, the heart he thought he had cleansed for nothing, the heart that soured, and the heart that fails and finds its rock in God.
    sources: [oshb-wlc, bdb]

  - ref: 3
    phrase: when I saw the prosperity of the wicked
    kind: words
    title: The peace the wicked are not supposed to have
    body: |
      “Prosperity” is *shalom*, the ordinary Hebrew word for peace, and that is what makes the sight hard to bear. Among its senses are “welfare, health, prosperity”; the Greek translators chose “tranquility.” The description that follows is of health and ease more than of money: sound bodies, no trouble, more than the heart could wish. Riches are named only at the end (verse 12).

      Isaiah says twice that this is exactly what the wicked lack: “There is no peace, saith the LORD, unto the wicked” ([[Isa. 48:22]]; see [[Isa. 57:21]]). The speaker has looked at the wicked and seen their *shalom*, and the sight nearly cost him his footing (verse 2).

      He also names the fault as his own before he describes theirs: “I was envious.” The psalm is a confession from its third verse on.
    sources: [oshb-wlc, bdb, lxx-rahlfs, lds-scriptures]

  - ref: 4
    phrase: there are no bands in their death
    kind: words
    title: No pangs, even in dying
    body: |
      “Bands” are pangs: the wicked, as the King James has it, die without a struggle. The Hebrew noun means “bond, fetter, pang,” and it is cited in only two places. In the other it is literal, and the King James uses the same English word: the true fast is “to loose the bands of wickedness” ([[Isa. 58:6]]). Here it is the figurative sense, pains that grip, and the Greek gives the same picture from the other side: “there is no sign of reluctance in their death.”

      “In their death” comes early for a description of men who are very much alive. It has been proposed to divide the Hebrew letters differently, which removes death from the line, and a modern translation follows that division: “For they have no pain;” “their bodies are sound and sleek.” That is a correction of the text as it stands, and a small one: the same consonants, divided into two words.

      Either way the complaint is the same. Their life is easy, and on the King James reading even their dying is. Verse 19 will say otherwise.
    sources: [bdb, oshb-wlc, lxx-rahlfs, nrsvue]

  - ref: 10
    phrase: Therefore his people return hither
    kind: words
    title: A verse the versions read differently
    body: |
      Verse 10 is obscure in Hebrew, and the ancient and modern versions disagree about what it says. The Hebrew scribes themselves marked the first verb. The written text (the *ketiv*) has a causative form of the verb “return,” and the reading tradition (the *qere*) has the simple form, which the King James follows.

      A modern translation prints a correction, “Therefore the people turn and praise them,” they “find no fault in them,” with the Hebrew in the margin: “his people return here” and “abundant waters are drained by them.” The Greek translators read “my people” and took the water as time: “full days shall be found with them.”

      One older reading keeps the Hebrew. “His people” are the following that the proud man gathers: the wicked “gain adherents … from those who leave the fear of God and turn to them.” The full waters are then “an emblem of their corrupt principles,” which the crowd drinks in.

      On that reading the speakers of verse 11 are these followers, “deluded by the good fortune and free-thinking of the ungodly,” and it is they who ask, “How doth God know?”
    sources: [oshb-wlc, nrsvue, lxx-rahlfs, delitzsch-psalms]

  - ref: 15
    phrase: I should offend against the generation of thy children
    kind: scripture
    title: What kept him from saying it
    body: |
      The speaker reached the conclusion that serving God is useless and did not say it, because saying it would have betrayed the people of God. Verse 13 is that conclusion: “Verily I have cleansed my heart in vain.” In Malachi’s day the people do say it: “It is vain to serve God: and what profit is it that we have kept his ordinance” (see the note on [[Mal. 3:14]]). They go on, “now we call the proud happy” ([[Mal. 3:15]]).

      Here the thought stops at the lips. “Offend against” is stronger in other versions: “I would have been untrue to the circle of your children,” and in the Greek, “I should have broken covenant with the generation of thy children.” He has no answer yet. Verse 16 says that trying to think it through was only a weariness, and the Hebrew word there is the one verse 5 used for the “trouble” the wicked never have. What he has, before he has an answer, is the refusal to be untrue to them.

      This is the first time in the psalm that he speaks to God (“thy children”). Up to this verse he has talked about God and about the wicked.
    sources: [lds-scriptures, nrsvue, lxx-rahlfs, oshb-wlc]

  - ref: 17
    phrase: Until I went into the sanctuary of God
    kind: history
    title: The turn happens in a place
    body: |
      The psalm turns when the speaker enters the temple, and it does not say what happened to him there. The Hebrew is plural, sanctuaries, a plural used “of many sacred places in and about the temple.” Some interpreters once took the word as a figure for God’s secrets, but “this meaning is without support in the usage of the language.” He means the building and its courts.

      What he found there is told in one clause: “then understood I their end.” “End” is their “final lot,” where their road comes out. On one older reading he went in to pray, “here he prayed for light in the darkness of his conflict,” and the sight of their end was given him there. The psalm itself reports no vision and no oracle. It reports that the question he could not think his way through (verse 16) looked different from inside God’s house.

      When does the end come? Verses 18–20 say it is sudden, “as in a moment,” and do not say when. The heading in the Church’s edition places it beyond this life: the wicked are consumed with terrors “hereafter.”

      On going up to the house of the Lord, and the temple in the Psalms generally, see the note on [[Ps. 24:3]].
    sources: [oshb-wlc, bdb, delitzsch-psalms, lds-scriptures]

  - ref: 20
    phrase: thou shalt despise their image
    kind: symbol
    title: A dream at waking
    body: |
      The prosperity that filled verses 4–12 is now a dream, and the wicked themselves are the figures in it. “Image” here is used in the sense of a “mere, empty, image, semblance”; a modern translation has “phantoms.” A dream is vivid while it lasts and nothing when the sleeper wakes.

      The sleeper who wakes is the Lord. Another psalm of Asaph uses the same figure, as a comparison, for the moment God acts: “Then the Lord awaked as one out of sleep” ([[Ps. 78:65]]). When He rouses Himself, He looks at the wicked the way a man looks at last night’s dream.

      The Greek translators took the Hebrew for “when thou awakest” as a word with the same consonants and read “in thy city thou wilt despise their image.”
    sources: [bdb, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 23
    phrase: thou hast holden me by my right hand
    kind: symbol
    title: Held by the right hand
    body: |
      The man who said his feet were almost gone (verse 2) now says that God has held him by the right hand. The verse is tied to the one before it by one Hebrew word: “I was as a beast before thee” and “I am continually with thee” end on the same “with thee.”

      Most interpreters have taken the grasped hand with the next verse’s “guide” and pictured God leading him as one leads a child: the pairing “has led most interpreters to assume that the gesture is one of leading by the hand.”

      Several scholars have proposed something more formal. Passages like this one are set beside “a divine embrace or divine handclasp, which shows up frequently in ancient art, writings, and rituals,” and it has been proposed “that this divine handclasp may have been an ancient temple ritual in which a temple priest stood as a proxy for the Lord.” The proposal reads this verse with [[Ps. 139:10]], where God’s right hand holds the psalmist. If “both God and the Psalmist use their right hands,” that would suggest that “the participants in the gesture are facing each other.” On that view “guide” may mean instruct, and the clasp is “a means of imparting knowledge.”

      One form of the proposal takes the psalm as one “that could be attributed to the king of Israel” and suggests that at his installation the king “passed through the veil of the Holy of Holies,” adding, “Perhaps a proxy and a handclasp played a role in such a situation.” That is a reconstruction, offered as a possibility. The psalm names the sanctuary and the grasped hand and describes no rite. See also the note on [[Ps. 63:4]].
    sources: [oshb-wlc, sc-knowhy-642, calabro-divine-handclasp, brown-handclasp]

  - ref: 24
    phrase: and afterward receive me to glory
    kind: words
    title: 'Afterward: how far does he see?'
    body: |
      “Receive” is the verb used when God took Enoch, and this verse is one of the places where a psalmist’s hope reaches past death; how far it reaches is read differently. The verb and its link to Enoch are explained in the other psalm about the prosperity of the wicked, where the singer says “he shall receive me” ([[Ps. 49:15]]). Here the verb is used “as in Psalm 49:16, and of Enoch, Genesis 5:24” (49:15 in the King James numbering).

      The second half of the line can be construed in two ways. The King James has “to glory,” the place he is taken to. A modern translation has “afterward you will receive me with honor” and gives “to glory” in the margin. The Greek translators made the whole verse past: “thou hast taken me to thyself with glory.”

      The psalm does not say what “afterward” follows. On one older reading it is after the dark road he is now walking: “The future is dark to him, but lighted up by the one hope that the end of his earthly existence will be a glorious solution of the riddle.” That reading grants that the psalmist had been told little, and still finds here a “faith which breaks through not only the darkness of this present life, but also the night of Hades.”

      The heading in the Church’s edition reads the verse of the life to come: those who trust in the Lord “will be received up unto glory.” The psalm sets two ends side by side. “Their end” (verse 17) is ruin in a moment. His is to be taken. On Sheol, and on what the Restoration adds about the world of spirits, see the note on [[Ps. 6:5]].
    sources: [oshb-wlc, delitzsch-psalms, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 26
    phrase: and my portion for ever
    kind: symbol
    title: A Levite’s portion
    body: |
      “Portion” is the word for a tribe’s share of the land, and for a Levite it had a meaning the other tribes’ did not. When Canaan was divided there was “none for tribe of Levi.” The Lord told Aaron why: “I am thy part and thine inheritance among the children of Israel” ([[Num. 18:20]]). “Part” there is the Hebrew word translated “portion” here. For the priests it meant in practice a living from the altar; this verse is listed among those that take it “in spiritual sense,” with [[Lam. 3:24]]. [[Ps. 16:5]] uses the word the same way (see the note there on the vocabulary of land).

      The psalm bears the name of a Levite. Read as its title asks, it began with a man of that tribe looking at men who “increase in riches” while he had nothing to show for a clean heart. He ends by saying what he does have, in the terms of his own tribe’s charter. The wicked have wealth. He has God, “for ever.”

      In the first half of the verse “strength” is the Hebrew word “rock”: his flesh and heart give out, and God is the rock of his heart.

      [My Portion for Ever](/psalms/themes/my-portion-for-ever/) follows the question of this psalm from Psalm 1 through Psalm 37 to this verse.
    sources: [bdb, lds-scriptures, bd-asaph, nrsvue, oshb-wlc]

  - ref: 28
    phrase: But it is good for me to draw near to God
    kind: structure
    title: '“Good” at both ends'
    body: |
      The last verse takes up the first verse’s word “good” and says what the good is. Verse 1: “God is good to Israel.” Verse 28: “it is good for me to draw near to God.” The Hebrew word is the same. The psalm does not end by reporting that the speaker’s fortunes changed. The good it names at the end is nearness to God.

      “To draw near to God” is in Hebrew a noun phrase, “approach to God,” or as a modern translation has it, “for me it is good to be near God.” It stands against the verse before: “they that are far from thee shall perish.” The psalm’s last pair is no longer the prosperous and the plagued. It is the far and the near.

      His closing purpose is “that I may declare all thy works.” The verb is the one he used in verse 15 for what he refused to do: “If I say, I will speak thus.” The Greek adds where: “in the gates of the daughter of Sion.”
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs]

christ: |
  The Lord of this psalm is known by what He does for a man who nearly fell. He holds him by the right hand, guides him with counsel, and will afterward receive him.

  The psalm’s first line says that God is good to “such as are of a clean heart,” and that line has been set beside the Savior’s beatitude, which gives the same people a promise: “Blessed are the pure in heart: for they shall see God” ([[Matt. 5:8]]). Its last line has been set beside James: “Draw nigh to God, and he will draw nigh to you” ([[James 4:8]]).

explore: |
  - **The same question elsewhere.** [[Jer. 12:1–4]] and [[Job 21:7–15]] ask it; [[Ps. 37]] and [[Ps. 49]] answer it in their own ways.
  - **Those who said it aloud.** [[Mal. 3:13–18]], where the Lord answers the people who say “It is vain to serve God” with a book of remembrance.
  - **The other “receive me.”** [[Ps. 49:15]], with the note there on Enoch.
  - **The LORD as a portion.** [[Ps. 16:5]], [[Lam. 3:24]], and the Levites’ charter in [[Num. 18:20–24]].
  - **The grasped hand.** [[Ps. 63:8]], [[Ps. 139:10]] and [[Isa. 41:13]]; Scripture Central’s KnoWhy #642, “Why Does the Psalmist Speak about Grasping God’s Hand?”, gathers the Latter-day Saint studies.

parallels:
  - ref: Jer. 12:1
    note: Jeremiah asks the Lord why the way of the wicked prospers.
  - ref: Job 21:7
    note: Job asks why the wicked live, grow old, and are mighty in power.
  - ref: Mal. 3:14–15
    note: The people say aloud what verse 13 only thinks, that it is vain to serve God, and call the proud happy.
  - ref: Ps. 49:15
    note: The other psalm on the prosperity of the wicked, with the same verb, “he shall receive me.”
  - ref: Num. 18:20
    note: The Lord is the “part” and inheritance of Aaron’s house, the word behind “my portion” in verse 26.

