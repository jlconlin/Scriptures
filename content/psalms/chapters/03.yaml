chapter: 3
title: Salvation Belongeth unto the LORD
tagline: A king driven from his city counts the many who have risen against him, hears them say that God will not save him, lies down and sleeps anyway, and wakes to ask the Lord to arise.
when: 'By its title, David’s, when he fled from Absalom his son (2 Samuel 15–18)'

setting: |
  This is the first psalm in the book with a title: “A Psalm of David, when he fled from Absalom his son.” Many psalms have one. Titles mainly say how a psalm was to be sung; this one names an author and an occasion. In the Hebrew the title is part of the text, counted here as verse 1, so that the Hebrew verse numbers of this psalm run one ahead of the King James. How old the titles are is an open question: they may have been added after the poems were written, and some are judged inaccurate. This one may not record the psalm’s first setting, but the psalm’s language of military conflict fits the occasion it names.

  The story is in 2 Samuel 15–18. Absalom “stole the hearts of the men of Israel” ([[2 Sam. 15:6]]), and David fled Jerusalem, crossing the brook Kidron and climbing the Mount of Olives in tears. Ahithophel, David’s counsellor, joined the conspiracy. David crossed the Jordan to Mahanaim; in the battle that followed Joab killed Absalom, and David wept for his son. The psalm’s leading features have been matched to that story: the mockery of a man thought to be rejected by God ([[2 Sam. 16:7–8]]), the danger by night ([[2 Sam. 17:1]]), and the multitudes with Absalom ([[2 Sam. 15:13]]; [[2 Sam. 17:11]]).

  The psalm opens in lament.

thread: |
  The psalm moves from what many say to what the Lord is. It opens with a count: the enemies have increased, many rise up, many say there is no help for him in God. Nothing in the situation changes after that. What changes is where David looks: “But thou, O LORD” (verse 3). He says what the Lord is to him, says that his cry was heard, and gives the plainest evidence he has, that he lay down, slept, and woke.

  The psalm goes from complaint to trust in the Lord’s power to protect and to answer, and then to a confidence strong enough to ask again, a pattern common in the Psalms (the note on [[Ps. 22:1]] lays out the shape of a lament). When the request comes, in verse 7, it turns the enemies’ words around. They “rise up,” so “Arise, O LORD,” which is the same Hebrew verb. They say there is no help for him in God, so he prays “save me,” and the last verse answers the taunt in its own word (see the note on verse 2): “Salvation belongeth unto the LORD.” The psalm then ends on the people and not on the king.

sections:
  - range: 1-2
    heading: Many rise up against me
    plain: |
      LORD, how my enemies have multiplied! Many are rising against me. Many say of me, “There is no help for him in God.”
  - range: 3-4
    heading: But thou, O LORD
    plain: |
      But You, LORD, are a shield about me, my glory, and the one who lifts my head. I cried aloud to the LORD, and He heard me from His holy hill.
  - range: 5-6
    heading: I slept, and I woke
    plain: |
      I lay down and slept, and I woke, because the LORD held me up. I will not be afraid of ten thousands of people who have taken their places against me on every side.
  - range: 7-8
    heading: Arise, O LORD
    plain: |
      Arise, LORD! Save me, my God! You have struck all my enemies on the cheek; You have broken the teeth of the wicked. Salvation is the LORD’s. Your blessing is on Your people.

notes:
  - ref: 1
    phrase: many are they that rise up against me
    kind: words
    title: Many, many, ten thousands
    body: |
      The psalm’s opening lines are built on one Hebrew root for “many,” and verse 6 brings it back at full size. “Increased” in verse 1 is the verb *rabab*, to be or become many. “Many,” twice in two lines, is the adjective *rab*, formed from it. The “ten thousands” of verse 6 is *rebabah*, a multitude or myriad, from the same root again. In English the three look unrelated. In Hebrew David says that they have multiplied, that multitudes rise and multitudes talk, and then that he will not fear multitudes upon multitudes.

      The story the title names has the same word. As the conspiracy gathered, “the people increased continually with Absalom” ([[2 Sam. 15:12]]), and “increased” there is *rab*. The counsel given to Absalom was to gather all Israel “as the sand that is by the sea for multitude” ([[2 Sam. 17:11]]).
    sources: [oshb-wlc, bdb, strongs-concordance, lds-scriptures]
  - ref: 2
    phrase: There is no help for him in God
    kind: words
    title: The taunt uses the psalm’s last word
    body: |
      The word translated “help” is *yeshuah*, salvation, the same noun that closes the psalm in “Salvation belongeth unto the LORD,” so the last verse answers the taunt in its own word. The King James hides the link by using two English words. Between the two stands the plea of verse 7, “save me,” the verb the noun is formed from. The enemies say there is no salvation for him in God; David asks God to save him; and he ends by saying whose salvation is. In the Old Testament this noun is salvation by God, “primarily from external evils, but often with added spiritual idea.”
    sources: [oshb-wlc, bdb, strongs-concordance]
  - ref: 2
    phrase: Selah
    kind: words
    title: Selah
    body: |
      *Selah* is not part of the prayer. It is a musical term whose meaning is uncertain, and this is the first place it appears: 71 times in the Psalms in all, and three more in the psalm of Habakkuk 3. Scholars do not agree on how to translate the word, but nearly all take it as an instruction to the performers, and the largest group take it as a pause in the music. The other explanation is that the musicians were to strike up, more loudly or in an interlude while the singing stopped. The English version of the ancient Greek translation has “Pause” in its place.

      In this psalm it comes three times: after the enemies’ taunt (verse 2), after the answer from the holy hill (verse 4), and after the closing blessing (verse 8).
    sources: [bd-selah, hopkin-psalms-sung, lxx-rahlfs, oshb-wlc]
  - ref: 3
    phrase: the lifter up of mine head
    kind: history
    title: A covered head lifted
    body: |
      In the story the title names, David left Jerusalem with his head covered, and the psalm calls the Lord the one who lifts it. He “went up by the ascent of mount Olivet, and wept as he went up, and had his head covered, and he went barefoot” ([[2 Sam. 15:30]]), and all the people with him covered their heads and wept as well. One older reading sets the two side by side: with covered head he climbed the Mount of Olives, but the Lord is the lifter up of his head, in that He comforts and helps him. In the same reading “my glory” answers the loss of the kingdom. The king who has just told his servants, “Arise, and let us flee” ([[2 Sam. 15:14]]), calls the Lord his glory.

      “A shield for me” is in Hebrew a shield *about* me, and the New Revised Standard Version has “a shield around me.”
    sources: [lds-scriptures, delitzsch-psalms, bdb, nrsvue]
  - ref: 4
    phrase: out of his holy hill
    kind: history
    title: The hill David had left
    body: |
      The “holy hill” here means the temple, and by the title’s setting David has just left it behind. The psalm before has the same phrase and names the hill: the Lord sets His king “upon my holy hill of Zion” ([[Ps. 2:6]]). In David’s day the ark stood in Jerusalem in the tent he had pitched for it ([[2 Sam. 6:17]]), and he would not have it carried with him when he fled: “Carry back the ark of God into the city: if I shall find favour in the eyes of the LORD, he will bring me again, and shew me both it, and his habitation” ([[2 Sam. 15:25]]).

      So by the title the king is away from the city and the ark is on the hill. He cried, the psalm says, and the Lord heard him from there. What it means to go up to that hill is taken up at [[Ps. 24:3]].
    sources: [lds-scriptures, ot-minute-psalms-1-20]
  - ref: 5
    phrase: I laid me down and slept; I awaked
    kind: history
    title: Sleeping and waking
    body: |
      A night’s sleep is what trust in the Lord looks like in this psalm: because he trusts the Lord’s power to protect him, the speaker can let go of his fear, lie down, and sleep. He gives the reason for his waking in one verb: the Lord “sustained” him, a word for propping something up. Verse 6 follows from it. Having woken, he “will not be afraid.”

      This verse is why the psalm is often taken as a morning prayer: the speaker has woken after a night’s sleep. Psalm 4, which follows and has a number of parallels with it, is read beside it as the prayer for evening, and it ends at the other end of the day: “I will both lay me down in peace, and sleep: for thou, LORD, only makest me dwell in safety” ([[Ps. 4:8]]).
    sources: [lds-scriptures, ot-minute-psalms-1-20, strongs-concordance]
  - ref: 7
    phrase: Arise, O LORD
    kind: scripture
    title: The call Moses made
    body: |
      “Arise, O LORD” is in Hebrew the call Moses made when the ark set out in the wilderness. “When the ark set forward,” Moses said, “Rise up, LORD, and let thine enemies be scattered; and let them that hate thee flee before thee” ([[Num. 10:35]]). The Hebrew of the two calls is the same word, *qumah*, followed by the divine name. In Numbers it is a cry for a march, with the Lord going out before Israel against those who hated Him.

      Inside the psalm the verb answers verse 1, where the enemies are those who “rise up against me.” Many have risen, and David asks the Lord to rise.
    sources: [lds-scriptures, oshb-wlc]
  - ref: 7
    phrase: thou hast smitten all mine enemies upon the cheek bone; thou hast broken the teeth of the ungodly
    kind: symbol
    title: The cheek and the teeth
    body: |
      The blow on the cheek is an insult and the broken teeth a disarming, and David speaks of both as things the Lord has already done. To strike a man on the cheek was to shame him. Job says of those who mocked him, “they have smitten me upon the cheek reproachfully” ([[Job 16:10]]). The teeth belong to a second picture, in which the enemies are beasts that bite and breaking their teeth leaves them unable to hurt. One older reading finds both in the single stroke: contempt, and “rendering harmless.”

      The tense matters. Both Hebrew verbs are in a form that the King James gives as a past: “thou hast smitten.” Read so, the line is the ground of the plea. It appeals to what the Lord has done to David’s enemies before as the reason to ask again now. The New Revised Standard Version puts it in the present, as what the Lord does: “you strike all my enemies on the cheek.” The harder prayers of this kind in the Psalms are taken up at [[Ps. 137:8]].
    sources: [delitzsch-psalms, oshb-wlc, nrsvue, lds-scriptures]
  - ref: 8
    phrase: thy blessing is upon thy people
    kind: history
    title: A blessing on thy people
    body: |
      The psalm’s last line turns from the king to the people, and one reading takes them to be the people who had gone over to Absalom. “People” is the same Hebrew word as in verse 6, where “ten thousands of people” have set themselves against him, and the story uses it of the revolt: “the people increased continually with Absalom” ([[2 Sam. 15:12]]).

      The Hebrew of the line has no verb, only the words for upon thy people and thy blessing; the King James supplies “is.” It can be a statement or a prayer. Read as a prayer it is intercession: “Instead of cursing his faithless people he implores a blessing upon those who have been piteously led astray and deceived.” The New Revised Standard Version also takes it as a prayer: “may your blessing be on your people!”

      In either reading he calls them the Lord’s: “thy people.”
    sources: [oshb-wlc, lds-scriptures, delitzsch-psalms, nrsvue]

christ: |
  The psalm’s last word about salvation is that it “belongeth unto the LORD,” and the LORD of the Old Testament, Jehovah, is the premortal Jesus Christ. The enemies’ taunt was that there was no help, no *yeshuah*, for David in God. The name Jesus is the Greek form of the Hebrew name Jeshua, “God is help” or “Savior,” and the angel gave the reason for it: “thou shalt call his name JESUS: for he shall save his people from their sins” ([[Matt. 1:21]]). The same confession is made in John’s vision, where a multitude that no one could number cries, “Salvation to our God which sitteth upon the throne, and unto the Lamb” ([[Rev. 7:10]]).

  On one reading the closing blessing is for a people who had turned against their king, and it has been set beside the prayer from the cross, “Father, forgive them; for they know not what they do” ([[Luke 23:34]]).

explore: |
  - **The story behind the title.** Read [[2 Sam. 15:12–14]], [[2 Sam. 15:23–31]], [[2 Sam. 16:7–11]], [[2 Sam. 17:1–2]], [[2 Sam. 17:14]], and [[2 Sam. 18:33]] beside the psalm.
  - **Whose salvation is.** Read [[Ps. 3:8]], [[Jonah 2:9]], and [[Rev. 7:10]].

