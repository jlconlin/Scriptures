chapter: 30
title: Mourning into Dancing
tagline: A man brought back from the edge of the grave tells how he got there, what he prayed, and why he was lifted out, so that he would sing and not be silent.
when: 'Undated; a psalm of David by its title'

setting: |
  The title ascribes the psalm to David and ties it to a dedication; the note on the title takes up which house is meant. The psalm itself mentions no building. Its speaker cried to the LORD and was healed (verse 2), so the trouble behind it was most likely a grave illness or injury and not death itself (see the note on verse 3).

  It is a song of thanksgiving, the kind of psalm that gives thanks after a person or a people “have been delivered from a trial by God.” Such gratitude “typically would have been demonstrated with a sacrifice at the temple, and accompanied by the singing of a hymn or psalm.” In verse 4 the rescued man turns from God to a congregation and asks it to sing with him.

  Psalm 30 stands in the run of Psalms 25–31, a series marked by its attention to covenant and temple. Nephi’s psalm ([[2 Ne. 4:16–35]]) has been compared with these seven, with the suggestion that they “may have had a particular influence upon Nephi as he wrote his psalm.”

thread: |
  Psalm 30 tells its story out of order. It begins with the rescue (verses 1–3) and calls the congregation to sing (verses 4–5). Only then does it go back to how the trouble began (verses 6–7), what the speaker prayed in it (verses 8–10), and how the prayer was answered (verses 11–12). **The turn comes at verse 11, and verse 12 says what it was for: he was lifted up so that he would sing and not be silent.**

  The psalm is built of opposites that change places: anger and favour, a moment and a life, night and morning, weeping and joy, mourning and dancing, sackcloth and gladness. It also moves up and down. The LORD has “lifted me up” and “brought up my soul,” and what the speaker feared was to “go down to the pit” (verses 3 and 9).

  The middle tells how it began. When all was well he said, “I shall never be moved.” Then the LORD hid His face, and he was troubled. The prayer he prayed then is quoted, and it is an argument: “Shall the dust praise thee?”

  The last verse answers that question. The rescue came “to the end that my glory may sing praise to thee, and not be silent.”

sections:
  - range: 1-3
    heading: Drawn up from the pit
    plain: |
      I will exalt You, LORD, because You have drawn me up and have not let my enemies gloat over me. LORD my God, I cried to You, and You healed me. LORD, You brought my soul up from Sheol. You kept me alive, so that I did not go down to the pit.
  - range: 4-5
    heading: Sing with me
    plain: |
      Sing to the LORD, you His faithful ones, and give thanks to His holy name. His anger lasts a moment, and His favour a lifetime. Weeping may stay the night, but in the morning there is a shout of joy.
  - range: 6-7
    heading: What I said when all was well
    plain: |
      As for me, when I was at ease I said, “I will never be shaken.” LORD, it was by Your favour that my mountain stood strong. You hid Your face, and I was dismayed.
  - range: 8-10
    heading: What I prayed
    plain: |
      I called to You, LORD, and I pleaded with the LORD: “What is gained by my death, if I go down to the pit? Will the dust praise You? Will it tell of Your truth? Hear, LORD, and be merciful to me. LORD, be my helper.”
  - range: 11-12
    heading: Mourning into dancing
    plain: |
      You turned my mourning into dancing. You took off my sackcloth and wrapped me in gladness, so that my glory, my very soul, may sing Your praise and not be silent. LORD my God, I will give You thanks for ever.

notes:
  - ref: 0
    phrase: at the dedication of the house of David
    kind: history
    title: Which house was dedicated
    body: |
      The Hebrew of the title can be divided two ways. It reads a song at the dedication of the house, and then “of David,” the words that ascribe other psalms to him. The King James joins the two, as the ancient Greek translation did (“a Psalm and Song at the dedication of the house of David”). Several modern translations divide them and take the house to be the temple: “A Song at the dedication of the temple. Of David.” The word for dedication means “dedication, consecration” and is used of the dedication of Jerusalem’s wall and of the altar in the temple.

      Either way the title is a puzzle, because the psalm gives thanks for a healing and has nothing “that should point to a dedication of a sanctuary.” If the house is the temple and the psalm is David’s, the title “is anachronistic since the temple was dedicated under Solomon,” and the psalm may be an earlier one “later used as part of the second temple’s dedication.” The Talmud records its use at Hanukkah, the feast that kept the temple’s cleansing and rededication.

      One older reading takes the house to be David’s own, “the citadel on Zion, the building of which was just completed,” and supposes that David “had been delayed by some severe illness from taking possession of the new building.” That is an inference from the psalm, and the psalm does not settle the question.

      What a title is, and what it is worth as evidence, is discussed under the title of Psalm 3 ([[Ps. 3:1]]).
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, bdb, ot-minute-psalm-30, delitzsch-psalms]
  - ref: 1
    phrase: thou hast lifted me up
    kind: symbol
    title: Drawn up like water from a well
    body: |
      The verb behind “lifted me up” is the verb for drawing water, so the speaker is drawn up from a depth as water is from a well. It is the word to “draw (water)” (as in [[Ex. 2:19]]), used in this verse as a figure with the LORD as the one who draws: “thou hast drawn me up.” A modern translation keeps it: “for you have drawn me up.”

      Verse 3 names the depth. “The grave” is Sheol, the place of the dead (see [[Ps. 6:5]]). “The pit” beside it is the ordinary Hebrew word for a “pit, cistern, well,” which in poetry becomes the “pit of the grave.”
    sources: [oshb-wlc, bdb, nrsvue]
  - ref: 3
    phrase: thou hast kept me alive
    kind: words
    title: Brought back from the edge of death
    body: |
      Verse 3 most likely gives thanks for a rescue at the edge of death, not for a return from death itself. Whether the psalmist was “claiming to have been resurrected from the dead” has been debated, but verse 2 says “thou hast healed me,” which “may indicate that he was not brought back from actual death but from a serious, perhaps nearly fatal, illness or injury.”

      The second half of the verse has come down in two forms. The Hebrew text has one form written in the line and another marked to be read in its place. The form to be read gives the King James’s “that I should not go down to the pit.” The written form is probably a plural, those who go down, and a modern translation prints it, “restored me to life from among those gone down to the Pit,” with the other in its margin. The ancient Greek agrees with the written form: “thou hast delivered me from among them that go down to the pit.”

      The difference is small. In one reading he is kept from joining those who go down; in the other he is brought back from among them.
    sources: [ot-minute-psalm-30, oshb-wlc, delitzsch-psalms, nrsvue, lxx-rahlfs]
  - ref: 4
    phrase: give thanks at the remembrance of his holiness
    kind: words
    title: The name He is remembered by
    body: |
      “The remembrance of his holiness” can also be translated “his holy name,” and a modern translation has “give thanks to his holy name.” The Hebrew noun means “remembrance, memorial.” As a memorial it is that “by which one is remembered,” and it stands beside “name” when the LORD speaks to Moses at the bush: “this is my name for ever, and this is my memorial unto all generations” ([[Ex. 3:15]]).

      The other way to take the phrase is that the saints are to give thanks as they remember His holiness in what He has done. On that reading the verse belongs with [[Ps. 97:12]], which ends with the same line, as a remembrance of the LORD’s “character and works.”

      Those called are “saints of his.” The Hebrew is the plural of the word for the godly person explained at [[Ps. 4:3]]: “the pious, godly, those of the people who were faithful, devoted to God’s service.” A modern translation has “his faithful ones.”
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]
  - ref: 5
    phrase: weeping may endure for a night
    kind: words
    title: Weeping lodges for the night
    body: |
      The Hebrew of verse 5 is terser than the King James, and in its second half weeping is an overnight lodger. The first half has no verb at all: “a moment (passes) in his anger,” and set against it, life in His favour, which a modern translation takes as length of time: “his favor is for a lifetime.” In the second half the verb translated “endure” is to “lodge, pass the night.” The morning has no verb either, only a noun, and the noun is a “ringing cry.”

      Isaiah has the same word for the moment: “For a small moment have I forsaken thee; but with great mercies will I gather thee” ([[Isa. 54:7]]). The next verse there goes on: “In a little wrath I hid my face from thee for a moment; but with everlasting kindness will I have mercy on thee” ([[Isa. 54:8]]).

      The Joseph Smith Translation says why the anger is brief: “For his anger kindleth against the wicked; they repent, and in a moment it is turned away, and they are in his favor, and he giveth them life.” In that wording the anger is against the wicked, and it is turned away in a moment when they repent.
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]
  - ref: 5
    phrase: joy cometh in the morning
    kind: prophets
    title: The morning as resurrection and as forgiveness
    body: |
      Latter-day leaders have taken the morning of this verse in two directions, toward the resurrection and toward repentance.

      Elder Thomas S. Monson told of a small girl who led him to the casket of her mother and would not have him cry. Those who know “that life continues beyond the grave,” he said, can declare the psalmist’s words to the world; and he testified that the Son of God “is the firstfruits of the resurrection” and that the gospel “makes of every hopeless dawn a joyful morning.”

      Elder Craig C. Christensen of the Seventy quoted the verse of repentance: “The nights may seem long, but the morning does come,” and the joy of it is felt “as the Savior’s Atonement frees us from sin and suffering.”
    sources: [monson-hopeless-dawn, christensen-exquisite-joy]
  - ref: 6
    phrase: in my prosperity I said, I shall never be moved
    kind: scripture
    title: What he said in his ease
    body: |
      Verses 6–7 go back to how the trouble began: at ease, the speaker said he would never be moved, and then the LORD hid His face. “Prosperity” is a word for “ease, prosperity.”

      One older reading names a fault in the saying: “Instead of confiding in the Giver, he trusted in the gift, as though it had been his own work.” It hears in it what another psalm puts in the mouth of the wicked, “He hath said in his heart, I shall not be moved: for I shall never be in adversity” ([[Ps. 10:6]]), and sets the verse beside Moses’s warning to Israel about the day of plenty: “Then thine heart be lifted up, and thou forget the LORD thy God” ([[Deut. 8:14]]).

      Verse 7 says what had held him up: the mountain stood “by thy favour.” The same reading takes “my mountain” as Zion, the fortified hill that “is the emblem of the kingdom of David.” The text is not certain here. The ancient Greek translators read a different word, “thou didst add strength to my beauty,” and a modern translation makes the mountain a comparison for the speaker himself: “you had established me as a strong mountain.”

      Then the favour was withdrawn. On the hidden face, see [[Ps. 13:1]]. That psalm names no cause for it; on the older reading given above, this one does, since the withdrawal was “brought about by his self-exaltation.”
    sources: [oshb-wlc, bdb, lds-scriptures, delitzsch-psalms, lxx-rahlfs, nrsvue]
  - ref: 9
    phrase: Shall the dust praise thee?
    kind: scripture
    title: The argument of the prayer, and Joseph Smith’s revision
    body: |
      The prayer the speaker quotes is an argument: his death would gain nothing, because the dust cannot praise. “My blood” means his death, and a modern translation says so: “What profit is there in my death.” It is the argument of [[Ps. 6:5]], where Sheol is explained, along with what the Restoration adds.

      The plea is tied to the rest of the psalm by its verb. “Praise” in this verse is the Hebrew verb translated “give thanks” in verse 4 and again in verse 12.

      The Joseph Smith Translation turns the questions into a vow: “When I go down to the pit, my blood shall return to the dust. I will praise thee; my soul shall declare thy truth; for what profit am I, if I do it not?” In that wording the speaker goes down to the pit and praises all the same: the blood returns to the dust, and the soul declares the truth.
    sources: [lds-scriptures, nrsvue, oshb-wlc]
  - ref: 11
    phrase: Thou hast turned for me my mourning into dancing
    kind: symbol
    title: Wailing turned to a dance
    body: |
      The answer to the prayer is told as a change of posture and of clothing, and the LORD does both. “Mourning” is the Hebrew word for “wailing,” used first of wailing “for dead.” The dance set against it is a “token of joyousness.” The LORD takes the sackcloth off him and girds him with gladness in its place.

      Lamentations uses the same word for the dance and runs the line backward for Zion in her sorrow: “The joy of our heart is ceased; our dance is turned into mourning” ([[Lam. 5:15]]). Jeremiah promises Israel the turn that this psalm reports of one man ([[Jer. 31:13]]).
    sources: [oshb-wlc, bdb, lds-scriptures]
  - ref: 12
    phrase: my glory
    kind: words
    title: My glory is the self that sings
    body: |
      “My glory” here is the speaker’s own inner self, not his reputation. The Hebrew has only “glory”; the King James and the ancient Greek have “my glory,” and a modern translation renders it “so that my soul may praise you and not be silent,” noting the Hebrew in its margin. The word is used in poetry for “the seat of honour in the inner man, the noblest part of man,” standing where “soul” or “heart” might stand, as in [[Ps. 16:9]].

      The verse opens with a purpose, “To the end that,” and so gives the reason for the change in verse 11: that he would sing and “not be silent.”
    sources: [oshb-wlc, nrsvue, lxx-rahlfs, bdb]

christ: |
  Psalm 30 is first one man’s thanks for a healing. Some Christians have read it as “a prophecy of Christ’s Resurrection,” but the note on verse 3 gives the reason to hear it of a recovery. What it says of the LORD is that He heals, that He brings a soul up from the grave, and that His anger is a moment beside His favour.

  Latter-day leaders have carried verse 5 to the Savior’s work: Elder Thomas S. Monson to His Resurrection, and Elder Craig C. Christensen to the joy of being freed from sin through His Atonement (see the note on verse 5).

  The Church’s footnote at verse 11 sets the gladness put on in place of sackcloth beside Isaiah’s Messiah, who gives “the oil of joy for mourning, the garment of praise for the spirit of heaviness” ([[Isa. 61:3]]). Jesus was handed the book of Isaiah, read the opening lines of that chapter, and said, “This day is this scripture fulfilled in your ears” ([[Luke 4:21]]).

explore: |
  - **Nephi’s psalm.** Read [[2 Ne. 4:16–35]] beside this psalm. Nephi’s own words ([[2 Ne. 4:23]], [[2 Ne. 4:35]]) are close to this psalmist’s, who tells of crying to the LORD (verse 8) and being lifted up (verse 1) “in words reminiscent of” that psalm.
  - **Another recovered king.** Hezekiah’s writing after his sickness makes the argument of verse 9, and then gives thanks as one of the living ([[Isa. 38:18–19]]). An older commentary holds that his song grew out of the close of this psalm.

parallels:
  - ref: Isa. 54:7–8
    note: The LORD’s wrath and hidden face last a moment, His kindness for ever.
  - ref: Isa. 38:18–19
    note: Hezekiah, recovered, argues that the grave cannot praise and the living can.
  - ref: Ps. 10:6
    note: The wicked man says what the speaker said in his ease.
  - ref: Lam. 5:15
    note: Verse 11 run backward, for Zion in her sorrow.
  - ref: 2 Ne. 4:23
    note: Nephi’s cry is heard, as the psalmist’s was (also 2 Ne. 4:35).

