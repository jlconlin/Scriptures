chapter: 143
title: Enter Not into Judgment
tagline: A hunted man asks God to answer him and not to try him, since no one living could pass that trial, and then asks for everything else on the strength of what God is.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  The title gives the psalm to David and names no occasion. Some copies of the ancient Greek translation add one, “when his son pursued him,” which would set it in the flight from Absalom, where [[Ps. 3]] stands by its own title; other Greek copies have no title at all. The psalm itself says only that an enemy has hunted the speaker and shut him in darkness.

  It follows the prayer “when he was in the cave,” and the two share words. “My spirit was overwhelmed within me” ([[Ps. 142:3]]) returns in verse 4, and “Bring my soul out of prison” ([[Ps. 142:7]]) becomes “bring my soul out of trouble” in verse 11. Much else is the language of earlier psalms as well; on one older reading the second half especially reads “like a reproduction of the thoughts of earlier Psalms.”

  The psalm is a lament (see [[Ps. 22:1]]), and Christian tradition counts it the last of the seven penitential psalms, the psalms of repentance listed in the note on [[Ps. 6:1]]. It confesses no particular sin. Its confession is verse 2, where David asks not to be brought to trial because “in thy sight shall no man living be justified.” Paul takes up that sentence in [[Rom. 3:20]] and says the same in [[Gal. 2:16]], and Lehi says as much to his son Jacob in [[2 Ne. 2:5]].

thread: |
  Psalm 143 is **a prayer that asks for everything and claims nothing**. Its first two verses settle the terms. David asks to be answered “in thy faithfulness” and “in thy righteousness,” and in the next breath asks that God not “enter into judgment” with him. He does not plead that he is in the right. He pleads what God is.

  Only then does he say what is wrong. An enemy has run him down and left him in the dark like the long dead, and his spirit is “overwhelmed” (verses 3–4). He remembers “the days of old” and what God’s hands have done, and the memory turns into reaching: hands stretched out, a soul like thirsty ground (verses 5–6). There the psalm pauses at its Selah (see [[Ps. 3:2]]), which divides it into two halves.

  The second half is one request after another: answer quickly, do not hide thy face, let me hear, show me the way, deliver me, teach me, lead me, give me life, bring me out, cut off my enemies. Each request leans on something in God: “thy lovingkindness,” “thy name’s sake,” “thy righteousness’ sake,” “thy mercy.” What David puts forward of his own is only that he has turned to Him: “in thee do I trust,” “I flee unto thee,” “thou art my God.”

  The psalm does not turn to praise, as many laments do, and it reports no answer. It ends still asking, and its last words are the one thing he says of himself: “I am thy servant.”

sections:
  - range: 1-2
    heading: Answer me, and do not try me
    plain: |
      Hear my prayer, LORD; listen to my pleading. Answer me because You are faithful and because You are righteous. Do not bring Your servant to trial, for no one alive could be found in the right before You.
  - range: 3-6
    heading: Dwelling in darkness, remembering, reaching
    plain: |
      The enemy has hunted me and crushed my life to the ground. He has made me live in darkness like those long dead. So my spirit is overwhelmed and my heart within me is desolate. I remember the days of old. I think over everything You have done and turn over in my mind the work of Your hands. I stretch out my hands to You; my soul thirsts for You like parched ground.
  - range: 7-9
    heading: Let me hear in the morning
    plain: |
      Answer me quickly, LORD; my spirit is giving out. Do not hide Your face from me, or I will be like those who go down into the pit. Let me hear of Your lovingkindness in the morning, for I trust in You. Show me the way I should walk, for I lift up my soul to You. Deliver me from my enemies, LORD; I flee to You to hide me.
  - range: 10-12
    heading: Teach me, lead me, give me life
    plain: |
      Teach me to do Your will, for You are my God. Your Spirit is good; lead me onto level ground. For Your name’s sake, LORD, give me life. Because You are righteous, bring my soul out of trouble. And in Your mercy cut off my enemies and destroy all who afflict my soul, for I am Your servant.

notes:
  - ref: 1
    phrase: in thy faithfulness answer me, and in thy righteousness
    kind: words
    title: Why he appeals to God’s righteousness
    body: |
      David asks to be answered because God is righteous in the same breath in which he asks not to be judged, so the righteousness he means cannot be the kind that pays a man what he has earned. On one older reading it is righteousness “not in a recompensative legal sense, but in an evangelical sense”: the earnestness with which God upholds “the order of salvation established by His holy love,” set beside “His faithfulness to His promises.” The prayer of verse 2 is then that God “would let mercy instead of justice have its course with him.”

      The same reading finds this borne out at the end of the psalm. Righteousness returns in verse 11 as the reason for rescue, “for thy righteousness’ sake bring my soul out of trouble,” and it is mercy that is named beside the cutting off of enemies in verse 12, the reverse of the pairing a reader expects.
    sources: [delitzsch-psalms]

  - ref: 2
    phrase: for in thy sight shall no man living be justified
    kind: scripture
    title: No man living, and what Paul adds
    body: |
      Verse 2 is a statement about every living person, and Paul writes it into his letter to the Romans. “Justified” is a courtroom word. In this verse the Hebrew verb means to be found in the right “by acquittal,” and the judgment David asks to be spared is a trial. A modern translation has “no one living is righteous before you.” He does not protest his innocence. He says that no one at all could come through such a hearing. Job asks the same, “how should man be just with God?” ([[Job 9:2]]), and so does another psalm: “If thou, LORD, shouldest mark iniquities, O Lord, who shall stand?” ([[Ps. 130:3]]).

      Paul’s sentence in Romans follows the verse closely, and he says the same to the Galatians. Both times he adds a phrase: “by the deeds of the law there shall no flesh be justified in his sight” ([[Rom. 3:20]]), and “by the works of the law shall no flesh be justified” ([[Gal. 2:16]]). The psalm says that no one is acquitted before God. Paul says that the law cannot acquit, and then says what does: “Being justified freely by his grace through the redemption that is in Christ Jesus” ([[Rom. 3:24]]).

      Lehi says to his son Jacob what Paul says, “by the law no flesh is justified” ([[2 Ne. 2:5]]), and he too names the remedy: “there is no flesh that can dwell in the presence of God, save it be through the merits, and mercy, and grace of the Holy Messiah” ([[2 Ne. 2:8]]).
    sources: [lds-scriptures, bdb, nrsvue]

  - ref: 3
    phrase: he hath made me to dwell in darkness, as those that have been long dead
    kind: symbol
    title: Darkness like the grave
    body: |
      The darkness of verse 3 is the darkness of the grave: the enemy has all but put David among the dead. Verse 7 says it outright. He fears to be “like unto them that go down into the pit,” nearly the words of [[Ps. 28:1]]; on the place of the dead, see [[Ps. 6:5]].

      The line is also a line of Lamentations, the same four words in the Hebrew. There the man who has seen affliction says, “He hath set me in dark places, as they that be dead of old” ([[Lam. 3:6]]). In Lamentations the one who shuts the speaker in is God, whose “rod of his wrath” has fallen on him. In the psalm it is the enemy, and God is the one appealed to.

      Verse 11 asks for the opposite. “Quicken me” asks to be revived, and a modern translation has “preserve my life.”
    sources: [lds-scriptures, oshb-wlc, bdb, nrsvue]

  - ref: 8
    phrase: Cause me to hear thy lovingkindness in the morning
    kind: symbol
    title: Morning after the darkness
    body: |
      The morning David asks for is the end of the night he is in, and what he wants when it comes is a word. On one older reading the prayer is that “the night of affliction may have an end” with the next dawn. He began by asking the LORD to hear him (verse 1). Now he asks to be made to hear, and a modern translation has “Let me hear of your steadfast love in the morning.” The lovingkindness is the covenant love explained at [[Ps. 51:1]], and morning as the hour of God’s help is taken up at [[Ps. 90:14]].
    sources: [delitzsch-psalms, nrsvue, lds-scriptures]

  - ref: 10
    phrase: lead me into the land of uprightness
    kind: words
    title: Level ground
    body: |
      “The land of uprightness” is level ground, a figure for safety. The Hebrew noun is a “level place (free from obstacles),” used as a figure for a “place of safety, comfort, and prosperity,” and a modern translation has “Let your good spirit lead me on a level path.” It is the word behind the “plain path” David asks for in [[Ps. 27:11]].

      The guide is God’s Spirit, and David calls it good. The Levites’ prayer in Nehemiah says the same of the Spirit that taught Israel in the days of the manna: “Thou gavest also thy good spirit to instruct them” ([[Neh. 9:20]]). David asks to be taught too. “Teach me to do thy will” stands beside “lead me,” so the man who has said he cannot be justified does not ask only to be rescued. He asks to be taught to obey.
    sources: [bdb, nrsvue, lds-scriptures]

  - ref: 12
    phrase: And of thy mercy cut off mine enemies
    kind: scripture
    title: Asked of mercy, by a servant
    body: |
      The last verse asks for the enemies’ end as an act of God’s mercy, and gives one reason: “for I am thy servant.” “Mercy” here and “lovingkindness” in verse 8 are one Hebrew word, the covenant love explained at [[Ps. 51:1]]; why mercy and not righteousness stands beside the cutting off is taken up in the note on verse 1. David asks God to act and does not act himself; how prayers of this kind are to be read is the note at [[Ps. 137:8]].

      “Thy servant” is also what he called himself in verse 2, where the servant is the one who cannot stand trial. Here it is the only thing he offers for himself.
    sources: [oshb-wlc]

christ: |
  The LORD to whom David prays is Jehovah, who is Jesus Christ before His birth ([[Ps. 110:1]] has the note).

  Verse 2 says that no one living is justified before God. Paul, who writes that sentence in [[Rom. 3:20]], goes on in the same passage to say how anyone is. God set forth His Son “to declare his righteousness for the remission of sins that are past” ([[Rom. 3:25]]), “that he might be just, and the justifier of him which believeth in Jesus” ([[Rom. 3:26]]).

  To be justified is to be “pardoned from punishment for sin and declared guiltless,” and it comes “by the Savior’s grace through faith in Him.” The law that no man living can satisfy is not set aside. He “has satisfied the demands of justice by His own suffering,” and so “He removes our condemnation without removing the law.”

explore: |
  - **Paul’s argument from verse 2.** [[Rom. 3:19–26]] and [[Gal. 2:16]].
  - **Lehi on the same sentence.** [[2 Ne. 2:5–8]].
  - **The prayer before this one.** [[Ps. 142]], from the cave, with the same overwhelmed spirit.
  - **Remembering the days of old.** [[Ps. 77:5–12]], where another psalmist considers the days of old and meditates on God’s work.
  - **The man in dark places.** [[Lam. 3:1–24]], which begins in the same dark places and comes to mercies new every morning and to God’s faithfulness.
  - **The thirsty land.** [[Ps. 63:1]], where the note explains the image.

parallels:
  - ref: Rom. 3:20
    note: Paul writes the sentence of verse 2 and adds “by the deeds of the law.”
  - ref: Gal. 2:16
    note: Paul’s sentence again, with “by the works of the law.”
  - ref: 2 Ne. 2:5
    note: Lehi to Jacob, “by the law no flesh is justified.”
  - ref: Lam. 3:6
    note: The line of verse 3, set in dark places like the dead of old.
  - ref: Ps. 142:3
    note: The overwhelmed spirit of verse 4, in the psalm before.
  - ref: Ps. 27:11
    note: The “plain path” is the level ground of verse 10.
  - ref: Neh. 9:20
    note: God’s “good spirit” given to instruct Israel.

