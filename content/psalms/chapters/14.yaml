chapter: 14
title: The Fool Hath Said in His Heart
tagline: A fool tells himself there is no God; the LORD looks down from heaven and finds no one doing good, and the psalm ends by finding God among the righteous poor and longing for salvation out of Zion.
when: 'Undated; a psalm of David by its title'

setting: |
  The title ascribes the psalm to David and addresses it to the chief Musician (see [[Ps. 8:1]]). It names no occasion.

  The psalm stands in the book twice. Psalm 53 is “another version of the same psalm,” and the two can be told apart at a glance by the names of God: this one says “the LORD” four times and “God” three, while Psalm 53 says “God” all seven times and never uses the divine name. The two part company at verse 5, and the note there sets them side by side.

  Nothing in the psalm is addressed to God. The psalmist reports a saying, a look from heaven and a verdict, then turns on the oppressors, and closes with a wish.

  Two later readers have shaped how the psalm is heard. Paul quotes its verdict in [[Rom. 3:10–12]] to show that Jews and Gentiles alike are under sin. And Joseph Smith, who used the psalm twice in his earliest account of the First Vision, reworked all seven verses in his translation of the Bible, most probably in January or February 1833. The Church’s edition prints that version in its appendix, under a heading that reads it of the loss of truth in the last days and the establishment of Zion.

thread: |
  The psalm begins with something said where no one can hear it and ends with a wish said aloud. **Between them it moves from “There is no God” to the place where God is.**

  The first three verses are an inquiry. A fool says in his heart that there is no God, and the psalmist at once sets beside the saying the conduct that goes with it (verse 1). Then the view shifts to heaven, where the LORD is looking down to see whether anyone understands and seeks Him (verse 2), and verse 3 gives what He finds. The fool’s denial and the finding are built from the same Hebrew word. “There is no God” is two words, *ein Elohim*, and the same *ein*, “there is not,” returns three more times: “there is none that doeth good” in verse 1, and twice in verse 3, “there is none that doeth good, no, not one.”

  Verse 4 changes the voice. Someone who can say “my people” asks whether the wrongdoers know nothing at all, they who eat up that people like bread and never call on the LORD.

  The turn comes at the first word of verse 5, “There.” Terror falls on the devourers, and the reason given is the opposite of the fool’s saying: “God is in the generation of the righteous.” On one reading, the people called “my people” in verse 4 are that generation. Verse 6 turns to the oppressors and addresses them directly: the poor man’s plans may be scorned, but the LORD is his refuge.

  The verdict of verse 3 allowed no exception, and yet verse 5 knows a “generation of the righteous.” The psalm leaves the two side by side; the second note on verse 3 gives what Paul and Restoration scripture do with the line. The last verse is a longing that salvation would come out of Zion.

sections:
  - range: 1
    heading: What the fool says in his heart
    plain: |
      The senseless man tells himself, “There is no God.” Such people are corrupt; what they do is abominable; not one of them does good.
  - range: 2-3
    heading: The LORD looks down
    plain: |
      The LORD looked down from heaven on humankind to see whether anyone had understanding, anyone who sought God. All have turned aside; all alike have gone bad. No one does good, not even one.
  - range: 4-6
    heading: God is with the righteous
    plain: |
      Do they know nothing, all these wrongdoers, who devour my people the way they eat bread and never call on the LORD? There they are, seized with dread, because God is with the company of the righteous. You would bring the poor man’s plans to nothing, but the LORD is his refuge.
  - range: 7
    heading: Salvation out of Zion
    plain: |
      If only Israel’s salvation would come out of Zion! When the LORD brings back His captive people, Jacob will rejoice and Israel will be glad.

notes:
  - ref: 1
    phrase: The fool
    kind: words
    title: The fool is senseless toward God, not slow-witted
    body: |
      The Hebrew word here, *nabal*, describes a moral condition and not a weak mind. It is used “especially of the man who has no perception of ethical and religious claims,” with a further sense of what is “ignoble, disgraceful,” and as a noun it means an “(impious and presumptuous) fool.”

      Scripture gives the word a face. It is spelled exactly as the name of Nabal, the churlish man of Carmel in David’s story, and his wife Abigail makes the point herself: “as his name is, so is he; Nabal is his name, and folly is with him” ([[1 Sam. 25:25]]). Isaiah describes the same character, whom the King James there calls “the vile person”: his heart works iniquity, and he acts “to make empty the soul of the hungry” ([[Isa. 32:6]]).

      The verse moves straight from the one fool to “they,” and from what he thinks to what they do. A modern translation makes him plural from the first word: “Fools say in their hearts.”
    sources: [bdb, oshb-wlc, lds-scriptures, nrsvue]
  - ref: 1
    phrase: There is no God
    kind: scripture
    title: Joseph Smith’s translation gives the fool a reason
    body: |
      In Joseph Smith’s translation the fool reasons his way to his denial: “There is no man that hath seen God. Because he showeth himself not unto us, therefore there is no God.” The Hebrew text has only the two words of the denial; the reasoning is the translation’s.

      The change moves the dispute. It has been read as “making the immediate matter of dispute not whether God exists but whether God appears to human beings.” On that reading the fool is the one who denies that God shows Himself to anyone.

      The added words echo a sentence of the New Testament, “No man hath seen God at any time” ([[John 1:18]]). The Prophet had already met that sentence twice in his translation and revised it, so that passages which could be used against his vision became “passages supporting it.” He had reason to know the objection. When he told a minister of his vision, he was answered that “there were no such things as visions or revelations in these days” ([[JS—H 1:21]]). The expansion, it has been suggested, “makes the psalm more accurately reflect his own experience after the First Vision.” That is a historian’s inference about the translation, not something the translation says of itself.
    sources: [jst-ps-14, ot-minute-psalms-1-20, wright-bradley-none-good, oshb-wlc, lds-scriptures]
  - ref: 2
    phrase: The LORD looked down from heaven
    kind: scripture
    title: A verdict that rests on looking
    body: |
      The psalm puts an inspection between the fool’s saying and the judgment on it, and its wording has been heard as recalling two earlier inspections in Genesis. One older reading hears the Flood in verse 1 and Babel in verse 2: the word for “corrupt” “reminds one of the history of the Flood,” and “to see” recalls “the history of the building of the tower of Babel.”

      The Hebrew words are shared, which shows the likeness though not that the psalmist intended it. The verb behind “They are corrupt” is the verb of “all flesh had corrupted his way upon the earth,” in a verse that begins “And God looked upon the earth” ([[Gen. 6:12]]). And “to see” is the same form used when “the LORD came down to see the city and the tower, which the children of men builded” ([[Gen. 11:5]]), where “the children of men” is the psalm’s phrase as well.

      The picture of the LORD looking down is a human one, and the point of it, on this reading, is that “God’s judgment rests upon a knowledge of the matter of fact.”

      Where the King James has “any that did understand,” a modern translation has “any who are wise.”
    sources: [delitzsch-psalms, oshb-wlc, nrsvue, lds-scriptures]
  - ref: 3
    phrase: They are all gone aside
    kind: prophets
    title: The verse in the First Vision
    body: |
      Joseph Smith’s earliest account of the First Vision has the Lord speak this verse. In the history he wrote in the summer of 1832, the Lord says, “behold the world lieth in sin at this time and none doeth good no not one they have turned asside from the gospel and keep not my commandments.” Earlier in the same account, before the vision, Joseph had used verse 1: “well hath the wise man said it is a fool that saith in his heart there is no God.”

      Probably within months he came to Psalm 14 in his translation of the Bible, and the first verses became a conversation. The Lord “by his voice said unto his servant, Seek ye among the children of men, to see if there are any that do understand God.” The servant answers, “Behold, all these who say they are thine.” The verdict of verse 3 then becomes the Lord’s reply to him: “They are all gone aside, they are together become filthy, thou canst behold none of them that are doing good, no, not one.” Verse 4 goes on, “All they have for their teachers are workers of iniquity, and there is no knowledge in them.”

      The likeness to the Prophet’s own experience has been noticed more than once, and the fullest comparison takes the evidence to show that Joseph “modeled JST Psalm 14 after his First Vision experience.” It sets verse 1’s “They are corrupt” beside the words of his later account, “those professors were all corrupt” ([[JS—H 1:19]]). This is a reading of the translation, offered as likely and not as certain. The heading in the Church’s edition says that the psalmist sees the loss of truth in the last days and looks forward to the establishment of Zion.
    sources: [js-history-1832, jst-ps-14, mcconkie-poetic-writings, lefevre-jst-psalms, wright-bradley-none-good, lds-scriptures]
  - ref: 3
    phrase: there is none that doeth good, no, not one
    kind: scripture
    title: Paul’s proof that all are under sin
    body: |
      Paul quotes the psalm’s first three verses to prove that no one, Jew or Gentile, stands outside sin. He has just said that “they are all under sin” ([[Rom. 3:9]]), and he continues, “As it is written, There is none righteous, no, not one” ([[Rom. 3:10]]), ending with this line: “there is none that doeth good, no, not one” ([[Rom. 3:12]]). His wording matches the ancient Greek translation of the psalm, which has “They are all gone out of the way” where the King James, from the Hebrew, has “gone aside.”

      A reader who goes from Romans back to the psalm will miss something. Paul’s chain of quotations continues, “Their throat is an open sepulchre” ([[Rom. 3:13]]), and runs on through verse 18, and none of that is in Psalm 14 as the King James has it. The Greek psalm as it has come down does carry those lines in verse 3; the Hebrew does not.

      The psalm itself speaks two verses later of “the generation of the righteous.” Paul applies “no, not one” to all, “that every mouth may be stopped, and all the world may become guilty before God” ([[Rom. 3:19]]), and then gives the remedy: “Being justified freely by his grace through the redemption that is in Christ Jesus” ([[Rom. 3:24]]).

      Restoration scripture uses the line twice. Moroni’s last chapter, in one of the phrases the Book of Mormon shares with the Psalms, warns what follows “if the day cometh that the power and gifts of God shall be done away among you” ([[Moro. 10:24]]): “there shall be none that doeth good among you, no not one. For if there be one among you that doeth good, he shall work by the power and gifts of God” ([[Moro. 10:25]]). And a revelation of October 1830 has the Lord say of His vineyard, “there is none which doeth good save it be a few” ([[D&C 33:4]]).
    sources: [lds-scriptures, lxx-rahlfs, hilton-psalms-bom, wright-bradley-none-good]
  - ref: 4
    phrase: who eat up my people as they eat bread
    kind: symbol
    title: People eaten like bread
    body: |
      The image is of people consumed as casually as a meal. One older reading renders the line “who eating my people, eat bread,” that is, they “think that they are not doing anything more sinful” than when they sit down to eat. The same reading finds the thought carried further in Micah, who charges Israel’s rulers that they “eat the flesh of my people” ([[Micah 3:3]]).

      “My people” raises the question of who is speaking. The same reading hears the LORD Himself in the verse, a “divine outburst of indignation which the psalmist hears,” although the last clause names the LORD in the third person. Joseph Smith’s translation also gives these words to the Lord, as part of the answer that begins in verse 3 (see the first note on that verse).
    sources: [delitzsch-psalms, jst-ps-14, lds-scriptures]
  - ref: 5
    phrase: There were they in great fear
    kind: scripture
    title: Where Psalm 14 and Psalm 53 part
    body: |
      Verse 5 is where Psalm 14 and its twin, Psalm 53, go different ways. Psalm 53 reads, “There were they in great fear, where no fear was: for God hath scattered the bones of him that encampeth against thee” ([[Ps. 53:5]]). There the terror falls on one who has encamped against God’s people, and the verse ends with their shame. Psalm 14 gives the fear a different cause, God’s presence with the righteous, and spends its next verse on the poor man and his refuge, which Psalm 53 does not mention.

      The ancient Greek translation of Psalm 14 has the extra words of Psalm 53 here too: “There were they alarmed with fear, where there was no fear.”

      The King James puts the fear in the past. A modern translation puts it in the future, “There they shall be in great terror,” and renders “generation” as a kind of people, not a span of time: God is with the “company of the righteous.” Joseph Smith’s translation has the present: “God dwells in the generation of the righteous.”
    sources: [lds-scriptures, lxx-rahlfs, nrsvue, jst-ps-14]
  - ref: 6
    phrase: Ye have shamed the counsel of the poor
    kind: words
    title: A line spoken to the oppressors
    body: |
      Here the psalm speaks to the wrongdoers directly, and the King James wording hides how the two halves of the line fit. The Hebrew verb is a plural “you,” and its form is not the completed past of “have shamed.” A modern translation renders it “You would confound the plans of the poor,” but the LORD is their refuge. Read so, the “counsel” is what the poor plan, and the second half answers the first.

      Joseph Smith’s translation resolves the line another way. It adds to verse 5 that God “is the counsel of the poor, because they are ashamed of the wicked, and flee unto the Lord, for their refuge,” and it turns verse 6 around: “They are ashamed of the counsel of the poor.” There “the counsel of the poor” is a title. It “refers to God Himself,” so that “it is the wicked who are ashamed of the Lord.”
    sources: [oshb-wlc, nrsvue, jst-ps-14, ot-minute-psalms-1-20]
  - ref: 7
    phrase: bringeth back the captivity of his people
    kind: words
    title: Captivity need not mean the exile
    body: |
      The phrase sounds like the Babylonian exile, and might seem to date the psalm there, but the Hebrew idiom is wider than that. It joins a verb to a noun that sounds like it, *shub shebut*, a set phrase meaning to “restore the captivity of” someone, used from [[Deut. 30:3]] on. The same two words are used of Job’s restoration: the LORD “turned the captivity of Job” ([[Job 42:10]]) when He gave him twice what he had lost. A modern translation accordingly has the LORD here as one who “restores the fortunes of his people.”

      One older reading weighs both possibilities. The verse “sounds like a liturgical addition belonging to the time of the Exile,” and yet, since the phrase “also signifies metaphorically to turn misfortune,” the ascription to David “cannot be called in question from this quarter.” The psalm itself does not say what captivity it means.
    sources: [oshb-wlc, bdb, lds-scriptures, nrsvue, delitzsch-psalms]
  - ref: 7
    phrase: Oh that the salvation of Israel were come out of Zion
    kind: scripture
    title: Zion established out of heaven
    body: |
      The psalm ends by wishing that Israel’s rescue would come from Zion, and Joseph Smith’s translation turns the wish toward Zion itself.

      The translation reads, “Oh that Zion were established out of heaven, the salvation of Israel. O Lord, when wilt thou establish Zion?” Zion is now the thing longed for, and it comes from above. This “looks forward with hope to the latter-day descent of Enoch’s Zion from heaven.” The Prophet had learned of Enoch’s Zion in translating Genesis, where the Lord promises, “righteousness will I send down out of heaven” ([[Moses 7:62]]), and a holy city to be called Zion.

      The psalms were likely translated in January 1833, and the changed verse has been read as a prayer of that season, “an impassioned call for Enoch’s city to return” and join the New Jerusalem then beginning in Jackson County. The added question, on the same reading, implies “that it may not be soon.”
    sources: [jst-ps-14, ot-minute-psalms-1-20, lefevre-jst-psalms, lds-scriptures]

christ: |
  Paul quotes Psalm 14 on the way to his witness of Christ. From its verdict that no one does good ([[Rom. 3:12]]) he goes on to the answer, redemption in Christ Jesus ([[Rom. 3:24]]); the second note on verse 3 quotes both.

  Joseph Smith’s 1832 account of the First Vision has both from the Lord Himself. Before the Lord speaks the psalm’s verdict, “none doeth good no not one,” He says who He is: “I am the Lord of glory I was crucifyed for the world that all those who believe on my name may have Eternal life.” The first note on verse 3 gives that account.

explore: |
  - **The twin psalm.** [[Ps. 53]], read beside this one for the names of God and for verse 5.
  - **Paul’s whole argument.** [[Rom. 3:9–26]], from “all under sin” to “justified freely by his grace.”
  - **The translation whole.** Joseph Smith Translation, Psalm 14:1–7, in the appendix of the Church’s edition, read beside [[JS—H 1:15–20]].
  - **The translation and the First Vision.** “‘None That Doeth Good’: Early Evidence of the First Vision in JST Psalm 14,” *BYU Studies* 61, no. 3, compares the changed psalm with the accounts of the First Vision.

parallels:
  - ref: Ps. 53:1–6
    note: The same psalm with “God” throughout and a different verse 5.
  - ref: Rom. 3:10–12
    note: Paul quotes verses 1–3 to show that Jews and Gentiles are all under sin.
  - ref: Moro. 10:25
    note: Moroni uses the line of verse 3 and adds that anyone who does good does so by the power and gifts of God.
  - ref: D&C 33:4
    note: The Lord says of His vineyard that none does good “save it be a few.”
  - ref: Gen. 6:12
    note: God looks on the earth and finds it corrupt, with the verb of verse 1.

