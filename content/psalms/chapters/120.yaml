chapter: 120
title: I Am for Peace
tagline: A man living far from home among liars cries to the LORD, asks what the false tongue has coming, and ends with peace on his side and war on theirs.
when: 'Undated; the title names no author'

setting: |
  Psalm 120 opens a run of fifteen psalms, 120 to 134, that all carry the same heading. Four of the fifteen are ascribed to David in their titles and one is “for Solomon”; this one names no one. They stand in Book Five (see [[Ps. 150:6]]), directly after Psalm 119.

  When this psalm was written cannot be said. On one older reading the period “is uncertain,” and so is the kind of enemy: “foreign barbarians” or the speaker’s “own worldly-minded fellow-countrymen.” A proposal reported there sets these songs just after the return from exile, when neighbouring peoples tried “to keep down the rise of the young colony.” It is one proposal.

  The psalm itself says nothing of a road, of Jerusalem or of the temple. Its speaker lives as a foreigner among people who lie about him and who answer his talk of peace with war. Those things come in the songs that follow. The next lifts its eyes “unto the hills” ([[Ps. 121:1]]), and the one after says, “Our feet shall stand within thy gates, O Jerusalem” ([[Ps. 122:2]]). The last of the fifteen speaks to those who “by night stand in the house of the LORD” ([[Ps. 134:1]]).

thread: |
  The first of the pilgrim songs has no pilgrimage in it. It is a short lament (see [[Ps. 22:1]]), and **it does not turn: as the King James tells it, it begins with a cry that was heard, and it ends on the word “war.”**

  Verse 1, in the King James, looks back. The speaker cried in his distress, and the LORD heard him (the note on [[Ps. 120:1]] gives the other way the verse is read). Verse 2 is the prayer he prays now, and it is about speech: “lying lips” and “a deceitful tongue.” He then turns from God and speaks to the tongue itself, asks what it will be given, and answers his own question with arrows and burning coals (verses 3–4).

  Then comes the complaint. “Woe is me” (verse 5): he lives in Mesech and in the tents of Kedar, and has lived there too long, beside “him that hateth peace” (verse 6). The last verse sets the two sides against each other in a single line. He is for peace; when he opens his mouth, they are for war.

  Nothing after verse 1 says that the trouble has ended. No vow of praise follows, and no word of thanks. One older reading hears the opening still sounding at the close: “the cry for help with which it opens hovers over it.” On the King James reading of verse 1, the prayer rests on an earlier answer: the LORD has heard this speaker before.

sections:
  - range: 1-2
    heading: In my distress I cried
    plain: |
      In my trouble I called to the LORD, and He answered me. LORD, rescue my life from lips that lie and from a tongue that deceives.
  - range: 3-4
    heading: What shall be given unto thee?
    plain: |
      What will you be given, and what more will be done to you, you lying tongue? A warrior’s sharpened arrows, and with them glowing coals of the broom bush.
  - range: 5-7
    heading: Woe is me, that I sojourn in Mesech
    plain: |
      How wretched I am, a foreigner in Meshech, living among the tents of Kedar! I have lived too long beside those who hate peace. I am for peace; but when I speak, they are for war.

notes:
  - ref: 0
    phrase: A Song of degrees
    kind: history
    title: A song for the way up to Jerusalem
    body: |
      The heading shared by Psalms 120–134 most likely marks them as songs for pilgrims going up to Jerusalem, and the word *degrees* in it means steps. The Hebrew noun is a “step, stair.” It names the steps of the temple and of Solomon’s throne, and the King James turns it “degrees” where the shadow moves on the dial of Ahaz: “shall the shadow go forward ten degrees” ([[2 Kgs. 20:9]]). It is also a going up. Ezra’s journey home from exile is this word: “began he to go up from Babylon” ([[Ezra 7:9]]).

      Which sense the heading intends has been answered in more than one way. An old Jewish account, since set aside, was that these psalms “were sung on fifteen steps, leading from the court of Israel to the court of the women.” The “most prevalent and probable opinion” takes the going up as the journey: a “song of ascents, to the three great pilgrim feasts,” sung on the road. The Law set three feasts a year at which the men of Israel were to appear before the LORD ([[Ex. 23:14–17]]), and one of the fifteen speaks of the going: Jerusalem is the city “whither the tribes go up” ([[Ps. 122:4]]). The psalms were “probably so called because they were sung by Jewish pilgrims on their way up to Jerusalem,” and they are often called “pilgrim songs.”

      What worshippers did when they reached the hill is the subject of [[Ps. 24:3]].
    sources: [bd-degrees-songs-of, bdb, biblehub-interlinear, ot-manual-psalms, larsen-ascending-hill, lds-scriptures]
  - ref: 1
    phrase: and he heard me
    kind: scripture
    title: A cry already answered, or one still waiting
    body: |
      The King James tells verse 1 as something finished, and on that reading the speaker asks again because he was heard before. The ancient Greek translation agrees: “I cried to the Lord, and he hearkened to me.” A modern translation makes the verse present and open. “In my distress I cry to the Lord,” it begins, and the purpose is still ahead, “that he may answer me:” verse 2 is then printed as the words of that cry. Read so, the psalm is a single prayer with no answer in it yet.

      Jonah prays nearly the same sentence, and he prays it “out of the fish’s belly” ([[Jonah 2:1]]): “I cried by reason of mine affliction unto the LORD, and he heard me; out of the belly of hell cried I, and thou heardest my voice” ([[Jonah 2:2]]).
    sources: [lxx-rahlfs, nrsvue, lds-scriptures]
  - ref: 4
    phrase: Sharp arrows of the mighty, with coals of juniper
    kind: symbol
    title: Arrows and broom coals for the false tongue
    body: |
      Verse 4 is the answer to the question of verse 3: what the false tongue will be given is arrows and burning coals. The King James’s juniper is the desert bush Elijah lay down under ([[1 Kgs. 19:4]]), and it is “a kind of broom-shrub.” A modern translation prints the verse as the reply. “A warrior’s sharp arrows,” it reads, “with glowing coals of the broom tree!” Whose arrows they are the verse does not say; “the mighty” is simply a warrior in the modern translation.

      Other psalms speak of the slanderer’s words as weapons, and of weapons and fire coming back on him. His tongue is “a sharp sword” ([[Ps. 57:4]]), and his words are arrows: the wicked “bend their bows to shoot their arrows, even bitter words” ([[Ps. 64:3]]). In that psalm the answer is in kind, “But God shall shoot at them with an arrow” ([[Ps. 64:7]]). Psalm 140 asks that “the mischief of their own lips cover them” and, in the next breath, “Let burning coals fall upon them” ([[Ps. 140:9–10]]).

      The speaker names the penalty and leaves it to be given; he shoots nothing himself (see [[Ps. 137:8]] on prayers of this kind).
    sources: [nrsvue, bdb, lds-scriptures]
  - ref: 5
    phrase: that I sojourn in Mesech, that I dwell in the tents of Kedar
    kind: history
    title: Two peoples no one could live among at once
    body: |
      Mesech and Kedar are peoples far apart, one of the north and one of Arabia, so the verse is probably not giving an address. Mesech is the Meshech of the table of nations, a son of Japheth ([[Gen. 10:2]]). His people trade slaves and bronze with Tyre ([[Ezek. 27:13]]) and march in the host of Gog, which comes “out of the north parts” ([[Ezek. 38:2]], [[Ezek. 38:15]]). Kedar is a son of Ishmael ([[Gen. 25:13]]), a people of tents and archers named under “The burden upon Arabia” ([[Isa. 21:13–17]]) and counted among “the men of the east” ([[Jer. 49:28]]).

      One older reading places Meshech’s people “between the Black and the Caspian Seas” and draws the conclusion plainly: “it is impossible to dwell among them and the inhabitants of Kedar” at one and the same time, and so “both these names of peoples are to be understood emblematically.” They stand for people like them, “rough and quarrelsome characters” who have surrounded the speaker. Verse 6 says what the two names have in common for him: he has lived too long “with him that hateth peace.” That reading leaves open who these neighbours really were, foreigners or his own countrymen.
    sources: [lds-scriptures, delitzsch-psalms]

christ: |
  The LORD who is cried to in verse 1 is Jehovah (see [[Ps. 110:1]]). The psalm asks one thing of Him, deliverance from lying lips, and as the King James tells its first verse, He has answered this speaker’s cry out of distress before.

explore: |
  - **The songs that follow.** [[Ps. 121:1–8]], [[Ps. 122:1–9]] and [[Ps. 134:1–3]]: the hills, the gates of Jerusalem, the house of the LORD by night.
  - **The tongue.** [[James 3:1–12]], and [[Ps. 64:1–10]], where the arrows of bitter words are answered by an arrow from God.
  - **Going up.** [[Ex. 23:14–17]], the law of the three feasts, and [[Ps. 24:3]] on ascending the hill of the LORD.

parallels:
  - ref: Jonah 2:2
    note: Jonah prays verse 1 in nearly the same words.
  - ref: Ps. 122:4
    note: The tribes “go up” to Jerusalem, the journey the title of these fifteen psalms most likely names.
  - ref: Ezra 7:9
    note: Ezra’s going up from Babylon is the word of the title.
  - ref: Ps. 64:3–7
    note: Bitter words shot like arrows, and God’s arrow in return, as in verses 3–4.
  - ref: Ps. 140:9–10
    note: Burning coals asked upon those whose lips do mischief.
  - ref: Gen. 10:2
    note: Meshech among the sons of Japheth; Kedar is a son of Ishmael (Gen. 25:13).

