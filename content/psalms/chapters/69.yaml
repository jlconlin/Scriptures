chapter: 69
title: For Thy Sake I Have Borne Reproach
tagline: A man sinking in deep water, hated for nothing and mocked for his loyalty to God’s house, asks to be drawn out, calls down judgment on his persecutors, and vows a song that will please the LORD more than an ox.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  The title ascribes Psalm 69 to David and names no occasion in his life. Paul and Peter both quote the psalm as David’s ([[Rom. 11:9]]; [[Acts 1:16]]). Its last verses look for Zion saved and the cities of Judah built, which raises the question of its date (see the note on verse 35).

  It is a lament, the kind of psalm set out in the first note on [[Ps. 22:1]], and a long one: complaint, plea, a run of curses on the persecutors, and a vow of praise. What sets it apart is the reason given for the suffering. The speaker confesses that he is not blameless, but he is not hated for his faults. He is mocked because of his devotion to God, and he says so: “for thy sake I have borne reproach.”

  The New Testament turns to this psalm again and again; “after Psalm 22 there is no Psalm referred to in so many ways as Psalm 69.” The Savior’s “They hated me without a cause” is the wording of verse 4. The heading in the Church’s edition calls it “a messianic psalm of David.” This chapter takes the prayer first and, verse by verse, what the New Testament does with it.

thread: |
  Psalm 69 is about **reproach borne for God’s sake**. The Hebrew noun for reproach comes five times (verses 7, 9, 10, 19 and 20), more often than in any other psalm.

  The psalm opens in water. A man is sinking in mud with nothing under his feet, hoarse from calling (verses 1–3). Then, in order, come enemies who hate him for nothing (verse 4), his own folly, which God knows (verse 5), and, at the greatest length, his loyalty. Zeal for God’s house has eaten him up; he wept, fasted and wore sackcloth, and each act made him more of a joke, at the city gate and among the drinkers (verses 7–12).

  The turn is verse 13: “But as for me, my prayer is unto thee.” Everything in the complaint comes back as a request, the mire, the deep waters and the flood (verses 14–15), and the request rests on God’s mercy.

  The second half climbs the same way. The complaint reaches its lowest point in a broken heart, no comforter, and poison for food (verses 19–21). The curses follow (verses 22–28). Then, in verse 29, “But I am poor and sorrowful: let thy salvation, O God, set me up on high.” The man who began in the depths asks for a height. He vows a song, and the circle widens from him to the humble, to heaven and earth, to Zion, and to “the seed also of his servants.” A psalm that began with “no standing” ends with a people who “dwell therein.”

sections:
  - range: 1-4
    heading: Sinking, and hated without a cause
    plain: |
      Save me, O God, for the waters have come up to my very life. I am sinking in deep mud where there is no foothold; I have come into deep water, and the current sweeps over me. I am worn out with calling. My throat is parched, and my eyes fail while I wait for my God. Those who hate me for no reason outnumber the hairs of my head. Those who would destroy me, my enemies on false grounds, are strong. What I did not steal, I am then made to give back.
  - range: 5-12
    heading: For thy sake I have borne reproach
    plain: |
      O God, You know my folly, and my guilt is not hidden from You. Do not let those who wait for You be put to shame because of me, Lord GOD of hosts; do not let those who seek You be disgraced because of me, God of Israel. It is for Your sake that I have borne reproach and that shame covers my face. I have become a stranger to my brothers, a foreigner to my mother’s sons. Zeal for Your house has consumed me, and the insults of those who insult You have fallen on me. When I wept and fasted, I was mocked for it. When I wore sackcloth, I became a byword to them. Those who sit in the gate talk about me, and the drunkards make songs of me.
  - range: 13-18
    heading: But as for me, my prayer is unto thee
    plain: |
      But as for me, my prayer is to You, O LORD, at a time of favor. O God, in Your great mercy answer me, in the faithfulness of Your salvation. Pull me out of the mud and do not let me sink; let me be rescued from those who hate me and from the deep water. Do not let the flood sweep over me, or the deep swallow me, or the pit close its mouth over me. Answer me, O LORD, for Your lovingkindness is good; in Your great compassion turn to me. Do not hide Your face from Your servant, for I am in trouble; answer me quickly. Come near to my soul and redeem it; deliver me because of my enemies.
  - range: 19-21
    heading: Reproach hath broken my heart
    plain: |
      You know my reproach, my shame and my dishonor; my adversaries are all before You. Reproach has broken my heart, and I am in despair. I looked for someone to show sympathy, and there was no one; for comforters, and I found none. They gave me poison for my food, and for my thirst they gave me vinegar to drink.
  - range: 22-28
    heading: Let their table become a snare
    plain: |
      Let their own table become a snare in front of them, and their security a trap. Let their eyes go dark so that they cannot see, and make their loins shake continually. Pour out Your indignation on them, and let Your burning anger overtake them. Let their camp be desolate, and let no one live in their tents. For they persecute the one You have struck, and they talk about the pain of those You have wounded. Add guilt to their guilt, and do not let them come into Your righteousness. Let them be blotted out of the book of the living and not be written down with the righteous.
  - range: 29-36
    heading: A song better than an ox
    plain: |
      But I am afflicted and in pain; let Your salvation, O God, set me on high. I will praise the name of God with a song and magnify Him with thanksgiving. That will please the LORD more than an ox, more than a bull with horns and hoofs. The humble will see it and be glad; you who seek God, let your hearts live. For the LORD hears the needy and does not despise His own who are in bonds. Let heaven and earth praise Him, the seas and everything that moves in them. For God will save Zion and build the cities of Judah, and they will live there and possess it. The children of His servants will inherit it, and those who love His name will dwell in it.

notes:
  - ref: 0
    phrase: upon Shoshannim
    kind: words
    title: The title’s lilies
    body: |
      The title’s “Shoshannim” is “Lilies” in a modern translation: “To the leader: according to Lilies.” What the word is doing in a title is explained where it first heads a psalm ([[Ps. 45:1]]), and “To the chief Musician” at [[Ps. 8:1]].
    sources: [nrsvue]

  - ref: 1
    phrase: the waters are come in unto my soul
    kind: symbol
    title: Drowning, with nothing to stand on
    body: |
      The water of the opening verses threatens the speaker’s life. “Unto my soul” means up to the life. A modern translation has “up to my neck,” and the verse is one of those in which the word describes “a serious attack upon the life.” Jonah prays in nearly the same words: “The waters compassed me about, even to the soul” ([[Jonah 2:5]]). Verse 2 adds what water alone would not say. There is “deep mire,” and in it “no standing,” no “foothold.” He is not swimming. He is sinking.

      The psalm never says outright what the flood is. When the images return as requests (verses 14–15), one line among them is not an image: “let me be delivered from them that hate me, and out of the deep waters.” The haters and the waters stand side by side in a single line.

      The plea then names a third depth: “let not the pit shut her mouth upon me.” “Pit” is set parallel to “the deep,” and the line has been compared with another psalm’s “pit of (the) grave.”
    sources: [nrsvue, bdb, lds-scriptures]

  - ref: 4
    phrase: They that hate me without a cause
    kind: christ
    title: Hated for nothing
    body: |
      The Savior said that these words were fulfilled in Him: the world’s hatred came “that the word might be fulfilled that is written in their law, They hated me without a cause” ([[John 15:25]]). The same phrase stands in [[Ps. 35:19]], where the note sets out the quotation.

      “Without a cause” is a single Hebrew adverb that means for nothing: “gratuitously, without cause, undeservedly,” used “especially of groundless hostility or attack.” The verse then gives a case. “Then I restored that which I took not away” is, in a modern translation, a protest: “What I did not steal, must I now restore?” The verb is to “tear away, seize, rob.” He is being made to pay for a robbery he did not commit.
    sources: [lds-scriptures, bdb, nrsvue]

  - ref: 5
    phrase: my sins are not hid from thee
    kind: scripture
    title: The sufferer does not claim to be sinless
    body: |
      The man who is hated without a cause confesses faults of his own, and the psalm keeps the two things apart. The “foolishness” and “sins” are his; the second word means “wrong-doing, guiltiness.” But they are not what his enemies hate him for. Verse 7 gives their reason, “for thy sake,” and verse 6 gives his fear: that if he goes under, those who wait on God will be shamed “for my sake.” One older reading puts it so: “The person praying here is, it is true, a sinner, but that is no justification of the conduct of men towards him; he is suffering for the Lord’s sake.”

      This bears on how the psalm is read of Christ. The New Testament quotes particular lines of it (verses 4, 9, 22–23 and 25) and does not quote this one. The same older reading calls the whole psalm “typically prophetic”: “a history of life and suffering moulded by God into a factual prediction concerning Jesus the Christ.” On that reading a real sufferer’s life, with his own faults in it, was shaped to foretell Christ’s. The same question is met at [[Ps. 40:12]].
    sources: [bdb, delitzsch-psalms]

  - ref: 9
    phrase: the reproaches of them that reproached thee are fallen upon me
    kind: scripture
    title: Insults meant for God fall on him
    body: |
      Each half of this verse is quoted in the New Testament, and the second half says why the sufferer is hated. The first half the disciples remembered when Jesus drove the traders from the temple ([[John 2:17]]). The second Paul quotes as a description of Christ: “For even Christ pleased not himself; but, as it is written, The reproaches of them that reproached thee fell on me” ([[Rom. 15:3]]). In the psalm “thee” is God. Insults aimed at God land on the man who stands with Him.

      “Zeal” is a strong word, “ardor, zeal, jealousy,” and here it “hath eaten me up.” The verses that follow tell of weeping, fasting and sackcloth (verses 10–11). Each brought him more mockery, from those “that sit in the gate” to “the drunkards.” What stirred his zeal for God’s house the psalm does not say.
    sources: [lds-scriptures, bdb]

  - ref: 13
    phrase: in an acceptable time
    kind: words
    title: 'The turn: a time of favor'
    body: |
      The psalm turns here from complaint to plea, and “an acceptable time” means a time of God’s favor. “But as for me” sets the speaker against the mockers of verse 12: they sing about him, and he prays. The Hebrew phrase is two words, “time” and a noun meaning “goodwill, favour, acceptance,” and the same pair stands in one other place, where the LORD answers His servant: “In an acceptable time have I heard thee, and in a day of salvation have I helped thee” ([[Isa. 49:8]]). Paul quotes that line and adds, “behold, now is the accepted time” ([[2 Cor. 6:2]]).

      What the speaker asks for is an answer. “Hear me” in verses 13, 16 and 17 is “answer me” in a modern translation. He rests the request on what God is like and not on his own case: “in the multitude of thy mercy,” “thy lovingkindness is good,” “the multitude of thy tender mercies.” “Mercy” in verse 13 and “lovingkindness” in verse 16 are one Hebrew word, *hesed* (see [[Ps. 51:1]]).
    sources: [bdb, nrsvue, oshb-wlc, lds-scriptures]

  - ref: 20
    phrase: Reproach hath broken my heart
    kind: prophets
    title: 'Elder Talmage: the Lord died of a broken heart'
    body: |
      Elder James E. Talmage took this line as the psalmist’s foresight of how the Savior died. “The present writer believes that the Lord Jesus died of a broken heart,” he wrote, and he introduced verses 20–21 as what “the psalmist sang in dolorous measure according to his inspired prevision of the Lord’s passion.” He gives it as his own belief.

      In the psalm the broken heart is the grief of a man shamed and left alone. “I looked for some to take pity” has a verb that means to “condole, shew sympathy,” the verb used of Job’s friends, who came “to mourn with him and to comfort him” ([[Job 2:11]]). He looked for what a mourner is owed and found no one. For “I am full of heaviness” a modern translation has “I am in despair.”
    sources: [talmage-jesus-christ-35, bdb, nrsvue, lds-scriptures]

  - ref: 21
    phrase: in my thirst they gave me vinegar to drink
    kind: scripture
    title: Poison for food, vinegar for thirst, and two drinks at the cross
    body: |
      In the psalm this is cruelty to a grieving man, and the Gospels describe two drinks at the cross that recall it. He looked for comforters (verse 20), and what he was handed was “gall for my meat.” “Meat” is food. The Hebrew word behind “gall” means a “bitter and poisonous herb,” so that a modern translation has “They gave me poison for food.” The ancient Greek translation has “gall,” as the King James does; the English word means “something bitter.”

      Matthew’s account of the first drink has both nouns of this verse: “They gave him vinegar to drink mingled with gall: and when he had tasted thereof, he would not drink” ([[Matt. 27:34]]). Mark calls it “wine mingled with myrrh” ([[Mark 15:23]]). Elder James E. Talmage explained it as “a narcotic draught” offered to the condemned “for the merciful purpose of deadening the sensibility of the victim,” and said that Jesus refused it out of “His determination to meet death with faculties alert and mind unclouded.”

      The second drink came at the end. “Jesus knowing that all things were now accomplished, that the scripture might be fulfilled, saith, I thirst” ([[John 19:28]]), and a sponge filled with vinegar was put to His mouth ([[John 19:29]]). John does not name the scripture. This is the verse in which thirst is answered with vinegar (see also the note on [[Ps. 22:15]]).
    sources: [bdb, nrsvue, lxx-rahlfs, bd-gall, lds-scriptures, talmage-jesus-christ-35]

  - ref: 22
    phrase: Let their table become a snare before them
    kind: scripture
    title: The curses, and what Paul does with them
    body: |
      Verses 22–28 ask God to judge the persecutors, and the New Testament quotes them as David’s words. The first curse answers the wrong just named. They gave him poison at his meal; “therefore their table, which was abundantly supplied, is to be turned into a snare to them.” The curses are requests made to God, “let” and “pour out” and “add”: he asks God to act. How such prayers are read, and how they stand under the Savior’s command to love enemies, is the note at [[Ps. 137:8]].

      Paul quotes verses 22–23 of Israel in his own day, of whom “the election hath obtained it, and the rest were blinded” ([[Rom. 11:7]]): “And David saith, Let their table be made a snare, and a trap, and a stumblingblock, and a recompence unto them: Let their eyes be darkened, that they may not see, and bow down their back alway” ([[Rom. 11:9–10]]). His wording is close to the ancient Greek translation, which has “for a recompense” and “bow down their back continually” where the Hebrew has the shaking loins.

      Paul does not leave the curse as the last word. He asks at once, “Have they stumbled that they should fall? God forbid” ([[Rom. 11:11]]), and he says that “blindness in part is happened to Israel, until the fulness of the Gentiles be come in” ([[Rom. 11:25]]).
    sources: [delitzsch-psalms, lds-scriptures, lxx-rahlfs]

  - ref: 25
    phrase: Let their habitation be desolate
    kind: scripture
    title: Peter applies the verse to Judas
    body: |
      Peter quotes this verse of Judas, turning its plural into a singular. Before Matthias was chosen, he told the disciples that “this scripture must needs have been fulfilled, which the Holy Ghost by the mouth of David spake before concerning Judas, which was guide to them that took Jesus” ([[Acts 1:16]]). Then he gave it: “For it is written in the book of Psalms, Let his habitation be desolate, and let no man dwell therein: and his bishoprick let another take” ([[Acts 1:20]]).

      The first two clauses are this verse, with “their” made “his.” The last is from another psalm, “let another take his office” ([[Ps. 109:8]]), and Peter joins the two without marking the seam. In the psalm the enemies are many. Peter names one of them, and says that the Holy Ghost, speaking by David, had him in view.
    sources: [lds-scriptures]

  - ref: 26
    phrase: him whom thou hast smitten
    kind: scripture
    title: 'Smitten of God: two words shared with Isaiah 53'
    body: |
      The reason given for the curses is that the persecutors persecute a man whom God has already struck, and the line shares two Hebrew words with Isaiah’s song of the suffering servant. “Smitten” is a verb for striking, and “grief” is a noun for pain. Both stand in one verse of Isaiah: “Surely he hath borne our griefs, and carried our sorrows: yet we did esteem him stricken, smitten of God, and afflicted” ([[Isa. 53:4]]). There “sorrows” is the noun and “smitten” the verb. A modern translation’s cross-references set that verse beside this one.

      The two passages use the words differently. The psalmist says that God has smitten him. In Isaiah it is the onlookers who thought the servant “smitten of God,” and the next verse gives the reason he suffered: “he was wounded for our transgressions” ([[Isa. 53:5]]).

      The second half of the verse is plural, “those whom thou hast wounded,” a word that means “pierced, fatally wounded.” The speaker is not the only one who suffers so.
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]

  - ref: 28
    phrase: blotted out of the book of the living
    kind: symbol
    title: The book of the living
    body: |
      The last curse asks that the persecutors’ names be struck from God’s register, the image of Moses’s prayer after the golden calf. Moses offered himself, “blot me, I pray thee, out of thy book which thou hast written,” and the LORD answered, “Whosoever hath sinned against me, him will I blot out of my book” ([[Ex. 32:32–33]]).

      The second half of the verse says what it is to be in the book: to be “written with the righteous.” Scripture speaks elsewhere of such a register: “a heavenly record is kept of the faithful, whose names are recorded.”
    sources: [lds-scriptures, bd-book-of-life]

  - ref: 31
    phrase: better than an ox or bullock that hath horns and hoofs
    kind: words
    title: A song in place of an ox
    body: |
      He vows a song where a worshipper would vow an animal, and says the LORD will like it better. “Thanksgiving” in verse 30 is the Hebrew *todah*, which is also the name of the “thank-offering” brought to the altar. Here the *todah* is sung. The Hebrew words sound nearly alike: “song” is *shir* and “ox” is *shor*.

      Why mention horns and hoofs? On one older reading the two words “do not denote the rough material animal nature” but the animal’s “legal qualifications for being sacrificed.” Horned, it is old enough; hoofed, it belongs to the clean animals. So the comparison is with the best the altar could receive: “Even the most stately, full-grown, clean animal that may be offered as a sacrifice stands in the sight of Jahve very far below the sacrifice of grateful praise coming from the heart.” How far that thought reaches, and where it stops, is in the note on [[Ps. 51:16]].
    sources: [bdb, oshb-wlc, delitzsch-psalms]

  - ref: 35
    phrase: will build the cities of Judah
    kind: history
    title: Does the ending date the psalm?
    body: |
      The closing verses look for Zion saved and Judah’s cities built, which has been read as the return from exile, though the New Testament quotes the psalm as David’s. For “his prisoners” in verse 33 a modern translation has “his own who are in bonds.” On one older reading the poet’s view widens here “into the prophetic prospect of the bringing back of Israel out of the Exile into the Land of Promise,” and if David wrote the psalm this closing turn “might be more difficult of comprehension.” Many scholars now place the psalm after the return from Babylon.

      Paul and Peter both name David as the one who speaks in it ([[Rom. 11:9]]; [[Acts 1:16]]). The psalm itself gives no date. The end of Psalm 51 raises the same question (see the note on [[Ps. 51:18]]).

      Whenever it was first sung, the ending widens one man’s rescue into a people’s: “The seed also of his servants shall inherit it.”
    sources: [nrsvue, delitzsch-psalms, scripture-helps-ps-49, lds-scriptures]

christ: |
  Jesus Christ applied this psalm’s words to Himself, and His apostles applied more of them. “They hated me without a cause,” He said, was written of Him ([[John 15:25]]). His disciples remembered “The zeal of thine house hath eaten me up” when He cleansed the temple ([[John 2:17]]), and Paul read the other half of that verse of Him: “The reproaches of them that reproached thee fell on me” ([[Rom. 15:3]]). At the cross He was given vinegar, first mingled with gall and then on a sponge ([[Matt. 27:34]]; [[Matt. 27:48]]), and John says He spoke of His thirst “that the scripture might be fulfilled” ([[John 19:28]]).

  These lines share the psalm’s own subject: one who bears shame because he is loyal to God. The psalm’s ending has been compared with the ending of Psalm 22. There “The meek shall eat and be satisfied,” and “your heart shall live for ever” ([[Ps. 22:26]]); here the humble see and are glad, and “your heart shall live that seek God.”

explore: |
  - **The companion lament.** [[Ps. 22]], read with this psalm’s ending (verses 30–36) beside its own ([[Ps. 22:22–31]]).
  - **The servant smitten of God.** [[Isa. 53:3–5]], for the words this psalm shares with it in verse 26.
  - **Where Paul takes the curse.** [[Rom. 11:7–27]], from “the rest were blinded” to “all Israel shall be saved.”
  - **The zeal at the temple.** [[John 2:13–17]], the scene in which the disciples remembered verse 9.
  - **The miry clay.** [[Ps. 40:2]], where a speaker has been brought up “out of the miry clay.”

parallels:
  - ref: John 15:25
    note: Jesus says the words “They hated me without a cause” are fulfilled in Him; they stand in verse 4 and in Psalm 35:19.
  - ref: John 2:17
    note: The disciples remember the first half of verse 9 when Jesus clears the temple.
  - ref: Rom. 15:3
    note: Paul quotes the second half of verse 9 of Christ, who “pleased not himself.”
  - ref: John 19:28–29
    note: Jesus says “I thirst” so that the scripture may be fulfilled, and is given vinegar; Matthew 27:34 has the vinegar mingled with gall.
  - ref: Rom. 11:9–10
    note: Paul quotes verses 22–23 as David’s words about the blindness of part of Israel.
  - ref: Acts 1:20
    note: Peter applies verse 25 to Judas and joins Psalm 109:8 to it.
  - ref: Isa. 53:4
    note: The servant is thought “smitten of God”; the verb and the noun for pain are those of verse 26.

