chapter: 145
title: Good to All
tagline: One man promises to bless his God and King every day, hands the song to the generations, and gives the reason all flesh can sing it, that the LORD is good to all.
when: 'By its title, David’s; no occasion is given'

setting: |
  The title ascribes the psalm to David and names no occasion, and the psalm supplies none. No enemy is in view and nothing is asked for. One line of judgment, in verse 20, is its only shadow.

  It is the last psalm in the book that has a title, and so the last that carries David’s name. The five that follow have no titles, and each begins and ends with “Praise ye the LORD.” Psalm 145 comes just before that closing group, and its last verse, “let all flesh bless his holy name,” is close to the book’s last verse: “Let every thing that hath breath praise the LORD” ([[Ps. 150:6]]).

  In Hebrew it is an acrostic, the device explained at [[Ps. 9:1]]: its verses “begin with the successive letters of the Hebrew alphabet.” One letter has no verse, and the second note on verse 13 takes that up.

  Much of the psalm is shared with other scripture. Verse 8 repeats what the LORD said of Himself to Moses at Sinai ([[Ex. 34:6]]); the note on [[Ps. 86:15]] sets the two side by side. Verses 15–16 are close to [[Ps. 104:27–28]]. Verse 13 is nearly the confession Daniel records from Nebuchadnezzar ([[Dan. 4:3]]). And Nephi ends the first chapter of his record with the “tender mercies” of verse 9 ([[1 Ne. 1:20]]).

thread: |
  Psalm 145 is **one voice’s praise handed on until all flesh is asked to sing it, and the reason it can be handed to everyone is that the King is good to everyone**. It does not turn, as a lament does. It widens.

  It begins with “I”: “I will extol thee, my God, O king,” every day and for ever. Verse 3 then says that the greatness he means to praise “is unsearchable.” The verses that follow do not try to measure it. They report what He has done: works, mighty acts, wondrous works, terrible acts, great goodness. The telling passes back and forth between “I” and “they,” one generation to another (verses 4–7).

  Verse 8 gives what they tell in God’s own words, the sentence from Sinai, and verse 9 stretches it: “The LORD is good to all.” From here the words “all” and “every” hardly leave the page; the King James has them fifteen times in the last thirteen verses. All His works praise Him, and His saints speak of His kingdom so that “the sons of men” may know of it (verses 10–13).

  Then the psalm shows what kind of king this is. He holds up those who fall, feeds every living thing from an open hand, and is near to those who call (verses 14–18). The last verses name those He hears and keeps, and say that the wicked He will destroy (verses 19–20). The psalm ends where it began, with one mouth, and then gives the song away: “let all flesh bless his holy name for ever and ever.”

sections:
  - range: 1-3
    heading: Every day will I bless thee
    plain: |
      I will lift You high, my God, the King, and bless Your name for ever and ever. Every day I will bless You, and I will praise Your name for ever and ever. The LORD is great and greatly to be praised, and no one can search out His greatness.
  - range: 4-7
    heading: One generation to another
    plain: |
      One generation will praise Your works to the next and tell of Your mighty acts. I will speak of the glorious honor of Your majesty and of Your wonders. People will speak of the might of Your fearsome acts, and I will tell of Your greatness. They will pour out the memory of Your great goodness and sing of Your righteousness.
  - range: 8-13
    heading: Good to all, and a kingdom for ever
    plain: |
      The LORD is gracious and full of compassion, slow to anger and great in mercy. The LORD is good to all, and His tender mercies are over everything He has made. All Your works will praise You, LORD, and Your saints will bless You. They will speak of the glory of Your kingdom and talk of Your power, to make known to the sons of men His mighty acts and the glorious majesty of His kingdom. Your kingdom is an everlasting kingdom, and Your rule lasts through every generation.
  - range: 14-16
    heading: The open hand
    plain: |
      The LORD holds up all who fall and raises all who are bowed down. The eyes of all look to You, and You give them their food when it is due. You open Your hand and satisfy the desire of every living thing.
  - range: 17-21
    heading: Nigh unto all that call upon him
    plain: |
      The LORD is righteous in all His ways and holy in all His works. The LORD is near to all who call on Him, to all who call on Him in truth. He will fulfil the desire of those who fear Him; He will hear their cry and save them. The LORD keeps all who love Him, but all the wicked He will destroy. My mouth will speak the praise of the LORD, and let all flesh bless His holy name for ever and ever.

notes:
  - ref: 0
    phrase: Psalm of praise
    kind: words
    title: A title no other psalm has
    body: |
      The title’s “Psalm of praise” is one Hebrew word, *tehillah*, and this is the only psalm headed with it. The word is common inside the psalms, but its use “as title,” in the sense “praise-song,” is recorded for this psalm alone. The King James heads [[Ps. 100]] with nearly the same English words. The Hebrew there is a different word, thanksgiving, which the note on that psalm’s title explains.

      The plural of the word became the later Hebrew name for the whole book of Psalms (see [[Ps. 150:6]]).
    sources: [lds-scriptures, oshb-wlc, bdb]

  - ref: 9
    phrase: his tender mercies are over all his works
    kind: scripture
    title: Tender mercies, in Nephi’s first chapter and in an apostle’s sermon
    body: |
      Nephi ends the first chapter of his record with this verse’s words, and where the psalm says “all his works” he names those who have faith: “the tender mercies of the Lord are over all those whom he hath chosen, because of their faith, to make them mighty even unto the power of deliverance” ([[1 Ne. 1:20]]).

      Five allusions to this psalm have been counted in the Book of Mormon, more than to any other psalm, with its text “utilized by Nephi, Jacob, Alma, and Ammon.” They are short phrases held in common, such as Jacob’s God who counsels “in great mercy, over all his works” ([[Jacob 4:10]]), and they are offered as allusions.

      Elder David A. Bednar spoke on Nephi’s sentence in general conference and quoted the psalm’s verse near the end of the address. He described the Lord’s tender mercies as “very personal and individualized” blessings and gifts that come from the Savior. On Nephi’s word “chosen,” he taught that “God does not have a list of favorites,” and that “we become God’s chosen and invite His tender mercies as we use our agency to choose God.” He testified that the mercies “are available to all of us.”
    sources: [lds-scriptures, hilton-psalms-bom, bednar-tender-mercies]

  - ref: 13
    phrase: Thy kingdom is an everlasting kingdom
    kind: scripture
    title: The words a king of Babylon says twice
    body: |
      The psalm’s confession of the kingdom is one that Daniel records from Nebuchadnezzar, in nearly the same words. The king’s proclamation opens, “his kingdom is an everlasting kingdom, and his dominion is from generation to generation” ([[Dan. 4:3]]). After he had been driven from men and had his reason restored, he blessed the Most High, “whose dominion is an everlasting dominion, and his kingdom is from generation to generation” ([[Dan. 4:34]]).

      In the psalm the sentence is the end of a short passage about the kingdom. The singer has called God “king” in verse 1. In verses 11–13 “kingdom” comes four times: the saints speak of its glory, they do so “to make known to the sons of men” its majesty, and verse 13 says how long it lasts.
    sources: [lds-scriptures]

  - ref: 13
    phrase: throughout all generations
    kind: history
    title: The missing letter, and the line other Bibles add here
    body: |
      Between verses 13 and 14 the Hebrew alphabet skips a letter, and some Bibles print a line here that the King James does not have. The psalm is an acrostic (see [[Ps. 9:1]]). Each verse begins with the next letter in order, but “the distich Nun is wanting”: the letter *nun* (n) has no verse, and the gap falls after verse 13.

      The ancient Greek translation has a line at exactly this point: “The Lord is faithful in his words, and holy in all his works.” The Hebrew word for “faithful” that would stand behind it begins with the missing letter. A modern translation prints the line as the second half of verse 13, where the LORD “is faithful in all his words” and “gracious in all his deeds,” and another gives its evidence in a footnote: “One manuscript of the Masoretic Text, Dead Sea Scrolls and Syriac,” with the Greek, while “most manuscripts of the Masoretic Text,” the traditional Hebrew text, do not have it.

      Whether the line was lost from the Hebrew or supplied later to fill the gap is not settled. One older reading observes that the Greek line is verse 17 over again “with the change only of two words,” and sees in the gap “an example of that freedom with which the Old Testament poets are wont to handle this kind of forms.” It reports others who think the verse “has been lost.” Either way the reader of the King James misses no thought of the psalm. What the added line says, verse 17 says.
    sources: [lxx-rahlfs, nrsvue, niv, delitzsch-psalms]

  - ref: 16
    phrase: Thou openest thine hand
    kind: symbol
    title: Every creature fed from one hand
    body: |
      The picture is of every living thing looking to one hand for its food. “Meat” is food of any kind (see the note on [[Ps. 111:4]]); a modern translation has “you give them their food in due season.”

      The lines are close to another psalm’s. “These wait all upon thee; that thou mayest give them their meat in due season” ([[Ps. 104:27]]), and “thou openest thine hand, they are filled with good” ([[Ps. 104:28]]). Psalm 104 says it in a song about the creation. Here the lines come between holding up “all that fall” and being “nigh unto all them that call upon him.”
    sources: [lds-scriptures, nrsvue]

  - ref: 20
    phrase: but all the wicked will he destroy
    kind: scripture
    title: The one dark line, and who the last “all” are
    body: |
      The psalm’s only word of judgment comes in its next-to-last verse, and the verses before it name those the LORD hears and keeps. Verse 18 repeats itself in order to add two words. The LORD is near “to all that call upon him,” and then “to all that call upon him in truth.” One older reading takes “in truth” of prayer that “comes from their heart,” as against the hypocrites, whose “heart remains far from Him.” Verse 19 names “them that fear him” and verse 20 “them that love him,” and on the same reading these are one company under two names.

      Only then does the psalm say “all the wicked.” Nephi has the line’s own words: “the wicked will he destroy; and he will spare his people” ([[2 Ne. 30:10]]), which has been counted among the Book of Mormon’s allusions to this psalm.

      The psalm does not stop on the line. Verse 21 opens the invitation again, to “all flesh.”
    sources: [lds-scriptures, delitzsch-psalms, hilton-psalms-bom]

christ: |
  The King of this psalm is the Savior: “LORD” stands for the name Jehovah, and Jehovah is Jesus Christ before His birth (see [[Ps. 110:1]]).

  The tender mercies of verse 9 are His. In the address quoted in the note on that verse, Elder Bednar taught that they are received “from and because of and through the Lord Jesus Christ.”

explore: |
  - **The sentence behind verse 8.** [[Ex. 34:5–9]], and the other psalms that repeat it: [[Ps. 86:15]] and [[Ps. 103:8]].
  - **The same kingdom, confessed in Babylon.** [[Dan. 4:3]] and [[Dan. 4:34]], where Nebuchadnezzar says nearly the words of verse 13.
  - **The open hand.** [[Ps. 104:27–28]].
  - **Tender mercies.** [[1 Ne. 1:20]], and Elder David A. Bednar, “The Tender Mercies of the Lord” (April 2005 general conference).
  - **Where the psalm leads.** [[Ps. 146]]–150, the five psalms of “Praise ye the LORD” that close the book.

parallels:
  - ref: Ex. 34:6
    note: The LORD proclaims His name to Moses; verse 8 repeats the words.
  - ref: Dan. 4:3
    note: Nebuchadnezzar confesses the everlasting kingdom in nearly the words of verse 13, and again in Dan. 4:34.
  - ref: Ps. 104:27–28
    note: All creatures wait on God for their food, and He opens His hand, as in verses 15–16.
  - ref: 1 Ne. 1:20
    note: Nephi says the Lord’s tender mercies are “over all those whom he hath chosen, because of their faith.”
  - ref: Ps. 150:6
    note: The book’s last verse asks of every thing that has breath what verse 21 asks of all flesh.

sources: [lds-scriptures, gs-jehovah, hilton-psalms-bom, bednar-tender-mercies, oshb-wlc, bdb, lxx-rahlfs, nrsvue, niv, delitzsch-psalms]
