chapter: 28
title: Be Not Silent to Me
tagline: A man lifts his hands toward the inner sanctuary and begs not to be dragged off with the wicked; then he blesses the LORD for hearing, and asks Him to shepherd and carry His people.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  Psalm 28 stands in Book One of the Psalms, in a run of seven psalms (25–31) that are all ascribed to David. Its title gives no occasion.

  It is a lament of one person, the kind of psalm described at [[Ps. 22:1]], and a short one: “a petition to the Lord to hear his prayers and an acknowledgement that God has answered those prayers.” The speaker fears becoming “like them that go down into the pit,” and the danger has to do with “the wicked,” men who speak peace and mean harm. He does not say who they are. One older reading sets this psalm and the two before it in the time of Absalom’s revolt, the flight from Jerusalem told in [[2 Sam. 15:13–14]]; the psalm itself does not say so.

  Verse 8 names “his anointed,” Israel’s king, and verse 9 prays for the whole people. The psalm that follows closes with the same things promised that this one asks for, strength and blessing for the LORD’s people ([[Ps. 29:11]]), and that likeness has been given as the reason the two stand together.

  The note on verse 7 gives the lines of this psalm that have been set beside the psalm of Nephi ([[2 Ne. 4:16–35]]).

thread: |
  Psalm 28 is a prayer and its answer.

  In the first half the speaker cries toward the LORD’s sanctuary with his hands lifted (verses 1–2). What he fears is silence. If the LORD does not answer, he will be like the dead, and he asks not to be dragged off with the wicked (verse 3). He asks that they be given “the work of their hands,” because they pay no attention to the work of the LORD’s hands (verses 4–5).

  The turn is verse 6. “Blessed be the LORD, because he hath heard the voice of my supplications” answers the plea of verse 2 in its own words. The psalm does not say what happened between the two verses.

  After the turn the prayer widens. “My strength” (verse 7) becomes “their strength” (verse 8), and the last verse asks nothing for the speaker at all. Its final request, “lift them up,” uses the verb of verse 2, where the speaker lifted his hands.

sections:
  - range: 1-2
    heading: Be not silent
    plain: |
      To You I call, O LORD my rock; do not be silent toward me. If You are silent, I will be like those who go down to the pit. Hear the sound of my pleading when I cry to You for help, when I lift my hands toward Your innermost sanctuary.
  - range: 3-5
    heading: Not with the wicked
    plain: |
      Do not drag me away with the wicked, with those who do wrong, who speak peace to their neighbors while harm is in their hearts. Give them what their deeds deserve, what the evil they have done deserves; give them what their hands have made; pay them their due. Because they pay no attention to what the LORD does, to the work of His hands, He will pull them down and not build them up.
  - range: 6-7
    heading: He hath heard
    plain: |
      Blessed be the LORD, for He has heard the sound of my pleading. The LORD is my strength and my shield; my heart trusted in Him, and I was helped. So my heart is full of joy, and with my song I will praise Him.
  - range: 8-9
    heading: Save thy people
    plain: |
      The LORD is their strength, a saving refuge for His anointed. Save Your people and bless Your inheritance; be their shepherd and carry them for ever.

notes:
  - ref: 1
    phrase: be not silent to me
    kind: words
    title: A silence that would be death
    body: |
      The speaker fears one thing first, that the LORD will not answer, and he says that silence would leave him like the dead. The verb behind the first “silent” means to “be silent, dumb, speechless,” and in this verse, with the LORD as its subject, to “be deaf”; a modern translation has “do not refuse to hear me.”

      What would follow is the pit. In poetry the word is the “pit of the grave,” and “them that go down into the pit” is a set phrase for the dead. In other verses it stands beside Sheol, the place of the dead, which is explained at [[Ps. 6:5]].
    sources: [bdb, nrsvue]

  - ref: 2
    phrase: thy holy oracle
    kind: words
    title: The oracle is a room, not a message
    body: |
      “Oracle” here names a place, the innermost room of the sanctuary, and not a revelation. The Hebrew word is *debir*, the “hindmost chamber, innermost room” of the temple, the holy of holies, “the place of the ark and the cherubic images, the throne-room” of the LORD. In Kings it is the room Solomon made for the ark: “the oracle he prepared in the house within, to set there the ark of the covenant of the LORD” ([[1 Kgs. 6:19]]).

      The English word came through the Latin Bible’s *oraculum*, “on the incorrect theory” that *debir* comes from the Hebrew verb for speaking; the word seems instead to mean the part behind. In English of Joseph Smith’s day “oracle” could still mean “the sanctuary or most holy place in the temple.” The same word in the plural meant God’s “communications, revelations or messages,” and that is its sense in this line of the Doctrine and Covenants: “through you shall the oracles be given to another, yea, even unto the church” ([[D&C 90:4]]). The psalm has the first sense. A modern translation prints “your most holy sanctuary,” and the ancient Greek “thy holy temple.”

      This is the word’s only use in the Psalms. Everywhere else it describes Solomon’s temple; on the sanctuary of David’s own day, see the note on [[Ps. 5:7]].
    sources: [bdb, lds-scriptures, webster-1828, nrsvue, lxx-rahlfs, oshb-wlc]

  - ref: 2
    phrase: lift up my hands
    kind: symbol
    title: Hands raised toward the place of the ark
    body: |
      Lifting the hands in prayer is recorded many times in scripture, “most often in connection to the first temple in Jerusalem.” Solomon’s dedicatory prayer expects anyone in trouble to “spread forth his hands toward this house” ([[1 Kgs. 8:38]]).

      What the gesture meant has been read several ways. Exposing the hands and heart may have shown the worshipper pure and “able to stand in the presence of the Lord”; other readings are “showing one’s surrender before God, expressing one’s humility and desire to serve God, and requesting a specific blessing.” These “interpretations are not mutually exclusive.”

      In this psalm the hands are lifted toward the innermost room, where the ark stood (see the note on “thy holy oracle”).
    sources: [sc-knowhy-638, lds-scriptures]

  - ref: 3
    phrase: Draw me not away with the wicked
    kind: words
    title: Dragged off with the wicked
    body: |
      The speaker asks not to be dragged off with the wicked to their doom. The verb means to draw or drag, and here, with the LORD as the one who does it, to “lead or drag off (to doom).” A modern translation has “Do not drag me away with the wicked,” and the ancient Greek adds a second verb, “destroy me not.”

      Another psalm of this group makes the same request in other words: “Gather not my soul with sinners, nor my life with bloody men” ([[Ps. 26:9]]).
    sources: [bdb, nrsvue, lxx-rahlfs]

  - ref: 4
    phrase: give them after the work of their hands
    kind: words
    title: Their hands’ work and His
    body: |
      The request that the wicked be repaid is measured by their own deeds, and the next verse sets those deeds against the LORD’s in the same words. Verse 4 asks that they receive “the work of their hands.” Verse 5 gives the reason: they “regard not the works of the LORD, nor the operation of his hands.” In Hebrew “work” and “operation” are one noun, and the phrase is the same in both verses. The King James varies its English; a modern translation keeps “the work of their hands” and “the work of his hands,” and the ancient Greek has “works” in both places.

      This is one of the places where a psalm asks God to punish. The speaker asks the LORD to act and does nothing himself. The full note on such prayers is at [[Ps. 137:8]].
    sources: [oshb-wlc, nrsvue, lxx-rahlfs]

  - ref: 5
    phrase: he shall destroy them, and not build them up
    kind: scripture
    title: Pulled down and not built
    body: |
      The verse ends the plea with a statement instead of a request: “he shall destroy them, and not build them up,” or in a modern translation, “he will break them down and build them up no more.”

      The same two Hebrew verbs stand side by side in Jeremiah’s commission, “to throw down, to build, and to plant” ([[Jer. 1:10]]). In Jeremiah the pulling down is followed by building. Here it is not. [To Root Out and to Plant](/jeremiah/themes/root-and-plant/) follows those verbs through that book.

      One older reading, which takes the psalm of Absalom’s revolt, hears an answer to the promise made to David, “I will build thee an house” ([[2 Sam. 7:27]]): the rebels “shall experience the very reverse of the divine promise given to David.” That depends on a setting the title does not give.
    sources: [oshb-wlc, nrsvue, delitzsch-psalms]

  - ref: 6
    phrase: he hath heard the voice of my supplications
    kind: structure
    title: The plea of verse 2, answered in its own words
    body: |
      Verse 6 is the psalm’s turn, and it is made by repeating verse 2 with one change. There the speaker asked, “Hear the voice of my supplications.” Here he says the LORD “hath heard the voice of my supplications.” The Hebrew nouns are the same, and the verb has moved from a command to a completed act.

      The psalm does not say what came between. No rescue is told, and the wicked are not mentioned again. One older reading sees that “the first half of the Psalm prayed for deliverance and for judgment; this second half gives thanks for both,” and offers two explanations: either “the certainty of being answered dawns upon him” as he prays, or he “added this second part later on, as a memorial of the answer he experienced.” It judges that the words sound “like the record of something that has actually taken place.”

      Other laments turn in the same unexplained way; see the note on [[Ps. 22:21]].
    sources: [oshb-wlc, delitzsch-psalms]

  - ref: 7
    phrase: my heart trusted in him, and I am helped
    kind: scripture
    title: Lines set beside the psalm of Nephi
    body: |
      Several lines of this psalm have been set beside the psalm of Nephi. On the proposal that Psalms 25–31 may have influenced him as he wrote, and how far it claims to go, see the note on [[Ps. 25:17]].

      The lines set beside Psalm 28 are these. The LORD “hath heard the voice of my supplications” (verse 6), and Nephi writes, “he hath heard my cry” ([[2 Ne. 4:23]]). “My heart trusted in him,” and Nephi: “O Lord, I have trusted in thee, and I will trust in thee forever” ([[2 Ne. 4:34]]). “My heart greatly rejoiceth,” and Nephi: “Rejoice, O my heart” ([[2 Ne. 4:28]]). The psalm opens by calling on “my rock,” and Nephi closes by calling on “my rock and mine everlasting God” ([[2 Ne. 4:35]]). His “my rock” is “phrasing that is almost taken directly from Psalms,” and verse 1 is one of the psalm verses listed behind it.

      Part of the case is how such phrases gather in neighbouring psalms: “my heart,” which Nephi uses nine times, runs through four of these psalms in a row, which happens nowhere else in the Psalms.
    sources: [alford-baker-psalm-nephi, hilton-psalms-bom]

  - ref: 8
    phrase: their strength
    kind: words
    title: Whose strength
    body: |
      “Their” has no noun before it to refer to, and it has been taken to mean the LORD’s people, Israel. The Hebrew says only “to them.” The ancient Greek reads “the strength of his people,” which in Hebrew differs by a single letter and is the wording of the next psalm’s last verse ([[Ps. 29:11]]); a modern translation reads the same. The Hebrew as it stands has been taken in the same sense.

      Either way the verse joins two parties. The LORD is strength to the people and a “saving strength,” a saving refuge, to “his anointed.” That word is *mashiach*, and in the Psalms it means first Israel’s anointed king (see the note on [[Ps. 2:2]]). The speaker of verse 7 said “my strength.” If he is the king, as the title’s ascription to David suggests, he now speaks of himself by his office, and one older reading explains why the people come first: he is “the head of Israel. For this very reason his deliverance is the deliverance of Israel.”
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, delitzsch-psalms]

  - ref: 9
    phrase: feed them also, and lift them up for ever
    kind: symbol
    title: Shepherd them and carry them
    body: |
      The psalm’s last request is a shepherd’s work: tend the flock and carry it. “Feed” is the Hebrew verb for shepherding, and “lift them up” is the verb for carrying, so that a modern translation has “be their shepherd and carry them forever.”

      Isaiah has both verbs in one picture: “He shall feed his flock like a shepherd: he shall gather the lambs with his arm, and carry them in his bosom” ([[Isa. 40:11]]). And of the LORD’s care for Israel in the past, “he bare them, and carried them all the days of old” ([[Isa. 63:9]]), where “carried” is this verse’s verb in the same form.

      On the LORD as shepherd, see the note on [[Ps. 23:1]], and [One Shepherd](/ezekiel/themes/one-shepherd/) for the image in the prophets.
    sources: [oshb-wlc, nrsvue, lds-scriptures]

christ: |
  The LORD of this psalm is asked to shepherd His people and carry them for ever. Jesus took that work as His own: “I am the good shepherd: the good shepherd giveth his life for the sheep” ([[John 10:11]]). The note on [[Ps. 23:1]] gives how He claimed the title that the Psalms give to Jehovah.

  Verse 8 calls the LORD the saving refuge of “his anointed.” In the psalm that is Israel’s king. The word is the one that comes into English as Messiah, and the note on [[Ps. 2:2]] follows it from the king in Jerusalem to Jesus Christ.

explore: |
  - **Praying toward the house.** Solomon’s prayer at the dedication, [[1 Kgs. 8:28–30]] and [[1 Kgs. 8:38–39]].
  - **Nephi’s psalm.** [[2 Ne. 4:16–35]], read with Kenneth L. Alford and D. Bryce Baker, “Parallels between Psalms 25–31 and the Psalm of Nephi,” in *Ascending the Mountain of the Lord* (2013), which lists the shared phrases psalm by psalm.

parallels:
  - ref: 1 Kgs. 8:38–39
    note: Solomon asks the LORD to hear anyone who spreads his hands toward the house.
  - ref: Ps. 26:9
    note: The same plea not to be gathered up with sinners.
  - ref: Jer. 1:10
    note: The two verbs of verse 5, throwing down and building.
  - ref: Isa. 40:11
    note: The LORD feeds His flock like a shepherd and carries the lambs, the two verbs of verse 9.
  - ref: 2 Ne. 4:34–35
    note: Nephi’s psalm ends on trust and “my rock,” lines that have been set beside this psalm.

