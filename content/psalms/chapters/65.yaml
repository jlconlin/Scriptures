chapter: 65
title: Thou Crownest the Year
tagline: A song from Zion that praises God in three widening circles, as the one who hears prayer and atones for sin, who stills the seas and the nations, and who waters the furrows until the valleys stand thick with grain.
when: 'Undated; a psalm of David by its title'

setting: |
  The title ascribes the psalm to David and names no occasion.

  It is a psalm of praise, one of the group that “often begin with a command or call to Israel to gather as a community (most importantly, at the temple) and praise the Lord,” and that “are now thought to mark times of national festival gatherings.” The psalm itself is spoken in Zion, in God’s courts, by a people who say “we” and “us” (verses 1, 4–5).

  The last verses give the season. The rain has fallen on the ploughed ground, the pastures carry flocks and the valleys grain, and nothing is said of reaping. One older reading therefore hears “the congregation gathered around the sanctuary on Zion” while the harvest “is not yet housed,” and so nearer to Passover and Pentecost, “both festivals belonging to the beginning of the harvest,” than to the feast of Tabernacles, the thanksgiving when it is in. In that land rain begins in October, and the “latter rain” comes in March and April. The psalm does not name a feast.

  Verse 7 says of God what the Gospels tell of Jesus on the Sea of Galilee (see the first note on verse 7).

thread: |
  Psalm 65 praises God in three places, each wider or nearer than the last, and **in all three He is the one who acts**. In the King James text it asks for nothing. Almost every sentence is “thou.”

  It begins in Zion (verses 1–4). There God is addressed by a title, “thou that hearest prayer,” and the first thing He does is deal with sin: iniquities are too strong for the speaker, and God Himself will “purge them away.” Only then comes the blessing of the one God chooses and brings near, and the good of His house. One older reading says why the psalm starts with sin: of all that the Hearer of prayer answers, “Before all else it is the prayer for the forgiveness of sin which He graciously answers.”

  Verse 5 turns outward. The God who hears prayer in verse 2 now “wilt answer us,” and the answer is as wide as the world: He is the confidence of “all the ends of the earth.” He sets the mountains fast, and with one verb He stills the roar of the seas and the tumult of the peoples (verses 6–7). The far ends of the earth see His signs and are afraid, and east and west rejoice (verse 8).

  Verse 9 turns again, from the ends of the earth to the ground underfoot: “Thou visitest the earth, and waterest it.” The rest is one year of farming with God doing each task, watering, settling the furrows, softening the soil, blessing the growth, until the year is crowned and the hills and valleys are dressed in flocks and grain (verses 9–13).

  The same reading puts the join between the middle and the end this way: God’s “rule in human history and His rule in nature are … reflected the one in the other.” On that reading the hand seen in the stilled nations and in the watered field is the hand of the one who answers prayer and forgives sin.

sections:
  - range: 1-4
    heading: In Zion, the God who hears prayer
    plain: |
      Praise waits for You in Zion, God, and the vow made to You will be paid. You who hear prayer, all humankind will come to You. Wrongdoings have been too strong for me; our transgressions, You Yourself will atone for them. Happy is the one You choose and bring near to live in Your courts. We will be filled with the good of Your house, Your holy temple.
  - range: 5-8
    heading: To the ends of the earth, the God who stills the seas
    plain: |
      With awe-inspiring deeds You answer us in righteousness, God of our salvation, You in whom all the ends of the earth and the farthest seas put their trust. By Your strength You set the mountains firm; You are girded with might. You still the roar of the seas, the roar of their waves, and the uproar of the peoples. Those who live at the far ends of the earth are in awe at Your signs. You make the east and the west, where morning and evening come forth, shout for joy.
  - range: 9-13
    heading: In the field, the God who crowns the year
    plain: |
      You visit the earth and water it; You make it very rich. The channel of God is full of water. You provide the people’s grain, for so You have prepared the land. You soak its furrows and settle its ridges, soften it with showers and bless what sprouts. You crown the year with Your goodness, and Your wagon tracks drip with richness. The pastures of the wilderness drip with it, and the hills wrap themselves in joy. The meadows are clothed with flocks and the valleys covered with grain. They shout for joy; they sing.

notes:
  - ref: 1
    phrase: Praise waiteth for thee
    kind: words
    title: Praise that waits, or praise that is due
    body: |
      The Hebrew word behind “waiteth” is a noun that means “silence, still waiting, repose,” and the King James’s “waiteth” keeps that sense. As the Hebrew text stands, the same word is behind “Truly my soul waiteth upon God” ([[Ps. 62:1]]).

      The ancient Greek translation has instead “Praise becomes thee, O God, in Sion,” and a modern translation follows them with “Praise is due to you.” Both readings have their defenders. In either reading the second half of the line is the same: the vow is paid to God.

      “Sion” is the King James’s spelling here of the Hebrew word it elsewhere writes “Zion” ([[Ps. 2:6]]).
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue]
  - ref: 3
    phrase: thou shalt purge them away
    kind: words
    title: God Himself atones
    body: |
      “Purge” translates the Old Testament’s verb for atonement, and here God is the one who does it. It is the verb of the Day of Atonement, when “on that day shall the priest make an atonement for you, to cleanse you” ([[Lev. 16:30]]). In this verse no priest and no sacrifice is named. The verse belongs with the passages where God is the subject of the verb and sin its object, and of these it has been observed: “It is conceived that God in his sovereignty may himself provide an atonement or covering for men and their sins which could not be provided by men.”

      The Hebrew has a separate pronoun before the verb: “our transgressions, *thou* shalt purge them.” The first half of the verse has the speaker confess that his iniquities “prevail against” him.
    sources: [oshb-wlc, bdb, lds-scriptures]
  - ref: 4
    phrase: whom thou choosest, and causest to approach unto thee
    kind: words
    title: Chosen and brought near
    body: |
      The psalm does not say who “the man” is whom God chooses and brings near; one older reading takes him to be the whole worshipping people. The Hebrew verb is in the form that means to “cause to approach, bring near,” so the coming near is God’s doing. The blessing does not stay with one person, since the verse goes straight on in the plural: “*we* shall be satisfied with the goodness of thy house.” That reading accordingly says of the choosing and bringing near: “The congregation gathered around Zion is esteemed worthy of this distinction among the nations of the earth.”

      Who may go up to the Lord’s house is asked outright at [[Ps. 24:3]], and the question is taken up there.
    sources: [oshb-wlc, bdb, delitzsch-psalms]
  - ref: 5
    phrase: By terrible things in righteousness
    kind: words
    title: Terrible means awe-inspiring
    body: |
      “Terrible things” are deeds that fill people with awe, and the line says they are how God answers prayer. The Hebrew word comes from the verb to fear, in a form used of God and His acts that means to “cause astonishment and awe”; a modern translation has “By awesome deeds you answer us with deliverance.”

      Verse 2 called God the one who hears prayer; here the people say how He answers. The same fear returns in verse 8, where those at the ends of the earth “are afraid at thy tokens,” that is, in awe at His signs.
    sources: [oshb-wlc, bdb, nrsvue]
  - ref: 7
    phrase: Which stilleth the noise of the seas
    kind: christ
    title: The one who stills the sea
    body: |
      The psalm gives the stilling of the sea as something God does, and the Gospels tell of Jesus doing it. Caught in a storm on the Sea of Galilee, He “rebuked the winds and the sea; and there was a great calm” ([[Matt. 8:26]]). In Mark He speaks to the water directly: “Peace, be still” ([[Mark 4:39]]). The disciples’ question follows: “What manner of man is this, that even the winds and the sea obey him!” ([[Matt. 8:27]]).

      The Psalms say whose work this is. This verb of stilling is found in one other psalm, again of the sea and again of God: “when the waves thereof arise, thou stillest them” ([[Ps. 89:9]]). Jehovah is the name of “the God of Israel,” and “Jehovah is the premortal Jesus Christ.”
    sources: [lds-scriptures, bdb, gs-jehovah]
  - ref: 7
    phrase: the tumult of the people
    kind: symbol
    title: The sea and the nations
    body: |
      The verse sets the roaring sea beside the nations in uproar and says God quiets both. One participle governs three objects: the noise of the seas, the noise of their waves, and “the tumult of the people,” where the Hebrew noun is plural, “peoples.”

      In Isaiah the nations “make a noise like the noise of the seas” ([[Isa. 17:12]]), “but God shall rebuke them, and they shall flee far off” ([[Isa. 17:13]]). One older reading joins the two passages and takes the sea of this verse as a figure for the nations: “The roaring of the billows and the wild tumult of the nations as a mass in the empire of the world, both are stilled by the threatening of the God of Israel.”
    sources: [oshb-wlc, lds-scriptures, delitzsch-psalms, nrsvue]
  - ref: 9
    phrase: the river of God
    kind: symbol
    title: God’s channel, full of water
    body: |
      The “river of God” is a poetic name for the source of the rain, pictured as a water channel. The Hebrew word is not the usual word for a river. It means a “(cleft) channel, (artificial) canal,” and it is used here as “poetic of channel for rain.” Job has a similar picture, where God asks, “Who hath divided a watercourse for the overflowing of waters” ([[Job 38:25]]). In the psalm the channel is full, and the next verse has its water on the ridges and furrows as showers.

      The same word, in the plural, is the “streams” that make glad the city of God in [[Ps. 46:4]], and the “rivers of water” by which the tree of [[Ps. 1:3]] is planted.
    sources: [oshb-wlc, bdb, lds-scriptures]
  - ref: 11
    phrase: thy paths drop fatness
    kind: words
    title: Wagon tracks that drip with plenty
    body: |
      God’s “paths” are the tracks left by a wagon, and “fatness” is the richness of a fertile land. The Hebrew word for the paths is properly a “wagon-track,” and a modern translation prints it so: “your wagon tracks overflow with richness.” “Fatness” is the word for “fatness, abundance, luxuriance, oil,” used in this verse of fertility.

      The tracks are those God Himself travels, and the line is “figurative of richly-laden cart dropping its contents in its track.” The next verse carries it past the farmland: “They drop upon the pastures of the wilderness.”
    sources: [oshb-wlc, bdb, nrsvue]
  - ref: 13
    phrase: they shout for joy, they also sing
    kind: words
    title: Who shouts and sings
    body: |
      The psalm’s last line does not say who “they” are, and it has been read two ways. The nearest nouns are the pastures and the valleys, and a modern translation lets them be the singers: the meadows “clothe themselves with flocks,” the valleys “deck themselves with grain,” and “they shout and sing together for joy.” One older reading holds instead that fields cannot be said to sing: “The expression requires men to be the subject, and refers to men in the widest and most general sense.”

      The same older reading says of the closing words that they speak of shouting and singing, “locking themselves as it were with the beginning of the Psalm together,” which opens with praise in Zion. The title has the word as well: it calls the poem both a psalm and a song, two different Hebrew words, and the last word of the psalm is the verb from which “song” comes: “they sing.”
    sources: [oshb-wlc, bdb, nrsvue, delitzsch-psalms]

christ: |
  The psalm speaks to the “God of our salvation.” Jehovah is the name of the God of Israel, and Jehovah is Jesus Christ. Two things the psalm says of its God stand out.

  The first is that He stills the sea. What verse 7 praises, the disciples watched from a boat, and asked, “What manner of man is this, that even the winds and the sea obey him!” ([[Matt. 8:27]]). The first note on verse 7 sets the two side by side.

  The second is that He atones. The speaker of verse 3 confesses that his iniquities prevail against him, and he says to God, “thou shalt purge them away.” The verb is the Old Testament’s word for atonement, and here it is God who provides what could not “be provided by men” (see the note on verse 3).

explore: |
  - **The storm on Galilee.** Read Mark’s account, [[Mark 4:35–41]], beside verse 7.
  - **The nations as a sea.** [[Isa. 17:12–14]] works out the picture of verse 7 at length.
  - **Who may come near.** [[Ps. 24:3]] asks who shall ascend the hill of the Lord and stand in His holy place.

parallels:
  - ref: Matt. 8:23–27
    note: Jesus rebukes the winds and the sea, and the disciples ask what manner of man He is (also Mark 4:35–41).
  - ref: Ps. 89:9
    note: The same Hebrew verb for stilling, again of the sea and of God.
  - ref: Isa. 17:12–13
    note: The nations roar like the seas and God rebukes them.
  - ref: Ps. 62:1
    note: The King James’s “waiteth” stands for the same Hebrew word as in verse 1.

sources: [lds-scriptures, oshb-wlc, bdb, lxx-rahlfs, nrsvue, delitzsch-psalms, hopkin-psalms-sung, bd-rain, gs-jehovah]
