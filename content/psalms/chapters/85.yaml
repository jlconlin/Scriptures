chapter: 85
title: Mercy and Truth Are Met Together
tagline: A people once restored ask to be restored again, one voice stops to listen, and what it hears is peace, with truth coming up from the ground and righteousness leaning down from the sky.
when: 'Undated; it looks back on a restoration of Jacob and prays in a time that falls short of it'

setting: |
  Psalm 85 is one of the psalms that carry the name of the sons of Korah. The terms of its title are explained where they first appear: “To the chief Musician” at [[Ps. 8:1]] and the sons of Korah at [[Ps. 42:1]].

  It is a prayer of the whole people. They say “us” and “our” throughout, and one voice among them says “I” once, in verse 8.

  The psalm gives no date and names no enemy, no king and no city. What it shows is a people standing between two mercies. They look back on a time when the LORD restored Jacob, forgave His people and put away His anger (verses 1–3). They pray from a present in which that anger seems to go on (verses 4–7). One older reading, assuming a date after the exile, takes the restoration to be the return and the prayer to be that of the returned community, for whom the renewal promised with the return had not arrived; the note on verse 1 sets it out. The psalm does not say what the trouble is. The answer it hears includes a harvest (verse 12).

  The Church’s edition heads the psalm with the words “Truth will spring out of the earth (the Book of Mormon), and righteousness will look down from heaven.” The Lord’s words to Enoch have the same pair ([[Moses 7:62]]), and the psalm’s picture has been called one “exactly after Isaiah’s manner,” as where the skies pour down righteousness and the earth opens ([[Isa. 45:8]]).

thread: |
  Psalm 85 moves through **four steps: remembering, asking, listening, seeing**. Its turn is not from complaint to praise. It is from speaking to hearing.

  First the people remember (verses 1–3). Six verbs in a row tell what the LORD did, and they have been read as “a remembrance of former events”: He favoured, brought back, forgave, covered, took away, turned.

  Then they ask (verses 4–7). The request is built from the memory. The verb “turn” runs through the psalm five times in Hebrew: You turned Jacob’s captivity and turned from Your anger, so turn us, turn and give us life. The fifth use comes in the answer, as a warning that the people not turn back. The prayer ends by naming what it wants in two words, “thy mercy” and “thy salvation.”

  Then one voice stops asking: “I will hear what God the LORD will speak” (verse 8). A modern translation’s cross-references set beside it the prophet who said, “I will stand upon my watch, and set me upon the tower, and will watch to see what he will say unto me” ([[Hab. 2:1]]). The psalm does not quote God’s answer. The listener reports its substance in one word, peace.

  Last comes what the listener sees (verses 10–13). Both things asked for in verse 7 are there. Salvation is “nigh” (verse 9), and mercy arrives as a person, meeting truth. The land matters to the end. The psalm began with “thy land” and closes with “our land” yielding its increase and the LORD Himself walking in it.

sections:
  - range: 1-3
    heading: Thou hast brought back
    plain: |
      LORD, You showed favour to Your land; You restored the fortunes of Jacob. You lifted away the guilt of Your people and covered all their sin. You took away all Your wrath and turned back from the heat of Your anger.
  - range: 4-7
    heading: Turn us, and revive us again
    plain: |
      Turn us, O God who saves us, and put an end to Your displeasure with us. Will You be angry with us for ever? Will You stretch out Your anger from one generation to the next? Will You not turn and give us life again, so that Your people may rejoice in You? Show us Your mercy, O LORD, and give us Your salvation.
  - range: 8-9
    heading: I will hear what God the LORD will speak
    plain: |
      I will listen to what God the LORD will say, for He will speak peace to His people, to His faithful ones; only let them not turn back to folly. Surely His salvation is near to those who fear Him, so that glory may live in our land.
  - range: 10-13
    heading: Truth out of the earth, righteousness from heaven
    plain: |
      Mercy and truth have met; righteousness and peace have kissed. Truth will sprout from the earth, and righteousness will lean down from heaven. The LORD will give what is good, and our land will give its harvest. Righteousness will walk before Him and make a path for His steps.

notes:
  - ref: 1
    phrase: thou hast brought back the captivity of Jacob
    kind: history
    title: A restoration already behind them
    body: |
      The psalm opens by remembering a time when the LORD restored His people, and it does not say which time. “Brought back the captivity” is the Hebrew idiom explained at [[Ps. 14:7]], and a modern translation has “you restored the fortunes of Jacob.” This verse is listed with the uses of the phrase said “of Israel (or Judah).”

      Two prophets promise that restoration in the psalm’s own words. Jeremiah has, “I will bring again the captivity of Jacob’s tents” ([[Jer. 30:18]]), and Ezekiel, “Now will I bring again the captivity of Jacob” ([[Ezek. 39:25]]). A modern translation’s cross-references set both beside this verse. The psalm speaks of the thing as done.

      On one older reading the phrase here “seems to be meant literally, not figuratively,” and verses 1–3 “certainly sound as though they came from the lips of a people restored to their fatherland.” If the psalm does come from after the exile, the same reading goes on, it “was composed at a period in which the distance between the temporal and spiritual condition of Israel and the national restoration, promised together with the termination of the Exile, made itself distinctly felt.” That is an inference, and another view, reported beside it, holds that “the Psalm does not admit of any historical interpretation.” The text fixes only the order: a restoration first, and then a prayer for another.
    sources: [bdb, nrsvue, delitzsch-psalms]

  - ref: 4
    phrase: Turn us, O God of our salvation
    kind: structure
    title: Five turnings
    body: |
      One Hebrew verb, to turn or return, is used five times in the psalm, and the King James translates it several ways. The LORD “brought back” the captivity of Jacob (verse 1) and “turned” Himself from His anger (verse 3). The people ask Him to “turn us” (verse 4), and the “again” of “revive us again” (verse 6) is the same verb. It is in the answer too: “let them not turn again to folly” (verse 8).

      The prayer asks in the words of the memory. Verses 1–3 say that the LORD turned, and verse 4 asks Him to turn again.

      The lexicon sets the request of verse 4 with the idiom of verse 1, the verb used of restoring with a person as its object, and a modern translation has “Restore us again.”

      In verse 6 the verb stands beside a second verb, and the pair is listed under the sense to “reverse one’s action” and do something. The Greek keeps both verbs, “thou wilt turn and quicken us.” God is asked to turn around and give life. The verb’s last use, in verse 8, is the only one whose subject is the people, and it is the turning the psalm does not want.
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs]

  - ref: 8
    phrase: but let them not turn again to folly
    kind: words
    title: A warning in the Hebrew, a promise in the Greek
    body: |
      The promise of peace ends, in the Hebrew, with a warning, and the ancient Greek translation has a different line in its place. The Hebrew noun is a rare one, glossed “stupidity” in this verse, and the lexicon sets the clause with those that speak of returning “to a state or course of life.”
      The Greek reads that God will speak peace “to his saints, and to those that turn their heart toward him.” The lexicon recommends that reading, and a modern translation adopts it, “to those who turn to him in their hearts,” with the Hebrew in its margin. Another modern translation keeps the Hebrew: “but let them not turn back to folly.” Either way the clause is about turning. The Hebrew warns against turning back, and the Greek blesses those who turn toward God.

      Those who are promised peace are “his people” and “his saints.” “Saints” is *hasid*, the word explained at [[Ps. 4:3]].
    sources: [bdb, lxx-rahlfs, nrsvue, esv, oshb-wlc]

  - ref: 9
    phrase: that glory may dwell in our land
    kind: symbol
    title: Whose glory dwells in the land
    body: |
      The glory that is to dwell in the land is the LORD’s own, though the Hebrew says only “glory,” without “his.” The verb is the one used of God’s dwelling with Israel, and this verse is listed among those that speak “of God.” It is the verb of the command at Sinai, “let them make me a sanctuary; that I may dwell among them” ([[Ex. 25:8]]). A modern translation accordingly prints “that his glory may dwell in our land.”
    sources: [oshb-wlc, bdb, nrsvue]

  - ref: 10
    phrase: Mercy and truth are met together
    kind: symbol
    title: Four attributes meet like persons
    body: |
      Mercy, truth, righteousness and peace are pictured as four persons who meet and greet each other with a kiss. The verb for meeting is the ordinary one for two people coming upon each other, as in “The rich and poor meet together” ([[Prov. 22:2]]), and the lexicon marks its use here as figurative.

      The first two are old companions. “Mercy and truth” is *hesed* and *emet*, a pair rendered “kindness (lovingkindness) and fidelity” and found in psalm after psalm. It goes back to the LORD’s own account of Himself to Moses, “abundant in goodness and truth” ([[Ex. 34:6]]), where the two Hebrew words are the same. (*Hesed* is explained at [[Ps. 51:1]].) In this verse and two others the pair has been described so: “they are messengers of God to men.” One of the others reads, “God shall send forth his mercy and his truth” ([[Ps. 57:3]]; see [[Ps. 43:3]]).

      Verse 7 asked, “Shew us thy mercy,” and mercy is the first of the four to be named.

      A modern translation’s cross-references set beside the second pair another psalm, which asks that the mountains bring peace and the hills righteousness; its note treats peace as something the land bears ([[Ps. 72:3]]).

      Translations differ on the time. The Greek tells verses 10 and 11 as already done (“Truth has sprung out of the earth”). A modern translation tells both as still to come (“Steadfast love and faithfulness will meet”). The King James has the meeting done and the sprouting yet ahead.
    sources: [bdb, oshb-wlc, lxx-rahlfs, nrsvue]

  - ref: 11
    phrase: Truth shall spring out of the earth
    kind: symbol
    title: Faithfulness comes up like a crop
    body: |
      In the psalm’s own picture truth is a plant, and the sky bends over it. “Spring” is the verb to “sprout, spring up,” used first “of plants, trees, etc.”; this verse is listed as a figurative use, with “truth” as the thing that grows. “Look down” is a verb for leaning out to look, used of looking through a window: “The mother of Sisera looked out at a window” ([[Judg. 5:28]]). Righteousness leans out of heaven the way someone leans over a sill.

      “Truth” is *emet*, the “fidelity” of verse 10, and two modern translations have “Faithfulness will spring up from the ground” and “Faithfulness springs up from the ground.”

      “Earth” here is the Hebrew word translated “land” in verses 1, 9 and 12, so the verse belongs to the psalm’s concern with the land, and verse 12 completes the picture: “our land shall yield her increase.” Those are the words of the covenant’s first blessing on an obedient Israel, “I will give you rain in due season, and the land shall yield her increase” ([[Lev. 26:4]]), with the same Hebrew verb and nouns (see [[Ps. 67:6]]).
    sources: [bdb, oshb-wlc, nrsvue, esv]

  - ref: 11
    phrase: righteousness shall look down from heaven
    kind: scripture
    title: The Lord’s words to Enoch, and the Book of Mormon
    body: |
      The Lord’s words to Enoch about the last days have this psalm’s pair, and Latter-day Saints read the verse of the Restoration through those words. “And righteousness will I send down out of heaven; and truth will I send forth out of the earth, to bear testimony of mine Only Begotten; his resurrection from the dead; yea, and also the resurrection of all men” ([[Moses 7:62]]).

      Set beside the psalm, the Lord’s words differ in three ways. The two halves “are inverted,” with heaven first. Righteousness does not “look down”; the Lord says He will “send down” righteousness, and He will “send forth” the truth. And the truth has an errand. It comes out of the earth to testify of the Only Begotten and of the Resurrection, and then “righteousness and truth will I cause to sweep the earth as with a flood” ([[Moses 7:62]]).

      The next verse answers the psalm’s other image. Where the psalm has qualities that meet and kiss, the Lord’s words have peoples, “actual groups of beings,” Enoch’s city and the Zion gathered on earth: “we will fall upon their necks, and they shall fall upon our necks, and we will kiss each other” ([[Moses 7:63]]).

      President Ezra Taft Benson taught that the prophecy to Enoch has been fulfilled “in our generation.” “The Book of Mormon has come forth out of the earth, filled with truth,” and righteousness has come down in the appearing of the Father and the Son, the visits of angels, and “revelation after revelation from the heavens.” The Church’s heading to the psalm makes the same identification, and President Jeffrey R. Holland has taught it of this verse directly.

      That is the reading the Restoration gives the verse. The note before this one sets out the psalm’s own picture, of faithfulness sprouting in the people’s land; the Lord’s words to Enoch speak the same pair of the last days.
    sources: [lds-scriptures, sc-evidence-534, benson-gift-modern-revelation, scripture-helps-ps-49]

  - ref: 13
    phrase: shall set us in the way of his steps
    kind: words
    title: Righteousness walks ahead of the LORD
    body: |
      The last verse pictures the LORD walking through the land with righteousness going in front of Him, and its second half is uncertain. The Hebrew has no word for “us.” It says only that righteousness “shall set,” and then “the way of his steps,” and translators supply the rest. One modern translation has righteousness “make a path for his steps,” and another “make his footsteps a way.”

      An older reading weighs two senses. On the first, righteousness walks before Him “majestically as His herald” and also behind, setting its own feet in His footprints, so that it “follows Him inseparably.” On the second, which it prefers, the verb means “to give special heed to anything,” and righteousness “gives heed to the way of His steps, that is to say, follows carefully in His footsteps.”

      On the King James rendering the line is about the people, whom righteousness sets in the way of the LORD’s steps. On the others it is about the LORD’s own path. A modern translation’s cross-references set beside the verse another psalm’s attendants: “mercy and truth shall go before thy face” ([[Ps. 89:14]]). In every rendering the psalm ends with the LORD on foot in the land, where, on that older reading, He “Himself is present.”
    sources: [oshb-wlc, nrsvue, esv, delitzsch-psalms]

christ: |
  The Lord’s words to Enoch say what the truth sent out of the earth is for: “to bear testimony of mine Only Begotten; his resurrection from the dead; yea, and also the resurrection of all men” ([[Moses 7:62]]). The Church’s heading to the psalm names that truth as the Book of Mormon.

  A modern translation’s cross-references set two New Testament verses beside the psalm’s vision. Beside the glory that is to dwell in the land (verse 9) stands John’s testimony: “the Word was made flesh, and dwelt among us, (and we beheld his glory, the glory as of the only begotten of the Father,) full of grace and truth” ([[John 1:14]]). Beside the meeting of righteousness and peace (verse 10) stands the angels’ song, “on earth peace” ([[Luke 2:14]]).

  The psalm itself names no deliverer. It says that the LORD will speak peace to His people, and it ends with Him walking in their land.

explore: |
  - **Enoch’s vision of the last days.** [[Moses 7:60–64]], where the pair of verse 11 and the kiss of verse 10 are spoken by the Lord.
  - **Isaiah’s sky and soil.** [[Isa. 45:8]], with its note on righteousness from heaven and truth from the earth and on President Benson’s teaching.
  - **The covenant blessings.** [[Lev. 26:3–12]], which begins with the land’s increase and goes on to “I will give peace in the land” ([[Lev. 26:6]]) and “I will walk among you” ([[Lev. 26:12]]).
  - **Another restoration remembered and asked for again.** [[Ps. 126]], which looks back on a captivity turned and then prays, “Turn again our captivity, O LORD” ([[Ps. 126:4]]).
parallels:
  - ref: Moses 7:62
    note: The Lord tells Enoch He will send righteousness down out of heaven and truth forth out of the earth, to testify of His Only Begotten.
  - ref: Isa. 45:8
    note: The skies pour down righteousness and the earth opens to bring forth salvation.
  - ref: Lev. 26:4
    note: The covenant’s promise that “the land shall yield her increase,” in the Hebrew words of verse 12.
  - ref: Jer. 30:18
    note: The promise to “bring again the captivity of Jacob’s tents,” which verse 1 remembers as done.
  - ref: Ps. 89:14
    note: Mercy and truth go before the LORD’s face, as righteousness goes before Him in verse 13.

