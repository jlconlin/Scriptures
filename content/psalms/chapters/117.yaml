chapter: 117
title: Praise Him, All Ye Nations
tagline: Two verses call every nation on earth to praise the LORD, and the reason they are given is His mercy “toward us.”
when: 'Undated; the psalm has no title and names no occasion'

setting: |
  Psalm 117 has no title and names no author or occasion. It is the “shortest of all the Psalms,” a call in verse 1 and a reason in verse 2.

  It belongs to a group. Psalms 113–118 are the Hallel, the psalms “recited by Jews at the great feasts.” The later custom of singing these six psalms at the Passover meal is in the note on [[Ps. 113:1]].

  The psalm before it is one person’s thanksgiving, sung “in the courts of the LORD’s house, in the midst of thee, O Jerusalem” ([[Ps. 116:19]]), and it ends with “Praise ye the LORD.” Psalm 117 takes up that last line and addresses it to the nations. “Praise ye the LORD” is the Hebrew hallelujah, explained at [[Ps. 150:1]].

thread: |
  Psalm 117 is **a call to everyone, with a reason that seems to belong to a few**. Verse 1 speaks to “all ye nations” and “all ye people.” Nobody is left out of it, and Israel is not named.

  The turn is the word “For.” A reader expects the nations to be given a reason of their own. What they are given is this: “his merciful kindness is great toward us.” The singers mean themselves: the mercy was shown to them. The second reason has no “us” in it at all: “the truth of the LORD endureth for ever.”

  The psalm does not explain why what the LORD has done for one people should set every other people praising. It gives the reason and repeats the call, and stops. Paul quotes verse 1 in the letter to the Romans, among the scriptures he gives for the Gentiles glorifying God; the note on verse 1 has it.

sections:
  - range: 1-2
    heading: All nations, and the reason
    plain: |
      Praise the LORD, all you nations; praise Him, all you peoples. For His kindness toward us is strong, and the LORD’s faithfulness lasts for ever. Praise the LORD.

notes:
  - ref: 1
    phrase: all ye nations
    kind: scripture
    title: Paul’s scripture for the Gentiles
    body: |
      Paul quotes this verse to show that the praise of the Gentiles was written beforehand: “And again, Praise the Lord, all ye Gentiles; and laud him, all ye people” ([[Rom. 15:11]]). The psalm’s “nations” and Paul’s “Gentiles” are one idea in two English words, since “Gentiles” means “the nations.”

      It is the third of four passages he sets in a row. The first is David’s vow to give thanks “among the heathen” (see [[Ps. 18:49]]), and the last is Isaiah’s “root of Jesse,” in whom “shall the Gentiles trust” ([[Rom. 15:12]]).

      Paul introduces the four by saying what they are to show. Jesus Christ “was a minister of the circumcision for the truth of God, to confirm the promises made unto the fathers” ([[Rom. 15:8]]), “and that the Gentiles might glorify God for his mercy” ([[Rom. 15:9]]).
    sources: [lds-scriptures, bd-gentile]

  - ref: 2
    phrase: toward us
    kind: words
    title: Who “us” is and why the nations should praise
    body: |
      The psalm asks the nations to praise the LORD for mercy shown “toward us.” “Us” is the people singing, and on one older reading that is Israel: the LORD’s mercy “proves itself mighty over Israel.”

      “Great” is a stronger word than it looks. The Hebrew verb, with the word here translated “toward,” means to “prevail over,” and it is used that way of the “mercy of God” here and in [[Ps. 103:11]].

      How mercy shown to Israel becomes the nations’ reason, the same reading answers this way: mercy and truth are two powers of God that will be displayed in Israel, “and going forth from Israel, shall conquer the world.” That is one reading, and the psalm itself leaves the question open. What Paul does with verse 1 is in the note there.
    sources: [delitzsch-psalms, bdb]

  - ref: 2
    phrase: the truth of the LORD endureth for ever
    kind: scripture
    title: Mercy and truth, the pair from Sinai
    body: |
      The two reasons in verse 2 are the pair that closes the LORD’s list of His own attributes, spoken to Moses. At Sinai He proclaimed Himself “abundant in goodness and truth” ([[Ex. 34:6]]). The King James has “goodness” there and “merciful kindness” here, but the Hebrew noun is the same in both verses, and so is the word for “truth.” The two are named together as attributes of God in other psalms as well. The first is the covenant love explained at [[Ps. 51:1]], and [[Ps. 86:15]] repeats the sentence from Sinai nearly word for word.

      “Truth” in this verse is faithfulness: what lasts for ever is “the faithfulness of God,” and a modern translation has “the faithfulness of the LORD endures forever.” So the line is about the LORD keeping His word. The nations are called to praise a God who has been kind to His people and who does not go back on what He has said.
    sources: [lds-scriptures, oshb-wlc, bdb, nrsvue]

christ: |
  The LORD whom the nations are called to praise is the Savior: “LORD” in the Old Testament usually stands for the name Jehovah, and Jehovah is Jesus Christ before His birth.

  Verse 1 is one of the scriptures Paul gives when he says what Christ came to do: to confirm the promises made to the fathers, “and that the Gentiles might glorify God for his mercy” ([[Rom. 15:9]]). The note on verse 1 has the passage.

  The psalm also belongs to the Hallel, the psalms recited at the great feasts. The hymn sung on the night of the Last Supper ([[Matt. 26:30]]) is taken up in the note on [[Ps. 113:1]].

explore: |
  - **Paul’s four scriptures.** [[Rom. 15:8–12]], where verse 1 stands third.
  - **The Hallel.** [[Ps. 113]]–118, the group this psalm belongs to.
  - **The words from Sinai.** [[Ex. 34:6]] and [[Ps. 86:15]], where mercy and truth are the LORD’s own account of Himself.
  - **The same call elsewhere.** “Let all the people praise thee” ([[Ps. 67:3]]), and the last verse of the book, [[Ps. 150:6]].

parallels:
  - ref: Rom. 15:11
    note: Paul quotes verse 1 of the Gentiles praising the Lord.
  - ref: Ex. 34:6
    note: The LORD proclaims Himself “abundant in goodness and truth,” the pair of verse 2.
  - ref: Ps. 103:11
    note: “So great is his mercy,” with the verb of verse 2.
  - ref: Matt. 26:30
    note: The hymn sung before the Savior and the Twelve went out to the Mount of Olives.

sources: [lds-scriptures, bd-hallel, bd-feasts, bd-gentile, gs-jehovah, delitzsch-psalms, bdb, oshb-wlc, nrsvue]
