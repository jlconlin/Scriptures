chapter: 9
title: The Judge Who Does Not Forget
tagline: A song of thanks for a victory over hostile nations looks up to the throne behind it, where the LORD sits to judge the whole world and does not forget the cry of the afflicted.
when: 'Undated; a psalm of David by its title'

setting: |
  The title ascribes the psalm to David and names no occasion. The psalm itself gives thanks for the defeat of hostile nations and speaks of the LORD as one who “dwelleth in Zion” (verse 11). One older reading takes it as “a thoroughly national song of thanksgiving for victory by David,” from the time after the ark had been brought to Zion. The psalm does not name the war.

  Psalm 9 does not stand alone. Many ancient manuscripts, the Greek ones especially, treat Psalms 9 and 10 as a single psalm, and the two together “appear to be one complete acrostic poem”: their lines begin with the letters of the Hebrew alphabet in order, though some letters are missing. Read as a pair, they are a hymn of thanksgiving followed by a lament, and Psalm 10 takes up what Psalm 9 leaves unsettled ([[Ps. 10:1]]). The note on verse 1 shows the alphabet at work.

  The Church’s edition heads it “A messianic psalm of David.” The words of verse 8 about the Judge of the world stand also in Paul’s sermon at Athens, where God is to judge the world in righteousness “by that man whom he hath ordained” ([[Acts 17:31]]).

thread: |
  Psalm 9 gives thanks for a judgment already given and then asks for one still to come. **What joins the two is a Judge who stays on His throne and does not forget.**

  It opens with four lines of resolve: I will praise, I will tell, I will be glad, I will sing (verses 1–2). The reason follows. Enemies turned back, the nations were rebuked, and the LORD sat on the throne “judging right” (verses 3–5). The enemy’s end is told as an erasing: “thou hast put out their name,” and “their memorial is perished with them” (verses 5–6).

  Verse 7 turns on “But.” The enemy is gone and the LORD remains seated, and the throne that upheld one man’s cause is the throne from which “he shall judge the world” (verse 8). On one older reading, “the prospect of a final universal judgment was opened up” by the act of judgment just experienced. So the psalm calls for singing among the peoples (verse 11).

  Two verbs carry the rest. The LORD “remembereth them” and “forgetteth not the cry of the humble” (verse 12), the nations “forget God” (verse 17), and the needy “shall not alway be forgotten” (verse 18). And the enemies perish (verse 3) and their memorial perishes (verse 6), but the hope of the poor “shall not perish for ever” (verse 18). The Hebrew verb is the same in all three places.

  The thanksgiving does not hold to the end. Verse 13 is a plea, “Have mercy upon me, O LORD,” and the last two verses are a plea again: “Arise, O LORD.” One older reading takes verses 13–14 as the cry the afflicted raised before their rescue, recalled inside the thanks. Either way the psalm ends asking, and the next psalm opens with a complaint ([[Ps. 10:1]]). The judgment of verse 8 is promised and has not yet come.

sections:
  - range: 1-2
    heading: With my whole heart
    plain: |
      I will thank You, LORD, with all my heart. I will tell of all Your wonders. I will be glad and rejoice in You. I will sing praise to Your name, Most High.
  - range: 3-6
    heading: The judgment already given
    plain: |
      When my enemies turned back, they stumbled and perished before You. For You upheld my right and my cause; You sat on the throne and judged rightly. You rebuked the nations, You destroyed the wicked, You wiped out their name for ever and ever. The enemy is finished, a ruin for ever. You uprooted their cities, and the very memory of them has perished.
  - range: 7-12
    heading: The throne that remains
    plain: |
      But the LORD sits enthroned for ever. He has set up His throne for judgment. He will judge the world with righteousness and the peoples with fairness. The LORD is a stronghold for the oppressed, a stronghold in times of trouble. Those who know Your name trust in You, for You, LORD, have not forsaken those who seek You. Sing praise to the LORD, who dwells in Zion. Tell the peoples what He has done. For He who calls bloodshed to account remembers them; He does not forget the cry of the afflicted.
  - range: 13-16
    heading: From the gates of death
    plain: |
      Be gracious to me, LORD. See what I suffer from those who hate me, You who lift me up from the gates of death, so that I may tell all Your praise in the gates of the daughter of Zion and rejoice in Your salvation. The nations have sunk into the pit they dug. Their own foot is caught in the net they hid. The LORD has made Himself known; He has carried out judgment. The wicked is snared in the work of his own hands.
  - range: 17-20
    heading: Arise, O LORD
    plain: |
      The wicked will go back to Sheol, all the nations that forget God. For the needy will not be forgotten for ever, and the hope of the poor will not perish for ever. Arise, LORD! Do not let mortals prevail. Let the nations be judged before You. Put them in fear, LORD. Let the nations know that they are only human.

notes:
  - ref: 0
    phrase: upon Muth-labben
    kind: words
    title: Muth-labben
    body: |
      Muth-labben is a phrase no one can now explain with confidence. Its meaning is “dubious,” and it has been called “a perfect riddle.” The two Hebrew words are commonly read “upon death to the son.” The ancient Greek translators read them otherwise, as “concerning the secrets of the Son.”

      Some have taken the phrase as the subject or occasion of the song, “but most refer it to the music.” That agrees with the general account of titles of this kind: they “are all probably names of tunes, well known at the time, to which the Psalms were appointed to be sung.” If so, Muth-labben names a melody.

      “To the chief Musician” is explained under the title of Psalm 8 ([[Ps. 8:1]]).
    sources: [bdb, ot-manual-psalms, lxx-rahlfs, bd-psalms, oshb-wlc]
  - ref: 1
    phrase: I will praise thee, O LORD, with my whole heart
    kind: structure
    title: An alphabet shared with Psalm 10
    body: |
      Psalm 9 begins an alphabet that Psalm 10 carries on. In Hebrew each of the four lines of verses 1–2 begins with aleph, the first letter: “I will praise,” “I will shew forth,” “I will be glad,” “I will sing praise.” The letters then run in order through the two psalms, “although some letters are missing.” A modern translation goes further and notes that the two “were originally one psalm, as in the Greek and Latin traditions.” The alphabet and the Greek manuscripts are the evidence; that the two were composed as one is a judgment drawn from them.

      The shape matters for how Psalm 9 is read. The pair is “a hymn of thanksgiving (Psalm 9) followed by a lament (Psalm 10),” so the thanks of this psalm is the first half of a longer poem, and its closing pleas lead into Psalm 10. Psalm 10 is “the painful acknowledgment that that great day has not yet arrived.”
    sources: [oshb-wlc, ot-minute-psalms-1-20, nrsvue]
  - ref: 6
    phrase: destructions are come to a perpetual end
    kind: words
    title: The enemy ended, the LORD enthroned
    body: |
      Verse 6 can be read as spoken to the enemy or as spoken about him, and translations divide. The King James reads “O thou enemy” as an address, and the word “appears to be a vocative.” But then “thou hast destroyed cities” is said to the enemy, while every other “thou” in verses 3–6 is the LORD. A modern translation makes the enemy the subject instead: “The enemies have vanished in everlasting ruins,” and “the very memory of them has perished.” The ancient Greek read “swords” where the Hebrew has “ruins” (“The swords of the enemy have failed utterly”), a reading “which leaves it uncertain whose swords are meant.”

      However the line is taken, verse 7 is its contrast, as one older reading puts it: “their, even their memorial is perished, while on the contrary Jahve endures for ever and is enthroned as judge.” Where the King James has “shall endure,” the Hebrew verb is “sit,” the verb of “thou satest in the throne” (verse 4) and of “dwelleth in Zion” (verse 11). A modern translation renders it “But the Lord sits enthroned forever.”
    sources: [delitzsch-psalms, nrsvue, lxx-rahlfs, oshb-wlc]
  - ref: 8
    phrase: he shall judge the world in righteousness
    kind: christ
    title: The words Paul used at Athens
    body: |
      Paul’s sermon at Athens ends with the words of this verse and adds through whom the judging will be done. God, he said, “hath appointed a day, in the which he will judge the world in righteousness by that man whom he hath ordained; whereof he hath given assurance unto all men, in that he hath raised him from the dead” ([[Acts 17:31]]). Paul does not say that he is quoting, and the line stands in two other psalms as well ([[Ps. 96:13]]; [[Ps. 98:9]]). But in the ancient Greek translation of this psalm the line reads “he will judge the world in righteousness,” and the Greek of Acts has the same words for the world and for righteousness, with the same verb. In the Church’s edition the footnote on “judge” leads to the Topical Guide entry “Jesus Christ, Judge,” where Paul’s sentence is listed with this verse.

      The psalm says that the LORD will judge. Paul says the same and adds two things: the judging is done “by that man,” and the assurance of it is the Resurrection.

      Read this way, the psalm looks beyond David’s victory. It “appears to depict the Second Coming and the subsequent millennial reign of Christ on earth.”
    sources: [lds-scriptures, lxx-rahlfs, greek-nt, ot-minute-psalms-1-20]
  - ref: 12
    phrase: When he maketh inquisition for blood
    kind: words
    title: He who asks after blood
    body: |
      To make “inquisition for blood” is to demand an accounting for lives taken, and the psalm says it with the verb it has just used for seeking God. In this sense the verb means to “exact, often with collateral idea of avenging.” It is the verb of the LORD’s word to Noah: “at the hand of every man’s brother will I require the life of man” ([[Gen. 9:5]]). A modern translation has “For he who avenges blood is mindful of them.”

      Verse 10 ended, “thou, LORD, hast not forsaken them that seek thee.” Two verses later the LORD is the one who seeks. One older reading joins the two: He “has been as earnest in His concern for them as they in theirs for Him.”

      “Them” looks ahead to the end of the verse. Those He remembers are “the humble,” whose cry He does not forget.
    sources: [bdb, oshb-wlc, nrsvue, delitzsch-psalms]
  - ref: 13
    phrase: thou that liftest me up from the gates of death
    kind: symbol
    title: Two sets of gates
    body: |
      Verses 13 and 14 set the gates of death against the gates of Zion, and the prayer is to be lifted from the first in order to give praise in the second. “That I may” joins them: the rescue is asked for the sake of the praise. “The daughter of Zion,” which is “Zion itself,” is named nowhere else in the King James Psalms.

      The image is of rescue from mortal danger: “he who is snatched from peril of death is lifted up.” It has also been read as reaching further, since verse 13 “may be a reference to the Resurrection.” That is offered as a possibility and not as the plain sense.
    sources: [lds-scriptures, delitzsch-psalms, ot-minute-psalms-1-20]
  - ref: 16
    phrase: Higgaion
    kind: words
    title: Higgaion
    body: |
      Higgaion, set beside Selah, is a direction to the musicians. The word means “resounding music, meditation, musing,” and here it is “a musical direction.” It occurs three times in the Psalms. In the other two the King James translates it: the harp’s “solemn sound” ([[Ps. 92:3]]) and “the meditation of my heart” ([[Ps. 19:14]]). The ancient Greek rendered the two words together as “A song of Pause.”

      The direction comes at the line where the LORD “is known by the judgment which he executeth.” Selah is explained at [[Ps. 3:2]].
    sources: [bdb, oshb-wlc, lxx-rahlfs]
  - ref: 17
    phrase: turned into hell
    kind: words
    title: Back to Sheol
    body: |
      “Hell” here is the Hebrew Sheol, and “turned” is the verb “return.” A modern translation has “The wicked shall depart to Sheol,” and the ancient Greek has “into Hades.” The verb is the one that began the account of the victory, “When mine enemies are turned back” (verse 3). What Sheol was to the psalmists is taken up at [[Ps. 6:5]].

      Those sent there are “all the nations that forget God.” The next verse sets beside them what God does not do: “the needy shall not alway be forgotten.”
    sources: [oshb-wlc, nrsvue, lxx-rahlfs]
  - ref: 20
    phrase: that the nations may know themselves to be but men
    kind: words
    title: Only mortals
    body: |
      The psalm’s last request is that the nations learn what they are. “Man” in verse 19 and “men” in verse 20 are one Hebrew word, which a modern translation renders “Do not let mortals prevail” and “let the nations know that they are only human.”

      “The heathen” and “the nations” are also one Hebrew word in this psalm (verses 5, 15, 17, 19 and 20), so the King James’s two English words name the same peoples.

      “Arise, O LORD” is the call of [[Ps. 3:7]], where the note traces it to Moses.
    sources: [oshb-wlc, nrsvue]

christ: |
  The Judge of this psalm is the LORD, who “hath prepared his throne for judgment,” and the New Testament says through whom that judgment is given: the Man God raised from the dead ([[Acts 17:31]]; see the note on verse 8).

  The psalm has been read as looking to “the great day of the Lord,” when He sits in judgment over the nations and dwells in Zion. The same reading sees a possible reference to the Resurrection in the lifting up “from the gates of death” (see the note on verse 13).

explore: |
  - **The other half of the poem.** Read Psalm 10 straight after this one ([[Ps. 10:1–18]]), watching for the words that return: the poor, the humble, the heathen, and “Arise, O LORD.”
  - **Paul at Athens.** [[Acts 17:22–31]], where the line about the Judge of the world closes the sermon.
  - **The Judge who comes.** [[Ps. 96:10–13]] and [[Ps. 98:9]], and John’s vision of the rider who judges in righteousness ([[Rev. 19:11]]).

parallels:
  - ref: Acts 17:31
    note: Paul uses the words of verse 8 of the day God will judge the world by the Man He raised from the dead.
  - ref: Ps. 10:1–18
    note: The second half of the alphabet poem, a lament after this thanksgiving.
  - ref: Ps. 96:13
    note: The line of verse 8 again (also Ps. 98:9).
  - ref: Gen. 9:5
    note: The LORD requires an accounting for blood, in the verb of verse 12.
  - ref: Ps. 7:15–16
    note: The wicked falls into the pit he dug, as in verses 15–16.

