chapter: 110
title: Sit Thou at My Right Hand
tagline: David hears the LORD seat a king beside Him and swear that king a priest for ever, and David calls him “my Lord.”
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  The title, “A Psalm of David,” names no occasion (on titles, see [[Ps. 3:1]]). Here the New Testament speaks for the title. Jesus quotes the first verse as what “David himself said by the Holy Ghost” ([[Mark 12:36]]), and Peter, in the sermon that quotes it at Pentecost, calls David “a prophet” ([[Acts 2:30]]).

  It is a royal psalm, a song about Israel’s king (see [[Ps. 2:2]] for the kind, and for “his anointed”). Psalm 2 is another, where the LORD sets His king on Zion and calls him Son ([[Ps. 2:6–7]]). Its first setting was likely a coronation, at which the LORD takes the king as co-ruler and seats him at His right hand. The psalm also swears this king “a priest for ever after the order of Melchizedek,” and Melchizedek is named in only one other passage of the Old Testament, [[Gen. 14:18]].

  The psalm’s first verse is the Old Testament text the New Testament quotes most often, and Hebrews quotes the fourth again and again in its account of Christ’s priesthood.

thread: |
  The psalm is two sayings of the LORD, and each is followed by what comes of it. In verse 1 the LORD speaks and gives a throne: “Sit thou at my right hand.” Verses 2–3 show what follows from it, a scepter stretched out from Zion and a people who come of their own will. In verse 4 the LORD speaks again, and this time He swears: “Thou art a priest for ever.” Verses 5–7 show the day of wrath, kings struck down, and the nations judged.

  **The turn is verse 4.** The first saying makes a king. The second makes that king a priest, an office the law of Moses gave to no one of his tribe, and it reaches behind the law for a precedent, to Melchizedek. It is the only thing in the psalm that God swears, and the only thing said to last “for ever.”

  The right hand moves as the psalm does. In verse 1 the king sits at the LORD’s right hand. In verse 5 the Lord is at the king’s right hand, in the fight. And the psalm that begins with enemies under the king’s feet ends with the king’s head lifted up.

  The king is never named. David, who was king, calls him “my Lord,” and that is the question Jesus put to the Pharisees.

sections:
  - range: 1-3
    heading: The first saying, a throne
    plain: |
      The LORD’s word to my lord: “Sit at my right hand until I make your enemies a stool for your feet.” The LORD will stretch out your mighty scepter from Zion: rule, with your enemies all around you. Your people come forward freely on the day you muster your army, in holy splendor. From the womb of the dawn, the dew of your youth is yours.
  - range: 4
    heading: The second saying, a priesthood
    plain: |
      The LORD has sworn and will not change His mind: “You are a priest for ever, in the manner of Melchizedek.”
  - range: 5-7
    heading: The day of wrath
    plain: |
      The Lord is at your right hand. On the day of His anger He strikes down kings. He will judge among the nations and fill the places with the dead; He strikes the head over a wide land. He will drink from the stream beside the road, and so he will lift up his head.

notes:
  - ref: 1
    phrase: The LORD
    kind: words
    title: LORD and Lord are two different Hebrew words
    body: |
      The King James gives them the same English word, but the two Lords of this verse are different words in Hebrew: the first is the name of God, and the second is the ordinary word for a master.

      “LORD” in capitals stands for the divine name, written YHWH and said in English as Jehovah. Jewish readers “never mentioned it but substituted one of the other names of God, usually Adonai,” and the King James follows the custom: wherever the name stands in the Hebrew, the English has LORD or GOD, “printed in small capitals.”

      “My Lord” is *adoni*: “lord” in the sense of a master, as a servant says it to his master or a subject to his king, with “my” attached. The vowel marks of the traditional Hebrew text (the Masoretic pointing) keep the word apart from the forms used of God; they are “variations of Masoretic pointing to distinguish divine reference from human,” and this verse has the human form. So the psalm’s first line is Jehovah’s word to the one David calls his master, the king whom Jehovah seats beside Him “as an appointed ruler.” The Greek translation lost the difference, since it used one word, *Kyrios*, for both, and English keeps it only in the capitals. Verse 5 has a third form; see the note there.

      A Latter-day Saint reader has a further question. Jehovah “is the premortal Jesus Christ,” and the New Testament reads “my Lord” as Christ as well. Who, then, is speaking to whom? Where the New Testament quotes the verse, God speaks it to His Son. Hebrews asks, “But to which of the angels said he at any time, Sit on my right hand, until I make thine enemies thy footstool?” ([[Heb. 1:13]]), and the speaker there is the one who says, “I will be to him a Father, and he shall be to me a Son” ([[Heb. 1:5]]). Peter concludes from the verse “that God hath made that same Jesus, whom ye have crucified, both Lord and Christ” ([[Acts 2:36]]). The modern Latter-day Saint practice of keeping *Jehovah* for the Son and *Elohim* for the Father “was not taken from the Hebrew Bible,” and “it can create misunderstandings if imposed upon the Hebrew scriptural account.” The psalm says that Israel’s God seats a king at His right hand, and the New Testament says who each of them is.
    sources: [bd-jehovah, bdb, oshb-wlc, scripture-helps-ps-102, frederick-use-of-ot, gs-jehovah, davis-hoskisson-elohim, lds-scriptures]

  - ref: 1
    phrase: said
    kind: words
    title: A prophet’s word for said
    body: |
      “Said” translates a noun that marks an oracle, so the line reads, *the utterance of the LORD to my lord*. It is the word of a “prophet citing divine word given through him,” the formula that runs through Isaiah, Jeremiah, and the other prophets. In the Psalms it comes only twice, and only here of the LORD; the other time it is transgression that speaks, “with prophetic voice.”

      David’s last words begin with the same noun, used of himself: “David the son of Jesse said” ([[2 Sam. 23:1]]). And his next sentence explains what kind of saying it is: “The Spirit of the LORD spake by me, and his word was in my tongue” ([[2 Sam. 23:2]]).

      So the psalm does not open as a prayer or a song of praise. It opens as something heard and reported. Jesus quotes it that way: “How then doth David in spirit call him Lord” ([[Matt. 22:43]]).
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 1
    phrase: my Lord
    kind: christ
    title: The question no one could answer
    body: |
      Jesus used these two words to show that the Messiah is more than David’s son. In the temple, “less than a week before his death,” He asked the Pharisees whose son the Christ is, and they said David’s ([[Matt. 22:42]]). Then He quoted this verse and asked, “If David then call him Lord, how is he his son?” ([[Matt. 22:45]]). “And no man was able to answer him a word, neither durst any man from that day forth ask him any more questions” ([[Matt. 22:46]]).

      The question works because His hearers grant three things: that David wrote the psalm, that he wrote it by the Spirit, and that “my Lord” is the Messiah. By the time of Jesus the psalm appears to have come to be read that way, with the second Lord understood as the Messiah and no longer as the king of the day. Once those are granted the difficulty is plain. A father does not call his descendant “my lord.” If David does, the one he speaks of is greater than David.

      Jesus does not say the Messiah is not David’s son. He asks how he can be only that. David called the Messiah his Lord because he knew whose Son the Messiah would be, and the Savior’s point is that the Christ is “more than just the son of David; He was also the Son of God.”

      Peter finished the argument at Pentecost. David’s tomb was in the city, and “David is not ascended into the heavens” ([[Acts 2:34]]). The psalm must speak of another, the one whom God raised and who was “by the right hand of God exalted” ([[Acts 2:33]]).
    sources: [lds-scriptures, frederick-use-of-ot, scripture-helps-nt-matt-21]

  - ref: 1
    phrase: Sit thou at my right hand, until I make thine enemies thy footstool
    kind: symbol
    title: The right hand, the footstool, and the word until
    body: |
      To sit at a king’s right hand is to share his rule, a footstool of enemies is the picture of a finished victory, and the word between them, “until,” leaves time between the two.

      The right hand is “the place of divine favor,” and with this verse Israel’s king was “enthroned at the Lord’s right hand.” The footstool comes from the battlefield. Joshua told his captains, “Come near, put your feet upon the necks of these kings” ([[Josh. 10:24]]), and Solomon said that David fought “until the LORD put them under the soles of his feet” ([[1 Kgs. 5:3]]). The Hebrew word for footstool is “never literal” in the Old Testament, and it is usually God’s own: “the earth is my footstool” ([[Isa. 66:1]]), or His sanctuary. In this verse it is made of enemies and given to the king.

      This sentence is “the most-quoted Old Testament text in the New Testament,” and the New Testament presses both its verb and its “until.”

      *Sit.* Israel’s priests stood, because their work was never done: “every priest standeth daily ministering and offering oftentimes the same sacrifices” ([[Heb. 10:11]]). “But this man, after he had offered one sacrifice for sins for ever, sat down on the right hand of God” ([[Heb. 10:12]]).

      *Until.* He sits “from henceforth expecting till his enemies be made his footstool” ([[Heb. 10:13]]). Paul names the last of them: “For he must reign, till he hath put all enemies under his feet” ([[1 Cor. 15:25]]). “The last enemy that shall be destroyed is death” ([[1 Cor. 15:26]]).

      *The meantime.* Modern revelation says where things now stand: the Son of Man “has taken his power on the right hand of his glory, and now reigneth in the heavens, and will reign till he descends on the earth to put all enemies under his feet” ([[D&C 49:6]]).
    sources: [sc-knowhy-307, bdb, frederick-use-of-ot, lds-scriptures]

  - ref: 2
    phrase: the rod of thy strength
    kind: words
    title: A scepter, not a shoot
    body: |
      The “rod” is a king’s scepter, and it is the LORD who stretches it out. The Hebrew noun means a “staff, rod, shaft,” and a modern translation has “your mighty scepter.” It is a different Hebrew word from the “rod out of the stem of Jesse” ([[Isa. 11:1]]), which that verse pairs with a branch growing out of roots.

      The scepter goes out “of Zion,” the hill where Psalm 2 has the LORD say, “Yet have I set my king upon my holy hill of Zion” ([[Ps. 2:6]]). And the command that follows takes the “until” of verse 1 seriously. The king is told to rule “in the midst of thine enemies,” while they are still there. His reign does not wait for their defeat.
    sources: [bdb, nrsvue, oshb-wlc, lds-scriptures]

  - ref: 3
    phrase: Thy people shall be willing in the day of thy power
    kind: words
    title: An army of volunteers
    body: |
      The king’s people volunteer and are not drafted: the Hebrew says they *are* freewill offerings. “Willing” is a plural noun, the word for the voluntary gift an Israelite brought to the sanctuary, a “freewill-offering”; here it means that the people “will be (all) voluntariness.”

      “The day of thy power” is the day the army is called out. The phrase can be rendered “in the day of thy host,” or, in a modern translation, “on the day you lead your forces.”
    sources: [bdb, nrsvue]

  - ref: 3
    phrase: 'from the womb of the morning: thou hast the dew of thy youth'
    kind: words
    title: Dew from the womb of the dawn
    body: |
      The line most likely pictures the king’s young men appearing at daybreak as dew does, but the Hebrew is difficult, and no reading of it is certain.

      Two of its words cause the trouble. “Morning” is a form of the word for dawn that the lexicon finds in this verse alone, and it suspects a copying slip (“probably dittograph,” a letter written twice). “Youth” ordinarily means the time of “childhood, youth,” but here it is taken as a collective, the “young men.” A modern translation accordingly reads, “like dew, your youth will come to you,” and marks the line as corrected from the Hebrew, which has “the dew of your youth.”

      If the young men are the dew, the image is of an army. On one reading the host “is likened to the dew both on account of its vigorousness and its multitude,” and for “the silent concealment out of which it wondrously and suddenly comes to light.” No one sees dew arrive. At dawn it is simply there, and it is everywhere.

      The ancient Greek translators read something else in the same line: “I have begotten thee from the womb before the morning.” Their version has the LORD speak of the king’s birth. The King James follows the Hebrew.
    sources: [bdb, nrsvue, delitzsch-psalms, lxx-rahlfs]

  - ref: 4
    phrase: The LORD hath sworn, and will not repent
    kind: scripture
    title: How Hebrews argues from this verse
    body: |
      Hebrews quotes this verse again and again in its account of Christ as high priest, from chapter 5 to chapter 7, and it presses four things in it.

      **It is God who appoints.** “And no man taketh this honour unto himself, but he that is called of God, as was Aaron” ([[Heb. 5:4]]). “So also Christ glorified not himself to be made an high priest” ([[Heb. 5:5]]); the One who called Him Son in Psalm 2 says “in another place, Thou art a priest for ever after the order of Melchisedec” ([[Heb. 5:6]]).

      **It names another order.** The oath came after the law (“the word of the oath, which was since the law,” [[Heb. 7:28]]), and it still looks for a priest who is not Aaron’s. Hebrews draws the conclusion: if the Levitical priesthood had been enough, “what further need was there that another priest should rise after the order of Melchisedec, and not be called after the order of Aaron?” ([[Heb. 7:11]]). The priest it looks for could not have served at Israel’s altar at all, “for it is evident that our Lord sprang out of Juda; of which tribe Moses spake nothing concerning priesthood” ([[Heb. 7:14]]).

      **It is sworn.** “Will not repent” means that the LORD will not change His mind. Aaron’s sons became priests without any such word: “those priests were made without an oath; but this with an oath” ([[Heb. 7:21]]). “By so much was Jesus made a surety of a better testament” ([[Heb. 7:22]]).

      **It is for ever.** Under the law “they truly were many priests, because they were not suffered to continue by reason of death” ([[Heb. 7:23]]). “But this man, because he continueth ever, hath an unchangeable priesthood” ([[Heb. 7:24]]). From the psalm’s two words Hebrews draws its largest promise: “Wherefore he is able also to save them to the uttermost that come unto God by him, seeing he ever liveth to make intercession for them” ([[Heb. 7:25]]).

      Then it joins verse 4 to verse 1: “We have such an high priest, who is set on the right hand of the throne of the Majesty in the heavens” ([[Heb. 8:1]]).
    sources: [lds-scriptures, nrsvue]

  - ref: 4
    phrase: after the order of Melchizedek
    kind: history
    title: A king who is also a priest
    body: |
      In Israel the throne and the altar belonged to different families, and this oath gives one man both. When King Uzziah went into the temple to burn incense, the priests stopped him: “It appertaineth not unto thee, Uzziah, to burn incense unto the LORD, but to the priests the sons of Aaron” ([[2 Chr. 26:18]]). A king of David’s line was of Judah, a tribe to which the law gave no priesthood ([[Heb. 7:14]]).

      Melchizedek is the precedent from before the law. He was “king of Salem” and “the priest of the most high God” at once ([[Gen. 14:18]]), and Salem is Jerusalem, the city where David’s house ruled. “After the order of” translates a Hebrew phrase that means “after the order, or manner, of”: a priest of Melchizedek’s kind. He stands in the psalm as the ideal priest-king, and the psalm looks for “a future Davidic king” who would be both. Who Melchizedek was, and what Restoration scripture adds to the three verses Genesis gives him, is told at [[Gen. 14:18]].

      Restoration scripture adds that this order was never a matter of descent. Joseph Smith’s revision of Hebrews says that Melchizedek’s order, not the man, “was without father, without mother, without descent” (JST Heb. 7:3): “unlike the Levitical or Aaronic order in ancient times,” it does not come by lineage alone. And the order had an older name. Before Melchizedek’s day it was “the Holy Priesthood, after the Order of the Son of God” ([[D&C 107:3]]).
    sources: [lds-scriptures, bd-melchizedek, bdb, scripture-helps-ps-102, jst-heb-7, nt-student-manual-49]

  - ref: 5
    phrase: The Lord at thy right hand
    kind: words
    title: The right hand changes sides
    body: |
      This “Lord” is God again, and now He is at the king’s right hand instead of the king at His. The Hebrew is *Adonai*, the form of “lord” kept for God. It is not the *adoni* of verse 1, and it is not the divine name, which is why the King James prints it without capitals.

      The two right hands mean different things. In verse 1 it is the seat of honor beside a throne. Here it is where a defender stands in a fight: “because he is at my right hand, I shall not be moved” ([[Ps. 16:8]]); the LORD “shall stand at the right hand of the poor, to save him” ([[Ps. 109:31]]). The king enthroned by God in verse 1 goes to battle with God beside him, and on one reading the point is that the victory “is not his own work, but the work of Jahve on his behalf and through him.”

      That bears on a question the grammar leaves open: who is “he” in verses 5–7? The Lord strikes in verse 5, and the one who drinks from a brook in verse 7 is read as the king (see the note there), but the text never marks a change. The reading just cited takes the subject of the judging and striking to be “the Lord as acting through him.”

      Verses 5–6 describe a battlefield, and the psalm puts it in God’s hand and on His day, “the day of his wrath,” as the psalms that ask for judgment do (see [[Ps. 137:8]]).
    sources: [oshb-wlc, bdb, delitzsch-psalms, lds-scriptures]

  - ref: 7
    phrase: 'He shall drink of the brook in the way: therefore shall he lift up the head'
    kind: symbol
    title: A drink on the march, and a head lifted up
    body: |
      The last verse is read of the king, who stops to drink from a stream beside the road and then raises his head, and it does not explain itself.

      One reading takes it as the march of a warrior who will not stop: “He will stand still only for a short time to refresh himself, and in order then to fight afresh.” The first half of the verse is then the toil of the battle and the second half its reward.

      The psalm itself gives one firm point. Verse 6 ends with the Lord striking “the head” (the Hebrew is singular, though a modern translation has “heads”) over a wide land, and verse 7 ends with the same Hebrew word: the king will “lift up the head.” One head goes down and one comes up. To lift the head is a psalmist’s way of speaking of victory: “And now shall mine head be lifted up above mine enemies round about me” ([[Ps. 27:6]]).

      Verse 1 promised the king his enemies as a footstool, and the psalm’s last words raise his head.
    sources: [delitzsch-psalms, oshb-wlc, nrsvue, lds-scriptures]

christ: |
  Jesus said this psalm was about Him. He quoted its first verse to ask how David’s son could be David’s Lord ([[Matt. 22:41–46]]), and His apostles preached from it beginning on the day of Pentecost. The New Testament finds the psalm’s throne and its priesthood in Him.

  He is the Lord whom David called “my Lord.” He is the one seated at the right hand: Stephen saw “the Son of man standing on the right hand of God” ([[Acts 7:56]]), and a vision in this dispensation saw Him “even on the right hand of God” ([[D&C 76:23]]). And He is the priest of verse 4. Hebrews names Jesus as the one in whom that oath is kept, and it says what this priest offered: “for this he did once, when he offered up himself” ([[Heb. 7:27]]). Jesus, “for the joy that was set before him endured the cross, despising the shame, and is set down at the right hand of the throne of God” ([[Heb. 12:2]]).

explore: |
  - **The Savior’s question, and Peter’s answer.** [[Matt. 22:41–46]] with [[Mark 12:35–37]], and then [[Acts 2:29–36]].
  - **Hebrews on verse 4, read straight through.** [[Heb. 5:1–10]], [[Heb. 6:13–20]], and [[Heb. 7:1–28]]; then [[Heb. 10:11–14]] on verse 1.
  - **Melchizedek and his order.** The notes at [[Gen. 14:18]]; [[Alma 13:1–19]], where priests are ordained “in a manner that thereby the people might know in what manner to look forward to his Son for redemption” ([[Alma 13:2]]); [[D&C 107:1–4]]; and [[D&C 76:56–57]], where those who receive His fulness are “priests of the Most High, after the order of Melchizedek” ([[D&C 76:57]]).
  - **The oath in latter-day revelation.** [[D&C 84:33–40]], on “this oath and covenant of my Father” ([[D&C 84:40]]).
  - **Psalm 2 beside it.** [[Ps. 2:6–9]], the king on Zion, the Son, and the nations.
  - **The verse in the Gospels.** “The Use of the Old Testament in the New Testament Gospels,” a Religious Studies Center study, reads the Savior’s question in Mark 12 as one of the places where Mark shows Jesus using the Old Testament to support His claims to deity.

parallels:
  - ref: Matt. 22:41–46
    note: Jesus quotes verse 1 and asks how the Christ can be David’s son if David calls him Lord.
  - ref: Acts 2:34–36
    note: Peter quotes verse 1 at Pentecost; David did not ascend, so the psalm speaks of the risen Jesus.
  - ref: 1 Cor. 15:25
    note: Christ must reign “till he hath put all enemies under his feet,” and the last enemy is death.
  - ref: Heb. 1:13
    note: Verse 1 was said to the Son and to no angel.
  - ref: Heb. 5:6
    note: Verse 4 is quoted, after Psalm 2:7, of Christ’s call to be high priest.
  - ref: Heb. 7:21
    note: The oath of verse 4 sets Christ’s priesthood above that of Aaron’s sons.
  - ref: Heb. 10:12–13
    note: Having offered one sacrifice, He sat down at God’s right hand, waiting until His enemies are made His footstool.
  - ref: D&C 49:6
    note: The Son of Man reigns at the right hand until He comes to put all enemies under His feet.

