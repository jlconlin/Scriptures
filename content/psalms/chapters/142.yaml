chapter: 142
title: No Man Cared for My Soul
tagline: A hunted man looks to his right hand and finds no one there, says to the LORD “Thou art my refuge,” and asks to be brought out of prison into the company of the righteous.
when: 'By its title, David’s, when he was in the cave'

setting: |
  The title ascribes the psalm to David and places it “in the cave,” in the years when Saul hunted him. One other title speaks of the cave, that of Psalm 57 ([[Ps. 57:1]]).

  The psalm itself names no cave, no king and no pursuer. It speaks of a snare hidden in the path, of persecutors “stronger than I,” and of a man with no one beside him. It shares its opening with another psalm, “I cried unto God with my voice” ([[Ps. 77:1]]), and its “my spirit was overwhelmed” with that psalm and the next ([[Ps. 77:3]]; [[Ps. 143:4]]). One older reading finds in it no “sure signs of a post-Davidic age,” and yet judges it “an imitation of older models,” dependent on Psalm 77. That is one judgment; the chapter reads the psalm in the setting its title asks for. What a title is worth as evidence is discussed at [[Ps. 3:1]].

thread: |
  **The psalm moves from a man with no one to a man surrounded, and what stands between the two is one sentence said to the LORD: “Thou art my refuge.”** It is a lament (see [[Ps. 22:1]]), and a short one.

  It begins by telling about a prayer. In verses 1–2 the LORD is “him”: the speaker cried, made supplication, poured out his complaint “before him.” In verse 3 the telling becomes the prayer, and the LORD is “thou” to the end. The first thing said to Him is that He knows: “then thou knewest my path,” or in a modern translation, in the present, “you know my way.” On one older reading “just this is his consolation.” He has not been rescued yet. He has been known.

  The complaint follows (verses 3–4). There is a snare in the road, and at his right hand, where a defender would stand, there is nobody. In the King James the verse ends in two short clauses: “refuge failed me; no man cared for my soul.”

  Verse 5 is the turn, and in the King James it answers verse 4 with that verse’s own word. Refuge failed him, and he says to the LORD, “Thou art my refuge.” Nothing in his circumstances has changed between the two verses; the persecutors of verse 6 are still stronger than he is.

  The petition asks for three things, a hearing, deliverance and release from prison, and the last line looks past them: “the righteous shall compass me about.”

sections:
  - range: 1-2
    heading: I poured out my complaint
    plain: |
      I cry aloud to the LORD; aloud I plead with the LORD for mercy. I pour out my complaint before Him; I tell my trouble before Him.
  - range: 3-4
    heading: No man that would know me
    plain: |
      When my spirit grows faint within me, You know my path. On the road where I walk they have hidden a trap for me. I look to my right hand and see: there is no one who takes notice of me. Every place of escape is gone; no one cares for my life.
  - range: 5-7
    heading: Thou art my refuge
    plain: |
      I cry to You, LORD. I say, “You are my refuge, my portion in the land of the living.” Listen to my cry, for I am brought very low. Deliver me from those who pursue me, for they are too strong for me. Bring me out of prison, so that I may give thanks to Your name. The righteous will surround me, for You will deal generously with me.

notes:
  - ref: 0
    phrase: when he was in the cave
    kind: history
    title: Which cave
    body: |
      The title does not say which cave, and the story of David’s flight has two. He “escaped to the cave Adullam” ([[1 Sam. 22:1]]), and later, in the wilderness of En-gedi, “David and his men remained in the sides of the cave” while Saul came into it ([[1 Sam. 24:3]]). The note on the title of Psalm 57 sets the two side by side ([[Ps. 57:1]]). Nothing in this psalm decides between them.

      “Maschil,” the title’s first word, is explained at [[Ps. 32:1]].
    sources: [lds-scriptures]

  - ref: 4
    phrase: I looked on my right hand, and beheld, but there was no man that would know me
    kind: symbol
    title: The empty place at the right hand
    body: |
      The right hand is where a defender stands, and the speaker’s complaint is that the place is empty. Another psalm says of the LORD that “he shall stand at the right hand of the poor, to save him” ([[Ps. 109:31]]); the image is explained at [[Ps. 110:5]].

      The King James has the speaker doing the looking: “I looked.” A modern translation reads the verbs as a request made to God, “Look on my right hand and see,” and continues, “there is no one who takes notice of me.” On that reading the verse is still prayer: he asks the LORD to inspect his right side. The ancient Greek translation agrees with the King James, “I looked on my right hand.” Either way the fact reported is the same.

      Read beside Samuel, “no man” is not a count of heads. At Adullam “there were with him about four hundred men” ([[1 Sam. 22:2]]), and at En-gedi his men were in the cave with him. The psalm says only that he looked and no one knew him.
    sources: [lds-scriptures, nrsvue, lxx-rahlfs, delitzsch-psalms]

  - ref: 5
    phrase: my portion in the land of the living
    kind: scripture
    title: The LORD as a share of land
    body: |
      “Portion” is the word for a share of land, and the speaker says that his share is the LORD. This verse is listed with those where the LORD Himself is the possession of His servants, beginning with the priests, who had no inheritance in the land and were told, “I am thy part and thine inheritance” ([[Num. 18:20]]); [[Ps. 73:26]] has the note on that. Lamentations has the same words: “The LORD is my portion, saith my soul; therefore will I hope in him” ([[Lam. 3:24]]).

      “The land of the living” is set against death in another psalm: “thou hast delivered my soul from death,” and so “I will walk before the LORD in the land of the living” ([[Ps. 116:8–9]]). The speaker claims his portion there while the persecutors are still stronger than he is.
    sources: [bdb, lds-scriptures]

  - ref: 7
    phrase: Bring my soul out of prison
    kind: scripture
    title: The prison and Isaiah’s servant
    body: |
      Isaiah uses this psalm’s word for “prison,” with the same verb of bringing out, for the work of the LORD’s servant. The title has David in a cave, not a jail, and the psalm speaks of no other confinement. For “my soul” a modern translation has simply “me”: “Bring me out of prison,” with the reason given as “so that I may give thanks to your name.” He asks for release in order to praise.

      The servant in Isaiah is sent “to bring out the prisoners from the prison” ([[Isa. 42:7]]; see the note there), a line that has been read as “figurative of exile.” In the psalm one man asks to be brought out. In Isaiah bringing prisoners out is the task the LORD gives His servant.
    sources: [bdb, nrsvue, lds-scriptures]

  - ref: 7
    phrase: the righteous shall compass me about
    kind: words
    title: Surround, crown, or wait
    body: |
      The verb is uncertain, and on each of the three ways it has been taken the righteous have a stake in what happens to the speaker. Its basic sense is to surround. Elsewhere it is used “of surrounding an enemy,” and in another form it is the verb for the bulls that “have beset me round” ([[Ps. 22:12]]). Here the King James and a modern translation keep that sense and make it friendly: “The righteous will surround me.”

      A second reading, a “dubious” one, takes the verb from the noun for a crown: the righteous “throw out crowns,” which is “figurative for triumph, because of me.” Against it, that noun is “very late.” The ancient Greek has a third, “the righteous shall wait for me, until thou recompense me,” and in Aramaic the verb means to “wait, hope for.”

      They gather round him, or triumph over his deliverance, or wait to see it. In verse 4 no man would know him.
    sources: [bdb, nrsvue, lxx-rahlfs]

christ: |
  When no man is at his right hand, the speaker turns to the LORD, who is Jehovah, the Savior before His birth (see [[Ps. 110:1]]). The psalm says three things of Him: that He knows the path of a man whose spirit is overwhelmed, that He is a refuge when every other has failed, and that He can bring a soul out of prison.

explore: |
  - **The story the title points to.** [[1 Sam. 22:1–2]] and [[1 Sam. 24:1–22]], the two caves.
  - **The other psalm of the cave.** [[Ps. 57]], where the refuge is “the shadow of thy wings.”
  - **The psalms it shares words with.** [[Ps. 77:1–3]] and [[Ps. 143:3–4]].
  - **No man stood with me.** [[2 Tim. 4:16–17]], where Paul says that all forsook him and that “the Lord stood with me.”
  - **The opening of the prison.** [[Isa. 61:1]], which the Savior read in the synagogue at Nazareth ([[Luke 4:16–21]]).

parallels:
  - ref: 1 Sam. 22:1–2
    note: David escapes to the cave Adullam, and about four hundred men gather to him.
  - ref: 1 Sam. 24:3
    note: David and his men are in the cave at En-gedi when Saul enters it.
  - ref: Ps. 57:1
    note: The other psalm whose title sets it in the cave.
  - ref: Ps. 77:1–3
    note: The same opening cry, and the spirit “overwhelmed,” as in verses 1 and 3 (also Ps. 143:4).
  - ref: Ps. 109:31
    note: The LORD stands at the right hand of the poor; in verse 4 the right hand is empty.
  - ref: Lam. 3:24
    note: The LORD as the speaker’s portion, as in verse 5 (also Ps. 16:5; Ps. 73:26).
  - ref: Isa. 42:7
    note: The servant is sent to bring prisoners out of the prison, what verse 7 asks.

