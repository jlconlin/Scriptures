chapter: 56
title: What Time I Am Afraid
tagline: A hunted man says plainly that he is afraid, and twice answers the fear with the same words of trust; between the two he says that God has counted his wanderings and kept his tears.
when: 'By its title, David’s, when the Philistines took him in Gath'

setting: |
  The title ascribes the psalm to David and sets it in Gath, a Philistine city. The story is in [[1 Sam. 21:10–15]]: David, running from Saul, went to Achish the king of Gath, was recognised, and “was sore afraid” ([[1 Sam. 21:12]]). The title of Psalm 34 points to the same stay in Gath, and the fuller account of it is in the note there ([[Ps. 34:1]]). What a title is worth as evidence is discussed at [[Ps. 3:1]].

  The psalm stands in Book Two, where the speaker says “God” far more often than “the LORD” ([[Ps. 42:1]]). It is a lament, a prayer of complaint and petition that ends in a vow of praise (for the form, see [[Ps. 22:1]]). The enemies are never named. They are “man,” “flesh,” “they,” and once “the people.”

  It follows Psalm 55, whose speaker wished, “Oh that I had wings like a dove! for then would I fly away, and be at rest” ([[Ps. 55:6]]). The tune named in this psalm’s title is also about a dove, and on one older reading that is why the collector placed the two together: “no Psalm could be more appropriately appended.”

  Other scripture has two of its lines. The last verse stands almost word for word in [[Ps. 116:8–9]]. The confession of the refrain, that he will not fear what man can do, is also in [[Ps. 118:6]] and [[Heb. 13:6]], and the Lord says it to Joseph Smith as a command in [[D&C 122:9]].

thread: |
  The psalm does not pretend the speaker is unafraid. Verse 3 says, “What time I am afraid, I will trust in thee,” and verse 4 says, “I will not fear.” **The psalm moves from the first sentence to the second, and it makes that move twice.**

  It is built in two rounds. Each begins with the enemies (verses 1–2 and 5–7) and ends with the same refrain: “In God I will praise his word, in God I have put my trust; I will not fear what flesh can do unto me” (verse 4; verses 10–11). The complaint is of something that never stops. A modern translation has “all day long” three times, in verses 1, 2 and 5, where the King James has “daily” and “Every day.” The psalm also speaks twice of a single day. “What time I am afraid” is in Hebrew “the day I am afraid,” and verse 9 has the word again: the enemies will turn back “in the day when I call.”

  The second round adds what the first did not have. Before the refrain returns, the speaker says what God has done with his trouble: He has counted the wanderings, and the tears are in His bottle and His book (verse 8). Then comes the one flat statement of knowledge in the psalm: “this I know; for God is for me” (verse 9). The refrain that follows is longer than the first, and it carries the psalm’s only use of the divine name.

  The enemies have not gone when the psalm ends. The speaker turns to the vows he owes and speaks of the rescue as done: “thou hast delivered my soul from death.” The psalm ends with him walking before God “in the light of the living.”

sections:
  - range: 1-2
    heading: Trampled all day long
    plain: |
      Be gracious to me, God, for men trample on me; all day long a fighter presses me hard. My enemies trample on me all day long. There are many who fight against me, O Most High.
  - range: 3-4
    heading: The refrain, the first time
    plain: |
      On the day I am afraid, I put my trust in You. In God, whose word I praise, in God I trust. I will not fear. What can flesh do to me?
  - range: 5-7
    heading: What the watchers do
    plain: |
      All day long they twist my words; every plan they make is to do me harm. They band together, they hide, they watch my steps, hoping to take my life. Shall they escape for all this wrong? In Your anger bring the peoples down, O God.
  - range: 8-11
    heading: Counted, kept, and the refrain again
    plain: |
      You have counted my wanderings. Put my tears in Your bottle; are they not in Your book? Then my enemies will turn back, on the day I call. This I know: God is for me. In God, whose word I praise, in the LORD, whose word I praise, in God I trust. I will not be afraid. What can man do to me?
  - range: 12-13
    heading: Vows to pay
    plain: |
      I am bound by my vows to You, O God; I will pay You thank offerings. For You have delivered my life from death. Have You not kept my feet from stumbling, so that I may walk before God in the light of the living?

notes:
  - ref: 0
    phrase: Jonath-elem-rechokim
    kind: words
    title: A tune about a dove far away
    body: |
      Jonath-elem-rechokim is most likely the name of the tune the psalm was sung to, and its three Hebrew words have been rendered “The silent dove among the far off.” Titles of this kind “are all probably names of tunes, well known at the time, to which the Psalms were appointed to be sung.” The middle word is the uncertain one. As the Hebrew text is pointed it is a noun for “silence,” found here “in name of melody.” Read with other vowels it is a word for trees, and a modern translation prints the title that way: “according to The Dove on Far-off Terebinths.”

      The ancient Greek translators did not treat the words as a name. They interpreted them, and wrote that the psalm is “concerning the people that were removed from the sanctuary.”

      Why this tune for this psalm? One older reading is that “the melody is chosen with reference to that situation”: a song about a dove far from home, for a man among foreigners.

      The title’s other terms are explained where they first appear: “To the chief Musician” at [[Ps. 8:1]] and “Michtam” at [[Ps. 16:1]].
    sources: [bd-psalms, bdb, nrsvue, lxx-rahlfs, delitzsch-psalms]

  - ref: 0
    phrase: when the Philistines took him in Gath
    kind: history
    title: Taken, where Samuel says he went
    body: |
      The title says the Philistines “took” David, while the narrative says he went to them. He “fled that day for fear of Saul, and went to Achish the king of Gath” ([[1 Sam. 21:10]]). The narrative’s own words come close to the title’s. The king’s servants knew him as the David of the victory songs (see [[1 Sam. 21:11]]); he feigned madness “in their hands” ([[1 Sam. 21:13]]), and Achish asked his servants, “wherefore then have ye brought him to me?” ([[1 Sam. 21:14]]). The Greek title has “when the Philistines caught him.”

      The psalm itself names no place and mentions no madness. What it shares with the story is fear. The narrative says David “was sore afraid of Achish” ([[1 Sam. 21:12]]), and the psalm has “What time I am afraid” (verse 3). He left Gath alive: “David therefore departed thence, and escaped to the cave Adullam” ([[1 Sam. 22:1]]).

      Psalm 34 is set by its title in the same stay at Gath, and the note there tells the story more fully ([[Ps. 34:1]]).
    sources: [lds-scriptures, lxx-rahlfs]

  - ref: 1
    phrase: swallow me up
    kind: words
    title: Swallowed, or trampled
    body: |
      The verb behind “swallow me up” can also mean “trample upon, crush,” and that is how the lexicon takes it here. A modern translation has “people trample on me,” and the ancient Greek translation “man has trodden me down.” The King James follows the verb’s other sense, to pant or gasp after something. The verb comes twice, in verse 1 and again in verse 2.

      The word for “man” in this verse is *enosh*, a word for humankind that the Old Testament often uses “opposed to God.” The verse sets the two words side by side, “O God” and “man,” and the refrain does the same when it asks what flesh, or man, can do to one who trusts in God (verses 4 and 11).
    sources: [bdb, nrsvue, lxx-rahlfs, oshb-wlc]

  - ref: 2
    phrase: O thou most High
    kind: words
    title: A title of God, or a word about the enemies
    body: |
      “O thou most High” translates a single Hebrew word, *marom*, “height,” and it is not certain that it is spoken to God. Some have taken it as a description of the enemies, who fight “proudly,” from on high; the lexicon records that reading and calls it “dubious.” A modern translation keeps it as an address, “O Most High,” but moves it to the head of the next sentence, so that it leads into “when I am afraid.” The Greek translation has no such words in this verse at all.

      The King James reading is a possible one, and the rest of the psalm does not depend on the choice.
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs]

  - ref: 4
    phrase: I will not fear what flesh can do unto me
    kind: structure
    title: The refrain, and where else scripture has it
    body: |
      This line is a refrain: it comes back in verses 10–11, though not unchanged. The first time the enemy is “flesh”; the second time he is “man,” in Hebrew *adam*. With *enosh* in verse 1, that makes three different words for the people who hunt him. None of them is a name. A modern translation turns the second refrain as “What can a mere mortal do to me?” The second refrain also has a line the first lacks (see the note on verse 10).

      The refrain comes directly after an admission of fear. Verse 3 says “What time I am afraid,” and the refrain says “I will not fear.” Trust stands between the two sentences: “I will trust in thee.”

      Other scripture has the confession. Another psalm has it nearly word for word: “The LORD is on my side; I will not fear: what can man do unto me?” ([[Ps. 118:6]]). Hebrews gives it to the Saints as their own: “So that we may boldly say, The Lord is my helper, and I will not fear what man shall do unto me” ([[Heb. 13:6]]). And the Lord said it to Joseph Smith, “while a prisoner in the jail at Liberty, Missouri,” as a command with a reason attached: “fear not what man can do, for God shall be with you forever and ever” ([[D&C 122:9]]).
    sources: [oshb-wlc, nrsvue, lds-scriptures]

  - ref: 7
    phrase: Shall they escape by iniquity?
    kind: words
    title: A question, or a plea
    body: |
      The King James reads this line as a question, and other versions read it as a plea. The question asks whether they are to get away with it. A modern translation makes it a request instead, “Do not deliver them for any reason,” and notes that it is following the Greek and that the Hebrew as it stands says “deliver them because of their iniquity.” The Greek translation has “Thou wilt on no account save them.”

      “The people” is plural in the Hebrew: “cast down the peoples.”

      The verse asks God to act and says nothing of what the speaker will do. How prayers of this kind are read is the note at [[Ps. 137:8]].
    sources: [nrsvue, lxx-rahlfs, oshb-wlc]

  - ref: 8
    phrase: put thou my tears into thy bottle
    kind: symbol
    title: A skin of tears and a book
    body: |
      The verse says three times over that God has kept account of the fugitive’s misery: He has counted his wanderings, He is asked to store his tears, and they are in His book. “Tellest” is old English for counting, and a modern translation has “You have kept count.”

      The bottle is a “skin-bottle,” the leather bag in which wine and milk were carried, used here “for tears” as a figure.

      The image comes with a play on words. “My wanderings” is in Hebrew *nod*, a word found only here, for the “wandering of aimless fugitive,” and “thy bottle” is another word that sounds the same; the lexicon marks the “word-play.” God has taken the count of his *nod*, and so he asks that his tears be put in God’s *nod*.

      The third clause is a question: “are they not in thy book?” The Old Testament speaks elsewhere of a book kept before the Lord, “a book of remembrance” that “was written before him for them that feared the LORD” ([[Mal. 3:16]]).
    sources: [bdb, oshb-wlc, nrsvue, lds-scriptures]

  - ref: 10
    phrase: in the LORD will I praise his word
    kind: words
    title: The one place the psalm says LORD
    body: |
      This added line holds the only use of the divine name in the psalm. Everywhere else, nine times, the speaker says “God.” That is the habit of this part of the Psalter (see [[Ps. 42:1]]), and one older reading explains the pairing by it: “Because the thought is repeated, Elohim stands in the first case and then Jahve, in accordance with the Elohimic Psalm style.” The name comes after “this I know; for God is for me” (verse 9).

      What is “his word”? The psalm does not say. On the same older reading it is a promise: the speaker “has the word of His promise on his side,” and he will praise it when it is “gloriously verified in him.” In the first refrain the Hebrew has “his word,” and here it has only “word,” twice; the King James supplies “his.”
    sources: [oshb-wlc, delitzsch-psalms]

  - ref: 12
    phrase: Thy vows are upon me
    kind: words
    title: Vows he owes, and thank offerings
    body: |
      “Thy vows” are the vows he has made to God, and “upon me” says he is bound to keep them. A modern translation has “My vows to you I must perform.” A lament often ends with a promise of praise (see [[Ps. 22:1]]). The word translated “praises” is *todah* in the plural, which is both “thanksgiving” and the name of a sacrifice, the “thank-offering”; the modern translation has “I will render thank offerings to you.” The Psalms set vows and thank offerings side by side more than once, as in [[Ps. 50:14]].
    sources: [nrsvue, bdb]

  - ref: 13
    phrase: in the light of the living
    kind: scripture
    title: The light of the living, and Psalm 116
    body: |
      The last verse stands in another psalm as the thanksgiving of someone already rescued: “For thou hast delivered my soul from death, mine eyes from tears, and my feet from falling. I will walk before the LORD in the land of the living” ([[Ps. 116:8–9]]). The Hebrew words for the feet kept from “stumbling” are the same in both. Psalm 116 has “land” where this psalm has “light,” and the ancient Greek translation reads “land of the living” here as well.

      “The light of the living,” or “light of life,” is also in Job, in the same Hebrew words. Elihu says that God works with a man “To bring back his soul from the pit, to be enlightened with the light of the living” ([[Job 33:30]]). The pit is its opposite there, as death is here. One older reading sets the phrase against “the night of Hades” and holds that it “is not exclusively the sun-light of this present life.” The same reading sets beside it the Savior’s words: “I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life” ([[John 8:12]]).

      The King James makes the middle of the verse a question, “wilt not thou deliver my feet from falling,” and a modern translation makes it part of the statement, so that the rescue from death goes straight on with “and my feet from falling.”
    sources: [lds-scriptures, bdb, lxx-rahlfs, delitzsch-psalms, nrsvue]

christ: |
  The God in whom the speaker puts his trust is named once, in verse 10: “in the LORD will I praise his word.” That name is Jehovah, and “Jehovah is the premortal Jesus Christ.” Hebrews puts the refrain’s confession in the mouths of the Saints, with “The Lord is my helper” ([[Heb. 13:6]]); the note on verse 4 has the line in full.

explore: |
  - **The day at Gath.** Read [[1 Sam. 21:10–15]] and [[1 Sam. 22:1]], and then Psalm 34, which its title sets in the same stay at Gath ([[Ps. 34:1]]).
  - **The same words after the rescue.** [[Ps. 116:1–9]] ends where this psalm ends, with the tears wiped away.
  - **The refrain elsewhere in scripture.** [[Ps. 118:5–9]], [[Heb. 13:5–6]], and [[D&C 122:7–9]].
  - **The other Michtams.** Psalms 56–60 all carry the word. The next psalm’s title sets it in the cave, with David in flight from Saul ([[Ps. 57:1]]).

parallels:
  - ref: 1 Sam. 21:10–15
    note: The occasion the title names, when David was at the court of Achish of Gath and “was sore afraid.”
  - ref: Ps. 116:8–9
    note: Nearly the same words, as the thanksgiving of one already delivered.
  - ref: Ps. 118:6
    note: The refrain’s confession, nearly word for word.
  - ref: Heb. 13:6
    note: The same confession given to the Saints to say boldly.
  - ref: D&C 122:9
    note: The same words as the Lord’s command to Joseph Smith in Liberty Jail.
  - ref: Mal. 3:16
    note: A book of remembrance written before the Lord, beside the book of verse 8.
  - ref: Job 33:30
    note: Elihu’s “light of the living,” the same Hebrew phrase.

