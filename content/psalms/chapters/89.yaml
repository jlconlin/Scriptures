chapter: 89
title: Where Are Thy Former Lovingkindnesses?
tagline: A singer praises the LORD’s faithfulness, recites His oath that David’s throne will stand like the sun, and then lays a fallen crown before Him and asks where that faithfulness has gone.
when: 'By its title, of Ethan the Ezrahite; after a king of David’s line was defeated and his throne cast down, and which king is debated'

setting: |
  Psalm 89 is the last psalm of the third of the Psalter’s five books (Psalms 73 through 89), and its last verse is that book’s closing blessing. It is counted among the royal psalms, the ones concerned with Israel’s king, and the heading in the Church’s edition calls it “a messianic psalm.”

  Its subject is the promise the LORD made to David through the prophet Nathan: that He would set up David’s seed after him, be a father to his heir, and “thy throne shall be established for ever” ([[2 Sam. 7:16]]). The psalm calls that promise a covenant and an oath, and gives it nineteen verses in the LORD’s own voice.

  The singer speaks as though the promise has failed. A king of David’s line has lost in battle, his walls are broken, and his crown and throne lie on the ground (verses 38–45). The psalm does not name him; the note on verse 45 gives the two answers that have been proposed.

  The New Testament takes up its words. Paul’s sermon in the synagogue at Antioch has the words of verse 20, “I have found David” ([[Acts 13:22]]), and John’s greeting to the seven churches names Jesus Christ with titles drawn from verses 27 and 37 ([[Rev. 1:5]]). This chapter takes the psalm first as a prayer about Israel’s king, and afterward what the New Testament does with it.

thread: |
  Psalm 89 is built on **two words and a contradiction**. The words are “mercy” and “faithfulness,” set side by side in the first verse, and each comes seven times in the psalm.

  The psalm has three parts. The first is a hymn (verses 1–18): the singer vows to sing the LORD’s mercies “for ever,” and praises the God whom no one in heaven equals, who rules the sea and founded the world. The second is the oath (verses 19–37): David found, anointed, and named firstborn; his throne to last like the sun, even if his sons forsake the law. “My covenant will I not break.”

  The turn is verse 38: “But thou.” Nothing prepares for it. For thirty-seven verses the singer has said what God is and what God swore. Now, in eight verses of “thou hast,” he tells God what God has done, and he says it in the oath’s own words (see the note on verse 39). The praise of the first part has become the ground of the charge.

  A lament usually ends in a vow of praise (its parts are set out at [[Ps. 22:1]]). This one ends in questions: “How long?” and “Where are thy former lovingkindnesses?” Its vow of praise stands at the beginning instead, in verse 1, and its last line is about the taunts that follow the anointed king. The blessing of verse 52 belongs to the book.

sections:
  - range: 1-4
    heading: I will sing of the mercies of the LORD
    plain: |
      I will sing of the LORD’s mercies for ever; to every generation I will make Your faithfulness known. For I have said: mercy will be built up for ever, and You will set Your faithfulness firm in the heavens themselves. “I have made a covenant with my chosen one; I have sworn to David my servant: I will establish your seed for ever and build your throne for all generations.”
  - range: 5-14
    heading: Who in the heaven can be compared unto the LORD?
    plain: |
      The heavens praise Your wonders, O LORD, and Your faithfulness is praised in the assembly of the holy ones. Who in the skies compares with the LORD? Who among the heavenly beings is like the LORD? God is held in awe in the council of the holy ones, feared above all who stand around Him. O LORD God of hosts, who is mighty like You, with Your faithfulness all around You? You rule the raging sea; when its waves rise, You still them. You crushed Rahab like one slain and scattered Your enemies with Your strong arm. The heavens are Yours and the earth is Yours; You founded the world and everything in it. You made north and south; Tabor and Hermon rejoice in Your name. Your arm is mighty, Your hand strong, Your right hand lifted high. Justice and judgment are the foundation of Your throne; mercy and truth go before Your face.
  - range: 15-18
    heading: Blessed is the people that know the joyful sound
    plain: |
      Blessed are the people who know the festal shout; they walk, O LORD, in the light of Your face. They rejoice in Your name all day long, and in Your righteousness they are lifted up. For You are the glory of their strength, and by Your favor our horn is raised. For the LORD is our defence, and the Holy One of Israel is our king.
  - range: 19-29
    heading: I have found David my servant
    plain: |
      Once You spoke in a vision to Your faithful one and said: “I have given help to a mighty man; I have raised up one chosen out of the people. I have found David my servant and anointed him with my holy oil. My hand will hold him fast and my arm will strengthen him. No enemy will get the better of him, and no wicked man will afflict him. I will beat down his foes before him and strike those who hate him. My faithfulness and my mercy will be with him, and in my name his horn will be raised. I will set his hand on the sea and his right hand on the rivers. He will cry to me, ‘You are my father, my God, and the rock of my salvation,’ and I will make him my firstborn, higher than the kings of the earth. I will keep my mercy for him for ever, and my covenant with him will stand. I will make his seed last for ever, and his throne as long as the heavens.
  - range: 30-37
    heading: My covenant will I not break
    plain: |
      “If his children forsake my law and do not walk in my judgments, if they break my statutes and do not keep my commandments, then I will punish their transgression with the rod and their iniquity with stripes. But I will not take my lovingkindness from him, and I will not let my faithfulness fail. I will not break my covenant or change what has gone out of my lips. Once I have sworn by my holiness, and I will not lie to David: his seed will last for ever, and his throne like the sun before me. It will be established for ever like the moon, and like a faithful witness in heaven.”
  - range: 38-45
    heading: But thou hast cast off
    plain: |
      But You have cast off and rejected; You have been angry with Your anointed. You have made void the covenant with Your servant and profaned his crown by throwing it to the ground. You have broken down all his walls and laid his strongholds in ruins. Everyone who passes by plunders him; he is a reproach to his neighbors. You have raised the right hand of his adversaries and made all his enemies glad. You have turned back the edge of his sword and have not held him up in battle. You have ended his glory and thrown his throne to the ground. You have cut short the days of his youth and covered him with shame.
  - range: 46-51
    heading: How long, LORD?
    plain: |
      How long, O LORD? Will You hide Yourself for ever? Will Your wrath burn like fire? Remember how short my time is. Have You made all men for nothing? What man lives and does not see death, or delivers his soul from the power of Sheol? Lord, where are Your former lovingkindnesses, which You swore to David in Your faithfulness? Remember, Lord, the reproach of Your servants, how I carry in my bosom the reproach of all the mighty peoples, the taunts with which Your enemies, O LORD, have taunted the footsteps of Your anointed.
  - range: 52-52
    heading: Amen, and Amen
    plain: |
      Blessed be the LORD for evermore. Amen, and Amen.

notes:
  - ref: 0
    phrase: Ethan the Ezrahite
    kind: history
    title: Ethan the Ezrahite
    body: |
      The title names a sage remembered beside Solomon, the Ethan whom Kings lists with Heman among the wise men Solomon surpassed ([[1 Kgs. 4:31]]). The psalm before this one is titled for Heman the Ezrahite, and what scripture says of the pair is set out at the title of [[Ps. 88]].

      There was another Ethan, a Levite, whom David appointed a singer with Heman and Asaph ([[1 Chr. 15:17]]; [[1 Chr. 15:19]]). The two have been made into one man, but they may be two: the Ezrahite was “of the tribe of Judah,” the singer “of the tribe of Levi.”

      How a sage of Solomon’s day could sing of a throne of David’s line cast down is taken up at verse 45. What a psalm’s title is worth is discussed at the title of [[Ps. 3]], and *Maschil* is explained at the title of [[Ps. 32]].
    sources: [lds-scriptures, delitzsch-psalms]

  - ref: 1
    phrase: the mercies of the LORD
    kind: structure
    title: Mercy and faithfulness, seven times each
    body: |
      The first verse sets out the psalm’s two words, and each comes seven times. “Mercies” is *hesed* (explained at [[Ps. 51:1]]). The King James has it as “mercy” or “mercies” in verses 1, 2, 14, 24 and 28 and as “lovingkindness” in verses 33 and 49. “Faithfulness” is one Hebrew word in verses 1, 2, 5, 8, 24 and 33, and the same word is “truth” in verse 49.

      The two words pass from voice to voice. The singer praises them (verses 1–2, 5, 8, 14). The LORD takes them up in the oath: “my faithfulness and my mercy shall be with him” (verse 24). The last time either appears, both are in one question: “Lord, where are thy former lovingkindnesses, which thou swarest unto David in thy truth?” (verse 49). The words the psalm opens by promising to sing are the words it ends by asking after.

      A third word binds them to the oath. “Sworn” in verses 3 and 35 and “swarest” in verse 49 are one verb.
    sources: [oshb-wlc]

  - ref: 3
    phrase: I have made a covenant with my chosen
    kind: scripture
    title: Nathan’s promise, called a covenant and an oath
    body: |
      The covenant is the promise Nathan brought to David when David wished to build the LORD a house. The LORD answered that He would make David a house instead: “I will set up thy seed after thee” ([[2 Sam. 7:12]]), “I will be his father, and he shall be my son” ([[2 Sam. 7:14]]), and “thy throne shall be established for ever” ([[2 Sam. 7:16]]). Verses 3–4 gather its words (servant, seed, throne, build, for ever), and verses 19–37 give it at length.

      The psalm names the promise a covenant and says the LORD swore it, and other scripture speaks of it the same way. David’s last words were that God “hath made with me an everlasting covenant, ordered in all things, and sure” ([[2 Sam. 23:5]]). Another psalm says, “The LORD hath sworn in truth unto David; he will not turn from it” ([[Ps. 132:11]]). Peter, on the day of Pentecost, said David knew “that God had sworn with an oath to him” ([[Acts 2:30]]).
    sources: [lds-scriptures]

  - ref: 5
    phrase: in the congregation of the saints
    kind: words
    title: The saints are the holy ones of heaven
    body: |
      The lines themselves put the “saints” of verses 5 and 7 in heaven. The congregation of verse 5 answers to “the heavens” in the first half of the verse, and verse 6 asks who “in the heaven” can be compared with the LORD. The Hebrew word is “holy ones”; a modern translation has “the assembly of the holy ones” and “the council of the holy ones.” The “sons of the mighty” in verse 6 are in Hebrew *bene elim*, where *elim* is a plural of *El*, a word for God. The ancient Greek translation has “the sons of God,” and the modern one “the heavenly beings.”

      A Latter-day Saint study reads these verses as the heavenly council with which Psalm 82 opens (see [[Ps. 82:1]]): it finds here “a striking depiction of the divine assembly,” and argues from these verses that the gods of that psalm “must be divine beings.” The footnotes of the Church’s edition attach to “congregation” and “saints” the topical entries on the Church and on Saints.
    sources: [oshb-wlc, nrsvue, lxx-rahlfs, smoot-council-hebrew-bible, lds-scriptures]

  - ref: 10
    phrase: Thou hast broken Rahab in pieces
    kind: symbol
    title: Rahab is the sea monster, and Egypt
    body: |
      Rahab here is a sea monster and a name for a nation. It is a “mythical sea monster,” set in this verse beside the sea. Isaiah sets it beside the dragon and the crossing of the Red Sea: “Art thou not it that hath cut Rahab, and wounded the dragon?” ([[Isa. 51:9]]). Another psalm lists Rahab with Babylon among the nations ([[Ps. 87:4]]), and there it is an “emblematic name of Egypt.” Leviathan, the monster’s other name, is explained at [[Ps. 74:14]].

      Rahab, Leviathan and the raging waves “symbolized the powers of chaos, or those forces that endanger the lives of mortal beings.” Such verses are widely read as recalling an old story in which the LORD “kills a cosmic sea-monster,” and the psalm does go straight on to the founding of the world (verses 11–12).

      The stilling of the waves in verse 9, and the Savior’s stilling of the sea, are taken up in the note on [[Ps. 65:7]].
    sources: [bdb, sc-knowhy-34, sc-knowhy-866, lds-scriptures]

  - ref: 15
    phrase: the joyful sound
    kind: words
    title: The joyful sound is a shout
    body: |
      The “joyful sound” is *teruah*, a shout or a blast of horns, and here the shout of worship. The word means a “shout or blast of war, alarm, or joy,” and its use in this verse is the “shout of joy with religious impulse.” Balaam used the word of Israel in the wilderness: “the LORD his God is with him, and the shout of a king is among them” ([[Num. 23:21]]). A modern translation has “Happy are the people who know the festal shout.”

      With this verse the psalm comes down from the heavens to a people, and by verses 17–18 the voice is their own: “our horn,” “our king.” (The horn is explained at [[Ps. 18:2]].) On one reading they are “the mortal congregation” answering the wonders just recited, and their shout is “the appropriate reaction to the revelation of God’s mysteries.” That is a proposal, made from later hymns among the Dead Sea Scrolls that reuse this psalm.

      For “the light of thy countenance,” see the note on [[Ps. 4:6]].
    sources: [bdb, nrsvue, larsen-dust-crown, lds-scriptures]

  - ref: 19
    phrase: Then thou spakest in vision to thy holy one
    kind: history
    title: The vision, and who received it
    body: |
      Scripture records such a vision on the night Nathan was sent to David: “According to all these words, and according to all this vision, so did Nathan speak unto David” ([[2 Sam. 7:17]]). The Hebrew text as printed has a plural, thy faithful ones; some manuscripts have the singular that the King James follows. One older reading takes the plural as Samuel and Nathan, because the speech joins “what was revealed to these two prophets concerning David”: Samuel found and anointed him (verse 20; see [[1 Sam. 16:13]]), and Nathan brought the promise. Another takes it as the people of Israel, for whom the promise was meant.

      The word translated “holy one” is *hasid*, which describes a person by “active practice” of *hesed*, the mercy this psalm sings.

      The speech stays close to Nathan’s words. “Nor the son of wickedness afflict him” (verse 22) answers “neither shall the children of wickedness afflict them any more” ([[2 Sam. 7:10]]). “Thou art my father” (verse 26), the rod and the stripes (verse 32), and the mercy that is not taken away (verse 33) come from [[2 Sam. 7:14–15]].
    sources: [oshb-wlc, bdb, delitzsch-psalms, cambridge-psalms, lds-scriptures]

  - ref: 27
    phrase: I will make him my firstborn
    kind: words
    title: The youngest son made firstborn, and highest of kings
    body: |
      Firstborn here is a rank that is given, not an order of birth. David was the last of Jesse’s sons: “There remaineth yet the youngest, and, behold, he keepeth the sheep” ([[1 Sam. 16:11]]). In the patriarchal order the firstborn son “is the heir and inherits the leadership of the family,” and the standing could be given to another, as when Joseph “received the inheritance as though he were the firstborn.” The LORD had already given the title to a whole people: “Israel is my son, even my firstborn” ([[Ex. 4:22]]).

      “Higher” is *elyon*, the word that as a title of God is “Most High.” It is used here “of Davidic king exalted above monarchs,” as it is in the promise to Israel that the LORD “will set thee on high above all nations of the earth” ([[Deut. 28:1]]). What was promised to the nation is promised here to its king.

      Verse 26 gives the other half: the king will call God “my father.” These verses stand with the others in which God calls Israel’s king His son, “showing the special relationship between God and the king” (see [[Ps. 2:7]]).
    sources: [lds-scriptures, bd-firstborn, oshb-wlc, bdb, sc-knowhy-865]

  - ref: 30
    phrase: If his children forsake my law
    kind: scripture
    title: The sons may be punished; the oath stands
    body: |
      The “if” of verse 30 governs the sons’ punishment and not the promise. Nathan’s words had the same two parts: “If he commit iniquity, I will chasten him with the rod of men” ([[2 Sam. 7:14]]), and then, “But my mercy shall not depart away from him” ([[2 Sam. 7:15]]). The psalm widens “he” to “his children” and keeps the order: the rod and the stripes in verse 32, and then “Nevertheless.”

      Another psalm of the oath places its “if” differently: “If thy children will keep my covenant and my testimony that I shall teach them, their children shall also sit upon thy throne for evermore” ([[Ps. 132:12]]). There the sons’ sitting on the throne is conditional. Here only their chastening is, and of the oath itself the LORD says, “My covenant will I not break” (verse 34).

      Jeremiah, as the kingdom was falling, has the LORD tie the promise to the order of the sky as verses 36–37 do: “If ye can break my covenant of the day, and my covenant of the night” ([[Jer. 33:20]]), “Then may also my covenant be broken with David my servant” ([[Jer. 33:21]]).
    sources: [lds-scriptures, nrsvue]

  - ref: 37
    phrase: as a faithful witness in heaven
    kind: christ
    title: John’s titles for Jesus Christ come from this psalm
    body: |
      John’s greeting in Revelation gives Jesus Christ titles from the oath. He greets the seven churches from “Jesus Christ, who is the faithful witness, and the first begotten of the dead, and the prince of the kings of the earth” ([[Rev. 1:5]]). The faithful witness is from this verse; the firstborn and “higher than the kings of the earth” are from verse 27. The high promise to David was “never fully realised in any of his successors,” and John’s language is “borrowed from” the two verses.

      In the psalm it is hard to say what the witness is. “Is it the sun, or the moon, or the rainbow?” On another construal of the Hebrew the line reads “and the witness in the sky is faithful,” and “the witness is God Himself, Who thus confirms His promise.” John gives the title to the Son.

      The heading in the Church’s edition reads verse 27 the same way, of “God’s Firstborn.” Jesus is “the firstborn of the spirit children of our Heavenly Father” and “the first to rise from the dead,” as Paul calls Him “the firstborn from the dead” ([[Col. 1:18]]).
    sources: [cambridge-psalms, bd-firstborn, lds-scriptures]

  - ref: 39
    phrase: thou hast profaned his crown
    kind: structure
    title: The complaint in the oath’s own words
    body: |
      The complaint turns the words of the oath back on the One who swore it. In the oath the LORD said, “My covenant will I not break” (verse 34). The verb is the one used of the sons who “break my statutes” (verse 31), and it is the verb of this verse, “thou hast profaned his crown.” One Hebrew word stands in all three places: for what the sons might do to the law, for what God swore not to do to the covenant, and for what the singer says God has done to the crown.

      Other words return the same way. The LORD had said, “I have exalted one chosen out of the people” (verse 19) and “in my name shall his horn be exalted” (verse 24); now, with the same verb, “Thou hast set up the right hand of his adversaries” (verse 42). He promised to “beat down his foes” (verse 23); now He has “made all his enemies to rejoice.” The throne that was to be “as the sun” (verse 36) is “cast … down to the ground” (verse 44).

      The crown the singer says has been profaned is *nezer*, a word for consecration: a crown is a “sign of consecration,” and the word is also used of the high priest’s. “Made void” translates a rare verb whose “exact meaning” is “uncertain; probably (from context) abhor, spurn,” and which appears only here and at [[Lam. 2:7]].

      The complaint has no confession in it. The oath allowed for the rod (verse 32); what the singer protests is a covenant made void.
    sources: [oshb-wlc, bdb]

  - ref: 45
    phrase: The days of his youth hast thou shortened
    kind: history
    title: Which king?
    body: |
      The psalm does not name the king, and two answers have been given. One keeps the title. Ethan “may have survived king Solomon” into the reign of his son. In that king’s fifth year ([[1 Kgs. 14:25–28]]) Shishak of Egypt “conquered the fortified cities of Judah, and spoiled the Temple and Palace,” and so “the young Davidic king, whom loss and disgrace make prematurely old, is Rehoboam.”

      The other sets the psalm in the exile and takes the king as Jehoiachin ([[2 Kgs. 24:8]]). On this reading the psalm “can hardly be earlier than the destruction of Jerusalem and the downfall of the Davidic kingdom,” and its king was eighteen years old “when he came to the throne” and “reigned only three months and ten days” before he was carried to Babylon.

      Psalm 89 has also been counted among the “earlier psalms” that were “scattered throughout the book in strategic positions,” with no date given. The psalm itself names no enemy and no place, and it speaks of broken walls and strongholds without mentioning the temple or a captivity. The question is open.
    sources: [delitzsch-psalms, cambridge-psalms, sc-knowhy-439]

  - ref: 46
    phrase: How long, LORD? wilt thou hide thyself for ever?
    kind: scripture
    title: How long, and the shortness of a life
    body: |
      The plea rests on how short a life is: if the answer waits, the singer will not live to see it. Its first line is nearly that of the psalm on ruined Jerusalem, “How long, LORD? wilt thou be angry for ever? shall thy jealousy burn like fire?” ([[Ps. 79:5]]). Here the fear is that God will “hide” Himself.

      Then the voice becomes one person’s: “Remember how short my time is.” The Hebrew of verse 47 is difficult (a modern translation marks it “Meaning of Heb uncertain”), but verse 48 makes the point plain. No one escapes “the hand of the grave,” which is Sheol (see [[Ps. 6:5]]). The oath was “for ever”; the man asking about it has only his own days.

      “Remember” comes twice (verses 47 and 50). The singer asks God to remember two things, his own short time and the reproach His servants carry, and he asks nothing else. The psalm has no request for vengeance on the enemies.
    sources: [lds-scriptures, nrsvue]

  - ref: 52
    phrase: Blessed be the LORD for evermore
    kind: structure
    title: The blessing closes Book Three, not the lament
    body: |
      The last verse is the closing blessing of the Psalter’s third book, so the psalm’s own last words are those of verse 51. Each of the five divisions ends with a doxology, a “formal declaration of God’s power and glory”; the five are set side by side at [[Ps. 150:6]], and the one that closes Book Two is at [[Ps. 72:18]].

      In Hebrew the psalm proper ends on the word “thine anointed” (the word behind *Messiah*; see [[Ps. 2:2]]), in a sentence about enemies who taunt his footsteps. The lament gets no answer inside the psalm, and the third book ends with the question of verse 49 still standing. What follows the question is “Amen, and Amen.”
    sources: [ot-manual-psalms, oshb-wlc]

christ: |
  The psalm ends by asking where the mercies sworn to David have gone. The New Testament says the oath was kept in Jesus Christ. Gabriel told Mary, “the Lord God shall give unto him the throne of his father David” ([[Luke 1:32]]), and “of his kingdom there shall be no end” ([[Luke 1:33]]). Peter said that David knew “that God had sworn with an oath to him, that of the fruit of his loins, according to the flesh, he would raise up Christ to sit on his throne” ([[Acts 2:30]]).

  Paul’s sermon at Antioch has the words of verse 20, “I have found David” ([[Acts 13:22]]), and goes on, “Of this man’s seed hath God according to his promise raised unto Israel a Saviour, Jesus” ([[Acts 13:23]]). He then preached the Resurrection as the giving of “the sure mercies of David” ([[Acts 13:34]]). That is Isaiah’s phrase (see the note on [[Isa. 55:3]]), and its “mercies” is the plural of *hesed*, the word of verse 49’s question.

  John’s greeting in Revelation gives the Savior the oath’s titles ([[Rev. 1:5]]; see the note on verse 37).

explore: |
  - **The promise itself.** [[2 Sam. 7:1–17]], read beside verses 19–37.
  - **The other psalm of the oath.** [[Ps. 132:11–12]], where the LORD swears to David and the sons’ place on the throne has an “if.”
  - **The same promise as the kingdom fell.** [[Jer. 33:14–26]] and [[Isa. 55:3]], both on this site.
  - **The council of heaven.** [[Ps. 82:1]], and the note there.
  - **After the question.** [[Ps. 90]], which opens Book Four.
  - **Psalm 89 among the Dead Sea Scrolls.** David J. Larsen, “From Dust to Exalted Crown: Royal and Temple Themes Common to the Psalms and the Dead Sea Scrolls,” *Interpreter* 45 (2021), follows the psalm’s covenant, council and festal shout through the hymns found at Qumran.

parallels:
  - ref: 2 Sam. 7:12–16
    note: Nathan’s promise to David, which verses 3–4 name and verses 19–37 expand.
  - ref: Ps. 132:11–12
    note: The LORD has sworn to David; the sons’ place on the throne is conditional.
  - ref: Jer. 33:20–21
    note: The covenant with David is as sure as the covenant of day and night.
  - ref: Luke 1:32–33
    note: Gabriel promises Mary’s son the throne of his father David, and a kingdom without end.
  - ref: Acts 13:22–23
    note: Paul says “I have found David,” the words of verse 20, and adds that God has raised a Saviour from David’s seed.
  - ref: Rev. 1:5
    note: Jesus Christ is the faithful witness, the first begotten of the dead, and the prince of the kings of the earth, the titles of verses 27 and 37.

