    note: The next psalm says “his righteousness endureth for ever” of the man who fears the LORD.
  - ref: Prov. 9:10
    note: The saying of verse 10 in the same words.
  - ref: Job 28:28
    note: “The fear of the Lord, that is wisdom.”
  - ref: Ex. 34:6
    note: The LORD proclaims Himself “merciful and gracious,” the two words of verse 4.
  - ref: Ex. 12:14
    note: The Passover day is to be “a memorial”; one reading hears it in verse 4.
  - ref: Ps. 99:3
    note: The LORD’s name is “great and terrible,” the Hebrew word translated “reverend” in verse 9.
  - ref: Ps. 105:44
    note: He “gave them the lands of the heathen,” as in verse 6.

