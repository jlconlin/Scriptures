chapter: 111
title: The Beginning of Wisdom
tagline: One voice in the congregation praises the LORD for what He has done and commanded, and the hymn ends as a proverb about the fear of the LORD.
when: 'Undated; the psalm has no title'

setting: |
  The psalm has no title and names no author or occasion. It asks for nothing and mentions no enemy. From its second verse on it is a list of what the LORD has done and commanded.

  It is the first of three psalms in a row that open with “Praise ye the LORD” ([[Ps. 112:1]]; [[Ps. 113:1]]), the Hebrew hallelujah explained at [[Ps. 150:1]]. The three have been called “a trilogy of Hallelujah-Psalms.”

  In Hebrew it is an acrostic, the device explained at [[Ps. 9:1]]. After the hallelujah it has “twenty-two lines with the twenty-two letters of the alphabet at the beginning,” and “every line for the most part consists of three words.” The English shows nothing of the alphabet, but it does show the short, separate statements the form produced.

  Psalm 112 is built in the same way, and the two have been called “twin in form as in contents.” This psalm praises the LORD; the next describes the man who fears Him, partly in this psalm’s own words (see the note on verse 3).

thread: |
  Psalm 111 is **praise that turns into instruction**. It opens with one voice among many: after the summons “Praise ye the LORD,” a single worshipper says “I will praise,” and says where, “in the assembly of the upright, and in the congregation.”

  Verse 2 gives the plan. The works of the LORD are great, and they are “sought out of all them that have pleasure therein.” The “of” is the old English for “by”: a modern translation has “studied by all who delight in them.” The psalm then does that studying. Verses 3–6 go through the works: wonders made memorable, food for those who fear Him, a covenant kept in mind, the heritage of the nations given to His people.

  At verse 7 the subject shifts without a break. “The works of his hands” are verity and judgment, and in the same breath “all his commandments are sure.” What the LORD does and what He commands are praised in the same terms: both are true, and both last. His righteousness endures “for ever” (verse 3), the works and commandments stand fast “for ever and ever” (verse 8), the covenant is commanded “for ever” (verse 9), and so is His praise in the psalm’s last words (verse 10).

  Verse 9 brings the list to the LORD’s name, “holy and reverend.” Verse 10 turns from praise to telling the hearer something. The fear of the LORD is where wisdom begins, and understanding belongs to those who do what He commands. The hymn has become a proverb, and the next psalm opens with the man “that feareth the LORD” ([[Ps. 112:1]]).

sections:
  - range: 1-3
    heading: I will praise the LORD with my whole heart
    plain: |
      Praise the LORD. I will praise the LORD with all my heart, in the company of the upright and in the congregation. The works of the LORD are great, studied by all who delight in them. What He does is full of honor and majesty, and His righteousness lasts for ever.
  - range: 4-6
    heading: What He has done for His people
    plain: |
      He has made His wonders a thing to be remembered; the LORD is gracious and full of compassion. He has given food to those who fear Him; He will always keep His covenant in mind. He has shown His people the power of His works, to give them the heritage of the nations.
  - range: 7-10
    heading: Commandments that stand fast
    plain: |
      The works of His hands are faithful and just; all His commandments can be trusted. They stand firm for ever and ever, and are done in truth and uprightness. He sent redemption to His people; He has commanded His covenant for ever; His name is holy and to be held in awe. The fear of the LORD is the beginning of wisdom; all who do His commandments have good understanding. His praise lasts for ever.

notes:
  - ref: 3
    phrase: his righteousness endureth for ever
    kind: scripture
    title: The next psalm says it of a man
    body: |
      Psalm 112 repeats this line word for word, but says it of a man and not of the LORD. The man “that feareth the LORD” has wealth in his house, “and his righteousness endureth for ever” ([[Ps. 112:3]]), and the line comes again after he has given to the poor ([[Ps. 112:9]]).

      Psalm 112:4 takes up the words of verse 4 here as well. In this psalm “the LORD is gracious and full of compassion.” There, in the King James, the words stand in the description of the upright: “he is gracious, and full of compassion, and righteous” ([[Ps. 112:4]]), the same two Hebrew words. Whether they are said there of the man or of God is disputed (see the note on [[Ps. 112:4]]). The note on [[Ps. 112:1]] sets the two psalms side by side.

      Those two words have a history. They are the first things the LORD proclaimed of Himself to Moses, “merciful and gracious” ([[Ex. 34:6]]), here in the reverse order; the King James gives one Hebrew word as “merciful” at Sinai and as “full of compassion” in this psalm. The note on [[Ps. 103:8]] follows that sentence through scripture.
    sources: [lds-scriptures, oshb-wlc, bdb]

  - ref: 4
    phrase: He hath made his wonderful works to be remembered
    kind: history
    title: A memorial, and one reading finds the Passover in it
    body: |
      The Hebrew of this line says that the LORD made “a memorial” for His wonders, and one older reading takes that memorial to be the Passover festival. The noun means “remembrance, memorial”; the King James turns it into a verb. Translations differ about the sense, and a modern one has “He has gained renown by his wonderful deeds.”

      On the reading that keeps “memorial,” the word “points to the festival which propagates the remembrance of the deeds of God in the Mosaic age.” The law says of the Passover day, “this day shall be unto you for a memorial” ([[Ex. 12:14]]). The verses that follow are then read along the same line. The “meat” of verse 5 points to “the food provided for the Exodus, and to the Passover meal.” (“Meat” in the King James is any food: “Food in general; any thing eaten for nourishment.”) And if verses 4–6 are read this way, the “redemption” of verse 9 looks back to the deliverance from Egypt, and the covenant commanded after it is the one ratified at Sinai.

      The psalm itself names no Egypt, no Moses, and no feast, so this is a reading and not something the text states. What the psalm does list is wonders, food for those who fear Him, the heritage of the nations, commandments, and a covenant.
    sources: [bdb, biblehub-interlinear, nrsvue, delitzsch-psalms, webster-1828, lds-scriptures]

  - ref: 6
    phrase: the heritage of the heathen
    kind: scripture
    title: The land the nations had held
    body: |
      “The heritage of the heathen” is the inheritance of the nations (on “heathen,” see the note on [[Ps. 9:20]]), and Psalm 105 uses nearly the same words for the land given to Israel. A modern translation has “the heritage of the nations.”

      Psalm 105 ends its history of Israel with this gift: He “gave them the lands of the heathen” ([[Ps. 105:44]]). The psalm itself names no land and no nation, so the identification rests on that parallel.
    sources: [lds-scriptures, nrsvue]

  - ref: 9
    phrase: holy and reverend is his name
    kind: words
    title: Reverend means to be feared
    body: |
      “Reverend” says that the LORD’s name is to be feared, and that ties this verse to the next. In older English the adjective means “Worthy of reverence; entitled to respect mingled with fear and affection.” The Hebrew is a form of the verb to fear, used of the LORD’s name in the sense “inspire reverence, godly fear, and awe.”

      The King James translates the same word differently elsewhere. Where the same word describes the name in another psalm, it has “terrible”: “thy great and terrible name; for it is holy” ([[Ps. 99:3]]). A modern translation of this verse has “Holy and awesome is his name.”

      The following line begins, “The fear of the LORD,” where the noun has the sense “fear of God, reverence, piety.” The English changes words between the two verses; the subject does not change.
    sources: [webster-1828, bdb, nrsvue, lds-scriptures]

  - ref: 10
    phrase: The fear of the LORD is the beginning of wisdom
    kind: prophets
    title: Fear that is reverence, and is shown in doing
    body: |
      The fear this verse means is reverence and not dread, and the verse measures it by obedience. Scripture uses “fear” in two ways, and this verse is counted with the first, where “fear is equivalent to reverence, awe, worship.” The other is the fear that “perfect love casteth out” ([[1 Jn. 4:18]]).

      Elder David A. Bednar taught that godly fear “encompasses a deep feeling of reverence, respect, and awe for the Lord Jesus Christ,” together with “obedience to His commandments” and the expectation of His judgment. He set it against the ordinary kind: “Unlike worldly fear that creates alarm and anxiety, godly fear is a source of peace, assurance, and confidence.”

      The saying is shared with Proverbs and Job. Proverbs has it in the same words ([[Prov. 9:10]]) and again as “the beginning of knowledge” ([[Prov. 1:7]]), and in Job it is spoken to man: “the fear of the Lord, that is wisdom” ([[Job 28:28]]).

      What the psalm adds is its second line, which puts the understanding with those who act. The Hebrew has only a pronoun there, “them.” The King James supplies “his commandments” to say what “them” refers to, the plural that verse 7 has named. A modern translation has “all those who practice it,” the fear itself, and its footnote says that this follows the Greek and Syriac versions against the Hebrew. The King James’s supplied words, then, explain the Hebrew pronoun and do not depart from it, and Psalm 112 opens with the man who “delighteth greatly in his commandments” ([[Ps. 112:1]]).
    sources: [bd-fear, bednar-hushed-fears, lds-scriptures, biblehub-interlinear, nrsvue]

christ: |
  The LORD whose works this psalm studies is the Savior. “LORD” in the Old Testament usually stands for the name Jehovah, and Jehovah is Jesus Christ before His birth (see the note on [[Ps. 110:1]]). It is of Him, then, that the psalm says “He sent redemption unto his people,” and His name that is “holy and reverend.”

explore: |
  - **The twin psalm.** [[Ps. 112]], the same alphabet and several of the same lines, said of the one who fears the LORD.
  - **The saying in the wisdom books.** [[Prov. 1:7]], [[Prov. 9:10]], [[Job 28:28]], and [[Eccl. 12:13]].
  - **The works told at length.** [[Ps. 105]], a history of what the LORD did for Israel that ends, as verse 6 does, with the gift of “the lands of the heathen.”
  - **The memorial.** [[Ex. 12:1–14]], the Passover instituted as a day to be kept for ever.

parallels:
