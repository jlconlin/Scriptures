chapter: 60
title: Vain Is the Help of Man
tagline: A people beaten in battle tell God the defeat was His doing, hear His claim on the land and its neighbours, and ask the God who cast them off to lead them into Edom.
when: 'By its title, David’s, from his wars with Aram and Edom'

setting: |
  Psalm 60 stands in Book Two of the Psalms, the last of five in a row (56–60) whose titles call them “Michtam of David.” Its title sets it in David’s wars with the Syrian kingdoms and with Edom (see the notes on the title). Samuel tells those wars as one victory after another and says that “the LORD preserved David whithersoever he went” ([[2 Sam. 8:14]]). The psalm shows what that account does not: a lost battle, and a people asking why God did not march with them.

  It is the prayer of a whole people. The speakers are “us” and “we,” with one voice coming forward as “me” in verses 5 and 9. It is counted among the laments that “likely arose from times of national or personal crisis, when the community gathered (at the temple, if possible) in order to offer sacrifice and pray for deliverance.” The shape of a lament is set out at [[Ps. 22:1]].

  Two other psalms share its words. Verses 5–12 are also the second half of Psalm 108 ([[Ps. 108:6–13]]), where they follow praise instead of complaint. And the line about God not going out with the armies stands in [[Ps. 44:9]] as well.

thread: |
  Psalm 60 is about **a defeat and the God who dealt it**. It moves from a complaint to an oracle to a prayer.

  The complaint is all “thou.” God cast them off, broke them, shook the land, and gave them the wine. In verses 1–3 He is the subject of every verb but one, the “shaketh” that is said of the land, and no enemy is named.

  The turn is verse 6: “God hath spoken.” What follows does not mention the battle. It says whose the land is. Shechem and Succoth, Gilead and Manasseh, Ephraim and Judah are His, and Moab, Edom and Philistia are His to dispose of.

  Then the prayer sets the oracle against the facts. Edom has just been claimed, and the speaker is still outside its strong city:“who will lead me into Edom?” The answer is the God “which hadst cast us off.” The verb of verse 1 comes back in verse 10, and the one who rejected them is the only one who can lead them.

  The psalm reports no victory; only the title does. It ends on what the people have concluded: “vain is the help of man,” and “Through God we shall do valiantly.”

sections:
  - range: 1-3
    heading: Thou hast cast us off
    plain: |
      O God, You have rejected us and broken through us. You have been angry. Turn back to us. You have made the land quake and split it open; mend its cracks, for it is tottering. You have shown Your people hard things. You have given us wine to drink that makes us stagger.
  - range: 4-5
    heading: A banner, and a plea
    plain: |
      You have given those who fear You a banner, to be raised because of the truth. So that those You love may be rescued, save with Your right hand, and answer me.
  - range: 6-8
    heading: God hath spoken
    plain: |
      God has spoken in His holiness: “I will rejoice. I will divide up Shechem and measure out the valley of Succoth. Gilead is mine, and Manasseh is mine. Ephraim is the helmet on my head; Judah is my ruler’s staff. Moab is my washbasin. Over Edom I throw my shoe. Philistia, shout because of me.”
  - range: 9-12
    heading: Who will lead me into Edom?
    plain: |
      Who will bring me to the fortified city? Who will lead me to Edom? Will not You, O God, who rejected us, and who did not go out with our armies? Give us help against the trouble, for the rescue that men give is worthless. With God we will do valiantly; He is the one who will tread down our enemies.

notes:
  - ref: 0
    phrase: upon Shushaneduth
    kind: words
    title: A tune called the Lily of Testimony, and a psalm to teach
    body: |
      Shushan-eduth is most likely the name of the tune, and its two Hebrew words mean “lily” and “testimony.” The first is the singular of the “Shoshannim” in the title of Psalm 45, where the word is explained ([[Ps. 45:1]]). The second is the word for God’s law “as a testimony of God.” In this title and in Psalm 80’s, the pair has been explained as the name of a “melody whose first line” likened the law, as testimony, to a choice flower. A modern translation prints “according to the Lily of the Covenant,” and titles of this kind are probably all the names of tunes. The ancient Greek translators did not read a flower: “for them that shall yet be changed.”

      The title also says the psalm is “to teach,” a verb that stands here with no object. What was to be taught, and to whom, it does not say. The Greek has “for instruction.”

      The title’s other terms are explained where they first appear: “To the chief Musician” at [[Ps. 8:1]] and “Michtam” at [[Ps. 16:1]].
    sources: [oshb-wlc, bdb, nrsvue, bd-psalms, lxx-rahlfs]

  - ref: 0
    phrase: when he strove with Aram-naharaim and with Aram-zobah
    kind: history
    title: The wars behind the title
    body: |
      The title places the psalm in David’s wars with the Syrian kingdoms to the north and with Edom to the south, and it agrees with neither history in every detail. Aram is Syria; the Greek title has “Mesopotamia of Syria, and Syria Sobal.” Aram-naharaim is “Aram of the two rivers,” and Zobah was the kingdom of Hadadezer, whom David struck “as he went to recover his border at the river Euphrates” ([[2 Sam. 8:3]]). Edom, the country of Esau’s descendants, “lay south of the Dead Sea.”

      The victory in the valley of salt is told three times, with different names and numbers. In Samuel it is David’s, and the enemy is called Syrian: “David gat him a name when he returned from smiting of the Syrians in the valley of salt, being eighteen thousand men” ([[2 Sam. 8:13]]). In Chronicles, “Abishai the son of Zeruiah slew of the Edomites in the valley of salt eighteen thousand” ([[1 Chr. 18:12]]). The title credits Joab and counts twelve thousand, and Kings adds that Joab stayed in Edom six months ([[1 Kgs. 11:15–16]]). One older reading reconciles the commanders: “the army of David was under the supreme command of Joab,” who fought the battle through his brother Abishai. It leaves the numbers unreconciled, “eighteen thousand instead of twelve,” and concludes that the title “comes from an historical work which gave the Psalm in this connection,” one that has not survived.

      Why does a title about a victory stand over a psalm about a defeat? Samuel’s chapter says twice that the LORD preserved David wherever he went ([[2 Sam. 8:6]]; [[2 Sam. 8:14]]). The same reading supplies the reverse the psalm implies. While David’s army was in the north, “the Edomites in the south had invaded the land which was denuded of troops,” and the psalm “was composed before the victory in the Valley of Salt.” That is a reconstruction from the psalm and its title.
    sources: [lds-scriptures, lxx-rahlfs, bd-edom, delitzsch-psalms]

  - ref: 1
    phrase: thou hast cast us off, thou hast scattered us
    kind: words
    title: Rejected, and broken through
    body: |
      The two verbs of the first line say that God has rejected His people and has broken out upon them, and the second is a word David had used of his own victory. “Cast off” is a verb meaning to “reject, spurn,” used mostly of God; the note at [[Ps. 44:9]] treats it, and that verse has this psalm’s later line about the armies as well.

      “Scattered” is the verb to “break through,” and here it is used of the Lord breaking out on someone “in sudden judgment.” The same sense is found when David beats the Philistines and says, “The LORD hath broken forth upon mine enemies before me, as the breach of waters” ([[2 Sam. 5:20]]). He named the place Baal-perazim after the word. In the psalm the people of God are the ones broken out upon.

      The first verb returns in verse 10.
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 3
    phrase: the wine of astonishment
    kind: symbol
    title: Wine that makes a people stagger
    body: |
      The wine is a drink God has given His people that leaves them reeling. The Hebrew noun means “reeling,” and the phrase is to “drink reeling as wine.” The noun is found in one other passage, Isaiah’s “cup of trembling,” which Jerusalem has “drunk at the hand of the LORD” ([[Isa. 51:17]]).

      In both places the people who stagger have been given the cup by God. The psalm says “thou hast made us to drink”; Isaiah says the cup came from the LORD’s hand. Isaiah’s passage goes on to the cup’s removal: “I have taken out of thine hand the cup of trembling” ([[Isa. 51:22]]).
    sources: [bdb, lds-scriptures]

  - ref: 4
    phrase: a banner to them that fear thee
    kind: words
    title: A banner to rally to, or a signal to flee
    body: |
      The Hebrew of verse 4 has been taken two ways: as a banner to be displayed, which is the King James reading, or as a signal for flight. The banner is the word Isaiah uses for the “ensign” the Lord lifts to the nations, a “standard, as rallying-point” (see the note at [[Isa. 5:26]]). The difficulty is in the rest of the line.

      The verb that follows is found here and in one other verse, where its meaning is “very dubious.” Some derive it from the word for banner, which gives the King James “that it may be displayed.” Others take it as a form of the verb “flee.” And the last word, as written, is a rare word for “truth,” but it has also been taken as an Aramaic spelling of “bow,” one letter different.

      The ancient Greek translators read flight and a bow: “Thou hast given a token to them that fear thee, that they might flee from the bow.” A modern translation follows them, “to rally to it out of bowshot,” and notes that the Hebrew has “because of the truth.” The same reading has been put more starkly: “thou hast set a standard (only) for fleeing.”
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue]

  - ref: 6
    phrase: God hath spoken in his holiness
    kind: structure
    title: The oracle at the centre
    body: |
      The psalm turns on a word God has spoken, and the prayer that follows is made in its light. “In his holiness” can name the place, as in a modern translation’s “in his sanctuary,” or it can be an oath, “by his holiness.” One older reading takes it as the oath, as when God says of His promise to David, “Once have I sworn by my holiness” ([[Ps. 89:35]]), where the Hebrew noun is the same.

      The “I” of verses 6–8 is God. The heading of the Church’s edition takes the lines as His acts, in which the Lord “places Ephraim at the head and makes Judah His lawgiver,” and a modern translation sets the three verses in quotation marks as God’s own speech. The King James leaves the speech unmarked. The older reading gives the lines instead to the king, who has heard “a divine utterance, promising him victory,” and repeats it as his own confidence.

      The oracle begins with the land. Shechem is “in the centre of the region on this side the Jordan, and the valley of Succoth in the heart of the region on the other side,” so the two names take in both banks. To divide and measure them out is the act of one “in the free and inalienable possession of the land.”
    sources: [oshb-wlc, nrsvue, delitzsch-psalms, lds-scriptures]

  - ref: 7
    phrase: Ephraim also is the strength of mine head; Judah is my lawgiver
    kind: words
    title: A helmet and a commander’s staff
    body: |
      Ephraim and Judah are named as two pieces of a ruler’s equipment, his helmet and his staff. “The strength of mine head” is a “place or means of safety, protection” for the head, “i.e. my helmet.” “Lawgiver” is a participle that can mean a “prescriber of laws,” and here means the commander’s staff. It is the word of Jacob’s blessing: “The sceptre shall not depart from Judah, nor a lawgiver from between his feet, until Shiloh come” ([[Gen. 49:10]]). The Greek translators put the sense plainly: “Judas is my king.”

      The two tribes held the chief places in Israel. Chronicles says of Reuben that “his birthright was given unto the sons of Joseph,” while “Judah prevailed above his brethren, and of him came the chief ruler” ([[1 Chr. 5:1–2]]); Ephraim, Joseph’s younger son, “was given the birthright in Israel.” Judah’s tribe took the lead after the settlement, “its chief rival being Ephraim.”
    sources: [bdb, lxx-rahlfs, bd-ephraim, bd-judah, lds-scriptures]

  - ref: 8
    phrase: Moab is my washpot; over Edom will I cast out my shoe
    kind: symbol
    title: A washbasin, a shoe, and a shout
    body: |
      After the helmet and the staff come a washbasin, a shoe and a shout, one for each of three neighbouring peoples. Moab is “my washing-pot.” The noun is the ordinary word for a pot, a “household utensil for boiling,” and here it is the basin for washing.

      The shoe thrown over Edom is harder to read. One older reading takes it as “a sign of taking forcible possession,” and sets it beside the custom in which a man “plucked off his shoe, and gave it to his neighbour” to confirm a transfer ([[Ruth 4:7]]): “the shoe is in both instances the symbol of legal possession.” The Greek has “over Idumea will I stretch out my shoe.”

      The line on Philistia is spoken to her. The Hebrew verb is an imperative, to “shout in triumph,” and with Philistia as its subject it has been taken as irony. Psalm 108 has a plain statement, “over Philistia will I triumph” ([[Ps. 108:9]]), and the Greek here is a statement too: “the Philistines have been subjected to me.”

      All three peoples appear in Samuel’s account of David’s wars. He “smote the Philistines, and subdued them” ([[2 Sam. 8:1]]), “the Moabites became David’s servants” ([[2 Sam. 8:2]]), and “all they of Edom became David’s servants” ([[2 Sam. 8:14]]).
    sources: [oshb-wlc, bdb, delitzsch-psalms, lxx-rahlfs, lds-scriptures]

  - ref: 10
    phrase: Wilt not thou, O God, which hadst cast us off?
    kind: structure
    title: The only helper is the one who rejected them
    body: |
      The answer to “who will lead me into Edom?” is the God whom the psalm began by accusing, and the verb of verse 1 returns to say so. The King James makes the verse a question that expects the answer yes, and the Greek makes both halves hopeful questions: “Wilt not thou, O God, who hast cast us off? and wilt not thou, O God, go forth with our forces?” The Hebrew can also be read as the complaint renewed, and a modern translation has it so: “Have you not rejected us, O God?” and then, “You do not go out, O God, with our armies.” On either reading the next verse draws one conclusion, “vain is the help of man.”

      The “strong city” of verse 9 is an “entrenched city,” and the second half of that verse says where it is. The oracle has already claimed Edom (verse 8). The prayer asks who will bring the speaker there.

      “Help,” in “the help of man,” is a noun for “deliverance, usually by God, through human agency,” and it is used of rescue in battle. The Greek has “vain is the deliverance of man.”

      The last verse has both. The people say “we shall do valiantly,” and for the treading down the Hebrew has a separate pronoun for God: “he it is.”
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue]

christ: |
  What the psalm says of God is that rescue is His and no one else’s. Its last two verses call the deliverance men give worthless and say of God that “he it is that shall tread down our enemies.”

  One line of the oracle reaches further than David’s wars. “Judah is my lawgiver” uses the word of Jacob’s blessing on Judah, where the staff stays with that tribe “until Shiloh come” ([[Gen. 49:10]]). Shiloh there is read as the Messiah, a reading the Joseph Smith Translation confirms, and the promise “was fulfilled in Jesus Christ’s being literally of the lineage so as to be the heir to the throne of David.” The psalm itself says only that the staff is Judah’s and that Judah is God’s.

explore: |
  - **The same verses after praise.** [[Ps. 108]], where verses 5–12 of this psalm follow a song of praise instead of a complaint.
  - **A psalm called its twin.** [[Ps. 44]], a defeat told with the same line about the armies ([[Ps. 44:9]]), by a people who say they have kept the covenant.
  - **The wars themselves.** [[2 Sam. 8]] and [[1 Chr. 18]], with [[1 Kgs. 11:15–16]] for Joab in Edom.

parallels:
  - ref: Ps. 108:6–13
    note: Verses 5–12 again, nearly word for word, after five verses of praise.
  - ref: Ps. 44:9
    note: The same complaint, that God has cast off His people and does not go out with their armies.
  - ref: 2 Sam. 8:13–14
    note: The victory in the valley of salt that the title names (also 1 Chr. 18:12).
  - ref: Gen. 49:10
    note: The sceptre and the “lawgiver” of Judah, the word of verse 7.
  - ref: Isa. 51:17
    note: The “cup of trembling,” the same Hebrew noun as the wine of verse 3.

