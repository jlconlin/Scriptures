chapter: 29
title: The Voice of the LORD
tagline: The host of heaven is called to give the LORD glory, His voice crosses the land in seven peals of thunder, and the King who sat enthroned at the Flood gives His people strength and peace.
when: 'Undated; a psalm of David by its title'

setting: |
  The title ascribes the psalm to David and names no occasion. Its speaker never says “I.” It is a hymn of praise, of the kind that opens with a call to praise and then describes “the power and the mercy of the Lord,” often “emphasizing his role as the creator and his divine reign as king of Israel.” Here the call goes up to heaven (verses 1–2), the power is a thunderstorm (verses 3–9), and the reign is stated outright in verse 10.

  The ancient Greek translation adds to the title that the psalm was “on the occasion of the solemn assembly of the Tabernacle.” On one older reading that addition seems to imply that in the time of the second temple it was sung on the last day of the Feast of Tabernacles, though the same reading finds almost nothing else to confirm it.

  Its opening lines stand in two other places. Psalm 96 repeats verses 1–2 nearly word for word, with “O ye kindreds of the people” where this psalm has “O ye mighty” ([[Ps. 96:7–9]]), and the same lines are in the psalm David delivers in [[1 Chr. 16:28–29]].

thread: |
  Psalm 29 has three parts, and the middle one is loud. **It begins in heaven with a call to give the LORD glory, follows His voice through a storm, and ends with the Lord of the storm enthroned and His people at peace.**

  The call comes first (verses 1–2). Three times the heavenly beings are told to “give unto the LORD”: glory and strength, and the glory due to His name. No reason is given yet.

  The reason is the storm (verses 3–9). “The voice of the LORD” is said seven times, and the psalm itself says what the voice is: “the God of glory thundereth.” On one reading the storm can be followed across the land. It is heard first over the waters, breaks the cedars of Lebanon and sets the northern mountains leaping, flashes with fire, and shakes the wilderness of Kadesh (the note on verse 3 follows its path). No person appears in these verses and nothing is asked of anyone. Cedars, mountains, desert and forest are all acted upon, and the voice is the only actor.

  The turn comes in the last line of verse 9. While the forests are being stripped, “in his temple doth every one speak of his glory.” The glory called for in verse 1 is given. Then the psalm says where the LORD has been all along, which is seated: He “sitteth upon the flood,” and He “sitteth King for ever” (verse 10).

  Only in the last verse do His people appear, and only there is the power of the storm turned toward them. The “strength” that the heavenly beings were told to ascribe to Him in verse 1 He gives to His people in verse 11, in the same Hebrew word, and the psalm’s last word is “peace.” The King James makes that verse a promise; a modern translation prints it as a wish, “May the LORD give strength to his people!” The name of the LORD stands in the psalm eighteen times, four of them in the opening call and four in the close. One older commentary puts the whole movement in a line: “Gloria in excelsis is its beginning, and pax in terris its conclusion,” that is, glory in the highest and peace on earth.

sections:
  - range: 1-2
    heading: The call to heaven
    plain: |
      Give to the LORD, you heavenly beings, give to the LORD glory and strength. Give to the LORD the glory that belongs to His name; worship the LORD in holy splendor.
  - range: 3-4
    heading: The voice over the waters
    plain: |
      The voice of the LORD is over the waters. The God of glory thunders; the LORD is over the mighty waters. The voice of the LORD is powerful; the voice of the LORD is full of majesty.
  - range: 5-9
    heading: From Lebanon to Kadesh
    plain: |
      The voice of the LORD breaks the cedars; the LORD breaks the cedars of Lebanon. He makes them skip like a calf, Lebanon and Sirion like a young wild ox. The voice of the LORD cleaves flames of fire. The voice of the LORD shakes the wilderness; the LORD shakes the wilderness of Kadesh. The voice of the LORD makes the deer give birth (or, as some translate, makes the oaks whirl) and strips the forests bare. And in His temple everyone says, “Glory!”
  - range: 10-11
    heading: The King and His people
    plain: |
      The LORD sat enthroned at the Flood; the LORD sits enthroned as King for ever. The LORD will give strength to His people; the LORD will bless His people with peace.

notes:
  - ref: 1
    phrase: O ye mighty
    kind: words
    title: The mighty are the sons of God
    body: |
      The beings called on to praise are heavenly ones: the Hebrew behind “O ye mighty” is *bene elim*, “sons of” followed by the plural of *El*, the word translated “God” in verse 3. The ancient Greek translation has “ye sons of God,” a modern translation has “O heavenly beings,” and the phrase is understood as “angels,” the same beings the Old Testament elsewhere calls the sons of God.

      The phrase stands once more in the Psalms, in a verse that places these beings in heaven: “For who in the heaven can be compared unto the LORD? who among the sons of the mighty can be likened unto the LORD?” ([[Ps. 89:6]]).

      So the psalm opens above the storm. Its call to praise is addressed to the court of heaven. When Psalm 96 takes up these lines it turns the call toward the earth: “Give unto the LORD, O ye kindreds of the people” ([[Ps. 96:7]]). The heavenly council, and who sits in it, is discussed at [[Ps. 82:1]].
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, lds-scriptures]
  - ref: 2
    phrase: the beauty of holiness
    kind: words
    title: Holy adornment
    body: |
      “The beauty of holiness” translates a Hebrew phrase understood as “holy adornment,” which is used “always in connection with public worship” of the LORD. A modern translation has “worship the LORD in holy splendor.” The phrase is found here, in the two passages that repeat these lines ([[Ps. 96:9]]; [[1 Chr. 16:29]]), and where Jehoshaphat appoints singers who “should praise the beauty of holiness, as they went out before the army” ([[2 Chr. 20:21]]).

      The ancient Greek translators read it differently, “worship the Lord in his holy court,” which names a place and not a manner. On either reading the words belong to the worship of the sanctuary, and in this psalm they are addressed to heaven.
    sources: [bdb, nrsvue, lxx-rahlfs, oshb-wlc]
  - ref: 3
    phrase: The voice of the LORD
    kind: structure
    title: Seven thunders and the path of a storm
    body: |
      “The voice of the LORD” is thunder, and it sounds seven times. The verse explains its own image in the next clause, “the God of glory thundereth,” as Elihu does in Job: “God thundereth marvellously with his voice” ([[Job 37:5]]). The phrase returns in verses 4 (twice), 5, 7, 8 and 9, so that the psalm has been called “The Psalm of the Seven Thunders,” its repetitions standing for “the peals of thunder which follow in rapid succession as the storm increases in its fury.”

      On one older reading the storm moves. It is heard first “upon many waters,” taken not as the sea but as “the mass of water gathered together in the thick, black storm-clouds.” It breaks over Lebanon and Sirion (verses 5–6), and from those northern mountains “the storm sweeps on towards the south of Palestine into the Arabian desert,” to the wilderness of Kadesh (verse 8), which this reading takes as Kadesh-barnea, a city “in the southwest corner of Palestine” from which the twelve spies were sent. Read so, the storm travels the length of the land.

      Verse 7 is the lightning. Its verb means to divide or cleave, and the line has been explained as “the thunder of his voice sends forked lightnings.”

      More than weather is meant. On the same reading the voice is thunder taken as a sign: it stands for “the omnipotence of God expressing itself therein.”
    sources: [oshb-wlc, delitzsch-psalms, bd-kadesh, bdb, lds-scriptures]
  - ref: 6
    phrase: Lebanon and Sirion like a young unicorn
    kind: symbol
    title: Mountains that skip like calves
    body: |
      The verse sets the two great mountains of the north jumping like young animals. Sirion is Mount Hermon under another name, “which Hermon the Sidonians call Sirion” ([[Deut. 3:9]]). The “unicorn” is a wild ox. The Hebrew word means “wild ox,” an animal the Old Testament treats “as fierce and strong,” and the one-horned animal is the ancient Greek translation’s, a rendering judged “erroneous.” Here the animal is young, and it is used “in simile of skipping, leaping.”
    sources: [bdb, lxx-rahlfs, lds-scriptures]
  - ref: 8
    phrase: shaketh the wilderness
    kind: scripture
    title: The voice that shakes the earth
    body: |
      The Book of Mormon speaks of the Lord’s voice as this psalm does, as a power that shakes the ground. “Yea, behold at his voice do the hills and the mountains tremble and quake” ([[Hel. 12:9]]), and “by the power of his voice doth the whole earth shake” ([[Hel. 12:11]]). This verse has been listed with those passages among the places where the presence and voice of God are “described in the Book of Mormon and Old Testament as shaking the earth,” and verse 3 with those that give God “a thunderous voice and presence.”

      The passages were gathered to be read beside the account of the destructions among the Nephites at the Savior’s death, when “there was terrible thunder, insomuch that it did shake the whole earth as if it was about to divide asunder” ([[3 Ne. 8:6]]).
    sources: [sc-knowhy-754, lds-scriptures]
  - ref: 9
    phrase: maketh the hinds to calve
    kind: words
    title: Hinds calving, or oaks whirling
    body: |
      The first clause of verse 9 is translated in two ways, and each describes something the storm does. The King James’s hinds are female deer, and its verb is one for giving birth, to “writhe in travail,” used of hinds again where the LORD asks Job, “canst thou mark when the hinds do calve?” ([[Job 39:1]]). One modern translation keeps that sense: the voice makes “the deer give birth.” Another has trees in place of animals: the voice “causes the oaks to whirl.”

      The next clause is about trees on either reading. “Discovereth” translates a Hebrew verb meaning to “strip, lay bare,” used here of a storm “stripping forests.”
    sources: [bdb, esv, nrsvue, lds-scriptures]
  - ref: 9
    phrase: in his temple doth every one speak of his glory
    kind: structure
    title: The answer to verse 1 is Glory
    body: |
      The last line of verse 9 is the praise that verses 1–2 called for, and it is one word. A modern translation prints it as a cry, “in his temple all say, ‘Glory!’” The word runs through the psalm: the heavenly beings are told twice to give the LORD glory (verses 1–2), He is “the God of glory” when the thunder begins (verse 3), and here the word is spoken back to Him.

      Which temple is meant the psalm does not say. One reading takes it as the heavenly one, “His heavenly palace,” where “each of the beings therein” says the word, so that what verse 1 “has called upon them to do, now takes place.” The Hebrew word is used elsewhere of the LORD’s “abode in the heavens,” as in “The LORD is in his holy temple, the LORD’s throne is in heaven” ([[Ps. 11:4]]).
    sources: [nrsvue, oshb-wlc, delitzsch-psalms, bdb, lds-scriptures]
  - ref: 10
    phrase: sitteth upon the flood
    kind: words
    title: The Flood of Noah
    body: |
      The “flood” of verse 10 is most often taken as Noah’s Flood, because its word is used nowhere else outside Genesis. The Hebrew *mabbul* is found “only” in Genesis and in this verse, and in Genesis it is very nearly the name of that one event. It is the word of the LORD’s announcement to Noah, “I, even I, do bring a flood of waters upon the earth” ([[Gen. 6:17]]).

      The first verb of the line is in a past tense, and most have taken the clause as the LORD “at the flood sat enthroned.” He was King when the waters covered the earth, and the second clause carries His reign forward without end: “yea, the LORD sitteth King for ever.” A modern translation keeps the present tense in both clauses, “The LORD sits enthroned over the flood.”
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]

christ: |
  The LORD of this psalm is Jehovah, and “Jehovah is the premortal Jesus Christ.” The psalm’s refrain, “the voice of the LORD,” is in Hebrew the voice of Jehovah,. The Book of Mormon tells of thunder that shook the whole earth at His death ([[3 Ne. 8:6]]); the note on verse 8 sets that account beside the psalm.

explore: |
  - **The lines sung again.** [[Ps. 96:7–13]] and [[1 Chr. 16:23–33]] reuse verses 1–2 and call on the nations and the earth itself to answer.
  - **Thunder as God’s voice.** [[Job 37:2–5]], and the thunders of Sinai in [[Ex. 19:16–19]].
  - **The voice in latter-day revelation.** [[D&C 43:21–25]], where “the thunders shall utter their voices,” and [[D&C 88:89–90]].
  - **The Flood.** [[Gen. 6:17]] through [[Gen. 9:17]], for the word of verse 10 and the covenant that followed.

parallels:
  - ref: Ps. 96:7–9
    note: Verses 1–2 repeated, with the call addressed to the kindreds of the people.
  - ref: 1 Chr. 16:28–29
    note: The same lines in the psalm David delivers.
  - ref: Ps. 89:6
    note: The only other place in the Psalms with the Hebrew phrase behind “O ye mighty.”
  - ref: Gen. 6:17
    note: The Flood, in the word verse 10 uses.
  - ref: Hel. 12:9–11
    note: The hills and the whole earth shaken at the Lord’s voice.

