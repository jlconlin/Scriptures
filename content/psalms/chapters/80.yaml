chapter: 80
title: Turn Us Again
tagline: A people in ruins ask the Shepherd enthroned on the cherubim to shine, remind Him of the vine He carried out of Egypt, and three times beg Him to turn them back.
when: 'By its title, a psalm of Asaph; undated, with the tribes of Joseph in view'

setting: |
  Psalm 80 stands among the psalms that carry Asaph’s name ([[Ps. 50:1]]). The psalm before it ends with the people calling themselves “sheep of thy pasture” ([[Ps. 79:13]]), and this one opens by calling on the Shepherd.

  It is a lament of the whole people, spoken as “we” and “us” (the form is set out at [[Ps. 22:1]]). What has happened is told in a picture and not as a report: a vine with its hedges broken, plucked by everyone who passes, wasted by a boar, burned and cut down. The neighbours quarrel over the people and their enemies laugh. No enemy is named and no king is mentioned, unless he is the “man of thy right hand” in verse 17.

  The psalm gives no date. The tribes it names, Joseph, Ephraim, Benjamin and Manasseh, point north, and the ancient Greek translation adds to the title that the psalm is “concerning the Assyrian.” The first note on verse 1 sets out what can and cannot be said from that.

  The psalm reaches no vow of praise and reports no answer. Its last line is the refrain, asked a third time.

thread: |
  Psalm 80 is **a prayer about turning**, held together by a refrain. Three times the people ask, “Turn us again … and cause thy face to shine; and we shall be saved” (verses 3, 7 and 19). They do not say that they will turn. They ask God to turn them.

  Between the refrains the prayer moves in three steps. First it only asks (verses 1–3). Then it complains: God is angry at their very prayer and has fed them with tears (verses 4–7). Then it argues from history, in the long picture of the vine: You brought it out of Egypt, You cleared the ground, it filled the land; “why hast thou then broken down her hedges?” (verses 8–13).

  After the vine the same Hebrew verb is turned on God Himself: “Return, we beseech thee, O God of hosts” (verse 14). So the psalm asks for two turnings, that God turn back to His vine and that He turn His people back, and it puts both in God’s hands. The people’s own part is a promise that depends on His: “So will not we go back from thee” (verse 18).

  The face is the other thing to watch. The refrain asks for it to shine. Verse 16 says the people “perish at the rebuke of thy countenance,” and “countenance” is the same Hebrew word.

sections:
  - range: 1-3
    heading: Shepherd of Israel, shine forth
    plain: |
      Listen, Shepherd of Israel, You who lead Joseph like a flock. You who sit enthroned upon the cherubim, shine out. In front of Ephraim, Benjamin and Manasseh, rouse Your strength and come to save us. Restore us, O God; let Your face shine, and we will be saved.
  - range: 4-7
    heading: The bread of tears
    plain: |
      O LORD God of hosts, how long will You be angry at Your people’s prayer? You have given them tears for bread and tears to drink by the measure. You make us something our neighbours quarrel over, and our enemies laugh among themselves. Restore us, O God of hosts; let Your face shine, and we will be saved.
  - range: 8-13
    heading: The vine out of Egypt
    plain: |
      You brought a vine out of Egypt; You drove out the nations and planted it. You cleared the ground before it and made it take deep root, and it filled the land. Its shade covered the hills, and its boughs were like great cedars. It sent its boughs out to the sea and its branches to the river. Why then have You broken down its hedges, so that everyone who passes by plucks it? The boar from the forest tears at it, and the wild beasts of the field feed on it.
  - range: 14-19
    heading: Return, and visit this vine
    plain: |
      Turn back, we beg You, O God of hosts. Look down from heaven and see, and care for this vine, the stock Your right hand planted, the branch You made strong for Yourself. It is burned with fire, it is cut down; at the rebuke of Your face they perish. Let Your hand rest on the man of Your right hand, the son of man You made strong for Yourself. Then we will not turn away from You. Give us life, and we will call on Your name. Restore us, O LORD God of hosts; let Your face shine, and we will be saved.

notes:
  - ref: 0
    phrase: upon Shoshannim-Eduth
    kind: words
    title: Lilies, and a title that names Assyria in Greek
    body: |
      The title’s two untranslated words are rendered “on Lilies, a Covenant” in a modern translation, and the ancient Greek title adds a mention of Assyria that the Hebrew lacks. What lilies are doing in a psalm’s title is explained at [[Ps. 45:1]], and the word joined to them here at [[Ps. 60:1]]. The title’s other terms are explained where they first appear: “To the chief Musician” at [[Ps. 8:1]] and Asaph at [[Ps. 50:1]].

      The Greek title’s added words are “a Psalm concerning the Assyrian.” What that may say about the psalm’s date is taken up in the next note.
    sources: [nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 1
    phrase: thou that leadest Joseph like a flock
    kind: history
    title: Joseph and Rachel’s three tribes, and an enemy left unnamed
    body: |
      The psalm names Israel by Joseph and by the three tribes descended from Rachel, which points to the northern tribes, and it never says who has ruined them. Joseph, where the name is set apart from Judah, “is the name of the kingdom of the ten tribes”; Psalm 78 uses it so when God “refused the tabernacle of Joseph, and chose not the tribe of Ephraim” ([[Ps. 78:67]]). Ephraim and Manasseh are Joseph’s sons, and between them in verse 2 stands Benjamin, the other “Son of Jacob and Rachel.” The three had belonged together since the wilderness: “On the west side shall be the standard of the camp of Ephraim” ([[Num. 2:18]]), with Manasseh and Benjamin beside it.

      The opening title may come from Joseph’s story too. When Jacob blessed Joseph he spoke of “the God which fed me all my life long unto this day” ([[Gen. 48:15]]) and of “the shepherd, the stone of Israel” ([[Gen. 49:24]]), and on one older reading that “perhaps has somewhat to do with the choice of the first two names.” The shepherd as a title for the LORD is explained at [[Ps. 23:1]].

      When was it prayed? The psalm does not say, and any answer is an inference from the tribes named and from a title the Hebrew does not have. The Greek title’s “concerning the Assyrian” is an ancient hint, explained on the same older reading as perhaps the translation of a Hebrew note that took the boar of verse 13 as “an emblem of Assyria.” That reading accepts the hint: the psalmist, “as it seems, prays in a time in which the oppression of Assyria rested heavily upon the kingdom of Ephraim,” while the people were “still on the soil of their fatherland.” That would be before the day when “the king of Assyria took Samaria, and carried Israel away into Assyria” ([[2 Kgs. 17:6]]). On that reading the boar stands for some people, since “the poet associates a distinct nation with the wild boar in his mind,” but the psalm keeps the name to itself.
    sources: [delitzsch-psalms, lds-scriptures, bd-benjamin, lxx-rahlfs]

  - ref: 1
    phrase: thou that dwellest between the cherubims, shine forth
    kind: symbol
    title: Enthroned on the cherubim, and asked to appear
    body: |
      The Shepherd of the first line is addressed in the third as the King enthroned above the ark, and He is asked to show Himself in light. Cherubim were “figures representing heavenly creatures, the exact form being unknown,” found “in the Holy of Holies, on the Mercy Seat of the Ark.” A modern translation has “enthroned upon the cherubim,” and the ancient Greek “thou who sittest upon the cherubs.” The ark itself was called by this description, “the name of the LORD of hosts that dwelleth between the cherubims” ([[2 Sam. 6:2]]; see [[Ps. 24:10]]), and the Psalms use it again of the LORD as king: “he sitteth between the cherubims” ([[Ps. 99:1]]).

      “Shine forth” is a verb for light breaking out, to “shine out or forth, send out beams.” It is used of the LORD coming to His people at Sinai, when “he shined forth from mount Paran” ([[Deut. 33:2]]), and of His appearing from Zion ([[Ps. 50:2]]). The Greek has “manifest thyself.” The refrain asks for light again with a different Hebrew verb: “cause thy face to shine.”
    sources: [bd-cherubim, nrsvue, lxx-rahlfs, bdb, oshb-wlc, lds-scriptures]

  - ref: 3
    phrase: Turn us again, O God, and cause thy face to shine
    kind: structure
    title: A refrain that grows, and a prayer about turning
    body: |
      The refrain comes three times, each time with a longer name for God, and its verb “turn” is afterward asked of God Himself. Verse 3 calls on “God,” verse 7 on the “God of hosts,” and verse 19 on the “LORD God of hosts.” (The hosts are explained at [[Ps. 24:10]].) Nothing else in the refrain changes.

      “Turn us again” is one Hebrew word, a form of the verb to turn or return that means make us come back. These three verses are listed under the sense “give back, restore,” said of a “conquered nation”; a modern translation has “Restore us, O God.” Lamentations prays the same prayer over fallen Jerusalem: “Turn thou us unto thee, O LORD, and we shall be turned” ([[Lam. 5:21]]).

      In verse 14 the same verb appears, and God is its subject: “Return, we beseech thee, O God of hosts.” There it is read of the LORD’s coming back to “shew favour.” The psalm’s request is double: turn us, and turn Yourself.

      The second half of the refrain asks for what the priests’ blessing pronounces. “The LORD make his face shine upon thee” ([[Num. 6:25]]) has the same Hebrew verb and noun; the same request is discussed at [[Ps. 4:6]] and [[Ps. 31:16]]. This psalm names the face once more. The people of the vine “perish at the rebuke of thy countenance” (verse 16), and “countenance” there is the same Hebrew word as “face” in the refrain.
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]

  - ref: 4
    phrase: how long wilt thou be angry against the prayer of thy people
    kind: words
    title: Smoke against their prayer, and tears by the measure
    body: |
      “Be angry” translates a Hebrew verb that means to smoke, so the line says that God fumes against His people’s prayer. Another psalm of this group has the same verb with the same question: “why doth thine anger smoke against the sheep of thy pasture?” ([[Ps. 74:1]]). There the smoke is against the flock; here it is against the flock’s prayer. A modern translation keeps the plain sense: “how long will you be angry with your people’s prayers?”

      Verse 5 measures the grief. “In great measure” is a noun meaning a “third,” the “name of a measure” whose size is uncertain; the same word is used for the measure that holds the dust of the earth in [[Isa. 40:12]]. A modern translation has “tears to drink in full measure,” and the Greek “by measure.”
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 8
    phrase: Thou hast brought a vine out of Egypt
    kind: symbol
    title: Israel’s story told as the transplanting of a vine
    body: |
      Verses 8–11 tell the exodus and the settling of the land as the moving of a single vine, and verses 12–13 ask its planter why He has broken down its hedges. The first work is all God’s: He brought it out, drove out the nations, planted it, cleared the ground. The Greek says outright what kind of act this is: “Thou hast transplanted a vine out of Egypt.” Then the vine spreads until its shade covers the hills and its branches reach “unto the sea” and “unto the river.” A modern translation prints “the River”; another notes that the river is the Euphrates. Moses named the same limits for the land of promise: “from the river, the river Euphrates, even unto the uttermost sea” ([[Deut. 11:24]]).

      The prophets use the same picture. The cross-references of modern translations set this verse beside Isaiah’s song of the vineyard ([[Isa. 5:1]]) and Jeremiah’s “noble vine” ([[Jer. 2:21]]), and one adds Ezekiel’s vine ([[Ezek. 17:6]]). Isaiah’s song has the hedge as well. There the owner asks the question, “wherefore, when I looked that it should bring forth grapes, brought it forth wild grapes?” ([[Isa. 5:4]]), and He announces the sentence Himself: “I will take away the hedge thereof, and it shall be eaten up” ([[Isa. 5:5]]). In the psalm the vine’s own people ask why the hedge is down.
    sources: [lxx-rahlfs, nrsvue, esv, lds-scriptures]

  - ref: 17
    phrase: the man of thy right hand
    kind: words
    title: The son, and the man of the right hand
    body: |
      Verse 17 asks God’s hand upon one figure, “the man of thy right hand” and “the son of man,” an ordinary phrase for a human being; he has been read as Israel itself and, in one old rendering, as the Messiah.

      In the Old Testament “the expression ‘son of man’ is frequently used to denote simply ‘a man,’” and this verse is listed among the examples. A modern translation has “the one at your right hand.”

      Verse 15 has nearly the same line, “the branch that thou madest strong for thyself,” and “branch” there is the ordinary Hebrew word for son. The word can be used “of plant-shoots,” as in Jacob’s blessing, where the “bough” is the same word: “Joseph is a fruitful bough, even a fruitful bough by a well; whose branches run over the wall” ([[Gen. 49:22]]). Verse 15 has been listed under that sense with a question mark, and also under Israel as God’s son. One modern translation prints “the son whom you made strong for yourself”; another drops the half-line as a copy of verse 17; the Greek has “the son of man” in both verses. (“Vineyard” in the same verse is a rare word for a “root, stock,” in a text marked “dubious”; hence “the stock that your right hand planted.”)

      Who is the man? Two answers have been given.

      **Israel.** On one older reading the son is the nation, “the son whom Jahve has called into being in Egypt, and then called out of Egypt to Himself,” as in [[Ex. 4:22–23]] and Hosea: “When Israel was a child, then I loved him, and called my son out of Egypt” ([[Hosea 11:1]]). On this reading “the vine and the son of man are both the people of God,” and “man of thy right hand” is “a play upon the name of Benjamin” in verse 2, a name that means “Son of the right hand.”

      **The Messiah.** The Targum, one of “the old interpreters,” is reported to render the son of verse 15 as “the King Messiah, whom Thou hast established for Thyself.” The same older reading holds that even there “it is not the Christ Himself, but the nation out of which He is to proceed, that is meant.”

      The psalm itself does not say who he is.
    sources: [oshb-wlc, bdb, esv, nrsvue, lxx-rahlfs, delitzsch-psalms, bd-benjamin, bd-son-of-man, lds-scriptures]

christ: |
  The one this psalm calls the Shepherd of Israel is Jehovah, and “Christ was the Jehovah of the Old Testament.” The psalm is one of several “praising Jehovah as a shepherd,” and Jesus called Himself the good shepherd ([[John 10:11]]; see [[Ps. 23:1]]).

  The vine has a later history as well. The Savior told of a householder who “planted a vineyard, and hedged it round about” ([[Matt. 21:33]]) and who, after his servants were beaten and killed, “last of all … sent unto them his son” ([[Matt. 21:37]]); a modern translation’s cross-references set that parable beside verse 8.

  The psalm itself ends before any answer, asking a third time for the face to shine.

explore: |
  - **The prophets’ vine.** [[Isa. 5:1–7]]; [[Jer. 2:21]]; [[Ezek. 17:1–10]].
  - **The psalm before.** [[Ps. 79]] ends with “we thy people and sheep of thy pasture” ([[Ps. 79:13]]), and this psalm begins with the Shepherd.
  - **Jacob’s blessings of Joseph.** [[Gen. 48:15–16]] and [[Gen. 49:22–26]], for the shepherd and the fruitful bough.

parallels:
  - ref: Num. 6:25
    note: The priests’ blessing, “The LORD make his face shine upon thee,” which the refrain asks for in the same Hebrew words.
  - ref: Lam. 5:21
    note: “Turn thou us unto thee, O LORD, and we shall be turned,” the same prayer over fallen Jerusalem.
  - ref: Isa. 5:1–7
    note: The song of the vineyard, in which the owner Himself takes away the hedge.
  - ref: Matt. 21:33
    note: The Savior’s parable of a vineyard planted and hedged, to which the owner at last sends his son.

