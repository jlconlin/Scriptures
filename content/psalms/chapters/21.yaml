chapter: 21
title: The King Shall Joy in Thy Strength
tagline: The people who prayed for their king give thanks that the LORD has granted his heart’s desire, and look ahead to a victory that is the LORD’s from the first line to the last.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  Psalm 21 stands beside Psalm 20, and the two are a pair. Psalm 20 is a prayer for the king whose setting “seems to be a ceremony for the king’s departure for battle”; Psalm 21 is the thanksgiving. In both the people come before God about their king, “in the former, with their wishes and prayers, in the latter, their thanksgivings and hopes.” The note on verse 1 sets the two side by side.

  The title ascribes the psalm to David and names no occasion. It has been placed, with Psalms 20, 60 and 110, in “the period of David’s foreign wars.” The psalm itself names no enemy; one proposal for the war is given in the note on the crown (verse 3).

  The king does not speak. He is “he” through verse 7, and the last verse says “we,” so the voice is the people’s, or that of singers on their behalf. This is a royal psalm, one of those that “celebrated important events in the lives of royalty” (on the term, see the note on [[Ps. 2:2]]). The Church’s edition heads it as a messianic psalm, and the close of this chapter takes that up.

thread: |
  Psalm 21 is **two halves about one king, and both halves give the credit to the LORD.** The first half (verses 1–6) looks back and gives thanks. The second (verses 8–12) looks ahead to enemies not yet beaten. Verse 7 stands between them.

  In the first half the LORD is the subject of nearly every verb. He has given and has not withheld (verse 2); He meets the king with blessings and sets the crown on his head (verse 3); He gave life (verse 4), laid honour and majesty on him (verse 5), made him blessed and made him glad (verse 6). Of the king the psalm reports three things only: he asked (verse 4), he rejoices (verse 1), and he trusts (verse 7).

  The turn is at verse 7. It speaks to no one. It names king and LORD together: the king trusts, and through the mercy of the Most High he will not be moved. From there the psalm says “thou” again and speaks of what is still to come: enemies found out, consumed and turned back. The psalm has moved from thanks to confidence. Whether that “thou” is the king or the LORD is a real question (see the note on verse 8), but the psalm does not leave the victory with the king either way: “the LORD shall swallow them up in his wrath” (verse 9).

  The last verse returns to the first. The psalm opened with the king rejoicing “in thy strength” and ends by asking the LORD to be exalted “in thine own strength,” the same Hebrew phrase, and the singers now say “we.”

sections:
  - range: 1-2
    heading: The king’s joy
    plain: |
      LORD, the king rejoices in Your strength; how greatly he exults in Your salvation! You have given him what his heart desired and have not held back what his lips asked.
  - range: 3-6
    heading: What the LORD has given him
    plain: |
      For You come to meet him with rich blessings; You set a crown of pure gold on his head. He asked You for life and You gave it to him, length of days for ever and ever. His glory is great because of Your salvation; You lay splendor and majesty on him. You make him blessed for ever; You make him glad with the joy of Your presence.
  - range: 7
    heading: Why he will not be moved
    plain: |
      For the king trusts in the LORD, and through the steadfast love of the Most High he will not be moved.
  - range: 8-12
    heading: The enemies found out
    plain: |
      (The one addressed may be the king or the LORD; see the note on verse 8.) Your hand will find all Your enemies; Your right hand will find those who hate You. You will make them like a fiery oven when You appear (the King James has “in the time of thine anger”). The LORD will swallow them up in His wrath, and the fire will devour them. You will destroy their offspring from the earth and their children from among humankind. For they intended evil against You; they devised a plot that they cannot carry out. You will make them turn their backs when You aim Your bowstrings at their faces.
  - range: 13
    heading: Be thou exalted
    plain: |
      Be exalted, LORD, in Your strength! We will sing and praise Your power.

notes:
  - ref: 1
    phrase: The king shall joy in thy strength, O LORD
    kind: scripture
    title: Psalm 20’s prayer, answered
    body: |
      Psalm 21 gives thanks for what Psalm 20 asked, and several of its words are Psalm 20’s. There the people prayed for the king, “Grant thee according to thine own heart” ([[Ps. 20:4]]) and “the LORD fulfil all thy petitions” ([[Ps. 20:5]]). Here they say, “Thou hast given him his heart’s desire, and hast not withholden the request of his lips” (verse 2). There they promised, “We will rejoice in thy salvation” ([[Ps. 20:5]]); here the king rejoices in the LORD’s salvation, and the Hebrew noun is the same. There the LORD was to save His anointed “with the saving strength of his right hand” ([[Ps. 20:6]]); here a right hand finds out the enemies (verse 8), and the “power” praised in the last line is the Hebrew word behind “strength” in that verse of Psalm 20.
    sources: [lds-scriptures, oshb-wlc]

  - ref: 3
    phrase: thou preventest him
    kind: words
    title: Prevent meant to go before
    body: |
      “Preventest” means comes to meet, in an older sense of the English word: to prevent was “to go before; to precede.” By 1828 that sense was obsolete, and to hinder was “now the only sense.”

      The Hebrew verb is to “come to meet one,” in this verse “as friend” and with something in hand, and a modern translation has “you meet him with rich blessings.” The LORD is the one who moves. He comes out to the king and brings the blessings with Him.
    sources: [webster-1828, bdb, nrsvue]

  - ref: 3
    phrase: a crown of pure gold
    kind: history
    title: The crown, and the one taken at Rabbah
    body: |
      The crown has been connected with one David took in war, though the psalm does not say when it was set on his head. After Rabbah, the royal city of the Ammonites, fell ([[2 Sam. 12:26–29]]), David “took their king’s crown from off his head, the weight whereof was a talent of gold with the precious stones: and it was set on David’s head” ([[2 Sam. 12:30]]).

      One older reading holds that the verse “cannot be intended to refer to David’s first coronation, but to the preservation and increase of the honour of his kingship,” and that it “sounds like a prediction of what is recorded” in that story. The same reading hears the Ammonite war again in the fire of verse 9. It is one reading. The psalm names no city and no enemy.
    sources: [lds-scriptures, delitzsch-psalms]

  - ref: 4
    phrase: length of days for ever and ever
    kind: words
    title: Life for ever, asked for a king
    body: |
      To live “for ever” was a wish made for a king, and on one older reading the people here say that the wish has been granted. When David was old, Bath-sheba bowed before him and said, “Let my lord king David live for ever” ([[1 Kgs. 1:31]]). On that reading, to wish such a thing, “and especially a king, is a usual thing,” and the meaning is “may the life of the king be prolonged to an indefinitely distant day.” The same reading takes the verse of the king’s own life, not of sons who will follow him on the throne.
    sources: [lds-scriptures, delitzsch-psalms]

  - ref: 5
    phrase: honour and majesty hast thou laid upon him
    kind: words
    title: The LORD’s own splendour, laid on the king
    body: |
      “Honour and majesty” are a pair of words said elsewhere of the LORD’s royal splendour, and in this verse He lays them on the king. The Hebrew is *hod* and *hadar*. The first is “splendour, majesty,” said of a king, and also the “divine splendour, majesty, light & glory which God wears as king.” Together they are what the LORD is clothed with, “thou art clothed with honour and majesty” ([[Ps. 104:1]]), and what attends Him: “Honour and majesty are before him” ([[Ps. 96:6]]). Here the splendour is the king’s, and it is “conferred.”

      Psalm 8 says nearly the same of humankind, whom God “hast crowned … with glory and honour” ([[Ps. 8:5]]). “Honour” there is the word translated “majesty” here, and “glory” there is the word that opens this verse.

      The verse keeps the giver in view. The king’s glory is great “in thy salvation.”
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 6
    phrase: exceeding glad with thy countenance
    kind: symbol
    title: Gladness before the LORD’s face
    body: |
      The king’s gladness is gladness in the LORD’s presence: “countenance” is the Hebrew word for face. The Hebrew words for “with thy face” are those behind “in thy presence is fulness of joy” ([[Ps. 16:11]]), and the note there takes up the Psalms’ hope of seeing the face of God. In Latter-day Saint writing on that hope this verse is cited for what His countenance does: it makes one “exceeding glad.”

      The same word stands behind “anger” in verse 9; see the note there.
    sources: [oshb-wlc, lds-scriptures, skinner-seeing-god]

  - ref: 7
    phrase: through the mercy of the most High he shall not be moved
    kind: structure
    title: The verse the psalm turns on
    body: |
      Verse 7 stands between the psalm’s two halves, and it is the one verse in the body of the psalm that addresses no one. In verses 1–6 the people speak to the LORD about the king. From verse 8 they say “thou” again, with enemies in view. Between the two, king and LORD are both “he.”

      The verse has two halves and gives each party one thing. The king’s part is trust. The LORD’s part is “mercy,” the Hebrew *hesed* (see the note on [[Ps. 51:1]]); a modern translation has “through the steadfast love of the Most High.” The result is that he “shall not be moved” (on the verb, see the note on [[Ps. 13:4]]).
    sources: [oshb-wlc, nrsvue]

  - ref: 8
    phrase: Thine hand shall find out all thine enemies
    kind: words
    title: Whether thou is the king or the LORD
    body: |
      From this verse to verse 12 the psalm says “thou” without a name, and it can be read as spoken to the king or to the LORD. One older reading takes it of the king: “The address to God is now changed into an address to the king,” voicing “the confident expectation, of the speakers.” In the middle of the address the LORD is “he”: “the LORD shall swallow them up in his wrath” (verse 9).

      The address has also been taken of the LORD: the Hebrew behind “the time of thine anger” has been read of His presence (see the note on verse 9). The heading in the Church’s edition, which calls the psalm messianic, sums up these verses with capital letters: “The King will triumph over all His enemies.”

      On either reading the psalm leaves the swallowing up to the LORD, and the praise of the last verse is for His power.
    sources: [delitzsch-psalms, lds-scriptures]

  - ref: 9
    phrase: in the time of thine anger
    kind: words
    title: The time of thy face
    body: |
      The Hebrew of this phrase has no word for anger: word for word it says *at the time of thy face*, with the word translated “countenance” in verse 6. The ancient Greek translators wrote “at the time of thy presence,” and a modern translation, “when you appear.” The King James’s “anger” gives the sense in which the word has been taken here, of the LORD’s “angry presence.” (If the king is the one addressed, the appearing is his.)

      The oven is the *tannur*, a “portable stove or fire-pot” used for baking, and it is a figure of judgment here as in [[Mal. 4:1]].
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, bdb]

  - ref: 10
    phrase: Their fruit shalt thou destroy from the earth
    kind: words
    title: Fruit means offspring
    body: |
      “Fruit” is children: the second half of the line says “their seed,” and a modern translation has “their offspring” and “their children.” The verse expects the enemies’ line to end, and verse 11 gives the ground: “they intended evil against thee.” How lines of this kind in the Psalms are read beside the Savior’s command to love one’s enemies is taken up at [[Ps. 137:8]].
    sources: [nrsvue]

christ: |
  The Church’s edition heads Psalm 21 as a messianic psalm and calls its king “the great King.” It is a royal psalm, and such psalms “for Christian readers often reflected the royal life and reign of the Messiah.” David’s reign itself came to be regarded as “the type of the more glorious age to which the nation looked forward when Messiah should come.”

  What the psalm says of its king is life asked and given for ever, the LORD’s own honour and majesty laid on him, gladness before the face of God, and every enemy found out. The Church’s footnotes set the fire of verse 9 beside the day that “shall burn as an oven” ([[Mal. 4:1]]) and beside [[D&C 133:64]].

explore: |
  - **The prayer before the thanksgiving.** Read [[Ps. 20]] and then this psalm, watching each request return as a gift.
  - **The crown at Rabbah.** [[2 Sam. 12:26–31]], the story one older reading hears behind verses 3 and 9.
  - **The other royal psalms.** [[Ps. 2]] and [[Ps. 110]], where the king’s enemies are again the LORD’s to subdue.

parallels:
  - ref: Ps. 20:4–6
    note: The prayer for the king that this psalm gives thanks for; “heart,” “salvation” and “right hand” return here.
  - ref: 2 Sam. 12:30
    note: The gold crown of Rabbah set on David’s head, which one older reading connects with verse 3.
  - ref: 1 Kgs. 1:31
    note: “Let my lord king David live for ever,” the court’s wish beside verse 4.
  - ref: Ps. 16:11
    note: Joy in the LORD’s presence; the Hebrew for “thy presence” there is “thy countenance” in verse 6.
  - ref: Mal. 4:1
    note: The oven as a figure of judgment, as in verse 9.

