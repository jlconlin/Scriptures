chapter: 130
title: Out of the Depths
tagline: A man going under cries to be heard, says what would sink everyone if God kept count, finds forgiveness instead, and waits for morning with all Israel beside him.
when: 'Undated; the title names no author and the psalm no occasion'

setting: |
  The title puts Psalm 130 among the songs of degrees; the note on the title at [[Ps. 120:1]] explains the name. It names no author, and the psalm gives no occasion. On one older reading its vocabulary “brings our Psalm down into a later period of the language” than David’s; the psalm does not date itself.

  What it leaves out is striking. No enemy is named, no sickness, no exile, no slander. The only trouble the psalm mentions is “iniquities,” in verse 3 and again as its last word.

  Two names for God alternate through it, “LORD” and “Lord”; [[Ps. 110:1]] explains the difference.

  The psalm stands close to Solomon’s prayer at the dedication of the temple. Its second verse has a near relative in that prayer as Chronicles gives it: “let thine ears be attent unto the prayer that is made in this place” ([[2 Chr. 6:40]]). The same older reading holds that the chronicler’s line was put together from this psalm. Verse 4 reasons as that prayer reasons (see the note there).

  The next song of degrees ends on the call of verse 7: “Let Israel hope in the LORD from henceforth and for ever” ([[Ps. 131:3]]).

thread: |
  Psalm 130 moves **from one man’s cry in deep water to a promise made to a whole people, and it turns on a single “But.”**

  It opens with a voice asking only to be heard (verses 1–2). Verse 3 then says why the speaker is where he is, and widens it at once. He does not ask whether he can stand, but “who shall stand?” If the LORD kept hold of iniquities, the answer would be no one.

  Verse 4 is the turn: “But there is forgiveness with thee.” Nothing in his situation has changed between the two verses. What has changed is what he says about God.

  What follows is not the thanksgiving a reader expects. He waits. Verses 5–6 say “wait” three times and “hope” once, and the watchmen’s line is said twice, which on one older reading “gives the impression of protracted, painful waiting.” Forgiveness is “with” the LORD; the psalm does not say that the speaker has yet heard it spoken.

  Then the “I” becomes “Israel” (verses 7–8). What he has found for himself he hands to the people: forgiveness is “with thee,” mercy is “with the LORD,” redemption is “with him.” The psalm ends in the future tense, still before morning: “he shall redeem Israel from all his iniquities.”

sections:
  - range: 1-2
    heading: Lord, hear my voice
    plain: |
      From the depths I have cried to You, LORD. Lord, hear my voice; let Your ears listen closely to the sound of my pleading.
  - range: 3-4
    heading: Who shall stand?
    plain: |
      If You, LORD, kept watch on sins, Lord, who could stay standing? But with You there is forgiveness, so that You may be held in reverence.
  - range: 5-6
    heading: More than they that watch for the morning
    plain: |
      I wait for the LORD; my soul waits, and my hope is in His word. My soul waits for the Lord more than the night watch waits for morning, more than the night watch waits for morning.
  - range: 7-8
    heading: Let Israel hope
    plain: |
      Israel, hope in the LORD, for with the LORD there is mercy, and with Him there is abundant redemption. He Himself will redeem Israel from all its sins.

notes:
  - ref: 1
    phrase: Out of the depths
    kind: symbol
    title: The depths are deep water
    body: |
      The depths are deep water, a picture of distress as sinking where there is no footing. The Hebrew word comes twice in another psalm, joined there to “waters,” for a man in distress: “I sink in deep mire, where there is no standing: I am come into deep waters, where the floods overflow me” ([[Ps. 69:2]]).

      In that psalm the waters are named beside enemies. The speaker asks to be delivered “from them that hate me, and out of the deep waters” ([[Ps. 69:14]]). Psalm 130 has no one in it who hates the speaker. When it comes to say what the trouble is, in verse 3, the word is “iniquities,” and the speaker counts himself among those who could not stand.

      Verse 1 does not ask to be pulled out, either. It asks to be heard, and the rest of the psalm is about what he may expect from the one who hears.
    sources: [bdb, lds-scriptures]

  - ref: 4
    phrase: that thou mayest be feared
    kind: scripture
    title: Why forgiveness leads to fear
    body: |
      The fear in this verse is reverence, and the verse says that forgiveness is what produces it. A reader expects the opposite, that judgment makes people fear and pardon takes the fear away. But where scripture speaks of fearing the Lord as a duty, fear “is equivalent to reverence, awe, worship,” and a modern translation has here “so that you may be revered.”

      Solomon’s prayer at the dedication of the temple reasons the same way. He asks God to “forgive, and do, and give to every man according to his ways” ([[1 Kgs. 8:39]]), and gives the purpose: “That they may fear thee all the days that they live in the land” ([[1 Kgs. 8:40]]).

      There is another fear, the kind sin itself produces. “The first effect of Adam’s sin was that he was afraid,” and since the Fall God has been teaching men “not to fear, but with penitence to ask forgiveness in full confidence of receiving it.” The fear of verse 4 is not that one: it comes after pardon, not before it.
    sources: [bd-fear, nrsvue, lds-scriptures]

  - ref: 6
    phrase: more than they that watch for the morning
    kind: symbol
    title: Watching for the morning
    body: |
      Those who “watch for the morning” are people awake through the night and waiting for day to come. Isaiah uses the same Hebrew word for a city’s watchman, and has the scene: a voice calls, “Watchman, what of the night?” ([[Isa. 21:11]]), and the watchman answers, “The morning cometh” ([[Isa. 21:12]]).

      The psalmist says his soul waits for the Lord more than the watchmen wait for morning. The line is then said again. The King James joins the two with “I say”; a modern translation simply prints it twice: “more than those who watch for the morning.”

      What he waits for is named in verse 5: “in his word do I hope.” Verse 4 has said that forgiveness is with the LORD. The psalm does not say that the word has come, and it ends before the morning.
    sources: [bdb, biblehub-interlinear, nrsvue, lds-scriptures]

  - ref: 8
    phrase: he shall redeem Israel from all his iniquities
    kind: christ
    title: Redeemed from sins, not from enemies
    body: |
      The last line promises a redemption from sin itself, not from enemies or hardship. Another psalm ends with nearly the same prayer and a different last word: “Redeem Israel, O God, out of all his troubles” ([[Ps. 25:22]]). Here the word is “iniquities,” the only trouble this psalm has named.

      To redeem is “to deliver, to purchase, or to ransom, such as to free a person from bondage by payment.” The psalm does not say what the payment is. It says who redeems; a modern translation has “It is he who will redeem Israel.” The mercy of verse 7 that stands behind the promise is the covenant love explained at [[Ps. 51:1]]. One older reading calls it here “the mercy, which removes the guilt of sin and its consequences,” and holds that the psalmist “means complete and final redemption, above all, in the genuinely New Testament manner, spiritual redemption.”

      A modern translation sets beside this verse the opening of Zacharias’s song: “Blessed be the Lord God of Israel; for he hath visited and redeemed his people” ([[Luke 1:68]]).
    sources: [lds-scriptures, gs-redeem, nrsvue, delitzsch-psalms]

christ: |
  The LORD in whom Israel is told to hope is Jehovah, who is Jesus Christ before His birth ([[Ps. 110:1]] has the note). The psalm puts three things “with” Him: forgiveness, mercy, and “plenteous redemption.”

  It leaves the redemption in the future and does not say how it will be done. What the word points to is said plainly elsewhere: “Redemption refers to the Atonement of Jesus Christ and to deliverance from sin.” The note on [[Ps. 130:8]] sets the psalm’s last line beside the song of Zacharias.

explore: |
  - **Who shall stand.** [[Ps. 76:7]] and [[Ps. 90:8]], the question of verse 3 and the iniquities it speaks of, set before God.
  - **The next song.** [[Ps. 131]], three verses that end with this psalm’s call to Israel.
  - **Waiting on the LORD.** [[Ps. 40:1]] and [[Isa. 40:31]].

parallels:
  - ref: Ps. 69:2
    note: Sinking in deep waters, the picture behind “the depths” of verse 1.
  - ref: 1 Kgs. 8:39–40
    note: Solomon asks God to forgive “that they may fear thee,” the reasoning of verse 4.
  - ref: Ps. 76:7
    note: “Who may stand in thy sight when once thou art angry?” beside the question of verse 3.
  - ref: Ps. 25:22
    note: The same prayer for Israel’s redemption, from “troubles” where verse 8 has “iniquities.”
  - ref: Ps. 131:3
    note: The next psalm repeats “Let Israel hope in the LORD.”
  - ref: Titus 2:14
    note: Paul’s words of Christ, who gave Himself to “redeem us from all iniquity,” beside the wording of verse 8.

sources: [lds-scriptures, bd-fear, gs-redeem, delitzsch-psalms, bdb, biblehub-interlinear, nrsvue]
