chapter: 44
title: Awake, Why Sleepest Thou?
tagline: A defeated people recite what God did for their fathers, tell Him that He has sold them for nothing though they kept His covenant, and call on Him to wake and redeem them.
when: 'Undated; by its title a psalm for the sons of Korah'

setting: |
  Psalm 44 follows Psalms 42–43 and bears the same family’s name in its title. It never uses the divine name: it calls Him “God,” and once, in verse 23, “Lord,” the title. The setting of Psalm 42 takes up that change of name ([[Ps. 42:1]]).

  The speaker here is a people. In Psalms 42 and 43 one man prays; this psalm says “we,” with an “I” breaking in at verses 4, 6 and 15 whom the psalm does not identify. Laments like it “likely arose from times of national or personal crisis, when the community gathered (at the temple, if possible) in order to offer sacrifice and pray for deliverance.”

  The crisis is a lost war. Israel’s armies have fallen back, the enemy has taken spoil, and some of the people are dead and others scattered among the nations (verses 9–11). The psalm names no king, no enemy and no place, and nothing in it fixes a date. Proposals have run from the time of David to the time of the Maccabees. One older reading calls it the twin of Psalm 60, a psalm that its title gives to David at war and that has the line of verse 9 almost word for word ([[Ps. 60:10]]).

  Paul quotes verse 22 in [[Rom. 8:36]].

thread: |
  Psalm 44 is **an argument made from memory**. It begins with what God did, moves to what He is doing now, and asks Him to explain the difference.

  The first stanza is the fathers’ story (verses 1–3). God drove out nations and planted Israel, and the psalm is careful about the credit: “they got not the land in possession by their own sword.” The second stanza brings that lesson into the present (verses 4–8). The speaker will not trust his bow either. “In God we boast all the day long, and praise thy name for ever.” Then comes Selah.

  **The turn is the next word, “But.”** From verse 9 to verse 14 the same God is the subject of almost every verb, and every verb is a loss. The psalm that gave God the credit for the fathers’ victory now puts the defeat to His account as well.

  The third movement denies that the people have earned it (verses 17–22). They have not forgotten Him or been false to His covenant; if they had, He would know. They are being killed “for thy sake.”

  So the plea, when it comes, is blunt: “Awake, why sleepest thou?” (verses 23–26). A lament commonly has an invocation, a complaint, a confession of trust, a petition and a vow of praise, “although the order can be rearranged” ([[Ps. 22:1]] sets out the form). Here the trust and the praise come first and the psalm ends on the petition. Nothing is answered inside it.

sections:
  - range: 1-3
    heading: What our fathers told us
    plain: |
      God, we have heard it with our own ears; our fathers told us what You did in their days, long ago. With Your own hand You drove out nations and planted our fathers; You broke peoples and sent our fathers out. They did not win the land by their sword, and their own arm did not save them. It was Your right hand, Your arm, and the light of Your face, because You favored them.
  - range: 4-8
    heading: Not my bow, not my sword
    plain: |
      You are my King, O God: command deliverance for Jacob. Through You we push back our foes; in Your name we tread down those who rise against us. I do not trust in my bow, and my sword will not save me. It is You who have saved us from our foes and shamed those who hate us. In God we boast all day long, and we will praise Your name for ever.
  - range: 9-16
    heading: But thou hast cast off
    plain: |
      But You have rejected us and shamed us, and You do not go out with our armies. You make us fall back before the enemy, and those who hate us take what they like. You have handed us over like sheep to be eaten and scattered us among the nations. You sell Your people for a trifle and gain nothing by the sale. You make us the taunt of our neighbors, mocked and scorned by all around us, a byword among the nations, a people that others shake their heads at. All day long my disgrace is in front of me and shame covers my face, at the voice of the one who taunts and reviles, at the sight of the enemy and the avenger.
  - range: 17-22
    heading: Yet have we not forgotten thee
    plain: |
      All this has come upon us, though we have not forgotten You or been false to Your covenant. Our heart has not turned back and our steps have not left Your way, yet You have crushed us in a haunt of jackals and covered us with deep darkness. If we had forgotten the name of our God, or spread out our hands to a foreign god, would God not find it out? He knows the secrets of the heart. Because of You we are killed all day long and counted as sheep for the slaughter.
  - range: 23-26
    heading: Awake, arise, redeem
    plain: |
      Wake up! Why do You sleep, Lord? Rouse Yourself; do not reject us for ever. Why do You hide Your face and forget our misery and our oppression? We are sunk down to the dust; our bodies cling to the ground. Rise up and help us, and redeem us for the sake of Your steadfast love.

notes:
  - ref: 0
    phrase: for the sons of Korah, Maschil
    kind: words
    title: The title’s terms
    body: |
      The title names no occasion, and each of its three terms is explained where it first appears: the sons of Korah at [[Ps. 42:1]], “Maschil” at [[Ps. 32:1]], and “To the chief Musician” at [[Ps. 8:1]]. The ancient Greek translation renders “Maschil” as “a Psalm for instruction.”

      The psalm shares more than a name with the one before it. That prayer asks, “why dost thou cast me off?” ([[Ps. 43:2]]). This one says “thou hast cast off” (verse 9), with the same Hebrew verb, and says it for the whole people.
    sources: [lxx-rahlfs, bdb]
  - ref: 2
    phrase: and cast them out
    kind: words
    title: Both halves of the verse end with the fathers
    body: |
      The second “them” of verse 2 is most likely the fathers, as the first is, although the King James makes it sound like the nations. The Hebrew sets two things done to the nations against two things done for Israel: God drove out nations and planted “them,” afflicted peoples and sent “them” out. A modern translation marks the contrast: “you with your own hand drove out the nations, but them you planted; you afflicted the peoples, but them you set free.”

      The verb behind “cast them out” is also used of a tree, to “shoot forth branches,” and one reading takes it so here, as the planting carried a step further: the word means “to send forth far away, to make wide-branching.” Another psalm draws the whole picture: “Thou hast brought a vine out of Egypt: thou hast cast out the heathen, and planted it” ([[Ps. 80:8]]); and then, with this verb for the boughs, “She sent out her boughs unto the sea, and her branches unto the river” ([[Ps. 80:11]]). On the same reading the planting looks back to the song at the sea: “Thou shalt bring them in, and plant them in the mountain of thine inheritance” ([[Ex. 15:17]]).

      Whether the fathers are set free or spread like branches, the verse says what verse 3 says outright. Israel did not win the land by its own sword. Israel was put there.
    sources: [oshb-wlc, nrsvue, bdb, delitzsch-psalms, lds-scriptures]
  - ref: 3
    phrase: the light of thy countenance
    kind: symbol
    title: The face that shone, and is now hidden
    body: |
      The light of God’s countenance is His face turned toward His people in favour, and this psalm ends by asking why that face is hidden. The image and the priestly blessing behind it are explained at [[Ps. 4:6]]. Here it stands third in a list with God’s right hand and His arm, as what won the land for the fathers.

      “Countenance” is the Hebrew word for face, and the psalm uses it twice more. In verse 15 it is the speaker’s own face, covered with shame. In verse 24 it is God’s again: “Wherefore hidest thou thy face?”
    sources: [oshb-wlc]
  - ref: 9
    phrase: But thou hast cast off
    kind: structure
    title: The turn at verse 9
    body: |
      The psalm turns on the word “But,” from praise that has just promised to last “for ever” to an account of defeat. Verse 8 ends with Selah, and the next word in Hebrew is a small particle that the King James renders “But” and a modern translation “Yet”: “Yet you have rejected us and shamed us.”

      The verb is a strong one, to “reject, spurn.” It opens the complaint here and comes back in the plea, “cast us not off for ever” (verse 23).

      What follows is a list in which God is the subject of nearly every verb. He does not go out with the armies. He makes them turn back, gives them up like sheep, scatters, sells, makes them a reproach and a byword (verses 9–14). The enemy is there only to collect the spoil and do the mocking. The first stanza said that God’s right hand, and not the fathers’ sword, won the land (verse 3); this one says to Him that the lost battle is His act as well.
    sources: [oshb-wlc, nrsvue, bdb]
  - ref: 12
    phrase: Thou sellest thy people for nought
    kind: scripture
    title: Sold, and for nothing
    body: |
      Being sold is a figure scripture uses elsewhere for God handing His people over to an enemy, and this psalm adds that He got nothing for them. In Judges, when Israel served other gods, the LORD “sold them into the hands of their enemies round about” ([[Judg. 2:14]]). The Song of Moses explains a rout the same way: it could not have happened “except their Rock had sold them” ([[Deut. 32:30]]). The Hebrew verb is the same in all three places.

      The second half of the verse presses the figure: the people went “for a trifle,” and God is none the richer for the sale.
    sources: [oshb-wlc, nrsvue, lds-scriptures]
  - ref: 17
    phrase: neither have we dealt falsely in thy covenant
    kind: scripture
    title: A people who say they have kept the covenant
    body: |
      The people claim that they have kept the covenant, a claim the psalms most like this one do not make. Psalms 60, 80 and 89 set a ruined present against the past as this psalm does, “but they do not contain any like expression of consciousness of innocence, a feature in which Psalm 44 has no equal.” The people say that they have not forgotten God, that neither heart nor step has turned from His way, and that they have not spread their hands to a strange god. Then they call the one witness who could contradict them: “Shall not God search this out? for he knoweth the secrets of the heart” (verse 21).

      One older reading sets the psalm beside Job. It is “like the national mirroring of the Book of Job,” the affliction of a people that “could not possibly be of a punitive character.” The same reading adds that the psalmist does not “mean to disown the sins of individuals”; what he denies is an apostasy of the nation that would account for its being cast off.

      The psalm itself gives no reason for the defeat. The nearest it comes is verse 22: they are dying “for thy sake.”
    sources: [delitzsch-psalms]
  - ref: 19
    phrase: the place of dragons
    kind: words
    title: A haunt of jackals
    body: |
      The “dragons” here are probably jackals, and a place of jackals is a ruin. Two Hebrew words are rendered “dragon” in the King James, and in many passages the animal meant is “a jackal”; a modern translation has “the haunt of jackals” here. Jeremiah uses the animal for a city left without people: “I will make Jerusalem heaps, and a den of dragons; and I will make the cities of Judah desolate, without an inhabitant” ([[Jer. 9:11]]).

      So the verse says that God has crushed His people in a wasteland and laid over them “the shadow of death,” the phrase of [[Ps. 23:4]], which the same translation renders here “deep darkness.”
    sources: [bd-dragon, nrsvue, lds-scriptures]
  - ref: 22
    phrase: for thy sake are we killed all the day long
    kind: christ
    title: Paul quotes the complaint and answers it
    body: |
      Paul quotes this verse to the Saints at Rome as scripture’s description of those who belong to Christ, and answers it. In the psalm the line is the last piece of evidence in the people’s case. “For thy sake” is in a modern translation “Because of you”: they are dying because they are His.

      Paul asks, “Who shall separate us from the love of Christ? shall tribulation, or distress, or persecution, or famine, or nakedness, or peril, or sword?” ([[Rom. 8:35]]). The psalm follows: “As it is written, For thy sake we are killed all the day long; we are accounted as sheep for the slaughter” ([[Rom. 8:36]]). He does not soften it. What he adds is the next sentence: “Nay, in all these things we are more than conquerors through him that loved us” ([[Rom. 8:37]]).

      The ground of that answer stands just before the question: “It is Christ that died, yea rather, that is risen again, who is even at the right hand of God, who also maketh intercession for us” ([[Rom. 8:34]]). The psalm asks God not to cast His people off for ever (verse 23). Paul is persuaded that nothing “shall be able to separate us from the love of God, which is in Christ Jesus our Lord” ([[Rom. 8:39]]).
    sources: [lds-scriptures, nrsvue, oshb-wlc]
  - ref: 23
    phrase: Awake, why sleepest thou, O Lord?
    kind: symbol
    title: Does God sleep?
    body: |
      The psalm does not teach that God sleeps; it tells Him that He is acting as though He did. Another psalm states the creed with the same Hebrew verb: “Behold, he that keepeth Israel shall neither slumber nor sleep” ([[Ps. 121:4]]). One reading explains the figure this way: “God is said to sleep when He does not interpose in whatever is taking place in the outward world here below.”

      A Jewish tradition sets the two verses side by side. It tells of Levites who cried this verse daily and were called “wakers,” until a high priest stopped them with the question “Doth the Deity sleep?” and the line from Psalm 121. The cry, he said, belonged only to a time when Israel was in distress and the nations at rest.

      “Lord” here is not the divine name. It is the title, “my Lord”; [[Ps. 110:1]] explains the difference.
    sources: [oshb-wlc, delitzsch-psalms]
  - ref: 26
    phrase: redeem us for thy mercies’ sake
    kind: words
    title: The last word is God’s steadfast love
    body: |
      The psalm’s last word in Hebrew is *hesed*, God’s steadfast love, and it is the ground the plea gives. The King James has “for thy mercies’ sake”; a modern translation has “for the sake of your steadfast love.” The word is explained at [[Ps. 51:1]]. The ancient Greek translation reads “for thy name’s sake” in its place.

      The people have argued their own faithfulness for six verses (17–22), and the plea does not mention it.
    sources: [oshb-wlc, nrsvue, lxx-rahlfs]

christ: |
  Paul carries verse 22 into his teaching on the love of Christ. He quotes it as the lot of those who belong to Him, “killed all the day long,” and answers that in all these things “we are more than conquerors through him that loved us” ([[Rom. 8:37]]). The note on verse 22 gives the ground of that answer.

explore: |
  - **Paul’s whole argument.** [[Rom. 8:28–39]], where the verse from this psalm stands between “Who shall separate us?” and “more than conquerors.”
  - **A psalm called its twin.** [[Ps. 60]], which one older reading pairs with this psalm: a defeat told with the same line about the armies, which ends, “Through God we shall do valiantly” ([[Ps. 60:12]]).
  - **The same verb.** “For the Lord will not cast off for ever” ([[Lam. 3:31]]), in a poem that has the same Hebrew verb as verses 9 and 23.
  - **One led to the slaughter.** [[Isa. 53:7]], where it is a single sufferer who is “brought as a lamb to the slaughter,” and who says nothing.

parallels:
  - ref: Rom. 8:36
    note: Paul quotes verse 22 of the Saints’ sufferings, and answers that nothing can separate them from the love of Christ.
  - ref: Ps. 60:10
    note: The line of verse 9 again, almost word for word, in a psalm of David’s wars.
  - ref: Ps. 121:4
    note: The keeper of Israel does not sleep, in the same verb as verse 23.
  - ref: Lam. 3:31
    note: The Lord will not cast off for ever, in the verb of verses 9 and 23.

