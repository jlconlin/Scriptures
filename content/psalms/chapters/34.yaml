chapter: 34
title: Taste and See
tagline: A man who has been rescued blesses the LORD, calls the humble to try His goodness for themselves, and then sits them down to teach what the fear of the LORD is.
when: 'By its title, David’s, after he feigned madness before the Philistine king of Gath'

setting: |
  By its title this is David’s song after his narrowest escape among the Philistines; the note on the title tells the story. The psalm itself never mentions it. It “does not contain any express reference to that incident,” so the title gives the setting the psalm asks to be read in, and the poem names no place and no enemy.

  It is a song of thanksgiving, the kind sung by one who has “been delivered from a trial by God.” Partway through, the singer becomes a teacher.

  In Hebrew the psalm is an acrostic, the device explained at [[Ps. 9:1]]: its verses “follow one another according to the order of the letters of the alphabet.” The sixth letter has no verse. A verse is added after the last letter, as in [[Ps. 25]], which has been called this psalm’s “counterpart.” The note on verse 22 takes up the added verse.

  The New Testament draws on the psalm more than once. Peter quotes verses 12–16 at length ([[1 Pet. 3:10–12]]) and takes up the words of verse 8 ([[1 Pet. 2:3]]). John, at the cross, cites a scripture that “A bone of him shall not be broken” ([[John 19:36]]); the note on verse 20 takes it up.

thread: |
  Psalm 34 is **a thanksgiving that turns into a lesson**. Its first half is testimony. One man blesses the LORD, calls the humble to join him, and says why: “I sought the LORD, and he heard me” (verse 4). Its second half begins when he turns to his hearers as a teacher: “Come, ye children, hearken unto me” (verse 11). From there the psalm has “more the tone of a didactic poem.”

  The testimony keeps moving between one man and everyone. “I sought” (verse 4) becomes “They looked” (verse 5), the speaker’s own experience “generalised.” Then comes “This poor man cried” (verse 6), which has been read as David pointing to himself, and then “them that fear him” (verse 7). The same sentence is said of the one and of the many. He cried, the LORD heard, and saved him “out of all his troubles” (verse 6); the righteous cry, the LORD hears, and delivers them “out of all their troubles” (verse 17).

  The psalm keeps saying “all”: praise at all times, deliverance from all fears and all troubles, all his bones kept. It is not a promise of an easy life. The psalm says outright, “Many are the afflictions of the righteous” (verse 19), and its deliverance is out of them. Those the LORD is near to are the brokenhearted.

  The alphabet ends at verse 21, on the fate of the wicked. One more verse is added, and the psalm ends on the LORD who redeems.

sections:
  - range: 1-3
    heading: Magnify the LORD with me
    plain: |
      I will bless the LORD at all times; His praise will always be in my mouth. My soul boasts in the LORD; the humble will hear of it and be glad. Magnify the LORD with me, and let us lift up His name together.
  - range: 4-7
    heading: This poor man cried
    plain: |
      I sought the LORD and He heard me, and rescued me from all my fears. They looked to Him and were radiant, and their faces were not ashamed. This poor man called, and the LORD heard, and saved him out of all his troubles. The angel of the LORD camps around those who fear Him and delivers them.
  - range: 8-10
    heading: Taste and see
    plain: |
      Taste and see that the LORD is good; blessed is the man who trusts in Him. Fear the LORD, you His saints, for those who fear Him lack nothing. Young lions go short and hungry, but those who seek the LORD will not lack any good thing.
  - range: 11-14
    heading: I will teach you the fear of the LORD
    plain: |
      Come, children, listen to me; I will teach you the fear of the LORD. Who is there that wants life, and loves many days in which to see good? Keep your tongue from evil and your lips from deceit. Turn from evil and do good; seek peace and pursue it.
  - range: 15-18
    heading: His eyes, His ears, His face
    plain: |
      The LORD’s eyes are on the righteous, and His ears are open to their cry. The LORD’s face is against those who do evil, to cut off the memory of them from the earth. The righteous cry, and the LORD hears, and rescues them from all their troubles. The LORD is near to the brokenhearted and saves those who are crushed in spirit.
  - range: 19-22
    heading: Many afflictions, and out of them all
    plain: |
      Many are the troubles of the righteous, but the LORD rescues him out of them all. He guards all his bones; not one of them is broken. Evil will kill the wicked, and those who hate the righteous will be held guilty. The LORD redeems the soul of His servants, and none who trust in Him will be held guilty.

notes:
  - ref: 0
    phrase: when he changed his behaviour before Abimelech
    kind: history
    title: David before the king of Gath
    body: |
      The title points to the day David saved his life by acting the madman at a Philistine court. Running from Saul, he “went to Achish the king of Gath” ([[1 Sam. 21:10]]). The king’s servants knew him as the David of the song about slain ten thousands (see [[1 Sam. 21:11]]), and he “was sore afraid of Achish” ([[1 Sam. 21:12]]). So “he changed his behaviour before them, and feigned himself mad in their hands, and scrabbled on the doors of the gate, and let his spittle fall down upon his beard” ([[1 Sam. 21:13]]). Achish wanted no madmen in his house (see [[1 Sam. 21:15]]), and David “escaped to the cave Adullam” ([[1 Sam. 22:1]]).

      The title uses the narrative’s own phrase. “Behaviour” translates a Hebrew noun, *ta‘am*, whose sense here is “judgement, sense”: David disguised his good sense. A modern translation renders the title “when he feigned madness.”

      The king’s name differs. Samuel calls him Achish and the title calls him Abimelech, and the two are one man: the Abimelech of the title is the “same as Achish.” Why the name changes is less sure. Genesis gives the name Abimelech to the king of Gerar in Abraham’s day and in Isaac’s to “Abimelech king of the Philistines” ([[Gen. 26:1]]; see [[Gen. 20:2]]), and one older reading takes it as “the title of the Philistine kings, just as Pharaoh is title of the Egyptian.” That is a reading and not something the text says.

      By its title [[Ps. 56]] belongs to the same days, “when the Philistines took him in Gath.”
    sources: [lds-scriptures, bd-abimelech, oshb-wlc, bdb, nrsvue, delitzsch-psalms]

  - ref: 5
    phrase: were lightened
    kind: words
    title: Faces made radiant
    body: |
      “Lightened” here means made radiant: the faces of those who look to the LORD shine. The Hebrew verb is to “beam, be radiant, figurative of joy.” The second half of the line says the same thing from the other side: their faces “were not ashamed.” Isaiah uses the verb of Zion when her children come home, where the King James Version has “flow together” ([[Isa. 60:5]]).

      The King James Version makes the line a report about a “they” it does not name. The Greek translation makes it a summons to the hearers: “Draw near to him, and be enlightened: and your faces shall not by any means be ashamed.” A modern translation goes the same way, “Look to him, and be radiant,” and notes that where it has “your” the Hebrew has “their.”
    sources: [bdb, oshb-wlc, lxx-rahlfs, nrsvue]

  - ref: 7
    phrase: The angel of the LORD encampeth round about
    kind: symbol
    title: One angel, camped like an army
    body: |
      The image is of a camp: a single angel “encampeth round about” those who fear the LORD. In some Old Testament passages the angel of the LORD “speaks as the voice of God Himself.” How one angel can surround anyone is the question the line raises. One older reading answers that “the angel of the LORD” here is not a word for angels in general but the single figure “who accompanied Israel to Canaan,” and gives two ways he may encamp around them. Pointing to the figure Joshua met before Jericho (see [[Josh. 5:14]]), it says he does so as “the Captain of the host of Jahve,” with a host of angels under him; or he does so as “a spirit not limited by space,” whose protection covers them on every side.

      The same reading hears in the verb “perhaps an allusion” to Jacob, who met angels on his way home and said, “This is God’s host” ([[Gen. 32:2]]). Elisha’s servant, his eyes opened, saw such a host: “the mountain was full of horses and chariots of fire round about Elisha” ([[2 Kgs. 6:17]]).
    sources: [delitzsch-psalms, bd-angels, nrsvue, lds-scriptures]

  - ref: 8
    phrase: O taste and see
    kind: words
    title: Taste, and the word in the title
    body: |
      The invitation is to find out by experience, and its verb is the root of a word in the title. To “taste” in Hebrew is also to “perceive.” The noun from the same verb means taste and then “judgement, discretion, discernment,” and it is the word behind “behaviour” in the title, the good sense David disguised at Gath (see the note on the title). Whether the echo is meant, the text does not say.

      Peter takes the line up for Saints he calls “newborn babes” ([[1 Pet. 2:2]]), who are to desire the word as milk “if so be ye have tasted that the Lord is gracious” ([[1 Pet. 2:3]]). He goes straight on, “To whom coming, as unto a living stone” ([[1 Pet. 2:4]]), and the heading to that chapter in the Church’s edition says of Christ, “He is the chief cornerstone.”

      The Book of Mormon may echo the verse as well. Mormon’s reflection that “the Lord in his great infinite goodness doth bless and prosper those who put their trust in him” ([[Hel. 12:1]]) has been proposed as an allusion to it. The two share a run of words: see, the Lord, good, bless, trust in him.
    sources: [bdb, oshb-wlc, hilton-psalms-bom, lds-scriptures]

  - ref: 10
    phrase: shall not want any good thing
    kind: words
    title: The want that Psalm 23 denies
    body: |
      Verses 9 and 10 deny “want” twice, first with a noun and then with its verb, and the verb is that of “I shall not want” ([[Ps. 23:1]]). The noun means “need, thing needed, poverty.”

      The contrast is with young lions, which “do lack, and suffer hunger.” The Greek translation has people in place of the animals: “The rich have become poor and hungry.”
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs]

  - ref: 12
    phrase: What man is he that desireth life
    kind: scripture
    title: The lesson Peter quotes
    body: |
      The promised lesson in the fear of the LORD is a lesson in conduct, and Peter quotes it nearly whole. The teacher asks who wants a long and good life, and he answers with commands: guard the tongue from evil and the lips from guile, leave evil and do good, seek peace and pursue it. The fear of the LORD is taught here as things done and things left undone.

      Peter gives the passage to the Saints as the reason for not answering wrong with wrong. He has just told them to live “not rendering evil for evil, or railing for railing: but contrariwise blessing” ([[1 Pet. 3:9]]), and he goes on, “For he that will love life, and see good days, let him refrain his tongue from evil, and his lips that they speak no guile” ([[1 Pet. 3:10]]). The psalm’s question has become a statement.

      His quotation runs on through the eyes and the ears of the Lord and stops at “the face of the Lord is against them that do evil” ([[1 Pet. 3:12]]). The rest of verse 16, the cutting off of their remembrance from the earth, he leaves unsaid. Two verses later he turns to suffering: “But and if ye suffer for righteousness’ sake, happy are ye” ([[1 Pet. 3:14]]).
    sources: [lds-scriptures]

  - ref: 18
    phrase: of a broken heart
    kind: scripture
    title: The Book of Mormon’s phrase
    body: |
      This verse is the one place in the Bible where “broken heart” and “contrite spirit” stand together, the pairing the Book of Mormon uses. The four words meet in one other verse, [[Ps. 51:17]], where the heart is both broken and contrite; the note there explains the words and the offering. Lehi has the same pair, in words that have been proposed as an allusion to this verse: the Messiah answers the ends of the law “unto all those who have a broken heart and a contrite spirit” ([[2 Ne. 2:7]]). The risen Lord asks for the same “for a sacrifice unto me” ([[3 Ne. 9:20]]), and the phrase returns in Mormon, Ether and Moroni and in [[D&C 20:37]] and [[D&C 59:8]]. Since the teaching “can be found in the Old Testament, especially in the Psalms,” it “may have been included on the plates of brass.”

      In Psalm 51 the broken heart is an offering. Here it is a condition the LORD is “nigh” to, set between the cry of verse 17 and the many afflictions of verse 19. The Hebrew adjective behind “contrite” is found in one other place, where the high and lofty One dwells “with him also that is of a contrite and humble spirit” ([[Isa. 57:15]]).

      The Hebrew verb for “broken” returns two verses later. The hearts of verse 18 are broken; of the bones of verse 20, “not one of them is broken.”
    sources: [hilton-psalms-bom, sc-knowhy-198, bdb, oshb-wlc, lds-scriptures]

  - ref: 20
    phrase: not one of them is broken
    kind: christ
    title: A bone of him shall not be broken
    body: |
      In the psalm the unbroken bones are those of the righteous man who suffers, and John saw the words kept in the body of Jesus on the cross. Verse 19 has just granted that the righteous suffer much. On one older reading verse 20 is “a pictorial exemplification of the thought that God does not suffer the righteous to come to the extremity.”

      At the Crucifixion the soldiers broke the legs of the two crucified with Jesus, but “when they came to Jesus, and saw that he was dead already, they brake not his legs” ([[John 19:33]]). John gives the reason: “For these things were done, that the scripture should be fulfilled, A bone of him shall not be broken” ([[John 19:36]]).

      John does not say which scripture he means. The heading in the Church’s edition reads this verse of the Savior: David “says that not one of the Messiah’s bones will be broken.” The law of the Passover lamb also commanded, “neither shall ye break a bone thereof” ([[Ex. 12:46]]; see [[Num. 9:12]]), and Elder James E. Talmage wrote of the Crucifixion in those terms: Christ, “the great Passover sacrifice,” died “without a bone of His body being broken, as was a prescribed condition of the slain paschal lambs.” The older reading already quoted holds that John’s scripture “may be just as well referred to our Psalm as to Exodus 12:46.”
    sources: [delitzsch-psalms, talmage-jesus-christ-35, lds-scriptures]

  - ref: 22
    phrase: shall be desolate
    kind: words
    title: Desolate, or held guilty
    body: |
      “Desolate” in the last two verses is a verdict: the Hebrew verb is to “be held guilty, bear punishment.” Those who hate the righteous will be held guilty (verse 21). None who trust in the LORD will be (verse 22). A modern translation has “condemned” in both verses.

      The second of these verses stands outside the alphabet. Verse 21 begins with the last Hebrew letter, and verse 22 begins again with the letter of verse 16, as the added verse of the companion psalm does (see the note on [[Ps. 25:22]]). Had the acrostic stopped at its last letter, the psalm would have ended on the guilt of the wicked. As it stands it ends on the LORD who “redeemeth the soul of his servants.”
    sources: [bdb, oshb-wlc, nrsvue]

christ: |
  Peter takes up verse 8 and goes straight on to the Lord as a living stone, the chief cornerstone, who is Christ ([[1 Pet. 2:3–4]]); the note on verse 8 gives the passage.

  Verse 20 is read of the Savior in the Church’s edition, and John records that the soldiers “brake not his legs” ([[John 19:33]]); the note on verse 20 gives both. The psalm promises the righteous deliverance out of many afflictions, and such promises have been said to be fulfilled in Christ above all, “because He is the righteous One in the most absolute sense.”

explore: |
  - **The escape itself.** [[1 Sam. 21:10–15]] and [[1 Sam. 22:1–2]]: Gath, and then the cave Adullam, where the distressed gathered to David.
  - **The other psalm from Gath.** [[Ps. 56]], by its title “when the Philistines took him in Gath.”
  - **The companion acrostic.** [[Ps. 25]], which adds a verse after the last letter in the same way.
  - **Peter’s use of the psalm.** [[1 Pet. 2:1–5]] and [[1 Pet. 3:8–17]], read with verses 8 and 12–16 open.
  - **The broken heart as an offering.** [[Ps. 51:17]] with its note, and [[3 Ne. 9:19–20]].
parallels:
  - ref: 1 Sam. 21:10–15
    note: David feigns madness before Achish king of Gath, the occasion the title names.
  - ref: 1 Pet. 3:10–12
    note: Peter quotes verses 12–16, stopping before the cutting off of the evildoers’ remembrance.
  - ref: 1 Pet. 2:3
    note: Peter takes up verse 8 and goes on to Christ, the living stone.
  - ref: John 19:36
    note: John cites a scripture fulfilled when the soldiers did not break Jesus’s legs; compare verse 20.
  - ref: Hel. 12:1
    note: Mormon’s words on the Lord’s goodness to those who trust in Him, proposed as an allusion to verse 8.
  - ref: 2 Ne. 2:7
    note: Lehi uses the wording of verse 18, a broken heart and a contrite spirit.

