chapter: 2
title: The LORD and His Anointed
tagline: The nations plot against the LORD’s king, heaven answers with a laugh and a decree, and the rebels are offered a refuge where they expected a sentence.
when: 'David’s, by Acts 4:25; the psalm has no title and names no occasion'

setting: |
  Psalm 2 stands with Psalm 1 at the door of the book, the two together introducing the whole collection (see [[Ps. 1:1]]). The psalm itself names no author. The Saints in Jerusalem prayed it as words God spoke “by the mouth of thy servant David” ([[Acts 4:25]]), and Paul cites it by number, “as it is also written in the second psalm” ([[Acts 13:33]]).

  It is the first of the royal psalms, the psalms about Israel’s king (see the note on [[Ps. 2:2]]). Behind it is the promise the Lord made to David about the heir to his throne: “I will be his father, and he shall be my son” ([[2 Sam. 7:14]]). It has often been read of the enthronement of a king on Mount Zion.

  Its place in the book says something more. On one reading the psalm was put at the head of the collection after the monarchy had ended, “when there were no more kings being enthroned,” by people who understood it “to be looking forward prophetically to the coming of a future messianic king.” The New Testament reads it of Jesus Christ: of His rejection ([[Acts 4:25–28]]), of His Resurrection ([[Acts 13:33]]), of His standing above the angels ([[Heb. 1:5]]), and of the rule He shares with those who overcome ([[Rev. 2:26–27]]).

thread: |
  The psalm is a short drama in four scenes of three verses each. It moves **from an uproar on earth to an offer of refuge**.

  First come the kings of the earth (verses 1–3). They want out: the rule of the LORD and His anointed is to them “bands” and “cords.” The psalmist has answered his own “Why?” before they open their mouths: what they plot is “a vain thing.”

  The turn comes at verse 4, and nothing on earth has changed to cause it. The psalm simply looks up: the One who sits in the heavens laughs, and then speaks a single sentence: “Yet have I set my king upon my holy hill of Zion.” Heaven sends no army against the revolt. It points to a king already in place.

  Then the king himself speaks (verses 7–9), reading out the decree: the LORD has called him “my Son” and promised him the nations to the ends of the earth.

  Last, the psalmist turns to the rebels (verses 10–12). After the laughter and the rod of iron a reader expects a sentence of doom. What comes is an invitation: be wise, serve, “kiss the Son.” The final line is a blessing on “all they that put their trust in him,” and the verb behind “put their trust” means to flee somewhere for protection. The psalm that opened with kings throwing off the LORD’s cords closes by offering them shelter.

sections:
  - range: 1-3
    heading: The nations plot
    plain: |
      Why are the nations in an uproar, and why do the peoples plot what will come to nothing? The kings of the earth take their stand, and the rulers confer together, against the LORD and against His anointed: “Let us snap their bonds and throw their ropes off us.”
  - range: 4-6
    heading: Heaven’s answer
    plain: |
      He who sits in the heavens laughs; the Lord mocks them. Then He speaks to them in His anger and terrifies them in His fury: “But I have installed My king on Zion, My holy hill.”
  - range: 7-9
    heading: The king reads his decree
    plain: |
      I will announce the decree. The LORD said to me, “You are My Son; today I have begotten you. Ask Me, and I will give you the nations as your inheritance and the ends of the earth as your own. You will break them with an iron rod; you will shatter them like a potter’s jar.”
  - range: 10-12
    heading: A warning, and a refuge
    plain: |
      So now, you kings, be wise; take correction, you judges of the earth. Serve the LORD with fear, and rejoice with trembling. Kiss the Son, or He will be angry and you will perish on the way, when His anger is kindled even a little. Blessed are all who take refuge in Him.

notes:
  - ref: 1
    phrase: Why do the heathen rage
    kind: scripture
    title: The first Saints prayed this psalm
    body: |
      The Saints in Jerusalem prayed Psalm 2, and their prayer names David as its author and reads it of Jesus and those who opposed Him. After the council had threatened Peter and John ([[Acts 4:21–24]]), they lifted their voices together and quoted the first two verses as what God had said “by the mouth of thy servant David” ([[Acts 4:25]]). Then they read the psalm’s cast into the Savior’s trial: “against thy holy child Jesus, whom thou hast anointed, both Herod, and Pontius Pilate, with the Gentiles, and the people of Israel, were gathered together” ([[Acts 4:27]]). The prayer finds the psalm’s heathen, people, kings and rulers in the Gentiles, “the people of Israel,” Herod and Pilate.

      “Whom thou hast anointed” is the psalm’s own word. Acts quotes the psalm as the ancient Greek translation has it, “against the Lord, and against his Christ.”

      The prayer also says what came of the plot. The conspirators met “to do whatsoever thy hand and thy counsel determined before to be done” ([[Acts 4:28]]). What the Saints then ask for themselves is “that with all boldness they may speak thy word” ([[Acts 4:29]]).
    sources: [lds-scriptures, lxx-rahlfs, scripture-helps-ps-1]

  - ref: 1
    phrase: imagine a vain thing
    kind: words
    title: The nations meditate too
    body: |
      “Imagine” here means to devise or plot, and the Hebrew verb, *hagah*, is the one translated “meditate” in the psalm before: the blessed man’s “delight is in the law of the LORD; and in his law doth he meditate day and night” ([[Ps. 1:2]]). The one verb covers both musing and plotting. One man turns over the law; the nations turn over an empty thing.

      It is not the only word the two psalms share. Psalm 1 ends with a “way” that “shall perish” ([[Ps. 1:6]]), and Psalm 2 warns the kings that they may “perish from the way” (verse 12), in the same two Hebrew words. The two have long been read together, on the view that “the themes, messages, and language of Psalms 1 and 2 are seen as overlapping,” and some read the righteous man of the first psalm and the anointed king of the second as one figure. That identification is a reading; the shared words are in the text.
    sources: [oshb-wlc, bdb, ot-minute-psalms-1-20]

  - ref: 2
    phrase: his anointed
    kind: words
    title: The word behind Messiah and Christ
    body: |
      “His anointed” is the Hebrew *mashiach*, the word that comes into English as *Messiah*, and in this psalm it means first the king in Jerusalem. Israel’s kings were made kings by anointing with oil: “Samuel took the horn of oil, and anointed him in the midst of his brethren” ([[1 Sam. 16:13]]). Saul bore the title as well: David would not lift his hand against him, “seeing he is the anointed of the LORD” ([[1 Sam. 24:6]]). The word’s first sense is the “king of Israel anointed by divine command”; it is also used of the high priest and of Cyrus.

      In this verse, though, the word has been given a narrower sense: the “Davidic dynasty with Messianic ideals attached.” What is promised to this anointed one is the nations for an inheritance and the ends of the earth for a possession. By New Testament times the word had become “the title of an office,” denoting “the King and Deliverer whose coming the Jews were eagerly expecting,” and *Christ* is “the Greek equivalent of Messiah.” The Greek translation of this verse already reads “against the Lord, and against his Christ.”

      Psalm 2 is a royal psalm, one of those that “feature discussion of, or speech from, the Israelite monarch or that celebrate the office of human kingship,” many of which “are also recognized as messianic psalms.”
    sources: [oshb-wlc, bdb, lds-scriptures, bd-messiah, lxx-rahlfs, ot-minute-psalms-1-20]

  - ref: 4
    phrase: shall laugh
    kind: symbol
    title: Why the Lord laughs
    body: |
      On one reading, the laughter measures the distance between the plot and the One it is aimed at. The verse first says where He sits, “in the heavens,” that is, “enthroned above them in unapproachable majesty,” while the kings have taken their stand on the earth; and “He laughs at the defiant ones, for between them and Him there is an infinite distance.”

      The image returns twice in the Psalms. The same pair, laughter and derision, is again aimed at the heathen: “thou, O LORD, shalt laugh at them; thou shalt have all the heathen in derision” ([[Ps. 59:8]]). And the Lord laughs at the wicked man “for he seeth that his day is coming” ([[Ps. 37:13]]), a verse that gives its own reason for the laughter.

      Here the laugh is followed by a single sentence, and it reports something already done: “Yet have I set my king upon my holy hill of Zion.”
    sources: [delitzsch-psalms, lds-scriptures]

  - ref: 7
    phrase: Thou art my Son
    kind: history
    title: Israel’s king was called God’s son
    body: |
      In the psalm’s own setting these words are spoken to the king of David’s line. The voice has changed without notice: the anointed one now speaks and “announces the decree that the Lord has given him.” The psalm is one of those tied to the Lord’s covenant with David, and the covenant speaks in the same terms. Of David’s heir the Lord said, “I will be his father, and he shall be my son” ([[2 Sam. 7:14]]); of Solomon, “I have chosen him to be my son, and I will be his father” ([[1 Chr. 28:6]]); and of the Davidic king in another royal psalm, “He shall cry unto me, Thou art my father,” and “I will make him my firstborn, higher than the kings of the earth” ([[Ps. 89:26–27]]).

      So the phrase “would have been understood as a title for the king.”
    sources: [lds-scriptures, sc-knowhy-865, ot-minute-psalms-1-20, scripture-helps-ps-1]

  - ref: 7
    phrase: this day have I begotten thee
    kind: christ
    title: The New Testament hears the Father speaking to Jesus
    body: |
      The apostles quote this line as the Father’s word to Jesus Christ, and they quote it of more than one moment. Paul ties it to the Resurrection: God has kept His promise “in that he hath raised up Jesus again; as it is also written in the second psalm, Thou art my Son, this day have I begotten thee” ([[Acts 13:33]]).

      Hebrews uses the verse twice. It opens the argument that the Son is above the angels, set beside the promise to David: “For unto which of the angels said he at any time, Thou art my Son, this day have I begotten thee? And again, I will be to him a Father, and he shall be to me a Son?” ([[Heb. 1:5]]). And it shows that Christ did not take the priesthood to Himself: He was made high priest by “he that said unto him, Thou art my Son, to day have I begotten thee” ([[Heb. 5:5]]). The next verse quotes [[Ps. 110:4]].

      The voice at the Savior’s baptism, “Thou art my beloved Son; in thee I am well pleased” ([[Luke 3:22]]), was connected with this psalm by at least some early readers: “some New Testament manuscripts instead state” at that verse the words of the psalm.

      The psalm does not say when the Son was begotten, and these passages do not use it to settle that. Of Jesus the title is true in more than the royal sense: He “truly is the Son of God in two ways: the only begotten Son of God in the flesh, as well as the ultimate King.”
    sources: [lds-scriptures, sc-knowhy-865]

  - ref: 9
    phrase: break them with a rod of iron
    kind: words
    title: Break, or shepherd?
    body: |
      The Hebrew verb here can be read two ways, “break” or “shepherd,” and Revelation quotes the line in the second. With the vowels of the traditional Hebrew text, the verb is from *ra‘a‘*, “to break,” which matches “dash them in pieces” in the second half of the line. With other vowels the same consonants are a form of *ra‘ah*, to “pasture, tend, graze,” the shepherd’s verb. The ancient Greek translation read it that way: “Thou shalt rule them with a rod of iron,” where “rule” is *poimaneis*, the verb Revelation will use. The same reading has been recommended for the Hebrew.

      Revelation quotes the line three times, always with “rule.” The man child “was to rule all nations with a rod of iron” ([[Rev. 12:5]]); the rider on the white horse “shall rule them with a rod of iron” ([[Rev. 19:15]]); and in the letter to Thyatira the risen Lord extends the promise of verses 8–9 to His disciples: “he that overcometh, and keepeth my works unto the end, to him will I give power over the nations: And he shall rule them with a rod of iron… even as I received of my Father” ([[Rev. 2:26–27]]). “Rule” in that verse is the same Greek word, “he will shepherd.”

      The Joseph Smith Translation of that verse has the word of God where the rod of iron stood: “he shall rule them with the word of God; and they shall be in his hands as the vessels of clay in the hands of a potter; and he shall govern them by faith, with equity and justice.”
    sources: [bdb, lxx-rahlfs, greek-nt, lds-scriptures]

  - ref: 12
    phrase: Kiss the Son
    kind: words
    title: Homage to the king, in a hard line of Hebrew
    body: |
      On the King James reading, to kiss the king is to acknowledge him, and the kings who wanted to throw off his cords are told to do it. The gesture belongs to the making of a king: Samuel “took a vial of oil, and poured it upon his head, and kissed him” ([[1 Sam. 10:1]]). “To kiss is equivalent to to do homage.”

      The Hebrew, though, is disputed, and a reader comparing translations will see it. The word for “Son” is not the *ben* of verse 7 but *bar*, the Aramaic word for son, found in the Hebrew Bible otherwise “only in late Hebrew of Proverbs 31:2.” The ancient Greek translators did not read “son” at all: they have “Accept correction, lest at any time the Lord be angry.” The phrase has been called “dubious,” and the New Revised Standard Version joins it to the line before and prints “kiss his feet.”

      The King James reading has been strongly defended. On that view the sense “has been missed by all the ancient versions except the Syriac,” and “nothing is more natural here, after Jahve has acknowledged His Anointed One as His Son,” than that the kings should now be told to acknowledge him too.
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, delitzsch-psalms, lds-scriptures]

christ: |
  Psalm 2 is about the king the LORD set on Zion, and the New Testament says who that king finally is. The earliest Saints named Jesus as the anointed one against whom Herod and Pilate, Gentiles and Israel, gathered ([[Acts 4:27]]). Paul heard “Thou art my Son” in the Resurrection ([[Acts 13:33]]). Hebrews set the line at the head of its witness that the Son is above the angels and was called of God to be high priest ([[Heb. 1:5]]; [[Heb. 5:5]]). John saw Him rule the nations with the rod of iron ([[Rev. 19:15]]). The psalm is counted among the messianic psalms, those that speak prophetically of His life and mission.

  The kings of David’s line carried the titles of this psalm, anointed and son, and “ultimately failed to do everything they were supposed to do, but Jesus would not fail.” What they held by decree He holds as the Father’s Only Begotten.

  The psalm’s last line is where it leaves the reader. The kings are warned, and then a blessing is spoken on “all they that put their trust in him,” in a verb that means to flee for protection.

explore: |
  - **The promise behind the decree.** [[2 Sam. 7:12–16]], and its long retelling in [[Ps. 89:19–37]].
  - **The other royal psalm the New Testament leans on.** [[Ps. 110:1]], quoted beside this one in [[Heb. 5:5–6]].
  - **The whole prayer of the Saints.** [[Acts 4:23–31]], from the quotation to the shaking of the place where they met.
  - **The king as God’s son.** The Scripture Central KnoWhy “Why Does God Declare Jesus to be His Son?” sets verse 7 beside the Savior’s baptism.

parallels:
  - ref: Acts 4:25–28
    note: The Saints in Jerusalem quote verses 1–2 as David’s and apply them to Herod, Pilate, the Gentiles and Israel.
  - ref: Acts 13:33
    note: Paul quotes verse 7 from “the second psalm” of God’s raising up Jesus.
  - ref: Heb. 1:5
    note: Verse 7 is quoted with 2 Samuel 7:14 to set the Son above the angels.
  - ref: Heb. 5:5
    note: Verse 7 is quoted of Christ’s call to be high priest, followed by Psalm 110:4.
  - ref: Rev. 2:26–27
    note: The risen Lord gives the promise of verses 8–9 to those who overcome, “even as I received of my Father.”

