chapter: 67
title: That Thy Way May Be Known
tagline: Israel prays the priests’ blessing over itself and says at once what the blessing is for, that every people on earth may know God’s way and His salvation.
when: 'Undated; the title names no author and no occasion'

setting: |
  The title names no author and no occasion. The ancient Greek translation supplies a name, “a Psalm of David among the Hymns,” which the Hebrew does not have.

  Two things in the psalm itself may help place it. Its first verse is made from the blessing that Aaron and his sons were commanded to speak over Israel ([[Num. 6:24–26]]). And verse 6 speaks of the earth and her increase. On one reading the psalm is a harvest thanksgiving, sung with “the harvest as already gathered in”; the note on verse 6 takes up how far the Hebrew supports that.

  The speaker is “us” throughout, never “I.” It is a congregation’s prayer. It names God six times and never as “the LORD” (on that habit of these psalms, see [[Ps. 42:1]]), which a reader notices here because the blessing it borrows says “The LORD” three times.

  The heading in the Church’s edition calls it a messianic psalm. The section on Christ below follows that heading and the edition’s footnotes.

thread: |
  Psalm 67 begins as a prayer for “us” and ends with “all the ends of the earth,” and **verse 2 says how the one leads to the other: God blesses His people so that His way may be known among all nations.**

  The psalm is built in rings around its middle verse. On the outside is the blessing: “God be merciful unto us, and bless us” (verse 1), answered at the close by “God, even our own God, shall bless us. God shall bless us” (verses 6–7). “Bless us” comes three times in seven verses, which has been read as giving the whole psalm “the impress of the blessing of the priest, which is threefold.” Inside that ring is a refrain, the same line in verse 3 and verse 5, calling on all the peoples to praise God. And between the refrains stands verse 4: the nations are to be glad because God judges them rightly and leads them.

  The grammar turns with the rings. Verse 1 speaks about God: “his face.” From verse 2 to verse 5 the psalm speaks to Him: “thy way,” “praise thee,” “thou shalt judge.” In verses 6–7 it speaks about Him again: “fear him.”

  So Israel’s blessing is never the end of the sentence. In verse 1 it runs on into “That thy way may be known.” In verse 7 it runs on into “and all the ends of the earth shall fear him.”

sections:
  - range: 1-2
    heading: Bless us, that the earth may know
    plain: |
      May God be gracious to us and bless us, and make His face shine on us, so that Your way may be known on the earth, Your salvation among all nations.
  - range: 3-5
    heading: Let all the peoples praise
    plain: |
      Let the peoples praise You, God; let all the peoples praise You. Let the nations be glad and sing for joy, because You judge the peoples with equity and guide the nations on the earth. Let the peoples praise You, God; let all the peoples praise You.
  - range: 6-7
    heading: The harvest and the ends of the earth
    plain: |
      Then the earth will give its harvest, and God, our own God, will bless us. God will bless us, and all the ends of the earth will fear Him.

notes:
  - ref: 0
    phrase: on Neginoth, A Psalm or Song
    kind: words
    title: A psalm for strings, called both psalm and song
    body: |
      The title asks for stringed instruments and gives the piece two names. “Neginoth” is explained at [[Ps. 4:1]] and “To the chief Musician” at [[Ps. 8:1]]. The King James’s “or” is supplied: the Hebrew sets the word for a psalm and the word for a song side by side, as in the title of the psalm before it (see [[Ps. 66:1]]).
    sources: [lds-scriptures, oshb-wlc]
  - ref: 1
    phrase: God be merciful unto us, and bless us; and cause his face to shine upon us
    kind: scripture
    title: The priests’ blessing, prayed by the people
    body: |
      Verse 1 is the blessing of Aaron and his sons turned into the people’s own prayer. The priests were to say over Israel, “The LORD bless thee, and keep thee: The LORD make his face shine upon thee, and be gracious unto thee: The LORD lift up his countenance upon thee, and give thee peace” ([[Num. 6:24–26]]).

      The psalm takes three of the blessing’s verbs. “Bless” is the same in both. “Cause his face to shine” is the blessing’s “make his face shine,” the same Hebrew verb with the same noun. And “be merciful” is the blessing’s “be gracious”: one Hebrew verb, to “shew favour, be gracious,” which the King James translates two ways and a modern translation one way, “May God be gracious to us and bless us.”

      Three things are changed. The blessing was spoken by a priest to “thee”; here those who were blessed ask it for “us.” The blessing says “The LORD” in each of its three lines, and the psalm says “God.” And the blessing’s last line, the lifted countenance and the gift of peace, is not taken up.

      In Numbers the blessing ends with its effect: “And they shall put my name upon the children of Israel; and I will bless them” ([[Num. 6:27]]). An earlier psalm prays the same blessing in other words, and the note at [[Ps. 4:6]] says more about it.
    sources: [lds-scriptures, oshb-wlc, bdb, nrsvue]
  - ref: 2
    phrase: That thy way may be known upon earth
    kind: scripture
    title: Blessed so that the nations may know
    body: |
      Verse 2 gives the reason for the prayer of verse 1: Israel asks to be blessed so that the earth may know God. The verse has no main verb of its own: its one verb, “to know,” depends on verse 1 and gives its purpose. The ancient Greek translation makes that plain: “That men may know thy way on the earth, thy salvation among all nations.”

      That changes what kind of prayer verse 1 is. A people asking for favor, blessing, and the light of God’s face could be asking only for itself. This people asks so that others will see. One reading of the verse puts it as a rule: “The more graciously God attests Himself to the church, the more widely and successfully does the knowledge of this God spread itself forth.” The salvation the verse speaks of is then “not of Israel merely, but of all mankind.”
    sources: [oshb-wlc, lxx-rahlfs, delitzsch-psalms]
  - ref: 2
    phrase: thy saving health among all nations
    kind: words
    title: Saving health is salvation
    body: |
      “Saving health” is the King James’s rendering of the Hebrew word for salvation. The ancient Greek translation has simply “thy salvation among all nations,” and a modern one “your saving power among all nations.” Where the Church’s edition takes the word is in the section on Christ below.
    sources: [bdb, lxx-rahlfs, nrsvue]
  - ref: 3
    phrase: let all the people praise thee
    kind: words
    title: The people are the peoples
    body: |
      “The people” in this refrain is plural in Hebrew, “the peoples,” so the line calls on the nations of the world and not on one people. A reader of the King James could take verses 3 and 5 as Israel’s own praise. A modern translation prints what the Hebrew has: “Let the peoples praise you, O God; let all the peoples praise you.” The ancient Greek translation has plurals too.

      The psalm uses three different Hebrew words for the nations of the world, all plural: one in verse 2 (“all nations”), a second in the refrain and in verse 4 (“the people”), and a third twice in verse 4 (“the nations”). The psalm never names Israel; its own people are only “us.”
    sources: [oshb-wlc, nrsvue, lxx-rahlfs]
  - ref: 4
    phrase: for thou shalt judge the people righteously, and govern the nations upon earth
    kind: words
    title: A judge who leads
    body: |
      The nations are told to sing for joy at being judged because the judging in this verse is good government, and the verb beside it means to lead. “Righteously” translates a noun for uprightness, and in this verse it is uprightness “in government.” A modern translation has “you judge the peoples with equity.”

      “Govern” is stronger in English than in Hebrew. The verb means to “lead, guide,” and both the ancient Greek translation and a modern one have “guide the nations.” It is the verb of “he leadeth me in the paths of righteousness” ([[Ps. 23:3]]), a guiding that is “especially in path of blessing.”

      Other psalms have the same announcement. “Say among the heathen that the LORD reigneth: the world also shall be established that it shall not be moved: he shall judge the people righteously” ([[Ps. 96:10]]). In another the sea, the floods, and the hills rejoice “Before the LORD; for he cometh to judge the earth: with righteousness shall he judge the world, and the people with equity” ([[Ps. 98:9]]).

      This is the middle verse of the psalm and its only reason clause beginning “for.” The reason it gives the peoples for their gladness is what God does for them.
    sources: [bdb, nrsvue, lxx-rahlfs, lds-scriptures]
  - ref: 6
    phrase: Then shall the earth yield her increase
    kind: words
    title: A harvest given, or a harvest promised
    body: |
      The King James makes verse 6 a promise, but the Hebrew verb is in the form used for a completed act, and the ancient Greek and a modern translation read it as a harvest already gathered. The ancient Greek translation has “The earth has yielded her fruit,” and a modern one, “The earth has yielded its increase; God, our God, has blessed us.” The Hebrew line begins with “earth”; the King James’s “Then” is supplied.

      Read as past, the line reports a blessing already received. The law’s promise to Israel was, “I will give you rain in due season, and the land shall yield her increase” ([[Lev. 26:4]]). On one reading, “each plentiful harvest is to Israel a fulfilment of the promise” of that verse, “and a pledge that God is with His people, and that its mission to the whole world (of peoples) shall not remain unaccomplished.” The harvest is, on that reading, “a blessing and an earnest of further blessing.”

      The King James keeps the future. At “earth” the Church’s edition gives Lehi’s promise, “Inasmuch as ye shall keep my commandments ye shall prosper in the land” ([[2 Ne. 1:20]]), and at “increase” it points to the Topical Guide’s entry on the renewal of the earth.
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, delitzsch-psalms, lds-scriptures]

christ: |
  The Church’s edition heads Psalm 67 “A messianic psalm” and gives its lines to the Lord, in the future: “The Lord will cause His face to shine upon men—He will judge and govern in righteousness.” The heading, the edition’s footnotes, and Restoration scripture show where three of the psalm’s lines lead.

  The shining face. When the risen Lord prayed with the Nephites, “his countenance did smile upon them, and the light of his countenance did shine upon them” ([[3 Ne. 19:25]]), and the Church’s edition there points back to the priests’ blessing that verse 1 prays ([[Num. 6:25]]). The scene has been read as the moment He “fulfilled in a very literal sense, the petition of the traditional priestly blessing.” Psalm 4 prays the same blessing; see [[Ps. 4:6]].

  The salvation made known among all nations. At “saving” in verse 2 the Church’s edition points to Simeon, who took the child Jesus “up in his arms, and blessed God,” and said, “For mine eyes have seen thy salvation, Which thou hast prepared before the face of all people; A light to lighten the Gentiles, and the glory of thy people Israel” ([[Luke 2:30–32]]).

  The rule over the nations and the earth’s increase. The heading makes the Lord the one who judges and governs in verse 4. The footnote at verse 6 points to the renewal of the earth, and the tenth article of faith joins that renewal to His reign: “that Christ will reign personally upon the earth; and, that the earth will be renewed and receive its paradisiacal glory.”

explore: |
  - **The harvest before and after.** Psalm 65 has been read as the companion piece, with the grain “still standing in the fields”; compare [[Ps. 65:9–13]] with verse 6 here.

parallels:
