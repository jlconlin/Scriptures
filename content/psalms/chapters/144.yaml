chapter: 144
title: Bow Thy Heavens and Come Down
tagline: A king blesses the God who trained his hands for war, confesses that man is a breath, asks for the rescue an older song gave thanks for, and ends with his people at peace.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  The title ascribes the psalm to David and gives no occasion. The ancient Greek translation adds one, “concerning Goliad,” and one older reading takes the psalm as written to express what David felt as he went out against Goliath, when he told the Philistine that “the LORD saveth not with sword and spear” ([[1 Sam. 17:47]]). That is a tradition about the psalm and not part of its Hebrew title. The psalm itself names David in verse 10 and names no enemy; the enemies are “strange children,” foreigners.

  A reader who knows the Psalms will hear older psalms in nearly every line of the first eleven verses. Most of the lines come from David’s song of thanksgiving, [[Ps. 18]]: the God who “teacheth my hands to war,” the fortress and high tower, the heavens bowed, the arrows and lightning, the hand reaching from above into great waters. The question of [[Ps. 8:4]] is here, and the breath and shadow of [[Ps. 39:5]], and the new song on ten strings of [[Ps. 33:2–3]].

  Verses 12–14 are unlike all of this. One older reading finds no earlier model for their language, and they speak of sons and daughters, barns, flocks and quiet streets. The last verse returns to an older line, “Blessed is the nation whose God is the LORD” ([[Ps. 33:12]]).

thread: |
  Psalm 144 takes a king’s old thanksgiving and prays it again as a request. **What Psalm 18 tells as done, this psalm asks for, and it ends not with the king’s victory but with his people at peace.**

  It begins where Psalm 18 does, with a string of names for the LORD: rock, fortress, high tower, deliverer, shield (verses 1–2). The king has been taught to fight and has been given rule. Then he stops. “LORD, what is man?” (verse 3). The man with trained hands is a breath, and his days are a shadow (verse 4). In one older reading’s summary of these four verses, the LORD teaches “me the feeble mortal, who am strong only in Him.”

  So the rescue has to come from above, and verses 5–8 ask for it in the words with which Psalm 18 remembered it. There the LORD “bowed the heavens” and “sent from above.” Here the verbs are commands: bow, come down, touch, cast forth, send.

  Verses 9–10 vow a new song to the God who gives victory to kings, and verse 11 repeats the petition of verses 7–8 nearly word for word.

  The psalm turns at verse 12. Until then the speaker has been one man: “my hands,” “deliver me,” “I will sing.” From here to the end it says “our”: our sons, our daughters, our garners, our sheep, our oxen, our streets. No battle is described and no victory. The psalm goes from the prayer for rescue to a country with nothing to cry out about, and its last word on that country is not that it is rich but that its God is the LORD.

sections:
  - range: 1-2
    heading: Blessed be the LORD my strength
    plain: |
      Blessed be the LORD, my rock, who trains my hands for war and my fingers for battle. He is my mercy and my fortress, my high tower and my deliverer, my shield and my refuge, who puts my people under me.
  - range: 3-4
    heading: What is man?
    plain: |
      LORD, what is man, that You take notice of him, or a mortal, that You think of him! Man is like a breath; his days are like a shadow passing.
  - range: 5-8
    heading: Bow thy heavens and come down
    plain: |
      Bend Your heavens, LORD, and come down; touch the mountains and they will smoke. Flash lightning and scatter them; shoot Your arrows and rout them. Reach Your hand down from on high; set me free and pull me out of deep waters, out of the hand of foreigners, whose mouths speak lies and whose right hand is a lying right hand.
  - range: 9-11
    heading: A new song, and the plea again
    plain: |
      God, I will sing You a new song; on a harp of ten strings I will play to You, who give victory to kings and rescue David Your servant from the cruel sword. Set me free and pull me out of the hand of foreigners, whose mouths speak lies and whose right hand is a lying right hand.
  - range: 12-15
    heading: Happy is that people
    plain: |
      May our sons be like plants full grown while they are young, and our daughters like corner pillars cut for a palace. May our barns be full, with stores of every kind; may our sheep bear by thousands and tens of thousands in our fields; may our cattle be heavy laden. May there be no breach, no going out, and no outcry in our streets. Happy the people for whom it is so; happy the people whose God is the LORD.

notes:
  - ref: 1
    phrase: which teacheth my hands to war
    kind: scripture
    title: The opening is Psalm 18 again
    body: |
      The first two verses are made of lines from David’s song of thanksgiving. “He teacheth my hands to war” is said there in the same words ([[Ps. 18:34]]). The names of verse 2 are there as well: “The LORD is my rock, and my fortress, and my deliverer; my God, my strength, in whom I will trust; my buckler, and the horn of my salvation, and my high tower” ([[Ps. 18:2]]). Even “my strength” is shared. In both verses it is the Hebrew word for a rock, and a modern translation begins this psalm “Blessed be the LORD, my rock.” The names are explained at [[Ps. 18:2]].

      One name is new. “My goodness” is the word translated “mercy” and “lovingkindness” elsewhere in the Psalms (see [[Ps. 51:1]]), and the ancient Greek translation has “My mercy” here. The king does not say that the LORD shows him mercy. He calls the LORD his mercy, as he calls Him his fortress.

      Psalm 18 says these things after the fighting is over. This psalm says them first and then asks for help, so the list of names is the ground of the request.
    sources: [lds-scriptures, oshb-wlc, nrsvue, lxx-rahlfs]

  - ref: 2
    phrase: who subdueth my people under me
    kind: words
    title: My people, or the peoples
    body: |
      The Hebrew text has the king thank God for subduing his own people, and many ancient witnesses have “peoples,” the nations. The line it echoes is [[Ps. 18:47]], “and subdueth the people under me,” where the Hebrew word is plural. Here it is “my people,” and the ancient Greek translation agrees: “who subdues my people under me.”

      A modern translation prints “who subdues the peoples under me,” and its margin lists the support: a manuscript from Qumran, other Hebrew manuscripts, the Syriac, Aquila’s Greek and Jerome’s Latin, against the received Hebrew text.

      With “peoples” the line looks ahead to the foreigners of verse 7. With “my people” it is the king’s own nation that the LORD has put under him.
    sources: [lds-scriptures, oshb-wlc, lxx-rahlfs, nrsvue]

  - ref: 3
    phrase: what is man, that thou takest knowledge of him
    kind: scripture
    title: Psalm 8’s question, asked again
    body: |
      The question is the one Psalm 8 asks, but this psalm follows it with something different. That psalm asks, “What is man, that thou art mindful of him? and the son of man, that thou visitest him?” ([[Ps. 8:4]]), and goes on to the glory and dominion God has given him (the note there says what “son of man” means). This psalm goes on to verse 4: man is “like to vanity,” and “his days are as a shadow that passeth away.”

      “Vanity” is a breath. A modern translation has “They are like a breath,” and the word is explained at [[Ps. 39:5]], where “every man at his best state is altogether vanity.” The shadow is the image of [[Ps. 102:11]].

      The King James prints the words as an exclamation, with no question mark. They stand between the names of verses 1–2 and the request of verse 5: the king who has just listed what the LORD is to him wonders that God takes notice of man at all.
    sources: [lds-scriptures, nrsvue]

  - ref: 5
    phrase: Bow thy heavens, O LORD, and come down
    kind: scripture
    title: Psalm 18’s rescue, asked for again
    body: |
      Verses 5–7 ask the LORD to do what Psalm 18 says He did. There David sings, “He bowed the heavens also, and came down” ([[Ps. 18:9]]); “he sent out his arrows, and scattered them; and he shot out lightnings, and discomfited them” ([[Ps. 18:14]]); “He sent from above, he took me, he drew me out of many waters” ([[Ps. 18:16]]). Here each of those lines is a request. On one older reading, “The deeds of God which Psalm 18 celebrates are here made an object of prayer.”

      The past rescue is the reason for expecting another: the king asks for what he has sung about. What that coming in storm pictures is discussed at [[Ps. 18:7]].

      One line is not from Psalm 18. “Touch the mountains, and they shall smoke” is said of the Creator in another psalm, “he toucheth the hills, and they smoke” ([[Ps. 104:32]]), and the same older reading takes the image “from the mountains that smoked at the giving of the Law,” when “mount Sinai was altogether on a smoke, because the LORD descended upon it in fire” ([[Ex. 19:18]]).
    sources: [lds-scriptures, delitzsch-psalms]

  - ref: 8
    phrase: their right hand is a right hand of falsehood
    kind: symbol
    title: Foreigners whose word cannot be trusted
    body: |
      The enemies are foreign powers, and the charge against them is false dealing. “Strange children” is literally sons of a foreign land, meaning a “foreigner,” and the same phrase is behind “the strangers” who submit to David in [[Ps. 18:44]]. On one older reading the “great waters” are not a second danger: Psalm 18 leaves the waters as a figure, and here the poet “has added the interpretation to the figure,” “out of great waters, from the hand of strange children.”

      What they do wrong is said twice, in verse 8 and again in verse 11, and both times it is falsehood. Their mouth speaks “vanity,” which is not the “vanity” of verse 4: a modern translation has “breath” there and “lies” here. Their right hand is “a right hand of falsehood,” which the same older reading explains as “the hand raised for a false oath.” That is one reading; the psalm does not say what was sworn.

      How the psalms that pray against enemies are to be read is set out at [[Ps. 137:8]]. Here the prayer is to be rescued from them.
    sources: [bdb, delitzsch-psalms, nrsvue, lds-scriptures]

  - ref: 10
    phrase: David his servant
    kind: scripture
    title: The king names himself
    body: |
      The speaker steps back and names himself as one more king whom God has saved. The sentence begins with kings in general, “It is he that giveth salvation unto kings,” and only then comes to David. Psalm 18 closes the same way, with the singer’s own name in the third person: the LORD “sheweth mercy to his anointed, to David, and to his seed for evermore” ([[Ps. 18:50]]).

      David’s name comes inside the vow of a “new song” (the phrase and the ten-stringed instrument are explained at [[Ps. 33:2]] and [[Ps. 33:3]]), a song vowed before the rescue that verse 11 asks for again.

      Where the sentence ends is read in two ways. The King James ends verse 10 with “from the hurtful sword.” A modern translation ends it a phrase sooner, “who rescues his servant David,” and begins the plea of verse 11 with the sword: “Rescue me from the cruel sword.”
    sources: [lds-scriptures, nrsvue]

  - ref: 12
    phrase: That our sons may be as plants grown up in their youth
    kind: structure
    title: From the king’s rescue to the people’s plenty
    body: |
      At verse 12 “me” becomes “our,” and what the psalm is asking for depends on how the two halves are joined. The King James joins them with “That”: the king asks to be rescued so that the people’s sons and daughters, barns and flocks may thrive.

      A modern translation begins a new sentence and makes the lines a wish, “May our sons in their youth” be “like plants full grown.” The sense is near the King James’s, without the “so that.”

      The ancient Greek translation reads the lines differently. It has “whose children are as plants” and “their daughters,” so that verses 12–14 describe the prosperity of the foreigners of verse 11 (the note on verse 15 gives its rendering of the psalm’s last verse). The King James and the modern translation keep “our,” and the plenty is Israel’s: the psalm is David blessing the LORD “for deliverance and temporal prosperity.”
    sources: [lds-scriptures, lxx-rahlfs, nrsvue]

  - ref: 12
    phrase: as corner stones, polished after the similitude of a palace
    kind: symbol
    title: Daughters like the corners of a palace
    body: |
      The daughters are compared to the carved corners of a great building, and the sons to plants. The word is “corner,” and the line has been rendered with the daughters “like corner (-pillar)s, carved” in “palace-fashion.” A modern translation has “our daughters like corner pillars,” which are “cut for the building of a palace.” The rendering is not certain, and the exact piece of architecture is unknown; the picture is of carved work in a palace.

      The two images are a pair: sons like young plants already full grown, daughters like the finished work of a builder.
    sources: [bdb, nrsvue]

  - ref: 14
    phrase: that there be no breaking in, nor going out
    kind: words
    title: No breach in the wall, and no one led out
    body: |
      The last blessing is that nothing bad happens, and the King James’s wording hides what the bad things are. “Breaking in” is the word for a “breach in wall,” the gap an enemy makes in a city’s defenses. “Going out” is left bare in the Hebrew. A modern translation takes it as exile and renders the pair “no breach in the walls, no exile,” noting that the Hebrew has no “in the walls.” The “complaining in our streets” is a “cry of distress.” The picture is of a town that has not been stormed, emptied or left wailing.

      The line about the oxen is also read two ways. The King James has the oxen “strong to labour.” The Hebrew word is “laden,” which has been taken as “pregnant” and, perhaps better, as loaded with an abundant harvest; a modern translation has “may our cattle be heavy with young.” Either reading belongs to the same picture of plenty.
    sources: [bdb, nrsvue]

  - ref: 15
    phrase: happy is that people, whose God is the LORD
    kind: scripture
    title: Two lines, the second greater
    body: |
      The psalm ends by calling a people happy twice, first for what they have and then for whose they are. “Happy” is the word translated “Blessed” at the opening of the Psalter (see [[Ps. 1:1]]), and the second line is close to an earlier one: “Blessed is the nation whose God is the LORD” ([[Ps. 33:12]]).

      Whether the two lines agree or disagree has been read both ways. The Greek translation sets them against each other, and makes the first line what other people say: “Men bless the people to whom this lot belongs, but blessed is the people whose God is the Lord.” One older reading keeps them together: “There is, however, no antithesis intended, but only an exceeding of the first declaration by the second.” Full barns are a blessing, and having the Giver for one’s God is a greater one. The King James, which begins the second line with “yea,” reads the same way.
    sources: [lds-scriptures, oshb-wlc, lxx-rahlfs, delitzsch-psalms]

christ: |
  The LORD whom the king blesses and asks to come down is Jehovah, who is Jesus Christ before His birth ([[Ps. 110:1]] has the note). It is He whom the psalm calls fortress, deliverer and shield, and He whose people the last line calls happy.

  The question of verse 3 is also carried to Christ in scripture, in its older form. Hebrews quotes “What is man, that thou art mindful of him?” ([[Heb. 2:6]]) and reads the answer of Jesus; the note on [[Ps. 8:6]] follows the argument.

explore: |
  - **The song this psalm is made from.** [[Ps. 18:1–19]] and [[Ps. 18:31–50]], read beside verses 1–11, to see which lines were thanks before they were requests.
  - **The question in its other places.** [[Ps. 8:3–6]] and [[Job 7:17–18]], beside verses 3–4 here.
  - **The same last line.** [[Ps. 33:12]], with the psalm around it.

parallels:
  - ref: Ps. 18:9–16
    note: The LORD bows the heavens, sends arrows and lightning, and draws David out of many waters; verses 5–7 ask for the same (also 2 Sam. 22).
  - ref: Ps. 18:34
    note: “He teacheth my hands to war,” the words of verse 1.
  - ref: Ps. 8:4
    note: The question of verse 3, there answered with glory and dominion (also Job 7:17; Heb. 2:6).
  - ref: Ps. 39:5
    note: Every man is “altogether vanity,” a breath, as in verse 4 (also Ps. 102:11).
  - ref: Ps. 33:12
    note: “Blessed is the nation whose God is the LORD,” the line verse 15 ends on.

sources: [lds-scriptures, oshb-wlc, bdb, lxx-rahlfs, nrsvue, delitzsch-psalms, gs-jehovah]
