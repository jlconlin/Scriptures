chapter: 83
title: Keep Not Thou Silence
tagline: Ten peoples have made a covenant to erase the name of Israel. The psalm asks God not to sit still but to do again what He did to Sisera and to Midian, until the enemies know His own name.
when: 'By its title, a psalm of Asaph; undated, with ten peoples in league against Israel'

setting: |
  Psalm 83 is “the last of the twelve Psalms of Asaph” ([[Ps. 50:1]] has the note on him). The psalm before it closes by asking God to judge the earth, “for thou shalt inherit all nations” ([[Ps. 82:8]]); this one closes with the nations learning that He is “the most high over all the earth,” and the two endings have been read as a pair.

  What has happened is a league. Ten peoples, named in verses 6–8, have agreed to “cut them off from being a nation.” The psalm reports a plot and not yet a defeat: the enemies “make a tumult,” take counsel, and say what they mean to do. It is prayed before the blow falls.

  It is a prayer for the whole people, yet it never says “we” or “us.” Its only first-person phrase is “O my God” in verse 13. It has a lament’s complaint and plea ([[Ps. 22:1]] sets out the form), but it reaches no vow of praise and reports no answer.

  The psalm gives no date. The note on verse 8 weighs one occasion proposed for it, the invasion of Judah in the days of King Jehoshaphat ([[2 Chr. 20:1]]).

thread: |
  Psalm 83 is **a prayer about a name**, set against a plot to erase one. The enemies’ aim is “that the name of Israel may be no more in remembrance” (verse 4). The psalm’s aim, stated twice at the end, is “that they may seek thy name” (verse 16) and “that men may know that thou, whose name alone is JEHOVAH, art the most high over all the earth” (verse 18).

  The prayer moves in three steps. It opens with one verse of plea, asking God three times over not to be still. Then, with “For, lo,” it gives the reason (verses 2–8), and the complaint is put in terms of God: “thine enemies,” “they that hate thee,” “thy people,” “thy hidden ones,” and at last “they are confederate against thee.” The complaint begins with counsel “against thy people” and ends with a covenant “against thee.”

  After the Selah the psalm turns from the enemies to God and stays there: “Do unto them.” It asks first from history, naming two victories from the book of Judges (verses 9–12), and then from wind, fire and storm (verses 13–15). The last three verses say what all of it is for.

  The names of God move as well. The psalm begins “O God,” and for fifteen verses it uses no other name. The divine name comes only in verses 16 and 18, where the prayer is that the nations seek it and know it.

sections:
  - range: 1-4
    heading: Be not still, O God
    plain: |
      O God, do not keep quiet; do not be silent, and do not sit still, O God. Look: Your enemies are in an uproar, and those who hate You have raised their heads. They lay cunning plans against Your people and conspire against those You keep hidden. They say, “Come, let us wipe them out as a nation, so that the name of Israel is remembered no more.”
  - range: 5-8
    heading: Ten peoples in covenant against thee
    plain: |
      They have agreed together with one mind; against You they make a covenant: the tents of Edom and the Ishmaelites, Moab and the Hagarenes, Gebal, Ammon and Amalek, Philistia with the people of Tyre. Assyria too has joined them; they have become the strong arm of the children of Lot.
  - range: 9-12
    heading: As to Sisera, as to Midian
    plain: |
      Do to them as You did to Midian, as to Sisera and Jabin at the brook Kishon, who were destroyed at En-dor and became dung for the ground. Make their nobles like Oreb and Zeeb, and all their princes like Zebah and Zalmunna, who said, “Let us take the pastures of God for our own.”
  - range: 13-15
    heading: Whirling dust, fire and storm
    plain: |
      O my God, make them like whirling dust, like chaff before the wind. As fire burns a forest, as flame sets the mountains ablaze, so pursue them with Your tempest and terrify them with Your storm.
  - range: 16-18
    heading: That men may know
    plain: |
      Fill their faces with shame, so that they seek Your name, O LORD. Let them be ashamed and dismayed for ever; let them be disgraced and perish. Let them know that You, whose name alone is Jehovah, are the Most High over all the earth.

notes:
  - ref: 1
    phrase: Keep not thou silence
    kind: words
    title: Three ways of asking God to act
    body: |
      The opening verse asks one thing three times, and what it asks for is action more than speech. The first clause says in Hebrew “let there be no quiet to thee.” Its noun means “cessation, pause, quiet, rest,” and the phrase in this verse has been glossed “keep not quiet (inactive).” The third verb, “be not still,” means to “be quiet, inactive”; elsewhere it is used of the LORD looking on “as an inactive spectator.” Between them stands “hold not thy peace,” the verb of [[Ps. 28:1]], where its note explains it.

      Isaiah uses the first phrase the other way round. The watchmen on Jerusalem’s walls are told, “keep not silence” ([[Isa. 62:6]]), which is the same Hebrew phrase. The next verse goes on, “And give him no rest, till he establish, and till he make Jerusalem a praise in the earth” ([[Isa. 62:7]]), where “rest” is the same noun again. There the people who pray are to take no quiet and to give the LORD none. Here the psalm asks the LORD Himself to take none.
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 3
    phrase: thy hidden ones
    kind: words
    title: Hidden ones are the ones God keeps
    body: |
      “Thy hidden ones” are people God has put away for safekeeping, not people who have gone into hiding. The word is a passive form of a verb meaning to “hide, treasure up,” and in this verse it has been explained as the LORD’s “treasured ones, his saints.” The verb is used of His “hiding his servants (from evil)” in two other psalms, one of them a line of trust: “in the time of trouble he shall hide me in his pavilion” ([[Ps. 27:5]]).

      The translations go both ways from the one word. One modern translation has “those you protect,” another calls them God’s “treasured ones,” and the ancient Greek has “thy saints.”
    sources: [bdb, nrsvue, esv, lxx-rahlfs, lds-scriptures]

  - ref: 5
    phrase: they are confederate against thee
    kind: words
    title: A covenant cut against God
    body: |
      The Hebrew behind “they are confederate against thee” says that the nations cut a covenant against God. The noun is the usual word for covenant and the verb is one that means to “cut off, cut down”; a modern translation has “against you they make a covenant.”
    sources: [oshb-wlc, bdb, nrsvue]

  - ref: 6
    phrase: The tabernacles of Edom, and the Ishmaelites
    kind: history
    title: Ten peoples, and Israel’s kin among them
    body: |
      The list names ten peoples, and five of them are Israel’s relatives by the Bible’s own genealogies. Edom is Jacob’s brother: “Esau, who is Edom” ([[Gen. 36:1]]). Amalek was a grandson of Esau ([[Gen. 36:12]]). Moab and Ammon are the children of Lot named in verse 8, the sons of Lot’s two daughters ([[Gen. 19:37–38]]). The Ishmaelites descend from Ishmael, the son of Abraham and Hagar, and Lot was the son of Abraham’s brother Haran.

      Two names are less certain. The Hagarenes were “a tribe (Aramaean ? Arabian ?) with which the east Jordan Israelites waged successful war”; Chronicles places that war “in the days of Saul” ([[1 Chr. 5:10]]). Gebal has been identified as a “mountainous region south of Dead Sea.”

      The rest are the Philistines, the people of Tyre, and “Assur,” which is Assyria. Assyria comes last and as a helper: it “also is joined with them.”
    sources: [lds-scriptures, bd-ishmael, bd-lot, bdb, nrsvue]

  - ref: 8
    phrase: they have holpen the children of Lot
    kind: history
    title: When the league was made
    body: |
      The psalm does not say when the ten peoples joined, and one occasion proposed for it, the invasion of Judah under King Jehoshaphat, accounts for only part of the list.

      The Hebrew behind “they have holpen” says that they have been an “arm” to the children of Lot, the arm being a “symbol of strength”; a modern translation has “they are the strong arm of the children of Lot.” On one older reading Moab and Ammon are those “with whom the enterprise started,” and Assyria comes in to strengthen them.

      That is how the invasion in Chronicles begins: “the children of Moab, and the children of Ammon, and with them other beside the Ammonites, came against Jehoshaphat to battle” ([[2 Chr. 20:1]]). The king’s prayer adds “mount Seir” ([[2 Chr. 20:10]]), where Esau dwelt ([[Gen. 36:8]]), and says the invaders have come “to cast us out of thy possession, which thou hast given us to inherit” ([[2 Chr. 20:11]]). A modern translation’s cross-references set those verses beside verse 6 of the psalm. The LORD’s answer that day came through “a Levite of the sons of Asaph” ([[2 Chr. 20:14]]), and one older reading finds that this “coincides remarkably” with the name in the psalm’s title.

      The same reading admits “a difficulty”: Chronicles makes “no mention” of Amalek, Philistia, Tyre or Assyria. It reports that other interpreters have placed the psalm much later, in the time of Nehemiah or of the Maccabees.
    sources: [delitzsch-psalms, bdb, nrsvue, lds-scriptures]

  - ref: 9
    phrase: Do unto them as unto the Midianites
    kind: history
    title: Two victories from the book of Judges
    body: |
      Verses 9–11 ask God to repeat two victories told in Judges 4–8, and the record credits both to the LORD and not to Israel’s army.

      **Sisera and Jabin.** Sisera was “the captain of Jabin’s army” ([[Judg. 4:7]]), with chariots. At the Kishon “the LORD discomfited Sisera, and all his chariots, and all his host” ([[Judg. 4:15]]), and Deborah’s song says, “The river of Kishon swept them away” ([[Judg. 5:21]]). The account of the battle in Judges 4–5 does not name En-dor. One older reading locates it “near Tabor,” the mountain Barak came down from to the battle ([[Judg. 4:14]]), so that it “belonged to the battle-field.”

      **Midian.** Before Gideon’s battle the LORD cut his army down, “lest Israel vaunt themselves against me, saying, Mine own hand hath saved me” ([[Judg. 7:2]]). In the camp “the LORD set every man’s sword against his fellow” ([[Judg. 7:22]]). Oreb and Zeeb were “two princes of the Midianites,” killed in the flight ([[Judg. 7:25]]). Zebah and Zalmunna were the “kings of Midian” ([[Judg. 8:5]]), whom Gideon chased down and slew ([[Judg. 8:21]]).

      The story of Midian ends, “Thus was Midian subdued before the children of Israel, so that they lifted up their heads no more” ([[Judg. 8:28]]). The enemies of verse 2 “have lifted up the head,” and a modern translation’s cross-references join the two verses.

      Isaiah calls on the same memory. [[Isa. 9:4]] has a note on “the day of Midian,” and [[Isa. 10:26]] names the rock of Oreb.
    sources: [lds-scriptures, esv, delitzsch-psalms]

  - ref: 13
    phrase: make them like a wheel
    kind: symbol
    title: Whirling dust, not a wheel
    body: |
      The “wheel” is something the wind rolls along, probably whirling dust or a tumbleweed. The Hebrew word can mean “wheel, whirl, whirlwind,” and in this verse it has been explained as a “whirl (of dust or chaff),” a “simile of foes put to flight by God.”

      Isaiah has the same word in the same picture. Nations rush on like many waters, God rebukes them, and they are chased “like a rolling thing before the whirlwind” ([[Isa. 17:13]]). The second half of the psalm’s line says it again with “stubble before the wind”; [[Ps. 1:4]] has the note on chaff.

      Verses 14–15 change the picture to a forest fire and then a storm, and the request stays the same. For the King James’s “persecute” a modern translation has “so pursue them with your tempest.”
    sources: [bdb, oshb-wlc, nrsvue, lds-scriptures]

  - ref: 16
    phrase: that they may seek thy name
    kind: scripture
    title: What the curses are for
    body: |
      The curses of verses 9–17 close on two clauses of purpose, that the enemies seek God’s name and that men know Him. How the cursing psalms are read, and how the Savior’s command to love enemies stands above them, is the note at [[Ps. 137:8]].

      Verse 16 asks for shame “that they may seek thy name.” Verse 18 asks “that men may know.” Between them verse 17 asks that the same people “perish.” The psalm sets the three side by side and does not reconcile them.

      On one older reading the seeking is meant in earnest: the wish is that the enemies “in the midst of their downfall may lay hold upon the mercy of Jahve as their only deliverance” (“Jahve” is that writer’s spelling of the divine name), and in the knowing of verse 18 “the knowledge which is unto salvation is not excluded.”

      The speaker asks and does not act. From verse 9 to verse 17 every request is “do,” “make,” “fill,” spoken to God, or “let them.” Another psalm ends its curse on the same purpose: “let them know that God ruleth in Jacob unto the ends of the earth” ([[Ps. 59:13]]).
    sources: [delitzsch-psalms, lds-scriptures]

  - ref: 18
    phrase: whose name alone is JEHOVAH
    kind: words
    title: The divine name, spelled out
    body: |
      This is the only verse in the Psalms where the King James Version prints the divine name as JEHOVAH. The Hebrew is the same four-letter name that stands two verses earlier as “O LORD.” The King James follows Jewish custom and generally prints the name as LORD or GOD in small capitals. It is spelled out as well at [[Ex. 6:3]], [[Isa. 12:2]] and [[Isa. 26:4]]. The name denotes the “Unchangeable One,” “the eternal I Am.” The short form of the name is at [[Ps. 68:4]].

      Translations differ on where “alone” belongs. The King James joins it to the name. A modern translation joins it to the title, “you alone, whose name is the Lord, are the Most High over all the earth,” and so does the ancient Greek: “thy name is Lord; that thou alone art Most High over all the earth.”

      “Most high” is a title in its own right, “Highest, Most High,” a “name of God.” It is the same Hebrew word as in the psalm before, at [[Ps. 82:6]].
    sources: [bd-jehovah, oshb-wlc, bdb, nrsvue, lxx-rahlfs, lds-scriptures]

christ: |
  The psalm ends on a name, and “Jehovah is the premortal Jesus Christ.” The Church’s edition marks the name in verse 18 with a reference to the Topical Guide’s heading “Jesus Christ, Jehovah.”

  The name is heard again in latter-day scripture. In the Kirtland Temple Joseph Smith and Oliver Cowdery saw the risen Lord and heard “the voice of Jehovah” ([[D&C 110:3]]), and what it said was, “I am the first and the last; I am he who liveth, I am he who was slain; I am your advocate with the Father” ([[D&C 110:4]]).

explore: |
  - **The two victories.** [[Judg. 4–5]] for Sisera and the Kishon, and [[Judg. 6–8]] for Gideon and Midian.
  - **Jehoshaphat’s prayer.** [[2 Chr. 20:1–30]], where a league led by Moab and Ammon comes against Judah and the answer comes through a Levite of the sons of Asaph.
  - **Those who will not keep silence.** [[Isa. 62:1–7]], where the watchmen are told to give the LORD no rest.
  - **The psalm before.** [[Ps. 82]], whose closing prayer this psalm’s ending has been paired with.
  - **The name spelled out.** [[Ex. 6:3]], [[Isa. 12:2]] and [[Isa. 26:4]], three other verses where the King James prints JEHOVAH as it does here.

parallels:
  - ref: Judg. 4:15
    note: The LORD discomfits Sisera and his host at the Kishon, the first victory the psalm asks to see again.
  - ref: Judg. 7:25
    note: Oreb and Zeeb, the two princes of Midian, are slain in the flight from Gideon.
  - ref: 2 Chr. 20:10–11
    note: Jehoshaphat prays against Ammon, Moab and mount Seir, who come “to cast us out of thy possession.”
  - ref: Isa. 17:13
    note: Nations rebuked by God are chased “like a rolling thing before the whirlwind,” the Hebrew word of verse 13.
  - ref: Jer. 48:2
    note: “Come, and let us cut it off from being a nation” is said against Moab, one of this psalm’s ten peoples.
  - ref: Isa. 62:6–7
    note: The watchmen are told to keep not silence and to give the LORD no rest.

