chapter: 42
title: Why Art Thou Cast Down, O My Soul?
tagline: A man far from the house of God thirsts like a deer at the stream-bed, is asked every day where his God is, and twice tells his own soul to hope.
when: 'Undated; by its title a psalm for the sons of Korah'

setting: |
  Psalm 42 opens the second of the Psalter’s five books, and two things change at once. The first is the title, which gives the psalm to “the sons of Korah,” a family of temple singers (see the note on the title). The second is the name of God. The speaker says “God” thirteen times and “the LORD” once, in verse 8. By one older count the divine name stands 272 times in Book One and 30 times in Book Two, where “God” takes its place.

  The speaker is one man, far to the north or east of Jerusalem (verse 6), who used to go up to the house of God with the festival crowd and now cannot. The people around him ask every day where his God is. Nothing in the psalm says when this was. One older reading makes him a Levite beyond the Jordan with David, “his exiled king,” in Absalom’s rebellion; other proposals differ, one putting him among those carried away to Babylon. The psalm names no occasion.

  Psalm 43 has no title, and it ends with the refrain that closes both halves of this psalm. The two have long been read as one poem (see the first note on verse 5), and this chapter reads Psalm 42 as the first two of its three stanzas.

thread: |
  Psalm 42 is **a man arguing with his own soul**, and the argument is not finished when the psalm ends.

  Three questions run through it, each from a different voice. The people around him ask, “Where is thy God?” (verses 3 and 10). He asks God, “Why hast thou forgotten me?” (verse 9). And he asks himself, “Why art thou cast down, O my soul?” (verses 5 and 11). Neither of the first two is answered in the psalm. The third is answered by the man who asks it: “hope thou in God: for I shall yet praise him.”

  Water carries the feeling. He begins thirsty, a deer at a stream-bed (verses 1–2), with tears for food (verse 3). By verse 7 water has come, and it is a flood: “all thy waves and thy billows are gone over me.”

  He remembers twice. In verse 4 he remembers “these things,” the processions he has lost, and pours out his soul. In verse 6 he says to God, “therefore will I remember thee.”

  The psalm is a lament ([[Ps. 22:1]] sets out the form), yet it has no petition. It has complaint, and in verse 8 a statement of trust, where the psalm’s one “LORD” stands beside “his lovingkindness,” the covenant word explained at [[Ps. 51:1]]. The request comes in Psalm 43: “O send out thy light and thy truth” ([[Ps. 43:3]]). Here the refrain’s word is “yet.” Praise is still ahead of him when the psalm closes.

sections:
  - range: 1–5
    heading: Thirst, and the memory of the feast
    plain: |
      He pants for God as a deer pants for the brooks, and asks when he will come and appear before God. Tears are his food day and night while people keep asking where his God is. He remembers how he used to go with the crowd to the house of God, with joy and praise, at the festival. Then he questions his own soul: why so cast down, why so disquieted? Hope in God. He will praise Him yet.

  - range: 6–11
    heading: The flood, the taunt, and the same answer
    plain: |
      His soul is cast down all the same, so he remembers God from where he is, in the country of the Jordan and Hermon. Deep calls to deep, and God’s waves have gone over him. Yet the LORD will command His lovingkindness by day, and by night there will be a song and a prayer. He will ask God, his rock, why He has forgotten him and why he goes mourning under an enemy. The taunt is like a sword in his bones: where is your God? He says to his soul what he said before: hope in God, whom he will yet praise, the health of his countenance and his God.

notes:
  - ref: 0
    phrase: for the sons of Korah
    kind: history
    title: The sons of Korah
    body: |
      The sons of Korah were a family of Levites who sang and kept the gates at the sanctuary, descended from the man who rebelled against Moses. Korah was a great-grandson of Levi and “the leader of the rebellion against Moses and Aaron.” The earth swallowed him with his company, and the census in the wilderness adds one short sentence: “Notwithstanding the children of Korah died not” ([[Num. 26:11]]).

      Their descendants appear at the house of God. The Korahites “formed a guild of musicians,” while others held “the responsible post of doorkeeper.” Chronicles traces “Heman a singer,” one of those David set over the music, back to Korah ([[1 Chr. 6:33–37]]), calls the Korahites “keepers of the gates of the tabernacle” ([[1 Chr. 9:19]]), and has them standing “to praise the LORD God of Israel with a loud voice on high” in Jehoshaphat’s day ([[2 Chr. 20:19]]).

      Eleven psalms carry the family’s name: this one, Psalms 44–49, and 84, 85, 87 and 88. Whether “for” means written by them or given to them to sing, the title does not say; a modern translation has “of the Korahites.” Such names in the titles join the psalms to “Levitical priest-figures who served in the temple of God.” Another of their psalms cries out “for the living God,” as this one does, and would “rather be a doorkeeper in the house of my God” ([[Ps. 84:2]]; [[Ps. 84:10]]).

      The title’s other terms are explained where they first appear: “To the chief Musician” at [[Ps. 8:1]] and “Maschil” at [[Ps. 32:1]].
    sources: [bd-korah, lds-scriptures, hopkin-psalms-sung, nrsvue]

  - ref: 1
    phrase: As the hart panteth after the water brooks
    kind: symbol
    title: A deer at the stream-bed
    body: |
      The opening image is an animal’s thirst, at a watercourse that can run dry. A hart is a “hart, stag, deer,” and this verse is cited for the deer “as longing for water.” The Hebrew behind “brooks” is a word for a “channel,” a “stream-bed, ravine, wady.” The same two Hebrew words, channels of water, stand in Joel’s drought: “The beasts of the field cry also unto thee: for the rivers of waters are dried up” ([[Joel 1:20]]).

      The verb “panteth” is said of the deer and then of the soul, and it comes nowhere else in the Psalms. The comparison is to thirst, a need of the body, and verse 2 says so outright: “My soul thirsteth for God, for the living God.”
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 2
    phrase: appear before God
    kind: words
    title: To see the face of God
    body: |
      The Hebrew of this line has the word “face”: he asks when he will come and appear before, or see, the face of God. To “appear before” God is the law’s phrase for going up to the sanctuary at the three yearly feasts ([[Ex. 23:17]]), and in this verse the psalmist longs to come to God in the temple.

      The Hebrew verb as it is vocalized is passive, “be seen,” which the King James gives as “appear.” It has been argued that in the law’s command the verb “should be vocalized slightly differently” and that the sentence once said every male “will see the face” of the Lord. The same translation is given for this verse: “When will I go and see the face of God?” A modern translation likewise has him “come and behold” the face of God. This is a proposal about how one word was once pronounced, and it is offered as such: “if the emended reading is correct.”

      Either way the longing is for a presence in a place. “Seeking the face of the Lord and seeking to be in the temple were twin thrusts of the same quest.” The temple in the Psalms is discussed at [[Ps. 24:3]].
    sources: [oshb-wlc, skinner-seeing-god, nrsvue]

  - ref: 4
    phrase: I went with them to the house of God
    kind: history
    title: The procession he remembers
    body: |
      What he remembers is a pilgrim feast, and perhaps his own part in leading it. The last words of the verse, “a multitude that kept holyday,” use the verb for keeping one of Israel’s pilgrim feasts, which were “celebrated in part by sacred processions and dances.”

      The middle of the verse is hard. A modern translation marks it “Meaning of Heb uncertain” and has the speaker say that he “led them in procession to the house of God”; the crowd has likewise been taken as “led by the Psalmist in procession.” The ancient Greek translators read something else altogether: “I will go to the place of thy wondrous tabernacle.”

      The feasts were “accompanied by the singing of psalms and a feeling of joy centered on the temple.” So what he has lost in this verse is a place, a people and a sound, “the voice of joy and praise.” The voices he hears now ask where his God is.
    sources: [bdb, nrsvue, lxx-rahlfs, skinner-seeing-god]

  - ref: 5
    phrase: Why art thou cast down, O my soul?
    kind: structure
    title: The refrain, and Psalm 43
    body: |
      The refrain comes three times, twice here and once at the end of Psalm 43, and it divides one poem into three stanzas. Verse 5, verse 11 and [[Ps. 43:5]] are nearly the same sentence. Psalm 43 has no title of its own, and it repeats this psalm’s complaint as well: “why go I mourning because of the oppression of the enemy?” ([[Ps. 43:2]]; compare verse 9). On an old reading, which cites Eusebius for it, the “similarity of the situation, of the general impress, of the structure, and of the refrain” shows that the two psalms “commonly reckoned as two” are one.

      The refrain is a man speaking to himself. “Cast down” translates a verb form found only in these two psalms: in the three refrains and in verse 6, each time with “my soul” as its subject. Its sense is “be cast down, despairing.” In verse 6 he is no longer asking. After the first refrain his soul is still cast down, and he says so to God.

      The same older reading gives the shape its meaning: three times his pain breaks out in complaint, and each time it is “overcome by the admonitory voice of his higher consciousness.” Each stanza lets the grief speak and then answers it in the same words, which tell the soul to hope.
    sources: [lds-scriptures, delitzsch-psalms, bdb, oshb-wlc]

  - ref: 5
    phrase: hope thou in God
    kind: scripture
    title: Nephi speaks to his soul
    body: |
      Nephi’s psalm has this psalm’s way of speaking, a man questioning and commanding his own soul. After his father’s death Nephi asks, “why should my heart weep and my soul linger in the valley of sorrow” ([[2 Ne. 4:26]]), and then answers himself: “Awake, my soul! No longer droop in sin” ([[2 Ne. 4:28]]). Like the refrain, he ends with praise promised to “my God, and the rock of my salvation” ([[2 Ne. 4:30]]).

      The Church’s edition joins the two passages in its footnote to verse 11. The likeness is of thought more than of wording, and it is not certain that Nephi had this psalm in mind: these verses have been named as a possible example of the “conceptual allusions” that a search for shared wording would miss.
    sources: [lds-scriptures, hilton-psalms-bom]

  - ref: 6
    phrase: my soul is cast down within me
    kind: christ
    title: The words of Gethsemane
    body: |
      In Gethsemane the Savior spoke of His soul in the word the Greek version of this psalm uses in its refrain. “My soul is exceeding sorrowful, even unto death,” He told Peter, James and John ([[Matt. 26:38]]; [[Mark 14:34]]). “Exceeding sorrowful” is one Greek word, *perilypos*, and the ancient Greek translation of the refrain has it too: “Wherefore art thou very sad, O my soul?” He also said, “Now is my soul troubled” ([[John 12:27]]), and the Greek of this verse reads “my soul has been troubled within me.”

      An older commentary sets Matthew’s and John’s verses beside the refrain. The Gospels do not cite the psalm, and nothing in them says that Jesus was quoting it. What the texts show is narrower: Matthew and Mark give His words about His own soul with the word of this psalm’s Greek refrain.
    sources: [greek-nt, lxx-rahlfs, delitzsch-psalms]

  - ref: 6
    phrase: from the land of Jordan, and of the Hermonites, from the hill Mizar
    kind: history
    title: Where the speaker is
    body: |
      The three names put him far from Jerusalem, in the north or the east of the land. “Hermonites” is not a people: “The Hermonites (Ps. 42:6) are the three peaks of Mount Hermon,” a mountain “in the extreme northeast of the Holy Land,” and a modern translation writes simply “Hermon.” Mizar is “a mountain near Hermon,” “not identified.” The name may mean “littleness,” and the Greek translators took it so: “from the little hill.”

      Just where he stands is not agreed. One older reading takes “the land of Jordan” as the country beyond the river, to the east, and not as “the northern mountain range together with the sources of the Jordan.” The psalm does not settle it. What the names do is measure a distance. He will remember God “from” there, and the hill he wants is another: “let them bring me unto thy holy hill” ([[Ps. 43:3]]).
    sources: [bd-hermon, nrsvue, bdb, lxx-rahlfs, delitzsch-psalms]

  - ref: 7
    phrase: Deep calleth unto deep at the noise of thy waterspouts
    kind: symbol
    title: The flood, and whose it is
    body: |
      The image is of deep water answering deep water in a roar, with the speaker underneath. “Deep” is the word for the “deep, sea, abyss”; “waterspouts” are a “pipe, spout, conduit,” used here as a figure “of sluices of heaven opened.” The Greek has “cataracts,” and a modern translation “at the thunder of your torrents.” The picture may come from where he stood, since the deep has been thought “possibly here of Jordan.”

      The spouts, the waves and the billows are all “thy”: the speaker calls the flood God’s. Jonah prays the second half of the verse from the sea, in the same five Hebrew words: “all thy billows and thy waves passed over me” ([[Jonah 2:3]]).
    sources: [bdb, lxx-rahlfs, nrsvue, oshb-wlc]

  - ref: 11
    phrase: who is the health of my countenance, and my God
    kind: words
    title: “His countenance” and “my countenance”
    body: |
      The refrain ends a little differently in verse 5 than in verse 11, and in Hebrew the difference is one letter and a verse division. “Help” in verse 5 and “health” in verse 11 are the same Hebrew noun, a word for salvation. In verse 5 it is followed by the word for his face, and the next verse begins with the word for my God. In verse 11 nearly the same letters are divided to read: my face, and my God.

      The ancient Greek translation has “my countenance” in both places, and a modern translation ends both refrains “my help and my God.” On that reading the refrain was the same each time. The King James translates the Hebrew text as it stands.
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue]

christ: |
  The psalm thirsts for “the living God,” and the Church’s edition sends the reader from that thirst to two sayings of the Savior. To the woman at the well He promised water after which a person “shall never thirst” ([[John 4:14]]). And at the feast of tabernacles, when He had gone up into the temple, “Jesus stood and cried, saying, If any man thirst, let him come unto me, and drink” ([[John 7:37]]). Living water is a “symbol of the Lord Jesus Christ and His teachings.”

  Matthew and Mark give His sorrow in Gethsemane with a word of this psalm’s Greek refrain; see the first note on verse 6.

explore: |
  - **The rest of the poem.** [[Ps. 43]], where the request comes at last and the refrain closes the third stanza.
  - **The same family, at the temple.** [[Ps. 84]], a psalm of the sons of Korah on the courts this psalm misses.
  - **The hope to see His face.** [[Ps. 17:15]] and [[Ps. 27:4–8]].
  - **A prayer from under the waves.** [[Jonah 2:1–9]].

