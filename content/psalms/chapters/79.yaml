chapter: 79
title: For Thy Name’s Sake
tagline: With Jerusalem in ruins and the dead unburied, the people confess their sins and rest their whole plea on God’s own name.
when: 'By its title, a psalm of Asaph; after Jerusalem was laid in ruins and the temple defiled'

setting: |
  Psalm 79 stands in Book Three, in the run of psalms that carry Asaph’s name (50 and 73–83). Asaph led David’s choir, and his guild of singers lasted past the exile, so a psalm under his name can come from a later day ([[Ps. 74:1]] and [[Ps. 50:1]] take up the name).

  It is a lament of the whole people, spoken as “we” and “us” (the form is set out at [[Ps. 22:1]]). The nations have entered the land, defiled the temple, ruined Jerusalem and left the dead lying around it. Kings tells of the day the house of the LORD and “all the houses of Jerusalem” were burned ([[2 Kgs. 25:9]]), and Lamentations mourns that “the heathen entered into her sanctuary” ([[Lam. 1:10]]). The heading in the Church’s edition names the two things the psalm does, “The heathen nations destroy Jerusalem and defile the temple—Israel pleads for forgiveness and deliverance,” and gives no date; the first note on verse 1 takes up the question.

  The psalm has been called “in every respect the pendant of Psalm 74,” its companion among the laments over the ruined sanctuary. One older reading finds it “judiciously appended” to Psalm 78 as well: that psalm ends with David brought from the sheepfolds “to feed Jacob his people” ([[Ps. 78:71]]), and this one ends with the people as the “sheep of thy pasture.” The same reading hears in the opening complaint “the prophecy of Micah” over Jerusalem and, in the unburied dead of verse 2, the curse of [[Deut. 28:26]]; the notes on verses 1 and 2 give the words.

thread: |
  Psalm 79 is **a plea that rests on God’s name**. A lament usually moves through complaint and petition to a vow of praise, and this one does. What gives it its character is the ground it chooses to stand on.

  The complaint (verses 1–4) is told in God’s pronouns: “thine inheritance,” “thy holy temple,” “thy servants,” “thy saints.” Everything that was attacked belonged to Him. Verse 5 then turns from what “they” have done to “thou,” and asks how long He will be angry. The people do not doubt whose anger this is.

  They do not claim innocence, either. Another lament of the nation can say, “yet have we not forgotten thee, neither have we dealt falsely in thy covenant” ([[Ps. 44:17]]). This one speaks of “former iniquities” and “our sins” (verses 8–9). Having confessed, they give God His own reasons: “for the glory of thy name,” “for thy name’s sake,” and the nations’ question, “Where is their God?”

  The Hebrew ties the petitions to the complaint with repeated words that the King James partly hides. The nations “shed” blood like water (verse 3); God is asked to “pour out” His wrath (verse 6) for blood that was “shed” (verse 10), all one verb. The nations “have not known” God (verse 6); let Him “be known” among them (verse 10). And the “reproach” the “neighbours” heaped on Israel (verse 4) is, by the end, a reproach against the Lord, to be returned to those same neighbours (verse 12).

sections:
  - range: 1-4
    heading: The nations in thine inheritance
    plain: |
      O God, the nations have come into Your inheritance. They have defiled Your holy temple and made Jerusalem a heap of ruins. They have given the bodies of Your servants to the birds for food, the flesh of Your faithful ones to the wild beasts. They have poured out their blood like water all around Jerusalem, and no one was left to bury them. We have become a taunt to our neighbours, mocked and derided by those around us.
  - range: 5-7
    heading: How long, LORD?
    plain: |
      How long, LORD? Will You be angry for ever? Will Your jealousy burn like fire? Pour out Your wrath on the nations that have not known You, on the kingdoms that have not called on Your name, for they have devoured Jacob and laid waste the place where he lived.
  - range: 8-10
    heading: For the glory of thy name
    plain: |
      Do not remember against us the iniquities of those who went before. Let Your compassion come quickly to meet us, for we are brought very low. Help us, O God of our salvation, for the glory of Your name; deliver us and atone for our sins, for Your name’s sake. Why should the nations say, “Where is their God?” Let it be known among the nations, before our eyes, that You avenge the blood of Your servants that has been poured out.
  - range: 11-13
    heading: The prisoners and the flock
    plain: |
      Let the groaning of the prisoner come before You. By the greatness of Your arm, keep alive those who are doomed to die. Pay back into our neighbours’ bosom seven times over the reproach with which they have reproached You, O Lord. Then we, Your people and the sheep of Your pasture, will give You thanks for ever; from generation to generation we will tell Your praise.

notes:
  - ref: 1
    phrase: the heathen are come into thine inheritance
    kind: history
    title: Which ruin of Jerusalem?
    body: |
      The psalm names no enemy and no year, and it has been read both of the Babylonian destruction and of the persecutions of the Maccabean age. “The heathen” are simply “the nations” in a modern translation (“the nations have come into your inheritance”), so the word does not identify them.

      The Babylonian conquest fits the scale of the ruin. Kings records the burning of the temple and of “all the houses of Jerusalem” ([[2 Kgs. 25:9]]), and Chronicles a slaughter in the holy place itself: the king of the Chaldees “slew their young men with the sword in the house of their sanctuary” ([[2 Chr. 36:17]]).

      One older reading prefers the later date. It grants that the Babylonian period saw “a destruction of the Temple and of Jerusalem,” but holds that a defiling of the temple joined with “a massacre of the servants of God” belongs to that later age alone. That is one commentator’s judgment.

      A book from that later age knows the psalm already. 1 Maccabees tells of sixty men who trusted a sworn promise of safety and were killed “in one day, according to the words which he wrote,” and then quotes verses 2–3: “The flesh of thy saints have they cast out, and their blood have they shed round about Jerusalem, and there was none to bury them.” The psalm is cited there as something written, which a later generation found true of its own dead.

      The Church’s heading does not choose a date. The same question is argued more fully for the companion psalm (see the note on [[Ps. 74:7]]).
    sources: [lds-scriptures, nrsvue, delitzsch-psalms, first-maccabees]

  - ref: 1
    phrase: they have laid Jerusalem on heaps
    kind: scripture
    title: Micah’s word about Jerusalem
    body: |
      “Heaps” is the word a prophet had used of Jerusalem beforehand. Micah warned the city’s rulers, “Therefore shall Zion for your sake be plowed as a field, and Jerusalem shall become heaps” ([[Micah 3:12]]). The Hebrew word, “a ruin, heap of ruins,” is the same in both verses.

      The saying was not forgotten. At Jeremiah’s trial the elders quoted it as what “Micah the Morasthite prophesied in the days of Hezekiah” ([[Jer. 26:18]]). The psalm’s first verse uses Micah’s word for what the nations have now done.
    sources: [lds-scriptures, oshb-wlc, bdb]

  - ref: 2
    phrase: the flesh of thy saints unto the beasts of the earth
    kind: scripture
    title: The unburied dead and the covenant’s curse
    body: |
      Bodies left for birds and beasts are what the law had threatened for breaking the covenant. Among the curses in Deuteronomy is this: “thy carcase shall be meat unto all fowls of the air, and unto the beasts of the earth” ([[Deut. 28:26]]). Jeremiah repeated it to Judah, “the carcases of this people shall be meat for the fowls of the heaven, and for the beasts of the earth” ([[Jer. 7:33]]), and added that “they shall have none to bury them” ([[Jer. 14:16]]). Verses 2–3 use nearly those words of the people’s own dead.

      The dead are nevertheless “thy servants” and “thy saints,” and “saints” is *hasidim*, the “kind, pious” ones (the word is explained at [[Ps. 4:3]]).
    sources: [lds-scriptures, bdb, oshb-wlc]

  - ref: 5
    phrase: shall thy jealousy burn like fire
    kind: words
    title: Jealousy is the covenant’s word
    body: |
      The anger the people ask about is called jealousy, and that is the word scripture uses for God’s claim on a people who are His alone. One of the two senses the word has in scripture is “to be fervent and to have sensitive and deep feelings about someone,” and the law makes it a name: “thou shalt worship no other god: for the LORD, whose name is Jealous, is a jealous God” ([[Ex. 34:14]]). In this verse it is the jealousy “of God against men.” A modern translation joins the two halves of the line: “Will your jealous wrath burn like fire?”

      The psalm just before this one speaks of that jealousy too: Israel “moved him to jealousy with their graven images” ([[Ps. 78:58]]). Here the people ask how long it will burn, and whether “for ever” (the pairing of the two is noted at [[Ps. 13:1]]).
    sources: [gs-jealous, bdb, nrsvue, lds-scriptures]

  - ref: 6
    phrase: Pour out thy wrath upon the heathen that have not known thee
    kind: scripture
    title: Jeremiah’s prayer, and the verb of verse 3
    body: |
      Verses 6–7 stand almost word for word in Jeremiah, and “pour out” answers the blood that was poured out in verse 3. Jeremiah prays, “Pour out thy fury upon the heathen that know thee not, and upon the families that call not on thy name: for they have eaten up Jacob, and devoured him, and consumed him, and have made his habitation desolate” ([[Jer. 10:25]]). The psalm’s form is shorter and has “kingdoms” for “families.”

      In the psalm the prayer has a place of its own. “Shed” in verse 3, “pour out” here and “shed” in verse 10 are one Hebrew verb: the nations poured out blood like water, and God is asked to pour out wrath. The reason given is what they did, “they have devoured Jacob,” and that they neither know God nor call on the name the rest of the psalm appeals to.

      How such prayers for judgment are read, with the Savior’s command to love enemies above them, is set out in the note on [[Ps. 137:8]].
    sources: [lds-scriptures, oshb-wlc]

  - ref: 8
    phrase: former iniquities
    kind: words
    title: The forefathers’ sins, and our own
    body: |
      The Hebrew of “former iniquities” can mean the sins of former people, and the next verse adds the people’s own. The word for “former” is also used as a noun for “former persons, ancestors, men of old,” and a modern translation takes it that way: “Do not remember against us the iniquities of our ancestors.” The ancient Greek kept the sins with the speakers, “our old transgressions,” as the King James does.

      Either way the psalm does not shift the blame. Verse 9 says “our sins.” The same two are joined elsewhere in prayers over the fallen city. Lamentations says, “Our fathers have sinned, and are not; and we have borne their iniquities” ([[Lam. 5:7]]), and Daniel confesses that “for our sins, and for the iniquities of our fathers, Jerusalem and thy people are become a reproach to all that are about us” ([[Dan. 9:16]]).

      “Prevent” in the same verse is the older English for coming to meet (see the note on [[Ps. 21:3]]).
    sources: [nrsvue, lxx-rahlfs, bdb, lds-scriptures]

  - ref: 9
    phrase: purge away our sins, for thy name’s sake
    kind: words
    title: Atonement asked for the name’s sake
    body: |
      “Purge away” is the Old Testament’s verb for making atonement, and the people ask God to do it for a reason that lies in Him and not in them. The verb means to “cover over,” to “make propitiation.” In the law it is used of atonement made “by legal rites,” the priest’s work. Here God is its subject, and that use carries a thought of its own: “It is conceived that God in his sovereignty may himself provide an atonement or covering for men and their sins which could not be provided by men.” A modern translation has simply “forgive our sins.” The psalm before this one used the same verb of the wilderness generation: “he, being full of compassion, forgave their iniquity, and destroyed them not” ([[Ps. 78:38]]).

      The ground of the request is said twice in the verse, “for the glory of thy name” and “for thy name’s sake,” after verse 6 has described the nations as those who “have not called upon thy name.”

      The Lord uses the same words when He promises to gather Israel: “I do not this for your sakes, O house of Israel, but for mine holy name’s sake, which ye have profaned among the heathen” ([[Ezek. 36:22]]). The phrase is taken up also at [[Ps. 23:3]].
    sources: [bdb, oshb-wlc, nrsvue, lds-scriptures]

  - ref: 10
    phrase: Where is their God?
    kind: scripture
    title: The question the nations ask
    body: |
      The taunt “Where is their God?” is a plea Israel’s intercessors had made before, and what the people ask in answer to it is something God had promised. Moses prayed after the golden calf, “Wherefore should the Egyptians speak, and say, For mischief did he bring them out” ([[Ex. 32:12]]). Joel gives the priests the very question to pray between the porch and the altar: “wherefore should they say among the people, Where is their God?” ([[Joel 2:17]]). It comes again in [[Ps. 115:2]].

      The song of Moses ends, “he will avenge the blood of his servants, and will render vengeance to his adversaries” ([[Deut. 32:43]]), and the psalm asks to see “the revenging of the blood of thy servants,” with the same Hebrew words for blood and servants. On one older reading the wish “is based upon” that verse, and “in our sight” means that the people want, “as eye-witnesses, to experience what God has promised in the early times.”

      The nations of verse 6 “have not known” God; “let him be known among the heathen” uses the same verb.
    sources: [lds-scriptures, oshb-wlc, delitzsch-psalms]

  - ref: 11
    phrase: those that are appointed to die
    kind: words
    title: Sons of death
    body: |
      The Hebrew calls the captives sons of death, an idiom for people marked to die. The sense is “children of death, those worthy of death and appointed to death,” and the ancient Greek keeps the idiom: “preserve the sons of the slain ones.” After the dead of verses 2–3, the prayer turns to those not yet dead.

      “Power” is literally “arm,” as the Greek has it: “according to the greatness of thine arm.” The phrase is that of the song at the sea, where the nations fall still “by the greatness of thine arm” ([[Ex. 15:16]]).

      One other psalm has the pair. The LORD looks down from heaven “to hear the groaning of the prisoner; to loose those that are appointed to death” ([[Ps. 102:20]]).
    sources: [bdb, oshb-wlc, lxx-rahlfs, lds-scriptures]

  - ref: 12
    phrase: sevenfold into their bosom
    kind: symbol
    title: Sevenfold, into the bosom
    body: |
      “Sevenfold” has been read as the number of a complete repayment, and the bosom is where it is to be received. On that older reading, “a sevenfold requital” is one “that is fully carried out as a criminal sentence, for seven is the number of a completed process,” as with the sevenfold vengeance set on Cain’s slayer ([[Gen. 4:15]]). The bosom is named as that “in which one takes up and holds that which is handed to him”; the Savior uses the same picture of a generous measure given “into your bosom” ([[Luke 6:38]]).

      The verse closes a frame. In verse 4 Israel was “a reproach to our neighbours”; here the same two Hebrew words return, and the reproach has a new object: “wherewith they have reproached thee, O Lord.” The same reading explains why the neighbours are singled out among the nations: those “who might most readily come to the knowledge of the God of Israel” bear the most guilt for reviling Him. As in verse 6, the repaying is asked of God (see the note there).
    sources: [delitzsch-psalms, oshb-wlc]

  - ref: 13
    phrase: sheep of thy pasture
    kind: symbol
    title: The flock gets the last word
    body: |
      The psalm ends by naming the people as God’s flock and promising praise, though nothing in it says the ruin has been mended. A lament commonly closes with a vow of praise ([[Ps. 22:1]]), and this one has it in a single verse. The Hebrew begins “and we,” with the pronoun written out.

      The nations came into “thine inheritance” (verse 1); the people are still “thy people.” Psalm 74 opened by asking why God’s anger smoked “against the sheep of thy pasture” ([[Ps. 74:1]]), and the psalm that follows this one begins, “Give ear, O Shepherd of Israel” ([[Ps. 80:1]]). In Ezekiel the Lord says it Himself, after promising to seek out His scattered sheep: “ye my flock, the flock of my pasture, are men, and I am your God” ([[Ezek. 34:31]]).
    sources: [sc-knowhy-438, oshb-wlc, lds-scriptures]

christ: |
  The “God of our salvation” to whom this psalm prays is Jehovah, the God of Israel, whom Latter-day Saints know as Jesus Christ before He was born. It is of Him that the people ask atonement for their sins (see the note on verse 9).

  They call themselves “sheep of thy pasture.” The Church’s footnote on that word sends the reader to Alma, who says that “the good shepherd doth call you; yea, and in his own name he doth call you, which is the name of Christ” ([[Alma 5:38]]). The Savior took the title Himself: “I am the good shepherd: the good shepherd giveth his life for the sheep” ([[John 10:11]]; see the note on [[Ps. 23:1]]).

explore: |
  - **The companion lament.** [[Ps. 74]], over the same ruin, argues from God’s deeds of old where this psalm argues from His name.
  - **Lamentations’ last prayer.** [[Lam. 5:1–7]] and [[Lam. 5:20–22]]: the reproach, the inheritance “turned to strangers,” the fathers’ sins, and “for ever.”
  - **Daniel’s prayer for Jerusalem.** [[Dan. 9:4–19]] confesses “our sins” and “the iniquities of our fathers” and asks for the city that is called by God’s name.
  - **“How long,” in the Revelation.** The souls under the altar ask, “How long, O Lord, holy and true, dost thou not judge and avenge our blood” ([[Rev. 6:10]]); later a voice in heaven says that He “hath avenged the blood of his servants” ([[Rev. 19:2]]). Set these beside verses 5 and 10.

parallels:
  - ref: Jer. 10:25
    note: Jeremiah prays verses 6–7 in a longer form.
  - ref: Ps. 74:1
    note: The companion lament over the ruined sanctuary, which also calls Israel “the sheep of thy pasture.”
  - ref: Ps. 44:13
    note: The line of verse 4, “a reproach to our neighbours, a scorn and a derision,” in another lament of the nation.
  - ref: Deut. 28:26
    note: Bodies left to the birds and beasts are among the covenant’s curses; compare verse 2.
  - ref: Joel 2:17
    note: The priests are to pray, “wherefore should they say among the people, Where is their God?”
  - ref: Ezek. 36:22
    note: The Lord says He will act “for mine holy name’s sake,” the ground of verse 9.

