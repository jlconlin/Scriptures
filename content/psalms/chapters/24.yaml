chapter: 24
title: Who Shall Ascend, and Who Comes In
tagline: The psalm asks who may go up to the Lord’s house, and then who it is that comes to the gate Himself.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  The title, “A Psalm of David,” names no occasion (on titles, see [[Ps. 3:1]]). One older reading supplies an occasion: that the psalm “was composed when the Ark was brought from Kirjath Jearim to Mount Zion,” the day David and all Israel brought up the ark “with shouting, and with the sound of the trumpet” ([[2 Sam. 6:15]]). The same reading allows a later day instead, when the ark came home from a campaign. The psalm never mentions the ark. The reading rests on the last four verses, where a King who is “mighty in battle” stands outside the gates.

  The ancient Greek translation adds to the title “on the first day of the week,” and the Talmud names Psalm 24 as the psalm sung on that day.

  In Book One it follows Psalm 23, which ends in “the house of the LORD” ([[Ps. 23:6]]); this psalm asks who may go up to that house. Psalm 15 opens with nearly the same question: “LORD, who shall abide in thy tabernacle? who shall dwell in thy holy hill?” ([[Ps. 15:1]]).

  Later scripture draws on three of its lines. Paul quotes the first ([[1 Cor. 10:26]]). The Savior’s blessing on the pure in heart rests on the fourth ([[Matt. 5:8]]). Nephi and Alma both speak of “clean hands” and a pure heart when they speak of standing before God ([[2 Ne. 25:16]]; [[Alma 5:19]]).

thread: |
  Psalm 24 has three scenes, and each is smaller than the last: the whole earth (verses 1–2), one hill (verses 3–6), one gateway (verses 7–10). It has been counted among the psalms built as a dialogue, a call and its response. It asks two questions. The first is about the worshipper: “Who shall ascend into the hill of the LORD?” The second is about God: “Who is this King of glory?”

  **The turn is at verse 7, where the direction of travel reverses.** Through verse 6 people go up to God. They are examined, they are promised a blessing, and they are named as those who seek His face. From verse 7 God comes to them. A voice calls on the gates to open, and the one who was sought arrives.

  One Hebrew verb, *nasa*, to lift or carry, runs through all of it. The worthy man has not “lifted up” his soul to what is empty (verse 4); he will “receive,” which is the same verb, a blessing (verse 5); and the gates are told four times to “lift up” (verses 7 and 9).

  The psalm’s answers get shorter as it goes. The first question is answered with a description of a person. The second is answered, finally, with a name: “The LORD of hosts, he is the King of glory.”

sections:
  - range: 1-2
    heading: The earth is His
    plain: |
      The earth belongs to the Lord, with everything that fills it: the world and all who live in it. For He is the one who founded it on the seas and set it firm on the floods.
  - range: 3-6
    heading: Who may go up
    plain: |
      Who may go up the mountain of the Lord? Who may stand in His holy place? The one whose hands are clean and whose heart is pure, who has not set his soul on what is empty and has not sworn a false oath. He will receive a blessing from the Lord, and righteousness from the God who saves him. This is the generation of those who seek Him, who seek Your face: Jacob.
  - range: 7-10
    heading: The King at the gate
    plain: |
      Lift up your heads, you gates; be lifted up, you ancient doors, and the King of glory will come in. Who is this King of glory? The Lord, strong and mighty, the Lord, mighty in battle. Lift up your heads, you gates; lift them up, you ancient doors, and the King of glory will come in. Who is this King of glory? The Lord of hosts: He is the King of glory.

notes:
  - ref: 1
    phrase: The earth is the LORD’s
    kind: structure
    title: The whole earth first, then one hill
    body: |
      The psalm opens with the Lord’s ownership of everything before it asks who may come to His hill. Verse 2 gives the ground of the claim in its first word, “For”: the earth is His because He made it. He is “the owner of the world, because its Creator,” and from that, on one reading, “arises the question, who may ascend the mountain” of such a God, and “who can have courage to do it?”

      Nearly everything else in the psalm is the language of the sanctuary: the mountain, the holy place, the gates. Yet “the creation scene plays a prominent role in the opening verses.”

      Paul put the line to practical use. Writing to Corinth about meat that might have been offered to idols, he said, “Whatsoever is sold in the shambles, that eat” ([[1 Cor. 10:25]]), and gave this verse as the reason: “For the earth is the Lord’s, and the fulness thereof” ([[1 Cor. 10:26]]).
    sources: [delitzsch-psalms, parry-psalm-24, lds-scriptures]

  - ref: 2
    phrase: founded it upon the seas
    kind: symbol
    title: Dry land held up over the water
    body: |
      The picture is of the Creation, when the land came up out of the water and stayed up. In Genesis God says, “let the dry land appear” ([[Gen. 1:9]]), and a later psalm praises Him “that stretched out the earth above the waters” ([[Ps. 136:6]]).

      On one reading the point of the image is how unlikely the arrangement is. The land “has the waters, as it were, for its foundation,” and “would more readily sink down into them than keep itself above them, if it were not in itself upheld by the creative power of God.” The verse sets the solid world on water and says that it holds because the Lord established it. It is poetry about who keeps the world standing.
    sources: [delitzsch-psalms, lds-scriptures]

  - ref: 3
    phrase: the hill of the LORD
    kind: history
    title: The hill is the temple mount
    body: |
      “The hill of the LORD” is the mountain where the Lord’s house stood, and to ascend it was to come to the sanctuary. The Hebrew word is *har*, mountain, the word behind “holy hill” in Psalm 15 as well, and behind Isaiah’s “mountain of the LORD” ([[Isa. 2:3]]). “His holy place” in the second half “refers directly to the temple.”

      By its title the psalm is David’s, and in David’s day the ark stood on Zion in a tent, “in the midst of the tabernacle that David had pitched for it” ([[2 Sam. 6:17]]). The hill and the holy place are the psalm’s words for the place on that mount where the Lord dwelt among His people.

      **Why go up.** After the Exodus the Lord said He would meet Israel at the tabernacle, and the Psalms treat His house as the place where He is to be found. Israel “would ascend up to Jerusalem and enter the temple grounds in order to be taught the word of God, offer sacrifices, and participate in other temple rites,” and this psalm is one of those that point to such pilgrimage. What the worshipper hoped for there is said most plainly a few psalms on: “that I may dwell in the house of the LORD all the days of my life, to behold the beauty of the LORD, and to inquire in his temple” ([[Ps. 27:4]]), and, “Thy face, LORD, will I seek” ([[Ps. 27:8]]). Verse 6 here speaks of seeking His face as well.

      **The temple in the Psalms.** This is not one psalm’s interest. The Psalms “mention the word ‘temple’ more than any other book in the Old Testament except for 2 Chronicles,” and they have been called the hymnbook of the ancient temple, because many were likely sung in its worship. And although the temple itself had degrees of holiness, in these psalms “all are invited to seek the face of God.”
    sources: [oshb-wlc, bdb, skinner-seeing-god, sc-knowhy-437, lds-scriptures]

  - ref: 3
    phrase: who shall stand in his holy place
    kind: structure
    title: A question at the gate, and an answer
    body: |
      Verses 3–6 are a dialogue: a question, an answer, and a promise, most likely for different voices. The psalm is one of a group “clearly designed for antiphonal dialogue,” that is, for voices that answer each other, and it works like Psalm 15, with “the worshipper (or the priest) asking” who may go up and the other replying with the answer of verse 4.

      Who stood where is a reconstruction. It has been proposed that priests stood at the temple gates and questioned those who came, and also the reverse, that the worshippers asked from outside and a priest answered from within. Neither can be shown: “There is no way to know beyond educated guesses what form temple music would have taken.”

      Whatever the arrangement, the exchange “would have caused thoughtful reflection among the temple worshippers.”

      The form returns in verse 8. There the question is put about the one who is coming in: “Who is this King of glory?”

      [Who May Enter?](/psalms/themes/who-may-enter/) follows the question through the Psalms and sets it beside Hebrews.
    sources: [hopkin-psalms-sung, skinner-seeing-god]

  - ref: 4
    phrase: He that hath clean hands, and a pure heart
    kind: words
    title: Hands for what is done, heart for what is meant
    body: |
      The two phrases are not saying one thing twice: hands are what a person does and the heart is what he thinks. (For how the two halves of a Hebrew line answer each other, see [[Ps. 1:1]].) One translation of the Hebrew has “He whose palms are innocent.” The adjective means “free from guilt, clean, innocent,” and it is the word used elsewhere of innocent blood. The second adjective means pure or clear, and the phrase is “pure in heart.” The Greek translation keeps the distinction: “innocent in his hands and pure in his heart.”

      So the answer covers both sides of a person. Hands were stained by such things as “idolatry, murder, theft, adultery, Sabbath breaking, and mistreating others”; the heart “was corrupted by evil or impure thoughts.”
    sources: [bdb, oshb-wlc, lxx-rahlfs, skinner-seeing-god, parry-psalm-24]

  - ref: 4
    phrase: who hath not lifted up his soul unto vanity
    kind: words
    title: Vanity is emptiness, and the wording is the third commandment’s
    body: |
      “Vanity” here is not conceit. The Hebrew noun means “emptiness, vanity”: what has nothing in it. It is used of worthless idols, of “emptiness of speech,” which is lying, and of worthless conduct. A modern translation has “who do not lift up their souls to what is false.”

      The wording is that of the third commandment. “Thou shalt not take the name of the LORD thy God in vain” ([[Ex. 20:7]]) has the same verb, to lift or take up, and the same noun. There a person must not lift up the Lord’s name to emptiness; here he must not lift up his own soul to it.

      To lift the soul to something is “to direct one’s soul,” its “longing and striving,” toward it. The next psalm opens with the phrase turned the right way: “Unto thee, O LORD, do I lift up my soul” ([[Ps. 25:1]]). The Hebrew verb and noun are the same.

      The fourth condition, “nor sworn deceitfully,” turns to other people, and the Greek translation says so outright by adding “to his neighbour.” After the two general conditions come two particular ones: what a person gives his devotion to, and whether his word can be trusted.
    sources: [bdb, oshb-wlc, nrsvue, lxx-rahlfs, delitzsch-psalms]

  - ref: 5
    phrase: He shall receive the blessing
    kind: words
    title: Receive is the same verb as lift
    body: |
      “Receive” translates *nasa*, the verb that verse 4 used for lifting the soul, and one rendering keeps it: “He will lift up a blessing from Yahweh.” The one who has not carried his soul to emptiness carries a blessing away.

      The psalm does not say here what the blessing is. One proposal is that verse 6 says it: “The blessing is implicit in verse 6,” and it is “that those individuals worthy to enter the temple will have the privilege of appearing before God in his temple.” That fits how the Psalms speak elsewhere: when the Lord’s face shines on a person, “blessings—especially salvation—come.”
    sources: [oshb-wlc, parry-psalm-24, skinner-seeing-god]

  - ref: 5
    phrase: righteousness from the God of his salvation
    kind: words
    title: Righteousness is received, not brought
    body: |
      Verse 4 can sound like a list of what a person must achieve before coming, but verse 5 says the worshipper is given righteousness, and by “the God of his salvation.” Translations differ on the word, and agree on its direction: the Greek has “mercy from God his Saviour,” and a modern translation has “vindication.” Either way it comes from God.
    sources: [lxx-rahlfs, nrsvue]

  - ref: 6
    phrase: them that seek him
    kind: scripture
    title: Jesus promised the pure in heart what this psalm seeks
    body: |
      The beatitude “Blessed are the pure in heart: for they shall see God” ([[Matt. 5:8]]) rests on this psalm: the condition of verse 4 with the hope of verse 6. Jesus “used the doctrinal foundation of Psalm 24 to make the same promise,” and the wording shows it. The Greek translation of verse 4 has “pure in his heart” (*katharos te kardia*), which “is equivalent to the phrase ‘pure in heart’ (*katharoi te kardia*), used in the plural by Jesus.”

      Two Book of Mormon prophets take up the verse, and both apply it to standing before God. Nephi foresees the day when the Jews will believe in Christ and worship the Father in His name “with pure hearts and clean hands” ([[2 Ne. 25:16]]). Alma, speaking of the day of judgment, asks Zarahemla, “can ye look up to God at that day with a pure heart and clean hands?” ([[Alma 5:19]]). His next question, about “the image of God engraven upon your countenances” ([[Alma 5:19]]), has been read as the same temple hope: to come before God’s face and be changed by it.
    sources: [skinner-seeing-god, sc-knowhy-437, lxx-rahlfs, lds-scriptures]

  - ref: 6
    phrase: that seek thy face, O Jacob
    kind: words
    title: Whose face, and who is Jacob
    body: |
      The Hebrew of this line is abrupt: as it stands it says, roughly, *seekers of thy face, Jacob*, with no word for “O” or for “God.” The Church’s edition gives “even Jacob” in its footnote, which takes Jacob as the name of the seekers.

      The Greek and Syriac translations have instead “the face of the God of Jacob,” and most translators have followed them; one modern translation does so with a note that the Hebrew reads “your face, O Jacob.” The argument is from sense: “it is not Jacob’s face that is sought but the Lord’s.”

      On either wording the people verse 4 described are seekers of God’s face, and they belong to Jacob.

      “Generation” is not a span of years here. The word can mean a class of people marked by a quality, and this verse is an instance: “of the righteous, as a class.” A different reading of the word has also been proposed. Hebrew was first written without vowels; the vowel signs were added centuries later by the Jewish scholars called the Masoretes. With another vowel the same consonants spell a word for a circle, giving “This is the circle of them that inquire of him,” which, in a psalm so full of temple language, “may have reference to a religious prayer circle.” It is offered as a possible reference, and should be held as that.
    sources: [oshb-wlc, lds-scriptures, lxx-rahlfs, nrsvue, skinner-seeing-god, bdb, parry-psalm-24]

  - ref: 7
    phrase: Lift up your heads, O ye gates
    kind: symbol
    title: Gates told to make room
    body: |
      The scene has moved to a gateway, and someone outside is calling on the gates themselves to open. The gates are spoken to as if they were people with heads to raise. On one reading the heads are the lintels, and the doors must rise because they are “too low and too strait” for the one about to pass through: “the doors of antiquity are to open high and wide.”

      “Everlasting doors” looks backward more than forward. The Hebrew phrase can be rendered “ancient gates” or “ancient doors”; they have been pictured as “the portals dating back into the hoary ages of the past.”
    sources: [delitzsch-psalms, bdb, nrsvue]

  - ref: 9
    phrase: and the King of glory shall come in
    kind: scripture
    title: In Joseph Smith’s revision the King comes to His people
    body: |
      The Joseph Smith Translation rewrites verses 7–10 so that the King comes not into a gate but to a people, at the Second Coming. The call is no longer to the doors: “Lift up your heads, O ye generations of Jacob.” “Generation” and “Jacob” are both words of verse 6. The questions disappear. In their place the Lord is named outright and His coming described: “he will roll away the heavens; and will come down to redeem his people,” and “the king of glory shall come unto you; and shall redeem his people, and shall establish them in righteousness.”

      The Prophet’s work on the Psalms is not dated exactly, but it was probably finished shortly before March 1833. A number of his changes in the book “shifted some of their messages from a present-tense, Old Testament focus to one looking forward to the Second Coming.” The rolled-away heavens are an instance. A revelation given at the turn of 1833, “just prior to his work on this psalm,” describes the same event: “the curtain of heaven be unfolded, as a scroll is unfolded after it is rolled up, and the face of the Lord shall be unveiled” ([[D&C 88:95]]).
    sources: [jst-ps-24, lefevre-jst-psalms, lds-scriptures]

  - ref: 10
    phrase: The LORD of hosts
    kind: history
    title: The LORD of hosts was the name on the ark
    body: |
      The question is asked twice, and the second answer is a name: the first describes a warrior, and the second gives the name of the Lord by which the ark was called. “The LORD of hosts” goes further than “mighty in battle.” The hosts “were the armies of Israel” but “also included the angelic armies of heaven.” The King at the gate commands more than one nation’s troops.

      The ark was called by this name. When David went to bring it up, it was “the ark of God, whose name is called by the name of the LORD of hosts that dwelleth between the cherubims” ([[2 Sam. 6:2]]). And the ark went ahead of Israel against its enemies: when it set out in the wilderness Moses said, “Rise up, LORD, and let thine enemies be scattered” ([[Num. 10:35]]). The Psalms have been said to hold “concepts connected with the sanctuary of the Ark,” though this psalm names no ark. On the older reading given in the background above, in which the ark is brought up to Zion, verses 7–10 were first sung as the ark was carried up by its bearers ([[2 Sam. 6:13]]), and the one “that dwelleth between the cherubims” was coming in with it.

      This is the first time the Psalms use the title, and the only time in Book One.
    sources: [bd-sabaoth, parry-psalm-24, oshb-wlc, lds-scriptures]

christ: |
  The King of glory is named in the psalm: He is “the LORD,” Jehovah, and “Jehovah is the premortal Jesus Christ.”

  So the psalm’s two questions lead to the same Lord. Who may ascend? The one with clean hands and a pure heart, and Elder David A. Bednar, teaching from these verses, said that worthy desires and good works can never produce them: it is the Atonement of Jesus Christ that cleanses and redeems. Who is the King of glory? The same Lord. Elder Bednar spoke of standing “before Him who is pure” and who “freely spilled His precious blood for us”: the one before whom the worshipper must stand is the one who cleanses him.

  On one reading the second half of the psalm became a promise as well as a memory, a hymn “in honour of the Lord who should come into His temple,” the coming Malachi foretells: “the Lord, whom ye seek, shall suddenly come to his temple” ([[Mal. 3:1]]). The Joseph Smith Translation turns the same verses to the day when He “will come down to redeem his people” (see the note on [[Ps. 24:9]]).

explore: |
  - **The twin psalm.** [[Ps. 15:1–5]] asks the same question and gives a longer answer.
  - **Seeking the face of God.** [[Ps. 27:4–8]], and Jacob at Peniel, who said, “I have seen God face to face” ([[Gen. 32:30]]).
  - **All the earth, and one mountain.** At Sinai the Lord says “for all the earth is mine” ([[Ex. 19:5]]) and then has the people sanctified before He comes down on the mount ([[Ex. 19:10–11]]).
  - **The ark on the move.** [[2 Sam. 6:12–17]]; [[Num. 10:35–36]]; and [[Ps. 132:8]], another psalm that calls the Lord and the ark into their resting place.
  - **The mountain of the Lord’s house in the last days.** [[Isa. 2:2–3]], and the Lord’s sudden coming to His temple in [[Mal. 3:1–3]].
  - **The pure in heart in the Lord’s house.** [[D&C 97:15–17]], and Alma’s questions in [[Alma 5:14–19]].
  - **Seeing God in the temple.** “Seeing God in His Temple: A Significant Theme in Israel’s Psalms,” a Religious Studies Center study, follows the hope of verse 6 through the whole book.

parallels:
  - ref: Ps. 15:1–5
    note: The same question at the same threshold, with a fuller list of answers.
  - ref: Matt. 5:8
    note: The Savior promises the pure in heart that they shall see God.
  - ref: 1 Cor. 10:26
    note: Paul quotes verse 1 to settle whether meat from the market may be eaten.
  - ref: 2 Ne. 25:16
    note: Nephi foresees a day of worship “with pure hearts and clean hands.”
  - ref: Alma 5:19
    note: Alma asks who can look up to God “with a pure heart and clean hands.”
  - ref: D&C 97:16
    note: The pure in heart who come into the Lord’s house shall see God.

