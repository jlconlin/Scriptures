chapter: 61
title: The Rock That Is Higher Than I
tagline: A man at the end of the earth, his heart faint, asks to be led to a rock higher than he is, and then prays for the king as one whose vows have already been heard.
when: 'Undated; a psalm of David by its title'

setting: |
  By its title the psalm is David’s, and the title names no occasion. What the psalm shows of its speaker is distance. He cries “from the end of the earth,” and what he wants is a place in God’s tent. In verse 6 he prays for “the king.” One older reading puts these together and hears David east of the Jordan during Absalom’s revolt, a king driven from his city (see the note on verse 2). The psalm itself does not say.

  It is short, eight verses in two equal parts, with *selah* at the middle. The first part is the prayer of someone far away. The second begins by saying that God has heard, and goes on to ask long life for the king.

  The psalm calls on “God” throughout. The divine name that the King James prints as LORD does not occur in it.

thread: |
  **The psalm begins at “the end of the earth” and ends “before God for ever,” and what stands between the two is the word “heard.”**

  It opens with a request for a hearing: “Hear my cry, O God.” The speaker cries from the end of the earth, and his heart is faint. He asks to be led to a rock “higher than I” (verse 2).

  Verse 3 gives his reason, and it is a memory: “For thou hast been a shelter for me.” God has been his refuge before. On that ground he says where he wants to be, in God’s tent and under God’s wings, “for ever” (verse 4).

  Then comes the turn. Verse 5 begins with a second “For,” and the verb of verse 1 comes back in a new tense: “thou, O God, hast heard.” The psalm does not say that anything around him has changed. He does not say he has come home. He says that his vows have been heard and that a heritage has been given, and from there on he speaks differently.

  Now he looks ahead. He asks days added to the king’s days, years like generation after generation, a seat before God for ever, with mercy and truth as the king’s guard (verses 6–7). The last verse answers with his own part: praise “for ever,” and vows performed “daily.”

sections:
  - range: 1-2
    heading: A cry from the end of the earth
    plain: |
      Hear my cry, God; listen to my prayer. From the end of the earth I call to You while my heart is faint. Lead me to the rock that is higher than I am.
  - range: 3-4
    heading: The shelter he has known
    plain: |
      For You have been my refuge, a strong tower in the face of the enemy. I will stay in Your tent for ever; I will trust in the shelter of Your wings.
  - range: 5-7
    heading: Heard, and a prayer for the king
    plain: |
      For You, God, have heard my vows. You have given the heritage that belongs to those who fear Your name. You will add days to the days of the king, and his years will be like generation after generation. He will abide before God for ever. Appoint mercy and truth to guard him.
  - range: 8
    heading: Praise for ever, vows every day
    plain: |
      Then I will sing praise to Your name for ever, paying my vows day after day.

notes:
  - ref: 0
    phrase: upon Neginah
    kind: words
    title: Neginah, the music of strings
    body: |
      Neginah is the singular of Neginoth, the word for “music (of stringed instrument)” that stands in the titles of six other psalms and is explained at [[Ps. 4:1]]. The plural is perhaps the right reading here, and a modern translation prints the title as it prints the others, “To the leader: with stringed instruments. Of David.” The ancient Greek translators made of it “among the Hymns of David.”

      “To the chief Musician” is explained at [[Ps. 8:1]].
    sources: [bdb, nrsvue, lxx-rahlfs]

  - ref: 2
    phrase: From the end of the earth
    kind: history
    title: Where the end of the earth may be
    body: |
      The psalm does not say where its speaker is, and one older reading places him east of the Jordan during Absalom’s revolt. On that reading it is “a Psalm of the time of Absalom, composed in Mahanaim or elsewhere in Gilead,” written after the king’s army had beaten the rebels. The story has David there: “Then David came to Mahanaim. And Absalom passed over Jordan, he and all the men of Israel with him” ([[2 Sam. 17:24]]).

      On this reading David had not gone far, and what made the distance feel great was what he had left behind. It was “the feeling of homelessness and of separation from the abode of God” that made it “immeasurably great.” When he fled the city he had sent the ark back to it: “And the king said unto Zadok, Carry back the ark of God into the city” ([[2 Sam. 15:25]]). The same reading connects the psalm’s vows with what David said on that occasion.
    sources: [delitzsch-psalms, lds-scriptures]

  - ref: 2
    phrase: lead me to the rock that is higher than I
    kind: symbol
    title: A rock higher than the speaker
    body: |
      The rock is a place of safety, higher than the speaker, and he asks to be led to it. The Hebrew word, *tsur*, is a cliff or rocky wall, and this verse belongs with the places where such a rock is a “place of security,” here as a figure.

      The line follows from the one before it. “Overwhelmed” translates a verb whose plain sense is to “be feeble,” and a modern translation has “when my heart is faint.”

      The ancient Greek translators read the line as something already done: “thou liftedst me up on a rock thou didst guide me.” In the Hebrew it is a request.

      Verse 3 says whom he is asking. “For thou hast been a shelter for me,” and “shelter” is a word used “of God as the refuge of his people.” The next psalm calls God the rock outright: “He only is my rock and my salvation” ([[Ps. 62:2]]), with the same Hebrew word. The note on [[Ps. 18:2]] has more on *tsur* as a name of God.
    sources: [bdb, nrsvue, lxx-rahlfs, oshb-wlc, lds-scriptures]

  - ref: 4
    phrase: I will abide in thy tabernacle for ever
    kind: words
    title: A guest in God’s tent
    body: |
      The line asks to stay with God as His guest, and the Hebrew verb has the form of a wish, which a modern translation shows: “Let me abide in your tent forever.” The verb is the one for living somewhere “as lodger or guest,” and it is used in poetry of a worshipper in the LORD’s house, here and in the question of [[Ps. 15:1]], where it is explained. “Tabernacle” is the “tent” of the modern translation (see the note on [[Ps. 27:5]]).

      The second half of the verse keeps to the same thought. “Covert” is a hiding place, a word said especially of God “as shelter,” and the modern translation has “find refuge under the shelter of your wings.” On the wings, see the note on [[Ps. 17:8]].
    sources: [bdb, nrsvue, oshb-wlc]

  - ref: 5
    phrase: the heritage of those that fear thy name
    kind: words
    title: A heritage, a word said of land
    body: |
      The heritage is a possession received from God. The Hebrew word means a “possession, inheritance,” and it is “used of land” in Deuteronomy and Joshua, where it names the territory given to a people.

      The Hebrew line has no word for “me.” It says that God has given “the heritage of those that fear thy name,” and the ancient Greek translation leaves it so: “thou hast given an inheritance to them that fear thy name.” The King James supplies “me,” as a modern translation also does.

      The psalm does not say what the heritage is, only whose it is, and the speaker counts it as given.
    sources: [bdb, oshb-wlc, lxx-rahlfs, nrsvue]

  - ref: 6
    phrase: Thou wilt prolong the king’s life
    kind: history
    title: The king and the one praying
    body: |
      On one older reading the king of verses 6 and 7 is the speaker himself, and the two verses are his own prayer. The psalm says “I” through verse 5, “the king” and “he” in verses 6 and 7, and “I” again in verse 8. On that reading, “The words sound like intercession, but the praying one is the same person” as before, and the return to “I” follows from that: “Since the poet himself is the king for whom he prays, the transition to the first person” in the last verse is natural.

      In the King James verse 6 and the first half of verse 7 say what God will do. The Hebrew verb of verse 6 is “add,” and the ancient Greek keeps it: “Thou shalt add days to the days of the king.” A modern translation takes the lines as petitions: “Prolong the life of the king,” it begins, then “may his years endure to all generations!” and, in verse 7, “May he be enthroned forever before God.” To “abide” before God, said of a king, is “to remain enthroned.”

      Another psalm says of the king, “He asked life of thee, and thou gavest it him” ([[Ps. 21:4]]); the note there is on the wish of long life for a king.

      The wish has been read as reaching further than one man’s lifetime. On the same older reading, the Targum’s “the King Messiah” for the psalm’s “king” shows to whom the word was referred “after the extinction of the Davidic dynasty,” and the lofty wording of the verses “favours this without absolutely requiring it.”
    sources: [delitzsch-psalms, lxx-rahlfs, oshb-wlc, nrsvue, lds-scriptures]

  - ref: 7
    phrase: O prepare mercy and truth, which may preserve him
    kind: words
    title: Mercy and truth set to guard the king
    body: |
      The prayer asks God to assign two of His own qualities to keep the king. “Prepare” is a verb that means to “appoint, ordain.” It is the verb of Jonah’s story, where the King James also has “prepare”: “the LORD had prepared a great fish” ([[Jonah 1:17]]). A modern translation of the psalm has “appoint steadfast love and faithfulness to watch over him!”

      “Mercy” is *hesed*, the word explained at [[Ps. 51:1]]. Mercy and truth are given the same work, in the same Hebrew words, in two other places. One is a prayer: “let thy lovingkindness and thy truth continually preserve me” ([[Ps. 40:11]]). The other is a saying about kings: “Mercy and truth preserve the king: and his throne is upholden by mercy” ([[Prov. 20:28]]).
    sources: [bdb, nrsvue, oshb-wlc, lds-scriptures]

  - ref: 8
    phrase: that I may daily perform my vows
    kind: words
    title: Vows heard, and vows paid every day
    body: |
      The psalm ends with the vows of verse 5: there God has heard them, and here the speaker will perform them. The word for “vows” covers “any kind of votive offerings or promised gifts” made to God, and in verse 5 the ancient Greek has “prayers” in its place: “hast heard my prayers.”

      The payment named here is song: “So will I sing praise unto thy name for ever.” It is also not made once. “Daily” is the Hebrew word “day” said twice, and a modern translation has “as I pay my vows day after day.”

      The note on [[Ps. 56:12]] has more on vows and the offerings that went with them.
    sources: [bdb, lxx-rahlfs, oshb-wlc, nrsvue]

christ: |
  The psalm is a prayer to the God of Israel as shelter, strong tower, and host. His covenant name is Jehovah, and “Jehovah is the premortal Jesus Christ.”

  On one older reading, the psalm’s word “king” was referred to the Messiah after David’s line no longer reigned (see the note on verse 6).

explore: |
  - **Dwelling with God for ever.** Set verse 4 beside [[Ps. 23:6]] and [[Ps. 91:1–4]].
  - **The king beyond the Jordan.** [[2 Sam. 15:24–26]] and [[2 Sam. 17:24–29]] tell the story that one older reading hears behind the psalm.

parallels:
  - ref: Ps. 62:2
    note: The next psalm calls God “my rock,” with the Hebrew word of verse 2 (also Ps. 62:6–7).
  - ref: Prov. 20:28
    note: Mercy and truth preserve the king, in the words of verse 7.
  - ref: Ps. 21:4
    note: A king asks life and is given length of days.
  - ref: 2 Sam. 17:24
    note: David at Mahanaim during Absalom’s revolt, where one older reading places the psalm.

