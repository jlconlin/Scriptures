chapter: 132
title: A Place for the LORD, a House for David
tagline: Israel reminds the LORD of the oath David swore to find Him a dwelling, brings the ark to its rest, and hears the LORD answer with an oath of His own about David’s throne and Zion.
when: 'Undated; it looks back on David and prays for a king of his line'

setting: |
  This is the thirteenth of the fifteen songs of degrees (the name is explained at [[Ps. 120:1]]), and at eighteen verses it is twice as long as the longest of the others. It is also the one among them that is about the king: it is counted with the royal psalms (see [[Ps. 2:2]]), and it is the only psalm that names the ark.

  The psalm does not say when it was written. David is spoken of as a man of the past whose oath can be recalled, and verse 10 asks favor for the LORD’s “anointed” “for thy servant David’s sake.” It “has long been understood to have been composed to commemorate King David’s finding of the Ark and its transfer to Jerusalem,” the story told in [[2 Sam. 6]].

  The history behind it is in two chapters of Samuel that stand side by side. David brought the ark up to his city and set it in a tent. Then he wished to build it a house, and the prophet Nathan brought the LORD’s reply, that He would build David a house instead (see the note on [[Ps. 89:3]]).

  Other scripture takes up its lines. Solomon ends his prayer at the dedication of the temple with verses 8–10 ([[2 Chr. 6:41–42]]). Peter takes up the oath of verse 11 on the day of Pentecost ([[Acts 2:30]]). The prayer that dedicated the temple at Kirtland closes in the words of verse 16 ([[D&C 109:80]]).

thread: |
  Psalm 132 is **two oaths, and the second answers the first**. The first half is a prayer; the second is the LORD’s reply.

  The prayer begins by asking the LORD to remember David, and what it wants remembered is an oath. David “sware unto the LORD” that he would not go home or sleep until he had found “a place for the LORD.” In verse 6 the voice becomes “we.” The people tell how they found the ark, summon one another to worship, and then pray: let the LORD arise into His rest, let His priests be clothed with righteousness and His saints shout for joy, and let the king now reigning not be refused.

  At verse 11 the psalm turns, and the turn is the same verb with a different subject: “The LORD hath sworn in truth unto David.” David swore to find the LORD a dwelling. The LORD swears to set David’s offspring on his throne, and their sons after them if they keep His covenant. Verse 13 then gives the reason for the promise: “For the LORD hath chosen Zion.” David went looking for a place, and it turns out that the LORD had desired it Himself.

  The last five verses answer the requests of the prayer one at a time and add something to each. The rest that was asked for becomes “my rest for ever.” The psalm ends on the king, with a horn, a lamp and a crown.

sections:
  - range: 1-5
    heading: David’s oath
    plain: |
      LORD, remember David and all the trouble he took: how he swore to the LORD and vowed to the Mighty One of Jacob, “I will not go into my house or lie down on my bed, I will not let my eyes sleep or my eyelids close, until I find a place for the LORD, a dwelling for the Mighty One of Jacob.”
  - range: 6-10
    heading: Arise, O LORD, into thy rest
    plain: |
      We heard of it in Ephratah; we found it in the fields of the wood. Let us go to His dwelling and worship at His footstool. Arise, LORD, and come to Your resting place, You and the ark of Your strength. Let Your priests be clothed with righteousness, and let Your saints shout for joy. For the sake of Your servant David, do not turn away the face of Your anointed.
  - range: 11-12
    heading: The LORD’s oath
    plain: |
      The LORD has sworn to David in truth, and He will not go back on it: “I will set one of your own offspring on your throne. If your sons keep my covenant and the testimony I teach them, their sons too will sit on your throne for ever.”
  - range: 13-18
    heading: This is my rest for ever
    plain: |
      For the LORD has chosen Zion; He has desired it for His dwelling. “This is my resting place for ever. Here I will dwell, because I have desired it. I will bless her food supply richly and fill her poor with bread. I will clothe her priests with salvation, and her saints will shout aloud for joy. There I will make a horn bud for David; I have set a lamp ready for my anointed. I will clothe his enemies with shame, but on him his crown will flourish.”

notes:
  - ref: 1
    phrase: all his afflictions
    kind: history
    title: What David swore, and what it cost him
    body: |
      The afflictions the LORD is asked to remember are explained by the next word, “How”: they are the trouble David took over a house for the LORD. Verses 3–5 give his oath, that he would not enter his own house or sleep until he had found the LORD a place.

      Samuel tells the wish behind the oath. With the ark in a tent in Jerusalem, David said to Nathan, “See now, I dwell in an house of cedar, but the ark of God dwelleth within curtains” ([[2 Sam. 7:2]]). He was told that his son would build the house ([[2 Sam. 7:13]]), and he gathered the materials for it. He called that labor trouble when he handed the work to Solomon: “in my trouble I have prepared for the house of the LORD” ([[1 Chr. 22:14]]).

      The psalm asks that this be counted to David’s house. Solomon’s prayer at the temple makes the same request in nearly the same words: “remember the mercies of David thy servant” ([[2 Chr. 6:42]]).
    sources: [lds-scriptures]

  - ref: 6
    phrase: we found it in the fields of the wood
    kind: history
    title: It is the ark, and the wood is Kirjath-jearim
    body: |
      “It” is the ark, which the psalm does not name until verse 8, and “the fields of the wood” is read as the country of Kirjath-jearim, where the ark stood before David fetched it. In the Hebrew “it” is feminine, and the ark is spoken of as feminine in other places as well.

      After the Philistines sent the ark back, “the men of Kirjath-jearim came, and fetched up the ark of the LORD, and brought it into the house of Abinadab in the hill” ([[1 Sam. 7:1]]), and there it stayed twenty years. David went there for it with all Israel ([[1 Chr. 13:5–6]]). The town’s name means “City of woods.” A modern translation leaves “the wood” of this verse as a place name, “we found it in the fields of Jaar,” and on one older reading “Jaar is a shortened name of the city of Kirjath-Jearim.”

      Ephratah is harder. It is the “ancient name of Bethlehem,” and Bethlehem was David’s own town (see [[1 Sam. 17:12]]), yet the ark was never there. One older reading puts the weight on “heard”: in David’s town the ark was known “only by hearsay” until it was found at Kirjath-jearim.
    sources: [lds-scriptures, bd-kirjath-jearim, bd-ephrath, delitzsch-psalms, nrsvue]

  - ref: 8
    phrase: Arise, O LORD, into thy rest
    kind: scripture
    title: Solomon ends his temple prayer with this call
    body: |
      Solomon’s prayer at the dedication of the temple closes with the call of verse 8, a little changed: “Now therefore arise, O LORD God, into thy resting place, thou, and the ark of thy strength” ([[2 Chr. 6:41]]). It has been proposed that the writer of Chronicles “knew of a temple tradition in which Psalm 132 was sung to accompany a re-enactment of the procession of the Ark into the temple.” That is a reconstruction from the two passages, and the psalm itself says only “We will go into his tabernacles.”

      The ark is God’s “strength” again in the psalm that tells of its capture (see the note on [[Ps. 78:60]]); the footstool of verse 7 is explained at [[Ps. 99:5]], and the name the ark bore at [[Ps. 24:10]].
    sources: [lds-scriptures, larsen-ascending-hill]

  - ref: 11
    phrase: Of the fruit of thy body will I set upon thy throne
    kind: christ
    title: Peter reads the oath of Christ
    body: |
      On the day of Pentecost Peter took up this line and said that the oath was God’s promise to raise up Christ to sit on David’s throne. The oath is the promise Nathan carried to David, “I will set up thy seed after thee, which shall proceed out of thy bowels” ([[2 Sam. 7:12]]); how the Psalms come to call that promise an oath and a covenant is told at [[Ps. 89:3]].

      In the psalm the words are a pledge about David’s sons, given as the ground for the prayer of verse 10. Peter takes them further. David was a prophet, he says, “knowing that God had sworn with an oath to him, that of the fruit of his loins, according to the flesh, he would raise up Christ to sit on his throne” ([[Acts 2:30]]). He begins from David’s grave: David “is both dead and buried” ([[Acts 2:29]]). It was as one who knew of the oath that David, “seeing this before spake of the resurrection of Christ” ([[Acts 2:31]]).
    sources: [lds-scriptures]

  - ref: 12
    phrase: If thy children will keep my covenant
    kind: scripture
    title: What the “if” governs
    body: |
      The condition of verse 12 falls on David’s sons and their place on the throne; of the oath itself verse 11 says that the LORD “will not turn from it.” Psalm 89 holds the same two things together and is troubled by them (see the note on [[Ps. 89:30]]).

      The history bore the condition out. When Jerusalem fell to Babylon, “they slew the sons of Zedekiah before his eyes” ([[2 Kgs. 25:7]]) and carried the king away. The books of Kings close with Jerusalem and the temple destroyed and a king of David’s line living in Babylon ([[2 Kgs. 25:27]]).

      One older reading states how the verses fit: the conditions “were conditions of the continuity of the Davidic succession; not, however - because human unfaithfulness does not annul the faithfulness of God - of the endlessness of the Davidic throne.” On that reading the line of kings could be broken, as it was, and the throne was still promised. Peter says in whom the oath was kept (see the note on [[Ps. 132:11]]).
    sources: [lds-scriptures, delitzsch-psalms]

  - ref: 16
    phrase: I will also clothe her priests with salvation
    kind: structure
    title: Every request answered, and with more
    body: |
      The LORD’s speech in verses 14–18 takes up what the people asked in verses 8–10, nearly in their words, and adds to it. The psalm has been counted among those “designed for antiphonal dialogue,” in which worshippers answered a priest or the Levites sang as call and response.

      | The prayer | The answer |
      |---|---|
      | “Arise, O LORD, into thy rest” (verse 8) | “This is my rest for ever” (verse 14) |
      | “Let thy priests be clothed with righteousness” (verse 9) | “I will also clothe her priests with salvation” (verse 16) |
      | “let thy saints shout for joy” (verse 9) | “her saints shall shout aloud for joy” (verse 16) |
      | “turn not away the face of thine anointed” (verse 10) | a horn, a lamp and a crown for “mine anointed” (verses 17–18) |

      One answer was not asked for at all. Verse 15 promises bread for Zion’s poor, of whom the prayer said nothing.

      Later dedications use the answer’s wording as their request. Solomon’s has “let thy priests, O LORD God, be clothed with salvation” ([[2 Chr. 6:41]]). The prayer given by revelation for the temple at Kirtland ends, “let these, thine anointed ones, be clothed with salvation, and thy saints shout aloud for joy” ([[D&C 109:80]]).
    sources: [lds-scriptures, hopkin-psalms-sung]

  - ref: 17
    phrase: make the horn of David to bud
    kind: christ
    title: The horn buds as the Branch grows
    body: |
      The verb translated “to bud” is the one Jeremiah uses of the Branch, the king to come from David’s line. A horn is strength (see [[Ps. 18:2]]), and a horn does not bud, which is why the line sounds odd in English. A modern translation has “I will cause a horn to sprout up for David.” Jeremiah has the same verb with its own noun: “will I cause the Branch of righteousness to grow up unto David” ([[Jer. 33:15]]). The noun is used of a “future ruler, under figure of sprout from Davidic tree,” and this verse is set beside that use. The Branch is explained at [[Jer. 23:5]].
    sources: [lds-scriptures, bdb, nrsvue]

christ: |
  The Church’s heading calls this “a messianic psalm,” and Peter reads it so: the oath of verse 11 was God’s promise to raise up Christ to sit on David’s throne ([[Acts 2:30]]). Gabriel speaks to Mary of that throne. Her son will be given “the throne of his father David” ([[Luke 1:32]]), “and of his kingdom there shall be no end” ([[Luke 1:33]]). On one older reading Zacharias has this psalm’s horn in mind when he blesses God, who “hath raised up an horn of salvation for us in the house of his servant David” ([[Luke 1:69]]).

  In the psalm, “anointed” is first the king in Jerusalem for whom the people pray (the word is explained at [[Ps. 2:2]]). The answer promises that anointed one a horn, a lamp, and a crown that will flourish. The reign of David’s sons in Jerusalem ended (see the note on [[Ps. 132:12]]), and the oath is kept in Jesus Christ.

  The LORD who swears the oath and chooses Zion for His dwelling is Jehovah (see [[Ps. 110:1]]).

explore: |
  - **The two chapters behind the psalm.** [[2 Sam. 6]], the ark brought to Jerusalem, and [[2 Sam. 7]], David’s wish and Nathan’s answer.
  - **The other psalm of the oath.** [[Ps. 89]], which recites the same promise and then mourns the crown cast to the ground.
  - **Solomon’s dedication.** [[2 Chr. 6:41–42]], where verses 8–10 close the prayer, and [[2 Chr. 7:1–3]], what followed.
  - **The Branch.** [[Jer. 23:5–6]], [[Jer. 33:14–17]] and [[Zech. 6:12–13]], the prophets’ promise of a king to grow up for David.

parallels:
  - ref: 2 Chr. 6:41–42
    note: Solomon closes his prayer at the dedication of the temple with verses 8–10.
  - ref: 2 Sam. 7:12–13
    note: Nathan’s promise that David’s seed will be set on his throne, the oath of verse 11.
  - ref: Acts 2:30
    note: Peter takes up the oath of verse 11 and says it was that God would raise up Christ.
  - ref: Luke 1:69
    note: Zacharias blesses God for “an horn of salvation” in the house of David; one older reading hears the horn of verse 17 in it.
  - ref: Jer. 33:15
    note: The Branch made “to grow up unto David,” with the verb of verse 17.
  - ref: D&C 109:80
    note: The dedicatory prayer of the Kirtland Temple ends in the words of verse 16.

