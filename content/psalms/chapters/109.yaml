    note: Peter quotes verse 8 of Judas, joined to Ps. 69:25.
  - ref: Zech. 3:1
    note: Satan stands at the right hand of the accused, as in verse 6.
  - ref: Matt. 5:44
    note: The Savior commands prayer for persecutors; the Joseph Smith Translation of verse 4 has the speaker praying for his adversaries.
  - ref: James 2:13
    note: Judgment without mercy for one who showed none, as in verses 12 and 16 (also Alma 41:15).
  - ref: D&C 114:2
