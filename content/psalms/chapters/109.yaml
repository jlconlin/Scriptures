chapter: 109
title: At the Right Hand of the Poor
tagline: A man repaid with hatred for his love asks God to break His silence, calls down on his accuser the curse that accuser loved, and ends with the LORD standing where the accuser stood.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  The title ascribes the psalm to David and names no occasion. Peter cites it as David’s: before Matthias was chosen he quoted verse 8 as spoken “by the mouth of David” ([[Acts 1:16]]).

  The psalm itself names no one. Its speaker has been slandered by many, and from verse 6 his words fall on a single man who holds an office and has a wife and children. Nothing in it says who he was or when.

  One older reading says that the anathemas are here “poured forth more extensively than anywhere else,” and finds the psalm “most closely related to Psalm 69.” That is the other psalm Peter quotes of Judas (see [[Ps. 69:25]]). The Church’s edition heads it as David speaking of the cursings due to the wicked. What the cursing psalms ask, of whom, and how the Savior’s command to love enemies stands above them is explained at [[Ps. 137:8]]; the notes here take up what belongs to this psalm.

thread: |
  Psalm 109 is a trial. **Accusers are speaking and God is silent; the psalm asks Him to speak, and it ends with Him standing beside the accused.** Its first words are “Hold not thy peace,” and the reason follows at once: the mouths of the wicked “are opened against me.”

  It has the parts of a lament (see [[Ps. 22:1]]), with one of them grown out of all proportion. The address and the complaint take five verses. What the speaker says for himself comes to two things, love and prayer: “For my love they are my adversaries: but I give myself unto prayer.”

  Then, where a lament asks for rescue, come fifteen verses of curse (6–20), and the many enemies narrow to one man. The curse opens in a courtroom, with an accuser at the man’s right hand, and moves outward from him to his office, his household, his property and his name. Verse 16 gives the charge, “Because that he remembered not to shew mercy,” and verses 17–19 say that what comes on him is what he loved. Verse 20 leaves the whole with God: “Let this be the reward of mine adversaries from the LORD.”

  The psalm turns at verse 21, on “But do thou for me.” The speaker stops saying what should become of his enemy and says what he is himself: poor and needy, wounded at heart, fading like a shadow, weak from fasting, a man people shake their heads at. He rests the plea on God’s name and God’s mercy: “for thy name’s sake: because thy mercy is good.” The man who is cursed showed no mercy, and the man who prays asks to be saved “according to thy mercy” (verse 26).

  The end answers the beginning. Mouths are still cursing (“Let them curse, but bless thou”), and the speaker’s own mouth will praise. In verse 6 an accuser stood at the right hand of the wicked man. In verse 31 the LORD stands “at the right hand of the poor, to save him from those that condemn his soul.”

sections:
  - range: 1-5
    heading: Hold not thy peace
    plain: |
      God whom I praise, do not keep silent. Wicked and deceitful mouths have opened against me; they have spoken against me with a lying tongue. They have surrounded me with words of hate and attacked me for no reason. In return for my love they accuse me, though I am all prayer. They have repaid me evil for good, and hatred for my love.
  - range: 6-15
    heading: Let another take his office
    plain: |
      Set a wicked man over him, and let an accuser stand at his right hand. When he is tried, let him come out guilty, and let his prayer be counted as sin. Let his days be few, and let another take his office. Let his children be fatherless and his wife a widow; let his children wander and beg, and seek their bread far from their ruined home. Let the creditor seize all that he has, and let strangers plunder what he worked for. Let no one extend mercy to him or pity his fatherless children. Let his line be cut off, and their name blotted out in the next generation. Let the LORD remember the iniquity of his fathers, and let his mother’s sin not be blotted out; let these stand before the LORD always, that He may cut off their memory from the earth.
  - range: 16-20
    heading: As he loved cursing
    plain: |
      For he did not remember to show mercy. He hunted the poor and needy man, the brokenhearted, to kill him. He loved cursing, so let it come to him; he took no pleasure in blessing, so let it be far from him. He put on cursing like his coat; let it soak into him like water, and like oil into his bones. Let it be the garment he wraps around himself and the belt he always wears. Let this be my accusers’ reward from the LORD, the reward of those who speak evil against my life.
  - range: 21-25
    heading: But do thou for me
    plain: |
      But You, GOD the Lord, act for me for Your name’s sake; because Your mercy is good, deliver me. For I am poor and needy, and my heart is wounded within me. I am going like a shadow at evening; I am shaken off like a locust. My knees give way from fasting, and my body has grown gaunt. I have become a thing they scorn; when they see me they shake their heads.
  - range: 26-31
    heading: That they may know that this is thy hand
    plain: |
      Help me, LORD my God; save me according to Your mercy, so that they may know that this is Your hand, that You, LORD, have done it. Let them curse, but You bless. When they rise up, let them be put to shame, and let Your servant rejoice. Let my accusers be clothed with disgrace and wrapped in their own shame as in a cloak. With my mouth I will thank the LORD greatly; I will praise Him in the middle of the crowd. For He stands at the right hand of the needy, to save him from those who condemn him.

notes:
  - ref: 4
    phrase: but I give myself unto prayer
    kind: scripture
    title: A prayer for his adversaries
    body: |
      Before the curse begins, the speaker says that he prays, and the Joseph Smith Translation says that the prayer is for the men who accuse him. The Hebrew of the clause is only “I prayer,” and every translation has to fill it out. The King James has “I give myself unto prayer”; the ancient Greek, “but I continued to pray.” A modern translation follows the old Syriac version and reads “even while I make prayer for them.”

      The Prophet’s revision takes the line the same way: “And, notwithstanding my love, they are my adversaries; yet I will continue in prayer for them.” The Church’s edition sums up the change in a sentence: “We are to pray for our adversaries.”

      So read, verse 4 is what the Savior afterward commanded, “pray for them which despitefully use you, and persecute you” ([[Matt. 5:44]]), and it is said by the man who goes on to speak verses 6–19. The psalm has both: prayer for the accusers, and their case left with the LORD (verse 20).
    sources: [lds-scriptures, nrsvue, lxx-rahlfs]
  - ref: 6
    phrase: Set thou a wicked man over him
    kind: history
    title: From many enemies to one man
    body: |
      At verse 6 the enemies, who have been many since verse 2, become one man, and the psalm does not say who he is. One older reading has it that the speaker “now turns to one among the many,” asks whether the man was Doeg the Edomite or Cush the Benjamite, and answers, “We do not know.” The psalm shows only that he had an office to lose (verse 8), so that he “must have held a prominent position among the enemies of the psalmist,” and a household and property (verses 9–11). At verse 20 the plural returns: “Let this be the reward of mine adversaries.”

      Because of that change of number, a modern translation supplies two words before verse 6, “They say,” and prints verses 6–19 as a quotation. The curse then becomes what the accusers said against the psalmist, and verse 20 asks that it be their own reward from the LORD. The same translation notes that the Hebrew lacks the two words. The Church’s edition takes the curse as David’s own, heading the psalm as his speaking of the cursings due to the wicked, and Peter quoted verse 8 as David’s own word, spoken “concerning Judas” ([[Acts 1:16]]).

      How a prayer of this kind is to be read is the note at [[Ps. 137:8]].
    sources: [delitzsch-psalms, nrsvue, lds-scriptures]
  - ref: 6
    phrase: let Satan stand at his right hand
    kind: words
    title: An accuser in court
    body: |
      “Satan” here is the Hebrew common noun for an adversary or accuser, and it is the word the psalm has been using all along for the speaker’s enemies. “They are my adversaries” in verse 4 is the verb made from it, meaning to “be or act as adversary,” and so is “mine adversaries” in verses 20 and 29. The speaker has been accused falsely, and he asks that his accuser be given an accuser.

      The scene is a trial. Verse 7 continues, “When he shall be judged, let him be condemned,” and even the man’s plea is to count against him. Zechariah saw the same arrangement: “Joshua the high priest standing before the angel of the LORD, and Satan standing at his right hand to resist him” ([[Zech. 3:1]]). Whether the psalm means a human prosecutor or the adversary himself is not settled. The lexicon files this verse under the ordinary sense, an adversary “personal or national,” and keeps the “superhuman adversary” for Job and Zechariah; a modern translation has “an accuser”; the ancient Greek has “the devil.”

      The right hand matters because the psalm returns to it. Its last verse says that the LORD “shall stand at the right hand of the poor, to save him from those that condemn his soul.” Beside the wicked man the place is the accuser’s, and beside the poor man it is God’s. (For the right hand as the place where a defender stands, see [[Ps. 110:5]].)
    sources: [bdb, nrsvue, lxx-rahlfs, lds-scriptures]
  - ref: 8
    phrase: let another take his office
    kind: scripture
    title: Peter reads the line of Judas
    body: |
      Peter quoted this line when the Twelve had lost one of their number, and on its authority another was chosen. He joined it to a line of another psalm (see [[Ps. 69:25]]): “For it is written in the book of Psalms, Let his habitation be desolate, and let no man dwell therein: and his bishoprick let another take” ([[Acts 1:20]]). The lot then fell on Matthias, “and he was numbered with the eleven apostles” ([[Acts 1:26]]).

      “Office” is the word that carries the verse into Acts, and it is less certain than it looks. The Hebrew noun means “oversight, charge,” but the lexicon thinks that here it is perhaps the man’s “store, things laid up,” and gives “office” as the reading of others. The ancient Greek psalm took it as a post, “his office of overseer,” and Peter’s “bishoprick” is glossed in the Church’s edition as “overseership, office.”

      In the psalm the line is a curse on one man: he dies early, and someone else holds what was his. Peter takes from it that the place Judas left was to be filled. Judas “by transgression fell” ([[Acts 1:25]]), and the apostleship went on without him. The Lord used the phrase again in a revelation of April 1838, of Church positions held by those who are not faithful: “inasmuch as there are those among you who deny my name, others shall be planted in their stead and receive their bishopric” ([[D&C 114:2]]).
    sources: [lds-scriptures, bdb, lxx-rahlfs]
  - ref: 17
    phrase: As he loved cursing, so let it come unto him
    kind: scripture
    title: The curse he chose
    body: |
      The curse is fitted to the man: what the psalm asks to come on him is what verses 16–18 say he did. He “remembered not to shew mercy,” and verse 12 asks that there be “none to extend mercy unto him.” He loved cursing and wore it like a garment, and it is to soak into him “like water, and like oil into his bones,” and be the garment he never takes off. At the end the accusers are dressed once more, “with shame” (verse 29).

      The King James makes verses 17–18 wishes: “so let it come unto him.” The ancient Greek reads them as statements of what follows: “He loved cursing also, and it shall come upon him.” One older reading takes the Hebrew that way too: the man’s fate is told as “the result that followed of inward necessity” from the course he had set for himself.

      Scripture states the principle outside the psalm. James writes, “he shall have judgment without mercy, that hath shewed no mercy” ([[James 2:13]]), and Alma tells his son, “that which ye do send out shall return unto you again, and be restored” ([[Alma 41:15]]). That does not make verses 9–15, which reach the man’s wife and children, easy to read, and the psalm gives no reason for them beyond verse 16. They are spoken to God and left with Him (verse 20); see the note at [[Ps. 137:8]].
    sources: [lxx-rahlfs, delitzsch-psalms, lds-scriptures]
  - ref: 23
    phrase: I am tossed up and down as the locust
    kind: symbol
    title: Shaken off like a locust
    body: |
      The picture is of an insect shaken out of a garment, and with the shadow beside it the verse says that the speaker is nearly gone. The verb means to “shake, shake out or off,” and the line may be rendered “I am shaken out like a locust,” as from the fold of a garment, a “simile of perishing helplessly.” A modern translation has “I am shaken off like a locust.”

      The first half of the verse is a shadow at evening (compare [[Ps. 102:11]]). Both pictures come where the psalm turns from the enemy to the speaker (verses 22–25), and neither has any strength in it.
    sources: [bdb, nrsvue, lds-scriptures]

christ: |
  Peter read this psalm of the Savior’s betrayal. The scripture that had to be fulfilled, he said, was one “which the Holy Ghost by the mouth of David spake before concerning Judas, which was guide to them that took Jesus” ([[Acts 1:16]]), and verse 8 is one of the two lines he then quoted. One older reading counts the psalm with Psalms 22 and 69 as “a typically prophetic Psalm,” in which what David says of himself “is carried by the Spirit of prophecy beyond himself.”

  The curses are another matter. The same reading says that they are not “appropriate in the mouth of the suffering Saviour.” What He said of those who crucified Him was “Father, forgive them; for they know not what they do” ([[Luke 23:34]]).

  The psalm ends with the LORD, who is Jehovah (see [[Ps. 110:1]]), standing at the right hand of the poor “to save him from those that condemn his soul.” The New Testament and modern revelation speak of Jesus Christ in the same courtroom terms: “we have an advocate with the Father, Jesus Christ the righteous” ([[1 Jn. 2:1]]); “Listen to him who is the advocate with the Father, who is pleading your cause before him” ([[D&C 45:3]]).

explore: |
  - **The other psalm Peter quoted.** [[Ps. 69:22–28]] and the notes there.
  - **The accuser at the right hand.** [[Zech. 3:1–2]], where the LORD rebukes Satan, and [[Rev. 12:10]], where “the accuser of our brethren is cast down.”
  - **The right hand in the next psalm.** [[Ps. 110:1]] and [[Ps. 110:5]].
  - **The vacant place filled.** [[Acts 1:15–26]] and [[D&C 114]].
  - **Prayer for enemies.** [[Matt. 5:43–48]] beside verse 4.

