chapter: 16
title: The Path of Life
tagline: A man who has taken the LORD as his whole inheritance concludes that God will not abandon him to death, and two apostles say that what he hoped for was done in the Resurrection of Jesus Christ.
when: 'By its title, a Michtam of David; no occasion is given'

setting: |
  Psalm 16 stands in Book One of the Psalms. Its title ascribes it to David and names no occasion. The title also calls it a Michtam, a word five later psalms share; the note on the title takes it up.

  The psalm is about trust from its first line. It opens with one short plea and after that asks for nothing. There is no complaint, no enemy is described, and no deliverance is reported. The speaker says whose he is, what he has in the LORD, and what he therefore expects.

  The New Testament quotes its closing verses twice, both times of the Resurrection of Christ. On the day of Pentecost Peter recited verses 8–11 as David’s words ([[Acts 2:25–31]]), and in a synagogue in Antioch Paul quoted verse 10 ([[Acts 13:35–37]]). The psalm “has been interpreted as a messianic psalm since at least New Testament times,” and the Church’s edition heads it as one.

  This chapter takes the psalm first as its speaker’s own confession and then as the apostles read it. For how the two readings fit together, see the background to Psalm 22 ([[Ps. 22:1]]).

thread: |
  Psalm 16 makes one request, “Preserve me,” and then spends ten verses saying why the speaker trusts God to grant it. **It moves from what the speaker has chosen to what he therefore expects, and the hinge is the “Therefore” of verse 9.**

  The first half is choice. He has said to the LORD, “Thou art my Lord” (verse 2). His delight is in the saints (verse 3), and he will have nothing to do with the offerings of other gods or even with their names (verse 4). Then the choice is restated as a possession, in words used for a share of land: the LORD is his portion, his cup, his lot, his heritage (verses 5–6). The LORD counsels him and stands at his right hand, so that he “shall not be moved” (verses 7–8).

  Then comes “Therefore.” What follows is drawn as a conclusion from all of that. Heart and glory rejoice, and the confidence reaches the body as well: “my flesh also shall rest in hope.” Verse 10 gives the reason. The God who is his portion will not leave him to Sheol, the place of the dead. The psalm does not say how. On one reading it argues from the relationship itself: “it is impossible for the man, who, in appropriating faith and actual experience, calls God his own, to fall into the hands of death.”

  The last verse says where this leads: “the path of life,” God’s presence, and God’s right hand. Verse 8 had the LORD at the speaker’s right hand; verse 11 ends with what is at the LORD’s.

sections:
  - range: 1-4
    heading: Thou art my Lord
    plain: |
      Keep me, O God, for I have taken refuge in You. I have said to the LORD, “You are my Lord; I have no good apart from You” (the King James has “my goodness extendeth not to thee”). As for the holy ones who are in the land, they are the noble ones, and all my delight is in them. Those who run after another god will have sorrow upon sorrow. I will not pour out their drink offerings of blood, and I will not take their names on my lips.
  - range: 5-6
    heading: The LORD is my portion
    plain: |
      The LORD is my share of the inheritance and my cup; You hold my lot. The measuring lines have fallen for me in pleasant places. Yes, I have a beautiful heritage.
  - range: 7-8
    heading: Counsel by night, the LORD at my right hand
    plain: |
      I will bless the LORD, who has given me counsel; even in the night my own heart corrects me. I have set the LORD always before me. Because He is at my right hand, I will not be shaken.
  - range: 9-11
    heading: Therefore
    plain: |
      Therefore my heart is glad and my glory rejoices, and my body also will rest in hope. For You will not abandon my soul to hell, the place of the dead, and You will not let Your Holy One see corruption. You will show me the path of life. In Your presence is fullness of joy, and at Your right hand are pleasures for evermore.

notes:
  - ref: 0
    phrase: Michtam
    kind: words
    title: Michtam, a word of unknown meaning
    body: |
      What Michtam means is not known. The word stands in six titles, this one and those of Psalms 56–60, always beside David’s name, and it is “a technical term in Psalm titles, meaning unknown.” It is counted among the titles that “appear to be intended to indicate the character of the Psalm,” and it has been “rendered by some Golden Psalm.” The ancient Greek translators took it for something written, and their title is “A writing of David.” What a title is, and what it is worth as evidence, is discussed under the title of Psalm 3 ([[Ps. 3:1]]).
    sources: [oshb-wlc, bdb, bd-psalms, lxx-rahlfs]

  - ref: 2
    phrase: my goodness extendeth not to thee
    kind: words
    title: No good apart from Thee
    body: |
      The second half of verse 2 is three words in Hebrew, and translations divide over them. They are the noun for his goodness, a negative, and a preposition with “thee.” There is no verb. The King James supplies “extendeth”: his goodness does not reach as far as God, and so it goes (verse 3) to the saints. The ancient Greek translation took the line in much the same direction, with God having “no need of my goodness.” The line can also read “I have no good apart from you,” as the footnote in the Church’s edition gives it, though the translation that reads so adds “Meaning of Heb uncertain.”

      Either he can add nothing to God, or he has nothing good that does not come from God.

      The opening of the verse is smoothed in English as well. The Hebrew verb is in the second person and feminine, and the King James supplies someone for it to address, “O my soul.” The Greek has simply “I said to the Lord,” and that translation likewise makes the speaker the subject.
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, lds-scriptures]

  - ref: 3
    phrase: the saints that are in the earth
    kind: words
    title: The saints are the holy ones in the land
    body: |
      “Saints” translates the Hebrew for holy ones, and the phrase can read “the holy ones in the land.” The word is the plural of the adjective used of Israel as a “holy nation” ([[Ex. 19:6]]), and in this verse it means “sacred ones, saints.” These are the people the speaker delights in; the next verse turns to those who go after another god.

      It is a different Hebrew word from the “Holy One” of verse 10, which has its own note.
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]

  - ref: 4
    phrase: their drink offerings of blood will I not offer
    kind: history
    title: Offerings he will not pour, names he will not say
    body: |
      The speaker refuses two acts of worship: pouring an offering to another god, and speaking that god’s name. The line can read “their drink offerings of blood I will not pour out.” The psalm does not say why they are “of blood.” On one older reading they were neither blood nor wine mixed with blood, but are called so “because they are offered with blood-stained hands and blood-guilty consciences.”

      The second refusal has a counterpart in the law. Israel was told to “make no mention of the name of other gods, neither let it be heard out of thy mouth” ([[Ex. 23:13]]), and the speaker will not “take up their names into my lips.”

      The first line of the verse is less clear than it looks in English. The Hebrew has only the word for another, with no noun for “god,” and the verb the King James gives as “hasten after” is disputed. One translation has “Those who choose another god multiply their sorrows” and adds “Meaning of Heb uncertain.”
    sources: [nrsvue, delitzsch-psalms, oshb-wlc, lds-scriptures]

  - ref: 5
    phrase: the portion of mine inheritance
    kind: symbol
    title: The LORD as his share of the land
    body: |
      Verses 5 and 6 speak of God in the vocabulary of dividing land. The “lines” are the “measuring-cord, line” with which land was marked off, used here as a figure “of favoured life”: the cords were cast, and a man’s property lay where they fell. In the book of Joshua, “there fell ten portions to Manasseh” ([[Josh. 17:5]]), where the Hebrew expression is the one behind “the lines are fallen” here.

      One tribe had been given no such share. The LORD said to Aaron, “Thou shalt have no inheritance in their land, neither shalt thou have any part among them: I am thy part and thine inheritance among the children of Israel” ([[Num. 18:20]]). On one reading the psalm’s speaker takes that arrangement as his own, and so may anyone: what the tribe of Levi was “in outward relation to the nation, holds good, in all its deep spiritual significance, of every believer.” He names the LORD as his estate and says that its boundaries have fallen “in pleasant places.”
    sources: [bdb, delitzsch-psalms, lds-scriptures]

  - ref: 7
    phrase: my reins also instruct me
    kind: words
    title: Instructed at night from within
    body: |
      “Reins” are the kidneys, which in Hebrew stand for the “seat of emotion and affection” (see the note on [[Ps. 7:9]]), and the line says that the speaker’s own inner self corrects him in the night: “my reins (the emotions of my own heart) correct, admonish me.” The ancient Greek made the verb sterner: “my reins too have chastened me.”
    sources: [bdb, lxx-rahlfs]

  - ref: 8
    phrase: I have set the LORD always before me
    kind: scripture
    title: Peter quotes the psalm as the Greek has it
    body: |
      Peter recited verses 8–11 on the day of Pentecost in the wording of the ancient Greek translation, the Septuagint, which differs from the Hebrew in several places. Where the Hebrew has “I have set the LORD always before me,” Peter has “I foresaw the Lord always before my face” ([[Acts 2:25]]). That expression “comes from the Septuagint,” whose verse reads the same.

      Where the psalm has “my glory rejoiceth,” Peter has “my tongue was glad” ([[Acts 2:26]]), again with the Greek, “my tongue exulted.” “My glory” in the Hebrew is poetic for “the seat of honour in the inner man, the noblest part of man.”

      Peter quotes a shorter form of the last verse, following the Greek: “Thou hast made known to me the ways of life; thou shalt make me full of joy with thy countenance” ([[Acts 2:28]]).

      Peter introduces the whole quotation with “For David speaketh concerning him” ([[Acts 2:25]]), that is, concerning Jesus. Read so, “David sees the future mortal ministry of Christ.” In the psalm itself the line says how the speaker lives: with the LORD kept in view and close at his side, he “shall not be moved.”
    sources: [lds-scriptures, lxx-rahlfs, ot-minute-psalms-1-20, bdb]

  - ref: 10
    phrase: thou wilt not leave my soul in hell
    kind: words
    title: Not abandoned to Sheol
    body: |
      “Hell” here is *sheol*, the place of the dead, and the Hebrew says that God will not abandon the speaker to it. Sheol is explained at [[Ps. 6:5]]. The verb is the one used “of God’s forsaking, abandoning men,” and the preposition is “to.” The line can also read “For you do not give me up to Sheol.”

      Peter read the line of Jesus Christ, who went into the world of spirits at His death and did not remain there; the note on “to see corruption” follows his argument.

      The verse is also read of David himself, of his own future redemption from hell. That promise, and what latter-day revelation says of David, is taken up at [[Ps. 51:14]].
    sources: [oshb-wlc, bdb, nrsvue, scripture-helps-ps-1, lds-scriptures]

  - ref: 10
    phrase: thine Holy One
    kind: words
    title: The Holy One is the faithful one
    body: |
      “Holy One” here is *hasid*, the faithful or devoted one, and in the psalm it stands in parallel with “my soul.” The word is explained in the note on [[Ps. 4:3]]. The phrase can read “your faithful one.”

      The Greek translation has the word of one person, and Peter and Paul both quote it so: “Thou shalt not suffer thine Holy One to see corruption” ([[Acts 13:35]]). Both apply it to the Messiah, and the next note follows their argument.
    sources: [oshb-wlc, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 10
    phrase: to see corruption
    kind: christ
    title: David saw corruption; Jesus did not
    body: |
      Peter and Paul both argue from this line that the psalm speaks of the Resurrection of Jesus Christ, because it did not come true of David. Peter said at Pentecost, “Men and brethren, let me freely speak unto you of the patriarch David, that he is both dead and buried, and his sepulchre is with us unto this day” ([[Acts 2:29]]). David therefore spoke as a prophet. He knew that God had sworn to raise up Christ from his descendants to sit on his throne, and “he seeing this before spake of the resurrection of Christ, that his soul was not left in hell, neither his flesh did see corruption” ([[Acts 2:31]]).

      Paul made the same argument in the synagogue at Antioch: “For David, after he had served his own generation by the will of God, fell on sleep, and was laid unto his fathers, and saw corruption: But he, whom God raised again, saw no corruption” ([[Acts 13:36–37]]).

      Both apostles quote the psalm in Greek, which has “corruption,” and Peter applies the word to the flesh. The Hebrew word is *shachat*, a “pit,” used in this verse for the pit of Sheol and set in parallel with Sheol in the first half of the line. The line can read “or let your faithful one see the Pit.”

      How the psalm can be David’s own confession and also a prophecy has been put this way, as one reading. His hope of not coming under the power of death “was not realised in David himself.” Rather, “it is fulfilled in Jesus, who has not been left to Hades and whose flesh did not see corruption.” Then what was foretold “comes back upon himself, to raise him also from death and Hades to the beholding of God.”
    sources: [lds-scriptures, ot-minute-psalms-1-20, lxx-rahlfs, bdb, nrsvue, delitzsch-psalms]

  - ref: 11
    phrase: in thy presence is fulness of joy
    kind: symbol
    title: Joy before His face
    body: |
      “Presence” is the Hebrew word for face, and the psalm’s last hope is to be where God is seen. The Greek translators kept the image: “thou wilt fill me with joy with thy countenance.” Peter quoted the line in that form (see the note on verse 8).

      To see the face of God is a hope that recurs in the Psalms: there are “psalms about the great quest to see the face of God in the temple.” This verse has been cited for the joy of coming before Him: “the Psalmist especially exulted in the opportunity to come into the Lord’s presence.” The temple in the Psalms is discussed at [[Ps. 24:3]].
    sources: [oshb-wlc, bdb, lxx-rahlfs, lds-scriptures, skinner-seeing-god]

christ: |
  Two apostles read Psalm 16 of the Resurrection of Jesus Christ: Peter at Pentecost and Paul at Antioch ([[Acts 2:29–31]]; [[Acts 13:35–37]]). The note on “to see corruption” follows their argument.

  The Savior did not remain in the world of spirits, and His flesh did not see corruption. The psalm’s words have been applied to all who die as well: God will not suffer their bodies to see corruption forever, “because of the resurrection guaranteed by His Son, the Holy One.”

explore: |
  - **The two sermons.** [[Acts 2:22–36]] and [[Acts 13:26–39]], each read with verses 8–11 open.
  - **The next psalm’s last line.** [[Ps. 17:15]], which has been compared with verse 11.

parallels:
  - ref: Acts 2:25–31
    note: Peter quotes verses 8–11 at Pentecost and says that David spoke of the resurrection of Christ.
  - ref: Acts 13:35–37
    note: Paul quotes verse 10; David saw corruption, and He whom God raised did not.
  - ref: Num. 18:20
    note: The LORD is the part and inheritance of Aaron, who has no land (verse 5).
  - ref: Ex. 23:13
    note: The names of other gods are not to be mentioned (verse 4).

