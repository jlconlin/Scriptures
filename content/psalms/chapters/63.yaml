chapter: 63
title: Better Than Life
tagline: In a land without water a hunted king thirsts for God, remembers seeing Him in the sanctuary, and is satisfied in remembering Him.
when: 'By its title, David’s, when he was in the wilderness of Judah'

setting: |
  The title ascribes the psalm to David and puts him in the wilderness of Judah. The story has him in the wilderness in Saul’s time and again in Absalom’s, and the note on the title takes up which is meant.

  This chapter follows the older reading that sets the psalm in Absalom’s revolt, in the days when David left Jerusalem and went “toward the way of the wilderness” ([[2 Sam. 15:23]]). On that reading the title “throws light upon the whole Psalm”: the poet is a king, he longs for the God he had beheld on Zion, and enemies have plotted his ruin. The story says that the king and his people “came weary” to their resting place ([[2 Sam. 16:14]]), and the same reading finds in that word the weariness of verse 1.

  The psalm makes no request. In the King James every line says what the speaker does, has seen, or expects, and the Hebrew has no imperative. It also never uses the divine name: God is *Elohim* in verses 1 and 11, and “my God” in verse 1 is *El*.

  Psalm 61, which the same reading places in the same days, has the wings and the king together ([[Ps. 61:4–7]]).

thread: |
  The psalm begins in thirst and is satisfied by verse 5, and **the psalm tells of no change in the wilderness in between. What it tells of is remembering.**

  Verse 1 is want: the soul thirsts and the flesh faints, in a land with no water. Verse 2 looks back, “so as I have seen thee in the sanctuary.” Verse 3 gives the reason he praises where he is: God’s lovingkindness “is better than life.” So the life he has will be spent blessing God (verse 4).

  Then comes the answer to verse 1: “My soul shall be satisfied” (verse 5). The sentence runs on into verse 6 and says when he is satisfied: “When I remember thee upon my bed.” Verse 7 rests present joy on past help, “Because thou hast been my help,” and verse 8 sets two holds side by side. His soul cleaves to God, and God’s right hand holds him up.

  “Soul” is one Hebrew word in verses 1, 5, 8 and 9. It thirsts, it is satisfied, it cleaves, and in verse 9 it is what his enemies seek. Only there, with a “But,” does the psalm mention enemies. They are given two verses, and the verses say what will happen to them without asking for it (see the note on verse 9). A second “But” closes the psalm with the king rejoicing in God. The last line has a different mouth from the one that praises in verse 5: the liars’, which is stopped.

sections:
  - range: 1-2
    heading: Thirst in a land without water
    plain: |
      God, You are my God; I look for You eagerly. My soul is thirsty for You, and my body faints for You, in a dry and weary land where there is no water. So I have gazed on You in the holy place, to see Your power and Your glory.
  - range: 3-4
    heading: Better than life
    plain: |
      Because Your lovingkindness is better than life, my lips will praise You. So I will bless You as long as I live; in Your name I will lift up my hands.
  - range: 5-8
    heading: Satisfied, remembering in the night
    plain: |
      My soul will be filled as with the richest food, and my mouth will praise You with joyful lips, when I remember You on my bed and think on You through the watches of the night. For You have been my help, and in the shadow of Your wings I sing for joy. My soul clings to You and follows You; Your right hand holds me up.
  - range: 9-11
    heading: The pursuers and the king
    plain: |
      But those who seek my life, to destroy it, will go down into the depths of the earth. They will be given over to the sword; they will be a share for jackals. But the king will rejoice in God. Everyone who swears by him will glory, for the mouths of those who speak lies will be shut.

notes:
  - ref: 0
    phrase: when he was in the wilderness of Judah
    kind: history
    title: Two seasons in the wilderness
    body: |
      The story has David in the wilderness in Saul’s time and in Absalom’s, and one older reading takes the psalm’s last verse as pointing to the second. Hiding from Saul, “David abode in the wilderness in strong holds” ([[1 Sam. 23:14]]). As king he fled from his son Absalom by “the way of the wilderness” ([[2 Sam. 15:23]]) and waited “in the plain of the wilderness” ([[2 Sam. 15:28]]) before he crossed the Jordan.

      Earlier interpreters put the psalm in Saul’s time. The reading followed here answers that verse 11 says “the king,” and that while Saul reigned “David could not well call himself” that. It sets the psalm in the flight from Absalom, when “he tarried one or two days” in the part of the wilderness of Judah “lying nearest to Jerusalem, that dreary waste that extends along the western shore of the Dead Sea.”

      This chapter reads the psalm in that setting. The title is the evidence for any setting at all, and what a title is worth is discussed at [[Ps. 3:1]].
    sources: [lds-scriptures, delitzsch-psalms]

  - ref: 1
    phrase: early will I seek thee
    kind: words
    title: Early, or eagerly
    body: |
      The Hebrew is one verb that means to seek eagerly, and it was made from the word for dawn. Its sense is to “look early, diligently for,” and it is thought to have meant at first to “look for dawn”; in this verse it is to “seek with longing, long for.” A modern translation has only “I seek you.” The ancient Greek kept the hour: “I cry to thee early.”

      Isaiah has the same verb beside the night: “With my soul have I desired thee in the night; yea, with my spirit within me will I seek thee early” ([[Isa. 26:9]]).
    sources: [bdb, nrsvue, lxx-rahlfs]

  - ref: 1
    phrase: my flesh longeth for thee in a dry and thirsty land
    kind: words
    title: Faint in a weary land
    body: |
      Both words are words of exhaustion: the flesh faints and the land is weary. “Longeth” is a verb found only here in the Psalms, to “faint (with longing) for thee,” and a modern translation has “my flesh faints for you.” “Thirsty” is an adjective, “faint, weary,” said of people worn by exertion and hunger and “specifically from thirst.”

      Whether the land is a place or a figure is read both ways. The Hebrew says “in” a dry land, and the title names the place. A modern translation makes it a comparison, “as in a dry and weary land where there is no water,” and the phrase has been classed as figurative. Either way the verse says what he thirsts for, and it is God.
    sources: [oshb-wlc, bdb, nrsvue]

  - ref: 2
    phrase: so as I have seen thee in the sanctuary
    kind: words
    title: Seen in the sanctuary
    body: |
      He says he has seen God in the sanctuary, and the Hebrew says that first. Its order is the reverse of the King James’s, as in a modern translation: “So I have looked upon you in the sanctuary, beholding your power and glory.” The verb belongs almost wholly to poetry and means “see, behold”; in [[Ps. 11:7]] and [[Ps. 17:15]] it is the verb for beholding the face of God. The ancient Greek has him appear before God instead: “Thus have I appeared before thee in the sanctuary, that I might see thy power and thy glory.”

      The verse is counted among those in which seeing God “is the preeminent image [in the Psalms] for the experience of God in the temple,” and it has been read as a plain statement that the psalmist “had seen God in his sanctuary and there beheld his power and glory.” The psalm does not say what he saw beyond those two things, power and glory.

      On what sanctuary a psalm of David could mean, see the note on [[Ps. 5:7]]; on seeing God’s face in His house, the notes on [[Ps. 17:15]] and [[Ps. 42:2]].
    sources: [oshb-wlc, nrsvue, bdb, lxx-rahlfs, skinner-seeing-god]

  - ref: 3
    phrase: thy lovingkindness is better than life
    kind: words
    title: Lovingkindness set above life
    body: |
      The verse ranks God’s *hesed* above life, and the next verse says what the speaker will do with the life he has. “Lovingkindness” is the word explained at [[Ps. 51:1]]; a modern translation has “steadfast love” here, and the ancient Greek “mercy.”

      “Life” in verse 3 and “while I live” in verse 4 are one Hebrew noun.
    sources: [oshb-wlc, nrsvue, lxx-rahlfs]

  - ref: 4
    phrase: I will lift up my hands in thy name
    kind: symbol
    title: Lifted hands, wings, and a right hand
    body: |
      Lifting the hands is the posture of prayer explained at [[Ps. 28:2]], and this psalm is named among the “psalms related to the temple” that describe it. A modern translation fills out “in thy name”: “I will lift up my hands and call on your name.”

      It has been proposed that the psalm describes more than a posture: that verses 4, 7 and 8 give “a possible set of ritual actions undertaken by the petitioner in approaching God.” The proposal takes the speaker as Israel’s king in the temple. The lifted hands put him “at the altar of incense/prayer,” which stood before the veil; the wings of verse 7 are those some have identified as “the wings of the cherubim that overshadowed the ark or divine throne”; and “upholdeth” in verse 8, a verb whose senses are “grasp, support, attain,” is read as “a proposed right-hand clasp between God and the king.”

      The proposal allows that “it is possible to understand these references metaphorically.” The psalm itself gives the three images and names no rite, so the sequence is a reconstruction. On the wings as a figure of the LORD’s protection, see the note on [[Ps. 17:8]].
    sources: [sc-knowhy-638, brown-handclasp, bdb, oshb-wlc, nrsvue]

  - ref: 5
    phrase: as with marrow and fatness
    kind: symbol
    title: A rich feast, said by a thirsty man
    body: |
      The feast is a comparison, and it answers the thirst of verse 1. The Hebrew has two words for fat, “with fat and fatness,” which a modern translation gives as “a rich feast.” The first is the fat of animals “as rich food,” a use found in poetry. The second is “fatness, abundance,” the word of “the fatness of thy house” in [[Ps. 36:8]], where the note follows it into the sanctuary.

      The first word is also the law’s word for the fat of a sacrifice, which went to the altar and was not eaten ([[Lev. 3:16–17]]). This verse is classed with the rich food and not with the offerings.

      The verse says “as with,” and verse 6 says when the soul is filled: “When I remember thee.”
    sources: [nrsvue, bdb, oshb-wlc]

  - ref: 6
    phrase: in the night watches
    kind: history
    title: Three watches of the night
    body: |
      The night was divided into three watches, and the psalm’s word is plural. The first ran from sunset to about ten, the “middle watch” from ten to two, and the “morning watch” from two until sunrise. The Hebrew word is simply a “watch (division of time).” Another psalm has the night watches as a time to meditate:“Mine eyes prevent the night watches, that I might meditate in thy word” ([[Ps. 119:148]]).

      A modern translation joins this verse to the one before it, so that his soul is satisfied “when I think of you on my bed.”
    sources: [bd-watches, bdb, nrsvue]

  - ref: 8
    phrase: My soul followeth hard after thee
    kind: words
    title: Cleaving, and being held
    body: |
      “Followeth hard after” is the Hebrew verb “cleave,” said of the man who shall “cleave unto his wife” ([[Gen. 2:24]]) and of Ruth, who “clave unto her” mother-in-law ([[Ruth 1:14]]). Its senses are “cling, cleave, keep close,” and it is used “of loyalty, affection,” sometimes with the idea of nearness kept. This verse is listed with Deuteronomy’s charges to cleave to the LORD.

      Here the verb is followed by “after,” so that the soul cleaves after God: it clings and it follows. The King James keeps the following and a modern translation the clinging, “My soul clings to you.” The ancient Greek has both: “My soul has kept very close behind thee.”

      The second half of the line is “thy right hand upholdeth me.” The verse is counted among the passages in the Psalms that “refer to grasping the Lord’s right hand”; see [[Ps. 73:23]].
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs, sc-knowhy-642]

  - ref: 9
    phrase: shall go into the lower parts of the earth
    kind: words
    title: What will happen to the pursuers
    body: |
      Verses 9 and 10 say what will happen to his enemies; they do not ask God to do it. The King James and a modern translation both have plain futures, “shall go down into the depths of the earth,” and on one older reading the verbs “are to be taken as predictive, not as imprecatory,” which “accords better with the quiet, gentle character of the whole song.” For the psalms that do ask, see the note on [[Ps. 137:8]].

      Three ends are named. “The lower parts of the earth” is “the lowest places of the earth.” Kindred phrases name Sheol, the world of the dead (see the note on [[Ps. 6:5]]), and the same older reading takes this one as “the interior of the earth down into its deepest bottom.” To “fall by the sword” is to be “given over to the power of the sword.” And the “foxes” are a word for the “fox, perhaps also jackal,” named here as “eating offal.”

      The same older reading points to the battle that ended the revolt as the fulfilment: “there was there a great slaughter that day of twenty thousand men” ([[2 Sam. 18:7]]).
    sources: [nrsvue, delitzsch-psalms, bdb]

  - ref: 11
    phrase: the king shall rejoice in God
    kind: history
    title: The king, and whose name is sworn by
    body: |
      The speaker who has said “I” for ten verses ends by saying “the king,” and if the title is followed he is speaking of himself. One older reading takes it so here and in Psalm 61: “in both Psalms he speaks of himself as king” (see the note on [[Ps. 61:6]]).

      “Every one that sweareth by him” can be read two ways, because “him” may be God or the king. “So far as the language is concerned, both references are admissible,” and the King James and the ancient Greek leave it open. The same reading decides for God, since “the Israelite is to swear by the name of Jahve and by no other,” and the verse is listed with the oaths sworn by God, beside Deuteronomy’s command. That command has two of this psalm’s verbs: “to him shalt thou cleave, and swear by his name” ([[Deut. 10:20]]). “Cleave” is the verb of verse 8.

      The last clause gives a reason where the King James has its second “but”; a modern translation has “for the mouths of liars will be stopped.”
    sources: [delitzsch-psalms, lxx-rahlfs, bdb, oshb-wlc, nrsvue]

christ: |
  What this psalm says of God is said in verses 3 and 5–8: His lovingkindness is better than life, remembering Him satisfies the soul, and His right hand upholds.

  The thirst of verse 1 is for God Himself. The Church’s edition links it to [[Ps. 42:2]], whose own footnotes lead to the Savior’s words to the thirsty ([[John 4:14]]; [[John 7:37]]); the chapter on Psalm 42 quotes them.

explore: |
  - **The road into the wilderness.** [[2 Sam. 15:13–30]] and [[2 Sam. 16:1–14]] tell the flight in which this chapter reads the psalm.
  - **Seeing God in His house.** [[Ps. 27:4]] and [[Ps. 84:1–2]]. The essay “Seeing God in His Temple: A Significant Theme in Israel’s Psalms,” in the sources below, gathers the psalms on this theme and treats this one among them.

parallels:
  - ref: 2 Sam. 15:23–28
    note: David leaves Jerusalem by the way of the wilderness; the setting in which this chapter reads the psalm.
  - ref: 2 Sam. 16:14
    note: The king and his people come weary to their resting place; one older reading finds there the weariness of verse 1.
  - ref: Ps. 42:1–2
    note: Another psalm of thirst for God, far from His house.
  - ref: Isa. 26:9
    note: The same verb for seeking God early, beside desire in the night.
  - ref: Deut. 10:20
    note: The command to cleave to the LORD and swear by His name, the verbs of verses 8 and 11.
  - ref: Ps. 61:4–7
    note: The covert of God’s wings and a prayer for the king, in a psalm that stands two before this one.

