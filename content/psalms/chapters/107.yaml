chapter: 107
title: Let the Redeemed of the LORD Say So
tagline: A people gathered home is told to give thanks, hears four rescues told in one pattern, and is left with a sentence for the wise.
when: 'Undated and untitled; it gives thanks for a people gathered “out of the lands,” and has been read of the return from exile'

setting: |
  The psalm has no title and names no author, country or king. It is the first psalm of the fifth and last book of the Psalter, and it takes up the last request of the fourth. Before the line of praise that closes that book, Psalm 106 prays: “gather us from among the heathen, to give thanks unto thy holy name” ([[Ps. 106:47]]). This psalm opens by giving thanks, and its singers are those the LORD has “gathered … out of the lands.” The join has long been noticed: the thanks given here are for what was asked there.

  Psalms 105, 106 and 107 have also been read as a set of three, the first on the LORD’s deeds for Israel, the second on Israel’s sins, and this one on the thanks owed by those He brought back. On that reading the opening call “is addressed to the returned exiles,” at a time when the release of the captives in Babylon had drawn scattered Israelites home from other countries as well. The Church’s heading reads the psalm of Israel “gathered and redeemed.”

  Other scripture has the psalm’s words. Zacharias describes the Savior’s work in the language of verse 10 ([[Luke 1:79]]), the Gospels tell of a storm stilled as in verse 29, and Ammon’s song of thanks in Alma 26 has been heard as borrowing from Psalms 106 and 107.

thread: |
  Psalm 107 is **one sentence of thanks, shown to be true four times and then stated as a rule**. Verse 1 gives the sentence: the LORD is good, and His mercy lasts for ever. Verses 2–3 say who is to speak it, the people He has redeemed and gathered.

  Four pictures follow, and each is told in the same order. People are in trouble: lost in the desert, chained in the dark, sick to the point of death, caught in a storm at sea. Each picture turns on the same line, “Then they cried unto the LORD in their trouble,” and the rescue comes in the second half of that verse. Each ends with the same wish: “Oh that men would praise the LORD for his goodness.” The “goodness” of that line is the “mercy” of verse 1 under another English word, so every picture ends by asking for the thanks the psalm began with.

  At verse 33 the refrains stop and the subject changes from the rescued to the Rescuer. He turns rivers to desert and desert to springs; He brings princes down and sets the poor on high. The four stories were instances, and these verses give the pattern they belong to.

  The last verse speaks to the reader. Whoever is wise will watch for “these things” and will understand “the lovingkindness of the LORD,” which is the mercy of verse 1 once more.

sections:
  - range: 1-3
    heading: Let the redeemed say so
    plain: |
      Give thanks to the LORD, for He is good; His mercy lasts for ever. Let those the LORD has redeemed say it, those He redeemed from the enemy’s hand and gathered out of the lands, from the east and the west, from the north and the south.
  - range: 4-9
    heading: Lost in the wilderness
    plain: |
      They wandered in the wilderness on a lonely road and found no city to live in. They were hungry and thirsty, and their life was failing. Then they cried to the LORD in their trouble, and He delivered them from their distress. He led them by a straight road to a city where they could live. Oh, that people would thank the LORD for His goodness and for the wonders He does for the children of men! He satisfies the longing soul and fills the hungry soul with good.
  - range: 10-16
    heading: Bound in darkness
    plain: |
      Some sat in darkness and the shadow of death, bound in misery and iron, because they had rebelled against the words of God and despised the counsel of the Most High. So He bowed their hearts with hard labour; they fell, and no one helped. Then they cried to the LORD in their trouble, and He saved them from their distress. He brought them out of darkness and the shadow of death and broke their bonds. Oh, that people would thank the LORD for His goodness and for the wonders He does for the children of men! He has broken the gates of brass and cut the iron bars in two.
  - range: 17-22
    heading: Sick to the gates of death
    plain: |
      Fools suffered for their transgression and their iniquities. They could not bear any food, and they came near the gates of death. Then they cried to the LORD in their trouble, and He saved them from their distress. He sent His word and healed them and delivered them from destruction. Oh, that people would thank the LORD for His goodness and for the wonders He does for the children of men! Let them offer sacrifices of thanksgiving and tell what He has done with rejoicing.
  - range: 23-32
    heading: The storm at sea
    plain: |
      Those who go down to the sea in ships and do their business on great waters see the works of the LORD and His wonders in the deep. He commands, and a stormy wind rises and lifts the waves. They go up to the sky and down to the depths; their courage melts. They reel and stagger like a drunken man and are at their wits’ end. Then they cry to the LORD in their trouble, and He brings them out of their distress. He makes the storm a calm, and the waves are still. They are glad of the quiet, and He brings them to the haven they wanted. Oh, that people would thank the LORD for His goodness and for the wonders He does for the children of men! Let them exalt Him in the congregation of the people and praise Him in the assembly of the elders.
  - range: 33-42
    heading: Rivers to desert, desert to springs
    plain: |
      He turns rivers into a wilderness and springs into dry ground, a fruitful land into barrenness, for the wickedness of those who live there. He turns the wilderness into standing water and dry ground into springs. There He settles the hungry, and they build a city to live in, sow fields, plant vineyards and gather a harvest. He blesses them, and they multiply greatly, and He does not let their cattle grow few. When they are diminished and brought low by oppression, affliction and sorrow, He pours contempt on princes and makes them wander in a pathless waste, but He sets the poor on high, out of affliction, and makes his families like a flock. The righteous see it and rejoice, and all iniquity shuts its mouth.
  - range: 43-43
    heading: Whoso is wise
    plain: |
      Whoever is wise will watch for these things, and they will understand the lovingkindness of the LORD.

notes:
  - ref: 2
    phrase: Let the redeemed of the LORD say so
    kind: scripture
    title: What the redeemed are to say, and who promised they would
    body: |
      “So” is verse 1, and Jeremiah had promised that a people brought back from captivity would say it. He foretold that there would be heard again “the voice of them that shall say, Praise the LORD of hosts: for the LORD is good; for his mercy endureth for ever: and of them that shall bring the sacrifice of praise into the house of the LORD,” and he gave the reason: “For I will cause to return the captivity of the land” ([[Jer. 33:11]]; see the note there).

      The psalm asks for both things Jeremiah names. Verse 1 is the sentence, and verse 22 asks for the offering: “let them sacrifice the sacrifices of thanksgiving.” When the foundation of the second temple was laid, “they that were come out of the captivity” ([[Ezra 3:8]]) sang the sentence, “because he is good, for his mercy endureth for ever toward Israel” ([[Ezra 3:11]]).

      Isaiah has the same name for Zion’s people. They will be called “The holy people, The redeemed of the LORD” ([[Isa. 62:12]]).
    sources: [lds-scriptures]

  - ref: 3
    phrase: and from the south
    kind: words
    title: The Hebrew says “from the sea”
    body: |
      Where the King James Version has “from the south,” the Hebrew word is *yam*, the sea, and translators supply the fourth direction. It is the ordinary word for the sea. Because the Mediterranean lies to the west of the land, it is also the usual word for “west,” and “rarely” for the south. West has already been named in the verse, so one proposal is to “read perhaps” a similar word, “from the south,” and a modern translation prints “south” with the note “Heb sea.”

      Either way the verse names every quarter. That is how Isaiah speaks of the gathering, “I will bring thy seed from the east, and gather thee from the west” ([[Isa. 43:5]]; the note on [[Isa. 43:6]] follows it into the latter days), and how Nephi speaks of it: “he gathereth his children from the four quarters of the earth” ([[1 Ne. 22:25]]).
    sources: [biblehub-interlinear, bdb, nrsvue, lds-scriptures]

  - ref: 6
    phrase: Then they cried unto the LORD in their trouble
    kind: structure
    title: Four rescues told in one pattern
    body: |
      The psalm tells four stories in the same order, and two repeated lines mark where each one turns and what each one is for. People are in trouble. They cry to the LORD, and in the same verse He delivers them: this is the first refrain (verses 6, 13, 19, 28). Then comes the second (verses 8, 15, 21, 31), a wish that they would thank Him, and after it a line fitted to the story just told. The hungry are filled (verse 9). The gates and bars are broken (verse 16). The last two say how the thanks are to be given: with “the sacrifices of thanksgiving” (verse 22), and “in the congregation of the people” (verse 32).

      The four did not come to their trouble in the same way. The prisoners “rebelled against the words of God,” and the sick suffer “because of their transgression.” No fault is named in the wanderers or the sailors, and it is the LORD who “raiseth the stormy wind.” The cry is answered in all four alike.

      Whether these are four kinds of people or four pictures of one captivity is not settled by the psalm. One older reading takes them as examples, “not so much allegorical, personifying the Exile, as rather exemplificative”: a people who had “seen destruction in every form in a strange land” had every one of these stories to tell.
    sources: [delitzsch-psalms]

  - ref: 10
    phrase: Such as sit in darkness and in the shadow of death
    kind: scripture
    title: Prisoners in darkness, in Isaiah, Luke and Alma
    body: |
      The second picture is of prisoners in the dark, and other scripture uses its words for the people the Savior comes to free. (“The shadow of death” is explained at [[Ps. 23:4]].)

      Isaiah’s servant is sent to bring out “them that sit in darkness out of the prison house” ([[Isa. 42:7]]; see the note there). Zacharias, at the birth of John, says what the coming day will do in the psalm’s own phrase: “To give light to them that sit in darkness and in the shadow of death” ([[Luke 1:79]]).

      Alma’s sermon at Zarahemla has been set beside verses 10–14. He says of his fathers that “they were encircled about by the bands of death, and the chains of hell” ([[Alma 5:7]]), and that the bands were loosed. The psalm’s verses are “quite similar to what Alma was teaching,” and in both, deliverance comes to “the afflicted calling upon or crying unto the Lord.” Alma’s two phrases have been read as two deliverances: from physical death, and from the spiritual death “that otherwise results from sin during this mortal life.”
    sources: [lds-scriptures, sc-knowhy-111]

  - ref: 20
    phrase: He sent his word, and healed them
    kind: symbol
    title: Healed by a word that is sent
    body: |
      The sick of the third picture are healed by nothing but a word from God, and the psalm speaks of that word as something sent. They are called “fools,” which here is a moral word, “not confined to the idea of defective intellect merely”: their sickness comes “because of their iniquities.” They are at “the gates of death.” No remedy is named. The LORD sends His word, and they are well.

      One older reading makes much of the verb: the word goes out as God’s messenger, and it “appears here as a mediator of the divine healing.” The psalm itself says only that the word was sent and the sick were healed.
    sources: [delitzsch-psalms]

  - ref: 29
    phrase: He maketh the storm a calm
    kind: christ
    title: Who it is that stills the sea
    body: |
      In the psalm it is the LORD who raises the storm and the LORD who stills it, and that is what makes the scene on the Sea of Galilee a question about who Jesus is. The sailors of verses 23–30 can do nothing. They “cry unto the LORD,” and “He maketh the storm a calm.”

      The disciples in the boat woke Jesus. He “said unto the sea, Peace, be still” ([[Mark 4:39]]), and they asked one another, “What manner of man is this, that even the wind and the sea obey him?” ([[Mark 4:41]]). The question has been answered from this psalm. Jesus “does what is proper only to Jehovah,” and so “The answer to the disciples’ question is found in the Psalms”: “It is Jehovah who made the natural world. It is He who controls it. It is He who is in the boat.”

      The Gospels do not quote the psalm; the answer is a reading of the two scenes together.
    sources: [keller-jesus-jehovah, lds-scriptures]

  - ref: 33
    phrase: He turneth rivers into a wilderness
    kind: structure
    title: After verse 32 the refrains stop
    body: |
      From verse 33 the psalm stops telling rescues and describes the One who does them, and it describes Him as working in both directions. He makes watered land a desert “for the wickedness of them that dwell therein,” and He makes desert a place of springs. He lets people be “minished and brought low,” pours contempt on princes, and sets the poor on high.

      Much of this is said in words found elsewhere in scripture. Verse 35 is nearly the LORD’s promise in Isaiah, “I will make the wilderness a pool of water, and the dry land springs of water” ([[Isa. 41:18]]). Verse 40 joins two lines of Job’s speech about what God does with the great: “He poureth contempt upon princes” ([[Job 12:21]]), and “causeth them to wander in a wilderness where there is no way” ([[Job 12:24]]).
    sources: [lds-scriptures]

  - ref: 43
    phrase: the lovingkindness of the LORD
    kind: words
    title: Lovingkindness is the mercy of verse 1
    body: |
      The psalm ends on the word it began with: “lovingkindness” here, “mercy” in verse 1 and “goodness” in the refrain are one Hebrew word, *hesed*, the covenant love explained at [[Ps. 51:1]]. A modern translation uses one phrase for all three, “his steadfast love endures forever” in verse 1, “for his steadfast love” in the refrain, and “consider the steadfast love” here.

      The verb is shared as well. “Praise” in the refrain is the “give thanks” of verse 1, and the same translation has “Let them thank.” So each of the four stories ends by asking for verse 1 over again, which is what verse 2 told the redeemed to say.

      The last verse then asks for something besides thanks. The wise are to “observe these things” and to understand from them the LORD’s love. Hosea closes his book with nearly the same sentence (see the note on [[Hos. 14:9]]).
    sources: [oshb-wlc, biblehub-interlinear, nrsvue]

christ: |
  The psalm calls its singers “the redeemed of the LORD,” and the LORD who redeems is Jesus Christ, who was Jehovah before His birth (see the note on [[Ps. 110:1]]) and is the Redeemer because He “paid the price for the sins of mankind.”

  Zacharias speaks of His coming in the psalm’s terms. He blesses “the Lord God of Israel; for he hath visited and redeemed his people” ([[Luke 1:68]]), and he ends with light for those who sit in darkness (see the note on [[Ps. 107:10]]).

  In the Gospels Jesus stills a storm with a word, as the LORD does here, and that has been read as showing who He is (see the note on [[Ps. 107:29]]).

explore: |
  - **The prayer this psalm answers.** [[Ps. 106:47]], and before it [[Ps. 105]] and [[Ps. 106]], the history of the people who are here brought home.
  - **The promise of the thanksgiving.** [[Jer. 33:10–11]], with [[Ezra 3:10–11]], where it is sung.
  - **Gathered from every quarter.** [[Isa. 43:5–6]] and [[Isa. 49:12]], with [[1 Ne. 22:25]].
  - **Prisoners brought out.** [[Isa. 42:7]], [[Luke 1:68–79]] and [[Alma 5:6–10]].
  - **The storm.** [[Mark 4:35–41]], read beside verses 23–30.
  - **The same closing sentence.** [[Hos. 14:9]].

parallels:
  - ref: Ps. 106:47
    note: The prayer “gather us from among the heathen, to give thanks,” which this psalm opens by answering.
  - ref: Jer. 33:11
    note: The returned captives will say that the LORD is good and His mercy endures, and will bring the sacrifice of praise.
  - ref: Isa. 62:12
    note: Zion’s people are named “The redeemed of the LORD.”
  - ref: Luke 1:79
    note: Zacharias uses the words of verse 10 for the light the Savior brings.
  - ref: Mark 4:39–41
    note: Jesus stills the sea, and the disciples ask what manner of man He is.
  - ref: Job 12:21, 24
    note: The two lines joined in verse 40.
  - ref: Isa. 41:18
    note: The wilderness made a pool of water, as in verse 35.
  - ref: Alma 5:7–9
    note: Alma’s fathers in darkness, their bands loosed, set beside verses 10–14.
  - ref: Hosea 14:9
    note: A book closed with nearly the sentence of verse 43.

