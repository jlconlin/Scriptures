chapter: 25
title: Teach Me Thy Paths
tagline: A man with enemies around him and old sins behind him asks to be taught the LORD’s way, to be remembered by mercy and not by his record, and, in a last line, for Israel to be redeemed.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  Psalm 25 stands in Book One of the Psalms, directly after the psalm that asks who shall ascend the hill of the LORD ([[Ps. 24:3]]). Its title ascribes it to David and names no occasion, and the poem itself is “without any definite background indicating the history of the times in which it was composed.”

  It has been classed as the lament of one person (for the shape of a lament, see the note on [[Ps. 22:1]]). Three things are woven through it: “trust in and longing for God’s response,” and with it “guilt over past sin (vv. 7, 11, 18), the enemy threat (vv. 2, 15, 19).” The enemies are never described and the sins are never named.

  In Hebrew the psalm is an acrostic: its verses begin with the letters of the alphabet in order, the device explained at [[Ps. 9:1]]. Here the alphabet is “handled very freely and not fully carried out,” and a verse is added after the last letter; the note on verse 22 takes that up. Psalm 34 is built the same way, and has been called this psalm’s “companion.”

  Psalms 25–31 share a good deal of language with Nephi’s psalm ([[2 Ne. 4:16–35]]); see the note on verse 17.

thread: |
  Psalm 25 is a **prayer to be taught**. What the speaker asks for first is not rescue but direction: “Shew me thy ways, O LORD; teach me thy paths. Lead me in thy truth, and teach me” (verses 4–5). “Way” and “paths” return in verses 8, 9, 10 and 12, and “teach” in verses 8, 9 and 12.

  The psalm moves by changing whom it addresses. Verses 1–7 speak to the LORD. Verses 8–10 turn and speak about Him: because He is “good and upright,” He will “teach sinners in the way.” The ones He teaches are sinners (verse 8), the meek (verse 9), and the man who fears Him (verse 12). Between the teaching of verses 8–10 and that of verse 12 stands one line of prayer, verse 11, the plainest confession in the psalm. Verses 15–21 are prayer again, and more urgent: the net, the loneliness, the enemies, and once more the sins.

  There is no moment of rescue and no vow of praise. The psalm ends nearly where it began. “Let me not be ashamed” in verse 2 comes back in verse 20, in the same Hebrew verb, and so does “wait” (verses 3, 5, 21), the verb of [[Isa. 40:31]], which means to “wait, or look eagerly, for.” What the speaker has at the end is what he had at the start: “I wait on thee.” Then the last verse asks for all Israel what he has asked for himself.

sections:
  - range: 1-3
    heading: Let me not be ashamed
    plain: |
      To You, O LORD, I lift up my soul. My God, I trust in You; do not let me be put to shame, and do not let my enemies gloat over me. Let no one who waits for You be put to shame; let shame fall on those who deal treacherously for no reason.
  - range: 4-7
    heading: Teach me, and remember me
    plain: |
      Make Your ways known to me, O LORD; teach me Your paths. Lead me in Your truth and teach me, for You are the God who saves me; I wait for You all day long. Remember, O LORD, Your tender mercies and Your lovingkindnesses, for they are from of old. Do not remember the sins of my youth or my transgressions; remember me according to Your mercy, for the sake of Your goodness, O LORD.
  - range: 8-11
    heading: The paths of the LORD
    plain: |
      The LORD is good and upright, and so He teaches sinners the way. He leads the meek in what is right and teaches the meek His way. All the paths of the LORD are mercy and truth to those who keep His covenant and His testimonies. For Your name’s sake, O LORD, pardon my iniquity, for it is great.
  - range: 12-14
    heading: The man who fears the LORD
    plain: |
      Who is the man who fears the LORD? The LORD will teach him the way he should choose. His soul will dwell at ease, and his descendants will inherit the earth. The LORD confides in those who fear Him, and He makes His covenant known to them.
  - range: 15-21
    heading: Out of the net
    plain: |
      My eyes are always on the LORD, for He will pull my feet out of the net. Turn to me and have mercy on me, for I am alone and afflicted. The troubles of my heart have grown large; bring me out of my distresses. Look at my affliction and my pain, and forgive all my sins. Look at my enemies, how many they are, and how cruelly they hate me. Keep my soul and deliver me; do not let me be put to shame, for I put my trust in You. Let integrity and uprightness preserve me, for I wait for You.
  - range: 22-22
    heading: Redeem Israel
    plain: |
      Redeem Israel, O God, out of all his troubles.

notes:
  - ref: 7
    phrase: Remember not the sins of my youth
    kind: words
    title: Three rememberings
    body: |
      The same Hebrew verb, “remember,” stands three times in verses 6–7, and the three uses make up one request. Remember Your mercies (verse 6). Do not remember my sins (verse 7). Remember me, and let Your mercy be the measure: “according to thy mercy remember thou me.” He does not ask to be forgotten; he asks to be remembered by mercy.

      The word behind “lovingkindnesses” in verse 6 and “mercy” in verse 7 is *hesed*, which a modern translation renders “steadfast love” in both places. It comes a third time in verse 10, where all the LORD’s paths are “mercy and truth.” The word is explained at [[Ps. 51:1]].
    sources: [oshb-wlc, nrsvue]

  - ref: 11
    phrase: pardon mine iniquity; for it is great
    kind: words
    title: The greatness of the sin as the reason
    body: |
      The speaker gives the size of his sin as his reason for asking, and the LORD’s name as his reason for hoping. On one reading the “for” of “for it is great” “gives the ground of the need and urgency of the petition.” A modern translation keeps the plain force: “pardon my guilt, for it is great.”

      The ground of the hope is in the first words, “For thy name’s sake.” The verse before has just said what the LORD’s paths are, “mercy and truth,” and on the same reading the name is “His nature that has become manifest in His mercy and truth,” which “permits him to ask and to hope for forgiveness, not for the sake of anything whatever that he has done, but just for the sake of this name.” The same reading sets Jeremiah’s prayer for his people beside the verse: “do thou it for thy name’s sake” ([[Jer. 14:7]]). On the phrase itself, see the note on [[Ps. 23:3]].
    sources: [delitzsch-psalms, nrsvue]

  - ref: 13
    phrase: his seed shall inherit the earth
    kind: scripture
    title: The meek, and the earth their children inherit
    body: |
      The promise of the third Beatitude appears here in the Psalms, made to the children of the man who fears the LORD. Where the King James Version has “inherit the earth,” a modern translation has “their children shall possess the land.”

      Four verses earlier the psalm has named the ones the LORD teaches: “the meek,” twice in verse 9. The Hebrew word names the “poor, afflicted, humble, meek,” and in the Psalms especially the “poor, weak and afflicted” of Israel. Psalm 37 has the meek and this inheritance in one line, in the same Hebrew words: “the meek shall inherit the earth” ([[Ps. 37:11]]).

      That line is the one the Savior took up. “There is no mistaking the direct influence of and foundation laid by Psalm 37:11” for “Blessed are the meek: for they shall inherit the earth” ([[Matt. 5:5]]). In latter-day revelation “the poor and the meek of the earth shall inherit it” ([[D&C 88:17]]), which has been read to mean that the meek “are those who shall obtain the celestial kingdom.”
    sources: [oshb-wlc, bdb, nrsvue, skinner-beatitudes, lds-scriptures]

  - ref: 14
    phrase: The secret of the LORD
    kind: words
    title: The LORD’s confidence
    body: |
      The “secret” of the LORD is His confidence, the talk He keeps for those close to Him. The Hebrew word, *sod*, means first a “council, in familiar conversation,” a “circle of familiar friends,” and then what is said in such a circle. In this verse it is “familiar converse with God, intimacy.” A modern translation has “The friendship of the Lord is for those who fear him.”

      The second half of the verse says what He confides. In Hebrew verse the second line answers the first ([[Ps. 1:1]]), and here “his covenant” stands opposite “the secret.” Those who fear Him are shown the covenant.

      The word is the one the prophets use. Amos says the Lord “revealeth his secret unto his servants the prophets” ([[Amos 3:7]]), and there the word is “secret counsel, which may be revealed.” Jeremiah asks who “hath stood in the counsel of the LORD” ([[Jer. 23:18]]), the same word again. Here it is “with them that fear him.”
    sources: [oshb-wlc, bdb, nrsvue]

  - ref: 16
    phrase: desolate and afflicted
    kind: words
    title: Alone and poor
    body: |
      “Desolate” here means alone. The Hebrew word means “only, only one, solitary”; it is the word for an only child, used of Isaac, “thine only son” ([[Gen. 22:2]]), and the old Greek translation of this verse has “an only child and poor.” A modern translation has “lonely and afflicted.”

      The word behind “afflicted” is perhaps only another form of the word for “the meek” in verse 9. For the first Beatitude ([[Matt. 5:3]]), this verse is listed with those that “reflect the kind of poor people that Jesus was referring to.”
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs, skinner-beatitudes]

  - ref: 17
    phrase: The troubles of my heart are enlarged
    kind: scripture
    title: Nephi’s psalm beside this one
    body: |
      Nephi’s psalm has the three subjects of Psalm 25, sin, enemies and trust, and some of its phrases. Following his father’s death Nephi wrote, “my soul grieveth because of mine iniquities” ([[2 Ne. 4:17]]), and verses 7, 11 and 17–18 of this psalm have been set beside his grief as lines that “sound similar in tone.” He speaks of “mine afflictions,” and this psalm “uses a similar phrase twice.” He asks, “Wilt thou deliver me out of the hands of mine enemies?” ([[2 Ne. 4:31]]), and verses 2 and 19 of this psalm are listed as “similar references.” “My heart,” the phrase of this verse, comes nine times in his psalm.

      How much the likenesses show is uncertain: “We cannot determine with certainty the specific influences that affected Nephi as he drafted his psalm.” The proposal is that Nephi “may have turned to the brass plates for consolation,” and that Psalms 25–31 “may have had a particular influence” on him.
    sources: [alford-baker-psalm-nephi]

  - ref: 22
    phrase: Redeem Israel, O God
    kind: structure
    title: The verse after the alphabet
    body: |
      The last verse stands outside the acrostic, and it turns from the speaker to Israel. Verse 21 begins with the last letter of the Hebrew alphabet. Verse 22 then begins with a letter already used, at verse 16.

      The alphabet is loose elsewhere too. No verse begins with the sixth letter, and verses 18 and 19 both begin with the same word, “Look,” so that one letter is doubled where another is missing. Psalm 34 leaves out the same letter and adds a last verse beginning with the same letter and the same verb: “The LORD redeemeth the soul of his servants” ([[Ps. 34:22]]).

      Why the verse is there is less certain. On one older reading “it looks as though it was only added when Psalm 25 came to be used in public worship,” and the reading points to the change in the name of God: this verse says “O God” where the psalm has said “O LORD.” The same reading gives the thought that joins it to the rest, that “the need of the individual will not cease until the need of the whole” is met. The verse does take up the speaker’s own word: he asked to be brought out of “the troubles of my heart” (verse 17), and he asks that Israel be redeemed “out of all his troubles.”
    sources: [oshb-wlc, delitzsch-psalms]

christ: |
  The psalm says of the LORD that He teaches sinners the way (verse 8), and it asks Him to remember by mercy (verse 7), to pardon for His name’s sake (verse 11), and to redeem Israel (verse 22). The LORD to whom it is prayed is Jehovah, and “Jehovah is the premortal Jesus Christ.”

explore: |
  - **The companion psalm.** [[Ps. 34]], the other acrostic built this way, on the fear of the LORD and ending with the same verb.
  - **The meek and the land.** [[Ps. 37:1–11]], read with verses 9 and 13 of this psalm and [[Matt. 5:5]].
  - **Nephi’s psalm.** [[2 Ne. 4:16–35]], read beside verses 2, 7, 11 and 16–20. Kenneth L. Alford and D. Bryce Baker, “Parallels between Psalms 25–31 and the Psalm of Nephi,” in *Ascending the Mountain of the Lord* (2013), which lays the seven psalms beside Nephi’s phrase by phrase.

parallels:
  - ref: 2 Ne. 4:17–19
    note: Nephi grieves over his iniquities in words that have been set beside verses 7, 11 and 17–18.
  - ref: Ps. 34:22
    note: The companion acrostic also ends with a verse outside the alphabet, on the LORD who “redeemeth.”
  - ref: Ps. 37:11
    note: The meek of verse 9 and the inheritance of verse 13 in one line, which the Savior took up in Matt. 5:5.
  - ref: Jer. 14:7
    note: Jeremiah asks the LORD to act for His name’s sake, the ground of the plea in verse 11.

sources: [lds-scriptures, gs-jehovah, oshb-wlc, bdb, lxx-rahlfs, nrsvue, delitzsch-psalms, skinner-beatitudes, alford-baker-psalm-nephi]
