chapter: 90
title: From Everlasting to Everlasting
tagline: A people dying under judgment set their few years beside God’s eternity, and then ask Him to turn back, to gladden the days that are left, and to make the work of their hands last.
when: 'By its title, a prayer of Moses; the psalm names no occasion'

setting: |
  Psalm 90 opens the fourth of the Psalter’s five books (Psalms 90–106), a book that “begins with Moses’s prayer for the Lord to have mercy on straying Israel.” Book Three ended in grief over the king’s throne, with the questions “How long, LORD? wilt thou hide thyself for ever?” ([[Ps. 89:46]]) and “Remember how short my time is” ([[Ps. 89:47]]). Psalm 90 asks “how long” again and pleads the shortness of life as that psalm did.

  The speaker is “we” from the first line to the last: this is the prayer of a people. In the setting its title gives, the people are Israel in the wilderness, after the generation that left Egypt had been sentenced to die there over forty years ([[Num. 14:28–35]]). On that reading it is a prayer “out of the midst of the dying off of the older generation.” Whether Moses wrote it is taken up in the note on the title.

  Two of its images stand elsewhere in scripture. Peter, writing of the Lord’s coming, says that with the Lord a thousand years are “as one day” ([[2 Pet. 3:8]]), and Isaiah draws the picture of verses 5–6: “All flesh is grass” ([[Isa. 40:6]]).

thread: |
  The psalm is built of time words: generations, a thousand years, yesterday, a watch in the night, morning, evening, days, years, seventy, eighty. **It measures human life against God’s, and then asks God to fill what is left of it.** Everything before verse 12 leads up to the requests that begin there, which are the psalm’s purpose.

  It begins with God. He has been His people’s home in every generation, and He was God before the mountains were born (verses 1–2). Then it turns to man, whom God sends back to dust with a word. A thousand years are to Him a day already gone; human beings are grass that is green in the morning and withered by evening (verses 3–6).

  Verses 7–11 say why this people feels it so sharply. They are dying under God’s anger, with their sins set in the light of His face, and their years end “as a tale that is told.” The psalm confesses the sin and says how short life is.

  The turn comes with the first request, in verse 12: teach us to number our days. More follow in verses 13–17, and they take up the psalm’s own words. God told man to “Return”; now the people say, “Return, O LORD,” and here, for the only time in the Hebrew text of the psalm, they call Him by His name (see the note on verse 17). The grass had its morning; they ask for mercy in the morning (“early”) and gladness “all our days.” The last request is said twice. A people who are like grass ask that the work of their hands be established.

sections:
  - range: 1-2
    heading: God before the mountains
    plain: |
      Lord, You have been our home in every generation. Before the mountains were born, before You brought forth the earth and the world, from everlasting to everlasting You are God.
  - range: 3-6
    heading: Man sent back to dust
    plain: |
      You turn man back to dust and say, “Return, children of men.” For a thousand years in Your sight are like yesterday once it has passed, like a watch in the night. You sweep them away; they are like sleep. In the morning they are like grass that springs up. In the morning it flowers and grows; by evening it fades and withers.
  - range: 7-12
    heading: Our days under Your anger
    plain: |
      For we are consumed by Your anger and dismayed by Your wrath. You have set our iniquities before You, our hidden sins in the light of Your face. All our days pass away under Your wrath; we finish our years like a sigh. Our years come to seventy, or eighty if we are strong, and the pride of them is toil and trouble, for it is soon gone and we fly away. Who knows the power of Your anger? Your wrath is as great as the fear that is due to You. So teach us to count our days, that we may gain a heart of wisdom.
  - range: 13-17
    heading: Return, O LORD
    plain: |
      Turn back, LORD! How long? Have pity on Your servants. Satisfy us in the morning with Your mercy, that we may rejoice and be glad all our days. Make us glad for as many days as You have afflicted us, for as many years as we have seen trouble. Let Your work be seen by Your servants, and Your glory by their children. Let the favor of the Lord our God rest on us, and establish the work of our hands for us; yes, establish the work of our hands.

notes:
  - ref: 0
    phrase: A Prayer of Moses the man of God
    kind: history
    title: The one psalm with the name of Moses
    body: |
      Psalm 90 is the one psalm attributed to Moses, and its title gives him the name he bears at the head of his last blessing: “Moses the man of God” ([[Deut. 33:1]]; so also [[Josh. 14:6]]).

      The psalm shares more than a title with the end of Deuteronomy. The Song of Moses ([[Deut. 32:7]]) has the same Hebrew for “in all generations,” which is “in generation and generation.” The form of the word for “days” in verse 15 “occurs elsewhere only in Deuteronomy 32:7.” And “the work of our hands” is “a phrase characteristic of Deuteronomy, where it occurs seven times.” The notes on verses 1, 2 and 13 add three more.

      The likeness has been weighed two ways. One reading takes it as the mark of one author: the psalm “bears within itself distinct traces of the same origin as the song” and the blessing of Moses, and comes “out of the midst of the dying off of the older generation during the march through the wilderness.” Another holds that “the resemblances might be fully accounted for by the Psalmist’s familiarity with that book,” since the author “appears to look back upon a long period of national existence,” and assigns the psalm “probably to the time of the Exile.”

      The Church’s edition takes the title at its word: its chapter heading has Moses imploring the Lord for mercy and blessings on His people. This chapter reads the psalm in the setting the title gives. What a title is, and what it is worth as evidence, is discussed under the title of Psalm 3 ([[Ps. 3:1]]).
    sources: [lds-scriptures, ot-manual-psalms, cambridge-psalms, delitzsch-psalms]
  - ref: 1
    phrase: our dwelling place
    kind: words
    title: A home that is not a place
    body: |
      The word behind “dwelling place” means a home, and the psalm gives that name to God Himself: the word is used here of the LORD “as abode of his people.”

      The blessing of Moses says the same with a closely related word: “The eternal God is thy refuge, and underneath are the everlasting arms” ([[Deut. 33:27]]), where “refuge” is a word for “a dwelling-place.” The ancient Greek translators moved the other way and wrote “refuge” in the psalm, which a modern translation keeps in its margin. A home and a refuge are near enough for either English word to serve.

      In the setting the title gives, the line is said by people who had been told, “your children shall wander in the wilderness forty years” ([[Num. 14:33]]). The same word stands in the next psalm: “thy habitation” ([[Ps. 91:9]]).
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, lds-scriptures]
  - ref: 2
    phrase: Before the mountains were brought forth
    kind: symbol
    title: Creation as a birth
    body: |
      Both verbs in this line are verbs of childbirth. The mountains were “brought forth,” a form of the common verb to bear: they were born. And “formed” is a verb whose sense here is to “writhe in travail with, bear, bring forth,” a poetic use. The ancient Greek translation has a passive for the second, “before the earth and the world were formed.”

      The Song of Moses uses the same verb of God and Israel: “and hast forgotten God that formed thee” ([[Deut. 32:18]]).

      The psalm takes the oldest things it can name and sets God before their birth, and then reaches past any beginning at all: “from everlasting to everlasting.” Latter-day revelation has the same phrase: He is “from everlasting to everlasting the same unchangeable God” ([[D&C 20:17]]).
    sources: [bdb, lxx-rahlfs, lds-scriptures]
  - ref: 3
    phrase: Return, ye children of men
    kind: words
    title: One verb for man’s dying and for God’s command
    body: |
      “Turnest” and “Return” are the same Hebrew verb, and the psalm uses it a third time in verse 13, of God.

      The first half of the verse is, in the Hebrew, “returnest man to dust.” It “plainly refers to Genesis 3:19, though he chooses different words”: “for dust thou art, and unto dust shalt thou return” ([[Gen. 3:19]]), where “return” is this verb.

      The second half has been read two ways. “Return” may repeat the sentence: go back to the dust. Or it may be “a call to new generations to appear on the stage of history,” so that as one generation goes God summons the next. The echo of Genesis “is in favour of” the first, and that is probably the sense. On either reading it is God who speaks, and human life ends at His word.

      Then the verb comes back. In verse 13 the people who have been turned to dust say to God, “Return, O LORD.”

      [Dust and Glory](/psalms/themes/what-is-man/) sets this return to dust beside Psalm 8’s glory and Psalm 103’s Father who remembers that we are dust.
    sources: [oshb-wlc, lds-scriptures, bdb, cambridge-psalms]
  - ref: 4
    phrase: a thousand years in thy sight are but as yesterday
    kind: scripture
    title: A thousand years, in Peter and in Abraham
    body: |
      Later scripture takes the psalm’s comparison of a thousand years with a day in more than one direction. In the psalm the comparison gives the reason for verse 3 (“For”). It sets a thousand years beside two things, the second shorter than the first: “yesterday when it is past,” and “a watch in the night,” which was a third of a night, since Israel “divided the night into three watches.” Its thousand years are a day and also part of a night.

      Peter says it both ways: “one day is with the Lord as a thousand years, and a thousand years as one day” ([[2 Pet. 3:8]]). He is answering those who ask, “Where is the promise of his coming?” ([[2 Pet. 3:4]]), and he concludes that the Lord’s delay is patience ([[2 Pet. 3:9]]).

      Restoration scripture has the figure as a reckoning. The Lord showed Abraham that one revolution of Kolob “was a day unto the Lord, after his manner of reckoning, it being one thousand years according to the time appointed unto that whereon thou standest” ([[Abr. 3:4]]), and the Church’s edition points from that verse to this one and to Peter’s. Alma, speaking of the resurrection, says, “all is as one day with God, and time only is measured unto men” ([[Alma 40:8]]).
    sources: [lds-scriptures, bd-watches]
  - ref: 7
    phrase: we are consumed by thine anger
    kind: history
    title: The anger is the sentence of the wilderness
    body: |
      In the setting the title gives, the anger of verses 7–11 is one judgment in Israel’s history, the sentence on the generation that came out of Egypt. When they refused the land after the spies’ report, the Lord said, “Your carcases shall fall in this wilderness” ([[Num. 14:29]]), and set the term: “each day for a year, shall ye bear your iniquities, even forty years” ([[Num. 14:34]]). On that reading, “This it is over which Moses here laments,” and in verse 9 “we distinctly hear the Israel of the desert speaking.”

      The wording fits a particular case. “We” have been consumed: the psalmist “speaks of it not as a general truth but as an actual experience.” Verses 3–6 said that all people die. Verses 7–11 say that this people is dying under judgment, and verse 8 says why: “our iniquities,” “our secret sins.”

      The light in verse 8 is unusual. Elsewhere the light of God’s countenance is His favor; here “a slightly different word, lit. the luminary of Thy face, is used to denote His Presence as a searching light from which nothing can be hid.”
    sources: [lds-scriptures, delitzsch-psalms, cambridge-psalms]
  - ref: 9
    phrase: as a tale that is told
    kind: words
    title: A sigh, not a story
    body: |
      The Hebrew has no tale in it. The noun is “a sigh or moan, as transient,” a sound that is gone as it is made, and a modern translation has “our years come to an end like a sigh.”
    sources: [bdb, nrsvue]
  - ref: 10
    phrase: threescore years and ten
    kind: history
    title: Seventy years, in the prayer of a man who lived to a hundred and twenty
    body: |
      The verse gives the ordinary length of a life, and it does not fit Moses himself, who “was an hundred and twenty years old when he died: his eye was not dim, nor his natural force abated” ([[Deut. 34:7]]). The difference has been used to argue that he did not write the psalm, but the argument is not decisive, since “the longer lives of Moses and other leaders may have been exceptional.”

      The verse counts the years to say that a lifetime “is but short at best.” Where the King James has “their strength,” the Hebrew word is “pride,” and the line can be rendered “their pride is but travail and misery.”
    sources: [lds-scriptures, cambridge-psalms, nrsvue]
  - ref: 12
    phrase: that we may apply our hearts unto wisdom
    kind: words
    title: Gaining a heart of wisdom
    body: |
      The psalm’s first request is for understanding. It does not yet ask for relief. The Hebrew clause is “that we may gain a heart of wisdom,” and a modern translation has “that we may gain a wise heart.” Wisdom is what the counting of days is meant to yield.

      Only after this request does the psalm ask for anything to change (verse 13). For another prayer to know how short life is, see the note on [[Ps. 39:4]].
    sources: [bdb, nrsvue]
  - ref: 13
    phrase: let it repent thee concerning thy servants
    kind: scripture
    title: The prayer of Moses at Sinai, prayed again
    body: |
      “Return” and “let it repent thee” are the words Moses used at Sinai. After the golden calf he prayed, “Turn from thy fierce wrath, and repent of this evil against thy people” ([[Ex. 32:12]]), and the psalm has those two verbs.

      The verb does not mean repentance from sin. Its sense here is to “be sorry, moved to pity, have compassion,” and the people are asking for pity. The Joseph Smith Translation of the Sinai account puts the repenting on the people’s side. There the Lord answers Moses, “If they will repent of the evil which they have done, I will spare them, and turn away my fierce wrath.”

      The Song of Moses promises what the psalm asks, with the same verb and the same name for the people: “For the LORD shall judge his people, and repent himself for his servants” ([[Deut. 32:36]]).

      “How long?” is the question of many laments; see the note on [[Ps. 13:1]].
    sources: [oshb-wlc, bdb, jst-ex-32, lds-scriptures]
  - ref: 14
    phrase: O satisfy us early with thy mercy
    kind: symbol
    title: Early means in the morning
    body: |
      “Early” is the Hebrew for “in the morning,” the same words that stand twice in verses 5–6, and a modern translation has “Satisfy us in the morning with your steadfast love.”

      The psalm’s two mornings are different. The grass flourishes in the morning and is withered by evening. The people ask for a morning whose gladness lasts “all our days.” The next verse measures that gladness by the same count as the affliction, days for days and years for years.

      “Mercy” is *hesed*, the word explained at [[Ps. 51:1]].
    sources: [oshb-wlc, nrsvue]
  - ref: 16
    phrase: Let thy work appear unto thy servants
    kind: scripture
    title: God’s work before the work of our hands
    body: |
      The people ask to see God’s work before they ask anything for their own. The Hebrew has two different words where the King James has “work” in verses 16 and 17. The first is used of what God does, and the second is “the work of our hands.”

      The Church’s edition sets beside “work” the words the Lord spoke to Moses: “For behold, this is my work and my glory—to bring to pass the immortality and eternal life of man” ([[Moses 1:39]]). The psalm asks for the same pair, “thy work” and “thy glory.”
    sources: [oshb-wlc, lds-scriptures]
  - ref: 17
    phrase: the beauty of the LORD our God
    kind: words
    title: Beauty here is favor
    body: |
      “Beauty” translates a word for delightfulness or pleasantness, which in this verse is “shewn in his favour”; a modern translation has “Let the favor of the Lord our God be upon us.” It is the word of David’s one desire, “to behold the beauty of the LORD” ([[Ps. 27:4]]), where it is “contemplated in temple.” There the worshipper looks at it. Here the people ask that it rest on them.

      The Hebrew text read here has the title “Lord” in this verse, where the King James prints “LORD.” In that text the divine name stands once in the psalm, at verse 13.
    sources: [bdb, nrsvue, lds-scriptures, oshb-wlc]

christ: |
  The LORD whom the people call by name in verse 13 is Jehovah. Beside verse 2 the Church’s edition sets the opening of a revelation in which “the Lord your God, even Jesus Christ” calls Himself “the same which looked upon the wide expanse of eternity, and all the seraphic hosts of heaven, before the world was made” ([[D&C 38:1]]).

  Peter brings the thousand years that are as a day to the question of the Lord’s coming, and concludes, “The Lord is not slack concerning his promise, as some men count slackness; but is longsuffering to us-ward, not willing that any should perish, but that all should come to repentance” ([[2 Pet. 3:9]]).

explore: |
  - **Moses’s last words beside his psalm.** Read the Song and the Blessing ([[Deut. 32:1–43]]; [[Deut. 33:1–29]]) for the words they share with Psalm 90: “Remember the days of old, consider the years of many generations” ([[Deut. 32:7]]).
  - **The two intercessions.** [[Ex. 32:7–14]] and [[Num. 14:11–35]]: Moses prays for the people after the golden calf and after the spies’ report (see the notes on verses 13 and 7).
  - **Grass.** [[Isa. 40:6–8]], [[Ps. 103:14–17]], [[1 Pet. 1:24–25]], and the Lord’s use of the image in [[D&C 124:7]].
  - **From Book Three to Book Four.** Read [[Ps. 89:38–51]] and then Psalm 90, and go on to [[Ps. 91:1–9]], which has “thy habitation” where this psalm has “our dwelling place.”

parallels:
  - ref: 2 Pet. 3:8–9
    note: Peter says that a thousand years are as one day with the Lord, and one day as a thousand years, and reads the Lord’s delay as patience.
  - ref: Ex. 32:11–14
    note: Moses’s prayer after the golden calf, with the two verbs of verse 13.
  - ref: Num. 14:28–35
    note: The sentence on the wilderness generation, the setting the title gives verses 7–11.
  - ref: Deut. 33:27
    note: The Blessing of Moses names the eternal God as His people’s refuge, with a word close to “dwelling place.”
  - ref: Gen. 3:19
    note: The sentence on Adam that verse 3 recalls.
  - ref: Abr. 3:4
    note: A thousand years as one day by the Lord’s reckoning (also Alma 40:8).
  - ref: Moses 1:39
    note: The Lord tells Moses what His work and glory are.
  - ref: Isa. 40:6–8
    note: All flesh is grass, set against the word of God that stands for ever.

