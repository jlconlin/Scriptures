chapter: 27
title: One Thing Have I Desired
tagline: A man who fears no army asks for one thing, to live in the LORD’s house and see Him, and then has to plead not to be turned away, and tells himself to wait.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  Psalm 27 stands in Book One of the Psalms, in a run of seven (Psalms 25–31) that are all attributed to David. Its title gives no occasion. The ancient Greek translation supplies one, “before he was anointed,” which the Hebrew does not have.

  Its nearest neighbour is Psalm 26, whose speaker says, “LORD, I have loved the habitation of thy house” ([[Ps. 26:8]]). Both psalms speak of love for the LORD’s house.

  The psalm has been classed with the laments of one person (the parts of a lament are set out at [[Ps. 22:1]]), but it begins in trust. Its first six verses speak about the LORD with complete confidence; the next six speak to Him, urgently; the last two hold a hope and a charge to wait.

  Nephi’s psalm ([[2 Ne. 4:16–35]]) shares phrases with this one; the note on verse 11 sets them out.

thread: |
  Psalm 27 is about **one desire, held with confidence and then prayed for in need**.

  It opens boldly: “whom shall I fear?” Enemies have come and fallen; an army could camp around him and his heart would not fear. Then the speaker says what he actually wants, and it is not victory. It is “one thing”: to dwell in the house of the LORD, to behold His beauty. The house will hide him, and there he will sing.

  At verse 7 the voice changes. “Hear, O LORD, when I cry.” The man who feared no one now asks not to be put away in anger, not to be left, not to be handed over. The psalm does not say what has happened. What ties the halves together is their words. “That will I seek after” (verse 4) becomes “Thy face, LORD, will I seek” (verse 8): the same Hebrew verb, and the same desire, now named as a face. “In the secret of his tabernacle shall he hide me” (verse 5) becomes “Hide not thy face” (verse 9), again one verb. The LORD who is “my salvation” in the first line is “God of my salvation” at the height of the plea.

  The psalm does not end with a rescue. It ends with a sentence that breaks off (verse 13) and a command: “Wait on the LORD.”

sections:
  - range: 1-3
    heading: Whom shall I fear?
    plain: |
      The LORD is my light and my salvation; whom should I fear? The LORD is the stronghold of my life; of whom should I be afraid? When evildoers, my enemies and my foes, came at me to devour my flesh, it was they who stumbled and fell. Though an army camp against me, my heart will not fear; though war rise against me, in this I will be confident.
  - range: 4-6
    heading: One thing
    plain: |
      One thing I have asked of the LORD, and that I will seek: to live in the house of the LORD all the days of my life, to gaze on the beauty of the LORD and to inquire in His temple. For in the day of trouble He will hide me in His shelter; He will conceal me under the cover of His tent; He will set me high on a rock. And now my head will be lifted up above the enemies around me, and I will offer in His tent sacrifices with shouts of joy; I will sing, yes, I will sing praises to the LORD.
  - range: 7-10
    heading: Thy face, LORD, will I seek
    plain: |
      Hear, O LORD, when I cry aloud; have mercy on me and answer me. You said, “Seek My face,” and my heart answered You, “Your face, LORD, I will seek.” Do not hide Your face from me; do not turn Your servant away in anger. You have been my help. Do not leave me or forsake me, O God of my salvation. Though my father and my mother forsake me, the LORD will take me in.
  - range: 11-13
    heading: Lead me in a plain path
    plain: |
      Teach me Your way, O LORD, and lead me on a level path, because of my enemies. Do not give me over to the will of my foes, for false witnesses have risen against me, and men who breathe out violence. I would have given up, had I not believed that I would see the goodness of the LORD in the land of the living.
  - range: 14-14
    heading: Wait on the LORD
    plain: |
      Wait for the LORD. Be strong, and He will strengthen your heart. Wait, I say, for the LORD.

notes:
  - ref: 1
    phrase: the LORD is the strength of my life
    kind: symbol
    title: The stronghold of my life
    body: |
      The second line of the verse calls the LORD a fortress, which is easy to miss in the King James. “Strength” is the Hebrew *ma‘oz*, a “place or means of safety, protection,” used as a figure of God “as refuge,” with this verse among the examples. A modern translation has “the stronghold of my life,” and gives “refuge” as an alternative. The image comes just before verse 3, where an army camps against him and his heart does not fear.
    sources: [bdb, nrsvue, oshb-wlc]

  - ref: 4
    phrase: One thing have I desired of the LORD, that will I seek after
    kind: words
    title: 'The one thing: to dwell, to behold, to inquire'
    body: |
      The one request is to live where the LORD is and to look at Him, and the rest of the psalm keeps making it. Of all he might have asked, the psalmist “sought one thing above all others, had one overarching request of the Lord.” The verse unfolds it in three verbs.

      **To dwell** in the house of the LORD, and for “all the days of my life.”

      **To behold the beauty of the LORD.** “Beauty” is *no‘am*, “delightfulness, pleasantness.” What he wants to look at is the delightfulness of the LORD Himself, “contemplated in temple.”

      **To inquire in his temple.** The verb is *baqar*. Its basic sense is to “inquire, seek”; its sense in this verse is “contemplate,” and elsewhere “consider, reflect.”

      “Seek after” is a different verb, *baqash*, and it comes back twice in verse 8: “Seek ye my face,” and “Thy face, LORD, will I seek.” So the “one thing” of this verse and the face of that one are a single desire: “Seeking the face of the Lord and seeking to be in the temple were twin thrusts of the same quest.” On the house and the hill of the LORD in the Psalms, see the note on [[Ps. 24:3]].
    sources: [skinner-seeing-god, bdb, oshb-wlc]

  - ref: 5
    phrase: in the secret of his tabernacle shall he hide me
    kind: symbol
    title: A booth, a tent, and a rock
    body: |
      The LORD’s house is pictured here as a hiding place, in three images. “Pavilion” translates a word for a “booth” or “covert.” “Tabernacle” is *’ohel*, the ordinary word for a tent, and the word for “the portable tabernacle temple of Moses and the children of Israel.” “Secret” is a hiding place, a word used “especially” of the LORD “as shelter.” A modern translation puts the middle line this way: “he will conceal me under the cover of his tent.” The third image is a rock, on which the LORD will set him up.

      Verse 4 called the same house a “temple.” That word, *hekal*, means a palace, and names the sanctuary as the “palace of God considered as king.” Verses 5 and 6 call it a tent. In David’s day the ark stood “in the midst of the tabernacle that David had pitched for it” ([[2 Sam. 6:17]]; see the note on [[Ps. 24:3]]).

      The verb of this line returns in verse 9, turned around. Here the LORD will “hide” him; there he begs, “Hide not thy face far from me.” In Hebrew it is one verb. The man who expects to be hidden by God asks that God not be hidden from him.
    sources: [alford-baker-psalm-nephi, bdb, nrsvue, oshb-wlc, lds-scriptures]

  - ref: 6
    phrase: sacrifices of joy
    kind: words
    title: Sacrifices with shouting
    body: |
      The sacrifices he promises are offerings made with a shout. The Hebrew word, *teru‘ah*, is a “shout or blast of war, alarm, or joy,” and here it is the “shout of joy with religious impulse.” The same sense is given for the day David brought up the ark “with shouting, and with the sound of the trumpet” ([[2 Sam. 6:15]]).
    sources: [bdb, oshb-wlc]

  - ref: 7
    phrase: Hear, O LORD, when I cry with my voice
    kind: structure
    title: Confidence first, then the plea
    body: |
      At this verse the psalm turns from confidence to pleading. Until now the LORD has been “he.” From here He is “thou,” and the requests come one on another: hear, have mercy, answer, hide not, put not away, leave me not, teach, lead, deliver me not over.

      A lament usually ends with a vow of praise (see [[Ps. 22:1]]). This psalm has already made its vow, in verse 6. Such vows “are very common at the close of Psalms. But in this Psalm the prayer is only just beginning at this stage.”

      The two halves are different enough that “one is tempted to regard” verse 7 and what follows “as the appendage of another writer,” though whoever placed the psalm in the collection “must have had the Psalm before him exactly as we now have it.” One reading of the order is that triumphant faith gives way to pleading faith, because the danger that faith overcame in the first part “makes itself consciously felt here.”

      What can be checked is that the halves share their words. “Salvation” stands in verse 1 and verse 9, and the verbs for seeking and for hiding each occur on both sides of the turn (see the notes on verses 4 and 5). The “heart” that will not fear (verse 3) is the heart that answers God (verse 8) and the heart to be strengthened (verse 14).
    sources: [delitzsch-psalms, oshb-wlc]

  - ref: 8
    phrase: Seek ye my face
    kind: words
    title: 'Who says “Seek ye my face”?'
    body: |
      The Hebrew of this verse is very compressed, and the King James fills it out as God’s invitation and the heart’s reply. Word for word it runs: *to thee my heart has said: seek ye my face; thy face, LORD, I will seek.* There is no “When thou saidst” in the Hebrew. “Seek ye” is a command to more than one person. By supplying “When thou saidst,” the King James makes the words God’s summons, which the heart quotes back to Him and answers for itself.

      Other translators have smoothed the line differently. The ancient Greek has, “My heart said to thee, I have diligently sought thy face: thy face, O Lord, I will seek.” A modern translation makes the summons the heart’s own urging, *Come, seek his face.* All of them keep the last clause as the King James has it. The psalmist’s resolve is clear even where the syntax is not.

      The hope of seeing God’s face runs through the Psalms (see the notes on [[Ps. 11:7]] and [[Ps. 24:6]]). The next verse asks that the face not be hidden (see the note on [[Ps. 13:1]]).
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, lds-scriptures]

  - ref: 10
    phrase: When my father and my mother forsake me
    kind: history
    title: Did David’s parents forsake him?
    body: |
      Nothing in David’s story says that his parents forsook him, and the line may be a case supposed and not a report. The Hebrew verb is in the form for a completed act, *have forsaken me*, and the ancient Greek translates it so: “For my father and my mother have forsaken me, but the Lord has taken me to himself.” The King James “When” and a modern translation’s “If my father and mother forsake me” take the same words as a supposition: even if those who would be last to leave him did.

      The narrative shows David caring for his parents while Saul hunted him. He took them to the king of Moab and asked, “Let my father and my mother, I pray thee, come forth, and be with you, till I know what God will do for me” ([[1 Sam. 22:3]]). One older reading takes the verse as a statement of fact, because the plea not to be forsaken in verse 9 “is naturally followed by the reason”; on that reading the line “does not sound as though it came from the lips of David,” though the words “certainly might be David’s” if they are a supposition.

      “Take me up” is a verb of gathering in. Its sense in this verse is “take up, care for,” and it is the verb used of bringing a stray ox or sheep home to one’s own house.
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, delitzsch-psalms, bdb, lds-scriptures]

  - ref: 11
    phrase: lead me in a plain path, because of mine enemies
    kind: scripture
    title: Nephi’s psalm and this one
    body: |
      Nephi’s psalm ([[2 Ne. 4:16–35]]) shares phrases with this psalm. On the proposal that he wrote with Psalms 25–31 in mind, see the note on [[Ps. 25:17]].

      A count of psalm phrases in the Book of Mormon finds two from Psalm 27, both in Nephi’s psalm. “The goodness of the LORD” (verse 13) is set beside his “notwithstanding the great goodness of the Lord” ([[2 Ne. 4:17]]). “Because of mine enemies” (this verse) is set beside “Do not anger again because of mine enemies” ([[2 Ne. 4:29]]).

      Other lines have been compared as alike in thought. Nephi’s “My God hath been my support” ([[2 Ne. 4:20]]) is compared with “the strength of my life” in verse 1. His plea, “wilt thou not shut the gates of thy righteousness before me” ([[2 Ne. 4:32]]), is compared with verse 9, since “Both verses ask the Lord not to reject the person writing the psalm but to allow the Lord’s presence or influence to abide with him.” And his wish to “be strict in the plain road” ([[2 Ne. 4:32]]) is compared with the “plain path” here. The Hebrew word behind “plain” means a “level country” or “plain,” and can also mean uprightness.

      Phrases about enemies and paths are common in the Psalms, so the case rests on how many such lines fall in these seven psalms, and it is offered as a hypothesis.
    sources: [hilton-psalms-bom, alford-baker-psalm-nephi, lds-scriptures]

  - ref: 13
    phrase: I had fainted, unless I had believed
    kind: words
    title: A sentence that breaks off
    body: |
      The words “I had fainted” were supplied by the translators; in Hebrew the sentence begins *unless I had believed* and is never finished. The first word means “if not, unless,” and the verse is an aposiopesis, a sentence broken off: “if I had not believed ...!” The King James completes the thought.

      Other translations have no “unless.” The ancient Greek and a modern translation both read, “I believe that I shall see the goodness of the Lord in the land of the living.”

      Read either way, what he believes is that he will *see*. The psalm asked to behold the beauty of the LORD (verse 4) and resolved to seek His face (verse 8), and its last hope is again something to be seen, the LORD’s goodness. This verse and the next, the hope of seeing and the charge to wait, have been pointed to as “what ultimately kept the Psalmist faithful and motivated.”
    sources: [bdb, oshb-wlc, lxx-rahlfs, nrsvue, skinner-seeing-god]

  - ref: 14
    phrase: 'Wait on the LORD: be of good courage'
    kind: words
    title: 'Who says “Wait,” and to whom'
    body: |
      The last verse is a command to one person, and the psalm does not say who gives it. The Hebrew imperatives are singular, and no change of speaker is marked. On one reading he is speaking to himself: “the believing half of his soul addressing the despondent and weaker half.”

      The call to courage has been compared with Moses’s charge to Joshua, “Be strong and of a good courage” ([[Deut. 31:7]]), with a change: where Moses gives a second command, the psalm has a wish about the heart, “let thy heart be strong, let it give proof of strength.” The ancient Greek agrees, “let thy heart be strengthened,” and so does a modern translation, “be strong, and let your heart take courage.” The King James turns the wish into a promise: “he shall strengthen thine heart.”

      “Wait” is the verb of Isaiah’s “they that wait upon the LORD” (see the note on [[Isa. 40:31]]): to “wait, or look eagerly, for.” Elder Robert D. Hales taught, “In the scriptures, the word wait means to hope, to anticipate, and to trust.”

      It comes twice, on either side of the call to courage.
    sources: [oshb-wlc, delitzsch-psalms, lxx-rahlfs, nrsvue, bdb, hales-waiting, lds-scriptures]

christ: |
  The psalm’s first words call the LORD “my light and my salvation.” The Church’s edition of the Bible points from “light” in this verse to the Topical Guide’s entry “Jesus Christ, Light of the World.” He took the name Himself: “I am the light of the world: he that followeth me shall not walk in darkness, but shall have the light of life” ([[John 8:12]]). To the Nephites He said, “I am the light and the life of the world” ([[3 Ne. 11:11]]).

  The psalm’s one desire is to see the LORD’s face, and in latter-day revelation it is the Lord who says, “seek the face of the Lord always” ([[D&C 101:38]]), and who promises that sight to those who come to Him ([[D&C 93:1]], quoted in the chapter on [[Ps. 11:7]]).

  The psalm’s last command is “wait.” Elder Robert D. Hales taught that the Savior Himself waited: in Gethsemane He “waited upon His Father.”

explore: |
  - **Seeing God in His house.** [[Ps. 11:7]], [[Ps. 17:15]] and [[Ps. 42:2]].
  - **Waiting.** [[Isa. 40:31]]; Elder Robert D. Hales, “Waiting upon the Lord: Thy Will Be Done” (general conference, October 2011).
  - **The temple and the face of God in the Psalms.** Andrew C. Skinner, “Seeing God in His Temple: A Significant Theme in Israel’s Psalms,” in *Ascending the Mountain of the Lord* (2013), which reads verses 4, 8–9 and 13–14 together.

