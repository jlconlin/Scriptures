chapter: 47
title: God Is Gone Up with a Shout
tagline: Every nation is called to clap and shout for the King of all the earth, who has gone up to His throne, and the psalm ends with their princes gathered as the people of the God of Abraham.
when: 'Undated; a psalm for the sons of Korah by its title'

setting: |
  The title gives the psalm to the sons of Korah, who are introduced at [[Ps. 42:1]]; “To the chief Musician” is explained at [[Ps. 8:1]]. It names no occasion.

  This is a psalm of praise. Psalms of this kind open with a call to gather and praise the Lord and then give the reasons, often His reign as king, and they are now thought to belong to the nation’s festival gatherings at the temple. That setting is a reconstruction; the psalm itself says only that there was shouting, the sound of a trumpet, and singing.

  One older reading looks for a particular day and finds it in the reign of Jehoshaphat, when Judah was given “a victory without a conflict” and the people came back to Jerusalem “with psalteries and harps and trumpets unto the house of the LORD” ([[2 Chr. 20:28]]). On that reading Psalm 47 shares its occasion with the psalm before it, as it shares the thought of the Lord exalted over the peoples of the earth: Psalm 46 ends with God saying, “I will be exalted among the heathen, I will be exalted in the earth” ([[Ps. 46:10]]). The occasion is an inference, and nothing in the psalm names Jehoshaphat.

thread: |
  The psalm is built as two calls to praise, each followed by its reasons. “O clap your hands” (verse 1) is answered by “For the LORD most high is terrible” (verses 2–4); “Sing praises,” four times over (verse 6), is answered by “For God is the King of all the earth” (verses 7–9). **Between the two calls stands verse 5: “God is gone up with a shout.”**

  The call of verse 1 goes to “all ye people,” which in Hebrew is every people, yet the first reasons given are Israel’s own: peoples subdued “under us,” an inheritance chosen “for us,” Jacob loved. The second set of reasons is wider. “Our King” (verse 6) is “the King of all the earth” (verse 7), He reigns over the nations (verse 8), and in verse 9 the princes of the peoples are gathered as “the people of the God of Abraham.” One older reading says why the nations are called to rejoice and not to tremble: the Lord’s “true and final victory” is not a submission forced by war but “a change in the minds and hearts of the peoples, so that they render joyful worship unto Him.”

  The verb of verse 5 returns at the end. He has “gone up,” and the last words are “he is greatly exalted,” where the Hebrew uses the same verb. On the same older reading the end is the result of the middle: He has gone up, and so He is exalted.

sections:
  - range: 1-4
    heading: Clap your hands, all peoples
    plain: |
      Clap your hands, all you peoples; shout to God with a voice of joy. For the Lord, the Most High, is to be held in awe, a great King over all the earth. He subdued peoples under us and nations under our feet. He chose our inheritance for us, the pride of Jacob, whom He loves. (The King James has “shall subdue” and “shall choose”; see the note on verse 4.)
  - range: 5-7
    heading: God has gone up
    plain: |
      God has gone up with a shout, the Lord with the sound of a trumpet. Sing praises to God, sing praises; sing praises to our King, sing praises. For God is the King of all the earth: sing praises with a psalm (or, as the King James has it, with understanding).
  - range: 8-9
    heading: King over the nations
    plain: |
      God is King over the nations; God sits on His holy throne. The princes of the peoples are gathered as the people of the God of Abraham. For the shields of the earth, its rulers, belong to God. He is highly exalted.

notes:
  - ref: 1
    phrase: all ye people
    kind: words
    title: All the peoples, not one people
    body: |
      The call goes to every nation, not to Israel alone: the Hebrew word is plural, “peoples,” and the ancient Greek translation has “all ye nations.” The King James’s “people” hides the plural here and twice more. “The people” subdued in verse 3 are peoples, and “the princes of the people” in verse 9 are princes of the peoples; only the last “people” of the psalm, “the people of the God of Abraham,” is singular. A modern translation prints the difference each time: “all you peoples,” “He subdued peoples under us,” “The princes of the peoples gather.”

      What they are asked to do is celebrate. The verb for clapping is to “strike, clap hands; in triumph,” and the shout is to be made, in the modern translation, “with loud songs of joy.”
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, bdb]
  - ref: 2
    phrase: terrible
    kind: words
    title: Terrible means awe-inspiring
    body: |
      “Terrible” here means awe-inspiring. The Hebrew is a form of the verb “to fear,” and its use in this verse is to “cause astonishment and awe,” said of the Lord Himself. The English word once carried that sense: an American dictionary of 1828 gives as one meaning “Adapted to impress dread, terror or solemn awe and reverence,” and gives as its example the verse of Deuteronomy that speaks of “a mighty God and terrible” ([[Deut. 7:21]]). A modern translation has “awesome.”
    sources: [bdb, webster-1828, nrsvue]
  - ref: 4
    phrase: He shall choose our inheritance for us
    kind: words
    title: Chosen already, and the pride of Jacob
    body: |
      Verses 3 and 4 can be read as things God has done, and the ancient Greek translation and a modern one read them so. Where the King James has “He shall subdue” and “He shall choose,” the ancient Greek has “He has subdued the peoples under us” and “He has chosen out his inheritance for us,” and a modern translation has “He subdued peoples under us” and “He chose our heritage for us.” The Hebrew forms can be called futures, which is how the King James took them. One older reading holds that they must nevertheless be taken here “as a statement of historical facts,” on the ground that “the choosing (election) is an act done once for all and not a continued act.” Read that way, verses 3 and 4 give things already done as reasons for praise.

      “The excellency of Jacob” is then the inheritance itself, named a second time. The word means “exaltation, majesty, excellence,” and is used of nations for “their wealth, power, magnificence”; the modern translation has “the pride of Jacob.” On the same older reading it is the land of promise, Jacob’s pride “as being the gift of grace.”
    sources: [lxx-rahlfs, nrsvue, bdb, delitzsch-psalms]
  - ref: 5
    phrase: God is gone up with a shout
    kind: history
    title: The words of the day the ark was brought up
    body: |
      The line uses the words in which Samuel tells of the ark being brought up to Zion: “So David and all the house of Israel brought up the ark of the LORD with shouting, and with the sound of the trumpet” ([[2 Sam. 6:15]]). The match is closer in Hebrew than in English. Both verses have the same noun for the shout and the same phrase for the sound of the trumpet (the *shofar*), and the verb of the psalm, “go up,” is the verb of the narrative, there in the form that means “bring up.” The shout is a “shout of joy with religious impulse,” and the two verses are cited together under that sense.

      The psalm does not mention the ark. It says that God Himself has gone up, and three verses later that He “sitteth upon the throne of his holiness.” Whether Psalm 47 was sung at a procession like David’s, or recalls one, it does not say.
    sources: [lds-scriptures, oshb-wlc, bdb]
  - ref: 7
    phrase: sing ye praises with understanding
    kind: words
    title: With understanding is the title word Maschil
    body: |
      “With understanding” translates a single Hebrew word, *maskil*, the same word that stands as “Maschil” in the titles of thirteen psalms. This is the one place it appears inside a psalm and not above one. As the title word it is glossed as a kind of composition, a “contemplative poem.” A modern translation has “sing praises with a psalm,” with a note that the Hebrew is *Maskil*. The ancient Greek translators took it as the King James does: “sing praises with understanding.”

      The title word and its uncertainty are discussed at [[Ps. 32:1]].
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs]
  - ref: 8
    phrase: God reigneth
    kind: scripture
    title: The cry that God reigns
    body: |
      “God reigneth” is an acclamation that the Psalms and Isaiah repeat. The verb means to “be, or become king, or queen, reign.” With God as its subject it opens several later psalms, “The LORD reigneth” ([[Ps. 93:1]]; [[Ps. 97:1]]; [[Ps. 99:1]]), and it is what the bringer of good tidings says to Zion in Isaiah: “Thy God reigneth!” ([[Isa. 52:7]]).

      In this psalm the cry is paired with a throne. A modern translation gives the two halves of the verse as “God is king over the nations” and “God sits on his holy throne.”

      Psalms of praise like this one have been connected with festivals at the temple that marked, among other things, “the anointing of God as king.” That is a proposal about how such psalms were used; the psalm itself names no festival.
    sources: [bdb, lds-scriptures, nrsvue, hopkin-psalms-sung]
  - ref: 9
    phrase: even the people of the God of Abraham
    kind: scripture
    title: The nations gathered as Abraham’s people
    body: |
      The psalm ends with the rulers of the nations gathered as the people of Abraham’s God. The Hebrew sets the two phrases side by side with no word between them: the princes of the peoples are gathered, “people of the God of Abraham.” The King James joins them with “even”; a modern translation has “as the people of the God of Abraham.” The ancient Greek translators read the word for “people” differently and have the rulers “assembled with the God of Abraam.” The word has been called ambiguous, and the reading “people” defended.

      On one older reading this is the promise to Abraham coming true: the nobles of the nations “enter into the society of the people of the God of Abraham,” and “The promise concerning the blessing of the tribes of the nations in the seed of the patriarch is being fulfilled.” A promise of that kind was given when Abraham was called: “in thee shall all families of the earth be blessed” ([[Gen. 12:3]]).

      Restoration scripture says how people of every nation come to be Abraham’s. The Lord told him, “as many as receive this Gospel shall be called after thy name, and shall be accounted thy seed” ([[Abr. 2:10]]), and those not of Israel’s lineage are “adopted into the house of Israel” through the ordinances of the gospel. The psalm itself does not say how the princes come to be that people.
    sources: [oshb-wlc, nrsvue, lxx-rahlfs, delitzsch-psalms, lds-scriptures, bd-abraham-covenant]
  - ref: 9
    phrase: the shields of the earth
    kind: symbol
    title: Shields are rulers
    body: |
      The shields are the earth’s rulers. The word is the one for a shield, used here in a figure for the “rulers of earth,” and it answers “the princes” in the first half of the verse, a word for one who is “noble, princely, in rank.” The ancient Greek translation drops the image and has “mighty ones of the earth.”

      Then comes the last line, “he is greatly exalted.” Its verb is the verb of verse 5, “God is gone up,” here in a form that means to “be exalted.”
    sources: [bdb, lxx-rahlfs, oshb-wlc]

christ: |
  The King of this psalm is “the LORD,” Jehovah, and the Jehovah of the Old Testament is the premortal Jesus Christ. What the psalm says twice, that He is King “over all the earth” (verses 2 and 7), Zechariah says of the day of His coming: “And the LORD shall be king over all the earth: in that day shall there be one LORD, and his name one” ([[Zech. 14:9]]).

  One older reading takes “God reigneth” in the sense of the announcement John hears when the seventh angel sounds, “The kingdoms of this world are become the kingdoms of our Lord, and of his Christ; and he shall reign for ever and ever” ([[Rev. 11:15]]), and takes the event the psalm celebrates as “a prelude of the final and visible entering upon the kingdom.” The same reading holds that “God is gone up” came to mean more than its first occasion, a meaning “fully unravelled by the ascension of Christ.” That is a reading of the psalm; no scripture cited here applies the verse to the Ascension.

explore: |
  - **The LORD reigneth.** Read [[Ps. 93:1–5]], [[Ps. 96:10–13]], [[Ps. 97:1–9]] and [[Ps. 99:1–5]] beside this psalm, and then the good tidings brought to Zion in [[Isa. 52:7–10]].
  - **The ark brought up.** [[2 Sam. 6:12–19]] and [[1 Chr. 15:25–28]] tell the day whose words verse 5 uses.
  - **King over all the earth.** [[Zech. 14:9]], [[Zech. 14:16–17]] and [[Rev. 11:15–17]]; and [[D&C 45:59]], where the Lord says He will be His people’s king and lawgiver.
  - **All nations in Abraham.** [[Gen. 12:1–3]], [[Abr. 2:9–11]] and [[Gal. 3:26–29]].

parallels:
