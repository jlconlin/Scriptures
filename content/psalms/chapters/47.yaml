  - ref: Ps. 93:1
    note: “The LORD reigneth,” the acclamation of verse 8 (also Ps. 97:1; 99:1).
  - ref: Zech. 14:9
    note: The Lord king over all the earth at His coming.
  - ref: Gen. 12:3
    note: The promise that all families of the earth would be blessed in Abraham (also Abr. 2:10).
  - ref: Rev. 11:15
