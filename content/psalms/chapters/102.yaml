chapter: 102
title: My Days and Thy Years
tagline: A wasting man sets his days, which go like smoke, beside the years of the LORD, who will build up Zion and establish His servants’ children.
when: 'Undated; Zion lies in stones and dust (verse 14)'

setting: |
  Psalm 102 stands in the fourth of the book’s five sections (Psalms 90–106), where many psalms look to the day when Israel rests under the Messiah’s reign. This one is a lament, the kind of psalm whose parts are set out at [[Ps. 22:1]], and it is the prayer of one man: feverish, sleepless, mocked and alone.

  His trouble is not only his own. Zion lies in ruins. The LORD’s servants cherish “her stones” and pity “the dust thereof” (verse 14), and there are prisoners “appointed to death” (verse 20). The psalm gives no date and names no enemy. On one older reading it comes from the exile in Babylon, where “The servants of God do not feel at home,” and both things hold at once: the prayer is “to be taken, too, just as personally as it sounds,” and the poet “shares the calamity that has befallen Jerusalem and its homeless people.”

  Later scripture takes up the psalm. Hebrews quotes verses 25–27 as words spoken to the Son ([[Heb. 1:10–12]]), and in 1841 the Lord used the words of verse 13 in a revelation to Joseph Smith ([[D&C 124:6]]).

thread: |
  Psalm 102 measures **a man’s days against God’s years**. “My days” comes four times, and each time there is less of them: they are “consumed like smoke” (verse 3), they are “like a shadow that declineth” (verse 11), God has “shortened” them (verse 23), and the speaker fears to be taken “in the midst” of them (verse 24). On the other side stand “for ever” and “all generations” (verse 12), and at the end “thy years,” twice (verses 24 and 27).

  The psalm has three movements. The complaint (verses 1–11) describes a body burning and wasting, nights without sleep, enemies who mock all day, and behind all of it the anger of God. Then two words turn it: “But thou” (verse 12). Nothing in the man’s condition has changed. What changes is where he is looking, and for eleven verses he does not mention himself. He speaks of Zion rebuilt, of nations and kings, of a record written for people not yet born.

  Then he comes back to himself (verses 23–24). The psalm does not report that he was healed, and his last request is modest: not to live for ever, only not to be cut off halfway.

  The close sets the two side by side once more. Earth and heaven wear out like clothing; the LORD is the same, and His years have no end. The psalm’s last line is not about the man at all: “The children of thy servants shall continue, and their seed shall be established before thee.”

sections:
  - range: 1-2
    heading: Hear me, and quickly
    plain: |
      LORD, hear my prayer, and let my cry reach You. Do not hide Your face from me on the day of my trouble. Turn Your ear to me; on the day I call, answer me soon.
  - range: 3-11
    heading: My days go like smoke
    plain: |
      My days vanish like smoke, and my bones burn like a hearth. My heart is struck down and dried up like grass, and I forget to eat. I groan until I am skin and bone. I am like an owl in the wilderness, like an owl of the waste places. I lie awake, like a lone bird on a roof. All day my enemies taunt me, and those who mock me use my name as a curse. Ashes are my bread, and my drink is mixed with tears, because of Your anger: You picked me up and threw me away. My days are like a shadow stretching out at evening, and I dry up like grass.
  - range: 12-22
    heading: But thou, and Zion’s set time
    plain: |
      But You, LORD, sit enthroned for ever, and Your name is remembered in every generation. You will rise and have mercy on Zion, for it is time to show her favor; the appointed time has come. Your servants love her very stones and pity her dust. The nations will fear the LORD’s name, and all the kings of the earth His glory, when the LORD builds up Zion and appears in His glory. He will turn to the prayer of the destitute and will not despise it.

      Let this be written for a generation to come, so that a people not yet created may praise the LORD: that He looked down from His holy height, from heaven to earth, to hear the groaning of the prisoner and to set free those doomed to die, so that His name would be declared in Zion and His praise in Jerusalem, when peoples and kingdoms gather to serve Him.
  - range: 23-28
    heading: Thy years have no end
    plain: |
      He has broken my strength on the way and cut my days short. I say, “My God, do not take me away at the midpoint of my days, You whose years run through all generations.” Long ago You laid the foundation of the earth, and the heavens are the work of Your hands. They will perish, and You will remain. All of them will wear out like a garment; You will change them like clothing, and they will be changed. But You are the same, and Your years will not end. The children of Your servants will live on, and their descendants will be established before You.

notes:
  - ref: 0
    phrase: A Prayer of the afflicted
    kind: history
    title: A title that names a condition, not a person
    body: |
      The title names no author, no tune and no event; it says what state a person is in when this is his prayer. The ancient Greek translation makes it a prayer for such a person: “A Prayer for the Poor; when he is deeply afflicted.” Where the King James has “overwhelmed,” a modern translation has “faint.”

      The title also says what the afflicted man does: he “poureth out his complaint” before the LORD. What follows is a complaint, and the title calls it a prayer. What a psalm’s title is, and what it is worth as evidence, is discussed at [[Ps. 3:1]].
    sources: [lds-scriptures, lxx-rahlfs, nrsvue]
  - ref: 6
    phrase: a pelican of the wilderness
    kind: symbol
    title: Birds of the waste places
    body: |
      The three birds of verses 6 and 7 are pictures of a man alone where nothing lives and awake when others sleep. Which birds are meant is not certain. A modern translation has “a desert owl of the wilderness” and “a little owl of the waste places,” and notes of the verse, “Meaning of Heb uncertain.” The ancient Greek keeps the pelican and puts the second bird “in a ruined house.”

      Whatever the species, the places are plain: wilderness, waste, an empty house. The third bird is the sleepless one. “I watch” is “I lie awake” in a modern translation, and the bird sits by itself on a roof.
    sources: [nrsvue, lxx-rahlfs]
  - ref: 8
    phrase: are sworn against me
    kind: words
    title: His name has become a curse
    body: |
      To be “sworn against” here is to have one’s name used in other people’s curses, not to be the target of a plot. A modern translation has “those who deride me use my name for a curse.” His enemies “swear by him”: when they want to curse someone, they wish that person the fate of “this man.”

      Scripture shows the practice. Jeremiah gives the words of such a curse, “The LORD make thee like Zedekiah and like Ahab” ([[Jer. 29:22]]), and in Isaiah the LORD says, “ye shall leave your name for a curse unto my chosen” ([[Isa. 65:15]]).

      On one older reading the taunt is that God has cast him off: “His grief is that his enemies reproach him as one forsaken of God.”
    sources: [nrsvue, delitzsch-psalms]
  - ref: 10
    phrase: thou hast lifted me up, and cast me down
    kind: symbol
    title: Picked up to be thrown
    body: |
      In a modern translation the lifting is the first half of a throw: “for you have lifted me up and thrown me aside.”

      The speaker says plainly who has done this to him. The ashes and the tears of verse 9 are “because of thine indignation and thy wrath.” He does not say what the anger is for; the psalm has no confession of sin and no claim of innocence. He brings the complaint to the One he holds responsible, which is what the title says the afflicted man does.
    sources: [nrsvue]
  - ref: 12
    phrase: But thou, O LORD, shalt endure for ever
    kind: structure
    title: 'The turn: a throne that outlasts the ruin'
    body: |
      The psalm turns on “But thou,” and what the speaker turns to is the LORD’s kingship. “Endure” is, in a modern translation, “are enthroned forever,” and “thy remembrance” is “your name.” The name is how the LORD is remembered, as He told Moses: “this is my name for ever, and this is my memorial unto all generations” ([[Ex. 3:15]]).

      Nearly the same words stand at the end of Lamentations. After “the mountain of Zion, which is desolate” ([[Lam. 5:18]]), the poet says, “Thou, O LORD, remainest for ever; thy throne from generation to generation” ([[Lam. 5:19]]). There, as here, the line is spoken over a ruined Zion.

      Verse 11 ended with “I am withered like grass”; verse 12 begins with the One who endures. From here to verse 22 he speaks only of the LORD and of Zion.
    sources: [nrsvue, delitzsch-psalms, lds-scriptures]
  - ref: 13
    phrase: the set time, is come
    kind: scripture
    title: The Lord repeats the line in 1841
    body: |
      The words of this verse return, in the Lord’s own voice, in the revelation of 19 January 1841. Joseph Smith is told to write a proclamation “to all the kings of the world” ([[D&C 124:3]]), and the reason given is this: “For, behold, I am about to call upon them to give heed to the light and glory of Zion, for the set time has come to favor her” ([[D&C 124:6]]). The psalm, too, goes on from Zion’s favor to kings: “all the kings of the earth thy glory” (verse 15).

      In the psalm the “set time” is an appointed one: “the appointed time has come.” The psalm does not say who announced it or when. The speaker declares it while the stones are still lying in the dust. The revelation came when the Saints, expelled from Missouri, had been resettling in Illinois, clearing forest and draining swamp.
    sources: [lds-scriptures, jsp-revelations-dc-124, nrsvue]
  - ref: 14
    phrase: take pleasure in her stones
    kind: history
    title: Loving the rubble
    body: |
      The stones and the dust are what is left of Jerusalem, and the servants’ love for them is offered to God as a reason to act. The verse begins with “For”: it supports the plea of verse 13. A modern translation has “your servants hold its stones dear and have pity on its dust.”

      On the reading that sets the psalm in the exile, “their loving yearning lingers over the ruins,” and that reading compares the rubble Sanballat mocked when the Jews had returned: “will they revive the stones out of the heaps of the rubbish which are burned?” ([[Neh. 4:2]]).
    sources: [nrsvue, delitzsch-psalms]
  - ref: 16
    phrase: When the LORD shall build up Zion, he shall appear in his glory
    kind: prophets
    title: Elder McConkie on when Zion is built
    body: |
      Elder Bruce R. McConkie read verses 13, 16 and 18 as a message sent to the Latter-day Saints, and took verse 16 to mean that Zion is completed at the Second Coming. In a sermon given in Lima, Peru, in 1977, he quoted the psalm’s “generation to come” and “people which shall be created” and said, “We are that people.”

      Of this verse he taught, “Zion shall be built up—she shall obtain that perfection and glory which is hers—when the Lord appears in his glory,” and again, “Zion shall be perfected after the second coming of Christ.” The building itself “occurs in stages,” and the present stage is preparation: “the Lord has laid upon us the responsibility to lay the foundation for that which is to be.”
    sources: [mcconkie-build-zion]
  - ref: 18
    phrase: the people which shall be created
    kind: scripture
    title: A record for people not yet born
    body: |
      The speaker asks that the LORD’s rescue be written down so that people who do not yet exist can praise Him for it. A modern translation has “Let this be recorded for a generation to come,” for the sake of “a people yet unborn.” What is to be recorded follows in verses 19 and 20: that He looked down from heaven and heard.

      Psalm 22 ends the same way, with the news carried “unto a people that shall be born, that he hath done this” ([[Ps. 22:31]]). In both psalms what the LORD has done is to be told to people not yet born.

      Here the line stands in a psalm about short days: the man whose days are a declining shadow speaks of praise from a generation to come. For the reading that names that generation, see the note on verse 16.
    sources: [nrsvue, lds-scriptures]
  - ref: 20
    phrase: those that are appointed to death
    kind: scripture
    title: The prisoners of Psalm 79, heard
    body: |
      The prisoner and those appointed to death are the words of another prayer over ruined Jerusalem. Psalm 79 asks, “Let the sighing of the prisoner come before thee; according to the greatness of thy power preserve thou those that are appointed to die” ([[Ps. 79:11]]); the note there explains the Hebrew idiom behind the phrase. What that psalm asks, this one says the LORD looked down from heaven to do: “to hear” the groaning and “to loose” the captives.
    sources: [lds-scriptures, nrsvue]
  - ref: 25
    phrase: Of old hast thou laid the foundation of the earth
    kind: christ
    title: Hebrews gives these lines to the Son
    body: |
      Hebrews quotes verses 25–27 as words spoken to Jesus Christ. They stand in the chain of scripture that opens the epistle, which is described at [[Ps. 45:6]]: “And, Thou, Lord, in the beginning hast laid the foundation of the earth; and the heavens are the works of thine hands” ([[Heb. 1:10]]).

      The wording is that of the ancient Greek psalm. Verse 25 in the King James names no one; the Greek has the address, “In the beginning thou, O Lord, didst lay the foundation of the earth.” The Greek also has “as a vesture shalt thou fold them,” and Hebrews has “fold them up” where the King James psalm has “change them.”

      In the psalm the one addressed is the LORD, whom the sick man has just called “my God” (verse 24). Hebrews has already said that God “made the worlds” by the Son ([[Heb. 1:2]]), and it reads the Creator of these verses as the Son. That is what the Church teaches of the LORD of the Old Testament: “Jehovah is the premortal Jesus Christ.”

      In Hebrews the lines stand against what is said of the angels, who are “ministering spirits” ([[Heb. 1:14]]). Creation wears out, but of the Son it is said, “They shall perish; but thou remainest” ([[Heb. 1:11]]).
    sources: [lds-scriptures, lxx-rahlfs, bd-jehovah]
  - ref: 27
    phrase: thou art the same
    kind: words
    title: Thou art He
    body: |
      “Thou art the same” has been read as a phrase the LORD uses of Himself in Isaiah. On that reading the Hebrew says “Thou art He,” that is, “unalterably the same One,” and the psalmist has it from the prophet. In Isaiah the LORD says it, and joins it to the same act of creation: “I am he; I am the first, I also am the last. Mine hand also hath laid the foundation of the earth” ([[Isa. 48:12–13]]).

      The divine name carries the same sense. Jehovah “denotes the ‘Unchangeable One.’” Hebrews quotes “thou art the same” of the Son ([[Heb. 1:12]]).

      The same reading says what the man builds on this. He supports his plea “not by the eternity of God in itself” but by “the restoration of Israel that is to be looked for,” which the LORD can bring about “because He is the ever-living One.” The psalm’s last verse follows: “The children of thy servants shall continue.”
    sources: [delitzsch-psalms, bd-jehovah, lds-scriptures]

christ: |
  The LORD to whom this psalm is prayed is Jehovah, the premortal Jesus Christ, and scripture says so of this psalm in particular. Hebrews takes the confession of verses 25–27, the Creator who remains when earth and heaven wear out, and gives it as words spoken to the Son ([[Heb. 1:10–12]]); the notes on verses 25 and 27 follow that passage.

  He also speaks the psalm’s promise as His own. The afflicted man said that the set time to favor Zion had come; in 1841 the Lord said it Himself ([[D&C 124:6]]). And the psalm’s center, that when the LORD builds up Zion “he shall appear in his glory,” has been taught as a promise of His Second Coming; see the note on verse 16.

explore: |
  - **The chain in Hebrews.** Read [[Heb. 1:5–13]], where these verses are quoted just before [[Ps. 110:1]]; the chain is described at [[Ps. 45:6]].
  - **Creation as a garment.** Isaiah uses the same picture in [[Isa. 51:6]], and later has the LORD say, “For, behold, I create new heavens and a new earth” ([[Isa. 65:17]]).
  - **The set time.** Read [[D&C 124:1–11]] beside verses 13–16, and then [[Isa. 60:1–3]], where kings come to Zion’s light.
  - **The same ruin and the same throne.** [[Lam. 5:17–22]] has the line on which this psalm turns.
  - **Days and years.** This section of the book opens with another prayer that sets human life, cut down like grass, beside the God who is “from everlasting to everlasting” ([[Ps. 90:1–6]]).

parallels:
  - ref: Heb. 1:10–12
    note: Verses 25–27 quoted, in the Greek wording, as spoken to the Son.
  - ref: D&C 124:6
    note: The Lord says that the set time has come to favor Zion.
  - ref: Lam. 5:19
    note: The LORD’s lasting throne set against desolate Zion.
  - ref: Ps. 79:11
    note: The prayer for the prisoner and those appointed to die, whose words verse 20 takes up.
  - ref: Isa. 48:12–13
    note: “I am he,” joined to the laying of the earth’s foundation.
  - ref: Ps. 22:30–31
    note: Deliverance told to a people that shall be born.

