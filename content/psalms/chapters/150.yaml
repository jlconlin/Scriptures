chapter: 150
title: Let Every Thing That Hath Breath
tagline: The book of Praises ends with its own verb thirteen times in six verses, saying where to praise, why, with what, and at last who.
when: 'Undated; the psalm has no title'

setting: |
  Psalm 150 has no title and names no author, no enemy, and no occasion. Its setting is its place: it is the last psalm of Book Five and of the whole collection.

  The Psalter is five books, and each of the first four closes with a verse or two of blessing. The fifth closes with this psalm instead (see the note on verse 6). It is also the last of a run of five. Each of Psalms 146–150 begins and ends with “Praise ye the LORD,” the one Hebrew word *hallelujah*, so the book ends on five psalms framed by that word, and the last of them is made of almost nothing else.

  The psalm’s world is the temple and the road to it. Psaltery, harp, and cymbals are the instruments Chronicles puts in the hands of the Levites; the horn, the timbrel, and the dance belong to Israel’s processions and victories. What it meant to come up to the Lord’s house is told at [[Ps. 24:3]].

thread: |
  Nothing happens in Psalm 150. There is no complaint, no request, and no story, and there is very little argument. The psalm that opens this closing run gives its reasons for praise at length: the Lord made heaven and earth, feeds the hungry, looses the prisoners, opens the eyes of the blind ([[Ps. 146:6–9]]). This one gives its reasons a single verse and leaves them unnamed.

  **What moves is the question being answered.** Verse 1 says *where* God is to be praised: in His sanctuary and in the firmament. Verse 2 says *why*: for what He has done and for what He is. Verses 3–5 say *with what*, and take half the psalm to do it: horn, harp and lyre, drum and dance, strings and pipe, cymbals and cymbals again. The last word of the list in Hebrew is the word for a shout.

  The turn is at verse 6. Between the opening and closing hallelujah stand ten commands, “praise him,” all addressed to a “ye” that is never named. Only in the last verse does the psalm say *who*, and the verb changes with it, from a command to a wish: “Let every thing that hath breath praise the LORD.” The answer is wider than anything the first five verses prepared for. A psalm that began in the sanctuary, with the instruments of Israel’s worship, ends with no instrument but breath and no limit but life.

  So the book whose prayers so often begin in trouble (the shape of a lament is at [[Ps. 22:1]]) ends with one verb, said until there is no one left out of it.

sections:
  - range: 1
    heading: Where
    plain: |
      Praise the Lord. Praise God in His holy place; praise Him in the firmament that shows His strength.
  - range: 2
    heading: Why
    plain: |
      Praise Him for His mighty deeds; praise Him as the abundance of His greatness deserves.
  - range: 3-5
    heading: With what
    plain: |
      Praise Him with a blast on the horn, with harp and lyre. Praise Him with hand drum and dancing, with strings and pipe. Praise Him with loud cymbals, with cymbals that ring like a shout.
  - range: 6
    heading: Who
    plain: |
      Let everything that breathes praise the Lord. Praise the Lord.

notes:
  - ref: 1
    phrase: Praise ye the LORD
    kind: words
    title: Hallelujah is a command to a congregation
    body: |
      “Praise ye the LORD” is the Hebrew *hallelujah*, and it is an order given to many people at once. It joins *hallelu*, the plural imperative of the verb to praise, to *Yah*, a short form of the divine name (for LORD in capitals, see [[Ps. 110:1]]). The King James “ye” is exact: the word is a summons, and a company of people is being told to do something.

      Written as one word, it stands “always at beginning or end of Psalm,” and it is “apparently liturgical”: it seems to have been a cry of public worship. It comes late in the book. No psalm carries it before [[Ps. 104:35]]; from there it gathers toward the end, and each of the last five psalms opens and closes with it.

      The Greek translators did not translate the word. They spelled it in Greek letters, “Alleluia,” and in that form it enters the New Testament, in John’s vision of heaven ([[Rev. 19:1–6]]).
    sources: [oshb-wlc, bdb, lxx-rahlfs, bd-hallelujah]

  - ref: 1
    phrase: in his sanctuary
    kind: symbol
    title: 'The sanctuary and the firmament: one place or two'
    body: |
      The first verse says where the praise is to sound, and its two halves can be read as two places or as one. “His sanctuary” is in Hebrew *his holy place*, the word used for the holy place “of the Tabernacle and of the Temple”; the Greek makes it a plural, “his holy places.” The “firmament” is the word of the second day of creation ([[Gen. 1:6–8]]), the vault of heaven, here called the firmament “of his power.”

      The second half looks up, and the verse’s command has been classed with Psalm 148’s summons to angels, sun, and moon ([[Ps. 148:1–4]]), while the commands of verses 2–5 belong to the worship of the temple. One older reading takes both halves of heaven: the sanctuary is the heavenly temple, and the two phrases together “designate that which is heavenly, belonging to the other world, as an object of praise.”

      What a worshipper needed in order to stand in the Lord’s holy place on earth is told at [[Ps. 24:3]].
    sources: [oshb-wlc, lxx-rahlfs, bdb, delitzsch-psalms]

  - ref: 2
    phrase: according to his excellent greatness
    kind: words
    title: 'The psalm’s only reasons: what God has done and what He is'
    body: |
      Verse 2 holds every reason the psalm gives for praise, and there are two: God’s deeds and God’s own greatness. “Mighty acts” is a plural, the word for the mighty deeds of God that is found again at [[Ps. 106:2]] and [[Ps. 145:4]]. The psalm names none of them.

      The second half moves from what He has done to what He is. Behind “excellent” the Hebrew has *the abundance of his greatness*, and the Greek has “according to his abundant greatness.” The two halves have different prepositions in Hebrew, as they do in English: praise Him *for*, on account of, His acts, and *according to* His greatness.
    sources: [bdb, lxx-rahlfs]

  - ref: 3
    phrase: the sound of the trumpet
    kind: history
    title: The horn and the temple’s instruments
    body: |
      Most of the instruments of verses 3–5 are those of Israel’s worship at the temple, but the horn that leads them was mostly an instrument of war and only rarely a sacred one. What each one was is known only roughly, since “little is known about the form or character of Hebrew music.”

      **The trumpet** is the *shofar*, “a curved horn, as of cow or ram.” It is not the pair of silver trumpets made for the sons of Aaron ([[Num. 10:2]], [[Num. 10:8]]), which have another name in Hebrew. The horn is the sound of Sinai, “the voice of the trumpet exceeding loud” ([[Ex. 19:16]]), and of the day David and all Israel brought up the ark “with shouting, and with the sound of the trumpet” ([[2 Sam. 6:15]]).

      **Psaltery and harp** are probably a harp (or lute) and a lyre. With cymbals they are the instruments David had the Levites appointed to play ([[1 Chr. 15:16]]), and the Levites hold them at the dedication of Solomon’s temple, standing east of the altar beside a hundred and twenty priests with trumpets ([[2 Chr. 5:12]]). When players and singers there “were as one, to make one sound to be heard in praising and thanking the LORD,” the house “was filled with a cloud” ([[2 Chr. 5:13]]). That passage has been read as pointing “to the music and singing itself as the behavior that directly led to the presence of God entering into the temple.”

      **Stringed instruments and organs** are strings and, by one ancient rendering, “a reed-pipe or flute,” though what the second was is not certain. It is the instrument named with the harp in one of scripture’s earliest references to music ([[Gen. 4:21]]).

      **The two kinds of cymbals** end the list. The second are cymbals of *teruah*, a “shout or blast of war, alarm, or joy,” which is the word for the shouting that went up with the ark.
    sources: [bdb, oshb-wlc, hopkin-psalms-sung, bd-music]

  - ref: 4
    phrase: the timbrel and dance
    kind: scripture
    title: Timbrel and dance are the sound of triumph
    body: |
      The timbrel and the dance are how scripture shows Israel rejoicing after a deliverance, and the timbrel is most often in the hands of women. It is a small drum or tambourine, “held and struck with hand, especially by dancing women,” and it marks exultation and triumph. So it was at the shore of the Red Sea: “Miriam the prophetess, the sister of Aaron, took a timbrel in her hand; and all the women went out after her with timbrels and with dances” ([[Ex. 15:20]]). In a procession of singers and players, “among them were the damsels playing with timbrels” ([[Ps. 68:25]]). And when the ark came to Jerusalem, “David danced before the LORD with all his might” ([[2 Sam. 6:14]]).

      Dance in the Old Testament is a token of joy, and in these last psalms it is an act of praise. The psalm before this one has the same two Hebrew words: “Let them praise his name in the dance: let them sing praises unto him with the timbrel and harp” ([[Ps. 149:3]]).

      Restoration scripture keeps the dance among the ways of praise. The Lord’s word to the camp of Israel at Winter Quarters reads: “If thou art merry, praise the Lord with singing, with music, with dancing, and with a prayer of praise and thanksgiving” ([[D&C 136:28]]).
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 6
    phrase: every thing that hath breath
    kind: words
    title: Everything that breathes
    body: |
      The last verse finally says who is to praise, and the answer is everything that breathes. Ten times the psalm has commanded “praise him” without naming anyone. Here the grammar changes from the plural command to the third person, “let … praise,” and its subject is *all the breath*.

      “Breath” is *neshamah*, the word of the creation of man: the Lord God “breathed into his nostrils the breath of life; and man became a living soul” ([[Gen. 2:7]]). The phrase as a whole means “every breathing thing.” One reading takes it of “all mankind”: the instruments show that the call so far has been “to Israel especially,” and the last verse opens it to everyone who has the breath of life that God gave.
    sources: [oshb-wlc, bdb, delitzsch-psalms]

  - ref: 6
    phrase: Praise ye the LORD
    kind: structure
    title: The fifth book closes with a whole psalm
    body: |
      The closing hallelujah ends the fifth of the Psalter’s five books as well as this psalm, and where the other four books end with a verse of blessing, this one ends with a whole psalm of command. The book is in five divisions (Psalms 1–41, 42–72, 73–89, 90–106, and 107–150), each ending in praise; that is the Church’s standard account of its shape. The first four endings are a verse or two each:

      - “Blessed be the LORD God of Israel from everlasting, and to everlasting. Amen, and Amen” ([[Ps. 41:13]]).
      - “And blessed be his glorious name for ever: and let the whole earth be filled with his glory; Amen, and Amen” ([[Ps. 72:19]]).
      - “Blessed be the LORD for evermore. Amen, and Amen” ([[Ps. 89:52]]).
      - “Blessed be the LORD God of Israel from everlasting to everlasting: and let all the people say, Amen. Praise ye the LORD” ([[Ps. 106:48]]).

      Such a line is called a doxology, a “formal declaration of God’s power and glory.” The fifth book ends with a whole psalm: Psalm 150 “is itself a doxology,” and it closes the collection as well as its last book.

      Set beside the other four, the last ending differs in two ways a reader can check. The four open by calling the Lord blessed, a statement about Him; Psalm 150 speaks to the worshippers and is all command. And the four end in “Amen,” the people’s assent, with hallelujah added only in the fourth. Here the hallelujah stands alone, and the verb behind it is used thirteen times in six verses.

      That verb is also the book’s name. The Psalms “are called in Hebrew Tehillim or ‘Praises,’” a word from the same root as hallelujah. The collection named Praises ends by commanding what it is called.
    sources: [scripture-helps-ps-1, ot-manual-psalms, bd-psalms, oshb-wlc]

christ: |
  The psalm’s first and last word carries a name. *Yah* in hallelujah is the short form of Jehovah, and “Jehovah is the premortal Jesus Christ.” The One to be praised in the sanctuary and the firmament, for His mighty acts and His greatness, by everything that has breath, is the Lord who later “came to earth as a son of Mary.”

  The New Testament hears the word in heaven. In John’s vision “a great voice of much people in heaven” says “Alleluia” ([[Rev. 19:1]]), the elders and the four beasts answer “Amen; Alleluia” ([[Rev. 19:4]]), and then comes a sound like many waters and mighty thunderings: “Alleluia: for the Lord God omnipotent reigneth” ([[Rev. 19:6]]). It is the chapter in which the marriage supper of the Lamb is made ready.

explore: |
  - **Every creature.** [[Rev. 5:11–14]], where John hears every creature in heaven, on earth, and in the sea give blessing and honor to Him that sits on the throne and to the Lamb; and Psalm 148, which summons praise from the heavens and then from the earth.
  - **The music of the temple.** [[1 Chr. 15:16–28]], the Levites appointed to their instruments, and [[2 Chr. 5:11–14]], the cloud that filled the house as they played.
  - **The song of the heart.** [[D&C 25:12]]: “My soul delighteth in the song of the heart; yea, the song of the righteous is a prayer unto me.”
  - **The four other endings.** [[Ps. 41:13]], [[Ps. 72:18–20]], [[Ps. 89:52]], and [[Ps. 106:48]], each read with the psalm it closes.
  - **Music and the temple.** “The Psalms Sung: The Power of Music in Sacred Worship,” a Religious Studies Center study, on the Levites’ singing and what the psalms were for.

parallels:
  - ref: Rev. 19:1–6
    note: A great multitude in heaven cries Alleluia, the psalm’s first and last word, as the marriage supper of the Lamb is made ready.
  - ref: D&C 136:28
    note: The Lord tells the camp of Israel to praise Him with singing, music, dancing, and a prayer of praise and thanksgiving.

