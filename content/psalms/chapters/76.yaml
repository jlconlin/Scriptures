chapter: 76
title: Known in Judah, Feared by Kings
tagline: A song of Zion after a battle that God ended with a word. It begins with one city where He is known and ends with the kings of the earth, and between them He rises to judge and to save the meek.
when: 'Undated; a psalm of Asaph by its title. The Greek title adds “for the Assyrian”'

setting: |
  The title gives the psalm to Asaph, the Levite whose name stands over Psalm 50 and Psalms 73–83 (see [[Ps. 50:1]]). It names no occasion.

  The psalm tells of weapons broken at Zion and of an army that fell asleep and did not rise (verses 3–6). Two earlier psalms of the city of God have lines like these: in one He “breaketh the bow, and cutteth the spear in sunder” ([[Ps. 46:9]]), and in the other the kings “were troubled, and hasted away” ([[Ps. 48:5]]). The ancient Greek translation adds a line to this psalm’s title that names the Assyrian, and the psalm has been read as a song for the night Sennacherib’s army died outside Jerusalem in Hezekiah’s reign. The second note on verse 5 gives that reading and what it rests on.

  No single voice is heard, and no “I.” The psalm speaks about God and to Him by turns, and in verse 11 to the congregation. Selah closes verses 3 and 9 (on the word, see [[Ps. 3:2]]).

  The question of verse 7, who can stand when God is angry, is asked again in [[Rev. 6:17]] (see the second note on verse 7).

thread: |
  Psalm 76 begins with where God is known and ends with who must fear Him. **It moves outward from one city to the whole earth: from Judah, Salem and Zion in its first two verses to “the kings of the earth” in its last.**

  Read in four parts of three verses each, it has Selah at the close of the first and the third.

  The first part (verses 1–3) names the place and says in one line what happened there: He broke the bow, the shield, the sword and the battle. What is broken is weaponry. The second (verses 4–6) turns to speak to God, “Thou,” and shows the field afterward. The strong men sleep, their hands will not answer them, and chariot and horse lie still, all “at thy rebuke.”

  The turn is at verse 7: “Thou, even thou, art to be feared.” The psalm stops telling what happened and says who He is, and the scene widens from a battlefield to a court. Judgment is heard “from heaven,” and it is “the earth,” not an army, that fears and falls silent. Verse 9 gives the purpose of His rising: “to save all the meek of the earth.” The earth’s fear and the rescue of the meek come in one sentence.

  The last part draws the consequences. Human wrath ends in God’s praise (verse 10); His own people are to pay what they vowed, and those round about are to bring gifts (verse 11); to princes and kings He is “terrible” (verse 12). The Hebrew word for fear enters at verse 7 and comes four times before the psalm closes (see the note on verse 7).

sections:
  - range: 1-3
    heading: Where God is known
    plain: |
      God is known in Judah; His name is great in Israel. His abode is in Salem, and His dwelling place in Zion. There He broke the flashing arrows of the bow, the shield, the sword, and the weapons of war.
  - range: 4-6
    heading: The field afterward
    plain: |
      You are glorious, more majestic than the mountains of prey. The stouthearted have been plundered. They have sunk into their sleep, and not one of the men of might could lift a hand. At Your rebuke, God of Jacob, chariot and horse alike lay in a dead sleep.
  - range: 7-9
    heading: The Judge rises
    plain: |
      You, You are to be feared. Who can stand before You once You are angry? From heaven You made judgment heard; the earth feared and was still, when God rose up to judge, to save all the meek of the earth.
  - range: 10-12
    heading: Vows, gifts and the fear of kings
    plain: |
      Surely human wrath will praise You, and what remains of wrath You will restrain (the Hebrew of this line is uncertain; see the note on verse 10). Make vows to the LORD your God and pay them. Let all who are around Him bring gifts to the One who is to be feared. He cuts off the spirit of princes; He is fearsome to the kings of the earth.

notes:
  - ref: 0
    phrase: on Neginoth, A Psalm or Song of Asaph
    kind: words
    title: Strings, Asaph, and a line the Greek adds
    body: |
      The title’s terms are explained at the psalms where each first stands, and the Greek title adds a line the Hebrew lacks. Neginoth, a direction for stringed instruments, is at [[Ps. 4:1]]; “To the chief Musician” is at [[Ps. 8:1]]; Asaph is at [[Ps. 50:1]].

      The Hebrew title names no occasion. The ancient Greek translation ends its title with “a Song for the Assyrian.” That line bears on the sleepers of verse 5 and is taken up in the second note there.
    sources: [lds-scriptures, nrsvue, lxx-rahlfs]
  - ref: 2
    phrase: In Salem also is his tabernacle
    kind: words
    title: Salem, and a word for a lion’s covert
    body: |
      Salem is an old name for Jerusalem, and the word behind “tabernacle” is not a tent but a covert. Salem was “the home of Melchizedek,” the city of “Melchizedek king of Salem” ([[Gen. 14:18]]), and its name is “easily identified as Jerusalem.” The second half of the line sets Zion beside it. The Greek translators took the name as a common noun and wrote “his place has been in peace.”

      The King James’s “tabernacle” can suggest the tent of the wilderness, but the Hebrew noun here means “thicket, covert, lair.” Jeremiah uses it when the LORD leaves His land to judgment: “He hath forsaken his covert, as the lion” ([[Jer. 25:38]]). The word paired with it, “dwelling place,” is elsewhere the “den, lair of wild beasts.” The first has been read in this verse of the LORD “under figure of lion,” and the second of His “dwelling in temple.” A modern translation keeps to the plainer “abode.”
    sources: [bd-salem, lxx-rahlfs, bdb, nrsvue, lds-scriptures]
  - ref: 4
    phrase: the mountains of prey
    kind: symbol
    title: Mountains of prey
    body: |
      What the mountains of prey are is uncertain, and the ancient Greek translation already reads something else. The Hebrew word is “prey,” first of all the “prey of lion.”

      Read with the King James, the line is a comparison, and the mountains of prey are something God outshines. The same Hebrew has also been read as the place He comes from, “coming down from mountains of prey,” the lion’s lair, though that reading is offered with the caution that the Hebrew may need correcting (on the lion of verse 2, see the note there).

      The Greek translators have neither: “Thou dost wonderfully shine forth from the everlasting mountains.” A modern translation follows the Greek, “than the everlasting mountains,” and gives the Hebrew in a footnote.
    sources: [bdb, lxx-rahlfs, nrsvue]
  - ref: 5
    phrase: The stouthearted are spoiled
    kind: words
    title: Spoiled means plundered
    body: |
      “Spoiled” here means plundered. The Hebrew verb is to “spoil, plunder,” and a modern translation has “The courageous were stripped of their spoil.”

      For the end of the verse, where the King James has “none of the men of might have found their hands,” that modern translation says that none of them “was able to lift a hand.”
    sources: [bdb, nrsvue]
  - ref: 5
    phrase: they have slept their sleep
    kind: history
    title: The sleepers, and the Greek title’s Assyrian
    body: |
      The sleep is death, and the ancient Greek title says whose. The verb behind “cast into a dead sleep” in verse 6 is used there “of sleep of death,” and Jeremiah says of Babylon’s mighty men that “they shall sleep a perpetual sleep, and not wake” ([[Jer. 51:57]]).

      The psalm does not name the army. The ancient Greek translation does, in its title: “a Song for the Assyrian.” On that reading the psalm answers to “the overthrow of the army of Assyria before Jerusalem,” when Sennacherib’s forces threatened the city: “And it came to pass that night, that the angel of the LORD went out, and smote in the camp of the Assyrians an hundred fourscore and five thousand: and when they arose early in the morning, behold, they were all dead corpses” ([[2 Kgs. 19:35]]).

      This is a reading, and an old one; the Hebrew text leaves the enemy unnamed. Isaiah’s account of the night is on the site at [[Isa. 37:36]].

      “Both the chariot and horse” in verse 6 has been heard as “an allusion to Exodus 15,” the song at the sea: “the horse and his rider hath he thrown into the sea” ([[Ex. 15:1]]).
    sources: [bdb, lxx-rahlfs, delitzsch-psalms, lds-scriptures]
  - ref: 7
    phrase: Thou, even thou, art to be feared
    kind: words
    title: One Hebrew word for fear, four times
    body: |
      From this verse to the end the psalm keeps returning to one Hebrew root, four times in six verses. God is “to be feared” (verse 7). The earth “feared” (verse 8). He is “him that ought to be feared” (verse 11), a single noun that comes from the same verb. And He is “terrible to the kings of the earth” (verse 12), where the Hebrew is the very form of verse 7.

      “Terrible” here does not mean bad. The form in verses 7 and 12 means to “cause astonishment and awe,” and is used in both of God Himself. A modern translation has “But you indeed are awesome!” in verse 7, “to the one who is awesome” in verse 11, and “who inspires fear in the kings of the earth” in verse 12.

      The word’s reach widens as the psalm goes on: the earth fears in verse 8, those round about bring gifts to the One who is feared in verse 11, and in verse 12 it is to the kings of the earth that He is terrible.
    sources: [oshb-wlc, strongs-concordance, bdb, nrsvue]
  - ref: 7
    phrase: who may stand in thy sight
    kind: scripture
    title: The question asked again before the Lamb
    body: |
      The psalm’s question is asked again at the opening of the sixth seal, and there the anger is the Lamb’s. The Church’s footnote on “stand” gives two passages. In John’s vision men call on the mountains and rocks to hide them “from the wrath of the Lamb” ([[Rev. 6:16]]): “For the great day of his wrath is come; and who shall be able to stand?” ([[Rev. 6:17]]).

      The other passage is a psalm that asks the question of sin and not of armies: “O Lord, who shall stand?” ([[Ps. 130:3]]). Its next verse answers, “But there is forgiveness with thee, that thou mayest be feared” ([[Ps. 130:4]]), and “feared” there is the verb of this psalm. In Psalm 130 the fear of God follows from forgiveness.
    sources: [lds-scriptures, bdb]
  - ref: 9
    phrase: to save all the meek of the earth
    kind: scripture
    title: Judgment that saves the meek of the earth
    body: |
      God’s rising to judge is a rescue in this verse, and the people rescued are named in a phrase Isaiah uses of the Messiah’s rule. The Hebrew word names the “poor, afflicted, humble, meek,” and in this phrase particularly the “poor and weak,” those “oppressed by rich and powerful.” A modern translation has “to save all the oppressed of the earth.”

      The same Hebrew words stand in Isaiah’s prophecy of the rod from the stem of Jesse: “with righteousness shall he judge the poor, and reprove with equity for the meek of the earth” ([[Isa. 11:4]]). The Church’s edition heads that prophecy as one of Christ. Zephaniah, where the Church’s footnote on this verse points, speaks to them directly: “Seek ye the LORD, all ye meek of the earth” ([[Zeph. 2:3]]).

      For the meek who inherit the earth, see the note on [[Ps. 25:13]].
    sources: [bdb, nrsvue, oshb-wlc, lds-scriptures]
  - ref: 10
    phrase: the remainder of wrath shalt thou restrain
    kind: words
    title: 'The remainder of wrath: restrained, or girded on'
    body: |
      The second half of this verse is uncertain, and “restrain” is one attempt at it. The Hebrew verb means to “gird, gird on, gird oneself,” so the line would say “with a remnant (residue) of wraths thou girdest thyself,” a rendering the lexicon that gives it calls “very doubtful.”

      The first half is plainer in the King James: the rage of men “must ultimately redound to Thy glory.” What, then, is the remainder? On one reading it is God’s own wrath, “the infinite store of wrath still available to God after human rage has done its utmost,” with which He arms Himself. A modern translation takes it so and supplies a word the Hebrew lacks: “when you bind the last bit of your wrath around you.” In the King James the remainder is man’s wrath, and God holds it back.

      The Hebrew as it stands does not settle which is right.
    sources: [bdb, delitzsch-psalms, nrsvue]
  - ref: 11
    phrase: bring presents unto him that ought to be feared
    kind: history
    title: Gifts for the One who is feared
    body: |
      The verse has been read as two commands to two groups, and Chronicles records gifts like those of the second being brought. On that reading “Vow, and pay” is said to the LORD’s own people, and “the preponderance falls upon the second imperative,” the paying (on vows, see the note on [[Ps. 56:12]]). “All that be round about him” are “all the peoples dwelling round about Him and His people,” and they are to bring gifts.

      On the reading that the psalm follows Sennacherib’s fall (see the second note on verse 5), the summons has been connected with what Chronicles tells next: “And many brought gifts unto the LORD to Jerusalem, and presents to Hezekiah king of Judah” ([[2 Chr. 32:23]]).

      “Him that ought to be feared” is one Hebrew noun. It means an “object of reverence, especially God,” and Isaiah uses the same noun the same way: “let him be your fear” ([[Isa. 8:13]]).
    sources: [delitzsch-psalms, bdb, oshb-wlc, lds-scriptures]
  - ref: 12
    phrase: He shall cut off the spirit of princes
    kind: symbol
    title: The vintager’s verb
    body: |
      “Cut off” translates the verb used for cutting grapes from the vine, here as a figure for taking away. Its participle is the word for “grape-gathering,” and in this verse it is “figurative cut off (= take away),” with the spirit of princes as what is cut. The Greek has “takes away the spirits of princes.”

      The psalm’s last line then has the word of verse 7 once more (see the first note there).
    sources: [bdb, lxx-rahlfs]

christ: |
  Psalm 76 sings of God as the Judge who rises to save, and scripture gives that office to the Son: “For the Father judgeth no man, but hath committed all judgment unto the Son” ([[John 5:22]]).

  Two of the psalm’s lines return in passages about Him. Its question, “who may stand in thy sight when once thou art angry?”, is asked again in John’s vision, where the wrath is “the wrath of the Lamb” ([[Rev. 6:16]]); the Church’s footnote on verse 7 points there. And “the meek of the earth,” whom the psalm’s Judge rises to save, are in the same Hebrew words those for whom the rod from the stem of Jesse will “reprove with equity” ([[Isa. 11:4]]), a prophecy the Church’s edition heads as one of Christ. The notes on verses 7 and 9 follow both.

explore: |
  - **Two other songs of the city of God.** [[Ps. 46:8–10]], where He breaks the bow, and [[Ps. 48:4–8]], where the kings see the city and flee.
  - **The night the psalm has been read of.** [[2 Kgs. 19:32–37]] and [[2 Chr. 32:20–23]]; Isaiah’s account is on the site at [[Isa. 37:36]].
  - **Who shall stand.** [[Ps. 130:3–4]], [[Mal. 3:2]] and [[Rev. 6:12–17]].
  - **The Judge of the meek.** [[Isa. 11:1–5]], [[Zeph. 2:3]] and [[Ps. 37:11]].

parallels:
  - ref: 2 Kgs. 19:35
    note: The night the Assyrian camp died, of which the psalm has been read since the Greek title.
  - ref: Ps. 46:9
    note: God breaks the bow and makes wars cease.
  - ref: Rev. 6:17
    note: The question of verse 7 asked of the wrath of the Lamb.
  - ref: Isa. 11:4
    note: The rod from the stem of Jesse judges for “the meek of the earth,” the phrase of verse 9.
  - ref: 2 Chr. 32:23
    note: Gifts brought to the LORD at Jerusalem after Sennacherib’s fall (verse 11).

