chapter: 134
title: Bless Ye the LORD
tagline: The last pilgrim song calls on the servants who stand in the temple by night to bless the LORD, and a voice answers with His blessing out of Zion.
when: 'Undated; the title names no author'

setting: |
  Psalm 134 is the last of the fifteen songs of degrees, the pilgrim songs whose heading is explained at [[Ps. 120:1]]. It names no author and gives no date. It is three verses long, and each verse names the temple: “the house of the LORD,” “the sanctuary,” “Zion.”

  It is tied to the psalms on either side. The one before it opens with the same word, “Behold,” and ends on Zion, where “the LORD commanded the blessing, even life for evermore” ([[Ps. 133:3]]). The one after it takes up its address nearly word for word: “Ye that stand in the house of the LORD, in the courts of the house of our God” ([[Ps. 135:2]]).

  The first of the fifteen is a sojourner’s complaint: “Woe is me, that I sojourn in Mesech” ([[Ps. 120:5]]). The last speaks to those who stand in the LORD’s house by night. One older reading holds that it was “purposely placed at the end of the collection of Songs of degrees” and calls it “an appropriate finale.”

thread: |
  The psalm says “bless” three times, and **the third time the blessing runs the other way: two verses send it up to the LORD, and the last brings it down from Him.**

  Verses 1–2 are a call. Someone summons the LORD’s servants who stand in His house by night to bless Him, and to lift their hands as they do it. It is a hymn of praise (the kind is described in the background to [[Ps. 29]]), and nearly all of it is the call to praise. All it says of Him is one clause in the last verse: “that made heaven and earth.”

  Verse 3 changes the number. The call was to many, “ye”; the blessing is on one, “thee.” The psalm does not say who speaks either part. One older reading takes the psalm as “a greeting” and “the reply thereto”: a congregation calls to “the priests and Levites entrusted with the night-service in the Temple,” and those servants answer with a blessing on the people.

  The servants are asked for praise. What comes back is the LORD’s own blessing, from the Maker of heaven and earth, out of Zion.

sections:
  - range: 1-2
    heading: Bless ye the LORD
    plain: |
      Come, bless the LORD, all you servants of the LORD, who stand in the LORD’s house through the nights. Lift up your hands toward the holy place, and bless the LORD.
  - range: 3
    heading: The LORD bless thee out of Zion
    plain: |
      May the LORD, the Maker of heaven and earth, bless you from Zion.

notes:
  - ref: 1
    phrase: which by night stand in the house of the LORD
    kind: history
    title: Who stands in the house by night
    body: |
      The servants who stand in the LORD’s house by night are most likely the priests and Levites on duty there, because standing is what scripture says of their service. The tribe of Levi was set apart “to stand before the LORD to minister unto him, and to bless in his name” ([[Deut. 10:8]]), and David appointed Levites “to stand every morning to thank and praise the LORD, and likewise at even” ([[1 Chr. 23:30]]). The next psalm repeats this one’s address and then names them: “Bless the LORD, O house of Levi” ([[Ps. 135:20]]).

      Their work did not stop at dark. The Levite singers “were employed in that work day and night” ([[1 Chr. 9:33]]), the verse the Church’s edition sets beside “night” here, and the Levites who kept the gates “lodged round about the house of God, because the charge was upon them, and the opening thereof every morning pertained to them” ([[1 Chr. 9:27]]). On that evidence the psalm speaks to those whose duty kept them at the house through the night, and it calls on them to bless the LORD there.
    sources: [lds-scriptures]
  - ref: 2
    phrase: Lift up your hands in the sanctuary
    kind: symbol
    title: Hands lifted in the holy place, or toward it
    body: |
      The servants are told to lift their hands, and translations differ over whether that is done in the sanctuary or toward it. The King James has “in the sanctuary,” and the ancient Greek agrees (“in the sanctuaries”). A modern translation has “Lift up your hands to the holy place.”

      An earlier psalm has the gesture with its direction stated. Its speaker prays “when I lift up my hands toward thy holy oracle” ([[Ps. 28:2]]); the notes there explain the word and the gesture. Psalm 134 itself does not settle which is meant, and in both renderings the hands are raised in prayer at the LORD’s house.
    sources: [nrsvue, lxx-rahlfs, lds-scriptures]
  - ref: 3
    phrase: bless thee out of Zion
    kind: scripture
    title: The blessing returned, in the priests’ words and to one person
    body: |
      Verse 3 answers the call with a blessing that goes the other way, and it is spoken to one person: “thee,” where verses 1–2 said “ye.” On one older reading the people have called up to the temple hill and now receive “from above the benedictory counter-greeting.” The words are those of the priests’ blessing. The blessing the LORD gave Aaron and his sons to say over Israel begins, “The LORD bless thee, and keep thee” ([[Num. 6:24]]), and it too says “thee.” The same reading takes the singular to mean that the blessing “is addressed to the church as one person, and to each individual” in it.

      The two blessings are different acts. When people bless God, the verb means to “bless God, adore with bended knees”: it is praise. His blessing of people is a separate sense of the word, and the psalm before this one says what His blessing at Zion is: “there the LORD commanded the blessing, even life for evermore” ([[Ps. 133:3]]).

      The verse’s other two phrases, “that made heaven and earth” and “out of Zion,” have both been heard earlier in the songs of degrees; see the notes on [[Ps. 124:8]] and [[Ps. 128:5]].
    sources: [delitzsch-psalms, bdb, lds-scriptures]

christ: |
  The LORD who is blessed in this psalm and who blesses out of Zion is Jehovah, the Savior before His birth ([[Ps. 110:1]] has the note). The psalm’s one description of Him is that He “made heaven and earth,” and the risen Christ said the same of Himself to the Nephites: “I created the heavens and the earth, and all things that in them are” ([[3 Ne. 9:15]]).

explore: |
  - **The priests’ blessing.** [[Num. 6:22–27]], whose first words verse 3 uses; the note at [[Ps. 4:6]] treats it.
  - **The psalm that answers this one.** [[Ps. 135:1–3]] and [[Ps. 135:19–21]], which opens with the servants who stand in the house and closes with “Bless the LORD.”
  - **Blessing in both directions.** [[Ps. 115:12–18]], where the LORD blesses Israel, the house of Aaron and those who fear Him, and they bless Him in return.
  - **The temple in the Psalms.** The note at [[Ps. 24:3]], on ascending the hill of the Lord.

parallels:
  - ref: Ps. 135:1–2
    note: The next psalm opens with this psalm’s address to the servants who stand in the house of the LORD.
  - ref: Num. 6:24
    note: The priests’ blessing begins with the words of verse 3, “The LORD bless thee.”
  - ref: Ps. 128:5
    note: An earlier song of degrees has the same blessing out of Zion.
  - ref: Ps. 124:8
    note: The LORD “who made heaven and earth,” as in verse 3 (also Ps. 121:2; Ps. 115:15).
  - ref: 1 Chr. 9:33
    note: Levite singers were at their work in the house day and night.

