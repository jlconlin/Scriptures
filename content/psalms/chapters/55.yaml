chapter: 55
title: Cast Thy Burden upon the Lord
tagline: A man who wants only to fly from a violent city finds that the blow came from his closest friend, and stays to pray three times a day.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  The title ascribes the psalm to David and names no occasion in his life. What can be known of the speaker’s trouble comes from the psalm itself.

  He is in a city. He has “seen violence and strife” in it; something goes about on its walls day and night, and “deceit and guile depart not from her streets” (verses 9–11). He is afraid for his life, and what he wants is to be gone: wings, the wilderness, a shelter from the storm.

  Then the psalm names what hurts most. The reproach did not come from an enemy. It came from “a man mine equal,” a friend with whom he “walked unto the house of God in company” (verses 13–14), whose smooth words covered a drawn sword (verse 21). One older reading finds this friend in Ahithophel, David’s counsellor, who went over to Absalom; the note on verse 12 gives it, and what it rests on.

  The psalm is a lament, and [[Ps. 22:1]] sets out the parts of one. It says “God” nearly throughout, as the psalms around it do; the name “the LORD” comes only twice, at verse 16 and verse 22. Another psalm of David by its title complains of a familiar friend who turned ([[Ps. 41:9]]), and that is the verse the Savior quoted at the Last Supper.

thread: |
  Psalm 55 moves through **flight, anger, and trust**, and the turn is at verse 16: “As for me, I will call upon God.”

  It opens in fear. The speaker cannot be still in his complaint (verse 2), and his first wish is not to win but to leave: “Oh that I had wings like a dove!” (verse 6). The wish is not granted and is not mentioned again. In the middle of the psalm fear gives way to anger, at the city and then at one man. Twice the speaker stops speaking of “them” and speaks of “him”: at verses 12–14, where he addresses the friend to his face, and at verses 20–21, after the turn, where the betrayal comes back as though the prayer had not yet closed it.

  What changes at verse 16 is not the situation. The enemies are still there at verse 23. The speaker says “He hath delivered my soul” (verse 18) while the battle is still against him, a past tense that has been explained as “the certainty of faith.” The complaint of verse 2 has become a prayer made “evening, and morning, and at noon.”

  The last two verses hold both moods. Someone is told, “Cast thy burden upon the LORD,” and the wicked are sent down to the pit. The psalm’s final words are the speaker’s own, with nothing yet settled: “but I will trust in thee.”

sections:
  - range: 1-3
    heading: Hide not thyself
    plain: |
      Listen to my prayer, O God, and do not hide from my plea. Attend to me and answer me. I am restless in my complaint and I moan, because of the enemy’s voice and the pressure of the wicked. They bring trouble down on me, and in anger they hate me.
  - range: 4-8
    heading: Wings like a dove
    plain: |
      My heart twists inside me, and the terrors of death have fallen on me. Fear and trembling come over me; horror covers me. And I said, If only I had wings like a dove! I would fly away and be at rest. I would go far off and lodge in the wilderness. I would hurry to a shelter from the driving wind and the storm.
  - range: 9-11
    heading: Violence in the city
    plain: |
      Destroy them, O Lord; divide their speech, for I have seen violence and strife in the city. Day and night they go around it on its walls, and mischief and sorrow are inside it. Wickedness is in the middle of it; deceit and guile never leave its streets.
  - range: 12-15
    heading: It was thou
    plain: |
      It was not an enemy who reproached me; that I could have borne. It was not one who hated me who raised himself against me; from him I could have hidden. It was you, a man my equal, my companion and my close friend. We shared sweet counsel together and walked to the house of God in company. Let death take them by surprise; let them go down alive to the world of the dead, for wickedness is in their homes and among them.
  - range: 16-19
    heading: As for me, I will call upon God
    plain: |
      As for me, I will call on God, and the LORD will save me. Evening, morning, and noon I will pray and cry aloud, and He will hear my voice. He has delivered my soul in peace from the battle that was against me, for there were many with me. God, who has sat enthroned from of old, will hear and will humble them. They have no changes, and so they do not fear God.
  - range: 20-21
    heading: Smoother than butter
    plain: |
      He has put out his hands against those who were at peace with him; he has broken his covenant. The words of his mouth were smoother than butter, but war was in his heart. His words were softer than oil, and yet they were drawn swords.
  - range: 22-23
    heading: Cast thy burden
    plain: |
      Cast your burden on the LORD, and He will sustain you; He will never let the righteous be moved. But You, O God, will bring them down to the pit of destruction. Men of blood and deceit will not live out half their days. But I will trust in You.

notes:
  - ref: 0
    phrase: on Neginoth, Maschil
    kind: words
    title: The title’s terms
    body: |
      The title names no occasion, and each of its terms is explained where it first appears: “Neginoth” at [[Ps. 4:1]], “Maschil” at [[Ps. 32:1]], and “To the chief Musician” at [[Ps. 8:1]]. A modern translation prints the whole title as “To the leader: with stringed instruments. A Maskil of David.”
    sources: [nrsvue]

  - ref: 9
    phrase: divide their tongues
    kind: scripture
    title: The word of Babel, used of a plot
    body: |
      The prayer against the city asks God to do to its plotters what He did at Babel. The Hebrew verb “divide” occurs only here in the Psalms. It is the verb of the verse that names Peleg, “for in his days was the earth divided” ([[Gen. 10:25]]), in the chapter before the tower, where the LORD confounds the builders’ language so “that they may not understand one another’s speech” ([[Gen. 11:7]]). One older commentary hears in the word a “retrospective reference to the confusion of tongues at Babel.”

      What is to be divided is “their speech (their counsels)”: the agreement of the people working against him. A modern translation has “Confuse, O Lord, confound their speech.” The speaker does not ask for strength to answer them. He asks that they stop understanding one another.
    sources: [oshb-wlc, bdb, delitzsch-psalms, nrsvue]

  - ref: 12
    phrase: it was not an enemy that reproached me
    kind: history
    title: Who the friend was
    body: |
      The psalm does not name the friend, and its title names no occasion. One older reading, working from the title’s ascription to David, identifies him as Ahithophel: “This Old Testament Judas is none other than Ahithphel, the right hand of Absalom.” On that reading the city is Jerusalem while Absalom’s rebellion was forming.

      Ahithophel was “David’s counsellor” ([[2 Sam. 15:12]]), and his advice was valued “as if a man had inquired at the oracle of God” ([[2 Sam. 16:23]]). When David was told that he was “among the conspirators with Absalom,” David prayed, “O LORD, I pray thee, turn the counsel of Ahithophel into foolishness” ([[2 Sam. 15:31]]).

      The identification is offered as an attempt “on the standpoint of the writer of the inscription,” beside another scholar’s view that the psalm is Jeremiah’s. The story fits; nothing in the psalm requires it. The same reading is given at [[Ps. 41:9]].
    sources: [delitzsch-psalms, lds-scriptures]

  - ref: 13
    phrase: a man mine equal, my guide, and mine acquaintance
    kind: words
    title: Three names for one friend
    body: |
      All three terms describe closeness, and none of them rank. “Mine equal” is in Hebrew “a man according to my valuation,” that is, someone the speaker counted as worth what he himself was worth. “Guide” translates a word that here means “friend, intimate,” and a modern translation renders the last two terms “my companion, my familiar friend.”

      This is the one place where the psalm speaks to a person other than God without a break: “But it was thou.” Verse 14 says what the friendship had been. The two “took sweet counsel together,” and they went together to the house of God. The verse puts the betrayal inside their worship.
    sources: [bdb, nrsvue]

  - ref: 15
    phrase: go down quick into hell
    kind: words
    title: Alive into Sheol
    body: |
      “Quick” is the old English word for “alive,” and “hell” is Sheol, the world of the dead ([[Ps. 6:5]]). A modern translation has “let them go down alive to Sheol.” The wish is for a sudden death, one that overtakes the living.

      The words are borrowed. When Korah, Dathan, and Abiram rose against Moses, he said that if the earth should “swallow them up, with all that appertain unto them, and they go down quick into the pit; then ye shall understand that these men have provoked the LORD” ([[Num. 16:30]]). The Hebrew of that verse has the same two words, “alive” and “Sheol,” and they return when it happens ([[Num. 16:33]]). The speaker asks for his betrayers the end of the best-known rebels in Israel’s story.

      The verse is a wish spoken to God. For prayers of this kind, see [[Ps. 137:8]].
    sources: [webster-1828, nrsvue, oshb-wlc, lds-scriptures]

  - ref: 17
    phrase: Evening, and morning, and at noon
    kind: words
    title: The complaint becomes the prayer
    body: |
      What the speaker does three times a day is what he was doing in verse 2. The Hebrew verb translated “pray” is formed from the noun translated “complaint” there, and its sense in this verse is “complain.” The verb translated “cry aloud” means to “murmur,” used of the soul “in prayer.” A modern translation keeps the tie, so that what he does evening, morning, and noon is “I utter my complaint and moan.”

      So the turn of verse 16 does not replace the complaint with something calmer. The same sounds are now made at set times and to God, with the confidence that “he shall hear my voice.”

      Daniel in Babylon “kneeled upon his knees three times a day, and prayed” ([[Dan. 6:10]]). Amulek told the poor among the Zoramites, “Cry unto him in your houses, yea, over all your household, both morning, mid-day, and evening” ([[Alma 34:21]]).
    sources: [bdb, nrsvue, oshb-wlc, lds-scriptures]

  - ref: 18
    phrase: for there were many with me
    kind: words
    title: With me, or against me
    body: |
      Translators do not agree whether the “many” of this line are friends or enemies. The King James Version reads them as allies: the speaker was delivered because many stood with him. A modern translation reads the opposite, “for many are arrayed against me,” so that the line gives the size of the danger and not the reason for the rescue. The ancient Greek translation has a third sense: “for they were with me in many cases.”

      The first half of the verse is plain in all three: it is God who delivers his soul “in peace.” Which way the second half is taken does not change that.
    sources: [nrsvue, lxx-rahlfs]

  - ref: 19
    phrase: Because they have no changes
    kind: words
    title: A line no one is sure of
    body: |
      The Hebrew says that the wicked have no “changes,” and what that means is uncertain. The word is used elsewhere for a change of clothing and for relays of workers. Here it has been taken of the course of a life: they are people “with whom are no changings, i.e. they do evil incessantly, steadily.” The same lexicon entry grants that “the expression is peculiar and obscure” and that the text is “perhaps corrupt.”

      A modern translation follows the same sense: God will humble them “because they do not change.” The ancient Greek translation took the changes as changes of fortune: “For they suffer no reverse, and therefore they have not feared God.” On the first reading they will not repent; on the second, nothing has yet gone wrong for them. Either way the line gives the reason they do not fear God.
    sources: [bdb, nrsvue, lxx-rahlfs]

  - ref: 22
    phrase: Cast thy burden upon the LORD
    kind: words
    title: The burden is what was given
    body: |
      The word translated “burden” occurs nowhere else in the Hebrew Bible, and it means a “lot (as that which is given).” The line then tells him to cast his lot on the LORD, and the lot is “the care, anxiety, etc. which are thy portion.” A modern translation notes the alternative “Cast what he has given you.” What the speaker is to throw onto the LORD is what has been dealt to him, the betrayal included.

      The “thee” is one person, and the psalm does not say who. One older reading takes the line as “a counsel which David gives to himself, but at the same time to all who suffer innocently.”

      The promise is that the LORD “shall sustain thee.” It does not say that the lot will be taken away. The second half of the verse answers the beginning of the psalm. “Moved” is the verb “totter, shake, slip,” and it is the same verb as “cast” in verse 3, where the wicked let trouble drop on the speaker; a modern translation notes there, “Heb they cause to totter.” The LORD will not let the righteous be moved by it.

      The ancient Greek translation has “Cast thy care upon the Lord,” and in that form Peter gave the line to the Saints: “Casting all your care upon him; for he careth for you” ([[1 Pet. 5:7]]).
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs, delitzsch-psalms, lds-scriptures]

christ: |
  The LORD of this psalm is the one who hears a complaint three times a day and bears what has been given a person to carry. Beside “Cast thy burden upon the LORD” the Church’s edition of the Bible sets the Savior’s own invitation: “Come unto me, all ye that labour and are heavy laden, and I will give you rest” ([[Matt. 11:28]]). Peter, writing of the God who “careth for you,” gave the same line to the Saints ([[1 Pet. 5:7]]).

  The New Testament does not quote this psalm’s verses about the friend. It quotes the companion verse, [[Ps. 41:9]], which Jesus applied to Judas at the Last Supper ([[John 13:18]]); the note there has what He said. One older commentary reads this psalm’s friend the same way, as having in Judas Iscariot “its historical living antitype in the life and passion of the second David.” That is a reading of the commentary’s, not a statement of scripture.

explore: |
  - **The other psalm of a friend who turned.** [[Ps. 41:9]], with [[John 13:18–30]].
  - **Ahithophel’s story.** [[2 Sam. 15:12]], [[2 Sam. 15:31]], [[2 Sam. 16:23]], and [[2 Sam. 17:1–23]], for the reading that finds him in verses 12–14.
  - **Korah’s rebellion.** [[Num. 16:23–35]], the story behind verse 15.
  - **Three times a day.** [[Dan. 6:10]] and [[Alma 34:17–27]].
  - **The burden and the yoke.** [[Matt. 11:28–30]] and [[1 Pet. 5:6–7]], read with verse 22 open.
  - **“I will trust in thee.”** The psalm’s last words stand also in [[Ps. 56:3]], and “I will trust in thee” has been counted among the phrases of the Psalms in Nephi’s psalm ([[2 Ne. 4:34]]).

parallels:
  - ref: 1 Pet. 5:7
    note: Peter gives verse 22 to the Saints in the wording of the Greek translation, “care” for “burden.”
  - ref: Ps. 41:9
    note: Another psalm of David by its title complains of a familiar friend; Jesus quotes it of Judas.
  - ref: Num. 16:30
    note: Moses’s words about Korah’s company, “go down quick into the pit,” are the words of verse 15.
  - ref: 2 Sam. 15:31
    note: David prays that the counsel of Ahithophel be turned to foolishness.
  - ref: Dan. 6:10
    note: Daniel prays three times a day.
  - ref: 2 Ne. 4:34
    note: Nephi’s “I will trust in thee forever,” listed as a possible allusion to verse 23 and to Psalm 56:3.

