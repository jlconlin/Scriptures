chapter: 55
title: Cast Thy Burden upon the Lord
tagline: A man who wants only to fly from a violent city finds that the blow came from his closest friend, and prays three times a day.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  The title ascribes the psalm to David and names no occasion in his life. What can be known of the speaker’s trouble comes from the psalm itself.

  He has “seen violence and strife” in a city; they go about its walls day and night, and “deceit and guile depart not from her streets” (verses 9–11). He is afraid for his life, and what he wants is to be gone: wings, the wilderness, a shelter from the storm.

  Then the psalm names what hurts most. The reproach did not come from an enemy. It came from “a man mine equal,” a friend with whom he “walked unto the house of God in company” (verses 13–14). One older reading finds this friend in Ahithophel, David’s counsellor, who went over to Absalom (see the note on verse 12).

  The psalm is a lament, and [[Ps. 22:1]] sets out the parts of one. It says “God” nearly throughout; the name “the LORD” comes only twice, at verse 16 and verse 22. Another psalm of David by its title complains of a familiar friend who turned ([[Ps. 41:9]]).

thread: |
  Psalm 55 moves through **flight, anger, and trust**, and the turn is at verse 16: “As for me, I will call upon God.”

  It opens in fear. The speaker mourns in his complaint and makes a noise (verse 2), and his first wish is not to win but to leave: “Oh that I had wings like a dove!” (verse 6). The wish is not granted and is not mentioned again. In the middle of the psalm fear gives way to anger, at the city and then at one man. Twice the speaker stops speaking of “them” and speaks of one man: at verses 12–14, where he addresses the friend to his face, and at verses 20–21, after the turn, where a single “he” has broken his covenant. That “he” has been read as the same faithless friend, back before the speaker’s mind.

  What changes at verse 16 is not the situation. The enemies are still there at verse 23. The speaker says “He hath delivered my soul” (verse 18) while the battle is still against him, a past tense that has been explained as “the certainty of faith.” The complaint of verse 2 goes on as a prayer made “evening, and morning, and at noon.”

  The last two verses hold both moods. Someone is told, “Cast thy burden upon the LORD,” and the wicked are sent down to the pit. The psalm’s final words are the speaker’s own, with nothing yet settled: “but I will trust in thee.”

sections:
  - range: 1-3
    heading: Hide not thyself
    plain: |
      Listen to my prayer, O God, and do not hide from my plea. Attend to me and answer me. I am restless in my complaint and I moan, because of the enemy’s voice and the pressure of the wicked. They bring trouble down on me, and in anger they hate me.
  - range: 4-8
    heading: Wings like a dove
    plain: |
      My heart twists inside me, and the terrors of death have fallen on me. Fear and trembling come over me; horror covers me. And I said, If only I had wings like a dove! I would fly away and be at rest. I would go far off and lodge in the wilderness. I would hurry to a shelter from the driving wind and the storm.
  - range: 9-11
    heading: Violence in the city
    plain: |
      Destroy them, O Lord; divide their speech, for I have seen violence and strife in the city. Day and night they go around it on its walls, and mischief and sorrow are inside it. Wickedness is in the middle of it; deceit and guile never leave its streets.
  - range: 12-15
    heading: It was thou
    plain: |
      It was not an enemy who reproached me; that I could have borne. It was not one who hated me who raised himself against me; from him I could have hidden. It was you, a man my equal, my companion and my close friend. We shared sweet counsel together and walked to the house of God in company. Let death seize them; let them go down alive to the world of the dead, for wickedness is in their homes and among them.
  - range: 16-19
    heading: As for me, I will call upon God
    plain: |
      As for me, I will call on God, and the LORD will save me. Evening, morning, and noon I will pray and cry aloud, and He will hear my voice. He has delivered my soul in peace from the battle that was against me, for there were many with me. God, who has sat enthroned from of old, will hear and will humble them. They have no changes, and so they do not fear God.
  - range: 20-21
    heading: Smoother than butter
    plain: |
      He has put out his hands against those who were at peace with him; he has broken his covenant. The words of his mouth were smoother than butter, but war was in his heart. His words were softer than oil, and yet they were drawn swords.
  - range: 22-23
    heading: Cast thy burden
    plain: |
      Cast your burden on the LORD, and He will sustain you; He will never let the righteous be moved. But You, O God, will bring them down to the pit of destruction. Men of blood and deceit will not live out half their days. But I will trust in You.

notes:
  - ref: 0
    phrase: on Neginoth, Maschil
    kind: words
    title: The title’s terms
    body: |
      Each of the title’s terms is explained where it first appears: “Neginoth” at [[Ps. 4:1]], “Maschil” at [[Ps. 32:1]], and “To the chief Musician” at [[Ps. 8:1]]. A modern translation prints the whole title as “To the leader: with stringed instruments. A Maskil of David.”
    sources: [nrsvue]

  - ref: 9
    phrase: divide their tongues
    kind: scripture
    title: An echo of Babel
    body: |
      The prayer against the city uses a word that has been heard as an echo of Babel. The Hebrew verb “divide” is the verb of the verse that names Peleg, “for in his days was the earth divided” ([[Gen. 10:25]]), in the chapter before the tower, where the LORD confounds the builders’ language so “that they may not understand one another’s speech” ([[Gen. 11:7]]). The word has been taken to hold a “retrospective reference to the confusion of tongues at Babel.”

      What is to be divided is “their speech (their counsels).” A modern translation has “Confuse, O Lord, confound their speech.”
    sources: [oshb-wlc, bdb, delitzsch-psalms, nrsvue]

  - ref: 12
    phrase: it was not an enemy that reproached me
    kind: history
    title: Who the friend was
    body: |
      The psalm does not name the friend, and its title names no occasion. One older reading, working from the title’s ascription to David, identifies him as Ahithophel: “This Old Testament Judas is none other than Ahithphel, the right hand of Absalom.” On that reading the psalm belongs to the years when Absalom’s rebellion was forming, before David left Jerusalem.

      Ahithophel was “David’s counsellor” ([[2 Sam. 15:12]]), and his advice was valued “as if a man had inquired at the oracle of God” ([[2 Sam. 16:23]]). When David was told that he was “among the conspirators with Absalom,” David prayed, “O LORD, I pray thee, turn the counsel of Ahithophel into foolishness” ([[2 Sam. 15:31]]).

      The identification depends on the title. The reading is offered as an attempt that takes the title’s word for the author, “on the standpoint of the writer of the inscription.” The same reading is given at [[Ps. 41:9]].
    sources: [delitzsch-psalms, lds-scriptures]

  - ref: 13
    phrase: a man mine equal, my guide, and mine acquaintance
    kind: words
    title: Three names for one friend
    body: |
      All three terms describe closeness. “Mine equal” is in Hebrew “a man according to my valuation,” a figure for “my equal.” “Guide” translates a word that here means “friend, intimate,” and a modern translation renders the last two terms “my companion, my familiar friend.”

      Here the psalm turns from God and speaks to the friend himself: “But it was thou.” Verse 14 says what the friendship had been. The two “took sweet counsel together,” and they went together to the house of God.
    sources: [bdb, nrsvue]

  - ref: 15
    phrase: go down quick into hell
    kind: words
    title: Alive into Sheol
    body: |
      “Quick” is the old English word for “alive,” and “hell” is Sheol, the world of the dead ([[Ps. 6:5]]). A modern translation has “let them go down alive to Sheol.”

      The words are those of the story of Korah. When Korah, Dathan, and Abiram rose against Moses, he said that if the earth should “swallow them up, with all that appertain unto them, and they go down quick into the pit; then ye shall understand that these men have provoked the LORD” ([[Num. 16:30]]). The Hebrew of that verse has the same two words, “alive” and “Sheol,” and they return when it happens ([[Num. 16:33]]). The speaker asks for his betrayers the end of Korah’s company.

      The verse is a wish spoken to God. For prayers of this kind, see [[Ps. 137:8]].
    sources: [webster-1828, nrsvue, oshb-wlc, lds-scriptures]

  - ref: 17
    phrase: Evening, and morning, and at noon
    kind: words
    title: The complaint becomes the prayer
    body: |
      The prayer the speaker makes three times a day is still the complaint of verse 2. The Hebrew verb translated “pray” is formed from the noun translated “complaint” there, and its sense in this verse is “complain.” The verb translated “cry aloud” means to “murmur,” and here it is a murmuring “in prayer.” A modern translation keeps the tie, so that what he does evening, morning, and noon is “I utter my complaint and moan.”

      So the turn of verse 16 does not leave the complaint behind. It goes on, now with the confidence that “he shall hear my voice.”
    sources: [bdb, nrsvue, oshb-wlc]

  - ref: 18
    phrase: for there were many with me
    kind: words
    title: With me, or against me
    body: |
      Translators do not agree whether the “many” of this line are friends or enemies. The King James Version reads them as allies: the speaker was delivered because many stood with him. A modern translation reads the opposite, “for many are arrayed against me,” so that the line gives the size of the danger and not the reason for the rescue. The ancient Greek translation has a third sense: “for they were with me in many cases.”

      The first half of the verse is plain in all three: it is God who delivers his soul “in peace.” Which way the second half is taken does not change that.
    sources: [nrsvue, lxx-rahlfs]

  - ref: 19
    phrase: Because they have no changes
    kind: words
    title: A line no one is sure of
    body: |
      The Hebrew says that the wicked have no “changes,” and what that means is uncertain. The word is used elsewhere for a change of clothing and for relays. Here it has been taken of the course of a life: they are people “with whom are no changings, i.e. they do evil incessantly, steadily.” That reading comes with the admission that “the expression is peculiar and obscure” and that the text is “perhaps corrupt.”

      A modern translation follows the same sense: God will humble them “because they do not change.” The ancient Greek translation took the changes as changes of fortune: “For they suffer no reverse, and therefore they have not feared God.” On the first reading they do evil without a break; on the second, nothing has yet gone wrong for them. Either way the line gives the reason they do not fear God.
    sources: [bdb, nrsvue, lxx-rahlfs]

  - ref: 22
    phrase: Cast thy burden upon the LORD
    kind: words
    title: The burden is what was given
    body: |
      The word translated “burden” occurs nowhere else in the Hebrew Bible, and it means a “lot (as that which is given).” The line tells the one addressed to cast on the LORD “the care, anxiety, etc. which are thy portion.” A modern translation notes the alternative “Cast what he has given you.” What the speaker is to throw onto the LORD is what has been dealt to him.

      The “thee” is one person, and the psalm does not say who. One older reading takes the line as “a counsel which David gives to himself, but at the same time to all who suffer innocently.”

      The promise is that the LORD “shall sustain thee.” It does not say that the lot will be taken away. “Moved” in the second half of the verse is the verb “totter, shake, slip,” and the same verb stands behind “cast” in verse 3, where the wicked let trouble drop on the speaker; a modern translation notes there, “Heb they cause to totter.”

      The ancient Greek translation has “Cast thy care upon the Lord,” and in that form Peter gave the line to the Saints: “Casting all your care upon him; for he careth for you” ([[1 Pet. 5:7]]).
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs, delitzsch-psalms, lds-scriptures]

christ: |
  The LORD of this psalm is the one who hears a complaint evening, morning, and noon and sustains the one who casts on Him what he has been given to carry. Beside “Cast thy burden upon the LORD” the Church’s edition of the Bible sets the Savior’s own invitation: “Come unto me, all ye that labour and are heavy laden, and I will give you rest” ([[Matt. 11:28]]). Peter, writing of the God who “careth for you,” gave the same line to the Saints ([[1 Pet. 5:7]]).

  The verse about a friend’s betrayal that Jesus applied to Judas at the Last Supper is from another psalm, [[Ps. 41:9]] ([[John 13:18]]); the note there has what He said. One older reading takes this psalm’s friend the same way, as having in Judas Iscariot “its historical living antitype in the life and passion of the second David.” That is one reading, not a statement of scripture.

explore: |
  - **The other psalm of a friend who turned.** [[Ps. 41:9]], with [[John 13:18–30]].
  - **Ahithophel’s story.** [[2 Sam. 15:12]], [[2 Sam. 15:31]], [[2 Sam. 16:23]], and [[2 Sam. 17:1–23]], for the reading that finds him in verses 12–14.
  - **Korah’s rebellion.** [[Num. 16:23–35]], the story behind verse 15.
  - **“I will trust in thee.”** The psalm’s last words stand also in [[Ps. 56:3]], and “I will trust in thee” has been listed among the phrases the Book of Mormon shares with the Psalms ([[2 Ne. 4:34]]).

parallels:
  - ref: 1 Pet. 5:7
    note: Peter gives verse 22 to the Saints in the wording of the Greek translation, “care” for “burden.”
  - ref: Ps. 41:9
    note: Another psalm of David by its title complains of a familiar friend; Jesus quotes it of Judas.
  - ref: Num. 16:30
    note: Moses’s words about Korah’s company, “go down quick into the pit,” are the words of verse 15.
  - ref: 2 Sam. 15:31
    note: David prays that the counsel of Ahithophel be turned to foolishness; one older reading finds Ahithophel in the friend of verses 12–14.
  - ref: 2 Ne. 4:34
    note: Nephi’s “I will trust in thee forever,” listed among the phrases the Book of Mormon shares with verse 23 and Psalm 56:3.

sources: [lds-scriptures, oshb-wlc, bdb, nrsvue, lxx-rahlfs, delitzsch-psalms, webster-1828, hilton-psalms-bom]
