chapter: 137
title: By the Rivers of Babylon
tagline: Exiles who would not sing for their captors remember Zion, swear never to forget Jerusalem, and ask the Lord to remember what was done to her.
when: 'Undated; it remembers the exile in Babylon, which began for most of Judah’s captives in 586 B.C.'

setting: |
  Psalm 137 has no title and names no author. Its voice is a people’s (*we* sat down, *we* wept), which is the mark of a communal lament. (For the shape of a lament, see [[Ps. 22:1]].)

  What it remembers is the end of the kingdom of Judah. Nebuchadnezzar carried large numbers of Judah’s people to Babylonia in 597 B.C. and again in 586 B.C. In the second campaign his army “burnt the house of the LORD, and the king’s house, and all the houses of Jerusalem” ([[2 Kgs. 25:9]]), and the captain of the guard carried away those who were left in the city. The captivity lasted until the decree of Cyrus in 536 B.C., and even then only part of the people went home.

  The psalm does not say when it was written. It tells its story in the past tense and calls Babylon *there*, so it reads as memory, whether the memory is a few years old or many. Its last three verses turn on two nations: Edom, the nation of Esau ([[Gen. 36:1]]), and Babylon, which destroyed the city. What the prophets said of each is needed to read those verses, and the notes give it.

  The psalm belongs beside the book of Lamentations, which mourns that “Judah is gone into captivity” ([[Lam. 1:3]]), and which also turns at the end of its fourth poem to Edom ([[Lam. 4:21–22]]).

thread: |
  The psalm turns on one verb. The exiles wept “when we remembered Zion” (verse 1). The singer swears what should become of him “if I do not remember thee” (verse 6). Then he asks the LORD to “remember” (verse 7). All three are the same Hebrew verb, *zakar*, and between the first and the second stands its opposite, twice in one line: “If I forget thee… let my right hand forget” (verse 5).

  The one who speaks and the one spoken to change as the verb moves. In verses 1–4 a people speaks about what happened in Babylon. In verses 5–6 a single voice speaks to Jerusalem. In verse 7 it speaks to the LORD, and in verses 8–9 to Babylon. Remembering begins as grief, becomes an oath, and ends as a plea that God will not forget either.

  A lament usually has a confession of trust and a vow of praise. This one has neither. It has no word of assurance and no promise to sing again, and it stops on its darkest line. What it does is remember, and ask the LORD to remember.

sections:
  - range: 1-4
    heading: We hanged our harps
    plain: |
      By the rivers of Babylon we sat down and wept when we remembered Zion. We hung our harps on the trees there, because there our captors asked us for a song, and our tormentors for joy: “Sing us one of the songs of Zion.” How could we sing the LORD’s song in a foreign land?
  - range: 5-6
    heading: If I forget thee, O Jerusalem
    plain: |
      If I forget you, Jerusalem, let my right hand forget what it knows. Let my tongue stick to the roof of my mouth if I do not remember you, if I do not set Jerusalem above my highest joy.
  - range: 7-9
    heading: Remember, O LORD
    plain: |
      LORD, remember the people of Edom, who on the day Jerusalem fell called for it to be stripped down to its foundation. Daughter of Babylon, doomed to destruction: happy the one who pays you back what you did to us, and who does not spare even your infants.

notes:
  - ref: 1
    phrase: By the rivers of Babylon, there we sat down
    kind: history
    title: There, by the rivers
    body: |
      The rivers are the waterways of Babylonia, where the captives were settled, and the psalm speaks of them as a place left behind. One of them was the Chebar, “a canal or waterway that left the Euphrates River north of Babylon,” and “on its banks lived many of the exiles carried from Judah by Nebuchadnezzar.” Ezekiel was one of them. He saw his first vision “among the captives by the river of Chebar” ([[Ezek. 1:1]]), and when he came to the settlement at Tel-abib, “I sat where they sat, and remained there astonished among them seven days” ([[Ezek. 3:15]]).

      The psalm says *there* twice, here and in verse 3, with the same Hebrew word (*sham*), and never *here*. Its verbs for sitting, weeping, and hanging up the harps are in the Hebrew form for completed action. The scene is told as something past and somewhere else.
    sources: [bd-chebar, oshb-wlc, lds-scriptures]
  - ref: 3
    phrase: they that wasted us required of us mirth
    kind: words
    title: Tormentors who ask for joy
    body: |
      The captors are named with a word found nowhere else in scripture, and what they ask for is joy. The Hebrew behind “they that wasted us” is a “doubtful word,” found only in this verse. The King James takes it one way; others connect it with a verb for wailing, so that it means those who “made us wail.” The New Revised Standard Version has “our tormentors.” On any of these the line sets the two things side by side: the people who caused the weeping of verse 1 want to be entertained.

      “Mirth” is *simchah*, and it comes back in verse 6, where “my chief joy” has the same noun. The King James hides the link by using two English words. The captors ask for joy; three verses later the singer says where his joy is. He sets Jerusalem “above my highest joy,” as the New Revised Standard Version puts it.
    sources: [bdb, oshb-wlc, nrsvue]
  - ref: 4
    phrase: the LORD’s song
    kind: history
    title: The song of the LORD’s house
    body: |
      “The LORD’s song” is the name Chronicles gives to the music of the temple, and the phrase is read the same way here: the sacred song of the sanctuary. David’s Levite musicians were “instructed in the songs of the LORD” ([[1 Chr. 25:7]]), and they served “for song in the house of the LORD, with cymbals, psalteries, and harps” ([[1 Chr. 25:6]]). When Hezekiah restored the temple service, “when the burnt offering began, the song of the LORD began also with the trumpets” ([[2 Chr. 29:27]]). The song went with the altar, and harps were among its instruments.

      The captors ask for “one of the songs of Zion”; the singers call it “the LORD’s song.” “Strange” here means foreign: “How could we sing the Lord’s song in a foreign land?” Babylon’s army had burned the house the song belonged to ([[2 Kgs. 25:9]]). So the harps are hung up, and the question is left without an answer. What follows it is an oath.
    sources: [lds-scriptures, delitzsch-psalms, nrsvue]
  - ref: 5
    phrase: let my right hand forget her cunning
    kind: words
    title: Let my right hand forget
    body: |
      “Cunning” means skill, and the King James supplied the word: the Hebrew line says only *let my right hand forget* and ends there. In older English the noun meant “Knowledge; art; skill; dexterity,” and Webster’s 1828 dictionary gives this very verse as its example. Supplying an object is an old way of completing the line: older interpreters took what the hand forgets to be the art of playing.

      The Hebrew can also be read without supplying anything. On one reading the verb turns back on the hand: let it “forget itself,” that is, “refuse or fail, become lame, become benumbed.” The New Revised Standard Version has “let my right hand wither!” Either way the same verb stands twice in the line, and forgetting is answered with forgetting. Verse 6 sets a matching penalty on the tongue.
    sources: [webster-1828, oshb-wlc, delitzsch-psalms, nrsvue]
  - ref: 7
    phrase: Remember, O LORD, the children of Edom
    kind: history
    title: What Edom said on the day of Jerusalem
    body: |
      Edom is charged with cheering on the destruction of Jerusalem, and the prophets say that the Lord would repay it. Edom was the nation of “Esau, who is Edom” ([[Gen. 36:1]]), Jacob’s brother (see the note on [[Jer. 49:7]]). “The day of Jerusalem” is “the day of Jerusalem’s fall.” Obadiah charges Edom with what it did on such a day: “In the day that thou stoodest on the other side, in the day that the strangers carried away captive his forces, and foreigners entered into his gates, and cast lots upon Jerusalem, even thou wast as one of them” ([[Obad. 1:11]]). Edom rejoiced over Judah, entered the gate, laid hands on the spoil, and stood at the crossroads to cut off those who escaped ([[Obad. 1:12–14]]).

      The psalm adds what Edom shouted. “Rase” translates a Hebrew verb meaning to lay bare, used “of laying foundations bare, i.e. tearing down walls,” and it is said twice.

      The psalmist does not say what should happen to Edom. He asks only that the LORD remember. In Obadiah the Lord says what will come: “as thou hast done, it shall be done unto thee: thy reward shall return upon thine own head” ([[Obad. 1:15]]). “Reward” there is the Hebrew noun *gemul*, and the next verse of the psalm uses the same noun of what Babylon did. Lamentations ends its fourth poem with the same warning: “he will visit thine iniquity, O daughter of Edom” ([[Lam. 4:22]]).
    sources: [lds-scriptures, nrsvue, bdb, oshb-wlc]
  - ref: 8
    phrase: who art to be destroyed
    kind: words
    title: Destroyed, to be destroyed, or destroyer
    body: |
      The Hebrew word as written is a passive participle, *devastated*, and the King James reads it as a doom still to come. The psalm itself is still waiting for the reckoning: verse 7 asks the LORD to remember, and this verse speaks of one who is yet to repay.

      There is another possibility. It has been proposed that the word should be read as an active form of the same verb, and the New Revised Standard Version translates that: “O daughter Babylon, you devastator!”

      Either way the verse looks to Babylon’s ruin, and Jeremiah uses this verb for it: “the spoiler is come upon her, even upon Babylon” ([[Jer. 51:56]]). “Spoiler” there is the active participle of the verb whose passive stands in the psalm.
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]
  - ref: 8
    phrase: happy shall he be, that rewardeth thee as thou hast served us
    kind: scripture
    title: The cursing psalms
    body: |
      The curse on Babylon is a prayer that she be repaid in kind, and three things govern how it and the other cursing psalms are read. (This is the site’s full note on them; other psalms point here.)

      **The psalmist does not act.** Verse 7 is spoken to the LORD and asks Him to remember. Verses 8–9 say that whoever repays Babylon will be happy; the singers, who are captives, do not say that they will do it. That is the law’s own word: “To me belongeth vengeance, and recompence” ([[Deut. 32:35]]). In these psalms “Vengeance is always seen as God’s province, and his alone,” and there is “no question of him taking the law into his own hands.” That does not clear every line. Where a psalmist gloats, or personal spite hides behind zeal for God’s name, it is to be condemned; but the wrong stays in words and does not pass into action.

      **The Lord says the same of Babylon.** “Rewardeth” is the Hebrew verb *shillem*. Jeremiah’s oracle against Babylon ends on that verb, doubled for emphasis: “the LORD God of recompences shall surely requite” ([[Jer. 51:56]]). The same verb gives the measure, “recompense her according to her work; according to all that she hath done, do unto her” ([[Jer. 50:29]]), and names the offence: “I will render unto Babylon and to all the inhabitants of Chaldea all their evil that they have done in Zion in your sight” ([[Jer. 51:24]]). The curse is aimed at a power that destroyed the Lord’s city and His house, and what it asks is what the Lord, in Jeremiah, says He will do.

      **The Savior’s law is higher.** The “perfect hatred” of [[Ps. 139:22]] is a case of the same kind: the phrase may have declared unwavering loyalty to God, but it is to be read with “the higher law taught by Jesus Christ” in mind: “Love your enemies, bless them that curse you, do good to them that hate you, and pray for them which despitefully use you, and persecute you” ([[Matt. 5:44]]). Paul puts the two together: “avenge not yourselves, but rather give place unto wrath: for it is written, Vengeance is mine; I will repay, saith the Lord” ([[Rom. 12:19]]). The New Testament leaves judgment where the psalm leaves it, with God. Of the disciple it asks what the psalm does not: love for the enemy, and prayer for him.
    sources: [ot-manual-psalms, scripture-helps-ps-102, oshb-wlc, lds-scriptures]
  - ref: 9
    phrase: Happy shall he be
    kind: history
    title: The last verse
    body: |
      The psalm’s last verse calls happy the one who kills Babylon’s infants, and it is spoken of the nation whose army had shown Jerusalem no pity. It continues verse 8’s “as thou hast served us.” The Chaldean army “slew their young men with the sword in the house of their sanctuary, and had no compassion upon young man or maiden, old man, or him that stooped for age” ([[2 Chr. 36:17]]). The king of Judah was made to watch his sons killed, and then his eyes were put out ([[2 Kgs. 25:7]]).

      Isaiah says that this would come on Babylon: “Their children also shall be dashed to pieces before their eyes” ([[Isa. 13:16]]), with the same Hebrew noun for the children as the psalm’s “little ones.” He names who would do it: “Behold, I will stir up the Medes against them” ([[Isa. 13:17]]).

      The word that makes the line so hard is “Happy.” It is *ashre*, “happiness, blessedness of,” the exclamation that opens the whole book in “Blessed is the man” ([[Ps. 1:1]]). Here the Psalter’s word of blessing is spoken over an act of war.

      That is what the verse says, and saying so does not commend it. The ancient world was more violent than most modern readers can comprehend, and accounts of its violence “tell us what did happen,” which “does not excuse unrighteous behavior” and is never a warrant for violence now. The psalm records what a crushed people said to God. How such words are read is in the note on [[Ps. 137:8]].
    sources: [lds-scriptures, oshb-wlc, bdb, scripture-helps-violence]

christ: |
  The one asked to remember in verse 7 is the LORD, and Jesus Christ is “the Great Jehovah of the Old Testament.” The psalm leaves the reckoning with Him, and He claims it as His own. Mormon heard “the voice of the Lord” ([[Morm. 3:14]]) say, “Vengeance is mine, and I will repay” ([[Morm. 3:15]]). What He asks of His disciples is the higher law of [[Matt. 5:44]] (see the note on [[Ps. 137:8]]).

explore: |
  - **Edom on the day of Jerusalem.** Read [[Obad. 1:10–15]] and [[Lam. 4:21–22]] with verse 7, and the notes at [[Jer. 49:7]].
  - **The sentence on Babylon.** Read [[Isa. 13:16]], [[Jer. 50:29]], [[Jer. 51:24]], and [[Jer. 51:56]] with verses 8–9.
  - **A letter to the exiles.** Jeremiah wrote to the captives in Babylon: “seek the peace of the city whither I have caused you to be carried away captives, and pray unto the LORD for it” ([[Jer. 29:7]]).

parallels:
  - ref: Obad. 1:10–15
    note: What Edom did on the day Jerusalem fell, and the Lord’s answer; compare verse 7.
  - ref: Lam. 4:21–22
    note: The cup passes to the daughter of Edom; compare verse 7.
  - ref: Jer. 51:56
    note: “The LORD God of recompences shall surely requite,” with the verbs of verse 8.
  - ref: Isa. 13:16
    note: The fate foretold for Babylon’s children; compare verse 9.

