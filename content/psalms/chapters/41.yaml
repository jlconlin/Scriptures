chapter: 41
title: Mine Own Familiar Friend
tagline: A sick man who has confessed his sin hears his visitors wish him dead, sees a friend from his own table turn on him, and asks the LORD to raise him up.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  Psalm 41 is the last psalm of Book One, the first of the five books into which the Psalms are divided. Its final verse is the line of praise that closes that book (see the note on verse 13).

  The title ascribes the psalm to David and addresses it to the chief Musician ([[Ps. 8:1]]); it names no occasion. The psalm itself shows a man lying ill. He has confessed sin to the LORD (verse 4). Enemies come to his bedside, speak emptily, and carry out what they have gathered; they whisper that he will not get up again. With them is a friend who has eaten at his table. One older reading sets all this in the years of Absalom’s conspiracy; the note on verse 9 gives it as a reading.

  In form the psalm is a lament ([[Ps. 22:1]]), but it does not open as one. It begins with a saying about someone else, the man who looks after the weak, and only in verse 4 does the speaker say “I.”

  The New Testament takes up one line. At the Last Supper Jesus quoted verse 9 of the disciple who would betray Him ([[John 13:18]]), and the heading in the Church’s edition calls this “a messianic psalm of David.” The chapter takes the sick man’s prayer first and the Savior’s use of it after.

thread: |
  Psalm 41 sets **two ways of coming to a sickbed** side by side. It opens with a blessing on the one who “considereth the poor,” and its promises narrow until they reach a bed: the LORD will deliver him, keep him alive, and sustain him “upon the bed of languishing” (verses 1–3).

  Then the speaker says “I,” and he is the man on the bed, himself one of the weak whom verse 1 says to consider. He is treated in the opposite way. His enemies ask when he will die. One visits, speaks emptily, and goes out to report. The complaint climbs from enemies, to “all that hate me,” to the friend who ate his bread (verse 9).

  The complaint is framed by one plea. “LORD, be merciful unto me” opens it in verse 4 and returns in verse 10, the same Hebrew word both times, and there the psalm turns: “But thou, O LORD.” The second plea answers the visitors in their own verb. They said he “shall rise up no more”; he asks, “raise me up.”

  The psalm does not report the recovery. It ends on what the speaker knows: his enemy has not triumphed, and the LORD holds him up and sets him before His face. The last verse is the blessing that closes the first book.

sections:
  - range: 1-3
    heading: Blessed is he that considereth the poor
    plain: |
      How happy is the one who gives thought to the weak. In the day of trouble the LORD will rescue him. The LORD will guard him and keep him alive; he will be blessed on the earth, and You will not hand him over to what his enemies want. The LORD will hold him up on his sickbed; in his illness You change his whole bed.
  - range: 4-9
    heading: What the visitors say
    plain: |
      As for me, I said, “LORD, be gracious to me. Heal me, for I have sinned against You.” My enemies speak evil of me: “When will he die, and his name be gone?” When one of them comes to see me, his talk is empty; his heart collects mischief, and when he goes outside he tells it. All who hate me whisper together about me and imagine the worst for me: “A deadly thing has fastened on him; now that he is lying down he will not get up again.” Even my close friend, whom I trusted, who ate my bread, has lifted his heel against me.
  - range: 10-12
    heading: But thou, O LORD, raise me up
    plain: |
      But You, LORD, be gracious to me and raise me up, so that I may repay them. By this I know that You are pleased with me: my enemy does not shout in triumph over me. As for me, You hold me up in my integrity and set me before Your face for ever.
  - range: 13
    heading: The close of the first book
    plain: |
      Blessed be the LORD, the God of Israel, from everlasting to everlasting. Amen, and Amen.

notes:
  - ref: 1
    phrase: considereth the poor
    kind: words
    title: The poor of verse 1 are the weak
    body: |
      “The poor” here is wider than those without money: the Hebrew word, *dal*, means “low, weak, poor, thin.” It is the word for Pharaoh’s lean cattle and for Amnon grown lean, and a modern translation notes “weak” as an alternative in this verse. The word can cover a man who is ill, and the promises of the blessing end at a sickbed (verse 3).

      “Blessed” is *ashre*, the exclamation explained at [[Ps. 1:1]], and this opening is counted among the sayings of that form in the Psalms that stand behind the Beatitudes. The first book of Psalms begins with the word, and its last two psalms both have it: “Blessed is that man that maketh the LORD his trust” ([[Ps. 40:4]]), and then this verse.
    sources: [oshb-wlc, bdb, nrsvue, skinner-beatitudes]

  - ref: 4
    phrase: heal my soul; for I have sinned against thee
    kind: words
    title: A confession beside a claim of integrity
    body: |
      The sick man asks for healing because he has sinned, and eight verses later says the LORD upholds him “in mine integrity”; the psalm lets both stand. For “heal my soul” a modern translation has simply “heal me, for I have sinned against you.” He does not say what the sin was.

      The confession is made to the LORD and is of sin “against thee.” The word of verse 12 is the one used for integrity of mind or heart, and there too the speaker is addressing the LORD, who upholds him in it. The psalm does not say how the two fit together.

      The verse ties this man’s illness to his sin. It does not state a rule that sickness comes from sin, and no other line of the psalm does.
    sources: [oshb-wlc, nrsvue, bdb]

  - ref: 8
    phrase: An evil disease
    kind: words
    title: A thing of Belial
    body: |
      What the enemies whisper is, in Hebrew, a thing of *belial*, and the phrase can be heard two ways. *Belial* is worthlessness; it names the “worthless, good-for-nothing, base fellows” of the books of Samuel. On that sense the phrase is a “base, wicked thing.” The word can also mean “ruin, destruction,” and some take it so here. The King James has “evil disease” and a modern translation a “deadly thing”; the ancient Greek translation, the Septuagint, reads, “They denounced a wicked word against me.”

      Either way, the second half of the verse says what they expect: “now that he lieth he shall rise up no more.”

      His prayer in verse 10 picks up their verb. “Rise up” and “raise me up” are forms of the same Hebrew verb, and he asks the LORD to do the thing they have ruled out.
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue]

  - ref: 9
    phrase: mine own familiar friend
    kind: history
    title: The man of my peace
    body: |
      The friend is, word for word, “the man of my peace,” as the Greek translation also has it. Two clauses fill the phrase out. He trusted him, and the man ate his bread, that is, shared his table.

      “Lifted up his heel” is in Hebrew “made great the heel against me.” The idiom is explained as having “given me insidiously a great fall,” a figure for a cruel advantage taken; one older commentary sees a kick, given “with a good swing of the foot.”

      The psalm does not name him, and its title names no occasion. One older reading identifies him as Ahithophel, “David’s counsellor” ([[2 Sam. 15:12]]), whose advice was valued “as if a man had inquired at the oracle of God” ([[2 Sam. 16:23]]) and who went over to Absalom. The same reading pairs this psalm with Psalm 55, where the complaint is again of a close friend: “a man mine equal, my guide, and mine acquaintance” ([[Ps. 55:13]]). It fits the story; nothing in the psalm requires it.
    sources: [oshb-wlc, lxx-rahlfs, bdb, delitzsch-psalms, lds-scriptures]

  - ref: 9
    phrase: hath lifted up his heel against me
    kind: christ
    title: The line Jesus quoted at the Last Supper
    body: |
      Jesus applied this verse to Judas at the supper, just after washing the disciples’ feet: “I know whom I have chosen: but that the scripture may be fulfilled, He that eateth bread with me hath lifted up his heel against me” ([[John 13:18]]). He then said why He was telling them: “Now I tell you before it come, that, when it is come to pass, ye may believe that I am he” ([[John 13:19]]). The quotation was meant to impress “the fact of His foreknowledge,” so that afterward “the apostles would realize that thereby the scriptures had been fulfilled.”

      Asked who it is, Jesus answers, “He it is, to whom I shall give a sop, when I have dipped it” ([[John 13:26]]), and gives the bread to Judas. In Mark He says it is “One of you which eateth with me” ([[Mark 14:18]]).

      After the Ascension Peter said that the Holy Ghost “by the mouth of David spake before concerning Judas” ([[Acts 1:16]]).
    sources: [lds-scriptures, talmage-jesus-christ-33]

  - ref: 10
    phrase: that I may requite them
    kind: scripture
    title: Raise me up, that I may repay
    body: |
      The sick man asks to be raised so that he himself may repay his enemies. “Requite” is the Hebrew verb *shillem*, “repay,” the verb of [[Ps. 137:8]], where the one who repays Babylon is someone else.

      One older reading answers from the speaker’s office. On it the psalm is the king’s, and the requiting is what “it was David’s duty as a duly constituted king to exercise,” carried out when Absalom’s rebellion was put down. That depends on the setting the reading supplies; the psalm’s title gives none.

      The verse is a prayer: he asks the LORD to raise him, and the next verse finds the LORD’s favor in this, that the enemy “doth not triumph.” How the Psalms’ prayers for repayment are read, and the Savior’s higher law beside them, is in the note on [[Ps. 137:8]].
    sources: [oshb-wlc, nrsvue, delitzsch-psalms]

  - ref: 13
    phrase: Amen, and Amen
    kind: structure
    title: The blessing that closes Book One
    body: |
      Verse 13 ends the first book of Psalms as well as this psalm. Psalms 1–41 are the first of five books, “each division closing with a doxology or utterance of praise to God,” and the four endings are set side by side in the note on [[Ps. 150:6]].

      Through twelve verses one man has spoken of “me” and “mine enemy.” The last verse blesses “the LORD God of Israel,” “from everlasting, and to everlasting.”

      “Amen” is a Hebrew word left untranslated; it means “Firm, true,” and is used “to denote acceptance.” The Greek translation renders it here: “So be it, so be it.” It is a word of response. When David’s psalm of thanks ended before the ark, “all the people said, Amen” ([[1 Chr. 16:36]]), and the doxology that closes Book Four calls for the response: “let all the people say, Amen” ([[Ps. 106:48]]).
    sources: [mcconkie-poetic-writings, bd-amen, lxx-rahlfs, lds-scriptures]

christ: |
  The Savior Himself read verse 9 of His betrayal. At the table where He had just washed the feet of the Twelve, He said the scripture would be fulfilled in one who ate bread with Him, and He told them beforehand so that when it came they would “believe that I am he” ([[John 13:19]]).

  The psalm is also its speaker’s own prayer: he says of himself, “I have sinned against thee” (verse 4). A psalm can be an inspired foretelling of Christ and also a prayer out of its speaker’s own life; the two views of such psalms need not be seen as exclusive of each other. In this one the line the Savior took for Himself is the line about the friend at the table.

explore: |
  - **The supper beside the psalm.** [[John 13:1–30]], read with verse 9 open; then [[Mark 14:17–21]] and [[Luke 22:21–23]].
  - **Another friend who turned.** [[Ps. 55:12–14]] and [[Ps. 55:20–21]], on the friend whose words “were smoother than butter.”
  - **Ahithophel’s story.** [[2 Sam. 15:12]], [[2 Sam. 15:31]], [[2 Sam. 16:23]], and [[2 Sam. 17:1–23]], for the reading that finds him in verse 9.
  - **Blessed at both ends.** [[Ps. 1:1]] and verse 1 here, the first and last psalms of Book One.
  - **The other endings.** [[Ps. 72:18–19]], [[Ps. 89:52]], and [[Ps. 106:48]], with the note on [[Ps. 150:6]].

parallels:
  - ref: John 13:18
    note: Jesus quotes verse 9 of Judas at the Last Supper.
  - ref: Mark 14:18
    note: “One of you which eateth with me shall betray me.”
  - ref: Acts 1:16
    note: Peter says the Holy Ghost spoke beforehand of Judas by the mouth of David.
  - ref: Ps. 55:12–14
    note: Another psalm of David by its title complains of a trusted companion who turned.
  - ref: 2 Sam. 16:23
    note: Ahithophel’s counsel, valued as an oracle “both with David and with Absalom.”
  - ref: Ps. 72:18–19
    note: The doxology that closes Book Two, also ending “Amen, and Amen.”

