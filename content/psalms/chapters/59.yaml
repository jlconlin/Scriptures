chapter: 59
title: God Is My Defence
tagline: A man whose house is watched by killers prays through the evening, hears them come back like dogs, and closes on the refrain of the first half with one verb changed, from “wait” to “sing.”
when: 'By its title, David’s, when Saul sent men to watch his house and kill him'

setting: |
  Psalm 59 is one of the psalms whose titles set them in Saul’s pursuit of David; Psalm 57, two before it, is placed “when he fled from Saul in the cave.” This title names one night. Saul “sent messengers unto David’s house, to watch him, and to slay him in the morning,” and Michal, David’s wife, “let David down through a window: and he went, and fled, and escaped” ([[1 Sam. 19:11–12]]). The note on the title has the story; what a title is worth as evidence is discussed at [[Ps. 3:1]].

  On one older reading, a title of this kind does not mean that the psalm was written that night; it “only sets forth in a general way the historical groundwork of the song.” The psalm does speak more widely than the story. Its enemies come back at evening and go about a whole city; the prayer against them reaches “all the heathen”; and the speaker has a people who must not forget (verse 11).

  The psalm is a lament (for the form, see [[Ps. 22:1]]). It contains several of the curses that make a reader stop; the note on verse 11 takes up what this psalm asks for, and [[Ps. 137:8]] has the question as a whole.

thread: |
  The psalm is built in two halves, and each half has the same four parts: a prayer that closes with “Selah” (verses 1–5 and 11–13), the enemies returning at evening like dogs (verses 6–7 and 14–15), a turn on “But” (verse 8, “But thou, O LORD”; verse 16, “But I”), and a refrain about strength that says “God is my defence” (verse 9 and verse 17).

  **The enemies do not change between the first half and the second.** The dogs are back in verse 14 in the words of verse 6 (the note there has the detail).

  What changes is the refrain. The first time, the speaker says he will “wait upon” God, and the Hebrew verb is watch. The second time one word is different: “Unto thee, O my strength, will I sing.” Just before it stands the psalm’s only mention of morning. The psalm reports no escape and no window. What moves is that one verb, from “I will watch” to “I will sing.”

sections:
  - range: 1-5
    heading: Not for my transgression
    plain: |
      Deliver me from my enemies, O my God; defend me from those who rise up against me. Deliver me from those who work evil, and save me from men of blood. See, they lie in wait for my life; strong men gather against me, and not for any transgression or sin of mine, O LORD. For no guilt of mine they run and make ready. Awake to help me, and see. You, LORD God of hosts, God of Israel, awake to punish all the nations; show no mercy to any who transgress wickedly.
  - range: 6-10
    heading: Dogs at evening, and the One who laughs
    plain: |
      They come back at evening, growling like dogs, and go around the city. See what pours from their mouths; there are swords in their lips, for they say, “Who hears?” But You, LORD, laugh at them; You hold all the nations in derision. O my strength, I will watch for You, for God is my defence. My God in His lovingkindness will go before me; God will let me see my desire on my enemies.
  - range: 11-13
    heading: Slay them not
    plain: |
      Do not kill them, or my people may forget. Make them wander by Your power and bring them down, O Lord our shield. For the sin of their mouths and the words of their lips, let them be caught in their pride, and for the cursing and lies they speak. Consume them in wrath; consume them until they are no more, and let them know that God rules in Jacob to the ends of the earth.
  - range: 14-17
    heading: Evening again, and a song in the morning
    plain: |
      Let them come back at evening, growling like dogs, and go around the city. Let them wander about for food, and murmur if they are not filled. But I will sing of Your power; in the morning I will sing aloud of Your mercy, for You have been my defence and my refuge in the day of my trouble. To You, O my strength, I will sing, for God is my defence, the God of my mercy.

notes:
  - ref: 0
    phrase: when Saul sent, and they watched the house to kill him
    kind: history
    title: The night at David’s house
    body: |
      The title sets the psalm on the night Saul’s men surrounded David’s house. Saul had just tried “to smite David even to the wall with the javelin” ([[1 Sam. 19:10]]). That night he “sent messengers unto David’s house, to watch him, and to slay him in the morning,” and Michal told her husband, “If thou save not thy life to night, to morrow thou shalt be slain” ([[1 Sam. 19:11]]). She let him down through a window, laid an image in the bed, and told the messengers he was sick ([[1 Sam. 19:12–14]]).

      The title’s “watched” is the Hebrew verb *shamar*, to watch or keep, and it is the verb the story uses for the messengers’ errand. The psalm uses it once more, of the speaker himself; the note on verse 9 takes that up.

      The title’s other terms are explained where they first appear: “To the chief Musician” at [[Ps. 8:1]], “Michtam” at [[Ps. 16:1]], and “Al-taschith” at [[Ps. 57:1]].
    sources: [lds-scriptures, oshb-wlc]

  - ref: 3
    phrase: not for my transgression, nor for my sin
    kind: scripture
    title: Three words for the wrong he has not done
    body: |
      The speaker denies having given any cause for this pursuit, and he uses three Hebrew words for wrongdoing to say it: *pesha* (“transgression”) and *chattat* (“sin”) in this verse, and *avon* in the next, where “without my fault” is “for no guilt of mine.”

      The story the title names makes the same protest, and David makes it twice in the psalm’s own nouns. Before that night Jonathan had told his father that David “hath not sinned against thee” ([[1 Sam. 19:4]]) and asked, “wherefore then wilt thou sin against innocent blood, to slay David without a cause?” ([[1 Sam. 19:5]]). After the escape David asks Jonathan, “what is mine iniquity? and what is my sin before thy father, that he seeketh my life?” ([[1 Sam. 20:1]]), and the two nouns are the psalm’s *avon* and *chattat*. Later, at the cave, he says it to Saul: “there is neither evil nor transgression in mine hand, and I have not sinned against thee; yet thou huntest my soul to take it” ([[1 Sam. 24:11]]). “Transgression” there is the psalm’s *pesha*.
    sources: [lds-scriptures, oshb-wlc]

  - ref: 5
    phrase: awake to visit all the heathen
    kind: history
    title: Why the prayer turns to all the nations
    body: |
      A prayer about men sent by Israel’s own king suddenly asks God to punish “all the heathen,” and one older reading takes the heathen to include the speaker’s enemies within Israel. On that reading he “reckons himself as belonging to an Israel from which he excludes his enemies,” so that among the heathen “are included the heathen-minded in Israel.” The Hebrew word is *goyim*, nations, and it returns in verse 8, where the LORD holds “all the heathen” in derision. The psalm itself does not say who the nations are.

      “Visit” here means to punish.

      The verse also piles up names, “O LORD God of hosts, the God of Israel,” and on the same reading each of them “is a challenge, so to speak, to the ability and willingness, the power and promise of God.” Twice in two verses the speaker tells God to awake; [[Ps. 44:23]] takes up what that cry means.
    sources: [delitzsch-psalms, oshb-wlc, bdb]

  - ref: 6
    phrase: they make a noise like a dog
    kind: symbol
    title: Dogs that come out at evening
    body: |
      The enemies are compared to dogs hunting a town for food, and the psalm goes on at once to their mouths. In the books of Kings the dog is a scavenger: the literal examples there, in passages such as [[1 Kgs. 14:11]] and [[1 Kgs. 21:23–24]], are “all of fierce, hungry dogs, devouring dead bodies and licking blood.” “Make a noise” is to “growl like a dog,” and verse 15 says what the pack is after: they “wander up and down for meat.”

      The next verse turns the growl into speech. “Belch out” is a verb for what gushes or pours, “figurative, usually of speech, pour forth, emit, belch forth,” and what is in their lips is “swords.” Verse 12 names it without a figure: “the sin of their mouth and the words of their lips,” “cursing and lying.”

      The picture comes twice. In the King James Version the second is a wish, “let them return” (verse 14). The Hebrew verbs are those of verse 6 with “and” in front, and a modern translation gives the two verses in the same words: “Each evening they come back.”
    sources: [bdb, oshb-wlc, nrsvue]

  - ref: 8
    phrase: But thou, O LORD, shalt laugh at them
    kind: scripture
    title: The laughter of Psalm 2
    body: |
      The two verbs of this verse, laugh and hold in derision, are the two used of the Lord when the kings of the earth plot against His anointed: “He that sitteth in the heavens shall laugh: the Lord shall have them in derision” ([[Ps. 2:4]]). The note there takes up why the Lord laughs.

      In that psalm the objects are nations and their rulers. Here the pair is spoken in a prayer about men prowling one city, and its second object is again “all the heathen.”

      The verse comes directly after the enemies’ question, “for who, say they, doth hear?” (verse 7). The next words are addressed to the LORD: “But thou.”
    sources: [oshb-wlc]

  - ref: 9
    phrase: Because of his strength will I wait upon thee
    kind: words
    title: The refrain, and the verb of the title
    body: |
      The first line of the refrain is harder in Hebrew than in English, and its verb is the one in the title. The Hebrew begins with the bare words “his strength” and goes on, word for word, unto thee will I watch; no Hebrew word stands behind “Because of.” When the refrain returns in verse 17 the word is “my strength,” spoken to God. The ancient Greek translation has “my strength” in this verse too, and a modern translation reads the line as verse 17 has it: “O my strength, I will watch for you.”

      “Wait upon” is *shamar*, to watch or keep. In the title Saul’s men “watched the house”; in the refrain the man they are watching says that he will watch for God.

      In verse 17 the verb in that place is different. “Will I wait” has become “will I sing.”
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, lds-scriptures]

  - ref: 10
    phrase: The God of my mercy shall prevent me
    kind: words
    title: Written “his mercy,” read “my mercy”
    body: |
      The Hebrew of this line has come down in two forms, “my God, his mercy” and “the God of my mercy.” The traditional Hebrew text carries both: the word as written (the *ketiv*) is “his mercy,” and the word marked to be read in its place (the *qere*) is “my mercy.” The King James Version’s “my mercy” agrees with what is read, and with the end of the refrain in verse 17, where “the God of my mercy” stands with no variant. With “his,” the line is “My God, in His loving kindness, shall go before me,” and the ancient Greek reads it so: “his mercy shall go before me.”

      Two of the line’s words are explained elsewhere: “prevent,” which is to go before or come to meet, at [[Ps. 21:3]], and “mercy,” the Hebrew *hesed*, at [[Ps. 51:1]].
    sources: [oshb-wlc, lds-scriptures, lxx-rahlfs]

  - ref: 11
    phrase: Slay them not, lest my people forget
    kind: scripture
    title: Not killed, so that the people remember
    body: |
      The speaker asks that his enemies not be killed, “lest my people forget,” and two verses later he asks that they be consumed. On one older reading the first request “does not contradict the prayer that follows for their destruction”: they are first to “remain for a season before the eyes of this people as an example of punishment,” and then to be removed.

      “Scatter” is to “cause to wander,” and the same Hebrew verb, in its simple form, comes back in verse 15, where they “wander up and down for meat.”

      Every request in these verses is made to God; [[Ps. 137:8]] sets out how the cursing psalms are read, with the Savior’s higher law. This psalm gives its own reason. The punishment is for what the enemies have said (verse 12), and its stated end is knowledge: “let them know that God ruleth in Jacob unto the ends of the earth.”
    sources: [delitzsch-psalms, bdb, oshb-wlc]

  - ref: 15
    phrase: grudge if they be not satisfied
    kind: words
    title: 'Grudge: to murmur, or to stay the night'
    body: |
      “Grudge” here is an old word for murmuring, and the Hebrew behind it may say instead that the dogs stay out all night. To grudge was “To murmur; to repine; to complain.” The ancient Greek translation has that sense, “if they be not satisfied, they shall even murmur,” and a modern translation is close to it with “growl if they do not get their fill.”

      Hebrew has two verbs spelled with these consonants. One means to murmur. The other means to “lodge, pass the night,” and this verse has been read with each. Taken the second way, the pack that is not filled stays out the night, and the next verse names the morning.
    sources: [webster-1828, lxx-rahlfs, bdb, nrsvue]

  - ref: 16
    phrase: in the morning
    kind: structure
    title: Evening for them, morning for him
    body: |
      The psalm gives the evening to the enemies and the morning to the speaker. Both passages about the dogs name the evening, and the morning, named only here, belongs to the song. On one older reading the psalm “seems to be an evening song,” in which the speaker “contrasts his believingly joyous prospects for the coming morning with the ineffectual ardour with which they pass the night patrolling the streets.”

      The Hebrew marks the contrast with two pronouns. Verse 15 opens with an emphatic “they,” which the King James Version does not show, and verse 16 with “But I.”

      In the story the title names, morning was the hour fixed for the killing: the messengers were “to watch him, and to slay him in the morning” ([[1 Sam. 19:11]]). In the psalm it is the hour for singing “of thy mercy.”
    sources: [delitzsch-psalms, oshb-wlc, lds-scriptures]

christ: |
  The psalm calls on God by His name three times: “O LORD” in the protest of innocence (verse 3), “O LORD God of hosts, the God of Israel” in the call to awake (verse 5), and “But thou, O LORD” after the question whether anyone hears (verse 8). That name is Jehovah, and “Jehovah is the premortal Jesus Christ.”

  What the psalm says of Him is that He laughs at those who ask “who doth hear?”, that He is the speaker’s “defence” and “refuge in the day of my trouble,” that He is “the God of my mercy,” and that His rule, though it is “in Jacob,” reaches “unto the ends of the earth.”

explore: |
  - **The Lord’s laughter.** [[Ps. 2:1–6]] and [[Ps. 37:12–13]], the two other places in the Psalms where the Lord is the one who laughs.

parallels:
  - ref: 1 Sam. 19:11–12
    note: The occasion the title names, when Saul’s messengers watched David’s house and Michal let him down through a window.
  - ref: 1 Sam. 20:1
    note: David asks Jonathan what his iniquity and his sin are, in two of the psalm’s three words for wrongdoing.
  - ref: 1 Sam. 24:11
    note: David tells Saul there is no transgression in his hand, “yet thou huntest my soul to take it.”
  - ref: Ps. 2:4
    note: The same two verbs, laugh and have in derision, said of the Lord and the kings of the earth.

sources: [lds-scriptures, gs-jehovah, oshb-wlc, bdb, lxx-rahlfs, nrsvue, webster-1828, delitzsch-psalms]
