chapter: 81
title: Oh That My People Had Hearkened
tagline: A song calling Israel to its feast breaks off when another voice is heard, and God Himself recalls the rescue from Egypt, the one thing He asked, and what He would have done for a people who listened.
when: 'By its title, a psalm of Asaph; undated, sung for a feast'

setting: |
  Psalm 81 stands among the psalms that carry Asaph’s name. The words of its title are explained where they first appear: the chief Musician and Gittith at [[Ps. 8:1]], Asaph at [[Ps. 50:1]]. Like the psalm before it, it looks back to the coming out of Egypt, and like its neighbours it calls the nation “Joseph” ([[Ps. 77:15]]; [[Ps. 78:67]]; [[Ps. 80:1]]).

  It is a song for a feast. The first five verses call singers, players and horn-blowers to a festival day that the law appointed. Which feast is meant is not certain; the note on verse 3 sets out the two candidates, Passover in the spring and Tabernacles in the autumn.

  Then the song stops and another voice speaks. From verse 6 to the end God Himself is the speaker, “the Preacher of the festival” in one older description. He recalls the rescue from Egypt, repeats the first thing He commanded at Sinai, says that Israel would not listen, and ends with a wish. Two other psalms have such a speech: Psalm 50, also under Asaph’s name, where God says “Hear, O my people” ([[Ps. 50:7]]), and Psalm 95, which has been called “in many ways akin” to this one and in which a call to sing turns into a warning about Meribah ([[Ps. 95:7–9]]).

  The psalm gives no date and names no enemy, though verse 14 supposes that Israel has enemies it has not subdued.

thread: |
  Psalm 81 is about **hearing**. It opens with noise: sing aloud, shout, strike the timbrel, blow the horn. At the end of verse 5 the singer hears something, and from there the psalm is one speech by God, who asks His people for a single thing. The Hebrew verb for hearing comes five times: “I heard” (verse 5), “Hear, O my people” and “if thou wilt hearken” (verse 8), “would not hearken” (verse 11), “Oh that my people had hearkened” (verse 13).

  The speech moves in four steps. God recalls what He did: the burden lifted, the cry answered, the test at Meribah (verses 6–7). He repeats what He asked, no strange god, and names Himself, and in place of a further demand He makes a promise: “open thy mouth wide, and I will fill it” (verses 8–10). He says what happened: “my people would not hearken,” and He let them go their own way (verses 11–12). The speech closes with a wish, “Oh that my people had hearkened unto me” (verse 13), and with what would have followed: enemies subdued, and the people fed with wheat and honey. Modern translations give the wish as “would listen”; the note on verse 13 has the Hebrew.

  The psalm never returns to the singing. It ends inside God’s speech, on a verb spoken to “thee.”

sections:
  - range: 1-5
    heading: Sound the horn for our feast
    plain: |
      Sing out to God our strength; shout to the God of Jacob. Raise a song and sound the timbrel, the sweet harp and the lyre. Blow the horn at the new moon, and at the full moon, for the day of our feast. It is a statute for Israel, a ruling of the God of Jacob. He set it as a testimony in Joseph when He went out over the land of Egypt. There I heard a language I did not know.
  - range: 6-10
    heading: I delivered thee; hear me
    plain: |
      I took the burden off his shoulder; his hands were freed from the basket. You called in distress and I rescued you. I answered you from the hiding place of thunder; I tested you at the waters of Meribah. Hear, My people, and I will warn you. Israel, if only you would listen to Me! There shall be no strange god among you; you shall not bow down to a foreign god. I am the LORD your God, who brought you up out of the land of Egypt. Open your mouth wide, and I will fill it.
  - range: 11-12
    heading: They would not, and I let them go
    plain: |
      But My people did not listen to My voice; Israel would not have Me. So I gave them over to the stubbornness of their hearts, to walk in their own counsels.
  - range: 13-16
    heading: If only they had listened
    plain: |
      If only My people had listened to Me, and Israel had walked in My ways! I would soon have subdued their enemies and turned My hand against their foes. Those who hate the LORD would have come cringing to Him, and their time would have lasted for ever. He would have fed them with the finest of the wheat, and with honey out of the rock I would have satisfied you.

notes:
  - ref: 3
    phrase: in the new moon, in the time appointed, on our solemn feast day
    kind: history
    title: Which feast, and the horn at the new moon and the full moon
    body: |
      The verse names two days of one month, its new moon and its full moon, and puts the feast on the second; whether that feast is Tabernacles or Passover is not settled. “In the time appointed” translates a rare noun, found in the Psalms only here, that means “full moon” and is used in this verse “as a feast-day.” Modern translations print “at the full moon, on our festal day.” The ancient Greek passes over the word: “in the glorious day of your feast.”

      Israel’s months began with the new moon, and “the days for all Jewish feasts were reckoned by the moon,” so the full moon is the middle of the month. Two of the great feasts are kept there. “In the fourteenth day of the first month at even” comes the Passover ([[Lev. 23:5]]), and “on the fifteenth day of the same month is the feast of unleavened bread” ([[Lev. 23:6]]); and “The fifteenth day of this seventh month shall be the feast of tabernacles” ([[Lev. 23:34]]).

      **Tabernacles.** The seventh month is the one whose new moon the law marks with a blast, “a memorial of blowing of trumpets” ([[Lev. 23:24]]), and the old Jewish interpreters are reported to “understand the Feast of Tabernacles.” The psalm became by “ancient custom the Jewish New Year’s Psalm, the Psalm of the Feast of Trumpets.”

      **Passover.** One older reading chooses the spring, “because the remembrance of the redemption of Israel clings far more characteristically to the Feast of the Passover than to the Feast of Tabernacles,” and because verse 5 dates the statute to God’s going out against Egypt (see the next note). The Passover “was instituted to commemorate the passing over the houses of the children of Israel in Egypt.”

      The instrument is the *shofar*, a “horn, for blowing,” which is “a curved horn, as of cow or ram.” The law’s blast “in the beginnings of your months” ([[Num. 10:10]]) is on silver trumpets, and scripture elsewhere names the horn and the metal trumpet side by side as two instruments ([[Ps. 98:6]]). On either reading the psalm’s own reason for the feast is the rescue from Egypt.
    sources: [oshb-wlc, bdb, nrsvue, lxx-rahlfs, bd-new-moon, bd-feasts, delitzsch-psalms, lds-scriptures]

  - ref: 5
    phrase: when he went out through the land of Egypt
    kind: words
    title: Who went out, and against whom
    body: |
      The one who “went out” can be God, going out against Egypt on the night of the Passover, or the people leaving it: modern translations take the first, and the ancient Greek’s “out of” suits the second. The Hebrew preposition is the ordinary word for “upon” or “over,” not “out of.” Modern translations have “when he went out over the land of Egypt,” with “against” in the margin, and their cross-references point to the announcement of the last plague: “About midnight will I go out into the midst of Egypt” ([[Ex. 11:4]]). On that reading the statute of the feast dates from the night the LORD went through Egypt in judgment.

      The ancient Greek has the other preposition, the wording of a departure: “when he came forth out of the land of Egypt.” The verse has just called the nation Joseph, a name discussed at [[Ps. 80:1]].
    sources: [oshb-wlc, nrsvue, esv, lxx-rahlfs, lds-scriptures]

  - ref: 5
    phrase: where I heard a language that I understood not
    kind: structure
    title: The voice the singer had not known
    body: |
      This half-line is where the psalm changes speakers, and it can be read as the singer’s announcement that he now hears God. The King James reads it of Israel in Egypt among foreigners, as another psalm describes the exodus: “When Israel went out of Egypt, the house of Jacob from a people of strange language” ([[Ps. 114:1]]).

      The Hebrew has no word for “where.” It has four words: “a language,” “not,” “I knew,” “I hear.” The last verb is in the imperfect, not the form of a finished past. Modern translations give it as a present, set the line apart from the verse and make it the doorway to what follows: “I hear a voice I had not known” (another has “a language” for “a voice”), and then, inside quotation marks, the speech of God. The ancient Greek kept the line in the past and in the third person: “he heard a language which he understood not.”

      However the half-line is read, the “I” of the next verse is no longer the singer. “I removed his shoulder from the burden” is God’s to say, and the speaker names Himself in verse 10: “I am the LORD thy God.”
    sources: [oshb-wlc, nrsvue, esv, lxx-rahlfs, lds-scriptures]

  - ref: 6
    phrase: his hands were delivered from the pots
    kind: words
    title: Baskets, not cooking pots
    body: |
      The “pots” are the baskets in which the slaves carried clay and bricks. The Hebrew word can mean a pot for cooking, but this verse is placed under its other sense, a “receptacle for carrying,” a sense the ancient versions translate “basket,” with the load here given as “clay or bricks.” Modern translations have “your hands were freed from the basket.”

      God begins by speaking of Israel as “him.” In verse 7 He turns to “thee,” and modern translations make the change a verse early, noting that the Hebrew of verse 6 has “his.”
    sources: [bdb, nrsvue]

  - ref: 7
    phrase: I proved thee at the waters of Meribah
    kind: scripture
    title: Meribah, where Israel tested God, told as God’s test of Israel
    body: |
      Exodus says that Israel put the LORD to the test at Meribah; the psalm says that the LORD was testing Israel. When the people had no water and quarrelled with Moses, the place was named “Massah, and Meribah, because of the chiding of the children of Israel, and because they tempted the LORD, saying, Is the LORD among us, or not?” ([[Ex. 17:7]]). Psalm 95 tells it that way in its warning about hearing: “To day if ye will hear his voice” ([[Ps. 95:7]]), “Harden not your heart, as in the provocation” ([[Ps. 95:8]]), “When your fathers tempted me, proved me, and saw my work” ([[Ps. 95:9]]). “Provocation” there is the name Meribah, and “proved” is the verb of this verse.

      The verb means to “prove, test, try,” and is used elsewhere with “the metaphor of gold.” The two psalms are filed apart: Psalm 95 under “man testing or tempting God,” this verse under “God testing persons.”

      The first half of the line says where God’s answer came from. “The secret place of thunder” is a “hiding-place of thunder,” the storm cloud that covers God when He appears. David’s song has the same Hebrew word: “He made darkness his secret place” ([[Ps. 18:11]]). The cross-references of modern translations point to Sinai, where “there were thunders and lightnings, and a thick cloud upon the mount” ([[Ex. 19:16]]).
    sources: [lds-scriptures, oshb-wlc, bdb, nrsvue]

  - ref: 10
    phrase: I am the LORD thy God, which brought thee out of the land of Egypt
    kind: scripture
    title: The opening words of Sinai, spoken again at the feast
    body: |
      Verses 9 and 10 repeat the beginning of the Ten Commandments in reverse order. At Sinai God first named Himself, “I am the LORD thy God, which have brought thee out of the land of Egypt, out of the house of bondage” ([[Ex. 20:2]]), and then commanded, “Thou shalt have no other gods before me” ([[Ex. 20:3]]). Here the command comes first, “There shall no strange god be in thee,” and the name after it. It is one of only two places where the psalm uses the name LORD (the other is verse 15); everywhere else it says “God.”

      The summons in verse 8 is nearly the line with which God opens His case in another psalm of Asaph: “Hear, O my people, and I will speak; O Israel, and I will testify against thee: I am God, even thy God” ([[Ps. 50:7]]). “Testify” is the same Hebrew verb in both psalms, and a modern translation gives it here as “while I admonish you”: the testimony is a warning.

      What follows the name is not another commandment. It is a promise, “open thy mouth wide, and I will fill it,” and the last verse of the psalm speaks of feeding again (see the note on verse 16).
    sources: [lds-scriptures, oshb-wlc, nrsvue]

  - ref: 12
    phrase: I gave them up unto their own hearts
    kind: words
    title: A punishment that consists of being let go
    body: |
      God’s answer to a people who would not listen is to stop holding them. The Hebrew verb is listed for this verse under the sense “give over”; the ancient Greek has “I let them go after the ways of their own hearts,” and a modern translation, “I gave them over to their stubborn hearts.”

      “Lust” translates a noun that means “firmness, always = stubbornness.” It occurs in the Psalms only here, and it is Jeremiah’s word: eight of the ten places listed for it are his. Jeremiah says of the fathers who were brought out of Egypt what this psalm says, with the same two nouns: they “hearkened not, nor inclined their ear, but walked in the counsels and in the imagination of their evil heart” ([[Jer. 7:24]]). “Imagination” there is this verse’s “lust,” and “counsels” is its “counsels.”

      Paul writes of a judgment of the same kind: “God also gave them up to uncleanness through the lusts of their own hearts” ([[Rom. 1:24]]).
    sources: [bdb, oshb-wlc, lxx-rahlfs, nrsvue, lds-scriptures]

  - ref: 13
    phrase: Oh that my people had hearkened unto me
    kind: words
    title: The Hebrew of the wish
    body: |
      The Hebrew of this wish is less tied to the past than the King James’s “had hearkened.” The King James gives verses 13–16 as a look back at what Israel lost, and the Church’s chapter heading summarizes them so. In the Hebrew a participle follows the particle of wishing, and the construction in this verse has been translated “if my people were hearkening to me.” Modern translations follow: “O that my people would listen to me,” and then, “Then I would quickly subdue their enemies.”

      The same particle opens the LORD’s wish in Isaiah, which the King James also gives as a look back: “O that thou hadst hearkened to my commandments! then had thy peace been as a river” ([[Isa. 48:18]]). Moses reports a like wish of the LORD’s from the day the commandments were given: “O that there were such an heart in them, that they would fear me, and keep all my commandments always” ([[Deut. 5:29]]).
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]

  - ref: 15
    phrase: but their time should have endured for ever
    kind: words
    title: Enemies who cringe, and whose time lasts
    body: |
      The verse promises that the LORD’s enemies would yield, and its second half can be read of them or of Israel. “Submitted themselves” is a verb for a show of obedience, to “cringe = come cringing”; a modern translation has “would cringe before him.”

      “Their time” is the question. If “their” means the haters, the time is their punishment: “their doom would last forever.” If it means Israel, as the King James’s “but” suggests, the time is the nation’s good days. On one older reading the promise “relates to Israel and all the members of the nation,” and “time” means “duration, and in this instance with the collateral notion of Prosperity,” though the same reading grants that the word is used elsewhere “of the term of punishment.” The Hebrew says only “their time,” and translations differ.
    sources: [bdb, oshb-wlc, nrsvue, delitzsch-psalms]

  - ref: 16
    phrase: with honey out of the rock should I have satisfied thee
    kind: scripture
    title: Wheat and honey from the Song of Moses
    body: |
      The food of the last verse is the food of Moses’ farewell song. There the LORD “made him to suck honey out of the rock, and oil out of the flinty rock” ([[Deut. 32:13]]) and fed him “with the fat of kidneys of wheat” ([[Deut. 32:14]]). Where the King James has “the finest of the wheat” here, the ancient Greek has “the fat of wheat,” the song’s own word.

      The cross-references of modern translations set two more of the psalm’s lines beside that song. Its “strange god” is there: “the LORD alone did lead him, and there was no strange god with him” ([[Deut. 32:12]]). So is the refusal of verse 11: “Jeshurun waxed fat, and kicked” ([[Deut. 32:15]]).

      The persons shift once more. The first verb in the Hebrew is in the third person. The ancient Greek took the whole verse as a look back, “he fed them with the fat of wheat; and satisfied them with honey out of the rock,” while a modern translation prints “I would feed you” and notes that the Hebrew has “he would feed him.” The last word of the psalm is in the first person and speaks to “thee.”
    sources: [lds-scriptures, lxx-rahlfs, nrsvue, esv, oshb-wlc]

christ: |
  The speaker of verses 6–16 names Himself: “I am the LORD thy God, which brought thee out of the land of Egypt.” LORD is the name Jehovah, and “Jehovah is the premortal Jesus Christ.” Paul reads the wilderness years so. Israel “drank of that spiritual Rock that followed them: and that Rock was Christ” ([[1 Cor. 10:4]]), and the water at Meribah, where Moses struck a rock, is the passage set beside Paul’s words where the Church teaches that “Christ was the Jehovah of the Old Testament.”

  By that teaching, the LORD who says in this psalm that He brought Israel out of Egypt is the Savior before His birth.

explore: |
  - **The other psalms in which God speaks to His people at worship.** [[Ps. 50]], where He opens with nearly the same summons, and [[Ps. 95]], where the warning is about Meribah.
  - **The Song of Moses.** [[Deut. 32:10–18]], for the honey from the rock, the fat of the wheat, the strange god, and what Israel did when it was full.
  - **“O that.”** [[Deut. 5:29]] and [[Isa. 48:18]], two more wishes of the LORD that His people would hearken.
  - **Meribah.** [[Ex. 17:1–7]] and [[Num. 20:1–13]], the two times water came from a rock.

