chapter: 12
title: Pure Words
tagline: Surrounded by flattery and boasting, the psalmist asks the LORD to save, hears the LORD answer in His own voice, and finds those words as pure as silver refined seven times.
when: 'Undated; a psalm of David by its title'

setting: |
  The title ascribes the psalm to David and names no occasion. Its musical direction, Sheminith, is explained at [[Ps. 6:1]]; “To the chief Musician” is explained at [[Ps. 8:1]].

  The psalm is a lament, “a cry for help from the righteous against the (verbal) attacks of the wicked.” (How a lament is built is set out at [[Ps. 22:1]].) It mentions no battle, sickness or exile. The trouble is what people say: empty talk, flattery and boasting. Verse 5 adds the oppression of the poor.

  What sets the psalm apart is its middle. In verse 5 the LORD answers in His own voice (see the first note on that verse). Isaiah has the LORD say the same words: “Now will I rise, saith the LORD” ([[Isa. 33:10]]).

  Joseph Smith revised the psalm early in 1833, and his changes turn it toward a day still to come; see the first note on verse 1.

thread: |
  Psalm 12 is about words, and it sets two kinds of speech against each other. **The turn comes when the LORD speaks.**

  Verses 1–2 complain of what people say to one another: “vanity,” flattery, a double heart. The Hebrew verb for speaking comes three times in verses 2 and 3. Verses 3–4 ask the LORD to silence such talk, and then let the talkers be heard for themselves: “our lips are our own: who is lord over us?”

  Verse 5 is the answer, and it comes in another voice. The LORD says why He is rising (the poor are oppressed, the needy sigh) and what He will do. One Hebrew verb reports what the boasters “have said” and what the LORD “saith.”

  Verse 6 then weighs His words as verses 2–4 weighed theirs, and finds them pure, like silver refined seven times. On that the speaker rests verse 7: the LORD will keep the poor from this generation for ever.

  Verse 8 looks around again, and the wicked are still on every side. The psalm reports no rescue. Between its first verse and its last the speaker has been given a word and has judged it reliable, and his hope stands on that word while the present stays as dark as it was.

sections:
  - range: 1-2
    heading: No one left whose word holds
    plain: |
      Save, LORD, for the godly are no more; the faithful have vanished from among the children of men. Everyone speaks emptiness to his neighbor. They speak with smooth lips and with a double heart.
  - range: 3-4
    heading: A wish against the boasting tongue
    plain: |
      May the LORD cut off all smooth lips and the tongue that talks big, those who have said, “With our tongue we will prevail. Our lips are our own. Who is master over us?”
  - range: 5-6
    heading: The LORD speaks, and His words are pure
    plain: |
      “Because the poor are oppressed, because the needy sigh, now I will arise,” says the LORD. “I will set him in safety from the one who puffs at him” (or “in the safety he pants for”). The words of the LORD are pure words, like silver refined in a furnace of earth and purified seven times.
  - range: 7-8
    heading: Kept in a generation that has not changed
    plain: |
      You, LORD, will keep them; You will guard him from this generation for ever. The wicked walk about on every side when worthlessness is exalted among the children of men.

notes:
  - ref: 1
    phrase: Help, LORD
    kind: scripture
    title: Joseph Smith’s revision sets the psalm in the day of judgment
    body: |
      Joseph Smith’s revision of this psalm, made about January and February 1833, turns a plea from the psalmist’s own day into a prophecy of a day to come.

      The first verse begins, “In that day thou shalt help, O Lord, the poor and the meek of the earth.” “In that day” has been read as “a clear reference to the future day of God’s judgment, retribution, and triumph,” and the same three words open the revised Psalm 11.

      The LORD’s speech in verse 5 is lengthened. It opens, “Therefore, thus saith the Lord, I will arise in that day, I will stand upon the earth, and I will judge the earth for the oppression of the poor,” and it adds that the Lord “shall sit in judgment.” The words “thus saith the Lord,” common in scripture where a prophet declares the words of God, are never used in the King James Psalms, and their addition here “makes this psalm prophetic.”

      The last verse gains a clause. The wicked walk on every side, “but in the day of their pride thou shalt visit them,” and the visit is one of punishment. The King James psalm ends with the wicked “left in their positions of power and authority” (see the note on verse 8); the revision ends with their reckoning.

      These changes follow a pattern in the Prophet’s work on the Psalms, in which verses were “shifted to future tense” and their message brought “forward to the last days and the Lord’s Coming.”
    sources: [lefevre-jst-psalms, mcconkie-poetic-writings]
  - ref: 1
    phrase: the godly man ceaseth
    kind: words
    title: The godly are no more
    body: |
      The complaint is that faithful people have disappeared, and it is said as though none were left. “The godly man” is *hasid*, the word explained at [[Ps. 4:3]], and “ceaseth” is a verb meaning to “come to an end, be no more.” The second half of the line says it again: “the faithful have vanished” from among men. A modern translation has “there is no longer anyone who is godly; the faithful have disappeared from humankind.”

      Micah makes the same complaint with the same word: “The good man is perished out of the earth: and there is none upright among men” ([[Micah 7:2]]).
    sources: [oshb-wlc, bdb, nrsvue]
  - ref: 2
    phrase: with flattering lips and with a double heart
    kind: words
    title: Smooth lips, and a heart and a heart
    body: |
      Both phrases are more concrete in Hebrew than in English. The word behind “flattering” is “smoothness,” the word used of the smooth part of Jacob’s neck ([[Gen. 27:16]]), and so of “flattery.” Isaiah has it for what the people wanted from their prophets: “speak unto us smooth things, prophesy deceits” ([[Isa. 30:10]]), which are “agreeable, flattering things.”

      “A double heart” is in Hebrew the word for heart said twice, joined by “and”: with a heart and a heart. The same pair of words is used of Zebulun’s fighting men, who “could keep rank: they were not of double heart” ([[1 Chr. 12:33]]). A modern translation gives the sense of the psalm’s phrase as “a deceitful heart.”
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]
  - ref: 3
    phrase: The LORD shall cut off
    kind: words
    title: A wish that the LORD would act
    body: |
      “Shall cut off” is a wish in Hebrew and not a forecast. The verb is a jussive, the form English renders with “may” or “let,” and a modern translation has “May the Lord cut off all flattering lips.” The ancient Greek agrees: “Let the Lord destroy all the deceitful lips.”

      So the psalm has moved from complaint to petition, and what it asks is that the LORD act. Prayers of this kind are taken up at [[Ps. 137:8]].
    sources: [oshb-wlc, nrsvue, lxx-rahlfs]
  - ref: 4
    phrase: 'who is lord over us?'
    kind: words
    title: The boast of having no master
    body: |
      The flatterers’ boast is that their lips are their own and that no one is master over them. “Lord” here is *adon*, the title explained at [[Ps. 110:1]], and a modern translation has “who is our master?” Where the King James has “are our own,” the Hebrew has the preposition “with” and the pronoun “us”: our lips are with us.

      The first clause of their boast is less certain. It may be “to our tongue will we give strength,” or, on another reading, “we will confirm covenant with our tongue.”
    sources: [oshb-wlc, bdb, nrsvue]
  - ref: 5
    phrase: now will I arise, saith the LORD
    kind: structure
    title: The LORD answers inside the psalm
    body: |
      At verse 5 the speaker changes: the psalm stops talking to the LORD and about Him and quotes Him. Nothing explains how the word came. One older reading is that the psalmist here passes over “into the tone of an inspired prophet,” one who directly hears what God says, and it names Psalm 2 as the other example ([[Ps. 2:6]]).

      “Saith the LORD” appears in the King James Psalms only in this verse, and Isaiah has the same four Hebrew words: “Now will I rise, saith the LORD; now will I be exalted; now will I lift up myself” ([[Isa. 33:10]]). On that reading the “now” is “the decisive turning-point from forebearance to the execution of judgment.”

      The LORD gives His reasons before His decision: “the oppression of the poor” and “the sighing of the needy.” That the Lord is “the champion of the poor and needy” is “a recurring theme in Psalms.”
    sources: [delitzsch-psalms, oshb-wlc, lds-scriptures, ot-minute-psalms-1-20]
  - ref: 5
    phrase: I will set him in safety from him that puffeth at him
    kind: words
    title: Safety, and who is puffing
    body: |
      The last clause of the LORD’s speech is difficult Hebrew, and translations differ over who is breathing hard. The King James takes the verb as it is used at [[Ps. 10:5]], where the wicked man “puffeth at” his enemies: to “puff, snort, against” someone, or to scoff at him. On that reading the LORD puts the poor man out of the scoffer’s reach.

      Most interpreters take it of the sufferer. To puff is then to “pant for it,” and a modern translation has “I will place them in the safety for which they long.” The ancient Greek translators read something different again: “I will speak to them thereof openly.”

      On either reading the promise is “safety,” a word whose range runs from “safety, welfare” to “deliverance, rescue, salvation.”
    sources: [bdb, nrsvue, lxx-rahlfs, ot-minute-psalms-1-20]
  - ref: 6
    phrase: as silver tried in a furnace of earth, purified seven times
    kind: symbol
    title: Words with no dross in them
    body: |
      The image of refined silver says that the LORD’s words, unlike the words of verses 2–4, have nothing false mixed into them. Verse 6 is the psalmist’s response to what he has just heard, and it has been called his “Amen” to verse 5.

      Silver “tried” is silver smelted: the verb is to “smelt, refine,” and what comes out is “the purest silver, entirely purged from dross.” “Pure words,” on that reading, are words meant and to be fulfilled exactly as they stand, “without any admixture whatever of untruthfulness.” Seven is “the number indicating the completion of any process.” Where the flattering and proud words of the wicked come from a double heart, “the Lord’s promises are pure and sure.” A modern translation prints “promises” for “words.”

      The same verb describes the LORD’s word elsewhere: “the word of the LORD is tried” ([[Ps. 18:30]]), and “Every word of God is pure” ([[Prov. 30:5]]), where the King James translates it “pure.”

      “A furnace of earth” renders a word found only here. It is usually taken as a furnace or crucible, though that is “wholly dubious,” and a modern translation has “a furnace on the ground.”
    sources: [bdb, delitzsch-psalms, ot-minute-psalms-1-20, nrsvue, oshb-wlc]
  - ref: 7
    phrase: Thou shalt keep them
    kind: words
    title: Them is the poor, not the words
    body: |
      “Them” are the poor and needy of verse 5, not the words of verse 6. In English either is possible, and the words are nearer. In Hebrew “words” is a feminine noun, while the pronoun attached to “keep” is masculine plural. The pronoun attached to “preserve” is parsed as masculine singular, “him.”

      The ancient Greek has “Thou, O Lord, shalt keep us, and shalt preserve us,” and a modern translation likewise “You, O Lord, will protect us.” Either way it is people who are kept: the Lord “will keep and preserve the righteous poor and needy forever.” Joseph Smith’s revision names them: “save thy people, O Lord, thou shalt keep them.”
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, ot-minute-psalms-1-20, lefevre-jst-psalms]
  - ref: 8
    phrase: The wicked walk on every side
    kind: structure
    title: The psalm ends where it began
    body: |
      The last verse returns to the scene of the first, and the psalm ends with the wicked still walking about. Even the wording comes back: “the children of men” closes verse 1, and the same two Hebrew words close verse 8, where the King James has only “men.” What is “exalted” there is an abstract noun found only here, “worthlessness”; a modern translation has “as vileness is exalted among humankind.”

      One older reading takes the shape as the point. The psalm’s middle, the LORD’s words and the psalmist’s Amen, is “surrounded by four line strophes,” and at the close “the depressing view of the present prevails in the midst of the confession of a more consolatory hope.” The present is gloomy, and the promise stands in the middle of it: “The Psalm is a ring and this central oracle is its jewel.”

      Joseph Smith’s revision adds a last clause on the day the wicked are visited; see the first note on verse 1.
    sources: [oshb-wlc, bdb, nrsvue, delitzsch-psalms]

christ: |
  The hope of this psalm is that the LORD Himself will rise for the poor: “now will I arise, saith the LORD.” Isaiah has Him say the same words ([[Isa. 33:10]]).

  Joseph Smith’s revision sets that rising “In that day,” with the Lord standing on the earth to judge it (see the first note on verse 1). The change has been counted among those by which the revision enlarges what the Psalms say of “the first and second comings of Christ.”

  The psalm’s own witness is of the LORD’s character: He rises for the poor and the needy, and His words are pure.

explore: |
  - **The LORD as champion of the poor.** [[Ps. 72:4]], [[Ps. 72:12–13]] and [[Ps. 82:3–4]].
  - **The refined word.** [[Ps. 119:140]], beside the verses in the note on verse 6.
  - **Joseph Smith’s revision of the neighboring psalms.** The Religious Studies Center essay “‘Give Me Right Word, O Lord’: The JST Changes in the Psalms” prints changes to Psalms 10, 11 and 14 with the changes marked.

parallels:
  - ref: Isa. 33:10
    note: The LORD says the same words, “Now will I rise.”
  - ref: Ps. 18:30
    note: The word of the LORD is “tried,” the refining verb of verse 6 (also Prov. 30:5).
  - ref: 1 Chr. 12:33
    note: The men of Zebulun “were not of double heart,” the same Hebrew pair as verse 2.
  - ref: Micah 7:2
    note: The same complaint, with the same word for the godly man.

