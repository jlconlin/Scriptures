chapter: 11
title: The LORD Is in His Holy Temple
tagline: Told to fly to the hills because the foundations are giving way, the psalmist answers that he has a refuge already, and points to a throne in heaven and to eyes that see in the dark.
when: 'Undated; a psalm of David by its title'

setting: |
  The title ascribes the psalm to David and addresses it to the chief Musician, a phrase explained under the title of Psalm 4 ([[Ps. 4:1]]). It names no occasion.

  What the psalm itself shows is a man in danger whom others are urging to run. Archers have their arrows on the string, the order of things is collapsing, and the advice is to get to the mountains. One older reading places this at the time when Absalom’s rebellion was “secretly preparing,” with the advice coming from David’s own friends (see the note on verse 1). That is an inference from the psalm’s contents, and the psalm does not say so.

  From its first line to its last the psalm asks God for nothing. The speaker says where he has taken refuge, repeats the advice he has been given, and answers it with what he knows of the LORD.

  The Joseph Smith Translation rewrites verses 1–5, and the Church’s edition prints the revision in its appendix. There the psalm looks to the last days; the note on “to your mountain” in verse 1 takes it up.

thread: |
  The psalm is an argument with advisers. **Asked what the righteous can do when the foundations give way, the psalmist answers with where the LORD is and what He sees.**

  It opens with its conclusion: “In the LORD put I my trust.” Then it gives the other side a full hearing. The counsel is to flee to the hills like a bird (verse 1), because the wicked already have the arrow on the string and mean to shoot from the dark (verse 2), and because the foundations themselves are going: “what can the righteous do?” (verse 3). The New Revised Standard Version and the New International Version close the advisers’ speech at the end of verse 3.

  The turn is verse 4, and in the Hebrew it comes with no connecting word: “The LORD is in his holy temple, the LORD’s throne is in heaven.” Here the psalmist “justifies his confidence in God with which he began his song.” The LORD “sits enthroned above all that takes place on earth that disheartens those of little faith.”

  From there the psalm is about sight. The archers work in the dark, and the LORD’s eyes behold and His eyelids try. He examines the righteous, and the wicked are to be given their cup (verses 5–6). The last line reverses who is looking. The upright shall behold His face (verse 7; see the note there), and the Hebrew verb is the one used of the LORD’s eyes in verse 4.

sections:
  - range: 1-3
    heading: The advice to flee
    plain: |
      I have taken refuge in the LORD. How can you say to me, “Fly off to your mountain like a bird! Look, the wicked have bent the bow and set their arrow on the string, to shoot from the dark at the upright in heart. If the foundations are torn down, what can a righteous man do?”
  - range: 4-6
    heading: The LORD on His throne
    plain: |
      The LORD is in His holy temple; the LORD’s throne is in heaven. His eyes see, and His gaze searches humankind. The LORD examines the righteous, but the wicked and the one who loves violence He hates. On the wicked He will rain snares, fire and brimstone, and a scorching wind: that is the portion of their cup.
  - range: 7
    heading: The upright shall see His face
    plain: |
      For the LORD is righteous and loves righteous deeds. The upright will see His face.

notes:
  - ref: 1
    phrase: In the LORD put I my trust
    kind: words
    title: Trust here means taking refuge
    body: |
      The psalm’s first line is about shelter: the Hebrew verb is to “seek refuge,” and the New Revised Standard Version has “In the Lord I take refuge.” The verb is “mostly in poetry and figurative,” and it is the verb of the last line of Psalm 2, “Blessed are all they that put their trust in him” ([[Ps. 2:12]]).

      Here it is in the perfect tense: he has taken refuge already when he quotes the advice to seek refuge in the hills.
    sources: [bdb, nrsvue, oshb-wlc]
  - ref: 1
    phrase: Flee as a bird
    kind: history
    title: Who says Flee, and how far the advice runs
    body: |
      The psalm does not say who “ye” are or where their advice stops. One older reading takes them for friends: David “rejects the advice of his friends to save his life by flight.” On that reading, which places the advice at the time of Absalom’s rebellion, “your mountain” looks back to the earlier years when Saul hunted him, “to the mountains, which formerly so effectually protected you.” In those years David “remained in a mountain in the wilderness of Ziph” ([[1 Sam. 23:14]]), and he told Saul that the king was chasing him “as when one doth hunt a partridge in the mountains” ([[1 Sam. 26:20]]). The psalm names none of this, so the setting remains a reading.

      The Hebrew is uneven at this point, and the scribes marked it. The text as written (the *ketiv*) has a plural verb, “flee ye,” while the reading handed down beside it (the *qere*) has a singular that agrees with “my soul.” The word “your” is plural in both. The ancient Greek translation has “Flee to the mountains as a sparrow.”

      The King James Version has no quotation marks, so it does not show where the advice stops. The New Revised Standard Version and the New International Version carry it through verse 3 and close the quotation after “what can the righteous do?” Read so, verses 2 and 3 are the advisers’ reasons, and the psalmist’s own answer begins at verse 4.
    sources: [delitzsch-psalms, oshb-wlc, lxx-rahlfs, nrsvue, niv]
  - ref: 1
    phrase: to your mountain
    kind: scripture
    title: Flee unto my mountain in the Joseph Smith Translation
    body: |
      In the Joseph Smith Translation the call to flee is the Lord’s own, and it is set in the last days. The revision opens, “In that day thou shalt come, O Lord; and I will put my trust in thee,” and the words the King James gives to the advisers become His: “thou shalt say unto every soul, Flee unto my mountain; and the righteous shall flee like a bird that is let go from the snare of the fowler.” The mountain is now the Lord’s, and the righteous are told to flee to it.

      “In that day” has been read as “a clear reference to the future day of God’s judgment, retribution, and triumph,” and “my mountain” as a parallel to the “holy temple” of verse 4. The question of verse 3 is turned on the wicked, and the foundations become theirs: “But the foundations of the wicked shall be destroyed, and what can they do?” In verse 4 the Lord is not only in His temple but coming to it, “when he shall come into his holy temple.” Verse 5 adds, “The Lord loveth the righteous.”

      The work on the Psalms is dated to about January and February 1833. That is just after the revelation now in Doctrine and Covenants 88, which told the Saints to “establish a house, even a house of prayer” ([[D&C 88:119]]). It was “the first revelation in the Doctrine and Covenants that directed the Saints to build a temple in this dispensation.” So it has been suggested that the psalm’s mountain and temple “can be interpreted through that revelation.” With these changes the psalm has been called “a clear depiction of the Second Coming of Christ.”
    sources: [jst-ps-11, lefevre-jst-psalms, ot-minute-psalms-1-20]
  - ref: 2
    phrase: privily shoot
    kind: words
    title: Privily means from the dark
    body: |
      “Privily” stands for a Hebrew phrase meaning in the dark. The noun is “darkness, gloom,” used in this verse “of secrecy, treachery,” and the New Revised Standard Version has “to shoot in the dark at the upright in heart.”
    sources: [bdb, nrsvue]
  - ref: 3
    phrase: If the foundations be destroyed
    kind: words
    title: What the foundations may mean
    body: |
      The foundations are most likely what holds a people together. The Hebrew word occurs only here in the Psalms. It means “foundation, stay (of society),” and in this verse it is “probably figurative of established usages, laws, etc.,” though some have taken it of the nobles on whom a state rests.

      The second half of the line has been translated in two ways. The Hebrew verb is in the perfect, and the ancient Greek translation took it of the past: “For they have pulled down what thou didst frame, but what has the righteous done?” The King James and the New Revised Standard Version take it as a question about what is possible, “what can the righteous do?”

      The psalm does not answer by naming something the righteous can do. Verse 4 says where the LORD is.
    sources: [bdb, oshb-wlc, lxx-rahlfs, nrsvue]
  - ref: 4
    phrase: The LORD is in his holy temple
    kind: symbol
    title: A temple and a throne in heaven
    body: |
      The two halves of the line name the LORD’s dwelling twice, as a temple and as a throne in heaven. One reading takes the two as a pair, an earthly house and a heavenly one, so that the temple on earth “has its counterpart: God’s heavenly residence, his divine throne.” (On the two halves of a line of Hebrew verse, see [[Ps. 1:1]].)

      The Hebrew word for “temple” here “is most often used to refer to the Jerusalem temple,” and occasionally it is translated “palace.” On this reading a temple is where a king lives, so that “the Lord’s earthly temple was also his earthly palace, home to his earthly throne.”

      Habakkuk has the same words: “But the LORD is in his holy temple: let all the earth keep silence before him” ([[Hab. 2:20]]). The temple in the Psalms is taken up at [[Ps. 24:3]].
    sources: [skinner-seeing-god, lds-scriptures]
  - ref: 4
    phrase: his eyelids try
    kind: words
    title: Eyelids that try
    body: |
      “Try” here means to examine, and the “eyelids” are the eyes under another name. In Hebrew verse eyelids are “usually nearly = eyes,” set beside them as the second half of a pair, and the clause means that God’s eyes “search them through and through.”

      Verse 5 uses the same verb: “The LORD trieth the righteous.” Its first sense is to “examine, scrutinize, try,” and that is the sense given for this verse. Elsewhere it is used “with the metaphor of gold,” of a refiner’s testing. The testing of faith has been heard in the line as well: the psalm conveys that “although He tries the faith of the righteous, He loves them and will ultimately protect them from the wicked.”

      The King James sets the righteous on one side of verse 5 and the wicked on the other, and the Church’s chapter heading follows it. The ancient Greek translation divides the line differently, “The Lord tries the righteous and the ungodly,” and so does the New Revised Standard Version: “The Lord tests the righteous and the wicked.” That God is said to hate is taken up at [[Ps. 5:5]].
    sources: [bdb, ot-minute-psalms-1-20, lds-scriptures, lxx-rahlfs, nrsvue]
  - ref: 6
    phrase: he shall rain snares, fire and brimstone
    kind: symbol
    title: The rain of Sodom and the cup
    body: |
      The fire and brimstone are Sodom’s, and the cup is what the wicked are given to drink. Fire and brimstone raining from heaven are the words of its destruction: “Then the LORD rained upon Sodom and upon Gomorrah brimstone and fire from the LORD out of heaven” ([[Gen. 19:24]]). The psalm does not name the cities.

      “Snares” is the odd word in the list. The Hebrew as it stands has the word for a “bird-trap,” and the ancient Greek translation kept it: “He shall rain upon sinners snares, fire, and brimstone.” The word has also been read as a similar word for coal, and the New Revised Standard Version prints “On the wicked he will rain coals of fire and sulfur.”

      The “horrible tempest” is a burning wind. The Hebrew is “raging heat,” here “of burning wind,” and the New Revised Standard Version has “a scorching wind.”

      On one reading “the portion of their cup” is “what is adjudged to them as the contents of their cup which they must drain off.”
    sources: [lds-scriptures, bdb, lxx-rahlfs, nrsvue, delitzsch-psalms]
  - ref: 7
    phrase: his countenance doth behold the upright
    kind: words
    title: The upright shall behold His face
    body: |
      The psalm’s last line most likely says that the upright will see the LORD’s face. The King James translates it “in a manner that seems to depict the Lord’s face (countenance) looking upon the upright,” but the Hebrew “makes this statement in reverse order,” and the New Revised Standard Version follows it: “the upright shall behold his face.” The Church’s edition gives that rendering in its footnote.

      The King James has old company. The ancient Greek translation already reads “his face beholds uprightness.” Two reasons have been given against that rendering. In Hebrew usage the face “is always used only as that which is to be seen, not as that which itself sees.” And after the cup of the wicked in verse 6, “one expects to find something respecting the end of the upright in contrast to that of the ungodly.”

      Read this way, the line is a promise to the upright, and it might even be said that “only upright persons will see the Lord’s face, for that is the message of the passage.” The promise is one that several psalms share, a “confidence that the righteous who seek God’s face will ultimately have the privilege of beholding it.” Another psalm says it in the first person: “As for me, I will behold thy face in righteousness” ([[Ps. 17:15]]).
    sources: [ot-minute-psalms-1-20, nrsvue, lxx-rahlfs, delitzsch-psalms, skinner-seeing-god]

christ: |
  The Joseph Smith Translation reads the psalm of the Lord’s coming. It has Him come into His temple to try the children of men and to redeem the righteous, so that the revised psalm has been read as a picture of the Second Coming (see the note on “to your mountain” in verse 1).

  The psalm’s last promise is that the upright shall behold His face. In latter-day revelation the Lord promises the sight of His face in His own voice: “every soul who forsaketh his sins and cometh unto me, and calleth on my name, and obeyeth my voice, and keepeth my commandments, shall see my face and know that I am” ([[D&C 93:1]]).

explore: |
  - **Nephi’s psalm.** “Similar sentiments” of trust have been found in [[2 Ne. 4:15–35]], which ends, “O Lord, I have trusted in thee, and I will trust in thee forever” ([[2 Ne. 4:34]]).
  - **Seeing His face.** [[Ps. 17:15]], [[Ps. 24:6]], [[Ps. 27:8]] and [[Moses 1:2]].
  - **The revision in full.** The Joseph Smith Translation of Psalm 11:1–5, in the appendix of the Church’s edition of the Bible.

parallels:
  - ref: Gen. 19:24
    note: Brimstone and fire rained on Sodom and Gomorrah, in the words verse 6 uses.
  - ref: Hab. 2:20
    note: The same sentence, “the LORD is in his holy temple.”
  - ref: 1 Sam. 26:20
    note: David, hunted by Saul, compares himself to a partridge in the mountains.
  - ref: Ps. 17:15
    note: The psalmist expects to behold the LORD’s face in righteousness.
  - ref: D&C 93:1
    note: The Lord promises that those who come to Him and keep His commandments shall see His face.
  - ref: 2 Ne. 4:34
    note: Nephi’s declaration of trust in the Lord.

