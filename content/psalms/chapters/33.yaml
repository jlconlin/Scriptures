chapter: 33
title: He Spake, and It Was Done
tagline: The upright are called to sing a new song to the LORD, whose word made the heavens and whose counsel outlasts the plans of nations; no army saves a king, but His eye is on those who hope in His mercy.
when: 'Undated; the psalm has no title and names no author or occasion'

setting: |
  Psalm 33 has no title in the Hebrew text, and it names no author and no occasion. No single voice speaks in it. It opens with a call to “ye righteous” and closes in the plural: “Our soul waiteth for the LORD.” It is a song for a congregation.

  It belongs with the psalms of praise, which “often begin with a command or call to Israel to gather as a community” and then “describe the power and the mercy of the Lord,” often “emphasizing his role as the creator.” Psalm 33 does exactly that. Three verses call for praise, with instruments and a shout, and the rest gives the reasons and closes in the congregation’s own words. Such psalms have been connected with Israel’s festival gatherings at the temple, though this psalm does not say when it was sung.

  Its first line picks up the last line of Psalm 32 (see the note on verse 1). It is also the first psalm to ask for “a new song,” a phrase that returns in five later psalms, in Isaiah, in the Revelation of John, and in the Doctrine and Covenants.

  Its sixth verse says that the heavens were made by the word of the LORD. Later scripture speaks of the Word by whom all things were made, and the note on that verse follows the line there.

thread: |
  The psalm is a call to praise followed by its reasons, and **the reasons all come down to one: what the LORD says holds, and nothing else does.**

  The call takes three verses. The reasons begin with “For” in verse 4: “the word of the LORD is right.” The psalm then follows that word outward. It made the heavens (verse 6), and the summary in verse 9 is as short as a line can be: “he spake, and it was done; he commanded, and it stood fast.” From creation the psalm turns to history. The nations have counsel and plans too, and the LORD brings them to nothing, while His own counsel “standeth for ever” (verses 10–11). The same Hebrew verb says that the creation “stood fast” and that the counsel “standeth.”

  Verse 12 is the hinge. Until then the psalm has spoken of all the earth; now it names one nation as blessed, the people the LORD chose. The second half says what that people has in Him. He looks from heaven on everyone (verses 13–15). The things kings count on, a large army, great strength, a horse, do not save (verses 16–17). His eye, though, is on “them that fear him, upon them that hope in his mercy” (verse 18).

  Then the congregation speaks for itself. “Them” becomes “our” in verse 20, and in the last verse, for the only time in the psalm, the singers address the LORD directly: “Let thy mercy, O LORD, be upon us, according as we hope in thee.” A hymn that began by telling the upright to sing ends as their prayer, and what it asks for is the mercy that verse 5 said fills the earth.

sections:
  - range: 1-3
    heading: The call to sing
    plain: |
      Shout for joy in the LORD, you righteous; praise befits the upright. Praise the LORD with the lyre; make music to Him on the harp of ten strings. Sing Him a new song; play well, with shouts of joy.
  - range: 4-9
    heading: The word that is right, and the word that made the heavens
    plain: |
      For the word of the LORD is upright, and everything He does is done in faithfulness. He loves righteousness and justice; the earth is full of the LORD’s steadfast love. By the LORD’s word the heavens were made, and all their host by the breath of His mouth. He gathers the waters of the sea like a heap and puts the deeps in storehouses. Let all the earth fear the LORD; let everyone who lives in the world stand in awe of Him. For He spoke, and it was; He commanded, and it stood.
  - range: 10-12
    heading: The counsel of the nations and the counsel of the LORD
    plain: |
      The LORD brings the counsel of the nations to nothing and frustrates the plans of the peoples. The counsel of the LORD stands for ever, the plans of His heart through every generation. Happy is the nation whose God is the LORD, the people He has chosen as His own inheritance.
  - range: 13-19
    heading: What He sees, and what does not save
    plain: |
      The LORD looks down from heaven and sees all humankind. From the place where He dwells He watches everyone who lives on the earth, He who forms the hearts of them all and understands everything they do. No king is saved by the size of his army; no warrior is delivered by his great strength. The war horse is a false hope for victory; for all its great strength it cannot rescue. But the eye of the LORD is on those who fear Him, on those who hope in His steadfast love, to deliver them from death and to keep them alive in famine.
  - range: 20-22
    heading: The congregation’s answer
    plain: |
      We wait for the LORD; He is our help and our shield. Our heart is glad in Him, because we trust in His holy name. Let Your steadfast love be upon us, O LORD, as we hope in You.

notes:
  - ref: 1
    phrase: Rejoice in the LORD, O ye righteous
    kind: scripture
    title: The psalm begins where Psalm 32 ends
    body: |
      The first line of Psalm 33 takes up the last line of Psalm 32. That psalm closes, “Be glad in the LORD, and rejoice, ye righteous: and shout for joy, all ye that are upright in heart” ([[Ps. 32:11]]). This one opens by calling the same two groups, the righteous and the upright, and its first verb, “Rejoice,” is in Hebrew the verb translated “shout for joy” there.

      The Hebrew text gives Psalm 33 no title and so leaves it anonymous. The ancient Greek translation supplies one, “A Psalm of David.”

      “Praise is comely for the upright” means that praise suits them: a modern translation has “Praise befits the upright.” The word “upright” matters for what follows. The first reason the psalm gives for praise is that “the word of the LORD is right” (verse 4), and “right” there is the same Hebrew word. The upright are asked to praise a word that is upright.
    sources: [lds-scriptures, oshb-wlc, lxx-rahlfs, nrsvue]
  - ref: 2
    phrase: the psaltery and an instrument of ten strings
    kind: words
    title: One instrument of ten strings
    body: |
      The King James makes two instruments of what the Hebrew gives as one, a harp “with ten strings.” The Hebrew has two words side by side with no “and” between them, the ancient Greek translation has “a psaltery of ten strings,” and a modern translation has “the lyre” in the first line and in the second “make melody to him with the harp of ten strings.” So the verse names two instruments, not three.

      The ten-stringed harp is joined to a new song once more in the book: “I will sing a new song unto thee, O God: upon a psaltery and an instrument of ten strings will I sing praises unto thee” ([[Ps. 144:9]]). What the harp and the psaltery were, and who played them at the temple, is told at [[Ps. 150:3]].
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, lds-scriptures]
  - ref: 3
    phrase: a new song
    kind: scripture
    title: Why the song is new
    body: |
      Where scripture gives a reason for a new song, the reason is something God has done. In Psalm 40 the singer has been brought up “out of an horrible pit” ([[Ps. 40:2]]) and says, “he hath put a new song in my mouth” ([[Ps. 40:3]]). Psalm 98 calls for one “for he hath done marvellous things” ([[Ps. 98:1]]). In John’s vision the new song is sung to the Lamb, “for thou wast slain, and hast redeemed us to God by thy blood” ([[Rev. 5:9]]). In modern revelation the Lord gives the words of a new song that all will sing together, and it too announces a deed: “The Lord hath redeemed his people, Israel” ([[D&C 84:99]]). One older reading defines the phrase accordingly: a new song is one that “in consequence of some new mighty deeds of God, comes from a new impulse of gratitude in the heart.”

      Psalm 33 is the first of six psalms to use the phrase (the others are 40, 96, 98, 144 and 149), and it does not say what the new deed was. The same reading supposes that the psalm owes its composition “apparently to some deliverance of the nation from heathen oppression,” brought about by God “and without war.” That is an inference, and the psalm itself names no event. The reasons it does give are creation, the LORD’s counsel, and His watch over those who fear Him.

      The song is to be loud. “A loud noise” translates a word for a shout, here a “shout of joy with religious impulse” that goes with the music.
    sources: [lds-scriptures, delitzsch-psalms, bdb]
  - ref: 6
    phrase: By the word of the LORD were the heavens made
    kind: christ
    title: The word that made the heavens
    body: |
      The psalm says that the LORD made the heavens by speaking, and later scripture says who the Word is. In the psalm itself “the word of the LORD” is what He says. Verse 4 has praised it as right, verse 6 says what it did, and verse 9 puts it without any image: “he spake, and it was done; he commanded, and it stood fast.” The creation account begins the same way: “And God said, Let there be light: and there was light” ([[Gen. 1:3]]). The second half of verse 6 says it again with “the breath of his mouth.”

      John opens his Gospel with the same beginning and gives the Word a name. “In the beginning was the Word, and the Word was with God, and the Word was God” ([[John 1:1]]), and “All things were made by him; and without him was not any thing made that was made” ([[John 1:3]]). And the Savior says of Himself, in the words of verse 9, “I am the same which spake, and the world was made, and all things came by me” ([[D&C 38:3]]).

      The psalmist praises a word of command. The New Testament and the Restoration add that the One who spoke is the Son.
    sources: [lds-scriptures]
  - ref: 7
    phrase: as an heap
    kind: words
    title: A heap of waters, or a bottle
    body: |
      The word “heap” is the word scripture uses for the waters that stood up at the Red Sea and at the Jordan. The Hebrew noun is used of the Red Sea in the song of Moses, “the floods stood upright as an heap” ([[Ex. 15:8]]), and in [[Ps. 78:13]], and of the Jordan when Israel crossed, where the waters “stood and rose up upon an heap” ([[Josh. 3:16]]). In Psalm 33 it is a comparison: the LORD gathers the sea as such a heap.

      The ancient Greek translation reads the line differently: He “gathers the waters of the sea as in a bottle.” A modern translation reads the same way. On that reading the two halves of the verse are a matched pair, a bottle and storehouses. On either reading the sea is something He gathers and stores.
    sources: [bdb, oshb-wlc, lxx-rahlfs, nrsvue, lds-scriptures]
  - ref: 11
    phrase: The counsel of the LORD standeth for ever
    kind: words
    title: What the LORD says stands
    body: |
      Verses 10 and 11 set the same two things on each side, counsel and plans, and say opposite things about them. In Hebrew the “counsel of the heathen” and the “counsel of the LORD” are one word, and so are the “devices of the people” and the “thoughts of his heart.” The translators varied the English, which hides how exact the contrast is. Nations have counsel and plans; the LORD has counsel and plans; theirs are brought to nothing and His stand. “Heathen” here is simply the Hebrew word for nations.

      “Standeth” is also a repeated word. It is the verb of verse 9, where the LORD commanded the creation “and it stood fast.” The psalm says of His counsel what it has just said of the creation: it stands.
    sources: [oshb-wlc, lds-scriptures]
  - ref: 12
    phrase: Blessed is the nation whose God is the LORD
    kind: scripture
    title: The nation is Israel, His inheritance
    body: |
      The blessed nation is Israel, as the second half of the line says: “the people whom he hath chosen for his own inheritance.” The inheritance is the LORD’s: the people are what He has taken as His own. The covenant at Sinai speaks of the same choosing: “ye shall be a peculiar treasure unto me above all people: for all the earth is mine” ([[Ex. 19:5]]).

      The word “Blessed” is explained at [[Ps. 1:1]]. One older reading hears in this part of the psalm the last words of Moses’ blessing on the tribes, where the same Hebrew word is translated “Happy”: “Happy art thou, O Israel: who is like unto thee, O people saved by the LORD, the shield of thy help” ([[Deut. 33:29]]). On that reading this part of the song “is like a paraphrase” of Moses’ line. Verses 16–17 say that this people has in the LORD “a stronger defence than the greatest worldly power would be,” and in the congregation’s confession at the end, “he is our help and our shield” (verse 20), “we still hear the echo” of Moses’ words.
    sources: [lds-scriptures, nrsvue, delitzsch-psalms]
  - ref: 15
    phrase: He fashioneth their hearts alike
    kind: words
    title: Alike means all of them
    body: |
      The line says that the LORD forms every heart, not that He makes all hearts the same. The Hebrew word behind “alike” means together or altogether, and the clause is “who formeth the hearts of them all together.” A modern translation has “he who fashions the hearts of them all.”

      Verses 13 and 14 have said three times that the LORD looks on all people. On one older reading, verse 15 says why His looking reaches so far: He “considereth all their works” because He made the place they come from, and so knows what people do from “their origin in the laboratory of the heart, which He as Creator has formed.”
    sources: [bdb, nrsvue, delitzsch-psalms]
  - ref: 17
    phrase: An horse is a vain thing for safety
    kind: words
    title: The horse is called a lie
    body: |
      The Hebrew calls the war horse a lie. “A vain thing” translates the ordinary word for falsehood, used here of “what deceives, disappoints, and betrays one.” The psalm does not say the horse is weak. It grants the horse “great strength” and says that the strength does not deliver.

      “Safety” is stronger in Hebrew than in English. The word is deliverance and, in battle, victory, and it answers “saved” in the line before, “There is no king saved.” A modern translation has “The war horse is a vain hope for victory.”

      One word runs through both verses. “Multitude” of a host, “much” strength and the horse’s “great” strength are the same Hebrew noun three times. What the king, the warrior and the rider have is quantity, and the psalm says three times that quantity is not what saves. Then verse 19 uses the warrior’s verb again. The mighty man “is not delivered,” and the eye of the LORD is on those who fear Him “to deliver their soul from death.”

      For the law that forbade Israel’s king to multiply horses, see the note on [[Ps. 20:7]].
    sources: [bdb, oshb-wlc, nrsvue]
  - ref: 18
    phrase: the eye of the LORD is upon them that fear him
    kind: words
    title: The eye on those who fear and hope
    body: |
      The LORD sees everyone, and the psalm marks with “Behold” that His eye rests in a particular way on those who fear Him. Verses 13–14 use three verbs for a gaze that takes in “all the sons of men” and “all the inhabitants of the earth.” Verse 18 does not take that back. It says where the looking has a purpose: “To deliver their soul from death, and to keep them alive in famine.”

      Those people are described by two words that the psalm has prepared. Verse 8 called on all the earth to “fear the LORD,” and “them that fear him” is the same root. And they “hope in his mercy.” Mercy is the Hebrew *hesed*, explained at [[Ps. 51:1]]. The King James hides its first appearance in the psalm, for “the goodness of the LORD” that fills the earth in verse 5 is the same word. It comes a third time in the last verse, with the same verb for hope: “Let thy mercy, O LORD, be upon us, according as we hope in thee.” So the congregation’s closing prayer takes its two chief words from verse 18.

      Another psalm puts verses 17 and 18 side by side in two lines: “He delighteth not in the strength of the horse: he taketh not pleasure in the legs of a man. The LORD taketh pleasure in them that fear him, in those that hope in his mercy” ([[Ps. 147:10–11]]).
    sources: [oshb-wlc, lds-scriptures]

christ: |
  The LORD of this psalm is Jehovah, and “Jehovah is the premortal Jesus Christ.” The psalm praises Him first as the Creator who spoke: “By the word of the LORD were the heavens made.” John says that all things were made by the Word, and in modern revelation the Savior says that He is the one who spoke; the note on verse 6 gives both passages.

  The psalm then praises Him as the one who saves when armies and horses do not, whose eye is on those who hope in His mercy “to deliver their soul from death.” The psalm speaks of rescue in war and famine and says no more than that. The new song of John’s vision is sung to the Lamb because He was slain and has redeemed by His blood ([[Rev. 5:9]], quoted in the note on verse 3).

explore: |
  - **The new song from here to the end.** Follow the phrase through [[Ps. 40:3]], [[Ps. 96:1]], [[Ps. 98:1]], [[Ps. 144:9]] and [[Ps. 149:1]], then [[Isa. 42:10]], [[Rev. 5:9]] and [[Rev. 14:3]], and read the words of the song the Lord gives in [[D&C 84:98–102]].
  - **Creation by a word.** Jacob reasons from it: “if God being able to speak and the world was, and to speak and man was created, O then, why not able to command the earth” ([[Jacob 4:9]]). Compare [[Heb. 11:3]] and [[Moses 1:32–33]].

parallels:
  - ref: Ps. 32:11
    note: The last line of the psalm before, which this psalm’s first line repeats.
  - ref: Gen. 1:3
    note: Creation by speech, which verses 6 and 9 sum up.
  - ref: John 1:1–3
    note: The Word by whom all things were made (also D&C 38:3).
  - ref: Deut. 33:29
    note: Israel happy as a people saved by the LORD, the shield of their help; compare verses 12 and 20.
  - ref: Ps. 147:10–11
    note: The horse’s strength set against those who fear the LORD and hope in His mercy.
  - ref: Rev. 5:9
    note: The new song sung to the Lamb (also D&C 84:98–102).

