chapter: 38
title: Rebuke Me Not in Thy Wrath
tagline: A man sick under God’s hand, left by his friends and hunted by his enemies, confesses his sin, answers no one but God, and ends still asking.
when: 'By its title, a psalm of David; no occasion is given'

setting: |
  Psalm 38 stands in Book One of the Psalms. Its title ascribes it to David and adds one more Hebrew word, taken up in the note on the title. It names no occasion in his life.

  The speaker is a sick man. His body is failing, his friends keep their distance, and enemies are laying snares. He says three times that the cause is his own: “my sin,” “mine iniquities,” “my foolishness.” The heading in the Church’s edition reads it the same way, as David sorrowing for sins that “rest as a disease upon him.”

  Christian tradition counts this among the seven penitential psalms, the psalms of repentance; the list is in the note on [[Ps. 6:1]]. Its first verse is nearly the first verse of Psalm 6, and that note takes up what the request means, discipline but not in anger. The difference comes afterward: Psalm 6 contains no confession of sin, and this psalm promises one in verse 18. One older reading goes further: if David’s adultery was the occasion, this psalm falls between Psalm 6 and Psalm 51. That is a reading; the psalm names no sin, and the chapter does not depend on it. David’s story is told once, at [[Ps. 51:1]].

  Two of its lines have possible echoes elsewhere in scripture, which the notes take up: one in Luke’s account of the cross, and one in the psalm of Nephi.

thread: |
  Psalm 38 is a lament that **never reaches its answer**. It opens with a plea, closes with a plea, and has no vow of praise.

  It has been laid out in three parts, and the names of God mark them. The first begins “O LORD” (verse 1), the second “Lord” (verse 9), and the third uses both, twice (verses 15 and 21–22).

  The first part is what God has done to him. The arrows and the hand are God’s, and each stage of the description is tied to a cause by “because of” or “For.” The second part is calmer. He has nothing to tell God that God does not already see: “all my desire is before thee.” Then he looks around him. Friends stand back, kinsmen “stand afar off,” and those who seek his life lay snares.

  To them he says nothing. He is “as a deaf man” and “a dumb man,” and verse 15 gives the reason in one word, “For”: he is waiting for God, and God will answer. Three more reasons follow, each opening with the same word (verses 16–18), and the last is a confession: “I will declare mine iniquity.”

  Nothing changes after it. The enemies are still strong, and the psalm ends asking, “be not far from me,” with a name for God that it has not used until its last word: “my salvation.”

sections:
  - range: 1-2
    heading: Not in thy wrath
    plain: |
      LORD, do not rebuke me in Your wrath or discipline me in Your burning anger. Your arrows have sunk into me, and Your hand has come down on me.
  - range: 3-8
    heading: No soundness in my flesh
    plain: |
      Because of Your anger no part of my body is sound; because of my sin there is no peace in my bones. My iniquities have risen over my head; like a heavy load they are more than I can carry. My wounds fester and smell because of my folly. I am bent and bowed very low; all day long I go about in mourning. My loins are full of burning, and no part of my body is sound. I am feeble and crushed; I groan aloud from the turmoil of my heart.
  - range: 9-12
    heading: Friends afar off, enemies near
    plain: |
      Lord, all that I long for is before You, and my sighing is not hidden from You. My heart pounds, my strength has left me, and the light has gone from my eyes. Those who love me and my friends stand back from my affliction, and my relatives stand far away. Those who want my life set traps; those who want to harm me talk of ruin and plot deceit all day long.
  - range: 13-15
    heading: As a deaf man
    plain: |
      But I am like a deaf man who does not hear, like a mute who does not open his mouth. I have become like a man who hears nothing and has no arguments in his mouth. For it is You, LORD, that I wait for; You will answer, O Lord my God.
  - range: 16-20
    heading: I will declare mine iniquity
    plain: |
      For I said, “Do not let them gloat over me, those who exalt themselves against me when my foot slips.” For I am about to fall, and my pain is always before me. For I confess my iniquity; I am anxious because of my sin. But my enemies are full of life and strong, and many hate me wrongfully. Those who repay good with evil oppose me, because I pursue what is good.
  - range: 21-22
    heading: Make haste to help me
    plain: |
      Do not forsake me, LORD. My God, do not be far from me. Hurry to help me, O Lord, my salvation.

notes:
  - ref: 0
    phrase: to bring to remembrance
    kind: words
    title: A title that may name an offering
    body: |
      The four English words are one Hebrew verb, to “cause to remember,” and what it asks for is not certain. It stands in one other title, that of Psalm 70, a short psalm that shares this psalm’s last request: “make haste to help me, O LORD” ([[Ps. 70:1]]).

      Chronicles uses the same form for a duty David gave the Levites before the ark: “to record, and to thank and praise the LORD God of Israel” ([[1 Chr. 16:4]]). On that evidence the title may mean “commemorate, praise.” The verb has a second sense, “make a memorial,” which is to offer the “memorial” portion of a meal offering, the handful the priest burned on the altar ([[Lev. 2:2]]). One modern translation takes the title that way: “for the memorial offering.” The ancient Greek translators had a third understanding, “for remembrance concerning the Sabbath-day.”
    sources: [bdb, oshb-wlc, nrsvue, lxx-rahlfs, lds-scriptures]

  - ref: 2
    phrase: thine arrows stick fast in me
    kind: symbol
    title: The arrows and the hand
    body: |
      The sufferer traces his sickness to God before he mentions any enemy. Job speaks the same way: “the arrows of the Almighty are within me” ([[Job 6:4]]).

      The King James “stick fast” and “presseth” translate one Hebrew verb used twice, a verb of coming down. The arrows “penetrate,” and the hand is said to “descend in chastisement.” Psalm 32 speaks of that hand in other words: “day and night thy hand was heavy upon me” ([[Ps. 32:4]]).
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]

  - ref: 3
    phrase: neither is there any rest in my bones
    kind: words
    title: Three causes, and a sickness the psalm does not explain
    body: |
      Three times in verses 3–5 the Hebrew repeats one preposition, “because of,” and the three causes move from God to the speaker: “because of thine anger,” “because of my sin,” “because of my foolishness.” The last word is the ordinary Hebrew for folly. “Rest” is *shalom*, peace, as the Greek translators kept it: “there is no peace to my bones because of my sins.”

      Whether the sickness is a sickness or a picture of sin, the psalm does not say. The Church’s heading words it as a comparison, and in scripture “physical illness sometimes serves as a symbol for a lack of spiritual well-being.” One passage given for that is the opening of Isaiah, where the nation is a body with “no soundness in it; but wounds, and bruises” ([[Isa. 1:6]]). The two passages share words: “no soundness” stands in verses 3 and 7 of the psalm, and its “wounds” in verse 5 are the Hebrew word behind Isaiah’s “bruises.”
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, gs-sick-sickness, lds-scriptures]

  - ref: 3
    phrase: because of my sin
    kind: scripture
    title: A possible echo in Nephi’s psalm
    body: |
      Nephi’s lament over his own weakness may draw on this verse. “And when I desire to rejoice, my heart groaneth because of my sins; nevertheless, I know in whom I have trusted” ([[2 Ne. 4:19]]). The words “my heart groaneth because of my sins” have been marked with Psalm 38:3 among the “potential allusions” in Nephi’s psalm, about a fifth of which is key words or phrases also found in the Psalter. What verse 3 itself shares with Nephi’s sentence is “because of my sin.”
    sources: [hilton-psalms-bom, lds-scriptures]

  - ref: 7
    phrase: a loathsome disease
    kind: words
    title: The loathsome disease is burning
    body: |
      The Hebrew names no disease. The word is a participle from a verb for roasting or parching, and the line is rendered “my loins are filled with burning”; a modern translation has the same. The Greek translators took it from a different verb of the same spelling and read, “my soul is filled with mockings.”

      So the psalm gives symptoms and no diagnosis: burning in the loins, festering wounds, a pounding heart, failing sight.
    sources: [bdb, nrsvue, lxx-rahlfs]

  - ref: 11
    phrase: my kinsmen stand afar off
    kind: scripture
    title: Those who stood afar off
    body: |
      His friends keep away from his “sore.” The Hebrew word is a “stroke,” used “especially of a disease, regarded as sent by a divine chastisement,” and this verse is listed under that sense. Read so, what they stand back from is a blow from God.

      Luke’s account of the Crucifixion has the scene. “And all his acquaintance, and the women that followed him from Galilee, stood afar off, beholding these things” ([[Luke 23:49]]). In the Greek translation of the psalm the kinsmen “stood afar off” in the two words Luke uses, and a modern translation cross-references Luke at this verse. Luke does not say that he has the psalm in mind.
    sources: [bdb, lxx-rahlfs, greek-nt, nrsvue, lds-scriptures]

  - ref: 13
    phrase: as a dumb man that openeth not his mouth
    kind: symbol
    title: Why he does not answer
    body: |
      He is silent toward those who speak against him, and verse 15 gives the psalm’s own reason with “For”: “in thee, O LORD, do I hope: thou wilt hear.” The Hebrew verb is “answer,” and a modern translation reads “it is you, O Lord my God, who will answer.” He does not answer because he expects God to.

      The “reproofs” he does not have are arguments: the word means “argument, impeachment,” and has been translated “retort.”

      One older reading puts his guilt first. “Consciousness of guilt and resignation close his lips,” and he gives up helping himself in order “to abandon his cause to God.”

      The next psalm has the silence again, with a reason: “I was dumb, I opened not my mouth; because thou didst it” ([[Ps. 39:9]]).
    sources: [oshb-wlc, bdb, nrsvue, delitzsch-psalms, lds-scriptures]

  - ref: 18
    phrase: I will be sorry for my sin
    kind: words
    title: Sorry means anxious
    body: |
      The Hebrew verb behind “sorry” means to “be anxious, concerned.” The Greek translators have “be distressed for my sin.” By this verb, what he is anxious about is the sin.

      The confession is the last of the four reasons that begin at verse 15, and it is made to God. What confession does in a psalm of David is set out in the note on [[Ps. 32:5]], the verse where he reports the answer, “and thou forgavest the iniquity of my sin” ([[Ps. 32:5]]). This psalm reports none.
    sources: [bdb, lxx-rahlfs, lds-scriptures]

  - ref: 20
    phrase: render evil for good
    kind: words
    title: Guilty before God, wronged by men
    body: |
      The man who has just confessed his sin says in the next verse that his enemies hate him “wrongfully” and return “evil for good.” The psalm says both and does not reconcile them.

      One older reading takes “the thing that good is” of his conduct toward these same men, the good “brought into exercise in relation to his present foes.” On that reading the good he claims is the good he has done to them.

      In verse 19 “lively” is “living.” A modern translation notes that the traditional Hebrew text has “my living foes,” and itself follows a manuscript from Qumran and reads “my foes without cause.”
    sources: [delitzsch-psalms, nrsvue]

  - ref: 22
    phrase: O Lord my salvation
    kind: structure
    title: A psalm that ends still asking
    body: |
      The last two verses are requests, and no answer is reported. The shape of a lament (see the note on [[Ps. 22:1]]) leads a reader to expect a vow of praise here. Of this psalm it has been said, “No lighting up of the darkness of wrath takes place.”

      What the ending does have is its last word. He calls the one whose arrows are in him “my salvation,” and one older reading finds in those words the mark of true repentance: “True repentance has faith within itself, it despairs of itself, but not of God.”
    sources: [delitzsch-psalms]

christ: |
  The psalm is prayed to the LORD from its first word to its last, and it knows Him in two ways at once: as the one whose hand has come down on the sinner, and as “my salvation.” The speaker asks for no other helper and makes his confession to no one else.

  Luke’s scene at the cross, where all who knew Jesus “stood afar off” ([[Luke 23:49]]), is close to the Greek of verse 11, though Luke does not cite it; the note on that verse sets the two side by side.

explore: |
  - **The same opening, without a confession.** [[Ps. 6]], read beside this psalm verse by verse.
  - **The confession answered.** [[Ps. 32:1–5]] and [[Ps. 51]], where David reports forgiveness or asks for a clean heart.
  - **The other psalm “to bring to remembrance.”** [[Ps. 70]], five verses that end as this one does.
  - **The silence continued.** [[Ps. 39:1–9]], where the speaker resolves to be dumb and then cannot keep it.
  - **Nephi’s lament.** [[2 Ne. 4:17–19]], and its turn to trust.

parallels:
  - ref: Ps. 6:1
    note: Nearly the same first verse; Psalm 6 confesses no sin.
  - ref: Ps. 70:1
    note: The only other psalm titled “to bring to remembrance” asks, “make haste to help me, O LORD.”
  - ref: Job 6:4
    note: Job also speaks of God’s arrows within him.
  - ref: Luke 23:49
    note: All who knew Jesus “stood afar off” at the cross, close to the Greek of verse 11.
  - ref: 2 Ne. 4:19
    note: “My heart groaneth because of my sins” has been listed as a possible allusion to verse 3.

sources: [lds-scriptures, gs-sick-sickness, hilton-psalms-bom, oshb-wlc, bdb, lxx-rahlfs, greek-nt, nrsvue, delitzsch-psalms]
