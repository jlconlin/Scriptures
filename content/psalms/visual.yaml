summary: >-
  Psalms is a hundred and fifty songs and prayers, sung from the valley of trouble to the
  hill of the Lord, and the book ends where it was always going, in praise. The image holds
  that movement in one quiet scene: a plain harp, a path rising by still water to the
  Lord's hill, and at its gate the stone the builders refused, now set as the head of the corner.
motifs:
  - "Most important: a plain wooden harp standing upright on a flat stone at the water's edge in the near foreground, a simple curved frame with a few strings, unplayed and at rest, its strings catching a thread of warm gold light. It is the focal point and must read clearly as an instrument of praise."
  - "Supporting: a path rising from the harp, beside a stretch of still water and soft green pasture, climbing gently toward a hill on the right."
  - "Supporting, small: at the crest of the hill, a simple open stone gateway of plain squared stones, its corner set with one larger, rougher stone that is clearly the head of the corner, with morning light resting on it."
composition: >-
  A wide landscape read from lower left to upper right. The harp and flat stone sit in the
  lower left third, beside calm water that runs back into the middle ground, with deep
  indigo and muted olive shadow around them. From the harp the path climbs in a gentle
  curve past the water and green pasture to the hill in the right third, where the gateway
  stands small against a warm, clear sky and the gold light gathers on its corner stone.
  The harp is the largest and most detailed object; the gateway is a quiet destination
  seen a little farther off, not a rival focal point. Open sky across the top, no other
  structures, no animals, no sun disc, and nothing in the scene that depicts distress or ruin.
alt: A plain wooden harp rests on a flat stone beside still water, with a path rising across green pasture to a stone gateway on a hill.
status: proposed
