summary: >-
  Psalms is a hundred and fifty songs and prayers that move from trouble to praise, and its
  best-loved psalm makes the same journey in six verses. The image is Psalm 23: a shepherd
  leading a few sheep on the path between a shadowed valley and still water, green pasture and morning light.
motifs:
  - "Most important: one shepherd seen from behind and at a little distance, walking ahead and leading, a plain staff in his hand, in simple undyed ancient Near Eastern clothing (a long tunic and a head cloth). No face is shown. He is small in the frame, a figure in a landscape, not a portrait."
  - "Most important: only four sheep following him, of different sizes, unevenly spaced along the path, each one large enough to be drawn as an individual animal. Not a flock, not a row."
  - "Supporting: on the left, the mouth of a deep rocky ravine in cool blue shadow, with the path running to it (the valley of the shadow of death)."
  - "Supporting: ahead of them, one broad stretch of still water with soft green pasture along its bank."
  - "Supporting: one single large tree with a broad crown standing at the water's edge (the tree planted by the rivers of water). Only one tree of any size in the whole picture."
  - "Background: one bare, gently rounded hill in the distance on the right, with the morning light rising from behind it. Nothing is built on it."
composition: >-
  A wide landscape. The left third is the ravine: tall cliffs in cool blue-violet shadow,
  with a dirt path running from the lower left foreground toward its mouth. On that path,
  left of centre, the shepherd walks ahead, small, staff in hand; the four sheep follow at
  uneven distances, the nearest one large in the lower left. Just right of centre stands
  the single tree at the edge of one calm sheet of water that fills the right middle
  ground, with green pasture between path and water. In the right background one bare
  rounded hill, the low morning sun at its shoulder, the sky clear blue above and warm
  gold near the hill. Few, large shapes, and open ground left open: no repeated bushes,
  stones or grass tufts. One light, the low sun at the right; every shadow falls toward
  the left and toward the viewer. No buildings, walls, gateway, ruins, instrument, table,
  cup or text.
