summary: >-
  Psalms is a hundred and fifty songs and prayers that move from trouble to praise, and its
  best-loved psalm makes the same journey in six verses. The image is Psalm 23: a shepherd
  leading a few sheep out of a shadowed valley toward still water, green pasture and morning light.
motifs:
  - "Most important: one shepherd seen from behind and at a little distance, walking ahead and leading, a plain staff in his hand, in simple undyed ancient Near Eastern clothing (a long tunic and a head cloth). No face is shown. He is small in the frame, a figure in a landscape, not a portrait."
  - "Most important: only four sheep following him, of different sizes, unevenly spaced along the path, each one large enough to be drawn as an individual animal. Not a flock, not a row."
  - "Supporting: on the left, the mouth of a deep rocky ravine in cool blue shadow, which they have just walked out of (the valley of the shadow of death)."
  - "Supporting: ahead of them, one broad stretch of still water with soft green pasture along its bank."
  - "Supporting: one single large tree with a broad crown standing at the water's edge (the tree planted by the rivers of water). Only one tree of any size in the whole picture."
  - "Background: one bare, gently rounded hill in the distance on the right, with the morning light rising from behind it. Nothing is built on it."
composition: >-
  Keep this exact arrangement (the author liked it in an earlier candidate). A wide landscape.
  The left third is the ravine: tall cliffs in cool blue-violet shadow, with a dirt path
  running from the lower left foreground up toward its mouth. On that path, left of centre,
  the shepherd walks away from the viewer, small, staff in his right hand; the four sheep
  follow behind him at uneven distances, the nearest one large in the lower left. Just right
  of centre stands the single tree at the edge of one calm sheet of water that fills the
  right middle ground, with green pasture between path and water. In the right background
  one bare rounded hill, the low morning sun just behind its shoulder, the sky clear blue
  above and warm gold near the hill.
  STYLE, most important for this image (the earlier candidate was too photorealistic): this
  is a drawn poster illustration, not a photograph and not a realistic painting. Build
  everything from flat and gently graded areas of colour with clean edges. The cliffs are a
  few large faceted planes, not detailed rock. The sheep are simple rounded cream shapes
  with a darker face and legs; draw no individual curls of fleece. The grass is flat areas
  of green and gold with only a few drawn blades at the front; no field of fine grass
  texture. The tree's crown is a handful of large leaf masses, not individual leaves. The
  water is a flat graded surface with one soft band of reflected light, no ripples or
  sparkle. The rocks are a few simple faceted shapes. No photographic detail, no fine
  texture, no lens glow or light rays, no haze effects. It should look like a screen print
  or a mid-century travel poster in muted natural colours.
  Use few, large shapes and leave open ground open; do not fill it with repeated bushes,
  stones or grass tufts. Light: one low morning sun at the right, every shadow falling
  toward the left and toward the viewer, no second light source, no glow from the figure,
  no halo. No buildings, walls, gateway, ruins, instrument, table, cup or text.
alt: A shepherd with a staff leads four sheep out of a shadowed ravine toward still water, a single tree and green pasture in morning light.
status: proposed
