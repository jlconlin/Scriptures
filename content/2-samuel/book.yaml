intro: |
  The second book of Samuel is the reign of David. It opens with the news of Saul's death and David's lament for Saul and Jonathan, and for seven years David reigns over Judah at Hebron while the house of Saul holds the other tribes. Then all the tribes come to him, and he takes the Jebusite stronghold of Jerusalem, brings the ark of the covenant up to it, and asks to build the LORD a house. Through Nathan the prophet the LORD answers that He will build David a house instead, a line of kings, and that “thy throne shall be established for ever” ([[2 Sam. 7:16]]): the promise the prophets and the New Testament read as fulfilled in Jesus Christ, the Son of David.

  At the height of his power David takes Bath-sheba, the wife of one of his own soldiers, and has her husband Uriah killed in battle. Nathan tells him a parable and then says, “Thou art the man” ([[2 Sam. 12:7]]), and that “the sword shall never depart from thine house” ([[2 Sam. 12:10]]). The rest of the book carries it out: his son Amnon's violence against his sister Tamar, Absalom's revenge and revolt, David's flight from Jerusalem, and his grief, “O my son Absalom” ([[2 Sam. 18:33]]). The book ends with a famine, David's song of deliverance, his last words, and a census that brings a plague and leads him to buy the threshing floor where the temple will stand. This companion goes through all twenty-four chapters and tries to anticipate the questions a careful reader would ask: why Uzzah died, what the covenant with David promised, what latter-day revelation says of David's wives and his sin, and who moved David to number Israel.

  For the period, see [The Conquest, the Judges, and One Kingdom](/old-testament/guides/the-conquest-judges-and-kingdom/#rulers) and [A Timeline of the Old Testament](/old-testament/guides/israels-story/#judges); for Bath-sheba, Tamar and David's wives, see [Women and Marriage in the Old Testament](/old-testament/guides/women-and-marriage/#plural-marriage).

# Proposed (BRIEF.md, "Divisions"): the seminary manual's three parts. Keys must not repeat another book's
# (the colors are global variables).
divisions:
  - key: samreign
    range: [1, 10]
    name: The LORD God of Hosts Was with Him
    blurb: David mourns Saul and Jonathan and is anointed king of Judah at Hebron. Abner and Ish-bosheth are killed, and all Israel anoints David. He takes Jerusalem, brings up the ark, and the LORD promises him a house and a throne for ever. He shows kindness to Jonathan's son and subdues his enemies.
    color: '#8a6a2a'
    darkColor: '#e6c88a'
  - key: samnathan
    range: [11, 12]
    name: Thou Art the Man
    blurb: David takes Bath-sheba and arranges the death of her husband, Uriah. Nathan tells him the parable of the ewe lamb, and David confesses. The child dies, and Solomon is born.
    color: '#7a3a4a'
    darkColor: '#e0a0b2'
  - key: samsword
    range: [13, 24]
    name: The Sword Shall Never Depart from Thine House
    blurb: Amnon forces Tamar, and Absalom kills him, returns, and steals the hearts of Israel. David flees, Absalom is killed, and David weeps for him. Then Sheba's revolt, the Gibeonites, David's song and last words, his mighty men, and the census that ends at the threshing floor of Araunah.
    color: '#3a5a7a'
    darkColor: '#a0c0e0'

