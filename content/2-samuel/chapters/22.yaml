chapter: 22
title: Thou Art My Lamp, O LORD
tagline: David's song of thanksgiving for a life of rescues, the same song as Psalm 18, set near the close of his story; it ends with the LORD's mercy to His king and to David's seed for evermore.
when: 'In the day that the LORD had delivered him out of the hand of all his enemies'

setting: |
  Chapters 21–24 close 2 Samuel, and they are not told in order. They gather two judgments on Israel and what atoned for them (the famine of [[2 Sam. 21:1–14]] and the census of chapter 24), lists of battles with the Philistines and of David's mighty men ([[2 Sam. 21:15–22]]; [[2 Sam. 23:8–39]]), and between them two poems: this song and “the last words of David” ([[2 Sam. 23:1–7]]). On one older reading the famine came earlier in the reign and is told here only because no fitting place had come before, and the two poems are the heart of the section. In the song, on that reading, David looks back at the close of his life on all the mercy and faithfulness he had received.

  The song is also Psalm 18, already written on this site ([[Ps. 18]]). This chapter says how the two copies differ; the notes on the psalm explain the song itself, verse by verse. It and Hannah's song at the other end of the books of Samuel ([[1 Sam. 2:1]]) have been read as echoes of each other and “formal ‘bookends’” to the stories of Samuel, Saul and David.

thread: |
  The song tells David's life as one rescue. A man going under in the waves of death cries out (verses 5–7); the LORD comes down in earthquake and storm and draws him out of many waters (verses 8–20); and then the LORD arms him to stand, so that every victory that follows is given (verses 30–46). The notes on [[Ps. 18]] follow that movement.

  Set in Samuel, the song is heard after Bath-sheba and Uriah, Amnon, Absalom and Sheba, and a reader comes to “The LORD rewarded me according to my righteousness” (verse 21) with chapters 11 and 12 in mind. The book does not say when David first sang it. One older reading thinks it probably early, after Nathan's promise and before David's sin, because of its joyous tone and “its bold expressions of conscious integrity”; another has David compose it in the later years of his reign. What David claims in those verses, and the exception the history itself names, is at [[Ps. 18:20]].

  Wherever it was first sung, the book places it at the end of the reign, and it ends with the LORD and not with David: the LORD is “the tower of salvation for his king,” and His mercy runs “unto David, and to his seed for evermore” (verse 51).

sections:
  - range: 1
    heading: The day of deliverance
    plain: |
      David spoke the words of this song to the LORD on the day the LORD rescued him from the hand of all his enemies, and from the hand of Saul.
  - range: 2-4
    heading: My rock, my fortress, my deliverer
    plain: |
      He said: The LORD is my rock, my stronghold and my rescuer. He is the God of my rock, in whom I take refuge; my shield, the horn that saves me, my high tower, my refuge and my saviour. You save me from violence. I call on the LORD, who is worthy of praise, and so I am saved from my enemies.
  - range: 5-7
    heading: The waves of death, and a cry
    plain: |
      The breakers of death closed around me, and floods of destruction terrified me. The cords of Sheol were around me, and the snares of death met me. In my distress I called on the LORD and cried to my God. He heard my voice from His temple, and my cry reached His ears.
  - range: 8-16
    heading: He bowed the heavens and came down
    plain: |
      Then the earth shook and trembled; the foundations of heaven moved and shook, because He was angry. Smoke rose from His nostrils and devouring fire from His mouth; coals were kindled by it. He bent the heavens and came down, with darkness under His feet. He rode on a cherub and flew, and He was seen on the wings of the wind. He made darkness His covering all around Him, dark waters and thick clouds. Out of the brightness before Him coals of fire blazed. The LORD thundered from heaven, and the Most High gave His voice. He shot arrows and scattered them, lightning, and routed them. Then the channels of the sea appeared and the foundations of the world were laid bare at the LORD's rebuke, at the blast of the breath of His nostrils.
  - range: 17-20
    heading: Drawn out of many waters
    plain: |
      He reached from on high and took me; He drew me out of many waters. He rescued me from my strong enemy and from those who hated me, for they were too strong for me. They came at me on the day of my disaster, but the LORD was my support. He brought me out into a wide place; He rescued me because He delighted in me.
  - range: 21-25
    heading: According to my righteousness
    plain: |
      The LORD rewarded me according to my righteousness; according to the cleanness of my hands He repaid me. For I have kept the ways of the LORD and have not wickedly turned from my God. All His judgments were before me, and I did not turn from His statutes. I was upright before Him and kept myself from my iniquity. So the LORD has repaid me according to my righteousness, according to my cleanness in His sight.
  - range: 26-31
    heading: With the merciful, merciful
    plain: |
      With the merciful You show Yourself merciful, and with the upright, upright. With the pure You show Yourself pure, and with the crooked You show Yourself shrewd. You save the afflicted people, but Your eyes are on the haughty, to bring them down. For You are my lamp, O LORD, and the LORD lights up my darkness. By You I have run through a troop; by my God I have leaped over a wall. As for God, His way is perfect; the word of the LORD is proven; He is a shield to all who trust in Him.
  - range: 32-37
    heading: The God who makes my way perfect
    plain: |
      For who is God but the LORD? And who is a rock but our God? God is my strong fortress, and He makes my way perfect. He makes my feet like a deer's and sets me on my high places. He trains my hands for war, so that my arms bend a bow of bronze. You have given me the shield of Your salvation, and Your gentleness has made me great. You have made room for my steps under me, so that my feet did not slip.
  - range: 38-46
    heading: Enemies under his feet, nations at his word
    plain: |
      I pursued my enemies and destroyed them, and did not turn back until I had finished them. I finished them and struck them down so that they could not rise; they fell under my feet. You armed me with strength for battle and brought down under me those who rose against me. You gave me the necks of my enemies, so that I destroyed those who hated me. They looked for help, but there was no one to save them; they looked even to the LORD, but He did not answer them. I beat them as fine as the dust of the earth; I trampled them like the mud of the street and scattered them. You also rescued me from the strife of my own people and kept me to be head of the nations; a people I had not known serve me. Foreigners submit to me; as soon as they hear, they obey me. Foreigners lose heart and come out of their hiding places in fear.
  - range: 47-51
    heading: The LORD liveth
    plain: |
      The LORD lives! Blessed be my rock, and exalted be the God of the rock of my salvation. It is God who avenges me and brings peoples down under me, who brings me out from my enemies. You lifted me above those who rose against me; You rescued me from the violent man. So I will give thanks to You, O LORD, among the nations, and sing praises to Your name. He is the tower of salvation for His king, and shows mercy to His anointed, to David and to his seed for evermore.

notes:
  - ref: 1
    phrase: the words of this song
    kind: scripture
    title: The same song as Psalm 18, in a second copy
    body: |
      Second Samuel 22 is Psalm 18, and the two copies differ in many single words and clauses, most of which leave the sense as it was. The psalm opens with a line Samuel does not have, “I will love thee, O LORD, my strength” ([[Ps. 18:1]]). Samuel has a line the psalm does not: “my refuge, my saviour; thou savest me from violence” (verse 3). Where the psalm has “The sorrows of death compassed me” ([[Ps. 18:4]]), Samuel has “the waves of death” (verse 5). The lines on the froward ([[Ps. 18:26]]) and on the LORD's “gentleness” ([[Ps. 18:35]]) differ too, and the psalm's notes take them up.

      Verse 11 shows how such differences can come about. Samuel says the LORD “was seen upon the wings of the wind”; the psalm says “he did fly upon the wings of the wind” ([[Ps. 18:10]]). The psalm's verb, *wayyēdeʾ*, is a rare one, used of an eagle's swift swoop; Samuel's, *wayyērāʾ*, is the common “he was seen.” Written in Hebrew consonants the two words are nearly alike. One older reading holds that the psalm keeps the true reading and that the rarer word was easily changed into the commoner one in copying. Another counts the change among alterations made “with thoughtfulness and deliberation,” not by careless copyists.

      That second reading accounts for the two copies as a whole. Neither, it holds, is the song exactly as David first wrote it: one form was prepared for the Psalter's worship, the other when the song was set into the history of David's reign, in a form “easily intelligible and true to the sense.” In many places, on the same reading, Samuel keeps the older words and the psalm the simpler ones, and “the waves of death” is one of them. Two more differences, at verses 29 and 51, have notes of their own.
    sources: [lds-scriptures, oshb-wlc, bdb, cambridge-1-samuel, keil-1-samuel]

  - ref: 29
    phrase: thou art my lamp, O LORD
    kind: symbol
    title: The LORD is the lamp
    body: |
      In Samuel's copy the LORD is Himself David's lamp; in the psalm He lights it: “For thou wilt light my candle” ([[Ps. 18:28]]). In Hebrew the lamp is a figure of prosperity, and one chapter earlier it stands for David himself. There, when a Philistine nearly killed David in battle and Abishai saved him, David's men swore that he would go out with them no more, “that thou quench not the light of Israel” ([[2 Sam. 21:17]]). The Hebrew word is the same, *nēr*. In Kings a related word carries the figure on to David's line kept on the throne: the LORD leaves Solomon's son one tribe “that David my servant may have a light alway before me in Jerusalem” ([[1 Kgs. 11:36]]).

      The men called the king their lamp. The king, in his song, calls the LORD his: “thou art my lamp, O LORD: and the LORD will lighten my darkness.”
    sources: [bdb, lds-scriptures]

  - ref: 51
    phrase: He is the tower of salvation for his king
    kind: words
    title: Tower of salvation, or great deliverance
    body: |
      The King James follows one of two readings that the Hebrew text keeps in this line. The Masoretic text sometimes gives a word as it is written (the *ketiv*) and, beside it, the word to be read (the *qere*). Here the written word is *magdîl*, “he makes great,” the same verb as in the psalm's copy: “Great deliverance giveth he to his king” ([[Ps. 18:50]]). The word to be read is *migdôl*, “tower,” and the King James follows it, as a modern translation does: “He is a tower of salvation for his king.” The two forms differ in one letter.

      Either way, the line makes the LORD's saving of David a gift to “his king” and “his anointed,” and carries the song past David “to his seed for evermore.”
    sources: [oshb-wlc, bdb, nrsvue, lds-scriptures]

christ: |
  The song's last line claims for David's seed the promise Nathan brought in chapter 7, and that promise is kept in Jesus Christ, the Son of David, to whom Gabriel promised “the throne of his father David” ([[Luke 1:32]]); the notes at [[2 Sam. 7:16]] and [[Ps. 18:50]] tell it in full. The song's first name for the LORD is “my rock” (verse 2), and the name returns in its closing praise (verse 47). Jehovah is often called the Rock in the Old Testament, and in the Book of Mormon Helaman tells his sons who He is: “the rock of our Redeemer, who is Christ, the Son of God” ([[Hel. 5:12]]).

  The disciple who builds on that Rock has Helaman's promise that when the devil's storm beats, “it shall have no power over you to drag you down” ([[Hel. 5:12]]). David's song is the witness of one who called on the LORD in his distress and was heard (verse 7).

explore: |
  - **The same song in the Psalter.** [[Ps. 18]], with its notes verse by verse.
  - **The song at the other end of the books.** Hannah's, [[1 Sam. 2:1–10]].
  - **What follows it.** David's last words, [[2 Sam. 23:1–7]].
  - **The promise behind the last line.** [[2 Sam. 7:12–16]]; [[Luke 1:32–33]].
  - **The Rock.** [[Deut. 32:4]]; [[Hel. 5:12]].

