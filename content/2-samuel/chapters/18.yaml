chapter: 18
title: O My Son Absalom
tagline: David's army defeats Absalom's in the wood of Ephraim; Joab kills Absalom against the king's order; two runners carry the news to Mahanaim, and David weeps for his son.
when: 'While David was at Mahanaim, in Absalom''s revolt'

setting: |
  Absalom “stole the hearts of the men of Israel” ([[2 Sam. 15:6]]) and raised a revolt so strong that David fled Jerusalem, over the brook Kidron and up the Mount of Olives, weeping as he went ([[2 Sam. 15:23]], [[2 Sam. 15:30]]). The flight gave occasion to some of David's psalms, among them Psalms 3 and 63 ([[Ps. 3:1]]). In Jerusalem Absalom heard two counsels. Ahithophel urged him to pursue the weary king at once; Hushai, David's friend, urged delay, and “the LORD had appointed to defeat the good counsel of Ahithophel” ([[2 Sam. 17:14]]). Ahithophel went home and hanged himself ([[2 Sam. 17:23]]).

  The delay gave David time. He crossed the Jordan to Mahanaim, gathered the people loyal to him into an army of his own, and was fed by Barzillai and others east of the river ([[2 Sam. 17:27–29]]). Absalom followed him over the Jordan, with Amasa as his captain in Joab's place, and camped in the land of Gilead ([[2 Sam. 17:24–26]]). This chapter is the battle and its end. The next opens with the king still weeping, and Joab telling him that his grief had shamed the men who saved his life ([[2 Sam. 19:1–8]]).

thread: |
  The battle takes three verses; Absalom takes the rest. Before the army marches, David charges his captains in the hearing of all the people, “Deal gently for my sake with the young man, even with Absalom” (verse 5), and the chapter keeps coming back to that sentence. A soldier who finds Absalom hanging in an oak will not touch him for a thousand shekels, because he heard it (verse 12). Joab heard it too, and kills him (verse 14). Joab keeps the priest's son from carrying the news “because the king's son is dead” (verse 20). When the runners reach the gate, the king asks each of them one thing: “Is the young man Absalom safe?” (verses 29, 32).

  The revolt that ends here is one of the family feuds read as the fulfillment of Nathan's sentence on David (the note at [[2 Sam. 12:10]]). The chapter does not end with the victory. It ends with a father in the chamber over the gate, wishing he had died in his son's place.

sections:
  - range: 1-5
    heading: I will surely go forth with you
    plain: |
      David counted the people who were with him and set captains of thousands and captains of hundreds over them. He sent the army out in three companies, one under Joab, one under Joab's brother Abishai the son of Zeruiah, and one under Ittai the Gittite, and he told the people, “I will certainly march out with you myself.” But the people answered, “You must not go out. If we flee, they will not care about us; if half of us die, they will not care about us; but you are worth ten thousand of us. It is better that you stay ready to help us from the city.” The king said, “I will do what seems best to you.”

      He stood beside the gate while all the people marched out by hundreds and by thousands. And the king commanded Joab, Abishai and Ittai, “For my sake deal gently with the young man Absalom.” All the people heard the king give the captains that charge about Absalom.
  - range: 6-8
    heading: The wood devoured more people
    plain: |
      So the army went out into the field against Israel, and the battle was fought in the forest of Ephraim. There the men of Israel were beaten by David's servants, and the slaughter that day was great: twenty thousand men. The fighting spread over the whole countryside, and the forest consumed more men that day than the sword did.
  - range: 9-18
    heading: Hanged in an oak
    plain: |
      Absalom came upon David's servants. He was riding his mule, and the mule went under the thick branches of a great oak; Absalom's head caught fast in the oak, and he was left hanging between heaven and earth while the mule went on from under him. A man saw it and told Joab, “I saw Absalom hanging in an oak.” Joab said, “You saw him? Then why didn't you strike him to the ground there? I would have given you ten shekels of silver and a belt.” The man answered, “Even if a thousand shekels of silver were put in my hand, I would not raise my hand against the king's son. We all heard the king command you and Abishai and Ittai, ‘Take care that no one touches the young man Absalom.’ If I had dealt treacherously against his life, nothing is hidden from the king, and you yourself would have turned against me.”

      Joab said, “I will not waste time with you.” He took three darts in his hand and thrust them into Absalom's heart while he was still alive in the oak, and ten young men who carried Joab's armor surrounded Absalom, struck him, and killed him. Joab blew the trumpet, and the army came back from pursuing Israel, for Joab held them back. They took Absalom, threw him into a great pit in the forest, and piled a very great heap of stones over him; and all Israel fled, every man to his home.

      In his lifetime Absalom had set up a pillar for himself in the king's valley, because he said, “I have no son to keep my name in remembrance.” He named the pillar after himself, and it is called Absalom's monument to this day.
  - range: 19-32
    heading: Is the young man Absalom safe?
    plain: |
      Ahimaaz the son of Zadok said, “Let me run and carry the king the good news that the LORD has delivered him from his enemies.” Joab told him, “You shall not carry news today. You may carry news another day, but not today, because the king's son is dead.” Then Joab said to the Cushite, “Go, tell the king what you have seen.” The Cushite bowed to Joab and ran. Ahimaaz asked again, “Whatever happens, let me run after the Cushite too.” Joab said, “Why will you run, my son, when you have no news ready?” “Whatever happens,” he said, “let me run.” “Run,” said Joab. So Ahimaaz ran by the way of the plain and outran the Cushite.

      David was sitting between the two gates. The watchman went up to the roof over the gate by the wall, looked out, and saw a man running alone. He called down and told the king, and the king said, “If he is alone, he has news in his mouth.” As the runner came nearer, the watchman saw another man running and called to the gatekeeper, “Another man is running alone,” and the king said, “He is bringing news too.” The watchman said, “I think the first one runs like Ahimaaz the son of Zadok.” The king said, “He is a good man, and he comes with good news.”

      Ahimaaz called out to the king, “All is well,” bowed with his face to the ground before him, and said, “Blessed be the LORD your God, who has delivered up the men who raised their hand against my lord the king.” The king asked, “Is the young man Absalom safe?” Ahimaaz answered, “When Joab sent the king's servant and me your servant, I saw a great commotion, but I did not know what it was.” The king said, “Step aside and stand here,” and he stepped aside and stood still. Then the Cushite came and said, “News, my lord the king! The LORD has delivered you this day from all who rose up against you.” The king asked the Cushite, “Is the young man Absalom safe?” The Cushite answered, “May the enemies of my lord the king, and all who rise up to harm you, be as that young man is.”
  - range: 33-33
    heading: O my son Absalom
    plain: |
      The king was shaken. He went up to the room over the gate and wept, and as he went he said, “O my son Absalom, my son, my son Absalom! If only I had died instead of you, O Absalom, my son, my son!”

notes:
  - ref: 8
    phrase: the wood devoured more people that day than the sword devoured
    kind: history
    title: The forest and the sword
    body: |
      More of Absalom's men died in the forest than by the sword, and the place of the battle was not an accident. Ahithophel had urged Absalom to strike that very night with twelve thousand men, while David was weary ([[2 Sam. 17:1–2]]). Hushai's counsel of delay prevailed, and the delay gave David time to gather an army of his own, take supplies from the people east of the Jordan, and choose “a site where the terrain would work in his favor.”

      The fighting did not stay in one place; it “was there scattered over the face of all the country” (verse 8). One older reading pictures the wooded country as broken by ravines and precipices, into which the beaten army was pursued and where so many of them died. The text says it more briefly: the wood devoured them.
    sources: [ot-manual-2-samuel-13, keil-1-samuel, lds-scriptures]

  - ref: 9
    phrase: he was taken up between the heaven and the earth
    kind: symbol
    title: Between the heaven and the earth
    body: |
      Absalom died hanging in an oak, and the narrator's phrase for it may carry a meaning beyond the picture. The verse says that his head, not his famous hair ([[2 Sam. 14:26]]), caught in the oak, and the man who saw him tells Joab, “I saw Absalom hanged in an oak” (verse 10). The law of Moses called a hanged man accursed: his body was to be buried the same day, “for he that is hanged is accursed of God” ([[Deut. 21:23]]).

      Read beside that law, “between the heaven and the earth” may describe a man who belongs in neither place. A Latter-day Saint study of hanging in scripture suggests that hanging may have marked “one’s cursed state,” showing “that the person no longer belongs.” It sets Absalom beside Ahithophel, his counselor, who hanged himself when his counsel was not followed ([[2 Sam. 17:23]]): in both stories the hanging comes after a man has sought to overthrow the king, and the study proposes, as a possibility, that hanging was a penalty “for the political act of rebellion.”
    sources: [belnap-fell-tree, lds-scriptures]

  - ref: 14
    phrase: thrust them through the heart of Absalom
    kind: history
    title: Joab against the king's word
    body: |
      Joab killed Absalom against an order the whole army had heard. David had charged his three captains, in the people's hearing, to deal gently with the young man (verse 5). The soldier who found Absalom in the oak repeats that charge to Joab and will not touch the king's son for a thousand shekels; he knows that “there is no matter hid from the king,” and that Joab himself would not have stood by him (verses 12–13). Joab says he will not wait, and does it himself, and his armourbearers finish what he began (verse 15).

      The text gives Joab no speech of explanation. A Latter-day Saint study calls him “the calculating Joab,” David's “resourceful and ruthless military commander and nephew,” the same man who had arranged Absalom's return from exile ([[2 Sam. 14:1–23]]). The death also belongs to a larger story: the rebellion that ends here is one of the family feuds the Bible Dictionary reads as the fulfillment of Nathan's sentence on David's house (the note at [[2 Sam. 12:10]]).
    sources: [taggart-sworn-david, bd-david, lds-scriptures]

  - ref: 18
    phrase: I have no son to keep my name in remembrance
    kind: history
    title: A pillar and a heap of stones
    body: |
      Absalom wanted a monument, and in the end he had two. In his lifetime he set up a pillar in the king's dale and named it after himself, because he had no son to carry his name. Isaiah's promise to the eunuch of “a place and a name” answers the same fear (the note at [[Isa. 56:5]], where “place,” Hebrew *yād*, is explained). His words seem to contradict [[2 Sam. 14:27]], which says three sons were born to him. The usual explanation, in two older commentaries, is that the sons died young; one adds that this would probably explain why, against custom, their names are not given.

      His grave was the other monument. His body was thrown into a pit in the forest under “a very great heap of stones” (verse 17), and the lexicon sets that heap beside the two others raised over a dead body, over Achan and over the king of Ai ([[Josh. 7:26]]; [[Josh. 8:29]]). The pillar comes in the very next verse: the monument Absalom raised for himself, beside the one raised over him in the forest.
    sources: [cambridge-1-samuel, keil-1-samuel, bdb, lds-scriptures]

  - ref: 29
    phrase: I saw a great tumult, but I knew not what it was
    kind: history
    title: Two runners
    body: |
      Joab's reason for keeping Ahimaaz back is given in a clause, “because the king’s son is dead” (verse 20). Ahimaaz, the son of Zadok the priest ([[2 Sam. 15:27]]), had run for David before, carrying Hushai's warning out of Jerusalem ([[2 Sam. 17:17]]), and he wanted to tell the king “how that the LORD hath avenged him of his enemies” (verse 19). The Hebrew verb for bearing tidings is the one used of news from a battle, and it can carry bad news as well as good ([[1 Sam. 4:17]]); this day's news was both. When Joab asks why he will run with “no tidings ready” (verse 22), the noun is the one the lexicon reads there as “reward for good tidings,” as at [[2 Sam. 4:10]], where David recalls killing the man who brought him word of Saul's death and expected a reward. Joab sent instead “Cushi,” which the lexicon takes as “the Cushite,” a man of Cush in Joab's service, not named.

      Ahimaaz outran the Cushite by “the way of the plain” (verse 23), the word used of the round of the Jordan valley, and the king, told it was Ahimaaz, said, “He is a good man, and cometh with good tidings” (verse 27). Asked about Absalom, Ahimaaz answered only that he had seen “a great tumult” and did not know what it was (verse 29). The Cushite, asked the same question, answered with a wish that left the king no doubt (verse 32).
    sources: [bdb, lds-scriptures]

  - ref: 33
    phrase: would God I had died for thee
    kind: history
    title: O my son Absalom
    body: |
      David's cry is a father's grief, and a Latter-day Saint reading finds in it something of God's own. The chapter has prepared it: the charge to deal gently, and the same question put to both runners at the gate. The Cushite's answer told him, and he went up into the chamber over the gate weeping, crying “my son” five times and wishing he had died in his son's place. God had called David a man after his own heart ([[1 Sam. 13:14]]), and on that reading this response “may offer one glimpse into why.” Latter-day scripture, in Enoch’s vision of the God of heaven weeping, “reveals God as the kind of parent who similarly experiences grief for mortal pain and sorrow, even when it results from human rejection of divine invitations.”

      The grief came too late to change what had happened. Ahimaaz, it appears, “wished to cushion the blow of the bad news,” but it was to no avail: the tragedy “had been in the making for a long time in the lives of David and Absalom.” “What David would have given at the climax to have voided the process would have been needed much sooner.” The grief also had a cost: the next chapter opens with the victory “turned into mourning unto all the people,” and Joab telling the king that he had shamed the men who saved his life ([[2 Sam. 19:1–8]]).
    sources: [taggart-sworn-david, ot-manual-2-samuel-13, lds-scriptures]

christ: |
  David's cry over Absalom is a father's love that his son's rebellion did not end, and Enoch saw the God of heaven weep in the same way over children who had turned from Him ([[Moses 7:28–33]]). A parent who grieves for a child who has rejected him grieves as God Himself does. And the love of God reaches further than David's could: however far from home and family and God anyone has gone, he has “not traveled beyond the reach of divine love,” for “it is not possible for you to sink lower than the infinite light of Christ’s Atonement shines.”

explore: |
  - **The rest of the revolt.** [[2 Sam. 15:13–30]], the flight from Jerusalem; [[2 Sam. 19:1–8]], Joab's rebuke of the weeping king.
  - **The psalms of the flight.** [[Ps. 3:1–8]] and [[Ps. 63:1–11]].
  - **The God who weeps.** [[Moses 7:28–41]].
  - **A study.** A chapter on hanging in scripture, from Absalom in the oak to the Book of Mormon's Zemnarihah ([[3 Ne. 4:28–29]]), in the Religious Studies Center's *They Shall Grow Together*.

