chapter: 5
title: The LORD God of Hosts Was with Him
tagline: All the tribes come to Hebron and anoint David king over Israel; he takes the Jebusite stronghold of Zion and makes it the city of David, Hiram of Tyre builds him a house, sons are born to him in Jerusalem, and twice he asks the LORD before he fights the Philistines.
when: 'After seven years and six months in Hebron'

setting: |
  Chapter 4 ended with the death of Ish-bosheth, the son of Saul whom Abner had made king over the northern tribes; his own captains betrayed and killed him, and David's power grew. Abner had already done the groundwork before he died. He reminded the elders of Israel, who were acting as the tribes' leaders without a king, that they had wanted David before, and that the LORD had promised to save Israel by David's hand ([[2 Sam. 3:17–18]]). Now there was no son of Saul left to follow, and the elders came to Hebron, where David had reigned over Judah alone for seven years and six months ([[2 Sam. 2:11]]; the two kingdoms are explained at [[2 Sam. 2:4]]). The Bible Dictionary's chronology puts David's reign at Hebron from 1055 B.C. and at Jerusalem from 1047.

  The chapter gathers the founding acts of the united kingdom: the covenant and anointing at Hebron, the taking of Jerusalem, the friendship of Hiram of Tyre, the sons born in the new capital, and two victories over the Philistines. It belongs to the part of 2 Samuel that tells David's reign first over Judah and then over all Israel. Chronicles tells the same events again ([[1 Chr. 11:1–9]]; [[1 Chr. 14:1–17]]), and in several places its wording answers a question this chapter leaves open.

thread: |
  The chapter keeps saying whose kingdom this is. The tribes end their reasons with the word of the LORD: “the LORD said to thee, Thou shalt feed my people Israel” (verse 2). The Jebusites boast that even the blind and the lame could keep David out, and David takes the stronghold anyway. Then the narrator gives the summary of David's rise: he “went on, and grew great, and the LORD God of hosts was with him” (verse 10), and David himself “perceived that the LORD had established him king” (verse 12).

  The two battles that close the chapter show what that means in practice. David has a capital, an ally, an army and a growing family, and still, before each fight, he asks. Each time he acts on the answer. After the first victory David gives the credit away, saying the LORD “hath broken forth upon mine enemies before me” (verse 20); in the second, the signal to attack is the sound of the LORD Himself going out before the army (verse 24). The king of all Israel is a king who inquires.

sections:
  - range: 1-5
    heading: King over all Israel
    plain: |
      Then all the tribes of Israel came to David at Hebron and said, “We are your own flesh and blood. In the past, even while Saul was king over us, you were the one who led Israel out to battle and brought them back. And the LORD said to you, ‘You shall shepherd My people Israel, and you shall be ruler over Israel.’” So all the elders of Israel came to the king at Hebron, and King David made a covenant with them at Hebron before the LORD, and they anointed David king over Israel. David was thirty years old when he became king, and he reigned forty years: in Hebron he reigned over Judah seven years and six months, and in Jerusalem he reigned thirty-three years over all Israel and Judah.
  - range: 6-10
    heading: Jerusalem taken
    plain: |
      The king and his men went to Jerusalem against the Jebusites, who lived in the land. They told David, “You will not get in here unless you remove the blind and the lame,” meaning, “David cannot get in here.” Nevertheless David captured the stronghold of Zion, which is the city of David. That day David said, “Whoever goes up by the water channel and strikes the Jebusites, the lame and the blind whom David's soul hates, shall be chief and captain” (the Hebrew of this verse is uncertain; see the note). That is why it is said, “The blind and the lame shall not come into the house.” David lived in the stronghold and called it the city of David, and he built the city around it, from the Millo inward. David grew greater and greater, for the LORD God of hosts was with him.
  - range: 11-16
    heading: A house and sons
    plain: |
      Hiram king of Tyre sent messengers to David, with cedar logs, carpenters and stonemasons, and they built David a palace. And David knew that the LORD had established him as king over Israel and had raised his kingdom high for the sake of His people Israel. After he came from Hebron, David took more concubines and wives in Jerusalem, and more sons and daughters were born to him. These are the names of the children born to him in Jerusalem: Shammua, Shobab, Nathan, Solomon, Ibhar, Elishua, Nepheg, Japhia, Elishama, Eliada and Eliphalet.
  - range: 17-25
    heading: Two victories over the Philistines
    plain: |
      When the Philistines heard that David had been anointed king over Israel, they all came up to hunt for him. David heard of it and went down to the stronghold. The Philistines came and spread out in the valley of Rephaim. David asked the LORD, “Shall I go up against the Philistines? Will You give them into my hand?” The LORD answered, “Go up, for I will certainly give the Philistines into your hand.” So David came to Baal-perazim and struck them there, and he said, “The LORD has burst through my enemies before me, like water bursting through.” That is why the place was called Baal-perazim. The Philistines left their idols there, and David and his men carried them off.

      The Philistines came up once more and spread out in the valley of Rephaim. When David asked the LORD, He said, “Do not go straight up. Circle around behind them and come at them opposite the balsam trees. When you hear the sound of marching in the tops of the trees, then move quickly, for then the LORD has gone out before you to strike the Philistine army.” David did as the LORD had commanded him, and he struck down the Philistines all the way from Geba to Gezer.

notes:
  - ref: 1
    phrase: we are thy bone and thy flesh
    kind: history
    title: Why all the tribes came to Hebron
    body: |
      The tribes give David three reasons for making him king, and together they are the qualifications a king of Israel was to have: kinship, proven leadership, and the LORD's choice. “Thy bone and thy flesh” is the language of close kinship (the note at [[Gen. 29:14]] sets the expression beside its other uses). The second reason is David's record: under Saul he had led Israel's army out and brought it home, which is why “all Israel and Judah loved David, because he went out and came in before them” ([[1 Sam. 18:16]]). The third is the word of the LORD (verse 2). Deuteronomy's law of the king asks for the same things, a king “whom the LORD thy God shall choose” and “one from among thy brethren” ([[Deut. 17:15]]).

      None of this was new, and that is part of the point. Abner had told these same elders, before Joab killed him, “Ye sought for David in times past to be king over you: Now then do it” ([[2 Sam. 3:17–18]]). What had changed was that Saul's last son on the throne was dead.
    sources: [ot-minute-2-samuel, lds-scriptures]

  - ref: 2
    phrase: Thou shalt feed my people Israel
    kind: symbol
    title: Shepherd and captain
    body: |
      The LORD's word that the tribes quote makes the king a shepherd first and a commander second. No other passage of scripture records the LORD saying these words to David; Abner had appealed to a similar promise ([[2 Sam. 3:18]]). What the words express is a principle of leadership, that those who lead God's people are shepherds of His flock. “Feed” is the shepherd's verb for tending sheep (the note at [[Ps. 78:71]] explains it, and [[Ps. 23:1]] on the site shows it in David's own psalm).

      The image follows David through Samuel. Each of the three stories that bring him into the book makes him a shepherd ([[1 Sam. 16:11]]; [[1 Sam. 16:19]]; [[1 Sam. 17:15]]), and the LORD will remind him that He took him “from the sheepcote, from following the sheep” ([[2 Sam. 7:8]]). When the tribes come to make him king, they reach for the same picture: in Israel's imagination, a king and a shepherd were bound together.
    sources: [ot-minute-2-samuel, taggart-sworn-david]

  - ref: 3
    phrase: king David made a league with them in Hebron before the LORD
    kind: history
    title: A covenant, then the anointing
    body: |
      The kingdom over all Israel begins with a covenant between the king and the elders, made “before the LORD,” and only then the anointing. “League” is *bǝrît*, the ordinary Hebrew word for a pact or covenant, and Chronicles tells the scene with that English word: “David made a covenant with them in Hebron before the LORD” ([[1 Chr. 11:3]]). Chronicles also adds a phrase that ties the day to the beginning of David's story: they anointed him “according to the word of the LORD by Samuel.”

      In the Old Testament three offices came with an anointing: prophet, priest and king. This is the third time David is anointed. Samuel anointed him among his brothers at Bethlehem ([[1 Sam. 16:13]]), the men of Judah anointed him king at Hebron ([[2 Sam. 2:4]]), and now the elders of all Israel anoint him in the same city.
    sources: [oshb-wlc, bdb, lds-scriptures, ot-minute-2-samuel]

  - ref: 6
    phrase: Except thou take away the blind and the lame
    kind: history
    title: The city no tribe had taken
    body: |
      Jerusalem was still a Jebusite fortress when David came to it, and its defenders were sure he could not take it. Israel had never kept it. Judges remembers that Judah once “had fought against Jerusalem, and had taken it, and smitten it with the edge of the sword, and set the city on fire” ([[Judg. 1:8]]), yet the Jebusites stayed: Judah “could not drive them out” ([[Josh. 15:63]]), and Benjamin did not ([[Judg. 1:21]]). The city sat on the border between the two tribes (the note at [[Josh. 15:8]]). It was a hill fortress that kept its independence until David stormed it: about 2,600 feet above sea level, with deep valleys on every side except the north.

      The taunt is most likely an insult: the Jebusites were saying they could defend the city against David with nothing but their injured and lame. The end of the verse is not fully clear, but the boast failed quickly, and the next verse can say simply, “Nevertheless David took the strong hold.” (The blind and the lame come back at the end of verse 8, and one reading ties that line to this boast; see the note there.)

      The same features made the city worth having. A ridge guarded by valleys was easy to defend, it had water and land nearby, and above all it was neutral ground. Before David took it, Jerusalem belonged neither to Judah nor to the northern tribes, so a capital there favored neither the south he had ruled for seven years nor the north that had just come to him.
    sources: [lds-scriptures, bd-jebus, bd-jerusalem, ot-minute-2-samuel, scripture-helps-1-samuel-17, calabro-disability]

  - ref: 7
    phrase: the strong hold of Zion
    kind: history
    title: Zion, the city of David
    body: |
      Zion here is the name of a fortress, the stronghold believed to have stood at the top of the hill, and David renamed it after himself, “the city of David.” Exactly where that first Zion stood has long been disputed, though the temple's place on the eastern hill is not. The name then traveled with the city, and Zion came to name the temple hill too: Solomon built his temple “on Mount Zion.” In the Restoration the name reaches further still: Enoch's city was Zion, the New Jerusalem is to be called Zion, and latter-day revelation defines Zion as “the pure in heart” ([[D&C 97:21]]).

      The hill David took also had a past. Jerusalem is likely the Salem where Melchizedek reigned as a righteous king (the note at [[Gen. 14:18]] gives the evidence), and biblical tradition places Solomon's temple on the hill where Abraham was commanded to offer Isaac ([[Gen. 22:2]]).
    sources: [ot-minute-2-samuel, bd-jerusalem, bd-zion, scripture-helps-1-samuel-17]

  - ref: 8
    phrase: Whosoever getteth up to the gutter
    kind: words
    title: The gutter, and the lame and the blind
    body: |
      The King James fills a gap in the Hebrew of this verse to make it read, and the words that trouble a reader most, about the lame and the blind, are among the least certain in the chapter. “Gutter” is *ṣinnôr*, a pipe, spout or conduit. It has been read as a water shaft, a way into the city, though its meaning here is “very dubious,” and no water shaft from David's time has been found. David's sentence is also incomplete in Hebrew. The words “he shall be chief and captain” are in italics in the King James because the translators supplied them, from Chronicles, where David promises that whoever strikes the Jebusites first will be chief, and “Joab the son of Zeruiah went first up, and was chief” ([[1 Chr. 11:6]]). Even “hated of David's soul” is unsettled: the Hebrew text writes one form in its consonants and marks another to be read (the *ketiv*, “written,” and *qere*, “read”); the consonants can mean “they hate David's soul” or “David hates him with his whole being,” and the Dead Sea Scroll 4QSam-a reads “David's soul hates.”

      As the King James reads, David seems to hate the lame and the blind. One Latter-day Saint reading argues that this conflicts with everything else 2 Samuel shows of him: he provides generously for Jonathan's lame son Mephibosheth ([[2 Sam. 9:3–7]]) and deals on friendly terms with Araunah the Jebusite ([[2 Sam. 24:20–25]]). Following the scroll, which this reading judges closest to the original, it renders the verse: “David's soul hates anyone who slays a Jebusite that he might reach the water shaft, or (who slays) the lame or the blind. Therefore the blind and the lame kept saying, ‘He shall not enter the house.’” The last line then answers the Jebusites' boast of verse 6 instead of stating a rule that kept the disabled out of the temple, which had not yet been built (the “house” may be the palace). Most translations, and the Septuagint, which reads “the house of the Lord,” take the line as such a rule.

      On that reading, verse 8 and chapter 9 together present David as a model of compassion. It is one scholar's rendering, argued from the oldest surviving text; the King James and most translations read the verse differently, and the Hebrew does not settle it.
    sources: [bdb, ot-minute-2-samuel, calabro-disability, lds-scriptures, oshb-wlc]

  - ref: 12
    phrase: for his people Israel’s sake
    kind: history
    title: A kingdom for the people’s sake
    body: |
      Verse 12 says what David understood about his kingdom: it was the LORD's doing, and it was for Israel. Tyre was a merchant city on the Mediterranean coast, and when its king sent cedar and craftsmen to build David a palace (verse 11), it may have been the start of an alliance, one that bore fruit in Solomon's reign ([[1 Kgs. 5:1]]). The text puts David's perceiving right after that gift, and one reading takes the order to mean that David saw the LORD's hand once a foreign king acknowledged him; that need not be a lack of faith, since it is human to want tangible evidence of a promised blessing. What the verse says he saw is plain: the kingdom had been exalted not for David's sake but “for his people Israel's sake.”
    sources: [ot-minute-2-samuel]

  - ref: 14
    phrase: Nathan, and Solomon
    kind: scripture
    title: Nathan and Solomon
    body: |
      Two of the sons born in Jerusalem carry David's line to Jesus Christ, each in one of the Gospels. This Nathan is David's son, not the prophet Nathan of chapters 7 and 12. Chronicles names Nathan and Solomon among four sons “of Bath-shua the daughter of Ammiel” ([[1 Chr. 3:5]]), and the Bible Dictionary makes Nathan the son of David and Bathsheba, so the list here runs ahead of the story told in chapters 11–12. Matthew traces Jesus's descent through Solomon ([[Matt. 1:6]]) and Luke through Nathan ([[Luke 3:31]]); one explanation takes Luke's as Mary's line and Matthew's as Joseph's.

      The wives and concubines of verse 13 raise a different question, whether David sinned in taking them; what latter-day revelation says of them is taken up at [[2 Sam. 12:8]].
    sources: [bd-nathan, lds-scriptures, ot-minute-2-samuel]

  - ref: 20
    phrase: as the breach of waters
    kind: words
    title: The LORD broke through like water
    body: |
      David names the battlefield for what the LORD did there. *Pāraṣ* is to “break through,” and Baal-perazim probably means “possessor of breaches,” though the meaning is not certain; the footnote gives “bursting-forth” for “breach.” The picture is of water bursting through whatever holds it back, and David gives the credit away: the LORD “hath broken forth upon mine enemies before me.” Chronicles puts the two together, “God hath broken in upon mine enemies by mine hand” ([[1 Chr. 14:11]]): David's hand, the LORD's breaking-through. Where the place was is not known.

      The name stayed in Israel's memory. The footnote points to Isaiah, who warned that the LORD would “rise up as in mount Perazim” ([[Isa. 28:21]]), now against His own unfaithful people; the note there explains why Isaiah calls it His “strange work.”
    sources: [bdb, lds-scriptures]

  - ref: 21
    phrase: David and his men burned them
    kind: history
    title: Idols left on the field
    body: |
      The Philistines brought their gods to the battle and left them behind. The Hebrew says David and his men “carried them away” (the footnote gives it); Chronicles says that “David gave a commandment, and they were burned with fire” ([[1 Chr. 14:12]]).

      The scene turns an old defeat around. In Eli's day the Philistines had captured the ark of God on the battlefield ([[1 Sam. 4:11]]). Now it is the Philistines' gods that are left on the field, and Israel's king who disposes of them.
    sources: [lds-scriptures, oshb-wlc, ot-minute-2-samuel]

  - ref: 23
    phrase: Thou shalt not go up
    kind: history
    title: Asking again
    body: |
      The second battle had the same enemy in the same valley, and David did not assume the same answer. It would have been easy to rely on the earlier instruction and attack head-on; instead David asked again and received new directions. This time the LORD said not to go straight up but to “fetch a compass,” to circle around behind them, or as Chronicles puts it, “turn away from them, and come upon them over against the mulberry trees” ([[1 Chr. 14:14]]).

      Asking was David's habit, and the chapter shows him at it on the day he becomes a great king. He had inquired before saving Keilah ([[1 Sam. 23:2]]), before pursuing the Amalekites ([[1 Sam. 30:8]]), and before going up to Hebron ([[2 Sam. 2:1]]). Each answer here was obeyed: “David did so, as the LORD had commanded him” (verse 25).
    sources: [ot-minute-2-samuel, cfm-ot-2026-25, lds-scriptures]

  - ref: 24
    phrase: the sound of a going in the tops of the mulberry trees
    kind: words
    title: A sound of marching in the trees
    body: |
      The signal for attack was a sound the LORD would make, and the Hebrew calls it marching. “A going” is *ṣǝʿādâ*, “marching,” so the sign was “the sound of marching” in the treetops, and the verse names the one marching: “then shall the LORD go out before thee.” Chronicles makes it plainer still: “God is gone forth before thee” ([[1 Chr. 14:15]]). The “mulberry trees” are *bǝkāʾîm*, balsam trees; the same word in the singular names the valley of Baca ([[Ps. 84:6]], where the note discusses it).

      What David's men heard may have been the wind rushing through the leaves. The point of the sign was that they would move when the LORD moved and not before, so that the victory would not rest on David's own skill.
    sources: [bdb, oshb-wlc, lds-scriptures, ot-minute-2-samuel]

christ: |
  The tribes' words make David the shepherd of the LORD's people (verse 2), and that picture of a king who feeds and cares for his flock became the hope of Ezekiel's prophecy of “one shepherd … even my servant David” ([[Ezek. 34:23]]), which Jesus fulfilled as the Good Shepherd ([[John 10:11]]). The city David took is the city where the Atonement and Resurrection of Jesus Christ took place.

  The Lord who went out before David still gives direction to those who ask Him. David's second battle shows that His guidance is given fresh, so that an earlier answer does not take the place of asking again, and the blessing comes in acting on the revelation received.

explore: |
  - **Chronicles tells it again.** [[1 Chr. 11:1–9]] (Hebron and Jerusalem, with Joab at the water shaft); [[1 Chr. 14:8–17]] (the two battles).
  - **The shepherd king.** [[Ps. 78:70–72]]; [[Ezek. 34:23–24]]; [[John 10:11–16]].
  - **Zion.** [[Ps. 2:6]]; [[Moses 7:18–19]]; [[D&C 97:21]].
  - **The LORD breaking forth.** [[Isa. 28:21]]; [[D&C 101:95]].
  - **David and the lame.** [[2 Sam. 9:1–13]], with the Religious Studies Center study “[Disability and Social Justice in Ancient Israelite Culture](https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture),” which reads 5:8 and chapter 9 together.

