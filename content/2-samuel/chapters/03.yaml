chapter: 3
title: A Prince and a Great Man Fallen
tagline: While David's house grows in Hebron, Abner quarrels with Ish-bosheth and offers to bring all Israel to David, until Joab murders him in the gate and David mourns him before the people.
when: 'Seven years and six months in Hebron'

setting: |
  After Saul's death the men of Judah anointed David king at Hebron, while Abner, the captain of Saul's army, took Saul's son Ish-bosheth to Mahanaim and made him king over the rest of Israel ([[2 Sam. 2:4]] explains the two kingdoms and Hebron). Ish-bosheth reigned two years; David reigned in Hebron over Judah seven years and six months ([[2 Sam. 2:10–11]]).

  The first battle between them, at the pool of Gibeon, went against Abner. In the rout Asahel, the swift-footed brother among the three sons of Zeruiah, chased Abner and would not turn aside, though Abner warned him twice, and Abner killed him with the back end of his spear ([[2 Sam. 2:18–23]]). Zeruiah was David's sister, so Asahel and his brothers Joab and Abishai were David's nephews, and Joab was the captain of David's army. That death hangs over this chapter.

  Chapter 3 tells how the house of Saul lost its strongest man. In chapter 4 Ish-bosheth is murdered in his bed, and in chapter 5 the tribes of Israel come to Hebron, the elders make a league with David “before the LORD,” and they anoint him king over all Israel ([[2 Sam. 5:1–3]]). The account of Joab ends only in Solomon's reign ([[1 Kgs. 2:5–6]], [[1 Kgs. 2:28–34]]).

thread: |
  The chapter opens with its summary: “David waxed stronger and stronger, and the house of Saul waxed weaker and weaker” (verse 1). The war was a standing hostility more than continual fighting; on one older reading Ish-bosheth was too weak to carry it on, while David “waited with firm reliance upon the promise of the Lord, until all Israel should come over to him.” The list of sons born in Hebron (verses 2–5) belongs to that summary as well: the same reading takes it as proof of the house of David growing, as the history of a king's reign customarily begins with his family.

  The rest of the chapter shows how the promise came and what nearly spoiled it. Abner, the man who had kept Saul's house on the throne, breaks with Ish-bosheth and offers David the kingdom, and he does it in the LORD's name: “as the LORD hath sworn to David” (verse 9), “the LORD hath spoken of David” (verse 18). Joab then kills him for his brother's blood, in David's own gate, and the men Abner had won over could have gone back to Ish-bosheth. David answers with a curse on Joab's house and a public mourning, until “all Israel understood that day that it was not of the king to slay Abner” (verse 37). He ends confessing that he is weak and leaving the doer of evil to the LORD. Throughout, the LORD has been “the principal actor in the story of David's rise.”

sections:
  - range: 1-5
    heading: David grows stronger
    plain: |
      The war between the house of Saul and the house of David went on a long time; David kept growing stronger, and the house of Saul kept growing weaker.

      Sons were born to David in Hebron. His firstborn was Amnon, whose mother was Ahinoam from Jezreel. His second was Chileab, whose mother was Abigail, the widow of Nabal of Carmel. The third was Absalom, son of Maacah, the daughter of Talmai king of Geshur. The fourth was Adonijah, son of Haggith; the fifth, Shephatiah, son of Abital; and the sixth, Ithream, son of David's wife Eglah. These were born to David in Hebron.
  - range: 6-11
    heading: Abner breaks with Ish-bosheth
    plain: |
      While the war between the two houses went on, Abner was making himself the strong man of Saul's house. Saul had had a concubine named Rizpah, the daughter of Aiah, and Ish-bosheth said to Abner, “Why have you slept with my father's concubine?” Abner was furious at Ish-bosheth's words. “Am I a dog's head on Judah's side?” he said. “To this day I have kept faith with the house of your father Saul, with his brothers and his friends, and I have not handed you over to David; and now you charge me with an offense over this woman? May God do so to me, and more, if I do not do for David what the LORD has sworn to him: to transfer the kingdom from the house of Saul and set up David's throne over Israel and over Judah, from Dan to Beer-sheba.” Ish-bosheth could not answer Abner a word, because he was afraid of him.
  - range: 12-21
    heading: Abner's league with David
    plain: |
      Abner sent messengers to David on his own account, saying, “Whose is the land? Make your covenant with me, and I will stand with you and bring all Israel over to you.” David answered, “Good. I will make a covenant with you, but on one condition: you will not see my face unless you bring Michal, Saul's daughter, when you come to see me.” Then David sent messengers to Ish-bosheth, Saul's son, saying, “Give me my wife Michal, whom I won for a hundred Philistine foreskins.” Ish-bosheth sent and took her from her husband, Phaltiel the son of Laish. Her husband went with her, weeping behind her all the way to Bahurim, until Abner said to him, “Go back,” and he went back.

      Abner talked with the elders of Israel. “For some time now you have wanted David as your king,” he said. “Now do it. For the LORD has said of David, ‘By the hand of my servant David I will save my people Israel from the Philistines and from all their enemies.’” Abner spoke to the men of Benjamin as well, and then went to Hebron to tell David everything that seemed good to Israel and to the whole tribe of Benjamin. When Abner came to David at Hebron with twenty men, David held a feast for them. Abner said to David, “Let me go and gather all Israel to my lord the king, so that they may make a covenant with you and you may reign over everything you desire.” David sent Abner away, and he went in peace.
  - range: 22-30
    heading: Joab murders Abner
    plain: |
      Just then David's men and Joab came back from a raid with a great deal of plunder. Abner was no longer with David in Hebron, because David had sent him away and he had gone in peace. When Joab and all his army arrived, Joab was told, “Abner the son of Ner came to the king, and the king sent him away, and he has gone in peace.” Joab went to the king and said, “What have you done? Abner came to you; why did you let him get away? You know Abner the son of Ner: he came to deceive you, to learn your comings and goings and everything you are doing.”

      Joab left David and sent messengers after Abner, and they brought him back from the well of Sirah; David knew nothing of it. When Abner returned to Hebron, Joab took him aside in the gateway to speak with him privately, and there he stabbed him in the belly, and he died, for the blood of Joab's brother Asahel.

      When David heard of it afterward, he said, “I and my kingdom are innocent before the LORD forever of the blood of Abner the son of Ner. Let it fall on the head of Joab and on all his father's house. May Joab's house never be without someone with a discharge, or a leper, or one who leans on a staff, or one who falls by the sword, or one who lacks bread.” So Joab and his brother Abishai killed Abner, because he had killed their brother Asahel in the battle at Gibeon.
  - range: 31-39
    heading: David mourns Abner
    plain: |
      David said to Joab and to all the people with him, “Tear your clothes, put on sackcloth, and mourn in front of Abner.” And King David himself walked behind the bier. They buried Abner in Hebron, and the king wept aloud at Abner's grave, and all the people wept. The king sang a lament for Abner:

      “Should Abner have died as a fool dies?
      Your hands were not bound, your feet were not put in fetters;
      you fell as a man falls before the wicked.”

      And all the people wept over him again. When the people came to urge David to eat something while it was still day, David swore, “May God do so to me, and more, if I taste bread or anything else before the sun goes down.” All the people took note of it, and it pleased them, as everything the king did pleased them. So all the people and all Israel understood that day that the king had no part in the killing of Abner the son of Ner.

      The king said to his servants, “Do you not know that a prince and a great man has fallen this day in Israel? Today I am weak, though I am anointed king, and these men, the sons of Zeruiah, are too hard for me. May the LORD repay the evildoer according to his wickedness.”

notes:
  - ref: 2
    phrase: unto David were sons born in Hebron
    kind: history
    title: Six sons in Hebron
    body: |
      The six sons, each by a different mother, are not a passing list: three of them figure prominently in the story that follows. Amnon, the firstborn, is the son of [[2 Sam. 13]]. Absalom's mother was the daughter of Talmai, king of Geshur, and it is to Talmai that Absalom flees after he has Amnon killed ([[2 Sam. 13:37]]); his revolt fills chapters 15–18. Adonijah, the fourth, is the son who “exalted himself, saying, I will be king” as David lay dying ([[1 Kgs. 1:5]]). Of Chileab, Abigail's son, Samuel says nothing more; the Chronicler's list of the sons born in Hebron gives Abigail's son as “Daniel” ([[1 Chr. 3:1]]).

      What the site says of David's many wives, and of what latter-day revelation says of them, is at [[2 Sam. 12:8]].
    sources: [lds-scriptures]

  - ref: 7
    phrase: Wherefore hast thou gone in unto my father’s concubine?
    kind: history
    title: A claim to the throne
    body: |
      Ish-bosheth's question is a charge of treason more than of immorality. “To approach the royal concubines was tantamount to claiming the throne,” so it is “little wonder Ishbosheth was concerned.” On one older reading the right to the dead king's concubines belonged to his successor alone, who received them as part of what he inherited, so that taking one of them was a proof, by the ideas of the time, that Abner “was aiming at the throne.”

      Scripture reckons the act the same way twice more. On Ahithophel's counsel Absalom goes in to his father's concubines “in the sight of all Israel,” so that “all Israel shall hear that thou art abhorred of thy father” ([[2 Sam. 16:21–22]]; the note at [[2 Sam. 16:22]]). When Adonijah asks for Abishag, Solomon answers, “ask for him the kingdom also” ([[1 Kgs. 2:22]]). The text does not say whether Ish-bosheth's charge was true; it says only that Abner was furious. Rizpah herself appears again, keeping her long watch over her sons, at [[2 Sam. 21:10]].
    sources: [ot-manual-2-samuel-1, keil-1-samuel, lds-scriptures]

  - ref: 8
    phrase: Am I a dog’s head
    kind: words
    title: A dog's head for Judah
    body: |
      Abner's question meant “Am I a traitor?” The Hebrew has no word for “against”: it reads “Am I a dog's head that is Judah's?”, where the King James has “which against Judah.” Elsewhere in Samuel the dog is a word of contempt: the Church's footnote sends the reader to Goliath's “Am I a dog?” ([[1 Sam. 17:43]]), and Mephibosheth will call himself “such a dead dog as I am” ([[2 Sam. 9:8]]).

      His defense is his loyalty: he has kept faith with the house of Saul and has not handed Ish-bosheth over to David. In the next breath he swears to hand the kingdom to David (verses 9–10): a traitor to Saul's house is what “he soon proved to be.”
    sources: [ot-manual-2-samuel-1, biblehub-interlinear, lds-scriptures]

  - ref: 9
    phrase: as the LORD hath sworn to David
    kind: scripture
    title: What the LORD had sworn
    body: |
      Abner knew what the LORD had promised David, and he swears to carry it out. His “So do God to Abner, and more also” is a self-curse: the man swearing called on God to do so to him, and more, if he did not keep his word. It was probably the kind of phrase spoken when a covenant was made, and the formula is attested of Eli, Saul, Jonathan, Abner, David and Solomon, and David will swear by it in this same chapter (verse 35).

      What Abner swears to do is “to translate the kingdom,” that is, to transfer it (the Church's footnote gives “transfer”), from Saul's house to David's. The footnote points back to Samuel's word to Saul after Amalek: “The LORD hath rent the kingdom of Israel from thee this day, and hath given it to a neighbour of thine, that is better than thou” ([[1 Sam. 15:28]]). Abner names the promise again to the elders of Israel (verse 18), and when they come to Hebron they remind David of it themselves: “the LORD said to thee, Thou shalt feed my people Israel” ([[2 Sam. 5:2]]).
    sources: [parker-cutting, lds-scriptures]

  - ref: 14
    phrase: Deliver me my wife Michal
    kind: history
    title: Michal returned
    body: |
      David's demand had both a right and a policy behind it. He had paid the price Saul set for Michal ([[1 Sam. 18:25–27]]), and Saul had given her to another man while David was a fugitive ([[1 Sam. 25:44]]). On one older reading David could therefore “demand her back again with perfect justice,” and Ish-bosheth could not refuse; but the same reading adds a political reason, that renewing his marriage to the king's daughter would show all Israel “that he cherished no hatred in his heart towards the fallen king.” Being Saul's son-in-law had given David a legitimate claim to the throne in the first place (the note at [[1 Sam. 18:20]]).

      David sent this demand to Ish-bosheth himself, not to Abner, and that too made it public. On another older reading the return of Michal became an open act of justice that “clearly exhibited the strength of David and the weakness of Ish-bosheth.” The text gives one human moment and no comment: Phaltiel walking behind her, weeping, as far as Bahurim, until Abner sent him home. What Michal felt is not told. Her last scene with David is at [[2 Sam. 6:16–23]].
    sources: [keil-1-samuel, cambridge-1-samuel, ot-minute-1-samuel-18, bd-michal, lds-scriptures]

  - ref: 27
    phrase: for the blood of Asahel his brother
    kind: history
    title: For the blood of Asahel
    body: |
      The text gives Joab's reason twice, here and in verse 30, and the law of Israel seems at first to stand behind it. The next of kin of a murdered man was “the revenger of blood,” who “himself shall slay the murderer” ([[Num. 35:19]]); the note at [[Deut. 19:6]] explains who he was and why the law set limits on him. But Asahel fell in battle, pursuing Abner, after Abner had twice told him to turn aside and asked, “wherefore should I smite thee to the ground? how then should I hold up my face to Joab thy brother?” ([[2 Sam. 2:22]]).

      One older reading says plainly that the act “was not justifiable on the score of blood-revenge,” since Abner had killed Asahel in self-defense; it was “merely a convenient pretext for getting rid of a dangerous rival,” the commander who would otherwise have had the credit for bringing Israel to David. Scripture gives its own verdict when David is dying: Joab “shed the blood of war in peace” ([[1 Kgs. 2:5]]), and Solomon says that he “fell upon two men more righteous and better than he … my father David not knowing thereof” ([[1 Kgs. 2:32]]). The second man was Amasa, David's later captain, whom Joab would murder in the same way ([[2 Sam. 20:9–10]]).
    sources: [lds-scriptures, cambridge-1-samuel]

  - ref: 29
    phrase: or that leaneth on a staff
    kind: words
    title: The curse on Joab's house
    body: |
      David puts the blood on Joab so that it will not rest on himself or his kingdom (verse 28), and he names what he asks to fall on Joab's line: disease that made a man unclean, weakness, violent death and want. “One that hath an issue” is the man with a bodily discharge, the word used of the man in the law who “because of his issue … is unclean” ([[Lev. 15:2]]); the leper lived “alone; without the camp” ([[Lev. 13:46]]). “Falleth on the sword” is, in the Hebrew, falls *by* the sword.

      “Leaneth on a staff” is less certain. The Septuagint reads “leans on a staff,” as the King James does, a man who must lean on a crutch. But the Hebrew word, *pelek*, is the spinner's tool in [[Prov. 31:19]], where the King James has “distaff,” and here too it probably means the “whirl of spindle.” On that reading the man in the curse holds a spindle rather than leans on a crutch. The Latin translation renders the phrase “distaff holder,” which one older commentary explains as “a weak, effeminate man, unfit for war”; the same commentary finds that explanation forced, and notes that the Septuagint and the Targum support the King James “staff.” Either way the curse is meant to last: “let there not fail from the house of Joab.” Solomon's sentence on Joab repeats it: “Their blood shall therefore return upon the head of Joab, and upon the head of his seed for ever” ([[1 Kgs. 2:33]]).
    sources: [bdb, cambridge-1-samuel, biblehub-interlinear, lxx-rahlfs, lds-scriptures]

  - ref: 37
    phrase: it was not of the king to slay Abner the son of Ner
    kind: history
    title: Mourning before the people
    body: |
      David's mourning was public and complete, and the text says what it achieved. He made Joab himself tear his clothes and put on sackcloth, followed the bier as king, wept aloud at the grave, sang a lament, and swore the same self-curse Abner had sworn (verses 9 and 35) that he would eat nothing before sundown. “All the people took notice of it,” and “all Israel understood that day” that the king had no hand in the murder. It mattered: those whom Abner had persuaded to change their loyalty “could easily have gone back to Ishbosheth at the news of Abner's death.”

      The lament itself asks whether Abner should have died the death of a *nābāl* (“as the death of a fool”), the senseless man of [[1 Sam. 25:25]]. His hands were not bound nor his feet in fetters; he fell as a man falls before the wicked. David then calls him “a prince and a great man” (verse 38).

      Whether such public grief was policy or sincere is asked of David's lament for Saul at [[2 Sam. 1:12]]; here too the text does not choose, and records only what David did and that the people believed him.
    sources: [ot-manual-2-samuel-1, biblehub-interlinear, lds-scriptures]

  - ref: 39
    phrase: these men the sons of Zeruiah be too hard for me
    kind: history
    title: Too hard for me
    body: |
      David says that the sons of Zeruiah are too hard for him. Zeruiah was David's sister ([[1 Chr. 2:16]]), so Joab and Abishai were his nephews, and Joab was the captain of his army, “closely associated with all the chief events of David's reign and … generally faithful to his master.” A king who was “weak, though anointed” could curse Joab and his house, as he had (verse 29), and leave the rest to the LORD: “the LORD shall reward the doer of evil according to his wickedness.”

      He did not forget it. Dying, he charged Solomon, “let not his hoar head go down to the grave in peace” ([[1 Kgs. 2:5–6]]). Solomon had Joab killed at the altar, giving as the reason “the innocent blood, which Joab shed, from me, and from the house of my father” ([[1 Kgs. 2:31]]). Joab had also taken Adonijah's side against Solomon, and was put to death “for that reason” as well.
    sources: [bd-joab, lds-scriptures]

christ: |
  David would not avenge Abner with his own hand. He was weak, he said, and he left “the doer of evil” to the LORD (verse 39); on one older reading he was obliged to restrict himself to a curse on Joab's house “and to leave the retribution to God.” Judgment belongs to Christ: “the Father judgeth no man, but hath committed all judgment unto the Son” ([[John 5:22]]). The Lord asks the same of His disciples when they are wronged: “ye ought to say in your hearts—let God judge between me and thee, and reward thee according to thy deeds” ([[D&C 64:11]]).

explore: |
  - **Abner before this chapter.** [[1 Sam. 26:5–16]], asleep beside Saul; [[2 Sam. 2:8–32]], Ish-bosheth's king-maker, and Asahel's death.
  - **Joab's end.** [[2 Sam. 20:8–10]], Amasa; [[1 Kgs. 2:5–6]] and [[1 Kgs. 2:28–34]], Solomon's sentence.
  - **Michal.** [[1 Sam. 18:20–27]]; [[1 Sam. 19:11–17]]; [[1 Sam. 25:44]]; [[2 Sam. 6:16–23]].
  - **Leaving judgment to God.** [[D&C 64:9–11]]; [[Rom. 12:19]].

