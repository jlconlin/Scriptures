chapter: 11
title: But David Tarried Still at Jerusalem
tagline: While his army besieges Rabbah, David takes Bath-sheba, the wife of Uriah; when she conceives and Uriah will not go home, David sends him back to Joab with the letter that orders his death.
when: 'At the time when kings go forth to battle, while Joab besieged Rabbah'

setting: |
  Chapter 10 began a war with the Ammonites after their new king, Hanun, shamed David's envoys. Joab and Abishai drove off the Ammonites and the Syrians they had hired, and the Ammonites shut themselves up in their city ([[2 Sam. 10:14]]). This chapter opens the next season's campaign: Joab lays siege to Rabbah, the Ammonite capital, modern Amman in Jordan. The siege is not finished until [[2 Sam. 12:26–31]], and between its beginning and its end the book tells the story of Bath-sheba and Uriah.

  The seminary manual makes chapters 11–12 the middle of the book's three parts, between David's rise (1–10) and the troubles of his house (13–24): the adultery leads David into deceit and further sin, and the rest of the book describes the suffering that befell his house. The episode comes abruptly after the LORD's promise to establish David's house and kingdom for ever (chapter 7), and many commentators take it as the turning point of David's story, after which he lives “under a sort of curse.” Nathan's rebuke follows in chapter 12, and Psalm 51, by its title, belongs to that day ([[Ps. 51]] on the site). Bath-sheba's later part, as Solomon's mother, is in [the guide to women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/).

thread: |
  The chapter is a cover-up that fails at every turn because of one honest man. It begins with a king who stays home in the season when kings go to war, and what he sees from his roof leads to adultery. When Bath-sheba sends word that she is with child, David does not repent; he tries to hide what he has done, first by bringing Uriah home to his wife, and when that fails, by arranging his death in battle. Uriah, a foreigner and one of David's own warriors, will not take the comforts of home while the army is in the field, and so the king's every scheme runs into the soldier's integrity until the only way left to hide the sin is a greater one.

  The narrator says what David saw, sent, said and wrote, and, as the Old Testament generally does, leaves the motives to the reader. The judgment is held back to the last line, and it is the LORD's: “the thing that David had done displeased the LORD.” That sentence prepares the way for the next chapter, in which the LORD sends Nathan.

sections:
  - range: 1-5
    heading: David and Bath-sheba
    plain: |
      In the spring, at the turn of the year, when kings go out to war, David sent Joab with his officers and all Israel. They ravaged the Ammonites and laid siege to Rabbah. But David stayed in Jerusalem. One evening David got up from his bed and walked on the roof of the palace, and from the roof he saw a woman bathing. She was very beautiful. David sent to find out about her, and someone said, “Isn't this Bath-sheba, the daughter of Eliam, the wife of Uriah the Hittite?” David sent messengers and took her. She came to him and he lay with her, for she had just purified herself from her uncleanness. Then she went back to her house. The woman conceived, and she sent word to David: “I am pregnant.”
  - range: 6-13
    heading: Uriah will not go home
    plain: |
      David sent word to Joab, “Send me Uriah the Hittite,” and Joab sent Uriah to David. When Uriah arrived, David asked him how Joab was, how the army was, and how the war was going. Then David said to Uriah, “Go down to your house and wash your feet,” that is, go home and rest. Uriah left the palace, and a gift of food from the king followed him. But Uriah slept at the palace door with all his lord's servants and did not go down to his house. When David was told that Uriah had not gone home, he said to him, “You have just come from a journey. Why didn't you go down to your house?” Uriah answered, “The ark, and Israel, and Judah are living in tents, and my lord Joab and my lord's servants are camped in the open field. Should I go to my house to eat and drink and lie with my wife? As you live, and as your soul lives, I will not do it.” David said, “Stay here today too, and tomorrow I will send you back.” So Uriah stayed in Jerusalem that day and the next. David invited him, and he ate and drank with the king, and David got him drunk. But in the evening he went out to sleep on his bed with his lord's servants, and still he did not go down to his house.
  - range: 14-25
    heading: The letter to Joab
    plain: |
      In the morning David wrote a letter to Joab and sent it by Uriah's hand. In the letter he wrote, “Put Uriah in the front line, where the fighting is fiercest, and then pull back from him, so that he will be struck down and die.” So as Joab besieged the city, he put Uriah at a place where he knew the strongest defenders were. The men of the city came out and fought Joab, and some of David's soldiers fell; Uriah the Hittite died too. Joab sent David a full report of the battle. He told the messenger, “When you have finished telling the king all about the battle, the king may grow angry and say to you, ‘Why did you go so near the city to fight? Didn't you know they would shoot from the wall? Who killed Abimelech the son of Jerubbesheth? Didn't a woman drop a piece of a millstone on him from the wall, so that he died at Thebez? Why did you go near the wall?’ Then say, ‘Your servant Uriah the Hittite is dead too.’” The messenger went and told David everything Joab had sent him to say: “The men got the better of us and came out against us in the field, and we drove them back to the entrance of the gate. Then the archers shot at your servants from the wall, and some of the king's servants are dead, and your servant Uriah the Hittite is dead too.” David told the messenger, “Say this to Joab: ‘Don't let this trouble you, for the sword devours one as well as another. Press your attack on the city and overthrow it.’ And encourage him.”
  - range: 26-27
    heading: David takes Uriah's wife
    plain: |
      When Uriah's wife heard that her husband was dead, she mourned for him. When the time of mourning was over, David sent for her and brought her into his house. She became his wife and bore him a son. But what David had done was evil in the LORD's sight.

notes:
  - ref: 1
    phrase: But David tarried still at Jerusalem
    kind: history
    title: The king who stayed home
    body: |
      The verse sets the scene for everything that follows: in the season when kings led their armies, David sent his army and stayed behind. Spring opened the year and the campaigning season, once the cold was past, and David had made his name as a leader in the field, the one who slew “his ten thousands” ([[1 Sam. 18:7]]). Kings were expected to lead their armies into battle, so the line that David “tarried still” is an ominous detail, and the adultery that follows takes place when he fails to go with his people. One Latter-day Saint reading sets the idle king beside the Lord's counsel to be “anxiously engaged in a good cause” ([[D&C 58:27]]). The contrast the chapter itself draws comes in verse 11, where the soldier will not go home while the army is in the field.
    sources: [ot-minute-2-samuel, judd-davids-fall, taggart-sworn-david]

  - ref: 2
    phrase: from the roof he saw a woman washing herself
    kind: history
    title: Who was on the roof
    body: |
      The text puts David on the roof, not Bath-sheba. He rose from his bed toward evening and walked on the roof of the palace, and from there he saw a woman washing. Nothing says she was on a roof, and so nothing says she was displaying herself to the king. The scene fits the place: Jerusalem's evening breezes still bring people up onto their roofs, and David's palace probably stood at the crest of the crowded hill now called the City of David, where the houses below lay in plain view.

      The verse also withholds her name. She is only “a woman” who was “very beautiful to look upon,” and in this verse the narrator presents her only as the object of David's desire. Her name comes only in the next verse, in the answer to David's inquiry.
    sources: [ot-minute-2-samuel, judd-davids-fall, hock-narrating]

  - ref: 3
    phrase: the daughter of Eliam, the wife of Uriah the Hittite
    kind: history
    title: Whose daughter, whose wife
    body: |
      The answer to David's inquiry told him that the woman was married, and that her family were his own men. Her father Eliam is almost certainly the Eliam who was one of David's thirty “mighty men,” and Uriah her husband was one of them too. The list names “Eliam the son of Ahithophel the Gilonite” ([[2 Sam. 23:34]]) and ends with “Uriah the Hittite” ([[2 Sam. 23:39]]; the note there tells who the mighty men were). A Hittite was not an Israelite by lineage, but Uriah's faithfulness to the Lord shows in his name, “My light is Jehovah,” and in what he does in this chapter.
    sources: [shannon-complex-stories, lds-scriptures, judd-davids-fall]

  - ref: 4
    phrase: David sent messengers, and took her
    kind: history
    title: What the text says of Bath-sheba’s part
    body: |
      The text gives David every action and leaves Bath-sheba's mind unstated. David never leaves his house: he sends messengers, they take her, and afterward she returns home alone. Readers have placed her anywhere between a woman who bathed to entice the king and one who had no say at all, but the text does not give enough information to say anything definite.

      What can be said is that David was king, and the difference in power between them “must nuance any discussion of consent.” It could have been hard for her to refuse in a society where women had far fewer rights; Saul, after all, had given David's own wife Michal to another man. The narrator uses none of the Hebrew words for rape, which chapter 13 uses for Amnon's act in the strongest language, and the writers lay the blame for Uriah's murder squarely on David. So does Nathan's charge in the next chapter: “thou hast killed Uriah the Hittite with the sword, and hast taken his wife to be thy wife” ([[2 Sam. 12:9]]). Bath-sheba's story does not end here; through Solomon's kingship she became the most powerful woman in ancient Israel.
    sources: [ot-minute-2-samuel, shannon-complex-stories, lds-scriptures]

  - ref: 4
    phrase: for she was purified from her uncleanness
    kind: words
    title: What “purified from her uncleanness” means
    body: |
      The clause explains the washing of verse 2, and it shows that the child to come could only be David's. The Hebrew verb is the reflexive of “consecrate,” used of priests and people who purify themselves; here it describes a woman who had just purified herself from her uncleanness. The law set a woman apart during her monthly issue: “she shall be put apart seven days” ([[Lev. 15:19]]; verses 19–24). On a Latter-day Saint reading, the bath David saw was the purification at the end of that time, so the narrator is telling the reader, without saying it outright, that Bath-sheba was not and could not have been pregnant before that night. When she sends word, “I am with child” (verse 5), there is no doubt whose child it is, and David's next move is to make it appear to be Uriah's.
    sources: [bdb, lds-scriptures, ot-minute-2-samuel, ot-seminary-lesson-91]

  - ref: 11
    phrase: shall I then go into mine house, to eat and to drink, and to lie with my wife?
    kind: history
    title: Why Uriah would not go home
    body: |
      Uriah gives his own reason, and it is loyalty: the ark, the army and his commander are in the field, and he will not take at home the comforts they are without. David had told him to go down and wash his feet, which was what a man did on coming home from work or a journey, to rest; the king's purpose was that Uriah spend the night with his wife, so that the child would seem to be his. Instead Uriah slept at the palace door with the servants. The next night David made him drunk, in the hope, one older reading suggests, that he would forget his oath, and still he slept with the servants (verse 13).

      The contrast with verse 1 is the point. The king had stayed home while the army fought; the soldier would not go home while it was in the field. Uriah showed the integrity and self-control the king lacked, and he swore it on David's own life, “as thou livest, and as thy soul liveth,” to the king who would soon arrange his death. If the story has a hero, it is Uriah the Hittite.
    sources: [keil-1-samuel, ot-seminary-lesson-91, ot-minute-2-samuel, cambridge-1-samuel, judd-davids-fall]

  - ref: 14
    phrase: sent it by the hand of Uriah
    kind: history
    title: A letter carried by the man it condemned
    body: |
      When the cover-up failed, David turned it into murder, and he made Uriah carry his own death sentence back to the army. The letter told Joab to set Uriah where the fighting was fiercest and then pull back from him (verse 15), and other soldiers died with him (verses 17 and 24): the “valiant men” of verse 16 were, on one Latter-day Saint reading, most likely David's own mighty men. Nathan will name the act without the cover of battle: David “hast killed Uriah the Hittite with the sword, … and hast slain him with the sword of the children of Ammon” ([[2 Sam. 12:9]]).

      Latter-day teaching reads the sequence as the way one sin grows into a worse one. When a priesthood holder, as David was, tries to cover his sins, “the Spirit of the Lord is grieved” ([[D&C 121:37]]), and it was in that diminished state that David arranged Uriah's death. He did what many do: he “compounded his sin by trying to cover it up.”
    sources: [judd-davids-fall, ot-minute-2-samuel, lds-scriptures, ot-manual-2-samuel-1]

  - ref: 21
    phrase: Who smote Abimelech the son of Jerubbesheth?
    kind: scripture
    title: Why Joab named Abimelech
    body: |
      Joab expected David to be angry that the army had gone so close to the wall, and he armed his messenger with the very example the king would throw at him. Abimelech, the son of Gideon (Jerubbesheth is Gideon, whose other name was Jerubbaal, [[Judg. 6:32]]), was killed at Thebez when “a certain woman cast a piece of a millstone upon Abimelech's head” ([[Judg. 9:53]]; the site's note there follows the story). The question Joab put in the king's mouth answers itself: why go near a wall, when a woman on a wall had killed Abimelech?

      Joab also knew what would quiet the king's anger. If David raged, the messenger was to add, “Thy servant Uriah the Hittite is dead also,” to turn the rebuke aside, since David only wanted to know whether Uriah was still alive. One Latter-day Saint reading finds the comparison precise in another way: Abimelech died because of a woman, and David, because of a woman, ordered a rash attack that cost the lives of valiant soldiers.
    sources: [keil-1-samuel, lds-scriptures, ot-minute-2-samuel]

  - ref: 25
    phrase: for the sword devoureth one as well as another
    kind: history
    title: David’s answer to the news
    body: |
      David answers the news of his soldiers' deaths, Uriah among them, with indifference: he tells Joab not to be troubled, since the sword takes one as well as another, and urges the attack on. The reply quiets David's own conscience more than Joab's, and it urges the army to keep fighting while the king stays in the comfort of his house.
    sources: [ot-seminary-lesson-91, ot-minute-2-samuel]

  - ref: 27
    phrase: But the thing that David had done displeased the LORD
    kind: scripture
    title: Save only in the matter of Uriah
    body: |
      The narrator's one verdict in the chapter is the LORD's, and the Hebrew behind “displeased” is a moral word. The King James uses “displease” here and in verse 25, but the lexicon reads the same expression two ways: in David's message, “be displeasing”; here, “be evil, wicked, ethically.” The thing David had done was evil in the LORD's eyes.

      Later scripture remembers David's reign by this one exception. Kings says David “did that which was right in the eyes of the LORD, and turned not aside from any thing that he commanded him all the days of his life, save only in the matter of Uriah the Hittite” ([[1 Kgs. 15:5]]), and the footnote there points back to this chapter and to D&C 132:39. Joseph Smith's revision of that verse says David “repented of the evil all the days of his life, save only in the matter of Uriah the Hittite, wherein the Lord cursed him,” a reading that agrees with the Doctrine and Covenants and with David's repentance. The revelation names the same exception: “in none of these things did he sin against me save in the case of Uriah and his wife; and, therefore he hath fallen from his exaltation, and received his portion” ([[D&C 132:39]]). What the Lord forgave David, and what He did not, is explained at [[2 Sam. 12:13]].
    sources: [bdb, lds-scriptures, nyman-jst-historical]

christ: |
  The chapter ends with what the LORD saw, and the next begins with the prophet He sent ([[2 Sam. 12:1]]). David hid his sin until he could hide it no longer, and the Lord who saw it is the same Lord who, in latter-day revelation, promises, “he who has repented of his sins, the same is forgiven, and I, the Lord, remember them no more,” and names the sign of it: “he will confess them and forsake them” ([[D&C 58:42–43]]).

  A sin that is covered grows, as David's grew from adultery into murder; had he sought repentance after the first sin as earnestly as he did after Nathan came, he could have come back and been forgiven. The way back to Jesus Christ runs through confession and not concealment: “He that covereth his sins shall not prosper: but whoso confesseth and forsaketh them shall have mercy” ([[Prov. 28:13]]).

