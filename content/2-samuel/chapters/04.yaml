chapter: 4
title: Who Hath Redeemed My Soul out of All Adversity
tagline: With Abner dead, two of Ish-bosheth's own captains kill him on his bed at noon and carry his head to Hebron, expecting a reward; David has them put to death for killing a righteous man in his own house, and buries the head in Abner's tomb.
when: 'After Abner''s death in Hebron, while David reigned there over Judah'

setting: |
  Since Saul's death Israel had had two kings. Abner, the captain of Saul's host, took Saul's son Ish-bosheth over the Jordan to Mahanaim and made him king over Israel, while the house of Judah followed David, who reigned in Hebron seven years and six months ([[2 Sam. 2:8–11]]; the two kingdoms are taken up at [[2 Sam. 2:4]]). It was a long war, and “the house of Saul waxed weaker and weaker” ([[2 Sam. 3:1]]). (What the name Ish-bosheth means is taken up at [[2 Sam. 2:8]].)

  Chapter 3 ended with the turn that decided the war. Abner quarrelled with Ish-bosheth, went over to David, and talked with the elders of Israel about making David king over them all; then Joab killed him in the gate of Hebron to avenge his brother Asahel ([[2 Sam. 3:17–18]], [[2 Sam. 3:27]], where the blood feud is explained). David mourned Abner publicly, and the reason mattered: the people Abner had persuaded to come over to David “could easily have gone back to Ishbosheth at the news of Abner's death.” Chapter 4 opens with that news reaching Ish-bosheth.

thread: |
  The house of Saul falls in this chapter, and David refuses any part in its fall. Abner had been the real strength of Ish-bosheth's throne, and when he dies the king loses heart and Israel is dismayed (verse 1). The narrator then stops the story for a moment to name Jonathan's son, a boy lamed in the flight from Jezreel (verse 4). One older reading takes the aside as the chapter's verdict on Saul's house before the murder is even told: with Ish-bosheth gone, the only one left in the line is a helpless lame child. (Saul's line did not end with him: other sons and grandsons of Saul are named at [[2 Sam. 21:8]].)

  Two of Ish-bosheth's own captains finish it. They kill him in his bed and carry his head to Hebron, sure that David will reward them, and they speak as though the LORD had done it through them. David's answer is the second half of the chapter. He swears by the LORD who had redeemed him from every trouble, and he treats the men as he had treated the Amalekite who claimed Saul's death. In the next chapter all the tribes come to him at Hebron ([[2 Sam. 5:1–3]]).

sections:
  - range: 1-4
    heading: Saul's house without Abner
    plain: |
      When Saul's son heard that Abner had died in Hebron, he lost heart, and all Israel was dismayed. Saul's son had two men who were captains of raiding bands, Baanah and Rechab, sons of Rimmon of Beeroth, of the tribe of Benjamin (for Beeroth was counted as part of Benjamin, and the Beerothites had fled to Gittaim and have lived there as aliens to this day). Jonathan, Saul's son, had a son who was lame in his feet. He was five years old when the news about Saul and Jonathan came from Jezreel; his nurse picked him up and fled, and in her haste he fell and was lamed. His name was Mephibosheth.
  - range: 5-8
    heading: The murder of Ish-bosheth
    plain: |
      Rechab and Baanah, the sons of Rimmon, set out and came in the heat of the day to the house of Ish-bosheth, who was lying on his bed at noon. They came into the house as though to fetch wheat, and struck him under the fifth rib; then Rechab and his brother Baanah slipped away. They had come into the house while he lay on his bed in his bedroom; they struck him, killed him and cut off his head, and taking the head they travelled all night by the road through the plain, the Jordan valley. They brought the head of Ish-bosheth to David at Hebron and said to the king, “Here is the head of Ish-bosheth, the son of Saul your enemy, who sought your life. Today the LORD has avenged my lord the king on Saul and on his descendants.”
  - range: 9-12
    heading: David's answer
    plain: |
      David answered Rechab and his brother Baanah, the sons of Rimmon of Beeroth: “As the LORD lives, who has redeemed my life out of every trouble: when a man told me, ‘Saul is dead,’ and thought he was bringing good news, I seized him and had him killed at Ziklag; that was the reward he thought I would give him for his news. How much more, when wicked men have killed an innocent man in his own house on his bed, shall I not now demand his blood from your hand and rid the land of you?” David gave the order to his young men, and they killed them, cut off their hands and feet, and hung the bodies beside the pool at Hebron. But they took the head of Ish-bosheth and buried it in Abner's tomb in Hebron.

notes:
  - ref: 2
    phrase: for Beeroth also was reckoned to Benjamin
    kind: history
    title: Beeroth reckoned to Benjamin
    body: |
      The parenthesis in verses 2–3 explains how men of Beeroth could be Benjamites, and so marks the murderers as men of Saul's own tribe, about to kill the son of the Benjamite king.

      It was needed because Beeroth had not always been Israelite. It was one of the four cities of the Gibeonites, the people whose treaty with Joshua let them keep their towns ([[Josh. 9:17]]), and it fell in Benjamin's lot ([[Josh. 18:25]]). Verse 3 says the Beerothites fled to Gittaim and lived there as “sojourners” to the writer's own day; it does not say when or why they left. One older reading takes those who fled to be the town's first, Gibeonite people, and Benjamites to have taken it over after them, so that Rechab and Baanah were Benjamites of Beeroth. The same reading conjectures, and calls it no more than a plausible conjecture, that the Gibeonites fled from Saul's slaughter of their people, for which the land later suffered a famine ([[2 Sam. 21:1–2]], where that story is told).
    sources: [cambridge-1-samuel, lds-scriptures]

  - ref: 4
    phrase: And his name was Mephibosheth
    kind: history
    title: Jonathan's lame son
    body: |
      Mephibosheth was Jonathan's son, five years old when the news of Saul's and Jonathan's deaths came from Jezreel. His nurse caught him up and fled, and in her haste he fell and was lamed. The verse is all the chapter says of him; he is introduced here and then left until David asks whether any of Saul's house is left “that I may shew the kindness of God unto him,” and Ziba answers that “Jonathan hath yet a son, which is lame on his feet” ([[2 Sam. 9:3]]; that kindness is explained at [[2 Sam. 9:1]]).

      His name, like his uncle Ish-bosheth's, is a substitute for one with *Baal* in it (Merib-baal; explained at [[2 Sam. 2:8]]). His lameness matters to the rest of his story: when David flees from Absalom, Ziba says he stayed behind in hope of the kingdom, and Mephibosheth answers that he meant to saddle an ass and go with the king, “because thy servant is lame,” and his servant deceived him ([[2 Sam. 16:1–4]]; [[2 Sam. 19:26]], where the two stories are set side by side). David spares him when the Gibeonites ask for Saul's sons ([[2 Sam. 21:7]]). How his lameness bears on “the lame and the blind” of David's capture of Jerusalem is taken up at [[2 Sam. 5:8]].
    sources: [bd-mephibosheth, lds-scriptures]

  - ref: 6
    phrase: as though they would have fetched wheat
    kind: words
    title: As though they would have fetched wheat
    body: |
      The words explain how two armed men walked into the king's house: they came in as men fetching wheat. The Hebrew is clipped, two words, *lōqḥê ḥiṭṭîm*. The King James reads them as a pretext, and so does a modern translation: “as though to take wheat.”

      The Septuagint tells the scene differently. Instead of the pretext it has a sleeping doorkeeper: “the porter of the house winnowed wheat, and he slumbered and slept: and the brothers Rechab and Baana went privily into the house,” and only then, in verse 7, the killing. The Hebrew tells the murder twice, once briefly in verse 6 and again in verse 7 with the beheading and the night's flight; the Greek tells it once. Neither text leaves any doubt about what was done: a man asleep at noon in his own bedchamber was struck down.
    sources: [oshb-wlc, nrsvue, lxx-rahlfs]

  - ref: 11
    phrase: wicked men have slain a righteous person in his own house upon his bed
    kind: history
    title: A righteous person
    body: |
      David put the two men to death because they had killed a man who had done nothing worthy of death, and killed him in his own house, on his bed. The word “righteous” (*ṣaddîq*) is used here in its legal sense, “right in law, not under penalty.” Ish-bosheth had been made king by Abner, and his men had fought David's ([[2 Sam. 2:12–17]]), but he was under no sentence of death, and Rechab and Baanah killed him asleep on his bed.

      The men had spoken as though the deed were the LORD's: “the LORD hath avenged my lord the king this day of Saul, and of his seed” (verse 8). David answers with an oath by the same LORD, the one “who hath redeemed my soul out of all adversity” (verse 9), and with a “how much more.” The Amalekite who brought news of Saul's death, and claimed to have killed him, expected a reward and was put to death (verse 10; the two accounts of Saul's death are compared at [[2 Sam. 1:10]]). How much more these men. (Blood revenge, the background of “require his blood of your hand,” is taken up with Joab's killing of Abner at [[2 Sam. 3:27]].)

      The sentence was both right and wise. Though he was at war with Ish-bosheth, David “did not condone the treachery of the assassins,” and in executing them he “showed great wisdom and judgment”; his “wisdom and goodness finally united the tribes” into one kingdom loyal to him.
    sources: [bdb, ot-manual-2-samuel-1, lds-scriptures]

  - ref: 12
    phrase: cut off their hands and their feet, and hanged them up over the pool in Hebron
    kind: history
    title: Over the pool in Hebron
    body: |
      The punishment was meant to be seen. The text gives no reason for cutting off the hands and feet; one older reading supplies it: the hands that had done the murder and the feet that had run for the reward were put on display by the pool, the most public place in Hebron, as a warning against the same crime, in keeping with the law that a man put to death for a capital sin might be hanged on a tree ([[Deut. 21:22]]).

      The head of Ish-bosheth had a different end. It was buried in Abner's tomb in Hebron, the grave where David had wept aloud when Abner was buried ([[2 Sam. 3:32]]): the head of the king Abner had made was laid in Abner's own grave.
    sources: [keil-1-samuel, cambridge-1-samuel, lds-scriptures]

christ: |
  David swears by “the LORD … who hath redeemed my soul out of all adversity” (verse 9). The King James' “LORD” in small capitals stands for Jehovah, and Jehovah is the premortal Jesus Christ. One older reading hears in the oath David's confidence that a man under the LORD's protection had no need to commit crimes to rid himself of his enemies, and his sentence on the murderers bears it out.

  The Redeemer who delivered David delivers His disciples now. A disciple who trusts His protection has no need to gain by wrongdoing, his own or another's, and can refuse an advantage that comes by it, as David refused the head of his rival.

explore: |
  - **What became of Saul's house.** [[2 Sam. 9:1–13]], Mephibosheth at the king's table; [[2 Sam. 21:1–14]], the Gibeonites and Saul's sons.
  - **David's oath.** He swears the same oath by the LORD who redeemed his soul again at [[1 Kgs. 1:29]].
  - **The kingdom made one.** [[2 Sam. 5:1–5]], all the tribes come to Hebron.

