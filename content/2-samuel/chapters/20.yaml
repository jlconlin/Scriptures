chapter: 20
title: We Have No Part in David
tagline: Sheba the Benjamite calls Israel away from David; Joab murders Amasa and pursues Sheba to Abel of Beth-maachah, where a wise woman saves her city by giving up the rebel's head.
when: 'As David returned to Jerusalem after Absalom''s revolt'

setting: |
  Absalom's revolt ended with his death in the wood of Ephraim ([[2 Sam. 18:14–15]]), and chapter 19 brings David home. Judah, the tribe among whom the rebellion had first broken out, held back, so David sent word to its elders and swore to Amasa, Absalom's general, that he would be captain of the host “in the room of Joab” ([[2 Sam. 19:11–14]]). Judah came to Gilgal to bring the king over the Jordan. There the men of the other tribes complained that Judah had “stolen” the king away without them, and “the words of the men of Judah were fiercer than the words of the men of Israel” ([[2 Sam. 19:40–43]]).

  This chapter begins at that quarrel. A Benjamite turns it into a second revolt, and the king's two generals, the one he has sworn to promote and the one he has sworn to put out of office, go out after the rebel together. The pursuit runs from the great stone at Gibeon to Abel of Beth-maachah in the far north.

  The chapter closes, as chapter 8 closed the first part of David's reign, with a list of his chief officers ([[2 Sam. 8:16–18]]). The two lists belong to different periods of the reign, and the differences between them show it.

thread: |
  The chapter sets a sword beside a word. Joab ends his rival with a kiss and a blade and leaves him in the road. At Abel a woman stops the battering of her city's wall with a proverb and a question, and the war ends with one man's head instead of a city.

  Yet the chapter ends with Joab, not with her. He returns to Jerusalem at the head of the army, and the list of officers puts him “over all the host of Israel” (verse 23), the post David had sworn to give Amasa. Underneath it all runs the quarrel that started the revolt, the northern tribes against Judah. Sheba was soon dealt with, but the animosity his trumpet called out would in time divide the house of Israel ([[1 Kgs. 12:16–19]]).

sections:
  - range: 1-2
    heading: Every man to his tents
    plain: |
      A worthless man happened to be there, named Sheba the son of Bichri, a Benjamite. He blew a trumpet and said, “We have no share in David, and no inheritance in the son of Jesse. Every man to his tents, O Israel!” So all the men of Israel left David and followed Sheba the son of Bichri; but the men of Judah held fast to their king, from the Jordan all the way to Jerusalem.
  - range: '3'
    heading: The ten women
    plain: |
      When David came to his house in Jerusalem, the king took the ten concubines he had left to keep the house and put them under guard. He provided for them but did not go in to them. They were shut up until the day of their death, living as widows.
  - range: 4-13
    heading: Amasa killed at Gibeon
    plain: |
      Then the king said to Amasa, “Call up the men of Judah for me within three days, and be here yourself.” Amasa went to call up Judah, but he took longer than the time the king had set him. So David said to Abishai, “Now Sheba the son of Bichri will do us more harm than Absalom did. Take your lord's servants and go after him, before he finds fortified cities and escapes us.” Joab's men went out after him, with the Cherethites, the Pelethites and all the mighty men; they marched out of Jerusalem to pursue Sheba the son of Bichri.

      When they were at the great stone in Gibeon, Amasa came to meet them. Joab was dressed in his soldier's garment, and over it was a belt with a sword in its sheath fastened at his waist; as he came forward, the sword fell out. Joab said to Amasa, “Is it well with you, my brother?” and took Amasa by the beard with his right hand to kiss him. Amasa paid no attention to the sword in Joab's hand, and Joab struck him with it in the belly and spilled his bowels on the ground. He did not strike him a second time, and Amasa died. Then Joab and his brother Abishai pursued Sheba the son of Bichri.

      One of Joab's men stood over the body and called out, “Whoever favors Joab, and whoever is for David, follow Joab!” Amasa lay wallowing in his blood in the middle of the road, and when the man saw that all the people stopped there, he moved Amasa off the road into the field and threw a cloth over him, because everyone who came by him stood still. Once he was off the road, all the people went on after Joab to pursue Sheba the son of Bichri.
  - range: 14-22
    heading: The wise woman of Abel
    plain: |
      He went through all the tribes of Israel to Abel and to Beth-maachah, and all the Berites gathered and followed him too. They came and besieged Sheba in Abel of Beth-maachah. They piled up a siege mound against the city, and it stood in the outer works, and all the people with Joab were battering the wall to bring it down.

      Then a wise woman called out from the city, “Listen, listen! Please tell Joab, ‘Come near, so that I can speak with you.’” When he came near, the woman said, “Are you Joab?” He answered, “I am.” She said, “Hear the words of your servant,” and he said, “I am listening.” Then she said, “In old times people used to say, ‘Let them ask counsel at Abel,’ and so they settled a matter. I am one of the peaceable and faithful in Israel. You are trying to destroy a city that is a mother in Israel. Why would you swallow up the inheritance of the LORD?”

      Joab answered, “Far be it, far be it from me to swallow up or destroy! That is not the case. A man of the hill country of Ephraim, Sheba the son of Bichri by name, has lifted up his hand against the king, against David. Hand him over, him alone, and I will withdraw from the city.” The woman said to Joab, “His head will be thrown to you over the wall.” Then the woman went to all the people with her wise counsel, and they cut off the head of Sheba the son of Bichri and threw it out to Joab. He blew the trumpet, and they withdrew from the city, every man to his tent; and Joab returned to Jerusalem to the king.
  - range: 23-26
    heading: David's officers
    plain: |
      Joab was over all the army of Israel, and Benaiah the son of Jehoiada was over the Cherethites and the Pelethites. Adoram was over the forced labor, and Jehoshaphat the son of Ahilud was recorder. Sheva was scribe, and Zadok and Abiathar were the priests. And Ira the Jairite was also a chief officer to David.

notes:
  - ref: 1
    phrase: We have no part in David, neither have we inheritance in the son of Jesse
    kind: history
    title: No part in David
    body: |
      Sheba's cry turned a quarrel into a revolt. At Gilgal the men of Israel had quarreled with Judah over which had the better right to the king (the note at [[2 Sam. 19:43]], which traces that rift to the later division of the kingdom). Sheba, “a man of Belial,” a worthless man (the note at [[1 Sam. 2:12]]), gave their anger its slogan: no share in David, no inheritance in the son of Jesse, every man to his tents.

      The revolt itself was short. David feared it would do “more harm than did Absalom” (verse 6), but it could scarcely have threatened his rule. Its cry outlived it. When the northern tribes left Rehoboam they said, “What portion have we in David? neither have we inheritance in the son of Jesse: to your tents, O Israel” ([[1 Kgs. 12:16]]). The King James has “part” in one verse and “portion” in the other, but the Hebrew word is the same, *ḥēleq*, and the two cries are nearly word for word.
    sources: [ot-manual-2-samuel-13, oshb-wlc, lds-scriptures]

  - ref: 4
    phrase: Then said the king to Amasa
    kind: history
    title: Amasa in Joab's place
    body: |
      Amasa, whom David sent to put down the revolt, had led the last one. Absalom “made Amasa captain of the host instead of Joab,” and Amasa was Joab's own cousin, the son of Abigail, the sister of Joab's mother Zeruiah ([[2 Sam. 17:25]]). After Absalom's death David won back Judah by swearing that Amasa would be “captain of the host before me continually in the room of Joab” ([[2 Sam. 19:13]]). The order here, to call out the men of Judah within three days, is the first step in keeping that oath.

      Amasa did not come back in time, and the text does not say why. David then gave the command to Abishai, Joab's brother, and not to Joab. Yet it is “Joab's men” who march out (verse 7), and at Gibeon Joab is among them. The text does not explain how he came to be there; three verses later he has removed his rival himself.
    sources: [bd-amasa, lds-scriptures]

  - ref: 9
    phrase: took Amasa by the beard with the right hand to kiss him
    kind: history
    title: The kiss and the sword
    body: |
      The account of how Joab killed Amasa is brief and obscure, and readers have had to piece it together. Amasa “went before them,” literally came before them, apparently meeting them on his way back from the muster. The King James makes it sound as though Amasa had put on Joab's garment, but verse 8 describes Joab: he wore his soldier's garment with a belt over it and a sword in its sheath at his waist, and as he came forward the sword fell out. The description seems meant to explain how he could stab Amasa without raising suspicion. On the usual reconstruction Joab picked the sword up with his left hand, as though it meant nothing, took Amasa's beard in his right hand for the kiss of greeting, and struck with the left. Whether the sword fell by accident or by design, the tellings differ. Taking the beard for the kiss was a gesture of welcome still known among Arabs and Turks when the older commentaries were written. “The fifth rib” means the belly. It is the blow with which Abner had killed Asahel and Joab had killed Abner ([[2 Sam. 2:23]]; the note at [[2 Sam. 3:27]]).

      Joab greeted his cousin as “my brother” and took him by the beard to kiss him. The text gives no motive; one older reading names it as jealousy, as it had been with Abner. Joab's man then joined his master's name to the king's, “He that favoureth Joab, and he that is for David” (verse 11), and the people, apparently the troops Amasa had been mustering, followed Joab once the body was out of the road.

      The reckoning came at the end of David's life. He charged Solomon with what Joab had done to Abner and Amasa, “and shed the blood of war in peace,” and Solomon's sentence calls them “two men more righteous and better than he” ([[1 Kgs. 2:5]], [[1 Kgs. 2:32]]).
    sources: [ot-manual-2-samuel-13, cambridge-1-samuel, lds-scriptures]

  - ref: 18
    phrase: They shall surely ask counsel at Abel
    kind: history
    title: Ask counsel at Abel
    body: |
      The wise woman meets Joab's siege with her city's good name. Abel of Beth-maachah lay in the far north of the land, near Lake Huleh. Her saying has been rendered more than one way. On the better-supported reading, it means that Abel had been known from old for the wisdom of its people: men went to “ask” at Abel to settle a dispute, the verb commonly used for inquiring of God (as in [[2 Sam. 16:23]]). A city with that reputation, loyal and peaceable, was not one to be battered down.

      Her words can also be heard, with varying confidence, as a further reproach: that Joab ought to have asked the city first whether it meant to fight for Sheba, as the law required before any siege, “When thou comest nigh unto a city to fight against it, then proclaim peace unto it” ([[Deut. 20:10]]). Either way, the words did their work. Joab disowned any wish to destroy, named the one man he wanted, and she went to the people “in her wisdom” and gave him Sheba's head.
    sources: [keil-1-samuel, cambridge-1-samuel]

  - ref: 19
    phrase: a city and a mother in Israel
    kind: words
    title: A mother in Israel
    body: |
      “A mother in Israel” is a title of honor, and in Hebrew it fits a city naturally. The word *ʾēm*, “mother,” is used figuratively of a city, as it is of Israel and of Judah as mothers of their people. The same phrase is Deborah's name for herself, the one who arose to care for her people when Israel's villages lay empty ([[Judg. 5:7]]). (Chapter 8 has another use of “mother” for a chief city: the note at [[2 Sam. 8:1]].)

      “The inheritance of the LORD” sharpens the plea. The phrase is used of Israel as the LORD's own possession, as when David complained to Saul that he had been driven out “from abiding in the inheritance of the LORD” ([[1 Sam. 26:19]]). Her plea counts Abel as part of that possession. Joab's answer comes at once: “Far be it, far be it from me” (verse 20).
    sources: [bdb, lds-scriptures]

  - ref: 24
    phrase: Adoram was over the tribute
    kind: words
    title: Over the forced labor
    body: |
      Adoram was in charge of men, not money. The Hebrew *mas*, which the King James renders “tribute,” means a labor band, a body of workers levied from the people for public works; the sense “tribute” belongs to later Hebrew. The office appears here for the first time, since it is not in the list of [[2 Sam. 8:16–18]]: the levy was apparently begun under David, and Solomon raised one of thirty thousand men from all Israel ([[1 Kgs. 5:13]]). Adoram, also called Adoniram, oversaw the forced labor under David, Solomon and Rehoboam.

      He died in the revolt in which Sheba's cry was raised again. Israel told Rehoboam, “Thy father made our yoke grievous” ([[1 Kgs. 12:4]]); when the king would not lighten it, they said “What portion have we in David?” and when he sent “Adoram, who was over the tribute,” “all Israel stoned him with stones, that he died” ([[1 Kgs. 12:16–18]]).
    sources: [bdb, bd-adoniram, lds-scriptures]

christ: |
  The rift Sheba's cry exposed between Israel and Judah later split the kingdom in two. The prophets saw it healed: “Ephraim shall not envy Judah, and Judah shall not vex Ephraim” ([[Isa. 11:13]]); the two sticks become one in the LORD's hand, “and they shall be no more two nations” ([[Ezek. 37:22]]). That envy is to cease “through the operation of the gospel of Jesus Christ.” The gospel that ends this quarrel in Israel also reaches the rivalries among the Lord's people now, to whom He says, “be one; and if ye are not one ye are not mine” ([[D&C 38:27]]).

explore: |
  - **The cry heard again.** [[1 Kgs. 12:1–20]], Rehoboam and the division of the kingdom.
  - **Joab's end.** [[1 Kgs. 2:5–6]]; [[1 Kgs. 2:28–34]].
  - **The other wise woman.** [[2 Sam. 14:1–20]], the woman of Tekoah.
  - **Wisdom better than strength.** [[Eccl. 9:13–18]], the poor wise man who delivered a besieged city, a parable one older reading thinks this incident may have suggested.

