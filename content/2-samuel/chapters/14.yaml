chapter: 14
title: That His Banished Be Not Expelled
tagline: Joab sends a wise woman of Tekoah to lay a made-up case before the king; David grants her son his life, sees that he has judged his own case, and lets Absalom come home, but will not see his face for two years, until Absalom forces the matter and the king kisses him.
when: 'After Absalom had been three years in Geshur'

setting: |
  Nathan had told David that the sword would never depart from his house ([[2 Sam. 12:10]]), and chapter 13 began the tragedy in that house. Amnon, David's firstborn and the heir apparent, forced his half-sister Tamar, and David let it pass. Two years later Absalom, Tamar's brother, had his servants kill Amnon at a sheep-shearing feast and fled to his mother's father, Talmai king of Geshur ([[2 Sam. 3:3]]). The second son, Chileab, is not mentioned again and perhaps died young; Absalom, the third, was now the heir to the throne. He stayed there three years ([[2 Sam. 13:38]]). The last verse of chapter 13 is obscure in Hebrew and has been read in almost opposite ways: in the King James, David's soul “longed to go forth unto Absalom” ([[2 Sam. 13:39]]).

  This chapter brings Absalom home. The one who contrives it is Joab, the son of David's sister Zeruiah and the captain of his army. His means is the one Nathan used: a case laid before the king for judgment, as though it had really happened, so that the king decides it before he sees that it is about himself (the note at [[2 Sam. 12:1]]). The next chapter shows what Absalom made of his return ([[2 Sam. 15:6]]).

thread: |
  Joab brings Absalom home by a story. A woman lays a made-up case before David, wins his oath that her son will live, and then shows him that he has judged his own case: once again David is “caught in a trap of his own making.” At the center of her plea is a claim about God: we all die, like water spilt on the ground, but God does not take away life; He devises means so that the banished one is not expelled from Him (verse 14). Since God Himself sets the example of mercy, David should be reconciled to his son “before it is too late.”

  David yields only in part. He lets Absalom return but does not restore him to the court or to his place as a prince, and for two years Absalom does not see his father's face. Then he burns Joab's field to get a hearing, demands to see the king or be put to death, and receives the king's kiss without having asked for pardon. Restored to favor, he will use his place to plot against his father: Joab “arranges for Absalom's return, but the beautiful Absalom conspires against his father.”

sections:
  - range: 1-3
    heading: Joab sends to Tekoah
    plain: |
      Joab the son of Zeruiah saw how the king's heart stood toward Absalom. So he sent to Tekoah and brought a wise woman from there. “Pretend to be in mourning,” he told her. “Put on mourning clothes and do not anoint yourself with oil; act like a woman who has mourned a long time for someone who died. Then go to the king and speak to him like this.” And Joab told her what to say.
  - range: 4-11
    heading: The widow's case
    plain: |
      The woman of Tekoah went in to the king, fell on her face to the ground, bowed low and said, “Help, O king!” “What is the matter?” the king asked. She answered, “I am a widow; my husband is dead. Your servant had two sons. They quarreled out in the field, and there was no one to separate them, and one struck the other and killed him. Now the whole family has risen against your servant. They say, ‘Hand over the man who killed his brother, so that we may put him to death for his brother's life,’ and so they would destroy the heir as well. They would put out the one live coal I have left, and leave my husband neither name nor descendant on the earth.”

      The king said to the woman, “Go home; I will give orders concerning you.” The woman of Tekoah said, “My lord the king, let the guilt be on me and on my father's house, and let the king and his throne be guiltless.” The king said, “If anyone says anything to you, bring him to me, and he will not trouble you again.” She said, “Then let the king remember the LORD your God, so that the avenger of blood may not destroy any more, and my son not be destroyed.” He said, “As the LORD lives, not one hair of your son's head shall fall to the ground.”
  - range: 12-20
    heading: The king judged in his own case
    plain: |
      Then the woman said, “Let your servant speak one more word to my lord the king.” “Speak,” he said. The woman said, “Why then have you planned such a thing against the people of God? In saying this, the king has condemned himself, because the king does not bring home his own banished son. We must all die; we are like water spilt on the ground, which cannot be gathered up again. But God does not take away life; He devises means so that the one who is banished is not cast out from Him.

      “I have come to say this to my lord the king because the people have made me afraid. Your servant thought, ‘I will speak to the king; perhaps the king will do what his servant asks. The king will hear, and save his servant from the man who would cut off both me and my son from the inheritance of God.’ Your servant thought, ‘The word of my lord the king will give me rest,’ for my lord the king is like an angel of God in hearing good and evil. The LORD your God be with you!”

      The king answered the woman, “Do not hide from me what I am about to ask you.” “Let my lord the king speak,” she said. The king said, “Is the hand of Joab with you in all this?” The woman answered, “As surely as you live, my lord the king, no one can turn to the right or to the left from anything my lord the king has said. Yes, it was your servant Joab who sent me, and he put all these words in your servant's mouth. Your servant Joab did this to put a different face on the matter. But my lord is wise, with the wisdom of an angel of God, to know everything that happens in the land.”
  - range: 21-24
    heading: Absalom brought home
    plain: |
      The king said to Joab, “Very well, I grant it. Go and bring back the young man Absalom.” Joab fell on his face to the ground, bowed, and blessed the king. “Today your servant knows that I have found favor in your sight, my lord the king,” he said, “because the king has granted his servant's request.” So Joab went to Geshur and brought Absalom to Jerusalem. But the king said, “Let him go to his own house; he is not to see my face.” So Absalom went to his own house and did not see the king's face.
  - range: 25-27
    heading: Absalom
    plain: |
      In all Israel no one was so praised for his good looks as Absalom; from the sole of his foot to the crown of his head there was no blemish in him. When he cut his hair (he cut it at the end of every year, because it grew heavy on him), he weighed it, and it came to two hundred shekels by the king's weight. Three sons were born to Absalom, and one daughter named Tamar, a beautiful woman.
  - range: 28-33
    heading: The king kisses Absalom
    plain: |
      Absalom lived two full years in Jerusalem without seeing the king's face. He sent for Joab, to send him to the king, but Joab would not come; he sent a second time, and still Joab would not come. So Absalom told his servants, “Joab's field is next to mine, and he has barley in it. Go and set it on fire.” And Absalom's servants set the field on fire.

      Then Joab came to Absalom at his house and said, “Why have your servants set my field on fire?” Absalom answered, “I sent word to you: ‘Come here, so that I can send you to the king to ask, “Why did I come back from Geshur? It would have been better for me to stay there.”’ Now let me see the king's face, and if there is any guilt in me, let him put me to death.” Joab went to the king and told him. The king called for Absalom, and he came to the king and bowed with his face to the ground before him, and the king kissed Absalom.

notes:
  - ref: 1
    phrase: the king’s heart was toward Absalom
    kind: words
    title: Toward Absalom, or against him?
    body: |
      The Hebrew of this line can be read two ways, and the choice changes how the chapter reads. It has no verb, only the heart of the king *ʿal* Absalom. The King James takes the preposition as “toward,” and a modern translation has “the king's heart went out to Absalom.” A Latter-day Saint reading of the story takes it so: when Absalom fled, “David yearns for reconciliation,” and Joab arranges the return. On that reading political and judicial reasons held David back from what his affection wanted, and Joab's scheme gave him the excuse he needed.

      One older reading takes *ʿal* in its usual sense, “against,” as in the only other place the phrase occurs, “his heart shall be against the holy covenant” ([[Dan. 11:28]]). It asks why, if David longed for his son, Joab needed a stratagem, and why the king then refused for two whole years to see him (verses 24, 28). The verse before this one raises the same question (the note at [[2 Sam. 13:39]]). On either reading, the rest of the chapter shows a king who has to be talked into his son's return and then keeps him at a distance.
    sources: [oshb-wlc, esv, taggart-sworn-david, cambridge-1-samuel, keil-1-samuel]

  - ref: 2
    phrase: fetched thence a wise woman
    kind: history
    title: Joab and the wise woman of Tekoah
    body: |
      The man who contrives Absalom's return is Joab, the “eldest son of Zeruiah, David's sister, and captain of David's army,” the king's “resourceful and ruthless military commander and nephew.” For the part he chose a “wise woman” from Tekoah, the town later remembered as the home of the prophet Amos, “among the herdmen of Tekoa” ([[Amos 1:1]]). The skill in the telling was hers; the words were his. He “put the words in her mouth” (verse 3), dressed her as a widow long in mourning, her face unanointed, and she admitted it when David asked (verse 19).

      Why Joab troubled himself the text does not say. What it does tell is how the two men's story ended: when Absalom rebelled and hung by his head in an oak, it was Joab who killed him ([[2 Sam. 18:14]]), and after David's death Joab backed Adonijah for the throne and was put to death by Solomon ([[1 Kgs. 2:28–34]]).
    sources: [bd-joab, taggart-sworn-david, bd-absalom, lds-scriptures]

  - ref: 13
    phrase: the king doth speak this thing as one which is faulty
    kind: history
    title: The king judged in his own case
    body: |
      The woman's story was built so that David would rule on it before he saw that it was about himself. Her husband is dead, and one of her two sons has killed the other in a quarrel in the field with no one to part them. The clan demands the killer's life by the right of the “revengers of blood,” the next of kin bound to avenge a relative's death (verse 11; [[Num. 35:19]]; the note at [[2 Sam. 3:27]]). If they take him, they “quench my coal which is left”: the surviving son is the last ember of her husband's house, and to put it out means “destroying all hope of posterity.” She kept her real intent disguised “until she had committed the king to a benevolent course of action,” pressing him from a promise (verse 8) to a guarantee (verse 10) to an oath by the LORD (verse 11) before she asked one word more.

      Then she turned the case on him. “As one which is faulty” means as one guilty; a modern translation has “in giving this decision the king convicts himself.” He has spared a widow's son who killed his brother, and he does not “fetch home again his banished.” Only then did she suggest that David “should be as merciful to his own son as he would be to her son.” The likeness was not exact: her son killed in a quarrel, while Absalom's killing of Amnon had been “determined from the day that he forced his sister” ([[2 Sam. 13:32]]). It is the method of Nathan's parable (the note at [[2 Sam. 12:1]]), and David saw through it: “Is not the hand of Joab with thee in all this?” (verse 19).
    sources: [ot-manual-2-samuel-13, esv, lds-scriptures]

  - ref: 14
    phrase: yet doth he devise means, that his banished be not expelled from him
    kind: words
    title: God devises means for the banished
    body: |
      The woman's plea turns from the king to God, and here the King James obscures the Hebrew. “Neither doth God respect any person” renders *wĕlōʾ yiśśāʾ ʾĕlōhîm nepeš*, and that rendering “cannot be defended”: the words mean that God does not take away a life (*nepeš*). A modern translation has “But God will not take away life, and he devises means,” so that the banished one is not left an outcast. “Devise means” is literally “thinketh thoughts” (*ḥāšab maḥăšābôt*), the verb she has just used of the king, who “thought such a thing against the people of God” (verse 13).

      The argument runs in two steps. Life is short and cannot be recovered, like water spilt on the ground: David may soon learn that with Absalom, if he leaves him in exile. And God does not act as David is acting; He spares the sinner and does not cast him off for ever. Though put in general terms, the words carry “a pointed allusion” to David himself, whose life God spared when he deserved death for adultery and murder ([[2 Sam. 12:13]]). The words were Joab's, put in her mouth for his purpose; the Church's footnote at “expelled” still files them under the mercy of God.
    sources: [oshb-wlc, cambridge-1-samuel, keil-1-samuel, esv, lds-scriptures]

  - ref: 26
    phrase: he weighed the hair of his head at two hundred shekels
    kind: history
    title: Absalom’s hair
    body: |
      The narrator stops the story to describe Absalom: no one in Israel was so praised for his beauty, with no blemish from head to foot (verse 25), and his hair was so thick that once a year he had it “polled,” that is, thinned “by means of combing or cutting.” The description is probably here because Absalom's hair “seems to have played a part in his death,” when “his head caught hold of the oak” ([[2 Sam. 18:9]]).

      The weight is a puzzle. Just how much two hundred shekels by the king's weight comes to is not clear, and the number “may either be incorrect or an exaggeration of the total weight for literary purposes.” The Septuagint, the ancient Greek translation, has the same figure, “two hundred shekels according to the royal shekel,” so it offers no other number.
    sources: [ot-manual-2-samuel-13, lxx-rahlfs]

  - ref: 33
    phrase: the king kissed Absalom
    kind: history
    title: The king kissed Absalom
    body: |
      The reconciliation came only when Absalom forced it. David had let him come home but not see his face (verse 24), and he lived two full years in Jerusalem in his own house (verse 28). Joab, who had pleaded for his return (verse 22), would not come when Absalom twice sent for him, so Absalom had his servants set Joab's barley on fire, and Joab came. The message Absalom sent the king asked for no pardon: let me see the king's face, “and if there be any iniquity in me, let him kill me” (verse 32). He bowed to the ground before the king, and David kissed him.

      The kiss ended nothing. In the next chapter the restored prince stands by the gate and “stole the hearts of the men of Israel” ([[2 Sam. 15:6]]): Joab arranged the return, “but the beautiful Absalom conspires against his father.”
    sources: [taggart-sworn-david]

christ: |
  The woman of Tekoah spoke Joab's words, but what she said of God describes what He had done for David: He spared a life that was forfeit and devised “a plan to bring him to repentance and so restore him to His presence.” The king's kiss in verse 33, a pledge of reconciliation, stands beside the father's in the Savior's parable, who saw his son “a great way off, … and ran, and fell on his neck, and kissed him” ([[Luke 15:20]]). The Lord forgives the one who repents and remembers his sins “no more” ([[D&C 58:42]]), and of His disciples He requires “to forgive all men” ([[D&C 64:10]]): not in part, as David forgave Absalom.

explore: |
  - **Cases laid before a king.** [[2 Sam. 12:1–7]], Nathan's parable; [[1 Kgs. 20:35–43]], the prophet who disguised himself so that Ahab would pass sentence on himself.
  - **What the return led to.** [[2 Sam. 15:1–12]], Absalom at the gate; [[2 Sam. 18:5–15]], his death.
  - **A study.** A Religious Studies Center essay on the covenant with David as the LORD's *ḥesed* follows David through Absalom's return and revolt to his need of mercy.

