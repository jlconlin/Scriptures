chapter: 15
title: Absalom Stole the Hearts of the Men of Israel
tagline: Absalom wins the people at the city gate, has himself proclaimed king in Hebron, and draws Ahithophel to his side; David leaves Jerusalem on foot and weeping, sends the ark back, and sends his friend Hushai back to defeat Ahithophel's counsel.
when: 'After forty years'

setting: |
  Absalom was David's third son, born in Hebron to Maacah, the daughter of Talmai king of Geshur ([[2 Sam. 3:3]]). After he had his brother Amnon killed for the wrong done to their sister Tamar, he fled to Geshur and stayed there three years ([[2 Sam. 13:37–38]]). Joab brought him home, but he lived two full years in Jerusalem without seeing the king's face; when at last David received him, he kissed him ([[2 Sam. 14:28]]; [[2 Sam. 14:33]]). This chapter opens “after this.”

  Nathan had told David that the LORD would “raise up evil against thee out of thine own house” ([[2 Sam. 12:11]]), and the note at [[2 Sam. 12:10]] follows that sentence through the book, Absalom's rising among it. The revolt fills chapters 15–19: the flight, Absalom in Jerusalem, the battle, Absalom's death and David's return. For a while the aging king goes back to the life of exile he had known under Saul.

  The title of Psalm 3 sets that psalm “when he fled from Absalom his son,” and the site reads it beside this chapter ([[Ps. 3:0]]).

thread: |
  Absalom wins the kingdom with a kiss, and David leaves it in tears. In the first twelve verses the son does what, by his own account, his father has stopped doing: he rises early, stands at the gate, hears every man's cause, and lifts up the man who bows to him. “So Absalom stole the hearts of the men of Israel” (verse 6), and from Hebron the conspiracy grows “continually.”

  The rest of the chapter is David going out of the city, and it moves at the pace of a procession. The king halts while his household, his guard and six hundred men from Gath pass before him. He tries to send home a foreigner who owes him nothing, and the foreigner swears to stay. He sends the ark back to Jerusalem, and with it his own future: “let him do to me as seemeth good unto him.” He climbs the Mount of Olives weeping, barefoot, with his head covered. He prays one line against Ahithophel's counsel, and at the top of the mount sends Hushai back to defeat it. The chapter ends with two men entering Jerusalem at once, David's friend and David's son.

sections:
  - range: 1-6
    heading: Absalom at the gate
    plain: |
      Some time after this, Absalom provided himself with a chariot and horses, and fifty men to run ahead of him. He would get up early and stand beside the road into the city gate. Whenever a man came with a dispute for the king to judge, Absalom called him over and asked, “What town are you from?” The man would answer, “Your servant is from one of the tribes of Israel.” Then Absalom would say to him, “Look, your case is good and right, but the king has appointed no one to hear you.” And he would add, “If only I were made judge in the land! Then anyone with a suit or a cause could come to me, and I would see that he got justice.”

      Whenever a man came near to bow down to him, Absalom reached out his hand, took hold of him, and kissed him. He did this with all Israel who came to the king for judgment. So Absalom stole the hearts of the men of Israel.
  - range: 7-12
    heading: The vow at Hebron
    plain: |
      After forty years (four, in some ancient versions; see the note), Absalom said to the king, “Please let me go to Hebron and pay the vow I made to the LORD. When I was living in Geshur in Syria, your servant made a vow: ‘If the LORD will indeed bring me back to Jerusalem, I will serve the LORD.’” The king said, “Go in peace.” So he went to Hebron.

      But Absalom sent secret messengers through all the tribes of Israel to say, “As soon as you hear the sound of the trumpet, say, ‘Absalom reigns in Hebron.’” Two hundred men from Jerusalem went with him as invited guests; they went innocently and knew nothing of the plan. While he was offering the sacrifices, Absalom sent for Ahithophel the Gilonite, David's counselor, from his town of Giloh. The conspiracy grew strong, and the people with Absalom kept increasing.
  - range: 13-18
    heading: The king goes out
    plain: |
      A messenger came to David and said, “The hearts of the men of Israel have gone after Absalom.” David said to all his servants who were with him in Jerusalem, “Get up, and let us flee, or none of us will escape from Absalom. Leave quickly, or he will soon overtake us, bring disaster on us, and put the city to the sword.” The king's servants answered, “Your servants are ready to do whatever my lord the king decides.”

      So the king set out with his whole household following him, but he left ten concubines to look after the house. The king went out with all the people following him, and they stopped at a place some distance off. All his servants passed by beside him, and all the Cherethites, the Pelethites, and the six hundred Gittites who had followed him from Gath marched on ahead of the king.
  - range: 19-22
    heading: Ittai the Gittite
    plain: |
      Then the king said to Ittai the Gittite, “Why are you coming with us too? Go back and stay with the king, for you are a foreigner, and an exile from your own home as well. You came only yesterday; should I make you wander about with us today, when I go wherever I can? Go back, and take your brothers with you. May mercy and truth be with you.”

      But Ittai answered the king, “As the LORD lives, and as my lord the king lives, wherever my lord the king may be, whether for death or for life, there your servant will be.” David said to Ittai, “Go on, then, and cross over.” So Ittai the Gittite crossed over with all his men and all the little ones who were with him.
  - range: 23-29
    heading: The ark sent back
    plain: |
      The whole countryside wept aloud as all the people passed by. The king crossed the brook Kidron, and all the people crossed toward the road to the wilderness. Zadok was there too, and all the Levites with him, carrying the ark of the covenant of God. They set the ark down, and Abiathar went up, until all the people had finished leaving the city.

      Then the king said to Zadok, “Carry the ark of God back into the city. If I find favor in the eyes of the LORD, He will bring me back and let me see both it and the place where it dwells. But if He says, ‘I have no delight in you,’ here I am; let Him do to me whatever seems good to Him.” The king also said to Zadok the priest, “Are you not a seer? Go back to the city in peace, and your two sons with you, Ahimaaz your son and Jonathan the son of Abiathar. I will wait in the plains of the wilderness until word comes from you to tell me what is happening.” So Zadok and Abiathar carried the ark of God back to Jerusalem and stayed there.
  - range: 30-37
    heading: The ascent of Olivet
    plain: |
      David went up the ascent of the Mount of Olives, weeping as he went, with his head covered and his feet bare. All the people with him covered their heads too, and went up weeping as they climbed. Someone told David, “Ahithophel is among the conspirators with Absalom.” And David said, “O LORD, I pray Thee, turn the counsel of Ahithophel into foolishness.”

      When David reached the top of the mount, where God was worshipped, Hushai the Archite came to meet him with his coat torn and earth on his head. David said to him, “If you go on with me, you will be a burden to me. But if you go back to the city and say to Absalom, ‘I will be your servant, O king; as I have been your father's servant in the past, so now I will be yours,’ then you can defeat Ahithophel's counsel for me. Zadok and Abiathar the priests will be there with you; tell them whatever you hear from the king's house. Their two sons are there with them, Ahimaaz son of Zadok and Jonathan son of Abiathar; send me word by them of everything you hear.” So Hushai, David's friend, came into the city just as Absalom was entering Jerusalem.

notes:
  - ref: 6
    phrase: so Absalom stole the hearts of the men of Israel
    kind: history
    title: How Absalom stole hearts
    body: |
      Absalom won the people by playing the king and the judge at once, in a kingdom where, he told them, no one would hear them. He began with the show of royalty, a chariot and horses and fifty runners (verse 1), “a full royal procession.” Then he took his place by the city gate, the normal place for giving judgment in the ancient world, and met each man with a complaint before he reached the king: your cause is good, but the king has deputed no one to hear it; if only I were judge, you would have justice. When a man bowed to him, he lifted him up and kissed him, treating him as an equal, “highly unusual behavior from royalty.” It was “a deceitful campaign to gain favor with the people,” and “stole” is the plain verb of theft (*gānab*), in a form that means “steal away”: Absalom took for himself the loyalty of men who had come to the king.

      Whether Absalom's charge against the king's court was true, the text does not say. It may have been a lie, but “it is more likely that David's court was not functioning properly and that the people were being neglected.” An older list of reasons for the people's going over names David's age or affliction, Joab's overgrown power and the partisans of Saul who remained, and among them a cause in plain terms: David “was under the displeasure of the Almighty, for his adultery with Bath-sheba, and his murder of Uriah.”
    sources: [ot-manual-2-samuel-13, bdb]

  - ref: 7
    phrase: after forty years
    kind: words
    title: Forty years, or four?
    body: |
      The Hebrew reads “forty years,” and so does the Greek translation, but the number is hard to fit. Absalom was born in Hebron after David began to reign there ([[2 Sam. 3:2–3]]), and David's whole reign was forty years ([[2 Sam. 5:4]]), so forty years fits neither Absalom's life nor the reign, and there is no obvious date to count them from. The Syriac and the Latin Vulgate read “four years,” which one older reading judges “must certainly be the correct one,” counted from Absalom's reconciliation with his father ([[2 Sam. 14:33]]). Modern translations follow it: “at the end of four years.” On that reading Absalom spent the four years preparing his conspiracy.

      Hebron made the request seem natural, since it was Absalom's birthplace. It was also where David had first been anointed king ([[2 Sam. 2:4]]), and it was there that Absalom's messengers proclaimed “Absalom reigneth in Hebron” (verse 10). A vow to “serve the LORD” meant a sacrifice, and the days of sacrifice gave his supporters time to gather (verse 12).
    sources: [oshb-wlc, lxx-rahlfs, keil-1-samuel, cambridge-1-samuel, esv, nrsvue, lds-scriptures]

  - ref: 21
    phrase: whether in death or life, even there also will thy servant be
    kind: history
    title: Ittai the Gittite
    body: |
      The man who swears this oath is a Philistine. A Gittite is a man of Gath, one of the five cities of the Philistines and the home of Goliath, and the six hundred men of verse 18 “came after him from Gath.” Ittai had joined David only lately (“thou camest but yesterday”) and was, David says, “a stranger, and also an exile.” So David, himself now leaving his city, offers him a way out without dishonor: go back, “abide with the king,” take your brethren, and “mercy and truth be with thee.”

      Ittai answers with an oath by the LORD and by the king's life that he will be wherever the king is, in death or in life. David lets him cross with all his men and their little ones. He is no passing figure: in the battle three chapters later he commands a third of David's army, beside Joab and Abishai ([[2 Sam. 18:2]]).
    sources: [bd-gath, lds-scriptures]

  - ref: 26
    phrase: let him do to me as seemeth good unto him
    kind: history
    title: Why the king left the city, and the ark
    body: |
      David's flight looks out of character, and the text lets him give his reason: to get out before Absalom came on them suddenly and put the city to the sword (verse 14). His actions suggest that fear was not the whole of it. One older reading points out that Jerusalem was strong and that he still had his Cherethites and Pelethites and the six hundred Gittites, and finds the reason elsewhere: “he appears to take all as coming from the hand of God; therefore he humbles himself, weeps, goes barefoot, and covers his head!” and does not even hurry, “for the habit of mourners is not the habit of those who are flying before the face of their enemies.”

      His words over the ark put the outcome in the LORD's hands. Zadok and the Levites carried it out of the city with him, and David sent it back; whether he saw it again was for the LORD to decide: if he found favor, the LORD would bring him back to see “it, and his habitation”; if not, “behold, here am I.” A Latter-day Saint reading looks at the same scene from the other side, at what the king has lost: the once powerful David “now seems to be blown about at the mercy of the winds of others' agency.”
    sources: [ot-manual-2-samuel-13, taggart-sworn-david, lds-scriptures]

  - ref: 27
    phrase: Art not thou a seer?
    kind: words
    title: Art not thou a seer?
    body: |
      Translations divide over whether David asks Zadok a question about being a seer or simply tells him to go back to the city. The Hebrew has *rōʾeh*, “seer,” from the verb “to see,” and with the vowel marks the Hebrew text now carries it reads as a question, which the King James keeps: “Art not thou a seer?” Read that way, David calls the priest by the older name for a prophet ([[1 Sam. 9:9]], where the note explains it).

      The older commentaries find the question awkward and mend it in two ways. One gives the same consonants different vowels and reads the word as an address, “Thou seer!”, and takes it of Zadok as the high priest who received revelation by the Urim: “Thou Zadok art equal to a prophet; therefore thy proper place is in Jerusalem.” The other finds “no trace of such a use of the term elsewhere” and prefers the Greek translation, which with a small change reads “Behold, thou shalt return to the city in peace.” Modern translations divide the same way: one keeps the seer and the question, another reads “Look, go back to the city in peace.” The verse is counted among the biblical witnesses that seers “had a presence in Israel's society.”

      On every reading David's errand for Zadok is the same: go back to the city, and send word by your sons (verses 28, 35–36).
    sources: [oshb-wlc, keil-1-samuel, cambridge-1-samuel, lxx-rahlfs, esv, nrsvue, sc-knowhy-86]

  - ref: 30
    phrase: had his head covered, and he went barefoot
    kind: symbol
    title: Barefoot, with his head covered
    body: |
      David went up the Mount of Olives as a mourner, and all the people with him mourned as well. A covered head is the mark of grief elsewhere in scripture. The footnote to this verse points to Haman, who “hasted to his house mourning, and having his head covered” ([[Esth. 6:12]]), and when Absalom is dead “the king covered his face” ([[2 Sam. 19:4]]). Bare feet go with mourning too: when the LORD forbade Ezekiel to mourn his wife, He told him, “make no mourning for the dead … and put on thy shoes upon thy feet” ([[Ezek. 24:17]]).

      The way led across the Kidron, the stream bed between Jerusalem and the Mount of Olives (verse 23), and up the hill east of the city. Psalm 3 is titled for this flight, and the note on [[Ps. 3:3]] sets this verse beside the psalm's “lifter up of mine head”: the king went up with his head covered, and the LORD is the one who lifts it.
    sources: [lds-scriptures, bd-kidron, bd-olives-mount-of]

  - ref: 31
    phrase: turn the counsel of Ahithophel into foolishness
    kind: history
    title: Ahithophel's counsel
    body: |
      Ahithophel's going over mattered because of what his counsel was worth. He was “David's counsellor” (verse 12), and his counsel in those days was taken “as if a man had inquired at the oracle of God” ([[2 Sam. 16:23]]). Reading [[2 Sam. 11:3]] (“the daughter of Eliam”) with [[2 Sam. 23:34]] (“Eliam the son of Ahithophel the Gilonite”) makes him Bath-sheba's grandfather. The text never says whether that weighed with him.

      David meets the news with a prayer of one line, and the story records its answer two chapters later. Absalom and his men prefer Hushai's advice to Ahithophel's, “For the LORD had appointed to defeat the good counsel of Ahithophel” ([[2 Sam. 17:14]]), and Ahithophel goes home, sets his house in order, and hangs himself ([[2 Sam. 17:23]]). Psalms 41 and 55 lament a trusted friend turned enemy; the notes on [[Ps. 41:9]] and [[Ps. 55:12]] give the older reading that finds Ahithophel there.
    sources: [bd-ahithophel, lds-scriptures]

  - ref: 37
    phrase: Hushai David’s friend
    kind: words
    title: David's friend
    body: |
      “David's friend” is a title as well as a description. In Hebrew “the king's friend” (*rēʿeh hammelek*) is a technical term for a place at court: Zabud held it under Solomon ([[1 Kgs. 4:5]]), and in the list of David's officers Hushai is “the king's companion” (there the shorter form *rēaʿ*), named next to Ahithophel, “the king's counsellor” ([[1 Chr. 27:33]]). The two men set against each other in this chapter had stood side by side at David's court.

      David sends his friend back to play the turncoat, to say to Absalom “I will be thy servant, O king” (verse 34), and to pass what he hears to the priests' sons. Absalom will throw the title at him: “Is this thy kindness to thy friend?” ([[2 Sam. 16:17]]).
    sources: [bdb, lds-scriptures]

christ: |
  The brook David crossed in tears is the one Jesus crossed on the night He was betrayed: He “went forth with his disciples over the brook Cedron, where was a garden” ([[John 18:1]]), the garden of Gethsemane on the western side of the Mount of Olives. One older reading takes John's single mention of the brook as perhaps “designed to recall the present occasion,” setting David fleeing the city beside “Christ leaving the city which had rejected Him,” with Judas as the counterpart of Ahithophel. David, a man wounded by his own folly, put his future in the LORD's hands, “here am I, let him do to me as seemeth good unto him,” at a time when “he needs the Lord's ḥesed more than ever.” The disciple who suffers what his own choices set in motion has the same recourse, the mercy of the Lord.

explore: |
  - **The psalm of the flight.** [[Ps. 3:1–8]], with its title; the site also reads [[Ps. 63:1–11]] in the wilderness of this flight, on one older reading.
  - **The rest of the road.** Ziba and Shimei on the far side of the mount ([[2 Sam. 16:1–14]]); the two counsels ([[2 Sam. 17:1–23]]); the king brought back over the Jordan ([[2 Sam. 19:9–15]]).
  - **The betrayed friend.** [[Ps. 41:9]] and [[John 13:18]]; [[Ps. 55:12–14]].

