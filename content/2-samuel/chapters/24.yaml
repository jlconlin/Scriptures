chapter: 24
title: That Which Doth Cost Me Nothing
tagline: David numbers Israel against Joab's counsel, confesses, and chooses to fall into the LORD's hand; a pestilence sweeps the land until the angel is stayed at Jerusalem, and David buys Araunah's threshing floor and builds an altar there.
when: 'After the three years of famine, late in David’s reign'

setting: |
  The chapter gives no date, but several signs place it late in David's reign. Its first words, “again the anger of the LORD was kindled,” look back to the three years of famine in [[2 Sam. 21:1]]; Joab could hardly have spent nearly ten months on a census except in a time of settled peace; and Chronicles tells of David's preparations for the temple straight after he buys the threshing floor.

  Chronicles tells the whole story again in [[1 Chr. 21:1–30]], and a reader of the footnotes meets its differences verse by verse: Satan, not the LORD, moves David (verse 1); the totals differ (verse 9); the famine offered is three years, not seven (verse 13); and the price paid “for the place” is six hundred shekels of gold (verse 24). Its next chapter names the threshing floor as the site of the temple. The law's census and the ransom it required are explained at [[Ex. 30:12]].

  Gad, who brings the LORD's word here, is the seer who had counseled David since his days as a fugitive ([[1 Sam. 22:5]]). This is the last chapter of the book; the story of David's old age and death goes on in [[1 Kgs. 1:1]].

thread: |
  A king counts his fighting men, and the LORD counts it a sin. Joab warns him, the count goes on for nearly ten months, and when the totals come in, “David's heart smote him”: he confesses before any prophet has spoken (verse 10). The LORD's answer is a choice of three judgments, and David chooses the one that comes straight from the LORD, because “his mercies are great.” The pestilence runs from Dan to Beer-sheba; at Jerusalem the angel's hand is stayed; and David, seeing the angel, asks that the blow fall on him and his father's house instead of on “these sheep.”

  The remedy comes through the same prophet who brought the sentence: an altar on Araunah's threshing floor. David will not take the place as a gift, buys it, offers there, and the plague stops. The ground is the ground on which Solomon would build the temple ([[2 Chr. 3:1]]). The census is one of the places in David's story where the LORD “ostensibly reacts harshly”; “yet the persistent thread of the narrative reveals God's loyalty to David and his descendants.”

sections:
  - range: 1-9
    heading: The numbering of Israel and Judah
    plain: |
      Once again the LORD's anger burned against Israel, and he stirred David up against them, saying, “Go, count Israel and Judah.” So the king said to Joab, the commander of the army who was with him, “Go through all the tribes of Israel, from Dan to Beer-sheba, and count the people, so that I may know how many there are.”

      Joab said to the king, “May the LORD your God multiply the people a hundred times over, however many they are, and may my lord the king live to see it. But why does my lord the king want to do this?” Yet the king's word overruled Joab and the army's commanders, and they left the king's presence to count the people of Israel.

      They crossed the Jordan and camped at Aroer, on the right side of the town that lies in the middle of the river of Gad, toward Jazer. Then they went to Gilead and the land of Tahtim-hodshi, to Dan-jaan and around toward Sidon, to the fortress of Tyre and all the towns of the Hivites and Canaanites, and out to the south of Judah at Beer-sheba. When they had gone through the whole land, they came back to Jerusalem after nine months and twenty days. Joab gave the king the total: in Israel there were 800,000 able men who could draw the sword, and in Judah 500,000.
  - range: 10-14
    heading: Three things offered
    plain: |
      After he had counted the people, David's conscience struck him. He said to the LORD, “I have sinned greatly in what I have done. Now, LORD, I beg you, take away your servant's guilt, for I have acted very foolishly.”

      When David got up in the morning, the word of the LORD had come to the prophet Gad, David's seer: “Go and tell David, ‘This is what the LORD says: I am offering you three things. Choose one of them, and I will do it to you.’” So Gad came to David and told him: “Shall seven years of famine come on your land? Or will you flee three months before your enemies while they pursue you? Or shall there be three days of pestilence in your land? Now think it over and decide what answer I should give to the One who sent me.”

      David said to Gad, “I am in great distress. Let us fall into the hand of the LORD, for his mercies are great; but do not let me fall into the hand of man.”
  - range: 15-17
    heading: The pestilence and the angel
    plain: |
      So the LORD sent a pestilence on Israel from that morning until the appointed time, and seventy thousand of the people died, from Dan to Beer-sheba. When the angel stretched out his hand over Jerusalem to destroy it, the LORD repented of the evil and said to the angel who was destroying the people, “Enough! Now hold back your hand.” The angel of the LORD was then at the threshing floor of Araunah the Jebusite.

      When David saw the angel who was striking the people, he said to the LORD, “I am the one who has sinned and done wrong. But these sheep, what have they done? Let your hand, I pray, be against me and against my father's house.”
  - range: 18-25
    heading: The threshing floor of Araunah
    plain: |
      That day Gad came to David and said, “Go up and build an altar to the LORD on the threshing floor of Araunah the Jebusite.” So David went up, as Gad had said and as the LORD had commanded. Araunah looked out and saw the king and his servants coming toward him, and he went out and bowed with his face to the ground before the king. “Why has my lord the king come to his servant?” he asked. David said, “To buy the threshing floor from you, to build an altar to the LORD, so that the plague may be stopped from the people.”

      Araunah said to David, “Let my lord the king take it and offer whatever he thinks good. Here are oxen for the burnt offering, and the threshing sledges and the oxen's gear for wood.” All this Araunah offered to the king, as a king would, and he said to the king, “May the LORD your God accept you.”

      But the king said to Araunah, “No, I will buy it from you at a price. I will not offer burnt offerings to the LORD my God that cost me nothing.” So David bought the threshing floor and the oxen for fifty shekels of silver. David built an altar to the LORD there and offered burnt offerings and peace offerings. So the LORD heard the plea for the land, and the plague on Israel was stopped.

notes:
  - ref: 1
    phrase: he moved David against them
    kind: history
    title: Who moved David, the LORD or Satan?
    body: |
      The two tellings of the census name different instigators, and the Church's footnote reads the first in the light of the second. Samuel says that the anger of the LORD was kindled against Israel “and he moved David against them”; Chronicles says, “And Satan stood up against Israel, and provoked David to number Israel” ([[1 Chr. 21:1]]). The footnote to this verse judges that “apparently something is missing” from the text and that Satan should be the one meant by “he”; the Joseph Smith Translation makes no change here.

      Read that way, the verse no longer has the LORD moving David to the act He then punishes. It still says whom the LORD was angry with: Israel, not David alone, though it does not say what Israel had done. On one older reading, verse 1 shows that “the sin was the sin of the people as well as of David,” even though at verse 17 David asks that the blow fall on him alone.
    sources: [lds-scriptures, cambridge-1-samuel]

  - ref: 3
    phrase: but why doth my lord the king delight in this thing?
    kind: history
    title: Why was the census a sin?
    body: |
      The text never says what made the census wrong; it lets three voices call it sin. The narrator sets it under the LORD's anger (verse 1); Joab objects before it begins, and in Chronicles asks, “why will he be a cause of trespass to Israel?” ([[1 Chr. 21:3]]); and David confesses when it is done: “I have sinned greatly in that I have done … I have done very foolishly” (verse 10). What was counted was “valiant men that drew the sword” (verse 9): a reckoning of the king's strength for war.

      Why it was a sin is a matter of proposals. The law required a ransom from every man numbered, “that there be no plague among them,” and the site's note at [[Ex. 30:12]] weighs why. One answer looks to David's motive: “slackening in his piety and confidence toward God,” he was planning to extend his dominions “without the Divine counsel or command,” and wanted to know whether he had men enough. An older reading agrees and puts it more sharply. A census “could not in itself be a sinful act,” and the ransom law is not the point, since it concerned enrolling the people in the LORD's own army and David's census was a political measure; the kernel of the sin was “self-exaltation, inasmuch as he sought for the strength and glory of his kingdom in the number of the people and their readiness for war.” On both readings the sin lay in where the king put his trust.
    sources: [lds-scriptures, keil-1-samuel, ot-manual-2-samuel-13]

  - ref: 9
    phrase: there were in Israel eight hundred thousand valiant men that drew the sword
    kind: history
    title: One million three hundred thousand
    body: |
      The census's totals are very large for the land, and the two tellings of it do not agree. Samuel gives 800,000 men of Israel and 500,000 of Judah; Chronicles gives “a thousand thousand and an hundred thousand” for Israel and 470,000 for Judah ([[1 Chr. 21:5]]). Even the lower total, on one estimate, “would imply at least five million inhabitants,” nearly twice as many to the square mile as the most crowded countries of modern Europe.

      One explanation concerns how numbers were copied. The Hebrew word written *ʾlp* could mean an armed man as well as a thousand; a copyist who took each *ʾlp* for a thousand, with noughts added along the way, could produce both sets of figures from an original of about 120,000 men of military age, a nation of nearly half a million. It is offered as one of the methods by which “a very large proportion of the numerical difficulties can be resolved,” not as the text's own figure. The chapter gives its numbers as they stand, and so do these notes, the seventy thousand of verse 15 among them.
    sources: [lds-scriptures, ot-manual-large-numbers]

  - ref: 11
    phrase: the prophet Gad, David’s seer
    kind: history
    title: Gad, David’s seer
    body: |
      Gad had stood beside David since before he was king. He first appears telling the fugitive David to leave the stronghold and go into the land of Judah ([[1 Sam. 22:5]]); here he is called both prophet and seer, a title explained at [[1 Sam. 9:9]]. He was “a prophet and faithful friend and adviser of David”; Chronicles credits him with a book of David's acts ([[1 Chr. 29:29]]) and with a part in ordering the music of the house of God ([[2 Chr. 29:25]]).

      His errand here is double. He brings the sentence as a choice (verses 12–13), and the same day he brings the remedy, the command to build an altar (verse 18). David had already confessed before Gad came (verse 10); the word of the LORD came to the seer that morning.
    sources: [bd-gad, lds-scriptures]

  - ref: 14
    phrase: let us fall now into the hand of the LORD; for his mercies are great
    kind: history
    title: Why David chose the pestilence
    body: |
      David gives his own reason: he would rather fall into the hand of the LORD, “for his mercies are great,” than into the hand of man. Of the three, flight before enemies is plainly the hand of man; the pestilence the LORD sends Himself (verse 15). Chronicles draws the contrast in its own wording of the offer: “the sword of thine enemies” on one side, and on the other “the sword of the LORD, even the pestilence, in the land” ([[1 Chr. 21:12]]). David stakes the choice on the character of the One who would strike.

      The choices also run from longest to shortest: seven years, three months, three days. Chronicles has three years of famine instead of seven ([[1 Chr. 21:12]]), as the footnote at verse 13 points out; the chapter keeps its seven.
    sources: [lds-scriptures]

  - ref: 17
    phrase: but these sheep, what have they done?
    kind: christ
    title: These sheep
    body: |
      David answers the sight of the angel by taking the blame and asking that the blow fall on him and his father's house instead of on the people. He calls them “these sheep” as the shepherd the LORD had made him, taken “from following the sheep” to be ruler over His people ([[2 Sam. 7:8]]); the site explains that calling at [[Ps. 78:71]]. The image of David as shepherd recurs through his story and joined shepherd and king in Israel's imagination, and the prophets built their hope on it: in Ezekiel the LORD promises to “set up one shepherd over them … even my servant David” ([[Ezek. 34:23]]). When Jesus comes as the Good Shepherd ([[John 10:11]]), “he fulfills this messianic expectation of a king who feeds and cares for his people.”

      The essay [Would God I Had Died for Thee](/2-samuel/themes/died-for-thee/) follows this offer from the king's plea for his child to the Good Shepherd who lays down His life for the sheep.
    sources: [taggart-sworn-david, lds-scriptures]

  - ref: 18
    phrase: rear an altar unto the LORD in the threshingfloor of Araunah the Jebusite
    kind: history
    title: The threshing floor that became the temple
    body: |
      The place where the plague stopped became the place of the temple, and the LORD, not David, chose it. Gad brings the command, and David goes up “as the LORD commanded” (verse 19); with what Chronicles adds, the location of the temple was “given by revelation when the Lord saved Israel from destruction.” Araunah, whom Chronicles calls Ornan, was at work threshing wheat when the king came ([[1 Chr. 21:20]]).

      Chronicles carries the line forward. When the LORD answered David at the altar “from heaven by fire” ([[1 Chr. 21:26]]), David said, “This is the house of the LORD God, and this is the altar of the burnt offering for Israel” ([[1 Chr. 22:1]]), and Solomon built the temple “in mount Moriah, where the LORD appeared unto David his father, in the place that David had prepared in the threshingfloor of Ornan the Jebusite” ([[2 Chr. 3:1]]). By naming Moriah, the Chronicler linked Abraham's offering of Isaac “into the land of Moriah” ([[Gen. 22:2]]) with David's altar at the threshing floor and with the first temple. That the temple hill is the land of Moriah where Isaac was offered is a tradition first recorded by Josephus, and the site's note at [[Gen. 22:2]] weighs it.
    sources: [lds-scriptures, madsen-solomons-temple, pierce-ancestors, bd-moriah]

  - ref: 24
    phrase: neither will I offer burnt offerings unto the LORD my God of that which doth cost me nothing
    kind: history
    title: An offering that costs
    body: |
      Araunah offered everything as a gift: the floor, the oxen for the burnt offering, the threshing sledges and yokes for wood (verse 22), and in Chronicles “the wheat for the meat offering; I give it all” ([[1 Chr. 21:23]]). David's refusal carries its own reason: an offering that cost him nothing would not be his offering. He pays fifty shekels of silver for the floor and the oxen, builds the altar, offers burnt offerings and peace offerings, and only then does the chapter say that “the plague was stayed from Israel” (verse 25). Chronicles names a larger sum, six hundred shekels of gold, paid “for the place” ([[1 Chr. 21:25]]).

      A Latter-day Saint teacher reads the line as a rule for more than altars. Recalling it, he suggested that a sacrament meeting talk built of others' words had stirred little interest perhaps because “it had cost the speaker nothing,” and concluded, “We cannot teach what we do not understand, and we cannot understand that for which we have not paid a price.”
    sources: [lds-scriptures, mcconkie-stronger-testimonies]

christ: |
  David's altar stood, by the Chronicler's account, on mount Moriah ([[2 Chr. 3:1]]), where Abraham's offering of Isaac was performed “in the same area in which the Father would make the sacrifice of His Son”; the Book of Mormon calls that offering “a similitude of God and his Only Begotten Son” ([[Jacob 4:5]]), and the burnt offerings David bought were, like every such sacrifice, “a similitude of the sacrifice of the Only Begotten of the Father” ([[Moses 5:7]]). The risen Lord ended them: “your sacrifices and your burnt offerings shall be done away … And ye shall offer for a sacrifice unto me a broken heart and a contrite spirit” ([[3 Ne. 9:19–20]]). That is the offering a disciple brings now, in place of the burnt offerings David bought; what David's own repentance gained him is the subject of [[2 Sam. 12:13]].

explore: |
  - **Chronicles' telling.** [[1 Chr. 21:1–30]], with the angel's drawn sword over Jerusalem and the elders in sackcloth; [[1 Chr. 22:1]], the place named for the temple.
  - **The census in the law.** [[Ex. 30:11–16]]; [[Num. 1:1–3]].
  - **Moriah.** [[Gen. 22:1–14]]; [[2 Chr. 3:1]].
  - **David the shepherd.** [[Ps. 78:70–72]]; [[Ezek. 34:23–24]]; [[John 10:11–16]].

