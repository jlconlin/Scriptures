chapter: 12
title: Thou Art the Man
tagline: Nathan tells the king of a poor man's stolen lamb, lets him pass sentence, and turns the sentence on him; David confesses, the child dies, the LORD names Solomon, and Rabbah falls.
when: 'While Joab besieged Rabbah of the Ammonites'

setting: |
  Chapter 11 left David in Jerusalem while Joab and all Israel besieged Rabbah, the chief city of the Ammonites, whose ruins lie at modern Amman ([[2 Sam. 11:1]]). In those months David lay with Bath-sheba, the wife of Uriah the Hittite, arranged Uriah's death in the fighting at Rabbah, and took her as his wife when her mourning was past, and she bore him a son. The chapter closes on the narrator's verdict, which opens this one: “But the thing that David had done displeased the LORD” ([[2 Sam. 11:27]]). What the text says of Bath-sheba's part is at [[2 Sam. 11:4]].

  The LORD's answer comes through Nathan, the prophet who had brought David the promise of a house that would stand for ever ([[2 Sam. 7:4–17]]). The same prophet brings the judgment here and, at the end of David's life, anoints Bath-sheba's son Solomon king ([[1 Kgs. 1:45]]). David's fall gave occasion to Psalms 51 and 32; the title of Psalm 51 sets it at the time Nathan came to David ([[Ps. 51]]), and the site reads that psalm beside this chapter.

  The chapter ends where chapter 11 began, at the siege of Rabbah, with David himself taking the city.

thread: |
  Nathan does not accuse David; he asks him to judge. David hears of a rich man who took a poor man's only lamb and swears that “the man that hath done this thing shall surely die” before he learns that he is the man. The rest of the chapter works that sentence out. David will not die, but the child will (verses 13–14); and the sword that killed Uriah will not leave David's house, a sentence the rest of the book carries out scene by scene (the note at verse 10).

  Yet the chapter does not leave David a ruined man. He confesses in one sentence, pleads and fasts for the child, and when the child dies he rises, worships and comforts Bath-sheba. The LORD loves the next son and sends Nathan to name him. A Latter-day Saint reading of the story warns that “it is a mistake for us to say that David was a good man before the crime and a bad one after,” since his life afterward is “one of continuous penitence.” The last scene returns to the war David had stayed home from: Joab calls him to Rabbah, and he takes the city.

sections:
  - range: 1-6
    heading: The poor man's lamb
    plain: |
      The LORD sent Nathan to David. Nathan came to him and said, “There were two men in one city, one rich and the other poor. The rich man had a great many flocks and herds. The poor man had nothing but one little ewe lamb, which he had bought and raised. It grew up with him and with his children; it ate from his food and drank from his cup and slept in his arms, and it was like a daughter to him. A traveler came to the rich man, and he was unwilling to take one of his own flock or herd to prepare for the guest who had come to him. Instead he took the poor man's lamb and prepared it for his guest.”

      David burned with anger against the man. “As the LORD lives,” he said to Nathan, “the man who has done this deserves to die. He shall pay for the lamb four times over, because he did this and because he had no pity.”
  - range: 7-12
    heading: Thou art the man
    plain: |
      Nathan said to David, “You are the man. This is what the LORD God of Israel says: I anointed you king over Israel, and I delivered you from the hand of Saul. I gave you your master's house and your master's wives into your arms, and I gave you the house of Israel and of Judah; and if that had been too little, I would have given you much more besides. Why have you despised the commandment of the LORD by doing what is evil in His sight? You have struck down Uriah the Hittite with the sword and taken his wife to be your wife; you have killed him with the sword of the Ammonites.

      “Now therefore the sword shall never depart from your house, because you have despised me and taken the wife of Uriah the Hittite to be your wife. This is what the LORD says: I will raise up evil against you out of your own house. I will take your wives before your eyes and give them to your neighbor, and he shall lie with your wives in the sight of this sun. You did it in secret, but I will do this before all Israel and before the sun.”
  - range: 13-14
    heading: I have sinned against the LORD
    plain: |
      David said to Nathan, “I have sinned against the LORD.” Nathan said to David, “The LORD has put away your sin; you shall not die. But because by this deed you have given the enemies of the LORD great occasion to blaspheme, the child who is born to you shall surely die.”
  - range: 15-23
    heading: The child dies
    plain: |
      Nathan went home. The LORD struck the child that Uriah's wife had borne to David, and it became very sick. David pleaded with God for the child; he fasted, and went in and lay all night on the ground. The elders of his household stood over him to raise him from the ground, but he would not get up, and he would not eat with them.

      On the seventh day the child died. David's servants were afraid to tell him. “While the child was still alive,” they said, “we spoke to him and he would not listen to us. How can we tell him the child is dead? He may do himself harm.” But when David saw his servants whispering, he understood that the child was dead. “Is the child dead?” he asked. “He is dead,” they said.

      Then David got up from the ground, washed, anointed himself, changed his clothes, went into the house of the LORD and worshipped. Then he went to his own house, asked for food, and they set it before him and he ate. His servants said, “What is this you have done? You fasted and wept for the child while he was alive, but now that he is dead you get up and eat.” He answered, “While the child was still alive I fasted and wept, for I said, ‘Who knows? The LORD may be gracious to me, and the child may live.’ But now he is dead; why should I fast? Can I bring him back? I shall go to him, but he will not come back to me.”
  - range: 24-25
    heading: Solomon, called Jedidiah
    plain: |
      David comforted his wife Bath-sheba, went in to her and lay with her, and she bore a son, and he named him Solomon. The LORD loved him, and sent word by Nathan the prophet, who named him Jedidiah, because of the LORD.
  - range: 26-31
    heading: Rabbah taken
    plain: |
      Joab fought against Rabbah of the Ammonites and took the royal city. He sent messengers to David to say, “I have fought against Rabbah and have taken the city of waters. Now gather the rest of the army, besiege the city, and take it yourself, or I will take it and it will be named after me.” So David gathered all the army, went to Rabbah, fought against it and took it.

      He took the crown of their king from his head. It weighed a talent of gold and had precious stones in it, and it was set on David's head. He brought out a great quantity of plunder from the city. He brought out the people who were in it and put them to the saws, the iron harrows and the iron axes, and made them pass through the brickkiln; and he did the same to all the cities of the Ammonites. Then David and all the army returned to Jerusalem.

notes:
  - ref: 1
    phrase: And the LORD sent Nathan unto David
    kind: history
    title: Nathan sent to the king
    body: |
      Nathan came on the LORD's errand: he had no part in the events of chapter 11, so what he knew of David's deed was, on one Latter-day Saint reading, “certainly revealed to him by the Lord.” He was the prophet of David's court: he had brought the promise of chapter 7 ([[2 Sam. 7:4]]), he rebuked the king here, and he anointed Solomon at the end of David's life ([[1 Kgs. 1:45]]). In modern revelation the Lord calls him “Nathan, my servant” ([[D&C 132:39]]).

      His method carries the chapter. He does not begin with the charge; he lays a case before the king, two men in one city, and lets him judge it. The case is fitting whether it tells actual events or is a parable made for teaching. David answers as a king hearing a complaint, with an oath by the LORD's life and a sentence (verses 5–6), and only then does Nathan tell him whose case it was.
    sources: [ot-minute-2-samuel, bd-nathan, lds-scriptures]

  - ref: 3
    phrase: one little ewe lamb
    kind: symbol
    title: The one ewe lamb
    body: |
      Nathan lingers over the lamb as over nothing else in the story. The poor man bought it and raised it; it grew up with his children, ate his food, drank from his cup and lay in his bosom, “and was unto him as a daughter.” The details make the theft monstrous, and they make the lamb more than livestock.

      Read closely, the parts of the story answer to David's household. The rich man's “exceeding many flocks and herds” match the wives, concubines and children counted in [[2 Sam. 5:13–16]]; the poor man had one lamb, and the narrator gives Uriah one wife and mentions no children. Little is said of Bath-sheba's marriage, but her mourning for her husband suggests a real bond ([[2 Sam. 11:26]]). Nathan does not explain the parable. When he speaks plainly, the charge is laid on David alone: “thou hast killed Uriah the Hittite with the sword, and hast taken his wife to be thy wife” (verse 9).
    sources: [ot-minute-2-samuel, lds-scriptures]

  - ref: 6
    phrase: he shall restore the lamb fourfold
    kind: history
    title: Death, and fourfold
    body: |
      David's sentence has two parts, and only one of them is the law's. Fourfold restitution is what the law of Moses required of a man who stole a sheep and killed or sold it: “four sheep for a sheep” ([[Ex. 22:1]]). The law asks restitution for the theft, not the thief's life; in his anger David demanded “the harshest of punishments” as well, and swore to it by the LORD's life, because the man “had no pity.” The case also condemned him in a way he could not see: a lamb could be repaid four times over, but Uriah could not be restored at all.

      The death sentence comes back on the judge. Nathan tells David, “thou shalt not die” (verse 13), and then, in David's own words about the rich man, “the child also that is born unto thee shall surely die” (verse 14).
    sources: [ot-minute-2-samuel, lds-scriptures]

  - ref: 7
    phrase: Thou art the man
    kind: history
    title: Thou art the man
    body: |
      Nathan's “Thou art the man” turns the story on its hearer. The king who has just sworn that the rich man deserves to die learns that he has sentenced himself, and Nathan does not soften it. On a Latter-day Saint reading of the scene, “it is only when a sinner knows that his sin is known that he begins to repent,” and the prophet's “Thou art the man” “must have crashed in upon the conscience of David like the harbingers of doom's day.” David makes no answer until the LORD's message is finished.

      That message is in the LORD's own voice, and it begins with what He had given before it names what David took: “I anointed thee king over Israel, and I delivered thee out of the hand of Saul.” It goes on to Saul's house, the kingdom of Israel and Judah, and more if that had been too little (verses 7–8). Only after the gifts comes the question, “Wherefore hast thou despised the commandment of the LORD?”, and the charge, stated twice over: Uriah killed with the sword, “slain … with the sword of the children of Ammon,” and his wife taken (verse 9).
    sources: [ot-manual-2-samuel-1, ot-minute-2-samuel, lds-scriptures]

  - ref: 8
    phrase: thy master’s wives into thy bosom
    kind: scripture
    title: Did the LORD give David his wives?
    body: |
      Nathan, speaking for the LORD, counts Saul's wives among the gifts. It was lawful for the king, and for him only, to take his predecessor's wives; but on one older reading this was a right more than a fact, since Samuel names only one wife and one concubine of Saul's ([[1 Sam. 14:50]]; [[2 Sam. 3:7]]) and does not say that David married either.

      Latter-day revelation takes up the verse: “David's wives and concubines were given unto him of me, by the hand of Nathan, my servant, and others of the prophets who had the keys of this power; and in none of these things did he sin against me save in the case of Uriah and his wife” ([[D&C 132:39]]). The Lord, that is, approved of David's wives and concubines, given by the hand of Nathan, Bath-sheba excepted. Nathan's “I gave thee” is the Bible's word for it; the revelation “changes and expands what the Bible says,” adding that Nathan held priesthood keys to perform such marriages. The Book of Mormon says of the same men: “David and Solomon truly had many wives and concubines, which thing was abominable before me, saith the Lord” ([[Jacob 2:24]]). One reading joins the two passages: David's blessings, “including his wives, were given to him as a result of God's favor,” “but when David also acquired wives and concubines, apparently under his own authority, he was condemned by God.”

      What the site says of plural marriage in the Old Testament as a whole is in [the guide to women and marriage](/old-testament/guides/women-and-marriage/#plural-marriage).
    sources: [cambridge-1-samuel, lds-scriptures, scripture-helps-1-samuel-17, sears-shannon-polygamy, eom-david-king]

  - ref: 10
    phrase: the sword shall never depart from thine house
    kind: history
    title: The sword in David's house
    body: |
      The sentence names the deed it answers. Uriah was killed “with the sword” (verse 9, twice), and “now therefore the sword shall never depart from thine house.” David had taken a wife in secret, and the LORD says, “thou didst it secretly: but I will do this thing before all Israel, and before the sun” (verse 12).

      The misfortunes that marred David's last twenty years were constant family feuds, which “in the case of Absalom and Adonijah, ended in open rebellion,” and they are read as “a fulfillment of the pronouncement of Nathan the prophet upon David, because of his sin.” The rest of the story tells them: Absalom's servants kill Amnon at his command ([[2 Sam. 13:28–29]]); Absalom rises against his father and dies with Joab's three darts in his heart ([[2 Sam. 18:14]]); Adonijah's bid for the throne ends with Solomon having him put to death ([[1 Kgs. 2:24–25]]). Verse 12 is fulfilled when, on Ahithophel's counsel, Absalom spreads a tent on the top of the house and goes in to his father's concubines “in the sight of all Israel” ([[2 Sam. 16:22]]). In the ancient world a man of power showed it in his household, and “to lose one's wives was to lose one's power.” Many readers take this chapter as the story's turning point, “after which David lives under a sort of curse that affects his life and all his relationships.”
    sources: [bd-david, taggart-sworn-david, ot-minute-2-samuel, lds-scriptures]

  - ref: 13
    phrase: The LORD also hath put away thy sin; thou shalt not die
    kind: prophets
    title: Was David forgiven?
    body: |
      David's confession is one sentence, and in the King James Nathan's answer seems to close the matter at once. Latter-day scripture and the Prophet's teaching say that it did not. The Hebrew verb is “hath caused to pass”: David was not put to death on the spot, but he did not escape punishment. The Joseph Smith Translation says so in the verse itself: “The Lord also hath not put away thy sin that thou shalt not die,” under the headnote “David's grievous sin is not put away by God.” On one Latter-day Saint reading of the Joseph Smith Translation, the death it pronounces on David is spiritual death. The physical death the law required was not carried out; David “was given a worse punishment” instead, living to see his wives taken by another and his family turn against him.

      Modern revelation states the outcome. David sinned “in the case of Uriah and his wife; and, therefore he hath fallen from his exaltation, and received his portion” ([[D&C 132:39]]). Unlike Saul, he “was capable of true contrition and was therefore able to find forgiveness, except in the murder of Uriah,” and he “received a promise that the Lord would not leave his soul in hell,” where hell is the spirit prison. Joseph Smith taught it in 1844, as Wilford Woodruff recorded the sermon: “David sought repentance at the hand of God carefully with tears but he could ownly get it through Hell, he got a promise that his soul should not be left in Hell.” A published report of an 1841 sermon gives his teaching that “Even David, must wait for those times of refreshing, before he can come forth and his sins be blotted out.” The promise is in the words of a psalm, “thou wilt not leave my soul in hell” ([[Ps. 16:10]]). Beyond this, “the eternal status of David has not been revealed.”

      Psalm 51, David's prayer from this hour, is read beside the verse at [[Ps. 51:14]].
    sources: [lds-scriptures, jst-2-sam-12, nyman-jst-historical, bd-david, scripture-helps-2-samuel-11, jsp-discourse-1844-03-10-p210, wjs-1841-05-16]

  - ref: 23
    phrase: I shall go to him, but he shall not return to me
    kind: prophets
    title: Why the child died, and where he went
    body: |
      The text gives one reason for the child's death, and it concerns David, not the child: by this deed David had “given great occasion to the enemies of the LORD to blaspheme” (verse 14). Nothing in it makes the child guilty: “The son shall not bear the iniquity of the father” ([[Ezek. 18:20]]), and infants who die are saved in the celestial kingdom and are not held accountable for their parents' actions ([[D&C 137:10]]).

      David's conduct puzzled his servants, and the text lets him explain it. While the child lived he fasted and lay all night on the ground, because “Who can tell whether GOD will be gracious to me, that the child may live?” (verse 22). His prayer and fasting did not change what had been foretold. When the child died he rose, washed, changed his clothes, worshipped in the house of the LORD, and ate. “I shall go to him, but he shall not return to me” is his reason, said, on a Latter-day Saint reading, “philosophically and hopefully”: the child could not be brought back; it was David who would go to him.
    sources: [scripture-helps-2-samuel-11, ot-manual-2-samuel-1, ot-minute-2-samuel, lds-scriptures]

  - ref: 25
    phrase: he called his name Jedidiah, because of the LORD
    kind: words
    title: Jedidiah, beloved of the LORD
    body: |
      Bath-sheba's second son received two names. David called him Solomon, “Peaceable,” the name Chronicles explains by the LORD's promise, “I will give peace and quietness unto Israel in his days” ([[1 Chr. 22:9]]). The second came from the LORD through Nathan: *Yĕdîdyâ*, “beloved of Yah.” The narrator has just given the reason: “the LORD loved him” (verse 24).
    sources: [bdb, bd-solomon, cambridge-1-samuel, lds-scriptures]

  - ref: 31
    phrase: put them under saws
    kind: words
    title: Saws, harrows and brickkilns
    body: |
      What David did to the people of Rabbah turns on how one Hebrew verb is read, and the readings are far apart. The King James “put them under saws” renders a verb meaning “put” or “set.” The parallel in Chronicles reads “cut them with saws” ([[1 Chr. 20:3]]), a verb that differs from it by one letter. Older commentaries take the verse with Chronicles, or suspect it should be so read, and read torture: “he cut (sawed) them in pieces,” the iron “harrows” were threshing sledges with spikes, and to pass through the brickkiln was to be burned. Even on that reading, the text does not say that all the people of Rabbah died this way. The cruelty is also to be judged by “the standard of the age,” and the Ammonites had dealt brutally with others ([[1 Sam. 11:2]]; [[2 Sam. 10:4]]).

      Read as it stands, the verb of 2 Samuel probably means “set men at (the use of) implements,” and the word for the brickkiln is a “brick-mould.” Modern translations follow that reading: he “set them to labor with saws and iron picks and iron axes and made them toil at the brick kilns.” On that reading the Ammonites were set to labor, not put to death. The sources read here divide, and the verse does not settle it.
    sources: [lds-scriptures, keil-1-samuel, cambridge-1-samuel, bdb, esv, nrsvue]

christ: |
  The child David could not save by fasting is safe in Christ, who says that little children “are whole, for they are not capable of committing sin; wherefore the curse of Adam is taken from them in me” ([[Moro. 8:8]]). David's sin cost him his exaltation ([[D&C 132:39]]), yet on one Latter-day Saint reading of the covenant, “the narrative asserts that God never abandoned David or the covenantal promise.” The Lord forgives those who fully repent, though “He does not necessarily remove the negative consequences of sinful behavior”; a disciple who confesses as plainly as David did still lives with what the sin set in motion.

explore: |
  - **The psalms of this hour.** [[Ps. 51:1–19]], with its title; [[Ps. 32:1–5]].
  - **Other cases laid before a king.** The woman of Tekoa ([[2 Sam. 14:4–7]]) and the prophet sent to Ahab ([[1 Kgs. 20:35–41]]) also ask the king's judgment on a story before turning it on him.
  - **Nathan's other errands.** [[2 Sam. 7:1–17]], the promise of a house; [[1 Kgs. 1:11–45]], Solomon made king.
  - **A study.** A short essay on 2 Samuel 11–12 in the Maxwell Institute’s *Old Testament Reflections* reads the story as one of complex people rather than simple morals.

