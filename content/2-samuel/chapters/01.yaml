chapter: 1
title: How Are the Mighty Fallen
tagline: An Amalekite comes to Ziklag with Saul's crown and a story of how he killed the king; David mourns, has the man put to death for lifting his hand against the LORD's anointed, and makes a lament for Saul and Jonathan.
when: 'After the death of Saul, at Ziklag'

setting: |
  2 Samuel carries on from 1 Samuel without a break. In the Hebrew Bible the two are one book; the division into two follows the Greek Bible, and who wrote it, and when, is not known. Its first ten chapters tell how David became king, first of Judah and then of all Israel.

  The chapter opens where 1 Samuel left its two stories running side by side. While the Philistines were defeating Israel on mount Gilboa, where Saul and three of his sons died ([[1 Sam. 31:1–6]]), David was pursuing the Amalekites who had raided Ziklag ([[1 Sam. 30]]). Ziklag was a town in the Negev, a Philistine town in Saul's day, which Achish king of Gath had given David ([[1 Sam. 27:6]]). Its exact site is not known; if it lay near Beersheba, Gilboa was some 90 to 100 miles to the north as the crow flies, two or three days' journey for a runner, so the battle was probably fought about the time David came home. The news reached him on the third day.

  The chapter has two parts: the news and David's answer to the man who brought it (verses 1–16), and the lament David made for Saul and Jonathan (verses 17–27).

thread: |
  The man who runs to Ziklag believes he is bringing good news. Saul, who had hunted David for years, is dead; the man says he killed him himself, and he lays the king's crown and bracelet before the king to be. David, years later, remembered him as one who “thought that I would have given him a reward for his tidings” ([[2 Sam. 4:10]]). He got no reward. David tears his clothes and fasts, and he has the man put to death on his own confession, that he had “slain the LORD's anointed.”

  Then David sings, and the song does what the messenger did not: it treats Saul's death as a loss to Israel. It asks that the news not be carried as good tidings to the Philistine cities, curses the mountain where Saul's shield lay in the dust, and praises Saul and Jonathan together, the king who sought David's life beside the friend who saved it. Its refrain, “How are the mighty fallen,” sounds three times (verses 19, 25, 27), and its last personal words are for Jonathan.

sections:
  - range: 1-10
    heading: The news from Gilboa
    plain: |
      After Saul's death, when David had come back from defeating the Amalekites and had stayed two days in Ziklag, a man arrived on the third day from Saul's camp, with his clothes torn and earth on his head. When he came to David, he fell to the ground and bowed. David asked him where he had come from. “I have escaped from the camp of Israel,” he said. “What happened? Tell me,” said David. He answered, “The army fled from the battle; many of the people have fallen and are dead; and Saul and his son Jonathan are dead too.” David asked the young man, “How do you know that Saul and Jonathan are dead?” He said, “I happened to be on mount Gilboa, and there was Saul, leaning on his spear, with the chariots and horsemen closing in on him. He looked behind him, saw me and called me, and I said, ‘Here I am.’ He asked who I was, and I told him I was an Amalekite. He said, ‘Stand over me and kill me, for I am in agony, and my life is still whole in me.’ So I stood over him and killed him, because I was sure he could not live after his fall. And I took the crown that was on his head and the bracelet on his arm, and I have brought them here to my lord.”
  - range: 11-16
    heading: David's answer
    plain: |
      Then David took hold of his clothes and tore them, and so did all the men with him. They mourned and wept and fasted until evening for Saul, for his son Jonathan, for the LORD's people and for the house of Israel, because they had fallen by the sword. David asked the young man who had brought the news, “Where are you from?” He answered, “I am the son of a resident foreigner, an Amalekite.” David said to him, “How were you not afraid to raise your hand to destroy the LORD's anointed?” He called one of his young men and said, “Go and strike him down.” The young man struck him, and he died. David said to him, “Your blood is on your own head, for your own mouth testified against you when you said, ‘I have killed the LORD's anointed.’”
  - range: 17-27
    heading: The lament for Saul and Jonathan
    plain: |
      David sang this lament over Saul and his son Jonathan. (He ordered that the people of Judah be taught “The Bow,” which seems to be the song's name; it is written in the book of Jasher.)

      “Israel's glory lies slain on your heights. How the mighty have fallen! Do not tell it in Gath, do not spread the good news in the streets of Askelon, or the daughters of the Philistines will rejoice, the daughters of the uncircumcised will celebrate. Mountains of Gilboa, let no dew or rain fall on you, and no fields grow there to give offerings, for there the shield of the mighty was cast away in disgrace, the shield of Saul, as though he had never been anointed with oil. From the blood of the slain and the fat of the mighty, Jonathan's bow never turned back and Saul's sword never came back empty. Saul and Jonathan were loved and gracious in their lives, and in their death they were not parted; they were swifter than eagles, stronger than lions. Daughters of Israel, weep over Saul, who clothed you in scarlet and fine things and put ornaments of gold on your clothes. How the mighty have fallen in the midst of the battle! Jonathan lies slain on your heights. I grieve for you, my brother Jonathan; you were very dear to me. Your love for me was wonderful, beyond the love of women. How the mighty have fallen, and the weapons of war have perished!”

notes:
  - ref: 10
    phrase: So I stood upon him, and slew him
    kind: history
    title: Saul's death, told twice
    body: |
      The Amalekite's account of Saul's death does not agree with the narrator's, and the usual answer is that he lied. In [[1 Sam. 31:4]] Saul, badly wounded by the archers, falls on his own sword when his armourbearer will not strike him, and the armourbearer dies beside him. Here a young Amalekite says he came upon Saul by chance, leaning on his spear with the chariots closing in; that Saul asked him to finish him; and that he did. The two cannot be made into one story, and the Amalekite's story is read as “clearly a fabrication.”

      On that reading the crown and the bracelet may be all that is true in his story: the man would have been “a plunderer of the slain” who found them on the battlefield, brought them to David, and told the rest “merely to ingratiate himself with David.” The text points the same way. When David later recalls the man, he says nothing of how Saul died, only of what the man expected: he came “thinking to have brought good tidings,” and “thought that I would have given him a reward for his tidings” ([[2 Sam. 4:10]]). Whether he struck a dying king or only stripped a dead one, David judged him on his own words (verse 16).
    sources: [lds-scriptures, ot-manual-2-samuel-1, cambridge-1-samuel]

  - ref: 12
    phrase: And they mourned, and wept, and fasted until even
    kind: history
    title: They mourned, and wept, and fasted
    body: |
      David met the news with public mourning, and he mourned for more than his friend. Fasting in Israel was “a religious and cultural response to incidents of sorrow, humiliation, solemnity, and burial,” and Saul's death was mourned that way twice: by the men of Jabesh-gilead, who fasted seven days ([[1 Sam. 31:13]]), and here by David and his men until evening. They mourned for Saul, for Jonathan, for “the people of the LORD” and for “the house of Israel,” that is, for the king who had hunted David as well as for the friend who had protected him, and for the whole people who had fallen with them.

      Was the grief real? David's lament was “sincere and deep”: instead of being grateful for the death of his most violent enemy, “he truly mourned for the tragedy that had befallen Israel.” One Latter-day Saint reading of David's life leaves the question open, since in his public displays of grief, as in much else, “one could perceive political cunning or sincere bereavement.” The text itself records only what David did.
    sources: [sc-knowhy-135, ot-manual-2-samuel-1, taggart-sworn-david]

  - ref: 14
    phrase: to destroy the LORD’s anointed
    kind: history
    title: Why David put the Amalekite to death
    body: |
      David judged the man by his own words, and the crime they confessed was the one David had twice refused to commit. Twice Saul had been at David's mercy, and twice David would not touch him, because the LORD had anointed him ([[1 Sam. 24:6]], where the reason is taken up; [[1 Sam. 26:9]]). What David would not do to save his own life, this man claimed to have done and expected to be paid for. David did not inquire whether it was true: “thy mouth hath testified against thee, saying, I have slain the LORD's anointed” (verse 16). Years later, when two men brought him the head of Saul's son Ish-bosheth, he recalled this man and his sentence, and passed the same sentence on them ([[2 Sam. 4:10–12]]).

      The man's answer to David's second question (verse 13) says what he was: “the son of a stranger,” that is, the son of a foreigner living in Israel. In the Old Testament a stranger is frequently “a man of non-Israelite birth, resident in the promised land with the permission of the Israelite authorities.”
    sources: [lds-scriptures, bd-stranger]

  - ref: 18
    phrase: teach the children of Judah the use of the bow
    kind: history
    title: The use of the bow
    body: |
      Verse 18 appears to introduce the song rather than to teach archery. The Hebrew says only that David commanded the children of Judah to be taught *qešet*, the bow; it has no words for “the use of.” Read as the song's name, it gives “He ordered that The Song of the Bow be taught to the people of Judah.” The verse “appears to be a superscription like the one appearing at the beginning of Psalm 60,” whose title also says David's psalm was “to teach” ([[Ps. 60:0]]). On that reading the verse names the song and says David wanted it learned in Judah.
    sources: [oshb-wlc, nrsvue, lds-scriptures]

  - ref: 18
    phrase: it is written in the book of Jasher
    kind: history
    title: The book of Jasher
    body: |
      The lament was written in the book of Jasher, an early collection of Israel's national songs and stories of deeds of valor. The book is cited once more in scripture, for Joshua's command to the sun ([[Josh. 10:13]], where the book and the modern works that bear its name are taken up). What this verse adds is the kind of thing the book held: poetry. The writer of Samuel drew on such poems throughout, Hannah's song, David's lament for Abner, his thanksgiving and his last words among them, and here he names where one was kept.
    sources: [bd-jasher, bd-samuel-books]

  - ref: 20
    phrase: Tell it not in Gath, publish it not in the streets of Askelon
    kind: words
    title: Tell it not in Gath
    body: |
      David asks that Saul's fall not be carried to the Philistine cities as good news. “Publish” is the Hebrew *bāśar*, to gladden with good tidings, here used, as at [[1 Sam. 31:9]], for the news of a victory. It is the word for what the Philistines did when they found Saul's body: they sent through their land “to publish it in the house of their idols.” It is used too, at [[2 Sam. 4:10]], of the Amalekite who ran to Ziklag, a man who was “in his eyes as a bearer of good tidings.” Gath was the city of Achish, where David and his men had lived among the Philistines ([[1 Sam. 27:2–3]]).
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 21
    phrase: as though he had not been anointed with oil
    kind: words
    title: As though he had not been anointed
    body: |
      The Hebrew leaves open who was “not anointed with oil,” Saul or his shield. It reads, word for word, “the shield of Saul unanointed with oil.” Many commentators take it of the shield: shields were oiled, metal ones to polish them and those of wood and leather to preserve them, and Saul's lay on Gilboa uncared for, defiled with blood and dust. A modern translation reads it that way: “the shield of Saul, not anointed with oil.”

      The King James adds “as though he had,” which has no words in the Hebrew, and reads it of Saul himself. What can be said for that reading is the word's use: “anointed” (*māšîaḥ*) is everywhere else applied to persons, and in the books of Samuel always to the king; it is the word David has just used twice of Saul, “the LORD's anointed” (verses 14, 16). On the King James reading the king whom Samuel anointed ([[1 Sam. 10:1]]) lies on Gilboa as if he had never been anointed at all.
    sources: [oshb-wlc, cambridge-1-samuel, esv, lds-scriptures]

  - ref: 26
    phrase: thy love to me was wonderful, passing the love of women
    kind: history
    title: Passing the love of women
    body: |
      David's last words for Jonathan speak of the love the text has already named, and on which their covenant rested. Jonathan made a covenant with David “because he loved him as his own soul” ([[1 Sam. 18:3]]), and renewed it with an oath “because he loved him” ([[1 Sam. 20:17]]). What the covenant was, and how it reached past the two men to their children, is taken up at [[1 Sam. 18:1]] and [[1 Sam. 18:3]].

      Here David measures that love in his own words: “wonderful,” beyond the love of women. In one older reading, the comparison with the love of women “is expressive of the deepest earnestness of devoted love.” By custom Jonathan “would have been heir to the throne instead of David,” yet he gave David a friendship “characterized by exquisite loyalty and self-sacrifice.” David kept faith with that love after Jonathan was gone, asking whether anyone of Saul's house was left, “that I may shew him kindness for Jonathan's sake” ([[2 Sam. 9:1]]).
    sources: [lds-scriptures, keil-1-samuel, mickelsen-true-friendship, taggart-sworn-david]

christ: |
  David wept for the king who had sought his life. In one older reading the only deep mourning for Saul, besides that of Jabesh-gilead, came from “the man whom he had hated and persecuted,” “just as David's successor wept over the fall of Jerusalem, even when it was about to destroy Himself.” Jesus Christ, the Son of David, beheld the city that would reject Him and wept over it ([[Luke 19:41]]), and He taught His disciples to love their enemies and to pray for those who persecute them ([[Matt. 5:44]]).

  For a disciple, that love reaches even the day an enemy falls. The Savior's way, and David's here, is to grieve for an enemy rather than carry the news of his fall as good tidings.

explore: |
  - **Saul's death told once.** [[1 Sam. 31:1–6]]; [[1 Chr. 10:1–14]].
  - **The LORD's anointed.** [[1 Sam. 24:6]]; [[1 Sam. 26:9–11]]; [[2 Sam. 4:9–12]].
  - **Jonathan's covenant kept.** [[1 Sam. 20:14–17]]; [[2 Sam. 9:1–7]]; [[2 Sam. 21:7]].
  - **“In their death they were not divided.”** The footnote at verse 23 points to [[D&C 135:3]], on the deaths of Joseph and Hyrum Smith.
  - **David's other laments.** [[2 Sam. 3:33–34]], for Abner; [[2 Sam. 18:33]], for Absalom.

