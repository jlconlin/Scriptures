chapter: 8
title: The LORD Preserved David Whithersoever He Went
tagline: David subdues the Philistines, Moab, the Syrian kingdoms of Zobah and Damascus, and Edom; he dedicates the spoil to the LORD, reigns with judgment and justice, and names the officers of his kingdom.
when: 'Across the years of David’s wars'

setting: |
  Chapter 7 ended with the LORD's promise to build David a house, and chapter 8 follows it with a summary of the wars by which David made Israel supreme over the nations around it. The summary is not a single campaign. It gathers the wars of David's whole reign and groups them by subject rather than strictly by date, and its opening “after this” is a formula of transition rather than a date. The years in which the wars were fought are not given.

  The nations come in turn: the Philistines, Moab, Hadadezer of Zobah and the Syrians of Damascus, Toi of Hamath, who sent his son with gifts, and Edom. Only one war is afterward told at length, the war with Ammon and its Syrian allies in chapters 10–11, because it is the setting of David's sin with Bath-sheba. The chapter closes with a list of David's officers; a second list stands at [[2 Sam. 20:23–26]], and Solomon's at [[1 Kgs. 4:1–6]]. Chronicles tells the same wars and the same list of officers in [[1 Chr. 18]].

thread: |
  The chapter is a list of victories, and it keeps saying whose victories they are. Twice, once after the wars in the north and once after Edom in the south, the narrator stops to say that “the LORD preserved David whithersoever he went” (verses 6 and 14). Between those lines David takes gold, silver and brass from the nations he subdues, and the silver and gold he dedicates “unto the LORD” (verse 11).

  The promise of chapter 7 is taking shape. The LORD had said, “I … have made thee a great name” ([[2 Sam. 7:9]]), and here “David gat him a name” (verse 13), that is, he won renown. Then the chapter turns from the battlefield to the throne. A king who has won wars on every side is described, finally, by what he does at home: “David executed judgment and justice unto all his people” (verse 15).

sections:
  - range: 1-8
    heading: Victories on every side
    plain: |
      After this David struck the Philistines and subdued them, and he took Metheg-ammah (probably “control of the chief city”; see the note) out of the Philistines' hand. He struck Moab too. He made the prisoners lie down on the ground and measured them off with a cord: two lengths to be put to death and one full length to be kept alive. So the Moabites became David's subjects and paid him tribute.

      David also struck Hadadezer son of Rehob, king of Zobah, when he went to restore his power at the Euphrates River. David captured from him a thousand chariots, seven hundred horsemen and twenty thousand foot soldiers; he hamstrung all the chariot horses, keeping back enough for a hundred chariots. When the Syrians of Damascus came to help Hadadezer king of Zobah, David killed twenty-two thousand of them. Then David put garrisons in Syria of Damascus, and the Syrians became his subjects and paid tribute. The LORD gave David victory wherever he went. David took the gold shields carried by Hadadezer's officers and brought them to Jerusalem, and from Betah and Berothai, cities of Hadadezer, King David took a great quantity of brass.
  - range: 9-14
    heading: Gifts dedicated to the LORD
    plain: |
      When Toi king of Hamath heard that David had defeated the whole army of Hadadezer, he sent his son Joram to King David to greet him and congratulate him on fighting and defeating Hadadezer, for Hadadezer had been at war with Toi. Joram brought vessels of silver, gold and brass, and King David dedicated these to the LORD, together with the silver and gold he had dedicated from all the nations he subdued: from Syria, Moab, the Ammonites, the Philistines and Amalek, and from the spoil of Hadadezer son of Rehob, king of Zobah.

      David won renown when he returned from striking down the Syrians (the Edomites, in Chronicles; see the note) in the Valley of Salt, eighteen thousand men. He put garrisons in Edom, throughout all Edom, and all the Edomites became David's subjects. The LORD gave David victory wherever he went.
  - range: 15-18
    heading: David's officers
    plain: |
      David reigned over all Israel, and he did what was just and right for all his people. Joab son of Zeruiah commanded the army; Jehoshaphat son of Ahilud was recorder; Zadok son of Ahitub and Ahimelech son of Abiathar were the priests (the two names are probably reversed; see the note); Seraiah was the scribe; Benaiah son of Jehoiada was over the Cherethites and the Pelethites, the king's guard; and David's sons were chief rulers (the Hebrew word is “priests”; see the note).

notes:
  - ref: 1
    phrase: David took Metheg-ammah out of the hand of the Philistines
    kind: history
    title: The bridle of the mother city
    body: |
      Metheg-ammah is most likely not the name of a town but a figure of speech for the control of the Philistines' chief city. *Meteg* is a bridle, the kind put on a horse or an ass, and here it is used figuratively for control or authority: “authority of the mother city,” though the words are obscure enough that some take them for a copying error. Chronicles, telling the same victory, drops the figure and names the city: David “took Gath and her towns out of the hand of the Philistines” ([[1 Chr. 18:1]]).
    sources: [bdb, oshb-wlc, lds-scriptures]

  - ref: 2
    phrase: measured them with a line
    kind: history
    title: Moab measured with a line
    body: |
      The text says how David chose which Moabite prisoners would die, but never why he was so harsh with Moab. One reading takes the measuring as a selection by size, the taller and stronger put to death. An older reading takes the line as a cord laid along rows of prisoners, probably only the fighting men, lying on the ground: “two lines … to put to death, and with one full line to keep alive,” so that two thirds died. Either way, the harshness is all the more striking because Moab had once been a refuge for David's family. While Saul hunted him, David asked the king of Moab, “Let my father and my mother, I pray thee, come forth, and be with you” ([[1 Sam. 22:3]]), and David's own great-grandmother was Ruth the Moabitess ([[Ruth 4:10]]; [[Ruth 4:17]]).

      Why David treated so harshly a nation that had sheltered his parents can only be conjectured. One older reading reports a Jewish tradition that the king of Moab betrayed his trust and murdered David's parents, or suggests that Moab was guilty of some treachery during David's wars with its neighbors; neither is in the text. The same reading sees in the victory the fulfillment of Balaam's prophecy that a sceptre would rise out of Israel and “smite the corners of Moab” ([[Num. 24:17]]; the note there gives the prophecy's fuller reach). Moab's subjection lasted until after Ahab's death, when its king rebelled ([[2 Kgs. 3:5]]).
    sources: [cambridge-1-samuel, lds-scriptures]

  - ref: 3
    phrase: as he went to recover his border at the river Euphrates
    kind: history
    title: As far as the Euphrates
    body: |
      The Euphrates was the farthest edge of the land the LORD had promised Abraham, and this verse is where David's kingdom reached it. The LORD's covenant with Abram gave his seed the land “from the river of Egypt unto the great river, the river Euphrates” ([[Gen. 15:18]]), and that boundary “was reached in the time of David.” The chapter's victories, taken together, mean that under David “the kingdom expanded to the extent of God's promise to Abraham.”

      Translations differ on what was being restored at the river. Chronicles says he went “to stablish his dominion by the river Euphrates” ([[1 Chr. 18:3]]); one modern translation reads “to restore his monument at the River Euphrates.” Either way the river marks the frontier the promise to Abraham had named.
    sources: [bd-euphrates, ot-manual-2-samuel-1, nrsvue, lds-scriptures]

  - ref: 6
    phrase: the LORD preserved David whithersoever he went
    kind: words
    title: The LORD gave the victory
    body: |
      “Preserved” here means more than kept safe: the verb is *yāšaʿ*, to deliver or save, and with God as its subject it can mean to give someone the victory. That is the sense of this very sentence in its Chronicles form ([[1 Chr. 18:6]]; [[1 Chr. 18:13]]), and a modern translation renders it, “The Lord gave victory to David wherever he went.” It is the verb used of the heroes in Judges who saved Israel in war and were called saviors.

      The refrain closes the wars in the north here and the war with Edom in verse 14. David struck, captured and garrisoned, and both times the sentence gives the deliverance to the LORD.
    sources: [oshb-wlc, bdb, nrsvue]

  - ref: 11
    phrase: did dedicate unto the LORD
    kind: history
    title: Spoil for a house not yet built
    body: |
      What David dedicated from his wars was laid up for the temple his son would build. In chapter 7 the LORD had told David that his son “shall build an house for my name” ([[2 Sam. 7:13]]); David was not to build it, but he gathered for it. When the temple was finished, “Solomon brought in the things which David his father had dedicated; even the silver, and the gold, and the vessels,” and put them among the treasures of the house ([[1 Kgs. 7:51]]). Chronicles says that the brass taken from Hadadezer's cities was the metal “wherewith Solomon made the brasen sea, and the pillars, and the vessels of brass” ([[1 Chr. 18:8]]), and it names the Levites who kept “the treasures of the dedicated things”: “Out of the spoils won in battles did they dedicate to maintain the house” ([[1 Chr. 26:26–27]]).
    sources: [lds-scriptures]

  - ref: 13
    phrase: smiting of the Syrians in the valley of salt
    kind: history
    title: Syrians, or Edomites?
    body: |
      The Hebrew of this verse has the Syrians (*ʾărām*, Aram), but the next verse is about Edom, and the other ancient witnesses have Edom here too. Chronicles reads, “Abishai the son of Zeruiah slew of the Edomites in the valley of salt eighteen thousand” ([[1 Chr. 18:12]]); the Septuagint, the ancient Greek translation, has “he smote Idumea,” the Greek name for Edom; and modern translations such as the NRSVue print “Edomites.” The two names look much alike in Hebrew, where *d* and *r* are easily confused in copying, and verse 12 has the same variant, where Chronicles and the Septuagint read Edom for Syria, though there it is not easy to decide between them. The text of this verse is, in one older reading, “certainly corrupt.”

      The title of Psalm 60 tells the same battle a third way, with Joab as the commander and twelve thousand slain; the note on that title ([[Ps. 60:0]]) sets the three accounts side by side.
    sources: [oshb-wlc, lds-scriptures, lxx-rahlfs, nrsvue, cambridge-1-samuel]

  - ref: 17
    phrase: Ahimelech the son of Abiathar
    kind: history
    title: Ahimelech the son of Abiathar
    body: |
      The names Ahimelech and Abiathar are probably reversed in this line, for in the story of David's flight Abiathar is the son of Ahimelech. Abiathar was the one son of Ahimelech who escaped Saul's slaughter of the priests at Nob: “one of the sons of Ahimelech the son of Ahitub, named Abiathar, escaped, and fled after David” ([[1 Sam. 22:20]]), and he stayed with David through his years as a fugitive. “Ahimelech and Abiathar are probably interchanged” here and in the same names in Chronicles.

      The list names two priests, and the two had served side by side since before David was king. Zadok belonged to the family of Eleazar, and during Saul's last years there seems to have been a double high priesthood, Abiathar serving in David's camp and Zadok at Gibeon, where the tabernacle stood. The arrangement continued after David became king, until Abiathar joined Adonijah's rebellion and Zadok was put in his place ([[1 Kgs. 2:35]]).
    sources: [bd-abiathar, bd-zadok, lds-scriptures]

  - ref: 18
    phrase: the Cherethites and the Pelethites
    kind: history
    title: The king’s guard
    body: |
      The Cherethites and the Pelethites were soldiers of David's guard, and the first name ties at least some of them to the Philistines. The Cherethites (Kerethites) bear a name used for the Philistines or a part of them, perhaps Cretans; the Pelethites' name comes from a people otherwise unknown, and they never appear without the Cherethites. The two stay with David when Absalom drives him out ([[2 Sam. 15:18]]) and escort Solomon to his anointing at Gihon ([[1 Kgs. 1:38]]).
    sources: [bdb, lds-scriptures]

  - ref: 18
    phrase: David’s sons were chief rulers
    kind: words
    title: David’s sons as priests
    body: |
      “Chief rulers” translates *kōhănîm*, the ordinary Hebrew word for “priests,” and modern translations such as the NRSVue print simply “David's sons were priests.” That raises the question how sons of David, of the tribe of Judah, could be priests when the law gave that office to Aaron and his sons ([[Num. 3:10]]). The word is used here, “apparently, in this case,” for civil ministers. The ancient sources point the same way. Chronicles, telling the same list, says that “the sons of David were chief about the king” ([[1 Chr. 18:17]]), and the Septuagint makes them “princes of the court.”

      Another reading allows a little more: that David’s sons were probably chieftains who, like Jethro the priest of Midian, performed some priestly functions as princes. It puts in the same class Zabud son of Nathan, whom it takes for David's grandson ([[1 Kgs. 4:5]]), and Ira the Jairite, “a chief ruler about David” ([[2 Sam. 20:26]]).
    sources: [lds-scriptures, oshb-wlc, bdb, lxx-rahlfs, nrsvue]

christ: |
  The chapter's last word on David's reign is that he “executed judgment and justice unto all his people” (verse 15), and those are the words the prophets later used for the King to come from his line. Isaiah promises a child on “the throne of David,” to establish it “with judgment and with justice from henceforth even for ever” ([[Isa. 9:7]]), and Jeremiah a “righteous Branch” raised “unto David,” a King who “shall execute judgment and justice in the earth” ([[Jer. 23:5]]). At his best David is described in the words that describe that King, Jesus Christ, and in one older reading he is here “a true type of the perfect Messianic King.”

  The refrain of the chapter says that it was the LORD who gave David his victories, and David answered by dedicating what he won to the LORD's house. When a disciple's victories come from the Lord, the answer the chapter gives to them is David's: what was won is dedicated to the Lord.

explore: |
  - **Chronicles tells it again.** [[1 Chr. 18]], with Gath for Metheg-ammah, Edom for the Syrians and “chief about the king” for the priests.
  - **The same wars in a psalm.** [[Ps. 60:0]] and its title notes; [[Ps. 60:8]] (“over Edom will I cast out my shoe”).
  - **Horses and chariots.** [[Josh. 11:6]], where the note explains why captured horses were hamstrung; [[Deut. 17:16]]; [[Ps. 20:7]].
  - **Moab and Edom in prophecy.** [[Num. 24:17–18]].
  - **The King who executes judgment.** [[Isa. 9:6–7]]; [[Jer. 23:5–6]].

