chapter: 7
title: He Will Make Thee an House
tagline: David wants to build the LORD a house; through Nathan the LORD answers that He will build David a house instead, a son on his throne and a kingdom established for ever; and David goes in and sits before the LORD to give thanks.
when: 'When the LORD had given him rest round about from all his enemies'

setting: |
  Chapters 5 and 6 gave David a capital, a palace of cedar from Hiram of Tyre, victories over the Philistines and, at last, the ark of God in a tent in the city of David. With Jerusalem established and the wars over for a time, the king can turn to something new. The prophet Nathan appears here for the first time, part of the court David is forming; he will return to confront David in [[2 Sam. 12:1]].

  The chapter is the center of 2 Samuel and one of the great chapters of the Old Testament. The LORD's promises to David in verses 11–16 are called the Davidic covenant, though the chapter never uses the word covenant; later scripture does ([[Ps. 89:3]]; [[2 Sam. 23:5]]). It has been called the covenant that receives more attention in the Hebrew Bible than any but Sinai's. Psalm 89 gives its fullest exposition, and Isaiah, Jeremiah and Amos build their hope for a restored Israel on it. Chronicles tells the chapter again ([[1 Chr. 17:1–27]]). In the New Testament, Gabriel announces Jesus's birth in its terms ([[Luke 1:32–33]]).

thread: |
  The chapter turns on one word, “house.” David, settled in his own house, wants to build the LORD one. The LORD answers that He has never asked for a house, and that He will make David a house: a son on his throne, and a kingdom that will last for ever. David offered to build; the LORD will do the building.

  The answer has two movements, and the order matters. First the LORD reminds David of what He has already done: taken him from the sheepfold, been with him wherever he went, cut off his enemies, made his name great (verses 8–9). Only then does He promise what He will do for David's house after David is dead (verses 11–16). Past mercies come first, and they are the ground for trusting the promise of future faithfulness.

  David's prayer (verses 18–29) takes the same shape. He begins with astonishment, “Who am I, O Lord GOD?”, recalls what the LORD did for Israel in bringing it out of Egypt, and then asks only that the LORD do “as thou hast said.” He knows the promise rests on the LORD's faithfulness and not on any merit of his own: “For thy word's sake, and according to thine own heart, hast thou done all these great things” (verse 21).

sections:
  - range: 1-3
    heading: David's wish
    plain: |
      When the king was living in his palace and the LORD had given him rest from all his enemies around him, the king said to Nathan the prophet, “Look, I live in a house of cedar, but the ark of God stays in a tent.” Nathan told the king, “Go and do whatever you have in mind, for the LORD is with you.”
  - range: 4-11
    heading: The LORD's answer
    plain: |
      That same night the word of the LORD came to Nathan: “Go and tell My servant David, ‘This is what the LORD says: Are you the one to build Me a house to live in? I have not lived in a house from the day I brought the Israelites up out of Egypt to this day; I have moved about in a tent, a tabernacle. Wherever I went with all the Israelites, did I ever say to any of the tribes of Israel, whom I commanded to shepherd My people Israel, “Why have you not built Me a house of cedar?”’

      “Now tell My servant David, ‘This is what the LORD of hosts says: I took you from the sheepfold, from following the sheep, to be ruler over My people Israel. I have been with you wherever you went. I have cut off all your enemies before you, and I have made your name great, like the names of the great men of the earth. I will also provide a place for My people Israel and plant them there, so that they can live in their own place and not be moved again. The wicked will not oppress them anymore as they did at first, and ever since I appointed judges over My people Israel; and I have given you rest from all your enemies. And the LORD declares to you that the LORD Himself will make you a house.’”
  - range: 12-17
    heading: A son, a throne, for ever
    plain: |
      “When your days are over and you rest with your fathers, I will raise up your offspring after you, your own son, and I will establish his kingdom. He is the one who will build a house for My name, and I will establish the throne of his kingdom for ever. I will be his father, and he will be My son. When he does wrong, I will correct him with the rod men use, with the blows that human beings give. But My steadfast love will not be taken away from him, as I took it from Saul, whom I removed before you. Your house and your kingdom will stand for ever before you; your throne will be established for ever.”

      Nathan told David all these words and all this vision.
  - range: 18-29
    heading: David's prayer
    plain: |
      Then King David went in and sat before the LORD and said, “Who am I, Lord GOD, and what is my family, that You have brought me this far? And as if this were too little in Your eyes, Lord GOD, You have also spoken about Your servant's house far into the future. Is this how You deal with a man, Lord GOD? (The Hebrew of this clause is uncertain; see the note.) What more can David say to You? You know Your servant, Lord GOD. For the sake of Your word, and according to Your own heart, You have done all these great things, to make them known to Your servant.

      “That is why You are great, LORD God. There is no one like You, and there is no God but You, by all we have heard with our ears. And what other nation on earth is like Your people Israel, whom God went to redeem as a people for Himself, to make a name for Himself, and to do great and awesome things for you and for Your land, before Your people whom You redeemed for Yourself from Egypt, from the nations and their gods? You have made Your people Israel Your own people for ever, and You, LORD, have become their God.

      “Now, LORD God, confirm for ever the word You have spoken about Your servant and his house, and do as You have said. Then Your name will be great for ever, and people will say, ‘The LORD of hosts is God over Israel,’ and the house of Your servant David will be established before You. You, LORD of hosts, God of Israel, have revealed this to Your servant: ‘I will build you a house.’ That is why Your servant has found the courage to pray this prayer to You. And now, Lord GOD, You are God, and Your words are true, and You have promised this good thing to Your servant. So be pleased to bless the house of Your servant, that it may continue for ever before You; for You, Lord GOD, have spoken it, and with Your blessing the house of Your servant will be blessed for ever.”

notes:
  - ref: 2
    phrase: I dwell in an house of cedar, but the ark of God dwelleth within curtains
    kind: history
    title: Rest, and a house of cedar
    body: |
      David's wish to build follows from the rest of verse 1, and the law had already tied rest to a place for the LORD. The verse says the LORD “had given him rest round about from all his enemies,” words that match Deuteronomy almost exactly: “when he giveth you rest from all your enemies round about” ([[Deut. 12:10]]). That sentence of the law goes on, “Then there shall be a place which the LORD your God shall choose to cause his name to dwell there” ([[Deut. 12:11]]).

      What David says to Nathan is a contrast he can see from his window. Hiram's craftsmen had built him a palace of cedar ([[2 Sam. 5:11]]); the ark sat in the tent he had pitched for it ([[2 Sam. 6:17]]). With his throne established, the king feels the incongruity of a palace for himself while God has no permanent dwelling, and he proposes to build Him one.
    sources: [ot-minute-2-samuel, taggart-sworn-david, lds-scriptures]

  - ref: 5
    phrase: Shalt thou build me an house for me to dwell in?
    kind: history
    title: Why David was not to build
    body: |
      Nathan said yes before the LORD spoke, and the word that came that night reversed him; it does not blame David. “Go, do all that is in thine heart; for the LORD is with thee” (verse 3) seems to have been the prophet's own judgment: Nathan apparently agreed with the king without asking the LORD, and one Latter-day Saint reading suggests that king and prophet had grown complacent in the peace, assuming the LORD would stand behind whatever they decided.

      The answer here gives no reason for the refusal. It asks a question, and then says only that the LORD had not lived in a house since the Exodus and had never asked any of Israel's leaders, “Why build ye not me an house of cedar?” (verses 6–7). Chronicles records the reason David later gave Solomon: “Thou hast shed blood abundantly, and hast made great wars: thou shalt not build an house unto my name” ([[1 Chr. 22:8]]), with the promise of a son who “shall be a man of rest” ([[1 Chr. 22:9]]).

      The wish itself was not rejected; David's motive was proper and good. At the dedication of the temple Solomon recalled what the LORD had told his father: “Whereas it was in thine heart to build an house unto my name, thou didst well that it was in thine heart. Nevertheless thou shalt not build the house; but thy son that shall come forth out of thy loins, he shall build the house unto my name” ([[1 Kgs. 8:18–19]]).
    sources: [ot-minute-2-samuel, ot-manual-2-samuel-1, lds-scriptures]

  - ref: 11
    phrase: he will make thee an house
    kind: words
    title: The LORD will build David a house
    body: |
      The LORD turns David's word around: David offered to build the LORD a house, and the LORD will make David one. Hebrew *bayit*, “house,” is a dwelling, the house of God, and a family of descendants, and the chapter uses all three. David lives in a “house of cedar” (verse 2); the house he offers is a temple (verse 5); the house the LORD promises is a posterity whose throne will last for ever (verses 11, 16). This verse, and David's “I will build thee an house” in verse 27, use it in the last sense, a line of descendants.

      So the promise has two builders and two houses. The LORD will make David a house, and David's son, not yet born, will build the house of God that David had proposed (verse 13). The note at [[Ps. 127:1]] shows the same double sense of “house” elsewhere in scripture.
    sources: [cfm-ot-2026-25, bdb, oshb-wlc, taggart-sworn-david]

  - ref: 13
    phrase: He shall build an house for my name
    kind: scripture
    title: The son who builds
    body: |
      The son of verses 12–13 is not named, and the promise is usually read of Solomon, who had not yet been born ([[2 Sam. 12:24]]). Chronicles names him. David told Solomon that the word of the LORD had said, “his name shall be Solomon … He shall build an house for my name; and he shall be my son, and I will be his father” ([[1 Chr. 22:9–10]]), and Solomon claimed the fulfilment when the temple was finished: “I am risen up in the room of David my father, and sit on the throne of Israel, as the LORD promised, and have built an house for the name of the LORD God of Israel” ([[1 Kgs. 8:20]]).

      Yet the promise runs past Solomon, because it ends with “for ever,” and Solomon's throne did not last for ever. One Latter-day Saint reading sets beside Solomon's temple the one Jesus spoke of when He said, “Destroy this temple, and in three days I will raise it up,” for “he spake of the temple of his body” ([[John 2:19–21]]): the son of David whose temple is his own body.
    sources: [taggart-sworn-david, ot-minute-2-samuel, lds-scriptures]

  - ref: 14
    phrase: I will be his father, and he shall be my son
    kind: christ
    title: Father and son, and the rod of men
    body: |
      The words give the king of David's line the relation of a son to God, and the New Testament hears in them the Son of God. In several passages of the Old Testament God declares Israel's king His son: this verse, the same words of Solomon in [[1 Chr. 28:6]], and the royal psalms (the note at [[Ps. 2:7]] explains the king's sonship). Hebrews quotes this verse to show that the Son stands above the angels: “I will be to him a Father, and he shall be to me a Son” ([[Heb. 1:5]]). It applies the words to Jesus Christ as the one they foreshadowed.

      Hebrews quotes only the first half. The second half speaks to the kings who would actually sit on David's throne: “If he commit iniquity, I will chasten him with the rod of men, and with the stripes of the children of men.” A father's support came with its conditions, and the sons of David would not be excused their disobedience because of their descent. When Jerusalem fell, the lament for it spoke in the same terms: “I am the man that hath seen affliction by the rod of his wrath” ([[Lam. 3:1]]).
    sources: [sc-knowhy-865, ot-minute-2-samuel, lds-scriptures]

  - ref: 15
    phrase: my mercy shall not depart away from him, as I took it from Saul
    kind: scripture
    title: Mercy not taken away, as from Saul
    body: |
      The heart of the promise is the LORD's *ḥesed*, His loving-kindness, which the King James calls “mercy”: whatever the son does, it will not be withdrawn. He may be chastened, but he will not be cast off as Saul was. Saul had received no such promise. He had been chosen and anointed through Samuel, but neither his house nor his kingdom was given any lasting blessing, and the LORD “put away” Saul before David. (The note at [[Ps. 51:1]] explains *ḥesed*.)

      Because the promise rests on what the LORD commits Himself to, and lays no conditions on David in return, scholars call it a “grant” covenant rather than a treaty. David's own life would test it almost at once: the sin with Bath-sheba and the murder of Uriah follow within a few chapters. Modern revelation makes clear that David's failure cost him blessings ([[D&C 132:39]]; the note at [[2 Sam. 12:13]] takes it up), but the story that follows insists that God never abandoned David or the promise. (The conditions Psalm 132 lays on David's sons are taken up at verse 16.) Psalm 89 holds the same two things together, the sons punished and the oath unbroken (the note at [[Ps. 89:30]]).
    sources: [taggart-sworn-david, ot-minute-2-samuel]

  - ref: 16
    phrase: thine house and thy kingdom shall be established for ever before thee
    kind: scripture
    title: For ever, and the kingdom that ended
    body: |
      The chapter says “for ever” of David's throne three times (verses 13 and 16), yet David's kingdom ended when Babylon carried Judah captive in the sixth century BC. Scripture answers in two parts. Psalm 132 makes the earthly reign depend on the sons' faithfulness ([[Ps. 132:12]], where the note shows what the “if” governs). And the “for ever” is kept in Jesus Christ, David's descendant, to whom Gabriel promised the throne of his father David and a kingdom without end ([[Luke 1:32–33]]). The verse is a prophecy with a double meaning: it promised David's line the throne after him, and only one person can sit on David's throne for ever, and that one is Christ.

      Misreading the promise had a cost. In Lehi's day many in Jerusalem would not “believe that Jerusalem, that great city, could be destroyed” ([[1 Ne. 2:13]]), and one reason may be that they took the covenant with David as a guarantee for David's city. The part of the covenant that promised a throne for ever was unconditional, and was fulfilled in Jesus; the promises to protect Jerusalem had always depended on the people's obedience ([[1 Kgs. 9:6–7]]).

      Joseph Smith taught of a further fulfilment, that the throne and kingdom of David would be given “to another by the name of David in the last days, raised up out of his lineage”; some Latter-day Saints see Christ Himself in that David, and others a latter-day king of David's line (the notes at [[Ezek. 34:23]] and [[Ezek. 37:24]]).
    sources: [scripture-helps-1-samuel-17, ot-manual-2-samuel-1, sc-knowhy-451, eom-david-last-days, lds-scriptures]

  - ref: 18
    phrase: sat before the LORD
    kind: history
    title: David sat before the LORD
    body: |
      David answers the promise in worship. He “went in,” most likely into the tent where the ark stood ([[2 Sam. 6:17]]), and “before the LORD” is the phrase scripture uses for worship at the sanctuary. His first words are astonishment and humility: “Who am I, O Lord GOD? and what is my house, that thou hast brought me hitherto?” The blessings, he knows, come from the LORD's own goodness and not from anything he has earned: “For thy word's sake, and according to thine own heart” (verse 21).

      Saul had also spoken of his smallness when Samuel first came to him: “Am not I a Benjamite, of the smallest of the tribes of Israel?” ([[1 Sam. 9:21]]). David's prayer goes further than self-deprecation. He gives thanks for particular things: his house now and to come, the LORD's greatness and that there is no God beside Him, and Israel, redeemed out of Egypt (verses 22–24), the same history the LORD had just rehearsed to him (verse 6).
    sources: [ot-minute-2-samuel, taggart-sworn-david]

  - ref: 19
    phrase: is this the manner of man
    kind: words
    title: The manner of man
    body: |
      The last clause of verse 19 is uncertain in Hebrew, and translations differ widely. The words are *tôrat hāʾādām*. *Tôrâ* usually means “law” or “instruction,” and *ʾādām* is “man” or “mankind.” The King James takes *tôrâ* in a rarer sense, “custom, manner,” and the question then is whether this is the manner of man and not of God, the LORD dealing with David as one man deals with another. Modern translations read it otherwise: “this is instruction for mankind” (ESV); “May this be instruction for the people” (NRSVue, with the footnote “Meaning of Heb uncertain”); or a cry of wonder that the LORD's decree “is for a mere human!” (NIV, with “for the human race” in the margin). Some scholars emend the word and read “generations of men.”

      Chronicles has a different clause again: “and hast regarded me according to the estate of a man of high degree” ([[1 Chr. 17:17]]). No reading is certain, and the note leaves the King James standing.
    sources: [oshb-wlc, bdb, esv, nrsvue, niv, lds-scriptures]

christ: |
  The son promised to David is Jesus Christ, who received “the throne of his father David” ([[Luke 1:32]]), and of whose kingdom “there shall be no end” ([[Luke 1:33]]). He is more than the heir: He is the LORD who made the promise to David and the one whose grace keeps it, both the promisor and the fulfilment.

  The chapter's pattern, past mercies recalled and future grace trusted, is the shape of a disciple's hope in Him, above all when life and plans come to what seem devastating ends. David's confidence rested on the LORD's word and heart, not on his own merit (verse 21), and so does the disciple's: the promise is kept by the one who made it.

explore: |
  - **Chronicles tells it again.** [[1 Chr. 17:1–27]]; David's charge to Solomon, [[1 Chr. 22:6–10]].
  - **The promise in the Psalms.** [[Ps. 89:19–37]]; [[Ps. 132:11–12]]; [[Ps. 2:7]].
  - **The prophets' hope in it.** [[Isa. 9:7]]; [[Isa. 55:3]]; [[Jer. 33:17–21]]; [[Amos 9:11]].
  - **Fulfilled in Christ.** [[Luke 1:30–33]]; [[Acts 13:22–23]]; [[Heb. 1:5]].
  - **The covenant from 2 Samuel 7 to Christ.** Robbie Taggart, “[‘I Have Sworn unto David My Servant’: The Davidic Covenant as Manifestation of God's Ḥesed](https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant).”

