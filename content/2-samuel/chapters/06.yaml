chapter: 6
title: How Shall the Ark of the LORD Come to Me
tagline: David sets out to bring the ark to Jerusalem on a new cart, and Uzzah dies for touching it; three months later the ark is carried up with sacrifice, music and dancing, and Michal, Saul's daughter, despises the king who danced.
when: 'After David took Jerusalem; the ark came up three months after Uzzah died'

setting: |
  The ark of the covenant had been out of the way for a generation. After the Philistines sent it back, the men of Kirjath-jearim brought it into the house of Abinadab “in the hill,” where it stayed so long that “the time was long; for it was twenty years” before Israel “lamented after the LORD” ([[1 Sam. 7:1–2]]), and it was still there when David came for it (the site follows that journey at [[1 Sam. 6:7]] and [[1 Sam. 7:1]]). “Baale of Judah” in verse 2 is the same town. Joshua's border runs “to Baalah, which is Kirjath-jearim” ([[Josh. 15:9]]), and Chronicles, telling this day again, says David went “to Baalah, that is, to Kirjath-jearim, which belonged to Judah” ([[1 Chr. 13:6]]).

  David had just taken Jerusalem (chapter 5). With a new capital standing between the northern and southern tribes, his next step was to make it the center of Israel's worship as well. Chronicles gives his reason in his own words: “let us bring again the ark of our God to us: for we inquired not at it in the days of Saul” ([[1 Chr. 13:3]]). It tells the story at greater length and in two parts, the failed attempt ([[1 Chr. 13]]) and the successful one ([[1 Chr. 15–16]]), and the notes below draw on it where it answers what Samuel leaves unsaid. The site's notes on [[Ps. 132:6]], [[Ps. 24:10]] and [[Ps. 47:5]] read those psalms beside this day.

thread: |
  The chapter turns on David's question in verse 9: “How shall the ark of the LORD come to me?” The ark was a symbol of the LORD's own presence, and the chapter is about how that presence may be brought near. The first attempt is full of zeal and music, and it goes wrong at a threshing floor. The ark rides on a cart, Uzzah takes hold of it, and he dies. David is angry, then afraid, and he leaves the ark at the house of Obed-edom.

  Then word comes that the ark has brought that house not death but blessing, and David goes back for it. This time the ark is carried, an offering begins the march, and the king dances before it with all his might. Fear has turned to gladness, and David himself later names the difference: the first time “we sought him not after the due order” ([[1 Chr. 15:13]]).

  The last scene sets two responses to the same day side by side. Michal, watching from a window, sees a king who has lowered himself. David answers that all of it was “before the LORD,” the LORD who chose him over her father's house. The chapter closes on Michal, and the next opens with David settled in his own house of cedar, troubled that the ark still dwells within curtains ([[2 Sam. 7:2]]).

sections:
  - range: 1-5
    heading: The ark sets out from Baale of Judah
    plain: |
      Once again David gathered all the chosen men of Israel, thirty thousand of them. He set out with all his people for Baale of Judah to bring up from there the ark of God, which is called by the name of the LORD of hosts, who dwells between the cherubim. They put the ark of God on a new cart and brought it out of the house of Abinadab at Gibeah. Uzzah and Ahio, Abinadab's sons, drove the new cart, with Ahio walking ahead of the ark. David and all Israel celebrated before the LORD with every kind of instrument made of fir wood: harps, psalteries, timbrels, cornets and cymbals.
  - range: 6-11
    heading: Uzzah dies, and the ark stays with Obed-edom
    plain: |
      When they reached Nachon's threshing floor, the oxen jolted the ark, and Uzzah reached out and took hold of it. The LORD's anger burned against Uzzah, and God struck him down there for his error, and he died there beside the ark of God. David was angry that the LORD had broken out against Uzzah, and he named the place Perez-uzzah, the breach of Uzzah, as it is still called. That day David was afraid of the LORD. “How can the ark of the LORD ever come to me?” he said. So he would not take the ark into the city of David, but turned aside with it to the house of Obed-edom the Gittite. The ark stayed in Obed-edom's house three months, and the LORD blessed Obed-edom and all his household.
  - range: 12-19
    heading: The ark comes into the city of David
    plain: |
      King David was told, “The LORD has blessed Obed-edom's household and everything he has because of the ark of God.” So David went and brought the ark of God up from Obed-edom's house to the city of David with rejoicing. When the men carrying the ark of the LORD had gone six paces, he sacrificed oxen and fatlings. David, wearing a linen ephod, danced before the LORD with all his strength, as he and all Israel brought up the ark of the LORD with shouting and the sound of the trumpet. As the ark of the LORD came into the city of David, Michal, Saul's daughter, looked down through a window and saw King David leaping and dancing before the LORD, and in her heart she despised him. They brought the ark of the LORD in and set it in its place inside the tent David had pitched for it, and David offered burnt offerings and peace offerings before the LORD. When he had finished offering them, he blessed the people in the name of the LORD of hosts. Then he gave every one of the people, the whole crowd of Israel, women and men alike, a loaf of bread, a good portion of meat and a flagon of wine, and they all went home.
  - range: 20-23
    heading: Michal and David
    plain: |
      When David came home to bless his own household, Michal, Saul's daughter, came out to meet him. “How glorious the king of Israel was today,” she said, “uncovering himself today in front of his servants' maids, the way some worthless fellow shamelessly uncovers himself!” David answered Michal, “It was before the LORD, who chose me over your father and over all his house to make me ruler over the LORD's people Israel. So I will celebrate before the LORD. I will make myself still more lowly than this and be humble in my own eyes; but the maidservants you spoke of, by them I will be honored.” And Michal, Saul's daughter, had no child to the day of her death.

notes:
  - ref: 3
    phrase: they set the ark of God upon a new cart
    kind: history
    title: A cart, as the Philistines had sent it
    body: |
      The ark set out for Jerusalem the way it had come back from Philistia, not the way the law said it should travel. A new cart was how the Philistine priests had sent it home ([[1 Sam. 6:7]]; see the note there), and on one older reading Israel simply “followed the example of the Philistines” in place of the law's instructions. Those instructions were plain. When Moses gave the tabernacle's wagons to the Levites, “unto the sons of Kohath he gave none: because the service of the sanctuary belonging unto them was that they should bear upon their shoulders” ([[Num. 7:9]]); and the Kohathites who bore the holy things were not to touch them, “lest they die” ([[Num. 4:15]]; the site's note there follows the rule down to this chapter).

      The text says nothing of Uzzah and Ahio beyond “the sons of Abinadab,” in whose house the ark had stood since the Philistines sent it back ([[1 Sam. 7:1–2]]). It does not call them Levites.
    sources: [keil-1-samuel, lds-scriptures]

  - ref: 6
    phrase: Uzzah put forth his hand to the ark of God, and took hold of it
    kind: prophets
    title: '“Steadying the ark” in latter-day revelation'
    body: |
      Latter-day revelation takes Uzzah's act as a pattern, and latter-day prophets have read it as a warning against directing the Lord's work without His authority. In the Doctrine and Covenants the Lord speaks of a man “called of God and appointed, that putteth forth his hand to steady the ark of God,” who “shall fall by the shaft of death, like as a tree that is smitten by the vivid shaft of lightning” ([[D&C 85:8]]), and the footnote there points back to this verse. The revelation treats Uzzah's story as history, one of several Old Testament events that the Doctrine and Covenants names and so reaffirms.

      The principle drawn from it is “that the Lord does not need the help of men to defend his kingdom.” President David O. McKay, granting that Uzzah “seemed justified” and that his punishment seems severe, turned it on the Saints: “Let us look around us and see how quickly men who attempt unauthoritatively to steady the ark die spiritually. Their souls become embittered, their minds distorted, their judgment faulty, and their spirit depressed.”
    sources: [lds-scriptures, esplin-ot-relevancy, ot-seminary-lesson-90]

  - ref: 7
    phrase: God smote him there for his error
    kind: words
    title: What Uzzah’s “error” was
    body: |
      The King James' “for his error” translates a single Hebrew word whose meaning is disputed, so the verse itself names Uzzah's fault less clearly than the English suggests. “Error” goes back to the ancient Aramaic paraphrase, which explains the word “because he acted in error.” Some manuscripts of the Greek translation read it as “for his hastiness,” and the Latin as rashness (*temeritate*). Some scholars take the word for what is left of the longer phrase that Chronicles has in its place, and there the reason is plain: the LORD smote him “because he put his hand to the ark” ([[1 Chr. 13:10]]).

      So the text names the act, not a motive. Uzzah may have meant only to keep the ark from falling, but “God was fully capable of steadying His own ark had He wished to do so.” When David tried again, he did not lay the fault on Uzzah alone. “The LORD our God made a breach upon us,” he told the Levites, “for that we sought him not after the due order” ([[1 Chr. 15:13]]), and “breach” is the word in the name he gave the place, Perez-uzzah (verse 8).
    sources: [bdb, lds-scriptures, ot-manual-2-samuel-1]

  - ref: 10
    phrase: the house of Obed-edom the Gittite
    kind: history
    title: Obed-edom the Gittite
    body: |
      The ark that had just killed a man brought blessing to the house that kept it, and its keeper bears a surprising title. “The Gittite” is what Samuel calls Goliath ([[2 Sam. 21:19]]), and the text says nothing more about Obed-edom himself. Chronicles also calls him “Obed-edom the Gittite” ([[1 Chr. 13:13]]), but when the ark is brought up it counts an Obed-edom among the Levites who served it: he and Jehiah “were doorkeepers for the ark” ([[1 Chr. 15:24]]). Later, among the gatekeepers of the house of the LORD, the eight sons of Obed-edom are listed with the comment “for God blessed him” ([[1 Chr. 26:4–5]]).

      Whether the two are one man the text does not say. The later lists have been read as including the same Obed-edom among the Levites. One older reading makes him a Levite of Kohath's line, called the Gittite from his birthplace, Gath-rimmon, one of the towns given to the Kohathites ([[Josh. 21:20]], [[Josh. 21:24]]). What the chapter itself stresses is the blessing: it was plain enough to be reported to the king, and the report sent David back for the ark (verse 12).
    sources: [lds-scriptures, ot-minute-2-samuel, keil-1-samuel]

  - ref: 13
    phrase: when they that bare the ark of the LORD had gone six paces
    kind: history
    title: This time the ark was carried
    body: |
      The second procession differs from the first in a single word: the ark is no longer driven but borne. Samuel does not say who “they that bare the ark” were; Chronicles does. David had concluded, “None ought to carry the ark of God but the Levites” ([[1 Chr. 15:2]]), and so “the children of the Levites bare the ark of God upon their shoulders with the staves thereon, as Moses commanded according to the word of the LORD” ([[1 Chr. 15:15]]).

      The march began with an offering: as soon as the bearers had gone six paces, oxen and fatlings were sacrificed. Chronicles adds a second offering: “When God helped the Levites that bare the ark of the covenant of the LORD,” “they offered seven bullocks and seven rams” ([[1 Chr. 15:26]]). The first journey had stopped at a threshing floor with a death; the second went in the order the law had given, and arrived.
    sources: [lds-scriptures]

  - ref: 14
    phrase: David was girded with a linen ephod
    kind: history
    title: A king in a linen ephod
    body: |
      David wore linen that day, as the Levites who bore the ark did, and a linen ephod besides. The ephod was part of the high priest's dress, but a linen ephod seems in time to have become the dress of all priests, and it was worn by others who served the LORD: the boy Samuel at Shiloh ([[1 Sam. 2:18]]), and David on this day. Chronicles describes the whole company: “David was clothed with a robe of fine linen, and all the Levites that bare the ark, and the singers,” and “David also had upon him an ephod of linen” ([[1 Chr. 15:27]]). The narrative says what he wore and what he did; it does not say the garment made him a priest.

      The dancing was worship too, and David says so himself: “It was before the LORD … therefore will I play before the LORD” (verse 21). The revelation given to the camp of Israel at Winter Quarters in January 1847, to which the footnote here points, says the same of a glad heart: “If thou art merry, praise the Lord with singing, with music, with dancing” ([[D&C 136:28]]).
    sources: [bd-ephod, lds-scriptures]

  - ref: 17
    phrase: in the midst of the tabernacle that David had pitched for it
    kind: history
    title: A tent on Zion, not the tabernacle of Moses
    body: |
      The “tabernacle” of this verse is a tent David put up for the ark in Jerusalem, not the tabernacle Moses had made in the wilderness, which stood elsewhere. Chronicles calls it “the tent that David had pitched for it” ([[1 Chr. 16:1]]) and keeps the two apart. Moses' “tabernacle of the congregation of God” was at Gibeon, where priests served “before the tabernacle of the LORD in the high place that was at Gibeon” ([[1 Chr. 16:39]]), “but the ark of God had David brought up from Kirjath-jearim to the place which David had prepared for it: for he had pitched a tent for it at Jerusalem” ([[2 Chr. 1:3–4]]).

      So the ark and the old tabernacle were now in two places, and the ark's place was new and plain. David feels it in the next chapter: “I dwell in an house of cedar, but the ark of God dwelleth within curtains” ([[2 Sam. 7:2]]). The site's note at [[Ps. 24:3]] reads the psalm's hill of the LORD beside this tent on Zion.
    sources: [lds-scriptures]

  - ref: 20
    phrase: How glorious was the king of Israel to day
    kind: history
    title: What Michal objected to
    body: |
      Michal's words are sarcasm. The king had been “glorious” today, she says, by uncovering himself before the servants' maids like one of the “vain fellows”: in his dancing more of him was exposed than she thought proper. Why it angered her so deeply the text does not say beyond verse 16, where she watched from a window, “saw king David leaping and dancing before the LORD; and she despised him in her heart.” The exact reason cannot be known.

      One older reading finds the cause in her father's house. She is named “the daughter of Saul” here, not the wife of David, because “she manifested her father's disposition rather than her husband's,” and “the proud daughter of Saul was offended at the fact, that the king had let himself down on this occasion to the level of the people.”

      David's answer turns on the same name. What he did was “before the LORD, which chose me before thy father, and before all his house” (verse 21), and he would be lower still, “base in mine own sight,” and be honored by the very maidservants she had scorned (verse 22). Michal spoke of the king's dignity; David spoke of the LORD who had chosen him.
    sources: [lds-scriptures, ot-minute-2-samuel, ot-manual-2-samuel-1, keil-1-samuel]

  - ref: 23
    phrase: Therefore Michal the daughter of Saul had no child
    kind: words
    title: What “therefore” joins
    body: |
      The verse says that Michal never bore a child, and it gives no cause. The King James' “Therefore” is the translators' link between this sentence and the quarrel; the Hebrew opens with the ordinary conjunction “and,” and a modern translation keeps it: “And Michal the daughter of Saul had no child to the day of her death.” The sentence ends the scene and Michal's part in the chapter without stating a lesson. (The “five sons of Michal” at [[2 Sam. 21:8]] are another woman's: there “the name Michal is mistakenly used for Merab.”)
    sources: [oshb-wlc, nrsvue, bd-michal]

christ: |
  The ark stood for the presence of God and His throne, and in the tabernacle only the high priest, “a type of Christ,” could come before it, and only after he had been cleansed. This chapter shows that the presence of the LORD could not be approached in just any way: the hand that reached for the ark fell, and the procession that carried it as He had commanded came in with gladness. Jesus Christ is the “great high priest, that is passed into the heavens” ([[Heb. 4:14]]), and through Him disciples may “come boldly unto the throne of grace, that we may obtain mercy” ([[Heb. 4:16]]).

  The way into the Lord's presence is still the way He appoints, and His work does not depend on an unauthorized hand to keep it upright ([[D&C 85:8]]). A disciple who comes to Him in that way can come as David did, with all his might and with joy ([[D&C 136:28]]).

explore: |
  - **The same day in Chronicles.** [[1 Chr. 13:1–14]]; [[1 Chr. 15:1–16:3]], and the psalm of thanks sung when the ark was set in its tent, [[1 Chr. 16:7–36]].
  - **Psalms of the ark brought up.** [[Ps. 132:1–8]]; [[Ps. 24:7–10]]; [[Ps. 47:5]].
  - **Holiness that must not be touched.** [[Num. 4:15–20]]; [[1 Sam. 6:19–20]]; [[D&C 85:8]].
  - **Michal's story.** [[1 Sam. 18:20]]; [[1 Sam. 19:11–17]]; [[1 Sam. 25:44]]; [[2 Sam. 3:13–16]].

