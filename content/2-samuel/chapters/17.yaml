chapter: 17
title: The Good Counsel of Ahithophel
tagline: Ahithophel would strike David that night; Hushai talks Absalom into delay; the priests' sons carry the warning, David crosses the Jordan, Ahithophel hangs himself, and friends feed David's people at Mahanaim.
when: 'The night after David fled from Absalom'

setting: |
  Absalom's revolt grew fast: “the conspiracy was strong; for the people increased continually with Absalom” ([[2 Sam. 15:12]]). Among the conspirators was Ahithophel the Gilonite, David's own counsellor, whose counsel “was as if a man had inquired at the oracle of God” ([[2 Sam. 16:23]]). David left Jerusalem, crossed the brook Kidron and went up the Mount of Olives barefoot, weeping ([[2 Sam. 15:23]]; [[2 Sam. 15:30]]). When he was told that Ahithophel had joined Absalom he prayed, “O LORD, I pray thee, turn the counsel of Ahithophel into foolishness” ([[2 Sam. 15:31]]), and at the top of the mount ([[2 Sam. 15:32]]) he sent his friend Hushai back to the city to offer Absalom his service and so “defeat the counsel of Ahithophel” ([[2 Sam. 15:34]]). He also arranged how word would reach him: Hushai would tell Zadok and Abiathar the priests, and their sons Ahimaaz and Jonathan would carry it ([[2 Sam. 15:35–36]]).

  Absalom entered Jerusalem and asked for counsel. Ahithophel's first advice, to go in to his father's concubines before all Israel, is at [[2 Sam. 16:21–22]]. This chapter gives his second, and Hushai's answer to it. It ends with David across the Jordan at Mahanaim, the town where Saul's son Ish-bosheth had reigned ([[2 Sam. 2:8]]). The title of Psalm 3 sets that psalm in this flight, “when he fled from Absalom his son,” and the site reads it beside these chapters ([[Ps. 3:1–8]]).

thread: |
  Two counsels are laid before Absalom, and the chapter is about why the better one lost. Ahithophel's proposed to end the war in a night by killing one man. Hushai's paints Absalom's father as a bear robbed of her whelps and flatters Absalom with the picture of all Israel marching behind him, and it wins the delay David needed. The narrator then gives the reason that lies under the speech: “the LORD had appointed to defeat the good counsel of Ahithophel.” The line looks back to David's prayer on the Mount of Olives.

  The rest of the chapter shows the answer arriving by ordinary hands: the priests' sons, a servant girl, a woman who covers a well with grain. By morning not one of David's people is left on the wrong side of the Jordan. Ahithophel, seeing his counsel set aside, goes home and hangs himself, and Matthew tells the death of Judas in words close to these. At Mahanaim David's people, hungry and weary, are fed by three men from beyond the river, one of them from the Ammonite city David had conquered.

sections:
  - range: 1-4
    heading: Ahithophel's counsel
    plain: |
      Ahithophel also said to Absalom, “Let me choose twelve thousand men, and I will set out after David tonight. I will come on him while he is tired and his hands are weak, and throw him into a panic. All the people with him will flee, and I will strike down the king alone. Then I will bring all the people back to you. The man you are seeking counts as the return of them all, and all the people will be at peace.” The plan pleased Absalom and all the elders of Israel.
  - range: 5-14
    heading: Hushai's counsel
    plain: |
      Then Absalom said, “Call Hushai the Archite too, and let us hear what he has to say.” When Hushai came, Absalom told him, “This is what Ahithophel has said. Shall we do as he says? If not, you speak.” Hushai said to Absalom, “This time the counsel Ahithophel has given is not good. You know your father and his men: they are mighty men, and they are as fierce as a bear in the field robbed of her cubs. Your father is a seasoned warrior; he will not spend the night with the troops. Even now he is hidden in some pit or some other place. If some of our men fall at the first, whoever hears of it will say, ‘There has been a slaughter among Absalom's followers,’ and even the bravest man, with a heart like a lion's, will lose his nerve, for all Israel knows that your father is a mighty man and the men with him are brave.

      “So my counsel is that all Israel be gathered to you, from Dan to Beer-sheba, as many as the sand by the sea, and that you go into battle yourself. Then we will come on him wherever he is found and settle on him as the dew falls on the ground, and not one will be left of him or of all the men with him. And if he withdraws into a city, all Israel will bring ropes to that city and we will drag it into the river until not one small stone of it is left.”

      Absalom and all the men of Israel said, “The counsel of Hushai the Archite is better than the counsel of Ahithophel.” For the LORD had ordained that the good counsel of Ahithophel be defeated, so that the LORD might bring disaster on Absalom.
  - range: 15-22
    heading: The warning reaches David
    plain: |
      Hushai told Zadok and Abiathar the priests, “This is what Ahithophel advised Absalom and the elders of Israel, and this is what I advised. Now send word to David quickly: ‘Do not spend the night in the plains of the wilderness, but cross over at once, or the king and all the people with him will be swallowed up.’”

      Jonathan and Ahimaaz were waiting at En-rogel, because they could not risk being seen going into the city. A servant girl would go and tell them, and they would go and tell King David. But a young man saw them and told Absalom. The two of them left quickly and came to the house of a man in Bahurim who had a well in his courtyard, and they went down into it. The woman of the house took a covering, spread it over the mouth of the well, and scattered ground grain on it, and no one knew. When Absalom's servants came to the woman at the house and asked, “Where are Ahimaaz and Jonathan?” she told them, “They have gone over the brook.” They searched and could not find them, and went back to Jerusalem.

      After they had gone, the two came up out of the well and went and told King David, “Get up and cross the water quickly, for this is what Ahithophel has advised against you.” So David and all the people with him got up and crossed the Jordan, and by daybreak not one of them was left who had not crossed.
  - range: 23-23
    heading: Ahithophel's end
    plain: |
      When Ahithophel saw that his counsel had not been followed, he saddled his donkey and went home to his own city. He set his household in order and hanged himself, and he died and was buried in his father's tomb.
  - range: 24-26
    heading: Absalom crosses the Jordan
    plain: |
      David came to Mahanaim, and Absalom crossed the Jordan with all the men of Israel. Absalom had put Amasa over the army in Joab's place. Amasa's father was a man named Ithra, an Israelite, and his mother was Abigail the daughter of Nahash, the sister of Joab's mother Zeruiah. Israel and Absalom camped in the land of Gilead.
  - range: 27-29
    heading: Friends at Mahanaim
    plain: |
      When David came to Mahanaim, Shobi the son of Nahash, from Rabbah of the Ammonites, Machir the son of Ammiel from Lo-debar, and Barzillai the Gileadite from Rogelim brought beds, basins and clay pots; wheat, barley and flour; roasted grain, beans, lentils and roasted pulse; honey, butter, sheep, and cheese from the cattle, for David and the people with him to eat. “The people are hungry and tired and thirsty in the wilderness,” they said.

notes:
  - ref: 2
    phrase: I will smite the king only
    kind: history
    title: Strike the king only
    body: |
      Ahithophel's plan aimed at one life. He asked for twelve thousand chosen men to set out “this night,” to come on David while he was “weary and weak handed,” throw his small band into a panic and kill the king alone. The people, he reckoned, with no one left to follow, would come back to Absalom, and there would be no war. Absalom and the elders liked it, and the narrator calls it “good” (verse 14). It was as dangerous as it sounded: twelve thousand men against the few who had fled with David could have been a disaster for him, and he was saved because Hushai won a delay and warned him to cross the river.

      The middle of verse 3 is hard to follow in the King James: “the man whom thou seekest is as if all returned.” The Septuagint gives the plan an image instead: “I will bring back all the people to thee, as a bride returns to her husband: only thou seekest the life of one man, and all the people shall have peace.” Modern translations read it the same way. On either reading the proposal is the same: kill David, and the kingdom comes home to Absalom without a battle.
    sources: [lds-scriptures, ot-manual-2-samuel-13, lxx-rahlfs, esv, nrsvue]

  - ref: 14
    phrase: the LORD had appointed to defeat the good counsel of Ahithophel
    kind: history
    title: Why Hushai's counsel won
    body: |
      The narrator gives two reasons Hushai's counsel carried the day, one in the speech and one in the sentence after it. Ahithophel's word was taken as an oracle ([[2 Sam. 16:23]]), and Hushai did not call his counsel bad, only not good “at this time” (verse 7). Then he painted two pictures. In the first, David and his men are “chafed in their minds,” like a bear robbed of her whelps; David is a man of war who will not sleep among the troops and is surely hidden in some pit; let a few of Absalom's men fall at the first and the bravest heart will melt. In the second, all Israel from Dan to Beer-sheba, as the sand of the sea, with Absalom at its head, falls on David as the dew falls; one older reading pictures innumerable drops settling “unseen and unheard.” If David shelters in a city, all Israel will bring ropes and drag the city into the river, an “extravagant hyperbole” for an irresistible force. On that reading the plan was “cleverly devised to appeal to Absalom's vanity and love of display,” and it gained the one thing David most needed, time. The site's note at [[Micah 5:7]] reads Micah's dew beside Hushai's.

      Then the narrator says why it worked: “the LORD had appointed to defeat the good counsel of Ahithophel.” The line looks back to the prayer David made as he went up the Mount of Olives: “O LORD, I pray thee, turn the counsel of Ahithophel into foolishness” ([[2 Sam. 15:31]]). In the same hour David had sent Hushai back to the city, saying, “then mayest thou for me defeat the counsel of Ahithophel” ([[2 Sam. 15:34]]), and the narrator now uses those words of the LORD. The text does not call Ahithophel's counsel foolish. It calls it good, and says the LORD defeated it through a friend's speech and Absalom's own choice. One older reading sees the prayer fulfilled when Ahithophel, knowing what the delay meant, went home to die (verse 23).
    sources: [lds-scriptures, cambridge-1-samuel, keil-1-samuel]

  - ref: 17
    phrase: a wench went and told them
    kind: words
    title: A servant girl and a woman at Bahurim
    body: |
      The warning reached David by a chain he had laid out himself as he left Jerusalem: Hushai would tell Zadok and Abiathar the priests, and their sons, Ahimaaz and Jonathan, would carry the word to him ([[2 Sam. 15:35–36]]). The young men could not be seen going into the city, so they waited outside at En-rogel, and a servant girl brought the message to them. The King James' “wench” renders *šip̄ḥâ*, “maid, maid-servant,” a word used especially of menial service. It is also the word Ruth uses of herself before Boaz, in humility, “thine handmaid” ([[Ruth 2:13]]); the Hebrew has none of the slight that “wench” can carry now.

      Even so, a lad saw the two men and told Absalom, and the escape turned on a second woman the text does not name. At Bahurim the two went down into a well in a courtyard; she spread a covering over its mouth and ground corn on top, and sent Absalom's servants off with “They be gone over the brook of water.” When the searchers had gone the two came up and reached David in time, and by morning “there lacked not one of them that was not gone over Jordan.”
    sources: [bdb, lds-scriptures]

  - ref: 23
    phrase: put his household in order, and hanged himself
    kind: scripture
    title: Ahithophel and Judas
    body: |
      The text ties Ahithophel's death to one thing: he “saw that his counsel was not followed.” He seems to have understood what the delay meant. Absalom would lose, David would come back to the throne, and a counsellor who had betrayed the king could expect a traitor's fate. So he went home to Giloh ([[2 Sam. 15:12]]), set his affairs in order, and hanged himself. It was a private death, not an execution. On one Latter-day Saint reading, though, the Old Testament's stories of hanging share a pattern that his fits: the man hanged is one who has set himself against the ruler, as Ahithophel did when he joined Absalom. He is reckoned Bath-sheba's grandfather (the note at [[2 Sam. 15:31]]); the text never connects that to his turning.

      The New Testament tells the death of another betrayer in words close to this verse's. Judas, after the betrayal, “departed, and went and hanged himself” ([[Matt. 27:5]]). They are the only two men in the Bible who hang themselves, and Matthew's Greek shares with the Greek of this verse the words for “went away” (*aperchomai*) and “hanged himself” (*apanchomai*), a pair no other passage has together. John has Jesus apply to Judas the psalm of a familiar friend “which did eat of my bread” and “hath lifted up his heel against me” ([[Ps. 41:9]]; [[John 13:18]]). On another Latter-day Saint reading, that psalm puts David's complaint of Ahithophel into words (the note at [[Ps. 41:9]]), and the Gospel writers told the story “so that Jesus and Judas would mirror King David and Ahithophel.”
    sources: [lds-scriptures, ot-manual-2-samuel-13, belnap-fell-tree, bd-ahithophel, hatch-his-friend-judas]

  - ref: 25
    phrase: Absalom made Amasa captain of the host instead of Joab
    kind: history
    title: Amasa, cousin to Joab
    body: |
      Absalom's new commander was David's own kin. Amasa's mother Abigail was the sister of Zeruiah, Joab's mother, and Chronicles counts both women as sisters of Jesse's sons, so that Amasa was David's nephew and Joab's cousin ([[1 Chr. 2:16–17]]). Chronicles calls his father “Jether the Ishmeelite,” where this verse has “Ithra an Israelite,” and this verse calls Abigail “the daughter of Nahash” where Chronicles makes her a sister of Jesse's sons; the text does not say how the two fit.

      The appointment is told here because the story will come back to it. After Absalom's death David offers Amasa command of the host “in the room of Joab” ([[2 Sam. 19:13]]), and Joab, greeting him as “my brother,” kills him with the sword in his hand ([[2 Sam. 20:9–10]]). The note at [[2 Sam. 3:27]] tells how Joab had dealt with another commander who stood in his way.
    sources: [lds-scriptures, bd-amasa]

  - ref: 27
    phrase: Shobi the son of Nahash of Rabbah of the children of Ammon
    kind: history
    title: Friends beyond the Jordan
    body: |
      Three men from east of the Jordan fed David's people at Mahanaim: one from the Ammonite city David had conquered, one who had sheltered Jonathan's son, and one David remembered on his deathbed. At Mahanaim, once the seat of Ish-bosheth's kingdom ([[2 Sam. 2:8]]), they brought bedding, basins, pottery and food, “for they said, The people is hungry, and weary, and thirsty, in the wilderness.” One older reading takes it as the first sign that not all the people had fallen away from David.

      Shobi came from Rabbah, the Ammonite city David had taken ([[2 Sam. 12:29]]). The same older reading suggests he was a son of Nahash the Ammonite king and brother of Hanun, whose insult had begun that war ([[2 Sam. 10:1–4]]), and one to whom David showed favor when the city fell, though it allows that he may have been an Israelite living there. Machir of Lo-debar was the man in whose house Jonathan's lame son had lived ([[2 Sam. 9:4]]). Barzillai the Gileadite, “a very aged man, even fourscore years old,” “had provided the king of sustenance while he lay at Mahanaim” ([[2 Sam. 19:32]]), and David remembered it at his death: “shew kindness unto the sons of Barzillai the Gileadite … for so they came to me when I fled because of Absalom thy brother” ([[1 Kgs. 2:7]]).
    sources: [keil-1-samuel, lds-scriptures]

christ: |
  Matthew and John tell the betrayal of the Son of David in words that recall this chapter: Judas, the friend who ate bread with Jesus, went and hanged himself as Ahithophel did, and on one Latter-day Saint reading the Gospels were written so that Judas would mirror David's counsellor (the note at verse 23). In this chapter David's prayer against a counsel he could not answer is answered by the LORD, through a friend's speech and the errands of servants. The Lord has said that “the works, and the designs, and the purposes of God cannot be frustrated,” and that “it is not the work of God that is frustrated, but the work of men” ([[D&C 3:1–3]]). A disciple who prays as David did, and does what lies in his own hands as David did when he sent Hushai, prays to that God, and the answer may come as David's did, through ordinary people doing ordinary errands.

