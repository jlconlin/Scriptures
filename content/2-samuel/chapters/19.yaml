  - **Shimei's end.** [[1 Kgs. 2:8–9]]; [[1 Kgs. 2:36–46]].
  - **The rift widens.** [[2 Sam. 20:1–22]], Sheba's revolt; [[1 Kgs. 12:1–20]], the kingdom divided.

