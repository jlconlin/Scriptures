chapter: 19
title: Return Thou, and All Thy Servants
tagline: Joab rouses the weeping king; Judah calls David home; at the Jordan he pardons Shimei, hears Mephibosheth, and parts from Barzillai; and Israel and Judah quarrel over who has the better right in him.
when: 'After the death of Absalom, as David returned over Jordan'

setting: |
  Chapter 18 ended with Absalom dead in the wood, Joab's three darts in his heart against the king's command ([[2 Sam. 18:14]]), and David weeping in the chamber over the gate at Mahanaim ([[2 Sam. 18:33]]). The battle had saved the king's life and his household (verse 5), but the king was still in exile. The tribes had anointed Absalom over them (verse 10), and the revolt had begun at Hebron ([[2 Sam. 15:10]]), where David had first reigned over the house of Judah ([[2 Sam. 2:11]]).

  This chapter is the way home. Joab rouses the king from his mourning (verses 1–8); the tribes argue about bringing him back, and David wins over Judah (9–15). At the Jordan he meets, one after another, three men from his flight: Shimei, who had cursed him and thrown stones ([[2 Sam. 16:5–13]]); Mephibosheth, whose servant Ziba had accused him of hoping for his grandfather's kingdom ([[2 Sam. 16:3–4]]); and Barzillai of Gilead, who had provided for the king at Mahanaim ([[2 Sam. 17:27–29]]). It ends with the men of Israel and the men of Judah quarrelling over the king, and the next chapter's revolt grows out of that quarrel ([[2 Sam. 20:1–2]]).

thread: |
  The chapter is a homecoming, and at every stage someone asks what the king owes. Joab says he owes the men who saved his life. Judah is asked why it is last to bring him home, and Israel why it was not first. Shimei, Mephibosheth and Barzillai each come to the river with a claim on him, and David's answer to Abishai there is that no man shall die that day.

  Each settlement stores up something for later. The rebel general Amasa is given Joab's place, and Joab kills him in the next chapter. Shimei is sworn safe, yet on his deathbed David tells Solomon not to hold him guiltless. Mephibosheth's land is divided with the servant he says deceived him, and Barzillai's reward passes to Chimham, and at David's death to the sons of Barzillai. The welcome itself splits the tribes, and Sheba's revolt grows out of the quarrel.

sections:
  - range: 1-8
    heading: Joab rouses the king
    plain: |
      Joab was told, “The king is weeping and mourning for Absalom.” So the victory that day became mourning for all the people, because they heard that the king was grieving for his son. The people crept into the city that day as soldiers creep in who are ashamed because they fled in battle. The king covered his face and cried aloud, “O my son Absalom, O Absalom, my son, my son!”

      Joab came into the house to the king and said, “Today you have put to shame all your servants, who today saved your life and the lives of your sons and daughters, your wives and your concubines. You love those who hate you and hate those who love you. You have made it plain today that commanders and servants are nothing to you; I can see now that if Absalom were alive and all of us were dead today, you would be pleased. Now get up, go out, and speak to the hearts of your servants. I swear by the LORD that if you do not go out, not one man will stay with you tonight, and that will be worse for you than all the evil that has come on you from your youth until now.” Then the king got up and sat in the gate. The people were told, “The king is sitting in the gate,” and they all came before him. Israel had fled, each man to his tent.
  - range: 9-15
    heading: Judah brings the king back
    plain: |
      All through the tribes of Israel the people argued with one another: “The king saved us from our enemies and rescued us from the Philistines, and now he has fled the land because of Absalom. Absalom, whom we anointed over us, is dead in battle. So why are you saying nothing about bringing the king back?”

      King David sent word to Zadok and Abiathar the priests: “Say to the elders of Judah, ‘Why should you be the last to bring the king back to his house, when what all Israel is saying has reached the king? You are my brothers, my own bone and flesh; why should you be the last to bring back the king?’ And say to Amasa, ‘Are you not my bone and my flesh? May God deal with me, and worse, if you are not commander of my army from now on in Joab's place.’” So he turned the hearts of all the men of Judah as one man, and they sent to the king: “Come back, you and all your servants.” The king came back as far as the Jordan, and Judah came to Gilgal to meet him and bring him across.
  - range: 16-23
    heading: Shimei pardoned
    plain: |
      Shimei the son of Gera, the Benjamite from Bahurim, hurried down with the men of Judah to meet King David. A thousand men of Benjamin were with him, and Ziba, the steward of Saul's house, with his fifteen sons and twenty servants; they rushed down to the Jordan ahead of the king. A ferry boat went over to bring the king's household across and do whatever he wished. As the king was crossing the Jordan, Shimei fell down before him and said, “Let not my lord hold me guilty, and do not remember the wrong your servant did the day my lord the king left Jerusalem; let the king not take it to heart. Your servant knows that I have sinned. That is why I have come today, the first of all the house of Joseph, to come down and meet my lord the king.”

      Abishai the son of Zeruiah said, “Shall not Shimei be put to death for this, since he cursed the LORD's anointed?” David said, “What have I to do with you, sons of Zeruiah, that you should be my adversaries today? Shall anyone be put to death in Israel today? Do I not know that today I am king over Israel?” And the king said to Shimei, “You shall not die,” and swore it to him.
  - range: 24-30
    heading: Mephibosheth's defense
    plain: |
      Mephibosheth the son of Saul came down to meet the king. He had not cared for his feet, trimmed his beard or washed his clothes from the day the king left until the day he came home safely. When he came from Jerusalem to meet the king, the king asked him, “Why did you not go with me, Mephibosheth?”

      He answered, “My lord the king, my servant deceived me. I said, ‘I will have an ass saddled, so that I can ride on it and go with the king,’ for your servant is lame. And he has slandered your servant to my lord the king. But my lord the king is like an angel of God; do whatever seems good to you. All my father's house deserved nothing but death from my lord the king, yet you set your servant among those who ate at your own table. What right do I have to cry out to the king any more?” The king said to him, “Why speak any more of your affairs? I have decided: you and Ziba divide the land.” Mephibosheth said to the king, “Let him take it all, now that my lord the king has come home safely.”
  - range: 31-40
    heading: Barzillai and Chimham
    plain: |
      Barzillai the Gileadite came down from Rogelim and went on to the Jordan with the king, to see him across. Barzillai was very old, eighty years, and he had provided for the king while he stayed at Mahanaim, for he was a very wealthy man. The king said to Barzillai, “Come over with me, and I will provide for you at my side in Jerusalem.”

      Barzillai answered the king, “How many years have I left, that I should go up with the king to Jerusalem? I am eighty years old today. Can I tell good from bad? Can your servant taste what I eat or drink? Can I still hear the voices of singing men and singing women? Why should your servant be a further burden to my lord the king? Your servant will go a little way over the Jordan with the king; why should the king repay me with such a reward? Please let your servant go back, so that I may die in my own town, near the grave of my father and my mother. But here is your servant Chimham; let him go over with my lord the king, and do for him whatever seems good to you.” The king answered, “Chimham shall go over with me, and I will do for him whatever seems good to you; and whatever you ask of me, I will do for you.”

      Then all the people crossed the Jordan, and when the king had crossed, he kissed Barzillai and blessed him, and Barzillai went back to his home. The king went on to Gilgal, and Chimham went with him. All the people of Judah, and half the people of Israel, brought the king on his way.
  - range: 41-43
    heading: Israel and Judah quarrel
    plain: |
      Then all the men of Israel came to the king and said, “Why have our brothers the men of Judah stolen you away, and brought the king and his household over the Jordan, and all David's men with him?” All the men of Judah answered the men of Israel, “Because the king is our close kin. Why are you angry about it? Have we eaten anything at the king's expense, or has he given us any gift?” The men of Israel answered the men of Judah, “We have ten shares in the king, and in David we have more right than you. Why then did you despise us? Were we not the first to speak of bringing back our king?” But the words of the men of Judah were fiercer than the words of the men of Israel.

notes:
  - ref: 7
    phrase: speak comfortably unto thy servants
    kind: history
    title: Speak to the heart of thy servants
    body: |
      Joab told the king that his grief had become a public wrong, and on the Church's reading he was right to say so. The men who had fought for David came back into the city by stealth, like soldiers ashamed of running from a battle (verses 2–3), because their king was mourning the enemy they had beaten. Joab put it bluntly: David loved his enemies and hated his friends, and would have been content if Absalom had lived and all of them had died (verse 6). What he asked was that the king “speak comfortably” to his servants, and he swore that otherwise not a man would stay with him that night. David went out and sat in the gate, and the people came before him (verse 8).

      Both sides of the scene are true. David “nearly lost the kingdom by insulting those who had defended him”; Joab's counsel was “needed and justified,” but his words were harsh and disrespectful, and they probably helped decide David to replace him (verse 13). Joab was also the man who had killed Absalom against the king's word ([[2 Sam. 18:14]]). David's lament itself is read at [[2 Sam. 18:33]].
    sources: [ot-manual-2-samuel-13, lds-scriptures]

  - ref: 13
    phrase: captain of the host before me continually in the room of Joab
    kind: history
    title: Amasa in the room of Joab
    body: |
      David's promise to Amasa was a bold stroke of policy, and on one older reading an unwise one. Amasa had commanded Absalom's army ([[2 Sam. 17:25]], where his kinship to David and Joab is set out). Through the priests Zadok and Abiathar, David asked the elders of Judah, his own “bone” and “flesh,” why they were the last to bring the king home, and he promised Amasa the command of the host for good, in Joab's place. The appeal worked: “he bowed the heart of all the men of Judah, even as the heart of one man” (verse 14).

      The same older reading sees two aims in the promise: to secure the allegiance of the rebel army, and to punish Joab for killing Absalom in defiance of the king's command. “But it was hardly prudent. Joab was certain not to submit to it tamely: Amasa's military skill was probably inferior, and his loyalty remained to be proved.” The next chapter tells what followed. When Sheba rebelled, Amasa was slow to gather the men of Judah ([[2 Sam. 20:4–5]]), and Joab, greeting him as “my brother,” killed him with the sword in his hand ([[2 Sam. 20:9–10]]). David counted that death against Joab at the end of his life ([[1 Kgs. 2:5]]).
    sources: [cambridge-1-samuel, bd-amasa, lds-scriptures]

  - ref: 22
    phrase: shall there any man be put to death this day in Israel?
    kind: history
    title: No man put to death this day
    body: |
      David's answer to Abishai makes the day he is king again a day without executions, and the pardon it gave Shimei is read two ways. Shimei had confessed, “thy servant doth know that I have sinned” (verse 20), and Abishai asked that he die “because he cursed the LORD’s anointed” (verse 21), as he had asked on the road out. David called the sons of Zeruiah his adversaries, in Hebrew *śāṭān*, an opponent who stands in the way, here one who would draw him into evil, and asked, “do not I know that I am this day king over Israel?” He swore to Shimei that he should not die (verse 23).

      On a Latter-day Saint reading, David “returns to Jerusalem and shows clemency to those who had rebelled against him.” Yet the pardon was sworn but not final: at his death David reminded Solomon of the oath and added, “Now therefore hold him not guiltless” ([[1 Kgs. 2:8–9]]). One older reading judges from that charge that David had not really forgiven Shimei, and that the favour shown here was “only a sign of David's weakness.” Shimei's cursing, his plea here and his end are told together at [[2 Sam. 16:10]].
    sources: [taggart-sworn-david, keil-1-samuel, lds-scriptures]

  - ref: 26
    phrase: my servant deceived me
    kind: history
    title: Ziba or Mephibosheth?
    body: |
      Two accounts of Mephibosheth's loyalty stand side by side, and the king who heard both did not say which was true. When David fled, Ziba met him with asses and provisions and said that his master had stayed in Jerusalem, expecting Israel to “restore me the kingdom of my father,” and David gave Ziba everything that was Mephibosheth's ([[2 Sam. 16:3–4]]). Now Mephibosheth says his servant deceived him: he had meant to have an ass saddled and ride with the king, “because thy servant is lame,” and Ziba had slandered him (verses 26–27). On one older reading, Ziba took the saddled asses, loaded them with provisions, and went to meet David “with his fictitious story,” leaving his master behind.

      The narrator adds one thing before either man speaks. Mephibosheth had not dressed his feet, trimmed his beard or washed his clothes from the day the king left until he came again in peace (verse 24). The Bible Dictionary heads the two passages “Ziba’s slander” and “his defense.” One older commentary reads the neglect of his person as “outward signs of extreme grief,” and another judges that his mourning put Ziba's slander “beyond all doubt.”

      David's answer was to divide the land (verse 29). The older readings take it either as a compromise, made because David suspected Mephibosheth's story or would not alienate Ziba, or as a return to the first arrangement, in which Ziba farmed the land for his master ([[2 Sam. 9:10]]). Mephibosheth's own reply asks for nothing: “let him take all, forasmuch as my lord the king is come again in peace unto his own house” (verse 30). The kindness that had set him at the king's table is at [[2 Sam. 9:7]].
    sources: [lds-scriptures, cambridge-1-samuel, keil-1-samuel, bd-mephibosheth]

  - ref: 33
    phrase: I will feed thee with me in Jerusalem
    kind: history
    title: Barzillai's kindness repaid
    body: |
      David's offer repaid kindness with kindness, and when Barzillai declined it the debt passed to his house. The old Gileadite had “provided the king of sustenance” at Mahanaim (verse 32; the note at [[2 Sam. 17:27]]), and David answered, “I will feed thee with me in Jerusalem.” The Hebrew has one verb for both, *kilkēl*, to sustain or nourish: David offered to do for Barzillai in Jerusalem what Barzillai had done for him in exile, the “recompense” Barzillai calls too great a reward (verse 36). Barzillai answered that at eighty he could no longer taste what he ate or hear the singing men and singing women, that he would only be a burden, and that he wanted to die in his own city by the grave of his father and mother. He offered Chimham to go in his place (verses 34–37), and David kissed him and blessed him at the river (verse 39).

      The chapter does not name the kindness, but David named it at the end of his life. *Ḥesed*, loyal covenant kindness, governed his political relationships as well as his covenant with Jonathan, and on his deathbed he charged Solomon ([[1 Kgs. 2:7]]) to do *ḥesed*, to “shew kindness,” to the sons of Barzillai and let them eat at his table, as he had once set Jonathan's son at his own table ([[2 Sam. 9:7]]). The “habitation of Chimham” by Bethlehem, in Jeremiah's day, is at [[Jer. 41:17]].
    sources: [bdb, belnap-hesed, lds-scriptures]

  - ref: 43
    phrase: We have ten parts in the king
    kind: history
    title: Ten parts in the king
    body: |
      The quarrel that closes the chapter sets Judah against the other tribes over who has the better right in David, and the Church's reading traces the later division of the kingdom to the same rift. The men of Israel had spoken first of bringing the king back (verses 9–10), but Judah brought him over the Jordan, and the others came to Gilgal complaining that Judah had “stolen thee away” (verse 41). Judah answered that the king was their near kin; Israel answered that it had “ten parts in the king,” the Hebrew word for hand used in its sense of a share, and more right in David than Judah (verse 43). The other tribes felt that Judah “was monopolizing David,” and the incident “portended a whole new round of revolution.”

      The revolt came at once: the next chapter opens with Sheba's cry, “We have no part in David” (the note at [[2 Sam. 20:1]]). The same animosity “resulted in the eventual division of the house of Israel”: when Rehoboam refused the northern tribes, they answered him, “What portion have we in David?” and “there was none that followed the house of David, but the tribe of Judah only” ([[1 Kgs. 12:16]]; [[1 Kgs. 12:20]]).
    sources: [ot-manual-2-samuel-13, bdb, lds-scriptures]

christ: |
  David came home a king who had needed mercy himself. On the road out, under Shimei's curses ([[2 Sam. 16:5–13]]), he “craves the loving-kindness, mercy, and forgiveness of God”; on the road back he swore that the man who cursed him should not die (verse 23). Through all David's failures God never abandoned him or the covenant made with him ([[2 Sam. 7:12–16]]), and the covenant is kept in Jesus, the “son of David” to whom people in the New Testament called when they sought mercy or healing, who “is simultaneously the promisor and the fulfillment of the promise.” A disciple who comes back after a season of his own folly comes back to that King, and “those who repent find the mercy and divine help that are always available.”

