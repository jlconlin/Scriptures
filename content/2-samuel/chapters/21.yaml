chapter: 21
title: Wherewith Shall I Make the Atonement?
tagline: A famine is laid to Saul's broken oath with the Gibeonites; seven of his sons die for it, Rizpah guards their bodies until the rain, David buries Saul's house, and four giants of Gath fall to David's servants.
when: 'In the days of David'

setting: |
  With chapter 21 the story of David's reign is over, and the book turns to a close made of several pieces: two judgments on the land and how each was lifted (21:1–14 and chapter 24), David's song and his last words (chapters 22 and 23:1–7), and brief records of his warriors (21:15–22; 23:8–39). They are not told in order of time. The famine most probably came earlier in the reign and is told here because no earlier place suited it. The chapter gives no time but “in the days of David”; it came after David had found Jonathan's son Mephibosheth (chapter 9), since he spares him, and probably before Absalom's revolt, but it cannot be dated more closely.

  The famine reaches back to the oath of peace Israel's princes swore to the Gibeonites in the book of Joshua ([[Josh. 9:19]]; the note at verse 1). Saul broke it, in a deed that scripture records nowhere but here.

  The battles of verses 15–22 are told again, a little differently, in [[1 Chr. 20:4–8]].

thread: |
  The chapter turns on two oaths sworn in the LORD's name. Israel's oath to the Gibeonites had been broken by Saul, and the land went hungry for three years. David's oath to Jonathan is kept: when the Gibeonites ask for Saul's sons, Jonathan's son is spared (verse 7). Between the two comes a hard scene. David asks how he may make atonement, the Gibeonites name seven lives, and he gives them. The LORD named the cause of the famine; the remedy was the Gibeonites' demand, and the Church's Student Manual does not read it as a revelation from the Lord (the note at verse 6).

  Then a mother is heard of. Rizpah keeps the birds and beasts from her dead through the whole dry season, and when David hears of it he brings home the bones of Saul and Jonathan and buries Saul's house in its family tomb. Only “after that,” the narrator says, was God entreated for the land. The chapter ends with David faint in battle and rescued, and the last of the giants of Gath falling to his men.

sections:
  - range: 1-6
    heading: The famine and the Gibeonites
    plain: |
      In David's time there was a famine for three years running, and David sought the LORD about it. The LORD answered, “It is because of Saul and his bloodstained house, because he put the Gibeonites to death.”

      The king called the Gibeonites and spoke with them. (The Gibeonites were not Israelites but a remnant of the Amorites. The Israelites had sworn an oath to spare them, but Saul, in his zeal for Israel and Judah, had tried to wipe them out.) David asked them, “What shall I do for you? How shall I make atonement, so that you will bless the LORD's inheritance?”

      The Gibeonites answered, “We want no silver or gold from Saul or his house, and we do not ask you to put anyone in Israel to death for us.” “Whatever you say,” David said, “I will do for you.” They answered, “The man who destroyed us and plotted to wipe us out, so that we would have no place anywhere in Israel's territory: let seven of his sons be handed over to us, and we will execute them and expose them before the LORD at Gibeah of Saul, the LORD's chosen.” The king said, “I will hand them over.”
  - range: 7-9
    heading: Seven of Saul's house
    plain: |
      But the king spared Mephibosheth, the son of Jonathan son of Saul, because of the oath before the LORD between David and Jonathan. He took the two sons whom Rizpah the daughter of Aiah had borne to Saul, Armoni and Mephibosheth, and the five sons of Michal the daughter of Saul, whom she had borne to Adriel the son of Barzillai of Meholah, and handed them over to the Gibeonites. They executed them on the hill before the LORD, and all seven died together. They were put to death in the first days of harvest, at the beginning of the barley harvest.
  - range: 10-14
    heading: Rizpah's watch and the burial of Saul's house
    plain: |
      Rizpah the daughter of Aiah took sackcloth and spread it out for herself on the rock. From the beginning of harvest until the rain poured down on the bodies from the sky, she let no bird settle on them by day and no wild animal come near them by night.

      When David was told what Rizpah, Saul's concubine, had done, he went and took the bones of Saul and of his son Jonathan from the men of Jabesh-gilead, who had stolen them from the square of Beth-shan, where the Philistines had hung them on the day they killed Saul at Gilboa. He brought up the bones of Saul and Jonathan from there, and the bones of the men who had been executed were gathered too. They buried the bones of Saul and Jonathan in the land of Benjamin, at Zelah, in the tomb of Saul's father Kish, and did all that the king commanded. After that, God answered prayer for the land.
  - range: 15-17
    heading: David rescued
    plain: |
      Once more there was war between the Philistines and Israel. David went down with his men and fought the Philistines, and David grew exhausted. Ishbi-benob, one of the descendants of the giant, whose spear weighed three hundred shekels of bronze and who was armed with a new sword, meant to kill David. But Abishai the son of Zeruiah came to his help, struck the Philistine and killed him. Then David's men swore to him, “You shall not go out with us to battle again, so that you do not put out the lamp of Israel.”
  - range: 18-22
    heading: The giants of Gath fall
    plain: |
      After this there was another battle with the Philistines at Gob. There Sibbechai the Hushathite killed Saph, another of the descendants of the giant. In another battle with the Philistines at Gob, Elhanan the son of Jaare-oregim of Bethlehem killed the brother of Goliath the Gittite, whose spear shaft was like a weaver's beam. In yet another battle, at Gath, there was a huge man with six fingers on each hand and six toes on each foot, twenty-four in all; he too was descended from the giant. When he taunted Israel, Jonathan, the son of David's brother Shimea, killed him. These four were descendants of the giant in Gath, and they fell by the hand of David and of his servants.

notes:
  - ref: 1
    phrase: It is for Saul, and for his bloody house
    kind: history
    title: A famine for a broken oath
    body: |
      The LORD's answer lays the famine on a broken oath. Israel's princes had sworn peace to the Gibeonites in the LORD's name, and had kept the oath even when they learned it was won by a trick ([[Josh. 9:19]]; the Church's footnote at “Gibeonites” in verse 2 sends the reader back to that chapter). Saul broke it. Verse 2 gives the only reason the text gives: he sought to destroy them “in his zeal to the children of Israel and Judah.” The town itself, once a Hivite city, lay in the hills of Benjamin, Saul's own tribe ([[1 Sam. 9:1–2]]), about five miles north of Jerusalem.

      The LORD calls Saul's house “bloody,” guilty of blood, and the law said what blood did to a land: “blood it defileth the land: and the land cannot be cleansed of the blood that is shed therein, but by the blood of him that shed it” ([[Num. 35:33]]). What David did about it, and how the Church's sources judge it, is at verse 6.
    sources: [lds-scriptures, bd-gibeon]

  - ref: 3
    phrase: wherewith shall I make the atonement
    kind: words
    title: Atonement for blood
    body: |
      David's word is the Old Testament's word for atonement, *ʾăkappēr* (I will make atonement), from *kipper*, and here it is used of blood-guilt, not of a sacrifice. The Hebrew lexicon lists this verse among the atonements made by men and glosses it “with what shall I cover over,” the thing to be covered being the blood-guilt of Saul's house; it adds that the answer was “a death penalty of seven sons of the guilty house.” The Gibeonites refuse a payment: “We will have no silver nor gold of Saul, nor of his house” (verse 4).

      The site follows the word *kipper* through Numbers, to the law that no ransom may be taken for a murderer's life and on to Amulek's reasoning from it, on the page [Between the Dead and the Living](/numbers/themes/between-the-dead-and-the-living/), which takes up this verse.
    sources: [oshb-wlc, bdb, lds-scriptures]

  - ref: 6
    phrase: we will hang them up unto the LORD
    kind: history
    title: Seven sons for their father’s sin?
    body: |
      The text separates the cause from the cure. The LORD named the cause of the famine (verse 1); the seven lives were the Gibeonites' demand, and David granted it (verses 4–6). He spared Jonathan's son Mephibosheth for the oath between them (verse 7; on that oath, [[2 Sam. 9:7]]).

      “Hang them up” is not the ordinary Hebrew word for hanging. The verb here, *yāqaʿ*, names “some solemn form of execution, but meaning uncertain”; the ancient versions render it as exposing or crucifying the dead, and some translators as impaling. The same verb is used at [[Num. 25:4]], and here too the execution is “unto the LORD” and “before the LORD” (verses 6, 9).

      The Church's footnote at “sons” sends the reader to the law: “The fathers shall not be put to death for the children, neither shall the children be put to death for the fathers: every man shall be put to death for his own sin” ([[Deut. 24:16]]). Judged by that law, the deed was not the Lord's: the law “would have not permitted sons to be put to death for the guilt of a father,” and “it cannot have been a revelation from the Lord that either required or approved this deed.” The Church's Student Manual sets it in a time of David's spiritual decline and calls the closing line, “God was entreated for the land,” “apostate theology.” The episode is counted among the places where the Lord “seemingly commissions the slaughter of Saul's seed,” and yet “the persistent thread of the narrative reveals God's loyalty to David and his descendants.”
    sources: [lds-scriptures, oshb-wlc, bdb, ot-manual-2-samuel-13, taggart-sworn-david]

  - ref: 8
    phrase: the five sons of Michal the daughter of Saul
    kind: words
    title: Michal or Merab?
    body: |
      The name “Michal” here is a slip for her sister Merab. Merab was the daughter Saul had promised to David and then gave “unto Adriel the Meholathite to wife” ([[1 Sam. 18:19]]); Michal, David's wife, “had no child unto the day of her death” ([[2 Sam. 6:23]]).

      The King James “whom she brought up for Adriel” smooths the difficulty, as if Michal had raised her sister's children. The Hebrew does not say that: the verb is *yālədâ*, “she bore,” the same word the verse uses of Rizpah's sons, “whom she bare unto Saul.” Those two sons of Rizpah were Armoni and a second Mephibosheth, not Jonathan's son, whom verse 7 has just spared.
    sources: [bd-michal, lds-scriptures, oshb-wlc, hilton-motherhood-ot]

  - ref: 10
    phrase: Rizpah the daughter of Aiah took sackcloth
    kind: history
    title: Rizpah’s watch
    body: |
      Rizpah was Saul's concubine (the woman over whom Ish-bosheth quarreled with Abner, [[2 Sam. 3:7]]), and two of the seven were her sons. The law said that the body of an executed man “shall not remain all night upon the tree, but thou shalt in any wise bury him that day … that thy land be not defiled” ([[Deut. 21:23]]). These bodies were left exposed, which perhaps makes her vigil all the more striking: she protected sons she could no longer save. She stayed “from the beginning of harvest until water dropped upon them out of heaven,” from the barley harvest in April until the rains ended the drought in the autumn, a watch of perhaps six months, by day against the birds and by night against the beasts.

      The text sets her watch and David's act side by side. What she had done “was told David” (verse 11), and he went and brought the bones of Saul and Jonathan from Jabesh-gilead, whose men had taken the bodies down from the wall of Beth-shan and buried them under a tree ([[1 Sam. 31:11–13]]). With them were gathered the bones of the seven, and Saul's house was laid in the tomb of Kish his father. The famine's end is placed there: “And after that God was entreated for the land” (verse 14).
    sources: [hilton-motherhood-ot, lds-scriptures]

  - ref: 16
    phrase: which was of the sons of the giant
    kind: history
    title: The sons of the giant
    body: |
      “The giant” is *hārāpâ*, “the Rapha.” Verse 22 counts four men of Gath descended from him, and the Bible Dictionary puts Goliath in the same family: “Raphah of Gath was said to be the father of several giants of whom Goliath was one.”

      In each story told here, another man kills the giant. Ishbi-benob, whose spear weighed three hundred shekels of brass, nearly killed him when he “waxed faint,” and Abishai killed the Philistine. Sibbechai, Elhanan and David's nephew Jonathan killed the other three, and the text sums them up as fallen “by the hand of David, and by the hand of his servants.” Chronicles tells the same battles and calls the second giant Sippai ([[1 Chr. 20:4–8]]).
    sources: [oshb-wlc, bd-giants, lds-scriptures]

  - ref: 17
    phrase: that thou quench not the light of Israel
    kind: symbol
    title: The light of Israel
    body: |
      David's men swore that he would go out to battle with them no more, because his life was Israel's lamp, and a lamp put out was a picture of calamity. In one older reading, David became the light of Israel because the LORD was his light, as he says in the next chapter, “thou art my lamp, O LORD: and the LORD will lighten my darkness” ([[2 Sam. 22:29]]); the king's life was a light “which the grace of God had kindled for the benefit of Israel,” and he was not to risk putting it out. Another older reading notes that the title suits a king of all Israel, so the incident may come from the Philistine wars early in his reign ([[2 Sam. 5:17–25]]).

      The Church's footnote points to a later scene in which the people keep David from the field for the same reason: “thou art worth ten thousand of us” ([[2 Sam. 18:3]]).
    sources: [keil-1-samuel, cambridge-1-samuel, lds-scriptures]

  - ref: 19
    phrase: slew the brother of Goliath the Gittite
    kind: history
    title: Elhanan and Goliath
    body: |
      As the Hebrew stands, verse 19 says that Elhanan of Bethlehem killed Goliath the Gittite, whom [[1 Sam. 17:49–51]] says David killed. The King James words “the brother of” are printed in italics because they are not in the Hebrew. They are supplied from Chronicles, which reads: “Elhanan the son of Jair slew Lahmi the brother of Goliath the Gittite, whose spear staff was like a weaver's beam” ([[1 Chr. 20:5]]).

      The difference has two possible explanations: “the reference is probably to a different man of the same name, or some error may have crept into the text.” One older reading finds signs of a copying slip there. The second half of the name Jaare-oregim is *ʾōrĕgîm*, “weavers,” the word at the end of the same verse, copied in by mistake; and in Hebrew letters the words for the Beth-lehemite, Goliath, and those for Lahmi the brother of Goliath are so alike that one is almost certainly a miscopying of the other, though “which is the original it is not easy to decide.” The same reading also allows that another giant may have borne Goliath's name. Goliath in [[1 Sam. 17:4]] has his own note.
    sources: [lds-scriptures, oshb-wlc, bd-goliath, cambridge-1-samuel]

christ: |
  David asked, “wherewith shall I make the atonement?” and the answer he accepted was the death of sons for their father. The Church's footnote at verse 6 points to the law that every man “shall be put to death for his own sin” ([[Deut. 24:16]]), and the footnote at Amulek's sermon points to the same law. Amulek reasons from it to Christ: “there is not any man that can sacrifice his own blood which will atone for the sins of another,” so “there can be nothing which is short of an infinite atonement which will suffice for the sins of the world” ([[Alma 34:11–12]]). His argument rests on the law of Moses, “which prohibited the taking of one mortal life in punishment for the wrongdoing of another.” No mortal's death can cover another's guilt, and a disciple's sins are covered by the “great and last sacrifice” of the Son of God, “infinite and eternal” ([[Alma 34:14]]).

explore: |
  - **The oath, made and broken.** [[Josh. 9:3–27]], the Gibeonites' league; [[2 Sam. 21:1–14]] beside it.
  - **The oath kept.** [[1 Sam. 20:14–17]] and [[2 Sam. 9:1–13]], David and Jonathan's son.
  - **Atonement for blood.** [[Num. 35:30–34]]; [[Deut. 21:1–9]]; [[Alma 34:9–16]]; the page [Between the Dead and the Living](/numbers/themes/between-the-dead-and-the-living/).
  - **The giants of Gath.** [[1 Sam. 17:4–7]]; [[1 Chr. 20:4–8]].

