chapter: 2
title: Shall the Sword Devour for Ever?
tagline: David asks the LORD and goes up to Hebron, where Judah anoints him king, and he blesses the men of Jabesh-gilead for burying Saul; Abner makes Saul's son Ish-bosheth king over Israel; the two sides meet at the pool of Gibeon, Abner kills Asahel, and Abner calls on Joab to end the slaughter of brothers.
when: 'After the death of Saul, when David began to reign in Hebron'

setting: |
  Saul and three of his sons are dead on Gilboa, and the Israelites in the valley and beyond the Jordan have abandoned their towns to the Philistines ([[1 Sam. 31:7]]). David has heard the news at Ziklag and mourned Saul and Jonathan in the lament of chapter 1. Chapter 2 is his first step from outlaw to king. It begins the seven years and six months he reigned in Hebron over Judah alone, before he reigned in Jerusalem over all Israel ([[2 Sam. 5:5]]); the Church's chronology dates the start of that reign to 1055 B.C.

  Those years are a contest between two houses, David's at Hebron and Saul's beyond the Jordan at Mahanaim, held together by Saul's general Abner. The next chapter sums them up in a line: “there was long war between the house of Saul and the house of David: but David waxed stronger and stronger, and the house of Saul waxed weaker and weaker” ([[2 Sam. 3:1]]). This chapter tells how the two houses came to stand apart, and their first battle.

thread: |
  The chapter moves from kindness to the sword. It opens with David asking the LORD before he takes a step, his own tribe anointing him, and his blessing on the men who had buried Saul: may the LORD show you “kindness and truth.” Then Abner, Saul's captain, sets up Saul's son as a rival king, and Israel has two kings. When the two sides meet at Gibeon, a contest of twenty-four young men turns into a rout, and in the pursuit Abner kills Joab's young brother Asahel, though Abner had twice tried to turn him away.

  By evening it is Abner who asks the question the chapter leaves open: “Shall the sword devour for ever?” He calls the men pursuing his own “their brethren,” and Joab calls off the chase. The dead are counted, and Asahel is buried in his father's tomb at Bethlehem. Nothing is settled. Joab will take his brother's blood from Abner at Hebron ([[2 Sam. 3:27]]), and the war between the two houses goes on.

sections:
  - range: 1-7
    heading: David anointed at Hebron
    plain: |
      After this David asked the LORD, “Shall I go up to any of the towns of Judah?” The LORD said, “Go up.” David asked, “Where shall I go?” and He said, “To Hebron.” So David went up there with his two wives, Ahinoam of Jezreel and Abigail, the widow of Nabal of Carmel. He also brought up the men who were with him, each with his household, and they settled in the towns around Hebron. Then the men of Judah came, and there they anointed David king over the house of Judah. When David was told that it was the men of Jabesh-gilead who had buried Saul, he sent messengers to them to say: “The LORD bless you for showing this kindness to your lord Saul by burying him. Now may the LORD show you kindness and faithfulness, and I too will do you good for what you have done. So now be strong and brave, for your master Saul is dead, and the house of Judah has anointed me king over them.”
  - range: 8-11
    heading: Abner makes Ish-bosheth king
    plain: |
      But Abner the son of Ner, the commander of Saul's army, took Ish-bosheth, Saul's son, brought him over to Mahanaim, and made him king over Gilead, the Ashurites, Jezreel, Ephraim and Benjamin, and over all Israel. Ish-bosheth, Saul's son, was forty years old when he began to reign over Israel, and he reigned two years. But the house of Judah followed David. David was king in Hebron over the house of Judah seven years and six months.
  - range: 12-17
    heading: The contest at the pool of Gibeon
    plain: |
      Abner the son of Ner and the men of Ish-bosheth went out from Mahanaim to Gibeon. Joab the son of Zeruiah and David's men went out too, and they met at the pool of Gibeon and sat down, one group on one side of the pool and the other on the other side. Abner said to Joab, “Let the young men get up and make sport before us.” Joab said, “Let them.” So twelve men of Benjamin, for Ish-bosheth the son of Saul, and twelve of David's men went over and were counted off. Each one grabbed his opponent by the head and thrust his sword into his side, and they fell down together. So that place in Gibeon was called Helkath-hazzurim. The battle that day was very fierce, and Abner and the men of Israel were beaten by David's men.
  - range: 18-23
    heading: Asahel and Abner
    plain: |
      The three sons of Zeruiah were there, Joab, Abishai and Asahel, and Asahel was as quick on his feet as a wild gazelle. Asahel chased Abner, turning neither to the right nor to the left as he followed him. Abner looked behind him and said, “Is that you, Asahel?” “It is,” he answered. Abner said to him, “Turn aside to your right or to your left; seize one of the young men and take his gear for yourself.” But Asahel would not stop chasing him. Again Abner said to Asahel, “Stop chasing me! Why should I strike you to the ground? How could I look your brother Joab in the face?” But he refused to turn aside, so Abner struck him in the belly with the butt of his spear, and the spear came out through his back. He fell there and died on the spot, and everyone who came to the place where Asahel had fallen and died stood still.
  - range: 24-32
    heading: Shall the sword devour for ever?
    plain: |
      Joab and Abishai chased Abner, and the sun was setting when they came to the hill of Ammah, near Giah, on the way to the wilderness of Gibeon. The men of Benjamin rallied behind Abner, formed one band, and took their stand on the top of a hill. Then Abner called out to Joab, “Must the sword devour for ever? Don't you know that this will end in bitterness? How long before you order your people to stop chasing their brothers?” Joab answered, “As God lives, if you had not spoken, the people would have gone home in the morning, each one from following his brother.” So Joab blew a trumpet, and all the people stopped; they no longer chased Israel or fought. Abner and his men marched all that night through the Jordan valley, crossed the Jordan, went through the whole of Bithron and came to Mahanaim. Joab came back from chasing Abner and gathered all his men: besides Asahel, nineteen of David's men were missing. But David's men had killed three hundred and sixty of Benjamin and of Abner's men. They took up Asahel and buried him in his father's tomb at Bethlehem. Then Joab and his men marched all night and reached Hebron at daybreak.

notes:
  - ref: 4
    phrase: there they anointed David king over the house of Judah
    kind: history
    title: They anointed David king over the house of Judah
    body: |
      David became king at Hebron because he asked where to go and the LORD named the place. He asked first whether to go up at all, and then to which town (verse 1), as he had asked at Ziklag, through Abiathar and the ephod, whether to pursue the Amalekites ([[1 Sam. 30:7–8]]; the ephod is taken up at [[1 Sam. 23:9]]). Hebron was an ancient city of Judah, some three thousand feet above the sea and twenty miles south of Jerusalem: the burying place of Abraham and his family, later Caleb's, a city of refuge and a Levitical city. It would be David's capital for the first part of his reign.

      There the men of Judah anointed him, the second of his three anointings. Samuel had anointed him years before in the midst of his brothers ([[1 Sam. 16:13]], where what that anointing meant is taken up); here his own tribe makes him its king; and when the war with Saul's house is over, all the elders of Israel will come to Hebron and anoint him king over Israel ([[2 Sam. 5:3]]). Between the second anointing and the third, Israel had two kings: “the house of Judah followed David,” and the rest followed Ish-bosheth (verses 8–10). The guide [The Conquest, the Judges, and One Kingdom](/old-testament/guides/the-conquest-judges-and-kingdom/#rulers) sets those years among Israel's other rulers.
    sources: [lds-scriptures, bd-hebron]

  - ref: 6
    phrase: the LORD shew kindness and truth unto you
    kind: words
    title: Kindness and truth
    body: |
      David's blessing on Jabesh-gilead answers the kindness its men showed Saul with the LORD's own kindness and faithfulness. The “kindness” the men of Jabesh had shown Saul by burying him (verse 5) is *ḥesed*, the loyal goodness one person shows another in doing a favor; David asks the LORD to answer it with His own *ḥesed* and *ʾĕmet*, “truth,” which is firmness, faithfulness, what can be relied on. The two words are often joined, of people (Abraham's servant asks Rebekah's family to “deal kindly and truly with my master,” [[Gen. 24:49]]) and of God. Saul had once saved their city ([[1 Sam. 11:1–11]]), and they kept faith with him after his death; David prays that the LORD will keep faith with them.

      The King James uses “kindness” twice in verse 6, but David's own promise is in a different word. Where the King James has “I also will requite you this kindness,” the Hebrew has *haṭṭôbâ*, good done to someone, welfare, benefit, not *ḥesed*; and the footnote gives “do, recompense” for “requite.” Then comes the news that closes the message: “your master Saul is dead, and also the house of Judah have anointed me king over them” (verse 7). The text does not say what David hoped for from it. One older reading hears an appeal in it: David hoped the men of Jabesh, the chief town of Gilead, would join him and hold their land against the Philistines; and since Abner made Ish-bosheth king “over Gilead” (verse 9) and set him up there, the embassy “does not appear” to have succeeded.
    sources: [oshb-wlc, bdb, lds-scriptures, cambridge-1-samuel]

  - ref: 8
    phrase: captain of Saul’s host, took Ish-bosheth the son of Saul
    kind: history
    title: Abner and Ish-bosheth
    body: |
      Saul's kingdom did not pass to David at once, because Saul's general held it for Saul's son. Abner, the son of Saul's uncle Ner ([[1 Sam. 14:50]]), had been the captain of Saul's army. He escaped from Gilboa with a surviving son of Saul and took him across the Jordan, where it seems Saul's men had retreated while the Philistines occupied the abandoned towns ([[1 Sam. 31:7]]), and made him king at Mahanaim. Mahanaim was the place where Jacob had seen the camps of the angels ([[Gen. 32:2]]). On one older reading, Ish-bosheth was “a mere tool in the hands of Abner,” and the story that follows has Abner lead the army, and later go over to David ([[2 Sam. 3:6–21]]).

      The name is a substitute. Chronicles calls this son of Saul Esh-baal ([[1 Chr. 8:33]]). Later Israelites, unwilling to pronounce the name Baal, put *bōšet*, “shameful thing,” in its place (the same change turned Jonathan's son Merib-baal into Mephibosheth), so that Ish-bosheth reads “man of shame.”

      The figures in verses 10–11 are hard to fit together: Ish-bosheth reigned two years, David seven and a half in Hebron, and Ish-bosheth was forty when he began, which would make him older than his eldest brother Jonathan seems to have been. The same older reading suggests that the age may have been miscopied, and that the two years are counted from the time Abner had won the land back from the Philistines and established Ish-bosheth's rule over all Israel, some five and a half years on, so that they fall at the end of David's years in Hebron.
    sources: [bd-abner, bd-mephibosheth, cambridge-1-samuel, lds-scriptures]

  - ref: 14
    phrase: Let the young men now arise, and play before us
    kind: history
    title: Let the young men … play before us
    body: |
      The “play” Abner proposed was a contest of champions. The verb (*śāḥaq*) means to laugh, sport or play, and here, in the lexicon's word, to make sport “in tournament”: twelve men from each side were to fight before the two armies. It was more than a grudge match. Between two kingdoms, chosen fighters were to decide the winner for their people, as the champion does who “undertakes to settle the disputes between two armies,” the part Goliath had offered to play at Elah ([[1 Sam. 17:8–9]]).

      This time it decided nothing. Each man caught his opponent by the head and drove his sword into his side, and all twenty-four fell together. With no winner, the two armies fought it out in “a very sore battle” (verse 17), and David's men won.
    sources: [bdb, oshb-wlc, ot-manual-2-samuel-1]

  - ref: 23
    phrase: smote him under the fifth rib
    kind: history
    title: Under the fifth rib
    body: |
      Asahel died because he would not stop, and Abner killed him only after warning him twice. The youngest of Zeruiah's sons was famous for his speed, and he ran straight after Abner, turning neither right nor left (verse 19). Abner told him to catch one of the young men and take his “armour” instead, a word for what is stripped from a fallen man as plunder: Asahel could have his trophy from someone else. Then Abner says why he wanted to spare him: “how then should I hold up my face to Joab thy brother?” (verse 22).

      When Asahel would not turn, Abner struck him with the back end of the spear, “under the fifth rib.” The Hebrew word there (*ḥōmeš*) means the belly. The footnotes point ahead to the same blow. At Hebron Joab kills Abner “under the fifth rib … for the blood of Asahel his brother” ([[2 Sam. 3:27]]), and later he kills Amasa with a stroke “in the fifth rib” ([[2 Sam. 20:10]]). Why Joab held the debt, and what Israel's law said of the avenger of blood, is taken up at [[2 Sam. 3:27]].
    sources: [bd-asahel, bdb, oshb-wlc, lds-scriptures]

christ: |
  The men of Judah anointed David king, and kings were anointed when they were crowned; the title Christ is the Greek for “anointed one.” The reign that began at Hebron would receive the LORD's promise for David's son, “my mercy shall not depart away from him, as I took it from Saul” ([[2 Sam. 7:15]]), and that loving-kindness promised to David's house finds its richest fulfillment in Jesus, the Anointed King from David's line.

  The LORD's covenant with David's house gives a disciple a pattern of recalling past mercies while trusting in future grace, and with it hope in Christ in morally complex times, such as this chapter's war of brother against brother.

explore: |
  - **Jabesh-gilead and Saul.** [[1 Sam. 11:1–11]], Saul's rescue of the town; [[1 Sam. 31:11–13]], its men bury him; [[2 Sam. 21:12–14]], David brings the bones home.
  - **David anointed three times.** [[1 Sam. 16:13]]; [[2 Sam. 5:1–5]].
  - **Asahel avenged.** [[2 Sam. 3:22–30]]; [[1 Kgs. 2:5–6]].
  - **Mahanaim.** [[Gen. 32:1–2]]; [[2 Sam. 17:24–27]], David's own refuge there.

