chapter: 23
title: The Last Words of David
tagline: David's last oracle sets out the king God requires, just and ruling in the fear of God, and rests his house on the everlasting covenant; then the roll of his mighty men, the three, the water of Bethlehem, Abishai and Benaiah, and the thirty, ending with Uriah the Hittite.
when: '“The last words of David” (23:1)'

setting: |
  The last chapters of 2 Samuel do not carry the story on to David's death, which Kings tells ([[1 Kgs. 2:10]]). Chapter 22 is David's song of deliverance, the psalm the Psalter keeps as Psalm 18 (the note at [[2 Sam. 22:1]]). After that psalm of thanksgiving come “the last words of David,” a prophetic testament resting on the promise he received through Nathan that his throne would be established for ever ([[2 Sam. 7:12–16]]).

  The rest of the chapter is a roll of David's mighty men, the warriors who stood out among his followers. The exploits told here were probably taken from various times in David's life and set down together at this point. Chronicles gives the same list ([[1 Chr. 11:10–41]]), placed just after David takes Zion and introduced as the men “who strengthened themselves with him in his kingdom, and with all Israel, to make him king.” That placement suggests that the list belongs, at least in substance, to the early years of the reign. Some of these men are already familiar: Abishai and Asahel, Joab's brothers; Eliam, whose daughter was Bath-sheba; and Uriah the Hittite.

thread: |
  The chapter has two halves, and both are about David's kingship. In the first, David speaks as a prophet. The God of Israel tells him in a handful of words what a ruler must be: just, and ruling in the fear of God. Such a king is to his people like a cloudless sunrise and the grass that springs up after rain. David then speaks of his own house and rests everything on the covenant God made with him, “ordered in all things, and sure.” The wicked, like thorns, are left for the fire.

  In the second half the roll of the mighty men gives the human side of the throne. These were the men who, Chronicles says, strengthened themselves with him “to make him king.” In the middle of it is a scene of another kind: three of them risk their lives for a drink of water from Bethlehem, and David will not drink it. The list ends with a name the reader of chapter 11 knows: Uriah the Hittite.

sections:
  - range: 1-7
    heading: The last words of David
    plain: |
      These are the last words of David. The oracle of David the son of Jesse, the oracle of the man who was raised up on high, the anointed of the God of Jacob, the sweet psalmist of Israel:

      “The Spirit of the LORD spoke through me; His word was on my tongue. The God of Israel spoke; the Rock of Israel said to me: One who rules over men must be just, ruling in the fear of God. He will be like the light of morning when the sun rises, a morning without clouds, like the tender grass springing from the earth in the clear shining after rain.

      “Though my house is not so with God, yet He has made with me an everlasting covenant, ordered in all things and secure. This is all my salvation and all my desire, though He makes it not to grow. But the sons of Belial are all like thorns that are thrust away, because no one can take them in hand. Whoever touches them must arm himself with iron and the shaft of a spear, and they will be utterly burned with fire where they lie.”
  - range: 8-12
    heading: The first three
    plain: |
      These are the names of David's mighty men. The Tachmonite who sat in the seat, chief of the captains, the same was Adino the Eznite; he raised his spear against eight hundred and killed them at one time.

      After him was Eleazar the son of Dodo the Ahohite, one of the three mighty men with David when they defied the Philistines gathered there for battle and the men of Israel had withdrawn. He rose and struck down the Philistines until his hand was weary and stuck to the sword. The LORD brought about a great victory that day, and the people came back after him only to take the spoil.

      After him was Shammah the son of Agee the Hararite. The Philistines had gathered in a troop where there was a plot of ground full of lentils, and the people fled from them. But he took his stand in the middle of the plot, defended it, and struck down the Philistines, and the LORD brought about a great victory.
  - range: 13-17
    heading: The water of Bethlehem
    plain: |
      Three of the thirty chief men went down at harvest time and came to David at the cave of Adullam, while a troop of Philistines was camped in the valley of Rephaim. David was then in the stronghold, and a Philistine garrison was in Bethlehem. David longed for water and said, “If only someone would give me a drink of water from the well of Bethlehem by the gate!”

      So the three mighty men broke through the Philistine camp, drew water from the well of Bethlehem by the gate, and carried it back to David. But he would not drink it; he poured it out to the LORD. “Far be it from me, O LORD, that I should do this,” he said. “Is this not the blood of the men who went at the risk of their lives?” So he would not drink it. These are the things the three mighty men did.
  - range: 18-23
    heading: Abishai and Benaiah
    plain: |
      Abishai the brother of Joab, the son of Zeruiah, was chief of three. He raised his spear against three hundred and killed them, and won a name among the three. Was he not the most honored of the three? So he became their captain, but he did not reach the rank of the first three.

      Benaiah the son of Jehoiada, a valiant man from Kabzeel who had done many deeds, killed two lionlike men of Moab. He also went down and killed a lion in the middle of a pit on a snowy day. And he killed an Egyptian, an imposing man. The Egyptian had a spear in his hand, but Benaiah went down to him with a staff, snatched the spear out of the Egyptian's hand, and killed him with his own spear. These are the things Benaiah the son of Jehoiada did, and he won a name among the three mighty men. He was more honored than the thirty, but he did not reach the rank of the first three. And David set him over his guard.
  - range: 24-39
    heading: The thirty
    plain: |
      Among the thirty were Asahel the brother of Joab; Elhanan the son of Dodo of Bethlehem; Shammah the Harodite; Elika the Harodite; Helez the Paltite; Ira the son of Ikkesh the Tekoite; Abiezer the Anethothite; Mebunnai the Hushathite; Zalmon the Ahohite; Maharai the Netophathite; Heleb the son of Baanah, a Netophathite; Ittai the son of Ribai from Gibeah of the Benjamites; Benaiah the Pirathonite; Hiddai of the brooks of Gaash; Abi-albon the Arbathite; Azmaveth the Barhumite; Eliahba the Shaalbonite; of the sons of Jashen, Jonathan; Shammah the Hararite; Ahiam the son of Sharar the Hararite; Eliphelet the son of Ahasbai, the son of the Maachathite; Eliam the son of Ahithophel the Gilonite; Hezrai the Carmelite; Paarai the Arbite; Igal the son of Nathan of Zobah; Bani the Gadite; Zelek the Ammonite; Naharai the Beerothite, armor-bearer to Joab the son of Zeruiah; Ira the Ithrite; Gareb the Ithrite; and Uriah the Hittite: thirty-seven in all.

notes:
  - ref: 1
    phrase: Now these be the last words of David
    kind: words
    title: The oracle of David
    body: |
      David's last words are framed as revelation, not as a king's farewell. The word the King James twice renders “said” in verse 1 is not the ordinary verb of speaking but *nĕʾum*, “utterance, declaration, revelation,” the word the prophets use when they cite the word of the LORD. It is almost never joined to a human speaker. Among human speakers it introduces Balaam's oracles (“Balaam the son of Beor hath said,” [[Num. 24:3]]), the words of the man in [[Prov. 30:1]], and David's words here.

      Verse 2 says the same thing plainly: “The Spirit of the LORD spake by me, and his word was in my tongue.” What follows, then, is given as the word of God through the king, and it begins with what God requires of a king.
    sources: [bdb, oshb-wlc]

  - ref: 4
    phrase: as the light of the morning, when the sun riseth
    kind: symbol
    title: The just ruler and the sunrise
    body: |
      The oracle pictures the just king with the sunrise, an image the scriptures also use of the Lord himself. The rule comes first, and it is God's, not David's: “The God of Israel said … He that ruleth over men must be just, ruling in the fear of God” (verse 3).

      The images then say what such a ruler is to those he rules: light on a morning without clouds, and tender grass springing from the ground in the clear shining after rain. In the scriptures the sun is paired with the Lord and carries ideas of fertility, righteousness and justice, and the image could be applied to Israel's king, who was commanded to rule and live as God ruled.
    sources: [sc-knowhy-653]

  - ref: 5
    phrase: Although my house be not so with God
    kind: words
    title: A concession or a question
    body: |
      Verse 5 can be read two ways, and both end in the covenant. The King James makes its first and last lines concessions: although David's house is not so with God, and although God makes it not to grow, David still has the everlasting covenant, and it is “all my salvation, and all my desire.” The Hebrew begins *kî lōʾ kēn bêtî ʿim ʾēl*, word for word *for not so my house with God*, with no word to mark a question. One older reading holds that the lines make sense only as questions, marked by the tone of voice alone, and modern translations such as the English Standard Version read it so: “For does not my house stand so with God? … For will he not cause to prosper all my help and my desire?” On that reading the covenant is the ground of David's confidence in his house.

      Either way the ground is the same. The “everlasting covenant” is the promise Nathan brought, that David's throne would be established for ever ([[2 Sam. 7:12–16]]; the notes there carry it in full). Older readings take “ordered in all things, and sure” as likening the covenant to a carefully drawn and properly attested legal document, and as a covenant made with every eventuality foreseen, even the falling away of those who bore it, so that their sins would not annul it: “If he commit iniquity, I will chasten him … But my mercy shall not depart away from him” ([[2 Sam. 7:14–15]]).
    sources: [oshb-wlc, keil-1-samuel, cambridge-1-samuel, esv, nrsvue, lds-scriptures]

  - ref: 8
    phrase: These be the names of the mighty men whom David had
    kind: history
    title: The Three and the Thirty
    body: |
      The mighty men were David's picked warriors, ranked in three classes. First come “the three”: the man of verse 8, Eleazar and Shammah (verses 8–12). Next come Abishai, “most honourable of three” and their captain, and Benaiah, “more honourable than the thirty”; neither attained to “the first three” (verses 18–23). Then come the thirty (verses 24–39). The total at the end, “thirty and seven in all,” works if verse 34 is read with Chronicles as holding three names (three, two and thirty-two), or if three are counted in the second class though only two are named. Joab, commander of the whole army, is not counted, though his brothers Abishai and Asahel and his armourbearer are named. Chronicles adds sixteen more names ([[1 Chr. 11:41–47]]), perhaps men admitted when the number was not held strictly to thirty, or men who took the places of the dead. Of the second class, Benaiah, whom David “set … over his guard” (verse 23), is the one the history follows furthest: he was over the Cherethites and the Pelethites ([[2 Sam. 20:23]]), went down with Zadok and Nathan to make Solomon king ([[1 Kgs. 1:38]]), and replaced Joab over the army ([[1 Kgs. 2:35]]).

      The text of this list was damaged in copying, and verse 8 shows it. “The Tachmonite that sat in the seat … the same was Adino the Eznite” is probably corrupt; Chronicles reads “Jashobeam, an Hachmonite, the chief of the captains: he lifted up his spear against three hundred” ([[1 Chr. 11:11]]), and the words “Adino the Eznite” probably stand for “he brandished his spear,” which the sentence needs. Throughout the section the Hebrew words for “captain,” “three” and “thirty” look nearly alike and are easily confused. The figures differ too: eight hundred here, three hundred in Chronicles.
    sources: [cambridge-1-samuel, keil-1-samuel, lds-scriptures]

  - ref: 16
    phrase: poured it out unto the LORD
    kind: symbol
    title: Water poured out to the LORD
    body: |
      David poured the water out as an offering because his men had risked their lives to bring it. The Philistines were camped in the valley of Rephaim and held Bethlehem, David's own town ([[1 Sam. 16:1]]), with a garrison, while David was in the stronghold (verses 13–14). Three of his men had come to him at the cave of Adullam; he spoke a wish aloud, and they broke through the enemy camp to fulfil it.

      The verb for “poured it out” is the one used for a libation, a drink offering poured to God; it is the word for Jacob's drink offering at Bethel ([[Gen. 35:14]]). David gives his own reason: “is not this the blood of the men that went in jeopardy of their lives?” His request had put three lives at risk, and it appears that, sorry for the thoughtless wish, he refused himself what their courage had won. What he would not take for himself he gave to the LORD.
    sources: [bdb, ot-manual-2-samuel-13, lds-scriptures]

  - ref: 39
    phrase: 'Uriah the Hittite: thirty and seven in all'
    kind: history
    title: The last name on the roll
    body: |
      The roll of David's heroes ends with the man David had killed. Uriah the Hittite was one of the elite thirty, and so was “Eliam the son of Ahithophel the Gilonite” (verse 34), almost certainly the Eliam whose daughter was Bath-sheba (the note at [[2 Sam. 11:3]]). The people of that story were closely connected to one another: Bath-sheba's husband and her father were both among his chosen men, and Ahithophel, the counsellor who went over to Absalom ([[2 Sam. 15:12]]), was her grandfather. The list states Uriah's name and the count, and says nothing more.
    sources: [shannon-complex-stories, bd-ahithophel, lds-scriptures]

christ: |
  David's last oracle draws a ruler who is just and rules in the fear of God, and an older reading holds that the portrait, partly realized in Solomon and the better kings of Judah, finds its perfect realization only in Christ, and that Malachi's promise that “the Sun of righteousness” shall “arise with healing in his wings” ([[Mal. 4:2]]) echoes it. The sun is a fitting symbol for the Lord, whose light “giveth life to all things” ([[D&C 88:13]]). David rested “all my salvation” on the covenant God had made with him, and that covenant was ultimately fulfilled through Jesus Christ, the Son of David who reigns as the Eternal King. A disciple's hope rests on the same ground: the covenant God makes and keeps through Christ.

explore: |
