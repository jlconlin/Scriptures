  - **The just king in the prophets.** [[Isa. 11:1–5]]; [[Jer. 23:5]].
  - **The list again.** [[1 Chr. 11:10–47]].
  - **David's stronghold.** The cave of Adullam, where his band first gathered: [[1 Sam. 22:1–2]].

