chapter: 16
title: Let Him Curse
tagline: Fleeing Jerusalem, David is met by Ziba with provisions and an accusation and by Shimei with stones and a curse; in the city Hushai offers Absalom his service, and on Ahithophel's counsel Absalom takes his father's concubines on the palace roof.
when: 'While David fled from Absalom'

setting: |
  Chapter 15 told how Absalom stole the hearts of the men of Israel, had himself proclaimed king at Hebron, and drew David's counsellor Ahithophel into the conspiracy. David left Jerusalem in haste with his household and his guard, leaving ten concubines to keep the house. He crossed the brook Kidron and “went up by the ascent of mount Olivet, and wept as he went up, and had his head covered, and he went barefoot” ([[2 Sam. 15:30]]). At the top, where he worshipped, he sent Hushai back into the city to serve as his eyes and ears ([[2 Sam. 15:32–37]]).

  This chapter begins just past that summit, “the top of the hill.” Bahurim, where Shimei comes out to meet the king, lay on the far side of the Mount of Olives and not far off; it was there that Michal's husband Phaltiel turned back weeping when Abner brought her to David ([[2 Sam. 3:16]]). From there David's road ran down toward the Jordan and the wilderness, while Absalom entered the city behind him.

  Psalm 3 is set by its title in these days, when David fled from Absalom his son ([[Ps. 3]]), and the site reads it beside this flight. Nathan's sentence on David ([[2 Sam. 12:10–12]]) is fulfilled at the end of the chapter.

thread: |
  The chapter follows the king and the usurper in turn. On the road David meets two men who belong to the house of Saul. Ziba brings bread, fruit and wine, and an accusation against his master Mephibosheth, and David gives him his master's land on the spot. Shimei brings curses and stones, calling the king a man of blood whom the LORD has repaid. Abishai offers to take off his head, and David will not have it: “let him alone, and let him curse; for the LORD hath bidden him. It may be that the LORD will look on mine affliction” (verses 11–12).

  In Jerusalem Absalom receives two counsellors. Hushai, David's friend, says what David told him to say and is believed. Ahithophel, whose counsel was taken as the very word of God, tells Absalom to make the break with his father beyond repair. A tent goes up on the roof of the king's house, and what Nathan had told David in chapter 12 is done there “in the sight of all Israel.”

sections:
  - range: 1-4
    heading: Ziba meets the king
    plain: |
      When David had gone a little past the top of the hill, Ziba, Mephibosheth's servant, met him with a pair of saddled donkeys loaded with two hundred loaves of bread, a hundred clusters of raisins, a hundred of summer fruit, and a skin of wine. The king asked Ziba, “What are these for?” Ziba said, “The donkeys are for the king's household to ride, the bread and summer fruit for the young men to eat, and the wine for anyone who grows faint in the wilderness to drink.”

      The king asked, “And where is your master's son?” Ziba answered the king, “He is staying in Jerusalem, for he said, ‘Today the house of Israel will give me back my father's kingdom.’” The king said to Ziba, “Everything that belonged to Mephibosheth is now yours.” Ziba said, “I bow before you; may I find favor in your sight, my lord the king.”
  - range: 5-14
    heading: Shimei curses David
    plain: |
      When King David came to Bahurim, a man of the family of Saul's house came out from there. His name was Shimei son of Gera, and he kept cursing as he came. He threw stones at David and at all King David's servants, though all the people and all the warriors were at the king's right and left. This is what Shimei said as he cursed: “Get out, get out, you man of blood, you worthless man! The LORD has paid you back for all the blood of the house of Saul, in whose place you have reigned, and the LORD has handed the kingdom over to your son Absalom. Here you are, caught in your own evil, because you are a man of blood.”

      Then Abishai son of Zeruiah said to the king, “Why should this dead dog curse my lord the king? Let me go over and take off his head.” But the king said, “What have I to do with you, you sons of Zeruiah? Let him curse, because the LORD has told him, ‘Curse David.’ Who then can ask, ‘Why have you done this?’” David said to Abishai and to all his servants, “My own son, my own flesh and blood, is trying to take my life. How much more this Benjamite now! Leave him alone and let him curse, for the LORD has told him to. It may be that the LORD will look on my affliction and repay me with good for his cursing today.”

      So David and his men went on along the road, while Shimei kept pace on the hillside opposite him, cursing as he went, throwing stones at him and flinging dust. The king and all the people with him arrived weary, and there they rested.
  - range: 15-19
    heading: Hushai comes to Absalom
    plain: |
      Meanwhile Absalom and all the men of Israel came to Jerusalem, and Ahithophel was with him. When Hushai the Archite, David's friend, came to Absalom, Hushai said to him, “Long live the king! Long live the king!” Absalom said to Hushai, “Is this your loyalty to your friend? Why didn't you go with your friend?” Hushai said to Absalom, “No; the one whom the LORD and this people and all the men of Israel have chosen, his I will be, and with him I will stay. And besides, whom should I serve? Should it not be his son? As I served your father, so I will serve you.”
  - range: 20-23
    heading: Ahithophel's counsel
    plain: |
      Then Absalom said to Ahithophel, “Give us your counsel: what should we do?” Ahithophel said to Absalom, “Go in to your father's concubines, whom he left to look after the house. Then all Israel will hear that you have made yourself hateful to your father, and everyone who is with you will be strengthened.” So they pitched a tent for Absalom on the roof, and Absalom went in to his father's concubines in the sight of all Israel.

      In those days the counsel Ahithophel gave was regarded as if one had asked for the word of God. That is how all his counsel was regarded, both by David and by Absalom.

notes:
  - ref: 3
    phrase: To day shall the house of Israel restore me the kingdom of my father
    kind: history
    title: Ziba's word against his master
    body: |
      Ziba accuses his master of hoping to profit from David's ruin, and David believes him at once. Mephibosheth was Jonathan's son and Saul's grandson ([[2 Sam. 9:6]]), and Ziba's claim is that his master expected Israel to give the kingdom back to Saul's house through him. Ziba himself owed his place to David's kindness to Mephibosheth: the king had made him, his fifteen sons and his twenty servants the tenants of Saul's land, to bring in its fruits “that thy master's son may have food to eat,” while Mephibosheth ate at the king's table ([[2 Sam. 9:9–10]]). Now, on Ziba's word alone, with no word from Mephibosheth recorded, David gives the steward everything that belonged to his master (verse 4).

      The other side is heard only when David comes home. Mephibosheth meets him with his feet undressed and his beard untrimmed, says that his servant deceived him when he meant to ride out to the king, and adds, “he hath slandered thy servant unto my lord the king” ([[2 Sam. 19:24–27]]). The note at [[2 Sam. 19:26]] sets the two accounts side by side.
    sources: [lds-scriptures]

  - ref: 8
    phrase: The LORD hath returned upon thee all the blood of the house of Saul
    kind: history
    title: All the blood of the house of Saul
    body: |
      Shimei's charge is that David came to Saul's throne by bloodshed and that Absalom's revolt is the LORD paying him back. He was of “the family of the house of Saul,” a kinsman of the fallen king, and his tie to Saul's clan may help explain the bitterness of his hatred. What blood he meant the text does not say, and it cannot be determined with certainty. He may have meant the deaths of Abner and of Ish-bosheth, both treacherously murdered, though the book records David innocent of both: after Abner's death “all the people and all Israel understood that day that it was not of the king to slay Abner” ([[2 Sam. 3:37]]), and David put Ish-bosheth's murderers to death ([[2 Sam. 4:11–12]]). Older readings add the deaths of Saul and his sons at Gilboa, and possibly the seven sons of Saul hanged for the Gibeonites ([[2 Sam. 21:1–9]]), if that had happened by this time.

      One older reading observes that Shimei would not have had Uriah in mind, though David may well have felt that for Uriah's death the curse was not undeserved. Nathan had told him that because of Uriah “the sword shall never depart from thine house” ([[2 Sam. 12:10]]), and his own son was now seeking his life.
    sources: [keil-1-samuel, cambridge-1-samuel, lds-scriptures]

  - ref: 10
    phrase: so let him curse, because the LORD hath said unto him, Curse David
    kind: history
    title: Let him curse
    body: |
      David will not let Abishai silence Shimei, and the reason he gives is that the LORD has bidden Shimei to curse: “let him curse; for the LORD hath bidden him” (verse 11). Four possible reasons can be heard in his answer. Any dishonor from Shimei was slight beside that of his own son taking his kingdom and seeking his life; if he bore the affliction patiently, the LORD might have mercy and requite him later; the LORD Himself might have commanded the cursing; and against the violence of the sons of Zeruiah David, as usual, chose the more moderate course. The once powerful king is now at the mercy of what others choose (see the note at [[2 Sam. 15:26]]), and in that hour he urges forbearance and “craves the loving-kindness, mercy, and forgiveness of God.”

      Shimei's story does not end on the road. When the king comes back over the Jordan, Shimei falls before him and confesses, “thy servant doth know that I have sinned”; Abishai asks again for his death, “because he cursed the LORD's anointed,” and David swears that he shall not die ([[2 Sam. 19:18–23]]). On his deathbed David charges Solomon to deal with him ([[1 Kgs. 2:8–9]]), and Shimei is held to Jerusalem and at last put to death, under Solomon's sentence: “Thou knowest all the wickedness which thine heart is privy to, that thou didst to David my father: therefore the LORD shall return thy wickedness upon thine own head” ([[1 Kgs. 2:44]]). Whether the Benjamite named Cush in the title of Psalm 7 is Shimei is weighed at [[Ps. 7:0]].
    sources: [ot-manual-2-samuel-13, taggart-sworn-david, bd-shimei, lds-scriptures]

  - ref: 12
    phrase: It may be that the LORD will look on mine affliction
    kind: words
    title: Mine affliction, or mine iniquity
    body: |
      What David hopes the LORD will look upon is uncertain in the Hebrew, and the readings give his hope different objects. The Hebrew text sometimes writes one form in its consonants and marks another to be read aloud (the *ketiv*, “written,” and the *qere*, “read”). Here the consonants read *ʿăwōnî*, my iniquity or my guilt, and the reading marked to be read aloud is “my eye.” “My eye” is usually taken to stand for David's tears, though the sense is doubtful. The Septuagint has “my affliction,” and the standard Hebrew lexicon proposes reading the Hebrew that way, as *ʿonyî*. The King James gives that sense, and so does the New Revised Standard Version (“the Lord will look on my distress”).

      The three readings stand side by side, and the Hebrew is difficult enough that none of them is certain. On the written one the LORD looks on David's guilt, or, as some take it, on the wrong done to him; on the one read aloud, on his tears; on the Septuagint's, on his affliction. On any of these readings David asks to be seen by the LORD as he goes down the road under Shimei's stones, and he hopes that the LORD “will requite me good for his cursing this day.”
    sources: [oshb-wlc, bdb, lxx-rahlfs, nrsvue, net-bible]

  - ref: 16
    phrase: Hushai the Archite, David’s friend
    kind: history
    title: David's friend at Absalom's court
    body: |
      Hushai comes to Absalom as David's man, and the reader knows it though Absalom does not. “David's friend” is a title at court as well as a description (see the note at [[2 Sam. 15:37]]). At the top of the mount David had sent him back to say to Absalom, “I will be thy servant, O king; as I have been thy father's servant hitherto, so will I now also be thy servant,” and so to “defeat the counsel of Ahithophel” and send word by the priests' sons ([[2 Sam. 15:34–36]]).

      His greeting, in Hebrew “Let the king live, let the king live!”, draws Absalom's sharp question: “Is this thy kindness to thy friend? why wentest thou not with thy friend?” Hushai answers with the words David gave him, nearly as David gave them: “as I have served in thy father's presence, so will I be in thy presence” (verse 19). David had chosen well, for Hushai had inside information and could offset the counsel of the shrewd Ahithophel. In the next chapter his advice is preferred, “For the LORD had appointed to defeat the good counsel of Ahithophel” ([[2 Sam. 17:14]]).
    sources: [ot-manual-2-samuel-13, lds-scriptures]

  - ref: 22
    phrase: Absalom went in unto his father’s concubines in the sight of all Israel
    kind: history
    title: On the roof, in the sight of all Israel
    body: |
      Here Nathan's sentence is carried out, and the Church's footnote sends the reader back to it. The LORD had said, “I will take thy wives before thine eyes, and give them unto thy neighbour, and he shall lie with thy wives in the sight of this sun. For thou didst it secretly: but I will do this thing before all Israel, and before the sun” ([[2 Sam. 12:11–12]]). The tent goes up on “the top of the house,” the roof of the king's house where David had walked in the evening and seen Bath-sheba ([[2 Sam. 11:2]]). On one older reading the roof where he secretly conceived his sin became the public scene of its punishment, and the punishment answered in kind to the sin.

      To take the king's women was to claim the king's throne (the note at [[2 Sam. 3:7]]), and it made reconciliation between father and son impossible. Another older reading finds Ahithophel's own interest in that: without such a breach David, with his affection for his sons, might always forgive Absalom, and then it would be Ahithophel who suffered; with it, Absalom's followers would hold firm. The same reading adds that under God's oversight the counsel fulfilled the threat against David without Ahithophel's intending it.

      The ten women had been left “to keep the house” ([[2 Sam. 15:16]]). When David returned he put them in ward and provided for them, and “they were shut up unto the day of their death, living in widowhood” ([[2 Sam. 20:3]]). What Nathan's “I gave thee … thy master's wives” means beside latter-day revelation is at [[2 Sam. 12:8]].
    sources: [lds-scriptures, cambridge-1-samuel, keil-1-samuel]

  - ref: 23
    phrase: as if a man had inquired at the oracle of God
    kind: history
    title: Counsel taken as the word of God
    body: |
      The narrator stops to say how much Ahithophel's word weighed. “Oracle of God” is in Hebrew “word of God”: his counsel was received, by David before and by Absalom now, as though one had inquired of God and been answered (how Israel inquired of the LORD is explained at [[1 Sam. 23:9]]). He had been “David's counsellor” until Absalom sent for him from Giloh ([[2 Sam. 15:12]]), and he was Bath-sheba's grandfather if her father Eliam ([[2 Sam. 11:3]]) is the Eliam who was “the son of Ahithophel the Gilonite” ([[2 Sam. 23:34]]; see the note at [[2 Sam. 15:31]]). The book gives no reason for his joining the conspiracy.

      His counsel was overthrown by Hushai, and when it was not followed he went home, set his house in order, and hanged himself ([[2 Sam. 17:23]]). The friend who turned against the psalmist in Psalms 41 and 55 has been read as Ahithophel; the notes at [[Ps. 41:9]] and [[Ps. 55:12]] weigh that reading.
    sources: [lds-scriptures, bd-ahithophel]

christ: |
  On one older reading, Abishai's zeal is that of James and John, who asked to call down fire on a Samaritan village that would not receive the Lord ([[Luke 9:54]]), and David's answer recalls the Lord's own answer when Peter drew his sword in the garden: “Put up thy sword into the sheath: the cup which my Father hath given me, shall I not drink it?” ([[John 18:11]]). Among the places the Church's footnote to “requite” in verse 12 points is the Lord's promise in this dispensation, that “if men will smite you, or your families, once, and ye bear it patiently and revile not against them, neither seek revenge, ye shall be rewarded” ([[D&C 98:23]]). A disciple who is wronged can leave the answer to the Lord, as David did, and the Lord has promised to reward a wrong borne patiently, without reviling or revenge.

explore: |
  - **The psalm of the flight.** [[Ps. 3:1–8]], with its title, set in this flight.
  - **Shimei again.** [[2 Sam. 19:16–23]], his plea at the Jordan; [[1 Kgs. 2:8–9]] and [[1 Kgs. 2:36–46]], his end.
  - **Hushai against Ahithophel.** [[2 Sam. 17:1–23]], the two counsels and what came of them.
  - **Ziba and Mephibosheth.** [[2 Sam. 9:1–13]] and [[2 Sam. 19:24–30]], the kindness, the accusation and the answer.

