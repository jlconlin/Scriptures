chapter: 9
title: That I May Shew Him Kindness for Jonathan's Sake
tagline: David, now king over all Israel, asks whether anyone of Saul's house is left; he finds Jonathan's lame son Mephibosheth, gives him back Saul's land, and seats him at the king's table for the rest of his life.
when: 'While David reigned in Jerusalem, some years into his reign there'

setting: |
  Chapters 5 to 8 told how David took Jerusalem, brought up the ark, received the LORD's covenant and won his wars. Chapter 9 turns from that public history to a private act, and it stands, on one older reading, as an appendix to the summary of the reign, placed just before the account of David's great sin; Chronicles, which retells much of David's reign, leaves it out as a family matter. It is set years into the Jerusalem reign. Mephibosheth was five when Saul and Jonathan died at Gilboa ([[2 Sam. 4:4]], where he is introduced and his name explained), and he now has a young son (verse 12).

  The account shows a king who remembered a debt of fidelity “even when he reached the highest point of his regal authority and glory”: once David was secure on the throne, he “sought to heal old wounds.” The kindness stands between chapter 8's wars, which reached even Moab, the homeland of David's great-grandmother Ruth, and the corruption of power that the next chapters tell.

  Two men introduced here come back in Absalom's revolt. Ziba, Saul's servant, will accuse his master, and Mephibosheth will answer him ([[2 Sam. 16:1–4]]; [[2 Sam. 19:24–30]], where the two stories are set side by side at [[2 Sam. 19:26]]).

thread: |
  The chapter keeps a promise. David asks twice whether anyone of Saul's house is left (verses 1, 3), and both times the reason is *ḥesed*, the covenant kindness Jonathan had asked of him: the word comes three times, in verses 1, 3 and 7. Jonathan had asked that David not cut off his kindness from his house when David became king ([[1 Sam. 20:14–15]]), and here, with the throne established, the promise is fulfilled.

  The one who is found has reason to be afraid. He is Saul's grandson, lame, apparently living in hiding east of the Jordan, and he may well have feared what usurpers often did to a predecessor's kindred. He comes in on his face and calls himself a dead dog. David answers “Fear not,” gives him back Saul's land, and makes him a guest at the king's table “as one of the king's sons.” The narrator ends on the two facts side by side: he ate continually at the king's table, “and was lame on both his feet.”

sections:
  - range: 1-5
    heading: Is there yet any of the house of Saul?
    plain: |
      David asked, “Is anyone still left of Saul's family, so that I may show him kindness for Jonathan's sake?” There was a servant of Saul's household named Ziba, and they called him to David. The king asked him, “Are you Ziba?” “Your servant,” he answered. The king asked, “Is there no one left of Saul's family, so that I may show him the kindness of God?” Ziba told the king, “Jonathan still has a son. He is lame in his feet.” “Where is he?” the king asked. Ziba said, “He is in the house of Machir son of Ammiel, in Lo-debar.” So King David sent and had him brought from Machir's house in Lo-debar.
  - range: 6-8
    heading: Mephibosheth before the king
    plain: |
      When Mephibosheth son of Jonathan, the son of Saul, came to David, he fell on his face and bowed low. David said, “Mephibosheth!” “Here is your servant,” he answered. David said to him, “Don't be afraid. I will surely show you kindness for the sake of your father Jonathan. I will give back to you all the land of your grandfather Saul, and you will always eat at my table.” He bowed again and said, “What is your servant, that you should look with favor on a dead dog like me?”
  - range: 9-13
    heading: At the king's table
    plain: |
      Then the king called Ziba, Saul's servant, and told him, “I have given your master's grandson everything that belonged to Saul and his family. You, your sons and your servants are to farm the land for him and bring in the harvest, so that your master's grandson will have food to live on. But Mephibosheth himself will always eat at my table.” (Ziba had fifteen sons and twenty servants.) Ziba said to the king, “Your servant will do everything my lord the king commands.” So Mephibosheth ate at David's table like one of the king's sons. Mephibosheth had a young son named Micha, and everyone who lived in Ziba's household became Mephibosheth's servants. Mephibosheth lived in Jerusalem, because he always ate at the king's table; and he was lame in both feet.

notes:
  - ref: 1
    phrase: that I may shew him kindness for Jonathan’s sake
    kind: history
    title: For Jonathan's sake
    body: |
      David's question keeps an oath. When Jonathan and David parted, Jonathan asked him for kindness in return for his own: not only while Jonathan lived, “that I die not,” but for his house “for ever,” even when the LORD had cut off all David's enemies ([[1 Sam. 20:14–15]]), and the two swore it in the LORD's name ([[1 Sam. 20:42]]). The covenant itself, and what it bound the two men to, is explained at [[1 Sam. 18:3]] and [[1 Sam. 20:14]]. What Jonathan asked was that David, once king, would not destroy his line. Here, with the throne secure, David goes looking for someone to keep the promise to.

      The word is *ḥesed*, and it comes three times in the chapter (verses 1, 3 and 7). It is something done: the King James “shew” renders the ordinary Hebrew verb “to do,” so that David asks for someone to whom he may *do* *ḥesed*. In Israel, doing *ḥesed* was counted a kingly trait, and between mortals an act of it looked for one in return. Jonathan had done it for David; now David does it for Jonathan's son. The oath held: when the Gibeonites later asked for Saul's sons, “the king spared Mephibosheth … because of the LORD's oath that was between them, between David and Jonathan” ([[2 Sam. 21:7]]).
    sources: [belnap-hesed, taggart-sworn-david, lds-scriptures]

  - ref: 3
    phrase: that I may shew the kindness of God unto him
    kind: words
    title: The kindness of God
    body: |
      “The kindness of God” is nearly Jonathan's own phrase come back. Jonathan had asked David to show him “the kindness of the LORD” ([[1 Sam. 20:14]]), and David, with his throne established, sets out to keep that promise of *ḥesed*. Asking the second time, he names the kindness as God's.

      The phrase fits the word. Of the 245 times *ḥesed* appears in the Hebrew Bible, two-thirds describe God as the one who does it or praise Him for doing it, so that it is “clearly associated with the divine and may even be used to define godly experience.” Mortals do it as well, and here David calls the kindness he means to do for Saul's house by God's name.
    sources: [belnap-hesed]

  - ref: 3
    phrase: which is lame on his feet
    kind: history
    title: Lame on his feet
    body: |
      Mephibosheth's lameness is part of what the chapter says about David. He had been lamed as a child of five, when he fell as his nurse fled in haste after Gilboa ([[2 Sam. 4:4]]), and the chapter names his feet twice, here and in its last words (verse 13). The ideal of compassion toward those with disabilities “runs consistently through diverse books and genres in the Old Testament.” The law framed it as a prohibition, “Thou shalt not curse the deaf, nor put a stumblingblock before the blind, but shalt fear thy God” ([[Lev. 19:14]]); beyond the law, the Bible teaches care for the disabled as a personal religious duty, and ties that duty to the popular hero David through these verses (3–7).

      Nowhere in 2 Samuel is David shown hating the disabled; on the contrary, “he provides generously for his friend's lame son Mephibosheth.” That is the ground for reading the hard saying about “the lame and the blind” at the taking of Jerusalem as consistent with compassion, a reading set out at [[2 Sam. 5:8]].
    sources: [calabro-disability, lds-scriptures]

  - ref: 7
    phrase: Fear not
    kind: history
    title: Fear not
    body: |
      Mephibosheth had reason to be afraid when the king's messengers came for him. He was the grandson of the king David had replaced, and on one older reading he may have feared that David had sought him out to do what usurpers in the East often did, put all their predecessor's kindred to death. He seems to have been living in hiding at Lo-debar, a town east of the Jordan beyond Mahanaim, in the house of Machir, a man of wealth who may have taken him in when Jonathan died. David's first words were meant to take that fear away.

      Then come three gifts. The first is kindness for Jonathan's sake. The second is Saul's land, which, since David must “restore” it, had after Saul's death either fallen to David as crown land or been taken over by relatives. The third is a place at the king's table for life, a common mark of honor in the ancient Near East; David would later charge Solomon to give it to Barzillai's sons ([[1 Kgs. 2:7]]), and the king of Babylon gave it to the captive Jehoiachin ([[2 Kgs. 25:29]]). Machir, the man who had sheltered Saul's grandson, was among those who met David at Mahanaim with beds and food when he fled from Absalom ([[2 Sam. 17:27–29]]).

      Mephibosheth answers with another bow, calling himself “such a dead dog as I am” (verse 8), the vilest and most contemptible thing he can name, the image David once used of himself before Saul ([[1 Sam. 24:14]], where the note explains it). On one older reading the words are his thanks, a confession that he is unworthy of any such favor.
    sources: [cambridge-1-samuel, keil-1-samuel, lds-scriptures]

  - ref: 10
    phrase: that thy master’s son may have food to eat
    kind: history
    title: Food to eat
    body: |
      Verse 10 seems to say two things at once: Ziba is to farm the land so that Mephibosheth “may have food to eat,” yet Mephibosheth “shall eat bread alway at my table.” The older commentaries resolve it plainly. Mephibosheth himself ate at the king's table, but as a prince he had a household to keep, a young son (verse 12) and servants, and the estate's harvest was to support them. “Bread” stands for all that one lives on.

      Ziba had most likely been working Saul's land already, with his fifteen sons and twenty servants; on one older reading the only change for him was that the harvest now went to Mephibosheth instead of to David. The arrangement matters later. When David flees from Absalom, Ziba accuses his master of hoping for the kingdom, and Mephibosheth answers him on David's return ([[2 Sam. 16:1–4]]; [[2 Sam. 19:24–30]]; the two accounts are weighed at [[2 Sam. 19:26]]).
    sources: [keil-1-samuel, cambridge-1-samuel, bd-mephibosheth]

  - ref: 11
    phrase: As for Mephibosheth, said the king, he shall eat at my table, as one of the king’s sons
    kind: words
    title: As one of the king's sons
    body: |
      The King James makes the end of verse 11 David's words, and supplies “said the king” to do it. The Hebrew has no such words: it reads, word for word, *and Mephibosheth eating at my table as one of the king's sons*, so that after Ziba's reply the “my” has no speaker. The Septuagint reads “And Memphibosthe did eat at the table of David, as one of the sons of the king.” So read, the clause is the narrator's, and it begins the story's close in verses 12–13: Mephibosheth ate at David's table as a son of the king. The plain-words paraphrase above follows that reading.
    sources: [oshb-wlc, biblehub-interlinear, lxx-rahlfs]

christ: |
  David seeks out the grandson of the king who hunted him to show him “the kindness of God” (verse 3), and the phrase reaches past David. In the Old Testament, the *ḥesed* God shows is always an act of deliverance, and it is greatest when it delivers from death and hell, as the Atonement of Jesus Christ does.

  God's kindness is meant to be passed on: those who receive His *ḥesed* are expected to show it, and in showing it they do what God does. A disciple who keeps faith with a friend's family, and makes room for one who expected nothing, is doing that work.

explore: |
  - **The promise made.** [[1 Sam. 18:1–4]]; [[1 Sam. 20:12–17]], [[1 Sam. 20:42]].
  - **What became of Mephibosheth.** [[2 Sam. 16:1–4]]; [[2 Sam. 19:24–30]]; [[2 Sam. 21:7]].
  - **The king's kindness to his own friends.** [[2 Sam. 10:2]], David's kindness to Hanun; [[1 Kgs. 2:7]], Barzillai's sons at Solomon's table.
  - **Ḥesed in the Old Testament.** “‘How Excellent Is Thy Lovingkindness’: The Gospel Principle of Hesed” (Sperry Symposium, 2009) follows the word from Genesis through David to the “sure mercies of David” ([[Isa. 55:3]]).

