chapter: 10
title: Be of Good Courage, and Let Us Play the Men
tagline: David sends men to comfort the new king of Ammon for his father's death; Hanun's princes call them spies, and he shaves half their beards and cuts their garments; Joab and Abishai beat the Ammonites and their hired Syrians, and David defeats Hadarezer's army at Helam.
when: 'When the king of the Ammonites died (“after this,” verse 1), in the years of David''s wars'

setting: |
  The Ammonites lived east of the Jordan, from the Jabbok southward, a people descended from Lot. In the days of the judges they claimed the Israelite towns of Gilead and were driven back by Jephthah, and again by Saul at Jabesh-gilead ([[1 Sam. 11:1]]). This chapter begins the war in which David finally subdued them, a war that runs on through chapters 11 and 12.

  Nahash is the name of the Ammonite king Saul defeated at Jabesh. Older commentaries differ on whether the Nahash who dies here is the same man: one older reading says he is; another, that at least forty years had passed, so that this Nahash was probably the earlier king's son or grandson. Scripture does not say what kindness Nahash had shown David.

  Chapter 8 had already listed Ammon among the peoples David conquered and told of his victory over Hadadezer of Zobah “at the river Euphrates” ([[2 Sam. 8:3]], [[2 Sam. 8:12]]). One older reading thinks the Syrian war of this chapter is probably that same war, here described in detail. Chronicles tells the chapter a second time, with some differences in the numbers ([[1 Chr. 19:1–19]]).

thread: |
  The chapter begins with a kindness and ends with a war, and the hinge between them is a misreading. David sends men to comfort a new king for his father, as one king to another who had been kind to him. The princes of Ammon cannot believe a kindness from David; they tell Hanun the comforters are spies, and he makes the messengers a spectacle. But messengers stand for the one who sent them: what was done to these men was done to David, and David answers it as such.

  Joab fights the war that follows as the LORD's battle. Caught between two armies, he divides his men, promises Abishai help, and puts the outcome in the LORD's hands (verses 11–12). The Syrians flee, then gather again, with Syrians from beyond the Euphrates, and lose again, and their kings make peace and serve Israel.

  But the Ammonites are not beaten. They shut themselves in their city, and Joab goes home. The chapter is told at this length because of what it leads to: the war was still going on, with Joab besieging the Ammonite capital and David staying behind in Jerusalem, when David saw Bath-sheba ([[2 Sam. 11:1]]).

sections:
  - range: 1-5
    heading: Kindness taken for spying
    plain: |
      Some time after this the king of the Ammonites died, and his son Hanun became king in his place. David said, “I will show kindness to Hanun the son of Nahash, as his father showed kindness to me.” So David sent his servants to comfort him over his father, and they came into the land of the Ammonites. But the Ammonite princes said to Hanun their lord, “Do you think David is honoring your father by sending you comforters? Hasn't David sent his servants to explore the city, spy it out and overthrow it?” So Hanun took David's servants, shaved off half of each man's beard, cut their garments off at the middle, up to their buttocks, and sent them away. When David was told, he sent men to meet them, for they were deeply ashamed, and the king said, “Stay at Jericho until your beards have grown, and then come back.”
  - range: 6-14
    heading: Joab and Abishai before the city
    plain: |
      When the Ammonites saw that they had made themselves odious to David, they sent and hired the Syrians of Beth-rehob and of Zoba, twenty thousand foot soldiers, the king of Maacah with a thousand men, and twelve thousand men of Tob. When David heard of it, he sent Joab and the whole army of fighting men. The Ammonites came out and drew up for battle at the entrance of the city gate, while the Syrians of Zoba and Rehob, and the men of Tob and Maacah, were by themselves in the open country. Joab saw that the battle faced him in front and behind, so he chose some of Israel's best men and drew them up against the Syrians, and he put the rest of the army under his brother Abishai, drawn up against the Ammonites. He said, “If the Syrians are too strong for me, you come and help me; but if the Ammonites are too strong for you, I will come and help you. Be strong, and let us show ourselves strong for our people and for the cities of our God, and may the LORD do what seems good to Him.” Joab and his men advanced to fight the Syrians, and they fled before him. When the Ammonites saw that the Syrians had fled, they too fled before Abishai and went into the city. Then Joab came back from fighting the Ammonites and returned to Jerusalem.
  - range: 15-19
    heading: Hadarezer defeated at Helam
    plain: |
      When the Syrians saw that Israel had beaten them, they gathered together. Hadarezer sent and brought out the Syrians from beyond the river Euphrates, and they came to Helam, with Shobach, the commander of Hadarezer's army, leading them. When David was told, he gathered all Israel, crossed the Jordan and came to Helam. The Syrians drew up against David and fought him, and they fled before Israel. David killed the men of seven hundred Syrian chariots and forty thousand horsemen, and struck down Shobach their commander, who died there. When all the kings who were Hadarezer's vassals saw that Israel had beaten them, they made peace with Israel and served them. And the Syrians were afraid to help the Ammonites any more.

notes:
  - ref: 2
    phrase: I will shew kindness unto Hanun the son of Nahash, as his father shewed kindness unto me
    kind: words
    title: Kindness between kings
    body: |
      The kindness David offers Hanun is *ḥesed*, the loyal, covenant kindness he has just done for Jonathan's son (the word is explained at [[2 Sam. 9:1]]), now done between two kings. It is the Old Testament's great word for how Israel was to act and for what God is like, so hard to translate that the King James uses some fifteen English words for it, mercy, kindness and loving-kindness most often. David uses it in his politics as well as in his friendships: he blesses the men of Jabesh-gilead for the *ḥesed* they did Saul in burying him ([[2 Sam. 2:5–6]]), sends this embassy to Hanun, and on his deathbed tells Solomon to do *ḥesed* to the sons of Barzillai, who had come to him when he fled ([[1 Kgs. 2:7]]).

      What David says of it here is that it is owed. *Ḥesed* answers *ḥesed*, as when Abimelech asked Abraham to deal with him “according to the kindness that I have done unto thee” ([[Gen. 21:23]]): Nahash had done David kindness, and David returns it to the son by comforting him for his father. The next verse turns on it. The princes of Ammon do not take the kindness as kindness at all, but as a pretext to spy out the city.
    sources: [belnap-hesed]

  - ref: 4
    phrase: shaved off the one half of their beards, and cut off their garments in the middle, even to their buttocks
    kind: symbol
    title: Half a beard and cut garments
    body: |
      Hanun's treatment of the envoys was a ritual humiliation aimed past them at David. The half-shaved beard and the garments cut away to the buttocks did it in a way no one could miss. Isaiah later used the same picture, a beard shaved by a foreign hand, for the judgment on Judah ([[Isa. 7:20]]).

      The insult was David's because the men were his. A messenger in the ancient Near East did not act on his own account; he represented the one who sent him, so that whatever was done to him reflected on the sender. Inhospitality to these men was inhospitality to David, and that is why the next verse can say the Ammonites knew they had made themselves odious “before David” (verse 6). David's first act, though, is for the men themselves: he sends to meet them, “because the men were greatly ashamed,” and lets them wait at Jericho until their beards have grown (verse 5).
    sources: [belnap-dust-feet]

  - ref: 6
    phrase: they stank before David
    kind: words
    title: They stank before David
    body: |
      “Stank” is a picture: the Hebrew verb means to smell bad and, figuratively, to be offensive, so the Ammonites saw that they had become a bad smell to David. Chronicles, telling the same verse, puts it without the image: they “had made themselves odious to David” ([[1 Chr. 19:6]]). The phrase says what the Ammonites understood about what they had done, and they began to prepare for war before David moved. Chronicles adds what the hired army cost them: “a thousand talents of silver,” for chariots and horsemen from Mesopotamia, Syria-maachah and Zobah.
    sources: [strongs-concordance, lds-scriptures]

  - ref: 12
    phrase: 'let us play the men for our people, and for the cities of our God: and the LORD do that which seemeth him good'
    kind: words
    title: Let us play the men
    body: |
      Joab's words are a call to courage joined to trust in the LORD. “Play the men” is the King James' way of saying “act like men”; the Hebrew is the verb “be strong” twice, “Be strong, and let us show ourselves strong,” and Chronicles has “let us behave ourselves valiantly” ([[1 Chr. 19:13]]).

      Joab gives two reasons to fight, and both look past the army. The first is “our people.” The second is “the cities of our God”: as Israel was the LORD's people, the land He had given them was His, and its towns were His, so the battle was for what belonged to the LORD. Then he leaves the result with the LORD. One older reading would translate the clause as a statement, “the LORD will do” what seems good to Him, and calls it “an expression of trust combined with resignation to God's will,” comparing Eli's words when he heard the judgment on his house ([[1 Sam. 3:18]]). Joab says it after he has done what a commander can: split his force and promised Abishai help (verse 11).
    sources: [cambridge-1-samuel, oshb-wlc, lds-scriptures]

  - ref: 14
    phrase: fled they also before Abishai, and entered into the city
    kind: history
    title: Into the city
    body: |
      The Ammonites were beaten in the field but not conquered: they shut themselves into their city, and Joab went home. The next chapter names the city: Rabbah, the Ammonite capital in the valley of the upper Jabbok, whose ruins are at modern Amman. The war is taken up again “after the year was expired, at the time when kings go forth to battle” ([[2 Sam. 11:1]]), when David sends Joab and all Israel to besiege it and stays behind in Jerusalem. It falls only at the end of chapter 12, when Joab takes the “city of waters” and calls David to come and take the rest ([[2 Sam. 12:26–29]]). The war this chapter begins is the war in which David finally subdued Ammon, and what happens in chapters 11 and 12 happens while it is being fought.
    sources: [bd-rabbah, bd-ammon]

  - ref: 18
    phrase: seven hundred chariots of the Syrians, and forty thousand horsemen
    kind: history
    title: Seven hundred chariots, or seven thousand
    body: |
      Chronicles gives different figures for this battle: “seven thousand men which fought in chariots, and forty thousand footmen” ([[1 Chr. 19:18]]). It differs in verse 6 too, where it has the Ammonites hire “thirty and two thousand chariots” ([[1 Chr. 19:7]]).

      The likeliest cause is copying. Numbers “were peculiarly difficult to transmit accurately,” and sometimes “extra noughts” were added; this verse, with 700 chariots against Chronicles' 7,000, is one of the examples given. One older reading keeps Samuel's seven hundred chariots and Chronicles' footmen, and thinks that horsemen in one book and footmen in the other point to some further error in the text. The King James gives Samuel's figures as they stand. The two books agree on the outcome: the Syrians fled and Shobach died.
    sources: [ot-manual-large-numbers, cambridge-1-samuel, lds-scriptures]

christ: |
  David took the shame done to his servants as done to himself, because messengers stand for the one who sent them. Jesus Christ taught the same of those He sends: “He that receiveth whomsoever I send receiveth me; and he that receiveth me receiveth him that sent me” ([[John 13:20]]); and He told John Murdock before his mission, “who receiveth you receiveth me” ([[D&C 99:2]]). He went further and counted what is done to “one of the least of these my brethren” as done to Him ([[Matt. 25:40]]).

  So the kindness or contempt a disciple shows another reaches Christ Himself, and a disciple sent in His name carries it: how he is received is how Christ is received.

explore: |
  - **The war in Chronicles.** [[1 Chr. 19:1–19]], the same chapter told again, and [[1 Chr. 20:1–3]], the fall of Rabbah.
  - **How the war ends.** [[2 Sam. 11:1]] and [[2 Sam. 12:26–31]].
  - ***Ḥesed* in David's reign.** [[2 Sam. 2:5–6]]; [[2 Sam. 9:1–7]]; [[1 Kgs. 2:7]]. The Sperry Symposium study “How Excellent Is Thy Lovingkindness” follows the word through the Old Testament.

sources: [lds-scriptures, bd-ammon, bd-rabbah, belnap-hesed, belnap-dust-feet, oshb-wlc, ot-manual-large-numbers, keil-1-samuel, cambridge-1-samuel, strongs-concordance]
