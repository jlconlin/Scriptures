chapter: 13
title: Amnon and Tamar
tagline: David's eldest son forces his half-sister Tamar and casts her out; the king is angry and does nothing; two years later Absalom has Amnon killed at a sheepshearing feast and flees to Geshur.
when: 'After the war with Ammon: two full years, then three in Geshur'

setting: |
  Chapter 12 ended with Rabbah taken and David's army home in Jerusalem. Before that, Nathan had told the king that because he had killed Uriah with the sword and taken his wife, “the sword shall never depart from thine house,” and that the LORD would raise up evil against him “out of thine own house” ([[2 Sam. 12:10–11]]). This chapter opens the last part of the book, chapters 13–24, in which David's family is broken by lust and murder and his son Absalom reaches for the throne.

  The three at the center are David's children by different wives ([[2 Sam. 3:2–3]]). Amnon was the eldest, son of Ahinoam of Jezreel, the crown prince and natural heir. Absalom was the third son, and Tamar his full sister; their mother was Maacah, daughter of Talmai king of Geshur. So Amnon and Tamar were half-brother and half-sister, and when Absalom flees at the end of the chapter he goes to his mother's father.

  Genesis tells a story of the same shape, Dinah wronged and her brothers' revenge, and the site's note at [[Gen. 34:7]] explains the words “folly in Israel” that Tamar uses here. The guide [Women and marriage in the Old Testament](/old-testament/guides/women-and-marriage/#hard-passages) sets her beside the other hard passages about women.

thread: |
  This is the first working-out of Nathan's sentence: the evil rises “out of thine own house,” and the sword falls on the king's own son (the note at [[2 Sam. 12:10]] follows it through the rest of the book). On one Latter-day Saint reading the story is David's sin repeated in his son: as David had let lust rule him with Bath-sheba and then plotted to cover it, so Amnon lusts and plots; and the king whose own conduct had left him no ground to condemn does nothing.

  Around Tamar the men fail one after another. A cousin draws up the plan, her father unknowingly sends her to Amnon's house, a servant bolts the door behind her, and her brother tells her to hold her peace; it is a conspiracy of men before the crime and a conspiracy of silence after it. Tamar is the one who will not be silent. She refuses, appeals to Israel's standard and to the king, warns Amnon what it will make of them both, and when she is thrown out she does not hide what was done to her.

  The second half is Absalom's. He is silent for two full years, then invites the king's sons to a feast and has Amnon struck down. A false report tells David all his sons are dead; Jonadab, who had planned the first crime, now explains the second. The king weeps for Amnon, Absalom flees to Geshur, and the chapter closes on a verse whose Hebrew leaves it uncertain what David felt toward the son who was gone, which is where chapter 14 begins.

sections:
  - range: 1-6
    heading: Amnon's sickness and Jonadab's plan
    plain: |
      Some time after this, Absalom son of David had a beautiful sister named Tamar, and Amnon son of David fell in love with her. Amnon was so tormented that he made himself ill over his sister Tamar, for she was a virgin, and it seemed impossible to him to do anything to her.

      But Amnon had a friend named Jonadab, the son of David's brother Shimeah, and Jonadab was a very crafty man. He said to Amnon, “Why are you, the king's son, looking so worn day after day? Won't you tell me?” Amnon said, “I love Tamar, my brother Absalom's sister.” Jonadab said, “Lie down on your bed and pretend to be sick. When your father comes to see you, say to him, ‘Please let my sister Tamar come and give me something to eat. Let her prepare the food in front of me, so that I can watch her and eat it from her hand.’” So Amnon lay down and pretended to be sick, and when the king came to see him, Amnon said, “Please let my sister Tamar come and make a couple of cakes in front of me, so that I can eat from her hand.”
  - range: 7-14
    heading: Tamar forced
    plain: |
      David sent word to Tamar: “Go to your brother Amnon's house and prepare food for him.” So Tamar went to her brother Amnon's house, where he was lying down. She took dough, kneaded it, made cakes in front of him and baked them. Then she took the pan and set them out before him, but he refused to eat. “Send everyone out,” Amnon said, and everyone went out. Then Amnon said to Tamar, “Bring the food into the bedroom, so that I can eat from your hand.” Tamar took the cakes she had made and brought them to her brother Amnon in the bedroom.

      When she brought them to him to eat, he grabbed her and said, “Come, lie with me, my sister.” She answered, “No, my brother! Do not force me. Such a thing is not done in Israel. Do not do this disgraceful thing. Where could I go with my shame? And you would be one of the shameless fools in Israel. Please, speak to the king; he will not keep me from you.” But he would not listen to her. Being stronger than she, he forced her and raped her.
  - range: 15-20
    heading: Cast out
    plain: |
      Then Amnon hated her with an intense hatred, greater than the love he had felt for her. “Get up and go,” he told her. She said, “No! Sending me away is a greater wrong than what you have already done to me.” But he would not listen to her. He called the servant who attended him and said, “Get this woman out of my sight and bolt the door after her.”

      She was wearing a full-length robe, the kind the king's virgin daughters wore. His servant put her out and bolted the door behind her. Tamar put ashes on her head, tore the robe she was wearing, put her hand on her head, and went away crying aloud.

      Her brother Absalom said to her, “Has Amnon your brother been with you? Be quiet for now, my sister; he is your brother. Don't take this to heart.” And Tamar lived in her brother Absalom's house, a desolate woman.
  - range: 21-22
    heading: David's anger, Absalom's hatred
    plain: |
      When King David heard all this, he was furious. Absalom said nothing at all to Amnon, good or bad, for he hated Amnon because he had forced his sister Tamar.
  - range: 23-29
    heading: Absalom's feast
    plain: |
      Two full years later Absalom had sheepshearers at Baal-hazor, near Ephraim, and he invited all the king's sons. Absalom came to the king and said, “Your servant has sheepshearers. Will the king and his servants please come with me?” The king said, “No, my son, we should not all go; we would only be a burden to you.” Absalom urged him, but he would not go, though he gave him his blessing. Then Absalom said, “If not, please let my brother Amnon come with us.” The king asked, “Why should he go with you?” But Absalom kept urging him, until he let Amnon and all the king's sons go with him.

      Absalom ordered his servants, “Watch: when Amnon's heart is merry with wine and I say to you, ‘Strike Amnon,’ then kill him. Don't be afraid. Haven't I commanded you? Be strong and brave.” So Absalom's servants did to Amnon what Absalom had commanded. Then all the king's sons got up, mounted their mules and fled.
  - range: 30-36
    heading: The report reaches David
    plain: |
      While they were on the way, the report reached David: “Absalom has killed all the king's sons, and not one of them is left.” The king stood up, tore his clothes and lay on the ground, and all his servants stood by with their clothes torn.

      But Jonadab, the son of David's brother Shimeah, said, “My lord must not think they have killed all the young men, the king's sons; only Amnon is dead. Absalom has planned this from the day Amnon forced his sister Tamar. So my lord the king should not take to heart the idea that all the king's sons are dead; only Amnon is dead.”

      Meanwhile Absalom fled. The young man keeping watch looked up and saw many people coming along the road on the hillside behind him. Jonadab said to the king, “Look, the king's sons are coming; it is just as your servant said.” As he finished speaking, the king's sons came in, weeping aloud, and the king and all his servants wept bitterly too.
  - range: 37-39
    heading: Absalom in Geshur
    plain: |
      Absalom fled and went to Talmai son of Ammihud, king of Geshur. And David mourned for his son every day. So Absalom fled to Geshur and stayed there three years. And King David's heart longed to go out to Absalom, for he had been consoled over Amnon's death. (The Hebrew of this last sentence is uncertain; see the note.)

notes:
  - ref: 1
    phrase: Absalom the son of David had a fair sister, whose name was Tamar
    kind: history
    title: Three of David's children
    body: |
      Tamar is introduced as “Absalom's sister,” and the two were full brother and sister, children of Maacah, daughter of Talmai king of Geshur ([[2 Sam. 3:3]]). Amnon was David's firstborn, by Ahinoam of Jezreel, and so the heir apparent to the throne. The second son, Chileab, is never mentioned again, and Absalom was the third.

      That is why the story matters beyond one household. It stands at the head of the long account of who would take David's throne: the heir apparent dies in this chapter, and the son who has him killed is the one who, some years later, will try to take the kingdom ([[2 Sam. 15:10]]). The story of the six sons born in Hebron is at [[2 Sam. 3:2]].
    sources: [easton-recognizing, lds-scriptures]

  - ref: 3
    phrase: Jonadab was a very subtil man
    kind: words
    title: A very subtil man
    body: |
      “Subtil” here means crafty. The Hebrew word, *ḥākām*, is usually “wise,” but here it has the sense “shrewd, crafty, cunning,” and the same word names the “wise woman” Joab brings from Tekoa in the next chapter ([[2 Sam. 14:2]]). Jonadab's craft shows in what he does: he notices the prince's misery, draws out its cause, and lays out the whole scheme, down to what Amnon should say to his father.

      He is David's own nephew, the son of David's brother Shimeah. Amnon reaches Tamar through the scheming of his cousin and the unwitting help of his father, and the story shows how those around a victim can make abuse possible. Jonadab appears once more at the end of the chapter. When word comes that all the king's sons are dead, he tells David at once that only Amnon is dead, for Absalom had planned it “from the day that he forced his sister Tamar” ([[2 Sam. 13:32]]).
    sources: [bdb, oshb-wlc, easton-recognizing, lds-scriptures]

  - ref: 13
    phrase: he will not withhold me from thee
    kind: history
    title: Speak unto the king
    body: |
      Tamar's last plea asks Amnon to seek her in marriage, a marriage the law of Moses forbade. The law names a sister who is “the daughter of thy father, or daughter of thy mother” ([[Lev. 18:9]]; also [[Lev. 18:11]] and [[Lev. 20:17]]). Marriage between half-brother and half-sister had been allowed in the patriarchs' day: Abraham said of Sarah, “she is the daughter of my father, but not the daughter of my mother” ([[Gen. 20:12]]).

      Older commentaries read her words in two ways. On one, she meant what she said: the king could permit a regular marriage, either because the law was not strictly kept in David's time or because she hoped he would make an exception to escape the violence at hand. On the other, she knew the law, and her plea was only a means of escape: she was trying to get away from him by any means she had, and to give him hope rather than drive him further. Either way, she is reasoning with him to the last. She has already set out what the act would make of them both: “whither shall I cause my shame to go? and as for thee, thou shalt be as one of the fools in Israel.” A “fool” in that sense is not a stupid man but one who has cast off the fear of God and the restraints of decency, and “folly” is the word for unchastity that the site explains at [[Gen. 34:7]].
    sources: [lds-scriptures, cambridge-1-samuel, keil-1-samuel]

  - ref: 14
    phrase: being stronger than she, forced her, and lay with her
    kind: history
    title: What Amnon did
    body: |
      The verse names the crime plainly: Tamar refused, and Amnon raped her. Her refusal had been as clear as words could make it. She said no, called him her brother, told him he was forcing her, appealed to what Israel held to be evil, set out what it would cost them both, and offered another way (verses 12–13). “Howbeit he would not hearken unto her voice.” The narrator says why she could not stop him: he was “stronger than she.” On one Latter-day Saint reading, the story “names rape for what it is: a violent assault on an individual.”

      The Hebrew verb for “force,” *ʿinnâ*, has here the sense to “humble, a woman by cohabitation”; it is the verb used of Shechem and Dinah ([[Gen. 34:2]], where the site explains it), and it returns for this act in verses 12, 22 and 32.
    sources: [easton-recognizing, bdb]

  - ref: 16
    phrase: this evil in sending me away is greater than the other that thou didst unto me
    kind: history
    title: Sent away
    body: |
      Tamar's words describe what Amnon's hatred would do to her life. He could at least have taken her into his household as a wife or concubine and saved her from disgrace. By throwing her out he left her disgraced and without hope of a husband, so that she mourned as a widow mourns. Tamar sees the situation clearly: casting her out sentenced her to a life of desolation (verse 20).

      The sudden hatred of verse 15 is, on one reading, what lust becomes once it is satisfied: Amnon “did not really love Tamar,” and men who use women this way “despise the women rather than themselves.”
    sources: [ot-manual-2-samuel-13, easton-recognizing, lds-scriptures]

  - ref: 18
    phrase: she had a garment of divers colours upon her
    kind: words
    title: A garment of divers colours
    body: |
      The narrator stops, as the door is bolted, to say what Tamar was wearing, and the Hebrew phrase is the one used of Joseph's coat. *Kĕtōnet passîm* is in the Bible only here and in Genesis 37, where the King James calls it “a coat of many colours” ([[Gen. 37:3]]). The lexicon reads it as a “tunic reaching to palms and soles,” a robe down to the wrists and the ankles. The narrator explains it himself: it was what the king's virgin daughters wore.

      So when Tamar tears it (verse 19), she tears the garment that marked her as a king's unmarried daughter. With ashes on her head and her hand on her head, crying aloud as she went, she mourned. The next verse uses the word “desolate” for the life she led after, in Absalom's house; the Septuagint, the ancient Greek translation, renders it that she “dwelt as a widow.”
    sources: [bdb, lxx-rahlfs, lds-scriptures]

  - ref: 20
    phrase: hold now thy peace, my sister
    kind: history
    title: Hold now thy peace
    body: |
      Absalom takes Tamar into his house, and his first words to her are a command to be silent. He asks at once what has happened (“Hath Amnon thy brother been with thee?”) and tells her not to take it to heart, because “he is thy brother.” With those words Tamar disappears from the story; she is not heard again.

      On one Latter-day Saint reading, the charge is a painful reminder of the silence that has long surrounded rape and abuse, where those who have been wronged are pressed and shamed into keeping quiet. Absalom's own silence follows: he says nothing to Amnon, “neither good nor bad” (verse 22), and waits two full years.
    sources: [easton-recognizing, lds-scriptures]

  - ref: 21
    phrase: he was very wroth
    kind: history
    title: Very wroth, and nothing more
    body: |
      The Hebrew says only that David was very angry; it does not say he did anything. The law named the act a wicked thing for which the man was to be “cut off in the sight of their people” ([[Lev. 20:17]]), and the narrative does not say that the king acted on it.

      One reason reaches back to chapter 11: David's “own conduct with Bath-sheba had left him without a basis for condemnation,” and “because of his own guilt, David did not act to correct this great abomination in his own household.” The Septuagint, the ancient Greek translation, adds a reason of its own: “but he did not grieve the spirit of his son Amnon,” because he loved him, his firstborn. On one older reading that clause probably gives the true reason, though it is the translators' guess and no ground for changing the Hebrew text; David's guilt was then only part of the cause, and his indulgence of his sons and want of discipline the chief part. On one Latter-day Saint reading, the king's choice to ignore the act he knew of, and later to mourn Amnon rather than to acknowledge Tamar's suffering, is “a terrifying example” of how such violence comes to be tolerated, and God does not sanction it, in the Bible or now.
    sources: [lxx-rahlfs, keil-1-samuel, lds-scriptures, ot-manual-2-samuel-13, easton-recognizing]

  - ref: 23
    phrase: after two full years
    kind: history
    title: After two full years
    body: |
      Absalom waited two years, and when he struck he used a family feast to do it. Sheepshearing was a time for a feast that gathered the family. He asked the king first, and David declined so as not to be a burden on his son; then Absalom asked for Amnon by name, and kept pressing until the king let all his sons go. At Baal-hazor Absalom waited until Amnon's heart was “merry with wine,” and his servants killed him at his word.

      Jonadab's explanation to the king, that this had been “determined from the day that he forced his sister Tamar” ([[2 Sam. 13:32]]), names revenge as the motive. A further question is whether that was all: Amnon was the heir, and his death cleared Absalom's own way to the throne.
    sources: [ot-manual-2-samuel-13, easton-recognizing, lds-scriptures]

  - ref: 39
    phrase: the soul of king David longed to go forth unto Absalom
    kind: words
    title: Longed to go forth unto Absalom
    body: |
      The chapter's last verse is uncertain in Hebrew, and it has been read in nearly opposite ways. The verb is feminine and has no stated subject; the King James, following the Jewish commentators, supplies “the soul of king David” and reads it as longing: once his grief for Amnon had eased, David pined for Absalom. Modern translations read it the same way: “the spirit of the king longed to go out to Absalom”; “the heart of the king went out, yearning for Absalom.”

      On the other reading, the verb does not mean “longed,” and that if David had wanted Absalom back he could have recalled him; even when Absalom does return, the king will not see his face for two years ([[2 Sam. 14:24]], [[2 Sam. 14:28]]). That reading takes “to go forth unto” in a hostile sense, of going out against him: David gave up going out after Absalom. The Septuagint reads that way, “king David ceased to go out after Abessalom.” On either reading time has eased David's grief, and chapter 14 opens as Joab “perceived that the king's heart was toward Absalom” ([[2 Sam. 14:1]]).
    sources: [cambridge-1-samuel, keil-1-samuel, lxx-rahlfs, esv, nrsvue, oshb-wlc]

christ: |
  In David's house Tamar was told to hold her peace, and the king who heard of it was angry and did nothing (verses 20–21). For those who have been abused, “the power of healing is inherent in the Atonement of Jesus Christ”: the Father “provided a way to heal the consequences of acts that, through force, misuse of authority, or fear of another, temporarily take away the agency of the abused.” What was done to a person by another's force does not define who that person is, and healing from it comes through the Atonement of Jesus Christ.

explore: |
  - **Dinah and her brothers.** [[Gen. 34:1–31]], the other story of a daughter forced and avenged, and of a father's silence.
  - **Absalom's return.** [[2 Sam. 14:1–33]], where Joab and the woman of Tekoa bring Absalom home.
  - **A father who did not rebuke his sons.** Of Adonijah: “his father had not displeased him at any time in saying, Why hast thou done so?” ([[1 Kgs. 1:6]]).
  - **A study.** “Recognizing Responsibility and Standing with Victims,” a chapter in the Religious Studies Center's *Covenant of Compassion* reads Tamar's story closely, alongside Hagar's.

