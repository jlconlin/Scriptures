summary: >-
  Second Samuel is the reign of David: a throne promised for ever, a king who falls and
  whose house bleeds for it, and a book that ends not on his glory but on a plain threshing
  floor he buys at a price. Its quiet center is that bare floor of beaten rock on a hilltop,
  the place that "doth cost me nothing" will not stand for, where the plague stops and the
  house of the LORD will later be built. It points to Jesus Christ, the Son of David, who
  keeps the promise of the throne when the king fails and who gives the offering that costs.
motifs:
  - "Primary: a round threshing floor of flat, beaten pale rock on a hilltop, swept clean, with a little chaff lifting from its edge in the morning air and a single wooden threshing sledge resting at one side (2 Sam. 24:18, 24)."
  - "Supporting: at the lower left, one long, squared cedar beam lying on the ground beside a low tent of dark woven goat-hair curtains, the plain tent smaller and quieter than the beam (2 Sam. 7:2)."
  - "Supporting: at the lower right, a narrow brook in a shallow dry valley with a rough path crossing it on flat stones and climbing a slope of olive trees toward the skyline (2 Sam. 15:23, 30)."
composition: >-
  A wide, calm landscape of hill country at first light, seen from a little below a hilltop.
  The threshing floor sits just right of center on the crest in the middle distance, the
  clearest and brightest shape in the picture, a pale round of cleared stone catching the
  first gold light, with chaff drifting off its edge and the sledge resting beside it. At the
  lower left the cedar beam and the low goat-hair tent lie quietly on the ground, small and
  not the focal point. At the lower right the brook and its stepping-stone path wind up
  through the olive slope toward the skyline, leading the eye gently toward the floor.
  Behind the hill the land falls away in soft layers of muted olive and indigo shadow, and
  the sky shades from deep indigo at the top to restrained gold at the horizon. No
  figures, altar fire, smoke, crowns, thrones, weapons, armies, city, or storms; no other
  vessels or objects.
alt: A round floor of pale, flat rock swept clean sits on a hilltop at first light with a little chaff drifting from its edge and a wooden threshing sledge beside it; at the lower left a squared cedar beam lies next to a low tent of dark woven curtains, and at the lower right a narrow brook with a stepping-stone path crosses a slope of olive trees, under an indigo-to-gold sky.
status: proposed
