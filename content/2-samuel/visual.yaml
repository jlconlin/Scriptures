summary: >-
  Second Samuel is the reign of David: a throne promised for ever, a king who takes the one
  little ewe lamb of a poorer man and hears “Thou art the man,” whose house bleeds for it, and
  a book that ends not on his glory but on a plain threshing floor he buys at a price, where
  the king who asked to die for “these sheep” is told to offer instead. It points to Jesus
  Christ, the Son of David and the Good Shepherd, who gives His life for the sheep.
motifs:
  - "Primary: on the exposed crest of a hill, a roughly round threshing floor of beaten, packed earth and flat bare bedrock, dusty and uneven, with golden straw and chaff scattered on it and drifting off its edge in the morning air, its rim marked only by a loose, broken ring of uneven fieldstones partly sunk in the grass, (2 Sam. 24:18, 24). Never paved, polished or curbed."
  - "On the floor, at its center: a simple, low altar of rough, uncut fieldstones, with a single thin line of smoke rising straight up and no visible flames; beside it the threshing sledge broken up for firewood and two empty ox yokes (2 Sam. 24:22, 25)."
  - "With the floor: at its left edge, inside the ring of fieldstones, building materials gathered and waiting with nothing built: a low stack of squared, dressed pale stones and three squared cedar beams laid side by side (2 Sam. 7:2, 13; 1 Chr. 22:5)."
  - "Supporting: in the near foreground grass at the lower left, one small young ewe lamb, alone, lying quietly with its legs folded under it and its head up, soft white fleece catching the light; small in the frame, not posed, not looking at the viewer (2 Sam. 12:3)."
  - "Supporting: at the lower right, a narrow brook in a shallow valley with a rough path crossing it on flat stones and climbing a slope of olive trees toward the skyline (2 Sam. 15:23, 30)."
composition: >-
  A wide, calm landscape of hill country at first light, seen from a little below a hilltop.
  The sun is low at the left, and shadows fall to the right. The threshing floor sits just
  right of center on the crest in the middle distance, the clearest and brightest place in
  the picture, catching the first gold light, with chaff drifting off its edge. In the near
  foreground at the lower left, the small ewe lamb lies alone in the grass, quiet and gentle,
  smaller than the floor and well apart from it. At the lower right the brook and its
  stepping-stone path wind up through the olive slope toward the skyline, leading the eye
  gently toward the floor. Behind the hill the land falls away in soft layers of muted olive
  and indigo shadow, and the sky shades from deep indigo at the top to restrained gold at the
  horizon. No figures, no other animals, no altar fire, smoke, crowns, thrones, weapons,
  armies, city, tents or storms; no other vessels or objects.
# "What's in this picture" under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The altar on the threshing floor** is the one David built on Araunah’s floor, with the sledges and the oxen’s yokes for wood ([[2 Sam. 24:22]]), when “the LORD was entreated for the land, and the plague was stayed” ([[2 Sam. 24:25]]): “neither will I offer burnt offerings unto the LORD my God of that which doth cost me nothing” ([[2 Sam. 24:24]]); Chronicles names it as the ground of the temple ([[2 Chr. 3:1]]).'
  - '**The dressed stones and cedar beams waiting at the edge of the floor** are the house David wanted to build: “I dwell in an house of cedar, but the ark of God dwelleth within curtains” ([[2 Sam. 7:2]]); the LORD answered that his son “shall build an house for my name” ([[2 Sam. 7:13]]), and David gathered the materials for him ([[1 Chr. 22:5]]).'
  - '**The ewe lamb** is Nathan’s parable of the poor man’s “one little ewe lamb” ([[2 Sam. 12:3]]), which brought David to “Thou art the man” ([[2 Sam. 12:7]]) and to “I have sinned against the LORD” ([[2 Sam. 12:13]]).'
  - '**The brook and the path up through the olives** are the way David fled from Absalom: “all the country wept with a loud voice … the king also himself passed over the brook Kidron” and “went up by the ascent of mount Olivet, and wept as he went up” ([[2 Sam. 15:23]]; [[2 Sam. 15:30]]).'
asset: /assets/2-samuel-book-art.jpg
alt: A roughly round threshing floor of beaten earth and bare rock strewn with straw sits on a hilltop at first light, ringed by loose fieldstones, with a low altar of rough stones at its center, a thin line of smoke rising from it, broken planks and two ox yokes beside it, chaff drifting from its edge, and a small stack of dressed stones and cedar beams waiting at its edge; a small white ewe lamb lies alone in the grass at the lower left, and at the lower right a narrow brook with a stepping-stone path climbs a slope of olive trees, under an indigo-to-gold sky.
