chapter: 23
claims:
  - where: setting
    claim: 'The last words follow the psalm of chapter 22 and rest on the promise through Nathan in chapter 7; the heading “these be the last words of David” follows the psalm'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/23.htm'
    quote: 'The psalm of thanksgiving … is followed by the prophetic will and testament of the great king … on the strength of the divine promise which he received through the prophet Nathan, that his throne should be established for ever (2 Samuel 7). … The heading "these are the last words of David" serves to attach it to the preceding psalm of thanksgiving.'
  - where: setting
    claim: 'The exploits of the mighty men were probably gathered from various times in David''s life'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'The exploits recorded here were probably taken from various times in David’s life and placed together at this point.'
  - where: setting
    claim: 'Chronicles places the list after David''s capture of Zion; the list belongs in substance to the earlier part of the reign'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/23.htm'
    quote: 'This section is placed in Chronicles after the account of David’s election as King of Israel and his capture of Zion … The list therefore belongs, at any rate in substance, to the earlier part of David’s reign.'
  - where: setting
    claim: 'Chronicles introduces the list as the men who strengthened themselves with David to make him king'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/11?lang=eng'
    quote: 'These also are the chief of the mighty men whom David had, who strengthened themselves with him in his kingdom, and with all Israel, to make him king, according to the word of the Lord concerning Israel.'
  - where: setting
    claim: 'David''s death is told in Kings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'So David slept with his fathers, and was buried in the city of David.'
  - where: setting
    claim: 'Chapter 22 is the same psalm as Psalm 18'
    key: bd-david
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/david?lang=eng'
    quote: 'while Ps. 18 (2 Sam. 22) marks the highest point of the national prosperity.'
  - where: thread
    claim: 'The mighty men strengthened themselves with David to make him king'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/11?lang=eng'
    quote: 'who strengthened themselves with him in his kingdom, and with all Israel, to make him king'
  - where: thread
    claim: 'The second half of verse 3 draws in six Hebrew words the portrait of an ideal king'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/23.htm'
    quote: 'The second half of 2 Samuel 23:3 draws, with a few strong strokes—there are but six words in the original—an outline portrait of an ideal king, ruling with perfect justice, controlled and guided by the fear of God.'
  - where: 'section 1 plain'
    claim: '“Fenced” in verse 7 means equipped'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/23?lang=eng'
    quote: '7a “fenced”: OR equipped.'
  - where: 'note 23:1 “The oracle of David”'
    claim: 'The word rendered “said” is nĕʾum, an utterance or revelation, used of prophets; with a human speaker it is used of Balaam, of the man of Proverbs 30:1, and of David here; otherwise of the LORD'
    key: bdb
    url: 'https://biblehub.com/hebrew/5002.htm'
    quote: '1 utterance, declaration, revelation, of prophet in ecstatic state בלעם ׳נ Numbers 24:3,15 … הַגֶּבֶר ׳נ Numbers 24:3; Numbers 24:15; 2 Samuel 23:1; Proverbs 30:1; דוד ׳נ 2 Samuel 23:1'
  - where: 'note 23:1 “The oracle of David”'
    claim: 'With the LORD''s name, nĕʾum is the prophet''s formula citing the divine word'
    key: bdb
    url: 'https://biblehub.com/hebrew/5002.htm'
    quote: 'יהוה ׳נ utterance, declaration of ׳י (prophet citing divine word given through him)'
  - where: 'note 23:1 “The oracle of David”'
    claim: 'The Hebrew of verse 1 has nĕʾum twice, before David son of Jesse and before the man raised up'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'נְאֻ֧ם … דָּוִ֣ד … בֶּן … יִשַׁ֗י … וּ/נְאֻ֤ם … הַ/גֶּ֨בֶר֙'
  - where: 'note 23:4 “The just ruler and the sunrise”'
    claim: 'Sun imagery for the Lord evokes fertility, righteousness and justice and could be applied to the king, who was to rule as God ruled; 2 Sam. 23:3–4 is the example'
    key: sc-knowhy-653
    url: 'https://scripturecentral.org/knowhy/why-does-malachi-refer-to-the-sun-of-righteousness'
    quote: 'Descriptions of the Lord paired with the sun are found throughout the scriptures, often evoking connections between the idea of the sun and fertility, righteousness, or justice. Such imagery could also be applied to the king of Israel, who was commanded to rule and live as God ruled.'
  - where: 'note 23:5 “A concession or a question”'
    claim: 'Keil: the first and last clauses make sense only as questions, marked by tone alone; the everlasting covenant is the promise of 2 Samuel 7, provided for the falling away of its bearers (7:14–15); “all my desire” is God''s good pleasure'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/23.htm'
    quote: 'The first and last clauses of this verse can only be made to yield a meaning in harmony with the context, by being taken interrogatively: "for is not my house so with God?" The question is only indicated by the tone'
  - where: 'note 23:5 “A concession or a question”'
    claim: 'Keil: the covenant foresaw the falling away of its bearers'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/23.htm'
    quote: 'This relates more especially to the fact that all eventualities were foreseen, even the falling away of the bearers of the covenant of God, so that such an event as this would not annul the covenant (2 Samuel 7:14-15).'
  - where: 'note 23:5 “A concession or a question”'
    claim: 'Cambridge renders verse 5 as questions; the eternal covenant is the promise of 7:12; “ordered in all and secured” compares it to a drawn and attested legal document'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/23.htm'
    quote: '“The eternal covenant” is the promise in ch. 2 Samuel 7:12 ff., to which David refers as the ground of his confidence … The epithets “ordered in all and secured” compare the covenant to a carefully drawn and properly attested legal document.'
  - where: 'note 23:5 “A concession or a question”'
    claim: 'The Hebrew begins kî lōʾ kēn bêtî ʿim ʾēl'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'כִּֽי … לֹא … כֵ֥ן … בֵּיתִ֖/י … עִם … אֵ֑ל'
  - where: 'note 23:5 “A concession or a question”'
    claim: 'A modern translation reads verse 5 as questions'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+23&version=ESV'
    quote: '“For does not my house stand so with God? For he has made with me an everlasting covenant, ordered in all things and secure. For will he not cause to prosper all my help and my desire?'
  - where: 'note 23:5 “A concession or a question”'
    claim: 'Another modern translation reads verse 5 as questions'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+23&version=NRSVUE'
    quote: 'Is not my house like this with God? For he has made with me an everlasting covenant, ordered in all things and secure. Will he not cause to prosper all my help and my desire?'
  - where: 'note 23:8 “The Three and the Thirty”'
    claim: 'Verse 8 is corrupt; Chronicles reads Jashobeam the Hachmonite; “Adino the Eznite” is probably a corruption of “he brandished his spear”; the Septuagint has Adinon; Chronicles has three hundred'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/23.htm'
    quote: 'The text is corrupt, and we must follow 1 Chronicles 11:11 in reading Jashobeam the Hachmonite. … the same was Adino the Eznite] These words are probably a corruption of some words equivalent to those in 1 Chronicles 11:11, which are needed to complete the sense here: he brandished his spear.'
  - where: 'note 23:8 “The Three and the Thirty”'
    claim: 'The words for captain, three and thirty are alike in Hebrew and confused through the section'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/23.htm'
    quote: 'In fact all through this section there is a constant confusion between the words for captain or aide-de-camp, three, and thirty, which are all closely similar in the Heb.'
  - where: 'note 23:8 “The Three and the Thirty”'
    claim: 'Chronicles: Jashobeam lifted his spear against three hundred'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/11?lang=eng'
    quote: 'And this is the number of the mighty men whom David had; Jashobeam, an Hachmonite, the chief of the captains: he lifted up his spear against three hundred slain by him at one time.'
  - where: 'note 23:8 “The Three and the Thirty”'
    claim: 'The total of thirty-seven: three, two and thirty-two, with verse 34 amended'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/23.htm'
    quote: '"Thirty and seven in all." This number is correct, as there were three in the first class (2 Samuel 23:8-12), two in the second (2 Samuel 23:18-23), and thirty-two in the third (vv. 24-39), since 2 Samuel 23:34 contains three names according to the amended text.'
  - where: 'note 23:8 “The Three and the Thirty”'
    claim: 'Joab, as commander-in-chief, is not counted; Chronicles adds sixteen names'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/23.htm'
    quote: 'emending 2 Samuel 23:34 by the help of Chron. so as to contain three names … Joab, as commander-in-chief, is not reckoned in the total. In 1 Chronicles 11:41-47 sixteen additional names are given, possibly either of those who became members of the body when its number was not rigidly limited to thirty, or of those who took the places vacated by death.'
  - where: 'note 23:16 “Water poured out to the LORD”'
    claim: 'The setting: Adullam, the valley of Rephaim, the hold, the garrison in Bethlehem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/23?lang=eng'
    quote: 'And David was then in an hold, and the garrison of the Philistines was then in Beth-lehem.'
  - where: 'note 23:16 “Water poured out to the LORD”'
    claim: 'The verb is the one for pouring out a libation; BDB lists Jacob''s drink offering (Gen. 35:14) and water to the LORD at 2 Sam. 23:16'
    key: bdb
    url: 'https://biblehub.com/hebrew/5258.htm'
    quote: 'pour out libations, with accusative נֶסֶךְ Genesis 35:14 (E), 2 Kings 16:13; Numbers 28:7 (P), מַיִם 2 Samuel 23:16 ליהוה'
  - where: 'note 23:16 “Water poured out to the LORD”'
    claim: 'David''s request jeopardized the three; in contrition he denied himself what they brought'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'It appears that David’s request for water from Bethlehem (see v. 16) had jeopardized the lives of these three in carrying out his request. In contrition for his thoughtlessness, he denied himself the fruit of their labor.'
  - where: 'note 23:8 “The Three and the Thirty”'
    claim: 'Benaiah was over the Cherethites and Pelethites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/20?lang=eng'
    quote: 'Now Joab was over all the host of Israel: and Benaiah the son of Jehoiada was over the Cherethites and over the Pelethites:'
  - where: 'note 23:8 “The Three and the Thirty”'
    claim: 'Benaiah went down with Zadok and Nathan to make Solomon king'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/1?lang=eng'
    quote: 'So Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada, and the Cherethites, and the Pelethites, went down, and caused Solomon to ride upon king David’s mule, and brought him to Gihon.'
  - where: 'note 23:8 “The Three and the Thirty”'
    claim: 'Solomon put Benaiah over the host in Joab''s place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'And the king put Benaiah the son of Jehoiada in his room over the host: and Zadok the priest did the king put in the room of Abiathar.'
  - where: 'note 23:39 “The last name on the roll”'
    claim: 'Eliam is almost certainly Bath-sheba''s father, one of the mighty men; Uriah was one too; the people in the story were closely connected'
    key: shannon-complex-stories
    url: 'https://mi.byu.edu/old-testament-reflections/lessons-from-lifes-complex-stories'
    quote: 'The individuals in this story were all closely connected to one another. Bath-sheba is described in 2 Samuel 11:3 as the daughter of Eliam. This is almost certainly the same Eliam who was a member of David’s elite warband of thirty “mighty men” described in 2 Samuel 23.'
  - where: 'note 23:39 “The last name on the roll”'
    claim: 'Ahithophel was Bath-sheba''s grandfather'
    key: bd-ahithophel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahithophel?lang=eng'
    quote: 'His counsel overthrown by Hushai, he hangs himself (16:15–17:23). Grandfather of Bathsheba (2 Sam. 11:3; 23:34; 1 Chr. 27:33–34).'
  - where: 'note 23:39 “The last name on the roll”'
    claim: 'The list names Eliam son of Ahithophel the Gilonite'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/23?lang=eng'
    quote: 'Eliphelet the son of Ahasbai, the son of the Maachathite, Eliam the son of Ahithophel the Gilonite,'
  - where: christ
    claim: 'The portrait of the ruler is partly realized in Solomon and the better kings of Judah and perfectly only in Christ; Malachi 4:2 re-echoes these words'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/23.htm'
    quote: 'here David himself is taught by inspiration to draw the portrait of a ruler, some features of which were partially realised in Solomon and the better kings of Judah, but which finds it perfect realisation only in Christ.'
  - where: christ
    claim: 'Malachi''s Sun of righteousness re-echoes David''s last words'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/23.htm'
    quote: 'and the closing words of the last prophet, “Unto you shall the Sun of righteousness arise” (Malachi 4:2), combine and re-echo these last words of David.'
  - where: christ
    claim: 'The sun is a fitting symbol for the Lord; D&C 88 calls Christ the light which gives life to all things'
    key: sc-knowhy-653
    url: 'https://scripturecentral.org/knowhy/why-does-malachi-refer-to-the-sun-of-righteousness'
    quote: 'the sun can be seen as an exceptionally fitting symbol for the Lord.'
  - where: explore
    claim: 'The just king in the later prophets (Isa. 11:1–5; Jer. 23:5)'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/23.htm'
    quote: 'for the characteristic of righteousness cp. Psalm 72:1-3 (primarily referring to Solomon); Isaiah 11:1-5 : Zechariah 9:9 : and especially Jeremiah 23:5; Jeremiah 33:15'
  - where: christ
    claim: 'The promise of a kingdom established for ever was ultimately fulfilled through Jesus Christ, the Son of David, the Eternal King'
    key: scripture-helps-1-samuel-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/23-1-samuel-17-18-24-26-2-samuel-5-7?lang=eng'
    quote: 'the promise of a kingdom that would be established forever was ultimately fulfilled through Jesus Christ, a descendant of David. As the Son of God, Jesus Christ will reign forever as our Eternal King.'
