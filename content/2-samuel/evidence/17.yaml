chapter: 17
claims:
  - where: setting
    claim: 'The conspiracy grew; Ahithophel, David''s counsellor, joined Absalom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/15?lang=eng'
    quote: 'And Absalom sent for Ahithophel the Gilonite, David’s counsellor, from his city, even from Giloh, while he offered sacrifices. And the conspiracy was strong; for the people increased continually with Absalom.'
  - where: setting
    claim: 'David prayed against Ahithophel''s counsel and sent Hushai back to defeat it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/15?lang=eng'
    quote: 'And David said, O Lord, I pray thee, turn the counsel of Ahithophel into foolishness. … then mayest thou for me defeat the counsel of Ahithophel.'
  - where: setting
    claim: 'The priests'' sons Ahimaaz and Jonathan were to carry word to David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/15?lang=eng'
    quote: 'Behold, they have there with them their two sons, Ahimaaz Zadok’s son, and Jonathan Abiathar’s son; and by them ye shall send unto me every thing that ye can hear.'
  - where: setting
    claim: 'Ahithophel''s counsel was held as an oracle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/16?lang=eng'
    quote: 'And the counsel of Ahithophel, which he counselled in those days, was as if a man had inquired at the oracle of God'
  - where: setting
    claim: 'Mahanaim was where Abner made Ish-bosheth king'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/2?lang=eng'
    quote: 'But Abner the son of Ner, captain of Saul’s host, took Ish-bosheth the son of Saul, and brought him over to Mahanaim;'
  - where: setting
    claim: 'The title of Psalm 3 sets it in David''s flight from Absalom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/3?lang=eng'
    quote: 'A Psalm of David, when he fled from Absalom his son.'
  - where: thread
    claim: 'The footnote to “counsel” in 17:14 points to David''s prayer in 15:31'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/17?lang=eng'
    quote: '14b “counsel”: 2 Sam. 15:31.'
  - where: thread
    claim: 'Hushai''s scheme appealed to Absalom''s vanity and won time'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/17.htm'
    quote: 'Hushai saw that it was essential to gain time … His scheme was cleverly devised to appeal to Absalom’s vanity and love of display.'
  - where: thread
    claim: 'Matthew''s account of Judas''s hanging shares words with this account of Ahithophel''s'
    key: hatch-his-friend-judas
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/appendix-c-his-friend-judas-why-didnt-he-betray-his-messiah'
    quote: 'In fact, these are the only two suicide hangings in all the Hebrew Bible and New Testament. … the only unity in the Bible and Greek texts to include both the words aperchomai (“went away”) and apanchomai (“hang oneself”).'
  - where: section 6 plain
    claim: '“Kine” means cattle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/17?lang=eng'
    quote: '29b “kine”: OR cattle.'
  - where: note 17:2 “Strike the king only”
    claim: 'Had Ahithophel''s counsel been followed it would have been a disaster for David; Hushai saved him by a delay and a warning'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'Twelve thousand men against the small band who had fled with David would have been a disaster for David. Hushai saved the situation for David, first, by convincing Absalom that a delay … and, second, by warning David to flee'
  - where: note 17:2 “Strike the king only”
    claim: 'The Septuagint of 17:3 reads “as a bride returns to her husband”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_samuel/17.htm'
    quote: '3And I will bring back all the people to thee, as a bride returns to her husband: only thou seekest the life of one man, and all the people shall have peace.'
  - where: note 17:2 “Strike the king only”
    claim: 'A modern translation reads the bride image in 17:3'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+17&version=ESV'
    quote: 'and I will bring all the people back to you as a bride comes home to her husband. You seek the life of only one man, and all the people will be at peace.'
  - where: note 17:2 “Strike the king only”
    claim: 'A second modern translation reads the same'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+17&version=NRSVUE'
    quote: 'and I will bring all the people back to you as a bride comes home to her husband. You seek the life of only one man, and all the people will be at peace.'
  - where: note 17:2 “Strike the king only”
    claim: 'The narrator calls Ahithophel''s counsel good'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/17?lang=eng'
    quote: 'For the Lord had appointed to defeat the good counsel of Ahithophel, to the intent that the Lord might bring evil upon Absalom.'
  - where: note 17:14 “Why Hushai's counsel won”
    claim: 'Footnote: the counsel of 17:14 points to 15:31'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/17?lang=eng'
    quote: '“counsel”: 2 Sam. 15:31.'
  - where: note 17:14 “Why Hushai's counsel won”
    claim: 'David''s prayer and his charge to Hushai to defeat Ahithophel''s counsel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/15?lang=eng'
    quote: 'And David said, O Lord, I pray thee, turn the counsel of Ahithophel into foolishness. … then mayest thou for me defeat the counsel of Ahithophel.'
  - where: note 17:14 “Why Hushai's counsel won”
    claim: 'The dew pictures an army settling unseen and unheard'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/17.htm'
    quote: 'As the innumerable drops of dew settle on the ground unseen and unheard, so will our vast army completely overwhelm him without perceptible effort.'
  - where: note 17:14 “Why Hushai's counsel won”
    claim: 'Dragging the city into the river is an extravagant hyperbole for an irresistible force'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/17.htm'
    quote: 'Hushai intentionally indulges in an extravagant hyperbole in order to describe the irresistible power of the force that would be gathered'
  - where: note 17:14 “Why Hushai's counsel won”
    claim: 'Hushai needed to gain time; his scheme appealed to Absalom''s vanity'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/17.htm'
    quote: 'Hushai saw that it was essential to gain time … His scheme was cleverly devised to appeal to Absalom’s vanity and love of display.'
  - where: note 17:14 “Why Hushai's counsel won”
    claim: 'Ahithophel went home to die, foreseeing Absalom''s loss; David''s prayer was fulfilled'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/17.htm'
    quote: 'and there set his house in order and hanged himself, because he could foresee that Absalom would lose his cause through not taking his advice, and it would then be all over with himself. Thus was David''s prayer (2 Samuel 15:31) fulfilled.'
  - where: note 17:17 “A servant girl and a woman at Bahurim”
    claim: 'šip̄ḥâ means maid, maid-servant, especially of menial service; listed for 2 Sam. 17:17; used in Ruth 2:13'
    key: bdb
    url: 'https://biblehub.com/hebrew/8198.htm'
    quote: 'שִׁפְחָה noun feminine maid, maid-servant … in General, especially of menial service (never אָמָה) Exodus 11:5 (J) 1 Samuel 25:41 (opposed to אָמָה) 2 Samuel 17:17'
  - where: note 17:17 “A servant girl and a woman at Bahurim”
    claim: 'Ruth uses šip̄ḥâ of herself in humility (Ruth 2:13)'
    key: bdb
    url: 'https://biblehub.com/hebrew/8198.htm'
    quote: 'figurative in address, שִׁפְחָֽתְךָ, etc., of speaker, in token of humility (see אָמָה) Ruth 2:13'
  - where: note 17:17 “A servant girl and a woman at Bahurim”
    claim: 'Hushai was to tell the priests, whose sons would carry the word'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/15?lang=eng'
    quote: 'Behold, they have there with them their two sons, Ahimaaz Zadok’s son, and Jonathan Abiathar’s son; and by them ye shall send unto me every thing that ye can hear.'
  - where: note 17:23 “Ahithophel and Judas”
    claim: 'Ahithophel knew his hope lay in Absalom''s success; delay meant David''s return and a traitor''s fate'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'Ahithophel knew his only hope lay in Absalom’s success. Since he was a traitor to King David, if David won, his fate was sealed. Understanding perfectly that a delay meant the ultimate defeat of Absalom and David’s return to the throne'
  - where: note 17:23 “Ahithophel and Judas”
    claim: 'His hanging was a private suicide, not an execution'
    key: belnap-fell-tree
    url: 'https://rsc.byu.edu/they-shall-grow-together/they-did-fell-tree'
    quote: 'First, the hanging is not an execution, or a state-sponsored display, as the other biblical hangings appear to be. Instead, the text suggests that Ahithophel’s hanging is a private suicide.'
  - where: note 17:23 “Ahithophel and Judas”
    claim: 'In the hanging narratives, hanging follows an attempt against the ruler'
    key: belnap-fell-tree
    url: 'https://rsc.byu.edu/they-shall-grow-together/they-did-fell-tree'
    quote: 'the Ahithophel narrative treats hanging as an act that comes after one has sought to overthrow or in some way engage against the ruling political entity.'
  - where: note 17:23 “Ahithophel and Judas”
    claim: 'Ahithophel was the grandfather of Bathsheba'
    key: bd-ahithophel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahithophel?lang=eng'
    quote: 'His counsel overthrown by Hushai, he hangs himself (16:15–17:23). Grandfather of Bathsheba (2 Sam. 11:3; 23:34; 1 Chr. 27:33–34).'
  - where: note 17:23 “Ahithophel and Judas”
    claim: 'Ahithophel and Judas are the only two suicide hangings in the Bible; Matthew and this account alone share aperchomai and apanchomai'
    key: hatch-his-friend-judas
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/appendix-c-his-friend-judas-why-didnt-he-betray-his-messiah'
    quote: 'In fact, these are the only two suicide hangings in all the Hebrew Bible and New Testament. … the only unity in the Bible and Greek texts to include both the words aperchomai (“went away”) and apanchomai (“hang oneself”).'
  - where: note 17:23 “Ahithophel and Judas”
    claim: 'John quotes Psalm 41 of Judas; the Gospels were written so that Jesus and Judas mirror David and Ahithophel'
    key: hatch-his-friend-judas
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/appendix-c-his-friend-judas-why-didnt-he-betray-his-messiah'
    quote: 'The author of John quotes Psalm 41 (see John 13:18) … These details present a strong case that the Gospels of Matthew and John wrote the Judas portion of the story with the Hebrew Bible open so that Jesus and Judas would mirror King David and Ahithophel.'
  - where: note 17:23 “Ahithophel and Judas”
    claim: 'On Hatch''s reading Psalm 41 puts words in David''s mouth about Ahithophel'
    key: hatch-his-friend-judas
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/appendix-c-his-friend-judas-why-didnt-he-betray-his-messiah'
    quote: 'The author of John quotes Psalm 41 (see John 13:18), putting words into David’s mouth regarding Ahithophel'
  - where: note 17:23 “Ahithophel and Judas”
    claim: 'Ahithophel''s city was Giloh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/15?lang=eng'
    quote: 'And Absalom sent for Ahithophel the Gilonite, David’s counsellor, from his city, even from Giloh'
  - where: note 17:25 “Amasa, cousin to Joab”
    claim: 'Zeruiah and Abigail were sisters of Jesse''s sons; Chronicles names Amasa''s father Jether the Ishmeelite'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/2?lang=eng'
    quote: 'Whose sisters were Zeruiah, and Abigail. And the sons of Zeruiah; Abishai, and Joab, and Asahel, three. … And Abigail bare Amasa: and the father of Amasa was Jether the Ishmeelite.'
  - where: note 17:25 “Amasa, cousin to Joab”
    claim: 'Amasa was made captain by Absalom, offered the command by David, and slain by Joab'
    key: bd-amasa
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amasa?lang=eng'
    quote: 'Made captain of the host by Absalom (2 Sam. 17:25); offer made to Amasa by David (19:13); was slain by Joab (20:4–5, 8–12; 1 Kgs. 2:5, 32; 1 Chr. 2:17).'
  - where: note 17:27 “Friends beyond the Jordan”
    claim: 'The provision is told as the first sign the people had not all fallen away; Shobi possibly a son of King Nahash and brother of Hanun, shown favour when Rabbah was taken, or an Israelite living there'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/17.htm'
    quote: 'This is mentioned as the first sign that the people had not all fallen away from David … was possibly a son of Nahash the deceased king of the Ammonites, and brother of Hanun … At the same time, it is also quite possible that Shobi may have been an Israelite'
  - where: note 17:27 “Friends beyond the Jordan”
    claim: 'David took Rabbah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'And David gathered all the people together, and went to Rabbah, and fought against it, and took it.'
  - where: note 17:27 “Friends beyond the Jordan”
    claim: 'Mephibosheth lived in Machir''s house at Lo-debar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/9?lang=eng'
    quote: 'Behold, he is in the house of Machir, the son of Ammiel, in Lo-debar.'
  - where: note 17:27 “Friends beyond the Jordan”
    claim: 'David charged Solomon to show kindness to Barzillai''s sons for coming to him in his flight'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'But shew kindness unto the sons of Barzillai the Gileadite, and let them be of those that eat at thy table: for so they came to me when I fled because of Absalom thy brother.'
  - where: christ
    claim: 'The Gospels tell Judas''s end so that Jesus and Judas mirror David and Ahithophel'
    key: hatch-his-friend-judas
    url: 'https://rsc.byu.edu/greater-love-hath-no-man/appendix-c-his-friend-judas-why-didnt-he-betray-his-messiah'
    quote: 'he also makes David a type for Jesus. He infuses elements from the King David narrative into the Judas story. Specifically, Judas’s actions mirror those of David’s counselor, Ahithophel.'
  - where: christ
    claim: 'The purposes of God cannot be frustrated; it is the work of men that is frustrated'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/3?lang=eng'
    quote: 'The works, and the designs, and the purposes of God cannot be frustrated, neither can they come to naught. … Remember, remember that it is not the work of God that is frustrated, but the work of men;'
