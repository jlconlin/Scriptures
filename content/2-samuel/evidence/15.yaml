    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/esth/6?lang=eng'
    quote: 'But Haman hasted to his house mourning, and having his head covered.'
  - where: 'note 15:30 “Barefoot, with his head covered”'
    claim: 'Ezekiel told not to mourn: put on thy shoes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/24?lang=eng'
    quote: 'Forbear to cry, make no mourning for the dead, bind the tire of thine head upon thee, and put on thy shoes upon thy feet'
