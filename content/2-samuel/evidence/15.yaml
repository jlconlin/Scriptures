chapter: 15
claims:
  - where: setting
    claim: 'Absalom was the third son, born in Hebron, of Maacah daughter of Talmai king of Geshur'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/3?lang=eng'
    quote: 'And unto David were sons born in Hebron … and the third, Absalom the son of Maacah the daughter of Talmai king of Geshur;'
  - where: setting
    claim: 'Absalom fled to Geshur three years; two years in Jerusalem without seeing the king; the king kissed him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/14?lang=eng'
    quote: 'So Absalom dwelt two full years in Jerusalem, and saw not the king’s face. … and the king kissed Absalom.'
  - where: setting
    claim: 'Nathan: evil raised up out of David''s own house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'Behold, I will raise up evil against thee out of thine own house'
  - where: setting
    claim: 'The aging David returns for a time to the life of exile he knew under Saul'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'As Absalom usurps the throne, the aging David temporarily returns to the exhausting life of exile he experienced during the reign of Saul (chap. 15).'
  - where: setting
    claim: 'Psalm 3 is titled for the flight from Absalom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/3?lang=eng'
    quote: 'A Psalm of David, when he fled from Absalom his son.'
  - where: 'note 15:6 “How Absalom stole hearts”'
    claim: 'Absalom acted like a king with a royal procession, sat in judgment at the gate (the normal place of judgment), raised and kissed those who bowed, unusual for royalty; a deceitful campaign'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'He began to act like a king, with a full royal procession … he undertook a deceitful campaign to gain favor with the people. … A city gate was the normal location for giving judgment in ancient times … highly unusual behavior from royalty'
  - where: 'note 15:6 “How Absalom stole hearts”'
    claim: 'The charge may have been a lie, but more likely the court was not functioning'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'While this assertion may have been a lie, it is more likely that David’s court was not functioning properly and that the people were being neglected.'
  - where: 'note 15:6 “How Absalom stole hearts”'
    claim: 'The quoted list of reasons for the defection (Clarke, as quoted in the manual)'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: '1. David was old or afflicted … 3. Joab’s power was overgrown … 4. There were still some partisans of the house of Saul … 5. David was under the displeasure of the Almighty, for his adultery with Bath-sheba, and his murder of Uriah'
  - where: 'note 15:6 “How Absalom stole hearts”'
    claim: 'The verb of 15:6 is gānab in the Piel, steal away'
    key: bdb
    url: 'https://biblehub.com/hebrew/1589.htm'
    quote: 'Pi`el steal away (transitive)'

  - where: 'note 15:7 “Forty years, or four?”'
    claim: 'The Hebrew of 15:7 reads forty years'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'אַרְבָּעִ֣ים'
  - where: 'note 15:7 “Forty years, or four?”'
    claim: 'The Septuagint also reads forty years'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_samuel/15.htm'
    quote: '7And it came to pass after forty years, that Abessalom said to his father, I will go now, and pay my vows'
  - where: 'note 15:7 “Forty years, or four?”'
    claim: 'Forty unsuitable (born at Hebron, David reigned forty years); Syriac and Vulgate read four, reckoned from the reconciliation'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/15.htm'
    quote: 'The number forty is altogether unsuitable … for Absalom was born at Hebron after David had begun to reign, and David only reigned forty years and a half in all … the reading adopted by the Syriac, Arabic, and Vulgate … "four years," must certainly be the correct one'
  - where: 'note 15:7 “Forty years, or four?”'
    claim: 'To serve the LORD means to offer a sacrifice'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/15.htm'
    quote: '"to do a service to Jehovah," can only mean to offer a sacrifice'
  - where: 'note 15:7 “Forty years, or four?”'
    claim: 'No obvious starting point for forty; four years spent preparing; Hebron his birthplace made the wish natural'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/15.htm'
    quote: 'There is no obvious date from which forty years could be reckoned … They were spent in preparing for the conspiracy … The fact that Hebron was his birth-place would make the wish to pay his vow there instead of at Jerusalem seem sufficiently natural.'
  - where: 'note 15:7 “Forty years, or four?”'
    claim: 'The sacrifice gave time for his adherents to gather'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/15.htm'
    quote: 'In order to give time for his adherents to gather, Absalom celebrated the sacrifice, which was the ostensible object of his journey.'
  - where: 'note 15:7 “Forty years, or four?”'
    claim: 'Modern translation: at the end of four years (ESV)'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+15&version=ESV'
    quote: '7 And at the end of four years Absalom said to the king'
  - where: 'note 15:7 “Forty years, or four?”'
    claim: 'Modern translation: at the end of four years (NRSVue)'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+15&version=NRSVUE'
    quote: '7 At the end of four years Absalom said to the king'
  - where: 'note 15:7 “Forty years, or four?”'
    claim: 'David reigned forty years; anointed king at Hebron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/5?lang=eng'
    quote: 'David was thirty years old when he began to reign, and he reigned forty years.'

  - where: 'note 15:21 “Ittai the Gittite”'
    claim: 'Gath was one of the five Philistine cities, birthplace of Goliath'
    key: bd-gath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gath?lang=eng'
    quote: 'One of the five cities of the Philistines (Josh. 11:22) … It was the birthplace of Goliath (1 Sam. 17)'
  - where: 'note 15:21 “Ittai the Gittite”'
    claim: 'Ittai commands a third of the army with Joab and Abishai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/18?lang=eng'
    quote: 'and a third part under the hand of Ittai the Gittite'

  - where: 'note 15:26 “Why the king left the city, and the ark”'
    claim: 'The flight seems out of character; not fear; the city was strong; David had the Cherethites, Pelethites and Gittites; he took all as from God'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'David’s immediate call for flight from the city was so out of character … but his actions suggest that it was not fear that motivated the flight.'
  - where: 'note 15:26 “Why the king left the city, and the ark”'
    claim: 'Clarke, as quoted: the city strong; he takes all as from God; the habit of mourners'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'Jerusalem, far from not being in a state to sustain a siege, was so strong … And he had still with him his faithful Cherethites and Pelethites; besides six hundred faithful Gittites … But he appears to take all as coming from the hand of God; therefore he humbles himself, weeps, goes barefoot, and covers his head!'
  - where: 'note 15:26 “Why the king left the city, and the ark”'
    claim: 'David blown about by others'' agency, returns to the exile he knew under Saul'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'The erstwhile powerful David now seems to be blown about at the mercy of the winds of others’ agency. As Absalom usurps the throne, the aging David temporarily returns to the exhausting life of exile he experienced during the reign of Saul'
  - where: 'note 15:26 “Why the king left the city, and the ark”'
    claim: 'The text of verses 14, 25–26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/15?lang=eng'
    quote: 'if I shall find favour in the eyes of the LORD, he will bring me again, and shew me both it, and his habitation: But if he thus say, I have no delight in thee; behold, here am I'

  - where: 'note 15:27 “Art not thou a seer?”'
    claim: 'The Hebrew word is the participle of "see" with prefixed he'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'רוֹאֶ֣ה'
  - where: 'note 15:27 “Art not thou a seer?”'
    claim: 'As pointed, an interrogative; Keil repoints as vocative, of Zadok the high priest receiving revelation by the Urim, equal to a prophet'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/15.htm'
    quote: 'אתּה הרואה, with ה interrog., does not yield any appropriate sense … the word must be pointed thus, הראה (with the article), and rendered as a vocative … as the high priest who received divine revelations by means of the Urim. The meaning is, Thou Zadok art equal to a prophet; therefore thy proper place is in Jerusalem'
  - where: 'note 15:27 “Art not thou a seer?”'
    claim: 'Obscure; no trace of high priest called seer elsewhere; the Septuagint reading, with a small change, probably best'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/15.htm'
    quote: 'An obscure expression variously explained. … but there is no trace of such a use of the term elsewhere. … (4) The Sept. reads, See! thou shalt return, which requires but a small change in the Heb. text, and is probably the best solution of the difficulty.'
  - where: 'note 15:27 “Art not thou a seer?”'
    claim: 'The Septuagint (Brenton): Behold, thou shalt return'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_samuel/15.htm'
    quote: '27And the king said to Sadoc the priest, Behold, thou shalt return to the city in peace'
  - where: 'note 15:27 “Art not thou a seer?”'
    claim: 'A modern translation keeps "Are you not a seer?"'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+15&version=ESV'
    quote: '27 The king also said to Zadok the priest, “Are you not a (AE)seer? Go back'
  - where: 'note 15:27 “Art not thou a seer?”'
    claim: 'A modern translation reads "Look, go back to the city in peace"'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+15&version=NRSVUE'
    quote: '27 The king also said to the priest Zadok, “Look, go back to the city in peace'
  - where: 'note 15:27 “Art not thou a seer?”'
    claim: 'The verse is counted among biblical witnesses to seers in Israel'
    key: sc-knowhy-86
    url: 'https://scripturecentral.org/knowhy/why-is-a-seer-greater-than-a-prophet'
    quote: 'Indeed, seers are mentioned in the biblical record as having had a presence in Israel’s society (1 Samuel 9:9, 11, 19; 2 Samuel 15:27; 24:11'

