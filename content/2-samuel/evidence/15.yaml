    key: bdb
    url: 'https://biblehub.com/hebrew/7463.htm'
    quote: 'רֵעֶה noun masculine friend … construct in technical term רֵעֶה הַמֶּלֶךְ … 1 Kings 4:5 ( = רֵעַ 1 Chronicles 27:33), compare רֵעֶה דָּוִד 2 Samuel 15:37; 2 Samuel 16:16'
