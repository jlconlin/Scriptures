  - where: christ
    claim: 'John''s single mention of the Kidron perhaps recalls David''s flight; Judas the counterpart of Ahithophel (one older reading)'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/15.htm'
    quote: 'The single mention of it in the N. T. is perhaps designed to recall the present occasion and to suggest the parallel between David fleeing from Jerusalem, and Christ leaving the city which had rejected Him, as the treachery of Judas was the counterpart and “fulfilment” of that of Ahithophel'
  - where: christ
    claim: 'David wounded by his own folly; needs the Lord''s ḥesed more than ever'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'He craves the loving-kindness, mercy, and forgiveness of God, for now he needs the Lord’s ḥesed more than ever.'
  - where: christ
    claim: 'David wounded by his own folly'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'David’s later years show a man wounded by his own folly and by the hardships of life'

