chapter: 5
claims:
  - where: setting
    claim: 'Ish-bosheth was betrayed and killed by his captains, and David rose in power'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'Abner, the captain of Saul’s army, makes Saul’s son Ish-boshet (Ishbosheth) the king of Israel (the land north of Jerusalem). Ish-boshet is betrayed and killed by his captains, and David rises in power.'
  - where: setting
    claim: 'Abner had prepared the elders of Israel to accept David; the elders acted as tribal leaders without a king'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'According to 2 Samuel 3:17–19, Abner, the captain of Saul’s army, had prepared the elders of Israel to accept David as their king. Without a king, these elders functioned as tribal leaders, seeking out the best interests of their people.'
  - where: setting
    claim: 'The Bible Dictionary’s chronology: David king in Hebron 1055, king in Jerusalem 1047'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '1055 | David king in Hebron.'
  - where: setting
    claim: 'The Bible Dictionary’s chronology: David king in Jerusalem 1047'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '1047 | David king in Jerusalem.'
  - where: setting
    claim: '2 Samuel describes David’s reign first over Judah and then over all Israel'
    key: scripture-helps-1-samuel-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/23-1-samuel-17-18-24-26-2-samuel-5-7?lang=eng'
    quote: 'The book of 2 Samuel describes David’s anointing and reign, first over the kingdom of Judah and then over all of Israel.'
  - where: setting
    claim: 'Chronicles tells the same events (1 Chr. 11:1–9; 14:8–17)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/11?lang=eng'
    quote: 'Then all Israel gathered themselves to David unto Hebron, saying, Behold, we are thy bone and thy flesh.'
  - where: thread
    claim: 'David prayed, recognized the Lord’s voice, and attributed the victory to the Lord'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'Despite his preparation, David did not forget the Lord. Not only did David resort to prayer but he knew how to recognize the Lord’s voice. … David made war against and killed the Philistines and attributes the victory to the Lord.'

  - where: 'note 5:1 “Why all the tribes came to Hebron”'
    claim: 'David was chosen for his family ties, his divine calling and his military leadership (Deut. 17:15; 1 Sam. 18:30); Abner had prepared the elders'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'David was chosen because of his familial ties and divine calling and because he was a military leader (see Deuteronomy 17:15; 1 Samuel 18:30).'
  - where: 'note 5:1 “Why all the tribes came to Hebron”'
    claim: 'Abner told the elders they had sought David before and that the LORD would save Israel by David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/3?lang=eng'
    quote: 'Ye sought for David in times past to be king over you: Now then do it: for the LORD hath spoken of David, saying, By the hand of my servant David I will save my people Israel'

  - where: 'note 5:2 “Shepherd and captain”'
    claim: 'The LORD’s words in 5:2 are recorded nowhere else; they reflect the principle of leaders as shepherds'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'Although the quote by the Lord in 2 Samuel 5:2 is not recorded in any other passage of scripture, it does reflect a principle of leadership: that of leaders as shepherds.'
  - where: 'note 5:2 “Shepherd and captain”'
    claim: 'Each of the three stories introducing David makes him a shepherd; 5:2 shows the link of shepherd and king in Israel’s imagination'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'Each of the three stories that introduce David emphasize his role as a shepherd (1 Samuel 16:11, 19; 17:15). … “The Lord said to you: It is you who shall be shepherd of my people Israel” (2 Samuel 5:2 NRSV), showing the connection between a shepherd and a king in Israel’s imagination.'

  - where: 'note 5:3 “A covenant, then the anointing”'
    claim: '“League” is berit, covenant'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'בְּרִ֛ית'
  - where: 'note 5:3 “A covenant, then the anointing”'
    claim: 'berit: pact, compact, covenant'
    key: bdb
    url: 'https://biblehub.com/hebrew/1285.htm'
    quote: 'בְּרִית285 noun feminine covenant … — pact, compact, covenant.'
  - where: 'note 5:3 “A covenant, then the anointing”'
    claim: 'Chronicles: David made a covenant with them; anointed according to the word of the LORD by Samuel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/11?lang=eng'
    quote: 'David made a covenant with them in Hebron before the Lord; and they anointed David king over Israel, according to the word of the Lord by Samuel.'
  - where: 'note 5:3 “A covenant, then the anointing”'
    claim: 'Three offices were anointed: prophet, priest, king; David anointed before by Samuel, now by the elders'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'In the Old Testament, three roles were accompanied by anointings: those of prophet, priest, and king. Before, David had been anointed by the prophet Samuel (see 1 Samuel 16:12–13), and now he is anointed by the elders of Israel.'

  - where: 'note 5:6 “The city no tribe had taken”'
    claim: 'Neither Judah nor Benjamin drove the Jebusites out of Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/5?lang=eng'
    quote: '6a “Jebusites”: Josh. 15:63; Judg. 1:21.'
  - where: 'note 5:6 “The city no tribe had taken”'
    claim: 'Jebus was a hill fortress that kept its independence until David stormed it'
    key: bd-jebus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jebus?lang=eng'
    quote: 'Ancient name of Jerusalem (Judg. 19:10; 1 Chr. 11:4–5); it was a hill fortress, which maintained its independence until stormed by David (2 Sam. 5:6–9).'
  - where: 'note 5:6 “The city no tribe had taken”'
    claim: 'On the frontier of Judah and Benjamin; about 2600 feet high; deep valleys on all sides but the north'
    key: bd-jerusalem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jerusalem?lang=eng'
    quote: 'It lay on the frontier line between Judah and Benjamin and was chosen by David to be his capital. Until then it had been merely a mountain fortress, about 2600 feet above sea level, surrounded by deep valleys on all sides except the north.'
  - where: 'note 5:6 “The city no tribe had taken”'
    claim: 'The end of verse 6 was an insult: the Jebusites could defend the city with the lame'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'The end of verse 6 is meant to be an insult. The Jebusites were claiming that they could protect their city from David with their injured or lame. In contrast, David’s defeat of the Jebusites was rather swift.'
  - where: 'note 5:6 “The city no tribe had taken”'
    claim: 'Jerusalem was under neither Judah nor Israel; a capital there was a neutral choice'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'Before its conquest, it was neither under Judahite nor Israelite rule. By establishing Jerusalem as a capital, David was wisely staying neutral between the southern and northern territories.'
  - where: 'note 5:6 “The city no tribe had taken”'
    claim: 'David likely chose Jerusalem for its neutral location, natural resources and defensible height'
    key: scripture-helps-1-samuel-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/23-1-samuel-17-18-24-26-2-samuel-5-7?lang=eng'
    quote: 'David likely chose Jerusalem to be the capital of his kingdom for several reasons—including its neutral location, access to natural resources, and elevated position surrounded by deep valleys, making it easier to defend against enemies.'
  - where: 'note 5:6 “The city no tribe had taken”'
    claim: 'One reading ties the end of 5:8 to the Jebusites’ boast in 5:6'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'In this interpretation, 2 Samuel 5:8 aligns with the statement by the Jebusites just two verses earlier that David “shall not enter here” and that the blind and the lame could repel him (2 Samuel 5:6).'

  - where: 'note 5:7 “Zion, the city of David”'
    claim: 'Zion was the stronghold believed to have been at the top of the hill; David named the city after himself'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'Zion was the name of the stronghold or fortress believed to have been at the top of the hill. In the future, the location for the Zion fortress would become the temple grounds (see Isaiah 8:18; Psalm 74:2). David named the city, or a portion of it, after himself'
  - where: 'note 5:7 “Zion, the city of David”'
    claim: 'Zion’s uses: the pure in heart; Enoch’s city; Solomon’s temple on Mount Zion; Jackson County; New Jerusalem'
    key: bd-zion
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zion?lang=eng'
    quote: 'defined in latter-day revelation as “the pure in heart” (D&C 97:21). Other usages of Zion have to do with a geographical location. For example, Enoch built a city that was called Zion (Moses 7:18–19); Solomon built his temple on Mount Zion (1 Kgs. 8:1; see also 2 Sam. 5:6–7)'
  - where: 'note 5:7 “Zion, the city of David”'
    claim: 'The position of Zion has been much disputed; the temple’s place on the eastern hill is agreed'
    key: bd-jerusalem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jerusalem?lang=eng'
    quote: 'All authorities agree in placing the temple on the eastern hill, but there has been much dispute as to the position of Zion.'
  - where: 'note 5:7 “Zion, the city of David”'
    claim: 'Jerusalem is likely Melchizedek’s Salem; tradition puts the temple on the hill of Isaac’s offering'
    key: scripture-helps-1-samuel-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/23-1-samuel-17-18-24-26-2-samuel-5-7?lang=eng'
    quote: 'It is likely the same location as the ancient city Salem, where Melchizedek ruled as a righteous king. Biblical tradition also identifies the location of Solomon’s temple in Jerusalem as being the same hill where Abraham was commanded to sacrifice Isaac.'

  - where: 'note 5:8 “The gutter, and the lame and the blind”'
    claim: 'tsinnor: pipe, spout, conduit; at 2 Sam. 5:8 very dubious'
    key: bdb
    url: 'https://biblehub.com/hebrew/6794.htm'
    quote: 'צִנּוֺר noun masculine pipe, spout, conduit (so Late Hebrew); — absolute וְיִגַּע בַּצִּנּוֺר 2 Samuel 5:8 (i.e., si vera lectio, of Jerusalem, but very dubious'
  - where: 'note 5:8 “The gutter, and the lame and the blind”'
    claim: 'The water shaft of David’s time has not been discovered'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'The “gutter,” or water shaft, that dates to the time of David has not been discovered.'
  - where: 'note 5:8 “The gutter, and the lame and the blind”'
    claim: 'The Hebrew sentence is incomplete; the KJV supplies “he shall be chief and captain” in italics from 1 Chr. 11:6'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'The King James Version inserts a whole clause to resolve the incomplete grammar: “he shall be chief and captain” (the italics indicate that the words are supplied by the King James translators; the clause is added based on the parallel verse in 1 Chronicles 11:6'
  - where: 'note 5:8 “The gutter, and the lame and the blind”'
    claim: 'Chronicles: whoever smites the Jebusites first shall be chief; Joab went up first'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/11?lang=eng'
    quote: 'Whosoever smiteth the Jebusites first shall be chief and captain. So Joab the son of Zeruiah went first up, and was chief.'
  - where: 'note 5:8 “The gutter, and the lame and the blind”'
    claim: 'The consonants can be read two ways; the vowels make “those hated by David’s soul”; 4QSam-a reads “David’s soul hates”'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'The received consonantal text can be translated as either “they hate David’s soul” or “David hates him with (his) whole being.” This was changed in the vocalized Masoretic text to “those hated by David’s soul.” Another reading is found in the Dead Sea Scrolls manuscript 4QSama: “David’s soul hates.”'
  - where: 'note 5:8 “The gutter, and the lame and the blind”'
    claim: 'The Hebrew has a written form and a read form of the word “hated”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'שנאו … שְׂנֻאֵ֖י'
  - where: 'note 5:8 “The gutter, and the lame and the blind”'
    claim: 'Readings that make David hate the disabled or Jebusites conflict with his care for Mephibosheth and dealings with Araunah'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'No other passages portray David as bearing any particular hatred toward either people with disabilities or Jebusites. On the contrary, he provides generously for his friend’s lame son Mephibosheth (2 Samuel 9:3–7), and David engages in a friendly transaction with Araunah the Jebusite (2 Samuel 24:20–25).'
  - where: 'note 5:8 “The gutter, and the lame and the blind”'
    claim: 'Calabro’s rendering of the whole verse, from 4QSam-a, which he believes closest to the original'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'David’s soul hates anyone who slays a Jebusite that he might reach the water shaft, or (who slays) the lame or the blind. Therefore the blind and the lame kept saying, “He shall not enter the house.” This translation is in accordance with the earliest attested reading, namely that of 4QSama, which I believe to be closest to the original.'
  - where: 'note 5:8 “The gutter, and the lame and the blind”'
    claim: 'Most translations, and the Septuagint (“the house of the Lord”), read the last line as excluding the lame and blind from the house'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'Most translations are similar, including the ancient Greek version known as the Septuagint, which even specifies that it is “the house of the Lord” (oikon kyriou) that those who are lame or blind are not to enter.'
  - where: 'note 5:8 “The gutter, and the lame and the blind”'
    claim: 'The temple was not yet built when David took Jerusalem; “the house” may be the palace'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'That “the house” here refers to the temple is not certain. When David conquered Jerusalem, the temple on Mount Moriah had not yet been constructed. The NIV renders this word as “the palace,”'
  - where: 'note 5:8 “The gutter, and the lame and the blind”'
    claim: 'Read so, 5:8 and 9:3–7 present David as a model of compassion'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'With this interpretation, we can see that the two passages, 2 Samuel 5:8 and 2 Samuel 9:3–7, present the cultural hero David as a role model of the compassionate ideal.'

  - where: 'note 5:12 “A kingdom for the people’s sake”'
    claim: 'Hiram’s builders may imply an alliance that bore fruit under Solomon; one reading: David perceived the Lord’s support after Tyre acknowledged him, not a lack of faith but a human wish for tangible evidence'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'Sending his builders and materials may imply that Hiram was creating an alliance between the kingdoms. The same alliance will show its fruits in Solomon’s story (see 1 Kings 5). … It is very human to desire tangible evidence of a promised blessing. … This knowledge of the Lord’s support will diminish in David’s future.'
  - where: 'note 5:12 “A kingdom for the people’s sake”'
    claim: 'Tyre was a coastal merchant city'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'Tyre is located in the north, on the coast of the Mediterranean. The people of Tyre were merchants by trade, having access to the sea.'

  - where: 'note 5:14 “Nathan and Solomon”'
    claim: 'Nathan son of David and Bathsheba (2 Sam. 5:14; 1 Chr. 3:5; Luke 3:31), distinct from Nathan the prophet'
    key: bd-nathan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nathan?lang=eng'
    quote: 'He has given. (1) Son of David and Bathsheba (2 Sam. 5:14; 1 Chr. 3:5; 14:4; Zech. 12:12; Luke 3:31). … (2) The prophet, forbids David to build a temple (2 Sam. 7; 1 Chr. 17:1–15)'
  - where: 'note 5:14 “Nathan and Solomon”'
    claim: 'Chronicles names Nathan and Solomon among four sons of Bath-shua born in Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/3?lang=eng'
    quote: 'And these were born unto him in Jerusalem; Shimea, and Shobab, and Nathan, and Solomon, four, of Bath-shua the daughter of Ammiel:'
  - where: 'note 5:14 “Nathan and Solomon”'
    claim: 'Luke shows Mary’s line through Nathan; Matthew shows Joseph’s through Solomon (Correa’s reading)'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'The genealogy in the Gospel of Luke shows Mary’s line through Nathan (Luke 3:31), whereas the genealogy in the Gospel of Matthew shows how Joseph descended from Solomon (Matthew 1:6).'
  - where: 'note 5:20 “The LORD broke through like water”'
    claim: 'Baal-perazim: possessor of breaches (queried in the lexicon); site unknown'
    key: bdb
    url: 'https://biblehub.com/hebrew/1188.htm'
    quote: 'בַּ֫עַל מְּרָצִים proper name, of a location (possessor of breaches; or Baal of Perasim ?) where David defeated Philistine 2 Samuel 5:20 (twice in verse); 1 Chronicles 14:11 (twice in verse); site unknown.'
  - where: 'note 5:20 “The LORD broke through like water”'
    claim: 'paras: break through'
    key: bdb
    url: 'https://biblehub.com/hebrew/6555.htm'
    quote: 'I. מָּרַץ verb break through'
  - where: 'note 5:20 “The LORD broke through like water”'
    claim: 'The footnote: “breach” OR bursting-forth; it points to Isa. 28:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/5?lang=eng'
    quote: '20a “Baal-perazim”: 1 Chr. 14:11 (10–11); Isa. 28:21. … 20b “breach”: OR bursting-forth.'
  - where: 'note 5:20 “The LORD broke through like water”'
    claim: 'Chronicles: God hath broken in upon mine enemies by mine hand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/14?lang=eng'
    quote: 'Then David said, God hath broken in upon mine enemies by mine hand like the breaking forth of waters: therefore they called the name of that place Baal-perazim.'

  - where: 'note 5:20 “The LORD broke through like water”'
    claim: 'Isaiah: the LORD shall rise up as in mount Perazim, to do his strange work'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/28?lang=eng'
    quote: 'For the LORD shall rise up as in mount Perazim, he shall be wroth as in the valley of Gibeon, that he may do his work, his strange work'
  - where: setting
    claim: 'Chronicles 14 tells David’s wives, children and Philistine victories'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/14?lang=eng'
    quote: 'David marries wives, begets children, and defeats the Philistines'
  - where: 'note 5:21 “Idols left on the field”'
    claim: 'The Hebrew says David carried the images away'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/5?lang=eng'
    quote: '21b “burned them”: HEB carried them away.'
  - where: 'note 5:21 “Idols left on the field”'
    claim: 'The verb is nasa, to lift or carry'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'וַ/יִּשָּׂאֵ֥/ם'
  - where: 'note 5:21 “Idols left on the field”'
    claim: 'Chronicles: they left their gods, and at David’s command they were burned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/14?lang=eng'
    quote: 'And when they had left their gods there, David gave a commandment, and they were burned with fire.'
  - where: 'note 5:21 “Idols left on the field”'
    claim: 'The Philistines had once taken the ark; now David burned the idols left behind'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'In the past, the Philistines had taken the ark from Israel (see 1 Samuel 4:11). However, now David burned the Philistine idols that had been left behind.'

  - where: 'note 5:23 “Asking again”'
    claim: 'It would have been tempting to rely on the previous instructions; David prayed and received new directions'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'It would have been tempting for David to rely on the previous instructions and to attack head-on. Nevertheless, David prayed to the Lord and received new directions.'
  - where: 'note 5:23 “Asking again”'
    claim: 'The Lord can give direction; David’s example, with 1 Sam. 23:2, 10–11; 30:8; 2 Sam. 2:1'
    key: cfm-ot-2026-25
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/25?lang=eng'
    quote: 'Even after David defeated Goliath, his problems with the Philistines were not over. As you read 2 Samuel 5:17–25, consider how David’s example can help you in the challenges you face (see also 1 Samuel 23:2, 10–11; 30:8; 2 Samuel 2:1).'
  - where: 'note 5:23 “Asking again”'
    claim: 'Chronicles: turn away from them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/14?lang=eng'
    quote: 'Therefore David inquired again of God; and God said unto him, Go not up after them; turn away from them, and come upon them over against the mulberry trees.'

  - where: 'note 5:24 “A sound of marching in the trees”'
    claim: 'tseadah: marching; the sound of marching'
    key: bdb
    url: 'https://biblehub.com/hebrew/6807.htm'
    quote: 'I. צְעָדָה noun feminine marching; — ׳קוֺל צ 2 Samuel 5:24 the sound of marching = 1 Chronicles 14:15.'
  - where: 'note 5:24 “A sound of marching in the trees”'
    claim: 'The Hebrew words of the verse'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'צְעָדָ֛ה בְּ/רָאשֵׁ֥י הַ/בְּכָאִ֖ים'
  - where: 'note 5:24 “A sound of marching in the trees”'
    claim: 'baka: balsam-tree; plural at 2 Sam. 5:23–24; singular in the valley of Baca, Ps. 84'
    key: bdb
    url: 'https://biblehub.com/hebrew/1057.htm'
