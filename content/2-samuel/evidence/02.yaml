chapter: 2
claims:
  - where: setting
    claim: 'After Gilboa the Israelites in the valley and beyond the Jordan abandoned their towns, and the Philistines occupied them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/31?lang=eng'
    quote: 'they forsook the cities, and fled; and the Philistines came and dwelt in them.'
  - where: setting
    claim: 'The Bible Dictionary chronology dates David king in Hebron to 1055 B.C.'
    key: bible-chron-ot
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bible-chron/old-testament?lang=eng'
    quote: '1055 | David king in Hebron.'
  - where: when
    claim: 'The chapter follows the death of Saul and begins David’s reign in Hebron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/2?lang=eng'
    quote: 'David is anointed king over the house of Judah—Ishbosheth becomes the king of Israel—David’s followers defeat Abner and the men of Israel.'
  - where: thread
    claim: 'Joab later avenged Asahel’s death on Abner'
    key: bd-asahel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/asahel?lang=eng'
    quote: 'slain by Abner (2 Sam. 2:18–32); Joab’s revenge (3:27–30; see also 1 Chr. 2:16; 11:26).'
  - where: 'note 2:4 “They anointed David king over the house of Judah”'
    claim: 'At Ziklag David had asked the LORD through Abiathar and the ephod whether to pursue'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/30?lang=eng'
    quote: 'And David said to Abiathar the priest, Ahimelech’s son, I pray thee, bring me hither the ephod. … And David inquired at the LORD, saying, Shall I pursue after this troop?'
  - where: 'note 2:4 “They anointed David king over the house of Judah”'
    claim: 'Hebron: an ancient city of Judah 3040 feet up, 20 miles south of Jerusalem; Abraham’s burying place; Caleb’s; a city of refuge and Levitical city; David’s capital in the earlier part of his reign'
    key: bd-hebron
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hebron?lang=eng'
    quote: 'An ancient city of Judah, 3040 feet above the Mediterranean, 20 miles south of Jerusalem … It was the burying place of Abraham and his family … became the property of Caleb … one of the six cities of refuge … a Levitical city … and David’s capital during the earlier part of his reign'
  - where: 'note 2:4 “They anointed David king over the house of Judah”'
    claim: 'All the elders of Israel later anointed David king over Israel at Hebron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/5?lang=eng'
    quote: 'So all the elders of Israel came to the king to Hebron; and king David made a league with them in Hebron before the LORD: and they anointed David king over Israel.'
  - where: 'note 2:6 “Kindness and truth”'
    claim: 'Verse 6 has ḥesed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'חֶ֣סֶד'
  - where: 'note 2:6 “Kindness and truth”'
    claim: 'Verse 6 has ʾĕmet'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'וֶ/אֱמֶ֑ת'
  - where: 'note 2:6 “Kindness and truth”'
    claim: 'The second “kindness” in verse 6 is haṭṭôbâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'הַ/טּוֹבָ֣ה'
  - where: 'note 2:6 “Kindness and truth”'
    claim: 'Ḥesed is kindness of people toward others in doing favours, often joined with ʾĕmet, as at Genesis 24:49'
    key: bdb
    url: 'https://biblehub.com/hebrew/2617.htm'
    quote: '1 kindness of men towards men, in doing favours and benefits … ואמת ׳עשׂה ח Genesis 24:49; Genesis 47:29; Joshua 2:14'
  - where: 'note 2:6 “Kindness and truth”'
    claim: 'Ḥesed is used of God’s kindness too'
    key: bdb
    url: 'https://biblehub.com/hebrew/2617.htm'
    quote: 'II. of God: kindness, lovingkindness in condescendig to the needs of his creatures.'
  - where: 'note 2:6 “Kindness and truth”'
    claim: 'ʾĕmet means firmness, faithfulness, truth, reliability'
    key: bdb
    url: 'https://biblehub.com/hebrew/571.htm'
    quote: 'אֱמֶת noun feminine firmness, faithfulness, truth … 1 reliability, sureness'
  - where: 'note 2:6 “Kindness and truth”'
    claim: 'ṭôbâ means welfare, benefit, good'
    key: bdb
    url: 'https://biblehub.com/hebrew/2896.htm'
    quote: 'טוֺבָה noun feminine welfare, benefit, good things, good'
  - where: 'note 2:6 “Kindness and truth”'
    claim: 'The footnote gives “do, recompense” for “requite”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/2?lang=eng'
    quote: '6a “requite”: OR do, recompense.'
  - where: 'note 2:8 “Abner and Ish-bosheth”'
    claim: 'Abner, captain of Saul’s army, made Ishbosheth king, and later went over to David'
    key: bd-abner
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abner?lang=eng'
    quote: 'Captain of Saul’s army (1 Sam. 14:50; 17:55; 20:25; 26:5–15); makes Ishbosheth king (2 Sam. 2:8–9); defeated by Joab, slays Asahel (2:12–32); revolts to David (3:6–21)'
  - where: 'note 2:8 “Abner and Ish-bosheth”'
    claim: 'Abner was the son of Ner, Saul’s uncle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/14?lang=eng'
    quote: 'the name of the captain of his host was Abner, the son of Ner, Saul’s uncle.'
  - where: 'note 2:8 “Abner and Ish-bosheth”'
    claim: 'Chronicles names Saul’s son Esh-baal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/8?lang=eng'
    quote: 'Kish begat Saul, and Saul begat Jonathan, and Malchi-shua, and Abinadab, and Esh-baal.'
  - where: 'note 2:8 “Abner and Ish-bosheth”'
    claim: 'Later Israelites would not pronounce Baal and substituted bosheth, “shameful thing”'
    key: bd-mephibosheth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/mephibosheth?lang=eng'
    quote: 'His true name was Merib-baal; but later Israelites were unwilling to pronounce the name Baal (Ex. 23:13) and substituted for it bosheth (“shameful thing”).'
  - where: 'note 2:8 “Abner and Ish-bosheth”'
    claim: 'Ish-bosheth means “man of shame,” changed from Esh-baal; he was a tool in Abner’s hands; Abner had fled across the Jordan with him after Gilboa'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/2.htm'
    quote: 'Saul’s fourth son, not previously mentioned, was a mere tool in the hands of Abner. His original name … was Esh-baal (= man of Baal), but this has been changed to Ish-bosheth (= man of shame)'
  - where: 'note 2:8 “Abner and Ish-bosheth”'
    claim: 'Abner escaped from Gilboa with Ish-bosheth across the Jordan, where there seems to have been a general retreat while the land west of the Jordan was abandoned to the Philistines'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/2.htm'
    quote: 'Abner had escaped from the fatal field and carried Ish-bosheth with him across the Jordan, whither it would seem there was a general retreat, while the country west of the Jordan was abandoned to the Philistines'
  - where: 'note 2:6 “Kindness and truth”'
    claim: 'One older reading: David hoped the men of Jabesh would join him and hold Gilead against the Philistines; since Gilead became Ish-bosheth’s headquarters, the embassy apparently failed'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/2.htm'
    quote: 'makes it plain that David hoped the men of Jabesh would join him, and hold the land of Gilead against the Philistines until he could come to their aid. As however Gilead became the head-quarters of his rival Ish-bosheth, it does not appear that the embassy was successful.'
  - where: 'note 2:6 “Kindness and truth”'
    claim: 'Jabesh was the capital of Gilead'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/2.htm'
    quote: 'If David could secure the support of the capital of Gilead (1 Samuel 11:1)'
  - where: 'note 2:8 “Abner and Ish-bosheth”'
    claim: 'Mahanaim was the place of Jacob’s two hosts, chosen by Abner as Ish-bosheth’s capital'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/2.htm'
    quote: 'where Jacob had divided his people into ‘two hosts,’ and had seen the ‘two hosts’ of the angelic vision” (Genesis 32:2; Genesis 32:10), was chosen by Abner as the capital of Ish-bosheth’s kingdom.'
  - where: 'note 2:8 “Abner and Ish-bosheth”'
    claim: 'The age of forty is surprising and may be a copying error; the two years probably count from when Abner established his authority over all Israel, after five and a half years of reconquest, and fall at the end of David’s Hebron years'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/2.htm'
    quote: 'it is possible that the numeral has been corrupted in transcription … The duration of Ish-bosheth’s reign is probably reckoned from the time when Abner succeeded in establishing his authority over all Israel. Five years and a half were occupied with the reconquest of the land from the Philistines'
  - where: 'note 2:8 “Abner and Ish-bosheth”'
    claim: 'At forty, Ish-bosheth would be older than his eldest brother Jonathan seems to have been'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/2.htm'
    quote: 'Ish-bosheth’s eldest brother Jonathan seems to have been about the same age as David, and therefore not much more than thirty at the time of his death.'
  - where: 'note 2:14 “Let the young men … play before us”'
    claim: 'The verb is śāḥaq, “make sport,” used at 2 Samuel 2:14 of a tournament'
    key: bdb
    url: 'https://biblehub.com/hebrew/7832.htm'
    quote: '1 make sport, Judges 16:25 (ל person) 2 Samuel 2:14 (לִפְנֵי person; in tournament)'
  - where: 'note 2:14 “Let the young men … play before us”'
    claim: 'The verb in 2:14 is a form of śāḥaq'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'וִֽ/ישַׂחֲק֖וּ'
  - where: 'note 2:14 “Let the young men … play before us”'
    claim: 'The contest was more than a grudge match: champions were chosen to decide between the two kingdoms, with reference to the champion of 1 Samuel 17; “play” meant to let twelve on each side fight'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'was more than a simple grudge match … in the clash between the two kingdoms, champions were chosen to determine the winner (see Reading 25-5). The challenge to let the young men “play before us” (v. 14) meant to let the twelve representatives battle for each side.'
  - where: 'note 2:14 “Let the young men … play before us”'
    claim: 'No clear winner was shown, so the two sides broke into battle, which David’s men won'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'When the twelve from each side had killed each other, no clear winner was shown, so both sides erupted into a furious battle, which David’s men won.'
  - where: 'note 2:14 “Let the young men … play before us”'
    claim: 'The manual’s Reading 25-5 is on Goliath as a champion, the man who settles a dispute between two armies'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/1-samuel-16-31-king-davids-call-to-lead-israel?lang=eng'
    quote: 'ish habbenayim, a middle man, the man between two; that is, as here, the man who undertakes to settle the disputes between two armies or nations.'
  - where: 'note 2:23 “Under the fifth rib”'
    claim: 'Asahel, youngest son of Zeruiah, was celebrated for swiftness of foot, much valued in ancient times; slain by Abner'
    key: bd-asahel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/asahel?lang=eng'
    quote: 'Youngest son of Zeruiah, one of David’s 30 heroes (2 Sam. 23:24) … celebrated for his swiftness of foot, an accomplishment much valued in ancient times; slain by Abner'
  - where: 'note 2:23 “Under the fifth rib”'
    claim: 'The word for “armour” in 2:21 means what is stripped off a person as plunder in war'
    key: bdb
    url: 'https://biblehub.com/hebrew/2488.htm'
    quote: '[חֲלִיצָה] noun feminine what is stripped off a person, as plunder, in war; — only suffix חֲלִצָתוֺ 2 Samuel 2:21'
  - where: 'note 2:23 “Under the fifth rib”'
    claim: 'The word in 2:23 is ḥōmeš, “belly”; 20:10 uses it'
    key: bdb
    url: 'https://biblehub.com/hebrew/2570.htm'
    quote: 'II. חֹ֫מֶשׁ noun masculine belly (Aramaic ) — הַחֹמֶשׁ 2 Samuel 2:23 3t.; ׳וַיַּכֵּהוּ ֗֗֗ אלהֿח 2 Samuel 2:23 and he smote him in the belly; 2 Samuel 20:10'
  - where: 'note 2:23 “Under the fifth rib”'
    claim: 'The word in 2:23 is H2570'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'הַ/חֹ֗מֶשׁ'
  - where: 'note 2:23 “Under the fifth rib”'
    claim: 'The footnote at “fifth” points to 2 Samuel 20:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/2?lang=eng'
    quote: '23a “fifth”: 2 Sam. 20:10.'
  - where: 'note 2:23 “Under the fifth rib”'
    claim: 'The footnote at “Asahel” points to 2 Samuel 3:27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/2?lang=eng'
    quote: '23b “Asahel”: 2 Sam. 3:27.'
  - where: 'note 2:23 “Under the fifth rib”'
    claim: 'Joab killed Abner under the fifth rib for Asahel’s blood'
    key: bd-asahel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/asahel?lang=eng'
    quote: 'Joab’s revenge (3:27–30; see also 1 Chr. 2:16; 11:26).'
  - where: christ
    claim: 'Christ is Greek for “anointed one,” used of kings, who were anointed at their coronation (2 Samuel 2:4)'
    key: sc-knowhy-392
    url: 'https://scripturecentral.org/knowhy/why-did-the-wise-men-give-jesus-gold-frankincense-and-myrrh'
    quote: 'The word Christ, for example, is Greek for “anointed one” and is often used to refer to kings, who were anointed when they received their coronation (see 2 Samuel 2:4).'
  - where: christ
    claim: 'The Lord’s ḥesed is promised to David’s heir “as I took it from Saul”'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'But my mercy [ḥesed] shall not depart away from him, as I took it from Saul'
  - where: christ
    claim: 'The loving-kindness God promises David’s house finds its richest fulfillment in Jesus'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'how the loving-kindness God promises to the house of David finds its richest fulfillment in the life, ministry, and atonement of Jesus, the messianic ruler from David’s line.'
  - where: christ
    claim: 'Understanding the covenant and the godly love it reflects can give hope in Christ in morally complex times'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'The Davidic covenant offers a pattern of recalling past mercies while trusting in future grace. … Understanding this covenant and the godly love it reflects can offer hope in Christ during morally complex times.'
