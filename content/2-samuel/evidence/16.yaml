chapter: 16
claims:
  - where: setting
    claim: 'David went up the Mount of Olives weeping, barefoot, with his head covered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/15?lang=eng'
    quote: 'And David went up by the ascent of mount Olivet, and wept as he went up, and had his head covered, and he went barefoot'
  - where: setting
    claim: 'The “top of the hill” in 16:1 is the summit of the Mount of Olives of 15:32'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/16.htm'
    quote: 'When David had gone a little over the height (of the Mount of Olives: הראשׁ points back to 2 Samuel 15:32)'
  - where: setting
    claim: 'Bahurim lay on the other side of the Mount of Olives, not far off (compare 3:16)'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/16.htm'
    quote: 'When the king had come to Bahurim, on the other side of the Mount of Olives, but not far off (see at 2 Samuel 3:16)'
  - where: setting
    claim: 'Psalm 3’s title sets it in David’s flight from Absalom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/3?lang=eng'
    quote: 'A Psalm of David, when he fled from Absalom his son.'

  - where: thread
    claim: 'The Church’s footnote at 16:22 sends the reader to Nathan’s sentence in 12:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/16?lang=eng'
    quote: '22a “Absalom”: 2 Sam. 12:12.'

  - where: "note 16:3 “Ziba's word against his master”"
    claim: 'Ziba and his sons and servants were set to till Saul’s land for Mephibosheth, who ate at the king’s table'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/9?lang=eng'
    quote: 'Thou therefore, and thy sons, and thy servants, shall till the land for him, and thou shalt bring in the fruits, that thy master’s son may have food to eat: but Mephibosheth thy master’s son shall eat bread alway at my table.'
  - where: "note 16:3 “Ziba's word against his master”"
    claim: 'Mephibosheth later says Ziba slandered him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/19?lang=eng'
    quote: 'And he hath slandered thy servant unto my lord the king; but my lord the king is as an angel of God'

  - where: 'note 16:8 “All the blood of the house of Saul”'
    claim: 'What blood Shimei meant cannot be determined with certainty; perhaps Abner and Ish-bosheth, of whose deaths David was innocent'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/16.htm'
    quote: 'What Shimei meant by "all the blood of the house of Saul," which David had shed, and because of which he was a man of blood, it is impossible to determine with certainty. He may possibly have attributed to David the murder of Ishbosheth and Abner, notwithstanding the fact that David was innocent of the death of both'
  - where: 'note 16:8 “All the blood of the house of Saul”'
    claim: 'Shimei was a distant relation of Saul'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/16.htm'
    quote: 'a man of the family of the house of Saul, i.e., a distant relation of Saul'
  - where: 'note 16:8 “All the blood of the house of Saul”'
    claim: 'Shimei probably meant Gilboa, Abner and Ish-bosheth (treacherously murdered), perhaps the execution of Saul’s sons (ch. 21) if already past; not Uriah, though David would feel the curse not undeserved for Uriah'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/16.htm'
    quote: 'Shimei probably refers to the deaths of Saul and his sons at Gilboa, of Abner and Ish-bosheth by treacherous murder … possibly also he regarded the execution of Saul’s sons (ch. 2 Samuel 21:1-9), which in all probability had taken place before this time, as a judicial murder. Shimei would not intend to refer to Uriah, though David would feel that it was for his death that the curse was not undeserved.'
  - where: 'note 16:8 “All the blood of the house of Saul”'
    claim: 'His kinship with Saul’s clan accounts for his hatred'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/16.htm'
    quote: 'His connexion with the clan of Saul accounts for the virulence of his hatred.'
  - where: 'note 16:8 “All the blood of the house of Saul”'
    claim: 'The people understood that David had no part in Abner’s death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/3?lang=eng'
    quote: 'For all the people and all Israel understood that day that it was not of the king to slay Abner the son of Ner.'

  - where: 'note 16:10 “Let him curse”'
    claim: 'Four reasons David chose to endure the curses: dishonor slight beside his son’s; patient suffering might bring requital; perhaps the Lord commanded it; moderate action against the violent sons of Zeruiah'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: '(1) any dishonor was considered negligible compared to the dishonor of his own son taking his kingship and seeking his life; (2) if he suffered his afflictions patiently, perhaps the Lord would have mercy upon him and requite him later; (3) perhaps the Lord Himself had commanded Shimei to curse him; (4) since the sons of Zeruiah (Abishai and Joab) were such men of violence, David countered as usual with more moderate action.'
  - where: 'note 16:10 “Let him curse”'
    claim: 'David, blown about by others’ agency, urges forbearance and craves God’s ḥesed'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'The erstwhile powerful David now seems to be blown about at the mercy of the winds of others’ agency. … David urges forgiveness and forbearance … He craves the loving-kindness, mercy, and forgiveness of God, for now he needs the Lord’s ḥesed more than ever.'
  - where: 'note 16:10 “Let him curse”'
    claim: 'Shimei later craves and receives forgiveness; David charges Solomon to punish him; he is put to death'
    key: bd-shimei
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shimei?lang=eng'
    quote: 'Son of Gera; curses David on his flight from Absalom (2 Sam. 16:5–13); craves and receives forgiveness on David’s return (19:18–23); David charges Solomon to punish him (1 Kgs. 2:8–9); is to stay at Jerusalem (2:36–37); is put to death (2:46).'
  - where: 'note 16:10 “Let him curse”'
    claim: 'Solomon’s sentence on Shimei (the Church’s footnote at 16:5 points to it)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'Thou knowest all the wickedness which thine heart is privy to, that thou didst to David my father: therefore the Lord shall return thy wickedness upon thine own head'

  - where: 'note 16:12 “Mine affliction, or mine iniquity”'
    claim: 'In 16:12 the written text (ketiv) has “my iniquity” and the reading to be read aloud (qere) “my eye”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'ב/עונ/י … בְּ/עֵינִ֑/י'
  - where: 'note 16:12 “Mine affliction, or mine iniquity”'
    claim: 'ʿāwōn means iniquity, guilt, or punishment of iniquity; BDB proposes reading “my affliction” at 2 Sam. 16:12'
    key: bdb
    url: 'https://biblehub.com/hebrew/5771.htm'
    quote: 'עָוֺן noun masculine … iniquity, guilt, or punishment of iniquity; … suffix עֲוֺנִי Genesis 4:13 + (2 Samuel 16:12 read בְּעָנְיִי)'
  - where: 'note 16:12 “Mine affliction, or mine iniquity”'
    claim: 'The Septuagint reads “my affliction”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_samuel/16.htm'
    quote: 'If by any means the Lord may look on my affliction, thus shall he return me good for his cursing this day.'
  - where: 'note 16:12 “Mine affliction, or mine iniquity”'
    claim: 'A modern translation reads “my distress”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+16&version=NRSVUE'
    quote: 'It may be that the Lord will look on my distress, and the Lord will repay me with good for this cursing of me today.'
  - where: 'note 16:12 “Mine affliction, or mine iniquity”'
    claim: 'The Hebrew is difficult; the written “my iniquity” is understandable as the wrong done to David; the read-aloud “my eyes” is usually taken to mean “my tears,” a doubtful sense'
    key: net-bible
    url: 'https://biblia.com/bible/gs-netbible/2Sa16.12'
    quote: 'The Hebrew text is difficult here. … While this Kethib reading is understandable as an objective genitive (i.e., “the wrong perpetrated upon me”) … The Qere of the בְּעֵינֵי (bé’eni, “on my eyes”), usually taken as synecdoche to mean “my tears,” does not commend itself as a likely meaning.'

  - where: "note 16:16 “David's friend at Absalom's court”"
    claim: 'The Hebrew of Hushai’s cry is “Let the king live”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/16?lang=eng'
    quote: '16a “God”: HEB Let the king live, let the king live!'
  - where: "note 16:16 “David's friend at Absalom's court”"
    claim: 'Hushai was a good choice: inside information, able to offset Ahithophel'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'His choice of Hushai was particularly good because he not only had inside information but was able to offset counsel given by the sagacious Ahithophel.'

  - where: 'note 16:22 “On the roof, in the sight of all Israel”'
    claim: 'The Church’s footnote at 16:22 points to 12:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/16?lang=eng'
    quote: '22a “Absalom”: 2 Sam. 12:12.'
  - where: 'note 16:22 “On the roof, in the sight of all Israel”'
    claim: 'David walked on the roof of the king’s house when he saw Bath-sheba'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/11?lang=eng'
    quote: 'David arose from off his bed, and walked upon the roof of the king’s house: and from the roof he saw a woman washing herself'
  - where: 'note 16:22 “On the roof, in the sight of all Israel”'
    claim: 'The roof of the secret sin became the public scene of its punishment, the punishment corresponding to the sin'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/16.htm'
    quote: 'The fact that the very roof on which David was walking when he secretly conceived his great sin was the public scene of its punishment, and the nature of the punishment, corresponding to the nature of the sin, as Nathan had foretold, make this retribution signally striking.'
  - where: 'note 16:22 “On the roof, in the sight of all Israel”'
    claim: 'The act usurped the throne and made reconciliation impossible; on Keil’s reading Ahithophel hoped for this, since otherwise David might forgive Absalom and Ahithophel would suffer; under God it fulfilled the threat without his intending it'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/16.htm'
    quote: 'a complete usurpation of the throne (see at 2 Samuel 3:7), which would render any reconciliation between Absalom and his father utterly impossible … it was always a possible thing that he should forgive Absalom; and in that case Ahithophel would be the one to suffer. But under the superintendence of God this advice of Ahithophel was to effect the fulfilment, without any such intention on his part, of the threat'
  - where: 'note 16:22 “On the roof, in the sight of all Israel”'
    claim: 'David afterward shut up the ten concubines in widowhood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/20?lang=eng'
    quote: 'the king took the ten women his concubines, whom he had left to keep the house, and put them in ward, and fed them, but went not in unto them. So they were shut up unto the day of their death, living in widowhood.'

  - where: 'note 16:23 “Counsel taken as the word of God”'
    claim: 'The Hebrew of “oracle of God” is “word of God”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/16?lang=eng'
    quote: '23b “oracle of God”: HEB word of God.'
  - where: 'note 16:23 “Counsel taken as the word of God”'
    claim: 'Ahithophel’s counsel was overthrown by Hushai and he hanged himself; he was the grandfather of Bathsheba'
    key: bd-ahithophel
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ahithophel?lang=eng'
    quote: 'His counsel overthrown by Hushai, he hangs himself (16:15–17:23). Grandfather of Bathsheba (2 Sam. 11:3; 23:34; 1 Chr. 27:33–34).'
  - where: 'note 16:23 “Counsel taken as the word of God”'
    claim: 'Eliam was the son of Ahithophel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/23?lang=eng'
    quote: 'Eliam the son of Ahithophel the Gilonite,'

  - where: christ
    claim: 'Abishai’s zeal recalls the Sons of Thunder (Luke 9:54), and David’s answer Christ’s answer to Peter (John 18:10–11)'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/16.htm'
    quote: 'His fiery zeal reminds us of the Sons of Thunder (Luke 9:54), and David’s answer recalls Christ’s answer to Peter (John 18:10-11).'
  - where: christ
    claim: 'The Church’s footnote at “requite” in 16:12 points to D&C 98:23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/16?lang=eng'
    quote: '12a “requite”: Morm. 3:15; D&C 82:23; 98:23.'
