chapter: 19
claims:
  - where: setting
    claim: 'Joab killed Absalom with three darts; David wept in the chamber over the gate'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/18?lang=eng'
    quote: 'And he took three darts in his hand, and thrust them through the heart of Absalom, while he was yet alive in the midst of the oak. … went up to the chamber over the gate, and wept'
  - where: setting
    claim: 'Absalom''s revolt began with his being proclaimed king in Hebron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/15?lang=eng'
    quote: 'then ye shall say, Absalom reigneth in Hebron.'
  - where: setting
    claim: 'Ziba accused Mephibosheth of hoping for his father''s kingdom, and David gave Ziba his property'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/16?lang=eng'
    quote: 'for he said, To day shall the house of Israel restore me the kingdom of my father. … Then said the king to Ziba, Behold, thine are all that pertained unto Mephibosheth.'
  - where: setting
    claim: 'Barzillai the Gileadite was among those who met David at Mahanaim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/17?lang=eng'
    quote: 'when David was come to Mahanaim, that Shobi the son of Nahash of Rabbah of the children of Ammon, and Machir the son of Ammiel of Lo-debar, and Barzillai the Gileadite of Rogelim,'
  - where: setting
    claim: 'The next chapter tells of Sheba''s revolt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/20?lang=eng'
    quote: 'Sheba leads the tribes of Israel away from David'
  - where: thread
    claim: 'Joab killed Amasa; David charged Solomon about Shimei and the sons of Barzillai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'But shew kindness unto the sons of Barzillai the Gileadite … Now therefore hold him not guiltless'
  - where: section 1 plain
    claim: 'Footnote 7a: “speak comfortably” is Hebrew “speak to the heart”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/19?lang=eng'
    quote: '“speak comfortably”: HEB speak to the heart; i.e., show appreciation.'
  - where: section 6 plain
    claim: 'The “parts” of 19:43 are shares (Hebrew yad, “hand,” in the sense of a share)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3027.htm'
    quote: 'b. part, fractional part or share: of seed Genesis 47:24 (J); share in king 2 Samuel 19:44'

  - where: 'note 19:7 “Speak to the heart of thy servants”'
    claim: 'The people stole into the city ashamed; Joab says David loves his enemies'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/19?lang=eng'
    quote: 'And the people gat them by stealth that day into the city, as people being ashamed steal away when they flee in battle.'
  - where: 'note 19:7 “Speak to the heart of thy servants”'
    claim: 'David nearly lost the kingdom; Joab''s counsel needed and justified but harsh, and probably contributed to his replacement'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'David bore the tragedy so bitterly that he nearly lost the kingdom by insulting those who had defended him. … Though Joab’s counsel was needed and justified, his words were harsh and disrespectful and probably contributed to David’s decision to replace him as commanding general.'
  - where: 'note 19:7 “Speak to the heart of thy servants”'
    claim: 'Joab killed Absalom against the king''s word'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/18?lang=eng'
    quote: 'Then said Joab, I may not tarry thus with thee. And he took three darts in his hand, and thrust them through the heart of Absalom'

  - where: 'note 19:13 “Amasa in the room of Joab”'
    claim: 'Amasa was David''s nephew; the promise was a bold stroke of policy to secure the rebel army and punish Joab, but hardly prudent'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/19.htm'
    quote: 'It was a bold stroke of policy to promise the post of commander-in chief to the general of the rebel army. By so doing, David designed at once to secure the allegiance of that army, and to punish Joab for killing Absalom in defiance of his command. But it was hardly prudent. Joab was certain not to submit to it tamely: Amasa’s military skill was probably inferior, and his loyalty remained to be proved.'
  - where: 'note 19:13 “Amasa in the room of Joab”'
    claim: 'Amasa was Absalom''s captain, received David''s offer, and was slain by Joab (1 Kgs. 2:5)'
    key: bd-amasa
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amasa?lang=eng'
    quote: 'Made captain of the host by Absalom (2 Sam. 17:25); offer made to Amasa by David (19:13); was slain by Joab (20:4–5, 8–12; 1 Kgs. 2:5, 32; 1 Chr. 2:17).'
  - where: 'note 19:13 “Amasa in the room of Joab”'
    claim: 'Amasa tarried in gathering Judah; Joab greeted him as brother and killed him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/20?lang=eng'
    quote: 'So Amasa went to assemble the men of Judah: but he tarried longer than the set time which he had appointed him. … And Joab said to Amasa, Art thou in health, my brother?'
  - where: 'note 19:13 “Amasa in the room of Joab”'
    claim: 'David counted Amasa''s death against Joab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'Moreover thou knowest also what Joab the son of Zeruiah did to me, and what he did to the two captains of the hosts of Israel, unto Abner the son of Ner, and unto Amasa the son of Jether, whom he slew'
  - where: 'note 19:13 “Amasa in the room of Joab”'
    claim: 'David''s appeal to Judah through the priests and its result'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/19?lang=eng'
    quote: 'And he bowed the heart of all the men of Judah, even as the heart of one man'

  - where: 'note 19:22 “No man put to death this day”'
    claim: 'On a Latter-day Saint reading, David returned and showed clemency to those who had rebelled'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'David returns to Jerusalem and shows clemency to those who had rebelled against him (2 Samuel 19).'
  - where: 'note 19:22 “No man put to death this day”'
    claim: 'Abishai''s charge and David''s answer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/19?lang=eng'
    quote: 'Shall not Shimei be put to death for this, because he cursed the LORD’s anointed?'
  - where: 'note 19:22 “No man put to death this day”'
    claim: 'David later told Solomon not to hold Shimei guiltless'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'he came down to meet me at Jordan, and I sware to him by the Lord, saying, I will not put thee to death with the sword. … Now therefore hold him not guiltless'

  - where: 'note 19:26 “Ziba or Mephibosheth?”'
    claim: 'Ziba''s accusation and David''s grant to him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/16?lang=eng'
    quote: 'To day shall the house of Israel restore me the kingdom of my father. … Behold, thine are all that pertained unto Mephibosheth.'
  - where: 'note 19:26 “Ziba or Mephibosheth?”'
    claim: 'Mephibosheth''s answer and David''s division of the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/19?lang=eng'
    quote: 'because thy servant is lame. … I have said, Thou and Ziba divide the land. … let him take all, forasmuch as my lord the king is come again in peace unto his own house.'
  - where: 'note 19:26 “Ziba or Mephibosheth?”'
    claim: 'Older reading: Ziba saddled the asses and went to David with a fictitious story'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/19.htm'
    quote: 'Apparently Ziba, after receiving the order, saddled the asses, loaded them with provisions, and went to meet David with his fictitious story (ch. 2 Samuel 16:1), leaving Mephibosheth in the lurch.'
  - where: 'note 19:26 “Ziba or Mephibosheth?”'
    claim: 'The neglect of his person was an outward sign of extreme grief'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/19.htm'
    quote: 'The neglect of his person, the unwashed feet, the untrimmed moustache, the soiled garments, were outward signs of extreme grief.'
  - where: 'note 19:26 “Ziba or Mephibosheth?”'
    claim: 'The division read as compromise (suspicion, or unwillingness to alienate Ziba) or as confirmation of the tenancy'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/19.htm'
    quote: 'This is usually supposed to be a compromise between the two claimants, either because David suspected the truth of Mephibosheth’s story, or because he was unwilling to alienate Ziba … But it may be a confirmation of the original arrangement by which Ziba was to be Mephibosheth’s tenant'
  - where: 'note 19:26 “Ziba or Mephibosheth?”'
    claim: 'Older reading: the mourning placed Ziba''s slander beyond doubt'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/19.htm'
    quote: 'He did not venture to dispute the fact that Mephibosheth had really been calumniated by Ziba, which was placed beyond all doubt by his mourning'
  - where: 'note 19:26 “Ziba or Mephibosheth?”'
    claim: 'The Bible Dictionary heads the episodes “Ziba''s slander” and “his defense”'
    key: bd-mephibosheth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/mephibosheth?lang=eng'
    quote: 'David’s kindness to him (9:5–13); Ziba’s slander (16:1–4); his defense (19:24–28)'
  - where: 'note 19:26 “Ziba or Mephibosheth?”'
    claim: 'Ziba and his sons were to till the land for Mephibosheth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/9?lang=eng'
    quote: 'Thou therefore, and thy sons, and thy servants, shall till the land for him, and thou shalt bring in the fruits'

  - where: 'note 19:33 “Barzillai''s kindness repaid”'
    claim: 'David used ḥesed in political relationships and charged Solomon to do ḥesed to the sons of Barzillai'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'Like Saul, David also used hesed in his political relationships. … In 1 Kings 2:7, David instructed Solomon to “do hesed (shew kindness) unto the sons of Barzillai the Gileadite, and let them be of those that eat at thy table'
  - where: 'note 19:33 “Barzillai''s kindness repaid”'
    claim: 'David''s ḥesed to Jonathan''s son fulfilled his promise of ḥesed, with bread at his table'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'This act was realized as he took Mephibosheth, Jonathan’s son, and brought him to his palace with this declaration: “Fear not: for I will surely do thee hesed (shew thee kindness) for Jonathan thy father’s sake'
  - where: 'note 19:33 “Barzillai''s kindness repaid”'
    claim: 'David''s charge to Solomon concerning Barzillai''s sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'But shew kindness unto the sons of Barzillai the Gileadite, and let them be of those that eat at thy table: for so they came to me when I fled because of Absalom thy brother.'
  - where: 'note 19:43 “Ten parts in the king”'
    claim: 'The other tribes felt Judah was monopolizing David; the incident portended revolution'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'a violent quarrel broke out between the leaders of Judah and the leaders of the other tribes, who felt that Judah was monopolizing David. … This incident portended a whole new round of revolution.'
  - where: 'note 19:43 “Ten parts in the king”'
    claim: 'The animosity of the other tribes against Judah resulted in the division of the kingdom (1 Kgs. 12)'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'once again the animosity of the other tribes was manifested against Judah and resulted in the eventual division of the house of Israel (see 1 Kings 12).'
  - where: 'note 19:43 “Ten parts in the king”'
    claim: '“Parts” renders the Hebrew yad (hand) in the sense of a share in the king'
    key: bdb
    url: 'https://biblehub.com/hebrew/3027.htm'
    quote: 'b. part, fractional part or share: of seed Genesis 47:24 (J); share in king 2 Samuel 19:44'
  - where: 'note 19:43 “Ten parts in the king”'
    claim: 'Israel''s complaint and claim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/19?lang=eng'
    quote: 'Why have our brethren the men of Judah stolen thee away … We have ten parts in the king, and we have also more right in David than ye'
  - where: 'note 19:43 “Ten parts in the king”'
    claim: 'At the division, the tribes answered Rehoboam in nearly Sheba''s words and none followed David''s house but Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'What portion have we in David? neither have we inheritance in the son of Jesse: to your tents, O Israel … there was none that followed the house of David, but the tribe of Judah only.'
  - where: 'note 19:43 “Ten parts in the king”'
    claim: 'Sheba''s cry'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/20?lang=eng'
    quote: 'Sheba leads the tribes of Israel away from David'

  - where: christ
    claim: 'Those who repent find God''s mercy and help'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'God always honors human agency, but those who repent find the mercy and divine help that are always available.'
  - where: 'note 19:22 “No man put to death this day”'
    claim: 'Shimei''s confession'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/19?lang=eng'
    quote: 'For thy servant doth know that I have sinned'
  - where: 'note 19:22 “No man put to death this day”'
    claim: 'David''s answer to Abishai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/19?lang=eng'
    quote: 'for do not I know that I am this day king over Israel?'
  - where: 'note 19:22 “No man put to death this day”'
    claim: 'śāṭān, an opponent; here one who would draw away to evil'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/19.htm'
    quote: 'שׂטן, an opponent, who places obstacles in the way (Numbers 22:22); here it signifies one who would draw away to evil.'
  - where: 'note 19:22 “No man put to death this day”'
    claim: 'Older reading: since David later charged Solomon to punish Shimei, the favour was only a sign of weakness'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/19.htm'
    quote: 'would have been a very laudable one if the king had really forgiven him. But as David when upon his deathbed charged his successor to punish Shimei for this cursing (1 Kings 2:8-9), the favour shown him here was only a sign of David''s weakness'
  - where: 'note 19:33 “Barzillai''s kindness repaid”'
    claim: 'kûl (Pilpel) means sustain, nourish, in both 19:32 and 19:33 (Hebrew 19:33–34)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3557.htm'
    quote: '1 sustain, support, nourish, followed by accusative of person Genesis 45:11; Genesis 50:21 (both E), 2 Samuel 19:33; 2 Samuel 19:34'
  - where: 'note 19:33 “Barzillai''s kindness repaid”'
    claim: 'Barzillai had provided the king of sustenance; David offered to feed him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/19?lang=eng'
    quote: 'he had provided the king of sustenance while he lay at Mahanaim'
  - where: christ
    claim: 'David craved God''s loving-kindness and mercy on the road out'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'He craves the loving-kindness, mercy, and forgiveness of God, for now he needs the Lord’s ḥesed more than ever.'
  - where: christ
    claim: 'God never abandoned David or the covenantal promise'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'the narrative asserts that God never abandoned David or the covenantal promise'
  - where: christ
    claim: 'Jesus called son of David by those seeking mercy; the promisor and fulfillment'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'often by people seeking mercy or healing'
  - where: christ
    claim: 'Jesus is the promisor and the fulfillment of the promise'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'Jesus is simultaneously the promisor and the fulfillment of the promise.'
