chapter: 9
claims:
  - where: when
    claim: 'The episode cannot be before David had reigned some seven years in Jerusalem'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/9.htm'
    quote: 'the incident here recorded cannot have occurred till David had been reigning at Jerusalem for some seven years at least, when Mephibosheth would be about 20 years old.'
  - where: setting
    claim: 'Mephibosheth was five at his father’s death and now has a son, so this is years into the Jerusalem reign; it is an appendix to the summary of the public history, placed before the great sin, and omitted in Chronicles'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/9.htm'
    quote: 'The narrative finds a natural place here as an appendix to the general summary of the public history of David’s reign, and before the account of his great sin with its fatal consequences. It is omitted in Chronicles as being a matter of private interest.'
  - where: setting
    claim: 'The account shows David mindful of gratitude and fidelity at the height of his power, about the middle of his reign'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/9.htm'
    quote: 'was intended to show how David was mindful of the duty of gratitude and loving fidelity, even when he reached the highest point of his regal authority and glory. The date when this occurred was about the middle of David''s reign'
  - where: setting
    claim: 'Once secure on the throne David sought to heal old wounds'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'Once David was secure on the throne, he sought to heal old wounds. His desire was to be kind to any of the house of Saul. The only person left was Mephibosheth, whom David took in and treated nearly as a son.'
  - where: setting
    claim: 'Between the war of expansion in chapter 8 and the corruption that follows, David shows ḥesed to Saul’s house'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'However, David also continues to show ḥesed to the house of Saul and Jonathan, seeking out Jonathan’s surviving son, Mephibosheth, to restore ancestral lands to him and welcome him into the royal household (chap. 9).[19] Despite his sometimes-generous heart, David exhibits the corruption that often accompanies power.'
  - where: setting
    claim: 'Mephibosheth’s story: lamed (4:4), kindness (9), Ziba’s slander (16), his defense (19), spared (21:7)'
    key: bd-mephibosheth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/mephibosheth?lang=eng'
    quote: 'A lame son of Jonathan (2 Sam. 4:4); with Machir at Lodebar (9:6); David’s kindness to him (9:5–13); Ziba’s slander (16:1–4); his defense (19:24–28); David spares him (21:7).'
  - where: thread
    claim: 'The word ḥesed appears three times in the chapter (vv. 1, 3, 7)'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'The word ḥesed appears three times in this chapter as David assures Mephibosheth, “Fear not: for I will surely shew thee kindness [ḥesed] for Jonathan thy father’s sake” (2 Samuel 9:7; see vv. 1, 3).'
  - where: thread
    claim: 'Jonathan’s request for ḥesed to his house was fulfilled when David took Mephibosheth into his palace'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'These promises of complementary acts of hesed were fulfilled later. After David had established his throne, 2 Samuel 9:1, 7 mention David’s desire to remember his promise of hesed'
  - where: thread
    claim: 'Mephibosheth may have feared David meant to kill his predecessor’s kindred'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/9.htm'
    quote: 'Mephibosheth might be afraid that David had only hunted him out to treat him after the common fashion of Oriental usurpers, who often put all their predecessor’s kindred to death.'
  - where: section 3 plain
    claim: 'Verse 11b is the narrator’s conclusion: Mephibosheth ate at David’s table'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/9.htm'
    quote: 'It remains to follow the LXX. in reading at David’s table for “at my table,” and to take the clause along with the next two verses as the narrator’s conclusion of the story'
  - where: 'note 9:1 “For Jonathan''s sake”'
    claim: 'Jonathan asked for ḥesed in return, that David not destroy his line when king; ḥesed was a kingly trait'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'Jonathan agreed, but asked in return for a future act of hesed from David, that when David became king he would not destroy Jonathan’s line'
  - where: 'note 9:1 “For Jonathan''s sake”'
    claim: 'Hesed is something one does; the KJV “shew” renders the verb “to do”'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'the vast majority follow the verb asah, translated in the KJV as “shew(-eth, -ed, etc).” The term is the common Hebrew verb, however, meaning “to do, to make, to perform”; thus when translating it with hesed as the object, it is more correct to say that one “does” hesed.'
  - where: 'note 9:1 “For Jonathan''s sake”'
    claim: 'The word ḥesed appears three times in the chapter'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'The word ḥesed appears three times in this chapter as David assures Mephibosheth'
  - where: 'note 9:1 “For Jonathan''s sake”'
    claim: 'The oath between David and Jonathan, and the LORD’s oath that later spared Mephibosheth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'But the king spared Mephibosheth, the son of Jonathan the son of Saul, because of the LORD’s oath that was between them, between David and Jonathan the son of Saul.'
  - where: 'note 9:3 “The kindness of God”'
    claim: 'Two-thirds of the 245 references to ḥesed describe God as its doer; it may define godly experience, though mortals can do it'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'Of the 245 references, two-thirds of them either describe God as one who does hesed or are praises to God because he does hesed. … Thus hesed is clearly associated with the divine and may even be used to define godly experience.'
  - where: 'note 9:3 “Lame on his feet”'
    claim: 'Compassion toward those with disabilities runs through the Old Testament; 2 Sam. 9:3–7 is among the representative passages'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'The ideal of compassion toward those with disabilities runs consistently through diverse books and genres in the Old Testament, which suggests that this ideal was an important part of ancient Israelite culture. Representative passages include the following'
  - where: 'note 9:3 “Lame on his feet”'
    claim: 'No other passage shows David hating the disabled; he provides generously for Mephibosheth'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'No other passages portray David as bearing any particular hatred toward either people with disabilities or Jebusites. On the contrary, he provides generously for his friend’s lame son Mephibosheth (2 Samuel 9:3–7)'
  - where: 'note 9:3 “Lame on his feet”'
    claim: 'The law forbade putting a stumbling block before the blind'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/19?lang=eng'
    quote: 'Thou shalt not curse the deaf, nor put a stumblingblock before the blind, but shalt fear thy God: I am the LORD.'
  - where: 'note 9:7 “Fear not”'
    claim: 'Mephibosheth might fear the usurpers’ custom of killing the predecessor’s kin; he seems to have lived in concealment at Lo-debar'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/9.htm'
    quote: 'Mephibosheth might be afraid that David had only hunted him out to treat him after the common fashion of Oriental usurpers, who often put all their predecessor’s kindred to death. He seems to have lived in concealment at Lo-debar.'
  - where: 'note 9:7 “Fear not”'
    claim: 'Lo-debar was east of the Jordan near Mahanaim; Machir was a man of wealth who later welcomed David'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/9.htm'
    quote: 'A man of wealth and position, to judge from the welcome which he gave David in his flight from Absalom (ch. 2 Samuel 17:27-29). He may have taken charge of Mephibosheth at Jonathan’s death.'
  - where: 'note 9:7 “Fear not”'
    claim: 'Lo-debar lay east of the Jordan'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/9.htm'
    quote: 'was a town on the east of Mahanaim, towards Rabbath Amman, probably the same place as Lidbir (Joshua 13:26); but it is not further known.'
  - where: 'note 9:7 “Fear not”'
    claim: '“Fear not” was to take away the fear that the king meant to slay the fallen king’s descendants; Saul’s land had become crown land or been taken by relatives'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/9.htm'
    quote: 'It is evident from the words, "I will restore thee all the land of Saul thy father," that the landed property belonging to Saul had either fallen to David as crown lands, or had been taken possession of by distant relations after the death of Saul.'
  - where: 'note 9:7 “Fear not”'
    claim: 'Eating at the king’s table was a common mark of honour (1 Kgs. 2:7; 2 Kgs. 25:29)'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/9.htm'
    quote: 'thou shalt eat bread at my table] A common mark of honour in Oriental countries. See 1 Kings 2:7; 2 Kings 25:29.'
  - where: 'note 9:7 “Fear not”'
    claim: 'Machir of Lo-debar met David at Mahanaim in his flight'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/17?lang=eng'
    quote: 'And it came to pass, when David was come to Mahanaim, that Shobi the son of Nahash of Rabbah of the children of Ammon, and Machir the son of Ammiel of Lo-debar'
  - where: 'note 9:7 “Fear not”'
    claim: 'A dead dog was the vilest, most contemptible object'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/9.htm'
    quote: 'a dead dog] The vilest and most contemptible object possible. See note on ch. 2 Samuel 3:8; and cp. ch. 2 Samuel 16:9; 1 Samuel 24:14.'
  - where: 'note 9:7 “Fear not”'
    claim: 'Mephibosheth thanked David with a confession of unworthiness'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/9.htm'
    quote: 'Mephibosheth expressed his thanks for this manifestation of favour with the deepest obeisance, and a confession of his unworthiness of any such favour.'
  - where: 'note 9:10 “Food to eat”'
    claim: 'Bread includes all necessaries; Mephibosheth ate at the king’s table but had to provide for his own family and servants'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/9.htm'
    quote: 'Although Mephibosheth himself ate daily as a guest at the king''s table, he had to make provision as a royal prince for the maintenance of his own family and servants'
  - where: 'note 9:10 “Food to eat”'
    claim: 'Ziba had probably farmed Saul’s land already'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/9.htm'
    quote: 'Ziba had fifteen sons and twenty servants (2 Samuel 9:10), with whom he had probably been living in Gibeah, Saul''s native place, and may perhaps have hitherto farmed Saul''s land.'
  - where: 'note 9:10 “Food to eat”'
    claim: 'Ziba was already in occupation of the land; the only change was who received the fruits'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/9.htm'
    quote: 'This arrangement suggests that Ziba was already in occupation of the land, so that the only change to him would be that Mephibosheth would now receive the fruits instead of David.'
  - where: 'note 9:10 “Food to eat”'
    claim: 'Ziba’s slander and Mephibosheth’s defense come later'
    key: bd-mephibosheth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/mephibosheth?lang=eng'
    quote: 'Ziba’s slander (16:1–4); his defense (19:24–28)'
  - where: 'note 9:11 “As one of the king''s sons”'
    claim: 'The Septuagint reads “did eat at the table of David”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_samuel/9.htm'
    quote: 'And Memphibosthe did eat at the table of David, as one of the sons of the king.'
  - where: 'note 9:11 “As one of the king''s sons”'
    claim: 'The Hebrew reads “at my table” with a participle “eating”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'שֻׁלְחָנִ֔/י'
  - where: christ
    claim: 'Divine ḥesed delivers from death and hell and reflects the Atonement'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'divine hesed is always an act of deliverance, but is of greater magnitude when it delivers man from death and hell, and as such reflects the understanding of the Atonement as described in latter-day scripture and revela'
  - where: christ
    claim: 'Those who experience God’s ḥesed are expected to do it; in doing it we do what God does'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'his expectation is that those who experience his hesed should do so as well. This in turn suggests that hesed is ultimately revealed to teach us how to act like a God. In other words, as we perform hesed we find ourselves doing the same things God does'
  - where: explore
    claim: 'Belnap’s study of ḥesed treats 1 Sam. 20 and 2 Sam. 9'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'This act was realized as he took Mephibosheth, Jonathan’s son, and brought him to his palace with this declaration'
  - where: thread
    claim: 'Mephibosheth seems to have lived in concealment at Lo-debar, east of the Jordan'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/9.htm'
    quote: 'He seems to have lived in concealment at Lo-debar.'
  - where: 'note 9:1 “For Jonathan''s sake”'
    claim: 'Doing ḥesed was recognized as a kingly trait'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'Following the establishment of Israel in the promised land, the enacting of hesed was recognized as a kingly trait.'
  - where: 'note 9:1 “For Jonathan''s sake”'
    claim: 'Between mortals, an act of ḥesed expects a reciprocal act'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'When performed by a mortal on behalf of another, a reciprocal act is expected at some later point.'
  - where: explore
    claim: 'Belnap carries ḥesed to the “sure mercies of David” of Isa. 55:3'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'in Isaiah 55:3 God promises to enact hesed by actually entering into a covenant as he did with David'
  - where: 'note 9:3 “The kindness of God”'
    claim: 'David, with his throne established, set out to keep his promise of ḥesed to Jonathan (1 Sam. 20:14–15)'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'These promises of complementary acts of hesed were fulfilled later. After David had established his throne, 2 Samuel 9:1, 7 mention David’s desire to remember his promise of hesed'
  - where: 'note 9:3 “Lame on his feet”'
    claim: 'The law (Lev. 19:14) forbids hindering or cursing the disabled; the Bible teaches care for them as a personal religious duty and ties it to David through 2 Sam. 9:3–7'
    key: calabro-disability
    url: 'https://rsc.byu.edu/covenant-compassion/disability-social-justice-ancient-israelite-culture'
    quote: 'the biblical text promotes the responsibility to care for those with disabilities as a personal religious expectation—not legislated, but inculcated as a cultural value. … It also includes the association of the popular hero David with compassion toward those with disabilities, as we see in 2 Samuel 5:8 and 2 Samuel 9:3–7.'
  - where: 'note 9:11 “As one of the king''s sons”'
    claim: 'The words “said the king” are supplied in the King James; the Hebrew has “my table” with no verb of saying'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/2_samuel/9-11.htm'
    quote: 'As for Mephibosheth, [said the king], he shall eat at my table, as one of the king''s sons.'
