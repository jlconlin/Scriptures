chapter: 1
claims:
  - where: setting
    claim: '1 and 2 Samuel are one book in the Hebrew Bible; the division follows the Greek Bible; the author and date are uncertain'
    key: bd-samuel-books
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel-books-of?lang=eng'
    quote: 'In the Hebrew Bible these books form one. Our division into two books follows the Greek Bible. … It is uncertain who the author was or when he wrote.'
  - where: setting
    claim: '2 Samuel 1–10: David becomes king of Judah, then of all Israel'
    key: ot-seminary-2-samuel-intro
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-samuel?lang=eng'
    quote: '2 Samuel 1–10 David becomes king, first of the tribe of Judah and then of all of Israel.'
  - where: setting
    claim: 'Ziklag: a city in the Negev, a Philistine city in Saul''s day, given by Achish to David'
    key: bd-ziklag
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ziklag?lang=eng'
    quote: 'A city in the Negev, originally assigned to Judah (Josh. 15:31) but transferred to Simeon (Josh. 19:5). It was a Philistine city in the days of Saul and was given by Achish to David (1 Sam. 27:6).'
  - where: setting
    claim: 'Ziklag''s site is not determined; if near Beersheba, Gilboa was 90–100 miles away as the crow flies, two or three days for a runner; the battle was about the time of David''s return'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/1.htm'
    quote: 'has not been determined. But if we may place it in the neighbourhood of Beersheba … the distance from the battle-field of Gilboa was about 90 or 100 miles as the crow flies, between two and three days’ journey for an active runner'

  - where: section 2 plain
    claim: '“Son of a stranger” rendered as the son of a resident foreigner'
    key: bd-stranger
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/stranger?lang=eng'
    quote: 'The word is frequently used to denote a man of non-Israelite birth, resident in the promised land with the permission of the Israelite authorities.'
  - where: section 3 plain
    claim: '“The beauty of Israel” rendered “Israel''s glory”: the noun means beauty, honour, here of Saul and Jonathan'
    key: bdb
    url: 'https://biblehub.com/hebrew/6643.htm'
    quote: 'I. צְבִי noun masculine2Samuel 1:19 beauty, honour; … ׳הַצּ 2 Samuel 1:19 (Saul and Jonathan)'
  - where: section 3 plain
    claim: 'Verse 18 rendered as an order to teach the song called “The Bow”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+1&version=NRSVUE'
    quote: '(He ordered that The Song of the Bow be taught to the people of Judah; it is written in the Book of Jashar.)'
  - where: section 3 plain
    claim: '“Publish it not” rendered “do not spread the good news”: the verb is to gladden with good tidings of a victory'
    key: bdb
    url: 'https://biblehub.com/hebrew/1319.htm'
    quote: '1 gladden with good tidings: birth of a son Jeremiah 20:15; victory 1 Samuel 31:9; 2 Samuel 1:20; 1 Chronicles 10:9; Psalm 68:12'

  - where: 'note 1:10 “Saul''s death, told twice”'
    claim: 'The Church''s footnote at “slew” sets this account beside 1 Sam. 31:4 and 1 Chr. 10:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/1?lang=eng'
    quote: '10a “slew”: 1 Sam. 31:4 (1–4); 1 Chr. 10:4 (4–5).'
  - where: 'note 1:10 “Saul''s death, told twice”'
    claim: 'The usual answer: the account is a fabrication; only the crown and bracelets are fact, found by a plunderer; he lied to ingratiate himself with David'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'There is no fact in the case but the bringing of the crown, or diadem, and bracelets of Saul; which, as he appears to have been a plunderer of the slain, he found on the field of battle; and he brought them to David, and told the lie of having despatched Saul, merely to ingratiate himself with David.'
  - where: 'note 1:10 “Saul''s death, told twice”'
    claim: 'The two accounts cannot be harmonized; the Amalekite''s story was a fabrication'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/1.htm'
    quote: 'This account of Saul’s death is obviously inconsistent with that given in 1 Samuel 31. It is useless to attempt to harmonize them, … The Amalekite’s story was clearly a fabrication.'

  - where: 'note 1:12 “They mourned, and wept, and fasted”'
    claim: 'Fasting was Israel''s response to sorrow and burial; David and the Israelites fasted and mourned over Saul'
    key: sc-knowhy-135
    url: 'https://scripturecentral.org/knowhy/why-did-fasting-and-prayer-accompany-nephite-mourning'
    quote: 'fasting was an Israelite religious and cultural response to incidents of sorrow, humiliation, solemnity, and burial. After recovering the body of King Saul from the Philistines, for example, the Israelites, including David, fasted and mourned over his death (1 Samuel 31:8–13; 2 Samuel 1:11–12).'
  - where: 'note 1:12 “They mourned, and wept, and fasted”'
    claim: 'The Church''s manual: David''s lament was sincere; he mourned rather than rejoiced at his enemy''s death'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'David’s lamentation over the death of Saul was sincere and deep. Instead of being grateful for the death of his most violent enemy, he truly mourned for the tragedy that had befallen Israel.'
  - where: 'note 1:12 “They mourned, and wept, and fasted”'
    claim: 'One LDS reading: David''s public grief could be read as political cunning or sincere bereavement'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'After Saul’s demise, David avenges the death of his predecessor and composes a song of lament mourning the fallen king. As in many aspects of David’s life, in his public displays of grief one could perceive political cunning or sincere bereavement.'

  - where: 'note 1:14 “Why David put the Amalekite to death”'
    claim: 'The footnote at “destroy” points to 2 Sam. 4:10, where David recalls the man'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/1?lang=eng'
    quote: '14a “destroy”: 2 Sam. 4:10.'
  - where: 'note 1:14 “Why David put the Amalekite to death”'
    claim: 'A stranger was frequently a man of non-Israelite birth resident in the land'
    key: bd-stranger
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/stranger?lang=eng'
    quote: 'The word is frequently used to denote a man of non-Israelite birth, resident in the promised land with the permission of the Israelite authorities.'

  - where: 'note 1:18 “The use of the bow”'
    claim: 'The Hebrew has only qešet, “bow,” with no words for “the use of”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'קָ֑שֶׁת'
  - where: 'note 1:18 “The use of the bow”'
    claim: 'A modern translation takes “the Bow” as the name of the song'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+1&version=NRSVUE'
    quote: '(He ordered that The Song of the Bow be taught to the people of Judah; it is written in the Book of Jashar.)'
  - where: 'note 1:18 “The use of the bow”'
    claim: 'The footnote suggests verse 18 appears to be a superscription like that of Psalm 60'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/1?lang=eng'
    quote: '18a “teach”: This verse appears to be a superscription like the one appearing at the beginning of Psalm 60.'

  - where: 'note 1:18 “The book of Jasher”'
    claim: 'The book of Jasher: an early collection of national songs and stories of valor, cited at Josh. 10:13 and 2 Sam. 1:18'
    key: bd-jasher
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jasher-book-of?lang=eng'
    quote: '(Josh. 10:13; 2 Sam. 1:18.) An early collection of Jewish national songs and stories of deeds of valor, put together about the time of Solomon.'
  - where: 'note 1:18 “The book of Jasher”'
    claim: 'The writer of Samuel used national poems (Hannah''s song, the lament for Abner, 2 Sam. 22; 23:1–7) and refers to the book of Jasher'
    key: bd-samuel-books
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samuel-books-of?lang=eng'
    quote: 'He also made use of various national and religious poems, which may have been preserved in writing or by oral tradition, such as Hannah’s song (1 Sam. 2:1–10); David’s lament for Abner (2 Sam. 3:33–34); David’s thanksgiving and his last words (2 Sam. 22; 23:1–7); see also the reference to the Book of Jasher (2 Sam. 1:18).'

  - where: 'note 1:20 “Tell it not in Gath”'
    claim: '“Publish” is the verb bāśar'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'תְּבַשְּׂר֖וּ'
  - where: 'note 1:20 “Tell it not in Gath”'
    claim: 'BDB lists bāśar for news of victory at 1 Sam. 31:9 and 2 Sam. 1:20, and for the Amalekite as a bearer of good tidings at 2 Sam. 4:10'
    key: bdb
    url: 'https://biblehub.com/hebrew/1319.htm'
    quote: '1 gladden with good tidings: birth of a son Jeremiah 20:15; victory 1 Samuel 31:9; 2 Samuel 1:20; 1 Chronicles 10:9; Psalm 68:12; היה כמבשׂר בעיניו he was in his eyes as a bearer of good tidings 2 Samuel 4:10.'
  - where: 'note 1:20 “Tell it not in Gath”'
    claim: 'Gath was Achish''s city, where David and his men lived (1 Sam. 27:2–3); the Philistines sent to publish the news (1 Sam. 31:9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/27?lang=eng'
    quote: 'And David arose, and he passed over with the six hundred men that were with him unto Achish, the son of Maoch, king of Gath.'

  - where: 'note 1:21 “As though he had not been anointed”'
    claim: 'The Hebrew of 1:21 has bᵉlî māšîaḥ, “not anointed”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'מָשִׁ֥יחַ'
  - where: 'note 1:21 “As though he had not been anointed”'
    claim: 'The same noun, māšîaḥ (H4899), is in “the LORD''s anointed” at 1:14'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'מְשִׁ֥יחַ'
  - where: 'note 1:21 “As though he had not been anointed”'
    claim: 'The Hebrew leaves open whether “anointed” belongs to the shield or Saul; most take it of the shield, oiled to polish or preserve it; but the word is used elsewhere of persons, in Samuel always of the king'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/1.htm'
    quote: 'leaves it uncertain whether the epithet anointed belongs to the shield or to Saul. (a) Most commentators understand it to refer to the shield, … Shields made of metal were oiled to polish them; those made of wood and leather, to preserve them … (b) On the other hand this term anointed is everywhere else applied to persons—in the books of Samuel always to the King'
  - where: 'note 1:21 “As though he had not been anointed”'
    claim: 'Cambridge: “vilely cast away” probably means defiled with blood and dust; the exact rendering “unanointed”; fields of offerings for Jehovah'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/1.htm'
    quote: 'Gilboa should no longer possess fruitful fields, to produce tithes and offerings for Jehovah. … (b) was defiled with blood and dust, of which the latter is probably right. … might be rendered exactly the shield of Saul unanointed with oil'
  - where: 'note 1:21 “As though he had not been anointed”'
    claim: 'A modern translation reads it of the shield'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+1&version=ESV'
    quote: 'For there the shield of the mighty was defiled, the shield of Saul, not anointed with oil.'
  - where: 'note 1:21 “As though he had not been anointed”'
    claim: 'Samuel anointed Saul (1 Sam. 10:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/10?lang=eng'
    quote: 'Then Samuel took a vial of oil, and poured it upon his head, and kissed him'

  - where: 'note 1:26 “Passing the love of women”'
    claim: 'David kept the covenant by seeking kindness for Saul''s house for Jonathan''s sake'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/9?lang=eng'
    quote: 'Is there yet any that is left of the house of Saul, that I may shew him kindness for Jonathan’s sake?'
  - where: 'note 1:26 “Passing the love of women”'
    claim: 'One older reading: the comparison with the love of women expresses the deepest devoted love'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/1.htm'
    quote: 'נפלאתה, third pers. fem., … to be wonderful or distinguished. אהבתך, thy love to me. Comparison to the love of woman is expressive of the deepest earnestness of devoted love.'
  - where: 'note 1:26 “Passing the love of women”'
    claim: 'Jonathan, the heir, loved David, who would take the throne'
    key: mickelsen-true-friendship
    url: 'https://www.churchofjesuschrist.org/study/ensign/2006/06/lessons-from-the-old-testament-true-friendship-and-self-respect?lang=eng'
    quote: 'Traditionally he would have been heir to the throne instead of David, so it would have been natural for him to see David as his enemy. Yet when David returned … the soul of Jonathan was knit with the soul of David'
  - where: 'note 1:26 “Passing the love of women”'
    claim: 'Jonathan''s friendship was one of loyalty and self-sacrifice'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'Jonathan, whose friendship is characterized by exquisite loyalty and self-sacrifice (chap. 18).'

  - where: christ
    claim: 'One older reading, quoting O. v. Gerlach, sets David''s mourning for Saul beside Christ weeping over Jerusalem'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/1.htm'
    quote: '"The only deep mourning for Saul, with the exception of that of the Jabeshites (1 Samuel 31:11), proceeded from the man whom he had hated and persecuted for so many years even to the time of his death; just as David''s successor wept over the fall of Jerusalem, even when it was about to destroy Himself" (O. v. Gerlach).'
  - where: christ
    claim: 'Jesus wept over Jerusalem; He taught love of enemies'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/19?lang=eng'
    quote: 'And when he was come near, he beheld the city, and wept over it'

  - where: explore
    claim: 'The footnote at verse 23 points to D&C 135:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/1?lang=eng'
    quote: '23a “divided”: D&C 135:3.'
