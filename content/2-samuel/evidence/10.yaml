chapter: 10
claims:
  - where: setting
    claim: 'The Ammonites descended from Lot, lived east of Gilead, claimed Gilead in the Judges, were repulsed by Jephthah and Saul, and were subdued by David'
    key: bd-ammon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ammon?lang=eng'
    quote: 'A tribe descended from Lot, the nephew of Abraham (Gen. 19:38; Deut. 2:19); … settled east of Mount Gilead, from the Jabbok southwards, and in the time of the Judges laid claim to the Israelite settlements in Gilead (Judg. 11) but were repulsed by Jephthah and again by Saul (1 Sam. 11) and finally reduced to subjection by David (2 Sam. 10; 11:1; 12:9, 26, 31).'
  - where: setting
    claim: 'One older reading: this Nahash is the king Saul defeated at Jabesh; the kindness to David is not told, most likely help during his flight from Saul'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/10.htm'
    quote: 'We are not told in what the love shown to David by Nahash consisted. He had most likely rendered him some assistance during the time of his flight from Saul. Nahash was no doubt the king of the Ammonites mentioned in 1 Samuel 11:1, whom Saul had smitten at Jabesh.'
  - where: setting
    claim: 'Another older reading: forty years had passed, so this Nahash was probably the son or grandson of the king Saul defeated'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/10.htm'
    quote: 'Forty years at least had passed since the events of 1 Samuel 11, so that this Nahash was probably the son or grandson of the king defeated by Saul at Jabesh.'
  - where: setting
    claim: 'The Ammonite war is mentioned in 8:12; the Syrian war here is probably the one summarized in 8:3–6'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/10.htm'
    quote: 'The war with the Ammonites is incidentally alluded to in ch. 2 Samuel 8:12 among David’s other wars; and the war with the Syrians to which it led is not improbably the same as that recorded in ch. 2 Samuel 8:3-6.'
  - where: setting
    claim: 'Chronicles tells the same war (1 Chr. 19)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/10?lang=eng'
    quote: '1a “Ammon”: 1 Chr. 19:1 (1–19).'
  - where: thread
    claim: 'The war is told in detail because it leads up to David''s fall'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/10.htm'
    quote: 'This war with the Ammonites is described in detail, because of its close connexion with that act, which marked the fatal turning-point in David’s reign.'
  - where: thread
    claim: 'David''s sin took place during this war, while Joab besieged the Ammonite capital and David stayed in Jerusalem'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/10.htm'
    quote: 'This took place during the war with the Ammonites and Syrians, when Joab was besieging the capital of the Ammonites, after the defeat and subjugation of the Syrians (2 Samuel 10), and when David had remained behind in Jerusalem (2 Samuel 11:1).'
  - where: thread
    claim: 'Messengers stand for the one who sent them, so the insult was against David'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'In this case, the messengers are not individuals acting of their own accord but represent the one who sent them, and any action taken against them or on their behalf symbolically reflects on the sender. Thus inhospitality against them is inhospitality against David.'
  - where: thread
    claim: 'Joab and Abishai fought the LORD''s battles for His cities'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/10.htm'
    quote: 'They were fighting “the Lord’s battles,” that these cities might not fall into heathen hands and be given over to the worship of heathen gods.'
  - where: section 2 plain
    claim: 'Ish-tob is Hebrew “men of Tob”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/10?lang=eng'
    quote: '6a “Ish-tob”: HEB Men of Tob (a land mentioned in Judg. 11:3).'
  - where: section 2 plain
    claim: 'Chronicles renders “stank before David” as “made themselves odious to David”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/19?lang=eng'
    quote: 'And when the children of Ammon saw that they had made themselves odious to David'
  - where: section 2 plain
    claim: '“Play the men” is literally “be strong and let us show ourselves strong”'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/10.htm'
    quote: '12. Be of good courage, and let us play the men] Lit. Be strong and let us shew ourselves strong'
  - where: 'note 10:2 “Kindness between kings”'
    claim: 'David used hesed in his political relationships: with Jabesh-gilead, with Hanun, and in his charge to Solomon about Barzillai'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'Like Saul, David also used hesed in his political relationships. … In 2 Samuel 10:2, David, upon hearing of the death of Nahash, his Ammonite contemporary, wished to offer condolences and congratulations to Hanun, Nahash’s son: “I will perform hesed (shew kindness) unto Hanun the son of Nahash, as his father performed hesed (shewed kindness) unto me.'
  - where: 'note 10:2 “Kindness between kings”'
    claim: 'Hesed is something one does; the KJV renders it with many words; it embodies how Israel was to act and the nature of God'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'the KJV providing no less than fifteen different terms to signify the presence of hesed in the text, the most common being mercy, kindness, and loving-kindness.[2] Yet the principle of hesed may be one of the most important doctrinal concepts in the Old Testament'
  - where: 'note 10:2 “Kindness between kings”'
    claim: 'Hesed is often a matter of one act answering another (Abimelech''s oath with Abraham)'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'but according to the hesed (kindness) that I have done unto thee, thou shalt do unto me, and to the land wherein thou hast sojourned'
  - where: 'note 10:4 “Half a beard and cut garments”'
    claim: 'The Ammonites ritually humiliated the messengers; messengers represent their sender, so the insult was to David'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'Upon their arrival, the counselors of the new king recommend ritually humiliating the messengers, which they do by shaving off half of their beards and cutting their clothing down to the waist and sending them away.'
  - where: 'note 10:4 “Half a beard and cut garments”'
    claim: 'Messengers are extensions of the sender (Belnap quoting Greene and Niditch)'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: '“Messengers are ‘extensions’ of one’s power and will.” See also Susan Niditch, … “The action of the Ammonites incenses King David, for the emissaries are an extension of his person and his power'
  - where: 'note 10:6 “They stank before David”'
    claim: 'The verb means to smell bad, and figuratively to be offensive'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/887.htm'
    quote: 'A primitive root; to smell bad; figuratively, to be offensive morally'
  - where: 'note 10:6 “They stank before David”'
    claim: 'Chronicles: they had made themselves odious, and hired chariots and horsemen with a thousand talents of silver'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/19?lang=eng'
    quote: 'And when the children of Ammon saw that they had made themselves odious to David, Hanun and the children of Ammon sent a thousand talents of silver to hire them chariots and horsemen out of Mesopotamia, and out of Syria-maachah, and out of Zobah.'
  - where: 'note 10:12 “Let us play the men”'
    claim: 'The Hebrew is the verb “be strong” twice: a command and then “let us show ourselves strong”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'חֲזַ֤ק'
  - where: 'note 10:12 “Let us play the men”'
    claim: 'Literally “be strong and let us shew ourselves strong”; Chronicles “behave ourselves valiantly”; the cities are the LORD''s; the last clause is trust with resignation, compare 1 Sam. 3:18'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/10.htm'
    quote: 'As the people of Israel were the people of the Lord, so the land which He had given them was His, and its cities were His. … an expression of trust combined with resignation to God’s will. Cp. 1 Samuel 3:18.'
  - where: 'note 10:12 “Let us play the men”'
    claim: 'Chronicles words Joab''s speech “let us behave ourselves valiantly … let the Lord do that which is good in his sight”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/19?lang=eng'
    quote: 'Be of good courage, and let us behave ourselves valiantly for our people, and for the cities of our God: and let the Lord do that which is good in his sight.'
  - where: 'note 10:12 “Let us play the men”'
    claim: 'One older reading renders the last clause as a statement, “Jehovah will do”'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/10.htm'
    quote: 'Better, Jehovah will do'
  - where: 'note 10:14 “Into the city”'
    claim: 'Rabbah was the Ammonite chief city, taken by David (11:1; 12:26–29); later Philadelphia, modern Amman'
    key: bd-rabbah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rabbah?lang=eng'
    quote: '(2) Chief city of the Ammonites, in the deep fertile valley of the Upper Jabbock (Deut. 3:11; Josh. 13:25); taken by David (2 Sam. 11:1; 12:26–27, 29; 17:27; 1 Chr. 20:1)'
  - where: 'note 10:14 “Into the city”'
    claim: 'Rabbah''s ruins are at modern Amman'
    key: bd-rabbah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rabbah?lang=eng'
    quote: 'There are still extensive ruins at the modern Amman.'
  - where: 'note 10:14 “Into the city”'
    claim: 'The Ammonites were finally subdued by David in the war of 10–12'
    key: bd-ammon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ammon?lang=eng'
    quote: 'finally reduced to subjection by David (2 Sam. 10; 11:1; 12:9, 26, 31)'
  - where: 'note 10:18 “Seven hundred chariots, or seven thousand”'
    claim: 'Chronicles has seven thousand chariots and forty thousand footmen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/19?lang=eng'
    quote: 'But the Syrians fled before Israel; and David slew of the Syrians seven thousand men which fought in chariots, and forty thousand footmen, and killed Shophach the captain of the host.'
  - where: 'note 10:18 “Seven hundred chariots, or seven thousand”'
    claim: 'Chronicles has thirty-two thousand chariots for the hired army of 10:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/19?lang=eng'
    quote: 'So they hired thirty and two thousand chariots, and the king of Maachah and his people; who came and pitched before Medeba.'
  - where: 'note 10:18 “Seven hundred chariots, or seven thousand”'
    claim: 'The Student Manual gives 2 Sam. 10:18 and 1 Chr. 19:18 as an example of numbers hard to transmit, with extra noughts added'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: 'numbers were peculiarly difficult to transmit accurately. We have instances of extra noughts being added to a number: 2 Samuel 10:18 reads ‘700 chariots’, 1 Chronicles 19:18 reads ‘7,000’.'
  - where: 'note 10:18 “Seven hundred chariots, or seven thousand”'
    claim: 'One older reading: keep seven hundred chariots and read footmen with Chronicles; some further corruption likely'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/10.htm'
    quote: 'It seems best to retain the reading seven hundred chariots, and follow Chronicles in reading footmen. But the omission of horsemen in the one and footmen in the other makes it likely that there is some further corruption.'
  - where: christ
    claim: 'In Matthew 25:40, via substitution, hospitality lies at the heart of the disciple''s relationship with Christ'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'The reader is told that though the true disciple may not have done these things to Christ directly, doing them for others is the same as doing them unto Christ … Thus, via substitution, hospitality lies at the heart of the disciple’s relationship with Christ. [8]'
  - where: christ
    claim: 'The 2 Samuel 10 case is Belnap''s endnote 8 to that point: the relationship between substitution and hospitality'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: '[8] The relationship between substitution and hospitality is also found in 2 Samuel 10, with the death of the Ammonite king, in which David sends two servants as a sign of respect to the newly appointed king, Hanun.'
  - where: christ
    claim: 'John 13:20: the disciple sent represents Christ, as Christ represents the Father'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'The anonymity of the one doing the “receiving” can now speak to both the missionary experience, as the disciple will represent Christ, and to the immediate situation of the Last Supper, in which Christ represents the Father.'
  - where: christ
    claim: 'D&C 99:2 to John Murdock: who receives you receives me'
    key: belnap-dust-feet
    url: 'https://rsc.byu.edu/our-rites-worship/those-who-receive-you-not-rite-wiping-dust-off-feet'
    quote: 'Our next Doctrine and Covenants reference concerning this rite was recorded in August of 1832 in a revelation given to John Murdock, who is told prior to his missionary labors: “And who receiveth you receiveth me'
  - where: explore
    claim: 'Belnap''s study of hesed through the Old Testament'
    key: belnap-hesed
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/how-excellent-thy-lovingkindness'
    quote: 'by studying the hesed references within their contexts and discerning the pattern in which this gospel principle is revealed, we can recognize its importance'
