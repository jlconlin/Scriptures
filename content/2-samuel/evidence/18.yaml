chapter: 18
claims:
  - where: setting
    claim: 'Absalom stole the hearts of Israel; the conspiracy was strong; David fled over the Kidron and up Olivet weeping'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/15?lang=eng'
    quote: 'so Absalom stole the hearts of the men of Israel. … And the conspiracy was strong; for the people increased continually with Absalom. … And David went up by the ascent of mount Olivet, and wept as he went up'
  - where: setting
    claim: 'Hushai''s counsel prevailed; Ahithophel hanged himself; David came to Mahanaim; Absalom crossed Jordan with Amasa as captain and camped in Gilead; Barzillai and others fed David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/17?lang=eng'
    quote: 'Then David came to Mahanaim. And Absalom passed over Jordan, he and all the men of Israel with him. And Absalom made Amasa captain of the host instead of Joab … So Israel and Absalom pitched in the land of Gilead.'
  - where: setting
    claim: 'The flight from Absalom gave occasion to Psalms 63 and 3, among others'
    key: bd-david
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/david?lang=eng'
    quote: 'The flight from Absalom led to the composition of Ps. 63 (written immediately after he left the city), 3 and 4 (which are morning and evening hymns), 26, 62, 27, and 28.'
  - where: setting
    claim: 'The delay gave David time to gather an army and receive supplies from east of the Jordan'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'Absalom’s delay to gather a larger army provided David with enough time to prepare for the coming battle. He gathered the people who were loyal to him into a formidable army of his own, received supplies from those east of the Jordan (see 2 Samuel 17:27–29)'
  - where: setting
    claim: 'The next chapter opens with David mourning and Joab''s rebuke that he had shamed his servants who saved his life'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/19?lang=eng'
    quote: 'Behold, the king weepeth and mourneth for Absalom. … Thou hast shamed this day the faces of all thy servants, which this day have saved thy life'
  - where: thread
    claim: 'The family feuds that ended in Absalom''s rebellion are read by the Bible Dictionary as the fulfillment of Nathan''s sentence'
    key: bd-david
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/david?lang=eng'
    quote: 'There were constant family feuds, which, in the case of Absalom and Adonijah, ended in open rebellion. These incidents are a fulfillment of the pronouncement of Nathan the prophet upon David, because of his sin (2 Sam. 12:7–13).'
  - where: section 1 plain
    claim: 'The people asked David to stay in the city ready to help them from there'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/18.htm'
    quote: 'David was to stay behind in the city with a reserve, that he might be able to come to their relief in case of need.'
  - where: section 3 plain
    claim: '"Every one to his tent" means to his home'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/18.htm'
    quote: 'fled every one to his tent] To his home. The use of the word tent is a relic of primitive nomad life.'
  - where: section 3 plain
    claim: '"Place" in verse 18 may be rendered "monument"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/18?lang=eng'
    quote: '18c “place”: OR monument.'
  - where: section 4 plain
    claim: '"Cushi" is better rendered "the Cushite"'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/18.htm'
    quote: '21. Cushi] Rather, the Cushite, an Ethiopian slave in Joab’s service, who would have little to lose by the king’s displeasure.'
  - where: 'note 18:8 “The forest and the sword”'
    claim: 'Ahithophel had counselled twelve thousand men at once; Hushai''s delay won'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'Hushai saved the situation for David, first, by convincing Absalom that a delay while he gathered more strength to his army would be wise … Twelve thousand men against the small band who had fled with David would have been a disaster for David.'
  - where: 'note 18:8 “The forest and the sword”'
    claim: 'The delay gave David time to gather an army, take supplies, and choose favorable terrain'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'received supplies from those east of the Jordan (see 2 Samuel 17:27–29), and chose a site where the terrain would work in his favor (see 2 Samuel 18:8).'
  - where: 'note 18:8 “The forest and the sword”'
    claim: 'One older reading: the wooded region was full of ravines and precipices into which the fleeing army was pursued'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/18.htm'
    quote: 'The woody region was most likely full of ravines, precipices, and marches, into which the flying foe was pursued, and where so many perished.'
  - where: 'note 18:8 “The forest and the sword”'
    claim: 'Ahithophel urged pursuit that night with twelve thousand men while David was weary'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/17?lang=eng'
    quote: 'Let me now choose out twelve thousand men, and I will arise and pursue after David this night: … I will come upon him while he is weary and weak handed'
  - where: 'note 18:9 “Between the heaven and the earth”'
    claim: 'Deuteronomy calls a hanged man accursed; the Absalom narrative''s phrase may illuminate that'
    key: belnap-fell-tree
    url: 'https://rsc.byu.edu/they-shall-grow-together/they-did-fell-tree'
    quote: 'The Absalom narrative also provides a detail that may provide some insight into the “accursed” characteristic associated with the hanging legislation, namely the explicit observation that he was “taken up between the heaven and the earth” (2 Samuel 18:9).'
  - where: 'note 18:9 “Between the heaven and the earth”'
    claim: 'Neither on earth nor in heaven: hanging may have indicated a cursed state and that the person no longer belongs'
    key: belnap-fell-tree
    url: 'https://rsc.byu.edu/they-shall-grow-together/they-did-fell-tree'
    quote: 'it is possible that hanging indicated one’s cursed state, both in terms of the humiliation and now by placing the person in liminal space, or at least indicating via hanging that the person is no longer defined by “place,” that is, that the person no longer belongs.'
  - where: 'note 18:9 “Between the heaven and the earth”'
    claim: 'Absalom''s and Ahithophel''s hangings follow rebellion against the ruler; hanging may have punished political rebellion'
    key: belnap-fell-tree
    url: 'https://rsc.byu.edu/they-shall-grow-together/they-did-fell-tree'
    quote: 'Like the Absalom narrative (in which Absalom himself will be hung), the Esther narratives, and the Egyptian hangings, the Ahithophel narrative treats hanging as an act that comes after one has sought to overthrow … hanging may have been specifically used as a means of punishment and execution for the political act of rebellion.'
  - where: 'note 18:9 “Between the heaven and the earth”'
    claim: 'Absalom''s hair was famous'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/14?lang=eng'
    quote: 'And when he polled his head, (for it was at every year’s end that he polled it: because the hair was heavy on him, therefore he polled it:)'
  - where: 'note 18:14 “Joab against the king''s word”'
    claim: 'Joab is the calculating commander who kills Absalom despite David''s command to deal gently'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'David manifests paternal love in commanding his military leaders to “deal gently” with his son (18:5). When the calculating Joab kills Absalom despite David’s injunctions, the king weeps'
  - where: 'note 18:14 “Joab against the king''s word”'
    claim: 'Joab, David''s ruthless commander and nephew, arranged Absalom''s return'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'His resourceful and ruthless military commander and nephew, Joab, arranges for Absalom’s return, but the beautiful Absalom conspires against his father'
  - where: 'note 18:14 “Joab against the king''s word”'
    claim: 'The family feuds ending in Absalom''s rebellion fulfill Nathan''s pronouncement'
    key: bd-david
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/david?lang=eng'
    quote: 'His sin with Bathsheba was followed by a series of misfortunes that marred the last 20 years of his life. … There were constant family feuds, which, in the case of Absalom and Adonijah, ended in open rebellion. These incidents are a fulfillment of the pronouncement of Nathan the prophet upon David, because of his sin'
  - where: 'note 18:14 “Joab against the king''s word”'
    claim: 'Joab sent the woman of Tekoa and brought Absalom back to Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/14?lang=eng'
    quote: 'So Joab arose and went to Geshur, and brought Absalom to Jerusalem.'
  - where: 'note 18:18 “A pillar and a heap of stones”'
    claim: 'Absalom''s three sons must have died young'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/18.htm'
    quote: 'I have no son] His three sons (ch. 2 Samuel 14:27) must have all died young.'
  - where: 'note 18:18 “A pillar and a heap of stones”'
    claim: 'The sons'' names are not given, against custom, probably because they died in infancy'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/14.htm'
    quote: 'Contrary to general usage, the names of the sons are not given, in all probability for no other reason than because they died in infancy. Consequently, as Absalom had no sons, he afterwards erected a pillar to preserve his name (2 Samuel 18:18).'
  - where: 'note 18:18 “A pillar and a heap of stones”'
    claim: 'The heap of stones was a monument of shame like those over Achan and the king of Ai'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/18.htm'
    quote: '17. a very great heap of stones] A monument of shame over the rebel’s grave, as over that of Achan (Joshua 7:26), and the king of Ai (Joshua 8:29).'
  - where: 'note 18:18 “A pillar and a heap of stones”'
    claim: 'The narrator intends the contrast between the pillar and the heap of stones'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/18.htm'
    quote: 'The historian evidently intends to mark the contrast between this splendid cenotaph, and the heap of stones which marked the rebel’s grave in the forest of Ephraim.'
  - where: 'note 18:18 “A pillar and a heap of stones”'
    claim: 'Three sons were born to Absalom (14:27); the footnote at 18:18 points there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/18?lang=eng'
    quote: '18b “son”: 2 Sam. 14:27.'
  - where: 'note 18:29 “Two runners”'
    claim: 'The word means bearing good tidings; Joab spared Ahimaaz the thankless task'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/18.htm'
    quote: '20. bear tidings] The word with rare exceptions means to bear good tidings, and this meaning should be retained here and in 2 Samuel 18:19. Joab would not let Ahimaaz have the thankless task of carrying news which to the king would be no good news.'
  - where: 'note 18:29 “Two runners”'
    claim: 'Cushi is the Cushite, an Ethiopian in Joab''s service with little to lose'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/18.htm'
    quote: '21. Cushi] Rather, the Cushite, an Ethiopian slave in Joab’s service, who would have little to lose by the king’s displeasure.'
  - where: 'note 18:29 “Two runners”'
    claim: 'David judged that Joab would not send a distinguished messenger with bad news'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/18.htm'
    quote: '27. He is a good man, &c.] The king rightly judged, that Joab would not choose a distinguished messenger like Ahimaaz to carry bad news (2 Samuel 18:20).'
  - where: 'note 18:29 “Two runners”'
    claim: 'Ahimaaz probably took the longer but easier route by the Jordan valley'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/18.htm'
    quote: 'But in all probability what is meant is that Ahimaaz struck down into the Jordan valley, and ran by a longer but easier route to Mahanaim, while the Cushite took the direct but more difficult route over the hills.'
  - where: 'note 18:29 “Two runners”'
    claim: 'Ahimaaz spoke as if sent off before Absalom''s fate was known'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/18.htm'
    quote: 'Ahimaaz spoke as if he had been sent off before Absalom''s fate had been decided or could be known.'
  - where: 'note 18:29 “Two runners”'
    claim: 'Ahimaaz was the son of Zadok the priest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/15?lang=eng'
    quote: 'The king said also unto Zadok the priest, Art not thou a seer? return into the city in peace, and your two sons with you, Ahimaaz thy son'
  - where: 'note 18:29 “Two runners”'
    claim: 'Ahimaaz had carried Hushai''s news to David before'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/17?lang=eng'
    quote: 'Now Jonathan and Ahimaaz stayed by En-rogel; for they might not be seen to come into the city: and a wench went and told them; and they went and told king David.'
  - where: 'note 18:33 “O my son Absalom”'
    claim: 'David''s lament may show why God called him a man after his own heart; latter-day scripture shows God grieving (Moses 7:28–33)'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'David’s moving response may offer one glimpse into why God had called David “a man after his own heart” (1 Samuel 13:14). Latter-day scripture reveals God as the kind of parent who similarly experiences grief for mortal pain and sorrow, even when it results from human rejection of divine invitations (Moses 7:28–33).'
  - where: 'note 18:33 “O my son Absalom”'
    claim: 'It appears Ahimaaz wished to cushion the blow, to no avail; the tragedy was long in the making; what David would have given was needed much sooner'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'It appears that Ahimaaz, the priestly son of Zadok, wished to cushion the blow of the bad news to the king that his son was dead; but it was to no avail, for tragedy had been in the making for a long time in the lives of David and Absalom … What David would have given at the climax to have voided the process would have been needed much sooner.'
  - where: 'note 18:33 “O my son Absalom”'
    claim: 'The next chapter: victory turned to mourning, Joab''s rebuke'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/19?lang=eng'
    quote: 'And the victory that day was turned into mourning unto all the people: for the people heard say that day how the king was grieved for his son.'
  - where: christ
    claim: 'Latter-day scripture reveals God grieving as a parent even over those who reject him (Moses 7:28–33)'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'Latter-day scripture reveals God as the kind of parent who similarly experiences grief for mortal pain and sorrow, even when it results from human rejection of divine invitations (Moses 7:28–33).'
  - where: christ
    claim: 'No one has traveled beyond the reach of divine love or Christ''s Atonement'
    key: holland-laborers
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/04/the-laborers-in-the-vineyard?lang=eng'
    quote: 'or however far from home and family and God you feel you have traveled, I testify that you have not traveled beyond the reach of divine love. It is not possible for you to sink lower than the infinite light of Christ’s Atonement shines.'
  - where: explore
    claim: 'The flight from Absalom gave occasion to Psalms 3 and 63'
    key: bd-david
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/david?lang=eng'
    quote: 'The flight from Absalom led to the composition of Ps. 63 (written immediately after he left the city), 3 and 4'
  - where: explore
    claim: 'A study of hanging in scripture, from Absalom to Zemnarihah, in They Shall Grow Together'
    key: belnap-fell-tree
    url: 'https://rsc.byu.edu/they-shall-grow-together/they-did-fell-tree'
    quote: 'It is in this context of hanging as a rite of excommunication that we may be able to situate the hanging of Zemnarihah, the Gadianton pseudo-governor.'
