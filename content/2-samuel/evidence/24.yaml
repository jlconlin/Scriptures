chapter: 24
claims:
  - where: when
    claim: '“Again” refers to the famine of ch. 21; several signs place the chapter in the later years of David’s reign'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/24.htm'
    quote: 'There is no definite note of time to shew when the events here recorded took place, but several indications point to the later years of David’s reign. (a) The language of 2 Samuel 24:1, “again the anger of the Lord was kindled against Israel” evidently refers to the famine'

  - where: setting
    claim: 'No date; signs of the later reign: “again” looks to the famine; ten months of counting only in peace; Chronicles follows the purchase with the temple preparations'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/24.htm'
    quote: '(b) It would have been impossible for the commander-in-chief to spend nearly ten months in taking the census, except at a time of permanent peace. (c) David’s preparations for building the Temple, which occupied the last years of his reign, are narrated in Chronicles as the immediate sequel of his purchase of Araunah’s threshing-floor.'
  - where: setting
    claim: 'Chronicles retells it with Satan, different totals, three years of famine, six hundred shekels of gold, and names the place the house of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: 'And Satan stood up against Israel, and provoked David to number Israel. … Either three years’ famine … So David gave to Ornan for the place six hundred shekels of gold by weight.'
  - where: setting
    claim: 'Gad, the seer, a prophet and faithful adviser of David from 1 Sam. 22:5'
    key: bd-gad
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gad?lang=eng'
    quote: '(2) The seer. A prophet and faithful friend and adviser of David (1 Sam. 22:5; 2 Sam. 24:11–19; 1 Chr. 21:9–19).'

  - where: thread
    claim: 'The census is among the places where the Lord seems to react harshly, yet the narrative shows God’s loyalty to David'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'Tensions regarding the nature of David’s God arise when the Lord … ostensibly reacts harshly to David’s census (24:1–25). Yet the persistent thread of the narrative reveals God’s loyalty to David and his descendants.'
  - where: thread
    claim: 'Solomon built the temple on Moriah in the place David prepared at the threshing floor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/3?lang=eng'
    quote: 'Then Solomon began to build the house of the Lord at Jerusalem in mount Moriah, where the Lord appeared unto David his father, in the place that David had prepared in the threshingfloor of Ornan the Jebusite.'

  - where: 'note 24:1 “Who moved David, the LORD or Satan?”'
    claim: 'Chronicles names Satan as the one who provoked David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: 'And Satan stood up against Israel, and provoked David to number Israel.'
  - where: 'note 24:1 “Who moved David, the LORD or Satan?”'
    claim: 'The footnote: apparently something is missing; Satan should be the antecedent of “he”; there is no JST change here'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/24?lang=eng'
    quote: '1a “he”: Apparently something is missing, and “Satan” should be the antecedent of “he.” See 1 Chr. 21:1.'
  - where: 'note 24:1 “Who moved David, the LORD or Satan?”'
    claim: '“Again” refers to the famine of ch. 21; the nation had sinned; the sin was the people’s as well as David’s'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/24.htm'
    quote: 'The previous manifestation of God’s anger referred to was the famine (ch. 21). … But it is clear from 2 Samuel 24:1 that the sin was the sin of the people as well as of David.'

  - where: 'note 24:3 “Why was the census a sin?”'
    claim: 'In Chronicles Joab asks why David will be a cause of trespass to Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: 'why then doth my lord require this thing? why will he be a cause of trespass to Israel?'
  - where: 'note 24:3 “Why was the census a sin?”'
    claim: 'Counting in itself was not sinful; the text marks it a sin by v. 1, Joab in v. 3, and David in v. 10'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/24.htm'
    quote: 'The mere taking of a census, as a measure that would facilitate the general organization of the kingdom, could not in itself be a sinful act … in 2 Samuel 24:3 Joab seeks to dissuade the king from it as being a wrong thing; and in 2 Samuel 24:10 David himself admits that it was a grievous sin'
  - where: 'note 24:3 “Why was the census a sin?”'
    claim: 'Keil rejects the atonement-money explanation: that law concerned enrolment in the army of Jehovah, and David’s census was political'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/24.htm'
    quote: 'for the Mosaic instructions concerning the atonement money had reference to the incorporation of the people into the army of Jehovah (see at Exodus 30:13-14), and therefore did not come into consideration at all in connection with the census appointed by David as a purely political measure.'
  - where: 'note 24:3 “Why was the census a sin?”'
    claim: 'The census was connected with military organization; the kernel of the sin was self-exaltation, seeking strength in numbers'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/24.htm'
    quote: 'The true kernel of David''s sin was to be found, no doubt, in self-exaltation, inasmuch as he sought for the strength and glory of his kingdom in the number of the people and their readiness for war.'
  - where: 'note 24:3 “Why was the census a sin?”'
    claim: 'A commentary quoted in the Student Manual: David, slackening in piety, meant to extend his dominions without divine counsel'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'David, in all probability, slackening in his piety and confidence toward God, and meditating some extension of his dominions without the Divine counsel or command, was naturally curious to know whether the number of fighting men in his empire was sufficient'

  - where: 'note 24:9 “One million three hundred thousand”'
    claim: 'Chronicles’ totals for Israel and Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: 'And all they of Israel were a thousand thousand and an hundred thousand men that drew sword: and Judah was four hundred threescore and ten thousand men that drew sword.'
  - where: 'note 24:9 “One million three hundred thousand”'
    claim: 'The manual takes David’s census as its example of parallel accounts that differ'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: 'Sometimes parallel accounts use significantly different numbers. (For example, 1 Chronicles 21:5 records that David’s census counted a total of 1,570,000 men of military age. In 2 Samuel 24:9 the total given is only 1,300,000.)'
  - where: 'note 24:9 “One million three hundred thousand”'
    claim: '1,300,000 men would imply five million people, nearly twice the density of the most crowded European countries'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: '1,300,000 men of military age would imply at least five million inhabitants, which, for Palestine, would mean nearly twice as many people to the square mile as in the most thickly populated countries of modern Europe.'
  - where: 'note 24:9 “One million three hundred thousand”'
    claim: '’lp could mean “armed man” as well as “thousand”'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: '“Not realizing that ’lp in one case meant ‘armed man’ and in the other ‘thousand’, this was tidied up to read 59,300.'
  - where: 'note 24:9 “One million three hundred thousand”'
    claim: 'Added noughts and a misread ’lp account for both texts; an original of 120,000 men, a population near half a million'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: 'can be accounted for by recognizing at different stages in transmission, first, the addition of noughts, and then, a misunderstanding of ’lp. … If the original figures totalled 120,000 men of military age, together with 100 professional soldiers, the entire population would have been nearly half a million'
  - where: 'note 24:9 “One million three hundred thousand”'
    claim: 'Offered as a method that resolves a large proportion of the difficulties'
    key: ot-manual-large-numbers
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/enrichment-section-e-the-problem-of-large-numbers-in-the-old-testament?lang=eng'
    quote: '“By the use of these methods a very large proportion of the numerical difficulties can be resolved.”'

  - where: 'note 24:11 “Gad, David’s seer”'
    claim: 'Gad: prophet, friend and adviser of David; wrote a book of David’s acts; helped arrange the music of the house of God'
    key: bd-gad
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gad?lang=eng'
    quote: 'A prophet and faithful friend and adviser of David (1 Sam. 22:5; 2 Sam. 24:11–19; 1 Chr. 21:9–19). He wrote a book of the acts of David (1 Chr. 29:29) and assisted in the arrangement of the music of the house of God (2 Chr. 29:25).'
  - where: 'note 24:11 “Gad, David’s seer”'
    claim: 'Gad is called both prophet and seer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/24?lang=eng'
    quote: 'For when David was up in the morning, the word of the LORD came unto the prophet Gad, David’s seer, saying,'

  - where: 'note 24:14 “Why David chose the pestilence”'
    claim: 'War puts the nation at its enemies’ mercy; famine makes it dependent on grain-sellers; only pestilence comes directly from God'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/24.htm'
    quote: 'War would place the nation at the mercy of its enemies: famine would make it dependent on corn-merchants, who might greatly aggravate the miseries of scarcity: only in the pestilence—some form of plague sudden and mysterious in its attack, and baffling the medical knowledge of the time—would the punishment come directly from God'
  - where: 'note 24:14 “Why David chose the pestilence”'
    claim: 'Chronicles has three years of famine'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: 'Either three years’ famine; or three months to be destroyed before thy foes'
  - where: 'note 24:14 “Why David chose the pestilence”'
    claim: 'The Septuagint also has three; the agreement of the threes favours seven, the three being suspected of conforming'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/24.htm'
    quote: 'Instead of seven years of famine, we find three years in the Chronicles; the Septuagint has also the number three in the passage before us … But this agreement favours the seven rather than the three, which is open to the suspicion of being intentionally made to conform to the rest.'


  - where: 'note 24:17 “These sheep”'
    claim: 'The shepherd image recurs in David’s story; shepherd and king joined; Ezekiel 34 builds on it; Jesus as Good Shepherd fulfills it'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'The image of David as shepherd recurs throughout the Samuel-Kings narrative. … showing the connection between a shepherd and a king in Israel’s imagination. This imagery forms the basis of hope in Ezekiel’s prophecy … When Jesus comes as the Good Shepherd, he fulfills this messianic expectation of a king who feeds and cares for his people'
  - where: 'note 24:17 “These sheep”'
    claim: 'David asks that the hand be against him and his father’s house, not the sheep'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/24?lang=eng'
    quote: 'but these sheep, what have they done? let thine hand, I pray thee, be against me, and against my father’s house.'

  - where: 'note 24:18 “The threshing floor that became the temple”'
    claim: 'The temple’s location was given by revelation when the Lord saved Israel from destruction'
    key: madsen-solomons-temple
    url: 'https://rsc.byu.edu/eye-faith/solomons-temple-compared-salt-lake-temple'
    quote: 'Even the location for the temple was given by revelation when the Lord saved Israel from destruction, as recorded in 2 Samuel 24:18 … David then purchased the property on a prominent hilltop, where the temple would eventually stand.'
  - where: 'note 24:18 “The threshing floor that became the temple”'
    claim: 'The LORD answered by fire; David named the place the house of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/22?lang=eng'
    quote: 'Then David said, This is the house of the Lord God, and this is the altar of the burnt offering for Israel.'
  - where: 'note 24:18 “The threshing floor that became the temple”'
    claim: 'Solomon built in mount Moriah at the threshing floor David prepared'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/3?lang=eng'
    quote: 'Then Solomon began to build the house of the Lord at Jerusalem in mount Moriah, where the Lord appeared unto David his father, in the place that David had prepared in the threshingfloor of Ornan the Jebusite.'
  - where: 'note 24:18 “The threshing floor that became the temple”'
    claim: 'By 2 Chr. 3:1 the Chronicler tied Moriah and Abraham’s mountain to the Temple Mount, linking Gen. 22 with Araunah’s threshing floor and the First Temple'
    key: pierce-ancestors
    url: 'https://rsc.byu.edu/creation-sinai/ancestors-israel-environment-canaan-early-second-millennium-bc'
    quote: 'Moriah was equated with Jerusalem later when the Chronicler tied the land of Moriah/Jehovah-jireh and the mountain where Abraham bound Isaac to the Temple Mount in Jerusalem (2 Chronicles 3:1), thereby linking the hierophany that occurred in Genesis 22 to the hierophany at the threshing floor of Araunah'
  - where: 'note 24:18 “The threshing floor that became the temple”'
    claim: 'The identification of the two Moriahs is a tradition first recorded by Josephus'
    key: bd-moriah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moriah?lang=eng'
    quote: '(2) Mount Moriah, the hill on which Solomon built the temple (2 Chr. 3:1); a tradition first recorded by the Jewish historian Josephus, who regards this as identical with (1).'
  - where: 'note 24:18 “The threshing floor that became the temple”'
    claim: 'Ornan was threshing wheat; the LORD answered by fire'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: 'Now Ornan was threshing wheat. … and called upon the Lord; and he answered him from heaven by fire upon the altar of burnt offering.'

  - where: 'note 24:24 “An offering that costs”'
    claim: 'Ornan offered the oxen, instruments and wheat; Chronicles gives six hundred shekels of gold for the place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: 'lo, I give thee the oxen also for burnt offerings, and the threshing instruments for wood, and the wheat for the meat offering; I give it all. … So David gave to Ornan for the place six hundred shekels of gold by weight.'
  - where: 'note 24:24 “An offering that costs”'
    claim: 'A Latter-day Saint teacher applies David’s refusal to a talk that cost the speaker nothing: we cannot understand what we have not paid a price for'
    key: mcconkie-stronger-testimonies
    url: 'https://rsc.byu.edu/vol-8-no-1-2007/building-stronger-testimonies'
    quote: 'Perhaps the problem with the talk in which people seemed to have so little interest was that it had cost the speaker nothing. … We cannot teach what we do not understand, and we cannot understand that for which we have not paid a price.'

  - where: christ
    claim: 'Abraham performed the similitude in the same area where the Father would sacrifice His Son'
    key: ot-manual-gen-18-23
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/genesis-18-23-abraham-a-model-of-faith-and-righteousness?lang=eng'
    quote: 'Not only did Abraham perform the similitude, but he performed it in the same area in which the Father would make the sacrifice of His Son.'
  - where: christ
    claim: 'The Chronicler links Abraham’s mountain to the threshing floor and the temple'
    key: pierce-ancestors
    url: 'https://rsc.byu.edu/creation-sinai/ancestors-israel-environment-canaan-early-second-millennium-bc'
    quote: 'thereby linking the hierophany that occurred in Genesis 22 to the hierophany at the threshing floor of Araunah the Jebusite, where David had built an altar and offered sacrifice to stop the plague caused by his census of Israel'

  - where: explore
    claim: 'Chronicles’ account: the angel with a drawn sword over Jerusalem, sackcloth, fire from heaven'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/21?lang=eng'
    quote: 'having a drawn sword in his hand stretched out over Jerusalem. Then David and the elders of Israel, who were clothed in sackcloth, fell upon their faces.'
