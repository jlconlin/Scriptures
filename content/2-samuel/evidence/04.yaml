chapter: 4
claims:
  - where: setting
    claim: 'Abner took Ish-bosheth to Mahanaim and made him king over Israel; Judah followed David, who reigned in Hebron seven years and six months'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/2?lang=eng'
    quote: 'But Abner the son of Ner, captain of Saul’s host, took Ish-bosheth the son of Saul, and brought him over to Mahanaim;'
  - where: setting
    claim: 'David reigned in Hebron over Judah seven years and six months'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/2?lang=eng'
    quote: 'And the time that David was king in Hebron over the house of Judah was seven years and six months.'
  - where: setting
    claim: 'The house of Saul grew weaker during the long war'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/3?lang=eng'
    quote: 'Now there was long war between the house of Saul and the house of David: but David waxed stronger and stronger, and the house of Saul waxed weaker and weaker.'
  - where: setting
    claim: 'Ish-bosheth accused Abner, who then turned the people to David and deserted to him; Joab killed him to avenge his brother'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'Enraged, Abner retaliated against Ishbosheth by turning the hearts of the rest of the people to King David (see vv. 17–19), and then he himself deserted to David’s camp (see v. 20). Joab used this opportunity to avenge the death of his brother'
  - where: setting
    claim: 'Those Abner had persuaded could have gone back to Ish-bosheth at the news of his death'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'This move was important politically, for those whom Abner had persuaded to change their loyalty to David could easily have gone back to Ishbosheth at the news of Abner’s death.'
  - where: thread
    claim: 'Ish-bosheth lost heart; Abner was the real stay of the kingdom'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/4.htm'
    quote: 'His resolution was paralysed: he lost heart. … Were dismayed. Ish-bosheth was a mere puppet, and Abner the real stay of the kingdom.'
  - where: thread
    claim: 'One older reading: the aside on Mephibosheth shows that with Ish-bosheth dead the government of Saul''s house was at an end, the only descendant left a helpless cripple'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/4.htm'
    quote: 'he inserts a remark concerning Saul''s family, to show at the outset, that with the death of Ishbosheth the government of this family necessarily became extinct, as the only remaining descendant was a perfectly helpless cripple.'
  - where: thread
    claim: 'The murderers hoped for a reward from David'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/4.htm'
    quote: 'No motive is assigned for this action. But there can be little doubt that it was no other than the hope of obtaining a great reward from David.'
  - where: section 1 plain
    claim: '“Captains of bands” were leaders of raiding troops'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/4.htm'
    quote: 'captains of bands] Leaders of predatory troops.'
  - where: section 2 plain
    claim: '“The plain” is the Arabah, the valley of the Jordan'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/4.htm'
    quote: 'went by the way of the Arabah (the valley of the Jordan: see 2 Samuel 2:29) the whole night'
  - where: 'note 4:2 “Beeroth reckoned to Benjamin”'
    claim: 'The parenthesis explains how these Beerothites were Benjamites: Benjamites occupied Beeroth when its original inhabitants left'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/4.htm'
    quote: 'The object of this parenthesis is to explain how these Beerothites came to be Benjamites.'
  - where: 'note 4:2 “Beeroth reckoned to Benjamin”'
    claim: 'Benjamites occupied Beeroth when its original inhabitants deserted it; when and why is unknown'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/4.htm'
    quote: 'had been occupied by Benjamites when its original inhabitants deserted it. When and why they did so is unknown'
  - where: 'note 4:2 “Beeroth reckoned to Benjamin”'
    claim: 'Beeroth was a Gibeonite city kept under the treaty with Joshua, reckoned to Benjamin; plausibly its people fled from Saul''s massacre of the Gibeonites'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/4.htm'
    quote: 'Beeroth was one of the four Gibeonite cities, retained by their original Canaanite inhabitants in virtue of the treaty made with Joshua (Joshua 9:17). … it has been plausibly conjectured that they fled from Saul’s massacre of the Gibeonites (2 Samuel 21:1-2).'
  - where: 'note 4:2 “Beeroth reckoned to Benjamin”'
    claim: 'The historian draws attention to the murderers belonging to Ish-bosheth''s own tribe'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/4.htm'
    quote: 'The historian calls special attention to the fact that Ish-bosheth’s murderers belonged to his own tribe.'
  - where: 'note 4:2 “Beeroth reckoned to Benjamin”'
    claim: 'Beeroth among the Gibeonite cities'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/9?lang=eng'
    quote: 'Now their cities were Gibeon, and Chephirah, and Beeroth, and Kirjath-jearim.'
  - where: 'note 4:2 “Beeroth reckoned to Benjamin”'
    claim: 'Beeroth in Benjamin''s lot'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/18?lang=eng'
    quote: 'Gibeon, and Ramah, and Beeroth,'
  - where: 'note 4:2 “Beeroth reckoned to Benjamin”'
    claim: 'A famine came for Saul''s slaying of the Gibeonites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'It is for Saul, and for his bloody house, because he slew the Gibeonites.'
  - where: 'note 4:4 “Jonathan''s lame son”'
    claim: 'David asks for one of Saul''s house; Ziba names Jonathan''s lame son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/9?lang=eng'
    quote: 'Is there not yet any of the house of Saul, that I may shew the kindness of God unto him? And Ziba said unto the king, Jonathan hath yet a son, which is lame on his feet.'
  - where: 'note 4:4 “Jonathan''s lame son”'
    claim: 'His true name was Merib-baal, with bosheth put for Baal; Ziba''s slander, his defense, David spares him'
    key: bd-mephibosheth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/mephibosheth?lang=eng'
    quote: 'Ziba’s slander (16:1–4); his defense (19:24–28); David spares him (21:7). His true name was Merib-baal; but later Israelites were unwilling to pronounce the name Baal (Ex. 23:13) and substituted for it bosheth (“shameful thing”).'
  - where: 'note 4:6 “As though they would have fetched wheat”'
    claim: 'The Hebrew phrase is two words, lōqḥê ḥiṭṭîm (the first shown here)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'לֹקְחֵ֣י'
  - where: 'note 4:6 “As though they would have fetched wheat”'
    claim: 'A modern translation reads it as a pretext'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+4%3A5-7&version=NRSVUE'
    quote: 'They came inside the house as though to take wheat, and they struck him in the stomach'
  - where: 'note 4:6 “As though they would have fetched wheat”'
    claim: 'The Septuagint has a doorkeeper winnowing wheat who slept, and tells the killing in verse 7'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_samuel/4.htm'
    quote: '6And, behold, the porter of the house winnowed wheat, and he slumbered and slept: and the brothers Rechab and Baana went privily into the house:'
  - where: 'note 4:11 “A righteous person”'
    claim: 'Ṣaddîq at 2 Sam. 4:11 means right in law, not under penalty'
    key: bdb
    url: 'https://biblehub.com/hebrew/6662.htm'
    quote: 'right in law, not under penalty 2 Samuel 4:11'
  - where: 'note 4:11 “A righteous person”'
    claim: 'The servants of Ish-bosheth under Abner fought David''s servants under Joab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/2?lang=eng'
    quote: 'And Abner the son of Ner, and the servants of Ish-bosheth the son of Saul, went out from Mahanaim to Gibeon.'
  - where: 'note 4:11 “A righteous person”'
    claim: 'The Amalekite was put to death for claiming to have slain the LORD''s anointed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/1?lang=eng'
    quote: 'Thy blood be upon thy head; for thy mouth hath testified against thee, saying, I have slain the LORD’s anointed.'
  - where: 'note 4:11 “A righteous person”'
    claim: 'The Student Manual: David showed wisdom and judgment and did not condone the treachery of the assassins'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'Again, David showed great wisdom and judgment by executing the two men who killed Ishbosheth. Although he was at war with Ishbosheth, David did not condone the treachery of the assassins and put them to death. His wisdom and goodness finally united the tribes'
  - where: 'note 4:12 “Over the pool in Hebron”'
    claim: 'One older reading: hands that murdered, feet that ran for the reward; bodies hung as a spectacle and warning; cf. Deut. 21:22'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/4.htm'
    quote: '"They cut off their hands and feet," - the hands with which they had committed the murder, and the feet which had run for the reward, - "and hanged the bodies by the pool at Hebron" for a spectacle and warning, that others might be deterred from committing similar crimes (cf. Deuteronomy 21:22'
  - where: 'note 4:12 “Over the pool in Hebron”'
    claim: 'The same reading in the Cambridge Bible: exposed in the most public spot, a warning, cf. Deut. 21:22'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/4.htm'
    quote: 'were exposed to view in the most public and frequented spot in Hebron, for a spectacle and a warning. Cp. Deuteronomy 21:22.'
  - where: 'note 4:12 “Over the pool in Hebron”'
    claim: 'The law of hanging one put to death for a capital sin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/21?lang=eng'
    quote: 'And if a man have committed a sin worthy of death, and he be to be put to death, and thou hang him on a tree:'
  - where: 'note 4:12 “Over the pool in Hebron”'
    claim: 'Abner was buried in Hebron and David wept at his grave'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/3?lang=eng'
    quote: 'And they buried Abner in Hebron: and the king lifted up his voice, and wept at the grave of Abner; and all the people wept.'
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'In the KJV “LORD” in small capitals stands for the name Jehovah'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'In the KJV, the Jewish custom has been followed, and the name is generally denoted by Lord or God, printed in small capitals.'
  - where: christ
    claim: 'One older reading of the oath: one under God''s protection had no need to commit crimes'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/4.htm'
    quote: 'In this connexion it implies that one who was under God’s protection had no need to commit crimes for his own defence.'
  - where: christ
    claim: 'The same reading in Keil'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/4.htm'
    quote: 'in which the thought is implied that David did not feel it necessary to get rid of his enemies by the commission of crimes.'
  - where: explore
    claim: 'David swears the same oath at 1 Kings 1:29'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/4.htm'
    quote: 'Compare the same oath in David’s mouth in 1 Kings 1:29.'
