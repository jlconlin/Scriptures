chapter: 21
claims:
  - where: setting
    claim: 'Chapters 21–24 close the history of David; the famine of 21:1–14 most probably happened earlier and is introduced here; 21:15–22 are brief notices of the Philistine wars'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/21.htm'
    quote: 'whereas the famine, and the expiation connected with it (2 Samuel 21:1-14), happened most probably at an earlier period, and are merely introduced here because no fitting opportunity had presented itself before.'
  - where: setting
    claim: 'No time adverb ties the famine to what precedes; it came after David knew Mephibosheth and probably before Absalom’s rebellion; the date cannot be fixed'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/21.htm'
    quote: 'This famine must have occurred after David became acquainted with Mephibosheth (ch. 2 Samuel 9:1 ff.), for it is expressly stated that he spared Mephibosheth (2 Samuel 21:7); and in all probability before Absalom’s rebellion'
  - where: setting
    claim: 'Saul’s deed against the Gibeonites is not alluded to anywhere else'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/21.htm'
    quote: 'There is no allusion to the deed elsewhere.'
  - where: setting
    claim: 'Chronicles retells the four battles with the giant’s sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/20?lang=eng'
    quote: 'These were born unto the giant in Gath; and they fell by the hand of David, and by the hand of his servants.'

  - where: 'note 21:1 “A famine for a broken oath”'
    claim: 'The LORD names the cause of the famine; the narrator explains the oath and Saul’s zeal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'It is for Saul, and for his bloody house, because he slew the Gibeonites. … and the children of Israel had sworn unto them: and Saul sought to slay them in his zeal to the children of Israel and Judah.'
  - where: 'note 21:1 “A famine for a broken oath”'
    claim: 'The footnote at Gibeonites points to the oath in Joshua 9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'Josh. 9:17 (3–17)'
  - where: 'note 21:1 “A famine for a broken oath”'
    claim: 'Gibeon was formerly a Hivite city in the hills of Benjamin about five miles north of Jerusalem'
    key: bd-gibeon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gibeon?lang=eng'
    quote: 'Formerly a city of the Hivites, on one of the hills of Benjamin, about five miles north of Jerusalem, frequently mentioned in Old Testament history (Josh. 9–10; 2 Sam. 2:12–17; 20:5–10; 21:1–14'
  - where: 'note 21:1 “A famine for a broken oath”'
    claim: 'Blood defiles the land and it is cleansed only by the blood of him who shed it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/35?lang=eng'
    quote: 'for blood it defileth the land: and the land cannot be cleansed of the blood that is shed therein, but by the blood of him that shed it.'

  - where: 'note 21:3 “Atonement for blood”'
    claim: 'BDB: the verb of 21:3 means to cover over, namely the bloodguilt of Saul’s house; the answer is a death penalty of seven sons'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'בַּמָּה אֲכַמֵּר 2 Samuel 21:3, with what shall I cover over (namely, the bloodguiltiness of the house of Saul, says David The answer is by a death penalty of seven sons of the guilty house)'
  - where: 'note 21:3 “Atonement for blood”'
    claim: 'The verb in 21:3 is the Piel of kāpar, ʾăkappēr'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'אֲכַפֵּ֔ר'
  - where: 'note 21:3 “Atonement for blood”'
    claim: 'The Gibeonites refuse silver and gold and the killing of any man in Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'We will have no silver nor gold of Saul, nor of his house; neither for us shalt thou kill any man in Israel.'

  - where: 'note 21:6 “Seven sons for their father’s sin?”'
    claim: 'The footnote at “sons” points to Deuteronomy 24:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'Deut. 24:16; Hel. 11:9'
  - where: 'note 21:6 “Seven sons for their father’s sin?”'
    claim: 'The Student Manual (Rasmussen): the law would not permit sons put to death for a father; it cannot have been a revelation from the Lord that required or approved the deed'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'The law would have not permitted sons to be put to death for the guilt of a father or a forefather (Deuteronomy 24:16 is explicit on that; see another Numbers 35:33). It cannot have been a revelation from the Lord that either required or approved this deed'
  - where: 'note 21:6 “Seven sons for their father’s sin?”'
    claim: 'The Student Manual: the deed belongs to David’s spiritual deterioration; “God was entreated” is apostate theology'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'This terrible episode must have been done in [the] days of David’s spiritual deterioration. … it is repulsive to read that after all this was done ‘God was entreated for the land.’ This is apostate theology, comparable to that of the Canaanite-Baal religions.'
  - where: 'note 21:6 “Seven sons for their father’s sin?”'
    claim: 'BDB: the verb rendered “hang” is some solemn form of execution, meaning uncertain; ancient versions read impale, expose, crucify; also Num. 25:4'
    key: bdb
    url: 'https://biblehub.com/hebrew/3363.htm'
    quote: 'Imperative הוֺקַע Numbers 25:4; of some solemn form of execution, but meaning uncertain: Aq Ges impale; ᵐ5 ᵑ6 expose (ἐξηλιάζειν, παραδειγματἰζειν); ᵑ7 ᵑ9 crucify'
  - where: 'note 21:6 “Seven sons for their father’s sin?”'
    claim: 'The verb in 21:6 is a form of yāqaʿ (H3363)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'וְ/הוֹקַֽעֲנוּ/ם֙'
  - where: 'note 21:6 “Seven sons for their father’s sin?”'
    claim: 'A Latter-day Saint study names the episode among the tensions of David’s story and finds God’s loyalty the persistent thread'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'Tensions regarding the nature of David’s God arise when the Lord appears to condone David’s violence toward innocent people (1 Samuel 27:8–12; 2 Samuel 8:14), seemingly commissions the slaughter of Saul’s seed (2 Samuel 21:1–14)'
  - where: 'note 21:6 “Seven sons for their father’s sin?”'
    claim: 'The narrative seemingly has the Lord commission the slaughter of Saul’s seed, yet its persistent thread shows God’s loyalty to David'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'seemingly commissions the slaughter of Saul’s seed (2 Samuel 21:1–14), and ostensibly reacts harshly to David’s census (24:1–25). Yet the persistent thread of the narrative reveals God’s loyalty to David and his descendants.'
  - where: 'note 21:6 “Seven sons for their father’s sin?”'
    claim: 'The LORD names the cause; the Gibeonites name the remedy; David agrees; Mephibosheth spared for the LORD’s oath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'Let seven men of his sons be delivered unto us, and we will hang them up unto the LORD in Gibeah of Saul, whom the LORD did choose. And the king said, I will give them.'

  - where: 'note 21:8 “Michal or Merab?”'
    claim: 'The Bible Dictionary: in 2 Sam. 21:8 the name Michal is mistakenly used for Merab, wife of Adriel'
    key: bd-michal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/michal?lang=eng'
    quote: 'In 2 Sam. 21:8 the name Michal is mistakenly used for Merab, who was the wife of Adriel.'
  - where: 'note 21:8 “Michal or Merab?”'
    claim: 'Merab was given to Adriel the Meholathite; Michal had no child'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/18?lang=eng'
    quote: 'But it came to pass at the time when Merab Saul’s daughter should have been given to David, that she was given unto Adriel the Meholathite to wife.'
  - where: 'note 21:8 “Michal or Merab?”'
    claim: 'The same Hebrew verb yālədâ, “she bore,” stands twice in 21:8, for Rizpah’s sons and for the five'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'יָלְדָ֣ה'
  - where: 'note 21:8 “Michal or Merab?”'
    claim: 'Rizpah, Saul’s concubine, had two sons, Armoni and Mephibosheth'
    key: hilton-motherhood-ot
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/motherhood-old-testament'
    quote: 'She was one of Saul’s concubines and had two sons, Armoni and Mephibosheth (see 2 Samuel 3:7, 21:8).'

  - where: 'note 21:10 “Rizpah’s watch”'
    claim: 'Rizpah, Saul’s concubine, mother of Armoni and Mephibosheth; her sons were among the seven delivered to the Gibeonites'
    key: hilton-motherhood-ot
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/motherhood-old-testament'
    quote: 'As part of making peace with the Gibeonites, David delivered seven of Saul’s descendants, including Rizpah’s sons, to the Gibeonites, who “hanged them” (2 Samuel 21:9).'
  - where: 'note 21:10 “Rizpah’s watch”'
    claim: 'It was unusual that the sons were not buried, against Deut. 21:23; the vigil likely lasted six months'
    key: hilton-motherhood-ot
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/motherhood-old-testament'
    quote: 'It is unusual that Rizpah’s sons were not immediately buried. … Perhaps this makes Rizpah’s vigil even more significant because she was still willing to protect the bodies of her deceased sons. … her tireless efforts likely continued for six months.'
  - where: 'note 21:10 “Rizpah’s watch”'
    claim: 'The vigil lasted until rain ended the drought, mid-April to October or November (Hilton’s note quoting a Bible dictionary)'
    key: hilton-motherhood-ot
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/motherhood-old-testament'
    quote: 'The vigil was kept “until rain fell and ended the drought—from mid-April until October or November”'
  - where: 'note 21:10 “Rizpah’s watch”'
    claim: 'The men of Jabesh-gilead took the bodies of Saul and his sons from Beth-shan and buried the bones at Jabesh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/31?lang=eng'
    quote: 'And they took their bones, and buried them under a tree at Jabesh, and fasted seven days.'
  - where: 'note 21:10 “Rizpah’s watch”'
    claim: 'The law: a hanged man’s body is not to remain all night, lest the land be defiled'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/21?lang=eng'
    quote: 'His body shall not remain all night upon the tree, but thou shalt in any wise bury him that day; (for he that is hanged is accursed of God;) that thy land be not defiled'
  - where: 'note 21:10 “Rizpah’s watch”'
    claim: 'David was told what Rizpah had done and buried the bones in Kish’s sepulchre; after that God was entreated'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'And it was told David what Rizpah the daughter of Aiah, the concubine of Saul, had done. … in the sepulchre of Kish his father: and they performed all that the king commanded. And after that God was entreated for the land.'

  - where: 'note 21:16 “The sons of the giant”'
    claim: 'The Bible Dictionary: Raphah of Gath was said to be the father of several giants, Goliath among them; the six-fingered giant is one of the sons'
    key: bd-giants
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/giants?lang=eng'
    quote: 'Raphah of Gath was said to be the father of several giants of whom Goliath was one (1 Sam. 17:4–7; 2 Sam. 21:16–22; 1 Chr. 20:6). A 12-fingered, 12-toed giant is also mentioned as one of the sons.'
  - where: 'note 21:16 “The sons of the giant”'
    claim: '“The giant” here is hārāpâ, Rapha'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'הָ/רָפָ֗ה'
  - where: 'note 21:16 “The sons of the giant”'
    claim: 'Chronicles names the second giant Sippai and has the four fall by David and his servants'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/20?lang=eng'
    quote: 'at which time Sibbechai the Hushathite slew Sippai, that was of the children of the giant: and they were subdued.'

  - where: 'note 21:17 “The light of Israel”'
    claim: 'The footnote at “go” points to 2 Sam. 18:3–4, where the people keep David from battle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: '2 Sam. 18:3 (3–4)'
  - where: 'note 21:17 “The light of Israel”'
    claim: 'One older reading: David was the light of Israel because Jehovah was his light (22:29); the lamp is the light of life in prosperity; his reign was a light God kindled for Israel'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/21.htm'
    quote: 'David had become the light of Israel from the fact that Jehovah was his light (2 Samuel 22:29) … David''s regal life and actions were the light which the grace of God had kindled for the benefit of Israel.'
  - where: 'note 21:17 “The light of Israel”'
    claim: 'Quenching the lamp is a metaphor for calamity; “light of Israel” suggests David was already king of all Israel, so the incident may be from the wars of 5:17–25'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/21.htm'
    quote: 'The expression light of Israel seems to indicate that David was already king of all Israel, and if so, the incident may have happened in one of the wars recorded in ch. 2 Samuel 5:17-25.'

  - where: 'note 21:19 “Elhanan and Goliath”'
    claim: 'The King James prints “the brother of” as supplied words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'where Elhanan the son of Jaare-oregim, a Beth-lehemite, slew the brother of Goliath the Gittite'
  - where: 'note 21:19 “Elhanan and Goliath”'
    claim: 'The Hebrew has the verb, Elhanan, and the object marker before Goliath, with no word for brother'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'אֶלְחָנָן֩'
  - where: 'note 21:19 “Elhanan and Goliath”'
    claim: 'Chronicles: Elhanan son of Jair slew Lahmi the brother of Goliath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/20?lang=eng'
    quote: 'and Elhanan the son of Jair slew Lahmi the brother of Goliath the Gittite, whose spear staff was like a weaver’s beam.'
  - where: 'note 21:19 “Elhanan and Goliath”'
    claim: 'The Bible Dictionary: probably a different man of the same name, or an error in the text'
    key: bd-goliath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/goliath?lang=eng'
    quote: 'In 2 Sam. 21:19 the reference is probably to a different man of the same name, or some error may have crept into the text.'
  - where: 'note 21:19 “Elhanan and Goliath”'
    claim: 'One older reading: “the brother of” is inserted from Chronicles, not in the Hebrew; Oregim was copied from the line below; the letters of Beth-lehemite Goliath resemble those of Lahmi the brother of Goliath; which is original is not easy to decide; another giant may have borne the name'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/21.htm'
    quote: 'The words the brother of are conjecturally inserted in the E. V. from 1 Chron. They are not found here in the Hebrew text, or in any of the ancient versions.'
  - where: 'note 21:19 “Elhanan and Goliath”'
    claim: 'Same source: scribal explanation of Jaare-oregim and Lahmi'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/21.htm'
    quote: 'Oregim, the word for weavers in the line below, was inserted by a careless scribe … so closely resemble those of Lahmi the brother of Goliath, that it is almost certain that one reading is an accidental corruption of the other. But which is the original it is not easy to decide.'

  - where: christ
    claim: 'The footnote at 21:6 and the footnote at Alma 34:11 both point to Deut. 24:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/34?lang=eng'
    quote: 'Deut. 24:16; Mosiah 29:25'
  - where: christ
    claim: 'Amulek rests on the law of Moses that prohibited taking one life in punishment for another’s wrong'
    key: sc-knowhy-142
    url: 'https://scripturecentral.org/knowhy/why-must-there-be-an-infinite-and-eternal-sacrifice'
    quote: 'Not only does logic work against the Zoramite view, but so did the symbolism of the law of Moses which prohibited the taking of one mortal life in punishment for the wrongdoing of another.'

  - where: setting
    claim: 'Chapters 21–24 hold two divine punishments with their expiation, David''s psalm and last words, notices of the Philistine wars and the list of heroes'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/21.htm'
    quote: '(1) two divine punishments inflicted upon Israel, with the expiation of the sins that occasioned them (2 Samuel 21:1-14, and 2 Samuel 24); (2) David''s psalm of praise for deliverance out of the hand of all his enemies (2 Samuel 22), and his last prophetic words'
  - where: thread
    claim: 'The Student Manual: it cannot have been a revelation from the Lord'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'It cannot have been a revelation from the Lord that either required or approved this deed done ‘to avenge the Gibeonites’'
  - where: 'note 21:8 “Michal or Merab?”'
    claim: 'The King James renders the verb “bare” for Rizpah and “brought up” for the five'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'the two sons of Rizpah the daughter of Aiah, whom she bare unto Saul, Armoni and Mephibosheth; and the five sons of Michal the daughter of Saul, whom she brought up for Adriel'
  - where: 'note 21:8 “Michal or Merab?”'
    claim: 'Michal had no child to the day of her death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/6?lang=eng'
    quote: 'Therefore Michal the daughter of Saul had no child unto the day of her death.'
  - where: 'note 21:10 “Rizpah’s watch”'
    claim: 'Rizpah kept watch from harvest until the rain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'from the beginning of harvest until water dropped upon them out of heaven, and suffered neither the birds of the air to rest on them by day, nor the beasts of the field by night.'
  - where: 'note 21:16 “The sons of the giant”'
    claim: 'David waxed faint; Abishai killed the Philistine; the four fell by David and his servants'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'and David waxed faint. … These four were born to the giant in Gath, and fell by the hand of David, and by the hand of his servants.'
  - where: 'note 21:19 “Elhanan and Goliath”'
    claim: 'ʾōrĕgîm, “weavers,” stands in the name and again at the end of the verse'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'אֹרְגִֽים'
