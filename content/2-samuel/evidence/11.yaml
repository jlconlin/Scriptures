    quote: 'Who smote Abimelech the son of Jerubbosheth (i.e., Gideon, see at Judges 6:32)?'
  - where: 'note 11:21 “Why Joab named Abimelech”'
    claim: 'The news of Uriah''s death was meant to mitigate the king''s wrath'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/11.htm'
    quote: 'he therefore instructed the messenger, if such should be the case, to announce Uriah''s death to the king, for the purpose of mitigating his wrath.'
  - where: 'note 11:21 “Why Joab named Abimelech”'
    claim: 'Abimelech died by a woman''s hand at Thebez'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/9?lang=eng'
    quote: 'And a certain woman cast a piece of a millstone upon Abimelech’s head, and all to brake his skull.'
