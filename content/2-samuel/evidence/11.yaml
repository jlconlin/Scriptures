chapter: 11
claims:
  - where: setting
    claim: 'Rabbah, the Ammonite city, is modern Amman, Jordan'
    key: judd-davids-fall
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/10/what-we-can-learn-from-king-davids-fall?lang=eng'
    quote: 'fighting a battle against the Ammonites at Rabbath-Ammon, modern-day Amman, Jordan.'
  - where: setting
    claim: 'The seminary manual makes chapters 11–12 a part of their own, between David becoming king (1–10) and the fracturing of his family (13–24)'
    key: ot-seminary-2-samuel-intro
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-samuel?lang=eng'
    quote: '2 Samuel 11–12 David lusts after Bathsheba and commits adultery with her.'
  - where: setting
    claim: 'Chapter 11 shows the adultery leading David into deceit and further sin; the rest of the book the suffering of his house'
    key: ot-seminary-2-samuel-intro
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-samuel?lang=eng'
    quote: 'Chapter 11 explains how David’s decision to commit adultery with Bathsheba led David down the path of deceit and further sin. The remainder of 2 Samuel describes the suffering and pain that befell the house of David.'
  - where: setting
    claim: 'The episode comes abruptly after the promise of chapter 7, and is read as a turning point after which David lives under a sort of curse'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'This distressing episode occurs abruptly after God has promised unconditionally to establish David’s house and kingdom … Many commentators see it as a turning point in the narrative, after which David lives under a sort of curse'
  - where: setting
    claim: 'Psalm 51 by its title belongs to Nathan''s coming after this'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/51?lang=eng'
    quote: 'A Psalm of David, when Nathan the prophet came unto him, after he had gone in to Bath-sheba.'
  - where: setting
    claim: 'The siege of Rabbah ends in chapter 12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'And Joab fought against Rabbah of the children of Ammon, and took the royal city.'
  - where: thread
    claim: 'David tried to cover his sin and then arranged Uriah''s death'
    key: ot-seminary-lesson-91
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-samuel/lesson-91-2-samuel-11-1-12-9?lang=eng'
    quote: 'Upon learning of Bathsheba’s condition, David tried to cover his sin and eventually arranged for Bathsheba’s husband, Uriah, to be killed in battle.'
  - where: thread
    claim: 'The Old Testament narrative is generally unconcerned with exploring motives'
    key: shannon-complex-stories
    url: 'https://mi.byu.edu/old-testament-reflections/lessons-from-lifes-complex-stories'
    quote: 'The Old Testament is largely written from a male perspective and is, generally speaking, unconcerned with exploring motivations. It largely leaves that to the reader.'
  - where: thread
    claim: 'The verdict of 11:27 prepares for Nathan''s mission'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/11.htm'
    quote: 'The divine sentence on David’s conduct prepares the way for the mission of Nathan in the next chapter.'
  - where: section 1 plain
    claim: 'The turn of the year was spring, when kings went out to war'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'Spring was the start of the Israelite new year, and since it was no longer cold out, it was also the time for kings to “go forth to battle.”'
  - where: section 1 plain
    claim: '“Purified” in 11:4: she had (just) purified herself'
    key: bdb
    url: 'https://biblehub.com/hebrew/6942.htm'
    quote: 'woman 2 Samuel 11:4 she having (just) purified herself'
  - where: section 2 plain
    claim: '“Wash thy feet”: go home and refresh yourself; the “mess” was a royal present'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/11.htm'
    quote: 'The Israelites were accustomed to wash their feet when they returned home from work or from a journey, to take refreshment and rest themselves.'
  - where: section 3 plain
    claim: '“Let not this thing displease thee”: let it not be displeasing in your eyes'
    key: bdb
    url: 'https://biblehub.com/hebrew/7489.htm'
    quote: '1 be displeasing: רַע בְּעֵינֵי Numbers 11:10'
  - where: section 4 plain
    claim: '11:27: the thing was evil in the LORD''s eyes'
    key: bdb
    url: 'https://biblehub.com/hebrew/7489.htm'
    quote: '4 be evil, wicked, ethically'
  - where: 'note 11:1 “The king who stayed home”'
    claim: 'Spring was the season for kings to go to battle; David had made his name in the field (1 Sam. 18:7)'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'David had been known as a military leader who stood and fought by his soldiers (1 Samuel 18:7). Spring was the start of the Israelite new year'
  - where: 'note 11:1 “The king who stayed home”'
    claim: 'Correa sets the idle king beside D&C 58:27'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'This is very different from what the Lord instructs in Doctrine and Covenants 58:27—that is, to be “anxiously engaged in a good cause'
  - where: 'note 11:1 “The king who stayed home”'
    claim: 'Kings were expected to lead their armies; the detail is ominous'
    key: judd-davids-fall
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/10/what-we-can-learn-from-king-davids-fall?lang=eng'
    quote: 'But the account adds what turns out to be an ominous detail'
  - where: 'note 11:1 “The king who stayed home”'
    claim: 'Kings were expected to lead their armies, but David stayed home'
    key: judd-davids-fall
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/10/what-we-can-learn-from-king-davids-fall?lang=eng'
    quote: 'Kings were expected to lead their armies into battle, but David decided to stay home instead.'
  - where: 'note 11:1 “The king who stayed home”'
    claim: 'The adultery takes place when David fails to go with his people to battle'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'David’s devastating adultery with Bathsheba takes place when he fails to accompany his people to battle.'
  - where: 'note 11:2 “Who was on the roof”'
    claim: 'Only David was on a roof; the text does not say Bath-sheba was, so she was not displaying herself'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'Only he was on a roof; it is important to notice that the text does not say that Bath-sheba was on a roof. In other words, she was not purposefully displaying herself to the king.'
  - where: 'note 11:2 “Who was on the roof”'
    claim: 'Evening breezes bring people onto Jerusalem''s roofs; the palace stood on the crest of a crowded hill where others below on their roofs could be seen'
    key: judd-davids-fall
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/10/what-we-can-learn-from-king-davids-fall?lang=eng'
    quote: 'David’s palace was probably on the crest of a densely populated hill, today called the City of David, where it would have been common to see others below on their roofs.'
  - where: 'note 11:2 “Who was on the roof”'
    claim: 'The narrator leaves her unnamed and presents her only as the object of David''s desire'
    key: hock-narrating
    url: 'https://rsc.byu.edu/vol-17-no-3-2016/narrating-scriptures-using-literary-approach-enhance-scripture-teaching'
    quote: 'The text only refers to her as a woman without a name who “was very beautiful to look upon” (2 Samuel 11:2). The narrator depicts her only as an object for lust'
  - where: 'note 11:3 “Whose daughter, whose wife”'
    claim: 'Eliam is almost certainly the Eliam of the mighty men, and Uriah was one of them'
    key: shannon-complex-stories
    url: 'https://mi.byu.edu/old-testament-reflections/lessons-from-lifes-complex-stories'
    quote: 'This is almost certainly the same Eliam who was a member of David’s elite warband of thirty “mighty men” described in 2 Samuel 23. Uriah the Hittite, Bath-sheba’s husband, was also a member of this elite warband.'
  - where: 'note 11:3 “Whose daughter, whose wife”'
    claim: 'The list of mighty men names Eliam the son of Ahithophel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/23?lang=eng'
    quote: 'Eliphelet the son of Ahasbai, the son of the Maachathite, Eliam the son of Ahithophel the Gilonite,'
  - where: 'note 11:3 “Whose daughter, whose wife”'
    claim: 'Uriah was not an Israelite by lineage; his name and actions show his faithfulness to the Lord'
    key: judd-davids-fall
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/10/what-we-can-learn-from-king-davids-fall?lang=eng'
    quote: 'Though not an Israelite by lineage, Uriah’s faithfulness to the Lord is manifest by his name (“My light is Jehovah” in Hebrew) and by his actions.'
  - where: 'note 11:4 “What the text says of Bath-sheba’s part”'
    claim: 'David never left his house; messengers took her, and she returned home alone'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'David never left his house. He sent messengers who took Bath-sheba to David, and later she returned alone to her home.'
  - where: 'note 11:4 “What the text says of Bath-sheba’s part”'
    claim: 'Interpreters range between complicity and having no say; the text does not give enough to say anything definite'
    key: shannon-complex-stories
    url: 'https://mi.byu.edu/old-testament-reflections/lessons-from-lifes-complex-stories'
    quote: 'These are the most extreme positions, and biblical interpreters have staked out positions on a spectrum between them. Unfortunately for any of these interpretations, the text does not give us enough information to definitively say anything.'
  - where: 'note 11:4 “What the text says of Bath-sheba’s part”'
    claim: 'The power differential must nuance any discussion of consent; it could have been hard for her to say no'
    key: shannon-complex-stories
    url: 'https://mi.byu.edu/old-testament-reflections/lessons-from-lifes-complex-stories'
    quote: 'David was king and this means that there was a power differential between him and Bath-sheba which must nuance any discussion of consent. From a modern perspective, that power differential means that it could have been difficult for her to say no.'
  - where: 'note 11:4 “What the text says of Bath-sheba’s part”'
    claim: 'Women had fewer rights; Saul gave David''s wife Michal to another'
    key: shannon-complex-stories
    url: 'https://mi.byu.edu/old-testament-reflections/lessons-from-lifes-complex-stories'
    quote: 'women simply did not have as many rights in ancient society as in current Western society. For example, King Saul was able to take David’s first wife, Michal, and give her as a wife to someone else.'
  - where: 'note 11:4 “What the text says of Bath-sheba’s part”'
    claim: 'The writers use none of their words for rape, unlike chapter 13; they place the blame for Uriah''s murder on David'
    key: shannon-complex-stories
    url: 'https://mi.byu.edu/old-testament-reflections/lessons-from-lifes-complex-stories'
    quote: 'The biblical authors do not use any of their words for rape (this can fruitfully be compared with the story of Amnon and Tamar in 2 Samuel 13, which describes Amnon’s act in the strongest possible language).'
  - where: 'note 11:4 “What the text says of Bath-sheba’s part”'
    claim: 'The blame for Uriah''s murder rests on David'
    key: shannon-complex-stories
    url: 'https://mi.byu.edu/old-testament-reflections/lessons-from-lifes-complex-stories'
    quote: 'the biblical authors place the blame for the murder of Uriah squarely on the shoulders of David.'
  - where: 'note 11:4 “What the text says of Bath-sheba’s part”'
    claim: 'Solomon''s kingship made Bath-sheba the most powerful woman in Israel'
    key: shannon-complex-stories
    url: 'https://mi.byu.edu/old-testament-reflections/lessons-from-lifes-complex-stories'
    quote: 'Solomon’s kingship elevates Bath-sheba to the status of the most powerful woman in ancient Israel.'
  - where: 'note 11:4 “What the text says of Bath-sheba’s part”'
    claim: 'Nathan''s charge: David took Uriah''s wife'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'thou hast killed Uriah the Hittite with the sword, and hast taken his wife to be thy wife'
  - where: 'note 11:4 “What “purified from her uncleanness” means”'
    claim: 'The verb is the reflexive of “consecrate”; in 11:4 a woman who had just purified herself'
    key: bdb
    url: 'https://biblehub.com/hebrew/6942.htm'
    quote: '4 consecrate oneself by purification, of priests and Levites … woman 2 Samuel 11:4 she having (just) purified herself'
  - where: 'note 11:4 “What “purified from her uncleanness” means”'
    claim: 'The law set a woman apart seven days during her monthly issue'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/15?lang=eng'
    quote: 'And if a woman have an issue, and her issue in her flesh be blood, she shall be put apart seven days'
  - where: 'note 11:4 “What “purified from her uncleanness” means”'
    claim: 'The washing can be understood as a purification bath, so she was not pregnant before'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'what Bath-sheba was doing can be understood as a purification bath.'
  - where: 'note 11:4 “What “purified from her uncleanness” means”'
    claim: 'The narrator indirectly tells the reader she was not and could not have been pregnant'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'the narrator is indirectly telling the reader that Bath-sheba was not and could not have been pregnant at this time.'
  - where: 'note 11:4 “What “purified from her uncleanness” means”'
    claim: 'David wanted Uriah to appear the father of the child'
    key: ot-seminary-lesson-91
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-samuel/lesson-91-2-samuel-11-1-12-9?lang=eng'
    quote: 'David wanted Uriah to spend the night with Bathsheba so it would appear that Uriah was responsible for his wife’s pregnancy.'
  - where: 'note 11:11 “Why Uriah would not go home”'
    claim: 'To wash the feet was what one did on coming home, to rest'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/11.htm'
    quote: 'The Israelites were accustomed to wash their feet when they returned home from work or from a journey, to take refreshment and rest themselves.'
  - where: 'note 11:11 “Why Uriah would not go home”'
    claim: 'David wanted Uriah home so that he would seem the father'
    key: ot-seminary-lesson-91
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-samuel/lesson-91-2-samuel-11-1-12-9?lang=eng'
    quote: 'David wanted Uriah to spend the night with Bathsheba so it would appear that Uriah was responsible for his wife’s pregnancy.'
  - where: 'note 11:11 “Why Uriah would not go home”'
    claim: 'Uriah more righteous than David: the king stayed home; Uriah would not go home while the ark, Joab and the army were in the field'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'Uriah proved to be more righteous than David. The king had not gone to battle, preferring to stay home (verse 1). Uriah, on the other hand, did not want to go to his home'
  - where: 'note 11:11 “Why Uriah would not go home”'
    claim: 'Uriah swore on David''s life; his service would bring his death while David lived'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'He testified or made an oath on David’s life and soul that he would not be selfish. His selfless service would bring about his death, and David would remain alive.'
  - where: 'note 11:11 “Why Uriah would not go home”'
    claim: 'Uriah showed integrity and self-control; David was selfish and unrestrained'
    key: ot-seminary-lesson-91
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-samuel/lesson-91-2-samuel-11-1-12-9?lang=eng'
    quote: '(Uriah showed great integrity and self-control, but David’s actions were selfish and unrestrained.)'
  - where: 'note 11:11 “Why Uriah would not go home”'
    claim: 'David made him drunk hoping he would forget his oath'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/11.htm'
    quote: 'In the hope that he might forget his oath and break his resolution not to go home. But this plan also failed.'
  - where: 'note 11:11 “Why Uriah would not go home”'
    claim: 'If the story has a hero, it is Uriah'
    key: judd-davids-fall
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/10/what-we-can-learn-from-king-davids-fall?lang=eng'
    quote: 'If there are any heroes in this story, Uriah the Hittite is one of them.'
  - where: 'note 11:14 “A letter carried by the man it condemned”'
    claim: 'Uriah carried the letter with his own death sentence'
    key: judd-davids-fall
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/10/what-we-can-learn-from-king-davids-fall?lang=eng'
    quote: 'Ironically, Uriah carried the letter containing his own death sentence back to the battlefield, where he died at the hands of the Ammonite soldiers.'
  - where: 'note 11:14 “A letter carried by the man it condemned”'
    claim: 'D&C 121:37 on covering sins; David arranged the murder in that diminished state'
    key: judd-davids-fall
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/10/what-we-can-learn-from-king-davids-fall?lang=eng'
    quote: 'Modern revelation teaches that when a priesthood holder—as King David was—attempts to cover his sins, “the Spirit of the Lord is grieved; … It was while in this diminished spiritual state that David arranged for the murder of Uriah.'
  - where: 'note 11:14 “A letter carried by the man it condemned”'
    claim: 'The valiant men who died with Uriah were most likely David''s mighty men'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'these valiant servants were most likely David’s “mighty men,” or personal army.'
  - where: 'note 11:14 “A letter carried by the man it condemned”'
    claim: 'Nathan''s charge: David killed Uriah with the sword of the Ammonites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'thou hast killed Uriah the Hittite with the sword, and hast taken his wife to be thy wife, and hast slain him with the sword of the children of Ammon.'
  - where: 'note 11:14 “A letter carried by the man it condemned”'
    claim: 'David compounded his sin by trying to cover it'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'But he did the very thing of which so many are guilty—he compounded his sin by trying to cover it up.'
  - where: 'note 11:21 “Why Joab named Abimelech”'
    claim: 'Jerubbesheth is Gideon; Joab expected David''s anger and gave the news of Uriah to turn it aside'
    key: keil-1-samuel
