chapter: 14
claims:
  - where: when
    claim: Absalom was in Geshur three years before this chapter
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/13?lang=eng
    quote: So Absalom fled, and went to Geshur, and was there three years.
  - where: setting
    claim: Absalom killed Amnon at the shearing feast and escaped to his grandfather’s home in Geshur
    key: ot-manual-2-samuel-13
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng
    quote: As the feast progressed, Amnon became “merry with wine” (v. 28). Absalom gave the signal, and his servants swept down and killed Amnon. Absalom escaped to his grandfather’s home in Geshur.
  - where: setting
    claim: David knowingly ignored Amnon’s act against Tamar
    key: easton-recognizing
    url: https://rsc.byu.edu/covenant-compassion/recognizing-responsibility-standing-victims
    quote: King David’s decision to knowingly ignore Amnon’s act of violence against Tamar and to eventually mourn the loss of Amnon’s life rather than acknowledge Tamar’s suffering is a terrifying example
  - where: setting
    claim: Amnon was the heir apparent; Chileab is not mentioned and perhaps died young; Absalom was third
    key: easton-recognizing
    url: https://rsc.byu.edu/covenant-compassion/recognizing-responsibility-standing-victims
    quote: Amnon is the firstborn and heir apparent to the throne. The second-born, Kileab or Chileab, isn't mentioned. Perhaps he died young. Absalom is the third born.
  - where: setting
    claim: The Hebrew of 13:39 is obscure and has been given almost opposite meanings
    key: cambridge-1-samuel
    url: https://biblehub.com/commentaries/cambridge/2_samuel/13.htm
    quote: The Heb. of this verse is obscure, and has been made to bear almost opposite meanings.
  - where: setting
    claim: Joab was the son of David’s sister Zeruiah and captain of his army
    key: bd-joab
    url: https://www.churchofjesuschrist.org/study/scriptures/bd/joab?lang=eng
    quote: Eldest son of Zeruiah, David’s sister, and captain of David’s army.
  - where: setting
    claim: Nathan asked the king’s judgment on a case; compare the plan of the widow of Tekoah
    key: cambridge-1-samuel
    url: https://biblehub.com/commentaries/cambridge/2_samuel/12.htm
    quote: The prophet asks for the king’s decision, as though he were consulting him about a case which had really happened. Compare the plan adopted by the widow of Tekoah (ch. 2 Samuel 14:4-7)
  - where: setting
    claim: Absalom was the heir to the throne
    key: cambridge-1-samuel
    url: https://biblehub.com/commentaries/cambridge/2_samuel/14.htm
    quote: David’s resolution to keep Absalom in exile was an injury to the people of God, for he was the heir to the throne.
  - where: thread
    claim: 'The woman’s argument: since God sets the example of mercy, David should be reconciled to his son'
    key: cambridge-1-samuel
    url: https://biblehub.com/commentaries/cambridge/2_samuel/14.htm
    quote: since life is uncertain and cannot be restored, and since God Himself sets the example of mercy, David should be reconciled to his son at once, before it is too late.
  - where: thread
    claim: Absalom said nothing about forgiveness
    key: keil-1-samuel
    url: https://biblehub.com/commentaries/kad/2_samuel/14.htm
    quote: Nothing was said by Absalom about forgiveness
  - where: section 3 plain
    claim: Verse 14 is better rendered “God doth not take away life, but deviseth devices”
    key: cambridge-1-samuel
    url: https://biblehub.com/commentaries/cambridge/2_samuel/14.htm
    quote: 'This translation cannot be defended. Better: and God doth not take away life, but deviseth devices (lit. thinketh thoughts, cp. 2 Samuel 14:13) to the end that he may not [utterly] banish a banished one.'
  - where: note 14:1 “Toward Absalom, or against him?”
    claim: The Hebrew is “heart of the king ʿal Absalom,” with no verb
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml
    quote: לֵ֥ב הַ/מֶּ֖לֶךְ עַל אַבְשָׁלֽוֹם
  - where: note 14:1 “Toward Absalom, or against him?”
    claim: The preposition generally means against; the only other occurrence of the phrase (Dan. 11:28) is hostile; the narrative fits; why the scheme and the two years?
    key: cambridge-1-samuel
    url: https://biblehub.com/commentaries/cambridge/2_samuel/14.htm
    quote: 'In favour of this rendering it may be urged (a) that the preposition generally means against not toward: (b) that in the only other passage where the phrase occurs (Daniel 11:28), it unquestionably expresses hostility: (c) that this meaning agrees better with the whole course of the narrative'
  - where: note 14:1 “Toward Absalom, or against him?”
    claim: If David longed for Absalom, why Joab’s scheme, and why refuse to see him two years?
    key: cambridge-1-samuel
    url: https://biblehub.com/commentaries/cambridge/2_samuel/14.htm
    quote: Why was Joab’s subtle scheme necessary, if David was eager of his own accord to recall Absalom? Why, if he was longing for a reconciliation, did he refuse to admit him to his presence for two whole years after his return?
  - where: note 14:1 “Toward Absalom, or against him?”
    claim: 'Most commentators keep “toward”: political and judicial reasons held David back, Joab gave him the excuse, the refusal was a “discipline of disapproval”'
    key: cambridge-1-samuel
    url: https://biblehub.com/commentaries/cambridge/2_samuel/14.htm
    quote: 'Most commentators however adopt the rendering of the E. V., and suppose that political and judicial reasons prevented David from yielding to the dictates of affection: that, perceiving this, Joab planned his scheme in order to give the king the excuse he desired'
  - where: note 14:1 “Toward Absalom, or against him?”
    claim: 'Keil also reads “against”: the phrase with ʿal occurs again only in Daniel 11:28'
    key: keil-1-samuel
    url: https://biblehub.com/commentaries/kad/2_samuel/14.htm
    quote: לב, written with על and without any verb, so that היה has to be supplied, only occurs again in Daniel 11:28, where the preposition has the meaning "against."
  - where: note 14:1 “Toward Absalom, or against him?”
    claim: The ESV reads “the king’s heart went out to Absalom”
    key: esv
    url: https://www.biblegateway.com/passage/?search=2%20Samuel%2014&version=ESV
    quote: Now Joab the son of Zeruiah knew (A)that the king's heart went out to Absalom.
  - where: note 14:1 “Toward Absalom, or against him?”
    claim: 'A Latter-day Saint reading: David yearns for reconciliation'
    key: taggart-sworn-david
    url: https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant
    quote: When Absalom flees, David yearns for reconciliation.
  - where: note 14:13 “The king judged in his own case”
    claim: To quench the coal is to destroy all hope of posterity
    key: ot-manual-2-samuel-13
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng
    quote: quench my coal that is left means destroying all hope of posterity, and extinguishing the family from among the people.
  - where: note 14:13 “The king judged in his own case”
    claim: The woman kept her intent disguised until she had committed the king
    key: ot-manual-2-samuel-13
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng
    quote: The woman conspiring with Joab was very careful to keep her real intent sufficiently disguised until she had committed the king to a benevolent course of action.
  - where: note 14:13 “The king judged in his own case”
    claim: The footnote at verse 11 sends “revengers” to Numbers 35:19
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/14?lang=eng
    quote: '11a “revengers”: Num. 35:19 (19, 21).'
  - where: note 14:14 “God devises means for the banished”
    claim: The KJV “respect any person” cannot be defended; better “God doth not take away life, but deviseth devices,” lit. “thinketh thoughts,” cp. 14:13
    key: cambridge-1-samuel
    url: https://biblehub.com/commentaries/cambridge/2_samuel/14.htm
    quote: 'This translation cannot be defended. Better: and God doth not take away life, but deviseth devices (lit. thinketh thoughts, cp. 2 Samuel 14:13) to the end that he may not [utterly] banish a banished one.'
  - where: note 14:14 “God devises means for the banished”
    claim: An allusion to God’s mercy in sparing David and devising a plan to bring him to repentance and restore him to His presence
    key: cambridge-1-samuel
    url: https://biblehub.com/commentaries/cambridge/2_samuel/14.htm
    quote: The statement is quite general, but contains a pointed allusion to God’s mercy in sparing David’s own life when he had deserved death for adultery and murder, and devising a plan to bring him to repentance and so restore him to His presence.
  - where: note 14:14 “God devises means for the banished”
    claim: 'The Hebrew: lōʾ yiśśāʾ ʾĕlōhîm nepeš, wĕḥāšab maḥăšābôt; the verb of verse 13 is ḥāšab'
    key: oshb-wlc
    url: https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml
    quote: וְ/לֹֽא יִשָּׂ֤א אֱלֹהִים֙ נֶ֔פֶשׁ וְ/חָשַׁב֙ מַֽחֲשָׁב֔וֹת
  - where: note 14:14 “God devises means for the banished”
    claim: 'The ESV: “God will not take away life, and he devises means so that the banished one will not remain an outcast”'
    key: esv
    url: https://www.biblegateway.com/passage/?search=2%20Samuel%2014&version=ESV
    quote: But God will not take away life, and he devises means
  - where: note 14:14 “God devises means for the banished”
    claim: 'Water spilt: when dead our life is gone; David might soon learn it with Absalom; God does not cast off for ever'
    key: keil-1-samuel
    url: https://biblehub.com/commentaries/kad/2_samuel/14.htm
    quote: We must all die, and when dead our life is irrevocably gone. Thou mightest soon experience this in the case of Absalom, if thou shouldst suffer him to continue in exile. God does not act thus; He does not deprive the sinner of life, but is merciful, and does not cast off for ever.
  - where: note 14:14 “God devises means for the banished”
    claim: The footnote at “expelled” points to the Topical Guide, God, Mercy of
    key: lds-scriptures
    url: https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/14?lang=eng
    quote: '14a “expelled”: TG God, Mercy of.'
