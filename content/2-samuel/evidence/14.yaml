  - where: thread
    claim: David let Absalom return but did not restore him to court; restored to favor, Absalom exploited it to plot against his father
    key: ot-manual-2-samuel-13
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng
    quote: David allowed Absalom to return but did not restore him to the court and his princely prerogatives. Absalom demanded either death or his former position (see v. 32). David reconsidered, and Absalom was restored to favor, a position he then exploited to plot against his father.
