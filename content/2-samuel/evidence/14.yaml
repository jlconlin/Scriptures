    key: ot-manual-2-samuel-13
    url: https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng
    quote: this information was probably introduced into the narrative here because Absalom’s hair seems to have played a part in his death (see 2 Samuel 18:9–17). … this number may either be incorrect or an exaggeration of the total weight for literary purposes.
