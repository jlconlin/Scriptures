chapter: 7
claims:
  - where: setting
    claim: 'With Jerusalem established and the wars over, David could turn to a new goal; Nathan appears here for the first time, as part of David’s court'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'After establishing Jerusalem and being free from war, David could direct his resources toward a new goal. At this point, David was beginning to form his own court, evidenced by the prophet Nathan, not mentioned before.'
  - where: setting
    claim: 'The Lord’s promises to David are called the Davidic covenant'
    key: scripture-helps-1-samuel-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/23-1-samuel-17-18-24-26-2-samuel-5-7?lang=eng'
    quote: 'The Lord’s promises to David are sometimes called the Davidic covenant.'
  - where: setting
    claim: 'The Davidic covenant has been called the one that receives more attention in the Hebrew Bible than any but Sinai'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'Jon D. Levenson, a Harvard divinity professor, affirms that the Davidic covenant “receives more attention in the Hebrew Bible than any covenant except the Sinaitic.”'
  - where: setting
    claim: 'Psalm 89, Isaiah 11 and 55, Amos 9 and Jeremiah 33 build on the covenant after the exile'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'Psalm 89 contains the most extensive biblical exposition of the Davidic covenant.'
  - where: setting
    claim: 'Chronicles tells the chapter again (1 Chr. 17:1–15)'
    key: cfm-ot-2026-25
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/25?lang=eng'
    quote: 'the Lord responded that David’s son would build it (see verses 12–15; see also 1 Chronicles 17:1–15).'

  - where: thread
    claim: 'The Lord first reminds David of past mercies and then promises future ḥesed; the structure of 2 Samuel 7 shows both'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'When the Lord establishes his covenant with David, he first reminds the king of past divine blessings and protection and then offers a stunning promise of future ḥesed.[1] The structure of 2 Samuel 7 … shows this simultaneous reflection on God’s generosity in the past and assertion of his future faithfulness.'
  - where: thread
    claim: 'David senses the blessings flow from God’s faithfulness, not human merit'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'He senses that the promised blessings flow from the faithfulness and goodness of God and do not derive from any human merit.'

  - where: section 3 plain
    claim: 'The clause of 7:19 is uncertain in Hebrew'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+7:19&version=NRSVUE'
    quote: '7.19 Meaning of Heb uncertain'
  - where: section 4 plain
    claim: '“Sheepcote” is a sheepfold'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/7?lang=eng'
    quote: '8a “sheepcote”: IE sheepfold.'

  - where: 'note 7:2 “Rest, and a house of cedar”'
    claim: 'The rest of 7:1 is paralleled word for word in Deuteronomy 12:10'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'The concept of rest as presented in this passage is paralleled word-for-word in Deuteronomy 12:10.'
  - where: 'note 7:2 “Rest, and a house of cedar”'
    claim: 'Deuteronomy’s sentence on rest continues with the place the LORD will choose for His name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/12?lang=eng'
    quote: 'Then there shall be a place which the Lord your God shall choose to cause his name to dwell there'
  - where: 'note 7:2 “Rest, and a house of cedar”'
    claim: 'David senses the incongruity of a palace for himself and no permanent residence for God'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'After establishing his throne in Jerusalem, David senses the incongruity of living in a palace while God has no permanent residence (2 Samuel 7:2). He proposes to build a house for God.'
  - where: 'note 7:5 “Why David was not to build”'
    claim: 'Nathan apparently agreed without consulting the Lord; David and Nathan may have grown complacent in the peace'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'Nathan apparently agreed with David but did not consult the Lord. David and Nathan may have become complacent as peace was reached, believing the Lord would be behind all of their decisions.'
  - where: 'note 7:5 “Why David was not to build”'
    claim: 'David’s motive was proper and good; no reason is given here; Chronicles gives the reason of war and bloodshed'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'was proper and good, but the Lord, through Nathan, denied him permission to do so. No specific reason was given here, only a blessing on David’s house. In the account in Chronicles, however, David told Solomon that it was revealed to him that he had seen too much war and bloodshed'
  - where: 'note 7:5 “Why David was not to build”'
    claim: 'David told Solomon the LORD forbade him because he had shed much blood, and promised a son who would be a man of rest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/22?lang=eng'
    quote: 'Thou hast shed blood abundantly, and hast made great wars: thou shalt not build an house unto my name, because thou hast shed much blood upon the earth in my sight.'
  - where: 'note 7:5 “Why David was not to build”'
    claim: 'The LORD told David it was well that the temple was in his heart, though his son would build it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'Whereas it was in thine heart to build an house unto my name, thou didst well that it was in thine heart.'

  - where: 'note 7:11 “The LORD will build David a house”'
    claim: 'The house David offered was a temple; the house the Lord promised is a posterity, with a throne for ever'
    key: cfm-ot-2026-25
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/25?lang=eng'
    quote: 'When David offered to build a house, meaning a temple, for the Lord … The Lord also said that He in turn would build David a “house,” meaning a posterity, and that his throne would last forever'
  - where: 'note 7:11 “The LORD will build David a house”'
    claim: 'Bayit: a dwelling, the house of God, and a family of descendants, the last with “make” in 7:11 and “build” in 7:27'
    key: bdb
    url: 'https://biblehub.com/hebrew/1004.htm'
    quote: 'b. family of descendants, descendants as organized body … subject ׳י, לְ ׳בָּנָה בּ 2 Samuel 7:27 = 1 Chronicles 17:10,25 … so לְ ׳עשׂה בּ 2 Samuel 7:11'
  - where: 'note 7:11 “The LORD will build David a house”'
    claim: 'The word in 7:11 is bayit'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'בַ֖יִת'
  - where: 'note 7:11 “The LORD will build David a house”'
    claim: 'God will make David a house, and David’s heir will build the house of God David proposed'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: '(2) that God will make David a house, (3) that David’s yet-unborn heir will inherit his throne, (4) that this descendant (usually interpreted to refer to Solomon)[7] will build the house of God that David has proposed'

  - where: 'note 7:13 “The son who builds”'
    claim: 'The heir is usually interpreted as Solomon, not yet born'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: '(3) that David’s yet-unborn heir will inherit his throne, (4) that this descendant (usually interpreted to refer to Solomon)[7] will build the house of God'
  - where: 'note 7:13 “The son who builds”'
    claim: 'Chronicles names Solomon as the son who will build and be the LORD’s son; Solomon claims the fulfilment in 1 Kings 8:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/22?lang=eng'
    quote: 'for his name shall be Solomon … He shall build an house for my name; and he shall be my son, and I will be his father'
  - where: 'note 7:13 “The son who builds”'
    claim: 'The promise deals with the Messiah; Solomon built a temple but his throne would not last forever; Christ’s body the temple (John 2:19–22)'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'This promise deals with the Messiah, who would come through the line of David. … Solomon, son of David, would build a house (a temple; 1 Kings 9:1), but his throne would not last forever. The body of Jesus Christ would be the temple (John 2:19–22)'

  - where: 'note 7:14 “Father and son, and the rod of men”'
    claim: 'In several passages God declares Israel’s king His son: 2 Sam. 7:14, 1 Chr. 28:6, Ps. 89:26–27'
    key: sc-knowhy-865
    url: 'https://scripturecentral.org/knowhy/why-does-god-declare-jesus-to-be-his-son'
    quote: 'In several verses of the Old Testament, God declares the king of Israel to be his son, showing the special relationship between God and the king. … one finds something akin to this in 2 Samuel 7:14'
  - where: 'note 7:14 “Father and son, and the rod of men”'
    claim: 'Hebrews applies the language typologically to Christ; for David, the father’s support came with stipulations; the Davidic line not exonerated by genealogy; Lam. 3:1'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'The book of Hebrews attributes this language typologically to Jesus Christ. Here, regarding David, the message retains its impact. … Disobedience among the promised Davidic line was not to be exonerated because of genealogy.'
  - where: 'note 7:14 “Father and son, and the rod of men”'
    claim: 'Hebrews 1:5 quotes the first half of the verse of the Son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/1?lang=eng'
    quote: 'And again, I will be to him a Father, and he shall be to me a Son?'

  - where: 'note 7:15 “Mercy not taken away, as from Saul”'
    claim: '“Mercy” in 7:15 is ḥesed, loving-kindness; even if the heir sins he will be corrected and not cast off as Saul was'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'But my mercy [ḥesed] shall not depart away from him … (6) even if the descendant commits sin he will be corrected and not cast off (as Saul was cast off)'
  - where: 'note 7:15 “Mercy not taken away, as from Saul”'
    claim: 'Saul had not received this promise; his house and kingdom received no special blessings'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'Saul had not received this promise from the Lord (1 Samuel 9:16–17). Even though Saul had a direct connection with Samuel, his house, offspring, or kingdom did not receive any special blessings.'
  - where: 'note 7:15 “Mercy not taken away, as from Saul”'
    claim: 'Scholars call it a “grant” covenant, promissory, without conditions'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'Scholars have called the Davidic covenant a “grant” covenant, contrasting it with “treaty” covenants, because it is promissory and focused on the commitment the giver of the covenant makes without conditions or obligations.'
  - where: 'note 7:15 “Mercy not taken away, as from Saul”'
    claim: 'The sin with Bathsheba comes abruptly after the promise; D&C 132:39 shows a loss of blessings, but God never abandoned David or the promise'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'Modern revelation makes clear that David’s failure to embody God’s ḥesed resulted in a loss of blessings (see Doctrine and Covenants 132:39), but the narrative asserts that God never abandoned David or the covenantal promise.'
  - where: 'note 7:15 “Mercy not taken away, as from Saul”'
    claim: 'The adultery and murder follow abruptly after the unconditional promise'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'This distressing episode occurs abruptly after God has promised unconditionally to establish David’s house and kingdom'

  - where: 'note 7:16 “For ever, and the kingdom that ended”'
    claim: 'Ps. 132:11–12 adds that the earthly kingdom would endure only if the descendants were faithful; the kingdom divided, then ended under Babylon in the sixth century BC'
    key: scripture-helps-1-samuel-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/23-1-samuel-17-18-24-26-2-samuel-5-7?lang=eng'
    quote: 'Psalm 132:11–12 adds the important qualification that David’s earthly kingdom would endure only if his descendants remained faithful to the Lord. … In the sixth century BC, Judah was taken captive by Babylon, and David’s kingdom came to an end.'
  - where: 'note 7:16 “For ever, and the kingdom that ended”'
    claim: 'The promise of a kingdom for ever was fulfilled through Jesus Christ, a descendant of David, who will reign for ever'
    key: scripture-helps-1-samuel-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/23-1-samuel-17-18-24-26-2-samuel-5-7?lang=eng'
    quote: 'Though David’s earthly kingdom ended, the promise of a kingdom that would be established forever was ultimately fulfilled through Jesus Christ, a descendant of David. As the Son of God, Jesus Christ will reign forever as our Eternal King.'
  - where: 'note 7:16 “For ever, and the kingdom that ended”'
    claim: 'A dualistic prophecy: David’s line on the throne, and Messianic; only Christ can sit on David’s throne forever'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'This verse is an example of a dualistic prophecy, that is, a prophecy with a double meaning … Clearly, only one person can sit upon the throne of David (that is, rule over the house of Israel) forever and ever, and that one is Christ.'
  - where: 'note 7:16 “For ever, and the kingdom that ended”'
    claim: 'Many misunderstood the covenant as protecting Jerusalem; the throne part was unconditional, fulfilled in Jesus'
    key: sc-knowhy-451
    url: 'https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed'
    quote: 'Many appear to have misunderstood the nature of the Lord’s covenant with David, especially in regard to what it meant for the protection of David’s city, Jerusalem. … This part of the Davidic covenant was unconditional and was ultimately fulfilled by the coming of Jesus of Nazareth'
  - where: 'note 7:16 “For ever, and the kingdom that ended”'
    claim: 'The promises of protection for Jerusalem were conditional on obedience (1 Kgs. 6:12–13; 9:6–7)'
    key: sc-knowhy-451
    url: 'https://scripturecentral.org/knowhy/why-did-some-in-lehis-time-believe-that-jerusalem-could-not-be-destroyed'
    quote: 'But the Lord had made it clear, through his prophets, that these promises of protection were conditional, depending on the people’s obedience to God’s commandments (1 Kings 6:12–13; 9:6–7).'
  - where: 'note 7:16 “For ever, and the kingdom that ended”'
    claim: 'Joseph Smith: the throne and kingdom of David to be given to another named David in the last days; some see Christ, others another king'
    key: eom-david-last-days
    url: 'https://eom.byu.edu/index.php/David,_Prophetic_Figure_of_Last_Days'
    quote: 'The Prophet Joseph Smith taught that "the throne and kingdom of David is to be taken from him and given to another by the name of David in the last days, raised up out of his lineage" (TPJS, p. 339).'
  - where: 'note 7:16 “For ever, and the kingdom that ended”'
    claim: 'Some see Christ as the whole fulfilment of a future David; others expect another righteous king named David'
    key: eom-david-last-days
    url: 'https://eom.byu.edu/index.php/David,_Prophetic_Figure_of_Last_Days'
    quote: 'Some see in Jesus Christ the complete fulfillment of the prophecy of a future David. Others feel that, while the titles and functions of the future Davidic king could apply to Jesus, there will also be another righteous king by the name of David in the last days'
  - where: 'note 7:16 “For ever, and the kingdom that ended”'
    claim: 'Gabriel’s words to Mary give Jesus the throne of David for ever'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'the Lord God shall give unto him the throne of his father David:'

  - where: 'note 7:18 “David sat before the LORD”'
    claim: 'David entered the temporary tabernacle for the ark; “before the Lord” is used of worship in the sanctuary'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'Learning that he would not be building a house for the Lord, David entered the temporary tabernacle for the ark (see 2 Samuel 6:17). The phrase to go “before the Lord” has consistently been employed for forms of worship in the tabernacle sanctuary.'
  - where: 'note 7:18 “David sat before the LORD”'
    claim: 'Saul spoke only of his smallness; David thanked God for particular blessings, and repeated the story of Egypt'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'In the past, Saul simply said, “Am not I a Benjamite, of the smallest of the tribes of Israel?” (1 Samuel 9:21). David, however, expressed his gratitude for particular blessings'
  - where: 'note 7:18 “David sat before the LORD”'
    claim: 'David’s response is astonishment and humility; the blessings flow from God’s goodness, not human merit'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'David’s response to the divine utterance delivered by Nathan is unreserved astonishment and humility'

  - where: 'note 7:19 “The manner of man”'
    claim: 'The Hebrew is tôrat hāʾādām'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'תּוֹרַ֥ת'
  - where: 'note 7:19 “The manner of man”'
    claim: 'BDB: torah here “custom, manner,” the manner of man, not of God; RV “law for man”; an emendation reads “generations of men”'
    key: bdb
    url: 'https://biblehub.com/hebrew/8451.htm'
    quote: '3 custom, manner: תּוֺרַת הָאָדָם 2 Samuel 7:19 the manner of man, not of God, i.e. deal with me as man with man, Thes, law for man RV, but EwGeschichte. iii. 180 reads דּוֺרֹת (וַתַּרְאֵנִי) hast shewed me generations of men'
  - where: 'note 7:19 “The manner of man”'
    claim: 'ESV: “this is instruction for mankind”'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+7:19&version=ESV'
    quote: 'and this is instruction for mankind, O Lord God!'
  - where: 'note 7:19 “The manner of man”'
    claim: 'NRSVue: “May this be instruction for the people,” meaning of Hebrew uncertain'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+7:19&version=NRSVUE'
    quote: 'May this be instruction for the people, O Lord God! … 7.19 Meaning of Heb uncertain'
  - where: 'note 7:19 “The manner of man”'
    claim: 'NIV: “this decree … is for a mere human,” or “for the human race”'
    key: niv
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+7:19&version=NIV'
    quote: 'and this decree,(A) Sovereign Lord, is for a mere human! … 2 Samuel 7:19 Or for the human race'
  - where: 'note 7:19 “The manner of man”'
    claim: 'Chronicles reads “regarded me according to the estate of a man of high degree”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/17?lang=eng'
    quote: 'and hast regarded me according to the estate of a man of high degree, O Lord God.'

  - where: christ
    claim: 'The promise is fulfilled in Jesus; Jesus is both promisor and fulfilment'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'The hope for a Messiah was the hope of the Davidic covenant. Christ is the one who covenanted to establish David’s seed and the one whose grace makes that establishment possible. Jesus is simultaneously the promisor and the fulfillment of the promise.'
  - where: christ
    claim: 'The covenant offers a pattern of recalling past mercies while trusting future grace'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'The Davidic covenant offers a pattern of recalling past mercies while trusting in future grace.'
  - where: explore
    claim: 'Taggart’s essay treats the covenant from 2 Samuel 7 to Christ'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'this study briefly examines how the loving-kindness God promises to the house of David finds its richest fulfillment in the life, ministry, and atonement of Jesus, the messianic ruler from David’s line.'
  - where: setting
    claim: 'Later prophets (Isaiah 11 and 55, Amos 9, Jeremiah 33) built their hope of restoration on the covenant'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'Like the psalmist, several later prophets reflected on the meaning of the Davidic covenant for a community in exile. Many focused on the hope of a future messianic Davidide who would restore Israel'
  - where: christ
    claim: 'The covenant applies to moments when lives and plans come to apparently devastating ends'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'The Davidic covenant can therefore have special applicability to the moments in which our own lives and plans come to apparently devastating ends'
