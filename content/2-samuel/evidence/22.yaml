chapter: 22
claims:
  # ---------- setting ----------
  - where: setting
    claim: 'On one older reading, chapters 21–24 set two divine punishments, lists of battles and of heroes as a framework around the poetical and prophetic portions (the psalm and the last words)'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/21.htm'
    quote: '(1) two divine punishments inflicted upon Israel, with the expiation of the sins that occasioned them … (2) David''s psalm of praise … and his last prophetic words … form, as it were, a historical framework for these poetical and prophetic portions.'
  - where: setting
    claim: 'On the same reading the famine of 21:1–14 happened earlier and is told here because no fitting place had come before'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/21.htm'
    quote: 'the famine, and the expiation connected with it (2 Samuel 21:1-14), happened most probably at an earlier period, and are merely introduced here because no fitting opportunity had presented itself before.'
  - where: setting
    claim: 'On the same reading the psalm is the kernel and centre of the last section, David looking back at the close of his life'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/21.htm'
    quote: 'The kernel and centre of this last section of the history of David is to be found unquestionably in the psalm of thanksgiving in 2 Samuel 22 … In the psalm of thanksgiving David looks back at the close of his life upon all the mercy and faithfulness'
  - where: setting
    claim: 'Hannah''s song and David''s psalm are read as bookends to the narrative of Samuel, Saul and David (a suggestion cited in a BYU Studies article)'
    key: olsen-birth-samuel
    url: 'https://byustudies.byu.edu/article/birth-and-calling-of-the-prophet-samuel-a-literary-reading-of-the-biblical-text'
    quote: 'Hannah’s song and David’s victory psalm “echo each other and act as formal ‘bookends’ to the extended narrative sequence that includes the stories of Samuel, Saul, and David.”'
  - where: setting
    claim: 'The same song stands in the Psalter as Psalm 18'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'The Lord is my rock, and my fortress, and my deliverer; my God, my strength, in whom I will trust; my buckler, and the horn of my salvation, and my high tower.'

  # ---------- thread ----------
  - where: thread
    claim: 'One older reading dates the song early in the reign, after Nathan''s promise, because of its tone and its expressions of integrity'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/22.htm'
    quote: 'Its composition may with much probability be assigned to the period of peace described in ch. 2 Samuel 7:1 … The free and joyous tone of the Psalm, and its bold expressions of conscious integrity, also point to the earlier years of David’s reign'
  - where: thread
    claim: 'Another older reading has David compose it in the later years of his reign'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/22.htm'
    quote: 'it was composed by David in the later years of his reign, when God had rescued him from all his foes, and helped his kingdom to victory over all the neighbouring heathen nations.'

  # ---------- section plains ----------
  - where: section 3 plain
    claim: '“Sorrows of hell” rendered as the cords of Sheol; “waves” as breakers'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/22.htm'
    quote: 'For breakers of death had compassed me, torrents of destruction were affrighting me, cords of Sheol had surrounded me, snares of death had encountered me.'
  - where: section 7 plain
    claim: 'A modern translation renders the last line of verse 27 “with the crooked you show yourself shrewd”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2%20Samuel%2022&version=NRSVUE'
    quote: 'with the pure you show yourself pure, and with the crooked you show yourself shrewd.'
  - where: section 8 plain
    claim: '“My strength and power” is rather “my strong fortress”; the bow is a bow of bronze, bent'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/22.htm'
    quote: 'my strength and power] Rather, my strong fortress. … so that a bow of steel, &c.] And mine arms bend a bow of bronze.'

  # ---------- note 22:1 ----------
  - where: 'note 22:1 “The same song as Psalm 18, in a second copy”'
    claim: 'The two copies differ in many single words and clauses that do not essentially change the meaning'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/22.htm'
    quote: 'This psalm is found in the Psalter as Psalm 18, though with many divergences in single words and clauses, which do not, however, essentially affect the meaning.'
  - where: 'note 22:1 “The same song as Psalm 18, in a second copy”'
    claim: 'The psalm opens with a line not in Samuel, and has “sorrows of death” and “did fly” where Samuel has “waves of death” and “was seen”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'I will love thee, O Lord, my strength. … The sorrows of death compassed me … And he rode upon a cherub, and did fly: yea, he did fly upon the wings of the wind.'
  - where: 'note 22:1 “The same song as Psalm 18, in a second copy”'
    claim: 'The words “my saviour; thou savest me from violence” of verse 3 are not in Psalm 18'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/22.htm'
    quote: 'The words, “and my retreat, my saviour, thou savest me from violence,” are omitted in Psalms 18.'
  - where: 'note 22:1 “The same song as Psalm 18, in a second copy”'
    claim: 'Samuel''s verb in 22:11 is wayyērāʾ, a Niphal of rāʾâ (Strong''s 7200), “he was seen”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: '<w lemma="c/7200" n="0.0" morph="HC/VNw3ms" id="10tdk">וַ/יֵּרָ֖א</w>'
  - where: 'note 22:1 “The same song as Psalm 18, in a second copy”'
    claim: 'The psalm''s verb in the same line is wayyēdeʾ, from dāʾâ (Strong''s 1675)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Ps.xml'
    quote: '<w lemma="c/1675" n="0.0" morph="HC/Vqw3ms" id="19bwc">וַ֝/יֵּ֗דֶא</w>'
  - where: 'note 22:1 “The same song as Psalm 18, in a second copy”'
    claim: 'The lexicon gives dāʾâ as “fly swiftly, dart,” used of the eagle, and sets Psalm 18:11 beside Samuel''s different verb'
    key: bdb
    url: 'https://biblehub.com/hebrew/1675.htm'
    quote: 'וַיֵּ֫דֶא Psalm 18:11(> "" 2 Samuel 22:11 וַיֵּרָא); fly swiftly, dart, of eagle Deuteronomy 28:49'
  - where: 'note 22:1 “The same song as Psalm 18, in a second copy”'
    claim: 'One older reading: the psalm keeps the true reading; the consonants are nearly alike, and the rarer word was easily changed to the commoner'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/22.htm'
    quote: 'The true reading is that preserved in Psalm 18:10, did fly, a peculiar word used of the swooping of an eagle … The consonants of the two words are so nearly alike (וידא–וירא), that the rarer word would be easily altered into the more common one.'
  - where: 'note 22:1 “The same song as Psalm 18, in a second copy”'
    claim: 'Another older reading counts “was seen” for “did fly” among deliberate alterations, not copyists'' carelessness'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/22.htm'
    quote: 'are not to be attributed to carelessness on the part of copyists, but are evidently alterations made with thoughtfulness and deliberation … or the substitution of ויּרא (He was seen, 2 Samuel 22:11) for ויּדא (He did fly)'
  - where: 'note 22:1 “The same song as Psalm 18, in a second copy”'
    claim: 'On that reading neither copy is the original unaltered; one was made for the Psalter''s liturgical use, the other when the song was put into the history, to be intelligible and true to the sense'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/22.htm'
    quote: 'neither of the two texts that have come down to us contains the original text of the psalm of David unaltered … one for the insertion of the psalm in the Psalter intended for liturgical use, and the other when it was incorporated into the history of David''s reign'
  - where: 'note 22:1 “The same song as Psalm 18, in a second copy”'
    claim: 'The historian''s aim was a form easily intelligible and true to the sense'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/22.htm'
    quote: 'not so much to give it with diplomatic literality, as to introduce it in a form that should be easily intelligible and true to the sense.'
  - where: 'note 22:1 “The same song as Psalm 18, in a second copy”'
    claim: 'On the same reading Samuel keeps the original in many places, the psalm the simpler forms, “waves of death” (v. 5) among them'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/22.htm'
    quote: 'the original reading has undoubtedly been retained in many passages of our text, whilst simpler and more common forms have been substituted in that of the Psalms; e.g., in v. 5, מות משׁבּרי'

  # ---------- note 22:29 ----------
  - where: 'note 22:29 “The LORD is the lamp”'
    claim: 'The psalm has the LORD light David''s lamp'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'For thou wilt light my candle: the Lord my God will enlighten my darkness.'
  - where: 'note 22:29 “The LORD is the lamp”'
    claim: 'The lamp (nēr) is a figure of prosperity; at 2 Sam. 21:17 it is embodied in David; Ps. 18:29 and 2 Sam. 22:29 are listed under the same sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/5216.htm'
    quote: 'figurative of prosperity יִשְׂרָאֵל ׳נ 2 Samuel 21:17 (embodied in David); also Job 18:6; Job 21:17; Job 29:3; Psalm 18:29 = 2 Samuel 22:29'
  - where: 'note 22:29 “The LORD is the lamp”'
    claim: 'David''s men swore he would not go out to battle again, “that thou quench not the light of Israel,” after Abishai saved him from a Philistine'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: 'But Abishai the son of Zeruiah succoured him, and smote the Philistine, and killed him. Then the men of David sware unto him, saying, Thou shalt go no more out with us to battle, that thou quench not the light of Israel.'
  - where: 'note 22:29 “The LORD is the lamp”'
    claim: 'The related noun nîr, “lamp,” is always figurative, for David''s family remaining on the throne (BDB prints the reference as 1 Kings 11:26; the verse with “that David my servant may have a light” is 11:36)'
    key: bdb
    url: 'https://biblehub.com/hebrew/5216.htm'
    quote: 'I. נִיר noun [masculine] lamp; — always figurative ׳לְמַעַן הֱיוֺתנֿ לְדָוִיד 1 Kings 11:26, i.e. that his family may remain on the throne; compare 1 Kings 15:4'
  - where: 'note 22:29 “The LORD is the lamp”'
    claim: 'The LORD leaves one tribe to Solomon''s son so that David may have a light always in Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/11?lang=eng'
    quote: 'And unto his son will I give one tribe, that David my servant may have a light alway before me in Jerusalem'

  # ---------- note 22:51 ----------
  - where: 'note 22:51 “Tower of salvation, or great deliverance”'
    claim: 'The Hebrew of 22:51 has a written form (ketiv) מגדיל, a Hiphil participle of gādal (Strong''s 1431), and a form to be read (qere) מִגְדּוֹל, “tower” (Strong''s 4024)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: '<w type="x-ketiv" lemma="1431" morph="HVhrmsc" id="10HLK">מגדיל</w><note type="variant"><catchWord>מגדיל</catchWord><rdg type="x-qere"><w lemma="4024 a" n="1.0" morph="HNcmsc" id="10BX2">מִגְדּ֖וֹל</w>'
  - where: 'note 22:51 “Tower of salvation, or great deliverance”'
    claim: 'The lexicon gives migdôl “tower” for the qere of 2 Sam. 22:51 and says the ketiv agrees with Psalm 18:51'
    key: bdb
    url: 'https://biblehub.com/hebrew/4024.htm'
    quote: 'מִגְדּוֺל noun masculine tower, 2 Samuel 22:51 Qr (Kt מגדיל = Psalm 18:51 מַגְדִּל).'
  - where: 'note 22:51 “Tower of salvation, or great deliverance”'
    claim: 'The Hiphil of gādal means “make great”; its participle is the word of Psalm 18:51'
    key: bdb
    url: 'https://biblehub.com/hebrew/1431.htm'
    quote: 'Participle מַגְדִּיל Psalm 18:51 ( = מִגְדֹּיל in "" 2 Samuel 22:51) … 1 make great'
  - where: 'note 22:51 “Tower of salvation, or great deliverance”'
    claim: 'The psalm''s line reads “Great deliverance giveth he to his king”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/18?lang=eng'
    quote: 'Great deliverance giveth he to his king; and sheweth mercy to his anointed, to David, and to his seed for evermore.'
  - where: 'note 22:51 “Tower of salvation, or great deliverance”'
    claim: 'A modern translation also reads “tower” in Samuel'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2%20Samuel%2022&version=NRSVUE'
    quote: 'He is a tower of salvation for his king and shows steadfast love to his anointed, to David and his descendants forever.'

  # ---------- christ ----------
  - where: christ
    claim: 'The last line refers to the promise of 2 Sam. 7:12–16 and claims God''s favour for David''s posterity'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/22.htm'
    quote: 'to his seed for evermore] A reference to the promise in ch. 2 Samuel 7:12-16, claiming the continued favour of God for his posterity.'
  - where: christ
    claim: 'Jehovah is often called the Rock in the Old Testament, and Jesus Christ can be called the Rock'
    key: sc-knowhy-332
    url: 'https://scripturecentral.org/knowhy/why-did-helaman-want-his-sons-to-remember-to-build-upon-the-rock'
    quote: 'The idea that Jesus Christ, the Son of God, can be called “the Rock” and provide refuge from the storm can be found in the Old Testament, where Jehovah is often referred to in this way'
  - where: christ
    claim: 'The KnoWhy reads 2 Sam. 22:47 in that light'
    key: sc-knowhy-332
    url: 'https://scripturecentral.org/knowhy/why-did-helaman-want-his-sons-to-remember-to-build-upon-the-rock'
    quote: 'This helps us understand better many similar scriptures, like the one in which King David cries out: “The Lord liveth; and blessed be my rock; and exalted be the God of the rock of my salvation” (2 Samuel 22:47).'
  - where: christ
    claim: 'Helaman names the rock as Christ and promises that the devil''s storms will have no power to drag down those built on it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/hel/5?lang=eng'
    quote: 'remember that it is upon the rock of our Redeemer, who is Christ, the Son of God, that ye must build your foundation … it shall have no power over you to drag you down'
