chapter: 3
claims:
  - where: setting
    claim: 'Abner, captain of Saul’s host, made Ish-bosheth king; Ish-bosheth reigned two years, David seven years and six months in Hebron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/2?lang=eng'
    quote: 'But Abner the son of Ner, captain of Saul’s host, took Ish-bosheth the son of Saul, and brought him over to Mahanaim … reigned two years. … seven years and six months.'
  - where: setting
    claim: 'Asahel, swift of foot, pursued Abner, was warned twice, and was killed with the hinder end of the spear'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/2?lang=eng'
    quote: 'Howbeit he refused to turn aside: wherefore Abner with the hinder end of the spear smote him under the fifth rib'
  - where: setting
    claim: 'Zeruiah was David’s sister; Joab was captain of David’s army'
    key: bd-joab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joab?lang=eng'
    quote: 'Eldest son of Zeruiah, David’s sister, and captain of David’s army.'
  - where: setting
    claim: 'Abner was captain of Saul’s army, made Ishbosheth king, slew Asahel, revolted to David, killed by Joab'
    key: bd-abner
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abner?lang=eng'
    quote: 'Captain of Saul’s army (1 Sam. 14:50; 17:55; 20:25; 26:5–15); makes Ishbosheth king (2 Sam. 2:8–9); defeated by Joab, slays Asahel (2:12–32); revolts to David (3:6–21); killed by Joab (3:27)'
  - where: setting
    claim: 'The tribes come to Hebron, the elders make a league before the LORD and anoint David over Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/5?lang=eng'
    quote: 'So all the elders of Israel came to the king to Hebron; and king David made a league with them in Hebron before the Lord: and they anointed David king over Israel.'
  - where: thread
    claim: 'The war was a state of hostility, not continual fighting; Ishbosheth too weak; David waited on the promise'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/3.htm'
    quote: '"The war" does not mean continual fighting, but the state of hostility … as Ishbosheth was too weak to be able to carry on the war, whilst David waited with firm reliance upon the promise of the Lord, until all Israel should come over to him.'
  - where: thread
    claim: 'The list of sons is a proof of the strengthening of David’s house, as a reign’s history begins with the king’s family'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/3.htm'
    quote: 'is very appropriately introduced here, as a practical proof of the strengthening of the house of David, in harmony with the custom of beginning the history of the reign of every king with certain notices concerning his family'
  - where: thread
    claim: 'The Lord is the principal actor in David’s rise'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'The Lord has been the principal actor in the story of David’s rise (2 Samuel 7:8–9; Psalm 78:70–71).'
  - where: thread
    claim: 'Those Abner had persuaded could have gone back to Ishbosheth at the news of his death'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'those whom Abner had persuaded to change their loyalty to David could easily have gone back to Ishbosheth at the news of Abner’s death.'

  - where: 'note 3:2 “Six sons in Hebron”'
    claim: 'Chronicles names Abigail’s son Daniel among the sons born in Hebron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/3?lang=eng'
    quote: 'Now these were the sons of David, which were born unto him in Hebron; the firstborn Amnon, of Ahinoam the Jezreelitess; the second Daniel, of Abigail the Carmelitess:'
  - where: 'note 3:2 “Six sons in Hebron”'
    claim: 'Absalom fled to Talmai king of Geshur'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/13?lang=eng'
    quote: 'But Absalom fled, and went to Talmai, the son of Ammihud, king of Geshur.'

  - where: 'note 3:7 “A claim to the throne”'
    claim: 'Approaching the royal concubines was tantamount to claiming the throne'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'Ishbosheth accused Abner of having an affair with one of Saul’s wives (see v. 7). To approach the royal concubines was tantamount to claiming the throne. It is little wonder Ishbosheth was concerned.'
  - where: 'note 3:7 “A claim to the throne”'
    claim: 'The successor alone had the right to the dead king’s concubines, inherited with his property'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/3.htm'
    quote: 'It was the exclusive right of the successor to the throne to cohabit with the concubines of the deceased king, who came down to him as part of the property which he inherited.'
  - where: 'note 3:7 “A claim to the throne”'
    claim: 'Taking the concubine was proof by Israelite notions that Abner aimed at the throne (2 Sam 16:21; 1 Kgs 2:21)'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/3.htm'
    quote: 'His appropriation of the concubine of the deceased monarch was at any rate a proof, according to Israelitish notions … that he was aiming at the throne (vid., 2 Samuel 16:21; 1 Kings 2:21).'
  - where: 'note 3:7 “A claim to the throne”'
    claim: 'Ahithophel’s counsel: all Israel shall hear that Absalom is abhorred of his father'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/16?lang=eng'
    quote: 'Go in unto thy father’s concubines, which he hath left to keep the house; and all Israel shall hear that thou art abhorred of thy father'
  - where: 'note 3:7 “A claim to the throne”'
    claim: 'Solomon hears Adonijah’s request for Abishag as a request for the kingdom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'And why dost thou ask Abishag the Shunammite for Adonijah? ask for him the kingdom also'

  - where: 'note 3:8 “A dog''s head for Judah”'
    claim: '“Am I a dog’s head of Judah” meant “Am I a traitor?”, which he soon proved to be'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'Abner’s question, “Am I a dog’s head of Judah,” meant, “Am I a traitor?” (v. 8). This he soon proved to be.'
  - where: 'note 3:8 “A dog''s head for Judah”'
    claim: 'The Hebrew reads “the head of a dog I that [is] unto Judah”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/2_samuel/3-8.htm'
    quote: 'hă·rōš הֲרֹ֨אשׁ … ke·leḇ כֶּ֥לֶב … ’ă·šer אֲשֶׁ֣ר that … lî·hū·ḏāh לִֽיהוּדָה֒ [is] unto Judah'
  - where: 'note 3:8 “A dog''s head for Judah”'
    claim: 'The Church’s footnote on “dog’s” points to 1 Sam. 17:43'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/3?lang=eng'
    quote: '8a “dog’s”: 1 Sam. 17:43.'

  - where: 'note 3:9 “What the LORD had sworn”'
    claim: '“God so do to me, and more also” is a self-curse oath formula, attested of Eli, Saul, Jonathan, Abner, David, Solomon'
    key: parker-cutting
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/cutting-covenants'
    quote: 'the individual probably repeated a phrase similar to self-curses in which a person said, “God so do to me, and more also,” signifying that the individual expected to be cursed if they did not live up to their oath. This self-curse formula is attested … among Israelites (Eli, Saul, Jonathan, Abner, David, Solomon)'
  - where: 'note 3:9 “What the LORD had sworn”'
    claim: 'Footnotes: “translate” OR transfer; “David” points to 1 Sam. 15:28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/3?lang=eng'
    quote: '10a “translate”: OR transfer.'
  - where: 'note 3:9 “What the LORD had sworn”'
    claim: 'Footnote 9a at “David” points to 1 Sam. 15:28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/3?lang=eng'
    quote: '9a “David”: 1 Sam. 15:28.'
  - where: 'note 3:9 “What the LORD had sworn”'
    claim: 'Samuel told Saul the kingdom was rent from him and given to a neighbour'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: 'The Lord hath rent the kingdom of Israel from thee this day, and hath given it to a neighbour of thine, that is better than thou.'

  - where: 'note 3:14 “Michal returned”'
    claim: 'David could justly demand Michal back, since Saul took her unjustly after the dowry was paid; and on political grounds, to show no hatred toward the fallen king'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/3.htm'
    quote: 'so that he could demand her back again with perfect justice, and Ishbosheth could not refuse to give her up to him, but probably on political grounds also, namely, because the renewal of his marriage to the king''s daughter would show to all Israel that he cherished no hatred in his heart towards the fallen king.'
  - where: 'note 3:14 “Michal returned”'
    claim: 'The demand went to Ish-bosheth; the return was a public act showing David’s strength and Ish-bosheth’s weakness'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/3.htm'
    quote: 'the formal demand was made from Ish-bosheth, who was powerless to resist the will of his master. Thus the restoration of Michal took place openly as a public act of justice; it clearly exhibited the strength of David and the weakness of Ish-bosheth'
  - where: 'note 3:14 “Michal returned”'
    claim: 'As Saul’s son-in-law David had a legitimate claim to the throne'
    key: ot-minute-1-samuel-18
    url: 'https://scripturecentral.org/archive/books/book-chapter/1-samuel-18'
    quote: 'David became Saul’s son-in-law and so had a legitimate claim to the throne, especially when so many of Saul’s sons would be killed'
  - where: 'note 3:14 “Michal returned”'
    claim: 'Michal’s story: 1 Sam 18; 25:44; 2 Sam 3:13–16; 6:16, 23'
    key: bd-michal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/michal?lang=eng'
    quote: 'Saul’s second daughter, wife of David (1 Sam. 14:49; 18:20, 27; 19:11–13, 17; 25:44; 2 Sam. 3:13–16; 6:16, 23).'
  - where: 'note 3:14 “Michal returned”'
    claim: 'Saul had given Michal to Phalti'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/25?lang=eng'
    quote: 'But Saul had given Michal his daughter, David’s wife, to Phalti the son of Laish, which was of Gallim.'

  - where: 'note 3:27 “For the blood of Asahel”'
    claim: 'The revenger of blood slays the murderer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/35?lang=eng'
    quote: 'The revenger of blood himself shall slay the murderer: when he meeteth him, he shall slay him.'
  - where: 'note 3:27 “For the blood of Asahel”'
    claim: 'David’s charge and Solomon’s verdict on Joab: blood of war in peace; two men more righteous; David not knowing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'whom he slew, and shed the blood of war in peace … who fell upon two men more righteous and better than he, and slew them with the sword, my father David not knowing thereof, to wit, Abner the son of Ner … and Amasa the son of Jether'
  - where: 'note 3:27 “For the blood of Asahel”'
    claim: 'Not justifiable as blood revenge since Asahel was killed in self-defence; a pretext to remove a rival; later murdered Amasa likewise'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/3.htm'
    quote: 'Since Abner had slain Asahel in self-defence (ch. 2 Samuel 2:23), Joab’s act was not justifiable on the score of blood-revenge. This was merely a convenient pretext for getting rid of a dangerous rival. … as on a later occasion he murdered his rival Amasa (ch. 2 Samuel 20:10).'
  - where: 'note 3:27 “For the blood of Asahel”'
    claim: 'Joab would lose position if Abner had the credit of bringing Israel to David'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/3.htm'
    quote: 'He foresaw that if he allowed Abner to have the credit of placing the crown of Israel on David’s head, he would lose his own position and influence.'

  - where: 'note 3:29 “The curse on Joab''s house”'
    claim: 'The verb zûb “have an issue,” usually of a man, is used at 2 Sam 3:29'
    key: bdb
    url: 'https://biblehub.com/hebrew/2100.htm'
    quote: '4 flow, of issue from woman (all P) … especially have an issue (flux, gleet), of woman Leviticus 15:25; and Leviticus 15:19 (תִּהְיֶה זָבָה); usually of man, 2 Samuel 3:29'
  - where: 'note 3:29 “The curse on Joab''s house”'
    claim: 'pelek at 2 Sam 3:29 is probably “whirl of spindle,” as in Prov 31:19'
    key: bdb
    url: 'https://biblehub.com/hebrew/6418.htm'
    quote: '1 whirl of spindle, 2 Samuel 3:29 (probably, see Dr), Proverbs 31:19'
  - where: 'note 3:29 “The curse on Joab''s house”'
    claim: 'The King James renders pelek “(di-)staff”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6418.htm'
    quote: 'KJV: (di-)staff, participle'
  - where: 'note 3:29 “The curse on Joab''s house”'
    claim: 'Read as “distaff holder,” the phrase would mean a weak, effeminate man unfit for war; the explanation may be forced, since the Septuagint and Targum support “staff”'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/3.htm'
    quote: 'the phrase may also be rendered as it is in the Vulgate “distaff holder” (tenens fusum). This would signify ‘a weak, effeminate man, unfit for war,’ … But this explanation seems forced, and the E. V. is supported by the Sept. and Targum.'
  - where: 'note 3:29 “The curse on Joab''s house”'
    claim: 'The Hebrew reads “who leans on a staff” and “falls by the sword”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/2_samuel/3-29.htm'
    quote: 'ū·ma·ḥă·zîq וּמַחֲזִ֥יק or who leans … bap·pe·leḵ בַּפֶּ֛לֶךְ on a staff … wə·nō·p̄êl וְנֹפֵ֥ל or falls … ba·ḥe·reḇ בַּחֶ֖רֶב by the sword'
  - where: 'note 3:29 “The curse on Joab''s house”'
    claim: 'The Septuagint reads “leans on a staff”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_samuel/3.htm'
    quote: 'let there not be wanting of the house of Joab one that has an issue, or a leper, or that leans on a staff, or that falls by the sword, or that wants bread.'
  - where: 'note 3:29 “The curse on Joab''s house”'
    claim: 'The law: a man with an issue is unclean'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/15?lang=eng'
    quote: 'When any man hath a running issue out of his flesh, because of his issue he is unclean.'
  - where: 'note 3:29 “The curse on Joab''s house”'
    claim: 'The leper dwells alone, without the camp'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/13?lang=eng'
    quote: 'he shall dwell alone; without the camp shall his habitation be.'
  - where: 'note 3:29 “The curse on Joab''s house”'
    claim: 'In Proverbs 31:19 the woman’s hands hold the distaff'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/prov/31?lang=eng'
    quote: 'She layeth her hands to the spindle, and her hands hold the distaff.'
  - where: 'note 3:29 “The curse on Joab''s house”'
    claim: 'Solomon’s sentence: their blood shall return upon Joab and his seed for ever (footnote 29a points there)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'Their blood shall therefore return upon the head of Joab, and upon the head of his seed for ever'

  - where: 'note 3:37 “Mourning before the people”'
    claim: 'David’s demonstration of innocence mattered politically, since those Abner persuaded could go back to Ishbosheth'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'David went to great lengths to demonstrate to the people that he had had nothing to do with Abner’s death (see vv. 28–38). This move was important politically, for those whom Abner had persuaded to change their loyalty to David could easily have gone back to Ishbosheth at the news of Abner’s death.'
  - where: 'note 3:37 “Mourning before the people”'
    claim: 'The lament: “as the death of a fool (nābāl) should die”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/2_samuel/3-33.htm'
    quote: 'hak·kə·mō·wṯ הַכְּמ֥וֹת As the death … nā·ḇāl נָבָ֖ל of a fool … yā·mūṯ יָמ֥וּת should die'
  - where: 'note 3:37 “Mourning before the people”'
    claim: 'Verse 34: hands not bound, feet not in fetters; fell before wicked men'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/2_samuel/3-34.htm'
    quote: 'yā·ḏe·ḵā יָדֶ֣ךָ Your hands … lō- לֹֽא־ not … ’ă·su·rō·wṯ, אֲסֻר֗וֹת were bound … lip̄·nê לִפְנֵ֥י before the face of … ḇə·nê- בְנֵֽי־ men … ‘aw·lāh עַוְלָ֖ה wicked'
  - where: 'note 3:37 “Mourning before the people”'
    claim: 'The text of the mourning and its effect'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/3?lang=eng'
    quote: 'For all the people and all Israel understood that day that it was not of the king to slay Abner the son of Ner.'

  - where: 'note 3:39 “Too hard for me”'
    claim: 'Joab, son of Zeruiah, David’s sister, captain of the army, generally faithful; put to death by Solomon for favouring Adonijah'
    key: bd-joab
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/joab?lang=eng'
    quote: 'He was closely associated with all the chief events of David’s reign and was generally faithful to his master. After David’s death he was in favor of Adonijah’s succession (1 Kgs. 2:28) and for that reason was put to death by Solomon (2:29–34).'
  - where: 'note 3:39 “Too hard for me”'
    claim: 'Zeruiah was the sister of David; her sons Abishai, Joab, Asahel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/2?lang=eng'
    quote: 'Whose sisters were Zeruiah, and Abigail. And the sons of Zeruiah; Abishai, and Joab, and Asahel, three.'
  - where: 'note 3:39 “Too hard for me”'
    claim: 'David’s charge to Solomon; Solomon’s reason: the innocent blood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'Do therefore according to thy wisdom, and let not his hoar head go down to the grave in peace. … that thou mayest take away the innocent blood, which Joab shed, from me, and from the house of my father.'

  - where: christ
    claim: 'Unable to punish Joab, David restricted himself to a curse and left the retribution to God'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/3.htm'
    quote: 'he was obliged to restrict himself at first to the utterance of a curse upon the deed (2 Samuel 3:29), and to leave the retribution to God.'
  - where: christ
    claim: 'The Father has committed all judgment to the Son; disciples say, let God judge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/64?lang=eng'
    quote: 'And ye ought to say in your hearts—let God judge between me and thee, and reward thee according to thy deeds.'
