page: died-for-thee
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'President Hinckley quoted 2 Sam. 18:33 as a father’s grief over a rebellious son'
    key: hinckley-what-god-hath-joined
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1991/04/what-god-hath-joined-together?lang=eng'
    quote: 'But when David heard of his son’s death, even though that son had conspired to destroy him, “the king was much moved, and went up to the chamber over the gate, and wept'
  - where: 'opening'
    claim: 'Elder Faust called David’s plea for his rebel son one of the most moving in scripture, of a father’s care for his children'
    key: faust-father-come-home
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1993/04/father-come-home?lang=eng'
    quote: 'The plea of David for his rebel son is one of the most moving in all of the scriptures, “O my son Absalom, my son, my son Absalom! would God I had died for thee, O Absalom, my son, my son!” (2 Sam. 18:33).'
  - where: 'opening'
    claim: 'Connection made by this page: 12:16, 18:33 and 24:17 are three attempts by the king, each in stronger words, to stand between death and those he loved (the child died; the wish came after Absalom was dead; the people were spared by an altar, not by the king’s life), while 18:3 and 21:17 guard his life as the one life not to be spent; the Good Shepherd of John 10:11 does what the shepherd of 24:17 asked, and the shepherd was himself one of the sheep who needed Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/24?lang=eng'
    quote: 'but these sheep, what have they done? let thine hand, I pray thee, be against me, and against my father’s house.'

  # ---------- Worth ten thousand of us ----------
  - where: 'section “Worth ten thousand of us”'
    claim: 'The footnote at 21:17 “go” points to 2 Sam. 18:3–4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/21?lang=eng'
    quote: '2 Sam. 18:3 (3–4)'
  - where: 'section “Worth ten thousand of us”'
    claim: 'Connection made by this page: the men who will die for the king (18:3; 21:17) are the “some” who would dare to die for a good man (Rom. 5:7); the command to deal gently (18:5) is what the king, kept from the field, sends in his place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/18?lang=eng'
    quote: 'but now thou art worth ten thousand of us'

  # ---------- For the child ----------
  - where: 'section “For the child”'
    claim: '“For the child” in 12:16 is the preposition bĕʿad (H1157)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'בְּעַ֣ד'
  - where: 'section “For the child”'
    claim: 'BDB glosses bĕʿad “on behalf of” after verbs of entreating and lists 2 Sam. 12:16 under that sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/1157.htm'
    quote: 'on behalf of (ὑπέρ); very frequently after הִתְמַּלֵּל Genesis 20:7; Numbers 21:7; 1 Samuel 7:5; Psalm 72:15 +; also with other verbs of entreating Exodus 8:24; 1 Samuel 7:9'
  - where: 'section “For the child”'
    claim: 'BDB lists 2 Sam. 12:16 under bĕʿad “on behalf of”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1157.htm'
    quote: 'see also 2 Samuel 10:12; 2 Samuel 12:16; Isaiah 37:4'
  - where: 'section “For the child”'
    claim: 'Infants who die are not held accountable for their parents’ actions'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'It is also important to keep in mind that infants who die are saved in the celestial kingdom and are not held accountable for their parents’ actions.'
  - where: 'section “For the child”'
    claim: 'Connection made by this page: the plea of 12:16 is the first and weakest of the three, and the death it would avert is traced by the text to David’s own deed (12:14)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'because by this deed thou hast given great occasion to the enemies of the Lord to blaspheme, the child also that is born unto thee shall surely die.'

  # ---------- Instead of thee ----------
  - where: 'section “Instead of thee”'
    claim: '“For thee” in 18:33 (Hebrew 19:1) is taḥat (H8478) with the 2ms suffix, in the phrase mî yittēn mûtî ʾănî taḥtêkā'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'תַחְתֶּ֔י/ךָ'
  - where: 'section “Instead of thee”'
    claim: '“Who would give my dying” in 18:33: mî yittēn (H4310, H5414) with the infinitive mûtî (H4191) and ʾănî (H589)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'מוּתִ/י֙'
  - where: 'section “Instead of thee”'
    claim: 'taḥat (H8478) is used in 10:1 of Hanun reigning “in his stead” (and in 17:25 of Amasa “instead of” Joab)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'תַּחְתָּֽי/ו'
  - where: 'section “Instead of thee”'
    claim: 'BDB lists 2 Sam. 19:1 (KJV 18:33) under taḥat in the sense “in place of, instead of,” the sense under which it also lists Gen. 22:13 and Gen. 44:33'
    key: bdb
    url: 'https://biblehub.com/hebrew/8478.htm'
    quote: 'in place of, instead of: (a) Genesis 2:18; Genesis 4:25 הֶבֶל ׳ת instead of Abel, Genesis 22:13 בְּנוֺ ׳ת, Genesis 30:2 אלהיס אנכי ׳הֲת (compare Genesis 50:19), Genesis 44:33; 2 Samuel 19:1 + often'
  - where: 'section “Instead of thee”'
    claim: 'Keil hears in 18:33 the excessive tenderness, or weakness, of David’s paternal affection, which kept him from seeing the justice of God'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/18.htm'
    quote: 'we must bear in mind not only the excessive tenderness, or rather weakness, of David''s paternal affection towards his son'
  - where: 'section “Instead of thee”'
    claim: 'Keil: David’s temperament prevented him from seeing the penal justice of God in Absalom’s death'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/18.htm'
    quote: 'this entirely prevented him from taking a just and correct view of the crime of his rebel son, which merited death, and of the penal justice of God which had been manifested in his destruction.'
  - where: 'section “Instead of thee”'
    claim: 'Taggart: David’s response may offer one glimpse into why God called him a man after His own heart; Moses 7:28–33 shows God as a parent who grieves'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'David’s moving response may offer one glimpse into why God had called David “a man after his own heart” (1 Samuel 13:14). Latter-day scripture reveals God as the kind of parent who similarly experiences grief for mortal pain and sorrow, even when it results from human rejection of divine invitations (Moses 7:28–33).'
  - where: 'section “Instead of thee”'
    claim: 'Madsen, summarizing B. H. Roberts: 18:33 is the soul cry of one who identifies with Christ and so with those who are His and those who refuse to become His'
    key: madsen-roberts-atonement
    url: 'https://rsc.byu.edu/archived/book-mormon-first-nephi-doctrinal-foundation/20-b-h-roberts-book-mormon-and-atonement'
    quote: 'The more one identifies with Christ, the more one identifies with those who are his and also those who refuse thus far to become his. Hence the soul cry, “Oh Absalom, my son! Would to God I had died for thee” (2 Samuel 18:33).'
  - where: 'section “Instead of thee”'
    claim: 'Rasmussen, in the Student Manual: what David would have given at the climax would have been needed much sooner'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'What David would have given at the climax to have voided the process would have been needed much sooner.'
  - where: 'section “Instead of thee”'
    claim: 'The Student Manual: Joab’s counsel was needed and justified'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'Though Joab’s counsel was needed and justified, his words were harsh and disrespectful'
  - where: 'section “Instead of thee”'
    claim: 'Connection made by this page: the wish of 18:33 is spoken in the word of Gen. 22:13 and 44:33 and after the fact; the command to deal gently (18:5) was the king’s one attempt to stand between his son and the sword; Joab’s reproach (19:6) names what the wish amounted to'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/19?lang=eng'
    quote: 'if Absalom had lived, and all we had died this day, then it had pleased thee well.'

  # ---------- Against me ----------
  - where: 'section “Against me”'
    claim: '“Against me” in 24:17 is the preposition bĕ with the 1cs suffix (bî), after yādĕkā, “thy hand”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'יָדְ/ךָ֛'
  - where: 'section “Against me”'
    claim: 'Keil on 24:17: the nation is innocent, not indeed free from every kind of blame, but only from the sin God was punishing by the pestilence'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/24.htm'
    quote: 'the nation is innocent; i.e., not indeed free from every kind of blame, but only from the sin which God was punishing by the pestilence.'
  - where: 'section “Against me”'
    claim: 'Keil: we must not infer that the people, innocent themselves, had to atone only for their king’s transgression'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/24.htm'
    quote: 'We must not infer, therefore, from this confession on the part of David, that the people, whilst innocent themselves, had had to atone only for an act of transgression on the part of their king.'
  - where: 'section “Against me”'
    claim: 'Connection made by this page: the three prepositions step up (bĕʿad, taḥat, bĕ: for, instead of, against); in both tellings “It is enough” (24:16; 1 Chr. 21:15) comes before the offer (24:17; 1 Chr. 21:17), the text never says the offer was refused or that the hand fell on the king, and the people are spared after the altar and the offering (24:18, 24–25; 1 Chr. 21:27), so “not on thy people” was granted and what spared them was the offering, not the king’s life; the king who asked to be the offering brought the burnt offering, a similitude of the Only Begotten’s sacrifice (Moses 5:7)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/24?lang=eng'
    quote: 'Go up, rear an altar unto the Lord in the threshingfloor of Araunah the Jebusite.'
  - where: 'section “Against me”'
    claim: 'Moses 5:7: the angel told Adam that the burnt offering is a similitude of the sacrifice of the Only Begotten'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/moses/5?lang=eng'
    quote: 'And then the angel spake, saying: This thing is a similitude of the sacrifice of the Only Begotten of the Father, which is full of grace and truth.'

  # ---------- Why the king could not ----------
  - where: 'section “Why the king could not”'
    claim: 'Jesus Christ, as the Only Begotten Son of God and the only sinless person to live on this earth, was the only one capable of making an atonement for mankind'
    key: bd-atonement
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/atonement?lang=eng'
    quote: 'Jesus Christ, as the Only Begotten Son of God and the only sinless person to live on this earth, was the only one capable of making an atonement for mankind.'
  - where: 'section “Why the king could not”'
    claim: 'Elder Oaks: because of our sins and our mortality, we, like Isaac, are condemned to death'
    key: oaks-1992-bible-stories
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1992/10/bible-stories-and-personal-protection?lang=eng'
    quote: 'Because of our sins and our mortality, we, like Isaac, are condemned to death.'
  - where: 'section “Why the king could not”'
    claim: 'Connection made by this page: in all three scenes the death David would take on himself is one his own act brought on (12:14; 12:11; 24:10); a mortal can die in another’s place (Rom. 5:7; Ex. 32:32; David’s men) but no mortal can atone (Alma 34:10–14; the Bible Dictionary; John 10:18), not even a sinless one; so the scenes show not a quality the king lacked but that the shepherd who would die for his sheep was himself, by his own confession, among the unjust for whom the just One died (1 Pet. 3:18)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/34?lang=eng'
    quote: 'Now there is not any man that can sacrifice his own blood which will atone for the sins of another.'

  # ---------- The Good Shepherd ----------
  - where: 'section “The Good Shepherd”'
    claim: 'Taggart: the shepherd-king is the basis of Ezekiel 34’s hope, and Jesus as the Good Shepherd fulfills the expectation of a king who feeds and cares for his people'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'When Jesus comes as the Good Shepherd, he fulfills this messianic expectation of a king who feeds and cares for his people (see John 10).'
  - where: 'section “The Good Shepherd”'
    claim: 'Bowen: Jesus, one of David’s “father’s house,” later suffers and dies very near this site for David’s sins and the sins of all humanity'
    key: bowen-mount-lord-provided
    url: 'https://interpreterfoundation.org/journal/in-the-mount-of-the-lord-it-shall-be-seen-and-provided-theophany-and-sacrifice-as-the-etiological-foundation-of-the-temple-in-israelite-and-latter-day-saint-tradit'
    quote: 'Jesus, one of David’s “father’s house,” later suffers and dies very near this site both for David’s sins and the sins of all humanity (see below).'
  - where: 'section “The Good Shepherd”'
    claim: 'Bowen: the name Moriah occurs only in Gen. 22:2 and 2 Chr. 3:1'
    key: bowen-mount-lord-provided
    url: 'https://interpreterfoundation.org/journal/in-the-mount-of-the-lord-it-shall-be-seen-and-provided-theophany-and-sacrifice-as-the-etiological-foundation-of-the-temple-in-israelite-and-latter-day-saint-tradit'
    quote: 'The name “Moriah” occurs only in these two passages.'
  - where: 'section “The Good Shepherd”'
    claim: 'The Bible Dictionary: the identity of the temple hill with the Moriah of Gen. 22 is a tradition first recorded by Josephus'
    key: bd-moriah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moriah?lang=eng'
    quote: 'Mount Moriah, the hill on which Solomon built the temple (2 Chr. 3:1); a tradition first recorded by the Jewish historian Josephus, who regards this as identical with (1).'
  - where: 'section “The Good Shepherd”'
    claim: 'The Cambridge Bible: the identification of the temple hill with the Moriah of Gen. 22 has been questioned'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/24.htm'
    quote: 'This Mount Moriah was identified by Jewish tradition (e.g. Josephus Ant. VII. 13. 4) with the mountain in the land of Moriah which was the scene of the sacrifice of Isaac (Genesis 22:2 ff.), but the identification has been questioned.'
  - where: 'section “The Good Shepherd”'
    claim: 'Elder Oaks: the story shows God’s goodness in providing a substitute so Isaac would not have to die'
    key: oaks-1992-bible-stories
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1992/10/bible-stories-and-personal-protection?lang=eng'
    quote: 'This story also shows the goodness of God in protecting Isaac and in providing a substitute so he would not have to die.'
  - where: 'section “The Good Shepherd”'
    claim: 'Elder Oaks: when all other hope is gone, our Father in Heaven provides the Lamb of God'
    key: oaks-1992-bible-stories
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1992/10/bible-stories-and-personal-protection?lang=eng'
    quote: 'When all other hope is gone, our Father in Heaven provides the Lamb of God, and we are saved by his sacrifice.'
  - where: 'section “The Good Shepherd”'
    claim: 'Connection made by this page: the shepherd who said “let thine hand be against me” (24:17) and was told to rear an altar is answered by the Shepherd who said “I lay it down of myself” (John 10:18) and was not told to bring anything in His place'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/10?lang=eng'
    quote: 'No man taketh it from me, but I lay it down of myself.'
  - where: 'section “The Good Shepherd”'
    claim: 'Connection made by this page: Joab’s complaint that the king’s friends would all have died so that one who hated him might live (19:6), set beside Rom. 5:7–8, 10: what Joab named as a king’s fault Paul names as the love of God; Absalom is the king’s enemy in the Cushite’s words (18:32); David could wish after the fact that he had died for his enemy, and Christ did it for His; king and Son alike in willingness (D&C 19:18–19), and what the Son had is what Amulek and the Bible Dictionary name'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/rom/5?lang=eng'
    quote: 'For if, when we were enemies, we were reconciled to God by the death of his Son'
  - where: 'section “The Good Shepherd”'
    claim: 'Connection made by this page: David asked that the hand fall on him and his father’s house (24:17); Jesus is of that house (Luke 1:32) and, in Bowen’s reading, suffered near the site; the page reads what came of David’s house not as the blow the king asked for nor as a punishment on his line, but as the Father’s gift (John 3:16)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/3?lang=eng'
    quote: 'For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.'
  - where: 'section “The Good Shepherd”'
    claim: 'Connection made by this page: the Chronicler’s naming (2 Chr. 3:1) sets David’s altar under the name of the place where a father was given a ram “in the stead of” (taḥat) his son; Abraham did not supply the ram and David could not supply a substitute from himself; God provides it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/3?lang=eng'
    quote: 'Then Solomon began to build the house of the Lord at Jerusalem in mount Moriah, where the Lord appeared unto David his father, in the place that David had prepared in the threshingfloor of Ornan the Jebusite.'

  # ---------- What we bring ----------
  - where: 'section “What we bring”'
    claim: 'President Faust quoted 18:33 to parents of rebellious children: the grief of a parent over a rebellious child is almost inconsolable'
    key: faust-dear-sheep
    url: 'https://www.churchofjesuschrist.org/study/liahona/2013/06/dear-are-the-sheep-that-have-wandered?lang=eng'
    quote: 'The grief of a parent over a rebellious child is almost inconsolable. King David’s third son, Absalom, killed one of his brothers and also led a rebellion against his father.'
  - where: 'section “What we bring”'
    claim: 'President Faust to such parents: the Good Shepherd is watching over them; there is hope'
    key: faust-dear-sheep
    url: 'https://www.churchofjesuschrist.org/study/liahona/2013/06/dear-are-the-sheep-that-have-wandered?lang=eng'
    quote: 'we say to you, the Good Shepherd is watching over them. God knows and understands your deep sorrow. There is hope.'
  - where: 'section “What we bring”'
    claim: 'Elder Holland: no one has traveled beyond the reach of divine love; it is not possible to sink lower than the light of Christ’s Atonement shines'
    key: holland-laborers
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/04/the-laborers-in-the-vineyard?lang=eng'
    quote: 'however far from home and family and God you feel you have traveled, I testify that you have not traveled beyond the reach of divine love. It is not possible for you to sink lower than the infinite light of Christ’s Atonement shines.'
  - where: 'section “What we bring”'
    claim: 'Elder Maxwell: the submission of one’s will is the only uniquely personal thing we have to place on God’s altar'
    key: maxwell-swallowed-up
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1995/10/swallowed-up-in-the-will-of-the-father?lang=eng'
    quote: 'the submission of one’s will is really the only uniquely personal thing we have to place on God’s altar.'
  - where: 'section “What we bring”'
    claim: 'Connection made by this page: a parent who would die for a wandering child has David’s wish and David’s limit, and is, like David, among those the rescue was made for; what a disciple brings is what David brought at the end, an offering that costs (24:24; Omni 1:26), not himself as a substitute, to the One who was'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/omni/1?lang=eng'
    quote: 'come unto him, and offer your whole souls as an offering unto him'
