chapter: 8
claims:
  - where: when
    claim: 'The chapter surveys the wars of David’s whole reign'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/8.htm'
    quote: 'the chapter before us not only treats of the wars which David carried on after receiving the divine promise mentioned in 2 Samuel 7, but of all the wars of his entire reign'
  - where: setting
    claim: 'The survey of wars is appended to the promise of chapter 7 and includes all the nations David conquered'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/8.htm'
    quote: 'To the promise of the establishment of this throne there is appended a general enumeration of the wars by which David secured the supremacy of Israel over all his enemies round about.'
  - where: setting
    claim: 'Only the Ammonite and Syrian war gets a fuller account later (chapters 10–11), because of its connection with David’s adultery'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/8.htm'
    quote: 'The only one of which we have afterwards a fuller account is the war with the Ammonites and their allies the Syrians (2 Samuel 10 and 11), and this is given on account of its connection with David''s adultery.'
  - where: setting
    claim: 'The events are grouped by subject, not strictly by time'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/8.htm'
    quote: 'the arrangement of the several events is not strictly regulated by their chronological order, but that homogeneous events are grouped together according to a material point of view'
  - where: setting
    claim: '“After this” is a formula of transition, not a strict chronology; the periods of the wars are not stated'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/8.htm'
    quote: 'At what periods of his reign they were waged is not stated. As has been already implied in the note on ch. 2 Samuel 7:1, it seems best to consider the words “and after this it came to pass” as a general formula of transition'
  - where: setting
    claim: 'A second list of David’s officers stands at 20:23–26, and Solomon’s at 1 Kgs. 4:1–6'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/8.htm'
    quote: 'Another list of these officers is given in ch. 2 Samuel 20:23-26 : on the differences between them see notes there. A similar list of Solomon’s officers is to be found in 1 Kings 4:1-6.'
  - where: setting
    claim: 'Chronicles tells the chapter again (1 Chr. 18)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/18?lang=eng'
    quote: 'Now after this it came to pass, that David smote the Philistines, and subdued them, and took Gath and her towns out of the hand of the Philistines.'
  - where: thread
    claim: '“Gat him a name” (8:13) means won renown, and recalls 7:9'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/8.htm'
    quote: 'gat him a name] Won renown. Cp. ch. 2 Samuel 7:9.'

  - where: 'note 8:1 “The bridle of the mother city”'
    claim: 'Metheg is “bridle”; in 2 Sam. 8:1 it is figurative, “authority of the mother city”; some omit it as corrupt'
    key: bdb
    url: 'https://biblehub.com/hebrew/4964.htm'
    quote: '2 figurative = control, authority, only in הָאַמָּה ׳מ 2 Samuel 8:1authority of the mother city, according to MV Buhl, of especially We Dr; Bu omit as corrupt'
  - where: 'note 8:1 “The bridle of the mother city”'
    claim: 'Metheg literally a bridle for animals'
    key: bdb
    url: 'https://biblehub.com/hebrew/4964.htm'
    quote: 'noun masculine bridle'
  - where: 'note 8:1 “The bridle of the mother city”'
    claim: 'The Hebrew of 8:1 reads metheg ha-ammah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'הָ/אַמָּ֖ה'
  - where: 'note 8:1 “The bridle of the mother city”'
    claim: 'Chronicles: David took Gath and her towns'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/18?lang=eng'
    quote: 'took Gath and her towns out of the hand of the Philistines'

  - where: 'note 8:2 “Moab measured with a line”'
    claim: 'The prisoners were made to lie down in rows measured with a line; two thirds executed, one third spared; why David did this to a nation that sheltered his parents can only be conjectured'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/8.htm'
    quote: 'Two thirds of them were executed, and only the remaining third spared. Why David inflicted such terrible vengeance on a nation which had once received him and given his parents an asylum (1 Samuel 22:3-4) can only be conjectured.'
  - where: 'note 8:2 “Moab measured with a line”'
    claim: 'A Jewish tradition says the king of Moab murdered David’s parents; possibly some treachery in a war'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/8.htm'
    quote: 'A Jewish tradition relates that the king of Moab betrayed his trust and murdered David’s parents. Possibly the Moabites may have been guilty of some special act of treachery in one of David’s wars with their neighbours the Ammonites or Edomites.'
  - where: 'note 8:2 “Moab measured with a line”'
    claim: 'The victory fulfilled Balaam’s prophecy (Num. 24:17); Moab later paid tribute to Ahab and rebelled (2 Kgs. 3:4)'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/8.htm'
    quote: 'By this victory Balaam’s prophecy was fulfilled (Numbers 24:17).'
  - where: 'note 8:2 “Moab measured with a line”'
    claim: 'Doubtless only the fighting men'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/8.htm'
    quote: 'The Moabite prisoners, doubtless only the fighting men, were ordered to lie down upon the ground in rows, which were measured with a measuring line.'
  - where: 'note 8:2 “Moab measured with a line”'
    claim: 'The footnote at Moab points to Num. 24:17 and to Moab’s later rebellion (2 Kgs. 1:1; 3:5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/8?lang=eng'
    quote: 'And he smote Moab, and measured them with a line, casting them down to the ground'
  - where: 'note 8:2 “Moab measured with a line”'
    claim: 'The Church’s footnote reads the measuring as selection by size, the taller and stronger put to death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/8?lang=eng'
    quote: 'He apparently determined their size and put the taller, stronger to death.'

  - where: 'note 8:3 “As far as the Euphrates”'
    claim: 'The Euphrates was the boundary of the land promised to Abraham’s seed; it was reached in David’s time'
    key: bd-euphrates
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/euphrates?lang=eng'
    quote: 'It was the boundary of the land promised to the seed of Abraham (Gen. 15:18; Deut. 1:7; Josh. 1:4; 1 Chr. 5:9); this boundary was reached in the time of David (2 Sam. 8:3; 1 Chr. 18:3).'
  - where: 'note 8:3 “As far as the Euphrates”'
    claim: 'Under David the kingdom reached the extent of the promise to Abraham'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'Under David’s leadership the kingdom expanded to the extent of God’s promise to Abraham (see Genesis 15:18).'
  - where: 'note 8:3 “As far as the Euphrates”'
    claim: 'NRSVue: “to restore his monument at the River Euphrates”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+8&version=NRSVUE'
    quote: 'as he went to restore his monument at the River Euphrates'
  - where: 'note 8:3 “As far as the Euphrates”'
    claim: 'Chronicles: “to stablish his dominion by the river Euphrates”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/18?lang=eng'
    quote: 'as he went to stablish his dominion by the river Euphrates'

  - where: 'note 8:6 “The LORD gave the victory”'
    claim: '“Preserved” is the verb yasha'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'וַ/יֹּ֤שַׁע'
  - where: 'note 8:6 “The LORD gave the victory”'
    claim: 'Yasha: deliver, save; with God as subject, give victory to (1 Chr. 18:6, 13)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3467.htm'
    quote: 'b. of God, with לְ person, subject יָמִין Psalm 98:1; זְרוֺעַ Isaiah 59:16; Isaiah 63:5; Yahweh 1 Chronicles 18:6, with accusative 1 Chronicles 18:13'
  - where: 'note 8:6 “The LORD gave the victory”'
    claim: 'BDB sense 3: give victory to'
    key: bdb
    url: 'https://biblehub.com/hebrew/3467.htm'
    quote: '3 give victory to:'
  - where: 'note 8:6 “The LORD gave the victory”'
    claim: 'Yasha used of heroic men saving the nation in war, called saviours'
    key: bdb
    url: 'https://biblehub.com/hebrew/3467.htm'
    quote: 'a. of heroic men, saving the nation in war Judges 3:31; Judges 6:15; Judges 10:1; 1 Samuel 10:27; Hosea 13:10; Jeremiah 14:9; these are named מוֺשִׁיעַ saviour'
  - where: 'note 8:6 “The LORD gave the victory”'
    claim: 'NRSVue: “The Lord gave victory to David wherever he went”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+8&version=NRSVUE'
    quote: 'And the Lord gave victory to David wherever he went.'

  - where: 'note 8:11 “Spoil for a house not yet built”'
    claim: 'Solomon brought in what David had dedicated and put it among the temple treasures; Chronicles: the brass made the brasen sea; the Levites kept the dedicated spoil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/7?lang=eng'
    quote: 'And Solomon brought in the things which David his father had dedicated; even the silver, and the gold, and the vessels, did he put among the treasures of the house of the Lord.'
  - where: 'note 8:11 “Spoil for a house not yet built”'
    claim: 'Brass from Hadadezer’s cities, wherewith Solomon made the brasen sea'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/18?lang=eng'
    quote: 'brought David very much brass, wherewith Solomon made the brasen sea, and the pillars, and the vessels of brass.'
  - where: 'note 8:11 “Spoil for a house not yet built”'
    claim: 'Out of the spoils won in battles they dedicated to maintain the house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/26?lang=eng'
    quote: 'Out of the spoils won in battles did they dedicate to maintain the house of the Lord.'

  - where: 'note 8:13 “Syrians, or Edomites?”'
    claim: 'The Hebrew of 8:13 reads Aram'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'אֲרָ֖ם'
  - where: 'note 8:13 “Syrians, or Edomites?”'
    claim: 'Chronicles: Abishai slew of the Edomites in the valley of salt eighteen thousand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/18?lang=eng'
    quote: 'Moreover Abishai the son of Zeruiah slew of the Edomites in the valley of salt eighteen thousand.'
  - where: 'note 8:13 “Syrians, or Edomites?”'
    claim: 'The Septuagint reads Idumea (Edom)'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_samuel/8.htm'
    quote: 'And David made himself a name: and when he returned he smote Idumea in Gebelem to the number of eighteen thousand.'
  - where: 'note 8:13 “Syrians, or Edomites?”'
    claim: 'NRSVue reads Edomites'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+8&version=NRSVUE'
    quote: 'he killed eighteen thousand Edomites in the Valley of Salt'
  - where: 'note 8:13 “Syrians, or Edomites?”'
    claim: 'The text is certainly corrupt; Chronicles has Abishai smiting Edom'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/8.htm'
    quote: 'when he returned from smiting of the Syrians] The text is certainly corrupt.'
  - where: 'note 8:13 “Syrians, or Edomites?”'
    claim: 'The Hebrew letters d and r are easily confused (Hadadezer/Hadarezer); Aram and Edom are easily confused'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/8.htm'
    quote: 'the letters d (ד) and r (ר) being easily confused in Hebrew'
  - where: 'note 8:13 “Syrians, or Edomites?”'
    claim: 'At 8:12 Chronicles and the Septuagint read Edom for Aram; the two names are easily confused'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/8.htm'
    quote: 'Chr. and the Sept. agree in reading Edom instead of Aram (Syria). The two names are easily confused'

  - where: 'note 8:17 “Ahimelech the son of Abiathar”'
    claim: 'Ahimelech and Abiathar are probably interchanged in 2 Sam. 8:17 and Chronicles; Abiathar escaped Saul, abode with David, was thrust out after Adonijah'
    key: bd-abiathar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abiathar?lang=eng'
    quote: 'Ahimelech and Abiathar are probably interchanged in 2 Sam. 8:17; 1 Chr. 18:16; 24:3, 31.'
  - where: 'note 8:17 “Ahimelech the son of Abiathar”'
    claim: 'Abiathar, son of Ahimelech, escaped Saul and abode with David; took part in Adonijah’s rebellion and was thrust out'
    key: bd-abiathar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abiathar?lang=eng'
    quote: 'abides with David (23:6, 9; 30:7); brings the ark back to Jerusalem (2 Sam. 15:24–36; 17:15; 19:11); takes part in Adonijah’s rebellion (1 Kgs. 1:7); is thrust out from the priesthood (2:27, 35'
  - where: 'note 8:17 “Ahimelech the son of Abiathar”'
    claim: 'Zadok of the family of Eleazar; a double high priesthood, Abiathar in David’s camp and Zadok at Gibeon, continued after David’s accession; Zadok finally put in Abiathar’s place'
    key: bd-zadok
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zadok?lang=eng'
    quote: 'During the latter years of Saul’s reign there seems to have been a double high priesthood: Abiathar, who belonged to the family of Ithamar, officiating in David’s camp, and Zadok at Gibeon, where the tabernacle was standing. This arrangement continued after David’s accession'
  - where: 'note 8:17 “Ahimelech the son of Abiathar”'
    claim: 'Zadok belonged to the family of Eleazar; finally put in the room of Abiathar'
    key: bd-zadok
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/zadok?lang=eng'
    quote: 'He belonged to the family of Eleazar (1 Chr. 6:4–8).'
  - where: 'note 8:17 “Ahimelech the son of Abiathar”'
    claim: 'Abiathar the son of Ahimelech escaped Nob and fled to David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/22?lang=eng'
    quote: 'And one of the sons of Ahimelech the son of Ahitub, named Abiathar, escaped, and fled after David.'

  - where: 'note 8:18 “David’s sons as priests”'
    claim: 'The footnote: Hebrew priests; apparently civil ministers here'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/8?lang=eng'
    quote: 'HEB priests; apparently, in this case, civil ministers.'
  - where: 'note 8:18 “David’s sons as priests”'
    claim: 'The Hebrew word is kohanim'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'כֹּהֲנִ֥ים'
  - where: 'note 8:18 “David’s sons as priests”'
    claim: 'BDB: probably chieftains exercising priestly functions, like the priest of Midian; so David’s sons, his grandson (1 Kgs. 4:5) and Ira the Jairite (2 Sam. 20:26)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3548.htm'
    quote: 'or a chieftain (exercising priestly functions) כֹּהֵן מִדְיָן Exodus 2:16; Exodus 3:1; Exodus 18:1 (all J E); so also probably the sons of David 2 Samuel 8:18, his grandson 1 Kings 4:5, and Ira the Jairite 2 Samuel 20:26, who as princes performed priestly functions.'
  - where: 'note 8:18 “David’s sons as priests”'
    claim: 'Chronicles: the sons of David were chief about the king'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/18?lang=eng'
    quote: 'and the sons of David were chief about the king.'
  - where: 'note 8:18 “David’s sons as priests”'
    claim: 'Septuagint: princes of the court'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_samuel/8.htm'
    quote: 'and the Chelethite and the Phelethite, and the sons of David, were princes of the court.'
  - where: 'note 8:18 “David’s sons as priests”'
    claim: 'NRSVue: David’s sons were priests'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+8&version=NRSVUE'
    quote: 'and David’s sons were priests.'
  - where: 'note 8:18 “David’s sons as priests”'
    claim: 'The law gives the priest’s office to Aaron and his sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/3?lang=eng'
    quote: 'And thou shalt appoint Aaron and his sons, and they shall wait on their priest’s office'

  - where: 'note 8:18 “The king’s guard”'
    claim: 'Kerethites: a name for Philistines or a part of them, perhaps Cretans; soldiers of David’s guard'
    key: bdb
    url: 'https://biblehub.com/hebrew/3774.htm'
    quote: 'Kerethites, a name for Philistines or a part of them (perhaps = Cretans'
  - where: 'note 8:18 “The king’s guard”'
    claim: 'Kerethites: soldiers of David’s guard, 2 Sam. 8:18; 15:18; 20:7, 23; 1 Kgs. 1:38, 44'
    key: bdb
    url: 'https://biblehub.com/hebrew/3774.htm'
    quote: 'of soldiers of David''s guard'
  - where: 'note 8:18 “The king’s guard”'
    claim: 'Pelethites: from an unknown proper name; only with the Kerethites, of David’s guard'
    key: bdb
    url: 'https://biblehub.com/hebrew/6432.htm'
    quote: 'adjective, of a people from unknown proper name; only with article as collective noun with הַכְּרֵתִי (q. v.) of David''s guard'
  - where: 'note 8:18 “The king’s guard”'
    claim: 'The Cherethites and Pelethites escorted Solomon to Gihon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/1?lang=eng'
    quote: 'So Zadok the priest, and Nathan the prophet, and Benaiah the son of Jehoiada, and the Cherethites, and the Pelethites, went down, and caused Solomon to ride upon king David’s mule, and brought him to Gihon.'

  - where: christ
    claim: '“Judgment and justice” shows David as the representative of Jehovah and a type of the Messianic King (Isa. 9:7; Jer. 23:5–6)'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/8.htm'
    quote: 'Proving himself the true representative of Jehovah, whose attributes these are (Psalm 33:5; Psalm 89:14); and a true type of the perfect Messianic King (Isaiah 9:7; Isaiah 32:1; Jeremiah 23:5-6).'
  - where: christ
    claim: 'The LORD gave David victory (yasha, to save)'
    key: bdb
    url: 'https://biblehub.com/hebrew/3467.htm'
    quote: '1 deliver, save (properly give width and breadth to, liberate), in peril'
