chapter: 6
claims:
  - where: setting
    claim: 'Baale of Judah is Baalah, which is Kirjath-jearim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/15?lang=eng'
    quote: 'the border was drawn to Baalah, which is Kirjath-jearim'
  - where: setting
    claim: 'Chronicles says David went to Baalah, that is, Kirjath-jearim; David gives his reason for bringing the ark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/13?lang=eng'
    quote: 'And David went up, and all Israel, to Baalah, that is, to Kirjath-jearim, which belonged to Judah'
  - where: setting
    claim: 'David''s reason in Chronicles: they had not inquired at the ark in the days of Saul'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/13?lang=eng'
    quote: 'And let us bring again the ark of our God to us: for we inquired not at it in the days of Saul.'
  - where: setting
    claim: 'With the new capital between north and south, the next step was to make Jerusalem the religious center'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'With a new capital at the center of the northern and southern territories, the next step was to make Jerusalem the religious center of the kingdom.'
  - where: thread
    claim: 'The ark was a symbol of God''s presence'
    key: scripture-helps-1-samuel-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/23-1-samuel-17-18-24-26-2-samuel-5-7?lang=eng'
    quote: 'The ark of the covenant was a symbol of God’s presence, His glory, and His majesty.'
  - where: thread
    claim: 'David''s own explanation of the first failure'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/15?lang=eng'
    quote: 'the Lord our God made a breach upon us, for that we sought him not after the due order.'
  - where: 'note 6:3 “A cart, as the Philistines had sent it”'
    claim: 'On one older reading Israel followed the Philistines'' example of a new cart instead of the law'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/6.htm'
    quote: 'they had followed the example of the Philistines when they sent back the ark (1 Samuel 6:7.), and had placed it upon a new cart'
  - where: 'note 6:3 “A cart, as the Philistines had sent it”'
    claim: 'The Kohathites received no wagons, because they bore the holy things on their shoulders'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/7?lang=eng'
    quote: 'But unto the sons of Kohath he gave none: because the service of the sanctuary belonging unto them was that they should bear upon their shoulders.'
  - where: 'note 6:6 ““Steadying the ark” in latter-day revelation”'
    claim: 'D&C 85:8 speaks of a man who puts forth his hand to steady the ark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/85?lang=eng'
    quote: 'While that man, who was called of God and appointed, that putteth forth his hand to steady the ark of God, shall fall by the shaft of death'
  - where: 'note 6:6 ““Steadying the ark” in latter-day revelation”'
    claim: 'The footnote at D&C 85:8 points back to 2 Sam. 6:6–7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/85?lang=eng'
    quote: '2 Sam. 6:6 (6–7); 1 Chr. 13:10 (9–12)'
  - where: 'note 6:6 ““Steadying the ark” in latter-day revelation”'
    claim: 'The Doctrine and Covenants refers to Uzzah''s steadying the ark among Old Testament stories it reaffirms'
    key: esplin-ot-relevancy
    url: 'https://rsc.byu.edu/vol-8-no-3-2007/old-testament-relevancy-reaffirmed-restoration-scripture'
    quote: 'It also refers to Old Testament stories, including the Fall of Adam and Eve, Enoch’s translation, Moses’s parting the Red Sea, and Uzzah’s steadying the ark of the covenant.'
  - where: 'note 6:6 ““Steadying the ark” in latter-day revelation”'
    claim: 'The manual''s statement of the principle D&C 85:8 teaches'
    key: ot-seminary-lesson-90
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-samuel/lesson-90-2-samuel-1-10?lang=eng'
    quote: 'the principle that the Lord does not need the help of men to defend his kingdom (see D&C 85:8)'
  - where: 'note 6:6 ““Steadying the ark” in latter-day revelation”'
    claim: 'David O. McKay, Conference Report, April 1936, on men who steady the ark without authority'
    key: ot-seminary-lesson-90
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-samuel/lesson-90-2-samuel-1-10?lang=eng'
    quote: 'Let us look around us and see how quickly men who attempt unauthoritatively to steady the ark die spiritually. Their souls become embittered, their minds distorted, their judgment faulty, and their spirit depressed.'
  - where: 'note 6:6 ““Steadying the ark” in latter-day revelation”'
    claim: 'The McKay quotation is from Conference Report, April 1936'
    key: ot-seminary-lesson-90
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-samuel/lesson-90-2-samuel-1-10?lang=eng'
    quote: 'in Conference Report, Apr. 1936, 60'
  - where: 'note 6:6 ““Steadying the ark” in latter-day revelation”'
    claim: 'McKay grants that Uzzah seemed justified and that the punishment seems severe'
    key: ot-seminary-lesson-90
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-samuel/lesson-90-2-samuel-1-10?lang=eng'
    quote: 'He seemed justified when the oxen stumbled in putting forth his hand to steady that symbol of the covenant. We today think his punishment was very severe.'
  - where: 'note 6:7 “What Uzzah’s “error” was”'
    claim: 'The Hebrew word behind “error” is disputed'
    key: bdb
    url: 'https://biblehub.com/hebrew/7944.htm'
    quote: '2 Samuel 6:7 is disputed'
  - where: 'note 6:7 “What Uzzah’s “error” was”'
    claim: 'The Aramaic Targum explains it “because he acted in error,” whence the King James “for his error”'
    key: bdb
    url: 'https://biblehub.com/hebrew/7944.htm'
    quote: 'because he acted in error'
  - where: 'note 6:7 “What Uzzah’s “error” was”'
    claim: 'Some Greek manuscripts read “for his hastiness,” the Latin “temeritate”; some scholars take the word as a fragment of the phrase in 1 Chr. 13:10'
    key: bdb
    url: 'https://biblehub.com/hebrew/7944.htm'
    quote: 'for his hastiness'
  - where: 'note 6:7 “What Uzzah’s “error” was”'
    claim: 'The Latin reads temeritate (rashness)'
    key: bdb
    url: 'https://biblehub.com/hebrew/7944.htm'
    quote: 'temeritate'
  - where: 'note 6:7 “What Uzzah’s “error” was”'
    claim: 'Chronicles gives the reason: because he put his hand to the ark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/13?lang=eng'
    quote: 'and he smote him, because he put his hand to the ark: and there he died before God.'
  - where: 'note 6:7 “What Uzzah’s “error” was”'
    claim: 'God was capable of steadying His own ark'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'Even if Uzzah’s intention was simply to keep the ark from falling, it should be remembered that God was fully capable of steadying His own ark had He wished to do so.'
  - where: 'note 6:7 “What Uzzah’s “error” was”'
    claim: 'David says the breach came on all of them because they did not seek the LORD after the due order'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/15?lang=eng'
    quote: 'For because ye did it not at the first, the Lord our God made a breach upon us, for that we sought him not after the due order.'
  - where: 'note 6:10 “Obed-edom the Gittite”'
    claim: 'Chronicles calls him Obed-edom the Gittite as well'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/13?lang=eng'
    quote: 'carried it aside into the house of Obed-edom the Gittite.'
  - where: 'note 6:10 “Obed-edom the Gittite”'
    claim: 'An Obed-edom was a doorkeeper for the ark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/15?lang=eng'
    quote: 'Obed-edom and Jehiah were doorkeepers for the ark.'
  - where: 'note 6:10 “Obed-edom the Gittite”'
    claim: 'His sons are listed with the comment “for God blessed him”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/26?lang=eng'
    quote: 'Peulthai the eighth: for God blessed him.'
  - where: 'note 6:10 “Obed-edom the Gittite”'
    claim: 'A Latter-day Saint commentary: called a Gittite, but a later text includes him among the Levites'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'Here he is called a Gittite (see also 1 Chronicles 13:13). However, a later text has included him among the Levites (1 Chronicles 15:18, 21, 24).'
  - where: 'note 6:10 “Obed-edom the Gittite”'
    claim: 'One older reading: a Levite of Kohath''s line, called the Gittite from Gath-rimmon, a Levitical city'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/6.htm'
    quote: 'He is called the Gittite or Gathite from his birthplace, the Levitical city of Gath-rimmon in the tribe of Dan (Joshua 21:24; Joshua 19:45).'
  - where: 'note 6:10 “Obed-edom the Gittite”'
    claim: 'Keil makes him a Korahite of Kohath'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/6.htm'
    quote: 'Obed-edom was a Levite of the family of the Korahites, who sprang from Kohath'
  - where: 'note 6:10 “Obed-edom the Gittite”'
    claim: 'Gath-rimmon was among the cities of the Kohathites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/21?lang=eng'
    quote: 'Aijalon with her suburbs, Gath-rimmon with her suburbs; four cities.'
  - where: 'note 6:13 “This time the ark was carried”'
    claim: 'David: none but the Levites ought to carry the ark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/15?lang=eng'
    quote: 'Then David said, None ought to carry the ark of God but the Levites'
  - where: 'note 6:13 “This time the ark was carried”'
    claim: 'The Levites bore the ark on their shoulders with the staves'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/15?lang=eng'
    quote: 'And the children of the Levites bare the ark of God upon their shoulders with the staves thereon, as Moses commanded according to the word of the Lord.'
  - where: 'note 6:13 “This time the ark was carried”'
    claim: 'At the end, seven bullocks and seven rams were offered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/15?lang=eng'
    quote: 'when God helped the Levites that bare the ark of the covenant of the Lord, that they offered seven bullocks and seven rams.'
  - where: 'note 6:14 “A king in a linen ephod”'
    claim: 'The ephod was the high priest''s garment; a linen ephod seems to have become the dress of all priests; Samuel and David wore one'
    key: bd-ephod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephod?lang=eng'
    quote: 'An ephod of linen seems to have become the dress of all priests (1 Sam. 22:18). It was also worn by Samuel (1 Sam. 2:18) and by David when he brought up the Ark (2 Sam. 6:14).'
  - where: 'note 6:14 “A king in a linen ephod”'
    claim: 'The ephod was part of the high priest''s dress'
    key: bd-ephod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephod?lang=eng'
    quote: 'Part of the dress of the high priest (Ex. 28:6, etc.)'
  - where: 'note 6:14 “A king in a linen ephod”'
    claim: 'David, the Levites who bore the ark, and the singers were clothed in fine linen; David wore a linen ephod'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/15?lang=eng'
    quote: 'And David was clothed with a robe of fine linen, and all the Levites that bare the ark, and the singers, and Chenaniah the master of the song with the singers: David also had upon him an ephod of linen.'
  - where: 'note 6:14 “A king in a linen ephod”'
    claim: 'The footnote at 6:14 points to D&C 136:28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/136?lang=eng'
    quote: 'If thou art merry, praise the Lord with singing, with music, with dancing'
  - where: 'note 6:17 “A tent on Zion, not the tabernacle of Moses”'
    claim: 'Chronicles calls it the tent David had pitched'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'set it in the midst of the tent that David had pitched for it'
  - where: 'note 6:17 “A tent on Zion, not the tabernacle of Moses”'
    claim: 'Moses'' tabernacle was at Gibeon; David had pitched a tent for the ark at Jerusalem'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-chr/1?lang=eng'
    quote: 'But the ark of God had David brought up from Kirjath-jearim to the place which David had prepared for it: for he had pitched a tent for it at Jerusalem.'
  - where: 'note 6:17 “A tent on Zion, not the tabernacle of Moses”'
    claim: 'Priests ministered before the tabernacle at Gibeon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/16?lang=eng'
    quote: 'before the tabernacle of the Lord in the high place that was at Gibeon'
  - where: 'note 6:20 “What Michal objected to”'
    claim: 'The footnote explains the uncovering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/6?lang=eng'
    quote: 'In his joyful dancing, more of his body was exposed than she believed proper.'
  - where: 'note 6:20 “What Michal objected to”'
    claim: 'The exact reason cannot be known'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'David’s dancing upset his wife Michal. Although we cannot know the exact reason, culture can draw more light to the situation.'
  - where: 'note 6:20 “What Michal objected to”'
    claim: 'Michal criticized David''s joyous behavior, with a negative effect on their relationship'
    key: ot-seminary-lesson-90
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-samuel/lesson-90-2-samuel-1-10?lang=eng'
    quote: 'David’s wife Michal criticized David’s joyous behavior, which had a negative effect on their relationship.'
  - where: 'note 6:20 “What Michal objected to”'
    claim: 'One older reading: Michal is called Saul''s daughter because she showed her father''s disposition'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'Michal is intentionally designated the daughter of Saul here, instead of the wife of David, because on this occasion she manifested her father’s disposition rather than her husband’s.'
  - where: 'note 6:20 “What Michal objected to”'
    claim: 'One older reading: she was offended that the king let himself down to the level of the people'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'The proud daughter of Saul was offended at the fact, that the king had let himself down on this occasion to the level of the people.'
  - where: 'note 6:23 “What “therefore” joins”'
    claim: 'The Hebrew verse begins with the conjunction “and”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'וּ/לְ/מִיכַל֙'
  - where: 'note 6:23 “What “therefore” joins”'
    claim: 'A modern translation reads “And Michal … had no child”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+6&version=NRSVUE'
    quote: 'And Michal the daughter of Saul had no child to the day of her death.'
  - where: 'note 6:23 “What “therefore” joins”'
    claim: 'At 2 Sam. 21:8 the name Michal is a mistake for Merab'
    key: bd-michal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/michal?lang=eng'
    quote: 'In 2 Sam. 21:8 the name Michal is mistakenly used for Merab, who was the wife of Adriel.'
  - where: christ
    claim: 'The ark symbolized the presence of God and His throne; only the high priest, a type of Christ, could approach it after cleansing'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'Only the high priest (a type of Christ) could approach it and then only after going through an elaborate ritual of personal cleansing and propitiation for his sins'
  - where: christ
    claim: 'The ark symbolized God''s presence and throne'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'The ark was the tangible object that symbolized the presence of God, His throne, His glory, His divine majesty'
  - where: christ
    claim: 'The Lord does not need men''s help to defend His kingdom (D&C 85:8)'
    key: ot-seminary-lesson-90
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-samuel/lesson-90-2-samuel-1-10?lang=eng'
    quote: 'the principle that the Lord does not need the help of men to defend his kingdom (see D&C 85:8)'
