chapter: 20
claims:
  - where: setting
    claim: 'David sent to the elders of Judah asking why they were last to bring the king back'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/19?lang=eng'
    quote: 'Speak unto the elders of Judah, saying, Why are ye the last to bring the king back to his house?'
  - where: setting
    claim: 'The rebellion had first broken out in Judah; David promised that Amasa would replace Joab'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'sent emissaries to Judah, among whom the rebellion had first broken out, and promised them forgiveness, pledging that Amasa, Absalom’s general, would replace Joab'
  - where: setting
    claim: 'The oath to Amasa'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/19?lang=eng'
    quote: 'if thou be not captain of the host before me continually in the room of Joab'
  - where: setting
    claim: 'Judah came to Gilgal to bring the king over the Jordan; the quarrel there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/19?lang=eng'
    quote: 'And Judah came to Gilgal, to go to meet the king, to conduct the king over Jordan.'
  - where: setting
    claim: 'The list closes the second section as 8:16–18 closed the first; the lists are from different periods, as the differences show'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/20.htm'
    quote: 'The second section of the history of David''s reign closes, like the first (2 Samuel 8:16.), with a list of the leading ministers of state. … they belonged to different periods, as the difference in the names of some of the officers clearly shows'

  - where: thread
    claim: 'Joab kept his post in spite of David'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/20.htm'
    quote: 'Retaining his post in spite of David’s resolution to depose him.'
  - where: thread
    claim: 'The animosity of the other tribes against Judah resulted in the eventual division of the house of Israel'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'once again the animosity of the other tribes was manifested against Judah and resulted in the eventual division of the house of Israel (see 1 Kings 12).'

  - where: section 3 plain
    claim: 'Verse 8 describes what Joab was wearing, not Amasa'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'Although the King James Version makes it sound as though Amasa had on Joab’s clothing, the narrator was really describing what Joab was wearing'
  - where: section 3 plain
    claim: '“In the fifth rib” means in the belly'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/20.htm'
    quote: 'in the fifth rib] In the belly. See note on ch. 2 Samuel 2:23.'
  - where: section 4 plain
    claim: 'The bank was a siege mound; “the trench” is the outwork with its low outer wall'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/20.htm'
    quote: 'The besiegers erected a mound of earth against the city wall … This stood in “the trench” or outwork of the city: a term which includes the low outer wall and the space between it and the main wall.'
  - where: section 5 plain
    claim: '“Tribute” (mas) is forced labor'
    key: bdb
    url: 'https://biblehub.com/hebrew/4522.htm'
    quote: 'collective body of forced labourers, task-workers, labour-band or gang'

  - where: 'note 20:1 “No part in David”'
    claim: 'Sheba’s revolt was hardly a real threat, but it showed the animosity that led to the division of Israel'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'The revolt of Sheba (see 2 Samuel 20:1–2) could scarcely have been a real threat to David’s rule, but once again the animosity of the other tribes was manifested against Judah'
  - where: 'note 20:1 “No part in David”'
    claim: 'The same cry at the division under Rehoboam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'What portion have we in David? neither have we inheritance in the son of Jesse: to your tents, O Israel'
  - where: 'note 20:1 “No part in David”'
    claim: '“Part” in 2 Sam. 20:1 is ḥēleq'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'חֵ֜לֶק'
  - where: 'note 20:1 “No part in David”'
    claim: '“Portion” in 1 Kgs. 12:16 is the same word, ḥēleq'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/1Kgs.xml'
    quote: 'חֵ֨לֶק'

  - where: 'note 20:4 “Amasa in Joab''s place”'
    claim: 'Amasa was made captain by Absalom, was offered the command by David, and was slain by Joab'
    key: bd-amasa
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/amasa?lang=eng'
    quote: 'Made captain of the host by Absalom (2 Sam. 17:25); offer made to Amasa by David (19:13); was slain by Joab'
  - where: 'note 20:4 “Amasa in Joab''s place”'
    claim: 'Amasa was the son of Abigail, sister of Zeruiah, Joab’s mother'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/17?lang=eng'
    quote: 'And Absalom made Amasa captain of the host instead of Joab: which Amasa was a man’s son, whose name was Ithra an Israelite, that went in to Abigail the daughter of Nahash, sister to Zeruiah Joab’s mother.'
  - where: 'note 20:4 “Amasa in Joab''s place”'
    claim: 'David’s oath won back the men of Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/19?lang=eng'
    quote: 'And he bowed the heart of all the men of Judah, even as the heart of one man'

  - where: 'note 20:9 “The kiss and the sword”'
    claim: 'The King James makes it sound as if Amasa wore Joab’s clothing; the narrator describes Joab'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'Although the King James Version makes it sound as though Amasa had on Joab’s clothing, the narrator was really describing what Joab was wearing'
  - where: 'note 20:9 “The kiss and the sword”'
    claim: '“Went before them” is literally came before them, apparently meeting them on his return'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/20.htm'
    quote: 'Lit. came before them, i.e. met them, apparently as he was returning to Jerusalem'
  - where: 'note 20:9 “The kiss and the sword”'
    claim: 'The older commentary the manual prints calls the verse obscure'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'This seems to be the meaning of this very obscure verse.'
  - where: 'note 20:9 “The kiss and the sword”'
    claim: 'On one telling Joab stumbled and so the sword fell'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'Joab, in passing to Amasa, stumbled'
  - where: 'note 20:9 “The kiss and the sword”'
    claim: 'On another, he let the dagger fall on purpose'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/20.htm'
    quote: 'As he met Amasa he contrived to let this fall out of its sheath on the ground.'

  - where: 'note 20:9 “The kiss and the sword”'
    claim: 'The usual reconstruction: the sword fell, Joab took it up in his left hand, held the beard with his right as if to kiss, and struck with the left'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'he took it up with his left hand as if he had no bad intention; and then, taking Amasa by the beard with his right hand, pretending to kiss him, he, with his sword in his left hand, ripped up his bowels.'
  - where: 'note 20:9 “The kiss and the sword”'
    claim: 'The description explains how Joab stabbed Amasa without suspicion; he picked the dagger up in his left hand'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/20.htm'
    quote: 'This description of Joab’s dress is intended to explain how he contrived to stab Amasa without his design being suspected. … He picked it up in his left hand'
  - where: 'note 20:9 “The kiss and the sword”'
    claim: 'Taking the beard for the kiss of welcome is a custom among Arabs and Turks'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/20.htm'
    quote: 'It is said to be still customary among the Arabs and Turks to lay hold of a person’s beard in giving him the kiss of welcome.'
  - where: 'note 20:9 “The kiss and the sword”'
    claim: '“Fifth rib” is the belly'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/20.htm'
    quote: 'in the fifth rib] In the belly.'
  - where: 'note 20:9 “The kiss and the sword”'
    claim: 'One older reading: Joab’s motive, as with Abner, was jealousy'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/20.htm'
    quote: 'Joab’s real motive in murdering Amasa, as before in the case of Abner, was jealousy.'
  - where: 'note 20:9 “The kiss and the sword”'
    claim: 'The people who stood still were the troops Amasa had been mustering'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/20.htm'
    quote: 'Here and in 2 Samuel 20:13, the troops which Amasa had been mustering.'
  - where: 'note 20:9 “The kiss and the sword”'
    claim: 'David’s charge to Solomon about Joab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'unto Abner the son of Ner, and unto Amasa the son of Jether, whom he slew, and shed the blood of war in peace'
  - where: 'note 20:9 “The kiss and the sword”'
    claim: 'Solomon’s sentence: two men more righteous and better than he'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/2?lang=eng'
    quote: 'who fell upon two men more righteous and better than he, and slew them with the sword'

  - where: 'note 20:18 “Ask counsel at Abel”'
    claim: 'Abel lay north-west of Lake Huleh'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/20.htm'
    quote: 'which lies to the north-west of Lake Huleh'
  - where: 'note 20:18 “Ask counsel at Abel”'
    claim: 'Abel’s site is placed north of Lake Huleh'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/20.htm'
    quote: 'Its site is supposed to be marked by the village of Abil, about twelve miles north of Lake Huleh'
  - where: 'note 20:18 “Ask counsel at Abel”'
    claim: 'Abel was celebrated for the wisdom of its inhabitants'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/20.htm'
    quote: 'These words show that Abel had formerly been celebrated for the wisdom of its inhabitants.'
  - where: 'note 20:18 “Ask counsel at Abel”'
    claim: 'The verb is the one used for inquiring of God; men consulted the city to settle disputes; such a city, loyal and peaceable, ought not to be attacked'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/20.htm'
    quote: 'The phrase is that commonly used for inquiring of God. Cp. ch. 2 Samuel 16:23. The city had been proverbial for its wisdom from ancient times; men consulted it as an oracle for the settlement of their disputes'
  - where: 'note 20:18 “Ask counsel at Abel”'
    claim: 'Keil: Joab ought to have asked first, according to Deut. 20:10'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/20.htm'
    quote: 'he ought to have asked the inhabitants of Abela whether they intended to fight for Sheba before commencing the siege and destruction of the town, according to the law laid down in Deuteronomy 20:10.'
  - where: 'note 20:18 “Ask counsel at Abel”'
    claim: 'The Cambridge Bible allows the further reproach as possible; it prefers this rendering to the margin’s, so the line is rendered more than one way'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/20.htm'
    quote: 'Possibly she means further to hint, that if Joab had consulted the inhabitants … the siege might have been avoided. This rendering is certainly preferable to that in the margin'
  - where: 'note 20:19 “A mother in Israel”'
    claim: '“Mother” is used figuratively of Deborah caring for her people, of a city at 2 Sam. 20:19, and of Israel and Judah'
    key: bdb
    url: 'https://biblehub.com/hebrew/517.htm'
    quote: 'figurative of Deborah as caring for her people אֵם בְּיִשְׂרָאֵל Judges 5:7 (compare אָב Isaiah 22:21; Job 29:16); so of a city 2 Samuel 20:19'
  - where: 'note 20:19 “A mother in Israel”'
    claim: '“The inheritance of the LORD” is used of Israel as the LORD’s property, at 2 Sam. 20:19 and 1 Sam. 26:19'
    key: bdb
    url: 'https://biblehub.com/hebrew/5159.htm'
    quote: 'takes Israel as his property'
  - where: 'note 20:19 “A mother in Israel”'
    claim: 'BDB lists 1 Sam. 26:19 and 2 Sam. 20:19 together for the phrase'
    key: bdb
    url: 'https://biblehub.com/hebrew/5159.htm'
    quote: '1 Samuel 26:19; 2 Samuel 20:19; 2 Samuel 21:3'
  - where: 'note 20:19 “A mother in Israel”'
    claim: 'David spoke to Saul of being driven from the inheritance of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/26?lang=eng'
    quote: 'for they have driven me out this day from abiding in the inheritance of the LORD'

  - where: 'note 20:24 “Over the forced labor”'
    claim: 'mas is a labor band levied for public works; “tribute” is a late, false sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/4522.htm'
    quote: 'collective body of forced labourers, task-workers, labour-band or gang, also (late) forced service, task-work, serfdom'
  - where: 'note 20:24 “Over the forced labor”'
    claim: 'The levy was apparently instituted by David; Solomon’s levy of 30,000'
    key: bdb
    url: 'https://biblehub.com/hebrew/4522.htm'
    quote: 'amounting to 30,000 men'
  - where: 'note 20:24 “Over the forced labor”'
    claim: 'Apparently instituted earlier by David, with Adoram over it'
    key: bdb
    url: 'https://biblehub.com/hebrew/4522.htm'
    quote: 'apparently instituted, earlier, by David'
  - where: 'note 20:24 “Over the forced labor”'
    claim: 'Solomon raised a levy of thirty thousand from all Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/5?lang=eng'
    quote: 'And king Solomon raised a levy out of all Israel; and the levy was thirty thousand men.'
  - where: 'note 20:24 “Over the forced labor”'
    claim: 'Adoniram (Adoram) superintended forced labor under David, Solomon and Rehoboam, and was stoned'
    key: bd-adoniram
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/adoniram?lang=eng'
    quote: 'My Lord is exalted (sometimes abbreviated into Adoram). The officer “over the levy” who superintended the forced labor employed in public works during the reigns of David, Solomon, and Rehoboam'
  - where: 'note 20:24 “Over the forced labor”'
    claim: 'Israel’s complaint to Rehoboam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'Thy father made our yoke grievous'
  - where: 'note 20:24 “Over the forced labor”'
    claim: 'Adoram stoned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/12?lang=eng'
    quote: 'Then king Rehoboam sent Adoram, who was over the tribute; and all Israel stoned him with stones, that he died.'
  - where: 'note 20:24 “Over the forced labor”'
    claim: 'Ira is called kōhēn in 20:26'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'כֹהֵ֖ן'

  - where: christ
    claim: 'The animosity against Judah resulted in the division of Israel'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'resulted in the eventual division of the house of Israel (see 1 Kings 12).'
  - where: christ
    claim: 'Ezekiel’s promise of one nation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezek/37?lang=eng'
    quote: 'and they shall be no more two nations'
  - where: christ
    claim: 'Isaiah: the envy of Ephraim and Judah ended'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/11?lang=eng'
    quote: 'Ephraim shall not envy Judah, and Judah shall not vex Ephraim.'
  - where: christ
    claim: 'The envy of Judah and Ephraim shall cease through the gospel of Jesus Christ'
    key: bd-ephraim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephraim?lang=eng'
    quote: 'The time will come when, through the operation of the gospel of Jesus Christ, the envy of Judah and Ephraim shall cease (Isa. 11:12–13).'
  - where: christ
    claim: 'Be one'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/38?lang=eng'
    quote: 'I say unto you, be one; and if ye are not one ye are not mine.'

  - where: explore
    claim: 'One older reading: Ecclesiastes 9 parable possibly suggested by this incident'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/20.htm'
    quote: 'by a parable strikingly similar to this incident, and possibly suggested by it (Ecclesiastes 9:13-16).'
