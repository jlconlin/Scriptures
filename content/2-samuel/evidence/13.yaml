chapter: 13
claims:
  - where: when
    claim: 'Absalom waits two full years, then flees to Geshur for three years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/13?lang=eng'
    quote: 'And it came to pass after two full years, that Absalom had sheepshearers in Baal-hazor … So Absalom fled, and went to Geshur, and was there three years.'

  - where: setting
    claim: 'Chapter 12 ends with Rabbah taken; Nathan’s sentence of the sword and evil out of David’s own house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'Now therefore the sword shall never depart from thine house'
  - where: setting
    claim: 'Chapters 13–24: David’s family fractured by lust and murder; Absalom seeks the throne'
    key: ot-seminary-2-samuel-intro
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-2-samuel?lang=eng'
    quote: '2 Samuel 13–24 David’s family is fractured by lust and murder. His son Absalom conspires against him and seeks the throne.'
  - where: setting
    claim: 'Absalom was the son of Maacah, daughter of Talmai king of Geshur'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/3?lang=eng'
    quote: 'the third, Absalom the son of Maacah the daughter of Talmai king of Geshur'
  - where: setting
    claim: 'Tamar was David’s daughter by Maacah, half sister of Amnon; Amnon the eldest, born to Ahinoam at Hebron, the crown prince and natural heir'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'Tamar was the lovely daughter of David by his wife Maacah and was the half sister of Amnon. Amnon was the eldest of David’s sons, having been born to Ahinoam while David was at Hebron. He was the crown prince and the natural heir to David’s throne.'
  - where: setting
    claim: 'Absalom escaped to his grandfather’s home in Geshur'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'Absalom escaped to his grandfather’s home in Geshur.'

  - where: thread
    claim: 'The Student Manual sees a parallel between David and Amnon: lust and plotting to cover sin'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'The parallel between David and Amnon is evident. David had set an example in not having the spirit control the body when he gave in to his lust for Bath-sheba. He also had set an example of plotting ways to cover up his sins.'
  - where: thread
    claim: 'A conspiracy of men aids the crime and a conspiracy of silence follows; Tamar is left desolate and David mourns her rapist'
    key: easton-recognizing
    url: 'https://rsc.byu.edu/covenant-compassion/recognizing-responsibility-standing-victims'
    quote: 'A conspiracy of men aid and abet Amnon’s crime, and a male conspiracy of silence follows the act. … In the end, Tamar is left desolate in Absalom’s house, and King David is found mourning bitterly, not for Tamar but for her rapist.'
  - where: thread
    claim: 'Tamar is articulate and refuses to be silent'
    key: easton-recognizing
    url: 'https://rsc.byu.edu/covenant-compassion/recognizing-responsibility-standing-victims'
    quote: 'Tamar is an articulate, strong woman who refuses to be silent.'

  - where: 'note 13:1 “Three of David’s children”'
    claim: 'Absalom the son of Maacah daughter of Talmai king of Geshur; Amnon firstborn of Ahinoam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/3?lang=eng'
    quote: 'the third, Absalom the son of Maacah the daughter of Talmai king of Geshur'
  - where: 'note 13:1 “Three of David’s children”'
    claim: 'Amnon firstborn and heir; Chileab not mentioned again; the story sits in the contest over David’s throne; Absalom will seek it'
    key: easton-recognizing
    url: 'https://rsc.byu.edu/covenant-compassion/recognizing-responsibility-standing-victims'
    quote: 'Amnon is the firstborn and heir apparent to the throne. The second-born, Kileab or Chileab, isn''t mentioned. Perhaps he died young. Absalom is the third born. Tamar’s story occurs in the section of the Bible generally understood to depict the contestation over who will assume David’s throne.'

  - where: 'note 13:1 “Three of David’s children”'
    claim: 'Some years after the rape Absalom will seek the throne'
    key: easton-recognizing
    url: 'https://rsc.byu.edu/covenant-compassion/recognizing-responsibility-standing-victims'
    quote: 'A number of years after Tamar’s rape, Absalom will seek to take over David’s throne (2 Samuel 13–19).'

  - where: 'note 13:3 “A very subtil man”'
    claim: 'BDB: ḥākām, wise; sense 3 shrewd, crafty, cunning, of Jonadab at 2 Sam 13:3; the same word of the wise woman of 14:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/2450.htm'
    quote: '3 shrewd, crafty, cunning: Jonadab 2 Samuel 13:3; the princesses Judges 5:29; אשׁה חכמה wise woman 2 Samuel 14:2'
  - where: 'note 13:3 “A very subtil man”'
    claim: 'The Hebrew word at 13:3 is ḥākām (H2450)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'חָכָ֖ם'
  - where: 'note 13:3 “A very subtil man”'
    claim: 'Amnon gains access to Tamar through Jonadab and David’s unwitting help; family members who enable abuse'
    key: easton-recognizing
    url: 'https://rsc.byu.edu/covenant-compassion/recognizing-responsibility-standing-victims'
    quote: 'Her story gives voice to many of the issues that surround sexual abuse. For instance, Amnon only gains access to Tamar through the help of his cousin Jonadab and the unwitting assistance of his father, King David.'
  - where: 'note 13:3 “A very subtil man”'
    claim: 'Jonadab knows at verse 32 that Absalom had determined Amnon’s death from the day of the rape'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/13?lang=eng'
    quote: 'for by the appointment of Absalom this hath been determined from the day that he forced his sister Tamar'

  - where: 'note 13:13 “Speak unto the king”'
    claim: 'Marriage of half-siblings permitted in patriarchal times (Abraham and Sarah), forbidden by the Mosaic law; either the law was not strictly observed, or Tamar suggested the king might permit it'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/13.htm'
    quote: 'The marriage of half-brothers and sisters was permitted in patriarchal times, as is shewn by the example of Abraham and Sarah (Genesis 20:12), but was expressly forbidden by the Mosaic law. Either the law was not strictly observed at this time, or Tamar, hoping to escape immediate violence, suggested that the king had a dispensing power'
  - where: 'note 13:13 “Speak unto the king”'
    claim: '“Fool” is one who has abandoned the fear of God and cast off the restraints of decency; “folly” is applied to unchastity'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/13.htm'
    quote: '“Fool” denotes not merely one who is stupid and ignorant, but one who has abandoned the fear of God, and cast off the restraints of decency and morality. Cp. ch. 2 Samuel 3:33; Psalm 14:1. “Folly” is a term specially applied to unchastity.'
  - where: 'note 13:13 “Speak unto the king”'
    claim: 'Keil: at variance with Lev 18:9, 11; 20:17, but does not prove Tamar ignorant of the law; she said it to escape and not to inflame him'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/13.htm'
    quote: 'is no doubt at variance with the law which prohibits marriage between step-brothers and sisters (Leviticus 18:9, Leviticus 18:11; Leviticus 20:17); but it by no means proves that the laws of Leviticus were not in existence at the time, nor does it even presuppose that Tamar was ignorant of any such law.'
  - where: 'note 13:13 “Speak unto the king”'
    claim: 'Keil: she said it to escape by any means and to avoid inflaming him by precluding hope of marriage'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/13.htm'
    quote: 'She simply said this, as Clericus observes, "that she might escape from his hands by any means in her power, and to avoid inflaming him still more and driving him to sin by precluding all hope of marriage."'
  - where: 'note 13:13 “Speak unto the king”'
    claim: 'Lev 18:9 forbids the sister, daughter of father or mother'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/18?lang=eng'
    quote: 'The nakedness of thy sister, the daughter of thy father, or daughter of thy mother'

  - where: 'note 13:14 “What Amnon did”'
    claim: 'Tamar refused, named the force, appealed to communal values and consequences, and offered marriage; the editor names rape for what it is'
    key: easton-recognizing
    url: 'https://rsc.byu.edu/covenant-compassion/recognizing-responsibility-standing-victims'
    quote: 'She responds with a vigorous no, reminding him that he is her brother and that he is forcing her. To persuade him to forego his plan, she speaks of their cultural heritage and communal values that label his intentions vile and evil.'
  - where: 'note 13:14 “What Amnon did”'
    claim: 'The text names the rape for what it is, a violent assault'
    key: easton-recognizing
    url: 'https://rsc.byu.edu/covenant-compassion/recognizing-responsibility-standing-victims'
    quote: 'In doing so, the editor of this story names rape for what it is: a violent assault on an individual.'
  - where: 'note 13:14 “What Amnon did”'
    claim: 'BDB: ʿānâ (Piel) humble a woman by cohabitation, at Gen 34:2 and 2 Sam 13:12, 14, 22, 32'
    key: bdb
    url: 'https://biblehub.com/hebrew/6031.htm'
    quote: '2 humble, a woman by cohabitation, Genesis 34:2 (J) Deuteronomy 21:14; Deuteronomy 22:24,29; Judges 19:24; Judges 20:5; 2 Samuel 13:12,14,22,32'
  - where: 'note 13:14 “What Amnon did”'
    claim: 'The Hebrew of “lay with her” is the verb with the object marker ʾōtāh, not “with her”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'אֹתָֽ/הּ'

  - where: 'note 13:16 “Sent away”'
    claim: 'Amnon would not save Tamar from disgrace by making her a wife or concubine; disgraced, she would be deprived of a husband and mourned as a widow'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'Amnon would not save Tamar from disgrace by making her a part of his household as a wife or concubine. Knowing that she had been disgraced and would therefore be deprived of a husband, Tamar mourned in the manner of a widow (see v. 19; note especially v. 20).'
  - where: 'note 13:16 “Sent away”'
    claim: 'Once he had gratified his lust he despised her; evil men despise the women rather than themselves'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'Amnon did not really love Tamar. Once he had gratified his lust, he despised her. How often is such gross unfairness toward women demonstrated by evil men? They exploit women and then despise the women rather than themselves.'
  - where: 'note 13:16 “Sent away”'
    claim: 'Casting her out consigns her to a life of desolation; Tamar captures the reality wisely'
    key: easton-recognizing
    url: 'https://rsc.byu.edu/covenant-compassion/recognizing-responsibility-standing-victims'
    quote: 'Tamar wisely captures the reality of the situation. … However, by raping her and then casting her out, Amnon consigns her to a life of “desolation” (13:20).'

  - where: 'note 13:18 “A garment of divers colours”'
    claim: 'BDB: kᵉtōnet passîm, tunic reaching to palms and soles, only Gen 37:3, 23, 32 and 2 Sam 13:18, 19'
    key: bdb
    url: 'https://biblehub.com/hebrew/6446.htm'
    quote: 'only כְּתֹנֶת מַּסִּים tunic reaching to palms and soles (see ׳כ) Genesis 37:3,23,32; 2 Samuel 13:18,19'
  - where: 'note 13:18 “A garment of divers colours”'
    claim: 'The Septuagint renders “desolate” in 13:20 as dwelling as a widow'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_samuel/13.htm'
    quote: 'So Themar dwelt as a widow in the house of her brother Abessalom.'
  - where: 'note 13:18 “A garment of divers colours”'
    claim: 'Joseph’s coat of many colours, Gen 37:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/37?lang=eng'
    quote: 'and he made him a coat of many colours'

  - where: 'note 13:20 “Hold now thy peace”'
    claim: 'Absalom charges Tamar to be silent; with these words Tamar disappears from the narrative'
    key: easton-recognizing
    url: 'https://rsc.byu.edu/covenant-compassion/recognizing-responsibility-standing-victims'
    quote: 'And while the text makes it clear that Absalom loves his sister, his words are not those that we as twenty-first-century readers want to hear: he charges Tamar to be silent. … With these words, Tamar disappears from the biblical narrative.'
  - where: 'note 13:20 “Hold now thy peace”'
    claim: 'Absalom said nothing to Amnon; two full years later the feast'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/13?lang=eng'
    quote: 'And Absalom spake unto his brother Amnon neither good nor bad'
  - where: 'note 13:20 “Hold now thy peace”'
    claim: 'The charge to be silent recalls the culture of silence around abuse; victims pressured and shamed into silence'
    key: easton-recognizing
    url: 'https://rsc.byu.edu/covenant-compassion/recognizing-responsibility-standing-victims'
    quote: 'Absalom’s charge to his sister to be silent about the life-altering crime inflicted on her is a painful reminder of the culture of silence that has long surrounded rape and abuse. Victims of rape and abuse have all too often been pressured and shamed into silence.'
  - where: 'note 13:21 “Very wroth, and nothing more”'
    claim: 'The Septuagint adds that David did not grieve Amnon’s spirit because he loved him, his firstborn'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_samuel/13.htm'
    quote: 'And king David heard of all these things, and was very angry; but he did not grieve the spirit of his son Amnon, because be loved him, for he was his first-born.'
  - where: 'note 13:21 “Very wroth, and nothing more”'
    claim: 'Keil: the Septuagint clause probably gives the true reason, though a conjecture of the translators; the law punished incest with death'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/13.htm'
    quote: 'This probably gives the true reason why David let such a crime as Amnon''s go unpunished, when the law enjoined that incest should be punished with death (Leviticus 20:17); at the same time it is nothing but a subjective conjecture of the translators, and does not warrant us in altering the text.'
  - where: 'note 13:21 “Very wroth, and nothing more”'
    claim: 'Keil: partly David’s consciousness of guilt, chiefly his indulgent affection and want of discipline'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/13.htm'
    quote: 'The fact that David was contented to be simply angry is probably to be accounted for partly from his own consciousness of guilt, since he himself had been guilty of adultery; but it arose chiefly from his indulgent affection towards his sons, and his consequent want of discipline.'
  - where: 'note 13:21 “Very wroth, and nothing more”'
    claim: 'Student Manual: David’s own conduct left him without a basis for condemnation; he did not act; another result of sin'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'David was furious because of the way Amnon had treated Tamar, but what could he do or say? His own conduct with Bath-sheba had left him without a basis for condemnation. Here was another result of sin. Because of his own guilt, David did not act to correct this great abomination in his own household.'
  - where: 'note 13:21 “Very wroth, and nothing more”'
    claim: 'Easton-Flake: David knowingly ignored the violence and mourned Amnon rather than acknowledge Tamar’s suffering; God does not sanction such violence'
    key: easton-recognizing
    url: 'https://rsc.byu.edu/covenant-compassion/recognizing-responsibility-standing-victims'
    quote: 'King David’s decision to knowingly ignore Amnon’s act of violence against Tamar and to eventually mourn the loss of Amnon’s life rather than acknowledge Tamar’s suffering is a terrifying example of an all-too-prevalent sanction of male violence upon female bodies'
  - where: 'note 13:21 “Very wroth, and nothing more”'
    claim: 'Lev 20:17: a man who takes his sister shall be cut off'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/20?lang=eng'
    quote: 'And if a man shall take his sister, his father’s daughter, or his mother’s daughter'

  - where: 'note 13:21 “Very wroth, and nothing more”'
    claim: 'Such abuse must end; God does not sanction it in the Bible or now'
    key: easton-recognizing
    url: 'https://rsc.byu.edu/covenant-compassion/recognizing-responsibility-standing-victims'
    quote: 'Such abuse and violence must end. God does not sanction it in the Bible or in our current society.'
  - where: 'note 13:23 “After two full years”'
    claim: 'Absalom concealed his hate two years; shearing feast customary; David declined lest the court be chargeable; sent Amnon, the apparent heir; Amnon merry with wine; Absalom escaped'
    key: ot-manual-2-samuel-13
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-13-24-the-price-of-sin-tragedy-in-the-house-of-david?lang=eng'
    quote: 'It was customary at shearing time to have a feast, since this time usually involved a gathering of the family. David declined the invitation, fearing the entire court would be “chargeable,” that is, a burden on his son, but he sent his eldest son, Amnon, the apparent heir to the throne (v. 25).'
  - where: 'note 13:23 “After two full years”'
    claim: 'Easton-Flake wonders whether Absalom killed Amnon solely for revenge or in part to clear his own way to the throne'
    key: easton-recognizing
    url: 'https://rsc.byu.edu/covenant-compassion/recognizing-responsibility-standing-victims'
    quote: 'Two years later, Absalom avenges his sister by killing Amnon, but one wonders whether Absalom murders Amnon solely to get revenge for Tamar or in part to pave the way for himself to inherit David’s throne.'
  - where: 'note 13:23 “After two full years”'
    claim: 'Jonadab: by Absalom’s appointment determined from the day of the rape; Absalom’s question about Amnon; the report that all the sons were slain'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/13?lang=eng'
    quote: 'for by the appointment of Absalom this hath been determined from the day that he forced his sister Tamar'

  - where: 'note 13:39 “Longed to go forth unto Absalom”'
    claim: 'Cambridge: the Hebrew is obscure, with almost opposite meanings; the KJV follows Jewish commentators; objections; alternative: David desisted from going forth against Absalom (Vulgate, probably the Septuagint)'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/13.htm'
    quote: 'The Heb. of this verse is obscure, and has been made to bear almost opposite meanings. (1) The E. V., following the Jewish commentators, supplies the soul as the subject of the verb, which is feminine. It describes David as pining for the return of Absalom'
  - where: 'note 13:39 “Longed to go forth unto Absalom”'
    claim: 'Cambridge: the objections, and the second reading that David gave up plans of pursuit'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/13.htm'
    quote: '(a) that the verb, in the voice used here, does not mean longed: (b) that if David had been anxious for Absalom’s return, he might have recalled him at once … (2) By taking the verb impersonally we may obtain the sense, David desisted from going forth against Absalom'
  - where: 'note 13:39 “Longed to go forth unto Absalom”'
    claim: 'Keil: “it held king David back from going out to Absalom”, in a hostile sense; the longing reading conflicts with 14:24, 28'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/13.htm'
    quote: '"And it (this) held king David back from going out to Absalom, for he comforted himself concerning Amnon, because he was dead."'
  - where: 'note 13:39 “Longed to go forth unto Absalom”'
    claim: 'Keil: the old Jewish interpretation (longing) is opposed by David’s conduct in chapter 14, not admitting Absalom for two years'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/13.htm'
    quote: 'The old Jewish interpretation (adopted in the Chaldee version, and also by the Rabbins), viz., David longed (his soul pined) to go out to Absalom (i.e., to see or visit him), is opposed, as Gusset has shown (in his Lex. pp. 731-2), to the conduct of David towards Absalom as described in 2 Samuel 14'
  - where: 'note 13:39 “Longed to go forth unto Absalom”'
    claim: 'The Septuagint: David ceased to go out after Absalom'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/2_samuel/13.htm'
    quote: '39And king David ceased to go out after Abessalom, for he was comforted concerning Amnon, touching his death.'
  - where: 'note 13:39 “Longed to go forth unto Absalom”'
    claim: 'ESV: the spirit of the king longed to go out to Absalom'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=2%20Samuel%2013%3A39&version=ESV'
    quote: '39 And the spirit of the king longed to go out to Absalom, because (A)he was comforted about Amnon, since he was dead.'
  - where: 'note 13:39 “Longed to go forth unto Absalom”'
    claim: 'NRSVue: the heart of the king went out, yearning for Absalom'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2%20Samuel%2013%3A39&version=NRSVUE'
    quote: '39 And the heart of the king went out, yearning for Absalom, for he was now consoled over the death of Amnon.'
  - where: 'note 13:39 “Longed to go forth unto Absalom”'
    claim: 'The verb of 13:39 is the feminine wattᵉkal'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/2Sam.xml'
    quote: 'וַ/תְּכַל֙'

  - where: christ
    claim: 'The power of healing is inherent in the Atonement'
    key: scott-heal-abuse
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2008/04/to-heal-the-shattering-consequences-of-abuse?lang=eng'
    quote: 'The power of healing is inherent in the Atonement of Jesus Christ.'
  - where: christ
    claim: 'The Father provided a way to heal the consequences of acts done by force or misuse of authority'
    key: scott-heal-abuse
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2008/04/to-heal-the-shattering-consequences-of-abuse?lang=eng'
    quote: 'That is why our Father provided a way to heal the consequences of acts that, through force, misuse of authority, or fear of another, temporarily take away the agency of the abused.'
  - where: christ
    claim: 'The consequences of abuse do not define the real you'
    key: scott-heal-abuse
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2008/04/to-heal-the-shattering-consequences-of-abuse?lang=eng'
    quote: 'While these outcomes have powerful influence in your life, they do not define the real you.'

  - where: christ
    claim: 'Healing for the victim comes through the Atonement of Jesus Christ'
    key: scott-heal-abuse
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2008/04/to-heal-the-shattering-consequences-of-abuse?lang=eng'
    quote: 'That secure healing comes through the power of the Atonement of His Beloved Son, Jesus Christ, to rectify that which is unjust.'

  - where: explore
