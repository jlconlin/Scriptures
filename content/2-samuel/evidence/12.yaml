chapter: 12
claims:
  - where: setting
    claim: 'David stayed at Jerusalem while Joab and Israel besieged Rabbah; after the mourning he took Bath-sheba as wife; the thing displeased the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/11?lang=eng'
    quote: 'and they destroyed the children of Ammon, and besieged Rabbah. But David tarried still at Jerusalem. … But the thing that David had done displeased the LORD.'
  - where: setting
    claim: 'Rabbah was the chief city of the Ammonites, taken by David; its ruins are at modern Amman'
    key: bd-rabbah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/rabbah?lang=eng'
    quote: 'Chief city of the Ammonites, in the deep fertile valley of the Upper Jabbock … taken by David (2 Sam. 11:1; 12:26–27, 29; 17:27; 1 Chr. 20:1) … There are still extensive ruins at the modern Amman.'
  - where: setting
    claim: 'Nathan forbade the temple (2 Sam. 7), rebuked David about Bathsheba, and anointed Solomon'
    key: bd-nathan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nathan?lang=eng'
    quote: 'The prophet, forbids David to build a temple (2 Sam. 7; 1 Chr. 17:1–15); rebukes him about Bathsheba (2 Sam. 12; Ps. 51 heading); anoints Solomon (1 Kgs. 1:38–39, 45'
  - where: setting
    claim: 'David’s fall gave occasion to Psalms 51 and 32'
    key: bd-david
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/david?lang=eng'
    quote: 'David’s fall gave occasion to Ps. 51 and 32.'

  - where: thread
    claim: 'David’s life after the sins is continuous penitence; a mistake to call him good before and bad after'
    key: shannon-complex-stories
    url: 'https://mi.byu.edu/old-testament-reflections/lessons-from-lifes-complex-stories'
    quote: 'it is a mistake for us to say that David was a good man before the crime and a bad one after. As described in the Bible, David’s life after these sins is one of continuous penitence.'

  - where: 'note 12:1 “Nathan sent to the king”'
    claim: 'Nathan had not been part of the previous story, so his knowledge was revealed; the case fits whether actual events or a parable'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'Nathan had not been a part of the previous story, meaning that his knowledge of David’s actions was certainly revealed to him by the Lord. The case study he presented is fitting, whether these were actual events or a pedagogical parable.'
  - where: 'note 12:1 “Nathan sent to the king”'
    claim: 'Nathan forbade the temple, rebuked David, and anointed Solomon'
    key: bd-nathan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nathan?lang=eng'
    quote: 'The prophet, forbids David to build a temple (2 Sam. 7; 1 Chr. 17:1–15); rebukes him about Bathsheba (2 Sam. 12; Ps. 51 heading); anoints Solomon (1 Kgs. 1:38–39, 45'
  - where: 'note 12:1 “Nathan sent to the king”'
    claim: 'The LORD sent Nathan; D&C 132:39 calls him “Nathan, my servant”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng'
    quote: 'David’s wives and concubines were given unto him of me, by the hand of Nathan, my servant'

  - where: 'note 12:3 “The one ewe lamb”'
    claim: 'The rich man’s flocks answer to David’s wives, concubines and children (5:13–16); Uriah has one wife and no children; Bath-sheba’s mourning shows a bond'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'The rich man had many flocks and herds; David’s wives, concubines, and children had been enumerated in 2 Samuel 5:13–16. The poor man only had one lamb; the narrator only describes one wife for Uriah, and there is no mention of his having children.'
  - where: 'note 12:3 “The one ewe lamb”'
    claim: 'Bath-sheba’s mourning communicates a strong bond'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'Notwithstanding the lack of detail regarding Bath-sheba’s relationship with her husband, the fact that she mourned her loss communicates a strong bond (11:26).'
  - where: 'note 12:3 “The one ewe lamb”'
    claim: 'Nathan’s charge names the wife of Uriah and lays the deed on David'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'thou hast killed Uriah the Hittite with the sword, and hast taken his wife to be thy wife'

  - where: 'note 12:6 “Death, and fourfold”'
    claim: 'David demanded death, the harshest punishment; fourfold restoration is Exodus 22:1; Uriah could not be restored'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'In anger, David demanded the harshest of punishments for the rich man: death. Restoration was due “fourfold” (Exodus 22:1). Unfortunately, Uriah could not be restored, and David’s injustice was exposed.'
  - where: 'note 12:6 “Death, and fourfold”'
    claim: 'David’s “shall surely die” returns on the child'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'However, his condemnation of the rich man in Nathan’s story would come back to haunt him. In verse 5 of this chapter, David had spouted that the rich man “shall surely die.” Though David would live, the Lord declares that the child from Bath-sheba “shall surely die” (verse 14).'
  - where: 'note 12:6 “Death, and fourfold”'
    claim: 'The law requires four sheep for a sheep from the thief'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/22?lang=eng'
    quote: 'If a man shall steal an ox, or a sheep, and kill it, or sell it; he shall restore five oxen for an ox, and four sheep for a sheep.'

  - where: 'note 12:7 “Thou art the man”'
    claim: 'Only when the sinner knows his sin is known does he begin to repent; Nathan’s “Attah ha ish” crashed in on David’s conscience'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'As happens too frequently, it is only when a sinner knows that his sin is known that he begins to repent! … his climatic ‘Attah ha ish!’ (‘Thou art the man’) must have crashed in upon the conscience of David like the harbingers of doom’s day.'
  - where: 'note 12:7 “Thou art the man”'
    claim: 'Nathan continued with the Lord’s words recounting David’s history of blessings, then his shortcomings'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'Nathan boldly revealed to David that he was the rich man from the story. David offered no response and was dead silent. Nathan continued with words directly from the Lord recounting the king’s history of blessings.'
  - where: 'note 12:7 “Thou art the man”'
    claim: 'The LORD recounts the anointing, deliverance from Saul, Saul’s house and the kingdom, then the charge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'I anointed thee king over Israel, and I delivered thee out of the hand of Saul; And I gave thee thy master’s house'

  - where: 'note 12:8 “Did the LORD give David his wives?”'
    claim: 'Only the king might marry his predecessor’s wives; that David married any of Saul’s does not appear; only one wife and one concubine of Saul are named'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/12.htm'
    quote: 'It was lawful for the King, and for him only, to marry his predecessor’s wives. See note on ch. 2 Samuel 3:7. That David actually married any of Saul’s wives does not appear. Only one wife (1 Samuel 14:50) and one concubine (2 Samuel 3:7) of Saul’s are mentioned.'
  - where: 'note 12:8 “Did the LORD give David his wives?”'
    claim: 'D&C 132:39: David’s wives given by the hand of Nathan; he sinned only in the case of Uriah and his wife'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng'
    quote: 'David’s wives and concubines were given unto him of me, by the hand of Nathan, my servant, and others of the prophets who had the keys of this power; and in none of these things did he sin against me save in the case of Uriah and his wife'
  - where: 'note 12:8 “Did the LORD give David his wives?”'
    claim: 'The Lord approved of David’s wives and concubines, given by Nathan, except Bathsheba'
    key: scripture-helps-1-samuel-17
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/23-1-samuel-17-18-24-26-2-samuel-5-7?lang=eng'
    quote: 'Latter-day revelation affirms that the Lord approved of David’s concubines and wives, who were given by the hand of the prophet Nathan—except in the case of Bathsheba.'
  - where: 'note 12:8 “Did the LORD give David his wives?”'
    claim: 'D&C 132 changes and expands what the Bible says; Nathan said to hold keys to perform plural marriages; compare 2 Sam. 12:8'
    key: sears-shannon-polygamy
    url: 'https://rsc.byu.edu/household-god/let-me-take-another-wife'
    quote: 'it is also important to recognize that in many ways the revelation changes and expands what the Bible says. … Nathan the prophet, who ministered to king David, is said to have held priesthood keys enabling him to perform plural marriages (Doctrine and Covenants 132:39).'
  - where: 'note 12:8 “Did the LORD give David his wives?”'
    claim: 'D&C 132:39 describes God giving wives to David, compare 2 Sam. 12:8'
    key: sears-shannon-polygamy
    url: 'https://rsc.byu.edu/household-god/let-me-take-another-wife'
    quote: 'The specific circumstances of David’s many marriages are also described, including the idea that God “gave” wives to him (Doctrine and Covenants 132:39; compare 2 Samuel 12:8).'
  - where: 'note 12:8 “Did the LORD give David his wives?”'
    claim: 'David’s wives given by God’s favor; wives acquired under his own authority condemned (Jacob 2:23–24)'
    key: eom-david-king
    url: 'https://eom.byu.edu/index.php/David,_King'
    quote: 'Scripture indicates that David''s blessings, including his wives, were given to him as a result of God''s favor (2 Sam. 5:12-13;12:8; D&C 132:39). But when David also acquired wives and concubines, apparently under his own authority, he was condemned by God (Jacob 2:23-24).'

  - where: 'note 12:10 “The sword in David’s house”'
    claim: 'The family feuds and rebellions of Absalom and Adonijah fulfil Nathan’s pronouncement'
    key: bd-david
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/david?lang=eng'
    quote: 'His sin with Bathsheba was followed by a series of misfortunes that marred the last 20 years of his life. … There were constant family feuds, which, in the case of Absalom and Adonijah, ended in open rebellion. These incidents are a fulfillment of the pronouncement of Nathan the prophet upon David, because of his sin (2 Sam. 12:7–13).'
  - where: 'note 12:10 “The sword in David’s house”'
    claim: 'Many see the episode as a turning point after which David lives under a sort of curse'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'Many commentators see it as a turning point in the narrative, after which David lives under a sort of curse that affects his life and all his relationships.'
  - where: 'note 12:10 “The sword in David’s house”'
    claim: 'To lose one’s wives was to lose power; Absalom took his father’s wives'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'In the ancient world men of power could provide for bigger families—that is, more wives. To lose one’s wives was to lose one’s power. As the story progresses, one of David’s sons would do this very thing, usurping power and taking his father’s wives (2 Samuel 16:21–22).'
  - where: 'note 12:10 “The sword in David’s house”'
    claim: 'Verse 12 is fulfilled at 2 Sam. 16:22 (the footnote at verse 12)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: '12a “do”: 2 Sam. 16:22.'

  - where: 'note 12:13 “Was David forgiven?”'
    claim: 'Footnote 13b: Hebrew “hath caused to pass”; not punished immediately by death but did not escape punishment'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/2-sam/12?lang=eng'
    quote: 'HEB hath caused to pass; i.e., he was not punished immediately by death; but he did not escape punishment. See D&C 132:39.'
  - where: 'note 12:13 “Was David forgiven?”'
    claim: 'The JST reading and its headnote'
    key: jst-2-sam-12
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-2-sam/12?lang=eng'
    quote: 'David’s grievous sin is not put away by God. … The Lord also hath not put away thy sin that thou shalt not die.'
  - where: 'note 12:13 “Was David forgiven?”'
    claim: 'The JST death is spiritual; David was not put to death as the law required but given a worse punishment; eternal status not revealed'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'That David was to die, as indicated in the JST, should be interpreted as spiritual death; he was not put to death physically as the law required, but was given a worse punishment. He was to live to see his wives live with others and his family turn against him'
  - where: 'note 12:13 “Was David forgiven?”'
    claim: 'Beyond this, David’s eternal status has not been revealed'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'Beyond this, the eternal status of David has not been revealed.'
  - where: 'note 12:13 “Was David forgiven?”'
    claim: 'D&C 132:39: fallen from his exaltation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/132?lang=eng'
    quote: 'save in the case of Uriah and his wife; and, therefore he hath fallen from his exaltation, and received his portion'
  - where: 'note 12:13 “Was David forgiven?”'
    claim: 'David capable of contrition and forgiveness except in the murder of Uriah; promise his soul not left in hell'
    key: bd-david
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/david?lang=eng'
    quote: 'unlike Saul, he was capable of true contrition and was therefore able to find forgiveness, except in the murder of Uriah. As a consequence David is still unforgiven, but he received a promise that the Lord would not leave his soul in hell.'
  - where: 'note 12:13 “Was David forgiven?”'
    claim: 'Hell in the promise is spirit prison'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'Although David had “fallen from his exaltation” because he had planned Uriah’s death, the Lord promised David that his soul would not be left in hell (spirit prison).'
  - where: 'note 12:13 “Was David forgiven?”'
    claim: 'Joseph Smith, 10 March 1844, as reported by Wilford Woodruff'
    key: jsp-discourse-1844-03-10-p210
    url: 'https://www.josephsmithpapers.org/paper-summary/discourse-10-march-1844-as-reported-by-wilford-woodruff/6'
    quote: 'David sought repentance at the hand of God carefully with tears but he could ownly get it through Hell, he got a promise that his soul should not be left in Hell'
  - where: 'note 12:13 “Was David forgiven?”'
    claim: 'Joseph Smith, 16 May 1841: David must wait for the times of refreshing'
    key: wjs-1841-05-16
    url: 'https://rsc.byu.edu/words-joseph-smith/16-may-1841-sunday-morning-meeting-ground'
    quote: 'Even David, must wait for those times of refreshing, before he can come forth and his sins be blotted out'

  - where: 'note 12:23 “Why the child died, and where he went”'
    claim: 'The pronouncement troubles readers; God loves all His children; infants who die are saved in the celestial kingdom and not held accountable for parents'
    key: scripture-helps-2-samuel-11
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/24-2-samuel-11-12-1-kings-3-6-9-11?lang=eng'
    quote: 'This pronouncement has sometimes troubled Bible readers. Though the author of 2 Samuel stated that “the Lord struck the child” with an illness, we can trust that God watches over and loves all of His children. It is also important to keep in mind that infants who die are saved in the celestial kingdom and are not held accountable for their parents’ actions.'
  - where: 'note 12:23 “Why the child died, and where he went”'
    claim: 'No reason to see the death as punishment of the child; David explained hopefully'
    key: ot-manual-2-samuel-1
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/2-samuel-1-12-the-fall-of-king-david?lang=eng'
    quote: 'The child born of their illicit union did not live, but there is no reason to look upon that as ‘punishment’ of the child for the sins of the parents. … After David knew that the baby was dead, he ceased mourning, however, and philosophically and hopefully explained'
  - where: 'note 12:23 “Why the child died, and where he went”'
    claim: 'David’s prayer and fasting did not change the foretold result'
    key: ot-minute-2-samuel
    url: 'https://scripturecentral.org/archive/books/book-chapter/2-samuel-57-1112'
    quote: 'In other words, his sudden dedication to prayer and fasting had not changed the foretold results.'

  - where: 'note 12:25 “Jedidiah, beloved of the LORD”'
    claim: 'Jedidiah means beloved of Yah, a name given to Solomon by Nathan'
    key: bdb
    url: 'https://biblehub.com/hebrew/3041.htm'
    quote: 'יְדִידְיָה proper name, masculine (beloved of Yah; … — name given to Solomon by Nathan'
  - where: 'note 12:25 “Jedidiah, beloved of the LORD”'
    claim: 'Solomon means Peaceable'
    key: bd-solomon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/solomon?lang=eng'
    quote: 'Peaceable. Son of David and Bathsheba.'
  - where: 'note 12:25 “Jedidiah, beloved of the LORD”'
    claim: 'David means Beloved'
    key: bd-david
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/david?lang=eng'
    quote: 'Beloved. His life divides into four portions'
  - where: 'note 12:25 “Jedidiah, beloved of the LORD”'
    claim: 'Jedidiah is from the same root as David; the LORD commissioned Nathan to give a second name'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/12.htm'
    quote: 'Jehovah commissioned Nathan (for the phrase cp. Exodus 4:13) to give the boy a second name, which he did accordingly. … Jedidiah] That is Beloved of Jah. … It is derived from the same root as David, which means beloved or darling.'

  - where: 'note 12:31 “Saws, harrows and brickkilns”'
    claim: 'Keil reads torture, emending “put” to “sawed” as in Chronicles (the two verbs differ in one letter); the text does not say all were killed'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/12.htm'
    quote: 'בּמּגרה ויּשׂם, "he put them into the saw," does not give any appropriate sense; and there can be no doubt, that instead of וישׂם we should read ויּשׂר (from שׂוּר): "he cut (sawed) them in pieces."'
  - where: 'note 12:31 “Saws, harrows and brickkilns”'
    claim: 'Keil: not to be softened into hard labour; the text does not affirm all were put to death'
    key: keil-1-samuel
    url: 'https://biblehub.com/commentaries/kad/2_samuel/12.htm'
    quote: 'the cruelties inflicted upon the prisoners are not to be softened down, as Daaz and others propose, by an arbitrary perversion of the words into a mere sentence to hard labour, such as sawing wood, burning bricks, etc. At the same time, the words of the text do not affirm that all the inhabitants of Rabbah were put to death in this cruel manner.'
  - where: 'note 12:31 “Saws, harrows and brickkilns”'
    claim: 'Harrows are threshing-sledges; brickkiln as burning; judged by the standard of the age; the Ammonites brutal'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/12.htm'
    quote: 'These cruel punishments must be judged according to the standard of the age in which they were inflicted, not by the light of Christian civilisation. The Ammonites were evidently a savage and brutal nation (1 Samuel 11:1-2; 2 Samuel 10:1-5; Amos 1:13)'
  - where: 'note 12:31 “Saws, harrows and brickkilns”'
    claim: 'Harrows of iron are threshing-sledges'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/12.htm'
    quote: 'harrows of iron] Threshing-sledges of iron: sledges or frames armed on the underside with rollers or sharp spikes'
  - where: 'note 12:31 “Saws, harrows and brickkilns”'
    claim: 'BDB: the verb of 2 Sam. 12:31 probably “set men at (the use of) implements”; others read “sawed” as in Chronicles'
    key: bdb
    url: 'https://biblehub.com/hebrew/7760.htm'
    quote: 'set men at (the use of) implements 2 Samuel 12:31 (probably, compare Dr HPS; > ( ם) וַיָּשַׂ sawed them with, as "" 1 Chronicles 20:3, Th We)'
  - where: 'note 12:31 “Saws, harrows and brickkilns”'
    claim: 'BDB: malben is a brick-mould; the written text has an error'
    key: bdb
    url: 'https://biblehub.com/hebrew/4404.htm'
    quote: '1 brick-mould, 2 Samuel 12:31 Qr (Kt, by error, מלכן), Nahum 3:14.'
  - where: 'note 12:31 “Saws, harrows and brickkilns”'
    claim: 'ESV: set them to labor with saws and made them toil at the brick kilns'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+12%3A31&version=ESV'
    quote: 'And he brought out the people who were in it and set them to labor with saws and iron picks and iron axes and made them toil at the brick kilns.'
  - where: 'note 12:31 “Saws, harrows and brickkilns”'
    claim: 'NRSVue: set them to work with saws … or sent them to the brickworks'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=2+Samuel+12%3A31&version=NRSVUE'
    quote: 'He brought out the people who were in it and set them to work with saws and iron picks and iron axes or sent them to the brickworks.'
  - where: 'note 12:31 “Saws, harrows and brickkilns”'
    claim: 'Chronicles reads “cut them with saws”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/20?lang=eng'
    quote: 'And he brought out the people that were in it, and cut them with saws, and with harrows of iron, and with axes.'

  - where: christ
    claim: 'David’s failure resulted in a loss of blessings, but God never abandoned David or the covenant'
    key: taggart-sworn-david
    url: 'https://rsc.byu.edu/tender-mercies-loving-kindness/i-have-sworn-unto-david-my-servant'
    quote: 'Modern revelation makes clear that David’s failure to embody God’s ḥesed resulted in a loss of blessings (see Doctrine and Covenants 132:39), but the narrative asserts that God never abandoned David or the covenantal promise.'
  - where: christ
    claim: 'The Lord forgives those who fully repent but does not necessarily remove consequences'
    key: judd-davids-fall
    url: 'https://www.churchofjesuschrist.org/study/ensign/2018/10/what-we-can-learn-from-king-davids-fall?lang=eng'
    quote: 'And while the Lord offers forgiveness to those who fully repent, He does not necessarily remove the negative consequences of sinful behavior.'
  - where: christ
    claim: 'Moroni 8:8: little children are whole in Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/moro/8?lang=eng'
    quote: 'little children are whole, for they are not capable of committing sin; wherefore the curse of Adam is taken from them in me'

  - where: explore
    claim: 'The widow of Tekoah’s plan and the prophet sent to Ahab are like Nathan’s'
    key: cambridge-1-samuel
    url: 'https://biblehub.com/commentaries/cambridge/2_samuel/12.htm'
    quote: 'The prophet asks for the king’s decision, as though he were consulting him about a case which had really happened. Compare the plan adopted by the widow of Tekoah (ch. 2 Samuel 14:4-7); and by the prophet sent to rebuke Ahab (1 Kings 20:35-41).'
  - where: explore
    claim: 'Shannon’s essay on 2 Samuel 11–12'
    key: shannon-complex-stories
