chapter: 6
title: The LORD Is with Thee
tagline: Midian strips the land, a prophet reminds Israel why, and the LORD Himself calls a frightened farmer from a winepress, gives him a sign of fire, sends him against his father’s altar, clothes him with His Spirit, and bears with his fleece.
when: 'When Midian oppressed Israel seven years (6:1)'

setting: |
  After Deborah’s victory “the land had rest forty years” ([[Judg. 5:31]]). Chapter 6 opens the next turn of the book’s cycle in its own words: Israel “did evil in the sight of the LORD,” and the LORD gave them to Midian for seven years (verse 1); [[Judg. 2:11]] and [[Judg. 2:16]] explain the pattern. The oppression is new in kind. The Midianites, a confederation of wandering tribes from the desert who had troubled Israel since Moses’ day, came with their camels at harvest, year after year, and took the food.

  This chapter begins one of the longest stories in the book: Gideon fills chapters 6–8. He lived at Ophrah, a town of the tribe of Manasseh, in a small family, the Abi-ezrites (verses 11, 15). Chapter 6 tells his call, chapter 7 his victory with three hundred men, and chapter 8 the pursuit, his refusal of a crown and the ephod that became a snare.

  Later scripture remembers the victory as “the day of Midian” ([[Isa. 9:4]]; see also [[Ps. 83:9–11]]). Samuel names Gideon by the name this chapter gives him, Jerubbaal, among the deliverers the LORD sent ([[1 Sam. 12:11]]), and Hebrews counts him among those who “through faith subdued kingdoms” ([[Heb. 11:32–33]]).

thread: |
  The chapter follows the book’s frame: the evil, the oppression, the cry (verses 1–6). But the first answer to Israel’s cry is not a deliverer. It is a nameless prophet who recites the Exodus and says, “ye have not obeyed my voice” (verses 7–10), and the reproof was meant to turn Israel back to the God who had saved them before.

  Then the LORD comes Himself. He sits under an oak while Gideon beats out a little wheat in a pit where Midian will not see it, and greets the hiding man as a “mighty man of valour” (verses 11–12). Gideon answers with Israel’s question: if the LORD is with us, where are His miracles? (verse 13). The call that follows is shaped like Moses’ call: a commission, a protest of weakness, the promise “I will be with thee,” and a sign of fire from the rock. Only when the visitor vanishes does Gideon understand whom he has fed, and he builds an altar called “The LORD is peace” (verses 14–24).

  The call has two halves. In the first the LORD acknowledges Gideon. In the second, that same night, He requires Gideon to acknowledge Him: to pull down his own father’s altar to Baal and offer a bullock to the LORD on a new altar (verses 25–32). Gideon does it, by night and afraid, and wins a new name, Jerubbaal, “let Baal plead.” When Midian gathers again, the Spirit of the LORD clothes him, he sounds the trumpet, and four tribes come (verses 33–35). Still he asks for the fleece, wet and then dry, and God grants both (verses 36–40). The chapter leaves Gideon armed with promises, signs and the Spirit, and not yet sure of himself.

sections:
  - range: 1-6
    heading: Seven years under Midian
    plain: |
      The Israelites did what was evil in the Lord’s sight, and the Lord handed them over to Midian for seven years. Midian’s power was so heavy on Israel that the Israelites made hiding places for themselves in the mountain clefts, in caves and in strongholds. Whenever Israel had planted its crops, the Midianites, the Amalekites and the peoples of the east came up against them. They camped on the land and destroyed its produce all the way to Gaza, and left Israel nothing to live on: no sheep, no oxen, no donkeys. They came with their livestock and their tents, as thick as a swarm of grasshoppers; there was no counting them or their camels. They came into the land to ruin it. Israel was brought very low by Midian, and the Israelites cried to the Lord.
  - range: 7-10
    heading: A prophet’s reproof
    plain: |
      When the Israelites cried to the Lord because of Midian, the Lord sent them a prophet, who said: “This is what the Lord, the God of Israel, says: I brought you up from Egypt, out of the place where you were slaves. I rescued you from the Egyptians and from everyone who oppressed you. I drove them out before you and gave you their land. And I told you, ‘I am the Lord your God. Do not revere the gods of the Amorites, in whose land you live.’ But you have not listened to Me.”
  - range: 11-24
    heading: The call under the oak
    plain: |
      The angel of the Lord came and sat under the oak at Ophrah, which belonged to Joash the Abi-ezrite. Joash’s son Gideon was beating out wheat in the winepress to hide it from the Midianites. The angel of the Lord appeared to him and said, “The Lord is with you, mighty warrior.” Gideon answered, “Please, sir, if the Lord is with us, why has all this happened to us? Where are all His wonders that our fathers told us about, when they said, ‘Didn’t the Lord bring us up from Egypt?’ Now the Lord has abandoned us and handed us over to Midian.” The Lord turned to him and said, “Go in the strength you have and save Israel from Midian. Am I not the one sending you?” Gideon said, “Please, my Lord, how can I save Israel? My clan is the weakest in Manasseh, and I am the least in my father’s house.” The Lord said, “I will be with you, and you will strike down Midian as if it were one man.”

      Gideon said, “If I have found favor with you, give me a sign that it is really you speaking with me. Please don’t leave until I come back and bring my offering and set it before you.” He said, “I will wait until you return.” Gideon went in and prepared a young goat and unleavened cakes from an ephah of flour. He put the meat in a basket and the broth in a pot, brought them out to him under the oak, and offered them. The angel of God told him, “Put the meat and the unleavened cakes on this rock and pour out the broth,” and he did. Then the angel of the Lord touched the meat and the cakes with the tip of the staff in his hand. Fire flared up from the rock and consumed them, and the angel of the Lord vanished from his sight. When Gideon realized that it was the angel of the Lord, he cried, “Alas, Lord God! I have seen the angel of the Lord face to face!” The Lord said to him, “Peace be with you. Do not be afraid. You will not die.” Gideon built an altar to the Lord there and named it “The Lord Is Peace.” It still stands in Ophrah of the Abi-ezrites.
  - range: 25-32
    heading: Gideon pulls down his father’s altar
    plain: |
      That same night the Lord said to him, “Take your father’s young bull, the second bull, seven years old. Tear down your father’s altar to Baal and cut down the Asherah pole beside it. Then build a proper altar to the Lord your God on top of this stronghold, and offer the second bull as a burnt offering, using the wood of the Asherah pole you cut down.” Gideon took ten of his servants and did what the Lord had told him. Because he was afraid of his father’s household and of the men of the town, he did it at night instead of by day. When the townsmen got up early the next morning, Baal’s altar was torn down, the Asherah pole beside it was cut down, and the second bull had been offered on the newly built altar. They asked each other, “Who did this?” After searching, they were told, “Gideon son of Joash did it.” The men of the town said to Joash, “Bring out your son. He must die, because he tore down Baal’s altar and cut down the Asherah pole beside it.” But Joash said to the whole crowd standing against him, “Are you going to argue Baal’s case? Are you going to rescue him? Whoever argues for him will be put to death while it is still morning. If Baal is a god, let him argue his own case, since someone has torn down his altar.” So that day Gideon was called Jerubbaal, meaning “Let Baal argue with him,” because he tore down Baal’s altar.
  - range: 33-35
    heading: The Spirit and the trumpet
    plain: |
      Then all Midian, Amalek and the peoples of the east gathered, crossed over and camped in the valley of Jezreel. The Spirit of the Lord clothed Gideon. He blew the ram’s horn, and the Abi-ezrites rallied behind him. He sent messengers throughout Manasseh, and they rallied to him too, and he sent messengers to Asher, Zebulun and Naphtali, and they came up to join them.
  - range: 36-40
    heading: The fleece
    plain: |
      Gideon said to God, “If You are going to save Israel by my hand, as You have said, then look: I am putting a wool fleece on the threshing floor. If there is dew only on the fleece and the ground all around is dry, I will know that You will save Israel by my hand, as You said.” And that is what happened. When he got up early the next morning and squeezed the fleece, he wrung out enough dew to fill a bowl with water. Then Gideon said to God, “Don’t be angry with me; let me speak just once more. Let me test once more with the fleece: this time let the fleece be dry and the ground all around be wet with dew.” That night God did so. Only the fleece was dry, and there was dew on all the ground.

notes:
  - ref: 5
    phrase: they came as grasshoppers for multitude
    kind: history
    title: Who the Midianites were
    body: |
      The Midianites were a confederation of wandering tribes, related to the Hebrews but often at war with them. They are an old enemy in the story: it was a Midianite caravan that carried Joseph to Egypt ([[Gen. 37:28]]; [[Gen. 37:36]]), and Israel fought them in the wilderness ([[Num. 31:2–7]]). The Amalekites who ride with them had fought Israel in the wilderness too ([[Ex. 17:8–14]]).

      What made this oppression different was its method. These were seasonal raids aimed at the food supply: the invaders waited until Israel had sown (verse 3), came up out of the deserts to the south and east like swarms of locusts, and carried away the grain and the livestock Israel lived on. That is why Israel went into the caves and strongholds of verse 2, and why the next scene finds Gideon hiding his wheat. “Without number” is the language of a storyteller, likely meant to make the reader feel Israel’s plight more than to count the camels.
    sources: [bd-midianites, ot-minute-judg-6, ot-manual-judges-1-12]

  - ref: 8
    phrase: the LORD sent a prophet unto the children of Israel
    kind: history
    title: A prophet before a deliverer
    body: |
      The LORD’s first answer to Israel’s cry is not rescue but a reminder of why they need it. The prophet is never named, and his message has no promise in it. He recites what the LORD did (Egypt, the house of bondage, the land given), repeats the one command that mattered here, not to fear the gods of the Amorites, and ends with the charge: “but ye have not obeyed my voice” (verse 10).

      The order matters to the story. Before He raises a deliverer, the Lord sends a prophet “to rebuke Israel for its disobedience,” so that Israel hears what it has done before it hears what He will do. The recital of the Exodus also sets up the next scene: Gideon will ask where that God of the Exodus has gone (verse 13).
    sources: [schutze-gideon]

  - ref: 11
    phrase: his son Gideon threshed wheat by the winepress, to hide it from the Midianites
    kind: history
    title: Threshing in a winepress
    body: |
      Gideon is hiding: the Hebrew says he was “in the winepress,” not beside it, and the verse gives the reason, “to hide it from the Midianites.” Grain was normally threshed in the open, on a hard floor or a field rolled flat, where oxen or threshing sledges were driven over the sheaves. A winepress was the opposite kind of place: a vat sunk in the ground or cut into the rock. The verb here means to beat with a stick, the way poor people knocked out the little grain they had gleaned (as Ruth did, [[Ruth 2:17]]). In one older description, that is what the times had reduced Gideon to, though his father was probably the head of the clan and the owner of Ophrah.

      Into that pit comes the greeting “The LORD is with thee, thou mighty man of valour” (verse 12). Gideon did not think he was a mighty warrior, and his answers in verses 13 and 15 show it. The greeting is a promise more than a description: the LORD would be with him, and he would prove a hero through the LORD’s strength.
    sources: [lds-scriptures, keil-judges, schutze-gideon]

  - ref: 13
    phrase: where be all his miracles which our fathers told us of
    kind: scripture
    title: Where are the miracles?
    body: |
      Gideon’s question is Israel’s question, and the Book of Mormon takes it up. He has heard the stories of the Exodus from his fathers, and he sees Midian in the fields, so he concludes that “the LORD hath forsaken us.”

      The Church’s footnote to “miracles” sends the reader to [[Morm. 9:15–20]], where Moroni takes up the same question for a later people. God has not changed; He “is a God of miracles” ([[Morm. 9:19]]). Moroni puts the reason on the human side: “the reason why he ceaseth to do miracles among the children of men is because that they dwindle in unbelief, and depart from the right way, and know not the God in whom they should trust” ([[Morm. 9:20]]). Gideon does not yet recognize that the God he thinks has left is sitting in front of him.
    sources: [lds-scriptures, ot-minute-judg-6]

  - ref: 14
    phrase: 'Go in this thy might, and thou shalt save Israel from the hand of the Midianites: have not I sent thee?'
    kind: scripture
    title: A call like Moses’
    body: |
      Gideon’s call is told on the pattern of Moses’ call at the burning bush ([[Ex. 3–4]]). The parallels run in order: a divine charge (verse 14), the reluctance of the one called (verse 15), divine reassurance (verse 16), and finally the appearance of God (verse 22). The effect is to present Gideon as a Moses-like figure ordained by God.

      The wording carries the echo. Both halves of the LORD’s promise to Moses return: “Certainly I will be with thee; and this shall be a token unto thee, that I have sent thee” ([[Ex. 3:12]]). “Have not I sent thee?” (verse 14) answers to the second half, and the reassurance in verse 16, “Surely I will be with thee,” is in Hebrew the same three words as the first: *kî ʾehyeh ʿimmāk*. The English hides the match; the Hebrew makes it exact.

      Gideon is a reluctant hero, like Enoch, Moses, or Barak two chapters earlier; he protests his weakness and his disbelief that he has been chosen. The LORD does not argue with the protest. He answers that Gideon will “smite the Midianites as one man” (verse 16): the vast army would fall as though it were a single man.
    sources: [ot-minute-judg-6, oshb-wlc, haws-better-way, schutze-gideon]

  - ref: 22
    phrase: Alas, O Lord GOD! for because I have seen an angel of the LORD face to face
    kind: christ
    title: The angel who is the LORD
    body: |
      The visitor under the oak is the LORD Himself, and the chapter lets Gideon find that out slowly. The narrator calls Him “an angel of the LORD” (verses 11–12), then simply “the LORD” (verses 14, 16), then “the angel of God” (verse 20), and “the LORD” again when He speaks peace (verse 23). Gideon takes Him for a man, talks with Him at length, and only after the fire from the rock does he realize whom he has been speaking with. The angel of the LORD here is Jehovah, and the scene is strikingly physical: He sits under a tree, carries a staff, and waits while a meal is cooked. In some Old Testament passages the angel of the LORD “speaks as the voice of God Himself”; the notes at [[Gen. 16:7]] and [[Ex. 3:2]] take up who He is. Judges returns to Him at [[Judg. 2:1]] and [[Judg. 13:21–22]].

      Gideon’s cry is fear of death. The LORD had told Moses, “there shall no man see me, and live” ([[Ex. 33:20]]), and Manoah will say the same as Gideon: “We shall surely die, because we have seen God” ([[Judg. 13:22]]). Jacob had marveled that he saw God face to face “and my life is preserved” ([[Gen. 32:30]]). Restoration scripture tells how Moses could bear such a meeting: he saw God “not my natural, but my spiritual eyes, for my natural eyes could not have beheld,” and “I was transfigured before him” ([[Moses 1:11]]).

      The LORD answers the fear directly: “Peace be unto thee; fear not: thou shalt not die” (verse 23). Gideon names the altar for that word, Jehovah-shalom, “Jehovah is peace,” and the name itself is a further sign that he had met the LORD.
    sources: [ot-minute-judg-6, bd-angels]

  - ref: 25
    phrase: even the second bullock of seven years old
    kind: history
    title: Beginning at his father’s altar
    body: |
      Gideon’s first task as deliverer is at home. The LORD does not send him against Midian yet; He sends him against the altar of Baal that belongs to his own father, and against the “grove” beside it. The grove is an Asherah pole, the wooden symbol of a fertility goddess; Baal and Asherah are explained at [[Judg. 2:13]]. His judgeship begins on a family level. One older reading takes the altar, from verses 28–29, as the common altar of the whole clan of Abiezer in Ophrah, which would explain why the men of the town rise to defend it. The order is the point: the altar of Baal comes down before the altar to the LORD goes up, and the wood of the Asherah pole becomes the fuel for the LORD’s burnt offering (verse 26).

      The “second bullock of seven years old” is a puzzle, since only one bull is offered. One older reading takes the verse as naming a single animal, “the second” in age among Joash’s bulls, and sees its age as a deliberate echo: the bull is seven years old because Israel had been seven years under Midian (verse 1) for its idolatry, and that sin is what the offering addresses. The text does not explain the age, so this remains a reading.

      Gideon obeys and is afraid: he does it by night, with ten servants, “because he feared his father’s household, and the men of the city” (verse 27). The chapter does not hide the fear.
    sources: [ot-minute-judg-6, schutze-gideon, keil-judges, lds-scriptures]

  - ref: 32
    phrase: Therefore on that day he called him Jerubbaal
    kind: words
    title: Two names for one night’s work
    body: |
      Jerubbaal can mean “let Baal plead” or “let Baal contend,” and it is Joash’s answer to the mob: if Baal is a god, he can defend his own altar. The name is a pun on Joash’s words in Hebrew: *yĕrubbaʿal*, “Jerubbaal,” and *yāreb bô habbaʿal*, “let Baal plead against him.” As a name for Gideon, its sense is “he that striveth with Baal.”

      Gideon’s own name fits the same night. It comes from a root meaning “to cut off,” and so means “hewer down”: the man named Hewer begins his career by hewing down the Asherah pole. Both names, then, describe what he did at his father’s altar, and the new one stayed with him. Judges calls him “Jerubbaal, who is Gideon” ([[Judg. 7:1]]), and Samuel later lists “Jerubbaal” among the deliverers the LORD sent ([[1 Sam. 12:11]]).

      Joash is the surprise of the scene. He owned the altar, and now he stands against “all that stood against him” (verse 31) for the son who destroyed it.
    sources: [scripture-helps-judges, ot-minute-judg-6, bd-jerubbaal, bd-gideon, lds-scriptures]

  - ref: 34
    phrase: the Spirit of the LORD came upon Gideon
    kind: words
    title: The Spirit clothed Gideon
    body: |
      “Came upon” translates a Hebrew verb, *lāḇĕšâ*, that means “clothed”: a literal rendering reads “the Spirit of Jehovah hath clothed Gideon,” an image the English hides.

      The effect is immediate. The man who hid in a winepress blows the ram’s horn, his own clan answers first, then all Manasseh, then Asher, Zebulun and Naphtali (verses 34–35). As with Othniel ([[Judg. 3:10]]), the Spirit of the LORD is what marks Gideon as a judge. What that Spirit gave the judges, and what it did not, is taken up at [[Judg. 14:6]].
    sources: [biblehub-interlinear, ot-minute-judg-6]

  - ref: 37
    phrase: Behold, I will put a fleece of wool in the floor
    kind: scripture
    title: The fleece, wet and then dry
    body: |
      Gideon asks for this sign after he has already had one, and he asks in faith: seeking confirmation from God with real intent is not the same as demanding a sign without faith, and Gideon “sought for a sign in faith.” The fleece goes further than that first sign: it comes after the fire from the rock (verse 21) and after the Spirit had clothed him (verse 34).

      The two tests are not a repetition. In one older reading, the first sign was not quite certain, because wool gathers dew even when the ground around it stays dry; so Gideon asked for the reverse, a dry fleece on wet ground. The same reading holds that the request came not from a lack of faith but from “the weakness of the flesh.”

      A faithful reader may still ask whether so many signs are a caution, since after the fire and the fleece Gideon needs to overhear a Midianite’s dream before he acts ([[Judg. 7:9–15]]), or whether the point is how generous the Lord is with reassurance when His servants hesitate. These are questions about the story, not a verdict on Gideon, and the text gives none: God simply “did so that night” (verse 40).
    sources: [scripture-helps-judges, keil-judges, haws-better-way]

christ: |
  The visitor who called Gideon was the angel of the LORD, Jehovah, and Latter-day Saints know Jehovah as the premortal Jesus Christ (see [[Ex. 3:14]]). He came to a frightened man hiding his grain, called him by what he would become, answered his doubts with signs, and answered his fear of death with peace (verse 23). As with Israel then, no matter what has led a person away from Jesus Christ, He is the Redeemer of Israel and is always willing to deliver and welcome back those who return to Him. And He often calls His servants the way He called Gideon: He does not ask them to become strong first and then serve, but sends them out in the strength they have and makes them mighty.

explore: |
  - **Two calls side by side.** Read [[Ex. 3:1–4:17]] beside verses 11–24: the charge, the protest, “I will be with thee,” the sign.
  - **Seeing God and living.** [[Gen. 32:30]], [[Ex. 33:20]], [[Judg. 13:22]] and [[Moses 1:9–11]].
  - **Where are the miracles?** [[Morm. 9:7–21]] and [[Moro. 7:27–37]].
  - **The story goes on.** [[Judg. 7]] cuts the army to three hundred. The Maxwell Institute reflection “Longing for a Better Way” is especially good on Gideon and his house, chapters 6–9.

