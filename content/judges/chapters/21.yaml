chapter: 21
title: One Tribe Lacking in Israel
tagline: Israel weeps for the tribe it nearly destroyed, keeps its oaths by destroying Jabesh-gilead and by letting Benjamin seize the daughters of Shiloh, and the book ends with no king in Israel.
when: 'When there was no king in Israel (verse 25), just after the war with Benjamin'

setting: |
  Chapter 21 is the last chapter of Judges and the end of its third part, the “two narratives, which specially show the tendency to idolatry and lawlessness” (chapters 17–21). It finishes the last of three stories about the tribe of Benjamin that close the book: the crime at Gibeah ([[Judg. 19]]), the war in which the other tribes all but wiped Benjamin out ([[Judg. 20]]), and now the aftermath, in which Israel tries to save the tribe it has just nearly destroyed.

  The war left six hundred men of Benjamin alive in the rock Rimmon ([[Judg. 20:47]]) and the tribe's towns burned ([[Judg. 20:48]]). When the tribes gathered at Mizpeh before the war ([[Judg. 20:1]]), they had sworn two oaths (verses 1 and 5), and this chapter is about what those oaths now required. The one clue to when it happened is that Phinehas, Aaron's grandson, was still serving before the ark ([[Judg. 20:28]]).

  Two of the hardest scenes in the book come here, the destruction of Jabesh-gilead (verses 10–12) and the seizing of the young women of Shiloh (verses 20–23). The notes say plainly what was done and how the Church's sources read it. How the Church reads the violence of this period as a whole is explained at [[Josh. 6:21]].

thread: |
  The chapter is a people trying to undo a disaster of its own making without undoing its own words. It opens on two oaths (verses 1 and 5) and comes back to them at every step (verses 7 and 18). Israel weeps before God, asks Him why a tribe is missing, builds an altar, and offers sacrifice (verses 2–4); then, with no answer recorded, it answers its own question. Jabesh-gilead sent no one to the war, so the oath of verse 5 dooms that town, and its four hundred young women are given to Benjamin (verses 8–14). That is not enough, and the oath of verse 1 forbids Israel's fathers to give their daughters, so the elders tell the remaining Benjamites to take daughters who are not given, at a feast of the LORD (verses 16–23).

  The oaths were sworn unwisely, and they brought disaster on Israel and Benjamin alike. Each step solves a problem the last step made, and the LORD, who answered every time Israel asked in [[Judg. 20]], is asked once here, and no answer is recorded. The tribes go home (verse 24), and the book ends with the line that has framed its last chapters: there was no king in Israel, and every man did what was right in his own eyes (verse 25).

sections:
  - range: 1-4
    heading: Weeping for Benjamin
    plain: |
      The men of Israel had sworn an oath at Mizpah: “None of us will give his daughter in marriage to a Benjamite.” The people went to the house of God (or Bethel) and sat there before God until evening, weeping bitterly and loudly. “O LORD, God of Israel,” they said, “why has this happened in Israel, that today one tribe should be missing from Israel?” Early the next morning the people built an altar there and offered burnt offerings and peace offerings.
  - range: 5-14
    heading: Jabesh-gilead
    plain: |
      Then the Israelites asked, “Which of all the tribes of Israel did not come up to the assembly before the LORD?” For they had sworn a solemn oath that anyone who did not come up to the LORD at Mizpah must be put to death. The Israelites grieved for their brother Benjamin. “Today one tribe has been cut off from Israel,” they said. “How can we provide wives for those who are left, since we have sworn by the LORD not to give them any of our daughters?” So they asked, “Which of the tribes of Israel did not come up to the LORD at Mizpah?” It turned out that no one from Jabesh-gilead had come to the camp for the assembly: when the people were counted, none of its inhabitants were there. So the assembly sent twelve thousand of its best fighting men with orders: “Go and kill the people of Jabesh-gilead with the sword, women and children included. This is what you are to do: destroy every male and every woman who has slept with a man.” Among the people of Jabesh-gilead they found four hundred young women who had never slept with a man, and they brought them to the camp at Shiloh in the land of Canaan. Then the whole assembly sent word to the Benjamites at the rock of Rimmon, offering them peace. So Benjamin came back, and they were given the women of Jabesh-gilead who had been spared. But there were not enough for all of them.
  - range: 15-23
    heading: The daughters of Shiloh
    plain: |
      The people grieved for Benjamin, because the LORD had made a gap in the tribes of Israel. The elders of the assembly said, “How can we provide wives for the men who are left, since the women of Benjamin have been destroyed? There must be an inheritance for the survivors of Benjamin, so that a tribe of Israel will not be wiped out. But we cannot give them our own daughters as wives, for we Israelites have sworn, ‘Cursed is anyone who gives a wife to a Benjamite.’ Look, there is a yearly feast of the LORD at Shiloh, north of Bethel, east of the road that goes up from Bethel to Shechem, and south of Lebonah.” So they told the Benjamites, “Go and hide in the vineyards and watch. When the young women of Shiloh come out to join in the dancing, rush out of the vineyards, and each of you seize a wife from the young women of Shiloh and go home to the land of Benjamin. When their fathers or brothers come to us to complain, we will tell them, ‘Be favorable to them for our sake, because we did not get a wife for each of them in the war. And you are not guilty of breaking your oath, because you did not give your daughters to them.’” The Benjamites did so. While the young women were dancing, each man caught one and carried her off to be his wife. Then they went back to their inheritance, rebuilt the towns, and settled in them.
  - range: 24-25
    heading: No king in Israel
    plain: |
      At that time the Israelites left that place and went home, each to his own tribe and family, each to his own inheritance. In those days Israel had no king; everyone did as he saw fit.

notes:
  - ref: 3
    phrase: one tribe lacking in Israel
    kind: history
    title: One tribe lacking
    body: |
      Israel's lament is that a whole tribe is about to drop out of Israel. The people wept at “the house of God” (verse 2), which in the Hebrew is *Beth-el*, the “house of God” where they had asked the LORD during the war ([[Judg. 20:18]]); whether that was the town of Bethel is discussed at [[Judg. 20:27]]. There they built an altar and offered burnt offerings and peace offerings (verse 4).

      The question, “why is this come to pass,” has an answer in the chapters before it. Israel's own army had put Benjamin's towns to the sword and the fire ([[Judg. 20:48]]), so that “the women are destroyed out of Benjamin” (verse 16), and Israel had sworn not to give Benjamin wives (verse 1). In chapter 20 the tribes asked the LORD three times and He answered each time ([[Judg. 20:18]], [[Judg. 20:23]], [[Judg. 20:28]]). Here they ask, and the chapter records no answer. They count the camp instead (verses 8–9) and find their own ways around their oaths. On one reading, the stratagems that follow show problems “solved” when “divine aid is noticeably absent.”
    sources: [oshb-wlc, goff-plagiary]

  - ref: 5
    phrase: they had made a great oath
    kind: history
    title: Two oaths, and Jabesh-gilead
    body: |
      Two oaths sworn at Mizpeh before the war shape what Israel does in this chapter: that whoever did not come up to the LORD would die, and that no one would give a daughter to Benjamin (verses 1, 5, 7, 18). The text goes straight from the one to the other: asking how to find wives without breaking the second (verse 7), the assembly asks who did not come up (verse 8). Jabesh-gilead had sent no one (verses 8–9), so twelve thousand men were sent to destroy the town, and only four hundred young women were spared and given to Benjamin (verses 10–14). The text tells it without a word of approval.

      The Book of Mormon tells of another oath that brought disaster. When the Nephites swore to avenge themselves on the Lamanites, Mormon refused to lead them, and the oath ended in a battle that nearly destroyed them ([[Morm. 3:9–16]]).
    sources: [sc-evidence-302]

  - ref: 19
    phrase: there is a feast of the LORD in Shiloh yearly
    kind: history
    title: A feast of the LORD in Shiloh
    body: |
      The Benjamites are sent to a pilgrimage feast at the sanctuary, and the text does not say which feast it was. The word for feast, *ḥag*, implies a pilgrimage to a sanctuary, and Shiloh was where the tabernacle stood (see [[Josh. 18:1]]). One older reading takes it as most probably a vintage festival, a time of special rejoicing, with the vines still in leaf (verse 20); another takes it as one of the three great annual feasts, and of those most likely Passover, though possibly Tabernacles. Each offers its answer only as probable.

      The long directions (north of Bethel, east of the road to Shechem, south of Lebonah) are, in one older reading, probably a note added for later readers, after the exile, who by then needed to be told where the ancient sites had been.
    sources: [cambridge-judges, keil-judges]

  - ref: 21
    phrase: catch you every man his wife of the daughters of Shiloh
    kind: history
    title: Taken at the dance
    body: |
      The elders tell the two hundred Benjamites who were still without wives to hide in the vineyards and carry off young women of Shiloh while they danced, and the men do it (verses 20–23). It was a way around their vow: the fathers of Shiloh would not have given their daughters, so, by the elders' reasoning, no one would have broken the oath (verse 22). Benjamin's survivors were given wives “although not in a righteous manner,” so that the tribe would survive.

      Nothing in the text approves it. Israel's encouragement of the Benjamites to kidnap Israel's own daughters “speaks badly of all Israel,” and one reading holds that “it is clear that the narrators do not approve of these stratagems.” What Judges 19–21 depicts, “particularly toward women,” is “not an acceptance or tolerance of the unacceptable but a condemnation of the deplorable.”
    sources: [goff-stealing, ot-manual-judges-13-21, goff-plagiary, schade-broken-laws]

  - ref: 21
    phrase: if the daughters of Shiloh come out to dance in dances
    kind: scripture
    title: The daughters of the Lamanites
    body: |
      The Book of Mormon tells a story very like this one, and the Church's footnote to “dance” points to it ([[Mosiah 20:1–5]]). The wicked priests of King Noah, who had abandoned their own wives and children, hid near Shemlon, where the daughters of the Lamanites gathered to dance, and carried off twenty-four of them to be their wives.

      One Latter-day Saint reading agrees with the book's critics that the Nephite record draws on the story from Judges, but finds that it does not simply copy it. On that reading, the Book of Mormon story alludes to the biblical one, and the two may be meant to be read side by side; the allusion makes a point of its own. When the Lamanites came, the men who would not leave their wives and children sent their daughters out to plead with the Lamanites for mercy, while Noah's priests fled and left their families behind ([[Mosiah 19:11–13]]). Later Amulon, the priests' leader, sent out the Lamanite daughters they had carried off to plead in the same way ([[Mosiah 23:33–34]]). The two pleas look alike, but one came from men who stayed with their families and the other from men who had abandoned theirs, and the pairing teaches that “what appear to be the same actions actually differ when performed by the good-hearted on the one hand or the evil-hearted on the other.”
    sources: [goff-stealing, goff-plagiary]

  - ref: 22
    phrase: for ye did not give unto them at this time, that ye should be guilty
    kind: words
    title: Not given, so not guilty
    body: |
      The elders' last clause is their answer to the angry fathers: you did not give your daughters, so you have not broken your oath. The King James words are hard to follow, and in one older reading so is the Hebrew: the verse “is difficult to understand owing to corruptions in the text,” and that reading emends the end to mean: had you given them, you would now be guilty of breaking your oath. Another older reading keeps the text as it stands and reaches the same point: the fathers may let their daughters stay with the Benjamites who took them by force, “for ye have not given them voluntarily.”

      So the oath is kept in its words. The fathers never give; the daughters are taken; and the elders promise to ask the families to accept it as a kindness to them (“Be favourable unto them for our sakes”). The plain-words paraphrase above follows this reading.
    sources: [cambridge-judges, keil-judges]

  - ref: 25
    phrase: In those days there was no king in Israel
    kind: history
    title: The book ends where it began to fall
    body: |
      Judges ends on its refrain, and the last line sums up the book's account of Israel's decline. What the refrain means, and Moses' words behind it, are explained at [[Judg. 17:6]]. Here it closes the book, and the closing sentence calls the reader's attention to Israel's “lack of unity.” The last two stories show the same lack and “may be implying the need for a king.”

      The book has been heading here from the start. Each generation “corrupted themselves more than their fathers” ([[Judg. 2:19]]); the last rest the book records is the forty years of quietness in Gideon's days ([[Judg. 8:28]]); then the LORD says “I will deliver you no more” ([[Judg. 10:13]]); and Samson only begins to deliver ([[Judg. 13:5]]). The cycles worsen until the book ends in civil war and the near annihilation of Benjamin. The last chapters show that doing what is right in one’s own eyes is often “the same thing as doing what is evil in the Lord’s eyes.”

      Earlier in the book, Gideon refused a crown with the words “the LORD shall rule over you” ([[Judg. 8:23]]). In one Latter-day Saint reading, that is the loss the refrain names: “God’s kingship and leadership were replaced with the machinations of self,” and what Israel lacked was the Lord’s guidance, not only a king. So Judges seems to plead for the rise of prophecy that would come through the prophet Samuel, and the book is “a bridge to better things and not the solution to the story.” The next books tell what followed: Samuel, and then the kings.
    sources: [lds-scriptures, bd-judges, scripture-helps-judges, schade-broken-laws, goff-stealing]

christ: |
  The pattern of Judges 3 teaches of the Savior's power to deliver from sin (see [[Judg. 15]]), and the LORD who raised up the judges is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). In this last chapter no deliverer is raised up, and Israel finds its own ways around its oaths. Even so, the God of Judges is the one who loves those who don't always love Him and is always willing to reach out to the sinner, leading Israel toward communion with Him “as their king and their God.”

  Stories like these, in one Latter-day Saint reading of the Old Testament's violence, “exist to be condemned and to show the need for a different way.” A disciple who lets the Lord's eyes, not his own, decide what is right is living under the King that Judges points to.

explore: |
  - [[Judg. 19]] and [[Judg. 20]]: the crime at Gibeah and the war that lead to this chapter.
  - [[1 Sam. 11:1–11]]: Jabesh-gilead again, rescued by Saul, a man of Benjamin.
  - [[Mosiah 20:1–5]]: the daughters of the Lamanites carried off by the priests of Noah.
  - [[Morm. 3:9–16]]: another oath sworn in anger, and the prophet who would not lead it.
  - [[Ruth 1:1]]: the book that follows, set “in the days when the judges ruled.”
  - [“Broken Laws as ‘Every Man Did That Which Was Right in His Own Eyes’”](https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes), on how to read the hardest chapters of Judges.

