chapter: 15
title: This Great Deliverance
tagline: Refused his wife, Samson burns the Philistines’ harvest; they burn her and her father; Judah binds him and hands him over, and at Lehi he kills a thousand with a jawbone, then calls on the LORD and is given water.
when: 'When the Philistines ruled over Israel (verse 11)'

setting: |
  Samson’s story (chapters 13–16) opens on the cycle’s oppression: the LORD gave Israel “into the hand of the Philistines forty years” ([[Judg. 13:1]]), and the angel promised a son who would only “begin to deliver Israel out of the hand of the Philistines” ([[Judg. 13:5]]). Chapter 14 set up this one. Samson married a woman of Timnath; at the wedding feast the Philistine guests forced her to learn his riddle by threatening to burn her and her father’s house; Samson paid his wager with thirty men killed at Ashkelon, went home angry, and his wife was given to his companion ([[Judg. 14:15–20]]).

  Chapter 15 carries on the same portrait of Samson as a hothead, and moves through three episodes: the foxes and the fire (verses 1–8), the jawbone at Lehi (verses 9–17), and the spring (verses 18–20). He was blessed with great physical strength from God and failed his calling through selfish and unrighteous choices; what the Spirit of the LORD upon him means is explained at [[Judg. 14:6]]. Verse 20 closes the account of his judging with “twenty years,” a figure repeated at his burial ([[Judg. 16:31]]); chapter 16 tells his fall and death, and the note on [[Judg. 16:30]] weighs what his calling came to.

thread: |
  The chapter is a chain of answers, each side repaying the last. The father gives Samson’s wife away, so Samson says he will be “blameless” this time and burns the Philistines’ harvest (verses 2–5). The Philistines answer by burning the woman and her father, the very fire they had threatened at the feast (verse 6; [[Judg. 14:15]]). Samson answers with “a great slaughter” and says he will stop when he is avenged (verses 7–8). The Philistines come up into Judah “to do to him as he hath done to us” (verse 10), and Samson tells the men of Judah, “As they did unto me, so have I done unto them” (verse 11).

  Two things in the chapter stand outside that exchange. The first is the LORD’s part, which the narrator names while Samson does not: the cords fall from him when “the Spirit of the LORD came mightily upon him” (verse 14), and his strength is credited to that Spirit. The second is Samson’s thirst. After his boast over the heaps of dead (verse 16), he fears he will die of thirst, and for the first time in his story he speaks to the LORD, calling the victory “this great deliverance” given into the hand of “thy servant” (verse 18). God opens a spring, and Samson names it for his own calling out (verse 19). The chapter ends there, on the twenty years he judged (verse 20).

sections:
  - range: 1-8
    heading: The foxes and the fire
    plain: |
      Some time later, at the wheat harvest, Samson went to visit his wife, bringing a young goat. “I will go in to my wife in her room,” he said, but her father would not let him in. “I was sure you had come to hate her,” her father said, “so I gave her to your companion. Isn’t her younger sister prettier than she is? Please, take her instead.” Samson said, “This time I shall be blameless toward the Philistines when I do them harm.” So Samson went and caught three hundred foxes, took torches, turned the animals tail to tail, and fastened a torch between each pair of tails. He lit the torches and let the animals loose into the Philistines’ standing grain, and burned up the sheaves and the standing grain, the vineyards and the olive trees. The Philistines asked, “Who did this?” They were told, “Samson, the Timnite’s son-in-law, because the Timnite took his wife and gave her to his companion.” So the Philistines went up and burned her and her father to death. Samson said to them, “Since you have done this, I will be avenged on you, and after that I will stop.” He struck them down in a great slaughter, and then he went down and stayed in the cleft of the rock of Etam.
  - range: 9-13
    heading: Judah binds Samson
    plain: |
      Then the Philistines went up, camped in Judah, and spread out at Lehi. The men of Judah asked, “Why have you come up against us?” They answered, “We have come up to take Samson prisoner and do to him what he has done to us.” So three thousand men of Judah went down to the cleft of the rock of Etam and said to Samson, “Don’t you know that the Philistines rule over us? What is this you have done to us?” He answered, “I did to them what they did to me.” “We have come down to tie you up and hand you over to the Philistines,” they said. Samson said, “Swear to me that you will not attack me yourselves.” “No,” they said, “we will only tie you up and hand you over to them; we certainly will not kill you.” So they tied him with two new ropes and brought him up from the rock.
  - range: 14-17
    heading: The jawbone at Lehi
    plain: |
      As he came to Lehi, the Philistines came shouting to meet him. Then the Spirit of the LORD came powerfully upon him, the ropes on his arms became like flax that has burned in a fire, and the bonds dropped from his hands. He found a fresh jawbone of a donkey, reached out, took it, and killed a thousand men with it. Then Samson said, “With the jawbone of a donkey, heaps upon heaps; with the jawbone of a donkey I have killed a thousand men.” When he had finished speaking, he threw the jawbone away, and the place was called Ramath-lehi, “the height of the Jawbone.”
  - range: 18-20
    heading: The spring of him who called
    plain: |
      He was very thirsty, and he called on the LORD and said, “You have given your servant this great deliverance. Must I now die of thirst and fall into the hands of the uncircumcised?” So God split open the hollow place that is at Lehi, and water came out of it. When he drank, his spirit came back to him and he revived. That is why he named it En-hakkore, “the spring of him who called”; it is still at Lehi today. Samson judged Israel twenty years in the days of the Philistines.

notes:
  - ref: 2
    phrase: I verily thought that thou hadst utterly hated her
    kind: history
    title: A wife given to another
    body: |
      The father’s excuse looks back to the wedding, where Samson’s wife was given to his best man while he was away in anger (see [[Judg. 14:20]]). Now Samson comes back at harvest time bringing a kid, which one older reading takes as the customary present a man brought (compare [[Gen. 38:17]]), and asks to go in to her room. The father offers her younger sister instead.

      Samson’s answer in verse 3 turns a family quarrel into a quarrel with a nation. The father wronged him, but it is “the Philistines” he will now be blameless toward when he harms them. One older reading sees this as the point of the verse: Samson took his father-in-law’s treatment as one sign of how the Philistines in general treated Israel, and resolved to avenge it on all of them. The burning of the fields follows from that.
    sources: [lds-scriptures, keil-judges]

  - ref: 4
    phrase: caught three hundred foxes
    kind: words
    title: Foxes or jackals
    body: |
      The animals may have been jackals rather than foxes. The Hebrew *šûʿāl* means fox, perhaps also jackal, and here “perhaps (from large number)” jackal: three hundred animals is a great many to catch. Either way the King James “foxes” is a fair rendering of the word.

      Whatever the animals were, the damage came from the timing. It is the wheat harvest (verse 1), so the fire takes the sheaves already cut and the grain still standing, and spreads to the vineyards and the olive trees (verse 5).
    sources: [bdb, lds-scriptures]

  - ref: 8
    phrase: the top of the rock Etam
    kind: history
    title: The cleft of the rock
    body: |
      Samson hid in a cave, not on a summit. The Hebrew *sĕʿîp̄ selaʿ ʿêṭām* is better rendered “cleft of the rock of Etam,” as most modern translations have it: a natural cleft or cavern in the bedrock. Where it was is less certain. Scripture places an Etam of Judah near Bethlehem ([[2 Chr. 11:6]]), and modern geographers almost all put it southwest of Jerusalem and northwest of Bethlehem, which would place the cave in the hills of Judah.
    sources: [chadwick-beit-lei]

  - ref: 9
    phrase: spread themselves in Lehi
    kind: history
    title: Lehi, the Jawbone
    body: |
      Lehi means “jaw” or “jawbone,” and the story knows it: the Philistines camp at Jawbone, and Samson kills them with a jawbone (verse 15) and names the hill Ramath-lehi, the height or high place of Lehi (verse 17). It may be that the author chose the name to fit the story, or that the place took its name from Samson’s victory. The story’s geography places it in the Judean hills, not far from Etam.

      Latter-day Saint readers naturally wonder whether the prophet Lehi’s name is the same word. It is a reasonable assumption, though the name could have other origins. What can be said firmly is negative. The ruin called Khirbet Beit Lei was once promoted as both Samson’s Lehi and the prophet Lehi’s home, and neither holds: the Arabic *lei* means “twisting,” not “jawbone,” the site lies east of Lachish in the southern Shephelah, well south of the Sorek Valley where Samson’s story is set, and it had no settlement in the Iron Age, so it cannot have been the home of a man who “lived at Jerusalem just prior to 600 BC.” The idea that Samson’s battlefield was the site of Lehi’s home has, likewise, “no evidence to support” it.
    sources: [ot-minute-judg-15, chadwick-beit-lei, ot-manual-judges-13-21]

  - ref: 11
    phrase: Knowest thou not that the Philistines are rulers over us?
    kind: history
    title: Judah hands over its deliverer
    body: |
      The men of Judah come out in force against their own deliverer. Three thousand of them go down to bind Samson, and their question takes Philistine rule as a fact to live with, as it was already in [[Judg. 14:4]], where “the Philistines had dominion over Israel.” One older reading is severe: instead of recognizing in Samson “a deliverer whom the Lord had raised up for them,” they reproached him.

      Samson accepts: he asks only that they not kill him themselves, and they promise to bind him and deliver him, alive, to the Philistines (verses 12–13).
    sources: [lds-scriptures, keil-judges]

  - ref: 11
    phrase: As they did unto me, so have I done unto them.
    kind: history
    title: Answering wrong with wrong
    body: |
      Samson’s defense to Judah is the rule the whole chapter runs on: he gives no reason but what the Philistines did to him, and the Philistines say the same of him (verse 10). The burning of his wife, and the “great slaughter” (verse 8) with which he answered it, show “the sad truth that violence begets violence.”

      Read beside the opening chapter, where Judah cut off the thumbs and great toes of Adoni-bezek as he had done to others ([[Judg. 1:6–7]]), the verse shows Samson, too, acting by the customs of the land: he “responds in his actions as he had seen them practiced by others in the region.” The narrator gives no verdict on the motive. It credits the strength to the Spirit of the LORD (verse 14), and leaves the reasons as Samson gave them.
    sources: [lds-scriptures, ot-minute-judg-15, schade-broken-laws]

  - ref: 14
    phrase: the cords that were upon his arms became as flax that was burnt with fire, and his bands loosed from off his hands
    kind: scripture
    title: 'Bands loosed: Samson and Nephi'
    body: |
      The Book of Mormon quotes this verse, nearly word for word. When Laman and Lemuel bound Nephi in the wilderness, he prayed, “give me strength that I may burst these bands with which I am bound,” and “the bands were loosed from off my hands and feet” ([[1 Ne. 7:17–18]]). The quotation is one reason to think the plates of brass held Judges, likely part of the “record of the Jews” Nephi describes. Alma and Amulek, too, prayed for strength and broke the cords that bound them ([[Alma 14:26]]).

      The ropes were not flimsy. New cords were likely made of flax and were strong, yet they gave way like flax that has been through the fire. In Nephi’s and Alma’s accounts the bands are loosed after a prayer of faith; in Samson’s the Spirit comes upon him first, and his prayer comes afterward, at the spring (verse 18). What the Spirit of the LORD on Samson means is explained at [[Judg. 14:6]].
    sources: [sc-knowhy-410, sc-knowhy-551, lds-scriptures]

  - ref: 16
    phrase: heaps upon heaps
    kind: words
    title: A donkey, two donkeys
    body: |
      Samson’s victory song plays on two words spelled alike. The Hebrew *ḥămôr* means “ass,” and a word spelled the same means “heap,” and the line sets the two side by side: with the ass’s jawbone, a heap, two heaps, that is, so many slain. The English “heaps upon heaps” keeps the sense but not the sound.

      Whether the “thousand” is literal or a figure for a large company makes little difference: one outnumbered man defeated the force sent to take him. The song is about what Samson did, “have I slain”; two verses later he is telling the LORD that the deliverance was His gift (verse 18).
    sources: [bdb, oshb-wlc, chadwick-beit-lei]

  - ref: 19
    phrase: wherefore he called the name thereof En-hakkore
    kind: history
    title: The spring of him who called
    body: |
      The spring is named for Samson’s prayer. He “called” (*qārāʾ*) on the LORD (verse 18), and he named the spring *ʿên haqqôrēʾ*, the spring of “he who cries out,” so the place itself keeps the memory that he called and was answered. It is the first time in his story that Samson speaks to the LORD, and the only other is his last prayer in the temple of Dagon ([[Judg. 16:28]]). Here he calls himself “thy servant” and the victory “this great deliverance,” given by the LORD; one older reading takes the prayer to show that Samson knew he was fighting the LORD’s cause.

      The “hollow place that was in the jaw” is a hollow at Lehi the place, not in the bone. An old reading took it as a tooth socket in the jawbone, but the text says the hollow is “at Lehi,” and the spring was still known when the book was written (“unto this day”).
    sources: [ot-minute-judg-15, chadwick-beit-lei, keil-judges, lds-scriptures]

christ: |
  The LORD who gave Samson “this great deliverance” and opened the spring when he called is Jehovah, the premortal Christ (see [[Ex. 3:14]]), and the pattern of the book, set out in Judges 3, of a people who cry to the LORD and are given a deliverer, “teaches about the Savior’s power to deliver us from sin.” The Book of Mormon took up the words of verse 14 for men who prayed in faith: Nephi’s bands were loosed, and Alma and Amulek asked for “strength according to our faith which is in Christ, even unto deliverance” and broke their cords ([[Alma 14:26]]). That strength is given to disciples now according to their faith in Christ, and the deliverance it brings, whether from bonds or from sin, is His.

explore: |
  - [[Judg. 14]]: the wedding, the riddle and the threat of fire that start this quarrel.
  - [[1 Ne. 7:16–19]] and [[Alma 14:23–29]]: bands loosed in answer to prayer.
  - [[Judg. 16:28–30]]: Samson’s other prayer, and its end.
  - [“Khirbet Beit Lei and the Lehi of Samson”](https://rsc.byu.edu/vol-23-no-3-2022/khirbet-beit-lei-lehi-samson), on where Lehi and En-hakkore were and why Beit Lei is neither.

