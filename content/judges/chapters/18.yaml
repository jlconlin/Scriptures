chapter: 18
title: From Laish to Dan
tagline: Danite spies consult Micah’s hired priest and find a quiet town in the far north; six hundred men take Micah’s images and his Levite, destroy Laish, and set up the image at Dan, with a descendant of Moses as its priest.
when: 'When there was no king in Israel (verse 1), from the hill country of Ephraim to the sources of the Jordan'

setting: |
  Chapter 18 finishes the first of the book’s two closing narratives (chapters 17–21; see the setting of [[Judg. 17]]). It picks up Micah’s shrine and his hired Levite ([[Judg. 17]]) and carries them north with the tribe of Dan.

  Dan’s trouble was land. The tribe could not hold the district its lot gave it against the Amorites and the Philistines (see [[Judg. 1:34]] and the note on verse 1). Part of the tribe went looking for another home and found it at the headwaters of the Jordan. Joshua tells the same move in a single verse; the note at [[Josh. 19:47]] sets the two accounts together and identifies Leshem with Laish.

  The town they took and renamed became Israel’s northern limit, the “Dan” of “from Dan even to Beer-sheba” (the guide [The Land](/old-testament/guides/the-land/#regions)), and later the place where Jeroboam set up one of his golden calves. The chapter ends with two notes of time, “until the day of the captivity of the land” and “all the time that the house of God was in Shiloh” (verses 30–31). The first has been read as the captivity of the ten tribes, one sign that the book “was compiled long after the events it records”; the note on verse 30 gives that reading and another.

thread: |
  The chapter tells how an image made in one man’s house became the image of a tribe. Every stage of Micah’s shrine is moved one step outward. The Levite he hired gives the Danite spies an oracle (verses 5–6); the spies come back with the news that “God hath given it into your hands” (verse 10); the six hundred take “the graven image, and the ephod, and the teraphim, and the molten image” and the priest with them (verses 17–20); and at Dan “they set them up Micah’s graven image” (verse 31). One older reading takes the purpose of the whole story to be to “trace the origin of the famous sanctuary at Dan.”

  Two people are left behind in the telling. Micah runs after his gods and is told to keep quiet or lose his life (verses 22–26); he called his images “my gods which I made,” though probably “without perhaps meaning to imply that there was any God but Jehovah.” His confidence at [[Judg. 17:13]] ends in “what have I more?” (verse 24). The people of Laish, quiet and secure, are put to the sword with “no deliverer” (verses 27–28).

  The chapter opens with the refrain “there was no king in Israel” (verse 1; explained at [[Judg. 17:6]]), and closes by setting Dan’s image beside “the house of God” at Shiloh (verse 31). Nothing in the chapter says the LORD sent the Danites, and nothing says He answered their priest.

sections:
  - range: 1-6
    heading: The spies at Micah’s house
    plain: |
      In those days Israel had no king. The tribe of Dan was looking for land of its own to live in, because until then it had not come into its full inheritance among the tribes of Israel. So the Danites sent five capable men from their clans, from Zorah and Eshtaol, to spy out the land and explore it. “Go and explore the land,” they told them. The men came to the hill country of Ephraim, to Micah’s house, and spent the night there. Near the house they recognized the voice of the young Levite, so they went over and asked him, “Who brought you here? What are you doing in this place? What is your business here?” He told them how Micah had dealt with him: “He has hired me, and I am his priest.” Then they said, “Please ask God whether the journey we are on will succeed.” The priest answered, “Go in peace. The LORD is watching over the journey you are on.”
  - range: 7-10
    heading: Laish, quiet and secure
    plain: |
      The five men went on and came to Laish. They saw that the people there lived in security, in the manner of the Sidonians, quiet and unsuspecting. There was no ruler in the land to put them to shame in anything. They were far from the Sidonians and had no dealings with anyone else. When the men returned to their kinsmen at Zorah and Eshtaol, they were asked, “What did you find?” They answered, “Come on, let us attack them! We have seen the land, and it is very good. Are you going to sit still? Don’t hesitate to go in and take the land. When you get there you will find an unsuspecting people and a spacious land, which God has given into your hands, a place that lacks nothing on earth.”
  - range: 11-20
    heading: Micah’s gods and his priest taken
    plain: |
      So six hundred men of the clans of Dan set out from Zorah and Eshtaol, armed for war. They went up and camped at Kirjath-jearim in Judah; that is why the place west of Kirjath-jearim is called Mahaneh-dan, “the camp of Dan,” to this day. From there they passed on into the hill country of Ephraim and came to Micah’s house. The five men who had spied out Laish said to their kinsmen, “Do you know that in these houses there are an ephod, teraphim, a carved image and a cast image? Now think about what you should do.” So they turned aside to the young Levite’s home at Micah’s house and greeted him. The six hundred armed Danites stood at the entrance of the gate. The five spies went in and took the carved image, the ephod, the teraphim and the cast image, while the priest stood at the gate with the six hundred armed men. When the men went into Micah’s house and took the images, the ephod and the teraphim, the priest said, “What are you doing?” They told him, “Be quiet! Put your hand over your mouth and come with us, and be a father and a priest to us. Is it better for you to be priest to one man’s household, or priest to a tribe and a clan in Israel?” The priest was delighted. He took the ephod, the teraphim and the carved image and went along in the middle of the people.
  - range: 21-26
    heading: Micah left with nothing
    plain: |
      They turned and set off, putting their little children, their livestock and their goods in front of them. When they had gone some distance from Micah’s house, the men who lived in the houses near Micah’s were called out, and they caught up with the Danites. They shouted after them, and the Danites turned around and said to Micah, “What is the matter with you, that you have come out with such a crowd?” He answered, “You have taken the gods I made, and my priest, and gone off. What do I have left? How can you ask me, ‘What is the matter with you?’” The Danites answered, “Don’t let us hear another word from you, or some angry men will fall on you, and you will lose your life and the lives of your household.” So the Danites went on their way, and Micah, seeing that they were too strong for him, turned around and went home.
  - range: 27-31
    heading: The city named Dan
    plain: |
      So, taking what Micah had made and the priest he had, they came to Laish, to a people quiet and unsuspecting. They put them to the sword and burned the city. There was no one to rescue them, because it was far from Sidon and they had no dealings with anyone. It lay in the valley near Beth-rehob. The Danites rebuilt the city and lived there, and they named it Dan after their ancestor Dan, who was born to Israel, though the city had first been called Laish. There the Danites set up the carved image for themselves, and Jonathan son of Gershom, son of Manasseh (a name altered from Moses; see the note on verse 30), and his sons were priests to the tribe of Dan until the time the land went into captivity. They kept Micah’s carved image, which he had made, set up for themselves the whole time the house of God was at Shiloh.

notes:
  - ref: 1
    phrase: for unto that day all their inheritance had not fallen unto them among the tribes of Israel
    kind: history
    title: A tribe that could not hold its lot
    body: |
      Dan had been given land by lot, but it could not keep it, and that is why the tribe was still looking for “an inheritance to dwell in.” Joshua lists Dan’s towns, among them the Zorah and Eshtaol from which the spies set out ([[Josh. 19:40–46]]). Judges has already said that “the Amorites forced the children of Dan into the mountain” ([[Judg. 1:34]]), and the next judge, Samson, is a Danite of Zorah living under the Philistines ([[Judg. 13:2]]). The district “was small in area but had an admirable situation,” some of it “extremely fertile,” but the tribe found it hard to hold against both peoples.

      So verse 1 does not mean that Dan had received nothing. It means the lot had not become a home the tribe could hold. The note at [[Josh. 19:47]] explains the King James “too little” and sets Joshua’s one sentence about the move beside this chapter. Verse 1 also opens with the refrain “there was no king in Israel,” which is explained at [[Judg. 17:6]].
    sources: [bd-dan, lds-scriptures]

  - ref: 6
    phrase: 'Go in peace: before the LORD is your way wherein ye go'
    kind: history
    title: An oracle from a hired priest
    body: |
      The priest’s answer sounds like the LORD’s approval, but the text never says that the LORD gave it. The spies ask him to “ask counsel … of God” (verse 5), the expression Israel used when it asked the LORD who should go up first ([[Judg. 1:1]]). Here, though, the inquiry would have been made “through the medium of the imitation of the ephod and the worship of an image”: the ephod and teraphim of Micah’s shrine ([[Judg. 17:5]]). “Before the LORD is your way” means that the journey is “known and well-pleasing to Him,” and the Danites take it so. They come home saying “God hath given it into your hands” (verse 10).

      Whether the priest received any answer at all is another matter. One older reading puts it plainly: “Whether … he had any answer from the teraphim, or feigned it out of his own head, is uncertain.” The narrator does not settle it. He has already shown who this priest is, a Levite hired for ten shekels a year to serve at a graven image ([[Judg. 17:10]]), and in this chapter he takes the better post when it is offered (verses 19–20). The way did prosper. The Danites took the city. The chapter does not count that as the LORD’s answer, and it ends with the image they carried set up at Dan.
    sources: [keil-judges, pulpit-judges, lds-scriptures]

  - ref: 27
    phrase: unto a people that were at quiet and secure
    kind: history
    title: A quiet people, and no deliverer
    body: |
      The narrator stresses that Laish could not defend itself before he tells how it was destroyed. It lived “after the manner of the Zidonians” (verse 7), which one older reading explains as a people who lived by trade and commerce and “did not go out to war.” It was far from Sidon, “so that in the event of a hostile invasion they could not obtain any assistance from this powerful city,” and it may have been a Sidonian colony. That is why verse 28 can say “there was no deliverer.”

      Three times the people are called quiet or secure (verses 7, 10, 27). One older reading takes the repetition as the writer’s judgment: it “rather seems to indicate the writer’s reprobation of the deed as cruel, like that of Simeon and Levi” when they slew the men of Shechem. The story of Shechem is told at [[Gen. 34:25–30]]. That is a reading of the narrator’s emphasis, not a verdict he states, and no word of the LORD sends the Danites to Laish (see the note on verse 6). How the Church reads the wars of conquest as a whole is explained at [[Josh. 6:21]].
    sources: [keil-judges, pulpit-judges, lds-scriptures]

  - ref: 29
    phrase: they called the name of the city Dan, after the name of Dan their father
    kind: history
    title: Dan, the northern edge of Israel
    body: |
      The Danites gave the rebuilt town the name of their ancestor, Jacob’s son by Bilhah, and the name stuck. The town in the far north became “the northern limit of Palestine,” so that Israel’s whole extent came to be called “from Dan even to Beer-sheba” ([[Judg. 20:1]]; the guide [The Land](/old-testament/guides/the-land/#regions)). Laish is the Leshem of [[Josh. 19:47]]. Genesis already calls the place by its later name when Abraham pursues the kings “unto Dan” ([[Gen. 14:14]]; the note at [[Gen. 14:3]] explains such old names).

      The shrine founded here had a long sequel. When the kingdom divided, Dan “was chosen by Jeroboam as one of the places in which to establish the calf worship for the northern tribes,” as told at [[1 Kgs. 12:29]] and [[2 Kgs. 10:29]]. What the chapter says about how long its own image and priesthood lasted is the subject of the next note.
    sources: [bd-dan, lds-scriptures]

  - ref: 30
    phrase: Jonathan, the son of Gershom, the son of Manasseh
    kind: words
    title: Moses’ descendant, written as Manasseh
    body: |
      The priest of Dan’s image was a descendant of Moses, and the Hebrew text records the shame of it in a single letter. Gershom was Moses’ son ([[Ex. 2:22]]), and the Hebrew had “Moses, altered to Manasseh.” The alteration was made by writing the letter *n* above the line, a “suspended” letter, so that *Mosheh* reads *Manasseh*. Jewish tradition admitted that “the text was altered in order to repudiate the Levite’s claim”: in the Talmud’s words, “because he did the deeds of Manasseh” (the idolatrous king of [[2 Kgs. 21]]) “the Scripture assigns him to the family of Manasseh.” The Latin Vulgate kept “Moses.”

      This Jonathan “can hardly be any other than this Levite,” the young man hired by Micah. The chapter has called him only “the Levite” and “the priest,” and his name comes at the end. Because he is called a young man (17:7; 18:3, 15), “son of Gershom” probably means a descendant rather than a son, since Hebrew genealogies often pass over generations. Either way, the hired priest of a graven image was of the house of the lawgiver who had brought down “Thou shalt not make unto thee any graven image” ([[Ex. 20:4]]).
    sources: [lds-scriptures, cambridge-judges, keil-judges]

  - ref: 30
    phrase: until the day of the captivity of the land
    kind: history
    title: Until the captivity, while Shiloh stood
    body: |
      Two readings of “the captivity of the land” are given, and the text does not settle between them. On the first, it is “the captivity of the ten tribes,” and the verse is evidence that the book “was compiled long after the events it records.” On that reading the line looks back from the Assyrian conquest of the north, either the deportations under Tiglath-pileser ([[2 Kgs. 15:29]]) or the fall of Samaria.

      One older reading answers from the next verse. Verse 31 says the image stood “all the time that the house of God was in Shiloh,” and the tabernacle did not stay at Shiloh until the Assyrians came. So it takes “the captivity” to be the carrying away of the ark by the Philistines, and the wording of the ark story fits that reading: “The glory is departed from Israel” ([[1 Sam. 4:21–22]]) uses the verb of “the captivity” here, which means to go into exile, so the glory went into captivity when the ark was taken. With the ark gone, the tabernacle at Shiloh lost its meaning: the psalm to which the Church’s footnote at 18:31 points tells it as a captivity, how the LORD “forsook the tabernacle of Shiloh” and “delivered his strength into captivity” ([[Ps. 78:60–61]]). Shiloh as the place of the tabernacle is explained at [[Josh. 18:1]].

      Both readings agree on what verse 31 shows. While the house of God stood at Shiloh, part of Israel worshipped at an image of its own making in Dan.
    sources: [bd-judges, cambridge-judges, keil-judges, bdb, lds-scriptures]

christ: |
  The Danites’ priest answers in the name of the LORD, Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). Yet he was a Levite, whose work was to assist the priests, and he took a priest’s office from Micah for wages and left it for a tribe because the post was better (verses 19–20; see the note at [[Judg. 17:10]]). Scripture states the rule he broke, with Aaron as its example and Christ as its fulfilment: “no man taketh this honour unto himself, but he that is called of God, as was Aaron. So also Christ glorified not himself to be made an high priest” ([[Heb. 5:4–5]]).

  The same rule governs the Lord’s Church now: “a man must be called of God, by prophecy, and by the laying on of hands by those who are in authority” ([[A of F 1:5]]). Authority to act in Christ’s name comes from His call. Wages, a willing congregation or a chosen form of worship do not confer it.

explore: |
  - [[Judg. 17]]: how Micah’s shrine and his Levite came to be.
  - [[Josh. 19:40–48]]: Dan’s lot, and the move to Leshem in one verse.
  - [[1 Kgs. 12:26–31]]: Jeroboam’s golden calf at Dan, with priests not of Levi.
  - [[Ps. 78:56–64]]: graven images, and the LORD forsaking the tabernacle of Shiloh.

