chapter: 7
title: The Sword of the LORD, and of Gideon
tagline: The LORD cuts Gideon’s army from thousands to three hundred, lets him overhear an enemy’s dream, and routs Midian in the night with trumpets, broken jars and torches, so that no one can say Israel saved itself.
when: 'When Midian oppressed Israel, the night Gideon went down to their camp (6:1; 7:9)'

setting: |
  Chapter 6 left Gideon called, clothed with the Spirit, and reassured by the fleece, with Manasseh, Asher, Zebulun and Naphtali gathered to him ([[Judg. 6:34–40]]). Chapter 7 is the middle of his story: the gathering of the army (verses 1–8) and the night attack on Midian (verses 15–23), with the scouting of the enemy camp between them. Chapter 8 follows the pursuit across the Jordan.

  The armies face each other in or near the plain of Jezreel, where Midian and its allies had crossed the Jordan and camped ([[Judg. 6:33]]). Gideon pitches by the well of Harod; Midian lies below him in the valley by the hill of Moreh (verses 1, 8). His men came from the tribes west of the Jordan, and they were badly outnumbered before the LORD sent any of them home: thirty-two thousand against an army that [[Judg. 8:10]] puts at about a hundred and thirty-five thousand.

  This is the victory later scripture remembers. Isaiah promises a deliverance “as in the day of Midian” ([[Isa. 9:4]]) and recalls “the slaughter of Midian at the rock of Oreb” ([[Isa. 10:26]]); Psalm 83 asks God to deal with Israel’s enemies as He dealt with Oreb and Zeeb ([[Ps. 83:9–11]]).

thread: |
  The chapter is about who gets the credit. Before the battle the LORD says the army is too large, “lest Israel vaunt themselves against me, saying, Mine own hand hath saved me” (verse 2), and then He takes the army apart: the fearful go home, twenty-two thousand of them, and a test at the water leaves three hundred (verses 3–8). The victory, once it came, could only be put down to divine power.

  The same chapter that strips Gideon of soldiers gives him reassurance. The LORD has strengthened his faith with the fleece; now He asks Gideon to show that faith by letting the army go, and He meets the fear that remains. “If thou fear to go down,” He says, take your servant and listen (verses 10–11). In the Midianite camp Gideon hears an enemy’s dream and its meaning, and he worships before he does anything else (verses 13–15).

  The battle itself is hardly a battle. Three hundred men surround the camp in the dark, blow their horns, smash their jars, raise their torches and shout, and they “stood every man in his place” (verse 21). It is the LORD who sets the Midianites’ swords against one another (verse 22). Only then do the tribes and Ephraim join the pursuit, take the fords of the Jordan, and kill Midian’s two princes (verses 23–25). The shout of the three hundred was “The sword of the LORD, and of Gideon.”

sections:
  - range: 1-8
    heading: Three hundred men
    plain: |
      Jerubbaal, that is, Gideon, rose early with all his men and camped by the well of Harod. The camp of Midian lay to the north of them, by the hill of Moreh, in the valley. The Lord said to Gideon, “You have too many men for Me to hand Midian over to them. Israel would boast against Me and say, ‘My own strength saved me.’ So announce to the men: Whoever is fearful and trembling, let him turn back and leave Mount Gilead.” Twenty-two thousand of them went home, and ten thousand remained.

      The Lord said to Gideon, “There are still too many. Take them down to the water, and I will test them for you there. If I tell you, ‘This one shall go with you,’ he shall go; and if I tell you, ‘This one shall not go with you,’ he shall not go.” So Gideon took the men down to the water, and the Lord said to him, “Put by themselves everyone who laps the water with his tongue as a dog laps, and likewise everyone who kneels down to drink.” Three hundred men lapped, bringing the water to their mouths with their hands; all the rest knelt down to drink. The Lord said to Gideon, “With the three hundred men who lapped I will save you and give Midian into your hand. Let all the others go home.” So the three hundred took the people’s provisions and their horns, Gideon sent the rest of Israel to their tents, and the camp of Midian lay below him in the valley.
  - range: 9-15
    heading: A dream in the enemy’s camp
    plain: |
      That same night the Lord said to him, “Get up and go down against the camp, for I have given it into your hand. But if you are afraid to go down, go down to the camp with Phurah your servant. You will hear what they are saying, and after that you will have the courage to go down against the camp.” So he went down with Phurah his servant to the edge of the armed men in the camp. Midian, Amalek and all the peoples of the east lay in the valley as thick as locusts, and their camels could no more be counted than the sand on the seashore.

      When Gideon arrived, a man was telling his companion a dream. “I had a dream,” he said. “A round loaf of barley bread came tumbling into the camp of Midian. It came to a tent and struck it so that it fell; it turned it upside down, and the tent lay flat.” His companion answered, “This can be nothing else but the sword of Gideon son of Joash, the Israelite. God has given Midian and the whole camp into his hand.” When Gideon heard the dream told and its meaning, he worshipped. He went back to the camp of Israel and said, “Get up, for the Lord has given the camp of Midian into your hand.”
  - range: 16-22
    heading: Horns, jars and torches
    plain: |
      He divided the three hundred men into three companies and put a horn and an empty jar in every man’s hand, with a torch inside each jar. “Watch me,” he told them, “and do what I do. When I come to the edge of the camp, do exactly as I do. When I and all who are with me blow the horn, then you blow your horns too, all around the camp, and shout, ‘For the Lord and for Gideon!’”

      Gideon and the hundred men with him came to the edge of the camp at the beginning of the middle watch, just after the guards had been changed. They blew the horns and smashed the jars in their hands. All three companies blew their horns and smashed their jars; they held the torches in their left hands and the horns in their right, to blow them, and they shouted, “A sword for the Lord and for Gideon!” Every man stood in his place around the camp, and the whole camp ran, crying out, and fled. While the three hundred blew their horns, the Lord turned every man’s sword against his companion throughout the camp. The army fled as far as Beth-shittah toward Zererath, to the edge of Abel-meholah by Tabbath.
  - range: 23-25
    heading: The fords of the Jordan
    plain: |
      The men of Israel were called out from Naphtali, Asher and all Manasseh, and they chased Midian. Gideon sent messengers through all the hill country of Ephraim: “Come down against Midian and hold the waters ahead of them as far as Beth-barah, and the Jordan.” So all the men of Ephraim were called out, and they held the waters as far as Beth-barah, and the Jordan. They captured the two princes of Midian, Oreb and Zeeb. They killed Oreb at the rock of Oreb and Zeeb at the winepress of Zeeb, and they kept pursuing Midian. They brought the heads of Oreb and Zeeb to Gideon across the Jordan.

notes:
  - ref: 2
    phrase: lest Israel vaunt themselves against me
    kind: scripture
    title: Too many for the LORD to save
    body: |
      The LORD gives His own reason for cutting the army, and it is not strategy: with a large army, Israel would boast of the victory as its own. The verb behind “vaunt themselves” means to glorify oneself, and with “against” a person it means to boast over him (the same verb is explained at [[Ex. 8:9]]). Israel would have said, in so many words, “Mine own hand hath saved me,” and taken the glory that belonged to the God who delivered them.

      Israel was already badly outnumbered by a host “like grasshoppers for multitude” (verse 12). So the problem the LORD names is not that Gideon had enough men to win. It is that he had enough men to think he had won. The reduction to three hundred meant that the victory could be put down only to divine power, not to any human capability, and that the “help of the Lord” would be plain to all Israel.

      Later scripture keeps the lesson. Before he attacks a Philistine garrison with only his armor-bearer, Jonathan says, “there is no restraint to the LORD to save by many or by few” ([[1 Sam. 14:6]]). Isaiah remembers the victory as “the day of Midian” ([[Isa. 9:4]]), where the site’s note reads the phrase as shorthand for a deliverance that is God’s doing.
    sources: [bdb, ot-minute-judg-7, ot-manual-judges-1-12, lds-scriptures]

  - ref: 3
    phrase: depart early from mount Gilead
    kind: history
    title: Mount Gilead, or Gilboa?
    body: |
      Gideon’s proclamation follows the law of war, which sent home anyone “fearful and fainthearted” so that he would not weaken his brothers ([[Deut. 20:8]], where the site’s note takes up this verse). Its result was one Gideon could hardly have expected: more than two-thirds of his army, twenty-two thousand men, went home.

      The puzzle is the name. Gilead was the hill country east of the Jordan, but Gideon’s army was camped near the plain of Jezreel, west of the river, and had been gathered from the western tribes. An alternative reading is “Mount Gilboa.” One older reading sets out the two ways the difficulty has been handled: either “Gilead” is a copyist’s slip for “Gilboa,” or there was also a mountain called Gilead near Jezreel, as there was a Mount Seir in the territory of Judah ([[Josh. 15:10]]).
    sources: [keil-judges, lds-scriptures]

  - ref: 4
    phrase: I will try them for thee there
    kind: words
    title: The test at the water
    body: |
      “Try” here is a smelter’s word. The Hebrew verb means to smelt, refine or test metal, and here it is the LORD who tests the warriors for Gideon. The LORD would separate the men appointed for the battle from the rest, and He would do the choosing: “of whom I say unto thee, This shall go with thee.”

      What the test measured, the text does not say, and the sources differ. Three hundred brought the water to their mouths with their hands and lapped it; all the rest knelt down to drink (verses 5–6). One reading suggests the difference was alertness: those who stayed on their feet and drank from the hand were ready, while those who knelt at the water were not, though the purpose of the exercise “is not clear.” One older reading takes the three hundred as the bravest, men who would not stop to drink at their ease before a battle, and rejects the ancient view that they were the cowards of the army. It adds what the story itself makes plain: no general would have thought to shrink an army already so small, or attack a host of more than a hundred thousand with a few hundred men, “if the Lord himself had not commanded it.” Whatever the three hundred showed at the water, the reason they were few is given in verse 2.
    sources: [bdb, ot-minute-judg-7, keil-judges]

  - ref: 13
    phrase: a cake of barley bread tumbled into the host of Midian
    kind: symbol
    title: The barley loaf and the tent
    body: |
      The dream sets Israel’s poverty against Midian’s strength, and turns them over. The loaf stands for the Israelites, a people of farmers, and the tents for the seminomadic Midianites. One older reading fills out the picture: in a land of wheat only the poor ate barley bread, and Midian had crushed Israel into poverty, while to a nomad the tent was his whole way of life, his freedom and his power. In the dream the humble loaf rolls down into the camp and lays the tent flat (the footnote reads “the tent lay along” as “the tent lay flat”).

      What makes the dream remarkable is who has it. It is plainly meant to be prophetic, and it comes not to Gideon or one of his men but to an enemy soldier, as Pharaoh received prophetic dreams in [[Gen. 41]]. His companion reads it at once as “the sword of Gideon.” One older reading adds that the timing is the miracle: God not only foreknew the dream but caused the man to dream it and tell it just as Gideon reached the edge of the camp, so that Gideon would hear it as the LORD had promised.
    sources: [keil-judges, ot-minute-judg-7, lds-scriptures]

  - ref: 19
    phrase: in the beginning of the middle watch
    kind: history
    title: The middle watch
    body: |
      Israel divided the night into three watches, so the middle watch began about ten at night and ran to about two in the morning; in New Testament times the Romans divided it into four. Gideon struck at the beginning of it, “and they had but newly set the watch.” One older reading draws out the timing: the first sentries had just been relieved, and the camp thought itself safe for the rest of the night.
    sources: [ot-manual-judges-1-12, keil-judges]

  - ref: 20
    phrase: The sword of the LORD, and of Gideon
    kind: history
    title: Horns, jars, torches and a shout
    body: |
      With their hands full of horns and torches, the three hundred had no hand free to fight, and their cry most likely voiced their trust in the Lord and in the leader He had chosen to deliver them.

      The plan worked by sound and light, confusing the enemy and throwing the camp into panic. Ordinarily only a comparatively small number of men in an army carried trumpets, and here three hundred horns blared and three hundred jars broke at once, and the sleeping Midianites woke to torches blazing all around them. And the three hundred did not charge. They “stood every man in his place round about the camp” (verse 21).

      The killing was done in the enemy’s own camp. “The LORD set every man’s sword against his fellow” (verse 22), and the Midianites, apparently mistaking their comrades for Israelite attackers, turned on one another. The same thing happened in the rout of the Philistines before Saul and Jonathan ([[1 Sam. 14:20]]) and of Judah’s enemies before Jehoshaphat ([[2 Chr. 20:23]]). In the rout itself Gideon’s men struck no blow; the swords that fell in the camp were Midian’s own.
    sources: [scripture-helps-judges, schutze-gideon, ot-minute-judg-7, haws-better-way, lds-scriptures]

  - ref: 25
    phrase: they slew Oreb upon the rock Oreb, and Zeeb they slew at the winepress of Zeeb
    kind: scripture
    title: Raven and Wolf, remembered
    body: |
      Midian’s two princes carry animal names: Oreb is “raven” and Zeeb is “wolf.” Ephraim killed them at places that bear their names, the rock of Oreb and the winepress of Zeeb, and the men brought the heads to Gideon as proof of the victory, a practice well attested among Israel’s neighbors. Ephraim’s complaint that it was called late follows at [[Judg. 8:1–3]].

      Later scripture remembers the two princes and the rock. The psalmist prays, “Make their nobles like Oreb, and like Zeeb” ([[Ps. 83:11]]; the site’s note at [[Ps. 83:9]] sets out the two victories from Judges). Isaiah tells Israel not to be afraid of Assyria, because “the LORD of hosts shall stir up a scourge for him according to the slaughter of Midian at the rock of Oreb” ([[Isa. 10:26]]).
    sources: [bdb, sc-knowhy-125, lds-scriptures]

christ: |
  The LORD who cut Gideon’s army to three hundred is Jehovah, the premortal Jesus Christ (see [[Ex. 3:14]]), and He would not share the glory of the deliverance: Israel was not to say, “Mine own hand hath saved me.” He saves “by many or by few” ([[1 Sam. 14:6]]), and the chapter shows Him doing it in a way no one could mistake for human strength, while He met Gideon’s fear with an enemy’s dream that strengthened his hands (verses 10–15). The Lord can use small things to do great work, and He can work miracles when His people trust in His ways. He still tries those who follow Him, giving the faithful “line upon line” and proving them ([[D&C 98:12]]), and the deliverance He gives them is His, so that the credit and the gratitude go to Him.

explore: |
  - **Saved by few.** Jonathan and his armor-bearer at the Philistine garrison ([[1 Sam. 14:6–23]]), and Jehoshaphat’s army, told that “the battle is not yours, but God’s” ([[2 Chr. 20:15–23]]).
  - **The day of Midian in the prophets.** [[Isa. 9:4]], [[Isa. 10:24–27]] and [[Ps. 83:9–12]].
  - **Dreams given to outsiders.** Pharaoh ([[Gen. 41:1–32]]) and Nebuchadnezzar ([[Dan. 2:1–45]]).
  - **The story goes on.** [[Judg. 8]] follows Gideon across the Jordan, to the offer of a crown and the ephod.

