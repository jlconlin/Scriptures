chapter: 19
title: The Night at Gibeah
tagline: A Levite brings his concubine back from Bethlehem, passes by Jebus for an Israelite town, and finds no welcome in Gibeah but an old man’s; the men of the city surround the house, the woman is put out to them and dies, and the Levite sends her body through all Israel.
when: 'When there was no king in Israel (verse 1), on the road from Bethlehem to the hill country of Ephraim'

setting: |
  Chapter 19 begins the second of the two narratives that close Judges (chapters 17–21; the first is the story of Micah and Dan, and the division is explained at [[Judg. 17]]). Like the first it has no judge and no foreign enemy, and it is not dated. One older reading places it soon after Joshua’s death, because Phinehas, Aaron’s grandson, is still high priest when the war it causes is fought ([[Judg. 20:28]]).

  The story moves along the spine of the land. A Levite living in the far hill country of Ephraim goes south to Bethlehem in Judah to bring back his concubine (the text also calls him “her husband,” verse 3). Coming home, he passes Jebus, the city later called Jerusalem, still a Jebusite fortress (see the note at verse 12), and stops in Gibeah of Benjamin. What happens there brings the tribes to war against Benjamin in chapter 20 and leads to the taking of wives for its survivors in chapter 21. Hosea still measured Israel’s sin by “the days of Gibeah” ([[Hos. 9:9]], where the site’s note tells the story briefly).

  The chapter describes a rape and a killing. The notes say what the text says plainly and do not dwell on it; the guide’s section [The hard passages](/old-testament/guides/women-and-marriage/#hard-passages) sets this chapter among the others like it.

thread: |
  The chapter is a story about hospitality, told stop by stop until it fails completely. At Bethlehem there is too much of it: the father-in-law holds his guest for five days, and the story lingers over the meals because of what is coming (verses 4–9). On the road the Levite will not lodge in Jebus, “the city of a stranger” (verse 12), and goes on to Gibeah, a town of Israel. There no one takes him in (verse 15). The one man who does is an old man from Ephraim, himself an outsider in a Benjaminite town (verses 16–21).

  Then the men of the town break the rule the old man has just kept. They surround the house and demand the guest (verse 22), in words taken from the story of Sodom. The host pleads for his guest and offers the women instead; the guest’s own concubine is put out of the door (verses 23–25). In the morning he finds her at the threshold and tells her to get up (verses 26–28).

  The last two verses turn the private crime into a national one. The Levite sends her body in twelve pieces through all Israel, and Israel answers that nothing like it had happened since the Exodus (verses 29–30). The act meant to summon Israel is itself a sign of how far its society had come apart, and chapter 20 is what follows.

sections:
  - range: 1-9
    heading: Five days at Bethlehem
    plain: |
      In those days, when Israel had no king, a Levite was living as a sojourner in the far parts of the hill country of Ephraim. He took as his concubine a woman from Bethlehem in Judah. She was unfaithful to him and left him, going back to her father’s house in Bethlehem, and she stayed there four months. Then her husband set out after her to speak to her heart and bring her back, taking his servant and two donkeys. She brought him into her father’s house, and her father was glad to see him. The father-in-law kept him there three days, and they ate and drank and spent the nights. On the fourth day they got up early, and the Levite prepared to leave, but the woman’s father said, “Have something to eat first to strengthen you, and then go.” So the two of them sat down and ate and drank together, and the father said, “Please stay the night and enjoy yourself.” When the man got up to go, his father-in-law pressed him, and he stayed another night. On the fifth day he got up early to leave, and the father said again, “Strengthen yourself first.” They lingered until afternoon, eating together. When the man, his concubine and his servant got up to go, the father said, “Look, the day is nearly over and evening is coming. Stay the night and enjoy yourself, and tomorrow you can start early for home.”
  - range: 10-21
    heading: No room in Gibeah
    plain: |
      But the man would not stay another night. He set out and came opposite Jebus, which is Jerusalem, with his two saddled donkeys and his concubine. By the time they were near Jebus the day was almost gone, and the servant said to his master, “Let’s turn in at this Jebusite city and spend the night there.” His master answered, “We won’t stop in a foreign city that does not belong to the Israelites. We’ll go on to Gibeah. Come, let’s try to reach one of these places, Gibeah or Ramah, and spend the night there.” So they went on, and the sun set as they came near Gibeah, which belonged to Benjamin. They turned in to spend the night there, and he went and sat down in the town square, because no one took them into a house for the night. That evening an old man came in from his work in the fields. He was from the hill country of Ephraim and was living as an outsider in Gibeah, where the people were Benjaminites. When he looked up and saw the traveller in the square, he asked, “Where are you going, and where have you come from?” The Levite answered, “We are on our way from Bethlehem in Judah to the far side of the hill country of Ephraim, where I come from. I went to Bethlehem in Judah, and now I am going to the house of the LORD, and no one will take me in. We have straw and fodder for our donkeys, and bread and wine for me, for your servant woman, and for the young man with us. We need nothing.” The old man said, “Peace be with you. Let me take care of whatever you need; only don’t spend the night in the square.” So he brought him into his house and fed the donkeys, and they washed their feet and ate and drank.
  - range: 22-28
    heading: The men of the city
    plain: |
      While they were enjoying themselves, some worthless men of the town surrounded the house, pounded on the door, and said to the old man who owned it, “Bring out the man who came into your house, so that we can have sex with him.” The owner of the house went out to them and said, “No, my brothers, please don’t do such an evil thing. This man has come into my house as my guest; don’t commit this outrage. Here is my virgin daughter, and his concubine. I will bring them out now; abuse them and do with them whatever you please. But to this man don’t do such a shameful thing.” But the men would not listen to him. So the man took his concubine and put her outside to them, and they raped her and abused her all night until morning, and let her go as dawn was breaking. At daybreak the woman came and fell down at the door of the house where her master was, and lay there until it was light. In the morning her master got up, opened the doors of the house, and went out to go on his way, and there was his concubine, fallen at the door of the house with her hands on the threshold. He said to her, “Get up; let’s go.” But there was no answer. Then he put her on the donkey and set out for home.
  - range: 29-30
    heading: The twelve pieces
    plain: |
      When he reached his house, he took a knife, took hold of his concubine, cut her body limb by limb into twelve pieces, and sent them throughout all the territory of Israel. Everyone who saw it said, “Nothing like this has ever been done or seen from the day the Israelites came up out of Egypt until today. Think about it, take counsel, and say what must be done.”

notes:
  - ref: 1
    phrase: when there was no king in Israel, that there was a certain Levite sojourning
    kind: history
    title: Another Levite, and no king
    body: |
      The chapter opens with two things the reader has met in the story just told: the refrain “no king in Israel” and a wandering Levite. The refrain is explained at [[Judg. 17:6]], and the book closes on it in full at [[Judg. 21:25]]. Here it frames the whole last story: the cycle of chapters 19–21 “starts with a pro-monarchical statement” and ends with the same line, so that everything between is told as what happened in Israel without a king. What that does and does not say about kingship is taken up at [[Judg. 21:25]].

      The Levite is “sojourning,” which in one older reading means living outside the towns assigned to the Levites, in the far reaches of Ephraim’s hill country. He stands beside the Levite of chapter 17, who also went where he could find a place ([[Judg. 17:9]]; that Levite and what he was meant to be are explained at [[Judg. 17:7]]). The Levite of chapters 17–18 is named at last at [[Judg. 18:30]]; this one never is.
    sources: [goff-plagiary, keil-judges, lds-scriptures]

  - ref: 2
    phrase: his concubine played the whore against him
    kind: words
    title: Unfaithful, or angry?
    body: |
      The Hebrew of verse 2 says the concubine was unfaithful to her husband before she left him, and the ancient Greek translation does not. The Hebrew says she “played the harlot,” and one older reading takes it plainly: she “was unfaithful to her husband, and then went away.” The Septuagint, that ancient Greek translation, has only that she “departed from him,” and a modern translation has her become “angry with him.” The verse says no more about it.

      The chapter does not stop over it. Whatever she had done, her husband went after her “to speak friendly unto her” (verse 3), in the Hebrew to speak to her heart, to win her back, and the welcome he received at her father’s house shows that he did. The guide [The hard passages](/old-testament/guides/women-and-marriage/#hard-passages) sets the two readings side by side; nothing in the rest of the chapter turns on her guilt, and nothing that is done to her is made to depend on it.
    sources: [keil-judges, lxx-rahlfs, nrsvue]

  - ref: 4
    phrase: his father in law, the damsel’s father, retained him
    kind: history
    title: Five days at Bethlehem
    body: |
      The six verses about a father-in-law who will not let his guest leave are there because of what follows. To “retain” here is to lay hold of someone so that he cannot go. The father keeps them three days and then a fourth night, and each morning brings another meal and another “tarry all night.” By the afternoon of the fifth day the Levite insists on going, and the late start is why they are on the road at dusk, looking for a town to sleep in (verses 9–11).

      One older reading sees in this “pressing and rather boisterous hospitality” a “tragic significance in view of what follows”: the story dwells on the meals at Bethlehem because of the night that comes after them.
    sources: [cambridge-judges, goff-plagiary]

  - ref: 12
    phrase: the city of a stranger, that is not of the children of Israel
    kind: history
    title: Passing by Jebus
    body: |
      The Levite refuses to stop at Jebus because it was a foreign city, and in his day it was. Jebus is the old name of Jerusalem, a hill fortress that “maintained its independence until stormed by David”; in the time of the judges it was held by Jebusites, and it became Israel’s holy city and capital only under David. Judges has already said why: Benjamin “did not drive out the Jebusites that inhabited Jerusalem” ([[Judg. 1:21]]; the land not taken is explained at [[Josh. 13:1]]).

      So the Levite pushes on past the city to reach an Israelite town before dark, Gibeah or Ramah. Gibeah is “Gibeah, which belongeth to Benjamin” (verse 14), one of the towns of Benjamin’s inheritance ([[Josh. 18:28]]). There no one took him in (verse 15).
    sources: [bd-jebus, ot-manual-judges-13-21, goff-plagiary, lds-scriptures]

  - ref: 18
    phrase: I am now going to the house of the LORD
    kind: words
    title: The house of the LORD, or home?
    body: |
      The Hebrew has the Levite say he is going to “the house of the LORD,” but the ancient Greek translation has him say simply “I am going home.” He has just told the old man that he is on his way back to his own place in Ephraim, and the Septuagint’s “I am going home” fits that; a modern translation follows it with “I am going to my home.”

      One older reading explains how the two could differ by a single letter: the Hebrew for “my house,” *bêthî*, ends in the letter that begins the divine name, and a copyist took that letter for the name. On that reading, which prefers “my house,” “there is nothing in the context to suggest that the Levite was going to Shiloh.” Another older reading keeps the Hebrew and, from this verse, places the Levite’s home “probably [in] the neighbourhood of Shiloh,” where the tabernacle stood (explained at [[Josh. 18:1]]). Which reading is right is not known. The point of his answer either way is its last clause: “there is no man that receiveth me to house.”
    sources: [oshb-wlc, lxx-rahlfs, nrsvue, cambridge-judges, keil-judges]

  - ref: 22
    phrase: Bring forth the man that came into thine house, that we may know him
    kind: scripture
    title: Gibeah told like Sodom
    body: |
      The men of Gibeah speak the words of the men of Sodom, and the story is told so that the reader hears them. At Sodom the crowd said to Lot, “bring them out unto us, that we may know them” ([[Gen. 19:5]]); here, “Bring forth the man … that we may know him.” In both stories guests are taken in, the townsmen demand to assault them, and the host offers two women in their place. “The reader is meant to read Judges 19 in light of Genesis 19”: Sodom can be understood without Gibeah, but Gibeah cannot be understood without Sodom. What “know” means here, and what Sodom’s sin was, are explained at [[Gen. 19:5]]; “sons of Belial,” worthless men, at [[Deut. 13:13]].

      The host’s plea carries the echo into the book’s own theme. Lot told the mob to do to his daughters “as is good in your eyes” ([[Gen. 19:8]]); the old man’s “do with them what seemeth good unto you” (verse 24) is, in the Hebrew, the same “in your eyes.” The phrase ties the scene to the refrain of these chapters, where every man did what was right “in his own eyes” ([[Judg. 17:6]]): “The book of Judges shows what happens when people do what is right in their own eyes and wrong in God’s.” The scene at Sodom as Joseph Smith’s revision tells it is explained at [[Gen. 19:8]]; Judges 19 has no revision.
    sources: [goff-plagiary, oshb-wlc, lds-scriptures]

  - ref: 25
    phrase: so the man took his concubine, and brought her forth unto them
    kind: history
    title: The Levite puts her out
    body: |
      When the mob would not listen, “the man took his concubine” and put her out to them. The text says “his concubine,” and a Latter-day Saint reading takes the man to be the Levite himself; one older reading takes him to be the host, acting with his guest’s consent. Either way she is the Levite’s concubine, and when she comes back at dawn he is inside. They abused her through the night, and at dawn she fell at the door “where her lord was” (verse 26).

      The comparison with Sodom is pointed here. At Sodom the visitors were angels, and they “put forth their hand, and pulled Lot into the house to them, and shut to the door” ([[Gen. 19:10]]). At Gibeah the woman is pushed out and the visitor stays in. “The Levite compares unfavorably with Lot’s divine visitors”: they bring their host to safety, and his concubine is put out to the mob. The text makes no excuse for him.
    sources: [goff-plagiary, keil-judges, lds-scriptures]

  - ref: 28
    phrase: Up, and let us be going. But none answered.
    kind: history
    title: But none answered
    body: |
      The Hebrew does not say whether the woman was already dead when the Levite found her; the Septuagint does. In the morning he opens the door “to go his way” (verse 27), finds her with her hands on the threshold, and says only, “Up, and let us be going.” The Septuagint fills the silence: “she answered not, for she was dead,” and many modern translations follow it.

      The Hebrew leaves it open, and its silence leaves undecided whether the mob or her husband caused her death. Read as one event, the verses tell that the men of Gibeah abuse her “and she dies.” What the text says is enough: she did not answer, and he put her on the donkey and went home.
    sources: [goff-plagiary, lxx-rahlfs, lds-scriptures]

  - ref: 29
    phrase: divided her, together with her bones, into twelve pieces
    kind: history
    title: Twelve pieces sent through Israel
    body: |
      The Levite’s act has been read as a summons to the twelve tribes and a demand for vengeance. In one older reading, sending a piece to each tribe was a symbolic act that “placed before the eyes of the whole nation” the crime done to her, “to summon it to punish the crime,” with a messenger to tell what had happened. Another older reading takes each piece as a curse on any tribe that would not come to avenge the wrong: that it would itself be cut in pieces as she was. Both are readings; the text gives only the act and what people said (verse 30).

      Scripture tells of one other such summons. When Jabesh-gilead was besieged, Saul, newly made king, cut a yoke of oxen in pieces and sent them through Israel, warning that whoever did not follow would have his oxen done the same way ([[1 Sam. 11:7]]). Read together, the parallel “makes clear the Levite’s message,” and it points toward the monarchy that follows: the first act of Israel’s first king gathered the tribes to rescue a city, while “the Levite’s bloody dispersal and internal warfare among Israelites is evidence of social disintegration.”
    sources: [keil-judges, clarke-judges, ot-manual-judges-13-21, goff-plagiary, lds-scriptures]

  - ref: 30
    phrase: There was no such deed done nor seen from the day that the children of Israel came up out of the land of Egypt unto this day
    kind: history
    title: Nothing like it since Egypt
    body: |
      Israel’s own verdict measures the crime against the nation’s whole history. The day Israel “came up out of the land of Egypt” is the day scripture often counts as the birth of the people; nothing as bad had been done since Israel began. The last words, “consider of it, take advice, and speak your minds,” call the tribes to decide how the crime is to be punished, and chapter 20 is their answer ([[Judg. 20:13]]).
    sources: [cambridge-judges, keil-judges]

christ: |
  Judges tells this night in order to condemn it. Its portrayal of these chapters “is not an acceptance or tolerance of the unacceptable but a condemnation of the deplorable,” a record of what happens when the laws and covenants God gave to protect people and keep them in care for one another are broken. The LORD who gave those laws is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]), and stories like this one “invite us to turn to Jesus Christ. Through Him, all injustices will one day be made right, and all wounds can be healed.”

  The woman of Gibeah has no name in the text, and no one in the story speaks for her. For a disciple now, the chapter’s presence in scripture gives a place to name abuse plainly when the Saints study together: such texts “create a biblically sanctioned space to name and discuss abuse within a church setting,” and the wrong done to the one who could not answer is not beyond the reach of the Redeemer’s grace.

explore: |
  - [[Gen. 19:1–11]]: Sodom, the story Gibeah is told to recall.
  - [[1 Sam. 11:1–11]]: Saul’s summons with the pieces of the oxen, and the rescue of Jabesh-gilead.
  - [[Judg. 20]]: Israel’s answer to the summons, and the war on Benjamin.
  - [[Hos. 9:9]] and [[Hos. 10:9]]: “the days of Gibeah” remembered by a prophet.
  - [“The Plagiary of the Daughters of the Lamanites”](https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites), on Judges 19–21 beside Genesis 19, Saul and the Book of Mormon.
  - [“Broken Laws as ‘Every Man Did That Which Was Right in His Own Eyes’”](https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes), on why Judges records what it condemns.

