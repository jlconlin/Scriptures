chapter: 8
title: The LORD Shall Rule over You
tagline: Gideon soothes Ephraim, punishes the towns that would not feed his men, avenges his brothers on the kings of Midian, refuses a crown, makes an ephod that becomes a snare, and dies; and Israel forgets the LORD at once.
when: 'After the victory over Midian; “forty years in the days of Gideon” (8:28)'

setting: |
  Chapter 8 finishes the story of Gideon that began in [[Judg. 6]]. The night battle of [[Judg. 7]] is over, and the men of Ephraim have taken and killed the Midianite princes Oreb and Zeeb at the fords of the Jordan. Two Midianite kings, Zebah and Zalmunna, are still loose with what remains of their army, and Gideon follows them across the river with his three hundred.

  The chase moves east of the Jordan, into the land of Gad. Succoth lay on the eastern side of the Jordan valley, south of the Jabbok, and Penuel is the place where Jacob wrestled through the night ([[Gen. 32:30–31]]). The tribes east of the river were the most exposed to Midian’s raids, which makes their refusal to help all the more striking.

  The chapter then turns from war to what Gideon did with victory: the crown offered and refused, the gold collected, the ephod made, the forty quiet years, the many sons, and among them Abimelech, born to a concubine in Shechem, whose seizure of power is the story of [[Judg. 9]]. Psalm 83 later asks God to make Israel’s enemies “as Zebah, and as Zalmunna” ([[Ps. 83:11]]), and Isaiah remembers “the day of Midian” ([[Isa. 9:4]]).

thread: |
  Chapters 6 and 7 were full of the LORD: He called Gideon, gave him signs, clothed him with His Spirit, cut his army down, and won the battle. Chapter 8 is strikingly empty of Him. The narrator ascribes none of its events to the LORD’s direction. Gideon seems to claim the LORD’s backing on his own, as when he promises Succoth a beating “when the LORD hath delivered Zebah and Zalmunna into mine hand” ([[Judg. 8:7]]).

  What he does falls into two halves. In the first (verses 1–21) he deals with his own people and his enemies: a soft answer turns away Ephraim’s anger, a hard one falls on Succoth and Penuel, and the two kings die for killing his brothers. In the second (verses 22–35) Israel offers him a dynasty. He refuses it with the words “the LORD shall rule over you” ([[Judg. 8:23]]), and the next thing he does is ask for gold and make an ephod that all Israel goes “a whoring after” ([[Judg. 8:27]]).

  The book’s cycle closes once more: Midian is subdued and “the country was in quietness forty years” ([[Judg. 8:28]]). The Hebrew verb is the one used for the land’s rest after Othniel, Ehud and Deborah, and it is the last time Judges says it of the land. Gideon dies in a good old age, the text stops short of calling him wicked, and the moment he is dead Israel goes after the Baals, forgets the LORD who delivered them, and shows no loyalty to his house (verses 33–35). Gideon’s story ends on an ambivalent note, and no judge after him is said to bring the land rest.

sections:
  - range: 1-3
    heading: Ephraim’s complaint
    plain: |
      The men of Ephraim said to Gideon, “Why have you treated us like this, not calling us when you went to fight Midian?” And they quarreled with him fiercely. He answered, “What have I done compared with you? Isn’t Ephraim’s gleaning of the grapes better than Abi-ezer’s whole harvest? God gave the princes of Midian, Oreb and Zeeb, into your hands. What could I do compared with you?” When he said this, their anger toward him cooled.
  - range: 4-17
    heading: Succoth and Penuel
    plain: |
      Gideon came to the Jordan and crossed it with his three hundred men, exhausted but still pursuing. He said to the men of Succoth, “Please give my men some loaves of bread; they are worn out, and I am chasing Zebah and Zalmunna, the kings of Midian.” The officials of Succoth answered, “Do you already have Zebah and Zalmunna in your hand, that we should feed your army?” Gideon said, “Very well. When the Lord has given Zebah and Zalmunna into my hand, I will thrash your flesh with desert thorns and briers.” He went on to Penuel and asked the same, and the men of Penuel answered as Succoth had. He told them, “When I come back safe, I will tear down this tower.”

      Zebah and Zalmunna were at Karkor with about fifteen thousand men, all that was left of the armies of the east, for a hundred and twenty thousand armed men had fallen. Gideon went up by the caravan road east of Nobah and Jogbehah and struck the camp while it felt secure. The two kings fled; he pursued and captured them, and the whole army panicked.

      Gideon son of Joash came back from the battle by the ascent of Heres. He caught a young man from Succoth and questioned him, and the young man wrote down for him the names of Succoth’s officials and elders, seventy-seven men. Gideon came to the men of Succoth and said, “Here are Zebah and Zalmunna, the ones you taunted me about when you said, ‘Do you already have them in your hand, that we should give bread to your weary men?’” He took the elders of the city and punished the men of Succoth with the desert thorns and briers. He tore down the tower of Penuel and killed the men of that city.
  - range: 18-21
    heading: The two kings
    plain: |
      Then he asked Zebah and Zalmunna, “What were the men like whom you killed at Tabor?” They said, “They were like you, every one of them, like the sons of a king.” He said, “They were my brothers, my own mother’s sons. As the Lord lives, if you had let them live, I would not kill you.” He told Jether, his firstborn, “Get up and kill them.” But the boy did not draw his sword; he was afraid, for he was still young. Zebah and Zalmunna said, “Get up and do it yourself, for a man’s strength is as the man is.” So Gideon rose and killed them, and took the crescent ornaments from their camels’ necks.
  - range: 22-27
    heading: A crown refused, an ephod made
    plain: |
      The men of Israel said to Gideon, “Rule over us, you, your son and your grandson, for you have saved us from Midian.” Gideon answered, “I will not rule over you, and my son will not rule over you. The Lord will rule over you.” Then he said, “I have one request: each of you give me an earring from his plunder.” (The enemy wore gold earrings, because they were Ishmaelites.) They said, “We will gladly give them,” spread out a cloak, and each man threw in an earring from his plunder. The gold earrings he asked for weighed seventeen hundred shekels, besides the crescents, the pendants, the purple robes the kings of Midian wore, and the chains on their camels’ necks. Gideon made an ephod of it and put it in his town, Ophrah. All Israel prostituted themselves to it there, and it became a trap for Gideon and his family.
  - range: 28-35
    heading: Gideon’s death and Israel’s forgetting
    plain: |
      So Midian was humbled before Israel and never raised its head again, and the land was at peace forty years in Gideon’s days. Jerubbaal son of Joash went home and lived in his own house. Gideon had seventy sons of his own, for he had many wives. His concubine in Shechem also bore him a son, and he named him Abimelech. Gideon son of Joash died at a good old age and was buried in the tomb of his father Joash at Ophrah of the Abi-ezrites.

      As soon as Gideon was dead, the Israelites turned again and prostituted themselves to the Baals, and made Baal-berith their god. They did not remember the Lord their God, who had rescued them from all their enemies on every side, and they showed no loyalty to the family of Jerubbaal, that is, Gideon, for all the good he had done Israel.

notes:
  - ref: 2
    phrase: Is not the gleaning of the grapes of Ephraim better than the vintage of Abi-ezer?
    kind: symbol
    title: The gleaning and the vintage
    body: |
      Gideon calms Ephraim by giving away the credit. The vintage is the full harvest of the vineyard; the gleaning is the few grapes left for those who come after. Abi-ezer was Gideon’s own small clan ([[Judg. 6:11]], [[Judg. 6:15]]), so the vintage of Abi-ezer is his night victory with the three hundred, and the gleaning of Ephraim is their late pursuit of the fleeing Midianites. Yet Ephraim’s gleaning took the two princes, Oreb and Zeeb (verse 3), and so, Gideon says, it outweighs his whole harvest.

      One older reading sees pride rather than plunder behind Ephraim’s complaint: the tribe was reaching for leadership in Israel, and Gideon had won without it. His answer works because it is not merely flattery. Ephraim’s part was real, and Isaiah later remembers “the slaughter of Midian at the rock of Oreb” as a blow of the LORD ([[Isa. 10:26]]). The soft answer stands in sharp contrast with what follows at Succoth.
    sources: [keil-judges]

  - ref: 6
    phrase: Are the hands of Zebah and Zalmunna now in thine hand
    kind: history
    title: Why Succoth and Penuel refused
    body: |
      The officials of Succoth will not feed Gideon’s men until he has actually captured the kings, and the reason may have been fear: if Gideon failed, the Midianites could come back and punish Succoth for having helped him. Penuel answered the same way (verse 8). Whatever the reason, the episode shows “the tragic fragmentation of apostate Israel”: the tribes most exposed to Midian would not join the fight to end it.

      What Gideon did about it is the harder question. He threatened Succoth with thorns and Penuel with the loss of its tower, and on his return he carried out both and killed the men of Penuel besides (verses 7–9, 16–17). The punishment has been held justified, since refusing the army in the field endangered the whole nation and was “equivalent to high treason.” Another reading grants that the towns’ cool, wait-and-see answer would have been insulting and infuriating, and asks whether it justified a mission of revenge. The text itself gives no verdict; it records the threat and the deed.
    sources: [ot-manual-judges-1-12, haws-better-way]

  - ref: 10
    phrase: there fell an hundred and twenty thousand men that drew sword
    kind: words
    title: A hundred and twenty thousand
    body: |
      Taken at face value the number is very large for one night’s panic and a pursuit by three hundred men, and two explanations are offered. The narrator may have enlarged the figures for effect, as numbers in Judges sometimes seem to be. Or the Hebrew word translated “thousand,” *ʾelef*, may here mean a military unit of no fixed size, so that a hundred and twenty *units* fell, not a hundred and twenty thousand men. Either way the verse’s point stands: of the host that had covered the valley “like grasshoppers for multitude” ([[Judg. 7:12]]), only a remnant was left.
    sources: [ot-minute-judg-8, oshb-wlc]

  - ref: 16
    phrase: with them he taught the men of Succoth
    kind: words
    title: Taught, or threshed?
    body: |
      “Taught” is a literal rendering of the Hebrew, and it may not be the original reading. The Hebrew has *wayyōdaʿ*, a causative form of the common verb *yādaʿ*, to know: Gideon caused the men of Succoth to know, made them feel his punishment. But in verse 7 his threat used a different verb, *dûš*, “tread” or “thresh”: he would thresh their flesh with thorns as grain is threshed. The Septuagint reads verse 16 as he “tore the men of the city,” and the standard Hebrew lexicon, though it lists the verse as it stands under *yādaʿ*, also proposes reading the verb of verse 7 here, a difference of one letter.

      Either way the sense is the same: Gideon did what he had said he would do. What exactly that punishment was, the text does not say.
    sources: [oshb-wlc, bdb, lxx-rahlfs]

  - ref: 19
    phrase: if ye had saved them alive, I would not slay you
    kind: history
    title: Gideon’s brothers
    body: |
      Gideon makes the death of Zebah and Zalmunna a matter of his own family: the kings had killed his brothers. His question about the men slain at Tabor (verse 18) brings that out, and his oath makes their death retribution for it: had they spared his brothers, he would spare them. He then hands the sword to Jether, his firstborn. The boy is afraid, and the kings ask Gideon to do it himself (verse 21): to be killed by a boy would have been a great dishonor, while to die quickly under the hand of a great warrior preserved their honor.

      The memory of his brothers may have been festering in Gideon and driving this revenge, and the scene leaves open what it did to the son who was told to kill, and whether this example of deadly retribution reverberated through the next generation. The next chapter opens with Gideon’s son Abimelech killing his brothers ([[Judg. 9:5]]).
    sources: [ot-manual-judges-1-12, haws-better-way]

  - ref: 23
    phrase: the LORD shall rule over you
    kind: scripture
    title: The LORD shall rule over you
    body: |
      Gideon refuses not only a throne but a dynasty, and names the LORD as Israel’s ruler. The men of Israel offered rule to him, “and thy son, and thy son’s son also” ([[Judg. 8:22]]); he declined for himself and his sons alike. The LORD he names is Jehovah, the premortal Christ ([[Ex. 3:14]]), who had just given the victory. Had Gideon accepted, he would have seemed to claim that victory as won by his own power; by refusing, he pointed Israel to its real source and to the King they should acknowledge.

      Judges as a whole has been read as “a prophetic call to acknowledge the kingship of the Lord, the true King and Judge of Israel,” and in that reading Gideon “rightly” refused. What unraveled Israel’s society in the book was “their immediate rejection of God as their king and judge, along with his laws and covenants.” Samuel will hear the same from the LORD when Israel at last asks for a king: “they have rejected me, that I should not reign over them” ([[1 Sam. 8:7]]). How the book’s closing refrain about there being no king in Israel reads beside this verse is taken up at [[Judg. 17:6]] and [[Judg. 21:25]].
    sources: [ot-manual-judges-1-12, schade-broken-laws]

  - ref: 24
    phrase: because they were Ishmaelites
    kind: history
    title: Midianites called Ishmaelites
    body: |
      Genesis already uses the two names for one people: the traders who carried Joseph to Egypt are “Ishmeelites” and “Midianites” in the same story ([[Gen. 37:28]], [[Gen. 37:36]]). One older reading explains why: “Ishmaelites” was a general name for the nomadic tribes of the Arabian desert, Midian among them. The same reading takes the gold earrings as what such peoples wore, and so the reason the plunder held so many.
    sources: [keil-judges, lds-scriptures]

  - ref: 27
    phrase: Gideon made an ephod thereof
    kind: history
    title: The ephod that became a snare
    body: |
      The same Gideon who refused the crown turned the gold of the victory into an ephod, and it became an idol. An ephod was the high priest’s outer garment ([[Ex. 28:6]]), and a priest’s ephod could be brought out to inquire of God. What Gideon made is uncertain. It may have been like the high priest’s ephod, or a different object with the same name, perhaps an image of some kind; the same word is used of the object in Micah’s shrine ([[Judg. 17:5]]). Whatever its form, it was “a sort of divinatory object,” a thing for seeking guidance.

      Why he made it is not said. He may have meant a memorial to the LORD’s part in the victory, and he led Israel into idolatry “perhaps unintentionally.” One older reading sees in it a quieter temptation than the crown: having refused to rule, Gideon wanted to secure for himself the position to which the LORD had called and exalted him.

      The narrator’s judgment is plain all the same. “All Israel went thither a whoring after it” ([[Judg. 8:27]]): the words Judges uses of Israel’s going after other gods ([[Judg. 2:17]]; [[Judg. 8:33]]). And it became a “snare,” as the law had warned the Canaanites’ gods would be: “if thou serve their gods, it will surely be a snare unto thee” ([[Ex. 23:33]]). The irony is dark. Gideon began his work by pulling down his father’s altar to Baal ([[Judg. 6:25–32]]), and he ended it by making the object that drew Israel away from the LORD, and his own house with it.
    sources: [scripture-helps-judges, bd-ephod, bd-gideon, keil-judges, ot-minute-judg-8, haws-better-way, lds-scriptures]

  - ref: 33
    phrase: made Baal-berith their god
    kind: history
    title: Baal of the covenant
    body: |
      Baal-berith means “Baal of the covenant,” the form of Baal worshipped at Shechem, where his temple stood ([[Judg. 9:4]], [[Judg. 9:46]]). Israel, bound by covenant to the LORD, made a Baal of the covenant its god. What Baal was, and why the land’s gods drew Israel, is explained at [[Judg. 2:13]].

      The chapter’s last two verses name two failures of covenant faithfulness. Israel “remembered not the LORD their God” ([[Judg. 8:34]]) who had delivered them, and showed no “kindness,” Hebrew *ḥesed*, covenant loyalty, to the house of the man He had used to do it; where Judges uses *ḥesed*, it describes broken covenant dealing of this kind. Set directly after the ephod and Gideon’s death, the relapse leaves “some lingering doubt” how far Gideon’s own idolatry was to blame. [[Judg. 9]] shows what the lack of loyalty cost his sons.
    sources: [bdb, bd-baal, schade-broken-laws, oshb-wlc, ot-minute-judg-8]

christ: |
  Gideon’s best words point past himself: “the LORD shall rule over you” ([[Judg. 8:23]]). The LORD who gave the victory was Jehovah, the premortal Jesus Christ ([[Ex. 3:14]]), and the chapter shows what happens when His people take His gifts and forget the Giver: the ephod becomes a snare, and Israel “remembered not the LORD their God, who had delivered them” ([[Judg. 8:34]]). The Church’s footnote to Gideon’s words sends the reader to Mormon’s lament over the same forgetting: “they do not desire that the Lord their God, who hath created them, should rule and reign over them” ([[Hel. 12:6]]). A disciple’s victories come from the same Lord, and the danger after them is to forget Him: to take the credit for them, or, as Gideon’s threats at Succoth and Penuel may show, to treat them as license to go further than He asked. The Lord’s warning reaches that danger: “almost all men, as soon as they get a little authority, as they suppose, they will immediately begin to exercise unrighteous dominion” ([[D&C 121:39]]). The safeguard is the one Gideon spoke at his best, letting the Lord rule.

explore: |
  - **Gideon’s whole story.** Read [[Judg. 6]], [[Judg. 7]] and this chapter together, and watch how often the LORD speaks in the first two and how seldom in the third.
  - **Who should be king.** [[Deut. 17:14–20]], [[1 Sam. 8:4–22]] and [[Mosiah 29:13–23]].
  - **The house of Gideon.** [[Judg. 9]] tells what became of his seventy sons and of Abimelech.
  - **Remembering the Deliverer.** [[Deut. 8:11–18]] and [[Hel. 12:1–6]].
  - “Longing for a Better Way,” a reflection on Judges from BYU’s Maxwell Institute, is especially good on Gideon’s turn in this chapter.

