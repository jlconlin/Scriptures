chapter: 16
title: The LORD Was Departed from Him
tagline: Samson carries off the gates of Gaza, tells Delilah the secret of his strength, is shaved, blinded and set to the mill, and in his last prayer brings Dagon’s house down on the Philistines and himself.
when: 'When the Philistines ruled Israel, at the end of Samson’s twenty years (verse 31)'

setting: |
  Chapter 16 closes the stories of the judges. The history of the judges runs from [[Judg. 3:7]] to this chapter's last verse, and chapters 17–21 are two narratives that show the people's turn to idolatry and lawlessness. Samson, the twelfth of the judges, was born in the forty years the LORD gave Israel “into the hand of the Philistines” ([[Judg. 13:1]]), to a mother told that “he shall begin to deliver Israel” ([[Judg. 13:5]]). Chapters 14–15 told his clashes with them; this chapter tells his downfall and his death.

  The Philistines held the rich coastal plain from Joppa to the Egyptian desert, a league of five cities, Ashdod, Gaza, Ashkelon, Gath and Ekron, each governed by its “lord.” Those five lords act together here (verses 5, 18, 27). The chapter begins and ends at Gaza, on the Mediterranean coast: Samson carries off its gate, is led back into it in chains, and dies there in the temple of Dagon.

  The book has already given his years: “he judged Israel in the days of the Philistines twenty years” ([[Judg. 15:20]]), and verse 31 repeats it over his grave. The Church's verdict on the whole life is plain: blessed with great strength, Samson “failed to fulfill his divine calling because of selfish and unrighteous choices.” This chapter is where those choices come due.

thread: |
  The chapter turns on the word “bind.” The lords want to learn how they may “bind him to afflict him” (verse 5), and Delilah asks the same thing in nearly the same words four times. Three bindings fail: seven green cords, new ropes, his hair woven into a loom. Each time Samson breaks free and the secret holds. The fourth time nothing is tied at all. His head is shaved, “she began to afflict him, and his strength went from him” (verse 19).

  Verse 20 says why, in words Samson did not know: “the LORD was departed from him.” The strength had never been in the hair. It came from God, and the hair was the sign of Samson's covenant with Him; Samson lost his strength because he broke his covenants. Then the Philistines have what they wanted: the man bound with fetters, blinded, and grinding at the mill (verse 21), and a feast giving the victory to Dagon (verses 23–24).

  Against that the narrator sets one quiet sentence, “the hair of his head began to grow again” (verse 22), and one prayer, “remember me” (verse 28). The LORD who departed answers, and Dagon's house falls on its worshippers. The man born to begin to deliver Israel does the most for that calling in his death (verse 30). Hebrews still names him among the faithful ([[Heb. 11:32]], explained at [[Judg. 11:39]]).

sections:
  - range: 1-3
    heading: The gates of Gaza
    plain: |
      Samson went to Gaza, saw a prostitute there, and went in to her. The people of Gaza were told, “Samson has come here,” so they surrounded the place and lay in wait for him all night at the city gate. They kept quiet all night, saying, “When it is light in the morning, we will kill him.” But Samson lay there only until midnight. Then he got up, took hold of the doors of the city gate and the two gateposts, pulled them up, bar and all, put them on his shoulders, and carried them to the top of the hill that faces Hebron.
  - range: 4-14
    heading: Delilah asks three times
    plain: |
      Afterward he fell in love with a woman in the valley of Sorek named Delilah. The lords of the Philistines came to her and said, “Coax him, and find out what makes his strength so great and how we can overpower him, so that we can tie him up and subdue him. Each of us will give you eleven hundred pieces of silver.” So Delilah said to Samson, “Please tell me what makes your strength so great, and how you could be tied up and subdued.” Samson told her, “If they tie me with seven green cords that have never been dried, I will become weak and be like any other man.” The lords brought her seven green cords that had not been dried, and she tied him with them. Men were hiding in her room, waiting. She said, “The Philistines are upon you, Samson!” And he snapped the cords as a thread of tow snaps when it touches fire. So the secret of his strength was not found out. Delilah said, “You have made a fool of me and told me lies. Now tell me how you can be tied.” He said, “If they tie me tight with new ropes that have never been used, I will become weak and be like any other man.” So Delilah took new ropes and tied him, with the men again hiding in the room, and said, “The Philistines are upon you, Samson!” He snapped the ropes off his arms like thread. Delilah said, “Until now you have mocked me and lied to me. Tell me how you can be tied.” He said, “If you weave the seven locks of my hair into the cloth on the loom.” She fastened it with the pin and said, “The Philistines are upon you, Samson!” He woke from his sleep and pulled away the pin of the loom and the cloth.
  - range: 15-22
    heading: The secret and the razor
    plain: |
      She said to him, “How can you say ‘I love you’ when your heart is not with me? Three times now you have mocked me and not told me what makes your strength so great.” Day after day she pressed him with her words and pleaded with him, until he was worn out to death. Then he told her everything in his heart: “No razor has ever touched my head, for I have been a Nazarite to God from my mother's womb. If my head is shaved, my strength will leave me, and I will become weak and be like any other man.” When Delilah saw that he had told her everything, she sent for the lords of the Philistines: “Come up this once more, for he has told me everything.” The lords came, bringing the money with them. She lulled him to sleep on her knees and called a man, and had the seven locks of his head shaved off. She began to subdue him, and his strength left him. She said, “The Philistines are upon you, Samson!” He woke and thought, “I will go out as I did before and shake myself free.” He did not know that the LORD had left him. The Philistines seized him, put out his eyes, and took him down to Gaza. They bound him with fetters of brass, and he was set to grinding grain in the prison. But the hair of his head began to grow again after it had been shaved.
  - range: 23-31
    heading: The fall of Dagon's house
    plain: |
      The lords of the Philistines gathered to offer a great sacrifice to Dagon their god and to celebrate, saying, “Our god has given Samson our enemy into our hands.” When the people saw him, they praised their god, saying, “Our god has given into our hands our enemy, who laid waste our country and killed so many of us.” When they were in high spirits they said, “Call Samson, so that he can entertain us.” They called Samson out of the prison, and he performed for them, and they stood him between the pillars. Samson said to the boy who led him by the hand, “Let me feel the pillars that hold up the house, so that I can lean on them.” The house was full of men and women; all the lords of the Philistines were there, and on the roof were about three thousand men and women watching Samson perform. Then Samson called to the LORD: “O Lord GOD, remember me, please, and strengthen me, please, just this once, O God, so that I may at once take vengeance on the Philistines for my two eyes.” Samson took hold of the two middle pillars on which the house stood and rested, one with his right hand and the other with his left. Samson said, “Let me die with the Philistines.” He pushed with all his might, and the house fell on the lords and on all the people in it. So those he killed at his death were more than those he had killed in his life. His brothers and all his father's family came down, took him, brought him up, and buried him between Zorah and Eshtaol in the tomb of his father Manoah. He had judged Israel twenty years.

notes:
  - ref: 3
    phrase: carried them up to the top of an hill that is before Hebron
    kind: history
    title: The gates of Gaza
    body: |
      Samson's night in Gaza ends in a feat of strength. Gaza was one of the five cities of the Philistines, and its men lay in wait at the gate to take him at dawn. A city gate of the time was probably two leaves turning on pins in sockets, locked by a bar let into the posts on either side; Samson pulled up the whole frame, doors, posts and bar, and carried it off in one piece.

      How far he carried it is not certain. Hebron is at least forty miles from Gaza, and the Hebrew behind “before” can mean facing, or in the direction of, rather than close by. One older reading takes it so, and notes a tradition that puts the hill on a height called el-Muntar, a short way southeast of Gaza, from which the mountains of Hebron (not the town) can be seen. Either way the point is the strength. The episode is told in three verses without comment, and perhaps shows a man growing more reckless toward the end of his life.
    sources: [bd-gaza, cambridge-judges, keil-judges, ot-minute-judg-16]

  - ref: 4
    phrase: whose name was Delilah
    kind: history
    title: Who was Delilah?
    body: |
      Delilah is the one woman in Samson's story whom the text names, and almost nothing else about her is told. She is taken to be a Philistine woman of the valley of Sorek who drew out the secret of his strength and betrayed him. The text never says she was a Philistine; she was presumably one, given how familiar she was with the Philistine lords (verse 5), and her weaving in verses 13–14 suggests she knew the loom. What her name means is uncertain: it has been explained as “weak, delicate,” and also as “dangling curls, loose hair,” which would suit a story that ends with a shaved head.

      Two things the text does say. She was paid: each of the lords, the rulers of the five Philistine cities, promised her eleven hundred pieces of silver (verse 5), and in verse 18 they come “and brought money in their hand.” And she asked outright. The later picture of Delilah as a seductress goes beyond the account, which does not necessarily portray her as seducing him; it shows her asking four times, plainly, for what the lords had sent her to learn.
    sources: [bd-delilah, ot-minute-judg-16, bd-philistines, lds-scriptures]

  - ref: 9
    phrase: as a thread of tow is broken when it toucheth the fire
    kind: scripture
    title: A thread of tow
    body: |
      Tow is the coarse, flammable fiber of flax, and a single thread of it is about the weakest cord there is; the seven green cords of verse 7 parted like that at a touch of fire. Flax could be made into strong rope, but only by twisting and braiding many weak strands together.

      Nephi's warning that the devil “leadeth them by the neck with a flaxen cord, until he bindeth them with his strong cords forever” ([[2 Ne. 26:22]]) fits this biblical image of flimsy tow. Read against it, Nephi's flaxen cord is the flimsy thread a person could break with little effort, set against the “strong cords” it becomes; it stands for the way a sin or a weakness leads a person on from one degree of sin to another.
    sources: [sc-knowhy-551, lds-scriptures]

  - ref: 13
    phrase: If thou weavest the seven locks of my head with the web
    kind: words
    title: The loom and the missing words
    body: |
      Verse 13 stops short. Samson's first two answers end “then shall I be weak, and be as another man” (verses 7, 11), but the third gives only half a plan, and verse 14 begins with a pin that has not been mentioned. Commentators agree that something is missing from the account here. The Septuagint, the ancient Greek translation, has the fuller form: “If thou shouldest weave the seven locks of my head with the web, and shouldest fasten them with the pin into the wall, then shall I be weak as another man,” and in verse 14 it has Delilah weave them “when he was asleep.”

      The “locks” are the plaits of his long hair, and the “web” is the cloth still on the loom, its warp. With the fuller text the scene is plain: while he slept she wove his seven braids into the warp and pinned the loom fast, and he woke and walked off with pin, beam and cloth together.
    sources: [lxx-rahlfs, keil-judges]

  - ref: 16
    phrase: she pressed him daily with her words, and urged him
    kind: scripture
    title: Pressed daily
    body: |
      The fourth asking succeeds by wearing him down, not by a trick. Delilah's charge is that a man who says “I love thee” and keeps his heart from her is lying (verse 15), and she presses it day after day until his soul is “vexed unto death.” The Hebrew says his soul grew short: he was worn out by her persistence, at the end of his endurance (the same phrase is used of the LORD at [[Judg. 10:16]]).

      The Church's footnote to “daily” sends the reader to Joseph in Egypt, where the pressure is the same and the answer is not. Potiphar's wife “spake to Joseph day by day” ([[Gen. 39:10]]), and he refused even to be near her and fled rather than break God's commandment; Samson, pressed in the same way, “gave in to enticement.”
    sources: [lds-scriptures, bdb, ot-manual-judges-13-21]

  - ref: 17
    phrase: There hath not come a razor upon mine head
    kind: history
    title: A Nazarite from the womb
    body: |
      Samson's answer is not really about his hair; it is about what he is. He has been “a Nazarite unto God from my mother's womb,” the charge the angel gave his mother before he was born ([[Judg. 13:5]], where his lifelong vow is explained; the Nazarite law is at [[Num. 6:2]]). A Nazarite was under a vow to abstain from wine, from any cutting of the hair, and from contact with the dead, and of the hair the law says, “there shall no razor come upon his head” ([[Num. 6:5]]). His answer takes the story back to its beginning, to the angel's word at his birth.

      The hair was the sign, not the source. The strength came from God, and the uncut hair stood for the covenant between them. Samson lost both his physical and his spiritual strength because he broke his covenants with God, those of a Nazarite among them.
    sources: [bd-nazarite, lds-scriptures, ot-minute-judg-16, scripture-helps-judges]

  - ref: 20
    phrase: he wist not that the LORD was departed from him
    kind: prophets
    title: Shorn of his locks
    body: |
      Samson woke expecting the old strength: “I will go out as at other times before, and shake myself.” He did not know (“wist not”) that the LORD had left him, and the line puts the loss where it belongs, in the LORD's leaving rather than in the razor.

      Joseph Smith used the verse of himself. In a letter of November 1843, declining to lend his influence “to boost a man into power,” he wrote that if he ever left “the dignity and honor of heaven, to gratify the ambition and vanity of man or men,” then “may my power cease, like the strength of Samson, when he was shorn of his locks, while asleep in the lap of Delilah.” He set the story as a condition on his own power: if he turned what he had received from heaven to a man's ambition, let it go from him as Samson's strength went.
    sources: [lds-scriptures, jsp-history-e1-1778]

  - ref: 21
    phrase: put out his eyes, and brought him down to Gaza
    kind: history
    title: Blinded and set to the mill
    body: |
      The Philistines did to Samson what the ancient world did to rebels and captives of war. Putting out a prisoner's eyes was not an uncommon punishment; Judah's king Zedekiah was blinded and bound in fetters of brass by the Babylonians centuries later ([[2 Kgs. 25:7]]). Grinding grain at a hand mill was the hardest and lowest of slave labor (the note at [[Isa. 47:2]] has more on it). The man who carried off the gates of Gaza is brought back to it in chains, and he had brought himself there a little at a time.
    sources: [ot-minute-judg-16, keil-judges, lds-scriptures]

  - ref: 22
    phrase: the hair of his head began to grow again
    kind: history
    title: The hair grows again
    body: |
      The narrator puts one quiet sentence between the prison and the feast, a hint of what is coming. The hair that was the sign of Samson's covenant with God begins to grow back.

      The verse does not say his strength came back with it. The strength comes in verse 28, when Samson calls on the LORD and asks Him for it. That order fits what the hair was: the symbol of his relationship with God, not the source of his strength (see the note at verse 17).
    sources: [ot-minute-judg-16, scripture-helps-judges]

  - ref: 23
    phrase: Our god hath delivered Samson our enemy into our hand
    kind: history
    title: Dagon’s feast
    body: |
      The Philistines took Samson's capture as a victory of their god over Israel's. Dagon was the god of the Philistines, with temples at Gaza and Ashdod; his image was long described as part man and part fish, though some connect the name instead with *dāgān*, “grain.” The lords gathered for a great sacrifice, and the people repeated the same claim as they praised their god (verses 23–24): Samson in chains proved Dagon greater than Jehovah, and so they had no fear in making sport of Jehovah's champion in their god's own house.

      The end of the chapter answers that claim. In one reading, it is precisely by means of Samson's failings, his desires, his broken vow and his thirst for revenge, that the LORD “is able to win a theological victory over the Philistine god Dagon.” The Church's footnote sends the reader on to Ashdod, where Dagon's image falls before the ark ([[1 Sam. 5:2–4]]).
    sources: [bd-dagon, ot-manual-judges-13-21, schade-broken-laws, lds-scriptures]

  - ref: 28
    phrase: remember me, I pray thee, and strengthen me, I pray thee, only this once
    kind: history
    title: Samson’s last prayer
    body: |
      Samson's last prayer asks for strength once more and says plainly what it is for: “that I may be at once avenged of the Philistines for my two eyes.” With its “remember me” and its twice-repeated “I pray thee” it has the tone of penitence, but it confesses nothing and asks nothing for Israel. It is a prayer for vengeance, without the searching repentance a reader might expect, and in keeping with the man who prayed it.

      Why the LORD granted it the text does not say. The request was self-centered, and one possible reason is that the answer showed His power over Dagon in the very house where Dagon had been praised for Samson's capture. It can also be read as a last act of mercy. Both readings put the strength where verse 20 put its loss: with the LORD.
    sources: [ot-minute-judg-16, scripture-helps-judges]

  - ref: 29
    phrase: the two middle pillars upon which the house stood
    kind: history
    title: Could one man bring down the house?
    body: |
      The building was probably of a kind known from excavations at Gezer and Gaza: a flat roof of logs laid from the walls to beams, the beams carried on wooden pillars set on stone bases. On that picture Samson performed in the forecourt, was led to the central pillars to lean on them, and, with an arm round each, bent them out of upright until the roof came down; the weight of the crowd on the roof, some three thousand people (verse 27), may have made it easier. One older reading describes the act the same way: he embraced the two middle pillars, leaned on them, and bent them with force. The text itself says only that he took hold of them, one in each hand, and “bowed himself with all his might” (verse 30).
    sources: [ot-manual-judges-13-21, keil-judges]

  - ref: 30
    phrase: Let me die with the Philistines
    kind: history
    title: His death and his calling
    body: |
      The text tells Samson's death plainly and passes no verdict on it. He asked to die with the Philistines, and the house fell on the lords and on all the people. The narrator adds only a count: “the dead which he slew at his death were more than they which he slew in his life.”

      That count carries the irony of his life. Samson was born to “begin to deliver Israel” ([[Judg. 13:5]]), and he did the most for that calling only by giving up his life, in a deed done to avenge himself rather than Israel, though Israel was helped by it. His family carried his body home and buried him in the tomb of his father Manoah (verse 31). The story ends on a somber note, but not a wholly dark one: he was at least given a proper burial in his family's ground.
    sources: [ot-minute-judg-16, lds-scriptures]

christ: |
  The LORD who departed from Samson in verse 20 is the LORD who heard him in verse 28: Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). The judges point past themselves to Him; the pattern Judges 3 describes “teaches about the Savior's power to deliver us from sin,” and Samson's story shows how far that power reaches, for no matter how flawed the judge, “God saves (or in the case of Samson, ‘begins to save’).”

  The strength God gives is held within the covenant of which Samson's hair was only the sign, and a revelation to Joseph Smith states the rule Samson's life shows: a man may “have power to do many mighty works,” and yet if he “boasts of his own strength, and sets at naught the counsels of God,” he “must fall” ([[D&C 3:4]]). The Lord who let Samson fall also heard him from the prison house, and He hears a disciple who calls on Him after the loss.

explore: |
  - [[Judg. 13:2–7]]: the angel's promise of a son who would begin to deliver Israel, and the Nazarite charge that verse 17 recalls.
  - [[Num. 6:1–21]]: the law of the Nazarite.
  - [[Gen. 39:7–12]]: Joseph, pressed day by day, who would not give in.
  - [[1 Sam. 5:1–7]]: Dagon fallen on his face before the ark of the LORD.
  - [[Heb. 11:32–34]]: Samson among those who “out of weakness were made strong.”

