chapter: 2
title: Another Generation Which Knew Not the LORD
tagline: The LORD's messenger reproves Israel at Bochim, a generation rises that does not know Him, and the narrator lays out the pattern the whole book will follow, of apostasy, oppression, a judge raised up to deliver, and a deeper fall.
when: After the death of Joshua

setting: |
  Judges 2 continues the opening of the book (1:1–3:6), the introduction to “the cycle of sin and deliverance.” Chapter 1 went through the tribes one by one, telling what each took and what each left. On one older reading the visit of the angel at Bochim (verses 1–5) is attached to that survey as the LORD's answer to it: the nations left in the land are a broken covenant, and He names the consequence.

  Then the narrator steps back. Verses 6–10 tell again the death of Joshua from the end of the book of Joshua, to mark the passing of his generation, and verses 11–23 set out, before any judge is named, the pattern that the stories of the judges will follow.

  For where these years fall, see the volume guide *The Conquest, the Judges, and One Kingdom*. Later scripture remembers the period in this chapter's terms. Psalm 106 says Israel “did not destroy the nations” and “served their idols: which were a snare unto them,” that “many times did he deliver them” ([[Ps. 106:34–43]]), and that He “repented according to the multitude of his mercies” ([[Ps. 106:45]]).

thread: |
  The chapter moves from a single scene to a pattern. At Bochim the LORD reminds Israel that He brought them out of Egypt and has never broken His covenant, names what they have done (a league with the land's people, altars left standing), and says what will follow: the nations will stay, as thorns and as a snare. The people weep and sacrifice (verses 1–5). Then the story goes back to Joshua's death and the death of the elders who had seen the LORD's works, and the generation after them “knew not the LORD” (verses 6–10).

  Verses 11–23 then give the frame of the book, told with its own verbs. Israel “did evil in the sight of the LORD,” “forsook the LORD,” and “served Baal and Ashtaroth.” The LORD's anger was hot, and He “delivered them into the hands of spoilers” and “sold them” to their enemies, until they “were greatly distressed.” “Nevertheless the LORD raised up judges, which delivered them,” and He was with each judge while the judge lived, moved by their groaning. When the judge died, “they returned, and corrupted themselves more than their fathers.” In four steps (false gods, oppression, a judge raised up in mercy, relapse), this is the formula that frames the book's narrative cycle, a pattern “repeated multiple times throughout the book.” Each judge's chapter names the steps as they come.

  The chapter ends with the LORD's verdict on the whole pattern. Because Israel has transgressed the covenant, He will drive out no more of the nations Joshua left, and those nations will now be the means by which He will “prove Israel” (verse 22).

sections:
  - range: 1-5
    heading: The angel at Bochim
    plain: |
      The angel of the LORD came up from Gilgal to Bochim and said: “I brought you up out of Egypt and into the land I swore to give your fathers, and I said, ‘I will never break My covenant with you.’ You were to make no treaty with the people of this land, and you were to tear down their altars. But you have not obeyed My voice. Why have you done this? So I also said, ‘I will not drive them out ahead of you. They will be like thorns in your sides, and their gods will be a trap for you.’” When the angel of the LORD had said this to all the Israelites, the people wept aloud. They called the place Bochim and offered sacrifices there to the LORD.
  - range: 6-10
    heading: Another generation
    plain: |
      When Joshua had sent the people away, the Israelites went each to his own inheritance to take possession of the land. The people served the LORD all Joshua's lifetime and all the lifetime of the elders who outlived him, who had seen all the great things the LORD had done for Israel. Joshua son of Nun, the LORD's servant, died at a hundred and ten, and they buried him within his own inheritance at Timnath-heres, in the hill country of Ephraim, north of Mount Gaash. That whole generation died too, and another generation grew up after them that did not know the LORD or the things He had done for Israel.
  - range: 11-15
    heading: They forsook the LORD
    plain: |
      The Israelites did what was evil in the LORD's sight and served the Baals. They abandoned the LORD, the God of their fathers, who had brought them out of Egypt, and followed other gods, the gods of the peoples around them, and bowed down to them, and so provoked the LORD to anger. They abandoned the LORD and served Baal and the Ashtaroth. The LORD's anger burned against Israel, and He handed them over to raiders who plundered them; He sold them to the enemies around them, so that they could no longer stand against their enemies. Wherever they went, the LORD's hand was against them to harm them, as He had said and sworn to them, and they were in great distress.
  - range: 16-19
    heading: The LORD raised up judges
    plain: |
      Even so, the LORD raised up judges, who saved them from the raiders. Yet they would not listen to their judges either; they were unfaithful to the LORD with other gods and bowed down to them. They turned quickly from the way their fathers had walked in obedience to the LORD's commandments; they did not do so. Whenever the LORD raised up a judge for them, the LORD was with that judge and saved them from their enemies as long as the judge lived, because the LORD was moved by their groaning under those who oppressed and crushed them. But when the judge died, they went back and became more corrupt than their fathers, following other gods, serving them and bowing down to them. They would not give up their practices or their stubborn ways.
  - range: 20-23
    heading: That through them I may prove Israel
    plain: |
      So the LORD's anger burned against Israel, and He said: “Because this people has broken the covenant I commanded their fathers and has not listened to My voice, I will no longer drive out before them any of the nations Joshua left when he died. Through them I will test Israel, whether they will keep the LORD's way and walk in it as their fathers did, or not.” So the LORD left those nations; He did not drive them out quickly, and He had not given them into Joshua's hand.

notes:
  - ref: 1
    phrase: an angel of the LORD came up from Gilgal to Bochim
    kind: history
    title: The angel who speaks as the LORD
    body: |
      The messenger at Bochim speaks in the LORD's own voice: “I made you to go up out of Egypt,” and “I will never break my covenant with you.” Who the angel of the LORD is, Judges takes up at Gideon's call ([[Judg. 6:22]]; see also [[Ex. 3:2]]). On one older reading, the sacrifice the people offered here, at a place with no sanctuary (verse 5), already shows that the one who appeared was “not a prophet, nor even an ordinary angel, but the angel of the Lord, who is essentially one with Jehovah.”

      He comes “from Gilgal,” the camp where Israel had first lodged after crossing the Jordan, early in the conquest ([[Josh. 4:19]]; [[Josh. 5:10]]). The new place is named for what the people did when they heard him: they “wept” (*bākhāh*), and the place became Bochim, “weepers.” On the same older reading, the weeping was grief for their sin, and it led them to offer sacrifice there for forgiveness. The chapter then turns at once to the generation that “knew not the LORD” (verse 10).
    sources: [lds-scriptures, keil-judges, ot-minute-judg-2]

  - ref: 3
    phrase: they shall be as thorns in your sides
    kind: scripture
    title: 'Thorns and snares: the warning written into the covenant'
    body: |
      The LORD's “I will not drive them out” follows from what Israel did, not from a change in Him. Verse 1 gives His side of the covenant, kept; verse 2 names Israel's, broken (no league with the people of the land, their altars thrown down, the terms of [[Ex. 34:12–15]] and [[Deut. 7:1–5]]); and verse 3 begins “Wherefore.” The angel's question, “why have ye done this?”, is a “heartbreaking reprimand,” a plea for Israel to follow the Lord's way.

      The images had been heard before. At Sinai: “if thou serve their gods, it will surely be a snare unto thee” ([[Ex. 23:33]]). From Moses: those Israel let remain “shall be pricks in your eyes, and thorns in your sides” ([[Num. 33:55]]; see the note at [[Num. 33:56]]). And in Joshua's farewell: if Israel clave to the nations, the LORD “will no more drive out” any of them, and they would be “snares and traps unto you” ([[Josh. 23:13]]; see the note there). Verse 20 gives the LORD's reason in the same covenant terms: “this people hath transgressed my covenant.” How Judges 1 tells the land not taken beside Joshua's account is in chapter 1's introduction and at [[Josh. 13:1]].
    sources: [lds-scriptures, schade-broken-laws]

  - ref: 6
    phrase: And when Joshua had let the people go
    kind: history
    title: Joshua's death told a second time
    body: |
      Verses 6–9 tell again, almost in the same words, what the end of Joshua has already told: the people sent to their inheritances, Israel's service while Joshua and the elders lived, his death at a hundred and ten, and his burial ([[Josh. 24:28–31]]). The book has already begun “after the death of Joshua” ([[Judg. 1:1]]), so the passage is “a sort of flashback,” whose purpose is to “mark a temporal transition from Joshua’s generation to the new generation” of verse 10. The break in the story may also mean that 1:1–2:5 was added later, though that is only a suggestion; the chapter's reason for retelling the death is the generation that follows it (see the note at [[Josh. 24:31]]).

      One difference catches a careful reader: the burial place is Timnath-*heres* here and Timnath-*serah* in [[Josh. 24:30]]. In the Hebrew the second word has the same three letters in reverse order (*ḥeres*, *seraḥ*). On one older reading *ḥeres* means “sun,” and the form in Joshua may have been written so “to avoid idolatrous associations.” Either way it is the same place, Joshua's own inheritance.
    sources: [lds-scriptures, ot-minute-judg-2, oshb-wlc, cambridge-judges]

  - ref: 10
    phrase: which knew not the LORD
    kind: words
    title: A generation that did not know the LORD
    body: |
      Not to know the LORD here most likely means to have no covenant relationship with Him, more than never to have heard of Him. The verb is *yādaʿ*, “know,” which “can denote mere cognition, but typically implies a deeper engagement of the knower with the known,” and in the language of treaties suggests “acknowledgment of the claims and authority of one’s superior to the exclusion of others.” Read that way, verse 10 describes a generation “who did not enjoy this rich and deeply personal covenantal relationship with God.”

      The verse pairs not knowing the LORD with not knowing “the works which he had done for Israel.” Their parents' generation were the elders “who had seen all the great works of the LORD” (verse 7), who “had known all the works of the LORD” ([[Josh. 24:31]]).
    sources: [oshb-wlc, schade-broken-laws, lds-scriptures]

  - ref: 13
    phrase: served Baal and Ashtaroth
    kind: history
    title: 'Baal, the “lord,” and Ashtaroth'
    body: |
      Baal's name is a title: it means “possessor, lord,” and the word “expresses the relation between lord and slave.” Verse 11 has the plural, Baalim, for Baal was worshipped “with different ideas and rites” in different places, and verse 13 pairs him with Ashtaroth, the plural of Ashtoreth, “idols worshipped with Baal by the Israelites.” A third object of worship in the land, the “grove” (in Hebrew *Asherah*), “either a living tree or a tree-like pole, set up as an object of worship,” enters the story at [[Judg. 3:7]].

      These gods drew Israel because they were believed to govern what a people living on the land depended on, and they were worshipped in forms Israel already knew. In the process of settling the land, Israel “adopted many traditions” of the Canaanites.
    sources: [bd-baal, bd-ashtaroth, scripture-helps-judges, schade-broken-laws, lds-scriptures]

  - ref: 16
    phrase: Nevertheless the LORD raised up judges
    kind: words
    title: What a judge was
    body: |
      A judge in this book is a leader and deliverer more than a magistrate. The word is *shōphəṭîm*, from *shāphaṭ*, “judge, govern”: to “act as law-giver, judge, governor,” deciding and executing law. In Judges the verb means “most often, ‘to lead,’ rather than to act as a judiciary,” and the judge of these stories is above all “a military leader.” The verse says what they did: they “delivered” Israel, *hôshîʿû*, from the verb “deliver, save,” which also gives the book its word for Othniel, the “deliverer” (*môshîaʿ*, [[Judg. 3:9]]; see the note at [[Obad. 1:21]]).

      The first word matters as much as the last. “Nevertheless” follows directly on Israel's apostasy and the LORD's anger (verses 11–15): nothing in the verse says Israel had turned back. The raising up is His; on one Latter-day Saint reading, “out of His abundant covenant love and mercy, God raises up judges.” Verse 18 adds that “the LORD was with the judge.”
    sources: [oshb-wlc, bdb, schade-broken-laws, cfm-ot-2026-22, ot-minute-judg-2, lds-scriptures]

  - ref: 18
    phrase: for it repented the LORD because of their groanings
    kind: scripture
    title: The LORD hearkened
    body: |
      Joseph Smith's revision reads, “for the Lord hearkened because of their groanings,” the only change he made in Judges (the Church's footnote has it). The reading “illustrates a change in the Lord’s actions based on the condition of the people”: He changed His course, but His “previous course had not been erroneous.” The same question, how God can be said to repent, is answered at [[Gen. 6:6]].

      What moved Him, in both readings, is Israel's groaning under oppression; the verse does not mention repentance, and Israel's crying out in Judges “does not seem to be a form of repentance, nor does this appear to be a condition for the resultant deliverance by God.”
    sources: [lds-scriptures, nyman-jst-historical, schade-broken-laws]

  - ref: 19
    phrase: corrupted themselves more than their fathers
    kind: history
    title: Each turn lower than the last
    body: |
      Verse 19 gives the cycle a direction: each time round, Israel fell further. The whole book is “a series of downward moral spirals of disobedience that progressively worsen until the book ends in civil conflict and the near annihilation of the tribe of Benjamin,” each cycle at “a lower scale of legitimate behavior than that of their predecessors.” When the LORD says, “I will deliver you no more” ([[Judg. 10:13]]), the cycles have grown worse “instead of being repaired by true repentance.” The book's last verse states where the descent ends (see [[Judg. 21:25]]).

      The pattern has a counterpart in the Book of Mormon: the Nephite history shows “a strikingly similar cycle of righteousness and apostasy,” “graphically described” in Helaman 12 ([[Hel. 12:1–26]]); it can be compared to the “pride cycle,” and one suggestion is that Nephite record keepers consciously modeled their history on Israel's.
    sources: [schade-broken-laws, ot-manual-judges-1-12, ot-minute-judg-2, lds-scriptures]

  - ref: 22
    phrase: That through them I may prove Israel
    kind: history
    title: Nations left as a test
    body: |
      The nations Joshua left are both a judgment and a test. Verses 20–21 are the judgment: because Israel transgressed the covenant, the LORD will drive out no more of them. Verse 22 is the test: through them He will “prove Israel, whether they will keep the way of the LORD.” Here the purpose of the whole cycle “was explicitly said to have been to test Israel’s faith,” and verse 23 also accounts for Israel's failure to subdue the Canaanites. Chapter 3 opens by naming the nations left “to prove Israel by them, to know whether they would hearken unto the commandments of the LORD” ([[Judg. 3:1–4]]).

      The test was not abandonment: God was never absent, and He kept working to lead His people back. On one older reading, the word “hastily” in verse 23 limits the threat: the LORD would drive out no more nations “so long as Israel persisted in its idolatry,” and whenever Israel returned to Him in true repentance He would take the promise up again.
    sources: [lds-scriptures, ot-minute-judg-2, schade-broken-laws, keil-judges]

christ: |
  The LORD who speaks at Bochim and raises up the judges is Jehovah, the premortal Christ (see [[Ex. 3:14]]). Judges 2 shows Him keeping a covenant His people break, and answering their groaning with deliverers before the text records any turning back to Him (verses 16–18). The stories of the judges are both “a warning and an encouragement,” and they show that “no matter what has led us away from Jesus Christ, He is the Redeemer of Israel and is always willing to deliver us and welcome us back as we return to Him.”

  For a disciple, the warning is in verse 10: a parent's knowledge of the Lord does not pass on by itself, and the covenant relationship with Him that the generation after Joshua lacked has to be each person's own. The encouragement is in verse 16: His deliverance begins in His own covenant love and mercy, not in the merit of those He delivers.

explore: |
  - [[Judg. 3:1–6]]: the nations left “to prove Israel,” and the cycle's first full turn in Othniel ([[Judg. 3:7–11]]).
  - [[Ps. 106:34–46]]: the period of the judges remembered in song, with the same snare, the same many deliverances, and the same “Nevertheless.”
  - [[1 Ne. 2:23–24]]: the Church's footnote at verse 22 sets the LORD's test of Israel beside the Lord's word to Nephi about the Lamanites.
