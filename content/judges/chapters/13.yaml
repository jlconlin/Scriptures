chapter: 13
title: The Angel Did Wondrously
tagline: Under the Philistines, the angel of the LORD promises a childless woman of Dan a son who will be a Nazarite from the womb, comes again at Manoah’s prayer, will not give his name, and goes up in the flame of their offering.
when: 'When the Philistines ruled Israel forty years (13:1)'

setting: |
  Judges 13 opens a new cycle with the book’s customary formula: Israel “did evil again in the sight of the LORD,” and this time the LORD gave them to the Philistines for forty years (verse 1). The Philistines held the rich lowland along the Mediterranean coast, a league of five cities (Ashdod, Gaza, Ashkelon, Gath and Ekron), each under its own “lord.” The two peoples struggled for the upper hand for many years; the note on verse 5 takes up what that means for Samson’s calling.

  The story is set in Zorah, a town first assigned to Judah ([[Josh. 15:33]]) and later settled by Danites, who had been unable to take the land given to their tribe; [[Judg. 18]] tells how the Danites went looking for land in the north. Chapters 13–16 belong to Samson, the twelfth of the judges in the Bible Dictionary’s count, whose name means “of the sun.” His is the only story in Judges that begins with the judge’s birth. Hebrews names him among those who through faith did great things ([[Heb. 11:32–33]]); what that list means for these judges is taken up at [[Judg. 11:39]].

thread: |
  The cycle’s first steps take a single verse: the evil, and the LORD giving Israel into the hand of the Philistines (verse 1). Then the story turns from the nation to one childless couple in a border town, and stays with them to the end of the chapter.

  It is a story of a visitor slowly recognized. The angel of the LORD comes first to the woman, promises her a son, lays the Nazarite’s rules on her, and says what the child will do: “begin to deliver Israel” (verses 3–5). She tells her husband that “a man of God” came, terrible to look at, and that she did not ask his name (verses 6–7). Manoah prays that the man will come back and teach them how to raise the child (verse 8); God hears him, but the visitor comes again to the woman, and when Manoah reaches him he hears nothing new, only that his wife must keep what she was told (verses 9–14).

  Manoah wants to feed his guest. He and his wife take the visitor for an ordinary man, and the narrator says plainly that Manoah “knew not that he was an angel of the LORD” (verse 16). The visitor turns the meal into a burnt offering to the LORD, will not give his name, and goes up in the flame from the rock (verses 15–20). Only then does Manoah understand, and he is afraid: “We shall surely die, because we have seen God” (verse 22). It is his wife, the one who saw the visitor first, who answers the fear with reasons (verse 23). The chapter ends with the promise kept: the son is born and named Samson, the LORD blesses him, and the Spirit of the LORD begins to stir him (verses 24–25).

sections:
  - range: '1'
    heading: Forty years under the Philistines
    plain: |
      The Israelites again did what was evil in the Lord’s sight, and the Lord handed them over to the Philistines for forty years.
  - range: 2-7
    heading: The angel comes to the woman
    plain: |
      There was a man from Zorah, of the clan of the Danites, named Manoah. His wife was unable to conceive and had no children. The angel of the Lord appeared to the woman and said to her, “You are barren and have no children, but you will conceive and give birth to a son. So be careful now: drink no wine or other strong drink, and eat nothing unclean. You will conceive and give birth to a son. No razor is to touch his head, because the boy will be a Nazarite, dedicated to God from the womb. He will begin to rescue Israel from the power of the Philistines.”

      The woman went and told her husband, “A man of God came to me. He looked like the angel of God, very awe-inspiring. I didn’t ask him where he came from, and he didn’t tell me his name. But he said to me, ‘You will conceive and give birth to a son. Now drink no wine or strong drink, and eat nothing unclean, because the boy will be a Nazarite to God from the womb to the day of his death.’”
  - range: 8-14
    heading: The angel comes again
    plain: |
      Then Manoah prayed to the Lord: “Please, Lord, let the man of God You sent come to us again and teach us what we should do for the boy who is to be born.” God heard Manoah, and the angel of God came again to the woman while she was sitting in the field; her husband Manoah was not with her. The woman ran quickly and told her husband, “The man who came to me the other day has appeared to me!”

      Manoah got up and followed his wife. When he came to the man, he asked, “Are you the man who spoke to my wife?” “I am,” he said. Manoah said, “When your words come true, what is to be the boy’s way of life, and what is he to do?” The angel of the Lord said to Manoah, “Your wife must be careful about everything I told her. She must not eat anything that comes from the grapevine, drink no wine or strong drink, and eat nothing unclean. She must keep everything I commanded her.”
  - range: 15-23
    heading: The offering and the flame
    plain: |
      Manoah said to the angel of the Lord, “Please let us keep you here while we prepare a young goat for you.” The angel of the Lord said to Manoah, “Even if you keep me here, I will not eat your food. But if you prepare a burnt offering, offer it to the Lord.” (Manoah did not know that he was the angel of the Lord.) Then Manoah asked the angel of the Lord, “What is your name, so that we can honor you when your words come true?” The angel of the Lord said to him, “Why do you ask my name? It is wonderful, beyond understanding.”

      So Manoah took a young goat with a grain offering and offered them on a rock to the Lord, and the Lord did a wonderful thing while Manoah and his wife watched. As the flame went up toward heaven from the altar, the angel of the Lord went up in the flame. When Manoah and his wife saw this, they fell face down on the ground. The angel of the Lord did not appear again to Manoah and his wife. Then Manoah realized that it had been the angel of the Lord. “We will certainly die,” he said to his wife, “because we have seen God.” But his wife said to him, “If the Lord had meant to kill us, He would not have accepted a burnt offering and a grain offering from us. He would not have shown us all these things, or let us hear such things as these now.”
  - range: 24-25
    heading: Samson is born
    plain: |
      The woman gave birth to a son and named him Samson. The boy grew, and the Lord blessed him. And the Spirit of the Lord began to stir him in Mahaneh-dan, between Zorah and Eshtaol.

notes:
  - ref: 3
    phrase: 'thou art barren, and bearest not: but thou shalt conceive, and bear a son'
    kind: scripture
    title: A birth announced to a barren woman
    body: |
      Samson’s birth is told in a pattern scripture uses again and again: a childless woman, a divine messenger, and a promised son with a mission. Sarah, Rebekah and Rachel were each barren before God gave them children, and so were Hannah and the Shunammite woman; in every case God’s promises were kept “through divine and joyous means.” Samson’s birth is sometimes classified as an annunciation scene, a story in which a divine messenger announces the miraculous birth of a destined child.

      The closest likeness is Samuel. Hannah too was barren, and she vowed her son to the LORD with the same promise the angel makes here: “there shall no razor come upon his head” ([[1 Sam. 1:11]]); the details of the two births and lives run parallel, which suggests that the two men belong to the same type of scene. Luke opens the story of Christ’s birth with one more barren couple, Zacharias and Elisabeth ([[Luke 1:7]]). These births were signs that God can keep His promises in this life as well as in eternity. Here the promise reaches past one woman’s grief: the son is for Israel under the Philistines.
    sources: [ot-minute-judg-13, sc-knowhy-705, lds-scriptures]

  - ref: 5
    phrase: the child shall be a Nazarite unto God from the womb
    kind: history
    title: A Nazarite from the womb
    body: |
      Samson’s vow is unusual in three ways: it is not his choice, it begins before he is born, and it lasts his whole life. The law of the Nazarite, who kept from the vine, the razor and the dead, is at [[Num. 6:2]], with the meaning of the uncut hair at [[Num. 6:7]]; a parent could dedicate a child to it.

      Here the rules begin with the mother. While she carries the child she is to drink no wine and eat nothing unclean (verse 4), and the angel repeats it to Manoah (verse 14). In her report the consecration runs “from the womb to the day of his death” (verse 7). Numbers 6 gives the law for a Nazarite of a set number of days; in one older reading Samson, Samuel ([[1 Sam. 1:11]]) and John the Baptist, who “shall drink neither wine nor strong drink” ([[Luke 1:15]]), were Nazarites for life. What Samson’s hair had to do with his strength is taken up at [[Judg. 16:17]].
    sources: [scripture-helps-judges, pulpit-judges, lds-scriptures]

  - ref: 5
    phrase: he shall begin to deliver Israel out of the hand of the Philistines
    kind: history
    title: Only a beginning
    body: |
      The angel promises a beginning, not a finished deliverance, and that is what Samson’s story gives. One older reading calls the words “an exact description of what Samson did”: he did not deliver Israel as the other judges did, but began to shake the Philistines’ power and prepared the way for Samuel. Judges never records the end of these forty years. Another older reading places it at Samuel’s victory over the Philistines ([[1 Sam. 7:10–13]]), and even after that the struggle went on: Philistine power was at its height when Saul died and declined only under David. Whether Samson did even what he was called to do is taken up at [[Judg. 14:3]].
    sources: [pulpit-judges, keil-judges, bd-philistines]

  - ref: 18
    phrase: Why askest thou thus after my name, seeing it is secret?
    kind: words
    title: A name that is wonderful
    body: |
      “Secret” translates *pilʾî*, an adjective meaning “wonderful, incomprehensible”; the same word describes God’s knowledge in the psalm: “Such knowledge is too wonderful for me” ([[Ps. 139:6]]). The visitor is not hiding a name so much as saying what kind of name it is: in one older reading the word “is not the proper name of the angel of the Lord, but expresses the character of his name,” a predicate belonging to God alone. That reading compares the “Wonderful” of [[Isa. 9:6]], where a related noun, *peleʾ*, is said of the promised king. The Church’s footnote sends the reader to Peniel, where the one who wrestled with Jacob also declined to give his name ([[Gen. 32:29]]); the note at [[Gen. 32:24]] sets the two scenes together.

      Who the visitor is, the chapter shows rather than states. The narrator calls him “the angel of the LORD,” and after he goes up in the flame Manoah says, “we have seen God” (verse 22); one Latter-day Saint reading concludes from the scene that one of the visitors “was God Himself.” Another older reading goes further, hearing in the word “the very character that is given to Jesus Christ” in Isaiah 9:6. The Church’s *Old Testament Student Manual*, which prints that line, judges it “doubtful that the angel was the Lord Himself” and takes him for one who spoke in the Lord’s name. Faithful readers differ here; the note at [[Judg. 6:22]] reads the angel at Gideon’s call as the LORD Himself.
    sources: [bdb, keil-judges, ot-minute-judg-13, clarke-judges, ot-manual-judges-13-21, lds-scriptures]

  - ref: 19
    phrase: the angel did wondrously
    kind: history
    title: A meal that became an offering
    body: |
      Manoah offers his guest a meal, and the visitor turns it into worship. He will not eat Manoah’s food, and tells him that if he prepares a burnt offering it must be offered “unto the LORD” (verse 16). So Manoah lays the kid and the grain offering on a rock. In one older reading, verse 20 calls the rock an altar because the angel had sanctified it by accepting the sacrifice by a miracle, and the miracle is a flame that comes from the rock, as it did at Gideon’s sacrifice ([[Judg. 6:21]]), and the angel goes up in it; Manoah and his wife fall on their faces in worship.

      “Did wondrously” is *maphliʾ*, a participle that, said of God, means “working wonders.” It comes from the same root as the name the visitor has just withheld in verse 18, and one older reading draws the link: “He acted according to his name; he, being wonderful, performed wonderful things.”
    sources: [keil-judges, bdb, clarke-judges]

  - ref: 23
    phrase: If the LORD were pleased to kill us, he would not have received a burnt offering
    kind: history
    title: The wife answers Manoah’s fear
    body: |
      Manoah’s fear that whoever sees God must die is the fear Gideon felt after the fire from the rock; the note at [[Judg. 6:22]] takes it up. His cry shows that at last the couple understood whose presence they had been in. What is new here is the answer, and it comes from his wife. She reasons from what has happened: the LORD accepted their offering, He showed them the wonder, and He told them of a son to come. A God who meant to kill them would have done none of that.
    sources: [ot-minute-judg-13]

  - ref: 25
    phrase: the Spirit of the LORD began to move him at times
    kind: words
    title: The Spirit began to stir him
    body: |
      “Move” translates *pāʿam*, to thrust or impel, so the line means that the Spirit of the LORD “began to impel him.” In its passive form the same verb describes a disturbed spirit, as Pharaoh’s was after his dreams ([[Gen. 41:8]]).

      “The camp of Dan” is a place name, Mahaneh-dan, which [[Judg. 18:12]] explains. What the Spirit of the LORD gave Samson, and what it did not, is taken up at [[Judg. 14:6]].
    sources: [bdb]

christ: |
  The visitor who announced Samson’s birth, accepted Manoah’s offering and went up in its flame was, on one of the two readings in the note on verse 18, the LORD Himself, whom Latter-day Saints know as the premortal Jesus Christ (see [[Ex. 3:14]]). After the line of barren women that includes Samson’s mother, Luke begins his account of Christ’s birth with another barren couple, and the Child Mary bore came as the sign that deliverance from all sins has been given (see the note on verse 3). Samson, whom the LORD blessed as he grew (verse 24), later turned to all sorts of misconduct, while Manoah prayed to be taught what to do for the child (verse 8). One lesson the book’s imperfect judges can teach is that what God gives can be preserved and developed, or misused and lost, and that holds for a disciple’s gifts now.

explore: |
  - **Barren women and promised sons.** [[Gen. 18:9–14]], [[1 Sam. 1:9–20]] and [[Luke 1:5–17]].
  - **Asking the name.** [[Gen. 32:24–30]] beside verses 17–18.
  - **Fire from the rock.** [[Judg. 6:19–24]] beside verses 15–23.
  - **The story goes on.** [[Judg. 14]] begins Samson’s life among the Philistines.

