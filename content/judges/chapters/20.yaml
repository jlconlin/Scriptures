chapter: 20
title: Knit Together as One Man
tagline: The tribes gather at Mizpeh to hear the Levite, demand the men of Gibeah, and go to war when Benjamin will not give them up; twice beaten, they weep and fast before the ark, and the third time Benjamin is all but destroyed.
when: 'When there was no king in Israel, while Phinehas stood before the ark (verse 28)'

setting: |
  The chapter is the answer to [[Judg. 19:29–30]]. A Levite's concubine had been abused to death by men of Gibeah, and her husband had cut up her body and sent the pieces through the tribes. Now the tribes come to hear him. This is the second of the two narratives that close the book and show “the tendency to idolatry and lawlessness” of the age; the first, Micah's shrine and Dan's migration, fills chapters 17–18.

  Gibeah belonged to Benjamin, whose name means “son of the right hand.” It was a warlike tribe, and it would give Israel its first king, Saul. The story is not dated, but one detail ties it to a lifetime: Phinehas, Aaron's grandson, is high priest (verse 28; see the note on verse 27).

  In the book's own movement this is the bottom. Its cycles of disobedience grow worse until the book “ends in civil conflict and the near annihilation of the tribe of Benjamin.” Later scripture remembers it. Hosea measures Israel's sin by “the days of Gibeah” ([[Hos. 9:9]]; [[Hos. 10:9]]), and Mormon's account of the battles for Desolation ([[Morm. 3:4–16]]; [[Morm. 4:1–5]]) evokes this war (see the note on verse 34).

thread: |
  The chapter is built on a phrase. The congregation gathers “as one man” (verse 1), rises “as one man” (verse 8) and stands against Gibeah “knit together as one man” (verse 11). It is a unity the tribes have seldom shown in the book, and it comes against one of Israel's own tribes.

  The assembly at Mizpeh hears the Levite (verses 1–7), vows not to go home until Gibeah is punished, and sends to Benjamin for the guilty men (verses 8–13). Benjamin refuses and musters at Gibeah (verses 14–17).

  The middle of the chapter is three inquiries of the LORD and three answers (verses 18–28). Israel asks who should go first and is told Judah; it loses twenty-two thousand men. It weeps, asks whether to go up again against “Benjamin my brother,” and is told to go; it loses eighteen thousand more. Then the whole people weeps, fasts and offers sacrifice before the ark, asks whether to go up “or shall I cease,” and only this time is promised victory.

  The third battle is an ambush (verses 29–48). The narrator gives the result first, “the LORD smote Benjamin before Israel” (verse 35), and then goes back over the details, a habit of Hebrew history-writing in one older reading. Benjamin is drawn away from Gibeah, the city is taken and burned, and twenty-five thousand Benjamites fall. Six hundred escape to the rock Rimmon (verse 47). Israel then goes through Benjamin's towns, men and beasts, and burns them (verse 48), treating a brother tribe, in that older reading, as the Canaanites under the ban had been treated: a vengeful civil war that left only six hundred men of a tribe alive. How the Church reads the wars of the Old Testament is explained at [[Josh. 6:21]]. What the tribes then do to keep Benjamin from dying out is chapter 21.

sections:
  - range: 1-11
    heading: The assembly at Mizpeh
    plain: |
      All the Israelites came out, from Dan in the north to Beer-sheba in the south and from the land of Gilead, and the whole community gathered as one before the Lord at Mizpeh. The leaders of all the tribes took their places in the assembly of God's people, four hundred thousand armed foot soldiers. (The Benjamites heard that the Israelites had gone up to Mizpeh.) The Israelites said, “Tell us how this evil thing happened.” The Levite, the husband of the murdered woman, answered: “I came with my concubine to Gibeah in Benjamin to spend the night. The men of Gibeah came after me and surrounded the house at night. They meant to kill me, and they assaulted my concubine until she died. I took her body, cut it in pieces and sent it through every part of Israel's inheritance, because they have done a lewd and shameful thing in Israel. Now, all of you Israelites, speak up and decide what to do.”

      All the people rose as one and said, “None of us will go home to his tent or his house. This is what we will do to Gibeah: we will go against it as the lot directs. We will take ten men out of every hundred in all the tribes, a hundred out of every thousand and a thousand out of every ten thousand, to bring supplies for the army, so that when it reaches Gibeah of Benjamin it can repay them for all the outrage they have done in Israel.” So all the men of Israel gathered against the town, united as one man.
  - range: 12-17
    heading: Benjamin refuses
    plain: |
      The tribes of Israel sent men all through the tribe of Benjamin, saying, “What is this evil that has been done among you? Now hand over those wicked men in Gibeah, so that we may put them to death and purge the evil from Israel.” But the Benjamites would not listen to their fellow Israelites. They came together from their towns to Gibeah to go out and fight against Israel. That day the Benjamites mustered twenty-six thousand swordsmen from their towns, besides seven hundred chosen men from Gibeah. Among all these troops were seven hundred chosen men who were left-handed, each of whom could sling a stone at a hair and not miss. The men of Israel, apart from Benjamin, mustered four hundred thousand swordsmen, all of them men of war.
  - range: 18-28
    heading: Two defeats and three inquiries
    plain: |
      The Israelites went up to the house of God (or Bethel) and asked God, “Which of us shall go up first to fight the Benjamites?” The Lord said, “Judah first.” In the morning the Israelites camped against Gibeah and drew up their lines. The Benjamites came out of Gibeah and cut down twenty-two thousand Israelites that day. But the Israelites took heart and formed their lines again where they had stood the first day. (They had gone up and wept before the Lord until evening and asked Him, “Shall we go up again to fight our brother Benjamin?” and the Lord had said, “Go up against him.”) So on the second day they came near, and Benjamin came out of Gibeah and cut down eighteen thousand more, all of them swordsmen.

      Then all the Israelites, the whole people, went up to the house of God. They wept and sat there before the Lord, fasted that day until evening, and offered burnt offerings and peace offerings before Him. The Israelites asked the Lord (the ark of God's covenant was there in those days, and Phinehas son of Eleazar, the son of Aaron, served before it), “Shall we go out again to fight our brother Benjamin, or shall we stop?” The Lord said, “Go up, for tomorrow I will give them into your hand.”
  - range: 29-48
    heading: The ambush and the destruction of Benjamin
    plain: |
      Israel set men in ambush all around Gibeah. On the third day they went up against the Benjamites and drew up their lines at Gibeah as before. The Benjamites came out to meet them and were drawn away from the town. As before, they began to kill some of the Israelites on the roads, one going up to Bethel and the other to Gibeah, about thirty men in the open field. The Benjamites said, “We are beating them as before.” But the Israelites had said, “Let us retreat and draw them away from the town onto the roads.” All the men of Israel moved from their places and formed up at Baal-tamar, and the men in ambush burst out of their hiding places near Gibeah. Ten thousand chosen men from all Israel came against Gibeah, and the fighting was fierce, but the Benjamites did not know that disaster was close. The Lord struck Benjamin down before Israel, and that day the Israelites killed twenty-five thousand one hundred Benjamites, all swordsmen.

      This is how the Benjamites saw that they were beaten. The men of Israel had given ground, trusting in the ambush they had set near Gibeah. The ambush rushed into Gibeah, spread through it and put the whole town to the sword. They had agreed on a signal: a great cloud of smoke rising from the town. When the Israelites fell back in the battle, Benjamin began to kill them, about thirty men, thinking, “They are beaten before us as in the first battle.” But when the column of smoke began to rise from the town, the Benjamites looked back and saw the whole town going up in flames to the sky. Then the men of Israel turned on them, and the Benjamites were terrified, because they saw that disaster had come on them. They fled before Israel toward the wilderness, but the battle caught up with them, and the men coming out of the towns cut them down in the midst of it. They surrounded the Benjamites, chased them and easily trampled them down opposite Gibeah on the east. Eighteen thousand Benjamites fell, all of them valiant men. The rest turned and fled toward the wilderness to the rock of Rimmon; the Israelites cut down five thousand more on the roads, pressed after them as far as Gidom and killed two thousand more. So twenty-five thousand Benjamite swordsmen fell that day, all of them valiant men. But six hundred men turned and fled into the wilderness to the rock of Rimmon, and stayed there four months. Then the men of Israel turned back against the Benjamites and put them to the sword, the people of every town and the animals and everything they found, and they set fire to every town they came to.

notes:
  - ref: 1
    phrase: the congregation was gathered together as one man, from Dan even to Beer-sheba
    kind: history
    title: All Israel as one man
    body: |
      Here the whole nation acts together, and it acts against one of its own tribes. Through most of the period the tribes did not: unless “a formidable enemy compelled them to act together, their unity seldom found practical expression and was often overborne by local jealousies.” Here the tribes come from Dan, the northern edge of the land, to Beer-sheba in the south, and from Gilead across the Jordan (see the guide [The Land](/old-testament/guides/the-land/#regions)). Benjamin is not there; it only “heard” of the meeting (verse 3).

      They gather “unto the LORD in Mizpeh,” the “watchtower” where the tribes meet again in chapter 21. “Unto the LORD” need not mean that the ark or a sanctuary was there. In one older reading it means that the assembly sat as a court in the LORD's name, to hear the charge and pass sentence, which is what verses 3–10 describe.
    sources: [bd-judges, bd-mizpah, keil-judges]

  - ref: 5
    phrase: thought to have slain me
    kind: history
    title: The Levite tells his story
    body: |
      The Levite's account to the assembly is not quite the story chapter 19 tells. In chapter 19 the men of Gibeah demanded the man, not his life ([[Judg. 19:22]]), and it was the Levite himself who “brought her forth unto them” ([[Judg. 19:25]]). Here he says they meant to kill him, says nothing of putting her out, and moves straight to her death and to what he did with her body (verses 5–6).

      The older commentaries weigh the difference in different ways. One reads “thought to have slain me” as his own conclusion from what was done to his wife, since the men had said no such thing. Another grants that he was likely in fear of his life, but holds that he “shaped his narrative so as to conceal his own cowardice.” The assembly hears only his version and acts on it at once (verse 8). What was done at Gibeah, and why he sent the pieces through Israel, is explained at [[Judg. 19:22]] and [[Judg. 19:29]].
    sources: [lds-scriptures, keil-judges, pulpit-judges]

  - ref: 13
    phrase: deliver us the men, the children of Belial, which are in Gibeah, that we may put them to death, and put away evil from Israel
    kind: history
    title: Deliver us the men
    body: |
      The war begins with a demand in the words of the law, and Benjamin refuses it. The tribes ask for the guilty men only, the “children of Belial” (the phrase is explained at [[Deut. 13:13]]), and their words are the law's: “put away the evil from Israel” is Deuteronomy's charge where it sentences the guilty to death ([[Deut. 17:12]]; [[Deut. 22:22]]). The tribes are asking Benjamin to let the law take its course on the guilty men, not to make war on the tribe.

      Benjamin “would not hearken to the voice of their brethren” and gathered at Gibeah instead (verses 13–14); the text gives no reason. The strain among the tribes that the book's conduct had been building comes out in open war in chapters 20–21. The Bible tells the cost plainly; how the Church reads such wars is at [[Josh. 6:21]].
    sources: [lds-scriptures, schade-broken-laws]

  - ref: 26
    phrase: wept, and sat there before the LORD, and fasted that day until even
    kind: history
    title: Three times they asked
    body: |
      Israel won only after its third inquiry, and the three are not alike. The first asks only which tribe should lead, and the LORD names Judah, as at the opening of the book ([[Judg. 1:1–2]]); the second comes with weeping. Only the third comes with the whole people fasting and sacrificing, asks whether to go up “or shall I cease,” and is answered with a promise, “to morrow I will deliver them into thine hand.”

      The text does not say why the first two answers led to defeat. One older reading finds the reason in the order of the inquiries: Israel went to war in “great confidence in their own might and power,” asked only who should lead, and the answer “Go up against him” “gave no promise as to the result,” because they had not asked for one. On that reading the fasting was the sign that the people had at last humbled themselves, and the peace offerings were offerings of supplication, not thanks. A Latter-day Saint study sees in verses 23–26 “a rare display of contrition” at one of the people's lowest moments, and the Lord answering His children's weeping and pleading.
    sources: [keil-judges, schade-broken-laws]

  - ref: 27
    phrase: for the ark of the covenant of God was there in those days
    kind: history
    title: The ark, and Phinehas before it
    body: |
      This is the only place in Judges that names the ark of the covenant, and with it the high priest, and the two together tell the reader roughly when the story happened. “The house of God” where Israel inquires (verses 18, 26) may be the town of Bethel, as the Church's footnote to verse 18 allows, and the ark “seems to have been at Bethel” at the start of the period and at Shiloh by its close. The footnote to verse 26 points instead to the tabernacle pitched at Shiloh ([[Josh. 18:1]]), and the older commentaries divide the same way. One has the ark brought from Shiloh to Bethel for the war, a town on Benjamin's border hallowed by the LORD's appearances to Jacob ([[Gen. 28:19]]; [[Gen. 35:15]]), with Phinehas asking the LORD before it by the Urim and Thummim. Another holds that Bethel does not fit a tabernacle that stood at Shiloh under Phinehas. The text does not settle where they were; it says only that they asked before the ark, through the high priest.

      Phinehas is Aaron's grandson, the priest whose zeal at Peor turned away the plague ([[Num. 25:7–11]]) and who was sent to the tribes beyond Jordan in Joshua's day ([[Josh. 22:13–32]]). If he is still the high priest, these events fall within his lifetime, though the book tells them last. The setting of [[Judg. 17]] points to the same detail.
    sources: [lds-scriptures, bd-judges, keil-judges, bd-phinehas, pulpit-judges]

  - ref: 34
    phrase: 'and the battle was sore: but they knew not that evil was near them'
    kind: scripture
    title: Mormon remembers Gibeah
    body: |
      Mormon appears to tell the fall of the Nephites' stronghold at Desolation in the words of this war. In both accounts there are three battles: the smaller side beats off two assaults by a larger army ([[Judg. 20:20–25]]; [[Morm. 3:7–8]]) and is drawn out of its stronghold in the third ([[Judg. 20:29–35]]; [[Morm. 4:1–2]]). Both peoples “gather themselves together” to one city (verse 14; [[Morm. 3:5]]), both go “out” to the third battle (verse 31; [[Morm. 4:1]]), and both third battles are “sore” (verse 34; [[Morm. 4:2]]). Israel's unwise oath and the cry that a tribe was “cut off” (21:1–7) have their counterparts in the Nephites' oath to “cut off” the Lamanites ([[Morm. 3:10–15]]).

      The phrase in this verse gives the parallel its point. “Evil” here may be the disaster about to strike Benjamin, but a commentator on Judges quoted in the study reads it as also saying that “the forces of Israel, which are striking the Benjaminites down, are themselves evil,” used by the LORD to punish a worse evil. Mormon says of his own people's ruin, “it is by the wicked that the wicked are punished” ([[Morm. 4:5]]). Read this way, Mormon underscores how far his people had fallen by telling their end in the language of Israel's worst days. The study offers these as allusions, not as a quotation Mormon announces.
    sources: [sc-evidence-302]

christ: |
  The LORD whom Israel asked before the ark is Jehovah, the premortal Jesus Christ (see [[Ex. 3:14]]). Even at one of their lowest moments He answered when His people wept, fasted and pleaded before Him, and He did not give up on them; but neither did His love cancel what their sins had set in motion. That is still how He deals with His people: He hears those who come before Him in contrition, however low they have fallen, and His love does not leave them, though it does not take away the consequences of what they have done.

explore: |
  - **The whole story.** [[Judg. 19]] (Gibeah), this chapter, and [[Judg. 21]] (the wives for Benjamin), read together.
  - **The days of Gibeah.** [[Hos. 9:9]] and [[Hos. 10:9]], where a prophet measures Israel's sin by this war.
  - **Two last battles.** [[Morm. 3:4–16]] and [[Morm. 4:1–5]] beside verses 18–35; Scripture Central's Book of Mormon Evidence “Three Battles and the Book of Judges” sets them side by side.
  - **The beginning and the end.** [[Judg. 1:1–2]] beside verse 18: the same question and answer, first against the Canaanites, last against a brother tribe.

