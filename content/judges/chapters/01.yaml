chapter: 1
title: Who Shall Go Up for Us?
tagline: After Joshua's death the tribes ask the LORD who will fight first; Judah goes up and takes the hill country, and then, tribe by tribe, the chapter lists the Canaanite towns Israel did not drive out.
when: 'After the death of Joshua'

setting: |
  Judges opens where Joshua closed, with Joshua dead ([[Josh. 24:29]]), and it is in one sense a continuation of that book and in another a retelling of the conquest. Joshua's summary is “So Joshua took the whole land” ([[Josh. 11:23]]); Judges 1 shows Canaanite towns still standing in nearly every tribe's lot, a contrast sharp enough that the frame of Judges “appears to contradict the historical portrait given in the book of Joshua.” Put plainly, some of the tribes failed to drive out all the inhabitants, as they had been commanded. Joshua already sets its own two pictures of the land side by side, and the note at [[Josh. 13:1]] reads them; Judges does not harmonize them either, but in the next two chapters it gives reasons of its own: a league made against the LORD's word ([[Judg. 2:1–3]]), and nations left “to prove Israel” ([[Judg. 3:1]]; [[Judg. 2:20–23]]).

  The chapter begins the book's introduction (1:1–3:6), which comes before the stories of the judges (3:7–16:31) and two closing narratives (17–21). The book was compiled long after the events it records: 18:30 refers to the captivity of the ten tribes. It gives no dates; the guide [The Conquest, the Judges, and One Kingdom](/old-testament/guides/the-conquest-judges-and-kingdom/#rulers) has the one dating the Church's pages offer.

thread: |
  The chapter starts with a question put to the LORD and an answer that sounds like Joshua's day: “Judah shall go up: behold, I have delivered the land into his hand” (verse 2). Then it measures how far each tribe went.

  Judah goes furthest. Bezek, Jerusalem, Hebron, Debir, Zephath and three Philistine cities fall, and the language is the language of Joshua's wars: at Zephath “utterly destroyed” is the verb of the *ḥērem*, the ban, which gives Hormah its name (verse 17; see [[Num. 21:3]]). Caleb, Othniel and Achsah (verses 10–15, 20) are told again from [[Josh. 15:13–19]], where the notes are. Even Judah's summary, though, ends with “could not” (verse 19).

  From verse 21 the record is of what was not done. Benjamin leaves the Jebusites in Jerusalem; the house of Joseph takes Bethel through a bargain with one man; then Manasseh, Ephraim, Zebulun, Asher and Naphtali leave town after town. Where they were strong enough they made the Canaanites tributary, putting them to forced labor (verses 28, 30, 33; see [[Josh. 17:13]]), but they did not drive them out. Dan is pushed back into the hills. The list of names a reader is tempted to skim is the point: the land the LORD said He had delivered is, by the chapter's end, shared with the peoples Israel was to drive out, and chapter 2 opens with what the LORD said about it.

sections:
  - range: 1-21
    heading: Judah goes up first
    plain: |
      After Joshua died, the Israelites asked the LORD, “Which of us should go up first to fight the Canaanites?” The LORD answered, “Judah will go up. I have given the land into his hand.” Judah said to his brother Simeon, “Come with me into my allotted land and we will fight the Canaanites, and I will go with you into yours.” So Simeon went with him. Judah attacked, the LORD gave them the Canaanites and Perizzites, and they killed ten thousand men at Bezek. There they found Adoni-bezek and fought him. He fled, but they caught him and cut off his thumbs and big toes. Adoni-bezek said, “Seventy kings with their thumbs and big toes cut off used to pick up scraps under my table. God has paid me back for what I did.” They brought him to Jerusalem, and he died there.

      The people of Judah had attacked Jerusalem, taken it, put it to the sword and set it on fire. Afterward they went down to fight the Canaanites in the hill country, the south and the lowlands. They attacked Hebron (once called Kirjath-arba) and killed Sheshai, Ahiman and Talmai. From there they went against Debir (once called Kirjath-sepher). Caleb said, “Whoever attacks Kirjath-sepher and takes it, I will give him my daughter Achsah as his wife.” Othniel son of Kenaz, Caleb's younger brother, took it, and Caleb gave him Achsah. When she came to him, she urged him to ask her father for a field. She got down from her donkey, and Caleb asked her, “What do you want?” She said, “Give me a blessing. You have given me land in the south; give me springs of water too.” Caleb gave her the upper and the lower springs.

      The descendants of the Kenite, Moses' father-in-law, went up with the people of Judah from the city of palm trees into the wilderness of Judah south of Arad, and settled among the people. Judah went with Simeon his brother, struck the Canaanites of Zephath and destroyed it completely, and the city was named Hormah. Judah also took Gaza, Askelon and Ekron, each with its territory. The LORD was with Judah, and Judah took the hill country, but could not drive out the people of the valley, because they had iron chariots. Hebron was given to Caleb, as Moses had said, and he drove out the three sons of Anak. The Benjaminites did not drive out the Jebusites who lived in Jerusalem, and the Jebusites live there with the Benjaminites to this day.
  - range: 22-26
    heading: The house of Joseph at Bethel
    plain: |
      The house of Joseph also went up against Bethel, and the LORD was with them. They sent men to scout Bethel, which used to be called Luz. The spies saw a man coming out of the city and said to him, “Show us the way into the city, and we will treat you kindly.” He showed them, and they put the city to the sword, but they let the man and all his family go. He went to the land of the Hittites, built a city and named it Luz, and that is its name to this day.
  - range: 27-36
    heading: The towns not taken
    plain: |
      Manasseh did not drive out the people of Beth-shean, Taanach, Dor, Ibleam or Megiddo, or their villages; the Canaanites were determined to stay in that land. When Israel grew strong, they put the Canaanites to forced labor but did not drive them out completely. Ephraim did not drive out the Canaanites of Gezer, who went on living among them. Zebulun did not drive out the people of Kitron or Nahalol; the Canaanites lived among them and were put to forced labor. Asher did not drive out the people of Accho, Zidon, Ahlab, Achzib, Helbah, Aphik or Rehob; the Asherites lived among the Canaanites, because they did not drive them out. Naphtali did not drive out the people of Beth-shemesh or Beth-anath, but lived among the Canaanites, though those two towns were put to forced labor for them. The Amorites pushed the Danites back into the hill country and would not let them come down into the plain. The Amorites held on in Mount Heres, Aijalon and Shaalbim, but the house of Joseph grew strong over them and put them to forced labor. The Amorites' border ran from the ascent of Akrabbim, from the rock, and upward.

notes:
  - ref: 1
    phrase: the children of Israel asked the LORD
    kind: history
    title: A question for the LORD, and no Joshua
    body: |
      The tribes take their first decision to the LORD because there is no one else to take it to: Joshua had appointed no successor, so the book opens not on a leader but on a question, who will go up for us?

      The verse does not say how they asked. On one older reading it was done “most likely at the sanctuary, through the medium of the priest.” Another older reading hears in the phrase the inquiry Moses was given for Joshua's own day, when Eleazar the priest would “ask counsel for him after the judgment of Urim before the LORD” ([[Num. 27:21]]), and observes that from here on inquiring of the LORD comes more often; Israel does it three times in the war against Benjamin at the end of the book ([[Judg. 20:18]], 23, 27).

      The answer comes at once and echoes the LORD's promises before Jericho and Ai ([[Josh. 6:2]]; [[Josh. 8:1]]). He speaks of the gift as already made; the rest of the chapter shows how much of it the tribes took up.
    sources: [schade-broken-laws, cambridge-judges, keil-judges]

  - ref: 7
    phrase: as I have done, so God hath requited me
    kind: history
    title: Adoni-bezek’s own verdict
    body: |
      The captured king reads his punishment as God's justice: he had done the same to seventy kings, and now it was done to him. Mutilating captives was a practice “common among other ancients,” meant to frighten other enemies, and Israel apparently took it up here.

      The text records the king's words and adds no verdict of its own. The Latter-day Saint reading is cautious: in these battles “we begin to see inhumane treatment inflicted upon their enemies,” and “Israel’s adoption of such behavior here perhaps transgresses God’s approval.” A scholar quoted in the same study takes the treatment to be likely an application of the law of retaliation, eye for eye and tooth for tooth, yet notes that Israel had “actually adopted a Canaanite ethic,” taking its model for treating captives from the people of the land rather than from the LORD. Mutilation was restricted in the law of Moses “with rare exceptions,” and this treatment may have broken it. How the Church reads the wars of the conquest is at [[Josh. 6:21]].
    sources: [ot-manual-judges-1-12, schade-broken-laws]

  - ref: 16
    phrase: the children of the Kenite, Moses’ father in law
    kind: history
    title: Moses’ in-laws go up with Judah
    body: |
      The family Moses married into comes into the land with Judah. The Kenites were probably a Midianite tribe descended from Abraham through Keturah, and Moses' marriage to the daughter of Jethro, “a prince and priest of Midian,” was “a cause of the long-standing friendship between the Kenites and Israelites.” Moses had asked Hobab to come with Israel, promising, “what goodness the LORD shall do unto us, the same will we do unto thee” ([[Num. 10:32]]); here the family has come, out of “the city of palm trees,” the name [[Deut. 34:3]] gives Jericho, and settles among the people south of Arad. Which man bore the title “father in law” is taken up at [[Num. 10:29]].

      The family returns in chapter 4, where Heber the Kenite has moved north and his wife Jael kills Sisera ([[Judg. 4:11]]; [[Judg. 4:21]]).
    sources: [bd-kenites, lds-scriptures]

  - ref: 19
    phrase: but could not drive out the inhabitants of the valley, because they had chariots of iron
    kind: words
    title: The LORD with Judah, and a limit
    body: |
      The verse puts the LORD's presence and Judah's limit in one sentence, and a reader asks how both can be true. The Hebrew behind “could not drive out” is literally “for (he was) not for driving out,” “a most unusual construction”; two Hebrew manuscripts and the ancient versions read “was not able,” which is how the King James renders it. One verb carries both halves: Judah took possession of the hill country, and it did not dispossess the people of the plain. That plain was the lowland and the coast, Philistine country, and its chariots were probably plated or studded with iron.

      The chariots are the reason the verse gives. Beneath it lies another: “The real reason for their failure, however, was that they had lost the power of the Lord through their lack of faith and by their disobedience.” Joshua had told the house of Joseph that they would drive out the Canaanites “though they have iron chariots” ([[Josh. 17:18]]; the note there sets the promise beside the law of war), and in the next chapter the LORD's messenger gives His own account of why the nations remained ([[Judg. 2:1–3]]).
    sources: [cambridge-judges, keil-judges, ot-manual-judges-1-12]

  - ref: 21
    phrase: the children of Benjamin did not drive out the Jebusites that inhabited Jerusalem
    kind: history
    title: Jerusalem taken, and the Jebusites still there
    body: |
      Verse 8 says Judah took Jerusalem and burned it; this verse says the Jebusites still live there. Jerusalem lay in Benjamin's allotted land ([[Josh. 18:28]]), and Judah's attack did not leave Israel in possession. David took the city at last ([[2 Sam. 5:6–9]]); until then Jebus was “a hill fortress, which maintained its independence.” In the meantime Israel counted it a foreign town: in chapter 19 the Levite will not lodge there because it is “the city of a stranger, that is not of the children of Israel” ([[Judg. 19:12]]).

      Joshua tells the same of Judah, and the note at [[Josh. 15:63]] discusses what “unto this day” says about when the words were written.
    sources: [bd-jebus, lds-scriptures]

  - ref: 24
    phrase: we will shew thee mercy
    kind: words
    title: Mercy for the man of Luz
    body: |
      The spies offer the man of Luz the bargain Rahab made at Jericho, and in the same word. “Mercy” here is *ḥesed*, the word the King James renders “kindness” in Rahab's request: “since I have shewed you kindness, that ye will also shew kindness unto my father’s house” ([[Josh. 2:12]]). One older reading compares the two stipulations, and sets the sparing of the man “and all his family” (verse 25) beside the sparing of Rahab and her kindred ([[Josh. 6:25]]). “The entrance into the city” is not the gate but the place where attackers could most easily get in.

      The two stories end differently. Rahab “dwelleth in Israel even unto this day” ([[Josh. 6:25]]); the man of Luz goes to the land of the Hittites and builds another Luz (verse 26).
    sources: [biblehub-interlinear, cambridge-judges]

  - ref: 32
    phrase: the Asherites dwelt among the Canaanites
    kind: history
    title: Who dwelt among whom
    body: |
      The list turns its words around, and the turn shows who held the land. Of Ephraim and Zebulun the text says the Canaanites dwelt “among them” (verses 29–30); of Asher, that the Asherites dwelt “among the Canaanites.” On one older reading the change is deliberate. Seven of Asher's twenty-two towns, Acco and Sidon among them, stayed in Canaanite hands, and the wording is changed “to show that the Canaanites held the upper hand”; for the same reason the words “became tributaries” are missing for Asher. Naphtali too “dwelt among the Canaanites” (verse 33).

      The list then reaches Dan, which does not even live among the Canaanites: the Amorites force it back out of the plain into the hills (verse 34). The tribe's move north is told in a verse at [[Josh. 19:47]] and at length in [[Judg. 18]].
    sources: [keil-judges]

christ: |
  The LORD who answers Israel's question is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). He gives the land before the battle, “I have delivered the land into his hand” (verse 2), and the chapter says twice that He was with those who went up (verses 19, 22). Where the tribes stopped, He names what it will cost: the nations left “shall be as thorns in your sides, and their gods shall be a snare unto you” ([[Judg. 2:3]]). The psalmist tells how it came true: “They did not destroy the nations, concerning whom the LORD commanded them: But were mingled among the heathen, and learned their works” ([[Ps. 106:34–35]]).

  The Canaanites left in the land were the ones whose beliefs and worship drew Israel into breaking its covenants and losing the Lord's protection. What a disciple lets stay rather than drive out does not remain at the edges either; in the psalm's words it becomes in time “a snare” ([[Ps. 106:36]]). The Lord who answered when the tribes asked is the Redeemer who, as the book goes on to show, delivers His people each time they turn back to Him.

explore: |
  - [[Josh. 13:1–6]] and [[Josh. 15:63]]: Joshua's own two pictures of the land.
  - [[Judg. 2:1–5]] and [[Judg. 2:20–3:4]]: the LORD's reasons for the nations left.
  - [[Ps. 106:34–39]]: the psalmist's reading of the same failure.
  - [[Josh. 15:13–19]]: Caleb, Othniel and Achsah, told first.
  - [[Judg. 18]]: where Dan went.

