chapter: 11
title: I Have Opened My Mouth unto the LORD
tagline: Gilead’s elders call home the son they drove out; Jephthah argues Israel’s right to the land before the LORD the Judge, defeats Ammon, and keeps a vow that costs him his only child.
when: 'When the children of Ammon made war against Israel (verse 4), in Gilead, east of the Jordan'

setting: |
  Chapter 10 left Israel in the worst place the book has yet reached. They had served the gods of every neighbouring people, the LORD had sold them to the Philistines and the Ammonites, and when they cried to Him He answered, “I will deliver you no more” ([[Judg. 10:13]]). They put away the strange gods, and “his soul was grieved for the misery of Israel” ([[Judg. 10:16]], where the repentance has its note). Then the Ammonites camped in Gilead, and the leaders of Gilead asked one another who would begin the fight, promising that he would be “head over all the inhabitants of Gilead” ([[Judg. 10:18]]).

  Chapter 11 answers that question. The Ammonites, a people descended from Lot and settled east of Gilead, “in the time of the Judges laid claim to the Israelite settlements in Gilead” and were driven back by Jephthah. His story runs into chapter 12, where the Ephraimites quarrel with him and the word “Shibboleth” is tested ([[Judg. 12:6]]). He is chiefly known for a rash vow (verses 30–40). The guide [The Conquest, the Judges, and One Kingdom](/old-testament/guides/the-conquest-judges-and-kingdom/#rulers) places him among the other judges.

thread: |
  This time the cycle’s deliverer is not said to be raised up by the LORD; he is fetched by the elders, the son of a harlot whom his brothers had driven out (verses 1–3). Gilead turns to him in its distress, and still it is the LORD who gives the victory through him (verse 32). The step of the cycle is the same as at [[Judg. 3:9]], but the hand that picks the man is human, and the chapter follows what that man does with his words.

  Words carry the whole chapter. Jephthah bargains with the elders, and the bargain is sealed when he “uttered all his words before the LORD in Mizpeh” (verse 11). He sends the king of Ammon a long argument from Israel’s history and closes it by asking the LORD to judge between them (verses 12–27); the king “hearkened not unto the words” (verse 28). Then the Spirit of the LORD comes upon him, and before the battle he adds a vow of his own (verses 29–31). The LORD gives the victory (verse 32), and the chapter ends with the vow coming home: “I have opened my mouth unto the LORD, and I cannot go back” (verse 35), and his daughter’s answer, “do to me according to that which hath proceeded out of thy mouth” (verse 36).

sections:
  - range: 1-3
    heading: The son who was driven out
    plain: |
      Jephthah of Gilead was a mighty warrior. He was the son of a prostitute, and Gilead was his father. Gilead’s wife also bore him sons, and when they grew up they drove Jephthah out, telling him, “You will not inherit anything in our father’s house, because you are the son of another woman.” So Jephthah fled from his brothers and lived in the land of Tob, where a band of worthless men gathered around him and went out with him.
  - range: 4-11
    heading: The elders bring him home
    plain: |
      Some time later the Ammonites made war on Israel. When they did, the elders of Gilead went to bring Jephthah back from the land of Tob. “Come and be our commander,” they said, “so that we can fight the Ammonites.” Jephthah answered, “Didn’t you hate me and drive me out of my father’s house? Why come to me now, when you are in trouble?” The elders said, “That is why we have turned to you now: come with us, fight the Ammonites, and you will be head over all the people of Gilead.” Jephthah said, “If you bring me home to fight the Ammonites and the LORD gives them to me, will I be your head?” The elders replied, “The LORD is witness between us; we will do as you say.” So Jephthah went with them, and the people made him their head and commander, and Jephthah repeated all his terms before the LORD at Mizpeh.
  - range: 12-28
    heading: Jephthah’s case against Ammon
    plain: |
      Jephthah sent messengers to the king of the Ammonites: “What quarrel do you have with me, that you have come to attack my land?” The king answered, “Because when Israel came up out of Egypt, they took my land from the Arnon to the Jabbok and the Jordan. Now give it back peaceably.” Jephthah sent messengers again with this reply: “Israel did not take the land of Moab or the land of the Ammonites. When Israel came up from Egypt, they went through the wilderness to the Red Sea and came to Kadesh. They asked the king of Edom to let them pass through his land, and he refused; they asked the king of Moab, and he would not agree; so Israel stayed at Kadesh. Then they went around Edom and Moab, along the east side of Moab, and camped beyond the Arnon, without entering Moab’s territory, for the Arnon was Moab’s border. Israel asked Sihon, king of the Amorites at Heshbon, to let them pass through his land to their own place. But Sihon did not trust Israel to pass; he gathered all his army at Jahaz and attacked. The LORD, the God of Israel, gave Sihon and all his people into Israel’s hand, and Israel took all the land of the Amorites, from the Arnon to the Jabbok and from the wilderness to the Jordan. So the LORD, the God of Israel, has driven out the Amorites before His people. Should you now take it? Don’t you keep whatever Chemosh your god gives you? Then we will keep whatever the LORD our God has cleared before us. Are you any better than Balak son of Zippor, king of Moab? Did he ever quarrel with Israel or fight against them? For three hundred years Israel has lived in Heshbon, Aroer and all the towns along the Arnon. Why didn’t you take them back in all that time? I have not wronged you; you are wronging me by making war on me. Let the LORD, the Judge, decide today between Israel and Ammon.” But the king of the Ammonites paid no attention to the message Jephthah sent him.
  - range: 29-33
    heading: The vow and the victory
    plain: |
      Then the Spirit of the LORD came upon Jephthah. He went through Gilead and Manasseh, through Mizpeh of Gilead, and from there advanced against the Ammonites. And Jephthah made a vow to the LORD: “If you will indeed give the Ammonites into my hands, then whatever comes out of the doors of my house to meet me when I return safely from the Ammonites will be the LORD’s, and I will offer it up as a burnt offering.” Jephthah went over to fight the Ammonites, and the LORD gave them into his hands. He struck them with a great slaughter from Aroer to Minnith, twenty towns, as far as the plain of the vineyards. So the Ammonites were subdued before Israel.
  - range: 34-40
    heading: His only child
    plain: |
      When Jephthah came home to Mizpeh, there was his daughter coming out to meet him, dancing to the sound of hand drums. She was his only child; he had no other son or daughter. When he saw her, he tore his clothes and cried, “Oh, my daughter! You have brought me to my knees; you have become the cause of my trouble. I have made a promise to the LORD, and I cannot take it back.” She said, “My father, you have made a promise to the LORD. Do to me as you promised, now that the LORD has avenged you on your enemies the Ammonites.” And she said, “Grant me this one request: let me go for two months to roam the hills with my friends and weep over my virginity.” “Go,” he said, and he let her go for two months. She and her friends went into the hills and wept over her virginity. After the two months she returned to her father, and he did to her as he had vowed. She had never known a man. From this came a custom in Israel: every year the young women of Israel go out for four days to lament the daughter of Jephthah of Gilead.

notes:
  - ref: 1
    phrase: he was the son of an harlot
    kind: history
    title: An outcast called home
    body: |
      Jephthah begins the story outside his father’s house, and the elders he accuses of driving him out are the ones who come to fetch him. His mother was a harlot, his father a man named Gilead, and when the sons of Gilead’s wife grew up they disinherited him (verse 2): “Thou shalt not inherit in our father’s house; for thou art the son of a strange woman.” It was his brothers who drove him out, but Jephthah lays it on the elders: “Did not ye hate me, and expel me out of my father’s house?” (verse 7).

      In Tob he led a band of “vain men” (verse 3), and that is the leader Gilead now needs. One reading of the book sees here a turn in how the LORD works with His deliverers: with Jephthah, “God begins to work in spite of the weaknesses of Israel’s leaders.” His “charismatic, if ethically dubious, leadership of a band of ‘worthless fellows’” is what leads the leaders of Gilead to choose him, “yet YHWH uses this less than ideal choice to stave off foreign attack.”
    sources: [lds-scriptures, schade-broken-laws]

  - ref: 11
    phrase: the people made him head and captain over them
    kind: history
    title: Captain, then head
    body: |
      The elders raise their offer during the bargaining, and the two titles show how far. First they ask Jephthah to be their “captain” (verse 6), a commander for the war; when he reproaches them, they offer to make him “head over all the inhabitants of Gilead” (verse 8), the title their own princes had promised to whoever would begin the fight ([[Judg. 10:18]]). Verse 11 names both offices: the people made him “head and captain.”

      Jephthah’s condition puts the LORD into the agreement. He will be their head if “the LORD deliver them before me” (verse 9; the Hebrew can also be read as a statement, “I shall be your head”). The elders swear by the LORD as witness (verse 10), and the terms are spoken again “before the LORD in Mizpeh” (verse 11).
    sources: [lds-scriptures]

  - ref: 12
    phrase: What hast thou to do with me, that thou art come against me to fight in my land?
    kind: history
    title: Words before war
    body: |
      Jephthah tries to settle the quarrel with Ammon by argument before he fights, and this is rare in Judges. The law told Israel, “When thou comest nigh unto a city to fight against it, then proclaim peace unto it” ([[Deut. 20:10]]), and Jephthah’s embassy has been read as a parallel to “following the peaceful negotiation as God instructed within the law”; “in Judges we don’t have many other accounts of such negotiations.”

      The dispute is over Gilead itself. The Ammonite king claims that Israel took his land “from Arnon even unto Jabbok” when it came out of Egypt (verse 13). Jephthah answers from the record of the march: Israel went around Edom and Moab when they refused passage, and took the land from Sihon king of the Amorites only after Sihon attacked (verses 15–22). The Ammonites apparently believed the land was theirs, but Israel had won it from the Amorites, who had settled there and lost. The march itself is told at [[Num. 21:21–24]] and [[Deut. 2:26–36]]; the note at [[Deut. 2:29]] sets Jephthah’s retelling beside it. The king “hearkened not” (verse 28), and the matter went to battle.
    sources: [schade-broken-laws, sc-knowhy-855, lds-scriptures]

  - ref: 24
    phrase: Wilt not thou possess that which Chemosh thy god giveth thee to possess?
    kind: history
    title: Why Chemosh?
    body: |
      Jephthah names Chemosh, the god of Moab, when he speaks to the king of Ammon. The Ammonites worshipped “Molech or Milcom”; Chemosh was “the god of Moab,” though from this verse he has been counted “also of Ammon.” One older reading explains the name from the argument itself: Jephthah is arguing over ground that had been Moab’s, and so he names Moab’s god. From verse 15 on the argument has Moab in view, the towns of verse 26 were Moabite, and “obviously Moabites are in the speaker’s mind.” Another older reading adds that part of Sihon’s kingdom “had formerly been Moabitish and Ammonitish property,” taken by the Amorites before Israel came.

      The argument itself speaks the language of its world. Most people of the ancient Near East “spoke of various gods ruling over a specific land, nation, or similar geographical location,” and Jephthah talks as though Chemosh would look after Moab and Jehovah after Israel. Nephi would later say what such talk leaves out: the Lord “inviteth them all to come unto him,” and “all are alike unto God” ([[2 Ne. 26:33]]), a statement that would have startled hearers who assumed “each god only cared about his own people.”
    sources: [bd-ammon, bd-chemosh, cambridge-judges, keil-judges, sc-knowhy-874, sc-knowhy-278]

  - ref: 26
    phrase: three hundred years
    kind: history
    title: Three hundred years
    body: |
      Jephthah’s “three hundred years” is probably a round figure in an argument, not a date to build on. His point is that Israel had held the towns along the Arnon for generations and Ammon had never tried to take them back (verse 26). The book’s figures are generally round and its judges may have overlapped, so they are hard to turn into a chronology (see the note on [[Judg. 3:11]]). The guide [The Conquest, the Judges, and One Kingdom](/old-testament/guides/the-conquest-judges-and-kingdom/#rulers) gives the dating the Church’s pages offer.
    sources: [bd-judges]

  - ref: 27
    phrase: the LORD the Judge be judge this day
    kind: christ
    title: The LORD the Judge
    body: |
      Jephthah closes his case by handing it to the LORD with the book’s own word. The Hebrew sets the verb and the title side by side, *yišpōṭ YHWH haššōpēṭ*: let the LORD, the one who judges, judge between the children of Israel and the children of Ammon. The verb is the one behind the title of every judge in the book, and here it is used of God deciding between two parties at war. In Judges the verb most often means to lead Israel out of oppression (see [[Judg. 2:16]]), and “from the beginning God was viewed as the ultimate judge, always deciding what was right and just.” Jephthah appeals to that Judge in a quarrel between nations, sure of his own cause: “I have not sinned against thee” (verse 27).

      The Church’s footnote to “Judge” sends the reader to the Topical Guide’s “Jesus Christ, Judge.” The LORD to whom Jephthah appeals is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]), and the New Testament says of Him, “the Father judgeth no man, but hath committed all judgment unto the Son” ([[John 5:22]]).
    sources: [oshb-wlc, bdb, schade-broken-laws, lds-scriptures]

  - ref: 31
    phrase: I will offer it up for a burnt offering
    kind: words
    title: What the vow promised
    body: |
      Jephthah’s words promise the LORD a burnt offering of the first thing to come out of his house, and the wording leaves room for a person. Vows in Israel “often had an entreating character; they were offered in order to obtain some favor from Jehovah,” and this one is that kind: “If thou shalt without fail deliver the children of Ammon into mine hands” (verse 30). The Hebrew of “whatsoever cometh forth” is a participle, *hayyôṣēʾ*, the one coming out. Augustine, an ancient reader of the verse, pointed out that sheep do not come out to meet a general returning from war, and that the vow says, in effect, “whoever comes out, I will offer him”; on that reading Jephthah “must have been thinking of some human being as at all events included in his vow.”

      The last word is *ʿōlâ*, the “whole burnt-offering,” the offering wholly consumed on the altar. The law had already named the offering of sons and daughters in fire as the abomination of the nations: “Thou shalt not do so unto the LORD thy God” ([[Deut. 12:31]]). One older reading argues that *ʿōlâ* “does not involve the idea of burning” but “complete surrender to the Lord,” and that argument is the basis of the reading at verse 39; it runs against the word’s ordinary sense given above.

      The text places the Spirit of the LORD on Jephthah before the vow (verse 29; the phrase is explained at [[Judg. 14:6]]), but it does not say the LORD asked for the vow or that He accepted it. Verse 32 says only that “the LORD delivered them into his hands.”
    sources: [bd-vows, oshb-wlc, keil-judges, bdb, lds-scriptures]

  - ref: 39
    phrase: who did with her according to his vow which he had vowed
    kind: history
    title: What Jephthah did
    body: |
      The text says that Jephthah “did with her according to his vow,” and readers have long disagreed about what that was. The Church’s chapter heading and Bible Dictionary take it plainly: a rash vow that led to the sacrifice of his only daughter, in consequence of which he “offered his own daughter in sacrifice.” A Latter-day Saint telling of the book reads it the same way, as “a foolish vow that inadvertently led to the sacrifice of his daughter.”

      “A literal reading of the text may support that view,” but there is a second reading: that “Jephthah was compelled by his vow to dedicate his daughter to Jehovah in a lifelong virginity.” It rests on the story’s own details. She asks for two months to bewail not her death but her “virginity” (verses 37–38); and on this reading the clause “she knew no man” (verse 39) describes the vow being fulfilled in a life unmarried, where after a death it would add little. It also leaves a question for the first reading: how could Hebrews name Jephthah among the faithful if he had offered a human sacrifice? The disagreement is old: the view that he put her to death “generally prevailed in the earlier times among both Rabbins and fathers of the church,” and “it was not till the middle ages” that the Kimchis and other rabbis argued that Jephthah “merely dedicated his daughter to the service of the sanctuary of Jehovah in a lifelong virginity.”

      The two readings stand side by side here, the Church’s heading and Bible Dictionary first; the guide [Women and Marriage](/old-testament/guides/women-and-marriage/#hard-passages) gives them in the same order. What the text does settle is the grief: a father brought “very low” (verse 35), a daughter who will have no children, and a custom in which “the daughters of Israel went yearly to lament” her four days a year (verse 40). It never names her.

      [[Heb. 11:32–33]] lists Jephthah with Gideon, Barak and Samson among the faithful who subdued kingdoms. He is commended there “probably because of his delivery of Israel from Ammon.”
    sources: [lds-scriptures, bd-jephthah, litchman-deborah, ot-manual-judges-1-12, keil-judges]

christ: |
  The LORD the Judge to whom Jephthah appealed (verse 27, where the note has it) is the Deliverer the book’s pattern points to: the pattern of sin, cry and deliverance set out in [[Judg. 3:7–9]] “teaches about the Savior’s power to deliver us from sin,” and here it is the LORD who “delivered them into his hands” (verse 32). One Latter-day Saint reading finds Jephthah behind Mark’s story of Jairus, a religious leader who comes home to noise and grief over a dying daughter ([[Mark 5:22–24]], [[Mark 5:35–43]]). It calls the parallel a “motif inversion”: old events are re-enacted in the Savior’s ministry but “end differently because of his presence and power,” which shows “that Jesus is the one who literally ‘redeems’ history.” In that reading, “Jairus intercedes to reverse the death of his daughter while Jephthah’s foolishness seals his daughter’s fate,” and Jesus raises her.

  The cost of the vow fell on the daughter, and one Latter-day Saint study names her story, with that of the Levite’s concubine (Judges 19–21), among the “appalling texts” of the Bible that tell of abuse. It reads such stories as recorded not to sanction the violence in them but to be condemned, “to show the need for a different way.” Studied openly in a church, they “create a biblically sanctioned space to name and discuss abuse within a church setting,” and may give those who have been hurt the freedom to tell their own stories and to work toward recovery. Silence, the study observes, lets abuse continue; a disciple who reads this chapter openly is refusing that silence.

explore: |
  - [[Judg. 12:1–7]]: the rest of Jephthah’s story, the Ephraimites and “Shibboleth.”
  - [[Num. 21:21–35]] and [[Deut. 2:26–37]]: the march Jephthah retells.
  - [[Num. 30]]: the law of vows, and [[1 Sam. 1:11]], Hannah’s vow of a child to the LORD.
  - [[Mark 5:21–43]]: Jairus’s daughter raised.
  - Julie M. Smith, [“A Redemptive Reading of Mark 5:25–34”](https://journal.interpreterfoundation.org/a-redemptive-reading-of-mark-525-34), on how Mark’s story of Jairus answers Jephthah’s.

