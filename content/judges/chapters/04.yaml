chapter: 4
title: Into the Hand of a Woman
tagline: Under Jabin’s iron chariots Israel cries to the LORD; Deborah the prophetess sends Barak to Tabor, the LORD routs Sisera at the Kishon, and Jael kills him in her tent.
when: 'When Ehud was dead (verse 1), in the north of the land'

setting: |
  Ehud’s deliverance ended in eighty years of rest ([[Judg. 3:30]]). Chapter 4 opens when he is dead, and the book’s pattern starts again: Israel does evil, the LORD sells them to an enemy, and they cry to Him (verses 1–3; the cycle is explained at [[Judg. 2:11]] and [[Judg. 2:16]]). This time the enemy is in the north, a Canaanite king, Jabin of Hazor, and his captain Sisera, and the story is told twice: here as a narrative and in chapter 5 as a poem, the Song of Deborah. The two tellings differ in places, and the comparison belongs to [[Judg. 5]].

  The deliverer is a woman. Deborah is “the only female judge mentioned in the Old Testament,” and she is already judging Israel before the crisis comes. The fighting is done by Barak, with men from Naphtali and Zebulun, and the final blow by Jael, the wife of Heber the Kenite, of a people that was “probably a Midianite tribe.” The guide [The Conquest, the Judges, and One Kingdom](/old-testament/guides/the-conquest-judges-and-kingdom/#rulers) places Deborah and Barak among the other judges.

thread: |
  The chapter turns on one sentence of Deborah’s: “the LORD shall sell Sisera into the hand of a woman” (verse 9). The verb is the one that began the trouble. The LORD “sold” Israel into Jabin’s hand (verse 2), to “sell” being to deliver up; now He will sell Israel’s oppressor the same way. Everything that follows is that promise coming true.

  The odds are set at the start. Sisera has “nine hundred chariots of iron” (verse 3), the weapon that had kept Judah from driving out the people of the valley ([[Judg. 1:19]]). Against that, Deborah relays a command and a promise: go to Tabor, and “I will deliver him into thine hand” (verses 6–7). Barak will go only if she goes (verse 8). She goes, and she tells him the honour will not be his (verse 9).

  A verse about a Kenite family’s tent (verse 11) seems to interrupt, until Sisera runs to that tent. The battle itself takes three verses: Deborah says “Up,” the LORD routs Sisera, and the whole army falls (verses 14–16). The rest of the chapter is the woman’s part, told slowly: Jael’s welcome, the milk, the blanket, the tent peg (verses 17–21). Barak arrives in time to be shown the body (verse 22). The narrator gives the victory to God: “So God subdued on that day Jabin the king of Canaan” (verse 23).

sections:
  - range: 1-3
    heading: Jabin and his chariots
    plain: |
      After Ehud died, the Israelites again did what was evil in the LORD’s sight. So the LORD handed them over to Jabin, the Canaanite king who ruled in Hazor. The commander of his army was Sisera, who lived in Harosheth of the Gentiles. The Israelites cried out to the LORD, because Sisera had nine hundred iron chariots and had oppressed them violently for twenty years.
  - range: 4-9
    heading: Deborah calls Barak
    plain: |
      At that time Deborah, a prophetess and the wife of Lapidoth, was judging Israel. She used to sit under the palm tree of Deborah, between Ramah and Bethel in the hill country of Ephraim, and the Israelites came up to her to have their disputes decided. She sent for Barak son of Abinoam from Kedesh in Naphtali and said to him, “Hasn’t the LORD, the God of Israel, commanded you: ‘Go, march to Mount Tabor, and take ten thousand men from Naphtali and Zebulun with you. I will draw Sisera, the commander of Jabin’s army, with his chariots and his troops, to you at the river Kishon, and I will give him into your hand’?” Barak answered, “If you go with me, I will go; but if you won’t go with me, I won’t go.” “I will certainly go with you,” she said, “but the road you are taking will not bring you the honour, for the LORD will hand Sisera over to a woman.” Then Deborah got up and went with Barak to Kedesh.
  - range: 10-17
    heading: The battle at the Kishon
    plain: |
      Barak summoned Zebulun and Naphtali to Kedesh, and ten thousand men went up behind him, and Deborah went with him. Now Heber the Kenite, a descendant of Hobab, Moses’ father-in-law, had separated from the other Kenites and pitched his tent in the plain of Zaanaim near Kedesh. When Sisera was told that Barak had gone up to Mount Tabor, he gathered all nine hundred iron chariots and all his men from Harosheth of the Gentiles to the river Kishon. Deborah said to Barak, “Go! This is the day the LORD has given Sisera into your hand. Hasn’t the LORD gone out ahead of you?” So Barak went down from Mount Tabor with ten thousand men behind him. The LORD threw Sisera, all his chariots and all his army into panic before Barak’s sword. Sisera got down from his chariot and fled on foot. Barak chased the chariots and the army all the way to Harosheth of the Gentiles, and the whole of Sisera’s army fell by the sword; not one man was left. But Sisera fled on foot to the tent of Jael, the wife of Heber the Kenite, because there was peace between Jabin king of Hazor and Heber’s household.
  - range: 18-21
    heading: Jael’s tent
    plain: |
      Jael went out to meet Sisera and said, “Come in, my lord, come in here with me; don’t be afraid.” So he went into her tent, and she covered him with a rug. “Please give me a little water,” he said, “I’m thirsty.” She opened a skin of milk, gave him a drink, and covered him again. “Stand at the door of the tent,” he told her. “If anyone comes and asks you, ‘Is anyone here?’ say ‘No.’” But while he lay fast asleep from exhaustion, Jael, Heber’s wife, took a tent peg and a hammer, went to him quietly, and drove the peg through his temple into the ground, and he died.
  - range: 22-24
    heading: Jabin subdued
    plain: |
      Barak came by in pursuit of Sisera, and Jael went out to meet him. “Come,” she said, “I will show you the man you are looking for.” He went into her tent, and there lay Sisera, dead, with the tent peg through his temple. That day God subdued Jabin the Canaanite king before the Israelites, and their power over Jabin grew stronger and stronger until they destroyed him.

notes:
  - ref: 2
    phrase: Jabin king of Canaan, that reigned in Hazor
    kind: history
    title: Another Jabin in Hazor
    body: |
      The king who oppresses Israel here reigns in a city Joshua had already taken, and the text does not explain how. Joshua 11 says Joshua took Hazor, struck down its king and burned the city ([[Josh. 11:10–11]]); the king who led the north against him was also called Jabin ([[Josh. 11:1]]). In Judges a Jabin reigns there again, and he is called “king of Canaan.”

      One older reading takes him to be a later king of the same name, living “more than a century later,” and suggests that Jabin “may possibly have been a standing name or title” of Hazor’s kings, as Abimelech seems to have been of the Philistines’ ([[Gen. 26:8]]). That is a suggestion; neither book says so. The note at [[Josh. 11:1]] sets the two accounts side by side and leaves the question open, and that is where the evidence leaves it. What the chapter does make plain is how strong this Jabin was: his captain’s iron chariots were the weapon that had already kept Judah out of the valleys ([[Judg. 1:19]]).
    sources: [lds-scriptures, keil-judges]

  - ref: 4
    phrase: Deborah, a prophetess, the wife of Lapidoth, she judged Israel at that time
    kind: history
    title: Prophetess and judge
    body: |
      Deborah is the one judge in the book to whom prophetic gifts are ascribed, and the only woman who judges Israel. A prophetess is a woman with a testimony of Jesus and the spirit of revelation, and “a prophetess does not hold the priesthood or its keys.” That caution belongs in its Old Testament setting, where it seems “not even all the males described as prophets held ‘the priesthood or its keys.’” The title names a gift of revelation, not an office in the modern Church.

      Within Judges the gift sets her apart. An unnamed prophet comes before Gideon ([[Judg. 6:8]]), but no other judge, not Ehud, Gideon, Jephthah or Samson, is called a prophet, and she is “the only judge described in the book of Judges as any kind of religious leader.” The gift is visible at once: her first words to Barak are the LORD’s command and promise (verses 6–7), the kind of pronouncement a prophetess would have made. Her own name for herself, “a mother in Israel,” is explained at [[Judg. 5:7]]; the guide [Women and Marriage](/old-testament/guides/women-and-marriage/#the-women) sets her among the women of the Old Testament.
    sources: [scripture-helps-judges, gs-prophetess, shannon-models-motherhood, ot-minute-judg-4]

  - ref: 5
    phrase: the children of Israel came up to her for judgment
    kind: history
    title: The one judge who heard cases
    body: |
      Verse 5 is the only place in the book where a judge does what the English word suggests. Elsewhere the judges are deliverers and war leaders (what the title meant is explained at [[Judg. 2:16]]); “the only judge described in Judges as functioning in a juridical context is Deborah.” “Dwelt” here means “used to sit or remain”: she held a regular seat under her palm tree, and people came to her with their cases.

      The chapter then shows her doing the other kind of judging too. The woman who decided cases under the palm is the one who summons the army and goes with it to war.
    sources: [lds-scriptures, shannon-models-motherhood]

  - ref: 9
    phrase: the LORD shall sell Sisera into the hand of a woman
    kind: history
    title: The honour goes to a woman
    body: |
      Barak would march only if Deborah came, and she answered that the honour of the victory would therefore go to a woman. The text records his condition (verse 8) and her reply without calling either one faith or fear. Barak can be read as “fearful and reluctant,” with Deborah’s answer telling him his reluctance was unnecessary. Whatever his motive, his refusal to go without her shows “the importance of her role” in the victory, as one would expect of a judge.

      Verse 22 shows who the woman is, when Jael shows Barak “the man whom thou seekest.” Because he would not go without her, the honour of victory goes “not to him but to Deborah and Jael”: to the woman who sent him and the woman who finished it.

      Barak is still remembered among the faithful: the Church’s footnote at verse 6 points to [[Heb. 11:32]], which names him with Gideon, Samson and Jephthah. That verse is explained at [[Judg. 11:39]].
    sources: [litchman-deborah, shannon-models-motherhood, ot-minute-judg-4, lds-scriptures]

  - ref: 11
    phrase: Now Heber the Kenite, which was of the children of Hobab the father in law of Moses
    kind: history
    title: Why Heber the Kenite is named here
    body: |
      Verse 11 names the tent to which Sisera will run in verse 17. The Kenites and their long friendship with Israel are explained in the note at [[Judg. 1:16]], and Hobab at [[Num. 10:31]]. Heber had “severed himself from the Kenites” and pitched his tent near Kedesh.

      Verse 17 gives the reason the tent matters. Heber’s household was at peace with Jabin: Jael’s tribe “had a peace agreement with the Canaanites.” So a tent of Israel’s old friends was also a tent where Sisera could think himself safe, which is why he fled there.
    sources: [litchman-deborah, lds-scriptures]

  - ref: 14
    phrase: is not the LORD gone out before thee?
    kind: history
    title: The LORD gone out before
    body: |
      Deborah’s question gives the battle to the LORD before a sword is drawn. Barak goes down from the mountain with ten thousand men against nine hundred chariots, and the next verse makes the LORD the one who acts: “the LORD discomfited Sisera, and all his chariots” (verse 15), “discomfited” meaning panicked, put to flight. Chapter 4 does not say how; the song says “The river of Kishon swept them away” ([[Judg. 5:21]], where the Kishon has its note). Read with the song, the LORD “went out before the Israelites with a terrible storm,” its rain filling the Kishon and spilling over the plain. The storm comes from the song; chapter 4 names none.
    sources: [lds-scriptures, litchman-deborah]

  - ref: 19
    phrase: she opened a bottle of milk, and gave him drink, and covered him
    kind: symbol
    title: Milk and a blanket
    body: |
      Jael’s welcome is a host’s welcome, and more: she gives Sisera more than he asks for. She goes out to meet him, tells him “fear not” (verse 18), and covers him; the “mantle” is a “rug, thick coverlet, or blanket.” He asks for a little water, and she opens a skin of milk and covers him again.

      The care is pointed. Jael “treated him like a mother would treat a child, giving him milk and a blanket and putting him to sleep,” and the scene is “rich with irony” because all the while she was preparing his death. The detail answers why the story lingers over the milk: it makes Sisera, the commander of nine hundred chariots, a tired child in a stranger’s tent, and it makes the hospitality he trusted the thing that undoes him.
    sources: [lds-scriptures, ot-minute-judg-4]

  - ref: 21
    phrase: Then Jael Heber’s wife took a nail of the tent
    kind: history
    title: Was Jael right?
    body: |
      The text tells what Jael did without judging it, and the song that follows calls her blessed. While Sisera slept she drove a tent peg (the “nail” of the King James) through his temple. She had taken him in with “fear not” (verse 18), her household was at peace with Jabin (verse 17), and the war was one Deborah had said a woman would end (verse 9). Chapter 4 does not say the LORD commanded it, and it does not condemn it. Chapter 5 sings, “Blessed above women shall Jael the wife of Heber the Kenite be” ([[Judg. 5:24]]), and tells the killing differently: the prose has Sisera asleep, while the song seems to have him struck as he drinks. That comparison, and the song’s blessing, are taken up at [[Judg. 5:24]].

      In the story the deed fulfils Deborah’s word: Jael showed Barak the body, “having fulfilled Deborah’s prophecy.” Whether it was right is a separate question, and no Latter-day Saint source read answers it. One older reading separates the purpose from the act: God “had no doubt so ordered it” that Sisera should die in her tent, but the deed “cannot be acquitted of the sins of lying, treachery, and assassination,” and even the song does not praise it “as a divine act.” How the Church reads the wars of this period as a whole is explained at [[Josh. 6:21]].
    sources: [lds-scriptures, bd-jael, litchman-deborah, keil-judges]

christ: |
  The LORD who sold Sisera into the hand of a woman, routed the chariots and was “gone out before” Barak is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). The stories of the judges show Him as “the Redeemer of Israel,” who “is always willing to deliver us and welcome us back as we return to Him,” even after twenty years of oppression that Israel’s own evil had brought on.

  The Church’s footnote to Deborah’s question points to the same promise made to His servants now: “I will go before your face. I will be on your right hand and on your left” ([[D&C 84:88]]). A disciple who goes where the Lord sends goes behind Him, and the victory, as at the Kishon, is His.

explore: |
  - [[Judg. 5]]: the same victory as a song, with Deborah “a mother in Israel” and Jael blessed.
  - [[Josh. 11:1–13]]: the first Jabin of Hazor and his chariots.
  - [[Ps. 83:9–10]]: Sisera and Jabin at the Kishon remembered in a prayer.
  - [[Ex. 15:20–21]]: Miriam, the first woman scripture calls a prophetess.
  - [“Models of Motherhood”](https://rsc.byu.edu/covenant-compassion/models-motherhood), on Deborah as judge, prophetess and “mother in Israel.”

