chapter: 14
title: Out of the Strong Came Forth Sweetness
tagline: Samson wants a Philistine wife, tears a lion apart by the Spirit of the LORD, finds honey in its carcass, and loses a wedding riddle to his bride’s tears.
when: 'When the Philistines had dominion over Israel (verse 4)'

setting: |
  Chapter 13 opened with Israel doing evil again and the LORD delivering them “into the hand of the Philistines forty years” ([[Judg. 13:1]]), and with an angel’s promise that Samson would “begin to deliver Israel” ([[Judg. 13:5]]). The book passes straight from his birth to his manhood: all it says of his youth is that “the Spirit of the LORD began to move him at times” ([[Judg. 13:25]]).

  Chapter 14 is the first of his adventures. Almost all of chapters 14–15 happens in the territory of Dan along the Sorek Valley, which runs west from Zorah, Samson’s home, down to the Philistine towns of Timnath and Ekron; in this chapter he leaves it only once, for Ashkelon (verse 19). The chapter tells his marriage, the lion, the riddle, and how the wedding came apart. Its end (verse 20) sets up the burning fields of [[Judg. 15]].

thread: |
  The chapter moves by a verb. Samson “went down” to Timnath (verse 1), went down again with his parents (verse 5), “went down, and talked with the woman” (verse 7), and finally “went down to Ashkelon” (verse 19). The scriptures repeat “and he went down” of Samson’s journeys, actions and choices, and the phrase has been read as the story of a man overcome by the world when he could have risen to his calling. He goes “up” only to ask for a wife (verse 2) and, angry, to his father’s house (verse 19).

  Running beside it is a second line: what Samson keeps to himself. He tells his parents nothing of the lion (verse 6) and nothing of where the honey came from (verse 9). The secret becomes his riddle (verse 14). He refuses it to his wife, “I have not told it my father nor my mother, and shall I tell it thee?” (verse 16), and then gives it up to her tears (verse 17). The man who is shrewd enough to set a riddle no one can guess is not shrewd enough to keep it; the story makes him clever and then outmatched.

  Over both lines stands verse 4. His parents, the narrator says, did not know “that it was of the LORD.” Whatever Samson wanted, the LORD was at work through it against the Philistines, and twice the Spirit of the LORD comes on him (verses 6, 19).

sections:
  - range: 1-4
    heading: A wife from Timnath
    plain: |
      Samson went down to Timnath, and there he saw a young Philistine woman. He came back up and told his father and mother, “I have seen a Philistine woman in Timnath. Now get her for me as my wife.” His parents answered, “Is there no woman among your own relatives, or among all our people, that you have to go and take a wife from the uncircumcised Philistines?” But Samson said to his father, “Get her for me. She is the one I like.” His father and mother did not know that this was from the LORD, who was looking for an occasion against the Philistines; at that time the Philistines ruled Israel.
  - range: 5-9
    heading: The lion and the honey
    plain: |
      Samson went down to Timnath with his father and mother. As he came to the vineyards of Timnath, a young lion came roaring at him. The Spirit of the LORD rushed upon him, and with nothing in his hand he tore the lion apart as easily as one tears a young goat. But he did not tell his father or his mother what he had done. Then he went down and talked with the woman, and he liked her. Some time later, when he went back to marry her, he turned aside to look at the lion’s carcass, and there was a swarm of bees in it, and honey. He scooped some honey into his hands and ate it as he walked. When he rejoined his father and mother he gave them some, and they ate it; but he did not tell them that he had taken the honey from the lion’s carcass.
  - range: 10-14
    heading: The wedding riddle
    plain: |
      His father went down to the woman, and Samson gave a feast there, as young men used to do. When the Philistines saw him, they brought thirty companions to be with him. Samson said to them, “Let me tell you a riddle. If you can give me the answer within the seven days of the feast, I will give you thirty linen garments and thirty changes of clothes. If you can’t, you will give me thirty linen garments and thirty changes of clothes.” “Tell us your riddle,” they said; “let’s hear it.” He said, “Out of the eater came something to eat, and out of the strong came something sweet.” For three days they could not solve it.
  - range: 15-18
    heading: The answer betrayed
    plain: |
      On the seventh day they said to Samson’s wife, “Coax your husband into telling us the riddle, or we will burn you and your father’s household to death. Did you invite us here to rob us?” So Samson’s wife wept over him and said, “You only hate me; you don’t love me. You have told my people a riddle, and you haven’t told me the answer.” He said, “I haven’t told my father or my mother; why should I tell you?” She wept over him through the seven days of the feast, and on the seventh day, because she pressed him so hard, he told her, and she told the riddle to her people. Before sunset on the seventh day the men of the town said to him, “What is sweeter than honey? What is stronger than a lion?” He answered, “If you had not plowed with my heifer, you would not have solved my riddle.”
  - range: 19-20
    heading: Ashkelon, and a lost wife
    plain: |
      Then the Spirit of the LORD rushed upon him. He went down to Ashkelon, struck down thirty of its men, took their clothing, and gave the changes of clothes to the men who had answered the riddle. Burning with anger, he went back up to his father’s house. And Samson’s wife was given to the companion who had been his friend at the wedding.

notes:
  - ref: 3
    phrase: Get her for me; for she pleaseth me well
    kind: history
    title: She is right in my eyes
    body: |
      Samson’s parents object to a wife from outside Israel, and Samson answers with nothing but his own taste. Their question sets the daughters “of thy brethren” against “the uncircumcised Philistines,” the word Jacob’s sons used when they refused “to give our sister to one that is uncircumcised; for that were a reproach unto us” ([[Gen. 34:14]]). A Philistine wife was worse than unwise at a time when Israel was “subjugated under the Philistines.”

      Samson’s reply in Hebrew is *kî-hîʾ yāšrâ bəʿênāy*, literally *for she is right in my eyes*; the verb means to be pleasing or right in someone’s eyes, and it is used of this woman again in verse 7. Nothing else is given as a reason. The choice is of a piece with the rest of his life: Samson, “arguably the least covenantal conscious of the judges, is remembered to have sought out only Philistines throughout his lifetime,” so that “even the leader designated by the deity does not follow the practices incumbent upon all Israel.”

      The theme page [Right in His Own Eyes](/judges/themes/right-in-his-own-eyes/) argues that this is the turn of the book: after twelve chapters measured by the LORD’s eyes, a judge makes his own eyes the measure, and the people follow him in chapters 17 to 21.
    sources: [lds-scriptures, ot-minute-judg-14, bdb, oshb-wlc, schade-broken-laws]

  - ref: 4
    phrase: it was of the LORD, that he sought an occasion against the Philistines
    kind: history
    title: It was of the LORD
    body: |
      The narrator tells the reader what the parents could not know: the LORD was at work in this marriage against the Philistines. What the verse does not settle is who “sought an occasion”; the Hebrew can be read with either subject. A Latter-day Saint reading takes Samson as the subject and makes him the shrewd one: his request was a “pretext to move against the Philistines,” and he is portrayed from the start as “a wily, shrewd character.” One older reading makes the LORD the subject, setting the verse beside “it was of the LORD to harden their hearts” ([[Josh. 11:20]]), where the Church’s footnote also sends the reader. Another grants that “most commentators refer it to Samson,” but doubts that so impetuous a man asked for a wife only to pick a fight; it takes his stubborn choice as the means God’s purpose had fixed on for overthrowing the Philistines.

      The word “occasion” (*tōʾănâ*) occurs only here; its verb means to seek the right moment to harm someone, the “seeketh a quarrel” of [[2 Kgs. 5:7]]. On any of these readings the narrator says that the LORD was at work in Samson’s choice, and gives no verdict on the choice itself.
    sources: [lds-scriptures, cambridge-judges, pulpit-judges, ot-minute-judg-14]

  - ref: 6
    phrase: the Spirit of the LORD came mightily upon him
    kind: words
    title: Came mightily
    body: |
      “Came mightily” is one Hebrew verb, *ṣālaḥ*, “rush,” used above all of a sudden seizing by the Spirit of the LORD. It is the verb here, at Ashkelon (verse 19) and at the bursting of the ropes ([[Judg. 15:14]]), and it is used again when the Spirit comes on Saul ([[1 Sam. 10:6]], [[1 Sam. 10:10]], [[1 Sam. 11:6]]) and on David at his anointing ([[1 Sam. 16:13]]). With Samson what follows the rush is a feat: a lion torn apart with no weapon at all.

      In Samson’s story the phrase “seems to acknowledge only his remarkable physical strength, which came as a gift from God,” rather than the influence of the Holy Ghost that a faithful person enjoys. The Spirit’s power can come “mightily,” as with Samson, or as “a still small voice,” as with Elijah ([[1 Kgs. 19:12]]).
    sources: [bdb, oshb-wlc, scripture-helps-judges, wilson-holy-spirit]

  - ref: 9
    phrase: he told not them that he had taken the honey out of the carcase of the lion
    kind: history
    title: The honey he did not explain
    body: |
      Samson’s silence about the honey keeps to himself the secret his riddle will turn on. The narrator says that Samson did not tell his parents what he had done to the lion (verse 6), and then that he did not tell them where the honey they were eating came from: a dead lion (verse 9). The riddle and its answer “are both predicated on the encounter narrated at verses 8–9,” and with his parents left out, no one but Samson knows what happened there.

      One older reading gives a further reason for the silence: had his parents known, they would have “refused to eat it as being unclean.” The text itself says only that he did not tell them.
    sources: [ot-minute-judg-14, keil-judges]

  - ref: 14
    phrase: Out of the eater came forth meat, and out of the strong came forth sweetness
    kind: symbol
    title: A riddle no one could guess
    body: |
      Samson’s riddle could not be solved by wit, because its answer was an event only he had seen (see the note on verse 9). “Meat” is the King James word for food: a modern translation gives “Out of the eater came something to eat. Out of the strong came something sweet.” The stakes were high. The “sheets” were wrappers of fine linen, worn as an outer garment or alone at night, and a “change of garments” was a change of clothing; thirty of each meant one of each for every one of the thirty companions, paid by the side that lost.

      One Latter-day Saint reading hears more in it. The riddle and its answer “also foreshadow Samson’s later involvement with Delilah”: “What, after all, is sweeter or more powerful than love? And love will later contribute to Samson’s downfall.”
    sources: [bdb, ot-minute-judg-14]

  - ref: 15
    phrase: on the seventh day
    kind: words
    title: The seventh day or the fourth?
    body: |
      The Hebrew of verse 15 says the Philistines threatened the bride “on the seventh day,” which seems to clash with verse 17, where she weeps “the seven days, while their feast lasted.” The Septuagint, the ancient Greek translation, reads “on the fourth day,” as does the Syriac; that would follow neatly from “they could not in three days expound the riddle” (verse 14), though a reading that smooths a difficulty so well may itself be a correction. One older reading keeps the Hebrew: the bride pleaded every day out of her own curiosity, and on the seventh, under the threat, she pressed hardest. Either way, the threat is the point. The guests threaten to burn her and her father’s house, and in [[Judg. 15:6]] the Philistines do it.
    sources: [oshb-wlc, lxx-rahlfs, cambridge-judges, keil-judges]

  - ref: 18
    phrase: If ye had not plowed with my heifer, ye had not found out my riddle
    kind: symbol
    title: Plowed with my heifer
    body: |
      Samson’s retort tells the men he knows how they found the answer: through his wife, the “heifer” they had plowed with, as verse 17 has just told. Samson shows himself “a tempestuous sort who, after being bested, lashed out in sarcasm and anger,” and the next verse shows the anger.
    sources: [ot-minute-judg-14]

  - ref: 19
    phrase: he went down to Ashkelon, and slew thirty men of them
    kind: history
    title: Thirty men of Ashkelon
    body: |
      Samson pays his wager with the clothing of thirty dead Philistines. To get it he went to Ashkelon, leaving the Sorek Valley for the only time in this chapter. The Spirit of the LORD came upon him before he went, with the verb of verse 6, and as there the phrase seems to speak of the strength given him (see the note on verse 6). Losing the wager, he “was furious and wreaked havoc on the Philistines at Ashkelon to get the spoils necessary to pay his debt.” The text gives the order of events (the Spirit, the killing, the payment, then “his anger was kindled”) and no verdict. How the Church reads the violence of this period is explained at [[Josh. 6:21]].
    sources: [chadwick-beit-lei, scripture-helps-judges, ot-manual-judges-13-21]

  - ref: 20
    phrase: given to his companion, whom he had used as his friend
    kind: history
    title: The best man
    body: |
      The “companion, whom he had used as his friend” was the best man at the wedding. Samson’s bride was given to him while Samson was away in anger, “probably for spite.” Samson had not regarded the marriage as over: in [[Judg. 15:1–2]] he comes back with a gift to see his wife and is told she belongs to another man. The failed marriage starts the next round of the fight: Samson’s revenge on the fields of Timnath, and the Philistines’ on his wife.
    sources: [ot-manual-judges-13-21, chadwick-beit-lei]

christ: |
  The LORD who was at work against the Philistines through a headstrong young man is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]). Judges shows Him saving Israel “no matter how flawed or sinful the judge,” and with Samson He only “begins to save”: the stories are a witness that He is gracious and long-suffering, and that His people’s disobedience “cannot thwart his plan.”

  Samson’s strength was a real gift of the Spirit, and in Judges such gifts could be lost, as his were; the portrayal of the book’s imperfect judges may teach that God-given gifts are to be preserved and developed rather than misused. A disciple’s gifts from God are likewise to be preserved and developed, not misused.

explore: |
  - [[Judg. 13:24–25]]: the Spirit begins to move Samson.
  - [[Judg. 15:1–8]]: the lost wife, the foxes, and the burning the Philistines threatened in 14:15.
  - [[Judg. 16:4–21]]: Delilah entices him, and a second secret is given up to a woman’s pleading.
  - [[1 Sam. 10:6–10]]: the same rushing Spirit on Saul, who “shalt be turned into another man.”

