chapter: 5
title: The Song of Deborah
tagline: Deborah and Barak sing the victory of chapter 4 again as a poem, in which the LORD marches from Sinai, the stars and the river fight for Israel, the tribes are praised or rebuked, and Sisera's mother waits at her window for a son who will not come home.
when: 'In the days of Shamgar and of Jael, after the victory over Sisera'

setting: |
  Judges 5 tells again, as a poem, the victory that chapter 4 tells as a story. The song is sung by Deborah and Barak together (verse 1), and it is among the earlier writings the compiler of Judges “worked into his book.” It is old. With the song the Hebrew shifts from the Classical Biblical Hebrew of the story into the older Archaic Biblical Hebrew of Israel's earliest poems, the stage of the language that the Song of the Sea also has (see the note at [[Ex. 15:1]]). It is reckoned “one of the oldest portions of the Hebrew Bible,” possibly a near-contemporary account of the battle: “a hymn of jubilant praise composed soon after the victory it celebrates.”

  The two accounts differ in what they tell. Only the song has the flood of the Kishon that swept Sisera's chariots away, only the song calls Deborah “a mother in Israel,” and only the song brings Sisera's mother to her window. Such differences suggest that the two had separate histories, but “in broad strokes” they agree.

  In the book's cycle the song stands where the deliverance is complete: Israel had done evil and been sold to Jabin for twenty years ([[Judg. 4:1–3]]), the LORD had delivered them by Deborah and Barak, and the song closes on the rest that followed, “forty years” (verse 31).

thread: |
  The song gives the victory to the LORD. Its subject is “the deliverance of the Israelites through the divine intervention of Jehovah”: Deborah sings “unto the LORD” (verse 3), recalls Him coming from Sinai in storm (verses 4–5), and tells how the stars fought from heaven and the river Kishon swept the enemy away (verses 20–21). The oppression it remembers began when Israel “chose new gods” (verse 8), the same falling away chapter 4 calls doing evil in the sight of the LORD.

  Against that, the song measures people by whether they came. Twice it praises those who “willingly offered themselves” (verses 2, 9), and it names the tribes one by one: Ephraim, Benjamin, Machir, Zebulun, Issachar and Naphtali came; Reuben deliberated, and Gilead, Dan and Asher stayed where they were (verses 14–18). A town that did not come “to the help of the LORD” is cursed (verse 23), and the wife of Heber the Kenite, who struck down Sisera, is blessed (verse 24). The song ends with two women: Jael, at whose feet Sisera fell, and his mother at her lattice, still counting the spoil. Its last line is a prayer that the LORD's enemies perish and that those who love Him shine “as the sun when he goeth forth in his might” (verse 31).

sections:
  - range: 1-3
    heading: Praise the LORD
    plain: |
      That day Deborah and Barak son of Abinoam sang this song:

      Praise the LORD for the avenging of Israel, when the people offered themselves willingly. Listen, you kings; pay attention, you rulers: I will sing to the LORD; I will sing praise to the LORD, the God of Israel.
  - range: 4-5
    heading: The LORD marches from Seir
    plain: |
      LORD, when You went out from Seir and marched from the land of Edom, the earth shook, the sky poured, and the clouds poured down water. The mountains quaked before the LORD, even Sinai, before the LORD, the God of Israel.
  - range: 6-11
    heading: Until Deborah arose
    plain: |
      In the days of Shamgar son of Anath, in the days of Jael, the main roads were empty, and travelers kept to the back paths. Village life came to an end in Israel, until I, Deborah, arose, a mother in Israel. They chose new gods, and then war came to the gates; not a shield or a spear was to be seen among forty thousand in Israel.

      My heart goes out to the leaders of Israel who offered themselves willingly among the people. Bless the LORD! You who ride on white donkeys, you who sit in judgment, and you who walk along the road, speak of it. Away from the noise of the archers, at the places where water is drawn, they will tell over the righteous acts of the LORD, His righteous acts for the villagers of Israel. Then the LORD's people went down to the gates.
  - range: 12-18
    heading: The tribes who came and the tribes who stayed
    plain: |
      Wake up, wake up, Deborah! Wake up, wake up, and sing a song! Rise up, Barak, and lead away your captives, son of Abinoam.

      Then he made the one who was left rule over the nobles of the people; the LORD made me rule over the mighty. Out of Ephraim came men whose root was against Amalek; after you came Benjamin with your people. Out of Machir came commanders, and out of Zebulun those who handle the writer's pen. The princes of Issachar were with Deborah; Issachar was there, and Barak too, sent on foot into the valley. But among the clans of Reuben there was much searching of heart. Why did you stay among the sheepfolds, to hear the flocks bleating? Among the clans of Reuben there was much searching of heart. Gilead stayed beyond the Jordan; and Dan, why did he stay by the ships? Asher stayed on the seacoast, where he lived. Zebulun and Naphtali were people who risked their lives to the death on the heights of the field.
  - range: 19-22
    heading: The stars fought from heaven
    plain: |
      The kings came and fought; the kings of Canaan fought at Taanach, by the waters of Megiddo, and they carried off no silver. The stars fought from heaven; from their courses they fought against Sisera. The river Kishon swept them away, that ancient river, the river Kishon. My soul, you have trodden down the strong! Then the horses' hooves stamped with the galloping, the galloping of their mighty ones.
  - range: 23-27
    heading: Meroz cursed, Jael blessed
    plain: |
      “Curse Meroz,” said the angel of the LORD; “curse its people bitterly, because they did not come to the help of the LORD, to the help of the LORD against the mighty.”

      Most blessed of women be Jael, the wife of Heber the Kenite; most blessed of women who live in tents. He asked for water, and she gave him milk; she brought him curds in a bowl fit for nobles. She reached for the tent peg, and her right hand for the workman's hammer. She struck Sisera, struck off his head, and pierced him through the temple. At her feet he sank, he fell, he lay still; at her feet he sank, he fell; where he sank, there he fell dead.
  - range: 28-31
    heading: Sisera's mother waits
    plain: |
      Sisera's mother looked out of a window and cried through the lattice, “Why is his chariot so long in coming? Why are the wheels of his chariots so slow?” Her wise ladies answered her, and she gave herself the same answer: “Surely they are finding and dividing the spoil: a girl or two for every man, and for Sisera dyed cloth, dyed cloth embroidered, embroidered on both sides, for the necks of those who take the spoil.”

      So may all Your enemies perish, O LORD; but let those who love Him be like the sun when it rises in its strength. And the land had rest for forty years.

notes:
  - ref: 2
    phrase: for the avenging of Israel
    kind: words
    title: When the locks grew long
    body: |
      The King James “avenging” renders a Hebrew phrase whose meaning is uncertain, and one older reading finds in it a picture of warriors under a vow. In that reading the verb means to loosen or let go, especially to let the hair hang loose, and the related noun is used of the long locks of the Nazarites ([[Num. 6:5]]). Wearing the hair long marked a vow not to do certain things until an end was reached, kept by Nazarites and by warriors bent on vengeance; so the line may be translated “when the locks grew long in Israel,” that is, when the warriors took their vow. A modern translation has “When locks are long in Israel.” The standard lexicon allows a different sense, a verb meaning to act as leader, and marks it with a question mark. Either way, “the exact sense of the verse is doubtful.”

      The second line is clearer, and the song says it twice: the people “willingly offered themselves” (verses 2, 9). It is the language of volunteering for battle, suggesting a “dedication to the purposes of Yahweh,” a blessing that came on the people when the LORD raised up a judge. The song praises those who came; verses 15–17 and 23 name those who did not.
    sources: [bdb, cambridge-judges, nrsvue, schade-broken-laws]

  - ref: 4
    phrase: when thou wentest out of Seir
    kind: symbol
    title: The LORD marches from Sinai
    body: |
      The song opens the battle with the LORD Himself on the march, as He came to Israel at Sinai. The Song of Deborah, like the Song of the Sea, is “one of the classic examples of God being depicted as a divine warrior” (see the note at [[Ex. 15:3]]): He marches like a commander through the wilderness of Sinai with Israel as His army, and earthquake and pouring rain go with His coming.

      Psalm 68 shares much of this wording for God's march through the wilderness (“The earth shook, the heavens also dropped at the presence of God: even Sinai itself was moved”); the two passages are compared at [[Ps. 68:8]].
    sources: [ot-minute-judg-5, lds-scriptures]

  - ref: 7
    phrase: I arose a mother in Israel
    kind: history
    title: A mother in Israel
    body: |
      Deborah's title, “a mother in Israel,” can be read by what she did for the nation rather than by any children of her own. She is one of only two people given that title. Judges 4:4 names her husband, Lapidoth, but the text says nothing of children, so the title can't be reduced to a statement that she had borne them. In the song it stands beside her leading: Israel suffered “until that I Deborah arose,” and the verses that follow tell of her going with the princes of Issachar and Barak into the battle. Read so, the title rests on “her active role in leading, judging, and delivering Israel”; she gave life to the nation by saving it.

      Singing the song may itself belong to her office as prophetess, as Miriam the prophetess sang after the crossing of the sea ([[Ex. 15:20–21]]). Deborah as judge and prophetess is taken up at [[Judg. 4:4]], and the women of the period in the guide *Women and Marriage*.
    sources: [shannon-models-motherhood]

  - ref: 12
    phrase: lead thy captivity captive
    kind: scripture
    title: Lead thy captivity captive
    body: |
      “Lead thy captivity captive” means “lead captive thy captives”: Barak is called to march off the prisoners he has taken. The Hebrew sets a verb and a noun from the same root side by side, which the King James renders literally; a modern translation has “lead away your captives.”

      The same verb and noun return in a psalm, in the ascent of God as conqueror: “thou hast led captivity captive” ([[Ps. 68:18]]). Paul quotes that verse of Jesus Christ: “When he ascended up on high, he led captivity captive, and gave gifts unto men” ([[Eph. 4:8]]). The psalm's use of the words, and Paul's, are taken up at [[Ps. 68:18]].
    sources: [bdb, nrsvue, oshb-wlc, lds-scriptures]

  - ref: 16
    phrase: For the divisions of Reuben there were great searchings of heart
    kind: history
    title: The tribes that stayed home
    body: |
      Verses 15–17 rebuke the tribes that did not come to the battle, beginning with Reuben. The song first names those who came (verses 14–15) and closes on Zebulun and Naphtali, who “jeoparded their lives unto the death” (verse 18). Between them stand the tribes that stayed away. In one older reading, Reuben's “searchings of heart” were real: the tribe felt the call, held its meetings and made great resolutions, but nothing came of them, and it preferred the quiet of the shepherd's life. The question “Why abodest thou among the sheepfolds?” is amazement, and its irony is in what Reuben stayed to hear: the bleating of flocks in place of the war trumpets. Another older reading takes the two lines as the sounding out of opinion among Reuben's clans; the meaning of the word for “sheepfolds” is uncertain.

      Gilead stayed beyond the Jordan, Dan by its ships, and Asher on its coast (verse 17). The song asks its questions and does not curse them; the curse falls on Meroz (verse 23).
    sources: [keil-judges, cambridge-judges]

  - ref: 21
    phrase: The river of Kishon swept them away
    kind: history
    title: The stars and the river
    body: |
      The song pictures what the story leaves unexplained, the Kishon in flood. Judges 4:15 says only that the LORD “discomfited” Sisera's army. The song says, “They fought from heaven; the stars in their courses fought against Sisera” (verse 20), and then tells of a flash flood in the Kishon, apparently a miraculous one, that appears to have impeded the Canaanite chariots. One reconstruction pictures a terrible storm, with rain pouring down the mountainside to fill the Kishon and spread over the plain. One older reading takes the stars as, in all probability, that same storm told from the sky: the powers of heaven fought beside Israel, and thunder, lightning and hail, or a sudden cloudburst, “is poetically described as though the stars of heaven had left their courses to fight for the Lord.” It grants that the verse does not let a reader say exactly what happened, only that heaven fought on Israel's side. Sisera's strength was his nine hundred chariots of iron ([[Judg. 4:3]]), and in the song heaven and the river are what overcame them.

      A psalm remembers the battle in a prayer against Israel's enemies; see the note at [[Ps. 83:9]].
    sources: [ot-minute-judg-5, litchman-deborah, keil-judges]

  - ref: 23
    phrase: Curse ye Meroz
    kind: history
    title: The curse on Meroz
    body: |
      Meroz is cursed because its people did not come “to the help of the LORD,” and the curse is spoken by the angel of the LORD. The town is not mentioned again, and where it stood is unknown. One older reading suggests it lay on the route of Sisera's flight, so that its people, though Israelites, could have stopped him and did not; another older reading takes the curse in that sense from the verse that follows, where Jael, who did stop him, is blessed. The two verses stand side by side: the Israelite town that would not help is cursed, and the Kenite woman who did is blessed.

      In one older reading, the curse is given as the angel's word because it was the angel of the LORD who fought for Israel at Megiddo, so that those who held back failed to help the LORD Himself. Who the angel of the LORD is in Judges is explained at [[Judg. 6:22]].
    sources: [keil-judges, cambridge-judges]

  - ref: 24
    phrase: Blessed above women shall Jael the wife of Heber the Kenite be
    kind: history
    title: Jael blessed above women
    body: |
      The song blesses Jael for the deed of [[Judg. 4:21]], and tells it differently. In the story Sisera is asleep when she strikes; the song seems to have him drinking, and verses 25–27 give the deed in short, repeated lines: he asked water, she gave milk, curds in a dish fit for nobles; her hand to the peg, her right hand to the hammer; at her feet he bowed and fell. Jael was the wife of Heber the Kenite, whose clan had peace with Jabin ([[Judg. 4:17]]); on the Kenites see the note at [[Judg. 1:16]].

      Her blessing completes Deborah's word to Barak. Because he would not go without her, the honor of the victory would not be his, “for the LORD shall sell Sisera into the hand of a woman” ([[Judg. 4:9]]), a word fulfilled by Jael. What she did, and what the text says and does not say of it, is taken up at [[Judg. 4:21]].
    sources: [bd-jael, ot-minute-judg-4]

  - ref: 28
    phrase: The mother of Sisera looked out at a window
    kind: history
    title: Sisera's mother at the window
    body: |
      The song ends its story in the enemy's house, with a mother who does not yet know that her son is dead. She is found only in the song, which pictures her waiting in vain at her window for his return. The verses follow directly on verse 27, where Sisera “fell down dead” at Jael's feet. She asks why his chariot is slow; her ladies answer, and she answers herself, that the army must be dividing the spoil, “a damsel or two” for every man (a modern translation has “A woman or two”) and embroidered cloth for Sisera.

      Judges records violence done by women and celebrated by them, by Deborah and, “in her own blind way, Sisera's mother.” The song does not say what she felt when the truth came. It turns at once to its prayer: “So let all thine enemies perish, O LORD” (verse 31).
    sources: [ot-minute-judg-5, nrsvue, schade-broken-laws]

christ: |
  The LORD of the song, who marches from Sinai and fights from heaven for Israel, is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]), and the song's subject is His deliverance of Israel. He is “the Redeemer of Israel” who is “always willing to deliver us and welcome us back as we return to Him.”

  Deborah answered her deliverance with a song, and the Lord has said in this dispensation that “the song of the righteous is a prayer unto me, and it shall be answered with a blessing upon their heads” ([[D&C 25:12]]). A disciple's hymns of thanks for what the Lord has done are prayers He hears and answers with blessing.

explore: |
  - [[Judg. 4]]: the story of the same battle, to read beside the song verse by verse.
  - [[Ex. 15:1–21]]: the Song of the Sea, the other old victory song, with Miriam the prophetess.
  - [[Ps. 68]]: a psalm that shares the song's march from Sinai and its “captivity captive,” with [[Eph. 4:8]].
  - “Models of Motherhood,” a Religious Studies Center study (see the note at verse 7): on Deborah as judge, prophetess and “mother in Israel.”

