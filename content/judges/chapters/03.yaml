chapter: 3
title: The LORD Raised Up a Deliverer
tagline: The nations left in the land test a new generation; the first two cycles turn, Othniel's in five verses and Ehud's in a sharp and comic story, and Shamgar gets one line.
when: 'The generations after Joshua, “as many of Israel as had not known all the wars of Canaan”'

setting: |
  Judges 3 sits on a seam. Its first six verses close the book's introduction (1:1–3:6), and verse 7 opens the long middle of the book, the history of the judges: “a succession of periods of rebellion against God, and the oppressions and deliverances by which they were followed.” Chapter 2 laid out that pattern in general ([[Judg. 2:11–19]]); chapter 3 shows it working for the first time.

  The chapter gives three deliverers. Othniel of Judah, Caleb's younger brother, already known from Joshua as the man who took Debir and married Achsah ([[Josh. 15:17]]), gets five verses, the prototype of the cycle that the stories of Ehud, Deborah and Gideon then play out. Ehud of Benjamin gets nineteen, detailed, ironic and vivid. Shamgar gets one.

  Cushan-rishathaim comes from Mesopotamia; Eglon comes from Moab, across the fords of the Jordan (verse 28). The Church's footnotes join the chapter to three later passages. Habakkuk sees the tents of “Cushan” tremble at the Lord's coming ([[Hab. 3:7]]). Nehemiah's prayer remembers the period: “according to thy manifold mercies thou gavest them saviours, who saved them out of the hand of their enemies” ([[Neh. 9:27]]). Psalm 106 says that Israel “were mingled among the heathen, and learned their works” ([[Ps. 106:35]]), beside the dwelling among the Canaanites of verse 5.

thread: |
  The chapter moves from a test to two answers. It begins with the nations left in the land “to prove Israel” (verses 1–4), and with Israel's failure of the test in two verses: they lived among the Canaanites, married them, and “served their gods” (verses 5–6).

  Then the cycle of [[Judg. 2:11–19]] runs for the first time, with every step named. Israel did evil and forgot the LORD; He sold them to Cushan-rishathaim; they served him eight years; they cried; the LORD raised up a deliverer; the Spirit came upon him; he judged and fought; the land had rest forty years; the judge died (verses 7–11). There is nothing else in it: no speech, no scene, hardly a detail. It reads like a form waiting to be filled in.

  The second cycle fills it in. The same steps return (evil again, an oppressor strengthened, eighteen years, a cry, a deliverer, eighty years of rest), but between them the narrator tells a story “rich with deep irony and humor.” A left-handed man from the tribe whose name means “son of the right hand” carries tribute to a king so fat that the dagger disappears into him. The king's servants wait outside a locked door out of embarrassment while the killer escapes. Eglon's name has been read as “cow,” which makes the fat king the “fattened cow.” The two accounts side by side show the narrator's range, from “the laconic and terse to the highly literary and descriptive.” Through both, the text keeps the credit where Ehud himself puts it: “the LORD hath delivered your enemies the Moabites into your hand” (verse 28).

  Shamgar closes the chapter in a single verse, with six hundred Philistines and an ox goad. No oppression is given, no cry, no years and no rest, and he is not said to have judged. He “also delivered Israel,” and Deborah's song remembers the dangerous roads “in the days of Shamgar the son of Anath” ([[Judg. 5:6]]).

sections:
  - range: 1-6
    heading: The nations left to prove Israel
    plain: |
      These are the nations the LORD left in the land to test Israel, all the Israelites who had not been through the wars for Canaan. He left them only so that the new generations of Israel, those who had never known that warfare, would learn what war was. They were the five lords of the Philistines, all the Canaanites, the Sidonians, and the Hivites who lived in the Lebanon mountains from Mount Baal-hermon to the entrance of Hamath. They were left to test Israel, to see whether the people would obey the commandments the LORD had given their ancestors through Moses. And the Israelites lived among the Canaanites, Hittites, Amorites, Perizzites, Hivites and Jebusites. They took the daughters of these peoples as wives, gave their own daughters to the men of these peoples, and served their gods.
  - range: 7-11
    heading: Othniel
    plain: |
      The Israelites did what was evil in the LORD's sight. They forgot the LORD their God and served the Baals and the Asherahs. The LORD's anger burned against Israel, and He sold them into the power of Cushan-rishathaim, king of Mesopotamia, and they served him eight years. When the Israelites cried out to the LORD, He raised up a deliverer for them, Othniel the son of Kenaz, Caleb's younger brother, and he rescued them. The Spirit of the LORD came upon him. He judged Israel and went out to war, and the LORD gave Cushan-rishathaim into his hand, and he overpowered him. The land had rest for forty years. Then Othniel the son of Kenaz died.
  - range: 12-14
    heading: Eglon of Moab
    plain: |
      Again the Israelites did what was evil in the LORD's sight, and because of it the LORD made Eglon king of Moab strong against Israel. Eglon brought the Ammonites and the Amalekites in with him, attacked Israel, and took the City of Palms. The Israelites served Eglon king of Moab for eighteen years.
  - range: 15-23
    heading: Ehud's message
    plain: |
      Then the Israelites cried out to the LORD, and He raised up a deliverer for them: Ehud the son of Gera, a Benjamite, a left-handed man. The Israelites sent their tribute to Eglon king of Moab by him. Ehud made himself a two-edged dagger a cubit long and strapped it to his right thigh under his clothes. He presented the tribute to Eglon, who was a very fat man. When he had finished, he sent off the men who had carried it. But he himself turned back at the stone quarries near Gilgal and said, “I have a secret message for you, O king.” The king said, “Silence!” and all his attendants went out. Ehud came in to him as he sat alone in his cool upper room and said, “I have a message from God for you.” The king rose from his seat. Ehud reached with his left hand, took the dagger from his right thigh, and drove it into the king's belly. The handle went in after the blade, the fat closed over it, and he could not pull it out; and the king's bowels emptied. Ehud went out through the porch, shut the doors of the upper room behind him, and locked them.
  - range: 24-30
    heading: Escape and victory
    plain: |
      After he had gone, the king's servants came and found the doors of the upper room locked. They said, “He must be relieving himself in the cool room.” They waited until they were embarrassed, and still he did not open the doors. So they took the key and opened them, and there was their master, fallen dead on the floor. Ehud had escaped while they waited. He passed the quarries and got away to Seirah. When he arrived, he blew the trumpet in the hill country of Ephraim, and the Israelites came down from the hills with him at their head. “Follow me,” he told them, “for the LORD has given your enemies the Moabites into your hand.” They went down after him, seized the fords of the Jordan leading to Moab, and let no one cross. They killed about ten thousand Moabites at that time, all strong and able fighters; not one escaped. So Moab was brought under Israel's hand that day, and the land had rest for eighty years.
  - range: 31-31
    heading: Shamgar
    plain: |
      After Ehud came Shamgar the son of Anath, who killed six hundred Philistines with an ox goad. He too delivered Israel.

notes:
  - ref: 1
    phrase: Now these are the nations which the LORD left, to prove Israel by them
    kind: history
    title: Why the nations were left
    body: |
      The nations were left as a test, and the chapter gives the test two names. Verse 4 repeats the reason of [[Judg. 2:22]], to learn “whether they would hearken unto the commandments of the LORD”; the cycle as a whole is framed as a test of Israel's faith. Verse 2 adds a reason that sounds stranger: “to teach them war.” Why would the LORD want a generation to learn fighting?

      The people meant are those who had not seen “the wars of Canaan” for themselves. One older reading, taking them as the generation that rose after Joshua, understands “learning war” as learning what Joshua's generation had learned the hard way: that Israel's victories came not from its numbers or its courage but from the LORD, who fought for Israel only while it kept the covenant (Achan's sin had cost a battle, [[Josh. 7:1–5]]). On that reading the two reasons are one. A generation that learned to fight Israel's way would learn to keep the commandments at the same time.

      The land not taken, and how Judges and Joshua tell it, belongs to [[Josh. 13:1]] and to chapter 1; the snares the nations became are at [[Judg. 2:3]].
    sources: [ot-minute-judg-2, keil-judges]
  - ref: 6
    phrase: And they took their daughters to be their wives, and gave their daughters to their sons, and served their gods
    kind: scripture
    title: Marriage and the gods of the land
    body: |
      The verse puts the marriages before the gods: Israel married the peoples it lived among, and then served their gods. Moses had warned of that very sequence: “Neither shalt thou make marriages with them…. For they will turn away thy son from following me, that they may serve other gods” ([[Deut. 7:3–4]]). Here the warning is ignored, and the worship that followed did not stay with one generation; it was handed down, and it broke the covenant.

      Nothing forced this. Israel was “Canaanized” by choice. Living in the middle of Canaanite towns made their customs and worship near at hand and attractive, and the people took them up until their practice ran against their covenants. The next verse names the result in the words of the frame; Baal and the “groves” (Asherah) are explained at [[Judg. 2:13]].
    sources: [ot-manual-judges-1-12, schade-broken-laws]
  - ref: 8
    phrase: he sold them into the hand of Chushan-rishathaim king of Mesopotamia
    kind: history
    title: Cushan of double wickedness
    body: |
      Nothing is known of this king beyond these verses. “Mesopotamia” is the King James rendering of *ʾăram nahărayim*, “Aram of the two rivers,” the land of the Euphrates and the Tigris, and the Bible names him nowhere else.

      *Rishathaim* means “double wickedness,” and the Aramaic Targums and the Syriac version translated it that way, as a description rather than a name. One older reading takes the whole as probably a title Israel gave him rather than his own name: Cushan the Doubly Wicked.

      The verb matters too. The LORD “sold them” (as in [[Judg. 2:14]]): the verse describes Israel's own God handing them over to the oppressor.
    sources: [bdb, keil-judges]
  - ref: 9
    phrase: the LORD raised up a deliverer to the children of Israel
    kind: words
    title: A deliverer, a saviour
    body: |
      “Deliverer” is *môšîaʿ*, a participle of the verb *yāšaʿ*, “to help” or “save.” It means a champion who rescues someone in battle or oppression, and the same word is used of Ehud (verse 15). Nehemiah remembers the judges as the “saviours” the LORD gave ([[Neh. 9:27]]); the note at [[Obad. 1:21]] follows the word further, and what a “judge” was is at [[Judg. 2:16]].

      The verse also says what brought the deliverer: Israel “cried unto the LORD.” It is the cry of someone in need or distress, and in Judges it “does not seem to be a form of repentance,” nor a condition the LORD sets before He delivers. Repentance is seldom part of the cry: only at [[Judg. 10:10–16]] do the people admit their sin and change what they do, and they put away their gods only after the LORD has told them, “I will deliver you no more” ([[Judg. 10:13]]). The cycles grow worse instead of being repaired by true repentance.
    sources: [biblehub-interlinear, sc-knowhy-104, schade-broken-laws]
  - ref: 10
    phrase: And the Spirit of the LORD came upon him, and he judged Israel
    kind: history
    title: Othniel, the first judge
    body: |
      Othniel is the cycle's model judge. He is of Judah, a tribe the book's narrator puts first, and is the Othniel who took Debir in Caleb's day ([[Josh. 15:17]]; [[Judg. 1:13]]).

      The key line is this one. The Spirit of the LORD came upon him, and it gave him the power both to judge Israel and to lead it in war. Othniel is the first of several on whom “the Spirit of the LORD came” in Judges. What that means for the others, Samson above all, is taken up at [[Judg. 14:6]].
    sources: [ot-minute-judg-3]
  - ref: 11
    phrase: And the land had rest forty years
    kind: history
    title: Rest, in round numbers
    body: |
      “Rest” is the last step of the cycle: the LORD was with the judge and kept the enemy off “all the days of the judge,” and when the judge died the people turned back ([[Judg. 2:18–19]]; here verses 11–12). The numbers should not be pressed. The compiler “generally gives his figures in round numbers,” and since a judge's influence sometimes reached only part of the land, two judges might have been in office at once. Forty comes three times (3:11; 5:31; 8:28), and Ehud's eighty (verse 30) is twice it. They are not added up into a chronology.
    sources: [bd-judges]
  - ref: 12
    phrase: the LORD strengthened Eglon the king of Moab against Israel
    kind: history
    title: The LORD strengthened Eglon
    body: |
      The verse says the LORD gave strength to Israel's enemy, and it says why twice: “because they had done evil in the sight of the LORD.” God was never absent from Israel's story: the same God who strengthened the oppressor three verses later “raised them up a deliverer” (verse 15).

      Eglon brought in Ammon and Amalek and took “the city of palm trees,” Jericho ([[Deut. 34:3]]), evidently rebuilt near its old site after Joshua destroyed it: the first city Israel took in the land was now the oppressor's.
    sources: [ot-manual-judges-1-12, schade-broken-laws]
  - ref: 15
    phrase: Ehud the son of Gera, a Benjamite, a man lefthanded
    kind: words
    title: A left-handed son of the right hand
    body: |
      “Lefthanded” is literally *ʾiṭṭēr yad-yĕmînô*, a man “bound, restricted, as to his right hand.” The same phrase describes seven hundred picked men of Benjamin who could “sling stones at an hair breadth, and not miss” ([[Judg. 20:16]]), so it was no bar to skill with the other hand.

      The phrase stands beside another one with “right hand” in it. “Benjamite” is *ben-hayyĕmînî*, and Benjamin means “son of the right hand.” So the verse calls him, in effect, a son of the right hand whose right hand was restricted, and that is one of the jokes in the story. It is also what makes the plan work. A left-handed man wore his dagger on the right thigh (verse 16), the opposite side from the usual one, and so it went undetected until the left hand reached for it (verse 21).
    sources: [bdb, biblehub-interlinear, ot-minute-judg-3]
  - ref: 20
    phrase: I have a message from God unto thee
    kind: history
    title: A “word” from God
    body: |
      Ehud's two lines to the king use the same Hebrew word. In verse 19 he has a “secret errand,” *dĕbar sēter*; in verse 20 “a message from God,” *dĕbar ʾĕlōhîm*. *Dābār* means a word or message, but also a thing or matter. Eglon rose from his seat; in one older reading he stood out of reverence for the word of God he expected. One Latter-day Saint reading sees the irony: what Ehud actually had from God was the dagger, and his misleading language made Eglon drop his guard.

      Was the deception right? The text does not say. It calls Ehud the LORD's deliverer (verse 15), tells the killing without comment, and lets Ehud credit the victory to the LORD (verse 28); the deliverance was “a feat of valor.” One older reading observes that the text never says the Spirit of the LORD came upon Ehud, as it did upon Othniel (verse 10), and so it does not follow that the means he chose were “commanded or approved” by the LORD. Rahab's deception is read the same way at [[Josh. 2:4]]: the text records it without comment.
    sources: [biblehub-interlinear, ot-minute-judg-3, bd-ehud, keil-judges]
  - ref: 24
    phrase: Surely he covereth his feet in his summer chamber
    kind: words
    title: '“He covereth his feet”'
    body: |
      The King James wording is a fairly literal rendering of the Hebrew but hides the fact that it is almost certainly a euphemism for relieving oneself: the servants assume that is what the king is doing.

      The detail is there because the escape turns on it. The locked doors told the servants their master wanted privacy, and they were afraid to disturb him, so they waited outside “till they were ashamed” of waiting, and every minute of their embarrassment was a minute for Ehud to get past the quarries and up into the hills of Ephraim (verses 26–27).
    sources: [ot-minute-judg-3]

christ: |
  The LORD of Judges is Jehovah, the premortal Christ ([[Ex. 3:14]]), and Judges 3 shows Him at work in both halves of the cycle: He sells His people to the oppressor when they forget Him, and He raises up the deliverer when they cry. The pattern of the chapter, “did evil,” “cried unto the Lord,” “raised up a deliverer,” teaches about the Savior's power to deliver from sin. The judges were deliverers, *môšîaʿ*, and the same word names the One who raised them: “I the LORD am thy Saviour and thy Redeemer” ([[Isa. 49:26]]).

  Othniel and Ehud delivered Israel for a generation and then died; the Deliverer the pattern points to is the LORD who raised them up. The cry He answered in this chapter came after Israel's own disobedience (verses 7–8, 12), from a people in bondage of their own making, and His power to deliver from sin reaches people in that same place.

explore: |
  - **The cycle at full length.** Read [[Judg. 2:11–19]] beside this chapter, then Nehemiah's summary of it in [[Neh. 9:26–28]].
  - **Othniel before he judged.** [[Josh. 15:13–19]] and [[Judg. 1:11–15]].

parallels:
  - ref: Neh. 9:27
    note: Nehemiah's prayer remembers the judges as “saviours” the Lord gave in His mercy.
  - ref: Hab. 3:7
    note: The tents of Cushan tremble at the Lord's coming; the Church's footnote joins the name to Cushan-rishathaim.

