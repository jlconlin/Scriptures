chapter: 12
title: Say Now Shibboleth
tagline: Ephraim threatens Jephthah for fighting Ammon without them; Gilead defeats Ephraim and kills its fugitives at the fords of the Jordan by a word they cannot say; Jephthah dies, and Ibzan, Elon and Abdon judge Israel in turn.
when: 'After Jephthah’s war with Ammon (verse 1), east of the Jordan'

setting: |
  Chapter 12 finishes the story of Jephthah begun in [[Judg. 11]]. He has defeated the Ammonites and done with his daughter “according to his vow” ([[Judg. 11:39]]); now the trouble comes from his own side of the covenant. Jephthah's people are the men of Gilead, the highland east of the Jordan that was assigned to Gad and half of Manasseh. Across the river lay Ephraim, the tribe of Joshua, which with Manasseh held some of the richest land in the country and had already quarrelled with Gideon for leaving it out of a victory ([[Judg. 8:1]]).

  The chapter then closes with three short records: Ibzan, Elon and Abdon, judges of whom nothing is told but their families, their years and their graves, like Tola and Jair in [[Judg. 10:1–5]]. After them comes Samson. The guide [The Conquest, the Judges, and One Kingdom](/old-testament/guides/the-conquest-judges-and-kingdom/#rulers) places Jephthah among the other judges.

thread: |
  The chapter has no foreign enemy. Ammon is beaten, and the war that follows is Israel against Israel. Ephraim crosses the river with a threat (verse 1), Jephthah answers with a grievance of his own and then with the sword (verses 2–4), and the fords of the Jordan, which Israel had seized against Moab and Midian ([[Judg. 3:28]]; [[Judg. 7:24]]), are seized now against Ephraim (verse 5). A single word decides who lives (verse 6), and the book does not comment.

  Then the story stops, and Jephthah's six years and burial are told in the short formula used of the minor judges (verse 7). On one older reading he judged only the tribes east of the Jordan, and the three judges after him (verses 8–15) succeeded him over the same eastern tribes, and perhaps the northern ones. They have no deeds at all, only households and years. After the din of the fords the record goes quiet: a large family, a term in office, a grave.

sections:
  - range: 1-3
    heading: Ephraim’s threat
    plain: |
      The men of Ephraim mustered, crossed over northward, and said to Jephthah, “Why did you cross over to fight the Ammonites without calling us to go with you? We will burn your house down over you!” Jephthah answered, “My people and I were in a fierce struggle with the Ammonites. I called you, and you did not save me from them. When I saw that you would not save me, I took my life in my hands and crossed over against the Ammonites, and the LORD gave them into my hand. So why have you come up against me today to fight me?”
  - range: 4-7
    heading: The fords of the Jordan
    plain: |
      Then Jephthah gathered all the men of Gilead and fought Ephraim, and the Gileadites struck Ephraim down, because the Ephraimites had said, “You Gileadites are nothing but runaways from Ephraim, living among Ephraim and Manasseh.” The Gileadites seized the fords of the Jordan against the Ephraimites. Whenever one of the Ephraimites who had escaped said, “Let me cross,” the men of Gilead asked him, “Are you an Ephraimite?” If he said, “No,” they told him, “Then say ‘Shibboleth.’” If he said “Sibboleth,” because he could not say it right, they seized him and killed him at the fords of the Jordan. Forty-two thousand Ephraimites fell at that time. Jephthah judged Israel six years. Then Jephthah the Gileadite died and was buried in a town of Gilead.
  - range: 8-15
    heading: Ibzan, Elon and Abdon
    plain: |
      After him Ibzan of Bethlehem judged Israel. He had thirty sons and thirty daughters. He gave his daughters in marriage outside the family, and brought in thirty young women from outside it as wives for his sons. He judged Israel seven years. Then Ibzan died and was buried at Bethlehem. After him Elon of Zebulun judged Israel ten years. Elon of Zebulun died and was buried at Aijalon in the land of Zebulun. After him Abdon son of Hillel, of Pirathon, judged Israel. He had forty sons and thirty grandsons, who rode on seventy young donkeys. He judged Israel eight years. Then Abdon son of Hillel of Pirathon died and was buried at Pirathon in the land of Ephraim, in the hill country of the Amalekites.

notes:
  - ref: 1
    phrase: didst not call us to go with thee?
    kind: history
    title: Ephraim’s grievance again
    body: |
      Ephraim makes the complaint it made to Gideon ([[Judg. 8:1]]), and this time it comes with a threat to burn Jephthah's house over his head. The complaint was in character: Ephraim was “notorious for its jealousy of any success gained by any other tribe,” on the evidence of this quarrel and the one with Gideon.

      One older reading explains the jealousy as a claim to lead. Ephraim, it says, “was striving after the leadership,” and only Gideon's moderation had kept that earlier quarrel from becoming war. Now the tribes east of the Jordan had beaten Ammon under a commander of their own choosing, and without Ephraim. The same reading takes the word translated “northward” as a place name, Zaphon, a town of Gad in the Jordan valley ([[Josh. 13:27]]). The word is usually read as a direction, and the text does not decide between the two.
    sources: [bd-ephraim, keil-judges]

  - ref: 3
    phrase: I put my life in my hands
    kind: history
    title: Jephthah’s answer
    body: |
      Jephthah answers Ephraim's charge with one of his own: he did call them, and they did not come (verse 2). Chapter 11 records no such call. “I put my life in my hands” means “I risked my life”; the same words are used of David going out against the Philistine ([[1 Sam. 19:5]]).

      The answer is not Gideon's. Gideon had calmed Ephraim by giving it the credit (see the gleaning and the vintage at [[Judg. 8:2]]). Jephthah gives it nothing: Gideon “had appeased them, but Jephthah bluntly reminded them” that they had sent no help. Hanging back “until the victory was won” and then complaining at being left out may have been Ephraim's habit.
    sources: [ot-manual-judges-1-12, lds-scriptures]

  - ref: 4
    phrase: Ye Gileadites are fugitives of Ephraim among the Ephraimites, and among the Manassites
    kind: words
    title: Fugitives of Ephraim
    body: |
      The sense of the insult that turned the quarrel into a battle is uncertain. Read as it stands, it is contempt. One older reading takes it to mean that the Gileadites were a rabble of Ephraimite runaways, “men of no name,” living between the two great tribes of Joseph. The word *pālîṭ*, “fugitive,” means one who has escaped from danger. Another older reading finds that the words “make no sense where they stand”: some manuscripts of the Septuagint leave them out, and the clause may have been copied into the wrong place from verse 6.

      Read in its present place, the clause is turned around by the next verse. “Those Ephraimites which were escaped” (verse 5) are, in the Hebrew, the same *pelîṭê ʾefrayim*, “fugitives of Ephraim,” now in the plain sense: men escaping from the battle and trying to get home. Those who called Gilead a pack of runaways are now the runaways, and Gilead is waiting for them at the river.
    sources: [keil-judges, cambridge-judges, bdb, oshb-wlc]

  - ref: 6
    phrase: 'Say now Shibboleth: and he said Sibboleth'
    kind: words
    title: Shibboleth
    body: |
      The test turned on the word's first sound, not on its meaning. *Shibbōlet* is an ordinary word, “ear of grain,” and it can also mean a stream or flood; one older reading prefers “stream” here, another thinks this early story meant “ear.” Either way the meaning did not matter. What mattered was the opening *sh*. The Ephraimites said the word “without the sh sound,” and the Hebrew writes their answer, *sibbōlet*, with a different letter, *samekh* (ס) in place of *shin* (ש). The older commentaries take this as evidence of a dialect: the Ephraimites “generally pronounced sh (shin) like s,” a difference in speech between the tribes on the two sides of the river. A man could deny he was an Ephraimite, but he could not hide how he spoke.

      “He could not frame to pronounce it right” means he could not manage to say it. The Hebrew verb here is uncertain; one older reading changes it slightly to read “was not able,” as the Syriac does. The forty-two thousand who fell is a very large number. One older reading calls it “an exaggeration”; the other way of reading such numbers in Judges, with *ʾelef* as a military unit rather than a thousand, is explained at [[Judg. 8:10]].
    sources: [bdb, oshb-wlc, cambridge-judges, keil-judges, spendlove-shibboleth]

  - ref: 8
    phrase: Ibzan of Beth-lehem
    kind: history
    title: Which Bethlehem?
    body: |
      Ibzan's Bethlehem is probably not the town of Ruth and David. There were two: Bethlehem of Judah, and a Bethlehem among the towns of Zebulun ([[Josh. 19:15]]). Josephus placed Ibzan in Judah's. Two older commentaries prefer Zebulun's: one because Judah's town is usually marked as Bethlehem “of Judah,” as Judges itself does at [[Judg. 17:7]], the other because the book “is not concerned with Judah.” The text does not settle it, and nothing else is told of Ibzan to settle it either.
    sources: [keil-judges, cambridge-judges, lds-scriptures]

  - ref: 9
    phrase: he had thirty sons, and thirty daughters
    kind: history
    title: A household instead of a deed
    body: |
      For Ibzan, and for Abdon after him, the record gives no battle, only the size of the house. The mention, from time to time in Judges, of a judge's many sons and daughters, and of colts enough to mount them, “seems to be something of an ancient symbol of status”: a judge's standing showed in his family. Ibzan's sixty children also married outside his family. He gave his thirty daughters in marriage and brought in thirty wives for his sons (“abroad” here means outside the family). Abdon's forty sons and thirty grandsons (the Hebrew behind the King James “nephews”) on seventy young donkeys (verse 14) are the same kind of picture as Jair's thirty sons on thirty colts ([[Judg. 10:4]], where riding young donkeys is explained).
    sources: [ot-manual-judges-1-12, lds-scriptures]

christ: |
  Jephthah gives the victory to the one who won it: “the LORD delivered them into my hand” (verse 3). That LORD is Jehovah, the premortal Jesus Christ ([[Ex. 3:14]]), and the book of Judges shows a God with “compassion and unending love for his people even in their imperfection.” What He did not yet end was the envy between the tribes that marks this verse and Gideon's ([[Judg. 8:1]]), and the promise of [[Isa. 11:13]] is read as meaning that “through the operation of the gospel of Jesus Christ, the envy of Judah and Ephraim shall cease.”

  The jealousy that cost forty-two thousand lives at the fords began with a tribe's complaint that it had not been called to share a victory (verse 1). The gospel that is to end the envy of Ephraim and Judah is the same gospel that answers that envy among the Lord’s people now.

explore: |
  - [[Judg. 8:1–3]]: Ephraim’s same complaint, and Gideon’s answer that ended it.
  - [[Judg. 10:1–5]]: Tola and Jair, recorded in the same short way as Ibzan, Elon and Abdon.
  - [[Isa. 11:12–13]]: the promise that Ephraim shall not envy Judah.
  - [[Judg. 20]]: the book’s last war of Israel against Israel.

