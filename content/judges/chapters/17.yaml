chapter: 17
title: Micah’s House of Gods
tagline: Silver dedicated to the LORD becomes a graven image; Micah sets up a shrine with an ephod and teraphim, makes his son a priest, and then hires a wandering Levite, sure that the LORD will now do him good.
when: 'When there was no king in Israel (verse 6), in the hill country of Ephraim'

setting: |
  Chapter 17 begins the last part of Judges. The Bible Dictionary divides the book into an introduction, the history of the judges, and “two narratives, which specially show the tendency to idolatry and lawlessness” (chapters 17–21). The first narrative (17–18) tells how a private shrine in the hill country of Ephraim came to be, and how the tribe of Dan carried off its image and its priest when it moved north. The second (19–21) is the crime at Gibeah and the war it caused.

  These stories are not dated. They happen “in those days” when “there was no king in Israel” (verse 6), and their details point early in the period: Phinehas, Aaron’s grandson, still stands before the ark in [[Judg. 20:28]], and the priest of Dan’s image is named at [[Judg. 18:30]]. One older reading takes the first story to show how soon after Joshua’s death Israel began to worship Jehovah through an image. A shrine like Micah’s was not unusual. The worship of Jehovah “was in no way restricted to the precincts of the sanctuary of the Ark”; there were local sanctuaries, “sometimes in private hands, as in the case of Micah.” Who was to serve as priest, and who as Levite, is set out in the guide [The Temple and Worship](/old-testament/guides/temple-and-worship/#priests).

thread: |
  The chapter is a run of religious acts by people who invoke the LORD (verses 2, 3, 13), and the first of them is the one His law forbade most plainly. The silver is dedicated “unto the LORD” and made into a graven image (verse 3). Micah’s shrine is a “house of gods,” with an ephod, teraphim and his own son as priest (verse 5). When a Levite comes by looking for a place, Micah hires him and consecrates him as his priest, and the chapter ends with Micah sure of the LORD’s favour: “Now know I that the LORD will do me good, seeing I have a Levite to my priest” (verse 13).

  Between the two halves stands the narrator’s one comment: “In those days there was no king in Israel, but every man did that which was right in his own eyes” (verse 6). It explains the rest. Micah does not turn from the LORD to Baal; he worships the LORD by his own judgment, and the chapter lets that judgment speak for itself. None of the closing stories shows Israel doing what was right. Chapter 18 shows what the shrine was worth, when the Danites carry off the image and the priest and Micah is left asking, “what have I more?” ([[Judg. 18:24]]).

sections:
  - range: 1-6
    heading: The silver and the shrine
    plain: |
      There was a man from the hill country of Ephraim named Micah. He said to his mother, “The eleven hundred pieces of silver that were taken from you, the ones you pronounced a curse about in my hearing: look, I have the silver. I took it.” His mother said, “May the LORD bless you, my son.” When he gave the eleven hundred pieces of silver back to his mother, she said, “I had wholly dedicated this silver to the LORD from my own hand, for my son, to make a carved image and a cast image. So now I give it back to you.” He returned the money to his mother, and she took two hundred pieces of silver and gave them to a silversmith, who made them into a carved image and a cast image, and they were kept in Micah’s house. Now this man Micah had a shrine, and he made an ephod and teraphim and installed one of his sons, who became his priest. In those days there was no king in Israel; everyone did whatever he thought was right.
  - range: 7-13
    heading: A Levite for a priest
    plain: |
      There was a young man from Bethlehem in Judah, of the clan of Judah, who was a Levite living there as a stranger. He left Bethlehem to live wherever he could find a place, and on his way he came to Micah’s house in the hill country of Ephraim. Micah asked him, “Where do you come from?” He answered, “I am a Levite from Bethlehem in Judah, and I am going to live wherever I can find a place.” Micah said, “Stay with me, and be a father and a priest to me. I will give you ten pieces of silver a year, a set of clothes, and your food.” So the Levite went in. He agreed to stay with the man, and the young man became like one of his sons. Micah installed the Levite, and the young man became his priest and lived in Micah’s house. Then Micah said, “Now I know that the LORD will prosper me, because I have a Levite as my priest.”

notes:
  - ref: 2
    phrase: about which thou cursedst, and spakest of also in mine ears
    kind: history
    title: A curse, a confession and a blessing
    body: |
      Micah gives the silver back after hearing his mother curse the thief, and she answers him with a blessing. The verb behind “cursedst” belongs to the Hebrew word for an oath, and here it means to curse. The noun from the same root is the law’s “oath in testimony,” the adjuration that bound anyone who knew of a wrong to speak: whoever should “hear the voice of swearing” and stay silent “shall bear his iniquity” ([[Lev. 5:1]]). The mother spoke her curse aloud, and her son heard it; his confession follows. The text does not say whether fear of the curse or conscience moved him.

      Her reply, “Blessed be thou of the LORD, my son,” sets the LORD’s name against the curse. It also leads straight into her plan for the silver, which is the subject of the next verse.
    sources: [bdb, lds-scriptures]

  - ref: 3
    phrase: I had wholly dedicated the silver unto the LORD from my hand for my son, to make a graven image and a molten image
    kind: history
    title: Silver for the LORD, made into an image
    body: |
      The mother’s gift is made to the LORD by name, and what it pays for is the thing His law forbade. “Thou shalt not make unto thee any graven image” ([[Ex. 20:4]]), and the law laid a curse on “the man that maketh any graven or molten image, an abomination unto the LORD” ([[Deut. 27:15]]). Verse 3 names the same pair that the curse names: a *pesel*, an idol shaped as a likeness, the word of the commandment, and a *massekah*, a thing of molten metal, the word used of Aaron’s “molten calf” ([[Ex. 32:4]]). What Micah’s image looked like the text never says.

      What the text does make clear is whose image it was meant to be. The silver was dedicated “unto the LORD,” and Micah expects the LORD’s favour from his shrine (verse 13). The irony is plain in the verse itself: silver consecrated to the LORD becomes an image the LORD had forbidden.

      Only two hundred of the eleven hundred shekels went to the silversmith (verse 4). What became of the rest the text does not say.
    sources: [bdb, lds-scriptures]

  - ref: 5
    phrase: the man Micah had an house of gods
    kind: words
    title: A shrine with an ephod and teraphim
    body: |
      Micah’s shrine has the furnishings of worship and a priest installed in the law’s own words, but none of it is what the law allowed. “House of gods” is *bêt ʾĕlōhîm*. The plural *ʾĕlōhîm* serves both for “gods in the ordinary sense” and, “especially with the article,” for the one God; with the article, *bêt hāʾĕlōhîm*, the King James renders it “the house of God” in the next chapter, of the LORD’s sanctuary at Shiloh ([[Judg. 18:31]]). Verse 5 has no article, and the King James chose “gods”; the Hebrew allows either. Either way, the silver for its image had been dedicated “unto the LORD” (verse 3).

      The furnishings follow. The ephod was the name of the high priest’s outer garment, but here, as with Gideon’s, it “may possibly … have been used to denote an image of some kind” (the object is explained at [[Judg. 8:27]]). The teraphim were images “used from patriarchal times” (Laban’s “gods,” [[Gen. 31:30]]; see the note at [[Gen. 31:19]]) “in worship and for magical purposes,” and to use them “was probably not to worship strange gods but to worship the true God in a corrupt manner.” Last comes a priest. Micah “consecrated” one of his sons; the Hebrew says he *filled the hand* of his son, the expression for installing a man in a priestly office. It is the expression the law uses for the consecration of Aaron and his sons ([[Ex. 28:41]]), and verse 12 uses it again of the Levite.

      By the law the priest’s office belonged to Aaron and his sons, “and the stranger that cometh nigh shall be put to death” ([[Num. 3:10]]). An Ephraimite’s son had no claim to it. The verse uses the law’s own expression for an installation the law did not allow, and the narrator’s explanation comes in the very next verse.
    sources: [oshb-wlc, strongs-concordance, bd-ephod, bd-teraphim, bdb, lds-scriptures]

  - ref: 6
    phrase: every man did that which was right in his own eyes
    kind: history
    title: No king, and every man his own judge
    body: |
      The refrain explains Micah: with no one over them, each Israelite decided for himself what worship was right, and the book reports it as a condemnation. It returns three times in the closing chapters, in part at [[Judg. 18:1]] and [[Judg. 19:1]] (“In those days there was no king in Israel”) and in full as the book’s last verse ([[Judg. 21:25]]).

      The words come from Moses. In the wilderness, he said, Israel was doing “every man whatsoever is right in his own eyes,” and that was to end when they came to “the rest and to the inheritance,” where they would bring their offerings to the one place the LORD would choose ([[Deut. 12:8–11]]; the law itself is explained with [[Deut. 12]]). Israel is now in the land, and every man still does what is right in his own eyes.

      The phrase also answers the refrain of the judges’ stories, that Israel “did evil in the sight of the LORD” ([[Judg. 2:11]]), in the Hebrew “in the eyes of” the LORD. The eyes have changed: what counts now is what looks right to each man. One reading quoted in a Latter-day Saint study of Judges ties the two together: when Israel rebelled against the LORD as its covenant king, “they had no king as envisioned by the covenant, so everyone did what was right in their own eyes.” On that reading what Israel lacked was the LORD as its king: “it is God’s kingship that is being rebelled against,” and “physical kingship will not make a difference in this.” Gideon had said as much: “the LORD shall rule over you” ([[Judg. 8:23]]). What the book’s last line says about kings is taken up at [[Judg. 21:25]].
    sources: [schade-broken-laws, lds-scriptures]

  - ref: 7
    phrase: of the family of Judah, who was a Levite
    kind: history
    title: A Levite from Judah
    body: |
      The young man is a Levite by tribe who had been living in Judah, and he is on the road looking for a living. Levi had no inheritance of land; the Levites lived from the tithe and from forty-eight cities given them among the tribes ([[Num. 35:7]]). Bethlehem was not one of those cities, and the verse says he only “sojourned” there, living as a stranger.

      “Of the family of Judah” has puzzled readers, since a Levite is not of Judah’s tribe. One older reading takes it to mean not that he descended from Judah but that he belonged to the Levites who lived in Judah’s territory and were counted with that tribe in civil matters. The same reading offers two possible reasons a Levite might be wandering: some of the towns given to the Levites were still held by the Canaanites (the land not taken, [[Judg. 1:27–36]]), and some Levites, unwilling to do the service the law gave them, may have left their towns for other work. Both are suggestions. The text gives only his own words: he is going “to sojourn where I may find a place” (verse 9).
    sources: [bd-levites, keil-judges, lds-scriptures]

  - ref: 10
    phrase: be unto me a father and a priest, and I will give thee ten shekels of silver by the year
    kind: history
    title: A priest for hire
    body: |
      Micah offers the Levite the honour of “a father and a priest” and a wage of ten shekels a year, with clothes and food, and the Levite takes the post. Micah wanted a Levite in particular. In this period “much importance was attached to the presence of a duly qualified priest, familiar with the traditions of the priestly order,” and these two verses are the example given for it.

      Yet a Levite was not a priest by right. The Levites’ work “was to assist the priests,” as [[Num. 3:5–10]] sets it out; the priesthood itself was given to Aaron’s line (the guide [The Temple and Worship](/old-testament/guides/temple-and-worship/#priests) explains the difference). This Levite accepts a priest’s office at a shrine with a graven image, from an Ephraimite with no right to give it, for pay. In one reading, the priests of Judges are “solitary Levites who are answerable to no higher authority and seem unconcerned with anything other than personal employment or personal welfare,” citing [[Judg. 17:7]] and [[Judg. 19:1]]. The next chapter bears it out: when the Danites offer him a tribe instead of one household, “the priest’s heart was glad” ([[Judg. 18:19–20]]).
    sources: [bd-judges, bd-levites, schade-broken-laws, lds-scriptures]

  - ref: 13
    phrase: Now know I that the LORD will do me good, seeing I have a Levite to my priest
    kind: history
    title: Sure of the LORD’s favour
    body: |
      Micah’s last words show what he thinks his shrine is for: he believes that a Levite in it secures the LORD’s blessing. He now has an image, an ephod, teraphim, a shrine and a priest of Levi’s tribe, and he reasons that the LORD will prosper him. One older reading calls the belief “superstition, for which Micah was very speedily to atone,” and notes what it shows about the time: Levi was still regarded “as the tribe elected by God for the performance of divine worship.” Micah cared which tribe his priest came from, and his shrine was built around the image the law had forbidden (verse 3).

      The chapter does not answer him; the next one does. The Danites take the image, the ephod, the teraphim and the Levite, and Micah is left with the cry “Ye have taken away my gods which I made, and the priest, and ye are gone away: and what have I more?” ([[Judg. 18:24]]).
    sources: [keil-judges, lds-scriptures]

christ: |
  The LORD whom Micah and his mother invoked is Jehovah, the premortal Christ (see the note at [[Ex. 3:14]]), and the book that records their shrine calls Israel back to Him: read whole, in one reading, Judges is “a prophetic call to acknowledge the kingship of the Lord, the true King and Judge of Israel.” The commandment Micah’s house broke is the one Abinadi read to the priests of Noah, “Thou shalt not make unto thee any graven image” ([[Mosiah 12:36]]), to which the Church’s footnote at verse 3 points.

  The law Micah’s house ignored still describes a disciple’s worship: not “every man whatsoever is right in his own eyes” but what the Lord has commanded ([[Deut. 12:8]], to which the Church’s footnote at verse 6 points). Forms chosen for oneself do not secure the Lord’s favour, as Micah’s confidence in verse 13 shows; worship is offered to the Lord as King, on His terms.

explore: |
  - [[Deut. 12:1–14]]: the law of the one place of worship, and the end of “every man whatsoever is right in his own eyes.”
  - [[Judg. 18]]: what became of Micah’s image and his Levite.
  - [[Judg. 8:22–27]]: Gideon refuses a crown and makes an ephod.
  - [[Ex. 20:3–6]] with [[Mosiah 12:35–36]]: the commandment against graven images, in the law and in Abinadi’s mouth.
  - [“Broken Laws as ‘Every Man Did That Which Was Right in His Own Eyes’”](https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes), on the refrain that closes Judges and the covenant it shows broken.

