chapter: 9
title: The Bramble King
tagline: Gideon’s son Abimelech buys a crown at Shechem with temple silver and his brothers’ blood; the one brother who escapes tells a fable of trees choosing a king; and the fire it foretells consumes both the king and the city that made him.
when: 'After the death of Gideon (8:32–33)'

setting: |
  Gideon refused a crown, but he had “threescore and ten sons” and a concubine at Shechem who bore him a son he named Abimelech ([[Judg. 8:30–31]]). As soon as Gideon was dead, Israel “made Baal-berith their god,” forgot the LORD, and showed no kindness to Gideon’s house ([[Judg. 8:33–35]]; Baal-berith is explained at [[Judg. 8:33]]). Chapter 9 shows what that meant.

  Shechem was the most ancient of Israel’s sacred towns, set between the hills of Ebal and Gerizim. Abram had come there on his first arrival in the land, Jacob had bought land there, and there Joshua gathered the tribes to renew the covenant and Joseph’s bones were buried ([[Josh. 24:1]], [[Josh. 24:32]]). Now its citizens crown a king with silver from the house of their Baal.

  The chapter does not follow the book’s cycle. There is no foreign oppressor, no cry to the LORD, and no deliverer raised up; the enemy is inside Israel, and the man who rules is not called a judge. At the center stands Jotham’s fable of the trees, one of the earlier writings the compiler worked into the book. The rest of the chapter is the fable coming true. For Gideon’s house it is a tragedy, and Judges 9 is “painful to read.”

thread: |
  Abimelech makes his case to his mother’s kin in a single question: would you rather be ruled by seventy sons of Jerubbaal, or by one man who is “your bone and your flesh”? (verse 2). Shechem chooses kinship. The silver comes from the temple of Baal-berith, the hired men are “vain and light,” and the seventy die “upon one stone” at Ophrah, all but Jotham, the youngest, who hid (verses 1–5). Abimelech is crowned by the pillar at Shechem (verse 6).

  Jotham answers from the top of Gerizim with a fable. The olive, the fig and the vine will not leave the fruit they give God and man to wave over the trees; only the bramble accepts, offers its shade, and threatens fire (verses 7–15). Then Jotham applies it in one long conditional sentence: if you have dealt truly with my father’s house, rejoice in your king; if not, let fire come out of Abimelech and devour Shechem, and fire come out of Shechem and devour Abimelech (verses 16–20). Then he runs (verse 21).

  The rest of the chapter is that sentence being carried out. Three years on, “God sent an evil spirit” between the king and the city that made him, so that the blood of the seventy would fall on both (verses 22–24). Shechem turns to ambush and to Gaal; Zebul betrays Gaal to Abimelech; Abimelech destroys the city, sows it with salt, and burns its people in the hold of their god’s temple (verses 25–49). At Thebez, as he goes to burn another tower, a woman drops a millstone on his head (verses 50–54). The narrator draws the moral himself: God rendered Abimelech’s wickedness, and Shechem’s, “and upon them came the curse of Jotham” (verses 56–57). The chapter’s enemies are Israel’s own; Israel’s problem “lay within their own hearts.”

sections:
  - range: 1-6
    heading: A crown bought with blood
    plain: |
      Abimelech son of Jerubbaal went to his mother’s brothers at Shechem and spoke with them and with his mother’s whole clan. “Ask all the leading men of Shechem,” he said, “which is better for you: to have all seventy of Jerubbaal’s sons rule over you, or one man? Remember that I am your own flesh and blood.” His mother’s brothers repeated all this to the men of Shechem, and they were inclined to follow Abimelech, for they said, “He is our brother.” They gave him seventy pieces of silver from the temple of Baal-berith, and with it Abimelech hired worthless, reckless men to follow him. He went to his father’s house at Ophrah and killed his brothers, the seventy sons of Jerubbaal, on one stone. But Jotham, Jerubbaal’s youngest son, escaped, because he hid. Then all the men of Shechem and all the household of Millo gathered and made Abimelech king beside the oak of the pillar at Shechem.
  - range: 7-21
    heading: Jotham’s fable
    plain: |
      When Jotham was told, he climbed to the top of Mount Gerizim and shouted to them: “Listen to me, men of Shechem, so that God may listen to you. Once the trees went out to anoint a king for themselves. They said to the olive tree, ‘Be our king.’ The olive tree answered, ‘Should I give up my oil, by which gods and people are honored, to go and be lifted up over the trees?’ Then the trees said to the fig tree, ‘Come and be our king.’ The fig tree answered, ‘Should I give up my sweetness and my good fruit to go and be lifted up over the trees?’ Then the trees said to the vine, ‘Come and be our king.’ The vine answered, ‘Should I give up my new wine, which cheers gods and people, to go and be lifted up over the trees?’ At last all the trees said to the bramble, ‘Come and be our king.’ The bramble said to the trees, ‘If you really mean to anoint me king over you, come and take shelter in my shade. If not, let fire come out of the bramble and burn up the cedars of Lebanon.’

      “Now then: if you acted in good faith and honor when you made Abimelech king, if you have treated Jerubbaal and his family well and given him what his deeds deserved (my father fought for you, risked his life, and rescued you from Midian, and today you have risen against his family, killed his seventy sons on one stone, and made Abimelech, the son of his slave woman, king over Shechem because he is your relative), if you have acted in good faith toward Jerubbaal and his family today, then be happy with Abimelech, and may he be happy with you. But if not, let fire come out of Abimelech and burn up the men of Shechem and the household of Millo, and let fire come out of the men of Shechem and the household of Millo and burn up Abimelech.” Then Jotham ran away to Beer and lived there, out of reach of his brother Abimelech.
  - range: 22-41
    heading: Shechem turns on its king
    plain: |
      Abimelech ruled over Israel for three years. Then God sent an evil spirit between Abimelech and the men of Shechem, and they betrayed him. This was so that the violence done to Jerubbaal’s seventy sons would be avenged, and their blood laid on their brother Abimelech, who killed them, and on the men of Shechem, who helped him do it. The men of Shechem set men in ambush on the hilltops against him, and they robbed everyone who passed that way; and Abimelech was told.

      Gaal son of Ebed came to Shechem with his kinsmen, and the men of Shechem put their trust in him. They went out to the fields, gathered and trod their grapes, held a festival, went into the temple of their god, ate and drank, and cursed Abimelech. Gaal said, “Who is Abimelech, and who are we of Shechem, that we should serve him? Isn’t he Jerubbaal’s son, and isn’t Zebul his deputy? Serve the men of Hamor, Shechem’s father! Why should we serve Abimelech? If only this people were under my command, I would get rid of him.” And he challenged Abimelech: “Muster your army and come out!”

      When Zebul, the governor of the city, heard what Gaal had said, he was furious. He sent messengers to Abimelech in secret: “Gaal and his kinsmen have come to Shechem and are stirring the city up against you. Come by night with your men and lie in wait in the fields. In the morning at sunrise, attack the city; and when Gaal comes out against you, do to him whatever you can.” So Abimelech and his men set out by night and lay in wait near Shechem in four companies. As Gaal went out and stood in the city gate, Abimelech and his men rose from their hiding places. Gaal saw them and said to Zebul, “Look, people are coming down from the hilltops!” Zebul answered, “You are seeing the shadows of the hills as if they were men.” Gaal spoke again: “Look, people are coming down from the center of the land, and another company is coming by way of the diviners’ oak.” Zebul said, “Where is your big talk now, ‘Who is Abimelech, that we should serve him’? Aren’t these the people you despised? Go out now and fight them.” So Gaal led the men of Shechem out and fought Abimelech. Abimelech chased him, and many fell wounded all the way to the gate. Abimelech stayed at Arumah, and Zebul drove Gaal and his kinsmen out of Shechem.
  - range: 42-49
    heading: The fire comes out of Abimelech
    plain: |
      The next day the people of Shechem went out into the fields, and Abimelech was told. He divided his men into three companies and lay in wait in the fields. When he saw the people coming out of the city, he attacked them. He and his company rushed forward and held the city gate, while the other two companies fell on everyone in the fields and killed them. Abimelech fought against the city all that day. He took it, killed its people, tore it down and scattered salt over it. When the men of the tower of Shechem heard this, they went into the stronghold of the temple of the god Berith. Abimelech was told that they had gathered there. He and his men went up Mount Zalmon; he took an axe, cut a branch from the trees, put it on his shoulder and told his men, “Hurry, do what you have seen me do.” Each man cut a branch and followed him; they piled the branches against the stronghold and set it on fire over the people inside. So all the people of the tower of Shechem died, about a thousand men and women.
  - range: 50-57
    heading: The fire comes back on Abimelech
    plain: |
      Then Abimelech went to Thebez, besieged it and took it. But there was a strong tower inside the city, and all the men and women, everyone in the city, fled into it, shut themselves in and went up onto the roof. Abimelech came to the tower and attacked it, and went right up to its door to set it on fire. A woman dropped an upper millstone on his head and crushed his skull. He called at once to the young man who carried his armor: “Draw your sword and kill me, so that no one can say of me, ‘A woman killed him.’” So the young man ran him through, and he died. When the Israelites saw that Abimelech was dead, they all went home. So God repaid the evil Abimelech had done to his father by killing his seventy brothers, and God brought all the evil of the men of Shechem back on their own heads. The curse of Jotham son of Jerubbaal came upon them.

notes:
  - ref: 1
    phrase: Abimelech the son of Jerubbaal went to Shechem
    kind: history
    title: A son named Father-king
    body: |
      Abimelech was Gideon’s son by a concubine in Shechem ([[Judg. 8:31]]), and his name means “Father-king.” The name sits oddly beside Gideon’s refusal of the crown, “I will not rule over you” ([[Judg. 8:23]]): Gideon named this son “my father is king,” and Abimelech “does indeed become king for a short period.”

      His appeal to Shechem is built on blood. Through his mother he is Shechem’s own: “I am your bone and your flesh,” the phrase Laban used of his kinsman Jacob ([[Gen. 29:14]]). Shechem’s answer, “He is our brother” (verse 3), shows that the argument worked. The same word will be used against them: Jotham calls Abimelech king over Shechem “because he is your brother” (verse 18), and the narrator says the blood of the seventy was laid “upon Abimelech their brother” (verse 24).
    sources: [bd-abimelech, goff-vox-populi]

  - ref: 5
    phrase: upon one stone
    kind: history
    title: Upon one stone
    body: |
      The text does not say why the seventy were killed on a single stone; the older commentaries read the detail as the mark of a deliberate killing. One older reading takes it as a formal execution. Another suggests the brothers were killed “as if they were sacrificial victims,” sets it beside later reigns that began by killing a royal house ([[2 Kgs. 10:1–7]]; [[2 Kgs. 11:1]]), and compares Jotham’s escape to that of the child Joash ([[2 Kgs. 11:2]]).

      The number is the round total of the brothers: verse 5 says seventy were slain and in the same breath that Jotham escaped, so that, as one older reading notes, sixty-nine actually died. Jotham repeats the phrase “upon one stone” to the men of Shechem (verse 18), as an accusation.
    sources: [keil-judges, cambridge-judges]

  - ref: 6
    phrase: by the plain of the pillar that was in Shechem
    kind: history
    title: Crowned by the oak and the pillar
    body: |
      Abimelech may have been crowned at the very place where Israel had sworn to serve the LORD. The “plain” is in Hebrew a terebinth or oak, and the “pillar” probably a memorial stone set up under it. One older reading holds that the worshipers of Baal-berith crowned their king “in the very same place” where Joshua had held his last assembly and renewed Israel’s covenant with Jehovah, and that the temple of their covenant Baal probably stood nearby. Joshua had set up a great stone at Shechem, “under an oak,” as a witness of the covenant ([[Josh. 24:26]]; see the note there).

      If that reading is right, the contrast is sharp. At that stone the people had said, “The LORD our God will we serve, and his voice will we obey” ([[Josh. 24:24]]). Now, as soon as Gideon is dead, the men of Shechem make a king there with the help of Baal’s silver.
    sources: [keil-judges, lds-scriptures]

  - ref: 8
    phrase: The trees went forth on a time to anoint a king over them
    kind: symbol
    title: The trees that would not be king
    body: |
      Jotham’s fable is about who is willing to rule, and why. It is one of the few parables in the Old Testament, cried out from Mount Gerizim above the city, the mount from which the blessings of the covenant were to be spoken ([[Deut. 11:29]]). The trees ask three of the best plants in the land to reign over them, and all three refuse in nearly the same words: should I give up what I bear, “and go to be promoted over the trees?”

      What each tree gives is the point. The olive was foremost among trees in part because its oil was used “to worship God as well as to sustain man”; “God and man” in verse 9 is in Hebrew “gods and men,” that is, “in ritual services.” The fig gives sweetness, and the vine new wine “which cheereth God and man.” Each would have to leave its fruit to rule. The bramble has no fruit to leave; it offers only shade and fire (verse 15).

      Read as an allegory, the trees are Israel’s leaders wanting a king (Gideon had been offered the crown), the faithful trees that would not take it are Gideon’s sons, and the bramble is Abimelech, “son of a concubine wife.” Jotham’s application in verses 16–20 makes the last identification himself.
    sources: [ot-manual-judges-1-12, skinner-autumn-olives, lds-scriptures]

  - ref: 15
    phrase: put your trust in my shadow
    kind: symbol
    title: Shade from a bramble
    body: |
      The bramble’s offer is ironic, and its threat is real. A thornbush casts no shade a person could rest in, so “put your trust in my shadow” is an offer it cannot keep; one older reading calls it “a deep irony, the truth of which the Shechemites were very soon to discover.” Thorns catch fire easily, and a fire that starts in the brush can reach “the cedars of Lebanon,” the largest and noblest of trees: the most worthless man can bring ruin on the mightiest.

      Jotham’s application (verses 16–20) turns the fable into a curse. He states the condition twice, around a parenthesis listing what Gideon did for Shechem and what Shechem did to Gideon’s sons: if this was dealing “truly and sincerely,” rejoice. After that list, in the older reading, the condition is “the bitterest scorn,” and nothing can follow but the fire. The fire will go both ways, from Abimelech to Shechem and from Shechem to Abimelech (verse 20). The rest of the chapter shows how completely the curse was fulfilled: Abimelech burns Shechem’s people in their stronghold (verse 49) and dies at the door of another tower he meant to burn (verse 52).
    sources: [keil-judges, ot-manual-judges-1-12]

  - ref: 22
    phrase: When Abimelech had reigned three years over Israel
    kind: words
    title: King, or only ruler?
    body: |
      Abimelech was made king (verse 6) and Jotham calls him one (verse 16), but verse 22 does not use the verb of the fable, where the trees ask for one to “reign” over them (*mālak*, “be (become) king, reign,” verses 8–14). It is *wayyāśar*, from a verb meaning “be, or act as, prince, rule,” the word Isaiah uses of princes who “rule in judgment” ([[Isa. 32:1]]). The three years are counted as “Abimelech’s rule,” not as a judgeship.

      Whatever the verb, the text calls him king: it “asserts that Abimelech was made king … and reigned three years.” Israel had a king of a kind before Saul, and the story bears on the later request of [[1 Sam. 8:5]]: had Israel heeded it, “they would have known better than to request a king like all the nations, when they already had God as their king.”
    sources: [oshb-wlc, bdb, bd-judges, goff-vox-populi]

  - ref: 23
    phrase: God sent an evil spirit between Abimelech and the men of Shechem
    kind: scripture
    title: An evil spirit from God
    body: |
      The verse says that God sent the strife, and verse 24 says why: so that the blood of the seventy might be laid on the man who shed it and on the men who paid for it. The strife between the king and his backers is the means of the judgment that verses 56–57 announce.

      The same language returns with Saul, of whom it is said that “an evil spirit from the LORD troubled him” ([[1 Sam. 16:14]]). In Saul’s verses the Joseph Smith Translation reads that the spirit was one “which was not of the Lord” (JST, 1 Sam. 16:14) and “which is not of God” (JST, 1 Sam. 16:15).
    sources: [lds-scriptures]

  - ref: 53
    phrase: a certain woman cast a piece of a millstone upon Abimelech’s head
    kind: history
    title: A woman and a millstone
    body: |
      Abimelech’s death is told with care. The stone was a millstone, dropped from the roof of the tower at Thebez as he came to the door to set it alight. His last words are about his reputation: “Draw thy sword, and slay me, that men say not of me, A woman slew him” (verse 54). The request is like that of the Midianite kings Zebah and Zalmunna a chapter earlier, who wanted to die by a great warrior’s hand rather than a boy’s to keep their honor ([[Judg. 8:21]]).

      It did not save his name. Generations later Joab, sending word to David of a soldier lost too close to a city wall, expects the king to ask, “Who smote Abimelech the son of Jerubbesheth? did not a woman cast a piece of a millstone upon him from the wall, that he died in Thebez?” ([[2 Sam. 11:21]]).
    sources: [ot-manual-judges-1-12, bd-abimelech, lds-scriptures]

  - ref: 56
    phrase: Thus God rendered the wickedness of Abimelech
    kind: scripture
    title: Thus God rendered
    body: |
      The narrator closes with the chapter’s verdict in his own voice: God repaid Abimelech for what he did to his father’s house, and the men of Shechem for theirs, “and upon them came the curse of Jotham” (verse 57). God raised up no deliverer in this chapter and is named in no battle, but these verses say He was at work through it all, rendering to each what he had done, as Jotham’s curse had foretold.

      The justice is exact. The fire came out of Abimelech on Shechem and came back on him at Thebez. Read whole, the chapter is the fulfillment of Jotham’s prediction, “a region engulfed in violence and treachery until Abimelech is killed.” One reading of the book asks whether the violence of Gideon’s later years, at Succoth, Penuel and with the Midianite kings ([[Judg. 8:16–21]]), was what his sons came to understand about violence; the text does not say.
    sources: [haws-better-way, lds-scriptures]

christ: |
  Gideon had said what Israel needed to hear: “the LORD shall rule over you” ([[Judg. 8:23]]). The LORD, Jehovah, is the premortal Jesus Christ (see [[Ex. 3:14]]), and Israel already had Him as its king (see the note at verse 22). Judges 9 shows the alternative in full: a king made by kinship and silver, whose shade was a thornbush and whose rule ended in fire. The King they already had is the one whose judgments are just, who “rendered” to Abimelech and Shechem what they had done (verse 56).

  Israel’s greatest enemies in this era were not foreign armies but “inward vacillation, apathy, disobedience, and rebellion,” and a disciple’s are the same. What a disciple serves, and how a disciple uses power, become the patterns passed to those who watch most closely.

explore: |
  - **The covenant at Shechem.** Read [[Josh. 24:14–27]] beside verses 1–6: the same place, the oak and the stone, and the opposite choice.
  - **The request for a king.** [[1 Sam. 8:4–22]], where Israel asks for a king “like all the nations.”
  - **Gideon’s house.** The Maxwell Institute reflection “Longing for a Better Way” reads chapters 6–9 together.

