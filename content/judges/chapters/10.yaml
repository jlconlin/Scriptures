chapter: 10
title: I Will Deliver You No More
tagline: Two quiet judges come and go; then Israel serves the gods of every nation around it, falls to Ammon and the Philistines at once, and cries to a LORD who first refuses, then cannot bear their misery.
when: 'When Ammon oppressed Gilead eighteen years (10:8)'

setting: |
  After Abimelech's bloody three years (chapter 9), the book names two judges in five verses, Tola of Issachar and Jair of Gilead, and then turns to a new oppression. Gilead is the country east of the Jordan, between the Sea of Galilee and the Dead Sea, and the trouble begins there.

  Verses 6–18 open more than one story. The LORD gives Israel to two nations at once, and the book will follow each in turn: Jephthah's war with Ammon fills chapters 11–12, and the Philistines, named first here, return at Samson's birth ([[Judg. 13:1]]). In one older reading these verses introduce the whole last stretch of the judges' period: Jephthah subdues Ammon, but Samson only wounds the Philistines, and their rule is broken only under Samuel.

  At the chapter's middle, to Israel's cry the LORD answers, “Ye have forsaken me … wherefore I will deliver you no more” (verse 13). Samuel, recalling these years, gives the people's confession in nearly the same words and names Jephthah among the deliverers who answered it ([[1 Sam. 12:10–11]]).

thread: |
  The chapter has two halves that seem to belong to different books. The first (verses 1–5) is a quiet record: Tola “arose to defend Israel” (the Hebrew is “to save,” the verb used of the deliverers at [[Judg. 2:16]] and [[Judg. 3:9]]), judged twenty-three years and was buried; Jair judged twenty-two years, had thirty sons and thirty towns, and was buried. No enemy, no battle, no sin is recorded.

  The second half (verses 6–18) runs the book's cycle once more ([[Judg. 2:11–19]]) and then breaks it. Israel serves the Baals and the Ashtaroth (see [[Judg. 2:13]]) and the gods of five neighboring peoples besides, and “forsook the LORD, and served not him” (verse 6). The LORD sells them to two enemies; Ammon crushes Gilead for eighteen years and crosses the Jordan; Israel is “sore distressed” and cries out. Up to here the pattern holds.

  Then the cry changes, and so does the answer. For the first time in Judges the people say, “We have sinned” (verses 10, 15). The LORD does not raise a deliverer. He recites what He has done for them and refuses: let the gods they chose save them. Israel answers by giving itself into His hands (“do thou unto us whatsoever seemeth good unto thee,” verse 15) and putting the foreign gods away, and the LORD's soul is “grieved for the misery of Israel” (verse 16). Even so the chapter ends with no deliverer named: an army at Mizpeh and a question, “What man is he…?”

sections:
  - range: 1-5
    heading: Tola and Jair
    plain: |
      After Abimelech, Tola son of Puah, son of Dodo, a man of Issachar, arose to save Israel. He lived at Shamir in the hill country of Ephraim, judged Israel twenty-three years, died, and was buried at Shamir. After him came Jair of Gilead, who judged Israel twenty-two years. He had thirty sons who rode thirty young donkeys, and they had thirty towns in the land of Gilead, which are still called Havoth-jair, “the villages of Jair.” Jair died and was buried at Camon.
  - range: 6-9
    heading: Sold to two nations
    plain: |
      Again the Israelites did what was evil in the LORD's sight. They served the Baals and the Ashtaroth, and the gods of Syria, Sidon, Moab, the Ammonites and the Philistines. They abandoned the LORD and did not serve Him. So the LORD's anger burned against Israel, and He sold them into the power of the Philistines and of the Ammonites. That year they began to crush and oppress the Israelites, and for eighteen years they oppressed all the Israelites east of the Jordan, in Gilead, the land of the Amorites. The Ammonites even crossed the Jordan to fight Judah, Benjamin and the house of Ephraim, and Israel was in great distress.
  - range: 10-16
    heading: “We have sinned”
    plain: |
      The Israelites cried out to the LORD: “We have sinned against You, for we have abandoned our God and served the Baals.” The LORD answered them: “When the Egyptians, the Amorites, the Ammonites and the Philistines, the Sidonians, the Amalekites and the Maonites oppressed you and you cried to Me, did I not save you from them? Yet you have abandoned Me and served other gods, so I will not save you again. Go and cry out to the gods you have chosen. Let them save you in your time of trouble.” The Israelites said to the LORD, “We have sinned. Do to us whatever seems good to You; only save us today, we pray.” They put away the foreign gods from among them and served the LORD, and He could no longer bear Israel's misery.
  - range: 17-18
    heading: Gilead looks for a leader
    plain: |
      The Ammonites were called to arms and camped in Gilead, and the Israelites gathered and camped at Mizpeh. The people and the leaders of Gilead said to one another, “Who will be the man to begin the fight against the Ammonites? He shall be head over everyone who lives in Gilead.”

notes:
  - ref: 4
    phrase: thirty sons that rode on thirty ass colts
    kind: history
    title: Thirty sons on thirty colts
    body: |
      The one thing the book records of Jair is a picture of a great house. Many sons meant power and wealth, and in one older reading riding a young donkey was “a sign of distinguished rank in those times when the Israelites had no horses.” Abdon's forty sons and thirty nephews ride seventy colts at [[Judg. 12:14]]. Jair's sons are tied to the thirty towns of the clan.

      The verse also has a play on words that English cannot keep. The Hebrew writes the same word, *ʿăyārîm*, twice: thirty sons rode on thirty *ʿăyārîm* (“colts”), and they had thirty *ʿăyārîm* (“cities”). The lexicon takes the first as the plural of *ʿayir*, a young male donkey, and the second as the plural of *ʿîr*, “city”; one older reading holds that the rarer form for “cities” was chosen for its sound.

      The towns' name, Havoth-jair, means “the hamlets” or “tent-villages” of Jair. [[Num. 32:41]] and [[Deut. 3:14]] give that name to the towns of an earlier Jair, the son of Manasseh in Moses' day, while Judges ties the towns to the sons of this judge. The accounts of these villages “are not all consistent.” On one older reading the two need not conflict: Judges does not say the judge first gave the name, only that his sons brought it into use again. The text does not settle the question.
    sources: [keil-judges, cambridge-judges, bdb, oshb-wlc, lds-scriptures]

  - ref: 7
    phrase: into the hands of the Philistines, and into the hands of the children of Ammon
    kind: history
    title: Two enemies at once
    body: |
      The LORD gives Israel to two oppressors at once, one on each side of the land. In one older reading, Ammon pressed from the east, on the tribes beyond the Jordan, while the Philistines pressed from the west; and Ammon is named second only because its story is told first. Verses 8–9 follow Ammon alone: eighteen years over Gilead, then a raid across the river against Judah, Benjamin and Ephraim.

      The two names lay out the rest of the judges. Ammon is answered in Jephthah's story (chapters 11–12). The Philistines are left standing; their forty years begin to be told at [[Judg. 13:1]], and Samson, born to “begin to deliver Israel” from them ([[Judg. 13:5]]), strikes them again and again without breaking their rule, which is left for Samuel.
    sources: [keil-judges, lds-scriptures]

  - ref: 12
    phrase: the Maonites
    kind: history
    title: The Maonites
    body: |
      The Maonites are named nowhere else in Judges, and the ancient texts disagree about them. The Hebrew reads *Maʿôn*, a people named here beside the Sidonians and Amalek as old enemies of Israel; the writer may mean the Meunim, a people named in Chronicles. The Septuagint, the ancient Greek translation, reads “Madiam,” Midian, the enemy of Gideon's story (chapters 6–8), and many scholars follow it. Either way the LORD names seven peoples in all, and each time, He says, “ye cried to me, and I delivered you.” That record is His case against them in verse 13.
    sources: [oshb-wlc, bdb, lxx-rahlfs]

  - ref: 13
    phrase: wherefore I will deliver you no more
    kind: scripture
    title: I will deliver you no more
    body: |
      The LORD's refusal was real for the people who heard it: Israel had no assurance that He would help them, and having given themselves to other gods, they now had to rely on their own strength. Verse 14 turns their choice back on them: “go and cry unto the gods which ye have chosen.”

      A similar warning was given to the Saints driven from Jackson County, Missouri: “They were slow to hearken unto the voice of the Lord their God; therefore, the Lord their God is slow to hearken unto their prayers,” and “in the day of their trouble, of necessity they feel after me” ([[D&C 101:7–8]]). One Latter-day Saint reading takes verses 10–16 to show how thin Israel's contrition may have been: the people changed their ways only after the LORD reminded them that He had delivered them time and again. Three verses later His refusal gives way to compassion (verse 16), though no deliverer is yet named.
    sources: [ot-manual-judges-1-12, lds-scriptures, schade-broken-laws]

  - ref: 16
    phrase: his soul was grieved for the misery of Israel
    kind: words
    title: His soul could bear their misery no longer
    body: |
      The Hebrew says that the LORD's soul became short with Israel's misery: *wattiqṣar napšô baʿămal yiśrāʾēl*. With “soul,” the verb means to reach the limit of one's patience or endurance, as of the people worn down on the wilderness road ([[Num. 21:4]]) and Samson worn out by Delilah's pleading ([[Judg. 16:16]]). Here what the LORD could no longer endure is named as a thing: Israel's *ʿāmāl*, their trouble, the suffering they were living through.

      The verse does not say that Israel's repentance earned the deliverance. It says they put away the foreign gods and served the LORD, and then that He could not bear their suffering. The book's deliverances, in one Latter-day Saint reading, “seem to be more focused on God's grace than on Israel's repentance,” and come “not because God rewards evil but because he is compassionate toward the sinner.” The refusal of verse 13 gives way to compassion. How God can be said to change His course is taken up at [[Judg. 2:18]].
    sources: [oshb-wlc, bdb, schade-broken-laws, lds-scriptures]

  - ref: 18
    phrase: he shall be head over all the inhabitants of Gilead
    kind: history
    title: Head over all the inhabitants of Gilead
    body: |
      The chapter ends with an army and no leader. Israel camps at Mizpeh, whose name means “watchtower,” the place of the heap of stones Jacob and Laban raised in Gilead ([[Gen. 31:49]]), and the leaders of Gilead ask who will begin the fight. Their offer, headship over all Gilead, is the one their elders make to Jephthah in the next chapter (“be our head over all the inhabitants of Gilead,” [[Judg. 11:8]]), and the terms of that bargain are told there.
    sources: [bd-mizpah, lds-scriptures]

christ: |
  The LORD who refuses and then cannot bear Israel's misery is Jehovah, the premortal Christ (see [[Ex. 3:14]]). Judges 10 shows His refusal and His compassion in one scene: He refuses to save a people who have chosen other gods, and yet the suffering of a people who come back to Him moves Him to save them. He spoke the same way to the Saints in Missouri: “notwithstanding their sins, my bowels are filled with compassion towards them. I will not utterly cast them off; and in the day of wrath I will remember mercy” ([[D&C 101:9]]).

  A disciple who has turned to the Lord only in trouble has not exhausted His mercy. His deliverance rests on His compassion toward the sinner, not on a reward for evil, and the turning that answers it is the one Israel made in verse 16: putting away what had taken His place.

explore: |
  - [[Judg. 11:1–11]]: the man Gilead finds, and the bargain that makes him its head.
  - [[1 Sam. 7:3–6]]: Samuel's call to put away the strange gods, in the words of verse 16.
  - [[Judg. 2:11–19]]: the cycle this chapter runs once more and then breaks.

sources: [lds-scriptures, keil-judges, cambridge-judges, bdb, oshb-wlc, lxx-rahlfs, ot-manual-judges-1-12, schade-broken-laws, bd-mizpah]
