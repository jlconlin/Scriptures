alt: A clay pitcher broken open on bare ground, with a small lit oil lamp glowing inside it, stands in a valley before dawn; nearby a small spring comes out of a crack in pale rock into a mossy basin and overflows in a short runnel, and a single olive tree stands on a distant hill under an indigo-to-gold sky.
