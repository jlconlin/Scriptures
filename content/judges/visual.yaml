summary: >-
  Judges is the book of a people who keep forgetting the Lord and a Lord who keeps raising up
  deliverers anyway, through flawed and ordinary vessels, until the people have no king and do
  what is right in their own eyes. Its quiet center is a plain clay pitcher broken open so
  that the lamp inside shows, for the deliverance is "the sword of the LORD," not the vessel's
  own. It points to Jehovah, the Savior, who hears Israel's cry, is grieved for their misery,
  and is their King when they will have no other (8:23).
motifs:
  - "Primary: a plain, unglazed clay pitcher standing on the ground, its side broken open so that a small burning clay lamp inside is plainly seen, the lamplight spilling out through the break, with broken pieces of pottery beside it (Judg. 7:16, 20)."
  - "Supporting: a small spring at the lower right, where clear water comes out of a crack in pale rock into a shallow basin edged with moss and new green growth, and overflows at the near edge in a short runnel that runs downhill out of the picture (Judg. 15:18–19)."
  - "Supporting: one lone olive tree standing on the crest of a far hill, alone and unclaimed, with nothing crowning or surrounding it (Judg. 9:8–9; 8:23)."
composition: >-
  A wide, calm landscape in the last dark before dawn, over a broad open valley of low olive
  and clay-colored hills. In the near foreground, left of center, the broken clay pitcher
  stands upright on bare ground, with a small whole clay lamp burning inside it; its flame and
  the warm light spilling through the break are the brightest, clearest shape in the picture,
  and a few broken pottery pieces lie beside it. To the right and lower, the spring comes out of
  a crack in a low shelf of pale rock into a dark, clear basin and spills toward the viewer;
  the water does not glow and nothing falls from a height (a waterfall from a cave and a
  glowing stream into the valley were tried and dropped; author, 2026-11-03). Across the
  middle distance the valley opens in soft layers of indigo shadow and muted olive, and on the
  crest of the farthest hill on the right one olive tree stands alone, small but readable
  against the sky. The sky shades from deep indigo at the top to restrained gold at the
  horizon. No figures, buildings, walls, weapons, banners, crowns, thrones, armies, smoke, or
  storms; the lamp is the only flame.
# “What's in this picture” under the image on the book page: one line for each thing, with the verse it shows.
key:
  - '**The clay pitcher broken open, with a lamp burning inside,** is what Gideon’s three hundred carried: “empty pitchers, and lamps within the pitchers” and at the signal “brake the pitchers, and held the lamps … and they cried, The sword of the LORD, and of Gideon” ([[Judg. 7:16]]; [[Judg. 7:20]]).'
  - '**The spring coming out of the rock** is En-hakkore, “the spring of him who called,” opened for Samson when he was dying of thirst and called on the LORD: “God clave an hollow place that was in the jaw, and there came water thereout; and when he had drunk, his spirit came again, and he revived” ([[Judg. 15:19]]). The “jaw” is Lehi, the place where it happened, and the hollow was in its ground, not in the jawbone.'
  - '**The lone olive tree on the far hill** is the olive tree of Jotham’s parable, which would not be made king over the trees: “Should I leave my fatness, wherewith by me they honour God and man, and go to be promoted over the trees?” ([[Judg. 9:9]]). Jotham’s father, Gideon, had refused the same offer: “the LORD shall rule over you” ([[Judg. 8:23]]).'
