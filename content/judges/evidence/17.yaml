chapter: 17
claims:
  - where: setting
    claim: 'The Bible Dictionary divides Judges into three parts, the last being two narratives showing idolatry and lawlessness (17–21)'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: 'Judges consists of three parts: (1) an introduction (Judg. 1:1–3:6); (2) the history of the Twelve Judges … (3:7–16:31); (3) two narratives, which specially show the tendency to idolatry and lawlessness (Judg. 17–21).'
  - where: setting
    claim: 'Worship of Jehovah was not limited to the sanctuary of the ark; local sanctuaries, some private as Micah''s, had an ephod or image'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: 'The worship of Jehovah was in no way restricted to the precincts of the sanctuary of the Ark. There were various local sanctuaries, sometimes in private hands, as in the case of Micah'
  - where: setting
    claim: 'One older reading: the first appendix shows how shortly after Joshua''s death image-worship of Jehovah began'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/17.htm'
    quote: 'the account of the introduction of image-worship, or of the worship of Jehovah under the form of a molten image, by the Ephraimite Micah … shows us how shortly after the death of Joshua the inclination to an idolatrous'
  - where: setting
    claim: 'Phinehas, Aaron''s grandson, still serves before the ark in the closing stories'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/20?lang=eng'
    quote: 'And Phinehas, the son of Eleazar, the son of Aaron, stood before it in those days'

  - where: thread
    claim: 'The Student Manual: nothing in the closing stories shows Israel doing right'
    key: ot-manual-judges-13-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-13-21-ruth-1-4-the-reign-of-the-judges-part-2?lang=eng'
    quote: 'are samples of Israel’s worst days. Nothing in the stories show the Israelites doing what was right.'

  - where: 'note 17:2 “A curse, a confession and a blessing”'
    claim: 'The law bound one who heard an adjuration to speak'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/5?lang=eng'
    quote: 'And if a soul sin, and hear the voice of swearing, and is a witness, whether he hath seen or known of it; if he do not utter it, then he shall bear his iniquity.'

  - where: 'note 17:5 “A shrine with an ephod and teraphim”'
    claim: 'Using teraphim was probably worship of the true God in a corrupt manner'
    key: bd-teraphim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/teraphim?lang=eng'
    quote: 'To use teraphim was probably not to worship strange gods but to worship the true God in a corrupt manner.'
  - where: 'note 17:3 “Silver for the LORD, made into an image”'
    claim: 'The law curses whoever makes a graven or molten image'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/27?lang=eng'
    quote: 'Cursed be the man that maketh any graven or molten image, an abomination unto the LORD'

  - where: 'note 17:5 “A shrine with an ephod and teraphim”'
    claim: 'The Hebrew of verse 5 has elohim, and the verb “fill” with “hand”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'אֱלֹהִ֑ים'
  - where: 'note 17:5 “A shrine with an ephod and teraphim”'
    claim: 'The ephod in Judg. 8:27 and 17:5 may have denoted an image'
    key: bd-ephod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephod?lang=eng'
    quote: 'The ephod at one time became the object of idolatrous worship (Judg. 8:27; 17:5). The name may possibly in these last passages have been used to denote an image of some kind.'
  - where: 'note 17:5 “A shrine with an ephod and teraphim”'
    claim: 'The priest''s office belonged to Aaron and his sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/3?lang=eng'
    quote: 'And thou shalt appoint Aaron and his sons, and they shall wait on their priest’s office: and the stranger that cometh nigh shall be put to death.'

  - where: 'note 17:6 “No king, and every man his own judge”'
    claim: 'Moses: in the wilderness every man did what was right in his own eyes; this would end at the rest and inheritance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/12?lang=eng'
    quote: 'Ye shall not do after all the things that we do here this day, every man whatsoever is right in his own eyes.'
  - where: 'note 17:6 “No king, and every man his own judge”'
    claim: 'The refrain recurs in 18:1, 19:1, 21:25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/17?lang=eng'
    quote: '“king”: Judg. 18:1; 21:25.'
  - where: 'note 17:6 “No king, and every man his own judge”'
    claim: 'As quoted in Schade (Younger): the refrain links back to “did evil in the eyes of the Lord”; with no covenant king, everyone did right in their own eyes; it is God''s kingship rebelled against; physical kingship would not help'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'It is God’s kingship that is being rebelled against by Israel! Physical kingship will not make a difference in this. … The statement that “each man did what was right in his own eyes” links theologically back to “the Israelites did evil in the eyes of the Lord” (lit. translation of 2:11'
  - where: 'note 17:6 “No king, and every man his own judge”'
    claim: 'As quoted in Schade (Younger): with the Lord rejected as covenantal king, they had no king as the covenant envisioned'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'When the Israelites rebelled against the Lord as their covenantal king, they had no king as envisioned by the covenant, so everyone did what was right in their own eyes.'
  - where: 'note 17:6 “No king, and every man his own judge”'
    claim: 'The block quotation in Schade [43] is Younger''s'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'that led to the unraveling of society.[55] As explained by Younger:'

  - where: 'note 17:7 “A Levite from Judah”'
    claim: 'Levites had no inheritance of land; they had the tithe and 48 cities'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'They had no inheritance in Canaan (18:23–24); but they had the tithe (18:21), 48 cities (35:6), and a claim on the alms of the people at feast times'
  - where: 'note 17:7 “A Levite from Judah”'
    claim: 'One older reading: Bethlehem not a Levitical town; he sojourned there as a stranger; “of the family of Judah” means he belonged to the Levites living in Judah; Levitical towns held by Canaanites, or Levites unwilling to serve, may explain his wandering'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/17.htm'
    quote: 'Bethlehem was not a Levitical town. … but simply that he belonged to the Levites who dwelt in the tribe of Judah, and were reckoned in all civil matters as belonging to that tribe. … different towns which were allotted to the Levites remained in possession of the Canaanites'
  - where: 'note 17:7 “A Levite from Judah”'
    claim: 'One older reading: some Levites unwilling to do the service may have left their towns'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/17.htm'
    quote: 'It might also happen that individuals among the Levites themselves, who were disinclined to perform the service assigned them by the law, would remove from the Levitical towns and seek some other occupation elsewhere'

  - where: 'note 17:10 “A priest for hire”'
    claim: 'Much importance was attached to a qualified priest (17:9–10)'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: 'Much importance was attached to the presence of a duly qualified priest, familiar with the traditions of the priestly order (17:9–10).'
  - where: 'note 17:10 “A priest for hire”'
    claim: 'The Levites'' work was to assist the priests'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'The work of the Levites was to assist the priests (Num. 3:5–10; 18:1–7).'
  - where: 'note 17:10 “A priest for hire”'
    claim: 'As quoted in Schade (Matthews): Judges has solitary Levites answerable to no one and concerned with employment'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'When priests are mentioned within Judges, they tend to have negative connotations. … only solitary Levites who are answerable to no higher authority and seem unconcerned with anything other than personal employment or personal welfare (Judg 17:7; 19:1).” Matthews, Judges and Ruth, 4.'
  - where: 'note 17:10 “A priest for hire”'
    claim: 'The Danites offer the Levite a larger post and he goes gladly'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/18?lang=eng'
    quote: 'is it better for thee to be a priest unto the house of one man, or that thou be a priest unto a tribe and a family in Israel? And the priest’s heart was glad'

  - where: 'note 17:13 “Sure of the LORD’s favour”'
    claim: 'One older reading: Micah''s belief was superstition, soon atoned for; it shows Levi was regarded as the tribe chosen for worship'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/17.htm'
    quote: 'This belief, or, to speak more correctly, superstition, for which Micah was very speedily to atone, proves that at that time the tribe of Levi held the position assigned it in the law of Moses; that is to say, that it was regarded as the tribe elected by God for the performance of divine worship.'
  - where: 'note 17:13 “Sure of the LORD’s favour”'
    claim: 'The Danites take the image and priest; Micah is left with nothing'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/18?lang=eng'
    quote: 'Ye have taken away my gods which I made, and the priest, and ye are gone away: and what have I more?'

  - where: christ
    claim: 'As quoted in Schade (Younger): Judges is a prophetic call to acknowledge the Lord''s kingship'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'In a real sense, the book of Judges is a prophetic call to acknowledge the kingship of the Lord, the true King and Judge of Israel.'
  - where: christ
    claim: 'The Church footnote to “graven image” points to Mosiah 12:36'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/17?lang=eng'
    quote: '“graven image”: Ex. 20:4 (4, 23); Lev. 19:4; Mosiah 12:36.'

  - where: 'note 17:2 “A curse, a confession and a blessing”'
    claim: 'BDB: the verb ʾālâ in Judg. 17:2 means curse'
    key: bdb
    url: 'https://biblehub.com/hebrew/422.htm'
    quote: '2 curse Judges 17:2.'
  - where: 'note 17:2 “A curse, a confession and a blessing”'
    claim: 'BDB: the noun ʾālâ is an oath in testimony in Lev. 5:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/423.htm'
    quote: '1 oath in testimony Leviticus 5:1'
  - where: 'note 17:3 “Silver for the LORD, made into an image”'
    claim: 'BDB: pesel is an idol, a likeness, as in Ex. 20:4 and Deut. 27:15'
    key: bdb
    url: 'https://biblehub.com/hebrew/6459.htm'
    quote: 'idol, as likeness of man or animal Exodus 20:4=Deuteronomy 5:8; Exodus 4:16,23,25, also Deuteronomy 27:15'
  - where: 'note 17:3 “Silver for the LORD, made into an image”'
    claim: 'BDB: massekah is molten metal or image, used of the molten calf; the pair pesel and massekah at Deut. 27:15 and Judg. 17:3–4'
    key: bdb
    url: 'https://biblehub.com/hebrew/4541.htm'
    quote: '2 molten metal, or image: עֵגֶל מַסֵּכָה molten calf Exodus 32:4,8'
  - where: 'note 17:3 “Silver for the LORD, made into an image”'
    claim: 'BDB lists the pair pesel and massekah at Deut. 27:15 and Judg. 17:3, 4'
    key: bdb
    url: 'https://biblehub.com/hebrew/4541.htm'
    quote: 'מֶּסֶל וּמַסֵּכָה Deuteronomy 27:15; Judges 17:3,4'
  - where: 'note 17:5 “A shrine with an ephod and teraphim”'
    claim: 'BDB: “fill the hand” means to install in a priestly office, as in Ex. 28:41 and Judg. 17:5, 12'
    key: bdb
    url: 'https://biblehub.com/hebrew/4390.htm'
    quote: 'figurative for institute to a priestly office, consecrate Exodus 28:41; Exodus 29:9,29,33,35; Leviticus 8:33; Leviticus 16:32; Leviticus 21:10; Numbers 3:3; Judges 17:5,12'
  - where: 'note 17:5 “A shrine with an ephod and teraphim”'
    claim: 'The KJV renders bêt hāʾĕlōhîm “the house of God” at 18:31'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/18?lang=eng'
    quote: 'all the time that the house of God was in Shiloh.'

  - where: 'note 17:5 “A shrine with an ephod and teraphim”'
    claim: 'Elohim is gods in the ordinary sense, and especially with the article the supreme God'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/430.htm'
    quote: 'gods in the ordinary sense; but specifically used (in the plural thus, especially with the article) of the supreme God'
  - where: 'note 17:5 “A shrine with an ephod and teraphim”'
    claim: 'The teraphim: images used from patriarchal times in worship and magic'
    key: bd-teraphim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/teraphim?lang=eng'
    quote: 'used from patriarchal times (Gen. 31:30, 32) and onwards (Judg. 17:5; Hosea 3:4–5; Zech. 10:2) in worship and for magical purposes'
  - where: christ
    claim: 'The Church footnote to “right” in verse 6 points to Deut. 12:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/17?lang=eng'
    quote: '“right”: Deut. 12:8.'
