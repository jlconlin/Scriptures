chapter: 10
claims:
  - where: when
    claim: 'Ammon oppressed the Israelites in Gilead eighteen years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/10?lang=eng'
    quote: 'And that year they vexed and oppressed the children of Israel: eighteen years, all the children of Israel that were on the other side Jordan in the land of the Amorites, which is in Gilead.'

  - where: setting
    claim: 'Verses 6–18 open the period of the Ammonite and Philistine oppressions: Jephthah delivers from Ammon; Samson strikes the Philistines but cannot break them; Samuel finishes it'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/10.htm'
    quote: 'It is true that Jephthah delivered his people from the oppression of the Ammonites … But the Philistine oppression lasted forty years; for although Samson inflicted heavy blows upon the Philistines again and again … This was left for Samuel to accomplish'
  - where: setting
    claim: 'Gilead was the country east of the Jordan between the Sea of Tiberias and the Dead Sea'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/10.htm'
    quote: 'Gilead was the name applied generally to the country E. of the Jordan, between the south end of the Sea of Tiberias and the north end of the Dead Sea.'
  - where: setting
    claim: 'Samuel later recalls the people’s confession in nearly the same words and names Jephthah among the deliverers'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/12?lang=eng'
    quote: 'And they cried unto the Lord, and said, We have sinned, because we have forsaken the Lord, and have served Baalim and Ashtaroth'

  - where: thread
    claim: 'Tola “arose to save Israel,” the verb of the deliverers of 2:16 and 3:9'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/10.htm'
    quote: '1. to save Israel] Cf. Jdg 2:16; Jdg 2:18, Jdg 3:9 f.'
  - where: thread
    claim: 'The Hebrew of 10:1 has lĕhôšîaʿ, “to save,” for the King James “to defend”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'לְ/הוֹשִׁ֣יעַ'
  - where: thread
    claim: 'Only in this chapter does Israel say “We have sinned” in Judges'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/10?lang=eng'
    quote: 'And the children of Israel cried unto the LORD, saying, We have sinned against thee, both because we have forsaken our God, and also served Baalim.'
  - where: 'note 10:4 “Thirty sons on thirty colts”'
    claim: 'Riding asses was a sign of rank when Israel had no horses; the second ʿăyārîm (cities) is chosen for its sound beside ʿăyārîm (asses)'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/10.htm'
    quote: 'thirty sons who rode upon thirty asses, which was a sign of distinguished rank in those times when the Israelites had no horses. They had thirty cities (the second עירים in Judges 10:4 is another form for ערים … chosen because of its similarity in sound to עירים, asses)'
  - where: 'note 10:4 “Thirty sons on thirty colts”'
    claim: 'BDB: ʿayir, a young male ass, for riding in 10:4a and 12:14; 10:4b belongs under ʿîr, city'
    key: bdb
    url: 'https://biblehub.com/hebrew/5895.htm'
    quote: 'עַ֫יִר noun masculineGen 32:16 male ass (young and vigorous); … plural עֲיָרִים, for riding Judges 10:4a (Judges 10:4b see עִיר), עֲיָרִם), Judges 12:14'
  - where: 'note 10:4 “Thirty sons on thirty colts”'
    claim: 'The Hebrew of 10:4 writes the same word, ʿăyārîm, for the colts and for the cities'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'עֲיָרִ֖ים'
  - where: 'note 10:4 “Thirty sons on thirty colts”'
    claim: 'Many sons and riding colts were marks of rank, power and wealth; Havvoth-jair means tent-villages of Jair; the accounts of them are not all consistent'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/10.htm'
    quote: 'Numerous descendants indicated power and wealth. that rode on thirty ass colts] A mark of rank; cf. Jdg 12:14 … Havvoth-jair] i.e. tent-villages (LXX ἐπαύλεις) of Jair … The Havvoth-jair are frequently mentioned, but the accounts of them are not all consistent.'
  - where: 'note 10:4 “Thirty sons on thirty colts”'
    claim: 'Havoth-jair means hamlets of Jair'
    key: bdb
    url: 'https://biblehub.com/hebrew/2334.htm'
    quote: 'hamlets of Jair, a region of Israel'
  - where: 'note 10:4 “Thirty sons on thirty colts”'
    claim: 'One older reading: Judges does not say the judge first gave the name, only that his sons brought it into use again'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/10.htm'
    quote: 'it is not affirmed here, that the thirty cities which belonged to the sons of Jair received this name for the first time from the judge Jair, but simply that this name was brought into use again by the sons of Jair'
  - where: 'note 10:4 “Thirty sons on thirty colts”'
    claim: 'Numbers names Jair the son of Manasseh as the one who called the towns Havoth-jair'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/32?lang=eng'
    quote: 'And Jair the son of Manasseh went and took the small towns thereof, and called them Havoth-jair.'

  - where: 'note 10:7 “Two enemies at once”'
    claim: 'The LORD gave Israel to two nations at once, Ammon from the east, the Philistines from the west'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/10.htm'
    quote: 'the Lord gave up His people into the hands of two hostile nations at the same time, on account of their repeated return to idolatry; so that the Ammonites invaded the land from the east … whilst the Philistines came from the west'
  - where: 'note 10:7 “Two enemies at once”'
    claim: 'Ammon is named second because the historian tells its oppression first'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/10.htm'
    quote: 'The Ammonites are mentioned after the Philistines, not because they did not oppress the Israelites till afterwards, but for purely formal reasons, viz., because the historian was about to describe the oppression of the Ammonites first.'
  - where: 'note 10:7 “Two enemies at once”'
    claim: 'Samson strikes the Philistines but cannot break their rule; that is left for Samuel'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/10.htm'
    quote: 'But the Philistine oppression lasted forty years; for although Samson inflicted heavy blows upon the Philistines again and again … he was nevertheless not in condition to destroy their power and rule over Israel.'
  - where: 'note 10:7 “Two enemies at once”'
    claim: 'The Philistine rule returns at Samson’s birth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/13?lang=eng'
    quote: 'And the children of Israel did evil again in the sight of the Lord; and the Lord delivered them into the hand of the Philistines forty years.'

  - where: 'note 10:12 “The Maonites”'
    claim: 'BDB: Maon in 10:12 is a people named with the Sidonians and Amalek; possibly the Meunim; many read Midian with the Septuagint'
    key: bdb
    url: 'https://biblehub.com/hebrew/4584.htm'
    quote: 'of a people Judges 10:12 named with Sidonians and Amalek as ancient foes of Israel; possibly intended by writer as = מְעוּנִים q. v.; many read מִדְיָן (ᵐ5B A ᵐ5L Μαδιαμ)'
  - where: 'note 10:12 “The Maonites”'
    claim: 'The Maonites are named nowhere else in Judges'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/10?lang=eng'
    quote: 'The Zidonians also, and the Amalekites, and the Maonites, did oppress you; and ye cried to me, and I delivered you out of their hand.'
  - where: 'note 10:12 “The Maonites”'
    claim: 'The Septuagint reads Madiam (Midian) in 10:12'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/judges/10.htm'
    quote: 'and from the Sidonians, and Amalec, and Madiam, who afflicted you? and ye cried to me, and I saved you out of their hand?'
  - where: 'note 10:12 “The Maonites”'
    claim: 'The Hebrew reads Maon'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'וּ/מָע֔וֹן'

  - where: 'note 10:13 “I will deliver you no more”'
    claim: 'The Student Manual: Israel had no assurance God would help; they had to rely on their own strength; D&C 101:7–8 is a like warning to the latter-day Saints'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'Israel had no assurance at this time that God would help them. They had sold themselves to other gods, and they now had to rely on their strength. A similar warning, found in D&C 101:7–8, was given to the Saints of the latter days.'
  - where: 'note 10:13 “I will deliver you no more”'
    claim: 'D&C 101:7–8: slow to hearken, so the Lord is slow to answer; in trouble they feel after Him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'In the day of their peace they esteemed lightly my counsel; but, in the day of their trouble, of necessity they feel after me.'
  - where: 'note 10:13 “I will deliver you no more”'
    claim: 'D&C 101 was given when the Saints had been driven from Jackson County, Missouri'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'At this time the Saints who had gathered in Missouri were suffering great persecution. Mobs had driven them from their homes in Jackson County'
  - where: 'note 10:13 “I will deliver you no more”'
    claim: 'One Latter-day Saint reading: a lack of contrition may show in 10:10–16; the admission of guilt and change came only after the LORD recalled His deliverances'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'This concept of a lack of contrition may be accentuated in Judges 10:10–16, where the people cried out to the Lord and admitted some guilt followed by behavior changes. This happened only after the Lord explained he had delivered them time and again, saying, “Yet have you forsaken me, and served other gods: wherefore I will deliver you no more.”'

  - where: 'note 10:16 “His soul could bear their misery no longer”'
    claim: 'BDB: qāṣar with nepeš means be impatient; of Samson worn out by importunity (16:16); of the people (Num. 21:4); of the LORD at 10:16, reach the limit of patience with a thing'
    key: bdb
    url: 'https://biblehub.com/hebrew/7114.htm'
    quote: 'with בֶפֶשׁ, רוּחַ, = be impatient … נֶפֶשׁ הָעָם ׳וִתִּק Numbers 21:4b … נַפְשׁוֺ ׳וַתִּק Judges 16:16 i.e. he was worn out (by importunity) … reach limit of patience with, endurance of; of ׳י Judges 10:16 (ב of thing)'
  - where: 'note 10:16 “His soul could bear their misery no longer”'
    claim: 'BDB: ʿāmāl at 10:16 is trouble, one’s own suffering'
    key: bdb
    url: 'https://biblehub.com/hebrew/5999.htm'
    quote: '1 trouble ("" sorrow): one''s own suffering … תקצר ׳נפשׁו בע Judges 10:16.'
  - where: 'note 10:16 “His soul could bear their misery no longer”'
    claim: 'The Hebrew of the clause: wattiqṣar napšô baʿămal yiśrāʾēl'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'וַ/תִּקְצַ֥ר'
  - where: 'note 10:16 “His soul could bear their misery no longer”'
    claim: 'One Latter-day Saint reading: deliverance in Judges seems to rest more on God’s grace and compassion toward the sinner than on Israel’s repentance'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Deliverance scenes in Judges thus seem to be more focused on God’s grace than on Israel’s repentance. … Israel’s deliverance comes not because God rewards evil but because he is compassionate toward the sinner.'
  - where: 'note 10:18 “Head over all the inhabitants of Gilead”'
    claim: 'Mizpah of 10:17 is the heap of stones Jacob and Laban raised; the name means watchtower'
    key: bd-mizpah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/mizpah?lang=eng'
    quote: 'Watchtower. (1) The heap of stones raised by Jacob and Laban (Gen. 31:49; Judg. 10:17; 11:11, 29, 34; 20:1, 3; 21:1, 5, 8)'
  - where: 'note 10:18 “Head over all the inhabitants of Gilead”'
    claim: 'The elders of Gilead offer Jephthah the same headship'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/11?lang=eng'
    quote: 'and be our head over all the inhabitants of Gilead.'

  - where: christ
    claim: 'D&C 101:9: notwithstanding their sins, the Lord’s bowels are filled with compassion; in wrath He remembers mercy'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/101?lang=eng'
    quote: 'Verily I say unto you, notwithstanding their sins, my bowels are filled with compassion towards them. I will not utterly cast them off; and in the day of wrath I will remember mercy.'
  - where: christ
    claim: 'God is compassionate toward the sinner'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Israel’s deliverance comes not because God rewards evil but because he is compassionate toward the sinner.'

  - where: explore
    claim: 'Samuel’s call to put away the strange gods and Israel’s confession at Mizpeh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/7?lang=eng'
    quote: 'And Samuel spake unto all the house of Israel, saying, If ye do return unto the Lord with all your hearts, then put away the strange gods'
