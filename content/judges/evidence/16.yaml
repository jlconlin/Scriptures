chapter: 16
claims:
  - where: when
    claim: 'Samson judged Israel twenty years in the days of the Philistines; this chapter is the end of his life'
    key: ot-minute-judg-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-16'
    quote: 'Samson’s downfall begins in Judges 16 and culminates with his death at the end of the chapter.'
  - where: setting
    claim: 'The history of the judges runs from 3:7 to 16:31; chapters 17–21 are two narratives'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: '(2) the history of the Twelve Judges, which falls into a succession of periods of rebellion against God, and the oppressions and deliverances by which they were followed (3:7–16:31); (3) two narratives, which specially show the tendency to idolatry and lawlessness (Judg. 17–21).'
  - where: setting
    claim: 'Samson is the twelfth judge'
    key: bd-samson
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samson?lang=eng'
    quote: 'Son of Manoah, and the twelfth of the “judges” of Israel (Judg. 13:24–16:30).'
  - where: setting
    claim: 'The Philistines held the coastal lowland from Joppa to the Egyptian desert in a league of five cities, each with its lord'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'the rich lowland on the Mediterranean coast from Joppa to the Egyptian desert. They formed a confederation of five chief cities, namely, Ashdod, Gaza, Ashkelon, Gath, and Ekron, each governed by its “lord.”'
  - where: setting
    claim: 'Gaza is a Philistine city on the Mediterranean coast; the chapter opens there'
    key: ot-minute-judg-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-16'
    quote: 'Samson was with a prostitute in Gaza (a Philistine city on the coast of the Mediterranean; Judges 16:1–3)'
  - where: setting
    claim: 'Gaza was the place of Samson’s death in a temple of Dagon'
    key: bd-dagon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dagon?lang=eng'
    quote: 'A Philistine temple at Gaza was the place of Samson’s death (Judg. 16:23–30)'
  - where: setting
    claim: 'Samson failed to fulfil his divine calling because of selfish and unrighteous choices'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'Samson, another judge, was blessed with tremendous physical strength but failed to fulfill his divine calling because of selfish and unrighteous choices.'
  - where: thread
    claim: 'The hair was the symbol of the covenant with God, who was the source of the strength'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'Samson’s hair was not the source of his strength. Rather, it was the symbol of his covenant relationship with God, who was the source of Samson’s strength.'
  - where: thread
    claim: 'Samson fulfilled his mission only by giving his life, and avenged himself rather than Israel'
    key: ot-minute-judg-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-16'
    quote: 'Samson only fulfilled his divine mission as Israel’s judge by giving up his own life (compare Judges 13:5; 14:4), and second, that his final act as judge was to avenge himself rather than Israel as a whole'
  - where: thread
    claim: 'The chapter’s own words: bind, afflict, the LORD departed, the hair began to grow'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/16?lang=eng'
    quote: 'Howbeit the hair of his head began to grow again after he was shaven.'
  - where: thread
    claim: 'The hair was the symbol, not the source; he lost strength because he violated his covenants, including the Nazarite’s'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'Samson lost both his physical and spiritual strength because he violated his covenants with God, including those that applied specifically to Nazarites.'
  - where: note 16:3 “The gates of Gaza”
    claim: 'Gaza was one of the five cities of the Philistines, and its gates were carried away by Samson'
    key: bd-gaza
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gaza?lang=eng'
    quote: 'One of the five cities of the Philistines (Gen. 10:19; Josh. 10:41; 11:22; 15:47; Judg. 1:18; 6:4). Its gates were carried away by Samson (Judg. 16:1–3, 21'
  - where: note 16:3 “The gates of Gaza”
    claim: 'The gate was two leaves on pins in sockets with a bar let into the posts; Samson carried the whole frame off in one piece; Hebron is at least 40 miles from Gaza; “before” may mean east of or overlooking'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/16.htm'
    quote: 'The gate was probably in two leaves, turning upon pins in sockets, and secured by a bar … Samson pulled up the whole framework of the gate, doors, posts and bar, and carried it off in one piece. … Hebron is at least 40 m. from Gaza'
  - where: note 16:3 “The gates of Gaza”
    claim: '“Before” means in the direction of; a tradition puts the hill at el Montar, about half an hour southeast of Gaza, from which the mountains of Hebron are visible'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/16.htm'
    quote: 'על־פּני merely means in the direction towards … about half an hour to the south-east of the town, and is called el Montar … Hebron itself is not visible from this hill, but the mountains of Hebron are. According to an ancient tradition, it was to the summit of this hill that Samson carried the city gates'
  - where: note 16:3 “The gates of Gaza”
    claim: 'The Gaza episode is cryptically short and may show Samson growing reckless toward the end of his life'
    key: ot-minute-judg-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-16'
    quote: 'Not much more can be said about this vignette other than perhaps it acts to reinforce the idea that Samson was becoming increasingly reckless and erratic toward the end of his life.'
  - where: note 16:4 “Who was Delilah?”
    claim: 'Delilah was a Philistine woman of the valley of Sorek who learned Samson’s secret and betrayed him; name “weak, delicate”'
    key: bd-delilah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/delilah?lang=eng'
    quote: 'Weak, delicate. A Philistine woman from the valley of Sorek who had such influence over Samson that she obtained from him the secret of his strength and betrayed him'
  - where: note 16:4 “Who was Delilah?”
    claim: 'Little is known of her; presumed Philistine from her familiarity with the lords; probably skilled at weaving; the account does not necessarily portray her as seducing him; name proposed as “dangling curls, loose hair”'
    key: ot-minute-judg-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-16'
    quote: 'the biblical account does not necessarily portray her as deliberately attempting to seduce Samson for nefarious purposes.) She was presumably a Philistine, given her familiarity with Samson’s Philistine enemies (verse 5), and probably had experience working with textiles'
  - where: note 16:4 “Who was Delilah?”
    claim: 'The name is proposed to mean “dangling curls, loose hair”'
    key: ot-minute-judg-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-16'
    quote: 'Her name means “dangling curls, loose hair,” an appropriate (and not-too-subtle) nod to the cause of Samson’s undoing.'
  - where: note 16:4 “Who was Delilah?”
    claim: 'Each of the five cities was governed by its lord'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'They formed a confederation of five chief cities, namely, Ashdod, Gaza, Ashkelon, Gath, and Ekron, each governed by its “lord.”'
  - where: note 16:4 “Who was Delilah?”
    claim: 'The lords promise silver each, and come with money in hand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/16?lang=eng'
    quote: 'Then the lords of the Philistines came up unto her, and brought money in their hand.'
  - where: note 16:9 “A thread of tow”
    claim: 'Tow is coarse flammable flax fiber; the Samson story alludes to flax threads at 16:9'
    key: sc-knowhy-551
    url: 'https://scripturecentral.org/knowhy/why-did-nephi-say-the-devil-leads-sinners-by-a-flaxen-cord'
    quote: 'The Samson story also alludes to these threads when it says that Samson broke seven strong, new bow strings as if they were “a thread of tow” (Judges 16:9), which is “coarse, flammable fibers of flax.”'
  - where: note 16:9 “A thread of tow”
    claim: 'A single thread of tow is very weak; braided strands make strong rope'
    key: sc-knowhy-551
    url: 'https://scripturecentral.org/knowhy/why-did-nephi-say-the-devil-leads-sinners-by-a-flaxen-cord'
    quote: 'A single strand or thread of tow (flax) is “a very weak cord.” … By progressively twisting or braiding multiple strands together, thin and flimsy threads of flax could be made into a thick, durable rope'
  - where: note 16:9 “A thread of tow”
    claim: 'Nephi’s flaxen cord fits the biblical imagery of flimsy tow and contrasts the weak cord with the strong cords; it symbolizes leading from one degree of sin to another'
    key: sc-knowhy-551
    url: 'https://scripturecentral.org/knowhy/why-did-nephi-say-the-devil-leads-sinners-by-a-flaxen-cord'
    quote: 'the metaphor used by Nephi fits better with the biblical imagery of a flimsy thread of tow (flax). Like Isaiah, Nephi also used a poetic antithesis, contrasting the initially weak “flaxen cord” with Satan’s ultimate “strong cords” (2 Nephi 26:22).'
  - where: note 16:9 “A thread of tow”
    claim: 'The flaxen cord symbolizes leading a person from one degree of sin to another'
    key: sc-knowhy-551
    url: 'https://scripturecentral.org/knowhy/why-did-nephi-say-the-devil-leads-sinners-by-a-flaxen-cord'
    quote: 'The phrase “flaxen cord” symbolizes Satan’s efforts to use a sin or spiritual weakness to lead an individual from one degree of sin to another.'
  - where: note 16:13 “The loom and the missing words”
    claim: 'The Septuagint has the fuller text of 16:13–14: the pin into the wall, “then shall I be weak,” and the weaving while he slept'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/judges/16.htm'
    quote: 'If thou shouldest weave the seven locks of my head with the web, and shouldest fasten them with the pin into the wall, then shall I be weak as another man.'
  - where: note 16:13 “The loom and the missing words”
    claim: 'In the Septuagint, Delilah weaves the locks while he sleeps'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/judges/16.htm'
    quote: 'And it came to pass when he was asleep, that Dalida took the seven locks of his head, and wove them with the web, and fastened them with the pin into the wall'
  - where: note 16:13 “The loom and the missing words”
    claim: 'The locks are the plaits of his hair; the web is the warp on the loom; the commentators agree something is wanting in the account'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/16.htm'
    quote: 'it no doubt means the plaits into which Samson''s long flowing hair was plaited. המּסּכת only occurs here (Judges 16:13 and Judges 16:14), and probably means the woven cloth, or rather what was still upon the loom, the warp of the cloth … The commentators are all agreed that, according to these words, there must be something wanting in the account'
  - where: note 16:16 “Pressed daily”
    claim: 'The Church’s footnote to “daily” points to Genesis 39:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/16?lang=eng'
    quote: '“daily”: Gen. 39:10 (7–10).'
  - where: note 16:16 “Pressed daily”
    claim: 'BDB: qāṣar with nepeš at 16:16, he was worn out by importunity; reach the limit of endurance; used of the LORD at 10:16'
    key: bdb
    url: 'https://biblehub.com/hebrew/7114.htm'
    quote: 'with בֶפֶשׁ, רוּחַ, = be impatient … נַפְשׁוֺ ׳וַתִּק Judges 16:16 i.e. he was worn out (by importunity), so of prophets (representing ׳י) Zechariah 11:8 (ב person) reach limit of patience with, endurance of; of ׳י Judges 10:16 (ב of thing)'
  - where: note 16:16 “Pressed daily”
    claim: 'Delilah pressed Samson daily as Potiphar’s wife spoke to Joseph day by day; Joseph fled, Samson gave in'
    key: ot-manual-judges-13-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-13-21-ruth-1-4-the-reign-of-the-judges-part-2?lang=eng'
    quote: 'Potiphar’s wife “spake to Joseph day by day” (Genesis 39:10), but he refused even to be near her and fled rather than violate God’s commandments. Samson gave in to enticement and fell into both physical and spiritual tragedy.'
  - where: note 16:17 “A Nazarite from the womb”
    claim: 'A Nazarite vowed to abstain from wine, cutting of the hair and contact with the dead; the vow might be lifelong'
    key: bd-nazarite
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nazarite?lang=eng'
    quote: 'A man under a vow to abstain from wine, from any cutting of the hair, and any contact with the dead (Judg. 13:5; 16:17; 1 Sam. 1:11; Amos 2:11–12; for full regulations see Num. 6). The vow might be lifelong'
  - where: note 16:17 “A Nazarite from the womb”
    claim: 'The Church’s footnote to “razor” points to the angel’s charge in 13:5; the Nazarite law of the razor and the hair'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/6?lang=eng'
    quote: 'All the days of the vow of his separation there shall no razor come upon his head'
  - where: note 16:17 “A Nazarite from the womb”
    claim: 'The answer links the downfall with the angel’s pronouncement at his birth, bringing the story full circle'
    key: ot-minute-judg-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-16'
    quote: 'The answer links Samson’s downfall with the angel of the Lord’s pronouncement at Samson’s birth as narrated at Judges 13:2–7, thus bringing the story full circle.'
  - where: note 16:17 “A Nazarite from the womb”
    claim: 'The hair was the symbol, not the source; he lost strength because he violated his covenants, including the Nazarite’s'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'Samson lost both his physical and spiritual strength because he violated his covenants with God, including those that applied specifically to Nazarites.'
  - where: note 16:20 “Shorn of his locks”
    claim: 'Joseph Smith, in a letter of 13 November 1843 answering a correspondent’s wish that he “go ahead” in politics, compared the loss of his power to Samson’s'
    key: jsp-history-e1-1778
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-e-1-1-july-1843-30-april-1844/150'
    quote: 'verily I say when I leave the dignity and honor of heaven, to gratify the ambition and vanity of man or men, [HC 6:77] may my power cease, like the strength of Samson, when he was shorn of his locks, while asleep in the lap of Delilah.'
  - where: note 16:20 “Shorn of his locks”
    claim: 'The context is political: boosting a man into power'
    key: jsp-history-e1-1778
    url: 'https://www.josephsmithpapers.org/paper-summary/history-1838-1856-volume-e-1-1-july-1843-30-april-1844/150'
    quote: 'But, Sir, when I leave the dignity and honor I received from heaven, to boost a man into power, through the aid of my friends'
  - where: note 16:20 “Shorn of his locks”
    claim: 'The verse’s words: he wist not that the LORD was departed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/16?lang=eng'
    quote: 'And he awoke out of his sleep, and said, I will go out as at other times before, and shake myself.'
  - where: note 16:21 “Blinded and set to the mill”
    claim: 'Putting out the eyes and imprisonment was not uncommon for rebels and war captives; Zedekiah suffered the same; Samson put himself on this trajectory a little at a time'
    key: ot-minute-judg-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-16'
    quote: 'His sad outcome (having his eyes put out and being cast into exile or prison) was not an uncommon punishment for rebels and war captives in the ancient world. The Judahite king Zedekiah would suffer a similar fate'
  - where: note 16:21 “Blinded and set to the mill”
    claim: 'Samson put himself on this course a little at a time'
    key: ot-minute-judg-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-16'
    quote: 'Samson had been reduced to a pitiful figure, having put himself on this disastrous trajectory a little bit at a time.'
  - where: note 16:21 “Blinded and set to the mill”
    claim: 'Grinding at a hand mill was the hardest and lowest slave labour'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/16.htm'
    quote: 'Grinding a handmill was the hardest and lowest kind of slave labour (compare Exodus 11:5 with Exodus 12:29)'
  - where: note 16:21 “Blinded and set to the mill”
    claim: 'The verse’s words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/16?lang=eng'
    quote: 'But the Philistines took him, and put out his eyes, and brought him down to Gaza, and bound him with fetters of brass; and he did grind in the prison house.'
  - where: note 16:22 “The hair grows again”
    claim: 'The narrator begins the final section with a hint of what was to come'
    key: ot-minute-judg-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-16'
    quote: 'The narrator, however, begins this final section of the story with a hint as to what was to come: “Howbeit the hair of his head began to grow again after he was shaven” (verse 22).'
  - where: note 16:22 “The hair grows again”
    claim: 'The hair was the symbol of the covenant relationship, not the source of strength'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'Samson’s hair was not the source of his strength. Rather, it was the symbol of his covenant relationship with God'
  - where: note 16:23 “Dagon’s feast”
    claim: 'Dagon was the god of the Philistines, with temples at Gaza and Ashdod; part man part fish, or connected with dagan, grain'
    key: bd-dagon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dagon?lang=eng'
    quote: 'The god of the Philistines (Judg. 16:23; 1 Sam. 5:2). There were temples of Dagon at Gaza and Ashdod … His image was in the form partly of a man and partly of a fish. Some writers, however, question whether Dagon was really a fish-god and connect the name with dagan, “grain.”'
  - where: note 16:23 “Dagon’s feast”
    claim: 'The Philistines took Samson’s capture as proof that Dagon was greater than Jehovah and did not fear to mock the champion of Jehovah in their god’s temple; its destruction showed Dagon’s power was nothing'
    key: ot-manual-judges-13-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-13-21-ruth-1-4-the-reign-of-the-judges-part-2?lang=eng'
    quote: 'referred to their belief that their success in capturing Samson proved the Philistine deity Dagon (see Reading F-7) was greater than Jehovah. Thus, the people did not fear to make sport of Samson, the champion of Jehovah, in the temple of their god.'
  - where: note 16:23 “Dagon’s feast”
    claim: 'As quoted in Schade: by means of Samson’s failings the LORD wins a theological victory over Dagon'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Finally, not in spite of but actually by means of Samson’s sensual desires, defiance of his Nazirite vows, and lust for personal revenge, YHWH is able to win a theological victory over the Philistine god Dagon and at least “begin” to deliver Israel.'
  - where: note 16:23 “Dagon’s feast”
    claim: 'The Church’s footnote to Dagon points to 1 Samuel 5:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/16?lang=eng'
    quote: '“Dagon”: 1 Sam. 5:2.'
  - where: note 16:28 “Samson’s last prayer”
    claim: 'The prayer has the tone of penance but is a prayer for vengeance, in keeping with his character; God granted it as a final act of mercy'
    key: ot-minute-judg-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-16'
    quote: 'Although it has the tone of a prayer of penance, it is more a prayer for vengeance, lacking the sort of deep, introspective repentance one might normally expect in a situation like this one. This, however, was in perfect keeping with Samson’s personality and character. As a final act of mercy, God granted Samson his wish'
  - where: note 16:28 “Samson’s last prayer”
    claim: 'The request was self-centered; it is possible the Lord granted it to demonstrate His power over Dagon'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'Even though Samson’s request to the Lord was self-centered, it is possible that the Lord granted it to demonstrate His power over Dagon.'
  - where: note 16:29 “Could one man bring down the house?”
    claim: 'The building is illustrated by finds at Gezer and Gaza: wooden pillars on stone bases, a flat roof of logs on beams; Samson bent the central pillars; the weight on the roof may have helped (the manual quoting Guthrie)'
    key: ot-manual-judges-13-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-13-21-ruth-1-4-the-reign-of-the-judges-part-2?lang=eng'
    quote: 'The character of [this] building is illustrated by discoveries at Gezer and Gaza. The roof was supported by wooden pillars set on stone bases. It was flat, consisting of logs of wood stretching from one wall to beams supported by the pillars'
  - where: note 16:29 “Could one man bring down the house?”
    claim: 'Samson performed in the forecourt, leaned on the central pillars, and bent them; the weight on the roof may have made it easier'
    key: ot-manual-judges-13-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-13-21-ruth-1-4-the-reign-of-the-judges-part-2?lang=eng'
    quote: 'Then, putting an arm round each, and bending forward so as to force them out of the perpendicular, he brought the roof down. The weight of people on the roof may have made the feat all the easier.'
  - where: note 16:29 “Could one man bring down the house?”
    claim: 'He embraced the two middle pillars, leaned on them, and bent them with force'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/16.htm'
    quote: 'he embraced the two middle pillars upon which the building was erected, leant upon them, one with his right hand, the other with the left … He then bent (the two pillars) with force, and the house fell upon the princes'
  - where: note 16:30 “His death and his calling”
    claim: 'Samson fulfilled his mission only by giving up his life, and avenged himself rather than Israel, though he rescued Israel indirectly'
    key: ot-minute-judg-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-16'
    quote: 'his final act as judge was to avenge himself rather than Israel as a whole (even if he rescued Israel indirectly through this feat).'
  - where: note 16:30 “His death and his calling”
    claim: 'The story ends on a somber but somewhat positive note with his burial in the ancestral plot'
    key: ot-minute-judg-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-16'
    quote: 'the account of his twenty-year reign as Israel’s judge does end on a somewhat positive, if not also somber, note: that he was at least given a proper burial in his ancestral plot (16:31).'
  - where: note 16:30 “His death and his calling”
    claim: 'The verse’s words'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/16?lang=eng'
    quote: 'So the dead which he slew at his death were more than they which he slew in his life.'
  - where: christ
    claim: 'The pattern of Judges teaches about the Savior’s power to deliver from sin'
    key: cfm-ot-2026-22
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/22?lang=eng'
    quote: 'Judges 3 describes a pattern that teaches about the Savior’s power to deliver us from sin.'
  - where: christ
    claim: 'As quoted in Schade: no matter how flawed the judge, God saves, or with Samson begins to save'
    key: schade-broken-laws
