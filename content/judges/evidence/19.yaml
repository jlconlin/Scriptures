chapter: 19
claims:
  - where: when
    claim: 'The chapter opens “when there was no king in Israel”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/19?lang=eng'
    quote: 'And it came to pass in those days, when there was no king in Israel, that there was a certain Levite sojourning on the side of mount Ephraim'
  - where: setting
    claim: 'Judges 17–21 are two closing narratives showing idolatry and lawlessness'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: '(3) two narratives, which specially show the tendency to idolatry and lawlessness (Judg. 17–21)'
  - where: setting
    claim: 'The account belongs to the times soon after Joshua, since Phinehas was high priest (20:28); chapter 19 gives the crime, 20 the war, 21 the saving of Benjamin'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/19.htm'
    quote: 'This account belongs to the times immediately following the death of Joshua, as we may see form the fact that Phinehas, the son of Eleazar, the contemporary of Joshua, was high priest at that time (Judges 20:28).'
  - where: setting
    claim: 'The crime leads to the war on Benjamin and the taking of wives in chapters 20–21'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'When the Benjaminites refuse to deliver the perpetrators, the other tribes go to battle against the whole tribe of Benjamin. After three days’ fighting, the Israelites prevail, destroying 25,000 Benjaminites. A total of 600 escape into the wilderness.'
  - where: setting
    claim: 'Hosea refers to the outrage at Gibeah'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/19.htm'
    quote: 'The outrage at Gibeah is referred to in Hosea 9:9; Hosea 10:9-10.'
  - where: thread
    claim: 'The father’s hospitality is emphasized because of what follows'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/19.htm'
    quote: 'The pressing and rather boisterous hospitality of the girl’s father has a tragic significance in view of what follows, hence it is emphasized from the beginning.'
  - where: thread
    claim: 'Only an Ephraimite old man hosts them; the host protests the violation of hospitality'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'Only one old man (an Ephraimite, so also alien to this Benjaminite town) will host the travelers. … The host protests this violation of hospitality and offers his daughter and Beth as sexual substitutes.'
  - where: thread
    claim: 'The Levite’s summons is evidence of social disintegration'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'The Levite’s bloody dispersal and internal warfare among Israelites is evidence of social disintegration.'
  - where: section 1 plain
    claim: 'The sections follow the Church’s chapter heading: return and reconciliation; lodging in Gibeah; the abuse and death; the twelve pieces'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/19?lang=eng'
    quote: 'A Levite’s concubine returns to her father—Her husband takes her back, and they lodge overnight in Gibeah—The men of Gibeah abuse the concubine and she dies—The Levite husband cuts her into twelve pieces'
  - where: section 1 plain
    claim: '“Speak friendly unto her” is literally “to speak to her heart”; she was reconciled'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/19.htm'
    quote: 'her husband went after her, "to speak to her to the heart," i.e., to talk to her in a friendly manner (see Genesis 34:3), and to reconcile her to himself again'
  - where: section 3 plain
    claim: 'The Septuagint says she was dead'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/judges/19.htm'
    quote: 'And he said to her, Rise, and let us go; and she answered not, for she was dead'
  - where: 'note 19:1 “Another Levite, and no king”'
    claim: 'The story cycle begins with a pro-monarchical statement and ends with 21:25'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'The story cycle starts with a pro-monarchical statement. “And it came to pass in those days when there was no king in Israel . . . .” (Judges 19:1). A similar statement concludes the stories'
  - where: 'note 19:1 “Another Levite, and no king”'
    claim: '“Sojourning” means living outside a Levitical town, in the far parts of Ephraim'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/19.htm'
    quote: 'a Levite, who sojourned (i.e., lived outside a Levitical town) in the more remote parts of the mountains of Ephraim'
  - where: 'note 19:1 “Another Levite, and no king”'
    claim: 'The Church’s footnote sets this Levite beside the one in 17:9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/19?lang=eng'
    quote: '1a “Levite”: Judg. 17:9.'
  - where: 'note 19:2 “Unfaithful, or angry?”'
    claim: 'The Hebrew says she played the harlot, i.e. was unfaithful, and then went away'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/19.htm'
    quote: 'עליו תּזנה, "she played the harlot out beyond him," i.e., was unfaithful to her husband, and then went away from him," back to her father''s house.'
  - where: 'note 19:2 “Unfaithful, or angry?”'
    claim: 'The Septuagint says only that she departed'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/judges/19.htm'
    quote: '2And his concubine departed from him, and went away from him to the house of her father to Bethleem Juda, and she was there four months.'
  - where: 'note 19:2 “Unfaithful, or angry?”'
    claim: 'A modern translation: she became angry with him'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Judges+19&version=NRSVUE'
    quote: 'But his concubine became angry with him, and she went away from him to her father’s house at Bethlehem in Judah'
  - where: 'note 19:2 “Unfaithful, or angry?”'
    claim: 'The husband went to speak to her heart, to win her back'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/19.htm'
    quote: 'her husband went after her, "to speak to her to the heart," i.e., to talk to her in a friendly manner (see Genesis 34:3), and to reconcile her to himself again'
  - where: 'note 19:4 “Five days at Bethlehem”'
    claim: '“Retained” means laid hold on him; the hospitality has tragic significance in view of what follows'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/19.htm'
    quote: '4. retained him] or laid hold on him to prevent him from going away, cf. Jdg 7:8. The pressing and rather boisterous hospitality of the girl’s father has a tragic significance in view of what follows'
  - where: 'note 19:4 “Five days at Bethlehem”'
    claim: 'The father detains them; on the fifth day the Levite leaves despite the late hour'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'The father welcomes his son-in-law, entertaining him for three days as the Levite persuades Beth to return. The father-in-law detains the group a few more days. On the fifth day the Levite departs despite the lateness of the hour.'
  - where: 'note 19:12 “Passing by Jebus”'
    claim: 'Jebus was Jerusalem, a fortress independent until David took it'
    key: bd-jebus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jebus?lang=eng'
    quote: 'Ancient name of Jerusalem (Judg. 19:10; 1 Chr. 11:4–5); it was a hill fortress, which maintained its independence until stormed by David (2 Sam. 5:6–9).'
  - where: 'note 19:12 “Passing by Jebus”'
    claim: 'Jerusalem was Jebusite in the time of the judges and became Israel’s capital only under David'
    key: ot-manual-judges-13-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-13-21-ruth-1-4-the-reign-of-the-judges-part-2?lang=eng'
    quote: 'The city of Jerusalem was inhabited by the Jebusites during the time of the judges (see Judges 19:10–11). Jerusalem did not become a holy city and a capital for the Israelites until David conquered the Jebusites.'
  - where: 'note 19:12 “Passing by Jebus”'
    claim: 'Benjamin did not drive the Jebusites out of Jerusalem; Gibeath is in Benjamin’s inheritance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/18?lang=eng'
    quote: 'And Zelah, Eleph, and Jebusi, which is Jerusalem, Gibeath, and Kirjath; fourteen cities with their villages. This is the inheritance of the children of Benjamin'
  - where: 'note 19:12 “Passing by Jebus”'
    claim: 'The Levite would not lodge at Jebus, a non-Israelite city'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'Not wanting to lodge at Jebus, a non-Israelite city, the Levite pushes on; they travel to Gibeah, a Benjaminite city.'
  - where: 'note 19:18 “The house of the LORD, or home?”'
    claim: 'The Hebrew of 19:18 reads “house of the LORD”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'יְהוָה֙'
  - where: 'note 19:18 “The house of the LORD, or home?”'
    claim: 'The Septuagint reads “I am going home”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/judges/19.htm'
    quote: 'I am from thence, and I went as far as Bethleem Juda, and I am going home, and there is no man to take me into his house.'
  - where: 'note 19:18 “The house of the LORD, or home?”'
    claim: 'A modern translation reads “my home”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Judges+19&version=NRSVUE'
    quote: 'I went to Bethlehem in Judah, and I am going to my home. Nobody has offered to take me in.'
  - where: 'note 19:18 “The house of the LORD, or home?”'
    claim: 'The last letter of “my house” was taken for the divine name; nothing suggests he was going to Shiloh'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/19.htm'
    quote: 'the last letter of bêthî = my house was taken as the initial of the divine name Yahweh. … There is nothing in the context to suggest that the Levite was going to Shiloh.'
  - where: 'note 19:22 “Gibeah told like Sodom”'
    claim: 'In both stories guests are taken in, neighbors threaten rape, and the host offers two women'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'The Gibeah abduction story is obviously similar to the Lot story in Sodom. In both stories the guests are taken in, the neighbors threaten a homosexual rape, and the host offers two women as substitutes.'
  - where: 'note 19:22 “Gibeah told like Sodom”'
    claim: 'Judges 19 is meant to be read in light of Genesis 19'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'The reader is meant to read Judges 19 in light of Genesis 19. Genesis 19 can easily be read without knowing Judges 19, but to understand Judges 19 the reader must know about Sodom.'
  - where: 'note 19:22 “Gibeah told like Sodom”'
    claim: 'Both hosts invite the mob to do what is good in their eyes; Judges shows people doing what is right in their own eyes'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'The book of Judges shows what happens when people do what is right in their own eyes and wrong in God’s. Lasine connects these sight images: … both hosts offer the women and invite the mob outside to “do what is good in your eyes.”'
  - where: 'note 19:22 “Gibeah told like Sodom”'
    claim: 'The host’s words in 19:24 are “in your eyes” in the Hebrew'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'בְּ/עֵינֵי/כֶ֑ם'
  - where: 'note 19:22 “Gibeah told like Sodom”'
    claim: 'Lot’s words at Sodom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/19?lang=eng'
    quote: 'do ye to them as is good in your eyes: only unto these men do nothing; for therefore came they under the shadow of my roof.'
  - where: 'note 19:25 “The Levite puts her out”'
    claim: 'The Levite pushes her out to the mob; he compares unfavorably with the angels who rescue'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'The Levite compares unfavorably with Lot’s divine visitors. The visitors to Sodom effect a rescue while the Levite ejects Beth to the mob outside.'
  - where: 'note 19:25 “The Levite puts her out”'
    claim: 'An older reading takes “the man” to be the host, with the guest’s consent'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/19.htm'
    quote: 'the man (no doubt the master of the house, according to Judges 19:24) took his (the guest''s) concubine (of course with the consent of his guest) and led her out to them'
  - where: 'note 19:25 “The Levite puts her out”'
    claim: 'The angels pull Lot in and shut the door'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/19?lang=eng'
    quote: 'But the men put forth their hand, and pulled Lot into the house to them, and shut to the door.'
  - where: 'note 19:28 “But none answered”'
    claim: 'The Hebrew leaves her state ambiguous; the Septuagint and many translations say she was dead; it is undecided who killed her'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'The Masoretic text leaves ambiguous Beth’s status. Septuagint translators declare her dead on the doorstep, as do many modern translations. The Masoretic ambiguity leaves it undecided who finished off murdering her—the mob or her husband.'
  - where: 'note 19:28 “But none answered”'
    claim: 'The Septuagint adds “for she was dead”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/judges/19.htm'
    quote: 'And he said to her, Rise, and let us go; and she answered not, for she was dead'
  - where: 'note 19:29 “Twelve pieces sent through Israel”'
    claim: 'Sending the pieces to the twelve tribes was a symbolic summons to punish the crime, with a spoken explanation; compare Saul in 1 Sam. 11:7'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/19.htm'
    quote: 'Sending the dissected pieces of the corpse to the tribes was a symbolical act, by which the crime committed upon the murdered woman was placed before the eyes of the whole nation, to summon it to punish the crime'
  - where: 'note 19:29 “Twelve pieces sent through Israel”'
    claim: 'Each piece as an execration on the tribe that would not come'
    key: clarke-judges
    url: 'https://biblehub.com/commentaries/clarke/judges/19.htm'
    quote: 'it is very likely that they considered each of the pieces as expressing an execration, "If ye will not come and avenge my wrongs, may ye be hewn in pieces like this abused and murdered woman!"'
  - where: 'note 19:29 “Twelve pieces sent through Israel”'
    claim: 'The manual prints Clarke’s reading for 19:29–30'
    key: ot-manual-judges-13-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-13-21-ruth-1-4-the-reign-of-the-judges-part-2?lang=eng'
    quote: 'There is no doubt that with the pieces he sent to each tribe a circumstantial account of the barbarity of the men of Gibeah; and it is very likely that they considered each of the pieces as expressing an execration'
  - where: 'note 19:29 “Twelve pieces sent through Israel”'
    claim: 'Saul cut up oxen and sent them to the twelve tribes to relieve Jabesh-gilead (1 Sam. 11:7)'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'In the parallel story Saul, the newly established king of Israel, cuts up a yoke of oxen and sends a portion to each of the twelve tribes to rally them to him so that he may relieve the besieged city of Jabesh-Gilead.'
  - where: 'note 19:29 “Twelve pieces sent through Israel”'
    claim: 'The Saul allusion makes the Levite’s message clear; a king rallies Israel, the Levite’s act shows disintegration'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'The Saul allusion makes clear the Levite’s message; if the people didn’t rally, their concubines would be similarly dismembered. … Saul dismembers the oxen to make Israel socially cohesive in his first act as Israel’s first king. The Levite’s bloody dispersal and internal warfare among Israelites is evidence of social disintegration.'
  - where: 'note 19:29 “Twelve pieces sent through Israel”'
    claim: 'The footnote at 19:29 points to 1 Sam. 11:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/19?lang=eng'
    quote: '29a “sent”: 1 Sam. 11:7.'
  - where: 'note 19:30 “Nothing like it since Egypt”'
    claim: 'The Exodus is the birthday of Israel’s national life'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/19.htm'
    quote: 'is frequently referred to as the birth-day of Israel’s national life, cf. Jdg 6:13, 1 Samuel 8:8, 2 Samuel 7:6, Amos 2:10; Amos 9:7, Micah 6:4 etc.'
  - where: 'note 19:30 “Nothing like it since Egypt”'
    claim: '“Consider of it … speak your minds” asks the tribes to decide the punishment, and chapter 20 shows they did'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/19.htm'
    quote: 'Give ye heed to it (שׁימוּ for לב שׂימוּ); make up your minds and say on, i.e., decide how this unparalleled wickedness is to be punished.'
  - where: 'note 19:28 “But none answered”'
    claim: 'The Church’s chapter heading says the men of Gibeah abuse her and she dies'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/19?lang=eng'
    quote: 'The men of Gibeah abuse the concubine and she dies'
  - where: 'note 19:18 “The house of the LORD, or home?”'
    claim: 'An older reading keeps the Hebrew and from 19:18 places the Levite’s home near Shiloh'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/19.htm'
    quote: 'the northern extremity of these mountains; according to Judges 19:18, probably the neighbourhood of Shiloh.'
  - where: christ
    claim: 'The book’s portrayal of these chapters is a condemnation, not acceptance; the laws and covenants were designed to protect'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'is not an acceptance or tolerance of the unacceptable but a condemnation of the deplorable (Judges 19–21). … God-given laws and covenants that were designed to protect and ensure the care and civility of individuals'
  - where: christ
    claim: 'Such stories invite us to turn to Christ, through whom injustices will be made right'
    key: scripture-helps-women
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/51-women-in-the-old-testament?lang=eng'
    quote: 'Both kinds of stories invite us to turn to Jesus Christ. Through Him, all injustices will one day be made right, and all wounds can be healed. No hardship is beyond the reach of the Redeemer’s grace.'
  - where: christ
    claim: 'The texts create a space to name and discuss abuse; they exist to be condemned'
    key: easton-recognizing
    url: 'https://rsc.byu.edu/covenant-compassion/recognizing-responsibility-standing-victims'
    quote: 'the Levite’s concubine (Judges 19–21) and Jephthah’s daughter (Judges 11) a part of our Sunday curriculum. These texts create a biblically sanctioned space to name and discuss abuse within a church setting'
  - where: christ
    claim: 'The woman is nameless'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'This woman is nameless, known only by her [Page 71]relationships to men.'
  - where: explore
    claim: 'Schade’s study of Judges covers chapters 19–21'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Thus, the book of Judges was not compiled to condone brutality or idolatry or to justify the despicable treatment of women, men, and society'
