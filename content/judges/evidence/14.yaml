chapter: 14
claims:
  - where: when
    claim: 'The chapter is set when the Philistines ruled Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/14?lang=eng'
    quote: 'for at that time the Philistines had dominion over Israel.'
  - where: setting
    claim: 'Israel had been given to the Philistines forty years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/13?lang=eng'
    quote: 'and the Lord delivered them into the hand of the Philistines forty years.'
  - where: setting
    claim: 'The book passes from Samson’s birth to his adulthood; only 13:25 tells of his youth'
    key: ot-minute-judg-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-14'
    quote: 'The author of Judges skipped over the details of Samson’s childhood and adolescence, narrating Samson’s birth and then describing his adulthood.'
  - where: setting
    claim: 'The events of Judges 14–15 took place in Dan’s territory along the Sorek Valley, between Zorah and the Philistine towns of Timnath and Ekron; Samson left it only to go to Ashkelon'
    key: chadwick-beit-lei
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/khirbet-beit-lei-lehi-samson'
    quote: 'Virtually all events of Samson’s life that are described in Judges 14–15 took place in the territory of Dan along the Sorek Valley, which winds east to west from the area of Zorah and Beth Shemesh to the Philistine towns of Timnath and Ekron'
  - where: setting
    claim: 'Samson left the Sorek region only briefly, for Ashkelon'
    key: chadwick-beit-lei
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/khirbet-beit-lei-lehi-samson'
    quote: 'He only left the Sorek region briefly to go to Ashkelon, where he carried out a deadly solution to pay off the bet he lost over his riddle (Judges 14:19).'
  - where: thread
    claim: 'The scriptures repeat “and he went down” of Samson’s journeys and choices, which Dibb reads as his being overcome by the world'
    key: dibb-arise
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2012/04/arise-and-shine-forth?lang=eng'
    quote: 'Repeatedly, the scriptures use the phrase “and he went down” as they tell of Samson’s journeys, actions, and choices. Instead of arising and shining forth to fulfill his great potential, Samson was overcome by the world'
  - where: thread
    claim: 'Samson is portrayed as wily and shrewd, but out of his league when his wife is pressured to reveal the answer'
    key: ot-minute-judg-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-14'
    quote: 'Early in the story Samson is thus portrayed as a wily, shrewd character—a depiction that is reinforced throughout the rest of the chapter with the riddle contest … However, the narrative also depicts Samson as being out of his league'
  - where: section 3 plain
    claim: 'The “sheets” are linen garments; the “change of garments” festal dress'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/14.htm'
    quote: 'linen garments] The garment referred to (Hebr. sâdîn, Isaiah 3:23, Proverbs 31:24, perhaps of foreign origin, cf. Assyr. sudinnu) was of fine material'
  - where: section 4 plain
    claim: '“Lay sore upon him” means pressed him hard'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/14.htm'
    quote: 'Samson resisted them until the seventh day, when she became more urgent than ever, in consequence of this threat on the part of the Philistines.'
  - where: 'note 14:3 “She is right in my eyes”'
    claim: 'A Philistine wife was problematic because Israel was subjugated to the Philistines'
    key: ot-minute-judg-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-14'
    quote: 'Readers are led to believe that Samson wanted a Philistine wife, which is problematic to say the least since Israel was at that time subjugated under the Philistines (see 13:1).'
  - where: 'note 14:3 “She is right in my eyes”'
    claim: 'The verb of “pleaseth me well” means to be right or pleasing in someone’s eyes, said of a woman in 14:3, 7'
    key: bdb
    url: 'https://biblehub.com/hebrew/3474.htm'
    quote: '2 figurative, be pleasing, agreeable, right (בְּעֵינֵי in the yees of); said of a woman Judges 14:3,7'
  - where: 'note 14:3 “She is right in my eyes”'
    claim: 'The Hebrew of 14:3 reads yāšrâ bəʿênāy, “she is right in my eyes”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'יָשְׁרָ֥ה'
  - where: 'note 14:3 “She is right in my eyes”'
    claim: 'As quoted in Schade: Samson, the least covenant-conscious judge, is remembered as seeking out only Philistines'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Samson, arguably the least covenantal conscious of the judges, is remembered to have sought out only Philistines throughout his lifetime. By the end of the book, then, even the leader designated by the deity does not follow the practices incumbent upon all Israel.'
  - where: 'note 14:4 “It was of the LORD”'
    claim: 'The subject of “he sought” may be the LORD; an occasion means for a quarrel; compare Josh. 11:20'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/14.htm'
    quote: 'he sought an occasion] The subject is Jehovah, cf. Joshua 11:20; an occasion, i.e. for a quarrel, cf. 2 Kings 5:7.'
  - where: 'note 14:4 “It was of the LORD”'
    claim: 'Whether “he” is Samson or the LORD is doubtful; Samson’s stubborn choice was the means God’s purpose used to overthrow the Philistines'
    key: pulpit-judges
    url: 'https://biblehub.com/commentaries/pulpit/judges/14.htm'
    quote: 'It is doubtful whether "he" refers to Samson or to the Lord. Most commentators refer it to Samson'
  - where: 'note 14:4 “It was of the LORD”'
    claim: 'Samson’s stubborn choice was the means of God’s purpose for overthrowing the Philistine dominion'
    key: pulpit-judges
    url: 'https://biblehub.com/commentaries/pulpit/judges/14.htm'
    quote: 'the statement that Samson s obstinate determination to take a Philistine wife was the means which God''s secret purpose had fixed upon for bringing about the eventual overthrow of the Philistine dominion'
  - where: 'note 14:4 “It was of the LORD”'
    claim: 'The noun “occasion” occurs only here; the verb means to seek the right time to injure someone'
    key: pulpit-judges
    url: 'https://biblehub.com/commentaries/pulpit/judges/14.htm'
    quote: 'An occasion. The noun only occurs here; but the verb … to seek the right time for injuring any one (2 Kings 5:7, seeketh a quarrel, A.V. ).'
  - where: 'note 14:4 “It was of the LORD”'
    claim: 'Smoot reads Samson’s request as a pretext to move against the Philistines'
    key: ot-minute-judg-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-14'
    quote: 'Manoah, Samson’s father, resisted this, not realizing that Samson’s request was pretext to move against the Philistines (14:3–4).'
  - where: 'note 14:6 “Came mightily”'
    claim: 'The verb means “rush,” used especially of sudden possession by the Spirit, of Samson and of Saul and David'
    key: bdb
    url: 'https://biblehub.com/hebrew/6743.htm'
    quote: 'especially of sudden possession by (אֱהִֹים) ׳רוּחַ י, with עַל, with person Judges 14:6 the Spirit . . . rushed upon him, so Judges 14:19; Judges 15:14; 1 Samuel 10:6,10; 1 Samuel 11:6; with אֶל person 1 Samuel 16:13'
  - where: 'note 14:6 “Came mightily”'
    claim: 'The Hebrew verb of 14:6 is tsalach'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'וַ/תִּצְלַ֨ח'
  - where: 'note 14:6 “Came mightily”'
    claim: 'In Samson’s account the phrase seems to acknowledge only his strength, a gift from God'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'However, in the account of Samson, this phrase seems to acknowledge only his remarkable physical strength, which came as a gift from God.'
  - where: 'note 14:6 “Came mightily”'
    claim: 'The Spirit’s power is sometimes shown “mightily,” as with Samson, sometimes as a still small voice'
    key: wilson-holy-spirit
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/holy-spirit'
    quote: 'Sometimes the power of the Spirit is demonstrated “mightily” as with Samson (Judges 14:6), and sometimes as “a still small voice” as with Elijah (1 Kings 19:12).'
  - where: 'note 14:9 “The honey he did not explain”'
    claim: 'One older reading: the parents would have refused the honey as unclean, and would have known the secret that became the riddle'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/14.htm'
    quote: 'for in that case they would not only have refused to eat it as being unclean, but would have been aware of the fact, which Samson afterwards took as the subject of the riddle that he proposed to the Philistines.'
  - where: 'note 14:9 “The honey he did not explain”'
    claim: 'The riddle and its answer rest on the encounter of verses 8–9'
    key: ot-minute-judg-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-14'
    quote: 'The riddle itself and its answer are both predicated on the encounter narrated at verses 8–9'
  - where: 'note 14:14 “A riddle no one could guess”'
    claim: 'A modern translation renders the riddle “Out of the eater came something to eat”; Smoot reads it as foreshadowing Delilah: love, sweeter and stronger, will contribute to Samson’s downfall'
    key: ot-minute-judg-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-14'
    quote: 'also foreshadow Samson’s later involvement with Delilah … What, after all, is sweeter or more powerful than love? And love will later contribute to Samson’s downfall.'
  - where: 'note 14:14 “A riddle no one could guess”'
    claim: 'The NRSV renders “Out of the eater came something to eat. Out of the strong came something sweet”'
    key: ot-minute-judg-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-14'
    quote: 'Compare the rendering of these verses given in the New Revised Standard Version: “Out of the eater came something to eat. Out of the strong came something sweet.'
  - where: 'note 14:15 “The seventh day or the fourth?”'
    claim: 'The Hebrew of 14:15 has “the seventh”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'הַ/שְּׁבִיעִ֗י'
  - where: 'note 14:15 “The seventh day or the fourth?”'
    claim: 'The Septuagint reads “on the fourth day”'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/judges/14.htm'
    quote: '15And it came to pass on the fourth day, that they said to the wife of Sampson, Deceive now thy husband, and let him tell thee the riddle'
  - where: 'note 14:15 “The seventh day or the fourth?”'
    claim: 'Verses 15 and 17 seem inconsistent; the Septuagint and Peshitto read “fourth”'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/14.htm'
    quote: 'In Jdg 14:17 she is said to have tried herself to find it out all the seven days. The two statements are inconsistent. The LXX and Peshitto read on the fourth day'
  - where: 'note 14:15 “The seventh day or the fourth?”'
    claim: 'One older reading harmonizes: she pleaded each day from curiosity, and pressed hardest on the seventh after the threat'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/14.htm'
    quote: 'The woman had already come to Samson every day with her entreaties from simple curiosity; but Samson resisted them until the seventh day, when she became more urgent than ever, in consequence of this threat on the part of the Philistines.'
  - where: 'note 14:18 “Plowed with my heifer”'
    claim: 'Samson lashed out in sarcasm and anger; the sexual innuendo of verse 18 is apparent'
    key: ot-minute-judg-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-14'
    quote: 'The sexual inuendo in Samson’s statement to the Philistine men in verse 18 (“If ye had not plowed with my heifer, ye had not found out my riddle”) is readily apparent, especially in light of the preceding verses.'
  - where: 'note 14:18 “Plowed with my heifer”'
    claim: 'Samson was tempestuous, lashing out in sarcasm and anger after being bested'
    key: ot-minute-judg-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-14'
    quote: 'The chapter also reveals Samson to have been a tempestuous sort who, after being bested, lashed out in sarcasm and anger (verses 18–19).'
  - where: 'note 14:19 “Thirty men of Ashkelon”'
    claim: 'Samson went to Ashkelon to pay off the bet'
    key: chadwick-beit-lei
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/khirbet-beit-lei-lehi-samson'
    quote: 'He only left the Sorek region briefly to go to Ashkelon, where he carried out a deadly solution to pay off the bet he lost over his riddle (Judges 14:19).'
  - where: 'note 14:19 “Thirty men of Ashkelon”'
    claim: 'The Student Manual: he was furious and wreaked havoc at Ashkelon to get the spoils to pay his debt'
    key: ot-manual-judges-13-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-13-21-ruth-1-4-the-reign-of-the-judges-part-2?lang=eng'
    quote: 'When his wife revealed the answer to the thirty Philistine guests to save her own life (see v. 15) and Samson lost the wager, he was furious and wreaked havoc on the Philistines at Ashkelon to get the spoils necessary to pay his debt.'
  - where: 'note 14:19 “Thirty men of Ashkelon”'
    claim: 'The phrase in Samson’s story seems to acknowledge only his strength'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'However, in the account of Samson, this phrase seems to acknowledge only his remarkable physical strength, which came as a gift from God.'
  - where: 'note 14:20 “The best man”'
    claim: 'The companion was the best man; the father-in-law gave her probably for spite'
    key: ot-manual-judges-13-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-13-21-ruth-1-4-the-reign-of-the-judges-part-2?lang=eng'
    quote: 'Probably for spite, his father-in-law gave Samson’s wife to the man “used as his friend” (v. 20), that is, his best man at the wedding.'
  - where: 'note 14:20 “The best man”'
    claim: 'The failed marriage led to Samson’s revenge on Timnath’s fields and the Philistines’ killing of his wife'
    key: chadwick-beit-lei
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/khirbet-beit-lei-lehi-samson'
    quote: 'With the failure of his marriage, Samson took revenge against the Philistines of Timnath by tying torches to the tails of foxes and turning them loose in the grain fields and grape vineyards of the Philistines in the western Sorek'
  - where: christ
    claim: 'No matter how flawed the judge, God saves (Samson “begins to save”); He is gracious and long-suffering'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'No matter how flawed or sinful the judge, God saves (or in the case of Samson, “begins to save”). God demonstrates that he is gracious and long-suffering.'
  - where: christ
    claim: 'His people’s disobedience cannot thwart God’s plan'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Through each cycle, the writer emphasizes that God is sovereign; his own people’s disobedience cannot thwart his plan.'
  - where: christ
    claim: 'Preserving and developing God-given gifts, rather than misusing them, is a lesson of the imperfect judges'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Perhaps such a preservation, development, and protection of God-given gifts—rather than abusing, misusing, or failing to develop them—can be a major lesson we take from the portrayal of imperfect judges in this book.'
  - where: 'note 14:4 “It was of the LORD”'
    claim: 'Samson is portrayed as a wily, shrewd character'
    key: ot-minute-judg-14
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-14'
    quote: 'Early in the story Samson is thus portrayed as a wily, shrewd character'
  - where: 'note 14:4 “It was of the LORD”'
    claim: 'The Church’s footnote to “LORD” in verse 4 points to Josh. 11:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/14?lang=eng'
    quote: 'Josh. 11:20'
  - where: 'note 14:6 “Came mightily”'
    claim: 'Today having the Spirit of the Lord means being faithful and worthy of the Holy Ghost’s influence'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'Today when we speak of a person having the Spirit of the Lord, we are usually referring to someone who is faithful and obedient and therefore worthy of the Holy Ghost’s influence.'
  - where: christ
    claim: 'God-given gifts can be lost or used for good; preserving them is a lesson of the imperfect judges'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'God-given spiritual gifts could be lost and forsaken, such as Gideon making an ephod and worshiping it (Judges 8:26–27) or Samson, whom the Lord initially blessed (13:24) but who eventually turned to all sorts of misconduct.'
  - where: christ
    claim: 'The Spirit’s power works best when God’s servants realize their powerlessness without it'
    key: wilson-holy-spirit
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/holy-spirit'
    quote: 'In all cases, the Spirit’s power works best when God’s servants realize their personal powerlessness without it.'
  - where: 'note 14:3 “She is right in my eyes”'
    claim: 'The Church’s footnote to “uncircumcised” in verse 3 points to Gen. 34:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/14?lang=eng'
    quote: 'Gen. 34:14'
  - where: 'note 14:14 “A riddle no one could guess”'
    claim: 'The Hebrew word is a riddle to be guessed in Judges 14; elsewhere an obscure utterance, allegory or figurative saying'
    key: bdb
    url: 'https://biblehub.com/hebrew/2420.htm'
    quote: '2 riddle, enigma, to be guessed, in Judges 14:'
  - where: 'note 14:14 “A riddle no one could guess”'
    claim: 'Elsewhere the word is used of a dark utterance, an allegory, figurative sayings, a lesson taught indirectly'
    key: bdb
    url: 'https://biblehub.com/hebrew/2420.htm'
    quote: 'riddle = dark, obscure utterance Numbers 12:8'
  - where: 'note 14:14 “A riddle no one could guess”'
    claim: 'The “sheets” were wrappers of fine linen, worn as an outer garment or alone at night'
    key: bdb
    url: 'https://biblehub.com/hebrew/5466.htm'
    quote: 'wrapper or rectangular piece of fine linen, worn as outer, or (at night) as sole garment'
  - where: 'note 14:14 “A riddle no one could guess”'
    claim: 'A “change of garments” is a change of raiment'
    key: bdb
    url: 'https://biblehub.com/hebrew/2487.htm'
    quote: '1 change of raiment'
