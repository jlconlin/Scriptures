chapter: 12
claims:
  - where: when
    claim: 'The chapter follows Jephthah’s war with Ammon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/12?lang=eng'
    quote: 'Wherefore passedst thou over to fight against the children of Ammon, and didst not call us to go with thee?'
  - where: setting
    claim: 'Gilead is the highland east of the Jordan, assigned to Gad and half of Manasseh'
    key: bd-gilead
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gilead?lang=eng'
    quote: 'A highland district east of the Jordan, south of Bashan, rising in parts to an elevation of 4000 feet above the sea. … It was assigned half to the tribe of Gad and half to Manasseh.'
  - where: setting
    claim: 'Ephraim held rich land west of the Jordan, with Shechem and Shiloh; Joshua was of the tribe'
    key: bd-ephraim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephraim?lang=eng'
    quote: 'Joshua belonged to this tribe, and to him was due much of its subsequent greatness. After the settlement in Canaan, the district assigned to the two sons of Joseph included some of the richest land in the country'
  - where: thread
    claim: 'The fords were seized “against” Ephraim as at 3:28 and 7:24'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/12.htm'
    quote: '5. took the fords] Cf. Jdg 3:28, Jdg 7:24. Render against (dat. incommodi) rather than toward (marg.) in these passages.'
  - where: thread
    claim: 'Jephthah’s story closes with the formula used of the minor judges'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/12.htm'
    quote: '7. The story of Jephthah is brought to a close with the formula which is used of the Minor Judges, Jdg 12:8-15, Jdg 10:2-5.'
  - where: thread
    claim: 'No deeds are told of the three judges; they followed Jephthah, probably over the eastern and perhaps northern tribes'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/12.htm'
    quote: 'Of these three judges no particular deeds are related, just as in the case of Tola and Jair … their office of judge also extended simply over the tribes on the east of the Jordan, and perhaps the northern tribes on this side.'
  - where: thread
    claim: 'Jephthah probably judged only the tribes east of the Jordan; his burial town is left indefinite'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/12.htm'
    quote: 'Jephthah judged Israel six years, though most probably only the tribes on the east of the Jordan. … The plural גלעד בּערי is used quite indefinitely … simply because the historian did not know the exact town.'
  - where: section 2 plain
    claim: '“Fugitives” in verse 4 rendered as a taunt, “runaways”'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/12.htm'
    quote: 'The meaning of these obscure words is probably the following: Ye Gileadites are a mob gathered together from Ephraimites that have run away'
  - where: section 3 plain
    claim: 'Ibzan’s daughters were married outside the family; Abdon’s “nephews” were grandsons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/12?lang=eng'
    quote: 'OR outside the family (as in marriage).'
  - where: section 3 plain
    claim: 'Abdon’s “nephews” were grandsons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/12?lang=eng'
    quote: 'HEB grandsons.'
  - where: 'note 12:1 “Ephraim’s grievance again”'
    claim: 'The Bible Dictionary names Ephraim’s jealousy of other tribes’ success, citing 8:1 and 12:1'
    key: bd-ephraim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephraim?lang=eng'
    quote: 'Ephraim was notorious for its jealousy of any success gained by any other tribe (Judg. 8:1; 12:1).'
  - where: 'note 12:1 “Ephraim’s grievance again”'
    claim: 'One older reading: Ephraim was striving for leadership; Gideon’s moderation had averted war; the eastern tribes had won without Ephraim'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/12.htm'
    quote: 'The jealousy of the tribe of Ephraim, which was striving after the leadership, had already shown itself in the time of Gideon in such a way that nothing but the moderation of that judge averted open hostilities.'
  - where: 'note 12:1 “Ephraim’s grievance again”'
    claim: '“Northward” may be the place name Zaphon, a Gadite town in the Jordan valley (Josh. 13:27)'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/12.htm'
    quote: 'This is generally regarded as an appellative noun (northward); but in all probability it is a proper name, "to Zaphon," the city of the Gadites in the Jordan valley, which is mentioned in Joshua 13:27'
  - where: 'note 12:3 “Jephthah’s answer”'
    claim: 'Ephraim may have hung back until victory; Gideon appeased them, Jephthah bluntly reminded them they sent no help'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'Perhaps this ruse was typical of Ephraim—to hang back until the victory was won and then pretend they wanted to be part of it all along. Gideon had appeased them, but Jephthah bluntly reminded them that, although he had asked them, they sent no recruits'
  - where: 'note 12:3 “Jephthah’s answer”'
    claim: '1 Samuel 19:5 uses the same idiom of David and the Philistine'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/19?lang=eng'
    quote: 'For he did put his life in his hand, and slew the Philistine'
  - where: 'note 12:4 “Fugitives of Ephraim”'
    claim: 'One older reading: the words are a contemptuous taunt, a mob of runaway Ephraimites, men of no name between two great tribes; pālîṭ means one who escaped danger'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/12.htm'
    quote: '"ye are an obscure set of men, men of no name, dwelling in the midst of two most noble and illustrious tribes" … the use of the word פּליט, which simply denotes a fugitive who has escaped from danger'
  - where: 'note 12:4 “Fugitives of Ephraim”'
    claim: 'Another older reading: the words make no sense where they stand, are omitted by some Septuagint manuscripts, and may belong to verse 6'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/12.htm'
    quote: 'These words, which make no sense where they stand, and are omitted by some mss. of the LXX and marked with an asterisk in Syro-Hex., probably belonged in part to Jdg 12:6'
  - where: 'note 12:4 “Fugitives of Ephraim”'
    claim: 'The same Hebrew phrase, pelîṭê ʾefrayim, stands in verse 4 and verse 5'
    key: bdb
    url: 'https://biblehub.com/hebrew/6412.htm'
    quote: 'plural construct מְּלִיטֵי Judges 12:4 +; … with Genitive subject Judges 12:5 fugitives of Ephraim'
  - where: 'note 12:4 “Fugitives of Ephraim”'
    claim: 'The Hebrew has the same word in both verses'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'פְּלִיטֵ֤י'
  - where: 'note 12:4 “Fugitives of Ephraim”'
    claim: 'In verse 5 the expression has its ordinary sense, not the contempt of verse 4'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/12.htm'
    quote: 'The "fugitives of Ephraim" were the Ephraimites who had escaped from the battle and wished to return home. The expression is used here in its ordinary sense, and not with the contemptuous sense in which the Ephraimites had used it in Judges 12:4.'
  - where: 'note 12:6 “Shibboleth”'
    claim: 'Shibbōlet means ear of grain'
    key: bdb
    url: 'https://biblehub.com/hebrew/7641.htm'
    quote: 'II. שִׁבֹּ֫לֶת noun feminine ear of grain'
  - where: 'note 12:6 “Shibboleth”'
    claim: 'The Hebrew writes the answer with samekh: šibbōlet (H7641) and sibbōlet (H5451)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'סִבֹּ֗לֶת'
  - where: 'note 12:6 “Shibboleth”'
    claim: 'The word can mean ear of grain or stream; probably “ear” here; shin and samekh distinct; a dialect difference between eastern and western tribes'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/12.htm'
    quote: 'An interesting proof of the difference in dialect between the eastern and western tribes. … The word means ‘ear of grain’ … or ‘flood,’ ‘stream’ … in this early narrative it would probably have been understood to mean ‘ear'
  - where: 'note 12:6 “Shibboleth”'
    claim: 'One older reading takes the word as stream or flood; Ephraimites generally pronounced sh as s'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/12.htm'
    quote: 'Shibboleth (a stream or flood, as in Psalm 69:3, Psalm 69:16; not an ear of corn, which is quite unsuitable here) … From this history we learn quite casually that the Ephraimites generally pronounced sh (shin) like s (samech).'
  - where: 'note 12:6 “Shibboleth”'
    claim: 'The Ephraimites said the word without the sh sound, and many were killed at the Jordan'
    key: spendlove-shibboleth
    url: 'https://journal.interpreterfoundation.org/say-now-shibboleth-or-maybe-cumorah/'
    quote: 'The Ephraimites were unable to say the word shibboleth (שבולת) correctly, pronouncing it without the sh sound (stemming from the letter shin, ש) at the beginning of the word.'
  - where: 'note 12:6 “Shibboleth”'
    claim: '“Could not frame” is a doubtful rendering; Syriac and Vulgate read “was not able”; one older reading calls the 42,000 an exaggeration'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/12.htm'
    quote: 'could not frame] A doubtful rendering. For yâkîn (impf.) read yâkôl (perf.) was not able; so Syr., cf. Vulgate non valens. forty and two thousand] Obviously an exaggeration. Cf. Jdg 8:10 n.'
  - where: 'note 12:8 “Which Bethlehem?”'
    claim: 'Josephus placed Ibzan in Judah’s Bethlehem; one older reading prefers Bethlehem of Zebulun because Judah’s is usually distinguished'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/12.htm'
    quote: 'Ibzan sprang from Bethlehem,-hardly, however, the town of that name in the tribe of Judah, as Josephus affirms (Ant. v. 7, 13), for that is generally distinguished either as Bethlehem "of Judah" (Judges 17:7, Judges 17:9; Ruth 1:2; 1 Samuel 17:12) … but probably Bethlehem in the tribe of Zebulun'
  - where: 'note 12:8 “Which Bethlehem?”'
    claim: 'Another older reading: probably Bethlehem in Zebulun, since Judges is not concerned with Judah'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/12.htm'
    quote: 'His city was probably not the Beth-lehem in Judah, because the Bk of Judges is not concerned with Judah; but the Beth-lehem in Zebulun (Joshua 19:15), now Bçt-laḥm, 7 m. N.W. of Nazareth.'
  - where: 'note 12:8 “Which Bethlehem?”'
    claim: 'Joshua 19:15 lists a Bethlehem among Zebulun’s cities'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/19?lang=eng'
    quote: 'And Kattath, and Nahallal, and Shimron, and Idalah, and Beth-lehem: twelve cities with their villages.'
  - where: 'note 12:9 “A household instead of a deed”'
    claim: 'The numbers of children and colts seem a symbol of status (Rasmussen, in the manual)'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: '“The mention of the number of sons and daughters from time to time and the fact that they could all be mounted on colts seems to be something of an ancient symbol of status” (Rasmussen, Introduction to the Old Testament, 1:152).'
  - where: 'note 12:9 “A household instead of a deed”'
    claim: '“Abroad” means outside the family; “nephews” are grandsons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/12?lang=eng'
    quote: 'OR outside the family (as in marriage).'
  - where: 'note 12:9 “A household instead of a deed”'
    claim: 'Abdon’s “nephews” were grandsons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/12?lang=eng'
    quote: 'HEB grandsons.'
  - where: christ
    claim: 'The LORD is Jehovah, the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'Through the gospel of Jesus Christ the envy of Judah and Ephraim shall cease'
    key: bd-ephraim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephraim?lang=eng'
    quote: 'The time will come when, through the operation of the gospel of Jesus Christ, the envy of Judah and Ephraim shall cease (Isa. 11:12–13).'
  - where: christ
    claim: 'God shows compassion and unending love for his people in their imperfection'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'we also focus on and acknowledge that God has compassion and unending love for his people even in their imperfection.'
