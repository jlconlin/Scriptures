chapter: 3
claims:
  - where: 'setting'
    claim: 'The introduction runs to 3:6; the history of the judges begins at 3:7'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: 'Judges consists of three parts: (1) an introduction (Judg. 1:1–3:6); (2) the history of the Twelve Judges, which falls into a succession of periods of rebellion against God, and the oppressions and deliverances by which they were followed (3:7–16:31)'
  - where: 'setting'
    claim: 'Othniel''s short account is the prototype of the cycle of 2:11–23'
    key: ot-minute-judg-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-3'
    quote: 'these verses give a prototypical example of how the cycle described in Judges 2:11–23 plays out in the rest of the narrative with subsequent judges such as Ehud, Deborah, and Gideon.'
  - where: 'setting'
    claim: 'The chapter heading summarizes the chapter: intermarriage, false gods, Othniel, Ehud'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/3?lang=eng'
    quote: 'The children of Israel intermarry with the Canaanites, worship false gods, and are cursed—Othniel judges the Israelites…'
  - where: 'thread'
    claim: 'Othniel''s account is terse, Ehud''s detailed, ironic and humorous; the two side by side show the range of the storytelling'
    key: ot-minute-judg-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-3'
    quote: 'The contrast between the descriptions of Othniel’s judgeship and Ehud’s, put side-by-side in the same chapter, demonstrates the rich diversity in storytelling techniques—ranging from the laconic and terse to the highly literary and descriptive'
  - where: 'thread'
    claim: 'Eglon''s name means cow; the fat king is the fattened cow (Smoot''s reading)'
    key: ot-minute-judg-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-3'
    quote: 'Eglon, the king of Moab, Israel’s oppressor in this account, was said to be “a very fat man” (verse 17), and his name means “cow.” He is, in other words, the “fattened cow” who will soon be sacrificed for Israel’s salvation.'
  - where: 'thread'
    claim: 'Ehud''s story is rich with irony and humor'
    key: ot-minute-judg-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-3'
    quote: 'the account of Ehud’s experience is both detailed and literarily rich with deep irony and humor.'
  - where: 'section 4 plain'
    claim: 'The "present" (minchah) is tribute, carried by others under Ehud''s charge'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/3.htm'
    quote: 'Minchah, a gift or present, is no doubt a euphemism for tribute, as in 2 Samuel 8:2, 2 Samuel 8:6; 1 Kings 5:1.'
  - where: 'section 4 plain'
    claim: 'The summer parlour was a cool room on the roof'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/3.htm'
    quote: 'The "room of cooling" (Luther, Sommerlaube, summer-arbour) was a room placed upon the flat roof of a house, which was open to the currents of air, and so afforded a cool retreat'

  - where: 'note 3:1 “Why the nations were left”'
    claim: 'Judges 2:22 gives the purpose of the cycle as testing Israel''s faith'
    key: ot-minute-judg-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-2'
    quote: 'The purpose of this cycle was explicitly said to have been to test Israel’s faith: “That through them [the Canaanites] I may prove Israel, whether they will keep the way of the Lord to walk therein, as their fathers did keep it, or not” (verse 22).'
  - where: 'note 3:1 “Why the nations were left”'
    claim: 'Those who had not known the wars of Canaan are the generation after Joshua'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/3.htm'
    quote: '"all those who had not known all the wars of Canaan," sc., from their own observation and experience, that is to say, the generation of the Israelites which rose up after the death of Joshua.'
  - where: 'note 3:1 “Why the nations were left”'
    claim: 'Learning war means learning that Israel conquers only in the power of its God, which reconciles 3:2 with 3:4'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/3.htm'
    quote: 'to teach it by experience, that the people of Jehovah could only fight and conquer in the power of its God-the Lord had left the Canaanites in the land.'
  - where: 'note 3:1 “Why the nations were left”'
    claim: 'Under Joshua Israel had learned that its power lay in its God, which it had only while faithful'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/3.htm'
    quote: 'the power to conquer its foes did not consist in the multitude and bravery of its own fighting men, but solely in the might of its God, which it could only possess so long as it continued faithful to the Lord.'
  - where: 'note 3:1 “Why the nations were left”'
    claim: 'If Israel learned war in this sense it would learn to keep the commandments'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/3.htm'
    quote: 'If Israel should so learn to war, it would learn at the same time to keep the commandments of God.'

  - where: 'note 3:6 “Marriage and the gods of the land”'
    claim: 'The warning of Deuteronomy 7:3–5 went unheeded, and the idolatry that broke the covenant was sustained from generation to generation'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'The practice of idolatry which broke the covenant and which was sustained from generation to generation corrupted the house of Israel. One of the most important reminders to Israel that the Lord gave through Moses before they entered the promised land went unheeded (see Deuteronomy 7:3–5).'
  - where: 'note 3:6 “Marriage and the gods of the land”'
    claim: 'Israel was "Canaanized" by choice, as 3:5–7 sums up'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Israel was religiously being “Canaanized” by choice as they assimilated neighboring cultural practices that were putting them at odds with God’s covenants'
  - where: 'note 3:6 “Marriage and the gods of the land”'
    claim: 'Living close together made the exchange possible and appealing'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'The cultural and religious diffusion and exchange that would become so appealing and threaten the spiritual life of the people of Israel would all be facilitated by close proximity within Canaanite cultures'
  - where: 'note 3:8 “Cushan of double wickedness”'
    claim: 'Cushan-rishathaim is king of Aram-naharaim and otherwise unknown'
    key: bdb
    url: 'https://biblehub.com/hebrew/3573.htm'
    quote: 'proper name, masculine king of Aram Naharaim Judges 3:8 (twice in verse); Judges 3:10 (twice in verse); otherwise unknown'
  - where: 'note 3:8 “Cushan of double wickedness”'
    claim: 'Aram-naharaim is "Aram of the two rivers," rendered Mesopotamia in the KJV'
    key: bdb
    url: 'https://biblehub.com/hebrew/763.htm'
    quote: 'Aram of (the) two rivers (Euphrates and Tigris) or Mesopotamia'
  - where: 'note 3:8 “Cushan of double wickedness”'
    claim: 'The name is probably a title Israel gave him; rishathaim means "double wickedness," so read by the Targums and Syriac'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/3.htm'
    quote: 'His name, Chushan-rishathaim, is probably only a title which was given to him by the Israelites themselves. Rishathaim signifies "double wickedness," and the word was rendered as an appellative with this signification in the Targums and the Syriac and Arabic versions.'
  - where: 'note 3:8 “Cushan of double wickedness”'
    claim: 'All that is known of the king is in this passage'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/3.htm'
    quote: 'All that we know about this king of Mesopotamia is what is recorded here.'
  - where: 'setting'
    claim: 'The footnote at 3:10 joins the king''s name to Habakkuk 3:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/3?lang=eng'
    quote: '10b “Chushan-rishathaim”: Hab. 3:7.'

  - where: 'note 3:9 “A deliverer, a saviour”'
    claim: 'môšîaʿ means a champion in battle or oppression, from yasha, to help or save'
    key: sc-knowhy-104
    url: 'https://scripturecentral.org/knowhy/how-was-mosiah-a-type-of-christ'
    quote: '“a champion of justice in a situation of controversy, battle or oppression.” This word comes from the verb yasha, meaning “to help,” or “save.”'
  - where: 'note 3:9 “A deliverer, a saviour”'
    claim: 'Ehud is called môšîaʿ in 3:15'
    key: sc-knowhy-104
    url: 'https://scripturecentral.org/knowhy/how-was-mosiah-a-type-of-christ'
    quote: '(“deliverer”) in Judges 3:15. The Lord himself is described as Israel’s … (“saviour”) in Isaiah 49:26.'
  - where: 'note 3:9 “A deliverer, a saviour”'
    claim: 'Israel''s crying out does not seem to be repentance, nor a condition of deliverance (Schade)'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Israel’s cyclical crying out to the Lord following disobedience does not seem to be a form of repentance, nor does this appear to be a condition for the resultant deliverance by God'
  - where: 'note 3:9 “A deliverer, a saviour”'
    claim: 'The Hebrew verb for "cried" means to cry out in need or distress'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'The word frequently used in Judges describing Israel “cried” unto the Lord, is זָעַק, a word meaning to “cry out” in need, for help, in distress'

  - where: 'note 3:10 “Othniel, the first judge”'
    claim: 'Othniel''s name probably means "God is my strength" or "protection"; he was of Judah'
    key: ot-minute-judg-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-3'
    quote: 'Othniel’s name probably means something like “God is my strength” or “God is my protection,”[1] which appropriately captures Othniel’s role as judge (see verses 9–11). Othniel belonged to the tribe of Judah'
  - where: 'note 3:10 “Othniel, the first judge”'
    claim: 'Scholars are unsure of the precise meaning of the name'
    key: ot-minute-judg-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-3'
    quote: 'Scholars are unsure of the precise meaning of the name, but either of these renderings seems likely.'
  - where: 'note 3:10 “Othniel, the first judge”'
    claim: 'The Spirit gave Othniel power to judge Israel and lead in war'
    key: ot-minute-judg-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-3'
    quote: 'Crucially, the text specifies how “the Spirit of the Lord came upon” Othniel, giving him the power or ability to judge Israel and lead them in war (verse 10).'
  - where: 'note 3:11 “Rest, in round numbers”'
    claim: 'The compiler gives round numbers; judges might overlap; the chronology is difficult'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: 'There is much difficulty in deciding the chronology of the period, as the compiler generally gives his figures in round numbers. In some cases the influence of a judge only extended over part of the land, so that two judges might hold office at the same time.'

  - where: 'note 3:12 “The LORD strengthened Eglon”'
    claim: 'The city of palm trees is Jericho, evidently rebuilt after Joshua'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'The “city of palm trees” is another name for Jericho (Judges 3:13; see also Deuteronomy 34:3; Judges 1:16; 2 Chronicles 28:15). Evidently this city had been rebuilt near the original site after its destruction by Joshua.'
  - where: 'note 3:12 “The LORD strengthened Eglon”'
    claim: 'God was engaged throughout: he "strengthened" (3:12) and "raised them up a deliverer" (3:15)'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'God was never absent from the equation, and he was frequently engaged in efforts to lead people to peace, relief, and the joy of a covenantal relationship with him as he “strengthened” (3:12) and “raised them up a deliverer” (v. 15) time and time again'

  - where: 'note 3:15 “A left-handed son of the right hand”'
    claim: '"Lefthanded" is literally bound or restricted as to the right hand; the same phrase is in 20:16'
    key: bdb
    url: 'https://biblehub.com/hebrew/334.htm'
    quote: 'אִטֵּר adjective shut up, bound (Late Hebrew אִטֵּר, lame) יַדיְֿמִינוֺ ׳אִישׁ א Judges 3:15; Judges 20:16 a man bound, restricted, as to his right hand, i.e. left-handed.'
  - where: 'note 3:15 “A left-handed son of the right hand”'
    claim: 'Benjamin means "son of the right hand"; the left hand is irony and lets Ehud hide the weapon'
    key: ot-minute-judg-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-3'
    quote: 'First, it serves a bit of narrative humor and irony since the name Benjamin means “son of the right hand.” Second, it is crucial in the story since Ehud concealed his sword on a different side of his body than was usual because of his being lefthanded, thereby eluding its detection'
  - where: 'note 3:20 “A “word” from God”'
    claim: 'Ehud tricked Eglon with a devar (message, thing) from God, and the dagger was that devar (Smoot''s reading)'
    key: ot-minute-judg-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-3'
    quote: 'Ehud ironically tricked Eglon with what he claimed was a secret message (Hebrew devar, “message, thing or matter”) from God (verses 18–20). Ehud did indeed have a devar from God for Eglon: the dagger Ehud concealed under his cloak'
  - where: 'note 3:20 “A “word” from God”'
    claim: 'By misleading language Ehud made Eglon drop his guard'
    key: ot-minute-judg-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-3'
    quote: 'By using misleading language, Ehud caused Eglon to temporarily drop his guard.'
  - where: 'note 3:20 “A “word” from God”'
    claim: 'The Bible Dictionary calls it a feat of valor'
    key: bd-ehud
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ehud?lang=eng'
    quote: 'Son of Gera, a left-handed Benjamite, who by a feat of valor delivered Israel from Eglon, king of Moab, after an oppression of 18 years'
  - where: 'note 3:20 “A “word” from God”'
    claim: 'The king rose out of reverence for the word of God'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/3.htm'
    quote: 'whereupon the king rose from his seat, from reverence towards the word of God which Ehud pretended that he had to deliver to him'
  - where: 'note 3:20 “A “word” from God”'
    claim: 'One older reading: the text does not say the Spirit came on Ehud, and the means are not said to be commanded or approved'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/3.htm'
    quote: 'it is not stated (and this ought particularly to be observed) that the Spirit of Jehovah came upon Ehud … and it by no means follows that the means which he selected were either commanded or approved by Jehovah.'

  - where: 'note 3:24 “He covereth his feet”'
    claim: 'The KJV phrase is a literal rendering of a euphemism for relieving oneself'
    key: ot-minute-judg-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-3'
    quote: 'The King James Bible’s rendering of Judges 3:24 (“Surely he covereth his feet in his summer chamber”) is a fairly literal translation of the Hebrew but obscures the fact that this is almost certainly a euphemism for defecation.'
  - where: 'note 3:24 “He covereth his feet”'
    claim: 'The servants''s mistake gave Ehud time to escape and rally Israel'
    key: ot-minute-judg-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-3'
    quote: 'The king’s servants, meanwhile, were afraid to disturb their lord, thinking that he was relieving himself in his private chambers (verse 24).[3] This allowed Ehud time to escape and rally his forces'
  - where: 'christ'
    claim: 'The pattern of Judges 3 teaches the Savior''s power to deliver from sin'
    key: cfm-ot-2026-22
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/22?lang=eng'
    quote: 'Judges 3 describes a pattern that teaches about the Savior’s power to deliver us from sin.'
  - where: 'christ'
    claim: 'The word used of the judges is used of the Lord as Saviour in Isaiah 49:26'
    key: sc-knowhy-104
    url: 'https://scripturecentral.org/knowhy/how-was-mosiah-a-type-of-christ'
    quote: 'The Lord himself is described as Israel’s … (“saviour”) in Isaiah 49:26.'

  - where: 'parallels'
    claim: 'The footnote at 3:9 joins the deliverer to Nehemiah 9:27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/3?lang=eng'
    quote: '9a “deliverer”: Neh. 9:27. TG Deliver.'

  - where: 'setting'
    claim: 'The footnote at 3:5 points to Psalm 106:35'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/3?lang=eng'
    quote: '5a “dwelt”: Ps. 106:35.'
  - where: 'section 4 plain'
    claim: 'Eglon evacuated his bowels as he died'
    key: ot-minute-judg-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-3'
    quote: 'Eglon also evacuated his bowels upon death, leaving him to die in his own filth (verse 22).'
  - where: 'note 3:1 “Why the nations were left”'
    claim: 'Transgression, even Achan''s, caused Israel''s defeat under Joshua'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/3.htm'
    quote: 'whilst the transgression of that covenant, even by Achan, caused the defeat of Israel before the Canaanites (Joshua 7).'
  - where: 'note 3:9 “A deliverer, a saviour”'
    claim: 'Since repentance is not inherent in the cry, the cycles worsen instead of being repaired'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Repentance is therefore not inherent in the “crying out,” as we see in Israel’s downward cycles progressively getting worse instead of being repaired by true repentance.'
  - where: 'note 3:10 “Othniel, the first judge”'
    claim: 'Othniel''s tribe Judah has primacy in the narrator''s eyes'
    key: ot-minute-judg-3
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-3'
    quote: 'once again reinforcing the primacy of Judah in the eyes of the narrator or compiler of the book of Judges'
  - where: 'christ'
    claim: 'The phrases of the pattern: did evil, cried unto the Lord, raised up a deliverer'
    key: cfm-ot-2026-22
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/22?lang=eng'
    quote: 'you could write down these phrases: “did evil,” “cried unto the Lord,” and “raised up a deliverer.”'
  - where: 'christ'
    claim: 'Israel''s cry was a cry of distress after its own disobedience'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Israel’s cyclical crying out to the Lord following disobedience does not seem to be a form of repentance'

  - where: 'note 3:9 “A deliverer, a saviour”'
