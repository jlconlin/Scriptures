    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/judges/3-9.htm'
    quote: 'mō·wō·šî·a‘ מוֹשִׁ֛יעַ a deliverer V‑Hifil‑Prtcpl‑ms'
  - where: 'note 3:15 “A left-handed son of the right hand”'
    claim: 'The verse has ha-yemini, the Benjamite'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/judges/3-15.htm'
    quote: 'hay·mî·nî, הַיְמִינִ֔י jaminite'
  - where: 'note 3:15 “A left-handed son of the right hand”'
    claim: 'The verse has itter ... yemino, impeded in his right hand'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/judges/3-15.htm'
    quote: '’iṭ·ṭêr אִטֵּ֖ר impeded in'
  - where: 'note 3:20 “A “word” from God”'
    claim: 'The "secret errand" of 3:19 is dĕbar, a message'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/judges/3-19.htm'
    quote: 'də·ḇar- דְּבַר־ A message'
  - where: 'note 3:20 “A “word” from God”'
    claim: 'The "message from God" of 3:20 is dĕbar'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/judges/3-20.htm'
    quote: 'də·ḇar- דְּבַר־ A message'

  - where: 'parallels'
    claim: 'The footnote at 3:10 joins the king''s name to Habakkuk 3:7'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/3?lang=eng'
    quote: '10b “Chushan-rishathaim”: Hab. 3:7.'
  - where: 'note 3:20 “A “word” from God”'
    claim: 'The "secret errand" of 3:19 has sēter, secret'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/judges/3-19.htm'
    quote: 'sê·ṯer'
  - where: 'note 3:9 “A deliverer, a saviour”'
    claim: 'Only at 10:10–16 do the people cry, admit guilt and change their behavior, after the Lord says he will deliver them no more'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'This concept of a lack of contrition may be accentuated in Judges 10:10–16, where the people cried out to the Lord and admitted some guilt followed by behavior changes. This happened only after the Lord explained he had delivered them time and again'
  - where: 'setting'
    claim: 'The footnote at 3:9 joins the deliverer to Nehemiah 9:27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/3?lang=eng'
    quote: '9a “deliverer”: Neh. 9:27. TG Deliver.'
