chapter: 1
claims:
  - where: setting
    claim: 'Judges is both a continuation of Joshua and a retelling of the conquest'
    key: ot-minute-judg-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-1'
    quote: 'The book is in one sense a continuation of the narrative presented in the book of Joshua, and in another it is a retelling of the Israelite conquest of Canaan.'
  - where: setting
    claim: 'Judges seems to contradict the portrait in Joshua'
    key: ot-minute-judg-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-1'
    quote: 'In an appreciable sense, the main framing device of the book of Judges appears to contradict the historical portrait given in the book of Joshua.'
  - where: setting
    claim: 'Some tribes failed to drive out the inhabitants as commanded'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'Some of the tribes failed to drive out all the inhabitants of Canaan as they had been commanded.'
  - where: setting
    claim: 'The three parts of the book'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: 'Judges consists of three parts: (1) an introduction (Judg. 1:1–3:6); (2) the history of the Twelve Judges'
  - where: setting
    claim: 'Compiled long after the events; 18:30 refers to the captivity'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: 'The book was compiled long after the events it records; in 18:30 there is a reference to the captivity of the ten tribes.'
  - where: setting
    claim: 'Joshua says Joshua took the whole land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/11?lang=eng'
    quote: 'So Joshua took the whole land'
  - where: thread
    claim: 'The language of Judges 1 echoes Joshua; ḥerem at Zephath and Hormah'
    key: ot-minute-judg-1
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-1'
    quote: 'The language used in Judges to describe the ongoing military activity of the post-Joshua generation unmistakably echoes the language used to describe the fighting in Joshua’s time'
  - where: thread
    claim: 'The northern tribes did not expel the Canaanites; at most they made them tributary'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/1.htm'
    quote: 'but from the remaining towns of the land neither the Manassites, nor the Ephraimites, nor the tribes of Zebulun, Asher, and Naphtali expelled the Canaanites: all that they did was to make them tributary'
  - where: section 1 plain
    claim: 'Division: verses 1–21 Judah (with Benjamin at Jerusalem), 22–26 Joseph at Bethel'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/1.htm'
    quote: 'just as the Benjaminites were unable to drive the Jebusites out of Jerusalem (vv. 1-21). The tribe of Joseph also conquered the city of Bethel (Judges 1:22-26)'
  - where: section 3 plain
    claim: 'Division: verses 27–36, the tribes that made the Canaanites tributary, and Dan'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/1.htm'
    quote: 'all that they did was to make them tributary (Judges 1:27-33). The Danites were actually forced back by the Amorites out of the plain into the mountains'
  - where: 'note 1:1 “A question for the LORD, and no Joshua”'
    claim: 'Quoted in Schade: Joshua appointed no successor, so the book opens on a question'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'This creates an immediate problem, however, since Joshua has not appointed a successor before his death. . . . With no new leader present, the book of Judges poses a question in its first verse'
  - where: 'note 1:1 “A question for the LORD, and no Joshua”'
    claim: 'Asking of the LORD was probably done at the sanctuary through the priest'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/1.htm'
    quote: 'most likely at the sanctuary, through the medium of the priest'
  - where: 'note 1:1 “A question for the LORD, and no Joshua”'
    claim: 'The phrase matches the inquiry by Urim and Thummim of Num. 27:21; inquiry becomes frequent'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/1.htm'
    quote: 'to inquire the will of the Lord through the Urim and Thummim of the high priest. From this time forward inquiring of the Lord occurs with greater frequency'
  - where: 'note 1:1 “A question for the LORD, and no Joshua”'
    claim: 'The promise of 1:2 is the promise given to Joshua'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/1.htm'
    quote: 'The promise in Judges 1:2 is the same as that in Joshua 6:2; Joshua 8:1, etc.'
  - where: 'note 1:7 “Adoni-bezek’s own verdict”'
    claim: 'Mutilating captives was an ancient practice meant to terrify enemies'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'The Israelites apparently joined in the practice common among other ancients of mutilating captives in an attempt to strike terror into the hearts of other enemies.'
  - where: 'note 1:7 “Adoni-bezek’s own verdict”'
    claim: 'Schade: Israel’s adoption of this behavior perhaps transgresses God’s approval'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'However, amid these battles, we begin to see inhumane treatment inflicted upon their enemies (vv. 6–7).[28] Israel’s adoption of such behavior here perhaps transgresses God’s approval'
  - where: 'note 1:7 “Adoni-bezek’s own verdict”'
    claim: 'Quoted in Schade: talion applied, but Israel adopted a Canaanite ethic'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'it is striking that the newly arrived Israelites have actually adopted a Canaanite ethic. Instead of looking to Yahweh for ethical guidance (cf. Samson in 15:12–13), the Judahites find their models on treatment of captives in their predecessors in this land.'
  - where: 'note 1:7 “Adoni-bezek’s own verdict”'
    claim: 'Quoted in Schade: the treatment is likely an application of the lex talionis'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'is likely an application of the law of lex talionis'
  - where: 'note 1:7 “Adoni-bezek’s own verdict”'
    claim: 'The law restricted mutilation with rare exceptions; the treatment may have broken it'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Biblical laws were meant to curtail the brutality behind the lex talionis. Mutilation was restricted in the law with rare exceptions and may have been broken with the treatment of Adoni-bezek.'
  - where: 'note 1:16 “Moses’ in-laws go up with Judah”'
    claim: 'Kenites probably Midianite; Moses’ marriage a cause of the friendship with Israel'
    key: bd-kenites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kenites?lang=eng'
    quote: 'Probably a Midianite tribe, descended from Abraham by his wife Keturah. Moses’ marriage with the daughter of Jethro, a prince and priest of Midian, was also a cause of the long-standing friendship between the Kenites and Israelites'
  - where: 'note 1:16 “Moses’ in-laws go up with Judah”'
    claim: 'The city of palm trees is Jericho'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/34?lang=eng'
    quote: 'the plain of the valley of Jericho, the city of palm trees'
  - where: 'note 1:19 “The LORD with Judah, and a limit”'
    claim: 'The Hebrew is literally “not for driving out,” an unusual construction; manuscripts and versions read “was not able”'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/1.htm'
    quote: 'lit. ‘for (he was) not for driving out,’ a most unusual construction; correct he was not able to drive out, so two Hebr. MSS. and the Versions.'
  - where: 'note 1:19 “The LORD with Judah, and a limit”'
    claim: 'Iron chariots were plated or studded with iron'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/1.htm'
    quote: 'i.e. plated or studded with iron'
  - where: 'note 1:19 “The LORD with Judah, and a limit”'
    claim: 'One verb, two senses: to take possession, and to dispossess the inhabitants'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/1.htm'
    quote: 'has two different meanings in the two clauses: first'
  - where: 'note 1:19 “The LORD with Judah, and a limit”'
    claim: 'The two senses of the verb'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/1.htm'
    quote: 'to seize upon a possession which has been vacated by the expulsion or destruction of its former inhabitants; and secondly'
  - where: 'note 1:19 “The LORD with Judah, and a limit”'
    claim: 'The valley is the lowland and coastal plain, the Philistines'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'they could not drive out the inhabitants of the Shephelan and the coastal plain (the Philistines), apparently because of the chariots of iron'
  - where: 'note 1:19 “The LORD with Judah, and a limit”'
    claim: 'The real reason was loss of the Lord’s power through lack of faith and disobedience'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'The real reason for their failure, however, was that they had lost the power of the Lord through their lack of faith and by their disobedience.'
  - where: 'note 1:21 “Jerusalem taken, and the Jebusites still there”'
    claim: 'Jebus a hill fortress independent until David'
    key: bd-jebus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jebus?lang=eng'
    quote: 'it was a hill fortress, which maintained its independence until stormed by David (2 Sam. 5:6–9).'
  - where: 'note 1:24 “Mercy for the man of Luz”'
    claim: '“Mercy” in 1:24 is ḥesed'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/judges/1-24.htm'
    quote: 'ḥā·seḏ'
  - where: 'note 1:24 “Mercy for the man of Luz”'
    claim: '“Kindness” in Josh. 2:12 is ḥesed'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/joshua/2-12.htm'
    quote: 'ḥā·seḏ'
  - where: 'note 1:24 “Mercy for the man of Luz”'
    claim: 'The entrance is the easiest point of attack; the stipulation compared with Rahab’s'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/1.htm'
    quote: 'i.e. not the gate, but the point where the city could be most easily entered by an attacking party. For the stipulation cf. Joshua 2:12 f.'
  - where: 'note 1:24 “Mercy for the man of Luz”'
    claim: 'The man and his family spared as Rahab’s family was'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/1.htm'
    quote: 'As Rahab and her kindred were spared, Joshua 6:25.'
  - where: 'note 1:32 “Who dwelt among whom”'
    claim: 'The wording is reversed for Asher to show the Canaanites held the upper hand'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/1.htm'
    quote: 'As seven out of the twenty-two towns of Asher (Joshua 19:30) remained in the hands of the Canaanites, including such important places as Acco and Sidon'
  - where: 'note 1:32 “Who dwelt among whom”'
    claim: 'The reversal shows the Canaanites held the upper hand'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/1.htm'
    quote: 'to show that the Canaanites held the upper hand. And for this reason the expression "they became tributaries" (Judges 1:30, Judges 1:35, etc.) is also omitted.'
  - where: 'note 1:32 “Who dwelt among whom”'
    claim: 'Naphtali also dwelt among the Canaanites'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/1.htm'
    quote: 'so that this tribe also dwelt among the Canaanites'
  - where: 'note 1:32 “Who dwelt among whom”'
    claim: 'Dan forced back into the mountains'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/1.htm'
    quote: 'The Danites were actually forced back by the Amorites out of the plain into the mountains'
  - where: christ
    claim: 'The psalm on the nations not destroyed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/106?lang=eng'
    quote: 'They did not destroy the nations, concerning whom the LORD commanded them'
  - where: thread
    claim: '“Tributary” means forced labor'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/1.htm'
    quote: 'had to do forced labour for them.'
  - where: section 3 plain
    claim: '“Tributary” means forced labor'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/1.htm'
    quote: 'had to do forced labour for them.'
  - where: 'note 1:21 “Jerusalem taken, and the Jebusites still there”'
    claim: 'Jerusalem was in Benjamin’s lot'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/18?lang=eng'
    quote: 'Jebusi, which is Jerusalem'
  - where: christ
    claim: 'The Canaanites Israel was to drive out drew it into breaking its covenants; it lost the Lord’s protection'
    key: cfm-ot-2026-22
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/22?lang=eng'
    quote: 'Influenced by the beliefs and worship practices of the Canaanites—whom they were supposed to drive out of the land—the Israelites broke their covenants with the Lord and turned away from worshipping Him. As a result, they lost His protection'
  - where: christ
    claim: 'Christ is the Redeemer who delivers those who return to Him'
    key: cfm-ot-2026-22
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/22?lang=eng'
    quote: 'He is the Redeemer of Israel and is always willing to deliver us and welcome us back as we return to Him.'
