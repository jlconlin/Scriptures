chapter: 21
claims:
  - where: setting
    claim: 'Judges 17–21 are the third part of the book, two narratives of idolatry and lawlessness'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: '(3) two narratives, which specially show the tendency to idolatry and lawlessness (Judg. 17–21).'
  - where: setting
    claim: 'Chapter 21 closes a run of three stories about Benjamin that ends the book'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'The abduction at Shiloh is the final story in Judges, though part of a larger context. Within Judges it is one of three stories about the tribe of Benjamin closing out the book.'
  - where: setting
    claim: 'Phinehas, Aaron’s grandson, served before the ark during the war (Judg. 20:28)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/20?lang=eng'
    quote: 'And Phinehas, the son of Eleazar, the son of Aaron, stood before it in those days'

  - where: thread
    claim: 'Israel’s oaths were sworn unwisely and brought disaster on Israel and Benjamin'
    key: sc-evidence-302
    url: 'https://scripturecentral.org/evidence/three-battles-and-the-book-of-judges'
    quote: 'the forces of Israel had unwisely “sworn” an oath that those who did not join the fight against Benjamin would be put to death (Judges 21:5) … This oath, however, resulted in disaster for both the Israelites and tribe of Benjamin'

  - where: 'note 21:3 “One tribe lacking”'
    claim: 'The “house of God” of verse 2 is, in the Hebrew, the place name Bethel'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'בֵּֽית'
  - where: 'note 21:3 “One tribe lacking”'
    claim: 'A reading quoted by Goff: the solutions come when divine aid is absent'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'both episodes show the topsy-turvy way in which problems are “solved” when divine aid is noticeably absent.'

  - where: 'note 21:5 “Two oaths, and Jabesh-gilead”'
    claim: 'Mormon refused to lead the Nephites when they had sworn an oath of vengeance'
    key: sc-evidence-302
    url: 'https://scripturecentral.org/evidence/three-battles-and-the-book-of-judges'
    quote: 'Yet when Mormon heard that “they had sworn” this oath, he refused to lead them (Mormon 3:14). This oath resulted in the disastrous third battle in which the Nephite forces were nearly destroyed.'
  - where: 'note 21:19 “A feast of the LORD in Shiloh”'
    claim: 'The word for feast (ḥag) implies a pilgrimage to a sanctuary; the feast is not named; probably a vintage festival, the vines being in leaf'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/21.htm'
    quote: 'The word rendered feast (ḥag) strictly implies a pilgrimage to a sanctuary … What the particular feast here was we are not told; most probably it was a vintage festival to celebrate the ingathering'
  - where: 'note 21:19 “A feast of the LORD in Shiloh”'
    claim: 'The directions are a gloss for later readers who no longer knew where the ancient site was'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/21.htm'
    quote: 'in later times, after the exile, it was probably necessary to tell readers where the ancient sites were.'
  - where: 'note 21:19 “A feast of the LORD in Shiloh”'
    claim: 'Another older reading: one of the three great feasts, probably Passover; the description shows the place fitted the plan'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/21.htm'
    quote: 'The "feast of Jehovah," which the Israelites kept from year to year, was one of the three great annual festivals, probably one which lasted seven days, either the passover or the feast of tabernacles-most likely the former'

  - where: 'note 21:21 “Taken at the dance”'
    claim: 'Two hundred Benjamites were left without wives after Jabesh-gilead'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'The Israelites must provide some other source for the remaining 200 wifeless Benjaminites.'
  - where: 'note 21:21 “Taken at the dance”'
    claim: 'The elders’ plan was a way around their vow'
    key: goff-stealing
    url: 'https://scripturecentral.org/archive/books/book-chapter/stealing-daughters-lamanites'
    quote: 'To get around their vow, they instructed the Benjaminites to kidnap the daughters of the Israelites who lived at Shiloh while the young women danced in the vineyards.'
  - where: 'note 21:21 “Taken at the dance”'
    claim: 'Israel’s encouraging the kidnapping speaks badly of all Israel'
    key: goff-stealing
    url: 'https://scripturecentral.org/archive/books/book-chapter/stealing-daughters-lamanites'
    quote: 'just as the Israelites’ encouragement of the Benjaminites to kidnap their own daughters speaks badly of all Israel.'
  - where: 'note 21:21 “Taken at the dance”'
    claim: 'The manual: the wives were taken, though not in a righteous manner, to keep the tribe alive'
    key: ot-manual-judges-13-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-13-21-ruth-1-4-the-reign-of-the-judges-part-2?lang=eng'
    quote: 'These 600 were allowed by the princes of Israel to take wives, although not in a righteous manner, so that the tribal identity could be perpetuated, but the tribe of Benjamin remained small.'
  - where: 'note 21:21 “Taken at the dance”'
    claim: 'A reading quoted by Goff: the narrators do not approve of the stratagem'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'the Israelites use cunning to circumvent their oath against giving their daughters to repopulate Benjamin by kidnapping the girls dancing at the feast of Yahweh in Shiloh (Judges 21:16–23). Taken in their total contexts in Genesis and Judges, it is clear that the narrators do not approve of these stratagems.'
  - where: 'note 21:21 “Taken at the dance”'
    claim: 'The book’s portrayal of Judges 19–21 is a condemnation, not acceptance'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'particularly toward women, is not an acceptance or tolerance of the unacceptable but a condemnation of the deplorable (Judges 19–21).'

  - where: 'note 21:21 “The daughters of the Lamanites”'
    claim: 'Goff holds that the Book of Mormon writer used the Judges story, and that the parallel marks the book as ancient'
    key: goff-stealing
    url: 'https://scripturecentral.org/archive/books/book-chapter/stealing-daughters-lamanites'
    quote: 'Critics of the Book of Mormon believe that the author of the text used the earlier story from Judges, and I agree. But unlike them, I believe that the parallel enhances the book and reveals it to be an ancient document rather than a modern imitation.'
  - where: 'note 21:21 “The daughters of the Lamanites”'
    claim: 'The Book of Mormon uses the story to make its own point: the same acts differ by the heart of the actor'
    key: goff-stealing
    url: 'https://scripturecentral.org/archive/books/book-chapter/stealing-daughters-lamanites'
    quote: 'teach the reader that what appear to be the same actions actually differ when performed by the good-hearted on the one hand or the evil-hearted on the other.'
  - where: 'note 21:21 “The daughters of the Lamanites”'
    claim: 'Critics attribute such repeated stories to Joseph Smith’s plagiarism'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'Fawn Brodie and her acolytes misapprehend Book of Mormon narrative when'
  - where: 'note 21:21 “The daughters of the Lamanites”'
    claim: 'The two stories may be meant to be read side by side, as allusion rather than borrowing'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'Perhaps the two abduction and marriage stories are meant to be read side-by-side so that Book of Mormon narrative should not be denigrated as unoriginal but instead be appreciated for its invocation of allusions to biblical narrative.'

  - where: 'note 21:22 “Not given, so not guilty”'
    claim: 'The verse’s sense: the fathers had not given their daughters willingly, so they had not broken the oath'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/21.htm'
    quote: 'Ye may have your daughters with the Benjaminites who have taken them by force, for ye have not given them voluntarily, so as to have broken your oath by so doing.'
  - where: 'note 21:22 “Not given, so not guilty”'
    claim: 'The Hebrew of the verse is difficult; read as: if ye had given them, ye would now be guilty of violating your oath'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/21.htm'
    quote: 'The verse is difficult to understand owing to corruptions in the text.'
  - where: 'note 21:22 “Not given, so not guilty”'
    claim: 'The emended reading of the last clause'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/21.htm'
    quote: 'for if ye (emphatic) had given them unto them, ye would surely now be guilty (of violating your oath).'

  - where: 'note 21:25 “The book ends where it began to fall”'
    claim: 'The Bible Dictionary: the closing sentence calls attention to the lack of unity'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: 'The lack of unity is vividly called to the reader’s attention in the closing sentence of the book (Judg. 21:25)'
  - where: 'note 21:25 “The book ends where it began to fall”'
    claim: 'Gideon’s forty years of quietness is the last rest Judges records (the others: 3:11, 30; 5:31)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/8?lang=eng'
    quote: 'And the country was in quietness forty years in the days of Gideon.'
  - where: 'note 21:25 “The book ends where it began to fall”'
    claim: 'Scripture Helps: chapters 17–21 highlight the lack of unity and may be implying the need for a king'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'Two final episodes recorded in Judges 17–21 highlight Israel’s lack of unity in this era and may be implying the need for a king.'
  - where: 'note 21:25 “The book ends where it began to fall”'
    claim: 'Schade: the cycles grow worse until the book ends in civil war and the near annihilation of Benjamin'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Judges is portrayed in a series of downward moral spirals of disobedience that progressively worsen until the book ends in civil conflict and the near annihilation of the tribe of Benjamin (chap. 20).'
  - where: 'note 21:25 “The book ends where it began to fall”'
    claim: 'Schade: Judges pleads for the prophecy to come through Samuel; it is a bridge, not the solution'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'the book of Judges seems to plead for the rise of prophecy that will eventuate through the likes of the prophet Samuel … The book of Judges is a bridge to better things and not the solution to the story.'
  - where: 'note 21:25 “The book ends where it began to fall”'
    claim: 'Goff: what is right in one’s own eyes is often what is evil in the Lord’s'
    key: goff-stealing
    url: 'https://scripturecentral.org/archive/books/book-chapter/stealing-daughters-lamanites'
    quote: 'The topsy-turvy world described in Judges 17-21 demonstrates that doing what is right in one’s own eyes is often the same thing as doing what is evil in the Lord’s eyes.'

  - where: christ
    claim: 'Come, Follow Me: the pattern of Judges teaches of the Savior’s power to deliver from sin'
    key: cfm-ot-2026-22
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/22?lang=eng'
    quote: 'Judges 3 describes a pattern that teaches about the Savior’s power to deliver us from sin.'
  - where: christ
    claim: 'Schade: Judges shows God’s love for those who do not love Him and His reaching out to the sinner, leading Israel toward communion with Him as their king'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'God’s love for those who don’t always love him, his willingness to ever reach out to the sinner … Judges portrays a God who was lovingly attempting to lead ancient Israel toward a covenantal objective of holiness and personal communion with him as their king and their God.'
  - where: christ
    claim: 'Easton-Flake: these stories exist to be condemned and to show the need for a different way'
    key: easton-recognizing
    url: 'https://rsc.byu.edu/covenant-compassion/recognizing-responsibility-standing-victims'
    quote: 'Often their readings also reveal how God and the Bible editors are not sanctioning the violence found within the Old Testament; rather, these stories exist to be condemned and to show the need for a different way.'

  - where: explore
    claim: 'Schade’s study is the one especially good on 17–21'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'The book of Judges challenges readers to engage with the laws of God in a way that laments, not extols, the behavior of the judges and the tribes of Israel in the book of Judges.'
