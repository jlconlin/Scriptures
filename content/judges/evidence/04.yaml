chapter: 4
claims:
  - where: when
    claim: 'The chapter opens after Ehud’s death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/4?lang=eng'
    quote: 'And the children of Israel again did evil in the sight of the Lord, when Ehud was dead.'
  - where: setting
    claim: 'Ehud’s deliverance ended in eighty years of rest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/3?lang=eng'
    quote: 'So Moab was subdued that day under the hand of Israel. And the land had rest fourscore years.'
  - where: setting
    claim: 'Deborah follows Ehud; her story is told twice, in narrative (4) and poem (5); it opens with the customary formula; the villain is Jabin, a Canaanite king, with his captain Sisera'
    key: ot-minute-judg-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-4'
    quote: 'Her story is told twice in Judges 4–5: once in a narrative (Judges 4) and once in an epic poem (Judges 5). The account of Deborah’s reign as judge begins, as would be expected, with the customary formula introduction'
  - where: setting
    claim: 'Deborah is the only female judge in the Old Testament'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'Deborah, described as a prophetess, is the only female judge mentioned in the Old Testament.'
  - where: setting
    claim: 'Jael is a Kenite, of a people probably Midianite'
    key: bd-kenites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kenites?lang=eng'
    quote: 'Probably a Midianite tribe, descended from Abraham by his wife Keturah.'
  - where: setting
    claim: 'The prose and the song tell the killing differently'
    key: bd-jael
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jael?lang=eng'
    quote: 'was killed by her either while he was drinking, as seems implied by Judg. 5:24–27, or while he lay asleep, according to the prose account in Judg. 4.'
  - where: thread
    claim: 'To “sell” into a hand means to deliver up'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/4.htm'
    quote: 'for Jehovah would sell (i.e., deliver up) Sisera into the hand of a woman, viz., according to Judges 4:17., into the hand of Jael.'
  - where: thread
    claim: 'Iron chariots had kept Judah from driving out the people of the valley'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/1?lang=eng'
    quote: 'but could not drive out the inhabitants of the valley, because they had chariots of iron.'
  - where: section 1 plain
    claim: 'Sections follow the verse divisions of Smoot’s chapter (1–3; the oracle; 10–17; 18–21; 22–24)'
    key: ot-minute-judg-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-4'
    quote: 'who oppressed Israel (Judges 4:1–3). … such as the one she made at verses 5–9. … (verses 10–17). … (verses 18–21) … (verses 22–24).'
  - where: section 1 plain
    claim: '“Mightily” is forcibly, violently'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/4?lang=eng'
    quote: 'HEB forcibly, violently.'
  - where: section 3 plain
    claim: '“Discomfited” is panicked, put to flight'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/4?lang=eng'
    quote: 'OR panicked, put to flight.'
  - where: section 4 plain
    claim: 'The “mantle” is a rug or blanket; the “nail” a tent peg'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/4?lang=eng'
    quote: 'HEB rug, thick coverlet, or blanket.'
  - where: 'note 4:2 “Another Jabin in Hazor”'
    claim: 'Iron chariots had kept Judah out of the valley (Judg. 1:19)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/1?lang=eng'
    quote: 'And the Lord was with Judah; and he drave out the inhabitants of the mountain; but could not drive out the inhabitants of the valley, because they had chariots of iron.'
  - where: 'note 4:2 “Another Jabin in Hazor”'
    claim: 'One older reading: a later king of the same name, more than a century after Joshua; Jabin possibly a standing title of Hazor’s kings, as Abimelech of the Philistines’'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/4.htm'
    quote: 'The king referred to here, who lived more than a century later, bore the same name. The name Jabin, "the discerning," may possibly have been a standing name or title of the Canaanitish kings of Hazor, as Abimelech was of the kings of the Philistines'
  - where: 'note 4:4 “Prophetess and judge”'
    claim: 'Deborah is the only female judge in the Old Testament; a prophetess has a testimony of Jesus and the spirit of revelation'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'Deborah, described as a prophetess, is the only female judge mentioned in the Old Testament. A prophetess is “a woman who has received a testimony of Jesus and enjoys the spirit of revelation.”'
  - where: 'note 4:4 “Prophetess and judge”'
    claim: 'A prophetess does not hold the priesthood or its keys'
    key: gs-prophetess
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/prophetess?lang=eng'
    quote: 'A woman who has received a testimony of Jesus and enjoys the spirit of revelation. A prophetess does not hold the priesthood or its keys.'
  - where: 'note 4:4 “Prophetess and judge”'
    claim: 'Not all OT male prophets held the priesthood or keys; Deborah is the only judge with prophetic gifts and the only judge described as a religious leader; the unnamed prophet before Gideon'
    key: shannon-models-motherhood
    url: 'https://rsc.byu.edu/covenant-compassion/models-motherhood'
    quote: 'in the Old Testament it seems that not even all the males described as prophets held “the priesthood or its keys.” … she is the only judge in the entire book of Judges to whom prophetic gifts are ascribed.'
  - where: 'note 4:4 “Prophetess and judge”'
    claim: 'Shannon: only judge described as any kind of religious leader; an unnamed prophet goes before Gideon'
    key: shannon-models-motherhood
    url: 'https://rsc.byu.edu/covenant-compassion/models-motherhood'
    quote: 'An unnamed prophet goes before Gideon in Judges 6:7–10, but Gideon is not described as a prophet nor is Samson, Ehud, Jephthah, or any of the other judges. … She is the only judge described in the book of Judges as any kind of religious leader.'
  - where: 'note 4:4 “Prophetess and judge”'
    claim: 'As prophetess she made oracular pronouncements, such as the one in verses 5–9'
    key: ot-minute-judg-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-4'
    quote: 'In her role as a prophetess she would have made oracular pronouncements, such as the one she made at verses 5–9.'
  - where: 'note 4:5 “The one judge who heard cases”'
    claim: '“Dwelt” is “used to sit or remain”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/4?lang=eng'
    quote: 'HEB used to sit or remain.'
  - where: 'note 4:5 “The one judge who heard cases”'
    claim: 'Judges are depicted as military leaders; Deborah alone is shown in a juridical context (4:5), and is also a military leader'
    key: shannon-models-motherhood
    url: 'https://rsc.byu.edu/covenant-compassion/models-motherhood'
    quote: '“The book of Judges consistently depicts the judges as military leaders, i.e. deliverers.” In fact, the only judge described in Judges as functioning in a juridical context is Deborah (see Judges 4:5).'
  - where: 'note 4:9 “The honour goes to a woman”'
    claim: 'Barak was fearful and reluctant; Deborah said his reluctance was unnecessary'
    key: litchman-deborah
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/01/deborah-and-the-book-of-judges?lang=eng'
    quote: 'Barak, fearful and reluctant, agreed to gather an army and attack the Canaanites only if Deborah would accompany him on the mission. But according to Deborah, Barak’s reluctance was unnecessary'
  - where: 'note 4:9 “The honour goes to a woman”'
    claim: 'Barak’s refusal to go without Deborah highlights her role in the victory'
    key: shannon-models-motherhood
    url: 'https://rsc.byu.edu/covenant-compassion/models-motherhood'
    quote: 'Barak will not go to battle without Deborah, highlighting the importance of her role in the military victory of the Israelites, as we would expect from her role as a judge.'
  - where: 'note 4:9 “The honour goes to a woman”'
    claim: 'Because of his hesitation the honour went to Deborah and Jael; the text credits Jael with the kill'
    key: ot-minute-judg-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-4'
    quote: 'However, because of his initial hesitation, Deborah prophesied that the ultimate honor of victory would be credited not to him but to Deborah and Jael'
  - where: 'note 4:9 “The honour goes to a woman”'
    claim: 'Barak is named in Hebrews 11:32 (the Church’s footnote at 6a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/4?lang=eng'
    quote: 'Heb. 11:32.'
  - where: 'note 4:11 “Why Heber the Kenite is named here”'
    claim: 'Kenites probably a Midianite tribe; Moses’ marriage made a long friendship between Kenites and Israel'
    key: bd-kenites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kenites?lang=eng'
    quote: 'Probably a Midianite tribe, descended from Abraham by his wife Keturah. Moses’ marriage with the daughter of Jethro, a prince and priest of Midian, was also a cause of the long-standing friendship between the Kenites and Israelites'
  - where: 'note 4:11 “Why Heber the Kenite is named here”'
    claim: 'Jael’s tribe had a peace agreement with the Canaanites'
    key: litchman-deborah
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/01/deborah-and-the-book-of-judges?lang=eng'
    quote: 'Deserting his army, Sisera fled north and sought refuge in the tent of Jael, a woman of the nomadic Kenite tribe, which had a peace agreement with the Canaanites.'
  - where: 'note 4:14 “The LORD gone out before”'
    claim: '“Discomfited” is panicked, put to flight (the Church’s footnote 15a)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/4?lang=eng'
    quote: 'OR panicked, put to flight.'
  - where: christ
    claim: 'The Church’s footnote to “before” in verse 14 points to D&C 84:88'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/4?lang=eng'
    quote: 'Deut. 9:3; Ether 1:42 (42–43); D&C 84:88 (87–88).'
  - where: 'note 4:14 “The LORD gone out before”'
    claim: 'Litchman reads the LORD’s going out as a storm that flooded the Kishon'
    key: litchman-deborah
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/01/deborah-and-the-book-of-judges?lang=eng'
    quote: 'And the Lord went out before the Israelites with a terrible storm. Torrents of rain flooded down the mountainside, filling the Wadi Kishon and spilling over the plain'
  - where: 'note 4:19 “Milk and a blanket”'
    claim: '“Mantle” is a rug, thick coverlet or blanket'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/4?lang=eng'
    quote: 'HEB rug, thick coverlet, or blanket.'
  - where: 'note 4:19 “Milk and a blanket”'
    claim: 'Smoot: she treated him like a mother treats a child, the details rich with irony'
    key: ot-minute-judg-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-4'
    quote: 'The details of her treatment of Sisera are rich with irony. For example, she treated him like a mother would treat a child, giving him milk and a blanket and putting him to sleep (verses 18–21)—all the while preparing him for a grisly demise'
  - where: 'note 4:21 “Was Jael right?”'
    claim: 'The song blesses Jael (5:24)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/5?lang=eng'
    quote: 'Blessed above women shall Jael the wife of Heber the Kenite be, blessed shall she be above women in the tent.'
  - where: 'note 4:21 “Was Jael right?”'
    claim: 'The prose has Sisera asleep, the song implies he was drinking'
    key: bd-jael
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jael?lang=eng'
    quote: 'was killed by her either while he was drinking, as seems implied by Judg. 5:24–27, or while he lay asleep, according to the prose account in Judg. 4.'
  - where: 'note 4:21 “Was Jael right?”'
    claim: 'Litchman tells the deed as the fulfilment of Deborah’s prophecy'
    key: litchman-deborah
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/01/deborah-and-the-book-of-judges?lang=eng'
    quote: 'She turned the body over to Barak, having fulfilled Deborah’s prophecy that Sisera would be sold into the hands of a woman.'
  - where: 'note 4:21 “Was Jael right?”'
    claim: 'One older reading: God ordered that Sisera die in her tent, but the deed is not acquitted of lying, treachery and assassination; the song does not laud it as a divine act'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/4.htm'
    quote: 'her heroic deed cannot be acquitted of the sins of lying, treachery, and assassination … God had no doubt so ordered it, that Sisera should meet with his death in Jael''s tent … it is not lauded as a divine act.'
  - where: christ
    claim: 'The stories of the judges show Christ as the Redeemer of Israel, always willing to deliver'
    key: cfm-ot-2026-22
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/22?lang=eng'
    quote: 'These stories remind us that no matter what has led us away from Jesus Christ, He is the Redeemer of Israel and is always willing to deliver us and welcome us back as we return to Him.'
  - where: christ
    claim: 'D&C 84:88: the Lord goes before His servants'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'And whoso receiveth you, there I will be also, for I will go before your face. I will be on your right hand and on your left, and my Spirit shall be in your hearts, and mine angels round about you, to bear you up.'
  - where: explore
    claim: 'Shannon’s study treats Deborah as judge, prophetess and mother in Israel'
    key: shannon-models-motherhood
    url: 'https://rsc.byu.edu/covenant-compassion/models-motherhood'
    quote: 'Deborah: Judge, Prophetess, and “Mother in Israel”'
  - where: section 4 plain
    claim: 'The “nail” is a tent peg'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/4?lang=eng'
    quote: 'HEB tent peg or pin.'
  - where: 'note 4:21 “Was Jael right?”'
    claim: 'The “nail” is a tent peg'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/4?lang=eng'
    quote: 'HEB tent peg or pin.'
  - where: 'note 4:11 “Why Heber the Kenite is named here”'
    claim: 'Heber had severed himself from the Kenites; his house was at peace with Jabin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/4?lang=eng'
    quote: 'for there was peace between Jabin the king of Hazor and the house of Heber the Kenite.'
