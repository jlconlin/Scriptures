chapter: 13
claims:
  - where: setting
    claim: 'The Philistines held the coastal lowland, a league of five cities each under its lord'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'the rich lowland on the Mediterranean coast from Joppa to the Egyptian desert. They formed a confederation of five chief cities, namely, Ashdod, Gaza, Ashkelon, Gath, and Ekron, each governed by its “lord.”'
  - where: setting
    claim: 'The struggle lasted long; Philistine power peaked at Saul’s death and declined under David'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'For many years there was a struggle for supremacy between them and the Israelites, Philistine power being at its height at the time of Saul’s death but rapidly declining during the reign of David.'
  - where: setting
    claim: 'Zorah was first assigned to Judah, later inhabited by Dan, which could not take its own land'
    key: ot-manual-judges-13-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-13-21-ruth-1-4-the-reign-of-the-judges-part-2?lang=eng'
    quote: 'Zorah, the home of Samson, had been assigned originally to the tribe of Judah (see Joshua 15:33), but was later inhabited by the tribe of Dan, which had been unable to take over the land assigned to it as its inheritance.'
  - where: setting
    claim: 'Samson is the twelfth judge; his name means “of the sun”'
    key: bd-samson
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/samson?lang=eng'
    quote: 'Of the sun. Son of Manoah, and the twelfth of the “judges” of Israel (Judg. 13:24–16:30).'
  - where: setting
    claim: 'Samson’s is the only judge’s story that begins with his birth'
    key: ot-minute-judg-13
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-13'
    quote: 'The narrative of Samson’s tenure as Israel’s judge begins, uniquely, with an account of his birth, told in chapter 13 after the customary formula introducing a new narrative cycle (verse 1).'
  - where: thread
    claim: 'Manoah and his wife take the visitor for a man and only at the end understand they were in the presence of deity'
    key: ot-minute-judg-13
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-13'
    quote: 'Note how Manoah and his wife both mistook the divine personage for an ordinary man, going so far as wanting to prepare food for him … the couple’s eventual understanding that they were in the presence of deity'
  - where: section 4 plain
    claim: 'The “meat offering” was a grain offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/13?lang=eng'
    quote: 'HEB gift, or offering; actually this part was made of meal (also v. 23).'
  - where: section 4 plain
    claim: 'The word rendered “secret” means wonderful, beyond comprehension'
    key: bdb
    url: 'https://biblehub.com/hebrew/6383.htm'
    quote: 'adjective wonderful, incomprehensible; — masculine פלאי (i.e. מִּלְאִי) Kt, Judges 13:18 (name of ׳מַלְאַךְ י'
  - where: section 5 plain
    claim: 'The Spirit began to impel (stir) him'
    key: bdb
    url: 'https://biblehub.com/hebrew/6470.htm'
    quote: 'Qal Infinitive construct suffix לְפַעֲמוֺ Judges 13:25 the spirit of ׳י began to impel him.'

  - where: 'note 13:3 “A birth announced to a barren woman”'
    claim: 'Judges 13 is a type scene, an annunciation scene in which a divine messenger announces a destined child'
    key: ot-minute-judg-13
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-13'
    quote: 'The narrative of Samson’s birth is sometimes classified as an annunciation scene, in which a divine messenger announces the miraculous birth of a destined child.'
  - where: 'note 13:3 “A birth announced to a barren woman”'
    claim: 'Samuel’s birth and life parallel Samson’s'
    key: ot-minute-judg-13
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-13'
    quote: 'The details of Samson’s birth and career as a Nazarite parallel those of Samuel’s birth and life given later in the Bible (see 1 Samuel 1:9–22), suggesting that the two men belong generally to the same annunciation type scene.'
  - where: 'note 13:3 “A birth announced to a barren woman”'
    claim: 'The matriarchs and others were barren; God’s promises kept; Luke begins with another barren couple'
    key: sc-knowhy-705
    url: 'https://scripturecentral.org/knowhy/why-are-childless-women-prominent-in-the-christmas-story'
    quote: 'Although each of them was barren (Genesis 11:29–30; 18:11; 25:20–21; 29:28, 31; Judges 13:2; 1 Samuel 1:1–2; 2 Kings 4:14), God’s promises and covenants would be kept through divine and joyous means.'
  - where: 'note 13:3 “A birth announced to a barren woman”'
    claim: 'The births were signs that God fulfills His promises in time as well as eternity'
    key: sc-knowhy-705
    url: 'https://scripturecentral.org/knowhy/why-are-childless-women-prominent-in-the-christmas-story'
    quote: 'The miraculous pregnancies of these women were signs to all Israel and all the world that God can indeed fulfill his promises in time, as well as eternity.'
  - where: 'note 13:3 “A birth announced to a barren woman”'
    claim: 'Hannah’s vow and the razor (scripture read)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/1?lang=eng'
    quote: 'then I will give him unto the Lord all the days of his life, and there shall no razor come upon his head.'

  - where: 'note 13:5 “A Nazarite from the womb”'
    claim: 'Scripture Helps beside 13:2–5 explains the vow, temporary or lifelong, and that a parent could dedicate a child'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'The Nazarite vow could be temporary or a lifetime commitment. … A parent could choose to dedicate a child to God as a Nazarite, and the child could then decide to continue the vow as they became an adult.'
  - where: 'note 13:5 “A Nazarite from the womb”'
    claim: 'Numbers 6 speaks of Nazarites for a set time; Samson, Samuel and John the Baptist were Nazarites for life'
    key: pulpit-judges
    url: 'https://biblehub.com/commentaries/pulpit/judges/13.htm'
    quote: 'The law of the Nazarites is contained in Numbers 6, where, however, only Nazarites of days, i.e. Nazarites for a definite time, arc spoken cf. Samson, Samuel, and John the Baptist were perpetual Nazarites'
  - where: 'note 13:5 “A Nazarite from the womb”'
    claim: 'Luke 1:15 on John (scripture read)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'For he shall be great in the sight of the Lord, and shall drink neither wine nor strong drink'

  - where: 'note 13:5 “Only a beginning”'
    claim: 'Samson did not deliver Israel as the other judges did, but began to shake Philistine power and prepared the way for Samuel'
    key: pulpit-judges
    url: 'https://biblehub.com/commentaries/pulpit/judges/13.htm'
    quote: 'He shall begin, etc. This is an exact description of what Samson did. He did not "deliver Israel" as the other judges did; but he began to shake the Philistine power, and prepared the way for the deliverance of Israel in the time of his worthier successor Samuel.'
  - where: 'note 13:5 “Only a beginning”'
    claim: 'The end of the forty years is not in Judges; it came with Samuel’s victory'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/13.htm'
    quote: 'The end of the forty years of the supremacy of the Philistines is not given in this book, which closes with the death of Samson. It did not terminate till the great victory which the Israelites gained over their enemies under the command of Samuel (1 Samuel 7).'
  - where: 'note 13:5 “Only a beginning”'
    claim: 'Philistine power at its height at Saul’s death, declining under David'
    key: bd-philistines
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/philistines?lang=eng'
    quote: 'Philistine power being at its height at the time of Saul’s death but rapidly declining during the reign of David.'

  - where: 'note 13:18 “A name that is wonderful”'
    claim: 'pilʾî is an adjective, wonderful, incomprehensible, used of the angel’s name and of God’s knowledge in Ps. 139:6'
    key: bdb
    url: 'https://biblehub.com/hebrew/6383.htm'
    quote: '[מִּלְאִי] adjective wonderful, incomprehensible; — masculine פלאי (i.e. מִּלְאִי) Kt, Judges 13:18 (name of ׳מַלְאַךְ י; > Qr מֶּ֫לִי(אׅ); feminine פלאיה דַעַת מִמֶּנִּי (i.e. מִּלְאִיָה) Psalm 139:6 God''s knowledge'
  - where: 'note 13:18 “A name that is wonderful”'
    claim: 'The word expresses the character of the name, a predicate belonging to God alone; compare Isa. 9:6'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/13.htm'
    quote: 'The word therefore is not the proper name of the angel of the Lord, but expresses the character of his name … as a predicate belonging to God alone (compare the term "Wonderful" in Isaiah 9:6)'
  - where: 'note 13:18 “A name that is wonderful”'
    claim: 'peleʾ in Isa. 9:6 (9:5 Heb.): wonderful counsellor, of the Messianic king'
    key: bdb
    url: 'https://biblehub.com/hebrew/6382.htm'
    quote: 'מֶּלֶא יוֺעֵץ Isaiah 9:5 marvel of a counsellor (Baer מֵּלֶא), wonderful counsellor (of Messianic king)'
  - where: 'note 13:18 “A name that is wonderful”'
    claim: 'One of the visitors was God Himself; v. 22 shows it'
    key: ot-minute-judg-13
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-13'
    quote: 'first, the unmistakable anthropomorphic nature of the divine beings visiting Samson’s parents, and second, that one of these beings was God Himself.'
  - where: 'note 13:18 “A name that is wonderful”'
    claim: 'Clarke: “it is Wonderful,” the character given to Christ in Isa. 9:6; some suppose the angel was the Lord'
    key: clarke-judges
    url: 'https://biblehub.com/commentaries/clarke/judges/13.htm'
    quote: 'The angel does not say that it was secret, but הוא פלאי hu peli it is Wonderful; the very character that is given to Jesus Christ, Isaiah 9:6 … and it is supposed by some that the angel gives this as his name, and consequently that he was our blessed Lord.'
  - where: 'note 13:18 “A name that is wonderful”'
    claim: 'The Student Manual prints Clarke and doubts the angel was the Lord Himself'
    key: ot-manual-judges-13-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-13-21-ruth-1-4-the-reign-of-the-judges-part-2?lang=eng'
    quote: 'It is doubtful that the angel was the Lord Himself, but rather was one who spoke in the name of the Lord by divine authority, as in Revelation 22:1–9.'
  - where: 'note 13:18 “A name that is wonderful”'
    claim: 'The Church’s footnote sends “secret” to Gen. 32:29'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/13?lang=eng'
    quote: '18a “secret”: Gen. 32:29.'

  - where: 'note 13:19 “A meal that became an offering”'
    claim: 'Manoah offered on the rock, called an altar because the angel sanctified it; the flame from the rock as with Gideon; the angel ascended; they fell in worship'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/13.htm'
    quote: 'offered it upon the rock, which is called an altar in Judges 13:20, because the angel of the Lord, who is of one nature with God, had sanctified it as an altar through the miraculous acceptance of the sacrifice.'
  - where: 'note 13:19 “A meal that became an offering”'
    claim: 'The flame came from the rock as in Gideon’s sacrifice; they fell in worship, knowing from the miracle who he was'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/13.htm'
    quote: 'a flame issued from the rock, as in the case of Gideon''s sacrifice (Judges 6:21), and consumed the sacrifice. And the angel of the Lord ascended in this flame. When Manoah and his wife saw this, they fell upon their faces to the earth (sc., in worship)'
  - where: 'note 13:19 “A meal that became an offering”'
    claim: '“Did wondrously” is the participle maphliʾ, of God working wonders'
    key: bdb
    url: 'https://biblehub.com/hebrew/6381.htm'
    quote: '3 of God, מַפְלִא לעשׂות Judges 13:19 working wonders in doing.'
  - where: 'note 13:19 “A meal that became an offering”'
    claim: 'The verb of v. 19 and the adjective of v. 18 (Kethib פלאי) come from the same root פלא'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/13.htm'
    quote: 'The Kethibh פלאי is the adjectival form פּלאי from פּלא'
  - where: 'note 13:19 “A meal that became an offering”'
    claim: 'Clarke: the angel acted according to his name'
    key: clarke-judges
    url: 'https://biblehub.com/commentaries/clarke/judges/13.htm'
    quote: 'The angel did wondrously - He acted according to his name; he, being wonderful, performed wonderful things; probably causing fire to arise out of the rock and consume the sacrifice, and then ascending in the flame.'
  - where: 'note 13:23 “The wife answers Manoah’s fear”'
    claim: 'Manoah’s exclamation shows they understood they had been in the presence of deity'
    key: ot-minute-judg-13
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-13'
    quote: 'The exclamation given by Manoah in verse 22 also indicates the couple’s eventual understanding that they were in the presence of deity: “We shall surely die, because we have seen God.”'

  - where: 'note 13:25 “The Spirit began to stir him”'
    claim: 'paʿam: the spirit of the LORD began to impel him'
    key: bdb
    url: 'https://biblehub.com/hebrew/6470.htm'
    quote: 'Qal Infinitive construct suffix לְפַעֲמוֺ Judges 13:25 the spirit of ׳י began to impel him.'
  - where: 'note 13:25 “The Spirit began to stir him”'
    claim: 'BDB glosses paʿam as thrust, impel'
    key: bdb
    url: 'https://biblehub.com/hebrew/6470.htm'
    quote: 'verb thrust, impel (probably originally strike, hit, see derivatives, and Phoenician'

  - where: christ
    claim: 'Luke begins Christ’s birth with a barren couple; Mary’s child the sign that deliverance from all sins has been given'
    key: sc-knowhy-705
    url: 'https://scripturecentral.org/knowhy/why-are-childless-women-prominent-in-the-christmas-story'
    quote: 'Her Holy Child comes into the world in such a way as to be the sign (see Isaiah 7:14) that deliverance from all of sins, all of our lowly fallen states, has been given'
  - where: christ
    claim: 'The visitor was God Himself'
    key: ot-minute-judg-13
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-13'
    quote: 'that one of these beings was God Himself.'
  - where: christ
    claim: 'Samson was blessed (13:24) and later turned to misconduct; Manoah’s plea to be taught what to do for the child is the positive use of a God-given gift; preserving God-given gifts is a lesson'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Samson, whom the Lord initially blessed (13:24) but who eventually turned to all sorts of misconduct. Alternatively, and positively, such gifts could be used for great benefit and the betterment of self and others, such as when Manoah entreated the Lord'
  - where: christ
    claim: 'Preserving and developing God-given gifts, rather than misusing them, is a lesson of the imperfect judges'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Perhaps such a preservation, development, and protection of God-given gifts—rather than abusing, misusing, or failing to develop them—can be a major lesson we take from the portrayal of imperfect judges in this book.'
