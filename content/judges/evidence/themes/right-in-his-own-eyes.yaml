page: right-in-his-own-eyes
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'Connection made by this page: Judges measures Israel by the eyes of the LORD for twelve chapters (2:11 … 13:1), then by men’s own eyes (14:3; 17:6; 21:25), and the refrain is Moses’ description of a people not yet come to the rest (Deut. 12:8–9); read so, the book is the record of a people living as though they had not arrived in the land where Joshua says the LORD gave them rest (Josh. 21:44), and it leaves the reader looking to the Judge whose eyes are the measure (11:27) and to the rest Hebrews says remains (Heb. 4:9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/21?lang=eng'
    quote: 'In those days there was no king in Israel: every man did that which was right in his own eyes.'

  # ---------- In the eyes of the LORD ----------
  - where: 'section “In the eyes of the LORD”'
    claim: '“In the sight of the LORD” at 2:11 is bĕʿênê, “in the eyes of” (H5869)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'בְּ/עֵינֵ֣י'
  - where: 'section “In the eyes of the LORD”'
    claim: '“Evil” in the formula is hāraʿ, “the evil,” with the article (2:11)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'הָ/רַ֖ע'
  - where: 'section “In the eyes of the LORD”'
    claim: 'The formula’s last use, 13:1, has “again” (wayyōsipû, “they added”) and the same “in the eyes of”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'וַ/יֹּסִ֨פוּ֙'
  - where: 'section “In the eyes of the LORD”'
    claim: 'Goff sets the refrain beside Deut. 6:16–18 and Exod. 15:26 (“right in his sight”) as the covenant standard of the land'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'This figure of speech about doing what is right in the eyes of the Lord or wrong through their own vision hearkens back to the covenants Israel made when they entered the promised land.'
  - where: 'section “In the eyes of the LORD”'
    claim: '“The land had rest” (3:11) is a formula of the book’s editor, used also at 3:30, 5:31, 8:28 and in Joshua 11:23 and 14:15'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/3.htm'
    quote: 'A formula of the editor, to whom the chronological scheme of the Book is due; cf. Jdg 3:30, Jdg 5:31, Jdg 8:28; and Joshua 11:23; Joshua 14:15.'
  - where: 'section “In the eyes of the LORD”'
    claim: '“Had rest” at 3:11 is wattišqōṭ, the verb šāqaṭ (H8252), to be quiet'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'וַ/תִּשְׁקֹ֥ט'

  # ---------- Right in my eyes ----------
  - where: 'section “Right in my eyes”'
    claim: '“She pleaseth me well” (14:3) is yāšrâ, the verb yāšar (H3474), “to be straight, right,” feminine perfect'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'יָשְׁרָ֥ה'
  - where: 'section “Right in my eyes”'
    claim: 'The phrase that follows at 14:3 is bĕʿênāy, “in my eyes” (H5869)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'בְ/עֵינָֽ/י'
  - where: 'section “Right in my eyes”'
    claim: '“She pleased Samson well” (14:7) is wattîšar, the same verb yāšar, with “in the eyes of Samson”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'וַ/תִּישַׁ֖ר'
  - where: 'section “Right in my eyes”'
    claim: 'Goff, quoting Lasine: Judges shifts from doing what is evil in Yahweh’s eyes (2:11; 3:7, 12; 4:1; 6:1; 10:6; 13:1) to doing what is right in one’s own eyes (14:3; 17:6; 21:25)'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'in the book of Judges there is a shift in emphasis from doing what is evil in Yahweh’s eyes (2:11; 3:7, 12; 4:1; 6:1; 10:6; 13:1) to doing what is right in one’s own eyes (14:3; 17:6; 21:25).'
  - where: 'section “Right in my eyes”'
    claim: 'Goff attributes the sentence to Lasine, “Guest and Host in Judges 19”'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'Lasine, “Guest and Host in Judges 19,” 55n19.'
  - where: 'section “Right in my eyes”'
    claim: 'Scripture Helps: Samson’s focus frequently drifted toward fulfilling immoral and selfish desires'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'Samson’s focus frequently drifted toward fulfilling immoral and selfish desires.'
  - where: 'section “Right in my eyes”'
    claim: 'Scripture Helps: Samson failed to fulfill his divine calling because of selfish and unrighteous choices'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'failed to fulfill his divine calling because of selfish and unrighteous choices.'
  - where: 'section “Right in my eyes”'
    claim: '“Put out his eyes” (16:21): ʿênāyw, “his eyes” (H5869), object of nāqar, to bore out'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'וַֽ/יְנַקְּר֖וּ'
  - where: 'section “Right in my eyes”'
    claim: 'Smoot: having his eyes put out was not an uncommon punishment for rebels and war captives; Zedekiah suffered a similar fate'
    key: ot-minute-judg-16
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-16'
    quote: 'His sad outcome (having his eyes put out and being cast into exile or prison) was not an uncommon punishment for rebels and war captives in the ancient world. The Judahite king Zedekiah would suffer a similar fate'
  - where: 'section “Right in my eyes”'
    claim: 'Connection made by this page: Samson’s story is told between two sentences about his eyes, “she is right in my eyes” (14:3, 7) and “my two eyes” (16:21, 28); the man who made his eyes the measure ends with none, and the book lets the reader watch what his eyes came to, without calling the blinding a judgment on 14:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/16?lang=eng'
    quote: 'that I may be at once avenged of the Philistines for my two eyes.'

  # ---------- Every man in his own eyes ----------
  - where: 'section “Every man in his own eyes”'
    claim: '“Right” in 17:6 is hayyāšār (H3477), the adjective of the root of 14:3'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'הַ/יָּשָׁ֥ר'
  - where: 'section “Every man in his own eyes”'
    claim: '“In his own eyes” in 17:6 is bĕʿênāyw, “in his eyes,” the suffix only; the King James supplies “own”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'בְּ/עֵינָ֖י/ו'
  - where: 'section “Every man in his own eyes”'
    claim: 'The Church’s footnote at 17:6 “right” points to Deut. 12:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/17?lang=eng'
    quote: 'Deut. 12:8'
  - where: 'section “Every man in his own eyes”'
    claim: 'The Church’s footnote at 17:6 “own eyes” points to Prov. 16:2'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/17?lang=eng'
    quote: 'Prov. 16:2'
  - where: 'section “Every man in his own eyes”'
    claim: 'Keil on Deut. 12:8: “whatsoever is right in his own eyes” is applied to actions by a man’s own judgment rather than the standard of objective right and the law of God, with Judges 17:6 and 21:25'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/12.htm'
    quote: 'The phrase, "whatsoever is right in his own eyes," is applied to actions performed according to a man''s own judgment, rather than according to the standard of objective right and the law of God (cf. Judges 17:6; Judges 21:25).'
  - where: 'section “Every man in his own eyes”'
    claim: 'Keil on 17:6: the remark is made in explanation of Micah’s unlawful conduct'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/17.htm'
    quote: 'In Judges 17:6 it is observed, in explanation of this unlawful conduct, that at that time there was no king in Israel, and every one did what was right in his own eyes.'
  - where: 'section “Every man in his own eyes”'
    claim: 'The Student Manual: nothing in the stories of 17–21 shows the Israelites doing what was right'
    key: ot-manual-judges-13-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-13-21-ruth-1-4-the-reign-of-the-judges-part-2?lang=eng'
    quote: 'Nothing in the stories show the Israelites doing what was right.'
  - where: 'section “Every man in his own eyes”'
    claim: 'Schade: the refrain links theologically back to “evil in the eyes of the Lord” (2:11 … 13:1); when Israel rebelled against the Lord as covenantal king, everyone did what was right in their own eyes'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'The statement that “each man did what was right in his own eyes” links theologically back to “the Israelites did evil in the eyes of the Lord” (lit. translation of 2:11; 3:7; 3:12; 4:1; 6:1; 10:6; 13:1). When the Israelites rebelled against the Lord as their covenantal king, they had no king as envisioned by the covenant, so everyone did what was right in their own eyes.'
  - where: 'section “Every man in his own eyes”'
    claim: 'Schade credits the link to Younger (note 56)'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Younger, “Book of Judges,” 58–59.'
  - where: 'section “Every man in his own eyes”'
    claim: 'Scripture Helps: the two final episodes highlight Israel’s lack of unity and may be implying the need for a king'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'Two final episodes recorded in Judges 17–21 highlight Israel’s lack of unity in this era and may be implying the need for a king.'
  - where: 'section “Every man in his own eyes”'
    claim: 'Bible Dictionary: the lack of unity is vividly called to the reader’s attention in the closing sentence'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: 'The lack of unity is vividly called to the reader’s attention in the closing sentence of the book (Judg. 21:25)'
  - where: 'section “Every man in his own eyes”'
    claim: '“What seemeth good unto you” (19:24) is haṭṭôb bĕʿênêkem, “the good in your eyes,” not the refrain’s yāšār'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'בְּ/עֵינֵי/כֶ֑ם'
  - where: 'section “Every man in his own eyes”'
    claim: '“Good” at 19:24 is haṭṭôb (H2896)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'הַ/טּ֖וֹב'
  - where: 'section “Every man in his own eyes”'
    claim: 'Goff, with Lasine: both hosts (Lot and the old man of Gibeah) invite the mob to “do what is good in your eyes”'
    key: goff-plagiary
    url: 'https://interpreterfoundation.org/journal/the-plagiary-of-the-daughters-of-the-lamanites'
    quote: 'when the Sodomites attempt to assault the visitors and the men of Gibeah attempt to attack the guests, both hosts offer the women and invite the mob outside to “do what is good in your eyes.”'
  - where: 'section “Every man in his own eyes”'
    claim: '“Whatsoever seemeth good unto thee” (10:15), Israel to the LORD, is haṭṭôb bĕʿênêkā, “the good in thine eyes,” the phrase of 19:24'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'בְּ/עֵינֶ֑י/ךָ'
  - where: 'section “Every man in his own eyes”'
    claim: 'Connection made by this page: the phrase “the good in your eyes” is spoken twice in Judges, by Israel to the LORD at 10:15 and by the host to the mob at 19:24; the sentence is the same and the eyes it defers to have changed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/10?lang=eng'
    quote: 'We have sinned: do thou unto us whatsoever seemeth good unto thee; deliver us only, we pray thee, this day.'

  # ---------- Not yet come to the rest ----------
  - where: 'section “Not yet come to the rest”'
    claim: 'Deut. 12:8 has hayyāšār bĕʿênāyw, the words of Judg. 17:6 and 21:25'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'הַ/יָּשָׁ֥ר'
  - where: 'section “Not yet come to the rest”'
    claim: 'Deut. 12:8 “in his own eyes” is bĕʿênāyw'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'בְּ/עֵינָֽי/ו'
  - where: 'section “Not yet come to the rest”'
    claim: 'The Church’s footnote at Deut. 12:8 “right” points to Judg. 17:6; 21:25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/12?lang=eng'
    quote: 'Judg. 17:6; 21:25'
  - where: 'section “Not yet come to the rest”'
    claim: 'Keil on Deut. 12:8–9: up to that day every one had done what he thought right, because they had not yet come to the rest and the inheritance'
    key: keil-deuteronomy
    url: 'https://biblehub.com/commentaries/kad/deuteronomy/12.htm'
    quote: 'up to this day every one had done what he thought right, because they had not yet come to the rest and to the inheritance which the Lord was about to give them.'
  - where: 'section “Not yet come to the rest”'
    claim: '“He giveth you rest” (Deut. 12:10) is wĕhēnîaḥ, the verb nûaḥ (H5117)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'וְ/הֵנִ֨יחַ'
  - where: 'section “Not yet come to the rest”'
    claim: '“The LORD gave them rest” (Josh. 21:44) is wayyānaḥ, the same verb nûaḥ (H5117)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'וַ/יָּ֨נַח'
  - where: 'section “Not yet come to the rest”'
    claim: 'Judges’ rest verb šāqaṭ is Joshua’s “the land had rest from war” (Josh. 11:23; 14:15), listed with the Judges uses by the Cambridge commentary'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/3.htm'
    quote: 'cf. Jdg 3:30, Jdg 5:31, Jdg 8:28; and Joshua 11:23; Joshua 14:15.'
  - where: 'section “Not yet come to the rest”'
    claim: '“Quiet” at 18:7 is šōqēṭ, the participle of šāqaṭ (H8252), the verb of 3:11, 3:30, 5:31, 8:28'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'שֹׁקֵ֣ט'
  - where: 'section “Not yet come to the rest”'
    claim: '“Secure” at 18:7 is ûbōṭēaḥ (H982)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'וּ/בֹטֵ֗חַ'
  - where: 'section “Not yet come to the rest”'
    claim: '“Dwelt careless” at 18:7 is lābeṭaḥ, “in safety” (H983)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'לָ֠/בֶטַח'
  - where: 'section “Not yet come to the rest”'
    claim: '“Ye dwell in safety” (Deut. 12:10) is beṭaḥ (H983), the word of Judg. 18:7'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'בֶּֽטַח'
  - where: 'section “Not yet come to the rest”'
    claim: '“The rest” of Deut. 12:9 is hammĕnûḥâ (H4496)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Deut.xml'
    quote: 'הַ/מְּנוּחָה֙'
  - where: 'section “Not yet come to the rest”'
    claim: 'The noun mĕnûḥâ (H4496) occurs in Judges at 20:43, “with ease”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'מְנוּחָ֖ה'
  - where: 'section “Not yet come to the rest”'
    claim: '“Deliverer” at 18:28 is maṣṣîl, the Hiphil participle of nāṣal (H5337)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'מַצִּ֜יל'
  - where: 'section “Not yet come to the rest”'
    claim: '“Who had delivered them” at 8:34, of the LORD, is hammaṣṣîl, the same participle (H5337)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'הַ/מַּצִּ֥יל'
  - where: 'section “Not yet come to the rest”'
    claim: 'The book’s word for its judges as deliverers is môšîaʿ (H3467), as at 3:9, a different word'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'מוֹשִׁ֛יעַ'
  - where: 'section “Not yet come to the rest”'
    claim: 'Connection made by this page: the last people in Judges to dwell in safety (beṭaḥ) as Deut. 12:10 promised Israel, and to be quiet in the word Judges used for the land’s rests (šāqaṭ), are the Canaanites of Laish (18:7, 27), whom Israel, under “no king in Israel” (18:1), destroys with the sword, with “no deliverer” in the word the book used of the LORD at 8:34; read by Deut. 12:8–10, the end of Judges looks like the wilderness again, and the page takes this to mean Israel was living as though it had not come to the rest Joshua says was given (Josh. 21:44)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/18?lang=eng'
    quote: 'unto a people that were at quiet and secure: and they smote them with the edge of the sword, and burnt the city with fire.'

  # ---------- The LORD the Judge ----------
  - where: 'section “The LORD the Judge”'
    claim: '“The LORD the Judge be judge” (11:27) is yišpōṭ YHWH haššōpēṭ: the verb and the participle (H8199) that is the title of the book’s judges'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'הַ/שֹּׁפֵט֙'
  - where: 'section “The LORD the Judge”'
    claim: 'The Church’s footnote at 11:27 “Judge” points to the Topical Guide “Jesus Christ, Judge”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/11?lang=eng'
    quote: 'TG Jesus Christ, Judge'
  - where: 'section “The LORD the Judge”'
    claim: 'The Topical Guide entry “Jesus Christ, Judge” lists Judg. 11:27'
    key: tg-jesus-christ-judge
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/jesus-christ-judge?lang=eng'
    quote: 'Lord the Judge be judge this day, Judg. 11:27'
  - where: 'section “The LORD the Judge”'
    claim: 'The same entry lists Isa. 11:4'
    key: tg-jesus-christ-judge
    url: 'https://www.churchofjesuschrist.org/study/scriptures/tg/jesus-christ-judge?lang=eng'
    quote: 'shall he judge the poor, Isa. 11:4'
  - where: 'section “The LORD the Judge”'
    claim: 'The Church’s chapter heading for Isaiah 11 names the stem of Jesse as Christ, who will judge in righteousness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/11?lang=eng'
    quote: 'The stem of Jesse (Christ) will judge in righteousness'
  - where: 'section “The LORD the Judge”'
    claim: 'Schade: Judges is a prophetic call to acknowledge the kingship of the Lord, the true King and Judge of Israel'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'In a real sense, the book of Judges is a prophetic call to acknowledge the kingship of the Lord, the true King and Judge of Israel.'
  - where: 'section “The LORD the Judge”'
    claim: 'A Church seminary study guide: Israel did not realize they could have made the Lord their king and that He would have given them peace'
    key: seminary-ot-study-guide-judges-17-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-study-guide-obs/the-book-of-judges/judges-17-21-israel-suffers-for-disobedience?lang=eng'
    quote: 'Israel didn’t realize they could have made the Lord their king and that He would have given them peace and provided a way to solve the problems facing them.'
  - where: 'section “The LORD the Judge”'
    claim: 'Connection made by this page: the measure Judges loses, an eye outside the man deciding what is right, is the LORD the Judge of 11:27, whom the Topical Guide lists with Isa. 11:4; Samson judged after the sight of his eyes literally, the refrain gives every man his own judgment as the measure, and Isaiah describes the Judge’s judging as not after the sight of His eyes; the Savior said His judgment is just because He seeks not His own will (John 5:30)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/isa/11?lang=eng'
    quote: 'he shall not judge after the sight of his eyes, neither reprove after the hearing of his ears'

  # ---------- Whose eyes decide ----------
