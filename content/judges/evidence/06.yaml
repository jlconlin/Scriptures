chapter: 6
claims:
  - where: setting
    claim: 'The Midianites were a confederation of wandering tribes, in conflict with Israel, named in Numbers and in Isaiah 9:4 and Psalm 83'
    key: bd-midianites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/midianites?lang=eng'
    quote: 'A powerful confederation of wandering Arab tribes, akin to the Hebrews, but often in conflict with them. They are referred to in Gen. 37:28, 36; Ex. 2:15; 3:1; 4:19; 18:1; Num. 22:4, 7; 25; 31; Judg. 6–8; Ps. 83:9, 11; Isa. 9:4; 10:26.'
  - where: setting
    claim: 'Seasonal raids at harvest; Gideon''s story is one of the lengthier in Judges, spanning 6–8; Midian an old foe from the wilderness'
    key: ot-minute-judg-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-6'
    quote: 'This cycle involves Gideon, who, along with Sampson (Judges 14–16), enjoys one of the lengthier narrative treatments in the book of Judges (spanning Judges 6–8).'
  - where: setting
    claim: 'Gideon lived at Ophrah in Manasseh; he declined the kingship and made an ephod; later scripture (Isa. 9:4; Heb. 11:32) remembers him'
    key: bd-gideon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gideon?lang=eng'
    quote: 'He lived at Ophrah, a town of Manasseh. … The tribes then offered him the kingship, which he declined. With the gold captured from the Midianites he made some sort of idol, called an Ephod, and so, perhaps unintentionally, led the people into idolatry. See also Isa. 9:4; 10:25; Heb. 11:32.'
  - where: setting
    claim: 'The Church footnote to verse 32 points to 1 Samuel 12:11, where the name Jerubbaal recurs'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/6?lang=eng'
    quote: '“Jerubbaal”: 1 Sam. 12:11.'

  - where: thread
    claim: 'The prophet''s reproof was meant to turn Israel back to the Lord; the call came in two revelations: the Lord acknowledged Gideon, then summoned Gideon to acknowledge Him'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/6.htm'
    quote: 'As the reproof of the prophet was intended to turn the hearts of the people once more to the Lord their God and deliverer … In the first revelation the Lord acknowledged Gideon; in the second He summoned Gideon to acknowledge Him as his God.'
  - where: thread
    claim: 'Gideon''s call parallels Moses'' commission'
    key: ot-minute-judg-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-6'
    quote: 'Gideon’s call parallels Moses’ prophetic commission in Exodus 3–4 in a number of remarkable ways.'

  - where: 'note 6:5 “Who the Midianites were”'
    claim: 'A confederation of wandering tribes, akin to the Hebrews but often in conflict with them'
    key: bd-midianites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/midianites?lang=eng'
    quote: 'A powerful confederation of wandering Arab tribes, akin to the Hebrews, but often in conflict with them.'
  - where: 'note 6:5 “Who the Midianites were”'
    claim: 'An old foe: the Joseph story and the wilderness; seasonal raids on the food supply; the numbers an exaggeration for drama'
    key: ot-minute-judg-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-6'
    quote: 'The Midianites (with their Amalekite confederates) attacked Israel at harvest time in seasonal raids that targeted the land’s food supply (Judges 6:3–5). The author indulged in some poetic license with his exaggerated depiction that “both [the Midianites] and their camels were without number” (v. 5), probably to emphasize Israel’s plight'
  - where: 'note 6:5 “Who the Midianites were”'
    claim: 'They came at harvest from the deserts like locusts and carried away grain and livestock (Tanner, quoted in the manual)'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'During the seasons of harvest they came from the deserts on the south and the east like great swarms of locusts and carried away the corn [grain] and the live-stock upon which the Israelites subsisted.'
  - where: 'note 6:8 “A prophet before a deliverer”'
    claim: 'The Lord''s first act was to send an unnamed prophet to rebuke Israel'
    key: schutze-gideon
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/04/the-sword-of-the-lord-and-of-gideon?lang=eng'
    quote: 'The first thing the Lord did was send a prophet, whose name is unknown, to rebuke Israel for its disobedience (see Judg. 6:7–10).'
  - where: 'note 6:11 “Threshing in a winepress”'
    claim: 'The Hebrew reads “in the winepress”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/6?lang=eng'
    quote: '“by the winepress”: HEB in the winepress.'
  - where: 'note 6:11 “Threshing in a winepress”'
    claim: 'The verb means to knock with a stick; wheat was normally threshed on open floors; poor people beat gleanings with a stick; a winepress was sunk in the ground or hewn in rock; Joash probably owned Ophrah'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/6.htm'
    quote: 'חבט does not mean to thresh, but to knock with a stick. The wheat was threshed upon open floors … Only poor people knocked out the little corn that they had gleaned with a stick (Ruth 2:17), and Gideon did it … in the pressing-tub, which, like all wine-presses, was sunk in the ground'
  - where: 'note 6:11 “Threshing in a winepress”'
    claim: 'Joash was probably head of the family and owner of Ophrah'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/6.htm'
    quote: 'Joash was probably the head of the family at that time, and as such was the lord or owner of Ophrah'
  - where: 'note 6:11 “Threshing in a winepress”'
    claim: 'The greeting contained a promise that Gideon would prove a hero through the Lord''s strength'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/6.htm'
    quote: 'This address contained the promise that the Lord would be with Gideon, and that he would prove himself a mighty hero through the strength of the Lord.'
  - where: 'note 6:11 “Threshing in a winepress”'
    claim: 'Gideon did not think he was a mighty warrior'
    key: schutze-gideon
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/04/the-sword-of-the-lord-and-of-gideon?lang=eng'
    quote: 'Gideon did not think he was a mighty warrior and replied, “Oh my Lord, wherewith shall I save Israel?'

  - where: 'note 6:13 “Where are the miracles?”'
    claim: 'The Church footnote to “miracles” points to Mormon 9:20 (15–20)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/6?lang=eng'
    quote: '“miracles”: Morm. 9:20 (15–20).'
  - where: 'note 6:13 “Where are the miracles?”'
    claim: 'Moroni: miracles cease because people dwindle in unbelief'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/morm/9?lang=eng'
    quote: 'And the reason why he ceaseth to do miracles among the children of men is because that they dwindle in unbelief, and depart from the right way, and know not the God in whom they should trust.'
  - where: 'note 6:13 “Where are the miracles?”'
    claim: 'Gideon at first took the Lord for a man'
    key: ot-minute-judg-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-6'
    quote: 'Gideon also appeared at first to mistake the Lord for another human, since the two carried on an extended conversation without Gideon’s recognizing it was Jehovah until later at verse 22.'
  - where: 'note 6:22 “The angel who is the LORD”'
    claim: 'Gideon took Him for a man; the scene is highly corporeal'
    key: ot-minute-judg-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-6'
    quote: 'Gideon also appeared at first to mistake the Lord for another human, since the two carried on an extended conversation without Gideon’s recognizing it was Jehovah until later at verse 22.[2] The passage is thus highly charged with significant divine corporeality.'
  - where: 'note 6:14 “A call like Moses’”'
    claim: 'The call parallels Moses'': charge, reluctance, reassurance, theophany; Gideon as a Moses-like figure'
    key: ot-minute-judg-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-6'
    quote: 'These includes a divine charge (v. 14) followed by the reluctance on the part of the recipient (v. 15), divine reassurance (v. 16), and finally theophany (v. 22). The intent is clearly to depict Gideon as a divinely ordained Moses-like figure'
  - where: 'note 6:14 “A call like Moses’”'
    claim: 'Judges 6:16 reads kî ʾehyeh ʿimmāk'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'אֶהְיֶ֖ה'
  - where: 'note 6:14 “A call like Moses’”'
    claim: 'Exodus 3:12 reads the same kî ʾehyeh ʿimmāk'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'אֶֽהְיֶ֣ה'
  - where: 'note 6:14 “A call like Moses’”'
    claim: 'Gideon is a reluctant hero like Enoch, Moses or Barak, protesting his weakness'
    key: haws-better-way
    url: 'https://mi.byu.edu/old-testament-reflections/longing-for-a-better-way'
    quote: 'It starts with a reluctant hero. Gideon is like Enoch, or Moses, or even Barak, just two chapters earlier in Judges. Gideon protests his own weakness and incredulity that he has been chosen in the first place'
  - where: 'note 6:14 “A call like Moses’”'
    claim: '“As one man”: the masses conquered as if a lone man'
    key: schutze-gideon
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/04/the-sword-of-the-lord-and-of-gideon?lang=eng'
    quote: 'To smite as one man means that the vast masses of Midianites would be conquered as if they were but a lone man.'
  - where: 'note 6:22 “The angel who is the LORD”'
    claim: 'The angel of the LORD is Jehovah, depicted in humanlike terms; Gideon did not recognize Him until verse 22; Jehovah-shalom means “Jehovah is peace” and indicates the Lord'
    key: ot-minute-judg-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-6'
    quote: 'Gideon’s theophany and commission is also striking in how strongly it depicts God, or the “angel of the LORD” (i.e., Jehovah),[1] in humanlike terms.'
  - where: 'note 6:22 “The angel who is the LORD”'
    claim: 'The altar''s name “Jehovah is peace” indicates the interlocutor was the Lord'
    key: ot-minute-judg-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-6'
    quote: 'Gideon’s altar, identified in v. 24 with the name Jehovahshalom (“Jehovah is peace”), further indicates the warrior’s interlocutor was none other than the Lord himself.'
  - where: 'note 6:22 “The angel who is the LORD”'
    claim: 'Gideon understood only at verse 22 whom he had spoken with'
    key: ot-minute-judg-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-6'
    quote: 'It is not until verse 22 after the conversation is over that Gideon realizes he was speaking with Jehovah, finally pronouncing the divine name.'
  - where: 'note 6:22 “The angel who is the LORD”'
    claim: 'In some passages the angel of the Lord speaks as the voice of God'
    key: bd-angels
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/angels?lang=eng'
    quote: 'In some passages the “angel of the Lord” speaks as the voice of God Himself (Gen. 22:11–12).'
  - where: 'note 6:25 “Beginning at his father’s altar”'
    claim: 'Gideon''s judgeship begins on a familial level by cutting down his father''s altar and Asherah pole'
    key: ot-minute-judg-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-6'
    quote: 'The first thing Gideon did after his divine commission was to cut down his father’s altar to the Canaanite deity Baal and its accompanying sacred poles (“wood of the grove”) commemorating the female deity Asherah, thus commencing his judgeship on a familial level (vv. 25–32).'
  - where: 'note 6:25 “Beginning at his father’s altar”'
    claim: 'The first task was not to save Israel but to cleanse idolatry from his father''s household'
    key: schutze-gideon
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/04/the-sword-of-the-lord-and-of-gideon?lang=eng'
    quote: 'The first task the Lord gave Gideon was not to save all Israel from the Midianites but to cleanse the sin of idolatry from his father’s household.'
  - where: 'note 6:25 “Beginning at his father’s altar”'
    claim: 'The footnote defines the grove as an asherah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/6?lang=eng'
    quote: '“grove”: HEB asherah—a pole or tree representing a fertility goddess (also vv. 26, 28, 30). Deut. 7:5; 2 Kgs. 18:4.'
  - where: 'note 6:25 “Beginning at his father’s altar”'
    claim: 'One bullock, second in age; its seven years allude to the seven years of oppression; the altar was the family''s; Baal''s altar destroyed before the LORD''s built'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/6.htm'
    quote: 'This bullock is called "the second bullock," as being the second in age among the bullocks of Joash. … because the seven years which constituted the age of the bullock contained an inward allusion to the seven years of the Midianitish oppression.'
  - where: 'note 6:25 “Beginning at his father’s altar”'
    claim: 'The altar served the family of Abiezer; Baal''s altar must be destroyed before the altar of Jehovah'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/6.htm'
    quote: 'which, to judge from Jdg 6:28, Judges 6:29, was the common altar of the whole family of Abiezer in Ophrah. … The altar of Baal must be destroyed before the altar of Jehovah could be built.'

  - where: 'note 6:32 “Two names for one night’s work”'
    claim: 'Jerubbaal can mean “let Baal plead” or “let Baal contend,” Joash''s argument'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'his father, Joash, argued that if Baal were truly a god, he should be capable of defending himself. To emphasize this point, Joash called Gideon “Jerubbaal,” which can mean “let Baal plead” or “let Baal contend.”'
  - where: 'note 6:32 “Two names for one night’s work”'
    claim: 'Gideon''s name from gdʿ, “to cut off”; he is the Hacker; Jerubbaal is a pun on yareb bo habaʿal'
    key: ot-minute-judg-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-6'
    quote: 'this act played off Gideon’s name, which derives from the root gdꜥ, meaning “to cut off, scatter.” Gideon is thus portrayed as the Hacker whose act of tearing down the altar to Baal foreshadows his military career.'
  - where: 'note 6:32 “Two names for one night’s work”'
    claim: 'The pun yerubbaʿal / yareb bo habaʿal'
    key: ot-minute-judg-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-6'
    quote: '“Therefore on that day he called him Jerubbaal [yerubbaꜥal], saying, Let Baal plead against him [yareb bo habaꜥal], because he hath thrown down his altar.”'
  - where: 'note 6:32 “Two names for one night’s work”'
    claim: 'Jerubbaal: he that striveth with Baal'
    key: bd-jerubbaal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jerubbaal?lang=eng'
    quote: 'He that striveth with Baal. The name given to Gideon after his destruction of the altar of Baal (Judg. 6:32; 7:1; 9; 1 Sam. 12:11).'
  - where: 'note 6:32 “Two names for one night’s work”'
    claim: 'Gideon means hewer down'
    key: bd-gideon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gideon?lang=eng'
    quote: 'Hewer down (of men), warrior.'
  - where: 'note 6:32 “Two names for one night’s work”'
    claim: 'The footnote to Jerubbaal points to 1 Samuel 12:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/6?lang=eng'
    quote: '“Jerubbaal”: 1 Sam. 12:11.'
  - where: 'note 6:34 “The Spirit clothed Gideon”'
    claim: 'The Hebrew verb is lāḇĕšâ, rendered “came upon”'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/judges/6-34.htm'
    quote: '3847 [e] lā·ḇə·šāh לָבְשָׁ֖ה came upon V‑Qal‑Perf‑3fs'
  - where: 'note 6:34 “The Spirit clothed Gideon”'
    claim: 'A literal rendering: the Spirit of Jehovah hath clothed Gideon'
    key: biblehub-interlinear
    url: 'https://biblehub.com/interlinear/judges/6-34.htm'
    quote: 'Young''s Literal Translation and the Spirit of Jehovah hath clothed Gideon, and he bloweth with a trumpet'
  - where: 'note 6:34 “The Spirit clothed Gideon”'
    claim: 'As with Othniel, the Spirit ratifies Gideon''s legitimacy as judge'
    key: ot-minute-judg-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-6'
    quote: 'As seen previously at Judges 3:10 with Othniel, Gideon’s legitimacy as judge is ratified at the end of the chapter with the comment that he enjoyed the divine power that comes with having the Spirit of the Lord (Judges 6:34).'

  - where: 'note 6:37 “The fleece, wet and then dry”'
    claim: 'Sincere confirmation versus demanding a sign; Gideon sought a sign in faith'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'There is a difference between sincerely seeking confirmation from God with real intent and demanding a sign from Him without faith. In Gideon’s case, he sought for a sign in faith.'
  - where: 'note 6:37 “The fleece, wet and then dry”'
    claim: 'The first sign was uncertain since wool attracts dew; the request sprang from the weakness of the flesh, not want of faith'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/6.htm'
    quote: 'But as this sign was not quite a certain one, since wool generally attracts the dew, even when other objects remain dry … Gideon''s prayer for a sign did not arise from want of faith in the divine assurance of a victory, but sprang from the weakness of the flesh'
  - where: 'note 6:37 “The fleece, wet and then dry”'
    claim: 'Haws asks whether the signs are cautionary: after the fire and the fleece Gideon still needed the dream; or whether the Lord is generous with reassurance'
    key: haws-better-way
    url: 'https://mi.byu.edu/old-testament-reflections/longing-for-a-better-way'
    quote: 'Is there something cautionary in the way that Gideon asked for so many signs … even after the fleece had been found to be first miraculously dew-covered and then miraculously dry (and all of that was even after fire had consumed the goat kid and the cakes!)?'
  - where: 'note 6:37 “The fleece, wet and then dry”'
    claim: 'The other side: the Lord generous with reassurance'
    key: haws-better-way
    url: 'https://mi.byu.edu/old-testament-reflections/longing-for-a-better-way'
    quote: 'Is the point, when I stop to think about it, that the Lord really is this generous with his reassurances even when we are hesitant and unsure'

  - where: christ
    claim: 'The angel of the LORD is Jehovah'
    key: ot-minute-judg-6
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-6'
    quote: 'or the “angel of the LORD” (i.e., Jehovah)'
  - where: christ
    claim: 'Whatever has led a person away, Christ is the Redeemer of Israel, willing to deliver and welcome back'
    key: cfm-ot-2026-22
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/22?lang=eng'
    quote: 'These stories remind us that no matter what has led us away from Jesus Christ, He is the Redeemer of Israel and is always willing to deliver us and welcome us back as we return to Him.'
  - where: christ
    claim: 'The Lord does not ask that His servants become strong first, then serve; He makes them mighty'
    key: schutze-gideon
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/04/the-sword-of-the-lord-and-of-gideon?lang=eng'
    quote: 'He does not ask that they become strong first, then serve; He does not wait until they become fully trained and skillful. Like Gideon, He often calls them from obscurity and weakness. He tells them to “go in the strength you have” and then make them mighty warriors.'

  - where: explore
    claim: 'Haws''s reflection covers Gideon and Abimelech (chapters 6–9)'
    key: haws-better-way
    url: 'https://mi.byu.edu/old-testament-reflections/longing-for-a-better-way'
    quote: 'That house—that family—was destined for heartache and tragedy. Judges 9 is painful to read.'
