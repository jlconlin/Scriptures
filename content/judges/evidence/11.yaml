chapter: 11
claims:
  - where: when
    claim: 'The chapter begins when Ammon made war against Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/11?lang=eng'
    quote: 'And it came to pass in process of time, that the children of Ammon made war against Israel.'
  - where: when
    claim: 'The Ammonites were settled east of Gilead and in the judges’ time claimed the settlements in Gilead'
    key: bd-ammon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ammon?lang=eng'
    quote: 'they were settled east of Mount Gilead, from the Jabbok southwards, and in the time of the Judges laid claim to the Israelite settlements in Gilead (Judg. 11) but were repulsed by Jephthah'
  - where: setting
    claim: 'In chapter 10 the LORD answers Israel’s cry, “I will deliver you no more”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/10?lang=eng'
    quote: 'Yet ye have forsaken me, and served other gods: wherefore I will deliver you no more.'
  - where: setting
    claim: 'Gilead’s leaders promise headship to whoever will begin the fight'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/10?lang=eng'
    quote: 'What man is he that will begin to fight against the children of Ammon? he shall be head over all the inhabitants of Gilead.'
  - where: setting
    claim: 'The Ammonites descended from Lot, settled east of Gilead, claimed Gilead in the judges’ time and were repulsed by Jephthah'
    key: bd-ammon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ammon?lang=eng'
    quote: 'A tribe descended from Lot, the nephew of Abraham (Gen. 19:38; Deut. 2:19)'
  - where: setting
    claim: 'Jephthah’s history runs through chapters 11–12, and he is chiefly known for his vow'
    key: bd-jephthah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jephthah?lang=eng'
    quote: 'Judge of Israel; for his history see Judg. 11–12. He is chiefly known for his rash vow'
  - where: thread
    claim: 'The words of the chapter: sealed before the LORD, not hearkened to, a mouth opened to the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/11?lang=eng'
    quote: 'for I have opened my mouth unto the Lord, and I cannot go back.'
  - where: 'note 11:1 “An outcast called home”'
    claim: 'With Jephthah God begins to work in spite of the weaknesses of Israel’s leaders (Conway, quoted in Schade)'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'With Jephthah, God begins to work in spite of the weaknesses of Israel’s leaders. Jephthah’s charismatic, if ethically dubious, leadership of a band of “worthless fellows” results in his being chosen by the leaders of Gilead'
  - where: 'note 11:1 “An outcast called home”'
    claim: 'The passage Schade quotes is Conway’s'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: '[67] Conway, Judging the Judges, 207.'
  - where: 'note 11:11 “Captain, then head”'
    claim: 'The Church footnote reads verse 9 as a statement'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/11?lang=eng'
    quote: 'HEB I shall be your head.'
  - where: 'note 11:11 “Captain, then head”'
    claim: 'Gilead’s princes had promised headship to whoever would begin the fight'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/10?lang=eng'
    quote: 'he shall be head over all the inhabitants of Gilead.'
  - where: 'note 11:12 “Words before war”'
    claim: 'Jephthah’s negotiation parallels the peaceful negotiation of the law; Judges has few such accounts (Schade)'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Jephthah did attempt a negotiation with the Ammonites prior to warring with them, exhibiting a parallel to following the peaceful negotiation as God instructed within the law (Judges 11:12–28). In Judges we don’t have many other accounts of such negotiations.'
  - where: 'note 11:12 “Words before war”'
    claim: 'The Ammonites believed the land was theirs; Israel won it when the Amorites attacked and lost'
    key: sc-knowhy-855
    url: 'https://scripturecentral.org/knowhy/why-did-the-ammonite-king-require-the-right-eyes-of-the-people-of-jabesh-gilead-be-gouged-out-1'
    quote: 'Apparently, the Ammonites believed that the land Israel was inhabiting was theirs, but the Israelites had won the land when another group who had settled there, the Amorites, attacked the Israelites and lost (see Judges 11:13-25).'
  - where: 'note 11:12 “Words before war”'
    claim: 'The king claims the land from Arnon to Jabbok'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/11?lang=eng'
    quote: 'Because Israel took away my land, when they came up out of Egypt, from Arnon even unto Jabbok, and unto Jordan'
  - where: 'note 11:24 “Why Chemosh?”'
    claim: 'The Ammonites worshipped Molech or Milcom'
    key: bd-ammon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ammon?lang=eng'
    quote: 'worshippers of Molech or Milcom (1 Kgs. 11:7, 33)'
  - where: 'note 11:24 “Why Chemosh?”'
    claim: 'Chemosh was the god of Moab, also of Ammon from this verse'
    key: bd-chemosh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/chemosh?lang=eng'
    quote: 'The god of Moab (1 Kgs. 11:7); also of Ammon (Judg. 11:24).'
  - where: 'note 11:24 “Why Chemosh?”'
    claim: 'Moabites are in the speaker’s mind; Ammon’s god was Milcom (Cambridge)'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/11.htm'
    quote: 'What Jehovah was to Israel Chemosh was to Moab; Numbers 21:29, Moab. St. passim. Obviously Moabites are in the speaker’s mind, not Ammonites, whose national god was Milcom.'
  - where: 'note 11:24 “Why Chemosh?”'
    claim: 'After verse 15 the argument is aimed at Moab: the deity of 11:24 and the cities of 11:26 are Moabite (Cambridge)'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/11.htm'
    quote: 'the deity referred to in Jdg 11:24 is Moabite, and so are the cities in Jdg 11:26.'
  - where: 'note 11:24 “Why Chemosh?”'
    claim: 'Part of Sihon’s territory had once been Moabite and Ammonite, conquered by the Amorites (Keil)'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/11.htm'
    quote: 'but one portion of the territory of Sihon had formerly been Moabitish and Ammonitish property, and had been conquered by the Amorites and occupied by them.'
  - where: 'note 11:24 “Why Chemosh?”'
    claim: 'Ancient Near Eastern peoples spoke of gods ruling specific lands; Jephthah thinks Chemosh cares for Moab and Jehovah for Israel'
    key: sc-knowhy-874
    url: 'https://scripturecentral.org/knowhy/why-does-god-s-throne-have-wheels-in-ezekiel'
    quote: 'Most people in the ancient Near East spoke of various gods ruling over a specific land, nation, or similar geographical location. … Jephthah thinks that the Moabite deity Chemosh would take care of the Moabites, and Jehovah would take care of the Israelites.'
  - where: 'note 11:24 “Why Chemosh?”'
    claim: 'Nephi’s “all are alike unto God” would have startled hearers who assumed each god cared only for his own people'
    key: sc-knowhy-278
    url: 'https://scripturecentral.org/knowhy/why-did-nephi-say-that-all-are-alike-unto-god'
    quote: 'probably would have been shocking to them. Most people in the ancient Near East, where Nephi and his brothers were from, assumed that each nation had its own god, and that each god only cared about his own people (Judges 11:24).'
  - where: 'note 11:26 “Three hundred years”'
    claim: 'The compiler gives round numbers, and judges may have held office at the same time'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: 'There is much difficulty in deciding the chronology of the period, as the compiler generally gives his figures in round numbers. In some cases the influence of a judge only extended over part of the land, so that two judges might hold office at the same time.'
  - where: 'note 11:27 “The LORD the Judge”'
    claim: 'The Hebrew has the verb “judge” and the participle “the Judge” together'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'יִשְׁפֹּ֨ט'
  - where: 'note 11:27 “The LORD the Judge”'
    claim: 'BDB lists Judges 11:27 (twice) under God judging between parties, of war'
    key: bdb
    url: 'https://biblehub.com/hebrew/8199.htm'
    quote: 'a. of God Psalm 82:1: בֵּיןוּ֗֗֗בֵין ׳שׁ Genesis 16:5 (J; domestic), Judges 11:27 (twice in verse); 1 Samuel 24:13; 1 Samuel 24:16 (all of war)'
  - where: 'note 11:27 “The LORD the Judge”'
    claim: 'In Judges the verb most often means to lead; God was viewed from the beginning as the ultimate judge (Strauss and Longman, quoted in Schade)'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'šāpaṭ (שָׁפַט) “to judge” in Judges means, most often, “to lead,” rather than to act as a judiciary. … From the beginning God was viewed as the ultimate judge, always deciding what was right and just'
  - where: 'note 11:27 “The LORD the Judge”'
    claim: 'The Church footnote to “Judge” points to TG Jesus Christ, Judge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/11?lang=eng'
    quote: '“Judge”: TG Jesus Christ, Judge.'
  - where: 'note 11:31 “What the vow promised”'
    claim: 'Vows often entreated a favor from Jehovah'
    key: bd-vows
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/vows?lang=eng'
    quote: 'Vows often had an entreating character; they were offered in order to obtain some favor from Jehovah'
  - where: 'note 11:31 “What the vow promised”'
    claim: '“Whatsoever cometh forth” is a participle, “the one coming out”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'הַ/יּוֹצֵ֗א'
  - where: 'note 11:31 “What the vow promised”'
    claim: 'Augustine, quoted by Keil: sheep do not come out to meet a general; “whoever comes out, I will offer him”'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/11.htm'
    quote: 'For it is not, and was not, a customary thing for sheep to come out to meet a victorious general returning from the war. … but he says, ''Whoever comes out, I will offer him;'''
  - where: 'note 11:31 “What the vow promised”'
    claim: 'Keil concludes a human being was included in the vow'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/11.htm'
    quote: 'From all this there can be no doubt that Jephthah must have been thinking of some human being as at all events included in his vow'
  - where: 'note 11:31 “What the vow promised”'
    claim: 'Keil argues ʿōlâ means complete surrender, not burning'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/11.htm'
    quote: 'The word עולה does not involve the idea of burning, like our word burnt-offering, but simply that of going up upon the altar, or of complete surrender to the Lord.'
  - where: 'note 11:31 “What the vow promised”'
    claim: 'The word in the verse is ʿōlâ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'עוֹלָֽה'
  - where: 'note 11:31 “What the vow promised”'
    claim: 'BDB: ʿōlâ is the whole burnt-offering, entirely consumed on the altar'
    key: bdb
    url: 'https://biblehub.com/hebrew/5930.htm'
    quote: 'the whole burnt-offering (beast or fowl) is entirely consumed and goes up i the flame of the altar to God'
  - where: 'note 11:31 “What the vow promised”'
    claim: 'Verse 32: the LORD delivered them into his hands'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/11?lang=eng'
    quote: 'So Jephthah passed over unto the children of Ammon to fight against them; and the Lord delivered them into his hands.'
  - where: 'note 11:39 “What Jephthah did”'
    claim: 'The chapter heading: the rash vow leads to the sacrifice of his only daughter'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/11?lang=eng'
    quote: 'He makes a rash vow, which leads to the sacrifice of his only daughter.'
  - where: 'note 11:39 “What Jephthah did”'
    claim: 'The Bible Dictionary: he offered his daughter in sacrifice; commended in Hebrews probably for delivering Israel'
    key: bd-jephthah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jephthah?lang=eng'
    quote: 'He is chiefly known for his rash vow, in consequence of which he offered his own daughter in sacrifice. He is commended in Heb. 11:32, probably because of his delivery of Israel from Ammon.'
  - where: 'note 11:39 “What Jephthah did”'
    claim: 'Litchman: a foolish vow that inadvertently led to her sacrifice'
    key: litchman-deborah
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/01/deborah-and-the-book-of-judges?lang=eng'
    quote: 'he made a foolish vow that inadvertently led to the sacrifice of his daughter.'
  - where: 'note 11:39 “What Jephthah did”'
    claim: 'The manual grants a literal reading may support sacrifice, and asks about Hebrews, the bewailed virginity and “she knew no man”'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'Many have supposed that Jephthah offered his daughter as a human sacrifice, and a literal reading of the text may support that view. … In Hebrews 11:32–35 Jephthah is used as one of the examples of great faith.'
  - where: 'note 11:39 “What Jephthah did”'
    claim: 'The manual prints Keil’s dedication reading'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: '“Jephthah was compelled by his vow to dedicate his daughter to Jehovah in a lifelong virginity.'
  - where: 'note 11:39 “What Jephthah did”'
    claim: 'The details: lament in the mountains, not the town; “she knew no man” adds nothing if she died'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'such lamentations could not be uttered in the town, and in the presence of men. … This clause would add nothing to the description in that case, since it was already known that she was a virgin.'
  - where: 'note 11:39 “What Jephthah did”'
    claim: 'The daughters of Israel lamented her yearly; she is not named'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/11?lang=eng'
    quote: 'That the daughters of Israel went yearly to lament the daughter of Jephthah the Gileadite four days in a year.'
  - where: christ
    claim: 'The pattern of Judges teaches the Savior’s power to deliver from sin'
    key: cfm-ot-2026-22
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/22?lang=eng'
    quote: 'Judges 3 describes a pattern that teaches about the Savior’s power to deliver us from sin.'
  - where: christ
    claim: 'Smith, following Beavis: Mark’s Jairus story is a motif inversion of Jephthah’s; both fathers met with noise and chaos'
    key: smith-redemptive-mark
    url: 'https://journal.interpreterfoundation.org/a-redemptive-reading-of-mark-525-34'
    quote: 'Beavis calls this a motif inversion,2 meaning the text in Mark establishes similarities to Jephthah’s story to encourage the audience to compare the events, only to reverse course'
  - where: christ
    claim: 'Events re-enacted end differently; Jesus redeems history and its mistakes'
    key: smith-redemptive-mark
    url: 'https://journal.interpreterfoundation.org/a-redemptive-reading-of-mark-525-34'
    quote: 'to show that Jesus is the one who literally “redeems” history, as biblical events are partially re-enacted in his ministry but end differently because of his presence and power. … Mark shows how Jesus’ life redeems the mistakes and errors of history'
  - where: christ
    claim: 'Jairus intercedes; Jephthah’s foolishness seals his daughter’s fate; Jephthah a prominent religious leader like Jairus'
    key: smith-redemptive-mark
    url: 'https://journal.interpreterfoundation.org/a-redemptive-reading-of-mark-525-34'
    quote: 'Both Jephthah and Jairus are distraught over the deaths of their daughters; both fathers are met with noise and chaos when they return home. But Jairus intercedes to reverse the death of his daughter while Jephthah’s foolishness seals his daughter’s fate.'
  - where: christ
    claim: 'Such texts create a space to name abuse and let individuals share their stories and work toward recovery'
    key: easton-recognizing
    url: 'https://rsc.byu.edu/covenant-compassion/recognizing-responsibility-standing-victims'
    quote: 'These texts create a biblically sanctioned space to name and discuss abuse within a church setting, and it may give individuals the freedom and space they need to share their own stories and then to work toward recovery.'
  - where: explore
    claim: 'Smith’s article reads Jairus beside Jephthah'
    key: smith-redemptive-mark
    url: 'https://journal.interpreterfoundation.org/a-redemptive-reading-of-mark-525-34'
    quote: 'Jonah is now Jesus; Jephthah is now Jairus'
  - where: 'note 11:1 “An outcast called home”'
    claim: 'God uses this less than ideal choice to stave off attack (Conway, quoted in Schade)'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'and yet YHWH uses this less than ideal choice to stave off foreign attack'
  - where: 'note 11:1 “An outcast called home”'
    claim: 'The brothers disinherit him as son of a strange woman'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/11?lang=eng'
    quote: 'Thou shalt not inherit in our father’s house; for thou art the son of a strange woman.'
  - where: 'note 11:31 “What the vow promised”'
    claim: 'Augustine is quoted in Keil’s note'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/11.htm'
    quote: 'Augustine observes in his Quaest. xlix. in l. Jud.'
  - where: 'note 11:39 “What Jephthah did”'
    claim: 'The fathers took the sacrifice literally; medieval rabbis such as the Kimchis proposed dedication (Keil)'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/11.htm'
    quote: 'It was not till the middle ages that Mos. and Dav. Kimchi and certain other Rabbins endeavoured to establish the view, that Jephthah merely dedicated his daughter to the service of the sanctuary of Jehovah in a lifelong virginity.'
  - where: 'note 11:39 “What Jephthah did”'
    claim: 'The view that he put her to death generally prevailed in earlier times among both rabbis and fathers of the church (Keil)'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/11.htm'
    quote: 'the one which generally prevailed in the earlier times among both Rabbins and fathers of the church, viz., that Jephthah put his daughter to death'
