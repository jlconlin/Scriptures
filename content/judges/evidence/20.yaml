chapter: 20
claims:
  - where: setting
    claim: 'Benjamin means "son of the right hand"; the tribe later gave Israel its first king, Saul'
    key: bd-benjamin
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/benjamin?lang=eng'
    quote: 'Son of the right hand. … The Benjamites were a warlike race and did great service in resisting the Philistine oppression. The tribe provided the first king in the person of Saul (1 Sam. 9:1–2).'
  - where: setting
    claim: 'The book''s downward spirals end in civil conflict and the near annihilation of Benjamin (chapter 20)'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Judges is portrayed in a series of downward moral spirals of disobedience that progressively worsen until the book ends in civil conflict and the near annihilation of the tribe of Benjamin (chap. 20).'
  - where: setting
    claim: 'The closing narratives show the tendency to idolatry and lawlessness'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: 'two narratives, which specially show the tendency to idolatry and lawlessness (Judg. 17–21).'
  - where: setting
    claim: 'Phinehas is Aaron''s grandson and serves as high priest at Judges 20:28'
    key: bd-phinehas
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/phinehas?lang=eng'
    quote: 'Grandson of Aaron (Ex. 6:25); kills the two offenders at Peor (Num. 25:7, 11; 31:6; Ps. 106:30); … high priest (Judg. 20:28'
  - where: setting
    claim: 'Mormon''s account of the battles at Desolation evokes the Benjaminite war'
    key: sc-evidence-302
    url: 'https://scripturecentral.org/evidence/three-battles-and-the-book-of-judges'
    quote: 'Mormon’s description of this pivotal battle evokes the disastrous account in the book of Judges of a catastrophic civil war in which the children of Israel suffered great loss and one tribe, Benjamin, was nearly annihilated'
  - where: when
    claim: 'Phinehas stands before the ark in those days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/20?lang=eng'
    quote: 'And Phinehas, the son of Eleazar, the son of Aaron, stood before it in those days'
  - where: thread
    claim: 'The Hebrew way of writing history gives the general result first and the details afterward (20:35, then 36–46)'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/20.htm'
    quote: 'this peculiarity in the Hebrew mode of writing history, viz., that the generally result of any occurrence is given as early as possible, and then the details follow afterwards'
  - where: thread
    claim: 'Israel did to Benjamin as to the Canaanites under the ban'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/20.htm'
    quote: 'Thus they did the same to the Benjaminites as to the Canaanites who were put under the ban, carrying out the ban with the strictest severity.'
  - where: thread
    claim: 'A vengeful civil war nearly annihilated Benjamin: 25,100 slain, 600 left'
    key: ot-manual-judges-13-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-13-21-ruth-1-4-the-reign-of-the-judges-part-2?lang=eng'
    quote: 'The tribe of Benjamin, already one of the smallest, was nearly annihilated in a vengeful civil war. Altogether, according to the account, a total of 25,100 Benjamites were slain, leaving only 600 alive'
  - where: section 3 plain
    claim: '"The house of God" may be read as the place name Bethel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/20?lang=eng'
    quote: 'OR Bethel (also Judg. 21:2).'
  - where: 'note 20:1 “All Israel as one man”'
    claim: 'The tribes seldom acted as one except when a formidable enemy compelled them'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: 'except when the approach of a formidable enemy compelled them to act together, their unity seldom found practical expression and was often overborne by local jealousies.'
  - where: 'note 20:1 “All Israel as one man”'
    claim: 'Mizpah, "watchtower," is the meeting place of Judges 20 and 21'
    key: bd-mizpah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/mizpah?lang=eng'
    quote: 'Watchtower. (1) The heap of stones raised by Jacob and Laban (Gen. 31:49; Judg. 10:17; 11:11, 29, 34; 20:1, 3; 21:1, 5, 8)'
  - where: 'note 20:1 “All Israel as one man”'
    claim: 'Dan the north, Beersheba the south, Gilead east of Jordan; "unto the LORD" means a court held in His name, not necessarily a sanctuary'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/20.htm'
    quote: 'It by no means follows with certainty from the expression "to Jehovah," that there was a sanctuary at Mizpeh, … but simply that the meeting took place in the sight of Jehovah, or that the congregation assembled together to hold a judicial court, which they held in the name of Jehovah'
  - where: 'note 20:1 “All Israel as one man”'
    claim: 'Benjamin was not present at Mizpeh'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/20.htm'
    quote: 'the Benjaminites heard that the children of Israel (the rest of the Israelites, the eleven tribes) had come up to Mizpeh;" but they themselves were not found there.'
  - where: 'note 20:5 “The Levite tells his story”'
    claim: 'The men of Gibeah had not said they meant to kill him; he concluded it from what happened to his wife'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/20.htm'
    quote: '"Me they intended to kill:" the Levite draws this conclusion from what had happened to his wife; the men of Gibeah had not expressed any such intention in Judges 19:22.'
  - where: 'note 20:5 “The Levite tells his story”'
    claim: 'He was likely in fear of his life but shaped his story to conceal his own cowardice'
    key: pulpit-judges
    url: 'https://biblehub.com/commentaries/pulpit/judges/20.htm'
    quote: 'This was so far true that it is likely he was in fear of his life; but he doubtless shaped his narrative so as to conceal his own cowardice in the transaction.'
  - where: 'note 20:5 “The Levite tells his story”'
    claim: 'In chapter 19 the Levite himself brought the woman out to the men'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/19?lang=eng'
    quote: 'so the man took his concubine, and brought her forth unto them'
  - where: 'note 20:13 “Deliver us the men”'
    claim: 'Deuteronomy uses "put away evil from Israel" where it sentences the guilty to death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/22?lang=eng'
    quote: 'then they shall both of them die, both the man that lay with the woman, and the woman: so shalt thou put away evil from Israel.'
  - where: 'note 20:13 “Deliver us the men”'
    claim: 'A strained relationship among the tribes (chapters 20–21) came of conduct the book portrays'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Over time, this led to a strained relationship within the tribes of Israel (chaps. 20–21) and with God'
  - where: 'note 20:26 “Three times they asked”'
    claim: 'At 20:18 Israel asked which tribe should lead, and God named Judah, as in 1:2'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/20.htm'
    quote: 'Before opening the campaign the Israelites went to Bethel, to inquire of God which tribe should commence the war, … and God appointed the tribe of Judah, as in Judges 1:2.'
  - where: 'note 20:26 “Three times they asked”'
    claim: 'One older reading: the defeats came from self-confidence; they asked only who should lead, and "Go up" gave no promise of the result; only after the second defeat they humbled themselves, fasting'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/20.htm'
    quote: 'but rather in the state of mind with which they had entered upon the war, their strong self-consciousness, and great confidence in their own might and power. … "Go up against him," which certainly sanctioned the continuance of the war, but gave no promise as to the result'
  - where: 'note 20:26 “Three times they asked”'
    claim: 'Fasting expressed the bending of the heart; the peace offerings were supplicatory'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/20.htm'
    quote: 'the fasting being the manifest expression of the bending of the heart before God, - and offered burnt-offerings and peace-offerings. The shelamim here are not thank-offerings, but supplicatory offerings'
  - where: 'note 20:26 “Three times they asked”'
    claim: 'In 20:23–26 the Lord responded to weeping and pleading; a rare display of contrition'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Similarly, in Judges 20:23–26, amid some of the people’s lowest moments and greatest internal conflicts, the Lord responded to his children’s weeping and pleading before him for help. In a rare display of contrition in the depths of their despair'
  - where: 'note 20:27 “The ark, and Phinehas before it”'
    claim: 'The ark is mentioned expressly in Judges only at 20:27; it seems to have been at Bethel at the beginning of the period and at Shiloh at its close'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: 'At the beginning of this period the Ark seems to have been at Bethel, while at its close it was at Shiloh (1 Sam. 4:3), but it is only mentioned expressly in Judg. 20:27.'
  - where: 'note 20:27 “The ark, and Phinehas before it”'
    claim: 'The ark was brought to Bethel; Phinehas inquired through the Urim and Thummim; Bethel was on Benjamin''s border and hallowed by Jacob''s revelations'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/20.htm'
    quote: 'The ark of the covenant was therefore brought to Bethel, and Phinehas the high priest inquired of the Lord before it through the Urim and Thummim (Judges 20:27, Judges 20:28). Bethel was on the northern boundary of the tribe of Benjamin'
  - where: 'note 20:27 “The ark, and Phinehas before it”'
    claim: 'Phinehas is Aaron''s grandson, the zealous priest of Peor, high priest here'
    key: bd-phinehas
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/phinehas?lang=eng'
    quote: 'Grandson of Aaron (Ex. 6:25); kills the two offenders at Peor (Num. 25:7, 11; 31:6; Ps. 106:30); Phinehas and the trans-Jordanic tribes (Josh. 22:15, 30–32)'
  - where: 'note 20:27 “The ark, and Phinehas before it”'
    claim: 'The statement places these events within the lifetime of Phinehas'
    key: pulpit-judges
    url: 'https://biblehub.com/commentaries/pulpit/judges/20.htm'
    quote: 'A most important statement, defining the time of these occurrences, within the lifetime of Phinehas'
  - where: 'note 20:27 “The ark, and Phinehas before it”'
    claim: '"The house of God" may be read as Bethel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/20?lang=eng'
    quote: 'OR Bethel (also Judg. 21:2).'
  - where: 'note 20:34 “Mormon remembers Gibeah”'
    claim: 'Both accounts have three battles; the smaller side repels two, then is decoyed out in the third'
    key: sc-evidence-302
    url: 'https://scripturecentral.org/evidence/three-battles-and-the-book-of-judges'
    quote: 'The Benjaminites and Nephites each successfully repelled two separate assaults from a larger attacking army, the other tribes of Israel (Judges 20:20–21, 24–25) and the Lamanites (Mormon 3:7–8). In the third battle, however, the Benjaminite force was decoyed out of its fortified position'
  - where: 'note 20:34 “Mormon remembers Gibeah”'
    claim: 'Both use "the battle was sore" / "a sore battle" in the third engagement'
    key: sc-evidence-302
    url: 'https://scripturecentral.org/evidence/three-battles-and-the-book-of-judges'
    quote: 'During the third battle between the Israelites and Benjamin’s army, “the battle was sore” (Judges 20:34). Similarly, during the third engagement between the Nephites and the Lamanites, Mormon says “they had a sore battle” (Mormon 4:2).'
  - where: 'note 20:34 “Mormon remembers Gibeah”'
    claim: 'Klein (quoted) on the ambiguity of "the evil" in 20:34; Mormon makes the same point in Mormon 4:5'
    key: sc-evidence-302
    url: 'https://scripturecentral.org/evidence/three-battles-and-the-book-of-judges'
    quote: 'It may also be taken to suggest that the forces of Israel, which are striking the Benjaminites down, are themselves evil, that Yahweh uses the reprehensible forces of Israel to conquer iniquitous forces of Benjamin.'
  - where: 'note 20:34 “Mormon remembers Gibeah”'
    claim: 'The allusions are presented as Mormon underscoring his people''s depravity'
    key: sc-evidence-302
    url: 'https://scripturecentral.org/evidence/three-battles-and-the-book-of-judges'
    quote: 'Mormon skillfully underscores the moral depravity of his own people by drawing upon the language from a similar story in Judges.'
  - where: christ
    claim: 'The Lord responded to weeping and pleading even at the people''s lowest moments'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'amid some of the people’s lowest moments and greatest internal conflicts, the Lord responded to his children’s weeping and pleading before him for help.'
  - where: christ
    claim: 'God did not give up on them, nor did His love override behavior and its consequences'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Despite their vices, God did not give up on them, nor did his love override negative behavior and its consequences, highlighting it in a painful and poignant way.'
  - where: explore
    claim: 'Scripture Central''s Evidence #302 sets the three battles beside Mormon 3–4'
    key: sc-evidence-302
    url: 'https://scripturecentral.org/evidence/three-battles-and-the-book-of-judges'
    quote: 'Both Judges and Mormon describe three serious battles which led to disaster for the smaller group.'
  - where: thread
    claim: 'The tribes seldom acted as one'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: 'their unity seldom found practical expression and was often overborne by local jealousies.'
  - where: 'note 20:34 “Mormon remembers Gibeah”'
    claim: 'Both gather themselves together to one city'
    key: sc-evidence-302
    url: 'https://scripturecentral.org/evidence/three-battles-and-the-book-of-judges'
    quote: 'In Judges the children of Bejamin “gathered themselves together out of the cities unto Gibeah” to battle against the other tribes (Judges 20:14). Similarly, Mormon wrote that the Nephites did “gather themselves together at the land Desolation'
  - where: 'note 20:34 “Mormon remembers Gibeah”'
    claim: 'Both go "out" to the third battle'
    key: sc-evidence-302
    url: 'https://scripturecentral.org/evidence/three-battles-and-the-book-of-judges'
    quote: 'During the third battle, the army of Benjamin “went out” of their fortress to fight (Judges 20:31). Similarly, the Nephites in their third battle went “out” from the city of Desolation'
  - where: 'note 20:34 “Mormon remembers Gibeah”'
    claim: 'Israel''s oath and a tribe "cut off" beside the Nephites'' oath to "cut off" the Lamanites'
    key: sc-evidence-302
    url: 'https://scripturecentral.org/evidence/three-battles-and-the-book-of-judges'
    quote: 'Mormon says that when the Nephites made their oath, they swore that they would “cut off” the Lamanites from the face of the land (Mormon 3:10).'
  - where: 'note 20:34 “Mormon remembers Gibeah”'
    claim: 'The study calls these subtle allusions'
    key: sc-evidence-302
    url: 'https://scripturecentral.org/evidence/three-battles-and-the-book-of-judges'
    quote: 'Mormon’s subtle allusions to the Benjaminite war from the book of Judges in his account of the Nephite defeat at Desolation'
  - where: 'note 20:13 “Deliver us the men”'
    claim: 'Deuteronomy uses "put away the evil from Israel" where it sentences the guilty to death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/17?lang=eng'
    quote: 'even that man shall die: and thou shalt put away the evil from Israel.'
  - where: setting
    claim: 'Hosea measures Israel''s sin from the days of Gibeah and the battle there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/hosea/10?lang=eng'
    quote: 'O Israel, thou hast sinned from the days of Gibeah: there they stood: the battle in Gibeah against the children of iniquity did not overtake them.'
  - where: 'note 20:27 “The ark, and Phinehas before it”'
    claim: 'The Church''s footnote to "house" in verse 26 points to the tabernacle pitched at Shiloh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/20?lang=eng'
    quote: 'Josh. 18:1.'
  - where: 'note 20:27 “The ark, and Phinehas before it”'
    claim: 'Another older reading: Bethel does not fit the tabernacle''s resting at Shiloh under Phinehas'
    key: pulpit-judges
    url: 'https://biblehub.com/commentaries/pulpit/judges/20.htm'
    quote: 'But it is not in accordance with the other intimations given us concerning the tabernacle, that Bethel should be its resting-place under the high priesthood of Phinehas. In Joshua 18:1 we have the formal pitching of the tabernacle of the congregation at Shiloh'
  - where: 'note 20:34 “Mormon remembers Gibeah”'
    claim: 'Israel had unwisely sworn an oath before the war (21:1, 5, 7)'
    key: sc-evidence-302
    url: 'https://scripturecentral.org/evidence/three-battles-and-the-book-of-judges'
    quote: 'Before going to battle with the tribe of Benjamin, the forces of Israel had unwisely “sworn” an oath'
