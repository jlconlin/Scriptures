chapter: 7
claims:
  - where: setting
    claim: 'Chapter 7 narrates the gathering of the army (1–8) and the first excursion against Midian (15–23), after the commission of chapter 6'
    key: ot-minute-judg-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-7'
    quote: 'Gideon having been duly commissioned in the previous chapter (Judges 6:11–24), the seventh chapter of Judges narrates, among other things, Gideon’s gathering his army (verses 1–8) and their first excursion against the Midianites (verses 15–23).'
  - where: setting
    claim: 'Israel camped in or near the plain of Jezreel, west of the Jordan, gathered from the western tribes; 32,000 against about 135,000 (8:10)'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/7.htm'
    quote: 'The army of the Israelites amounted to 32,000 men (Judges 7:4), but that of the Midianites and their allies was about 135,000 (Judges 8:10) … the Israelitish army was encamped in or near the plain of Jezreel, in the country to the west of the Jordan, and had been gathered from the western tribes alone'
  - where: setting
    claim: 'The Church footnotes send verses 23 and 25 to Isaiah 9:4 and 10:26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/7?lang=eng'
    quote: '23a “Midianites”: Isa. 9:4. … 25a “Oreb”: Isa. 10:26.'

  - where: thread
    claim: 'The reduction showed that the victory could be attributed only to divine power'
    key: ot-minute-judg-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-7'
    quote: 'The reason for this was to show that Israel’s expected victory over the Midianites could be attributed only to divine power, not to any human capability (verse 2).'
  - where: thread
    claim: 'The Lord strengthened Gideon''s faith with the fleece and then required an attestation of that faith in the purification of the army'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/7.htm'
    quote: 'Whilst the Lord was willing to strengthen the feeble faith of Gideon by the sign with the fleece of wool … He also required of him, when thus strengthened, an attestation of his faith, by the purification of his army that he might give the whole glory to Him'

  - where: section 1 plain
    claim: '“Try” rendered “test”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/7?lang=eng'
    quote: '4b “try”: OR test.'
  - where: section 2 plain
    claim: '“the tent lay along” rendered “the tent lay flat”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/7?lang=eng'
    quote: '13c “the tent lay along”: IE the tent lay flat.'
  - where: section 3 plain
    claim: 'The guards had just been changed; the war-cry in verse 18 is “To the Lord and Gideon,” in verse 20 “Sword to the Lord and Gideon”'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/7.htm'
    quote: '"and say, To the Lord and Gideon." According to Judges 7:20, this war-cry ran fully thus: "Sword to (for) the Lord and Gideon."'

  - where: 'note 7:2 “Too many for the LORD to save”'
    claim: 'The verb (hithpael of pa''ar) means to glorify oneself; with “against” a person, to boast; Judges 7:2 cited'
    key: bdb
    url: 'https://biblehub.com/hebrew/6286.htm'
    quote: 'Hithpa`el 1. glorify oneself, with עַל person: = boast, Imperfect3masculine singular יִתְמָּאֵר Judges 7:2'
  - where: 'note 7:2 “Too many for the LORD to save”'
    claim: 'The reduction showed the victory came only from divine power, not human capability'
    key: ot-minute-judg-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-7'
    quote: 'The reason for this was to show that Israel’s expected victory over the Midianites could be attributed only to divine power, not to any human capability (verse 2).'
  - where: 'note 7:2 “Too many for the LORD to save”'
    claim: 'The 32,000 were reduced to 300 that the help of the Lord might be apparent'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'Eventually the 32,000 were reduced to 300, that the ‘help of the Lord’ might be apparent to Israel.'
  - where: 'note 7:2 “Too many for the LORD to save”'
    claim: 'The footnote to “many” in verse 4 points to 1 Samuel 14:6; verse 23 to Isaiah 9:4'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/7?lang=eng'
    quote: '4a “many”: 1 Sam. 14:6. … 23a “Midianites”: Isa. 9:4.'
  - where: 'note 7:2 “Too many for the LORD to save”'
    claim: 'Jonathan: no restraint to the Lord to save by many or by few'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/14?lang=eng'
    quote: 'it may be that the Lord will work for us: for there is no restraint to the Lord to save by many or by few.'

  - where: 'note 7:3 “Mount Gilead, or Gilboa?”'
    claim: 'The appeal was prescribed in Deut. 20:8; more than two-thirds, 22,000, turned back, a result Gideon did not expect'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/7.htm'
    quote: 'Hence the result of the appeal was one which Gideon himself certainly did not expect, - namely, that more than two-thirds of the soldiers gathered round him - 22,000 men of the people - turned back, and only 10,000 remained.'
  - where: 'note 7:3 “Mount Gilead, or Gilboa?”'
    claim: 'Gilead was east of the Jordan; the army was west, near Jezreel; either an error for Gilboa or a western Mount Gilead, as there was a Seir in Judah'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/7.htm'
    quote: 'The only course left therefore is either to pronounce it an error of the text, as Clericus and Bertheau have done, and to regard "Gilead" as a mistake for "Gilboa," or to conclude that there was also a mountain or mountain range named Gilead by the plain of Jezreel in western Palestine'
  - where: 'note 7:3 “Mount Gilead, or Gilboa?”'
    claim: 'The Church footnote gives Mount Gilboa as an alternative and points “fearful” to Deut. 20:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/7?lang=eng'
    quote: '3a “fearful”: Deut. 20:8. … 3b “mount Gilead”: OR Mount Gilboa.'

  - where: 'note 7:4 “The test at the water”'
    claim: 'The verb tsaraph means smelt, refine, test; BDB gives Judges 7:4 as the Lord testing the warriors'
    key: bdb
    url: 'https://biblehub.com/hebrew/6884.htm'
    quote: 'צָרַף verb smelt, refine, test … 2 test Judges 7:4 I will test them (the warriors) for thee (׳י subject)'
  - where: 'note 7:4 “The test at the water”'
    claim: 'The purpose of the test is not clear; perhaps alertness'
    key: ot-minute-judg-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-7'
    quote: 'The specific purpose of this exercise is not clear, but it may have had something to do with showing the difference in alertness between the two groups'
  - where: 'note 7:4 “The test at the water”'
    claim: 'The 300 were the bravest, not cowards as Josephus and others supposed; no general would have thought of it if the Lord had not commanded it; the Lord would separate those appointed for battle'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/7.htm'
    quote: 'The 300 men who quenched their thirst in this manner were certainly not the cowardly or indolent who did not kneel down to drink in the ordinary way, either from indolence or fear, as Josephus, Theodoret, and others supposed, but rather the bravest'
  - where: 'note 7:4 “The test at the water”'
    claim: 'No general would have shrunk the army or attacked 100,000 with a few hundred if the Lord had not commanded it'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/7.htm'
    quote: 'or of attempting to defeat an army of more than 100,000 men by a few hundred of the bravest men, if the Lord himself had not commanded it.'

  - where: 'note 7:13 “The barley loaf and the tent”'
    claim: 'Barley bread, food of the poorer classes in a land of wheat, symbolized despised Israel; the tent the nomad''s life, freedom and power; Israel crushed into poverty'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/7.htm'
    quote: 'whilst in his own tent he would see a symbol not only of his mode of life, but of his freedom, greatness, and power. … in Palestine, the land of wheat, none but the poorer classes feed upon barley bread'
  - where: 'note 7:13 “The barley loaf and the tent”'
    claim: 'The rising had filled Midian with fear; God caused the Midianite to dream and tell the dream just when Gideon was there'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/7.htm'
    quote: 'God not only foreknew it, but really caused the Midianite to dream, and to relate the dream to his comrade, just at the time when Gideon had secretly entered the camp, so that he should hear it'
  - where: 'note 7:13 “The barley loaf and the tent”'
    claim: 'The barley cake represents the agricultural Israelites, the tents the seminomadic Midianites; a prophetic dream given to an enemy, as to Pharaoh in Genesis 41'
    key: ot-minute-judg-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-7'
    quote: 'The barley cake, which represents the agricultural Israelites, rolls down and smashes the tents of the seminomadic Midianites. What is remarkable about this, however, is that the dream (which is clearly meant to be prophetic in some capacity) came to a non-Israelite enemy'
  - where: 'note 7:13 “The barley loaf and the tent”'
    claim: 'The footnote reads “the tent lay along” as “the tent lay flat”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/7?lang=eng'
    quote: '13c “the tent lay along”: IE the tent lay flat.'

  - where: 'note 7:19 “The middle watch”'
    claim: 'Israel had three night watches; the middle watch was 10 p.m. to 2 a.m.; the Romans had four'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'Ancient Israel divided the twelve hours of the night into three watches. The middle watch would have been from 10:00 p.m. until 2:00 a.m. … In New Testament times the Romans divided the night into four watches'
  - where: 'note 7:19 “The middle watch”'
    claim: 'The first sentries had just been relieved, so the camp thought it could rest secure'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/7.htm'
    quote: 'When the first sentries were relieved, and the second posted, so that they thought they might make quite sure of their night''s rest once more, Gideon and his host arrived at the end of the camp'
  - where: 'note 7:20 “Horns, jars, torches and a shout”'
    claim: 'Hands occupied, all they could do was shout; the cry likely emphasized trust in the Lord and His chosen leader'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'With their hands occupied by horns and lamps, all Gideon’s army could do was shout, “The sword of the Lord, and of Gideon.” This battle cry likely emphasized their trust in the Lord and His chosen leader to deliver them from the Midianites.'
  - where: 'note 7:20 “Horns, jars, torches and a shout”'
    claim: 'Normally only a comparatively small number of men in an army carry trumpets'
    key: schutze-gideon
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/04/the-sword-of-the-lord-and-of-gideon?lang=eng'
    quote: 'Normally only a comparatively small number of men in an army carry trumpets. As the Midianites lay sound asleep, the sound of 300 trumpets blaring and jars breaking jolted them to their feet to see the blazing lamps nearby.'
  - where: 'note 7:20 “Horns, jars, torches and a shout”'
    claim: 'Sound and light confused and panicked the enemy; the Midianites turned against their comrades, apparently mistaking them for Israelites'
    key: ot-minute-judg-7
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-7'
    quote: 'In a clever ruse, Gideon made use of sound and light to confuse the enemy and throw them into a panic. … The trick worked so well that the Midianites turned against their own comrades, apparently mistaking them for their Israelite attackers (verse 22).'
  - where: 'note 7:20 “Horns, jars, torches and a shout”'
    claim: 'The tactic that discomfited Midian did not involve direct violence by Gideon''s men'
    key: haws-better-way
    url: 'https://mi.byu.edu/old-testament-reflections/longing-for-a-better-way'
    quote: 'It’s interesting that the tactic that discomfited the Midianites did not involve direct violence on the part of Gideon and his men.'
  - where: 'note 7:20 “Horns, jars, torches and a shout”'
    claim: 'The footnote to “fellow” in verse 22 points to 1 Sam. 14:20 and 2 Chr. 20:23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/7?lang=eng'
    quote: '22a “fellow”: 1 Sam. 14:20; 2 Chr. 20:23.'

  - where: 'note 7:25 “Raven and Wolf, remembered”'
    claim: 'Oreb means raven'
    key: bdb
    url: 'https://biblehub.com/hebrew/6159.htm'
    quote: 'Word Origin: [the same as H6158 (עוֹרֵב עוֹרֵב - raven)] 1. Oreb, the name of a Midianite and of the cliff near the Jordan'
  - where: 'note 7:25 “Raven and Wolf, remembered”'
    claim: 'Zeeb means wolf'
    key: bdb
    url: 'https://biblehub.com/hebrew/2062.htm'
    quote: 'II. זְאֵב proper name, masculine (wolf) — a prince of Midian, Judges 7:25 (3 t. in verse); Judges 8:3; Psalm 83:12'
  - where: 'note 7:25 “Raven and Wolf, remembered”'
    claim: 'Presenting body parts of the slain symbolized victory, a routine ancient Near Eastern practice; Judges 7:25 shows Israel did so'
    key: sc-knowhy-125
    url: 'https://scripturecentral.org/knowhy/why-did-the-servants-present-lamoni-with-the-arms-of-his-enemies'
    quote: 'Judges 7:25 and 8:6 indicate that the early Israelites engaged in such practices, which are well attested in Egyptian, Canaanite, and Mesopotamian sources.'
  - where: 'note 7:25 “Raven and Wolf, remembered”'
    claim: 'The footnote to Oreb points to Isaiah 10:26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/7?lang=eng'
    quote: '25a “Oreb”: Isa. 10:26.'

  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'The Lord can use small things to do great work'
    key: cfm-ot-2026-22
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/22?lang=eng'
    quote: 'Judges 7:1–21: The Lord can use small things to do great work.'
  - where: christ
    claim: 'The Lord can work miracles when we trust in His ways'
    key: cfm-ot-2026-22
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/22?lang=eng'
    quote: 'Judges 6–8: The Lord can work miracles when I trust in His ways.'
  - where: christ
    claim: 'The Lord gives the faithful line upon line and tries and proves them; the footnote to “try” points to D&C 98:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/98?lang=eng'
    quote: 'For he will give unto the faithful line upon line, precept upon precept; and I will try you and prove you herewith.'

  - where: explore
    claim: 'The footnotes point to 1 Samuel 14 and 2 Chronicles 20 as other routs by few or by the enemy turning on itself'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/7?lang=eng'
    quote: '22a “fellow”: 1 Sam. 14:20; 2 Chr. 20:23.'
