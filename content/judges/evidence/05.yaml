chapter: 5
claims:
  - where: setting
    claim: 'The Song of Deborah is one of the earlier writings the compiler worked into Judges'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: 'The compiler would have had available earlier writings that he worked into his book, such as the Song of Deborah, the parable of Jotham, and some of the utterances of Samson.'
  - where: setting
    claim: 'At 5:1 the Hebrew shifts from Classical to Archaic Biblical Hebrew, from story to song'
    key: sc-knowhy-853
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-contain-poems-in-the-middle-of-stories'
    quote: 'In Judges 5:1, the text suddenly shifts from the more common Classical Biblical Hebrew into an older form called Archaic Biblical Hebrew, as the text moves from a story about Deborah, in Judges 4, to a poem or song about Deborah.'
  - where: setting
    claim: 'The Song of the Sea and the Song of Deborah are both in Archaic Biblical Hebrew'
    key: sc-knowhy-853
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-contain-poems-in-the-middle-of-stories'
    quote: 'The Song of the Sea (Exodus 15), the Song of Deborah (Judges 5), … are all written in this earliest stage of the language.'
  - where: setting
    claim: 'Sung by Deborah and Barak; one of the oldest portions of the Hebrew Bible, possibly near-contemporary'
    key: ot-minute-judg-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-5'
    quote: 'technically it is both Deborah and Barak who are depicted as having sung the ballad (Judges 5:1). This poem is one of the oldest portions of the Hebrew Bible and might very well be a near-contemporary poetic account of the events recorded in Judges 4.'
  - where: setting
    claim: 'The song is a hymn of praise composed soon after the victory'
    key: litchman-deborah
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/01/deborah-and-the-book-of-judges?lang=eng'
    quote: 'Chapter 4 is a narrative of the war, and chapter 5, the Song of Deborah, is a hymn of jubilant praise composed soon after the victory it celebrates.'
  - where: setting
    claim: 'Only the song has the Kishon flood, Sisera''s mother and the title mother in Israel; separate histories but complementary in broad strokes'
    key: ot-minute-judg-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-5'
    quote: 'The poem also identifies a third character not mentioned in the prose account: Sisera’s mother … Deborah herself was afforded the title “a mother in Israel” in the song (5:7), something also missing from Judges 4. These differences suggest separate compositional histories, but notwithstanding, the prose and poetic accounts of Deborah and Barak are in broad strokes complementary.'
  - where: thread
    claim: 'The theme of the song is the deliverance of Israel through Jehovah''s intervention'
    key: shannon-models-motherhood
    url: 'https://rsc.byu.edu/covenant-compassion/models-motherhood'
    quote: 'The theme of Deborah’s Song is the deliverance of the Israelites through the divine intervention of Jehovah.'
  - where: thread
    claim: 'Choosing new gods (5:8) is the doing evil of 4:1, which led to the oppression'
    key: litchman-deborah
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/01/deborah-and-the-book-of-judges?lang=eng'
    quote: 'a battle that resulted after the Israelites “did evil in the sight of the Lord.” (Judg. 4:1.) They followed the pattern and “chose new gods.” (Judg. 5:8.)'
  - where: thread
    claim: 'Verses 15–17 name the tribes that stayed away, then 18 returns to Zebulun and Naphtali'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/5.htm'
    quote: 'In this strophe Deborah first of all mentions the tribes which took no part in the conflict (Judges 5:15-17), and then returns in Judges 5:18 to the Zebulunites, who staked their life along with Naphtali'
  - where: section 3 plain
    claim: 'Verse 11: then the people of the Lord went down to the gates'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/5?lang=eng'
    quote: 'HEB By the voices of archers down among the watering places, there they rehearse the righteousness of Jehovah, even the righteousness of His rulers in Israel. Then the people of the Lord went down to the gates.'
  - where: section 4 plain
    claim: 'Verse 13: a remnant came down against the nobles'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/5?lang=eng'
    quote: 'HEB Then a remnant descended against the nobles; the people of the Lord descended for me against the mighty.'
  - where: section 4 plain
    claim: 'Verse 14: those who hold the marshal''s staff'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/5?lang=eng'
    quote: 'HEB hold the sceptre of the muster-officer, the marshal’s staff.'
  - where: section 4 plain
    claim: 'Verses 12–22 are the muster and the battle; 15b–18 the reluctant and the ready'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/5.htm'
    quote: 'Part II, Jdg 5:12-22, describes the muster and the battle.'
  - where: section 5 plain
    claim: 'Verse 21: tread down with might'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/5?lang=eng'
    quote: 'HEB (perhaps) tread (them) down with might.'
  - where: section 5 plain
    claim: 'Verse 22: the horse hooves stamped'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/5?lang=eng'
    quote: 'OR Then did the horse hooves stamp.'
  - where: section 6 plain
    claim: 'Verse 25: curds, a bowl of nobles; verse 26: tent peg'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/5?lang=eng'
    quote: 'HEB curds, curdled milk.'
  - where: section 7 plain
    claim: 'Verse 30: are they not finding, dividing spoil'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/5?lang=eng'
    quote: 'HEB Are they not finding, dividing spoil?'
  - where: 'note 5:2 “When the locks grew long”'
    claim: 'The verb means to loosen, especially the hair; the noun is used of Nazarite locks; long hair marked a vow, of warriors bent on vengeance; translation when the locks grew long; volunteering for battle; sense doubtful'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/5.htm'
    quote: 'in Hebrew the verb ‘took the lead’ properly means to loosen Exodus 5:4, especially to let the hair go loose … and the noun is used of the long locks of the Nazirites Numbers 6:5. Wearing the hair long was the mark of a vow'
  - where: 'note 5:2 “When the locks grew long”'
    claim: 'Warriors bent on vengeance; the translation when the locks grew long; volunteering; sense doubtful'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/5.htm'
    quote: 'Hence we may transl. when the locks grew long in Israel i.e. when the warriors took the vow of vengeance … Offered themselves willingly, of volunteering for battle … The exact sense of the verse is doubtful.'
  - where: 'note 5:2 “When the locks grew long”'
    claim: 'BDB gives, with a query, a verb act as leader at Judges 5:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/6544.htm'
    quote: '[מָּרַע] verb denominative act as leader, lead (?); — only Infinitive construct בִּפְרֹעַ Judges 5:2'
  - where: 'note 5:2 “When the locks grew long”'
    claim: 'A modern translation: When locks are long in Israel'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Judges+5&version=NRSVUE'
    quote: '2 “When locks are long in Israel,'
  - where: 'note 5:2 “When the locks grew long”'
    claim: 'Willingly offered themselves suggests, in a phrase Schade quotes (his note 69), dedication to the purposes of Yahweh; the people were blessed as the Lord raised judges'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'as the Lord poured out his spirit upon the judges whom he had raised up, the people were blessed in various measures. Under Deborah, many individuals “willingly offered themselves” (Judges 5:2, 9) to go to battle—the language of the text suggesting a “dedication to the purposes of Yahweh.”'
  - where: 'note 5:4 “The LORD marches from Sinai”'
    claim: 'Like Exodus 15, a classic divine-warrior text; the Lord marches like a commander through the Sinai wilderness with Israel as His army'
    key: ot-minute-judg-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-5'
    quote: 'The Song of Deborah, like the Song of the Sea at Exodus 15, is one of the classic examples of God being depicted as a divine warrior in the Bible. The opening of the song, for instance, depicts the Lord as marching like a military commander through the Sinai wilderness with Israel as His army (5:1–5).'
  - where: 'note 5:4 “The LORD marches from Sinai”'
    claim: 'Psalm 68:8 shares the wording of the march from Sinai (the Church footnotes 4a and 5b send 5:4–5 to Ps. 68:7–8)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/68?lang=eng'
    quote: 'The earth shook, the heavens also dropped at the presence of God: even Sinai itself was moved at the presence of God, the God of Israel.'
  - where: 'note 5:7 “A mother in Israel”'
    claim: 'Deborah is one of only two given the title mother in Israel'
    key: shannon-models-motherhood
    url: 'https://rsc.byu.edu/covenant-compassion/models-motherhood'
    quote: 'And she is one of only two individuals identified by the specific phrase “mother in Israel” (Judges 5:7).'
  - where: 'note 5:7 “A mother in Israel”'
    claim: 'Judges 4:4 names her husband; no evidence of children; the title is not to be reduced to having borne children'
    key: shannon-models-motherhood
    url: 'https://rsc.byu.edu/covenant-compassion/models-motherhood'
    quote: 'Although we cannot rule out that Deborah had children, we have no evidence from the biblical text itself. This means that we must be careful not to reduce Deborah’s statement that she is a mother in Israel to a declaration about her having borne biological children.'
  - where: 'note 5:7 “A mother in Israel”'
    claim: 'The title rests on her active role in leading, judging and delivering; she gave life by saving Israel'
    key: shannon-models-motherhood
    url: 'https://rsc.byu.edu/covenant-compassion/models-motherhood'
    quote: 'it seems that Deborah’s being a “mother in Israel” is not directly related to whether she has children but to her active role in leading, judging, and delivering Israel. … Deborah has given life to all the children of Israel by saving their lives'
  - where: 'note 5:7 “A mother in Israel”'
    claim: 'Singing the song may belong to her role as prophetess, as Miriam did in Exodus 15:20'
    key: shannon-models-motherhood
    url: 'https://rsc.byu.edu/covenant-compassion/models-motherhood'
    quote: 'This may be part of her role as a prophetess, as we see the prophetess Miriam doing something similar in Exodus 15:20.'
  - where: 'note 5:12 “Lead thy captivity captive”'
    claim: 'The phrase means lead captive thy captives, a verb with its cognate noun; compare Psalm 68'
    key: bdb
    url: 'https://biblehub.com/hebrew/7617.htm'
    quote: '2 with accusative of congnate meaning with verb שְׁבִי Judges 5:12 lead captive thy captives, compare Psalm 68:19'
  - where: 'note 5:12 “Lead thy captivity captive”'
    claim: 'The Hebrew of 5:12 has the verb and the noun from the same root'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'וּֽ/שֲׁבֵ֥ה'
  - where: 'note 5:12 “Lead thy captivity captive”'
    claim: 'A modern translation: lead away your captives'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Judges+5&version=NRSVUE'
    quote: 'Arise, Barak, lead away your captives,'
  - where: 'note 5:12 “Lead thy captivity captive”'
    claim: 'Paul quotes the line of Christ, who ascended (Eph. 4:7–8)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/eph/4?lang=eng'
    quote: 'Wherefore he saith, When he ascended up on high, he led captivity captive, and gave gifts unto men.'
  - where: 'note 5:16 “The tribes that stayed home”'
    claim: 'Reuben felt the call, held meetings and made resolutions, but stayed home; the question is amazement, ironic in the bleating instead of trumpets'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/5.htm'
    quote: 'They held meetings, passed great resolutions, but it led to no practical result; and at length they preferred to remain quietly at home in their own comfortable pastoral life.'
  - where: 'note 5:16 “The tribes that stayed home”'
    claim: 'The question about the sheepfolds is amazement; irony of the bleating in place of war trumpets'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/5.htm'
    quote: 'is an utterance of amazement; and the irony is very apparent in the next clause, to hear the bleating of the flocks, i.e., the piping of the shepherds, instead of the blast of the war-trumpets.'
  - where: 'note 5:16 “The tribes that stayed home”'
    claim: 'Another reading: soundings of heart among Reuben''s divisions, to find each other''s sentiments'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/5.htm'
    quote: 'Transl. Among the divisions of Reuben great were the soundings of heart, i.e. to find out one another’s sentiments.'
  - where: 'note 5:16 “The tribes that stayed home”'
    claim: 'The meaning of the word for sheepfolds is uncertain'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/5.htm'
    quote: '16. among the sheepfolds] Genesis 49:14, cf. Psalm 68:13; the meaning is uncertain'
  - where: 'note 5:21 “The stars and the river”'
    claim: 'The song has a miraculous flash flood of the Kishon that impeded the chariots; the prose only says the Lord threw the army into panic'
    key: ot-minute-judg-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-5'
    quote: 'the song depicted the Canaanites as being defeated as the result of a (miraculous) flash flood in the river of Kishon that appears to have impeded the Canaanite chariots (5:19–21). This detail is omitted in the prose version'
  - where: 'note 5:21 “The stars and the river”'
    claim: 'A terrible storm, rain flooding down the mountainside into the Kishon and over the plain'
    key: litchman-deborah
    url: 'https://www.churchofjesuschrist.org/study/ensign/1990/01/deborah-and-the-book-of-judges?lang=eng'
    quote: 'And the Lord went out before the Israelites with a terrible storm. Torrents of rain flooded down the mountainside, filling the Wadi Kishon and spilling over the plain'
  - where: 'note 5:23 “The curse on Meroz”'
    claim: 'Meroz probably lay on Sisera''s route; its Israelite people did not help; its site is unknown'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/5.htm'
    quote: 'Probably this village lay on the route of Sisera’s flight, and the inhabitants, though they were Israelites, made no effort to help their kinsmen in following up the victory. … The situation of Meroz is unknown.'
  - where: 'note 5:23 “The curse on Meroz”'
    claim: 'Jael is set against Meroz'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/5.htm'
    quote: 'The courageous devotion of Jael is set effectively against the unpatriotic selfishness of Meroz.'
  - where: 'note 5:23 “The curse on Meroz”'
    claim: 'Meroz might have destroyed Sisera in flight; the sense is evident from the blessing on Jael; not mentioned again; the curse is the angel''s because the angel fought for Israel at Megiddo'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/5.htm'
    quote: 'That this is the thought of Judges 5:23 is evident from the context, and more especially from the blessing pronounced upon Jael in Judges 5:24. The situation of Meroz, which is not mentioned again, cannot be determined with certainty'
  - where: 'note 5:23 “The curse on Meroz”'
    claim: 'The curse is given as the angel''s word because the angel of the Lord fought for Israel at Megiddo, and Meroz did not help Jehovah'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/5.htm'
    quote: 'The curse upon the inhabitants of this place is described as a word or command of the angel of the Lord, inasmuch as it was the angel of the Lord who fought for Israel at Megiddo'
  - where: 'note 5:24 “Jael blessed above women”'
    claim: 'Jael killed Sisera while he drank (5:24–27) or while he slept (Judg. 4)'
    key: bd-jael
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jael?lang=eng'
    quote: 'Sisera, Jabin’s captain, after his defeat took refuge in Jael’s tent and was killed by her either while he was drinking, as seems implied by Judg. 5:24–27, or while he lay asleep, according to the prose account in Judg. 4.'
  - where: 'note 5:24 “Jael blessed above women”'
    claim: 'Because of Barak''s hesitation the honor would go to Deborah and Jael'
    key: ot-minute-judg-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-4'
    quote: 'because of his initial hesitation, Deborah prophesied that the ultimate honor of victory would be credited not to him but to Deborah and Jael, a woman encountered later in the story.'
  - where: 'note 5:24 “Jael blessed above women”'
    claim: 'Deborah''s prophecy is fulfilled: the text credits Jael with slaying Sisera'
    key: ot-minute-judg-4
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-4'
    quote: 'True to Deborah’s prophecy, the text credits Jael with slaying Sisera, not Barak'
  - where: 'note 5:28 “Sisera''s mother at the window”'
    claim: 'Sisera''s mother appears only in the song, waiting in vain for his return'
    key: ot-minute-judg-5
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-5'
    quote: 'The poem also identifies a third character not mentioned in the prose account: Sisera’s mother, who is depicted at the end of the song as waiting in vain for her son’s return from the battle (5:28–30).'
  - where: 'note 5:28 “Sisera''s mother at the window”'
    claim: 'A modern translation: A woman or two for every man'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Judges+5&version=NRSVUE'
    quote: 'A woman or two for every man;'
  - where: 'note 5:28 “Sisera''s mother at the window”'
    claim: 'A study quoted by Schade: violence celebrated by Deborah and, in her own blind way, Sisera''s mother'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Violence is also wrought by women such as Jael and Delilah and even celebrated by women like Deborah and, in her own blind way, Sisera’s mother.'
  - where: christ
    claim: 'The song''s subject is Jehovah''s deliverance'
    key: shannon-models-motherhood
    url: 'https://rsc.byu.edu/covenant-compassion/models-motherhood'
    quote: 'The theme of Deborah’s Song is the deliverance of the Israelites through the divine intervention of Jehovah.'
  - where: christ
    claim: 'Jesus Christ is the Redeemer of Israel, always willing to deliver'
    key: cfm-ot-2026-22
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/22?lang=eng'
    quote: 'These stories remind us that no matter what has led us away from Jesus Christ, He is the Redeemer of Israel and is always willing to deliver us and welcome us back as we return to Him.'
  - where: christ
    claim: 'The song of the righteous is a prayer to the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/25?lang=eng'
    quote: 'For my soul delighteth in the song of the heart; yea, the song of the righteous is a prayer unto me, and it shall be answered with a blessing upon their heads.'
