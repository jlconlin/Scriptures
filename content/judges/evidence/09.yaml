chapter: 9
claims:
  - where: setting
    claim: 'Abimelech was Gideon''s son (8:31); he murders his brothers, is made king, sows Shechem with salt and is slain by a millstone; his name means Father-king'
    key: bd-abimelech
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abimelech?lang=eng'
    quote: 'Father-king. … (3) Son of Gideon (Judg. 8:31); murders his brethren and is made king (9:1–6); overcomes conspiracy and sows Shechem with salt (9:22–49); slain by a millstone (9:50–55; 2 Sam. 11:21).'
  - where: setting
    claim: 'As soon as Gideon was dead Israel made Baal-berith their god (8:33)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/8?lang=eng'
    quote: 'And it came to pass, as soon as Gideon was dead, that the children of Israel turned again, and went a whoring after Baalim, and made Baal-berith their god.'
  - where: setting
    claim: 'Shechem: the most ancient sacred town, near Ebal and Gerizim; Abram, Jacob, Joshua''s address, Joseph''s bones'
    key: bd-shechem
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shechem?lang=eng'
    quote: 'The most ancient of the sacred towns of the children of Israel, situated in a beautiful plain among the mountains of Ephraim, close to the two hills Ebal and Gerizim. … Here Joshua addressed the people (Josh. 24:1), and the bones of Joseph were buried (24:32).'
  - where: setting
    claim: 'The parable of Jotham was an earlier writing the compiler worked into the book'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: 'The compiler would have had available earlier writings that he worked into his book, such as the Song of Deborah, the parable of Jotham, and some of the utterances of Samson.'
  - where: setting
    claim: 'Gideon''s house was destined for tragedy; Judges 9 is painful to read'
    key: haws-better-way
    url: 'https://mi.byu.edu/old-testament-reflections/longing-for-a-better-way'
    quote: 'That house—that family—was destined for heartache and tragedy. Judges 9 is painful to read.'

  - where: thread
    claim: 'The chapter: Abimelech kills his brothers, Jotham rebukes his allies and prophesies their downfall, and the prediction is fulfilled in violence until Abimelech is killed'
    key: haws-better-way
    url: 'https://mi.byu.edu/old-testament-reflections/longing-for-a-better-way'
    quote: 'We have a son of Gideon—Abimelech—killing his brothers to consolidate power; a surviving youngest brother—Jotham—issuing a forceful rebuke of Abimelech’s allies and prophesying their downfall; and finally, in fulfillment of Jotham’s prediction, a region engulfed in violence and treachery until Abimelech is killed.'
  - where: thread
    claim: 'In Jotham''s application, fire goes forth both from Abimelech and from the Shechemites; the fulfilment was not long delayed'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/9.htm'
    quote: 'Not only will fire go forth from Abimelech and consume the lords of Shechem and the inhabitants of Millo, but fire will also go forth from them and devour Abimelech himself. The fulfilment of this threat was not long delayed, as the following history shows'
  - where: thread
    claim: 'Israel''s problem in this era lay within their own hearts, not in outside enemies'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'Jotham’s prophecy was uttered against his own brother, not against some Philistine king. Indeed, Israel’s problem did not stem from the pagan masses they faced. It lay within their own hearts.'

  - where: section 4 plain
    claim: 'The tower''s people took refuge in the hold of the temple of the covenant god; about a thousand died when Abimelech set it on fire'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/9.htm'
    quote: 'These branches they laid upon the hold, and set the hold on fire over them (the inhabitants of the tower who had taken refuge there), so that all the people of the tower of Shechem (about one thousand persons) perished, both men and women.'

  - where: 'note 9:1 “A son named Father-king”'
    claim: 'Abimelech means Father-king; son of Gideon (8:31)'
    key: bd-abimelech
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abimelech?lang=eng'
    quote: 'Father-king. … (3) Son of Gideon (Judg. 8:31); murders his brethren and is made king (9:1–6)'
  - where: 'note 9:1 “A son named Father-king”'
    claim: 'Gideon named his son Abimelech, “my father is king,” and he did become king; this undermines the picture of Gideon as a thorough anti-monarchist'
    key: goff-vox-populi
    url: 'https://journal.interpreterfoundation.org/vox-populi-and-vox-dei-allusive-explorations-of-biblical-and-book-of-mormon-politeias'
    quote: 'For one, Gideon names his son Abimelech, “my father is king,” and Abimelech (after some intrigue) does indeed become king for a short period (Judges 9:1–6, 22).'
  - where: 'note 9:5 “Upon one stone”'
    claim: 'One older reading: upon one stone, as if they were sacrificial victims; cf. 2 Kings 10 and 11 for this way of beginning a reign; Jotham escaped like Joash'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/9.htm'
    quote: 'upon one stone] as if they were sacrificial victims (cf. 1 Samuel 14:33 f.); perhaps also to avoid promiscuous blood-shed. For this Oriental manner of inaugurating a new reign cf. 2 Kings 10:1 ff; 2 Kings 11:1. Jotham escaped, like Joash 2 Kings 11:2.'
  - where: 'note 9:5 “Upon one stone”'
    claim: 'Another older reading: a formal execution; the money came from the temple treasury of the covenant Baal; vain and light = men without moral restraint, hot and desperate'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/9.htm'
    quote: 'They gave him seventy shekels of silver from the house of Baal-berith, i.e., from the treasury of the temple that was dedicated to the covenant Baal at Shechem … "Upon (against) one stone," that is to say, by a formal execution'

  - where: 'note 9:6 “Crowned by the oak and the pillar”'
    claim: 'The pillar was probably the memorial stone under the oak at Shechem; the Baal worshipers crowned Abimelech in the very place where Joshua had renewed Israel''s covenant with Jehovah; the temple of Baal-berith was probably there'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/9.htm'
    quote: 'here it probably denotes the large stone set up as a memorial at Shechem under the oak or terebinth (see Genesis 35:4). The inhabitants of Shechem, the worshippers of Baal-berith, carried out the election of Abimelech as king in the very same place in which Joshua had held the last national assembly'
  - where: 'note 9:6 “Crowned by the oak and the pillar”'
    claim: 'Keil continues: there Joshua renewed the covenant with Jehovah (Josh. 24:1, 25–26), and there probably stood the temple of Baal-berith'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/9.htm'
    quote: 'and had renewed the covenant of Israel with Jehovah the true covenant God (Joshua 24:1, Joshua 24:25-26). It was there in all probability that the temple of Baal-berith was to be found'
  - where: 'note 9:6 “Crowned by the oak and the pillar”'
    claim: 'The Church footnote gives “plain” as terebinth tree in Hebrew'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/9?lang=eng'
    quote: '“plain”: HEB terebinth tree.'

  - where: 'note 9:8 “The trees that would not be king”'
    claim: 'The manual reads the trees as Israel''s leaders, the faithful trees as Gideon''s sons, the bramble as Abimelech'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'In the parable there were trees (leaders of Israel) who wanted a king among them (Gideon was offered the chance to become king). None of the faithful trees (sons of Gideon) would accept the crown'
  - where: 'note 9:8 “The trees that would not be king”'
    claim: 'The manual: the kingmakers asked the miserable bramble (Abimelech, son of a concubine)'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'Finally, the kingmakers asked the miserable bramble bush (Abimelech, son of a concubine wife) to reign over the trees.'
  - where: 'note 9:8 “The trees that would not be king”'
    claim: 'The manual: one of the few parables in the Old Testament, given from Mount Gerizim'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'Upon the eight-hundred-foot high Mount Gerizim, Jotham delivered to the men of Shechem a very interesting parable, one of the few parables recorded in the Old Testament.'
  - where: 'note 9:8 “The trees that would not be king”'
    claim: 'Skinner: the olive tree had pride of place because it was used to worship God and to sustain man'
    key: skinner-autumn-olives
    url: 'https://rsc.byu.edu/vol-1-no-1-2000/autumn-olives-atonement'
    quote: 'As reflected in this passage, one of the reasons the olive tree was foremost among all others was because it was used to worship God as well as to sustain man.'
  - where: 'note 9:8 “The trees that would not be king”'
    claim: 'The Church footnote to “God and man” in verse 9: Hebrew gods and men, i.e., in ritual services'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/9?lang=eng'
    quote: '“God and man”: HEB gods and men; i.e., in ritual services.'
  - where: 'note 9:8 “The trees that would not be king”'
    claim: 'Gerizim is the mount of blessing in Deut. 11:29, where the Church footnote to verse 7 points'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/9?lang=eng'
    quote: '“Gerizim”: Deut. 11:29.'

  - where: 'note 9:15 “Shade from a bramble”'
    claim: 'Keil: the briar casts no shadow to lie down in; “trust in my shadow” is deep irony; fire from the briar consumes the cedars; the most worthless can harm the mightiest'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/9.htm'
    quote: 'The briar, which has nothing but thorns upon it, and does not even cast sufficient shadow for any one to lie down in its shadow and protect himself from the burning heat of the sun, is an admirable simile for a worthless man, who can do nothing but harm.'
  - where: 'note 9:15 “Shade from a bramble”'
    claim: 'Keil: irony of the shadow; thorns easily catch fire'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/9.htm'
    quote: 'The words of the briar, "Trust in my shadow," seek refuge there, contain a deep irony, the truth of which the Shechemites were very soon to discover. … Thorns easily catch fire (see Exodus 22:5).'
  - where: 'note 9:15 “Shade from a bramble”'
    claim: 'Keil: Jotham''s “if ye have acted in truth … then rejoice” is the bitterest scorn; only the fire could follow'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/9.htm'
    quote: 'this turn contains the bitterest scorn at the faithlessness manifested towards Jerubbaal. In that case nothing could follow but the fulfilment of the threat and the bursting forth of the fire.'
  - where: 'note 9:15 “Shade from a bramble”'
    claim: 'The manual: Jotham prophesied, and the prophecy was completely fulfilled in 9:22–57'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'Jotham then prophesied that the people would eventually desire to destroy Abimelech (see v. 20). For the details of how completely Jotham’s prophecy was fulfilled, see Judges 9:22–57.'

  - where: 'note 9:22 “King, or only ruler?”'
    claim: 'BDB lists the verb of 9:22 (wayyāśar) under a verb meaning be or act as prince, rule, with Isa. 32:1'
    key: bdb
    url: 'https://biblehub.com/hebrew/7786.htm'
    quote: 'Qal Imperfect3masculine singular וַיָּ֫שַׂר עַלֿ יִשְׂרָאֵל Judges 9:22 Abimelech ruled over Israel three years'
  - where: 'note 9:22 “King, or only ruler?”'
    claim: 'The Hebrew of 9:22 has wayyāśar (H7786)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'יָּ֧שַׂר'
  - where: 'note 9:22 “King, or only ruler?”'
    claim: 'Goff: the Bible says Abimelech was made king and reigned three years; Jotham calls him king'
    key: goff-vox-populi
    url: 'https://journal.interpreterfoundation.org/vox-populi-and-vox-dei-allusive-explorations-of-biblical-and-book-of-mormon-politeias'
    quote: 'To the contrary, the Bible asserts that Abimelech was made king (Judges 9:16) and reigned three years (Judges 9:22). And Jotham, Abimelech’s half brother, uses the word king in his parable'
  - where: 'note 9:22 “King, or only ruler?”'
    claim: 'Goff: had Israel heeded the Gideon/Abimelech warning, they would not have asked for a king like the nations, when God was already their king'
    key: goff-vox-populi
    url: 'https://journal.interpreterfoundation.org/vox-populi-and-vox-dei-allusive-explorations-of-biblical-and-book-of-mormon-politeias'
    quote: 'Had the Israelites heeded the Gideon/Abimelech warning narrative, they would have known better than to request a king like all the nations, when they already had God as their king.'
  - where: 'note 9:22 “King, or only ruler?”'
    claim: 'The Bible Dictionary''s table counts the three years as Abimelech''s rule'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: 'Abimelech’s rule (9:22) | 3'

  - where: 'note 9:23 “An evil spirit from God”'
    claim: 'The Joseph Smith Translation of 1 Sam. 16:14 reads “which was not of the Lord”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/16?lang=eng'
    quote: '“from the Lord”: JST 1 Sam. 16:14 … which was not of the Lord …'
  - where: 'note 9:23 “An evil spirit from God”'
    claim: 'The Joseph Smith Translation of 1 Sam. 16:15 reads “which is not of God”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/16?lang=eng'
    quote: '“from God”: JST 1 Sam. 16:15 … which is not of God …'
  - where: 'note 9:23 “An evil spirit from God”'
    claim: 'The Church footnote to “sent” points to 9:56–57'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/9?lang=eng'
    quote: '“sent”: Judg. 9:57 (56–57).'

  - where: 'note 9:53 “A woman and a millstone”'
    claim: 'The manual sets Abimelech''s request beside Zebah and Zalmunna''s, who wanted to die by a great warrior''s hand to keep their honor (8:21)'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'To have a boy slay them would be a great dishonor, but to die quickly under the hand of such a great warrior as Gideon would preserve their honor. Compare this request with Abimelech’s request of his armor-bearer to slay him lest men say a woman had killed him'
  - where: 'note 9:53 “A woman and a millstone”'
    claim: 'The Bible Dictionary: slain by a millstone, with 2 Sam. 11:21'
    key: bd-abimelech
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abimelech?lang=eng'
    quote: 'slain by a millstone (9:50–55; 2 Sam. 11:21).'

  - where: 'note 9:56 “Thus God rendered”'
    claim: 'Haws: the violence and treachery were the fulfillment of Jotham''s prediction'
    key: haws-better-way
    url: 'https://mi.byu.edu/old-testament-reflections/longing-for-a-better-way'
    quote: 'and finally, in fulfillment of Jotham’s prediction, a region engulfed in violence and treachery until Abimelech is killed.'
  - where: 'note 9:56 “Thus God rendered”'
    claim: 'Haws asks whether Gideon''s deadly retribution reverberated through the next generation'
    key: haws-better-way
    url: 'https://mi.byu.edu/old-testament-reflections/longing-for-a-better-way'
    quote: 'Was his initial impulse to spare Zebah and Zalmunna one that he ignored at a severe cost in the way this example of deadly retribution would reverberate through the next generation? What did his descendants, his comrades, come to understand about violence?'

  - where: christ
    claim: 'Goff: Israel already had God as their king'
    key: goff-vox-populi
    url: 'https://journal.interpreterfoundation.org/vox-populi-and-vox-dei-allusive-explorations-of-biblical-and-book-of-mormon-politeias'
    quote: 'when they already had God as their king.'
  - where: christ
    claim: 'The manual: the problem lay within their own hearts; their greatest enemies were inward'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'It lay within their own hearts. Their greatest enemies were not the power-hungry Midianites or Moabites but inward vacillation, apathy, disobedience, and rebellion.'
  - where: christ
    claim: 'Haws: the patterns we transmit to those watching us most closely'
    key: haws-better-way
    url: 'https://mi.byu.edu/old-testament-reflections/longing-for-a-better-way'
    quote: 'What are the patterns we are transmitting to those who are watching us most closely?'

  - where: 'note 9:15 “Shade from a bramble”'
    claim: 'Keil: the cedars are the largest and noblest trees; the most worthless man can harm the mightiest'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/9.htm'
    quote: 'consume the cedars of Lebanon, the largest and noblest trees. Thorns easily catch fire (see Exodus 22:5). The most insignificant and most worthless man can be the cause of harm to the mightiest and most distinguished.'
  - where: 'note 9:5 “Upon one stone”'
    claim: 'Keil: seventy is the total; with Jotham''s escape, sixty-nine were put to death'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/9.htm'
    quote: 'The number seventy, the total number of his brethren, is reduced by the exception mentioned immediately afterwards to sixty-nine who were really put to death.'
  - where: 'note 9:53 “A woman and a millstone”'
    claim: 'The Church footnote to verse 53 points to 2 Sam. 11:21'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/9?lang=eng'
    quote: '“Abimelech’s”: 2 Sam. 11:21.'
  - where: 'note 9:56 “Thus God rendered”'
    claim: 'The Church footnote to “evil” in verse 57 points back to 9:23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/9?lang=eng'
    quote: '“evil”: Judg. 9:23.'

