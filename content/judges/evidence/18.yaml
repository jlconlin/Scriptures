chapter: 18
claims:
  - where: setting
    claim: 'Dan''s district was small but well placed; the tribe had difficulty holding it against Amorites and Philistines'
    key: bd-dan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dan?lang=eng'
    quote: 'the district assigned to the tribe of Dan was small in area but had an admirable situation, adjoining Ephraim, Benjamin, and Judah, parts of it being extremely fertile (Josh. 19:40–48). There was a good deal of difficulty in holding it against the Amorites (Judg. 1:34) and against the Philistines'
  - where: setting
    claim: 'The Danites found an inheritance at the headwaters of the Jordan'
    key: ot-manual-judges-13-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-13-21-ruth-1-4-the-reign-of-the-judges-part-2?lang=eng'
    quote: 'They finally found an inheritance at the headwaters of the Jordan River.'
  - where: setting
    claim: 'Laish is the Leshem of Joshua 19:47'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/18.htm'
    quote: 'Thus the five men proceeded to Laish, which is called Leshem in Joshua 19:47, and was named Dan after the conquest by the Danites'
  - where: setting
    claim: 'Dan became the northern limit (from Dan to Beer-sheba) and the site of Jeroboam''s calf worship'
    key: bd-dan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dan?lang=eng'
    quote: 'This town is well known as the northern limit of Palestine, which extended “from Dan even to Beer-sheba.” It was chosen by Jeroboam as one of the places in which to establish the calf worship for the northern tribes'
  - where: setting
    claim: 'The Bible Dictionary takes 18:30 as a reference to the captivity of the ten tribes and the book as compiled long after'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: 'The book was compiled long after the events it records; in 18:30 there is a reference to the captivity of the ten tribes.'

  - where: thread
    claim: 'One older reading: the purpose of the story is to trace the origin of the sanctuary at Dan'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/18.htm'
    quote: 'The object of the whole story has been to trace the origin of the famous sanctuary at Dan.'
  - where: thread
    claim: 'Micah called his images gods without necessarily implying another God than Jehovah'
    key: pulpit-judges
    url: 'https://biblehub.com/commentaries/pulpit/judges/18.htm'
    quote: 'Micah was thinking of the molten and graven images, and the teraphim, and called them gods, without perhaps meaning to imply that there was any God but Jehovah.'
  - where: thread
    claim: 'The chapter''s own words: no king, the oracle, the taking of the images, Micah''s lament, Laish quiet and secure, no deliverer, the image set up while the house of God was in Shiloh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/18?lang=eng'
    quote: 'And they set them up Micah’s graven image, which he made, all the time that the house of God was in Shiloh.'

  - where: section 1 plain
    claim: '“Before the LORD is your way” means under His favourable regard'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/18.htm'
    quote: '6. before the Lord] i.e. under His favourable regard.'
  - where: section 5 plain
    claim: 'The Hebrew read Moses, altered to Manasseh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/18?lang=eng'
    quote: '30a “Manasseh”: HEB Moses, altered to Manasseh. See Ex. 2:22; 18:3.'

  - where: 'note 18:1 “A tribe that could not hold its lot”'
    claim: 'Dan''s district was small but well placed and fertile; difficulty holding it against Amorites (1:34) and Philistines (13:2)'
    key: bd-dan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dan?lang=eng'
    quote: 'was small in area but had an admirable situation, adjoining Ephraim, Benjamin, and Judah, parts of it being extremely fertile (Josh. 19:40–48). There was a good deal of difficulty in holding it against the Amorites (Judg. 1:34) and against the Philistines (Judg. 13:2, 25; 18:1).'
  - where: 'note 18:1 “A tribe that could not hold its lot”'
    claim: 'The verse says Dan sought an inheritance because all had not fallen to it'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/18?lang=eng'
    quote: 'the tribe of the Danites sought them an inheritance to dwell in; for unto that day all their inheritance had not fallen unto them among the tribes of Israel.'

  - where: 'note 18:6 “An oracle from a hired priest”'
    claim: 'The inquiry of God, as in Judg. 1:1, was made here through the imitation ephod and image; “before Jehovah” means known and well-pleasing to Him'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/18.htm'
    quote: 'used for asking the will of God, as in Judges 1:1, except that here the inquiry was made through the medium of the imitation of the ephod and the worship of an image. … "Go in peace; straight before Jehovah is your way," i.e., it is known and well-pleasing to Him'
  - where: 'note 18:6 “An oracle from a hired priest”'
    claim: 'Bishop Patrick, as quoted in the Pulpit Commentary: whether the priest had an answer or feigned it is uncertain'
    key: pulpit-judges
    url: 'https://biblehub.com/commentaries/pulpit/judges/18.htm'
    quote: '"Whether," says Bishop Patrick, "he had any answer from the teraphim, or feigned it out of his own head, is uncertain."'
  - where: 'note 18:6 “An oracle from a hired priest”'
    claim: 'The spies report that God has given the land into their hands'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/18?lang=eng'
    quote: 'When ye go, ye shall come unto a people secure, and to a large land: for God hath given it into your hands'

  - where: 'note 18:27 “A quiet people, and no deliverer”'
    claim: 'Laish lived like the Sidonians, by trade, not war; far from Sidon''s help; probably a Sidonian colony'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/18.htm'
    quote: 'dwelling securely after the manner of the Sidonians, who lived by trade and commerce, and did not go out to war. … so that in the event of a hostile invasion they could not obtain any assistance from this powerful city. Grotius draws the very probable conclusion from these words, that Laish may have been a colony of the Sidonians.'
  - where: 'note 18:27 “A quiet people, and no deliverer”'
    claim: 'One older reading: the repeated “quiet and secure” shows the writer''s reprobation of the deed, like Simeon and Levi at Shechem'
    key: pulpit-judges
    url: 'https://biblehub.com/commentaries/pulpit/judges/18.htm'
    quote: 'The repetition of the epithets quiet and secure, as applied to the people of Laish, rather seems to indicate the writer''s reprobation of the deed as cruel, like that of Simeon and Levi in slaying Hamor and Shechem.'
  - where: 'note 18:27 “A quiet people, and no deliverer”'
    claim: 'Verse 28: there was no deliverer, far from Zidon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/18?lang=eng'
    quote: 'And there was no deliverer, because it was far from Zidon, and they had no business with any man'

  - where: 'note 18:29 “Dan, the northern edge of Israel”'
    claim: 'Dan the northern limit, “from Dan even to Beer-sheba”'
    key: bd-dan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dan?lang=eng'
    quote: 'This town is well known as the northern limit of Palestine, which extended “from Dan even to Beer-sheba.”'
  - where: 'note 18:29 “Dan, the northern edge of Israel”'
    claim: 'Dan son of Bilhah; Jeroboam chose Dan for calf worship'
    key: bd-dan
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/dan?lang=eng'
    quote: 'Son of Bilhah, Rachel’s maid, and brother to Naphtali. … It was chosen by Jeroboam as one of the places in which to establish the calf worship for the northern tribes (1 Kgs. 12:29; 2 Kgs. 10:29).'
  - where: 'note 18:29 “Dan, the northern edge of Israel”'
    claim: 'The city was named Dan after their father; it was Laish at first'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/18?lang=eng'
    quote: 'And they called the name of the city Dan, after the name of Dan their father, who was born unto Israel: howbeit the name of the city was Laish at the first.'

  - where: 'note 18:30 “Moses’ descendant, written as Manasseh”'
    claim: 'The Church''s footnote: the Hebrew had Moses, altered to Manasseh; Gershom at Ex. 2:22'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/18?lang=eng'
    quote: '30a “Manasseh”: HEB Moses, altered to Manasseh. See Ex. 2:22; 18:3.'
  - where: 'note 18:30 “Moses’ descendant, written as Manasseh”'
    claim: 'The n is suspended above the line, turning Mosheh into Manasseh; Jews admit the alteration to repudiate the Levite''s claim; the Vulgate reads Moses'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/18.htm'
    quote: 'in the Hebr. text the letter n is ‘suspended,’ or inserted above the line, thus turning Mosheh (משה) into Manasseh (מנשה). The Jews admit that the text was altered in order to repudiate the Levite’s claim … the Vulgate Moysi'
  - where: 'note 18:30 “Moses’ descendant, written as Manasseh”'
    claim: 'The Talmud: assigned to Manasseh because he did the deeds of Manasseh; Jonathan is Micah''s Levite'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/18.htm'
    quote: 'Jehonathan can hardly be any other than this Levite. … but because he did the deeds of Manasseh (the idolatrous son of Hezekiah, 2 Kings 21) the Scripture assigns him to the family of Manasseh.'
  - where: 'note 18:30 “Moses’ descendant, written as Manasseh”'
    claim: '“Son” may mean grandson, since genealogies pass over fathers and Jonathan is called a young man'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/18.htm'
    quote: 'ben frequently denotes a grandson in such genealogical accounts, unknown fathers being passed over in the genealogies. … he is described as נער in Judges 17:7; Judges 18:3, Judges 18:15, and therefore was at any rate a young man'

  - where: 'note 18:30 “Until the captivity, while Shiloh stood”'
    claim: 'The Bible Dictionary: 18:30 refers to the captivity of the ten tribes; the book compiled long after'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: 'The book was compiled long after the events it records; in 18:30 there is a reference to the captivity of the ten tribes.'
  - where: 'note 18:30 “Until the captivity, while Shiloh stood”'
    claim: 'The captivity of the north under Tiglath-pileser or after the fall of Samaria'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/18.htm'
    quote: 'Either the captivity of N. Israel under Tiglath-pileser in 734 b.c., 2 Kings 15:29; or the exile after the fall of Samaria in 722 b.c.'
  - where: 'note 18:30 “Until the captivity, while Shiloh stood”'
    claim: 'Verse 31 cannot be reconciled with the Assyrian captivity; the tabernacle was at Nob by Saul''s time'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/18.htm'
    quote: 'But the statement in Judges 18:31, "And they set them up Micah''s graven image, which he made, all the time that the house of God was in Shiloh," is by no means reconcilable with such a conclusion. … but in the time of Saul it was at Nob'
  - where: 'note 18:30 “Until the captivity, while Shiloh stood”'
    claim: 'One older reading: the captivity is the carrying away of the ark (1 Sam. 4:21–22); Psalm 78:59–64'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/18.htm'
    quote: 'David Kimchi and many others have interpreted the expression as relating to the carrying away of the ark by the Philistines, for which the words מיּשׂראל כבוד גּלה are used in 1 Samuel 4:21-22 … With the carrying away of the ark of the covenant, the tabernacle lost its significance as a sanctuary of Jehovah. We learn from Psalm 78:59-64'
  - where: 'note 18:30 “Until the captivity, while Shiloh stood”'
    claim: 'The verb of “the captivity” in 18:30 and of “departed” in 1 Sam. 4:21–22 is galah, go into exile'
    key: bdb
    url: 'https://biblehub.com/hebrew/1540.htm'
    quote: '3 go into exile Judges 18:30; 2 Kings 17:23; … גלה כבוד 1 Samuel 4:21,22'
  - where: 'note 18:30 “Until the captivity, while Shiloh stood”'
    claim: 'The Church''s footnote at 18:31 points to Ps. 78:60'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/18?lang=eng'
    quote: '31b “Shiloh”: Ps. 78:60.'

  - where: christ
    claim: 'A Levite''s work was to assist the priests, not to be one'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'The work of the Levites was to assist the priests (Num. 3:5–10; 18:1–7).'
  - where: christ
    claim: 'No man takes the priesthood to himself but one called of God, as Aaron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/5?lang=eng'
    quote: 'And no man taketh this honour unto himself, but he that is called of God, as was Aaron.'
  - where: christ
    claim: 'The fifth article of faith on being called of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng'
    quote: 'We believe that a man must be called of God, by prophecy, and by the laying on of hands by those who are in authority, to preach the Gospel and administer in the ordinances thereof.'

  - where: explore
    claim: 'Jeroboam set a calf at Dan with priests not of Levi'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/18.htm'
    quote: 'he had two golden calves made as images of Jehovah for the subjects of his kingdom, and set up one of them at Dan, and appointed priests out of the whole nation who were not of the sons of Levi.'
