chapter: 8
claims:
  - where: setting
    claim: 'Succoth lay on the eastern side of the Jordan valley, south of the Jabbok (Gen. 33:17)'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/8.htm'
    quote: 'Succoth was upon the eastern side of the valley of the Jordan (Joshua 13:27), not opposite to Bethshean, but, according to Genesis 33:17, on the south side of the Jabbok (Zerka).'
  - where: setting
    claim: 'Penuel is the place where Jacob wrestled; the eastern tribes were most exposed to Midian''s raids'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'The people of Penuel (the place where Jacob had stopped many years before and wrestled with God’s messenger [see Genesis 32:31]), also refused aid. … Gad and the other tribes east of the Jordan were most vulnerable to their marauding raids.'
  - where: setting
    claim: 'The Church footnote to Zebah in verse 5 points to Psalm 83:11'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/8?lang=eng'
    quote: '“Zebah”: Ps. 83:11.'
  - where: setting
    claim: 'Abimelech, son of Gideon (8:31), murders his brothers and is made king in chapter 9; the name means Father-king'
    key: bd-abimelech
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abimelech?lang=eng'
    quote: '(3) Son of Gideon (Judg. 8:31); murders his brethren and is made king (9:1–6)'

  - where: thread
    claim: 'The narrator ascribes none of the events of Judges 8 to the Lord; Gideon himself assumes the Lord''s backing (8:7)'
    key: haws-better-way
    url: 'https://mi.byu.edu/old-testament-reflections/longing-for-a-better-way'
    quote: 'the Lord—as agent, as driver, as commander—is absent in Judges 8. The narrator does not ascribe any of the events that follow to the Lord’s guidance or volition.'
  - where: thread
    claim: 'Gideon''s story ends on an ambivalent note: his own apostasy, yet a somewhat positive eulogy; the text stops short of calling him wicked'
    key: ot-minute-judg-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-8'
    quote: 'Gideon’s time as a judge in Israel ends in Judges 8 on a rather ambivalent note. … The text does not totally condemn him, stopping just short of calling him wicked outright'
  - where: thread
    claim: 'The verb of “the land had rest” (3:11, 30; 5:31) is the verb of “the country was in quietness” at 8:28, and 8:28 is its last use of the land''s rest in Judges (18:7, 27 use it of Laish)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'וַ/תִּשְׁקֹ֥ט'

  - where: section 2 plain
    claim: 'The Hebrew of verse 16 says he “made them know,” i.e., made them feel, punished them'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/8.htm'
    quote: '"And he taught the men of Succoth (i.e., caused them to know, made them feel, punished them) with them (the thorns)."'

  - where: 'note 8:2 “The gleaning and the vintage”'
    claim: 'Ephraim chided from injured pride, as a tribe striving for leadership; the gleaning is Ephraim''s victory over the fleeing Midianites, the vintage Gideon''s with his 300; Ephraim had slain two princes; Isaiah 10:26 remembers it'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/8.htm'
    quote: 'less from any dissatisfied longing for booty, than from injured pride or jealousy, because Gideon had made war upon the enemy and defeated them without the co-operation of this tribe, which was striving for the leadership. … The gleaning of Ephraim is the victory gained over the flying Midianites.'
  - where: 'note 8:2 “The gleaning and the vintage”'
    claim: 'The Ephraimites'' victory was mentioned by Isaiah as a great blow of the Lord upon Midian'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/8.htm'
    quote: 'because the Ephraimites had slain two Midianitish princes. The victory gained by the Ephraimites must indeed have been a very important one, as it is mentioned by Isaiah (Isaiah 10:26) as a great blow of the Lord upon Midian.'

  - where: 'note 8:6 “Why Succoth and Penuel refused”'
    claim: 'Succoth was a town of Gad east of the Jordan; they refused because the kings were not yet taken; perhaps afraid; the episode shows the fragmentation of apostate Israel'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'Perhaps they were afraid that Gideon would fail to capture and subdue the fleeing kings and that later the Midianites would return and punish them for aiding Gideon. Whatever the reason, these events illustrate the tragic fragmentation of apostate Israel.'
  - where: 'note 8:6 “Why Succoth and Penuel refused”'
    claim: 'The manual holds the punishment justified, the refusal being equivalent to high treason'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'Such harsh punishment was justified because in their refusal to help Gideon’s army, Succoth and Penuel threatened the whole nation of Israel. Their act was thus equivalent to high treason.'
  - where: 'note 8:6 “Why Succoth and Penuel refused”'
    claim: 'Haws: the towns'' wait-and-see attitude was insulting, but he asks whether it justified the revenge'
    key: haws-better-way
    url: 'https://mi.byu.edu/old-testament-reflections/longing-for-a-better-way'
    quote: 'Their (Succoth’s and Penuel’s) cool, wait-and-see attitude toward Gideon’s exploits would have been insulting and infuriating, but would that justify Gideon’s return-for-revenge mission'

  - where: 'note 8:10 “A hundred and twenty thousand”'
    claim: 'The number at face value is implausibly large; either the narrator''s exaggeration for effect, or ʾelef as a military unit of undefined size'
    key: ot-minute-judg-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-8'
    quote: 'The number as it stands at face value is implausibly inflated. … Alternatively, it could be that the Hebrew ‘elef, commonly translated as “one thousand,” actually describes a military unit of an undefined number of soldiers'
  - where: 'note 8:10 “A hundred and twenty thousand”'
    claim: 'The word in verse 10 is ʾelef'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'אֶ֔לֶף'

  - where: 'note 8:16 “Taught, or threshed?”'
    claim: 'The Hebrew of verse 16 is wayyōdaʿ, a form of yādaʿ, “know”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'וַ/יֹּ֣דַע'
  - where: 'note 8:16 “Taught, or threshed?”'
    claim: 'BDB lists the form at Judges 8:16 under the causative of yādaʿ'
    key: bdb
    url: 'https://biblehub.com/hebrew/3045.htm'
    quote: 'Hiph`il Perfect הוֺדִיעַ Psalm 98:2 … וַיֹּדַע Judges 8:16'
  - where: 'note 8:16 “Taught, or threshed?”'
    claim: 'The threat of verse 7 uses dûš, tread or thresh; BDB proposes reading the same verb in verse 16'
    key: bdb
    url: 'https://biblehub.com/hebrew/1758.htm'
    quote: 'tread or thresh Judges 8:7 with (אֶת = together with … ) thorns, קוֺצִים and בַּרְקָנִים q. v.; and also in Judges 8:16 (read וידשׁ compare above)'
  - where: 'note 8:16 “Taught, or threshed?”'
    claim: 'The Septuagint reads “tore” in verse 16'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/judges/8.htm'
    quote: '16And he took the elders of the city with the thorns of the wilderness and the Barkenim, and with them he tore the men of the city.'

  - where: 'note 8:19 “Gideon’s brothers”'
    claim: 'To die by a great warrior''s hand preserved the kings'' honor'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'To have a boy slay them would be a great dishonor, but to die quickly under the hand of such a great warrior as Gideon would preserve their honor.'
  - where: 'note 8:19 “Gideon’s brothers”'
    claim: 'Haws: an earlier offense may have been festering in Gideon and driving revenge; he asks how it affected his son'
    key: haws-better-way
    url: 'https://mi.byu.edu/old-testament-reflections/longing-for-a-better-way'
    quote: 'We learn that a memory of an even earlier offense may have been festering in Gideon—may have been driving a desire for revenge in this case. … How might this have affected his son?'
  - where: 'note 8:19 “Gideon’s brothers”'
    claim: 'Haws asks whether this deadly retribution reverberated through the next generation'
    key: haws-better-way
    url: 'https://mi.byu.edu/old-testament-reflections/longing-for-a-better-way'
    quote: 'Was his initial impulse to spare Zebah and Zalmunna one that he ignored at a severe cost in the way this example of deadly retribution would reverberate through the next generation?'

  - where: 'note 8:23 “The LORD shall rule over you”'
    claim: 'The manual: by refusing, Gideon reminded Israel where the source of victory lay and whom to view as king'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'Had he consented, Gideon would have been lending support to the idea that through his own power he had won the battle. By refusing their request, Gideon reminded them where the real source of their victory lay and whom they should view as their king.'
  - where: 'note 8:23 “The LORD shall rule over you”'
    claim: 'Schade: Israel''s rejection of God as king and judge led to the unraveling of society'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'It was their breach of his designs —their immediate rejection of God as their king and judge, along with his laws and covenants—that led to the unraveling of society.'
  - where: 'note 8:23 “The LORD shall rule over you”'
    claim: 'Younger, quoted in Schade: Gideon rightly refused; Judges is a call to acknowledge the Lord''s kingship (1 Sam. 8:7)'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Gideon rightly told the Israelites that he would not rule over them, “the Lord will rule over you” (8:23). … In a real sense, the book of Judges is a prophetic call to acknowledge the kingship of the Lord, the true King and Judge of Israel.'

  - where: 'note 8:24 “Midianites called Ishmaelites”'
    claim: 'The enemy had golden rings, so the Israelites got an abundance of them as booty'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/8.htm'
    quote: '"for they (the enemy) had golden rings, for they were Ishmaelites," from whom therefore the Israelites were able to get an abundance of rings as booty.'
  - where: 'note 8:24 “Midianites called Ishmaelites”'
    claim: 'Genesis 37:28, 36 call the traders who took Joseph both Ishmeelites and Midianites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/37?lang=eng'
    quote: 'Then there passed by Midianites merchantmen; and they drew and lifted up Joseph out of the pit, and sold Joseph to the Ishmeelites'
  - where: 'note 8:24 “Midianites called Ishmaelites”'
    claim: 'Ishmaelites is the general name for the nomad tribes of Arabia, to whom Midian belonged, as in Genesis 37:25'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/8.htm'
    quote: 'Ishmaelites is the general name for the nomad tribes of Arabia, to whom the Midianites also belonged (as in Genesis 37:25).'

  - where: 'note 8:27 “The ephod that became a snare”'
    claim: 'Scripture Helps: an ephod was high-priestly clothing, sometimes used to seek God''s direction; Gideon may have meant a memorial; Israel treated it as an idol'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'An ephod was part of a high priest’s clothing and was occasionally used by some as a means to seek God’s direction. In making an ephod from the spoils of war, Gideon may have intended to make a fitting memorial honoring God’s part in the victory.'
  - where: 'note 8:27 “The ephod that became a snare”'
    claim: 'The ephod became an object of idolatrous worship; the name may there denote an image'
    key: bd-ephod
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ephod?lang=eng'
    quote: 'The ephod at one time became the object of idolatrous worship (Judg. 8:27; 17:5). The name may possibly in these last passages have been used to denote an image of some kind.'
  - where: 'note 8:27 “The ephod that became a snare”'
    claim: 'With the gold he made some sort of idol and perhaps unintentionally led the people into idolatry'
    key: bd-gideon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gideon?lang=eng'
    quote: 'With the gold captured from the Midianites he made some sort of idol, called an Ephod, and so, perhaps unintentionally, led the people into idolatry.'
  - where: 'note 8:27 “The ephod that became a snare”'
    claim: 'Keil: the ephod was the high priest''s dress with the breastplate and Urim and Thummim; Gideon sought to keep the standing to which the Lord had called him'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/8.htm'
    quote: 'but he yielded to another temptation, which this appeal on the part of the people really involved, namely, the temptation to secure to himself for the future the position to which the Lord had called and exalted him.'
  - where: 'note 8:27 “The ephod that became a snare”'
    claim: 'Smoot: a divinatory object; unclear if like the high priest''s; darkly ironic, Gideon fell prey to what he sought to destroy'
    key: ot-minute-judg-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-8'
    quote: 'With this he made an ephod, a sort of divinatory object (verse 27). Whether this was similar to the high priest’s ephod[2] or merely a different object with the same name is unclear. In any case, the narrator portrays this action in a negative and darkly ironic light'
  - where: 'note 8:27 “The ephod that became a snare”'
    claim: 'Haws: the man who began by tearing down a shrine became the maker of an object that proved some kind of idol'
    key: haws-better-way
    url: 'https://mi.byu.edu/old-testament-reflections/longing-for-a-better-way'
    quote: 'Gideon, this man who started down his path to become a deliverer of Israel by tearing down a shrine dedicated to false gods (Judges 6:27–32 ), now became the creator of an object that would prove to be some kind of idol itself'
  - where: 'note 8:27 “The ephod that became a snare”'
    claim: 'The Church footnote to “snare” points to Exodus 23:33'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/8?lang=eng'
    quote: '“snare”: Ex. 23:33.'

  - where: 'note 8:33 “Baal of the covenant”'
    claim: 'Schade: the few uses of ḥesed in Judges describe broken covenantal treatment, as in the disloyalty to Gideon''s family (8:33–35)'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Tellingly, the few times ḥesed is overtly used within Judges, it is used to describe the broken covenantal treatment of individuals towards another, such as in the case of disloyalty to the family of Gideon (8:33–35)'
  - where: 'note 8:33 “Baal of the covenant”'
    claim: 'The word for “kindness” in verse 35 is ḥesed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'חֶ֔סֶד'
  - where: 'note 8:33 “Baal of the covenant”'
    claim: 'Smoot: the narrator closes by noting Israel''s relapse, leaving doubt how far Gideon''s idolatry was responsible'
    key: ot-minute-judg-8
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-8'
    quote: 'the narrator concluded his portrayal of Gideon by noting Israel’s relapse into apostasy (verses 33–35), leaving some lingering doubt in the mind of the reader as to what degree Gideon’s own idolatry was responsible for Israel’s subsequent troubles.'

  - where: christ
    claim: 'The Church footnote to “rule” in 8:23 points to Helaman 12:6'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/8?lang=eng'
    quote: '“rule”: Hel. 12:6; D&C 60:4.'
  - where: christ
    claim: 'Haws sets Gideon''s going further than the Lord asked beside D&C 121:34–40'
    key: haws-better-way
    url: 'https://mi.byu.edu/old-testament-reflections/longing-for-a-better-way'
    quote: 'Is this an example of getting a little authority and then covering a multitude of sins due to a false or inflated sense of divine commission? (D&C 121:34–40)'

  - where: explore
    claim: 'Haws''s reflection treats Gideon and Abimelech (Judges 6–9)'
    key: haws-better-way
    url: 'https://mi.byu.edu/old-testament-reflections/longing-for-a-better-way'
    quote: 'That house—that family—was destined for heartache and tragedy. Judges 9 is painful to read.'
  - where: 'note 8:33 “Baal of the covenant”'
    claim: 'Baal-berith means Baal of the covenant, a deity of the Shechemites'
    key: bdb
    url: 'https://biblehub.com/hebrew/1170.htm'
    quote: 'Baal of (the) covenant; Baal-Berith, a special deity of the Shechemites'
  - where: 'note 8:33 “Baal of the covenant”'
    claim: 'Baal was worshipped at Shechem as Baal-berith'
    key: bd-baal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/baal?lang=eng'
    quote: 'at Shechem as Baal-berith (Judg. 8:33; 9:4)'
  - where: christ
    claim: 'Accepting the crown would have claimed the victory as Gideon''s own; the danger is to take the credit'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'Had he consented, Gideon would have been lending support to the idea that through his own power he had won the battle.'
