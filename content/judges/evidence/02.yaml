chapter: 2
claims:
  - where: when
    claim: 'The chapter comes after the death of Joshua'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/2?lang=eng'
    quote: 'And Joshua the son of Nun, the servant of the LORD, died, being an hundred and ten years old.'

  - where: setting
    claim: 'The Bible Dictionary sets the introduction of Judges at 1:1–3:6'
    key: bd-judges
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/judges-book-of?lang=eng'
    quote: 'Judges consists of three parts: (1) an introduction (Judg. 1:1–3:6); (2) the history of the Twelve Judges, which falls into a succession of periods of rebellion against God, and the oppressions and deliverances by which they were followed (3:7–16:31)'
  - where: setting
    claim: 'Scripture Helps calls 1:1–3:6 an introduction to the cycle of sin and deliverance'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'Judges 1:1–3:6: Israel’s continued efforts to conquer and settle the promised land; introduction to the cycle of sin and deliverance.'
  - where: setting
    claim: 'On one older reading the Bochim account is appended to the survey of the tribes in chapter 1'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/2.htm'
    quote: 'To the cursory survey of the attitude which the tribes of Israel assumed towards the Canaanites who still remained in their inheritances, there is appended an account of the appearance of the angel of the Lord, who announced to the people the punishment of God for their breach of the covenant'
  - where: setting
    claim: 'Psalm 106 remembers the period: the nations not destroyed, the snare, the many deliverances, and the LORD who repented according to His mercies'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/106?lang=eng'
    quote: 'And he remembered for them his covenant, and repented according to the multitude of his mercies.'

  - where: thread
    claim: 'Verses 11–23 set out the formula of the book’s cycle in four steps, from false gods to relapse'
    key: ot-minute-judg-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-2'
    quote: 'Verses 11–23 of chapter 2 articulate the central formula of the test of Israel’s faith in the book of Judges that frames the book’s narrative cycle.'
  - where: thread
    claim: 'The pattern is repeated multiple times in the book'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'After they cried unto the Lord for help, He sent judges to deliver them. However, the Israelites soon returned to their sins. This pattern is repeated multiple times throughout the book.'

  - where: 'note 2:1 “The angel who speaks as the LORD”'
    claim: 'On one older reading the sacrifice at Bochim, where there was no sanctuary, shows that the one who appeared was not a prophet or ordinary angel but the angel of the Lord, one with Jehovah; the weeping was grief for sin that led to sacrifice'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/2.htm'
    quote: 'this grief led on to such repentance that "they sacrificed there unto the Lord," no doubt presenting sin-offerings and burnt-offerings, that they might obtain mercy and the forgiveness of their sins. … it does follow from the sacrifice at Bochim, where there was no sanctuary of Jehovah, that the person who appeared to the people was not a prophet, nor even an ordinary angel, but the angel of the Lord, who is essentially one with Jehovah.'
  - where: 'note 2:1 “The angel who speaks as the LORD”'
    claim: 'Gilgal was where Israel had camped early in the conquest; Bochim means “weepers,” from bakhah, “wept”'
    key: ot-minute-judg-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-2'
    quote: 'at Gilgal, where the Israelites had previously crossed the Jordan River and encamped in the early stages of the conquest of Canaan.[1] … the children of Israel wept (bakhah), hence the name given to the site where they received the message: Bochim (“weepers”).'
  - where: 'note 2:1 “The angel who speaks as the LORD”'
    claim: 'The angel speaks in the first person as the one who brought Israel out of Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/2?lang=eng'
    quote: 'And an angel of the LORD came up from Gilgal to Bochim, and said, I made you to go up out of Egypt, and have brought you unto the land which I sware unto your fathers'

  - where: 'note 2:3 “Thorns and snares: the warning written into the covenant”'
    claim: 'Judges 2 opens with the LORD stating His covenant faithfulness and pleading for Israel’s in return; Judges 2:2 follows the warnings of Exodus 34 and Deuteronomy 7; the reproof is a heartbreaking plea'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'God’s continuing love is foreshadowed in Judges 2 as the chapter begins with an appearance of the Lord wherein he explains his covenantal responsibility to them with a plea for reciprocation … This heartbreaking reprimand is a plea to Israel to follow the Lord’s way'
  - where: 'note 2:3 “Thorns and snares: the warning written into the covenant”'
    claim: 'The snare and the thorns come from the warnings of Exodus 23, Numbers 33 and Joshua 23'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'then it shall come to pass, that those which ye let remain of them shall be pricks in your eyes, and thorns in your sides, and shall vex you in the land wherein ye dwell.'

  - where: 'note 2:6 “Joshua’s death told a second time”'
    claim: 'Verses 6–10 are a flashback to Joshua’s death in Joshua 24:29–33, marking the passage to a new generation; the seam suggests to this author that 1:1–2:5 was a later insertion'
    key: ot-minute-judg-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-2'
    quote: 'The narrative progression of Judges is suddenly interrupted at verses 6–10 with a sort of flashback to Joshua’s death, narrated previously at Joshua 24:29–33. The disjunction here suggests that Judges 1:1–2:5 was a later insertion … the recap serves to mark a temporal transition from Joshua’s generation to the new generation'
  - where: 'note 2:6 “Joshua’s death told a second time”'
    claim: 'Judges has Timnath-heres (ḥeres) where Joshua has Timnath-serah (seraḥ): the same letters reversed'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'חֶ֖רֶס'
  - where: 'note 2:6 “Joshua’s death told a second time”'
    claim: 'Joshua 24:30 has seraḥ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Josh.xml'
    quote: 'סֶ֖רַח'
  - where: 'note 2:6 “Joshua’s death told a second time”'
    claim: 'On one older reading heres means “sun,” and the form Timnath-serah may have been written to avoid idolatrous associations'
    key: cambridge-judges
    url: 'https://biblehub.com/commentaries/cambridge/judges/2.htm'
    quote: 'Timnath-ḥeres, lit. ‘(sacred) territory of the Sun’ (cf. Mount Heres i. 35, Beth-shemesh), is written Timnath-seraḥ in Joshua 19:50; Joshua 24:30, and by Syr.and Vulgate here, perhaps to avoid idolatrous associations'
  - where: 'note 2:6 “Joshua’s death told a second time”'
    claim: 'Joshua 24:30–31 tells the burial at Timnath-serah and the service of the elders'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/24?lang=eng'
    quote: 'And they buried him in the border of his inheritance in Timnath-serah, which is in mount Ephraim, on the north side of the hill of Gaash.'
  - where: 'note 2:6 “Joshua’s death told a second time”'
    claim: 'Joshua 24:28–31 tells the same events in nearly the same words as Judges 2:6–9'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/24?lang=eng'
    quote: 'And Israel served the LORD all the days of Joshua, and all the days of the elders that overlived Joshua'

  - where: 'note 2:10 “A generation that did not know the LORD”'
    claim: 'The verb is yadaʿ, “know”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'יָֽדְעוּ֙'
  - where: 'note 2:10 “A generation that did not know the LORD”'
    claim: 'To know, as quoted in Schade from a commentary, implies deep engagement and acknowledgment of a superior’s claims; Schade: the new generation lacked a deeply personal covenant relationship with God'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'The term can denote mere cognition, but typically implies a deeper engagement of the knower with the known … suggesting acknowledgment of the claims and authority of one’s superior to the exclusion of others.” … A new generation was arising who did not enjoy this rich and deeply personal covenantal relationship with God'

  - where: 'note 2:13 “Baal, the “lord,” and Ashtaroth”'
    claim: 'Baal means possessor, lord, and expresses the relation between lord and slave; the plural Baalim reflects his worship with different rites in different places'
    key: bd-baal
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/baal?lang=eng'
    quote: 'Possessor, lord. … He was worshipped with different ideas and rites (compare the plural Baalim) in different places … The word Baal expresses the relation between lord and slave.'
  - where: 'note 2:13 “Baal, the “lord,” and Ashtaroth”'
    claim: 'The grove is the Asherah, a living tree or tree-like pole set up as an object of worship'
    key: bd-grove
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/grove?lang=eng'
    quote: 'In Hebrew, called Asherah (of which the plural is Asherim or Asheroth), either a living tree or a tree-like pole, set up as an object of worship'
  - where: 'note 2:13 “Baal, the “lord,” and Ashtaroth”'
    claim: 'Ashtaroth is the plural of Ashtoreth, idols worshipped with Baal'
    key: bd-ashtaroth
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ashtaroth?lang=eng'
    quote: 'Plural of Ashtoreth. Idols worshipped with Baal by the Israelites (Judg. 2:13; 10:6; 1 Sam. 7:3–4; 12:10; 31:10).'
  - where: 'note 2:13 “Baal, the “lord,” and Ashtaroth”'
    claim: 'The Canaanite gods were believed to rule rain, war and fertility and were worshipped in ways familiar to Israel'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'The Canaanites believed their gods held power over many aspects of life that were also significant to the Israelites, such as rain, warfare, fertility, and life itself. The Canaanites also worshipped their gods in ways that would have felt familiar to the Israelites, including through prayer, holy days, temples, priests, sacrifice, and incense.'
  - where: 'note 2:13 “Baal, the “lord,” and Ashtaroth”'
    claim: 'The evidence, though complex, does seem to support Israel’s emergence in the region; in the process Israel adopted many traditions'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'The evidence does seem to support the storyline in Judges of the emergence of the Israelites during this period within the region,[21] and it is apparent the Israelites adopted many traditions in the process of their “Canaanization”'

  - where: 'note 2:16 “What a judge was”'
    claim: 'The judges are shophetim, from shaphat; the verb “delivered” is hoshiaʿ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'שֹֽׁפְטִ֑ים'
  - where: 'note 2:16 “What a judge was”'
    claim: 'Judges 3:9 calls Othniel a môshîaʿ, from the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'מוֹשִׁ֛יעַ'
  - where: 'note 2:16 “What a judge was”'
    claim: 'BDB glosses shaphat “judge, govern” and “act as law-giver, judge, governor”'
    key: bdb
    url: 'https://biblehub.com/hebrew/8199.htm'
    quote: 'שָׁפַט185 verb judge, govern … 1 act as law-giver, judge, governor (giving law, deciding controversies and executing law, civil, religious, political, social; both early and late)'
  - where: 'note 2:16 “What a judge was”'
    claim: 'BDB glosses yashaʿ in the Hiphil “deliver, save”'
    key: bdb
    url: 'https://biblehub.com/hebrew/3467.htm'
    quote: '[יָשַׁע] verb Hiph`il deliver; … 1 deliver, save (properly give width and breadth to, liberate), in peril'
  - where: 'note 2:16 “What a judge was”'
    claim: 'In Judges the verb most often means to lead rather than to act as a court'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'šāpaṭ (שָׁפַט) “to judge” in Judges means, most often, “to lead,” rather than to act as a judiciary.'
  - where: 'note 2:16 “What a judge was”'
    claim: 'Come, Follow Me calls the deliverer a military leader called a judge'
    key: cfm-ot-2026-22
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/22?lang=eng'
    quote: 'the Lord gave His covenant people the chance to repent and raised up a deliverer, a military leader called a “judge.”'
  - where: 'note 2:16 “What a judge was”'
    claim: 'The LORD raised up the judges out of His covenant love and mercy'
    key: ot-minute-judg-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-2'
    quote: 'Out of His abundant covenant love and mercy, God raises up judges (shoftim) who deliver Israel from its enemies (verse 16).'

  - where: 'note 2:18 “The LORD hearkened”'
    claim: 'The JST reads “the Lord hearkened because of their groanings”; it is the only JST change in Judges and shows the Lord’s action changing with the people’s condition, not an error on His part'
    key: nyman-jst-historical
    url: 'https://rsc.byu.edu/joseph-smith-translation/contribution-jst-old-testament-historical-books'
    quote: 'The single change in Judges … In the JST this verse reads, “For the Lord hearkened because of their groanings.” … The change in Judges illustrates a change in the Lord’s actions based on the condition of the people. … his previous course had not been erroneous'
  - where: 'note 2:18 “The LORD hearkened”'
    claim: 'Israel’s crying out in Judges does not seem to be repentance, nor a condition of deliverance'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Israel’s cyclical crying out to the Lord following disobedience does not seem to be a form of repentance, nor does this appear to be a condition for the resultant deliverance by God'
  - where: 'note 2:18 “The LORD hearkened”'
    claim: 'The JST reading is in the Church’s footnote'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/2?lang=eng'
    quote: 'JST Judg. 2:18 … for the Lord hearkened because of …'

  - where: 'note 2:19 “Each turn lower than the last”'
    claim: 'Judges is a series of downward spirals, each cycle lower than the one before, ending in civil war and Benjamin nearly destroyed'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'Judges is portrayed in a series of downward moral spirals of disobedience that progressively worsen until the book ends in civil conflict and the near annihilation of the tribe of Benjamin (chap. 20).[38] … each cycle constitutes a lower scale of legitimate behavior than that of their predecessors.'
  - where: 'note 2:19 “Each turn lower than the last”'
    claim: 'Schade cites 10:13 as the LORD’s word that He would deliver them no more, and says the cycles worsen instead of being repaired by repentance'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'saying, “Yet have you forsaken me, and served other gods: wherefore I will deliver you no more.”[50] Repentance is therefore not inherent in the “crying out,” as we see in Israel’s downward cycles progressively getting worse instead of being repaired by true repentance.'
  - where: 'note 2:19 “Each turn lower than the last”'
    claim: 'The manual sets the cycle beside the Nephites and Helaman 12'
    key: ot-manual-judges-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-1-12-the-reign-of-the-judges-part-1?lang=eng'
    quote: 'But as soon as the judge was dead, Israel turned to the other gods, and the cycle began again. A strikingly similar cycle of righteousness and apostasy occurred among the people of the Book of Mormon and is graphically described in Helaman 12.'
  - where: 'note 2:19 “Each turn lower than the last”'
    claim: 'Smoot compares the formula with the pride cycle and wonders whether Nephite chroniclers modeled their history on it'
    key: ot-minute-judg-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-2'
    quote: 'The formula of the test of Israel’s faith in the book of Judges was not unlike the so-called pride cycle depicted in the Book of Mormon,[2] and it is indeed tempting to consider whether Nephite chroniclers consciously modeled their own cyclical history of apostasy and deliverance after that of their forebears.'

  - where: 'note 2:22 “Nations left as a test”'
    claim: 'The purpose of the cycle is explicitly said to be a test of Israel’s faith, and verse 23 also explains the failure to subdue the Canaanites'
    key: ot-minute-judg-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-2'
    quote: 'The purpose of this cycle was explicitly said to have been to test Israel’s faith … According to the compiler or author of Judges, it was also a way to explain the Israelites’ apparent failure to subdue the Canaanites (verse 23).'
  - where: 'note 2:22 “Nations left as a test”'
    claim: 'God was never absent and kept working to lead His people'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'God was never absent from the equation, and he was frequently engaged in efforts to lead people to peace, relief, and the joy of a covenantal relationship with him'
  - where: 'note 2:22 “Nations left as a test”'
    claim: 'On one older reading “hastily” limits the threat: no more nations driven out while Israel persisted in idolatry, and the promise would resume on repentance'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/2.htm'
    quote: 'the Lord would not exterminate any more of these nations so long as Israel persisted in its idolatry. But as soon as and whenever Israel returned to the Lord its God in true repentance, to keep His covenant, the Lord would recall His threat'
  - where: 'note 2:22 “Nations left as a test”'
    claim: 'Judges 3:1–4 names the nations left to prove Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/3?lang=eng'
    quote: 'And they were to prove Israel by them, to know whether they would hearken unto the commandments of the LORD, which he commanded their fathers by the hand of Moses.'

  - where: christ
    claim: 'Come, Follow Me: no matter what has led us away, Jesus Christ is the Redeemer of Israel, always willing to deliver and welcome us back'
    key: cfm-ot-2026-22
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/22?lang=eng'
    quote: 'These stories remind us that no matter what has led us away from Jesus Christ, He is the Redeemer of Israel and is always willing to deliver us and welcome us back as we return to Him.'
  - where: christ
    claim: 'The book of Judges is both a warning and an encouragement'
    key: cfm-ot-2026-22
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/22?lang=eng'
    quote: 'The book of Judges can be both a warning and an encouragement. Look for this warning and encouragement as you read Judges 2:1–19; 3:5–12.'
  - where: christ
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: christ
    claim: 'God raises up judges out of His covenant love and mercy'
    key: ot-minute-judg-2
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-2'
    quote: 'Out of His abundant covenant love and mercy, God raises up judges (shoftim) who deliver Israel from its enemies (verse 16).'
  - where: christ
    claim: 'The generation after Joshua lacked a covenant relationship with God'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'A new generation was arising who did not enjoy this rich and deeply personal covenantal relationship with God'

  - where: explore
    claim: 'The Church’s footnote joins the test of 2:22 to 1 Nephi 2:24'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/2?lang=eng'
    quote: '22a “prove”: 1 Ne. 2:24 (23–24). TG Test.'
