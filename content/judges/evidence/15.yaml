    claim: 'A “new” jawbone is a fresh one'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/15.htm'
    quote: 'he seized upon a fresh jaw-bone of an ass, which he found there, and smote therewith a thousand men.'
  - where: 'note 15:9 “Lehi, the Jawbone”'
    claim: 'Beit Lei was associated with Samson’s Lehi and then with the prophet Lehi by some Latter-day Saints'
    key: chadwick-beit-lei
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/khirbet-beit-lei-lehi-samson'
    quote: 'he associated the site with the place called Lehi in the biblical story of Samson (see Judges 15:9–19) … some Latter-day Saints began to associate the cave and the name of the nearby medieval Beit Lei ruins with the prophet Lehi'
  - where: 'note 15:8 “The cleft of the rock”'
    claim: 'Modern geographers locate Etam southwest of Jerusalem, northwest of Bethlehem'
    key: chadwick-beit-lei
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/khirbet-beit-lei-lehi-samson'
    quote: 'Modern biblical geographers almost universally locate Etam at Khirbet el-Khokh, which is southwest of Jerusalem and northwest of Bethlehem'
  - where: 'note 15:9 “Lehi, the Jawbone”'
    claim: 'Beit Lei lies east of Lachish in the southern Shephelah and cannot be reconciled to the geography of Judges 15'
    key: chadwick-beit-lei
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/khirbet-beit-lei-lehi-samson'
    quote: 'the site of Beyt Loya, east of Lachish in the southern Shfela region of Israel, cannot in any way be reconciled to the contextual geography of the Samson narrative in Judges 15.'
  - where: 'note 15:9 “Lehi, the Jawbone”'
    claim: 'Beit Lei is well south of the Sorek Valley, where the Samson narrative is set'
    key: chadwick-beit-lei
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/khirbet-beit-lei-lehi-samson'
    quote: 'Map of the central part of Israel, with sites marked along the Sorek Valley where the narrative of Samson is set. … Also marked are sites well south of the Sorek between Lachish and Hebron, including Khirbet Beit Lei (Beyt Loya)'
