chapter: 15
claims:
  - where: when
    claim: 'The Philistines ruled Israel in Samson’s day'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/14?lang=eng'
    quote: 'for at that time the Philistines had dominion over Israel.'
  - where: setting
    claim: 'Israel was given into the Philistines’ hand forty years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/13?lang=eng'
    quote: 'and the LORD delivered them into the hand of the Philistines forty years.'
  - where: setting
    claim: 'Chapter 14: the threat of fire against the wife and her father’s house; Ashkelon; the wife given to the companion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/14?lang=eng'
    quote: 'lest we burn thee and thy father’s house with fire … and he went down to Ashkelon, and slew thirty men of them … But Samson’s wife was given to his companion, whom he had used as his friend.'
  - where: setting
    claim: 'Chapter 15 continues the portrait of Samson as an angry hothead and shows his physical prowess'
    key: ot-minute-judg-15
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-15-0'
    quote: 'Continuing the depiction of Samson as an angry hothead in the previous chapter (see Judges 14:19), Judges 15 demonstrates Samson’s physical prowess by his exploits against the Philistines.'
  - where: setting
    claim: 'Samson was given great strength but failed his calling through selfish choices'
    key: scripture-helps-judges
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/20-judges-2-4-6-8-13-16?lang=eng'
    quote: 'Samson, another judge, was blessed with tremendous physical strength but failed to fulfill his divine calling because of selfish and unrighteous choices.'
  - where: setting
    claim: 'Verse 20 closes the account of Samson’s judging; chapter 16 tells his fall'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/15.htm'
    quote: 'In Judges 15:20 the account of the judicial labours of Samson are brought to a close … What more is recorded of him in Judges 16 relates to his fall and ruin; and although even in this he avenged himself upon the Philistines, he procured no further deliverance for Israel.'
  - where: setting
    claim: 'The twenty years are repeated at Samson’s burial'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/16?lang=eng'
    quote: 'buried him between Zorah and Eshtaol in the buryingplace of Manoah his father. And he judged Israel twenty years.'
  - where: thread
    claim: 'Violence begets violence: the fox raid brought the death of the wife and her father, and Samson answered with a great slaughter'
    key: ot-minute-judg-15
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-15-0'
    quote: 'This act, however, resulted in the death of Samson’s wife and her father by the hand of Philistines (verse 6), reinforcing the sad truth that violence begets violence. Indeed, this is precisely how Samson himself responded, unleashing a “great slaughter”'
  - where: thread
    claim: 'The strength is credited to the Spirit of the Lord'
    key: ot-minute-judg-15
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-15-0'
    quote: 'In any case, Samson’s fantastic strength was specifically credited to the power of the Spirit of the Lord coming upon him (verse 14).'
  - where: section 1 plain
    claim: '“Corn” is grain; “olives” are olive trees'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/15?lang=eng'
    quote: 'OR grain. … IE olive trees.'
  - where: section 1 plain
    claim: 'The “top of the rock Etam” is a cleft of the rock'
    key: chadwick-beit-lei
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/khirbet-beit-lei-lehi-samson'
    quote: 'the Hebrew phrase in this verse, סעיף סלע עיתם (sif sela etam), is more accurately rendered as “cleft of the rock of Etam”'
  - where: section 3 plain
    claim: 'Ramath-lehi means the height of Lehi'
    key: chadwick-beit-lei
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/khirbet-beit-lei-lehi-samson'
    quote: 'The place of Samson’s battle is noted as “Ramath-leḥi” (לחי רמת), which means “the height” or “high place” of Leḥi.'
  - where: section 4 plain
    claim: 'God split open the hollow place at Lehi; En-hakkore is the spring of him who calls'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/15?lang=eng'
    quote: 'OR But God opened up the basin that was at Lehi. … IE The spring of him who calls.'
  - where: 'note 15:2 “A wife given to another”'
    claim: 'The kid was a customary present (Gen. 38:17); Samson wished to go into the women’s apartment'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/15.htm'
    quote: 'Samson visited his wife in the time of the wheat harvest with a kid-a customary present at that time (Genesis 38:17)-and wished to go into the chamber (the women''s apartment) to her'
  - where: 'note 15:2 “A wife given to another”'
    claim: 'Samson treated the father’s wrong as the Philistines’ and resolved to avenge it on them all'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/15.htm'
    quote: 'Samson regarded the treatment which he had received from his father-in-law as but one effect of the disposition of the Philistines generally towards the Israelites, and therefore resolved to avenge the wrong which he had received from one member of the Philistines upon the whole nation'
  - where: 'note 15:2 “A wife given to another”'
    claim: 'Samson left the feast angry; the wife was given to his companion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/14?lang=eng'
    quote: 'And his anger was kindled, and he went up to his father’s house. But Samson’s wife was given to his companion, whom he had used as his friend.'
  - where: 'note 15:4 “Foxes or jackals”'
    claim: 'The Hebrew word is fox, perhaps jackal here because of the large number'
    key: bdb
    url: 'https://biblehub.com/hebrew/7776.htm'
    quote: 'fox, perhaps also jackal; … plural שׁוּעָלִים Judges 15:4 … perhaps (from large number) jackal Judges 15:4'
  - where: 'note 15:4 “Foxes or jackals”'
    claim: 'The harvest season, and what burned'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/15?lang=eng'
    quote: 'in the time of wheat harvest … and burnt up both the shocks, and also the standing corn, with the vineyards and olives.'
  - where: 'note 15:8 “The cleft of the rock”'
    claim: 'The KJV “top” renders a Hebrew phrase better translated “cleft of the rock of Etam,” a natural cavern'
    key: chadwick-beit-lei
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/khirbet-beit-lei-lehi-samson'
    quote: 'The King James Version oddly renders the name of this place as “top of the rock Etam,” but the Hebrew phrase in this verse, סעיף סלע עיתם (sif sela etam), is more accurately rendered as “cleft of the rock of Etam”'
  - where: 'note 15:8 “The cleft of the rock”'
    claim: 'A natural cleft cavern; Etam located near Bethlehem by most geographers'
    key: chadwick-beit-lei
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/khirbet-beit-lei-lehi-samson'
    quote: 'This seems to have been a natural cleft cavern in a bedrock formation at or near the biblical site Etam. The location of biblical Etam in the tribal area of Judah is noted in Second Chronicles as being in the vicinity of Bethlehem'
  - where: 'note 15:9 “Lehi, the Jawbone”'
    claim: 'Lehi means cheek, jawbone; the name plays on the story; either the author chose it or it came from the victory'
    key: ot-minute-judg-15
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-15-0'
    quote: 'The name Lehi in Hebrew means “cheek, jawbone.” … It could be that the author of Judges deliberately gave the site the name Lehi to fit his narrative portrayal of Samson. Alternatively, we might consider that the name derived from Samson’s victory'
  - where: 'note 15:9 “Lehi, the Jawbone”'
    claim: 'Readers wonder whether the prophet Lehi’s name is related; reasonable, but other origins possible'
    key: ot-minute-judg-15
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-15-0'
    quote: 'Latter-day Saint readers of the Bible naturally wonder whether the name of the prophet Lehi from the Book of Mormon may be related to this Hebrew word. It certainly appears reasonable to assume so, but there are other possible origins for the name.'
  - where: 'note 15:9 “Lehi, the Jawbone”'
    claim: 'The text places Lehi in the Judean hills, not far from Etam; it cannot be Khirbet Beit Lei'
    key: chadwick-beit-lei
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/khirbet-beit-lei-lehi-samson'
    quote: 'It clearly places the Leḥi of the Samson story in the region east of the Sorek Valley, over the border between Dan and Judah into the Judean hills, not very far from the location of biblical Etam'
  - where: 'note 15:9 “Lehi, the Jawbone”'
    claim: 'Arabic lei means twisting, not jawbone; Beit Lei has nothing to do with the Samson story'
    key: chadwick-beit-lei
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/khirbet-beit-lei-lehi-samson'
    quote: 'lei (ليّ) means “twisting” in Arabic, not “jawbone.” It is simply incorrect to maintain that Arabic lei somehow equates to Hebrew leḥi. There is no way, in terms of both place name translations and location factors, that Beit Lei could be the Leḥi of Samson'
  - where: 'note 15:9 “Lehi, the Jawbone”'
    claim: 'No Iron Age settlement at Beit Lei; it cannot have been the prophet Lehi’s residence'
    key: chadwick-beit-lei
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/khirbet-beit-lei-lehi-samson'
    quote: 'Therefore, it cannot have been a “City of Lehi” or a “Beit Lehi” residence or estate belonging to the prophet Lehi in the First Nephi narrative of the Book of Mormon, who lived at Jerusalem just prior to 600 BC.'
  - where: 'note 15:9 “Lehi, the Jawbone”'
    claim: 'The speculation that Samson’s Lehi was the prophet Lehi’s home has no evidence'
    key: ot-manual-judges-13-21
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/judges-13-21-ruth-1-4-the-reign-of-the-judges-part-2?lang=eng'
    quote: 'Some Latter-day Saint scholars have speculated that the location of Samson’s battle with the Philistines may have been the site of Lehi’s home near Jerusalem before he led his family into the wilderness, but there is no evidence to support this idea.'
  - where: 'note 15:11 “Answering wrong with wrong”'
    claim: 'Violence begets violence; Samson answered the burning with a great slaughter'
    key: ot-minute-judg-15
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-15-0'
    quote: 'reinforcing the sad truth that violence begets violence. Indeed, this is precisely how Samson himself responded, unleashing a “great slaughter” upon the Philistines in retaliation (verse 8).'
  - where: 'note 15:11 “Answering wrong with wrong”'
    claim: 'Samson at 15:11 acts as he had seen others in the region act, compared with Judah’s treatment of Adoni-bezek'
    key: schade-broken-laws
    url: 'https://rsc.byu.edu/wilderness-monarchy/broken-laws-every-man-did-which-was-right-his-own-eyes'
    quote: 'compare Judges 15:11 where Samson responds in his actions as he had seen them practiced by others in the region.'
  - where: 'note 15:11 “Answering wrong with wrong”'
    claim: 'The Philistines’ own words and the burning'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/15?lang=eng'
    quote: 'To bind Samson are we come up, to do to him as he hath done to us.'
  - where: 'note 15:11 “Judah hands over its deliverer”'
    claim: 'An older reading: Judah failed to recognize the deliverer the Lord had raised and reproached him'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/15.htm'
    quote: 'Instead of recognising in Samson a deliverer whom the Lord had raised up for them, and crowding round him that they might smite their oppressors with his help and drive them out of the land, the men of Judah were so degraded, that they cast this reproach at Samson'
  - where: 'note 15:11 “Judah hands over its deliverer”'
    claim: 'The Philistines had dominion over Israel (the footnote at 15:11 points there)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/14?lang=eng'
    quote: 'for at that time the Philistines had dominion over Israel.'
  - where: 'note 15:14 “Bands loosed: Samson and Nephi”'
    claim: 'Judges 15:14 is quoted in 1 Nephi 7:18'
    key: sc-knowhy-410
    url: 'https://scripturecentral.org/knowhy/what-parts-of-the-old-testament-were-on-the-plates-of-brass'
    quote: 'Joshua 24:15 is quoted in Alma 30:8, Judges 15:14 is quoted in 1 Nephi 7:18'
  - where: 'note 15:14 “Bands loosed: Samson and Nephi”'
    claim: 'The “record of the Jews” on the plates of brass likely included Judges, as its quotation suggests'
    key: sc-knowhy-410
    url: 'https://scripturecentral.org/knowhy/what-parts-of-the-old-testament-were-on-the-plates-of-brass'
    quote: 'The “record of the Jews” was likely Joshua, Judges, 1–2 Samuel, and 1–2 Kings.'
  - where: 'note 15:14 “Bands loosed: Samson and Nephi”'
    claim: 'Nephi prayed for strength to burst his bands, and they were loosed'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/7?lang=eng'
    quote: 'yea, even give me strength that I may burst these bands with which I am bound. … behold, the bands were loosed from off my hands and feet'
  - where: 'note 15:14 “Bands loosed: Samson and Nephi”'
    claim: 'The Church’s footnote to “loosed” points to Alma 2:28 and 14:26'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/15?lang=eng'
    quote: '14a “loosed”: Alma 2:28 (26–36); 14:26.'
  - where: 'note 15:14 “Bands loosed: Samson and Nephi”'
    claim: 'Alma and Amulek prayed for strength according to faith in Christ and broke their cords'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/14?lang=eng'
    quote: 'O Lord, give us strength according to our faith which is in Christ, even unto deliverance. And they broke the cords with which they were bound'
  - where: 'note 15:14 “Bands loosed: Samson and Nephi”'
    claim: 'The new cords were likely of flax, strong, yet Samson burst them by the Lord’s strength'
    key: sc-knowhy-551
    url: 'https://scripturecentral.org/knowhy/why-did-nephi-say-the-devil-leads-sinners-by-a-flaxen-cord'
    quote: 'The “new cords” used to bind Samson were likely made of flax and were indeed strong, but with the strength of the Lord, Samson burst out of them “as flax that was burnt with fire.”'
  - where: 'note 15:16 “A donkey, two donkeys”'
    claim: 'The Hebrew ḥămôr, “heap,” beside ḥămôr, “ass”: with the ass’s jawbone, a heap, two heaps'
    key: bdb
    url: 'https://biblehub.com/hebrew/2543.htm'
    quote: 'I. חֲמוֺר noun [masculine] heap, absolute ׳ח with dual חֲמֹרָתָ֑יִם … Judges 15:16 with the ass''s jawbone, a heap, two heaps, i.e. so many slain.'
  - where: 'note 15:16 “A donkey, two donkeys”'
    claim: 'The verse’s words in the Hebrew'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Judg.xml'
    quote: 'חֲמֹרָתָ֑יִם'
  - where: 'note 15:16 “A donkey, two donkeys”'
    claim: 'Whether the thousand is literal or hyperbole matters little; the outnumbered Israelite triumphed'
    key: chadwick-beit-lei
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/khirbet-beit-lei-lehi-samson'
    quote: 'Whether the word thousand is to be taken literally here, or whether it is a hyperbolic expression for the large number of Philistine warriors Samson dispatched, is of little importance; in either case, the outnumbered Israelite triumphed'
  - where: 'note 15:19 “The spring of him who called”'
    claim: 'En-hakkore plays on the narrative: he called (qara) on the Lord, and named the spring “Spring of Calling”'
    key: ot-minute-judg-15
    url: 'https://scripturecentral.org/archive/books/book-chapter/judges-15-0'
    quote: 'As with the name Lehi earlier, the name Samson gave to the site, Enhakkore, plays off the description provided in the narrative: “And he was sore athirst, and called [qara‘] on the Lord'
  - where: 'note 15:19 “The spring of him who called”'
    claim: 'Hakkore means he who cries out; en is a spring; the hollow was at Lehi the place; the spring was known to the biblical writer'
    key: chadwick-beit-lei
    url: 'https://rsc.byu.edu/vol-23-no-3-2022/khirbet-beit-lei-lehi-samson'
    quote: '“God clave an hollow place that was in the jaw”—that is, at Leḥi— … The term hakkore (הקורא) means “he who cries out.” The term en (עין) means a spring of water.'
  - where: 'note 15:19 “The spring of him who called”'
    claim: 'From the prayer Samson knew he fought for the Lord’s cause'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/15.htm'
    quote: 'From this prayer we may see that Samson was fully conscious that he was fighting for the cause of the Lord. And the Lord helped him out of this trouble. God split the hollow place at Lechi, so that water came out of it, as at Horeb and Kadesh'
  - where: 'note 15:19 “The spring of him who called”'
    claim: 'The tooth-socket reading is opposed by “at Lechi” and by the spring’s still existing'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/15.htm'
    quote: 'But the expression בּלּחי אשׁר, "the maktesh which is at Lechi," is opposed to this view … and so is also the remark that this fountain was still in existence in the historian''s own time.'
  - where: 'note 15:19 “The spring of him who called”'
    claim: 'Samson’s only other prayer is at 16:28'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/16?lang=eng'
    quote: 'And Samson called unto the LORD, and said, O Lord GOD, remember me, I pray thee, and strengthen me'
  - where: christ
    claim: 'The pattern of the judges teaches the Savior’s power to deliver'
    key: cfm-ot-2026-22
    url: 'https://www.churchofjesuschrist.org/study/manual/come-follow-me-for-home-and-church-old-testament-2026/22?lang=eng'
    quote: 'Judges 3 describes a pattern that teaches about the Savior’s power to deliver us from sin.'
  - where: christ
    claim: 'Alma and Amulek prayed for strength according to faith in Christ, unto deliverance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/14?lang=eng'
    quote: 'O Lord, give us strength according to our faith which is in Christ, even unto deliverance.'
