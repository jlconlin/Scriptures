    url: 'https://biblehub.com/commentaries/kad/judges/15.htm'
    quote: 'Now am I blameless before the Philistines, if I do evil to them.'
  - where: section 1 plain
    claim: '“Hip and thigh” is a proverbial expression for an unsparing slaughter'
    key: keil-judges
    url: 'https://biblehub.com/commentaries/kad/judges/15.htm'
    quote: 'Smiting hip and thigh is a proverbial expression for a cruel, unsparing slaughter'
