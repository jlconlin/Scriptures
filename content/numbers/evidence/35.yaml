chapter: 35
claims:
  - where: 'when'
    claim: 'Aaron died in the fortieth year after the Exodus, the year Israel reached the plains of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'And Aaron the priest went up into mount Hor at the commandment of the Lord, and died there, in the fortieth year after the children of Israel were come out of the land of Egypt'
  - where: 'setting'
    claim: 'The chapter is set in the fortieth year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'in the fortieth year after the children of Israel were come out of the land of Egypt, in the first day of the fifth month.'
  - where: 'setting'
    claim: 'Chapter 34 draws the borders and names the men who would divide the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/34?lang=eng'
    quote: 'Moses specifies the borders of Israel’s inheritance in Canaan and names the princes of the tribes who will divide the land.'
  - where: 'setting'
    claim: 'Chapter 36 keeps the daughters'' inheritances within their tribes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/36?lang=eng'
    quote: 'Some daughters in Israel are directed to marry within their own tribe—Inheritances are not to move from tribe to tribe.'
  - where: 'setting'
    claim: 'Levi had no inheritance in Canaan but had the tithe and 48 cities'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'They had no inheritance in Canaan (18:23–24); but they had the tithe (18:21), 48 cities (35:6), and a claim on the alms of the people at feast times'
  - where: 'thread'
    claim: 'Verses 9–34 fall into appointment (9–15), specimen cases (16–23), procedure (24–28) and conclusion (29–34)'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/35.htm'
    quote: 'In Numbers 35:9-15 the appointment of the six cities and their purpose are prescribed; Numbers 35:16-23 contain specimen cases distinguishing deliberate murder from accidental homicide; Numbers 35:24-28 provide the legal procedure; Numbers 35:29-34 form a conclusion.'
  - where: 'thread'
    claim: 'The law modifies the old custom of blood revenge in three respects'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/35.htm'
    quote: '(1) Ancient custom made no distinction between accidental and deliberate manslaughter … Here the law tacitly insists that the murderer only is to forfeit his life. (3) The present law forbids the forfeited life of the murderer to be redeemed by a money payment.'
  - where: 'thread'
    claim: 'The regulations join divine justice and mercy'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/35.htm'
    quote: 'In these regulations "all the rigour of the divine justice is manifested in the most beautiful concord with His compassionate mercy.'
  - where: 'thread'
    claim: 'Even unintended killing shed blood that demanded expiation, but not the offender''s death, since he had not sinned wilfully; hence the asylum'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/35.htm'
    quote: 'Through the destruction of life, even when not wilful, human blood had been shed, and demanded expiation. Yet this expiation did not consist in the death of the offender himself, because he had not sinned wilfully." Hence an asylum was provided'
  - where: 'note 35:2 “Pasture land, not suburbs”'
    claim: 'The word rendered suburbs means a place for driving cattle, then common land around a town'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/35.htm'
    quote: 'the word, which denotes lit. a place for driving cattle (cf. Numbers 35:3). But it came to be used more generally of common land surrounding a town, which all the inhabitants had the right to use.'
  - where: 'note 35:2 “Pasture land, not suburbs”'
    claim: 'The pasture land of the Levites'' cities could not be sold'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/25?lang=eng'
    quote: 'But the field of the suburbs of their cities may not be sold; for it is their perpetual possession.'
  - where: 'note 35:2 “Pasture land, not suburbs”'
    claim: 'The Levites received not whole towns but enough houses in them'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/35.htm'
    quote: '"Towns to dwell in," i.e., not the whole of the towns as their own property, but as many houses in the towns as sufficed for the necessities of the Levites as their hereditary possession'
  - where: 'note 35:2 “Pasture land, not suburbs”'
    claim: 'The rest of each town, with its fields and villages, stayed with its tribe'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/35.htm'
    quote: 'but any portion of the towns which was not taken possession of by them, together with the fields and villages, continued the property of those tribes to which they had been assigned by lot'
  - where: 'note 35:5 “A thousand cubits or two thousand?”'
    claim: 'The measures have perplexed commentators; picture squares, 1000 cubits out from the wall, 2000 on each outer side apart from the wall'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/35.htm'
    quote: '"and the city in the middle," i.e., so that the town stood in the middle of the measured lines … which have caused great perplexity to commentators … We must picture the towns and the surrounding fields as squares, the pasturage as stretching 1000 cubits from the city wall in every direction'
  - where: 'note 35:5 “A thousand cubits or two thousand?”'
    claim: 'A town 1000 cubits on a side would give an outer side of 3000 cubits'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/35.htm'
    quote: 'the length of each outer side as 2000 cubits, apart from the length of the city wall: so that, if the town itself occupied a square of 1000 cubits (see fig. a), the outer side of the town fields would measure 2000 + 1000 cubits'
  - where: 'note 35:5 “A thousand cubits or two thousand?”'
    claim: 'Another reading takes each plot as a square of 2000 cubits'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/35.htm'
    quote: 'Each plot of land is to be a square of 2,000 cubits (c. 1,000 yards).'
  - where: 'note 35:5 “A thousand cubits or two thousand?”'
    claim: 'The same commentary doubts that square plots of that size could be found in hilly Palestine'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/35.htm'
    quote: '1st, In a hilly country like Palestine, cut with deep ravines, it would be impossible to find 48 square plots of land of such a size.'
  - where: 'note 35:5 “A thousand cubits or two thousand?”'
    claim: 'Joshua records the forty-eight cities with their suburbs, without measurements'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/21?lang=eng'
    quote: 'All the cities of the Levites within the possession of the children of Israel were forty and eight cities with their suburbs.'
  - where: 'note 35:6 “Why the refuges were Levites'' cities”'
    claim: 'Levitical towns were chosen because of the Levites'' role in justice and because the towns were Jehovah''s property'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/35.htm'
    quote: 'it was to the priests and Levites that they would first of all look for an administration of justice … these cities were the property of Jehovah, in a higher sense than the rest of the land … placed under the protection of divine grace'
  - where: 'note 35:6 “Why the refuges were Levites'' cities”'
    claim: 'Nephi, having killed without premeditation, left the land in voluntary exile'
    key: sc-knowhy-256
    url: 'https://scripturecentral.org/knowhy/was-nephis-slaying-of-laban-legal'
    quote: 'In a case like Nephi’s, where the killing wasn’t preplanned, the killer still had to flee to one of the specifically-designated cities of refuge or leave the Holy Land (Numbers 35:6). Nephi did just that. In effect, his punishment for killing Laban was voluntary exile'
  - where: 'note 35:7 “Levi scattered among the tribes”'
    claim: 'Joshua records forty-eight Levite cities given'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/21?lang=eng'
    quote: 'All the cities of the Levites within the possession of the children of Israel were forty and eight cities with their suburbs.'
  - where: 'note 35:7 “Levi scattered among the tribes”'
    claim: 'Jacob said Levi would be divided and scattered'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/49?lang=eng'
    quote: 'I will divide them in Jacob, and scatter them in Israel.'
  - where: 'note 35:7 “Levi scattered among the tribes”'
    claim: 'The distribution turned Jacob''s curse of dispersion into a blessing'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/35.htm'
    quote: 'by which the curse of division and dispersion in Israel, which had been pronounced upon Levi in Jacob''s blessing (Genesis 49:7), was changed into a blessing both for the Levites themselves and also for all Israel'
  - where: 'note 35:7 “Levi scattered among the tribes”'
    claim: 'Spread among the tribes they reminded Israel of its calling; gathered in towns they were not alone'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/35.htm'
    quote: 'by their walk as well as by their calling to remind the Israelites continually of their own divine calling … congregated together in separate towns among the different tribes, preserved them from the disadvantages of standing alone'
  - where: 'note 35:16 “Iron, stone and wood”'
    claim: 'The stone filled the hand, the wood was a thick club, and such a weapon implied intent'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/35.htm'
    quote: 'with a stone which filled the hand … with a thick club … "For the suspicion would rest upon any one who had used an instrument, that endangered life and therefore was not generally used in striking, that he had intended to take life away"'
  - where: 'note 35:16 “Iron, stone and wood”'
    claim: 'Moses'' law distinguished premeditated murder, murder of passion, manslaughter and self-defense'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'Differentiation was made among what is called today premeditated murder, murder of passion, manslaughter, and self-defense.'
  - where: 'note 35:16 “Iron, stone and wood”'
    claim: 'The Anti-Nephi-Lehies buried the weapons the law of Moses associated with murder'
    key: sc-knowhy-132
    url: 'https://scripturecentral.org/knowhy/what-is-the-symbolism-of-the-stained-swords-of-the-anti-nephi-lehies'
    quote: 'Part of this law identified those who killed with instruments or weapons of iron, stone, and wood as “murderers” (Numbers 35:16–18). Thus, by getting rid of “all the weapons which were used for the shedding of man’s blood” (Alma 24:17), the Anti-Nephi-Lehi’s assured themselves and God that they would never again commit an unlawful, intentional murder.'
  - where: 'note 35:25 “Free at the high priest''s death”'
    claim: 'Joshua repeats the term of the high priest''s death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/20?lang=eng'
    quote: 'and until the death of the high priest that shall be in those days: then shall the slayer return, and come unto his own city'
  - where: 'note 35:25 “Free at the high priest''s death”'
    claim: 'The anointing clause shows the high priest''s death was regarded as expiatory'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/35.htm'
    quote: 'the death of the high priest was hereby regarded as expiatory … from the addition of the clause, "who has been anointed with the holy oil," which would appear unmeaning and superfluous on any other view.'
  - where: 'note 35:25 “Free at the high priest''s death”'
    claim: 'His death a death for the sins of the people, the slayer returning cleansed; a type of Christ'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/35.htm'
    quote: 'his death might also be regarded as a death for the sins of the people … so that he could return cleansed to his native town … "the death of the earthly high priest became thereby a type of that of the heavenly One, who, through the eternal (holy) Spirit, offered Himself without spot to God'
  - where: 'note 35:25 “Free at the high priest''s death”'
    claim: 'The title is literally the great priest; the term works like the death of the reigning sovereign'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/35.htm'
    quote: 'the high priest] lit. ‘the great priest.’ … So that ‘until the death of the high priest’ would have almost the same force that the words ‘until the death of the reigning sovereign’ would bear to-day.'
  - where: 'note 35:31 “No ransom for a life”'
    claim: 'The word is kōper, a price for ransom of a life, as at Ex. 21:30 and Num. 35:31–32'
    key: bdb
    url: 'https://biblehub.com/hebrew/3724.htm'
    quote: '1 a price for ransom of a life Job 33:24; Job 36:18; עַל ׳כ Exodus 21:30 … לְ ׳כ ransom for Proverbs 6:35; Proverbs 21:18; Numbers 35:31,32 (P)'
  - where: 'note 35:31 “No ransom for a life”'
    claim: 'The slayer could not buy an early return from the city'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/35.htm'
    quote: 'nor even to allow the unintentional murderer to purchase permission to return home from the city of refuge before the death of the high priest, by the payment of a money compensation.'
  - where: 'note 35:31 “No ransom for a life”'
    claim: 'Ransom was widely prevalent; Israel seems to have forbidden it early except in certain cases (Ex. 21:29–30); this law is the earliest explicit prohibition'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/35.htm'
    quote: 'Such redemption was widely prevalent, but except in certain cases—not wilful murder—(cf. Exodus 21:29 f.) it seems to have been prohibited at an early period in Israel, though the present law contains the earliest explicit prohibition.'
  - where: 'note 35:31 “No ransom for a life”'
    claim: 'The prohibitions emphasize the value of human life'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/35.htm'
    quote: 'The murderer’s life may not be ransomed. And the man who has committed accidental homicide may not pay a ransom in lieu of detention in the city of refuge. These prohibitions emphasize the extreme value of human life.'
  - where: 'note 35:33 “Atonement for the land”'
    claim: 'The verb is kipper; for the land atonement cannot be made except by the shedder''s blood'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'לארץ לא יכפר לדם Numbers 35:33 for the land atonement cannot be made, in view of the blood shed in it, except by the blood of the shedder of blood'
  - where: 'note 35:33 “Atonement for the land”'
    claim: 'The remedy was the execution of the murderer, satisfying justice'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/35.htm'
    quote: 'there was no expiation (יכפּר) to the land for the blood that was shed in it, except through the blood of the man who had shed it, i.e., through the execution of the murderer, by which justice would be satisfied.'
  - where: 'note 35:33 “Atonement for the land”'
    claim: 'Israel was not to defile the land by tolerating murderers, for Jehovah dwelt in it'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/35.htm'
    quote: 'And they were not to desecrate the land in which they dwelt by tolerating murderers, because Jehovah, the Holy One, dwelt in it, among the children of Israel'
  - where: 'christ'
    claim: 'The giver of the law is Jesus Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/15?lang=eng'
    quote: 'Behold, I am he that gave the law, and I am he who covenanted with my people Israel; therefore, the law in me is fulfilled'
  - where: 'christ'
    claim: 'Heb. 6:18 "fled for refuge" glossed as fleeing into a city of refuge'
    key: cambridge-hebrews
    url: 'https://biblehub.com/commentaries/cambridge/hebrews/6.htm'
    quote: 'who have fled for refuge] As into one of the refuge-cities of old. Numbers 35:11.'
