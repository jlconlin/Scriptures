chapter: 34
claims:
  - where: 'setting'
    claim: 'The footnote to “Canaan” in verse 2 points to the promise of Genesis 17:8'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/34?lang=eng'
    quote: '“Canaan”: Gen. 17:8 (1–27); Ex. 3:8; Abr. 2:19 (15–16, 19).'
  - where: 'setting'
    claim: 'The southern border is the same as Judah''s southern border in Joshua 15'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/34.htm'
    quote: 'The southern boundary is the same as that given in Joshua 15:2-4 as the boundary of the territory of the tribe of Judah.'
  - where: 'setting'
    claim: 'Ezekiel''s borders of the future Israel share several names with Numbers 34'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/34.htm'
    quote: 'Ezekiel 47:15-17 coincides with Num. as regards the Great Sea, Zedad, and Hazar-enan, the last, however, being spelt Hazar-enon.'
  - where: 'thread'
    claim: 'The east and west borders are clear; the north and south are uncertain, with hardly any places identified'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/34.htm'
    quote: 'The eastern and western boundaries of the country are clearly defined. They are the R. Jordan and the ‘Great Sea,’ the Mediterranean. But the northern and southern limits are very uncertain, hardly any of the places mentioned having been identified.'
  - where: 'thread'
    claim: 'A prince was chosen from each of the ten tribes receiving land west of the Jordan'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/34.htm'
    quote: 'a prince was selected from each of the ten tribes who were interested in the distribution, as Reuben and Gad had nothing to do with it.'
  - where: 'thread'
    claim: 'The princes are listed roughly by their tribes'' territories from south to north, not in the order of the lots in Joshua'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/34.htm'
    quote: 'The list of tribes, in the enumeration of their princes, corresponds, with some exceptions, to the situation of the territory which the tribes received in Canaan, reckoning from south to north, and deviates considerably from the order in which the lots came out'
  - where: 'section 1 plain'
    claim: '“With the coasts thereof” means and all its territory'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/34?lang=eng'
    quote: '“with the coasts thereof”: HEB and all its territory.'
  - where: 'section 1 plain'
    claim: 'The southern border starts from the end of the Salt Sea on the east and turns south of the ascent of Akrabbim'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/34.htm'
    quote: '"The south border shall be from the end of the Salt Sea eastward," … "And turn to the south side (מנּגב) of the ascent of Akrabbim"'
  - where: 'section 1 plain'
    claim: '“Fetch a compass from” means turn from'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/34?lang=eng'
    quote: '“fetch a compass from”: OR turn from.'
  - where: 'section 1 plain'
    claim: 'The great sea is the Mediterranean'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/34?lang=eng'
    quote: '“the”: IE the Mediterranean.'
  - where: 'section 1 plain'
    claim: 'The western boundary is the Mediterranean with its coast'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/34.htm'
    quote: 'The western boundary was to be "the great sea and its territory," i.e., the Mediterranean Sea with its territory or coast'
  - where: 'section 1 plain'
    claim: 'The sea of Chinnereth is the Sea of Galilee'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/34?lang=eng'
    quote: '“the sea of Chinnereth”: IE the Sea of Galilee.'
  - where: 'section 1 plain'
    claim: '“The side of the sea” is literally its shoulder, the slopes northeast of the lake'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/34.htm'
    quote: '11. the side of the sea] lit. ‘the shoulder of the sea.’ The word is a descriptive term referring to the mountain slopes on the N.E. of the lake'
  - where: 'section 2 plain'
    claim: '“House” may be read houses, clans'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/34?lang=eng'
    quote: '“house”: OR houses, clans.'
  - where: 'section 2 plain'
    claim: '“Near Jericho eastward” means east of Jericho'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/34?lang=eng'
    quote: 'Jericho eastward”: OR east of Jericho.'
  - where: 'section 3 plain'
    claim: '“Prince” is in Hebrew leader'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/34?lang=eng'
    quote: '“prince”: HEB leader, president (also vv. 23, 25–28).'
  - where: 'note 34:2 “Borders never fully held”'
    claim: 'One older reading takes the borders as ideal and never fully possessed, certainly in the west'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/34.htm'
    quote: 'It is probable that the boundaries here traced in P are, as in Ezekiel, ideal, and that the full extent of country which they imply was never actually possessed by Israel. This is certain as regards the west'
  - where: 'note 34:2 “Borders never fully held”'
    claim: 'The Hebrews never held the Mediterranean coast except perhaps Carmel and at times Joppa'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/34.htm'
    quote: 'the Hebrews never held a single spot on the Mediterranean coast with the possible exception of Carmel, and, at certain periods, Joppa'
  - where: 'note 34:2 “Borders never fully held”'
    claim: 'Joshua 13 lists the north, the Lebanon toward Hamath, as left unconquered'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/34.htm'
    quote: 'the following places in the north of Canaan are mentioned in Joshua 13:4-5, and Judges 3:3, as being left unconquered by Joshua'
  - where: 'note 34:2 “Borders never fully held”'
    claim: 'Hamath seems to have come under Solomon'
    key: bd-hamath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hamath?lang=eng'
    quote: 'The city seems to have come under the dominion of Solomon (1 Kgs. 4:21–24; 2 Chr. 8:4).'
  - where: 'note 34:2 “Borders never fully held”'
    claim: 'The brook of Egypt is often named as the southern boundary, as in 1 Kings 8:65'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/34.htm'
    quote: 'The "brook of Egypt," therefore, is frequently spoken of as the southern boundary of the land of Israel (1 Kings 8:65; 2 Kings 24:7; 2 Chronicles 7:8, and Isaiah 27:12'
  - where: 'note 34:2 “Borders never fully held”'
    claim: 'Solomon''s feast gathered Israel from the entering in of Hamath to the river of Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'And at that time Solomon held a feast, and all Israel with him, a great congregation, from the entering in of Hamath unto the river of Egypt, before the Lord our God'
  - where: 'note 34:2 “Borders never fully held”'
    claim: 'Much land remained to be possessed in Joshua''s old age'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/13?lang=eng'
    quote: 'Thou art old and stricken in years, and there remaineth yet very much land to be possessed.'
  - where: 'note 34:5 “Not the Nile”'
    claim: 'The Hebrew is naḥal; the KJV “river” suggests the Nile wrongly; it is the Wadi el-Arish, rising in Sinai and reaching the sea about 50 miles southwest of Gaza'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/34.htm'
    quote: 'Heb. ‘the naḥal of Miẓraim.’ A.V. ‘the river of Egypt’ gives the erroneous impression that the Nile is meant. The name is that of a wady or torrent, now called Wâdy el-‘Arîsh, which rises in the centre of the Sinaitic peninsula, and flows northward into the Mediterranean about 50 miles S.W. of Gaza.'
  - where: 'note 34:5 “Not the Nile”'
    claim: 'The Wadi el-Arish is the brook of Egypt, where the border reached the sea'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/34.htm'
    quote: 'not far from its entrance into the Wady el Arish; for this is "the river (brook) of Egypt," to which the boundary turned from Azmon, and through which it had "its outgoings at the sea," i.e., terminated at the Mediterranean Sea.'
  - where: 'note 34:5 “Not the Nile”'
    claim: 'The southern line ran along valleys dividing desert from cultivated land'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/34.htm'
    quote: 'the southern boundary ran, throughout its whole length, from the Arabah on the east to the Mediterranean on the west, along valleys which form a natural division, and constitute more or less the boundary line between the desert and the cultivated land.'
  - where: 'note 34:7 “Another mount Hor”'
    claim: 'This mount Hor is distinct from the one near Edom'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/34.htm'
    quote: '7. mount Hor] This is, of course, quite distinct from the mountain of the same name in the neighbourhood of Edom (Numbers 20:22 ff., Numbers 33:38).'
  - where: 'note 34:7 “Another mount Hor”'
    claim: 'The northern boundary cannot be fixed; Hamath is the only place well known'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/34.htm'
    quote: 'The northern boundary cannot be determined with certainty. … Of all these places, Hamath, the modern Hamah, or the Epiphania of the Greeks and Romans on the Orontes (see at Numbers 13:21, and Genesis 10:18), is the only one whose situation is well known'
  - where: 'note 34:7 “Another mount Hor”'
    claim: 'The entrance of Hamath refers to the kingdom of Hamath, not the town'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/34.htm'
    quote: 'In all the passages mentioned, Hamath refers, not to the town of that name (Epiphania on the Orontes), but to the kingdom of Hamath, which was named after its capital'
  - where: 'note 34:7 “Another mount Hor”'
    claim: 'The entering in of Hamath was the northern limit of the Promised Land'
    key: bd-hamath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hamath?lang=eng'
    quote: 'An important city of Syria, in the valley of the Orontes; the “entering in of Hamath” was the northern limit of the Promised Land (Num. 34:8; Josh. 13:5).'
  - where: 'note 34:17 “The priest and the leader”'
    claim: 'Joshua and Eleazar are the successors of Moses and Aaron as civil and religious heads'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/34.htm'
    quote: 'In supreme command are Joshua and Eleazar, the successors of Moses and Aaron as the civil and religious beads of the nation.'
  - where: 'note 34:17 “The priest and the leader”'
    claim: 'Eleazar stands at the head as high priest by the appointment of 27:21'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/34.htm'
    quote: 'In addition to Eleazar and Joshua, the former of whom was to stand at the head as high priest, in accordance with the divine appointment in Numbers 27:21, and the latter to occupy the second place as commander of the army'
  - where: 'note 34:17 “The priest and the leader”'
    claim: 'Eleazar, Joshua and the heads of the fathers divided the land by lot at Shiloh before the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/19?lang=eng'
    quote: 'These are the inheritances, which Eleazar the priest, and Joshua the son of Nun, and the heads of the fathers of the tribes of the children of Israel, divided for an inheritance by lot in Shiloh before the Lord, at the door of the tabernacle of the congregation.'
  - where: 'note 34:19 “Caleb, the one name known”'
    claim: 'Caleb is the only prince known from elsewhere; the others are not mentioned elsewhere'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/34.htm'
    quote: 'Caleb, who is well known from Numbers 13, is the only one whose name if known. The others are not mentioned anywhere else.'
  - where: 'note 34:19 “Caleb, the one name known”'
    claim: 'At eighty-five Caleb received Hebron because he wholly followed the Lord'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/14?lang=eng'
    quote: 'Hebron therefore became the inheritance of Caleb the son of Jephunneh the Kenezite unto this day, because that he wholly followed the Lord God of Israel.'
  - where: 'christ'
    claim: 'Paul names Christ as the Rock that followed Israel in the wilderness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/10?lang=eng'
    quote: 'for they drank of that spiritual Rock that followed them: and that Rock was Christ.'
  - where: 'christ'
    claim: 'In giving the land the Lord kept His covenant with Abraham'
    key: scripture-helps-josh
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/19-joshua-1-8-23-24?lang=eng'
    quote: 'This book demonstrates the Lord’s faithfulness in keeping His covenant with Abraham to give the Israelites the promised land.'
  - where: 'parallels'
    claim: 'Ezekiel''s borders share names with Numbers 34'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/34.htm'
    quote: 'Ezekiel 47:15-17 coincides with Num. as regards the Great Sea, Zedad, and Hazar-enan'
