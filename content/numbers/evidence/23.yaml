chapter: 23
claims:
  - where: 'when'
    claim: 'Israel was camped on the plains of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/22?lang=eng'
    quote: 'And the children of Israel set forward, and pitched in the plains of Moab on this side Jordan by Jericho.'
  - where: 'when'
    claim: 'The plains of Moab chapters tell the final year or so of the forty years'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Numbers 20:28–36:13 constitutes the third and last major portion of the book, relating events during the final year or so of the Israelites’ forty years in the wilderness.'
  - where: 'setting'
    claim: 'The plains of Moab are on the northeast shoulder of the Dead Sea, in the last year or so of the forty years'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'relating events during the final year or so of the Israelites’ forty years in the wilderness. … and then encamped in the “plains of Moab,” on the northeast shoulder of the Dead Sea (22:1)'
  - where: 'setting'
    claim: 'The field of Zophim is the field of the watchers, on Pisgah'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/23.htm'
    quote: 'The "field of the watchers," or "spies (zophim), upon the top of Pisgah," corresponds, no doubt, to "the field of Moab, upon the top of Pisgah," on the west of Heshbon'
  - where: 'setting'
    claim: 'Peor was nearer the Israelite camp, where Balaam could see the whole people'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/23.htm'
    quote: 'nearer to the camp of the Israelites in these Arboth, was the summit of Peor, to which Balak afterwards conducted Balaam (Numbers 23:28), and where he not only saw the whole of the people'
  - where: 'setting'
    claim: 'The field of Zophim is in Hebrew a lookout point'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/23?lang=eng'
    quote: 'HEB a lookout point'
  - where: 'setting'
    claim: 'Later scripture remembers the curse turned to blessing: Deuteronomy, Joshua, Nehemiah, Micah'
    key: bd-balaam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/balaam?lang=eng'
    quote: 'the curse turned to blessing, 23–24; Deut. 23:4–5; Josh. 24:9–10; Neh. 13:2; his counsel, Num. 31:16; slain, 31:8; Josh. 13:22; Micah 6:5'
  - where: 'thread'
    claim: 'At each place the same procedure is repeated; an emphasis on three'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Balak then took Balaam to a third observation point, and the same procedure of offerings on altars was repeated (there is an emphasis on the number three in the larger Balaam narrative).'
  - where: 'thread'
    claim: 'The oracles climb: only God determines blessing (23:8); God’s blessing cannot be revoked (23:20); those who bless or curse Israel are blessed or cursed (24:9)'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'In the first, only God determines blessing and curse (23:8); in the second, God’s blessing cannot be revoked (23:20); in this, the third, those who bless or curse Israel will themselves be blessed or cursed [24:9].'
  - where: 'thread'
    claim: 'God did not let others curse Israel, though He let them bring curses on themselves'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'the Israelites’ God did not permit others to curse them collectively (although he obviously allowed them to bring curses upon themselves).'
  - where: 'thread'
    claim: 'Peor’s plague came through the counsel of Balaam (Num. 31:16)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/31?lang=eng'
    quote: 'Behold, these caused the children of Israel, through the counsel of Balaam, to commit trespass against the LORD in the matter of Peor, and there was a plague among the congregation of the LORD.'
  - where: 'section 1 plain'
    claim: '“An high place” is in Hebrew a bare hill'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/23?lang=eng'
    quote: 'HEB a bare hill'
  - where: 'section 2 plain'
    claim: '“Defy” is in Hebrew denounce'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/23?lang=eng'
    quote: 'HEB denounce'
  - where: 'section 3 plain'
    claim: 'The field of Zophim is a lookout point'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/23?lang=eng'
    quote: 'HEB a lookout point'
  - where: 'section 4 plain'
    claim: '“An unicorn” is in Hebrew a wild ox'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/23?lang=eng'
    quote: 'HEB a wild ox'
  - where: 'section 5 plain'
    claim: '“Looketh toward Jeshimon” is in Hebrew overlooks the desert'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/23?lang=eng'
    quote: 'HEB overlooks the desert'
  - where: 'note 23:1 “Seven altars, and whose offering”'
    claim: 'Altars, sacrifices, high vantage points and looking for omens can be read as divinatory activity'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'And his requests for Balak to provide altars and sacrifices, Balaam’s movement to elevated vantage points, and his efforts to “look for omens” (Numbers 24:1) can all be interpreted as part of his divinatory activities (e.g., 23:1–4).'
  - where: 'note 23:1 “Seven altars, and whose offering”'
    claim: 'McConkie: Balaam sacrificed, pleading for permission to curse Israel and receive Balak’s honors'
    key: mcconkie-balaam
    url: 'https://www.churchofjesuschrist.org/study/new-era/1972/04/the-story-of-a-prophets-madness?lang=eng'
    quote: 'built seven altars upon which Balaam also sacrificed, obviously pleading with the Lord for permission to curse Israel and receive the honors offered by the king of the Moabites.'
  - where: 'note 23:1 “Seven altars, and whose offering”'
    claim: 'One older reading: the burnt offerings were to Jehovah; seven from the creation'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/23.htm'
    quote: 'The erection of seven altars, and the sacrifice of seven animals of each kind, are to be explained from the sacredness acquired by this number, through the creation of the world in seven days'
  - where: 'note 23:1 “Seven altars, and whose offering”'
    claim: 'One older reading: offered to Jehovah, whom Balaam acknowledged as his God'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/23.htm'
    quote: 'The sacrifices were burnt-offerings, and were offered by themselves to Jehovah, whom Balaam acknowledged as his God.'
  - where: 'note 23:5 “A word put in the mouth”'
    claim: 'At the third altar Balaam no longer went to seek enchantments (24:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/24?lang=eng'
    quote: 'And when Balaam saw that it pleased the LORD to bless Israel, he went not, as at other times, to seek for enchantments, but he set his face toward the wilderness.'
  - where: 'note 23:5 “A word put in the mouth”'
    claim: 'Balaam is never called a prophet in Num. 22–24; “put a word in his mouth” is a figure of speech associated with prophecy (Deut. 18:18; Jer. 1:9)'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'the biblical narrative claims that “the Lord put a word in Balaam’s mouth,” a figure of speech that is associated with prophecy (Numbers 23:5, 16; compare Numbers 22:38; Deuteronomy 18:18; Isaiah 51:16; Jeremiah 1:9).'
  - where: 'note 23:5 “A word put in the mouth”'
    claim: 'Balaam: the word God puts in my mouth I will speak (22:38)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/22?lang=eng'
    quote: 'have I now any power at all to say any thing? the word that God putteth in my mouth, that shall I speak.'
  - where: 'note 23:7 “Took up his parable”'
    claim: 'māšāl with nāśāʾ conveys a mocking or taunting prophetic pronouncement; modern translations render it oracle'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'several prophetic passages combine the verb nāśāʾ (“to lift, raise, carry”) and the noun māšāl to convey the sense of a mocking or taunting prophetic pronouncement against someone (e.g., Numbers 23:7, 18; 24:3, 15, 20, 23; Isaiah 14:4; Habakkuk 2:6).'
  - where: 'note 23:7 “Took up his parable”'
    claim: 'Modern translations render māšāl as oracle; it can mean proverb or wise saying'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Modern translations, such as the NRSV (quoted here) and the NET, sometimes translate the Hebrew word māšāl as “oracle,” meaning pronouncement, saying, or prophecy. Although māšāl is translated as “proverb” or “wise saying” in some contexts'
  - where: 'note 23:7 “Took up his parable”'
    claim: 'The oracles are poetry, which portrays their divine origin'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'However, their poetic form serves to portray their divine origin and to accentuate their significant content.'
  - where: 'note 23:7 “Took up his parable”'
    claim: 'Balaam’s oracles are in the earliest stage of Hebrew, with the Song of the Sea and the Song of Deborah'
    key: sc-knowhy-853
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-contain-poems-in-the-middle-of-stories'
    quote: 'The Song of the Sea (Exodus 15), the Song of Deborah (Judges 5), the Blessings of Jacob (Genesis 49) and of Moses (Deuteronomy 33), the Oracles of Balaam (Numbers 23–24), the Song of Moses (Deuteronomy 32), and some of the Psalms (such as Psalm 68) are all written in this earliest stage of the language.'
  - where: 'note 23:10 “The dust of Jacob”'
    claim: 'One older reading: the words point back to Gen. 13:16; the fulfilment was already before their eyes'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/23.htm'
    quote: 'These words point back to the promise in Genesis 13:16, and applied quite as much to the existing state as to the future of Israel. The beginning of the miraculous fulfilment of the promise given to the patriarchs of an innumerable posterity, was already before their eyes'
  - where: 'note 23:10 “The dust of Jacob”'
    claim: 'Balak’s description recalls the census and the promises to the patriarchs'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Balak’s description is reminiscent of the large number of Israelites counted at the beginning of Numbers, which hearkens back to the promises made to the Patriarchs and Matriarchs in Genesis.'
  - where: 'note 23:10 “The dust of Jacob”'
    claim: 'The Hebrew word is rōbaʿ'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'רֹ֣בַע'
  - where: 'note 23:10 “The dust of Jacob”'
    claim: 'rōbaʿ means fourth part'
    key: bdb
    url: 'https://biblehub.com/hebrew/7255.htm'
    quote: 'רֹ֫בַע noun [masculine] fourth part; — ׳ר construct; of Israel Numbers 23:10; of a kab 2 Kings 6:25.'
  - where: 'note 23:10 “The dust of Jacob”'
    claim: 'One older reading: the fourth part refers to the four camps, of which Balaam saw only one'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/23.htm'
    quote: 'Balaam speaks of the fourth part with reference to the division of the nation into four camps (ch. 2), of which he could see only one from his point of view (Numbers 22:41), and therefore only the fourth part of the nation.'
  - where: 'note 23:10 “The dust of Jacob”'
    claim: 'A modern translation reads “the dust cloud of Israel”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers%2023&version=NRSVUE'
    quote: 'Who can count the dust of Jacob or number the dust cloud of Israel?'
  - where: 'note 23:10 “The death of the upright”'
    claim: 'The Hebrew word for “righteous” is yĕšārîm'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'יְשָׁרִ֔ים'
  - where: 'note 23:10 “The death of the upright”'
    claim: 'A modern translation renders it “the upright”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers%2023&version=NRSVUE'
    quote: 'Let me die the death of the upright, and let my end be like his!'
  - where: 'note 23:10 “The death of the upright”'
    claim: 'One older reading: yĕšārîm applied to Israel on account of its divine calling'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/23.htm'
    quote: 'The predicate ישׁרים is applied to Israel on account of its divine calling'
  - where: 'note 23:10 “The death of the upright”'
    claim: 'One older reading: the wish expresses that the death of a pious Israelite was a desirable good'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/23.htm'
    quote: 'it simply expressed the thought that the death of a pious Israelite was a desirable good.'
  - where: 'note 23:10 “The death of the upright”'
    claim: 'Balaam was slain with the sword (31:8)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/31?lang=eng'
    quote: 'Balaam also the son of Beor they slew with the sword.'
  - where: 'note 23:10 “The death of the upright”'
    claim: 'The report of Balaam’s killing is surprising after he had blessed Israel'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'This appears as a surprising report—the Israelites killing Balaam—since he had been depicted as acting on behalf of Yahweh/Jehovah by pronouncing blessings on the Israelites'
  - where: 'note 23:19 “God is not a man, that he should repent”'
    claim: 'The Church’s footnote on “repent” points to Ex. 32:14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/23?lang=eng'
    quote: 'Ex. 32:14'
  - where: 'note 23:19 “God is not a man, that he should repent”'
    claim: 'JST Ex. 32:14: the repentance is the people’s'
    key: jst-ex-32
    url: 'https://www.churchofjesuschrist.org/study/scriptures/jst/jst-ex/32?lang=eng'
    quote: 'And the Lord said unto Moses, If they will repent of the evil which they have done, I will spare them, and turn away my fierce wrath'
  - where: 'note 23:19 “God is not a man, that he should repent”'
    claim: 'One older reading: God repents of nothing in His counsels; His repenting is an anthropopathic expression of the pain of His love'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/23.htm'
    quote: 'With regard to His own counsels, God repents of nothing; but this does not prevent the repentance of God, understood as an anthropopathic expression, denoting the pain experienced by the love of God, on account of the destruction of its creatures'
  - where: 'note 23:19 “God is not a man, that he should repent”'
    claim: 'Samuel refused Saul in Balaam’s words (1 Sam. 15:29)'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/23.htm'
    quote: 'Samuel afterwards refused Saul''s request in these words of Balaam (Numbers 23:19), when he entreated him to revoke his rejection on the part of God (1 Samuel 15:29).'
  - where: 'note 23:19 “God is not a man, that he should repent”'
    claim: 'A modern translation: “or a mortal, that he should change his mind”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers%2023&version=NRSVUE'
    quote: 'God is not a human being, that he should lie, or a mortal, that he should change his mind.'
  - where: 'note 23:19 “God is not a man, that he should repent”'
    claim: '1 Sam. 15:29 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: 'And also the Strength of Israel will not lie nor repent: for he is not a man, that he should repent.'
  - where: 'note 23:21 “No iniquity in Jacob?”'
    claim: 'The two Hebrew nouns are ʾāwen and ʿāmāl'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'אָ֨וֶן֙ בְּ/יַעֲקֹ֔ב'
  - where: 'note 23:21 “No iniquity in Jacob?”'
    claim: 'BDB: ʾāwen trouble, sorrow, wickedness; at 23:21 “he doth not behold trouble in Jacob,” with ʿāmāl misery in parallel'
    key: bdb
    url: 'https://biblehub.com/hebrew/205.htm'
    quote: 'לֹא הִבִּיט אָוֶן בְּיַעֲקֹב Numbers 23:21 (song of Balaam), he doth not behold trouble in Jacob ("" he doth not see misery — עָמָל — in Isr)'
  - where: 'note 23:21 “No iniquity in Jacob?”'
    claim: 'BDB: ʾāwen means trouble, sorrow, wickedness'
    key: bdb
    url: 'https://biblehub.com/hebrew/205.htm'
    quote: 'trouble, sorrow, wickedness'
  - where: 'note 23:21 “No iniquity in Jacob?”'
    claim: 'A modern translation: misfortune, trouble; acclaimed as a king'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers%2023&version=NRSVUE'
    quote: 'He has not beheld misfortune in Jacob, nor has he seen trouble in Israel. The Lord their God is with them, acclaimed as a king among them.'
  - where: 'note 23:21 “No iniquity in Jacob?”'
    claim: 'One older reading: God discovers no reason for cursing; no denial of the sin of individuals'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/23.htm'
    quote: 'and therefore discovers no reason for cursing the nation. That this applied to the people solely by virtue of their calling as the holy nation of Jehovah, and consequently that there is no denial of the sin of individuals'
  - where: 'note 23:21 “No iniquity in Jacob?”'
    claim: 'One older reading: the shout of a king is Israel’s rejoicing that Jehovah rules as King among them, shown in the Exodus'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/23.htm'
    quote: 'The "shout of a king" in Israel is the rejoicing of Israel at the fact that Jehovah dwells and rules as King in the midst of it (cf. Exodus 15:18; Deuteronomy 33:5). Jehovah had manifested Himself as King, by leading them out of Egypt.'
  - where: 'note 23:23 “No enchantment against Jacob”'
    claim: 'naḥaš and qesem in 23:23; no successful enchantment against Jacob'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: '“Surely there is no [successful] enchantment [naḥaš] against Jacob, no divination [qesem] against Israel” (Numbers 23:23).'
  - where: 'note 23:23 “No enchantment against Jacob”'
    claim: 'The Hebrew preposition is bĕ- in both lines'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'נַ֨חַשׁ֙ בְּ/יַעֲקֹ֔ב'
  - where: 'note 23:23 “No enchantment against Jacob”'
    claim: 'One older reading: no augury in Jacob; God revealed His will in His word (Deut. 18:14–19)'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/23.htm'
    quote: '"For there is no augury in Jacob, and no divination in Israel. At the time it is spoken to Jacob, and to Israel what God doeth."'
  - where: 'note 23:23 “No enchantment against Jacob”'
    claim: 'One older reading: Israel was not directed to augury but enjoyed immediate revelation; God revealed His acts, counsel and will'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/23.htm'
    quote: 'God revealed His acts, His counsel, and His will to Israel in His word, which He had spoken at first to the patriarchs, and afterwards through Moses and the prophets.'
  - where: 'note 23:23 “No enchantment against Jacob”'
    claim: 'A modern translation: “See what God has done!”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers%2023&version=NRSVUE'
    quote: 'now it shall be said of Jacob and Israel, ‘See what God has done!’'
  - where: 'note 23:24 “A lion that will not lie down”'
    claim: 'One older reading: Balaam transfers Jacob’s prophecy of Judah (Gen. 49:9) to the whole nation, shaming Balak’s hopes'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/23.htm'
    quote: 'What the patriarch Jacob prophesied of Judah, the ruler among his brethren, in Genesis 49:9, Balaam here transfers to the whole nation, to put to shame all the hopes indulged by the Moabitish king of the conquest and destruction of Israel.'
  - where: 'note 23:24 “A lion that will not lie down”'
    claim: 'Lions in the Bible were metaphors for terrifying fierceness'
    key: sc-knowhy-757
    url: 'https://scripturecentral.org/knowhy/why-does-the-book-of-mormon-mention-lions'
    quote: 'they were primarily mentioned as biblical metaphors for terrifying fierceness because of their loud roars, dangerous ambushes, and ability to maul their prey.'
  - where: 'note 23:27 “Another place, another try”'
    claim: 'At the first height Balaam saw the utmost part of the people (22:41); at Peor Israel in its tents by tribes (24:2)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/22?lang=eng'
    quote: 'brought him up into the high places of Baal, that thence he might see the utmost part of the people.'
  - where: 'note 23:27 “Another place, another try”'
    claim: 'Peor’s name returns at 25:3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/25?lang=eng'
    quote: 'And Israel joined himself unto Baal-peor: and the anger of the LORD was kindled against Israel.'
  - where: 'christ'
    claim: 'The LORD turned the curse into a blessing because He loved Israel (Deut. 23:5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/23?lang=eng'
    quote: 'but the LORD thy God turned the curse into a blessing unto thee, because the LORD thy God loved thee.'
  - where: 'christ'
    claim: 'The purposes of God cannot be frustrated (D&C 3:1)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/3?lang=eng'
    quote: 'The works, and the designs, and the purposes of God cannot be frustrated, neither can they come to naught.'
  - where: 'parallels'
    claim: 'Later scripture remembers the hired curse turned to blessing'
    key: bd-balaam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/balaam?lang=eng'
    quote: 'the curse turned to blessing, 23–24; Deut. 23:4–5; Josh. 24:9–10; Neh. 13:2'
