chapter: 18
claims:
  - where: 'when'
    claim: 'The chapter is the LORD''s word to Aaron; the text gives no date'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/18?lang=eng'
    quote: 'And the Lord said unto Aaron, Thou and thy sons and thy father’s house with thee shall bear the iniquity of the sanctuary'

  - where: 'setting'
    claim: 'Numbers 17:12–13 form a transition to chapter 18, where the Levites guard the tent so that no layman perishes by approaching it'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/17.htm'
    quote: 'This and the following verse form a transition to ch. 18, in which the Levites guard the Tent, lest any layman should perish by approaching it, as Korah and his company had attempted to do.'

  - where: 'setting'
    claim: 'One older reading: the confirmation of Aaron''s priesthood is followed by the regulations, since earlier laws had no complete arrangement'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/18.htm'
    quote: 'The practical confirmation of the priesthood of Aaron and his family, on the part of God, is very appropriately followed by the legal regulations … although they contain many isolated stipulations, have not laid down any complete and comprehensive arrangement.'

  - where: 'setting'
    claim: 'The instructions are addressed directly to Aaron (18:1, 8), except the law of the Levites'' tithe, addressed to Moses as head of all Israel (18:25)'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/18.htm'
    quote: 'The instructions relating to this subject were addressed by Jehovah directly to Aaron (see Numbers 18:1 and Numbers 18:8) … and this was addressed to Moses (Numbers 18:25), as the head of all Israel.'

  - where: 'thread'
    claim: 'The chapter falls into the duties of the priests and Levites (1–7) and their revenues (8–32)'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/18.htm'
    quote: 'the legal regulations concerning the official duties of the priest and Levites (Numbers 18:1-7), and the revenues to be assigned them for their services (vv. 8-32)'

  - where: 'section 4 plain'
    claim: 'The Levites'' tenth is counted to them as grain and wine they had reaped themselves'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/18.htm'
    quote: 'as the revenue of the threshing-floor and wine-press; that is to say, as corn and wine which they had reaped themselves.'

  - where: 'note 18:1 “Answering for the sanctuary”'
    claim: 'One older reading: the iniquity of the sanctuary is its defilement by the sin of all who drew near, which the priests take on themselves and remove'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/18.htm'
    quote: '"iniquity or transgression at the sanctuary," i.e., the defilement of it by the sin of those who drew near to the sanctuary; not only of the priests and Levites, but of the whole people'

  - where: 'note 18:1 “Answering for the sanctuary”'
    claim: 'The priests were to bear it, to take it on themselves and expunge it'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/18.htm'
    quote: 'brought guilt upon the whole congregation, which the priests were to bear, i.e., to take upon themselves and expunge'

  - where: 'note 18:1 “Answering for the sanctuary”'
    claim: 'In that reading, Aaron''s father''s house is the Kohathite family, who had the oversight of the holy vessels'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/18.htm'
    quote: 'The father''s house of Aaron, i.e., the Levitical family of Kohath, was also to join in bearing the iniquity of the sanctuary, because the oversight of the holy vessels of the sanctuary devolved upon it (Numbers 4:4.).'

  - where: 'note 18:1 “Answering for the sanctuary”'
    claim: 'Another older reading takes "thy father''s house" as the whole tribe of Levi apart from the priests, and the phrase as bearing the consequences of letting the sanctuary be profaned'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/18.htm'
    quote: 'thy fathers’ house] Here it means the whole tribe of Levi, exclusive of Aaron and the priests. bear the iniquity of the sanctuary … of your priesthood] i.e. bear the consequences of the iniquity of allowing your priesthood, or the sanctuary committed to your charge, to be profaned.'

  - where: 'note 18:1 “Answering for the sanctuary”'
    claim: 'The wrath of verse 5 is the kind that came through the acts of Nadab and Abihu and of Korah''s company'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/18.htm'
    quote: 'that the wrath of God might not come again upon the children of Israel (see Numbers 8:19), - namely, through such illegal acts as Nadab and Abihu (Leviticus 10:2), and the company of Korah (Numbers 16:35), had committed.'

  - where: 'note 18:7 “The priesthood as a gift”'
    claim: 'One older reading: the office brought the priests into the closest fellowship with the Lord and was a favour of God''s grace; "a service with which I present you"'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/18.htm'
    quote: 'This office, which brought them into the closest fellowship with the Lord, was a favour accorded to them by the grace of God. This is expressed in the words, "as a service of gift (a service with which I present you) I give you the priesthood."'

  - where: 'note 18:7 “The priesthood as a gift”'
    claim: 'Another older reading: the priests had done nothing to deserve these privileges; Paul teaches the same of Christian privileges (1 Cor. 4:7)'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/18.htm'
    quote: 'The expression (if the text be correct) emphasizes the fact that the priests had done nothing to deserve these privileges; they were a free gift. … S. Paul gives similar teaching with regard to Christian privileges, 1 Corinthians 4:7.'

  - where: 'note 18:10 “Most holy for the priests, holy for their households”'
    claim: 'The most holy offerings could be eaten only by males of the priestly families in a very holy place; the heave and wave portions and firstfruits by any clean member, male or female'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/18.htm'
    quote: 'These may be eaten by any male member of the priestly families ‘in a very holy place’ (Numbers 18:9-10). … These may be eaten by any member, male or female, of the priestly families, who is free from ceremonial pollution (Numbers 18:11).'

  - where: 'note 18:10 “Most holy for the priests, holy for their households”'
    claim: 'That women might eat the second grade implies it could be eaten outside the sacred precincts'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/18.htm'
    quote: 'The fact that females might eat it implies that it might be eaten anywhere outside the sacred precincts, into which no female was admitted'

  - where: 'note 18:10 “Most holy for the priests, holy for their households”'
    claim: 'The most holy portions are the meal, sin and trespass offerings, less what is burned; the burnt offering is not mentioned because all its flesh was burned'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/18.htm'
    quote: 'the most holy gifts in the meat-offerings, sin-offerings, and trespass-offerings (Numbers 18:9, Numbers 18:10; see at Leviticus 2:3). The burnt-offerings are not mentioned, because the whole of the flesh of these was burned upon the altar'

  - where: 'note 18:20 “No land, because the LORD is their share”'
    claim: 'One older reading: the possession of the priests and Levites was the LORD Himself, not the revenues; as Levi was the LORD''s possession, the LORD was Levi''s'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/18.htm'
    quote: 'The possession of the priests and Levites did not consist in the revenues assigned to them by God, but in the possession of Jehovah, the God of Israel. In the same sense in which the tribe of Levi was the peculiar possession of Jehovah'

  - where: 'note 18:20 “No land, because the LORD is their share”'
    claim: 'The LORD was the portion of the whole tribe of Levi, not only of Aaron and his sons'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/18.htm'
    quote: 'Jehovah was the portion and inheritance, not only of Aaron and his sons, but of the whole tribe of Levi'

  - where: 'note 18:20 “No land, because the LORD is their share”'
    claim: 'The arrangement was an admonition to the whole nation to seek the highest good in possessing the Lord'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/18.htm'
    quote: 'it was also to become to the whole nation a constant admonition, inasmuch as it was a prerogative conferred upon them by the Lord, to seek the highest of all good in the possession of the Lord, as its portion and inheritance.'

  - where: 'note 18:20 “No land, because the LORD is their share”'
    claim: 'The Levites'' inheritance was the priesthood instead of land (v. 20); the forty-eight Levite cities gave them homes among the tribes'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'They were not given land as the other tribes were because their inheritance was the priesthood instead (see v. 20). In order to scatter them among the tribes and provide homes for the Levites, Moses commanded that forty-eight “Levite cities” be established'

  - where: 'note 18:20 “No land, because the LORD is their share”'
    claim: 'Joshua 18:7 calls the priesthood the Levites'' inheritance'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/18?lang=eng'
    quote: 'But the Levites have no part among you; for the priesthood of the Lord is their inheritance'

  - where: 'note 18:26 “The Levites tithe the tithe”'
    claim: 'One older reading: the Levites'' offering is reckoned to them as grain and wine they had reaped themselves'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/18.htm'
    quote: 'a tithe of the tithe for Aaron the priest … "Your heave-offering shall be reckoned to you as the corn of the threshing-floor, and the fulness … of the wine-press," i.e., according to Numbers 18:30, as the revenue of the threshing-floor and wine-press; that is to say, as corn and wine which they had reaped themselves.'

  - where: 'note 18:26 “The Levites tithe the tithe”'
    claim: 'Another older reading paraphrases verse 30: the remaining nine-tenths are for the Levites'' own use'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/18.htm'
    quote: 'then it [the remaining nine-tenths] shall be for your own use, just as the rest of Israel use their corn and wine after contributing a tithe of it to you.'

  - where: 'note 18:26 “The Levites tithe the tithe”'
    claim: 'The tithe belongs so entirely to the Levites that it is a property from which they pay a tithe'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/18.htm'
    quote: 'The tithe of the crops belongs so entirely to the Levites that it is considered a source of property from which they in turn must pay a tithe to the priests.'

  - where: 'note 18:26 “The Levites tithe the tithe”'
    claim: 'In the older reading, the nation, the Levites and the priests each acknowledged by their gifts that all they had came from the LORD'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/18.htm'
    quote: 'so the Levites, by their payment of the tenth to the priests, and the priests, by presenting a portion of their revenues upon the altar, were to make a practical confession that they had received all their revenues from the Lord their God'

  - where: 'note 18:26 “The Levites tithe the tithe”'
    claim: 'After the exile the Levites bring the tithe of the tithes to the house of God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/neh/10?lang=eng'
    quote: 'and the Levites shall bring up the tithe of the tithes unto the house of our God, to the chambers, into the treasure house.'

  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'

  - where: 'christ'
    claim: 'Hebrews 7 sets the Levites'' tithes by law beside the priest from Judah after Melchizedek'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/7?lang=eng'
    quote: 'And verily they that are of the sons of Levi, who receive the office of the priesthood, have a commandment to take tithes of the people according to the law'

  - where: 'christ'
    claim: 'Latter-day revelation emphasizes the law of the tithe as a duty and a test of faithfulness; honest payment sanctifies the individual and the land'
    key: bd-tithe
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tithe?lang=eng'
    quote: 'Latter-day revelation emphasizes the law of the tithe as a duty and a test of faithfulness (D&C 64:23–25; 85:3; 97:11; 119). The honest payment of tithing sanctifies both the individual and the land on which he lives.'

  - where: 'christ'
    claim: 'The Bible Dictionary treats the tithe paid to the Levites in Numbers 18:21–28 as part of the law of the tithe'
    key: bd-tithe
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/tithe?lang=eng'
    quote: 'In Num. 18:21–28 it is directed that tithe be paid to the Levites, who in their turn give one-tenth of what they receive to the priests'

  - where: 'note 18:7 “The priesthood as a gift”'
    claim: 'The same older reading allows the text may not be sound; the Septuagint reads differently with substantially the same meaning'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/18.htm'
    quote: 'The LXX. suggest a different reading'

  - where: 'note 18:7 “The priesthood as a gift”'
    claim: 'The Septuagint reading gives substantially the same meaning'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/18.htm'
    quote: 'but the meaning is substantially the same'

  - where: 'note 18:20 “No land, because the LORD is their share”'
    claim: 'One reading of Psalm 16:5: what Levi was outwardly holds of every believer, so the speaker takes the Levites'' share as his own'
    key: delitzsch-psalms
    url: 'https://biblehub.com/commentaries/kad/psalms/16.htm'
    quote: 'in outward relation to the nation, holds good, in all its deep spiritual significance, of every believer'
