chapter: 31
claims:
  - where: 'when'
    claim: 'The camp is on the plains of Moab by the Jordan near Jericho'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/31?lang=eng'
    quote: 'unto the camp at the plains of Moab, which are by Jordan near Jericho.'
  - where: 'when'
    claim: 'Moses was still speaking to Israel in the fortieth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: 'setting'
    claim: 'Joshua 13 names the same five kings of Midian'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/13?lang=eng'
    quote: 'whom Moses smote with the princes of Midian, Evi, and Rekem, and Zur, and Hur, and Reba, which were dukes of Sihon'
  - where: 'thread'
    claim: 'One older reading calls the campaign a holy war of the congregation, with Phinehas as priest with the trumpets'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'Phinehas was attached to the army, not as the leader of the soldiers, but as the high priest with the holy trumpets (Numbers 10:9), because the war was a holy war of the congregation against the enemies of themselves and their God.'
  - where: 'setting'
    claim: 'To be gathered to his people means to die, as already revealed at 27:13'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'and then to be gathered to his people, i.e., to die, as had already been revealed to him (Numbers 27:13). "The revenge of the children of Israel" was revenge for the wickedness which the tribes of the Midianites who dwelt on the east of Moab'
  - where: 'note 31:2 “Why Midian, and not Moab”'
    claim: 'Called the revenge of Jehovah because the seduction violated His honour'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'This revenge is called the "revenge of Jehovah" in Numbers 31:3, because the seduction had violated the divinity and honour of Jehovah.'
  - where: 'note 31:2 “Why Midian, and not Moab”'
    claim: 'Moab’s daughters acted at Midian’s instigation, so only Midian was to atone'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'The daughters of Moab had also taken part in the seduction (Numbers 25:1-2); but they had done so at the instigation of the Midianites, and not of their own accord, and therefore the Midianites only were to atone for the wickedness.'
  - where: 'note 31:6 “Phinehas and the trumpets”'
    claim: 'Phinehas went not as leader but as priest with the trumpets; holy instruments are the trumpets, not the ark or Urim and Thummim'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: '"The holy vessels" cannot mean the ark of the covenant on account of the plural, which would be inapplicable to it; nor the Urim and Thummim, because Phinehas was not yet high priest'
  - where: 'note 31:6 “Phinehas and the trumpets”'
    claim: 'Phinehas carried the trumpets because they were given to bring Israel to remembrance in war (Num 10:9)'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'Phinehas took these in his hand, because the Lord had assigned them to His congregation, to bring them into remembrance before Him in time of war, and to ensure His aid (Numbers 10:9).'
  - where: 'note 31:6 “Phinehas and the trumpets”'
    claim: 'Phinehas was chosen for the zeal he had shown at Peor'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'Phinehas had so distinguished himself by the zeal which he had displayed against the idolaters (Numbers 25:7), that it was impossible to find any other man in all the priesthood to attach to the army'
  - where: 'note 31:6 “Phinehas and the trumpets”'
    claim: 'Another older reading: “vessels” is a general term; some suggest the ephod with Urim and Thummim, but doubtful for anyone but the high priest'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/31.htm'
    quote: 'It has been suggested that the writer had in mind the ephod containing the Urim and Tummim by which Phinehas could enquire of God concerning the conduct of the battle; but it is doubtful whether that right would be ascribed to any but the high priest (cf. Numbers 27:21).'
  - where: 'note 31:6 “Phinehas and the trumpets”'
    claim: 'The war was led by Phinehas the priest, not Moses or Joshua; Eleazar stayed in the camp'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/31.htm'
    quote: 'The war being of a strictly religious character, the soldiers were apparently led not by Moses or Joshua but by Phinehas the priest, who had previously displayed his zeal against the Midianites (Numbers 25:6-8). Eleazar the chief priest is represented as staying behind in the camp'
  - where: 'note 31:7 “The five kings, and Midian afterward”'
    claim: 'The Midianites of the war dwelt east of Moab'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'the tribes of the Midianites who dwelt on the east of Moab (see at Numbers 22:4)'
  - where: 'note 31:7 “The five kings, and Midian afterward”'
    claim: 'The five kings were chiefs of the more powerful Midianite tribes; Joshua 13:21 calls them vassals of Sihon'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'The five kings were chiefs of the larger or more powerful of the Midianitish tribes, as Zur is expressly said to have been in Numbers 25:15. In Joshua 13:21 they are called "vassals of Sihon,"'
  - where: 'note 31:7 “The five kings, and Midian afterward”'
    claim: 'All the males means all the adult males, as the sequel shows'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'the victors slew all the males, i.e., all the adult males, as the sequel shows, without quarter'
  - where: 'note 31:7 “The five kings, and Midian afterward”'
    claim: 'Another older reading: Midian reappears soon after as a troublesome neighbour (Judges 6–8)'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/31.htm'
    quote: 'they are found not long afterwards as one of Israel’s most troublesome neighbours (Judges 6-8).'
  - where: 'note 31:16 “Balaam’s two portraits”'
    claim: 'The killing of Balaam is surprising after his blessings; 31:16 claims he suggested Israel be made to curse themselves, reversing his positive portrait'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'The claim in Numbers 31:16, that Balaam had suggested that the Moabites could “defeat” the Israelites by getting them to sin and thus curse themselves is a major factor in the reversal of the generally positive depiction of Balaam given in Numbers 22–24'
  - where: 'note 31:16 “Balaam’s two portraits”'
    claim: 'Balaam’s character is incidental to the story of 22–24; the overall picture is mixed and grows negative, with no good evidence for the origins of the traditions'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Overall, the Bible and post-biblical traditions present a complex and mixed picture of Balaam, one that becomes predominantly negative through later texts and time. There is currently no good evidence for the origins of these varied traditions.'
  - where: 'note 31:16 “Balaam’s two portraits”'
    claim: 'In 22–24 Balaam functions as a foil to Balak and mouthpiece for Jehovah'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Balaam functions in Numbers 22–24 primarily as a foil to Balak and as the mouthpiece for Jehovah’s will for the Israelites.'
  - where: 'note 31:16 “Balaam’s two portraits”'
    claim: 'The KnoWhy names Balaam’s blessing and his counsel at 31:16 as an apparent inconsistency'
    key: sc-knowhy-850
    url: 'https://scripturecentral.org/knowhy/why-do-parts-of-old-testament-stories-seem-to-contradict-themselves'
    quote: 'In Numbers 22-24, for example, Balaam blesses the Hebrews in the name of the Lord, but in Numbers 31:16, he causes them to sin against the Lord.'
  - where: 'note 31:16 “Balaam’s two portraits”'
    claim: 'The documentary hypothesis would explain why parts of Numbers are positive and parts negative about Balaam'
    key: sc-knowhy-850
    url: 'https://scripturecentral.org/knowhy/why-do-parts-of-old-testament-stories-seem-to-contradict-themselves'
    quote: 'This would explain, for example, why some parts of Numbers are positive about Balaam and some are negative'
  - where: 'note 31:16 “Balaam’s two portraits”'
    claim: 'Even if there are sources, the final form can be read as a unity'
    key: sc-knowhy-850
    url: 'https://scripturecentral.org/knowhy/why-do-parts-of-old-testament-stories-seem-to-contradict-themselves'
    quote: 'Realizing that the Books of Moses may contain various sources can help readers understand the text a little more. Realizing that the final form of the text can be read as a unity is also important'
  - where: 'note 31:16 “Balaam’s two portraits”'
    claim: 'Joshua 13:22 calls Balaam the soothsayer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/13?lang=eng'
    quote: 'Balaam also the son of Beor, the soothsayer, did the children of Israel slay with the sword'
  - where: 'note 31:17 “The command concerning the captives”'
    claim: 'Commanded war was the exception; the Lord emphasized peace; those who acted violently without direction did not follow God'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'While the Lord sometimes commanded the Israelites to go to battle, this was the exception rather than the rule. Above all, the Lord also emphasized the need for His people to seek peace and avoid violence.'
  - where: 'note 31:17 “The command concerning the captives”'
    claim: 'The ancient world was more violent; the accounts tell what did happen, without excusing it'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'In general, accounts of violence in the Old Testament tell us what did happen. This does not excuse unrighteous behavior, but understanding the context of the ancient world can help us approach what we are reading with greater humility and charity.'
  - where: 'note 31:17 “The command concerning the captives”'
    claim: 'Moses was angry because the women, at Balaam’s instigation, caused the falling away at Peor'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'he was angry with the commanders, because they had left all the women alive, since it was they who had been the cause, at Balaam''s instigation, of the falling away of the Israelites from Jehovah to worship Peor'
  - where: 'note 31:17 “The command concerning the captives”'
    claim: 'One older reading: the women killed were those who might have joined Peor’s worship, to keep the congregation from it'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'all were to be put to death who had known the lying with a man, and therefore might possibly have been engaged in the licentious worship of Peor (Numbers 25:2), to preserve the congregation from all contamination from that abominable idolatry.'
  - where: 'note 31:17 “The command concerning the captives”'
    claim: 'The girls kept alive are counted with the spoil (vv. 35, 40)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/31?lang=eng'
    quote: 'And thirty and two thousand persons in all, of women that had not known man by lying with him.'
  - where: 'note 31:19 “Unclean after a commanded war”'
    claim: 'The seven days outside the camp and purification on the third and seventh days is the legal purification for contact with the dead'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'Moses commanded the men of war to remain for seven days outside the camp of the congregation, to carry out upon the third and seventh day the legal purification of such persons and things as had been rendered unclean through contact with dead bodies.'
  - where: 'note 31:19 “Unclean after a commanded war”'
    claim: 'Eleazar gave fuller instructions in accordance with chapter 19; metal through fire then sprinkled; the rest through water'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'Eleazar, whose duty it was as high priest to see that the laws of purification were properly observed, issued fuller instructions with reference to the purification of the different articles, in accordance with the law in ch. 19.'
  - where: 'note 31:19 “Unclean after a commanded war”'
    claim: 'Metal is drawn through fire and then sprinkled with water of purification; what will not bear fire, through water'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'was to be drawn through the fire, that it might become clean, and was then to be sprinkled with water of purification (Numbers 19:9); but everything that would not bear the fire was to be drawn through water.'
  - where: 'note 31:27 “Half to the soldiers, half to the congregation”'
    claim: 'Equal shares for fighters and those who stayed was an ancient custom traced to David (1 Sam 30:24); the tax is not mentioned elsewhere in the OT'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/31.htm'
    quote: 'Those who fought and those who remained behind were to receive equal shares. This was an ancient custom, which was traced to the action of David (1 Samuel 30:24 f.). But before the appropriation by individuals, a religious tax was to be paid.'
  - where: 'note 31:27 “Half to the soldiers, half to the congregation”'
    claim: 'The tax is not mentioned elsewhere in the Old Testament'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/31.htm'
    quote: 'Such a tax is not mentioned elsewhere in the O.T., but perhaps, like the foregoing regulation, it had an ancient custom behind it.'
  - where: 'note 31:27 “Half to the soldiers, half to the congregation”'
    claim: 'One five-hundredth is one fifth of one percent, one fiftieth two percent'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'one person and one head of cattle were to be handed over to Eleazar the priest out of every 500 (i.e., one-fifth per cent.), as a heave-offering for Jehovah; and of the other half that was set apart for the children of Israel, i.e., for the congregation, one out of every fifty (i.e., 2 per cent.)'
  - where: 'note 31:27 “Half to the soldiers, half to the congregation”'
    claim: 'The priests’ share was probably for their maintenance, like the tithes'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'these Moses handed over to Eleazar, in all probability for the maintenance of the priests, in the same manner as the tithes (Numbers 18:26-28, and Leviticus 27:30-33)'
  - where: 'note 31:27 “Half to the soldiers, half to the congregation”'
    claim: 'The booty totals and the Levites’ portion'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'Of the other half, the Levites received the fiftieth part (Numbers 31:43-47), that is to say, 6750 head of small cattle, 720 oxen, 610 asses, and 320 girls.'
  - where: 'note 31:50 “Gold for not one man lost”'
    claim: 'The officers gave the gold out of gratitude for the preservation of every man, feeling unworthy of such grace'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'they felt constrained to give a practical expression to their gratitude for this miraculous preservation of the whole of the men, by presenting a sacrificial gift to Jehovah'
  - where: 'note 31:50 “Gold for not one man lost”'
    claim: 'For the expiation of their souls, with the feeling they were not worthy of such grace'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'offered them to the Lord "for the expiation of their souls" (see at Leviticus 1:4), namely, with the feeling that they were not worthy of any such grace'
  - where: 'note 31:50 “Gold for not one man lost”'
    claim: 'The gift was placed in the treasury of the sanctuary as a memorial (cf. Ex 30:16)'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'This gift, presented on the part of the officers, was brought into the tabernacle "as a memorial of the children of Israel before Jehovah" (cf. Exodus 30:16); that is to say, it was placed in the treasury of the sanctuary.'
  - where: 'note 31:50 “Gold for not one man lost”'
    claim: 'The loss of no man is a striking proof of God’s protection'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'The fact that the Israelites did not lose a single man in the battle, is certainly a striking proof of the protection of God'
  - where: 'christ'
    claim: 'Christ is the Great Jehovah of the Old Testament, always perfectly merciful and just'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'how Jesus Christ, “the Great Jehovah of the Old Testament,” could be associated with actions that seem so harsh or violent … God, who “is the same yesterday, today, and forever,” has always been perfectly merciful and perfectly just.'
  - where: 'christ'
    claim: 'Old Testament violence is no justification for violence today'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'Additionally, we should not think that examples of violence in the Old Testament would ever be justification for committing violence today.'
  - where: 'christ'
    claim: 'Accounts remain difficult to comprehend'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'While much about the accounts of violence and destruction in the Old Testament remains difficult to fully comprehend'
  - where: 'christ'
    claim: 'Everything God does is motivated by a desire to bless His children'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'Even though we cannot fully comprehend all the instances of divinely sanctioned violence in the Old Testament, we can trust that God is perfectly just, merciful, and longsuffering. Everything He does is motivated by a desire to bless His children and help them return to Him.'
  - where: 'note 31:6 “Phinehas and the trumpets”'
    claim: 'Phinehas went not as leader but as priest with the trumpets'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'Phinehas was attached to the army, not as the leader of the soldiers, but as the high priest with the holy trumpets (Numbers 10:9)'
  - where: 'note 31:16 “Balaam’s two portraits”'
    claim: 'Under the documentary hypothesis an editor combined the sources, keeping contradictions'
    key: sc-knowhy-850
    url: 'https://scripturecentral.org/knowhy/why-do-parts-of-old-testament-stories-seem-to-contradict-themselves'
    quote: 'The Documentary Hypothesis states that an editor or redactor combined all these sources together at some point but kept much of the source material intact, including contradictions.'
  - where: 'note 31:16 “Balaam’s two portraits”'
    claim: 'Balaam’s character is incidental to the story of 22–24 (Pike, quoting Ashley with approval)'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Ashley has correctly observed, “The text of [Numbers] chs. 22–24 is not [explicitly] concerned to pronounce [judgment] on the matter [of Balaam’s virtue]. Balaam’s character is incidental to the story.”'
  - where: 'note 31:17 “The command concerning the captives”'
    claim: 'The ancient world was more violent than ours'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'People in that time endured a more violent existence than many modern people can comprehend.'
  - where: 'note 31:7 “The five kings, and Midian afterward”'
    claim: 'Joshua calls the five kings dukes of Sihon, king of the Amorites in Heshbon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/13?lang=eng'
    quote: 'all the kingdom of Sihon king of the Amorites, which reigned in Heshbon, whom Moses smote with the princes of Midian, Evi, and Rekem, and Zur, and Hur, and Reba, which were dukes of Sihon'
  - where: 'when'
    claim: 'Aaron died in the fortieth year after the Exodus, before the camp reached the plains of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'and died there, in the fortieth year after the children of Israel were come out of the land of Egypt, in the first day of the fifth month.'
  - where: 'note 31:7 “The five kings, and Midian afterward”'
    claim: 'Another older reading takes verse 7 as an imaginative description of success, since Midian did not disappear'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/31.htm'
    quote: 'An imaginative description of success. If it were historically true, Midian would have disappeared from history'
  - where: 'note 31:16 “Balaam’s two portraits”'
    claim: 'No ancient document reflecting one of the hypothesized sources has been found'
    key: sc-knowhy-850
    url: 'https://scripturecentral.org/knowhy/why-do-parts-of-old-testament-stories-seem-to-contradict-themselves'
    quote: 'no ancient document reflecting one of these sources has ever been found'
  - where: 'note 31:17 “The command concerning the captives”'
    claim: 'One older reading: the boys were killed to exterminate the nation, which could not be perpetuated in the women'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/31.htm'
    quote: 'The object of the command to put all the male children to death, was to exterminate the whole nation, as it could not be perpetuated in the women.'
