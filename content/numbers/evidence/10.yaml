chapter: 10
claims:
  - where: 'when'
    claim: 'The cloud lifted on the twentieth day of the second month of the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/10?lang=eng'
    quote: 'And it came to pass on the twentieth day of the second month, in the second year, that the cloud was taken up from off the tabernacle of the testimony.'
  - where: 'setting'
    claim: 'The Bible Dictionary divides Numbers after 10:10: preparation for departure, then the march from Sinai to the borders of Canaan'
    key: bd-numbers
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/numbers?lang=eng'
    quote: '(1) 1:1–10:10, preparation for departure from Sinai. (2) 10:11–14:45, march from Sinai to borders of Canaan; the sending of the spies and their report; the refusal to enter Canaan'
  - where: 'setting'
    claim: 'Numbers preserves fragments of ancient poetry, among them 10:35–36'
    key: bd-numbers
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/numbers?lang=eng'
    quote: 'The book is remarkable for the number of fragments of ancient poetry preserved in it (6:24–26; 10:35–36; 21:14–15, 17–18, 27–30).'
  - where: 'setting'
    claim: 'At Sinai the Lord had revealed His law, made the covenant and had the tabernacle built; Numbers 1–10 tells the last weeks there'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'where the Lord had already revealed his law to the Israelites, where the Israelites had entered into a covenant relationship with him, and where they had then constructed the tabernacle according to divine design (Exodus 18–40). Numbers 1:1–10:11 relates events during the Israelites’ final weeks at Mount Sinai'
  - where: 'setting'
    claim: 'The last weeks at Sinai included the census of fighting men, the dedication of the tabernacle and the first anniversary Passover'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'including the numbering of Israelite fighting men “from twenty years old and upward” (Numbers 1:3), the dedication of the tabernacle (Numbers 7; compare Leviticus 8–9), and the first anniversary celebration of the Passover'
  - where: 'setting'
    claim: 'The cloud moved not quite a year after Israel arrived at Sinai'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Not quite a year after arriving at Mount Sinai, the bright cloud—which represented the Lord’s presence with the Israelites and which had appeared over the tabernacle—began to move.'
  - where: 'setting'
    claim: 'Israel came to the wilderness of Sinai in the third month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/19?lang=eng'
    quote: 'In the third month, when the children of Israel were gone forth out of the land of Egypt, the same day came they into the wilderness of Sinai.'
  - where: 'thread'
    claim: 'The cloud set the time of moving, but signals were needed to order so large a march'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/10.htm'
    quote: 'Although God Himself appointed the time for removal and encampment by the movement of the cloud of His presence, signals were also requisite for ordering and conducting the march of so numerous a body'
  - where: 'thread'
    claim: 'The march begun here ends with the spies and the refusal to enter Canaan'
    key: bd-numbers
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/numbers?lang=eng'
    quote: '(2) 10:11–14:45, march from Sinai to borders of Canaan; the sending of the spies and their report; the refusal to enter Canaan, and God’s punishment for disobedience.'
  - where: 'section 1 plain'
    claim: '“Of a whole piece” is in Hebrew “hammered work”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/10?lang=eng'
    quote: '“a whole piece”: HEB hammered work.'
  - where: 'section 3 plain'
    claim: 'Verse 21: the tabernacle was set up before the Kohathites arrived'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/10?lang=eng'
    quote: 'HEB the tabernacle was set up before their arrival.'
  - where: 'note 10:2 “Silver trumpets, not rams’ horns”'
    claim: 'The ḥăṣōṣĕrâ was a long straight metal tube with flaring end, distinct from the shofar, a ram''s horn used by watchmen, warriors and priests'
    key: bdb
    url: 'https://biblehub.com/hebrew/2689.htm'
    quote: 'The חֲצֹצְרָה, or (sacred) clarion, was a long, straight, slender metal tube, with flaring end … distinguished thus from the שׁוֺפָר which was originally a ram’s horn … used by watchmen, warriors, etc., as well as priests'
  - where: 'note 10:2 “Silver trumpets, not rams’ horns”'
    claim: 'As a sacred instrument the clarion was used especially by priests'
    key: bdb
    url: 'https://biblehub.com/hebrew/2689.htm'
    quote: '2 as sacred instr. 2 Kings 12:14, especially for use by priests'
  - where: 'note 10:2 “Silver trumpets, not rams’ horns”'
    claim: 'Miqshah, perhaps hammered work, is used only of metals: the cherubim, the lampstand and the trumpets'
    key: bdb
    url: 'https://biblehub.com/hebrew/4749.htm'
    quote: 'perhaps hammered work, only of metals (originally turner’s work?); — absolute ׳מ, of cherubim in tabernacle Exodus 25:18; Exodus 37:7, lampstand Exodus 25:31,36; Exodus 37:17,22; Numbers 8:4 (twice in verse), clarions Numbers 10:2.'
  - where: 'note 10:7 “Two calls: a blast and an alarm”'
    claim: 'BDB: blowing the clarion is a single long blast to gather; the tĕrûʿâ a series of quick blasts for the camps to move and in battle'
    key: bdb
    url: 'https://biblehub.com/hebrew/2689.htm'
    quote: 'a. ׳תקע בח (of blowing a single long blast) Numbers 10:3,4,7,8, to gather congregation … b. ׳תקע תרועה בח, or ׳הריע בח (of sounding alarm, — a series of quick blasts) for camps to move Numbers 10:5,6, also in battle, Numbers 10:9'
  - where: 'note 10:7 “Two calls: a blast and an alarm”'
    claim: 'Tĕrûʿâ: alarm of war, war-cry; blast for march'
    key: bdb
    url: 'https://biblehub.com/hebrew/8643.htm'
    quote: 'shout or blast of war, alarm, or joy … 1 alarm of war, war-cry … 2 blast for march: ׳תקע ת Numbers 10:5,6'
  - where: 'note 10:7 “Two calls: a blast and an alarm”'
    claim: 'One older reading: tāqaʿ short sharp tones, the alarm a continued peal'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/10.htm'
    quote: 'But to call the congregation together they were to blow, not to sound an alarm. תּקע signifies blowing in short, sharp tones. הריע equals תּרוּעה תּקע, blowing in a continued peal.'
  - where: 'note 10:9 “Remembered before the LORD”'
    claim: 'One older reading: the trumpets called Israel to remembrance before Jehovah in war and at the feasts'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/10.htm'
    quote: 'The blast of these trumpets was to call Israel to remembrance before Jehovah in time of war and on their feast-days.'
  - where: 'note 10:9 “Remembered before the LORD”'
    claim: 'The same reading points to Exodus 28:29 for “for a memorial”'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/10.htm'
    quote: 'On the object, viz., "for a memorial," see Exodus 28:29'
  - where: 'note 10:9 “Remembered before the LORD”'
    claim: 'BDB glosses the purpose of the blasts in 10:9–10 as “to be remembered before Y”'
    key: bdb
    url: 'https://biblehub.com/hebrew/2689.htm'
    quote: 'on festivals, over sacrifice, ''to be remembered before ׳י,'' Numbers 10:10'
  - where: 'note 10:9 “Remembered before the LORD”'
    claim: 'Phinehas took the trumpets to the war on Midian'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/31?lang=eng'
    quote: 'them and Phinehas the son of Eleazar the priest, to the war, with the holy instruments, and the trumpets to blow in his hand.'
  - where: 'note 10:12 “Paran is the goal, not the first stop”'
    claim: 'Verse 12 is a summary heading; Paran was the third station, reached after Hazeroth'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/10.htm'
    quote: 'In these words, the whole journey from the desert of Sinai to the desert of Paran is given summarily, or as a heading … The "desert of Paran" was not the first station, but the third; and the Israelites did not arrive at it till after they had left Hazeroth'
  - where: 'note 10:12 “Paran is the goal, not the first stop”'
    claim: 'Paran was near Kadesh, whence the spies were sent'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/10.htm'
    quote: 'in contrast with the desert of Paran, in the neighbourhood of Kadesh, whence the spies were sent out to Canaan'
  - where: 'note 10:12 “Paran is the goal, not the first stop”'
    claim: 'The talk with Hobab took place before the departure though told after it'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/10.htm'
    quote: 'Moses persuaded Hobab the Midianite … preceded the departure in order of time; but it is placed between the setting out and the march itself, as being subordinate to the main events.'
  - where: 'note 10:12 “Paran is the goal, not the first stop”'
    claim: 'From Sinai the camp went to Kibroth-hattaavah, then Hazeroth'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'And they departed from Kibroth-hattaavah, and encamped at Hazeroth.'
  - where: 'note 10:21 “The tent goes ahead of what it holds”'
    claim: 'Only here is the Levites'' order of march given; the Gershonites and Merarites set up the dwelling before the Kohathites arrived with the holy things'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/10.htm'
    quote: 'the order in which the different sections of the Levites drew out and marched being particularly described in this place alone'
  - where: 'note 10:21 “The tent goes ahead of what it holds”'
    claim: 'They set up the dwelling against the Kohathites'' arrival so the holy things could be placed in it at once'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/10.htm'
    quote: 'set up the dwelling, עד־בּאם, against their (the Kohathites'') arrival, so that they might place the holy things at once within it.'
  - where: 'note 10:21 “The tent goes ahead of what it holds”'
    claim: 'Footnote: the tabernacle was set up before their arrival'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/10?lang=eng'
    quote: 'HEB the tabernacle was set up before their arrival.'
  - where: 'note 10:29 “Hobab, and whose father-in-law”'
    claim: 'Raguel is another spelling of Reuel, who was Jethro'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'Raguel is an alternate spelling of Reuel (see Exodus 2:18), who was Jethro, Moses’ father-in-law.'
  - where: 'note 10:29 “Hobab, and whose father-in-law”'
    claim: 'The manual''s quoted reading calls Hobab Moses'' brother-in-law'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: '“Hobab, brother-in-law of Moses was persuaded, though at first unwilling to accompany Israel'
  - where: 'note 10:29 “Hobab, and whose father-in-law”'
    claim: 'Jethro is also called Jether and Reuel'
    key: bd-jethro
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jethro?lang=eng'
    quote: 'Also called Jether and Reuel, a prince and priest of Midian who gave Moses a home after his flight from Egypt and afterwards became his father-in-law'
  - where: 'note 10:29 “Hobab, and whose father-in-law”'
    claim: 'Ḥōtēn means wife''s father; used of Moses'' father-in-law, including Num. 10:29 and Judg. 1:16; 4:11'
    key: bdb
    url: 'https://biblehub.com/hebrew/2859.htm'
    quote: 'חֹתֵן verbal noun 1. masculine wife’s father … usually of Moses’ wife’s father Exodus 3:1 … Numbers 10:29 (J), Judges 1:16; Judges 4:11'
  - where: 'note 10:29 “Hobab, and whose father-in-law”'
    claim: 'BDB lists Hobab as son of Reuel and ḥōtēn of Moses'
    key: bdb
    url: 'https://biblehub.com/hebrew/2246.htm'
    quote: 'חֹבָב proper name, masculine … — son of Reuel, חֹתֵן of Moses (see חתן), Numbers 10:29 (J E), Judges 4:11'
  - where: 'note 10:29 “Hobab, and whose father-in-law”'
    claim: 'Reuel gave Moses his daughter Zipporah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/2?lang=eng'
    quote: 'And Moses was content to dwell with the man: and he gave Moses Zipporah his daughter.'
  - where: 'note 10:29 “Hobab, and whose father-in-law”'
    claim: 'Judges calls Hobab the father-in-law of Moses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/4?lang=eng'
    quote: 'Now Heber the Kenite, which was of the children of Hobab the father in law of Moses, had severed himself from the Kenites'
  - where: 'note 10:31 “Eyes for the wilderness”'
    claim: 'One older reading: the cloud gave the signs and general direction; Hobab could point out springs, oases and pasture'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/10.htm'
    quote: 'not only giving the sign for them to break up and to encamp, but showing generally the direction they were to take; yet Hobab, who was well acquainted with the desert'
  - where: 'note 10:31 “Eyes for the wilderness”'
    claim: 'Hobab could point out the springs, oases and pasture hidden in the desert'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/10.htm'
    quote: 'if he only pointed out, in those places where the sign to encamp was given by the cloud, the springs, oases, and plots of pasture which are often buried quite out of sight'
  - where: 'note 10:31 “Eyes for the wilderness”'
    claim: 'The same reading concludes Hobab went, from Judges 1:16'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/10.htm'
    quote: 'What Hobab ultimately decided to do, we are not told … This is raised to a certainty by the fact that, at the commencement of the period of the Judges, the sons of the brother-in-law of Moses went into the desert of Judah'
  - where: 'note 10:31 “Eyes for the wilderness”'
    claim: 'The manual''s reading: Jehovah gave general directions, Hobab knew the area; his family''s later inheritance shows he went'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'Although Jehovah gave general directions, Hobab knew the area and could help locate specific trails, campsites, etc. That he and his family went and did become heirs to lands in the land of Israel is apparent later from Judges 1:16 and 4:11'
  - where: 'note 10:31 “Eyes for the wilderness”'
    claim: 'The Kenites were probably Midianite; Moses'' marriage caused their friendship with Israel'
    key: bd-kenites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kenites?lang=eng'
    quote: 'Probably a Midianite tribe, descended from Abraham by his wife Keturah. Moses’ marriage with the daughter of Jethro, a prince and priest of Midian, was also a cause of the long-standing friendship between the Kenites and Israelites'
  - where: 'note 10:31 “Eyes for the wilderness”'
    claim: 'The children of the Kenite went up with Judah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/1?lang=eng'
    quote: 'And the children of the Kenite, Moses’ father in law, went up out of the city of palm trees with the children of Judah into the wilderness of Judah'
  - where: 'note 10:33 “The ark at the head of the march”'
    claim: 'One older reading: the ark was carried separately in front of the whole army, with the cloud above it'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/10.htm'
    quote: 'To this end the ark of the covenant was carried separately from the rest of the sacred things, in front of the whole army; so that the cloud which went before them floated above the ark, leading the procession'
  - where: 'note 10:33 “The ark at the head of the march”'
    claim: 'Verses 33–34 are one thought in two clauses; the first resting place was Kibroth-hattaavah, not Taberah'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/10.htm'
    quote: 'The one thought that the ark of the covenant, with the cloud soaring above it, led the way and sheltered those who were marching, is divided into two clauses'
  - where: 'note 10:33 “The ark at the head of the march”'
    claim: 'The resting place after three days was Kibroth-hattaavah'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/10.htm'
    quote: 'The resting-place which the ark of the covenant found at the end of three days, is not mentioned in Numbers 10:34; it was not Tabeerah, however (Numbers 11:3), but Kibroth-hattaavah'
  - where: 'note 10:33 “The ark at the head of the march”'
    claim: 'Chapter 2 sets the tabernacle and Levites in the midst of the camp'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/2?lang=eng'
    quote: 'Then the tabernacle of the congregation shall set forward with the camp of the Levites in the midst of the camp'
  - where: 'note 10:35 “Moses’ words at the ark”'
    claim: 'Verses 35–36 are one of the fragments of ancient poetry in Numbers'
    key: bd-numbers
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/numbers?lang=eng'
    quote: 'The book is remarkable for the number of fragments of ancient poetry preserved in it (6:24–26; 10:35–36; 21:14–15, 17–18, 27–30).'
  - where: 'note 10:35 “Moses’ words at the ark”'
    claim: 'Num. 10:35–36 is among the Old Testament songs outside the Psalter that arguably predate Solomon''s temple'
    key: sc-knowhy-251
    url: 'https://scripturecentral.org/knowhy/why-was-singing-hymns-a-part-of-nephite-worship-services'
    quote: 'There are several songs recorded in the Old Testament (and outside of the Psalter) that arguably predate the Temple of Solomon. Examples include: Exodus 15:1–18; Numbers 10:35–36'
  - where: 'note 10:35 “Moses’ words at the ark”'
    claim: 'One older reading: the words Moses habitually said; the ark as the throne of Jehovah and pledge of His presence'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/10.htm'
    quote: 'Moses could speak in this way, because he knew that Jehovah and the ark of the covenant were inseparably connected, and saw in the ark of the covenant, as the throne of Jehovah, a material pledge of the gracious presence of the Almighty God.'
  - where: 'note 10:35 “Moses’ words at the ark”'
    claim: '“Return” means turn back to dwell among the people after scattering the enemies'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/10.htm'
    quote: 'return to the ten thousands of the hosts of Israel, i.e., after having scattered Thine enemies, turn back again to Thy people to dwell among them.'
  - where: 'note 10:35 “Moses’ words at the ark”'
    claim: 'Words said when the ark removed and when it came to rest'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/10.htm'
    quote: 'the words which Moses was in the habit of uttering, both when the ark removed and when it came to rest again'
  - where: 'note 10:35 “Moses’ words at the ark”'
    claim: 'Psalm 68 opens with the same words, said about God'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/68?lang=eng'
    quote: 'Let God arise, let his enemies be scattered: let them also that hate him flee before him.'
  - where: 'christ'
    claim: 'The Lord promises to go before those He sends'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'And whoso receiveth you, there I will be also, for I will go before your face. I will be on your right hand and on your left, and my Spirit shall be in your hearts, and mine angels round about you, to bear you up.'
  - where: 'explore'
    claim: 'Later uses of the priests'' trumpets: war, the ark brought up, the temple, the second temple'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/10.htm'
    quote: 'the trumpets were blown by the priests in war (Numbers 31:6; 2 Chronicles 13:12, 2 Chronicles 13:14 …) as well as on joyful occasions, such as at the removal of the ark (1 Chronicles 15:24 …), at the consecration of Solomon''s temple (2 Chronicles 5:12'
  - where: 'explore'
    claim: 'The Rechabites belonged to the Kenites'
    key: bd-kenites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kenites?lang=eng'
    quote: 'The Rechabites were a sect or family belonging to this tribe (1 Chr. 2:55).'
  - where: 'parallels'
    claim: 'Moses recalls the command to leave Horeb'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'The Lord our God spake unto us in Horeb, saying, Ye have dwelt long enough in this mount'
