chapter: 17
claims:
  # ---------- setting / thread ----------
  - where: 'setting'
    claim: 'Korah, a Levite, with Dathan, Abiram and 250 princes rose against Moses and Aaron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'And they rose up before Moses, with certain of the children of Israel, two hundred and fifty princes of the assembly, famous in the congregation, men of renown'
  - where: 'setting'
    claim: 'The earth swallowed the rebels and their houses'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'And the earth opened her mouth, and swallowed them up, and their houses, and all the men that appertained unto Korah, and all their goods.'
  - where: 'setting'
    claim: 'Fire from the LORD consumed the 250 who offered incense'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'And there came out a fire from the Lord, and consumed the two hundred and fifty men that offered incense.'
  - where: 'setting'
    claim: 'The incense had shown Aaron appointed; the rod a further confirmation, to silence the murmuring'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/17.htm'
    quote: 'Whilst the Lord had thus given a practical proof to the people, that Aaron was the high priest appointed by Him … by allowing the high-priestly incense offered by Aaron to expiate His wrath … He also gave them a still further confirmation of His priesthood, by a miracle which was well adapted to put to silence all the murmuring of the congregation.'
  - where: 'setting'
    claim: 'In the Hebrew Bible these verses are 17:16–28'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/17.htm'
    quote: '[Heb. 17:16–28] The blossoming of Aaron’s staff'
  - where: 'thread'
    claim: 'Moses promised Korah the LORD would show who is holy and bring near him whom he has chosen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'Even to morrow the Lord will shew who are his, and who is holy; and will cause him to come near unto him: even him whom he hath chosen will he cause to come near unto him.'
  - where: 'thread'
    claim: 'The people’s question is the bridge into chapter 18, where the Levites guard the tabernacle'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/17.htm'
    quote: 'This and the following verse form a transition to ch. 18, in which the Levites guard the Tent, lest any layman should perish by approaching it'
  - where: 'section 3 plain'
    claim: '“Are we all to die?” as an alternative rendering of verse 13'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/17.htm'
    quote: 'Every one who comes near to the dwelling of Jehovah dies; are we all to die?'
  # ---------- notes ----------
  - where: 'note 17:2 “A rod for each tribe”'
    claim: 'Matteh means staff, rod, branch, and tribe'
    key: bdb
    url: 'https://biblehub.com/hebrew/4294.htm'
    quote: 'a staff, rod, shaft, branch, a tribe'
  - where: 'note 17:2 “A rod for each tribe”'
    claim: 'As tribe, originally a company led by a chief with a staff'
    key: bdb
    url: 'https://biblehub.com/hebrew/4294.htm'
    quote: '3 tribe (183 t.), originally company led by chief with staff'
  - where: 'note 17:2 “A rod for each tribe”'
    claim: 'In Numbers 17 the word is the staff as badge of leader or ruler'
    key: bdb
    url: 'https://biblehub.com/hebrew/4294.htm'
    quote: 'staff as badge of leader or ruler מַטֵּהעֹֿז Jeremiah 48:17 ("" מַקֵּל), compare Psalm 110:2; so Numbers 17:17 (4 t. in verse) + 10 t. Numbers 17'
  - where: 'note 17:2 “A rod for each tribe”'
    claim: 'A man’s rod the sign of his position as ruler; with a prince a sceptre'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/17.htm'
    quote: 'A man''s rod was the sign of his position as ruler in the house and congregation; with a prince the rod becomes a sceptre, the insignia of rule (Genesis 49:10).'
  - where: 'note 17:2 “A rod for each tribe”'
    claim: 'Aaron’s rod among other staffs used as a means of determining God’s will'
    key: sc-knowhy-405
    url: 'https://scripturecentral.org/knowhy/why-were-the-three-witnesses-shown-the-liahona'
    quote: 'In the Bible, we learn that Aaron’s rod, among other staffs, was used as an appropriate means of determining God’s will (Numbers 17:1–11).'
  - where: 'note 17:2 “A rod for each tribe”'
    claim: 'The Liahona’s spindles seem to have worked similarly, as a means for the Lord to communicate'
    key: sc-knowhy-405
    url: 'https://scripturecentral.org/knowhy/why-were-the-three-witnesses-shown-the-liahona'
    quote: 'The Liahona’s “spindles” or “directors” seemed to similarly function as a means by which the Lord could communicate with His people.'
  - where: 'note 17:3 “Aaron''s name on Levi''s rod”'
    claim: 'Korah was a Levite, son of Izhar, son of Kohath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'Now Korah, the son of Izhar, the son of Kohath, the son of Levi, and Dathan and Abiram, the sons of Eliab, and On, the son of Peleth, sons of Reuben, took men:'
  - where: 'note 17:3 “Aaron''s name on Levi''s rod”'
    claim: 'Each rod stood for the head of the tribe; for Levi the tribe-head was Aaron'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/17.htm'
    quote: 'because each rod was to stand for the head of their fathers'' houses, i.e., for the existing head of the tribe; and in the case of Levi, the tribe-head was Aaron.'
  - where: 'note 17:3 “Aaron''s name on Levi''s rod”'
    claim: 'Verse 3 refers to Levi’s three clans, with Aaron as their one representative'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/17.htm'
    quote: 'This apparently refers not to all the tribes but to the tribe of Levi with its three divisions or clans, the Gershonites, Kohathites, and Merarites. They were to have only one representative, i.e. Aaron.'
  - where: 'note 17:5 “A sign to end the murmuring”'
    claim: 'The congregation murmured the day after, “Ye have killed the people of the LORD”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'But on the morrow all the congregation of the children of Israel murmured against Moses and against Aaron, saying, Ye have killed the people of the Lord.'
  - where: 'note 17:5 “A sign to end the murmuring”'
    claim: 'The verb means to quiet so that it will not rise again'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/17.htm'
    quote: 'שׁכך, Hiph., to cause to sink, to bring to rest, construed with מעל in a pregnant signification, to quiet in such a way that it will not rise again.'
  - where: 'note 17:5 “A sign to end the murmuring”'
    claim: 'The blossoming fulfilled Moses’ word of 16:5 and accredited Aaron'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/17.htm'
    quote: 'Thus was the word fulfilled which Moses had spoken at the commencement of the rebellion of the company of Korah (Numbers 16:5), and that in a way which could not fail to accredit him before the whole congregation as sent of God.'
  - where: 'note 17:6 “Twelve rods or thirteen?”'
    claim: 'Aaron’s rod among the twelve; Ephraim and Manasseh counted as Joseph'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/17.htm'
    quote: 'As only twelve rods were taken for all the tribes of Israel, and Levi was included among them, Ephraim and Manasseh must have been reckoned as the one tribe of Joseph, as in Deuteronomy 27:12.'
  - where: 'note 17:6 “Twelve rods or thirteen?”'
    claim: 'Thirteen tribes in the camp, Ephraim and Manasseh as two'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/17.htm'
    quote: 'In the arrangement of the camp there were thirteen tribes, Ephraim and Manasseh (the house of Joseph) being reckoned as two.'
  - where: 'note 17:6 “Twelve rods or thirteen?”'
    claim: 'Aaron’s staff in the midst of the staves, perhaps the middle one'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/17.htm'
    quote: 'the staff of Aaron was in the midst of their staves] We are perhaps to think of the thirteen staves as stuck into the ground and standing erect, Aaron’s staff being the middle one.'
  - where: 'note 17:8 “Buds, blossoms and ripe almonds in a night”'
    claim: 'A natural explanation is ruled out: a cut rod would not bear ripe fruit in a night'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/17.htm'
    quote: 'that Moses had laid several almond rods in the holy place, which had just been freshly cut off, that he might see the next day which of them would flower the best during the night, is directly at variance with the words of the text, and also with the fact, that a rod even freshly cut off, when laid in a dry place, would not bear ripe fruit in a single night.'
  - where: 'note 17:8 “Buds, blossoms and ripe almonds in a night”'
    claim: 'The miracle a symbol of the priesthood, founded on the Spirit, not natural gifts'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/17.htm'
    quote: 'And so Aaron had naturally no pre-eminence above the heads of the other tribes. But the priesthood was founded not upon natural qualifications and gifts, but upon the power of the Spirit, which God communicates according to the choice of His wisdom'
  - where: 'note 17:8 “Buds, blossoms and ripe almonds in a night”'
    claim: 'The fruit showed Aaron bore the fruit expected of him'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/17.htm'
    quote: 'This showed that Aaron was not only qualified for his calling, but administered his office in the full power of the Spirit, and bore the fruit expected of him.'
  - where: 'note 17:8 “Buds, blossoms and ripe almonds in a night”'
    claim: 'The almond flowers earliest; its name shaqed means awake'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/17.htm'
    quote: 'The almond rod was especially adapted to exhibit this, as an almond-tree flowers and bears fruit the earliest of all the trees, and has received its name of שׁקד, "awake," from this very fact (cf. Jeremiah 1:11).'
  - where: 'note 17:8 “Buds, blossoms and ripe almonds in a night”'
    claim: 'The verb behind “yielded” here means to ripen, bear ripe almonds'
    key: bdb
    url: 'https://biblehub.com/hebrew/1580.htm'
    quote: '3 transitive ripen, bear ripe (almonds) Numbers 17:23'
  - where: 'note 17:8 “Buds, blossoms and ripe almonds in a night”'
    claim: 'The Church’s manual prints this reading on the significance of the budding'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: '(18-10) Numbers 17:1–13. What Is the Significance of the Budding of Aaron’s Rod? … “The miracle which God wrought here as the Creator of nature, was at the same time a significant symbol of the nature and meaning of the priesthood.'
  - where: 'note 17:10 “Kept before the testimony”'
    claim: 'The Hebrew says sons of rebellion, an idiom; Ezekiel’s house of rebellion'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/17.htm'
    quote: 'the sons of rebellion] A common Heb. idiom to express a quality or characteristic … ‘House of rebellion’ is found very frequently in Ezek. as a designation of the house of Israel.'
  - where: 'note 17:10 “Kept before the testimony”'
    claim: 'Before the testimony means before the ark of the covenant'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/17.htm'
    quote: 'These rods were to be laid by Moses in the tabernacle before the testimony, or ark of the covenant (Exodus 25:21; Exodus 29:42).'
  - where: 'note 17:10 “Kept before the testimony”'
    claim: '1 Kings 8:9: nothing in the ark but the tables'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-kgs/8?lang=eng'
    quote: 'There was nothing in the ark save the two tables of stone, which Moses put there at Horeb'
  - where: 'note 17:10 “Kept before the testimony”'
    claim: 'The rod’s keeping a pledge of Aaron’s election; no need to think it stayed green'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/17.htm'
    quote: 'The preservation of the rod before the ark of the covenant, in the immediate presence of the Lord, was a pledge to Aaron of the continuance of his election, and the permanent duration of his priesthood; though we have no need to assume, that through a perpetual miracle the staff continued green and blossoming.'
  - where: 'note 17:12 “The cry chapter 18 answers”'
    claim: 'A salutary terror, no fruit of faith, but preventing fresh rebellion of the rejected generation'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/17.htm'
    quote: 'This miracle awakened a salutary terror in all the people … Even if this fear of death was no fruit of faith, it was fitted for all that to prevent any fresh outbreaks of rebellion on the part of the rejected generation.'
  - where: 'note 17:12 “The cry chapter 18 answers”'
    claim: 'Verses 12–13 a transition to chapter 18, where the Levites guard the Tent'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/17.htm'
    quote: 'This and the following verse form a transition to ch. 18, in which the Levites guard the Tent, lest any layman should perish by approaching it'
  - where: 'note 17:12 “The cry chapter 18 answers”'
    claim: 'Chapter 18: no wrath any more upon Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/18?lang=eng'
    quote: 'And ye shall keep the charge of the sanctuary, and the charge of the altar: that there be no wrath any more upon the children of Israel.'
  # ---------- christ ----------
  - where: 'christ'
    claim: 'Hebrews 5: called of God as was Aaron; Christ a priest'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/5?lang=eng'
    quote: 'For a man to hold the priesthood, he must be called of God as was Aaron—Christ was a priest forever after the order of'
  - where: 'christ'
    claim: 'Hebrews 9 is the chapter where the Mosaic ordinances prefigure Christ’s ministry'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'The Mosaic ordinances prefigured Christ’s ministry'
  - where: 'christ'
    claim: 'Article of Faith 5'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=eng'
    quote: 'We believe that a man must be called of God, by prophecy, and by the laying on of hands by those who are in authority, to preach the Gospel and administer in the ordinances thereof.'
