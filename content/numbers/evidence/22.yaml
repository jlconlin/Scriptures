chapter: 22
claims:
  - where: 'when'
    claim: 'The events on the plains of Moab fall in the last year or so of the forty years'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'relating events during the final year or so of the Israelites’ forty years in the wilderness'
  - where: 'setting'
    claim: 'The plains of Moab lie northeast of the Dead Sea, across the Jordan from Jericho'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'the region just northeast of the Dead Sea, on the opposite side of the Jordan River from Jericho (which was in Canaan; see Numbers 22:1)'
  - where: 'setting'
    claim: 'Israel had not attacked Moab; the victories over Sihon and Og gave Balak reason for concern'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'The Israelites had not attacked the Moabites, but the Israelites’ success in defeating the Amorite kings Sihon and Og (chapter 21) provided Balak ample reason for concern.'
  - where: 'setting'
    claim: 'Chapters 22–36 are the events on the plains of Moab, just outside the promised land'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'Chapters 22–36: Events on the plains of Moab just outside the promised land.'
  - where: 'setting'
    claim: 'On the plains come Balaam (22–24), Peor (25) and the census of the new generation (26)'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'the account of Balaam (Numbers 22–24; discussed below), the Israelites’ false worship and immoral involvement with the Moabites (chapter 25), a second Israelite numbering (or census), now that the people of the Exodus generation were dead'
  - where: 'setting'
    claim: 'Later scripture remembers the curse turned to blessing, Balaam’s counsel and his death'
    key: bd-balaam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/balaam?lang=eng'
    quote: 'the curse turned to blessing, 23–24; Deut. 23:4–5; Josh. 24:9–10; Neh. 13:2; his counsel, Num. 31:16; slain, 31:8'
  - where: 'setting'
    claim: 'Later writings grow increasingly negative about Balaam'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'In general, an “increasingly negative characterization of Balaam” is displayed in later biblical and postbiblical writings.'
  - where: 'setting'
    claim: 'Micah remembers Balaam as one who helped overturn Balak’s intent'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Balaam here is depicted as a hero who had helped to overturn Balak’s evil intentions to destroy the Israelites.'
  - where: 'thread'
    claim: 'In chapters 22–24 Balaam is above all a foil to Balak and the mouthpiece of Jehovah’s will'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Balaam functions in Numbers 22–24 primarily as a foil to Balak and as the mouthpiece for Jehovah’s will for the Israelites.'
  - where: 'thread'
    claim: 'The episode teaches that prophecy comes by divine, not human, inclination'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'The biblical Balaam episode reiterates that prophetic pronouncements come via divine not human inclination.'
  - where: 'thread'
    claim: 'Jehovah’s use of a non-Israelite diviner adds irony to the account'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Yahweh/Jehovah using a non-Israelite with a prior reputation of connections with other deities really adds ironic punch to the portrayal in Numbers 22–24.'
  - where: 'note 22:4 “Midian beside Moab”'
    claim: 'Midianites descend from Abraham and Keturah; mostly in northwestern Arabia but sometimes in Moab'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'The Bible depicts the Midianites as the descendants of Midian, the fourth son of Abraham and his concubine Keturah (Genesis 25:1–2; 1 Chronicles 1:32). Although the Midianites were primarily located in northwestern Arabia, biblical accounts occasionally mention them in Moab'
  - where: 'note 22:4 “Midian beside Moab”'
    claim: 'By Moses’ day there were Midianite clans east and north of the Dead Sea'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'there were various Midianite clans, some of which lived in areas east and north of the Dead Sea and maintained shifting relationships with other peoples from those areas'
  - where: 'note 22:4 “Midian beside Moab”'
    claim: 'Midianites appear several times in Numbers 22–31'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'This is another seemingly minor detail that is an important element in the biblical account, since Midianites are mentioned several times in Numbers 22–31.'
  - where: 'note 22:5 “Where Balaam lived”'
    claim: 'A modern translation reads Pethor as on the Euphrates, in the land of Amaw'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'But the same passage in the NRSV reads, “[Balak] sent messengers to Balaam son of Beor at Pethor, which is on the Euphrates, in the land of Amaw.”'
  - where: 'note 22:5 “Where Balaam lived”'
    claim: 'Pethor is often linked with Pitru on the upper Euphrates; nāhār can mean the Euphrates or other rivers'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Many scholars have suggested connecting Pethor with Pitru, a town named in an Assyrian source, apparently situated on the upper Euphrates River (the site itself has not been convincingly identified).'
  - where: 'note 22:5 “Where Balaam lived”'
    claim: 'The Euphrates would mean a journey of about 350 miles'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'it is amazing that Balak both knew about Balaam and his abilities and was able to persuade him to journey to Moab, a distance of about 350 miles.'
  - where: 'note 22:5 “Where Balaam lived”'
    claim: 'The Samaritan Pentateuch, Syriac and Vulgate read “the land of the Ammonites”'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'This latter approach—emending ʿammô to ʿammōn—is supported by the Samaritan Pentateuch, the Syriac, and the Vulgate (ancient versions of the Hebrew scriptures), all of which read “the land of the Ammonites” in Numbers 22:5.'
  - where: 'note 22:5 “Where Balaam lived”'
    claim: 'The question is unresolved; a home nearer Moab is preferred by many scholars, though 23:7 and Deut. 23:4 point to Aram'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Thus, the question of Balaam’s homeland remains unresolved, but a location closer to Moab seems more likely in the context of the story as we have it'
  - where: 'note 22:5 “Where Balaam lived”'
    claim: 'The Bible Dictionary places Pethor by the Euphrates'
    key: bd-balaam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/balaam?lang=eng'
    quote: 'A prophet from Pethor by the Euphrates, bribed by Balak, king of Moab, to curse the Israelites'
  - where: 'note 22:5 “Where Balaam lived”'
    claim: 'The Deir ʿAlla inscription, about 800 BC, near the Jabbok, names Balaam son of Beor, a seer of the gods'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Combination I of the inscription contains phrases such as “Balaam son of Beor” (I.2, 4; compare Numbers 22:5), identifying him as a “seer of the gods [ḥzh ʾlhn]” (I.1).'
  - where: 'note 22:5 “Where Balaam lived”'
    claim: 'The inscription was found at Deir ʿAlla, near where the Jabbok enters the Jordan, and dates to about 800 BC'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Deir ‘Alla is a site in the eastern Jordan River valley, about one mile north of where the biblical Jabbok River flows into the Jordan.'
  - where: 'note 22:5 “Where Balaam lived”'
    claim: 'Dated about 800 BC'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Dated to about 800 BC, most of the surviving text is primarily written in black ink, although some words are in red.'
  - where: 'note 22:5 “Where Balaam lived”'
    claim: 'The inscription shows Balaam traditions in the region and his reputation; in it he hears from gods other than Jehovah'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'the Deir ‘Alla inscription strikingly demonstrates that Balaam traditions existed in that region for quite some time.'
  - where: 'note 22:5 “Where Balaam lived”'
    claim: 'In the inscription Balaam receives communication from deities other than Jehovah'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'And as related in the Deir ‘Alla inscription, Balaam receives divine communication from deities other than Yahweh/Jehovah.'
  - where: 'note 22:6 “He whom thou cursest”'
    claim: 'Cursing differs from divining: it manipulates the future against an adversary'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Cursing is different from just divining the future; cursing involves manipulating the future against an adversary.'
  - where: 'note 22:6 “He whom thou cursest”'
    claim: 'Balak sought Balaam because of a reputation as a sorcerer'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Numbers 22:6 and other verses thus strongly suggest that Balaam had a well-known reputation as a sorcerer (or else, why would Balak seek him out for such activity?)'
  - where: 'note 22:6 “He whom thou cursest”'
    claim: 'On the promise to Abraham, God did not let others curse Israel, though Israel could bring curses on itself'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Based on the promise in Genesis 12:2–3, the Israelites’ God did not permit others to curse them collectively (although he obviously allowed them to bring curses upon themselves).'
  - where: 'note 22:7 “Fees for divination”'
    claim: 'The rewards of divination are qĕsāmîm, “fees for divination”; Balaam is called qōsēm, soothsayer, in Josh. 13:22'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'When Balak sent messengers to hire Balaam, they brought with them “the fees for divination [qĕsāmı̂m]” (Numbers 22:7).[18] And in the King James translation of Joshua 13:22, Balaam is called a diviner or “soothsayer [qōsēm].”'
  - where: 'note 22:7 “Fees for divination”'
    claim: 'Definition of divination'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Divination is the attempt to discern divine will—typically by utilizing ritual activity—and to thus read the future through various manifestations in the natural world.'
  - where: 'note 22:7 “Fees for divination”'
    claim: 'Deut. 18:10 bans the same practice in the same words'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'A few biblical texts condemn and ban divination in general among the Israelites, which indicates the prevalence of divination (e.g., Deuteronomy 18:10–12, including qōsēm qĕsāmı̂m in verse 10'
  - where: 'note 22:7 “Fees for divination”'
    claim: 'Altars, sacrifices, high vantage points and looking for omens can be read as divination'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'his requests for Balak to provide altars and sacrifices, Balaam’s movement to elevated vantage points, and his efforts to “look for omens” (Numbers 24:1) can all be interpreted as part of his divinatory activities'
  - where: 'note 22:7 “Fees for divination”'
    claim: 'The Hebrew of 22:7 has qĕsāmîm'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'קְסָמִ֖ים'
  - where: 'note 22:18 “Was Balaam a prophet of the LORD?”'
    claim: 'Balaam is never called a prophet in Numbers 22–24, yet acts as a prophet for the Lord'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'While he is never called a prophet in Numbers 22–24, there are many examples in these chapters of Balaam acting as a prophet for the Lord.'
  - where: 'note 22:18 “Was Balaam a prophet of the LORD?”'
    claim: 'His intentions were not always good'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'Although the Lord used Balaam to serve His purposes, there are indications that Balaam’s intentions were not always good.'
  - where: 'note 22:18 “Was Balaam a prophet of the LORD?”'
    claim: 'Balaam calls Jehovah his God'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Balaam even refers to Jehovah as his God: “I [Balaam] could not go beyond the command of the Lord [yhwh] my God” (Numbers 22:18; compare Numbers 22:8, 13; 23:5, 12, 16; 24:11).'
  - where: 'note 22:18 “Was Balaam a prophet of the LORD?”'
    claim: 'The LORD putting a word in his mouth is the language of prophecy'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: '“the Lord put a word in Balaam’s mouth,” a figure of speech that is associated with prophecy (Numbers 23:5, 16; compare Numbers 22:38; Deuteronomy 18:18; Isaiah 51:16; Jeremiah 1:9)'
  - where: 'note 22:18 “Was Balaam a prophet of the LORD?”'
    claim: 'The Bible Dictionary calls him a prophet, bribed by Balak'
    key: bd-balaam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/balaam?lang=eng'
    quote: 'A prophet from Pethor by the Euphrates, bribed by Balak, king of Moab, to curse the Israelites'
  - where: 'note 22:18 “Was Balaam a prophet of the LORD?”'
    claim: 'McConkie reads the second night as Balaam importuning the Lord for leave, anxious for riches'
    key: mcconkie-balaam
    url: 'https://www.churchofjesuschrist.org/study/new-era/1972/04/the-story-of-a-prophets-madness?lang=eng'
    quote: 'And yet, still anxious to receive the riches and honors offered by the king, Balaam lodged his visitors and importuned the Lord for permission to go with them and curse Israel.'
  - where: 'note 22:18 “Was Balaam a prophet of the LORD?”'
    claim: 'McConkie: Balaam was a prophet who lost his soul by setting his heart on the world'
    key: mcconkie-balaam
    url: 'https://www.churchofjesuschrist.org/study/new-era/1972/04/the-story-of-a-prophets-madness?lang=eng'
    quote: 'Balaam, the prophet, inspired and mighty as he once was, lost his soul in the end because he set his heart on the things of this world rather than the riches of eternity.'
  - where: 'note 22:18 “Was Balaam a prophet of the LORD?”'
    claim: 'Pike’s reading: a non-Israelite diviner for hire who worshipped Jehovah when it served him, though not exclusively'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'A different and probably better assessment of the biblical and non-biblical evidence is that Balaam was a non-Israelite diviner for hire. He was someone who worshipped Jehovah when it served his purposes, but Balaam did not exclusively worship Jehovah'
  - where: 'note 22:18 “Was Balaam a prophet of the LORD?”'
    claim: 'Scripture Helps: Balaam in the end gave way to Balak and betrayed Israel'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'The scriptures indicate that Balaam eventually succumbed to Balak’s pressure and betrayed Israel.'
  - where: 'note 22:18 “Was Balaam a prophet of the LORD?”'
    claim: 'Balaam appears as diviner, prophet and seer'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Thus, Balaam functions in overlapping roles as depicted in the biblical text: diviner, prophet, and seer.'
  - where: 'note 22:18 “Was Balaam a prophet of the LORD?”'
    claim: '2 Peter and Jude use Balaam for those who stray for love of gain'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'In the New Testament, 2 Peter 2:15 and Jude 1:11 both cite Balaam as illustrating that those who go astray from God do so because they love the gain of the world.'
  - where: 'note 22:20 “If thou wilt”'
    claim: 'The manuscript of the Joseph Smith Translation revises 22:20'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/79'
    quote: 'Verse 20th. And God came unto Balaam at night, and said unto him " if the men come to call thee, rise up, if thou wilt go with them; but yet, " the word which I shall say unto thee, shalt thou speak,'
  - where: 'note 22:20 “If thou wilt”'
    claim: 'The manuscript calls the rest of Numbers correct'
    key: jsp-ot2
    url: 'https://www.josephsmithpapers.org/paper-summary/old-testament-revision-2/79'
    quote: 'The remainder of the Chapters in this book are all correct——'
  - where: 'note 22:20 “If thou wilt”'
    claim: 'The King James reading makes God seem to vacillate'
    key: horton-jst-pentateuch
    url: 'https://rsc.byu.edu/joseph-smith-translation/insights-exodus-leviticus-numbers-deuteronomy'
    quote: 'A strange paradox exists in the Authorized Version.'
  - where: 'note 22:20 “If thou wilt”'
    claim: 'The question the King James raises'
    key: horton-jst-pentateuch
    url: 'https://rsc.byu.edu/joseph-smith-translation/insights-exodus-leviticus-numbers-deuteronomy'
    quote: 'Does God vacillate?'
  - where: 'note 22:20 “If thou wilt”'
    claim: 'The JST places responsibility on Balaam to choose; whether it restores or clarifies is unknown'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'This reading places responsibility on Balaam to choose whether he would go and to consider his reasons for meeting with Balak.'
  - where: 'note 22:20 “If thou wilt”'
    claim: 'No way of knowing whether the revision restores the original or clarifies'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'But, there is no way of knowing whether this JST revision is meant to restore the original text or whether it is a latter-day prophetic emendation to provide more clarity to a difficult passage.'
  - where: 'note 22:20 “If thou wilt”'
    claim: 'Other answers: he went without waiting to be summoned; or 22:22–35 was once a separate account'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'It has been suggested that God’s anger arose simply because Balaam did not wait to be summoned by Balak’s men, rather Balaam got up and set forth with no further prompting.'
  - where: 'note 22:20 “If thou wilt”'
    claim: 'The common current assumption of an inserted account'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Thus, a common current assumption is that this apparent incongruity of the text results from the insertion of a previously independent account (what now comprises 22:22–35) about Balaam'
  - where: 'note 22:20 “If thou wilt”'
    claim: 'There is no explicit and compelling answer'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Therefore, there is currently no explicit and compelling answer to the question of why God was angry with Balaam.'
  - where: 'note 22:22 “The angel as a satan”'
    claim: 'The Hebrew of 22:22 has lĕśāṭān, “for an adversary”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'שָׂטָ֣ן'
  - where: 'note 22:22 “The angel as a satan”'
    claim: 'The same noun stands in 22:32, rendered “withstand” in the King James'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'שָׂטָ֔ן'
  - where: 'note 22:22 “The angel as a satan”'
    claim: 'A modern translation renders 22:32 “as an adversary”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+22&version=NRSVUE'
    quote: 'I have come out as an adversary because your way is perverse before me.'
  - where: 'note 22:22 “The angel as a satan”'
    claim: '“The satan” in Numbers 22 and elsewhere; scholars debate whether this figure is evil'
    key: sc-knowhy-43
    url: 'https://scripturecentral.org/knowhy/why-did-lehi-suppose-the-existence-of-satan'
    quote: 'While it is true that Satan (or “the satan”) appears in such passages as Numbers 22, Job 1–2, Zechariah 3, and 1 Chronicles 21, biblical scholars have argued over whether this figure is necessarily an evil entity opposed to God'
  - where: 'note 22:28 “The seer who could not see”'
    claim: 'The ass’s speech is attributed to divine power; readings run from literal to figurative'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Interpretations range from the literal (Jehovah had power to cause a donkey to speak, so the donkey really spoke, just as the text claims) to the figurative'
  - where: 'note 22:28 “The seer who could not see”'
    claim: 'The irony: the man hired for seeing could not see the angel'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'a main and ironic point of this narrative is that the man who was hired because of his reputation for sorcery and “seeing” divine intent could not see God’s angel.'
  - where: 'note 22:28 “The seer who could not see”'
    claim: 'Mouth and eyes opened prepare for the mouth opened to bless'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'This experience serves as narrative preparation for when Jehovah later opened Balaam’s mouth to pronounce blessings on the Israelites.'
  - where: 'note 22:28 “The seer who could not see”'
    claim: 'Jehovah speaks through whomever he chooses: an ass, a diviner, Moses, all his people'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'the biblical account emphasizes that Yahweh/Jehovah could speak through whatever and whomever he chose, whether through a donkey, a non-Israelite diviner, Moses (12:6–8), or potentially all of the covenant people (11:29'
  - where: 'note 22:28 “The seer who could not see”'
    claim: 'His later claim to see the vision of the Almighty is a development after failing to see the angel'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'At this point in the narrative, Balaam’s claim to “see” the things of God comes as a significant development because earlier Balaam could not see the Lord’s angel right in front of him, even when his donkey could (22:23–31).'
  - where: 'note 22:32 “A headlong way”'
    claim: 'BDB: yāraṭ, be precipitate; the way is precipitate (headlong) before me'
    key: bdb
    url: 'https://biblehub.com/hebrew/3399.htm'
    quote: 'Qal Perfect יָרַט Numbers 22:32, app. with subject הַדֶּרֶךְ; the way is precipitate, (RVm headlong) before me'
  - where: 'note 22:32 “A headlong way”'
    claim: 'BDB: perhaps read “thou hast rushed recklessly in front of me”'
