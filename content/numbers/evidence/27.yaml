chapter: 27
claims:
  - where: 'when'
    claim: 'Aaron died in the fortieth year after the Exodus; the census before this chapter was taken on the plains of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'And Aaron the priest went up into mount Hor at the commandment of the Lord, and died there, in the fortieth year after the children of Israel were come out of the land of Egypt'
  - where: 'setting'
    claim: 'The second census was taken by Moses and Eleazar on the plains of Moab; none of the Sinai count was left but Caleb and Joshua; the land divided by names'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'These are they that were numbered by Moses and Eleazar the priest, who numbered the children of Israel in the plains of Moab by Jordan near Jericho.'
  - where: 'setting'
    claim: 'The daughters receive their inheritance before Eleazar and Joshua'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/17?lang=eng'
    quote: 'And they came near before Eleazar the priest, and before Joshua the son of Nun, and before the princes, saying, The Lord commanded Moses to give us an inheritance among our brethren.'
  - where: 'thread'
    claim: 'Zelophehad appears in the census only as a man with daughters and no sons'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'And Zelophehad the son of Hepher had no sons, but daughters: and the names of the daughters of Zelophehad were Mahlah, and Noah, Hoglah, Milcah, and Tirzah.'
  - where: 'note 27:1 “Five daughters the census left out”'
    claim: 'The census counted men as representing the families that qualified for inheritance; families without a male heir were overlooked'
    key: langi-epilogue
    url: 'https://rsc.byu.edu/voices-latter-day-saint-women-pacific-asia/epilogue'
    quote: 'were numbered as a representation of the families in Israel that qualified for an inheritance (Numbers 26:51–56). However, and perhaps unbeknownst to Moses, this process caused families without a living male inheritor to be overlooked.'
  - where: 'note 27:1 “Five daughters the census left out”'
    claim: 'The daughters challenged the practice that only sons inherited land, and the laws were revised'
    key: strathearn-ruth
    url: 'https://rsc.byu.edu/covenant-compassion/naomi-ruth-boaz'
    quote: 'The daughters of Zelophehad successfully challenged the practice that only sons inherited land because their father had five daughters but no sons; as a result, the biblical laws were revised'
  - where: 'note 27:1 “Five daughters the census left out”'
    claim: 'The land divided according to the number of names counted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'Unto these the land shall be divided for an inheritance according to the number of names.'
  - where: 'note 27:3 “Died in his own sin”'
    claim: 'Zelophehad was not of Korah''s company, which might have excluded him, but died of a sin common to all who died in the wilderness'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/27.htm'
    quote: 'had not taken part in the rebellion of the company of Korah, which might have occasioned his exclusion from any participation in the promised land, but had simply died "through his (own) sin," i.e., on account of such a sin as every one commits, and such as all who died in the wilderness had committed as well as he.'
  - where: 'note 27:3 “Died in his own sin”'
    claim: 'None of the men counted at Sinai was left but Caleb and Joshua'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'For the Lord had said of them, They shall surely die in the wilderness. And there was not left a man of them, save Caleb the son of Jephunneh, and Joshua the son of Nun.'
  - where: 'note 27:4 “Keeping a father''s name”'
    claim: 'Without land the family would die out if the daughters married elsewhere; with land their husbands would enter on it and the father''s name continue'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/27.htm'
    quote: 'In that case his family would have become extinct, if his daughters had married into other families or tribes. On the other hand, if his daughters received a possession of their own among the brethren of their father, the name of their father would be preserved by it, since they could then marry husbands who would enter upon their landed property, and their father''s name and possession would be perpetuated through their children.'
  - where: 'note 27:4 “Keeping a father''s name”'
    claim: 'In chapter 36 the men of Gilead raise the question of the daughters'' marriage; the answer keeps them in the tribe'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/36?lang=eng'
    quote: 'Let them marry to whom they think best; only to the family of the tribe of their father shall they marry.'
  - where: 'note 27:5 “Moses takes the case to the LORD”'
    claim: 'After Moses the daughters received their inheritance before Eleazar, Joshua and the princes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/17?lang=eng'
    quote: 'Therefore according to the commandment of the Lord he gave them an inheritance among the brethren of their father.'
  - where: 'note 27:8 “The order of heirs”'
    claim: 'The brothers inherited with the understanding that the widow would be cared for; a widow''s ostracon pleads for the use of land'
    key: pike-inscriptions
    url: 'https://scripturecentral.org/archive/books/book-chapter/israelite-inscriptions-time-jeremiah-and-lehi'
    quote: 'If the man had neither sons nor daughters, his brother(s) received the inheritance, with the understanding that his widow would be cared for. In this ostracon the widow requests the use, if not the outright ownership, of land or some other form of inheritance, presumably to (better) provide for her own needs.'
  - where: 'note 27:8 “The order of heirs”'
    claim: 'The man named was probably her husband or a relative; perhaps the husband''s brother had the wheat field'
    key: pike-inscriptions
    url: 'https://scripturecentral.org/archive/books/book-chapter/israelite-inscriptions-time-jeremiah-and-lehi'
    quote: 'Amasyahu was probably her deceased husband or a close relative (the husband’s brother who had already received the wheat field?).'
  - where: 'note 27:8 “The order of heirs”'
    claim: 'The widow''s plea comes from Judah in the time of Jeremiah and Lehi'
    key: pike-inscriptions
    url: 'https://scripturecentral.org/archive/books/book-chapter/israelite-inscriptions-time-jeremiah-and-lehi'
    quote: 'The pleas of the reaper (Mesad Hashavyahu ostracon) and of the widow (Moussaieff ostracon 2) demonstrate the ongoing need for social justice and economic assistance among the common Judahites of Jeremiah and Lehi’s day.'
  - where: 'note 27:8 “The order of heirs”'
    claim: 'Ostraca are inscriptions on broken pottery'
    key: pike-inscriptions
    url: 'https://scripturecentral.org/archive/books/book-chapter/israelite-inscriptions-time-jeremiah-and-lehi'
    quote: 'potsherds (broken pieces of fired pottery) provided a ready, inexpensive source of “scrap paper.” Ostraca (inscriptions on potsherds) were usually produced by writing with a pen and ink'
  - where: 'note 27:8 “The order of heirs”'
    claim: 'Concerns about authenticity have been raised, and Pardee rebuts them'
    key: pike-inscriptions
    url: 'https://scripturecentral.org/archive/books/book-chapter/israelite-inscriptions-time-jeremiah-and-lehi'
    quote: 'Concerns about authenticity have been raised by Israel Eph’al and Joseph Naveh … Pardee briefly rebuts these concerns and provides additional bibliography'
  - where: 'note 27:12 “The mountains of Abarim”'
    claim: 'Abarim is the mountains from which Moses viewed the land'
    key: bd-abarim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/abarim?lang=eng'
    quote: 'The mountains from which Moses viewed the Promised Land (Num. 27:12; 33:47; Deut. 32:49).'
  - where: 'note 27:12 “The mountains of Abarim”'
    claim: 'Aaron was gathered to his people because of the rebellion at Meribah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'Aaron shall be gathered unto his people: for he shall not enter into the land which I have given unto the children of Israel, because ye rebelled against my word at the water of Meribah.'
  - where: 'note 27:16 “The God of the spirits of all flesh”'
    claim: 'The title implies God is the Father of all, as revealed in Moses 6:51'
    key: brown-premortal-life
    url: 'https://rsc.byu.edu/latter-day-saint-essentials/premortal-life'
    quote: 'He received a revelation of information once made known to Moses: “I [God] made the world, and men before they were in the flesh” (Moses 6:51). This likewise reflects the implication in Numbers 16:22 that God is the Father of all, and hence he is “the God of the spirits of all flesh.”'
  - where: 'note 27:16 “The God of the spirits of all flesh”'
    claim: 'Moses and Aaron used the title when they fell on their faces in Korah''s rebellion'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'And they fell upon their faces, and said, O God, the God of the spirits of all flesh, shall one man sin, and wilt thou be wroth with all the congregation?'
  - where: 'note 27:18 “Joshua set apart by the laying on of hands”'
    claim: 'The event is the ordination and setting apart of Joshua to the priesthood Moses held'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'The event described here is the ordination and setting apart of Joshua to the priesthood held by Moses.'
  - where: 'note 27:18 “Joshua set apart by the laying on of hands”'
    claim: 'McConkie: setting apart to presidency or special responsibility comes by the laying on of hands, citing Num. 27:18–23'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: '“‘According to the order of God,’ ordination to offices in the priesthood is performed by the laying on of hands. … Setting apart to positions of presidency, administration, or special responsibility comes in the same way. (Fifth Article of Faith; Num. 27:18–23; Deut. 34:9.)” (McConkie, Mormon Doctrine, p. 438.)'
  - where: 'note 27:18 “Joshua set apart by the laying on of hands”'
    claim: 'Joshua full of the spirit of wisdom because Moses laid hands on him'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/34?lang=eng'
    quote: 'And Joshua the son of Nun was full of the spirit of wisdom; for Moses had laid his hands upon him'
  - where: 'note 27:20 “Some of Moses'' honour, not all of it”'
    claim: 'hôd means splendour, majesty, vigour; used of a king and of God''s glory as king; Num. 27:20 cited'
    key: bdb
    url: 'https://biblehub.com/hebrew/1935.htm'
    quote: 'הוֺד noun masculineJob 37:22 splendour, majesty, vigour (chiefly in poetry) … הוֺדְךָ Numbers 27:20 … 1 splendour, majesty, of king … 2 divine splendour, majesty, light & glory which God wears as king'
  - where: 'note 27:20 “Some of Moses'' honour, not all of it”'
    claim: 'The word in the verse is hôd (H1935)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/27?lang=eng'
    quote: 'And thou shalt put some of thine honour upon him, that all the congregation of the children of Israel may be obedient.'
  - where: 'note 27:20 “Some of Moses'' honour, not all of it”'
    claim: 'Moses'' authority was bound up with his person; Joshua received only what his office needed; he was under the Urim, neither lawgiver nor absolute governor'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/27.htm'
    quote: 'authority of Moses were not to be entirely transferred to Joshua, for they were bound up with his own person alone (cf. Numbers 12:6-8), but only so much of it as he needed for the discharge of the duties of his office. Joshua was to be neither the lawgiver nor the absolute governor of Israel, but to be placed under the judgment of the Urim'
  - where: 'christ'
    claim: 'Joshua means “Jehovah is salvation”'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'Moses changed the name of the leader of the tribe of Ephraim from Oshea (meaning “salvation”) to Joshua (meaning “Jehovah is salvation”).'
  - where: 'christ'
    claim: 'No one builds up the church except ordained by one with authority, known to the church'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/42?lang=eng'
    quote: 'it shall not be given to any one to go forth to preach my gospel, or to build up my church, except he be ordained by some one who has authority, and it is known to the church that he has authority'
  - where: 'note 27:18 “Joshua set apart by the laying on of hands”'
    claim: 'The Church''s footnote on “spirit” in 27:18 points to the Topical Guide, God, Spirit of'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/27?lang=eng'
    quote: '“spirit”: TG God, Spirit of.'
  - where: 'note 27:20 “Some of Moses'' honour, not all of it”'
    claim: 'The Church''s footnote gives the alternative rendering “invest him with some of your authority”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/27?lang=eng'
    quote: '“put”: OR invest him with some of your authority.'
  - where: 'christ'
    claim: 'Setting apart to positions of presidency or responsibility comes by the laying on of hands, as in Num. 27:18–23'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'Setting apart to positions of presidency, administration, or special responsibility comes in the same way. (Fifth Article of Faith; Num. 27:18–23; Deut. 34:9.)'
