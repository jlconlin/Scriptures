chapter: 12
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'Israel camped at Hazeroth after Kibroth-hattaavah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/11?lang=eng'
    quote: 'And the people journeyed from Kibroth-hattaavah unto Hazeroth; and abode at Hazeroth.'
  - where: 'setting'
    claim: 'Numbers 11–25 portray murmuring, rebellion against Moses’ leadership (12, 14, 16), and apostasy'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'most accounts narrated in Numbers 11–25 are painful in their portrayal of murmuring (chapters 11, 21), rebellion against Moses’s leadership (chapters 12, 14, 16), and apostasy (chapter 25)'
  - where: 'setting'
    claim: 'Challenges to Moses’ prophetic leadership included one from Miriam and Aaron, his older siblings'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Complaints against and challenges to Moses and his prophetic leadership were numerous, including complaints from Miriam and Aaron (Moses’s older siblings; Numbers 12:2)'
  - where: 'setting'
    claim: 'Deuteronomy tells Israel to remember what the LORD did to Miriam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/24?lang=eng'
    quote: 'Remember what the Lord thy God did unto Miriam by the way, after that ye were come forth out of Egypt.'
  - where: 'thread'
    claim: 'Moses’ wish did not mean anyone could be the Lord’s spokesperson; Numbers 12 illustrates it'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'Moses was not suggesting that anyone could be the Lord’s spokesperson. This is illustrated in Numbers 12, when Aaron and Miriam were chastised by the Lord for challenging Moses’s authority as the inspired leader for all of Israel.'
  - where: 'thread'
    claim: 'Moses is silent and the Lord steps in; the Lord distinguishes one who prophesies from the prophet'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'As Moses remains silent, the Lord steps in on his behalf. … the Lord makes a distinction between the role of someone who prophesies (as the seventy men in chapter 11 or perhaps Miriam and Aaron) and the prophet (as Moses, who was chosen to lead the people).'

  # ---------- notes ----------
  - where: 'note 12:1 “The Cushite wife”'
    claim: 'Cush lay south of Egypt along the Nile'
    key: bd-ethiopia
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/ethiopia?lang=eng'
    quote: 'Extended from Syene on the frontier of Egypt southward to the neighborhood of Khartoum, at the junction of the Blue and White Nile.'
  - where: 'note 12:1 “The Cushite wife”'
    claim: 'Midian and Cush were far apart; she is most likely not Zipporah'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'Midian is east of the Sinai Peninsula in Western Asia, and Ethiopia is in Africa along the southern part of the Nile River. These locations are very far from each other. Some believe Zipporah and the Ethiopian wife are the same person, but they are most likely different individuals.'
  - where: 'note 12:1 “The Cushite wife”'
    claim: 'Zipporah was the wife Moses married in Midian'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/2?lang=eng'
    quote: 'And Moses was content to dwell with the man: and he gave Moses Zipporah his daughter.'
  - where: 'note 12:1 “The Cushite wife”'
    claim: 'The Church disavows the theories that black skin is a curse and that mixed-race marriages are a sin'
    key: gte-race-priesthood
    url: 'https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/race-and-the-priesthood?lang=eng'
    quote: 'Today, the Church disavows the theories advanced in the past that black skin is a sign of divine disfavor or curse, or that it reflects unrighteous actions in a premortal life; that mixed-race marriages are a sin'

  - where: 'note 12:2 “The complaint behind the complaint”'
    claim: 'The ostensible reason was the wife; the real reason seems to have been jealousy of Moses’ position'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'The ostensible reason for Miriam’s and Aaron’s complaining was that the Ethiopians were non-Israelite descendants of Cush. The real reason for the complaint, however, seems to have been jealousy motivated by Moses’ position as spiritual leader and prophet of Israel.'
  - where: 'note 12:2 “The complaint behind the complaint”'
    claim: 'Their reasons about the marriage are untold; their claim rested on the Lord having spoken through them'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'For untold reasons, Aaron and Miriam do not agree with Moses’s decision to marry her. However, their response was written clearly: they believed they had the right to speak against Moses because in the past the Lord had also spoken through them.'

  - where: 'note 12:3 “Very meek, and who says so”'
    claim: 'The verse is set in parentheses in the King James text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/12?lang=eng'
    quote: '(Now the man Moses was very meek, above all the men which were upon the face of the earth.)'
  - where: 'note 12:3 “Very meek, and who says so”'
    claim: 'Moses wrote the Pentateuch, but scribes and copyists left their traces'
    key: bd-pentateuch
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/pentateuch?lang=eng'
    quote: 'The Pentateuch was written by Moses, although it is evident that he used several documentary sources … It is also evident that scribes and copyists have left their traces upon the Pentateuch as we have it today'
  - where: 'note 12:3 “Very meek, and who says so”'
    claim: 'Meek defined'
    key: gs-meek-meekness
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/meek-meekness?lang=eng'
    quote: 'Godfearing, righteous, humble, teachable, and patient under suffering.'
  - where: 'note 12:3 “Very meek, and who says so”'
    claim: 'Elder Bednar on Moses’ meekness'
    key: bednar-meek
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/04/meek-and-lowly-of-heart?lang=eng'
    quote: 'His knowledge and competence could have caused him to be prideful. Instead, the attribute and spiritual gift of meekness with which he was blessed attenuated arrogance in his life and magnified Moses as an instrument to accomplish God’s purposes.'
  - where: 'note 12:3 “Very meek, and who says so”'
    claim: 'Moses does not answer his siblings; he asks for his sister’s healing without reproach'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'Fortunately, Moses is humble and does not respond to his siblings.'
  - where: 'note 12:3 “Very meek, and who says so”'
    claim: 'Moses asks the Lord to heal his sister without reproach'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'Moses, without any hint of reproach, asks the Lord to heal his sister.'

  - where: 'note 12:6 “Visions and dreams are real revelation”'
    claim: 'The inspiration Aaron and Miriam had was real and valid'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'In other words, the inspiration that Aaron and Miriam had experienced was in fact real and valid.'
  - where: 'note 12:6 “Visions and dreams are real revelation”'
    claim: 'Lehi was called a visionary man, pejoratively by some; Numbers 12:6 declares that prophets receive visions'
    key: sc-knowhy-469
    url: 'https://scripturecentral.org/knowhy/why-are-lehis-visions-like-those-of-other-prophets-in-his-day'
    quote: 'While some people in Jerusalem at the time, which Laman and Lemuel seemed to follow, used the idea of “visionary” in a pejorative manner, Numbers 12:6 unequivocally declares'
  - where: 'note 12:6 “Visions and dreams are real revelation”'
    claim: 'Lehi dreamed dreams and saw visions'
    key: sc-knowhy-469
    url: 'https://scripturecentral.org/knowhy/why-are-lehis-visions-like-those-of-other-prophets-in-his-day'
    quote: 'The Book of Mormon refers to Lehi as a “visionary man.” Like Ezekiel and Daniel, he dreamed dreams and saw visions.'

  - where: 'note 12:7 “Faithful in all mine house”'
    claim: 'Hebrews quotes the line of Moses and sets Christ as Son over the house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/3?lang=eng'
    quote: 'And Moses verily was faithful in all his house, as a servant, for a testimony of those things which were to be spoken after;'
  - where: 'note 12:7 “Faithful in all mine house”'
    claim: 'The line may acknowledge Moses’ marriage (the Minute’s reading)'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'By saying that Moses is “faithful in all mine house,” the Lord may be acknowledging Moses’s marriage to the Ethiopian woman.'

  - where: 'note 12:8 “Mouth to mouth, not in riddles”'
    claim: 'Dark speeches: riddles, obscure utterances'
    key: bdb
    url: 'https://biblehub.com/hebrew/2420.htm'
    quote: '1 riddle = dark, obscure utterance Numbers 12:8'
  - where: 'note 12:8 “Mouth to mouth, not in riddles”'
    claim: 'temunah: form, semblance of the LORD'
    key: bdb
    url: 'https://biblehub.com/hebrew/8544.htm'
    quote: 'form, semblance of ׳י Numbers 12:8'
  - where: 'note 12:8 “Mouth to mouth, not in riddles”'
    claim: 'Apparently in 1828 English: openly, evidently'
    key: webster-1828
    url: 'https://webstersdictionary1828.com/Dictionary/apparently'
    quote: '1. Openly; evidently'

  - where: 'note 12:10 “Why Miriam alone”'
    claim: 'The verb of verse 1 is feminine singular'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'lemma="c/1696" morph="HC/Vpw3fs"'
  - where: 'note 12:10 “Why Miriam alone”'
    claim: 'Older reading: Miriam the instigator, named first, feminine verb'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/12.htm'
    quote: 'Miriam was the instigator of the open rebellion, as we may see both from the fact that her name stands before that of Aaron, and also from the use of the feminine תּדבּר in Numbers 12:1.'
  - where: 'note 12:10 “Why Miriam alone”'
    claim: 'Miriam may have been leading; not today’s leprosy'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'In verse 1, Miriam had been the first of the two siblings mentioned and may have been leading this action against Moses’s leadership.'
  - where: 'note 12:10 “Why Miriam alone”'
    claim: 'Moses had had the same disease and seen it healed, so he knew she could be'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'When Moses was being prepared to return to Egypt, he developed this same skin disease and was shown that it could be healed (see Exodus 4:6–7). Therefore, though Miriam and Aaron didn’t know it, Moses knew Miriam could be healed.'

  - where: 'note 12:12 “Aaron’s plea”'
    claim: 'The image is of a still-born child; leprosy decomposes the living body'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/12.htm'
    quote: 'i.e., like a still-born child, which comes into the world half decomposed. His reason for making this comparison was, that leprosy produces decomposition in the living body.'

  - where: 'note 12:14 “Seven days outside, and a camp that waited”'
    claim: 'Older reading: she would keep herself hidden out of shame'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/12.htm'
    quote: '"If her father had but spit in her face, would she not be ashamed seven days?" i.e., keep herself hidden from Me out of pure shame.'
  - where: 'note 12:14 “Seven days outside, and a camp that waited”'
    claim: 'The law of leprosy shut a suspected case up seven days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/13?lang=eng'
    quote: 'then the priest shall shut up him that hath the plague seven days:'
  - where: 'note 12:14 “Seven days outside, and a camp that waited”'
    claim: 'Seven days as prescribed; the whole people waited for her'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'Miriam will have to remain outside of the camp for the prescribed seven days (Leviticus 13:4; 14:3; Numbers 12:14–15).'
  - where: 'note 12:14 “Seven days outside, and a camp that waited”'
    claim: 'The group waited seven days for her restoration'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'The group punishment was that everyone would have to wait those seven days for Miriam to be restored to the group.'

  - where: 'note 12:6 “Visions and dreams are real revelation”'
    claim: 'They should not have spoken against the Lord’s anointed, despite prophesying'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'Miriam and Aaron should not have spoken against the Lord’s anointed, despite their role as people who prophesy.'
  - where: 'note 12:10 “Why Miriam alone”'
    claim: 'The punishment was not as severe as it can be read'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'Despite the difficulties of interpreting this story, the punishment was not as severe as can be interpreted.'
  - where: 'note 12:10 “Why Miriam alone”'
    claim: 'Most likely not today’s leprosy'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'Miriam notices that she has some sort of skin disease (most likely not today’s leprosy, or Hansen’s disease).'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'The Church’s footnote on “behold” points to the Topical Guide on Christ’s antemortal appearances'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/12?lang=eng'
    quote: 'TG Jesus Christ, Appearances, Antemortal'
  - where: 'christ'
    claim: 'Hebrews: Christ as a son over his own house'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/3?lang=eng'
    quote: 'But Christ as a son over his own house; whose house are we, if we hold fast the confidence and the rejoicing of the hope firm unto the end.'
  - where: 'christ'
    claim: 'Meekness protects from the blindness of prominence and position'
    key: bednar-meek
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/04/meek-and-lowly-of-heart?lang=eng'
    quote: 'Meekness is the principal protection from the prideful blindness that often arises from prominence, position, power, wealth, and adulation.'
  - where: 'thread'
    claim: 'Moses’ wish was an invitation to speak the words of Jehovah, not to speak for Him'
    key: richardson-prophet-leader
    url: 'https://rsc.byu.edu/vol-9-no-1-2008/prophet-leader'
    quote: 'It must be clear, however, that Moses’s desire that “all the Lord’s people were prophets” was an invitation to speak the words of Jehovah but not an invitation to speak for Jehovah.'
  - where: 'note 12:7 “Faithful in all mine house”'
    claim: 'Servant is a prophet’s title linking him to Jehovah as His servant; the servant does not take his master’s glory'
    key: richardson-prophet-leader
    url: 'https://rsc.byu.edu/vol-9-no-1-2008/prophet-leader'
    quote: 'This title directly links the prophet with Jehovah as a slave, property, or an indentured servant of Jehovah and was attributed to many of the Old Testament prophets.[28] It would be odd for a servant to accept adulation, praise, or glory that rightfully belonged to his master.'
  - where: 'note 12:7 “Faithful in all mine house”'
    claim: 'Moses at Numbers 12:7–8 is among the prophets called servant'
    key: richardson-prophet-leader
    url: 'https://rsc.byu.edu/vol-9-no-1-2008/prophet-leader'
    quote: 'Moses (Numbers 12:7–8)'
  - where: 'explore'
    claim: 'D&C 28:2 compares Joseph Smith’s receiving revelation for the Church with Moses'
    key: richardson-prophet-leader
    url: 'https://rsc.byu.edu/vol-9-no-1-2008/prophet-leader'
    quote: 'This distinction was reiterated as Christ reminded the restored church of the similarities between the modern prophet (Joseph Smith) and the Hebrew prophet (Moses).'
  - where: 'christ'
    claim: 'Miriam and Aaron should not have spoken against the Lord’s anointed despite prophesying'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'Miriam and Aaron should not have spoken against the Lord’s anointed, despite their role as people who prophesy.'
