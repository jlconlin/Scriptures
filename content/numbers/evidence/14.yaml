chapter: 14
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The spies came back to Kadesh in the wilderness of Paran'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/13?lang=eng'
    quote: 'And they went and came to Moses, and to Aaron, and to all the congregation of the children of Israel, unto the wilderness of Paran, to Kadesh'
  - where: 'when'
    claim: 'Israel left Sinai in the second month of the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/10?lang=eng'
    quote: 'And it came to pass on the twentieth day of the second month, in the second year, that the cloud was taken up from off the tabernacle of the testimony.'
  - where: 'setting'
    claim: 'Kadesh was the second place, after Sinai, where Israel spent considerable time; the adults’ lack of faith brought the decree that they would die in the wilderness'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Kadesh (also called Kadesh-barnea) was the second geographic area, after Mount Sinai, in which the Israelites spent considerable time (Numbers 13:26–20:22).'
  - where: 'setting'
    claim: 'The time at Kadesh was a spiritual incubator for the rising generation, while most of the adults died'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'The time spent at this second main location, Kadesh-barnea, in the book of Numbers thus functioned as a “spiritual incubator” in which the rising generation of the Israelites could mature. And it was during this interval that most of the adult generation of the Israelites who had left Egypt died.'
  - where: 'setting'
    claim: 'At Kadesh, as at Massah and Meribah, Israel refused the grace of the Lord'
    key: thomas-provocation
    url: 'https://rsc.byu.edu/sperry-symposium-classics-old-testament/provocation-wilderness-rejection-grace'
    quote: 'when the Israelites were camped at Kadesh Barnea in the wilderness, the Lord tried to bring them into the promised land, but they were so frightened by the report of giants … Again, as at Massah and Meribah, they refused the grace of the Lord.'

  - where: 'thread'
    claim: 'Moses pleaded the honour of God among the heathen and the revelation at Sinai'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/14.htm'
    quote: 'on this occasion he pleaded the honour of God among the heathen, and the glorious revelation of the divine nature with which he had been favoured at Sinai, as a motive for sparing the rebellious nation'

  # ---------- notes ----------
  - where: 'note 14:4 “A head of their own”'
    claim: 'The Hebrew for captain in 14:4 is rosh, head'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'רֹ֖אשׁ'
  - where: 'note 14:4 “A head of their own”'
    claim: 'On one reading the people mimic the prophet: Moses was told to choose heads, they choose one head themselves'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'The term translated as “captain” in the King James Version is the same Hebrew word for “head” in chapter 13. Whereas Moses had been instructed by the Lord to choose rulers, the people have taken it upon themselves to choose one person to be their head'

  - where: 'note 14:9 “Bread for us, and their shade gone”'
    claim: 'BDB: tsel, shadow, hence protection, defence; of the LORD in Numbers 14:9'
    key: bdb
    url: 'https://biblehub.com/hebrew/6738.htm'
    quote: 'hence = protection, defence, of city (wall) Jeremiah 48:45; of ׳י Numbers 14:9 (JE), Psalm 91:1'
  - where: 'note 14:9 “Bread for us, and their shade gone”'
    claim: 'BDB: shadow, shade, as protection from sun'
    key: bdb
    url: 'https://biblehub.com/hebrew/6738.htm'
    quote: '2 shadow, shade, as protection (from sun)'
  - where: 'note 14:9 “Bread for us, and their shade gone”'
    claim: 'A modern translation: no more than bread for us; their protection is removed'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+14&version=NRSVUE'
    quote: 'for they are no more than bread for us; their protection is removed from them, and the Lord is with us; do not fear them.'

  - where: 'note 14:13 “What Moses pleads this time”'
    claim: 'One older reading: a prayer like Horeb’s, except that he pleaded the honour of God among the heathen and the revelation at Sinai'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/14.htm'
    quote: 'with a similar intercessory prayer to that which he had presented at Horeb, except that on this occasion he pleaded the honour of God among the heathen, and the glorious revelation of the divine nature with which he had been favoured at Sinai'
  - where: 'note 14:13 “What Moses pleads this time”'
    claim: 'God would be regarded by the heathen as powerless; for His honour He later did not let Israel perish in exile'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/14.htm'
    quote: 'In that case God would be regarded by the heathen as powerless, and His honour would be impaired … It was for the sake of His own honour that God, at a later time, did not allow the Israelites to perish in exile'
  - where: 'note 14:13 “What Moses pleads this time”'
    claim: '“Face to face” is literally eye to eye, closest proximity'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/14.htm'
    quote: '"Eye to eye:" i.e., Thou hast appeared to them in the closest proximity.'
  - where: 'note 14:13 “What Moses pleads this time”'
    claim: '“Let the power be great” means show Thyself mighty by keeping Thy word of mercy, and forgive'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/14.htm'
    quote: 'The words, "Let the power be great," equivalent to "show Thyself great in power," are not to be connected with what precedes, but with what follows; viz., "show Thyself mighty by verifying Thy word, ''Jehovah, long-suffering and great in mercy,'' etc.; forgive'

  - where: 'note 14:13 “What Moses pleads this time”'
    claim: 'Moses calls on the Lord’s longsuffering mercy, echoing Exodus 34:6, as Israel’s intercessor'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'Calling on the Lord’s longsuffering mercy (echoing Exodus 34:6), Moses asks for forgiveness on Israel’s behalf as their intercessor.'

  - where: 'note 14:20 “Pardoned, and still sworn out of the land”'
    claim: 'One older reading: forgiveness meant the preservation of the nation, not the remission of the punishment'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/14.htm'
    quote: 'the Lord promised forgiveness, namely, the preservation of the nation, but not the remission of the well-merited punishment.'
  - where: 'note 14:20 “Pardoned, and still sworn out of the land”'
    claim: 'Pardon does not come without consequences; Exodus 34:7'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'The Lord responds as expected, although pardoning the people’s sin does not come without conse­quences. In Exodus 34:7, the Lord says He is a forgiving God'
  - where: 'note 14:20 “Pardoned, and still sworn out of the land”'
    claim: 'The Lord would not destroy the people, but none who provoked Him would inherit the land'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'The Lord said that He would not destroy the people, but they would wander in the desert for 40 years.'
  - where: 'note 14:20 “Pardoned, and still sworn out of the land”'
    claim: 'One older reading of v. 21: Jehovah proves He lives by carrying out His work of salvation despite them'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/14.htm'
    quote: 'Jehovah proves Himself to be living, by the fact that His glory fills the whole earth. … by the fact that, notwithstanding the sin and opposition of these men, He would still carry out His work of salvation to a glorious victory.'

  - where: 'note 14:28 “Taken at their word”'
    claim: 'They had said it was better to die in the wilderness; the Lord took them at their word'
    key: wilcox-spies
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/03/the-12-spies?lang=eng'
    quote: 'They had said that it would be better to die in the wilderness than to attempt such a difficult task of conquering the land (see Num. 14:2).'
  - where: 'note 14:28 “Taken at their word”'
    claim: 'The sentence was the result of their own decision and the fulfillment of their own words'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'This was not a whimsical act of God to keep the Israelites in the desert; it was the direct result of their decision not to enter the land at that moment and the fulfillment of their own words (see verse 2).'
  - where: 'note 14:28 “Taken at their word”'
    claim: 'The Lord took them at their word'
    key: wilcox-spies
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/03/the-12-spies?lang=eng'
    quote: 'The Lord knew the children of Israel did not have the faith necessary to claim their inheritance in the promised land and took them at their word.'
  - where: 'note 14:28 “Taken at their word”'
    claim: 'A modern translation: I will do to you the very things I heard you say'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+14&version=NRSVUE'
    quote: '‘As I live,’ says the Lord, ‘I will do to you the very things I heard you say:'

  - where: 'note 14:33 “Forty years, a year for each day”'
    claim: 'The census at Sinai counted men from twenty who could go to war'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'From twenty years old and upward, all that are able to go forth to war in Israel'
  - where: 'note 14:33 “Forty years, a year for each day”'
    claim: 'The Hebrew behind wander in 14:33 is roim, a participle'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'רֹעִ֤ים'
  - where: 'note 14:33 “Forty years, a year for each day”'
    claim: 'A modern translation: your children shall be shepherds … and shall suffer for your faithlessness'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+14&version=NRSVUE'
    quote: 'And your children shall be shepherds in the wilderness for forty years and shall suffer for your faithlessness, until the last of your dead bodies lies in the wilderness.'
  - where: 'note 14:33 “Forty years, a year for each day”'
    claim: 'The children were kept safe but would not escape the effects of their parents’ sins'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'They are innocent and are to be kept safe but would not escape the memory or residual effects of the sins of their parents.'
  - where: 'note 14:33 “Forty years, a year for each day”'
    claim: 'The second census found none of those numbered at Sinai but Caleb and Joshua'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'For the LORD had said of them, They shall surely die in the wilderness. And there was not left a man of them, save Caleb the son of Jephunneh, and Joshua the son of Nun.'

  - where: 'note 14:34 “Not a broken promise but God’s opposition”'
    claim: 'BDB: tenuah, opposition; Numbers 14:34 my opposition, of the LORD'
    key: bdb
    url: 'https://biblehub.com/hebrew/8569.htm'
    quote: '[תְּנוּאָה] noun feminine opposition; — suffix תְּנוּאָתִיּ Numbers 14:34 my opposition, of ׳י'

  - where: 'note 14:44 “Too late, and without the ark”'
    claim: 'They acknowledged their sin, but it was too late; they went up the mountain Moses had sent the spies up'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'In Numbers 13:17, Moses had commanded the tribal leaders to go up into the mountain to spy out the land. They acknowledge their sin; nevertheless, it is too late.'
  - where: 'note 14:44 “Too late, and without the ark”'
    claim: 'One older reading: unbelief in the promise first, then unbelief in the severity of the judgment'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/14.htm'
    quote: 'Whereas at first they had refused to enter upon the conflict with the Canaanites, through their unbelief in the might of the promise of God, now, through unbelief in the severity of the judgment of God, they resolved to engage in this conflict by their own power'
  - where: 'note 14:44 “Too late, and without the ark”'
    claim: 'One older reading of v. 25: the Amalekites lived in the valley, the Canaanites on the mountains'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/14.htm'
    quote: 'including a portion of the Negeb, in which the Amalekites led a nomad life, whilst the Canaanites really dwelt upon the mountains (Numbers 14:45)'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'Moses, as mediator and a similitude of the Savior, pleaded for his people'
    key: wilcox-spies
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/03/the-12-spies?lang=eng'
    quote: 'whereupon Moses, in his role as a mediator, and as a similitude of the Savior, pled with the Lord for his people'
  - where: 'christ'
    claim: 'Moses’ intercession was like Christ’s intercession for us'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'His intercession for his people was similar to Jesus Christ’s intercession for us'
