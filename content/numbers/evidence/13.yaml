chapter: 13
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The spies return to Kadesh in the wilderness of Paran'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/13?lang=eng'
    quote: 'And they went and came to Moses, and to Aaron, and to all the congregation of the children of Israel, unto the wilderness of Paran, to Kadesh'
  - where: 'setting'
    claim: 'Numbers is set in three main places: Sinai, near Kadesh, the plains of Moab'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'The book of Numbers focuses on Israelite activities in three main locations: at Mount Sinai, near Kadesh, and at the plains of Moab.'
  - where: 'setting'
    claim: 'Kadesh, also Kadesh-barnea, the second area; the scouts returned there'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Kadesh (also called Kadesh-barnea) was the second geographic area, after Mount Sinai, in which the Israelites spent considerable time (Numbers 13:26–20:22). It was to Kadesh that the twelve Israelite scouts who had reconnoitered the land of Canaan returned (chapter 13)'
  - where: 'setting'
    claim: 'Kadesh a well-watered spot in Zin; spies sent from there two years after leaving Egypt'
    key: bd-kadesh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kadesh?lang=eng'
    quote: 'a city in the southwest corner of Palestine, a well-watered and fruitful spot in the wilderness of Zin. … from here, two years after leaving Egypt, the 12 spies were sent to report upon the land of Canaan (Num. 13:26).'
  - where: 'setting'
    claim: 'The adults’ lack of faith brought the decree that they would die in the wilderness'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'The adult Israelites’ lack of faith in Jehovah’s power to deliver them into the promised land resulted in the divine decree that they would die in the wilderness during the ensuing forty years'
  - where: 'setting'
    claim: 'The time at Kadesh was an incubator in which the rising generation matured'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'functioned as a “spiritual incubator” in which the rising generation of the Israelites could mature. And it was during this interval that most of the adult generation of the Israelites who had left Egypt died.'
  - where: 'setting'
    claim: 'Hebrews calls it the provocation; Jacob and Alma use the story to teach repentance before it is too late'
    key: wilcox-spies
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/03/the-12-spies?lang=eng'
    quote: 'This moment in Old Testament history is what some prophets have called “the provocation, in the day of temptation in the wilderness” (Heb. 3:8). These prophets have used the story … to teach their people the importance of repenting before it is too late (see Jacob 1:7–8; Alma 12:36–37).'
  - where: 'setting'
    claim: 'Hebrews 3:8 wording'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/3?lang=eng'
    quote: 'Harden not your hearts, as in the provocation, in the day of temptation in the wilderness:'
  - where: 'note 13:30 “Caleb, and the mountain he later asked for”'
    claim: 'Caleb speaks forty-five years after the spies returned'
    key: kimball-mountain
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1979/10/give-me-this-mountain?lang=eng'
    quote: 'Forty-five years after the twelve men returned from their exploration of the land of promise, when the new generation of Israel, under the leadership of Joshua, was completing its conquest of Canaan, Caleb spoke to Joshua:'
  - where: 'thread'
    claim: 'All twelve reported the land flowed with milk and honey; ten also reported it could not be taken'
    key: wilcox-spies
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/03/the-12-spies?lang=eng'
    quote: 'all 12 men reported assuredly to the children of Israel that “the land … floweth with milk and honey; and this is the fruit of it” (Num. 13:27). However, 10 of the 12 spies also fearfully reported'
  - where: 'thread'
    claim: 'Caleb and Joshua confirmed the fruitfulness but disagreed that it could not be conquered'
    key: wilcox-spies
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/03/the-12-spies?lang=eng'
    quote: 'They confirmed the fruitfulness of the land but disagreed that it could not be conquered.'
  - where: 'thread'
    claim: 'The story is the best example of the choice between faith and fear'
    key: wilcox-spies
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/03/the-12-spies?lang=eng'
    quote: 'the choice between two basic but opposing approaches—faith versus fear—influences our lives more markedly than any other (see Mark 4:40). … Perhaps the best example can be found in the story of the spies Moses sent into Canaan'

  # ---------- note 13:2 ----------
  - where: 'note 13:2 “Twelve rulers, not the twelve princes”'
    claim: 'The census princes have other names (Elizur, Shelumiel, Nahshon …); Levi not numbered; Joseph as Ephraim and Manasseh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'Of the children of Joseph: of Ephraim; Elishama the son of Ammihud: of Manasseh; Gamaliel the son of Pedahzur.'
  - where: 'note 13:2 “Twelve rulers, not the twelve princes”'
    claim: 'Leaders sent so they would return with experience to lead their people'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'here the Lord asks that a group of leaders find out for themselves what the land is like. Leaders would return with the experience to lead their people into the promised land.'

  # ---------- note 13:16 ----------
  - where: 'note 13:16 “Why he is already Joshua in Exodus”'
    claim: 'The name Joshua could be used proleptically in the earlier non-genealogical passages'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/13.htm'
    quote: 'As there is nothing of a genealogical character in any of these passages, so as to warrant us in expecting to find the family name of Joshua in them, the name Joshua, by which Hosea had become best known in history, could be used proleptically in them all.'
  - where: 'note 13:16 “Why he is already Joshua in Exodus”'
    claim: 'The verse does not state the renaming happened then; Moses may have given it earlier, around Amalek or on taking him into service'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/13.htm'
    quote: 'It is very probable that Moses may have given him the new name either before or after the defeat of the Amalekites (Exodus 17:9.), or when he took him into his service, though it has not been mentioned before'
  - where: 'note 13:16 “Why he is already Joshua in Exodus”'
    claim: 'The list gives the names as in the tribal registers, so the change needed stating here'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/13.htm'
    quote: 'here the circumstances themselves required that it should be stated that Hosea, as he was called in the list prepared and entered in the documentary record according to the genealogical tables of the tribes, had received from Moses the name of Joshua.'
  - where: 'christ'
    claim: 'Jesus is the Greek form of Joshua; Joshua so called in Acts 7:45 and Heb. 4:8'
    key: bd-jesus
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jesus?lang=eng'
    quote: 'The Greek form of the name Joshua or Jeshua, “God is help” or “Savior.” Joshua son of Nun is so spoken of in Acts 7:45 and Heb. 4:8.'
  - where: 'christ'
    claim: 'Acts 7:45 calls Joshua Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/7?lang=eng'
    quote: 'Which also our fathers that came after brought in with Jesus into the possession of the Gentiles'

  # ---------- note 13:21 ----------
  - where: 'note 13:21 “The length of the land in forty days”'
    claim: 'Hamath a city of Syria on the Orontes; the entering in of Hamath the northern limit'
    key: bd-hamath
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hamath?lang=eng'
    quote: 'An important city of Syria, in the valley of the Orontes; the “entering in of Hamath” was the northern limit of the Promised Land (Num. 34:8; Josh. 13:5).'
  - where: 'note 13:21 “The length of the land in forty days”'
    claim: 'The spies covered about 250 miles each way in 40 days'
    key: wilcox-spies
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/03/the-12-spies?lang=eng'
    quote: 'They searched it from the south to the north and back again, a distance of about 250 miles each way, for 40 days.'
  - where: 'note 13:21 “The length of the land in forty days”'
    claim: 'One reading: the report on Canaan was only a report on Hebron'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'In fact, their report on Canaan was only a report on Hebron fashioned as a report on all the land.'
  - where: 'note 13:21 “The length of the land in forty days”'
    claim: 'Forty means a completed space of time'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'As throughout the Bible, “forty” simply means a completed space of time, not necessarily an exact number.'
  - where: 'note 13:21 “The length of the land in forty days”'
    claim: 'The forty days become forty years'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'After the number of the days in which ye searched the land, even forty days, each day for a year, shall ye bear your iniquities, even forty years'

  # ---------- note 13:22 ----------
  - where: 'note 13:22 “Older than Zoan”'
    claim: 'Hebron the burying place of Abraham and his family'
    key: bd-hebron
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hebron?lang=eng'
    quote: 'It was the burying place of Abraham and his family (23:2, 19; 49:29–32), and became the property of Caleb (Josh. 14:13–15).'
  - where: 'note 13:22 “Older than Zoan”'
    claim: 'Hebron an ancient city, known also as Kirjath-arba'
    key: bd-hebron
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/hebron?lang=eng'
    quote: 'An ancient city of Judah, 3040 feet above the Mediterranean, 20 miles south of Jerusalem; known also as Mamre and Kirjath-arba'
  - where: 'note 13:22 “Older than Zoan”'
    claim: 'Caleb drove out the same three sons of Anak'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/15?lang=eng'
    quote: 'And Caleb drove thence the three sons of Anak, Sheshai, and Ahiman, and Talmai, the children of Anak.'

  # ---------- note 13:23 ----------
  - where: 'note 13:23 “A cluster carried by two men”'
    claim: 'The size of the cluster indicated the goodness of the land'
    key: wilcox-spies
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/03/the-12-spies?lang=eng'
    quote: 'Two of the men hoisted it upon a pole and carried it between them. The size of the grape cluster was an indication of the goodness of the land.'
  - where: 'note 13:23 “A cluster carried by two men”'
    claim: 'Valley of Eshcol = valley of a cluster, region of Hebron; the name derived from the cluster in 13:24'
    key: bdb
    url: 'https://biblehub.com/hebrew/812.htm'
    quote: 'valley of Eshcol, = valley of a cluster, region of Hebron (compare Numbers 13:22); in Numbers 13:24 derived from ׳א cluster'
  - where: 'note 13:23 “A cluster carried by two men”'
    claim: 'Verse 27 wording'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/13?lang=eng'
    quote: 'We came unto the land whither thou sentest us, and surely it floweth with milk and honey; and this is the fruit of it.'

  # ---------- note 13:30 ----------
  - where: 'note 13:30 “Caleb, and the mountain he later asked for”'
    claim: 'Caleb and Joshua alone brought a true report and alone survived the forty years'
    key: bd-caleb
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/caleb?lang=eng'
    quote: 'He and Joshua alone brought back a true report (Num. 13:6, 30; 14:6–38); they alone of all the people who left Egypt survived the 40 years in the wilderness'
  - where: 'note 13:30 “Caleb, and the mountain he later asked for”'
    claim: 'Caleb’s memory of being sent from Kadesh-barnea'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/14?lang=eng'
    quote: 'Forty years old was I when Moses the servant of the Lord sent me from Kadesh-barnea to espy out the land; and I brought him word again as it was in mine heart.'
  - where: 'note 13:30 “Caleb, and the mountain he later asked for”'
    claim: 'Caleb asks for the mountain where the Anakims were'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/14?lang=eng'
    quote: 'Now therefore give me this mountain, whereof the Lord spake in that day; for thou heardest in that day how the Anakims were there, and that the cities were great and fenced'
  - where: 'note 13:30 “Caleb, and the mountain he later asked for”'
    claim: 'Caleb at eighty-five; Hebron became his'
    key: bd-caleb
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/caleb?lang=eng'
    quote: 'After the entrance into Canaan, Caleb obtained Hebron (Josh. 14:6–14; 15:13–19; 21:12; Judg. 1:12–15, 20; 3:9)'

  # ---------- note 13:32 ----------
  - where: 'note 13:32 “An evil report is a slander”'
    claim: 'dibbah means whispering, defamation, evil report'
    key: bdb
    url: 'https://biblehub.com/hebrew/1681.htm'
    quote: 'דִּבָּה noun feminine whispering, defamation, evil report (? as that which glides stealthily)'
  - where: 'note 13:32 “An evil report is a slander”'
    claim: 'Septuagint: they brought a horror of that land'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/numbers/13.htm'
    quote: 'And they brought a horror of that land which they surveyed upon the children of Israel, saying, The land which we passed by to survey it, is a land that eats up its inhabitants'
  - where: 'note 13:32 “An evil report is a slander”'
    claim: 'Another older reading: fought over for its fruitfulness, its inhabitants wasted away; the spies exaggerated'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/13.htm'
    quote: 'by exaggerating the difficulties of the conquest in their unbelieving despair … the land was an apple of discord, because of its fruitfulness and situation; and as the different nations strove for its possession, its inhabitants wasted away'
  - where: 'note 13:32 “An evil report is a slander”'
    claim: 'The men who brought the evil report died by the plague'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'Even those men that did bring up the evil report upon the land, died by the plague before the LORD.'

  # ---------- note 13:33 ----------
  - where: 'note 13:33 “As grasshoppers”'
    claim: 'The Septuagint lacks the clause about the sons of Anak'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/numbers/13.htm'
    quote: '33(13:34) And there we saw the giants; and we were before them as locusts, yea even so were we before them.'
  - where: 'note 13:33 “As grasshoppers”'
    claim: 'The Hebrew word is nephilim'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/13?lang=eng'
    quote: 'And there we saw the giants, the sons of Anak, which come of the giants: and we were in our own sight as grasshoppers, and so we were in their sight.'

  # ---------- christ / explore ----------
  - where: 'christ'
    claim: 'Matthew 1:21 on the name Jesus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/1?lang=eng'
    quote: 'And she shall bring forth a son, and thou shalt call his name Jesus: for he shall save his people from their sins.'
  - where: 'christ'
    claim: 'Hebrews 3:19'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/3?lang=eng'
    quote: 'So we see that they could not enter in because of unbelief.'
  - where: 'christ'
    claim: 'President Kimball takes Caleb’s request as his own and pledges to go forward with faith'
    key: kimball-mountain
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1979/10/give-me-this-mountain?lang=eng'
    quote: 'I will go forward, with faith in the God of Israel, knowing that he will guide and direct us, and lead us, finally, to the accomplishment of his purposes and to our promised land and our promised blessings.'
  - where: 'christ'
    claim: 'Kimball: giant opportunities; give me this mountain'
    key: kimball-mountain
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1979/10/give-me-this-mountain?lang=eng'
    quote: 'There are great challenges ahead of us, giant opportunities to be met. I welcome that exciting prospect and feel to say to the Lord, humbly, “Give me this mountain,” give me these challenges.'
  - where: 'christ'
    claim: 'Not letting the height of walls make us feel as grasshoppers'
    key: wilcox-spies
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/03/the-12-spies?lang=eng'
    quote: 'we simply must not let the “height of the walls” and the power of opposing forces make us feel “as grasshoppers” (Num. 13:33). The Lord will help us conquer our fears, surmount our obstacles'
  - where: 'note 13:2 “Twelve rulers, not the twelve princes”'
    claim: 'Levi was not numbered among the tribes'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'But the Levites after the tribe of their fathers were not numbered among them.'
  - where: 'note 13:16 “Why he is already Joshua in Exodus”'
    claim: 'Oshea means salvation; Joshua means Jehovah is salvation'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'Moses changed the name of the leader of the tribe of Ephraim from Oshea (meaning “salvation”) to Joshua (meaning “Jehovah is salvation”).'
  - where: 'note 13:21 “The length of the land in forty days”'
    claim: 'The wilderness of Zin is on the southern border'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/34?lang=eng'
    quote: 'Then your south quarter shall be from the wilderness of Zin along by the coast of Edom'
  - where: 'note 13:33 “As grasshoppers”'
    claim: 'The ten spread a frightening report, ending with the grasshoppers'
    key: wilcox-spies
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/03/the-12-spies?lang=eng'
    quote: '“Not so,” replied the 10 other spies as they continued to spread the frightening report among the people. “We were in our own sight as grasshoppers, and so we were in their sight,” they said (Num. 13:33).'
  - where: 'note 13:33 “As grasshoppers”'
    claim: 'Nephilim occurs only at Gen. 6:4 and Num. 13:33; the LXX omits the sons-of-Anak clause; perhaps a doublet, but in the Samaritan and the Vulgate'
    key: bdb
    url: 'https://biblehub.com/hebrew/5303.htm'
    quote: 'הַנְּפִלִים Genesis 6:4 (J), הַנְּפִילִים בְּנֵי עֲנָק מִןהַֿנְּפִלִים Numbers 13:33 (JE); ᵐ5 omit ׳בְּנֵי וגו, and so Di; these words perhaps doublet, but already in ⅏, also ᵑ9'
  - where: 'christ'
    claim: 'This moment is the provocation of Hebrews 3'
    key: wilcox-spies
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/03/the-12-spies?lang=eng'
    quote: 'This moment in Old Testament history is what some prophets have called “the provocation, in the day of temptation in the wilderness” (Heb. 3:8).'
  - where: 'christ'
    claim: 'Caleb speaks forty-five years after the spies returned'
    key: kimball-mountain
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1979/10/give-me-this-mountain?lang=eng'
    quote: 'Forty-five years after the twelve men returned from their exploration of the land of promise'
