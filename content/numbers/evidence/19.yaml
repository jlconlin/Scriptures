chapter: 19
claims:
  - where: 'when'
    claim: 'The chapter is a law given to Moses and Aaron; the text gives no date'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/19?lang=eng'
    quote: 'And the LORD spake unto Moses and unto Aaron, saying, This is the ordinance of the law which the LORD hath commanded'

  - where: 'setting'
    claim: 'One older reading: the law was given after the plague that followed Korah''s rebellion, to keep the covenant alive while a condemned generation died'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/19.htm'
    quote: 'In order that a consciousness of the continuance of the covenant relation might be kept alive during the dying out of the race that had fallen under the judgment of God, after the severe stroke with which the Lord had visited the whole nation in consequence of the rebellion of the company of Korah'

  - where: 'setting'
    claim: 'Another older reading finds no connection with the stories around the chapter'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/19.htm'
    quote: 'having no connexion with the narrative of Korah and the privileges of priests and Levites (16–18), nor with the following narrative of the events at Kadesh (20)'

  - where: 'setting'
    claim: 'The law is used again after the war on Midian (Num. 31:19–24); Hebrews 9:13–14 contrasts the heifer''s ashes with the blood of Christ'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/19.htm'
    quote: 'This law is referred to in Numbers 31:19-24; and in Hebrews 9:13 f. a contrast is drawn between ‘the ashes of an heifer’ which purify the flesh, and the blood of Christ which purifies the conscience from ‘dead works.’'

  - where: 'setting'
    claim: 'Uncleanness is ritual, not moral evil'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'Uncleanness referred to being ceremonially or ritually unclean and should not be taken to mean that the touching of a dead body or the bearing of children was morally evil.'

  - where: 'setting'
    claim: 'The Church''s chapter heading: the water of separation is used for purification'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/19?lang=eng'
    quote: 'Directions are given for the sacrifice of a red heifer—The water of separation is used for purification from sin'

  - where: 'thread'
    claim: 'One older reading: the chapter falls into the preparation of the water (1–10) and its use (10–22)'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/19.htm'
    quote: 'first of all the preparation of a sprinkling water is commanded for the removal of this uncleanness (Numbers 19:1-10); and then, secondly, the use of this purifying water enjoined as an eternal statute (Numbers 19:10-22)'

  - where: 'thread'
    claim: 'Uncleanness from the dead was the strongest of all, so plain water was not enough'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/19.htm'
    quote: 'But as this uncleanness was the strongest of all religious defilements, fresh water alone was not sufficient to remove it; and consequently a certain kind of sprinkling-water was appointed, which was strengthened by the ashes of a sin-offering'

  - where: 'note 19:2 “Why a red heifer, never yoked”'
    claim: 'The reason for the colour is not known; perhaps it, like the scarlet, refers to blood as purifying'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/19.htm'
    quote: 'The reason for the particular colour is not known. The red animal and the scarlet thread may both, perhaps, have had reference to blood as an instrument of purification.'

  - where: 'note 19:2 “Why a red heifer, never yoked”'
    claim: 'Keil: a female as bearer of life, red as the colour of life, unyoked as vital energy not yet spent; the sin offering of the congregation was otherwise a bullock'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/19.htm'
    quote: 'The sacrificial animal was not to be a bullock, as in the case of the ordinary sin-offerings of the congregation (Leviticus 4:14), but a female, because the female sex is the bearer of life … of a red colour … as the colour of the most "intensive life,"'

  - where: 'note 19:2 “Why a red heifer, never yoked”'
    claim: 'Keil: unyoked means vital energy not crippled by labour; the whole made it an antidote to death'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/19.htm'
    quote: 'one "upon which no yoke had ever come," i.e., whose vital energy had not yet been crippled by labour under the yoke'

  - where: 'note 19:2 “Why a red heifer, never yoked”'
    claim: 'Keil: the cedar, hyssop and scarlet added to the fire strengthened the ashes against death'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/19.htm'
    quote: 'cedar-wood was thrown into the fire, as the symbol of the incorruptible continuance of life; and hyssop, as the symbol of purification from the corruption of death; and scarlet wool, the deep red of which shadowed forth the strongest vital energy'

  - where: 'note 19:2 “Why a red heifer, never yoked”'
    claim: 'The same three objects are used in cleansing the leper (Lev. 14)'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/19.htm'
    quote: 'In the purification of the leper the same objects are employed, but with a different purpose.'

  - where: 'note 19:7 “The cleansers made unclean”'
    claim: 'Keil: the preparers became unclean through the uncleanness of sin and death passed to the offering, as with the man who led away the scapegoat'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/19.htm'
    quote: 'became unclean till the evening in consequence; not from the fact that they had officiated for unclean persons … but through the uncleanness of sin and death, which had passed over to the sin-offering; just as the man who led into the wilderness the goat'

  - where: 'note 19:7 “The cleansers made unclean”'
    claim: 'The ashes themselves were kept as clean, gathered by a clean man in a clean place'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/19.htm'
    quote: 'But when the ashes were regarded in relation to their appointment as the means of purification, they were to be treated as clean.'

  - where: 'note 19:7 “The cleansers made unclean”'
    claim: 'Another older reading: holiness was thought contagious, closely connected with uncleanness; the uncleanness of the one who sprinkles or touches the water (v. 21) was slight'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/19.htm'
    quote: 'The uncleanness in this case is slight; it lasts until the evening and can be removed by simply washing the clothes. … A close connexion existed in the Semitic mind between ‘uncleanness’ and ‘holiness.’'

  - where: 'note 19:9 “Water for impurity, a purification for sin”'
    claim: 'niddah means impurity; me niddah is water of impurity, i.e. to remove it, in Num. 19 and 31:23'
    key: bdb
    url: 'https://biblehub.com/hebrew/5079.htm'
    quote: 'of defilement contracted by contact with a corpse, מֵי (הַ)נִּדָּה water of impurity (i.e. to remove it, compare Di) Numbers 19:9,13,20,21 (twice in verse); Numbers 31:23.'

  - where: 'note 19:9 “Water for impurity, a purification for sin”'
    claim: 'The Hebrew words of 19:9: me niddah chatta''t hi'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'נִדָּ֖ה'

  - where: 'note 19:9 “Water for impurity, a purification for sin”'
    claim: 'BDB: chatta''t here is purification from sins of ceremonial uncleanness; no offering was made'
    key: bdb
    url: 'https://biblehub.com/hebrew/2403.htm'
    quote: '5 purification from sins of ceremonial uncleanness, all P … ashes of the burning of the purification from sin (RV renders sin-offering; but there was no offering made, only water of purification was used).'

  - where: 'note 19:10 “The stranger too”'
    claim: 'Three people take part: the priest, the one who burns, the one who gathers; a stranger could apparently be one of the latter two'
    key: belnap-outcasts
    url: 'https://rsc.byu.edu/vol-19-no-3-2018/lord-god-which-gathereth-outcasts'
    quote: 'While a priest was required for the performance of the slaughter, at least two others were mentioned: (1) “he that burneth,” or actually places the carcass on the fire (19:8), and (2) the one who gathers up the ashes (19:9).'

  - where: 'note 19:10 “The stranger too”'
    claim: 'The stranger was held to the same standard and could take part in an ordinance for the whole community'
    key: belnap-outcasts
    url: 'https://rsc.byu.edu/vol-19-no-3-2018/lord-god-which-gathereth-outcasts'
    quote: 'Thus, not only was a stranger to be held to the same standard of purification, it was also possible that they could participate directly in an ordinance that benefited the entire community.'

  - where: 'note 19:13 “Defiling the tabernacle from a distance”'
    claim: 'Impurity was held to assault the sanctuary even from afar; Num. 19:13, 20'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'Whoever is contaminated by a corpse and fails to purify himself “has contaminated the Lord’s sanctuary” (Numbers 19:20, 13). … it assaults the sacred realm even from afar.'

  - where: 'note 19:13 “Defiling the tabernacle from a distance”'
    claim: 'The rabbis read these texts as requiring direct contact with the holy'
    key: milgrom-temple
    url: 'https://rsc.byu.edu/reflections-mormonism/temple-biblical-israel'
    quote: 'True, the rabbis interpreted each of these passages on the assumption that impurity came into direct contact with the holy, specifically that the offender while in an impure state entered the sanctuary or ate of sacred food'

  - where: 'note 19:15 “The open vessel”'
    claim: 'No contact with the open vessel was needed; the outside of a covered vessel did not make it impure'
    key: sc-knowhy-169
    url: 'https://scripturecentral.org/knowhy/why-did-moroni-refer-to-vessel-impurity-in-condemning-the-central-government'
    quote: 'Evidently, no contact with an open vessel was required (Numbers 19:15). … Apparently yes, for corpse contamination of the outside of a covered vessel did not render the pot impure.'

  - where: 'note 19:15 “The open vessel”'
    claim: 'Moroni''s inward vessel (Alma 60:23) draws on the pot-purity laws of Leviticus and Numbers, in the KnoWhy''s reading'
    key: sc-knowhy-169
    url: 'https://scripturecentral.org/knowhy/why-did-moroni-refer-to-vessel-impurity-in-condemning-the-central-government'
    quote: 'the overall agreement between the arguments of Jesus and Moroni strongly suggest that they were drawing upon these laws from Leviticus and Numbers'

  - where: 'note 19:15 “The open vessel”'
    claim: 'Moroni invoked the principle for inner purity'
    key: sc-knowhy-169
    url: 'https://scripturecentral.org/knowhy/why-did-moroni-refer-to-vessel-impurity-in-condemning-the-central-government'
    quote: 'Moroni invoked this principle to emphasize the crucial need for inner purity and sanctification among his own people and their central government.'

  - where: 'note 19:16 “The Nephites and the week of uncleanness”'
    claim: 'Num. 19:16 made those who buried the slain unclean for a week; Mormon''s days of mourning may have been that week'
    key: sc-knowhy-424
    url: 'https://scripturecentral.org/knowhy/how-the-law-of-moses-teaches-about-the-atonement'
    quote: 'Mormon’s statement about “the days of fasting, mourning, and prayer” suggests that there was a fixed number of days assigned for this. This may have been the week of uncleanness mentioned in Numbers.'

  - where: 'note 19:16 “The Nephites and the week of uncleanness”'
    claim: 'The Nephites may have kept the rite, possibly modified'
    key: sc-knowhy-424
    url: 'https://scripturecentral.org/knowhy/how-the-law-of-moses-teaches-about-the-atonement'
    quote: 'suggests that the Nephites did indeed observe this ritual, although possibly in a slightly modified form, as red heifers may have been hard to get in the Americas'

  - where: 'note 19:17 “Living water”'
    claim: 'The Hebrew of 19:17 is mayim chayyim'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'חַיִּ֖ים'

  - where: 'note 19:17 “Living water”'
    claim: 'chay: alive; fresh (water)'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/2416.htm'
    quote: 'From chayah; alive; hence, raw (flesh); fresh (plant, water, year), strong'

  - where: 'note 19:17 “Living water”'
    claim: 'Lundquist: mayim hayyim, living waters, rendered running water in the KJV; the idea underlies John 4:10; only such water allowed for the red heifer rite'
    key: lundquist-temple-isaiah
    url: 'https://rsc.byu.edu/isaiah-prophets/temple-symbolism-isaiah'
    quote: 'The same idea is found in Numbers 19:17, mayîm hayyîm, “living waters,” translated as “running water” in the KJV. It is this idea that underlies the Savior’s statement to the Samaritan woman at the well in John 4:10.'

  - where: 'note 19:17 “Living water”'
    claim: 'Living waters are flowing spring waters; the only water allowed for many rites such as the red heifer'
    key: lundquist-temple-isaiah
    url: 'https://rsc.byu.edu/isaiah-prophets/temple-symbolism-isaiah'
    quote: 'The “living waters” are the sweet, flowing waters that come to the surface as springs that originated deep underground. This is the only water that was allowed for many ritual observances under the Mosaic law, such as the ritual of the red heifer of Numbers 19.'

  - where: 'note 19:17 “Living water”'
    claim: 'The Lord is called the fountain of living waters in Jer. 2:13'
    key: lundquist-temple-isaiah
    url: 'https://rsc.byu.edu/isaiah-prophets/temple-symbolism-isaiah'
    quote: 'In the well-known passage in Jeremiah 2:13, the Lord is referred to as “the fountain of living waters,”'

  - where: 'christ'
    claim: 'Hebrews 9:13–14 sets the heifer''s ashes beside, and argues from them to, the blood of Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'How much more shall the blood of Christ, who through the eternal Spirit offered himself without spot to God, purge your conscience from dead works to serve the living God?'

  - where: 'christ'
    claim: 'KnoWhy 424: the red heifer, the hyssop, the scarlet and the place outside the camp compared with Christ''s suffering and death'
    key: sc-knowhy-424
    url: 'https://scripturecentral.org/knowhy/how-the-law-of-moses-teaches-about-the-atonement'
    quote: 'According to Mosiah 3:7, Christ bled from every pore when He atoned for our sins, which would have made Him almost completely red from head to toe.'

  - where: 'christ'
    claim: 'KnoWhy 424: outside the camp, Heb. 13:11–12'
    key: sc-knowhy-424
    url: 'https://scripturecentral.org/knowhy/how-the-law-of-moses-teaches-about-the-atonement'
    quote: 'Finally, the red heifer was sacrificed outside the camp (see Numbers 19:3). Christ, was also sacrificed outside the walls of Jerusalem'

  - where: 'christ'
    claim: 'KnoWhy 424: the hyssop and the scarlet robe of the Passion (John 19:29; Matt. 27:28) beside the hyssop and scarlet of Num. 19:6'
    key: sc-knowhy-424
    url: 'https://scripturecentral.org/knowhy/how-the-law-of-moses-teaches-about-the-atonement'
    quote: 'John 19:29 records that Christ was given something to drink on a stick of hyssop while He was on the cross, and Matthew 27:28 states that He was given a scarlet robe immediately before He was sent to be crucified.'

  - where: 'christ'
    claim: 'KnoWhy 424: Christ can make us clean again'
    key: sc-knowhy-424
    url: 'https://scripturecentral.org/knowhy/how-the-law-of-moses-teaches-about-the-atonement'
    quote: 'The similarities between the sacrifice of the red heifer and the Atonement of Christ teach us that no matter what we have been through, Christ can make us clean again.'

  - where: 'christ'
    claim: 'Student Manual: the heifer''s death symbolizes Christ''s Atonement; recovery from spiritual death by faith, repentance, baptism, the Holy Ghost'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'Recovery from spiritual death is obtained by faith in Christ’s Atonement (symbolized by the death of the red heifer), repentance from sin, baptism in water, receiving the Holy Ghost, and obedience to God’s commandments.'

  - where: 'christ'
    claim: '1 John 1:7: the blood of Jesus Christ cleanses from all sin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-jn/1?lang=eng'
    quote: 'the blood of Jesus Christ his Son cleanseth us from all sin'

  - where: 'setting'
    claim: 'While unclean a person was cut off from the congregation'
    key: bd-clean-unclean
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/clean-and-unclean?lang=eng'
    quote: 'So long as a person was unclean he was cut off from the congregation.'

  - where: 'note 19:9 “Water for impurity, a purification for sin”'
    claim: 'chatta''t elsewhere means sin-offering'
    key: bdb
    url: 'https://biblehub.com/hebrew/2403.htm'
    quote: '4 sin-offering: one of the kinds of offerings of P, Leviticus 7:37'

  - where: 'note 19:10 “The stranger too”'
    claim: 'From verse 10, a stranger could be one of the two others'
    key: belnap-outcasts
    url: 'https://rsc.byu.edu/vol-19-no-3-2018/lord-god-which-gathereth-outcasts'
    quote: 'That a stranger could be one of the other two appears to be the case as noted in verse 10'

  - where: 'note 19:15 “The open vessel”'
    claim: 'The KnoWhy compares Jesus'' teaching on cleansing the outside of a vessel'
    key: sc-knowhy-169
    url: 'https://scripturecentral.org/knowhy/why-did-moroni-refer-to-vessel-impurity-in-condemning-the-central-government'
    quote: 'While Jesus took issue with those Pharisees who began by cleansing the outside of a vessel'

  - where: 'note 19:16 “The Nephites and the week of uncleanness”'
    claim: 'Num. 19:16 made those burying the dead unclean for a week'
    key: sc-knowhy-424
    url: 'https://scripturecentral.org/knowhy/how-the-law-of-moses-teaches-about-the-atonement'
    quote: 'According to Numbers 19:16, anyone who touched “one that is slain with a sword in the open fields,” including those burying the dead, were unclean for a week.'

  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'

  - where: 'note 19:13 “Defiling the tabernacle from a distance”'
    claim: 'The text: whoever does not purify himself defiles the tabernacle and is cut off'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/19?lang=eng'
    quote: 'Whosoever toucheth the dead body of any man that is dead, and purifieth not himself, defileth the tabernacle of the LORD'

  - where: 'note 19:9 “Water for impurity, a purification for sin”'
    claim: 'BDB: RV renders sin-offering at 19:17'
    key: bdb
    url: 'https://biblehub.com/hebrew/2403.htm'
    quote: 'RV renders sin-offering; but there was no offering made, only water of purification was used'
