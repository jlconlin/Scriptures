chapter: 25
claims:
  - where: 'when'
    claim: 'Israel was camped in the plains of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/22?lang=eng'
    quote: 'And the children of Israel set forward, and pitched in the plains of Moab on this side Jordan by Jericho.'
  - where: 'when'
    claim: 'Moses spoke on the plains in the fortieth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: 'setting'
    claim: 'Shittim means acacias; the district east of Jordan opposite Jericho where Israel camped before crossing'
    key: bd-shittim
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/shittim?lang=eng'
    quote: 'Acacias. The district east of Jordan opposite Jericho, where the people encamped before crossing the Jordan'
  - where: 'setting'
    claim: 'The Peor episode follows directly after Balaam left Moab'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'After Balaam left Moab to return to his home, “the [Israelites] began to have sexual relations with the women of Moab.'
  - where: 'setting'
    claim: 'Moses later says the women acted through the counsel of Balaam'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/31?lang=eng'
    quote: 'Behold, these caused the children of Israel, through the counsel of Balaam, to commit trespass against the Lord in the matter of Peor'
  - where: 'setting'
    claim: 'Revelation 2:14 blames Balaam and draws on Numbers 25:1–3 and 31:16'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'And Revelation 2:14 blames Balaam for teaching “Balak to put a stumbling block before the people of Israel, so that they would eat food sacrificed to idols and practice fornication” (this passage draws on Numbers 25:1–3; 31:16).'
  - where: 'setting'
    claim: 'The next chapter begins after the plague with a new count'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'And it came to pass after the plague, that the Lord spake unto Moses and unto Eleazar the son of Aaron the priest, saying,'
  - where: 'thread'
    claim: 'The claim of 31:16, as Pike puts it: Balaam suggested Moab could defeat Israel by getting them to sin and so curse themselves'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'The claim in Numbers 31:16, that Balaam had suggested that the Moabites could “defeat” the Israelites by getting them to sin and thus curse themselves'
  - where: 'note 25:3 “Joined to Baal-peor”'
    claim: 'The verb means to join or attach oneself to Baal-peor, to adopt his worship; Ps. 106:28 uses it'
    key: bdb
    url: 'https://biblehub.com/hebrew/6775.htm'
    quote: 'join, attach, oneself to (ל) Baal Peor, i.e. adopt his worship Numbers 25:3,5 (JE), whence Psalm 106:28.'
  - where: 'note 25:3 “Joined to Baal-peor”'
    claim: 'A modern translation reads "yoked itself"'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+25&version=NRSVUE'
    quote: 'Thus Israel yoked itself to the Baal of Peor, and the Lord’s anger was kindled against Israel.'
  - where: 'note 25:3 “Joined to Baal-peor”'
    claim: 'The Midianite woman''s activity was probably cultic, not merely sexual'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'a Midianite woman was involved in sinful activity with an Israelite at Baal Peor (probably cultic activity rather than merely sexual misconduct)'
  - where: 'note 25:4 “Hanged before the LORD in the sun”'
    claim: 'The verb names some solemn form of execution, meaning uncertain; Aquila impale, Septuagint and Syriac expose, Targum and Vulgate crucify'
    key: bdb
    url: 'https://biblehub.com/hebrew/3363.htm'
    quote: 'of some solemn form of execution, but meaning uncertain: Aq Ges impale; ᵐ5 ᵑ6 expose (ἐξηλιάζειν, παραδειγματἰζειν); ᵑ7 ᵑ9 crucify'
  - where: 'note 25:4 “Hanged before the LORD in the sun”'
    claim: 'A modern translation: impale them in the sun'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+25&version=NRSVUE'
    quote: 'Take all the chiefs of the people and impale them in the sun before the Lord, in order that the fierce anger of the Lord may turn away from Israel.'
  - where: 'note 25:4 “Hanged before the LORD in the sun”'
    claim: 'One older reading: the heads were assembled and the guilty men hanged'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/25.htm'
    quote: 'to fetch the heads of the people, i.e., to assemble them together, and to "hang up" the men who had joined themselves to Baal-Peor'
  - where: 'note 25:4 “Hanged before the LORD in the sun”'
    claim: 'One older reading: they were first put to death, then impaled'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/25.htm'
    quote: 'they were first of all put to death, and then impaled upon a stake or fastened upon a cross'
  - where: 'note 25:4 “Hanged before the LORD in the sun”'
    claim: 'One older reading: the order to the judges was not carried out'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/25.htm'
    quote: 'This command of Moses to the judges was not carried out, however, because the matter took a different turn.'
  - where: 'note 25:4 “Hanged before the LORD in the sun”'
    claim: 'One older reading: "them" means the guilty, on whom the heads were to pronounce sentence'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/25.htm'
    quote: 'does not refer to the heads of the nation, but to the guilty persons, upon whom the heads of the nation were to pronounce sentence'
  - where: 'note 25:6 “Moabites and Midianites”'
    claim: 'Midianites are mentioned as living among the Moabites in Numbers 22 and 25'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Midianites are mentioned as living among the Moabites in Numbers 22 and 25.'
  - where: 'note 25:6 “Moabites and Midianites”'
    claim: 'Midianites descend from Abraham and Keturah, lived mainly in northwestern Arabia, with clans east and north of the Dead Sea'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Although the Midianites were primarily located in northwestern Arabia … there were various Midianite clans, some of which lived in areas east and north of the Dead Sea'
  - where: 'note 25:6 “Moabites and Midianites”'
    claim: 'Other textual traditions could be postulated, but some mixing of peoples likely lies behind the alternation of Moabite and Midianite'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Although multiple textual traditions could be postulated, enough biblical passages place some Midianites in Moabite territory to accept that some mixing of peoples lies behind these variations.'
  - where: 'note 25:6 “Moabites and Midianites”'
    claim: 'Jethro, Moses'' Midianite father-in-law, held the Melchizedek Priesthood in Latter-day Saint belief'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'the non-Israelite Jethro, Moses’s Midianite father-in-law who Latter-day Saints believe held the Melchizedek Priesthood that he later conferred upon Moses (Doctrine and Covenants 84:6)'
  - where: 'note 25:9 “Twenty-four thousand, or twenty-three”'
    claim: 'Paul gives twenty-three thousand'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/10?lang=eng'
    quote: 'Neither let us commit fornication, as some of them committed, and fell in one day three and twenty thousand.'
  - where: 'note 25:9 “Twenty-four thousand, or twenty-three”'
    claim: 'One older reading: Paul probably followed a scribal tradition deducting a thousand hanged by the judges'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/25.htm'
    quote: 'probably from a traditional interpretation of the schools of the scribes, according to which a thousand were deducted from the twenty-four thousand who perished, as being the number of those who were hanged by the judges'
  - where: 'note 25:11 “Zealous with the LORD’s jealousy”'
    claim: 'The verb means be jealous, zealous'
    key: bdb
    url: 'https://biblehub.com/hebrew/7065.htm'
    quote: 'Pi`el be jealous, zealous'
  - where: 'note 25:11 “Zealous with the LORD’s jealousy”'
    claim: 'In 25:11 the verb takes the noun "jealousy" as its object'
    key: bdb
    url: 'https://biblehub.com/hebrew/7065.htm'
    quote: 'for God Numbers 25:13 (P), 1 Kings 19:10,14; קנאה ׳ק Numbers 25:11(P).'
  - where: 'note 25:11 “Zealous with the LORD’s jealousy”'
    claim: 'A modern translation keeps zeal and jealousy together'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+25&version=NRSVUE'
    quote: 'has turned back my wrath from the Israelites by manifesting such zeal among them on my behalf that in my jealousy I did not consume the Israelites.'
  - where: 'note 25:11 “Zealous with the LORD’s jealousy”'
    claim: 'Jealous in scripture can mean fervent, deep feeling'
    key: gs-jealous
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/jealous-jealousy?lang=eng'
    quote: 'to be fervent and to have sensitive and deep feelings about someone or something'
  - where: 'note 25:11 “Zealous with the LORD’s jealousy”'
    claim: 'Psalm 106 says the deed was counted for righteousness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/106?lang=eng'
    quote: 'And that was counted unto him for righteousness unto all generations for evermore.'
  - where: 'note 25:11 “Zealous with the LORD’s jealousy”'
    claim: 'Old Testament examples of violence never justify violence today'
    key: scripture-helps-violence
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/52-violence-and-destruction-in-the-old-testament?lang=eng'
    quote: 'we should not think that examples of violence in the Old Testament would ever be justification for committing violence today.'
  - where: 'note 25:13 “A priesthood kept in Phinehas’s line”'
    claim: 'One older reading: the eternal possession of the priesthood secured to him and his descendants'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/25.htm'
    quote: 'an "eternal priesthood" (i.e., the eternal possession of the priesthood) was secured to him, not for himself alone, but for his descendants also'
  - where: 'note 25:13 “A priesthood kept in Phinehas’s line”'
    claim: 'One older reading: the high priesthood continued in his family except for Eli''s days, until the Jewish state dissolved under Herod and his successors'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/25.htm'
    quote: 'the high-priesthood which passed from Eleazar to Phinehas (Judges 20:28) continued in his family, with the exception of a brief interruption in Eli''s days (see at 1 Samuel 1-3 and 1 Samuel 14:3), until the time of the last gradual dissolution of the Jewish state through the tyranny of Herod and his successors'
  - where: 'note 25:13 “A priesthood kept in Phinehas’s line”'
    claim: 'Phinehas later high priest; his descendants listed'
    key: bd-phinehas
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/phinehas?lang=eng'
    quote: 'high priest (Judg. 20:28; 1 Chr. 6:4, 50; 9:20); descendants (Ezra 7:5; 8:2, 33).'
  - where: 'note 25:13 “A priesthood kept in Phinehas’s line”'
    claim: 'Phinehas stood before the ark in the days of the war with Benjamin'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/20?lang=eng'
    quote: 'And Phinehas, the son of Eleazar, the son of Aaron, stood before it in those days,)'
  - where: 'note 25:13 “How a priest’s deed made atonement”'
    claim: 'Kipper with a man as subject: Moses by intercession, Aaron by incense, Phinehas killing the offenders'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'חטאתכםבְּעַד Exodus 32:30 on behalf of your sins (J E; Moses, by intercession); with על of persons Numbers 17:11; Numbers 17:12 (P; by incense), Numbers 25:13 (P when Phinehas slays the ringleaders).'
  - where: 'note 25:13 “How a priest’s deed made atonement”'
    claim: 'Kipper used of atoning without sacrifice, with a man as subject'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'cover over, atone for sin, without sacrifice: a. man as subject'
  - where: 'note 25:13 “How a priest’s deed made atonement”'
    claim: 'David asks how to cover the bloodguilt of Saul''s house; answered by the death of seven sons'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'the bloodguiltiness of the house of Saul, says David The answer is by a death penalty of seven sons of the guilty house'
  - where: 'note 25:13 “How a priest’s deed made atonement”'
    claim: 'In the ritual the priest makes atonement by the blood upon the altar and of the sin offering'
    key: bdb
    url: 'https://biblehub.com/hebrew/3722.htm'
    quote: 'by the blood upon the altar Leviticus 17:11; in the ritual עֲלֵיהֶם, עָלָיו by ministry of priest through the blood of the sin-offering'
  - where: 'note 25:17 “Vex the Midianites”'
    claim: 'The verb of 25:17 and 25:18 is one: show hostility, vex, harass'
    key: bdb
    url: 'https://biblehub.com/hebrew/6887.htm'
    quote: 'Infinitive absolute צָרוֺר Numbers 25:17; … shew hostility toward, treat with enmity, vex, harass, with accusative of person Isaiah 11:13; Numbers 10:9; Numbers 25:17; once with ל person Numbers 25:18'
  - where: 'note 25:17 “Vex the Midianites”'
    claim: 'A modern translation: Harass the Midianites ... they have harassed you'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+25&version=NRSVUE'
    quote: '“Harass the Midianites, and defeat them,(K) 18 for they have harassed you by the trickery with which they deceived you in the affair of Peor'
  - where: 'note 25:17 “Vex the Midianites”'
    claim: 'Chapter 31 names Balaam''s counsel in the matter of Peor'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/31?lang=eng'
    quote: 'Behold, these caused the children of Israel, through the counsel of Balaam, to commit trespass against the Lord in the matter of Peor'
  - where: 'christ'
    claim: 'The heading of 1 Corinthians 10 calls Christ the God of Israel and the spiritual Rock'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/10?lang=eng'
    quote: 'Christ is the God of Israel and the spiritual Rock that guided them'
  - where: 'christ'
    claim: 'Paul wrote these things for our admonition'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/10?lang=eng'
    quote: 'Now all these things happened unto them for ensamples: and they are written for our admonition, upon whom the ends of the world are come.'
  - where: 'christ'
    claim: 'Verse 13 calls the deed an atonement'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/25?lang=eng'
    quote: 'because he was zealous for his God, and made an atonement for the children of Israel.'
  - where: 'christ'
    claim: 'No law, ordinance or sacrifice would suffice without the Atonement of Jesus Christ'
    key: bd-atonement
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/atonement?lang=eng'
    quote: 'The scriptures point out that no law, ordinance, or sacrifice would be satisfactory if it were not for the Atonement of Jesus Christ'
  - where: 'christ'
    claim: 'Whatever one sets heart and trust in most is one''s god'
    key: kimball-false-gods
    url: 'https://www.churchofjesuschrist.org/study/ensign/1976/06/the-false-gods-we-worship?lang=eng'
    quote: 'Whatever thing a man sets his heart and his trust in most is his god; and if his god doesn’t also happen to be the true and living God of Israel, that man is laboring in idolatry.'
  - where: 'christ'
    claim: 'Hoskisson sets Kimball''s warning about false gods beside the worship at Baal-peor'
    key: hoskisson-plan
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/plan-salvation-first-six-books-old-testament'
    quote: 'Temptations may also come in the form of worshipping other gods, as some Israelites did at Baal-Peor (see Numbers 25:1–5). … President Spencer W. Kimball, warned the present-day members of the Church about “the false gods we worship.”'
