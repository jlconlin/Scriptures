chapter: 7
claims:
  # ---------- when / setting ----------
  - where: 'when'
    claim: 'The tabernacle was set up on the first day of the first month of the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And it came to pass in the first month in the second year, on the first day of the month, that the tabernacle was reared up.'
  - where: 'setting'
    claim: 'Sinai is one of the three main locations of Numbers'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'The book of Numbers focuses on Israelite activities in three main locations: at Mount Sinai, near Kadesh, and at the plains of Moab.'
  - where: 'setting'
    claim: 'Numbers 1 is dated the first day of the second month of the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'on the first day of the second month, in the second year after they were come out of the land of Egypt, saying,'
  - where: 'setting'
    claim: 'The tabernacle set up a month earlier than Num. 1:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/40?lang=eng'
    quote: 'And it came to pass in the first month in the second year, on the first day of the month, that the tabernacle was reared up.'
  - where: 'setting'
    claim: 'One older reading: chronologically after Lev. 8:10, told here to keep the Sinai laws together and because the wagons were needed for the march'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/7.htm'
    quote: 'Chronologically considered, this ought to have been noticed after Leviticus 8:10. But in order to avoid interrupting the connection of the Sinaitic laws, it is introduced for the first time at this point … because these gifts consisted in part of materials that were indispensably necessary for the transport of the tabernacle'
  - where: 'setting'
    claim: 'Another older reading: verse 2 presupposes the census; “on the day” taken loosely as “at the time when,” compare verse 88'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/7.htm'
    quote: 'the following verse (‘them that were numbered’) presupposes the census … or ‘on the day that’ must be understood loosely to mean ‘at the time when’—‘after.’ Cf. Numbers 7:84 (‘in the day when it was anointed’) with Numbers 7:88 (‘after that it was anointed’).'
  - where: 'setting'
    claim: 'The princes are the twelve named in Num. 1:5–15'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/7.htm'
    quote: 'The twelve princes named in Numbers 1:5-15, one for each of the secular tribes, brought gifts for the Tabernacle.'
  - where: 'setting'
    claim: 'The anointing of the tabernacle is told in Lev. 8:10–11'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/7.htm'
    quote: 'anointed and sanctified the dwelling and the altar, together with their furniture (Leviticus 8:10-11).'

  # ---------- thread ----------
  - where: 'thread'
    claim: 'Each prince brings the same offering; the items are repeated twelve times and then totaled'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/7.htm'
    quote: 'each prince made an offering, identically the same in every case … the writer therefore enumerates the items practically verbatim twelve times. And in Numbers 7:84-88 he repeats them yet again with the figures multiplied by twelve, in order to sum up the grand total.'
  - where: 'thread'
    claim: 'One older reading: the voice was the LORD’s reply to the princes, the reason verse 89 is joined to the gifts'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/7.htm'
    quote: 'was Jehovah''s reply to the joyfulness and readiness with which the princes of Israel responded to Him, and made the tent, so far as they were concerned, a place of holy meeting"'' (Baumg.). This was the reason for connecting the remark in Numbers 7:89 with the account of the dedicatory gifts.'

  # ---------- note 7:9 ----------
  - where: 'note 7:9 “Why the sons of Kohath got no wagons”'
    claim: 'Num. 4:15: Aaron covers the holy things, the Kohathites bear them and may not touch them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/4?lang=eng'
    quote: 'after that, the sons of Kohath shall come to bear it: but they shall not touch any holy thing, lest they die. These things are the burden of the sons of Kohath'
  - where: 'note 7:9 “Why the sons of Kohath got no wagons”'
    claim: 'Gershon bore the curtains and coverings of the tabernacle (Num. 4:25–26)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/4?lang=eng'
    quote: 'And they shall bear the curtains of the tabernacle, and the tabernacle of the congregation, his covering, and the covering of the badgers’ skins'
  - where: 'note 7:9 “Why the sons of Kohath got no wagons”'
    claim: 'Merari bore the boards, bars, pillars and sockets (Num. 4:31–32)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/4?lang=eng'
    quote: 'the boards of the tabernacle, and the bars thereof, and the pillars thereof, and sockets thereof'

  # ---------- note 7:11 ----------
  - where: 'note 7:11 “Twelve days, twelve identical gifts”'
    claim: 'One older reading: the gifts were for immediate sacrifice; the court could not take 252 animals in a day, nor the altar burn 36 whole animals and the fat of 216'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/7.htm'
    quote: 'For the limited space in the court of the tabernacle would not have allowed of 252 animals being received, slaughtered, and prepared for sacrificing all at once, or on the same day; and it would have been also impossible to burn 36 whole animals (oxen, rams, and sheep), and the fat portions of 216 animals'
  - where: 'note 7:11 “Twelve days, twelve identical gifts”'
    claim: 'Another older reading: the repetition emphasizes the princes’ liberality'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/7.htm'
    quote: 'The mechanical formulas and verbal repetitions are, to modern ears, monotonous and tautological; but for the writer it was evidently a delight to emphasize by this means the liberality of the princes.'
  - where: 'note 7:11 “Twelve days, twelve identical gifts”'
    claim: 'The order of the princes is the order of the camp in chapter 2, Judah first, Naphtali last'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/7.htm'
    quote: 'The order in which the twelve princes, whose names have already been given at Numbers 1:5-15, made their presentation, corresponded to the order of the tribes in the camp (ch. 2), the tribe-prince of Judah taking the lead, and the prince of Naphtali coming last.'
  - where: 'note 7:11 “Twelve days, twelve identical gifts”'
    claim: 'A dish of 130 shekels was about 4 1/2 lbs'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/7.htm'
    quote: 'a silver dish (kearah, Exodus 25:29) of 130 sacred shekels weight, i.e., about 4 1/2 lbs.'
  - where: 'note 7:11 “Twelve days, twelve identical gifts”'
    claim: 'Judah on the east (Num. 2:3), first on the march (Num. 10:14), Naphtali last (Num. 2:29)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/2?lang=eng'
    quote: 'And on the east side toward the rising of the sun shall they of the standard of the camp of Judah pitch throughout their armies'

  # ---------- note 7:89 ----------
  - where: 'note 7:89 “The LORD answers from the mercy seat”'
    claim: 'Ancient pattern: once the temple was finished, the people offered sacrifices'
    key: sc-knowhy-806
    url: 'https://scripturecentral.org/knowhy/how-does-the-construction-of-the-kirtland-temple-follow-ancient-patterns'
    quote: 'In the ancient world, once the temple was finished the people would assemble and offer sacrifices, and norms would be set for proper temple worship.'
  - where: 'note 7:89 “The LORD answers from the mercy seat”'
    claim: 'After dedication God comes to the house; Moses heard God from the mercy seat; the cloud filled the tabernacle and Solomon’s temple'
    key: sc-knowhy-806
    url: 'https://scripturecentral.org/knowhy/how-does-the-construction-of-the-kirtland-temple-follow-ancient-patterns'
    quote: 'Finally, after the temple is dedicated, God comes to His new house in glory. When the children of Israel finished the tabernacle, “a cloud covered the tent of the congregation, and the glory of the Lord filled the tabernacle” (Exodus 40:34).'
  - where: 'note 7:89 “The LORD answers from the mercy seat”'
    claim: 'Moses heard the voice of God speaking from the mercy seat'
    key: sc-knowhy-806
    url: 'https://scripturecentral.org/knowhy/how-does-the-construction-of-the-kirtland-temple-follow-ancient-patterns'
    quote: 'Once God has entered the temple, great blessings of power and authority are bestowed on the prophet or king who built it. Moses heard the voice of God speaking from the mercy seat (Numbers 7:89).'
  - where: 'note 7:89 “The LORD answers from the mercy seat”'
    claim: 'The promise of Ex. 25:22 that the LORD would commune with Moses from above the mercy seat'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/7?lang=eng'
    quote: 'then he heard the voice of one speaking unto him from off the mercy seat that was upon the ark of testimony, from between the two cherubims: and he spake unto him.'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'The Lord accepted the Kirtland Temple and promised to manifest himself in mercy there'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'For behold, I have accepted this house, and my name shall be here; and I will manifest myself to my people in mercy in this house.'
  - where: 'christ'
    claim: 'Each dedicated temple is accepted as a house of the Lord'
    key: sc-knowhy-806
    url: 'https://scripturecentral.org/knowhy/how-does-the-construction-of-the-kirtland-temple-follow-ancient-patterns'
    quote: 'When each temple is dedicated, it is accepted as a house of the Lord and is a place where sacred ordinances can be performed.'
  - where: 'christ'
    claim: 'Temples are built through the sacrifice and consecration of the people'
    key: sc-knowhy-806
    url: 'https://scripturecentral.org/knowhy/how-does-the-construction-of-the-kirtland-temple-follow-ancient-patterns'
    quote: 'Temples in both antiquity and this dispensation are built from the finest materials available through the sacrifice and consecration of the people.'
  - where: 'christ'
    claim: 'On the Day of Atonement the high priest sprinkled the blood upon the mercy seat'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/16?lang=eng'
    quote: 'Then shall he kill the goat of the sin offering, that is for the people, and bring his blood within the veil, and do with that blood as he did with the blood of the bullock, and sprinkle it upon the mercy seat'
  - where: 'christ'
    claim: 'Hebrews calls the holy places made with hands figures of the true; Christ entered heaven itself'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'For Christ is not entered into the holy places made with hands, which are the figures of the true; but into heaven itself, now to appear in the presence of God for us:'
  - where: 'christ'
    claim: 'The vision of D&C 110 was in the Kirtland Temple in 1836'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/110?lang=eng'
    quote: 'Visions manifested to Joseph Smith the Prophet and Oliver Cowdery in the temple at Kirtland, Ohio, April 3, 1836.'
