chapter: 21
claims:
  - where: 'when'
    claim: 'Aaron died on mount Hor in the fortieth year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'And Aaron the priest went up into mount Hor at the commandment of the Lord, and died there, in the fortieth year after the children of Israel were come out of the land of Egypt'
  - where: 'setting'
    claim: 'Scripture Helps groups chapters 10–21 as the journey from Sinai, the refusal and the wandering, and 22–36 as the plains of Moab'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'Chapters 10–21: The Israelites’ journey from Sinai to the southern borders of Canaan, their refusal to enter Canaan, and their subsequent wandering in the wilderness.'
  - where: 'setting'
    claim: 'The events on the way to the plains of Moab include Aaron''s death, the serpents and the victories over Sihon and Og'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Events recounted on the way to the plains of Moab included the death of Aaron (Numbers 20:22–29), the Israelites’ being bitten by snakes and Moses’s subsequent raising of a bronze image of a snake to provide deliverance for them (21:4–9), and military victories against the Amorite king Sihon and against Og'
  - where: 'setting'
    claim: 'Edom refused passage, so Israel went the long way around it'
    key: pierce-brazen-serpent
    url: 'https://rsc.byu.edu/i-glory-my-jesus/brazen-serpent-symbol-jesus-christ'
    quote: 'The king of Edom would not allow safe passage across his land, so the Israelites began the long circumnavigation of Edom'
  - where: 'setting'
    claim: 'The Book of Mormon mentions the brazen serpent six times, always likened to Christ'
    key: pierce-brazen-serpent
    url: 'https://rsc.byu.edu/i-glory-my-jesus/brazen-serpent-symbol-jesus-christ'
    quote: 'The narrative surrounding the brazen serpent in the Old Testament is mentioned six times in the Book of Mormon, where it is always likened to Jesus Christ.'
  - where: 'setting'
    claim: 'Numbers preserves fragments of ancient poetry, three of them in chapter 21'
    key: bd-numbers
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/numbers?lang=eng'
    quote: 'The book is remarkable for the number of fragments of ancient poetry preserved in it (6:24–26; 10:35–36; 21:14–15, 17–18, 27–30).'
  - where: 'thread'
    claim: 'The battles of Numbers 21 gave Israel experience of what Deuteronomy''s ḥērem commands meant'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Numbers 21 contains three examples of conflicts involving the ḥērem prior to Israel’s entry into the promised land. These passages are significant because they set up the background for the inaugural commandments in Deuteronomy; by the time those commandments were given, Israel knew by experience what they meant.'
  - where: 'thread'
    claim: 'The victories over Sihon and Og alarmed Balak and led him to hire Balaam'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'The Israelites had not attacked the Moabites, but the Israelites’ success in defeating the Amorite kings Sihon and Og (chapter 21) provided Balak ample reason for concern. To counteract this perceived threat, Balak sent messengers to hire Balaam'
  - where: 'section 2 plain'
    claim: 'The adjective rendered “light” means contemptible, worthless'
    key: bdb
    url: 'https://biblehub.com/hebrew/7052.htm'
    quote: 'קְלֹקֵל adjective contemptible, worthless'
  - where: 'note 21:3 “Hormah, the place of the ban”'
    claim: 'The verb of the ḥērem, heḥĕrīm, is translated “utterly destroy” at Num. 21:2'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The related Hiphil (causative) verb heḥĕrīm is usually translated as “utterly destroy” (Numbers 21:2, etc.)'
  - where: 'note 21:3 “Hormah, the place of the ban”'
    claim: 'Israel vowed to utterly destroy the Canaanites of Arad if Jehovah granted victory'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'In Numbers 21:1–3, the Israelites, having suffered defeat at the hands of the Canaanites of the city Arad, make a vow to Jehovah. They promise that if he grants them victory, they will utterly destroy (heḥĕrīm) these Canaanites and their cities, which they do.'
  - where: 'note 21:3 “Hormah, the place of the ban”'
    claim: 'Older reading: Hormah means “banning, ban-place,” and “the place” is the battlefield'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/21.htm'
    quote: '"And they called the place Hormah," i.e., banning, ban-place. "The place" can only mean the spot where the Canaanites were defeated by the Israelites.'
  - where: 'note 21:3 “Hormah, the place of the ban”'
    claim: 'Older reading: Zephath may be called Hormah by anticipation in Joshua, or the name was given more than once before it held after Joshua''s death'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/21.htm'
    quote: 'Zephath may be called Hormah proleptically both there and in Joshua 19:4 … the old name was restored by the Canaanites, or rather only retained, until the city was retaken and permanently held by the Israelites after Joshua''s death (Judges 1:16-17), and received the new name once for all.'
  - where: 'note 21:3 “Hormah, the place of the ban”'
    claim: 'Judah and Simeon destroyed Zephath and it was called Hormah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/judg/1?lang=eng'
    quote: 'they slew the Canaanites that inhabited Zephath, and utterly destroyed it. And the name of the city was called Hormah.'
  - where: 'note 21:5 “This light bread”'
    claim: 'qeloqel means contemptible, worthless, in Num. 21:5'
    key: bdb
    url: 'https://biblehub.com/hebrew/7052.htm'
    quote: 'קְלֹקֵל adjective contemptible, worthless (compare Ol§ 189 f BaNB 160); — ׳בַּלֶּחֶם הַקּ Numbers 21:5 (JE).'
  - where: 'note 21:5 “This light bread”'
    claim: 'A modern translation reads “this miserable food”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+21&version=NRSVUE'
    quote: 'For there is no food and no water, and we detest this miserable food.'
  - where: 'note 21:6 “Fiery serpents”'
    claim: 'seraphim, from the verb “to burn,” likely the pain of a venomous bite, or the scales'
    key: pierce-brazen-serpent
    url: 'https://rsc.byu.edu/i-glory-my-jesus/brazen-serpent-symbol-jesus-christ'
    quote: 'The Hebrew word used to describe the serpents as “fiery” (seraphim) comes from the verb “to burn” (saraph), which was likely a reference to the inflammatory pain that results from a venomous snakebite, although it could also refer to their vividly reflective scales.'
  - where: 'note 21:6 “Fiery serpents”'
    claim: 'The murmuring was more than complaint: mockery of God''s plan or open rebellion'
    key: pierce-brazen-serpent
    url: 'https://rsc.byu.edu/i-glory-my-jesus/brazen-serpent-symbol-jesus-christ'
    quote: 'the murmurings in the wilderness were not merely “muttered complaints” but could be viewed as “mocking God’s plan,” or even “open rebellion” against God and his prophet Moses.'
  - where: 'note 21:6 “Fiery serpents”'
    claim: 'The serpents as the Lord''s agents to bring repentance; “sent” as let loose'
    key: sc-knowhy-646
    url: 'https://scripturecentral.org/knowhy/were-there-fiery-flying-serpents-along-lehis-trail'
    quote: 'the fiery serpents act as agents of the Lord, sent by Him to afflict Israel and bring them to repentance. According to some scholars, the nuances of the Hebrew imply that the serpents were released or let go by the Lord'
  - where: 'note 21:6 “Fiery serpents”'
    claim: 'Deut. 8:15 recalls the fiery serpents of the wilderness'
    key: rappleye-serpents
    url: 'https://interpreterfoundation.org/journal/serpents-of-fire-and-brass-a-contextual-study-of-the-brazen-serpent-tradition-in-the-book-of-mormon'
    quote: 'In Deuteronomy 8:15, nḥš śrp are also paired together in reference to the “fiery serpent” in the wilderness,6 likely alluding to this same event.'
  - where: 'note 21:8 “Why an image of the thing that bit them”'
    claim: 'The serpent represents both the Savior, mercy and life, and the adversary, justice and death'
    key: pierce-brazen-serpent
    url: 'https://rsc.byu.edu/i-glory-my-jesus/brazen-serpent-symbol-jesus-christ'
    quote: 'the serpent not only represents the Savior, mercy, salvation, and life in the Book of Mormon and Bible but also the adversary, justice, punishment, and death.'
  - where: 'note 21:8 “Why an image of the thing that bit them”'
    claim: 'In the ancient Near East serpents were protectors and healers and also arbiters and rebukers; Christ represents justice and mercy'
    key: pierce-brazen-serpent
    url: 'https://rsc.byu.edu/i-glory-my-jesus/brazen-serpent-symbol-jesus-christ'
    quote: 'Serpents represented deities who would spit fire as protectors and healers but also as arbiters and rebukers. … we can better understand how Jesus Christ represents justice and mercy, chastisement and forgiveness, judgment and grace'
  - where: 'note 21:8 “Why an image of the thing that bit them”'
    claim: 'Serpents sent for unfaithfulness bring death; a serpent made at the Lord''s command brings life'
    key: pierce-brazen-serpent
    url: 'https://rsc.byu.edu/i-glory-my-jesus/brazen-serpent-symbol-jesus-christ'
    quote: 'On the one hand, fiery serpents were sent by the Lord as a consequence of the unfaithfulness of the Israelites, which led to punishment and death. On the other hand, instructions for the creation of a fiery serpent were provided by the Lord as a reward for the repentance'
  - where: 'note 21:8 “Why an image of the thing that bit them”'
    claim: 'When Alma compared Christ to the serpent, he mentioned the judgment'
    key: rappleye-serpents
    url: 'https://interpreterfoundation.org/journal/serpents-of-fire-and-brass-a-contextual-study-of-the-brazen-serpent-tradition-in-the-book-of-mormon'
    quote: 'this very dualism is at play in Numbers 21, “where the Snake is seen as the messenger [Page 238]of both life and death,” as Tabick points out.171 When Alma compared Christ to the brazen serpent, he mentioned “that all men shall stand before him to be judged'
  - where: 'note 21:8 “Lifted up on a standard”'
    claim: 'nēs means standard, ensign, signal, sign; here the pole supporting the serpent'
    key: bdb
    url: 'https://biblehub.com/hebrew/5251.htm'
    quote: 'נֵס noun [masculine] standard, ensign, signal, sign'
  - where: 'note 21:8 “Lifted up on a standard”'
    claim: 'BDB: standard, as pole, supporting the serpent of bronze'
    key: bdb
    url: 'https://biblehub.com/hebrew/5251.htm'
    quote: '2 standard, as pole, supporting serpent of bronze Numbers 21:8,9 (JE).'
  - where: 'note 21:8 “Lifted up on a standard”'
    claim: 'The pole is ns in the Hebrew'
    key: rappleye-serpents
    url: 'https://interpreterfoundation.org/journal/serpents-of-fire-and-brass-a-contextual-study-of-the-brazen-serpent-tradition-in-the-book-of-mormon'
    quote: 'Moses then made a nḥš nḥšt, “serpent of brass,” mounted it on a “pole” (ns), and those who looked upon it, lived (Numbers 21:8–9).'
  - where: 'note 21:8 “Lifted up on a standard”'
    claim: 'Nephi may have read the pole in light of Isaiah''s raised ensign, explaining “raise up” though Numbers lacks the verb'
    key: rappleye-serpents
    url: 'https://interpreterfoundation.org/journal/serpents-of-fire-and-brass-a-contextual-study-of-the-brazen-serpent-tradition-in-the-book-of-mormon'
    quote: 'Nephi may very well have understood Isaiah’s raised up ensign to be serpentine in nature, and thus fused them with the brazen serpent on a “pole” in his interpretation of Numbers 21.195'
  - where: 'note 21:8 “Lifted up on a standard”'
    claim: 'The expression “raise up” does not appear in Numbers 21; Nephi son of Helaman joined the lifting of serpent and Savior'
    key: rappleye-serpents
    url: 'https://interpreterfoundation.org/journal/serpents-of-fire-and-brass-a-contextual-study-of-the-brazen-serpent-tradition-in-the-book-of-mormon'
    quote: 'This would explain why Nephi spoke of “the serpent which [Moses] did raise up before them” (2 Nephi 25:20), even though the expression nśʾ does not appear in Numbers 21.'
  - where: 'note 21:8 “Lifted up on a standard”'
    claim: 'The Book of Mormon mentions the story six times, always likened to Christ, who was lifted up'
    key: pierce-brazen-serpent
    url: 'https://rsc.byu.edu/i-glory-my-jesus/brazen-serpent-symbol-jesus-christ'
    quote: 'Nephi, Alma the Younger, and Nephi the son of Helaman all speak of the brazen serpent as a symbol of Christ, who was also lifted up like the serpent in order to heal and save those who would look to him.'
  - where: 'note 21:9 “What became of the brass serpent”'
    claim: 'Moses made a nehash nehosheth, whose fiery nature was likely the shine of bronze'
    key: pierce-brazen-serpent
    url: 'https://rsc.byu.edu/i-glory-my-jesus/brazen-serpent-symbol-jesus-christ'
    quote: 'Moses created a “serpent of brass” (nehash nehosheth), placed it upon a pole, and those who had been bitten were healed after looking at the brazen serpent, whose “fiery” nature was likely due to the reflective shine of its bronze material (verse 9).'
  - where: 'note 21:9 “What became of the brass serpent”'
    claim: 'Some scholars believe it was placed in the temple; by Hezekiah''s reign it was worshipped; nehosheth means copper, bronze; the symbol shifted to idol worship'
    key: pierce-brazen-serpent
    url: 'https://rsc.byu.edu/i-glory-my-jesus/brazen-serpent-symbol-jesus-christ'
    quote: 'Some scholars believe that the brazen serpent was eventually placed in the temple … King Hezekiah referred to the brazen serpent as “Nehushtan” (nehosheth, “copper, bronze”)'
  - where: 'note 21:9 “What became of the brass serpent”'
    claim: 'The symbol shifted from the Lord''s healing power to an object of idol worship'
    key: pierce-brazen-serpent
    url: 'https://rsc.byu.edu/i-glory-my-jesus/brazen-serpent-symbol-jesus-christ'
    quote: 'The ambivalent symbolism of the serpent had shifted again, in this case, from an object representing the healing power of the Lord for the faithful, to an object of unfaithful idol worship that needed to be destroyed.'
  - where: 'note 21:9 “What became of the brass serpent”'
    claim: 'Nehushtan is probably not a proper name but a dismissal: a piece of bronze/copper'
    key: rappleye-serpents
    url: 'https://interpreterfoundation.org/journal/serpents-of-fire-and-brass-a-contextual-study-of-the-brazen-serpent-tradition-in-the-book-of-mormon'
    quote: 'The declaration of it as “Nehushtan” (nḥštn) is probably not a proper name as typically translated but rather a pejorative dismissal of the object as just a “piece of bronze/copper” unworthy of worship.'
  - where: 'note 21:9 “What became of the brass serpent”'
    claim: 'It had become as much a graven image as the other idols'
    key: halverson-swine
    url: 'https://rsc.byu.edu/ascending-mountain-lord/swines-blood-broken-serpents-rejection-rehabilitation-worship-old-testament'
    quote: 'Though the brazen serpent had originally been fashioned to center Israel’s faith in the promises of God, in the intervening centuries it had become as much a graven image as the other idols Hezekiah was attempting to destroy.'
  - where: 'note 21:9 “What became of the brass serpent”'
    claim: 'Not the serpent as object but as symbol let them look and live; look through, not to'
    key: halverson-swine
    url: 'https://rsc.byu.edu/ascending-mountain-lord/swines-blood-broken-serpents-rejection-rehabilitation-worship-old-testament'
    quote: 'with the counsel to look through them rather than looking to them, as was the case with the serpent Moses fashioned of brass. It was not the brazen serpent as object but as symbol that allowed the stricken Israelites to look and live'
  - where: 'note 21:14 “A lost book of songs”'
    claim: 'The book of the Wars of the Lord is first among the lost books, considered authentic and valuable'
    key: bd-lost-books
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/lost-books?lang=eng'
    quote: 'The so-called lost books of the Bible are those documents that are mentioned in the Bible in such a way that it is evident they were considered authentic and valuable but that are not found in the Bible today. … book of the Wars of the Lord (Num. 21:14)'
  - where: 'note 21:14 “A lost book of songs”'
    claim: 'The three songs of chapter 21 are among the fragments of ancient poetry in Numbers'
    key: bd-numbers
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/numbers?lang=eng'
    quote: 'The book is remarkable for the number of fragments of ancient poetry preserved in it (6:24–26; 10:35–36; 21:14–15, 17–18, 27–30).'
  - where: 'note 21:14 “A lost book of songs”'
    claim: 'Older reading: a collection of odes of Moses'' time celebrating the Lord''s acts'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/21.htm'
    quote: 'a collection of odes of the time of Moses himself, in celebration of the glorious acts of the Lord to and for the Israelites'
  - where: 'note 21:14 “A lost book of songs”'
    claim: 'Older reading: Vaheb a place name, “in storm”; the strophe lacks subject and verb because hearers knew it'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/21.htm'
    quote: 'The strophe selected from the ode has neither subject nor verb in it, as the ode was well known to the contemporaries … Vaheb is no doubt the proper name of an Amoritish fortress; and בּסוּפה, "in storm," is to be explained according to Nahum 1:3'
  - where: 'note 21:14 “A lost book of songs”'
    claim: 'A modern translation reads “Waheb in Suphah”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+21&version=NRSVUE'
    quote: '“Waheb in Suphah and the wadis.'
  - where: 'note 21:17 “The song of the well”'
    claim: 'Older reading: Beer means a well; water given by commanding wells to be dug, not from a rock; mehoqeq is the ruler''s staff'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/21.htm'
    quote: 'They proceeded thence to Beer (a well), a place of encampment which received its name from the fact that here God gave the people water, not as before by a miraculous supply from a rock, but by commanding wells to be dug.'
  - where: 'note 21:17 “The song of the well”'
    claim: 'The word behind “lawgiver” is the ruler''s staff, as in Gen. 49:10'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/21.htm'
    quote: 'מחקק, ruler''s staff, cf. Genesis 49:10.'
  - where: 'note 21:17 “The song of the well”'
    claim: 'A modern translation reads “with the scepter, with the staff”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+21&version=NRSVUE'
    quote: 'with the scepter, with the staff.”'
  - where: 'note 21:27 “The song of Heshbon”'
    claim: 'A modern translation reads “the singers”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers+21&version=NRSVUE'
    quote: '27 Therefore the singers say,'
  - where: 'christ'
    claim: 'The chapter heading of 1 Corinthians 10 calls Christ the God of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/10?lang=eng'
    quote: 'Christ is the God of Israel and the spiritual Rock that guided them'
  - where: 'explore'
    claim: 'Alma joins the Liahona, the words of Christ and the brazen serpent'
    key: pierce-brazen-serpent
    url: 'https://rsc.byu.edu/i-glory-my-jesus/brazen-serpent-symbol-jesus-christ'
    quote: 'In this instance, Alma made a strong connection between the words of Jesus Christ, the Liahona, and the brazen serpent.'
  - where: 'note 21:27 “The song of Heshbon”'
    claim: 'The song follows verse 26 on Sihon''s war with Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
    quote: 'For Heshbon was the city of Sihon the king of the Amorites, who had fought against the former king of Moab, and taken all his land out of his hand, even unto Arnon.'
  - where: 'note 21:6 “Fiery serpents”'
    claim: 'Seraphim is the same term Isaiah used for the six-winged beings of his vision'
    key: rappleye-serpents
    url: 'https://interpreterfoundation.org/journal/serpents-of-fire-and-brass-a-contextual-study-of-the-brazen-serpent-tradition-in-the-book-of-mormon'
    quote: 'seraphim is the same term Isaiah used to describe the fiery, angelic beings with six wings that he saw as part of his throne-theophany (Isaiah 6:1–7)'
  - where: 'thread'
    claim: 'Numbers does not mention the ḥērem in the wars with Sihon and Og'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The account in Numbers does not mention the ḥērem.'
  - where: 'explore'
    claim: 'Numbers does not mention the ḥērem in the wars with Sihon and Og'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The account in Numbers does not mention the ḥērem.'
  - where: 'note 21:14 “A lost book of songs”'
    claim: 'The Church edition gives the Hebrew of “Red sea” as Reed Sea, also in verse 14'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
    quote: 'HEB Reed Sea (also v. 14).'
