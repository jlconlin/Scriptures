chapter: 32
claims:
  - where: 'when'
    claim: 'Aaron died in the fortieth year (33:38); his death is told at 20:28, and the book sets chapters 22–36 on the plains of Moab after it, in that year (the brief''s convention for `when`)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'And Aaron the priest went up into mount Hor at the commandment of the Lord, and died there, in the fortieth year after the children of Israel were come out of the land of Egypt'
  - where: 'setting'
    claim: 'Chapter 32 belongs to the last part of Numbers, the months on the plains of Moab, with Balaam, Peor, the census and Joshua'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'the investiture of Joshua as Moses’s successor (27:12–23), and arrangements for the tribes of Reuben, Gad, and half the tribe of Manasseh to settle in Transjordan, the region east of the Jordan River (chapter 32).'
  - where: 'setting'
    claim: 'Gilead is a wooded highland east of the Jordan'
    key: bd-gilead
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gilead?lang=eng'
    quote: 'A highland district east of the Jordan, south of Bashan, rising in parts to an elevation of 4000 feet above the sea. It is well wooded and crossed by deep glens that descend toward Jordan.'
  - where: 'setting'
    claim: 'When the land was won, Joshua sent the eastern tribes home'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'So Joshua blessed them, and sent them away: and they went unto their tents.'
  - where: 'setting'
    claim: 'The eastern tribes crossed armed before their brethren'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/4?lang=eng'
    quote: 'And the children of Reuben, and the children of Gad, and half the tribe of Manasseh, passed over armed before the children of Israel, as Moses spake unto them:'
  - where: 'thread'
    claim: 'The last part of Numbers places the second census after the Exodus generation had died'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'a second Israelite numbering (or census), now that the people of the Exodus generation were dead and their successors were on the doorstep of the promised land (chapter 26, see especially verses 64–65)'
  - where: 'thread'
    claim: 'In verses 8–13 Moses reminds them of the events of Numbers 13 and 14'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/32.htm'
    quote: 'In Numbers 32:8-13, Moses reminds them of the occurrences described in ch. 13 and 14.'
  - where: 'thread'
    claim: 'Moses binds Eleazar, Joshua and the heads of the tribes, those who will divide the land, to the agreement'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/32.htm'
    quote: 'Moses thereupon commanded Eleazar, Joshua, and the heads of the tribes of Israel, i.e., the persons entrusted in Numbers 34:17. with the division of the land of Canaan'
  - where: 'note 32:1 “Why they wanted Gilead”'
    claim: 'Gilead is wooded and crossed by glens'
    key: bd-gilead
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/gilead?lang=eng'
    quote: 'It is well wooded and crossed by deep glens that descend toward Jordan.'
  - where: 'note 32:1 “Why they wanted Gilead”'
    claim: 'Jazer named first for its pasture; Gilead fertile'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/32.htm'
    quote: 'They put Jazer first, probably because this district was especially rich in excellent pasture land. … Ancient Gilead still shows numerous traces of great fertility even in its present desolation'
  - where: 'note 32:1 “Why they wanted Gilead”'
    claim: '“The country which the LORD smote” describes a land without a ruler after Sihon’s defeat'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/32.htm'
    quote: 'in which the defeat of Sihon is referred to, describes it as one that was without a ruler, and therefore could easily be taken possession of.'
  - where: 'note 32:6 “Settling first while the others fight”'
    claim: '“Bring us not over Jordan” can be read two ways; Moses took it as a wish to settle at once, probably rightly, since they did not deny it'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/32.htm'
    quote: 'but they may also be understood as expressing a wish to settle at once in the land to the east of the Jordan, and leave the other tribes to conquer Canaan alone. Moses understood them in the latter sense … when Moses reproved them, the speakers did not reply that they had not cherished the intention attributed to them'
  - where: 'note 32:6 “Settling first while the others fight”'
    claim: 'Moses first blames their lack of brotherly feeling, then their discouraging the others'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/32.htm'
    quote: 'Moses first of all blames their want of brotherly feeling: "Shall your brethren go into the war, and ye sit here?" He then calls their attention to the fact, that by their disinclination they would take away the courage'
  - where: 'note 32:6 “Settling first while the others fight”'
    claim: 'If they did not cross, they would be settled in Canaan to prevent a schism'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/32.htm'
    quote: 'they were not only to receive no possession in the land to the east of the Jordan, but were to be compelled to go over the Jordan with their wives and children, and to receive an inheritance there for the purpose of preventing a schism of the nation.'
  - where: 'note 32:6 “Settling first while the others fight”'
    claim: 'The eastern tribes crossed armed as Moses had said'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/4?lang=eng'
    quote: 'And the children of Reuben, and the children of Gad, and half the tribe of Manasseh, passed over armed before the children of Israel, as Moses spake unto them:'
  - where: 'note 32:6 “Settling first while the others fight”'
    claim: 'Joshua told them they had not left their brethren'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/22?lang=eng'
    quote: 'Ye have not left your brethren these many days unto this day, but have kept the charge of the commandment of the Lord your God.'
  - where: 'note 32:14 “A brood in their fathers'' place”'
    claim: 'The Hebrew for “increase” is from the verb “multiply,” equivalent to a brood'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/32.htm'
    quote: '"an increase (תּרבּוּת, from רבה; equivalent to a brood) of sinners, to augment yet the burning of the wrath of Jehovah against Israel."'
  - where: 'note 32:14 “A brood in their fathers'' place”'
    claim: 'Verse 15: the LORD would leave Israel longer in the desert, and they would bring destruction on all'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/32.htm'
    quote: '"He will leave it (Israel) still longer in the desert, and ye prepare destruction for all this nation."'
  - where: 'note 32:20 “Before Israel, or before the LORD”'
    claim: 'In a war at God’s command Israel was Jehovah’s army with the ark; the tribes in v. 17 promised only to help their brethren'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/32.htm'
    quote: 'the Israelites were the army of Jehovah, with Jehovah in the midst. Hence the ark of the covenant was taken into the war … whereas it remained behind in the camp, when the people wanted to press forward into Canaan of their own accord (Numbers 14:44).'
  - where: 'note 32:20 “Before Israel, or before the LORD”'
    claim: 'The tribes said “before the children of Israel” in v. 17 because they promised only to help'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/32.htm'
    quote: 'we may easily understand why the Reubenites and Gadites do not make use of it in Numbers 32:17, namely, because they only promise to go equipped "before the children of Israel," i.e., to help their brethren'
  - where: 'note 32:20 “Before Israel, or before the LORD”'
    claim: 'In v. 32 they adopt the phrase after hearing it from Moses'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/32.htm'
    quote: 'In Numbers 32:32 they also adopt the expression, after hearing it from the mouth of Moses (Numbers 32:20).'
  - where: 'note 32:20 “Before Israel, or before the LORD”'
    claim: '“Before the LORD” in v. 22 means with divine approval'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/32.htm'
    quote: 'In Numbers 32:22, "before Jehovah" signifies according to the judgment of Jehovah, with divine approval.'
  - where: 'note 32:23 “Your sin will find you”'
    claim: 'Literally “know your sin, that it will find you”; the rendering became proverbial; sin as having its own existence; Gen. 4:7'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/32.htm'
    quote: 'lit. ‘know your sin, that it will find you.’ The rendering of the E.V., which has passed, as a proverbial expression, into our current language, is based upon an ancient notion that sin, like a curse, has so to speak an individual existence.'
  - where: 'note 32:23 “Your sin will find you”'
    claim: 'The sinner cannot escape; compare Gen. 4:7'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/32.htm'
    quote: 'The sinner cannot escape its consequences; it will search and find him wherever he may hide himself. Cf. Genesis 4:7 ‘sin coucheth at the door.’'
  - where: 'note 32:23 “Your sin will find you”'
    claim: '“Find” as overtake or smite; they will have to atone'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/32.htm'
    quote: '"ye will know your sin," which will overtake (מצא) or smite you, i.e., ye will have to make atonement for them.'
  - where: 'note 32:34 “Ataroth and the Moabite Stone”'
    claim: 'The Mesha stela, ninth century BC, records Mesha’s war with Israel and the destruction of Ataroth and Nebo'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'One of these inscriptions is the stela of Mesha, king of Moab, also known as the Moabite Stone (ninth century BC). … The inscription records the destruction of two cities whose treatment matches the biblical descriptions of ḥērem: Ataroth (lines 10–14) and Nebo (lines 14–18).'
  - where: 'note 32:34 “Ataroth and the Moabite Stone”'
    claim: 'Mesha: the people of Gad had settled in Ataroth from of old'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The people of Gad had settled in Ataroth from of old, and the king of Israel built up Ataroth for him.[54] So I fought against the city and seized it. I killed all the people'
  - where: 'note 32:34 “Ataroth and the Moabite Stone”'
    claim: 'Numbers 32:34 perhaps offers an Israelite connection to Mesha’s story'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'Numbers 32:34 mentions the people of Gad building up Ataroth, perhaps offering an additional Israelite connection to the story of Mesha.'
  - where: 'note 32:34 “Ataroth and the Moabite Stone”'
    claim: 'Mesha’s rebellion is in 2 Kings 3:4–5'
    key: calabro-herem
    url: 'https://rsc.byu.edu/wilderness-monarchy/thou-shalt-utterly-destroy'
    quote: 'The rebellion of Mesha of Moab against Israel is mentioned in 2 Kings 3:4–5 and took place in the ninth century BC.'
  - where: 'note 32:34 “Ataroth and the Moabite Stone”'
    claim: 'Ataruz is equated with Ataroth, built by Gad'
    key: schade-ataruz
    url: 'https://rsc.byu.edu/fall-2017/student-sections'
    quote: 'Ataruz has been equated with the biblical city of Ataroth, built by the tribe of Gad (Numbers 32:34) and famously mentioned and described as an Israelite, and later Moabite, cultic center in the Moabite Mesha Inscription.'
  - where: 'note 32:38 “Why the names were changed”'
    claim: 'Some take the parenthesis as a marginal note to read the names otherwise; it refers to Nebo and Baal-meon, which suggested pagan worship'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/32.htm'
    quote: 'Some think that it is a marginal note to the reader that the names are to be changed and read otherwise than they are written in the text. The words refer to Nebo and Baal-meon. Both Nebo and Baal suggested pagan worship'
  - where: 'note 32:38 “Why the names were changed”'
    claim: 'Examples of altered Baal names'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/32.htm'
    quote: 'the latter was frequently altered, e.g. Ish-bosheth, Mephi-bosheth, El-yada, for Ish-baal, Merib-baal, Baal-yada.'
  - where: 'note 32:38 “Why the names were changed”'
    claim: 'Nebo was a Babylonian god of wisdom'
    key: bd-nebo
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nebo?lang=eng'
    quote: '(2) Babylonian god of wisdom, being regarded as the son of Bel-Merodach, the patron god of Babylon (Isa. 46:1).'
  - where: 'note 32:38 “Why the names were changed”'
    claim: 'They built the towns with an alteration of names'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/32.htm'
    quote: '"they built the towns with an alteration of their names," mutatis nominibus'
  - where: 'note 32:39 “Half of Manasseh, and the towns of Jair”'
    claim: 'Moses gave the Manassites the land they conquered: Bashan and northern Gilead'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/32.htm'
    quote: 'Moses gave the Manassites the land which was conquered by them; in fact, the whole of the kingdom of Bashan, including not only the province of Bashan, but the northern half of Gilead'
  - where: 'note 32:39 “Half of Manasseh, and the towns of Jair”'
    claim: 'Havvoth-Jair the tent villages of Jair; the clan is Jair the Gileadite of Judges 10:3–4'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/32.htm'
    quote: 'This Manassite clan that took Gilead and gave its name to the district Havvôth-Jair (‘the towns of Jair,’ marg. or better ‘the tent villages of J .’) is mentioned in Jdg 10:3-4 as Jair the Gileadite'
  - where: 'note 32:39 “Half of Manasseh, and the towns of Jair”'
    claim: 'ḥawwāh means tent-village'
    key: bdb
    url: 'https://biblehub.com/hebrew/2333.htm'
    quote: 'II. [חַוָּה] noun feminine tent-village — Plural חַוֹּתֵיהֶם Numbers 32:41'
  - where: 'note 32:39 “Half of Manasseh, and the towns of Jair”'
    claim: 'Deut. 3:14 places Jair’s conquest in Argob'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/3?lang=eng'
    quote: 'Jair the son of Manasseh took all the country of Argob unto the coasts of Geshuri and Maachathi; and called them after his own name, Bashan-havoth-jair, unto this day.'
  - where: 'note 32:39 “Half of Manasseh, and the towns of Jair”'
    claim: 'Argob is a region of walled cities'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/3?lang=eng'
    quote: 'All these cities were fenced with high walls, gates, and bars'
  - where: 'note 32:39 “Half of Manasseh, and the towns of Jair”'
    claim: 'One older reading: Deut. 3:5’s fenced cities of Argob do not agree with a clan in tent villages'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/32.htm'
    quote: 'But Deuteronomy 3:5 is not in agreement with that, because Argob is described as a region of fenced cities with ‘high walls, gates, and bars’; while the clan dwelt in tent villages.'
  - where: 'christ'
    claim: 'Paul says the Rock that followed Israel in the wilderness was Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/10?lang=eng'
    quote: 'for they drank of that spiritual Rock that followed them: and that Rock was Christ.'
