chapter: 5
claims:
  - where: 'when'
    claim: 'Numbers opens at Sinai in the second year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'And the Lord spake unto Moses in the wilderness of Sinai, in the tabernacle of the congregation, on the first day of the second month, in the second year after they were come out of the land of Egypt'
  - where: 'setting'
    claim: 'The Bible Dictionary makes 1:1–10:10 the preparation for departure from Sinai'
    key: bd-numbers
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/numbers?lang=eng'
    quote: '(1) 1:1–10:10, preparation for departure from Sinai.'
  - where: 'setting'
    claim: 'Chapters 2–4 set the tribes around the tabernacle and give the priests and Levites their charges'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/2?lang=eng'
    quote: 'Every man of the children of Israel shall pitch by his own standard, with the ensign of their father’s house: far off about the tabernacle of the congregation shall they pitch.'
  - where: 'setting'
    claim: 'Chapters 5–6 are a miscellaneous collection of regulations'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/5.htm'
    quote: 'But this and the following chapter contain a miscellaneous collection of regulations on a variety of matters'
  - where: 'setting'
    claim: 'The exclusion of the unclean is placed after the arrangements made to keep the Dwelling sacred'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/5.htm'
    quote: 'The compiler has very suitably placed this in connexion with the careful arrangements enjoined in the preceding chapter to preserve the sacredness of the Dwelling of Jehovah.'
  - where: 'setting'
    claim: 'The Church''s footnote points to Leviticus 12–15 for the clean and unclean'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/5?lang=eng'
    quote: '“put out”: Details on the clean and unclean are in Lev. 12:1–15:33.'
  - where: 'setting'
    claim: 'The law of jealousy has no parallel in the other law codes of the Pentateuch'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/5.htm'
    quote: 'Its contents find no parallel in the other Pentateuchal codes'
  - where: 'thread'
    claim: 'One older reading: no wrong against a neighbour was to remain unrepaired in the congregation around the sanctuary'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/5.htm'
    quote: 'No crime against the property of a neighbour was to remain without expiation in the congregation of Israel, which was encamped or dwelt around the sanctuary of Jehovah'
  - where: 'thread'
    claim: 'One older reading: a husband''s suspicion undermines the commonwealth and is irreconcilable with Israel''s holiness'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/5.htm'
    quote: 'is sufficient to shake the marriage connection to its very roots, and to undermine, along with marriage, the foundation of the civil commonwealth, it was of the greatest importance to guard against this moral evil, which was so utterly irreconcilable with the holiness of the people of God'
  - where: 'thread'
    claim: 'An ordeal is a test whose visible results give a divine sentence of innocence or guilt'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/5.htm'
    quote: 'The essential element in all cases is that the accused is subjected to a test, the visible results of which will be a conclusive divine sentence of innocence or guilt.'
  - where: 'thread'
    claim: 'Another older reading denies that this law is an ordeal like those of other nations'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/5.htm'
    quote: 'For this law prescribed no ordeal whose effects were uncertain, like the ordeals of other nations, but a judgment of God'
  - where: 'thread'
    claim: 'No punishment in the law is carried out by a person; it was expected to come from God'
    key: sc-knowhy-741
    url: 'https://scripturecentral.org/knowhy/why-was-korihor-struck-dumb'
    quote: 'For an Old Testament example of a talionic legal punishment that was expected to be carried out by God rather than the state, see the ordeal of bitter water in Numbers 5:11–31.'
  - where: 'section 3 plain'
    claim: '“Taken with the manner” means caught in the act'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/5?lang=eng'
    quote: 'HEB apprehended, caught in the act.'
  - where: 'section 3 plain'
    claim: '“Instead of thy husband” means while under the husband''s authority'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/5.htm'
    quote: '19. being under thy husband] i.e. under his authority'
  - where: 'section 3 plain'
    claim: '“Rot” is in Hebrew to diminish or fall away'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/5?lang=eng'
    quote: '“rot”: HEB diminish, or fall away (also vv. 22, 27).'
  - where: 'section 4 plain'
    claim: '“Wave” here means simply to offer'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/5.htm'
    quote: 'The word ‘wave’ probably does not bear its technical meaning (explained in note on Numbers 6:20), but denotes simply to ‘offer.’'
  - where: 'section 4 plain'
    claim: 'The “book” is a strip of parchment or anything that can take writing'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/5.htm'
    quote: 'The Heb. term sçpher denotes anything which can receive writing, e.g. a strip of parchment.'
  - where: 'note 5:3 “Why the unclean were put out of the camp”'
    claim: 'One older reading: because of His presence the whole camp was sacred; the same principle applies to the land'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/5.htm'
    quote: 'Because of His presence the whole camp (‘in the midst whereof I dwell’) was sacred, and all pollution must be rigorously avoided (cf. Leviticus 15:31). The same principle is applied, in Numbers 35:33 f., to the whole land of Canaan.'
  - where: 'note 5:3 “Why the unclean were put out of the camp”'
    claim: 'The three kinds of uncleanness in verse 2: leprosy, discharge and contact with a corpse'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/5.htm'
    quote: 'those who were affected with the uncleanness of leprosy (Leviticus 13), of a diseased flux, or of menstruation (Leviticus 15:2., Numbers 15:19.), and those who had become unclean through touching a corpse (Numbers 19:11. … The command of God, to remove these persons out of the camp, was carried out at once by the nation'
  - where: 'note 5:3 “Why the unclean were put out of the camp”'
    claim: 'Being put out was separation, not rejection'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'To be put out of the camp implied only a separation from the main body, not a total rejection or abandonment.'
  - where: 'note 5:3 “Why the unclean were put out of the camp”'
    claim: 'Numbers applies the rule of the LORD''s dwelling to the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/5?lang=eng'
    quote: 'Both male and female shall ye put out, without the camp shall ye put them; that they defile not their camps, in the midst whereof I dwell.'
  - where: 'note 5:8 “When the wronged man has no kinsman”'
    claim: '“Kinsman” is in Hebrew “redeemer”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/5?lang=eng'
    quote: '“kinsman”: HEB redeemer.'
  - where: 'note 5:14 “A suspicion with no witness”'
    claim: '“Kept close” is Hebrew “secret”; “taken with the manner” is “caught in the act”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/5?lang=eng'
    quote: '“be kept close”: HEB secret.'
  - where: 'note 5:14 “A suspicion with no witness”'
    claim: 'The law let a husband accuse his wife without fear of punishment for false accusation'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'This provision is found in Numbers 5:11–31. It allows a husband to accuse a woman of adultery without fear of punishment for false accusation.'
  - where: 'note 5:15 “Barley meal without oil or frankincense”'
    claim: 'Barley meal was the coarsest food of the poor; elsewhere fine meal is prescribed'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/5.htm'
    quote: 'barley meal] The coarsest farinaceous food, ordinarily used by the poorer classes … but the mention of it is unique in P , which probably shews that it was an integral part of a primitive ceremony on which P’s account is based. Elsewhere in P ‘fine meal’ is always prescribed.'
  - where: 'note 5:15 “Barley meal without oil or frankincense”'
    claim: 'The memorial portion was burned to bring the worshipper before God''s memory'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/5.htm'
    quote: 'The burning of the incense or meal in each case was to bring the worshipper before God’s memory.'
  - where: 'note 5:15 “Barley meal without oil or frankincense”'
    claim: 'The poor man''s sin offering is also brought without oil or frankincense'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/5?lang=eng'
    quote: 'he shall put no oil upon it, neither shall he put any frankincense thereon: for it is a sin offering.'
  - where: 'note 5:17 “Holy water, dust and a clay vessel”'
    claim: 'The Septuagint reads pure running water'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/numbers/5.htm'
    quote: '17And the priest shall take pure running water in an earthen vessel, and he shall take of the dust that is on the floor of the tabernacle of witness'
  - where: 'note 5:18 “Uncovering her head”'
    claim: 'The verb is pāraʿ'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/6544.htm'
    quote: 'Strong''s Hebrew: 6544. פָּרַע (para'') -- To let go, to let loose, to be unrestrained, to uncover, to expose'
  - where: 'note 5:18 “Uncovering her head”'
    claim: 'BDB: let go, let alone; in later Hebrew unbind (hair)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6544.htm'
    quote: 'III. מָּרַע verb let go, let alone (Late Hebrew id. unbind (hair), uncover'
  - where: 'note 5:18 “Uncovering her head”'
    claim: 'One older reading: removal of the head-dress, a mourning sign, symbol of lost fidelity'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/5.htm'
    quote: 'The loosening of the hair of the head (see Leviticus 13:45), in other cases a sign of mourning, is to be regarded here as a removal or loosening of the female head-dress, and a symbol of the loss of the proper ornament of female morality and conjugal fidelity.'
  - where: 'note 5:18 “Uncovering her head”'
    claim: 'Another older reading: a sign of mourning for her shame'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/5.htm'
    quote: '18. The hair is let loose as a sign of mourning for her shame.'
  - where: 'note 5:21 “What the curse threatened”'
    claim: '“Rot” is Hebrew diminish or fall away, also in verses 22 and 27'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/5?lang=eng'
    quote: '“rot”: HEB diminish, or fall away (also vv. 22, 27).'
  - where: 'note 5:21 “What the curse threatened”'
    claim: 'The word for thigh is yārēk'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/3409.htm'
    quote: 'Strong''s Hebrew: 3409. יָרֵך (yarek) -- Thigh, loins, side'
  - where: 'note 5:21 “What the curse threatened”'
    claim: 'BDB: yārēk thigh, loin, paired with beṭen in Numbers 5'
    key: bdb
    url: 'https://biblehub.com/hebrew/3409.htm'
    quote: 'יָרֵךְ noun feminineNumbers 5:27 thigh, loin, side, base'
  - where: 'note 5:21 “What the curse threatened”'
    claim: 'A Latter-day Saint study: the innocent conceives, the guilty loses the ability to procreate'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'The translation of these words suggests that, while an innocent woman would conceive, one guilty of adultery would lose the ability to procreate'
  - where: 'note 5:23 “The curse washed into the water”'
    claim: 'The book is a strip of parchment; the curse is conveyed into the potion'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/5.htm'
    quote: 'The Heb. term sçpher denotes anything which can receive writing, e.g. a strip of parchment. … The curse is considered to be in this manner literally conveyed to the potion.'
  - where: 'note 5:23 “The curse washed into the water”'
    claim: 'A Latter-day Saint study: the oath written on parchment in water-soluble ink'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'Afterward, the priest would write the words of the oath on parchment in water soluble ink. He would wash the parchment with the dirty water and let the water run back into the vessel for the woman to drink.'
  - where: 'note 5:23 “The curse washed into the water”'
    claim: 'One older reading: a symbolical act showing God gave the water its power'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/5.htm'
    quote: 'a symbolical act, to set forth the truth, that God imparted to the water the power to act injuriously upon a guilty body, though it would do no harm to an innocent one.'
  - where: 'note 5:31 “Judgment left to the LORD”'
    claim: 'The punishment was expected to be carried out by God, not the state'
    key: sc-knowhy-741
    url: 'https://scripturecentral.org/knowhy/why-was-korihor-struck-dumb'
    quote: 'For an Old Testament example of a talionic legal punishment that was expected to be carried out by God rather than the state, see the ordeal of bitter water in Numbers 5:11–31.'
  - where: 'note 5:31 “Judgment left to the LORD”'
    claim: 'A Latter-day Saint study: the husband is guiltless only if he follows the law rather than setting her up'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'When a husband suspects his wife of adultery, he must perform the requirements of this law in order to be guiltless from iniquity rather than set her up to be caught in flagrante delicto.'
  - where: 'note 5:31 “Judgment left to the LORD”'
    claim: 'One older reading: the law applied to the woman only because a man could marry more than one wife'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/5.htm'
    quote: 'In the law just mentioned the man is placed on an equality with the woman with reference to the sin of adultery … But the law before us applied to the woman only, because the man was at liberty to marry more than one wife'
  - where: 'note 5:31 “Judgment left to the LORD”'
    claim: 'The priest''s words leave the curse to the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/5?lang=eng'
    quote: 'The Lord make thee a curse and an oath among thy people, when the Lord doth make thy thigh to rot, and thy belly to swell'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'The temple was the place of the Sotah; Jesus'' writing in the dust could recall the bitter waters'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'First, writing words of the law in the dust of the temple could serve to remind careful observers of the ritual of the bitter waters, in which the words of the law of jealousy were combined with dust of the temple floor'
  - where: 'christ'
    claim: 'The temple was the proper place for the ordeal of the bitter waters'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'since this was the proper place for performance of the ritual ordeal known as the Sotah, or the ordeal of the bitter waters (Numbers 5:11–31).'
  - where: 'christ'
    claim: 'Jesus at the well may have had the Septuagint of Numbers 5 in mind'
    key: sc-knowhy-658
    url: 'https://scripturecentral.org/knowhy/how-can-jesus-provide-to-all-people-the-waters-of-life'
    quote: 'Jesus may even have had in mind the Septuagint (LXX) Greek text of Numbers 5. … She would then be given a cup of “pure living water” to drink as a sign of her innocence (Numbers 5:17 LXX).'
  - where: 'christ'
    claim: 'By asking for her husband Jesus may have offered her a chance to show innocence or repent'
    key: sc-knowhy-658
    url: 'https://scripturecentral.org/knowhy/how-can-jesus-provide-to-all-people-the-waters-of-life'
    quote: 'By asking for the woman’s husband to come with her, Jesus may have been offering the woman a solemn opportunity to demonstrate her innocence or alternatively to repent and to fully partake of His Atonement'
  - where: 'christ'
    claim: 'The Church''s footnote to verse 7 points to D&C 58:43'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/5?lang=eng'
    quote: '7a “confess”: Lev. 5:5 (1–10); Mosiah 26:29 (29, 35); Alma 17:4; 3 Ne. 1:25; D&C 19:20; 58:43; 64:7.'
  - where: 'explore'
    claim: 'Leviticus 6:1–7 gives the same law of restitution'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/5?lang=eng'
    quote: 'he shall recompense his trespass with the principal thereof, and add unto it the fifth part thereof, and give it unto him against whom he hath trespassed.'
  - where: 'note 5:14 “A suspicion with no witness”'
    claim: '“Taken with the manner” is Hebrew for caught in the act'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/5?lang=eng'
    quote: 'HEB apprehended, caught in the act.'
  - where: 'note 5:14 “A suspicion with no witness”'
    claim: 'The woman underwent a sort of trial by ordeal'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'he could bring his wife and a jealousy offering of barley meal to the priest in order that she may undergo a sort of trial by ordeal.'
  - where: 'note 5:21 “What the curse threatened”'
    claim: 'The meaning of the curse is unclear; thigh and belly may mean reproductive organs and womb'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'It is unclear exactly what is meant by this curse. However, the Hebrew words for thigh (yarek) and belly (bitnek) might more clearly be translated as “reproductive organs” and “womb.”'
  - where: 'note 5:8 “When the wronged man has no kinsman”'
    claim: 'The guilty person confesses before repaying'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/5?lang=eng'
    quote: 'Then they shall confess their sin which they have done: and he shall recompense his trespass with the principal thereof'
  - where: 'setting'
    claim: 'Chapters 1–4 (and 26) are the census that gives the book its name'
    key: bd-numbers
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/numbers?lang=eng'
    quote: 'so called from the double numbering or census of the people (Num. 1–4; 26)'
  - where: 'setting'
    claim: 'The restitution law of Leviticus 6 is renewed and supplemented here'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/5.htm'
    quote: 'given in Leviticus 6:1 is here renewed and supplemented by the additional stipulation'
  - where: 'note 5:3 “Why the unclean were put out of the camp”'
    claim: 'An older commentary (quoted in the manual) gives contagion and God’s dwelling as the two reasons'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'the diseases were contagious, and therefore there was a necessity of putting those afflicted by them apart … the camp was the habitation of God, and nothing impure should be permitted to remain where he dwelt.'
  - where: 'note 5:8 “When the wronged man has no kinsman”'
    claim: 'The restitution law of Leviticus 6 is renewed and supplemented by the case of no kinsman'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/5.htm'
    quote: 'given in Leviticus 6:1 is here renewed and supplemented by the additional stipulation'
  - where: 'note 5:8 “When the wronged man has no kinsman”'
    claim: 'One older reading: mention of the kinsman presupposes that the wronged man had died'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/5.htm'
    quote: 'The allusion to the Gol in this connection presupposes that the injured person was no longer alive.'
  - where: 'note 5:8 “When the wronged man has no kinsman”'
    claim: 'The kinsman (gōʾēl) bought back family land sold through poverty, and received restitution due to a dead relative'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/5.htm'
    quote: 'kinsman] Heb. gô’çl. … (a) to buy back the family estate of his kinsman, which the latter had sold through poverty (Leviticus 25:25'
  - where: 'note 5:8 “When the wronged man has no kinsman”'
    claim: 'The kinsman received restitution due to a deceased relative'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/5.htm'
    quote: '(c) To receive restitution due to his deceased kinsman (here).'
  - where: 'note 5:8 “When the wronged man has no kinsman”'
    claim: 'The priest receives the payment as Jehovah’s representative; the ram is the guilt offering of Lev. 6:6'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/5.htm'
    quote: 'The priest shall receive it as the representative of Jehovah.'
  - where: 'note 5:8 “When the wronged man has no kinsman”'
    claim: 'The ram of the atonement is the guilt offering of Leviticus 6:6'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/5.htm'
    quote: 'the ram of the atonement] The guilt-offering described in Leviticus 6:6.'
  - where: 'note 5:14 “A suspicion with no witness”'
    claim: 'The law is for a husband who suspected adultery but had no witnesses'
    key: densley-adultery
    url: 'https://interpreterfoundation.org/journal/procedural-violations-in-the-trial-of-the-woman-taken-in-adultery'
    quote: 'If the husband suspected adultery but had no witnesses, he could bring his wife and a jealousy offering of barley meal to the priest'
  - where: 'note 5:15 “Barley meal without oil or frankincense”'
    claim: 'One older reading: oil and frankincense perhaps left off as symbols of joy; compare the poor man’s sin offering'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/5.htm'
    quote: 'Perhaps because symbols of joy and festivity were excluded by the grievous nature of the woman’s alleged crime. Oil and frankincense were also forbidden in the case of a poor man’s sin-offering (Leviticus 5:11).'
  - where: 'note 5:17 “Holy water, dust and a clay vessel”'
    claim: 'The Septuagint of Numbers 5:17 is also rendered pure living water'
    key: sc-knowhy-658
    url: 'https://scripturecentral.org/knowhy/how-can-jesus-provide-to-all-people-the-waters-of-life'
    quote: 'She would then be given a cup of “pure living water” to drink as a sign of her innocence (Numbers 5:17 LXX).'
  - where: 'note 5:17 “Holy water, dust and a clay vessel”'
    claim: 'One older reading: the holy water was probably from the basin before the sanctuary'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/5.htm'
    quote: 'probably water out of the basin before the sanctuary, which served for holy purposes (Exodus 30:18)'
  - where: 'note 5:31 “Judgment left to the LORD”'
    claim: 'Putting the verdict in God’s hands protected an innocent wife from her husband’s word alone'
