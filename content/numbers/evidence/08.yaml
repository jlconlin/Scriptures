chapter: 8
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The book''s Sinai chapters are dated in the second year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'And the Lord spake unto Moses in the wilderness of Sinai, in the tabernacle of the congregation, on the first day of the second month, in the second year after they were come out of the land of Egypt'
  - where: 'note 8:2 “Seven lamps that shine forward”'
    claim: 'The lamp instructions stand between the princes'' offerings for the altar and the inauguration of the Levites'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/8.htm'
    quote: 'stand quite appropriately between the account of what the tribe-princes had done for the consecration of the altar service as representatives of the congregation, and the account of the solemn inauguration of the Levites in their service in the sanctuary.'
  - where: 'setting'
    claim: 'The Levites had been chosen and given duties in chapters 3–4; before starting they were consecrated and handed over to the priests'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/8.htm'
    quote: 'The choice of the Levites for service in the sanctuary, in the place of the first-born of the people generally, has been already noticed in Numbers 3:5., and the duties binding upon them in Numbers 4:4. But before entering upon their duties they were to be consecrated to the work, and then formally handed over to the priests.'
  - where: 'setting'
    claim: 'The passage expands Numbers 3:5–13 with the rite of purification'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/8.htm'
    quote: 'The passage is an expansion of Numbers 3:5-13, with the addition of the rite of purification.'
  - where: 'setting'
    claim: 'The work of the Levites was to assist the priests; they had no inheritance but the tithe and cities'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'The work of the Levites was to assist the priests (Num. 3:5–10; 18:1–7). They acted as musicians (1 Chr. 6:16, 31; 15:16; Neh. 11:17, 22); slaughtered the sacrifices'

  # ---------- note 8:2 ----------
  - where: 'note 8:2 “Seven lamps that shine forward”'
    claim: 'A modern translation reads “in front of the lampstand”'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers%208&version=NRSVUE'
    quote: 'When you set up the lamps, the seven lamps shall give light in front of the lampstand.'
  - where: 'note 8:2 “Seven lamps that shine forward”'
    claim: 'The light fell toward the north side, where the table stood; the verb pictures Aaron reaching up to set the lit lamps'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/8.htm'
    quote: 'The verb describes Aaron as reaching up to put them in their place after the wicks have been lighted. in front of the lampstand] i.e. towards the opposite (north) side, where the table of the Presence-bread stood.'
  - where: 'note 8:2 “Seven lamps that shine forward”'
    claim: 'The directions define Exodus 25:37 more precisely and commit the lighting to Aaron'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/8.htm'
    quote: 'These directions are not a mere repetition, but also a more precise definition, of the general instructions given in Exodus 25:37'
  - where: 'note 8:2 “Seven lamps that shine forward”'
    claim: 'Lighting had not before been assigned to Aaron himself'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/8.htm'
    quote: 'which committed the task of lighting the lamps to Aaron; for this had not been done before, as Exodus 27:21 merely assigns the daily preparation of the candlestick to Aaron and his sons'
  - where: 'note 8:2 “Seven lamps that shine forward”'
    claim: 'The seven lamps represented Israel before the Lord as a people causing its light to shine'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/8.htm'
    quote: 'as indicating that Israel was thereby to be represented perpetually before the Lord as a people causing its light to shine in the darkness of this world.'
  - where: 'note 8:2 “Seven lamps that shine forward”'
    claim: 'Verse 2 wording: the lamps give light over against the candlestick'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/8?lang=eng'
    quote: 'Speak unto Aaron, and say unto him, When thou lightest the lamps, the seven lamps shall give light over against the candlestick.'

  - where: 'note 8:2 “Seven lamps that shine forward”'
    claim: 'The verb is better rendered “when thou settest up”'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/8.htm'
    quote: '2. When thou settest up] So R.V. marg. correctly. The lamps were small bowls of oil with wicks.'

  # ---------- note 8:7 ----------
  - where: 'note 8:7 “Cleansed, not made holy”'
    claim: 'The Levites'' rite is called cleansing, not consecration like the priests'''
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/8.htm'
    quote: 'This consecration is commanded in Numbers 8:7., and is not called קדּשׁ, like the consecration of the priests (Exodus 29:1; Leviticus 8:11), but טהר to cleanse.'
  - where: 'note 8:7 “Cleansed, not made holy”'
    claim: 'The Levites are merely cleansed; the priests receive holiness, meaning separation'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/8.htm'
    quote: 'The Levites are inferior to the priests, and are therefore merely cleansed from the ceremonial pollution of ordinary life, while the priests receive something higher, an actual quality which the Hebrews called ‘holiness,’ i.e. not moral excellence, but separation, exclusiveness'
  - where: 'note 8:7 “Cleansed, not made holy”'
    claim: 'Water of sin, a unique expression; Levites sprinkled while priests were bathed; clothes washed as laymen did; priests given new robes'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/8.htm'
    quote: 'lit. water of sin, a unique expression denoting ‘water that washes away sin.’ … Notice that the Levites are only sprinkled, while the priests (Exodus 29:4, Leviticus 8:6) are completely bathed.'
  - where: 'note 8:7 “Cleansed, not made holy”'
    claim: 'Clothes washed as ordinary laymen; the priests received new robes'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/8.htm'
    quote: 'wash their clothes] as ordinary laymen would do (Exodus 19:14) for ceremonial cleansing. The priests, on the other hand, were vested in entirely new robes of office (Exodus 29:8 f., Leviticus 8:13).'
  - where: 'note 8:7 “Cleansed, not made holy”'
    claim: 'One older reading: the water was plain water; the razor for cleanliness'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/8.htm'
    quote: 'This comparison suggests that the water here, as there, is intended to be simple pure water. cause a razor &c.] for the purpose of cleanliness.'
  - where: 'note 8:7 “Cleansed, not made holy”'
    claim: 'One older reading: the nature of the water is uncertain; it takes it as the laver''s water'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/8.htm'
    quote: 'The nature of this purifying water is not explained, and cannot be determined with any certainty. … So that nothing remains but to regard it as referring to the water in the laver of the sanctuary'
  - where: 'note 8:7 “Cleansed, not made holy”'
    claim: 'The same older reading rules out the red heifer''s water and plain water'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/8.htm'
    quote: 'Neither of these, however, was applicable to the cleansing of the Levites'
  - where: 'note 8:7 “Cleansed, not made holy”'
    claim: 'The Hebrew of verse 7 is “water of sin” and “cause a razor to pass over all their flesh”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'תַ֨עַר֙'
  - where: 'note 8:7 “Cleansed, not made holy”'
    claim: 'The razor phrase is distinguished from the leper''s shaving entirely off'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/8.htm'
    quote: 'תּער העביר is to be distinguished from גּלּח. The latter signifies to make balk or shave the hair entirely off, which was required of the leper when he was cleansed (Leviticus 14:8-9)'
  - where: 'note 8:7 “Cleansed, not made holy”'
    claim: 'The leper shaves all his hair'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/14?lang=eng'
    quote: 'he shall shave all his hair off his head and his beard and his eyebrows, even all his hair he shall shave off'

  # ---------- note 8:10 ----------
  - where: 'note 8:10 “The people’s hands on the Levites”'
    claim: 'Hands laid on through representatives, so the whole community offered the Levites as its gift, as with the burnt offering'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/8.htm'
    quote: 'Through their representatives (Numbers 1:4-16), to indicate that the whole community offered the Levites as their gift. Cf. the same action in the case of the burnt-offering (Leviticus 1:4).'
  - where: 'note 8:10 “The people’s hands on the Levites”'
    claim: 'The people transferred to the Levites the nation''s obligation to serve in its firstborn'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/8.htm'
    quote: 'in order that by this symbolical act they might transfer to the Levites the obligation resting upon the whole nation to serve the Lord in the persons of its first-born sons, and might present them to the Lord as representatives of the first-born of Israel'
  - where: 'note 8:10 “The people’s hands on the Levites”'
    claim: 'The one on whom Israel laid hands (v. 10) took their identity and became their representative before the Lord'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'For the people of Israel to lay hands on the priest thus suggests that he took upon himself their identity; that is, he became their representative before the Lord.'
  - where: 'note 8:10 “The people’s hands on the Levites”'
    claim: 'By laying hands on the bullocks the Levites presented themselves as a living sacrifice'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/8.htm'
    quote: 'By this imposition of hands they made the sacrificial animals their representatives, in which they presented their own bodies to the Lord as a living sacrifice well-pleasing to Him.'

  # ---------- note 8:11 ----------
  - where: 'note 8:11 “Waved before the LORD”'
    claim: 'The Hebrew of verse 11 is “wave … a wave offering”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'תְּנוּפָה֙'
  - where: 'note 8:11 “Waved before the LORD”'
    claim: 'Tenuphah is a technical term originally of the priest''s share, used even of the Levites'
    key: bdb
    url: 'https://biblehub.com/hebrew/8573.htm'
    quote: 'waving, wave-offering, technical term in P (H), originally of priest''s share of sacrifice … even of Levites Numbers 8:11,13,15,20'
  - where: 'note 8:11 “Waved before the LORD”'
    claim: '“Offer” is “wave”; the literal sense is lost but the Levites are given to Jehovah and given back for service'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/8.htm'
    quote: '11. offer] wave, as R.V. marg.; see Numbers 8:13; Numbers 8:15; Numbers 8:21. The literal significance of the term (see on Numbers 5:25) is here lost, but the underlying thought remains that, having been given to Jehovah, the Levites were given back by Him for ritual service to the priests and the congregation.'
  - where: 'note 8:11 “Waved before the LORD”'
    claim: 'One older reading: Aaron led the Levites up to the altar and back'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/8.htm'
    quote: 'The ceremony of waving consisted no doubt in his conducting the Levites solemnly up to the altar, and then back again.'
  - where: 'note 8:11 “Waved before the LORD”'
    claim: 'The Septuagint: Aaron shall separate the Levites for a gift'
    key: lxx-rahlfs
    url: 'https://biblehub.com/sep/numbers/8.htm'
    quote: 'And Aaron shall separate the Levites for a gift before the Lord from the children of Israel: and they shall be prepared to perform the works of the Lord.'
  - where: 'note 8:11 “Waved before the LORD”'
    claim: 'The Levites offered as a wave offering became God''s peculiar property'
    key: bd-levites
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/levites?lang=eng'
    quote: 'The Levites were themselves offered as a wave-offering on behalf of the children of Israel (Num. 8:11–15); they thus became God’s peculiar property, given to Him in place of the firstborn (8:16).'
  - where: 'note 8:11 “Waved before the LORD”'
    claim: '“As a gift” in verse 19 is literally “given persons”'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/8.htm'
    quote: '19. as a gift] lit. ‘given [persons].’ See on Numbers 3:9.'

  # ---------- note 8:19 ----------
  - where: 'note 8:19 “An atonement that keeps the plague away”'
    claim: 'Atonement here is averting anger by preventing sin, the laity''s too near approach; the Levites are substitutes and a cordon'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/8.htm'
    quote: 'Not in this case propitiation for past sins, but the averting of God’s anger by preventing sin from being committed. The sin would be two-fold—the non-performance of the rightful worship, and … the too near approach of the laity to the holy things.'
  - where: 'note 8:19 “An atonement that keeps the plague away”'
    claim: 'The Levites are both substitutes for the laity and a cordon'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/8.htm'
    quote: 'The Levites are both substitutes for the laity, and at the same time a cordon to keep them at a distance.'
  - where: 'note 8:19 “An atonement that keeps the plague away”'
    claim: 'One older reading ties the plague of 8:19 to Numbers 1:53'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/8.htm'
    quote: 'that there be no plague] Cf. Numbers 1:53.'
  - where: 'note 8:19 “An atonement that keeps the plague away”'
    claim: 'Numbers 1:53: the Levites camp round the tabernacle that there be no wrath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'But the Levites shall pitch round about the tabernacle of testimony, that there be no wrath upon the congregation of the children of Israel'
  - where: 'note 8:19 “An atonement that keeps the plague away”'
    claim: 'The wrath is the LORD''s judgment on the unholy who approached his sanctuary, as in 8:19'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/1.htm'
    quote: 'קצף, the wrath of Jehovah, breaking in judgment upon the unholy who approached His sanctuary in opposition to His command (Numbers 8:19; Numbers 18:5, Numbers 18:22).'

  # ---------- note 8:24 ----------
  - where: 'note 8:24 “Twenty-five here, thirty in chapter 4”'
    claim: 'Chapter 4 numbers the Levites from thirty to fifty'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/4?lang=eng'
    quote: 'From thirty years old and upward even until fifty years old, all that enter into the host, to do the work in the tabernacle of the congregation.'
  - where: 'note 8:24 “Twenty-five here, thirty in chapter 4”'
    claim: 'Transport required a full-grown man''s strength; standing service was lighter, from twenty-five'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/8.htm'
    quote: 'The transport of the tabernacle required the strength of a full-grown man, and therefore the more advanced age of thirty years; whereas the duties connected with the tabernacle when standing were of a lighter description, and could easily be performed from the twenty-fifth year'
  - where: 'note 8:24 “Twenty-five here, thirty in chapter 4”'
    claim: 'The Student Manual: the Levites began such service five years earlier than those who transported the tabernacle'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'They were allowed to begin such service five years earlier than those who transported the tabernacle. (See Numbers 8:24; 4:3.)'
  - where: 'note 8:24 “Twenty-five here, thirty in chapter 4”'
    claim: 'David employed the Levites from twenty because they no longer carried the tabernacle'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/8.htm'
    quote: 'David employed the Levites from their twentieth year (1 Chronicles 23:24-25), and expressly stated that he did so because the Levites had no longer to carry the dwelling and its furniture'
  - where: 'note 8:24 “Twenty-five here, thirty in chapter 4”'
    claim: '1 Chronicles 23:26–27 wording'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/23?lang=eng'
    quote: 'And also unto the Levites; they shall no more carry the tabernacle, nor any vessels of it for the service thereof. For by the last words of David the Levites were numbered from twenty years old and above:'

  # ---------- note 8:26 ----------
  - where: 'note 8:26 “Keeping the charge after fifty”'
    claim: 'Charge is oversight of the furniture; work is laborious service'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/8.htm'
    quote: '"Charge" (mishmereth), as distinguished from "work," signified the oversight of all the furniture of the tabernacle (see Numbers 3:8); "work" (service) applied to laborious service, e.g., the taking down and setting up of the tabernacle and cleaning it, carrying wood and water'
  - where: 'note 8:26 “Keeping the charge after fifty”'
    claim: 'Work included slaying the animals for the sacrifices'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/8.htm'
    quote: 'carrying wood and water for the sacrificial worship, slaying the animals for the daily and festal sacrifices of the congregation, etc.'
  - where: 'note 8:26 “Keeping the charge after fifty”'
    claim: 'Another reading: no necessary responsible service; voluntary helpers'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/8.htm'
    quote: '26. shall do no service] i.e. no necessary responsible service. They may assist their younger fellow-Levites as voluntary helpers.'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'D&C 13:1: the Aaronic Priesthood until the sons of Levi offer again'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/13?lang=eng'
    quote: 'and this shall never be taken again from the earth, until the sons of Levi do offer again an offering unto the Lord in righteousness.'
  - where: 'christ'
    claim: 'D&C 84:33 wording'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'For whoso is faithful unto the obtaining these two priesthoods of which I have spoken, and the magnifying their calling, are sanctified by the Spirit unto the renewing of their bodies.'
