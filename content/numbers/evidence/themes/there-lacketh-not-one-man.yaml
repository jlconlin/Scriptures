page: there-lacketh-not-one-man
claims:
  - where: opening
    claim: 'Numbers is named from its double numbering or census'
    key: bd-numbers
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/numbers?lang=eng'
    quote: 'The book that bears this name is so called from the double numbering or census of the people (Num. 1–4; 26).'
  - where: 'section “Numbered by name, and redeemed”'
    claim: 'President John Taylor: the Israelites were saved by the Passover propitiation, a figure of the contemplated atonement and propitiation of Christ'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'had it not been for the contemplated atonement and propitiation of Christ, of which this was a figure.'
  - where: 'section “Numbered by name, and redeemed”'
    claim: 'President John Taylor: the Lord claimed those He saved as righteously belonging to Him'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'Hence the Lord claimed those that He saved as righteously belonging to Him, and claiming them as His He demanded their services.'
  - where: 'section “The roll of the dead, and the roll of heirs”'
    claim: 'The second count was taken after the Exodus generation was dead'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'a second Israelite numbering (or census), now that the people of the Exodus generation were dead and their successors were on the doorstep of the promised land'
  - where: 'section “A shepherd, and not one missing”'
    claim: 'The Seminary manual glosses “there lacketh not one man of us” as meaning that no one was killed'
    key: ot-seminary-teacher-num-67
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-teacher-manual/introduction-to-the-book-of-numbers/lesson-67-numbers-30-36?lang=eng'
    quote: '(You may need to point out that “there lacketh not one man of us” means that no one was killed.)'
  - where: 'section “A shepherd, and not one missing”'
    claim: '“Lacketh” in 31:49 is the niphal of the verb pāqad (as in “numbered” at 14:29 and 26:64)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'נִפְקַ֥ד'
  - where: 'section “A shepherd, and not one missing”'
    claim: '“Numbered” at 26:64 is the verb pāqad'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'פָּקְד֛וּ'
  - where: 'section “A shepherd, and not one missing”'
    claim: '“Take the sum” at 26:2 is śĕʾû rōʾš, the idiom of 31:49 “have taken the sum”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'שְׂא֞וּ'
  - where: 'section “A shepherd, and not one missing”'
    claim: '“Have taken the sum” at 31:49 is nāśĕʾû ʾet-rōʾš'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'נָֽשְׂא֗וּ'
  - where: 'section “A shepherd, and not one missing”'
    claim: 'Connection made by this page: 31:49 “Thy servants have taken the sum of the men of war… and there lacketh not one man of us” set beside 26:64 “there was not a man of them whom Moses and Aaron the priest numbered”; the report is worded as a census (same idiom as 1:2, 26:2; passive of the numbering verb)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'But among these there was not a man of them whom Moses and Aaron the priest numbered, when they numbered the children of Israel in the wilderness of Sinai.'
  - where: 'section “A shepherd, and not one missing”'
    claim: 'The Church’s footnotes on 31:50 send “oblation” to Ex. 30:12 and “atonement” to Ex. 30:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/31?lang=eng'
    quote: '50a “oblation”: Ex. 30:12 (11–16).'
  - where: 'section “A shepherd, and not one missing”'
    claim: 'Footnote 50c on “atonement” is Ex. 30:15'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/31?lang=eng'
    quote: '50c “atonement”: Ex. 30:15 (12, 15–16).'
  - where: 'section “None of them is lost”'
    claim: 'The Church’s heading for Numbers 31 says “None in the armies of Israel are lost”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/31?lang=eng'
    quote: 'None in the armies of Israel are lost.'
  - where: 'section “None of them is lost”'
    claim: 'Connection made by this page: the heading’s “None in the armies of Israel are lost” set beside “none of them is lost” (John 17:12) and “have I lost none” (John 18:9); the verse’s own word in Num. 31:49 is “lacketh”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/17?lang=eng'
    quote: 'those that thou gavest me I have kept, and none of them is lost, but the son of perdition'
  - where: 'section “None of them is lost”'
    claim: 'Connection made by this page (second half): John 18:9 “Of them which thou gavest me have I lost none” beside the heading'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/18?lang=eng'
    quote: 'Of them which thou gavest me have I lost none.'
  - where: 'section “None of them is lost”'
    claim: 'Connection made by this page: a people counted by “the number of their names” (Num. 1:2) set beside Jesus who “calleth his own sheep by name” (John 10:3) and “I know my sheep, and they are numbered” (3 Ne. 18:31), with Moses’s “sheep which have no shepherd” (Num. 27:17)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/18?lang=eng'
    quote: 'But if he repent not he shall not be numbered among my people, that he may not destroy my people, for behold I know my sheep, and they are numbered.'
  - where: 'section “None of them is lost”'
    claim: 'Connection made by this page (second half): John 10:3 “calleth his own sheep by name”'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/10?lang=eng'
    quote: 'he calleth his own sheep by name, and leadeth them out.'
  - where: 'section “None of them is lost”'
    claim: 'Jesus Christ is the Good Shepherd and His followers are like sheep whom He watches over'
    key: gs-good-shepherd
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/good-shepherd?lang=eng'
    quote: 'Jesus Christ is the Good Shepherd. Symbolically, His followers are like sheep whom Jesus watches over.'
  - where: 'section “Numbered among His people”'
    claim: 'Sister Cordon on numbering as making certain each person feels the Savior’s love'
    key: cordon-becoming-shepherd
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2018/10/becoming-a-shepherd?lang=eng'
    quote: 'Numbering, however, is not really about numbers; it is about making certain each person feels the love of the Savior through someone who serves for Him.'
  - where: opening
    claim: 'The footnote at Num. 26:65 points to Num. 14:29'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: '65a “wilderness”: Num. 14:29; Ezek. 20:13 (13, 15)'
  - where: 'section “Numbered by name, and redeemed”'
    claim: 'Ex. 38:26: the half shekel for every one that went to be numbered, from twenty years old and upward'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/38?lang=eng'
    quote: 'A bekah for every man, that is, half a shekel, after the shekel of the sanctuary, for every one that went to be numbered, from twenty years old and upward'
  - where: 'section “A shepherd, and not one missing”'
    claim: 'The niphal of pāqad is glossed “be (sought, i.e. needed) missed, lacking”, with Numbers 31:49 cited'
    key: bdb
    url: 'https://biblehub.com/hebrew/6485.htm'
    quote: 'be (sought, i.e. needed) missed, lacking 1 Samuel 20:18'
  - where: 'section “Numbered among His people”'
    claim: 'Moro. 6:4: those baptized were numbered among the people of the church of Christ and their names were taken'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/moro/6?lang=eng'
    quote: 'they were numbered among the people of the church of Christ; and their names were taken, that they might be remembered and nourished by the good word of God'
  - where: 'section “Numbered among His people”'
    claim: 'Connection made by this page: the count of names at Sinai (Num. 1:2) set beside Moro. 6:4, where baptized persons are numbered and their names taken'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/moro/6?lang=eng'
    quote: 'their names were taken, that they might be remembered and nourished by the good word of God'
