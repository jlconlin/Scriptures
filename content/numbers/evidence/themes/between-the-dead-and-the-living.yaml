    quote: 'כָּפְרֽ/וֹ'
  - where: 'section “Where we stand”'
    claim: 'Connection made by this page: what Num. 35:31 says of a murderer’s life, Ps. 49:7–8 says of every soul, that no man has the ransom'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/49?lang=eng'
    quote: 'None of them can by any means redeem his brother, nor give to God a ransom for him:'
