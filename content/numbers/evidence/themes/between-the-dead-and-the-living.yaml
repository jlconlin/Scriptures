    claim: 'President Packer: because there was a mediator, justice had claimed its full share and mercy was fully satisfied'
    key: packer-mediator
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1977/04/the-mediator?lang=eng'
    quote: 'Because there was a mediator, justice had claimed its full share, and mercy was fully satisfied.'
  - where: 'section “Where we stand”'
    claim: 'President Packer: by eternal law, mercy cannot be extended save there be one who is both willing and able to assume our debt and pay the price'
    key: packer-mediator
    url: 'https://www.churchofjesuschrist.org/study/general-conference/1977/04/the-mediator?lang=eng'
