  - where: 'opening'
    claim: 'The Hebrew behind “atonement” at Num. 8:19 is kipper (H3722)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וּ/לְ/כַפֵּ֖ר'
  - where: 'opening'
    claim: 'The Hebrew behind “atonement” at Num. 15:25 is kipper (H3722)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וְ/כִפֶּ֣ר'
  - where: 'opening'
    claim: 'The Hebrew behind “atonement” at Num. 16:46 is kipper (H3722)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וְ/כַפֵּ֣ר'
  - where: 'opening'
    claim: 'The Hebrew behind “atonement” at Num. 25:13 is kipper (H3722)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וַ/יְכַפֵּ֖ר'
  - where: 'opening'
    claim: 'The Hebrew behind “atonement” at Num. 31:50 is kipper (H3722)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'לְ/כַפֵּ֥ר'
  - where: 'opening'
    claim: 'Connection made by this page: the verses where Numbers makes atonement (8:19; 16:46–47; 25:13; 31:50) read as a line of means, ending at 35:31–33 where blood shed has no ransom and the land is atoned for only by the blood of the shedder'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/35?lang=eng'
    quote: 'and the land cannot be cleansed of the blood that is shed therein, but by the blood of him that shed it.'
  - where: 'section “Between the dead and the living”'
    claim: 'The verb kipper is in Num. 16:46 and 16:47 (Hebrew 17:11–12); 16:48 has no form of it'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וַ/יְכַפֵּ֖ר'
  - where: 'section “Between the dead and the living”'
    claim: 'Aaron’s actions with the censer and incense represented Christ’s Atonement'
    key: seminary-2018-num-67
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-seminary-student-material-2018/numbers/lesson-67?lang=eng'
    quote: 'These actions represented Jesus Christ’s Atonement for us, in which His actions redeem us from our sins.'
  - where: 'section “A deed, and gold”'
    claim: 'Phinehas killed the two in the tent and the plague was stayed (Num. 25:7–8)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/25?lang=eng'
    quote: 'So the plague was stayed from the children of Israel.'
  - where: 'section “No ransom for a life”'
    claim: 'kōper (H3724) is the word behind “satisfaction” at 35:31–32; BDB glosses it “a price for ransom of a life,” listing Ex. 21:30, Num. 35:31, 32 and Ps. 49:8 under that sense'
    key: bdb
    url: 'https://biblehub.com/hebrew/3724.htm'
    quote: 'עַל ׳כ Exodus 21:30 (Covt. code; "" מִּדְיֹן נַפְשׁוֺ); נפשׁ ׳כ Proverbs 13:8; לְ ׳כ ransom for Proverbs 6:35; Proverbs 21:18; Numbers 35:31,32 (P); כָּפְרוֺ his ransom Psalm 49:8'
  - where: 'section “No ransom for a life”'
    claim: 'The Hebrew behind “satisfaction” at Num. 35:31 is kōper (H3724)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'כֹ֨פֶר֙'
  - where: 'section “No ransom for a life”'
    claim: 'Connection made by this page: Ex. 21:30 allows “the ransom of his life” where Num. 35:31 refuses a ransom for a murderer'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/21?lang=eng'
    quote: 'If there be laid on him a sum of money, then he shall give for the ransom of his life whatsoever is laid upon him.'
  - where: 'section “No ransom for a life”'
    claim: 'The ox in Ex. 21:29–30 had killed a man or a woman'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/21?lang=eng'
    quote: 'but that he hath killed a man or a woman; the ox shall be stoned, and his owner also shall be put to death.'
  - where: 'section “No ransom for a life”'
    claim: 'Num. 35:33 is the last use of kipper (Pual) in Numbers'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'יְכֻפַּ֗ר'
  - where: 'section “No ransom for a life”'
    claim: 'Connection made by this page: Ps. 49:7 (no man can give God a ransom for his brother) set beside Num. 35:31–33'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/49?lang=eng'
    quote: 'None of them can by any means redeem his brother, nor give to God a ransom for him:'
  - where: 'section “The life of him who hath murdered”'
    claim: 'Connection made by this page: Alma 34:12, the law requires the life of him who hath murdered, set beside Num. 35:31, 33 as the same requirement'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/34?lang=eng'
    quote: 'But the law requireth the life of him who hath murdered; therefore there can be nothing which is short of an infinite atonement which will suffice for the sins of the world.'
  - where: 'section “The life of him who hath murdered”'
    claim: 'One reading sets Amulek’s words (Alma 34:11) beside Israelite law that every man be put to death for his own sin (Deut. 24:16)'
    key: sc-knowhy-142
    url: 'https://scripturecentral.org/knowhy/why-must-there-be-an-infinite-and-eternal-sacrifice'
    quote: 'In contrast to some practices of their neighbors, Israelite law did not allow for vicarious punishment, but insisted “every man shall be put to death for his own sin” (Deuteronomy 24:16; cf. Ezekiel 18:20).'
  - where: 'section “The life of him who hath murdered”'
    claim: 'Another reading: the notion that no man can sacrifice his blood for another’s sins is not found in the law of Moses but present in Mesoamerica'
    key: gee-last-sacrifice
    url: 'https://rsc.byu.edu/behold-lamb-god/great-last-sacrifice'
    quote: 'a notion not found in the law of Moses but present in Mesoamerica'
  - where: 'section “One Mediator”'
    claim: 'Christ alone could make a perfect atonement'
    key: gs-atone-atonement
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/atone-atonement?lang=eng'
    quote: 'Jesus Christ was the only one capable of making a perfect atonement for all mankind.'
  - where: 'section “Where this reaches now”'
    claim: 'An accountable person receives the Atonement’s blessings only through faith, repentance, ordinances and obedience'
    key: gs-atone-atonement
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/atone-atonement?lang=eng'
    quote: 'a person who has reached the age of accountability and received the law can receive these blessings only if he has faith in Jesus Christ, repents of his sins, receives the ordinances of salvation, and obeys the commandments of God.'
