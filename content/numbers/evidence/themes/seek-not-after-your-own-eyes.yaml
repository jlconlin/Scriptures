page: seek-not-after-your-own-eyes
claims:
  - where: 'section “Sent to see”'
    claim: '“Sight” in 13:33 is the Hebrew noun for “eyes” (in our eyes)'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'בְ/עֵינֵ֨י/נוּ֙'
  - where: 'section “A tassel to look upon”'
    claim: 'Connection made by this page: “seek” at 15:39 is the verb of the spies’ searching (tûr): twelve times in chapters 13–14, all of the spies’ searching, in 13:2, 16, 17, 21, 25, 32 (twice); 14:6, 7, 34, 36, 38 (11 verses); 15:39 is its last use in the book; 13:2'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וְ/יָתֻ֨רוּ֙'
  - where: 'section “A tassel to look upon”'
    claim: 'Connection made by this page: 15:39 “seek” (tûr), the last use, of the eyes'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'תָתֻ֜רוּ'
  - where: 'section “A tassel to look upon”'
    claim: 'Connection made by this page: set beside 13:33, 15:39 forbids searching after “your own heart and your own eyes”'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/15?lang=eng'
    quote: 'that ye seek not after your own heart and your own eyes'
  - where: 'section “A serpent to look upon”'
    claim: 'Jesus taught that the incident symbolized His atoning sacrifice (John 3:14–15)'
    key: 'scripture-helps-num'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'Jesus Christ taught that this incident symbolized His atoning sacrifice.'
  - where: 'section “A serpent to look upon”'
    claim: 'The brazen serpent is a symbol of Christ lifted up on the cross'
    key: 'gs-serpent-brazen'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/serpent-brazen?lang=eng'
    quote: 'The Lord referred to the lifting up of the serpent in the wilderness as a symbol of Himself being lifted up on the cross (John 3:14–15).'
  - where: 'section “Eyes the LORD opened”'
    claim: 'Balaam could not see what his donkey could'
    key: 'scripture-helps-num'
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'The man who was sought out because of his reputation as a soothsayer could not see what even his donkey could.'
  - where: 'section “Eyes the LORD opened”'
    claim: 'The verb “opened” (gālâ) at 22:31 and 24:4, 16, three times in Numbers, all of Balaam'
    key: 'oshb-wlc'
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וַ/יְגַ֣ל'
  - where: 'section “Eyes the LORD opened”'
    claim: 'Chapter 24 heading: Balaam prophesies of the Messiah, a Star out of Jacob'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/24?lang=eng'
    quote: 'He prophesies of the Messiah: There will come a Star out of Jacob'
  - where: 'section “Eyes the LORD opened”'
    claim: 'Footnote on “not now” (24:17): His coming was to be in the future, long after Moses’ time'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/24?lang=eng'
    quote: 'His coming was to be in the future, long after Moses’ time'
  - where: 'section “Moses shown the land”'
    claim: 'Chapter 27 heading: Moses will see but not enter the promised land'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/27?lang=eng'
    quote: 'Moses will see but not enter the promised land'
  - where: 'section “Moses shown the land”'
    claim: 'Connection made by this page: 14:23 “shall not see the land” set beside 27:12 “see the land”, the same verb and object'
    key: 'lds-scriptures'
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'Surely they shall not see the land which I sware unto their fathers'
  - where: 'section “Where this reaches now”'
    claim: 'Elder Christofferson: to look to God is to keep His commandments, cry unto Him, counsel with Him, be thankful'
    key: 'christofferson-look'
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2025/10/45christofferson?lang=eng'
    quote: 'Alma explained that to look to God is to keep His commandments, cry unto Him continually for His support, counsel with Him in all your doings, and let your heart be full of thanks unto Him day and night.'
  - where: 'section “Eyes the LORD opened”'
    claim: 'Connection made by this page: 24:4 “having his eyes open” (ûgĕlûy ʿênayim) is the same verb, gālâ, with “eyes” as at 22:31'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וּ/גְל֥וּי'
  - where: 'section “Sent to see”'
    claim: 'The Church’s cross-reference at 14:23 “see” leads to D&C 84:23–25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'D&C 84:24 (23–25)'
  - where: 'section “Sent to see”'
    claim: 'D&C 84:23–24: Moses sought to sanctify his people that they might behold the face of God; they hardened their hearts'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'But they hardened their hearts and could not endure his presence'
  - where: 'section “The look that lives”'
    claim: 'Connection made by this page: after the sentence at Kadesh the next things Israel is told to see are the fringe (15:39) and the serpent (21:8), objects the LORD commands to be looked upon'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
    quote: 'every one that is bitten, when he looketh upon it, shall live'
  - where: 'section “The look that lives”'
    claim: 'Connection made by this page: the serpent lifted up (John 3:14–15) beside the Star seen by a man whose eyes the LORD opened (24:17)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/22?lang=eng'
    quote: 'Then the LORD opened the eyes of Balaam'
