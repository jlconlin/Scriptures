page: seek-not-after-your-own-eyes
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: '13:18 “see” is וּרְאִיתֶם (rāʾâ, H7200, qal perfect 2mp with waw), the same form as 15:39 “that ye may look upon it”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וּ/רְאִיתֶ֥ם'
  - where: 'opening'
    claim: '15:39 “that ye may look upon it” is וּרְאִיתֶם (H7200), the form of 13:18'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וּ/רְאִיתֶ֣ם'
  - where: 'opening'
    claim: '15:39 “seek” is tāturû, tûr (H8446), the spies’ “search”; occurrences.mjs: 14 occurrences in 13 verses of Numbers (10:33; 13–14; 15:39), so 15:39 is its last use in the book'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'תָתֻ֜רוּ'
  - where: 'opening'
    claim: '13:33 “in our own sight” is bĕʿênênû, “in our eyes” (H5869); the Hebrew has no word for “own”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'בְ/עֵינֵ֨י/נוּ֙'
  - where: 'opening'
    claim: '15:39 “your own eyes” is ʿênêkem, “your eyes” (H5869); “own” is supplied by the King James'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'עֵֽינֵי/כֶ֔ם'
  - where: 'opening'
    claim: '14:33 “your whoredoms” is zĕnûtêkem (H2184), from the root of 15:39 zōnîm (H2181), “ye use to go a whoring”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'זְנוּתֵי/כֶ֑ם'
  - where: 'opening'
    claim: 'Rashi glosses the verb at 15:39 by 13:25; heart and eyes are the body’s “spies”'
    key: rashi-numbers
    url: 'https://widetorah.com/numbers/15/39'
    quote: 'The verb has the same meaning as in (Numbers 13:25), “and they returned from searching (מתור) the land”.'
  - where: 'opening'
    claim: '15:39 as quoted; the Church’s edition has no footnote at 15:39 (footnotes.mjs numbers 15: 15:38 “fringes” and “borders” only)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/15?lang=eng'
    quote: 'that ye may look upon it, and remember all the commandments of the Lord, and do them; and that ye seek not after your own heart and your own eyes'
  # ---------- section “See the land, what it is” ----------
  - where: 'opening'
    claim: 'Rashi glosses the verb at 15:39 by 13:25; heart and eyes are the body’s “spies”'
    key: rashi-numbers
    url: 'https://widetorah.com/numbers/15/39'
    quote: 'The heart and the eyes are the “spies” of the body — they act as its agents for sinning: the eye sees, the heart covets and the body commits the sin'
  - where: 'opening'
    claim: 'A modern rabbinic study (Bazak) argues the fringe answers the spies’ seeing in their own words, as a repair for the sin of the spies'
    key: bazak-explore
    url: 'https://outorah.org/p/35386/'
    quote: 'In light of these parallels, it appears that the mitzva of tzitzit was given to Israel as a "tikkun" (repair) for the sin of the spies.'
  - where: 'opening'
    claim: 'Bazak: the sin of the spies lay in their seeing, unbalanced and lacking in faith'
    key: bazak-explore
    url: 'https://outorah.org/p/35386/'
    quote: 'The sin of the spies therefore lay in their "seeing," which was unbalanced, lacking in faith and trust'
  - where: 'section “See the land, what it is”'
    claim: 'tûr (H8446) at 13:2 “search”; occurrences.mjs: twelve of the fourteen uses in Numbers are in chapters 13–14 (13: 6 verses, 14: 5 verses)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וְ/יָתֻ֨רוּ֙'
  - where: 'section “See the land, what it is”'
    claim: 'Duncan: all twelve witnessed the same benefits and obstacles; ten saw only the problems, two trusted God'
    key: duncan-rebel-not
    url: 'https://www.churchofjesuschrist.org/study/liahona/2022/04/come-follow-me/19-rebel-not-neither-fear?lang=eng'
    quote: 'All twelve spies had witnessed the same benefits from and the same obstacles to fulfilling the Lord’s command to dwell in Canaan. However, their responses demonstrate how ten members of the group saw only the problems, while the other two placed their trust in God.'
  - where: 'section “See the land, what it is”'
    claim: '13:33 has “in our eyes … in their eyes,” with no word for “own”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'בְּ/עֵינֵי/הֶֽם'
  - where: 'section “See the land, what it is”'
    claim: 'Keil renders 13:33 “we seemed to ourselves and to them as small as grasshoppers”'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/13.htm'
    quote: 'and we seemed to ourselves and to them as small as grasshoppers'
  - where: 'section “See the land, what it is”'
    claim: '14:22–23 as quoted; the footnote at 14:23 “see” leads to D&C 84:24 (23–25)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'Surely they shall not see the land which I sware unto their fathers'
  - where: 'section “See the land, what it is”'
    claim: 'D&C 84:23–24 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'and sought diligently to sanctify his people that they might behold the face of God;'
  # ---------- section “That ye seek not after your own heart and your own eyes” ----------
  - where: 'section “That ye seek not after your own heart and your own eyes”'
    claim: '15:39 ûrĕʾîtem, the same form as 13:18 “see”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וּ/רְאִיתֶ֣ם'
  - where: 'section “That ye seek not after your own heart and your own eyes”'
    claim: '15:39 lōʾ tāturû, tûr (H8446), its last use in Numbers (occurrences.mjs: 14 in 13 verses, the last 15:39)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'תָתֻ֜רוּ'
  - where: 'section “That ye seek not after your own heart and your own eyes”'
    claim: '15:39 ʿênêkem, “your eyes,” with no word for “own”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'עֵֽינֵי/כֶ֔ם'
  - where: 'section “That ye seek not after your own heart and your own eyes”'
    claim: '15:39 zōnîm (H2181), “ye use to go a whoring,” the root of 14:33 zĕnûtêkem (H2184)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'זֹנִ֖ים'
  - where: 'section “That ye seek not after your own heart and your own eyes”'
    claim: 'BDB sense 1 of tûr, “seek out, select,” with the ark (10:33) and the LORD (Deut. 1:33) as subject'
    key: bdb
    url: 'https://biblehub.com/hebrew/8446.htm'
    quote: '1 seek out, select'
  - where: 'section “That ye seek not after your own heart and your own eyes”'
    claim: 'BDB sense 2 of tûr, “spy out, explore,” for the spies in Numbers 13–14'
    key: bdb
    url: 'https://biblehub.com/hebrew/8446.htm'
    quote: '2 spy out, explore, accusative of land Numbers 13:2,16,17,21,23,32'
  - where: 'section “That ye seek not after your own heart and your own eyes”'
    claim: 'BDB puts 15:39 under a third sense of tûr, “go about, figurative”'
    key: bdb
    url: 'https://biblehub.com/hebrew/8446.htm'
    quote: '3 go about, figurative'
  - where: 'section “That ye seek not after your own heart and your own eyes”'
    claim: 'Student Manual: the fringes were to remind Israel of the commandments when they looked on them'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'so that when they looked upon the fringes they would be reminded of the commandments of the Lord (see v. 39).'
  - where: 'section “That ye seek not after your own heart and your own eyes”'
    claim: 'Student Manual: a fringe symbolized being clothed or covered with the commandments of God'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'To put fringes on an article of clothing symbolized that an individual is clothed, or covered, with the commandments of God.'
  # ---------- section “When he looketh upon it, shall live” ----------
  - where: 'section “That ye seek not after your own heart and your own eyes”'
    claim: 'occurrences.mjs numbers --hebrew 7200: the form וּרְאִיתֶם stands in Numbers only at 13:18 and 15:39'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וּ/רְאִיתֶ֥ם'
  - where: 'section “That ye seek not after your own heart and your own eyes”'
    claim: 'occurrences.mjs numbers --hebrew 2181 and 2184: the whoring root stands in Numbers only at 14:33 (H2184), 15:39 and 25:1 (H2181)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'לִ/זְנ֖וֹת'
  - where: 'section “When he looketh upon it, shall live”'
    claim: '21:8 “when he looketh upon it” is wĕrāʾâ ʾōtô, rāʾâ (H7200) with the object “it,” as in 15:39 ûrĕʾîtem ʾōtô'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וְ/רָאָ֥ה'
  - where: 'section “When he looketh upon it, shall live”'
    claim: '21:9 “beheld” is another verb, wĕhibbîṭ (nābaṭ, H5027, hiphil)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וְ/הִבִּ֛יט'
  - where: 'section “When he looketh upon it, shall live”'
    claim: 'Keil on 21:9: whoever looked with faith in the promise of God lived'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/21.htm'
    quote: 'Whoever then of the persons bitten by the poisonous serpents looked at the brazen serpent with faith in the promise of God, lived'
  - where: 'section “When he looketh upon it, shall live”'
    claim: '1 Ne. 17:41 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/1-ne/17?lang=eng'
    quote: 'and the labor which they had to perform was to look; and because of the simpleness of the way, or the easiness of it, there were many who perished.'
  - where: 'section “When he looketh upon it, shall live”'
    claim: 'Alma 33:20 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/33?lang=eng'
    quote: 'Now the reason they would not look is because they did not believe that it would heal them.'
  - where: 'section “When he looketh upon it, shall live”'
    claim: 'KnoWhy 721: the brass serpent itself was powerless; it was the Lord’s power that healed'
    key: sc-knowhy-721
    url: 'https://scripturecentral.org/knowhy/how-did-nephi-liken-looking-to-christ-with-looking-to-the-brazen-serpent'
    quote: 'the symbol of a brass serpent itself was powerless. It was not to be worshipped as an idol as if it, in and of itself, had the power to heal. It was the Lord’s power that was manifest in the healing of the Israelites'
  - where: 'section “When he looketh upon it, shall live”'
    claim: 'KnoWhy 657: by looking to the serpent Israel was looking upward to the Lord'
    key: sc-knowhy-657
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-compare-himself-to-the-brazen-serpent'
    quote: 'by looking to the serpent, they were actually looking upward to the Lord and assenting to His rulership.'
  - where: 'section “When he looketh upon it, shall live”'
    claim: 'Jenson: after the forty-year decree the Lord did not abandon Israel but guided them to develop faith in Jesus Christ'
    key: jenson-look-and-live
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/03/look-and-live?lang=eng'
    quote: 'He did not, however, abandon them. He promised to preserve and bring all their “little ones” under age 20 into the promised land (see Num. 14:29–31). He then proceeded to guide them through a series of difficult yet valuable experiences to help them develop faith in Jesus Christ.'
  - where: 'section “When he looketh upon it, shall live”'
    claim: 'Connection made by this page: the spies were commanded to see a land and weigh it (13:18), and weighed it by their own eyes (13:33); after the sentence the fringe (15:39) and the serpent (21:8) are the two things in Numbers the LORD makes for all the people to look upon, both “look upon it” (rāʾâ with “it”), each with His word attached, the first to remember and the second to live; read together, the serpent shows that the look the fringe asked for is trust (Alma 33:20)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
    quote: 'and it shall come to pass, that every one that is bitten, when he looketh upon it, shall live.'
  # ---------- section “Even so must the Son of man be lifted up” ----------
  - where: 'section “When he looketh upon it, shall live”'
    claim: 'Jenson, in the same account, quotes the Lord’s plea at 15:39'
    key: jenson-look-and-live
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/03/look-and-live?lang=eng'
    quote: 'The Lord then pled with them to “remember all the commandments of the Lord, and do them” (Num. 15:39).'
  - where: 'section “When he looketh upon it, shall live”'
    claim: 'Jenson on the serpent: we show our desire to be healed by remembering Him and obeying His commandments'
    key: jenson-look-and-live
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/03/look-and-live?lang=eng'
    quote: 'We show our desire to be healed by remembering Him always and obeying His commandments. It was not the brazen serpent that brought healing; it was faith in Jehovah and obedience to His words.'
  - where: 'section “Even so must the Son of man be lifted up”'
    claim: 'Scripture Helps: Jesus Christ taught that the serpent incident symbolized His atoning sacrifice'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'Most notably, Jesus Christ taught that this incident symbolized His atoning sacrifice.'
  - where: 'section “Even so must the Son of man be lifted up”'
    claim: 'Guide to the Scriptures: the Lord referred to the lifting up of the serpent as a symbol of Himself lifted up on the cross'
    key: gs-serpent-brazen
    url: 'https://www.churchofjesuschrist.org/study/scriptures/gs/serpent-brazen?lang=eng'
    quote: 'The Lord referred to the lifting up of the serpent in the wilderness as a symbol of Himself being lifted up on the cross (John 3:14–15).'
  # ---------- section “Look unto me in every thought” ----------
  - where: 'section “Look unto me in every thought”'
    claim: 'Clark: “look unto me in every thought” is a call to trust Him completely'
    key: clark-look-unto-jesus
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2019/04/33clark?lang=eng'
    quote: 'It is, therefore, a call to trust Him completely, surrender our will and yield our hearts to Him, and through His redeeming power become like Him.'
  - where: 'section “Look unto me in every thought”'
    claim: 'Christofferson, from Alma: to look to God is to keep His commandments, cry unto Him, counsel with Him, be thankful'
    key: christofferson-look
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2025/10/45christofferson?lang=eng'
    quote: 'Alma explained that to look to God is to keep His commandments, cry unto Him continually for His support, counsel with Him in all your doings, and let your heart be full of thanks unto Him day and night.'
  - where: 'section “Look unto me in every thought”'
    claim: 'Jenson quotes Elder Carlos E. Asay: our looks must not wander; we must look to God and live'
    key: jenson-look-and-live
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/03/look-and-live?lang=eng'
    quote: 'Our looks must not be allowed to wander across the way or to become fixed upon the perishable things of the world. The eye, ‘the light of the body’ (Matt. 6:22), must be trained to look upward. We must look to God and live!'
  - where: 'section “Look unto me in every thought”'
    claim: 'Holland sets Israel refusing to look at the serpent beside Naaman: the source of redemption dismissed because its instruments seem plain'
    key: holland-and-now-i-see
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2025/10/41holland?lang=eng'
    quote: 'Like Naaman resisting the River Jordan or the children of Israel refusing to look at the serpent on the staff, how easy it is for us to dismiss the source of our redemption because the ingredients and the instruments seem embarrassingly plain.'

  - where: 'section “Look unto me in every thought”'
    claim: 'Christofferson comes to looking to God from the brass serpent, which Alma explained as a type or symbol of Christ'
    key: christofferson-look
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2025/10/45christofferson?lang=eng'
    quote: 'Alma explained that the brass figure was a type or symbol of Christ, who would be lifted up upon the cross.'
  - where: 'section “Look unto me in every thought”'
    claim: 'Connection made by this page: Elder Christofferson’s account of looking to God, which begins with keeping His commandments and comes from the serpent (which Alma calls a symbol of Christ), is read alongside the fringe’s looking and remembering the commandments (15:39), now turned to Christ who gave them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/15?lang=eng'
    quote: 'that ye may look upon it, and remember all the commandments of the Lord, and do them'