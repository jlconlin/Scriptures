page: pray-unto-the-lord
claims:
  # ---------- opening ----------
  - where: 'opening'
    claim: 'Num. 11:2 as quoted; “pray” stands in 13 verses of the Numbers KJV, and in all but 11:2 and 21:7 it is “I pray thee” / “I pray you” of a request (occurrences.mjs numbers pray prayed --stem)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/11?lang=eng'
    quote: 'And the people cried unto Moses; and when Moses prayed unto the Lord, the fire was quenched.'
  - where: 'opening'
    claim: 'Num. 21:7 as quoted; the LORD sent fiery serpents (21:6)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
    quote: 'pray unto the Lord, that he take away the serpents from us. And Moses prayed for the people.'
  - where: 'opening'
    claim: 'H6419 (hitpallēl) in Numbers only at 11:2 and 21:7, 3 occurrences in 2 verses, hitpael each time (occurrences.mjs numbers --hebrew 6419); 11:2 wayyitpallēl'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וַ/יִּתְפַּלֵּ֤ל'
  - where: 'opening'
    claim: '21:7 the people’s imperative hitpallēl (HVtv2ms) and Moses’ wayyitpallēl (HC/Vtw3ms), same stem'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'הִתְפַּלֵּל֙'
  - where: 'opening'
    claim: 'In Numbers the people never ask the LORD in words to lift a judgment; the one time the LORD is said to hearken to Israel’s own voice is the vow of 21:2–3'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
    quote: 'And the Lord hearkened to the voice of Israel, and delivered up the Canaanites'
  - where: 'opening'
    claim: 'Num. 25:6: under the plague of Baal-peor the congregation weeps before the tabernacle; no plea is recorded'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/25?lang=eng'
    quote: 'who were weeping before the door of the tabernacle of the congregation.'
  - where: 'opening'
    claim: 'Num. 20:6: at Meribah Moses and Aaron fall on their faces over the people’s thirst, with no judgment fallen'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'and they fell upon their faces: and the glory of the Lord appeared unto them.'
  - where: 'opening'
    claim: 'Bible Dictionary “Moses” lists among his intercessions Taberah (Num. 11:2), the return of the spies (14:13–19) and Korah (16:22); not 12:13, 16:46–48 or 21:7'
    key: bd-moses
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moses?lang=eng'
    quote: 'also at Taberah (Num. 11:2); on the return of the spies (Num. 14:13–19); on the rebellion of Korah (Num. 16:22)'
  - where: 'opening'
    claim: 'Bible Dictionary “Moses” lists the brazen serpent as a separate item'
    key: bd-moses
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/moses?lang=eng'
    quote: 'the brazen serpent (Num. 21:8–9; John 3:14)'
  - where: 'opening'
    claim: 'Connection made by this page: the six pleas of Numbers (11:2; 12:13; 14:13–19; 16:22; 16:45–48; 21:7) read as one sequence in which what changes is what the answer asks of the people, from nothing at Taberah to a figure each bitten person must look at; so the intercessor’s prayer is heard and what it obtains reaches each person through his own look; no source reads the pleas together as a sequence'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
    quote: 'every one that is bitten, when he looketh upon it, shall live.'
  - where: 'opening'
    claim: 'Heb. 7:25 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/7?lang=eng'
    quote: 'seeing he ever liveth to make intercession for them.'
  - where: 'opening'
    claim: 'John 3:14 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/3?lang=eng'
    quote: 'And as Moses lifted up the serpent in the wilderness, even so must the Son of man be lifted up:'
  - where: 'opening'
    claim: 'Table: Num. 12:13–14 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/12?lang=eng'
    quote: 'let her be shut out from the camp seven days, and after that let her be received in again.'
  - where: 'opening'
    claim: 'Table: Num. 14:19–20 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'And the Lord said, I have pardoned according to thy word:'
  - where: 'opening'
    claim: 'Table: Num. 16:22, 24, 48 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'And he stood between the dead and the living; and the plague was stayed.'
  # ---------- section “When Moses prayed unto the LORD, the fire was quenched” ----------
  - where: 'section “When Moses prayed unto the LORD, the fire was quenched”'
    claim: '11:2 the people “cried,” ṣāʿaq (H6817), a different verb from Moses’ hitpallēl'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וַ/יִּצְעַ֥ק'
  - where: 'section “When Moses prayed unto the LORD, the fire was quenched”'
    claim: '11:2 as quoted; no words of the prayer are given'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/11?lang=eng'
    quote: 'And the people cried unto Moses; and when Moses prayed unto the Lord, the fire was quenched.'
  - where: 'section “When Moses prayed unto the LORD, the fire was quenched”'
    claim: 'Keil: the fire broke out at one end of the camp and was extinguished very quickly at Moses’ intercession'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/11.htm'
    quote: 'merely broke out at one end of it, and sank down again, i.e., was extinguished very quickly, at the intercession of Moses'
  - where: 'section “When Moses prayed unto the LORD, the fire was quenched”'
    claim: 'Pulpit on 11:2: the people’s only hope was in their mediator, who had saved them by intercession before (Ex. 32:30–34)'
    key: pulpit-numbers
    url: 'https://biblehub.com/commentaries/pulpit/numbers/11.htm'
    quote: 'they knew that their only hope was in their mediator, who had already saved them by his intercession from a worse destruction (Exodus 32:30-34)'
  # ---------- section “Heal her now” and “Pardon, I beseech thee” ----------
  - where: 'section “Heal her now” and “Pardon, I beseech thee”'
    claim: 'Num. 12:11 Aaron asks Moses, as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/12?lang=eng'
    quote: 'And Aaron said unto Moses, Alas, my lord, I beseech thee, lay not the sin upon us'
  - where: 'section “Heal her now” and “Pardon, I beseech thee”'
    claim: 'Pulpit on 12:13: Moses, though appealed to himself, can only appeal to God'
    key: pulpit-numbers
    url: 'https://biblehub.com/commentaries/pulpit/numbers/12.htm'
    quote: 'Moses, although directly appealed to himself, can only appeal to God.'
  - where: 'section “Heal her now” and “Pardon, I beseech thee”'
    claim: 'Num. 12:13 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/12?lang=eng'
    quote: 'And Moses cried unto the Lord, saying, Heal her now, O God, I beseech thee.'
  - where: 'section “Heal her now” and “Pardon, I beseech thee”'
    claim: 'Num. 12:14–15 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/12?lang=eng'
    quote: 'and the people journeyed not till Miriam was brought in again.'
  - where: 'section “Heal her now” and “Pardon, I beseech thee”'
    claim: 'Keil on 12:14: healing promised after seven days’ punishment'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/12.htm'
    quote: 'Thus restoration and purification from her leprosy were promised to her after the endurance of seven days'' punishment.'
  - where: 'section “Heal her now” and “Pardon, I beseech thee”'
    claim: 'Keil: the purification followed as a matter of course from Leviticus 13–14'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/12.htm'
    quote: 'The latter followed as a matter of course, from Leviticus 13 and 14, and did not need to be specially referred to here.'
  - where: 'section “Heal her now” and “Pardon, I beseech thee”'
    claim: 'Num. 14:10, 12 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'I will smite them with the pestilence, and disinherit them, and will make of thee a greater nation and mightier than they.'
  - where: 'section “Heal her now” and “Pardon, I beseech thee”'
    claim: 'The Church’s footnotes 14:12a (“nation”: Ex. 32:10) and 14:13a (“Egyptians”: Ex. 32:12); 14:13 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'And Moses said unto the Lord, Then the Egyptians shall hear it'
  - where: 'section “Heal her now” and “Pardon, I beseech thee”'
    claim: 'Keil on 14:11–19: Moses stood in the breach again (Ps. 106:23), with a prayer like that at Horeb, but pleading God’s honour among the heathen'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/14.htm'
    quote: 'stood in the breach on this occasion also (Psalm 106:23), with a similar intercessory prayer to that which he had presented at Horeb, except that on this occasion he pleaded the honour of God among the heathen'
  - where: 'section “Heal her now” and “Pardon, I beseech thee”'
    claim: 'Keil on 14:17–18: Moses pleads the word in which God revealed His being to him at Sinai (Ex. 34:6–7)'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/14.htm'
    quote: 'the word in which God Himself had revealed His inmost being to him at Sinai (Exodus 34:6-7)'
  - where: 'section “Heal her now” and “Pardon, I beseech thee”'
    claim: 'Num. 14:18–19 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'Pardon, I beseech thee, the iniquity of this people according unto the greatness of thy mercy'
  - where: 'section “Heal her now” and “Pardon, I beseech thee”'
    claim: 'Student Manual calls Moses’ plea at 14:13–14 “a great intercessory prayer”'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'In a great intercessory prayer, Moses pleaded for mercy for his people (see Numbers 14:13–14).'
  - where: 'section “Heal her now” and “Pardon, I beseech thee”'
    claim: 'Num. 14:20–23 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'Surely they shall not see the land which I sware unto their fathers'
  - where: 'section “Shall one man sin?”'
    claim: 'Num. 16:21–22 as quoted; a question, no request'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'O God, the God of the spirits of all flesh, shall one man sin, and wilt thou be wroth with all the congregation?'
  - where: 'section “Shall one man sin?”'
    claim: 'Num. 16:24, 26 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'Depart, I pray you, from the tents of these wicked men, and touch nothing of theirs, lest ye be consumed in all their sins.'
  - where: 'section “Shall one man sin?”'
    claim: 'Cambridge on 16:20–24: at Moses’ intercession He relents'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/16.htm'
    quote: 'but at Moses’ intercession He relents, and commands them to depart from the Tabernacle'
  - where: 'section “Shall one man sin?”'
    claim: 'Num. 16:41, 45 as quoted; no words follow the falling on their faces'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'Get you up from among this congregation, that I may consume them as in a moment. And they fell upon their faces.'
  - where: 'section “Shall one man sin?”'
    claim: 'Keil on 16:46: all the motives Moses had pleaded were exhausted'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/16.htm'
    quote: 'All the motives which he had hitherto pleaded, in his repeated intercession that this evil congregation might be spared, were now exhausted.'
  - where: 'section “Shall one man sin?”'
    claim: 'Keil: he could not plead as at 16:22, the whole congregation having taken part with the rebels'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/16.htm'
    quote: 'seeing that the whole congregation had taken part with the rebels'
  - where: 'section “Shall one man sin?”'
    claim: 'Num. 16:46–48 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'and he put on incense, and made an atonement for the people.'
  - where: 'section “Shall one man sin?”'
    claim: 'Student Manual: burning incense a symbol of prayer'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'Other scriptures indicate that the burning of incense was a symbol of prayer'
  - where: 'section “Shall one man sin?”'
    claim: 'Ellicott on 16:46: incense an emblem of prayer and figure of Christ’s intercession'
    key: ellicott-numbers
    url: 'https://biblehub.com/commentaries/ellicott/numbers/16.htm'
    quote: 'Incense was an emblem of prayer, and a figure of the intercession and mediation of Christ.'
  - where: 'section “Shall one man sin?”'
    claim: 'Ellicott on 16:48: Aaron a striking type of Christ'
    key: ellicott-numbers
    url: 'https://biblehub.com/commentaries/ellicott/numbers/16.htm'
    quote: 'Aaron was, in this respect, a striking type of Christ'
  - where: 'section “Shall one man sin?”'
    claim: 'Keil: the incense embodied the high-priestly prayer, and did not depend on subjective faith'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/16.htm'
    quote: 'the offering of incense which embodied the high-priestly prayer, and the strength and operation of which were not dependent upon the sincerity and earnestness of subjective faith'
  - where: 'section “Shall one man sin?”'
    claim: 'Keil, continued'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/16.htm'
    quote: 'but had a firm and immovable foundation in the objective force of the divine appointment'
  # ---------- section “That he take away the serpents from us” ----------
  - where: 'section “That he take away the serpents from us”'
    claim: 'Pulpit on 21:7: the first and only recorded occasion the people directly asked for Moses’ intercession; Pharaoh did so several times, never in vain'
    key: pulpit-numbers
    url: 'https://biblehub.com/commentaries/pulpit/numbers/21.htm'
    quote: 'This is the first and only (recorded) occasion on which the people directly asked for the intercession of Moses (cf., however, chapter Numbers 11:2)'
  - where: 'section “That he take away the serpents from us”'
    claim: 'Pulpit on 21:7: Pharaoh had asked Moses’ intercession several times, never in vain'
    key: pulpit-numbers
    url: 'https://biblehub.com/commentaries/pulpit/numbers/21.htm'
    quote: 'although Pharaoh had done so several times, and never in vain'
  - where: 'section “That he take away the serpents from us”'
    claim: 'Num. 21:7 as quoted; the only verse in Numbers where the people say “We have sinned” and ask for prayer (occurrences.mjs numbers "have sinned": 12:11 Aaron, 14:40, 21:7, 22:34, 32:23)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
    quote: 'We have sinned, for we have spoken against the Lord, and against thee; pray unto the Lord, that he take away the serpents from us.'
  - where: 'section “That he take away the serpents from us”'
    claim: '21:7 the request names the serpent, nāḥāš (H5175)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'הַ/נָּחָ֑שׁ'
  - where: 'section “That he take away the serpents from us”'
    claim: '21:7 “that he take away,” wĕyāsēr, hiphil jussive of sûr (H5493)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וְ/יָסֵ֥ר'
  - where: 'section “That he take away the serpents from us”'
    claim: '21:7 Moses prays with the verb of 11:2, wayyitpallēl (H6419)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וַ/יִּתְפַּלֵּ֥ל'
  - where: 'section “That he take away the serpents from us”'
    claim: '21:8 the serpent Moses is to make is a śārāf (H8314a)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'שָׂרָ֔ף'
  - where: 'section “That he take away the serpents from us”'
    claim: '21:6 the LORD sent hannĕḥāšîm haśśĕrāpîm, “fiery serpents” (H5175, H8314a)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'הַ/שְּׂרָפִ֔ים'
  - where: 'section “That he take away the serpents from us”'
    claim: '21:9 Moses makes a nĕḥaš nĕḥōšet, “serpent of brass” (H5175)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'נְחַ֣שׁ'
  - where: 'section “That he take away the serpents from us”'
    claim: '21:9 nĕḥōšet, “brass” (H5178a)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'נְחֹ֔שֶׁת'
  - where: 'section “That he take away the serpents from us”'
    claim: 'Num. 21:6 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
    quote: 'And the Lord sent fiery serpents among the people'
  - where: 'section “That he take away the serpents from us”'
    claim: 'Num. 21:8 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
