page: pray-unto-the-lord
claims:
  - where: 'section “Quenched”'
    claim: 'The Hebrew verb for “prayed” (H6419) occurs in Numbers only at 11:2 and 21:7 (3 occurrences in 2 verses)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וַ/יִּתְפַּלֵּ֤ל'
  - where: 'section “Quenched”'
    claim: 'The same verb at 21:7'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וַ/יִּתְפַּלֵּ֥ל'
  - where: 'section “Quenched”'
    claim: 'Connection made by this page: 11:2 and 21:7 set side by side have one shape, the people come to Moses and Moses prays to the LORD; the first ends with the fire quenched, the last with a serpent set on a pole'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/11?lang=eng'
    quote: 'And the people cried unto Moses; and when Moses prayed unto the LORD, the fire was quenched.'
  - where: 'section “Quenched”'
    claim: 'The fire was extinguished very quickly at the intercession of Moses'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/11.htm'
    quote: 'was extinguished very quickly, at the intercession of Moses'
  - where: 'section “Granted, in another shape”'
    claim: 'Israel was spared destruction but lost the privilege of entering the land at once'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'Israel was spared destruction but lost the privilege of immediately entering the promised land.'
  - where: 'section “Granted, in another shape”'
    claim: 'The LORD says the people shall not see the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'Surely they shall not see the land which I sware unto their fathers'
  - where: 'section “Get you up”'
    claim: 'The answer narrows the judgment to the tents of Korah, Dathan and Abiram, and Moses tells the congregation to depart from them'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'Depart, I pray you, from the tents of these wicked men'
  - where: 'section “Get you up”'
    claim: 'At 16:45 the congregation fell on their faces'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'Get you up from among this congregation, that I may consume them as in a moment. And they fell upon their faces.'
  - where: 'section “Get you up”'
    claim: 'Moses’ earlier motives for intercession were exhausted by Num. 16:46–48'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/16.htm'
    quote: 'All the motives which he had hitherto pleaded, in his repeated intercession that this evil congregation might be spared, were now exhausted.'
  - where: 'section “Not taken away”'
    claim: 'The text of Numbers 21 says nothing of the serpents leaving; the next verse says those bitten lived when they beheld the serpent of brass'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
    quote: 'if a serpent had bitten any man, when he beheld the serpent of brass, he lived.'
  - where: 'section “Not taken away”'
    claim: 'The Lord did not take the serpents away but made a way for the people to be saved'
    key: ot-stories-brass-serpent
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-stories-2022/moses-and-the-brass-serpent?lang=eng'
    quote: 'The Lord did not take the serpents away. But He did make a way for the people to be saved if they were bitten.'
  - where: 'section “The Intercessor lifted up”'
    claim: 'Connection made by this page: Hebrews says of Christ that he ever lives to make intercession, and John 3 says the Son of man must be lifted up as Moses lifted up the serpent; in Numbers 21 the one who prays and the thing lifted up are two, in the two verses together both are said of one Person'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/7?lang=eng'
    quote: 'seeing he ever liveth to make intercession for them.'
  - where: 'section “The Intercessor lifted up”'
    claim: 'John 3:14 ties the serpent to the Son of man lifted up'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/john/3?lang=eng'
    quote: 'And as Moses lifted up the serpent in the wilderness, even so must the Son of man be lifted up:'
  - where: 'section “The Intercessor lifted up”'
    claim: 'Latter-day Saints may read prophetic intercession as typological for the role of Jesus'
    key: sears-intercession
    url: 'https://rsc.byu.edu/prophets-prophecies-old-testament/o-lord-god-forgive'
    quote: 'understands prophetic intercession as typological for the role of Jesus'
  - where: 'section “The Intercessor lifted up”'
    claim: 'The lifting up of the serpent is a type of the Lord’s lifting up upon the cross'
    key: bd-serpent-brazen
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/serpent-brazen?lang=eng'
    quote: 'The “lifting up” of the serpent in the wilderness is referred to by the Lord as a type of His own “lifting up” upon the cross (John 3:14–15).'
  - where: 'section “Not removed, but borne”'
    claim: 'Connection made by this page: Paul’s request that a thing “depart” and the answer of grace, and Alma’s people’s burdens eased in bondage, set beside the request to “take away” the serpents and the answer of a remedy; in each the answer was not removal'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/2-cor/12?lang=eng'
    quote: 'For this thing I besought the Lord thrice, that it might depart from me.'
  - where: 'section “Not removed, but borne”'
    claim: 'The burdens of Alma’s people were eased while they remained in bondage'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/mosiah/24?lang=eng'
    quote: 'And I will also ease the burdens which are put upon your shoulders, that even you cannot feel them upon your backs, even while you are in bondage'
  - where: 'section “Not removed, but borne”'
    claim: 'The challenges were not immediately removed; the people were strengthened'
    key: bednar-bear-up-burdens
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2014/04/bear-up-their-burdens-with-ease?lang=eng'
    quote: 'The challenges and difficulties were not immediately removed from the people. But Alma and his followers were strengthened, and their increased capacity made the burdens lighter.'
