    key: ot-stories-brass-serpent
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-stories-2022/moses-and-the-brass-serpent?lang=eng'
    quote: 'The Lord did not take the serpents away. But He did make a way for the people to be saved if they were bitten.'
  - where: 'section “That he take away the serpents from us”'
    claim: 'Jenson (Ensign, Mar. 2002): rather than taking the serpents away the Lord taught faith and salvation through Christ'
    key: jenson-look-and-live
    url: 'https://www.churchofjesuschrist.org/study/ensign/2002/03/look-and-live?lang=eng'
    quote: 'Rather than simply taking the serpents away, the Lord chose to teach His people about faith and salvation through Christ.'
  - where: 'section “That he take away the serpents from us”'
    claim: 'Ex. 8:8 wĕyāsēr, the same form (hiphil jussive of sûr, H5493) as Num. 21:7'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Exod.xml'
    quote: 'וְ/יָסֵר֙'
  - where: 'section “That he take away the serpents from us”'
    claim: 'Ex. 8:8 as quoted'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/8?lang=eng'
