  - where: 'section “That he take away the serpents from us”'
    claim: 'Num. 21:9 as quoted; Numbers does not say whether the serpents left (“serpent” occurs only at 21:6–9)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/21?lang=eng'
    quote: 'if a serpent had bitten any man, when he beheld the serpent of brass, he lived.'
  - where: 'section “That he take away the serpents from us”'
    claim: 'Pulpit on 21:9: the record tells nothing but the bare facts'
    key: pulpit-numbers
    url: 'https://biblehub.com/commentaries/pulpit/numbers/21.htm'
    quote: 'The record is brief and simple in the extreme, and tells nothing but the bare facts.'
  - where: 'section “That he take away the serpents from us”'
    claim: 'Student Manual on 21:4–9: nothing more is told'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'Nothing more is told of the story.'
  - where: 'section “That he take away the serpents from us”'
