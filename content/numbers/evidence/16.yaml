chapter: 16
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The time and place of the rebellion are not recorded'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/16.htm'
    quote: 'The time and place are not recorded.'
  - where: 'setting'
    claim: 'One older reading: the only important occurrence recorded of the years of wandering'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/16.htm'
    quote: 'The sedition of Korah and his company, with the renewed sanction of the Aaronic priesthood on the part of God which it occasioned, is the only important occurrence recorded in connection with the thirty-seven years'' wandering in the wilderness.'
  - where: 'setting'
    claim: 'Israel came again to Kadesh at the end of the wandering (chapter 20)'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/16.htm'
    quote: 'we read, in Numbers 20:1, that the whole congregation came again into the desert of Zin to kadesh at the beginning of the fortieth year'
  - where: 'setting'
    claim: 'Thirty-eight years passed between Korah''s rebellion and the request to pass through Edom'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'Between the rebellion of Korah (chaps. 16–17) and the request for passage through the land of Edom (chap. 20), thirty-eight years of wandering had transpired.'
  - where: 'setting'
    claim: 'Numbers 11–25 portray murmuring, rebellion against Moses (12, 14, 16) and apostasy; Sinai''s covenants did not ensure obedience'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'most accounts narrated in Numbers 11–25 are painful in their portrayal of murmuring (chapters 11, 21), rebellion against Moses’s leadership (chapters 12, 14, 16), and apostasy (chapter 25) … Their spiritual experiences and covenants at Mount Sinai did not automatically ensure their faith and obedience as they moved toward Canaan.'
  - where: 'setting'
    claim: 'The rebellion was led by a Levite, one who held the holy priesthood'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'Had the insurrection been led by just any Israelite, it would have been serious enough, but Korah was a Levite, one who held the holy priesthood'
  - where: 'setting'
    claim: 'The Kohathites'' service was about the most holy things'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/4?lang=eng'
    quote: 'This shall be the service of the sons of Kohath in the tabernacle of the congregation, about the most holy things:'
  - where: 'setting'
    claim: 'Chapter 18 gives Aaron and his sons their charge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/18?lang=eng'
    quote: 'Thou and thy sons and thy father’s house with thee shall bear the iniquity of the sanctuary: and thou and thy sons with thee shall bear the iniquity of your priesthood.'
  - where: 'thread'
    claim: 'Korah held the LORD''s presence made all holy; Moses answered that it was not automatic'
    key: strathearn-holiness-lord
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/holiness-lord-personal-temple-worship'
    quote: 'Korah argued that the presence of the Lord qualified every member of the congregation to be qadōš. Moses’s response, however, showed that being qadōš is not something that was automatic.'
  - where: 'thread'
    claim: 'The rebellion was a direct challenge to Moses'' and Aaron''s leadership'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'In Korah’s rebellion is a direct challenge to Moses’ and Aaron’s leadership.'
  - where: 'section 6 plain'
    claim: '“Sinners against their own souls” means men who forfeited their lives by their sin'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/16.htm'
    quote: '"The censers of these sinners against their souls" (i.e., the men who have forfeited their lives through their sin: cf. Proverbs 20:2; Habakkuk 2:10)'

  # ---------- notes ----------
  - where: 'note 16:1 “A Levite and three Reubenites”'
    claim: 'Korah, great-grandson of Levi through Kohath and Izhar, leader of the rebellion'
    key: bd-korah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/korah?lang=eng'
    quote: 'Son of Izhar, grandson of Kohath, and great-grandson of Levi (Ex. 6:21, 24), the leader of the rebellion against Moses and Aaron (Num. 16; 26:9–11; Jude 1:11).'
  - where: 'note 16:1 “A Levite and three Reubenites”'
    claim: 'Reuben was Jacob''s firstborn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'Reuben, the eldest son of Israel'
  - where: 'note 16:1 “A Levite and three Reubenites”'
    claim: 'One older reading: Korah claimed the high priesthood; the Reubenites resented the lost birthright'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/16.htm'
    quote: 'He laid claim to the high-priesthood, or at least to an equality with Aaron (Numbers 16:17). Among his associates were the Reubenites, Dathan and Abiram, who, no doubt, were unable to get over the fact that the birthright had been taken away from their ancestor, and with it the headship of the house of Israel'
  - where: 'note 16:1 “A Levite and three Reubenites”'
    claim: 'One older reading: the 250 came from the other tribes, as Num. 27:3 implies'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/16.htm'
    quote: 'The 250 men of the children of Israel who joined the rebels no doubt belonged to the other tribes, as is indirectly implied in the statement in Numbers 27:3, that Zelophehad the Manassite was not in the company of Korah.'
  - where: 'note 16:1 “A Levite and three Reubenites”'
    claim: 'On is not mentioned again'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/16.htm'
    quote: 'On, the son of Peleth, a Reubenite, not mentioned again'
  - where: 'note 16:1 “A Levite and three Reubenites”'
    claim: 'Moses deals with Korah and with Dathan and Abiram separately'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/16.htm'
    quote: 'he made a distinction between Korah the Levite, and Dathan and Abiram the Reubenites, according to the difference in the motives which prompted their rebellion, and the claims which they asserted.'

  - where: 'note 16:3 “Holy, but not by claim”'
    claim: 'Korah''s word is qadōš, the word of Lev. 20:26'
    key: strathearn-holiness-lord
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/holiness-lord-personal-temple-worship'
    quote: '“And ye shall be holy [qadōš] unto me: for I the Lord am holy [qadōš], and have severed you from other people, that ye should be mine” (Leviticus 20:26).'
  - where: 'note 16:3 “Holy, but not by claim”'
    claim: 'Lev. 20:26 is the LORD''s charge to the children of Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/20?lang=eng'
    quote: 'Ye shall therefore keep all my statutes'
  - where: 'note 16:3 “Holy, but not by claim”'
    claim: 'Korah: the Lord''s presence made all holy; Moses: holiness not automatic; even Levites not automatically holy'
    key: strathearn-holiness-lord
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/holiness-lord-personal-temple-worship'
    quote: 'Korah argued that the presence of the Lord qualified every member of the congregation to be qadōš. Moses’s response, however, showed that being qadōš is not something that was automatic. … even the Levites who held the priesthood were not automatically qadōš.'
  - where: 'note 16:3 “Holy, but not by claim”'
    claim: 'God hoped Israel would become a holy people (Ex. 19:6)'
    key: strathearn-holiness-lord
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/holiness-lord-personal-temple-worship'
    quote: 'God sometimes described Israel as being a qadōš people (see Deuteronomy 14:2, 21), or at least he hoped that they would become such (see Exodus 19:6; Deuteronomy 26:19; 28:9).'
  - where: 'note 16:3 “Holy, but not by claim”'
    claim: 'The manual compares Korah''s words with the Zoramites'' “holy children”'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'Korah’s statement that “all the congregation are holy, every one of them” (v. 3) is similar to that of the apostate Zoramites who, in their great wickedness, thanked God that they were His “holy children” (Alma 31:16).'
  - where: 'note 16:3 “Holy, but not by claim”'
    claim: 'Psalm 106 calls Aaron the saint of the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ps/106?lang=eng'
    quote: 'They envied Moses also in the camp, and Aaron the saint of the Lord.'

  - where: 'note 16:6 “Why the test was incense”'
    claim: 'The high priest offered incense twice daily with live coals from the brazen altar'
    key: bd-incense
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/incense?lang=eng'
    quote: 'the duty of offering it twice daily fell upon the high priest (Ex. 30:7–8) … Live coals were brought from the brazen altar of burnt offering and placed on the golden altar of incense'
  - where: 'note 16:6 “Why the test was incense”'
    claim: 'One older reading: incense the holiest priestly function; the LORD had already judged its unauthorized use (Lev. 10)'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/16.htm'
    quote: 'The divine decision was connected with the offering of incense, because this was the holiest function of the priestly service, which brought the priest into the immediate presence of God, and in connection with which Jehovah had already shown to the whole congregation how He sanctified Himself, by a penal judgment on those who took this office upon themselves without a divine call (Leviticus 10:1-3).'
  - where: 'note 16:6 “Why the test was incense”'
    claim: 'Incense a symbol of prayer; God approached only in holy supplication'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'Other scriptures indicate that the burning of incense was a symbol of prayer (see Revelation 5:8; 8:3–4; Psalm 141:2), suggesting that God can only be approached in holy supplication.'
  - where: 'note 16:6 “Why the test was incense”'
    claim: 'Nadab and Abihu offered strange fire'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/10?lang=eng'
    quote: 'offered strange fire before the Lord, which he commanded them not.'

  - where: 'note 16:10 ““The high priesthood””'
    claim: 'The JST reads “high priesthood” in 16:10'
    key: horton-jst-pentateuch
    url: 'https://rsc.byu.edu/joseph-smith-translation/insights-exodus-leviticus-numbers-deuteronomy'
    quote: 'the JST rendering of Numbers 16:10 provides an insight into what the group was seeking after: “And he hath brought thee near to him [the Lord], and all thy brethren the sons of Levi with thee; and seek ye the high priesthood also?”'
  - where: 'note 16:10 ““The high priesthood””'
    claim: 'Scholars puzzled since the Levites already held the Levitical Priesthood'
    key: horton-jst-pentateuch
    url: 'https://rsc.byu.edu/joseph-smith-translation/insights-exodus-leviticus-numbers-deuteronomy'
    quote: 'Bible scholars have puzzled over this statement because the Levites in the group already held the Levitical Priesthood which the Lord had restricted to their tribe only.'
  - where: 'note 16:10 ““The high priesthood””'
    claim: 'Horton''s reading: they sought the Melchizedek Priesthood, which fits the non-Levites in the group'
    key: horton-jst-pentateuch
    url: 'https://rsc.byu.edu/joseph-smith-translation/insights-exodus-leviticus-numbers-deuteronomy'
    quote: 'this seems like a direct reference to the fact they were seeking the higher or Melchizedek Priesthood. This makes sense because this would also accommodate the non-Levites who were part of the group.'
  - where: 'note 16:10 ““The high priesthood””'
    claim: 'The higher priesthood was taken from the people at the time of the second tablets'
    key: horton-jst-pentateuch
    url: 'https://rsc.byu.edu/joseph-smith-translation/insights-exodus-leviticus-numbers-deuteronomy'
    quote: 'the higher or Melchizedek Priesthood and its ordinances were taken from the people generally, at the time of the second set of tablets, and was no longer widely available to the Israelites (JST, Exodus 34:2; JST Deuteronomy 10:1).'
  - where: 'note 16:10 ““The high priesthood””'
    claim: 'D&C 84:25–26 on the Holy Priesthood taken and the lesser continued'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/84?lang=eng'
    quote: 'Therefore, he took Moses out of their midst, and the Holy Priesthood also; And the lesser priesthood continued'

  - where: 'note 16:13 “Egypt called the land of milk and honey”'
    claim: 'One older reading: the phrase applied in bitter irony to Egypt'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/16.htm'
    quote: '"Is it too little that thou hast brought us out of a land flowing with milk and honey (they apply this expression in bitter irony to Egypt), to kill us in the wilderness'
  - where: 'note 16:13 “Egypt called the land of milk and honey”'
    claim: 'Verse 14: thou hast not kept thy promise; “put out the eyes” = blind them as to thy designs'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/16.htm'
    quote: '(i.e., thou hast not kept thy promise, Exodus 4:30 compared with Numbers 3:7.). Wilt thou put out the eyes of these people?" i.e., wilt thou blind them as to thy doings and designs?'
  - where: 'note 16:13 “Egypt called the land of milk and honey”'
    claim: 'The spies used the phrase of the land itself'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/13?lang=eng'
    quote: 'surely it floweth with milk and honey'
  - where: 'note 16:13 “Egypt called the land of milk and honey”'
    claim: 'The LORD described Canaan so at the bush'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/3?lang=eng'
    quote: 'unto a land flowing with milk and honey'

  - where: 'note 16:22 “The God of the spirits of all flesh”'
    claim: 'Latter-day Saint reading: Moses 6:51 and the implication of Num. 16:22 that God is the Father of all'
    key: brown-premortal-life
    url: 'https://rsc.byu.edu/latter-day-saint-essentials/premortal-life'
    quote: 'He received a revelation of information once made known to Moses: “I [God] made the world, and men before they were in the flesh” (Moses 6:51). This likewise reflects the implication in Numbers 16:22 that God is the Father of all, and hence he is “the God of the spirits of all flesh.”'
  - where: 'note 16:22 “The God of the spirits of all flesh”'
    claim: 'Moses uses the title again at 27:16'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/27?lang=eng'
    quote: 'Let the Lord, the God of the spirits of all flesh, set a man over the congregation,'

  - where: 'note 16:30 “A new creation as the sign”'
    claim: 'The Hebrew of 16:30 has noun and verb of creating'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'בְּרִיאָ֞ה יִבְרָ֣א'
  - where: 'note 16:30 “A new creation as the sign”'
    claim: 'The verb bārāʾ is the verb of Gen. 1:1'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Gen.xml'
    quote: 'בָּרָ֣א'
  - where: 'note 16:30 “A new creation as the sign”'
    claim: '“The pit” in 16:30 is Sheol'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'שְׁאֹ֑לָ/ה'
  - where: 'note 16:30 “A new creation as the sign”'
    claim: 'In vindicating His prophet the Lord showed that what Moses had done was not a small thing (16:13, 28)'
    key: sc-knowhy-797
    url: 'https://scripturecentral.org/knowhy/why-did-the-lord-invite-people-to-try-to-produce-revelations-like-joseph-smith-s'
    quote: 'In vindicating His prophet, the Lord showed the people that what Moses had done was not a small thing and that the power of the Lord was far beyond their imagination.'
  - where: 'note 16:30 “A new creation as the sign”'
    claim: 'Text of Gen. 1:1'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/gen/1?lang=eng'
    quote: 'In the beginning God created the heaven and the earth.'

  - where: 'note 16:32 “Korah''s sons did not die”'
    claim: 'The census: the children of Korah died not'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'And the earth opened her mouth, and swallowed them up together with Korah … Notwithstanding the children of Korah died not.'
  - where: 'note 16:32 “Korah''s sons did not die”'
    claim: 'The Korahites became musicians and temple doorkeepers; psalm titles'
    key: bd-korah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/korah?lang=eng'
    quote: 'His descendants, the Korahites, or Korathites, formed a guild of musicians (2 Chr. 20:19; titles of Ps. 42; 44–49; 84–85; 87–88), while others held the responsible post of doorkeeper (porter in KJV) of the temple (1 Chr. 9:17–19).'


  # ---------- christ ----------
  - where: 'christ'
    claim: 'Hebrews 5:4–5: called as was Aaron; so also Christ'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/5?lang=eng'
    quote: 'And no man taketh this honour unto himself, but he that is called of God, as was Aaron. So also Christ glorified not himself to be made an high priest'
  - where: 'christ'
    claim: 'Christ is the God of Israel (the LORD of the Old Testament)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/10?lang=eng'
    quote: 'Christ is the God of Israel and the spiritual Rock that guided them'
  - where: 'christ'
    claim: 'Holiness is not automatic'
    key: strathearn-holiness-lord
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/holiness-lord-personal-temple-worship'
    quote: 'Moses’s response, however, showed that being qadōš is not something that was automatic.'
  - where: 'note 16:10 ““The high priesthood””'
    claim: 'Heb. 5:4: no man taketh this honour unto himself, as was Aaron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/5?lang=eng'
    quote: 'And no man taketh this honour unto himself, but he that is called of God, as was Aaron. So also Christ glorified not himself to be made an high priest'
  - where: 'christ'
    claim: 'God''s greatest desire is that His people become as He is'
    key: strathearn-holiness-lord
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/holiness-lord-personal-temple-worship'
    quote: 'Thus God’s greatest desire for his people is that they become as he is.'
