chapter: 26
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The census is taken on the plains of Moab by Jordan near Jericho'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'And Moses and Eleazar the priest spake with them in the plains of Moab by Jordan near Jericho'
  - where: 'setting'
    claim: 'The plains of Moab are the last main location; the second census, Joshua’s investiture and the Transjordan tribes come there, after the Exodus generation died'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'the plains of Moab. This final, and large, portion of the book of Numbers includes … a second Israelite numbering (or census), now that the people of the Exodus generation were dead and their successors were on the doorstep of the promised land (chapter 26, see especially verses 64–65), the investiture of Joshua as Moses’s successor (27:12–23)'
  - where: 'setting'
    claim: 'Three main locations: Sinai, Kadesh, plains of Moab'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'The book of Numbers focuses on Israelite activities in three main locations: at Mount Sinai, near Kadesh, and at the plains of Moab.'
  - where: 'setting'
    claim: 'The plague of verse 1 is the one in Numbers 25:9'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/26.htm'
    quote: 'The plague related in Numbers 25:9 was the last of the punishments undergone by the Israelites for their sins and rebellions.'
  - where: 'setting'
    claim: 'The families’ names largely follow Genesis 46'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/26.htm'
    quote: 'The names of the families correspond, - with very few exceptions, - to the grandsons and great-grandsons of Jacob mentioned in Genesis 46.'
  - where: 'setting'
    claim: 'The names are based on Genesis 46:8–27; families counted, unlike chapter 1'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/26.htm'
    quote: 'The twelve secular tribes are numbered, the sacred tribe of Levi being omitted. The names are based upon Genesis 46:8-27'
  - where: 'setting'
    claim: 'Aaron died in the fortieth year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'And Aaron the priest went up into mount Hor at the commandment of the LORD, and died there, in the fortieth year after the children of Israel were come out of the land of Egypt'
  - where: 'thread'
    claim: 'First census 38 years before; total 603,550 then, 601,730 now'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/26.htm'
    quote: 'The total number at the first census, thirty-eight years before (ch. 1) was 603,550; now it is 601,730.'
  - where: 'thread'
    claim: 'The Levites numbered 22,000 at the first census'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/26.htm'
    quote: '62. twenty and three thousand] At the first census the Levites numbered 22,000.'
  - where: 'thread'
    claim: 'The count prepares for the division of the land; families enumerated for that reason'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/26.htm'
    quote: 'was intended to serve at the same time as a preparation for their settlement in Canaan, viz., for the division of the conquered land among the tribes and families of Israel. For this reason (Numbers 26) the families of the different tribes are enumerated here'

  # ---------- notes ----------
  - where: 'note 26:1 “Why count again now”'
    claim: 'The plague is that of Numbers 25:9'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/26.htm'
    quote: 'The plague related in Numbers 25:9 was the last of the punishments undergone by the Israelites for their sins and rebellions.'
  - where: 'note 26:1 “Why count again now”'
    claim: 'With the plague the last of the condemned generation were gone and the sentence was complete'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/26.htm'
    quote: 'On this ground the command of God was issued, "after the plague,"'' for a fresh census and muster. For with the plague the last of those who came out of Egypt, and were not to enter Canaan, had been swept away, and thus the sentence had been completely executed.'
  - where: 'note 26:1 “Why count again now”'
    claim: 'The count mustered for war and prepared for the division of the land, hence the families'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/26.htm'
    quote: 'was not merely to muster Israel for the war with the Midianites, and in the approaching conquest of the promised land with the Canaanites also, but was intended to serve at the same time as a preparation for their settlement in Canaan, viz., for the division of the conquered land among the tribes and families of Israel. For this reason (Numbers 26) the families of the different tribes are enumerated here, which was not the case in ch. 1'
  - where: 'note 26:10 “A sign is a warning”'
    claim: 'nes: banner, standard, ensign, signal'
    key: bdb
    url: 'https://biblehub.com/hebrew/5251.htm'
    quote: 'nes: Banner, standard, ensign, signal'
  - where: 'note 26:10 “A sign is a warning”'
    claim: 'BDB gives Num. 26:10 the sense sign = warning'
    key: bdb
    url: 'https://biblehub.com/hebrew/5251.htm'
    quote: '4 sign (compare Late Hebrew) = warning Numbers 26:10 (P).'
  - where: 'note 26:10 “A sign is a warning”'
    claim: 'The Hebrew word in 26:10 is nes'
    key: bdb
    url: 'https://biblehub.com/hebrew/5251.htm'
    quote: 'Strong''s Hebrew: 5251. נֵס (nes) -- Banner, standard, ensign, signal'
  - where: 'note 26:10 “A sign is a warning”'
    claim: 'The verse refers to 16:38, where the censers rather than the men are the sign'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/26.htm'
    quote: '10. and they became a sign] This is a reference to Numbers 16:38; but there it is not the offenders but their fire-pans, beaten into plates for the altar, that are a sign.'
  - where: 'note 26:33 “Five daughters in a list of men”'
    claim: 'The daughters are named to prepare for the laws their case gave rise to'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/26.htm'
    quote: 'In Numbers 26:33, a son of Hepher, named Zelophehad, is mentioned. He had no sons, but only daughters, whose names are given here to prepare the way for the legal regulations mentioned in Numbers 27 and 39, to which this fact gave rise.'
  - where: 'note 26:34 “Manasseh and Ephraim reversed”'
    claim: 'At Sinai Ephraim 40,500 and Manasseh 32,200'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'Those that were numbered of them, even of the tribe of Ephraim, were forty thousand and five hundred. … Those that were numbered of them, even of the tribe of Manasseh, were thirty and two thousand and two hundred.'
  - where: 'note 26:34 “Manasseh and Ephraim reversed”'
    claim: 'The order is the same except Manasseh now precedes Ephraim'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/26.htm'
    quote: 'The order of the tribes is the same, except that Manasseh (Numbers 26:29-34) precedes Ephraim (Numbers 26:35-37).'
  - where: 'note 26:51 “Almost the same total, not the same tribes”'
    claim: 'Total 603,550 then, 601,730 now; five tribes decreased, seven increased'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/26.htm'
    quote: 'The total number at the first census, thirty-eight years before (ch. 1) was 603,550; now it is 601,730. … Reuben, Simeon, Gad, Ephraim and Naphtali have decreased in numbers, while the other seven have increased.'
  - where: 'note 26:51 “Almost the same total, not the same tribes”'
    claim: 'Despite births the numbers are 1,820 less, showing the severity of the punishments'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/26.htm'
    quote: 'And the priestly writer shews, by implication, how severe the punishments had been; in spite of the increase of population which would naturally accrue by births, the numbers left in Moab are 1820 less than those reckoned at Sinai.'
  - where: 'note 26:51 “Almost the same total, not the same tribes”'
    claim: 'Simeon numbered 59,300 at Sinai'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'Those that were numbered of them, even of the tribe of Simeon, were fifty and nine thousand and three hundred.'
  - where: 'note 26:55 “By size and by lot”'
    claim: 'The lot decided only roughly where each tribe would settle'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/26.htm'
    quote: 'Since the distribution was to be proportionate the purpose of the lot must only have been to decide roughly in what part of the country each tribe was to settle.'
  - where: 'note 26:55 “By size and by lot”'
    claim: 'The lots were cast after the land was won (Joshua 14)'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/26.htm'
    quote: 'But according to P (Joshua 13:15-23; Joshua 14:1-5) the lots were not cast till the whole land was won.'
  - where: 'note 26:55 “By size and by lot”'
    claim: 'The lot could not fix the size, only the situation; the lot was received as God’s assignment'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/26.htm'
    quote: 'The magnitude and limits of the possessions of the different tribes could not be determined by the lot according to the magnitude of the tribes themselves: all that could possibly be determined was the situation to be occupied by the tribe'
  - where: 'note 26:55 “By size and by lot”'
    claim: 'So each tribe might receive its portion with gratitude as assigned by God'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/26.htm'
    quote: 'in order that every tribe might receive with gratitude the possession that fell to its lot as the inheritance assigned it by God, the result of the lot being regarded by almost all nations as determined by God Himself (cf. Proverbs 16:33; Proverbs 18:18).'
  - where: 'note 26:64 “The sentence carried out”'
    claim: 'The sentence of Numbers 14:29 had been completely carried out'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/26.htm'
    quote: 'Concluding formula with the remark in Numbers 26:65, that the penal sentence which God had pronounced in Numbers 14:29 and Numbers 14:38 upon the generation which came out of Egypt, had been completely carried out.'
  - where: 'note 26:64 “The sentence carried out”'
    claim: 'Eleazar was not among those numbered and sentenced, since Levi was excepted from the first count'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/14.htm'
    quote: 'the priests do not enter into the question at all, for the tribe of Levi was excepted from the numbering in ch. 1, and therefore Aaron''s sons were not included among the persons numbered, who were sentenced to die in the wilderness.'
  - where: 'note 26:64 “The sentence carried out”'
    claim: 'The sentence at Kadesh: those numbered from twenty up fall, save Caleb and Joshua'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'all that were numbered of you, according to your whole number, from twenty years old and upward, which have murmured against me, Doubtless ye shall not come into the land … save Caleb the son of Jephunneh, and Joshua the son of Nun.'

  # ---------- christ ----------
  - where: 'christ'
    claim: 'The LORD promised at Kadesh to bring the little ones into the land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'But your little ones, which ye said should be a prey, them will I bring in, and they shall know the land which ye have despised.'
