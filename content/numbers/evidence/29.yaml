chapter: 29
claims:
  - where: 'when'
    claim: 'Israel is on the plains of Moab when the second census is taken'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'And Moses and Eleazar the priest spake with them in the plains of Moab by Jordan near Jericho, saying,'
  - where: 'when'
    claim: 'Moses speaks to Israel in the fortieth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'And it came to pass in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: 'setting'
    claim: 'Verse 40 concludes the list of sacrifices of chapters 28 and 29'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/29.htm'
    quote: 'Numbers 29:40 forms the conclusion of the list of sacrifices in ch. 28 and 29.'
  - where: 'setting'
    claim: 'The regulations for celebrating Tabernacles are in Leviticus 23; Numbers gives its offerings'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/29.htm'
    quote: 'The feast of Tabernacles, the special regulations for the celebration of which are contained in Leviticus 23:34-36 and Leviticus 23:39-43, was distinguished above all the other feasts of the year by the great number of burnt-offerings'
  - where: 'setting'
    claim: 'Numbers 28–29 is one of the festival calendars; no one could keep the law of Moses without keeping the holy days'
    key: welch-szink-festivals
    url: 'https://scripturecentral.org/archive/books/book-chapter/king-benjamins-speech-context-ancient-israelite-festivals'
    quote: 'Details concerning the celebration of each holiday are found in a number of festival calendars and instructions in the Old Testament (for example, see Exodus 23:14–17; 34:18–23; Leviticus 23; Numbers 28–29; Deuteronomy 16). Accordingly, no person could claim to keep the law of Moses and not observe these special holy days'
  - where: 'thread'
    claim: 'Tabernacles had more burnt offerings than any other feast of the year'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/29.htm'
    quote: 'was distinguished above all the other feasts of the year by the great number of burnt-offerings, which raised it into the greatest festival of joy'
  - where: 'thread'
    claim: '“Beside” means in addition to the monthly and daily offerings'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/29.htm'
    quote: 'and a sin-offering of a he-goat, "besides" (i.e., in addition to) the monthly and daily burnt-offering, meat-offering, and drink-offering.'
  - where: 'thread'
    claim: 'The eighth day''s sacrifices resemble those of the first and tenth days, and it closes the festal circle'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/29.htm'
    quote: 'so far as its sacrifices were concerned, it resembled the seventh new moon''s day and the day of atonement, and was thus shown to be the octave or close of the second festal circle'
  - where: 'thread'
    claim: 'These are the congregation''s offerings; vows and freewill offerings were those individuals or families might bring'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/29.htm'
    quote: 'The sacrifices already mentioned were to be presented to the Lord on the part of the congregation, in addition to the burnt-offerings, meat-offerings, drink-offerings, and peace-offerings which individuals or families might desire to offer either spontaneously or in consequence of vows.'
  - where: 'section 1 plain'
    claim: 'A tenth deal is a tenth of an ephah'
    key: bdb
    url: 'https://biblehub.com/hebrew/6241.htm'
    quote: 'tenth part (of ephah'
  - where: 'section 1 plain'
    claim: 'The “meat offering” is a meal or grain offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/29?lang=eng'
    quote: '“meat”: HEB meal, cereal (also vv. 6–39).'
  - where: 'section 1 plain'
    claim: '“No servile work” is no laborious work'
    key: bdb
    url: 'https://biblehub.com/hebrew/5656.htm'
    quote: 'ye shall do no laborious work Leviticus 23:7,8,21,25,35,36; Numbers 28:18,25,26; Numbers 29:1,12,35 (P)'
  - where: 'section 2 plain'
    claim: '“Afflict your souls” denoted fasting'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/29.htm'
    quote: 'ye shall afflict your souls] An expression which denoted fasting'
  - where: 'note 29:6 “Offerings on top of offerings”'
    claim: '“Beside” means in addition to; the seventh new moon''s sacrifices came in three sets: the daily lamb, the ordinary new moon''s offering, and the day''s own'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/29.htm'
    quote: 'Consequently the sacrifices presented on the seventh new moon''s day were, (1) a yearling lamb in the morning and evening, with their meat-offering and drink-offering; (2) in the morning, after the daily sacrifice, the ordinary new moon''s sacrifice, consisting of two bullocks, one ram, and seven yearling lambs'
  - where: 'note 29:6 “Offerings on top of offerings”'
    claim: 'The day''s own offering is listed third, with the sin offering'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/29.htm'
    quote: '(3) the sin-offering of the he-goat, together with the burnt-offering of one bullock, one ram, and seven yearling lambs'
  - where: 'note 29:6 “Offerings on top of offerings”'
    claim: 'The new moon offering is two bullocks, one ram and seven lambs (Num. 28:11)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/28?lang=eng'
    quote: 'And in the beginnings of your months ye shall offer a burnt offering unto the Lord; two young bullocks, and one ram, seven lambs of the first year without spot;'
  - where: 'note 29:11 “The sin offering of atonement”'
    claim: 'The phrase is an incidental reference to the ceremony of Leviticus 16'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/29.htm'
    quote: 'beside the sin offering of atonement] An incidental reference to the solemn ceremony which gave its name to the day. It is described in Leviticus 16, on which Hebrews 9:7-12; Hebrews 9:23-28 is based.'
  - where: 'note 29:11 “The sin offering of atonement”'
    claim: 'The day''s festal sacrifice resembled the first day''s and came in addition to the sin offering of Leviticus 16'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/29.htm'
    quote: 'a similar festal sacrifice was to be offered to the one presented on the seventh new moon''s day (a burnt-offering and sin-offering), in addition to the sin-offering of atonement prescribed at Leviticus 16, and the daily burnt-offerings.'
  - where: 'note 29:11 “The sin offering of atonement”'
    claim: '“Afflict your souls” denoted fasting'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/29.htm'
    quote: 'An expression which denoted fasting; cf. Numbers 30:13, Psalm 35:13, Isaiah 58:3; Isaiah 58:5.'
  - where: "note 29:12 “Burnt offerings at King Benjamin's gathering”"
    claim: 'The study reads Benjamin''s assembly in the light of the autumn festival season (New Year, Day of Atonement, Tabernacles)'
    key: welch-szink-festivals
    url: 'https://scripturecentral.org/archive/books/book-chapter/king-benjamins-speech-context-ancient-israelite-festivals'
    quote: 'we believe that it makes good sense if one understands Benjamin’s speech as taking place during the season of the year when the Nephites would have been turning their hearts and minds to the kinds of themes and concerns that characterized this time'
  - where: "note 29:12 “Burnt offerings at King Benjamin's gathering”"
    claim: 'The Book of Mormon never names the Feast of Tabernacles'
    key: welch-szink-festivals
    url: 'https://scripturecentral.org/archive/books/book-chapter/king-benjamins-speech-context-ancient-israelite-festivals'
    quote: 'While the Book of Mormon never mentions Passover, the Feast of Tabernacles, or any other religious holiday specifically by name'
  - where: "note 29:12 “Burnt offerings at King Benjamin's gathering”"
    claim: 'Numbers 29:12–34 lists the Tabernacles sacrifices; the Book of Mormon seldom mentions sacrifice, so Mosiah 2:3 is significant'
    key: welch-szink-festivals
    url: 'https://scripturecentral.org/archive/books/book-chapter/king-benjamins-speech-context-ancient-israelite-festivals'
    quote: 'The Book of Mormon has relatively few references to sacrifices and burnt offerings. … It is significant, then, that sacrifices and burnt offerings are mentioned in the prologue to King Benjamin’s address'
  - where: "note 29:12 “Burnt offerings at King Benjamin's gathering”"
    claim: 'The three other Book of Mormon mentions of sacrifice'
    key: welch-szink-festivals
    url: 'https://scripturecentral.org/archive/books/book-chapter/king-benjamins-speech-context-ancient-israelite-festivals'
    quote: 'Two are found in 1 Nephi during the journey in the wilderness from Jerusalem to the new land (see 1 Nephi 5:9; 7:22). Another is in 3 Nephi 9:19, in which the Lord commands that sacrifices and burnt offerings no longer be performed.'
  - where: "note 29:12 “Burnt offerings at King Benjamin's gathering”"
    claim: 'On that reading the day was one of covenant renewal in both Jerusalem and Zarahemla'
    key: welch-szink-festivals
    url: 'https://scripturecentral.org/archive/books/book-chapter/king-benjamins-speech-context-ancient-israelite-festivals'
    quote: 'but also in both Jerusalem and Zarahemla this day was a day of covenant renewal. In Israel, on this day the people renewed their covenant with God to be his people and to obey his laws.'
  - where: 'note 29:13 “Thirteen bullocks down to seven”'
    claim: 'Seventy oxen in all; rams and lambs double those of Passover and Pentecost, oxen fivefold'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/29.htm'
    quote: 'Whilst, therefore, the number of rams and lambs was double the number offered at the Passover and feast of Pentecost, the number of oxen was fivefold; for, instead of fourteen, there were seventy offered during the seven days.'
  - where: 'note 29:13 “Thirteen bullocks down to seven”'
    claim: 'The falling count secures seven for the last day and marks a gradual decrease in festal character'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/29.htm'
    quote: 'the arrangement being probably made for the purpose of securing the holy number seven for this last day, and indicating at the same time, through the gradual diminution in the number of sacrificial oxen, the gradual decrease in the festal character of the seven festal days'
  - where: 'note 29:13 “Thirteen bullocks down to seven”'
    claim: 'The feast followed the ingathering of fruit and vine and was to fill hearts with joy and gratitude'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/29.htm'
    quote: 'But this festival followed the completion of the ingathering of the fruits of the orchard and vineyard, and therefore was still more adapted … to fill their hearts with the greatest joy and gratitude towards the Lord and Giver of them all'
  - where: 'note 29:13 “Thirteen bullocks down to seven”'
    claim: 'A Latter-day Saint study notes the Tabernacles sacrifices outnumber those of the other feasts'
    key: welch-szink-festivals
    url: 'https://scripturecentral.org/archive/books/book-chapter/king-benjamins-speech-context-ancient-israelite-festivals'
    quote: 'These sacrifices were greater in number than those connected with the two previous celebrations.'
  - where: 'note 29:18 “By number, as it is written”'
    claim: 'Ezra''s “by number” means the burnt offerings of each day of the feast, thirteen oxen and so on, with the words of Numbers 29:18'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/3.htm'
    quote: 'means the burnt-offerings commanded for the several days of this festival, viz., on the first day thirteen oxen, on the second twelve, etc.; comp. Numbers 29:13-34, where the words כּמשׁפּט בּמספּרם, Numbers 29:18'
  - where: 'note 29:18 “By number, as it is written”'
    claim: 'At the time of that feast the temple''s foundation was not yet laid'
    key: keil-ezra
    url: 'https://biblehub.com/commentaries/kad/ezra/3.htm'
    quote: 'the sacrificial worship began from the first day of the seventh month, but that the foundation of the temple of the Lord was not yet laid.'
  - where: 'note 29:18 “By number, as it is written”'
    claim: 'Ezra 3:4 text'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ezra/3?lang=eng'
    quote: 'They kept also the feast of tabernacles, as it is written, and offered the daily burnt offerings by number, according to the custom, as the duty of every day required;'
  - where: "note 29:35 “The eighth day's assembly”"
    claim: '“Solemn assembly” is ʿatsereth, a sacred assembly; used of Lev. 23:36, Num. 29:35 and the last day of unleavened bread (Deut. 16:8)'
    key: bdb
    url: 'https://biblehub.com/hebrew/6116.htm'
    quote: '1 sacred assembly, rejected by ׳י, Isaiah 1:13 and (at Bethel, etc.) Amos 5:21; for Baal 2 Kings 10:20; Deuteronomy 16:8 (last day of Maƒƒoth), Leviticus 23:36 (P), Numbers 29:35 (P)'
  - where: "note 29:35 “The eighth day's assembly”"
    claim: 'The word does not itself imply a specially solemn assembly'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/29.htm'
    quote: 'a solemn assembly] an assembly. The Heb. word ‘aẓereth contains nothing which implies that the assembly was of a specially solemn character.'
  - where: "note 29:35 “The eighth day's assembly”"
    claim: 'The eighth day was a closing feast; its sacrifices resemble the first and tenth days'' and mark the close of the festal circle'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/29.htm'
    quote: 'The eighth day was to be azereth, a closing feast, and only belonged to the feast of Tabernacles so far as the Sabbath rest and a holy meeting of the seventh feast-day were transferred to it; … it resembled the seventh new moon''s day and the day of atonement'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'Christ entered the holy place once by His own blood (Heb. 9:12)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'Neither by the blood of goats and calves, but by his own blood he entered in once into the holy place, having obtained eternal redemption for us.'
  - where: 'christ'
    claim: 'The offering Christ asks in place of sacrifice (3 Ne. 9:20)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'And ye shall offer for a sacrifice unto me a broken heart and a contrite spirit.'
  - where: 'christ'
    claim: 'The sin offering of atonement is the ceremony of Leviticus 16, on which Hebrews 9 is based'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/29.htm'
    quote: 'An incidental reference to the solemn ceremony which gave its name to the day. It is described in Leviticus 16, on which Hebrews 9:7-12; Hebrews 9:23-28 is based.'
