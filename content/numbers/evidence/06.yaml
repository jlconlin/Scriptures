chapter: 6
claims:
  # ---------- when / setting / thread ----------
  - where: 'when'
    claim: 'The book opens at Sinai in the second year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'And the LORD spake unto Moses in the wilderness of Sinai, in the tabernacle of the congregation, on the first day of the second month, in the second year after they were come out of the land of Egypt, saying,'
  - where: 'when'
    claim: 'Israel leaves Sinai on the twentieth day of the second month of the second year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/10?lang=eng'
    quote: 'And it came to pass on the twentieth day of the second month, in the second year, that the cloud was taken up from off the tabernacle of the testimony.'
  - where: 'setting'
    claim: 'Numbers 1:1–10:10 is the preparation for leaving Sinai'
    key: bd-numbers
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/numbers?lang=eng'
    quote: '(1) 1:1–10:10, preparation for departure from Sinai.'
  - where: 'setting'
    claim: 'The blessing (6:24–26) is one of the fragments of ancient poetry in Numbers'
    key: bd-numbers
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/numbers?lang=eng'
    quote: 'The book is remarkable for the number of fragments of ancient poetry preserved in it (6:24–26; 10:35–36; 21:14–15, 17–18, 27–30).'
  - where: 'setting'
    claim: 'Nazarites named in scripture: Samson, Samuel, Amos; Numbers 6 gives the full regulations'
    key: bd-nazarite
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nazarite?lang=eng'
    quote: 'A man under a vow to abstain from wine, from any cutting of the hair, and any contact with the dead (Judg. 13:5; 16:17; 1 Sam. 1:11; Amos 2:11–12; for full regulations see Num. 6).'
  - where: 'setting'
    claim: 'Aaron blessed the people with raised hands at the first sacrifices'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/9?lang=eng'
    quote: 'And Aaron lifted up his hand toward the people, and blessed them'
  - where: 'thread'
    claim: 'A layperson could become holy for a time through the Nazarite vow'
    key: strathearn-holiness-lord
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/holiness-lord-personal-temple-worship'
    quote: 'Though generally a layperson could not share in priestly holiness (i.e., qadōš), there were avenues available for them to become qadōš, even if it was for a short period of time. For example, they could participate in a Nazarite vow.'
  - where: 'thread'
    claim: 'The Nazarite resembled the priests but had no service at the sanctuary'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/6.htm'
    quote: 'resembling the sanctified relation in which the priests stood to Jehovah, and differing from the priesthood solely in the fact that it involved no official service at the sanctuary'
  - where: 'thread'
    claim: 'The Nazarite vow as a step toward the priestly character set before the whole nation'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/6.htm'
    quote: 'a step towards the realization of the priestly character, which had been set before the whole nation as its goal at the time of its first calling (Exodus 19:5)'
  - where: 'thread'
    claim: 'The blessing as the seal on the ordering of the people'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/6.htm'
    quote: 'impressed the seal of perfection upon the whole order and organization of the people of God'
  - where: 'thread'
    claim: 'Priests abstained from wine when they went into the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/10?lang=eng'
    quote: 'Do not drink wine nor strong drink, thou, nor thy sons with thee, when ye go into the tabernacle of the congregation, lest ye die'

  - where: 'thread'
    claim: 'The Nazarite life resembled the high priest’s'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'This consecrated life bore some resemblance to that of the high priest (see Leviticus 21:10–12).'
  - where: 'thread'
    claim: 'The high priest’s crown (nēzer) was of gold'
    key: bdb
    url: 'https://biblehub.com/hebrew/5145.htm'
    quote: 'b. of high priest, הַקֹּדֶשׁ ׳נ Exodus 29:6, made of gold Exodus 39:30; Leviticus 8:9 (all P).'
  - where: 'thread'
    claim: 'The hair compared to the high priest’s diadem'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/6.htm'
    quote: 'The free growth of the hair is called, in Numbers 6:7, "the diadem of his God upon his head," like the golden diadem upon the turban of the high priest (Exodus 29:6)'
  - where: 'thread'
    claim: 'No contact with the dead, as the law for the high priest'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/6.htm'
    quote: 'not even to defile himself for his parents, or his brothers and sisters, when they died, according to the law laid down for the high priest in Leviticus 21:11.'
  - where: 'thread'
    claim: 'The wine rule compared with priests on duty'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/6.htm'
    quote: 'the Nazarite might preserve perfect clearness and temperance of mind, like the priests when engaged in their duties'
  - where: 'note 6:2 “A Nazarite: one set apart to the LORD”'
    claim: 'nāzîr: one consecrated, devoted'
    key: bdb
    url: 'https://biblehub.com/hebrew/5139.htm'
    quote: 'נָזִיר noun masculineGenesis 49:26 one consecrated, devoted'
  - where: 'note 6:2 “A Nazarite: one set apart to the LORD”'
    claim: 'Verse 2 has the noun nāzîr'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'נָזִ֔יר'
  - where: 'note 6:2 “A Nazarite: one set apart to the LORD”'
    claim: 'Samson, Samuel and John the Baptist seem to have taken such vows, or had parents who made them'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'Those who seem to have taken such vows, or had parents who made the vows for them, include Samson (see Judges 13:5), Samuel (see 1 Samuel 1:11, 28), and John the Baptist (see Luke 1:15).'
  - where: 'note 6:2 “A Nazarite: one set apart to the LORD”'
    claim: '“Days of his separation” are days of nēzer, consecration'
    key: bdb
    url: 'https://biblehub.com/hebrew/5145.htm'
    quote: 'b. in Numbers 6 (P), specifically of Nazirite consecration … ׳(כָּלֿ) יְמֵי נ Numbers 6:4; Numbers 6:8; Numbers 6:12; Numbers 6:13'
  - where: 'note 6:2 “A Nazarite: one set apart to the LORD”'
    claim: 'The verb in “separate … to vow” means make a hard vow, as in Lev. 27:2'
    key: bdb
    url: 'https://biblehub.com/hebrew/6381.htm'
    quote: '1 do a hard or difficult thing: (לִנְדֹּר) נֶדֶר ׳הפ make a hard vow Leviticus 27:2; Numbers 6:2 (compare Pi`el).'
  - where: 'note 6:24 “An old blessing, found on silver”'
    claim: 'Ketef Hinnom lies across the Hinnom Valley, the western boundary of ancient Jerusalem'
    key: pike-inscriptions
    url: 'https://scripturecentral.org/archive/books/book-chapter/israelite-inscriptions-time-jeremiah-and-lehi'
    quote: 'Ketef Hinnom, or “shoulder of Hinnom,” is located on the west side of the Hinnom Valley, which historically formed the western topographic boundary of ancient Jerusalem and served as an area for burials'
  - where: 'note 6:25 “A face that shines: the Lord at Bountiful”'
    claim: 'The Church’s footnote at 3 Ne. 19:25 points to Num. 6:25'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/19?lang=eng'
    quote: 'Num. 6:25 (23–27)'
  - where: 'note 6:27 “The name put upon Israel”'
    claim: 'The Church’s footnote at Num. 6:27 points to Mosiah 5:12'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/6?lang=eng'
    quote: '27a “name”: Deut. 28:10; Mosiah 5:12 (8–13).'

  # ---------- section plains ----------
  - where: 'section 1 plain'
    claim: '“Strong drink” is alcoholic drink; “liquor” is juice; “vine tree” is grapevine'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/6?lang=eng'
    quote: '3b “strong”: IE alcoholic drinks. … 3d “liquor”: OR juice. … 4a “vine tree”: OR grapevine.'
  - where: 'section 3 plain'
    claim: '“Meat offering” is a grain offering; “sodden” is cooked; “that his hand shall get” is what he can afford'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/6?lang=eng'
    quote: '15b “meat”: OR meal or cereal (also v. 17). … 19a “sodden”: OR cooked. … 21b “that”: IE that which he can afford to give.'

  # ---------- note 6:2 ----------
  - where: 'note 6:2 “A Nazarite: one set apart to the LORD”'
    claim: 'nāzîr: one consecrated, devoted; dedicated by vow to abstinence, no corpse, no haircut'
    key: bdb
    url: 'https://biblehub.com/hebrew/5139.htm'
    quote: 'specifically of one dedicated to ׳י by vow involving abstinence from intoxicants, from touching corpse, and from cutting hair'
  - where: 'note 6:2 “A Nazarite: one set apart to the LORD”'
    claim: 'The noun comes from the verb nāzar, “separate”'
    key: strongs-concordance
    url: 'https://biblehub.com/hebrew/5139.htm'
    quote: 'from nazar; separate, i.e. Consecrated'
  - where: 'note 6:2 “A Nazarite: one set apart to the LORD”'
    claim: 'Verse 2 has the noun nāzîr and, in “to separate themselves,” the verb of the same root'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'לְ/הַזִּ֖יר'
  - where: 'note 6:2 “A Nazarite: one set apart to the LORD”'
    claim: 'Usually voluntary and for a limited time, of man or woman; Samson exceptionally from birth'
    key: bdb
    url: 'https://biblehub.com/hebrew/5139.htm'
    quote: 'Nazirite: אֱלּהִים ׳נ God''s devotee, of Samson Judges 13:5,7; Judges 16:17 (exceptionally, from birth); usually voluntary Amos 2:11,12, and for limited time, compare ׳נֶדֶר נ Numbers 6:2 (of man or woman'
  - where: 'note 6:2 “A Nazarite: one set apart to the LORD”'
    claim: 'The vow might be lifelong or for a short period'
    key: bd-nazarite
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nazarite?lang=eng'
    quote: 'The vow might be lifelong, or for a short, definite period.'
  - where: 'note 6:2 “A Nazarite: one set apart to the LORD”'
    claim: 'A Nazarite had nothing to do with Nazareth'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'A Nazarite was a man or woman who took a voluntary vow to separate his life for the service of the Lord, or to live consecrated unto Him (see Keil and Delitzsch, Commentary, 1:3:34). Being a Nazarite had nothing to do with coming from the town of Nazareth.'
  - where: 'note 6:2 “A Nazarite: one set apart to the LORD”'
    claim: '“Nazarene” means belonging to Nazareth, said of Jesus'
    key: bd-nazarene
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/nazarene?lang=eng'
    quote: 'Belonging to Nazareth. Used of Jesus (Matt. 2:23).'
  - where: 'note 6:2 “A Nazarite: one set apart to the LORD”'
    claim: 'John the Baptist would drink neither wine nor strong drink'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/luke/1?lang=eng'
    quote: 'For he shall be great in the sight of the Lord, and shall drink neither wine nor strong drink; and he shall be filled with the Holy Ghost, even from his mother’s womb.'

  # ---------- note 6:4 ----------
  - where: 'note 6:4 “The whole vine, not only the wine”'
    claim: 'Vinegar, grapes and raisins are not intoxicating; the ban reaches beyond temperance'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/6.htm'
    quote: 'Vinegar, fresh and dried grapes, and food prepared from grapes and raisins, e.g., raisin-cakes, are not intoxicating'
  - where: 'note 6:4 “The whole vine, not only the wine”'
    claim: 'The ban is more than keeping a clear mind like priests on duty'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/6.htm'
    quote: 'The design of this prohibition can hardly have been, merely that, by abstaining from intoxicating drink, the Nazarite might preserve perfect clearness and temperance of mind, like the priests when engaged in their duties'
  - where: 'note 6:4 “The whole vine, not only the wine”'
    claim: 'The vine’s fruit stood for all sensual enjoyment'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/6.htm'
    quote: 'The Nazarite was to avoid everything that proceeded from the vine, because its fruit was regarded as the sum and substance of all sensual enjoyments.'
  - where: 'note 6:4 “The whole vine, not only the wine”'
    claim: 'Priests abstained only when going into the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/10?lang=eng'
    quote: 'Do not drink wine nor strong drink, thou, nor thy sons with thee, when ye go into the tabernacle of the congregation, lest ye die'

  # ---------- note 6:7 ----------
  - where: 'note 6:7 “His hair was his crown”'
    claim: 'nēzer means consecration, crown, Naziriteship'
    key: bdb
    url: 'https://biblehub.com/hebrew/5145.htm'
    quote: 'נֵ֫זֶר noun masculinePsalm 132:18 consecration, crown, Naziriteship'
  - where: 'note 6:7 “His hair was his crown”'
    claim: 'The same word is the high priest’s gold crown'
    key: bdb
    url: 'https://biblehub.com/hebrew/5145.htm'
    quote: 'b. of high priest, הַקֹּדֶשׁ ׳נ Exodus 29:6, made of gold Exodus 39:30; Leviticus 8:9 (all P).'
  - where: 'note 6:7 “His hair was his crown”'
    claim: 'In Numbers 6 the “head of consecration” is so called because of the unshorn hair; in 6:19 the word is the hair itself'
    key: bdb
    url: 'https://biblehub.com/hebrew/5145.htm'
    quote: '׳ראֹשׁ נ (because of unshorn hair) Numbers 6:9; Numbers 6:18; Numbers 6:18 … in Numbers 6:19 ׳נ = the hair of his consecration'
  - where: 'note 6:7 “His hair was his crown”'
    claim: 'The hair is the diadem of his God, like the high priest’s'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/6.htm'
    quote: 'The free growth of the hair is called, in Numbers 6:7, "the diadem of his God upon his head," like the golden diadem upon the turban of the high priest (Exodus 29:6)'
  - where: 'note 6:7 “His hair was his crown”'
    claim: 'The hair worn in the Lord’s honor as a sign he belonged to the Lord'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/6.htm'
    quote: 'which the Nazarite wore in honour of the Lord, as a sign that he "belonged to the Lord, and dedicated himself to His service," with all his vital powers.'
  - where: 'note 6:7 “His hair was his crown”'
    claim: 'No contact with the dead even for parents, as the law for the high priest in Lev. 21:11'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/6.htm'
    quote: 'he was to approach no dead person during that time, not even to defile himself for his parents, or his brothers and sisters, when they died, according to the law laid down for the high priest in Leviticus 21:11.'

  # ---------- note 6:12 ----------
  - where: 'note 6:12 “An accident starts the count again”'
    claim: '“By him” means in his neighbourhood; involuntary defilement; shaving on the seventh day of purification'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/6.htm'
    quote: 'But if any one died suddenly in a moment "by him" (עליו, in his neighbourhood), and he therefore involuntarily defiled his consecrated head, he was to shave his head on the day of his purification, i.e., on the seventh day (see Numbers 19:11'
  - where: 'note 6:12 “An accident starts the count again”'
    claim: 'The days “fall”: they are not counted, and the whole term begins again'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/6.htm'
    quote: 'the days that were before were "to fall," i.e., the days of consecration that had already elapsed were not to be reckoned … He was therefore to commence the whole time of his consecration entirely afresh'
  - where: 'note 6:12 “An accident starts the count again”'
    claim: 'The trespass offering as recompense for being reinstated'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/6.htm'
    quote: 'as a payment or recompense for being reinstated in the former state of consecration, from which he had fallen through his defilement'
  - where: 'note 6:12 “An accident starts the count again”'
    claim: '“Shall be lost” is the Hebrew verb “fall”'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'יִפְּל֔וּ'

  # ---------- note 6:18 ----------
  - where: 'note 6:18 “The hair given to the fire”'
    claim: 'Putting the hair in the altar fire gives the Lord the hair worn in His honor'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/6.htm'
    quote: 'and thus hand over and sacrifice to the Lord the hair of his head which had been worn in honour of Him.'
  - where: 'note 6:18 “The hair given to the fire”'
    claim: 'Wine again, probably at the sacrificial meal'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/6.htm'
    quote: '"After that the Nazarite may drink wine" (again), probably at the sacrificial meal, after the Lord had received His share of the sacrifice, and his release from consecration had thus been completed.'
  - where: 'note 6:18 “The hair given to the fire”'
    claim: 'Later custom: the better off paid the sacrifices of poor Nazarites (Acts 21:24)'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/6.htm'
    quote: 'From this the custom afterwards grew up, that when poor persons took the Nazarite''s vow upon them, those who were better off defrayed the expenses of the sacrifices (Acts 21:24'
  - where: 'note 6:18 “The hair given to the fire”'
    claim: 'Acts 18:18–19 and 21:23–26 seem related to the vow'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: '(Two instances in the New Testament that seem related to this vow taking are recorded in Acts 18:18–19 and 21:23–26.)'
  - where: 'note 6:18 “The hair given to the fire”'
    claim: 'Paul pays for the men, they shave, and he enters the temple to mark the end of the days'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/acts/21?lang=eng'
    quote: 'Them take, and purify thyself with them, and be at charges with them, that they may shave their heads'

  # ---------- note 6:24 ----------
  - where: 'note 6:24 “An old blessing, found on silver”'
    claim: 'Three lines of two members, each second member applying the first, rising in emphasis'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/6.htm'
    quote: 'consisted of a triple blessing of two members each, which stood related to each other thus: The second in each case contained a special application of the first to the people, and the three gradations unfolded the substance of the blessing step by step with ever increasing emphasis.'
  - where: 'note 6:24 “An old blessing, found on silver”'
    claim: 'The blessing is a fragment of ancient poetry'
    key: bd-numbers
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/numbers?lang=eng'
    quote: 'The book is remarkable for the number of fragments of ancient poetry preserved in it (6:24–26;'
  - where: 'note 6:24 “An old blessing, found on silver”'
    claim: 'Two silver rolls found in 1979 at Ketef Hinnom, a burial area'
    key: pike-inscriptions
    url: 'https://scripturecentral.org/archive/books/book-chapter/israelite-inscriptions-time-jeremiah-and-lehi'
    quote: 'Two small rolls of inscribed silver foil were discovered in 1979, along with a number of other items dating from the end of the First Temple period through the Second Temple period, in a secondary bone repository'
  - where: 'note 6:24 “An old blessing, found on silver”'
    claim: 'Dated about 600 BC; worn around the neck as amulets'
    key: pike-inscriptions
    url: 'https://scripturecentral.org/archive/books/book-chapter/israelite-inscriptions-time-jeremiah-and-lehi'
    quote: 'these two inscribed rolls date to about 600 BC. From wear patterns, each of these silver rolls had apparently been worn on a cord, apparently around someone’s neck, as an amulet or charm.'
  - where: 'note 6:24 “An old blessing, found on silver”'
    claim: 'The text is remarkably similar to Numbers 6:24–26'
    key: pike-inscriptions
    url: 'https://scripturecentral.org/archive/books/book-chapter/israelite-inscriptions-time-jeremiah-and-lehi'
    quote: 'It is remarkably similar to the Aaronic priestly blessing contained in Numbers 6:24–26, although not completely rendered.'
  - where: 'note 6:24 “An old blessing, found on silver”'
    claim: 'Amulet 2 reads the first line and part of the others'
    key: pike-inscriptions
    url: 'https://scripturecentral.org/archive/books/book-chapter/israelite-inscriptions-time-jeremiah-and-lehi'
    quote: 'May YHWH bless you and keep you. … May YHWH make his face shine [upon] you and give you peace'
  - where: 'note 6:24 “An old blessing, found on silver”'
    claim: 'The oldest known attestation of a biblical passage in its original language'
    key: pike-inscriptions
    url: 'https://scripturecentral.org/archive/books/book-chapter/israelite-inscriptions-time-jeremiah-and-lehi'
    quote: 'they preserve the oldest known attestation of a form of a biblical passage in its original language'
  - where: 'note 6:24 “An old blessing, found on silver”'
    claim: 'The amulets personalize a blessing first spoken over the congregation'
    key: pike-inscriptions
    url: 'https://scripturecentral.org/archive/books/book-chapter/israelite-inscriptions-time-jeremiah-and-lehi'
    quote: 'they provide evidence of the personalization of a blessing, which according to Numbers 6 was originally pronounced by the priests over the congregation of Israel, in an apparent effort to invoke divine protection against evil influences.'

  # ---------- note 6:25 ----------
  - where: 'note 6:25 “A face that shines: the Lord at Bountiful”'
    claim: 'Both expressions can mean divine approval, or a smile'
    key: sc-knowhy-212
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-allude-to-the-priestly-blessing-in-numbers-6'
    quote: 'Both of these expressions can be understood to mean that God would show His divine approval towards His covenant people, or that He would “smile” upon them, as Jesus did to the people gathered at the temple in Bountiful.'
  - where: 'note 6:25 “A face that shines: the Lord at Bountiful”'
    claim: 'Some modern translations render both clauses “may the Lord smile on you”'
    key: sc-knowhy-212
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-allude-to-the-priestly-blessing-in-numbers-6'
    quote: 'it is notable that some modern translations of both clauses found in Numbers 6 have rendered them as "may the Lord smile on you."'
  - where: 'note 6:25 “A face that shines: the Lord at Bountiful”'
    claim: 'Jesus acted as the great high priest'
    key: sc-knowhy-212
    url: 'https://scripturecentral.org/knowhy/why-did-jesus-allude-to-the-priestly-blessing-in-numbers-6'
    quote: 'Jesus was acting then as the great high priest (see Hebrews 4:14–16), come to bless this remnant of the house of Israel.'
  - where: 'note 6:25 “A face that shines: the Lord at Bountiful”'
    claim: 'He was gracious and gave peace, as the blessing promised'
    key: sc-knowhy-212
