chapter: 20
claims:
  - where: 'when'
    claim: 'Aaron died on mount Hor in the fortieth year after the Exodus, the first day of the fifth month'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'And Aaron the priest went up into mount Hor at the commandment of the Lord, and died there, in the fortieth year after the children of Israel were come out of the land of Egypt, in the first day of the fifth month.'

  - where: 'setting'
    claim: 'After the revolt at Kadesh the people were condemned to wander for 38 years'
    key: bd-kadesh
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/kadesh?lang=eng'
    quote: 'On their return, a revolt broke out, and as a punishment the people were condemned by God to wander for 38 years.'
  - where: 'setting'
    claim: 'Aaron died in the fortieth year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'in the fortieth year after the children of Israel were come out of the land of Egypt'
  - where: 'setting'
    claim: 'One older reading: the year of 20:1 is not stated but can only be the year in which the forty years of the sentence ended'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/20.htm'
    quote: 'The year is not mentioned in Numbers 20:1, but, according to Numbers 14:32., it can only be the year with which the forty years of the sentence that they should die out in the wilderness came to an end'
  - where: 'setting'
    claim: 'The time near Kadesh was a spiritual incubator for the rising generation, and most of the adult generation died then'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'functioned as a “spiritual incubator” in which the rising generation of the Israelites could mature. And it was during this interval that most of the adult generation of the Israelites who had left Egypt died.'
  - where: 'setting'
    claim: 'The book''s last portion begins at 20:28 and covers the final year or so'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Numbers 20:28–36:13 constitutes the third and last major portion of the book, relating events during the final year or so of the Israelites’ forty years in the wilderness.'

  - where: 'setting'
    claim: 'Moses did not describe the thirty-eight years in the record'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'thirty-eight years of wandering had transpired. For reasons not known to us now, Moses did not describe those years in this record.'
  - where: 'thread'
    claim: '“Sanctify” (v. 12) and “was sanctified” (v. 13) are forms of qadash'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'וַ/יִּקָּדֵ֖שׁ'
  - where: 'thread'
    claim: 'Kadesh is a place name glossed “sacred”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6946.htm'
    quote: 'II. קָדֵשׁ proper name, of a location (sacred'
  - where: 'thread'
    claim: 'The Church''s chapter heading names the four events'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'Miriam dies—Moses smites a rock at Meribah and brings forth water—The king of Edom refuses to let Israel pass peacefully through his land—Aaron dies, and Eleazar becomes the high priest.'
  - where: 'thread'
    claim: 'Numbers 10–20 recount rebellions against Jehovah and Moses, in chapters 16 and 20'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'accounts of subsequent Israelite rebellions against Jehovah and Moses (chapters 16, 20), and the death of Miriam (20:1).'

  - where: 'section 1 plain'
    claim: '“Chode” means contended'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'OR contended (also v. 13, for “strove”).'
  - where: 'section 2 plain'
    claim: '“Tabernacle of the congregation” is in Hebrew the tent of meeting'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'HEB tent of meeting.'
  - where: 'section 2 plain'
    claim: 'The verb rendered “sanctify” means to make holy'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/6942.htm'
    quote: 'qadash: To consecrate, sanctify, set apart, make holy'
  - where: 'section 3 plain'
    claim: '“By me” is in Hebrew through my land'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'HEB through me (i.e., through my land).'
  - where: 'section 4 plain'
    claim: '“Coast” is in Hebrew border'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'HEB border.'

  - where: 'note 20:3 “The brethren who died before the LORD”'
    claim: 'One older reading: the brethren are those who died one by one during the thirty-seven years'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/20.htm'
    quote: 'the reference is to those who had died one by one during the thirty-seven years'
  - where: 'note 20:3 “The brethren who died before the LORD”'
    claim: 'A Latter-day Saint reading: the people had lost kin as Moses and Aaron had lost their sister; the wish may have come from true sorrow'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'In desperation, the people wish they had died along with their lost kin. There is a parallel here with Moses and Aaron, who had lost their sister.'
  - where: 'note 20:3 “The brethren who died before the LORD”'
    claim: 'The wish may have sprung from true sorrow and mourning'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'may have sprung from true sorrow and mourning'
  - where: 'note 20:3 “The brethren who died before the LORD”'
    claim: 'The same words were spoken after the spies'' report'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'Would God that we had died in the land of Egypt! or would God we had died in this wilderness!'

  - where: 'note 20:9 “Which rod Moses took”'
    claim: 'A Latter-day Saint reading: it was Aaron''s rod, by which the Lord showed that Aaron and Levi were chosen'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'This is Aaron’s rod with which the Lord had shown the children of Israel that Aaron and the tribe of Levi had been chosen to serve in the tabernacle'
  - where: 'note 20:9 “Which rod Moses took”'
    claim: 'The same reading infers that Moses entered the most holy place, showing his priesthood surpasses Aaron''s'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'Moses must have entered into the most holy place after speaking with the Lord. This event conveys how Moses’s priesthood surpasses Aaron’s.'
  - where: 'note 20:9 “Which rod Moses took”'
    claim: 'One older reading: the rod of the miracles in Egypt, laid up in the sanctuary, not Aaron''s'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/20.htm'
    quote: 'the rod with which he had performed miracles in Egypt (Exodus 17:5), and which was laid up in the sanctuary, not Aaron''s rod which blossomed'
  - where: 'note 20:9 “Which rod Moses took”'
    claim: 'The Church''s footnote to “rod” in verse 8 points to Ex. 4:20'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'See JST Gen. 50:34 (Appendix). Ex. 4:20.'

  - where: 'note 20:12 “What Moses did at Meribah”'
    claim: 'Scripture Helps: Moses was told to speak, struck the rock twice, and with Aaron failed to give credit to the Lord'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'Additionally, Moses and Aaron failed to give credit to the Lord for this miracle. Before Moses struck the rock, he asked, “Must we fetch you water out of this rock?”'
  - where: 'note 20:12 “What Moses did at Meribah”'
    claim: 'The Lord chastened Moses and Aaron for straying from His instructions'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'The Lord chastened Moses and Aaron for straying from his instructions'
  - where: 'note 20:12 “What Moses did at Meribah”'
    claim: 'A Latter-day Saint reading: the instructions came in order, and Moses changed the order'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'gather the people, and speak to the rock to produce water, in that order. Moses, on the other hand, takes the rod, gathers the people, speaks to the people, and then strikes the rock.'
  - where: 'note 20:12 “What Moses did at Meribah”'
    claim: 'Had Moses spoken, the rock would have shown itself more obedient than the people'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'If Moses had spoken to the rock, it would have obediently produced water, showing that the rock was more obedient than the people.'
  - where: 'note 20:12 “What Moses did at Meribah”'
    claim: 'The instructions came by direct communication, so the prophet''s punishment was greater'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'These instructions were received in the tabernacle through direct communication with the Lord. As prophet, punishment for his actions was greater.'
  - where: 'note 20:12 “What Moses did at Meribah”'
    claim: 'One older reading: not distrust of God''s power, but a momentary wavering of assurance'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/20.htm'
    quote: 'It was simply the want of full believing confidence, a momentary wavering of that immovable assurance, which the two heads of the nation ought to have shown to the congregation, but did not show.'
  - where: 'note 20:12 “What Moses did at Meribah”'
    claim: 'The words to the people were fitted to strengthen their unbelief'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/20.htm'
    quote: 'words which, if they did not express any doubt in the help of the Lord, were certainly fitted to strengthen the people in their unbelief'
  - where: 'note 20:12 “What Moses did at Meribah”'
    claim: 'Aaron shared the fault because he did nothing to prevent it'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/20.htm'
    quote: 'Aaron also wavered along with Moses, inasmuch as he did nothing to prevent Moses'' fall.'
  - where: 'note 20:12 “What Moses did at Meribah”'
    claim: '“Rebels” in verse 10 is a form of marah'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'הַ/מֹּרִ֔ים'
  - where: 'note 20:12 “What Moses did at Meribah”'
    claim: '“Ye rebelled” in verse 24 is the same verb'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'מְרִיתֶ֥ם'
  - where: 'note 20:12 “What Moses did at Meribah”'
    claim: 'marah means to rebel, be disobedient'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/4784.htm'
    quote: 'marah: To rebel, be disobedient, be contentious'

  - where: 'note 20:13 “Kadesh, where the LORD was sanctified”'
    claim: 'qadash means to consecrate, sanctify, set apart, make holy'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/6942.htm'
    quote: 'qadash: To consecrate, sanctify, set apart, make holy'
  - where: 'note 20:13 “Kadesh, where the LORD was sanctified”'
    claim: '“To sanctify me” in verse 12 is a form of qadash'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'לְ/הַ֨קְדִּישֵׁ֔/נִי'
  - where: 'note 20:13 “Kadesh, where the LORD was sanctified”'
    claim: 'Kadesh is a place name glossed “sacred”'
    key: bdb
    url: 'https://biblehub.com/hebrew/6946.htm'
    quote: 'II. קָדֵשׁ proper name, of a location (sacred'
  - where: 'note 20:13 “Kadesh, where the LORD was sanctified”'
    claim: 'One older reading: God shamed their unbelief with the water and punished Moses and Aaron'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/20.htm'
    quote: 'He put their unbelief to shame by the miraculous gift of water, and on the other hand punished Moses and Aaron for the weakness of their faith.'
  - where: 'note 20:13 “Kadesh, where the LORD was sanctified”'
    claim: 'The same commentary conjectures the place took the name Kadesh from chapter 14 or from this day'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/20.htm'
    quote: 'the place in question received the name of Kadesh first of all from that tragical occurrence (Numbers 14), or possibly from the murmuring of the congregation on account of the want of water, which led Moses and Aaron to sin'
  - where: 'note 20:13 “Kadesh, where the LORD was sanctified”'
    claim: 'The Church''s footnote glosses Meribah as quarrel, strife, contention'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'IE Quarrel, Strife, Contention.'
  - where: 'note 20:13 “Kadesh, where the LORD was sanctified”'
    claim: 'One older reading: Rephidim and Kadesh were different events; at Kadesh the mediators sinned'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/20.htm'
    quote: 'In Rephidim, God gave the people water out of the rock, and the murmuring of the people was stayed. In Kadesh, God no doubt relieved the distress in the same way; but the mediators of His mercy, Moses and Aaron, sinned at the time'

  - where: 'note 20:14 “Edom, the brother who would not let Israel pass”'
    claim: 'Edom descended from Esau; Edomites and Israelites were cousins'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'Edom, both a land and a people, descended from Esau (see Genesis 36:1). Edomites and Israelites were cousins'
  - where: 'note 20:14 “Edom, the brother who would not let Israel pass”'
    claim: 'The king''s highway was the public high road kept up for the king and his armies (Keil, as the manual prints him)'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'The ‘king’s way’ is the public high road, which was probably made at the cost of the state, and kept up for the king and his armies to travel upon'
  - where: 'note 20:14 “Edom, the brother who would not let Israel pass”'
    claim: 'The highway ran along the highlands of Jordan from the Red Sea to Syria'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'The highway ran along the highlands of present-day Jordan from the Red Sea up into Syria.'
  - where: 'note 20:14 “Edom, the brother who would not let Israel pass”'
    claim: 'A Latter-day Saint reading: given Israel''s complaints about fruit and water, the king had reason to doubt the promise'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'The people had been walking through the desert and had complained more than once about the lack of both fruit (Numbers 11:5; 20:5) and water'
  - where: 'note 20:14 “Edom, the brother who would not let Israel pass”'
    claim: 'The king had every reason to doubt'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'The king had every reason to doubt that the people would not eat or drink anything in their path.'
  - where: 'note 20:14 “Edom, the brother who would not let Israel pass”'
    claim: 'The same reading: the second offer left out the grapes and strayed from Moses'' terms, as Moses had not followed the Lord''s words exactly'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'This decision to not mention grapes or payment for their consumption came entirely from the messengers, straying from the original instructions.'
  - where: 'note 20:14 “Edom, the brother who would not let Israel pass”'
    claim: 'Moses had not followed the Lord''s words exactly, and the messengers almost repeat it'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'In previous verses, Moses had not followed the Lord’s words exactly, and this action is almost repeated as his mes­sengers do not follow the prophet’s instructions.'

  - where: 'note 20:26 “Aaron’s garments put on Eleazar”'
    claim: 'The older commentary quoted in the Student Manual calls the transfer investing and the removal divesting'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'was called investing or investment, (clothing;) as removing a person from an office was termed divesting or unclothing.'
  - where: 'note 20:26 “Aaron’s garments put on Eleazar”'
    claim: 'The manual: Aaron was not retiring in dishonor'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'Aaron, however, was not retiring in dishonor or disgrace.'
  - where: 'note 20:26 “Aaron’s garments put on Eleazar”'
    claim: 'Eleazar was Aaron''s third son, and the high priests until the Maccabees descended from him except Eli to Abiathar'
    key: bd-eleazar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/eleazar?lang=eng'
    quote: 'Third son of Aaron (Ex. 6:23); admitted to priestly office (Ex. 28:1).'
  - where: 'note 20:26 “Aaron’s garments put on Eleazar”'
    claim: 'All the high priests until the Maccabean period descended from Eleazar, except Eli to Abiathar'
    key: bd-eleazar
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/eleazar?lang=eng'
    quote: 'All the high priests until the Maccabean period were descended from Eleazar, with the exception of those from Eli to Abiathar, inclusive'
  - where: 'note 20:26 “Aaron’s garments put on Eleazar”'
    claim: 'A Latter-day Saint reading: the change took place on the mountain, a natural temple, perhaps because of the risk of a dead body in the tabernacle'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'The risk of having a dying and perhaps dead body in the tabernacle may have been the reason for performing the change of garments on a mountain top, a natural temple.'
  - where: 'note 20:26 “Aaron’s garments put on Eleazar”'
    claim: 'Aaron''s death, unlike Moses'', was seen by all'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'In contrast to Moses, whose location of death or translation is unknown (see Deuteronomy 34:5–6), Aaron’s death is seen by all the congregation.'
  - where: 'note 20:26 “Aaron’s garments put on Eleazar”'
    claim: 'Aaron died in the fortieth year, first day of the fifth month, at 123'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'And Aaron was an hundred and twenty and three years old when he died in mount Hor.'

  - where: 'christ'
    claim: 'Moses was not disqualified from future responsibilities; the Lord took him; he gave keys on the mount and in this dispensation'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'Although the scriptures do not fully explain the reasons for this consequence, Moses’s actions did not disqualify him from all future responsibilities and blessings. The Book of Mormon teaches that at the end of Moses’s life, “the Lord took Moses unto himself.”'
  - where: 'christ'
    claim: 'Moses and Aaron failed to give credit to the Lord for the miracle'
    key: scripture-helps-num
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/17-numbers-11-14-20-24-27?lang=eng'
    quote: 'Moses and Aaron failed to give credit to the Lord for this miracle.'
