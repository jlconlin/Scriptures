chapter: 24
claims:
  - where: 'setting'
    claim: 'Balaam was bribed by Balak, king of Moab, to curse Israel; the curse turned to blessing in chapters 23–24; later scripture returns to him'
    key: bd-balaam
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/balaam?lang=eng'
    quote: 'bribed by Balak, king of Moab, to curse the Israelites, Num. 22:5–18; his life saved by means of the ass, 22:22–35; the curse turned to blessing, 23–24; Deut. 23:4–5; Josh. 24:9–10; Neh. 13:2; his counsel, Num. 31:16; slain, 31:8'
  - where: 'setting'
    claim: 'Balak took Balaam to a third observation point and repeated the altars and offerings; an emphasis on the number three'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Balak then took Balaam to a third observation point, and the same procedure of offerings on altars was repeated (there is an emphasis on the number three in the larger Balaam narrative).'
  - where: 'setting'
    claim: 'The oracles of Balaam are written in Archaic Biblical Hebrew, the oldest stage of the language'
    key: sc-knowhy-853
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-contain-poems-in-the-middle-of-stories'
    quote: 'the Oracles of Balaam (Numbers 23–24), the Song of Moses (Deuteronomy 32), and some of the Psalms (such as Psalm 68) are all written in this earliest stage of the language.'
  - where: 'setting'
    claim: 'Archaic Biblical Hebrew likely dates from 1000 BC at the latest'
    key: sc-knowhy-853
    url: 'https://scripturecentral.org/knowhy/why-does-the-old-testament-contain-poems-in-the-middle-of-stories'
    quote: 'All this evidence suggests that Archaic Biblical Hebrew is much older than some might suppose, likely dating from 1000 BC at the latest.'
  - where: 'thread'
    claim: 'Balak dismissed Balaam, who in response cursed Balak; hired to curse, he blessed Israel and cursed Balak; then he went home'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Ironically, Balaam was hired by Balak to curse the Israelites, but Balaam ended up blessing them and cursing Balak. Following pronouncements of curses on the Amalekites, Kenites, and others, Balaam returned to his home (24:20–25).'
  - where: 'thread'
    claim: 'The third oracle is the climax: those who bless or curse Israel will be blessed or cursed (Milgrom, as Pike prints him)'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'This [third] oracle is the climactic one: In the first, only God determines blessing and curse (23:8); in the second, God’s blessing cannot be revoked (23:20); in this, the third, those who bless or curse Israel will themselves be blessed or cursed [24:9].'
  - where: 'thread'
    claim: 'The last prophecy is divided into four sayings by the fourfold “he took up his parable”: Edom and Moab, Amalek, the Kenites, the world powers'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/24.htm'
    quote: 'This prophecy is divided into four different prophecies by the fourfold repetition of the words, "he took up his parable" (Numbers 24:15, Numbers 24:20, Numbers 24:21, and Numbers 24:23).'
  - where: 'thread'
    claim: 'Balaam was later slain among the Midianites and gave counsel against Israel'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/31?lang=eng'
    quote: 'Balaam also the son of Beor they slew with the sword. … these caused the children of Israel, through the counsel of Balaam, to commit trespass against the Lord in the matter of Peor'
  - where: 'section 1 plain'
    claim: 'Plain-words rendering of 24:5 follows a modern translation as Pike prints it (“fair,” “encampments”)'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'How fair are your tents, O Jacob, … your encampments, O Israel!'
  - where: 'section 1 plain'
    claim: 'The Church footnote at 24:7: Hebrew, water shall flow from his branches'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/24?lang=eng'
    quote: '7a “He”: HEB Water shall flow from his branches.'

  - where: 'section 1 plain'
    claim: 'A modern translation as Pike prints it renders the “unicorn” of 24:8 as a wild ox'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'is like the horns of a wild ox for him;'
  - where: 'section 3 plain'
    claim: 'A modern translation as Pike prints it renders “smite the corners of Moab” as crush the borderlands of Moab'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'it shall crush the borderlands of Moab,'
  - where: 'note 24:2 “The Spirit instead of omens”'
    claim: 'Balaam’s altars, sacrifices, elevated vantage points and looking for omens can be read as divination'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'his requests for Balak to provide altars and sacrifices, Balaam’s movement to elevated vantage points, and his efforts to “look for omens” (Numbers 24:1) can all be interpreted as part of his divinatory activities'
  - where: 'note 24:2 “The Spirit instead of omens”'
    claim: 'Balak wanted a curse, not a forecast; cursing manipulates the future against an adversary'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Cursing is different from just divining the future; cursing involves manipulating the future against an adversary.'
  - where: 'note 24:2 “The Spirit instead of omens”'
    claim: 'Calling Balaam a prophet rests in part on 24:2–3; earlier the LORD put a word in his mouth, a figure of speech for prophecy'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'This designation is based in part on the fact that after failing twice to curse the Israelites, Balaam abandoned his previous actions, and “then the spirit of God came upon him, and he uttered his [third] oracle” (Numbers 24:2–3).'
  - where: 'note 24:2 “The Spirit instead of omens”'
    claim: 'Latter-day Saints, with Jethro (D&C 84:6), are open to Jehovah working through non-Israelites'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'So Latter-day Saints are open to understanding how Jehovah had worked through other non-Israelites in the eastern Mediterranean region.'
  - where: 'note 24:2 “The Spirit instead of omens”'
    claim: 'The title prophet is never used of Balaam in Numbers 22–24'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Why is it then that commentators often describe Balaam not only as a diviner but also as a prophet, especially since this title is never explicitly used in reference to him in Numbers 22–24?'
  - where: 'note 24:2 “The Spirit instead of omens”'
    claim: 'Jethro, Moses’ Midianite father-in-law, held the Melchizedek Priesthood and conferred it on Moses'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'the non-Israelite Jethro, Moses’s Midianite father-in-law who Latter-day Saints believe held the Melchizedek Priesthood that he later conferred upon Moses (Doctrine and Covenants 84:6)'
  - where: 'note 24:3 “Eyes open, or eyes closed?”'
    claim: 'The Hebrew verb is dubious; read either “opened of [mental] eye” or “closed of [bodily] eye”; only in 24:3, 15'
    key: bdb
    url: 'https://biblehub.com/hebrew/8365.htm'
    quote: '[שָׁתַם] verb dubious; if text correct, open … Numbers 24:3,15 (poems in J E) the man opened of [mental] eye, so ᵑ6 Ki Ew and others RVm; ᵑ9 Rö Ke Di and others render closed of [bodily] eye'
  - where: 'note 24:3 “Eyes open, or eyes closed?”'
    claim: 'Closed: eyes closed in a trance; opened: the eyes of the mind; the word is very doubtful'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/24.htm'
    quote: 'The word rendered ‘closed’ is very doubtful; and ‘opened’ (R.V. marg.) is no less questionable. With the former rendering the reference is to the eyes closed in a trance; with the latter, to the eyes of the mind opened to receive the vision.'
  - where: 'note 24:3 “Eyes open, or eyes closed?”'
    claim: 'One older reading: the outer senses closed while the inner opened'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/24.htm'
    quote: 'Balaam describes himself as the man with closed eye with reference to his state of ecstasy, in which the closing of the outer senses went hand in hand with the opening of the inner'
  - where: 'note 24:3 “Eyes open, or eyes closed?”'
    claim: 'The language of 24:4 is the language of seership, a significant development since Balaam could not see the angel his donkey saw'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'At this point in the narrative, Balaam’s claim to “see” the things of God comes as a significant development because earlier Balaam could not see the Lord’s angel right in front of him, even when his donkey could (22:23–31).'
  - where: 'note 24:3 “Eyes open, or eyes closed?”'
    claim: 'The episode shows the LORD can speak through whomever he chooses; prophetic pronouncements come by divine, not human, inclination'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'The biblical Balaam episode reiterates that prophetic pronouncements come via divine not human inclination.'

  - where: 'note 24:7 “Higher than Agag”'
    claim: 'One older reading: Agag is the title of Amalekite kings in general, like Pharaoh'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/24.htm'
    quote: 'Agag (עגג, the fiery) is not the proper name of the Amalekite king defeated by Saul (1 Samuel 15:8), but the title (nomen dignitatis) of the Amalekite kings in general, just as all the Egyptian kings had the common name of Pharaoh'
  - where: 'note 24:7 “Higher than Agag”'
    claim: 'If Agag is Saul’s captive, the poem is at least as late as the monarchy; LXX and Samaritan read Gog; unsolved'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/24.htm'
    quote: 'If Agag is the man who was captured by Saul, the present poem must be at least as late as the monarchy. Some indeed have supposed, from the present passage, that Agag was a title applied to all Amalekite kings … LXX. and Samar. read ‘Gog,’ … The passage is at present an unsolved problem.'
  - where: 'note 24:7 “Higher than Agag”'
    claim: 'Agag in the days of Saul'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: 'And he took Agag the king of the Amalekites alive, and utterly destroyed all the people with the edge of the sword.'

  - where: 'note 24:9 “The promise to Abraham, in a stranger’s mouth”'
    claim: 'The third oracle ends in language reminiscent of the Abrahamic covenant'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Balaam poetically expressed a third prophetic pronouncement on the Israelites, blessing them and concluding with language reminiscent of the Abrahamic covenant (mentioned above): “Blessed is everyone who blesses you [Israel], and cursed is everyone who curses you” (24:2–9).'
  - where: 'note 24:9 “The promise to Abraham, in a stranger’s mouth”'
    claim: 'Based on Gen 12:2–3, God did not permit others to curse Israel collectively, though they could bring curses on themselves'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Based on the promise in Genesis 12:2–3, the Israelites’ God did not permit others to curse them collectively (although he obviously allowed them to bring curses upon themselves).'
  - where: 'note 24:11 “Kept back from honour”'
    claim: 'Elder Maxwell: discipleship may keep the honors of the world from us, citing Balak to Balaam'
    key: maxwell-tugs
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2000/10/the-tugs-and-pulls-of-the-world?lang=eng'
    quote: 'Actually, discipleship may keep the honors of the world from us. As Balak told Balaam, “I thought to promote thee unto great honour; but, lo, the Lord hath kept thee back from honour” (Num. 24:11–12).'
  - where: 'note 24:11 “Kept back from honour”'
    claim: 'Elder Maxwell: those once flattered by the world are used, despised and discarded, like Judas'
    key: maxwell-tugs
    url: 'https://www.churchofjesuschrist.org/study/general-conference/2000/10/the-tugs-and-pulls-of-the-world?lang=eng'
    quote: 'The rouge of recognition is so easily smeared anyway. We wince as we watch those once flattered by the world, like Judas, being used, despised, and discarded'
  - where: 'note 24:11 “Kept back from honour”'
    claim: 'Elder Neal A. Maxwell taught from the Balaam story in general conference, the only such address in a hundred years'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Balaam was mentioned only once in a formal general conference address during the past one hundred years.[80] Elder Neal A. Maxwell employed the story of Balaam when he taught in October 2000'
  - where: 'note 24:11 “Kept back from honour”'
    claim: 'Balak repeats his promise of honour; Balaam repeats that he speaks only what the LORD commands'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'The king tells Balaam to leave, reminding the soothsayer one last time that he would have promoted him “unto great honour” had the Lord not been involved. Balaam too repeats not only that he is bound to speak what the Lord commands'

  - where: 'note 24:17 “A Star out of Jacob”'
    claim: 'The Church’s chapter heading reads 24:17 as a prophecy of the Messiah'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/24?lang=eng'
    quote: 'Balaam sees in vision and prophesies of the destiny of Israel—He prophesies of the Messiah: There will come a Star out of Jacob, and a Sceptre will rise out of Israel.'
  - where: 'note 24:17 “A Star out of Jacob”'
    claim: 'Elder McConkie calls it a great Messianic prophecy, given while the Spirit rested on Balaam'
    key: mcconkie-balaam
    url: 'https://www.churchofjesuschrist.org/study/new-era/1972/04/the-story-of-a-prophets-madness?lang=eng'
    quote: 'Then, while the Spirit still rested upon him, Balaam gave this great Messianic prophecy: “I shall see him, but not now: I shall behold him, but not nigh: there shall come a Star out of Jacob, and a Sceptre shall rise out of Israel.”'
  - where: 'note 24:17 “A Star out of Jacob”'
    claim: 'The passage prophesies Israel’s domination of Moab and Edom, accomplished when the star and sceptre rise'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'This poetic passage not only prophesies a future Israelite military domination of Moab and its southern neighbor Edom (also known as Seir in the Bible) but also indicates this domination will be accomplished when “a star comes out of Jacob, and a scepter shall rise out of Israel” (24:17).'
  - where: 'note 24:17 “A Star out of Jacob”'
    claim: 'Qumran read the star as the priestly messiah and the sceptre as the royal; Bar Kokhba; Christians read David as partial fulfillment and ultimately Christ (Rev 22:16)'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'members of the Dead Sea community at Qumran understood this passage as referring to the two eschatological messiahs, the priestly messiah (the “star”) and the royal Davidic messiah (the “scepter”).'
  - where: 'note 24:17 “A Star out of Jacob”'
    claim: 'Bar Kosiba called Bar Kokhba, son of the star; Christians read David as partial fulfillment and Christ as the priestly and royal Messiah'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'referred to Simon bar Kosiba—leader of the unsuccessful second Jewish revolt against the Roman Empire (AD 132–135)—as Simon bar Kokhba (“son of the star”) … Christians have understood not only David as partial fulfillment of this prophecy (according to 2 Samuel 8:2, David defeated the Moabites) but ultimately Jesus Christ as the priestly and royal Messiah (Revelation 22:16).'
  - where: 'note 24:17 “A Star out of Jacob”'
    claim: 'One older reading: the sceptre of Jacob’s blessing, Gen 49:10'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/24.htm'
    quote: 'The sceptre, which was introduced as a symbol of dominion even in Jacob''s blessing (Genesis 49:10), is employed here as the figurative representation and symbol of the future ruler in Israel.'
  - where: 'note 24:17 “A Star out of Jacob”'
    claim: 'One older reading: the prophecy is not fully accomplished in David’s victories but in the final overthrow of the enemies of the kingdom of God; the star is the Messiah'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/24.htm'
    quote: 'cannot have received its complete fulfilment in the victories of David over these enemies of Israel; but will only be fully accomplished in the future overthrow of all the enemies of the kingdom of God.'
  - where: 'note 24:17 “A Star out of Jacob”'
    claim: 'The Hebrew of 24:14 “in the latter days” is the phrase of Gen 49:1'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/24.htm'
    quote: 'what this people will do to thy people at the end of the days." … On "the end of the days," see at Genesis 49:1.'

  - where: 'note 24:17 “A Star out of Jacob”'
    claim: 'One older reading: the star a natural symbol of imperial greatness; the parallel sceptre removes doubt that it is a ruler'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/24.htm'
    quote: '"A star is so natural an image and symbol of imperial greatness and splendour, that it has been employed in this sense in almost every nation.'
  - where: 'note 24:17 “A Star out of Jacob”'
    claim: 'One older reading: the parallel sceptre removes any doubt that the star is a ruler'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/24.htm'
    quote: 'If, however, there could be any doubt that the rising star represented the appearance of a glorious ruler or king, it would be entirely removed by the parallel, "a sceptre arises out of Israel."'
  - where: 'note 24:17 “A Star out of Jacob”'
    claim: 'One older reading: fulfillment began with David’s subjugation of Edom'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/24.htm'
    quote: 'The fulfilment of this prophecy commenced with the subjugation of the Edomites by David (2 Samuel 8:14; 1 Kings 11:15-16; 1 Chronicles 18:12-13), but it will not be completed till "the end of the days,"'
  - where: 'note 24:17 “A Star out of Jacob”'
    claim: 'Some Jews read 24:17 as messianic from the last centuries BC'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Evidence exists from as early as the last few centuries BC that at least some Jews considered Numbers 24:17 to be a messianic passage.'
  - where: 'note 24:17 “The children of Sheth”'
    claim: 'A modern translation as Pike prints it: “the Shethites”; the crushing of Moab’s borderlands'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'it shall crush the borderlands of Moab,'
  - where: 'note 24:17 “The children of Sheth”'
    claim: 'Pike’s rendering of the second line'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'and the territory of all the Shethites.'
  - where: 'note 24:17 “The children of Sheth”'
    claim: 'One older reading: not Seth, since mankind is never called by Seth’s name; “sons of confusion,” the Moabites; Jeremiah 48:45 renders it'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/24.htm'
    quote: 'כּל־בּני־שׁת does not mean "all the sons of Seth," i.e., all mankind, as the human race is never called by the name of Seth … It signifies rather "all the sons of confusion,"'
  - where: 'note 24:17 “The children of Sheth”'
    claim: 'One older reading: the Moabites as men of warlike confusion; Jer 48:45 renders it correctly'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/24.htm'
    quote: 'the Moabites are to be understood as being men of wild, warlike confusion. שׁת is a contraction of שׁאת (Lamentations 3:47), and derived from שׁאה; and in Jeremiah 48:45 it is correctly rendered שׁאון בּני.'
  - where: 'note 24:17 “The children of Sheth”'
    claim: 'Jeremiah 48:45 takes up the line'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/jer/48?lang=eng'
    quote: 'and shall devour the corner of Moab, and the crown of the head of the tumultuous ones.'

  - where: 'note 24:20 “Amalek, the Kenites, and the ships of Chittim”'
    claim: 'Amalek a constant foe; the Kenites friends and relatives of Moses taken by Asshur; Chittim is Cyprus; Eber’s identity debated'
    key: ot-minute-num
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-numbers'
    quote: 'The Kenites were friends and relatives of Moses (see Judges 1:16; 4:11) but would be taken by the people of Asshur (Asshurim). Chittim is the island of Cyprus, whose people would afflict the Asshurim and Eber. The identity of Eber has been debated'
  - where: 'note 24:20 “Amalek, the Kenites, and the ships of Chittim”'
    claim: 'Amalek attacked Israel first at Rephidim; Saul spared the Kenites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-sam/15?lang=eng'
    quote: 'And Saul said unto the Kenites, Go, depart, get you down from among the Amalekites, lest I destroy you with them: for ye shewed kindness to all the children of Israel, when they came up out of Egypt.'

  - where: 'christ'
    claim: 'Christians read the star ultimately as Jesus Christ, priestly and royal Messiah (Rev 22:16)'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'but ultimately Jesus Christ as the priestly and royal Messiah (Revelation 22:16).'
  - where: 'christ'
    claim: 'God did not permit others to curse Israel collectively, though he allowed them to bring curses upon themselves'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'the Israelites’ God did not permit others to curse them collectively (although he obviously allowed them to bring curses upon themselves).'
  - where: 'explore'
    claim: 'Pike’s article treats Balaam’s roles, the oracles, 24:17 and Balaam elsewhere in scripture'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'A messianic prophecy in Numbers 24? Following Balaam’s failure to curse Israel as Balak had requested, Balak angrily dismissed Balaam (Numbers 24:10–13).'
  - where: 'note 24:20 “Amalek, the Kenites, and the ships of Chittim”'
    claim: 'Amalek is “first” as the first heathen nation to fight Israel (one older reading)'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/24.htm'
    quote: 'but as the first heathen nation which opened the conflict of the heathen nations against Israel as the people of God (see at Exodus 17:8.).'
  - where: 'note 24:20 “Amalek, the Kenites, and the ships of Chittim”'
    claim: 'One older reading: the overthrow of the last world power belongs to the end of the days; Daniel received revelation on it'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/24.htm'
    quote: 'The overthrow of this last power of the world, concerning which the prophet Daniel was the fist to receive and proclaim new revelations, belongs to "the end of the days," in which the star out of Jacob is to rise upon Israel as a "bright morning star" (Revelation 22:16).'
