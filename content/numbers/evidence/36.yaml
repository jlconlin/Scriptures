chapter: 36
claims:
  - where: 'when'
    claim: 'Moses speaks to Israel in the land of Moab in the fortieth year'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'in the fortieth year, in the eleventh month, on the first day of the month, that Moses spake unto the children of Israel'
  - where: 'setting'
    claim: 'Israel is in Moab in the fortieth year (Deut. 1:3, 5)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/1?lang=eng'
    quote: 'On this side Jordan, in the land of Moab, began Moses to declare this law'
  - where: 'when'
    claim: 'The fortieth year after the Exodus (Aaron''s death)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/33?lang=eng'
    quote: 'And Aaron the priest went up into mount Hor at the commandment of the Lord, and died there, in the fortieth year after the children of Israel were come out of the land of Egypt, in the first day of the fifth month.'
  - where: 'setting'
    claim: 'The laws from Num. 33:50 to 36:13 form a group, and verse 13 concludes the book (the last law in Numbers)'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/36.htm'
    quote: 'The conclusion refers not merely to the laws and rights contained in Numbers 33:50-36:13, but includes the rest of the laws given in the steppes of Moab (ch. 25-30), and forms the conclusion tot he whole book'
  - where: 'setting'
    claim: 'Chapter 35 gives cities for the Levites, six of them cities of refuge'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/35?lang=eng'
    quote: 'And among the cities which ye shall give unto the Levites there shall be six cities for refuge, which ye shall appoint for the manslayer'
  - where: 'setting'
    claim: 'Gilead was a clan of Manasseh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'Of the sons of Manasseh: of Machir, the family of the Machirites: and Machir begat Gilead: of Gilead come the family of the Gileadites.'
  - where: 'setting'
    claim: 'The daughters receive their inheritance in Joshua''s day among the brethren of their father in Manasseh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/josh/17?lang=eng'
    quote: 'And they came near before Eleazar the priest, and before Joshua the son of Nun, and before the princes, saying, The Lord commanded Moses to give us an inheritance among our brethren.'
  - where: 'thread'
    claim: 'The clan founded its appeal on the LORD''s command to divide the land by lot, understanding each tribe''s portion to continue unchanged'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/36.htm'
    quote: 'They founded their appeal upon the command of Jehovah, that the land was to be distributed by lot among the Israelites for an inheritance … they understood it as signifying that the portion assigned to each tribe was to continue unchanged to all generations.'
  - where: 'thread'
    claim: 'The daughters'' first request was granted: they speak right'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/27?lang=eng'
    quote: 'The daughters of Zelophehad speak right: thou shalt surely give them a possession of an inheritance among their father’s brethren'
  - where: 'note 36:1 “Zelophehad''s own clan asks”'
    claim: 'Gilead founded the family of the Gileadites in Manasseh'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'Of the sons of Manasseh: of Machir, the family of the Machirites: and Machir begat Gilead: of Gilead come the family of the Gileadites.'
  - where: 'note 36:1 “Zelophehad''s own clan asks”'
    claim: 'The speakers are heads of the fathers'' houses of the clan of Gilead; their concern was the tribe''s territory'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/36.htm'
    quote: 'the heads of the fathers'' houses … of the family of Gilead the Manassite, to which Zelophehad (Numbers 26:33) belonged, to the effect that, by allotting an hereditary possession to the daughters of Zelophehad, the tribe-territory assigned to the Manassites would be diminished if they should marry into another tribe.'
  - where: 'note 36:1 “Zelophehad''s own clan asks”'
    claim: '“Brother” means tribe-mate'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/36.htm'
    quote: 'Now, as the inheritance of their brother, i.e., their tribe-mate Zelophehad, had been given to his daughters'
  - where: 'note 36:4 “Why the jubilee would make the loss permanent”'
    claim: 'At the jubilee land that had changed hands reverted to the family of the original settlement'
    key: bd-jubilee-year-of
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jubilee-year-of?lang=eng'
    quote: 'In it land that had changed hands, except in non-Levitical walled cities, reverted to the family to which it had belonged at the original settlement'
  - where: 'note 36:4 “Why the jubilee would make the loss permanent”'
    claim: 'The jubilee would not return land inherited by another tribe; it would pass through the female line and be permanently severed from Manasseh'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/36.htm'
    quote: 'But the law of Jubile would not affect the cases in which land was inherited by persons of another tribe. It would, indeed, be inherited by descendants of Zelophehad in the female line, but this would not prevent it from being permanently severed from the tribe of Manasseh.'
  - where: 'note 36:4 “Why the jubilee would make the loss permanent”'
    claim: 'Until the jubilee the land might return through a childless marriage or purchase; after it the transfer was permanent'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/36.htm'
    quote: 'But up to the year of jubilee it was always possible that the hereditary property might revert to the tribe of Manasseh, either through the marriage being childless, or through the purchase of the inheritance. … In this way the transfer of an inheritance from one tribe to another, which took place in consequence of a marriage, would be established in perpetuity.'
  - where: 'note 36:4 “Why the jubilee would make the loss permanent”'
    claim: 'The jubilee law is in Leviticus 25 (the Church''s footnote at 36:4)'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/36?lang=eng'
    quote: '“jubilee”: Lev. 25:11 (1–55).'
  - where: 'note 36:5 ““Said well” and “speak right””'
    claim: 'Num. 36:5 reads kēn … dōbərîm (masculine participle)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'דֹּבְרִֽים'
  - where: 'note 36:5 ““Said well” and “speak right””'
    claim: 'Num. 27:7 reads kēn … dōbərōt (feminine participle)'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'דֹּבְרֹת֒'
  - where: 'note 36:5 ““Said well” and “speak right””'
    claim: 'kēn means “right,” used with verbs of speaking, at both Num. 27:7 and 36:5'
    key: bdb
    url: 'https://biblehub.com/hebrew/3651.htm'
    quote: '1 right, usually indecl., often as substantive a right thing, especially with vbb. dicendi Exodus 10:29 (J) כֵּן דִּבַּרְתָּ, Numbers 27:7 כֵּן דֹּבְרֹת, Numbers 36:5 (both P)'
  - where: 'note 36:5 ““Said well” and “speak right””'
    claim: 'Moses took the first case before the LORD'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/27?lang=eng'
    quote: 'And Moses brought their cause before the Lord.'
  - where: 'note 36:6 “Free to choose, within the tribe”'
    claim: 'They might marry whoever pleased them, but a Manassite; extended in vv. 8–9 to every heiress'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/36.htm'
    quote: 'he told the daughters of Zelophehad that they might marry whoever pleased them … but that he must belong to the family of their father''s tribe, that is to say, must be a Manassite. … This is afterwards extended, in Numbers 36:8 and Numbers 36:9, into a general law for every heiress in Israel.'
  - where: 'note 36:6 “Free to choose, within the tribe”'
    claim: 'The law of ch. 27 might be annulled if they married into other tribes; the supplementary law closes that'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/36.htm'
    quote: 'But it was realised that that law might, after all, be annulled if they were married to persons of other tribes. Here, therefore, the supplementary law is issued, forbidding them to do so.'
  - where: 'note 36:6 “Free to choose, within the tribe”'
    claim: 'A woman''s land would become the joint property of her husband, and another tribe would get it'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'If a portion of land was given to a single woman and she married into another tribe, which was probably quite common, then the woman’s land would become the joint property of her husband. Thus, another tribe would get a portion of the land assigned by the Lord and Moses to the original tribe.'
  - where: 'note 36:11 “Married to their cousins”'
    claim: 'The five married the sons of their paternal uncles'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/36.htm'
    quote: '11. In accordance with the law, the five women were married to the sons of their paternal uncles.'
  - where: 'note 36:11 “Married to their cousins”'
    claim: 'In Num. 26:33 the names come with Tirzah last'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'the names of the daughters of Zelophehad were Mahlah, and Noah, Hoglah, Milcah, and Tirzah.'
  - where: 'note 36:11 “Married to their cousins”'
    claim: 'In Num. 27:1 the names come with Tirzah last'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/27?lang=eng'
    quote: 'and these are the names of his daughters; Mahlah, Noah, and Hoglah, and Milcah, and Tirzah.'
  - where: 'note 36:13 “The close of the laws given in Moab”'
    claim: 'Verse 13 covers the laws since 33:50 and those of chs. 25–30, and sets the lawgiving in Moab beside that at Sinai'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/36.htm'
    quote: 'The conclusion refers not merely to the laws and rights contained in Numbers 33:50-36:13, but includes the rest of the laws given in the steppes of Moab (ch. 25-30), and forms the conclusion tot he whole book, which places the lawgiving in the steppes of Moab by the side of the lawgiving at Mount Sinai'
  - where: 'note 36:13 “The close of the laws given in Moab”'
    claim: 'The end of Numbers is not the real end of the journey, which comes after Moses'' farewell in Deuteronomy and Joshua''s leading them into Canaan'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'But the end of the book of Numbers is not the real “end” of the Israelites’ journey. This comes only after Moses’s farewell (in Deuteronomy) and Joshua’s leading them into Canaan (in Joshua).'
  - where: 'note 36:13 “The close of the laws given in Moab”'
    claim: 'Israel is still east of the Jordan, in the plains of Moab'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/36?lang=eng'
    quote: 'These are the commandments and the judgments, which the Lord commanded by the hand of Moses unto the children of Israel in the plains of Moab by Jordan near Jericho.'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'note 36:1 “Zelophehad''s own clan asks”'
    claim: 'Zelophehad was the son of Hepher, the son of Gilead; the daughters stood at the door of the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/27?lang=eng'
    quote: 'the daughters of Zelophehad, the son of Hepher, the son of Gilead'
  - where: 'note 36:1 “Zelophehad''s own clan asks”'
    claim: 'The daughters stood before Moses and the princes by the door of the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/27?lang=eng'
    quote: 'by the door of the tabernacle of the congregation'
  - where: 'note 36:4 “Why the jubilee would make the loss permanent”'
    claim: 'The jubilee returned purchased land (and so not land inherited by another tribe)'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/36.htm'
    quote: 'In the year of Jubile, i.e. every fiftieth year, all purchased land returned to its original owners, or their descendants.'
  - where: 'note 36:4 “Why the jubilee would make the loss permanent”'
    claim: 'At the jubilee alienated land returned to its original proprietor or his heir, fixing the transfer'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/36.htm'
    quote: 'But in the year of jubilee all landed property that had been alienated was to return to its original proprietor or his heir (Leviticus 25:33.).'
  - where: 'note 36:4 “Why the jubilee would make the loss permanent”'
    claim: 'Strictly, the property passed at once at the marriage'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/36.htm'
    quote: 'Strictly speaking, the hereditary property would pass at once, when the marriage took place, to the tribe into which an heiress married, and not merely at the year of jubilee.'
