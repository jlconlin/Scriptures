chapter: 4
claims:
  - where: 'when'
    claim: 'Numbers 1:1–10:11 relates the last weeks at Sinai'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'Numbers 1:1–10:11 relates events during the Israelites’ final weeks at Mount Sinai'

  - where: 'setting'
    claim: 'At Sinai Israel had covenanted with the Lord and built the tabernacle by divine design'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'where the Israelites had entered into a covenant relationship with him, and where they had then constructed the tabernacle according to divine design (Exodus 18–40)'

  - where: 'setting'
    claim: 'The book is named for its countings; the Levites are counted in chapters 3–4 and 26'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'In chapters 1 and 26 the Israelite men capable of military action are numbered, and the Levites are numbered in chapters 3–4 and 26.'

  - where: 'setting'
    claim: 'Kohath, Levi''s second son, is probably named first because of his grandsons Moses and Aaron and because his descendants bore the sacred furniture'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'Kohath seems to have been the second son of Levi (see Numbers 3:17), but was probably mentioned first because of his grandsons Moses and Aaron and also because his male descendants were the bearers of the sacred furniture of the tabernacle'

  - where: 'setting'
    claim: 'Moses and Aaron were sons of Amram, son of Kohath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/6?lang=eng'
    quote: 'And Amram took him Jochebed his father’s sister to wife; and she bare him Aaron and Moses'

  - where: 'setting'
    claim: 'Amram was a son of Kohath'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/6?lang=eng'
    quote: 'And the sons of Kohath; Amram, and Izhar, and Hebron, and Uzziel'

  - where: 'thread'
    claim: 'Holiness in the tabernacle came in levels; the most holy place was separated from the holy place by a veil'
    key: strathearn-holiness-lord
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/holiness-lord-personal-temple-worship'
    quote: 'Holiness, however, was not a one-dimensional state, where you were either in a state of holiness or you were not. Rather, there were levels of holiness.'

  - where: 'thread'
    claim: 'The ark was wrapped first in the veil between the holy place and the most holy'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/4.htm'
    quote: 'Aaron and his sons were to take down the curtain between the holy place and the most holy (see Exodus 26:31), and to cover the ark of testimony with it'

  - where: 'thread'
    claim: 'One older reading: the Kohathites'' load on the march was six packages, and only the ark had a coloured cloth outside, which made it conspicuous'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/4.htm'
    quote: 'The Ark is the only piece of furniture that has a coloured cloth over the water-proof covering; this would make it a conspicuous object on the march'

  - where: 'thread'
    claim: 'The finished load seen as six packages'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/4.htm'
    quote: 'When finally ready for the march the burden of the Kohathites would be seen simply as six large packages as follows.'

  - where: 'note 4:3 “Thirty here, twenty-five and twenty elsewhere”'
    claim: 'David gave the reason for counting Levites from twenty: they would no longer carry the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/23?lang=eng'
    quote: 'And also unto the Levites; they shall no more carry the tabernacle, nor any vessels of it for the service thereof.'

  - where: 'note 4:3 “Thirty here, twenty-five and twenty elsewhere”'
    claim: 'David first counted the Levites from thirty'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/23?lang=eng'
    quote: 'Now the Levites were numbered from the age of thirty years and upward'

  - where: 'note 4:3 “Thirty here, twenty-five and twenty elsewhere”'
    claim: 'One older reading: carrying needed a grown man of thirty; lighter duties from twenty-five; David counted from twenty because carrying had ceased'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/8.htm'
    quote: 'The transport of the tabernacle required the strength of a full-grown man, and therefore the more advanced age of thirty years; whereas the duties connected with the tabernacle when standing were of a lighter description, and could easily be performed from the twenty-fifth year'

  - where: 'note 4:3 “Thirty here, twenty-five and twenty elsewhere”'
    claim: 'Another older reading: the three ages are the customs of three periods'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/4.htm'
    quote: 'The statements appear to represent the customs that were current at three different periods.'

  - where: 'note 4:3 “Thirty here, twenty-five and twenty elsewhere”'
    claim: 'The word rendered “host” generally means warfare or host; this use of it is unusual, found only in Numbers 4 and 8:24 f.'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/4.htm'
    quote: 'This unusual meaning of the word which generally denotes ‘warfare’ or ‘host’'

  - where: 'note 4:3 “Thirty here, twenty-five and twenty elsewhere”'
    claim: 'It may imply the Levites were an organized body, as Israel was numbered for war'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/4.htm'
    quote: 'It perhaps implies that the Levites formed an organized body appointed for God’s work under the command of superior officials, as were the rest of Israel who were numbered for war.'

  - where: 'note 4:3 “Thirty here, twenty-five and twenty elsewhere”'
    claim: 'The Hebrew word rendered “host” signifies military service'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/4.htm'
    quote: '(Angl. ''host'') signifies military service, and is used here with special reference to the service of the Levites as the militia sacra of Jehovah.'

  - where: 'note 4:15 “Carried but never touched”'
    claim: 'The Church''s footnote reads “any holy thing” as the sanctuary''s, particularly the ark'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/4?lang=eng'
    quote: 'IE of the sanctuary (more particularly the ark).'

  - where: 'note 4:15 “Carried but never touched”'
    claim: 'The Church''s footnote on “touch” points to Uzza in 1 Chronicles 13:10'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/4?lang=eng'
    quote: '1 Chr. 13:10.'

  - where: 'note 4:15 “Carried but never touched”'
    claim: 'At the second attempt the Levites carried the ark on their shoulders with the staves, as Moses commanded'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/15?lang=eng'
    quote: 'And the children of the Levites bare the ark of God upon their shoulders with the staves thereon, as Moses commanded according to the word of the Lord.'

  - where: 'note 4:20 “Not even for a moment”'
    claim: 'The Hebrew kə-ballaʿ, “as a swallowing,” means “for an instant”'
    key: bdb
    url: 'https://biblehub.com/hebrew/1104.htm'
    quote: '1 swallow Numbers 4:20 (כְּבַלַּע as a swallowing = for an instant)'

  - where: 'note 4:20 “Not even for a moment”'
    claim: 'A modern translation of 4:20: not to look on the holy things even for a moment'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers%204&version=NRSVUE'
    quote: 'But the Kohathites must not go in to look on the holy things even for a moment, or they will die.'

  - where: 'note 4:20 “Not even for a moment”'
    claim: 'A modern translation of 4:18: do not let the Kohathites be destroyed'
    key: nrsvue
    url: 'https://www.biblegateway.com/passage/?search=Numbers%204&version=NRSVUE'
    quote: 'You must not let the tribe of the clans of the Kohathites be destroyed from among the Levites.'

  - where: 'christ'
    claim: 'The Student Manual notes the Levites began at thirty, the age at which the Savior began His ministry'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'The sons of Levi began their ministry in the tabernacle, at the age of thirty, the same age as the Savior was when He began His earthly ministry'

  - where: 'christ'
    claim: 'Hebrews reads the first tabernacle as a sign that the way into the holiest was not yet open'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/9?lang=eng'
    quote: 'The Holy Ghost this signifying, that the way into the holiest of all was not yet made manifest, while as the first tabernacle was yet standing'
