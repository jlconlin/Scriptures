chapter: 3
claims:
  - where: 'when'
    claim: 'The book''s first part is set at Sinai in the second year after the Exodus'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'And the LORD spake unto Moses in the wilderness of Sinai, in the tabernacle of the congregation, on the first day of the second month, in the second year after they were come out of the land of Egypt'
  - where: 'setting'
    claim: 'Numbers 1:1–10:10 is the preparation for departure from Sinai, and the book''s notices fall especially in the second year after the Exodus'
    key: bd-numbers
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/numbers?lang=eng'
    quote: 'It contains notices of events in the wilderness, more especially in the second year after the Exodus, and at the close of the wandering, interspersed with legislation. (1) 1:1–10:10, preparation for departure from Sinai.'
  - where: 'setting'
    claim: 'In the camp of chapter 2 the Levites were in the middle'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'The tribes were deployed in four groups of three tribes. … In the middle were the Levites.'
  - where: 'setting'
    claim: 'Chronicles keeps the three sons of Levi as the divisions of the Levites'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/23?lang=eng'
    quote: 'And David divided them into courses among the sons of Levi, namely, Gershon, Kohath, and Merari.'
  - where: 'setting'
    claim: 'Chronicles divides the priests between the houses of Eleazar and Ithamar'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/24?lang=eng'
    quote: 'Among the sons of Eleazar there were sixteen chief men of the house of their fathers, and eight among the sons of Ithamar according to the house of their fathers.'
  - where: 'thread'
    claim: 'Aaron''s descendants were the priests; the other Levites assisted and could not perform the ordinances'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'Descendants of Aaron were designated as priests, and they were the ones given the stewardship to preside in the ordinances of the tabernacle. The other Levites assisted in maintaining the tabernacle and its services, but they could not actually perform the ordinances'
  - where: 'thread'
    claim: 'Moses, Aaron and his sons camped in the favored place before the entrance'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'Although all the Levites camped around the tabernacle, Aaron and his sons, along with Moses, were placed in the favored position directly in front of the tabernacle entrance (see v. 38).'
  - where: 'thread'
    claim: 'The Levites camped around the tabernacle so that there be no wrath on the congregation'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'But the Levites shall pitch round about the tabernacle of testimony, that there be no wrath upon the congregation of the children of Israel'
  - where: 'section 1 plain'
    claim: 'The chapter falls into the generations of Aaron (1–4), the Levites appointed (5–10), the substitution (11–13), the families (14–20), their duties (21–39) and the redemption (40–51)'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/3.htm'
    quote: 'Numbers 3:1-4. The ‘generations’ of Aaron, Numbers 3:5-10. The appointment of the Levites to be servants of the priests. Numbers 3:11-13. The Levites are a substitute for the first-born … vv14-20. A summary of the Levitical families'
  - where: 'section 6 plain'
    claim: '"Odd" in verse 48 means the excess'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/3?lang=eng'
    quote: 'OR excess.'
  - where: 'note 3:1 “Why Aaron comes before Moses”'
    claim: '"Generations" marks a fresh start and means an account of a man and his descendants; Aaron precedes because the passage deals with his descendants'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/3.htm'
    quote: 'It marks a fresh start in the history. ‘Generations,’ lit. origins, means ‘an account of a man and his genealogical descendants.’ … Moses is usually mentioned first, but here Aaron has the precedence because the passage deals with his descendants only.'
  - where: 'note 3:1 “Why Aaron comes before Moses”'
    claim: 'Moses'' sons were reckoned among the tribe of Levi'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/23?lang=eng'
    quote: 'Now concerning Moses the man of God, his sons were named of the tribe of Levi.'
  - where: 'note 3:1 “Why Aaron comes before Moses”'
    claim: 'One older reading: Aaron''s sons received the priesthood while Moses'' sons were classed with the Levites; the generations are the Levitical families named after the two heads of the tribe'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/3.htm'
    quote: 'because they were both of them raised into the position of heads or spiritual fathers of the whole tribe … because his sons received the priesthood, whilst the sons of Moses, on the contrary, were classed among the rest of the Levitical families'
  - where: 'note 3:4 “Why the verse says they had no children”'
    claim: 'Chronicles says that because Nadab and Abihu had no children, Eleazar and Ithamar executed the priest''s office'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/1-chr/24?lang=eng'
    quote: 'But Nadab and Abihu died before their father, and had no children: therefore Eleazar and Ithamar executed the priest’s office.'
  - where: 'note 3:4 “Why the verse says they had no children”'
    claim: 'Aaron''s garments were put on Eleazar at Aaron''s death'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/20?lang=eng'
    quote: 'And Moses stripped Aaron of his garments, and put them upon Eleazar his son; and Aaron died there in the top of the mount'
  - where: 'note 3:10 “Who “the stranger” is”'
    claim: 'The Church''s footnote glosses the stranger as the unauthorized person who presumes to officiate'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/3?lang=eng'
    quote: 'IE the unauthorized person who presumes to officiate.'
  - where: 'note 3:10 “Who “the stranger” is”'
    claim: 'At Numbers 1:51 the warning keeps those who are not Levites from the tabernacle'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'the Levites shall take it down: and when the tabernacle is to be pitched, the Levites shall set it up: and the stranger that cometh nigh shall be put to death.'
  - where: 'note 3:10 “Who “the stranger” is”'
    claim: 'Numbers 16:40 defines the stranger as one not of the seed of Aaron, with Korah as the example'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'that no stranger, which is not of the seed of Aaron, come near to offer incense before the LORD; that he be not as Korah, and as his company'
  - where: 'note 3:10 “Who “the stranger” is”'
    claim: 'Korah was a Levite who sought the priesthood'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/16?lang=eng'
    quote: 'And he hath brought thee near to him, and all thy brethren the sons of Levi with thee: and seek ye the priesthood also?'
  - where: 'note 3:10 “Who “the stranger” is”'
    claim: 'The Levites were given to Aaron that there be no plague when Israel came near the sanctuary'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/8?lang=eng'
    quote: 'that there be no plague among the children of Israel, when the children of Israel come nigh unto the sanctuary.'
  - where: 'note 3:12 “Why the Levites took the place of the firstborn”'
    claim: 'The firstborn were at first to serve in a priestly role at the tabernacle; the tribe of Levi later filled it alone'
    key: scripture-helps-ex-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng'
    quote: 'Originally, the firstborn male from each family was to serve in a priestly role in the tabernacle. Later, the tribe of Levi exclusively filled that role (see Numbers 3:12).'
  - where: 'note 3:12 “Why the Levites took the place of the firstborn”'
    claim: 'One older reading: the exchange gave the service of the sanctuary to one devoted tribe'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/3.htm'
    quote: 'the nation was required to dedicate to Him its first-born sons for service at the sanctuary … through which the care of the service at the sanctuary was transferred to one tribe, which would and should henceforth devote itself with undivided interest to this vocation'
  - where: 'note 3:12 “Why the Levites took the place of the firstborn”'
    claim: 'The same reading finds the reason for choosing Levi in its defence of the Lord at the golden calf'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/3.htm'
    quote: 'Moreover, the Levites had proved themselves to be the most suitable of all the tribes for his post, through their firm and faithful defence of the honour of the Lord at the worship of the golden calf (Exodus 32:26.).'
  - where: 'note 3:12 “Why the Levites took the place of the firstborn”'
    claim: 'The Levites'' cattle were set against the firstlings without being counted head for head'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/3.htm'
    quote: 'the cattle of the Levites were also set against the first-born of the cattle of the tribes of Israel, though without their being numbered and exchanged head for head'
  - where: 'note 3:12 “Why the Levites took the place of the firstborn”'
    claim: 'Chapter 8: the Levites are wholly given to the LORD instead of the firstborn and then given to Aaron'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/8?lang=eng'
    quote: 'For they are wholly given unto me from among the children of Israel; instead of such as open every womb, even instead of the firstborn of all the children of Israel, have I taken them unto me.'
  - where: 'note 3:12 “Why the Levites took the place of the firstborn”'
    claim: 'The Hebrew of "wholly given" in verse 9 is "given, given"; in chapter 8 they are given first to Jehovah and by Him to the priests'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/3.htm'
    quote: 'In Numbers 8:16-19, it is explained that they are first given to Jehovah, and by Him given to the priests; cf. Numbers 18:6. … The Heb. rendered ‘wholly given’ is nethûnîm nethûnîm. i.e. ‘given, given.’'
  - where: 'note 3:12 “Why the Levites took the place of the firstborn”'
    claim: 'The Hebrew of verse 9 repeats the participle "given"'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'נְתוּנִ֨ם נְתוּנִ֥ם'
  - where: 'note 3:15 “Why the Levites were counted from a month old”'
    claim: 'The month-old count corresponds to the firstborn'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/3.htm'
    quote: '15. from, a month old] to correspond with the firstborn (see Numbers 3:40).'
  - where: 'note 3:15 “Why the Levites were counted from a month old”'
    claim: 'The other tribes were counted from twenty, the men able to go to war'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/1?lang=eng'
    quote: 'From twenty years old and upward, all that are able to go forth to war in Israel'
  - where: 'note 3:15 “Why the Levites were counted from a month old”'
    claim: 'Chapter 4 counts the Levites from thirty to fifty for the work'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/4?lang=eng'
    quote: 'From thirty years old and upward even until fifty years old, all that enter into the host, to do the work in the tabernacle of the congregation.'
  - where: 'note 3:15 “Why the Levites were counted from a month old”'
    claim: 'The law redeems a firstborn from a month old'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/18?lang=eng'
    quote: 'And those that are to be redeemed from a month old shalt thou redeem, according to thine estimation, for the money of five shekels'
  - where: 'note 3:31 “Kohath and the most holy things”'
    claim: 'Moses and Aaron were sons of Amram, a grandson of Levi through Kohath'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'Moses and Aaron were sons of Amram, a grandson of Levi through Kohath (see Numbers 3:19; Exodus 6:18, 20).'
  - where: 'note 3:31 “Kohath and the most holy things”'
    claim: 'The Kohathites alone had to carry their burden by hand'
    key: ot-manual-numbers-1-12
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-1-12-wilderness-wanderings-part-1?lang=eng'
    quote: 'They were the only Levites whose burden (the tabernacle furniture) was so important that they were required to carry it by hand (see Numbers 7:9).'
  - where: 'note 3:31 “Kohath and the most holy things”'
    claim: 'One older reading: "the hanging" is the veil; Kohath carried the holy things after the priests had covered them'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/3.htm'
    quote: 'and the curtain (the veil before the most holy place), and to perform whatever had to be done ("all the service thereof," see at Numbers 3:26), i.e., to carry the said holy things after they had been rolled up in covers by the priests (see Numbers 4:5.).'
  - where: 'note 3:31 “Kohath and the most holy things”'
    claim: 'The Kohathites might not touch the holy things'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/4?lang=eng'
    quote: 'the sons of Kohath shall come to bear it: but they shall not touch any holy thing, lest they die.'
  - where: 'note 3:31 “Kohath and the most holy things”'
    claim: 'Kohath received no wagons and bore its charge on the shoulders'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/7?lang=eng'
    quote: 'But unto the sons of Kohath he gave none: because the service of the sanctuary belonging unto them was that they should bear upon their shoulders.'
  - where: 'note 3:39 “Twenty-two thousand, or twenty-two thousand three hundred?”'
    claim: 'The clan totals make 22,300 against 22,000; Kohath''s 8,600 should probably be 8,300, the Hebrew words differing'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/3.htm'
    quote: '28. eight thousand and six hundred] This should probably be read eight thousand and three hundred (שלש for שש); Numbers 3:39, and a comparison of Numbers 3:43 with Numbers 3:46, shew that the Levites numbered 22,000'
  - where: 'note 3:39 “Twenty-two thousand, or twenty-two thousand three hundred?”'
    claim: 'Another older reading: the total is correct and a copyist erred in one family''s number'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/3.htm'
    quote: 'But the total is correct; for, according to Numbers 3:46, the number of the first-born, 22,273, exceeded the total number of the Levites by 273. … We must rather assume that there is a copyist''s error in the number of one of the Levitical families'
  - where: 'note 3:39 “Twenty-two thousand, or twenty-two thousand three hundred?”'
    claim: 'The Hebrew of verse 28 reads "six" hundred'
    key: oshb-wlc
    url: 'https://raw.githubusercontent.com/openscriptures/morphhb/master/wlc/Num.xml'
    quote: 'שְׁמֹנַ֤ת אֲלָפִים֙ וְ/שֵׁ֣שׁ מֵא֔וֹת'
  - where: 'note 3:43 “So few firstborn?”'
    claim: 'One older reading states the difficulty: 22,273 firstborn bear no proportion to the men of war'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/1.htm'
    quote: 'the number of all the male first-born of the twelve tribes, which was only 22,273 according to the census taken for the purpose of their redemption by the Levites (Numbers 3:43), bore no kind of proportion to the total number of men capable of bearing arms'
  - where: 'note 3:43 “So few firstborn?”'
    claim: 'The same reading: the law was meant chiefly for the future'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/1.htm'
    quote: 'that the law was intended chiefly for the future'
  - where: 'note 3:43 “So few firstborn?”'
    claim: 'The same reading: the 22,273 were those born between the Exodus and the census thirteen months later'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/1.htm'
    quote: 'consisted only of the first-born sons who had been born between the time of the exodus from Egypt and the numbering of the twelve tribes, which took place thirteen months afterwards.'
  - where: 'note 3:43 “So few firstborn?”'
    claim: 'On that reading some 19,000 firstborn a year might be expected'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/1.htm'
    quote: 'there would be from 19,000 to 19,500 marriages contracted upon an average every year; and in a nation which had grown up in a land so celebrated as Egypt was in antiquity for the extraordinary fruitfulness of its inhabitants, almost as many first-born, say at least 19,000, might be expected'
  - where: 'note 3:47 “Five shekels for each of the 273”'
    claim: 'President John Taylor: the Lord claimed those He saved and demanded their service; the balance was redeemed with money given to Aaron'
    key: taylor-mediation
    url: 'https://www.gutenberg.org/ebooks/36327.txt.utf-8'
    quote: 'Hence the Lord claimed those that He saved as righteously belonging to Him, and claiming them as His He demanded their services; … the balance had to be redeemed with money, which was given to Aaron, as the great High Priest and representative of the Aaronic Priesthood'
  - where: 'note 3:47 “Five shekels for each of the 273”'
    claim: 'The same price became the rule for every firstborn son'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/18?lang=eng'
    quote: 'for the money of five shekels, after the shekel of the sanctuary, which is twenty gerahs.'
  - where: 'christ'
    claim: 'The commandment to dedicate firstborn sons can remind us of Jesus Christ, the firstborn, who came to do the Father''s will'
    key: scripture-helps-ex-7
    url: 'https://www.churchofjesuschrist.org/study/manual/scripture-helps-old-testament/13-exodus-7-13?lang=eng'
    quote: 'The commandment to dedicate firstborn sons to the Lord can remind us of Jesus Christ, who was the firstborn of all the spirit children of Heavenly Father.'
  - where: 'christ'
    claim: 'The faithful receive through Jesus Christ the inheritance of the firstborn and are members of the Church of the Firstborn'
    key: bd-firstborn
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/firstborn?lang=eng'
    quote: 'The faithful saints were made members of the Church of the Firstborn in eternity, since they receive through Jesus Christ the inheritance of the firstborn (D&C 93:21–22).'
  - where: 'christ'
    claim: 'D&C 93:22 on the church of the Firstborn'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/dc-testament/dc/93?lang=eng'
    quote: 'And all those who are begotten through me are partakers of the glory of the same, and are the church of the Firstborn.'
  - where: 'parallels'
    claim: 'The second census counts 23,000 Levites from a month old'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/26?lang=eng'
    quote: 'And those that were numbered of them were twenty and three thousand, all males from a month old and upward'
