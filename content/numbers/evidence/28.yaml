chapter: 28
claims:
  - where: 'setting'
    claim: 'The order of offerings comes after the new census and Joshua''s appointment, as Israel is readied for the conquest'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/28.htm'
    quote: 'When Israel was prepared for the conquest of the promised land by the fresh numbering and mustering of its men, and by the appointment of Joshua as commander, its relation to the Lord was regulated by a law which determined the sacrifices'
  - where: 'setting'
    claim: 'Chapters 28 and 29 gather the earlier sacrificial and festal laws of Exodus and Leviticus into one ordered whole'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/28.htm'
    quote: 'the sacrificial and festal laws already given in Exodus 23:14-17; Exodus 29:38-42; Exodus 31:12-17; Leviticus 23:1, and Numbers 25:1-12, were completed and arranged into a united and well-ordered whole'
  - where: 'setting'
    claim: 'Chapters 28–29 list the public offerings season by season, from the daily offering to the eighth day of Booths'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/28.htm'
    quote: 'The amounts of public offerings at the sacred seasons The following are the seasons for which offerings are enjoined:—(1) every morning and evening (Numbers 28:3-8), (2) the Sabbath (Numbers 28:9 f.), (3) the first day of each month'
  - where: 'setting'
    claim: 'The last part of Numbers is set on the plains of Moab, after the second census and Joshua''s investiture'
    key: pike-balaam
    url: 'https://rsc.byu.edu/creation-sinai/balaam-book-numbers'
    quote: 'A main focus of this third time period is the five to six months that the Israelites spent in the last main location, the plains of Moab.'
  - where: 'thread'
    claim: 'The daily offering is the base of the whole order; on feast days it is intensified, doubled on the Sabbath and enlarged with bullocks, rams and lambs on other feasts, with a sin offering'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/28.htm'
    quote: 'On the Sabbaths the daily sacrifice was doubled, by the presentation of a burnt-offering consisting of two lambs. On the other feast-days it was increased by a burnt-offering composed of oxen, rams, and yearling lambs, which was always preceded by a sin-offering.'
  - where: 'thread'
    claim: 'In the daily burnt offering Israel sanctified its life to the LORD, and on feast days expressed this more strongly'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/28.htm'
    quote: 'In the daily burnt-offering the congregation of Israel, as a congregation of Jehovah, was to sanctify its life, body, soul, and spirit, to the Lord its God; and on the Lord''s feast-days it was to give expression to this sanctification in an intensified form.'
  - where: 'thread'
    claim: 'The day of the firstfruits is the feast of weeks'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/28.htm'
    quote: 'The same number of sacrifices is appointed for the day of the first-fruits, i.e., for the feast of Weeks or Harvest feast (cf. Leviticus 23:15-22).'
  - where: 'note 28:6 “The daily offering under all the rest”'
    claim: 'The daily offering is repeated because it was offered on Sabbaths and feast days too, as the base of all the festal offerings'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/28.htm'
    quote: 'It is not merely for the sake of completeness that it is introduced here … but also for an internal reason, viz., that the daily sacrifice was also to be offered on the Sabbaths and feast-days, to accompany the general and special festal sacrifices, and to form the common substratum for the whole of these.'
  - where: 'note 28:6 “The daily offering under all the rest”'
    claim: 'The festal offerings of the seven days were offered each day after the morning sacrifice'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/28.htm'
    quote: 'This implies that the festal sacrifices commanded were to be prepared and offered every day after the morning sacrifice.'
  - where: 'note 28:6 “The daily offering under all the rest”'
    claim: 'At the yearly feasts the congregation offered three layers: the daily sacrifice, the general feast-day sacrifices, and those peculiar to each feast'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/28.htm'
    quote: 'so that, at the yearly feasts, the congregation had to offer their different kinds of sacrifices: (a) the daily morning and evening sacrifice; (b) the general sacrifices that were offered on every feast-day; and (c) the festal sacrifices that were peculiar to each particular feast.'
  - where: 'note 28:7 “Strong drink poured out for the LORD”'
    claim: 'Shekar means intoxicating or strong drink, forbidden to priests on duty, and at Num. 28:7 stands where 28:14 has wine'
    key: bdb
    url: 'https://biblehub.com/hebrew/7941.htm'
    quote: 'שֵׁכָר noun [masculine] intoxioating drink, strong drink … forbidden to priests on duty Leviticus 10:9 (P) … ׳נֶסֶךְ שׁ Numbers 28:7(P; for יַיִן Numbers 28:14)'
  - where: 'note 28:7 “Strong drink poured out for the LORD”'
    claim: 'Older reading: shekar here is strong drink as against water, and the drink offering was wine only'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/28.htm'
    quote: 'Shecar does not mean intoxicating drink here (see at Leviticus 10:9), but strong drink, in distinction from water as simple drink. The drink-offering consisted of wine only (see at Numbers 15:5.)'
  - where: 'note 28:7 “Strong drink poured out for the LORD”'
    claim: '“In the holy place” means around the altar, as Josephus paraphrases'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/28.htm'
    quote: '"In the sanctuary," i.e., περὶ τὸν βωμόν (round about the altar), as Josephus paraphrases it (Ant. iii. 10); not "with (in) holy vessels," as Jonathan and others interpret it.'
  - where: 'note 28:9 “Priests at work on the Sabbath”'
    claim: 'The Sabbath offering is appointed here for the first time, though the Sabbath itself was instituted earlier'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/28.htm'
    quote: 'is appointed here for the first time; whereas the sabbatical feast had already been instituted at Exodus 20:8-11 and Leviticus 23:3.'
  - where: 'note 28:9 “Priests at work on the Sabbath”'
    claim: 'On the Sabbaths the daily sacrifice was doubled'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/28.htm'
    quote: 'On the Sabbaths the daily sacrifice was doubled, by the presentation of a burnt-offering consisting of two lambs.'
  - where: 'note 28:9 “Priests at work on the Sabbath”'
    claim: 'Jesus cites the priests'' Sabbath work in the temple'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/matt/12?lang=eng'
    quote: 'Or have ye not read in the law, how that on the sabbath days the priests in the temple profane the sabbath, and are blameless?'
  - where: 'note 28:15 “A sin offering at every new moon”'
    claim: 'The law appointed special sacrifices at the new moon, and the feasts were reckoned by the moon'
    key: bd-new-moon
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/new-moon?lang=eng'
    quote: 'The law appointed that at the new moon special sacrifices should be offered (Num. 10:10; see also 1 Sam. 20:5–6, 29; 2 Kgs. 4:23; Amos 8:5). The prophets often speak of “new moons” along with “Sabbaths.” As the days for all Jewish feasts were reckoned by the moon, the exact time of the appearance of the new moon was of great importance.'
  - where: 'note 28:15 “A sin offering at every new moon”'
    claim: 'New moons had a festal sacrifice without being days of sabbatical rest and holy meeting'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/28.htm'
    quote: 'The custom of distinguishing the beginnings of the months of new moon''s days by a peculiar festal sacrifice, without their being, strictly speaking, festal days, with sabbatical rest and a holy meeting'
  - where: 'note 28:15 “A sin offering at every new moon”'
    claim: 'Older reading: the sin offering at the new moon expiated the sins of the past month left without expiation'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/28.htm'
    quote: 'for the whole month it was necessary that, in consideration of the sins that had been committed in the course of the past month, and had remained without expiation, a special sin-offering should be offered for their expiation'
  - where: 'note 28:15 “A sin offering at every new moon”'
    claim: 'In later times the new moon grew into a feast-day: trade stopped and people went to the prophets'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/28.htm'
    quote: 'In later times, however, the new moon grew more and more into a feast-day, trade was suspended (Amos 8:5), the pious Israelite sought instruction from the prophets (2 Kings 4:23)'
  - where: 'note 28:16 “The Passover, with nothing added”'
    claim: 'The Passover is mentioned but no offering is commanded for it'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/28.htm'
    quote: '(3) the first day of each month (Numbers 28:11-15) [the Passover is mentioned Numbers 28:16), but no offering is commanded]'
  - where: 'note 28:16 “The Passover, with nothing added”'
    claim: 'No general festal offering on the Passover day, the 14th; its offering is that of Exodus 12'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/28.htm'
    quote: 'whereas there was no general festal offering on the day of the Passover, or the 14th of the month (Exodus 12:3-14).'
  - where: 'note 28:16 “The Passover, with nothing added”'
    claim: 'Paul calls Christ our passover'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-cor/5?lang=eng'
    quote: 'Purge out therefore the old leaven, that ye may be a new lump, as ye are unleavened. For even Christ our passover is sacrificed for us:'
  - where: 'christ'
    claim: 'Hebrews contrasts the daily offerings with Christ''s one sacrifice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/heb/10?lang=eng'
    quote: 'And every priest standeth daily ministering and offering oftentimes the same sacrifices, which can never take away sins:'
  - where: 'christ'
    claim: 'Peter compares Christ''s blood to a lamb without blemish and without spot'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/nt/1-pet/1?lang=eng'
    quote: 'But with the precious blood of Christ, as of a lamb without blemish and without spot:'
  - where: 'christ'
    claim: 'Amulek: the whole meaning of the law points to the great and last sacrifice'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/alma/34?lang=eng'
    quote: 'And behold, this is the whole meaning of the law, every whit pointing to that great and last sacrifice; and that great and last sacrifice will be the Son of God, yea, infinite and eternal.'
  - where: 'christ'
    claim: 'The risen Lord ends burnt offerings and asks for a broken heart and contrite spirit'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'And ye shall offer for a sacrifice unto me a broken heart and a contrite spirit. And whoso cometh unto me with a broken heart and a contrite spirit, him will I baptize with fire and with the Holy Ghost'
  - where: 'christ'
    claim: 'Christ dies in our place as in the burnt offering, and His blood cleanses as in the sin offering'
    key: lane-whole-meaning
    url: 'https://rsc.byu.edu/gospel-jesus-christ-old-testament/whole-meaning-law'
    quote: 'All of these models can then be further connected with the role of Christ’s sacrifice. He dies in our place as in the burnt offering. His blood cleanses us to allow us to dwell in the presence of God as in the sin offering.'
  - where: 'christ'
    claim: 'The Lord ends the burnt offerings'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bofm/3-ne/9?lang=eng'
    quote: 'And ye shall offer up unto me no more the shedding of blood; yea, your sacrifices and your burnt offerings shall be done away'
