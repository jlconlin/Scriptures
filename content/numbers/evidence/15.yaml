chapter: 15
claims:
  - where: 'when'
    claim: 'The Sabbath-breaker is set "in the wilderness"; the text gives no date'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/15?lang=eng'
    quote: 'And they put him in ward, because it was not declared what should be done to him.'
  - where: 'when'
    claim: 'The occasion is the time of the forty years after the condemnation'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/15.htm'
    quote: 'all that can be gathered is, that the occurrence took place at the time when Israel was condemned to wander about in the wilderness for forty years.'
  - where: 'setting'
    claim: 'Chapter 14 sentenced the adults and promised the land to their little ones'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'But your little ones, which ye said should be a prey, them will I bring in, and they shall know the land which ye have despised.'
  - where: 'setting'
    claim: 'The Bible Dictionary groups 15:1–19:22 as various laws and historical notices, and 20–36 as the last year'
    key: bd-numbers
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/numbers?lang=eng'
    quote: '(3) 15:1–19:22, various laws and historical notices. (4) 20:1–36:13, the history of the last year in the wilderness'
  - where: 'setting'
    claim: 'The individual sin offering of Lev. 4–5 is repeated here'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/15.htm'
    quote: 'The law laid doon in Leviticus 5:6 (cf. Leviticus 4:27.) for the Israelites, is repeated here in Numbers 15:27, Numbers 15:28'
  - where: 'setting'
    claim: 'The Sabbath penalty had been given in Ex. 31:14–15'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/15.htm'
    quote: 'It is true that it had already been laid down in Exodus 31:14-15, and Exodus 35:2, that any breach of the law of the Sabbath should be punished by death'
  - where: 'setting'
    claim: 'Deuteronomy commands the fringes without giving a reason'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/15.htm'
    quote: 'This is commanded (with different words for ‘tassels’ and ‘garments’) in Deuteronomy 22:12. No statement is there made as to the reason for the observance.'
  - where: 'thread'
    claim: 'The Sabbath-breaker''s story illustrates sinning with a high hand'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/15.htm'
    quote: 'The History of the Sabbath-Breaker is no doubt inserted here as a practical illustration of sinning "with a high hand."'
  - where: 'thread'
    claim: 'The fringes appear to have been occasioned by the incident'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/15.htm'
    quote: 'The command to wear Tassels on the Edge of the Upper Garment appears to have been occasioned by the incident just described.'
  - where: 'thread'
    claim: 'The stranger is under the same law in offerings, sin offerings for error, and the penalty'
    key: belnap-outcasts
    url: 'https://rsc.byu.edu/vol-19-no-3-2018/lord-god-which-gathereth-outcasts'
    quote: 'This directive is repeated a few verses later regarding sin offerings for ignorant acts, while those who perform premeditated acts, either a natural Israelite or a stranger, receive the same penalty.'
  - where: 'section 2 plain'
    claim: '"Heave" is Hebrew "elevate", rendered "lifted up"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/15?lang=eng'
    quote: 'HEB elevate'
  - where: 'section 3 plain'
    claim: '"Kid of the goats" is a he-goat'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/15.htm'
    quote: 'and a he-goat for a sin offering.'
  - where: 'note 15:2 “A law for the land, given after the sentence”'
    claim: 'The laws are for worship in the land the LORD gives'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/15?lang=eng'
    quote: 'When ye be come into the land of your habitations, which I give unto you,'
  - where: 'note 15:2 “A law for the land, given after the sentence”'
    claim: 'Chapter 14 sentenced the adults to die in the wilderness'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/14?lang=eng'
    quote: 'But your little ones, which ye said should be a prey, them will I bring in, and they shall know the land which ye have despised.'
  - where: 'note 15:2 “A law for the land, given after the sentence”'
    claim: 'One older reading: the laws revive the hopes of the new generation during the time of judgment'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/15.htm'
    quote: 'For the purpose of reviving the hopes of the new generation that was growing up, and directing their minds to the promised land, during the mournful and barren time when judgment was being executed upon the race that had been condemned'
  - where: 'note 15:2 “A law for the land, given after the sentence”'
    claim: 'The Student Manual: the laws of sacrifice provided the way back to God''s favor'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'because in Israel’s state of rebellion they provided the way to come back into God’s favor.'
  - where: 'note 15:4 “Flour, oil and wine by the size of the animal”'
    claim: 'An ephah is about a bushel; a hin about a gallon and a half; amounts vary by the size of the animal'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/15.htm'
    quote: 'These are to accompany both private and public sacrifices, and are arranged according to a fixed scale as follows (ephah = c. 1 bushel; hin = c. 1½ gallon): … It will be seen that the amount in each case varies according to the size of the animal.'
  - where: 'note 15:4 “Flour, oil and wine by the size of the animal”'
    claim: 'A tenth deal for a lamb is a tenth of an ephah of fine flour'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/15.htm'
    quote: 'For a lamb (כּבשׂ, i.e., either sheep or goat, cf. Numbers 15:11), they were to take the tenth of an ephah of fine flour, mixed with the quarter of a hin of oil and the quarter of a hin of wine, as a drink-offering.'
  - where: 'note 15:4 “Flour, oil and wine by the size of the animal”'
    claim: 'The quantities correspond to the number of animals'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/15.htm'
    quote: 'therefore the number of the appointed quantities of meat and drink-offerings was to correspond to the number of sacrificial animals.'
  - where: 'note 15:4 “Flour, oil and wine by the size of the animal”'
    claim: 'Leviticus 2 regulates meal offerings without fixed amounts; offerings were the food of the worshipper''s table'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/15.htm'
    quote: 'Men offered to their God the same food which they enjoyed at their own table; … Leviticus 2 (P ) contains regulations for meal-offerings, without fixed amounts'
  - where: 'note 15:15 “One law for the stranger”'
    claim: 'The stranger is a non-Israelite resident in the land, given justice under the law'
    key: bd-stranger
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/stranger?lang=eng'
    quote: 'The word is frequently used to denote a man of non-Israelite birth, resident in the promised land with the permission of the Israelite authorities.'
  - where: 'note 15:15 “One law for the stranger”'
    claim: '"Whosoever be among you" is a resident without the status of a sojourner'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/15.htm'
    quote: 'This appears to mean one who is residing in the land but has not been granted the definite status of a gêr or ‘sojourner.’'
  - where: 'note 15:15 “One law for the stranger”'
    claim: 'A Latter-day Saint study: the equal law of the courts is applied here to temple worship and repeated for sin offerings and the penalty'
    key: belnap-outcasts
    url: 'https://rsc.byu.edu/vol-19-no-3-2018/lord-god-which-gathereth-outcasts'
    quote: 'The same language is used in those texts regarding cultic practice—that is, temple worship. … This directive is repeated a few verses later regarding sin offerings for ignorant acts, while those who perform premeditated acts, either a natural Israelite or a stranger, receive the same penalty.'
  - where: 'note 15:15 “One law for the stranger”'
    claim: 'The congregation''s atonement reaches the foreigners because the sin extended to the whole nation'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/15.htm'
    quote: 'As the sin extended to the whole nation, in which the foreigners were also included, the atonement was also to apply to the whole.'
  - where: 'note 15:20 “The first of the dough”'
    claim: 'The word rendered dough is obscure; elsewhere only Ezek. 44:30 and Neh. 10:37; R.V. margin coarse meal'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/15.htm'
    quote: 'But the meaning of ‘arîsôth (R.V. ‘dough,’ marg. ‘coarse meal’) is obscure. It occurs elsewhere only in Ezekiel 44:30, Nehemiah 10:37.'
  - where: 'note 15:20 “The first of the dough”'
    claim: '"The first" may be simply the first part, a small amount at each new supply'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/15.htm'
    quote: 'It may be simply ‘the first part,’ i.e. a small fixed amount, perhaps at the getting in of each fresh supply for the household.'
  - where: 'note 15:20 “The first of the dough”'
    claim: 'One older reading: firstfruits of the bread as well as of the grain; the cake went to the priests'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/15.htm'
    quote: 'to consecrate a gift of first-fruits to the Lord, not only of the grains of corn, but also of the bread made from the corn, … Like all the gifts of first-fruits, this cake also fell to the portion of the priests'
  - where: 'note 15:22 “When the whole people errs”'
    claim: 'One older reading: this law concerns sins of omission, unlike Lev. 4:13–21'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/15.htm'
    quote: 'Consequently, the allusion here is not to sins of commission, but to sins of omission, not following the law of God'
  - where: 'note 15:22 “When the whole people errs”'
    claim: 'The burnt offering added so that the separation from the Lord might be removed'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/15.htm'
    quote: 'a burnt-offering was to be added to the sin-offering, that the separation of the congregation from the Lord, which had arisen from the sin of omission, might be entirely removed.'
  - where: 'note 15:22 “When the whole people errs”'
    claim: 'Leviticus requires a young bullock as the congregation''s sin offering'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/lev/4?lang=eng'
    quote: 'When the sin, which they have sinned against it, is known, then the congregation shall offer a young bullock for the sin'
  - where: 'note 15:22 “When the whole people errs”'
    claim: 'Another older reading: possible instances of such errors'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/15.htm'
    quote: 'No detailed instances are given; but such errors might consist in some mistake or omission in ritual, or some miscarriage of justice discovered too late'
  - where: 'note 15:30 “With a high hand”'
    claim: 'A Latter-day Saint study gives "a high hand" from modern translations and reads the Sabbath-breaker against it'
    key: pike-sabbath-ot
    url: 'https://rsc.byu.edu/sacred-time/sabbath-old-testament'
    quote: 'sins committed “presumptuously” (KJV) or with “a high hand” (ESV, NRSV; vv. 30–31)'
  - where: 'note 15:30 “With a high hand”'
    claim: 'High hand means deliberate defiance; used of Israel''s bold departure from Egypt; "reproacheth" is revile, not only in speech'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/15.htm'
    quote: 'with an high hand] with deliberate defiance. In Numbers 33:3, Exodus 14:8 it is used of the bold defiance with which the Israelites marched out of Egypt.'
  - where: 'note 15:30 “With a high hand”'
    claim: '"Reproacheth" is revile; not necessarily in speech'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/15.htm'
    quote: 'Jehovah doth he revile. The emphatic position of ‘Jehovah’ lays stress on the enormity of the crime. The ‘reviling’ was not necessarily in speech; actions speak louder than words.'
  - where: 'note 15:30 “With a high hand”'
    claim: 'One older reading: raising the hand against Jehovah in open rebellion'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/15.htm'
    quote: 'i.e., so that he raised his hand, as it were, against Jehovah, or acted in open rebellion against Him'
  - where: 'note 15:30 “With a high hand”'
    claim: 'Exodus uses "with an high hand" of Israel leaving Egypt'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/14?lang=eng'
    quote: 'and the children of Israel went out with an high hand.'
  - where: 'note 15:30 “Cut off”'
    claim: 'The Student Manual: willful sinners excommunicated from the camp; sometimes death; cut off from God, spiritual death'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'That is, they were to be excommunicated from the camp of Israel (see v. 30). In some cases the sin also required the death penalty. … they will be cut off from God and not be counted part of His covenant people. They will suffer spiritual death.'
  - where: 'note 15:30 “Cut off”'
    claim: 'A Latter-day Saint study: removed from Israelite society and from the Lord''s favor'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'The punishment for those who fail to adhere to the book’s moral standards is being “cut off from among their people,” removed from Israelite society and from favor with the Lord.'
  - where: 'note 15:30 “Cut off”'
    claim: 'The Book of Mormon''s "cut off from my presence" traced to Lev. 22:3'
    key: ot-minute-lev
    url: 'https://scripturecentral.org/archive/books/book/old-testament-minute-leviticus'
    quote: 'Leviticus 22:3 = 2 Nephi 4:4: “shall be cut off from my presence”'
  - where: 'note 15:30 “Cut off”'
    claim: 'One older reading: death by divine agency, not by the community'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/9.htm'
    quote: '13. shall be cut off] He shall suffer death by divine agency, not by punishment inflicted at the hands of the community.'
  - where: 'note 15:30 “Cut off”'
    claim: 'Another older reading: he was to atone for it with his life'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/15.htm'
    quote: 'for he had despised the word of Jehovah, and broken His commandment, and was to atone for it with his life.'
  - where: 'note 15:30 “Cut off”'
    claim: '"His iniquity upon him": cut off with the sin unatoned'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/15.htm'
    quote: 'The sinner shall be ‘cut off’ (see on Numbers 9:13) with the burden of his sin still attaching to him, and unatoned for.'
  - where: 'note 15:32 “The man gathering sticks”'
    claim: 'The only Old Testament example of the death penalty for Sabbath violation; may have acted defiantly; the passage leaves most questions open'
    key: pike-sabbath-ot
    url: 'https://rsc.byu.edu/sacred-time/sabbath-old-testament'
    quote: 'The Old Testament contains only one example of capital punishment applied to Sabbath-day violation. … it may be that the stick gatherer was acting defiantly as well as publicly in violation of the Sabbath commandment.'
  - where: 'note 15:32 “The man gathering sticks”'
    claim: 'The passage does not answer most questions about the incident'
    key: pike-sabbath-ot
    url: 'https://rsc.byu.edu/sacred-time/sabbath-old-testament'
    quote: 'This concise passage in Numbers 15 asserts a penalty for the man’s actions, but it does not answer most questions about the incident or its outcome.'
  - where: 'note 15:32 “The man gathering sticks”'
    claim: 'Gathering wood, like gathering food and kindling fire, desecrated the Sabbath'
    key: pike-sabbath-ot
    url: 'https://rsc.byu.edu/sacred-time/sabbath-old-testament'
    quote: 'For example, gathering food (see Exodus 16:23–30), gathering wood (see Numbers 15:32–36), kindling fire (see Exodus 35:3), and engaging in commercial activities (see Nehemiah 10:31; 13:15–22) desecrated the Sabbath day.'
  - where: 'note 15:32 “The man gathering sticks”'
    claim: 'Pike: an object lesson early in a dispensation, like Ananias and Sapphira; such people can presumably repent in the spirit world'
    key: pike-sabbath-ot
    url: 'https://rsc.byu.edu/sacred-time/sabbath-old-testament'
    quote: 'this unnamed man became a life-and-death object lesson to the Israelites of the realities of covenanting with a holy being. … Such people can presumably repent in the spirit world, even though their mortal life was cut short through their disobedience.'
  - where: 'note 15:32 “The man gathering sticks”'
    claim: 'Pike: such object lessons come early in most dispensations, as Ananias and Sapphira'
    key: pike-sabbath-ot
    url: 'https://rsc.byu.edu/sacred-time/sabbath-old-testament'
    quote: 'It seems to me that the scriptures report such “object lessons” early in most, if not all, gospel dispensations. See, for example, the consequence received by Ananias and Sapphira in Acts 5'
  - where: 'note 15:32 “The man gathering sticks”'
    claim: 'One older reading: the mode of death had not been prescribed; held like the blasphemer of Lev. 24:12'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/15.htm'
    quote: 'They kept him in custody, like the blasphemer in Leviticus 24:12, because it had not yet been determined what was to be done to him. … but the mode had not yet been prescribed.'
  - where: 'note 15:32 “The man gathering sticks”'
    claim: 'Another older reading allows that they did not know what the punishment should be'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/15.htm'
    quote: 'If, however, the meaning is that they did not know what the man’s punishment should be, the present passage is independent of those in Exodus.'
  - where: 'note 15:32 “The man gathering sticks”'
    claim: 'The text: held because it was not declared what should be done'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/num/15?lang=eng'
    quote: 'And they put him in ward, because it was not declared what should be done to him.'
  - where: 'note 15:38 “Tassels with a cord of blue”'
    claim: 'tsitsit means tassel, on the flowing ends of garments'
    key: bdb
    url: 'https://biblehub.com/hebrew/6734.htm'
    quote: 'צִיצִת noun feminine tassel, lock … tassel on flowing ends (כַּנְפֵי) of garments'
  - where: 'note 15:38 “Tassels with a cord of blue”'
    claim: 'The tassels were on the corners of the upper garment, a four-cornered cloth over the body-coat'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/15.htm'
    quote: 'The Israelites were to wear ציצת, tassels, on the wings of their upper garments, or, according to Deuteronomy 22:12, at the four corners of the upper garment. … consisting of a four-cornered cloth or piece of stuff, which was thrown over the body-coat'
  - where: 'note 15:38 “Tassels with a cord of blue”'
    claim: 'The blue string fastened the tassel'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/15.htm'
    quote: '"And upon the tassel of the wing they shall put a string of hyacinth-blue," namely, to fasten the tassel to the edge of the garment.'
  - where: 'note 15:38 “Tassels with a cord of blue”'
    claim: 'tekelet is violet thread, used in tabernacle hangings and for cords of the high priest''s garments (Ex. 28:28, 31, 37) and here'
    key: bdb
    url: 'https://biblehub.com/hebrew/8504.htm'
    quote: 'violet, i.e. violet thread and stuff … loops or cords of ׳ת (alone) Exodus 26:4; Exodus 28:28,31,37; Exodus 36:11; Exodus 39:21,22,31; Numbers 15:38 (all P).'
  - where: 'note 15:38 “Tassels with a cord of blue”'
    claim: 'The blue lace held the plate on the mitre'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/ex/28?lang=eng'
    quote: 'And thou shalt put it on a blue lace, that it may be upon the mitre; upon the forefront of the mitre it shall be.'
  - where: 'note 15:38 “Tassels with a cord of blue”'
    claim: 'Wordplay between tsitsit and tsits, the high priest''s plate; the tassels as reminders that catch the eye'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/15.htm'
    quote: 'The point of this appears to lie in a play on the words ẓîẓîth (‘tassel’) and ẓîẓ1 [Note: Used in Exodus 28:36; Exodus 39:30, Leviticus 8:9 of the diadem (R.V. ‘plate’) on the high priest’s forehead.] … striking ornaments, which will constantly catch the wearer’s eye, and act as a religious reminder.'
  - where: 'note 15:38 “Tassels with a cord of blue”'
    claim: 'Deuteronomy has "four quarters of thy vesture"'
    key: lds-scriptures
    url: 'https://www.churchofjesuschrist.org/study/scriptures/ot/deut/22?lang=eng'
    quote: 'Thou shalt make thee fringes upon the four quarters of thy vesture, wherewith thou coverest thyself.'
  - where: 'note 15:38 “Tassels with a cord of blue”'
    claim: 'Fringes on clothing symbolize being clothed with the commandments'
    key: ot-manual-numbers-13-36
    url: 'https://www.churchofjesuschrist.org/study/manual/old-testament-student-manual-genesis-2-samuel/numbers-13-36-wilderness-wanderings-part-2?lang=eng'
    quote: 'To put fringes on an article of clothing symbolized that an individual is clothed, or covered, with the commandments of God.'
  - where: 'note 15:38 “Tassels with a cord of blue”'
    claim: 'The Pharisees made them large; Matt. 23:5 "borders"'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/15.htm'
    quote: 'Matthew 23:5, "borders." The size of these tassels is not prescribed. The Pharisees liked to make them large, to exhibit openly their punctilious fulfilment of the law.'
  - where: 'note 15:39 “Seek not after your own heart”'
    claim: 'tur means spy out, explore in Num. 13–14; figuratively "go about" in 15:39'
    key: bdb
    url: 'https://biblehub.com/hebrew/8446.htm'
    quote: '2 spy out, explore, accusative of land Numbers 13:2,16,17,21,23,32 (twice in verse); Numbers 14:7,34,36,38 … 3 go about, figurative אַהֲרִי לְבַבְכֶם Numbers 15:39 (P)'
  - where: 'note 15:39 “Seek not after your own heart”'
    claim: 'The verb in 15:39 is tur'
    key: oshb-wlc
    url: 'https://biblehub.com/hebrew/8446.htm'
    quote: 'Strong''s Hebrew: 8446. תּוּר (tur) -- To explore, to spy out, to seek, to search'
  - where: 'note 15:39 “Seek not after your own heart”'
    claim: 'A modern translation''s footnote: Hebrew to spy out'
    key: esv
    url: 'https://www.biblegateway.com/passage/?search=Numbers+15&version=ESV'
    quote: 'Numbers 15:39 Hebrew to spy out'
  - where: 'note 15:39 “Seek not after your own heart”'
    claim: 'One older reading: not to direct heart and eyes to the world, which leads to idolatry'
    key: keil-numbers
    url: 'https://biblehub.com/commentaries/kad/numbers/15.htm'
    quote: 'that they might have them constantly before their eyes and follow them, and not direct their heart and eyes to the things of this world, which turn away from the word of God, and lead astray to idolatry'
  - where: 'note 15:39 “Seek not after your own heart”'
    claim: 'Another older reading calls the sentence obscure'
    key: cambridge-numbers
    url: 'https://biblehub.com/commentaries/cambridge/numbers/15.htm'
    quote: 'It is an obscure sentence, and perhaps something has been lost from the text.'
  - where: 'christ'
    claim: 'Jehovah is the premortal Jesus Christ'
    key: bd-jehovah
    url: 'https://www.churchofjesuschrist.org/study/scriptures/bd/jehovah?lang=eng'
    quote: 'Jehovah is the premortal Jesus Christ and came to earth being born of Mary'
  - where: 'christ'
    claim: 'KnoWhy #479 sets the sin offering for ignorance of Num. 15:27–29 in its account of atonement for unknown sins'
    key: sc-knowhy-479
